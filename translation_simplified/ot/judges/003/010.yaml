translation:
  language: en
  text: Yahweh’s Spirit came upon him,[a] and he served as Israel’s judge. He went out to battle, and Yahweh gave Cushan-rishathaim, king of Aram,[b] into his power. He overpowered Cushan-rishathaim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Yahweh’s Spirit was upon him.” The wording may describe either the Spirit coming upon him or being upon him, though the story favors “came upon him.”
    reason: lexical_alternative
  - marker: b
    text: Aram is the Hebrew place-name often called Syria in older English translations.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: The Spirit of Yahweh came upon him
  simplified_phrase: Yahweh’s Spirit came upon him
  preserved_meaning: Yahweh’s Spirit came upon Othniel to empower him.
  reasoning_layer_used: Lexical and theological decisions on the divine Spirit phrase
  rationale: The possessive form is natural English while retaining Yahweh’s name and the Spirit’s divine identity.
- pob_phrase: he judged Israel
  simplified_phrase: he served as Israel’s judge
  preserved_meaning: Othniel carried out the governing and delivering role called judging in the book.
  reasoning_layer_used: Lexical decision for שׁפט in Judges
  rationale: This keeps the book’s term “judge” while clarifying that it describes his role.
- pob_phrase: Yahweh gave Cushan-rishathaim king of Aram into his hand, and his hand prevailed over Cushan-rishathaim
  simplified_phrase: Yahweh gave Cushan-rishathaim, king of Aram, into his power. He overpowered Cushan-rishathaim.
  preserved_meaning: Yahweh gave Othniel power over the enemy king, and Othniel defeated him.
  reasoning_layer_used: Lexical decisions for נתן ביד and עזז יד על
  rationale: The wording states the meaning of both hand idioms plainly without introducing an unsupported plural image.
translation_notes:
  risk_flags:
  - risk: “Served as Israel’s judge” may sound like a courtroom role alone.
    mitigation: The following battle makes the judge’s leadership and deliverance role clear.
  - risk: Rendering both hand idioms by their sense removes the Hebrew metaphor.
    mitigation: “Into his power” and “overpowered” clearly preserve the source image’s force of control and dominance.
