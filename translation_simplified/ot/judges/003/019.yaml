translation:
  language: en
  text: But at the carved images[a] near Gilgal, Ehud turned around and went back. He said, “I have a secret message for you, king.” The king said, “Silence!” Then all the king’s attendants left.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “idols.” The Hebrew refers to carved images that were often used in worship.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: he himself turned back from the carved images that were near Gilgal
  simplified_phrase: at the carved images near Gilgal, Ehud turned around and went back
  preserved_meaning: Ehud reversed his course at the carved images located near Gilgal.
  reasoning_layer_used: The lexical decisions identify שָׁב as a reversal of movement and the location phrase as proximity to Gilgal.
  rationale: Naming Ehud and describing the movement directly makes the narrative easy to follow.
- pob_phrase: O king
  simplified_phrase: king
  preserved_meaning: Ehud addresses the king respectfully by his title.
  reasoning_layer_used: The lexical decision permits either “O king” or the simpler direct address “king.”
  rationale: Dropping archaic “O” keeps the formal title in natural modern English.
- pob_phrase: all who were standing by him went out from his presence
  simplified_phrase: all the king’s attendants left
  preserved_meaning: Everyone attending the king withdrew from him.
  reasoning_layer_used: The lexical decisions explain that those standing by him were court attendants who withdrew from attendance.
  rationale: The shorter wording expresses the court action without an opaque spatial idiom.
interpretive_expansions:
