  text: Then the Philistine rulers came to her and said, “Lure him, and find out what makes him so strong and how we can overpower him. Then we can tie him up and make him suffer. Each of us will give you eleven hundred pieces of silver.[a]”
  philosophy: optimal-equivalence
  footnotes:
