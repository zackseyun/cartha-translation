  text: Then Delilah took new ropes and tied him up with them. She shouted, “The Philistines are attacking you, Samson!” Someone was waiting in an inner room, ready to ambush him.[a] But he snapped the ropes off his arms as if they were thread.
  philosophy: optimal-equivalence
  footnotes:
