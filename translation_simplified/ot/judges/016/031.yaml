  preserved_meaning: His brothers and the whole paternal household came for him.
  reasoning_layer_used: Lexical decisions for אֶחָיו and כָּל בֵּית אָבִיהוּ
  rationale: Naming Samson and using “everyone” makes the participants immediately clear.
- pob_phrase: carried him away, brought him up
  simplified_phrase: carried his body away, brought it up
  preserved_meaning: They carried Samson’s body away and then moved it upward.
  reasoning_layer_used: Burial-context lexical decisions for וַיִּשְׂאוּ אֹתוֹ and וַיַּעֲלוּ
  rationale: The wording preserves both consecutive actions without adding a return sense.
- pob_phrase: in the tomb of Manoah his father
