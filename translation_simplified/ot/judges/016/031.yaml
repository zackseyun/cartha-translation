translation:
  language: en
  text: Then Samson’s brothers and everyone in his father’s household came down. They carried his body away, brought it up, and buried him in the tomb of his father, Manoah, between Zorah and Eshtaol. Samson judged Israel for twenty years.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Now Samson had judged Israel for twenty years.” The Hebrew may be a summary looking back on his life.
    reason: alternative_reading
