    mitigation: The main text retains “she shaved,” while the note preserves the uncertainty around the man’s summons.
  - risk: Readers may infer that the verse explicitly says the LORD withdrew Samson’s strength.
    mitigation: The text says only that his strength left him, following the POB theological decision.
