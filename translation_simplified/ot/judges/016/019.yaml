translation:
  language: en
  text: She got him to fall asleep on her knees.[a] Then she called for a man,[b] and she shaved off the seven locks of hair on his head.[c] She began to torment him, and his strength left him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “on her lap”; the Hebrew literally says “on her knees.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may mean that she called for a man already nearby or summoned one to come.
    reason: alternative_reading
  - marker: c
    text: Or “the seven braids of hair on his head.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: made him sleep
  simplified_phrase: got him to fall asleep
  preserved_meaning: Delilah caused Samson to sleep without specifying how.
  reasoning_layer_used: Lexical decision for the causative Hebrew verb.
  rationale: The new wording expresses causation in more natural everyday English.
- pob_phrase: the seven locks of his head
  simplified_phrase: the seven locks of hair on his head
  preserved_meaning: Seven distinct locks or braids of Samson’s hair were removed.
  reasoning_layer_used: Lexical decision for שֶׁבַע מַחְלְפוֹת רֹאשׁוֹ.
  rationale: Adding “hair” makes the image immediately clear while retaining “locks.”
- pob_phrase: to afflict him
  simplified_phrase: to torment him
  preserved_meaning: Delilah began subjecting Samson to suffering or harsh treatment.
  reasoning_layer_used: Lexical alternatives for לְעַנּוֹתוֹ.
  rationale: “Torment” is common English and preserves the force without specifying a method.
translation_notes:
  risk_flags:
