  text: When Delilah saw that he had told her everything he had been keeping secret, she sent word to summon the Philistine rulers. She said, “Come up here this time, because he has told her[a] everything he had been keeping secret.” The Philistine rulers came up to her, carrying the silver payment in their hands.
