translation:
  language: en
  text: Then Delilah said to Samson, “Please tell me what makes you so strong and how you could be tied up and made to suffer.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “tied up and overpowered.” The Hebrew verb can mean “afflict,” “humble,” or, in this context, “subdue.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: where your great strength lies
  simplified_phrase: what makes you so strong
  preserved_meaning: Delilah asks about the source of Samson’s extraordinary strength.
  reasoning_layer_used: POB lexical decision for בַּמֶּה and כֹּחֲךָ גָדוֹל
  rationale: The question is recast in direct, everyday English without implying that strength has a physical location.
- pob_phrase: how you could be bound
  simplified_phrase: how you could be tied up
  preserved_meaning: Delilah asks by what means Samson can be restrained.
  reasoning_layer_used: POB lexical decision for תֵאָסֵר
  rationale: “Tied up” expresses the concrete action more clearly than “bound.”
- pob_phrase: to afflict you
  simplified_phrase: and made to suffer
  preserved_meaning: The restraint would leave Samson open to affliction or mistreatment.
  reasoning_layer_used: POB lexical decision and footnote for לְעַנּוֹתֶךָ
  rationale: “Made to suffer” keeps the force of affliction in familiar language while the footnote preserves the contextual alternative.
