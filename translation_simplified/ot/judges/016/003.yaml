translation:
  language: en
  text: Samson lay there until midnight. At midnight he got up, seized both doors of the city gate and the two doorposts, and pulled them out, bar and all.[a] He put the whole load on his shoulders and carried it to the top of the hill facing Hebron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “tore them out, bar and all.” The Hebrew verb can describe pulling or uprooting something from its place.
    reason: lexical_alternative
