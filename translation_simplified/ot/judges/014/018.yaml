translation:
  language: en
  text: 'Before sunset on the seventh day, the men of the city said to him, “What is sweeter than honey? What is stronger than a lion?”


    He answered, “If you had not plowed with my heifer,[a] you would not have solved my riddle.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Samson calls his wife “my heifer.” He is accusing the men of using her to learn the answer.
    reason: cultural_note
