translation:
  language: en
  text: The Spirit of Yahweh rushed upon him with power. He went down to Ashkelon and killed thirty men from among the people there. He took their clothes as spoil[a] and gave them as the changes of clothes owed to those who had answered the riddle. His anger burned, and he went up to his father’s house.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or simply, “their clothes.” The Hebrew term may refer more specifically to clothes stripped from the slain and taken as spoil.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: struck down thirty men from among them
  simplified_phrase: killed thirty men from among the people there
  preserved_meaning: The violence was lethal, and the men came from the people of Ashkelon.
  reasoning_layer_used: POB lexical decision for וַיַּךְ מֵהֶם שְׁלֹשִׁים אִישׁ
  rationale: “Killed” states the contextual meaning directly while keeping the partitive force.
- pob_phrase: took their spoil garments
  simplified_phrase: took their clothes as spoil
  preserved_meaning: He took clothing from the slain men as plunder.
  reasoning_layer_used: POB lexical decision and doctrine-realignment revision for חֲלִיצוֹתָם
  rationale: The new wording explains the difficult phrase without losing its spoil setting.
- pob_phrase: those who had explained the riddle
  simplified_phrase: those who had answered the riddle
  preserved_meaning: The recipients were the men who made the riddle’s solution known.
  reasoning_layer_used: POB lexical decision for לְמַגִּידֵי הַחִידָה and immediate wager context
  rationale: “Answered” is the ordinary English expression for solving a riddle.
