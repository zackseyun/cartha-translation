translation:
  language: en
  text: On the seventh day, they told Samson’s wife, “Manipulate your husband into telling us the answer to the riddle. If you do not, we will set you and your father’s household on fire.[a] Did you invite us just to take what belongs to us?[b] Isn’t that so?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can mean either “your father’s household” or “your father’s house.”
    reason: lexical_alternative
  - marker: b
    text: Or “to leave us with nothing” or “to take possession of what is ours.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Entice your husband so that he may tell us
  simplified_phrase: Manipulate your husband into telling us
  preserved_meaning: She must use scheming influence to make her husband reveal the riddle’s answer.
  reasoning_layer_used: POB lexical decision for פַּתִּי and purpose-clause analysis
  rationale: “Manipulate” clearly conveys the coercive, scheming force identified in the POB rationale.
- pob_phrase: lest we burn you and your father’s household with fire
  simplified_phrase: If you do not, we will set you and your father’s household on fire
  preserved_meaning: They threaten to burn her and her father’s household if she fails.
  reasoning_layer_used: POB lexical decisions for פֶּן and בֵּית אָבִיךְ
  rationale: The conditional wording and natural fire idiom make the threat immediately clear.
- pob_phrase: Did you invite us to dispossess us?
  simplified_phrase: Did you invite us just to take what belongs to us?
  preserved_meaning: They accuse their hosts of inviting them in order to seize what is theirs.
  reasoning_layer_used: POB lexical decision for הֲלְיָרְשֵׁנוּ and grounding review
  rationale: “Take what belongs to us” explains dispossession without narrowing the loss to property alone.
