translation:
  language: en
  text: 'But his father and mother said to him, “Isn’t there a woman among your own relatives[a] or among all my people for you to marry, instead of marrying a woman from the uncircumcised Philistines?”


    Samson answered his father, “Get her for me, because she is right in my eyes.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “the daughters of your brothers,” but it likely means women from Samson’s wider family or people.
    reason: cultural_note
  - marker: b
    text: This may also mean “she is pleasing in my eyes” or “she seems right to me”; the wording echoes a recurring theme in Judges.
    reason: lexical_alternative
