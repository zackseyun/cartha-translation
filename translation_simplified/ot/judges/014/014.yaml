translation:
  language: en
  text: 'He said to them:


    “Food came out of the eater,

    and sweetness came out of the strong.”[a]


    For three days, they could not solve the riddle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “strong” can also mean “mighty” or “fierce.”
    reason: lexical_alternative
