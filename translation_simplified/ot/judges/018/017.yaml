translation:
  language: en
  text: The five men who had earlier gone to spy out the land went up to that place. They took the carved image, the ephod,[a] the household gods,[b] and the cast image.[c] Meanwhile, the priest stood at the gateway with the six hundred men, who were armed for battle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: An ephod was a distinctive object associated with Israelite worship; the Hebrew term has no simple English equivalent.
    reason: cultural_note
  - marker: b
    text: The Hebrew term is also transliterated “teraphim” and refers to household cult objects or household gods.
    reason: lexical_alternative
  - marker: c
    text: 'Traditional rendering: “the molten image.”'
    reason: lexical_alternative
