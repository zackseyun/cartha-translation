  simplified_phrase: After they had traveled some distance
  preserved_meaning: The Danites had moved away from Micah’s house before the pursuit began.
  reasoning_layer_used: POB lexical decision for הִרְחִיקוּ
  rationale: “Traveled” makes the narrative movement immediately clear.
- pob_phrase: the men who were in the houses near Micah’s house were called together
  simplified_phrase: the men in the nearby houses gathered together
  preserved_meaning: Men in neighboring houses assembled in response to the theft.
  reasoning_layer_used: POB lexical decisions for the proximity phrase and נִזְעֲקוּ
  rationale: The active wording removes a dense relative clause without claiming the men lived there.
- pob_phrase: and they overtook the sons of Dan
  simplified_phrase: They caught up with the sons of Dan.
  preserved_meaning: The pursuing men reached the departing Danite group.
  reasoning_layer_used: POB lexical decision for וַיַּדְבִּיקוּ
  rationale: A new sentence and “caught up with” express the action in ordinary English.
