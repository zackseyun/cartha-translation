translation:
  language: en
  text: After they had traveled some distance from Micah’s house, the men in the nearby houses gathered together[a]. They caught up with the sons of Dan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “raised the alarm.” The Hebrew can refer either to the alarm or to the gathering that followed.
    reason: lexical_alternative
