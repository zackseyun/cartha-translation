translation:
  language: en
  text: When you arrive, you will find people living in safety.[a] The land is spacious,[b] and God has given it into your hands. It is a place that lacks nothing found in the land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “people who are unsuspecting.” The Hebrew describes people who feel secure.
    reason: lexical_alternative
  - marker: b
    text: Literally, “broad of hands,” a Hebrew expression for a spacious land.
    reason: lexical_alternative
