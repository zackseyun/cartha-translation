translation:
  language: en
  text: Then the five men who had scouted the land of Laish spoke to their brothers. “Do you know that these houses contain an ephod,[a] household idols, a carved image, and a cast image? Now consider what you will do.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: An ephod was an object used in worship; its exact form here is uncertain.
    reason: cultural_note
simplification_decisions:
- pob_phrase: who had gone to spy out the land of Laish
  simplified_phrase: who had scouted the land of Laish
  preserved_meaning: The five men had already completed a mission to examine Laish’s territory.
  reasoning_layer_used: Lexical decision for הַהֹלְכִים לְרַגֵּל and narrative context
  rationale: “Scouted” states their prior mission in concise, common English.
- pob_phrase: answered and said to their brothers
  simplified_phrase: spoke to their brothers
  preserved_meaning: The men addressed the other male Danites in the narrative sequence.
  reasoning_layer_used: Lexical decision for וַיַּעֲנוּ and theological decision for אֲחֵיהֶם
  rationale: This removes a stiff speech formula while retaining the gendered kinship term.
- pob_phrase: So now, know what you will do
  simplified_phrase: Now consider what you will do
  preserved_meaning: They urge their brothers to deliberate about their next action without prescribing it.
  reasoning_layer_used: Lexical decisions for וְעַתָּה, דְּעוּ, and מַה תַּעֲשׂוּ
  rationale: “Consider” conveys deliberation without adding an unsupported demand for carefulness.
