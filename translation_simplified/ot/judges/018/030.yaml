translation:
  language: en
  text: Then the descendants of Dan set up the carved image for themselves. Jonathan son of Gershom, son of Moses,[a] and his sons served as priests for the tribe of Dan until the day of the land’s exile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew text reads “Moses.” In the Masoretic tradition, a suspended letter yields the traditional reading “Manasseh.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: the sons of Dan
  simplified_phrase: the descendants of Dan
  preserved_meaning: The people belonged to the family line and tribe of Dan.
  reasoning_layer_used: lexical decision for בְּנֵי דָן
  rationale: “Descendants” explains the Hebrew family expression without collapsing it into the later tribal title.
- pob_phrase: he and his sons were priests for the tribe of the Danites
  simplified_phrase: Jonathan ... and his sons served as priests for the tribe of Dan
  preserved_meaning: Jonathan and his sons held priestly roles on behalf of Dan’s tribe.
  reasoning_layer_used: lexical decisions for וּבָנָיו, כֹהֲנִים, and לְשֵׁבֶט הַדָּנִי
  rationale: Active wording removes awkward repetition while retaining both the priests and those they served.
- pob_phrase: until the day of the exile of the land
  simplified_phrase: until the day of the land’s exile
  preserved_meaning: Their priestly service continued until an unspecified exile involving the land.
  reasoning_layer_used: lexical decision for עַד יוֹם גְּלוֹת הָאָרֶץ
  rationale: The possessive wording is easier to read while preserving the source’s historical ambiguity.
translation_notes:
  risk_flags:
  - risk: Readers may assume that “Moses” is textually uncontested.
    mitigation: The footnote preserves the suspended-letter tradition that yields “Manasseh.”
  - risk: The phrase “the land’s exile” remains historically ambiguous.
    mitigation: The wording deliberately leaves the particular exile unidentified, as the POB reasoning requires.
