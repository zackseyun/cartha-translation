translation:
  language: en
  text: They named the city Dan, after their father Dan,[a] who was born to Israel. The city had previously been called Laish.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “father” can mean “ancestor,” not only an immediate parent.
