- pob_phrase: there was no king in Israel
  simplified_phrase: Israel had no king
  preserved_meaning: Israel lacked a king at that time, without implying whether monarchy was good or bad.
  reasoning_layer_used: theological decision
  rationale: The shorter wording preserves the narrator’s political observation without resolving its theological tension.
- pob_phrase: the tribe of the Danites was seeking for itself an inheritance to dwell in
  simplified_phrase: the tribe of Dan was looking for land where they could settle
  preserved_meaning: The Danite tribe was engaged in an ongoing search for territory in which to live.
  reasoning_layer_used: lexical decisions for שֵׁבֶט הַדָּנִי, מְבַקֶּשׁ, נַחֲלָה, and לָשֶׁבֶת
  rationale: Common wording and ordinary clause order make the continuing search and settlement purpose immediately clear.
- pob_phrase: no inheritance had fallen to it
  simplified_phrase: they had not yet received land allotted to them as their inheritance
  preserved_meaning: The tribe had not received its territorial allotment among Israel’s tribes.
  reasoning_layer_used: lexical decision for כִּי לֹא נָפְלָה לוֹ and בְּנַחֲלָה
  rationale: The rendering explains the allotment idiom while retaining the important inheritance concept.
interpretive_expansions:
