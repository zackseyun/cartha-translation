translation:
  language: en
  text: 'They told him, “Be quiet. Put your hand over your mouth and come with us. Be our father[a] and priest. Which is better for you: serving as priest for one man’s household, or serving as priest for a tribe and clan[b] in Israel?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “father” is a title for a social or religious leader, not a biological parent.
    reason: cultural_note
  - marker: b
    text: Or “family”; a clan was a kinship group within a tribe.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and come with us, and be to us a father and a priest
  simplified_phrase: and come with us. Be our father and priest.
  preserved_meaning: The invitation and the two distinct roles remain intact.
  reasoning_layer_used: POB lexical and theological decisions on לְאָב and כֹהֵן
  rationale: Two short sentences make the command easier to follow while retaining the title “father.”
- pob_phrase: to be priest to the house of one man
  simplified_phrase: serving as priest for one man’s household
  preserved_meaning: He would serve as priest to one man’s domestic household.
  reasoning_layer_used: POB lexical decision on לְבֵית אִישׁ אֶחָד
  rationale: “Household” clearly expresses the family-group sense of “house” in this context.
- pob_phrase: Is it better for you to be priest ... or to be priest
  simplified_phrase: 'Which is better for you: serving as priest ... or serving as priest'
  preserved_meaning: The speakers contrast the advantage of serving one household with serving a larger Israelite group.
  reasoning_layer_used: POB lexical decision on הֲטוֹב
  rationale: A direct either-or question is more natural in modern English.
