translation:
  language: en
  text: The people of Dan chose five capable men from their own clan. These men were from Zorah and Eshtaol. They sent them to scout the land and examine it carefully, telling them, “Go and examine the land.” The men came to the hill country of Ephraim, as far as Micah’s house.[a] They spent the night there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Micah’s house” may refer to his whole household compound.
    reason: cultural_note
simplification_decisions:
- pob_phrase: the sons of Dan
  simplified_phrase: the people of Dan
  preserved_meaning: The subject remains the tribal people descended from Dan.
  reasoning_layer_used: POB lexical decision and listed alternative
  rationale: This avoids suggesting that the men were Dan’s immediate sons.
- pob_phrase: sent five men from their clan, from among their whole number, valiant men
  simplified_phrase: chose five capable men from their own clan
  preserved_meaning: Five competent men were selected from within the Danite clan.
  reasoning_layer_used: POB lexical rationale and latest doctrine realignment
  rationale: This removes repetition while preserving selection, clan membership, and competence.
- pob_phrase: to spy out the land and to explore it
  simplified_phrase: to scout the land and examine it carefully
  preserved_meaning: The men were to conduct reconnaissance and make a careful investigation.
  reasoning_layer_used: POB lexical decisions for לְרַגֵּל and חקר
  rationale: The two distinct investigative actions remain clear in common English.
