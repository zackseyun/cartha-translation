translation:
  language: en
  text: The priest said to them, “Go in peace. Yahweh sees the journey you are taking.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says the journey is “before Yahweh,” meaning it is in his sight; this does not necessarily mean he approves it or promises success.
    reason: lexical_alternative
