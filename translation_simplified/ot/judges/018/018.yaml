translation:
  language: en
  text: The men entered Micah’s house. They took the carved image, the ephod,[a] the household idols, and the cast-metal image. Then the priest asked them, “What are you doing?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: An ephod was an object associated with worship; its exact form here is uncertain.
    reason: cultural_note
simplification_decisions:
- pob_phrase: These men went into Micah’s house and took
  simplified_phrase: The men entered Micah’s house. They took
  preserved_meaning: The same men entered the house and removed the listed objects.
  reasoning_layer_used: Lexical decisions for וְאֵלֶּה, בָּאוּ, and וַיִּקְחוּ
  rationale: Two direct sentences make the action easier to follow without changing its sequence.
- pob_phrase: the cast image
  simplified_phrase: the cast-metal image
  preserved_meaning: The image was made by casting metal.
  reasoning_layer_used: Lexical decision for הַמַּסֵּכָה
  rationale: Adding “metal” explains what “cast” means here.
- pob_phrase: Then the priest said to them
  simplified_phrase: Then the priest asked them
  preserved_meaning: The priest addressed the men with a direct question.
  reasoning_layer_used: Lexical decision for וַיֹּאמֶר אֲלֵיהֶם הַכֹּהֵן
  rationale: “Asked” is natural English before a quoted question.
