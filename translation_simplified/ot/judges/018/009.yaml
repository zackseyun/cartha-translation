translation:
  language: en
  text: They said, “Get up! Let us go against them. We have seen the land, and it is very good. Yet you remain silent. Do not be slow to go there, enter the land, and take possession of it.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Rise up, and let us go up against them
  simplified_phrase: Get up! Let us go against them.
  preserved_meaning: The speakers urgently call the Danites to act against the people of the land.
  reasoning_layer_used: POB text and applied revision
  rationale: “Get up” is natural modern English, while “go against them” preserves the chosen action without added detail.
- pob_phrase: behold, it is very good
  simplified_phrase: it is very good
  preserved_meaning: The scouts strongly affirm the land’s quality.
  reasoning_layer_used: POB text
  rationale: Removing “behold” makes the report natural without weakening “very good.”
- pob_phrase: do not be sluggish to go, to enter, to take possession of the land
  simplified_phrase: Do not be slow to go there, enter the land, and take possession of it.
  preserved_meaning: They must not delay but must travel to, enter, and possess the land.
  reasoning_layer_used: POB text and applied revision
  rationale: “Do not be slow” replaces uncommon wording while retaining all three stages of the command.
translation_notes:
  risk_flags:
  - risk: “Remain silent” may sound like a comment only about speech rather than failure to act.
    mitigation: The following command not to delay keeps the silence connected to inaction without resolving the image into a paraphrase.
