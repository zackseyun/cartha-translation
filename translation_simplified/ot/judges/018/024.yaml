translation:
  language: en
  text: He said, “You have taken my gods—the gods I made—and the priest. Then you left. What do I have left now? How can you ask me, ‘What is the matter with you?’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “my god” or “my divine images,” but the context favors “my gods.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: my gods that I made
  simplified_phrase: my gods—the gods I made
  preserved_meaning: Micah calls the man-made objects his gods, preserving the narrative irony.
  reasoning_layer_used: lexical and theological decisions
  rationale: The repeated noun makes the relationship clear without replacing “gods” with “idols.”
- pob_phrase: and the priest, and you have gone away
  simplified_phrase: and the priest. Then you left.
  preserved_meaning: The same people took both the gods and the priest and then departed.
  reasoning_layer_used: lexical decision and applied revision
  rationale: Two short sentences untangle the sequence while keeping “you” explicit.
- pob_phrase: So how can you say to me
  simplified_phrase: How can you ask me
  preserved_meaning: Micah indignantly challenges their question.
  reasoning_layer_used: lexical decision
  rationale: “Ask” naturally introduces the quoted question while retaining the confrontational force.
