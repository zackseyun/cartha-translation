translation:
  language: en
  text: The three hundred men took the people’s supplies in hand, along with their trumpets.[a] Gideon sent every other Israelite soldier back to his tent, but he kept the three hundred with him. Midian’s camp was below Gideon in the valley.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: These trumpets were horns used for signaling, possibly rams’ horns.
    reason: lexical_alternative
