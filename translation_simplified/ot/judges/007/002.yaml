translation:
  language: en
  text: Yahweh said to Gideon, “You have too many people with you for me to hand Midian over to them. Otherwise, Israel may boast against me and say, ‘My own hand saved me.’”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The people who are with you are too many
  simplified_phrase: You have too many people with you
  preserved_meaning: Gideon’s force is larger than Yahweh intends to use.
  reasoning_layer_used: Lexical decision for רַב הָעָם and אֲשֶׁר אִתָּךְ
  rationale: The direct wording is easier to follow while keeping the excessive number central.
- pob_phrase: for me to give Midian into their hand
  simplified_phrase: for me to hand Midian over to them
  preserved_meaning: Yahweh would place Midian under the control of Gideon’s people.
  reasoning_layer_used: Lexical decision for מִתִּתִּי and בְּיָדָם
  rationale: The common phrase “hand over” clearly conveys transfer into their power.
- pob_phrase: lest Israel boast against me
  simplified_phrase: Otherwise, Israel may boast against me
  preserved_meaning: Yahweh is preventing Israel from proudly claiming credit against him.
  reasoning_layer_used: Lexical decision for פֶּן and יִתְפָּאֵר עָלַי
  rationale: “Otherwise” expresses the warning in familiar modern English.
