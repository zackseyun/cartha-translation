  preserved_meaning: Yahweh commands Gideon to act immediately and enter the camp.
  reasoning_layer_used: POB lexical decisions for קוּם and רֵד
  rationale: “Get up” is clearer common English without weakening the command.
- pob_phrase: I have given it into your hand
