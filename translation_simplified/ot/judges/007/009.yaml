translation:
  language: en
  text: That night Yahweh said to him, “Get up and go down into the camp, because I have handed it over to you.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “given it into your hand,” a Hebrew image meaning placed it under your power.
