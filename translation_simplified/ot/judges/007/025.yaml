  text: They captured Oreb and Zeeb, the two princes of Midian.[a] They killed Oreb at the place called the Rock of Oreb and Zeeb at the place called the Winepress of Zeeb. Then they continued pursuing the Midianites. From across the Jordan, they brought the heads of Oreb and Zeeb to Gideon.[b]
