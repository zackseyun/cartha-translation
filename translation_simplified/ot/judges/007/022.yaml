  text: When the three hundred trumpets sounded,[a] Yahweh caused the men throughout the camp to turn their swords against one another.[b] The army fled as far as Beth-shittah, toward Zererah, as far as the edge of Abel-meholah, near Tabbath.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: These trumpets were horn-trumpets, often made from rams’ horns.
    reason: lexical_alternative
  - marker: b
    text: Or, “Yahweh set every man’s sword against his companion and against the whole camp.” The Hebrew can emphasize either attacks on others in the camp or panic spreading throughout it.
    reason: alternative_reading
