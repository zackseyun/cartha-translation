  preserved_meaning: The messengers went across the whole highland region of Ephraim.
  reasoning_layer_used: Lexical decision for בְּכָל הַר אֶפְרַיִם
  rationale: The possessive form is more natural while “all” preserves the full geographic scope.
- pob_phrase: Come down against Midian
  simplified_phrase: Come down to confront Midian
  preserved_meaning: The Ephraimites were to descend from the highlands for a military encounter with Midian.
  reasoning_layer_used: Lexical decisions for רְדוּ and לִקְרַאת מִדְיָן
  rationale: “Confront” clearly expresses the military encounter while retaining the downward movement.
- pob_phrase: every man of Ephraim was called out
