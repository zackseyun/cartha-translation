translation:
  language: en
  text: Gideon sent messengers throughout all Ephraim’s hill country. They said, “Come down to confront Midian. Seize the waters as far as Beth-barah and the Jordan.”[a] So the men of Ephraim were summoned, and they seized the waters as far as Beth-barah and the Jordan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The waters” may mean the watercourses or strategic river crossings.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb is difficult and can be read more literally as “cried out,” but the context supports “were summoned.”
    reason: alternative_reading
