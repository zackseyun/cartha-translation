translation:
  language: en
  text: When the men with me and I blow the ram’s horn, blow your horns too, all around the entire camp. Then say, “For Yahweh and for Gideon!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some traditional versions say, “The sword of the LORD and of Gideon,” following the wording in verse 20. The Hebrew here simply says, “For Yahweh and for Gideon.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: I and all who are with me
  simplified_phrase: the men with me and I
  preserved_meaning: Gideon and his accompanying men act together.
  reasoning_layer_used: lexical decision for אָנֹכִי וְכָל אֲשֶׁר אִתִּי
  rationale: The clearer wording identifies the group without the formal phrase “all who are with me.”
- pob_phrase: then you also must blow the horns
  simplified_phrase: blow your horns too
  preserved_meaning: The other groups must join in blowing their horns after Gideon’s group does.
  reasoning_layer_used: lexical decisions for תְקַעְתֶּם and גַּם אַתֶּם
  rationale: The direct command is natural English and keeps the force of “also.”
- pob_phrase: and say
  simplified_phrase: Then say
  preserved_meaning: The battle cry follows the blowing of the horns.
  reasoning_layer_used: lexical decision for וַאֲמַרְתֶּם and immediate clause sequence
  rationale: A new sentence makes the ordered actions easier to follow without changing “say” to “shout.”
translation_notes:
  risk_flags:
  - risk: Readers may know the expanded battle cry from Judges 7:20 and assume it belongs here.
    mitigation: The footnote preserves the traditional wording while stating this verse’s shorter Hebrew reading.
