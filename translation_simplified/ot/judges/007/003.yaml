translation:
  language: en
  text: Please announce to the people, “Anyone who is afraid and trembling should turn back and leave Mount Gilead.”[a][b] So 22,000 of the people left, and 10,000 remained.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “leave” is uncommon and debated; it may suggest leaving early or slipping away.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew plainly says “Mount Gilead,” though the location is difficult here; it may refer more broadly to the hill country of Gilead.
    reason: cultural_note
simplification_decisions:
- pob_phrase: proclaim in the hearing of the people, saying
  simplified_phrase: announce to the people
  preserved_meaning: A public announcement is made for everyone present to hear.
  reasoning_layer_used: Lexical decisions for קְרָא נָא and בְּאָזְנֵי הָעָם
  rationale: The simpler wording preserves the formal public command without the Hebrew-style announcement formula.
- pob_phrase: let him return and depart
  simplified_phrase: should turn back and leave
  preserved_meaning: Those overcome by fear are directed to withdraw from the assembled force.
  reasoning_layer_used: Lexical decisions for יָשֹׁב and וְיִצְפֹּר
  rationale: “Should turn back” expresses the directive force, while “leave” keeps the debated verb general.
- pob_phrase: twenty-two thousand of the people returned
  simplified_phrase: 22,000 of the people left
  preserved_meaning: Twenty-two thousand withdrew in response to the announcement.
  reasoning_layer_used: Lexical decision for וַיָּשָׁב מִן הָעָם and narrative context
  rationale: “Left” avoids awkward repetition after “turn back” while retaining the stated result.
translation_notes:
  risk_flags:
