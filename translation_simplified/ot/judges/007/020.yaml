translation:
  language: en
  text: All three groups sounded their trumpets and smashed the jars. Each man held a torch in his left hand and a trumpet in his right hand to sound it. They shouted, “A sword for Yahweh and for Gideon!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “The sword of Yahweh and of Gideon!”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the three companies
  simplified_phrase: all three groups
  preserved_meaning: Gideon’s three organized groups acted together.
  reasoning_layer_used: lexical decision and Judges 7:16 context
  rationale: “Groups” is clearer than the military term “companies” for common readers.
- pob_phrase: They held the torches in their left hands and the trumpets in their right hands to blow
  simplified_phrase: Each man held a torch in his left hand and a trumpet in his right hand to sound it
  preserved_meaning: Every man held one item in each hand for the purpose of sounding the trumpet.
  reasoning_layer_used: lexical decisions on distributive hands and the purpose infinitive
  rationale: The singular wording clarifies each man’s action while retaining the stated purpose.
- pob_phrase: blew the trumpets and shattered the jars
  simplified_phrase: sounded their trumpets and smashed the jars
  preserved_meaning: They forcefully sounded the signaling instruments and broke the jars.
  reasoning_layer_used: lexical decisions for trumpets and jars
  rationale: “Sounded” and “smashed” make both deliberate actions immediately clear.
translation_notes:
  risk_flags:
