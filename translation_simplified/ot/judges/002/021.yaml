translation:
  language: en
  text: So I too will stop driving nations out of Israel’s presence—not even one of those Joshua left behind when he died.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be rendered, “Joshua left behind, and then died.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I also will no longer continue to drive out
  simplified_phrase: So I too will stop driving
  preserved_meaning: God will cease the action he had been carrying out.
  reasoning_layer_used: Lexical decisions for גַּם אֲנִי and לֹא אוֹסִיף
  rationale: “Stop driving” expresses the end of an ongoing action in direct, natural English.
- pob_phrase: any of the nations
  simplified_phrase: nations—not even one of those
  preserved_meaning: God will not drive out a single remaining nation.
  reasoning_layer_used: Lexical decisions for אִישׁ and מִן הַגּוֹיִם
  rationale: The added phrase “not even one” makes the distributive emphasis immediately clear.
- pob_phrase: that Joshua left
  simplified_phrase: those Joshua left behind
  preserved_meaning: These are the nations that remained after Joshua’s lifetime.
  reasoning_layer_used: Lexical decision for אֲשֶׁר עָזַב יְהוֹשֻׁעַ
  rationale: “Left behind” clearly identifies the nations that remained.
