translation:
  language: en
  text: The people of Israel did what Yahweh saw as evil. They served the Baals.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “worshiped the Baals.” Here “served” refers to devotion given to them as gods.
    reason: lexical_alternative
  - marker: b
    text: “The Baals” refers to the various local forms of the Canaanite god Baal.
    reason: cultural_note
simplification_decisions:
- pob_phrase: the sons of Israel
  simplified_phrase: the people of Israel
  preserved_meaning: The phrase identifies the Israelites collectively.
  reasoning_layer_used: POB lexical decision and listed idiomatic alternative
  rationale: The collective wording is immediately clear without changing who is meant.
- pob_phrase: did what was evil in the sight of Yahweh
  simplified_phrase: did what Yahweh saw as evil
  preserved_meaning: Yahweh himself judged their conduct to be evil.
  reasoning_layer_used: POB lexical rationale for the Hebrew sight idiom
  rationale: The recast clause uses ordinary English while preserving the image of divine sight.
- pob_phrase: and they served the Baals
  simplified_phrase: They served the Baals.
  preserved_meaning: Israel gave idolatrous service to the multiple Baals.
  reasoning_layer_used: POB lexical and theological decisions on עבד and the Hebrew plural
  rationale: A new sentence improves readability while retaining “served” and the plural “Baals.”
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “served” as ordinary work rather than religious devotion.
    mitigation: Footnote a gives “worshiped” as the contextual alternative.
  - risk: Readers may not know why “Baals” is plural.
    mitigation: Footnote b briefly explains the local forms of Baal.
