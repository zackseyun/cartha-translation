translation:
  language: en
  text: Then Yahweh’s anger burned against Israel. He handed them over to raiders, who plundered them. He sold them into the power of enemies all around them, and they could no longer stand against their enemies.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: he gave them into the hand of plunderers
  simplified_phrase: He handed them over to raiders
  preserved_meaning: Yahweh delivered Israel into the power of people who would plunder them.
  reasoning_layer_used: POB lexical decision for וַיִּתְּנֵם בְּיַד and שֹׁסִים
  rationale: The wording replaces the Hebrew hand idiom and the less common noun while preserving forced subjection and attack.
- pob_phrase: He sold them into the hand of their enemies all around
  simplified_phrase: He sold them into the power of enemies all around them
  preserved_meaning: Yahweh subjected Israel to surrounding enemies while retaining the severe image of selling them.
  reasoning_layer_used: POB lexical decisions for וַיִּמְכְּרֵם, בְּיַד, and אֹיְבֵיהֶם מִסָּבִיב
  rationale: “Into the power of” explains the idiom, while “sold” preserves the source text’s concrete judgment image.
- pob_phrase: they could no longer stand before their enemies
  simplified_phrase: they could no longer stand against their enemies
  preserved_meaning: Israel could no longer hold its ground against its opponents.
  reasoning_layer_used: POB lexical decision for וְלֹא יָכְלוּ עוֹד לַעֲמֹד לִפְנֵי
  rationale: “Stand against” states the military sense in ordinary English without weakening Israel’s defeat.
translation_notes:
  risk_flags:
  - risk: “Sold” could be read as a literal commercial transaction.
    mitigation: The phrase “into the power of enemies” makes the image’s meaning clear while retaining its force.
