translation:
  language: en
  text: The people served Yahweh throughout Joshua’s lifetime. They continued to serve him as long as the elders who outlived Joshua were alive. These elders had seen all the great things Yahweh had done for Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew describes these great things collectively as Yahweh’s “great work”; it can also mean his “great deed” or “great act.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: all the days of Joshua
  simplified_phrase: throughout Joshua’s lifetime
  preserved_meaning: The people served Yahweh for the full duration of Joshua’s life.
  reasoning_layer_used: Lexical decision for כֹּל יְמֵי
  rationale: The modern time expression makes the full duration immediately clear.
- pob_phrase: all the days of the elders who lived on after Joshua
  simplified_phrase: as long as the elders who outlived Joshua were alive
  preserved_meaning: Their service continued while the elders who survived Joshua remained alive.
  reasoning_layer_used: Lexical decisions for הַזְּקֵנִים and הֶאֱרִיכוּ יָמִים אַחֲרֵי
  rationale: This recasts the Hebrew time idiom in ordinary English while retaining the elders’ role.
- pob_phrase: all the great work of Yahweh that he had done for Israel
  simplified_phrase: all the great things Yahweh had done for Israel
  preserved_meaning: The elders had witnessed the whole body of Yahweh’s great acts on Israel’s behalf.
  reasoning_layer_used: Lexical decisions for מַעֲשֵׂה, הַגָּדוֹל, and עָשָׂה לְיִשְׂרָאֵל
  rationale: The plural English expression naturally conveys the Hebrew singular collective sense.
