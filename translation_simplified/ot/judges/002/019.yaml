translation:
  language: en
  text: When the judge died, the people turned back and became even more corrupt than their ancestors. They followed other gods, serving them and bowing down to them. They did not let go of any of their practices or their stubborn way of life.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: they turned back and acted more corruptly than their fathers
  simplified_phrase: the people turned back and became even more corrupt than their ancestors
  preserved_meaning: Israel relapsed and behaved worse than earlier generations.
  reasoning_layer_used: lexical decisions for יָשֻׁבוּ, וְהִשְׁחִיתוּ, and מֵאֲבוֹתָם
  rationale: “Ancestors” makes the generational comparison clear, while “turned back” preserves the relapse.
- pob_phrase: going after other gods to serve them and to bow down to them
  simplified_phrase: They followed other gods, serving them and bowing down to them.
  preserved_meaning: They transferred their allegiance to other gods through service and physical homage.
  reasoning_layer_used: lexical and theological decisions for לָלֶכֶת אַחֲרֵי, לְעָבְדָם, and וּלְהִשְׁתַּחֲוֹת לָהֶם
  rationale: A separate sentence clarifies the action while keeping service and bowing distinct.
- pob_phrase: They did not drop any of their deeds or their stubborn way.
  simplified_phrase: They did not let go of any of their practices or their stubborn way of life.
  preserved_meaning: They refused to abandon either their actions or their obstinate conduct.
  reasoning_layer_used: lexical decisions and doctrine-realignment revision for לֹא הִפִּילוּ and דַּרְכָּם הַקָּשָׁה
  rationale: “Let go” preserves the Hebrew image more naturally, and “way of life” explains the moral metaphor.
interpretive_expansions:
- pob_phrase: they
  rendering: the people
  claim: The pronoun refers to the Israelites described in the surrounding account.
  evidence:
