translation:
  language: en
  text: Whenever they went out,[a] Yahweh’s hand was against them, bringing them harm,[b] just as Yahweh had said and had sworn to them. They were in terrible distress.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Wherever they went.” This may especially refer to going out to battle or on a military campaign.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew means harm or disaster, not necessarily moral evil.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Wherever they went out
  simplified_phrase: Whenever they went out
  preserved_meaning: Yahweh opposed Israel in all their ventures without limiting the phrase only to battle.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: “Whenever” gives the broad recurring sense in natural English while the footnote preserves the alternatives.
- pob_phrase: the hand of Yahweh was against them for harm
  simplified_phrase: Yahweh’s hand was against them, bringing them harm
  preserved_meaning: Yahweh actively intervened against Israel and caused calamity rather than moral evil.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The wording keeps the Hebrew hand image but makes its harmful result easier to follow.
- pob_phrase: they were greatly distressed
  simplified_phrase: They were in terrible distress
  preserved_meaning: Israel experienced severe suffering under Yahweh’s judgment.
  reasoning_layer_used: POB lexical decision
  rationale: “Terrible distress” expresses the same intensity in familiar modern wording.
