translation:
  language: en
  text: Then the angel of Yahweh[b] went up from Gilgal to Bochim.[a] He said, “I brought you up out of Egypt and into the land I swore to give your fathers. I said, ‘I will never break my covenant with you.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bochim likely means “weepers” or refers to a place of weeping.
    reason: cultural_note
  - marker: b
    text: Or “the messenger of Yahweh”; the verse does not settle whether this figure is an angelic messenger or a manifestation of Yahweh.
    reason: lexical_alternative
