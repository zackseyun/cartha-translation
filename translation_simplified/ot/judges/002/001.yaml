- pob_phrase: Then the angel of Yahweh went up from Gilgal to Bochim and said
  simplified_phrase: Then the angel of Yahweh went up from Gilgal to Bochim. He said
  preserved_meaning: The same messenger travels from Gilgal to Bochim and then speaks.
  reasoning_layer_used: source syntax and POB theological decision
  rationale: Dividing the sentence makes the action sequence easier to follow without resolving the angel’s identity.
- pob_phrase: I brought you up from Egypt and brought you into the land
  simplified_phrase: I brought you up out of Egypt and into the land
  preserved_meaning: Yahweh delivered Israel from Egypt and brought them into the promised land.
  reasoning_layer_used: POB lexical decisions for עלה and בוא
  rationale: The compressed wording removes repetition while keeping both the upward image and the destination.
- pob_phrase: the land that I swore to your fathers
  simplified_phrase: the land I swore to give your fathers
  preserved_meaning: The land was the subject of Yahweh’s oath to Israel’s fathers.
  reasoning_layer_used: POB lexical rationale and covenant context
  rationale: Adding “to give” makes the English oath formula immediately understandable while retaining “fathers.”
