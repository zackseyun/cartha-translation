- pob_phrase: did not listen even to their judges
  simplified_phrase: would not listen even to their judges
  preserved_meaning: The people refused to heed the judges raised up in this period.
  reasoning_layer_used: POB lexical decision for שׁמע and שֹׁפְטֵיהֶם
  rationale: “Would not listen” naturally conveys failure to heed while retaining the historical title “judges.”
- pob_phrase: prostituted themselves after other gods
  simplified_phrase: acted like prostitutes by chasing after other gods
  preserved_meaning: Their idolatry was covenant betrayal pictured as sexual unfaithfulness and pursuit.
  reasoning_layer_used: POB lexical and theological decisions for זָנוּ אַחֲרֵי
  rationale: The rewrite explains the pursuit idiom without weakening the sexual-infidelity metaphor.
- pob_phrase: the way in which their fathers had walked in obeying the commandments of Yahweh; they did not do so
  simplified_phrase: the path their fathers had followed—the path of obeying Yahweh’s commands. They did not follow their fathers’ example.
  preserved_meaning: They quickly abandoned their fathers’ obedient pattern of life.
  reasoning_layer_used: POB lexical decisions for דֶּרֶךְ, הלך, and לֹא עָשׂוּ כֵן
  rationale: Two direct sentences preserve the path image and clearly identify what they failed to do.
