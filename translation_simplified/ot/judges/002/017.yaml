translation:
  language: en
  text: Yet they would not listen even to their judges[a], because they acted like prostitutes by chasing after other gods[b] and bowed down to them in worship. They quickly left the path their fathers had followed—the path of obeying Yahweh’s commands. They did not follow their fathers’ example.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: These judges were Israel’s leaders during this period, not merely courtroom officials.
    reason: cultural_note
  - marker: b
    text: The Hebrew uses sexual unfaithfulness as an image for abandoning Yahweh to worship other gods.
    reason: lexical_alternative
