translation:
  language: en
  text: Then Joshua sent the people away. The sons of Israel[a] each went to the land allotted as his inheritance, to take possession of it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, the Israelites as a whole; the Hebrew expression is literally “the sons of Israel.”
    reason: lexical_alternative
