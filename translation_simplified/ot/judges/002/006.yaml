- pob_phrase: and the sons of Israel went, each man to his inheritance
  simplified_phrase: The sons of Israel each went to the land allotted as his inheritance
  preserved_meaning: The corporate designation, individual distribution, and destination in each allotted inheritance remain distinct.
  reasoning_layer_used: POB lexical and theological decisions on בְנֵי יִשְׂרָאֵל, אִישׁ, and לְנַחֲלָתוֹ
  rationale: The reordered clause is natural English while retaining the gendered designation and each man’s destination.
- pob_phrase: to take possession of the land
  simplified_phrase: to take possession of it
  preserved_meaning: Taking possession remains the purpose of going, with “it” referring to the allotted land.
  reasoning_layer_used: POB lexical decisions on לָרֶשֶׁת and הָאָרֶץ
  rationale: The pronoun avoids repetition without merging the destination and purpose.
- pob_phrase: Then Joshua sent the people away, and
  simplified_phrase: Then Joshua sent the people away.
  preserved_meaning: Joshua dismisses the people before they go to their inheritances.
  reasoning_layer_used: POB revision pass and lexical decision on וַיְשַׁלַּח
  rationale: A sentence break makes the sequence easier to follow while preserving “Then” and “sent away.”
