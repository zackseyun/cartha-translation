translation:
  language: en
  text: Each time Yahweh raised up a judge for the Israelites, Yahweh was with that judge. He saved the people from the hand of their enemies as long as the judge lived. Yahweh was moved to pity[a] by their groaning because of those who oppressed them and pressed them hard.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Yahweh relented” or “Yahweh had compassion”; the Hebrew can describe a change of disposition or a compassionate response.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Whenever Yahweh raised up judges for them
  simplified_phrase: Each time Yahweh raised up a judge for the Israelites
  preserved_meaning: Yahweh repeatedly took the initiative to provide judges for Israel.
  reasoning_layer_used: Lexical decision for וְכִי and narrative context
  rationale: The distributive singular makes the repeated pattern and the pronoun’s referent immediately clear.
- pob_phrase: all the days of the judge
  simplified_phrase: as long as the judge lived
  preserved_meaning: Yahweh’s rescue continued throughout that judge’s lifetime.
  reasoning_layer_used: Lexical alternatives and immediate context
  rationale: The natural time expression states what the Hebrew formula implies here.
- pob_phrase: those who oppressed and afflicted them
  simplified_phrase: those who oppressed them and pressed them hard
  preserved_meaning: Israel’s enemies both oppressed the people and subjected them to crushing pressure.
  reasoning_layer_used: Lexical decisions for לֹחֲצֵיהֶם and וְדֹחֲקֵיהֶם
  rationale: Two coordinated verbs preserve the distinct but closely related source images.
