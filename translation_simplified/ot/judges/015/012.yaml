- pob_phrase: bind you
  simplified_phrase: tie you up
  preserved_meaning: They intend to restrain Samson physically.
  reasoning_layer_used: POB translation and immediate context
  rationale: The common phrase states the action more directly.
- pob_phrase: hand you over into the hand of the Philistines
  simplified_phrase: put you in the Philistines’ hands
  preserved_meaning: They will surrender Samson to Philistine control while retaining the hand image.
  reasoning_layer_used: POB translation and applied revision
  rationale: This removes repetition but preserves the deliberately restored image of being in another’s hand.
- pob_phrase: you yourselves will not attack me
  simplified_phrase: you will not attack me yourselves
  preserved_meaning: Samson requires the men of Judah not to assault him personally.
  reasoning_layer_used: POB translation and applied revision
  rationale: Reordered emphasis sounds natural while keeping the contrast on the men themselves.
