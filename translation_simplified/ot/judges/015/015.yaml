simplification_decisions:
- pob_phrase: a fresh jawbone of a donkey
  simplified_phrase: a fresh donkey’s jawbone
  preserved_meaning: The weapon was a donkey’s jawbone that was fresh rather than dried out.
  reasoning_layer_used: POB lexical decisions for לְחִי חֲמוֹר and טְרִיָּה
  rationale: The possessive form is shorter and more natural while retaining the specific bone and its condition.
- pob_phrase: he reached out his hand and took it
  simplified_phrase: picked it up
  preserved_meaning: He reached for the jawbone and took it in hand.
  reasoning_layer_used: POB lexical decisions for וַיִּשְׁלַח יָדוֹ and וַיִּקָּחֶהָ
  rationale: The common phrase “picked it up” clearly expresses the physical action without the Hebrew-style clause sequence.
- pob_phrase: with it he struck down a thousand men
  simplified_phrase: used it to strike down a thousand men
  preserved_meaning: The jawbone was the weapon with which he defeated a thousand male combatants.
  reasoning_layer_used: POB lexical decisions for וַיַּךְ בָּהּ and אֶלֶף אִישׁ
  rationale: This wording makes the jawbone’s role as the weapon immediately clear while retaining “struck down” and “men.”
