translation:
  language: en
  text: Her father said, “I was sure you completely hated her, so I gave her to your companion.[a] Isn’t her younger sister better than she is? Please take the younger sister in her place.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “friend.” The Hebrew word can mean an associate or companion; here it may refer to the man who attended Samson at his wedding.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I really thought that you utterly hated her
  simplified_phrase: I was sure you completely hated her
  preserved_meaning: The father strongly believed that Samson thoroughly hated her.
  reasoning_layer_used: Lexical decisions for the two emphatic Hebrew constructions
  rationale: Common wording preserves both emphatic ideas without sounding archaic.
- pob_phrase: Is not her younger sister better than she?
  simplified_phrase: Isn’t her younger sister better than she is?
  preserved_meaning: The father presses Samson to agree that the younger sister is broadly preferable.
  reasoning_layer_used: Lexical decision for טוֹבָה מִמֶּנָּה and rhetorical הֲלֹא
  rationale: The contraction and complete comparison sound natural while keeping the question rhetorical and broad.
- pob_phrase: Please let her be yours instead of her
  simplified_phrase: Please take the younger sister in her place
  preserved_meaning: The father politely proposes the younger sister as a substitute.
  reasoning_layer_used: Lexical decisions for תְּהִי נָא לְךָ and תַּחְתֶּיהָ
  rationale: Naming the younger sister removes confusing pronouns while retaining the polite proposal and substitution.
translation_notes:
  risk_flags:
  - risk: “Take” may sound more direct than the Hebrew jussive “let her be yours.”
    mitigation: “Please” preserves the entreaty, and the POB lexical alternatives explicitly permit “Please take her for yourself.”
