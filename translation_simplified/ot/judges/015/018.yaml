translation:
  language: en
  text: He became very thirsty. He called to Yahweh and said, “You have brought about this great deliverance through your servant. Must I now die of thirst and fall into the hand of the uncircumcised?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The uncircumcised” refers to Israel’s enemies, especially the Philistines, and stresses that they did not bear Israel’s covenant sign.
    reason: cultural_note
