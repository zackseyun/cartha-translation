translation:
  language: en
  text: He lit the torches[a] and released the animals into the Philistines’ fields, where the grain was still standing. The fire burned up the stacks of harvested grain, the grain still standing in the fields, and even the olive groves.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “firebrands.”
    reason: lexical_alternative
