translation:
  language: en
  text: Then God split open a hollow at Lehi, and water flowed from it. When Samson drank, his spirit returned, and he revived. So he named the spring En-hakkore.[a] It remains at Lehi to this day.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En-hakkore likely means “Spring of the Caller” or “Spring of the One Who Called,” referring to Samson’s cry to God.
    reason: lexical_alternative
  - marker: b
    text: Another reading is, “God split open the hollow in the jawbone, and water came out of it.”
    reason: alternative_reading
