  simplified_phrase: God did what Gideon asked
  preserved_meaning: God carried out the requested sign from the previous verse.
  reasoning_layer_used: The lexical decision for כֵּן identifies a backward reference to Gideon's request.
  rationale: The explicit reference is clearer than the potentially vague word “so.”
- pob_phrase: there was dryness on the fleece alone
  simplified_phrase: Only the fleece was dry
  preserved_meaning: Dryness was confined to the fleece.
  reasoning_layer_used: The lexical decisions for חֹרֶב and לְבַדָּהּ preserve dryness and exclusivity.
  rationale: An adjective and ordinary word order make the same contrast easier to read.
- pob_phrase: on all the ground there was dew
  simplified_phrase: the ground all around it was covered with dew
  preserved_meaning: Dew lay on the surrounding ground in contrast with the dry fleece.
  reasoning_layer_used: The lexical decision for אֶרֶץ limits the reference to the local ground in the scene.
  rationale: “All around it” makes the local setting clear without suggesting the whole land or earth.
