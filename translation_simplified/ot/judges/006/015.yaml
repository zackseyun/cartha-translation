translation:
  language: en
  text: But he replied, “Please, my lord, how can I save Israel? You see, my clan[a] is the weakest[b] in Manasseh, and I am the youngest[c] in my father’s family.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term literally means “my thousand” but can refer to a clan division.
    reason: lexical_alternative
  - marker: b
    text: Or, “the poorest” or “the least.”
    reason: lexical_alternative
  - marker: c
    text: Or, “the least.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: But he said to him
  simplified_phrase: But he replied
  preserved_meaning: Gideon responds to the speaker.
  reasoning_layer_used: Immediate discourse context
  rationale: “Replied” expresses the exchange naturally without repeating both pronouns.
- pob_phrase: Look, my clan is the weakest
  simplified_phrase: You see, my clan is the weakest
  preserved_meaning: Gideon draws attention to his clan’s low standing.
  reasoning_layer_used: Lexical decisions for הִנֵּה and הַדַּל
  rationale: “You see” keeps the attention marker while sounding natural in his explanation.
- pob_phrase: in my father’s house
  simplified_phrase: in my father’s family
  preserved_meaning: Gideon identifies his low age-based status within his paternal household.
  reasoning_layer_used: Lexical decision for בְּבֵית אָבִי
  rationale: “Family” makes the Hebrew household expression immediately clear.
