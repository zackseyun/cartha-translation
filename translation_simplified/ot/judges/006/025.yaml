translation:
  language: en
  text: That night Yahweh said to him, “Take your father’s bull and the second bull, which is seven years old. Tear down your father’s altar to Baal, and cut down the Asherah[a] that is on it.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Asherah was a sacred object associated with Asherah; its exact form is uncertain.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may mean that the Asherah stood on, over, or beside the altar.
    reason: lexical_alternative
