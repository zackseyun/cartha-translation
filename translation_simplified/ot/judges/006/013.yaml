translation:
  language: en
  text: Gideon replied, “Please, my lord,[a] if Yahweh is with us, why, then, has all this happened to us? Where are all the wonders our fathers told us about? They said, ‘Didn’t Yahweh bring us up from Egypt?’ But now Yahweh has abandoned us and handed us over to Midian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “My lord” is a respectful way of addressing the messenger here, not a divine title.
    reason: simplification_note
