- pob_phrase: Gideon said to him
  simplified_phrase: Gideon replied
  preserved_meaning: Gideon responds directly to the messenger.
  reasoning_layer_used: Immediate narrative context
  rationale: “Replied” makes the exchange clear without repeating the pronoun.
- pob_phrase: our fathers told us about, saying
  simplified_phrase: our fathers told us about? They said
  preserved_meaning: Israel’s fathers recounted Yahweh’s wonders and the exodus.
  reasoning_layer_used: POB lexical decision for סִפְּרוּ לָנוּ אֲבוֹתֵינוּ
  rationale: Two sentences replace the dense quotation structure with natural English.
- pob_phrase: given us into the hand of Midian
  simplified_phrase: handed us over to Midian
  preserved_meaning: Yahweh gave Israel into Midian’s power.
  reasoning_layer_used: POB lexical decision for וַיִּתְּנֵנוּ בְּכַף מִדְיָן
  rationale: The clear English idiom preserves both Yahweh’s action and Israel’s subjection.
