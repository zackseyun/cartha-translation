translation:
  language: en
  text: Gideon sent messengers throughout Manasseh, and its people were called to rally behind him. He also sent messengers through Asher, Zebulun, and Naphtali. Their people went up to meet the enemy forces.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Their people went up to meet Gideon and his forces.” The Hebrew says “them” without naming the group.
    reason: alternative_reading
