translation:
  language: en
  text: Look, I am laying a wool fleece on the ground where grain is separated from its stalks. If there is dew only on the fleece while all the ground[a] around it stays dry, then I will know that you will save Israel through me[b], just as you said.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can also mean “land” or “earth,” but here it likely refers to the surrounding ground.
    reason: lexical_alternative
  - marker: b
    text: Literally “by my hand,” meaning that God would use Gideon to save Israel.
    reason: simplification_note
