translation:
  language: en
  text: Then build an altar to Yahweh your God on top of this stronghold, and arrange it properly. Take the second bull and sacrifice it as a burnt offering, using the wood from the Asherah[a] that you cut down.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may refer to a wooden worship object associated with Asherah, often called an “Asherah pole.”
    reason: lexical_alternative
