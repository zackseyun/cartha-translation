  preserved_meaning: The altar must be built at the fortified height and set up in proper order.
  reasoning_layer_used: POB lexical decision for עַל רֹאשׁ הַמָּעוֹז הַזֶּה and בַּמַּעֲרָכָה
  rationale: A direct command is clearer than the abstract phrase “in orderly arrangement.”
- pob_phrase: and take the second bull and offer it up as a burnt offering
  simplified_phrase: Take the second bull and sacrifice it as a burnt offering
  preserved_meaning: The second bull is to be given as the specified sacrificial offering.
  reasoning_layer_used: POB lexical decision for וְלָקַחְתָּ אֶת־הַפָּר הַשֵּׁנִי and וְהַעֲלִיתָ עוֹלָה
  rationale: Splitting the sentence and using “sacrifice” makes the ritual action immediately clear.
- pob_phrase: with the wood of the Asherah that you cut down
