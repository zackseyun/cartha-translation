translation:
  language: en
  text: Then the angel of Yahweh came to Ophrah and sat under the oak[a] that belonged to Joash the Abiezrite. Meanwhile, Joash’s son Gideon was beating harvested wheat to separate the grain. He was working inside a winepress so he could hide the wheat from the Midianites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “terebinth”; the exact kind of tree is uncertain.
    reason: lexical_alternative
