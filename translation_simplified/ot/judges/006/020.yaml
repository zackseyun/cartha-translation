translation:
  language: en
  text: Then the angel of God[a] told him, “Put the meat and the bread made without yeast on this rock. Pour out the broth.” He did as the angel said.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “messenger of God.” The Hebrew word can refer to a human or heavenly messenger, but here the context points to a heavenly messenger.
    reason: lexical_alternative
