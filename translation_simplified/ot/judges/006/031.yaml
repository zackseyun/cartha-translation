translation:
  language: en
  text: But Joash answered everyone who confronted him, “Will you defend Baal’s cause? Will you save him? Anyone who defends his cause will be put to death by morning. If he is a god, let him defend himself, because someone has torn down his altar.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “because he has torn down his altar,” with Gideon understood as the one who did it.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: said to all who stood against him
  simplified_phrase: answered everyone who confronted him
  preserved_meaning: Joash responds to the people opposing him.
  reasoning_layer_used: lexical decision for עָמְדוּ עָלָיו and narrative context
  rationale: “Confronted” makes the adversarial idiom immediately clear.
- pob_phrase: contend for Baal / contends for him / let him contend for himself
  simplified_phrase: defend Baal’s cause / defends his cause / let him defend himself
  preserved_meaning: The repeated wording challenges the people to stop taking up Baal’s dispute for him.
  reasoning_layer_used: lexical decision for the repeated root ריב
  rationale: “Defend his cause” preserves the repeated legal and combative idea in common English.
- pob_phrase: shall be put to death by morning
  simplified_phrase: will be put to death by morning
  preserved_meaning: Anyone defending Baal faces execution by the stated deadline.
  reasoning_layer_used: lexical decisions for יוּמַת and עַד הַבֹּקֶר
  rationale: The modern future form keeps both the death sentence and its deadline.
translation_notes:
  risk_flags:
  - risk: “Defend” may sound less combative than the Hebrew ריב can be.
    mitigation: Repeating “defend” and “cause” retains the dispute motif without limiting it to a courtroom.
  - risk: The Hebrew does not explicitly name who tore down the altar.
    mitigation: The main text keeps “someone,” while the footnote preserves the possible reference to Gideon.
