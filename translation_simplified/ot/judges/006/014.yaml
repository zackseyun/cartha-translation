translation:
  language: en
  text: Then Yahweh turned to him and said, “Go with the strength you have[a], and save Israel from Midian’s grip. Have I not sent you?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Go in this strength of yours.” The Hebrew can describe either the strength he goes in or the strength he uses.
    reason: lexical_alternative
