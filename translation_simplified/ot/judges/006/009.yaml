translation:
  language: en
  text: I rescued you from Egypt’s grip and from everyone who oppressed you. I drove them out from before you, and I gave you their land.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: delivered you from the hand of Egypt
  simplified_phrase: rescued you from Egypt’s grip
  preserved_meaning: God freed Israel from Egypt’s power and control.
  reasoning_layer_used: Lexical decisions for וָאַצִּל and מִיַּד
  rationale: “Rescued” is direct modern English, while “grip” preserves the bodily image of controlling power.
- pob_phrase: from the hand of all your oppressors
  simplified_phrase: from everyone who oppressed you
  preserved_meaning: God rescued Israel from all who afflicted them.
  reasoning_layer_used: Lexical decision for כָּל לֹחֲצֵיכֶם
  rationale: The verbal wording is easier to understand while retaining oppression and the full scope of “all.”
- pob_phrase: I drove them out from before you and gave you their land
  simplified_phrase: I drove them out from before you, and I gave you their land
  preserved_meaning: God expelled the oppressors from Israel’s presence and gave Israel their territory.
  reasoning_layer_used: Lexical decisions for וָאֲגָרֵשׁ, מִפְּנֵיכֶם, and וָאֶתְּנָה לָכֶם אֶת אַרְצָם
  rationale: Keeping “from before you” avoids reducing territorial expulsion to merely clearing a path.
translation_notes:
  risk_flags:
  - risk: “Egypt’s grip” replaces the Hebrew image of a hand.
    mitigation: “Grip” retains a bodily metaphor and clearly conveys power and control.
  - risk: “From before you” is less conversational than some alternatives.
    mitigation: It remains understandable and preserves the spatial force of removal from Israel’s presence.
