translation:
  language: en
  text: Then the angel of Yahweh[a] extended the staff in his hand and touched its tip to the meat and the unleavened bread. Fire rose from the rock and burned up the meat and the unleavened bread. Then the angel of Yahweh left Gideon’s sight.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “messenger of Yahweh.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: reached out the tip of the staff that was in his hand and touched the meat
  simplified_phrase: extended the staff in his hand and touched its tip to the meat
  preserved_meaning: The angel extended his staff so its tip touched the food.
  reasoning_layer_used: Lexical decisions for וַיִּשְׁלַח, קְצֵה הַמִּשְׁעֶנֶת, and וַיִּגַּע
  rationale: The recast sentence makes the staff’s movement and point of contact immediately clear.
- pob_phrase: fire went up from the rock and consumed
  simplified_phrase: Fire rose from the rock and burned up
  preserved_meaning: Fire emerged upward from the rock and completely destroyed the offering.
  reasoning_layer_used: Lexical decisions for וַתַּעַל הָאֵשׁ מִן הַצּוּר and וַתֹּאכַל
  rationale: “Rose” keeps the upward image, while “burned up” is common English for fire consuming something.
- pob_phrase: went away from his sight
  simplified_phrase: left Gideon’s sight
  preserved_meaning: The angel departed so that Gideon could no longer see him.
  reasoning_layer_used: Lexical decision and POB footnote for הָלַךְ מֵעֵינָיו
  rationale: Naming Gideon resolves the pronoun without implying that the angel suddenly vanished.
interpretive_expansions:
