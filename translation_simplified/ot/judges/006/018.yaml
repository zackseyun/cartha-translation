simplification_decisions:
- pob_phrase: Please do not depart from here
  simplified_phrase: Please stay here
  preserved_meaning: The visitor is politely asked to remain in that place.
  reasoning_layer_used: Lexical decision for תָמֻשׁ and נָא
  rationale: A direct positive request is clearer while preserving the polite command to remain.
- pob_phrase: until I come to you
  simplified_phrase: until I come back
  preserved_meaning: Gideon will leave briefly and return to the visitor.
  reasoning_layer_used: Immediate narrative context and lexical decision for עַד בֹּאִי אֵלֶיךָ
  rationale: “Come back” naturally expresses his return without changing the event.
- pob_phrase: and bring out my offering and set it before you
  simplified_phrase: I will bring out my offering and place it before you
  preserved_meaning: The presented item remains an offering without being narrowed to a formal grain offering.
  reasoning_layer_used: Lexical and theological decisions for מִנְחָתִי
  rationale: A separate sentence eases the clause structure while retaining the religiously resonant term.
