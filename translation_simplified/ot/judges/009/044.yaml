translation:
  language: en
  text: Abimelech and the leaders with him charged forward and positioned themselves at the entrance to the city gate. The other two groups[a] charged at everyone in the field and struck them down.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says “the two leaders,” but in context this likely means the other two groups of troops mentioned in the previous verse.
    reason: lexical_alternative
