translation:
  language: en
  text: Abimelech spent the whole day fighting against the city. After he captured it, he killed the people inside and tore the city down. Then he sowed salt over it.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sowing salt was a symbolic act of devastation and curse, marking the city as ruined.
    reason: cultural_note
simplification_decisions:
- pob_phrase: fought against the city all that day
  simplified_phrase: spent the whole day fighting against the city
  preserved_meaning: Abimelech carried on hostile military action against the city throughout that day.
  reasoning_layer_used: lexical decision for נִלְחָם בָּעִיר and כֹּל הַיּוֹם הַהוּא
  rationale: The recast wording makes the duration natural while retaining the source-driven sense of fighting against the city.
- pob_phrase: the people who were in it
  simplified_phrase: the people inside
  preserved_meaning: The people killed were the population present within the city.
  reasoning_layer_used: lexical decision for הָעָם אֲשֶׁר בָּהּ
  rationale: “Inside” states the same location more directly in common English.
- pob_phrase: sowed it with salt
  simplified_phrase: sowed salt over it
  preserved_meaning: Abimelech deliberately spread salt while preserving the Hebrew sowing image.
  reasoning_layer_used: lexical decision for וַיִּזְרָעֶהָ מֶלַח
  rationale: The wording clarifies what was sown without reducing the vivid action to merely “salting” the city.
translation_notes:
  risk_flags:
  - risk: Modern readers may not understand why salt was sown over a destroyed city.
    mitigation: A brief cultural footnote identifies the act as a symbol of devastation and curse.
