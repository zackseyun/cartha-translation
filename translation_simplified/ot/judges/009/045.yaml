  yaml_path: translation/ot/judges/009/045.yaml
  text: And Abimelech fought against the city all that day[a], and he captured the city and killed the people who were in it[b]. Then he tore down the city and sowed it with salt.
  footnotes:
  - marker: a
    text: Or 'attacked the city.' The Hebrew verb is literally 'fought' and, with the preposition used here, likely means military action against the city.
    reason: lexical_alternative
  - marker: b
    text: '''Sowed it with salt'' is a symbolic act of devastation and curse, marking the city''s ruin.'
    reason: cultural_note
