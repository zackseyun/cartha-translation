translation:
  language: en
  text: Everyone cut down a branch and followed Abimelech. They piled the branches against the inner chamber[a] of the tower, then set the chamber on fire over the people inside. So all the people of the tower of Shechem died—about a thousand men and women.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “stronghold”; the Hebrew term likely means an enclosed refuge within the tower.
    reason: lexical_alternative
