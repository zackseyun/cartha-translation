  text: They told Jotham what had happened. He went to the top of Mount Gerizim and stood there. Then he raised his voice and called out to them, “Leaders of Shechem,[a] listen to me, so that God may listen to you.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term literally means “lords” or “masters” and refers here to Shechem’s power-holders.
    reason: lexical_alternative
  - marker: b
    text: Or, “and may God listen to you.”
    reason: alternative_reading
