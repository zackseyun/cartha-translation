translation:
  language: en
  text: Gaal son of Ebed said, “Who is Abimelek, and who is Shechem,[a] that we should live under Abimelek’s rule? Is Abimelek not the son of Jerubbaal, with Zebul as his appointed official? Serve Hamor’s people—Hamor was remembered as the father or founder of Shechem.[b] Why should we serve Abimelek?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “what is Shechem?” The name may refer to the city or its ruling community.
    reason: lexical_alternative
  - marker: b
    text: Hamor’s people were descended from or associated with Hamor; compare Genesis 34.
    reason: cross_reference
simplification_decisions:
- pob_phrase: that we should serve him
  simplified_phrase: that we should live under Abimelek’s rule
  preserved_meaning: Serving Abimelek means being politically subject to him.
  reasoning_layer_used: Lexical decision for עבד and the immediate political context.
  rationale: This prevents readers from mistaking the service for ordinary work.
- pob_phrase: Zebul his officer
  simplified_phrase: Zebul as his appointed official
  preserved_meaning: Zebul holds a subordinate administrative position under Abimelek.
  reasoning_layer_used: Lexical alternatives and rationale for פְּקִידוֹ.
  rationale: This clarifies Zebul’s role without assigning him a specific office.
- pob_phrase: the men of Hamor, the father of Shechem
  simplified_phrase: Hamor’s people—Hamor was remembered as the father or founder of Shechem
  preserved_meaning: The command names Hamor’s associated people and recalls his ancestral relationship to Shechem.
  reasoning_layer_used: Lexical rationale and POB cross-reference note.
  rationale: This explains the ancient group expression while preserving the father-or-founder ambiguity.
