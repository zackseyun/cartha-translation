translation:
  language: en
  text: 'Please say this to all the leaders of Shechem: “Which would be better for you: to have all seventy of Jerubbaal’s sons rule over you, or to have one man rule over you? Remember that I am your bone and your flesh.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression “your bone and your flesh” means “your own flesh and blood,” or a close relative.
    reason: lexical_alternative
