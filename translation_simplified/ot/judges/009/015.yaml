translation:
  language: en
  text: Then the bramble said to the trees, “If you truly intend to anoint me as your king, come and take shelter in my shade.[a] But if you do not, let fire come from the bramble and burn up the cedars of Lebanon.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A bramble is a thorny bush and provides very little shade, making its offer ironic.
    reason: cultural_note
  - marker: b
    text: Or “fire will come from the bramble and burn up the cedars of Lebanon.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: If you are truly anointing me as king over you
  simplified_phrase: If you truly intend to anoint me as your king
  preserved_meaning: The trees are challenged to show that they genuinely mean to establish the bramble as king.
  reasoning_layer_used: POB lexical decisions for אִם בֶּאֱמֶת, מֹשְׁחִים, and עֲלֵיכֶם
  rationale: The recast clause is natural while retaining the royal image of anointing.
- pob_phrase: come, take refuge in my shade
  simplified_phrase: come and take shelter in my shade
  preserved_meaning: The bramble commands the trees to approach and seek its protection.
  reasoning_layer_used: POB lexical decisions for בֹּאוּ חֲסוּ and בְצִלִּי, plus the grounding review
  rationale: “Take shelter” clearly preserves the imperative action and the ironic shade image.
- pob_phrase: consume the cedars of Lebanon
  simplified_phrase: burn up the cedars of Lebanon
  preserved_meaning: Fire from the bramble is invoked to destroy Lebanon’s majestic cedars.
  reasoning_layer_used: POB lexical decisions for וְתֹאכַל and אַרְזֵי הַלְּבָנוֹן
  rationale: “Burn up” gives the ordinary English sense of fire consuming something.
translation_notes:
  risk_flags:
  - risk: “Take shelter” emphasizes physical protection more than the broader refuge concept may allow.
    mitigation: The shade image and invitation to approach preserve the protective force.
  - risk: The Hebrew may express either a curse-like wish or a prediction about the fire.
    mitigation: The main text keeps the POB jussive reading, while footnote b preserves the predictive reading.
