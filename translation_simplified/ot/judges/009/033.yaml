  text: Then, in the morning, as soon as the sun rises, get up early and spread your forces out against the city. Look! When he and the people with him come out against you, do to him whatever you have the power or opportunity to do.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “as your hand finds,” a Hebrew expression for what your ability or opportunity allows.
    reason: lexical_alternative
