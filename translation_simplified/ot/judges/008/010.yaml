  preserved_meaning: The count refers to armed combatants, with the sword image retained.
  reasoning_layer_used: POB lexical decision for אִישׁ שֹׁלֵף חָרֶב
  rationale: The martial idiom is explained directly while the source image of the sword remains visible.
