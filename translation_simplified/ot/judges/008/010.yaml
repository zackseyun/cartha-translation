translation:
  language: en
  text: Zebah and Zalmunna were in Karkor. Their camps were with them and included about fifteen thousand men—all who remained from the whole army of the people of the east.[a] One hundred twenty thousand sword-bearing fighting men had fallen in battle.
  philosophy: optimal-equivalence
  footnotes:
