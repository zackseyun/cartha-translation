translation:
  language: en
  text: Then he went to the men of Succoth and said, “Here are Zebah and Zalmunna! You taunted me about them when you said, ‘Have you already captured Zebah and Zalmunna[a]? Why should we give bread to your exhausted men?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally asks whether the hand of Zebah and Zalmunna is in Gideon’s hand, an image meaning that they are captured and under his control.
    reason: lexical_alternative
