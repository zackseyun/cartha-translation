translation:
  language: en
  text: Then he asked Zebah and Zalmunna, “Where are the men you killed at Mount Tabor?” They answered, “They were like you. Each one looked like a king’s son.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Then he said to Zebah and Zalmunna
  simplified_phrase: Then he asked Zebah and Zalmunna
  preserved_meaning: He directly questions Zebah and Zalmunna.
  reasoning_layer_used: POB lexical decision for the speech sequence and the interrogative context
  rationale: “Asked” naturally introduces the question without changing its force.
- pob_phrase: at Tabor
  simplified_phrase: at Mount Tabor
  preserved_meaning: The killings took place at the location called Tabor.
  reasoning_layer_used: POB lexical alternative and cultural footnote
  rationale: Adding “Mount” identifies the place clearly for readers unfamiliar with Tabor.
- pob_phrase: As you are, so were they; each one had the appearance of the sons of a king
  simplified_phrase: They were like you. Each one looked like a king’s son.
  preserved_meaning: Every victim resembled the questioner and had a royal appearance.
  reasoning_layer_used: POB lexical decisions and approved lexical alternative
  rationale: Two short sentences make the elliptical comparison and royal image immediately clear.
translation_notes:
  risk_flags:
