translation:
  language: en
  text: Then Zebah and Zalmunna said, “You get up and kill us yourself, because a man’s strength matches the kind of man he is.”[a] So Gideon got up and killed them. Then he took the moon-shaped ornaments from the necks of their camels.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebrew states the proverb more literally: “As the man is, so is his strength.” It links a man’s strength with his stature or valor; here they call on Gideon himself, rather than a youth, to kill them.'
    reason: cultural_note
simplification_decisions:
- pob_phrase: Rise yourself and strike us down
  simplified_phrase: You get up and kill us yourself
  preserved_meaning: The command emphatically calls on Gideon himself to deliver the lethal blow.
  reasoning_layer_used: Lexical decisions for קוּם אַתָּה and וּפְגַע בָּנוּ
  rationale: Common wording makes the lethal context clear while preserving the emphasis on Gideon himself.
- pob_phrase: for as the man is, so is his strength
  simplified_phrase: because a man’s strength matches the kind of man he is
  preserved_meaning: The proverb links a male warrior’s strength with his stature or valor without limiting it to height.
  reasoning_layer_used: Lexical and theological decisions for כִּי כָאִישׁ גְּבוּרָתוֹ
  rationale: The broader wording remains understandable without narrowing the proverb to physical stature.
- pob_phrase: the crescent ornaments that were on the necks of their camels
  simplified_phrase: the moon-shaped ornaments from the necks of their camels
  preserved_meaning: Gideon takes the crescent-shaped decorations worn by the camels.
  reasoning_layer_used: Lexical decisions for הַשַּׂהֲרֹנִים and אֲשֶׁר בְּצַוְּארֵי גְמַלֵּיהֶם
  rationale: “Moon-shaped” explains the ornament’s form in ordinary English.
