translation:
  language: en
  text: Gideon made it into a religious object called an ephod[a] and set it up in his hometown of Ophrah. There all Israel prostituted themselves by worshiping it.[b] It became a snare—a dangerous trap—for Gideon and his household.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The text does not specify whether this ephod was a garment or some other object associated with priestly use.
    reason: cultural_note
  - marker: b
    text: The Hebrew uses the image of prostitution for Israel’s unfaithfulness to God through idolatry.
    reason: lexical_alternative
