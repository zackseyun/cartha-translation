translation:
  language: en
  text: Then Gideon traveled along the route used by people who lived in tents, east of Nobah and Jogbehah. He attacked the camp when its people were not expecting an attack.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “while the camp felt secure.” The Hebrew can describe confidence or security, implying that the camp was off guard.
    reason: lexical_alternative
