translation:
  language: en
  text: Zebah and Zalmunna fled. He chased them and captured both kings of Midian. Then he threw the whole camp into panic.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “terrified the whole camp” or “routed the whole camp.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Zebah and Zalmunna fled, and he pursued them and captured
  simplified_phrase: Zebah and Zalmunna fled. He chased them and captured
  preserved_meaning: The kings fled, but their pursuer followed and took them alive.
  reasoning_layer_used: POB lexical decisions for נוּס, רדף, and לכד
  rationale: Two short sentences and the familiar verb “chased” make the action easier to follow.
- pob_phrase: the two kings of Midian, Zebah and Zalmunna
  simplified_phrase: both kings of Midian
  preserved_meaning: Zebah and Zalmunna are the two captured Midianite kings.
  reasoning_layer_used: POB appositional identification decision
  rationale: Because the kings have just been named, “both” keeps their identification without repeating the names.
- pob_phrase: and he threw the whole camp into panic
  simplified_phrase: Then he threw the whole camp into panic
  preserved_meaning: He caused fear and military disarray throughout the camp.
  reasoning_layer_used: POB lexical decision for the Hiphil of חרד
  rationale: “Then” clarifies the narrative sequence while retaining the forceful image of widespread panic.
translation_notes:
  risk_flags:
  - risk: Removing the repeated names reduces the Hebrew apposition’s emphasis.
    mitigation: “Both kings of Midian” still clearly identifies the two named men as the captured kings.
  - risk: The Hebrew final verb can emphasize terror, trembling, or military rout.
    mitigation: The main text keeps POB’s balanced rendering, and the footnote preserves the main alternatives.
