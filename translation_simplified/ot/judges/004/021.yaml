translation:
  language: en
  text: Then Jael, Heber’s wife, took a tent peg and held a hammer in her hand. She quietly[a] approached him and drove the peg into his temple. The peg went down into the ground.[b] He was fast asleep and exhausted, and he died.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “stealthily”; the Hebrew stresses a silent, unobtrusive approach.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb most naturally refers to the peg going into the ground.
    reason: lexical_alternative
