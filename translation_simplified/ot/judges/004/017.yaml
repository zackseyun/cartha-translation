translation:
  language: en
  text: But Sisera fled on foot to Jael’s tent.[a] Jael was the wife of Heber the Kenite. He fled there because Jabin king of Hazor and Heber’s household were at peace with each other.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “And Sisera fled on foot.” The Hebrew can mean “and,” while “but” shows the contrast with the preceding events.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: to the tent of Jael
  simplified_phrase: to Jael’s tent
  preserved_meaning: Sisera fled to the tent belonging to Jael.
  reasoning_layer_used: POB lexical decision for אֶל אֹהֶל יָעֵל
  rationale: The possessive form is more natural in common English without changing the relationship.
- pob_phrase: the wife of Heber the Kenite
  simplified_phrase: Jael was the wife of Heber the Kenite
  preserved_meaning: Jael is identified through her marriage to Heber the Kenite.
  reasoning_layer_used: POB lexical decision for אֵשֶּׁת חֶבֶר הַקֵּינִי
  rationale: A separate sentence makes the identification easier to follow.
- pob_phrase: there was peace between Jabin king of Hazor and the house of Heber the Kenite
  simplified_phrase: Jabin king of Hazor and Heber’s household were at peace with each other
  preserved_meaning: Jabin had peaceful relations with Heber’s household or clan.
  reasoning_layer_used: POB lexical decisions for שָׁלוֹם and בֵּית חֶבֶר הַקֵּינִי
  rationale: This recasts the abstract construction in direct modern English while keeping “peace” and the social sense of “house.”
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “household” more narrowly than a household or clan.
    mitigation: The wording retains the POB’s social-unit sense without making it merely Heber as an individual.
