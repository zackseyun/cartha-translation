translation:
  language: en
  text: She answered, “Yes, I will certainly go with you. But on the path you are taking, the honor will not go to you, because Yahweh will sell Sisera into a woman’s hand—he will give her power over him.” Then Deborah got up and went with Barak to Kedesh.
