  text: Then Sisera called together all nine hundred of his iron chariots and everyone who was with him. They came from Harosheth-haggoyim to the Kishon stream valley.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term can mean a streambed, a seasonal torrent valley, or a river; this place is also called the Kishon River.
