translation:
  language: en
  text: 'She sent for Barak son of Abinoam from Kedesh in Naphtali. She said to him, “Hasn’t the LORD, the God of Israel, commanded you: ‘Go up to Mount Tabor, taking with you ten thousand men from the tribes of Naphtali and Zebulun’?”'
