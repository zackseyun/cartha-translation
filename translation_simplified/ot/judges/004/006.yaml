simplification_decisions:
- pob_phrase: sent and summoned Barak
  simplified_phrase: sent for Barak
  preserved_meaning: She called Barak to come to her.
  reasoning_layer_used: POB base text and immediate narrative sense
  rationale: The common expression “sent for” conveys both sending a message and summoning him.
- pob_phrase: Go, draw up to Mount Tabor, and take with you
  simplified_phrase: Go up to Mount Tabor, taking with you
  preserved_meaning: Barak must go to Mount Tabor and bring the specified men with him.
  reasoning_layer_used: POB revision preserving movement to Mount Tabor and the command to take the men
  rationale: This keeps both actions clear without adding a separate command to assemble the men there.
- pob_phrase: sons of Naphtali and ... sons of Zebulun
  simplified_phrase: men from the tribes of Naphtali and Zebulun
  preserved_meaning: The men belong to those two Israelite tribes.
  reasoning_layer_used: Source wording interpreted by Israel’s tribal setting
  rationale: Modern readers may otherwise mistake “sons” for immediate male children.
