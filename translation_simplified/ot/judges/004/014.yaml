translation:
  language: en
  text: Then Deborah said to Barak, “Rise up! Today Yahweh has handed Sisera over to you. Yahweh has gone ahead of you, hasn’t he?” Barak went down from Mount Tabor, and ten thousand men followed him.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Arise, for this is the day on which
  simplified_phrase: Rise up! Today
  preserved_meaning: Deborah commands Barak to act immediately and emphasizes that this is the appointed day.
  reasoning_layer_used: POB lexical decisions for קוּם and כִּי זֶה הַיּוֹם אֲשֶׁר
  rationale: Two short sentences replace the formal command and dense time clause without weakening their urgency.
- pob_phrase: has given Sisera into your hand
  simplified_phrase: has handed Sisera over to you
  preserved_meaning: Yahweh has placed Sisera under Barak’s power with certain victory in view.
  reasoning_layer_used: POB lexical decision for נָתַן ... בְּיָדֶךָ
  rationale: The supported idiomatic alternative states the same transfer of power in familiar English.
- pob_phrase: Has not Yahweh gone out before you?
  simplified_phrase: Yahweh has gone ahead of you, hasn’t he?
  preserved_meaning: The rhetorical question assures Barak that Yahweh is moving before him.
  reasoning_layer_used: POB lexical decisions for הֲלֹא and יָצָא לְפָנֶיךָ
  rationale: A natural English tag question preserves both the expected agreement and the movement image.
translation_notes:
  risk_flags:
  - risk: “Handed Sisera over” does not retain the literal image of Sisera being placed in Barak’s hand.
    mitigation: It uses a POB-approved alternative and preserves the idiom’s meaning of transfer into Barak’s power.
  - risk: The tag-question form is less formally shaped than the Hebrew rhetorical question.
    mitigation: It still clearly expects agreement and retains Yahweh’s action of going ahead.
