translation:
  language: en
  text: Yahweh threw Sisera, all his chariots, and his whole army into confusion[a] as Barak attacked them with the sword. Then Sisera climbed down from his chariot and fled on foot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean that Yahweh threw them into panic or routed them.
    reason: lexical_alternative
