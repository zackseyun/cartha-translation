translation:
  language: en
  text: Heber the Kenite had separated from the other Kenites, the descendants of Hobab, Moses’ father-in-law.[a] He had pitched his tent as far as the oak at Zaannannim, near Kedesh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Moses’ relative by marriage”; the Hebrew term can have a broader meaning than “father-in-law.”
    reason: alternative_reading
  - marker: b
    text: The tree may have been a terebinth rather than an oak.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: from the Kenites, from the sons of Hobab
  simplified_phrase: from the other Kenites, the descendants of Hobab
  preserved_meaning: Heber separated from his own clan, which descended from Hobab.
  reasoning_layer_used: lexical decisions for מִקַּיִן and מִבְּנֵי חֹבָב
  rationale: “Other” clarifies the group relationship, while “descendants” gives the clan sense of “sons.”
- pob_phrase: the oak in Zaannannim, which is near Kedesh
  simplified_phrase: the oak at Zaannannim, near Kedesh
  preserved_meaning: The tree was associated with Zaannannim, which was near Kedesh.
  reasoning_layer_used: lexical decisions for בצענים and אֲשֶׁר אֶת קֶדֶשׁ
  rationale: The shorter location phrase removes a heavy relative clause without changing the geography.
- pob_phrase: had pitched his tent as far as the oak
  simplified_phrase: had pitched his tent as far as the oak
  preserved_meaning: Heber’s tent-pitching extended to the named location as background information.
  reasoning_layer_used: lexical decisions for וַיֵּט אָהֳלוֹ and עַד
  rationale: Retaining the pluperfect avoids adding a separate movement action and preserves the explanatory background.
interpretive_expansions:
