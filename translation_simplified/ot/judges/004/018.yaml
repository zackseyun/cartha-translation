translation:
  language: en
  text: Jael went out to meet Sisera. She said, “Turn from your path and come to me, my lord. Come to me. Do not be afraid.” So Sisera turned from his path, entered her tent, and she covered him with a blanket.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word may also mean a rug or another kind of covering cloth.
    reason: lexical_alternative
