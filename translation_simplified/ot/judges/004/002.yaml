translation:
  language: en
  text: So Yahweh sold Israel into the hands of Jabin, king of Canaan.[a] Jabin ruled in Hazor. His army commander was Sisera, who lived in Harosheth-haggoyim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sold Israel into the hands of” means that Yahweh gave Israel over to Jabin’s power as judgment.
    reason: simplification_note
  - marker: b
    text: Harosheth-haggoyim likely means “Harosheth of the Nations.”
    reason: cultural_note
simplification_decisions:
- pob_phrase: sold them into the hand of
  simplified_phrase: sold Israel into the hands of
  preserved_meaning: Yahweh actively handed Israel over to Jabin’s power in covenant judgment while the selling image remains.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Naming Israel clarifies the pronoun, and the footnote explains the Hebrew judgment idiom.
- pob_phrase: who reigned in Hazor
  simplified_phrase: Jabin ruled in Hazor
  preserved_meaning: Jabin exercised kingship in Hazor.
  reasoning_layer_used: POB lexical decision for אֲשֶׁר מָלַךְ בְּחָצוֹר
  rationale: A separate sentence and the common verb “ruled” make the clause easier to follow.
- pob_phrase: and the commander of his army was Sisera
  simplified_phrase: His army commander was Sisera
  preserved_meaning: Sisera commanded Jabin’s army.
  reasoning_layer_used: POB lexical decision for וְשַׂר צְבָאוֹ
  rationale: Direct English word order removes the dense coordination without changing the military role.
interpretive_expansions:
- pob_phrase: them
  rendering: Israel
  claim: The pronoun refers to the Israelites.
  evidence:
