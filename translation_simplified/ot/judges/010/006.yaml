translation:
  language: en
  text: The Israelites once again did what was evil in Yahweh’s eyes.[a] They served the Baals and the Ashtoreths, as well as the gods of Aram, Sidon, Moab, the Ammonites, and the Philistines. They abandoned Yahweh and did not serve him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “continued to do what was evil in Yahweh’s eyes.” The Hebrew can indicate repetition or continuation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the sons of Israel
  simplified_phrase: the Israelites
  preserved_meaning: The phrase still identifies the covenant people of Israel.
  reasoning_layer_used: POB lexical alternatives
  rationale: The approved alternative is clearer in ordinary modern English.
- pob_phrase: the gods of the sons of Ammon
  simplified_phrase: the gods of the Ammonites
  preserved_meaning: These are the gods worshiped by the people of Ammon.
  reasoning_layer_used: POB footnote and lexical alternatives
  rationale: The ethnic name removes an opaque Hebrew family expression.
- pob_phrase: They forsook Yahweh
  simplified_phrase: They abandoned Yahweh
  preserved_meaning: Israel decisively rejected its covenant relationship with Yahweh.
  reasoning_layer_used: POB lexical rationale
  rationale: “Abandoned” is common English while retaining the force of Israel’s disloyalty.
translation_notes:
  risk_flags:
  - risk: “Once again” may suggest repetition more strongly than continuation.
    mitigation: The footnote preserves the continuation reading.
  - risk: “Abandoned” may carry less traditional covenant resonance than “forsook.”
    mitigation: Its force and the following refusal to serve Yahweh preserve the relational breach.
