translation:
  language: en
  text: After Abimelech, Tola came forward to save Israel. He was the son of Puah, who was the son of Dodo[a]. Tola was from the tribe of Issachar and lived in Shamir, in the hill country of Ephraim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the son of his uncle.” The Hebrew can refer either to a man named Dodo or to “his uncle.”
    reason: alternative_reading
