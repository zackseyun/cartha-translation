  review_summary: '“Attacked Jerusalem” is a warranted and clearer rendering of the hostile military action, and the footnote appropriately retains the live locative alternative. The final pronoun simplification is also clear. However, “struck it down” is not a sound clarification of the Hebrew idiom: it introduces an imprecise defeat/downward image while leaving modern readers uncertain how a city is struck with a sword. Rendering the conventional metonymy explicitly as killing the city’s people with the sword makes the actual military violence understandable without adding doctrine or changing the sequence of capture, sword violence, and burning.'
