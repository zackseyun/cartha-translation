translation:
  language: en
  text: Then the sons of Judah[a] attacked Jerusalem[b]. They captured the city, killed its people with the sword, and set the city on fire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sons of Judah” means the men belonging to the tribe of Judah.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew can also mean “fought in Jerusalem,” but the context favors “attacked Jerusalem.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: fought against Jerusalem
  simplified_phrase: attacked Jerusalem
  preserved_meaning: The men of Judah took hostile military action against Jerusalem.
  reasoning_layer_used: Lexical decision for וַיִּלָּחֲמוּ בִּירוּשָׁלִַם and immediate context
  rationale: “Attacked” makes the hostile direction clear while the footnote preserves the locative alternative.
- pob_phrase: struck it with the edge of the sword
  simplified_phrase: killed its people with the sword
  preserved_meaning: The attackers used lethal sword violence against those in the captured city.
  reasoning_layer_used: Lexical decisions for וַיַּכּוּהָ and לְפִי חָרֶב in military context
  rationale: This expresses how a city is struck by the sword without adding the unsupported image of bringing it down.
- pob_phrase: and they set the city on fire
  simplified_phrase: and set the city on fire
  preserved_meaning: The attackers burned Jerusalem after the sword violence.
  reasoning_layer_used: Lexical decision for שִׁלְּחוּ בָאֵשׁ and English coordination
  rationale: Removing the repeated subject makes the sequence smoother without changing the action.
interpretive_expansions:
- pob_phrase: struck it with the edge of the sword
  rendering: killed its people with the sword
  claim: The city stands for its inhabitants, who were subjected to lethal sword violence.
  evidence:
  - A city cannot literally be struck with a sword in the same way as people.
  - The military sword idiom describes lethal violence against a captured city.
  confidence: high
  alternatives_preserved:
  - struck it with the edge of the sword
translation_notes:
  risk_flags:
