translation:
  language: en
  text: Judah went with his brother Simeon. Together they struck down the Canaanites who lived in Zephath and devoted the city to destruction.[a] Then they named the city Hormah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “completely destroyed the city.” The Hebrew means that it was given over irrevocably, often by destruction.
    reason: lexical_alternative
  - marker: b
    text: Hormah sounds like the Hebrew word for something devoted to destruction.
    reason: source_note
