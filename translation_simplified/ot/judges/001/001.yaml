simplification_decisions:
- pob_phrase: And it happened after the death of Joshua
  simplified_phrase: After Joshua died
  preserved_meaning: The story begins after Joshua’s death.
  reasoning_layer_used: Lexical decision for אַחֲרֵי מוֹת יְהוֹשֻׁעַ
  rationale: The verbal form is clearer and keeps the same time setting.
- pob_phrase: asked Yahweh, saying
  simplified_phrase: asked Yahweh
  preserved_meaning: Israel sought guidance from Yahweh and then spoke the quoted question.
  reasoning_layer_used: Lexical decisions for וַיִּשְׁאֲלוּ and לֵאמֹר; theological decision for יְהוָה
  rationale: English does not need “saying” before a direct quotation, while Yahweh’s covenant name remains explicit.
- pob_phrase: Who will go up for us first against the Canaanites to fight against them?
  simplified_phrase: Who should go first to fight the Canaanites for us?
  preserved_meaning: They ask which party should begin the military action on Israel’s behalf.
  reasoning_layer_used: Lexical decisions for מִי יַעֲלֶה לָּנוּ, בַּתְּחִלָּה, and לְהִלָּחֶם בּוֹ
  rationale: The wording states the military sense directly without repeating “against.”
translation_notes:
  risk_flags:
  - risk: “Should” is less formally predictive than POB’s “will.”
    mitigation: It clearly conveys the source context of seeking Yahweh’s guidance about battle order.
  - risk: “Sons of Israel” may sound less natural than “Israelites.”
    mitigation: The phrase preserves POB’s gender-conscious lexical choice, and the footnote gives the common equivalent.
