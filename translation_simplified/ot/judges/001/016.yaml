translation:
  language: en
  text: The descendants of the Kenite, Moses’ father-in-law,[a] went up from the City of Palms[b] with the people of Judah. They entered Judah’s wilderness, in the Negev region near Arad. Then he went and settled with the people.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “Moses’ relative by marriage,” though “father-in-law” is most likely here.
    reason: lexical_alternative
  - marker: b
    text: The City of Palms is commonly understood to be Jericho.
    reason: cross_reference
  - marker: c
    text: The Hebrew changes from plural to singular here; “he” may refer to the Kenite clan as a whole.
    reason: source_note
  - marker: d
    text: Or “among the people.” Some ancient witnesses read “with Amalek.”
    reason: alternative_reading
