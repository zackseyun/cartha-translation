translation:
  language: en
  text: Then the tribe of Judah went up to battle. Yahweh gave them power over the Canaanites and the Perizzites, and at Bezek they struck down ten thousand men.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Judah went up
  simplified_phrase: the tribe of Judah went up to battle
  preserved_meaning: Judah is the collective tribal force advancing for military action.
  reasoning_layer_used: lexical decision and immediate battle context
  rationale: This keeps the Hebrew image of going up while making the collective subject and purpose clear.
- pob_phrase: gave the Canaanites and the Perizzites into their hand
  simplified_phrase: gave them power over the Canaanites and the Perizzites
  preserved_meaning: Yahweh granted Judah control and victory over the two peoples.
  reasoning_layer_used: lexical idiom and theological agency decision
  rationale: The plain-English idiom explains the Hebrew hand image without weakening Yahweh's agency.
- pob_phrase: and they struck down ten thousand men at Bezek
  simplified_phrase: and at Bezek they struck down ten thousand men
  preserved_meaning: Judah's forces carried out the violent defeat of ten thousand men at Bezek.
  reasoning_layer_used: lexical decision and English information order
  rationale: Moving the location earlier improves flow while retaining the verb's force and scope.
interpretive_expansions:
- pob_phrase: Judah went up
  rendering: the tribe of Judah went up to battle
  claim: Judah refers collectively to the tribal force moving into battle.
  evidence:
  - The singular proper name has a collective subject sense in the POB lexical rationale.
  - The following clauses describe military victory and a battle tally.
  confidence: high
  alternatives_preserved:
  - Judah advanced
translation_notes:
  risk_flags:
