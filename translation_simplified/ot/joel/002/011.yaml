  preserved_meaning: Yahweh’s military camp is immense in size or number.
  reasoning_layer_used: POB lexical rationale
  rationale: “Vast” clearly conveys extraordinary greatness while preserving the camp image.
- pob_phrase: exceedingly dreadful
