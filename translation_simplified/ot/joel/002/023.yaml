translation:
  language: en
  text: Children of Zion, rejoice and be glad in Yahweh your God. He has given you the early-season rain for righteousness.[a][b] He sends rain down for you—the early-season and late-season rains, as he did before.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can also mean “the teacher for righteousness” or “the teacher of righteousness,” but the surrounding references to rain favor “early-season rain” here.
    reason: alternative_reading
  - marker: b
    text: The Hebrew literally says “for righteousness” and may also mean “in just measure” or “for your vindication.”
    reason: lexical_alternative
  - marker: c
    text: The Hebrew may instead mean “in the first month.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And you, children of Zion
  simplified_phrase: Children of Zion
  preserved_meaning: The people of Zion are addressed collectively, with the familial image preserved.
  reasoning_layer_used: Lexical decision for וּבְנֵי צִיּוֹן
  rationale: Removing the opening connector makes the direct address natural without changing its audience.
- pob_phrase: the early rain and the latter rain
  simplified_phrase: the early-season and late-season rains
  preserved_meaning: Both seasonal rains remain distinct parts of God’s restored provision.
  reasoning_layer_used: Lexical decision for מוֹרֶה וּמַלְקוֹשׁ
  rationale: Adding “season” makes the agricultural contrast clear to modern readers.
- pob_phrase: and he causes the rain to come down for you
  simplified_phrase: He sends rain down for you
  preserved_meaning: God remains the one who causes the rain to descend for the people.
  reasoning_layer_used: Lexical decision for וַיּוֹרֶד לָכֶם
  rationale: The shorter active wording expresses the same causative action in ordinary English.
translation_notes:
