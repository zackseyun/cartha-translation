  preserved_meaning: The people advances across the mountains as dawn spreads over them.
  reasoning_layer_used: Lexical decisions for כְּשַׁחַר and פָּרֻשׂ
  rationale: The recast clause reads naturally while preserving the dawn image.
- pob_phrase: Nothing like it has ever been from of old
  simplified_phrase: Nothing like it has ever appeared since ancient times
  preserved_meaning: No comparable event has occurred from the distant past until now.
  reasoning_layer_used: Lexical decision for לֹא נִהְיָה מִן הָעוֹלָם
  rationale: “Since ancient times” replaces an archaic and awkward expression.
- pob_phrase: through the years of generation after generation
  simplified_phrase: through generation after generation
  preserved_meaning: Nothing comparable will recur through an indefinitely long succession of generations.
  reasoning_layer_used: Lexical decision for עַד שְׁנֵי דּוֹר וָדוֹר and grounding review
  rationale: The wording stays clear while retaining the idiom’s open-ended emphasis.
