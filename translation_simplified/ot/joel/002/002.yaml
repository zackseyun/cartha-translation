translation:
  language: en
  text: A day of darkness and gloom, a day of clouds and thick darkness. Like dawn spreading over the mountains,[a] a great and mighty people[b] is coming. Nothing like it has ever appeared since ancient times, and nothing like it will come again through generation after generation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “like blackness spread over the mountains”; “like dawn” is more likely and pictures something spreading quickly across the hills.
    reason: lexical_alternative
  - marker: b
    text: This may be an invading army, a locust swarm pictured as an army, or a prophetic image blending both.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: like dawn spread over the mountains, a great and mighty people comes
