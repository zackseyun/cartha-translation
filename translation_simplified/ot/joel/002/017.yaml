translation:
  language: en
  text: Let the priests who serve Yahweh weep between the temple entrance and the altar. Let them pray, “Spare your people, Yahweh. Do not let your inheritance—your people—be publicly disgraced or become a mocking saying among the nations.[a] Why should the peoples say, ‘Where is their God?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may instead mean, “Do not hand your inheritance over to disgrace, for the nations to rule over them.”
    reason: alternative_reading
