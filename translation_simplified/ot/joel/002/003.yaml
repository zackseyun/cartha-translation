translation:
  language: en
  text: As it advances, fire devours what lies ahead, and flames blaze behind it. The land before it is like the garden of Eden, but the land it leaves behind becomes a desolate wilderness. Nothing escapes it.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “No survivor remains.” The Hebrew can emphasize either escape or a surviving remnant.
    reason: lexical_alternative
