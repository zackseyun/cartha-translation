translation:
  language: en
  text: I will send the northerner far away from you[a] and drive him into a dry, deserted land, with his front toward the eastern sea and his rear toward the western sea.[b] His stench and foul smell will rise, because he has done great things.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The northerner” may mean a northern army, pictured here as one person.
    reason: lexical_alternative
  - marker: b
    text: The eastern sea is probably the Dead Sea, and the western sea the Mediterranean Sea.
    reason: cultural_note
  - marker: c
    text: This may also mean “because he has acted arrogantly.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: remove the northerner far from you
  simplified_phrase: send the northerner far away from you
  preserved_meaning: God causes the personified northern enemy to be removed to a great distance.
  reasoning_layer_used: Lexical decision for אַרְחִיק and theological decision on the northerner
  rationale: “Send far away” expresses spatial removal in natural English.
- pob_phrase: a dry and desolate land
  simplified_phrase: a dry, deserted land
  preserved_meaning: The enemy is driven into a land marked by dryness and desolation.
  reasoning_layer_used: Lexical decision for אֶרֶץ צִיָּה וּשְׁמָמָה
  rationale: “Deserted” is more familiar while retaining the wasteland sense.
- pob_phrase: his front into the eastern sea and his rear into the western sea
  simplified_phrase: with his front toward the eastern sea and his rear toward the western sea
  preserved_meaning: The personified enemy is disposed with his front and rear toward opposite seas.
  reasoning_layer_used: Hebrew syntax and lexical decisions for פָּנָיו, סֹפוֹ, and the sea names
  rationale: “With” and “toward” clarify the enemy’s disposition without adding separate driving actions.
translation_notes:
