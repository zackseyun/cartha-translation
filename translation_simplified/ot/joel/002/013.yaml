translation:
  language: en
  text: Tear your hearts in repentance, not merely your garments, and return to Yahweh your God. He is gracious and compassionate. He is slow to anger, his steadfast love is great, and he relents from sending the disaster he has threatened.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Tear your hearts and not your garments
  simplified_phrase: Tear your hearts in repentance, not merely your garments
  preserved_meaning: True repentance must be inward rather than only an outward act of mourning.
  reasoning_layer_used: Lexical decision and immediate prophetic contrast
  rationale: The wording keeps the tearing image while making its inward meaning clear.
- pob_phrase: abundant in steadfast love
  simplified_phrase: his steadfast love is great
  preserved_meaning: Yahweh possesses abundant loyal, covenantal love.
  reasoning_layer_used: Lexical decision for רַב חֶסֶד
  rationale: The simpler clause retains the important term “steadfast love.”
- pob_phrase: relenting concerning the disaster
  simplified_phrase: relents from sending the disaster he has threatened
  preserved_meaning: God may withhold the announced judgment in response to repentance.
  reasoning_layer_used: Lexical rationale, theological decision, and POB footnote
  rationale: The active wording explains what relenting concerning disaster means here.
interpretive_expansions:
- pob_phrase: Tear your hearts
  rendering: Tear your hearts in repentance
  claim: The heart-tearing image calls for inward repentance.
  evidence:
  - The command is contrasted with tearing garments as an outward mourning practice.
  - The next command is to return to Yahweh.
  confidence: high
  alternatives_preserved:
  - The literal image of tearing the heart remains in the text.
- pob_phrase: relenting concerning the disaster
  rendering: relents from sending the disaster he has threatened
  claim: The disaster is announced judgment that God may withhold.
  evidence:
  - The POB footnote defines the phrase as withholding threatened judgment.
  - The lexical rationale identifies the disaster as punitive calamity.
  confidence: high
  alternatives_preserved:
  - The language still presents God as relenting without implying error or ignorance.
translation_notes:
  risk_flags:
  - risk: Adding “in repentance” interprets the heart image directly.
    mitigation: The garment contrast and command to return to Yahweh firmly establish this meaning.
  - risk: “Relents from sending” could be read as resolving how divine relenting works.
    mitigation: The wording preserves the biblical description without saying that God erred or learned.
