  preserved_meaning: Both celestial lights become dark.
  reasoning_layer_used: POB lexical decision for קָדָרוּ
  rationale: “Go dark” states the same change in more familiar English.
- pob_phrase: the stars withdraw their brightness
  simplified_phrase: the stars stop shining
  preserved_meaning: The stars cease giving their light.
  reasoning_layer_used: POB lexical decisions for אָסְפוּ and נָגְהָם
