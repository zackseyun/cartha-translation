  preserved_meaning: The earth and heavens are shaken in his presence.
  reasoning_layer_used: POB lexical decisions for לְפָנָיו, רָגְזָה, and רָעֲשׁוּ
  rationale: Ordinary English word order makes the two parallel disturbances easier to follow.
- pob_phrase: The sun and the moon grow dark
