translation:
  language: en
  text: Set apart a sacred time for fasting. Call a solemn assembly. Bring the elders and everyone who lives in the land[a] to the house of Yahweh your God, and cry out to Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “everyone who lives on the earth.” The Hebrew can mean either “land” or “earth,” but “land” fits this temple-centered call to the people of Judah.
    reason: alternative_reading
