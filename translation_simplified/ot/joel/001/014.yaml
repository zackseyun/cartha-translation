  rationale: This explains “consecrate” while preserving the fast’s sacred character.
- pob_phrase: call a solemn assembly
  simplified_phrase: Call a solemn assembly
  preserved_meaning: The command summons the community to a serious sacred gathering.
  reasoning_layer_used: Lexical decisions for קִרְאוּ and עֲצָרָה
  rationale: Retaining the phrase avoids specifying worship beyond what the noun states.
- pob_phrase: Gather the elders, all the inhabitants of the land
