  preserved_meaning: Animals living in the open country are also suffering.
  reasoning_layer_used: Lexical decision for בַּהֲמוֹת שָׂדֶה
  rationale: “Animals” is more common than “beasts” without limiting the phrase to livestock.
- pob_phrase: the channels of water have dried up
  simplified_phrase: the streams have dried up
  preserved_meaning: The drought has left the natural watercourses dry.
  reasoning_layer_used: Lexical decision for אֲפִיקֵי מָיִם
  rationale: “Streams” clearly expresses the contextual sense of the water channels.
- pob_phrase: fire has consumed the pastures of the wilderness
  simplified_phrase: fire has burned up the grazing lands in the wilderness
  preserved_meaning: Fire has completely destroyed the open land where animals feed.
  reasoning_layer_used: Lexical decisions for וְאֵשׁ אָכְלָה, נְאוֹת, and הַמִּדְבָּר
  rationale: “Burned up” and “grazing lands” make the destruction and agricultural setting immediately clear.
