translation:
  language: en
  text: Listen to this, you elders. Pay attention, all who live in the land.[a] Has this happened in your lifetime or in the time of your fathers?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “all who live on the earth.” The Hebrew can mean either “land” or “earth”; here the immediate context favors “land.”
    reason: lexical_alternative
  - marker: b
    text: Or “in the time of your ancestors.” The Hebrew says “your fathers.”
    reason: lexical_alternative
