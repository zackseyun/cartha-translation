  text: The grapevine has dried up, and the fig tree has withered. The pomegranate, the palm, and the apple tree[a] have also dried up. Every tree in the fields has dried up. Indeed, joy has dried up from the sons of man.[b]
  philosophy: optimal-equivalence
  footnotes:
