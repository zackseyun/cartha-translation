simplification_decisions:
- pob_phrase: I am stirring them up from the place where you sold them
  simplified_phrase: I am rousing them from the place where you sold them
  preserved_meaning: God actively rouses the people from the place where they were sold without adding a separate action.
  reasoning_layer_used: Lexical and theological decisions for מְעִירָם and מִן הַמָּקוֹם
  rationale: “Rousing” is common English and retains the broad source image.
- pob_phrase: I will return your recompense on your own head
  simplified_phrase: I will make what you have done come back on your own heads
  preserved_meaning: God will bring the offenders’ own wrongdoing back upon them as just retribution.
  reasoning_layer_used: Lexical and theological decisions for גְמֻלְכֶם בְּרֹאשְׁכֶם
  rationale: The wording avoids uncommon “recompense” while preserving reciprocal justice and the head image.
interpretive_expansions:
