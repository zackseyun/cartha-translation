translation:
  language: en
  text: And also, what business do you have with me, Tyre and Sidon, and all the regions of Philistia? Are you paying me back? If you deal out repayment against me, I will quickly, without delay, turn your repayment back on your own heads.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: what are you to me
  simplified_phrase: what business do you have with me
  preserved_meaning: The question remains a confrontational challenge to the addressed nations.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: The English idiom makes the hostile challenge clear while preserving its documented range.
- pob_phrase: Are you repaying me with recompense? If you are dealing out repayment against me
  simplified_phrase: Are you paying me back? If you deal out repayment against me
  preserved_meaning: The two clauses retain the repeated motif of retaliatory repayment.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Common wording replaces the opaque term “recompense” without weakening the direct threat.
- pob_phrase: swiftly and quickly I will return your repayment on your own head
  simplified_phrase: I will quickly, without delay, turn your repayment back on your own heads
  preserved_meaning: The paired urgency directly qualifies God's act of returning their intended repayment upon them.
  reasoning_layer_used: POB lexical decisions and theological decision
  rationale: Natural word order preserves both emphatic speed and the image of requital turning back.
translation_notes:
  risk_flags:
  - risk: “What business do you have with me?” is less formally literal than the Hebrew-shaped POB wording.
    mitigation: It preserves the documented confrontational force without narrowing the idiom.
  - risk: Replacing “recompense” with “paying me back” lowers the formal judicial register.
    mitigation: The repeated repayment language and “back on your own heads” retain the judicial-retaliatory force.
