translation:
  language: en
  text: On that day, the mountains will drip with sweet wine, and the hills will flow with milk. All Judah’s streambeds will flow with water. A spring will flow out from Yahweh’s house and water the Valley of Shittim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the valley of acacias” or “the Wadi of the Acacias.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And in that day
  simplified_phrase: On that day
  preserved_meaning: The phrase introduces the same future scene.
  reasoning_layer_used: POB lexical decision for וְהָיָה בַּיּוֹם הַהוּא
  rationale: The shorter wording keeps the biblical time formula in natural English.
- pob_phrase: and all the streambeds of Judah will flow with water
  simplified_phrase: All Judah’s streambeds will flow with water.
  preserved_meaning: Judah’s water channels will carry abundant water.
  reasoning_layer_used: POB lexical decisions for אֲפִיקֵי יְהוּדָה and יֵלְכוּ מָיִם
  rationale: A separate sentence and possessive form make the image easier to follow.
- pob_phrase: a spring will come out from the house of Yahweh and will water
  simplified_phrase: A spring will flow out from Yahweh’s house and water
  preserved_meaning: Water comes from Yahweh’s sanctuary to refresh the valley.
  reasoning_layer_used: POB lexical and theological decisions for מַעְיָן, מִבֵּית יְהוָה, and יְהוָה
  rationale: The active wording is smoother while retaining “house” and the divine name Yahweh.
translation_notes:
  risk_flags:
  - risk: “Yahweh’s house” may not immediately signal the temple to every reader.
    mitigation: The wording preserves POB’s chosen cultic image rather than replacing it with the interpretive term “temple.”
  - risk: Shittim can be understood as either a place name or a reference to acacias.
    mitigation: The main text keeps POB’s probable place name, and the footnote preserves the lexical alternatives.
