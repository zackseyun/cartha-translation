translation:
  language: en
  text: Hurry and come, all you nations from every direction. Gather together there. Bring your mighty ones down, Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mighty ones” means Yahweh’s powerful agents, but the Hebrew does not say whether they are human or heavenly.
    reason: alternative_reading
