translation:
  language: en
  text: But Judah will always remain inhabited, and so will Jerusalem, through every generation.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be translated, “Judah will dwell forever.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: will be inhabited forever
  simplified_phrase: will always remain inhabited
  preserved_meaning: Judah will continue to be a settled land into the indefinite future.
  reasoning_layer_used: Lexical decision for תֵּשֵׁב and לְעוֹלָם
  rationale: “Always remain inhabited” expresses enduring settlement in direct modern English.
- pob_phrase: and Jerusalem from generation to generation
  simplified_phrase: and so will Jerusalem, through every generation
  preserved_meaning: The promise of continuing habitation also applies to Jerusalem across successive generations.
  reasoning_layer_used: Lexical decision for וִירוּשָׁלִַם and לְדֹור וָדֹור
  rationale: Supplying “so will” makes the parallel clause complete and easy to follow.
translation_notes:
  risk_flags:
  - risk: “Remain inhabited” may sound limited to continuous population rather than the broader Hebrew sense of dwelling or remaining.
    mitigation: The footnote preserves the more literal alternative “will dwell.”
  - risk: Readers may assume a specific literal or symbolic fulfillment of the promise.
    mitigation: The text leaves the promise’s mode and horizon undefined, as the Hebrew and POB do.
