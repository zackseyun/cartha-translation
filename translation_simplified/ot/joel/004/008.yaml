translation:
  language: en
  text: I will sell your sons and daughters into the power of the people of Judah. They will sell them to the people of Sheba[a], a distant nation, for Yahweh has spoken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally called the Sabeans.
    reason: cultural_note
simplification_decisions:
- pob_phrase: into the hand of the sons of Judah
  simplified_phrase: into the power of the people of Judah
  preserved_meaning: They will be transferred into the control of Judah’s people.
  reasoning_layer_used: lexical decisions for בְּיַד and בְּנֵי יְהוּדָה
  rationale: This states the idiom’s meaning and avoids making the collective group sound merely genealogical.
- pob_phrase: to the Sabeans
  simplified_phrase: to the people of Sheba
  preserved_meaning: The buyers are the people associated with Sheba.
  reasoning_layer_used: lexical decision and cultural note for לִשְׁבָאִים
  rationale: The familiar place name identifies this ancient people more clearly.
- pob_phrase: And I will sell ... and they will sell
  simplified_phrase: I will sell ... They will sell
  preserved_meaning: Yahweh first sells them to Judah’s people, who then sell them far away.
  reasoning_layer_used: source syntax and repeated מכר lexical decisions
  rationale: Two sentences clarify the sequence while retaining both acts of selling.
translation_notes:
  risk_flags:
  - risk: “Sell” describes severe retributive judgment and may sound harsh.
    mitigation: It is retained because the repeated commercial reversal is central to the source imagery.
