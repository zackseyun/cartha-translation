translation:
  language: en
  text: For you took my silver and gold and carried my precious possessions into your temples.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “palaces.” The Hebrew word can mean either temples or palaces; temples is preferred because the context points to sacred property being placed in the nations’ places of worship.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: because you took
  simplified_phrase: For you took
  preserved_meaning: The theft is presented as the reason for the judgment described in context.
  reasoning_layer_used: Lexical decision for אֲשֶׁר
  rationale: “For” gives the causal link in natural English while allowing the verse to read smoothly.
- pob_phrase: my silver and my gold
  simplified_phrase: my silver and gold
  preserved_meaning: Both the silver and the gold belong to God.
  reasoning_layer_used: Lexical decisions for כַּסְפִּי and וּזְהָבִי
  rationale: One possessive naturally applies to both coordinated nouns in English.
- pob_phrase: brought my precious things
  simplified_phrase: carried my precious possessions
  preserved_meaning: They moved God's valuable belongings into their own buildings.
  reasoning_layer_used: Lexical decisions and latest revision pass
  rationale: “Possessions” makes the material sense clear without narrowing the items to treasures.
