translation:
  language: en
  text: I will gather all the nations and bring them down to the Valley of Jehoshaphat.[a] There I will call them to account in judgment on behalf of Israel, my people and my inheritance.[b] They scattered my people among the nations and divided up my land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The Valley of Jehoshaphat” is a place name that may echo the idea “the LORD judges.”
    reason: cultural_note
  - marker: b
    text: The Hebrew may also mean “because of” or “concerning” my people and my inheritance, Israel.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: there I will enter into judgment with them
  simplified_phrase: There I will call them to account in judgment
  preserved_meaning: The LORD enters a judicial confrontation with the nations rather than merely announcing a verdict.
  reasoning_layer_used: lexical decision for וְנִשְׁפַּטְתִּי עִמָּם
  rationale: The common phrase “call them to account” makes the legal action clear while “in judgment” preserves its judicial force.
- pob_phrase: my people and my inheritance, Israel
  simplified_phrase: Israel, my people and my inheritance
  preserved_meaning: Israel is identified as both the LORD’s people and his covenantal inheritance.
  reasoning_layer_used: theological decision for נַחֲלָתִי
  rationale: Placing “Israel” first makes the identification easier to follow without weakening the covenant term “inheritance.”
- pob_phrase: whom they scattered among the nations and divided up my land
  simplified_phrase: They scattered my people among the nations and divided up my land.
  preserved_meaning: The nations dispersed Israel and partitioned the LORD’s land.
  reasoning_layer_used: lexical decisions for פִּזְּרוּ and חִלֵּקוּ
  rationale: A new sentence with an explicit object removes the difficult relative clause while keeping both offenses distinct.
translation_notes:
  risk_flags:
  - risk: “Call them to account” could be heard as less formal than a judicial proceeding.
    mitigation: The words “in judgment” retain the explicit courtroom force.
