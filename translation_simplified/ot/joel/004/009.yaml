translation:
  language: en
  text: 'Announce this among the nations: Set war apart as sacred.[a] Rouse the warriors! Let all the fighting men approach; let them come up.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Prepare for war.” The Hebrew describes war with language used for consecrating something.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Proclaim this among the nations
  simplified_phrase: Announce this among the nations
  preserved_meaning: A public summons is issued broadly among foreign peoples.
  reasoning_layer_used: POB lexical decisions for קִרְאוּ and בַּגּוֹיִם
  rationale: “Announce” makes the formal public declaration readily understandable.
- pob_phrase: Consecrate war
  simplified_phrase: Set war apart as sacred
  preserved_meaning: The war is consecrated rather than merely prepared.
  reasoning_layer_used: POB lexical and theological decisions for קַדְּשׁוּ מִלְחָמָה
  rationale: This explains the cultic image without assigning the war a sacred purpose.
- pob_phrase: Let all the men of war draw near; let them come up
  simplified_phrase: Let all the fighting men approach; let them come up
  preserved_meaning: All male combatants receive two successive summonses to approach and come up.
  reasoning_layer_used: POB lexical decisions for יִגְּשׁוּ, יַעֲלוּ, and כֹּל אַנְשֵׁי הַמִּלְחָמָה
  rationale: Familiar wording improves clarity while separate clauses preserve both movements.
interpretive_expansions:
- pob_phrase: Consecrate war
  rendering: Set war apart as sacred
  claim: Consecration marks the war as set apart in a sacred or cultic sense.
  evidence:
  - The POB lexical rationale defines קדשׁ as “set apart/consecrate.”
  - The POB theological decision requires the cultic undertone to remain.
  confidence: high
  alternatives_preserved:
  - Prepare for war
translation_notes:
  risk_flags:
  - risk: “As sacred” could be mistaken for moral approval of the nations’ war.
    mitigation: The text states consecration without adding approval or purpose, while the footnote preserves the idiomatic sense.
