translation:
  language: en
  text: Jacob’s people will be a fire, and Joseph’s people will be a flame. Esau’s people will be like dry stalks left after harvest. Together, Jacob’s and Joseph’s people will burn through them and consume them. No one among Esau’s people will survive, because Yahweh has spoken.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the house of Jacob ... the house of Joseph ... the house of Esau
  simplified_phrase: Jacob’s people ... Joseph’s people ... Esau’s people
  preserved_meaning: Each patriarchal house represents a corporate people, not merely a household.
  reasoning_layer_used: POB theological decisions
  rationale: The clearer wording states the national sense already established by the POB context.
- pob_phrase: stubble
  simplified_phrase: dry stalks left after harvest
  preserved_meaning: Esau’s people are pictured as dry field residue that fire quickly consumes.
  reasoning_layer_used: POB lexical decisions
  rationale: The concrete image is retained while an unfamiliar agricultural term is explained.
- pob_phrase: They will burn them and consume them
  simplified_phrase: Together, Jacob’s and Joseph’s people will burn through them and consume them
  preserved_meaning: The Israelite groups act as the fire and flame that completely destroy Esau’s people.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Naming the agents removes pronoun ambiguity without weakening the destructive fire image.
interpretive_expansions:
- pob_phrase: They will burn them
  rendering: Together, Jacob’s and Joseph’s people will burn through them
  claim: The two named Israelite groups act together in judgment against Esau’s people.
  evidence:
  - The parallel fire and flame images present Jacob and Joseph as aligned agents.
  - The POB theological decision identifies these corporate groups as acting together in judgment.
  confidence: high
  alternatives_preserved:
  - The compact Hebrew may also be rendered as setting them ablaze or blazing against them.
translation_notes:
  risk_flags:
  - risk: Replacing the repeated prophetic term “house” may reduce the visible family-line idiom.
    mitigation: The repeated possessive “people” preserves the corporate descent groups in immediately clear English.
  - risk: “Burn through them” interprets the flexible Hebrew preposition in a hostile, destructive sense.
    mitigation: The fire, flame, dry-stalk, and consume imagery strongly bounds this reading, while the audit preserves the lexical alternatives.
