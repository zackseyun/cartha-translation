translation:
  language: en
  text: Teman, your warriors will be shattered.[a] This will happen so that every man from the mountain of Esau may be cut off through slaughter.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “will be terrified” or “will be broken”; the Hebrew can describe both panic and ruin.
    reason: lexical_alternative
  - marker: b
    text: Teman was a region or city of Edom. The last clause may also be translated, “everyone from the mountain of Esau will be cut off in the slaughter.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: your mighty men
  simplified_phrase: your warriors
  preserved_meaning: Teman’s strong fighting men are the ones facing judgment.
  reasoning_layer_used: Lexical decision for גִבּוֹרֶיךָ
  rationale: “Warriors” states the military sense directly in common English.
- pob_phrase: your mighty men, Teman
  simplified_phrase: Teman, your warriors
  preserved_meaning: Teman remains the place directly addressed in the judgment oracle.
  reasoning_layer_used: Lexical decision for תֵּימָן and source correction against adding “O”
  rationale: Moving the place name first makes the direct address immediately clear.
- pob_phrase: so that every man ... may be cut off by slaughter
  simplified_phrase: This will happen so that every man ... may be cut off through slaughter
  preserved_meaning: The warriors’ collapse leads into the purpose of total male loss by slaughter.
  reasoning_layer_used: Lexical decisions for לְמַעַן, יִכָּרֶת, אִישׁ, and מִקָּטֶל
  rationale: A new sentence clarifies the connection while preserving the purpose clause and final ambiguity.
translation_notes:
  risk_flags:
  - risk: “Shattered” may sound only physical and hide the possible sense of terror.
    mitigation: Footnote [a] preserves both panic and ruin.
  - risk: “Through slaughter” favors the sense that slaughter is the means.
    mitigation: Footnote [b] preserves the alternative “in the slaughter.”
