translation:
  language: en
  text: But on Mount Zion there will be deliverance,[a] and the mountain will be holy. The people of Jacob will take possession of what belongs to them.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “there will be survivors”; the Hebrew can refer either to deliverance or to those who escape.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may instead mean, “The people of Jacob will dispossess those who dispossessed them.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: and it will be holy
  simplified_phrase: and the mountain will be holy
  preserved_meaning: Mount Zion is the place set apart as holy.
  reasoning_layer_used: POB lexical decision on וְהָיָה קֹדֶשׁ
  rationale: Naming the mountain removes an unclear pronoun without changing its referent.
- pob_phrase: the house of Jacob
  simplified_phrase: the people of Jacob
  preserved_meaning: Jacob’s descendants, the covenant people of Israel, are in view.
  reasoning_layer_used: POB lexical decision on בֵּית יַעֲקֹב
  rationale: “People of Jacob” makes the national expression clear to readers unfamiliar with prophetic idiom.
- pob_phrase: will possess their possessions
  simplified_phrase: will take possession of what belongs to them
  preserved_meaning: Jacob’s people will regain what is rightfully theirs.
  reasoning_layer_used: POB lexical decisions on וְיָרְשׁוּ and אֵת מוֹרָשֵׁיהֶם
  rationale: The recast avoids awkward repetition while preserving the restoration meaning.
translation_notes:
  risk_flags:
  - risk: “People of Jacob” reduces the formal covenantal force of “house of Jacob.”
    mitigation: The wording retains Jacob’s name and the audit identifies Israel as the covenant people.
  - risk: The main text could obscure the agentive reading about dispossessors.
    mitigation: Footnote b preserves that significant alternative without overriding the chosen reading.
