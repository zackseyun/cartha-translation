  text: On the day strangers carried away Jerusalem’s wealth,[a] and foreigners entered the city’s gates and cast lots over Jerusalem, you stood aside. You too were like one of them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “wealth” can also mean “army” or “strength.”
    reason: lexical_alternative
