  preserved_meaning: Edom’s refusal to intervene made it morally like Jerusalem’s attackers.
  reasoning_layer_used: POB theological decision on עמד מנגד and lexical decision on כְּאַחַד מֵהֶם
  rationale: Two direct sentences preserve the accusation while making the sequence easier to read.
