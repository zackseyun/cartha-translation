translation:
  language: en
  text: The pride in your heart has deceived you. You live high up in rocky crevices[a], and you tell yourself, “Who will bring me down to the ground?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: These rocky crevices served as well-protected cliff dwellings.
