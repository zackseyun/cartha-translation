  text: People from the Negev will possess Esau’s hill country. People from the Shephelah lowlands will possess the land of the Philistines. They will also possess the territories of Ephraim and Samaria, and the people of Benjamin will possess Gilead.[a]
  philosophy: optimal-equivalence
  footnotes:
