translation:
  language: en
  text: Do not gloat over your brother when misfortune comes upon him.[a] Do not rejoice over the sons of Judah when destruction comes upon them. Do not open your mouth in arrogant boasting in a time of distress.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “when he becomes estranged” or “when calamity comes upon him.”
    reason: lexical_alternative
