translation:
  language: en
  text: If thieves came to you, or robbers came at night—yet look how you have been ruined![a]—wouldn’t they steal only enough for themselves? If grape pickers came to you, wouldn’t they leave a few grapes behind?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “how you have been destroyed” or “how you have been cut off.”
    reason: lexical_alternative
