  preserved_meaning: Violent plunderers arrive during the night.
  reasoning_layer_used: POB lexical decision for שֹׁדְדֵי לַיְלָה
  rationale: The clause is recast in ordinary English while retaining both robbery and nighttime.
- pob_phrase: how you have been destroyed!
  simplified_phrase: yet look how you have been ruined!
  preserved_meaning: The prophet breaks into a lament over Edom’s devastation.
  reasoning_layer_used: POB lexical rationale for אֵיךְ נִדְמֵיתָה
  rationale: “Ruined” is an approved alternative, and “look how” preserves the force of the outcry.
- pob_phrase: grape gatherers ... leave gleanings
  simplified_phrase: grape pickers ... leave a few grapes behind
  preserved_meaning: Even those harvesting grapes leave some remaining fruit.
  reasoning_layer_used: POB lexical decisions for בֹּצְרִים and יַשְׁאִירוּ עֹלֵלוֹת
  rationale: The concrete grape image remains while the unfamiliar term “gleanings” is explained directly.
