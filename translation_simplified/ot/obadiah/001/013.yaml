translation:
  language: en
  text: Do not go through the gate into my people’s city on the day disaster strikes them.[a] You too must not gloat over his calamity on the day disaster strikes him. Do not seize his wealth[b] on the day disaster strikes him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew shifts here from “them” to “him,” speaking first of the people and then of the nation as one person.
    reason: simplification_note
  - marker: b
    text: Or “his army,” “his strength,” or “his resources”; in this setting, “wealth” most likely refers to what invaders could plunder.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: enter the gate of my people
  simplified_phrase: go through the gate into my people’s city
  preserved_meaning: The city gate remains the concrete point of entry into the people’s city.
  reasoning_layer_used: POB lexical decision for שַׁעַר
  rationale: The added destination makes the gate image immediately understandable.
- pob_phrase: in the day of their disaster
  simplified_phrase: on the day disaster strikes them
  preserved_meaning: The action occurs during the people’s time of disaster.
  reasoning_layer_used: POB lexical decision for אֵיד
  rationale: The active wording is clearer while preserving the repeated disaster refrain.
- pob_phrase: do not lay hands on his wealth
  simplified_phrase: do not seize his wealth
  preserved_meaning: Edom must not take the nation’s possessions during its downfall.
  reasoning_layer_used: POB lexical decisions for שׁלח and חַיִל
  rationale: “Seize” states the hostile act plainly without adding a new action.
interpretive_expansions:
