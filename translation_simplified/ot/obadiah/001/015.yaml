translation:
  language: en
  text: For the day of Yahweh is near, when judgment will come upon all the nations.[a] What you have done will be done to you. The repayment you deserve will come back on your own head.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “judgment will come against all the nations.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the day of Yahweh is near upon all the nations
  simplified_phrase: the day of Yahweh is near, when judgment will come upon all the nations
  preserved_meaning: Yahweh’s decisive day of judgment is imminent and extends to every nation.
  reasoning_layer_used: Lexical and theological decisions on the day of Yahweh and its scope.
  rationale: The added clause explains the biblical expression while retaining Yahweh’s name and the universal scope.
- pob_phrase: your recompense
  simplified_phrase: the repayment you deserve
  preserved_meaning: Edom will receive a just response to its own actions.
  reasoning_layer_used: Lexical decision for גְּמֻלְךָ and the retributive-justice decision.
  rationale: Common wording replaces an uncommon legal term without making the outcome sound like impersonal karma.
- pob_phrase: will return on your own head
  simplified_phrase: will come back on your own head
  preserved_meaning: The consequences will fall upon the responsible offender.
  reasoning_layer_used: Lexical decision for יָשׁוּב and the preserved Hebrew image in בְּרֹאשֶׁךָ.
  rationale: The natural verb “come back” keeps the force of the consequence returning upon the offender.
