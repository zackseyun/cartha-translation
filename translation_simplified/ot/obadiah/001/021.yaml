translation:
  language: en
  text: Deliverers[a] will climb Mount Zion to judge Esau’s hill country.[b] The kingdom will belong to the LORD.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Saviors”; these are human agents who bring deliverance under the LORD’s rule.
    reason: lexical_alternative
  - marker: b
    text: Esau’s hill country likely refers to the mountainous territory of Edom; it may also be translated “Mount Esau.”
    reason: lexical_alternative
  - marker: c
    text: Or “The kingship” or “The dominion will be the LORD’s.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: will go up on Mount Zion
  simplified_phrase: will climb Mount Zion
  preserved_meaning: The deliverers make a concrete ascent to Mount Zion.
  reasoning_layer_used: Lexical decision for וְעָלוּ
  rationale: “Climb” expresses the physical ascent in direct, natural English.
- pob_phrase: the hill country of Esau
  simplified_phrase: Esau’s hill country
  preserved_meaning: The phrase refers most likely to Esau’s mountainous territory while retaining the geographic image.
  reasoning_layer_used: Lexical decision and footnote for אֶת הַר עֵשָׂו
  rationale: The possessive form is easier to read without resolving the documented ambiguity.
- pob_phrase: and the kingdom will belong to Yahweh
  simplified_phrase: The kingdom will belong to the LORD.
  preserved_meaning: The closing declaration affirms the LORD’s sovereign royal rule.
  reasoning_layer_used: Lexical and theological decisions for לַיהוָה and הַמְּלוּכָה
  rationale: A separate sentence highlights the climax and follows the audited divine-name policy.
translation_notes:
  risk_flags:
