translation:
  language: en
  text: All your covenant partners have sent you to the border.[a] Those who were at peace with you have deceived and overcome you. Those who eat your bread have set a trap beneath you.[b] There is no understanding in him.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may mean that they escorted you to the border or drove you out to it.
    reason: lexical_alternative
  - marker: b
    text: The rare Hebrew word may also mean “snare.”
    reason: lexical_alternative
  - marker: c
    text: The Hebrew referent is unclear; this may describe Edom, or it may mean there is no understanding in the situation.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: All the men of your covenant
  simplified_phrase: All your covenant partners
  preserved_meaning: These people were bound to Edom by covenant or treaty.
  reasoning_layer_used: Lexical decision for אַנְשֵׁי בְרִיתֶךָ
  rationale: “Covenant partners” keeps the binding covenant idea in ordinary English.
- pob_phrase: the men at peace with you have deceived you and prevailed against you
  simplified_phrase: Those who were at peace with you have deceived and overcome you
  preserved_meaning: Edom’s peaceful associates betrayed and defeated it.
  reasoning_layer_used: Lexical decisions for אַנְשֵׁי שְׁלֹמֶךָ and יָכְלוּ לְךָ
  rationale: The wording is natural English without reducing the relationship to friendship.
- pob_phrase: Those who eat your bread have set a trap under you
  simplified_phrase: Those who eat your bread have set a trap beneath you
  preserved_meaning: People who shared Edom’s food secretly betrayed it.
  reasoning_layer_used: Lexical decisions for לַחְמְךָ and מָזוֹר תַּחְתֶּיךָ
  rationale: The wording retains both the bread image and the hidden-trap image.
