translation:
  language: en
  text: Yahweh declares, “On that day, will I not destroy the wise men of Edom and take away understanding from the mountain of Esau?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “Mount Esau” or “the hill country of Esau.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Will I not, on that day, declares Yahweh
  simplified_phrase: Yahweh declares, “On that day, will I not
  preserved_meaning: Yahweh announces his coming judgment through a rhetorical question expecting yes.
  reasoning_layer_used: POB lexical decision for הֲלֹוא and prophetic formula נְאֻם יְהוָה
  rationale: Moving the speech tag to the front makes the sentence easier to follow without flattening the question.
- pob_phrase: destroy the wise men from Edom
  simplified_phrase: destroy the wise men of Edom
  preserved_meaning: Yahweh will destroy Edom’s recognized male wise class.
  reasoning_layer_used: POB lexical and theological decisions for חֲכָמִים and וְהַאֲבַדְתִּי
  rationale: The possessive relationship sounds natural while retaining both the strong judgment verb and the masculine social category.
- pob_phrase: and understanding from the mountain of Esau
  simplified_phrase: and take away understanding from the mountain of Esau
  preserved_meaning: Yahweh will remove discernment from Esau’s mountainous region.
  reasoning_layer_used: POB lexical decisions for וּתְבוּנָה and מֵהַר עֵשָׂו
  rationale: Repeating the verbal idea as “take away” makes the parallel clause clear while preserving the mountain image.
translation_notes:
  risk_flags:
