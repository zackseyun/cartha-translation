translation:
  language: en
  text: 'Obadiah’s vision.


    This is what the Lord GOD says about Edom:


    “We have heard a report from Yahweh, and a messenger has been sent among the nations: ‘Rise up! Let us rise against her[a] for battle.’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Her” refers to Edom as a nation; it may also be translated “it.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew does not identify who speaks in “we have heard” and “let us rise.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: The vision of Obadiah
  simplified_phrase: Obadiah’s vision
  preserved_meaning: The opening identifies the revelation received by the prophet Obadiah.
  reasoning_layer_used: Lexical decision for חֲזוֹן and standard treatment of personal names
  rationale: The possessive form is more natural while retaining the prophetic term “vision.”
- pob_phrase: Thus says the Lord GOD concerning Edom
  simplified_phrase: This is what the Lord GOD says about Edom
  preserved_meaning: The Lord GOD introduces a prophetic message whose subject is Edom.
  reasoning_layer_used: Lexical decisions for כֹּה אָמַר, אֲדֹנָי יְהוִה, and לֶאֱדוֹם
  rationale: Common syntax replaces the formal prophetic formula without weakening its authority.
- pob_phrase: Rise up, and let us rise against her for battle
  simplified_phrase: Rise up! Let us rise against her for battle.
  preserved_meaning: The nations receive an urgent summons to join in battle against Edom.
  reasoning_layer_used: Lexical decisions for קוּמוּ, וְנָקוּמָה, עָלֶיהָ, and לַמִּלְחָמָה
  rationale: Two short commands make the martial urgency and distinct plural forms easier to follow.
translation_notes:
  risk_flags:
  - risk: Modern readers may not know that “her” refers to Edom.
    mitigation: A footnote identifies the referent and preserves the alternative “it.”
  - risk: Readers may assume a specific speaker for the first-person plurals.
    mitigation: A footnote preserves the Hebrew ambiguity without choosing among possible speakers.
