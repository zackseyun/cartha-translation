simplification_decisions:
- pob_phrase: in my integrity you have upheld me
  simplified_phrase: you have held me steady as I live with integrity
  preserved_meaning: God supports the psalmist in a life marked by moral uprightness, not sinless perfection.
  reasoning_layer_used: lexical and theological decisions
  rationale: This makes the stabilizing support clear while retaining the qualified claim of integrity.
- pob_phrase: you have set me before your face
  simplified_phrase: You have placed me in your presence
  preserved_meaning: God establishes the psalmist in his own presence.
  reasoning_layer_used: lexical decision and POB footnote
  rationale: “In your presence” states the recognized meaning of the concrete Hebrew expression in natural English.
- pob_phrase: and you have set me
  simplified_phrase: You have placed me
  preserved_meaning: God is the one who gives the psalmist his enduring place.
  reasoning_layer_used: lexical decision
  rationale: A new sentence and the common verb “placed” make the clause easier to follow.
interpretive_expansions:
- pob_phrase: in my integrity
  rendering: as I live with integrity
  claim: Integrity describes the psalmist’s upright manner of life rather than absolute sinlessness.
  evidence:
  - The POB lexical rationale defines the term as integrity, completeness, or blamelessness.
  - The POB theological decision rejects absolute sinlessness and meritorious perfection.
  confidence: high
  alternatives_preserved:
  - because of my integrity
  - in my blamelessness
translation_notes:
  risk_flags:
