translation:
  language: en
  text: But as for me, you have held me steady as I live with integrity.[a] You have placed me in your presence forever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “because of my integrity” or “in my blamelessness.”
