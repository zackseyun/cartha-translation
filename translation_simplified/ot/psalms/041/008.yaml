  simplified_phrase: Something destructive has come down on him
  preserved_meaning: An unspecified ruinous evil has come upon him, without deciding whether it is an affliction or an accusation.
  reasoning_layer_used: Lexical decisions and theological ambiguity ruling
  rationale: The wording uses common English while preserving both the downward image and the Hebrew ambiguity.
- pob_phrase: now that he has lain down
  simplified_phrase: Now that he is lying there
  preserved_meaning: He is already in a weakened, bedridden, or laid-low condition.
  reasoning_layer_used: Lexical decision and final source audit
  rationale: The present state is clearer in English without specifying illness or death.
- pob_phrase: he will not rise again
  simplified_phrase: he will never get up again
  preserved_meaning: His enemies expect that he will not recover from being laid low.
  reasoning_layer_used: Lexical decision and immediate context
  rationale: Get up is more direct for common readers and retains the image of rising.
