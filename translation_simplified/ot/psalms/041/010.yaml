simplification_decisions:
- pob_phrase: be gracious to me
  simplified_phrase: show me favor
  preserved_meaning: The psalmist asks Yahweh to treat him with gracious favor.
  reasoning_layer_used: POB lexical decision for חָנֵּנִי
  rationale: “Show me favor” makes the plea immediately understandable without reducing it to pity alone.
- pob_phrase: that I may repay them
  simplified_phrase: so that I may repay them
  preserved_meaning: The psalmist seeks restoration with a view to repaying his opponents.
  reasoning_layer_used: POB lexical and theological decisions for וַאֲשַׁלְּמָה
  rationale: “So that” states the purpose relation naturally while retaining the verse’s judicial edge.
translation_notes:
  risk_flags:
  - risk: “Raise me up” could be mistaken for a specific reference to resurrection.
    mitigation: The concrete source image is retained because the psalm’s illness context naturally suggests restoration without limiting the phrase to it.
  - risk: “Repay them” may sound like a fully specified act of personal revenge.
