simplification_decisions:
- pob_phrase: keep him and preserve his life
  simplified_phrase: watch over him and keep him alive
  preserved_meaning: Yahweh guards him and preserves his life.
  reasoning_layer_used: Lexical decisions for יִשְׁמְרֵהוּ and וִיחַיֵּהוּ.
  rationale: The wording avoids repetition and states the preservation of life directly.
- pob_phrase: he will be called blessed in the land
  simplified_phrase: In the land, people will call him blessed
  preserved_meaning: Others will regard and declare him blessed within the land.
  reasoning_layer_used: Lexical decisions for יאשר and בָּאָרֶץ.
  rationale: The active sentence makes the implied speakers clear while retaining the declarative sense.
- pob_phrase: may you not give him over to the desire of his enemies
  simplified_phrase: Yahweh, do not hand him over to what his enemies want
  preserved_meaning: The psalmist asks Yahweh not to surrender him to his enemies’ hostile desire.
  reasoning_layer_used: Theological decision on the second-person prayer and lexical decisions for תִּתְּנֵהוּ and בְּנֶפֶשׁ.
  rationale: Direct address preserves the shift to prayer, and the wording clarifies the idiom without implying unrestricted action.
