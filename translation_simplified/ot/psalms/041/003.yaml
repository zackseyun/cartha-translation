simplification_decisions:
- pob_phrase: on his sickbed
  simplified_phrase: while he lies sick in bed
  preserved_meaning: He is in bed because of illness.
  reasoning_layer_used: Lexical decision for עֶרֶשׂ דְּוָי
  rationale: The clause replaces the compact term “sickbed” with familiar wording.
- pob_phrase: you turn his whole bed over
  simplified_phrase: you turn his whole bed over
  preserved_meaning: The concrete turning image and its uncertain implication remain intact.
  reasoning_layer_used: Applied revision and lexical decision for הָפַכְתָּ
  rationale: The difficult image is retained because replacing it with “restore” would overstate its meaning.
- pob_phrase: Yahweh will sustain him ... you turn
  simplified_phrase: Yahweh will sustain him ... you turn
  preserved_meaning: The verse shifts from speaking about God to addressing him directly.
  reasoning_layer_used: Theological decision on the addressee shift
  rationale: The poetic shift is preserved rather than smoothed into one grammatical person.
translation_notes:
  risk_flags:
  - risk: Readers may take turning the bed over as a literal act without recognizing the uncertain idiom.
    mitigation: The footnote gives the likely caregiving and broader restorative possibilities without choosing between them.
  - risk: The shift from “Yahweh” to “you” may appear grammatically abrupt.
    mitigation: It remains because the Hebrew deliberately moves from statement to direct address.
