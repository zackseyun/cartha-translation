translation:
  language: en
  text: 'Know this: Yahweh has set apart the godly for himself.[a] Yahweh hears me when I call to him.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “has set apart the faithful one for himself.” The Hebrew can describe covenant faithfulness or godly devotion.
    reason: lexical_alternative
  - marker: b
    text: Or “Yahweh will hear me when I call to him.” The Hebrew can express either his usual response or confident assurance about the future.
    reason: lexical_alternative
