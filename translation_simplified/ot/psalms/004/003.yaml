translation:
  language: en
  text: 'Understand this: Yahweh has set the godly apart as his own.[a] He hears me when I call to him.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “has marked out the faithful one as his own.” The Hebrew describes someone devoted and loyal to God.
    reason: lexical_alternative
  - marker: b
    text: Or “He will hear me when I call to him.” The Hebrew can describe either what Yahweh regularly does or what he will certainly do.
    reason: lexical_alternative
