translation:
  language: en
  text: When I call to you, answer me, O God of my righteousness.[a] When distress closed in around me, you made room for me. Show me your favor and listen to my prayer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean “my righteous God” or “God who vindicates me.” The Hebrew literally says “God of my righteousness.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: When I call
  simplified_phrase: When I call to you
  preserved_meaning: The psalmist addresses his call directly to God.
  reasoning_layer_used: POB lexical decision for בְּקָרְאִי
  rationale: Adding “to you” makes the prayer relationship explicit from the immediate address.
- pob_phrase: In distress you have made room for me
  simplified_phrase: When distress closed in around me, you made room for me
  preserved_meaning: God delivered the psalmist from constricting trouble while the Hebrew spatial image remains intact.
  reasoning_layer_used: POB lexical decisions for בַּצָּר and הִרְחַבְתָּ לִּי
  rationale: The recast sentence helps readers understand how distress and spacious relief form one image.
- pob_phrase: Be gracious to me and hear my prayer
  simplified_phrase: Show me your favor and listen to my prayer
  preserved_meaning: The psalmist asks God to grant favor and attend to his prayer.
  reasoning_layer_used: POB lexical decisions for חָנֵּנִי and וּשְׁמַע
  rationale: Common verbal phrases replace less transparent prayer language without weakening either request.
interpretive_expansions:
- pob_phrase: In distress
  rendering: When distress closed in around me
  claim: The distress is pictured as a constricting situation surrounding the psalmist.
  evidence:
  - The POB notes that צַר can denote a tight place or straits.
  - The paired verb רחב means to make broad or wide.
  confidence: high
  alternatives_preserved:
  - In distress
  - In a tight place
