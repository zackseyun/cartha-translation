translation:
  language: en
  text: Answer me when I call, O God of my righteousness.[a] When trouble hemmed me in, you made room for me.[b] Show me your favor and hear my prayer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “my righteous God” or “God who vindicates me.” The Hebrew literally says “God of my righteousness.”
    reason: alternative_reading
  - marker: b
    text: Or “you gave me relief.” The Hebrew pictures God creating open space when trouble closes in.
    reason: lexical_alternative
