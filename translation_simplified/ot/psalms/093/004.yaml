translation:
  language: en
  text: Yahweh on high is more majestic than the roar of vast waters, than the mighty crashing waves of the sea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Or: “The sounds of the great waters and the breakers of the sea are mighty; Yahweh is mighty on high.”'
