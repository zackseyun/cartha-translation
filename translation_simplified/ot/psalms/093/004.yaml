  preserved_meaning: The comparison retains the audible power of a great body of water.
  reasoning_layer_used: Lexical decision for מִקֹּלוֹת מַיִם רַבִּים
  rationale: “Roar” and “vast waters” make the image clear in modern English.
- pob_phrase: the mighty breakers of the sea
  simplified_phrase: the mighty crashing waves of the sea
  preserved_meaning: The sea’s breaking waves remain a vivid image of immense natural power.
  reasoning_layer_used: Lexical decision for מִשְׁבְּרֵי יָם
  rationale: “Crashing waves” is more familiar than “breakers” while preserving the image.
- pob_phrase: More majestic than ... is Yahweh on high
  simplified_phrase: Yahweh on high is more majestic than
  preserved_meaning: Yahweh’s exalted majesty is directly compared with and surpasses both water images.
