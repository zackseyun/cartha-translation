translation:
  language: en
  text: Yahweh reigns.[a] He is clothed in majesty. Yahweh wears strength like clothing and has wrapped strength around himself. Yes, the world stands firm; it will not be shaken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Yahweh has become king”; here the Hebrew most likely proclaims that he reigns now.
    reason: alternative_reading
