translation:
  language: en
  text: I will pay close attention to the path of integrity—when will you come to me?[a] I will live with a heart of integrity in my home.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew does not identify whom “you” refers to; many understand this as an address to God.
    reason: alternative_reading
  - marker: b
    text: The Hebrew pictures a person “walking” with integrity, meaning living that way.
    reason: simplification_note
