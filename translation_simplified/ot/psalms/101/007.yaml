translation:
  language: en
  text: I will not let deceitful people remain in my house. Those who keep telling lies will not be allowed to stay in my presence.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “will not stand before my eyes”; the Hebrew can also mean “will not be established before my eyes.”
    reason: lexical_alternative
