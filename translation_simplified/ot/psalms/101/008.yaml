translation:
  language: en
  text: Every morning I will destroy all the wicked people in the land,[a] cutting off from Yahweh’s city[b] everyone who does evil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “all the wicked people on earth.” Here “land” best fits the setting of a king governing his realm.
    reason: lexical_alternative
  - marker: b
    text: Yahweh is the personal name of God, traditionally rendered “the LORD” and sometimes “Jehovah.”
    reason: source_note
