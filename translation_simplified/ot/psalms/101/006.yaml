translation:
  language: en
  text: My eyes are on the faithful people of the land, that they may be with me.[a] Whoever walks a path of integrity will serve me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can mean “sit with me” or “live with me,” suggesting an ongoing place in the king’s presence.
    reason: lexical_alternative
