translation:
  language: en
  text: I will not put anything wicked or worthless in front of my eyes.[a] I hate the deeds of people who turn from the right path. Those deeds will not cling to me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “anything vile.” Here the Hebrew means something worthless or wicked, not the name “Belial.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: set any worthless thing before my eyes
  simplified_phrase: put anything wicked or worthless in front of my eyes
  preserved_meaning: The speaker resolves not to place morally corrupt or worthless things within his sight.
  reasoning_layer_used: Lexical and theological decisions for אָשִׁית, לְנֶגֶד עֵינַי, and דְּבַר בְּלִיָּעַל
  rationale: Everyday wording preserves deliberate action and the sight image while making the moral force clear.
- pob_phrase: the work of those who turn aside
  simplified_phrase: the deeds of people who turn from the right path
  preserved_meaning: The speaker hates the conduct of people characterized by moral deviation.
  reasoning_layer_used: Lexical decision for עֲשֹׂה סֵטִים
  rationale: The relative description preserves the people as the referent without adding a temporal meaning.
- pob_phrase: it will not cling to me
  simplified_phrase: Those deeds will not cling to me
  preserved_meaning: The corrupt conduct will not attach itself to the speaker.
  reasoning_layer_used: Lexical decision for לֹא יִדְבַּק בִּי
  rationale: The explicit antecedent prevents confusion while retaining the clinging image.
