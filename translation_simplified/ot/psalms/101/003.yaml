  language: en
  text: I will not put anything worthless[a] before my eyes. I hate what people do when they turn away from what is right. What they do will not cling to me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “anything vile” or “anything wicked.” The Hebrew does not require the proper name “Belial” here.
    reason: lexical_alternative
