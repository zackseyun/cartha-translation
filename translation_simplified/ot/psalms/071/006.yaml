translation:
  language: en
  text: I have leaned on you from my mother’s womb. You are the one who brought me out from inside my mother. My praise is always for you.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Upon you I have leaned from the womb
  simplified_phrase: I have leaned on you from my mother’s womb
  preserved_meaning: The psalmist has depended on God from his earliest existence, and the image of leaning remains.
  reasoning_layer_used: POB lexical decisions for עָלֶיךָ, נִסְמַכְתִּי, and מִבֶּטֶן
  rationale: Natural word order and “my mother’s” make the birth image immediately clear without adding prenatal duration.
- pob_phrase: from my mother’s inward parts you are the one who brought me out
  simplified_phrase: You are the one who brought me out from inside my mother
  preserved_meaning: God is emphatically identified as the one who brought the psalmist forth at birth.
  reasoning_layer_used: POB lexical and theological decisions for מִמְּעֵי אִמִּי, אַתָּה, and גוֹזִי
  rationale: “Inside my mother” avoids opaque anatomy while preserving the inner-body image and its distinction from “womb.”
- pob_phrase: In you is my praise continually
  simplified_phrase: My praise is always for you
  preserved_meaning: The psalmist’s ongoing praise is directed toward God.
  reasoning_layer_used: POB lexical decisions for בְּךָ, תְהִלָּתִי, and תָמִיד
  rationale: The recast clause states the compact Hebrew relationship in natural English.
translation_notes:
  risk_flags:
  - risk: “Inside my mother” is less anatomically concrete than the Hebrew “my mother’s inward parts.”
    mitigation: It retains the inner-body image and keeps this phrase distinct from the earlier “womb.”
