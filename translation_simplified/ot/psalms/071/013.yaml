translation:
  language: en
  text: Let those who are against me be put to shame and brought to an end.[a] Let those who want to harm me be wrapped in scorn and disgrace.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “be consumed” or “perish.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: those who are hostile to my life
  simplified_phrase: those who are against me
  preserved_meaning: They act as the psalmist’s adversaries, opposing his life or self.
  reasoning_layer_used: Lexical decision for שֹׂטְנֵי נַפְשִׁי
  rationale: Using “me” clearly conveys the contextual sense of “my life” or “my self.”
- pob_phrase: come to an end
  simplified_phrase: brought to an end
  preserved_meaning: The prayer asks that their hostile action and power be finished or ruined without specifying how.
  reasoning_layer_used: Lexical decision for יִכְלוּ
  rationale: The passive wording reads naturally after “Let” while retaining the broad outcome.
- pob_phrase: be clothed with reproach and disgrace
  simplified_phrase: be wrapped in scorn and disgrace
  preserved_meaning: Public shame and humiliation surround them like clothing.
  reasoning_layer_used: Lexical decisions for יַעֲטוּ, חֶרְפָּה, and וּכְלִמָּה
  rationale: “Wrapped” preserves the clothing image, while “scorn” is clearer than “reproach.”
translation_notes:
  risk_flags:
  - risk: “Brought to an end” may be understood only as physical death.
    mitigation: The footnote preserves the lexical range, while the main text avoids specifying the manner of their end.
