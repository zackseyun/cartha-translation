translation:
  language: en
  text: May those who are hostile to me be put to shame and come to an end. May those who try to harm me be clothed in scorn and disgrace.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Let those who are hostile to my life
  simplified_phrase: May those who are hostile to me
  preserved_meaning: The psalmist asks God to act against those hostile to his life or self.
  reasoning_layer_used: Lexical decision for שֹׂטְנֵי נַפְשִׁי and theological decision on jussive force.
  rationale: “May” keeps the prayer-wish, while “hostile to me” avoids implying a specifically physical attack.
- pob_phrase: come to an end
  simplified_phrase: come to an end
  preserved_meaning: The hostile people themselves are to be finished or ruined without specifying death.
  reasoning_layer_used: Lexical decision for יִכְלוּ.
  rationale: Retaining this phrase preserves the force and breadth that “come to nothing” could weaken.
- pob_phrase: those who seek my harm be clothed with reproach and disgrace
  simplified_phrase: those who try to harm me be clothed in scorn and disgrace
  preserved_meaning: Those intending harm are pictured as covered in public shame and humiliation.
  reasoning_layer_used: Lexical decisions for מְבַקְשֵׁי רָעָתִי, יַעֲטוּ, חֶרְפָּה, and וּכְלִמָּה.
  rationale: The simpler wording retains the clothing image and both dimensions of shame.
translation_notes:
  risk_flags:
  - risk: “Hostile to me” does not explicitly retain the Hebrew reference to the psalmist’s life or self.
    mitigation: It preserves the intended personal hostility without narrowing it to physical violence.
  - risk: “Come to an end” may leave the exact form of the enemies’ ruin unspecified.
    mitigation: That breadth is intentional because the Hebrew does not require physical death.
