  - shown us
translation_notes:
  risk_flags:
  - risk: “Make us live again” may be heard as an explicit claim of bodily resurrection.
    mitigation: The depths footnote preserves the broader possibilities of restoration, near death, or the grave.
  - risk: Readers may think the change from “us” to “me” is accidental.
    mitigation: A footnote identifies the deliberate Hebrew number shift.
