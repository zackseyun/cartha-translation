  simplified_phrase: Never let me be disgraced
  preserved_meaning: The prayer asks Yahweh never to allow the speaker to suffer shame or public dishonor.
  reasoning_layer_used: Lexical decisions for אַל, אֵבֹשָׁה, and לְעוֹלָם
  rationale: “Be disgraced” is direct modern English and avoids implying mere embarrassment.
