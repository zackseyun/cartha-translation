- pob_phrase: In you, O Yahweh, I have taken refuge
  simplified_phrase: Yahweh, I have come to you for refuge
  preserved_meaning: The speaker has sought safety and protection in Yahweh.
  reasoning_layer_used: Lexical decisions for בְּךָ, יְהוָה, and חָסִיתִי
  rationale: This natural wording preserves both the act of seeking shelter and the refuge image.
