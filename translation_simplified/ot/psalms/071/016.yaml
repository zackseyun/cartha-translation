translation:
  language: en
  text: I will come with the mighty acts of the Lord Yahweh.[a] I will proclaim your righteousness—yours alone.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I will come in the mighty deeds of the Lord Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: “Righteousness” may also mean God’s justice or righteous acts; “proclaim” may also be translated “mention” or “recount.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: come in the mighty deeds
  simplified_phrase: come with the mighty acts
  preserved_meaning: The psalmist comes in connection with God’s powerful deeds.
  reasoning_layer_used: The lexical decision allows an instrumental sense for the preposition and identifies the plural noun as acts of power.
  rationale: “With the mighty acts” is clearer English, while footnote [a] preserves the other possible sense.
- pob_phrase: the Lord GOD
  simplified_phrase: the Lord Yahweh
  preserved_meaning: The compound title includes God’s personal name, YHWH.
  reasoning_layer_used: The theological decision requires YHWH to be rendered “Yahweh.”
  rationale: Using “Yahweh” preserves the personal divine name instead of replacing it with a title.
- pob_phrase: I will proclaim your righteousness, yours alone
  simplified_phrase: I will proclaim your righteousness—yours alone
  preserved_meaning: God’s righteousness alone is what the psalmist will proclaim.
  reasoning_layer_used: The lexical decisions preserve both the theological term and the exclusive final expression.
  rationale: The dash makes the final emphasis immediately clear.
translation_notes:
  risk_flags:
  - risk: “With” may sound more instrumental than the Hebrew requires.
    mitigation: Footnote [a] preserves the possible rendering with “in.”
  - risk: “Righteousness” may sound abstract though it can include God’s justice or righteous acts.
    mitigation: Footnote [b] preserves the documented range.
