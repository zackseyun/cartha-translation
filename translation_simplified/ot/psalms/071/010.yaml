simplification_decisions:
- pob_phrase: those who watch for my life
  simplified_phrase: those who watch for a chance to harm me
  preserved_meaning: They watch with hostile intent toward the psalmist’s life or person.
  reasoning_layer_used: POB lexical decision for וְשֹׁמְרֵי נַפְשִׁי
  rationale: This makes the hostility clear without limiting the threat to killing.
- pob_phrase: consult together
  simplified_phrase: make plans together
  preserved_meaning: The enemies deliberate in coordination without requiring the stronger sense “conspire.”
  reasoning_layer_used: POB lexical decisions for נוֹעֲצוּ and יַחְדָּו
  rationale: “Make plans” is natural common English for coordinated deliberation.
interpretive_expansions:
- pob_phrase: watch for my life
  rendering: watch for a chance to harm me
  claim: Their watching is hostile and seeks an opportunity to act against the psalmist.
  evidence:
