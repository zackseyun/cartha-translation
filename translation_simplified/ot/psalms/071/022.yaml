  simplified_phrase: My God, I too will praise you by playing the harp because you are faithful
  preserved_meaning: The psalmist joins in praising God with an instrument because of God's dependable character.
  reasoning_layer_used: POB lexical and theological decisions for the praise, instrument, and faithfulness language
  rationale: The direct reason clause is easier to follow while keeping faithfulness as the controlling sense.
- pob_phrase: I will make music to you with the lyre
  simplified_phrase: I will play the lyre for you
  preserved_meaning: The psalmist promises to direct instrumental music to God as praise.
  reasoning_layer_used: POB lexical decisions for אֲזַמְּרָה לְךָ and בְּכִנּוֹר
  rationale: The concrete verb “play” clearly expresses the musical act.
