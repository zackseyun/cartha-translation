translation:
  language: en
  text: My God, I too will praise you by playing the harp because you are faithful.[a] I will play the lyre for you, Holy One of Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “because of your truth.” The Hebrew word can mean both truth and faithfulness.
    reason: lexical_alternative
  - marker: b
    text: The exact forms of these two ancient stringed instruments are uncertain; they are traditionally called a harp and a lyre.
    reason: cultural_note
