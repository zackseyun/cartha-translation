translation:
  language: en
  text: You are faithful, my God, so I too will praise you with a harp.[a] I will play a lyre in praise of you, Holy One of Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “You are true.” The Hebrew word can refer to both truth and faithfulness.
    reason: lexical_alternative
  - marker: b
    text: The precise kinds of ancient instruments meant by “harp” and “lyre” are uncertain.
    reason: cultural_note
