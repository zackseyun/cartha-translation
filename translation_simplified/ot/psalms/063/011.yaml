translation:
  language: en
  text: But the king will rejoice in God. Everyone who takes an oath in God’s name[a] will boast[b], because the mouths of those who speak lies will be shut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “by him.” The pronoun most naturally refers to God, though it could refer to the king.
    reason: lexical_alternative
  - marker: b
    text: Or “will glory”; here boasting means celebrating with honor.
    reason: lexical_alternative
