  preserved_meaning: People invoke God when making a solemn oath.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: This avoids a misleading sense of profanity while retaining God as the preferred antecedent.
- pob_phrase: the mouth of those who speak lies will be shut
  simplified_phrase: the mouths of those who speak lies will be shut
  preserved_meaning: People characterized by false speech will be silenced.
  reasoning_layer_used: WLC source, POB lexical decision, and grounding review
  rationale: The natural English plural preserves the Hebrew image and its collective force.
- pob_phrase: But the king will rejoice in God; everyone
