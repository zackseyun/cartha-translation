simplification_decisions:
- pob_phrase: So I will bless you as long as I live
  simplified_phrase: So, throughout my life, I will bless you
  preserved_meaning: The psalmist vows to bless God for the full span of his life.
  reasoning_layer_used: POB lexical decisions for כֵּן, אֲבָרֶכְךָ, and בְחַיָּי
  rationale: The reordered phrase is easier to follow while retaining the link to the previous verse and the lifelong duration.
- pob_phrase: in your name I will lift up my hands
  simplified_phrase: I will raise my hands in your name
  preserved_meaning: The psalmist will raise his hands as an act of worship connected with God’s revealed name.
  reasoning_layer_used: POB lexical decisions for בְּשִׁמְךָ, אֶשָּׂא, and כַפָּי
  rationale: Ordinary English word order and “raise” make the sentence clearer without removing the physical image.
