  preserved_meaning: God stands within a divine council in a judicial setting.
  reasoning_layer_used: Lexical decisions for עֲדַת־אֵל and נִצָּב
  rationale: Turning the abstract assembly into its assembled members makes the scene easier to picture.
- pob_phrase: in the midst of the gods he judges
  simplified_phrase: There he judges the gods
  preserved_meaning: God judges the plural group in whose assembly he stands.
  reasoning_layer_used: Lexical and theological decisions for אֱלֹהִים and יִשְׁפֹּט
  rationale: A separate sentence removes the formal clause order while retaining the gods and the judicial action.
