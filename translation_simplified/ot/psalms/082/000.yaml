translation:
  language: en
  text: 'A psalm of Asaph.


    God takes his stand in God’s assembly. There among the gods,[a] he judges.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the divine beings.” Some understand “the gods” here as human judges or rulers.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: God stands in the assembly of God
  simplified_phrase: God takes his stand in God’s assembly
  preserved_meaning: God stands within the divine assembly as the one exercising authority.
  reasoning_layer_used: POB translation and applied revision
  rationale: This keeps the standing image while expressing the relationship more naturally.
- pob_phrase: in the midst of the gods he judges
  simplified_phrase: There among the gods, he judges
  preserved_meaning: God judges while among those called gods.
  reasoning_layer_used: POB translation, footnote, and grounding review
  rationale: “Among” is clearer than “in the midst of,” and the direct verb “judges” preserves the full action.
translation_notes:
  risk_flags:
  - risk: Readers may assume “gods” refers only to rival deities.
    mitigation: The footnote preserves the alternatives of divine beings and human judges or rulers.
