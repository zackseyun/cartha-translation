simplification_decisions:
- pob_phrase: They do not know, and they do not understand; they walk about in darkness
  simplified_phrase: They do not know, and they do not understand. They keep walking around in darkness.
  preserved_meaning: The rulers remain ignorant and undiscerning as they continue in darkened conduct.
  reasoning_layer_used: POB lexical decisions and Hebrew poetic parallelism
  rationale: Short sentences clarify the movement while keeping knowledge, understanding, and walking as distinct ideas.
- pob_phrase: they walk about
  simplified_phrase: they keep walking around
  preserved_meaning: Their movement in darkness is ongoing rather than a single act.
  reasoning_layer_used: POB lexical decision for יִתְהַלָּכוּ
  rationale: “Keep walking around” expresses the habitual movement in common English.
- pob_phrase: all the foundations of the earth are shaken
  simplified_phrase: All the foundations of the earth shake
  preserved_meaning: Injustice destabilizes the foundations of the whole world order without stating that collapse is complete.
  reasoning_layer_used: POB lexical and theological decisions for יִמּוֹטוּ and אָרֶץ
  rationale: The active English verb is easier to read while preserving the cosmic image of destabilization.
