translation:
  language: en
  text: We thank you, O God; we thank you, because your name is near.[a] They tell of the wonderful things you have done.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Your name is near” may refer to God’s nearness, revealed character, or reputation.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says “they tell” without identifying who “they” are.
    reason: source_note
simplification_decisions:
- pob_phrase: We give thanks to you, O God; we give thanks
  simplified_phrase: We thank you, O God; we thank you
  preserved_meaning: The worshipers directly thank God, and the repetition retains the emphasis.
  reasoning_layer_used: Lexical decisions for הוֹדִינוּ and לְּךָ אֱלֹהִים
  rationale: “We thank you” is direct modern English and adds no affirmation beyond the repeated words.
- pob_phrase: for your name is near
  simplified_phrase: because your name is near
  preserved_meaning: God’s near name remains the reason for thanksgiving without resolving the idiom.
  reasoning_layer_used: Theological decision on שְׁמֶךָ and lexical decision for וְקָרוֹב
  rationale: “Because” makes the explanatory relationship clear while preserving the biblical image.
- pob_phrase: they recount your wondrous deeds
  simplified_phrase: They tell of the wonderful things you have done
  preserved_meaning: Unidentified speakers tell about God’s extraordinary acts.
  reasoning_layer_used: Lexical decisions for סִפְּרוּ and נִפְלְאוֹתֶיךָ
  rationale: The common wording clearly presents the wonders as things God has done.
