translation:
  language: en
  text: We thank you, O God; we thank you because your name is near.[a] People tell of the wonderful things you have done.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Your name is near” may point to God’s nearness, presence, or known character.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says “they tell” without identifying who they are.
    reason: source_note
simplification_decisions:
- pob_phrase: We give thanks to you
  simplified_phrase: We thank you
  preserved_meaning: The speakers directly express thanks to God.
  reasoning_layer_used: Lexical decision for הוֹדִינוּ
  rationale: The direct verb is clearer while preserving the repeated thanksgiving.
- pob_phrase: for your name is near
  simplified_phrase: because your name is near
  preserved_meaning: God’s near name is presented as the reason for thanksgiving.
  reasoning_layer_used: Lexical and theological decisions for וְקָרוֹב שְׁמֶךָ
  rationale: “Because” makes the explanatory link clear without resolving the rich meaning of “name.”
- pob_phrase: your wondrous deeds are recounted
  simplified_phrase: People tell of the wonderful things you have done
  preserved_meaning: People report God’s extraordinary acts.
  reasoning_layer_used: Lexical decisions for סִפְּרוּ and נִפְלְאוֹתֶיךָ
  rationale: The active sentence and concrete wording are easier to understand while the footnote preserves the indefinite subject.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “your name is near” as merely referring to a spoken word.
    mitigation: The footnote preserves its possible senses of divine nearness, presence, and known character.
  - risk: Supplying “People” could seem more specific than the Hebrew’s unnamed plural subject.
    mitigation: The footnote states that the Hebrew leaves the subject unidentified.
