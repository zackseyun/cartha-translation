translation:
  language: en
  text: For there is a cup in the LORD’s hand. The wine foams; it is fully mixed.[a] He pours from it, and all the wicked on earth will surely drink it down to its dregs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “full of a prepared mixture” or “prepared with spices.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a cup is in the hand of the LORD
  simplified_phrase: there is a cup in the LORD’s hand
  preserved_meaning: The LORD possesses and controls the cup while the judgment image remains implicit.
  reasoning_layer_used: Lexical and theological decisions on the divine name and cup imagery
  rationale: Natural word order makes the image easier to grasp without interpreting the cup as wrath in the text.
- pob_phrase: the wine foams, full of mixed spices
  simplified_phrase: The wine foams; it is fully mixed
  preserved_meaning: The wine is foaming and has been prepared by mixing, without making spices certain.
  reasoning_layer_used: Lexical decisions for חָמַר and מָלֵא מֶסֶךְ
  rationale: The revision removes an unsupported specificity while the footnote preserves possible senses.
- pob_phrase: will drain its dregs and drink
  simplified_phrase: will surely drink it down to its dregs
  preserved_meaning: All the wicked must consume the cup completely, including the sediment at the bottom.
  reasoning_layer_used: Lexical decisions for אַךְ, שְׁמָרֶיהָ, יִמְצוּ, and יִשְׁתּוּ
  rationale: The common English idiom preserves both the certainty and completeness of the action.
translation_notes:
  risk_flags:
  - risk: “Fully mixed” may not show exactly how the wine was prepared.
    mitigation: The footnote preserves both the broader mixture sense and spices as a possibility.
  - risk: “Drink it down to its dregs” recasts the Hebrew action sequence.
    mitigation: The wording retains complete drinking and the concrete sediment image.
