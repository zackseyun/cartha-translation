  preserved_meaning: God is the one who brought David from the flock to his new calling.
  reasoning_layer_used: POB lexical rationale and preceding context
  rationale: Naming both participants removes unclear pronouns without changing their roles.
- pob_phrase: to shepherd Jacob his people, and Israel his inheritance
  simplified_phrase: to shepherd Jacob, God’s people, and Israel, God’s inheritance
  preserved_meaning: David’s rule over Israel is portrayed as shepherding the people who belong to God.
  reasoning_layer_used: POB theological decision and lexical decisions
  rationale: Clear punctuation and explicit possession preserve both the royal-pastoral image and the poetic parallel.
