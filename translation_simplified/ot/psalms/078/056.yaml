translation:
  language: en
  text: Yet they tested God Most High and rebelled against him. They did not obey the terms of his covenant.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew calls these his “testimonies,” meaning covenant commands that bear witness to his will.
    reason: simplification_note
simplification_decisions:
- pob_phrase: tested God Most High and rebelled
  simplified_phrase: tested God Most High and rebelled against him
  preserved_meaning: They actively tested God and defied his authority.
  reasoning_layer_used: Lexical decisions for וַיְנַסּוּ and וַיַּמְרוּ, with the applied syntax revision
  rationale: Adding “against him” makes the direction of their rebellion explicit without attaching it incorrectly to “tested.”
- pob_phrase: they did not keep his testimonies
  simplified_phrase: They did not obey the terms of his covenant
  preserved_meaning: They failed to follow God's witness-bearing covenant requirements.
  reasoning_layer_used: Lexical and theological decisions for וְעֵדוֹתָיו and לֹא שָׁמָרוּ
  rationale: “Obey” and “terms of his covenant” clearly express the legal and covenantal sense for readers unfamiliar with “testimonies.”
interpretive_expansions:
- pob_phrase: his testimonies
  rendering: the terms of his covenant
  claim: The testimonies are requirements within God's covenant with Israel.
  evidence:
  - The POB lexical rationale identifies them as covenantal witness-bearing ordinances.
  - The POB theological rationale says the verse concerns covenant infidelity.
  confidence: high
  alternatives_preserved:
  - The footnote retains the source image “testimonies.”
  - The commands may also be called decrees or statutes.
