simplification_decisions:
- pob_phrase: and that they should not be like
  simplified_phrase: so that they would not be like
  preserved_meaning: Their instruction was intended to keep them from imitating the earlier generation.
  reasoning_layer_used: Lexical decision for וְלֹא יִהְיוּ and immediate context
  rationale: “So that” makes the purpose connection clear in ordinary English.
- pob_phrase: a generation that did not set its heart firm
  simplified_phrase: That generation did not have a firmly set heart
  preserved_meaning: The generation never established firm inner resolve, while the heart image remains intact.
  reasoning_layer_used: Lexical decisions for הֵכִין לִבּוֹ and לֵב, corrected by grounding review
  rationale: This avoids implying that an earlier resolve was established and later abandoned.
- pob_phrase: whose spirit was not faithful to God
  simplified_phrase: and its spirit was not faithful to God
  preserved_meaning: Its inward disposition lacked faithfulness to God and remains distinct from its heart.
  reasoning_layer_used: Theological decision on the heart-spirit pairing
  rationale: The wording keeps both inner-faculty terms rather than merging them.
translation_notes:
  risk_flags:
