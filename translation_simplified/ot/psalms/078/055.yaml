- pob_phrase: allotted them an inheritance by measuring line
  simplified_phrase: Using a measuring line, he divided the land and gave Israel’s tribes their inherited portions
  preserved_meaning: God apportioned measured sections of the land to Israel as their inheritance.
  reasoning_layer_used: Lexical decisions for וַיַּפִּילֵם, בְּחֶבֶל, and נַחֲלָה
  rationale: The rewrite explains the land-allotment idiom while preserving the measuring-line image.
- pob_phrase: he settled the tribes of Israel in their tents
  simplified_phrase: Then he settled Israel’s tribes in their tents
  preserved_meaning: God caused the tribes of Israel to live in their tents or dwellings.
  reasoning_layer_used: Lexical decisions for וַיַּשְׁכֵּן and בְּאָהֳלֵיהֶם
  rationale: The shorter wording keeps God’s agency and the concrete image without assigning the tents to the expelled nations.
- pob_phrase: He drove out nations before them
  simplified_phrase: He drove out nations before them
  preserved_meaning: God forcefully removed the nations in Israel’s presence and on Israel’s behalf.
  reasoning_layer_used: Lexical decision for וַיְגָרֶשׁ and theological decision on divine agency
  rationale: The POB wording is already clear and preserves the force of the removal.
