translation:
  language: en
  text: Then he rejected the tent associated with Joseph and did not choose the tribe of Ephraim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ephraim was the leading tribe descended from Joseph. The next verses describe God choosing Judah and Mount Zion instead.
    reason: cross_reference
simplification_decisions:
- pob_phrase: the tent of Joseph
  simplified_phrase: the tent associated with Joseph
  preserved_meaning: The tent image remains, but it refers to a dwelling place connected with Joseph rather than Joseph’s personal tent.
  reasoning_layer_used: lexical decision for בְּאֹהֶל יוֹסֵף and grounding review
  rationale: This wording prevents a likely literal-personal reading without narrowing the image to a house or kingdom.
- pob_phrase: the tribe of Ephraim
  simplified_phrase: the tribe of Ephraim
  preserved_meaning: Ephraim remains the specific tribe God did not choose.
  reasoning_layer_used: lexical and theological decisions for וּבְשֵׁבֶט אֶפְרַיִם
  rationale: The full phrase is clearer and more idiomatic than the possessive form.
interpretive_expansions:
- pob_phrase: the tent of Joseph
  rendering: the tent associated with Joseph
  claim: The tent represents a dwelling place or tribal sphere connected with Joseph, not merely his personal tent.
  evidence:
  - The POB lexical rationale identifies the tent as metonymic for a dwelling place associated with Joseph.
  - The following context contrasts Joseph and Ephraim with Judah and Zion.
  confidence: high
  alternatives_preserved:
  - the northern sanctuary
  - the tribal sphere of Joseph
translation_notes:
  risk_flags:
  - risk: “Tent” may still suggest only a portable shelter to some readers.
    mitigation: The phrase “associated with Joseph” and the footnote indicate its tribal and sanctuary context.
