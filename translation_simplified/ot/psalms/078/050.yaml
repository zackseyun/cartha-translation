simplification_decisions:
- pob_phrase: He leveled a path for his anger
  simplified_phrase: He cleared a path for his anger
  preserved_meaning: God opened a way for his anger to proceed in judgment.
  reasoning_layer_used: POB lexical and theological decisions on יְפַלֵּס and the path metaphor
  rationale: “Cleared” makes the route image easier to grasp without replacing it with an abstract statement.
- pob_phrase: he did not spare their soul from death
  simplified_phrase: He did not spare them from death
  preserved_meaning: God did not preserve their mortal lives from dying.
  reasoning_layer_used: POB lexical decision that נַפְשָׁם means life here, not an immaterial soul
  rationale: Using “them” avoids the misleading modern sense of “soul” while keeping death as the outcome.
- pob_phrase: gave over their life to the plague
  simplified_phrase: handed their lives over to the plague
  preserved_meaning: God actively delivered their living existence to fatal epidemic judgment.
  reasoning_layer_used: POB lexical decisions on וְחַיָּתָם, לַדֶּבֶר, and הִסְגִּיר
  rationale: “Handed over” is common English and retains the force of deliberate surrender to the plague.
