  preserved_meaning: David actively cared for the people in his role as their shepherd-king.
  reasoning_layer_used: Lexical and theological decisions on royal shepherd imagery.
  rationale: The wording explains the action while keeping the shepherd image explicit.
- pob_phrase: with integrity of heart
  simplified_phrase: with a heart that was honest and whole
  preserved_meaning: His leadership arose from moral integrity and wholeness in his inner person.
  reasoning_layer_used: Lexical decisions for תֹם and לֵבָב.
  rationale: “Honest and whole” explains integrity without implying a specific contrast with divided loyalties.
- pob_phrase: guided them with the skill of his hands
