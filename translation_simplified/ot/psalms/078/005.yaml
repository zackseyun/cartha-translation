translation:
  language: en
  text: For he established a testimony[a] among Jacob’s people and put a law[b] in place among Israel’s people. He commanded our fathers to make both known to their children.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “testimony” may refer to God’s covenant witness or requirement.
    reason: simplification_note
  - marker: b
    text: Or “instruction” for “law” (Hebrew torah).
    reason: lexical_alternative
  - marker: c
    text: The Hebrew says “our fathers” and “their sons”; here “sons” refers to their children generally.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: in Jacob ... in Israel
  simplified_phrase: among Jacob’s people ... among Israel’s people
  preserved_meaning: Jacob and Israel name God’s covenant people while the poetic parallel remains visible.
  reasoning_layer_used: POB lexical decisions for בְּיַעֲקֹב and בְּיִשְׂרָאֵל
  rationale: Adding “people” makes the corporate meaning clear to readers unfamiliar with this biblical usage.
- pob_phrase: set a law
  simplified_phrase: put a law in place
  preserved_meaning: God established an authoritative law for Israel.
  reasoning_layer_used: POB lexical and theological decisions for שָׂם and תּוֹרָה
  rationale: The common phrase “put in place” clearly expresses institutional establishment.
- pob_phrase: which he commanded our fathers to make known to their children
  simplified_phrase: He commanded our fathers to make both known to their children
  preserved_meaning: God required the fathers to pass the testimony and law to the next generation.
  reasoning_layer_used: POB lexical decisions for אֲשֶׁר צִוָּה, לְהוֹדִיעָם, and לִבְנֵיהֶם
  rationale: A new sentence and the word “both” remove the dense relative clause and clarify the objects.
interpretive_expansions:
- pob_phrase: in Jacob ... in Israel
  rendering: among Jacob’s people ... among Israel’s people
  claim: The names Jacob and Israel refer corporately to the covenant people.
  evidence:
