  text: He established a testimony among the people of Jacob and gave Israel his instruction. He commanded our fathers to make both known to their children.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: a testimony in Jacob
  simplified_phrase: a testimony among the people of Jacob
  preserved_meaning: God established a testimony within Jacob’s covenant people.
  reasoning_layer_used: lexical decision and contextual metonymy
  rationale: “Among the people” clarifies Jacob’s corporate sense without changing the source relationship.
- pob_phrase: set instruction in Israel
  simplified_phrase: gave Israel his instruction
  preserved_meaning: God authoritatively provided his teaching to Israel.
  reasoning_layer_used: applied revision and lexical decision
  rationale: This natural wording keeps the approved meaning of Torah as divine instruction.
- pob_phrase: which he commanded our fathers to make known to their children
  simplified_phrase: He commanded our fathers to make both known to their children.
  preserved_meaning: The fathers had to pass the testimony and instruction to the next generation.
  reasoning_layer_used: source grammar and gendered kinship decision
  rationale: A new sentence and “both” clearly identify the command’s two objects.
interpretive_expansions:
- pob_phrase: in Jacob
  rendering: among the people of Jacob
  claim: Jacob names the covenant people, among whom God established the testimony.
  evidence:
  - The lexical rationale identifies Jacob as a metonym for the covenant people.
  - The parallel phrase “in Israel” confirms the corporate reference.
  confidence: high
  alternatives_preserved:
  - in Jacob
  - among Jacob
- pob_phrase: make known
  rendering: make both known
  claim: The command concerns both the testimony and the instruction.
  evidence:
  - The Hebrew plural suffix refers to the two preceding objects.
  - The POB rationale identifies the testimony and instruction as its referents.
  confidence: high
  alternatives_preserved:
  - make these things known
