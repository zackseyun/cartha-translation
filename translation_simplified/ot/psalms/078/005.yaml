  - The parallel phrase “in Israel” supports the same corporate sense.
  confidence: high
  alternatives_preserved:
  - in Jacob ... in Israel
- pob_phrase: make known
  rendering: make both known
  claim: The command concerns both the testimony and the law.
  evidence:
