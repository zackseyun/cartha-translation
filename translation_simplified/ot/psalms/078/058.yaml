- pob_phrase: with their carved images they made him jealous
  simplified_phrase: they made him jealous with their carved images
  preserved_meaning: Their manufactured objects of worship aroused God’s covenantal jealousy.
  reasoning_layer_used: The lexical and theological decisions retain both the concrete images and divine jealousy.
  rationale: The parallel clause preserves the distinct image and divine response without overexplaining their relation.
