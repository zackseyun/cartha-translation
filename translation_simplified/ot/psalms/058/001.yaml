  text: Do you really speak what is right while remaining silent?[a] Do you judge fairly, you mortal men?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Hebrew is difficult. It may instead address “mighty ones” or “gods”: “Do you really speak what is right, you mighty ones?”'
