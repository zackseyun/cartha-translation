simplification_decisions:
- pob_phrase: The wicked are estranged from the womb
  simplified_phrase: Wicked people are alienated from the womb
  preserved_meaning: The verse portrays wicked people as separated from the right way from earliest life.
  reasoning_layer_used: Lexical and theological decisions
  rationale: “Alienated” preserves a condition of separation without implying a conscious act of turning away.
- pob_phrase: they go astray from birth
  simplified_phrase: from birth they go astray
  preserved_meaning: Their waywardness is poetically traced to life's beginning.
  reasoning_layer_used: Lexical decision and poetic parallelism
  rationale: The reordered phrase reads naturally while retaining the parallel womb and birth images.
- pob_phrase: speaking lies
  simplified_phrase: telling lies
  preserved_meaning: Lying characterizes the wicked people described.
  reasoning_layer_used: Lexical decision
  rationale: “Telling lies” is direct common English for deceptive speech.
