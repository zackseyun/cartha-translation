translation:
  language: en
  text: A person who does what is right will rejoice when he sees vengeance carried out.[a] He will wash his feet in the blood of the wicked.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “because he has seen vengeance.” The Hebrew can express either cause or time here.
    reason: lexical_alternative
  - marker: b
    text: This poetic image shows how complete the judgment is; it does not command personal violence.
    reason: cultural_note
simplification_decisions:
- pob_phrase: The righteous
  simplified_phrase: A person who does what is right
  preserved_meaning: The phrase still describes the representative righteous person.
  reasoning_layer_used: POB lexical decision for צַדִּיק and the applied revision
  rationale: The descriptive wording makes the biblical category immediately understandable.
- pob_phrase: when he sees vengeance
  simplified_phrase: when he sees vengeance carried out
  preserved_meaning: He witnesses severe retribution taking place.
  reasoning_layer_used: POB lexical decisions for כִּי, חָזָה, and נָקָם
  rationale: “Carried out” clarifies that vengeance is an event he witnesses without calling it personal revenge.
- pob_phrase: he will wash his feet in the blood of the wicked
  simplified_phrase: He will wash his feet in the blood of the wicked
  preserved_meaning: The stark image portrays the completeness of judgment.
  reasoning_layer_used: POB lexical and theological decisions for פְּעָמָיו, יִרְחַץ, and בְּדַם
  rationale: A separate sentence makes the image easier to absorb while preserving its full force.
translation_notes:
