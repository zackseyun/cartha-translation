translation:
  language: en
  text: 'A Song of Ascents.[a]


    I raise my eyes to you, the One enthroned in the heavens.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ascents” means “goings up,” but whether the title refers to pilgrimage, steps, or music is uncertain.
    reason: simplification_note
  - marker: b
    text: The Hebrew can also be translated “the one who sits in the heavens”; “enthroned” conveys the royal sense here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I lift up my eyes
  simplified_phrase: I raise my eyes
  preserved_meaning: The speaker directs his gaze and appeal toward God while retaining the concrete image of the eyes.
  reasoning_layer_used: POB lexical decision for נָשָׂאתִי and אֶת עֵינַי
  rationale: “Raise my eyes” expresses the Hebrew image in more natural modern English.
- pob_phrase: O you who are enthroned in the heavens
  simplified_phrase: the One enthroned in the heavens
  preserved_meaning: God remains the direct heavenly addressee, with the royal force of “enthroned” intact.
  reasoning_layer_used: POB theological decision for הַיֹּשְׁבִי בַּשָּׁמָיִם
  rationale: The appositional phrase avoids the archaic vocative “O” without weakening divine kingship.
