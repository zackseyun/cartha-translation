  language: en
  text: Look! Just as servants[a] keep their eyes on their masters’ hands, and a female servant keeps her eyes on her mistress’s hand, we keep our eyes on Yahweh our God until he shows us favor.[b]
  philosophy: optimal-equivalence
  footnotes:
