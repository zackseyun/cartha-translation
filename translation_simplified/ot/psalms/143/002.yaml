simplification_decisions:
- pob_phrase: enter into judgment with your servant
  simplified_phrase: put your servant on trial
  preserved_meaning: The psalmist asks God not to begin judicial proceedings against him.
  reasoning_layer_used: The lexical audit for בוא with מִשְׁפָּט and the theological decision preserving the courtroom image.
  rationale: This common expression keeps the image of a judicial process rather than implying only a final sentence.
- pob_phrase: for no living one
  simplified_phrase: because no one living
  preserved_meaning: The plea is based on a universal statement about all living people.
  reasoning_layer_used: The lexical decisions for כִּי and כָל חָי.
  rationale: “Because” clearly introduces the reason, while “no one living” sounds natural in modern English.
translation_notes:
  risk_flags:
  - risk: “Put your servant on trial” recasts the Hebrew legal idiom into a modern courtroom expression.
    mitigation: It preserves God’s judicial action against the servant without suggesting only sentencing.
