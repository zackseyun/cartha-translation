translation:
  language: en
  text: 'A psalm of David.[a]


    Yahweh, hear my prayer. Listen closely to my pleas for mercy. In your faithfulness and righteousness, answer me.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Of David” may mean by David, for David, or associated with David.
    reason: source_note
  - marker: b
    text: Or “By your faithfulness and righteousness, answer me”; “righteousness” may also be translated “justice.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: give ear to my pleas for mercy
  simplified_phrase: Listen closely to my pleas for mercy
  preserved_meaning: The second request intensifies the appeal for attentive hearing.
  reasoning_layer_used: POB lexical decision for הַאֲזִינָה
  rationale: “Listen closely” expresses the poetic idiom in natural modern English.
- pob_phrase: In your faithfulness answer me, in your righteousness
  simplified_phrase: In your faithfulness and righteousness, answer me
  preserved_meaning: David appeals to God's reliability and upright character as he asks for an answer.
  reasoning_layer_used: POB lexical decisions for אֱמוּנָה and צְדָקָה
  rationale: Combining the parallel phrases removes awkward word order without merging their distinct meanings.
translation_notes:
  risk_flags:
