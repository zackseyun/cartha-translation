translation:
  language: en
  text: He set them firmly in place forever and ever. He gave a decree that will never pass away.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “He gave a decree, and they do not go beyond it,” or “nothing goes beyond it.” The Hebrew final clause can be understood in more than one way.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: he established them
  simplified_phrase: He set them firmly in place
  preserved_meaning: God caused the created things to remain securely in their appointed place.
  reasoning_layer_used: The lexical decision for וַיַּעֲמִידֵם and the surrounding cosmic-stability context.
  rationale: The concrete wording makes the causative image easier to understand.
- pob_phrase: he gave a decree, and it will not pass away
  simplified_phrase: He gave a decree that will never pass away
  preserved_meaning: God’s decree establishing creation’s order remains permanently in force.
  reasoning_layer_used: The lexical and theological decisions for חָק and וְלֹא יַעֲבוֹר.
  rationale: Joining the clauses clearly connects permanence to the decree.
translation_notes:
  risk_flags:
