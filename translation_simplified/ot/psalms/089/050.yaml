translation:
  language: en
  text: Remember, Lord, the disgrace your servants suffer from many peoples. I carry that disgrace deep within me.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean, “I carry deep within me the reproach of all the many peoples.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the reproach of your servants ... from many peoples
  simplified_phrase: the disgrace your servants suffer from many peoples
  preserved_meaning: God’s servants suffer disgrace that comes from many peoples.
  reasoning_layer_used: POB lexical decisions for חֶרְפָּה and כָּל רַבִּים עַמִּים
  rationale: The direct clause clearly expresses the POB’s preferred source reading without changing “many” into a question of quantity.
- pob_phrase: which I bear in my bosom
  simplified_phrase: I carry that disgrace deep within me
  preserved_meaning: The psalmist personally and intimately bears the servants’ disgrace as a burden.
  reasoning_layer_used: POB lexical decisions for שְׂאֵתִי and בְּחֵיקִי, with the cultural note
  rationale: The wording makes the burden clear while preserving the image’s inward and personal force.
interpretive_expansions:
- pob_phrase: the reproach of your servants ... from many peoples
  rendering: the disgrace your servants suffer from many peoples
  claim: Many peoples are the source of the disgrace suffered by God’s servants.
  evidence:
  - The POB main text supplies “from” to express the source relationship.
  - The lexical rationale identifies this as the preferred reading of the compressed Hebrew.
  confidence: moderate
  alternatives_preserved:
  - The reproach may instead be understood as that “of all the many peoples.”
translation_notes:
  risk_flags:
  - risk: The compressed Hebrew permits another relationship between the reproach and the many peoples.
    mitigation: The footnote preserves the documented alternative reading.
  - risk: “Deep within me” explains rather than reproduces the concrete bosom image.
    mitigation: The verb “carry” preserves the image of personally bearing the disgrace as a burden.
