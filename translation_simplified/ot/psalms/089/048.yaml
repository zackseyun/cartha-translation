translation:
  language: en
  text: Who can live without seeing death?[a] Can anyone save his life from Sheol’s grasp?[b] Selah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Seeing death” means experiencing death.
    reason: simplification_note
  - marker: b
    text: Sheol is the Hebrew term for the realm of the dead; it may also be rendered “the grave.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Who can live and not see death?
  simplified_phrase: Who can live without seeing death?
  preserved_meaning: The question declares that no human being can avoid experiencing death while retaining the Hebrew image of seeing death.
  reasoning_layer_used: POB lexical decision and applied revision
  rationale: “Without” makes the relationship natural in English while the footnote explains the preserved idiom.
- pob_phrase: Can he save his life
  simplified_phrase: Can anyone save his life
  preserved_meaning: No human being can rescue his own life from death.
  reasoning_layer_used: POB applied revision and rhetorical context
  rationale: “Anyone” makes the second question’s universal reference immediately clear.
- pob_phrase: from the hand of Sheol
  simplified_phrase: from Sheol’s grasp
  preserved_meaning: Sheol is pictured as holding human life in its power.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Grasp” clearly conveys the hand metaphor’s force without flattening Sheol to the grave.
translation_notes:
  risk_flags:
  - risk: Modern readers may mistake “seeing death” for merely witnessing someone else die.
    mitigation: Footnote a states that the idiom means experiencing death.
  - risk: Readers unfamiliar with Sheol may import either a purely physical grave or a later concept of hell.
    mitigation: Footnote b defines the term broadly while preserving the documented alternative.
