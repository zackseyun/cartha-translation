translation:
  language: en
  text: Is there any man who can live and never see death? Can he save his own soul from Sheol’s grasp? Selah.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “see death”; that is, experience death.
    reason: lexical_alternative
  - marker: b
    text: “Soul” can also mean his life or himself.
    reason: lexical_alternative
  - marker: c
    text: Sheol is the Hebrew term for the realm of the dead; it may also be rendered “the grave.” The precise meaning of “Selah” is uncertain.
    reason: source_note
simplification_decisions:
- pob_phrase: What man can live and not see death?
  simplified_phrase: Is there any man who can live and never see death?
  preserved_meaning: The rhetorical question says that no man can avoid death while retaining the Hebrew image of seeing death.
  reasoning_layer_used: Lexical decisions for מִי, גֶבֶר, יִחְיֶה, and וְלֹא יִרְאֶה מָוֶת
  rationale: The new question form is more natural while keeping “man” and the image “see death.”
- pob_phrase: Can he deliver his soul
  simplified_phrase: Can he save his own soul
  preserved_meaning: No man can cause his soul, life, or self to escape death.
  reasoning_layer_used: Lexical decisions for יְמַלֵּט and נַפְשׁוֹ
  rationale: “Save” is more familiar than “deliver,” while “soul” preserves the source term’s poetic and theological range.
- pob_phrase: from the hand of Sheol
  simplified_phrase: from Sheol’s grasp
  preserved_meaning: Sheol is pictured as holding a person in its power.
  reasoning_layer_used: Lexical decisions for מִיַּד and שְׁאוֹל; theological decision on Sheol
  rationale: “Grasp” explains the hand metaphor without removing its force, and “Sheol” remains untranslated.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “soul” too narrowly as a separable inner part.
    mitigation: The footnote preserves the alternatives “life” and “himself.”
  - risk: “Sheol” and “Selah” may be unfamiliar.
    mitigation: The footnote explains Sheol and notes that Selah’s precise meaning is uncertain.
