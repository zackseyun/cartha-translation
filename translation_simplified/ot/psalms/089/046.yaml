    mitigation: It preserves the documented possibility that God appears hidden without deciding how actively he withdraws.
  - risk: The POB theological rationale mistakenly says the project uses “LORD.”
    mitigation: The draft follows the stated doctrine reference, lexical decision, and POB text, which all use “Yahweh.”
