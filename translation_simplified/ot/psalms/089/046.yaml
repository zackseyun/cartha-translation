simplification_decisions:
- pob_phrase: How long, O Yahweh? Will you hide yourself forever?
  simplified_phrase: Yahweh, how much longer will you stay hidden? Will you stay hidden forever?
  preserved_meaning: The urgent lament asks how long Yahweh will continue to be hidden.
  reasoning_layer_used: The lexical decisions allow “how much longer” and “remain hidden” while directly linking “forever” to Yahweh’s hiddenness.
  rationale: The reordered questions are natural and repeat the action to keep the referent clear.
- pob_phrase: O Yahweh
  simplified_phrase: Yahweh
  preserved_meaning: The psalmist directly addresses Israel’s covenant God by his personal name.
  reasoning_layer_used: The lexical decision and doctrine reference support the divine name Yahweh.
  rationale: Removing the archaic “O” makes the direct address clearer without weakening it.
translation_notes:
  risk_flags:
