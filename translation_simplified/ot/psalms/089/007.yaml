translation:
  language: en
  text: In the council of the holy ones[a][b], God is feared with deep reverence. He inspires more awe than all who surround him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “assembly”; the Hebrew can refer to a close council or a gathering for discussion.
    reason: lexical_alternative
  - marker: b
    text: “Holy ones” likely means heavenly beings here, not human believers.
    reason: cultural_note
simplification_decisions:
- pob_phrase: God is greatly feared
  simplified_phrase: God is feared with deep reverence
  preserved_meaning: God is regarded with intense reverential fear, not as morally evil.
  reasoning_layer_used: POB lexical decision for נַעֲרָץ and רַבָּה
  rationale: The wording explains the kind of fear while preserving its intensity.
- pob_phrase: and awesome above all who surround him
  simplified_phrase: He inspires more awe than all who surround him
  preserved_meaning: God surpasses every surrounding attendant in the awe he evokes.
  reasoning_layer_used: POB lexical decisions for וְנוֹרָא and עַל כָּל סְבִיבָיו
  rationale: A direct comparison is easier to understand than the compressed phrase “awesome above.”
- pob_phrase: God is greatly feared ... and awesome
  simplified_phrase: God is feared ... He inspires more awe
  preserved_meaning: Both parallel statements describe the unique awe and fear God commands.
  reasoning_layer_used: POB translation structure
  rationale: Two sentences make the poetic parallel clear without merging its distinct claims.
interpretive_expansions:
