translation:
  language: en
  text: Yahweh, your enemies have taunted you. They have mocked the footsteps[a] of your anointed one.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Footsteps” may mean the movements, coming, or tracks of Yahweh’s anointed one.
    reason: lexical_alternative
  - marker: b
    text: Or “your Messiah.” Here the Hebrew most likely refers to the Davidic king, while also carrying messianic resonance.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: with which your enemies have taunted, O Yahweh
  simplified_phrase: Yahweh, your enemies have taunted you
  preserved_meaning: Yahweh is addressed as the target of his enemies’ scorn.
  reasoning_layer_used: source syntax, immediate parallelism, and lexical decision for חֵרְפוּ
  rationale: The direct sentence removes the difficult relative construction without introducing vague taunts.
- pob_phrase: with which they have taunted the footsteps
  simplified_phrase: They have mocked the footsteps
  preserved_meaning: The repeated accusation directs scorn at the footsteps of Yahweh’s anointed one.
  reasoning_layer_used: lexical decisions for חֵרְפוּ and עִקְּבוֹת
  rationale: A second sentence preserves both the repetition and the concrete footsteps image.
- pob_phrase: your anointed
  simplified_phrase: your anointed one
  preserved_meaning: The phrase primarily identifies Yahweh’s chosen Davidic king without making Messiah the main rendering.
  reasoning_layer_used: theological decision for מְשִׁיחֶךָ
  rationale: Adding “one” makes the descriptive title natural while retaining its royal meaning.
