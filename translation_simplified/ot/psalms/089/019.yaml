translation:
  language: en
  text: Then you spoke in a vision to your faithful ones[a]. You said, “I have given help to a mighty man[b]. I have raised up one I chose from among the people.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some ancient textual traditions read “your faithful one.”
    reason: textual_variant
  - marker: b
    text: More literally, “I have set help upon a mighty man.” “Mighty man” can also mean “warrior” or “hero.”
    reason: source_note
simplification_decisions:
- pob_phrase: Then you spoke in a vision to your faithful ones and said
  simplified_phrase: Then you spoke in a vision to your faithful ones. You said
  preserved_meaning: God communicated these words in a vision to his faithful ones.
  reasoning_layer_used: POB lexical decisions and textual-variant decision
  rationale: Two sentences clearly introduce the quotation while retaining the plural reading.
- pob_phrase: I have set help upon a mighty one
  simplified_phrase: I have given help to a mighty man
  preserved_meaning: God places help or support on the strong man he has chosen.
  reasoning_layer_used: POB lexical decisions for שִׁוִּיתִי, עֵזֶר, עַל, and גִּבּוֹר
  rationale: Natural English removes the opaque construction without turning the help into a task.
- pob_phrase: I have exalted one chosen from the people
  simplified_phrase: I have raised up one I chose from among the people
  preserved_meaning: God selected and elevated someone from the wider community.
  reasoning_layer_used: POB lexical and theological decisions for הֲרִימוֹתִי, בָּחוּר, and מֵעָם
  rationale: Active wording clarifies God's choice without adding a messianic identification.
