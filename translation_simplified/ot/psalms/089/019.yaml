translation:
  language: en
  text: Then, in a vision, you spoke to those who are faithful to you[a]. You said, “I have given help to a mighty man[b]. I have raised up a young man from among the people.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some ancient versions read “the one who is faithful to you.”
    reason: textual_variant
  - marker: b
    text: Or “a warrior.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: your faithful ones
  simplified_phrase: those who are faithful to you
  preserved_meaning: They are people characterized by faithfulness to God.
  reasoning_layer_used: POB lexical decision for לַחֲסִידֶיךָ
  rationale: The clause states the relationship plainly while preserving the plural reading.
- pob_phrase: I have bestowed help on
  simplified_phrase: I have given help to
  preserved_meaning: God grants help to the mighty man.
  reasoning_layer_used: POB source audit for שִׁוִּיתִי עֵזֶר עַל
  rationale: “Given help to” is common English and keeps help as the thing granted.
- pob_phrase: and said ... ; I have raised up
  simplified_phrase: You said ... . I have raised up
  preserved_meaning: The vision introduces two related declarations by God.
  reasoning_layer_used: POB syntax and lexical decisions
  rationale: Short sentences make the divine speech easier to follow without merging its two claims.
