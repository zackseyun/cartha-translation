simplification_decisions:
- pob_phrase: it will be established forever
  simplified_phrase: it will stand firm forever
  preserved_meaning: The implied subject will remain firmly established without end.
  reasoning_layer_used: Lexical decision for יִכּוֹן and theological decision on its implied subject
  rationale: “Stand firm” expresses lasting stability in more direct English while retaining the deliberately unspecified “it.”
- pob_phrase: and the witness in the sky is faithful
  simplified_phrase: The witness in the sky is faithful.
  preserved_meaning: A trustworthy heavenly witness confirms the enduring covenant promise.
  reasoning_layer_used: Lexical decisions for עֵד, שַׁחַק, and נֶאֱמָן
  rationale: A new sentence makes the poetic statement easier to follow without identifying the debated witness.
translation_notes:
  risk_flags:
  - risk: Readers may not know what “it” refers to.
    mitigation: The pronoun is retained because the Hebrew depends on the preceding context and does not specify either the throne or the royal line.
  - risk: Readers may assume that the witness is certainly the moon.
    mitigation: The main text preserves the ambiguity, while the footnote presents the moon only as a possible identification.
