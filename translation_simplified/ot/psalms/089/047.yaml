simplification_decisions:
- pob_phrase: Remember how short my lifetime is!
  simplified_phrase: Remember how short my life is!
  preserved_meaning: The psalmist directly asks God to consider how brief his life is.
  reasoning_layer_used: Lexical decisions for זְכָר and מֶה חָלֶד
  rationale: “Life” is more natural than “lifetime” while preserving the lament over its brevity.
- pob_phrase: For what vanity have you created
  simplified_phrase: Why have you created ... for futility?
  preserved_meaning: The psalmist asks what purpose there is in God creating humanity for emptiness or futility.
  reasoning_layer_used: Lexical decisions for עַל מַה and שָּׁוְא; applied revision
  rationale: The direct question is easier to understand and keeps both the purposive force and the lament.
- pob_phrase: all the sons of man
  simplified_phrase: all the sons of man
  preserved_meaning: The masculine Hebrew idiom refers generically to all human beings.
  reasoning_layer_used: Theological decision on בְּנֵי אָדָם
  rationale: The main text retains POB’s source-driven wording, while the note explains its inclusive scope.
