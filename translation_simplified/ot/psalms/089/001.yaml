simplification_decisions:
- pob_phrase: sing of the steadfast love of Yahweh
  simplified_phrase: sing ... about Yahweh’s steadfast love
  preserved_meaning: The psalmist resolves to celebrate Yahweh’s enduring covenant love in song.
  reasoning_layer_used: POB lexical decisions for חַסְדֵי, יְהוָה, and אָשִׁירָה
  rationale: “Sing about” is more familiar English while preserving Yahweh’s name and steadfast love.
- pob_phrase: from generation to generation
  simplified_phrase: to every generation
  preserved_meaning: The proclamation continues across successive generations.
  reasoning_layer_used: POB lexical decision for לְדֹר וָדֹר
  rationale: The POB-listed alternative expresses the same continuity more directly.
- pob_phrase: I will make your faithfulness known with my mouth
  simplified_phrase: I will proclaim ... how faithful you are
  preserved_meaning: The psalmist personally resolves to speak openly of God’s dependability.
  reasoning_layer_used: POB lexical decisions for אוֹדִיעַ, אֱמוּנָתְךָ, and בְּפִי
  rationale: “I will proclaim” keeps the speaker as actor and preserves the force of vocal declaration.
translation_notes:
