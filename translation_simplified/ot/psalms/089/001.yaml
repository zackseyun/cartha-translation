translation:
  language: en
  text: I will sing forever about Yahweh’s steadfast love.[a] I will proclaim to every generation how faithful you are.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be translated “mercies” or “acts of steadfast love,” referring to Yahweh’s covenant love shown through repeated acts of mercy.
