translation:
  language: en
  text: For who in heaven can compare with the LORD? Who among the sons of God is anything like the LORD?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “among the heavenly beings,” “among the divine beings,” or “among the sons of the mighty.” The Hebrew literally says “among the sons of God/gods.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: who in the skies can be compared to Yahweh?
  simplified_phrase: who in heaven can compare with the LORD?
  preserved_meaning: No heavenly being can equal the LORD.
  reasoning_layer_used: Lexical decision for בַשַּׁחַק and theological decision for יהוה
  rationale: The active wording is easier to read, while “heaven” keeps the celestial setting and “the LORD” follows the governing divine-name policy.
- pob_phrase: Who among the sons of God is like Yahweh?
  simplified_phrase: Who among the sons of God is anything like the LORD?
  preserved_meaning: None of the heavenly beings resembles or equals the LORD.
  reasoning_layer_used: Lexical and theological decisions for יִדְמֶה, בִּבְנֵי אֵלִים, and יהוה
  rationale: “Anything like” makes the rhetorical force natural while retaining the Hebrew image “sons of God.”
translation_notes:
  risk_flags:
  - risk: Modern readers may misunderstand “sons of God” as referring to human believers.
    mitigation: The footnote gives the contextually viable sense “heavenly beings” without replacing the Hebrew image.
