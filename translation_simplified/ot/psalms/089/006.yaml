translation:
  language: en
  text: For who in heaven can compare with Yahweh? Who among the sons of God is anything like Yahweh?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “among the heavenly beings,” “among the divine beings,” or “among the sons of the mighty.” The Hebrew literally says “among the sons of God/gods.”
