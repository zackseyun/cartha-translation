- pob_phrase: like one slain
  simplified_phrase: like someone slain in battle
  preserved_meaning: Rahab is compared to someone killed in battle.
  reasoning_layer_used: lexical decision for כֶחָלָל
  rationale: “Someone” is clearer than “one,” and “in battle” conveys the term’s martial sense.
- pob_phrase: You crushed Rahab like one slain; with your mighty arm you scattered your enemies.
  simplified_phrase: You crushed Rahab like someone slain in battle. With your mighty arm, you scattered your enemies.
  preserved_meaning: God crushes Rahab and personally scatters his enemies by his power, pictured as his arm.
  reasoning_layer_used: lexical decisions for דִכִּאתָ, בִּזְרוֹעַ עֻזְּךָ, and פִּזַּרְתָּ
