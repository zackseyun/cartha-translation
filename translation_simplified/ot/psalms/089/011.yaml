simplification_decisions:
- pob_phrase: The heavens are yours; the earth also is yours.
  simplified_phrase: Both the heavens and the earth belong to you.
  preserved_meaning: God possesses the heavens and the earth, with emphasis on both realms.
  reasoning_layer_used: Lexical decisions for לְךָ and אַף
  rationale: The documented alternative “belong to you” makes possession direct, while “both” preserves the added emphasis.
- pob_phrase: The world and all that fills it—you founded them.
  simplified_phrase: You founded the world and everything that fills it.
  preserved_meaning: God performed the foundational creative action for the world and all it contains.
  reasoning_layer_used: Lexical decision for יְסַדְתָּם and theological decision on creation language
  rationale: Ordinary English word order removes the difficult dash construction without weakening the creation image.
translation_notes:
