translation:
  language: en
  text: 'A prayer of David.


    Yahweh, turn your ear toward me and answer me, because I am poor and needy.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “afflicted and needy.” The Hebrew word translated “poor” can also mean afflicted or humbled.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Incline your ear
  simplified_phrase: turn your ear toward me
  preserved_meaning: The bodily image expresses attentive listening.
  reasoning_layer_used: POB lexical decision for הַטֵּה and אָזְנְךָ
  rationale: “Turn your ear toward me” keeps the Hebrew image in more familiar English.
- pob_phrase: O Yahweh
  simplified_phrase: Yahweh
  preserved_meaning: David directly addresses God by his covenant name.
  reasoning_layer_used: POB theological decision for יְהוָה
  rationale: Removing the archaic “O” makes the address natural while retaining “Yahweh.”
- pob_phrase: for I am poor and needy
  simplified_phrase: because I am poor and needy
  preserved_meaning: David’s need is the reason for his plea.
  reasoning_layer_used: POB lexical decisions for כִּי, עָנִי, and וְאֶבְיוֹן
  rationale: “Because” states the relationship more plainly than prayer-language “for.”
translation_notes:
  risk_flags:
  - risk: “Poor” may be understood only as financial poverty.
    mitigation: The footnote preserves the Hebrew word’s broader possibilities of affliction or humility.
