simplification_decisions:
- pob_phrase: Incline your ear, O Yahweh
  simplified_phrase: Yahweh, turn your ear toward me
  preserved_meaning: The prayer asks Yahweh to listen attentively while retaining the Hebrew image of turning the ear.
  reasoning_layer_used: POB lexical decisions for הַטֵּה, אָזְנְךָ, and יְהוָה
  rationale: “Turn your ear toward me” makes the embodied metaphor clear in common English.
- pob_phrase: for I am poor and needy
  simplified_phrase: because I am poor and needy
  preserved_meaning: The speaker’s poverty and need are the grounds for his plea.
  reasoning_layer_used: POB lexical decisions for כִּי, עָנִי, and וְאֶבְיוֹן
  rationale: “Because” states the relationship between the plea and its reason more directly.
translation_notes:
  risk_flags:
