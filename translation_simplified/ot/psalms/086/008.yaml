translation:
  language: en
  text: Lord, no one among the gods[a] is like you; no works compare with yours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “among the heavenly beings.” The Hebrew says “among the gods” to emphasize that no claimed divine power compares with the Lord.
