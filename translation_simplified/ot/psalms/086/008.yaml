translation:
  language: en
  text: Lord, no one among the gods is like you. Nothing anyone does is like what you do.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The gods” may also mean “the heavenly beings”; the phrase declares that no claimed divine power compares with the Lord.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: There is none like you among the gods, Lord
  simplified_phrase: Lord, no one among the gods is like you.
  preserved_meaning: The Lord is incomparable among all beings or powers called gods.
  reasoning_layer_used: Lexical and theological decisions on בָאֱלֹהִים
  rationale: Placing “Lord” first makes the direct address clear while retaining the plural “gods.”
- pob_phrase: and there are no works like yours
  simplified_phrase: Nothing anyone does is like what you do.
  preserved_meaning: No other deeds or acts compare with the Lord’s works.
  reasoning_layer_used: Lexical decision on כְמַעֲשֶׂיךָ and poetic parallelism
  rationale: The concrete wording keeps the comparison of deeds without adding a claim about ability.
translation_notes:
  risk_flags:
  - risk: “The gods” could sound like an endorsement of polytheism to modern readers.
    mitigation: The footnote gives the alternative “heavenly beings” and explains the phrase as incomparability.
