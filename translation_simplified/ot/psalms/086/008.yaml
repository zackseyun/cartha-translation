  preserved_meaning: The Lord is incomparable among all claimed divine powers.
  reasoning_layer_used: POB lexical and theological decisions on בָאֱלֹהִים
  rationale: The direct address comes first, and “no one” replaces the less common “there is none.”
- pob_phrase: there are no works like yours
