  simplified_phrase: Lord my God, I will praise you with all my heart
  preserved_meaning: The psalmist directly addresses God and promises wholehearted praise.
  reasoning_layer_used: The lexical and theological decisions preserve both divine titles, the personal relation, and the heart image.
  rationale: Placing the address first makes the sentence easier to follow.
- pob_phrase: and I will glorify your name forever
