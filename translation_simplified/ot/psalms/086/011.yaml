translation:
  language: en
  text: Yahweh, teach me your way, so I can live according to your truth.[a] Give me an undivided heart, so I will fear your name.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “live according to your faithfulness.” The Hebrew word can mean both “truth” and “faithfulness.”
    reason: lexical_alternative
  - marker: b
    text: Literally, “unite my heart”; this asks for freedom from divided loyalties.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: O Yahweh
