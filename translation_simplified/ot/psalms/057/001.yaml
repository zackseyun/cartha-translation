  text: Be gracious to me, God! Be gracious to me, because my whole being[a] takes refuge in you. I will take shelter in the shadow of your wings until the calamities[b] have passed by.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew “my soul” can also mean “my life” or “my whole self.”
