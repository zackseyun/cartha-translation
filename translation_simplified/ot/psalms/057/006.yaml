translation:
  language: en
  text: They set a net to catch me as I walked. My soul was bent low.[a] They dug a pit in front of me, but they themselves fell right into its middle. Selah[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “My soul” can also mean “I” or “my life”; the Hebrew does not clearly identify who caused this condition.
    reason: alternative_reading
  - marker: b
    text: The meaning of “Selah” is uncertain; it was probably a musical or worship marker.
    reason: source_note
