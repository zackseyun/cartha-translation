simplification_decisions:
- pob_phrase: Be exalted above the heavens, O God
  simplified_phrase: God, may you be honored above the heavens
  preserved_meaning: The prayer asks that God receive supreme honor without suggesting physical ascent.
  reasoning_layer_used: POB lexical decisions for רוּמָה, עַל, and אֱלֹהִים
  rationale: “May you be honored” explains exaltation plainly while “above the heavens” preserves the supremacy image.
- pob_phrase: let your glory be over all the earth
  simplified_phrase: May your glory be over the whole earth
  preserved_meaning: The prayer asks that God’s glory be over the earth in its entirety.
  reasoning_layer_used: POB lexical and theological decisions for עַל כָּל הָאָרֶץ and the implied wish
  rationale: “Whole earth” states the universal scope naturally without adding an image of spreading.
translation_notes:
  risk_flags:
