translation:
  language: en
  text: For the music leader. “Do Not Destroy.”[a] A miktam[b] associated with David,[c] from the time when he fled from Saul and was in the cave.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may be the name of a tune or a repeated line.
    reason: alternative_reading
  - marker: b
    text: The meaning of the Hebrew word “miktam” is uncertain.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew may mean by David, for David, or belonging to David.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For the choirmaster
  simplified_phrase: For the music leader
  preserved_meaning: The heading gives directions to the person leading the music.
  reasoning_layer_used: Lexical decision for לַמְנַצֵּחַ
  rationale: “Music leader” is clearer to readers unfamiliar with choirs in biblical worship.
- pob_phrase: Of David
  simplified_phrase: associated with David
  preserved_meaning: The heading links the psalm to David without deciding whether he wrote, received, or owned it.
  reasoning_layer_used: Lexical decision for לְדָוִד
  rationale: “Associated with” makes the documented ambiguity understandable in the main text.
- pob_phrase: when he fled from Saul, in the cave
  simplified_phrase: from the time when he fled from Saul and was in the cave
  preserved_meaning: The heading identifies David’s flight from Saul and his location in the cave as the historical setting.
  reasoning_layer_used: Lexical decisions for בְּבָרְחוֹ, מִפְּנֵי, and בַּמְּעָרָה
  rationale: The full clause states the setting in natural English without implying motion into the cave.
