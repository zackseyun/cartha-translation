  text: Unless he turns back,[a] he will sharpen his sword; he has bent his bow and prepared it.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Unless he repents.” The Hebrew expression means to turn back and can refer here to repentance.
    reason: lexical_alternative
  - marker: b
    text: The one preparing the weapons is probably God, ready to judge the unrepentant, though the words may instead refer to the wicked man.
    reason: alternative_reading
