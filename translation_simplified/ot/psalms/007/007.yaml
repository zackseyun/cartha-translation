translation:
  language: en
  text: Let the gathered peoples[a] surround you. Return high above them.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “nations.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew can also mean “above it,” referring to the gathered assembly as one whole.
