simplification_decisions:
- pob_phrase: the assembly of peoples
  simplified_phrase: the gathered peoples
  preserved_meaning: Many distinct peoples are assembled together.
  reasoning_layer_used: Lexical decisions for עֲדַת and לְאֻמִּים
  rationale: This turns the abstract noun “assembly” into a clear description while retaining “peoples.”
- pob_phrase: and over them return on high
  simplified_phrase: Return high above them
  preserved_meaning: God is asked to return to an exalted position over the gathered peoples.
  reasoning_layer_used: Lexical and theological decisions for וְעָלֶיהָ, לַמָּרוֹם, and שׁוּבָה
  rationale: Ordinary English word order clarifies the petition without adding explicit throne language.
translation_notes:
  risk_flags:
  - risk: “High above” may be read only as physical location rather than exalted rule or judgment.
    mitigation: The wording preserves POB’s spatial metaphor without resolving its theological tension.
