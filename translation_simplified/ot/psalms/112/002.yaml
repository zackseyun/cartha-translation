simplification_decisions:
- pob_phrase: His offspring
  simplified_phrase: His descendants
  preserved_meaning: The Hebrew term refers collectively to the man’s family line.
  reasoning_layer_used: POB lexical decision for זַרְעוֹ
  rationale: “Descendants” makes the collective family sense immediately clear.
- pob_phrase: mighty in the land
  simplified_phrase: powerful in the land
  preserved_meaning: The descendants will have notable strength or prominence without implying that they are warriors.
  reasoning_layer_used: POB lexical decisions for גִּבּוֹר and בָּאָרֶץ
  rationale: “Powerful” is common English and keeps the broad, nonmilitary sense.
- pob_phrase: the generation of the upright
  simplified_phrase: The descendants of those who live upright lives
  preserved_meaning: The blessing concerns the family line of morally upright people.
  reasoning_layer_used: POB lexical decisions for דּוֹר and יְשָׁרִים
  rationale: The wording explains both the family reference and the moral sense of “upright.”
