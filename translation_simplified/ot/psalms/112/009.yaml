translation:
  language: en
  text: He shares freely and gives to the poor. His righteousness lasts forever.[a] His horn[b] will be lifted high in honor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Righteousness” can also carry the sense of justice here.
    reason: lexical_alternative
  - marker: b
    text: A raised horn is a Hebrew picture of strength, dignity, and exalted status.
    reason: cultural_note
simplification_decisions:
- pob_phrase: He has distributed freely; he has given to the poor.
  simplified_phrase: He shares freely and gives to the poor.
  preserved_meaning: The righteous person characteristically gives generously to people in need.
  reasoning_layer_used: Lexical decisions for פִּזַּר, נָתַן, and לָאֶבְיוֹנִים.
  rationale: “Shares freely” expresses openhanded distribution in natural modern English while retaining the parallel act of giving.
- pob_phrase: His righteousness stands forever.
  simplified_phrase: His righteousness lasts forever.
  preserved_meaning: The rightness of his character and conduct has enduring significance.
  reasoning_layer_used: Lexical and theological decisions for צִדְקָתוֹ and עֹמֶדֶת לָעַד.
  rationale: “Lasts forever” states lasting permanence plainly without narrowing righteousness to charity or merit.
- pob_phrase: his horn will be lifted up in honor
  simplified_phrase: His horn will be lifted high in honor.
  preserved_meaning: His strength, dignity, or exalted status will be publicly raised in honor.
  reasoning_layer_used: Lexical decisions for קַרְנוֹ, תָּרוּם, and בְּכָבוֹד.
  rationale: Adding “high” clarifies the upward image while retaining the Hebrew horn metaphor.
translation_notes:
  risk_flags:
  - risk: Modern readers may not understand the raised-horn image.
    mitigation: The main text preserves the image, and footnote b explains its Hebrew sense.
  - risk: “Righteousness” may obscure the possible nuance of justice.
    mitigation: Footnote a preserves justice as a lexical alternative without narrowing the main text.
