  preserved_meaning: His inner resolve remains stable and secure.
  reasoning_layer_used: POB lexical decisions for סָמוּךְ and לִבּוֹ
  rationale: “Firm” expresses settled inner strength in common English.
- pob_phrase: he will not fear until he looks on
