  preserved_meaning: He remains fearless even when his opponents are before him.
  reasoning_layer_used: POB lexical decisions for לֹא יִירָא, עַד אֲשֶׁר, and יִרְאֶה
  rationale: “When” avoids suggesting that his courage ends once he sees them.
- pob_phrase: his adversaries
  simplified_phrase: those who oppose him
  preserved_meaning: They are hostile opponents or enemies.
  reasoning_layer_used: POB lexical decision for בְצָרָיו
  rationale: The phrase makes “adversaries” immediately understandable without narrowing its sense.
