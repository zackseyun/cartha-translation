  preserved_meaning: He witnesses the prosperity and honor of the righteous described in the psalm, and this angers him.
  reasoning_layer_used: Lexical rationale and psalm context
  rationale: Naming what he sees makes the connection clear without changing its object.
- pob_phrase: he will gnash his teeth
  simplified_phrase: He will grind his teeth in rage
  preserved_meaning: The physical image expresses intense anger and frustration.
  reasoning_layer_used: Lexical decision
  rationale: “Grind his teeth” keeps the image while explaining its emotional force.
- pob_phrase: the desire of the wicked will perish
  simplified_phrase: What the wicked long for will come to nothing
  preserved_meaning: The wicked people's hopes and aims will completely fail.
  reasoning_layer_used: Lexical rationale
  rationale: The concrete result is clearer than the abstract phrase “desire will perish.”
