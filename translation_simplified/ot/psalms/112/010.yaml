translation:
  language: en
  text: The wicked man[a] will see the righteous prosper and become angry. He will grind his teeth in rage and melt away. What the wicked long for will come to nothing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “The wicked”; the Hebrew singular “wicked man” represents wicked people generally.
