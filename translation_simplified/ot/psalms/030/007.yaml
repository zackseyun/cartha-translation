translation:
  language: en
  text: Yahweh, because you favored me, you made my mountain stand firm.[a] But when you hid your face, I was shaken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “you gave strength to my mountain.” The compact Hebrew may picture secure prosperity or stability.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: O Yahweh, by your favor
  simplified_phrase: Yahweh, because you favored me
  preserved_meaning: The psalmist directly addresses Yahweh and credits his security to Yahweh’s favor.
  reasoning_layer_used: POB lexical and theological decisions on the divine name and רָצוֹן
  rationale: The clause states the same cause in more direct everyday English.
- pob_phrase: you made my mountain stand strong
  simplified_phrase: you made my mountain stand firm
  preserved_meaning: Yahweh established the psalmist’s mountain as an image of strength and stability.
  reasoning_layer_used: POB lexical and theological decisions on עמד, עֹז, and the mountain image
  rationale: “Stand firm” is natural English while retaining the source image.
- pob_phrase: I was dismayed
  simplified_phrase: I was shaken
  preserved_meaning: The withdrawal of Yahweh’s favor left the psalmist deeply disturbed.
  reasoning_layer_used: POB lexical decision on נבהל and immediate poetic context
  rationale: “Shaken” communicates emotional disturbance more plainly without raising it to sheer terror.
