  text: Sing songs of thanks to Yahweh.[a] Make music to our God with a lyre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “Respond to Yahweh with thanksgiving,” probably through responsive singing.
    reason: lexical_alternative
