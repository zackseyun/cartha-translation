simplification_decisions:
- pob_phrase: to my brothers
  simplified_phrase: to my own brothers
  preserved_meaning: The psalmist is estranged from his actual brothers.
  reasoning_layer_used: Lexical and theological decisions on gendered kinship language
  rationale: “Own” makes the painful closeness of the relationship immediately clear without generalizing “brothers.”
- pob_phrase: and a foreigner to my mother's sons
  simplified_phrase: a foreigner to my mother’s sons
  preserved_meaning: The parallel line intensifies his alienation from his closest male family members.
  reasoning_layer_used: Lexical decision and Hebrew poetic parallelism
  rationale: Removing “and” gives the English line a smoother parallel structure while retaining both family terms and the foreigner image.
