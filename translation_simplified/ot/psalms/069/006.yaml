translation:
  language: en
  text: Lord Yahweh, ruler of armies,[b] do not let those who put their hope in you[a] suffer disgrace because of me. God of Israel, do not let those who seek you be humiliated because of me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “those who wait for you”; the Hebrew describes waiting with expectant hope.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew title is “Lord Yahweh of hosts,” where “hosts” means armies; it is traditionally rendered “Lord GOD of hosts.”
    reason: simplification_note
simplification_decisions:
- pob_phrase: Let not those who hope in you be put to shame because of me
  simplified_phrase: do not let those who put their hope in you suffer disgrace because of me
  preserved_meaning: The psalmist asks that trusting worshipers not experience shame on his account.
  reasoning_layer_used: Lexical decisions for יֵבֹשׁוּ, בִי, and קֹוֶיךָ
  rationale: Natural verbal phrases replace the formal wording while retaining hope, disgrace, and causation.
- pob_phrase: Lord Yahweh of hosts
  simplified_phrase: Lord Yahweh, ruler of armies
  preserved_meaning: Yahweh’s personal name and his authority over the hosts remain explicit.
  reasoning_layer_used: Divine-name doctrine and lexical decision for אֲדֹנָי יְהוָה צְבָאוֹת
  rationale: The opaque word “hosts” is expressed as armies without replacing the name Yahweh.
- pob_phrase: let not those who seek you be humiliated because of me, God of Israel
  simplified_phrase: God of Israel, do not let those who seek you be humiliated because of me
  preserved_meaning: The second prayer retains active seeking, stronger humiliation language, and the causal phrase.
  reasoning_layer_used: Lexical decisions for יִכָּלְמוּ, מְבַקְשֶׁיךָ, and בִי
  rationale: Moving the divine address forward creates a clear sentence without flattening the poetic distinction.
interpretive_expansions:
- pob_phrase: Lord Yahweh of hosts
  rendering: Lord Yahweh, ruler of armies
  claim: The title presents Yahweh as exercising authority over armies.
  evidence:
  - The Hebrew title uses צְבָאוֹת, the plural term rendered “hosts” or “armies.”
  - The POB lexical alternatives include “Lord GOD Almighty,” which reflects sovereign authority.
  confidence: high
  alternatives_preserved:
  - Lord Yahweh of hosts
  - Lord GOD of hosts
translation_notes:
  risk_flags:
  - risk: “Armies” may be understood as referring only to human military forces.
    mitigation: The footnote preserves the traditional title “of hosts” without narrowing which armies are meant.
