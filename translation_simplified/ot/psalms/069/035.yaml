  text: For God will save Zion and build Judah’s cities. His people will live there and possess it.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “her,” which may refer to Zion, Jerusalem or the restored city, or the land.
    reason: alternative_reading
  - marker: b
