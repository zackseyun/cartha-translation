translation:
  language: en
  text: Let heaven and earth praise him.[a] Let the seas and everything that moves[b] in them praise him too.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “May heaven and earth praise him”; the Hebrew may also be understood as “heaven and earth will praise him.”
    reason: alternative_reading
  - marker: b
    text: The Hebrew can refer to creatures that move, creep, or swarm.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Let heaven and earth praise him, the seas and everything that moves in them.
  simplified_phrase: Let heaven and earth praise him. Let the seas and everything that moves in them praise him too.
  preserved_meaning: All creation is summoned to praise God.
  reasoning_layer_used: Theological decision on the scope and force of the praise formula
  rationale: Repeating the command makes the poetic list easier to follow without changing its scope.
- pob_phrase: everything that moves in them
  simplified_phrase: everything that moves in them
  preserved_meaning: The phrase broadly includes sea creatures rather than only animals that creep.
  reasoning_layer_used: Lexical decision for רֹמֵשׂ
  rationale: The clear broad wording is retained because narrower alternatives could mislead readers.
translation_notes:
  risk_flags:
  - risk: Splitting the line could make the seas sound like a separate command rather than part of one poetic summons.
    mitigation: “Too” preserves the connection between both parts of the summons.
