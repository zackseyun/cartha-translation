translation:
  language: en
  text: Those who hate me for no reason outnumber the hairs on my head. My deceitful enemies[a] are powerful and want to destroy me. I must give back what I did not steal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may describe these enemies as deceitful or say that they oppose me wrongfully.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says, “then I restore,” and may imply being forced to repay what was not stolen.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: are more than the hairs of my head
  simplified_phrase: outnumber the hairs on my head
  preserved_meaning: The enemies are pictured as too numerous to count.
  reasoning_layer_used: Lexical decision for רַבּוּ and the comparative phrase
  rationale: “Outnumber” states the comparison naturally while preserving the vivid image.
- pob_phrase: those who would destroy me, my false enemies, are mighty
  simplified_phrase: My deceitful enemies are powerful and want to destroy me
  preserved_meaning: The enemies are deceptive, strong, and intent on the speaker’s ruin.
  reasoning_layer_used: Lexical decisions for עָצְמוּ, מַצְמִיתַי, and אֹיְבַי שֶׁקֶר
  rationale: Ordinary word order and common terms preserve both their power and hostile intent.
- pob_phrase: What I did not steal, then I must restore
  simplified_phrase: I must give back what I did not steal
  preserved_meaning: The innocent speaker must make restitution for something he never stole.
  reasoning_layer_used: Lexical and theological decisions for אֲשֶׁר לֹא גָזַלְתִּי and אָז אָשִׁיב
  rationale: “Give back” clarifies “restore,” while “must” retains the implied coercion.
