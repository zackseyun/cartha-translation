translation:
  language: en
  text: I am exhausted from crying out. My throat is parched,[a] and my eyes grow weak as I wait for my God.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “my throat is hoarse.” The Hebrew image suggests dryness or burning after prolonged crying.
    reason: lexical_alternative
  - marker: b
    text: Or “as I hope in my God.” The Hebrew includes both waiting and hopeful expectation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I am weary from my crying
  simplified_phrase: I am exhausted from crying out
  preserved_meaning: Repeated cries for help have left the speaker weary.
  reasoning_layer_used: POB lexical decisions for יָגַעְתִּי and בְּקָרְאִי
  rationale: “Exhausted” and “crying out” state the lament in immediate common English.
- pob_phrase: my eyes fail
  simplified_phrase: my eyes grow weak
  preserved_meaning: The speaker's eyesight is being spent through prolonged waiting.
  reasoning_layer_used: POB lexical decision for כָּלוּ
  rationale: “Grow weak” makes the bodily exhaustion clearer without removing the image of failing eyes.
