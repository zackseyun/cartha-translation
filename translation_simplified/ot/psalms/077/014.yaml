simplification_decisions:
- pob_phrase: who works wonders
  simplified_phrase: who does wonders
  preserved_meaning: God is characterized by extraordinary acts.
  reasoning_layer_used: POB lexical decision for עֹשֵׂה פֶלֶא
  rationale: “Does wonders” is more immediate English while keeping the defining action and the biblical image.
- pob_phrase: you have made your strength known
  simplified_phrase: You have shown your strength
  preserved_meaning: God caused others to recognize his strength through his acts.
  reasoning_layer_used: POB lexical decision for הוֹדַעְתָּ and עֻזֶּךָ
  rationale: “Shown” expresses the causative sense in simpler wording.
- pob_phrase: among the peoples
  simplified_phrase: among different peoples
  preserved_meaning: God’s strength was publicly displayed across more than one people group.
  reasoning_layer_used: POB theological decision on בָעַמִּים
  rationale: “Different peoples” clarifies the plural group sense without narrowing it to modern states.
