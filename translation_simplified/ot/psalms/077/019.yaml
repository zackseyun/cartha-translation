translation:
  language: en
  text: Your way went through the sea[a], and your paths went through many waters. Yet no one could make out your footprints[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “was in the sea ... in many waters.” Here the Hebrew likely describes movement through the waters.
    reason: lexical_alternative
  - marker: b
    text: Or “tracks” or “steps.” The wording may mean that they were unseen, unrecognized, or impossible to trace.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Your way was through the sea
  simplified_phrase: Your way went through the sea
  preserved_meaning: God’s route passed through the sea without explicitly naming the exodus crossing.
  reasoning_layer_used: Lexical and theological decisions
  rationale: “Went through” states the movement plainly while retaining the poetic image.
- pob_phrase: your paths through many waters
  simplified_phrase: your paths went through many waters
  preserved_meaning: God’s paths passed through the waters in parallel with his way through the sea.
  reasoning_layer_used: Lexical decisions for שְׁבִילֶיךָ and בְּמַיִם רַבִּים
  rationale: Repeating “went through” completes the thought in ordinary English and preserves both images.
- pob_phrase: yet your footprints were not known
  simplified_phrase: Yet no one could make out your footprints
  preserved_meaning: The traces of God’s passage were not perceived, recognized, or traced.
  reasoning_layer_used: Lexical decisions for עִקְּבוֹתֶיךָ and לֹא נֹדָעוּ
  rationale: “Could make out” gives readers a concrete way to understand “known” without limiting it to sight.
interpretive_expansions:
- pob_phrase: your footprints were not known
  rendering: no one could make out your footprints
  claim: People could not perceive, recognize, or trace the signs of God’s passage.
  evidence:
  - The Hebrew passive leaves the observer unstated.
  - The POB audit preserves unseen, unrecognized, and untraceable as possible senses.
  - The footprint image naturally concerns traces left by a passage.
  confidence: moderate
  alternatives_preserved:
  - unseen
  - unrecognized
  - impossible to trace
