simplification_decisions:
- pob_phrase: The waters saw you, O God;
  simplified_phrase: The waters saw you, God.
  preserved_meaning: The waters are pictured as seeing God and reacting to his presence.
  reasoning_layer_used: Lexical and theological decisions on רָאוּךָ and cosmic-water personification
  rationale: A separate sentence makes the direct address clear without the formal vocative “O.”
- pob_phrase: the waters saw you and writhed
  simplified_phrase: The waters saw you and writhed
  preserved_meaning: The repeated words retain the poetic emphasis and the waters’ violent bodily agitation.
  reasoning_layer_used: Lexical decisions on מַיִם, רָאוּךָ, and יָחִילוּ
  rationale: The repetition and vivid verb remain because both carry important poetic force.
- pob_phrase: even the depths trembled
  simplified_phrase: even the deep waters trembled
  preserved_meaning: The ocean depths also quake before God.
  reasoning_layer_used: Lexical decisions on אַף, יִרְגְּזוּ, and תְהֹמוֹת
  rationale: “Deep waters” states the concrete referent more plainly than “the depths.”
