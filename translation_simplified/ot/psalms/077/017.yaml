simplification_decisions:
- pob_phrase: The clouds poured out water
  simplified_phrase: The clouds poured down water
  preserved_meaning: The clouds released water in a strong, abundant flow.
  reasoning_layer_used: Lexical decision for זֹרְמוּ and the storm context
  rationale: “Poured down” is the natural modern expression for water falling from clouds.
- pob_phrase: the skies gave forth a sound
  simplified_phrase: A sound rang out from the skies
  preserved_meaning: A powerful sound came from the skies without explicitly identifying it as thunder.
  reasoning_layer_used: Lexical decision for קוֹל נָתְנוּ
  rationale: “Rang out” replaces the stiff idiom while retaining the source’s broad word “sound.”
- pob_phrase: indeed, your arrows moved about
  simplified_phrase: Yes, your arrows moved back and forth
  preserved_meaning: God’s arrows moved to and fro in the storm, likely as an image of lightning.
  reasoning_layer_used: Lexical and theological decisions for אַף, חֲצָצֶיךָ, and יִתְהַלָּכוּ
  rationale: The wording clarifies the movement without specifying flight or replacing the arrow metaphor.
