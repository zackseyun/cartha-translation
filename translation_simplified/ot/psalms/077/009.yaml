simplification_decisions:
- pob_phrase: forgotten to be gracious
  simplified_phrase: forgotten to show grace
  preserved_meaning: The question asks whether God has ceased acting graciously, not whether he has lost the ability.
  reasoning_layer_used: Lexical decision for חַנּוֹת and theological decision to retain a rhetorical question.
  rationale: “Show grace” expresses gracious action clearly while preserving the biblical concept of grace.
- pob_phrase: in anger shut up his compassion
  simplified_phrase: in anger, closed off his compassion
  preserved_meaning: God remains the acting subject, and his compassion is pictured as being closed away.
  reasoning_layer_used: Lexical decisions for קָפַץ, בְּאַף, and רַחֲמָיו.
  rationale: “Closed off” is natural modern English and retains the Hebrew image of shutting.
translation_notes:
  risk_flags:
  - risk: “Closed off” may sound less concrete than physically shutting something.
    mitigation: The wording still preserves the source image of compassion being closed away.
