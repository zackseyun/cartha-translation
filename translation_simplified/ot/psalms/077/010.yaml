translation:
  language: en
  text: Then I said, “This is my grief:[a] I think of the years when the Most High showed the power of his right hand.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “This is my weakness,” or “This is my sickness.” The Hebrew word is difficult and can refer to grief, weakness, or illness.
    reason: lexical_alternative
  - marker: b
    text: Or, “It grieves me that the right hand of the Most High has changed.” The difficult Hebrew may refer to a change in his right hand rather than to the years of its activity.
    reason: alternative_reading
