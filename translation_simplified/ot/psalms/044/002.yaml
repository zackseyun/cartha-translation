simplification_decisions:
- pob_phrase: You, by your hand
  simplified_phrase: By your own hand, you
  preserved_meaning: God acted by his own power while the concrete image of his hand remains.
  reasoning_layer_used: lexical decision for יָדְךָ
  rationale: Natural clause order makes the opening easier to read without weakening God’s agency.
- pob_phrase: drove out nations and planted them
  simplified_phrase: drove out nations and planted our ancestors there
  preserved_meaning: God expelled the nations and established Israel’s ancestors in the land.
  reasoning_layer_used: theological decision on the first suffix
  rationale: Naming the implied ancestors prevents readers from mistaking them for the expelled nations.
- pob_phrase: you afflicted peoples and sent them out
  simplified_phrase: You afflicted those peoples and sent them out
  preserved_meaning: God judged and removed the same peoples previously called nations.
  reasoning_layer_used: lexical decisions for לְאֻמִּים and וַתְּשַׁלְּחֵם
  rationale: A new sentence and “those” clarify the parallel thought while retaining its distinct terms.
