translation:
  language: en
  text: By your own hand, you drove out nations and planted our ancestors there. You afflicted those peoples and sent them out.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “You afflicted peoples and caused our ancestors to spread out.” The final pronoun may refer to Israel’s ancestors rather than to the peoples.
