- pob_phrase: it was not by their sword that they possessed the land
  simplified_phrase: Their swords did not win them the land
  preserved_meaning: Israel did not gain the land through its weapons.
  reasoning_layer_used: Lexical decision for יָרְשׁוּ and the conquest context.
  rationale: “Win them the land” makes the military setting clear in natural English.
- pob_phrase: their arm did not save them
  simplified_phrase: their own arms did not save them
  preserved_meaning: Their own power did not deliver them.
  reasoning_layer_used: Lexical and theological decisions on זְרוֹעָם.
  rationale: “Own” clarifies the contrast while the arm image remains intact.
- pob_phrase: but by your right hand, your arm, and the light of your face
  simplified_phrase: Instead, you gave them the land and saved them by your right hand, your arm, and the light of your face
  preserved_meaning: God both gave them possession of the land and delivered them through his power and favor.
  reasoning_layer_used: Theological decision on divine agency and the Hebrew poetic ellipsis.
  rationale: The positive clause now states both outcomes explicitly without merging them.
