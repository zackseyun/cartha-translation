translation:
  language: en
  text: They did not take possession of the land by their own sword, and their own arm did not save them. Instead, they took possession through your right hand, your arm, and the light of your face[a], because you delighted in them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the light of your presence”; “the light of your face” is an image of God’s favor.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: possess the land by their sword
  simplified_phrase: take possession of the land by their own sword
  preserved_meaning: They obtained the land, but not through their weapons.
  reasoning_layer_used: Lexical decision for יָרְשׁוּ and divine-agency contrast
  rationale: “Take possession” makes the conquest setting clear while preserving the sword image.
- pob_phrase: but your right hand, your arm, and the light of your face did
  simplified_phrase: Instead, they took possession through your right hand, your arm, and the light of your face
  preserved_meaning: God’s action, not their military strength, enabled their possession of the land.
  reasoning_layer_used: Theological decision and grounding review of the Hebrew ellipsis
  rationale: The wording avoids the vague “did” without adding separate claims that God gave the land and saved them.
interpretive_expansions:
- pob_phrase: your right hand, your arm, and the light of your face did
  rendering: they took possession through your right hand, your arm, and the light of your face
  claim: The elliptical positive clause is expressed through the land-possession result already stated.
  evidence:
  - The clause contrasts their sword and arm with God’s right hand, arm, and shining face.
  - The grounding review permits retaining possession as the stated result without adding “gave.”
  confidence: moderate
  alternatives_preserved:
  - The compact wording “did” may leave the ellipsis broader.
  - “Secured the land for them” is another contextual rendering.
translation_notes:
  risk_flags:
  - risk: Supplying “took possession” narrows the scope of the Hebrew ellipsis.
    mitigation: Moderate confidence is recorded, and no separate affirmative claim about saving is added.
  - risk: “The light of your face” may be unfamiliar to modern readers.
    mitigation: The image is retained and explained in a footnote as God’s favor.
