translation:
  language: en
  text: Their swords did not win them the land, and their own arms did not save them. Instead, you gave them the land and saved them by your right hand, your arm, and the light of your face[a], because you delighted in them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the light of your presence”; the Hebrew picture expresses God’s favor.
    reason: lexical_alternative
