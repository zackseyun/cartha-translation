- pob_phrase: redeem us for the sake of your steadfast love
  simplified_phrase: Redeem us for the sake of your steadfast love
  preserved_meaning: The plea asks for covenantal deliverance grounded in God’s loyal love.
  reasoning_layer_used: The lexical and theological decisions retain “redeem” and “steadfast love” for their covenantal depth.
  rationale: These readable biblical terms preserve meaning that “rescue” and “mercy” would narrow.
