translation:
  language: en
  text: For when trouble comes, he will hide me in his shelter.[a] He will keep me out of sight in a hidden place inside his tent. He will lift me high onto a rock.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word for “shelter” can also mean “booth,” “pavilion,” or “tabernacle,” and may suggest a sanctuary.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: in the day of trouble
  simplified_phrase: when trouble comes
  preserved_meaning: A time of adversity or calamity is in view, not moral evil.
  reasoning_layer_used: lexical decision and theological decision for בְּיוֹם רָעָה
  rationale: The temporal idea is recast in ordinary English without changing its sense.
- pob_phrase: he will conceal me in the secret place of his tent
  simplified_phrase: He will keep me out of sight in a hidden place inside his tent.
  preserved_meaning: God conceals the psalmist in a protected, hidden part of his tent.
  reasoning_layer_used: lexical decisions for יַסְתִּרֵנִי, בְּסֵתֶר, and אָהֳלוֹ
  rationale: Concrete everyday wording clarifies the location while retaining the concealment and tent images.
- pob_phrase: he will lift me high upon a rock
  simplified_phrase: He will lift me high onto a rock.
  preserved_meaning: God raises the psalmist to a secure, elevated place.
  reasoning_layer_used: lexical decisions for בְּצוּר and יְרוֹמְמֵנִי
  rationale: “Onto” makes the movement natural in modern English while preserving the vertical rescue image.
