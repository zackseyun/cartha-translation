translation:
  language: en
  text: 'I have asked Yahweh for one thing, and this is what I will seek: to live in Yahweh’s house all my life, so I may gaze on Yahweh’s beauty and inquire in his temple.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “seek” or “meditate attentively” in his temple.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: One thing I have asked from Yahweh
  simplified_phrase: I have asked Yahweh for one thing
  preserved_meaning: The psalmist has made one central request to Yahweh.
  reasoning_layer_used: POB lexical decision for שָׁאַלְתִּי and מֵאֵת יְהוָה
  rationale: Ordinary English says “asked Yahweh for” rather than “asked from Yahweh.”
- pob_phrase: that I may dwell in the house of Yahweh all the days of my life
  simplified_phrase: to live in Yahweh’s house all my life
  preserved_meaning: He seeks lifelong residence in Yahweh’s house.
  reasoning_layer_used: POB lexical decisions for שִׁבְתִּי and כָּל יְמֵי חַיַּי
  rationale: “Live” and “all my life” communicate the same enduring desire more directly.
- pob_phrase: to behold the beauty of Yahweh
  simplified_phrase: so I may gaze on Yahweh’s beauty
  preserved_meaning: He desires sustained, contemplative sight of Yahweh’s beauty.
  reasoning_layer_used: POB lexical decision for לַחֲזוֹת and theological decision for נֹעַם יְהוָה
  rationale: “Gaze on” keeps the contemplative force of “behold” in familiar English.
