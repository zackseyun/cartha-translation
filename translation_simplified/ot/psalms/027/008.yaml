translation:
  language: en
  text: In my heart, I hear:[a] “Seek my face.” Yahweh, I seek your face.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew opening is difficult. More literally, it says, “My heart says to you,” and it may also mean, “Concerning you my heart says,” or “My heart says of you, ‘Seek his face.’”
    reason: alternative_reading
  - marker: b
    text: “Your face” can also mean “your presence,” but the face image is repeated in Hebrew.
    reason: lexical_alternative
  - marker: c
    text: “I seek” may also be understood as “I will seek.”
    reason: lexical_alternative
