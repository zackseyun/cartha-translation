translation:
  language: en
  text: Do not hand me over to my enemies to do as they wish, for false witnesses have risen against me and breathe out violence.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “and one who breathes out violence.” The Hebrew may refer collectively to the false witnesses or highlight a single violent witness.
    reason: lexical_alternative
