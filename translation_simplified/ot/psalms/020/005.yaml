translation:
  language: en
  text: We will shout with joy over your salvation.[a] In the name of our God, we will lift our banners high. May Yahweh grant all that you have asked for.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “your victory” or “your deliverance”; the Hebrew word has a broad range of meaning.
    reason: lexical_alternative
  - marker: b
    text: Or “Yahweh will grant all that you have asked for”; the Hebrew may express either a prayer or a future statement.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: shout for joy in your salvation
  simplified_phrase: shout with joy over your salvation
  preserved_meaning: The people celebrate the addressee’s salvation with jubilant shouts.
  reasoning_layer_used: Lexical decision for נְרַנְּנָה and theological decision for יְשׁוּעָה
  rationale: The new phrasing is more natural while retaining both vocal celebration and the broad term “salvation.”
- pob_phrase: we will raise our banners
  simplified_phrase: we will lift our banners high
  preserved_meaning: The people visibly display banners in celebration under God’s name.
  reasoning_layer_used: Lexical decision for נִדְגֹּל
  rationale: “Lift our banners high” makes the concrete celebratory image immediately clear.
- pob_phrase: fulfill all your requests
  simplified_phrase: grant all that you have asked for
  preserved_meaning: The community prays that Yahweh will answer every request.
  reasoning_layer_used: Lexical decision for כָּל מִשְׁאֲלוֹתֶיךָ and theological decision for יְמַלֵּא
  rationale: The wording replaces formal prayer language without changing the clause from a wish into a prediction.
translation_notes:
  risk_flags:
