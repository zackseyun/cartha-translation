simplification_decisions:
- pob_phrase: Zion heard and rejoiced, and the daughters of Judah exulted
  simplified_phrase: Zion heard and rejoiced. The daughters of Judah were overjoyed
  preserved_meaning: Zion and Judah’s daughter communities respond with joy, with the second expression conveying stronger emotion.
  reasoning_layer_used: POB lexical decisions for שׂמח, גיל, and בנות יהודה
  rationale: Two sentences ease reading, while “overjoyed” communicates the stronger force of “exulted.”
- pob_phrase: O Yahweh
  simplified_phrase: Yahweh
  preserved_meaning: The revealed divine name remains a direct address.
  reasoning_layer_used: POB theological decision for יהוה
  rationale: Modern English can address Yahweh directly without the archaic vocative “O.”
- pob_phrase: the daughters of Judah
  simplified_phrase: the daughters of Judah[a]
  preserved_meaning: The Hebrew image and its possible geographic sense both remain visible.
  reasoning_layer_used: POB lexical and theological decisions for בנות יהודה
