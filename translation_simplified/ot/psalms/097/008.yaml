    mitigation: It preserves the stronger emotional force in language common readers readily understand.
  - risk: “Daughters of Judah” may initially sound like a reference only to women.
    mitigation: The footnote preserves the possible meaning “towns or villages of Judah” without resolving the ambiguity.
