translation:
  language: en
  text: You who love Yahweh, hate evil! He protects the lives[a] of his faithful people. He rescues them from the grip of wicked people.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can also mean “persons” or “souls,” but here it refers to their lives.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: He guards the lives of his faithful ones
  simplified_phrase: He protects the lives of his faithful people
  preserved_meaning: Yahweh characteristically watches over the lives of those who are faithful to him.
  reasoning_layer_used: Lexical and theological decisions on נַפְשׁוֹת and חֲסִידָיו
  rationale: “Protects” and “faithful people” express the same sense in more familiar English.
- pob_phrase: from the hand of the wicked he delivers them
  simplified_phrase: He rescues them from the grip of wicked people
  preserved_meaning: Yahweh actively frees his people from the power and control of evil people.
  reasoning_layer_used: Lexical decisions on מִיַּד, רְשָׁעִים, and יַצִּילֵם
  rationale: “Grip” keeps the bodily image of controlling power while making the idiom immediately clear.
- pob_phrase: You who love Yahweh, hate evil.
  simplified_phrase: You who love Yahweh, hate evil!
  preserved_meaning: Those who love Yahweh receive a direct command to reject evil.
  reasoning_layer_used: Lexical decision on the imperative שִׂנְאוּ
  rationale: The exclamation point makes the command’s force clear without softening “hate.”
