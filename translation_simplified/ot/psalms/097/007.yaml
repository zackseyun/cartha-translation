translation:
  language: en
  text: May everyone who serves carved images be disgraced—everyone who takes pride in idols. All gods,[a] bow down to him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “all gods.” This may mean the gods of the nations or heavenly beings, sometimes called angels.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Let all who serve carved images be put to shame
  simplified_phrase: May everyone who serves carved images be disgraced
  preserved_meaning: Those devoted to carved images are called to suffer shame and humiliation.
  reasoning_layer_used: Lexical decision for יֵבֹשׁוּ and contextual jussive force
  rationale: “May everyone” states the poetic wish naturally while “be disgraced” retains its force.
- pob_phrase: those who boast in idols
  simplified_phrase: everyone who takes pride in idols
  preserved_meaning: The same worshipers proudly trust in their idols.
  reasoning_layer_used: Lexical decision for הַמִּתְהַלְלִים
  rationale: “Takes pride in” expresses the meaning of boasting in more familiar English.
- pob_phrase: bow down to him, all gods
  simplified_phrase: All gods, bow down to him
  preserved_meaning: Every being called a god is commanded to bow in homage to the LORD.
  reasoning_layer_used: Lexical decisions for הִשְׁתַּחֲווּ and אֱלֹהִים
  rationale: Direct address clarifies the command while preserving both the physical image and “gods.”
translation_notes:
  risk_flags:
  - risk: Modern readers may assume “all gods” affirms the real existence of rival deities.
    mitigation: The footnote preserves the possible polemical and heavenly-being readings without resolving them.
