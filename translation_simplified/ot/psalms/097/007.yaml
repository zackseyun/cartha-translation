  preserved_meaning: These people give religious service to carved images.
  reasoning_layer_used: Lexical decision for עֹבְדֵי and immediate context
  rationale: “Worships” prevents “serve” from sounding like ordinary work.
- pob_phrase: those who boast in idols
  simplified_phrase: everyone who boasts in idols
  preserved_meaning: The same idol worshipers proudly exalt what they trust.
  reasoning_layer_used: Lexical decision for הַמִּתְהַלְלִים
  rationale: “Boasts” retains the condemnatory force that “takes pride” weakened.
- pob_phrase: bow down to him, all gods
  simplified_phrase: All gods, bow down to him
  preserved_meaning: All beings called gods are commanded to show homage to the LORD.
  reasoning_layer_used: Lexical and theological decisions for הִשְׁתַּחֲווּ and אֱלֹהִים
  rationale: Natural English order preserves the physical image and unresolved term “gods.”
