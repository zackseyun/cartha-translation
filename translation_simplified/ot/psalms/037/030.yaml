translation:
  language: en
  text: A righteous man’s mouth speaks wisdom, and his tongue says what is just.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “speaks justice” or “speaks judgment.”
    reason: lexical_alternative
  - marker: b
    text: The first line may also suggest quietly murmuring or reflecting on wisdom, though the parallel line points to spoken words.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The mouth of the righteous
  simplified_phrase: A righteous man’s mouth
  preserved_meaning: A representative righteous individual is described through the poetic image of his mouth.
  reasoning_layer_used: lexical and theological decisions
  rationale: The possessive form is more natural while retaining the masculine singular and mouth image.
- pob_phrase: utters wisdom
  simplified_phrase: speaks wisdom
  preserved_meaning: His thoughtful speech expresses wisdom aloud.
  reasoning_layer_used: lexical decision and poetic parallelism
  rationale: “Speaks” is clearer than “utters,” and the parallel reference to his tongue supports audible speech.
- pob_phrase: speaks justice
  simplified_phrase: says what is just
  preserved_meaning: His speech agrees with justice and what is right.
  reasoning_layer_used: lexical decision
  rationale: The phrase explains “justice” in ordinary English without limiting it to a courtroom judgment.
