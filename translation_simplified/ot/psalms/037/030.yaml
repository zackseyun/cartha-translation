translation:
  language: en
  text: A righteous man’s mouth speaks wisdom, and his tongue speaks what is just.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb may also mean “murmurs” or “meditates,” though the parallel phrase “his tongue speaks” suggests spoken expression here. “What is just” may also be translated “justice” or “judgment.”
