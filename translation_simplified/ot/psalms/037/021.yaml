  preserved_meaning: The righteous shows a gracious disposition through giving.
  reasoning_layer_used: Lexical decisions for חוֹנֵן and וְנוֹתֵן
  rationale: “Is kind” clearly conveys gracious favor while leaving “gives” as a distinct action.
- pob_phrase: The wicked ... the righteous
