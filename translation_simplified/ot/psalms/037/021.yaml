translation:
  language: en
  text: The wicked borrows but does not pay it back. The righteous, however, shows grace and gives.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “gives”; some understand this in context as generous lending.
