simplification_decisions:
- pob_phrase: does not repay
  simplified_phrase: does not pay it back
  preserved_meaning: The wicked person fails to return what was borrowed.
  reasoning_layer_used: Lexical decision for לֹא יְשַׁלֵּם
  rationale: The common phrase “pay it back” clearly expresses repayment in the borrowing context.
- pob_phrase: is gracious and gives
  simplified_phrase: shows grace and gives
  preserved_meaning: The righteous person acts with grace or favor and also gives.
  reasoning_layer_used: Lexical decisions for חוֹנֵן and וְנוֹתֵן
  rationale: This wording makes gracious action clearer while keeping giving distinct and broad.
- pob_phrase: The wicked ... but the righteous
  simplified_phrase: The wicked ... The righteous, however
  preserved_meaning: The verse contrasts two representative kinds of person.
  reasoning_layer_used: Theological decision on representative singular class terms
  rationale: Two short sentences improve readability without changing the singular wisdom contrast.
translation_notes:
  risk_flags:
