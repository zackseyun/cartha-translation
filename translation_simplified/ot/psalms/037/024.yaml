  text: He may fall, but he will not be thrown down, because Yahweh holds his hand.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Though he falls
  simplified_phrase: He may fall, but
  preserved_meaning: The righteous person can suffer a setback without the setback becoming final.
  reasoning_layer_used: Lexical decision for כִּי and יִפֹּל
  rationale: The new clause makes the concessive contrast clear while keeping the fall broad and possible.
- pob_phrase: he will not be hurled down
  simplified_phrase: he will not be thrown down
  preserved_meaning: The second verb remains stronger than the initial fall and describes being forcefully cast down.
  reasoning_layer_used: Lexical decision for יוּטָל
  rationale: “Thrown down” is more common English than “hurled down” without weakening the passive image.
- pob_phrase: for Yahweh holds his hand
  simplified_phrase: because Yahweh holds his hand
  preserved_meaning: Yahweh’s continuing personal support keeps the person from being cast down.
  reasoning_layer_used: Applied revision and lexical decisions for יְהוָה, סוֹמֵךְ, and יָדוֹ
  rationale: “Because” states the reason naturally, while the divine name and hand-holding image remain intact.
interpretive_expansions:
