simplification_decisions:
- pob_phrase: Though he falls
  simplified_phrase: He may fall, but
  preserved_meaning: The righteous person can suffer a setback without the verse specifying what kind.
  reasoning_layer_used: Lexical and theological decisions on יִפֹּל and the metaphor of falling
  rationale: The recast clause makes the contrast immediate while preserving the broad metaphor.
- pob_phrase: he will not be hurled down
  simplified_phrase: he will not be thrown down
  preserved_meaning: His fall will not result in his being forcibly cast down.
  reasoning_layer_used: Lexical decision on יוּטָל
  rationale: “Thrown down” is more common English while remaining distinct from simply falling.
- pob_phrase: Yahweh holds his hand
  simplified_phrase: Yahweh is holding his hand
  preserved_meaning: Yahweh continually supports him through a vivid hand-holding image.
  reasoning_layer_used: Lexical decisions on סוֹמֵךְ and יָדוֹ plus the applied revision
  rationale: The progressive wording naturally conveys continuing support without losing the hand image.
