translation:
  language: en
  text: For Yahweh loves justice. He never abandons his faithful people; they are preserved forever. But the descendants of the wicked will be cut off.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: For Yahweh loves justice and does not forsake
  simplified_phrase: For Yahweh loves justice. He never abandons
  preserved_meaning: Yahweh loves what is just and will not leave his people.
  reasoning_layer_used: Lexical decisions for מִשְׁפָּט and יַעֲזֹב
  rationale: A sentence break and the common verb “abandons” make the assurance easier to follow.
- pob_phrase: his faithful ones
  simplified_phrase: his faithful people
  preserved_meaning: The phrase still refers to people marked by covenant loyalty to Yahweh.
  reasoning_layer_used: Lexical and theological decisions for חֲסִידָיו
  rationale: “Faithful people” is natural English and avoids the technical overtones of “saints.”
- pob_phrase: the offspring of the wicked
  simplified_phrase: the descendants of the wicked
  preserved_meaning: The coming judgment extends to the posterity of wicked people.
  reasoning_layer_used: Lexical decision for זֶרַע
  rationale: “Descendants” makes the reference to later generations immediately clear.
