  text: But he passed away,[a] and look—he was gone. I looked for him, but he could not be found.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “passed by”; here it pictures the wicked man disappearing from view.
