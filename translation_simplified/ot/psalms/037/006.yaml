simplification_decisions:
- pob_phrase: He will bring forth your righteousness like the light
  simplified_phrase: He will make your righteousness shine like the light
  preserved_meaning: God will cause the person’s right standing to become clearly visible.
  reasoning_layer_used: Lexical decisions for וְהוֹצִיא, כָאוֹר, and צִדְקֶךָ
  rationale: “Make ... shine” naturally expresses the causative action through the verse’s light image.
- pob_phrase: your justice
  simplified_phrase: the justice of your cause
  preserved_meaning: The justness of the person’s case will be publicly evident.
  reasoning_layer_used: Lexical decision for וּמִשְׁפָּטֶךָ
  rationale: “Of your cause” clarifies that justice describes the person’s case rather than an act of sentencing.
- pob_phrase: like the noonday
  simplified_phrase: like the noonday
  preserved_meaning: The person’s just cause will become as unmistakably visible as the brightness of noon.
  reasoning_layer_used: Lexical decision for כַצָּהֳרָיִם and grounding review
  rationale: Retaining “noonday” preserves the brightness image without adding the unstated word “sun.”
