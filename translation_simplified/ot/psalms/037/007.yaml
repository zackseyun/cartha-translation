translation:
  language: en
  text: Be still before Yahweh[a] and wait patiently for him.[b] Do not burn with anger over a man who prospers along his path and carries out schemes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Be silent before Yahweh.” The Hebrew can emphasize silence as well as stillness.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also suggest waiting longingly or in anguish while remaining patient.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: do not burn with anger because of
  simplified_phrase: Do not burn with anger over
  preserved_meaning: The command forbids heated anger while retaining the Hebrew image of burning.
  reasoning_layer_used: POB lexical decision for אַל תִּתְחַר
  rationale: “Over” expresses the cause of anger more naturally in modern English.
- pob_phrase: one who prospers in his way
  simplified_phrase: a man who prospers along his path
  preserved_meaning: The man succeeds in the course of life he is following.
  reasoning_layer_used: POB lexical and theological decisions for בְּמַצְלִיחַ דַּרְכּוֹ and אִישׁ
  rationale: The wording keeps both the masculine individual and the Hebrew path image.
- pob_phrase: because of a man who carries out schemes
  simplified_phrase: and carries out schemes
  preserved_meaning: The prosperous man actively puts calculated plans into effect.
  reasoning_layer_used: POB lexical decision for עֹשֶׂה מְזִמּוֹת
  rationale: Joining the parallel descriptions removes repetition without merging their meanings.
translation_notes:
  risk_flags:
  - risk: “Path” may be read as a literal road.
    mitigation: Its connection with prospering naturally signals a person’s course of life.
  - risk: The footnote’s mention of anguish could seem to weaken the command to wait patiently.
    mitigation: It presents anguish as a possible emotional nuance within patient waiting, not as an alternative command.
