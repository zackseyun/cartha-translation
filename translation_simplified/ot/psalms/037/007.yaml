translation:
  language: en
  text: Quiet yourself in Yahweh’s presence,[a] and wait patiently for him.[b] Do not burn with anger because of a man who prospers in his way and carries out schemes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Be silent before Yahweh.” The Hebrew includes both quietness and stillness.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also suggest waiting longingly or with anguish.
    reason: lexical_alternative
