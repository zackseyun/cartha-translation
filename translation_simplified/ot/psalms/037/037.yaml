translation:
  language: en
  text: Take note of the blameless,[a] and look at the upright, because the peaceable man[c] has a future.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Blameless” means living with integrity, not being sinlessly perfect.
    reason: simplification_note
  - marker: b
    text: The Hebrew can also mean “end” or “outcome”; in this context, the outcome is favorable. Some understand it to refer to descendants.
    reason: lexical_alternative
  - marker: c
    text: Literally “man of peace”; “peace” can also include well-being and wholeness.
    reason: lexical_alternative
