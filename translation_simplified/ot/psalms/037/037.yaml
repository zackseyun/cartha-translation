translation:
  language: en
  text: Pay attention to the blameless. Look at the upright. A future[a] awaits the man of peace.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “an end” or “an outcome”; some understand it as “posterity.”
    reason: lexical_alternative
  - marker: b
    text: Or “the peaceable man”; “peace” can also include well-being and wholeness.
    reason: lexical_alternative
