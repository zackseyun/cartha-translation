  text: Let go of anger. Leave rage behind. Do not let yourself get heated[a], because that will only lead you to do evil.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “do not fret” or “do not let yourself be provoked”; the Hebrew describes becoming heated or agitated.
    reason: lexical_alternative
