translation:
  language: en
  text: Wait for Yahweh with patient trust, and follow his way. He will raise you up to inherit the land.[a] When the wicked are cut off, you will see it happen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the earth.” “Land” reflects this psalm’s repeated language about covenant inheritance; compare Matthew 5:5.
    reason: alternative_reading
