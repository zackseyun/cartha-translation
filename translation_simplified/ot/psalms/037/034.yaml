  rationale: “Follow” makes faithful obedience clearer than the less familiar expression “keep his way.”
- pob_phrase: he will exalt you
  simplified_phrase: he will raise you up
  preserved_meaning: Yahweh will vindicate and elevate the faithful person.
  reasoning_layer_used: POB lexical decision for וִירוֹמִמְךָ
  rationale: “Raise you up” preserves the source image in more common English.
- pob_phrase: you will see it
  simplified_phrase: you will see it happen
  preserved_meaning: The faithful person will witness the wicked being cut off.
  reasoning_layer_used: POB lexical decision for תִּרְאֶה
  rationale: Adding “happen” gives the supplied pronoun a clear and natural reference.
