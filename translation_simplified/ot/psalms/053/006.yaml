translation:
  language: en
  text: If only Israel’s salvation would come out of Zion! When God restores his people’s well-being,[a] let Jacob rejoice; let Israel be glad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “brings his people back from captivity” or “restores his captive people.” The Hebrew can refer broadly to recovery from distress, often including return from captivity.
