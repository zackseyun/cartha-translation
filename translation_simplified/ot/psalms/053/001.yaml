translation:
  language: en
  text: A fool says in his heart, “There is no God.” Such people are corrupt. They do what is detestable and unjust.[a] Not one of them does good.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew combines a verb meaning “to make detestable” with a noun meaning “wrong” or “injustice.”
    reason: lexical_alternative
