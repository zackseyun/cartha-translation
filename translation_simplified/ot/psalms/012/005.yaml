translation:
  language: en
  text: “Because the poor are being devastated and the needy are groaning, I will now rise,” says Yahweh. “I will bring them into the safety they long for.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The final Hebrew clause is difficult. It may mean, “I will set them in safety; they pant for it,” or possibly, “I will set them safely away from the one who snorts at them.”
    reason: alternative_reading
