translation:
  language: en
  text: “Because the poor have been devastated and the needy are groaning, now I will arise,” says Yahweh. “I will bring them into the safety they long for.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The final Hebrew clause is difficult. More literally, it may read, “I will set in safety; he pants for it.” Others understand it as safety from someone who snorts at him.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Because of the devastation of the poor, because of the groaning of the needy
  simplified_phrase: Because the poor have been devastated and the needy are groaning
  preserved_meaning: The suffering of the poor and the cries of the needy move Yahweh to act.
  reasoning_layer_used: POB lexical decisions and poetic parallelism
  rationale: Active clauses make the cause of Yahweh’s response easier to follow.
- pob_phrase: I will set him in the safety
  simplified_phrase: I will bring them into the safety
  preserved_meaning: Yahweh will move the oppressed from danger into safety.
  reasoning_layer_used: POB lexical decision for בְּיֵשַׁע
  rationale: “Bring them into safety” expresses the concrete deliverance in natural English.
- pob_phrase: for which he longs
  simplified_phrase: they long for
  preserved_meaning: The promised safety is what the suffering people desire.
  reasoning_layer_used: POB lexical decision for יָפִיחַ לוֹ
  rationale: A plural pronoun naturally refers back to the two oppressed groups.
