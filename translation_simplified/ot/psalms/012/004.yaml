simplification_decisions:
- pob_phrase: With our tongue we will prevail
  simplified_phrase: We will gain the upper hand with our tongues
  preserved_meaning: Their speech is the means by which they expect to overpower others.
  reasoning_layer_used: Lexical decision for לִלְשֹׁנֵנוּ and נַגְבִּיר
  rationale: This keeps the tongue image while explaining “prevail” in common English.
- pob_phrase: our lips are our own
  simplified_phrase: Our lips belong to us
  preserved_meaning: They boast that they alone control what they say.
  reasoning_layer_used: Lexical decision and audited idiom revision for אִתָּנוּ
  rationale: “Belong to us” makes the claim of ownership clear while the note preserves the Hebrew ambiguity.
- pob_phrase: who is lord over us?
  simplified_phrase: who rules over us?
  preserved_meaning: They defiantly deny that anyone has authority over them.
  reasoning_layer_used: Lexical and theological decisions for מִי אָדוֹן לָנוּ
  rationale: The verb “rules” states the generic authority meant by lowercase “lord” without implying the divine name.
