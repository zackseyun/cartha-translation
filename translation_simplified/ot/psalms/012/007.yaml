simplification_decisions:
- pob_phrase: will keep them
  simplified_phrase: will watch over them
  preserved_meaning: Yahweh will continually care for and guard them.
  reasoning_layer_used: Lexical decision for שׁמר permits “watch over.”
  rationale: “Watch over” makes the protective sense of “keep” immediately clear.
- pob_phrase: you will guard him
  simplified_phrase: You will protect him
  preserved_meaning: Yahweh will shield the singular person from danger.
  reasoning_layer_used: Lexical and theological decisions retain the masculine singular suffix.
  rationale: “Protect” is common English while preserving the deliberate shift to “him.”
- pob_phrase: keep them; you will guard him
  simplified_phrase: watch over them. You will protect him
  preserved_meaning: The two parallel assurances remain distinct.
  reasoning_layer_used: POB optimal-equivalence philosophy permits breaking a dense poetic line into sentences.
  rationale: Two short sentences make the pronoun shift easier to notice and understand.
