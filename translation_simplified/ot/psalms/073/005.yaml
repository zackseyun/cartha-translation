simplification_decisions:
- pob_phrase: in the trouble of mortal man
  simplified_phrase: share the troubles of frail mortals
  preserved_meaning: The wicked appear exempt from the hardships experienced by weak, mortal human beings.
  reasoning_layer_used: The lexical decisions for עָמָל and אֱנוֹשׁ preserve both burdensome trouble and human frailty.
  rationale: This uses natural English while retaining hardship and mortality.
- pob_phrase: are not plagued with mankind
  simplified_phrase: are not afflicted along with humanity
  preserved_meaning: They do not undergo affliction together with humanity.
  reasoning_layer_used: The lexical decisions for יְנֻגָּעוּ, וְעִם, and אָדָם support affliction, association, and humanity collectively.
  rationale: This avoids the disease sense of “plagued” while preserving shared affliction.
