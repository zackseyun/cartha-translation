translation:
  language: en
  text: Who do I have in heaven except you? On earth, I desire nothing besides you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated, “With you, I desire nothing on earth.” Its poetic wording is compressed, but the main sense is that the psalmist desires nothing apart from God.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Whom have I in heaven but you?
  simplified_phrase: Who do I have in heaven except you?
  preserved_meaning: The rhetorical question presents God as the psalmist’s only one in heaven.
  reasoning_layer_used: POB lexical decisions for מִי, לִי, and בַשָּׁמַיִם
  rationale: Modern question structure is easier to understand while retaining the exclusive claim.
- pob_phrase: And besides you, I desire nothing on earth.
  simplified_phrase: On earth, I desire nothing besides you.
  preserved_meaning: The psalmist values God above everything in the earthly realm.
  reasoning_layer_used: POB lexical and theological decisions for וְעִמְּךָ and the second colon
  rationale: Moving “on earth” forward makes the heaven-earth contrast immediately clear.
translation_notes:
  risk_flags:
  - risk: “Nothing besides you” may sound like a denial of every ordinary earthly desire.
    mitigation: The footnote identifies the line as poetic language expressing exclusive desire for God.
