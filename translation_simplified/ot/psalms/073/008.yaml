  text: They mock and speak with malice. They arrogantly threaten to oppress others.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The opening Hebrew verb is difficult and may also mean “sneer” or possibly “are corrupt.” The phrase rendered “arrogantly” literally means “from on high” and may refer to position rather than manner.
