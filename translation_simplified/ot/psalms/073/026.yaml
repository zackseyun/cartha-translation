translation:
  language: en
  text: My flesh and my heart may both fail,[a] but God is the rock—my heart’s strength—and my portion forever.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “My flesh and my heart fail”; the Hebrew can describe present or general failure.
    reason: lexical_alternative
  - marker: b
    text: “Portion” means one’s allotted share or inheritance.
    reason: simplification_note
