- pob_phrase: my portion forever
  rendering: God himself is the lasting share allotted to the psalmist.
  claim: “Portion” portrays God as the psalmist’s enduring allotted share.
  evidence:
  - The POB lexical rationale defines the metaphor as God being one’s allotted share or inheritance.
  confidence: high
  alternatives_preserved:
  - my share
  - my inheritance
