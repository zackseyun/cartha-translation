translation:
  language: en
  text: My body and my heart may fail.[a] But God is the rock of my heart,[b] and he is my portion forever.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be translated, “My body and my heart fail.”
    reason: lexical_alternative
  - marker: b
    text: The rock image presents God as the heart’s stable and reliable support.
    reason: simplification_note
  - marker: c
    text: “My portion” means that God himself is the lasting share allotted to the psalmist.
    reason: simplification_note
simplification_decisions:
- pob_phrase: My flesh and my heart may fail
  simplified_phrase: My body and my heart may fail
  preserved_meaning: The psalmist’s physical being and inner life are both subject to weakness.
  reasoning_layer_used: POB lexical and theological decisions on שְׁאֵרִי and לְבָבִי
  rationale: “Body” states the contextual sense of “flesh” in familiar English.
- pob_phrase: but God is the rock of my heart and my portion forever
  simplified_phrase: But God is the rock of my heart, and he is my portion forever
  preserved_meaning: God remains the psalmist’s stable foundation and allotted good without end.
  reasoning_layer_used: POB lexical and theological decisions on צוּר, חֶלְקִי, and לְעוֹלָם
  rationale: A repeated subject and a new sentence make the contrast easier to follow while retaining both metaphors.
