translation:
  language: en
  text: They are like a dream that vanishes when someone wakes. Lord, when you rise to act, you will despise their dreamlike image.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, less likely, “in the city you will despise their image.” The Hebrew consonants allow this reading, but the context strongly favors “when you rise.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Like a dream when one awakes
  simplified_phrase: They are like a dream that vanishes when someone wakes
  preserved_meaning: The wicked and their prosperity are as fleeting as a dream after waking.
  reasoning_layer_used: Lexical rationale and immediate poetic context
  rationale: The rewrite completes the comparison and states the dream’s disappearance in natural English.
- pob_phrase: when you rouse yourself
  simplified_phrase: when you rise to act
  preserved_meaning: The Lord rouses himself to intervene rather than literally waking from sleep.
  reasoning_layer_used: Theological decision on בָּעִיר
  rationale: This keeps the chosen verbal reading and avoids suggesting that the Lord was asleep.
- pob_phrase: their image
  simplified_phrase: their dreamlike image
  preserved_meaning: Their outward form is insubstantial and fleeting like the dream in the simile.
  reasoning_layer_used: Lexical decision on צַלְמָם
  rationale: Adding “dreamlike” connects the difficult image language to the verse’s controlling comparison.
