translation:
  language: en
  text: Leaders from many peoples have gathered as the people who belong to the God of Abraham.[b] For the earth’s shields—its rulers and protectors—belong to God.[a] He is greatly exalted.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally “the shields of the earth,” a picture of the earth’s rulers or protectors.
    reason: lexical_alternative
  - marker: b
    text: Or “have gathered with the people who belong to the God of Abraham.” The Hebrew may indicate either close association or identification.
    reason: alternative_reading
