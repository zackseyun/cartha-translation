simplification_decisions:
- pob_phrase: with a shout
  simplified_phrase: amid shouts
  preserved_meaning: God goes up surrounded by loud public acclamation.
  reasoning_layer_used: Lexical decision for בִּתְרוּעָה
  rationale: The plural wording sounds natural while keeping the cry broad rather than specifying joy or battle.
- pob_phrase: Yahweh, with the sound of a trumpet
  simplified_phrase: Yahweh has gone up with the sound of a horn trumpet
  preserved_meaning: The second line repeats God’s going up and presents the trumpet sound as accompaniment.
  reasoning_layer_used: Hebrew poetic parallelism and lexical decisions for בְּקוֹל and שׁוֹפָר
  rationale: The repeated verb clarifies the parallel while “with the sound” retains the Hebrew relationship.
- pob_phrase: trumpet
  simplified_phrase: horn trumpet
  preserved_meaning: The instrument is specifically a shofar rather than a modern metal trumpet.
  reasoning_layer_used: Lexical decision and POB cultural note for שׁוֹפָר
  rationale: The concrete wording identifies the ancient instrument while the note preserves its Hebrew name.
