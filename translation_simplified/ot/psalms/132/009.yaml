translation:
  language: en
  text: May your priests wear righteousness like clothing,[a] and may your faithful people[b] shout for joy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “justice.” The Hebrew word can refer both to living rightly and to acting justly.
    reason: lexical_alternative
  - marker: b
    text: This means people devoted and loyal to God; it may also be translated “your loyal ones” or “your godly ones.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: be clothed with righteousness
  simplified_phrase: wear righteousness like clothing
  preserved_meaning: The priests are pictured as having righteousness cover and characterize them like clothing.
  reasoning_layer_used: POB lexical decision for יִלְבְּשׁוּ and צֶדֶק
  rationale: The wording makes the clothing image immediately clear while retaining righteousness as the controlling choice.
- pob_phrase: your faithful ones
  simplified_phrase: your faithful people
  preserved_meaning: The phrase identifies people marked by devotion and covenant loyalty to God.
  reasoning_layer_used: POB lexical decision for וַחֲסִידֶיךָ
  rationale: “People” is more natural than the abstract “ones” without importing the later overtones of “saints.”
- pob_phrase: May ... and may ...
  simplified_phrase: May ... and may ...
  preserved_meaning: Both clauses remain a prayer or wish rather than a prediction.
  reasoning_layer_used: POB theological decision on the volitive imperfects
  rationale: Retaining “May” protects the petitionary force of the verse.
