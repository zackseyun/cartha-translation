translation:
  language: en
  text: If your sons remain faithful to my covenant and follow the testimonies that I will teach them,[a] then their sons too will sit on your throne forever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Testimonies” may also be translated “decrees” or “statutes.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: keep my covenant
  simplified_phrase: remain faithful to my covenant
  preserved_meaning: David’s sons must faithfully observe God’s covenant.
  reasoning_layer_used: Lexical decision for יִשְׁמְרוּ and theological decision on conditionality
  rationale: This expresses covenant faithfulness plainly without weakening the real condition.
- pob_phrase: my testimonies that I will teach them
  simplified_phrase: follow the testimonies that I will teach them
  preserved_meaning: The sons must obey the divine testimonies God will teach them.
  reasoning_layer_used: Lexical decisions for וְעֵדֹתַי, זוֹ, and אֲלַמְּדֵם
  rationale: “Follow” makes observance clear while retaining the future force of God’s teaching.
- pob_phrase: their sons also will sit
  simplified_phrase: their sons too will sit
  preserved_meaning: The promise extends to the next generation of male dynastic heirs.
  reasoning_layer_used: Lexical decisions for גַּם, בְּנֵיהֶם, and יֵשְׁבוּ
  rationale: “Too” conveys the added generation while preserving the throne image.
translation_notes:
  risk_flags:
  - risk: “Remain faithful” is less verbally close to the covenantal verb “keep.”
    mitigation: It preserves the audited sense of faithful covenant observance.
