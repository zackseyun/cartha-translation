translation:
  language: en
  text: There I will make a horn—a sign of royal power—grow for David. I have prepared a lamp for my anointed king.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “my Messiah.” The Hebrew says “my anointed one,” referring first to the Davidic king but possibly carrying broader messianic meaning.
    reason: alternative_reading
  - marker: b
    text: The lamp is a biblical image that here points to the continuing rule of David’s royal line.
    reason: simplification_note
simplification_decisions:
- pob_phrase: I will cause a horn to sprout
  simplified_phrase: I will make a horn ... grow
  preserved_meaning: God causes royal strength to arise, while the growth image remains.
  reasoning_layer_used: Lexical decision for אַצְמִיחַ
  rationale: “Make ... grow” expresses the causative action in ordinary English.
- pob_phrase: a horn
  simplified_phrase: a horn—a sign of royal power
  preserved_meaning: The concrete horn image remains and its royal significance is explained.
  reasoning_layer_used: Lexical decision for קֶרֶן
  rationale: The appositional explanation makes the metaphor clear without replacing it.
- pob_phrase: my anointed one
  simplified_phrase: my anointed king
  preserved_meaning: The person is the LORD’s anointed Davidic ruler.
  reasoning_layer_used: Theological decision for מְשִׁיחִי
  rationale: “King” identifies the immediate referent while the footnote preserves broader messianic resonance.
interpretive_expansions:
- pob_phrase: horn
  rendering: horn—a sign of royal power
  claim: The horn symbolizes royal strength or power.
  evidence:
  - The POB lexical rationale identifies the horn as a metaphor for strength and royal power.
  confidence: high
  alternatives_preserved:
  - strength
  - might
  - power
- pob_phrase: lamp
  rendering: The lamp ... points to the continuing rule of David’s royal line.
  claim: The prepared lamp likely signifies the continuation of Davidic rule.
  evidence:
  - The POB lexical rationale identifies dynastic continuity or enduring rule as the lamp’s metaphorical sense.
  - Psalm 132 promises David an enduring line of descendants and rule.
  confidence: moderate
  alternatives_preserved:
  - dynastic continuity
  - enduring rule
translation_notes:
  risk_flags:
