simplification_decisions:
- pob_phrase: I will clothe her priests with salvation
  simplified_phrase: I will wrap her priests in salvation
  preserved_meaning: God gives Zion’s priests salvation as though it were clothing.
  reasoning_layer_used: Lexical decisions for אַלְבִּישׁ and יֶשַׁע
  rationale: “Wrap in” keeps the clothing image in more natural modern English.
- pob_phrase: her faithful ones
