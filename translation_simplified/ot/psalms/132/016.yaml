  preserved_meaning: These are people marked by covenant loyalty and devotion.
  reasoning_layer_used: Lexical and theological decisions for חֲסִידֶיהָ
  rationale: “Faithful people” is clearer while avoiding the later associations of “saints.”
- pob_phrase: and her faithful ones will shout for joy
  simplified_phrase: Her faithful people will shout with great joy
  preserved_meaning: Their response is loud, intense rejoicing.
  reasoning_layer_used: Lexical decision for רַנֵּן יְרַנֵּנוּ
  rationale: A new sentence makes the two promises easier to follow.
