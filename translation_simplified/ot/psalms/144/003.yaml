translation:
  language: en
  text: Yahweh, what is a mere man, that you take notice of him? What is the son of man, that you give him any thought?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “man” and “the son of man” refer to a human being in general and emphasize human frailty; “the son of man” is not a messianic title.
    reason: lexical_alternative
