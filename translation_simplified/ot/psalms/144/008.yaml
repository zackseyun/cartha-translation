  footnotes:
  - marker: a
    text: Or “speak lies.” The Hebrew word can mean emptiness, worthlessness, or deceit.
    reason: lexical_alternative
  - marker: b
    text: Hebrew repeats “right hand” for emphasis. The image may point to deceit in oaths, the use of power, or pledged loyalty.
