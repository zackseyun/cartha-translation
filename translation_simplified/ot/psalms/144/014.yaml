translation:
  language: en
  text: Our cattle are heavy with young.[a] Our defenses are not breached, no one is forced to leave,[b] and no cries of distress are heard in our streets.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Our oxen are heavily loaded.” The line may describe either fertile livestock or burden-bearing animals.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew literally says “no going out”; it may refer to exile, someone leaving, or another forced departure.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: there is no breach
  simplified_phrase: Our defenses are not breached
  preserved_meaning: The community remains secure from a disruptive breakthrough.
  reasoning_layer_used: lexical decision and civic-security context
  rationale: This turns an opaque noun into a clear statement while preserving the breach image.
- pob_phrase: and no going out
  simplified_phrase: no one is forced to leave
  preserved_meaning: No calamitous departure from the city occurs.
  reasoning_layer_used: lexical rationale and preserved alternative reading
  rationale: This gives the terse phrase natural English while the footnote retains its ambiguity.
- pob_phrase: and no cry in our streets
  simplified_phrase: and no cries of distress are heard in our streets
  preserved_meaning: The public places contain no outcry caused by suffering or disaster.
  reasoning_layer_used: lexical decision for צְוָחָה
  rationale: Adding “of distress” makes the kind of cry clear from the documented lexical nuance.
interpretive_expansions:
- pob_phrase: there is no breach
  rendering: Our defenses are not breached
  claim: The breach concerns the community’s civic defenses or security.
  evidence:
  - The lexical rationale places the phrase in a civic-security sequence.
  - The neighboring lines describe departure and public cries.
  confidence: moderate
  alternatives_preserved:
  - a disruptive breaking through
  - a collapse
- pob_phrase: and no going out
  rendering: no one is forced to leave
  claim: The departure is calamitous rather than ordinary movement.
  evidence:
  - The POB rationale says the phrase most naturally refers to forced departure from the city.
  - The surrounding breach and distress language indicates civic disaster.
  confidence: moderate
  alternatives_preserved:
  - exile
  - someone going out
  - another forced departure
