translation:
  language: en
  text: For Yahweh is righteous. He loves actions that are right. Those who do what is right will see his face.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, less likely, “his face beholds those who do what is right.” The Hebrew final clause can be understood in more than one way.
    reason: alternative_reading
  - marker: b
    text: Seeing Yahweh’s face can also suggest being in his presence and receiving his favor.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: he loves righteous deeds
  simplified_phrase: He loves actions that are right
  preserved_meaning: Yahweh loves concrete acts of righteousness.
  reasoning_layer_used: Lexical decision for צְדָקוֹת
  rationale: This expresses concrete righteous deeds in familiar English.
- pob_phrase: the upright
  simplified_phrase: Those who do what is right
  preserved_meaning: The phrase refers collectively to morally upright people.
  reasoning_layer_used: Lexical decision for יָשָׁר and the plural verb
  rationale: This replaces an abstract group label with a clear description.
- pob_phrase: will behold his face
  simplified_phrase: will see his face
  preserved_meaning: Upright people will see Yahweh’s face, with possible associations of presence and favor.
  reasoning_layer_used: Lexical and theological decisions for יֶחֱזוּ פָנֵימוֹ
  rationale: “See” is more familiar than “behold,” while preserving the face image.
translation_notes:
  risk_flags:
  - risk: Readers may understand “see his face” only physically.
    mitigation: Footnote b notes its possible association with Yahweh’s presence and favor.
  - risk: The final Hebrew clause permits a less likely alternate syntax.
    mitigation: Footnote a states that reading without adding a protective sense.
