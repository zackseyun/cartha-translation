translation:
  language: en
  text: Yahweh is in his holy temple. Yahweh’s throne is in heaven. His eyes see the whole human family[a]; his eyelids examine them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “the children of man”; that is, all human beings.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Yahweh—his throne is in heaven
  simplified_phrase: Yahweh’s throne is in heaven
  preserved_meaning: Yahweh rules from his heavenly throne.
  reasoning_layer_used: lexical decision and theological decision on divine dwelling imagery
  rationale: The ordinary possessive removes awkward syntax without merging the temple and heaven images.
- pob_phrase: the children of man
  simplified_phrase: the whole human family
  preserved_meaning: The phrase refers collectively to human beings.
  reasoning_layer_used: lexical and theological decisions on אָדָם
  rationale: “Human family” makes the collective meaning clear while retaining the source’s familial image.
- pob_phrase: his eyelids examine the children of man
  simplified_phrase: his eyelids examine them
  preserved_meaning: Yahweh closely examines the same people his eyes see.
  reasoning_layer_used: lexical decision on עַפְעַפָּיו יִבְחֲנוּ
  rationale: The pronoun avoids repetition while preserving the poetic eyelid image and the force of examination.
translation_notes:
  risk_flags:
  - risk: Readers may assume the holy temple and heaven are the same place.
    mitigation: Separate statements preserve the POB’s unresolved poetic tension.
  - risk: The eyelid image may sound unusual in English.
    mitigation: It is retained because the Hebrew deliberately parallels Yahweh’s eyes and eyelids.
