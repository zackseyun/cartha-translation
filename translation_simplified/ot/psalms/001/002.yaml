translation:
  language: en
  text: Instead, he finds joy in Yahweh’s law.[a] He thinks deeply[b] about that law day and night.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Law” can also mean Yahweh’s instruction.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew can include quietly repeating the words while thinking about them.
    reason: source_note
