translation:
  language: en
  text: That is why wicked people will not be able to stand under judgment.[a] Sinners will not be able to stand in the gathered community of righteous people.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew refers broadly to judicial reckoning and does not specify whether this is a present or final judgment.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Therefore the wicked will not stand in judgment
  simplified_phrase: That is why wicked people will not be able to stand under judgment
  preserved_meaning: The wicked cannot endure judicial reckoning, while the Hebrew image of standing remains.
  reasoning_layer_used: Lexical decisions for עַל כֵּן, יָקֻמוּ, רְשָׁעִים, and בַּמִּשְׁפָּט
  rationale: The clause uses ordinary English while leaving the scope of judgment open.
- pob_phrase: nor sinners in the assembly of the righteous
  simplified_phrase: Sinners will not be able to stand in the gathered community of righteous people
  preserved_meaning: The shared standing image continues in the assembled community of the righteous.
  reasoning_layer_used: Hebrew parallelism and lexical decisions for חַטָּאִים, בַּעֲדַת, and צַדִּיקִים
  rationale: The implicit verb is supplied without implying prior membership or removal.
interpretive_expansions:
- pob_phrase: will not stand in judgment
  rendering: will not be able to stand under judgment
  claim: Standing means being unable to endure judicial reckoning.
  evidence:
  - The POB lexical rationale identifies the sense of standing or remaining when examined.
  - The phrase “in judgment” supplies the judicial setting.
  confidence: high
  alternatives_preserved:
  - present judicial scrutiny
  - final judgment
  - both present and ultimate reckoning
- pob_phrase: nor sinners in the assembly of the righteous
  rendering: Sinners will not be able to stand in the gathered community of righteous people
  claim: The first clause’s verb also governs the second clause.
  evidence:
  - Hebrew parallelism carries “will not stand” into the second clause.
  - The POB rationale defines the assembly as an assembled community.
  confidence: high
  alternatives_preserved:
  - will not stand in the assembly
  - will have no standing in the assembly
translation_notes:
  risk_flags:
  - risk: “Under judgment” may still be heard as referring only to final judgment.
    mitigation: The footnote preserves the Hebrew’s broader judicial scope.
  - risk: “Gathered community” explains rather than formally reproduces “assembly.”
    mitigation: It retains both the corporate setting and the idea of people assembled together.
