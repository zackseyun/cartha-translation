translation:
  language: en
  text: That is why wicked people will not be able to stand when they are judged,[a] and sinners will not be among the gathering of righteous people.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may refer to judgment in this life, the final judgment, or both.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Therefore
  simplified_phrase: That is why
  preserved_meaning: The verse draws a conclusion from the preceding description of the wicked.
  reasoning_layer_used: POB lexical decision for עַל כֵּן
  rationale: The simpler phrase keeps the same cause-and-result connection.
- pob_phrase: will not stand in the judgment
  simplified_phrase: will not be able to stand when they are judged
  preserved_meaning: The wicked cannot endure judicial examination or remain secure through it.
  reasoning_layer_used: POB lexical decisions for יָקֻמוּ and בַּמִּשְׁפָּט
  rationale: This preserves the standing image while clarifying its judicial force.
- pob_phrase: nor sinners in the assembly of the righteous
  simplified_phrase: and sinners will not be among the gathering of righteous people
  preserved_meaning: Sinners are excluded from the assembled community of those characterized as righteous.
  reasoning_layer_used: POB lexical decisions for חַטָּאִים, בַּעֲדַת, and צַדִּיקִים
  rationale: Common wording expresses exclusion without importing the first clause’s standing image.
interpretive_expansions:
