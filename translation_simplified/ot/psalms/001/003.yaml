translation:
  language: en
  text: He will be like a tree planted beside streams of water. It bears fruit in season, and its leaves do not wither. In everything he does, he prospers.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Everything he does prospers.” The Hebrew allows either understanding.
    reason: alternative_reading
