- pob_phrase: by streams of water
  simplified_phrase: beside streams of water
  preserved_meaning: The tree stands near an abundant water supply.
  reasoning_layer_used: Lexical decision for עַל פַלְגֵי מָיִם
  rationale: “Beside” makes the spatial image immediately clear.
- pob_phrase: which yields its fruit in its season
  simplified_phrase: It bears fruit in season
  preserved_meaning: The tree produces fruit at its appropriate time.
  reasoning_layer_used: Lexical decisions for פִּרְיוֹ יִתֵּן and בְּעִתּוֹ
  rationale: A new sentence and the familiar verb “bears” reduce clause complexity.
- pob_phrase: and its leaf does not wither
  simplified_phrase: and its leaves do not wither
  preserved_meaning: The tree's foliage remains healthy rather than drying up.
  reasoning_layer_used: Lexical decisions for וְעָלֵהוּ and לֹא יִבּוֹל
  rationale: English normally uses plural “leaves” for the Hebrew collective singular.
