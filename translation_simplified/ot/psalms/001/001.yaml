translation:
  language: en
  text: Blessed[a] is the man[b] who does not walk through life guided by the counsel of the wicked. He does not stand with sinners in their way of life or take his seat among scoffers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Happy.” Here “blessed” describes a favored state, not merely a feeling.
    reason: lexical_alternative
  - marker: b
    text: Here “the man” represents any righteous person, not only males.
    reason: cultural_note
