translation:
  language: en
  text: Blessed is the man[a] who does not walk as the wicked advise, stand on the path sinners take, or sit among those who mock.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “the man” represents any person who lives this way, not only males.
    reason: cultural_note
simplification_decisions:
- pob_phrase: walk in the counsel of the wicked
  simplified_phrase: walk as the wicked advise
  preserved_meaning: The man rejects both the advice and influence of wicked people while the walking image remains.
  reasoning_layer_used: POB lexical decision for הָלַךְ and בַּעֲצַת
  rationale: This replaces an opaque idiom with natural English without losing the conduct metaphor.
- pob_phrase: stand in the way of sinners
  simplified_phrase: stand on the path sinners take
  preserved_meaning: He does not settle into the course of life followed by sinners.
  reasoning_layer_used: POB lexical decisions for דֶרֶךְ and עָמָד
  rationale: “Path sinners take” makes the wisdom image immediately understandable.
- pob_phrase: sit in the seat of scoffers
  simplified_phrase: sit among those who mock
  preserved_meaning: He does not join or settle among people who deride what is right.
  reasoning_layer_used: POB lexical decisions for מוֹשַׁב, לֵצִים, and יָשָׁב
  rationale: The wording keeps the sitting image while clarifying the social setting and replacing “scoffers.”
