translation:
  language: en
  text: In the city of Yahweh of hosts[a]—the city of our God—we saw for ourselves exactly what we had heard about. God will make her[b] secure forever. Selah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hosts” means armies and can include the armies of heaven.
    reason: simplification_note
  - marker: b
    text: Or “it.” The Hebrew uses a feminine form for the city, poetically speaking of the city as “her.”
    reason: lexical_alternative
  - marker: c
    text: A Hebrew term whose precise meaning is uncertain.
    reason: source_note
