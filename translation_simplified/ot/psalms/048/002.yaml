translation:
  language: en
  text: Mount Zion, the city of the great King, stands high and beautiful in the far north[a]. It is the joy of all the earth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “on the northern slopes”; literally, “in the remote parts or sides of the north.” The phrase may also echo ancient imagery of Zaphon as a divine mountain.
