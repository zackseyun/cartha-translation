translation:
  language: en
  text: Let them sing for joy before Yahweh, because he comes[a] to judge the earth. He will judge the world rightly, and its peoples with fairness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “is coming”; the Hebrew poetry presents his coming as imminent or certain.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: before Yahweh
  simplified_phrase: Let them sing for joy before Yahweh
  preserved_meaning: The mountains in the preceding line are called to rejoice in Yahweh’s presence.
  reasoning_layer_used: immediate context of Psalm 98:8–9
  rationale: Supplying the preceding action turns the fragment into an understandable sentence.
- pob_phrase: with righteousness
  simplified_phrase: rightly
  preserved_meaning: Yahweh’s judgment is righteous in its manner and character.
  reasoning_layer_used: lexical decision for בְּצֶדֶק
  rationale: “Rightly” clearly expresses how Yahweh judges without reducing righteousness to an external standard.
- pob_phrase: with equity
  simplified_phrase: with fairness
  preserved_meaning: Yahweh judges the distinct peoples equitably and uprightly.
  reasoning_layer_used: lexical decision for בְּמֵישָׁרִים
  rationale: “Fairness” is the clearest listed alternative for common readers.
