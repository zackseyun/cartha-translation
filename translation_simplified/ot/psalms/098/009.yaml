simplification_decisions:
- pob_phrase: for he comes to judge the earth;
  simplified_phrase: because he comes to judge the earth.
  preserved_meaning: Yahweh’s coming is the reason for the preceding rejoicing, and his purpose is judgment.
  reasoning_layer_used: POB lexical decisions for כִּי, בָא, and לִשְׁפֹּט
  rationale: “Because” makes the causal link immediate, while “comes” retains the poem’s vivid force.
- pob_phrase: he will judge the world with righteousness and the peoples with equity
  simplified_phrase: He will judge the world with righteousness and its peoples with fairness.
  preserved_meaning: Yahweh will judge the whole inhabited world and its distinct peoples in a righteous and impartial way.
  reasoning_layer_used: POB lexical and theological decisions for תֵּבֵל, צֶדֶק, עַמִּים, and מֵישָׁרִים
  rationale: A new sentence eases the syntax, and “fairness” clearly expresses judicial equity without weakening it.
translation_notes:
  risk_flags:
  - risk: “Its peoples” could sound less distributive than the POB phrase “the peoples.”
    mitigation: The plural “peoples” is retained to preserve the sense of distinct human groups.
