translation:
  language: en
  text: 'A psalm.


    Sing a new song to Yahweh, because he has done wonders. His own right hand and holy arm have won salvation for him.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The final words may also be translated “have saved him.” The image means that Yahweh achieved deliverance or victory by his own power.
    reason: lexical_alternative
