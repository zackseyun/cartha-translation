translation:
  language: en
  text: 'A psalm.


    Sing a new song to Yahweh! He has done amazing things. He won the victory by his own power—by his right hand and his holy arm.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “his right hand and his holy arm have saved for him”; the image means that Yahweh’s own power secured victory.
