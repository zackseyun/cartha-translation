simplification_decisions:
- pob_phrase: those who pass by
  simplified_phrase: people passing by
  preserved_meaning: This still describes the general class of people who go past.
  reasoning_layer_used: POB lexical decision for הָעֹבְרִים
  rationale: The shorter phrase is more direct in common English.
- pob_phrase: The blessing of Yahweh be upon you
  simplified_phrase: May Yahweh’s blessing be with you
  preserved_meaning: This remains a spoken wish that Yahweh’s blessing rest on the hearers.
  reasoning_layer_used: POB lexical decisions for בִּרְכַּת יְהוָה and אֲלֵיכֶם
  rationale: The wording makes the implied wish explicit without changing the blessing formula.
- pob_phrase: in the name of Yahweh
  simplified_phrase: in Yahweh’s name
  preserved_meaning: The blessing is still spoken by invoking Yahweh and his authority.
  reasoning_layer_used: POB lexical and theological decisions for בְּשֵׁם יְהוָה
  rationale: The possessive form is natural English while retaining the biblical concept of acting in Yahweh’s name.
