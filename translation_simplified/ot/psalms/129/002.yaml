  preserved_meaning: They subjected the speaker to severe, sustained suffering.
  reasoning_layer_used: POB lexical decision for צְרָרוּנִי
  rationale: The active wording is easier to understand while retaining the force of hostile affliction.
- pob_phrase: from my youth
