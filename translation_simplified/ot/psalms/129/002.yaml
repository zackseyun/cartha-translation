translation:
  language: en
  text: They have made me suffer greatly since my youth,[a] yet they have not overcome me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “They have made me suffer many times since my youth.” The Hebrew may emphasize either how severe or how frequent the suffering was.
