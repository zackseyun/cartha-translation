translation:
  language: en
  text: Righteous people will rejoice in Yahweh and turn to him for shelter. Everyone whose heart is upright will joyfully celebrate Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated “will boast” or “will exult.” In this context it means rejoicing in Yahweh and his saving action, not praising oneself.
    reason: lexical_alternative
