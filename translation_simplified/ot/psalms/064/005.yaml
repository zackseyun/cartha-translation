  text: They reinforce their own evil plan.[b] They discuss how to hide snares. They say, “Who will see them?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Who will see us?” The Hebrew form literally says “them,” but the speakers may be referring to themselves.
    reason: alternative_reading
  - marker: b
