simplification_decisions:
- pob_phrase: I will exalt you
  simplified_phrase: I will lift you high in praise
  preserved_meaning: The concrete image of lifting God high expresses honoring him as supreme.
  reasoning_layer_used: POB lexical decision for אֲרוֹמִמְךָ
  rationale: The wording explains “exalt” while preserving its upward image and worship setting.
- pob_phrase: my God the King
  simplified_phrase: My God, the King
  preserved_meaning: God is directly addressed and identified as the King without adding “and” or “my.”
  reasoning_layer_used: POB theological decision on apposition
  rationale: The punctuation makes the Hebrew apposition easier to recognize in English.
- pob_phrase: and I will bless your name
  simplified_phrase: I will praise your name
  preserved_meaning: The speaker vows to honor God's revealed identity and renown in worship.
  reasoning_layer_used: POB lexical decisions for וַאֲבָרֲכָה and שִׁמְךָ
  rationale: “Praise” gives the intended worship sense of “bless” while retaining the important biblical term “name.”
