translation:
  language: en
  text: 'A Praise of David.[a]


    My God, the King, I will lift you high in praise. I will praise your name forever and ever.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The heading may mean “by David” or may more broadly associate this psalm with David.
