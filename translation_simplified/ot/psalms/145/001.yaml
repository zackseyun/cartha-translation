  language: en
  text: 'A song of praise of David.[a]


    I will lift you high in praise, my God, the King. I will bless your name forever and ever.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Of David” may mean written by David or associated with him.
