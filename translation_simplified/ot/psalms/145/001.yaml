simplification_decisions:
- pob_phrase: A praise of David
  simplified_phrase: A song of praise of David
  preserved_meaning: The heading remains a singular work of praise connected with David.
  reasoning_layer_used: Lexical decision for תְּהִלָּה and לְדָוִד
  rationale: Adding “song” makes the heading immediately understandable without resolving David’s exact relationship to it.
- pob_phrase: I will exalt you
  simplified_phrase: I will lift you high in praise
  preserved_meaning: The worshiper declares that he will exalt God.
  reasoning_layer_used: Lexical rationale for אֲרוֹמִמְךָ
  rationale: The wording restores the verb’s lifting image and explains its worship setting.
- pob_phrase: and I will bless your name forever and ever
  simplified_phrase: I will bless your name forever and ever
  preserved_meaning: The worshiper resolves to honor God’s revealed identity without end.
  reasoning_layer_used: Lexical decisions for וַאֲבָרֲכָה, שִׁמְךָ, and לְעוֹלָם וָעֶד
  rationale: A new sentence improves readability while retaining the key biblical terms and emphatic duration.
