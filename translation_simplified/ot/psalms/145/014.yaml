simplification_decisions:
- pob_phrase: supports all who are falling
  simplified_phrase: holds up everyone who is falling
  preserved_meaning: Yahweh continually supports people who are in the process or condition of falling.
  reasoning_layer_used: The lexical rationale for סוֹמֵךְ and הַנֹּפְלִים preserves ongoing support and falling.
  rationale: “Holds up” makes the sustaining action concrete while retaining the ongoing image.
- pob_phrase: and raises up all who are bowed down
  simplified_phrase: He lifts up everyone who is bowed down
  preserved_meaning: Yahweh restores those bent low without specifying whether their condition is physical or figurative.
  reasoning_layer_used: The lexical rationale for זוֹקֵף and הַכְּפוּפִים preserves restoration and the bowed-down image.
  rationale: A new sentence and explicit pronoun make the parallel thought easier to follow.
translation_notes:
  risk_flags:
  - risk: “Holds up” may suggest preventing a complete fall more strongly than the broader “supports.”
    mitigation: The footnote preserves the general alternative “everyone who falls.”
