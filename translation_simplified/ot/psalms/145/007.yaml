simplification_decisions:
- pob_phrase: pour forth the remembrance of your abundant goodness
  simplified_phrase: pour out praise, recalling your abundant goodness
  preserved_meaning: Their praise flows freely as they call God’s great goodness to mind and proclaim it.
  reasoning_layer_used: Hebrew lexical decisions and immediate praise context
  rationale: “Pour out” keeps the flowing image, while “recalling” preserves commemorative remembrance.
- pob_phrase: and they will sing for joy of your righteousness
  simplified_phrase: They will sing for joy about your righteousness
  preserved_meaning: They joyfully sing about God’s morally right character and acts.
  reasoning_layer_used: Hebrew lexical and theological decisions
  rationale: A new sentence and “about” make the line natural without weakening “righteousness.”
interpretive_expansions:
- pob_phrase: the remembrance
  rendering: praise, recalling
  claim: Their remembrance of God’s goodness is expressed as public praise.
  evidence:
  - The verb pictures words pouring or bubbling out.
  - The parallel line describes joyful singing.
  - The surrounding psalm is public praise.
  confidence: high
  alternatives_preserved:
  - commemorative mention rather than private memory
translation_notes:
  risk_flags:
  - risk: “Recalling” could be heard as only inward remembering.
    mitigation: “Pour out praise” makes the remembrance an expressed act of praise.
  - risk: “Righteousness” may sound narrower than the Hebrew term.
    mitigation: The footnote preserves “justice” as a legitimate alternative.
