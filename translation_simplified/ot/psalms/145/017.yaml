simplification_decisions:
- pob_phrase: Yahweh is righteous in all his ways
  simplified_phrase: All Yahweh’s ways are righteous
  preserved_meaning: Every way Yahweh acts is morally right, while the biblical image of his “ways” remains.
  reasoning_layer_used: Lexical decisions for צַדִּיק and דְּרָכָיו
  rationale: Reordering the clause makes it easier to read without weakening “righteous” or removing the “ways” image.
- pob_phrase: faithful in all his works
  simplified_phrase: faithful in everything he does
  preserved_meaning: Yahweh is dependably faithful in every deed and action.
  reasoning_layer_used: Lexical and theological decisions for חָסִיד and מַעֲשָׂיו
  rationale: “Everything he does” expresses “all his works” in ordinary English while retaining the chosen covenantal sense of “faithful.”
