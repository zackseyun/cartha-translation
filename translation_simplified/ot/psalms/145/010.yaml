translation:
  language: en
  text: Everything you have made will give thanks to you, Yahweh,[b] and your faithful people[a] will bless you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “your saints” or “your godly ones”; the Hebrew describes people devoted and loyal to God.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “YHWH,” traditionally rendered “the LORD.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: All your works
  simplified_phrase: Everything you have made
  preserved_meaning: The phrase includes the full scope of what Yahweh has made.
  reasoning_layer_used: POB lexical decision and psalm context
  rationale: This wording makes the intended sense of “works” immediately clear.
- pob_phrase: your faithful ones
  simplified_phrase: your faithful people
  preserved_meaning: These are people marked by loyalty and devotion to Yahweh.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “People” sounds natural while retaining the chosen emphasis on faithfulness.
- pob_phrase: O Yahweh
  simplified_phrase: Yahweh
  preserved_meaning: Yahweh remains the personal divine name and the one being addressed.
  reasoning_layer_used: POB theological decision
  rationale: Modern English does not need the vocative “O” to show direct address.
translation_notes:
  risk_flags:
  - risk: “Everything you have made” narrows the possible lexical sense “deeds.”
    mitigation: The POB rationale identifies the created order as the contextual sense.
  - risk: “Faithful people” may not by itself convey covenant loyalty.
    mitigation: Footnote [a] briefly preserves the term’s loyalty and devotion.
