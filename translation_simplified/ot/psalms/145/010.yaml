  preserved_meaning: The phrase includes the whole created order as God’s work.
  reasoning_layer_used: POB lexical decision for מַעֲשֶׂיךָ and immediate context
  rationale: This wording makes “works” concrete without reducing its total scope.
- pob_phrase: your faithful ones
  simplified_phrase: your faithful people
  preserved_meaning: These are people characterized by loyalty and devotion to God.
  reasoning_layer_used: POB lexical and theological decisions for חֲסִידֶיךָ
  rationale: “Faithful people” is more natural English while avoiding the later associations of “saints.”
- pob_phrase: O Yahweh
  simplified_phrase: Yahweh
  preserved_meaning: The Hebrew covenant name remains a direct form of address.
  reasoning_layer_used: POB theological decision for יְהוָה
  rationale: Removing the poetic “O” improves modern readability without changing whom the verse addresses.
