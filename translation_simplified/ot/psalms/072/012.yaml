  preserved_meaning: He causes vulnerable people to escape distress.
  reasoning_layer_used: Lexical decision for יַצִּיל
  rationale: “Rescues” expresses the concrete sense in familiar English without implying only spiritual salvation.
- pob_phrase: the needy ... and the poor
  simplified_phrase: needy people ... and poor people
  preserved_meaning: The verse names two related forms of material hardship without merging them.
  reasoning_layer_used: Lexical decisions for אֶבְיוֹן and עָנִי
  rationale: Adding “people” makes both descriptions sound natural while keeping them distinct.
- pob_phrase: who has no helper
  simplified_phrase: who have no one to help them
  preserved_meaning: The poor are abandoned and lack personal aid.
  reasoning_layer_used: Lexical decision for וְאֵין עֹזֵר לוֹ
  rationale: The expanded clause uses ordinary English while retaining the personal lack of help.
