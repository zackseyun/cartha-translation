  preserved_meaning: The prayer asks for the king’s dominion to span a vast area.
  reasoning_layer_used: POB lexical decision and royal-psalm context
  rationale: Recasting the clause makes the geographic scope of his rule immediately clear.
- pob_phrase: to the ends of the earth
  simplified_phrase: to the farthest reaches of the earth
  preserved_meaning: His rule is envisioned as reaching earth’s most distant places.
  reasoning_layer_used: POB lexical decision for עַד אַפְסֵי אָרֶץ
  rationale: “Farthest reaches” explains the geographic image without weakening its worldwide scope.
