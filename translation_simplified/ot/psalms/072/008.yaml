  text: May his rule extend from one sea to the other, and from the River[a] to the farthest reaches of the earth.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The River” probably means the Euphrates, a familiar boundary in biblical geography.
