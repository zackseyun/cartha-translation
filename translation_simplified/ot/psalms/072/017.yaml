translation:
  language: en
  text: May his name last forever. May it live on as long as the sun shines.[a][b] May all nations be blessed in him[c] and call him blessed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew reads more literally, “before the sun.”
    reason: lexical_alternative
  - marker: b
    text: The rare verb translated “live on” may also suggest flourishing, increasing, or spreading.
    reason: lexical_alternative
  - marker: c
    text: Or “May all nations bless themselves by him.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: May his name endure forever
  simplified_phrase: May his name last forever
  preserved_meaning: The king’s name and renown are wished to continue without end.
  reasoning_layer_used: Lexical decision for יְהִי and לְעוֹלָם
  rationale: “Last” expresses enduring continuance in more familiar English.
- pob_phrase: before the sun, may his name continue
  simplified_phrase: May it live on as long as the sun shines
  preserved_meaning: His name is wished to continue for as long as the sun remains.
  reasoning_layer_used: Lexical decisions for לִפְנֵי שֶׁמֶשׁ and ינין
  rationale: The recast clause makes the likely temporal sense clear while retaining the sun image.
- pob_phrase: May all nations be blessed in him; may they call him blessed
  simplified_phrase: May all nations be blessed in him and call him blessed
  preserved_meaning: Every nation is wished to receive blessing in him and declare him blessed.
  reasoning_layer_used: Lexical and theological decisions for וְיִתְבָּרְכוּ בוֹ and יְאַשְּׁרוּהוּ
  rationale: Joining the parallel wishes produces a smoother sentence without merging their distinct meanings.
