translation:
  language: en
  text: May his name last forever and live on as long as the sun shines.[a] May every nation be blessed in him,[b] and may they call him blessed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says more literally, “before the sun.” The rare verb translated “live on” may also suggest flourishing, increasing, or being carried on through future generations.
    reason: lexical_alternative
  - marker: b
    text: Or “may every nation bless itself by him.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: May his name endure forever; may his name continue
  simplified_phrase: May his name last forever and live on
  preserved_meaning: The king’s name, reputation, and enduring identity are wished to continue without end.
  reasoning_layer_used: POB lexical decisions for שְׁמוֹ, לְעוֹלָם, and ינין
  rationale: “Last” and “live on” express enduring remembrance in familiar English without resolving the rare verb’s nuances.
- pob_phrase: as long as the sun
  simplified_phrase: as long as the sun shines
  preserved_meaning: His name is wished to continue for as long as the sun remains.
  reasoning_layer_used: Applied idiom revision for לִפְנֵי שֶׁמֶשׁ
  rationale: Adding “shines” makes the temporal image immediately natural while retaining the sun imagery.
- pob_phrase: May all nations be blessed in him
  simplified_phrase: May every nation be blessed in him
  preserved_meaning: The blessing extends universally through the king while retaining the Abrahamic wording and its possible reflexive sense.
  reasoning_layer_used: POB lexical and theological decisions for וְיִתְבָּרְכוּ בוֹ and כָּל גּוֹיִם
  rationale: “Every nation” is smoother common English, while “in him” preserves the chosen theological resonance.
translation_notes:
  risk_flags:
  - risk: “Live on” may be heard only as remembrance and not as flourishing or propagation.
    mitigation: Footnote a preserves the rare verb’s wider possible nuances.
  - risk: “Be blessed in him” may remain unfamiliar to some readers.
    mitigation: The wording preserves the POB’s Abrahamic resonance, and footnote b records the reflexive alternative.
