- pob_phrase: and may his glory fill the whole earth
  simplified_phrase: May his glory fill the whole earth.
  preserved_meaning: The prayer still has worldwide scope and keeps “glory” as the central biblical term.
  reasoning_layer_used: Lexical and theological decisions for וְיִמָּלֵא, כְבוֹדוֹ, and הָאָרֶץ
  rationale: A separate sentence makes the second prayer easier to follow without narrowing “earth” to “land.”
