simplification_decisions:
- pob_phrase: And blessed be his glorious name forever
  simplified_phrase: May his glorious name be blessed forever.
  preserved_meaning: This remains a prayer that God's glorious name will always be blessed.
  reasoning_layer_used: Lexical decision for וּבָרוּךְ and שֵׁם כְּבוֹדוֹ
