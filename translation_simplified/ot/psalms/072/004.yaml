translation:
  language: en
  text: May he ensure justice for the poor among the people. May he rescue the children of those in need and crush the oppressor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be translated, “He will ensure justice for the poor among the people. He will rescue the children of those in need and crush the oppressor.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: judge the poor of the people
  simplified_phrase: ensure justice for the poor among the people
  preserved_meaning: The king is asked to exercise judicial authority for the poor.
  reasoning_layer_used: Lexical decision for יִשְׁפֹּט and the royal-prayer context
  rationale: This avoids suggesting that the poor are being condemned while retaining the judicial sense.
- pob_phrase: save the children of the needy
  simplified_phrase: rescue the children of those in need
  preserved_meaning: The king is asked to deliver the needy people's children from danger.
  reasoning_layer_used: Lexical decisions for יוֹשִׁיעַ and לִבְנֵי אֶבְיוֹן
  rationale: “Rescue” and “those in need” state the same idea in ordinary English.
- pob_phrase: and crush the oppressor
  simplified_phrase: and crush the oppressor
  preserved_meaning: The king is asked to break the power of the person who exploits others.
  reasoning_layer_used: Lexical decisions for וִידַכֵּא and עוֹשֵׁק
  rationale: The vivid image remains because it conveys the force of judgment against oppression.
