translation:
  language: en
  text: May he live! May he receive gold from Sheba.[a] May people always pray for him,[b] and may they bless him all day long.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More formally, “May someone give him gold from Sheba”; the Hebrew does not name the giver.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew does not specify who prays for him.
    reason: lexical_alternative
