  text: May grain grow abundantly in the land,[a] even on the mountaintops. May its crop wave like Lebanon. May the city’s people spring up like grass from the ground.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “May even a handful of grain grow in the land.” The rare Hebrew phrase may describe either abundant grain or a small amount that becomes extraordinarily fruitful.
