simplification_decisions:
- pob_phrase: O God
  simplified_phrase: God
  preserved_meaning: God remains the one directly addressed in prayer.
  reasoning_layer_used: Lexical decision for אֱלֹהִים
  rationale: Modern direct address does not require the elevated vocative “O.”
- pob_phrase: give your judgments to the king
  simplified_phrase: let the king judge with your justice
  preserved_meaning: The king is to exercise judgment according to justice that comes from God.
  reasoning_layer_used: Lexical rationale for מִשְׁפָּטֶיךָ and grounding review
  rationale: This makes the royal judicial function clear while retaining God’s justice as its standard.
- pob_phrase: and your righteousness to the king’s son
  simplified_phrase: Give the king’s son your righteousness
  preserved_meaning: The prayer asks God to give his moral and judicial righteousness to the royal son.
  reasoning_layer_used: Lexical and theological decisions for וְצִדְקָתְךָ and לְבֶן־מֶלֶךְ
  rationale: A separate sentence clarifies the parallel request without deciding the royal son’s identity.
interpretive_expansions:
- pob_phrase: give your judgments to the king
  rendering: let the king judge with your justice
  claim: God’s judgments provide the justice by which the king is to judge.
  evidence:
  - The lexical rationale places the term in a royal judicial context.
  - The POB lists “your justice” as a viable lexical alternative.
  confidence: high
  alternatives_preserved:
  - your judgments
  - your ordinances
translation_notes:
  risk_flags:
  - risk: The wording recasts the concrete plural “judgments” as the standard of justice used in judging.
    mitigation: It retains God’s justice and follows the POB’s royal-judicial rationale and lexical alternative.
  - risk: Readers may identify the king’s son only with Solomon or only with the Messiah.
    mitigation: The text preserves the royal title without resolving its historical or messianic scope.
