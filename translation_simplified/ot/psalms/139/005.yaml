simplification_decisions:
- pob_phrase: hem me in behind and before
  simplified_phrase: close me in from behind and in front
  preserved_meaning: God encloses the speaker on both sides without making the enclosure clearly protective or threatening.
  reasoning_layer_used: Lexical and theological decisions on צַרְתָּנִי and the paired spatial terms.
  rationale: “Close me in” is clear modern English that retains both enclosure and possible pressure.
- pob_phrase: lay your hand upon me
  simplified_phrase: place your hand on me
  preserved_meaning: God places his hand directly on the speaker.
  reasoning_layer_used: Lexical decisions on וַתָּשֶׁת, עָלַי, and כַּפֶּךָ.
  rationale: “Place” and “on” express the same physical image in ordinary modern English.
