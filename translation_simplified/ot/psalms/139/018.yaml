  preserved_meaning: God’s thoughts are too numerous to count and exceed the sand in number.
  reasoning_layer_used: Lexical decisions and immediate context
  rationale: “Outnumber the grains of sand” states the comparison in direct, natural English while keeping “them” linked to the previous verse.
- pob_phrase: When I awake
