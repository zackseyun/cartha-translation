translation:
  language: en
  text: If I tried to count them, they would outnumber the grains of sand. When I wake up, I am still with you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean, “I awoke, and I am still with you.” The Hebrew does not specify the exact sense or timing of the awakening.
