simplification_decisions:
- pob_phrase: I am fearfully and wonderfully made
  simplified_phrase: you made me in an awe-inspiring and wonderful way
  preserved_meaning: God formed the psalmist in a way that evokes reverent awe and wonder.
  reasoning_layer_used: Lexical decisions for נוֹרָאוֹת and נִפְלֵיתִי, supported by the formation context in verses 13–16.
  rationale: The active wording is easier to understand and prevents “fearfully” from sounding like terror.
- pob_phrase: wonderful are your works
  simplified_phrase: Your works are wonderful
  preserved_meaning: God’s works are extraordinary and marvelous.
  reasoning_layer_used: Lexical decision for נִפְלָאִים and the POB revision preserving its emphasis.
  rationale: Ordinary English word order improves readability while keeping the repeated emphasis on “wonderful.”
- pob_phrase: my soul knows it very well
  simplified_phrase: I myself know this very well
  preserved_meaning: The psalmist personally and inwardly recognizes the wonder of God’s work.
  reasoning_layer_used: The theological decision for נֶפֶשׁ permits “I myself” while retaining “my soul” in a note.
  rationale: This avoids a narrow body-soul reading while preserving the Hebrew image in the footnote.
