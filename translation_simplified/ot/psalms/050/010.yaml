  preserved_meaning: The livestock also belong to God as a distinct complementary category.
  reasoning_layer_used: Applied revision and theological merism decision
  rationale: The new clause makes the implied ownership clear without merging wild animals and livestock.
- pob_phrase: on a thousand hills
