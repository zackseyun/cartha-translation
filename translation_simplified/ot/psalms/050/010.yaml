translation:
  language: en
  text: For every wild animal in the forest belongs to me, and so do the livestock on a thousand hills.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the animals on a thousand mountains.” The Hebrew words can refer broadly to animals and to either hills or mountains.
