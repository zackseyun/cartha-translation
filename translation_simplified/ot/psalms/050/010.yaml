  preserved_meaning: God owns each wild animal inhabiting the forest.
  reasoning_layer_used: POB lexical decisions for לִי and חַיְתוֹ יָעַר
  rationale: The wording states possession and habitat in more ordinary English.
- pob_phrase: as are the livestock
