translation:
  language: en
  text: But God says to the wicked, “What right do you have to recite my laws and speak of my covenant?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “take my covenant upon your mouth,” picturing the covenant as being carried on someone’s lips in speech.
    reason: source_note
simplification_decisions:
- pob_phrase: But to the wicked God says
  simplified_phrase: But God says to the wicked
  preserved_meaning: God directly contrasts and addresses wicked people.
  reasoning_layer_used: Lexical decision for וְלָרָשָׁע and אָמַר אֱלֹהִים
  rationale: Ordinary English word order makes the speaker and audience immediately clear.
- pob_phrase: recount my statutes
  simplified_phrase: recite my laws
  preserved_meaning: The wicked person verbally repeats God’s prescribed commands.
  reasoning_layer_used: Lexical decisions for לְסַפֵּר and חֻקַּי
  rationale: “Recite my laws” expresses the legal sense in familiar language.
- pob_phrase: take my covenant on your lips
  simplified_phrase: speak of my covenant
  preserved_meaning: The wicked person invokes God’s covenant in speech.
  reasoning_layer_used: Lexical decisions for וַתִּשָּׂא, בְרִיתִי, and עֲלֵי פִיךָ
  rationale: The main text states the idiomatic meaning while the note preserves the Hebrew mouth image.
translation_notes:
  risk_flags:
  - risk: “Speak of my covenant” could sound like a ban on every mention of the covenant.
    mitigation: The question about one’s right preserves the POB focus on hypocritical standing rather than a blanket prohibition.
  - risk: The main text does not retain the concrete image of carrying the covenant on one’s mouth.
    mitigation: The footnote preserves and briefly explains the source-language image.
