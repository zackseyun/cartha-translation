  preserved_meaning: Fire actively consumes in the space before God.
  reasoning_layer_used: POB lexical decisions for תֹאכֵל and לְפָנָיו
  rationale: “In front of him” clarifies the location without weakening the devouring action.
- pob_phrase: around him it storms violently
