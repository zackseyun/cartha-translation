  preserved_meaning: An intensely raging storm surrounds God.
  reasoning_layer_used: POB lexical alternatives for נִשְׂעֲרָה and מְאֹד
  rationale: Naming the storm removes the unclear impersonal “it” while preserving the tempestuous scene.
