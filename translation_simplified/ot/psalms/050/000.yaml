translation:
  language: en
  text: 'A psalm of Asaph.


    God, God, Yahweh, has spoken. He has summoned the whole earth, from where the sun rises to where it sets.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh is God’s name, often translated “the LORD.” Some understand the opening divine titles as “The God of gods, the LORD.”
    reason: alternative_reading
