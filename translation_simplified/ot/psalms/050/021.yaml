translation:
  language: en
  text: You did all this, and I remained silent. So you thought I was morally just like you.[a] But I will rebuke you and lay out the charges before your eyes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “you imagined that I would be like you.”
    reason: lexical_alternative
  - marker: b
    text: Or “set it in order before your eyes.” The object is implied in Hebrew.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: You did these things, and I kept silent
  simplified_phrase: You did all this, and I remained silent
  preserved_meaning: God had not responded openly to the offenses he had just listed.
  reasoning_layer_used: Lexical decisions and immediate context
  rationale: “All this” points naturally back to the preceding offenses, while “remained silent” keeps the sense of sustained silence.
- pob_phrase: set the case before your eyes
  simplified_phrase: lay out the charges before your eyes
  preserved_meaning: God will present the accusations openly and in an orderly way.
  reasoning_layer_used: Lexical and theological decisions
  rationale: “Lay out the charges” makes the judicial setting easier to grasp while retaining the image of presentation.
interpretive_expansions:
- pob_phrase: altogether like you
  rendering: morally just like you
  claim: The supposed likeness concerns moral character and approval of wrongdoing, not likeness in every respect.
  evidence:
  - The immediate context is a moral indictment of specific offenses.
  - The POB rationale identifies presumed moral equivalence as the emphatic point.
  confidence: high
  alternatives_preserved:
  - you imagined that I would be like you
translation_notes:
  risk_flags:
  - risk: “Charges” supplies the implied object of the Hebrew verb.
    mitigation: The footnote preserves the less explicit alternative, “set it in order.”
