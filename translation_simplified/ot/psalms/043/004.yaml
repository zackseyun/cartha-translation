translation:
  language: en
  text: Then I will go to God’s altar—to God, my greatest joy.[a] I will praise you with the lyre,[b] O God, my God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “the joy of my rejoicing,” repeating two words for joy to emphasize how great this joy is.
    reason: lexical_alternative
  - marker: b
    text: A lyre is an ancient stringed instrument, similar to a small harp.
    reason: cultural_note
