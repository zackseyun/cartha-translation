translation:
  language: en
  text: For you are the God who is my refuge.[a] Why have you rejected me? Why do I keep mourning while the enemy oppresses me?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the God of my stronghold” or “the God of my strength.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the God of my refuge
  simplified_phrase: the God who is my refuge
  preserved_meaning: God is the psalmist’s source and place of protection.
  reasoning_layer_used: The lexical decision favors protective refuge imagery while preserving the Hebrew construct relationship.
  rationale: The relative clause makes the relationship clear in ordinary English.
- pob_phrase: do I go about mourning
  simplified_phrase: do I keep mourning
  preserved_meaning: The psalmist remains in an ongoing state of sorrow.
  reasoning_layer_used: The lexical rationale identifies sustained conduct and the idiomatic sense of being darkened in mourning.
  rationale: “Keep mourning” states the continuing condition more directly.
- pob_phrase: under the oppression of the enemy
  simplified_phrase: while the enemy oppresses me
  preserved_meaning: The enemy’s oppression is the circumstance in which the psalmist mourns.
  reasoning_layer_used: The lexical decisions retain oppression by a known or representative enemy.
  rationale: An active clause is easier to understand than the abstract noun phrase.
