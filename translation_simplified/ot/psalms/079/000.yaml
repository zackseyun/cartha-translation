  text: 'A psalm of Asaph.


    God, the nations have invaded what belongs to you. They have defiled your holy temple and reduced Jerusalem to heaps of ruins.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: nations have come into your inheritance
  simplified_phrase: the nations have invaded what belongs to you
  preserved_meaning: Foreign peoples have entered and violated what belongs to God without narrowing his inheritance to the land alone.
  reasoning_layer_used: source payload, immediate context, and grounding review
  rationale: “Invaded” conveys the hostile entry, while “what belongs to you” preserves the broad scope of God’s inheritance.
- pob_phrase: they have made Jerusalem into ruins
  simplified_phrase: reduced Jerusalem to heaps of ruins
  preserved_meaning: The attackers devastated Jerusalem and left it in ruins.
  reasoning_layer_used: applied revision and POB lexical alternative
  rationale: “Heaps of ruins” clearly preserves the force of the Hebrew plural noted in the audit.
