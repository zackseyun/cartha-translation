  text: For they have devoured Jacob and left his dwelling place in ruins.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Jacob” is the poetic covenant name for the people of Israel; “his dwelling place” refers broadly to where they lived, not necessarily only to the temple.
