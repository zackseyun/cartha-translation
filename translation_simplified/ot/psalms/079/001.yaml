  simplified_phrase: have invaded what belongs to you—your inheritance
  preserved_meaning: Foreign nations have entered God's covenant possession without limiting it to the land or the people.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: This explains “inheritance” while retaining its broad covenant meaning.
- pob_phrase: have defiled your holy temple
  simplified_phrase: have dishonored your holy temple by making it unclean
  preserved_meaning: The invaders violated the temple's sacred purity and thereby profaned it.
  reasoning_layer_used: POB lexical decision for טִמְּאוּ and grounding review
  rationale: “By” presents sacred dishonor as the meaning of one defiling act, not a second action.
- pob_phrase: have reduced Jerusalem to ruins
  simplified_phrase: have left Jerusalem in ruins
  preserved_meaning: Jerusalem was devastated and became ruins.
  reasoning_layer_used: POB source audit for שָׂמוּ ... לְעִיִּים
  rationale: This states the result naturally without inventing a single ruin-heap.
