translation:
  language: en
  text: They have given the dead bodies of your servants to the birds of the sky as food, and the flesh of your faithful ones[a] to the wild animals of the earth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “your holy ones” or “your saints.” The Hebrew term refers to people devoted to God in covenant loyalty.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the corpses of your servants
  simplified_phrase: the dead bodies of your servants
  preserved_meaning: God’s servants were killed and left unburied in disgrace.
  reasoning_layer_used: POB lexical decision for נִבְלַת
  rationale: “Dead bodies” states the meaning of “corpses” in more familiar English.
- pob_phrase: the birds of the heavens
  simplified_phrase: the birds of the sky
  preserved_meaning: Birds were allowed to feed on the unburied bodies.
  reasoning_layer_used: POB lexical alternatives for לְעוֹף הַשָּׁמַיִם
  rationale: “Sky” is the ordinary modern equivalent here and avoids implying God’s dwelling.
- pob_phrase: the beasts of the earth
  simplified_phrase: the wild animals of the earth
  preserved_meaning: Land animals consumed the flesh of God’s faithful people.
  reasoning_layer_used: POB lexical decision for לְחַיְתוֹ אָרֶץ
  rationale: “Wild animals” makes the older poetic word “beasts” immediately clear.
