translation:
  language: en
  text: We have become an object of contempt to our neighbors. Those around us mock and ridicule us.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: a reproach to our neighbors
  simplified_phrase: an object of contempt to our neighbors
  preserved_meaning: The people as a whole have become publicly shamed and treated with contempt by neighboring peoples.
  reasoning_layer_used: The lexical decisions for חֶרְפָּה and לִשְׁכֵנֵינוּ preserve both public shame and the collective relational sense.
  rationale: “An object of contempt” expresses “a reproach” in familiar English while retaining the singular collective image.
- pob_phrase: a mockery and derision
  simplified_phrase: mock and ridicule us
  preserved_meaning: Two related expressions continue to pile up the surrounding peoples’ hostile scorn.
  reasoning_layer_used: The lexical decisions for לַעַג and קֶלֶס require two distinct expressions of ridicule.
  rationale: Active verbs make the hostile treatment clear without merging the two ideas.
- pob_phrase: to those around us
  simplified_phrase: Those around us
  preserved_meaning: This group includes the broader surrounding peoples, not only immediate neighbors.
  reasoning_layer_used: The lexical decision for לִסְבִיבוֹתֵינוּ distinguishes this wider surrounding group.
  rationale: A new sentence clarifies the parallel thought while preserving its broader scope.
translation_notes:
  risk_flags:
  - risk: Changing the poetic nouns into active verbs may reduce the Hebrew nominal parallelism.
    mitigation: The rendering retains two forms of scorn and preserves the parallel movement across two sentences.
