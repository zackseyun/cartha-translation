- pob_phrase: How long, O Yahweh?
  simplified_phrase: How much longer, Yahweh?
  preserved_meaning: The urgent lament asks how long the present distress will continue.
  reasoning_layer_used: POB lexical decision for עַד מָה
  rationale: “How much longer” makes the ongoing duration natural and immediate in modern English.
- pob_phrase: Will you be angry forever?
  simplified_phrase: Will your anger never end?
  preserved_meaning: The speaker fears that Yahweh’s anger may continue without end.
  reasoning_layer_used: POB lexical decisions for תֶּאֱנַף and לָנֶצַח
  rationale: The recast question preserves “forever” while using smoother common English.
- pob_phrase: Will your jealousy burn like fire?
  simplified_phrase: Will your jealousy keep burning like fire?
  preserved_meaning: Yahweh’s covenant jealousy is pictured as an ongoing fire.
  reasoning_layer_used: POB lexical and theological decisions for קִנְאָה and תִּבְעַר
  rationale: “Keep burning” connects the fire image clearly to the lament about duration.
