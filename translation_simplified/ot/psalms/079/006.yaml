  rationale: The key verb remains unchanged so its documented breadth is not narrowed.
- pob_phrase: that do not call on your name
  simplified_phrase: that do not call on your name in prayer or worship
  preserved_meaning: These kingdoms neither appeal to God nor worship him by invoking his name.
  reasoning_layer_used: POB lexical rationale and footnote b
