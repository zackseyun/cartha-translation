translation:
  language: en
  text: Pour out your wrath on nations that do not know you,[a] and on kingdoms that do not call on your name in prayer or worship.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Know you” can also mean “acknowledge you,” not merely know about you.
    reason: lexical_alternative
  - marker: b
    text: Calling on God’s name means appealing to him in prayer or worship.
    reason: simplification_note
