simplification_decisions:
- pob_phrase: O Yahweh
  simplified_phrase: Yahweh
  preserved_meaning: Yahweh remains the directly addressed personal name of God.
  reasoning_layer_used: theological decision on the divine name
  rationale: Dropping “O” gives a natural modern address without replacing the divine name.
- pob_phrase: who may sojourn in your tent?
  simplified_phrase: who may stay as a guest in your tent?
  preserved_meaning: The person is pictured as lodging in God's tent rather than owning a permanent home there.
  reasoning_layer_used: lexical decision for יָגוּר and בְּאָהֳלֶךָ
  rationale: “Stay as a guest” makes the uncommon word “sojourn” immediately understandable while keeping the tent image.
- pob_phrase: Who may dwell on your holy mountain?
  simplified_phrase: Who may live on your holy mountain?
  preserved_meaning: The question concerns who is fit to reside in God's holy place.
  reasoning_layer_used: lexical decision for יִשְׁכֹּן and בְּהַר קָדְשֶׁךָ
  rationale: “Live” is clearer common English for “dwell” while preserving the settled-residence contrast.
