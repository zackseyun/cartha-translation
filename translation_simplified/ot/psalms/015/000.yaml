translation:
  language: en
  text: 'A psalm of David.[a]


    Yahweh, who is welcome to stay in your tent?[b] Who may live on your holy mountain?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “by David” or “for David.” The Hebrew title can refer to authorship, association, or dedication.
    reason: alternative_reading
  - marker: b
    text: The “tent” is likely God’s sanctuary, also called the tabernacle.
    reason: cultural_note
