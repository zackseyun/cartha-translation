translation:
  language: en
  text: and to bring down their descendants among the nations,[a] and scatter them throughout the lands.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may mean causing their descendants to fall, but it does not specify death, defeat, or another kind of downfall.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: make their offspring fall
  simplified_phrase: bring down their descendants
  preserved_meaning: God would cause their posterity to suffer downfall without specifying death or military defeat.
  reasoning_layer_used: Lexical and theological decisions on וּלְהַפִּיל and זַרְעָם.
  rationale: This preserves the causative judgment while using familiar descent language.
- pob_phrase: scatter them through the lands
  simplified_phrase: scatter them throughout the lands
  preserved_meaning: Their descendants would be dispersed across multiple countries.
  reasoning_layer_used: Lexical decisions on וּלְזָרוֹתָם and בָּאֲרָצוֹת.
  rationale: This expresses broad geographic dispersal without adding a stronger quantifier.
translation_notes:
  risk_flags:
  - risk: “Bring down” could be understood only as military defeat.
    mitigation: The footnote preserves the broader Hebrew sense of unspecified downfall.
