translation:
  language: en
  text: and to bring down their descendants among the nations and scatter them across different lands.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: make their offspring fall
  simplified_phrase: bring down their descendants
  preserved_meaning: God would cause their posterity to suffer downfall without specifying death or military defeat.
  reasoning_layer_used: POB lexical and theological decisions on וּלְהַפִּיל and זַרְעָם
  rationale: “Bring down” keeps the causative judgment broad, while “descendants” makes the family line clear.
- pob_phrase: scatter them through the lands
  simplified_phrase: scatter them across different lands
  preserved_meaning: Their descendants would be dispersed over multiple countries.
  reasoning_layer_used: POB lexical decision on וּלְזָרוֹתָם and בָּאֲרָצוֹת
  rationale: “Across different lands” expresses widespread geographic dispersal in ordinary English.
translation_notes:
  risk_flags:
  - risk: “Bring down” could be understood as either defeat or general downfall.
    mitigation: This breadth is intentional because the Hebrew and POB do not limit the judgment to death or military defeat.
