simplification_decisions:
- pob_phrase: sent leanness into their soul
  simplified_phrase: made their souls waste away
  preserved_meaning: God’s judgment brought wasting that reached their inner lives and whole selves.
  reasoning_layer_used: Lexical decisions for רָזוֹן and נֶפֶשׁ, together with the theological decision to retain “soul.”
  rationale: The verbal wording keeps the wasting image while making the sentence natural in modern English.
- pob_phrase: So he gave them what they asked for, but sent
  simplified_phrase: So he gave them what they asked for, but he made
  preserved_meaning: God granted their request, yet the result also included his judgment.
  reasoning_layer_used: Lexical decision for וַיְשַׁלַּח and its adversative contextual force.
  rationale: Repeating the subject clarifies the contrast and avoids the dense clause structure.
translation_notes:
  risk_flags:
  - risk: “Souls” may be read as only the immaterial part of a person.
    mitigation: The footnote preserves the broader Hebrew senses of life, self, and whole being.
  - risk: Changing “sent leanness” to “made their souls waste away” shifts the image from a noun to an action.
    mitigation: The rendering preserves both God’s agency and the force of wasting without making it a specific disease.
