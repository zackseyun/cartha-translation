translation:
  language: en
  text: Many times he rescued them. But they rebelled by following their own plans,[a] and they were brought low by their iniquity.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “their own counsel” or “their own purpose.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also mean that they sank down or wasted away because of their iniquity.
    reason: lexical_alternative
