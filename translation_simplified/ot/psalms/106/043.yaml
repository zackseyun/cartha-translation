translation:
  language: en
  text: Many times he rescued them. But they were rebellious in their own plans,[a] and because of their sin they were brought low.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “were rebellious in their counsel”; the Hebrew may refer to rebellious actions or a rebellious attitude in their plans or counsel.
    reason: lexical_alternative
  - marker: b
    text: Or “they sank down” or “they wasted away because of their sin.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Many times he delivered them
  simplified_phrase: Many times he rescued them
  preserved_meaning: God repeatedly freed them from danger or oppression.
  reasoning_layer_used: Lexical decision for יַצִּילֵם and the contextual divine subject
  rationale: “Rescued” gives the ordinary sense of “delivered” without adding broader salvation claims.
- pob_phrase: they were rebellious in their counsel
  simplified_phrase: they were rebellious in their own plans
  preserved_meaning: Their rebellious posture was expressed in their own counsel, plans, or purposes.
  reasoning_layer_used: Lexical decisions for יַמְרוּ and בַעֲצָתָם, reinforced by doctrine realignment
  rationale: This removes the unsupported continuative “remained” while making “counsel” easier to understand.
- pob_phrase: they were brought low by their iniquity
  simplified_phrase: because of their sin they were brought low
  preserved_meaning: Their morally serious wrongdoing caused them to become low, diminished, or ruined.
  reasoning_layer_used: Lexical and theological decisions for וַיָּמֹכּוּ and בַּעֲוֺנָם
  rationale: “Sin” is clearer than “iniquity,” while the resultative wording preserves how they became low.
translation_notes:
  risk_flags:
  - risk: “Plans” may sound narrower than Hebrew “counsel,” which can also mean purpose or deliberation.
    mitigation: Footnote [a] preserves the broader lexical range.
  - risk: “Brought low” does not specify whether they sank, declined, or wasted away.
    mitigation: Footnote [b] preserves the source verb’s important range without changing its verbal relationship.
