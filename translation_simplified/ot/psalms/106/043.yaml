  rationale: The wording is natural for common readers, while the footnote preserves the lexical range.
- pob_phrase: were brought low by their iniquity
  simplified_phrase: they were brought low by their iniquity
  preserved_meaning: Their morally serious rebellion caused their decline or abasement without naming an external agent.
