translation:
  language: en
  text: Our fathers in Egypt did not understand the wonderful things you did. They did not remember your abundant steadfast love. Instead, they rebelled at the sea—the Red Sea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Sea of Reeds.” The Hebrew name Yam Suph is traditionally rendered “Red Sea.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: your wondrous deeds
  simplified_phrase: the wonderful things you did
  preserved_meaning: God performed extraordinary acts that should have inspired wonder.
  reasoning_layer_used: POB lexical decision for נִפְלְאוֹתֶיךָ
  rationale: The verbal phrase is easier to understand while keeping the focus on God's acts.
- pob_phrase: the abundance of your steadfast love
  simplified_phrase: your abundant steadfast love
  preserved_meaning: God's loyal covenant love was shown in great measure.
  reasoning_layer_used: POB lexical and theological decisions for רֹב חֲסָדֶיךָ
  rationale: The shorter wording retains both abundance and the key term “steadfast love.”
- pob_phrase: but rebelled at the sea—the Red Sea
  simplified_phrase: Instead, they rebelled at the sea—the Red Sea
  preserved_meaning: Their rebellion contrasted with God's deeds and steadfast love and occurred at the Red Sea.
  reasoning_layer_used: POB lexical decisions and applied revision for וַיַּמְרוּ and the appositional sea phrases
  rationale: A new sentence makes the contrast clear while preserving the emphatic naming of the sea.
translation_notes:
  risk_flags:
  - risk: “Our fathers” may sound limited to immediate male parents.
    mitigation: It is retained because the POB deliberately preserves the masculine familial term for Israel's earlier generations.
