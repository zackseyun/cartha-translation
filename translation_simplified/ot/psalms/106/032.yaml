translation:
  language: en
  text: At the waters of Meribah,[a] they provoked anger.[b] Because of them, things went badly for Moses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Meribah means “quarreling” or “strife.”
    reason: cultural_note
  - marker: b
    text: Or “they angered him.” The Hebrew does not say explicitly whom they provoked.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: They provoked anger at the waters of Meribah
  simplified_phrase: At the waters of Meribah, they provoked anger.
  preserved_meaning: The people caused anger at Meribah without naming its object.
  reasoning_layer_used: Lexical decision for וַיַּקְצִיפוּ and עַל
  rationale: Moving the location first makes the event easier to follow while preserving the Hebrew ambiguity.
- pob_phrase: and it went badly for Moses because of them
  simplified_phrase: Because of them, things went badly for Moses.
  preserved_meaning: Moses experienced a bad outcome because of the people.
  reasoning_layer_used: Lexical decisions for וַיֵּרַע and בַּעֲבוּרָם
  rationale: The reordered sentence states the cause clearly without explaining the outcome beyond the source.
translation_notes:
  risk_flags:
  - risk: Readers may assume the verse names God as the one angered.
    mitigation: The main text leaves the object unstated, and footnote b records the alternative.
  - risk: Readers may infer that the verse assigns all blame to the people or all blame to Moses.
    mitigation: The wording preserves the bad outcome and its connection to the people without resolving culpability.
