translation:
  language: en
  text: They stirred up anger at the waters of Meribah.[a][b] Because of them, Moses suffered.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “They made him angry at the waters of Meribah.” The Hebrew does not say here who was angered.
    reason: lexical_alternative
  - marker: b
    text: Meribah means “quarreling” or “strife.”
    reason: cultural_note
simplification_decisions:
- pob_phrase: They provoked anger
  simplified_phrase: They stirred up anger
  preserved_meaning: The people caused anger without identifying who was angered.
  reasoning_layer_used: Lexical decision for וַיַּקְצִיפוּ and footnote a
  rationale: “Stirred up anger” states the causative idea in familiar English while preserving the unstated object.
- pob_phrase: and it went badly for Moses because of them
  simplified_phrase: Because of them, Moses suffered
  preserved_meaning: Moses experienced an unspecified bad outcome caused by the people.
  reasoning_layer_used: Lexical and theological decisions for וַיֵּרַע and בַּעֲבוּרָם
  rationale: The shorter sentence clearly conveys harm without deciding how Moses and the people shared blame.
translation_notes:
