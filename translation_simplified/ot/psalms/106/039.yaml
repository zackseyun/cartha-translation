simplification_decisions:
- pob_phrase: So they became unclean by their deeds
  simplified_phrase: Their deeds made them unclean
  preserved_meaning: Their own deeds were the cause of their uncleanness.
  reasoning_layer_used: Lexical decision for וַיִּטְמְאוּ and the causal use of בְּמַעֲשֵׂיהֶם
  rationale: The active wording makes the cause-and-result relationship easier to grasp without adding an outside agent.
- pob_phrase: by their acts
  simplified_phrase: by their actions
  preserved_meaning: Their conduct expressed and brought about their unfaithfulness.
  reasoning_layer_used: Lexical decision for בְּמַעַלְלֵיהֶם
  rationale: “Actions” is more common modern English while preserving the poetic variation from “deeds.”
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “prostituted themselves” only as literal sexual conduct.
    mitigation: The footnote explains that the image refers to moral and covenant unfaithfulness without removing it from the text.
