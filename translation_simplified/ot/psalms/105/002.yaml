translation:
  language: en
  text: Sing to him! Sing his praises! Tell[a] about all the wonderful things he has done.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “think deeply about” his wonderful works, but here it most likely means telling others about them.
