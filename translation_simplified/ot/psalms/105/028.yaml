translation:
  language: en
  text: He sent darkness and made it dark. They did not rebel against what he said.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew does not identify “they”; it may refer to the Egyptians or to Moses and Aaron. “What he said” may also be translated “his words,” “his word,” or “his command.”
