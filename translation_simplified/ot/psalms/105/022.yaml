simplification_decisions:
- pob_phrase: to bind his princes
  simplified_phrase: so that he could restrain the king’s officials
  preserved_meaning: Joseph was appointed with authority to bind or restrict Pharaoh’s court officials.
  reasoning_layer_used: The Hebrew purpose/result construction and lexical decisions for לֶאְסֹר and שָׂרָיו.
  rationale: “So that” links this authority to Joseph’s appointment, while “restrain” and “officials” clarify the court setting.
- pob_phrase: at his pleasure
  simplified_phrase: as he wished
  preserved_meaning: Joseph could exercise this authority according to his own will.
  reasoning_layer_used: The lexical decision for the Hebrew idiom בְּנַפְשׁוֹ.
  rationale: “As he wished” states the idiom naturally without suggesting enjoyment.
- pob_phrase: his princes ... his elders
  simplified_phrase: the king’s officials ... the king’s elders
  preserved_meaning: Both groups belonged to Pharaoh’s royal administration rather than to Joseph.
  reasoning_layer_used: The immediate context and lexical decisions for שָׂרָיו and וּזְקֵנָיו.
  rationale: Naming the king removes the pronoun ambiguity while retaining “elders” for age and status.
interpretive_expansions:
- pob_phrase: to bind his princes at his pleasure
  rendering: so that he could restrain the king’s officials as he wished
  claim: Joseph’s appointment gave him authority over Pharaoh’s officials for this purpose.
  evidence:
  - The preceding verse places Joseph over Pharaoh’s household and possessions.
  - The POB identifies the infinitive as expressing purpose or result from that appointment.
  - The POB says the idiom describes Joseph’s authority over Pharaoh’s princes.
  confidence: high
  alternatives_preserved:
