translation:
  language: en
  text: 'In his heart, the fool[b] says,

    “There is no God.”

    They are corrupt and commit detestable acts.[c]

    No one does good.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Here “fool” means someone who is morally and spiritually corrupt, not merely unintelligent.
    reason: simplification_note
  - marker: c
    text: The Hebrew shifts from one representative fool to the wider group such a person represents.
    reason: source_note
simplification_decisions:
- pob_phrase: The fool says in his heart
  simplified_phrase: In his heart, the fool says
  preserved_meaning: The denial arises from the person’s inner thought and will.
  reasoning_layer_used: Lexical decision for בְּלִבּוֹ
  rationale: The reordered clause reads naturally while retaining the biblical image of the heart.
- pob_phrase: they do abominable deeds
  simplified_phrase: commit detestable acts
  preserved_meaning: Their conduct is morally repulsive.
  reasoning_layer_used: Lexical decisions for הִתְעִיבוּ and עֲלִילָה
  rationale: “Detestable acts” expresses the force in more familiar English.
- pob_phrase: There is no one who does good
  simplified_phrase: No one does good
  preserved_meaning: No member of the corrupt group is doing good.
  reasoning_layer_used: Lexical decision for אֵין עֹשֵׂה טוֹב
  rationale: The shorter sentence states the same universal judgment directly.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “fool” as a comment only about intelligence.
    mitigation: Footnote b identifies its moral and spiritual force.
  - risk: The sudden change from singular “the fool” to plural “they” may seem unclear.
    mitigation: Footnote c explains that the singular person represents a wider class.
