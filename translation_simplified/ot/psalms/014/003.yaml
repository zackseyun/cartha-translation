translation:
  language: en
  text: Everyone has turned away. Together they have become corrupt.[a] No one does what is good—not even one.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “have become tainted” or “have become filthy.” The Hebrew describes becoming spoiled or corrupt.
