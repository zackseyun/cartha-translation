simplification_decisions:
- pob_phrase: All have turned aside
  simplified_phrase: Everyone has turned away
  preserved_meaning: Every person has departed from the right way.
  reasoning_layer_used: Lexical decision for הַכֹּל and סָר
  rationale: “Everyone” makes the universal human scope immediately clear, while “turned away” preserves the act of departure.
- pob_phrase: There is none who does good
  simplified_phrase: No one does what is good
  preserved_meaning: The verse denies that anyone characteristically does good.
  reasoning_layer_used: Lexical decisions for אֵין and עֹשֵׂה טוֹב
  rationale: The direct wording is more natural today and keeps the emphatic denial.
- pob_phrase: not even one
  simplified_phrase: not even one
  preserved_meaning: The final phrase intensifies the universal indictment.
  reasoning_layer_used: Lexical and theological decisions for גַּם אֶחָד
  rationale: Retaining the phrase preserves its force and prevents the statement from being softened.
translation_notes:
  risk_flags:
  - risk: “Everyone” could be heard as less formally comprehensive than “all.”
    mitigation: The closing “No one” and “not even one” reinforce the unrestricted scope.
