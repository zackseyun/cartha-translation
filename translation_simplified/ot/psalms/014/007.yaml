simplification_decisions:
- pob_phrase: Oh, that Israel’s salvation would come
  simplified_phrase: If only Israel’s salvation would come
  preserved_meaning: The words express a strong longing for Israel’s salvation.
  reasoning_layer_used: Lexical decision for מִי יִתֵּן
  rationale: “If only” expresses the wish in familiar modern English.
- pob_phrase: restores the fortunes of his people
  simplified_phrase: restores the well-being of his people
  preserved_meaning: Yahweh will reverse his people’s hardship and restore their condition.
  reasoning_layer_used: Lexical and theological decisions for שׁוּב שְׁבוּת
  rationale: “Well-being” is clearer than “fortunes” while retaining the idiom’s broad scope.
translation_notes:
  risk_flags:
  - risk: “Well-being” may sound narrower than a full reversal of the people’s plight.
    mitigation: The footnote explains the idiom’s broader restorative force.
  - risk: Modern readers may mistake Jacob for one individual here.
    mitigation: Its parallel placement with Israel preserves the poetic identification of Jacob with the people.
