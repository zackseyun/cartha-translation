translation:
  language: en
  text: If only Israel’s salvation would come from Zion! When Yahweh turns around his people’s troubled situation,[a] Jacob will rejoice, and Israel will be glad.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “when Yahweh brings back the captivity of his people.” This Hebrew expression often means that he restores his people or reverses their troubles.
    reason: alternative_reading
  - marker: b
    text: “Jacob” and “Israel” are parallel names for God’s people here.
    reason: cultural_note
