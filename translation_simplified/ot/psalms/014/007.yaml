translation:
  language: en
  text: If only Israel’s salvation would come from Zion! When Yahweh restores the well-being of his people,[a] Jacob will rejoice, and Israel will be glad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “brings back the captivity of his people.” The Hebrew expression often means reversing a people’s hardship and restoring them.
