translation:
  language: en
  text: You rebuked the nations and destroyed the wicked.[a] You wiped their name away[b] forever and ever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the wicked one”; the Hebrew singular may refer to one person or to the wicked as a group.
    reason: alternative_reading
  - marker: b
    text: Here, their “name” can refer to their memory or renown.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: You rebuked nations; you destroyed the wicked
  simplified_phrase: You rebuked the nations and destroyed the wicked.
  preserved_meaning: God forcefully judged the nations and brought the wicked to ruin.
  reasoning_layer_used: Lexical decisions for גָּעַרְתָּ, גּוֹיִם, אִבַּדְתָּ, and רָשָׁע.
  rationale: The article and joined clauses make the line natural without weakening the judgment.
- pob_phrase: you blotted out their name
  simplified_phrase: You wiped their name away
  preserved_meaning: God completely removed the name, memory, or renown of the wicked.
  reasoning_layer_used: Lexical decisions for שְׁמָם and מָחִיתָ.
  rationale: “Wiped away” preserves the removal image in familiar modern wording.
- pob_phrase: forever and ever
