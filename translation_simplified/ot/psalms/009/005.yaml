translation:
  language: en
  text: You rebuked the nations and destroyed the wicked.[a] You erased their name forever and ever.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the wicked one”; the Hebrew singular may refer to one person or to the wicked as a group.
    reason: alternative_reading
  - marker: b
    text: Their “name” may include their memory or renown.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: You rebuked nations; you destroyed the wicked
  simplified_phrase: You rebuked the nations and destroyed the wicked.
  preserved_meaning: God forcefully confronts the nations and brings destruction on the wicked.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The smoother sentence keeps “rebuked,” “nations,” and the preferred collective sense of “the wicked.”
- pob_phrase: you blotted out their name
  simplified_phrase: You erased their name
  preserved_meaning: God completely removes the wicked people’s name, including its continuing remembrance or renown.
  reasoning_layer_used: POB lexical decision and footnote
  rationale: “Erased” makes the removal image immediately clear while retaining “their name.”
- pob_phrase: forever and ever
  simplified_phrase: forever and ever
  preserved_meaning: The removal is permanent and emphatic.
  reasoning_layer_used: POB lexical decision
  rationale: The familiar phrase clearly preserves the Hebrew expression’s intensified duration.
translation_notes:
  risk_flags:
  - risk: “The wicked” may obscure the Hebrew grammatical singular.
    mitigation: Footnote a preserves the possible individual reading.
  - risk: Modern readers may take “their name” only as a literal label.
    mitigation: Footnote b explains its possible sense of memory or renown.
