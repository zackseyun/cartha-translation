simplification_decisions:
- pob_phrase: Be gracious to me, O Yahweh
  simplified_phrase: Yahweh, show me your grace
  preserved_meaning: The psalmist asks Yahweh for gracious favor.
  reasoning_layer_used: POB lexical decision for חָנְנֵנִי and divine-name doctrine
  rationale: The active request is easier to understand while retaining grace and Yahweh’s personal name.
- pob_phrase: see my affliction caused by those who hate me
  simplified_phrase: See my suffering caused by those who hate me
  preserved_meaning: The psalmist asks God to notice his personal distress inflicted by those who hate him.
  reasoning_layer_used: POB lexical and syntactical decisions for עָנְיִי and מִשֹּׂנְאַי
  rationale: “Suffering” is more common than “affliction,” while “my” preserves the explicit personal appeal.
- pob_phrase: you who lift me up from the gates of death
