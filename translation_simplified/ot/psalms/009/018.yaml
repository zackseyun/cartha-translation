translation:
  language: en
  text: For those in need will not be forgotten forever.[a] The hope of those who suffer hardship[b] will not disappear forever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The repeated “forever” stresses that those in need and those who suffer hardship will not be abandoned permanently.
    reason: cultural_note
  - marker: b
    text: The Hebrew may also describe the humble or meek.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the needy
  simplified_phrase: those in need
  preserved_meaning: People facing poverty or other serious need remain in view.
  reasoning_layer_used: lexical decision for אֶבְיוֹן
  rationale: This uses ordinary English without limiting the need to money.
- pob_phrase: the afflicted
  simplified_phrase: those who suffer hardship
  preserved_meaning: The phrase identifies vulnerable people enduring hardship while preserving the broader lexical possibilities in a footnote.
  reasoning_layer_used: lexical and theological decisions for ענוים
  rationale: Adding “hardship” keeps the contextual social-affliction sense clear.
- pob_phrase: will not perish forever
  simplified_phrase: will not disappear forever
  preserved_meaning: Their hope will not be permanently lost.
  reasoning_layer_used: lexical decision for תֹּאבַד and poetic parallelism
  rationale: “Disappear” describes the loss of hope in clear common English.
translation_notes:
  risk_flags:
  - risk: “Those who suffer hardship” does not directly express the possible senses “humble” or “meek.”
    mitigation: A lexical footnote preserves those alternatives.
  - risk: Repeating “forever” may sound redundant in English.
    mitigation: The repetition is retained because it emphasizes the lasting assurance in both poetic lines.
