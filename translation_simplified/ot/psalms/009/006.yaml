translation:
  language: en
  text: The enemy has come to an end in ruins that will last forever.[a] You have uprooted cities. Even the memory of them has vanished.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “O enemy, destructions are finished forever.” The Hebrew opening may be a direct address to the enemy.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: everlasting ruins
  simplified_phrase: ruins that will last forever
  preserved_meaning: The enemy’s ruin is permanent.
  reasoning_layer_used: Lexical decisions for חֳרָבוֹת and לָנֶצַח
  rationale: The clause states the permanence in more familiar English.
- pob_phrase: you have uprooted cities;
  simplified_phrase: You have uprooted cities.
  preserved_meaning: God has removed the cities completely while retaining the uprooting image.
  reasoning_layer_used: Lexical decision for נָתַשְׁתָּ
  rationale: A new sentence makes the forceful image easier to follow.
- pob_phrase: the very memory of them has perished
  simplified_phrase: Even the memory of them has vanished
  preserved_meaning: Nothing remains by which the cities would be remembered.
  reasoning_layer_used: Lexical decisions for אָבַד, זִכְרָם, and הֵמָּה
  rationale: “Even” carries the Hebrew emphasis, while “vanished” is clearer with memory.
translation_notes:
  risk_flags:
  - risk: The Hebrew opening can also be read as a direct address to the enemy.
    mitigation: The documented alternative is preserved in footnote [a].
  - risk: “Uprooted” applies a plant image to cities and may sound unusual.
    mitigation: The image is retained because it conveys total removal.
