simplification_decisions:
- pob_phrase: sits enthroned forever
  simplified_phrase: rules as King forever
  preserved_meaning: Yahweh’s royal reign continues forever.
  reasoning_layer_used: Lexical and theological decisions on divine kingship
  rationale: The active wording clearly conveys his continuing royal rule without reducing it to mere status.
- pob_phrase: has established his throne
  simplified_phrase: has set up his throne
  preserved_meaning: Yahweh has firmly established his throne for its judicial purpose.
  reasoning_layer_used: Lexical decision for כּוֹנֵן
  rationale: The common expression avoids suggesting that a physical object was merely moved into place.
- pob_phrase: for judgment
  simplified_phrase: to judge
  preserved_meaning: Yahweh’s throne is the seat of his judicial action.
  reasoning_layer_used: Lexical decision for לַמִּשְׁפָּט
  rationale: The verb form is easier to understand while retaining the legal sense.
translation_notes:
  risk_flags:
  - risk: “Rules as King” does not directly reproduce the Hebrew posture of sitting.
    mitigation: It preserves the ongoing royal-session sense, while the next sentence retains the throne image.
  - risk: “To judge” may sound narrower than the possible sense “for justice.”
    mitigation: The footnote preserves the documented alternative.
