  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Carried out” is more familiar while keeping the judicial action distinct.
- pob_phrase: The wicked
  simplified_phrase: A wicked person
  preserved_meaning: The singular represents a person characterized by wickedness.
  reasoning_layer_used: POB lexical decision for רשע
  rationale: This identifies the person clearly while preserving the representative singular.
- pob_phrase: is snared by the work of his own hands
  simplified_phrase: is trapped by the work of their own hands
  preserved_meaning: The person’s own deeds become the means of their downfall.
