translation:
  language: en
  text: Yahweh is known.[a] He has carried out judgment. A wicked person is trapped by the work of their own hands. Higgaion.[b] Selah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Yahweh has made himself known.” The Hebrew can describe either his being known or his becoming known through this event.
    reason: alternative_reading
  - marker: b
    text: “Higgaion” is an uncertain musical or worship term, perhaps meaning “meditation” or “resounding music.”
    reason: lexical_alternative
