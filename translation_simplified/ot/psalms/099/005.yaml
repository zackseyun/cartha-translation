translation:
  language: en
  text: Give great praise to the LORD our God. Bow down at his footstool.[a] He is holy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be translated “before his footstool.” The footstool may picture the ark or earthly sanctuary, but the verse does not identify it.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Exalt Yahweh our God
  simplified_phrase: Give great praise to the LORD our God
  preserved_meaning: The people are commanded to honor God as supremely great in worship.
  reasoning_layer_used: Lexical decision for רום and the project policy for the divine name
  rationale: The wording explains “exalt” in common English while following the audited LORD convention.
- pob_phrase: and bow down at his footstool
  simplified_phrase: Bow down at his footstool.
  preserved_meaning: The physical act of reverence and the footstool image both remain.
  reasoning_layer_used: Lexical and theological decisions for שׁחה and הֲדֹם
  rationale: A separate sentence makes the command easier to follow without identifying the footstool.
