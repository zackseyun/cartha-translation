translation:
  language: en
  text: Yahweh our God, you answered them. You were forgiving toward them,[a] yet you also took vengeance on their deeds.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also suggest that God bore away their guilt.
