simplification_decisions:
- pob_phrase: O Yahweh our God, you answered them;
  simplified_phrase: Yahweh our God, you answered them.
  preserved_meaning: The prayer addresses God by his personal name and emphasizes that he answered them.
  reasoning_layer_used: Lexical decisions for יְהוָה, אַתָּה, and עֲנִיתָם
  rationale: A separate sentence makes the direct address and answer easier to follow.
- pob_phrase: you were a forgiving God to them
  simplified_phrase: You were forgiving toward them
  preserved_meaning: God related to them with forgiveness.
  reasoning_layer_used: Lexical decisions for נֹשֵׂא and הָיִיתָ לָהֶם
  rationale: The relational wording is recast in natural English without losing forgiveness.
- pob_phrase: yet an avenger of their deeds
  simplified_phrase: yet you also took vengeance on their deeds
  preserved_meaning: God acted against their deeds even while forgiving them.
  reasoning_layer_used: Lexical decisions for וְנֹקֵם and עַל, and the theological decision on forgiveness alongside vengeance
  rationale: The verbal form is clearer while “on their deeds” preserves the source linkage.
translation_notes:
  risk_flags:
  - risk: Modern readers may hear “vengeance” as uncontrolled personal retaliation.
    mitigation: The term is retained to preserve the source image and its tension with forgiveness.
