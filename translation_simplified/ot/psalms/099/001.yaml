translation:
  language: en
  text: Yahweh rules as King. Let the peoples tremble before him.[a] He is enthroned among the cherubim.[b] Let the earth shake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “The peoples tremble before him ... the earth shakes.” The Hebrew may describe what happens rather than call for it to happen.
    reason: alternative_reading
  - marker: b
    text: Cherubim are heavenly beings associated with Yahweh’s royal throne. The Hebrew may picture him enthroned above, between, or upon them.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Yahweh reigns
  simplified_phrase: Yahweh rules as King
  preserved_meaning: Yahweh is proclaimed as the reigning divine King.
  reasoning_layer_used: Lexical decision for מָלָךְ
  rationale: The clearer phrase expresses the same present declaration of kingship.
- pob_phrase: He sits enthroned upon the cherubim
  simplified_phrase: He is enthroned among the cherubim
  preserved_meaning: Yahweh is portrayed as the divine King in relation to the cherubim.
  reasoning_layer_used: Lexical decision and footnote for יֹשֵׁב כְּרוּבִים
  rationale: This keeps the royal image without adding an explicit throne or fixing the exact spatial relation.
- pob_phrase: let the earth quake
  simplified_phrase: Let the earth shake
  preserved_meaning: The whole earth is called to respond to Yahweh’s kingship with violent movement.
  reasoning_layer_used: Lexical decisions for תָּנוּט and הָאָרֶץ
  rationale: “Shake” is common English that retains the physical image and cosmic scope.
interpretive_expansions:
- pob_phrase: let the peoples tremble
  rendering: Let the peoples tremble before him
  claim: The peoples tremble in response to Yahweh’s royal presence and authority.
  evidence:
