  text: But you, God, will bring them down into the pit of destruction.[a] Men who shed blood and deceive others will not live out even half their days.[b] But I will trust in you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be translated “the pit of corruption,” “the grave-pit,” or simply “the pit.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew idiom means that their lives will be cut short.
    reason: lexical_alternative
