translation:
  language: en
  text: Day and night they go around the city on its walls.[a] Trouble and misery are inside the city.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “they surround the city on its walls.” The Hebrew can describe both circling and surrounding.
    reason: lexical_alternative
  - marker: b
    text: “Trouble and misery” can also mean “wickedness and oppression” or “iniquity and trouble.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: they go around her on her walls
  simplified_phrase: they go around the city on its walls
  preserved_meaning: Unspecified forces continually move around on the city’s walls.
  reasoning_layer_used: The lexical decisions preserve the motion of the Hebrew verb and the location on the walls.
  rationale: Naming the city makes the feminine pronouns immediately clear without identifying the unspecified subject.
- pob_phrase: and trouble and misery are within her
  simplified_phrase: Trouble and misery are inside the city
  preserved_meaning: Destructive trouble and suffering exist throughout the city’s interior.
  reasoning_layer_used: The lexical decisions retain the broad senses of both Hebrew nouns and explain the city as the pronoun’s referent.
  rationale: A separate sentence and “inside” make the statement easier to understand.
