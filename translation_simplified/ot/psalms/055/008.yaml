  preserved_meaning: The speaker seeks a place of personal safety and escape.
  reasoning_layer_used: POB lexical decisions for מִפְלָט and לִי
  rationale: “A safe place” clearly marks the destination without narrowing refuge to a physical shelter.
- pob_phrase: from the rushing wind, from the storm
