translation:
  language: en
  text: God, listen closely to my prayer. Do not hide yourself[a] from my plea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, do not ignore my plea.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Give ear, O God, to my prayer
  simplified_phrase: God, listen closely to my prayer
  preserved_meaning: The psalmist asks God to pay careful attention to his prayer.
  reasoning_layer_used: The lexical decision for הַאֲזִינָה allows “Listen” and identifies attentive hearing.
  rationale: “Listen closely” makes the Hebrew idiom immediately clear while retaining its urgency.
- pob_phrase: my supplication
  simplified_phrase: my plea
  preserved_meaning: The prayer is an earnest request for favor or mercy.
  reasoning_layer_used: The lexical decision for מִתְּחִנָּתִי identifies “plea” as clear modern English.
  rationale: “Plea” is more familiar than “supplication” and preserves the earnest tone.
- pob_phrase: and do not hide yourself
  simplified_phrase: Do not hide yourself
  preserved_meaning: The second request remains distinct and keeps the source-language image of God making himself inaccessible.
  reasoning_layer_used: The lexical decision for תִּתְעַלַּם requires preserving the relational metaphor.
  rationale: A new sentence makes the request easier to follow without weakening the image.
translation_notes:
  risk_flags:
  - risk: “Hide yourself” may sound like physical concealment to a modern reader.
    mitigation: The footnote gives the contextual sense “do not ignore my plea” while preserving the Hebrew image.
