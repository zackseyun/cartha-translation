translation:
  language: en
  text: God will hear and bring them low.[a] He is the One who has ruled from his throne since ancient times. Selah. He will do this because they face no reversals in life,[b] and they do not fear God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “answer them”; the Hebrew can bear that sense, but the context favors judgment.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew is difficult and may mean that their circumstances never change or that they suffer no reversals.
    reason: lexical_alternative
