simplification_decisions:
- pob_phrase: bring me to
  simplified_phrase: take me to
  preserved_meaning: Someone must cause the speaker to reach the city.
  reasoning_layer_used: The lexical decision for יֹבִלֵנִי allows either bringing or leading to a destination.
  rationale: “Take me to” is more natural when the speaker asks to be led somewhere.
- pob_phrase: as far as Edom
  simplified_phrase: all the way to Edom
  preserved_meaning: Edom is the full extent and destination of the journey.
  reasoning_layer_used: The lexical decision for עַד marks extent or limit while retaining Edom as the place name.
  rationale: “All the way to” expresses the same extent in familiar English.
