translation:
  language: en
  text: Who will take me to the fortified city?[a] Who will lead me all the way to Edom?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may mean a particular Edomite stronghold, traditionally identified as Sela or Petra, but the Hebrew does not name it.
