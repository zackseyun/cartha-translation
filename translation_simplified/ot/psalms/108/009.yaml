translation:
  language: en
  text: I use Moab as my washbasin.[a] I throw my sandal on Edom.[b] I shout in triumph over Philistia.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The washbasin image presents Moab as humiliated and brought under control.
    reason: simplification_note
  - marker: b
    text: Throwing a sandal likely represents claiming authority over Edom.
    reason: cultural_note
  - marker: c
    text: The Hebrew may describe either a joyful shout or a battle cry.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Moab is my washbasin
  simplified_phrase: I use Moab as my washbasin
  preserved_meaning: Moab is pictured as a lowly washing vessel under the speaker's control.
  reasoning_layer_used: Lexical and theological decisions on סִיר רַחְצִי and domination imagery.
  rationale: The active wording clarifies the metaphor while preserving its concrete image.
- pob_phrase: on Edom I throw my sandal
  simplified_phrase: I throw my sandal on Edom
  preserved_meaning: The concrete sandal gesture toward Edom remains intact.
  reasoning_layer_used: Lexical decisions on אַשְׁלִיךְ נַעֲלִי and עַל.
  rationale: Natural English word order avoids adding a direction not stated in Hebrew.
- pob_phrase: over Philistia I shout in triumph
  simplified_phrase: I shout in triumph over Philistia
  preserved_meaning: The speaker raises a triumphant cry over the region of Philistia.
  reasoning_layer_used: Lexical decisions on אֶתְרוֹעָע, עֲלֵי, and פְלֶשֶׁת.
  rationale: Natural word order remains clear while the note preserves the joyful-or-martial range.
