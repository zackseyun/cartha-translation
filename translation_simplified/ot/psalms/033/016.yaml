translation:
  language: en
  text: A king is not saved by having a large army[a], and a warrior[b] is not rescued by having great strength.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can also mean great might or military resources more broadly.
    reason: lexical_alternative
  - marker: b
    text: Or “a mighty man.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The king is not saved by a great army
  simplified_phrase: A king is not saved by having a large army
  preserved_meaning: A large military force cannot secure a king’s deliverance.
  reasoning_layer_used: The lexical decisions treat the definite singular as a general truth and the preposition as expressing means.
  rationale: “By having” clearly presents the army as an inadequate means of rescue, not the cause of failure.
- pob_phrase: a warrior is not delivered by great strength
  simplified_phrase: a warrior is not rescued by having great strength
  preserved_meaning: A warrior’s physical power cannot secure his rescue.
  reasoning_layer_used: The lexical decisions allow “rescued” for נצל and identify כֹּחַ as physical strength.
  rationale: “Rescued” is common English, while “by having” preserves the instrumental relationship.
translation_notes:
  risk_flags:
  - risk: Changing “The king” to “A king” could seem to overlook the Hebrew article.
    mitigation: The POB rationale says the definite singular states a general truth, which English naturally expresses with “A king.”
