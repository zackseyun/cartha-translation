  preserved_meaning: Everyone throughout the inhabited world is included.
  reasoning_layer_used: lexical decision for כָּל יֹשְׁבֵי תֵבֵל
  rationale: Common wording replaces the formal term “inhabitants” without narrowing the scope.
- pob_phrase: stand in awe of him
