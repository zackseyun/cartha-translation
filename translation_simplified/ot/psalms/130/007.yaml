translation:
  language: en
  text: Israel,[a] wait for Yahweh, because his love never fails, and with him there is more than enough redemption.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “hope in Yahweh.” The Hebrew word includes both hopeful trust and patient waiting.
    reason: lexical_alternative
  - marker: b
    text: Redemption means deliverance that sets people free.
    reason: simplification_note
simplification_decisions:
- pob_phrase: with Yahweh there is steadfast love
  simplified_phrase: his love never fails
  preserved_meaning: Yahweh’s love is loyal and constant.
  reasoning_layer_used: The lexical decision for חֶסֶד preserves affection and loyal constancy.
  rationale: The active wording explains “steadfast” in common English.
- pob_phrase: with him is abundant redemption
  simplified_phrase: with him there is more than enough redemption
  preserved_meaning: Yahweh possesses redemption in great abundance.
  reasoning_layer_used: The lexical decisions preserve abundance, redemption, and the Hebrew “with him” image.
  rationale: “More than enough” makes the abundance immediately clear while retaining “redemption.”
translation_notes:
  risk_flags:
