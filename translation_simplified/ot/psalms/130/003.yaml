  simplified_phrase: who could stand before you?
  preserved_meaning: No one could remain standing when facing God's judgment.
  reasoning_layer_used: POB lexical rationale for יַעֲמֹד
  rationale: “Before you” makes the judgment setting clear while preserving the Hebrew image of standing.
