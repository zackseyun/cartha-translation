translation:
  language: en
  text: I wait expectantly for Yahweh.[a] My soul waits, and what he has said[b] gives me hope.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I have waited for Yahweh; my soul has waited.” The Hebrew may describe either a settled resolve or a present stance.
    reason: lexical_alternative
  - marker: b
    text: Or “his promise.” The Hebrew may mean God’s words generally or imply a promise.
    reason: lexical_alternative
