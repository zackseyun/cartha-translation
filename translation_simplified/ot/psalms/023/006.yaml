translation:
  language: en
  text: Surely goodness and faithful love will pursue me[a] all my life, and I will live[b] in Yahweh’s house for a long time[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “will follow me.” The Hebrew verb more vividly means “pursue,” picturing Yahweh’s goodness and faithful love actively chasing after the writer.
    reason: lexical_alternative
  - marker: b
    text: Or “I will return to Yahweh’s house.” The Hebrew text is traditionally read as “I will live” (or “dwell”), but “I will return” is a longstanding alternative reading.
    reason: alternative_reading
  - marker: c
    text: Or “forever.” The Hebrew literally reads “for length of days,” an idiom for enduring duration.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: steadfast love
  simplified_phrase: faithful love
  preserved_meaning: Yahweh’s loyal and enduring love remains distinct from goodness.
  reasoning_layer_used: POB lexical decision for חֶסֶד and grounding review
  rationale: “Faithful love” expresses loyal love in more familiar English.
- pob_phrase: all the days of my life
  simplified_phrase: all my life
  preserved_meaning: The pursuit continues throughout the writer’s entire life.
  reasoning_layer_used: POB lexical alternatives for כָּל יְמֵי חַיָּי
  rationale: The shorter phrase communicates the same complete span naturally.
- pob_phrase: dwell in the house of Yahweh for length of days
  simplified_phrase: live in Yahweh’s house for a long time
  preserved_meaning: The writer expects enduring residence with Yahweh without making the duration explicitly endless.
  reasoning_layer_used: POB lexical and theological decisions for וְשַׁבְתִּי and לְאֹרֶךְ יָמִים
  rationale: This replaces two formal expressions with ordinary English while preserving the open-ended duration.
translation_notes:
  risk_flags:
  - risk: “For a long time” may sound less poetic than the Hebrew idiom and does not state the possible stronger sense “forever.”
    mitigation: Footnote c preserves both the literal idiom and the enduring alternative.
  - risk: “Faithful love” may be heard as general reliability rather than covenantal loyalty.
    mitigation: The wording retains love and faithfulness together, reflecting the POB rationale without adding commentary.
