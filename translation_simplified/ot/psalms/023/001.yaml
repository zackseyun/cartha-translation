  preserved_meaning: The psalm remains associated with David without deciding whether he wrote it or it was for him.
  reasoning_layer_used: POB theological decision on לְדָוִד
  rationale: The broad heading is retained, and the note explains its genuine ambiguity.
interpretive_expansions:
- pob_phrase: I will not lack
  rendering: I will have everything I need
  claim: The lack in view concerns what the speaker needs, not every possible desire.
  evidence:
