translation:
  language: en
  text: 'A psalm of David[a].


    Yahweh[b] is my shepherd. I will have everything I need.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can mean “by David,” “for David,” or “associated with David.”
    reason: alternative_reading
  - marker: b
    text: Yahweh is the personal name of God, traditionally translated as “the LORD” in English Bibles.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Yahweh is my shepherd; I will not lack.
  simplified_phrase: Yahweh is my shepherd. I will have everything I need.
  preserved_meaning: Yahweh personally cares for the speaker as a shepherd, so the speaker will not be in need.
  reasoning_layer_used: POB lexical decisions for רֹעִי and אֶחְסָר
  rationale: Two short sentences and positive wording make the assurance immediately clear while preserving the shepherd image.
- pob_phrase: A psalm of David
