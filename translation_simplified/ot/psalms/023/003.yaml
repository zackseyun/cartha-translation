translation:
  language: en
  text: He restores my soul[a]; he leads me along right paths[b] for the sake of his name[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'He refreshes my life.' The Hebrew word translated 'soul' refers to the whole person—their life, strength, and entire being—rather than just an immaterial part.
    reason: simplification_note
  - marker: b
    text: Or 'paths of righteousness.' This refers to paths that are morally right and true to God's character.
    reason: simplification_note
  - marker: c
    text: '''For the sake of his name'' means to show the goodness of his own character and reputation.'
    reason: simplification_note
