translation:
  language: en
  text: He restores my soul[a]; he leads me along right paths[b] for the sake of his name[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “He refreshes my life.” The Hebrew word translated “soul” refers to the whole person, not only an immaterial part.
    reason: simplification_note
  - marker: b
    text: Or “paths of righteousness.” This means ways that are morally right.
    reason: lexical_alternative
  - marker: c
    text: “For the sake of his name” means for the honor of his own character and reputation.
    reason: cultural_note
simplification_decisions:
- pob_phrase: in paths of righteousness
  simplified_phrase: along right paths
  preserved_meaning: God guides the psalmist in morally right ways.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The documented alternative “right paths” is clearer, while the note preserves the ethical force of righteousness.
- pob_phrase: The Hebrew uses 'my soul' (nephesh), which can mean the whole self or life, not only the immaterial aspect of a person.
  simplified_phrase: The Hebrew word translated “soul” refers to the whole person, not only an immaterial part.
  preserved_meaning: Soul here includes the psalmist’s whole life and self.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The shorter note prevents a narrowly immaterial reading without academic terminology.
- pob_phrase: for the honor of his own character and reputation
  simplified_phrase: for the honor of his own character and reputation
  preserved_meaning: God acts out of concern for the honor of his name.
  reasoning_layer_used: POB cultural note and lexical decision
  rationale: The note explains the biblical name idiom without shifting its emphasis to displaying goodness.
translation_notes:
  risk_flags:
  - risk: “Right paths” may sound merely practical rather than moral.
    mitigation: Footnote b explicitly identifies them as morally right ways.
  - risk: Modern readers may understand “soul” as only an immaterial part.
    mitigation: Footnote a explains that it refers to the whole person.
