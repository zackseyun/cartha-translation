retained_terms:
- term: soul
  reason: Retained because replacing it with 'strength' or 'life' loses the iconic poetic identity of the verse; the term is clarified contextually in the footnotes instead.
- term: for the sake of his name
  reason: Retained to preserve the theological focus on God's character and covenant faithfulness as the ground of his guidance.
translation_notes:
  source_alignment_notes: Maintains precise alignment with the Hebrew verbs for restoring/returning (שוב) and leading (נחה), preserving the active role of the shepherd in both actions.
  readability_notes:
  - Using 'along right paths' flows more naturally in modern English than 'in paths of righteousness' while keeping the parallel structure of the Hebrew poetic lines.
  compression_notes:
