simplification_decisions:
- pob_phrase: will fulfill his purpose for me
  simplified_phrase: will accomplish his purpose for me
  preserved_meaning: Yahweh will bring his intention for the psalmist to completion.
  reasoning_layer_used: Lexical and theological decisions on יִגְמֹר בַּעֲדִי.
  rationale: “Accomplish” expresses the completing action in familiar English while the footnote preserves the idiom’s ambiguity.
- pob_phrase: your steadfast love endures forever
  simplified_phrase: your faithful love never ends
  preserved_meaning: Yahweh’s loyal covenant love is permanent.
  reasoning_layer_used: Lexical decisions on חַסְדְּךָ and לְעוֹלָם.
  rationale: “Faithful love never ends” clearly conveys both loyalty and everlasting duration.
- pob_phrase: Do not forsake the work of your hands
  simplified_phrase: Do not abandon the work of your hands
  preserved_meaning: The psalmist asks Yahweh not to leave what he has made or done.
  reasoning_layer_used: Lexical and theological decisions on מַעֲשֵׂי יָדֶיךָ and אַל תֶּרֶף.
  rationale: “Abandon” is common English, while “the work of your hands” preserves the image and its broad referent.
