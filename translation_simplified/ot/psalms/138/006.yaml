translation:
  language: en
  text: For Yahweh is exalted, yet he sees the lowly. But he knows the proud from far away.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean that Yahweh recognizes the proud from far away or keeps them at a distance.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Yahweh is high
  simplified_phrase: Yahweh is exalted
  preserved_meaning: Yahweh’s lofty status remains the basis of the contrast with the lowly.
  reasoning_layer_used: POB lexical decision for רָם
  rationale: “Exalted” makes the vertical image’s meaning clearer in ordinary English.
- pob_phrase: the haughty
  simplified_phrase: the proud
  preserved_meaning: The morally negative contrast between pride and lowliness remains intact.
  reasoning_layer_used: POB lexical decision for גָבֹהַּ
  rationale: “Proud” is more familiar than “haughty” without weakening the contrast.
- pob_phrase: from afar
  simplified_phrase: from far away
  preserved_meaning: The Hebrew image of distance in Yahweh’s knowledge of the proud is retained.
  reasoning_layer_used: POB lexical and theological decisions for מִמֶּרְחָק and יְיֵדָע
  rationale: The common phrase is easier to understand while preserving the relational ambiguity.
translation_notes:
  risk_flags:
  - risk: “Exalted” explains the image more directly than the POB’s “high.”
    mitigation: The wording still conveys Yahweh’s lofty status and preserves the contrast with the lowly.
  - risk: Readers may take “knows” as intimate knowledge rather than distant recognition.
    mitigation: “From far away” and the footnote preserve the possible relational distance without asserting rejection.
