translation:
  language: en
  text: For Yahweh is exalted, yet he sees those who are lowly. But he knows proud people from far away.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “he recognizes proud people from far away.” This may suggest relational distance, but the verse does not explicitly say that Yahweh rejects them.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Yahweh is high
  simplified_phrase: Yahweh is exalted
  preserved_meaning: Yahweh’s elevated status and the Hebrew vertical image remain clear.
  reasoning_layer_used: POB lexical decision for רָם
  rationale: “Exalted” makes the figurative meaning of “high” easier to grasp.
- pob_phrase: he sees the lowly
  simplified_phrase: he sees those who are lowly
  preserved_meaning: Yahweh gives attention to people who are humble or of low status.
  reasoning_layer_used: POB lexical decisions for שָׁפָל and יִרְאֶה
  rationale: Adding “those who are” makes the description read naturally without narrowing its breadth.
- pob_phrase: the haughty he knows from afar
  simplified_phrase: he knows proud people from far away
  preserved_meaning: Yahweh knows the proud while the Hebrew image of distance remains unresolved.
  reasoning_layer_used: POB lexical and theological decisions for גָבֹהַּ, מִמֶּרְחָק, and יְיֵדָע
  rationale: Ordinary word order and common vocabulary clarify the clause without turning distance into explicit rejection.
translation_notes:
  risk_flags:
  - risk: “Exalted” may make the vertical image less concrete than “high.”
    mitigation: The word still conveys elevated status and preserves the contrast with the lowly.
  - risk: Modern readers may take “knows” as intimate approval despite “from far away.”
    mitigation: The footnote preserves the possible sense of recognition and relational distance without over-resolving it.
