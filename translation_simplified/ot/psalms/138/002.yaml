  preserved_meaning: The worshiper physically bows in the direction of the temple.
  reasoning_layer_used: Lexical decisions for אֶשְׁתַּחֲוֶה and אֶל.
  rationale: “Facing” expresses the direction naturally without implying entry into the temple.
- pob_phrase: and give thanks to your name
  simplified_phrase: I give thanks to you
  preserved_meaning: The worshiper thanks God for his revealed character and actions.
  reasoning_layer_used: Lexical rationale for וְאוֹדֶה אֶת שִׁמְךָ and the direct-address context.
  rationale: Directly thanking God avoids an opaque Hebrew-style expression.
- pob_phrase: for you have exalted your word above all your name
  simplified_phrase: because you have exalted your word in a way that is above all your name
  preserved_meaning: God has exalted his word in relation to his name, though the precise relationship is uncertain.
  reasoning_layer_used: POB theological decision on the difficult Masoretic clause.
  rationale: “In a way” signals uncertainty without selecting a smoother alternative reading.
