translation:
  language: en
  text: I bow down facing your holy temple. I give thanks to you for your steadfast love and faithfulness, because you have exalted your word in a way that is above all your name.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “because you have exalted your promise above everything else.” The final Hebrew words are difficult. They may also mean, “you have exalted your name and your word above everything.”
    reason: alternative_reading
