  - marker: b
    text: Or “you revive me” or “you keep me alive.” The Hebrew verb can denote reviving or preserving life.
    reason: lexical_alternative
  - marker: c
    text: Literally, “against the anger of my enemies.” The Hebrew word for anger also means “nose,” but “anger” is its ordinary idiomatic sense here.
    reason: cultural_note
