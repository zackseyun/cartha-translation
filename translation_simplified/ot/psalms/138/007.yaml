translation:
  language: en
  text: If[a] I walk with trouble all around me, you keep me alive.[b] You reach out your hand against my enemies’ anger, and your right hand saves me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Though I walk.” The Hebrew can be conditional or concessive here.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew can also mean “you revive me.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: walk in the midst of trouble
  simplified_phrase: walk with trouble all around me
  preserved_meaning: The speaker is pictured within surrounding trouble while continuing to walk.
  reasoning_layer_used: Lexical decision for בְּקֶרֶב and the source-language spatial image
  rationale: This makes the surrounding danger immediately clear while preserving the walking image.
- pob_phrase: you preserve my life
  simplified_phrase: you keep me alive
  preserved_meaning: God protects the psalmist’s life during present danger.
  reasoning_layer_used: Lexical and theological decisions for תְּחַיֵּנִי
  rationale: This uses common English without turning the life-giving action into spiritual revival.
- pob_phrase: you stretch out your hand
  simplified_phrase: You reach out your hand
  preserved_meaning: God actively intervenes against the enemies’ anger.
  reasoning_layer_used: Lexical decision for תִּשְׁלַח יָדֶךָ
  rationale: “Reach out” is more natural for common readers and retains the bodily image of divine action.
translation_notes:
  risk_flags:
  - risk: “If” may sound purely conditional although the Hebrew may also mean “though.”
    mitigation: Footnote a preserves the concessive alternative.
  - risk: “Reach out your hand” could suggest help rather than opposition when read alone.
    mitigation: The words “against my enemies’ anger” keep the hostile action as its target.
