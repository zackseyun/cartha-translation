  yaml_path: translation/ot/psalms/138/007.yaml
  text: If I walk in the midst of trouble[a], you preserve my life[b]; you stretch out your hand against the anger of my enemies[c], and your right hand saves me.
  footnotes:
  - marker: a
    text: Or “Though I walk in the midst of trouble.” The Hebrew אִם can have conditional or concessive force in context.
