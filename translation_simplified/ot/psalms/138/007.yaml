translation:
  language: en
  text: If[a] I walk through trouble, you keep me alive[b]. You reach out your hand against my enemies’ rage, and your right hand saves me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Though I walk.” The Hebrew can express either condition or concession here.
    reason: lexical_alternative
  - marker: b
    text: Or “you revive me” or “you preserve my life.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: walk in the midst of trouble
  simplified_phrase: walk through trouble
  preserved_meaning: The speaker moves while surrounded by trouble, without implying that he reaches its far side.
  reasoning_layer_used: POB lexical decisions for אֵלֵךְ and בְּקֶרֶב
  rationale: “Through trouble” expresses being amid trouble in natural English without adding a completed escape.
- pob_phrase: you preserve my life
  simplified_phrase: you keep me alive
  preserved_meaning: God sustains the speaker’s life during present danger.
  reasoning_layer_used: POB lexical and theological decisions for תְּחַיֵּנִי
  rationale: The simpler phrase retains preservation rather than imposing spiritual revival.
- pob_phrase: stretch out your hand against the anger of my enemies
  simplified_phrase: reach out your hand against my enemies’ rage
  preserved_meaning: God actively intervenes against the enemies’ hostile fury.
  reasoning_layer_used: POB lexical and theological decisions for תִּשְׁלַח יָדֶךָ and עַל אַף אֹיְבַי
  rationale: The wording keeps both the hand image and the force of the anger idiom.
translation_notes:
  risk_flags:
  - risk: Readers may understand “if” only as uncertainty rather than as a concession close to “though.”
    mitigation: Footnote a preserves the documented concessive alternative.
  - risk: “Keep me alive” foregrounds preservation over the possible sense of revival.
    mitigation: Footnote b retains the broader lexical possibilities while following the POB context.
