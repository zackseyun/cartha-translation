translation:
  language: en
  text: Their line[a] reaches across the whole earth, and their words reach the ends of the world. In the heavens, he has set up a tent for the sun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Their sound” or “Their voice.” The Hebrew text reads “their line,” but some ancient versions and many interpreters understand it as sound or voice here.
    reason: alternative_reading
