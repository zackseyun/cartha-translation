translation:
  language: en
  text: Also keep me, your servant, from proud, deliberate sins.[a] Do not let those sins rule over me. Then I will live with integrity and be free from the guilt of grave rebellion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “arrogant people” or “proud people.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: keep your servant back from presumptuous sins
  simplified_phrase: keep me, your servant, from proud, deliberate sins
  preserved_meaning: The speaker asks God to restrain him from sins marked by willfulness and pride.
  reasoning_layer_used: POB lexical and theological decisions on מִזֵּדִים and חֲשֹׂךְ
  rationale: The rewrite explains “presumptuous” in common English while retaining its pride and willfulness.
- pob_phrase: Then I will be blameless
  simplified_phrase: Then I will live with integrity
  preserved_meaning: Divine restraint leads to moral wholeness rather than absolute sinlessness.
  reasoning_layer_used: POB lexical and theological decision on אֵיתָם
  rationale: “Live with integrity” makes the intended sense of “blameless” clear without suggesting perfection.
- pob_phrase: cleared of great transgression
  simplified_phrase: free from the guilt of grave rebellion
  preserved_meaning: The speaker will be cleared of culpability for serious rebellion.
  reasoning_layer_used: POB lexical decisions on וְנִקֵּיתִי and מִפֶּשַׁע רָב
  rationale: The wording explains “cleared” as freedom from guilt and renders “transgression” as serious rebellion.
interpretive_expansions:
- pob_phrase: presumptuous sins
  rendering: proud, deliberate sins
  claim: The sins are committed with both willfulness and arrogant self-assertion.
  evidence:
  - The POB lexical rationale identifies both pride and willfulness in מִזֵּדִים.
  - The surrounding verses focus on errors, hidden faults, and moral restraint.
  confidence: high
  alternatives_preserved:
  - arrogant people
  - proud people
translation_notes:
  risk_flags:
  - risk: The Hebrew may refer to arrogant people rather than presumptuous acts.
    mitigation: Footnote a preserves this documented alternative while the main text follows the POB contextual decision.
  - risk: “Live with integrity” may sound less forensic than “blameless.”
    mitigation: The phrase preserves the POB’s stated sense of moral wholeness without implying sinless perfection.
