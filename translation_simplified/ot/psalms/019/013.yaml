translation:
  language: en
  text: Also keep me, your servant, from proud and deliberate sins.[a] Do not let them rule over me. Then I will be blameless[b] and free from the guilt of great transgression.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may instead mean “arrogant people,” but the surrounding verses are about sins and faults.
    reason: alternative_reading
  - marker: b
    text: Here “blameless” means living with integrity, not being completely sinless.
    reason: simplification_note
simplification_decisions:
- pob_phrase: keep your servant back from presumptuous sins
  simplified_phrase: keep me, your servant, from proud and deliberate sins
  preserved_meaning: The speaker asks God to restrain him from sins marked by pride and conscious defiance.
  reasoning_layer_used: lexical and theological decisions on מִזֵּדִים and חֲשֹׂךְ
  rationale: This unpacks “presumptuous” while retaining both its pride and willfulness.
- pob_phrase: do not let them rule over me
  simplified_phrase: Do not let them rule over me.
  preserved_meaning: Sin is pictured as a power that can dominate a person.
  reasoning_layer_used: lexical decision on אַל יִמְשְׁלוּ בִי
  rationale: A separate sentence makes the plea easier to follow without weakening the rule metaphor.
- pob_phrase: be cleared from great transgression
  simplified_phrase: free from the guilt of great transgression
  preserved_meaning: The speaker will not bear culpability for grave rebellion against God.
  reasoning_layer_used: lexical decisions on וְנִקֵּיתִי and מִפֶּשַׁע רָב
  rationale: “Free from the guilt” states the legal-moral sense of “cleared” in natural English.
interpretive_expansions:
- pob_phrase: presumptuous sins
  rendering: proud and deliberate sins
  claim: These sins involve both arrogance and willful action.
  evidence:
  - The lexical rationale identifies pride or insolence as part of the Hebrew nuance.
  - “Willful sins” is listed as a viable lexical alternative.
  confidence: high
  alternatives_preserved:
  - arrogant people
- pob_phrase: be cleared
  rendering: free from the guilt
  claim: Being cleared means being free from culpability for the transgression.
  evidence:
  - The lexical rationale defines the verb as being free from guilt or cleared.
  confidence: high
  alternatives_preserved:
  - be innocent
  - be clean
translation_notes:
  risk_flags:
  - risk: The Hebrew may refer to arrogant people rather than presumptuous sins.
    mitigation: The main text follows the POB contextual decision, while footnote a preserves the alternative.
  - risk: “Blameless” could be mistaken for absolute sinlessness.
    mitigation: Footnote b defines it as integrity in line with the POB theological decision.
