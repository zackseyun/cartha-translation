simplification_decisions:
- pob_phrase: discern his errors
  simplified_phrase: recognize their own errors
  preserved_meaning: A person cannot fully identify their own morally significant errors.
  reasoning_layer_used: lexical decision and rhetorical context
  rationale: “Recognize” is common English, while “own errors” makes the reflexive sense clear without adding totality.
- pob_phrase: hidden faults
  simplified_phrase: faults that remain hidden
  preserved_meaning: The faults are concealed without specifying whether they are hidden from the speaker or others.
  reasoning_layer_used: lexical and theological decisions
  rationale: The recast phrase reads naturally while preserving the documented ambiguity.
