translation:
  language: en
  text: Yahweh redeems[a] the lives[b] of those who serve him. No one who takes refuge in him will be held guilty.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “redeems” means rescues with the sense of ransoming.
    reason: simplification_note
  - marker: b
    text: Or “souls”; the Hebrew refers to each person’s life or whole living self.
    reason: lexical_alternative
  - marker: c
    text: Or “will incur guilt” or “will be condemned.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the life of his servants
  simplified_phrase: the lives of those who serve him
  preserved_meaning: Yahweh rescues the life of each person who serves him.
  reasoning_layer_used: Lexical decision for נֶפֶשׁ and עֲבָדָיו
  rationale: The plural wording and verbal phrase sound natural while retaining “life” and faithful service.
- pob_phrase: and none of those who take refuge in him
  simplified_phrase: No one who takes refuge in him
  preserved_meaning: The promise applies to every person who seeks shelter in Yahweh.
  reasoning_layer_used: Lexical decision for הַחֹסִים בּוֹ
  rationale: A new sentence reduces complexity without weakening the refuge image.
- pob_phrase: will be held guilty
  simplified_phrase: will be held guilty
  preserved_meaning: The judicial sense remains broad and does not force a claim about final condemnation.
  reasoning_layer_used: Theological decision for יֶאְשְׁמוּ
  rationale: This phrase is retained because simpler alternatives could erase or overstate its forensic force.
