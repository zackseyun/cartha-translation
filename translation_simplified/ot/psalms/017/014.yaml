translation:
  language: en
  text: By your hand,[a] O Yahweh, save me from these men—from men of this world whose share is in this life. You fill their bellies with treasure you have stored up. They are satisfied with sons,[b] and they leave what remains of their abundance to their children.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The compressed Hebrew may also be read, “from men, by your hand” or “from men of your hand.”
    reason: alternative_reading
  - marker: b
    text: Hebrew “sons,” likely emphasizing many male descendants as a sign of prosperity.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew more specifically means “their little children.”
    reason: lexical_alternative
