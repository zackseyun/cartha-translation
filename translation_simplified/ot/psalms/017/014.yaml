translation:
  language: en
  text: Yahweh, rescue me by your hand from men—from men of this world, whose share is in this life.[a] You fill their bellies with your stored-up treasure. They are satisfied with sons,[b] and they leave their abundance to their children.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is compressed and may also mean “rescue me from men of your hand.”
    reason: alternative_reading
  - marker: b
    text: Or “their sons are satisfied.”
    reason: alternative_reading
  - marker: c
    text: The Hebrew more specifically means “their little children.”
    reason: lexical_alternative
