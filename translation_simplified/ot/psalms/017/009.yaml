translation:
  language: en
  text: from wicked people who bring ruin on me, from my deadly enemies[a] closing in around me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “from my enemies who surround me and seek my life.” The Hebrew explicitly refers to “life” or “soul.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the wicked
  simplified_phrase: wicked people
  preserved_meaning: The phrase still identifies people who are morally guilty.
  reasoning_layer_used: POB lexical decision for רְשָׁעִים
  rationale: Adding “people” makes the personal referent immediately clear without adding gender.
- pob_phrase: who devastate me
  simplified_phrase: who bring ruin on me
  preserved_meaning: The wording retains the severe harm and ruin expressed by the Hebrew verb.
  reasoning_layer_used: POB lexical decision for שַׁדּוּנִי
  rationale: “Bring ruin on me” is more direct in common English while avoiding total destruction.
- pob_phrase: who surround me
  simplified_phrase: closing in around me
  preserved_meaning: The enemies encircle the psalmist in a threatening way.
  reasoning_layer_used: POB lexical decision for יַקִּיפוּ עָלָי
  rationale: “Closing in around me” keeps the vivid image and makes the danger easier to picture.
translation_notes:
  risk_flags:
  - risk: “Deadly enemies” may be heard only as describing dangerous enemies rather than enemies seeking the psalmist’s life.
    mitigation: The footnote preserves the explicit life-directed alternative in the Hebrew.
