simplification_decisions:
- pob_phrase: As for me, in righteousness I will behold your face
  simplified_phrase: But I will see your face in righteousness
  preserved_meaning: The psalmist expects to see God under the condition of righteousness, whose precise basis remains unstated.
  reasoning_layer_used: The lexical rationale preserves both the concrete image “your face” and the ambiguity surrounding “in righteousness.”
  rationale: The new order is natural English, while “see” replaces the less familiar “behold.”
- pob_phrase: your face; when I awake
  simplified_phrase: your face. When I awake
  preserved_meaning: The awakening remains the time when the psalmist will be satisfied.
  reasoning_layer_used: The lexical decision identifies “when I awake” as a temporal phrase.
  rationale: Two sentences make the poetic movement easier to follow without changing the relationship.
- pob_phrase: I will be satisfied with your likeness
  simplified_phrase: I will be satisfied with your likeness
  preserved_meaning: The sight of God’s likeness will satisfy the psalmist.
  reasoning_layer_used: The lexical decisions retain both “satisfied” and the concrete but not fully physical term “likeness.”
  rationale: The wording is already clear and preserves the source image without added explanation.
translation_notes:
  risk_flags:
  - risk: “In righteousness” remains abstract for some readers.
    mitigation: Retaining it avoids choosing among integrity, divine vindication, and righteous status.
  - risk: Readers may understand awakening only as ordinary sleep.
    mitigation: Footnote a preserves the possible final-vindication or resurrection reading.
