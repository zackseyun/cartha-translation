translation:
  language: en
  text: But as for me, in righteousness I will gaze at your face. When I awake,[a] your likeness will fully satisfy me.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may mean waking from ordinary sleep or awakening in final vindication or resurrection.
    reason: alternative_reading
  - marker: b
    text: Or “your form” or “your image.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I will behold your face
  simplified_phrase: I will gaze at your face
  preserved_meaning: The psalmist expects to see God with attentive, contemplative perception.
  reasoning_layer_used: Lexical decision for אֶחֱזֶה and פָנֶיךָ
  rationale: “Gaze at” is clearer than “behold” while retaining deliberate sight and the concrete image of God’s face.
- pob_phrase: I will be satisfied with your likeness
  simplified_phrase: your likeness will fully satisfy me
  preserved_meaning: God’s likeness is the source of the psalmist’s complete satisfaction.
  reasoning_layer_used: Lexical decisions for אֶשְׂבְּעָה and תְּמוּנָתֶךָ
  rationale: The recast clause reads naturally while preserving satisfaction and the concrete word “likeness.”
translation_notes:
  risk_flags:
  - risk: Modern readers may find “in righteousness” open to more than one interpretation.
    mitigation: The wording is retained because the POB deliberately leaves the righteousness as the psalmist’s integrity, God’s vindication, or another righteous condition.
  - risk: Readers may assume that “awake” refers only to rising from sleep.
    mitigation: Footnote a preserves both ordinary waking and final vindication or resurrection as possible readings.
