  text: They may speak curses[a], but you will bless. They rise up[b], but disgrace comes on them. But I, your servant, will rejoice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Let them curse, but you bless.”
    reason: alternative_reading
  - marker: b
    text: “Rise up” may suggest hostile action, but the Hebrew does not explicitly say that they attack.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: They may curse
  simplified_phrase: They may speak curses
  preserved_meaning: The opponents may utter curses, but they cannot overcome God’s blessing.
  reasoning_layer_used: POB lexical decision for יְקַֽלְלוּ
  rationale: “Speak curses” clarifies the action while retaining its concessive force.
- pob_phrase: are put to shame
  simplified_phrase: disgrace comes on them
  preserved_meaning: The opponents suffer public disgrace rather than merely feeling ashamed.
  reasoning_layer_used: POB lexical decision for וַיֵּבֹשׁוּ
  rationale: This ordinary phrasing preserves disgrace as the result.
- pob_phrase: but your servant will rejoice
  simplified_phrase: But I, your servant, will rejoice
  preserved_meaning: The praying speaker humbly identifies himself as God’s servant in contrast with his opponents.
  reasoning_layer_used: POB theological decision on the referent of “your servant”
  rationale: The wording clarifies the speaker’s identity while preserving the adversative contrast and servant designation.
