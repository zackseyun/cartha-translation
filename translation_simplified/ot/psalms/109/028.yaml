simplification_decisions:
- pob_phrase: They rise up and are put to shame
  simplified_phrase: They rise up, but they are disgraced
  preserved_meaning: The opponents rise against the speaker and suffer public shame, without specifying their action.
  reasoning_layer_used: POB lexical decisions for קָמוּ and וַיֵּבֹשׁוּ
  rationale: “Disgraced” states the public result plainly while preserving the unspecific image of rising up.
- pob_phrase: but your servant will rejoice
  simplified_phrase: but your servant will rejoice
  preserved_meaning: The psalmist humbly identifies himself as God's servant and anticipates joy in contrast to his opponents' disgrace.
  reasoning_layer_used: POB lexical and theological decisions for עַבְדְּךָ and יִשְׂמָח
  rationale: Retaining “but” and “will rejoice” preserves both the contrast and the future result.
translation_notes:
  risk_flags:
  - risk: “Rise up” may not clearly convey the opponents' likely hostility.
    mitigation: The wording preserves the source's deliberate lack of detail rather than turning the action into an explicit attack.
