translation:
  language: en
  text: May Yahweh remember the guilt[a][b] of his fathers, and may he not wipe away his mother’s sin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can refer to wrongdoing, guilt, or the liability caused by wrongdoing.
    reason: lexical_alternative
  - marker: b
    text: “Fathers” here may mean his forefathers or male ancestors.
    reason: lexical_alternative
simplification_decisions:
