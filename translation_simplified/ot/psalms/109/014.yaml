simplification_decisions:
- pob_phrase: May the guilt of his fathers be remembered before Yahweh
  simplified_phrase: May Yahweh remember the guilt of his fathers
  preserved_meaning: The guilt of his male forebears is brought before Yahweh for remembrance.
  reasoning_layer_used: lexical and theological decisions
  rationale: Active English makes the wish easier to understand while keeping Yahweh as the one before whom the guilt is remembered.
- pob_phrase: may the sin of his mother not be blotted out
  simplified_phrase: may his mother’s sin never be wiped away
  preserved_meaning: The plea is that her sin not be erased from account.
  reasoning_layer_used: lexical decision for אַל תִּמָּח
  rationale: “Wiped away” is clearer modern English and preserves the Hebrew erasure image.
