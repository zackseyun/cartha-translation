  simplified_phrase: Yahweh remember
  preserved_meaning: The wish asks that their guilt remain known and accountable before Yahweh.
  reasoning_layer_used: POB lexical decision for יִזָּכֵר and theological decision for יְהוָה
  rationale: The active wording is easier to understand while keeping Yahweh and the force of the wish.
- pob_phrase: not be blotted out
  simplified_phrase: not wipe away
  preserved_meaning: The mother’s sin is not to be erased or removed from account.
  reasoning_layer_used: POB lexical decision for אַל תִּמָּח
  rationale: “Wipe away” preserves the erasure image in more familiar English.
