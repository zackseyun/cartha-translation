translation:
  language: en
  text: May Yahweh remember the guilt of his fathers[a], and may his mother’s sin never be wiped away.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “forefathers”; the Hebrew refers to his male ancestors.
