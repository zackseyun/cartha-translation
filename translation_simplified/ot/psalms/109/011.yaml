  text: May a creditor seize everything he owns, and may strangers plunder everything he worked for.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: seize all that belongs to him
  simplified_phrase: seize everything he owns
  preserved_meaning: The creditor aggressively claims all his possessions.
  reasoning_layer_used: Lexical decisions for יְנַקֵּשׁ and לְכָל אֲשֶׁר לוֹ
  rationale: This keeps the force of “seize” while stating the total loss plainly.
- pob_phrase: plunder the fruit of his labor
  simplified_phrase: plunder everything he worked for
  preserved_meaning: Strangers forcibly take all the gains produced by his work.
  reasoning_layer_used: Lexical decisions for וְיָבֹזּוּ, זָרִים, and יְגִיעוֹ
  rationale: This retains the predatory force of “plunder” and clarifies what his labor produced.
- pob_phrase: May ... and may ...
  simplified_phrase: May ... and may ...
  preserved_meaning: Both clauses express wishes or curses rather than predictions.
  reasoning_layer_used: Theological decision on imprecatory jussive force
  rationale: Repeating “may” preserves the verse’s prayer-like curse.
translation_notes:
  risk_flags:
  - risk: “Everything he worked for” may suggest his goals as well as his material gains.
    mitigation: The verbs “seize” and “plunder” and the parallel reference to possessions keep the material sense clear.
