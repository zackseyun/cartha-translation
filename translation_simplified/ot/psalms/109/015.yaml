simplification_decisions:
- pob_phrase: be before Yahweh continually
  simplified_phrase: always remain in Yahweh’s sight
  preserved_meaning: They remain continually present before Yahweh in the relational and judicial sense.
  reasoning_layer_used: Lexical decisions for נֶגֶד and תָּמִיד
  rationale: This wording makes their ongoing presence before Yahweh immediately clear.
- pob_phrase: cut off their memory
  simplified_phrase: erase all memory of them
  preserved_meaning: The prayer asks Yahweh to end all remembrance of these people.
  reasoning_layer_used: Lexical decisions for וְיַכְרֵת and זִכְרָם, with Psalm 109:13 context
  rationale: This avoids suggesting that their own memories are being erased.
interpretive_expansions:
- pob_phrase: before Yahweh
  rendering: in Yahweh’s sight
  claim: They remain present before Yahweh, not merely positioned physically in front of him.
