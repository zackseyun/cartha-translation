  simplified_phrase: Let no one ... Let no one
  preserved_meaning: Both clauses remain direct imprecatory petitions rather than predictions.
  reasoning_layer_used: Theological decision on the negative jussive
  rationale: Two short commands preserve the force while making the structure easier to follow.
