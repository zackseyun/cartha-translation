translation:
  language: en
  text: Yahweh, do not let me be disgraced, because I call on you. Let the wicked be disgraced; let them be silent in Sheol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheol is the realm of the dead, not necessarily hell. The Hebrew may also mean “let them be still in Sheol” or “let them go down to Sheol in silence.”
    reason: lexical_alternative
