translation:
  language: en
  text: Yahweh, I call on you. Do not let me be disgraced. Let the wicked be disgraced; let them be silent in Sheol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheol is the realm of the dead. The Hebrew may also be translated, “let them go silently to Sheol.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: O Yahweh, let me not be put to shame, for I call on you
  simplified_phrase: Yahweh, I call on you. Do not let me be disgraced.
  preserved_meaning: The psalmist appeals to Yahweh and asks not to suffer public shame.
  reasoning_layer_used: POB lexical decisions for Yahweh, the negative prayer, shame, and calling on God
  rationale: Reordering and splitting the plea makes its reason clear while preserving its prayerful force.
- pob_phrase: let the wicked be put to shame
  simplified_phrase: Let the wicked be disgraced
  preserved_meaning: The prayer asks that the wicked, rather than the speaker, suffer shame.
  reasoning_layer_used: POB lexical decision for יֵבֹשׁוּ and the verse’s lexical parallel
  rationale: “Be disgraced” is common English and preserves the repeated contrast with the speaker.
- pob_phrase: let them be silent in Sheol
  simplified_phrase: let them be silent in Sheol
  preserved_meaning: The wicked are pictured as reduced to silence in the realm of the dead.
  reasoning_layer_used: POB lexical and theological decisions for יִדְּמוּ and שְׁאוֹל
  rationale: The source image and the term “Sheol” remain because replacing them would narrow the meaning.
translation_notes:
  risk_flags:
  - risk: Many readers will not know what Sheol means.
    mitigation: The footnote identifies it as the realm of the dead without equating it with hell.
  - risk: The Hebrew can connect silence with either being in Sheol or going to Sheol.
    mitigation: The main text follows POB, while the directional reading remains in the footnote.
