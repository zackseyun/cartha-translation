  rationale: Removing “O” makes the address natural in modern English without weakening it.
- pob_phrase: let me not be put to shame
  simplified_phrase: do not let me be disgraced
  preserved_meaning: The speaker asks God to protect him from shame and dishonor.
  reasoning_layer_used: Lexical decision for אֵבוֹשָׁה
