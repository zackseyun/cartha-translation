translation:
  language: en
  text: Be gracious to me, Yahweh, because I am in distress. My eye is failing from grief; my soul and my belly[a] are wasting away too.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Belly” can also mean the inward parts of the body.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: for I am in distress
  simplified_phrase: because I am in distress
  preserved_meaning: The speaker’s distress is the reason for his plea.
  reasoning_layer_used: Lexical decision for כִּי
  rationale: “Because” makes the connection immediately clear in modern English.
- pob_phrase: my eye has wasted away with grief
  simplified_phrase: My eye is failing from grief
  preserved_meaning: Grief is severely weakening the speaker’s eye or sight.
  reasoning_layer_used: Lexical decisions for עָשְׁשָׁה, בְכַעַס, and עֵינִי
  rationale: “Is failing” is a documented alternative that naturally preserves the severe decline.
- pob_phrase: my soul and my belly as well
  simplified_phrase: my soul and my belly are wasting away too
  preserved_meaning: The wasting extends beyond the eye to the inner self and bodily inward parts.
  reasoning_layer_used: Lexical and theological decisions for נַפְשִׁי and וּבִטְנִי
  rationale: Supplying the implied verb clarifies the poetic parallel without adding emphasis.
translation_notes:
  risk_flags:
  - risk: The singular “my eye” may sound unusual to modern readers.
    mitigation: It is retained because the Hebrew is singular and the poetic image remains understandable.
  - risk: “Belly” may be understood too narrowly as digestion.
    mitigation: The footnote preserves its broader possible sense of inward parts.
