  text: Be gracious to me, Yahweh, because I am in distress. Grief has made my eye waste away[a]; my soul[b] and my belly[c] have wasted away too.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean, “My eye has grown dim from vexation” or “My eye is failing with grief.”
