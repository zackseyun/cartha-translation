translation:
  language: en
  text: May lying lips be silenced! They speak against the righteous with brazen disrespect, pride, and contempt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “against a righteous person”; the Hebrew is singular and may refer to one person or to righteous people generally.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Let lying lips be silenced—those that speak
  simplified_phrase: May lying lips be silenced! They speak
  preserved_meaning: The wording remains a wish for deceitful speech to be stopped and preserves the image of lying lips.
  reasoning_layer_used: POB lexical decision for תֵּאָלַמְנָה and שִׂפְתֵי שָׁקֶר
  rationale: “May” and two short sentences make the jussive wish easier to follow.
- pob_phrase: speak insolently
  simplified_phrase: speak ... with brazen disrespect
  preserved_meaning: The speech remains offensively bold and disrespectful toward its target.
  reasoning_layer_used: POB lexical decision and applied revision for עָתָק
  rationale: “Brazen disrespect” explains the less familiar word “insolently” without merging it with pride.
- pob_phrase: against the righteous
  simplified_phrase: against the righteous
  preserved_meaning: The representative singular remains open to either one righteous person or the righteous generally.
  reasoning_layer_used: POB lexical decision and footnote for עַל צַדִּיק
  rationale: The key wording and its documented ambiguity are retained.
translation_notes:
  risk_flags:
  - risk: “Brazen disrespect” may sound close to “contempt.”
    mitigation: Keeping pride and contempt as separate nouns preserves the Hebrew accumulation of distinct charges.
