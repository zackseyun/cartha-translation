translation:
  language: en
  text: I was alarmed[a] and said, “I am cut off from your sight.” But you heard my pleas when I cried to you for help.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I spoke in haste.” The Hebrew can describe haste, agitation, or panic.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: As for me, I said in my alarm
  simplified_phrase: I was alarmed and said
  preserved_meaning: The psalmist spoke while distressed and afraid.
  reasoning_layer_used: Lexical decision for בְחָפְזִי
  rationale: The adjective form is more natural while retaining distressed alarm rather than mere speed.
- pob_phrase: from before your eyes
  simplified_phrase: from your sight
  preserved_meaning: The psalmist felt removed from God’s notice and favor.
  reasoning_layer_used: Lexical and theological decisions for מִנֶּגֶד עֵינֶיךָ
  rationale: “From your sight” keeps the visual image without the less natural English idiom.
- pob_phrase: Yet you heard the sound of my pleas
  simplified_phrase: But you heard my pleas
  preserved_meaning: God actually heard the psalmist’s appeals despite his fearful conclusion.
  reasoning_layer_used: Lexical decision for אָכֵן and קוֹל תַּחֲנוּנַי
  rationale: “But” states the contrast clearly, and “heard my pleas” naturally includes their audible expression.
translation_notes:
  risk_flags:
  - risk: “From your sight” may suggest only physical visibility.
    mitigation: The wording preserves POB’s approved idiomatic alternative without strengthening the claim into divine rejection.
