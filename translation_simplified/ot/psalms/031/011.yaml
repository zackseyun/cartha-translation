  reasoning_layer_used: POB lexical decision for הָיִיתִי חֶרְפָּה
  rationale: “Object of scorn” makes the relational meaning of “reproach” immediately clear.
- pob_phrase: a terror to my acquaintances
  simplified_phrase: someone my acquaintances fear
  preserved_meaning: People who know him now regard him with fear or dread.
  reasoning_layer_used: POB lexical decision for וּפַחַד לִמְיֻדָּעָי
  rationale: The predicate noun is recast as a natural English clause without weakening the fear.
- pob_phrase: those who see me in public avoid me
  simplified_phrase: Those who see me in public move away to avoid me
  preserved_meaning: People visibly withdraw from him when they encounter him outside.
  reasoning_layer_used: POB footnote and lexical decision for נָדְדוּ מִמֶּנִּי
  rationale: Adding “move away” preserves the Hebrew movement image while “avoid” states its social force.
