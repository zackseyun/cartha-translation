translation:
  language: en
  text: Because of all my enemies, I have become an object of scorn, especially to my neighbors, and someone my acquaintances fear. Those who see me in public move away to avoid me.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The opening may also mean, “I have become an object of scorn to all my enemies,” or possibly, “more than all my enemies.”
    reason: alternative_reading
