translation:
  language: en
  text: For grief has consumed my life, and I have spent my years sighing. My strength has failed[a] because of my iniquity,[b] and my bones are wasting away.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb can also be pictured as “stumbling” or “tottering.”
    reason: lexical_alternative
  - marker: b
    text: Or “my guilt”; the Hebrew word can mean iniquity, guilt, or the consequences of guilt.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: my life is spent with grief
  simplified_phrase: grief has consumed my life
  preserved_meaning: Grief has exhausted and used up the psalmist’s life.
  reasoning_layer_used: Lexical decision for כָלוּ and בְיָגוֹן
  rationale: The active wording makes the same image of a life consumed by grief easier to grasp.
- pob_phrase: and my years with sighing
  simplified_phrase: and I have spent my years sighing
  preserved_meaning: The psalmist’s years have passed in continual sighing.
  reasoning_layer_used: Hebrew poetic parallelism and lexical decision for בַּאֲנָחָה
  rationale: Supplying the implied verb turns the compressed poetic clause into natural English.
- pob_phrase: my bones waste away
  simplified_phrase: my bones are wasting away
  preserved_meaning: The psalmist describes deep bodily decline through the image of wasting bones.
  reasoning_layer_used: Lexical decision for עָשֵׁשׁוּ
  rationale: The progressive form presents the wasting as an ongoing condition without weakening the bodily image.
