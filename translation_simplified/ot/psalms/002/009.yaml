translation:
  language: en
  text: You will break them with an iron scepter.[a][b] You will smash them to pieces like a clay jar made by a potter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some ancient versions read, “You will shepherd them with an iron scepter” or “You will rule them with an iron scepter.” This wording is echoed in Revelation.
    reason: alternative_reading
  - marker: b
    text: The word translated “scepter” can also mean a rod or staff used for authority or discipline.
    reason: lexical_alternative
