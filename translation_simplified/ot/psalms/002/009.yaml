- pob_phrase: like a potter’s vessel
  simplified_phrase: like a clay jar
  preserved_meaning: The comparison remains an object of pottery that can be violently broken.
  reasoning_layer_used: POB lexical decision for כִּכְלִי יוֹצֵר
  rationale: “Clay jar” gives common readers a concrete picture without weakening the pottery image.
- pob_phrase: you will shatter them
  simplified_phrase: you will smash them
  preserved_meaning: The verb still expresses violent, destructive judgment.
  reasoning_layer_used: POB lexical decision for תְּנַפְּצֵם
  rationale: “Smash” is more immediate common English and retains the force of the Hebrew image.
- pob_phrase: single semicolon-linked sentence
  simplified_phrase: two short sentences
  preserved_meaning: The parallel actions of breaking and smashing remain distinct and closely linked.
  reasoning_layer_used: POB syntax and poetic parallelism
  rationale: Two sentences make the judgment image easier to grasp on first reading.
