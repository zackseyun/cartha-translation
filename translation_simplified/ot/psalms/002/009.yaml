  rationale: “Clay jar” makes the pottery image immediately clear.
- pob_phrase: you will shatter them
  simplified_phrase: You will smash them to pieces
  preserved_meaning: The king’s judgment destroys them as pottery is violently broken.
  reasoning_layer_used: Lexical decision for תְּנַפְּצֵם
  rationale: The expanded phrase expresses the verb’s force in common English.
- pob_phrase: single poetic sentence joined by a semicolon
