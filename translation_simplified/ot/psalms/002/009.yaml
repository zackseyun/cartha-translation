translation:
  language: en
  text: You will break them[a] with an iron scepter[b]. You will smash them like a clay jar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some ancient versions read, “You will shepherd them” or “You will rule them.” The Hebrew text used here and the parallel word “smash” support “break them.”
    reason: alternative_reading
  - marker: b
    text: Or “iron rod.” The Hebrew word can mean a rod, staff, or royal scepter.
    reason: lexical_alternative
