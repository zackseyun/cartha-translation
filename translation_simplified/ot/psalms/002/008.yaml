simplification_decisions:
- pob_phrase: Ask of me
  simplified_phrase: Ask me
  preserved_meaning: The addressed king or son is commanded to petition the speaker.
  reasoning_layer_used: Lexical decision for שְׁאַל מִמֶּנִּי
  rationale: Modern English normally expresses the same petition as “ask me.”
- pob_phrase: and I will give the nations as your inheritance
  simplified_phrase: and I will give you the nations as your inheritance
  preserved_meaning: The nations are promised as an inherited possession.
  reasoning_layer_used: Lexical decisions for וְאֶתְּנָה, גּוֹיִם, and נַחֲלָתֶךָ
  rationale: Adding “you” makes the recipient clear without changing the promise.
- pob_phrase: and the ends of the earth as your possession
  simplified_phrase: The farthest reaches of the earth will be your possession
  preserved_meaning: The promise extends to the earth’s remotest limits.
  reasoning_layer_used: Lexical decision and documented alternative for אַפְסֵי אָרֶץ
  rationale: A new sentence and the clearer lexical alternative make the worldwide scope easy to understand.
translation_notes:
  risk_flags:
