translation:
  language: en
  text: The kings of the earth take a stand against Yahweh and the one he has anointed. The rulers join together[a] against Yahweh and the one he has anointed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “gather together,” “assemble together,” or “take counsel together.” The Hebrew describes coordinated opposition.
    reason: lexical_alternative
