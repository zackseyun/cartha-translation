  preserved_meaning: The kings deliberately position themselves in opposition.
  reasoning_layer_used: POB lexical decision for יִתְיַצְּבוּ and the hostile context
  rationale: This avoids the military overtone of “line up” while keeping the deliberate opposition.
- pob_phrase: rulers gather together
  simplified_phrase: The rulers join together
  preserved_meaning: Political leaders act together in coordinated opposition.
  reasoning_layer_used: POB lexical decisions for נוֹסְדוּ and יָחַד
  rationale: “Join together” is plain English and does not strengthen the action to conspiracy.
- pob_phrase: against Yahweh and against his anointed one
  simplified_phrase: against Yahweh and the one he has anointed
  preserved_meaning: Both groups oppose Yahweh and the person he has anointed.
  reasoning_layer_used: Latest source audit and POB divine-name decision
  rationale: This retains Yahweh’s name and explains “anointed one” without making it a capitalized title.
