translation:
  language: en
  text: I will announce what Yahweh has decreed. He said to me, “You are my Son.[a] Today I have begotten you.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “my son.” Hebrew does not mark capitalization; “Son” reflects the verse’s royal and messianic significance.
    reason: alternative_reading
  - marker: b
    text: Or “Today I have become your father.” The Hebrew uses the image of begetting, which may point to royal enthronement or adoption without settling its full meaning.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I will declare the decree of Yahweh
  simplified_phrase: I will announce what Yahweh has decreed
  preserved_meaning: The speaker solemnly proclaims Yahweh’s authoritative royal decision.
  reasoning_layer_used: Lexical decision for אֲסַפְּרָה and חֹק
  rationale: The verb form is easier to understand than the abstract phrase while retaining the decree’s authority.
- pob_phrase: He said to me
  simplified_phrase: He said to me
  preserved_meaning: Yahweh is the speaker addressing the king.
  reasoning_layer_used: Lexical decision for אָמַר אֵלַי
  rationale: The existing wording is already clear and naturally carries Yahweh forward as the subject.
- pob_phrase: today I have begotten you
  simplified_phrase: Today I have begotten you
  preserved_meaning: The birth image and its unresolved royal-messianic force remain intact.
  reasoning_layer_used: Theological decision on begetting language
  rationale: The key term is retained because a simpler paraphrase would settle an ambiguity the POB preserves.
