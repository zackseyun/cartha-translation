translation:
  language: en
  text: I will announce what Yahweh has decreed. He said to me, “You are my Son[a]; today I have begotten you.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “You are my son.” Hebrew does not use capitalization; “Son” reflects the verse’s royal and messianic significance.
    reason: alternative_reading
  - marker: b
    text: Or “today I have become your father.” “Begotten” preserves the Hebrew birth image, which may point to royal enthronement or adoption without limiting it to one meaning.
    reason: lexical_alternative
