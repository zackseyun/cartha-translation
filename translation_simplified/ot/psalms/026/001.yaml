translation_notes:
  risk_flags:
  - risk: Using “you” does not repeat the divine name as the Hebrew does.
    mitigation: Yahweh is named at the start of the sentence, so the referent remains unmistakable.
  - risk: “I will not slip” could sound like self-reliance.
    mitigation: The preceding clause grounds this confidence in trust in Yahweh.
