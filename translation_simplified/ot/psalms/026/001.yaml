  text: Vindicate me[a], O Yahweh, for I have walked in my integrity[c], and I have trusted in Yahweh; I will not slip[b].
  footnotes:
  - marker: a
    text: Or “Judge me, O Yahweh.” The Hebrew verb can mean “judge,” but here likely carries the sense “vindicate” or “give judgment in my favor.”
