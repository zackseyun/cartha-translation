  - marker: b
    text: Or “I will not totter” or “I will not waver.” The Hebrew image is of slipping or losing footing.
    reason: lexical_alternative
  - marker: c
    text: Or “in my blamelessness.” The Hebrew term denotes integrity, wholeness, or blameless conduct.
    reason: lexical_alternative
