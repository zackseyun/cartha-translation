translation:
  language: en
  text: I cried to you for help, Yahweh. I said, “You are my refuge. You are my allotted share in the land of the living.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The land of the living” means the realm of earthly life, in contrast to death.
    reason: simplification_note
simplification_decisions:
- pob_phrase: I cried out to you, O Yahweh
  simplified_phrase: I cried to you for help, Yahweh
  preserved_meaning: The psalmist urgently appeals to Yahweh for help.
  reasoning_layer_used: Lexical rationale for זָעַקְתִּי and theological decision for יְהוָה
  rationale: The wording makes the urgent appeal clear while retaining God’s personal name.
- pob_phrase: You are my refuge, my portion
  simplified_phrase: You are my refuge. You are my allotted share
  preserved_meaning: Yahweh is both the psalmist’s shelter and the share assigned to him.
  reasoning_layer_used: Lexical decisions for מַחְסִי and חֶלְקִי
  rationale: A sentence break and “allotted share” clarify the two distinct images.
