translation:
  language: en
  text: 'Look to the right and see: no one acknowledges me. I have no refuge left[a]; no one cares about my life.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I have no way to escape.”
    reason: lexical_alternative
  - marker: b
    text: Or “no one cares about me”; the Hebrew expression refers to the person or life, not only an immaterial soul.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: there is no one who recognizes me
  simplified_phrase: no one acknowledges me
  preserved_meaning: No supporter recognizes or stands with the abandoned speaker.
  reasoning_layer_used: POB lexical decision for מַכִּיר and immediate lament context
  rationale: “Acknowledges me” makes the social abandonment clearer than “recognizes me.”
- pob_phrase: refuge has perished from me
  simplified_phrase: I have no refuge left
  preserved_meaning: Every available place or means of safety is gone.
  reasoning_layer_used: POB lexical decisions for אָבַד, מָנוֹס, and מִמֶּנִּי
  rationale: The recast sentence expresses the stark loss in natural modern English.
- pob_phrase: no one seeks my life
  simplified_phrase: no one cares about my life
  preserved_meaning: No one shows concern for the speaker’s life or well-being.
  reasoning_layer_used: POB lexical rationale for דּוֹרֵשׁ לְנַפְשִׁי and doctrine-realignment revision
  rationale: “Cares about” avoids the misleading modern sense of hunting someone down.
translation_notes:
  risk_flags:
  - risk: “Acknowledges” may suggest public recognition more than personal support.
    mitigation: The wording remains within the POB lexical range and the abandonment context.
  - risk: “No refuge left” does not display the Hebrew verb’s image of refuge perishing.
    mitigation: “Left” preserves the force that refuge has completely disappeared from reach.
