  text: The boastful cannot remain in your presence; you hate everyone who does evil.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: will not stand before your eyes
  simplified_phrase: cannot remain in your presence
  preserved_meaning: The boastful cannot endure or remain before God.
  reasoning_layer_used: The lexical rationale identifies God's presence as the phrase's judicial and relational sense.
  rationale: This makes the idiom immediately clear while preserving its force.
- pob_phrase: all workers of wickedness
  simplified_phrase: everyone who does evil
  preserved_meaning: God's hatred is directed toward all people who actively do evil.
  reasoning_layer_used: The lexical alternatives permit “all who do evil” while retaining active moral wrongdoing.
  rationale: This replaces an unnatural expression with common English.
translation_notes:
  risk_flags:
  - risk: Replacing “before your eyes” removes the Hebrew's concrete eye imagery.
    mitigation: “In your presence” preserves the idiom's intended relational and judicial meaning.
  - risk: The statement about divine hatred may sound stark to modern readers.
    mitigation: The direct word “hate” is retained because the source and POB theological decision forbid softening it.
