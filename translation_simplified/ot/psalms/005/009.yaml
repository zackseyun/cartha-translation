translation:
  language: en
  text: For nothing he says can be trusted.[a] Inside them is ruin.[b] Their throat is an open grave; they use their tongues to flatter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew shifts from singular “he” here to plural “they” in the rest of the verse, describing the enemies first as one and then as a group.
    reason: source_note
  - marker: b
    text: Or “Inside them is destruction”; the Hebrew may also suggest destructive schemes.
    reason: lexical_alternative
