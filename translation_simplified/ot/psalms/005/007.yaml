simplification_decisions:
- pob_phrase: But as for me
  simplified_phrase: But I
  preserved_meaning: The psalmist contrasts himself with the wicked described earlier.
  reasoning_layer_used: Lexical decision for וַאֲנִי and immediate context
  rationale: The simpler contrast marker “But” carries the force without the formal phrase “as for me.”
- pob_phrase: by the abundance of your steadfast love
  simplified_phrase: because of your great steadfast love
  preserved_meaning: God’s plentiful, loyal love is the basis for entering his house.
  reasoning_layer_used: Lexical and theological decisions for בְּרֹב חַסְדְּךָ
  rationale: “Because of your great” states the same basis in ordinary English while retaining “steadfast love.”
- pob_phrase: I will bow down toward your holy temple in fear of you
  simplified_phrase: I will bow down toward your holy temple in fear of you
  preserved_meaning: The psalmist physically bows in worship toward God’s sanctuary with holy fear.
  reasoning_layer_used: Lexical and theological decisions for אֶשְׁתַּחֲוֶה, אֶל, and בְּיִרְאָתֶךָ
  rationale: These concrete and theologically weighty words are already clear and should not be flattened.
