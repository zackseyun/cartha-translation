translation:
  language: en
  text: But let everyone who seeks safety in you rejoice! Let them shout for joy forever. Cover them with your protection, so that those who love your name may rejoice greatly in you.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: all who take refuge in you
  simplified_phrase: everyone who seeks safety in you
  preserved_meaning: People turn to God for refuge and protection.
  reasoning_layer_used: Lexical decision for חוֹסֵי בָךְ
  rationale: “Seeks safety” makes the refuge image immediately clear without reducing it to inward trust.
- pob_phrase: Spread your protection over them
  simplified_phrase: Cover them with your protection
  preserved_meaning: God is asked to place a protective covering over his people.
  reasoning_layer_used: Lexical decision for וְתָסֵךְ עָלֵימוֹ
  rationale: The shorter wording keeps both the covering image and its protective purpose.
- pob_phrase: may exult in you
  simplified_phrase: may rejoice greatly in you
  preserved_meaning: Those who love God’s name are asked to express exuberant, God-centered joy.
  reasoning_layer_used: Lexical and theological decisions for וְיַעְלְצוּ בְךָ
  rationale: “Rejoice greatly” communicates the force of “exult” in familiar English while retaining the prayer form.
translation_notes:
  risk_flags:
  - risk: “Love your name” may be unfamiliar to readers who do not recognize it as referring to God’s revealed character and reputation.
    mitigation: The phrase is retained because the Hebrew explicitly says “your name” and the POB marks it as covenantally important.
