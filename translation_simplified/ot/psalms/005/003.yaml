translation:
  language: en
  text: Yahweh, you hear my voice each morning. Each morning I bring my prayer before you[a] and watch expectantly[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says, “I arrange for you” or “I set in order before you”; the unstated object is likely the psalmist’s prayer.
    reason: lexical_alternative
  - marker: b
    text: Or “wait expectantly”; the Hebrew can mean watching, waiting, or looking out with hope.
    reason: lexical_alternative
