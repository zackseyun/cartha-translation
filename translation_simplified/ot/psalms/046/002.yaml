translation:
  language: en
  text: So we will not be afraid, even if the earth gives way[a] and the mountains slip into the heart of the seas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated “when the earth is changed”; here it pictures the earth losing its stability.
    reason: lexical_alternative
  - marker: b
    text: Or “the mountains totter into the heart of the seas.”
    reason: lexical_alternative
