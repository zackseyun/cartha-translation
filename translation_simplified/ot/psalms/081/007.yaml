translation:
  language: en
  text: When you were in distress, you called for help, and I rescued you. I answered you from the hidden place of thunder.[a] I tested you at the waters of Meribah.[b] Selah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be translated “in the hidden place of thunder”; the image suggests God’s concealed presence in a storm.
    reason: lexical_alternative
  - marker: b
    text: Meribah recalls Israel’s wilderness disputes over water (Exodus 17:1–7; Numbers 20:1–13).
    reason: cross_reference
  - marker: c
    text: Selah is a Hebrew worship term whose exact meaning is uncertain.
    reason: source_note
