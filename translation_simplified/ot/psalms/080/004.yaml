translation:
  language: en
  text: Yahweh, God of armies,[a] how long will you fume in anger[b] against your people’s prayer?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew “hosts”; it does not specify whether these armies are earthly or heavenly.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew vividly pictures God’s anger as smoke or fuming.
    reason: source_note
