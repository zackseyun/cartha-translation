    text: Or “strips it” or “picks at it”; the Hebrew pictures people plucking from the vine, not necessarily destroying it completely here.
    reason: lexical_alternative
  - marker: b
    text: Or “fences” or “hedge wall”; this is the protective barrier around a vineyard.
    reason: lexical_alternative
