  text: God, Commander of all powers,[a] restore us.[b] Let your face shine on us, showing us your favor, and we will be saved.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally “God of hosts,” a title presenting God as sovereign over every power.
    reason: simplification_note
  - marker: b
    text: Or “bring us back” or “turn us back.”
    reason: lexical_alternative
  - marker: c
    text: Or “we will be delivered.”
    reason: alternative_reading
