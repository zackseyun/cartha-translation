translation:
  language: en
  text: Shepherd of Israel, listen! You lead Joseph[a] like a flock. You who are enthroned above the cherubim[b], appear in shining splendor!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Joseph” here likely represents the people of Israel, especially the northern tribes.
    reason: cultural_note
  - marker: b
    text: Or “between the cherubim.” The Hebrew describes God’s royal presence without specifying the exact spatial relation.
    reason: alternative_reading
