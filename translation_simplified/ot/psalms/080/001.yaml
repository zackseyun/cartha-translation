translation:
  language: en
  text: Shepherd of Israel, listen! You lead Joseph[a] like a flock. You are enthroned above the cherubim[b]; shine out in splendor!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Joseph” here probably refers to the people of Israel, especially the northern tribes.
