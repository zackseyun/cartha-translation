  rationale: “Be on” is clear modern English and avoids the passive stillness suggested by “rest on.”
- pob_phrase: the man of your right hand
  simplified_phrase: the man at your right hand
  preserved_meaning: The man remains specially associated with God’s right hand without settling whether this indicates favor, support, or position.
