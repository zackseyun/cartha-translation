translation:
  language: en
  text: Let your hand be on the man at your right hand,[a] on the son of man[b] you have made strong for yourself.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “the man of your right hand”—someone specially favored, supported, or positioned by God.
    reason: lexical_alternative
  - marker: b
    text: “Son of man” can simply mean a human being, but here it may also have royal or messianic significance.
