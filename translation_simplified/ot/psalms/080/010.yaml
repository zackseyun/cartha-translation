simplification_decisions:
- pob_phrase: Its shade covered the mountains
  simplified_phrase: Its shade spread over the mountains
  preserved_meaning: The enormous vine cast shade across the mountains.
  reasoning_layer_used: Lexical decision for צִלָּהּ and the vine imagery
  rationale: “Spread over” makes the vast reach of the vine’s shade easier to picture.
- pob_phrase: and its branches the cedars of God
  simplified_phrase: and its branches covered the cedars of God
  preserved_meaning: The verb “covered” governs both halves of the Hebrew parallelism.
  reasoning_layer_used: Source audit and grammatical revision
  rationale: Restoring the implied verb makes the second clause complete in ordinary English.
translation_notes:
  risk_flags:
