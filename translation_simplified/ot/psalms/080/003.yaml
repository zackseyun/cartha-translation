  preserved_meaning: The prayer asks God both to renew the people and to show them his favorable presence.
  reasoning_layer_used: POB lexical decisions and source imagery
  rationale: Two short sentences make the paired requests easier to follow while keeping the shining-face image.
- pob_phrase: that we may be saved
  simplified_phrase: so that we may be saved
  preserved_meaning: Salvation remains the desired result of God’s restoration and favor.
  reasoning_layer_used: POB theological decision on the final volitive verb
  rationale: “So that” states the result relationship in common English without turning the prayer into a prediction.
