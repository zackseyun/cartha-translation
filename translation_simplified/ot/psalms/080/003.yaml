translation:
  language: en
  text: God, restore us.[a] Let your face shine on us with favor, so that we may be saved.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “bring us back” or “turn us back.”
    reason: lexical_alternative
  - marker: b
    text: Or “and we shall be saved.” The Hebrew can express either a prayer for this result or confidence that it will happen.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: God, restore us, and make your face shine
