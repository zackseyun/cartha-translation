translation:
  language: en
  text: Praise Yah,[a] because Yahweh is good. Sing praises to his name, because it is delightful.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Yah” is a short form of the divine name; “Yahweh” is the divine name used in the next phrase.
    reason: source_note
