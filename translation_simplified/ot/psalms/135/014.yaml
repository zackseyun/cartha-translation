translation:
  language: en
  text: For Yahweh will judge in favor of his people,[a] and he will show compassion to his servants.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated “will judge his people,” but here it most likely means judging in their favor.
    reason: lexical_alternative
  - marker: b
    text: Or, “will relent concerning his servants.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: will vindicate his people
  simplified_phrase: will judge in favor of his people
  preserved_meaning: Yahweh acts as judge on behalf of his people.
  reasoning_layer_used: Lexical decision for יָדִין and the parallel in Deuteronomy 32:36.
  rationale: This explains the less familiar word “vindicate” while preserving the judicial image.
- pob_phrase: will have compassion on his servants
  simplified_phrase: will show compassion to his servants
  preserved_meaning: Yahweh turns mercifully toward those who serve him.
  reasoning_layer_used: Lexical and theological decisions for יִתְנֶחָם.
  rationale: “Show compassion to” is natural modern English and avoids suggesting that God repents of wrongdoing.
translation_notes:
  risk_flags:
  - risk: “Judge in favor of” may sound more explicit than the bare Hebrew verb.
    mitigation: The footnote preserves “judge,” while the context and POB reasoning support the favorable sense.
  - risk: “Show compassion” does not display the verb’s possible sense of relenting.
    mitigation: The alternate rendering is retained in a footnote.
