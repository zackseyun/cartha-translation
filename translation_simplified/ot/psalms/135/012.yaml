simplification_decisions:
- pob_phrase: And he gave their land as an inheritance
  simplified_phrase: He gave their land to Israel, his people, as an inheritance
  preserved_meaning: God gave the defeated nations’ land to Israel as its covenant allotment.
  reasoning_layer_used: Lexical decisions for אַרְצָם, נַחֲלָה, and לְיִשְׂרָאֵל
  rationale: Moving the recipient earlier makes the sentence easier to follow without changing who received the land.
- pob_phrase: an inheritance, an inheritance to Israel his people
  simplified_phrase: as an inheritance—an inheritance for Israel
  preserved_meaning: The repeated noun emphasizes that the land was given to Israel as an inheritance.
  reasoning_layer_used: Theological decision on the poetic repetition of נַחֲלָה
  rationale: The dash preserves the repetition, while naming Israel again avoids an unclear pronoun.
