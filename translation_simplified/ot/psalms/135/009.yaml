translation:
  language: en
  text: He sent signs and wonders among you, Egypt, against Pharaoh and all his servants.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: into your midst, O Egypt
  simplified_phrase: among you, Egypt
  preserved_meaning: God sent the signs and wonders within Egypt, which the verse addresses as a nation.
  reasoning_layer_used: POB lexical decisions for בְּתוֹכֵכִי and מִצְרָיִם
  rationale: The direct address preserves Egypt’s personification without the archaic vocative “O.”
- pob_phrase: against Pharaoh and against all his servants
  simplified_phrase: against Pharaoh and all his servants
  preserved_meaning: Pharaoh and everyone serving him were targets of the signs and wonders.
  reasoning_layer_used: POB lexical decisions for בְּפַרְעֹה and וּבְכָל עֲבָדָיו
  rationale: Removing the repeated “against” makes the line more natural without changing its scope.
translation_notes:
  risk_flags:
  - risk: “Among you” may sound less directional than Hebrew “into your midst.”
    mitigation: It clearly retains the central sense that the signs and wonders occurred within Egypt.
