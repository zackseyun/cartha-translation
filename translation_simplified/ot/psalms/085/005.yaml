translation:
  language: en
  text: Will you stay angry with us forever? Will you keep your anger going from one generation to the next?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “angry against us.”
    reason: lexical_alternative
  - marker: b
    text: Literally, “draw out your anger.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Will you be angry with us forever?
  simplified_phrase: Will you stay angry with us forever?
  preserved_meaning: The question asks whether God's anger will continue forever.
  reasoning_layer_used: Lexical decision for תֶּאֱנַף and theological decision on divine anger
  rationale: “Stay angry” makes the continuing sense natural while retaining God's anger.
- pob_phrase: Will you prolong your anger
  simplified_phrase: Will you keep your anger going
  preserved_meaning: God's anger is pictured as continuing for an extended time.
  reasoning_layer_used: Lexical decision for תִּמְשֹׁךְ
  rationale: The common phrase “keep going” clearly expresses temporal extension.
- pob_phrase: from generation to generation
  simplified_phrase: from one generation to the next
  preserved_meaning: The anger continues across successive generations.
  reasoning_layer_used: Lexical decision for לְדֹר וָדֹר
  rationale: This wording explains the Hebrew distributive idiom in everyday English.
translation_notes:
  risk_flags:
  - risk: “Keep your anger going” does not itself preserve the Hebrew image of drawing something out.
    mitigation: Footnote b retains the literal image.
  - risk: “With us” may sound less adversarial than the possible sense “against us.”
    mitigation: Footnote a preserves the stronger lexical alternative.
