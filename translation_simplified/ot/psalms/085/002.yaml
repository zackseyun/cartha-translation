translation:
  language: en
  text: You forgave your people’s wrongdoing[a]; you covered all their sin[b]. Selah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “You lifted your people’s wrongdoing” or “carried away your people’s wrongdoing.” This Hebrew image means that God forgave their guilt.
    reason: lexical_alternative
  - marker: b
    text: This may also be translated “all their sins.”
    reason: alternative_reading
  - marker: c
    text: The meaning of “Selah” is uncertain, so the Hebrew term is retained.
    reason: source_note
simplification_decisions:
- pob_phrase: the iniquity of your people
  simplified_phrase: your people’s wrongdoing
  preserved_meaning: God pardoned the moral evil committed by his people.
  reasoning_layer_used: The lexical decision identifies moral iniquity or guilt while distinguishing it from the following word for sin.
  rationale: “Wrongdoing” communicates the moral sense more clearly than “iniquity” for common readers.
- pob_phrase: you covered all their sin
  simplified_phrase: you covered all their sin
  preserved_meaning: God dealt fully with the people’s sin through forgiveness.
  reasoning_layer_used: The lexical and theological decisions require preserving the Hebrew covering image.
  rationale: The concrete image remains clear and carries important theological resonance.
- pob_phrase: Selah
  simplified_phrase: Selah
  preserved_meaning: The uncertain Hebrew liturgical term remains uninterpreted.
  reasoning_layer_used: The lexical decision rejects unsupported glosses such as “pause” or “interlude.”
  rationale: Retaining the term avoids claiming more than the source establishes.
translation_notes:
  risk_flags:
  - risk: “Wrongdoing” may sound less weighty than “iniquity.”
    mitigation: The words “forgave,” “sin,” and the footnote preserve the verse’s moral force.
  - risk: Modern readers may mistake “covered” for hiding misconduct.
    mitigation: The parallel statement about forgiveness establishes the intended sense.
