translation:
  language: en
  text: You forgave your people for their wrongdoing[a]; you covered all their sin[b]. Selah[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “You lifted” or “carried away your people’s wrongdoing,” using an image of guilt being removed.
    reason: lexical_alternative
  - marker: b
    text: This may also be translated “all their sins.”
    reason: alternative_reading
  - marker: c
    text: The meaning of “Selah” is uncertain.
    reason: source_note
