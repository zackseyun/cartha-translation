- pob_phrase: the iniquity of your people
  simplified_phrase: your people for their wrongdoing
  preserved_meaning: God pardoned the moral wrong committed by his people.
  reasoning_layer_used: lexical and theological decisions on נָשָׂאתָ עֲוֺן
  rationale: The recast removes the difficult term “iniquity” while keeping forgiveness as the controlling meaning.
- pob_phrase: you covered all their sin
