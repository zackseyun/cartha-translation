translation_notes:
  risk_flags:
  - risk: “Wrongdoing” may sound less weighty than “iniquity.”
    mitigation: The wording retains moral fault, while “sin” in the parallel line preserves the verse’s theological gravity.
  - risk: Readers may mistake “covered” for merely hiding sin.
    mitigation: Its placement beside “forgave” keeps the covering image within the context of divine pardon.
