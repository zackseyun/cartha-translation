simplification_decisions:
- pob_phrase: revive us
  simplified_phrase: give us life again
  preserved_meaning: God is asked to restore the community to life without limiting this to physical, spiritual, or national renewal.
  reasoning_layer_used: POB lexical and theological decisions on תְּחַיֵּנוּ
  rationale: The clearer phrase preserves the Hebrew image of causing people to live again.
- pob_phrase: so that your people may rejoice in you
  simplified_phrase: so your people may rejoice in you
  preserved_meaning: The people’s God-centered joy is the desired result of restoration.
  reasoning_layer_used: POB lexical decisions on וְעַמְּךָ, יִשְׂמְחוּ, and בָךְ
  rationale: Removing “that” makes the clause more natural without weakening its prayerful purpose.
translation_notes:
  risk_flags:
  - risk: “Give us life again” may be heard as physical resurrection alone.
    mitigation: The wording remains broad, and the communal prayer context supports wider restoration.
  - risk: “Return” may suggest that God literally changed location.
    mitigation: The footnote preserves the likely sense of turning toward his people in favor without putting it into the text.
