simplification_decisions:
- pob_phrase: See, this is how
  simplified_phrase: Look—this is how
  preserved_meaning: The opening calls for attention and points back to the blessed life just described.
  reasoning_layer_used: Lexical decision and chapter context
  rationale: “Look” is a familiar attention marker, and “this is how” keeps the backward reference.
- pob_phrase: will be blessed
  simplified_phrase: will be blessed
  preserved_meaning: The verse directly declares the future blessing of the God-fearing man.
  reasoning_layer_used: Lexical decision on יְבֹרַךְ and grounding review
  rationale: Retaining the passive avoids recasting blessing as something that arrives.
- pob_phrase: the man who fears Yahweh
  simplified_phrase: the man who fears Yahweh
  preserved_meaning: The representative masculine wording and the biblical fear-of-Yahweh expression remain intact.
  reasoning_layer_used: Lexical and theological decisions
  rationale: These terms preserve the source-driven gender and covenant language.
translation_notes:
  risk_flags:
