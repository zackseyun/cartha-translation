  preserved_meaning: God has carefully counted the psalmist’s restless movements.
  reasoning_layer_used: Lexical decision for סָפַרְתָּה and נֹדִי
  rationale: “Kept count” sounds natural while preserving the concrete act of counting.
- pob_phrase: put my tears in your bottle—are they not in your book?
  simplified_phrase: Put my tears in your bottle. Are they not in your book?
  preserved_meaning: The prayer and rhetorical question remain distinct while retaining both images.
  reasoning_layer_used: Theological decision to retain anthropomorphic imagery
  rationale: Two sentences make the movement easier to follow without abstracting the imagery.
