translation:
  language: en
  text: Be gracious to me, God, because a man pants as he pursues me. All day long he fights against me and oppresses me.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “tramples me,” “snaps at me,” or “would swallow me up”; it pictures hostile, eager pursuit.
    reason: lexical_alternative
