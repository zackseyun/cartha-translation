  rationale: Modern English does not need “O” to mark direct address.
- pob_phrase: for man pants after me
  simplified_phrase: because a man pants as he pursues me
  preserved_meaning: A singular male enemy eagerly and aggressively pursues the psalmist.
  reasoning_layer_used: POB lexical and theological decisions for שְׁאָפַנִי and אֱנוֹשׁ
  rationale: The wording keeps the panting image while making its hostile sense clear.
- pob_phrase: all day long, fighting, he oppresses me
