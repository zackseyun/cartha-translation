simplification_decisions:
- pob_phrase: May God be gracious to us and bless us
  simplified_phrase: May God show us grace and bless us.
  preserved_meaning: The words remain a prayer for God’s gracious favor and blessing.
  reasoning_layer_used: Lexical decision for יְחָנֵּנוּ and theological decision on the verbs’ prayerful force.
  rationale: “Show us grace” makes “be gracious to us” easier to understand while keeping grace central.
- pob_phrase: and bless us; may his face shine upon us
  simplified_phrase: and bless us. May his face shine upon us.
  preserved_meaning: God’s blessing and the image of his shining face remain distinct petitions.
  reasoning_layer_used: Theological decision to preserve the priestly-blessing image.
  rationale: A sentence break clarifies the two requests without weakening their connection.
translation_notes:
  risk_flags:
  - risk: “Show us grace” is slightly more explanatory than the traditional phrase “be gracious to us.”
    mitigation: It retains the same request for gracious favor without narrowing it to mercy alone.
  - risk: The image of God’s shining face may be unfamiliar to some readers.
    mitigation: The image is preserved because it carries the Numbers 6 allusion, which the footnote identifies.
