translation:
  language: en
  text: May God show us his grace and bless us. May his face shine on us.[a] Selah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This echoes the priestly blessing in Numbers 6:24–26; the Hebrew literally says “with us.”
    reason: cross_reference
  - marker: b
    text: “Selah” was probably a musical or worship notation, but its exact meaning is uncertain.
    reason: cultural_note
simplification_decisions:
- pob_phrase: be gracious to us
  simplified_phrase: show us his grace
  preserved_meaning: The prayer asks God to give his gracious favor.
  reasoning_layer_used: Lexical decision for יְחָנֵּנוּ
  rationale: The clearer verbal phrase preserves grace without narrowing it to mercy.
- pob_phrase: and bless us; may
  simplified_phrase: and bless us. May
  preserved_meaning: Both requests remain distinct parts of the prayer.
  reasoning_layer_used: Theological decision on volitive force
  rationale: A sentence break makes the petitions easier to follow while retaining their prayerful force.
- pob_phrase: shine upon us
  simplified_phrase: shine on us
  preserved_meaning: God's shining face remains the concrete image of favor.
  reasoning_layer_used: Priestly-blessing allusion and lexical decisions for יָאֵר and פָּנָיו
  rationale: Common “on” replaces formal “upon” without weakening the Numbers 6 echo.
translation_notes:
  risk_flags:
  - risk: “Show us his grace” is less liturgically traditional than “be gracious to us.”
    mitigation: It retains grace as the controlling concept and keeps the verse's petition form.
  - risk: Combining the Hebrew alternative with the cross-reference may make the note dense.
    mitigation: The note stays brief and keeps both the idiom and the biblical echo visible.
