translation:
  language: en
  text: Let the nations be glad and sing for joy,[a] because you judge the peoples fairly and guide the nations throughout the earth.[b] Selah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “shout for joy”; the Hebrew can describe joyful singing or ringing cries of joy.
    reason: lexical_alternative
  - marker: b
    text: Or “in the land”; “throughout the earth” fits the psalm’s worldwide focus.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: for you judge the peoples with equity
  simplified_phrase: because you judge the peoples fairly
  preserved_meaning: God’s judgment is upright and impartial, and it gives the reason for the nations’ joy.
  reasoning_layer_used: lexical decisions for כִּי and מִישׁוֹר
  rationale: “Because” makes the logical connection immediate, while “fairly” expresses equity in common English.
- pob_phrase: guide the nations on the earth
  simplified_phrase: guide the nations throughout the earth
  preserved_meaning: God guides nations across the world rather than only within Israel’s land.
  reasoning_layer_used: theological decision on the global scope of אֶרֶץ
  rationale: “Throughout” makes the intended worldwide scope easier to grasp without changing it.
interpretive_expansions:
- pob_phrase: on the earth
  rendering: throughout the earth
  claim: God’s guidance extends worldwide.
  evidence:
  - Psalm 67 repeatedly speaks of all peoples and nations.
  - The POB theological decision explicitly chooses the global reading.
  confidence: high
  alternatives_preserved:
  - in the land
translation_notes:
  risk_flags:
  - risk: “Throughout” makes the global scope more explicit than the Hebrew preposition alone.
    mitigation: The psalm’s universal context supports it, while the local reading remains in a footnote.
