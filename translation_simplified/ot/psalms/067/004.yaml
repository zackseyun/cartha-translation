translation:
  language: en
  text: May the nations be glad and sing for joy,[a] because you judge all peoples fairly and guide every nation on earth.[b] Selah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “shout for joy”; the Hebrew can describe joyful singing or ringing cries of joy.
    reason: lexical_alternative
  - marker: b
    text: Or “in the land,” though the whole psalm points to the broader meaning “on earth.”
    reason: alternative_reading
  - marker: c
    text: Selah is a Hebrew musical or worship term whose precise meaning is uncertain.
    reason: source_note
simplification_decisions:
- pob_phrase: Let the nations be glad
  simplified_phrase: May the nations be glad
  preserved_meaning: The words remain a call or wish for the nations to rejoice rather than a firm prediction.
  reasoning_layer_used: Theological decision on the jussive force of the imperfect verb
  rationale: “May” expresses the poetic wish naturally in modern English.
- pob_phrase: judge the peoples with equity
  simplified_phrase: judge all peoples fairly
  preserved_meaning: God judges human peoples with uprightness and fairness.
  reasoning_layer_used: Lexical decision for מִישׁוֹר and the psalm’s universal scope
  rationale: “Fairly” replaces the more formal expression “with equity.”
- pob_phrase: guide the nations on the earth
  simplified_phrase: guide every nation on earth
  preserved_meaning: God guides nations throughout the world rather than only within Israel’s land.
  reasoning_layer_used: Lexical and theological decisions for לְאֻמִּים, תַּנְחֵם, and אֶרֶץ
  rationale: The singular wording makes the universal scope immediately clear.
interpretive_expansions:
- pob_phrase: the peoples ... the nations
  rendering: all peoples ... every nation
  claim: The generic plurals include peoples and nations universally.
  evidence:
  - Psalm 67 repeatedly speaks about all peoples and nations.
  - The POB reasoning explicitly identifies the psalm’s scope as universal.
  confidence: high
  alternatives_preserved:
  - the peoples ... the nations
translation_notes:
  risk_flags:
  - risk: “All” and “every” are implicit rather than separately stated in this Hebrew verse.
    mitigation: The universal context supports them, while the audit preserves the less explicit alternative.
  - risk: Readers may assume that “Selah” has a known literal meaning.
    mitigation: A brief note identifies it as an uncertain Hebrew musical or worship term.
