  reasoning_layer_used: Lexical decisions for לָדַעַת, בָּאָרֶץ, and דַּרְכֶּךָ; universal-scope theological decision.
  rationale: The active wording is easier to follow and “throughout” clearly expresses worldwide scope.
- pob_phrase: your salvation among all nations
  simplified_phrase: all nations may know your salvation
  preserved_meaning: Every nation is to know God's saving action in its full theological breadth.
  reasoning_layer_used: Lexical decisions for בְּכָל גּוֹיִם and יְשׁוּעָתֶךָ; salvation theological decision.
  rationale: Supplying “may know” completes the parallel thought in natural English without narrowing salvation.
