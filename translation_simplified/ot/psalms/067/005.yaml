simplification_decisions:
- pob_phrase: Let the peoples praise you
  simplified_phrase: May the peoples praise you
  preserved_meaning: The line remains a prayer or wish that the peoples praise God.
  reasoning_layer_used: POB theological decision on mood and discourse function
  rationale: “May” makes the prayerful force immediately clear in modern English.
- pob_phrase: O God
  simplified_phrase: God
  preserved_meaning: God remains the one directly addressed.
  reasoning_layer_used: POB lexical decision for אֱלֹהִים
  rationale: Direct address is clear from the word order without the older interjection “O.”
- pob_phrase: let all the peoples praise you
  simplified_phrase: may all peoples praise you
  preserved_meaning: Every people-group is included in the call to praise God.
  reasoning_layer_used: POB lexical decisions for עַמִּים and כֻּלָּם
  rationale: Removing the second “the” gives smoother English while preserving universal scope.
