simplification_decisions:
- pob_phrase: How long, O Yahweh
  simplified_phrase: Yahweh, how much longer
  preserved_meaning: The psalmist repeatedly cries out over the long duration of his suffering.
  reasoning_layer_used: Lexical decision for עַד אָנָה and lament context
  rationale: “How much longer” makes the ongoing anguish immediately clear in natural English.
- pob_phrase: will you forget me forever?
  simplified_phrase: will you forget me? Will it be forever?
  preserved_meaning: The complaint uses “forever” to intensify the fear that Yahweh has forgotten him.
  reasoning_layer_used: Lexical decisions for תִּשְׁכָּחֵנִי and נֶצַח
  rationale: Two questions remove awkward English without weakening the force of “forget” or “forever.”
- pob_phrase: hide your face from me
  simplified_phrase: hide your face from me
  preserved_meaning: The concrete Hebrew image conveys the withdrawal of divine presence or favor.
  reasoning_layer_used: Lexical and theological decisions for פָּנֶיךָ
  rationale: The image is retained because replacing it with an explanation would reduce its poetic force.
translation_notes:
  risk_flags:
  - risk: Splitting the first Hebrew question into two English questions slightly changes its form.
    mitigation: The split preserves both the duration complaint and the emphatic force of “forever.”
