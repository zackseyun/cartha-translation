translation:
  language: en
  text: For day and night, your hand pressed heavily on me. My strength dried up as if from the heat of summer.[a] Selah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult Hebrew expression literally speaks of “my sap” and may mean bodily moisture or vitality. Or “in the droughts of summer.”
