translation:
  language: en
  text: Blessed is the man[a] whose iniquity[b] Yahweh does not count against him. His spirit is free from deceit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “man” refers to any person, not only to a male.
    reason: simplification_note
  - marker: b
    text: The Hebrew word may also be translated “sin” or “guilt.”
    reason: lexical_alternative
