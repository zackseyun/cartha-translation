simplification_decisions:
- pob_phrase: to whom Yahweh does not count iniquity
  simplified_phrase: whose wrongdoing Yahweh does not count against them
  preserved_meaning: Yahweh does not charge the person with their moral offense.
  reasoning_layer_used: Lexical decision and forensic theological decision
  rationale: “Count against” keeps the accounting image while “wrongdoing” makes the moral sense clear.
- pob_phrase: in whose spirit there is no deceit
  simplified_phrase: who has no deceit within
  preserved_meaning: The person is inwardly free from deception.
  reasoning_layer_used: Lexical decision for רוּחַ and רְמִיָּה
  rationale: “Within” expresses the inward disposition without the less natural phrase “in whose spirit.”
- pob_phrase: the person
  simplified_phrase: the person ... them
  preserved_meaning: The singular person represents any human being, not only a male.
  reasoning_layer_used: Applied revision and generic-singular analysis
  rationale: Singular “they” keeps the reference generic and natural in modern English.
