  preserved_meaning: Yahweh does not charge the person’s moral offense to his account.
  reasoning_layer_used: Lexical decision and theological decision on divine non-imputation
  rationale: The clearer word order retains the source’s accounting image.
- pob_phrase: and in whose spirit there is no deceit
  simplified_phrase: His spirit is free from deceit.
  preserved_meaning: The blessed person is inwardly honest rather than deceptive.
  reasoning_layer_used: Lexical decisions for בְּרוּחוֹ and רְמִיָּה
