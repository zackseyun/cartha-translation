    text: The speaker could be Yahweh or the psalmist; the Hebrew does not identify the speaker here.
    reason: alternative_reading
  - marker: b
    text: The Hebrew can also mean “the way you will go” or “this way you will go.”
    reason: lexical_alternative
  - marker: c
    text: Literally, “my eye upon you,” an image that may suggest watchful guidance or attentive care.
    reason: lexical_alternative
