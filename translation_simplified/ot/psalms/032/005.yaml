translation:
  language: en
  text: I told you about my sin, and I did not cover up my wrongdoing. I said, “I will confess my acts of rebellion to Yahweh,” and you forgave[a] the guilt of my sin. Selah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb pictures God lifting away or carrying away the burden of sin; here it means “forgave.”
    reason: lexical_alternative
