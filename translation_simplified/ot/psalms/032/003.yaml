simplification_decisions:
- pob_phrase: For when I kept silent
  simplified_phrase: For while I kept silent
  preserved_meaning: His continuing silence was the circumstance in which his suffering continued.
  reasoning_layer_used: POB lexical decision for כִּי and הֶחֱרַשְׁתִּי
  rationale: “While” makes the ongoing relationship natural without stating what he kept silent about.
- pob_phrase: through my groaning all day long
  simplified_phrase: as I groaned all day long
  preserved_meaning: His anguished cries accompanied his suffering throughout the day.
  reasoning_layer_used: POB lexical decision for בְּשַׁאֲגָתִי and כָּל הַיּוֹם
  rationale: The verb “groaned” is easier to process while retaining the anguish and duration.
translation_notes:
