translation:
  language: en
  text: Do not be like a horse or a mule that has no understanding. It must be restrained with a bit and bridle, or it will not come near you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “so that it does not come near you.” The final Hebrew clause may mean either that the animal will not approach unless restrained or that it must be restrained from rushing near.
    reason: alternative_reading
