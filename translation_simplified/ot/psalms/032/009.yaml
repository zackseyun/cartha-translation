translation:
  language: en
  text: Do not be like a horse or mule that has no understanding. It is controlled with a bit and bridle; otherwise it will not come near you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “to keep it from coming near you.” The final words in Hebrew may mean either that the animal will not approach without restraint or that it is restrained so it will not approach.
    reason: alternative_reading
