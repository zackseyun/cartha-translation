  reasoning_layer_used: POB lexical decisions for כְּסוּס, כְּפֶרֶד, and אֵין הָבִין
  rationale: The relative clause makes the comparison easier to follow without changing its moral force.
- pob_phrase: whose trappings are bit and bridle to restrain it
