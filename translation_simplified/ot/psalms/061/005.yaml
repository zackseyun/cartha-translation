translation:
  language: en
  text: For you, God, have heard the vows I made. You have given the inheritance that belongs to those who fear your name.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “You have given me the inheritance of those who fear your name.” The Hebrew does not explicitly say “me,” though the context may imply it.
    reason: alternative_reading
  - marker: b
    text: To “fear your name” means to live in reverent awe of God.
    reason: cultural_note
