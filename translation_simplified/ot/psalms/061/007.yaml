  reasoning_layer_used: Lexical and theological decisions on יֵשֵׁב and לִפְנֵי אֱלֹהִים
  rationale: “Reign” states the royal sense plainly, while the footnote preserves the verb’s wider range.
- pob_phrase: appoint steadfast love and truth to guard him
  simplified_phrase: Appoint steadfast love and truth to guard him
  preserved_meaning: God’s personified covenant love and truth are asked to protect the king.
  reasoning_layer_used: Lexical and theological decisions on חֶסֶד וֶאֱמֶת and יִנְצְרֻהוּ
