translation:
  language: en
  text: May he reign in God’s presence forever.[a] Appoint steadfast love and truth[b] to guard him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “May he dwell in God’s presence forever.” The Hebrew verb can mean sit, remain, or dwell, though the royal setting points to reigning.
    reason: lexical_alternative
  - marker: b
    text: “Truth” may also be translated “faithfulness”; together, “steadfast love and truth” describes God’s loyal love and reliability.
    reason: lexical_alternative
