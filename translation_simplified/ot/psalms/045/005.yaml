- pob_phrase: peoples fall beneath you
  simplified_phrase: Peoples fall beneath you
  preserved_meaning: Multiple peoples are vividly pictured as falling in defeat under the addressed king.
  reasoning_layer_used: Lexical decisions for עַמִּים, תַּחְתֶּיךָ, and יִפְּלוּ.
  rationale: The concrete martial image is already clear and is therefore retained.
- pob_phrase: they are in the heart of the king’s enemies
  simplified_phrase: pierce the hearts of the king’s enemies
