translation:
  language: en
  text: You have loved what is right and hated what is evil. That is why God[a], your God[b], has anointed[c] you with the oil of joy more than your companions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “That is why, O God, your God has anointed you with the oil of joy more than your companions.” The first “God” may be direct address rather than the one performing the action.
    reason: alternative_reading
  - marker: b
    text: This verse is quoted in Hebrews 1:9.
    reason: cross_reference
  - marker: c
    text: To anoint someone was to pour oil on them to set them apart for a special role and honor.
    reason: cultural_note
