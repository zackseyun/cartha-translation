translation:
  language: en
  text: You have loved what is right and hated what is evil. Therefore God, your God,[a] has anointed you with the oil of joy more than your companions.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Therefore, O God, your God has anointed you with the oil of joy more than your companions.” The first “God” may be direct address rather than the subject of “has anointed.”
    reason: alternative_reading
  - marker: b
    text: This verse is quoted in Hebrews 1:9.
    reason: cross_reference
