  reasoning_layer_used: Lexical decisions for כָּל, כְּבוּדָּה, and פְּנִימָה.
  rationale: Natural word order and “completely” preserve the intensifier without tying it to “within.”
- pob_phrase: her clothing is of woven gold
  simplified_phrase: her clothing is woven with gold
  preserved_meaning: Her clothing contains crafted gold ornamentation.
  reasoning_layer_used: Lexical decisions for מִמִּשְׁבְּצוֹת, זָהָב, and לְבוּשָׁהּ.
  rationale: “Woven with gold” is natural English that retains the textile image.
