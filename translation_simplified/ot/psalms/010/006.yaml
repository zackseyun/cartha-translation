translation:
  language: en
  text: He tells himself,[a] “Nothing will shake me. For generations to come, I will never face trouble.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “He says in his heart,” an image for inward thought or self-talk.
    reason: source_note
  - marker: b
    text: The final Hebrew clause is incomplete and may also describe him as “one who is never in trouble.”
    reason: alternative_reading
