  preserved_meaning: Pride remains the setting or motive for the wicked people’s action.
  reasoning_layer_used: POB lexical decision for בְּגַאֲוַת and syntactic footnote
  rationale: The recast clause names the actors directly while retaining pride as the cause or setting.
- pob_phrase: the poor man is hotly pursued
  simplified_phrase: the wicked relentlessly hunt down the poor
  preserved_meaning: The poor person is subjected to intense, hostile pursuit by the wicked.
  reasoning_layer_used: POB lexical decisions for יִדְלַק, עָנִי, and רָשָׁע
  rationale: The active wording makes the compressed Hebrew relationship immediately clear.
- pob_phrase: let them be caught in the schemes they have devised
  simplified_phrase: May they be caught in the schemes they themselves devised
  preserved_meaning: The verse prays that the wicked will be trapped by their own malicious plans.
  reasoning_layer_used: POB theological decision on the jussive reading
  rationale: “May” expresses the prayer naturally, while “themselves” highlights the intended moral reversal.
