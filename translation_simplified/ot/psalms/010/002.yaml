translation:
  language: en
  text: In their pride, the wicked relentlessly hunt down the poor.[a] May they be caught in the schemes they themselves devised.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is compressed and may also be understood as “the poor are pursued because of the pride of the wicked.”
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew may instead be a statement: “They are caught in the schemes they have devised.”'
    reason: alternative_reading
