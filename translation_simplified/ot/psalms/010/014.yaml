translation:
  language: en
  text: You have seen it. You watch the trouble and grief, and you take the matter in hand.[a] The helpless entrust themselves to you; you have been the helper of those without fathers.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “to give it into your hand,” picturing God taking up the matter to act.
    reason: source_note
  - marker: b
    text: Or “orphans.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: You have seen, for you look upon trouble and grief
  simplified_phrase: You have seen it. You watch the trouble and grief
  preserved_meaning: God has seen and continues to attend closely to suffering.
  reasoning_layer_used: Lexical decisions for רָאִתָה and תַּבִּיט
  rationale: Two short sentences preserve both completed awareness and attentive watching.
- pob_phrase: to take it in hand
  simplified_phrase: and you take the matter in hand
  preserved_meaning: God takes up the situation for action rather than merely observing it.
  reasoning_layer_used: Theological decision on לָתֵת בְּיָדֶךָ
  rationale: Adding “the matter” makes the English idiom immediately clear without specifying how God acts.
- pob_phrase: The helpless commits himself to you; you have been the helper of the fatherless
  simplified_phrase: The helpless entrust themselves to you; you have been the helper of those without fathers
  preserved_meaning: Vulnerable people rely on God, who helps the fatherless.
  reasoning_layer_used: Lexical decisions for עָלֶיךָ יַעֲזֹב, חֵלֶכָה, יָתוֹם, and עוֹזֵר
  rationale: Natural inclusive wording clarifies reliance and the vulnerable social group.
translation_notes:
  risk_flags:
  - risk: “Entrust themselves” could obscure the alternative sense of leaving one’s cause with God.
    mitigation: The wording preserves reliance without ruling out entrusting one’s cause.
