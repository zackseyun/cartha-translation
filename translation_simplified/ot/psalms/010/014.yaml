translation:
  language: en
  text: You have seen the trouble and grief. You watch it closely and take the matter into your own hand. A helpless person entrusts themselves to you[a]; you have been the helper of the fatherless.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Or: “A helpless person leaves their cause to you.”'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: You have seen, for you look upon trouble and grief
  simplified_phrase: You have seen the trouble and grief. You watch it closely
  preserved_meaning: God has seen the suffering and continues to regard it attentively.
  reasoning_layer_used: Lexical decisions for רָאִתָה and תַּבִּיט
  rationale: Two short sentences make the repeated visual image clear without removing it.
- pob_phrase: to take it into your hand
  simplified_phrase: and take the matter into your own hand
  preserved_meaning: God takes up the matter for action rather than merely observing it.
  reasoning_layer_used: Theological decision on divine observation leading to intervention
  rationale: “The matter” makes the idiom understandable without specifying how God will act.
- pob_phrase: The helpless commits himself to you
  simplified_phrase: A helpless person entrusts themselves to you
  preserved_meaning: A vulnerable person relies on God by entrusting themselves or their cause to him.
  reasoning_layer_used: Lexical and theological decisions for עָלֶיךָ יַעֲזֹב and חֵלֶכָה
  rationale: The wording uses natural inclusive English while the footnote preserves the alternate object of entrusting.
translation_notes:
  risk_flags:
  - risk: “Take the matter into your own hand” may sound more specific about intervention than the Hebrew idiom alone.
    mitigation: The POB theological rationale explicitly favors action while leaving its form unspecified.
  - risk: Singular “themselves” may draw attention for some readers.
    mitigation: It preserves the singular vulnerable person without using an unclear generic masculine.
