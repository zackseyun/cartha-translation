- pob_phrase: seek out his wickedness until you find none
  rendering: Search out his wickedness and deal with it until none remains
  claim: God’s searching is judicial and aims to leave no wickedness undealt with.
  evidence:
  - The POB lexical rationale gives the verb a forensic sense in this context.
  - The POB theological rationale says the final clause describes wickedness being fully dealt with.
  confidence: high
  alternatives_preserved:
