- pob_phrase: the wicked and evil man
  simplified_phrase: the wicked, evil person
  preserved_meaning: The wording describes a person characterized by wickedness and evil while retaining the Hebrew ambiguity in a footnote.
  reasoning_layer_used: POB lexical decision for רָשָׁע and וָרָע
  rationale: “Person” is natural modern English and avoids using “man” generically.
- pob_phrase: seek out his wickedness until you find none
  simplified_phrase: Search out his wickedness and deal with it until none remains
  preserved_meaning: God is asked to pursue the person’s evil in judgment until it has been fully dealt with.
  reasoning_layer_used: POB lexical and theological decisions for תִּדְרוֹשׁ and בַל תִּמְצָא
  rationale: The recast wording makes the judicial purpose and desired result clear.
interpretive_expansions:
- pob_phrase: Break the arm
  rendering: Break the arm—take away his power to do harm
  claim: The arm represents the wicked person’s power and capacity to harm others.
  evidence:
  - The POB lexical rationale identifies “arm” as a metaphor for power.
  - The POB theological rationale says the plea asks God to disable the oppressor’s capacity for harm.
  confidence: high
  alternatives_preserved:
