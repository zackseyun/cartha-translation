translation:
  language: en
  text: Break the arm of the wicked, evil person[a]—take away his power to do harm. Search out his wickedness and deal with it until none remains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the wicked person and the evildoer.”
