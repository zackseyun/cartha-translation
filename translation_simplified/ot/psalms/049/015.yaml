translation:
  language: en
  text: But God will redeem my life from Sheol’s grasp[a], because he will take me[b]. Selah[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheol is the Hebrew term for the realm of the dead; it may also be translated “the grave.”
    reason: lexical_alternative
  - marker: b
    text: Or “because he will receive me.”
    reason: alternative_reading
  - marker: c
    text: The precise meaning and function of Selah are uncertain.
    reason: source_note
simplification_decisions:
- pob_phrase: from the hand of Sheol
  simplified_phrase: from Sheol’s grasp
  preserved_meaning: Sheol is pictured as a power holding human life.
  reasoning_layer_used: POB lexical decision for מִיַּד
  rationale: “Grasp” makes the image of controlling power immediately clear while preserving it.
- pob_phrase: for he will take me
  simplified_phrase: because he will take me
  preserved_meaning: God’s taking of the speaker grounds his confidence in redemption.
  reasoning_layer_used: POB lexical decisions for כִּי and יִקָּחֵנִי
  rationale: “Because” states the explanatory connection more naturally without resolving what “take me” entails.
translation_notes:
  risk_flags:
  - risk: “Take me” remains open to more than one understanding of God’s deliverance.
    mitigation: The wording preserves the POB ambiguity, and the footnote gives “receive me” as an alternative.
  - risk: Modern readers may mistake Sheol for either the physical grave alone or a later concept of hell.
    mitigation: The footnote identifies it broadly as the Hebrew realm of the dead.
