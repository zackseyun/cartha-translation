  text: But God will redeem my life from Sheol’s grasp[a] because he will take me.[b] Selah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheol is the Hebrew term for the realm of the dead; it may also be translated “the grave” or “the realm of the dead.”
