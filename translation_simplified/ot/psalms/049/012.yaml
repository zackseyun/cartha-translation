translation:
  language: en
  text: But a man, even when honored, does not remain so.[a][b] He is like the beasts that perish.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “a man” represents humankind generally.
    reason: lexical_alternative
  - marker: b
    text: Literally, “does not spend the night,” meaning that his honored state does not last.
    reason: source_note
  - marker: c
    text: Or “the beasts that are destroyed.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: man in honor
  simplified_phrase: a man, even when honored
  preserved_meaning: The man possesses honor or high status.
  reasoning_layer_used: POB lexical decision for בִּיקָר
  rationale: The recast phrase makes the relationship between the man and his honor immediately clear.
- pob_phrase: does not remain
  simplified_phrase: does not remain so
  preserved_meaning: His honored state does not continue.
  reasoning_layer_used: POB lexical decision and footnote for יָלִין
  rationale: “So” clearly points back to being honored while the footnote preserves the overnight image.
- pob_phrase: he is like the beasts that perish
  simplified_phrase: He is like the beasts that perish
  preserved_meaning: Human honor cannot prevent the mortality shared with animals.
  reasoning_layer_used: POB lexical decisions for נִמְשַׁל, כַּבְּהֵמוֹת, and נִדְמוּ
  rationale: The solemn comparison is already direct and should retain its full force.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “a man” as excluding the rest of humankind.
    mitigation: Footnote a explains that the singular represents humanity generally.
  - risk: Rendering the overnight idiom as “remain” could hide its concrete Hebrew image.
    mitigation: Footnote b preserves the literal image and explains its sense.
