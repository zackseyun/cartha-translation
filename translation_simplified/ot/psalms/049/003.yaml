  preserved_meaning: The psalmist declares that his speech will express wisdom.
  reasoning_layer_used: The lexical decisions retain the mouth image and identify “wise things” as a possible sense.
  rationale: “Wise words” sounds natural while preserving wisdom as the quality of his speech.
- pob_phrase: the meditation of my heart will be understanding
  simplified_phrase: my heart will reflect with understanding
  preserved_meaning: The psalmist’s inward reflection is characterized by understanding.
  reasoning_layer_used: The lexical rationales define the heart as the inner thinking center, meditation as reflection, and understanding as an abstract quality.
  rationale: The active wording is easier to follow and avoids implying that reflection produces understanding in others.
