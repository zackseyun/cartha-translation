translation:
  language: en
  text: For he sees that wise men die.[a] The fool and the senseless, beastlike man also perish, and they all leave their wealth to others.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The masculine wording describes representative kinds of people, not only males.
    reason: simplification_note
simplification_decisions:
- pob_phrase: wise men die; together the fool and the brutish man perish
  simplified_phrase: wise men die. The fool and the senseless, beastlike man also perish
  preserved_meaning: Wise, foolish, and unreasoning people all share the same fate.
  reasoning_layer_used: POB lexical decisions for יָמוּתוּ, יַחַד, בַעַר, and יֹאבֵדוּ
  rationale: Two sentences ease reading, while “also” keeps the leveling comparison among all three types.
- pob_phrase: the brutish man
  simplified_phrase: the senseless, beastlike man
  preserved_meaning: This is a person lacking reason in an animal-like way.
  reasoning_layer_used: POB lexical rationale and footnote b
  rationale: The phrase explains the uncommon word “brutish” without losing its animal-like force.
- pob_phrase: and they leave their wealth to others
  simplified_phrase: and they all leave their wealth to others
  preserved_meaning: Every type just named dies and leaves possessions for other people.
  reasoning_layer_used: Hebrew plural sequence and POB lexical decisions for וְעָזְבוּ, לַאֲחֵרִים, and חֵילָם
  rationale: “All” makes the plural refer clearly to the wise, the fool, and the beastlike man.
interpretive_expansions:
- pob_phrase: the brutish man
  rendering: the senseless, beastlike man
  claim: “Brutish” describes someone who is unreasoning and beastlike.
  evidence:
  - POB footnote b defines the term as “a senseless or beastlike person.”
  - The POB lexical rationale preserves the animal-like nuance of בַעַר.
  confidence: high
  alternatives_preserved:
  - the brutish man
- pob_phrase: they leave their wealth to others
  rendering: they all leave their wealth to others
  claim: The plural includes all the human types named in the verse.
  evidence:
  - The Hebrew sequence names the wise, fool, and brutish person before the plural verb.
  - The POB presents their mortality as a shared fate.
  confidence: high
translation_notes:
  risk_flags:
  - risk: “They all” makes the plural reference more explicit than the POB wording.
    mitigation: The Hebrew sequence and shared-fate structure support including every type named.
