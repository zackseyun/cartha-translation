translation:
  language: en
  text: When evil times come and the wickedness of my pursuers closes in around me, why should I be afraid?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “the iniquity of my heels surrounds me.” The Hebrew may refer to wrongdoing at his heels or to people trying to trip him up.
