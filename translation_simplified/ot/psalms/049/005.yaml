simplification_decisions:
- pob_phrase: Why should I fear in days of evil
  simplified_phrase: When evil times come ... why should I be afraid?
  preserved_meaning: The rhetorical question denies that adversity gives the psalmist reason to fear.
  reasoning_layer_used: Lexical decisions for לָמָּה, אִירָא, and בִּימֵי רָע
  rationale: The reordered clause sounds natural while retaining the broad sense of evil or calamity.
- pob_phrase: the iniquity of my pursuers
  simplified_phrase: the wickedness of my pursuers
  preserved_meaning: The pursuers’ conduct remains morally evil, not merely threatening.
  reasoning_layer_used: Lexical decision for עָוֹן and theological decision on עֲוֹן עֲקֵבַי
  rationale: “Wickedness” is clearer than “iniquity” while preserving its ethical force.
- pob_phrase: surrounds me
