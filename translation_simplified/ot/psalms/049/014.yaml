translation:
  language: en
  text: Like sheep, they are destined for Sheol.[a] Death will be their shepherd. In the morning, the upright will rule over them. Their physical form will waste away in Sheol, far from any lofty dwelling.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheol means the realm of the dead, not merely a physical grave.
    reason: cultural_note
  - marker: b
    text: The Hebrew is difficult; it may instead mean, “Their rock or strength will be consumed,” and the final phrase may mean, “Sheol will consume them from their lofty dwelling.”
    reason: alternative_reading
