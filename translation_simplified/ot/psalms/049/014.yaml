translation:
  language: en
  text: Like sheep, they are bound for Sheol, the realm of the dead. Death will be their shepherd. When morning comes, those who live uprightly will rule over them. Their form will decay in Sheol, far from their lofty dwelling.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew of the final line is difficult. “Their form” may also mean “their rock” or “their strength,” and the ending may mean that Sheol consumes them and leaves them without a dwelling.
    reason: alternative_reading
