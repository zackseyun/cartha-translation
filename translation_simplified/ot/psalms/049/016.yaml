translation:
  language: en
  text: Do not be afraid when a man grows rich, when his household[a] becomes more impressive.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “estate.” The Hebrew says “house,” which can mean a person’s household, family, or estate, not only the building where he lives.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Do not fear
  simplified_phrase: Do not be afraid
  preserved_meaning: The command not to fear another man’s prosperity remains direct.
  reasoning_layer_used: Lexical decision for תִּירָא
  rationale: “Be afraid” is more natural in common English and preserves the prohibition.
- pob_phrase: the glory of his house increases
  simplified_phrase: his household becomes more impressive
  preserved_meaning: The growing prominence, splendor, or abundance associated with the man’s house remains broad.
  reasoning_layer_used: Lexical decisions for כְּבוֹד, יִרְבֶּה, and בֵּיתוֹ, plus the POB footnote
  rationale: This wording avoids a building-only reading without splitting “glory” into separate gains of wealth and honor.
interpretive_expansions:
- pob_phrase: his house
  rendering: his household
  claim: Here “house” refers more broadly to the man’s household rather than only his residence.
  evidence:
  - The POB footnote explicitly allows “household” or “estate.”
  - The clause concerns the increasing glory associated with the rich man’s house.
  confidence: high
  alternatives_preserved:
