  text: Yet you placed him only a little below God.[a] You crowned him with glory and honor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “below heavenly beings.” The Septuagint says “below angels,” as quoted in Hebrews 2:7.
