translation:
  language: en
  text: Yahweh[a], our Lord, how majestic your name[b] is throughout the earth! You have set your splendor higher than the heavens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh is the personal name of God, traditionally rendered “the LORD.”
    reason: alternative_reading
  - marker: b
    text: Here God’s “name” represents his revealed reputation and presence.
    reason: simplification_note
