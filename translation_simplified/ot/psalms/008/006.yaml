translation:
  language: en
  text: You made him[a] rule over what your hands have made. You placed everything under his feet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Him” represents humanity, as in the Hebrew wording of the preceding verse.
    reason: cultural_note
  - marker: b
    text: Putting everything “under his feet” means placing it under his authority.
    reason: simplification_note
