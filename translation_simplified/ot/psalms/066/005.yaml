simplification_decisions:
- pob_phrase: the works of God
  simplified_phrase: what God has done
  preserved_meaning: The invitation is to observe God’s acts.
  reasoning_layer_used: Lexical decision for מִפְעֲלוֹת
  rationale: A verbal clause states the same idea in more natural English.
- pob_phrase: he is awesome in his deeds
  simplified_phrase: He is awe-inspiring in his actions
  preserved_meaning: God himself inspires reverent awe through what he does.
  reasoning_layer_used: Lexical decisions for נוֹרָא and עֲלִילָה
  rationale: This preserves God as the subject and avoids the casual sense of “awesome.”
- pob_phrase: the children of man
  simplified_phrase: humankind
  preserved_meaning: God’s actions are directed toward humanity generally.
  reasoning_layer_used: Theological decision and lexical rationale for בְּנֵי אָדָם
  rationale: The idiomatic meaning is clear in the text, while the literal Hebrew form remains in the footnote.
translation_notes:
  risk_flags:
