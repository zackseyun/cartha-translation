simplification_decisions:
- pob_phrase: the works of God
  simplified_phrase: what God has done
  preserved_meaning: God’s observable acts
  reasoning_layer_used: POB lexical decision for מִפְעֲלוֹת
  rationale: The verbal wording is easier to understand while retaining the call to observe God’s acts.
- pob_phrase: he is awesome in his deeds
  simplified_phrase: He is awe-inspiring in what he does
  preserved_meaning: God himself inspires reverent awe through his actions
  reasoning_layer_used: POB lexical decisions for נוֹרָא and עֲלִילָה plus grounding review
  rationale: This avoids the casual sense of “awesome” and keeps God as the predicate’s subject.
- pob_phrase: toward humanity
  simplified_phrase: toward humanity
  preserved_meaning: Humanity is the object of God’s action without defining it as favorable or hostile
  reasoning_layer_used: POB lexical decisions for עַל and בְּנֵי אָדָם
  rationale: The broad wording preserves the Hebrew expression’s inclusive scope and unspecified direction.
translation_notes:
