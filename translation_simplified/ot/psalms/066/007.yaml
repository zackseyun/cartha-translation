translation:
  language: en
  text: He rules forever with his mighty power. His eyes keep watch over the nations. Those who rebel must not lift themselves up in pride.[a] Selah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “must not rise up.” The Hebrew can refer to lifting oneself up, rising up, or exalting oneself.
    reason: lexical_alternative
  - marker: b
    text: Selah is a musical or worship marker whose precise meaning is uncertain.
    reason: cultural_note
