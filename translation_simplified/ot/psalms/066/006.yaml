translation:
  language: en
  text: God made the sea into dry ground. The people crossed the river on foot.[a] There we rejoiced in him.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This likely recalls both Israel’s crossing of the sea during the exodus and the later crossing of the Jordan River.
    reason: cross_reference
  - marker: b
    text: Or, “There let us rejoice in him.” The Hebrew may express an invitation rather than describe past rejoicing.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: He turned the sea into dry land
  simplified_phrase: God made the sea into dry ground
  preserved_meaning: God changed the sea’s condition so people could pass on dry ground.
  reasoning_layer_used: Lexical decisions for הָפַךְ and לְיַבָּשָׁה
  rationale: “Made” states the action naturally while “dry ground” preserves the concrete image.
- pob_phrase: they passed through the river on foot
  simplified_phrase: The people crossed the river on foot
  preserved_meaning: The people passed across the river without boats.
  reasoning_layer_used: Lexical decisions for יַעַבְרוּ and בְרָגֶל
  rationale: “Crossed” is clearer modern English and keeps the physical movement on foot.
- pob_phrase: there we rejoiced in him
  simplified_phrase: There we rejoiced in him
  preserved_meaning: The worshiping community identifies with Israel’s historic joy in God.
  reasoning_layer_used: Theological decision on communal identification
  rationale: The wording remains unchanged because it preserves both the location and corporate identification.
