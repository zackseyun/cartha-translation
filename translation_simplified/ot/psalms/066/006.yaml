translation:
  language: en
  text: He turned the sea into dry ground. They crossed the river on foot.[b] There let us rejoice in him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “There we rejoiced in him.” The Hebrew may look back on what happened rather than call the community to rejoice.
    reason: alternative_reading
  - marker: b
    text: This likely recalls both Israel’s crossing of the sea during the exodus and its later crossing of the Jordan River.
    reason: cross_reference
