simplification_decisions:
- pob_phrase: Blessed be God, who has not
  simplified_phrase: Blessed be God! He did not
  preserved_meaning: The psalmist directly praises God for what he has done.
  reasoning_layer_used: Lexical decision for בָּרוּךְ and clause syntax
  rationale: Two sentences make the praise and its reason easier to follow.
- pob_phrase: turned away my prayer
  simplified_phrase: reject my prayer
  preserved_meaning: God did not refuse the psalmist’s prayer.
  reasoning_layer_used: Lexical decision for הֵסִיר
  rationale: “Reject” states the relational sense in ordinary English.
- pob_phrase: or his steadfast love from me
  simplified_phrase: or withhold his steadfast love from me
  preserved_meaning: God did not take his faithful covenant love away from the psalmist.
  reasoning_layer_used: Lexical and theological decisions for חֶסֶד
  rationale: “Withhold” supplies a natural verb while retaining the key term “steadfast love.”
translation_notes:
  risk_flags:
