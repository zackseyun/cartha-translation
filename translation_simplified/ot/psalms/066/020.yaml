  rationale: Two sentences make the praise and its basis easier to grasp.
- pob_phrase: turned away my prayer or his steadfast love from me
  simplified_phrase: reject my prayer or withhold his steadfast love from me
  preserved_meaning: God neither refused the prayer nor withdrew his faithful love.
  reasoning_layer_used: Lexical decisions for הֵסִיר and וְחַסְדּוֹ
  rationale: Separate natural verbs clarify how the shared Hebrew image applies to each object.
interpretive_expansions:
