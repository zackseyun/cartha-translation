translation:
  language: en
  text: Say to God, “The things you do inspire awe! Your great strength makes your enemies come cringing to you.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean that your enemies pretend to submit or yield reluctantly to you.
    reason: lexical_alternative
