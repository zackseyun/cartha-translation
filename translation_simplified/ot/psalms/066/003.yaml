translation:
  language: en
  text: Say to God, “Your deeds inspire awe! Your power is so great that your enemies pretend to obey you.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “cringe before you” or “yield unwillingly to you.” The Hebrew can describe forced or insincere submission.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: How awesome are your works!
  simplified_phrase: Your deeds inspire awe!
  preserved_meaning: God’s deeds produce reverent wonder and fear.
  reasoning_layer_used: POB lexical decision for מַה נּוֹרָא and מַעֲשֶׂיךָ
  rationale: This avoids the casual modern sense of “awesome” while preserving the force of awe.
- pob_phrase: Because of the greatness of your strength
  simplified_phrase: Your power is so great that
  preserved_meaning: God’s overwhelming power causes the enemies’ response.
  reasoning_layer_used: POB lexical rationale for בְּרֹב עֻזֶּךָ
  rationale: The recast clause states the same causal relationship in natural English.
- pob_phrase: feign obedience to you
  simplified_phrase: pretend to obey you
  preserved_meaning: The enemies submit outwardly but not sincerely.
  reasoning_layer_used: POB lexical and theological decisions for יְכַחֲשׁוּ לְךָ
  rationale: Common wording makes the compelled, insincere response immediately clear.
