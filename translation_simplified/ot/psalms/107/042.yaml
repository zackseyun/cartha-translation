  preserved_meaning: Upright people witness God's work and respond with joy.
  reasoning_layer_used: Immediate psalm context and POB gnomic reading
  rationale: Naming the implied object of seeing prevents an unclear English pronoun.
- pob_phrase: all injustice shuts its mouth
  simplified_phrase: All injustice closes its mouth and falls silent
