  language: en
  text: Foolish people[a] suffered because they followed a path of rebellion and committed sins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “foolish” describes people who live in morally wrong ways, not people who lack intelligence.
