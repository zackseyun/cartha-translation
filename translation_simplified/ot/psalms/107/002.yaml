simplification_decisions:
- pob_phrase: the redeemed of Yahweh
  simplified_phrase: Yahweh’s redeemed people
  preserved_meaning: These are people whom Yahweh has rescued in covenant faithfulness.
  reasoning_layer_used: Lexical and theological decisions on גְּאוּלֵי and יְהוָה
  rationale: The possessive form is more natural while retaining “redeemed” and the divine name Yahweh.
- pob_phrase: say so
  simplified_phrase: speak out
  preserved_meaning: Those Yahweh redeemed are urged to declare what he has done.
  reasoning_layer_used: Lexical decision on יֹאמְרוּ
  rationale: “Speak out” makes the exhortation clear without supplying the words they should say.
- pob_phrase: from the hand of the foe
  simplified_phrase: from the enemy’s grip
  preserved_meaning: Yahweh delivered them from an enemy’s power and control.
  reasoning_layer_used: Lexical decisions on מִיַּד and צָר
  rationale: “Grip” preserves the bodily image of controlling power in familiar English.
