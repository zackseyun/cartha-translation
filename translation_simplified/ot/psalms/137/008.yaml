  preserved_meaning: The avenger receives a genuine blessing for repaying Babylon in kind.
  reasoning_layer_used: POB lexical and theological decisions on reciprocal judgment
  rationale: The rewrite removes legal-sounding repetition without softening the beatitude.
translation_notes:
