translation:
  language: en
  text: Daughter Babylon,[a] devastated one,[b] blessed is the one who pays you back for what you did to us.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew pictures the city and people of Babylon as a daughter.
    reason: cultural_note
  - marker: b
    text: The Hebrew may describe devastation already suffered or ruin still to come.
    reason: lexical_alternative
