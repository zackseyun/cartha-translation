translation:
  language: en
  text: Then you will delight in sacrifices that are right, in offerings burned on the altar and offerings completely burned there.[a] Then bulls will be offered on your altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew uses two closely related expressions, traditionally translated “burnt offerings” and “whole burnt offerings.”
    reason: simplification_note
