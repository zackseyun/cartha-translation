  rationale: The relative clause uses common English while preserving the phrase’s adjectival force and breadth.
- pob_phrase: burnt offerings and whole burnt offerings
  simplified_phrase: offerings burned on the altar and offerings completely burned there
  preserved_meaning: These remain concrete sacrifices burned on the altar, with the second expression emphasizing completeness.
  reasoning_layer_used: lexical decisions for עוֹלָה and כָלִיל
  rationale: The wording explains unfamiliar ritual terms and clearly attaches completeness to the burning.
- pob_phrase: Then ... then
