translation:
  language: en
  text: Rescue me from the guilt of bloodshed, O God, the God who saves me. Then my tongue will sing aloud about your righteousness.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “your justice.” The Hebrew word includes both God's moral rightness and his justice.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Deliver me from bloodguilt
  simplified_phrase: Rescue me from the guilt of bloodshed
  preserved_meaning: The plea asks God to remove culpability for shed blood, not merely to rescue the speaker from violence.
  reasoning_layer_used: POB lexical and theological decisions on מִדָּמִים
  rationale: The clearer phrase explains the uncommon term “bloodguilt” without weakening the confession.
- pob_phrase: God of my salvation
  simplified_phrase: the God who saves me
  preserved_meaning: God is addressed as the source of the speaker's salvation and deliverance.
  reasoning_layer_used: POB lexical decision on אֱלֹהֵי תְּשׁוּעָתִי
  rationale: The verbal form is easier for new readers while retaining the theological claim.
- pob_phrase: and my tongue will sing aloud of your righteousness
  simplified_phrase: Then my tongue will sing aloud about your righteousness
  preserved_meaning: God's rescue results in exuberant vocal praise of his righteousness.
  reasoning_layer_used: POB lexical decisions on תְּרַנֵּן, לְשׁוֹנִי, and צִדְקָתֶךָ
  rationale: “Then” clarifies the result while preserving the tongue image and key term “righteousness.”
translation_notes:
  risk_flags:
  - risk: “The guilt of bloodshed” favors culpability over the viable nuance “bloodshed.”
    mitigation: This follows the POB's controlling contextual decision, while the wording still names bloodshed directly.
  - risk: Modern readers may hear “righteousness” only as personal morality.
    mitigation: The footnote preserves the Hebrew word's judicial nuance without resolving the tension.
