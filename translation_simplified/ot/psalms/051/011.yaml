simplification_decisions:
- pob_phrase: Create in me a clean heart, O God
  simplified_phrase: God, create in me a clean heart.
  preserved_meaning: The prayer still asks God to bring about inward cleansing.
  reasoning_layer_used: Lexical decisions for ברא, לב, and טהור
  rationale: Putting the direct address first makes the plea easier to follow without weakening “create.”
- pob_phrase: and renew ... within me
  simplified_phrase: Renew within me
  preserved_meaning: The second request still asks for inward restoration and revitalization.
  reasoning_layer_used: Lexical decisions for חדש and בקרבי
  rationale: A separate sentence clearly distinguishes the two parallel requests.
- pob_phrase: a steadfast spirit
  simplified_phrase: a spirit that remains steadfast
  preserved_meaning: The spirit is to be firm and stable rather than merely morally correct.
  reasoning_layer_used: Lexical and theological decision for נכון
  rationale: The added clause makes the intended continuing stability immediately clear.
interpretive_expansions:
- pob_phrase: steadfast spirit
  rendering: a spirit that remains steadfast
  claim: Steadfastness involves continuing inner firmness and stability.
  evidence:
  - The POB rationale defines נכון as established, firm, or stable.
  - The theological decision connects the phrase with sustained inner faithfulness after sin.
  confidence: high
  alternatives_preserved:
  - a right spirit
  - a firm spirit
translation_notes:
  risk_flags:
  - risk: “Remains steadfast” may suggest that the spirit is already steadfast.
    mitigation: “Renew” keeps the request focused on God restoring and revitalizing this steadfastness.
