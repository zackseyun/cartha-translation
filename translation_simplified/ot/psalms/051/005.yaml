translation:
  language: en
  text: You—you alone—are the one I have sinned against. I have done what is evil in your eyes, so that[a] you may be shown to be right in what you say and blameless when you judge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “with the result that you are shown to be right.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Against you—you alone—I have sinned
  simplified_phrase: You—you alone—are the one I have sinned against
  preserved_meaning: God alone is named as the offended party, with the Hebrew emphasis retained.
  reasoning_layer_used: lexical and theological decisions
  rationale: The recast sentence is easier to follow without softening the absolute claim.
- pob_phrase: you may be justified in your words
  simplified_phrase: you may be shown to be right in what you say
  preserved_meaning: God is proved morally and judicially right in his speech.
  reasoning_layer_used: lexical and theological decisions
  rationale: This avoids the misleading modern sense of “justified” while retaining the forensic meaning.
- pob_phrase: blameless in your judgment
  simplified_phrase: blameless when you judge
  preserved_meaning: God is without fault in the act of judging.
  reasoning_layer_used: lexical decision
  rationale: The temporal clause expresses the documented sense in ordinary English.
translation_notes:
  risk_flags:
  - risk: “You alone” may seem to deny that human beings were harmed by David’s sin.
    mitigation: The main text keeps the deliberate Hebrew tension rather than adding an unsupported qualifier.
  - risk: “So that” may be read as strict purpose rather than purpose or result.
    mitigation: The footnote preserves the documented result reading.
