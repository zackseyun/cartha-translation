translation:
  language: en
  text: During the day, the sun will not strike you in a harmful way. At night, neither will the moon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The sun and moon may be literal, figurative, or both; together, day and night also suggest protection at all times.
    reason: cultural_note
simplification_decisions:
- pob_phrase: By day the sun will not strike you
  simplified_phrase: During the day, the sun will not strike you in a harmful way
  preserved_meaning: The concrete image of striking remains, and its harmful sense is clarified without adding a second action.
  reasoning_layer_used: POB lexical decision for יַכֶּכָּה and lexical footnote
  rationale: The phrase explains what kind of striking is meant without broadening the promise.
- pob_phrase: nor the moon by night
  simplified_phrase: At night, neither will the moon
  preserved_meaning: The moon remains under the same negative verb in the day-and-night parallel.
  reasoning_layer_used: POB lexical decisions for וְיָרֵחַ and בַּלָּיְלָה
  rationale: A separate sentence makes the poetic parallel easier to follow.
