translation:
  language: en
  text: In the daytime, the sun will not strike you. At night, the moon will not strike you either.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Day and night together picture protection at all times; the sun and moon may be understood literally, figuratively, or both.
    reason: cultural_note
  - marker: b
    text: Here “strike” can also mean “harm.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: By day the sun will not strike you
  simplified_phrase: In the daytime, the sun will not strike you.
  preserved_meaning: The sun is pictured as unable to strike or harm the person during the day.
  reasoning_layer_used: Lexical decisions for יוֹמָם, הַשֶּׁמֶשׁ, and יַכֶּכָּה
  rationale: The clause becomes a complete, direct sentence while retaining the concrete image of striking.
- pob_phrase: nor the moon by night
  simplified_phrase: At night, the moon will not strike you either.
  preserved_meaning: The same protection extends to the moon at night.
  reasoning_layer_used: Lexical decisions and the theological decision to preserve the sun-and-moon imagery
  rationale: Repeating the implied verb makes the poetic second clause immediately clear.
translation_notes:
  risk_flags:
  - risk: Repeating “strike you” reduces the compact parallelism of the POB wording.
    mitigation: The repetition improves first-read clarity while preserving both the image and the day-night pairing.
  - risk: Modern readers may take the promise as only literal protection from celestial bodies.
    mitigation: Footnote a preserves the literal, figurative, and comprehensive readings without resolving them.
