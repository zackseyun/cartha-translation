translation:
  language: en
  text: He will keep your foot from slipping.[a] The one who watches over you will not doze off.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “May he keep your foot from slipping; may the one who watches over you not doze off.” The Hebrew can express a prayer or wish as well as an assurance.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: He will not let your foot slip
  simplified_phrase: He will keep your foot from slipping
  preserved_meaning: God will prevent the person from losing secure footing.
  reasoning_layer_used: Lexical decision for יִתֵּן and לַמּוֹט, with the theological decision favoring assurance
  rationale: The positive English construction states the same confident protection more naturally.
- pob_phrase: your keeper
  simplified_phrase: the one who watches over you
  preserved_meaning: God continually keeps, watches, and guards the person.
  reasoning_layer_used: Lexical decision for שֹׁמְרֶךָ
  rationale: The verbal phrase makes the keeper image immediately clear without narrowing it to a human guard.
- pob_phrase: will not slumber
  simplified_phrase: will not doze off
  preserved_meaning: The watcher will never become drowsy or inattentive.
  reasoning_layer_used: Lexical decision for יָנוּם
  rationale: “Doze off” clearly conveys light sleep while preserving the contrast developed in the next verse.
