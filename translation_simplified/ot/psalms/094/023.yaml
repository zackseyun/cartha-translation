  preserved_meaning: Their wicked conduct returns upon them in divine judgment.
  reasoning_layer_used: Lexical decisions for וַיָּשֶׁב and אֶת אוֹנָם
  rationale: This wording explains the returning image in common English rather than replacing it with the abstract idea of repayment.
- pob_phrase: in their evil he will wipe them out
  simplified_phrase: He will wipe them out because of their evil
  preserved_meaning: God’s destruction of them is judicially connected to their evil.
  reasoning_layer_used: Lexical decision for וּבְרָעָתָם and immediate context
  rationale: The causal wording clearly expresses the warranted basis of judgment while the footnote preserves the instrumental possibility.
