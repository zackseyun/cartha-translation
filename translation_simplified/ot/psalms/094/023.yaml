translation:
  language: en
  text: He will make their own wrongdoing come back on them.[a] He will wipe them out because of their evil;[b] Yahweh our God will wipe them out.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “He has made their wickedness come back on them.” The Hebrew poetry may refer to past action rather than future action.
    reason: lexical_alternative
  - marker: b
    text: Or, “He will wipe them out by their evil.”
    reason: lexical_alternative
