  text: Those who eagerly run after another god will suffer more and more sorrow.[a] I will not pour out their drink offerings of blood,[b] nor let their names pass my lips.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “their idols will multiply”; here “sorrow” better fits the line.
    reason: alternative_reading
  - marker: b
    text: Or “drink offerings with blood.”
    reason: lexical_alternative
