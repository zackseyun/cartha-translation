translation:
  language: en
  text: Those who eagerly chase after another god will suffer more and more sorrow.[a] I will not pour out their drink offerings of blood,[b] nor will I let their names cross my lips.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Their idols will multiply.” The Hebrew can refer to idols, but “sorrow” fits this line better.
    reason: alternative_reading
  - marker: b
    text: Or “drink offerings with blood.”
    reason: lexical_alternative
