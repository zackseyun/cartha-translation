translation:
  language: en
  text: For you will not abandon me to Sheol, the realm of the dead. You will not let your faithful one[a] see the pit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “your holy one.” The Hebrew can describe someone who is faithful, loyal, godly, or holy.
    reason: lexical_alternative
  - marker: b
    text: Or “experience decay.” The ancient Greek translation and the New Testament quotation emphasize corruption or decay.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: abandon my soul to Sheol
  simplified_phrase: abandon me to Sheol, the realm of the dead
  preserved_meaning: God will not leave the whole person under the power of the realm of the dead.
  reasoning_layer_used: Lexical decisions for נַפְשִׁי and שְׁאוֹל
  rationale: Using “me” clarifies the broad sense of “my soul,” while the gloss explains Sheol without reducing it to a grave.
- pob_phrase: nor will you let
  simplified_phrase: You will not let
  preserved_meaning: The second line remains a distinct parallel statement of confidence.
  reasoning_layer_used: POB syntax and poetic parallelism
  rationale: A new sentence makes the parallel thought easier to follow without merging it with the first.
