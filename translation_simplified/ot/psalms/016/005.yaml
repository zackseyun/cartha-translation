- pob_phrase: my allotted portion
  simplified_phrase: the share assigned to me
  preserved_meaning: Yahweh himself is the psalmist’s assigned share.
  reasoning_layer_used: lexical decisions and applied revision
  rationale: The wording explains “allotted portion” in ordinary English without losing the allotment image.
- pob_phrase: you uphold my lot
  simplified_phrase: You keep my allotted portion secure
  preserved_meaning: Yahweh sustains and protects what has been assigned to the psalmist.
  reasoning_layer_used: lexical and theological decisions
  rationale: This makes “uphold” and “lot” immediately understandable while retaining their allotment sense.
- pob_phrase: Yahweh is my allotted portion and my cup; you uphold my lot.
  simplified_phrase: Yahweh is the share assigned to me and my cup. You keep my allotted portion secure.
  preserved_meaning: The three related allotment images remain distinct and Yahweh remains both the psalmist’s portion and its protector.
