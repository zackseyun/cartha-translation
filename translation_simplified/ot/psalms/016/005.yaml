translation:
  language: en
  text: Yahweh is my share of the inheritance and my cup.[a] You keep my allotted portion secure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Hebrew uses several closely related images of what is assigned to someone: a share, an inheritance, and an allotted portion. “My cup” is also a poetic image for what is given to the psalmist to experience.'
    reason: simplification_note
