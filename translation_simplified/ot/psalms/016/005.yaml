- pob_phrase: the portion of my inheritance
  simplified_phrase: my share of the inheritance
  preserved_meaning: Yahweh himself is the psalmist’s inherited share.
  reasoning_layer_used: lexical and theological decisions
  rationale: This uses ordinary inheritance language while preserving the allotment image.
- pob_phrase: you uphold my lot
  simplified_phrase: You keep my allotted portion secure
  preserved_meaning: Yahweh sustains and protects what has been assigned to the psalmist.
  reasoning_layer_used: lexical rationale
  rationale: This explains “uphold” and “lot” without losing the assigned-share imagery.
