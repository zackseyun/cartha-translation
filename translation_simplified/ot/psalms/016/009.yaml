translation:
  language: en
  text: So my heart is glad, and my glory rejoices.[a] Even my flesh will live in safety.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “My glory” may also mean “my honor” or “my whole being”; some ancient interpreters understood it as “my tongue.”
    reason: lexical_alternative
  - marker: b
    text: Here “my flesh” means my physical body.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Therefore
