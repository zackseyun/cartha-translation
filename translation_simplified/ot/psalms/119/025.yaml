simplification_decisions:
- pob_phrase: My soul clings to the dust
  simplified_phrase: I lie in the dust, clinging to it
  preserved_meaning: The speaker’s whole person is brought down to the dust while the concrete image of clinging remains.
  reasoning_layer_used: source text and POB base translation
  rationale: Using “I” makes the Hebrew expression about the whole person natural in common English without removing the dust image.
- pob_phrase: according to your word
  simplified_phrase: in keeping with your word
  preserved_meaning: The request for life is grounded in what God has spoken.
  reasoning_layer_used: POB lexical decision for דָּבָר
  rationale: This keeps “word” distinct from “promise” while making the relationship clearer.
