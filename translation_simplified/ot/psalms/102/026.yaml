translation:
  language: en
  text: The heavens and the earth will perish, but you will remain.[a] They will all wear out like clothes. You will change them as a person changes clothes,[b] and they will pass away.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “you will stand,” expressing that God continues forever while creation perishes.
    reason: lexical_alternative
  - marker: b
    text: Or “replace them”; the Hebrew continues the picture of changing clothes.
    reason: lexical_alternative
