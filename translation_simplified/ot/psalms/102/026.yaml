translation:
  language: en
  text: They will perish, but you will remain.[a] They will all wear out like clothing. You will change them as someone changes clothes,[b] and they will pass away.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “you will stand.” Here “stand” means to remain permanently.
    reason: lexical_alternative
  - marker: b
    text: Or “replace them.” The Hebrew continues the picture of changing clothing.
    reason: lexical_alternative
