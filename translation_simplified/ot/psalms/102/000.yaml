translation:
  language: en
  text: A prayer of a suffering person when they grow faint[a] and pour out their complaint before Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “when they are overwhelmed.”
    reason: lexical_alternative
  - marker: b
    text: The word translated “complaint” can also mean “meditation” or “lament.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the afflicted one
  simplified_phrase: a suffering person
  preserved_meaning: The prayer belongs to someone experiencing affliction or oppression, not merely poverty.
  reasoning_layer_used: POB lexical decision for לְעָנִי and applied gender-neutral revision
  rationale: “A suffering person” is immediately understandable and avoids adding a gender distinction.
- pob_phrase: he grows faint and pours out his complaint
  simplified_phrase: they grow faint and pour out their complaint
  preserved_meaning: The person becomes weak in distress and expresses that distress openly in prayer.
  reasoning_layer_used: POB lexical decisions for יַעֲטֹף and יִשְׁפֹּךְ שִׂיחוֹ
  rationale: Singular “they” gives the heading natural modern English while preserving the pouring image.
