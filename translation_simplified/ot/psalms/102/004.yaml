translation:
  language: en
  text: My heart is beaten down and withered like grass because I forget to eat.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “my bread,” meaning the food he would eat.
    reason: simplification_note
  - marker: b
    text: Or “I have forgotten to eat”; the Hebrew may describe continuing distress or a past action whose effects remain.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: My heart is struck down
  simplified_phrase: My heart is beaten down
  preserved_meaning: The heart remains the afflicted inner self, pictured as having been struck down.
  reasoning_layer_used: POB lexical decision for הוּכָּה and לִבִּי
  rationale: “Beaten down” expresses the afflicted condition in familiar English.
- pob_phrase: I forget to eat my bread
  simplified_phrase: I forget to eat
  preserved_meaning: Severe distress causes the speaker to neglect food.
  reasoning_layer_used: POB lexical decisions for שָׁכַחְתִּי, מֵאֲכֹל, and לַחְמִי
  rationale: English naturally uses “eat” without naming the food, while a note preserves the concrete Hebrew wording.
