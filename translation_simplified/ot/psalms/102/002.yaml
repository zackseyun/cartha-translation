translation:
  language: en
  text: Do not hide your face from me on the day I am in distress.[a] Turn your ear toward me. On the day I call, answer me quickly.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Your face” can also mean God’s favorable presence.
