  reasoning_layer_used: Lexical and theological decisions on the repeated temporal phrases
  rationale: Parallel “when” clauses express the repeated timing naturally in modern English.
- pob_phrase: incline your ear to me
  simplified_phrase: Turn your ear toward me
  preserved_meaning: The speaker asks God to listen attentively.
