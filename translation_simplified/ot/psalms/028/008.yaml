translation:
  language: en
  text: Yahweh is their strength. He is a fortress of saving acts[a] for his anointed one.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “salvations,” pointing to repeated or many acts of deliverance.
    reason: lexical_alternative
