translation:
  language: en
  text: Save your people and bless them—the people who are your inheritance. Care for them as a shepherd cares for a flock,[a] and carry them forever.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “feed them”; the Hebrew refers broadly to tending a flock as a shepherd.
    reason: lexical_alternative
  - marker: b
    text: Or “lift them up” or “bear them.”
    reason: lexical_alternative
