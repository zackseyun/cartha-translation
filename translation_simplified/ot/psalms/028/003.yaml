simplification_decisions:
- pob_phrase: with the wicked
  simplified_phrase: along with wicked people
  preserved_meaning: The psalmist asks not to share the company or fate of morally evil people.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Along with” makes the shared company or fate clearer without specifying the exact judgment.
- pob_phrase: with those who work evil
  simplified_phrase: along with those who do evil
  preserved_meaning: These people actively practice wrongdoing.
  reasoning_layer_used: lexical decision
  rationale: “Do evil” is more natural modern English while retaining active wrongdoing.
- pob_phrase: who speak peace with their neighbors while evil is in their hearts
  simplified_phrase: They speak peaceful words to their neighbors, yet evil is in their hearts.
  preserved_meaning: Their outwardly peaceful speech conflicts with their inward evil.
  reasoning_layer_used: lexical decisions
  rationale: A new sentence and “yet” make the contrast immediately clear while preserving the heart image.
translation_notes:
  risk_flags:
  - risk: “Drag me away” may suggest only physical removal.
    mitigation: “Along with” retains the intended sense of sharing the wicked people’s company or fate.
