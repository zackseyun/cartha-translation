translation:
  language: en
  text: Do not drag me away along with wicked people, along with those who do evil. They speak peaceful words to their neighbors,[a] yet evil is in their hearts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “friends” or “companions.”
