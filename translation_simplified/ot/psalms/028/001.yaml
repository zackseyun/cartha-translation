translation:
  language: en
  text: 'Yahweh, my rock, I call to you. Do not be deaf to me. If you remain silent toward me, I will become like those who go down to the pit.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “The pit” may refer to the grave or the realm of the dead.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: To you, O Yahweh, I call; my rock
  simplified_phrase: Yahweh, my rock, I call to you.
  preserved_meaning: The psalmist directly calls on Yahweh as his stable protector.
  reasoning_layer_used: lexical decisions for אֵלֶיךָ, יְהוָה, אֶקְרָא, and צוּרִי
  rationale: Reordering the address makes it natural English while keeping the divine name and rock image.
- pob_phrase: do not be deaf to me, lest you be silent to me
  simplified_phrase: Do not be deaf to me. If you remain silent toward me
  preserved_meaning: The prayer distinguishes not hearing from giving no answer.
  reasoning_layer_used: lexical rationale for חרשׁ and חשה plus applied revision
  rationale: Two short sentences clarify the related but distinct appeals without resolving the documented ambiguity.
- pob_phrase: and I become like those who go down to the pit
  simplified_phrase: I will become like those who go down to the pit
  preserved_meaning: God’s silence would leave the psalmist facing the fate of the dead.
  reasoning_layer_used: lexical decisions for וְנִמְשַׁלְתִּי and עִם יֹרְדֵי בוֹר
  rationale: The conditional form states the feared result clearly while retaining the pit image.
translation_notes:
  risk_flags:
  - risk: “If” may sound more explicitly conditional than the Hebrew particle rendered “lest.”
    mitigation: The wording still presents God’s silence as the feared condition leading to the psalmist’s fate.
  - risk: Modern readers may take “the pit” as an ordinary hole.
    mitigation: Footnote b preserves its possible reference to the grave or realm of the dead.
