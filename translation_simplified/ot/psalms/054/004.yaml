translation:
  language: en
  text: For hostile outsiders have risen against me. Ruthless men are trying to take my life. They pay no attention to God; they do not keep him before them. Selah
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: strangers have risen against me
  simplified_phrase: hostile outsiders have risen against me
  preserved_meaning: People alien to the speaker have moved against him in hostility.
  reasoning_layer_used: POB lexical decision for זָרִים and קָמוּ עָלַי
  rationale: “Hostile outsiders” avoids implying mere unfamiliarity while retaining the possible outsider sense.
- pob_phrase: ruthless men seek my life
  simplified_phrase: Ruthless men are trying to take my life
  preserved_meaning: The men intend to kill the speaker.
  reasoning_layer_used: POB lexical and theological decisions for בִּקְשׁוּ נַפְשִׁי
  rationale: “Trying to take my life” makes the threat clear without treating נֶפֶשׁ as an immaterial soul.
- pob_phrase: they do not set God before them
  simplified_phrase: They pay no attention to God; they do not keep him before them
  preserved_meaning: They disregard God while retaining the Hebrew image of keeping God in front of them.
  reasoning_layer_used: POB lexical rationale for לֹא שָׂמוּ אֱלֹהִים לְנֶגְדָּם
  rationale: The first clause explains the image, while the second preserves it.
interpretive_expansions:
- pob_phrase: strangers
  rendering: hostile outsiders
  claim: The strangers are alien or estranged people acting as enemies, not merely unknown people.
  evidence:
  - The POB rationale identifies hostile outsiders as contextually plausible.
  - The phrase “risen against me” establishes their hostility.
  confidence: high
  alternatives_preserved:
  - foreigners
  - strangers
- pob_phrase: they do not set God before them
  rendering: They pay no attention to God; they do not keep him before them
  claim: Not setting God before themselves means excluding God from their moral attention.
  evidence:
  - The POB rationale describes the phrase as disregard for God in their moral horizon.
  - The retained image limits the explanatory wording.
  confidence: high
  alternatives_preserved:
  - they do not set God before them
  - God is not before them
