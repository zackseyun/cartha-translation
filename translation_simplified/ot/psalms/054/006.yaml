translation:
  language: en
  text: May evil come back on those who oppose me.[a] In keeping with your faithfulness,[b] destroy them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Evil will come back on those who oppose me. In your faithfulness, you will destroy them.” The Hebrew may state what will happen rather than express a prayer.
    reason: alternative_reading
  - marker: b
    text: Or “truth.” The Hebrew word can mean truth, reliability, or faithfulness.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: return upon my adversaries
  simplified_phrase: come back on those who oppose me
  preserved_meaning: The evil is asked to return upon the psalmist’s hostile opponents.
  reasoning_layer_used: lexical decision for ישוב and לשררי
  rationale: Common wording replaces the formal term “adversaries” without narrowing the opponents to military enemies.
- pob_phrase: in your faithfulness
  simplified_phrase: in keeping with your faithfulness
  preserved_meaning: God is asked to judge in a way consistent with his reliable character.
  reasoning_layer_used: lexical decision for באמתך
  rationale: The added phrase makes the relationship to God’s faithfulness easier to understand.
- pob_phrase: May evil return ...; ... destroy them
  simplified_phrase: May evil come back.... In keeping with your faithfulness, destroy them.
  preserved_meaning: The verse remains a forceful prayer for divine judgment rather than a flat prediction.
  reasoning_layer_used: theological decision on imprecatory force
  rationale: Two sentences clarify the prayer while retaining both its wish and its command.
translation_notes:
  risk_flags:
  - risk: The first Hebrew verb may be predictive rather than prayerful.
    mitigation: Footnote a preserves the declarative reading documented by POB.
  - risk: “Faithfulness” does not display the full range of the Hebrew word.
    mitigation: Footnote b preserves “truth” and notes the word’s broader sense.
