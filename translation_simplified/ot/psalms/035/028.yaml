translation:
  language: en
  text: And my tongue will speak of your righteousness and praise you all day long.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “your justice”; the Hebrew word can include God’s just vindication.
    reason: lexical_alternative
