translation:
  language: en
  text: Let those who are glad when I am shown to be in the right[a] shout for joy and rejoice. Let them always say, “May Yahweh be honored as great! He delights in the well-being of his servant[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “my righteousness” or “my justice.” The Hebrew here probably means that the psalmist is shown to be in the right.
    reason: lexical_alternative
  - marker: b
    text: Or “peace” or “prosperity.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: those who delight in my vindication
  simplified_phrase: those who are glad when I am shown to be in the right
  preserved_meaning: The psalmist’s supporters welcome a favorable judgment against his accusers.
  reasoning_layer_used: Lexical and theological decisions on צִדְקִי
  rationale: The wording explains the legal sense of “vindication” without implying moral perfection.
- pob_phrase: let them say continually
  simplified_phrase: Let them always say
  preserved_meaning: Their praise of Yahweh is to continue.
  reasoning_layer_used: Lexical decision on תָמִיד
  rationale: “Always” is more familiar than “continually.”
- pob_phrase: May Yahweh be magnified, who delights
  simplified_phrase: May Yahweh be honored as great! He delights
  preserved_meaning: The speakers call for Yahweh’s greatness to be publicly acknowledged and affirm his care for his servant.
  reasoning_layer_used: Lexical decisions on יִגְדַּל יְהוָה and הֶחָפֵץ
  rationale: Two direct sentences clarify the praise while retaining Yahweh’s personal name.
translation_notes:
  risk_flags:
  - risk: “Honored as great” makes the image of magnifying Yahweh less literal.
    mitigation: It preserves the image’s intended force of openly acknowledging Yahweh’s greatness.
