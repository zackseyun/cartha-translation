translation:
  language: en
  text: Let those who are glad to see me proved right[a] shout for joy and rejoice. Let them always say, “May Yahweh be proclaimed great! He delights in his servant’s peace.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “my righteousness” or “my justice.”
    reason: lexical_alternative
  - marker: b
    text: “Peace” can also include well-being or prosperity.
    reason: lexical_alternative
