- pob_phrase: those who delight in my vindication
  simplified_phrase: those who are glad to see me proved right
  preserved_meaning: The psalmist’s supporters rejoice when he is shown to be in the right.
  reasoning_layer_used: POB lexical and theological decisions on צִדְקִי
  rationale: This replaces legal vocabulary with common wording while retaining the forensic meaning.
- pob_phrase: let them say continually
  simplified_phrase: Let them always say
  preserved_meaning: Their praise of Yahweh is to continue.
  reasoning_layer_used: POB lexical decision on תָמִיד
  rationale: “Always” expresses the ongoing praise more naturally for common readers.
- pob_phrase: May Yahweh be magnified
  simplified_phrase: May Yahweh be proclaimed great
  preserved_meaning: The speakers call for Yahweh’s greatness to be publicly praised.
  reasoning_layer_used: POB lexical decision on יִגְדַּל and theological decision on יְהוָה
  rationale: This makes the praise formula clear while preserving its wish-like force and the divine name.
