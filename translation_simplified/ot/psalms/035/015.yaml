translation:
  language: en
  text: But when I stumbled,[a] they rejoiced and came together. They gathered against me—attackers I did not know.[b] They tore at me and would not stop.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may mean that he limped or that he suffered a time of weakness or downfall.
    reason: lexical_alternative
  - marker: b
    text: The rare Hebrew word may mean “attackers,” but it could instead refer to afflicted or disabled people; the phrase may also mean that they gathered without his knowledge.
    reason: lexical_alternative
  - marker: c
    text: 'This may describe relentless verbal abuse: “They tore at me and were not silent.”'
    reason: lexical_alternative
