translation:
  language: en
  text: Pull out the spear and block the path of those chasing me.[a] Say to my soul, “I am your salvation.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Pull out the spear and the battle-axe against those chasing me,” if the Hebrew names a second weapon.
    reason: alternative_reading
  - marker: b
    text: Or “your deliverance.” The Hebrew can refer to rescue from immediate danger or to salvation more broadly.
    reason: lexical_alternative
