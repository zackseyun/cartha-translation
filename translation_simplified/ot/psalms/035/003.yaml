translation:
  language: en
  text: Take out your spear and block the path of those chasing me.[a] Say to my soul, “I am your salvation.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Take out your spear and battle-axe against those chasing me.” The Hebrew may name a second weapon instead of saying “block the path.”
    reason: alternative_reading
  - marker: b
    text: Or “your deliverance.” The Hebrew can mean rescue from immediate danger as well as salvation more broadly.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Draw the spear
  simplified_phrase: Take out your spear
  preserved_meaning: God is called to ready a spear for action.
  reasoning_layer_used: Lexical decision for וְהָרֵק and חֲנִית
  rationale: “Take out” makes the weapon sense of “draw” immediately clear.
- pob_phrase: block the way against those who pursue me
  simplified_phrase: block the path of those chasing me
  preserved_meaning: God is asked to stop the psalmist’s active pursuers.
  reasoning_layer_used: Lexical decisions for וּסְגֹר, לִקְרַאת, and רֹדְפָי
  rationale: The new wording states the physical action in common English.
translation_notes:
  risk_flags:
