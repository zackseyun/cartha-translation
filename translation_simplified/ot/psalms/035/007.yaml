- pob_phrase: dug it for my life
  simplified_phrase: dug a pit for me
  preserved_meaning: They dug the pit against the psalmist himself without specifying whether their precise aim was capture, injury, or death.
  reasoning_layer_used: POB lexical decisions for חָפְרוּ and לְנַפְשִׁי
  rationale: Using “for me” reflects the documented self-reference without narrowing the threat to an explicit intent to kill.
