simplification_decisions:
- pob_phrase: rise up
  simplified_phrase: come forward
  preserved_meaning: The hostile witnesses present themselves to testify.
  reasoning_layer_used: POB lexical decision for יְקוּמוּן and its legal context
  rationale: “Come forward” makes the courtroom-like action immediately clear while retaining its adversarial force.
- pob_phrase: they ask me about
  simplified_phrase: They question me about
  preserved_meaning: The witnesses confront the speaker with inquiries or accusations.
  reasoning_layer_used: POB lexical alternatives for יִשְׁאָלוּנִי
  rationale: “Question” is natural English and fits the hostile legal setting without overstating it.
- pob_phrase: things I do not know
  simplified_phrase: things I know nothing about
  preserved_meaning: The speaker denies knowledge of the matters raised against him.
  reasoning_layer_used: POB lexical rationale for אֲשֶׁר לֹא יָדַעְתִּי
  rationale: The recast phrase expresses the same claim of ignorance more naturally.
