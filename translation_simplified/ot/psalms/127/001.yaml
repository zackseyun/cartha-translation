translation:
  language: en
  text: 'If Yahweh does not build the house,[c] the builders work hard for nothing. If Yahweh does not guard the city, the watchman stays awake for nothing.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: “House” can also mean a household or dynasty, but the concrete image is primary here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: its builders labor in vain
  simplified_phrase: the builders work hard for nothing
  preserved_meaning: Their strenuous effort is futile without Yahweh's work.
  reasoning_layer_used: Lexical decisions for עָמְלוּ and שָׁוְא
  rationale: Common wording replaces formal terms while preserving effort and futility.
- pob_phrase: unless Yahweh guards the city
  simplified_phrase: If Yahweh does not guard the city
  preserved_meaning: The city's safety depends on Yahweh's protective guarding.
  reasoning_layer_used: Lexical decisions for אִם and יִשְׁמָר עִיר
  rationale: The direct conditional is easier to follow and retains the same force.
- pob_phrase: the watchman stays awake in vain
  simplified_phrase: the watchman stays awake for nothing
  preserved_meaning: The guard's vigilance is futile without Yahweh's protection.
  reasoning_layer_used: Lexical decisions for שָׁקַד, שׁוֹמֵר, and שָׁוְא
  rationale: The concrete wakefulness image remains while “for nothing” clarifies futility.
translation_notes:
  risk_flags:
  - risk: “For nothing” may sound less formal than “in vain.”
    mitigation: Its repetition preserves the Hebrew parallel and clearly expresses futility.
  - risk: Modern readers may assume “house” means only a building.
    mitigation: A footnote preserves the possible senses of household or dynasty.
