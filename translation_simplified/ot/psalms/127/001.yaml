translation:
  language: en
  text: If Yahweh does not build the house[a], all the builders’ hard work accomplishes nothing. If Yahweh does not guard the city, the watchman accomplishes nothing by staying awake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
