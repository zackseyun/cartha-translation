  preserved_meaning: Yahweh’s involvement is the condition for the builders’ work to succeed.
  reasoning_layer_used: Lexical decision for אִם with לֹא
  rationale: The ordinary conditional form is easier to follow and preserves the same force as “unless.”
- pob_phrase: its builders labor in vain
  simplified_phrase: all the builders’ hard work accomplishes nothing
  preserved_meaning: Even strenuous building work is futile without Yahweh.
  reasoning_layer_used: Lexical decisions for עָמְלוּ and שָׁוְא
  rationale: The wording directly explains both the strenuous effort and its failure.
- pob_phrase: the watchman stays awake in vain
  simplified_phrase: the watchman accomplishes nothing by staying awake
  preserved_meaning: The watchman’s vigilance is futile unless Yahweh protects the city.
