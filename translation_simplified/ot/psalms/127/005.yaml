translation:
  language: en
  text: Blessed is the man who fills his quiver with arrows—his children. They will not be publicly disgraced when they speak with enemies at the city gate.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The city gate was where public judgments and civic business took place.
    reason: cultural_note
  - marker: b
    text: Or “when they contend with their enemies” or “when they plead their case against them.”
    reason: lexical_alternative
  - marker: c
    text: 'Or “they will not be ashamed.” Some understand this as referring only to the father: “he will not be put to shame.” The Hebrew verbs are plural.'
    reason: alternative_reading
