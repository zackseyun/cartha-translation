translation:
  language: en
  text: Blessed is the man who fills his quiver with children. They will not be put to shame when they speak with enemies at the city gate.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “they.” It may refer to the father and his children together, or to the family collectively; some understand it as the father alone.
    reason: alternative_reading
  - marker: b
    text: “Speak with” may also mean “contend with” or “plead their case against.”
    reason: lexical_alternative
  - marker: c
    text: The city gate was where public judgments and civic business took place.
    reason: cultural_note
