translation:
  language: en
  text: It is useless for you to get up early and stay up late, eating bread earned through hard work, for he gives sleep to the one he loves.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “for so he gives to the one he loves in sleep,” or “for he gives to the one he loves while that person sleeps.” The Hebrew may mean either that God gives sleep itself or that he gives his gifts during sleep.
    reason: alternative_reading
