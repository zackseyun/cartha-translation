translation:
  language: en
  text: You gain nothing by getting up early and staying up late, eating bread earned through painful work, for God gives sleep to the one he loves.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean, “God gives to the one he loves during sleep,” or “while he sleeps.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: It is in vain for you
  simplified_phrase: You gain nothing
  preserved_meaning: The effort described is futile and brings no real gain.
  reasoning_layer_used: Lexical decision for שָׁוְא
  rationale: The common phrase “gain nothing” expresses the contextual force of “in vain.”
- pob_phrase: to sit up late
  simplified_phrase: staying up late
  preserved_meaning: People extend their waking labor late into the night.
  reasoning_layer_used: Lexical decision for מְאַחֲרֵי שֶׁבֶת
  rationale: This replaces the less familiar idiom while preserving its contrast with rising early.
- pob_phrase: eating the bread of toil
  simplified_phrase: eating bread earned through painful work
  preserved_meaning: Their food comes through burdensome labor.
  reasoning_layer_used: Lexical decision for אֹכְלֵי לֶחֶם הָעֲצָבִים
  rationale: The wording keeps the bread image but explains how toil relates to it.
