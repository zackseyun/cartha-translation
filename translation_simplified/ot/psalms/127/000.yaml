translation:
  language: en
  text: 'A song for going up. Of Solomon.[a]


    If Yahweh does not build the house,[b] the builders work without success. If Yahweh does not protect the city, the guard stays awake without success.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “For Solomon” or “Belonging to Solomon”; the Hebrew may indicate authorship, dedication, or association.
    reason: alternative_reading
  - marker: b
    text: In Hebrew, “house” can also mean a household or dynasty.
    reason: lexical_alternative
