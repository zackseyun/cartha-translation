translation:
  language: en
  text: Hear my prayer, Yahweh. Listen to my cry for help. Do not remain silent in response to my tears.[a] For I live with you as a foreigner—a resident, but not a native—like all my fathers.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “do not be deaf to my tears”; the Hebrew verb most directly means “be silent.”
    reason: lexical_alternative
  - marker: b
    text: Or “like all my ancestors.” The Hebrew literally says “like all my fathers.”
    reason: lexical_alternative
