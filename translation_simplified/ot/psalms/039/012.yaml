translation:
  language: en
  text: Hear my prayer, Yahweh, and listen to my cry. Do not be deaf to my tears.[a] For I am a foreigner with you, a resident without full rights, as all my fathers were.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “do not be silent at my tears.”
    reason: lexical_alternative
  - marker: b
    text: Or “as all my ancestors were.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: give ear to my cry
  simplified_phrase: listen to my cry
  preserved_meaning: Yahweh is directly asked to attend to the psalmist’s desperate plea.
  reasoning_layer_used: The lexical decision permits “listen to” while preserving the parallel appeal to hear.
  rationale: “Listen to” states the Hebrew idiom naturally in modern English.
- pob_phrase: sojourner with you
  simplified_phrase: foreigner with you
  preserved_meaning: The psalmist stands before God as one who does not possess native status.
  reasoning_layer_used: The lexical rationale defines the term as a non-native living without full landed status.
  rationale: “Foreigner” replaces the unfamiliar word “sojourner” without shifting “with you” to the act of living.
- pob_phrase: resident alien
  simplified_phrase: resident without full rights
  preserved_meaning: The psalmist dwells as a resident but lacks the full status of a native.
  reasoning_layer_used: The lexical and theological decisions preserve this as a second, distinct social-status term.
  rationale: The phrase explains the ancient status without incorrectly making short residence its defining feature.
interpretive_expansions:
- pob_phrase: resident alien
  rendering: resident without full rights
  claim: The resident lacks the full standing enjoyed by a native member of the land.
  evidence:
  - The lexical rationale describes one dwelling in a place without full native status.
  - The theological rationale requires preserving the pair’s legal-social nuance.
  confidence: high
  alternatives_preserved:
  - resident alien
translation_notes:
  risk_flags:
  - risk: “Foreigner” and “resident without full rights” cannot reproduce every distinction between the two ancient status terms.
    mitigation: The translation keeps two separate expressions and makes the second term’s lack of full native status explicit.
