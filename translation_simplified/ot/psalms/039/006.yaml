translation:
  language: en
  text: Surely a man goes about like a shadow.[a] Surely people are in a pointless uproar. He piles up wealth but does not know who will gather it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word literally means “image” and here pictures human life as insubstantial, like a shadow or phantom.
    reason: lexical_alternative
