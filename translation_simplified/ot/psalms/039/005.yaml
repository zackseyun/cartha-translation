  preserved_meaning: Human life is pictured as no longer than a few small hand-widths.
  reasoning_layer_used: POB lexical decisions for טְפָחוֹת and יָמַי
  rationale: Adding “only” and “long” makes the measurement clear while keeping the concrete image.
- pob_phrase: altogether vapor
