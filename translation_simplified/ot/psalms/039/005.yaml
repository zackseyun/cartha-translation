translation:
  language: en
  text: See, you have made my days mere hand-widths long, and my lifetime is like nothing before you. Surely every man[a], even when he stands firm[b], is nothing but vapor[c]. Selah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Every man” refers here to every human being, or to all humanity.
    reason: lexical_alternative
  - marker: b
