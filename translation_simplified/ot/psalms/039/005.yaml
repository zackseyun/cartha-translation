translation:
  language: en
  text: See, you have made my days only a few handbreadths long. My entire lifetime is like nothing before you. Surely every man,[a] even when he seems to stand firm, is nothing but vapor.[b] Selah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, every human being; the Hebrew uses “man” as a generic singular.
    reason: lexical_alternative
  - marker: b
    text: Or “mere breath”; the image describes life as fleeting and impossible to hold onto.
    reason: lexical_alternative
  - marker: c
    text: Selah is a Hebrew musical or liturgical term whose precise meaning is uncertain.
    reason: source_note
