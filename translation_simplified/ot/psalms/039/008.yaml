  - The verse is a prayer addressed to God.
  confidence: high
  alternatives_preserved:
  - my transgressions
  - my offenses
- pob_phrase: the reproach of a fool
  rendering: an object of scorn to a fool
  claim: The chosen reading makes the speaker the target of a morally foolish person’s scorn.
  evidence:
  - The POB theological decision chooses reproach directed from a fool.
  - The lexical rationale describes חֶרְפָּה as relational and public shame.
  confidence: high
  alternatives_preserved:
  - a disgrace because of my folly
