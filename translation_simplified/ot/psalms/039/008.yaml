translation:
  language: en
  text: Rescue me from all my rebellion against you. Do not let me become an object of scorn to a fool.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Do not let me become a disgrace because of my folly.” The Hebrew can mean either that a fool scorns the speaker or that the speaker is disgraced in connection with folly.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Deliver me from all my transgressions
  simplified_phrase: Rescue me from all my rebellion against you
  preserved_meaning: The speaker asks God to free him from all his offenses as rebellion against rightful authority.
  reasoning_layer_used: Lexical decisions for הַצִּילֵנִי and פְּשָׁעַי
  rationale: Common wording retains the collective force of “all” and makes the moral sense clear.
- pob_phrase: do not make me the reproach of a fool
  simplified_phrase: Do not let me become an object of scorn to a fool
  preserved_meaning: The speaker asks God not to let a morally foolish person make him an object of public shame.
  reasoning_layer_used: Theological decision on shame before the wicked
  rationale: The recast wording clearly shows that the fool directs the scorn at the speaker.
interpretive_expansions:
- pob_phrase: my transgressions
  rendering: my rebellion against you
  claim: The offenses are rebellion against God, whom the speaker addresses.
  evidence:
