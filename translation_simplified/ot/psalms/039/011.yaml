translation:
  language: en
  text: You discipline a man by rebuking him for his sin. Like a moth, you eat away what he treasures.[a] Surely every man is vapor.[b] Selah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may refer to his beauty, his treasured things, or more broadly whatever is precious to him.
    reason: lexical_alternative
  - marker: b
    text: “Vapor” pictures human life as brief and insubstantial, like a breath that quickly disappears; traditionally, “vanity.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: With rebukes for iniquity you discipline a man
  simplified_phrase: You discipline a man by rebuking him for his sin
  preserved_meaning: God corrects a man because of his wrongdoing.
  reasoning_layer_used: Lexical decisions for בְּתוֹכָחוֹת, עַל עָוֺן, יִסַּרְתָּ, and אִישׁ
  rationale: The active clause makes the means and reason for the discipline immediately clear.
- pob_phrase: like a moth you consume what is precious to him
  simplified_phrase: Like a moth, you eat away what he treasures
  preserved_meaning: God causes a man's prized good to waste away gradually, as a moth does.
  reasoning_layer_used: Lexical decisions for וַתֶּמֶס, כָּעָשׁ, and חֲמוּדוֹ
  rationale: “Eat away” makes the moth image natural while retaining its destructive force.
- pob_phrase: surely every man is vapor
  simplified_phrase: Surely every man is vapor
  preserved_meaning: Every human being is transient and insubstantial.
  reasoning_layer_used: Lexical decisions for אַךְ, הֶבֶל, and כָּל אָדָם; generic masculine theological decision
  rationale: The concrete image and representative masculine wording remain important and already read clearly.
