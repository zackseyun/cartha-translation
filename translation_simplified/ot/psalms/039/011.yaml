translation:
  language: en
  text: You discipline a man for his sin by rebuking him. Like a moth, you eat away what he treasures.[a] Surely every man is vapor—here briefly and soon gone.[b] Selah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean, “you make his beauty or treasured things waste away like a moth.”
    reason: lexical_alternative
  - marker: b
    text: “Vapor” pictures human life as brief and insubstantial; traditionally, “vanity.”
    reason: lexical_alternative
  - marker: c
    text: “Selah” is an uncertain musical or liturgical term.
    reason: source_note
