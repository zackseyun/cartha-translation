simplification_decisions:
- pob_phrase: Let the wicked fall
  simplified_phrase: May all the wicked fall
  preserved_meaning: The line remains a prayer for the collective downfall of the wicked.
  reasoning_layer_used: Lexical decision for יִפְּלוּ and the prayer context
  rationale: “May” expresses the prayer naturally, while “all” clarifies the collective group.
- pob_phrase: fall into their own nets together
  simplified_phrase: fall together into their own nets
  preserved_meaning: The wicked fall collectively into the traps identified as their own.
  reasoning_layer_used: Lexical decisions for יַחַד and בְּמַכְמֹרָיו plus the applied revision
  rationale: Moving “together” beside “fall” clearly conveys collective action without implying immediacy.
