translation:
  language: en
  text: May all the wicked fall together into their own nets,[a] while I pass by.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be rendered “into his nets,” treating the wicked collectively.
