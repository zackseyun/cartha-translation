simplification_decisions:
- pob_phrase: my eyes are toward you
  simplified_phrase: I keep my eyes fixed on you
  preserved_meaning: The speaker directs his attention to Yahweh in watchful dependence.
  reasoning_layer_used: lexical decision for אֵלֶיךָ with עֵינַי
  rationale: The active wording makes the Hebrew eye image immediately clear.
- pob_phrase: O Yahweh, my Lord; in you I take refuge
  simplified_phrase: Yahweh, my Lord. I take refuge in you.
  preserved_meaning: The prayer addresses Yahweh by name and confesses trust in him as Lord and refuge.
  reasoning_layer_used: theological decision on the divine address and lexical decision for חָסִיתִי
  rationale: Two short sentences clarify the address without changing its theology.
- pob_phrase: Do not lay me bare
  simplified_phrase: Do not leave me exposed
  preserved_meaning: The speaker asks Yahweh not to leave his life unprotected and vulnerable to destruction.
  reasoning_layer_used: source audit and lexical rationale for אַל תְּעַר נַפְשִׁי
  rationale: “Exposed” preserves the Hebrew image while avoiding an unnatural English expression.
