translation:
  language: en
  text: Let a righteous man strike me—it is an act of kindness. Let him rebuke me. His rebuke is like welcome oil on my head; may I not refuse it.[a] For I still pray against the evil they do.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oil on the head pictures something welcome, refreshing, or honoring; the Hebrew wording for refusing it is difficult.
    reason: simplification_note
  - marker: b
    text: The final line is uncertain; it may instead mean, “I still pray when calamity comes upon them,” or, “Even then I pray for them in their troubles.”
    reason: alternative_reading
