  rationale: “Someone” and “ground” make the scene immediate, while “breaks open” preserves its violent force.
- pob_phrase: at the mouth of Sheol
  simplified_phrase: at the mouth of Sheol
  preserved_meaning: Sheol remains pictured as a realm of death with a devouring mouth.
  reasoning_layer_used: POB lexical and theological decisions for לְפִי and שְׁאוֹל
  rationale: The concrete image and the carefully bounded Hebrew concept are both retained.
