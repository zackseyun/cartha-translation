translation:
  language: en
  text: Just as someone plows and breaks open the ground, our bones have been scattered at the mouth of Sheol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheol is the Hebrew term for the realm of the dead; it is also translated “the grave,” but it does not necessarily mean “hell.”
    reason: cultural_note
