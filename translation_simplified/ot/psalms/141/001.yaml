simplification_decisions:
- pob_phrase: O Yahweh, I call to you
  simplified_phrase: Yahweh, I am calling to you
  preserved_meaning: David directly addresses Yahweh in an urgent prayer.
  reasoning_layer_used: Lexical decision for קְרָאתִיךָ and theological decision for יְהוָה
  rationale: The progressive wording makes the immediate prayer setting natural while retaining the divine name.
- pob_phrase: hurry to me
  simplified_phrase: Come to me quickly
  preserved_meaning: The speaker urgently asks Yahweh to act without delay.
  reasoning_layer_used: Lexical decision for חוּשָׁה לִּי
  rationale: This uses ordinary modern word order without weakening the urgency.
- pob_phrase: Give ear to my voice
  simplified_phrase: Hear my voice
  preserved_meaning: The speaker asks Yahweh to listen attentively to his prayer.
  reasoning_layer_used: Lexical decisions for הַאֲזִינָה and קוֹלִי
  rationale: “Hear my voice” is clear English and keeps the source image of the speaker’s voice.
