  text: May my prayer be set before you like incense.[a] May my raised hands be like the evening offering.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Be set before you” can also mean “be firmly placed” or “be prepared” in your presence.
    reason: lexical_alternative
