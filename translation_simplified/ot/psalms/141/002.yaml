translation:
  language: en
  text: May my prayer be placed before you like incense.[a] May my raised hands be like the offering given in the evening.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “be prepared” or “be set in order.”
    reason: lexical_alternative
  - marker: b
    text: This was the regular evening offering; the Hebrew term can specifically refer to a grain offering.
    reason: cultural_note
