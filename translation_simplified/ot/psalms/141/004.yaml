translation:
  language: en
  text: Do not turn my heart toward anything evil,[a] or toward doing wicked deeds with men who do evil. And do not let me eat their finest foods.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “an evil matter” or “an evil word.”
    reason: lexical_alternative
  - marker: b
