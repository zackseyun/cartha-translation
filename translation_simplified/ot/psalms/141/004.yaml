    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Do not incline my heart to any evil thing
  simplified_phrase: Do not turn my heart toward anything evil
  preserved_meaning: God is asked to keep the psalmist’s inner will from leaning toward evil.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Turn toward” makes the heart image clearer while retaining God’s direct agency.
- pob_phrase: to practice wicked deeds with men who work iniquity
  simplified_phrase: or toward doing wicked deeds with men who do evil
  preserved_meaning: The prayer rejects active participation in evil alongside evildoers.
  reasoning_layer_used: lexical decisions
  rationale: Common verbs replace “practice” and “work iniquity” without weakening the moral force.
- pob_phrase: let me not eat of their delicacies
  simplified_phrase: do not let me eat their finest foods
  preserved_meaning: The concrete image of eating the evildoers’ choice foods remains intact.
  reasoning_layer_used: lexical decision and footnote c
  rationale: “Finest foods” explains the less familiar word “delicacies” in ordinary English.
