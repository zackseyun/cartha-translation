translation:
  language: en
  text: The fear of Yahweh is where wisdom begins. All who practice it have good understanding.[a] His praise stands forever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean, “All who obey his commands have good understanding.”
