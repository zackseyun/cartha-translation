  reasoning_layer_used: Lexical and theological decisions on רֵאשִׁית and יִרְאַת יְהוָה
  rationale: The active wording is easier to grasp while retaining both “begins” and the full force of “fear.”
- pob_phrase: good understanding belongs to all who practice them
