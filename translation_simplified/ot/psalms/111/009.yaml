  text: 'He sent redemption to his people.


    He decreed that his covenant would last forever.


    His name is holy and inspires reverent awe.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “is to be feared.” The Hebrew includes the sense of reverent fear.
    reason: lexical_alternative
