translation:
  language: en
  text: He sent redemption to his people. He has commanded that his covenant last forever. His name is holy and awesome.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “awe-inspiring” or “worthy of reverent fear.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: he has commanded his covenant forever
  simplified_phrase: He has commanded that his covenant last forever
  preserved_meaning: God authoritatively decreed his covenant’s enduring validity without specifying the mechanism.
  reasoning_layer_used: POB lexical and theological decisions on צִוָּה and לְעוֹלָם
  rationale: The added clause makes the difficult construction natural while avoiding a command addressed to the covenant itself.
- pob_phrase: Holy and awesome is his name
  simplified_phrase: His name is holy and awesome
  preserved_meaning: God’s name is holy and evokes reverent awe.
  reasoning_layer_used: POB lexical decisions on קָדוֹשׁ, וְנוֹרָא, and שְׁמוֹ
  rationale: Normal English word order makes the declaration immediately clear.
interpretive_expansions:
- pob_phrase: his covenant forever
  rendering: that his covenant last forever
  claim: The word “forever” describes the covenant’s enduring validity.
  evidence:
  - The POB rationale identifies the covenant’s enduring validity while declining to specify its mechanism.
  - The lexical decision renders לְעוֹלָם as “forever.”
  confidence: high
  alternatives_preserved:
  - he has commanded his covenant forever
  - he has ordained his covenant forever
  - he has established his covenant forever
translation_notes:
  risk_flags:
  - risk: Modern “awesome” can sound casual and lose the sense of reverent fear.
    mitigation: The footnote preserves the stronger senses “awe-inspiring” and “worthy of reverent fear.”
  - risk: The clause with “commanded” may still sound unusual in English.
    mitigation: The that-clause clarifies the result while preserving the POB’s source-driven lexical choice.
