translation:
  language: en
  text: For no one remembers you in death. Who in Sheol[a] will give thanks to you?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheol means the realm of the dead; it may also be translated “the grave.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: in death there is no remembrance of you
  simplified_phrase: no one remembers you in death
  preserved_meaning: Death is presented as the condition in which the LORD is no longer remembered.
  reasoning_layer_used: Lexical decision for בַּמָּוֶת and זִכְרֶךָ
  rationale: The active wording expresses the same thought in more natural English.
- pob_phrase: in Sheol who will give thanks to you?
  simplified_phrase: Who in Sheol will give thanks to you?
  preserved_meaning: The rhetorical question expects that no one in Sheol gives thanks to God.
  reasoning_layer_used: Lexical and theological decisions for שְׁאוֹל and יוֹדֶה לָּךְ
  rationale: Reordering the phrase makes the question easier to read while retaining Sheol.
translation_notes:
  risk_flags:
  - risk: “Remembers” may sound only mental, though the Hebrew can include memorial mention.
    mitigation: The parallel phrase “give thanks to you” keeps public, worshipful remembrance in view.
  - risk: Some readers may not know what Sheol means.
    mitigation: The footnote explains it without reducing the main text to the narrower word “grave.”
