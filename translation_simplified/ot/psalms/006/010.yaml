simplification_decisions:
- pob_phrase: Let all my enemies be ashamed and greatly terrified
  simplified_phrase: May all my enemies be ashamed and filled with terror
  preserved_meaning: The line remains a plea that every enemy experience shame and intense fear.
  reasoning_layer_used: Lexical decisions for יֵבֹשׁוּ, וְיִבָּהֲלוּ, מְאֹד, and כָּל אֹיְבָי
  rationale: “May” states the petition naturally, while “filled with terror” retains its emotional intensity.
- pob_phrase: let them turn back and be ashamed in an instant
  simplified_phrase: May they turn back and suddenly be ashamed
  preserved_meaning: The enemies turn back and experience the repeated shame suddenly.
  reasoning_layer_used: Lexical decisions for יָשֻׁבוּ, יֵבֹשׁוּ, and רָגַע
  rationale: “Suddenly” gives the timing clear scope over the repeated shame while keeping the reversal.
translation_notes:
  risk_flags:
  - risk: “Filled with terror” recasts rather than directly translates “greatly terrified.”
    mitigation: The wording retains both the terror of בהל and the intensifying force of מְאֹד.
