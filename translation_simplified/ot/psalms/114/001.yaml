simplification_decisions:
- pob_phrase: went out from Egypt
  simplified_phrase: left Egypt
  preserved_meaning: Israel departed from Egypt.
  reasoning_layer_used: The lexical decision identifies separation and exodus movement.
  rationale: “Left Egypt” expresses the same movement in direct, common English.
- pob_phrase: the house of Jacob
  simplified_phrase: Jacob’s descendants
  preserved_meaning: The phrase names the covenant people descended from Jacob.
  reasoning_layer_used: The lexical rationale defines the expression as Jacob’s descendants, parallel to Israel.
  rationale: The clearer wording preserves the family-based identity without requiring knowledge of the Hebrew idiom.
- pob_phrase: a people of strange speech
  simplified_phrase: a people whose language was foreign to them
  preserved_meaning: Egypt’s language was foreign or unintelligible from Israel’s perspective.
  reasoning_layer_used: The lexical decision and footnote establish linguistic foreignness rather than ethnic hostility.
  rationale: The rendering states the intended language barrier without the potentially misleading word “strange.”
interpretive_expansions:
- pob_phrase: the house of Jacob from a people
  rendering: when Jacob’s descendants left a people
  claim: The second line repeats the departure described in the first line.
  evidence:
