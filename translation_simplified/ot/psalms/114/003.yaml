translation:
  language: en
  text: The sea saw and ran away; the Jordan River turned and went back.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This poetic picture recalls Israel crossing the sea during the exodus and crossing the Jordan in Joshua’s day.
