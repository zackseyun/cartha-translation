simplification_decisions:
- pob_phrase: fled
  simplified_phrase: ran away
  preserved_meaning: The sea is poetically pictured as retreating in fear or haste.
  reasoning_layer_used: The lexical alternatives and rationale for וַיָּנֹס preserve the personification and motion of fleeing.
  rationale: “Ran away” is more immediately familiar than “fled” while keeping the vivid image.
- pob_phrase: the Jordan
  simplified_phrase: the Jordan River
  preserved_meaning: The named body of water is the Jordan.
  reasoning_layer_used: The lexical decision explicitly permits “the Jordan River” as an alternative.
  rationale: Adding “River” helps readers who may not recognize the place name.
- pob_phrase: turned back
  simplified_phrase: turned and went back
  preserved_meaning: The Jordan’s waters are poetically described as reversing direction.
  reasoning_layer_used: The Hebrew lexical rationale identifies the sense as turning or going back.
  rationale: The expanded verb phrase makes the movement easier to picture.
