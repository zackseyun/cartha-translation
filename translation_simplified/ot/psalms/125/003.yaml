  preserved_meaning: The scepter remains an image of oppressive governing power.
  reasoning_layer_used: Lexical decision for שֵׁבֶט and theological decision on wicked dominion
  rationale: Adding “rule” makes the governing image immediately clear.
- pob_phrase: will not rest on the portion of the righteous
  simplified_phrase: will not remain over the allotted share of the righteous
  preserved_meaning: Wicked dominion will not continue permanently over the share assigned to the righteous.
  reasoning_layer_used: Lexical decisions for יָנוּחַ and גּוֹרַל plus the source audit
  rationale: “Remain” clarifies duration, while “allotted share” preserves the defined portion.
- pob_phrase: lest the righteous stretch out their hands to wrongdoing
  simplified_phrase: Otherwise, the righteous might reach out their hands to do wrong
  preserved_meaning: Prolonged oppression could lead the righteous to participate actively in evil.
  reasoning_layer_used: Lexical decisions for לְמַעַן לֹא, יִשְׁלְחוּ ... יְדֵיהֶם, and בְּעַוְלָתָה
  rationale: Two direct clauses clarify the prevented result while preserving the hand-reaching image.
