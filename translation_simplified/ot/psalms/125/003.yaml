translation:
  language: en
  text: For the scepter of wicked rule[a] will not remain over the share allotted to the righteous, so that the righteous will not reach out their hands to do wrong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the scepter of the wicked.”
