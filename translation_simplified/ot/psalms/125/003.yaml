simplification_decisions:
- pob_phrase: the scepter of wickedness
  simplified_phrase: the scepter of wicked rule
  preserved_meaning: The scepter remains an image of unjust governing power.
  reasoning_layer_used: Lexical decisions for שֵׁבֶט and הָרֶשַׁע
  rationale: “Wicked rule” explains the governing sense while preserving the source image.
- pob_phrase: will not rest on the lot of the righteous
  simplified_phrase: will not remain over the share allotted to the righteous
  preserved_meaning: Wicked dominion will not permanently settle over the righteous people’s allotted portion.
  reasoning_layer_used: Lexical decisions for יָנוּחַ and גּוֹרַל; theological decision on non-permanence
  rationale: “Remain” preserves non-permanence, while “share allotted” explains “lot” without naming a giver.
- pob_phrase: lest the righteous stretch out their hands to wrongdoing
  simplified_phrase: so that the righteous will not reach out their hands to do wrong
  preserved_meaning: The purpose is to prevent prolonged oppression from leading the righteous into wrongdoing.
  reasoning_layer_used: Lexical decisions for לְמַעַן לֹא, יִשְׁלְחוּ ... יְדֵיהֶם, and בְּעַוְלָתָה
  rationale: “So that” restores the purpose relationship, and the hand image remains understandable.
translation_notes:
  risk_flags:
  - risk: “Scepter” may be unfamiliar as an image of ruling power.
    mitigation: “Wicked rule” directly supplies the image’s governing sense.
