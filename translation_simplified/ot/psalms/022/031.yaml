translation:
  language: en
  text: They will come and proclaim his righteousness[a] to a people not yet born. They will say, “He has done it.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “his justice.” The word can also include his righteous acts of salvation.
    reason: lexical_alternative
  - marker: b
    text: Or “They will proclaim his righteousness, for he has done it.” The final words may give either the message proclaimed or the reason for proclaiming it.
    reason: alternative_reading
