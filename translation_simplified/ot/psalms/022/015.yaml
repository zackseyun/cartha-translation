translation_notes:
  risk_flags:
  - risk: “Broken piece of pottery” is more explanatory than the compact poetic term “potsherd.”
    mitigation: The wording preserves the same dry, brittle object and does not replace the image with an abstraction.
  - risk: The direct statement “you lay me” may sound like a complete explanation of God’s relation to the suffering.
    mitigation: The text retains POB’s direct divine agency without resolving its tension with hostile human action.
