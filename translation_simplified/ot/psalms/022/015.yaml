translation:
  language: en
  text: My strength is dried out like a broken piece of pottery. My tongue sticks to my jaws.[a] You lay me in the dust of death.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “My tongue sticks to the roof of my mouth.” The Hebrew word for this part of the mouth is uncertain.
