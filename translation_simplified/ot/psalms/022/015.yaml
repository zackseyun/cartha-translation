simplification_decisions:
- pob_phrase: is dried up like a potsherd
  simplified_phrase: is dried out like a broken piece of pottery
  preserved_meaning: The sufferer’s bodily strength is gone, pictured as dry and brittle pottery.
  reasoning_layer_used: POB lexical decisions for יָבֵשׁ and כַּחֶרֶשׂ
  rationale: This replaces the uncommon word “potsherd” while keeping the concrete image of dry, broken pottery.
- pob_phrase: and my tongue sticks to my jaws; you lay me
  simplified_phrase: My tongue sticks to my jaws. You lay me
  preserved_meaning: Extreme thirst and God’s direct agency remain distinct ideas.
  reasoning_layer_used: POB lexical decisions and theological decision on agency
  rationale: The sentence break makes both ideas easier to follow without weakening the direct address to God.
translation_notes:
  risk_flags:
