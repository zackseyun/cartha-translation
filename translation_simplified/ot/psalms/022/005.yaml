translation:
  language: en
  text: They cried out to you, and you rescued them.[a] They trusted in you and were not put to shame.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “they escaped” or “they were delivered.” Here it describes God rescuing them when they cried out.
    reason: lexical_alternative
  - marker: b
    text: This can also mean that they were not disgraced or disappointed because they trusted in God.
    reason: lexical_alternative
