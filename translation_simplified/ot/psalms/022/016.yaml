translation:
  language: en
  text: For dogs have surrounded me. A band of evildoers has closed in around me. Like a lion, they are at my hands and feet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew wording is difficult and literally reads “like a lion my hands and feet.” The Dead Sea Scrolls, the Septuagint, and many translations read “they pierced my hands and feet” or “they dug through my hands and feet.”
    reason: textual_variant
