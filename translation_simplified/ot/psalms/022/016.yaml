translation:
  language: en
  text: 'For dogs have closed in around me;

    a band of evildoers has surrounded me;

    like a lion—my hands and feet.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Hebrew reads, “like a lion—my hands and my feet,” an incomplete and difficult phrase. Some ancient witnesses reflect a different reading: “they pierced” or “they dug through my hands and feet.”'
    reason: textual_variant
