translation:
  language: en
  text: I am like water poured out. Every bone in my body is out of joint. My heart has become like wax; it has melted inside me.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “melted within my inward parts.”
