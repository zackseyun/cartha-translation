simplification_decisions:
- pob_phrase: I am poured out like water
  simplified_phrase: I am like water poured out
  preserved_meaning: The speaker pictures himself as spilled out and completely depleted.
  reasoning_layer_used: Lexical decisions for כַּמַּיִם and נִשְׁפַּכְתִּי
  rationale: Reordering the simile makes it easier to follow while preserving the image of water being poured out.
- pob_phrase: all my bones are out of joint
  simplified_phrase: Every bone in my body is out of joint
  preserved_meaning: The image encompasses the speaker’s whole body.
  reasoning_layer_used: Lexical decisions for וְהִתְפָּרְדוּ and כָּל עַצְמוֹתַי
  rationale: The wording states the total bodily scope in natural English without weakening the image.
- pob_phrase: my heart has become like wax, melted within me
  simplified_phrase: My heart has become like wax; it has melted inside me
  preserved_meaning: His heart is compared to wax that melts deep within him.
  reasoning_layer_used: Lexical and theological decisions for הָיָה לִבִּי, כַּדּוֹנָג, נָמֵס, and בְּתוֹךְ מֵעָי
  rationale: Two clauses clarify the melting while retaining the comparison and the footnote’s visceral wording.
translation_notes:
  risk_flags:
  - risk: “Inside me” is less anatomically vivid than the Hebrew expression.
    mitigation: The footnote preserves the more literal wording “within my inward parts.”
