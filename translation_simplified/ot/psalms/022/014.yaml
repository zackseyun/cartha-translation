simplification_decisions:
- pob_phrase: and all my bones are out of joint
  simplified_phrase: Every bone in my body is out of joint.
  preserved_meaning: The wording keeps both the totality and the bodily image of bones coming apart.
  reasoning_layer_used: POB lexical decision for כָּל עַצְמוֹתַי and וְהִתְפָּרְדוּ
  rationale: A separate sentence and singular collective phrasing make the image easier to grasp.
- pob_phrase: my heart has become like wax, melted within me
  simplified_phrase: My heart has become like wax; it has melted inside me.
  preserved_meaning: The heart changes into a wax-like state and is described as melted internally.
  reasoning_layer_used: POB lexical and theological decisions for הָיָה לִבִּי, כַּדּוֹנָג, נָמֵס, and בְּתוֹךְ מֵעָי
  rationale: Two direct clauses clarify what has melted while preserving the transition and visceral image.
translation_notes:
  risk_flags:
  - risk: “Every bone in my body” makes the implicit bodily setting explicit.
    mitigation: The Hebrew already says “all my bones,” so the clarification does not change the scope.
