  simplified_phrase: All you descendants of Jacob
  preserved_meaning: Every member of Jacob’s people is directly called to honor God.
  reasoning_layer_used: Lexical decision and immediate grammar
  rationale: “Descendants” is clearer in common English, while “all” keeps the summons comprehensive.
- pob_phrase: all offspring of Israel
  simplified_phrase: All you descendants of Israel
  preserved_meaning: The parallel call includes the whole people of Israel.
  reasoning_layer_used: Lexical decision and poetic parallelism
  rationale: The repeated wording keeps the Hebrew lines parallel and makes the direct address natural.
- pob_phrase: Stand in awe of him
  simplified_phrase: stand in awe of him
  preserved_meaning: The command expresses fearful reverence rather than mere admiration or terror.
  reasoning_layer_used: Theological decision on וְגוּרוּ מִמֶּנּוּ
  rationale: The phrase is retained because it preserves the distinction between fearing Yahweh and responding with reverent awe.
