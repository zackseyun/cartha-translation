translation:
  language: en
  text: From the womb, I was cast into your care. From inside my mother, you have been my God.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “From inside my mother, you are my God.” The Hebrew can describe either the present relationship or its continuation from before birth.
