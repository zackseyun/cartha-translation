simplification_decisions:
- pob_phrase: Commit yourself to Yahweh
  simplified_phrase: Entrust yourself to Yahweh
  preserved_meaning: The sufferer is told to place himself or his cause in Yahweh’s care.
  reasoning_layer_used: Lexical decision for גֹּל and its idiom with אֶל
  rationale: “Entrust” communicates the idiom more directly while the footnote preserves the image of rolling.
- pob_phrase: let him rescue him; let him deliver him
  simplified_phrase: Let Yahweh rescue him! Let Yahweh deliver him
  preserved_meaning: The mockers challenge Yahweh to save the afflicted man, retaining both parallel verbs.
  reasoning_layer_used: Lexical decisions for יְפַלְּטֵהוּ and יַצִּילֵהוּ
  rationale: Naming Yahweh clarifies the rescuer without merging “rescue” and “deliver.”
- pob_phrase: since he delights in him
  simplified_phrase: since Yahweh delights in him
  preserved_meaning: The taunt claims Yahweh’s delight in the afflicted man as the reason he should deliver him.
  reasoning_layer_used: Lexical decisions for חָפֵץ בּוֹ and theological decision on pronominal reference
  rationale: Repeating Yahweh makes the first pronoun’s referent clear while leaving the afflicted man as “him.”
