translation:
  language: en
  text: People who have been brought low[a] will eat and be satisfied.[b] Those who seek Yahweh will praise him. May your hearts live forever.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be translated “the humble,” “the poor,” or “the meek.”
    reason: lexical_alternative
  - marker: b
    text: In this psalm, the eating may refer to a sacrificial meal, but the verse does not say so directly.
    reason: cultural_note
  - marker: c
    text: Here “hearts” refers to the inner lives of the people being blessed.
    reason: simplification_note
