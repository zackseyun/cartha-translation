translation:
  language: en
  text: For he did not despise the suffering of the afflicted one[a] or turn away from it in disgust. He did not hide his face from him. When the afflicted one cried out to him, he heard.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the misery of the poor” or “the humiliation of the afflicted.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: despised or abhorred the affliction of the afflicted
  simplified_phrase: despise the suffering of the afflicted one or turn away from it in disgust
  preserved_meaning: God neither treated the person’s suffering with contempt nor regarded it as loathsome.
  reasoning_layer_used: Lexical decisions for בָזָה, שִׁקַּץ, עֱנוּת, and עָנִי.
  rationale: Common wording preserves both the suffering and the stronger force of the second verb.
- pob_phrase: he has not hidden his face from him
  simplified_phrase: He did not hide his face from him.
  preserved_meaning: God did not withhold his favorable attention or presence.
  reasoning_layer_used: Lexical decision for הִסְתִּיר פָּנָיו.
  rationale: A separate sentence makes the biblical image easier to follow without removing it.
- pob_phrase: but when he cried to him, he heard
  simplified_phrase: When the afflicted one cried out to him, he heard.
  preserved_meaning: God heard the afflicted person’s urgent appeal for help.
  reasoning_layer_used: Lexical decisions for בְשַׁוְּעוֹ, אֵלָיו, and שָׁמֵעַ.
  rationale: Repeating the afflicted one clarifies the pronoun while keeping “heard” rather than adding “answered.”
translation_notes:
  risk_flags:
  - risk: Repeating “the afflicted one” may sound more generic than the singular pronouns in POB.
    mitigation: The wording remains singular and does not decide between the psalmist, a messianic sufferer, and a broader principle.
  - risk: Modern readers may not immediately grasp the image of God hiding his face.
    mitigation: The image is retained because it is understandable in context and the audit identifies it as theologically meaningful.
