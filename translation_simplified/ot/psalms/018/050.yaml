translation:
  language: en
  text: He makes his king’s victories great. He shows steadfast love forever to David, the king he has anointed, and to David’s offspring.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The expression “the king he has anointed” can also be translated “his Messiah.” Here it refers first to David as the LORD’s anointed king.
    reason: alternative_reading
  - marker: b
    text: The Hebrew consonants can also be read, “He is a tower of deliverances for his king.”
    reason: textual_variant
