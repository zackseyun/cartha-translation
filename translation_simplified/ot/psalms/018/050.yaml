translation:
  language: en
  text: He gives his king great victories. He shows steadfast love to the king he has anointed—to David and to his offspring forever.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The opening Hebrew is difficult and may also portray God as “a tower of salvations for his king,” a strong source of repeated rescue; compare 2 Samuel 22:51.
    reason: textual_variant
  - marker: b
    text: “The king he has anointed” can also be translated “his anointed” or “his Messiah.” It refers immediately to David, while also carrying broader messianic resonance in the wider biblical context.
    reason: alternative_reading
  - marker: c
    text: “Offspring” is singular in Hebrew but can refer collectively to David’s royal line while leaving open a messianic reading.
    reason: lexical_alternative
