translation:
  language: en
  text: Yahweh is my rocky cliff, my fortress, and the one who rescues me. He is my God and my rock; I take refuge in him. He is my shield, my horn of salvation,[a] and my secure stronghold.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A horn pictures strength and victorious saving power.
    reason: cultural_note
simplification_decisions:
- pob_phrase: my crag
  simplified_phrase: my rocky cliff
  preserved_meaning: God is pictured as a protective rocky place distinct from “my rock.”
  reasoning_layer_used: Lexical decision for סַלְעִי and the theological decision to preserve distinct protective images.
  rationale: “Rocky cliff” is clearer than “crag” without adding an unsupported detail.
- pob_phrase: my deliverer
  simplified_phrase: the one who rescues me
  preserved_meaning: God causes the speaker to escape from danger.
  reasoning_layer_used: Lexical decision for מְפַלְטִי.
  rationale: The verbal phrase makes the traditional title clear in common English.
- pob_phrase: my God, my rock, in whom I take refuge
  simplified_phrase: He is my God and my rock; I take refuge in him.
  preserved_meaning: God is both the speaker’s stable protector and the one to whom he actively turns for refuge.
  reasoning_layer_used: Lexical decisions for אֵלִי, צוּרִי, and אֶחֱסֶה בּוֹ, reinforced by the grounding review.
  rationale: The separate clause preserves the rock image and the speaker’s active reliance on God.
translation_notes:
  risk_flags:
  - risk: Modern readers may not understand “horn of salvation.”
    mitigation: The anchored footnote explains the image without removing it.
