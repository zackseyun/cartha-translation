simplification_decisions:
- pob_phrase: Yahweh thundered in the heavens, and the Most High
  simplified_phrase: Yahweh thundered in the heavens. The Most High
  preserved_meaning: Yahweh and the Most High refer to the same God acting through the storm.
  reasoning_layer_used: POB lexical decisions and poetic structure
  rationale: Two sentences make the parallel lines easier to follow without changing their meaning.
- pob_phrase: gave his voice
  simplified_phrase: made his voice heard
  preserved_meaning: God’s powerful voice sounds through the storm.
  reasoning_layer_used: POB lexical decision for יִתֵּן קֹלוֹ
  rationale: The approved alternative expresses the Hebrew idiom in natural modern English.
- pob_phrase: —hailstones and coals of fire
  simplified_phrase: —hailstones and coals of fire
  preserved_meaning: The vivid storm elements remain an abrupt continuation without an added verb.
  reasoning_layer_used: POB theological decision on the elliptical clause
  rationale: Retaining the dash preserves the poetry and avoids claiming that the text explicitly says God sent them.
translation_notes:
  risk_flags:
  - risk: The dash leaves the exact grammatical relation of the storm elements unstated.
    mitigation: This preserves the Hebrew ellipsis and the POB’s documented ambiguity.
  - risk: “Coals of fire” may sound unusual to modern readers.
    mitigation: The concrete image is retained so it is not reduced to a specific explanation such as lightning.
