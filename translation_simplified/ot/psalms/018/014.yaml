translation:
  language: en
  text: He shot his arrows and scattered his enemies. He multiplied the lightning bolts[a] and threw his enemies into confusion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “With many lightning bolts, he threw them into confusion.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: He sent out his arrows
  simplified_phrase: He shot his arrows
  preserved_meaning: The divine warrior sent arrows against his enemies.
  reasoning_layer_used: lexical decision for וַיִּשְׁלַח
  rationale: “Shot” states naturally how arrows are sent out as weapons.
- pob_phrase: scattered them
  simplified_phrase: scattered his enemies
  preserved_meaning: The arrows caused David’s enemies to disperse.
  reasoning_layer_used: theological decision on plural suffixes
  rationale: Naming the enemies removes an unclear pronoun without changing its referent.
- pob_phrase: he multiplied lightning bolts
  simplified_phrase: He multiplied the lightning bolts
  preserved_meaning: God used an abundance of lightning as a weapon.
  reasoning_layer_used: lexical decision for רָב and doctrine realignment
  rationale: The wording retains the audited verbal reading and its poetic parallelism.
interpretive_expansions:
- pob_phrase: them
  rendering: his enemies
  claim: Both plural objects refer to David’s enemies.
  evidence:
  - The surrounding psalm presents YHWH as a warrior acting against David’s enemies.
  - The semantics of “threw into confusion” fit people in battle.
  confidence: high
  alternatives_preserved:
  - The suffixes could refer to the arrows or lightning.
translation_notes:
  risk_flags:
  - risk: “Multiplied the lightning bolts” is less idiomatic than “sent many lightning bolts.”
    mitigation: The wording preserves the controlling verbal reading, while the footnote gives the main adverbial alternative.
