simplification_decisions:
- pob_phrase: sent out his arrows
  simplified_phrase: shot his arrows
  preserved_meaning: The divine warrior sends arrows against his enemies.
  reasoning_layer_used: Lexical decision for וַיִּשְׁלַח and martial imagery
  rationale: “Shot” expresses the projection of arrows in direct, natural English.
- pob_phrase: scattered them
  simplified_phrase: scattered his enemies
  preserved_meaning: The arrows cause the enemies to disperse.
  reasoning_layer_used: Theological decision on the plural object suffix
  rationale: Naming the enemies prevents readers from mistaking “them” for the arrows.
- pob_phrase: with abundant lightning
  simplified_phrase: with many lightning bolts
  preserved_meaning: God uses an abundance of lightning as a weapon in the storm battle scene.
  reasoning_layer_used: Latest source audit for וּבְרָקִים רָב
  rationale: “Many lightning bolts” makes the compressed image clear without inventing an action such as “hurled.”
interpretive_expansions:
- pob_phrase: scattered them
  rendering: scattered his enemies
  claim: The plural object refers to David’s enemies rather than to the arrows or lightning.
  evidence:
  - The surrounding psalm presents the arrows and lightning as YHWH’s weapons against enemies.
  - The battle sense of המם supports people being thrown into confusion.
  confidence: high
  alternatives_preserved:
  - The suffixes can grammatically be read as referring to the arrows or lightning.
