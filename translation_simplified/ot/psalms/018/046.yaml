simplification_decisions:
- pob_phrase: and blessed be my rock
  simplified_phrase: May my rock be praised!
  preserved_meaning: God remains the rock whose stable protection calls for praise.
  reasoning_layer_used: Lexical rationale and praise context
  rationale: This replaces an inverted blessing formula with a natural English acclamation while keeping the rock image.
- pob_phrase: the God of my salvation
  simplified_phrase: the God who saves me
  preserved_meaning: God is the source of the speaker’s deliverance.
  reasoning_layer_used: Lexical alternatives
  rationale: The verbal form makes the same relationship immediately clear to a modern reader.
- pob_phrase: and exalted be
  simplified_phrase: May ... be lifted high in praise
  preserved_meaning: The line calls for God to be exalted in a doxological acclamation.
  reasoning_layer_used: Theological decision on the jussive-like force
  rationale: This removes archaic word order while preserving both the upward image and the call to praise.
interpretive_expansions:
- pob_phrase: and exalted be
  rendering: May ... be lifted high in praise
  claim: God is to be exalted through praise, not physically raised.
  evidence:
  - The POB identifies the clause as a doxological wish or acclamation.
  - Its parallel with “blessed be” places the action in a praise context.
  confidence: high
  alternatives_preserved:
  - The God who saves me is exalted.
translation_notes:
