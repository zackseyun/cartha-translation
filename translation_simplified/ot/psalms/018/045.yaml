translation:
  language: en
  text: Foreigners[a] wither away; they come trembling out[b] of their fortified places.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “sons of foreigners.”
    reason: lexical_alternative
