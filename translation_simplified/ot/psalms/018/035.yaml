translation:
  language: en
  text: You gave me your salvation as a shield. Your right hand held me up, and your humility in stooping down to help me made me great.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “your gentleness made me great.” The Hebrew word can mean humility, meekness, or gentleness.
