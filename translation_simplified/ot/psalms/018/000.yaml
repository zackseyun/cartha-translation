translation:
  language: en
  text: For the choirmaster. Of David, Yahweh’s servant.[a] David addressed this song to Yahweh when Yahweh rescued him from the grip of all his enemies and from Saul’s grip.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can mean “servant” or “slave”; here it is an honorific title for David.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Of David, the servant of Yahweh
  simplified_phrase: Of David, Yahweh’s servant
  preserved_meaning: David is identified by his honored service to Yahweh without overstating what “Of David” means.
  reasoning_layer_used: Lexical and theological decisions
  rationale: The wording keeps both the conventional heading and the chosen title “servant.”
- pob_phrase: who spoke to Yahweh the words of this song
  simplified_phrase: David addressed this song to Yahweh
  preserved_meaning: The song is David’s direct address to Yahweh.
  reasoning_layer_used: Source syntax and lexical rationale
  rationale: The recasting removes an awkward relative clause while preserving the prayerful address.
- pob_phrase: from the hand of all his enemies and from the hand of Saul
  simplified_phrase: from the grip of all his enemies and from Saul’s grip
  preserved_meaning: Yahweh freed David from his enemies’ power, with Saul named separately.
  reasoning_layer_used: Lexical decision and cultural note
  rationale: “Grip” makes the Hebrew hand image and its sense of control immediately clear.
translation_notes:
  risk_flags:
  - risk: “Addressed this song” is less literal than “spoke the words of this song.”
    mitigation: It preserves both the song and its direct orientation toward Yahweh.
