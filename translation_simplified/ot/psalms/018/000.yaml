translation:
  language: en
  text: For the choirmaster. Of David,[a] the servant of Yahweh.[b] David spoke the words of this song to Yahweh when Yahweh rescued him from the grasp of all his enemies and from Saul’s grasp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Of David” may indicate authorship or association with David.
    reason: source_note
  - marker: b
    text: The Hebrew word can also mean “slave,” but here “servant” is an honored title for David.
    reason: lexical_alternative
