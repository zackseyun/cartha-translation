  simplified_phrase: To a faithful person, you show that you are faithful
  preserved_meaning: God reveals his covenant faithfulness in his dealings with a faithful person.
  reasoning_layer_used: Lexical and theological decisions on חסד and reciprocal divine response
  rationale: The clearer clause keeps both the repeated word and the idea that God shows his character.
- pob_phrase: with the blameless man you show yourself blameless
  simplified_phrase: To a blameless man, you show that you are blameless
  preserved_meaning: God reveals his own integrity in his dealings with a man of integrity.
