translation:
  language: en
  text: When I am in trouble, I call on Yahweh and cry to my God for help. He hears[a] my voice from his temple[b], and my cry comes before him and enters his ears.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “he will hear my voice from his temple ... my cry will come before him and enter his ears.” The Hebrew verbs may refer to the future.
    reason: alternative_reading
  - marker: b
    text: “Temple” may also mean “palace” or “sanctuary,” referring to God’s dwelling place.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: In my distress
  simplified_phrase: When I am in trouble
  preserved_meaning: The speaker is experiencing personal affliction.
  reasoning_layer_used: Lexical decision for בַּצַּר
  rationale: “When I am in trouble” expresses personal distress in common English.
- pob_phrase: and to my God I cry for help
  simplified_phrase: and cry to my God for help
  preserved_meaning: The speaker directs an urgent plea for aid to his God.
  reasoning_layer_used: Lexical decisions for אֶל אֱלֹהַי and אֲשַׁוֵּעַ
  rationale: The natural clause order keeps both the direction and urgency of the plea.
- pob_phrase: my cry before him comes into his ears
  simplified_phrase: my cry comes before him and enters his ears
  preserved_meaning: The cry is before God as it comes into his hearing.
  reasoning_layer_used: Lexical decisions for לְפָנָיו, תָּבוֹא, and בְאָזְנָיו
  rationale: This wording preserves the relation to God and the vivid ear image without implying two destinations.
