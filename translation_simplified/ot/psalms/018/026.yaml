translation:
  language: en
  text: You show your purity in the way you deal with pure people. But in dealing with crooked people, you show yourself twisted.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This can also mean “you show yourself shrewd” or “you outwit the crooked.” God answers their crookedness and overcomes it; he does not become morally crooked.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: With the pure you show yourself pure
  simplified_phrase: You show your purity in the way you deal with pure people
  preserved_meaning: God reveals his moral purity in relation to people who are pure.
  reasoning_layer_used: Lexical decision for נָבָר and תִּתְבָּרָר
  rationale: The rewrite makes the relational sense explicit while retaining the repeated idea of purity.
- pob_phrase: and with the crooked you show yourself twisted
  simplified_phrase: But in dealing with crooked people, you show yourself twisted
  preserved_meaning: God responds to morally crooked people in a way that matches and overturns their crookedness.
  reasoning_layer_used: Theological decision on poetic reciprocity
  rationale: The wording keeps the Hebrew image and rhetorical tension rather than softening it to “shrewd.”
