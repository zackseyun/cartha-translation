    text: More literally, “girds me with strength”; the Hebrew pictures someone fastening a belt to be ready for action.
    reason: lexical_alternative
  - marker: b
    text: Or “makes the course of my life whole.” “Blameless” means living with integrity, not being sinlessly perfect.
    reason: lexical_alternative
