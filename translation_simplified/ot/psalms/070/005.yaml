translation:
  language: en
  text: But I am poor and in need. God, hurry to me![a] You are my helper and my rescuer. Yahweh,[b] do not delay!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “hurry to help me.”
    reason: lexical_alternative
  - marker: b
    text: Yahweh is the personal name of God represented by YHWH in Hebrew.
    reason: source_note
simplification_decisions:
- pob_phrase: But as for me, I am poor and needy
  simplified_phrase: But I am poor and in need
  preserved_meaning: The speaker contrasts his own poverty and urgent need with what came before.
  reasoning_layer_used: Lexical decisions for וַאֲנִי, עָנִי, and וְאֶבְיוֹן
  rationale: The shorter wording keeps the contrast and both aspects of the psalmist’s distress.
- pob_phrase: O God, hurry to me
  simplified_phrase: God, hurry to me!
  preserved_meaning: The psalmist directly urges God to come quickly to him.
  reasoning_layer_used: Lexical decisions for אֱלֹהִים, חוּשָׁה, and לִי
  rationale: Modern direct address and punctuation convey the prayer’s urgency without the formal vocative “O.”
- pob_phrase: You are my help and my deliverer
  simplified_phrase: You are my helper and my rescuer
  preserved_meaning: God is personally the one who helps the psalmist and brings him to safety.
  reasoning_layer_used: Lexical decisions for עֶזְרִי and וּמְפַלְטִי
  rationale: Concrete agent nouns make both distinct roles immediately understandable.
translation_notes:
  risk_flags:
  - risk: “Rescuer” may sound less traditionally theological than “deliverer.”
    mitigation: It preserves the documented source sense of one who causes escape or brings someone to safety.
  - risk: Some readers may not recognize the name Yahweh.
    mitigation: The name is retained as required by the theological decision and briefly identified in a footnote.
