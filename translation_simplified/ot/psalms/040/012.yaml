translation:
  language: en
  text: For evils too many to count surround me. My sins[a] have caught up with me, and I cannot see. They outnumber the hairs on my head, and my heart fails me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can mean my sins, my guilt, or both the wrongdoing and its burden.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: evils beyond number have surrounded me
  simplified_phrase: evils too many to count surround me
  preserved_meaning: Countless harms or calamities hem the speaker in on every side.
  reasoning_layer_used: Lexical decisions for רָעוֹת, עַד אֵין מִסְפָּר, and אָפְפוּ עָלַי
  rationale: The wording makes the idiom immediate while retaining the broad term “evils” and the surrounding image.
- pob_phrase: my iniquities have overtaken me
  simplified_phrase: My sins have caught up with me
  preserved_meaning: The speaker's own wrongdoing and guilt pursue and overcome him.
  reasoning_layer_used: Lexical and theological decisions for עֲוֹנֹתַי and הִשִּׂיגוּנִי
  rationale: “Sins” is more familiar than “iniquities,” while “caught up with” preserves the pursuit image.
- pob_phrase: They are more than the hairs of my head
  simplified_phrase: They outnumber the hairs on my head
  preserved_meaning: His iniquities are pictured as far too numerous to count.
  reasoning_layer_used: Lexical decisions for עָצְמוּ and מִשַּׂעֲרוֹת רֹאשִׁי
  rationale: The active verb states the comparison naturally without weakening its vivid image.
