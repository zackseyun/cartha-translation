  rationale: The rewrite uses ordinary word order while preserving the Hebrew image of something hidden in the heart.
- pob_phrase: I have spoken of your faithfulness and your salvation
  simplified_phrase: I have told others about your faithfulness and your salvation
  preserved_meaning: The speaker publicly declared God's dependability and saving action.
  reasoning_layer_used: Lexical rationale for אמרתי and immediate assembly context
  rationale: “Told others about” makes public proclamation clear in common English.
- pob_phrase: I have not concealed your steadfast love and your truth from the great assembly
  simplified_phrase: I have not hidden your steadfast love and your truth from the great assembly
  preserved_meaning: The speaker did not withhold God's covenant love and truth from the gathered community.
  reasoning_layer_used: Lexical decisions for כחד, חסד, אמת, and קהל רב
  rationale: “Hidden” is more familiar than “concealed” without merging the distinct covenant terms.
