translation:
  language: en
  text: Blessed is the man[a] who has put his trust in Yahweh and has not turned to proud people or to those who turn aside to falsehood.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Blessed” can also mean “happy,” and “the man” represents anyone who lives this way.
    reason: lexical_alternative
