translation:
  language: en
  text: You did not desire sacrifices or offerings.[a] You dug out ears for me—opening them so I can hear you.[b] You did not ask for whole burnt offerings or offerings for sin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Offerings” may refer more specifically to grain offerings.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew literally says, “You dug out ears for me,” likely an image of opening the speaker’s ears to hear God. The ancient Greek translation, quoted in Hebrews 10:5, says, “a body you prepared for me.”
    reason: alternative_reading
