translation:
  language: en
  text: He put a new song in my mouth—a song praising our God. When many people see this, they will fear[a] and put their trust in Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “be in awe” or “show reverence.” The Hebrew word includes both fear and reverent awe.
    reason: lexical_alternative
