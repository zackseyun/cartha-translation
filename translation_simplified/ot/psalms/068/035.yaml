  language: en
  text: From your holy places,[a] God inspires awe. He is the God of Israel, and he gives the people strength and mighty power. Blessed be God!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally “from your sanctuaries”; the plural may refer collectively to God’s holy dwelling, and the phrase may also be understood as “from your sanctuary” or “in your sanctuary.”
    reason: alternative_reading
