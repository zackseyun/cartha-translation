translation:
  language: en
  text: You went up to the heights; you took captives. You received gifts among people[a], even among those who rebel, so that Yah God might dwell there.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “gifts from people”; the Hebrew can mean either “among” or “from” here.
    reason: lexical_alternative
  - marker: b
    text: The final words may also mean “so that Yah God might dwell among them” or “as a dwelling place for Yah God.”
    reason: alternative_reading
