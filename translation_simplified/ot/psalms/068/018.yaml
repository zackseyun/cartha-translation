translation:
  language: en
  text: You ascended on high; you led captives in triumph. You received gifts among the people,[a] even among the rebellious, so that Yah God might dwell there.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “You received gifts from people.” The Hebrew can mean either “among” or “from.”
    reason: lexical_alternative
  - marker: b
    text: The final words may also mean “so that Yah God might dwell among them” or “as a dwelling for Yah God.”
    reason: alternative_reading
