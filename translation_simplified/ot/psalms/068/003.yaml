translation:
  language: en
  text: But[a] righteous people will be glad. They will be overjoyed in God’s presence, and they will rejoice with great joy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “And.” “But” expresses the contrast with the wicked in the previous verse.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the righteous
  simplified_phrase: righteous people
  preserved_meaning: The verse speaks of people who are righteous.
  reasoning_layer_used: POB lexical decision for וְצַדִּיקִים
  rationale: Adding “people” makes the biblical term immediately clear without changing it.
- pob_phrase: they will exult before God
  simplified_phrase: They will be overjoyed in God’s presence
  preserved_meaning: Their exuberant joy takes place in the presence of God.
  reasoning_layer_used: POB lexical decisions for יַעַלְצוּ and לִפְנֵי אֱלֹהִים
  rationale: “Overjoyed” preserves exuberant joy without suggesting a specific celebration, while “in God’s presence” clarifies “before God.”
- pob_phrase: they will rejoice with gladness
  simplified_phrase: they will rejoice with great joy
  preserved_meaning: The repeated joy language intensifies their rejoicing.
  reasoning_layer_used: POB lexical decisions for וְיָשִׂישׂוּ and בְשִׂמְחָה
  rationale: The natural phrase preserves the Hebrew emphasis rather than treating its repetition as redundant.
translation_notes:
  risk_flags:
  - risk: “Overjoyed” states the exuberant emotion more directly than “exult.”
    mitigation: It retains the audited sense of intense, jubilant joy without adding a festal activity.
