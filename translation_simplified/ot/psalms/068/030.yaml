translation:
  language: en
  text: Rebuke the beast among the reeds[a], along with the herd of bulls among the calves of the peoples, trampling on pieces of silver.[b] Scatter the peoples who love war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the wild beast among the reeds,” possibly a picture of Egypt or another hostile power.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew is difficult and may instead describe someone bowing down and offering silver as tribute.
    reason: alternative_reading
