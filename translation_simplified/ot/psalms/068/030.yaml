translation:
  language: en
  text: Rebuke the beast among the reeds[a]—the herd of bulls among the calves of the peoples—which bows down with pieces of silver.[b] He has scattered the peoples who delight in war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The beast may picture Egypt or another hostile power, but the Hebrew does not name it.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew is difficult; this may describe submission through silver tribute, perhaps silver bars or ingots.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the beast of the reeds
  simplified_phrase: the beast among the reeds
  preserved_meaning: The dangerous marsh-animal image remains without identifying the hostile power.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Among” makes the setting natural in English while keeping the metaphor open.
- pob_phrase: submitting itself with pieces of silver
  simplified_phrase: which bows down with pieces of silver
  preserved_meaning: The singular collective is pictured humbling itself in connection with silver.
  reasoning_layer_used: applied revision and source audit
  rationale: “Bows down” clearly conveys self-abasement without adding an unsupported result clause.
- pob_phrase: who delight in wars
  simplified_phrase: who delight in war
  preserved_meaning: These peoples take continuing pleasure in warfare.
  reasoning_layer_used: lexical decision
  rationale: The English mass noun “war” expresses the same ongoing violent preference more naturally.
