translation:
  language: en
  text: Sing to God; sing praises to his name. Prepare the way for the one who rides through the desert plains.[a] Yah is his name.[b] Rejoice greatly before him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “upon the clouds,” though the usual Hebrew meaning is “desert plains.”
    reason: lexical_alternative
  - marker: b
    text: “Yah” is the short form of God’s personal name in Hebrew.
    reason: source_note
