- pob_phrase: went out before your people
  simplified_phrase: set out at the head of your people
  preserved_meaning: God went ahead as the leader of his people.
  reasoning_layer_used: lexical decision and theological decision
  rationale: This wording makes the image of God leading his people immediately clear.
- pob_phrase: when you went out ... when you marched
  simplified_phrase: when you set out ... and marched
  preserved_meaning: Both God's departure and his purposeful march remain distinct actions.
  reasoning_layer_used: source syntax and lexical decisions
  rationale: Joining the parallel clauses with “and” gives the verse a more natural English flow.
- pob_phrase: through the wilderness
  simplified_phrase: through the desolate wilderness
  preserved_meaning: The setting is an uninhabited wilderness region associated with the people's journey.
  reasoning_layer_used: lexical decision and POB footnote
  rationale: Adding “desolate” conveys the Hebrew term's force without replacing the familiar wilderness image.
