simplification_decisions:
- pob_phrase: There is little Benjamin, ruling them
  simplified_phrase: There is little Benjamin, ruling over them.
  preserved_meaning: Little Benjamin is portrayed as exercising rule over the others.
  reasoning_layer_used: POB lexical decisions and applied revision
  rationale: “Ruling over” expresses dominion in natural English without weakening it to procession leadership.
- pob_phrase: the princes of Judah with their throng
  simplified_phrase: the princes of Judah with their company
  preserved_meaning: Judah’s princes appear with an accompanying group while the group’s precise description remains uncertain.
  reasoning_layer_used: POB lexical decision and footnote
  rationale: “Company” is clearer than “throng” and avoids asserting unsupported numerical greatness.
- pob_phrase: the princes of Zebulun; the princes of Naphtali
  simplified_phrase: the princes of Zebulun, and the princes of Naphtali
  preserved_meaning: Each tribe’s princes remain distinctly named in the poetic list.
  reasoning_layer_used: POB translation and source syntax
  rationale: Repeating “the princes” preserves the separate designation without reducing clarity.
translation_notes:
  risk_flags:
  - risk: “Little” may be understood as age rather than Benjamin’s small size or status among the tribes.
    mitigation: It is retained because the compact image is deliberate and the POB lexical decision favors it.
  - risk: “Company” cannot convey every possible nuance of the rare Hebrew word.
    mitigation: The footnote preserves the lexical uncertainty and the alternative “multitude.”
