translation:
  language: en
  text: In the gatherings, bless God—Yahweh—from the fountain of Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is compressed and may mean, “you who come from the fountain of Israel,” describing the worshipers as descendants of Israel.
    reason: alternative_reading
