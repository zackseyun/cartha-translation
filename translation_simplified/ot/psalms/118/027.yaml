translation:
  language: en
  text: Yahweh is God, and he has given us light[a]. Tie the festival offering with cords, up to the altar’s horns—its projecting corners[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “he has shone on us.” The Hebrew can describe Yahweh as giving light or shining upon his people.
    reason: lexical_alternative
