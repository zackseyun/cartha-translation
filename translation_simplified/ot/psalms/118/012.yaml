translation:
  language: en
  text: They closed in around me like a swarm of bees; they died out like a fire among thorns.[a] In Yahweh’s name, I surely cut them down.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be rendered, “they were extinguished like a fire of thorns.” The image is of a thorn fire that flares up and quickly dies out.
    reason: lexical_alternative
  - marker: b
    text: Or, “I cut them off.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: They surrounded me like bees
  simplified_phrase: They closed in around me like a swarm of bees
  preserved_meaning: The enemies encircled the speaker with the threatening movement of bees.
  reasoning_layer_used: POB lexical decisions for סַבּוּנִי and כִדְבוֹרִים
  rationale: “Closed in around me” makes the hostile encirclement immediate, while “swarm” clarifies the bee image.
- pob_phrase: they went out like a fire among thorns
  simplified_phrase: they died out like a fire among thorns
  preserved_meaning: The enemies are compared to a thorn fire that is extinguished.
  reasoning_layer_used: POB lexical decision for דֹּעֲכוּ and revision history
  rationale: “Died out” prevents readers from mistaking “went out” for physical departure while keeping the fire metaphor.
- pob_phrase: In the name of Yahweh
  simplified_phrase: In Yahweh’s name
  preserved_meaning: The speaker acts under or by invoking Yahweh’s name.
  reasoning_layer_used: POB theological decision for יְהוָה and lexical decision for בְּשֵׁם
  rationale: The possessive form is more direct English without choosing between authority and invocation.
