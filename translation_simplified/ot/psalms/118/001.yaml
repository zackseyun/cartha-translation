translation:
  language: en
  text: Thank Yahweh,[a] because he is good and his faithful love never ends.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh is the Hebrew name of God, traditionally rendered “the LORD.”
    reason: source_note
  - marker: b
    text: The Hebrew also conveys loyal love and kindness within a covenant relationship.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Give thanks to Yahweh
  simplified_phrase: Thank Yahweh
  preserved_meaning: The people are commanded to express thanks and praise to Yahweh.
  reasoning_layer_used: Lexical decision for הוֹדוּ and theological decision for YHWH
  rationale: The direct verb “thank” states the same command in simpler English.
- pob_phrase: for he is good, for
  simplified_phrase: because he is good and
  preserved_meaning: Both God’s goodness and his enduring love remain reasons to thank him.
  reasoning_layer_used: Lexical decisions for both occurrences of כִּי and grounding review
  rationale: A single because-clause clearly connects both reasons to the command.
- pob_phrase: his steadfast love endures forever
  simplified_phrase: his faithful love never ends
  preserved_meaning: God’s loyal, covenantal love continues forever.
  reasoning_layer_used: Lexical and theological decisions for חֶסֶד and לְעוֹלָם
  rationale: This wording makes the love’s loyalty and permanence easy to understand.
translation_notes:
  risk_flags:
  - risk: “Faithful love” may not fully communicate the covenantal force of חֶסֶד.
    mitigation: Footnote b preserves its covenant-loyalty nuance.
