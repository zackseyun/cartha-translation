simplification_decisions:
- pob_phrase: The right hand of Yahweh
  simplified_phrase: Yahweh’s right hand
  preserved_meaning: The concrete biblical image of Yahweh’s power and victorious action remains intact.
  reasoning_layer_used: POB lexical and theological decisions on יְמִין and יְהוָה
  rationale: The possessive form is more natural English without flattening the image into abstract power.
- pob_phrase: is exalted
  simplified_phrase: is lifted high
  preserved_meaning: Yahweh’s right hand is pictured as high or exalted, with triumph possible in context.
  reasoning_layer_used: POB lexical decision and footnote for רוֹמֵמָה
  rationale: “Lifted high” makes the spatial image immediately clear while the footnote preserves the wider sense.
- pob_phrase: does valiantly
  simplified_phrase: acts with mighty power
  preserved_meaning: Yahweh acts mightily and victoriously.
  reasoning_layer_used: POB lexical decisions and footnote for עֹשָׂה חָיִל
  rationale: This replaces an uncommon English idiom with a direct expression of mighty action.
