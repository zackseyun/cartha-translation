translation:
  language: en
  text: Yahweh stands with those who help me; I myself will watch what happens to those who hate me.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The first line may also mean, “Yahweh is for me among those who help me.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may imply that he will see their downfall, but it does not say this directly.
    reason: lexical_alternative
