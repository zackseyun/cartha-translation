translation:
  language: en
  text: The one who comes in Yahweh’s name is blessed! From Yahweh’s temple, we bless you.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “In Yahweh’s name” can also mean “with Yahweh’s authority” or “as his representative.”
    reason: lexical_alternative
  - marker: b
    text: The New Testament later applies these words to Jesus as he enters Jerusalem (Matthew 21:9; Mark 11:9; Luke 19:38; John 12:13).
    reason: cross_reference
simplification_decisions:
- pob_phrase: Blessed is the one who comes
  simplified_phrase: The one who comes ... is blessed
  preserved_meaning: The arriving person is declared blessed.
  reasoning_layer_used: POB lexical decisions for בָּרוּךְ and הַבָּא
  rationale: Ordinary English word order makes the blessing easier to understand without changing its force.
- pob_phrase: in the name of Yahweh
  simplified_phrase: in Yahweh’s name
  preserved_meaning: The person comes under Yahweh’s name, possibly with his authority or as his representative.
  reasoning_layer_used: POB lexical and theological decisions for בְּשֵׁם and יְהוָה
  rationale: The possessive form is natural English while preserving Yahweh’s personal name and the biblical expression.
- pob_phrase: we bless you from the house of Yahweh
  simplified_phrase: From Yahweh’s temple, we bless you
  preserved_meaning: The blessing is pronounced from Yahweh’s house, understood here as the temple.
  reasoning_layer_used: POB lexical alternative for מִבֵּית and the immediate temple context
  rationale: Temple prevents a domestic misunderstanding in a passage about gates and the altar.
interpretive_expansions:
- pob_phrase: the house of Yahweh
  rendering: Yahweh’s temple
  claim: Yahweh’s house refers here to the temple.
  evidence:
  - The POB lexical audit lists “from the temple of” as an available rendering.
  - Psalm 118:19–20 mentions entrance gates, and verse 27 mentions the altar.
  confidence: high
  alternatives_preserved:
  - Yahweh’s house
translation_notes:
  risk_flags:
  - risk: Readers may miss that coming in someone’s name can imply authority or representation.
    mitigation: Footnote a gives both possible senses without choosing between them.
  - risk: Readers may assume the psalm itself explicitly identifies the arriving person as the Messiah.
    mitigation: The main text remains general, while footnote b reports the later New Testament application.
