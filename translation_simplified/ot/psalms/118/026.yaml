translation:
  language: en
  text: The one who comes in Yahweh’s name is blessed.[a][b] From Yahweh’s house, we bless you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The New Testament later applies this verse to Jesus when he enters Jerusalem (Matthew 21:9; Mark 11:9; Luke 19:38; John 12:13).
    reason: cross_reference
  - marker: b
    text: “In Yahweh’s name” may also mean “with Yahweh’s authority” or “as his representative.”
    reason: lexical_alternative
