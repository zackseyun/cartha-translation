simplification_decisions:
- pob_phrase: who executes justice for the oppressed
  simplified_phrase: He brings justice to the oppressed
  preserved_meaning: Yahweh continually acts to right the wrongs suffered by oppressed people.
  reasoning_layer_used: POB lexical decisions for עֹשֶׂה, מִשְׁפָּט, and לָעֲשׁוּקִים
  rationale: “Brings justice” states the same action in more familiar English than “executes justice.”
- pob_phrase: who gives bread to the hungry
  simplified_phrase: and gives bread to the hungry
  preserved_meaning: Yahweh characteristically gives hungry people bread.
  reasoning_layer_used: POB lexical decisions for נֹתֵן, לֶחֶם, and לָרְעֵבִים
  rationale: Joining this action to the first with “and” creates a natural English sentence while retaining “bread.”
- pob_phrase: Yahweh frees the prisoners
  simplified_phrase: Yahweh sets prisoners free
  preserved_meaning: Yahweh releases people who are held or bound.
  reasoning_layer_used: POB lexical and theological decisions for יְהוָה, מַתִּיר, and אֲסוּרִים
  rationale: “Sets prisoners free” is a common expression that preserves both Yahweh’s name and the act of release.
translation_notes:
  risk_flags:
  - risk: “Prisoners” may sound narrower than the Hebrew image of bound people.
    mitigation: The footnote preserves the broader alternative, “those who are bound.”
