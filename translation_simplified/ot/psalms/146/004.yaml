translation:
  language: en
  text: When his breath leaves him[a], he returns to the ground. That very day, his plans come to nothing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “his spirit leaves him.” The Hebrew word can mean “breath” or “spirit.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: His breath goes out
  simplified_phrase: When his breath leaves him
  preserved_meaning: His animating breath departs at death without defining what happens after death.
  reasoning_layer_used: POB lexical and theological decisions on רוּחוֹ and תֵּצֵא
  rationale: This natural wording preserves the concrete image and the deliberate preference for “breath.”
- pob_phrase: he returns to his ground
  simplified_phrase: he returns to the ground
  preserved_meaning: The mortal person returns to the earth from which humanity came.
  reasoning_layer_used: POB lexical decision on לְאַדְמָתוֹ
  rationale: Using “the ground” removes an opaque possessive while retaining the earth-return image.
- pob_phrase: his plans perish
  simplified_phrase: his plans come to nothing
  preserved_meaning: Death immediately ends the person's purposes and ability to carry them out.
  reasoning_layer_used: POB lexical decisions on אָבְדוּ and עֶשְׁתֹּנֹתָיו
  rationale: The common expression clearly conveys the collapse of human plans at death.
translation_notes:
  risk_flags:
  - risk: Changing “his ground” to “the ground” does not reproduce the Hebrew possessive.
    mitigation: The wording retains the central return-to-earth image and avoids the unnatural impression that he owns a particular plot.
