translation:
  language: en
  text: When his breath leaves him[a], he returns to the ground. That very day, his plans come to nothing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “his spirit leaves him.” The Hebrew word can mean “breath” or “spirit.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: His breath goes out
  simplified_phrase: When his breath leaves him
  preserved_meaning: The person’s life-breath departs at death without defining the intermediate state.
  reasoning_layer_used: Lexical and theological decisions for רוּחוֹ and תֵּצֵא
  rationale: This makes the death image immediately clear while retaining “spirit” as an alternative.
- pob_phrase: he returns to his ground
  simplified_phrase: he returns to the ground
  preserved_meaning: The mortal person returns to the earth rather than to “dust,” which is not the noun used here.
  reasoning_layer_used: Lexical decision for לְאַדְמָתוֹ
  rationale: Ordinary English uses “the ground,” while the return image remains intact.
- pob_phrase: his plans perish
  simplified_phrase: his plans come to nothing
  preserved_meaning: Death brings the person’s purposes to an end.
  reasoning_layer_used: Lexical decision for אָבְדוּ and עֶשְׁתֹּנֹתָיו
  rationale: “Come to nothing” clearly communicates the ruin of the person’s plans.
translation_notes:
  risk_flags:
  - risk: “Breath” could be read as ordinary exhalation rather than the departure of life-breath at death.
    mitigation: The return to the ground supplies the death context, and the footnote preserves “spirit.”
