simplification_decisions:
- pob_phrase: opens the eyes of the blind
  simplified_phrase: opens the eyes of blind people
  preserved_meaning: Yahweh enables blind people to see while preserving the image of opening their eyes.
  reasoning_layer_used: Lexical decisions for פֹּקֵחַ and עִוְרִים
  rationale: Naming blind people keeps the personal reference clear and avoids an ambiguous body-part expression.
- pob_phrase: raises up those who are bowed down
  simplified_phrase: lifts up those who are bowed down
  preserved_meaning: Yahweh restores people who are stooped, humbled, or afflicted without narrowing the image.
  reasoning_layer_used: Lexical decisions for זֹקֵף and כְּפוּפִים
  rationale: “Lifts up” is common English and preserves both the physical picture and its broader sense of restoration.
- pob_phrase: the righteous
  simplified_phrase: righteous people
  preserved_meaning: Yahweh loves people characterized by righteousness, not merely people performing isolated right actions.
  reasoning_layer_used: Lexical decision for צַדִּיקִים and grounding review
  rationale: “Righteous people” keeps the source’s class and character description in accessible English.
translation_notes:
  risk_flags:
  - risk: “Righteous” may be unfamiliar to some new readers.
    mitigation: Retaining it protects the term’s broader moral and relational meaning from being reduced to behavior alone.
