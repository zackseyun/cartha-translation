  preserved_meaning: They were courageous, strong-willed fighting men.
  reasoning_layer_used: POB lexical decision for אַבִּירֵי לֵב
  rationale: This replaces an uncommon word while retaining both courage and the military setting.
- pob_phrase: they slept their sleep
  simplified_phrase: They sank into sleep
  preserved_meaning: The vivid sleep image remains without deciding whether it means sleep or death.
  reasoning_layer_used: POB lexical decision for נָמוּ שְׁנָתָם
  rationale: The natural English wording preserves the documented ambiguity.
- pob_phrase: none of the men of valor could find their hands
  simplified_phrase: none of the mighty fighters could use their hands
  preserved_meaning: The defeated warriors were powerless and unable to act.
  reasoning_layer_used: POB lexical decisions for אַנְשֵׁי חַיִל and וְלֹא מָצְאוּ ... יְדֵיהֶם
