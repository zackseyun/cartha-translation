translation:
  language: en
  text: The bold warriors were plundered. They sank into sleep[a], and none of the mighty fighters could use their hands.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew leaves open whether this is ordinary sleep or the sleep of death, though the context strongly suggests deadly defeat.
    reason: lexical_alternative
  - marker: b
    text: Literally, “could find their hands,” a Hebrew image for being unable to act.
    reason: source_note
