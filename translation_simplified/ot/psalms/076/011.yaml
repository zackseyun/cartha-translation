translation:
  language: en
  text: Make solemn promises to Yahweh your God, and keep them. Let all who are around him bring gifts[a] to the One who inspires fear and awe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can mean “tribute,” a gift presented to honor someone of higher rank.
    reason: lexical_alternative
  - marker: b
    text: Or, “the One who is to be feared.”
    reason: lexical_alternative
