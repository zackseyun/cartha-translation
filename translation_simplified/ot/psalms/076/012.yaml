  rationale: “Cuts down” preserves the forceful image, while “rulers” is clearer than “princes.”
- pob_phrase: he is feared by the kings of the earth
  simplified_phrase: the kings of the earth fear him
  preserved_meaning: Earthly kings regard God with fear because of his dread majesty.
  reasoning_layer_used: lexical decision
  rationale: The active wording expresses the same relationship in more natural English.
