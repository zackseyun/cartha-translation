translation:
  language: en
  text: He has not treated us as our sins deserve. He has not repaid us as our wrongdoing deserves.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: dealt with us according to our sins
  simplified_phrase: treated us as our sins deserve
  preserved_meaning: God has not treated us in proportion to our sinful acts.
  reasoning_layer_used: lexical decision for כַּ/חֲטָאֵינוּ and עָשָׂה לָנוּ
  rationale: The wording makes the idea of measured treatment immediately clear.
- pob_phrase: nor repaid us according to our iniquities
  simplified_phrase: He has not repaid us as our wrongdoing deserves
  preserved_meaning: God has not given us the response our iniquities warrant.
  reasoning_layer_used: lexical decisions for כַּ/עֲוֺנֹתֵינוּ and גָּמַל עָלֵינוּ
  rationale: “Wrongdoing” is clearer than “iniquities” while remaining distinct from the first mention of sins.
- pob_phrase: He has not ... nor
  simplified_phrase: He has not ... He has not
  preserved_meaning: The repeated denial still emphasizes God's merciful restraint in two parallel statements.
  reasoning_layer_used: lexical decision for לֹא ... לֹא
  rationale: Two short sentences preserve the parallelism and are easier to read.
interpretive_expansions:
- pob_phrase: according to our sins ... according to our iniquities
  rendering: as our sins deserve ... as our wrongdoing deserves
  claim: The comparison describes treatment proportionate to what sinful acts warrant.
  evidence:
  - The prefixed כ marks comparison or measure.
  - The POB footnote explicitly gives “as ... deserve” as an alternative.
  confidence: high
  alternatives_preserved:
