translation:
  language: en
  text: who forgives all your wrongdoing[a] and heals all your diseases,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also refer to your guilt or to the consequences of your sin.
    reason: lexical_alternative
  - marker: b
