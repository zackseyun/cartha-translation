translation:
  language: en
  text: But Yahweh’s steadfast love has always rested on those who fear him, and it always will. His righteousness[a] extends to their children’s children.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “justice.” The Hebrew word can mean either righteousness or justice here.
    reason: lexical_alternative
