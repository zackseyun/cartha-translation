translation:
  language: en
  text: who satisfies you with good things,[a] so that your youthful strength is renewed like an eagle’s.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew has “your adornment,” but the phrase is difficult. It may mean that he satisfies you with good things throughout your life; another interpretation reads “your mouth.”
    reason: alternative_reading
  - marker: b
    text: Or “like a large bird of prey”; the Hebrew bird is traditionally called an eagle.
    reason: lexical_alternative
