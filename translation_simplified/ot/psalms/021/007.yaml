translation:
  language: en
  text: For the king trusts in Yahweh, and through the Most High’s faithful love,[a] he will not be shaken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in the Most High’s faithful love”; the Hebrew preposition may describe either the means of his security or the sphere in which he is secure.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the steadfast love of the Most High
  simplified_phrase: the Most High’s faithful love
  preserved_meaning: God’s loyal, covenantal love remains the means of, or setting for, the king’s stability.
  reasoning_layer_used: POB lexical decision for חֶסֶד and its attached preposition
  rationale: The possessive form is more natural, while “faithful love” retains loyalty and constancy.
translation_notes:
  risk_flags:
