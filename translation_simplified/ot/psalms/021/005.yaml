  preserved_meaning: God confers royal magnificence and dignity on the king.
  reasoning_layer_used: Lexical decisions for תְּשַׁוֶּה, הוֹד, and הָדָר.
  rationale: “Give” is clearer than “bestow” and retains God as the one who grants both honors.
