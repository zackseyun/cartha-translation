simplification_decisions:
- pob_phrase: Great is his glory through your salvation
  simplified_phrase: Your salvation brings him great glory
  preserved_meaning: God’s saving action is the means by which the king receives great glory.
  reasoning_layer_used: Lexical decision for בִּישׁוּעָתֶךָ and its means-or-sphere footnote.
  rationale: The active sentence is easier to follow while retaining salvation as the source of his glory.
- pob_phrase: you bestow splendor and majesty on him
  simplified_phrase: you give him splendor and majesty
  preserved_meaning: God confers royal splendor and majesty on the king.
  reasoning_layer_used: Lexical decisions for תְּשַׁוֶּה, הוֹד, and הָדָר.
  rationale: “Give” is more familiar than “bestow” and keeps both distinct royal qualities.
translation_notes:
  risk_flags:
  - risk: “Brings” may sound more causal than the Hebrew preposition alone.
    mitigation: Footnote a preserves the possible means and sphere readings.
  - risk: Modern readers may hear “salvation” only in an individual spiritual sense.
    mitigation: Footnote b retains the royal-context senses of deliverance and victory.
