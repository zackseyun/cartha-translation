translation:
  language: en
  text: When you are present, you will make them like a blazing furnace.[a] In his anger, Yahweh will swallow them up, and fire will consume them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “When you appear”; literally, “at the time of your face.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: at the time of your presence
  simplified_phrase: When you are present
  preserved_meaning: The judgment occurs in connection with the addressed person's presence.
  reasoning_layer_used: Lexical decision for לְעֵת פָּנֶיךָ and its theological rationale
  rationale: The temporal phrase becomes a direct clause without resolving the documented presence-or-appearing ambiguity.
- pob_phrase: like a fiery furnace
  simplified_phrase: like a blazing furnace
  preserved_meaning: The enemies are compared to a furnace filled with destructive heat.
  reasoning_layer_used: Lexical decision for כְּתַנּוּר אֵשׁ
  rationale: “Blazing” makes the fire image immediate while keeping the furnace comparison.
- pob_phrase: Yahweh in his anger will swallow them up
  simplified_phrase: In his anger, Yahweh will swallow them up
  preserved_meaning: Yahweh angrily and completely destroys them through the vivid image of swallowing.
  reasoning_layer_used: Lexical decisions for יְהוָה, בְּאַפּוֹ, and יְבַלְּעֵם
  rationale: Natural clause order improves readability while retaining the divine name, anger, and swallowing image.
translation_notes:
  risk_flags:
  - risk: “When you are present” may be understood more generally than the Hebrew image of the face.
    mitigation: The footnote preserves the literal image and the alternate sense “when you appear.”
  - risk: The shift from “you” to “Yahweh” may leave the referent of “you” uncertain.
    mitigation: The wording preserves POB's person shift rather than harmonizing an ambiguity the source record does not resolve.
