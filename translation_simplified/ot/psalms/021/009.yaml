  simplified_phrase: When you appear, you will make them like a blazing furnace
  preserved_meaning: Their destruction is compared to the intense heat of a furnace when God manifests his presence.
  reasoning_layer_used: POB lexical decisions and applied revision
  rationale: The reordered clause is easier to follow, while “blazing furnace” keeps the destructive heat image.
- pob_phrase: Yahweh in his anger will swallow them up, and fire will consume them
  simplified_phrase: In his anger, Yahweh will swallow them up. Fire will consume them.
  preserved_meaning: Yahweh angrily destroys them, with swallowing and consuming retained as distinct images.
  reasoning_layer_used: POB lexical and divine-name decisions
  rationale: Two short sentences clarify the actions without weakening either image or replacing Yahweh’s name.
