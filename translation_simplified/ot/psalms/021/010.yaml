    reason: lexical_alternative
simplification_decisions:
- pob_phrase: destroy their fruit from the earth
  simplified_phrase: wipe their fruit off the earth
  preserved_meaning: God will completely remove their fruit while the concrete poetic image remains.
  reasoning_layer_used: Lexical decisions for פְּרִי, אֶרֶץ, and אבד
  rationale: The wording is more natural while preserving the image, worldwide scope, and force of judgment.
- pob_phrase: their offspring from among the sons of man
  simplified_phrase: wipe out their offspring from the human race
  preserved_meaning: Their descendants will be removed from humanity.
  reasoning_layer_used: Lexical and theological decisions for זֶרַע and בְּנֵי אָדָם
  rationale: “Human race” clearly communicates the Hebrew idiom's generic reference to humanity.
