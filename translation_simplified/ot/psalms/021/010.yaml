translation:
  language: en
  text: You will wipe their fruit off the earth[a] and wipe out their offspring from the human race.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Fruit” is a poetic image that can refer to their descendants or what they produce.
    reason: simplification_note
  - marker: b
