  rationale: The clause form is easier to understand while retaining the heart as the image of inward desire.
- pob_phrase: the request of his lips
  simplified_phrase: the request spoken by his lips
  preserved_meaning: His inward desire was expressed as a spoken request.
  reasoning_layer_used: Lexical decisions for וַאֲרֶשֶׁת and שְׂפָתָיו
  rationale: Adding “spoken” makes the Hebrew lips image immediately understandable without removing it.
