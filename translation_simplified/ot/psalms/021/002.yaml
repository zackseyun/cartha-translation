translation:
  language: en
  text: You have given him what his heart desired, and you have not refused the request spoken by his lips.[a] Selah[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Hebrew word translated “request” may also mean “desire” or “petition.”
