simplification_decisions:
- pob_phrase: Let not the foot of pride come against me
  simplified_phrase: Do not let pride’s foot advance against me
  preserved_meaning: The prayer asks protection from pride pictured as a hostile advancing foot.
  reasoning_layer_used: POB lexical decisions for תְּבוֹאֵנִי and רֶגֶל גַּאֲוָה
  rationale: The wording keeps the Hebrew image while making the hostile movement easier to picture.
- pob_phrase: let not the hand of the wicked drive me away
  simplified_phrase: or the hand of the wicked drive me from my place
  preserved_meaning: The wicked use their power to force the speaker away.
  reasoning_layer_used: POB lexical decisions for יַד רְשָׁעִים and תְּנִדֵנִי
  rationale: The phrase states the displacement plainly while retaining the image of the wicked person’s hand.
