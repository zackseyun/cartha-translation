simplification_decisions:
- pob_phrase: Transgression speaks to the wicked within my heart
  simplified_phrase: In my heart, I hear transgression speaking to the wicked
  preserved_meaning: The psalmist inwardly perceives transgression addressing the wicked person.
  reasoning_layer_used: Theological decision on the first-person Hebrew reading and applied clarity revision
  rationale: The new order prevents readers from thinking the wicked person is located in the psalmist’s heart.
- pob_phrase: there is no fear of God before his eyes
  simplified_phrase: He has no fear of God before his eyes
  preserved_meaning: The wicked person gives no reverent regard to God.
  reasoning_layer_used: Lexical decisions for “fear of God” and “before his eyes”
  rationale: The direct personal wording is easier to follow while preserving the Hebrew image.
interpretive_expansions:
- pob_phrase: within my heart
  rendering: In my heart, I hear
  claim: The psalmist inwardly perceives the message spoken by transgression.
