translation:
  language: en
  text: 'In my heart, I hear transgression speaking to the wicked: “He has no fear of God before his eyes.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “my heart”; some translations read “his heart” or understand this as a message about the wicked.
