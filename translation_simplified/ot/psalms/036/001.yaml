translation:
  language: en
  text: 'In my heart, rebellion speaks to the wicked person: he has no reverent fear of God before his eyes.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew reads “in my heart.” Some ancient versions read “in his heart,” while others understand this as the psalmist’s inward knowledge about the wicked.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Within my heart
  simplified_phrase: In my heart
  preserved_meaning: The psalmist inwardly perceives what rebellion says while the Hebrew first-person reading remains intact.
  reasoning_layer_used: Theological decision on pronoun and perspective
  rationale: “In” is more natural than “within” without resolving the difficult reading.
- pob_phrase: transgression
  simplified_phrase: rebellion
  preserved_meaning: The word still describes willful wrongdoing against God.
  reasoning_layer_used: Lexical decision for פשע
  rationale: “Rebellion” communicates the moral force more clearly to common readers.
- pob_phrase: the wicked
  simplified_phrase: the wicked person
  preserved_meaning: The wicked person remains the one to whom rebellion speaks.
  reasoning_layer_used: Lexical decision for לרשע
  rationale: Adding “person” prevents the adjective from sounding abstract.
interpretive_expansions:
- pob_phrase: fear of God
  rendering: reverent fear of God
  claim: The fear in view is reverence and awe toward God, not mere terror.
  evidence:
  - The POB lexical rationale identifies this as reverent fear or awe toward God.
  confidence: high
  alternatives_preserved:
  - fear of God
  - dread of God
