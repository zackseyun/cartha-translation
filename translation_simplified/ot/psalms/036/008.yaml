  reasoning_layer_used: Lexical decisions for יִרְוְיוּן and מִדֶּשֶׁן
  rationale: This satisfaction construction preserves the source relationship while avoiding the redundant phrase “rich abundance.”
- pob_phrase: and you give them drink from the river of your delights
  simplified_phrase: You give them drink from the river of your delights
  preserved_meaning: God personally gives them drink from his life-giving abundance of delights.
  reasoning_layer_used: Lexical decisions for וְנַחַל, עֲדָנֶיךָ, and תַשְׁקֵם
  rationale: A separate sentence clarifies divine agency while retaining the river and delight images.
- pob_phrase: your house
