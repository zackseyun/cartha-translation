    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Continue your steadfast love
  simplified_phrase: Keep showing your faithful, enduring love
  preserved_meaning: God is asked to continue expressing his loyal covenant love.
  reasoning_layer_used: Lexical decisions for מְשֹׁךְ and חַסְדְּךָ
  rationale: The verbal wording makes the prayer natural while preserving ongoing, loyal love.
- pob_phrase: and your righteousness
  simplified_phrase: and keep showing your righteousness
  preserved_meaning: The request to continue God's righteous action is carried into the parallel clause.
  reasoning_layer_used: Theological decision on coordinated parallelism
  rationale: Repeating the verb makes the parallel request easier to follow without narrowing righteousness to justice.
- pob_phrase: the upright in heart
  simplified_phrase: those who are upright in their hearts
  preserved_meaning: The phrase still describes inward moral integrity.
  reasoning_layer_used: Lexical decision for לְיִשְׁרֵי לֵב
  rationale: Adding the pronoun makes the Hebrew heart expression sound natural in English.
