translation:
  language: en
  text: Keep showing your faithful, enduring love to those who know you, and keep showing your righteousness to those who are upright in their hearts.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew also allows “keep extending your steadfast love” and pictures God drawing it out.
    reason: lexical_alternative
  - marker: b
