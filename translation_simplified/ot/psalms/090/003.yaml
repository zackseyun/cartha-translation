  text: You make mortal human beings return to dust,[a] and you say, “Return to dust, sons of Adam.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also describe a crushed state or what has been crushed to powder; “dust” fits the context of human mortality.
    reason: lexical_alternative
  - marker: b
    text: “Sons of Adam” is a Hebrew expression for human beings. It also preserves the wording’s connection with Adam/man and human mortality.
    reason: simplification_note
