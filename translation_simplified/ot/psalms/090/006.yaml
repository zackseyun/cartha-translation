    text: The Hebrew may more literally mean “springs up and passes on,” and the first verb can also mean “blossoms.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also mean “is cut down” rather than “has withered.”
    reason: lexical_alternative
