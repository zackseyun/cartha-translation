translation:
  language: en
  text: Our lives last seventy years, or eighty if we are strong. Yet even the best of those years is filled with hard work and trouble. It all passes quickly, and we fly away.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Fly away” preserves the Hebrew picture of life ending as swiftly as something taking flight.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Our years amount to seventy
  simplified_phrase: Our lives last seventy years
  preserved_meaning: The usual span of human life is seventy years.
  reasoning_layer_used: Lexical decision for יְמֵי שְׁנוֹתֵינוּ בָהֶם
  rationale: This replaces the Hebrew lifespan idiom with direct, natural English.
- pob_phrase: yet their best is toil and trouble
  simplified_phrase: Yet even the best of those years is filled with hard work and trouble
  preserved_meaning: Even the strongest or most impressive part of life is marked by hardship.
  reasoning_layer_used: Lexical decisions for וְרָהְבָּם and עָמָל וָאָוֶן
  rationale: The wording makes the comparison clear while keeping hardship rather than moral evil in view.
- pob_phrase: for it quickly passes, and we fly away
  simplified_phrase: It all passes quickly, and we fly away
  preserved_meaning: Human life ends swiftly, with the Hebrew flight image retained.
  reasoning_layer_used: Lexical decisions for כִּי גָז חִישׁ and וַנָּעֻפָה
  rationale: The shorter sentence clarifies life's swift passing without weakening the poetic image.
translation_notes:
  risk_flags:
