translation:
  language: en
  text: 'Before the mountains were born,

    before you brought forth the earth and the world,[a]

    you were already God.

    You have always been God, and you always will be.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses the imagery of labor and birth to describe God bringing creation into being.
    reason: source_note
