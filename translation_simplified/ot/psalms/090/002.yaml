translation:
  language: en
  text: Before the mountains were born, before you brought the earth and the world to birth,[a] you were God. You have always been God, and you always will be.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew describes God’s creation of the earth and world with the imagery of labor and birth.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and you brought forth the earth and the world
  simplified_phrase: before you brought the earth and the world to birth
  preserved_meaning: God existed before creation, which is pictured as a birth.
  reasoning_layer_used: lexical and theological decisions
  rationale: Repeating “before” clarifies the time relationship while retaining the birth image.
- pob_phrase: from everlasting to everlasting you are God
  simplified_phrase: you were God. You have always been God, and you always will be
  preserved_meaning: God exists eternally before and beyond creation.
  reasoning_layer_used: lexical and theological decisions
  rationale: The Hebrew idiom is expressed in direct language about the limitless past and future.
interpretive_expansions:
- pob_phrase: from everlasting to everlasting you are God
  rendering: you were God. You have always been God, and you always will be
  claim: God was already God before creation and remains God forever.
  evidence:
  - The Hebrew idiom expresses unbounded duration in both directions.
  - The creation clauses establish God’s priority over the created world.
  confidence: high
  alternatives_preserved:
  - From everlasting to everlasting you are God.
translation_notes:
  risk_flags:
