translation:
  language: en
  text: I remember these things and pour out my soul. I used to go with the crowd,[a] leading them[b] to the house of God. The celebrating crowd raised joyful shouts and gave thanks.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in the procession”; the Hebrew may refer either to the festival crowd or to the procession itself.
    reason: lexical_alternative
  - marker: b
    text: Or “guiding them” or “going with them”; the Hebrew word is rare, but it describes movement with others toward God’s house.
    reason: lexical_alternative
