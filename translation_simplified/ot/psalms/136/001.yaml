translation:
  language: en
  text: Thank Yahweh[b], because he is good. His faithful love never ends.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can also mean “steadfast love,” “covenant faithfulness,” or “mercy”; it describes loyal, enduring love.
    reason: lexical_alternative
  - marker: b
    text: Yahweh is the personal divine name written in Hebrew as YHWH.
    reason: source_note
