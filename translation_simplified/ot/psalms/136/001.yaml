translation:
  language: en
  text: Give thanks to Yahweh because he is good, and because his steadfast love lasts forever.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Steadfast love” can also mean “covenant faithfulness” or “mercy”; the Hebrew describes loyal love that does not fail.
    reason: lexical_alternative
