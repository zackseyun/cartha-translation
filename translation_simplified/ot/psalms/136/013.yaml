simplification_decisions:
- pob_phrase: to him who divided the Sea of Reeds into parts
  simplified_phrase: to the one who split the Sea of Reeds apart
  preserved_meaning: God separated the sea into distinct sections.
  reasoning_layer_used: The lexical decisions for גֹזֵר and לִגְזָרִים preserve the forceful image of dividing.
  rationale: “Split ... apart” expresses the image more directly in common English.
- pob_phrase: his steadfast love endures forever
  simplified_phrase: his steadfast love lasts forever
  preserved_meaning: God’s loyal love continues without end.
  reasoning_layer_used: The lexical decisions for לְעוֹלָם and חַסְדּוֹ protect the enduring and loyal character of the love.
  rationale: “Lasts forever” is clearer than “endures forever” while keeping the same duration.
