translation:
  language: en
  text: Give thanks to the God of gods,[a] because his faithful love lasts forever.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “God of gods” means God above all gods and declares his supremacy.
    reason: simplification_note
  - marker: b
    text: The Hebrew describes loyal, covenant love; it can also be translated “steadfast love,” “mercy,” or “covenant faithfulness.”
