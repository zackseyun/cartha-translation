translation:
  language: en
  text: How long will you keep attacking a man? Will all of you break him down[a] like a leaning wall, like a fence about to fall?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “murder him.” The context may use the verb metaphorically for breaking the man down.
    reason: lexical_alternative
  - marker: b
    text: The picture may describe the man as close to collapse; others understand it as describing the attackers pressing against him like a bulging wall.
    reason: alternative_reading
