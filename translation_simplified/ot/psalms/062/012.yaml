translation:
  language: en
  text: O Lord, steadfast love is yours, because you repay each man[a] according to what he has done.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “each man” represents every person individually.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And to you, O Lord, belongs steadfast love
  simplified_phrase: O Lord, steadfast love is yours
  preserved_meaning: Steadfast love belongs to the Lord.
  reasoning_layer_used: Lexical decision for וּלְךָ and חָסֶד
  rationale: The simpler possessive wording preserves both divine ownership and steadfast covenant love.
- pob_phrase: for
  simplified_phrase: because
  preserved_meaning: God’s just repayment explains the preceding statement about his steadfast love.
  reasoning_layer_used: Lexical decision for כִּי and theological decision on love and recompense
  rationale: “Because” makes the explanatory link clear without softening the tension.
- pob_phrase: according to his work
  simplified_phrase: according to what he has done
  preserved_meaning: God repays each man in correspondence with his deeds.
  reasoning_layer_used: Lexical decision for כְּמַעֲשֵׂהוּ
  rationale: The natural clause states the same measured recompense without the potentially unclear singular “work.”
translation_notes:
  risk_flags:
