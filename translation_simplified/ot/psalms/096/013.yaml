simplification_decisions:
- pob_phrase: for he is coming, for he is coming
  simplified_phrase: because he is coming—he is coming
  preserved_meaning: Yahweh’s coming is certain and imminent, and the repetition remains emphatic.
  reasoning_layer_used: POB lexical decision for כִּי בָא ... כִּי בָא
  rationale: “Because” makes the connection clearer, while the dash helps modern readers hear the repeated emphasis.
- pob_phrase: He will judge the world with righteousness
  simplified_phrase: His judgment of the world will be righteous
  preserved_meaning: Yahweh will judge the world according to what is morally right.
  reasoning_layer_used: POB lexical and theological decisions for בְּצֶדֶק and divine judgment
  rationale: The adjective form communicates the same moral quality in more natural English.
- pob_phrase: the peoples with his faithfulness
  simplified_phrase: he will be faithful when he judges the peoples
  preserved_meaning: Yahweh’s judgment of the peoples will reflect his dependable character.
  reasoning_layer_used: POB lexical decision for בֶּאֱמוּנָתוֹ
  rationale: The clause directly states how Yahweh’s faithfulness characterizes his judgment.
translation_notes:
  risk_flags:
  - risk: Changing “with his faithfulness” to a clause could be heard as a general statement rather than the manner of judgment.
    mitigation: “When he judges” directly connects his faithfulness to the act of judging.
