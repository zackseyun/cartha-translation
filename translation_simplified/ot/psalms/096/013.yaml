translation:
  language: en
  text: Before Yahweh, because he is coming—he is coming to judge the earth. He will judge the world righteously, and he will judge the peoples faithfully.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: for he is coming, for he is coming
  simplified_phrase: because he is coming—he is coming
  preserved_meaning: The wording keeps both the reason for rejoicing and the emphatic repetition of Yahweh’s coming.
  reasoning_layer_used: lexical decision for כִּי בָא ... כִּי בָא
  rationale: “Because” makes the causal link clear, while the dash highlights the repeated announcement.
- pob_phrase: He will judge the world with righteousness
  simplified_phrase: He will judge the world righteously
  preserved_meaning: Yahweh’s judgment has the moral quality of righteousness.
  reasoning_layer_used: lexical decision for בְּצֶדֶק
  rationale: The adverb states the same quality in direct modern English.
- pob_phrase: and the peoples with his faithfulness
  simplified_phrase: and he will judge the peoples faithfully
  preserved_meaning: Yahweh will judge all peoples reliably and true to his character.
  reasoning_layer_used: lexical decisions for וְעַמִּים and בֶּאֱמוּנָתוֹ
  rationale: Repeating “he will judge” removes ambiguity about who acts faithfully without adding a possessive link.
translation_notes:
  risk_flags:
  - risk: “Faithfully” names the manner of Yahweh’s judgment less explicitly than the noun “his faithfulness.”
    mitigation: Repeating “he will judge” clearly attaches faithfulness to Yahweh’s own action.
