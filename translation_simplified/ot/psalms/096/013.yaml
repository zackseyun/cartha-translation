translation:
  language: en
  text: before Yahweh, because he is coming—he is coming to judge the earth. His judgment of the world will be righteous, and he will be faithful when he judges the peoples.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
