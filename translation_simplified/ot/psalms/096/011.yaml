- pob_phrase: Let the heavens rejoice[a], and let the earth be glad;
  simplified_phrase: Let the heavens rejoice, and let the earth be glad.
  preserved_meaning: Creation is summoned to express joy.
  reasoning_layer_used: The lexical and theological decisions identify the verbs as exhortative rather than predictive.
  rationale: A full stop makes the poetic summons easier to follow without changing its force.
- pob_phrase: let the sea thunder, and all that fills it
