  rationale: “Proclaim” makes the public force clear while retaining the international setting.
- pob_phrase: the world is established; it shall not be moved
  simplified_phrase: The world stands firm; it cannot be shaken
  preserved_meaning: God’s reign secures the world against being displaced from stability.
  reasoning_layer_used: Lexical decisions for תִּכּוֹן and תִּמּוֹט
  rationale: The concrete language of firmness and shaking is clearer than the passive wording.
