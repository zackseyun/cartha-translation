translation:
  language: en
  text: Proclaim among the nations, “Yahweh reigns![a] The world stands firm; it cannot be shaken. He will judge the peoples fairly.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Yahweh is king,” or “Yahweh has become king.” The Hebrew may proclaim his present kingship or his enthronement.
