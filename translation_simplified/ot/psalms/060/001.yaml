simplification_decisions:
- pob_phrase: you have breached us
  simplified_phrase: you have broken us open
  preserved_meaning: God has violently made a breach in the people themselves.
  reasoning_layer_used: POB lexical decision and source audit
  rationale: This keeps “us” as the object and expresses the breach image in clear English.
- pob_phrase: you have been angry
  simplified_phrase: you have been angry with us
  preserved_meaning: God’s anger is directed toward the rejected people.
  reasoning_layer_used: Immediate clause context
  rationale: The added words supply the natural English object already clear in the lament.
- pob_phrase: Restore us
  simplified_phrase: Restore us
  preserved_meaning: The people ask God to reverse their damaged condition without excluding the sense of his return.
  reasoning_layer_used: POB theological decision
  rationale: The main reading remains while the genuine alternative is preserved in the footnote.
interpretive_expansions:
- pob_phrase: you have breached us
  rendering: you have broken us open
  claim: The people themselves are pictured as having been forcibly opened by a breach.
  evidence:
  - The Hebrew verb depicts making a breach and takes “us” as its object.
  - The POB rationale requires preserving the violent breach image.
  confidence: high
  alternatives_preserved:
  - you have broken us down
  - you have broken us
translation_notes:
  risk_flags:
  - risk: “Broken us open” may suggest bodily injury to some readers.
    mitigation: The wording preserves the metaphorical breach while keeping the people as the direct object.
  - risk: “Restore us” may be understood only as repairing the people.
    mitigation: The footnote preserves the possible sense of God returning to them.
