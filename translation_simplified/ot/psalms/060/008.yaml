translation:
  language: en
  text: Moab is my basin for washing.[a] I throw my sandal on Edom. Philistia, shout in triumph for me![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The basin and sandal images present Moab and Edom as humiliated and conquered.
    reason: cultural_note
  - marker: b
    text: The Hebrew is difficult and may instead mean, “Over Philistia I shout in triumph.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Moab is my washbasin
  simplified_phrase: Moab is my basin for washing
  preserved_meaning: Moab is pictured as a lowly washing vessel under the speaker’s power.
  reasoning_layer_used: lexical decision and image rationale
  rationale: This explains the basin’s use while preserving the humiliating image.
- pob_phrase: on Edom I cast my sandal
  simplified_phrase: I throw my sandal on Edom
  preserved_meaning: The speaker throws his sandal onto Edom as an image of dominance.
  reasoning_layer_used: lexical decision
  rationale: Ordinary word order and “throw” make the action immediately clear.
- pob_phrase: over Philistia, shout in triumph for me
  simplified_phrase: Philistia, shout in triumph for me
  preserved_meaning: Philistia receives the command to raise a triumphant cry for the speaker.
  reasoning_layer_used: theological decision and lexical rationale
  rationale: Direct address clarifies the imperative without specifying more than the difficult Hebrew supports.
