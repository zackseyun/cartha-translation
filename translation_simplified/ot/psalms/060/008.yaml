translation:
  language: en
  text: Moab is my washing basin.[a] I throw my sandal onto Edom. Philistia, shout in triumph for me![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally, “washpot.” The picture shows Moab humiliated and brought under God’s rule.
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew gives Philistia an ironic command: though subdued, it must acclaim God. Many translations instead read, “Over Philistia I shout in triumph.”'
    reason: textual_variant
simplification_decisions:
- pob_phrase: Moab is my washbasin
  simplified_phrase: Moab is my washing basin
  preserved_meaning: Moab is pictured as a basin used for washing, expressing humiliation and subjection.
  reasoning_layer_used: lexical decision and footnote a
  rationale: The familiar phrase keeps the concrete image while making its purpose clear.
- pob_phrase: on Edom I cast my sandal
  simplified_phrase: I throw my sandal onto Edom
  preserved_meaning: The speaker throws his sandal onto Edom as a sign of dominance.
  reasoning_layer_used: lexical decisions for אַשְׁלִיךְ נַעֲלִי and עַל אֱדוֹם
  rationale: Natural word order and “throw” clarify the action without weakening the image.
- pob_phrase: over me, O Philistia, shout in triumph
  simplified_phrase: Philistia, shout in triumph for me
  preserved_meaning: Philistia is directly commanded to acclaim the divine speaker as a subdued nation.
  reasoning_layer_used: theological decision on הִתְרֹעָעִי and conquest context
  rationale: “For me” prevents the false impression that Philistia has defeated the speaker.
interpretive_expansions:
- pob_phrase: over me, O Philistia, shout in triumph
  rendering: Philistia, shout in triumph for me
  claim: The ironic command requires subdued Philistia to acclaim the divine victor.
  evidence:
