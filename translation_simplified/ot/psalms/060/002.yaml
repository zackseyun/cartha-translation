simplification_decisions:
- pob_phrase: You have shaken the earth; you have split it open.
  simplified_phrase: You have shaken the earth and split it open.
  preserved_meaning: God caused the earth or land to shake and break apart.
  reasoning_layer_used: POB lexical decisions for הִרְעַשְׁתָּה, אֶרֶץ, and פְּצַמְתָּהּ
  rationale: Joining the parallel actions makes the line easier to read without weakening either image.
- pob_phrase: Heal its fractures
  simplified_phrase: Heal its cracks
  preserved_meaning: The earth is pictured as wounded and in need of healing.
  reasoning_layer_used: POB lexical decisions for רְפָה and שְׁבָרֶיהָ
  rationale: “Cracks” is more familiar than “fractures,” while “heal” preserves the personification.
- pob_phrase: for it is tottering
  simplified_phrase: because it is giving way
  preserved_meaning: The earth remains unstable and has not fully collapsed.
  reasoning_layer_used: POB lexical decisions for כִי and מָטָה
  rationale: The new wording states the reason plainly and keeps the image of ongoing instability.
translation_notes:
  risk_flags:
  - risk: “Earth” may be understood globally even though the Hebrew can mean a particular land.
    mitigation: The footnote preserves the important lexical alternative.
  - risk: “Giving way” may suggest approaching collapse more strongly than “tottering.”
    mitigation: The progressive wording presents instability as ongoing rather than completed.
