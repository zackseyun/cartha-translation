translation:
  language: en
  text: My God, I trust in you. Do not let me be disgraced.[a] Do not let my enemies gloat over me.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “do not let me be ashamed.” The Hebrew may refer to inward shame or public disgrace.
    reason: lexical_alternative
  - marker: b
    text: Or “triumph over me” or “rejoice over me.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: My God, in you I trust
  simplified_phrase: My God, I trust in you.
  preserved_meaning: The speaker directly addresses God and expresses settled reliance on him.
  reasoning_layer_used: POB lexical decision for בְּךָ בָטַחְתִּי
  rationale: Ordinary English word order makes the declaration easier to read.
- pob_phrase: do not let me be put to shame
  simplified_phrase: Do not let me be disgraced.
  preserved_meaning: The prayer asks God to prevent public humiliation before enemies.
  reasoning_layer_used: POB lexical and theological decisions for אֵבוֹשָׁה
  rationale: “Disgraced” states the chosen public-shame sense more directly.
- pob_phrase: do not let my enemies exult over me
  simplified_phrase: Do not let my enemies gloat over me.
  preserved_meaning: The enemies must not rejoice triumphantly at the speaker’s downfall.
  reasoning_layer_used: POB lexical decisions for יַעַלְצוּ and לִי
  rationale: “Gloat over” clearly communicates hostile rejoicing in common English.
