translation:
  language: en
  text: For the sake of your name,[a] Yahweh, forgive my wrongdoing,[b] because it is great.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: God’s “name” refers to his character and covenant honor, not merely to the spoken name itself.
    reason: cultural_note
  - marker: b
    text: The Hebrew word can mean wrongdoing, guilt, or the burden and consequences of guilt.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: O Yahweh
  simplified_phrase: Yahweh
  preserved_meaning: The prayer still directly addresses God by his personal name.
  reasoning_layer_used: Theological decision on יהוה
  rationale: Dropping “O” makes the direct address natural in modern English.
- pob_phrase: my iniquity
  simplified_phrase: my wrongdoing
  preserved_meaning: The speaker confesses his own serious moral offense while the footnote preserves the word’s guilt-related range.
  reasoning_layer_used: Lexical and theological decisions on עָוֹן
  rationale: “Wrongdoing” is clearer than “iniquity” for common readers.
- pob_phrase: for it is great
  simplified_phrase: because it is great
  preserved_meaning: The seriousness of the wrongdoing remains the reason for seeking forgiveness.
  reasoning_layer_used: Lexical decisions on כִּי and רַב
  rationale: “Because” makes the causal relationship immediately clear.
translation_notes:
  risk_flags:
  - risk: “Wrongdoing” does not by itself express the Hebrew word’s full guilt-related range.
    mitigation: Footnote [b] preserves the senses of guilt and its burden or consequences.
  - risk: “Your name” could be understood as only a spoken name.
    mitigation: Footnote [a] explains the appeal to God’s character and covenant honor.
