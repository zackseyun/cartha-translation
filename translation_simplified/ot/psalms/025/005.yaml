translation:
  language: en
  text: Lead me along the way of your truth[a] and teach me, because you are the God who saves me. I wait for you[b] all day long.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Lead me by your faithfulness.” The Hebrew word can mean either truth or faithfulness.
    reason: lexical_alternative
  - marker: b
    text: Or “I hope in you.” The Hebrew describes waiting with hope and expectation.
    reason: lexical_alternative
