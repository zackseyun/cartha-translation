translation:
  language: en
  text: Surely, no one who waits for you[a] will be put to shame. But those who act treacherously for no good reason[b] will be put to shame.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “hopes in you.” The Hebrew describes waiting with expectation.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also mean “betray for nothing” or “act treacherously in vain.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Indeed, none of those who wait for you
  simplified_phrase: Surely, no one who waits for you
  preserved_meaning: The statement emphatically includes everyone who waits for God.
  reasoning_layer_used: Lexical decisions for גַּם, כָּל, and קֹוֶיךָ
  rationale: “Surely” and “no one” express the same emphasis and universal negative in direct English.
- pob_phrase: those who deal treacherously
  simplified_phrase: those who act treacherously
  preserved_meaning: These people actively behave faithlessly without specifying an object of their treachery.
  reasoning_layer_used: Lexical decision for הבוגדים and grounding review
  rationale: “Act treacherously” is natural English and retains the source term’s broad active sense.
- pob_phrase: without cause
  simplified_phrase: for no good reason
  preserved_meaning: Their treachery has no just cause or grounds.
  reasoning_layer_used: Lexical decision for רֵיקָם
  rationale: The wording states the chosen sense in common English while the footnote preserves alternatives.
translation_notes:
  risk_flags:
  - risk: “For no good reason” follows one of several possible senses of the Hebrew.
