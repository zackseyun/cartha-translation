  preserved_meaning: God is asked to direct his attention toward the speaker.
  reasoning_layer_used: POB lexical decision for פְּנֵה אֵלַי
  rationale: “Toward” makes the direction of the plea immediately clear while keeping the image of turning.
- pob_phrase: be gracious to me
  simplified_phrase: show me grace
  preserved_meaning: The speaker asks God to grant him divine favor.
  reasoning_layer_used: POB lexical decision for וְחָנֵּנִי
  rationale: The active wording is more natural while retaining the key concept of grace.
- pob_phrase: afflicted
  simplified_phrase: suffering
  preserved_meaning: The speaker is enduring hardship without limiting it to poverty or oppression.
  reasoning_layer_used: POB lexical decision and footnote for עָנִי
  rationale: “Suffering” is common English and preserves the broad lament context.
