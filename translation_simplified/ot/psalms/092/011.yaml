translation:
  language: en
  text: I have seen my foes[a] with my own eyes; I hear[b] of the evildoers who rise against me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “those who watch me”; the Hebrew may refer more literally to hostile watchers or observers.
    reason: lexical_alternative
  - marker: b
    text: Or “have heard” or “will hear”; the Hebrew verb can be understood in more than one way here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: My eye has looked on my foes
  simplified_phrase: I have seen my foes with my own eyes
  preserved_meaning: The speaker directly sees his hostile opponents, and the concrete image of sight remains.
  reasoning_layer_used: POB lexical decisions for וַתַּבֵּט, עֵינִי, and בְּשׁוּרָי
  rationale: This natural English phrasing preserves the personal sight imagery and adversarial sense.
- pob_phrase: my ears hear of the evildoers
  simplified_phrase: I hear of the evildoers
  preserved_meaning: The speaker hears concerning those who do evil, without implying that he hears them directly.
  reasoning_layer_used: POB lexical decisions for מְרֵעִים and תִּשְׁמַעְנָה אָזְנָי, confirmed by the grounding review
  rationale: The recast is clearer while retaining “of” to preserve the relationship expressed by the POB.
