  rationale: The concrete clause is easier to understand than the abstract singular noun.
- pob_phrase: at the works of your hands I sing for joy
  simplified_phrase: Because of the works of your hands, I sing for joy
  preserved_meaning: Yahweh’s deeds are the reason for the psalmist’s joyful praise.
