translation:
  language: en
  text: When wicked people spring up like grass and everyone who does evil flourishes, it is so that they may be destroyed forever.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The last clause can also be translated, “only to be destroyed forever.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the wicked sprout like grass
  simplified_phrase: wicked people spring up like grass
  preserved_meaning: Wicked people are pictured as grass growing quickly but not lasting.
  reasoning_layer_used: Lexical decisions for רְשָׁעִים, בִּפְרֹחַ, and כְּמוֹ עֵשֶׂב
  rationale: “Wicked people” and “spring up” make the plant image immediately clear.
- pob_phrase: all workers of wickedness flourish
  simplified_phrase: everyone who does evil flourishes
  preserved_meaning: All people who practice evil may visibly thrive.
  reasoning_layer_used: Lexical decision for כָּל פֹּעֲלֵי אָוֶן
  rationale: “Everyone who does evil” expresses the Hebrew doer language in common English.
