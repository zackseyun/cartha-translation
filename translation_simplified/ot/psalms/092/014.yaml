simplification_decisions:
- pob_phrase: They still bear fruit in old age
  simplified_phrase: Even in old age, they still bear fruit
  preserved_meaning: The righteous continue to be fruitful when they grow old.
  reasoning_layer_used: Lexical decisions for עוֹד, יְנוּבוּן, and בְּשֵׂיבָה
  rationale: Moving the time phrase first makes the contrast easier to grasp without changing the tree image.
- pob_phrase: they are full of sap and green
  simplified_phrase: They remain full of sap and green
  preserved_meaning: They continue to have the rich vitality pictured by a healthy tree.
  reasoning_layer_used: Lexical decisions for דְּשֵׁנִים and רַעֲנַנִּים
  rationale: “Remain” connects their ongoing vitality with “still” while preserving both botanical images.
