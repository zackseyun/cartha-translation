simplification_decisions:
- pob_phrase: he will snatch you up and pull you from your tent
  simplified_phrase: He will snatch you up, drag you out of your tent
  preserved_meaning: God forcefully removes the person from his dwelling.
  reasoning_layer_used: POB lexical decisions for יַחְתְּךָ, וְיִסָּחֲךָ, and מֵאֹהֶל
  rationale: “Drag you out” makes the forceful removal clear while preserving the concrete tent image.
- pob_phrase: and uproot you from the land of the living
  simplified_phrase: and uproot you from the land of the living
  preserved_meaning: God removes the person from the realm of the living.
  reasoning_layer_used: POB lexical decision for וְשֵׁרֶשְׁךָ and מֵאֶרֶץ חַיִּים
  rationale: The vivid root image and established Hebrew idiom remain understandable in common English.
- pob_phrase: But God will also tear you down forever
  simplified_phrase: But God will also tear you down forever.
  preserved_meaning: God’s judgment answers the wicked person’s boast and has enduring finality.
  reasoning_layer_used: POB discourse, lexical, and theological decisions for גַּם, יִתָּצְךָ, and לָנֶצַח
  rationale: A separate sentence gives the judgment direct force without weakening “forever.”
