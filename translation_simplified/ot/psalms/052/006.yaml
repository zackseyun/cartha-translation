translation:
  language: en
  text: But God will also tear you down forever. He will snatch you away[a] and drag you out of your tent. He will uproot you from the land of the living. Selah[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “seize you.” The rare Hebrew verb describes forceful removal.
    reason: lexical_alternative
  - marker: b
    text: Selah is a Hebrew term whose exact meaning is uncertain.
    reason: source_note
simplification_decisions:
- pob_phrase: But God will also tear you down forever
  simplified_phrase: But God will also tear you down forever.
  preserved_meaning: God too will act against the wicked person, and his judgment will have lasting finality.
  reasoning_layer_used: Lexical decisions for גַּם and לָנֶצַח, with the theological decision on enduring judgment.
  rationale: The short sentence keeps both the contrast in “But” and the additive force of “also.”
- pob_phrase: he will snatch you up and pull you from your tent
  simplified_phrase: He will snatch you away and drag you out of your tent.
  preserved_meaning: God will remove the person forcefully from his dwelling through two distinct actions.
  reasoning_layer_used: Lexical decisions for יַחְתְּךָ, וְיִסָּחֲךָ, and מֵאֹהֶל.
  rationale: “Away” and “out” clarify the movement while the forceful verbs preserve the violent removal and tent image.
- pob_phrase: and uproot you from the land of the living
  simplified_phrase: He will uproot you from the land of the living.
  preserved_meaning: God will remove the person from the realm of those who are alive.
  reasoning_layer_used: Lexical decisions for וְשֵׁרֶשְׁךָ and מֵאֶרֶץ חַיִּים.
  rationale: A separate sentence makes the final consequence clear without weakening the root image.
translation_notes:
  risk_flags:
  - risk: “Drag” may sound stronger than the POB’s “pull.”
    mitigation: The documented lexical range and context support forceful removal.
  - risk: “Forever” may suggest claims beyond what the verse specifies.
    mitigation: The wording preserves enduring finality without defining the judgment’s metaphysical nature.
