simplification_decisions:
- pob_phrase: I will give thanks to you forever, because you have done it
  simplified_phrase: I will thank you forever for what you have done
  preserved_meaning: God’s completed action is the reason for enduring thanks.
  reasoning_layer_used: POB lexical decisions for אוֹדְךָ, לְעוֹלָם, כִּי, and עָשִׂיתָ
  rationale: The recast clause expresses the same cause in more natural English.
- pob_phrase: I will hope in your name
  simplified_phrase: I will put my hope in your name
  preserved_meaning: The speaker directs expectant trust toward God as represented by his name.
  reasoning_layer_used: POB lexical decision and applied source audit for וַאֲקַוֶּה שִׁמְךָ
  rationale: “Put my hope in” makes the intended reliance immediately clear.
- pob_phrase: your faithful ones
  simplified_phrase: your faithful people
  preserved_meaning: The phrase identifies God’s devoted covenant community.
  reasoning_layer_used: POB lexical and theological decisions for חֲסִידֶיךָ
  rationale: “Faithful people” is ordinary English without introducing the later technical sense of “saints.”
translation_notes:
