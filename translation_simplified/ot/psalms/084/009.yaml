simplification_decisions:
- pob_phrase: Look on our shield, O God
  simplified_phrase: God, look with favor on our shield
  preserved_meaning: The prayer asks for God's favorable attention while retaining the shield image and its uncertain referent.
  reasoning_layer_used: POB lexical and theological decisions on רְאֵה and מָגִנֵּנוּ
  rationale: Natural word order clarifies the address without deciding whether the shield is God or the king.
- pob_phrase: and look on the face of
  simplified_phrase: look with favor on the face of
  preserved_meaning: The second request retains both attentive regard and the concrete face image.
  reasoning_layer_used: POB lexical decisions on וְהַבֵּט and פְּנֵי
  rationale: Repeating “look with favor” makes the petition clear while preserving the parallel command and image.
- pob_phrase: your anointed
  simplified_phrase: your anointed one
  preserved_meaning: The title refers most directly to the anointed king without making “Messiah” the main-text reading.
  reasoning_layer_used: POB lexical and theological decisions on מְשִׁיחֶךָ
  rationale: Adding “one” makes the title natural in current English without narrowing its theological resonance.
