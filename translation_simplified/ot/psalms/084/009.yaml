translation:
  language: en
  text: God, look with favor on our shield[a]; look with favor on the face of your anointed one.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “our protector.” The image may refer either to God as protector or to the king.
    reason: lexical_alternative
  - marker: b
    text: In this setting, “your anointed one” most directly means the anointed king; the Hebrew word is also the source of “Messiah.”
