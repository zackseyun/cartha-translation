  preserved_meaning: The courts remain the courtyards associated with God’s place of worship.
  reasoning_layer_used: POB theological decision on sanctuary language
  rationale: “Sanctuary” prevents readers from mistaking these courts for legal courts.
- pob_phrase: stand at the threshold
  simplified_phrase: stand humbly at the doorway
  preserved_meaning: The speaker prefers even a lowly place at the entrance to God’s house.
  reasoning_layer_used: POB lexical decision for הִסְתּוֹפֵף
  rationale: “Doorway” is more familiar than “threshold” while retaining the entrance image.
- pob_phrase: than dwell in the tents of wickedness
