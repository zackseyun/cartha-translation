  preserved_meaning: Living among wickedness is inferior to being near God’s sanctuary.
  reasoning_layer_used: POB lexical decisions for מִדּוּר and בְּאָהֳלֵי רֶשַׁע
  rationale: “Make my home” clearly expresses settled residence without weakening “wickedness.”
