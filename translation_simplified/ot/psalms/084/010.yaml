translation:
  language: en
  text: One day in your sanctuary courts is better than a thousand.[a] I would rather stand humbly at the doorway of my God’s house[b] than make my home in the tents of wickedness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew simply says “than a thousand” and does not state “days” or “elsewhere.”
    reason: alternative_reading
  - marker: b
    text: Or, “I have chosen to be at the threshold of my God’s house”; this does not necessarily mean serving as a doorkeeper.
    reason: lexical_alternative
