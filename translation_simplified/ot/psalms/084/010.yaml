translation:
  language: en
  text: For a single day in your courts is better than a thousand.[a] I would rather stand at the threshold of the house of my God[b] than live in the tents of wickedness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew says only “than a thousand”; it does not specify “days” or “elsewhere.”
    reason: alternative_reading
  - marker: b
    text: Or, “I have chosen to be at the threshold of the house of my God”; traditionally, “I would rather be a doorkeeper in the house of my God.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a day in your courts
  simplified_phrase: a single day in your courts
  preserved_meaning: Even one day near God's sanctuary surpasses a thousand by comparison.
  reasoning_layer_used: Lexical decision for בַּחֲצֵרֶיךָ and the sanctuary-language decision.
  rationale: “Single” makes the numerical contrast immediately clear without supplying the missing comparison.
- pob_phrase: stand at the threshold in the house of my God
  simplified_phrase: stand at the threshold of the house of my God
  preserved_meaning: The speaker prefers a lowly place at God's sanctuary.
  reasoning_layer_used: Lexical decision for הִסְתּוֹפֵף and theological decision on sanctuary imagery.
  rationale: The ordinary preposition “of” clarifies the location while retaining the threshold image.
- pob_phrase: than dwell in the tents of wickedness
  simplified_phrase: than live in the tents of wickedness
  preserved_meaning: Residence among wickedness is rejected in favor of nearness to God.
  reasoning_layer_used: Lexical decisions for מִדּוּר and בְּאָהֳלֵי רֶשַׁע.
  rationale: “Live” is more common than “dwell” while preserving the concrete tents and moral contrast.
translation_notes:
  risk_flags:
  - risk: Readers may assume the unstated comparison is a thousand days or days elsewhere.
    mitigation: The main text keeps the Hebrew incomplete comparison, and footnote a explains it.
  - risk: “Threshold” may not fully convey the lowly place implied by the Hebrew verb.
    mitigation: The concrete image is retained, and footnote b records the main lexical alternatives.
