  rationale: Natural English word order removes the formal “O” while retaining the direct lament and divine name.
- pob_phrase: do you reject my soul?
  simplified_phrase: do you reject me?
  preserved_meaning: The speaker feels personally rejected by God.
  reasoning_layer_used: POB lexical decision for נַפְשִׁי and lexical-alternative footnote
