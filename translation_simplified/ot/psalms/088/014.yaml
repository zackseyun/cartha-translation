translation:
  language: en
  text: Yahweh, why do you reject me?[a] Why do you hide your face from me?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally “reject my soul”; here “my soul” can mean “me” or “my life.”
