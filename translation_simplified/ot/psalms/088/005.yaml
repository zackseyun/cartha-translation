translation:
  language: en
  text: I am set free—but only among the dead.[a] I am like those who were killed and now lie in the grave. You remember them no more,[b] and they are cut off from your hand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The language of being set free is ironic: he feels removed from the world of the living, as if already dead.'
    reason: lexical_alternative
  - marker: b
    text: Here “remember” includes attending to someone and acting for them, not merely thinking about them.
    reason: lexical_alternative
