simplification_decisions:
- pob_phrase: Is your wonder made known in the darkness, or your righteousness
  simplified_phrase: Is your wonder made known in the darkness of death? Or is your righteousness made known
  preserved_meaning: Both lines remain parallel rhetorical questions about whether God’s wonder and righteousness are proclaimed among the dead.
  reasoning_layer_used: lexical decisions and immediate poetic context
  rationale: Two short questions clarify the parallel structure, and repeating “made known” makes the second line complete.
- pob_phrase: in the land of forgetfulness
  simplified_phrase: in the land of forgetfulness
  preserved_meaning: The concrete poetic image for the realm of the dead remains intact.
  reasoning_layer_used: lexical decision and POB cultural note
  rationale: The image is retained because replacing it entirely with “the dead” would erase the Hebrew metaphor.
