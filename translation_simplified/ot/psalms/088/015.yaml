translation:
  language: en
  text: Ever since I was young, I have suffered and been close to death. I carry your terrors, and they overwhelm me.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew ending is difficult. It may also mean, “I have borne your terrors; I am distraught or bewildered.”
