simplification_decisions:
- pob_phrase: I am afflicted and near death from my youth
  simplified_phrase: Ever since I was young, I have suffered and been close to death
  preserved_meaning: The psalmist has endured affliction and nearness to death from an early age until now.
  reasoning_layer_used: Lexical decisions for עָנִי, וְגֹוֵעַ, and מִנֹּעַר
  rationale: The new wording makes the long duration and suffering immediately clear in common English.
- pob_phrase: I bear your terrors
  simplified_phrase: I carry your terrors
  preserved_meaning: The psalmist continues to endure terrors attributed directly to God’s dealings with him.
  reasoning_layer_used: Lexical decision for נָשָׂאתִי and theological decision on “your terrors”
  rationale: “Carry” preserves the source image while sounding more familiar than “bear.”
- pob_phrase: I am overwhelmed
  simplified_phrase: they overwhelm me
  preserved_meaning: God’s terrors leave the psalmist engulfed and undone.
  reasoning_layer_used: Lexical decision for אָפוּנָה
  rationale: Naming the terrors as the immediate cause makes the connection easier to follow without narrowing the difficult verb.
translation_notes:
