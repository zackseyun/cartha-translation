translation:
  language: en
  text: Your wrath has settled on me, and you have brought suffering on me with all your breaking waves.[a] Selah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew pictures powerful sea waves as they break; “breakers” or “billows” are also possible.
    reason: lexical_alternative
  - marker: b
    text: The meaning of “Selah” is uncertain; it is probably a musical or worship marker.
    reason: source_note
simplification_decisions:
- pob_phrase: Your wrath has rested on me
  simplified_phrase: Your wrath has settled on me
  preserved_meaning: God’s anger has come to rest upon the speaker.
  reasoning_layer_used: Lexical decision for סָמְכָה and theological decision on divine anger
  rationale: “Settled on me” makes the spatial image more natural without reducing wrath to general distress.
- pob_phrase: with all your breakers
  simplified_phrase: with all your breaking waves
  preserved_meaning: God’s affliction is pictured as the full force of sea waves crashing over the speaker.
  reasoning_layer_used: Lexical decision for מִשְׁבָּרֶיךָ
  rationale: “Breaking waves” immediately explains the less familiar noun “breakers” while retaining the sea image.
- pob_phrase: you have afflicted me
  simplified_phrase: you have brought suffering on me
  preserved_meaning: The speaker directly attributes his suffering to God’s action.
  reasoning_layer_used: Lexical decision for עִנִּיתָ and theological decision on divine agency
  rationale: The clearer phrase preserves both severe suffering and God’s direct agency.
translation_notes:
  risk_flags:
  - risk: “Brought suffering on me” is less compact than the Hebrew verb for affliction.
    mitigation: The wording preserves the documented sense and does not soften God’s agency.
  - risk: Readers may assume a definite meaning for “Selah.”
    mitigation: The footnote states that its meaning remains uncertain.
