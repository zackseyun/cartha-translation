simplification_decisions:
- pob_phrase: Know that Yahweh, he is God.
  simplified_phrase: 'Know this: Yahweh is God.'
  preserved_meaning: The command calls everyone addressed to acknowledge that Yahweh truly is God.
  reasoning_layer_used: Lexical decisions for דְּעוּ, כִּי, and הוּא אֱלֹהִים
  rationale: A colon gives the command natural English force without losing the Hebrew emphasis.
- pob_phrase: He made us, and not we ourselves
  simplified_phrase: He made us; we did not make ourselves.
  preserved_meaning: Yahweh created his people, and they are not their own makers.
  reasoning_layer_used: Ketiv reading and theological decision
  rationale: A direct negative clause makes the written-text reading immediately clear.
- pob_phrase: the sheep of his pasture
  simplified_phrase: the sheep in his pasture
  preserved_meaning: God’s people are pictured as sheep belonging in the pasture he provides.
  reasoning_layer_used: Lexical decision for וְצֹאן מַרְעִיתוֹ
  rationale: The ordinary preposition preserves the pastoral image while sounding natural.
