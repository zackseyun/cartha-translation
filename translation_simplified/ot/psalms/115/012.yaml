simplification_decisions:
- pob_phrase: Yahweh has remembered us; he will bless;
  simplified_phrase: Yahweh has remembered us. He will bless.
  preserved_meaning: Yahweh’s completed act of remembering grounds confidence that he will bless.
  reasoning_layer_used: POB lexical decisions for זְכָרָנוּ and יְבָרֵךְ
  rationale: Short sentences clarify the movement from remembered care to future blessing.
- pob_phrase: the house of Israel
  simplified_phrase: the people of Israel
  preserved_meaning: The phrase refers collectively to Israel as the covenant people.
  reasoning_layer_used: POB lexical rationale and Psalm 115:9–12 context
  rationale: “People” avoids the misleading impression of one immediate family.
- pob_phrase: the house of Aaron
  simplified_phrase: the family of Aaron
  preserved_meaning: The phrase identifies Aaron’s priestly family as a distinct group.
  reasoning_layer_used: POB lexical rationale for בֵּית אַהֲרֹן
  rationale: “Family” makes the priestly household designation clear in modern English.
translation_notes:
  risk_flags:
  - risk: “People of Israel” makes the source’s household image less explicit.
    mitigation: It preserves the corporate covenant referent without narrowing Israel to one family.
  - risk: The stand-alone sentence “He will bless” may sound unusual.
    mitigation: It retains the Hebrew repetition and poetic emphasis without adding an object.
