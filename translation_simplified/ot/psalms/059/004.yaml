simplification_decisions:
- pob_phrase: Without guilt
  simplified_phrase: Though I am not guilty
  preserved_meaning: The psalmist says he bears no guilt that would justify the attack.
  reasoning_layer_used: POB lexical rationale and immediate context
  rationale: The full clause prevents readers from mistaking the attackers for the guiltless ones.
- pob_phrase: they run and set themselves in place
  simplified_phrase: they rush and take their positions
  preserved_meaning: The attackers move quickly and establish themselves for action.
  reasoning_layer_used: POB lexical decision and footnoted alternative
  rationale: This uses ordinary English while retaining both rapid movement and taking position.
- pob_phrase: awake to meet me and see
  simplified_phrase: Awake! Come to meet me and see.
  preserved_meaning: The psalmist urgently calls on God to act, come to him, and take notice.
  reasoning_layer_used: POB theological and lexical decisions
  rationale: Short commands clarify the plea while preserving the image of God awakening.
interpretive_expansions:
- pob_phrase: Without guilt
  rendering: Though I am not guilty
  claim: The lack of guilt belongs to the psalmist rather than to his attackers.
  evidence:
  - The POB lexical rationale identifies this as the psalmist’s protest of innocence.
  - The surrounding attack language makes the psalmist the natural bearer of the denied guilt.
  confidence: high
  alternatives_preserved:
  - Without wrongdoing on my part
translation_notes:
  risk_flags:
  - risk: “Take their positions” may sound more tactical than the Hebrew requires.
    mitigation: The footnote preserves the broader possibility “get ready.”
  - risk: “Awake” could imply to some readers that God literally sleeps.
    mitigation: It is retained as the POB-required poetic metaphor pleading for God to act.
