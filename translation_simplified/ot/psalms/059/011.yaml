  preserved_meaning: Their immediate death could lead the people to forget the lesson of God’s judgment.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The wording replaces “lest” with a familiar expression while keeping the feared result uncertain.
- pob_phrase: make them wander by your power
  simplified_phrase: Use your power to make them wander
  preserved_meaning: God is asked to cause their unsettled movement through his own power.
  reasoning_layer_used: POB lexical decision for בְחֵילְךָ and הֲנִיעֵמוֹ
  rationale: The clause is recast in ordinary English without changing its agency or judgment image.
- pob_phrase: bring them down, O Lord our shield
  simplified_phrase: bring them down, O Lord our shield
  preserved_meaning: The prayer asks God to humble the enemies while naming him as the people’s shield.
  reasoning_layer_used: POB lexical decisions for וְהוֹרִידֵמוֹ and מָגִנֵּנוּ
  rationale: The lowering and shield images remain because both carry important biblical force.
