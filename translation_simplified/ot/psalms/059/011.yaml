translation:
  language: en
  text: Do not kill them, or my people may forget. Use your power to make them wander[a], and bring them down, O Lord our shield.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “shake them” or “make them stagger”; the Hebrew can describe restless movement or instability.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew title pictures the Lord as the shield who protects his people.
    reason: simplification_note
simplification_decisions:
- pob_phrase: lest my people forget
  simplified_phrase: or my people may forget
  preserved_meaning: Their forgetting is the feared result if the enemies die immediately.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The rewrite replaces the uncommon word “lest” without weakening the warning.
- pob_phrase: make them wander by your power
  simplified_phrase: Use your power to make them wander
  preserved_meaning: God is asked to cause their prolonged, unsettled movement by his own power.
  reasoning_layer_used: POB lexical decision for הֲנִיעֵמוֹ and בְחֵילְךָ
  rationale: The active wording makes the means of judgment easier to follow.
- pob_phrase: O Lord our shield
  simplified_phrase: O Lord our shield
  preserved_meaning: The divine title and concrete shield image remain intact.
  reasoning_layer_used: POB lexical decisions for אֲדֹנָי and מָגִנֵּנוּ
  rationale: The biblical image is retained because replacing it with “protector” would flatten the metaphor.
translation_notes:
  risk_flags:
  - risk: “Make them wander” is only one possible sense of the Hebrew verb.
    mitigation: The footnote preserves the alternatives involving shaking or instability.
