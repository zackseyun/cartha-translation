translation:
  language: en
  text: Do not kill them, or my people may forget. Use your power to make them wander[a] and bring them down, O Lord our shield.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “shake them” or “make them totter,” emphasizing restless movement or instability.
    reason: lexical_alternative
