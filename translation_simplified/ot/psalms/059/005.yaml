translation:
  language: en
  text: But you, Yahweh, God of Armies and God of Israel, wake up to punish all the nations.[a] Show no favor to anyone who acts treacherously and does evil.[b] Selah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “wake up to visit or call all the nations to account.”
    reason: lexical_alternative
  - marker: b
    text: Or “have no mercy”; the Hebrew literally means “show no favor” or “be gracious.”
    reason: lexical_alternative
  - marker: c
    text: “Selah” was probably a musical or worship notation, but its exact meaning is uncertain.
    reason: cultural_note
simplification_decisions:
- pob_phrase: O Yahweh God of hosts, God of Israel
  simplified_phrase: Yahweh, God of Armies and God of Israel
  preserved_meaning: Yahweh is addressed by titles expressing his rule over armies and his covenant relationship with Israel.
  reasoning_layer_used: POB lexical decisions for יְהוָה, אֱלֹהִים צְבָאוֹת, and אֱלֹהֵי יִשְׂרָאֵל
  rationale: “God of Armies” makes the older term “hosts” understandable while preserving its military image.
- pob_phrase: awake to punish all the nations
  simplified_phrase: wake up to punish all the nations
  preserved_meaning: The psalmist uses the image of waking God and asks him to judge every hostile nation.
  reasoning_layer_used: POB lexical and theological decisions for הָקִיצָה, פקד, and כָּל הַגּוֹיִם
  rationale: “Wake up” is natural modern English and keeps the force of the psalmic metaphor.
- pob_phrase: any treacherous evildoers
  simplified_phrase: anyone who acts treacherously and does evil
  preserved_meaning: The plea concerns people marked by both betrayal and wicked conduct.
  reasoning_layer_used: POB lexical decision for בֹּגְדֵי אָוֶן
  rationale: The descriptive clause states both source ideas more plainly than the compressed label.
