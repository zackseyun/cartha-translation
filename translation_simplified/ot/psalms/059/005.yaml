translation:
  language: en
  text: But you, Yahweh, God of armies[a] and God of Israel—wake up! Punish all the nations. Show no favor to anyone who does evil and acts treacherously.[b] Selah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The title “God of armies” can refer to both earthly and heavenly armies.
    reason: simplification_note
  - marker: b
    text: Or “show no mercy to anyone who does evil and acts treacherously.” The Hebrew verb means “show favor” or “be gracious.”
    reason: lexical_alternative
  - marker: c
    text: “Selah” is probably a musical or worship notation, but its precise meaning is uncertain.
    reason: cultural_note
