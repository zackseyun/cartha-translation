simplification_decisions:
- pob_phrase: My God, in his steadfast love
  simplified_phrase: With his faithful love, my God
  preserved_meaning: God’s loyal, enduring love accompanies his action for the speaker.
  reasoning_layer_used: lexical decision and textual-variant audit
  rationale: “Faithful love” makes the covenant loyalty of “steadfast love” easier to understand.
- pob_phrase: will go before me
  simplified_phrase: will go ahead of me
  preserved_meaning: God acts in advance to help the speaker while retaining the image of preceding him.
  reasoning_layer_used: lexical rationale for יְקַדְּמֵנִי
  rationale: “Go ahead of me” is natural English and preserves the verb’s forward movement.
- pob_phrase: will let me look on my enemies
  simplified_phrase: will let me see my enemies
  preserved_meaning: God will cause or permit the speaker to see his hostile adversaries.
  reasoning_layer_used: lexical rationale for יַרְאֵנִי and בְשֹׁרְרָי
  rationale: The simpler wording keeps the causative sense without explicitly adding triumph.
translation_notes:
  risk_flags:
  - risk: “See my enemies” may sound like mere visual contact rather than witnessing their outcome.
    mitigation: The wording follows POB’s restraint and does not import an explicit claim of triumph.
  - risk: Reordering the first clause could obscure the unusual textual relationship between “my God” and “his love.”
    mitigation: The footnote preserves both the written form and the traditional reading.
