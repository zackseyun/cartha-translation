  simplified_phrase: Consume them in your wrath. Consume them until they are no more
  preserved_meaning: The repeated plea asks God to destroy the enemies completely.
  reasoning_layer_used: Lexical and theological decisions on כַּלֵּה and imprecatory language
  rationale: Two sentences clarify the repeated command without softening its severity.
- pob_phrase: God rules in Jacob
  simplified_phrase: God rules among Jacob’s people
  preserved_meaning: God rules in relation to Jacob, the covenant people Israel.
  reasoning_layer_used: Lexical decision and footnote for בְּיַעֲקֹב
  rationale: The wording identifies Jacob as a people while retaining the covenant name.
- pob_phrase: so that they may know that God rules in Jacob to the ends of the earth
  simplified_phrase: so that they may know that God rules among Jacob’s people to the ends of the earth
  preserved_meaning: The enemies’ knowledge, God’s rule among Israel, and its worldwide scope remain linked.
  reasoning_layer_used: Theological decision preserving particular rule and universal recognition
  rationale: Keeping one clause avoids turning the final phrase into a separate command.
