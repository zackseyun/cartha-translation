  text: In your wrath, consume them. Consume them until none remain. Do this so that they may know that God rules in Jacob to the ends of the earth.[a] Selah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “In Jacob” means in relation to Jacob’s people, Israel; it may also be translated “over Jacob.”
    reason: lexical_alternative
  - marker: b
    text: The meaning of “Selah” is uncertain.
