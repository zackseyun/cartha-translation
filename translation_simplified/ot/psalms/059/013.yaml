translation:
  language: en
  text: Consume them in your wrath. Consume them until they are no more, so that they may know that God rules among Jacob’s people to the ends of the earth. Selah.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Jacob’s people” means Israel; the Hebrew can also be translated “over Jacob.”
    reason: lexical_alternative
  - marker: b
    text: The precise meaning of “Selah” is uncertain.
    reason: source_note
