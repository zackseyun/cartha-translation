  preserved_meaning: Their cursing and dishonest speech are grounds for the petition.
  reasoning_layer_used: POB lexical decisions
  rationale: The abstract nouns become clear English verbs while keeping both kinds of sinful speech distinct.
- pob_phrase: in their pride
