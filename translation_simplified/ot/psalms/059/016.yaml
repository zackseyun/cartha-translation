simplification_decisions:
- pob_phrase: I will sing of your strength
  simplified_phrase: I will sing about your strength
  preserved_meaning: The psalmist resolves to praise God’s powerful protection.
  reasoning_layer_used: Lexical decisions for אָשִׁיר and עֻזֶּךָ
  rationale: “Sing about” is more natural than “sing of” for common readers.
- pob_phrase: for you have been a stronghold for me
  simplified_phrase: because you have been my fortress
  preserved_meaning: God has proved to be the psalmist’s secure, fortress-like protector.
  reasoning_layer_used: Lexical decisions for כִּי, הָיִיתָ, and מִשְׂגָּב
  rationale: “Because” states the reason plainly, while “my fortress” keeps the protective image personal.
- pob_phrase: and a refuge in the day of my distress
  simplified_phrase: and my place of safety when I am in distress
  preserved_meaning: God is where the psalmist can flee for safety during personal trouble.
  reasoning_layer_used: Lexical decisions for וּמָנוֹס and בְּיוֹם צַר לִי
  rationale: The wording explains “refuge” without limiting the distress to one past event.
