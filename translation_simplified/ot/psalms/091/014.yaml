translation:
  language: en
  text: He clings to me,[a] so I will rescue him. I will place him high above,[b] because he knows my name.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “He loves me” or “He has set his affection on me.” The Hebrew describes strong attachment.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew pictures God placing him at an inaccessible height and thus protecting him.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Because he clings to me
  simplified_phrase: He clings to me, so
  preserved_meaning: His strong attachment to God is the reason God promises to act.
  reasoning_layer_used: POB lexical decision for כִּי and חָשַׁק
  rationale: The cause is recast in ordinary English without weakening the image of clinging.
- pob_phrase: I will set him on high
  simplified_phrase: I will place him high above
  preserved_meaning: God pictures placing him at a height beyond an enemy’s reach.
  reasoning_layer_used: POB lexical and theological decision for אֲשַׂגְּבֵהוּ
  rationale: The clearer wording keeps the source’s height image rather than replacing it with “protect.”
- pob_phrase: I will rescue him; I will set him on high
  simplified_phrase: I will rescue him. I will place him high above
  preserved_meaning: God promises two related acts of deliverance and protective elevation.
  reasoning_layer_used: POB syntax and applied revision
  rationale: Two sentences make the promises easier to follow while keeping them distinct.
translation_notes:
  risk_flags:
  - risk: “High above” could be mistaken for honor or exaltation rather than safety.
    mitigation: The footnote identifies inaccessible height and protection as the intended image.
