translation:
  language: en
  text: A thousand may fall[a] beside you—even ten thousand at your right hand—but it[b] will not come near you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “will fall.” The Hebrew can express either possibility or future action here.
    reason: alternative_reading
  - marker: b
    text: The Hebrew does not state the subject; “it” refers generally to the threatened calamity.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: at your side
  simplified_phrase: beside you
  preserved_meaning: The spatial image of people falling close to the protected person remains intact.
  reasoning_layer_used: Lexical decision for מִצִּדְּךָ
  rationale: “Beside you” is more direct common English for the same location.
- pob_phrase: and ten thousand at your right hand
  simplified_phrase: even ten thousand at your right hand
  preserved_meaning: The second number intensifies the first while retaining the right-hand image.
  reasoning_layer_used: Lexical decisions for וּרְבָבָה and מִימִינֶךָ
  rationale: “Even” makes the poetic increase easier to recognize without changing the number.
translation_notes:
  risk_flags:
  - risk: Readers may take “may fall” only as uncertainty rather than poetic modality.
    mitigation: Footnote a preserves the possible future reading “will fall.”
  - risk: The pronoun “it” has no stated noun within the verse.
    mitigation: Footnote b identifies the contextual referent without narrowing it to one specific threat.
