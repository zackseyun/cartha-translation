translation:
  language: en
  text: You will step on lions and cobras[a], and you will trample young lions and serpents[b] underfoot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally “asps.”
    reason: lexical_alternative
  - marker: b
    text: Or “dragons.” The Hebrew word can refer to a great reptile or sea creature, but “serpents” best fits this list of dangerous land animals.
    reason: alternative_reading
