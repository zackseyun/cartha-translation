  text: You will step on lions and venomous snakes[a]. You will trample young lions and serpents[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew means a venomous snake, but its exact kind is uncertain; traditional translations include “asp,” “adder,” and “cobra.”
