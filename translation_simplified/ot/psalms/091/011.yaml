translation:
  language: en
  text: For God will command his angels to guard you in all your ways.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be expressed as “command his angels concerning you” or “for you.” “Your ways” includes your paths and journeys and can also refer to the course of your life.
    reason: lexical_alternative
