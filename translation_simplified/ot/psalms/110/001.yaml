  language: en
  text: 'A psalm connected with David.[a]


    Yahweh says[b] to my lord,[c] “Sit in the place of honor at my right hand until I make your enemies a footstool for your feet.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew heading may mean by David, for David, or otherwise associated with David.
    reason: alternative_reading
  - marker: b
    text: Or “Yahweh declares”; the Hebrew introduces a solemn divine statement.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew distinguishes the divine name “Yahweh” from the honorific title “my lord.”
    reason: source_note
