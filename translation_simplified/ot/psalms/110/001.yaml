translation:
  language: en
  text: 'Of David.[a] A psalm.


    Yahweh says to my lord,[b]

    “Sit in the place of honor at my right hand

    until I make your enemies

    a footstool for your feet.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew heading may also mean “For David” or “By David.”
    reason: lexical_alternative
  - marker: b
    text: Yahweh is God’s personal name; “my lord” is a distinct title in Hebrew.
    reason: lexical_alternative
