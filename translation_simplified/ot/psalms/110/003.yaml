  reasoning_layer_used: lexical decision for חֵילֶךָ
  rationale: The active wording makes the compressed Hebrew relation clear in ordinary English.
- pob_phrase: will offer themselves freely
  simplified_phrase: will willingly present themselves
  preserved_meaning: The people voluntarily give themselves like freewill offerings.
  reasoning_layer_used: lexical decision for נְדָבֹת
  rationale: This keeps both willing participation and the image of self-presentation.
- pob_phrase: from the womb of the dawn ... the dew of your youth
  simplified_phrase: From the womb of the dawn, the dew of your youth
  preserved_meaning: The concrete birth and dew images remain without forcing one interpretation of the difficult line.
  reasoning_layer_used: lexical and theological decisions for מֵרֶחֶם מִשְׁחָר and יַלְדֻתֶיךָ
  rationale: The poetic imagery is retained because a plain paraphrase would erase the documented ambiguity.
