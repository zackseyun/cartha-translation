translation:
  language: en
  text: On the day you display your power, your people will willingly present themselves in holy splendor.[a] From the womb of the dawn, the dew of your youth belongs to you.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Holy splendor” may also mean holy attire or sacred garments.
    reason: lexical_alternative
  - marker: b
    text: The final line is difficult; it may picture youthful freshness or young followers who are like dew from the dawn.
    reason: alternative_reading
