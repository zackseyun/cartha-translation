translation:
  language: en
  text: You care for the earth. You water it and make it richly fertile. The river of God[a] is full of water. You prepare the people’s grain[b], for this is how you make the earth ready.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “God’s stream” or “God’s channel.” The poetic expression may point to the heavenly source of rain and fertility.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says “their grain,” most naturally referring to the people who depend on the earth’s produce; it may refer more generally to the earth’s produce.
    reason: simplification_note
