translation:
  language: en
  text: You answer us with awe-inspiring deeds, doing what is right.[a] O God who saves us, people everywhere—even in the farthest parts of the earth and across the distant seas—trust in you.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “acting with justice.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew has “distant sea,” which may refer collectively to distant seas.
    reason: source_note
simplification_decisions:
- pob_phrase: With awesome deeds in righteousness you answer us
  simplified_phrase: You answer us with awe-inspiring deeds, doing what is right
  preserved_meaning: God answers through deeds that inspire awe and accord with righteousness.
  reasoning_layer_used: Lexical and theological decisions for נוראות and בצדק
  rationale: This clarifies both the force of “awesome” and the moral sense of “righteousness” without adding faithfulness.
- pob_phrase: O God of our salvation
  simplified_phrase: O God who saves us
  preserved_meaning: God is directly addressed as the source of the people's salvation.
  reasoning_layer_used: Lexical decision for אֱלֹהֵי יִשְׁעֵנוּ
  rationale: The verbal form states God's saving role in common English.
- pob_phrase: the confidence of all the ends of the earth and of the distant sea
  simplified_phrase: people everywhere—even in the farthest parts of the earth and across the distant seas—trust in you
  preserved_meaning: People throughout the world, including its remotest regions, rely on God.
  reasoning_layer_used: Lexical decisions for מִבְטָח, כָּל קַצְוֵי אֶרֶץ, and וְיָם רְחֹקִים
  rationale: The recast makes the trust relationship natural while preserving universal scope and both geographic images.
interpretive_expansions:
- pob_phrase: the confidence of all the ends of the earth
  rendering: people everywhere—even in the farthest parts of the earth—trust in you
  claim: The geographic phrase represents people throughout the world who place their trust in God.
  evidence:
  - The POB defines מִבְטָח as that in which one trusts.
  - The POB explains “all the ends of the earth” as the world's remotest regions.
  confidence: high
  alternatives_preserved:
  - the confidence of all the ends of the earth
translation_notes:
  risk_flags:
  - risk: “Doing what is right” explains rather than retains the theological term “righteousness.”
    mitigation: It preserves God's morally right action, and the footnote retains “justice” as the documented alternative.
  - risk: “People” is implicit in the Hebrew geographic expression.
    mitigation: The wording makes the trust relationship explicit while preserving “all” through “people everywhere.”
