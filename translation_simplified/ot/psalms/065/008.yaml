translation:
  language: en
  text: People who live in the farthest places on earth fear[a] because of your signs. You make dawn and evening shout for joy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “stand in awe.” The Hebrew can mean fear, dread, or reverent awe.
    reason: lexical_alternative
