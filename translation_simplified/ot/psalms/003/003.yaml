simplification_decisions:
- pob_phrase: But you, O Yahweh
  simplified_phrase: But you, Yahweh
  preserved_meaning: Yahweh is addressed by his personal name in strong contrast with the preceding distress.
  reasoning_layer_used: lexical and theological decisions on וְאַתָּה and יְהוָה
  rationale: Removing the formal “O” makes the direct address natural without weakening the contrast.
- pob_phrase: are a shield around me
  simplified_phrase: are a shield all around me
  preserved_meaning: Yahweh protects the psalmist with the image of encirclement.
  reasoning_layer_used: lexical decision on מָגֵן בַּעֲדִי
  rationale: “All around” makes the protective encirclement immediately clear.
- pob_phrase: my glory, and the one who lifts up my head
  simplified_phrase: You are my glory and the one who lifts up my head
  preserved_meaning: Yahweh is the psalmist’s true honor and continually restores him through the concrete head-lifting image.
  reasoning_layer_used: lexical decisions on כְּבוֹדִי and וּמֵרִים רֹאשִׁי
  rationale: A new sentence clarifies the parallel claims while retaining both poetic expressions.
