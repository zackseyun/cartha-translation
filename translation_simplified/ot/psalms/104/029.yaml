translation:
  language: en
  text: When you hide your face,[a] they are terrified. When you take away their breath,[b] they die and return to their dust.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “your presence.” In Hebrew, “your face” can refer to your personal presence or favor.
    reason: lexical_alternative
  - marker: b
    text: Or “their spirit.” The Hebrew word can mean breath, wind, or spirit; here “breath” best fits their death and return to dust.
    reason: lexical_alternative
