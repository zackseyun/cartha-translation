simplification_decisions:
- pob_phrase: May sinners be finished from the earth
  simplified_phrase: May sinners vanish from the earth
  preserved_meaning: The wish concerns the removal of sinners themselves from the earth, not merely the end of sin.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Vanish” clearly expresses removal while keeping the prayer-like force of “may.”
- pob_phrase: Bless Yahweh, O my soul
  simplified_phrase: My soul, bless Yahweh!
  preserved_meaning: The psalmist calls his own soul to bless Yahweh.
  reasoning_layer_used: lexical decision and poetic context
  rationale: Direct English word order makes the self-exhortation easier to understand without replacing the biblical term “soul.”
