translation:
  language: en
  text: You bring darkness, and night falls. Then all the wild animals of the forest move about.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “prowl”; the Hebrew describes animals moving about at night and may include searching for prey.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: You set darkness, and it becomes night
  simplified_phrase: You bring darkness, and night falls
  preserved_meaning: God actively causes darkness to come, resulting in night.
  reasoning_layer_used: Lexical and theological decisions on divine agency and resulting state
  rationale: This uses natural English while keeping God’s direct role in ordering night.
- pob_phrase: all the beasts of the forest
  simplified_phrase: all the wild animals of the forest
  preserved_meaning: The verse refers collectively to the animals living in the forest.
  reasoning_layer_used: Lexical decision for חַיְתוֹ
  rationale: “Wild animals” is clearer to modern readers than the poetic but less common “beasts.”
- pob_phrase: creep about
  simplified_phrase: move about
  preserved_meaning: The forest animals become active and roam during the night.
  reasoning_layer_used: Lexical decision and documented alternatives for תִרְמֹשׂ
  rationale: “Move about” avoids implying that every animal literally crawls or hunts.
translation_notes:
  risk_flags:
  - risk: “Move about” weakens the concrete creeping image of the Hebrew verb.
    mitigation: The footnote preserves the possible sense “prowl” without making predatory movement certain.
