simplification_decisions:
- pob_phrase: Bless Yahweh, O my soul!
  simplified_phrase: My soul, bless Yahweh!
  preserved_meaning: The psalmist commands his own inner self to bless Yahweh.
  reasoning_layer_used: Lexical decisions for בָּרֲכִי and נַפְשִׁי
  rationale: Natural word order removes the archaic “O” while preserving direct self-address.
- pob_phrase: Yahweh my God, you are very great
  simplified_phrase: Yahweh, my God, you are very great.
  preserved_meaning: The psalmist directly addresses his God and strongly emphasizes Yahweh’s greatness.
  reasoning_layer_used: Lexical decisions for יְהוָה אֱלֹהַי and גָּדַלְתָּ מְּאֹד
  rationale: The punctuation clarifies direct address while “very” retains the degree intensifier.
- pob_phrase: you have clothed yourself with splendor and majesty
  simplified_phrase: You have clothed yourself in splendor and majesty.
  preserved_meaning: Splendor and majesty are pictured as garments Yahweh wears.
  reasoning_layer_used: Lexical decisions for הוֹד, הָדָר, and לָבָשְׁתָּ
  rationale: “Clothed yourself in” is natural English and directly preserves the attire metaphor.
