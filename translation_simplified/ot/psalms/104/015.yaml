translation:
  language: en
  text: Wine makes a man’s heart glad[a] and makes his face shine more than oil,[b] while bread gives his heart strength.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “a man” represents humanity in general, not only males.
    reason: lexical_alternative
  - marker: b
    text: Or “makes his face shine with oil.” The Hebrew can express either comparison or means.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: wine gladdens the heart of man
  simplified_phrase: Wine makes a man’s heart glad
  preserved_meaning: Wine causes gladness in a person’s inner life.
  reasoning_layer_used: Lexical decisions for יְשַׂמַּח and לְבַב אֱנוֹשׁ
  rationale: “Makes glad” clearly expresses the causative sense without adding intensity.
- pob_phrase: making the face shine more than oil
  simplified_phrase: makes his face shine more than oil
  preserved_meaning: Wine gives a person a radiance surpassing that associated with oil.
  reasoning_layer_used: Lexical decision for מִן and POB alternative-reading footnote
  rationale: The pronoun identifies whose face shines while retaining the POB comparison.
- pob_phrase: bread sustains the heart of man
  simplified_phrase: bread gives his heart strength
  preserved_meaning: Bread nourishes and supports a person’s inner vitality.
  reasoning_layer_used: Lexical decision for יִסְעָד
  rationale: This familiar wording expresses the approved sense of strengthening or sustaining.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “a man” as excluding women.
    mitigation: The footnote explains that the representative singular includes humanity generally.
  - risk: The Hebrew may describe oil as the means of making the face shine rather than a comparison.
    mitigation: The main text follows POB, while the footnote preserves the alternative.
