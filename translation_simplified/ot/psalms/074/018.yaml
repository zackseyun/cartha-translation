simplification_decisions:
- pob_phrase: 'Remember this: the enemy has mocked Yahweh'
  simplified_phrase: 'Yahweh, remember this: the enemy has mocked you'
  preserved_meaning: The psalmist directly asks Yahweh to remember the enemy’s scorn against him.
  reasoning_layer_used: The lexical decision identifies “Remember” as a direct plea to God and requires the divine name Yahweh.
  rationale: Moving “Yahweh” into direct address makes the prayer easier to follow without removing the divine name.
- pob_phrase: have despised your name
  simplified_phrase: have treated your name with contempt
  preserved_meaning: The people have shown scorn toward Yahweh’s name, identity, and revealed character.
  reasoning_layer_used: The lexical decision lists “have treated with contempt” as a valid sense of נִאֲצוּ.
  rationale: The expanded phrase sounds natural with “your name” and clearly conveys contemptuous rejection.
translation_notes:
  risk_flags:
  - risk: Changing “mocked Yahweh” to “mocked you” alters the Hebrew clause’s person.
    mitigation: Yahweh remains explicitly named as the one directly addressed at the start of the verse.
