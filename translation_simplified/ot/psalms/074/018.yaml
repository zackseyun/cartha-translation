simplification_decisions:
- pob_phrase: Remember this, O Yahweh
  simplified_phrase: Yahweh, remember this
  preserved_meaning: The psalmist directly pleads with Yahweh to take notice of the offense.
  reasoning_layer_used: Lexical decision for זְכָר and theological decision for יְהוָה
  rationale: Ordinary English places the name first while preserving the direct prayer and divine name.
- pob_phrase: and a foolish people have despised your name
  simplified_phrase: A foolish people have treated your name with contempt
  preserved_meaning: The people have shown contemptuous rejection toward Yahweh’s name.
  reasoning_layer_used: Lexical decisions for נָבָל, נִאֲצוּ, and שְׁמֶךָ
  rationale: The clearer phrase expresses the verb’s force while retaining “foolish” and the biblical concept of God’s name.
- pob_phrase: the enemy has mocked you, and a foolish people
  simplified_phrase: The enemy has mocked you. A foolish people
  preserved_meaning: The two parallel accusations remain distinct and linked by their shared appeal to Yahweh.
  reasoning_layer_used: Source grammar and applied revision
  rationale: Dividing the parallel clauses makes the verse easier to follow without merging its two charges.
translation_notes:
  risk_flags:
  - risk: Modern readers may hear “foolish” as merely unintelligent.
    mitigation: The footnote preserves its moral and spiritual force without replacing it with a stronger gloss.
