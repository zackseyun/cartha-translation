translation:
  language: en
  text: They burned your holy place. They treated the place where your name dwells[a] as if it were not holy and brought it to the ground.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This refers to the place God chose for his presence and worship, without suggesting that God was confined to the building.
    reason: cultural_note
