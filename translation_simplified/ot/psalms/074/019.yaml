simplification_decisions:
- pob_phrase: Do not give your dove to the ravenous beast
  simplified_phrase: Do not hand your dove over to a ravenous beast
  preserved_meaning: The plea still pictures God's vulnerable people as a dove threatened by a devouring animal.
  reasoning_layer_used: POB translation and applied revision
  rationale: “Hand over” makes the threatened surrender clearer while preserving both source images.
- pob_phrase: your afflicted ones
  simplified_phrase: your suffering people
  preserved_meaning: The phrase still refers to people who belong to God and are enduring distress.
  reasoning_layer_used: POB translation
  rationale: “Suffering people” is more immediate common English than “afflicted ones.”
- pob_phrase: do not forget the lives ... forever
  simplified_phrase: Do not forget the lives ... forever
  preserved_meaning: The plea concerns the lives of the whole suffering community and asks God not to abandon them permanently.
  reasoning_layer_used: Applied revision preserving “lives”
  rationale: The audited plural “lives” and the force of “forever” remain unchanged.
