  rationale: The active wording makes the means of the action immediately clear while retaining “strength” and “split.”
- pob_phrase: you shattered the heads of the sea monsters on the waters
  simplified_phrase: you shattered the heads of the sea monsters on the waters
  preserved_meaning: God violently defeated the monstrous creatures associated with the waters.
