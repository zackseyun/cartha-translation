translation:
  language: en
  text: You used your strength to split the sea apart;[a] you shattered the heads of the sea monsters[b] on the waters.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This poetic picture may point both to God’s victory over the chaotic sea and to his rescue of Israel through the sea in the exodus.
    reason: cross_reference
  - marker: b
    text: Or “dragons” or “great sea creatures.” The Hebrew word can describe huge, serpent-like creatures connected with the waters.
    reason: lexical_alternative
