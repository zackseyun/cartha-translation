translation:
  language: en
  text: Do not forget the sound of your enemies—the uproar of those who rise against you, which continues to rise.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the voice of your enemies.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the voice of your enemies
  simplified_phrase: the sound of your enemies
  preserved_meaning: God is asked not to forget the enemies’ collective hostile outcry.
  reasoning_layer_used: POB lexical decision for qol and its documented alternative
  rationale: “Sound” naturally conveys the collective hostile noise while preserving “voice” in the footnote.
- pob_phrase: which goes up continually
  simplified_phrase: which continues to rise
  preserved_meaning: The enemies’ uproar keeps ascending without interruption.
  reasoning_layer_used: POB lexical decisions for ‘goes up’ and ‘continually’
  rationale: “Continues to rise” preserves both the upward image and the ongoing action without implying growing intensity.
translation_notes:
  risk_flags:
  - risk: “Rise” may still be heard as increasing intensity rather than ascending sound.
    mitigation: “Continues to” emphasizes ongoing action, and “uproar” supplies the sound context.
