simplification_decisions:
- pob_phrase: Yet God is my King from of old
  simplified_phrase: Yet God has been my King since ancient times
  preserved_meaning: God’s kingship is long-standing without implying the absolute beginning.
  reasoning_layer_used: lexical decision for מִקֶּדֶם
  rationale: The wording replaces an archaic phrase with natural English.
- pob_phrase: working acts of salvation
  simplified_phrase: he performs saving deeds
  preserved_meaning: God characteristically accomplishes repeated acts of deliverance.
  reasoning_layer_used: lexical decisions for פֹּעֵל and יְשׁוּעוֹת
  rationale: The active wording makes God’s repeated saving actions easy to understand.
- pob_phrase: in the midst of the earth
  simplified_phrase: in the world
  preserved_meaning: God’s saving deeds take place within the earth, without claiming they occur in every part of it.
  reasoning_layer_used: lexical and theological decisions for בְּקֶרֶב הָאָרֶץ
  rationale: “In the world” clearly expresses the preferred broad sense without adding distributive scope.
