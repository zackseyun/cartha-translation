translation:
  language: en
  text: 'A psalm of David.[a]


    The earth and everything in it belong to Yahweh—the world and all who live in it.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may mean a psalm by David, belonging to David, or for David.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The earth and its fullness are Yahweh’s
  simplified_phrase: The earth and everything in it belong to Yahweh
  preserved_meaning: Yahweh owns the earth together with all it contains.
  reasoning_layer_used: lexical decision for וּמְלוֹאָהּ and the Hebrew possession clause
  rationale: The approved lexical alternative makes “fullness” immediately understandable.
- pob_phrase: the world and those who dwell in it
  simplified_phrase: the world and all who live in it
  preserved_meaning: Yahweh’s ownership includes every person living in the world.
  reasoning_layer_used: lexical decision for תֵּבֵל and וְיֹשְׁבֵי בָהּ
  rationale: “Live” is more common than “dwell” while preserving the inhabited-world sense.
- pob_phrase: A psalm of David
  simplified_phrase: A psalm of David
  preserved_meaning: The heading associates the psalm with David without specifying how.
  reasoning_layer_used: lexical decision for לְדָוִד
  rationale: The wording remains because it preserves the Hebrew heading’s ambiguity.
