translation:
  language: en
  text: The person with clean hands and a pure heart, who has not turned his soul toward falsehood or made a deceitful oath.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew reads “my soul”; “his soul” follows the surrounding third-person description.
    reason: textual_variant
  - marker: b
    text: “Falsehood” can also mean vanity, what is worthless, or possibly an idol.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The one who has clean hands and a pure heart
  simplified_phrase: The person with clean hands and a pure heart
  preserved_meaning: Clean hands picture right conduct, while a pure heart describes inward moral purity.
  reasoning_layer_used: POB lexical decisions for נְקִי כַפַּיִם and בַר לֵבָב
  rationale: The shorter wording keeps the concrete outward-and-inward parallel.
- pob_phrase: has not lifted up his soul to falsehood
  simplified_phrase: has not turned his soul toward falsehood
  preserved_meaning: The person does not direct his inner self toward what is false or worthless.
  reasoning_layer_used: POB lexical decisions for נָשָׂא ... נַפְשִׁי and לַשָּׁוְא
  rationale: “Turned” clarifies the directional idiom while retaining the soul image.
- pob_phrase: sworn deceitfully
  simplified_phrase: made a deceitful oath
  preserved_meaning: The person does not swear falsely, whether in manner or intent.
  reasoning_layer_used: POB lexical decision for נִשְׁבַּע לְמִרְמָה and grounding review
  rationale: This natural wording preserves both deceitful manner and deceitful intent.
