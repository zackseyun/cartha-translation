translation:
  language: en
  text: Yahweh, do not give the wicked what they desire. Do not let his scheme succeed,[a] so that they are not lifted high.[b] Selah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb is difficult; it may mean, “Do not bring his scheme to fulfillment.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says “they,” not “he.” “Lifted high” may refer to gaining status or success.
    reason: alternative_reading
