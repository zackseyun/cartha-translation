translation:
  language: en
  text: Yahweh, do not give a wicked person what he wants. Do not let his scheme succeed[a], so that they do not rise in triumph[b]. Selah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “do not bring his scheme to completion”; the Hebrew verb is difficult.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew shifts from one wicked person to a plural verb. The plural may refer to the wicked as a group or to others associated with him.
