translation:
  language: en
  text: Yahweh, keep me safe from the hands of the wicked.[a] Guard me from the violent man, who has planned to make my feet stumble.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “from the hand of the wicked man.” The Hebrew may refer to one person or to the wicked as a group.
    reason: lexical_alternative
  - marker: b
    text: Or “who have devised to overthrow my steps.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Keep me, O Yahweh
  simplified_phrase: Yahweh, keep me safe
  preserved_meaning: This remains a direct plea to Yahweh for protection.
  reasoning_layer_used: Lexical decision for שָׁמְרֵנִי and theological decision for יְהוָה
  rationale: Adding “safe” makes the protective sense of “keep” immediately clear.
- pob_phrase: who has planned to trip up my feet
  simplified_phrase: who has planned to make my feet stumble
  preserved_meaning: The enemy has formed an intent to cause the speaker to fall or fail.
  reasoning_layer_used: Lexical decisions for חָשְׁבוּ, לִדְחוֹת, and פְּעָמָי
  rationale: The wording uses ordinary English while preserving both completed planning and the image of stumbling feet.
translation_notes:
  risk_flags:
  - risk: “The wicked” may sound exclusively plural even though the Hebrew singular can be individual or collective.
    mitigation: Footnote a preserves both possible readings.
  - risk: “Make my feet stumble” may emphasize bodily stumbling more than the broader image of overthrowing one’s steps.
    mitigation: Footnote b preserves the broader alternative.
