simplification_decisions:
- pob_phrase: O Yahweh, my Lord
  simplified_phrase: Yahweh, my Lord
  preserved_meaning: The prayer directly addresses God by his covenant name and as the speaker’s Lord.
  reasoning_layer_used: theological decision and lexical rationale
  rationale: Removing “O” makes the address more natural in modern English without weakening it.
- pob_phrase: the strength of my salvation
  simplified_phrase: the strength that saves me
  preserved_meaning: Yahweh is the strength by which the speaker is saved or delivered.
  reasoning_layer_used: lexical decision for עֹז and יְשׁוּעָתִי
  rationale: The verbal wording makes the relationship between strength and salvation immediately clear.
- pob_phrase: in the day of battle
