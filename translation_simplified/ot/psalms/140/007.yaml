translation:
  language: en
  text: Yahweh, my Lord, you are the strength that saves me. You have covered my head in battle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can more literally read “in the time of arms” or “weaponry,” meaning a time of armed conflict.
