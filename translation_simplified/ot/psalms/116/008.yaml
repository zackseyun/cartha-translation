translation:
  language: en
  text: For you rescued my soul from death,[a] kept tears from my eyes, and kept my feet from stumbling.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “my life”; the Hebrew word can mean the soul, one’s life, or the whole self.
    reason: lexical_alternative
  - marker: b
    text: Or “my foot from falling”; the Hebrew can refer to stumbling or to a fall.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: have delivered my soul from death
  simplified_phrase: rescued my soul from death
  preserved_meaning: God saved the speaker’s soul or life from death.
  reasoning_layer_used: POB lexical and theological decisions for חִלַּצְתָּ and נַפְשִׁי
  rationale: “Rescued” is more familiar than “delivered” while retaining the full force of escape from danger.
- pob_phrase: my eyes from tears
  simplified_phrase: kept tears from my eyes
  preserved_meaning: God freed the speaker’s eyes from weeping.
  reasoning_layer_used: POB lexical decision for אֶת עֵינַי מִן דִּמְעָה
  rationale: Supplying “kept” makes the poetic ellipsis immediately clear while preserving the eyes-and-tears image.
- pob_phrase: my feet from stumbling
  simplified_phrase: kept my feet from stumbling
  preserved_meaning: God prevented the speaker from stumbling or falling.
  reasoning_layer_used: POB lexical decision for אֶת רַגְלִי מִדֶּחִי
  rationale: The repeated verb makes the rescue explicit without weakening the bodily image.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “soul” as only a disembodied inner part.
    mitigation: The footnote preserves the broader alternatives “my life” and “the whole self.”
