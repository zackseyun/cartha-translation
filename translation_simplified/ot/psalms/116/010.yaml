  language: en
  text: 'I believed,[a][b] so I spoke: “I am suffering greatly.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I believed, for I spoke”; the Hebrew connecting word can also mean “for” or “because.”
