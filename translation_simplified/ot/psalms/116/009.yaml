  text: I will walk in Yahweh’s presence in the world of the living.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I will live before Yahweh in the land of the living.” “Walk” may refer both to continued life and to how a person lives before God.
