- pob_phrase: walk before Yahweh
  simplified_phrase: walk in Yahweh’s presence
  preserved_meaning: The concrete walking image remains while “presence” clarifies the relational sense of “before.”
  reasoning_layer_used: Lexical and theological decisions for אֶתְהַלֵּךְ and לִפְנֵי
  rationale: This keeps both physical survival and a life lived before God possible.
- pob_phrase: in the lands of the living
