  preserved_meaning: Death is pictured as binding and surrounding the speaker.
  reasoning_layer_used: POB lexical decision for אֲפָפוּנִי
  rationale: The simpler phrase keeps the concrete image of being trapped.
- pob_phrase: the distresses of Sheol
  simplified_phrase: the pressures of Sheol
  preserved_meaning: Sheol brings oppressive, constricting distress.
  reasoning_layer_used: POB lexical decision for וּמְצָרֵי שְׁאוֹל
  rationale: “Pressures” makes the image of narrow confinement easier to grasp.
- pob_phrase: and ...; I found
  simplified_phrase: The pressures ... found me. I found
  preserved_meaning: The repeated verb links what found the speaker with what he found.
  reasoning_layer_used: POB lexical decisions for מְצָאוּנִי and אֶמְצָא
  rationale: Short sentences improve clarity while preserving the Hebrew wordplay.
