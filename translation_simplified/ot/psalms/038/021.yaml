  simplified_phrase: Do not be far from me.
  preserved_meaning: The plea for God’s nearness remains distinct from the plea against abandonment.
  reasoning_layer_used: Lexical decisions for תִּרְחַק and מִמֶּנִּי
  rationale: A separate sentence makes the second plea easier to follow without interpreting the distance more narrowly.
