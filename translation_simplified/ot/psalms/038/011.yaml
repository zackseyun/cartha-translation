  text: Those who love me and my friends keep their distance from me in my suffering. My close relatives stand far away.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word for “suffering” may refer to a blow, wound, plague, or other physical affliction.
    reason: lexical_alternative
  - marker: b
    text: Or “those close to me.”
    reason: lexical_alternative
