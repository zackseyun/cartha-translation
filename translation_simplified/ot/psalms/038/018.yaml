- pob_phrase: I confess my iniquity
  simplified_phrase: I confess that I have done wrong
  preserved_meaning: The speaker personally acknowledges morally serious wrongdoing.
  reasoning_layer_used: Lexical decision for עֲוֺנִי and theological decision on penitential confession
  rationale: The clause explains the less familiar word “iniquity” while retaining the important act of confession.
- pob_phrase: I am anxious because of my sin
  simplified_phrase: I am troubled because of my sin
  preserved_meaning: The speaker feels ongoing distress caused by his sin.
  reasoning_layer_used: Lexical decisions for אֶדְאַג and מֵחַטָּאתִי
  rationale: “Troubled” expresses the Hebrew distress naturally without suggesting a modern clinical diagnosis.
