translation:
  language: en
  text: Nothing in my body is healthy because of your anger[a]; there is no well-being in my bones because of my sin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “indignation” or “wrath.”
    reason: lexical_alternative
  - marker: b
    text: The verse states these causes without explaining how the psalmist’s sin, God’s anger, and his suffering are related.
    reason: simplification_note
simplification_decisions:
- pob_phrase: There is no soundness in my flesh
  simplified_phrase: Nothing in my body is healthy
  preserved_meaning: The psalmist’s whole body lacks a sound condition.
  reasoning_layer_used: Lexical decisions for מְתֹם and בִּבְשָׂרִי
  rationale: The natural body-and-health wording makes the bodily suffering immediately clear.
- pob_phrase: your indignation
  simplified_phrase: your anger
  preserved_meaning: God’s strong displeasure remains the stated cause of the suffering.
  reasoning_layer_used: Lexical decision for זַעְמֶךָ
  rationale: Anger is the clearest documented alternative, while the note preserves the stronger renderings.
- pob_phrase: there is no peace in my bones
  simplified_phrase: there is no well-being in my bones
  preserved_meaning: The psalmist has no bodily or inner well-being, even at the depth pictured by his bones.
  reasoning_layer_used: Lexical decisions for שָׁלוֹם and בַּעֲצָמַי
  rationale: Well-being prevents a conflict-related reading of peace while retaining the Hebrew bones image.
translation_notes:
  risk_flags:
  - risk: Using “body” is less concrete than the Hebrew image of flesh.
    mitigation: The bodily focus remains explicit, and the parallel image of bones is retained.
  - risk: Readers could infer a general doctrine that personal sin causes all suffering.
    mitigation: The note limits the statement to the verse’s claims and leaves their mechanism unexplained.
