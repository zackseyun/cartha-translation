  preserved_meaning: The violent devastation and difficult garden comparison remain intact.
  reasoning_layer_used: Lexical decisions for וַיַּחְמֹס, כַּגַּן, and שֻׂכּוֹ
  rationale: “Ravaged” states the violence directly while the footnote preserves uncertainty about the shelter.
- pob_phrase: has caused appointed feast and Sabbath to be forgotten in Zion
  simplified_phrase: has made Zion forget its appointed feasts and Sabbaths
  preserved_meaning: Yahweh caused Zion’s set worship times to pass out of observance and memory.
  reasoning_layer_used: Lexical decisions for שִׁכַּח and מוֹעֵד
  rationale: The active English construction is easier to follow and keeps the causative force.
- pob_phrase: in the indignation of his anger he has spurned king and priest
  simplified_phrase: In his fierce anger, he has rejected king and priest with contempt
  preserved_meaning: Yahweh angrily rejected both royal and priestly institutions with disdain.
  reasoning_layer_used: Lexical decisions for בְּזַעַם אַפּוֹ, וַיִּנְאַץ, and מֶלֶךְ וְכֹהֵן
  rationale: Common wording retains both the intensity of the anger and the contempt in the rejection.
