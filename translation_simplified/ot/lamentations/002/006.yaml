translation:
  language: en
  text: He has ravaged his shelter like a garden.[a] He has destroyed his appointed meeting place.[b] Yahweh has made Zion forget its appointed feasts and Sabbaths.[c] In his fierce anger, he has rejected king and priest with contempt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “his booth” or “his tabernacle”; the exact image is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or “his appointed place of assembly,” and possibly “his tent of meeting.”
    reason: lexical_alternative
  - marker: c
    text: The Hebrew may also mean “appointed times” or “festivals.”
    reason: lexical_alternative
