  text: My eyes are worn out from crying. My insides churn. My liver is poured out on the ground.[a] This is because my people—pictured as a daughter—have been devastated,[b] and because infants and nursing children faint in the city streets.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This bodily image expresses overwhelming grief and collapse.
    reason: cultural_note
  - marker: b
    text: Hebrew literally says “the daughter of my people,” a poetic way of portraying the people or city.
    reason: simplification_note
