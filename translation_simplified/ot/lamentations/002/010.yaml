  text: The elders of daughter Zion[a] sit silently on the ground. They have thrown dust on their heads and put on sackcloth[b] as signs of grief. Jerusalem’s virgins[c] have bowed their heads to the ground.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Daughter Zion” is a poetic name that presents Zion, or Jerusalem, as a woman.
    reason: cultural_note
