translation:
  language: en
  text: Her city gates have sunk into the earth. He has destroyed and smashed the bars that held them shut. Her king and princes are among the nations. There is no law.[a] Even her prophets have received no vision from Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “there is no instruction.” The Hebrew word can mean law, instruction, or teaching.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Her gates have sunk into the earth
  simplified_phrase: Her city gates have sunk into the earth
  preserved_meaning: The city's gates are pictured as collapsing into the ground.
  reasoning_layer_used: Lexical rationale for שְׁעָרֶיהָ and טָבְעוּ
  rationale: Adding “city” immediately identifies what kind of gates the image describes.
- pob_phrase: he has destroyed and broken her bars
  simplified_phrase: He has destroyed and smashed the bars that held them shut
  preserved_meaning: The gate-bars securing the city have been violently ruined.
  reasoning_layer_used: Lexical rationale for אִבַּד, שִׁבַּר, and בְּרִיחֶיהָ
  rationale: “Smashed” keeps the force of the image, while the added clause explains the bars' function.
- pob_phrase: have found no vision from Yahweh
  simplified_phrase: have received no vision from Yahweh
  preserved_meaning: Yahweh has given the prophets no prophetic revelation.
  reasoning_layer_used: Lexical rationale for חָזוֹן and מֵיְהוָה
  rationale: “Received” makes the source of a prophetic vision clearer in ordinary English.
interpretive_expansions:
- pob_phrase: her bars
  rendering: the bars that held them shut
  claim: The bars were devices that secured the city gates.
  evidence:
  - The lexical record identifies בְּרִיחֶיהָ as the bars or bolts securing the gates.
  confidence: high
  alternatives_preserved:
  - gate-bars
  - bolts
translation_notes:
  risk_flags:
  - risk: The pronoun “he” does not explicitly identify the destroyer.
    mitigation: It is retained because POB deliberately leaves the Hebrew subject implicit while context points to Yahweh.
  - risk: “Law” may sound narrower than the full range of torah.
    mitigation: The footnote preserves “instruction” and explains the broader lexical range.
