translation:
  language: en
  text: The Lord has swallowed up all Jacob’s pastures[a] without pity. In his wrath, he has torn down daughter Judah’s[b] strongholds and leveled them to the ground. He has defiled the kingdom and its princes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean Jacob’s dwellings or settled places.
    reason: lexical_alternative
  - marker: b
    text: “Daughter Judah” is a poetic name that pictures Judah as a woman.
    reason: cultural_note
