translation:
  language: en
  text: Yahweh decided to destroy daughter Zion’s wall.[a] He stretched out a measuring line to mark it for destruction. He did not hold back his hand from swallowing it up. He made the outer defenses and the wall mourn; together they waste away.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Daughter Zion” is a poetic way of personifying Zion, or Jerusalem, as a daughter.
    reason: simplification_note
