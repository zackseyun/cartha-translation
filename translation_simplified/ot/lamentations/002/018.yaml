translation:
  language: en
  text: Their hearts[a] cried out together to the Lord. Wall of Daughter Zion, let your tears flow like a stream[b] day and night. Give yourself no relief; do not let your eyes rest from weeping.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew has the singular “their heart,” presenting them as one grieving people.
    reason: source_note
  - marker: b
    text: The Hebrew word may also describe a seasonal torrent or its valley.
    reason: lexical_alternative
