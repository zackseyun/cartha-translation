translation:
  language: en
  text: The Lord became like an enemy. He swallowed up Israel; he swallowed up all her palaces and destroyed his strongholds.[a] He brought Daughter Judah more and more mourning and sorrow.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “his strongholds”; some translations use “her strongholds” to match “her palaces.”
    reason: textual_variant
  - marker: b
    text: “Daughter Judah” is a poetic way of picturing Judah and her people as a woman.
    reason: cultural_note
simplification_decisions:
- pob_phrase: he multiplied mourning and lamentation
  simplified_phrase: He brought ... more and more mourning and sorrow
  preserved_meaning: The Lord caused Judah’s grief to increase greatly.
  reasoning_layer_used: Lexical decision for וַיֶּרֶב and the paired grief nouns
  rationale: The new wording makes the causative sense clear without the formal word “lamentation.”
- pob_phrase: in Daughter Judah
  simplified_phrase: Daughter Judah ... [with explanatory footnote]
  preserved_meaning: Judah remains poetically personified as a daughter.
  reasoning_layer_used: Lexical decision for בְּבַת יְהוּדָה
  rationale: The image stays in the text while the note explains it to new readers.
- pob_phrase: He swallowed up all her palaces; he destroyed his strongholds
  simplified_phrase: he swallowed up all her palaces and destroyed his strongholds
  preserved_meaning: The swallowing image and the distinct destruction of fortified places both remain.
  reasoning_layer_used: Lexical decisions for בִּלַּע, אַרְמְנוֹתֶיהָ, and מִבְצָרָיו
  rationale: Joining the clauses improves flow without merging their separate images.
translation_notes:
  risk_flags:
  - risk: The shift from “her palaces” to “his strongholds” may sound inconsistent.
    mitigation: The main text preserves the Masoretic suffix, and the footnote identifies the alternative.
  - risk: “Sorrow” is broader than the formal term “lamentation.”
    mitigation: Its pairing with “mourning” preserves the verse’s doubled expression of grief.
