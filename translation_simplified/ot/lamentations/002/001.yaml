translation:
  language: en
  text: How the Lord has brought a cloud over Daughter Zion in his anger! He has thrown Israel’s beauty down from heaven to earth.[a] On the day of his anger, he did not remember his footstool.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Beauty” may also be translated “glory” or “splendor.”
    reason: lexical_alternative
  - marker: b
    text: God’s “footstool” may refer to Zion, the temple, or the ark as the place connected with his presence on earth.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: has clouded over daughter Zion
  simplified_phrase: has brought a cloud over Daughter Zion
  preserved_meaning: The Lord obscures personified Zion with a cloud in his anger.
  reasoning_layer_used: Lexical decision for יָעִיב and בַּת צִיּוֹן
  rationale: The rewrite makes the action easier to picture while preserving the cloud image and Zion’s personification.
- pob_phrase: has cast from heaven to earth the beauty of Israel
  simplified_phrase: has thrown Israel’s beauty down from heaven to earth
  preserved_meaning: The Lord forcefully brings Israel’s honored beauty from exaltation to humiliation.
  reasoning_layer_used: Lexical decisions for הִשְׁלִיךְ, מִשָּׁמַיִם אֶרֶץ, and תִּפְאֶרֶת יִשְׂרָאֵל
  rationale: Ordinary word order and “thrown down” clarify the violent descent without identifying what Israel’s beauty represents.
- pob_phrase: and he did not remember his footstool in the day of his anger
  simplified_phrase: On the day of his anger, he did not remember his footstool
  preserved_meaning: In judgment, the Lord did not call his footstool to mind.
  reasoning_layer_used: Lexical and theological decisions for זכר and הֲדֹם רַגְלָיו
  rationale: Moving the time phrase forward improves flow while retaining “remember” and the unresolved footstool image.
translation_notes:
  risk_flags:
  - risk: Modern readers may not know who or what Daughter Zion represents.
    mitigation: Capitalization signals poetic personification without reducing Zion to only the city or only its people.
  - risk: “Footstool” has several possible sacred referents.
    mitigation: The main text preserves the metaphor, and the footnote lists the recognized possibilities.
