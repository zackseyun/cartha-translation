translation:
  language: en
  text: The visions your prophets saw for you were false and foolish. They did not expose your sin so that your fortunes could be restored.[a] Instead, they gave you false prophetic messages[b] and visions that led you astray.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “so that your captivity could be ended” or “so that your captives could be restored.” The Hebrew expression can refer more broadly to recovery from disaster or exile.
    reason: alternative_reading
  - marker: b
    text: Traditionally, “burdens,” a prophetic term for messages or pronouncements.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: saw for you falsehood and folly
  simplified_phrase: The visions your prophets saw for you were false and foolish
  preserved_meaning: The prophets’ supposed visionary content was both untrue and foolish.
  reasoning_layer_used: Lexical decisions for חָזוּ, שָׁוְא, and תָפֵל
  rationale: The rewrite keeps the prophetic seeing image while making the sentence immediately understandable.
- pob_phrase: did not uncover your iniquity
  simplified_phrase: did not expose your sin
  preserved_meaning: The prophets failed to lay Jerusalem’s wrongdoing bare.
  reasoning_layer_used: Lexical decision for גִלּוּ עַל עֲוֺנֵךְ
  rationale: “Expose your sin” expresses the concrete metaphor and moral force in common English.
- pob_phrase: false oracles and delusions
  simplified_phrase: false prophetic messages and visions that led you astray
  preserved_meaning: Their pronouncements were false and their visions misled Jerusalem.
  reasoning_layer_used: Lexical decisions for מַשְׂאוֹת, שָׁוְא, and מַדּוּחִים
  rationale: The rendering explains “oracles” and recovers the source term’s sense of leading astray.
