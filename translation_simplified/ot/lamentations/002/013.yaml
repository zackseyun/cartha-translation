translation:
  language: en
  text: What can I testify about you?[a] What can I compare you to, daughter Jerusalem? What can I liken you to so that I can comfort you, virgin daughter Zion?[c] Your fracture is as vast as the sea.[b] Who can heal you?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is difficult. It may also mean, “What can I say about you?”
    reason: lexical_alternative
  - marker: b
    text: The word translated “fracture” can also mean wound, ruin, or brokenness.
    reason: lexical_alternative
  - marker: c
    text: “Daughter Jerusalem” and “virgin daughter Zion” personify Jerusalem as a young woman.
    reason: cultural_note
simplification_decisions:
- pob_phrase: What can I testify for you?
  simplified_phrase: What can I testify about you?
  preserved_meaning: The speaker asks what testimony he can give concerning Jerusalem.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: This keeps the witness sense without implying that the speaker is Jerusalem’s legal advocate.
- pob_phrase: so that I may comfort you
  simplified_phrase: so that I can comfort you
  preserved_meaning: Finding a fitting comparison might enable the speaker to comfort Jerusalem.
  reasoning_layer_used: POB lexical decision for וַאֲנַחֲמֵךְ
  rationale: The purpose clause is expressed in ordinary modern English.
- pob_phrase: your fracture is as great as the sea
  simplified_phrase: Your fracture is as vast as the sea.
  preserved_meaning: Jerusalem’s devastation is pictured as an immense break that needs healing.
  reasoning_layer_used: POB lexical decisions for שִׁבְרֵךְ and גָדוֹל כַּיָּם
  rationale: “Vast” clarifies the sea’s scale while preserving the concrete fracture image.
