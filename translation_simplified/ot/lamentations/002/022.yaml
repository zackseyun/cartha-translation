  text: You summoned terrors against me from every side,[a] as if calling people to gather for an appointed festival. On the day of Yahweh’s anger, no one survived or was left. My enemy destroyed those I had cared for and raised.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
