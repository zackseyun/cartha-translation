translation:
  language: en
  text: They say to their mothers, “Where can we find grain and wine?” They faint in the city streets like wounded people,[a] while their lives are poured out in their mothers’ arms.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “like those who have been killed.” The Hebrew can describe people who are wounded, pierced, or slain.
    reason: lexical_alternative
  - marker: b
    text: Literally “into their mothers’ bosom,” an intimate picture of mothers holding their dying children.
    reason: simplification_note
