translation:
  language: en
  text: Everyone who passes by on the road claps their hands at you. They hiss[b] and shake their heads at Daughter Jerusalem.[a] They ask, “Is this the city people called perfect in beauty, the joy of the whole earth?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Daughter Jerusalem” is a poetic way of speaking of the city as a woman.
    reason: cultural_note
  - marker: b
    text: The word translated “hiss” may also mean “whistle”; here it describes a sharp sound of contempt.
    reason: lexical_alternative
