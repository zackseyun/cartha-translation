translation:
  language: en
  text: Our fathers sinned, and they are gone. But we bear the burden of their sins.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may mean their guilt, the punishment for their sins, or the consequences of what they did.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: they are no more
  simplified_phrase: they are gone
  preserved_meaning: The fathers are no longer present or alive.
  reasoning_layer_used: lexical decision for אֵינָם
  rationale: “They are gone” expresses the Hebrew idiom in familiar English.
- pob_phrase: we bear their iniquities
  simplified_phrase: we bear the burden of their sins
  preserved_meaning: The speakers carry the guilt, punishment, or consequences connected with their fathers’ wrongdoing.
  reasoning_layer_used: lexical and theological decisions for עֲוֺנֹתֵיהֶם and סָבָלְנוּ
  rationale: “Burden” keeps the carrying image while “sins” replaces the less familiar “iniquities.”
interpretive_expansions:
- pob_phrase: we bear their iniquities
  rendering: we bear the burden of their sins
  claim: What is borne is pictured as a burden arising from the fathers’ sins.
  evidence:
  - The verb סָבַל means to bear, carry, or endure a burden.
  - The noun עָוֹן can include wrongdoing, guilt, or its resulting consequences.
  confidence: high
  alternatives_preserved:
  - their guilt
  - the punishment for their sins
  - the consequences of what they did
