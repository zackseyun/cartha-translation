translation:
  language: en
  text: They wandered blindly through the streets. Blood had made them unclean,[b] so no one could touch their clothes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “They wandered like blind people through the streets, defiled with blood, so that they could not touch their clothes.” The Hebrew is compressed and does not explicitly identify who could not touch the clothes.
    reason: alternative_reading
  - marker: b
    text: “Unclean” here means defiled by blood, not merely physically stained.
    reason: lexical_alternative
