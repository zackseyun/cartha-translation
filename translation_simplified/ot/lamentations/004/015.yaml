  text: “Move aside! They are unclean!” people shouted at them. “Move aside! Move aside! Do not touch!” They had fled[a] and were even wandering from place to place. Among the nations, people said, “They will not stay any longer.”[b]
  philosophy: optimal-equivalence
  footnotes:
