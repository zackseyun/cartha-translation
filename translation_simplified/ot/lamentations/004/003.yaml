translation:
  language: en
  text: Even jackals let their young nurse at their breasts.[a] Yet the daughter of my people[b] has turned cruel, like ostriches in the wilderness.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “sea monsters” or “dragons,” but “jackals” best fits the nursing described here.
    reason: lexical_alternative
  - marker: b
    text: “The daughter of my people” poetically pictures the whole community as a daughter.
    reason: simplification_note
  - marker: c
    text: Or “owls”; “ostriches” is the traditional understanding and fits Job 39:13–17.
    reason: lexical_alternative
