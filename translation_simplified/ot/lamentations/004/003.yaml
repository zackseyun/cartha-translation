  reasoning_layer_used: POB lexical decisions for חָלְצוּ שַׁד and הֵינִיקוּ
  rationale: The recast removes repetition while keeping the concrete nursing image.
- pob_phrase: has become cruel
  simplified_phrase: has turned cruel
  preserved_meaning: The community has entered a cruel state rather than always having been cruel.
  reasoning_layer_used: POB lexical decision for לְאַכְזָר
  rationale: “Turned cruel” states the resulting change in more direct English.
- pob_phrase: The daughter of my people
  simplified_phrase: the daughter of my people
  preserved_meaning: The community remains personified as a daughter with its poetic force intact.
  reasoning_layer_used: POB lexical decision for בַּת עַמִּי
  rationale: The image is retained because replacing it with “my people” would erase the personification.
