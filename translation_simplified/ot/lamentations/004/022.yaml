translation:
  language: en
  text: Your punishment has come to an end, daughter Zion.[a] He will not send you into exile again. He has punished you for your wrongdoing, daughter Edom, and has brought your sins into the open.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “Your iniquity is finished” or “Your guilt has ended.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Your punishment is finished
  simplified_phrase: Your punishment has come to an end
  preserved_meaning: Zion’s penalty is now complete.
  reasoning_layer_used: Lexical decision for תַּם and contextual reading of עָוֹן
  rationale: The new wording states completion in more natural English without changing the chosen punishment sense.
- pob_phrase: he will not exile you again
  simplified_phrase: He will not send you into exile again
  preserved_meaning: Zion will not again be carried away from its land.
  reasoning_layer_used: Lexical decision for לֹא יוֹסִיף לְהַגְלוֹתֵךְ
  rationale: Adding “send you into” makes the unfamiliar verb “exile” immediately clear.
- pob_phrase: He has punished your iniquity ... he has uncovered your sins
  simplified_phrase: He has punished you for your wrongdoing ... and has brought your sins into the open
  preserved_meaning: Edom is judged for its wrongdoing, and its sins are exposed.
  reasoning_layer_used: Lexical decisions for פָּקַד, עֲוֺנֵךְ, and גִּלָּה
  rationale: The recasting clarifies who receives punishment while preserving the image of hidden sins being exposed.
interpretive_expansions:
- pob_phrase: He has punished your iniquity
  rendering: He has punished you for your wrongdoing
  claim: Edom receives punishment because of its culpable wrongdoing.
  evidence:
