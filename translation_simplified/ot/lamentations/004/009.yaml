  text: Those killed by the sword were better off than those killed by hunger. They waste away, pierced through because the fields yield no food.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean, “They pine away, pierced through, because there is no produce from the fields.”
