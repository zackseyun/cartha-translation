translation:
  language: en
  text: Her princes[a] were purer than snow and whiter than milk. Their bodies were redder than coral,[b] and their appearance was like sapphire.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “her Nazirites” or “her consecrated ones”; the Hebrew term may refer either to people set apart by a vow or to Jerusalem’s distinguished nobles.
    reason: alternative_reading
  - marker: b
    text: The Hebrew word translated “coral” is uncertain and may mean rubies, pearls, or another precious red substance.
    reason: lexical_alternative
  - marker: c
    text: The ancient stone called “sapphire” may have been lapis lazuli rather than the gemstone now known by that name.
    reason: cultural_note
