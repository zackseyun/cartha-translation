translation:
  language: en
  text: Those who once ate fine foods are now devastated in the streets. Those raised in luxury on scarlet cloth now embrace ash heaps.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “garbage heaps” or “dung heaps”; the Hebrew refers to discarded waste and emphasizes their deep humiliation.
    reason: lexical_alternative
