- pob_phrase: Those who used to eat delicacies
  simplified_phrase: Those who once ate fine foods
  preserved_meaning: They formerly enjoyed privileged, luxurious food.
  reasoning_layer_used: Lexical decisions for הָאֹכְלִים and לְמַעֲדַנִּים.
  rationale: “Fine foods” expresses their former luxury in immediately understandable language.
- pob_phrase: are desolate in the streets
  simplified_phrase: are now devastated in the streets
  preserved_meaning: Their former comfort has been replaced by ruin in public places.
  reasoning_layer_used: Lexical decisions for נָשַׁמּוּ and בַּחוּצוֹת, with the lament’s reversal context.
  rationale: “Devastated” clearly conveys ruin without adding an unsupported bodily posture.
- pob_phrase: those who were brought up on scarlet
  simplified_phrase: Those raised in luxury on scarlet cloth
  preserved_meaning: They grew up surrounded by costly scarlet material.
  reasoning_layer_used: Lexical decisions for הָאֱמֻנִים and עֲלֵי תוֹלָע.
  rationale: The wording explains the luxury image while preserving the concrete scarlet cloth.
