  rationale: This avoids the modern sense of becoming tired while preserving completeness.
- pob_phrase: He kindled a fire in Zion
  simplified_phrase: He started a fire in Zion
  preserved_meaning: Yahweh caused a destructive fire within Zion.
  reasoning_layer_used: lexical decisions for וַיַּצֶּת אֵשׁ and בְּצִיּוֹן
  rationale: The common verb keeps the source’s fire-in-the-city image clear.
- pob_phrase: and it consumed her foundations
  simplified_phrase: and the fire consumed her foundations
  preserved_meaning: The fire destroyed even Zion’s foundations while retaining her personification.
  reasoning_layer_used: lexical decisions for וַתֹּאכַל and יְסוֹדֹתֶיהָ
  rationale: Repeating “the fire” makes the pronoun’s reference immediately clear.
