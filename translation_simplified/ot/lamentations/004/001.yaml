  text: How the gold has lost its shine! How the fine gold has changed! The holy stones[a] have been spilled out at every street entrance.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Holy stones” may mean stones from the sanctuary, sacred gems, or, poetically, Jerusalem’s people.
    reason: lexical_alternative
  - marker: b
    text: Literally “at the head of every street”; this may refer to street entrances or corners.
    reason: cultural_note
