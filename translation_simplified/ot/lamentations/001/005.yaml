  rationale: The plain idiom states the controlling sense of the Hebrew head image.
- pob_phrase: Yahweh has afflicted her for the multitude of her transgressions
  simplified_phrase: Yahweh has brought suffering on her because of her many acts of rebellion
  preserved_meaning: Yahweh caused Jerusalem’s suffering because of her abundant covenant violations.
  reasoning_layer_used: Lexical and theological decisions for הוֹגָהּ and פְּשָׁעֶיהָ
