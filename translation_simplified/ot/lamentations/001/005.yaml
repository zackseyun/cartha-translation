translation:
  language: en
  text: Her foes are now in charge, and her enemies prosper.[a] Yahweh has brought suffering on her because of her many acts of rebellion. Her children[b] have gone away as captives before the foe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “live in ease and security.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew can mean “her little ones” or “her infants,” emphasizing their vulnerability.
    reason: lexical_alternative
