translation:
  language: en
  text: In her days of suffering and wandering[a], Jerusalem remembered all the precious things she had long ago. Her people fell into the enemy’s hands, and no one came to help her. Her enemies saw her and laughed at her ruin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “homelessness”; the Hebrew word is rare and its meaning is debated.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word may also be translated “downfall” or “desolation.”
    reason: lexical_alternative
