translation:
  language: en
  text: By his hand, he has bound and woven my transgressions into a yoke,[a] and it has come up on my neck. He has made my strength fail. The Lord has handed me over into the power of others, and I cannot rise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Hebrew verb translated “bound” may instead mean “watched over,” but “bound” best fits the image of a yoke being fastened.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The yoke of my transgressions is bound by his hand; they are woven together
  simplified_phrase: By his hand, he has bound and woven my transgressions into a yoke
  preserved_meaning: God forms the speaker’s transgressions into an oppressive yoke through binding and weaving.
  reasoning_layer_used: Lexical decisions for נִשְׂקַד, עֹל, בידו, and יִשְׂתָּרְגוּ, with the theological pronoun decision.
  rationale: The active wording clarifies the image without adding emphasis to God’s agency.
- pob_phrase: they have come up upon my neck
  simplified_phrase: and it has come up on my neck
  preserved_meaning: The yoke formed from the intertwined transgressions rises onto the speaker’s neck as a burden.
  reasoning_layer_used: Lexical decision for עָלוּ עַל צַוָּארִי and its identified yoke imagery.
  rationale: The singular reference makes the image easy to follow while preserving its movement onto the neck.
- pob_phrase: The Lord has given me into hands from which I cannot rise
  simplified_phrase: The Lord has handed me over into the power of others, and I cannot rise
  preserved_meaning: The Lord gives the speaker to unnamed oppressors whose domination she cannot overcome.
  reasoning_layer_used: Lexical decisions for בידי and לֹא אוּכַל קוּם.
  rationale: The wording explains the hand idiom while leaving the oppressors indefinite.
