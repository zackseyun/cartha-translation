translation:
  language: en
  text: Jerusalem has sinned terribly, so she has become unclean[a] and is shunned. Everyone who once honored her now despises her because they have seen her nakedness. Jerusalem herself groans and turns away.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean that she has become like a menstruating woman or like something impure, with the sense of uncleanness and separation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: has sinned grievously
  simplified_phrase: has sinned terribly
  preserved_meaning: Jerusalem's sin is strongly emphasized and severe.
  reasoning_layer_used: lexical decision for חֵטְא חָטְאָה
  rationale: The common adverb “terribly” clearly carries the Hebrew intensification.
- pob_phrase: All who honored her despise her
  simplified_phrase: Everyone who once honored her now despises her
  preserved_meaning: Former respect has been reversed into present contempt.
  reasoning_layer_used: lexical decisions for מְכַבְּדֶיהָ and הִזִּילוּהָ
  rationale: “Once” and “now” make the contrast explicit without changing its substance.
- pob_phrase: She herself also groans and turns backward
  simplified_phrase: Jerusalem herself groans and turns away
  preserved_meaning: Jerusalem responds to her humiliation with audible grief and withdrawal.
  reasoning_layer_used: lexical decisions for נֶאֶנְחָה and וַתָּשָׁב אָחוֹר
  rationale: Naming Jerusalem removes an unclear pronoun, while “turns away” follows the adjudicated idiomatic choice.
