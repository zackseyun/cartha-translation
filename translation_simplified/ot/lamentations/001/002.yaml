translation:
  language: en
  text: She weeps bitterly at night, with tears on her cheeks. Among all her lovers[a], no one comforts her. All her companions[b] have betrayed her. They have become her enemies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lovers” may also refer to the city’s political allies, while preserving the poem’s picture of Jerusalem as a woman.
    reason: lexical_alternative
  - marker: b
    text: Or “friends” or “allies.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: She weeps bitterly in the night, with her tears on her cheeks
  simplified_phrase: She weeps bitterly at night, with tears on her cheeks.
  preserved_meaning: Her intense nighttime grief and the physical image of tears remain clear.
  reasoning_layer_used: Lexical decisions for בָּכוֹ תִבְכֶּה, בַּלַּיְלָה, and וְדִמְעָתָהּ עַל לֶחֱיָהּ.
  rationale: “At night” gives the temporal setting without implying that she weeps all night.
- pob_phrase: among all her lovers she has no comforter
  simplified_phrase: Among all her lovers, no one comforts her.
  preserved_meaning: None of her lovers gives comfort, and the relational metaphor remains intact.
  reasoning_layer_used: Lexical and theological decisions for אֵין לָהּ מְנַחֵם and מִכָּל אֹהֲבֶיהָ.
  rationale: The verbal wording makes “comforter” immediately understandable while retaining “lovers.”
- pob_phrase: All her companions have dealt treacherously with her; they have become her enemies.
  simplified_phrase: All her companions have betrayed her. They have become her enemies.
  preserved_meaning: Her companions acted faithlessly and then became her enemies.
  reasoning_layer_used: Lexical decisions for בָּגְדוּ בָהּ and הָיוּ לָהּ לְאֹיְבִים.
  rationale: Two short sentences preserve the poem’s progression in common English.
translation_notes:
  risk_flags:
  - risk: “Betrayed” may carry less covenantal nuance than “dealt treacherously.”
    mitigation: The relationship terms and separate statement that they became enemies preserve the force of faithlessness.
