translation:
  language: en
  text: 'Zion has reached out her hands, but no one is there to comfort her. Yahweh has given a command concerning Jacob: his enemies are to surround him. Jerusalem has become something unclean among them.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew more specifically evokes menstrual impurity and the resulting ritual uncleanness.
