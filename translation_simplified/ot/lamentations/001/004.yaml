translation:
  language: en
  text: Zion’s roads mourn because no one comes for the appointed feast.[a] All her gates lie desolate. Her priests groan, her virgins[b] grieve, and Zion herself suffers bitterly.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “the appointed festival” or “the appointed time.”
    reason: lexical_alternative
  - marker: b
    text: Or “her maidens.”
    reason: lexical_alternative
