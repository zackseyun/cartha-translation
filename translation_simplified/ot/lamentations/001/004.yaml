  simplified_phrase: because no one comes for the appointed feast
  preserved_meaning: The roads are mourning because worshipers no longer come for Zion’s pilgrimage festival.
  reasoning_layer_used: Lexical decision for מִבְּלִי בָּאֵי מוֹעֵד
  rationale: “Comes for” states the purpose naturally while retaining the chosen festal sense.
- pob_phrase: all her gates are desolate
  simplified_phrase: All her gates lie desolate.
  preserved_meaning: Zion’s gates are empty and devastated.
  reasoning_layer_used: Lexical decision for שֹׁמֵמִין
  rationale: A new sentence makes the poetic scene easier to follow without weakening “desolate.”
- pob_phrase: and she herself is bitter
  simplified_phrase: and Zion herself suffers bitterly
  preserved_meaning: Personified Zion is enduring bitter distress.
  reasoning_layer_used: Lexical decision for מַר לָהּ and theological decision on personification
  rationale: Naming Zion clarifies the pronoun while preserving the emphatic feminine personification.
