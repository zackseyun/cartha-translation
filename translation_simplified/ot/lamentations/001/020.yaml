translation:
  language: en
  text: Look, Yahweh, for I am in distress. My insides are churning, and my heart is turned upside down within me, because I have been very rebellious. Outside, the sword causes bereavement; inside the house, it is like death.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “inside the house, there is death.” The Hebrew is brief and can be understood either way.
    reason: alternative_reading
