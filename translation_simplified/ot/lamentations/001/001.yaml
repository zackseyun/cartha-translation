translation:
  language: en
  text: How she sits alone now—the city that was once full of people! She is now like a widow. Once great among the nations, a princess among the provinces, she has now been made to do forced labor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “she must now pay tribute.” The Hebrew can refer to either forced labor or tribute imposed by a conqueror.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: How she sits alone, the city once full of people!
  simplified_phrase: How she sits alone now—the city that was once full of people!
  preserved_meaning: The opening remains a cry of lament over the city’s present isolation and former population.
  reasoning_layer_used: Lexical decisions for אֵיכָה, יָשְׁבָה, בָדָד, and רַבָּתִי עָם
  rationale: Adding “now” makes the contrast in time immediately clear without changing the lament image.
- pob_phrase: She has become like a widow
  simplified_phrase: She is now like a widow.
  preserved_meaning: The city is compared to a bereaved and abandoned widow rather than identified as one.
  reasoning_layer_used: Lexical decision for כְּאַלְמָנָה
  rationale: A short sentence makes the simile easier to grasp while preserving its comparative force.
- pob_phrase: she has become subject to forced labor
  simplified_phrase: she has now been made to do forced labor
  preserved_meaning: The formerly honored city has been coercively reduced to laboring under a conqueror.
  reasoning_layer_used: Lexical decision for מַס and the POB reversal from princess to subjugation
  rationale: The active idea of being compelled to work is clearer than the abstract phrase “subject to.”
translation_notes:
  risk_flags:
  - risk: The Hebrew מַס may refer to imposed tribute rather than compulsory labor.
    mitigation: The main text follows the POB labor sense, while the footnote preserves the lexical alternative.
