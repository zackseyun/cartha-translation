translation:
  language: en
  text: I weep over these things. My eye, my eye, streams with water, because the one who comforts me and restores my life[a] is far away. My children are devastated, because the enemy has proved stronger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “restores my self” or “restores my soul.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For these things I am weeping
  simplified_phrase: I weep over these things
  preserved_meaning: These events are the object and cause of Zion’s continuing lament.
  reasoning_layer_used: Lexical decision for עַל אֵלֶּה and בוֹכִיָּה
  rationale: The ordinary word order is clearer while keeping the ongoing lament.
- pob_phrase: my eye, my eye runs down with water
  simplified_phrase: My eye, my eye, streams with water
  preserved_meaning: The repeated singular and vivid water image intensify the weeping.
  reasoning_layer_used: Lexical decisions for עֵינִי עֵינִי and יֹרְדָה מַיִם
  rationale: “Streams” makes the motion natural without replacing “water” with the interpretive word “tears.”
- pob_phrase: My children have become desolate, because the enemy has prevailed
  simplified_phrase: My children are devastated, because the enemy has proved stronger
  preserved_meaning: Zion’s people are ruined because the enemy has gained dominance.
  reasoning_layer_used: Lexical decisions for בָנַי, שֹׁמֵמִים, and גָבַר אוֹיֵב
  rationale: Common wording communicates both the resulting devastation and the enemy’s superior strength.
translation_notes:
  risk_flags:
  - risk: The repeated singular “my eye, my eye” may sound unusual in modern English.
    mitigation: It is retained because the Hebrew repetition carries deliberate poetic intensity.
  - risk: “Restores my life” may be heard as rescue from death alone.
    mitigation: The footnote preserves the broader Hebrew senses of self and soul.
