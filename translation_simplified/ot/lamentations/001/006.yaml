translation:
  language: en
  text: All the splendor of daughter Zion is gone.[a] Her princes are like deer that could not find pasture. With no strength left, they went ahead of the one pursuing them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Daughter Zion” pictures the city of Jerusalem as a woman.
    reason: cultural_note
simplification_decisions:
- pob_phrase: From daughter Zion all her splendor has departed
  simplified_phrase: All the splendor of daughter Zion is gone
  preserved_meaning: Zion has lost all her former dignity and visible beauty.
  reasoning_layer_used: Lexical decisions for וַיֵּצֵא and כָּל הֲדָרָהּ
  rationale: The reordered clause and common phrase “is gone” express the same complete loss naturally.
- pob_phrase: like deer that find no pasture
  simplified_phrase: like deer that could not find pasture
  preserved_meaning: The princes are compared to deer that failed to find food and relief.
  reasoning_layer_used: Source phrase לֹא מָצְאוּ מִרְעֶה and its lexical decision
  rationale: “Could not find” keeps the pasture image clear while restoring the past-oriented failure.
- pob_phrase: they went without strength before the pursuer
  simplified_phrase: With no strength left, they went ahead of the one pursuing them
  preserved_meaning: The exhausted princes moved ahead while a pursuer followed them.
  reasoning_layer_used: Lexical decisions for וַיֵּלְכוּ, בְּלֹא כֹחַ, and לִפְנֵי רוֹדֵף
  rationale: The recast sentence clarifies the pursuit without adding a continuing or fleeing sense.
interpretive_expansions:
- pob_phrase: before the pursuer
  rendering: ahead of the one pursuing them
  claim: The pursuer advances behind them as they move ahead.
  evidence:
  - The POB rationale says the phrase conveys being driven ahead by an enemy in pursuit.
  confidence: high
  alternatives_preserved:
  - before the pursuer
translation_notes:
  risk_flags:
  - risk: “Ahead of” could sound merely positional.
    mitigation: “The one pursuing them” makes the threatening pursuit explicit.
