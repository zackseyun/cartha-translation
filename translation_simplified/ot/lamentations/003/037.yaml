translation:
  language: en
  text: Who can say that something will happen—and then it happens—unless the Lord has commanded it?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “ordained it” or “decreed it”; the Hebrew more literally says “commanded it.”
    reason: lexical_alternative
  - marker: b
    text: Or “Who said it, and it came to pass?”; the Hebrew uses past forms to express this general truth.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Who is this who speaks and it happens
  simplified_phrase: Who can say that something will happen—and then it happens
  preserved_meaning: A person speaks of an event, and that event then occurs.
  reasoning_layer_used: POB lexical decisions for מִי זֶה, אָמַר, and וַתֶּהִי
  rationale: Naming “something” as the implied event clarifies the sequence without making the speaker cause it.
- pob_phrase: unless the Lord has commanded it
  simplified_phrase: unless the Lord has commanded it
  preserved_meaning: The event occurs only under the Lord’s directive will.
  reasoning_layer_used: POB theological decision on divine sovereignty language
  rationale: Keeping “commanded” avoids strengthening the Hebrew to “ordained” or “decreed.”
