translation:
  language: en
  text: For if he causes grief,[a] he will also show compassion, in keeping with his abundant steadfast love.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be translated, “Though he causes grief, he will still show compassion.”
    reason: alternative_reading
  - marker: b
    text: “Steadfast love” can also mean loyal covenant love, lovingkindness, or mercy.
    reason: lexical_alternative
