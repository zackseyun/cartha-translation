  preserved_meaning: God gives them a negative inner condition of moral and spiritual hardness.
  reasoning_layer_used: Lexical decision for מְגִנַּת לֵב and its contextual parallel with the curse.
  rationale: The verbal wording expresses the same idea in direct, natural English.
- pob_phrase: your curse will be upon them
  simplified_phrase: your curse will fall on them
  preserved_meaning: God’s curse is directed against them as judgment.
  reasoning_layer_used: Lexical decision for תַּאֲלָתְךָ and repeated לָהֶם.
  rationale: “Fall on them” makes the directed judgment clear without weakening “curse.”
