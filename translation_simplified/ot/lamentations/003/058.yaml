simplification_decisions:
- pob_phrase: You have defended the cause of my soul
  simplified_phrase: you defended my case
  preserved_meaning: The Lord acted as the speaker’s defender in a legal case.
  reasoning_layer_used: Lexical decisions for רַבְתָּ, רִיבֵי, and נַפְשִׁי, with the theological decision to preserve the legal image.
  rationale: “Defended my case” clearly expresses legal advocacy without suggesting protection of an immaterial soul.
- pob_phrase: O Lord
  simplified_phrase: Lord
  preserved_meaning: The speaker directly addresses the divine title Lord.
  reasoning_layer_used: Lexical decision for אֲדֹנָי and the revision note on direct address.
  rationale: Modern English clearly marks direct address without the formal vocative “O.”
- pob_phrase: you have redeemed my life
  simplified_phrase: you redeemed my life
  preserved_meaning: The Lord reclaimed or delivered the speaker’s life as redeemer.
  reasoning_layer_used: Lexical decision for גָּאַלְתָּ and the theological decision to retain redemption imagery.
  rationale: Keeping “redeemed” preserves the distinct biblical image alongside the legal image.
