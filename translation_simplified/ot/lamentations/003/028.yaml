translation:
  language: en
  text: Let him sit alone and remain silent, because he has laid a burden on him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew does not name who lays the burden or state exactly what is laid. It may also be understood as, “because he has borne it upon him.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: sit alone and be silent
  simplified_phrase: sit alone and remain silent
  preserved_meaning: He is urged to continue in silence while alone under affliction.
  reasoning_layer_used: POB lexical decisions for בָּדָד and וְיִדֹּם
  rationale: “Remain silent” expresses the continuing response in natural English.
- pob_phrase: for he has laid it on him
  simplified_phrase: because he has laid a burden on him
  preserved_meaning: An unnamed actor imposed the affliction, which gives the reason for sitting silently.
  reasoning_layer_used: POB lexical decision for נָטַל and theological decision on the implicit subject and object
  rationale: The active wording preserves the unnamed actor while “a burden” clarifies the idiom.
interpretive_expansions:
- pob_phrase: it
  rendering: a burden
  claim: The unstated object is understood as an imposed burden or affliction.
  evidence:
  - The POB lexical rationale says נָטַל with עַל conveys laying a burden on someone.
  - The preceding context refers to bearing a yoke.
  confidence: moderate
  alternatives_preserved:
