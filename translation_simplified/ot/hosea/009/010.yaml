translation:
  language: en
  text: I found Israel like grapes in the wilderness. I saw your fathers[a] like the first ripe fig of the season on a fig tree.[b] But they came to Baal-peor and devoted themselves to shame.[c] They became detestable, like the thing they loved.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, your forefathers—your ancestors.
    reason: lexical_alternative
  - marker: b
    text: The season’s first ripe fig was especially prized.
    reason: cultural_note
  - marker: c
    text: “Shame” likely refers contemptuously to the idol associated with Baal-peor; compare Numbers 25:1–5.
    reason: alternative_reading
