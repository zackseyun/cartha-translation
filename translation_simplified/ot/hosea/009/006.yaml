translation:
  language: en
  text: Look! They have fled from destruction, but Egypt will gather them, and Memphis will bury them. Nettles[a] will take over their precious silver treasures, and thorns will be in their tents.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew plant name is uncertain; it may mean nettles or another kind of invasive weed.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For behold, they have gone away from destruction
  simplified_phrase: Look! They have fled from destruction
  preserved_meaning: They leave in flight from devastation rather than escaping judgment safely.
  reasoning_layer_used: Theological decision on the opening clause
  rationale: “Fled” expresses their movement in ordinary English, while the next lines show that they do not escape safely.
- pob_phrase: Nettles will possess the precious things of their silver
  simplified_phrase: Nettles will take over their precious silver treasures
  preserved_meaning: Invasive growth will claim their valuable silver possessions.
  reasoning_layer_used: Lexical decisions for מַחְמַד לְכַסְפָּם and יִירָשֵׁם
  rationale: “Take over” and “silver treasures” make the ironic possession image immediately clear.
- pob_phrase: thorns will be in their tents
  simplified_phrase: thorns will be in their tents
  preserved_meaning: Thorns will occupy their tents as an image of desolation.
  reasoning_layer_used: Lexical decisions for חוֹחַ and בְּאָהֳלֵיהֶם
  rationale: The direct wording preserves the tent image without overstating the extent of the growth.
interpretive_expansions:
- pob_phrase: Egypt will gather them
  rendering: but Egypt will gather them
  claim: Egypt’s gathering contrasts with their flight and shows that it does not bring safety.
  evidence:
