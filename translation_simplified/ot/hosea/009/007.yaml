- pob_phrase: the man of the spirit
  rendering: the person with spiritual inspiration
  claim: The phrase concerns a person associated with spiritual inspiration.
  evidence:
  - The lexical rationale links the expression with spiritual inspiration.
  - Its parallel with “the prophet” points to a prophetic figure.
  confidence: moderate
  alternatives_preserved:
  - Someone merely claiming inspiration
  - A person genuinely inspired by God
  - The true prophet mocked by the people
translation_notes:
  risk_flags:
