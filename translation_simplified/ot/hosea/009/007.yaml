translation:
  language: en
  text: The days of punishment are here. The days of repayment are here. Israel will realize this. The prophet is a fool. The person with spiritual inspiration[a] is mad.[b] This is because your wickedness is so great and your hostility so intense.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “the man of the spirit”; this may mean someone claiming spiritual inspiration.
    reason: lexical_alternative
  - marker: b
    text: Some understand these words as the people's scornful description of the true prophet, but the Hebrew does not mark them as a quotation.
    reason: alternative_reading
  - marker: c
    text: The word may also mean “hatred” or “animosity”; the Hebrew does not say whom it is directed against.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The days of punishment have come; the days of repayment have come; Israel will know it.
  simplified_phrase: The days of punishment are here. The days of repayment are here. Israel will realize this.
  preserved_meaning: The time of judgment has arrived, and Israel will recognize it.
  reasoning_layer_used: Lexical decisions for פְּקֻדָּה, שִׁלֻּם, and יֵדְעוּ יִשְׂרָאֵל
  rationale: Short sentences make the announcement immediate without weakening its judicial force.
- pob_phrase: the man of the spirit
  simplified_phrase: the person with spiritual inspiration
  preserved_meaning: The phrase describes an inspired or purportedly inspired prophetic figure without specifying the Holy Spirit.
  reasoning_layer_used: Lexical and theological decisions for אִישׁ הָרוּחַ
  rationale: The wording clarifies the spiritual domain while the footnote preserves the disputed nature of the inspiration.
- pob_phrase: because of the greatness of your iniquity and your great hostility
  simplified_phrase: This is because your wickedness is so great and your hostility so intense.
  preserved_meaning: Israel's severe moral guilt and abundant hostility ground the denunciation and judgment.
  reasoning_layer_used: Lexical decisions for רֹב עֲוֺנְךָ, עַל, and מַשְׂטֵמָה
  rationale: Familiar wording conveys grave guilt while leaving the object of the hostility unstated.
