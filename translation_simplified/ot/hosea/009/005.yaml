  preserved_meaning: The occasion is a set time for a sacred communal gathering.
  reasoning_layer_used: Lexical decision for מוֹעֵד and its parallel with חַג
  rationale: The rewrite makes the event easier to picture while keeping its appointed and sacred character.
- pob_phrase: and on the day of the feast of Yahweh
  simplified_phrase: and when it is time for Yahweh’s feast
  preserved_meaning: The question also concerns the set day for celebrating Yahweh’s feast.
  reasoning_layer_used: Lexical decisions for לְיוֹם, חַג, and יְהוָה
  rationale: Natural time language replaces the repeated formal construction without merging the two sacred occasions.
