translation:
  language: en
  text: What will you do when the appointed day for the sacred gathering[a] arrives, and when it is time for Yahweh’s feast?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “appointed time” or “festival.” Here it refers to a set sacred occasion.
    reason: lexical_alternative
