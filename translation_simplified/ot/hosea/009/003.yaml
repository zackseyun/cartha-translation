  reasoning_layer_used: POB lexical decision for יֵשְׁבוּ and בְּאֶרֶץ יְהוָה
  rationale: “No longer live” states the exile consequence in ordinary English while preserving Yahweh’s ownership of the land.
- pob_phrase: unclean food
  simplified_phrase: food that is unclean under Yahweh’s law
  preserved_meaning: Exile will force them into food that violates covenant purity.
  reasoning_layer_used: POB lexical and theological decisions for טָמֵא
  rationale: The added wording prevents readers from mistaking “unclean” for merely dirty or unsafe food.
