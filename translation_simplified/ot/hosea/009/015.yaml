translation:
  language: en
  text: All their evil is at Gilgal.[a] Indeed, it was there that I hated them because of their evil deeds. I will drive them out of my house.[b] I will no longer love them. All their leaders are rebels.[c]
  philosophy: optimal-equivalence
  footnotes:
