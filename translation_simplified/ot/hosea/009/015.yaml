    reason: cultural_note
  - marker: c
    text: Or “All their rulers are stubbornly rebellious.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: indeed, there I hated them because of the evil of their deeds
  simplified_phrase: Indeed, it was there that I hated them because of their evil deeds
  preserved_meaning: This keeps the emphasis on Gilgal, the direct statement of divine hatred, and its moral cause.
  reasoning_layer_used: Lexical decisions for כִּי שָׁם, שְׂנֵאתִים, and עַל רֹעַ מַעַלְלֵיהֶם
  rationale: The wording follows ordinary English while accurately retaining the emphatic connection.
- pob_phrase: I will drive them out of my house; I will no longer love them
  simplified_phrase: I will drive them out of my house. I will no longer love them.
  preserved_meaning: The expulsion image and the end of divine love remain separate judgments.
  reasoning_layer_used: Lexical and theological decisions for מִבֵּיתִי and לֹא אוֹסֵף אַהֲבָתָם
  rationale: Two sentences make both judgments easier to understand without weakening them.
- pob_phrase: All their princes are rebels
  simplified_phrase: All their leaders are rebels
  preserved_meaning: Every governing figure is described as settled in rebellion.
  reasoning_layer_used: Lexical decisions for כָּל שָׂרֵיהֶם and סֹרְרִים
  rationale: “Leaders” avoids implying that they must be royal sons.
