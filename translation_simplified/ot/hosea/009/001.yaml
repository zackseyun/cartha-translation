translation:
  language: en
  text: Israel, do not celebrate with great joy like the other peoples,[a] because you have acted like a prostitute by turning away from your God. You have loved a prostitute’s payment[b] at every place where grain is threshed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Do not exult like the nations.” The compressed Hebrew phrase can be expressed in more than one natural way.
    reason: lexical_alternative
  - marker: b
    text: The prostitution image describes Israel’s idolatrous unfaithfulness, and the “payment” is the gain Israel sought from it.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Do not rejoice, Israel, with exultation like the peoples
  simplified_phrase: Israel, do not celebrate with great joy like the other peoples
  preserved_meaning: Israel must not join the surrounding peoples in intense celebration.
  reasoning_layer_used: The lexical decision treats the compressed phrase as describing heightened rejoicing like that of the surrounding peoples.
  rationale: The wording makes both the celebration and its intensity immediately clear.
- pob_phrase: for you have played the prostitute away from your God
  simplified_phrase: because you have acted like a prostitute by turning away from your God
  preserved_meaning: Israel’s apostasy is the reason for the prohibition and is portrayed as prostitution against God.
  reasoning_layer_used: The lexical and theological decisions preserve both the causal link and Hosea’s sexual metaphor for covenant apostasy.
  rationale: The recast clause clearly connects Israel’s unfaithfulness to the command not to celebrate.
- pob_phrase: on every threshing floor of grain
  simplified_phrase: at every place where grain is threshed
  preserved_meaning: The accusation applies to every grain-threshing site.
  reasoning_layer_used: The lexical decision identifies the agricultural location and explicitly retains grain.
  rationale: The activity-based wording explains an unfamiliar agricultural term.
interpretive_expansions:
- pob_phrase: away from your God
  rendering: by turning away from your God
  claim: The prostitution image refers to abandoning allegiance to God.
  evidence:
  - The lexical rationale says the Hebrew expresses apostasy away from allegiance to God.
  - Hosea’s sexual-infidelity image concerns covenant unfaithfulness.
  confidence: high
  alternatives_preserved:
  - away from your God
  - from following your God
translation_notes:
  risk_flags:
  - risk: Modern readers may take the prostitution language as a literal accusation.
    mitigation: Footnote b identifies it as Hosea’s metaphor for idolatrous unfaithfulness.
  - risk: Replacing “threshing floor” may lessen the force of the concrete ancient setting.
    mitigation: The rendering still identifies each site by its grain-threshing activity.
