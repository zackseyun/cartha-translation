  text: When Ephraim spoke, people trembled. He became powerful in Israel.[a] But he became guilty by worshiping Baal,[b] and he died.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The terse Hebrew may also mean, “He was honored in Israel” or “He made himself powerful in Israel.”
