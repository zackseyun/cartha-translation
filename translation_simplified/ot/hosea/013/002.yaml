  text: And now they keep on sinning. They use their own silver to make cast-metal idols, designed according to their own understanding. All of them are made by craftsmen. People say of these idols, “Let those who offer sacrifices kiss the calves!”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The calves are calf-idols, probably the worship images associated with Bethel and Samaria.
    reason: cultural_note
  - marker: b
    text: The compact Hebrew clause is uncertain in both its wording and force; it may instead mean, “Those who sacrifice humans kiss calves.”
    reason: alternative_reading
