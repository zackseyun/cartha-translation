translation:
  language: en
  text: They speak empty words, swear false oaths, and make covenants. So judgment[a] grows like a poisonous weed[b] among the plowed rows of a field.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “justice,” used with bitter irony.
    reason: alternative_reading
  - marker: b
    text: The Hebrew refers to a poisonous or bitter plant, but its exact kind is uncertain.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: They speak mere words
  simplified_phrase: They speak empty words
  preserved_meaning: Their speech has no truth or substance.
  reasoning_layer_used: Lexical decision for דְבָרִים in the context of deceptive speech
  rationale: “Empty words” makes the accusation immediately clear while retaining the emphasis on speech.
- pob_phrase: judgment springs up like poison weed
  simplified_phrase: judgment grows like a poisonous weed
  preserved_meaning: Their false dealings produce a harmful social and legal result pictured as toxic growth.
  reasoning_layer_used: Lexical and theological decisions for מִשְׁפָּט and רֹאשׁ
  rationale: “Grows” and “poisonous weed” preserve the noxious agricultural image in common English.
- pob_phrase: on the furrows of the field
  simplified_phrase: among the plowed rows of a field
  preserved_meaning: The poisonous growth spreads through the rows formed by plowing.
  reasoning_layer_used: Lexical decision for עַל תַּלְמֵי שָׂדָי
  rationale: “Plowed rows” explains the less familiar word “furrows” without losing the field image.
