simplification_decisions:
- pob_phrase: When I desire
  simplified_phrase: When I choose
  preserved_meaning: God acts according to his own will.
  reasoning_layer_used: Lexical decision for בְּאַוָּתִי
  rationale: “Choose” conveys volition without suggesting a deliberative decision.
- pob_phrase: peoples will be gathered against them
  simplified_phrase: Nations will be brought together against them
  preserved_meaning: Multiple foreign peoples will assemble in hostility against Israel.
  reasoning_layer_used: Lexical decision for וְאֻסְּפוּ עֲלֵיהֶם עַמִּים
  rationale: “Nations” is clearer here, while the passive wording leaves their assembler unstated.
- pob_phrase: for their two iniquities
  simplified_phrase: because of their two sins
  preserved_meaning: Their punishment concerns twofold wrongdoing without identifying the particular sins.
  reasoning_layer_used: Lexical and theological decisions for לִשְׁתֵּי עינתם
  rationale: “Sins” replaces unfamiliar “iniquities” while preserving the numerical element.
translation_notes:
  risk_flags:
  - risk: “Choose” is less verbally close to the Hebrew expression of desire or will.
    mitigation: It preserves the source’s volitional sense without adding deliberation.
  - risk: The difficult final Hebrew phrase may mean “double guilt” or, less likely, “two eyes.”
    mitigation: The text preserves “two,” and the footnote records both alternatives.
