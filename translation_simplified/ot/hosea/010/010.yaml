translation:
  language: en
  text: When I choose, I will discipline them. Nations will be brought together against them when they are bound because of their two sins.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may mean “their double guilt”; a literal reading, “their two eyes,” fits the context less well.
