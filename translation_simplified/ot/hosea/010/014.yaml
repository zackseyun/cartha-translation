  text: The noise and chaos of war will break out among your people. All your fortresses will be devastated, just as Shalman laid waste to Beth-arbel on the day of battle.[a] Mothers were dashed to pieces with their children.[b]
  philosophy: optimal-equivalence
  footnotes:
