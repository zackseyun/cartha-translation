translation:
  language: en
  text: The shrines of Aven[a]—Israel’s sin—will be destroyed. Thorns and thistles will grow over their altars. Then the people will say to the mountains, “Cover us!” and to the hills, “Fall on us!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the shrines of wickedness.” The Hebrew name Aven can also mean “wickedness” or “iniquity,” and Hosea may intend both senses.
    reason: alternative_reading
