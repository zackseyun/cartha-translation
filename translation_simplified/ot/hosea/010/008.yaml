- pob_phrase: The high places of Aven
  simplified_phrase: The shrines of Aven
  preserved_meaning: Aven’s sites of idolatrous worship are condemned.
  reasoning_layer_used: POB lexical decision for בָּמוֹת
  rationale: “Shrines” makes the religious meaning of “high places” immediately clear.
- pob_phrase: Thorn and thistle will grow up on their altars
  simplified_phrase: Thorns and thistles will grow over their altars
  preserved_meaning: Abandoned altars will be overrun by vegetation as an image of desolation.
  reasoning_layer_used: POB lexical decisions for קוֹץ וְדַרְדַּר and יַעֲלֶה עַל מִזְבְּחוֹתָם
  rationale: Natural plurals and “grow over” clearly picture the altars becoming overgrown.
