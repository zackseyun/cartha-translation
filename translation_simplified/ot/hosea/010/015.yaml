translation:
  language: en
  text: Bethel has brought this upon you because of your great evil. At dawn, the king of Israel will be completely destroyed.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “will be completely cut off” or “will be completely silenced.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Thus Bethel has done to you
  simplified_phrase: Bethel has brought this upon you
  preserved_meaning: Bethel remains the named agent through which judgment comes upon the people.
  reasoning_layer_used: Lexical and theological decisions on Bethel and עָשָׂה לָכֶם
  rationale: The new wording makes the result of Bethel’s action clear without explaining away the place-name imagery.
- pob_phrase: your great evil
  simplified_phrase: your great evil
  preserved_meaning: The repeated Hebrew word intensifies the people’s evil.
  reasoning_layer_used: Lexical and theological decisions on רָעַת רָעַתְכֶם
  rationale: This already gives the Hebrew emphasis in clear common English.
- pob_phrase: will be utterly cut off
  simplified_phrase: will be completely destroyed
  preserved_meaning: The king will face certain and total removal under judgment.
  reasoning_layer_used: Lexical and theological decisions on נִדְמֹה נִדְמָה
  rationale: “Completely destroyed” states the decisive outcome more plainly while retaining the Hebrew intensification.
translation_notes:
  risk_flags:
  - risk: “Bethel” stands for the idolatrous center or regime, but the exact metonymy is not explained.
    mitigation: The place name is retained so the translation does not choose among the documented referents.
  - risk: The Hebrew verb can describe destruction, removal, or silencing.
    mitigation: The main text follows the contextual sense of destruction, while the footnote preserves the alternatives.
