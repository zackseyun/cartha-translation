translation:
  language: en
  text: Ever since the days of Gibeah,[a] Israel, you have sinned. There your people have remained in the same sinful way. Will not war against the wicked people overtake them at Gibeah?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gibeah recalls the outrage and civil war recorded in Judges 19–21, which became a pattern of Israel’s deep-rooted corruption.
    reason: cross_reference
  - marker: b
    text: The Hebrew is difficult and may instead mean, “The war against the wicked people in Gibeah did not overtake them,” or “will not overtake them.”
    reason: alternative_reading
