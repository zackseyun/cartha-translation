  preserved_meaning: Gibeah marks the starting point of Israel’s continuing sin.
  reasoning_layer_used: Lexical decision for מִימֵי and the Gibeah cross-reference
  rationale: “Ever since” makes the continuing time relationship clear.
- pob_phrase: there they have remained
  simplified_phrase: There your people have remained in the same sinful way
  preserved_meaning: Israel persisted in the corrupt condition associated with Gibeah.
  reasoning_layer_used: Lexical rationale for עָמָדוּ and immediate context
  rationale: The added wording clarifies what the people remained in.
- pob_phrase: the children of iniquity
  simplified_phrase: the wicked people
  preserved_meaning: The expression describes people characterized by moral evil.
  reasoning_layer_used: Lexical decision for בְּנֵי עַלְוָה
  rationale: This common wording conveys the idiom’s moral force without adding a demonstrative.
interpretive_expansions:
- pob_phrase: there they have remained
  rendering: There your people have remained in the same sinful way
  claim: The people continued in the corrupt moral pattern associated with Gibeah.
  evidence:
