translation:
  language: en
  text: Sow with righteousness as your goal, and harvest in keeping with steadfast love. Break up your unplowed ground. Now is the time to seek Yahweh. Keep seeking him until he comes and showers righteousness on you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “until he comes and teaches you righteousness.” The Hebrew verb can mean “teach,” but the farming imagery favors “showers.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Sow for yourselves for righteousness
  simplified_phrase: Sow with righteousness as your goal
  preserved_meaning: Righteousness remains the intended result of the people's moral sowing.
  reasoning_layer_used: Lexical rationale for לִצְדָקָה
  rationale: The goal relationship is stated directly instead of using the awkward repeated “for.”
- pob_phrase: reap according to steadfast love
  simplified_phrase: harvest in keeping with steadfast love
  preserved_meaning: The harvest must correspond to covenantally faithful love.
  reasoning_layer_used: Lexical rationale for לְפִי חֶסֶד
  rationale: “In keeping with” makes the relationship clearer while retaining the key term “steadfast love.”
- pob_phrase: rains righteousness on you
  simplified_phrase: showers righteousness on you
  preserved_meaning: Yahweh bestows righteousness like life-giving rain.
  reasoning_layer_used: Lexical and theological decision for וְיֹרֶה צֶדֶק
  rationale: “Showers” sounds natural while preserving the verse's farming image.
interpretive_expansions:
- pob_phrase: seek Yahweh, until he comes
  rendering: Keep seeking him until he comes
  claim: The people are to continue seeking Yahweh until his arrival.
  evidence:
  - The word “until” marks the duration of the commanded seeking.
  - The POB lexical rationale explicitly describes seeking up to divine arrival.
  confidence: high
translation_notes:
  risk_flags:
