  reasoning_layer_used: POB lexical decisions and cultural footnote for שֵׂיבָה and זָרְקָה
  rationale: This natural wording conveys the onset of gray hair without suggesting loose hairs scattered over his body.
- pob_phrase: he does not know it
  simplified_phrase: he does not realize it
  preserved_meaning: Israel remains unaware of his own decline.
  reasoning_layer_used: POB lexical decision for וְהוּא לֹא יָדָע
  rationale: “Does not realize” clearly expresses his failure to recognize what is happening.
