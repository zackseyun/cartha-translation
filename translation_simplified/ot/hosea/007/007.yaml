translation:
  language: en
  text: They are all inflamed like an oven, and they devour their judges.[a] Their kings have all fallen. Not one of them calls to me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “rulers.” The Hebrew word may include governing authorities, not only judicial officials.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: All of them are hot like an oven
  simplified_phrase: They are all inflamed like an oven
  preserved_meaning: Everyone is heated by an unspecified passion or purpose, pictured as an oven’s heat.
  reasoning_layer_used: Lexical and theological decisions on כֻּלָּם, יֵחַמּוּ, and the oven image
  rationale: “Inflamed” makes the figurative heat clear without narrowing it to lust, anger, or conspiracy.
- pob_phrase: all their kings have fallen
  simplified_phrase: Their kings have all fallen
  preserved_meaning: Every king has fallen, whether by death, overthrow, or both.
  reasoning_layer_used: Lexical decision on כָּל מַלְכֵיהֶם נָפָלוּ
  rationale: Natural word order keeps the full scope while leaving the manner of their fall open.
- pob_phrase: None among them calls to me
  simplified_phrase: Not one of them calls to me
  preserved_meaning: No one in the accused group calls to God.
  reasoning_layer_used: Lexical decision on אֵין קֹרֵא בָהֶם אֵלָי
  rationale: The common expression makes the complete negation immediately clear.
translation_notes:
  risk_flags:
  - risk: Readers may take “judges” to mean only courtroom officials.
    mitigation: The footnote preserves the broader possible meaning “rulers.”
  - risk: “Inflamed” could be read as naming one particular passion.
    mitigation: The text retains the oven simile and does not specify lust, anger, or conspiracy.
