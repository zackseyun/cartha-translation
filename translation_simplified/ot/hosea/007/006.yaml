translation:
  language: en
  text: They draw near while they lie in wait, with hearts like an oven.[a] All night their baker sleeps,[b] but in the morning it blazes like a flaming fire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “in ambush” and describes plotting or lurking before an attack.
    reason: lexical_alternative
  - marker: b
    text: “Their baker” continues the oven image and may mean the one tending or stirring up their heated plot.
    reason: cultural_note
