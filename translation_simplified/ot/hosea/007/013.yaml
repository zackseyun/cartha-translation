simplification_decisions:
- pob_phrase: Woe to them
  simplified_phrase: How terrible it will be for them
  preserved_meaning: The words still express both lament and a warning of coming judgment.
  reasoning_layer_used: Lexical decision for אוי
  rationale: The clearer phrase communicates the prophetic force of “woe” to readers unfamiliar with the term.
- pob_phrase: Destruction is theirs
  simplified_phrase: Destruction awaits them
  preserved_meaning: God announces ruin as the consequence facing them.
  reasoning_layer_used: Lexical decision for שֹׁד לָהֶם
  rationale: “Awaits them” turns the difficult nominal expression into natural English without weakening the judgment.
- pob_phrase: they speak lies against me
  simplified_phrase: they tell lies about me
  preserved_meaning: Their false speech is directed against God.
  reasoning_layer_used: Lexical decision for דִּבְּרוּ עָלַי כְּזָבִים
  rationale: “Tell lies about me” states the hostile false speech in ordinary English.
