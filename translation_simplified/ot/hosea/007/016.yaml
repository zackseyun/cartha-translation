translation:
  language: en
  text: They turn—but not upward.[a] They are like an unreliable bow.[b] Their leaders will die by the sword because of their arrogant and provocative words. This will make them an object of mockery in Egypt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “but not to the Most High.” The Hebrew says “upward,” but may refer to God, who is mentioned in the previous verse.
    reason: alternative_reading
  - marker: b
    text: Literally, “a deceitful bow”; the image is of a bow that cannot be trusted to shoot true.
    reason: lexical_alternative
