    text: Or, “When I healed Israel” or “As I was healing Israel.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: When I would heal Israel
  simplified_phrase: When I set out to heal Israel
  preserved_meaning: God’s intended act of restoring Israel is the occasion when its sin is exposed.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Set out to heal” naturally expresses intended action without implying completed healing.
- pob_phrase: the iniquity of Ephraim is uncovered
  simplified_phrase: Ephraim’s wickedness is exposed
  preserved_meaning: Ephraim’s serious moral corruption is brought into view.
  reasoning_layer_used: lexical decision
  rationale: “Wickedness” is clearer than “iniquity,” and “exposed” preserves the revealing image.
- pob_phrase: A thief comes in; a raiding band strips outside
  simplified_phrase: A thief comes inside, while outside a raiding band plunders
  preserved_meaning: The verse contrasts covert theft indoors with open plundering outside.
  reasoning_layer_used: lexical decision and revision history
  rationale: “Plunders” conveys the raiders’ stripping action without adding an unstated total extent.
