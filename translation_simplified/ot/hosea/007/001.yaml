translation:
  language: en
  text: When I set out to heal Israel,[a] Ephraim’s wickedness is exposed, along with Samaria’s evil deeds. They act deceitfully. A thief comes inside, while outside a raiding band plunders.
  philosophy: optimal-equivalence
  footnotes:
