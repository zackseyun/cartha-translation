translation:
  language: en
  text: They are all adulterers, like an oven heated by a baker. After kneading the dough, the baker stops tending the oven[a] until the dough has risen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is difficult and may mean that the baker stops stirring or stoking the fire.
    reason: lexical_alternative
  - marker: b
    text: Literally, “until its leavening”; that is, until the dough ferments and rises.
    reason: simplification_note
simplification_decisions:
- pob_phrase: All of them are adulterers
  simplified_phrase: They are all adulterers
  preserved_meaning: The whole group is emphatically charged with adultery.
  reasoning_layer_used: Lexical and theological decisions
  rationale: The natural word order keeps the comprehensive charge without explaining away its covenantal overtones.
- pob_phrase: who stops stirring from the kneading of the dough until its leavening
  simplified_phrase: After kneading the dough, the baker stops tending the oven until the dough has risen
  preserved_meaning: The baker pauses his work during the interval between kneading and the dough’s leavening.
  reasoning_layer_used: Lexical decisions and POB footnotes
  rationale: The sequence is recast in ordinary English while the uncertain action remains qualified in a footnote.
- pob_phrase: its leavening
  simplified_phrase: the dough has risen
  preserved_meaning: The dough undergoes the fermentation process before baking.
  reasoning_layer_used: Lexical decision for חֻמְצָתוֹ
  rationale: “Has risen” gives common readers the visible result of leavening.
interpretive_expansions:
- pob_phrase: stops stirring
  rendering: stops tending the oven
  claim: The paused action concerns the baker’s care of the heated oven or its fire.
  evidence:
  - The immediate simile centers on an oven heated by a baker.
  - The POB footnote allows “stops stoking it” and describes the action as tending the oven.
  confidence: moderate
  alternatives_preserved:
  - stops stirring
  - stops stoking the fire
translation_notes:
  risk_flags:
