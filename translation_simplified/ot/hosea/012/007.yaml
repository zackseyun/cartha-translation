translation:
  language: en
  text: So return, depending on your God.[a] Hold firmly to steadfast love and justice, and always wait for your God with hope.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “return to your God” or “return with your God.”
    reason: lexical_alternative
  - marker: b
    text: The word translated “wait with hope” can also mean “look expectantly.”
    reason: lexical_alternative
