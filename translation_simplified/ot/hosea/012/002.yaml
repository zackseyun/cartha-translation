translation:
  language: en
  text: Ephraim feeds on wind. All day long he chases the east wind[a] and multiplies lies and destruction. They make a covenant with Assyria,[b] and oil is sent to Egypt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The east wind was hot and destructive, so this image suggests both futility and harm.
    reason: cultural_note
  - marker: b
    text: The Hebrew shifts from singular “Ephraim” to “they,” probably referring to Ephraim’s people or leaders.
    reason: source_note
  - marker: c
    text: The oil was probably sent as tribute or a diplomatic payment.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Ephraim feeds on wind and pursues the east wind all day long
  simplified_phrase: Ephraim feeds on wind. All day long he chases the east wind
  preserved_meaning: Both wind images retain Ephraim’s continual, futile, and harmful pursuit.
  reasoning_layer_used: Lexical and theological decisions on רֹעֶה רוּחַ and וְרֹדֵף קָדִים
  rationale: A sentence break and “chases” make the imagery easier to follow without explaining it away.
- pob_phrase: he multiplies lies and destruction
  simplified_phrase: and multiplies lies and destruction
  preserved_meaning: Ephraim independently increases both falsehood and destructive wrongdoing.
  reasoning_layer_used: Lexical decisions on כָּזָב וָשֹׁד and יַרְבֶּה
  rationale: A coordinated finite verb preserves this as a separate accusation rather than a result.
- pob_phrase: and oil is carried to Egypt
  simplified_phrase: and oil is sent to Egypt
  preserved_meaning: Oil is conveyed to Egypt as part of Ephraim’s foreign dealings.
  reasoning_layer_used: Lexical decision on וְשֶׁמֶן לְמִצְרַיִם יוּבָל
  rationale: “Sent” is natural modern English and preserves the passive political action.
translation_notes:
  risk_flags:
  - risk: Modern readers may miss the destructive force of the east-wind image.
    mitigation: Footnote a gives its regional connotation without replacing the metaphor.
  - risk: The shift from “he” to “they” may seem unclear.
    mitigation: Footnote b explains the Hebrew number shift rather than smoothing it away.
