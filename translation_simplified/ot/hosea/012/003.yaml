translation:
  language: en
  text: Yahweh has a legal case against Judah. He will punish Jacob[a] for the way he has lived. He will repay him for what he has done.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “Jacob,” a name that may point both to the patriarch and to the nation descended from him.
    reason: source_note
simplification_decisions:
- pob_phrase: has a charge against Judah
  simplified_phrase: has a legal case against Judah
  preserved_meaning: Yahweh stands as the accusing party in a covenant lawsuit against Judah.
  reasoning_layer_used: POB lexical decision for רִיב and עִם יְהוּדָה
  rationale: “Legal case” makes the courtroom setting immediately clear.
- pob_phrase: will punish Jacob according to his ways
  simplified_phrase: will punish Jacob for the way he has lived
  preserved_meaning: Jacob will be punished in keeping with his conduct.
  reasoning_layer_used: POB lexical decisions for לִפְקֹד עַל and כִּדְרָכָיו
  rationale: The wording explains the conduct metaphor without weakening divine judgment.
- pob_phrase: according to his deeds he will repay him
  simplified_phrase: He will repay him for what he has done
  preserved_meaning: The repayment corresponds to Jacob’s own actions.
  reasoning_layer_used: POB lexical decisions for כְּמַעֲלָלָיו and יָשִׁיב לוֹ
  rationale: A separate sentence states measured recompense in ordinary English.
