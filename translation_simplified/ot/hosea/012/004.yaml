translation:
  language: en
  text: While still in the womb, he grabbed his brother by the heel.[a] And he used his strength to struggle with God.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew recalls Jacob’s birth and may also suggest taking another person’s place.
    reason: lexical_alternative
  - marker: b
    text: Or, “with a divine being.” The next verse calls the figure “the angel.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: In the womb he grasped his brother’s heel
  simplified_phrase: While still in the womb, he grabbed his brother by the heel
  preserved_meaning: Jacob took hold of his brother’s heel before birth.
  reasoning_layer_used: Lexical decisions for בַּבֶּטֶן and עָקַב
  rationale: The wording keeps the concrete birth image in more natural English.
- pob_phrase: and in his strength he contended with God
  simplified_phrase: And he used his strength to struggle with God
  preserved_meaning: Jacob exerted his strength in a struggle with God without implying that he won.
  reasoning_layer_used: Lexical and theological decisions for וּבְאוֹנוֹ, שָׂרָה, and אֶת אֱלֹהִים
  rationale: “Struggle” is clearer than “contend,” while “God” preserves the POB’s main reading.
translation_notes:
  risk_flags:
  - risk: Readers may think “God” excludes the angelic description in the next verse.
    mitigation: Footnote b preserves the documented tension between “God” and “the angel.”
