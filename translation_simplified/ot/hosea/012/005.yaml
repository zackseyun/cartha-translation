translation:
  language: en
  text: Jacob struggled with the angel and prevailed.[a] He wept and pleaded for his favor. At Bethel, Jacob found him, and there he spoke with us[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “pleaded with him” or “implored him for favor.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew reads “with us.” Some understand this as “with him,” but the main text preserves the unexpected shift to “us.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: He strove with the angel
  simplified_phrase: Jacob struggled with the angel
  preserved_meaning: Jacob actively contended with the supernatural being in the Genesis encounter.
  reasoning_layer_used: lexical decision and Jacob narrative context
  rationale: “Struggled” is clearer than “strove” while preserving the wrestling image.
- pob_phrase: sought his favor
  simplified_phrase: pleaded for his favor
  preserved_meaning: Jacob earnestly asked him for favor or mercy.
  reasoning_layer_used: lexical decision for וַיִּתְחַנֶּן לוֹ
  rationale: “Pleaded” makes the earnest request explicit while retaining “favor.”
- pob_phrase: and there he spoke with us
  simplified_phrase: and there he spoke with us
  preserved_meaning: Jacob’s encounter is linked to Hosea’s audience through the first-person plural.
  reasoning_layer_used: theological decision on the pronoun shift
  rationale: The unusual “us” remains unchanged because simplifying it to “him” would erase the deliberate tension.
