translation:
  language: en
  text: I spoke through the prophets. I myself gave many visions, and I gave parables through the prophets.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “I spoke to the prophets,” though the parallel lines favor “through.”
