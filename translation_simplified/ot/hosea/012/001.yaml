translation:
  language: en
  text: Ephraim has surrounded me with lies. The people of Israel have closed in on me with deceit. But Judah still roams with God and is faithful to the Holy One.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew of this last sentence is difficult. It may instead mean, “But Judah is still unruly against God, against the Holy One who is faithful.” “The Holy One” is literally “holy ones” and may refer to heavenly beings.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Ephraim has surrounded me with lies, and the house of Israel with deceit
  simplified_phrase: Ephraim has surrounded me with lies. The people of Israel have closed in on me with deceit.
  preserved_meaning: Ephraim and Israel surround God with falsehood, while lies and deceit remain distinct.
  reasoning_layer_used: Lexical decisions for סְבָבֻנִי, בְּכַחַשׁ, וּבְמִרְמָה, and בֵּית יִשְׂרָאֵל
  rationale: Two complete sentences clarify the parallel lines while preserving the image of closing in.
- pob_phrase: the house of Israel
  simplified_phrase: the people of Israel
  preserved_meaning: Israel remains identified as a corporate people.
  reasoning_layer_used: Lexical decision for בֵּית יִשְׂרָאֵל
  rationale: The modern phrase communicates the corporate sense without the opaque household idiom.
- pob_phrase: but Judah still roams with God and is faithful with the Holy One
  simplified_phrase: But Judah still roams with God and is faithful to the Holy One.
  preserved_meaning: The positive main reading contrasts Judah’s continued association and faithfulness with Israel’s deceit.
  reasoning_layer_used: Theological decision on the difficult Judah clause and lexical decisions for רָד, עֹד, and נֶאֱמָן
  rationale: “Roams” preserves the disputed verb’s unsettled force, while “faithful to” is natural English.
translation_notes:
  risk_flags:
  - risk: “The people of Israel” softens the prophetic expression “the house of Israel.”
    mitigation: The wording retains Israel’s corporate identity without narrowing its reference.
  - risk: The favorable reading of Judah may appear more certain than the difficult Hebrew allows.
    mitigation: The footnote preserves the negative reading and the plural “holy ones” alternative.
