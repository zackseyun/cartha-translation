translation:
  language: en
  text: If Gilead is a place of wickedness,[a] its people are surely worthless.[b] In Gilgal they sacrifice bulls. Indeed, their altars are like piles of stones along the furrows of a field.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Gilead is surely wicked”; the Hebrew may be emphatic rather than conditional.
    reason: alternative_reading
  - marker: b
    text: The Hebrew can also mean that they have become empty or false.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: If Gilead is iniquity
  simplified_phrase: If Gilead is a place of wickedness
  preserved_meaning: Gilead is charged with moral evil while the opening remains conditional or emphatic.
  reasoning_layer_used: POB lexical and theological decisions on אִם and אָוֶן
  rationale: “A place of wickedness” preserves the noun-like accusation in clear English.
- pob_phrase: they have surely become nothing
  simplified_phrase: its people are surely worthless
  preserved_meaning: Gilead’s people are condemned as empty or worthless, not said to be destroyed.
  reasoning_layer_used: POB lexical decision on שָׁוְא and immediate context
  rationale: “Worthless” avoids the misleading idea that the people cease to exist.
- pob_phrase: like stone heaps on the furrows of the field
  simplified_phrase: like piles of stones along the furrows of a field
  preserved_meaning: Their many altars resemble ordinary heaps of field stones beside plowed furrows.
  reasoning_layer_used: POB lexical decision and cultural note on גַּלִּים and תַּלְמֵי שָׂדָי
  rationale: “Piles of stones” and “along the furrows” make the field image easy to picture.
