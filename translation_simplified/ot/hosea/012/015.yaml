translation:
  language: en
  text: Ephraim has stirred up bitter anger. His guilt for bloodshed will remain on him,[a] and his Lord will repay him for his disgrace.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated “his blood” or “his bloodshed will remain on him.”
    reason: lexical_alternative
  - marker: b
    text: Or “his master will bring his reproach back on him.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: has provoked bitter anger
  simplified_phrase: has stirred up bitter anger
  preserved_meaning: Ephraim has caused intense anger without naming an unstated object.
  reasoning_layer_used: Lexical decision for הִכְעִיס and תַּמְרוּרִים
  rationale: “Stirred up” expresses provocation in more familiar English while retaining the anger’s bitter force.
- pob_phrase: his bloodguilt will be left on him
  simplified_phrase: his guilt for bloodshed will remain on him
  preserved_meaning: Ephraim remains liable for bloodshed and is not cleared of it.
  reasoning_layer_used: Lexical decisions for וְדָמָיו and עָלָיו יִטּוֹשׁ
  rationale: The wording explains the uncommon term “bloodguilt” and states the continuing liability naturally.
- pob_phrase: his Lord will repay him for his disgrace
  simplified_phrase: his Lord will repay him for his disgrace
  preserved_meaning: God, under the title “his Lord,” will bring just retribution on Ephraim.
  reasoning_layer_used: Theological decision for אֲדֹנָיו and lexical decisions for חֶרְפָּתוֹ and יָשִׁיב לוֹ
  rationale: This clear wording is retained because changing the title or verb could weaken the divine judicial force.
translation_notes:
  risk_flags:
