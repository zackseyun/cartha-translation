translation:
  language: en
  text: They offer sacrifices on the mountaintops and burn offerings[a] on the hills. They do this beneath oaks, poplars, and terebinths[b], because the shade there is pleasant. As a result, your daughters prostitute themselves[c], and your daughters-in-law commit adultery.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may refer specifically to burning incense or more broadly to burning sacrificial offerings.
    reason: lexical_alternative
  - marker: b
    text: The exact kinds of trees are uncertain; these are the traditional identifications.
    reason: cultural_note
  - marker: c
    text: The words describe literal sexual sin here, while also echoing Hosea’s broader image of unfaithfulness to God.
    reason: cross_reference
