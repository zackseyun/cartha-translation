  preserved_meaning: The sexual wrongdoing is presented as a consequence of the preceding cultic practices.
  reasoning_layer_used: Lexical decision for עַל כֵּן and theological decision on literal sexual sin
  rationale: The common phrase keeps the prophetic cause-and-effect connection clear.
