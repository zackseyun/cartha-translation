  reasoning_layer_used: Lexical decision for רָאשֵׁי הֶהָרִים and יְזַבֵּחוּ
  rationale: The recast clause uses ordinary word order and makes the sacrificial act explicit.
- pob_phrase: under oak and poplar and terebinth, because their shade is good
  simplified_phrase: beneath oaks, poplars, and terebinths, because the shade there is pleasant
  preserved_meaning: The rites take place among trees chosen for their attractive shade.
  reasoning_layer_used: Lexical decisions for the tree names and כִּי טוֹב צִלָּהּ
  rationale: Plural tree names and “the shade there” sound natural without forcing the uncertain singular reference.
- pob_phrase: Therefore
