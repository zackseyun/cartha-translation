translation:
  language: en
  text: Israel, though you prostitute yourself, Judah must not become guilty. Do not go to Gilgal. Do not go up to Beth-aven.[a] Do not take an oath by saying, “As Yahweh lives.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beth-aven means “house of wickedness” or “house of iniquity” and is probably a condemning name for Bethel.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Though you prostitute yourself, Israel, let not Judah become guilty.
  simplified_phrase: Israel, though you prostitute yourself, Judah must not become guilty.
  preserved_meaning: Israel’s covenant unfaithfulness remains a direct sexual metaphor, while Judah is warned against guilt.
  reasoning_layer_used: Lexical and theological decisions on זֹנֶה and אַל יֶאְשַׁם
  rationale: The reordered sentence and direct command are easier to follow without adding an action such as joining Israel.
- pob_phrase: do not swear, ‘As Yahweh lives.’
  simplified_phrase: Do not take an oath by saying, “As Yahweh lives.”
  preserved_meaning: The command forbids using Yahweh’s personal name in this oath formula.
  reasoning_layer_used: Lexical and theological decisions on תִּשָּׁבְעוּ and יְהוָה
  rationale: “Take an oath by saying” makes the meaning of “swear” explicit in common English.
translation_notes:
