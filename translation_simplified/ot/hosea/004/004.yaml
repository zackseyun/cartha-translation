translation:
  language: en
  text: Yet no one should argue[a] or correct[b], because your people are like those who argue with a priest.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “argue” can also mean accuse or bring a case.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word translated “correct” can also mean rebuke or argue a case.
    reason: lexical_alternative
  - marker: c
    text: This may recall the law against resisting a priest’s judgment; see Deuteronomy 17:12.
    reason: cross_reference
simplification_decisions:
- pob_phrase: let no man contend
  simplified_phrase: no one should argue
  preserved_meaning: No person should dispute or press a complaint.
  reasoning_layer_used: POB lexical decision for ריב
  rationale: “Argue” is familiar English, while the note preserves the possible legal sense.
- pob_phrase: and let no man reprove
  simplified_phrase: or correct
  preserved_meaning: No person should correct, rebuke, or argue a case.
  reasoning_layer_used: POB lexical decision for יכח and grounding review
  rationale: “Correct” is clear modern English, and leaving its object unstated preserves the Hebrew’s breadth.
- pob_phrase: those who contend with a priest
  simplified_phrase: those who argue with a priest
  preserved_meaning: The people are compared to those who rebelliously dispute priestly authority.
  reasoning_layer_used: POB theological decision on the final simile
  rationale: The wording keeps the comparison without making the possible legal allusion certain.
translation_notes:
  risk_flags:
  - risk: “Argue” may sound less judicial than the Hebrew verb can be.
    mitigation: Footnote a preserves the possible senses of accusation and bringing a case.
  - risk: Readers may not recognize the gravity of arguing with a priest.
    mitigation: Footnote c identifies the possible Deuteronomic background without making it certain.
