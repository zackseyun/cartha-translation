translation:
  language: en
  text: Therefore the land mourns,[a] and all who live there waste away, together with the wild animals and the birds of the sky. Even the fish in the sea are taken away.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the earth mourns.” Here “the land” most likely means the land of Israel.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: everyone who dwells in it languishes
  simplified_phrase: all who live there waste away
  preserved_meaning: Every inhabitant becomes weak and withers under judgment.
  reasoning_layer_used: POB lexical decision for וְאֻמְלַל and כָּל יוֹשֵׁב בָּהּ
  rationale: Common words replace formal language while preserving the comprehensive scope and decline.
- pob_phrase: the beasts of the field and the birds of the heavens
  simplified_phrase: the wild animals and the birds of the sky
  preserved_meaning: The judgment affects land animals and birds as well as people.
  reasoning_layer_used: POB lexical decisions for חַיַּת הַשָּׂדֶה and עוֹף הַשָּׁמָיִם
  rationale: Modern category words make the animal groups immediately understandable.
- pob_phrase: even the fish of the sea are taken away
  simplified_phrase: Even the fish in the sea are taken away
  preserved_meaning: The judgment climactically reaches fish through removal or disappearance.
  reasoning_layer_used: POB lexical decisions for וְגַם and יֵאָסֵפוּ
  rationale: The recast phrase sounds natural while retaining the climactic “even” and the guarded sense of removal.
translation_notes:
  risk_flags:
  - risk: “Waste away” may suggest physical decline more strongly than the broader “languishes.”
    mitigation: The wording remains within the documented lexical range of weakness and withering.
  - risk: Readers could take “the land” as universally referring to the whole earth.
    mitigation: The footnote preserves the lexical alternative and identifies Israel as the likely immediate scope.
