translation:
  language: en
  text: People of Israel, listen to Yahweh’s word. Yahweh has a case against the people living in the land,[a] because there is no truth, no loyalty to the covenant, and no knowledge of God in the land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The land” most likely means the land of Israel; it can also be translated “the earth.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Hear the word of Yahweh
  simplified_phrase: listen to Yahweh’s word
  preserved_meaning: Yahweh summons Israel to receive his prophetic message.
  reasoning_layer_used: lexical decision for שִׁמְעוּ and דְבַר יְהוָה
  rationale: The ordinary command “listen” makes the prophetic summons immediately clear while retaining “word.”
- pob_phrase: sons of Israel
  simplified_phrase: People of Israel
  preserved_meaning: The address is to Israel as Yahweh’s covenant nation.
  reasoning_layer_used: listed lexical alternative for בְּנֵי יִשְׂרָאֵל
  rationale: “People of Israel” communicates the national address without the potentially misleading male-only wording.
- pob_phrase: the inhabitants of the land
  simplified_phrase: the people living in the land
  preserved_meaning: Yahweh’s legal case is against those who dwell in the land.
  reasoning_layer_used: lexical decision for עִם יוֹשְׁבֵי הָאָרֶץ
  rationale: The rewrite replaces a formal noun with common English while preserving the legal force of “against.”
interpretive_expansions:
- pob_phrase: no faithfulness
  rendering: no loyalty to the covenant
  claim: The missing faithfulness is Israel’s covenant loyalty, not reliability in a merely general sense.
  evidence:
  - The lexical rationale says חֶסֶד carries covenant-loyal overtones in Hosea.
  - The theological decision identifies failed covenant loyalty as central to the accusation.
  confidence: high
  alternatives_preserved:
  - steadfast love
  - loyalty
  - mercy
