translation:
  language: en
  text: You will stumble in the daytime, and at night the prophet[a] will stumble along with you. I will destroy[b] your mother.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a prophet.”
    reason: lexical_alternative
  - marker: b
    text: Or “silence” or “cut off”; the Hebrew verb can have these related senses in a judgment context.
    reason: lexical_alternative
  - marker: c
    text: “Your mother” probably represents the people, nation, or covenant community.
    reason: cultural_note
