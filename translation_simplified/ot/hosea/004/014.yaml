translation:
  language: en
  text: I will not punish your daughters when they prostitute themselves or your daughters-in-law when they commit adultery, because the men themselves go off with prostitutes and offer sacrifices with cult prostitutes.[a] A people without understanding will come to ruin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Cult prostitutes” means women associated with illicit worship and sexual practices; the Hebrew may also be translated “temple prostitutes.”
    reason: lexical_alternative
  - marker: b
    text: The rare Hebrew verb translated “come to ruin” may also mean “be thrown down” or “be confounded.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: nor your daughters-in-law
  simplified_phrase: or your daughters-in-law
  preserved_meaning: Both daughters and daughters-in-law remain distinct groups included in the negative statement.
  reasoning_layer_used: POB lexical decisions for בְּנוֹתֵיכֶם and כַּלּוֹתֵיכֶם
  rationale: “Or” makes the paired negative statement natural in modern English.
- pob_phrase: for the men themselves go apart with prostitutes
  simplified_phrase: because the men themselves go off with prostitutes
  preserved_meaning: The men's participation is explicitly the stated reason for not singling out the women for punishment.
  reasoning_layer_used: POB lexical decision for יְפָרֵדוּ and theological decision on the causal clause
  rationale: “Because” restores the causal link, while “go off with” preserves the image of withdrawing with prostitutes.
- pob_phrase: sacrifice with cult prostitutes
  simplified_phrase: offer sacrifices with cult prostitutes
  preserved_meaning: The men participate in illicit worship involving cult prostitutes.
  reasoning_layer_used: POB lexical decisions for קְדֵשׁוֹת and יְזַבֵּחוּ
  rationale: “Offer sacrifices” expresses the ritual action naturally without narrowing its setting.
translation_notes:
  risk_flags:
  - risk: “Go off with” expresses the contextual sexual sense more directly than the literal “go apart.”
    mitigation: The wording retains the Hebrew image of withdrawing, and the immediate mention of prostitutes bounds the meaning.
  - risk: “Come to ruin” gives a general result for a rare and uncertain Hebrew verb.
    mitigation: Footnote b preserves its principal alternative senses.
