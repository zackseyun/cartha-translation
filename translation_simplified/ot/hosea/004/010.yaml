translation:
  language: en
  text: They will eat but not have enough. They will engage in sexual immorality, but their numbers will not grow, because they have abandoned Yahweh and stopped paying attention to him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew final clause is terse and literally reads, “they have abandoned Yahweh, to keep.” It may refer to ceasing to observe Yahweh or his ways.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: not be satisfied
