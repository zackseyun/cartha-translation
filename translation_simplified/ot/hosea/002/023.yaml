simplification_decisions:
- pob_phrase: And it shall happen in that day
  simplified_phrase: When that day comes
  preserved_meaning: A future prophetic time is introduced.
  reasoning_layer_used: Lexical decision for וְהָיָה and בַּיּוֹם הַהוּא
  rationale: The new wording combines the future scene transition and time phrase in natural English.
- pob_phrase: declares Yahweh, that I will answer
  simplified_phrase: Yahweh declares, “I will answer
  preserved_meaning: Yahweh solemnly announces what he will do.
  reasoning_layer_used: Lexical and theological decisions for נְאֻם יְהוָה
  rationale: Direct quotation removes the awkward “that” clause while keeping Yahweh’s personal name and prophetic declaration.
- pob_phrase: I will answer the heavens, and they shall answer the earth
  simplified_phrase: I will answer the heavens, and they will answer the earth
  preserved_meaning: The repeated answer language personifies the heavens and preserves the poetic chain of response.
  reasoning_layer_used: Theological decision on the repeated ענה imagery
  rationale: Modern “will” replaces “shall” without explaining away the agricultural metaphor.
