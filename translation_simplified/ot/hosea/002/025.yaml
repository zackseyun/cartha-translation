translation:
  language: en
  text: “I will sow her like seed for myself in the land.[a] I will have mercy on the one called No Mercy. I will say to the one called Not My People, ‘You are my people.’ Then he will say, ‘My God.’”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “in the earth,” but “in the land” fits the promised restoration here.
    reason: lexical_alternative
  - marker: b
    text: The names are traditionally written Lo-ruhamah and Lo-ammi; “he” presents the restored people as one person answering God.
    reason: source_note
simplification_decisions:
- pob_phrase: I will sow her for myself in the land
  simplified_phrase: I will sow her like seed for myself in the land
  preserved_meaning: God pictures the restored people as seed he sows and reclaims as his own.
  reasoning_layer_used: lexical decision for וּזְרַעְתִּיהָ and לִּי
  rationale: Adding “like seed” makes the agricultural image immediately clear without replacing it.
- pob_phrase: I will have mercy on No Mercy
  simplified_phrase: I will have mercy on the one called No Mercy
  preserved_meaning: God reverses the judgment expressed by the symbolic name.
  reasoning_layer_used: theological decision on the covenant-reversal names
  rationale: “The one called” signals that No Mercy is a meaningful name, not an abstract idea.
- pob_phrase: and I will say ... and he will say
  simplified_phrase: I will say ... Then he will say
  preserved_meaning: God restores the covenant relationship, and the personified people respond.
  reasoning_layer_used: lexical and theological decisions on וְהוּא יֹאמַר
  rationale: Shorter sentences and “then” clarify the exchange while retaining the singular “he.”
interpretive_expansions:
- pob_phrase: No Mercy; Not My People
  rendering: the one called No Mercy; the one called Not My People
  claim: These expressions function as symbolic personal names whose judgments are reversed.
  evidence:
  - The POB theological decision requires translated names to preserve the prophetic wordplay.
  - The immediate clauses reverse each name through mercy and restored belonging.
  confidence: high
  alternatives_preserved:
  - Lo-ruhamah
  - Lo-ammi
translation_notes:
  risk_flags:
  - risk: The feminine “her” may leave the referent implicit for new readers.
    mitigation: The wording preserves the source image, while the audit identifies her as the restored people.
  - risk: The singular “he” may sound like an unnamed individual rather than restored Israel.
    mitigation: Footnote b explains that the people are personified as one respondent.
