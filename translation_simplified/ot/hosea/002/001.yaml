  text: Yet the sons of Israel[a] will be as numerous as the sand of the sea, which no one can measure or count. In the place where they are told, “You are not my people,” they will be told, “You are sons of the living God.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “children of Israel” and “children of the living God.” The Hebrew uses “sons” in both phrases.
