translation:
  language: en
  text: Therefore, I will act again. I will take back my grain at harvest time and my new wine in its season. I will take away[a] my wool and flax, which were meant to cover her nakedness.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “snatch away,” emphasizing sudden removal.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew image of nakedness can also suggest the shame of being exposed.
    reason: lexical_alternative
