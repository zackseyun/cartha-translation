translation:
  language: en
  text: Otherwise[a], I will strip off her clothes and leave her naked, exposed as she was on the day she was born. I will make her like a wilderness, like land dried up by drought, and let her die of thirst.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Lest I strip off her clothes.” The Hebrew introduces a threatened consequence.
    reason: lexical_alternative
  - marker: b
    text: More literally, “cause her to die of thirst.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: or else I will strip her naked and expose her
  simplified_phrase: Otherwise, I will strip off her clothes and leave her naked, exposed
  preserved_meaning: The threatened stripping and public exposure remain concrete and severe.
  reasoning_layer_used: Lexical decisions for פֶּן, אַפְשִׁיטֶנָּה, עֲרֻמָּה, and וְהִצַּגְתִּיהָ
  rationale: The rewrite makes the action immediately clear while preserving the shame imagery.
- pob_phrase: make her like a parched land
  simplified_phrase: like land dried up by drought
  preserved_meaning: She is compared to land devastated by extreme dryness.
  reasoning_layer_used: Lexical decision for כְּאֶרֶץ צִיָּה and the theological decision to retain wilderness imagery
  rationale: The common phrase explains “parched” without turning the image into abstract deprivation.
- pob_phrase: and let her die of thirst
  simplified_phrase: and let her die of thirst
  preserved_meaning: Thirst remains the stated means by which she dies.
  reasoning_layer_used: Lexical decision for וַהֲמִתִּיהָ בַּצָּמָא and doctrine realignment
  rationale: The audited idiomatic wording is retained, with the causative force noted below.
