translation:
  language: en
  text: Therefore, look! I am blocking your way with a hedge of thorns. I will surround her with a wall,[a] so she will not find her paths.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is terse and may also be translated, “I will wall in her wall”; the sense is that God erects a barrier around her.
    reason: lexical_alternative
  - marker: b
    text: Hebrew shifts from directly addressing “your way” to speaking about “her paths.”
    reason: source_note
