- pob_phrase: pursue her lovers, but she will not overtake them
  simplified_phrase: chase after her lovers, but she will not catch them
  preserved_meaning: She actively follows her illicit lovers but cannot reach them.
  reasoning_layer_used: Lexical decisions for וְרִדְּפָה, מְאַהֲבֶיהָ, and תַשִּׂיג
  rationale: Familiar chase language preserves both her pursuit and her failure to catch them.
- pob_phrase: she will seek them
  simplified_phrase: she will look for them
  preserved_meaning: She intentionally searches for her lovers.
  reasoning_layer_used: Lexical decision for וּבִקְשָׁתַם
  rationale: “Look for” is familiar English and keeps the parallel with finding.
- pob_phrase: I will go and return to my first husband, for it was better for me then than now
  simplified_phrase: I will go back to my first husband. I was better off then than I am now.
  preserved_meaning: She resolves to return to her first husband because her former condition was better.
  reasoning_layer_used: Lexical decisions for אֵלְכָה וְאָשׁוּבָה, אֶל אִישִׁי הָרִאשׁוֹן, and כִּי טוֹב לִי אָז מֵעָתָּה
  rationale: Natural modern wording conveys her return and clearly contrasts then with now.
