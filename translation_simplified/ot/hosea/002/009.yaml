translation:
  language: en
  text: She will chase after her lovers, but she will not catch them. She will look for them, but she will not find them. Then she will say, “I will go back to my first husband.[a] I was better off then than I am now.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “former husband.” The Hebrew says literally “my first husband.”
    reason: lexical_alternative
