translation:
  language: en
  text: From there I will restore her vineyards to her. I will make the Valley of Achor a doorway of hope.[a] There she will answer as she did in her youth, as when she came up from Egypt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Valley of Achor recalls Achan’s judgment; a place of trouble will become a doorway of hope (Joshua 7:24–26).
    reason: cross_reference
  - marker: b
    text: The Hebrew may also mean, “There she will sing”; the verb describes an answer and may imply singing here.
    reason: lexical_alternative
