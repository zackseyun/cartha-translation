translation:
  language: en
  text: On that day, I will make a covenant for their benefit with the wild animals, the birds of the sky, and the creatures that crawl on the ground. I will break the bow and the sword and put an end to war in the land.[a] I will make them lie down in safety.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “on the earth.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the birds of the heavens, and with the creeping things of the ground
  simplified_phrase: the birds of the sky, and the creatures that crawl on the ground
  preserved_meaning: The three groups of animals remain distinct, including flying and ground-crawling creatures.
  reasoning_layer_used: POB lexical decisions
  rationale: Common concrete wording makes the animal imagery immediately clear.
- pob_phrase: I will break bow and sword and war from the land
  simplified_phrase: I will break the bow and the sword and put an end to war in the land
  preserved_meaning: God will destroy specific weapons and end warfare while preserving the poetic movement from weapons to war.
  reasoning_layer_used: POB lexical decisions and theological context
  rationale: The recast keeps the breaking image for weapons without the unnatural phrase “break war.”
- pob_phrase: I will make them lie down in safety
  simplified_phrase: I will make them lie down in safety
  preserved_meaning: God causes the restored people to rest securely.
  reasoning_layer_used: POB lexical decision on the causative verb
  rationale: This already uses clear English and retains the source verb’s causative force.
interpretive_expansions:
- pob_phrase: for them
  rendering: for their benefit
  claim: The restored people are the beneficiaries of God’s covenant with the animal world.
  evidence:
