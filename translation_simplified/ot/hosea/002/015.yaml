  text: “I will punish her for the times she devoted to the Baals.[a] She burned incense to them, put on her ring[b] and jewelry, and chased after her lovers. But she forgot me,” declares Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The Baals” refers to the various forms or idols of the god Baal that Israel worshiped.
    reason: cultural_note
  - marker: b
    text: The Hebrew may refer specifically to a nose ring or an earring.
    reason: lexical_alternative
