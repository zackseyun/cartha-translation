  rationale: “People” expresses the Hebrew group-identifying idiom in clear modern English.
- pob_phrase: they will appoint for themselves one head
  simplified_phrase: They will appoint one head over themselves
  preserved_meaning: The reunited people choose unified leadership without identifying the leader.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The recast syntax is natural English while retaining the source metaphor and its open identity.
- pob_phrase: for great will be the day of Jezreel
  simplified_phrase: The day of Jezreel will be great
  preserved_meaning: Jezreel’s coming day is emphatically described as great.
  reasoning_layer_used: POB lexical decision
  rationale: Ordinary English word order improves readability without weakening the prophetic declaration.
