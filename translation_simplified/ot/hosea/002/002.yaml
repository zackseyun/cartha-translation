translation:
  language: en
  text: Then the people of Judah and Israel will be gathered together. They will appoint one head over themselves,[a] and they will go up from the land.[b] The day of Jezreel will be great.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression “one head” can also mean “one leader.”
    reason: lexical_alternative
  - marker: b
    text: This may describe coming up out of exile or ascending into the restored land; the Hebrew does not make the exact meaning clear.
    reason: alternative_reading
  - marker: c
    text: Jezreel is a place name that also echoes Hosea’s themes of scattering and sowing.
    reason: cultural_note
