    text: Or “When Yahweh first spoke through Hosea.” The Hebrew can introduce the book or indicate when Yahweh first spoke.
    reason: alternative_reading
  - marker: b
    text: Here “whoredom” means sexual unfaithfulness and may refer more specifically to prostitution.
    reason: lexical_alternative
