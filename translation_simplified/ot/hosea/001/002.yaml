  text: 'Here begins Yahweh’s message through Hosea.[a] Yahweh said to Hosea, “Go and take for yourself a wife marked by whoredom and children marked by whoredom.[b] For the land is utterly unfaithful: it commits whoredom by turning away from Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
