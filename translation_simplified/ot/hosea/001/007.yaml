  rationale: “People of Judah” makes the national meaning immediately clear.
- pob_phrase: I will not save them by bow, or by sword, or by war
  simplified_phrase: not by bows or swords, warfare
  preserved_meaning: Judah’s rescue will not come through weapons or military action.
  reasoning_layer_used: POB lexical decisions and source repetition
  rationale: The compact list preserves each military image in natural English.
- pob_phrase: by horses, or by horsemen
  simplified_phrase: horses, or mounted soldiers
  preserved_meaning: Military horses and their riders will not bring deliverance.
  reasoning_layer_used: POB lexical decisions
  rationale: “Mounted soldiers” is clearer today than “horsemen” while preserving the concrete image.
