translation:
  language: en
  text: Then Yahweh said to him, “Name the boy Jezreel, because before long I will punish Jehu’s family for the bloodshed associated with Jezreel.[a] I will bring the kingdom of Israel to an end.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jezreel is both the boy’s symbolic name and the place connected with Jehu’s violence. The Hebrew may refer to blood shed there or to bloodguilt associated with it.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Call his name Jezreel
  simplified_phrase: Name the boy Jezreel
  preserved_meaning: Yahweh commands that the male child receive the symbolic name Jezreel.
  reasoning_layer_used: Lexical decision for קְרָא שְׁמוֹ and the immediate context
  rationale: “Name the boy” expresses the Hebrew naming command in ordinary English.
- pob_phrase: the house of Jehu
  simplified_phrase: Jehu’s family
  preserved_meaning: The coming punishment targets Jehu’s dynastic household.
  reasoning_layer_used: Lexical decision for עַל בֵּית יֵהוּא
  rationale: “Family” makes the dynastic sense of “house” clear to a modern reader.
- pob_phrase: the kingdom of the house of Israel
  simplified_phrase: the kingdom of Israel
  preserved_meaning: Yahweh will end Israel’s kingdom as a national and royal structure.
  reasoning_layer_used: Lexical decision for מַמְלְכוּת בֵּית יִשְׂרָאֵל
  rationale: The shorter phrase is natural English while retaining the announced end of Israel’s kingdom.
