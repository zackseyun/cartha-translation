translation:
  language: en
  text: Ephraim will become a ruined wasteland when the day of rebuke comes.[a] Among the tribes of Israel, I have announced what is certain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Day of rebuke” may also be understood as “day of punishment” or “day of judgment.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: will become a desolation
  simplified_phrase: will become a ruined wasteland
  preserved_meaning: Ephraim will be brought into a state of devastating ruin.
  reasoning_layer_used: Lexical decision for לְשַׁמָּה and תִהְיֶה
  rationale: The concrete phrase “ruined wasteland” makes the devastation clear while preserving the movement into ruin.
- pob_phrase: in the day of rebuke
  simplified_phrase: when the day of rebuke comes
  preserved_meaning: The ruin will occur at the appointed time of divine rebuke.
  reasoning_layer_used: Lexical and theological decisions for בְּיוֹם תּוֹכֵחָה
  rationale: The ordinary clause order is easier to read while retaining “rebuke” rather than resolving it as punishment or judgment.
- pob_phrase: I have made known what is certain
  simplified_phrase: I have announced what is certain
  preserved_meaning: God has issued a reliable declaration whose fulfillment is assured.
  reasoning_layer_used: Lexical decisions for הוֹדַעְתִּי and נֶאֱמָנָה
  rationale: “Announced” is direct modern English for making a pronouncement known.
translation_notes:
  risk_flags:
  - risk: “Ruined wasteland” emphasizes physical devastation more concretely than “desolation.”
    mitigation: It remains within the documented senses of devastation, waste, and ruin.
  - risk: Modern readers may not know that Ephraim often represents the northern kingdom.
    mitigation: The proper name is retained because the POB theological decision rejects an interpretive expansion in the main text.
