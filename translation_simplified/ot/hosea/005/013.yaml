translation:
  language: en
  text: Ephraim saw how sick he was, and Judah saw his own wound. Then Ephraim went to Assyria and sent to King Jareb.[a] But the king cannot heal you or cure your wound.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may instead mean “the avenging king” or “the great king.”
    reason: alternative_reading
