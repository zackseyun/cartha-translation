translation:
  language: en
  text: Hear this, priests! Pay attention, people of Israel! Listen, royal house! For this judgment concerns you.[a] You have been a trap at Mizpah and a net spread on Tabor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “this judgment is against you.” The compact Hebrew can mean either that the judgment concerns them or that it is directed against them.
    reason: alternative_reading
  - marker: b
    text: Mizpah and Tabor are places in Israel. The verse connects them with the imagery of a trap and a net.
    reason: cultural_note
simplification_decisions:
- pob_phrase: house of Israel
  simplified_phrase: people of Israel
  preserved_meaning: Israel is addressed as a collective people.
  reasoning_layer_used: lexical decision and translation philosophy
  rationale: The common expression makes the collective address clear without changing its referent.
- pob_phrase: give ear, house of the king
  simplified_phrase: Listen, royal house
  preserved_meaning: The royal court or dynasty is called to listen.
  reasoning_layer_used: lexical decision
  rationale: The wording retains the third command and broad royal referent without adding unsupported intensity.
- pob_phrase: the judgment is for you
  simplified_phrase: this judgment concerns you
  preserved_meaning: The addressed groups face a judgment that may be directed against them.
  reasoning_layer_used: lexical and theological decisions
  rationale: The readable wording preserves the compact phrase’s ambiguity through the footnote.
translation_notes:
  risk_flags:
  - risk: “Concerns you” may sound more neutral than the surrounding accusation.
    mitigation: The alternative footnote and trap imagery retain the possible adverse force.
  - risk: “Royal house” may be understood only as the king’s family.
    mitigation: The established expression can still include the royal court or dynasty.
