translation:
  language: en
  text: I will go away and return to my place. I will remain there until they admit their guilt[1] and seek my face. When they are in distress, they will seek me earnestly.[2]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: The Hebrew may also mean “bear their guilt” or “be found guilty,” but the context favors admitting their guilt.
    reason: lexical_alternative
  - marker: '2'
    text: The Hebrew can literally mean “seek me early,” but here it likely means seeking diligently or earnestly.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I will go, I will return to my place
  simplified_phrase: I will go away and return to my place
  preserved_meaning: God withdraws while the spatial image and two movements remain distinct.
  reasoning_layer_used: Lexical and theological decisions on divine withdrawal
  rationale: “Go away” makes the contextual direction clear without implying total abandonment.
- pob_phrase: until they acknowledge their guilt
  simplified_phrase: until they admit their guilt
  preserved_meaning: They recognize and own their offense before seeking God.
  reasoning_layer_used: Lexical decision for יֶאְשְׁמוּ
  rationale: “Admit” is common English for openly recognizing one's guilt.
- pob_phrase: in their distress they will seek me earnestly
  simplified_phrase: When they are in distress, they will seek me earnestly
  preserved_meaning: Their trouble becomes the circumstance in which they diligently seek God.
  reasoning_layer_used: Lexical decisions for בַּצַּר לָהֶם and יְשַׁחֲרֻנְנִי
  rationale: A time clause reads more naturally while retaining the distress and intensity.
translation_notes:
  risk_flags:
  - risk: “Go away” could be heard as absolute divine absence.
    mitigation: “Return to my place” retains the verse's relational and judicial withdrawal image without defining its metaphysics.
  - risk: “Admit their guilt” selects one sense of an ambiguous Hebrew verb.
    mitigation: The footnote preserves the guilt-bearing and guilty-status alternatives.
