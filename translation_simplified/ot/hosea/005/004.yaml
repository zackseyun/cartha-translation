translation:
  language: en
  text: Their actions keep them from returning to their God. A spirit of prostitution[a] is within them, and they do not know Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This sexual-infidelity image depicts covenant unfaithfulness, including idolatry.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Their deeds do not allow them to return
  simplified_phrase: Their actions keep them from returning
  preserved_meaning: Their conduct prevents their covenantal return to God.
  reasoning_layer_used: Lexical decisions for יִתְּנוּ and מַעַלְלֵיהֶם
  rationale: The rewrite states the Hebrew idiom in direct modern English while retaining its moral force.
- pob_phrase: a spirit of whoredom
  simplified_phrase: a spirit of prostitution
  preserved_meaning: The strong sexual-infidelity image portrays pervasive covenant unfaithfulness.
  reasoning_layer_used: Lexical and theological decisions for רוּחַ זְנוּנִים
  rationale: “Prostitution” is an approved modern alternative that preserves the disturbing prophetic image.
- pob_phrase: they do not know Yahweh
  simplified_phrase: they do not know Yahweh
  preserved_meaning: The wording retains the relational and covenantal depth of knowing Yahweh.
  reasoning_layer_used: Theological decision for לֹא יָדָעוּ and divine-name decision for יְהוָה
  rationale: Keeping this phrase avoids narrowing “know” to acknowledgment, obedience, or cognition alone.
translation_notes:
  risk_flags:
  - risk: “Prostitution” could be read as referring only to literal sexual conduct.
    mitigation: The footnote identifies it as an image of covenant unfaithfulness, including but not limited to idolatry.
