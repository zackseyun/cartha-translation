translation:
  language: en
  text: They have been unfaithful to the LORD, for they have had children who are strangers to the LORD.[a] Now the new moon will devour them together with what belongs to them.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may refer to children born from forbidden unions or, more broadly, to a generation estranged from the LORD.
    reason: lexical_alternative
  - marker: b
    text: Or “Within a month, they and what belongs to them will be devoured.” The Hebrew word can mean either “new moon” or “month.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: have dealt faithlessly with Yahweh
  simplified_phrase: have been unfaithful to the LORD
  preserved_meaning: They have betrayed their covenant relationship with the LORD.
  reasoning_layer_used: The lexical decision for בגד and the project’s standard rendering of YHWH.
  rationale: “Been unfaithful” expresses covenant betrayal in familiar English.
- pob_phrase: have borne foreign children
  simplified_phrase: have had children who are strangers to the LORD
  preserved_meaning: Their children are marked by covenantal estrangement without reducing the phrase to ethnicity.
  reasoning_layer_used: The lexical and theological decisions on בָנִים זָרִים.
  rationale: “Strangers” makes the likely covenantal force clearer while the footnote preserves the phrase’s range.
- pob_phrase: with their portions
  simplified_phrase: together with what belongs to them
  preserved_meaning: Judgment consumes both the people and their broadly understood shares or possessions.
  reasoning_layer_used: The lexical decision for חֶלְקֵיהֶם and the applied revision.
  rationale: The wording explains “portions” without narrowing it to land.
interpretive_expansions:
- pob_phrase: foreign children
  rendering: children who are strangers to the LORD
  claim: The children are estranged from the LORD within the covenant context.
  evidence:
  - The accusation immediately concerns unfaithfulness to the LORD.
  - The theological decision identifies covenantal estrangement as the phrase’s likely force.
  confidence: moderate
  alternatives_preserved:
  - Children born from forbidden unions
  - A generation estranged from the LORD
  - Children of foreign parentage
translation_notes:
  risk_flags:
  - risk: “Strangers to the LORD” may emphasize covenantal estrangement over foreign parentage or illicit unions.
    mitigation: Footnote [a] preserves both the familial and broader covenantal possibilities.
  - risk: “New moon” is an unusual agent of destruction and חֹדֶשׁ may instead mean “month.”
    mitigation: The image remains in the text, while footnote [b] preserves the temporal reading.
