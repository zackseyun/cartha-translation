translation:
  language: en
  text: For I am like a lion attacking Ephraim, and like a young lion attacking Judah’s people. I myself will tear them apart and leave. I will carry them off, and no one will rescue them.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: like a lion to Ephraim
  simplified_phrase: like a lion attacking Ephraim
  preserved_meaning: The LORD is pictured as a lion bringing judgment against Ephraim.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Attacking” makes the hostile relation clear while retaining the lion metaphor.
- pob_phrase: the house of Judah
  simplified_phrase: Judah’s people
  preserved_meaning: Judah is addressed as a corporate people.
  reasoning_layer_used: lexical decision
  rationale: The common wording communicates the Hebrew corporate idiom without suggesting a building.
- pob_phrase: I, I myself, will tear and go away
  simplified_phrase: I myself will tear them apart and leave
  preserved_meaning: The LORD emphatically identifies himself as the one who attacks and then departs.
  reasoning_layer_used: lexical decisions
  rationale: The revised sentence keeps the emphasis and predatory force in natural English.
interpretive_expansions:
- pob_phrase: will tear ... I will carry off
  rendering: will tear them apart ... I will carry them off
  claim: The implied objects are Ephraim and Judah’s people as those under judgment.
  evidence:
  - The two named peoples immediately precede the predatory verbs.
  - The POB theological decision identifies both kingdoms as the objects of destructive judgment.
  confidence: high
  alternatives_preserved:
  - The wording does not specify the exact historical form of the judgment.
translation_notes:
  risk_flags:
