translation:
  language: en
  text: Ephraim, how can I give you up? Israel, how can I hand you over? How can I make you like Admah? How can I make you like Zeboiim?[a] My heart turns over within me.[b] All my feelings of compassion are stirred.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Admah and Zeboiim were destroyed along with Sodom and Gomorrah; here they represent total destruction (see Deuteronomy 29:23).
    reason: cross_reference
  - marker: b
    text: Or “My heart changes within me.” The Hebrew pictures God’s heart turning over in intense inner turmoil.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: How can I give you up, Ephraim? How can I hand you over, Israel?
  simplified_phrase: Ephraim, how can I give you up? Israel, how can I hand you over?
  preserved_meaning: God addresses Ephraim and Israel with astonishment and reluctance at handing them over to judgment.
  reasoning_layer_used: Lexical decisions for אֵיךְ, אֶתֶּנְךָ, and אֲמַגֶּנְךָ
  rationale: Moving the names first makes the direct address easier to follow without weakening the repeated questions.
- pob_phrase: My heart is turned over within me
  simplified_phrase: My heart turns over within me.
  preserved_meaning: God’s heart is portrayed as undergoing intense inner upheaval.
  reasoning_layer_used: Lexical and theological decisions for נֶהְפַּךְ עָלַי לִבִּי
  rationale: The active wording is more natural while retaining the vivid image of a heart turning over.
- pob_phrase: all my compassions are stirred
  simplified_phrase: All my feelings of compassion are stirred.
  preserved_meaning: God’s many expressions of compassion are powerfully moved together.
  reasoning_layer_used: Lexical decisions for יַחַד, נִכְמְרוּ, and נִחוּמָי
  rationale: Adding “feelings of” makes the unusual plural “compassions” clear in common English.
