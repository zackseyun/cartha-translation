translation:
  language: en
  text: A sword will whirl through his cities.[a] It will destroy the bars that secure his city gates[b] and devour them because of their plans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult Hebrew verb may also mean that the sword will fall or rage in his cities.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may instead refer to his rulers, but the city-under-attack setting favors gate-bars.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: will consume his bars
  simplified_phrase: will destroy the bars that secure his city gates
  preserved_meaning: The sword destroys the physical defenses of his cities.
  reasoning_layer_used: POB lexical decision for בַדָּיו and its military context
  rationale: This explains the unfamiliar defensive bars while preserving the siege image.
- pob_phrase: because of their counsels
  simplified_phrase: because of their plans
  preserved_meaning: Their own decisions are the cause of the judgment.
  reasoning_layer_used: POB lexical decision for מִמֹּעֲצוֹתֵיהֶם
  rationale: “Plans” conveys the same causal meaning in common English.
- pob_phrase: his cities ... his bars ... their counsels
  simplified_phrase: his cities ... his city gates ... their plans
  preserved_meaning: The shift from singular corporate language to plural responsibility remains.
  reasoning_layer_used: POB theological decision on pronominal suffixes
  rationale: The singular and plural pronouns remain rather than being harmonized.
