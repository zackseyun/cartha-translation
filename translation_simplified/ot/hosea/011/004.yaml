translation:
  language: en
  text: I drew them with cords of human kindness,[a] with ropes of love. Toward them, I was like those who lift a yoke from an animal’s jaws. I bent down to him and fed him.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “cords of man” or “human cords,” probably picturing humane, gentle leading.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew shifts from “them” to “him”; many translations use “them” throughout.
    reason: alternative_reading
