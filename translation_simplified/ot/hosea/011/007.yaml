translation:
  language: en
  text: My people are determined to turn away from me.[a] Even though they call to the Most High, he does not lift them up as a group.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term can also be translated “backsliding” or “apostasy.”
    reason: lexical_alternative
  - marker: b
