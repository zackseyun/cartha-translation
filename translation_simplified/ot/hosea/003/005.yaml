translation:
  language: en
  text: After that, the people of Israel will return. They will seek Yahweh their God and David their king.[a] In the days to come,[b] they will approach Yahweh and his goodness with reverent trembling.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “David their king” may mean David as the royal representative or a future king from David’s line.
    reason: alternative_reading
  - marker: b
    text: “In the days to come” is a prophetic expression also translated “in the latter days” or “in the last days.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Afterward the children of Israel
  simplified_phrase: After that, the people of Israel
  preserved_meaning: The same covenant people act after the period described in the preceding verses.
  reasoning_layer_used: Lexical decisions for אַחַר and בְּנֵי יִשְׂרָאֵל
  rationale: Common wording replaces the less immediate familial expression without changing the group identified.
- pob_phrase: and they will come in fear to Yahweh and to his goodness
  simplified_phrase: they will approach Yahweh and his goodness with reverent trembling
  preserved_meaning: Israel moves toward Yahweh and his goodness in awed fear rather than merely being frightened.
  reasoning_layer_used: Lexical and theological decisions for וּפָחֲדוּ אֶל יְהוָה וְאֶל טוּבוֹ
  rationale: “Approach” clarifies the directional construction, while “trembling” preserves the Hebrew image.
- pob_phrase: in the latter days
  simplified_phrase: In the days to come
  preserved_meaning: The restoration belongs to a future period described in prophetic language.
  reasoning_layer_used: Lexical decision for בְּאַחֲרִית הַיָּמִים
  rationale: The approved alternative is clearer to readers unfamiliar with prophetic terminology.
interpretive_expansions:
- pob_phrase: come in fear
  rendering: with reverent trembling
  claim: The fear is an awed approach to Yahweh, not merely terror of his goodness.
  evidence:
  - The preposition אֶל gives the action a direction toward Yahweh and his goodness.
  - The POB theological decision identifies the movement as reverent trembling.
  confidence: high
  alternatives_preserved:
  - fear Yahweh and his goodness
  - stand in awe of Yahweh and his bounty
translation_notes:
  risk_flags:
  - risk: “David their king” remains ambiguous to modern readers.
    mitigation: Footnote a preserves both documented royal interpretations without choosing one.
  - risk: “His goodness” may sound abstract or like an object of fear.
    mitigation: The wording joins it to an approach marked by reverent trembling, preserving both God’s character and provision.
