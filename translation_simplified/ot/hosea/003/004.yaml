translation:
  language: en
  text: For a long time, the people of Israel will live with no king or other ruler. They will have no sacrifice or sacred pillar,[a] and no ephod[b] or household idols.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A sacred pillar was a standing stone used in worship.
    reason: cultural_note
  - marker: b
    text: An ephod was a priestly garment or an associated object used in worship.
    reason: cultural_note
simplification_decisions:
- pob_phrase: many days the sons of Israel will dwell
  simplified_phrase: a long time, the people of Israel will live
  preserved_meaning: Israel as a people will continue in this condition for an unspecified extended period.
  reasoning_layer_used: Lexical decisions for יָמִים רַבִּים, יֵשְׁבוּ, and בְּנֵי יִשְׂרָאֵל
  rationale: The smoother wording states the corporate and continuing sense in common English.
- pob_phrase: without king or prince
  simplified_phrase: with no king or other ruler
  preserved_meaning: Israel will lack royal and high political leadership.
  reasoning_layer_used: Lexical decision for שָׂר
  rationale: “Other ruler” communicates the governing role more clearly than the potentially hereditary title “prince.”
- pob_phrase: without sacrifice or pillar, and without ephod or household idols
  simplified_phrase: They will have no sacrifice or sacred pillar, and no ephod or household idols
  preserved_meaning: Israel will lack the listed objects and practices associated with both approved and condemned worship.
  reasoning_layer_used: Theological decision preserving cultic tension
  rationale: A separate sentence clarifies the list without classifying all its items as either proper or improper worship.
interpretive_expansions:
- pob_phrase: pillar
  rendering: sacred pillar
  claim: The pillar is a standing stone used in worship, not an ordinary structural support.
  evidence:
