translation:
  language: en
  text: Yahweh said to me again, “Go. Love a woman[a] who is loved by someone else and is committing adultery. Love her as Yahweh loves the children of Israel, even though they turn to other gods and love raisin cakes.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “a wife loved by another.” The word translated “someone else” can mean a companion or associate and, in this context, may mean a husband. The text does not identify the woman.
    reason: lexical_alternative
  - marker: b
    text: Raisin cakes were pressed cakes of dried grapes, possibly connected with celebrations or idol worship.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Go, love a woman loved by another and committing adultery
  simplified_phrase: Go. Love a woman who is loved by someone else and is committing adultery.
  preserved_meaning: Yahweh gives two direct commands concerning a woman involved in adultery.
  reasoning_layer_used: Lexical decisions for לֵךְ אֱהַב, אִשָּׁה, אֲהֻבַת רֵעַ, and וּמְנָאָפֶת
  rationale: Separate sentences clarify the commands, while “someone else” leaves the relationship unspecified.
- pob_phrase: just as Yahweh loves the children of Israel
  simplified_phrase: Love her as Yahweh loves the children of Israel
  preserved_meaning: Hosea’s commanded love is compared with Yahweh’s love for Israel.
  reasoning_layer_used: Lexical decision for כְּאַהֲבַת יְהוָה אֶת בְּנֵי יִשְׂרָאֵל
  rationale: Repeating the command makes the comparison easy to follow while preserving the theme of love.
- pob_phrase: though they turn to other gods
  simplified_phrase: even though they turn to other gods
  preserved_meaning: Yahweh loves Israel despite their unfaithfulness.
  reasoning_layer_used: Theological decision on the concessive force of Israel’s apostasy
  rationale: “Even though” states the implied contrast clearly in common English.
