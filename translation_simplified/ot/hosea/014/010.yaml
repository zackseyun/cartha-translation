  text: Who is wise? He should understand all this. Who has discernment? He should know these things. For Yahweh’s ways are straight[a]. The righteous walk along them, but those who rebel[b] stumble on those same paths.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, morally right or upright, while retaining the picture of a straight path.
    reason: lexical_alternative
  - marker: b
    text: Or “transgressors.”
    reason: lexical_alternative
