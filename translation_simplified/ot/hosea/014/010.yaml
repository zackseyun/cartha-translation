  preserved_meaning: The righteous conduct their lives within Yahweh’s ways.
  reasoning_layer_used: Lexical decision for יֵלְכוּ בָם and the path-image theological rationale.
  rationale: “Walk along” sounds natural while preserving the moral path image.
- pob_phrase: transgressors stumble in them
  simplified_phrase: those who rebel stumble on those same paths
