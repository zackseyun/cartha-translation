  preserved_meaning: God will restore his people from their covenant rebellion while retaining the healing image.
  reasoning_layer_used: lexical decision for מְשׁוּבָה and Hosea’s covenant context
  rationale: “Rebellion against me” makes the unfamiliar term “apostasy” immediately understandable.
- pob_phrase: love them freely
  simplified_phrase: freely give them my love
  preserved_meaning: God’s love is gracious and uncoerced.
  reasoning_layer_used: lexical decision for נְדָבָה
  rationale: The recast clause clarifies that God gives his love freely.
- pob_phrase: for my anger has turned away from him
  simplified_phrase: because my anger has turned away from him
  preserved_meaning: The withdrawal of God’s anger grounds his promise, and the Hebrew singular remains visible.
  reasoning_layer_used: lexical and theological decisions for כִּי, שׁוּב, and מִמֶּנּוּ
  rationale: “Because” states the connection plainly without removing the turning-away image or number shift.
