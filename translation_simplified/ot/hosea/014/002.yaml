translation:
  language: en
  text: Israel, return to Yahweh your God, because you have stumbled in your sin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “because of your sin.” The Hebrew may describe either what caused Israel to stumble or the sinful condition in which Israel stumbled.
