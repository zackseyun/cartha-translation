simplification_decisions:
- pob_phrase: Return, O Israel
  simplified_phrase: Israel, return
  preserved_meaning: Israel is commanded to turn back toward God.
  reasoning_layer_used: POB lexical and theological decisions for שׁוּבָה
  rationale: The natural word order removes the archaic address while preserving the return image.
- pob_phrase: for you have stumbled
  simplified_phrase: because you have stumbled
  preserved_meaning: Israel’s failure gives the reason for the call to return.
  reasoning_layer_used: POB lexical decision for כִּי and כָשַׁלְתָּ
  rationale: “Because” makes the logical connection immediate while retaining the source metaphor.
- pob_phrase: in your iniquity
  simplified_phrase: in your sin
  preserved_meaning: Israel has stumbled within, or because of, its own wrongdoing.
  reasoning_layer_used: POB lexical decision and footnote for בַּעֲוֺנֶךָ
  rationale: “Sin” is more familiar than “iniquity,” and the footnote preserves the preposition’s ambiguity.
translation_notes:
  risk_flags:
  - risk: “Sin” carries less explicit emphasis on guilt than “iniquity.”
    mitigation: The wording still identifies Israel’s moral wrongdoing as the setting or cause of its stumbling.
  - risk: Readers may take “in your sin” only as a description of condition.
    mitigation: The footnote retains the plausible causal meaning, “because of your sin.”
