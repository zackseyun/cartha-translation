translation:
  language: en
  text: Those who live in the safety of his shade will come back.[a] They will spring to life like grain and bloom like a grapevine. His fame[b] will be like Lebanon’s wine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may instead mean that they will grow abundant grain or be revived by grain.
    reason: lexical_alternative
  - marker: b
    text: “His fame” may also mean “his remembrance”; the Hebrew does not identify who “his” refers to.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Those who dwell in his shade will return
  simplified_phrase: Those who live in the safety of his shade will come back
  preserved_meaning: People under his protection will experience restoration, while the shade image and singular pronoun remain.
  reasoning_layer_used: Lexical and theological decisions on יֹשְׁבֵי בְצִלּוֹ, יָשֻׁבוּ, and the singular suffix
  rationale: Common wording explains the protective force of “shade” without resolving who “his” identifies.
- pob_phrase: they will revive like grain and blossom like the vine
  simplified_phrase: They will spring to life like grain and bloom like a grapevine
  preserved_meaning: Their renewed vitality is pictured through living grain and a flowering vine.
  reasoning_layer_used: Lexical decisions on יְחַיּוּ דָגָן and וְיִפְרְחוּ כַגָּפֶן
  rationale: Vivid, familiar verbs make the compressed agricultural poetry easier to understand.
- pob_phrase: his renown will be like the wine of Lebanon
  simplified_phrase: His fame will be like Lebanon’s wine
  preserved_meaning: His favorable reputation is compared with the wine of Lebanon.
  reasoning_layer_used: Lexical decisions on זִכְרוֹ and כְּיֵין לְבָנוֹן
  rationale: “Fame” is plainer than “renown,” and the direct wine comparison remains unexpanded.
interpretive_expansions:
- pob_phrase: in his shade
  rendering: in the safety of his shade
  claim: The shade represents protection and blessing rather than only relief from sunlight.
  evidence:
  - The lexical rationale says the shade conveys protection and blessing.
  - The restoration context portrays flourishing among those sheltered by him.
  confidence: high
  alternatives_preserved:
  - The concrete shade image remains in the text.
