translation:
  language: en
  text: Assyria will not save us. We will not ride warhorses, and we will no longer call what our own hands have made “Our God.” In you, the fatherless find mercy.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the orphan.” The Hebrew literally refers to someone without a father and can also suggest a vulnerable person.
    reason: lexical_alternative
  - marker: b
    text: The last sentence may also be translated, “For in you the fatherless find mercy.”
    reason: alternative_reading
