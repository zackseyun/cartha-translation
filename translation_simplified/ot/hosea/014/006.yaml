translation:
  language: en
  text: I will be like dew for Israel.[a] He will blossom like a lily, and he will drive his roots down like Lebanon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Israel is pictured here as one person, so the verse uses “he” and “his.”
    reason: simplification_note
  - marker: b
    text: Lebanon suggests firm, majestic growth, probably because of its famous deep-rooted trees; the Hebrew does not specifically mention cedars.
    reason: cultural_note
