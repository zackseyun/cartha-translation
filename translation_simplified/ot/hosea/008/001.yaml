translation:
  language: en
  text: Put the trumpet to your lips and sound the alarm! Danger looms like an eagle[a] over the house of Yahweh.[b] This is because they have broken my covenant and rebelled against my law.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “like a vulture”; the Hebrew can refer to a large bird of prey.
    reason: lexical_alternative
  - marker: b
    text: “The house of Yahweh” may refer to the sanctuary, the land, or Yahweh’s covenant people.
    reason: source_note
  - marker: c
    text: Or “my instruction” or “my teaching.”
    reason: lexical_alternative
