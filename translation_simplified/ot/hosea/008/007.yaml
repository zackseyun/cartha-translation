translation:
  language: en
  text: For they sow the wind, and they will harvest a whirlwind. Their grain has no heads and will produce no flour. Even if it yields something,[a] foreigners will swallow it up.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Perhaps it may yield, but foreigners will swallow it up.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: they will reap the whirlwind
  simplified_phrase: they will harvest a whirlwind
  preserved_meaning: Their actions will bring far more destructive consequences.
  reasoning_layer_used: Lexical decision for סוּפָה and the agricultural judgment metaphor
  rationale: “Harvest” is more familiar than “reap” while preserving the sowing-and-gathering image.
- pob_phrase: The standing grain has no head; it will yield no flour
  simplified_phrase: Their grain has no heads and will produce no flour
  preserved_meaning: The crop fails to develop usable grain for food.
  reasoning_layer_used: Lexical decisions for קָמָה, צֶמַח, and the flour clause
  rationale: The simpler wording makes the failed crop clear without explaining the metaphor.
- pob_phrase: strangers will swallow it up
  simplified_phrase: foreigners will swallow it up
  preserved_meaning: Outsiders rather than Israel will consume any produce.
  reasoning_layer_used: Lexical decisions for זָרִים and בלע
  rationale: “Foreigners” identifies the outsiders clearly while retaining the vivid image of swallowing.
translation_notes:
  risk_flags:
  - risk: “Harvest” may sound less severe than the traditional “reap.”
    mitigation: The destructive “whirlwind” and sowing-harvesting contrast retain the judgment’s force.
