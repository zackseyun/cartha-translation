- pob_phrase: For Israel has forgotten his Maker and built palaces, and Judah has multiplied fortified cities
  simplified_phrase: Israel has forgotten his Maker and built palaces. Judah has built more and more fortified cities.
  preserved_meaning: Israel forgot the one who made him, while Judah deliberately increased its military defenses.
  reasoning_layer_used: POB lexical decisions and clause structure
  rationale: Two shorter sentences clarify the distinct charges against Israel and Judah.
- pob_phrase: has multiplied fortified cities
  simplified_phrase: has built more and more fortified cities
  preserved_meaning: Judah caused the number of its defended cities to increase.
  reasoning_layer_used: Lexical decision for הִרְבָּה
  rationale: “More and more” expresses deliberate expansion in common English.
- pob_phrase: it will consume her citadels
  simplified_phrase: it will destroy their citadels
  preserved_meaning: The fire will devastate the strongholds belonging to the cities.
  reasoning_layer_used: Lexical decision for אַרְמְנֹתֶיהָ and theological pronoun analysis
  rationale: “Destroy” is clearer than “consume,” and “their” naturally refers to the cities.
