translation:
  language: en
  text: Israel has forgotten his Maker and built palaces.[a] Judah has built more and more fortified cities. So I will send fire into Judah’s cities, and it will destroy their citadels.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “temples.” The Hebrew word can mean either palaces or temple-like buildings.
    reason: lexical_alternative
