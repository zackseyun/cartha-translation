translation:
  language: en
  text: Even though they pay to gain allies among the nations,[a] I will now gather them. They will begin to dwindle under the burden of the king who rules over princes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may read more literally, “they give among the nations,” but here it likely refers to paying foreign nations for alliances.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew clause is difficult; it may instead mean that they will writhe briefly or become few because of the burden, perhaps an imperial tribute.
    reason: alternative_reading
