translation:
  language: en
  text: For I desire faithful love[a] more than sacrifice. I want you to know God rather than bring offerings that are burned completely on the altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Faithful love” includes mercy and loyal commitment to God’s covenant.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: steadfast love
  simplified_phrase: faithful love
  preserved_meaning: Love expressed through enduring loyalty and mercy.
  reasoning_layer_used: POB lexical decision for חֶסֶד
  rationale: “Faithful love” states the constancy of this love in more familiar English.
- pob_phrase: the knowledge of God
  simplified_phrase: I want you to know God
  preserved_meaning: Relational and covenantal knowledge of God, not merely information about him.
  reasoning_layer_used: POB lexical rationale for דַעַת אֱלֹהִים
  rationale: The verbal form makes the relational meaning immediately understandable.
- pob_phrase: burnt offerings
  simplified_phrase: offerings that are burned completely on the altar
  preserved_meaning: Sacrifices wholly consumed by fire on the altar.
  reasoning_layer_used: POB lexical decision for עֹלוֹת
  rationale: The description explains an unfamiliar ritual term while preserving its concrete image.
interpretive_expansions:
- pob_phrase: not sacrifice
  rendering: more than sacrifice
  claim: God gives faithful covenant love priority over ritual sacrifice rather than abolishing all sacrifice.
  evidence:
  - The POB theological decision identifies the contrast as comparative preference, not absolute rejection.
  - The parallel Hebrew construction with מֵעֹלוֹת expresses preference for knowing God over burnt offerings.
  confidence: high
  alternatives_preserved:
