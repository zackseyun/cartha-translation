translation:
  language: en
  text: After two days,[a] he will give us life again. On the third day,[b] he will raise us up,[c] so we may live in his presence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “within two days”; the Hebrew points to a short time leading to the third day.
    reason: lexical_alternative
  - marker: b
    text: Many Christians see the words “third day” as anticipating the Messiah’s resurrection, though this verse directly speaks about the people’s restoration.
    reason: cross_reference
  - marker: c
    text: “Raise us up” can also mean “restore us” or “set us back on our feet.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: He will revive us
  simplified_phrase: he will give us life again
  preserved_meaning: God causes the people to live again after their deathlike condition.
  reasoning_layer_used: Lexical decision for יְחַיֵּנוּ and the corporate restoration context.
  rationale: This replaces the biblical term “revive” with direct common English while retaining its life-giving force.
- pob_phrase: that we may live before him
  simplified_phrase: so we may live in his presence
  preserved_meaning: Their restored life will be lived before God and in relationship with him.
  reasoning_layer_used: Lexical decision for וְנִחְיֶה לְפָנָיו.
  rationale: The new wording makes the purpose and relational sense immediately clear.
interpretive_expansions:
- pob_phrase: before him
  rendering: in his presence
  claim: The phrase describes living in God's presence rather than merely living where he can observe them.
  evidence:
  - The POB lexical rationale identifies “in his presence” as an alternative that captures the relational nuance.
  confidence: high
  alternatives_preserved:
  - before him
translation_notes:
  risk_flags:
  - risk: “Give us life again” could be read only as bodily resurrection.
    mitigation: The corporate plural and the note on “raise us up” preserve the immediate sense of the people's restoration.
  - risk: The third-day wording may be made into a direct messianic prediction.
    mitigation: The main text retains the corporate “us,” while the footnote presents the Christian reading only as typology.
