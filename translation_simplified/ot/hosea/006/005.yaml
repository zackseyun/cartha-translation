translation:
  language: en
  text: So I cut them down through the prophets. I killed them with the words of my mouth, and your judgments[a] come out as clearly as light.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Your judgments” may mean the judgment or case concerning Israel. Some understand the line as “my judgment goes out like light.”
