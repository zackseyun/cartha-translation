simplification_decisions:
- pob_phrase: Therefore I have hewn them by the prophets
  simplified_phrase: So I cut them down through the prophets
  preserved_meaning: God uses the prophets to cut down the people forcefully.
  reasoning_layer_used: Lexical decisions for חָצַבְתִּי and instrumental בַּנְּבִיאִים
  rationale: “Cut them down” preserves the cutting image without the uncommon word “hewn.”
- pob_phrase: I have slain them by the words of my mouth
  simplified_phrase: I killed them with the words of my mouth
  preserved_meaning: God’s spoken words bring severe judgment through the prophets.
  reasoning_layer_used: Lexical decisions for הֲרַגְתִּים and בְּאִמְרֵי פִי
  rationale: “Killed” is common English, while “words of my mouth” keeps the concrete speech image without added emphasis.
- pob_phrase: go forth like light
  simplified_phrase: come out as clearly as light
  preserved_meaning: The judgments emerge openly with the clarity of light.
  reasoning_layer_used: Lexical rationale for אוֹר and יֵצֵא
  rationale: The wording clarifies the comparison while retaining emergence and the image of light.
