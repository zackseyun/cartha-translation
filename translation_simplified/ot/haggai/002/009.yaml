translation:
  language: en
  text: Yahweh of Armies says, “This house will have greater glory in days to come than it had before. In this place I will give peace.[a]” This is what Yahweh of Armies declares.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Peace” can also mean well-being or wholeness.
    reason: lexical_alternative
