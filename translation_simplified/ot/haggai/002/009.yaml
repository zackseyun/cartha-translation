- pob_phrase: The latter glory of this house will be greater than the former
  simplified_phrase: This house will have greater glory in days to come than it had before
  preserved_meaning: The house’s later glory is compared with its earlier glory without defining the fulfillment.
  reasoning_layer_used: Lexical and theological decisions on “latter glory” and “this house”
  rationale: The recast sentence makes the time contrast natural while preserving its documented ambiguity.
- pob_phrase: says Yahweh of Armies; and in this place I will give peace
  simplified_phrase: Yahweh of Armies says … In this place I will give peace
  preserved_meaning: Yahweh promises peace in this place under his authoritative divine title.
  reasoning_layer_used: Lexical decisions for the divine name, title, place, and peace
  rationale: Direct speech and shorter sentences make the promise easier to follow without weakening it.
interpretive_expansions:
