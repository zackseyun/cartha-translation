translation:
  language: en
  text: Then Haggai asked, “If someone who became ritually unclean by touching a dead body touches any of these things, does the thing touched also become ritually unclean?” The priests answered, “Yes, it becomes ritually unclean.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: one who is unclean by contact with a dead body
  simplified_phrase: someone who became ritually unclean by touching a dead body
  preserved_meaning: The person has ritual impurity caused by corpse contact, not moral guilt.
  reasoning_layer_used: POB lexical and theological decisions on טְמֵא נֶפֶשׁ
  rationale: “Ritually” prevents readers from mistaking this condition for moral guilt.
- pob_phrase: does it become unclean?
  simplified_phrase: does the thing touched also become ritually unclean?
  preserved_meaning: Impurity passes to whichever individual item the person touches.
  reasoning_layer_used: POB lexical decisions on בְּכָל אֵלֶּה and הֲיִטְמָא
  rationale: Naming “the thing touched” preserves the distributive singular meaning.
- pob_phrase: the priests answered and said, “It becomes unclean.”
  simplified_phrase: The priests answered, “Yes, it becomes ritually unclean.”
  preserved_meaning: The priests affirm that the touched item acquires ritual impurity.
  reasoning_layer_used: POB lexical decisions on וַיַּעֲנוּ, וַיֹּאמְרוּ, and יִטְמָא
  rationale: Natural English omits the repeated speech verb and makes the affirmative reply explicit.
interpretive_expansions:
