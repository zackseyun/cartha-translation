translation:
  language: en
  text: But now, Zerubbabel, be strong! Yahweh declares this. Joshua son of Jehozadak, the high priest, be strong! All you people of the land, be strong! Yahweh declares this. Work, because I am with you! Yahweh of Armies declares this.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally, “Yahweh of hosts.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: be strong, Zerubbabel, declares Yahweh
  simplified_phrase: Zerubbabel, be strong! Yahweh declares this.
  preserved_meaning: Yahweh directly commands Zerubbabel to have strength and courage.
  reasoning_layer_used: Lexical decision for חֲזַק and the prophetic formula נְאֻם יְהוָה.
  rationale: Two short sentences make the command and divine declaration immediately clear.
- pob_phrase: and be strong ... and be strong
  simplified_phrase: Joshua ... be strong! All you people of the land, be strong!
  preserved_meaning: The repeated command addresses Joshua and the whole local community separately.
  reasoning_layer_used: Lexical decisions for חֲזַק and כָּל עַם הָאָרֶץ.
  rationale: Direct address preserves the forceful repetition while removing the long chain of clauses.
- pob_phrase: and work, for I am with you
  simplified_phrase: Work, because I am with you!
  preserved_meaning: Yahweh’s presence is the reason the people should act and continue the rebuilding work.
  reasoning_layer_used: Lexical decisions for וַעֲשׂוּ and כִּי אֲנִי אִתְּכֶם.
  rationale: Because states the command’s basis more plainly than for without adding commentary.
translation_notes:
  risk_flags:
  - risk: Breaking the verse into short declarations may lessen the momentum of the original linked clauses.
    mitigation: The repeated commands and prophetic formulas remain in their original sequence.
  - risk: “People of the land” may sound broader or more technical than intended.
    mitigation: The wording is retained because the POB identifies it as the local post-exilic community without reducing it to merely everyone.
