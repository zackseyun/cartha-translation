translation:
  language: en
  text: Then Haggai answered, “This people[a] and this nation are unclean in my sight,” declares Yahweh. “Everything they do is unclean, and what they offer there is unclean.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The expression “this people” sounds distancing and reproachful.
    reason: cultural_note
simplification_decisions:
- pob_phrase: So is this people, and so is this nation before me
  simplified_phrase: This people and this nation are unclean in my sight
  preserved_meaning: The community bears the uncleanness demonstrated by the preceding priestly illustration.
  reasoning_layer_used: Immediate context and lexical decisions for כֵּן, הָעָם הַזֶּה, הַגּוֹי הַזֶּה, and לְפָנַי
  rationale: The wording states the comparison’s clear verdict while retaining the corporate rebuke and God’s judgment.
- pob_phrase: every work of their hands
  simplified_phrase: Everything they do
  preserved_meaning: The judgment applies broadly to their actions.
  reasoning_layer_used: Lexical decision for כָּל מַעֲשֵׂה יְדֵיהֶם
  rationale: Common English preserves the full scope without the less direct hand idiom.
- pob_phrase: what they offer there is unclean
  simplified_phrase: what they offer there is unclean
  preserved_meaning: Their offerings at the stated place are ritually unclean.
  reasoning_layer_used: Lexical decisions for וַאֲשֶׁר יַקְרִיבוּ, שָׁם, and טָמֵא הוּא
  rationale: The clear POB wording already preserves the distinct verdict on their offerings.
interpretive_expansions:
- pob_phrase: So is this people, and so is this nation before me ... and so is every work of their hands
  rendering: This people and this nation are unclean in my sight ... Everything they do is unclean
  claim: The repeated comparison identifies the community and its work as unclean.
  evidence:
  - Haggai 2:11–13 makes uncleanness the outcome of the priestly illustration.
  - The repeated כֵּן applies that illustration to the people, nation, and their work.
  - The verse explicitly calls what they offer unclean.
  confidence: high
  alternatives_preserved:
  - The more implicit wording “are like that” remains lexically possible.
translation_notes:
  risk_flags:
  - risk: Stating “unclean” replaces the Hebrew verse’s repeated comparison with its contextual result.
    mitigation: The preceding illustration and the verse’s final clause explicitly establish uncleanness as that result.
