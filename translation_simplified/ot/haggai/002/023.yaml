translation:
  language: en
  text: “On that day,” declares Yahweh of Armies,[a] “I will take you, my servant Zerubbabel son of Shealtiel,” declares Yahweh. “I will make you like a signet ring,[b] because I have chosen you,” declares Yahweh of Armies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally, “the LORD of Hosts.”
    reason: lexical_alternative
  - marker: b
    text: A signet ring represented its owner’s authority and confirmed that something was genuine; compare Jeremiah 22:24.
    reason: cross_reference
simplification_decisions:
- pob_phrase: Zerubbabel son of Shealtiel, my servant
  simplified_phrase: my servant Zerubbabel son of Shealtiel
  preserved_meaning: Zerubbabel remains identified as Yahweh’s commissioned servant.
  reasoning_layer_used: lexical decision for עַבְדִּי
  rationale: Moving “my servant” before the name makes the relationship immediately clear.
- pob_phrase: for I have chosen you
  simplified_phrase: because I have chosen you
  preserved_meaning: Yahweh’s choice remains the reason for the signet-ring promise.
  reasoning_layer_used: lexical decision for כִּי בְךָ בָחַרְתִּי
  rationale: “Because” states the causal link more plainly than “for.”
- pob_phrase: one continuous sentence
  simplified_phrase: three quoted statements
  preserved_meaning: The promise and all three solemn declaration formulas remain intact.
  reasoning_layer_used: source syntax and repeated prophetic formula
  rationale: Shorter statements make the verse easier to follow without weakening its solemn repetition.
translation_notes:
  risk_flags:
  - risk: Modern readers may not understand the signet-ring image.
    mitigation: The metaphor remains in the text, and the footnote briefly explains its authority and authentication imagery.
  - risk: Reordering “my servant” could sound like a new appointment.
    mitigation: The wording keeps it as Zerubbabel’s title and does not say Yahweh makes him a servant.
