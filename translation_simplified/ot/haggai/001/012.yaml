translation:
  language: en
  text: Then Zerubbabel son of Shealtiel, Joshua son of Jehozadak the high priest, and all the remnant of the people listened to the voice of Yahweh their God. They also listened to the words of Haggai the prophet, whom Yahweh their God had sent.[b] And the people feared Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “stood in awe before Yahweh”; the expression can include both reverent awe and fear.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also mean that they listened because Yahweh their God had sent Haggai.
    reason: alternative_reading
