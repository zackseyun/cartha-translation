translation:
  language: en
  text: 'This is what Yahweh of hosts[a] says: “These people[b] say, ‘The time has not yet come—the time for Yahweh’s house to be rebuilt.’”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hosts” refers broadly to heavenly and earthly armies.
    reason: simplification_note
  - marker: b
    text: More literally, “This people”; the Hebrew may express distance or rebuke.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew can also be translated “to be built,” but the setting concerns rebuilding after the exile.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Thus says Yahweh of hosts
  simplified_phrase: This is what Yahweh of hosts says
  preserved_meaning: This still introduces Yahweh’s authoritative prophetic message and retains his name and title.
  reasoning_layer_used: POB lexical and theological decisions for כֹּה, אָמַר, יְהוָה, and צְבָאוֹת
  rationale: The common formula is clearer than “Thus says” without weakening its authority.
- pob_phrase: The time has not come, the time
  simplified_phrase: The time has not yet come—the time
  preserved_meaning: Repeating “time” preserves the emphasis of the people’s claim.
  reasoning_layer_used: POB lexical decision for לֹא עֶת בֹּא עֶת
  rationale: “Yet” and the dash make the emphatic repetition natural in modern English.
- pob_phrase: the house of Yahweh to be rebuilt
  simplified_phrase: for Yahweh’s house to be rebuilt
  preserved_meaning: The house remains Yahweh’s, the work is restoration, and no builder is named.
  reasoning_layer_used: POB lexical and theological decisions for בֵּית יְהוָה and לְהִבָּנוֹת
  rationale: The possessive is more natural while the passive preserves the source’s focus.
translation_notes:
