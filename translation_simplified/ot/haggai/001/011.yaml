translation:
  language: en
  text: I called for a drought to strike the land and the mountains. It would strike the grain, the new wine, the fresh olive oil, and everything the ground produces. It would also strike people and animals, and all the work of their hands.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And I called for a drought on the land and on the mountains
  simplified_phrase: I called for a drought to strike the land and the mountains.
  preserved_meaning: God summoned the drought against the local land, including its mountains.
  reasoning_layer_used: Lexical decisions for וָאֶקְרָא, חֹרֶב, and הָאָרֶץ
  rationale: The active wording clearly shows both divine agency and the drought’s targets.
- pob_phrase: on the grain, on the new wine, on the fresh oil, on what the ground produces
  simplified_phrase: It would strike the grain, the new wine, the fresh olive oil, and everything the ground produces.
  preserved_meaning: The drought affects the named crops and the ground’s entire yield.
  reasoning_layer_used: Lexical decisions for the agricultural terms and summary clause
  rationale: The new sentence preserves the full list without implying that the summary excludes the named crops.
- pob_phrase: on man and on beast, and on all the labor of the hands
  simplified_phrase: It would also strike people and animals, and all the work of their hands.
  preserved_meaning: The judgment reaches human beings, animals, and human work and its results.
  reasoning_layer_used: Lexical and theological decisions for הָאָדָם, הַבְּהֵמָה, and כָּל יְגִיעַ כַּפָּיִם
