  preserved_meaning: God caused even the gathered produce to disappear under judgment.
  reasoning_layer_used: Lexical decision for וְנָפַחְתִּי בוֹ
  rationale: The concrete image of God blowing the produce away remains intact.
- pob_phrase: while each of you runs to his own house
