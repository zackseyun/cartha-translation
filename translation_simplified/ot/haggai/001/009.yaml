  preserved_meaning: They hoped for abundant produce but received little.
  reasoning_layer_used: Lexical rationale and agricultural context
  rationale: This expresses the disappointed harvest expectation in ordinary English without intensifying “little.”
- pob_phrase: and when you brought it home, I blew it away
