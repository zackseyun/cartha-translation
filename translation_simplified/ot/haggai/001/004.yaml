simplification_decisions:
- pob_phrase: Is it a time for you yourselves
  simplified_phrase: Is this the time for you
  preserved_meaning: The question challenges whether this is the proper time, echoing the people’s claim in verse 2.
  reasoning_layer_used: lexical decision for הַעֵת and immediate context
  rationale: “Is this the time” is more natural while preserving the pointed question about timing.
- pob_phrase: your paneled houses
  simplified_phrase: your own paneled houses
  preserved_meaning: The wording emphasizes the people themselves and contrasts their finished houses with the ruined temple.
  reasoning_layer_used: lexical decisions for לָכֶם אַתֶּם and סְפוּנִים
  rationale: “Own” carries the Hebrew emphasis without the awkward phrase “you yourselves.”
