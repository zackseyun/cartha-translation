translation:
  language: en
  text: His servants said to him, “Listen, we have heard that the kings of Israel are merciful. Let us wear rough sackcloth around our waists and ropes on our heads, and then go to the king of Israel. Perhaps he will spare your life.”
  philosophy: optimal-equivalence
