translation:
  language: en
  text: “No. About this time tomorrow, I will send my servants to you. They will search your house and the houses of your servants. They will seize everything you treasure[a] and carry it away.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “everything desirable in your eyes”; the Hebrew then pictures them putting it into their hands and taking it.
    reason: source_note
