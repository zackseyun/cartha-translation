translation:
  language: en
  text: So he called together the young men attached to the provincial commanders and organized them for battle. There were 232 of them. After that, he called together all the people—all 7,000 sons of Israel—and organized them for battle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sons of Israel” is the Hebrew familial expression for the Israelites.
    reason: lexical_alternative
