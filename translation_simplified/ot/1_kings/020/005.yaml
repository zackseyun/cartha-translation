translation:
  language: en
  text: 'The messengers returned and said, “This is what Ben-hadad says: ‘Although[a] I sent you a demand to give me your silver and gold, your wives, and your sons—’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “For I sent you a demand.” The Hebrew can be understood in several ways; “although” anticipates the stronger demand in the next verse.
    reason: lexical_alternative
