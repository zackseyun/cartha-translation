  rationale: The common English formula is clearer while retaining the formal announcement.
- pob_phrase: I sent to you, saying, “You shall give me”
  simplified_phrase: I sent you a demand to give me
  preserved_meaning: Ben-hadad had sent an obligatory demand for Ahab’s people and valuables.
  reasoning_layer_used: Lexical decisions for שָׁלַחְתִּי אֵלֶיךָ, לֵאמֹר, and לִי תִתֵּן
  rationale: This removes nested quotation while preserving the force and recipient of the demand.
- pob_phrase: your silver and your gold and your wives and your sons
