  text: Speaking at Yahweh’s command, a man from a group of prophets[a] said to his companion, “Please strike me.” But his companion refused.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “sons of the prophets,” an expression for a prophetic group; it may refer to their company or disciples.
    reason: cultural_note
