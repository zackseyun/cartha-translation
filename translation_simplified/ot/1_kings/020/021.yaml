translation:
  language: en
  text: Then the king of Israel went out and attacked the horses and chariots. He dealt Aram a heavy blow.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Aram” may mean the kingdom or its forces; some English versions call it “Syria.”
