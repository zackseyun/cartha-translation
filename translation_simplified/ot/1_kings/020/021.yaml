simplification_decisions:
- pob_phrase: struck the horses and the chariots
  simplified_phrase: attacked the horses and chariots
  preserved_meaning: The king took military action against Aram’s horses and chariot force.
  reasoning_layer_used: Lexical decision for וַיַּךְ and collective senses of הַסּוּס and הָרָכֶב.
  rationale: “Attacked” states the military action in direct modern English without claiming total defeat.
- pob_phrase: inflicted a great blow on Aram
  simplified_phrase: dealt Aram a heavy blow
  preserved_meaning: Aram suffered a major military setback without specifying casualties.
  reasoning_layer_used: Lexical decisions for בַאֲרָם and מַכָּה גְדוֹלָה.
  rationale: “Heavy blow” keeps the source metaphor while making the idiom natural.
- pob_phrase: went out and struck ... and inflicted
  simplified_phrase: went out and attacked ... He dealt
  preserved_meaning: The actions remain sequential and belong to the king of Israel.
  reasoning_layer_used: POB narrative syntax and optimal-equivalence philosophy.
  rationale: Two sentences make the sequence easier to follow.
translation_notes:
  risk_flags:
  - risk: “Attacked” is less physically concrete than “struck.”
    mitigation: The military objects and retained “heavy blow” image preserve the force of the action.
