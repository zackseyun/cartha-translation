translation:
  language: en
  text: Then the prophet approached the king of Israel and said, “Go and strengthen yourself. Understand the situation, and consider what you should do. When the year turns, the king of Aram[a] will march against you.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aram is traditionally called Syria in many translations.
    reason: alternative_reading
