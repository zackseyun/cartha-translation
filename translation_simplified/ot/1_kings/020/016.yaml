translation:
  language: en
  text: They went out at noon. Meanwhile, Ben-hadad was drinking himself drunk in shelters. The thirty-two kings who were helping him were there with him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “booths”; it can also mean “shelters” or “pavilions.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: They went out at noon, while
  simplified_phrase: They went out at noon. Meanwhile,
  preserved_meaning: Their military movement occurred while Ben-hadad was drinking.
  reasoning_layer_used: The lexical decision treats the second clause as a simultaneous circumstance.
  rationale: Two sentences make the timing easier to follow.
- pob_phrase: in the booths
  simplified_phrase: in shelters
  preserved_meaning: Ben-hadad was inside booth-like shelters.
  reasoning_layer_used: The lexical alternatives include “shelters,” while the footnote retains the concrete Hebrew term.
  rationale: “Shelters” avoids the modern commercial sense of “booths.”
- pob_phrase: he and the thirty-two kings who were helping him
  simplified_phrase: The thirty-two kings who were helping him were there with him
  preserved_meaning: The allied kings were present with Ben-hadad without being made subjects of his drinking.
  reasoning_layer_used: The source grammar makes Ben-hadad the singular subject of the drinking predicate.
  rationale: A separate sentence clarifies who was present while preserving the singular subject.
translation_notes:
  risk_flags:
  - risk: Splitting the verse may make the kings’ presence sound slightly less closely tied to the shelters.
    mitigation: “There with him” keeps them in Ben-hadad’s stated setting.
