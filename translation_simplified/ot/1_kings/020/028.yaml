translation:
  language: en
  text: 'Then the man of God approached the king of Israel and said, “This is what Yahweh says: ‘Because Aram[a] has said, “Yahweh is a god of the mountains, but not a god of the valleys,” I will put this whole vast army into your hand. Then you will know[b] that I am Yahweh.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aram is traditionally called Syria in some English versions.
    reason: alternative_reading
  - marker: b
    text: The “you” is plural, extending this statement beyond the king to Israel collectively.
    reason: lexical_alternative
