translation:
  language: en
  text: Those who survived fled to Aphek and went into the city. Then the wall collapsed on twenty-seven thousand of the men who remained. Ben-hadad also fled into the city and entered an inner room.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says “a room within a room,” meaning an inner or innermost room.
    reason: lexical_alternative
