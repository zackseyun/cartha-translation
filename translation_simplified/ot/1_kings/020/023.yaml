translation:
  language: en
  text: The king of Aram’s servants said to him,[a] “Their gods are gods of the hills. That is why they were stronger than we were. But if we fight them on level ground, we will certainly be stronger than they are.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Their God is a god of the hills.” The Hebrew uses plural forms because the Arameans spoke about Israel’s God in a pagan way.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the servants of the king of Aram
  simplified_phrase: the king of Aram’s servants
  preserved_meaning: The speakers remain the Aramean king’s servants rather than specifically identified officials.
  reasoning_layer_used: POB lexical decision for עַבְדֵי
  rationale: The possessive form is easier to read while retaining the chosen term “servants.”
- pob_phrase: if we fight against them on the plain
  simplified_phrase: if we fight them on level ground
  preserved_meaning: They propose fighting in flat terrain rather than in the hills.
  reasoning_layer_used: POB lexical decision for בַּמִּישׁוֹר
  rationale: “Level ground” makes the terrain contrast immediately clear.
- pob_phrase: surely we will be stronger than they are
  simplified_phrase: we will certainly be stronger than they are
  preserved_meaning: The servants confidently predict greater strength without changing the comparison into victory.
  reasoning_layer_used: POB lexical decisions for אִם לֹא and נֶחֱזַק מֵהֶם
  rationale: “Certainly” expresses their confidence in familiar modern English.
