translation:
  language: en
  text: 'Ahab asked, “Who will do this?” The prophet replied, “This is what Yahweh says: ‘The young men[a] who serve the provincial officials will do it.’” Ahab asked, “Who will start the battle?” The prophet answered, “You will.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term can also mean attendants or servants of the provincial officials.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And Ahab said, “By whom?”
  simplified_phrase: Ahab asked, “Who will do this?”
  preserved_meaning: Ahab asks who will carry out Yahweh’s promised action.
  reasoning_layer_used: Lexical decision for בְּמִי and the preceding context
  rationale: The full question is clearer in ordinary English than the elliptical “By whom?”
- pob_phrase: Thus says Yahweh
  simplified_phrase: This is what Yahweh says
  preserved_meaning: The words remain Yahweh’s authoritative message.
  reasoning_layer_used: Prophetic-formula lexical decision and divine-name doctrine
  rationale: The wording is modernized while retaining Yahweh’s personal name and the formal announcement.
- pob_phrase: Who will begin the battle? … You.
  simplified_phrase: Who will start the battle? … You will.
  preserved_meaning: Ahab himself is emphatically assigned to initiate the fighting.
  reasoning_layer_used: Lexical decisions for מִי יֶאְסֹר הַמִּלְחָמָה and אָתָּה
  rationale: “Start” and “You will” express the idiom and direct answer naturally.
