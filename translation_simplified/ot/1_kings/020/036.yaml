translation:
  language: en
  text: 'Then he said, “Because you did not obey what the LORD said, look: when you leave me, a lion will strike you down.” After the man left, a lion found him and struck him down.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: have not listened to the voice of the LORD
  simplified_phrase: did not obey what the LORD said
  preserved_meaning: The man failed to heed the LORD’s command.
  reasoning_layer_used: POB translation and Hebrew source idiom
  rationale: The wording makes the idiom clear while retaining the LORD as the speaker.
- pob_phrase: when you depart from me
  simplified_phrase: when you leave me
  preserved_meaning: The judgment would occur after the man went away from the prophet.
  reasoning_layer_used: POB translation
  rationale: “Leave me” is the ordinary modern equivalent of “depart from me.”
- pob_phrase: when he departed from him
  simplified_phrase: After the man left
  preserved_meaning: The threatened event followed the man’s departure.
  reasoning_layer_used: Immediate narrative context
  rationale: Naming the man removes a confusing chain of pronouns without changing the event.
interpretive_expansions:
- pob_phrase: have not listened to the voice of the LORD
  rendering: did not obey what the LORD said
  claim: Listening here means responding obediently to the LORD’s command.
  evidence:
  - The stated punishment follows the man’s refusal to carry out the prophetic command in the immediate context.
  - The POB retains the LORD’s voice as the command the man failed to heed.
  confidence: high
  alternatives_preserved:
  - did not listen to the LORD’s voice
  - did not heed what the LORD said
translation_notes:
  risk_flags:
