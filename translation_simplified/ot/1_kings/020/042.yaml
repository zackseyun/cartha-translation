translation:
  language: en
  text: 'Then he said to him, “This is what Yahweh says: ‘You released from your custody the man I had set apart for destruction.[a] Therefore, your life will be taken in place of his life, and your people in place of his people.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew refers to someone placed under divine judgment and devoted to destruction.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Thus says Yahweh
  simplified_phrase: This is what Yahweh says
  preserved_meaning: The prophetic formula identifies the message as Yahweh’s authoritative declaration.
  reasoning_layer_used: POB lexical decision for כֹּה אָמַר
  rationale: The modern formula communicates the same authority more plainly.
- pob_phrase: let go from your hand
  simplified_phrase: released from your custody
  preserved_meaning: The king freed a captured enemy who was under his control.
  reasoning_layer_used: POB lexical rationales for שִׁלַּחְתָּ and מִיָּד
  rationale: “Custody” clearly expresses the contextual meaning of the Hebrew hand image.
- pob_phrase: the man I had devoted to destruction
  simplified_phrase: the man I had set apart for destruction
  preserved_meaning: Yahweh had designated the man for destruction under divine judgment.
  reasoning_layer_used: POB lexical and theological decisions for אִישׁ חֶרְמִי
  rationale: “Set apart for destruction” explains the difficult devotion language while retaining its judgment force.
interpretive_expansions:
- pob_phrase: your life shall be for his life
  rendering: your life will be taken in place of his life
  claim: The judgment means that the king will lose his life instead of the man he released.
  evidence:
  - The POB rationale identifies תַּחַת as substitution within a judgment oracle.
  - The parallel clause extends the same substitution pattern to the two peoples.
  confidence: high
  alternatives_preserved:
  - your life in place of his life
  - your life instead of his life
translation_notes:
  risk_flags:
  - risk: “Set apart” can sound positive when separated from its context.
    mitigation: “For destruction” and the footnote make the divine-judgment sense explicit.
  - risk: The final people-for-people clause remains elliptical in English.
    mitigation: Its parallel with the explicit taking of the king’s life preserves the judgment sense without adding an unsupported manner of death.
