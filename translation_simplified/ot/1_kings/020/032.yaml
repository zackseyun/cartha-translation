translation:
  language: en
  text: So they wrapped rough sackcloth around their waists and put ropes on their heads to show their submission. They went to the king of Israel and said, “Your servant Ben-hadad says, ‘Please let me live.’” The king asked, “Is he still alive? He is my brother.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “brother” probably expresses political or covenantal fraternity, not a literal family relationship.
    reason: cultural_note
