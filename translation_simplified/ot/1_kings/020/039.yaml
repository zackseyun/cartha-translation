translation:
  language: en
  text: 'As the king was passing by, the man cried out to him: “I, your servant, went into the thick of the battle. Then a man turned aside and brought another man to me. He said, ‘Guard this man. If he goes missing at all, you will pay with your life for his, or you must weigh out a very large amount of silver.’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew specifies one talent of silver, a large unit of weight.
    reason: simplification_note
