translation:
  language: en
  text: The men were listening closely for a favorable omen[a] in Ahab’s words. They quickly seized on what he had said and replied, “Ben-hadad is your brother!” Ahab said, “Go and bring him.” Ben-hadad came out to Ahab, and Ahab had him get into the chariot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean that they were seeking or taking something as an omen; here they were alert for a favorable cue in Ahab’s words.
    reason: lexical_alternative
