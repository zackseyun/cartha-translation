  text: Hasn’t it been told to you, my lord, what I did while Jezebel was killing Yahweh’s prophets? I hid one hundred of Yahweh’s prophets in caves, in groups of fifty[a], and supplied them with bread and water.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew describes groups of fifty, but the exact cave arrangement is uncertain; it may also be translated “fifty men to a cave” or “fifty men each in a cave.”
    reason: lexical_alternative
