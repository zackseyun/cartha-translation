translation:
  language: en
  text: Now send word and gather all Israel to meet me at Mount Carmel. Also bring the 450 prophets of Baal and the 400 prophets of Asherah,[a] who eat at Jezebel’s table and are supported by her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “Asherah” most likely names the goddess; the Hebrew term can also refer to a cult object associated with her.
    reason: cultural_note
