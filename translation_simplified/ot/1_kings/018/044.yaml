translation:
  language: en
  text: The seventh time, the servant reported, “Look! A small cloud about the size of a man’s palm is rising from the sea.” Elijah told him, “Go up and tell Ahab, ‘Have your chariot harnessed and go down before the rain stops you.’”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And it happened on the seventh time that he said
  simplified_phrase: The seventh time, the servant reported
  preserved_meaning: The servant reports what he sees after looking for the seventh time.
  reasoning_layer_used: Immediate context and POB lexical rationale for בַּשְּׁבִעִית
  rationale: The rewrite removes a heavy narrative opening while retaining the seventh occasion.
- pob_phrase: Harness your chariot
  simplified_phrase: Have your chariot harnessed
  preserved_meaning: Ahab must arrange for his chariot and team to be prepared for travel.
  reasoning_layer_used: POB cultural note and lexical decision for אֱסֹר
  rationale: The wording keeps the concrete harnessing action without implying that the king must do it personally.
- pob_phrase: so that the rain does not stop you
  simplified_phrase: before the rain stops you
  preserved_meaning: Ahab must leave quickly before the coming rain prevents or delays travel.
  reasoning_layer_used: POB lexical rationale for וְלֹא יַעַצָרְכָה הַגָּשֶׁם
  rationale: The shorter wording makes the warning and urgency immediately clear.
