  preserved_meaning: Elijah denies Ahab’s charge and places responsibility on Ahab and his dynasty.
  reasoning_layer_used: Lexical decisions for עכר, כי אם, and בית אביך
  rationale: Two direct sentences clarify the accusation while preserving its force and dynastic scope.
- pob_phrase: because you have forsaken the commandments of Yahweh
  simplified_phrase: because you have abandoned Yahweh’s commandments
  preserved_meaning: Ahab’s rejection of Yahweh’s covenant commands caused Israel’s trouble.
  reasoning_layer_used: Lexical decisions for בעזבכם, מצות, and יהוה
  rationale: “Abandoned” is common English that retains the deliberate rejection expressed by “forsaken.”
