translation:
  language: en
  text: “As surely as Yahweh your God lives, my lord the king has sent people to look for you in every nation and kingdom. Whenever they said, ‘He is not here,’ he made each kingdom and nation swear that they could not find you.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: As Yahweh your God lives
  simplified_phrase: As surely as Yahweh your God lives
  preserved_meaning: This remains a solemn oath invoking the life of Yahweh.
  reasoning_layer_used: Lexical decision for חַי יְהוָה אֱלֹהֶיךָ and theological decision on the divine name
  rationale: “Surely” makes the oath’s emphatic force clear.
- pob_phrase: there is no nation or kingdom where my lord has not sent to seek you
  simplified_phrase: my lord the king has sent people to look for you in every nation and kingdom
  preserved_meaning: Ahab ordered an exhaustive search for Elijah across nations and kingdoms.
  reasoning_layer_used: Lexical decisions for the oath-context אִם clause and שָׁלַח ... לְבַקֶּשְׁךָ
  rationale: The positive “every” construction removes the difficult double negative.
- pob_phrase: When they said ... he made the kingdom and the nation swear
  simplified_phrase: Whenever they said ... he made each kingdom and nation swear
  preserved_meaning: Each political entity searched had to confirm by oath that Elijah was not found.
  reasoning_layer_used: Lexical decisions for וְאָמְרוּ אָיִן, וְהִשְׁבִּיעַ, and the distributive political pair
  rationale: “Each” preserves the distributive force without merging kingdom and nation.
interpretive_expansions:
- pob_phrase: my lord
  rendering: my lord the king
  claim: Obadiah’s respectful title refers to King Ahab.
  evidence:
  - The POB lexical rationale explicitly identifies King Ahab as the referent.
  confidence: high
  alternatives_preserved:
  - The courtly title “my lord” remains in the text.
- pob_phrase: has sent to seek you
  rendering: has sent people to look for you
  claim: The king conducted the search through unspecified human agents.
  evidence:
  - Sending someone to search implies agents, though the Hebrew does not identify them.
  confidence: high
  alternatives_preserved:
  - The agents remain unidentified.
translation_notes:
  risk_flags:
  - risk: “Every nation and kingdom” may sound absolutely global to modern readers.
    mitigation: It preserves Obadiah’s emphatic description without defining geographic limits.
  - risk: “Sent people” makes implied agents explicit.
    mitigation: No particular agents are identified.
