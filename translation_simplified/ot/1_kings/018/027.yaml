translation:
  language: en
  text: At noon Elijah mocked them, saying, “Shout loudly! After all, he is a god. Maybe he is deep in thought, or has stepped away,[a] or is traveling. Perhaps he is asleep and will wake up.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or possibly, “is relieving himself.” The Hebrew expression is probably euphemistic.
    reason: lexical_alternative
