translation:
  language: en
  text: Using the stones, he built an altar in the name of Yahweh. Then he dug a trench around the altar, about the size needed to hold two measures of seed.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebrew: “two seahs of seed.” A seah was an ancient dry measure; the expression describes the trench’s approximate size or capacity.'
    reason: cultural_note
