translation:
  language: en
  text: 'After a long time, during the third year, Yahweh gave Elijah this message: “Go and show yourself to Ahab. I will give rain across the land.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “send rain on the land.” The Hebrew literally says, “give rain upon the face of the land.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And it happened after many days
  simplified_phrase: After a long time
  preserved_meaning: A new episode begins after an extended period.
  reasoning_layer_used: Lexical decision for וַיְהִי and יָמִים רַבִּים
  rationale: The natural time phrase removes a heavy narrative opening without changing the interval.
- pob_phrase: the word of Yahweh came to Elijah ... saying
  simplified_phrase: Yahweh gave Elijah this message
  preserved_meaning: Yahweh directly revealed words to Elijah as a prophet.
  reasoning_layer_used: Prophetic-formula lexical decision and divine-name doctrine
  rationale: The direct wording clarifies the revelation while retaining Yahweh’s personal name.
- pob_phrase: give rain upon the face of the land
  simplified_phrase: give rain across the land
  preserved_meaning: Rain is Yahweh’s gift and will fall over the land affected by drought.
  reasoning_layer_used: Lexical decisions for נתן and עַל פְּנֵי הָאֲדָמָה
  rationale: “Across” keeps the image of rain spreading over the land in ordinary English.
