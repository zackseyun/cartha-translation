translation:
  language: en
  text: “Once I leave you, the Spirit of Yahweh[a] may carry you away to some place I do not know. I will report to Ahab, but if he cannot find you, he will kill me. Yet I, your servant, have feared Yahweh since I was young.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can mean “spirit,” “wind,” or “breath,” though “Spirit” best fits this context.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And when I go away from you
  simplified_phrase: Once I leave you
  preserved_meaning: Obadiah describes what may happen after he departs from Elijah.
  reasoning_layer_used: POB lexical decision for אֵלֵךְ מֵאִתָּךְ
  rationale: “Leave you” expresses the departure more directly in common English.
- pob_phrase: Then when I come and tell Ahab and he does not find you
  simplified_phrase: I will report to Ahab, but if he cannot find you
  preserved_meaning: Obadiah fears the result of reporting Elijah’s location when Elijah may no longer be there.
  reasoning_layer_used: POB lexical decisions and immediate conditional context
  rationale: Two shorter clauses make the feared sequence and condition easier to follow.
- pob_phrase: though your servant has feared Yahweh from my youth
  simplified_phrase: Yet I, your servant, have feared Yahweh since I was young
  preserved_meaning: Obadiah respectfully appeals to his lifelong reverence for Yahweh.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The wording keeps his deferential title while replacing the formal phrase “from my youth.”
