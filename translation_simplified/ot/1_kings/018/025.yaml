translation:
  language: en
  text: Then Elijah said to the prophets of Baal, “You go first, since there are so many of you. Choose one of the bulls and prepare it. Then call on the name of your god, but do not put any fire under it.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Choose one bull for yourselves and prepare it first, because you are many
  simplified_phrase: You go first, since there are so many of you. Choose one of the bulls and prepare it.
  preserved_meaning: Baal’s numerous prophets are allowed to choose and prepare one of the two bulls before Elijah acts.
  reasoning_layer_used: Lexical decisions and immediate context
  rationale: Two short sentences make the sequence and Elijah’s reason easier to follow.
- pob_phrase: call on the name of your god
  simplified_phrase: call on the name of your god
  preserved_meaning: They are to invoke Baal, the one deity identified in the immediate context.
  reasoning_layer_used: Lexical and theological decisions
  rationale: The wording keeps the Hebrew name-invocation image and the singular reference to Baal.
- pob_phrase: put no fire under it
  simplified_phrase: do not put any fire under it
  preserved_meaning: They must not use fire to ignite the prepared sacrifice.
  reasoning_layer_used: Lexical decision and sacrificial context
  rationale: The direct prohibition is more natural in common English while retaining the implied location of the fire.
translation_notes:
  risk_flags:
  - risk: Moving “go first” before the instructions slightly changes the clause order.
