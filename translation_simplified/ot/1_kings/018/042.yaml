translation:
  language: en
  text: So Ahab went up to eat and drink. But[a] Elijah went up to the top of Carmel. He bent low to the ground and put his face between his knees.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated “And Elijah.” Here “but” brings out the contrast between Ahab and Elijah.
    reason: lexical_alternative
  - marker: b
    text: Elijah’s posture suggests prayer in this context, but this verse describes only his physical position.
    reason: cultural_note
simplification_decisions:
- pob_phrase: So Ahab went up to eat and to drink
