  preserved_meaning: Ahab went up for the purpose of eating and drinking.
  reasoning_layer_used: POB lexical decision for לֶאֱכֹל וְלִשְׁתּוֹת
  rationale: Removing the repeated “to” makes the purpose phrase more natural without changing it.
- pob_phrase: but Elijah went up to the top of Carmel, and he bent down
  simplified_phrase: But Elijah went up to the top of Carmel. He bent low
  preserved_meaning: Elijah’s contrasting action and upward movement to Carmel remain distinct from his low posture.
  reasoning_layer_used: POB discourse and lexical decisions
  rationale: Two short sentences make the sequence easier to follow while preserving the contrast.
- pob_phrase: bent down to the ground
  simplified_phrase: bent low to the ground
  preserved_meaning: Elijah stooped close to the ground without the text naming the act as worship or prayer.
  reasoning_layer_used: POB lexical and theological decisions for וַיִּגְהַר אַרְצָה
  rationale: “Bent low” makes the depth of the physical posture clearer without interpreting its purpose.
translation_notes:
