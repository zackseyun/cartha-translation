translation:
  language: en
  text: While Jezebel was killing off Yahweh’s prophets,[a] Obadiah took a hundred of them and hid them in caves, fifty in each cave.[b] He supplied them with bread and water.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “was destroying”; the Hebrew literally says “was cutting off.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew literally says “fifty men in a cave” and likely refers to two groups hidden in separate caves.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: was cutting off the prophets of Yahweh
  simplified_phrase: was killing off Yahweh’s prophets
  preserved_meaning: Jezebel was eliminating Yahweh’s prophets by killing them, while the Hebrew image remains partly present in “off.”
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: “Killing off” makes the deadly sense immediately clear without weakening the source image.
- pob_phrase: hid them, fifty men to a cave
  simplified_phrase: hid them in caves, fifty in each cave
  preserved_meaning: Obadiah concealed the prophets in groups of fifty, apparently in separate caves.
  reasoning_layer_used: POB lexical decision and footnote b
  rationale: The recast wording clearly communicates how the hundred prophets were divided.
- pob_phrase: provided them with bread and water
  simplified_phrase: He supplied them with bread and water
  preserved_meaning: Obadiah continued meeting their basic needs while they were hidden.
  reasoning_layer_used: POB lexical decision for וְכִלְכְּלָם
  rationale: A new sentence reduces clause density, and “supplied” is common and direct.
interpretive_expansions:
- pob_phrase: fifty men to a cave
  rendering: in caves, fifty in each cave
  claim: The hundred prophets were divided into two groups and hidden in separate caves.
  evidence:
