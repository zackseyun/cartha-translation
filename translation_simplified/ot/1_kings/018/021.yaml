  text: Elijah approached all the people and said, “How long will you keep limping between two branches, divided in your loyalty?[a] If Yahweh is God, follow him. But if Baal is God, follow him.” The people said nothing in reply.
  philosophy: optimal-equivalence
  footnotes:
