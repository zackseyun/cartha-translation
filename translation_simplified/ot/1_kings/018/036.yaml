translation:
  language: en
  text: When it was time to present the grain offering, the prophet Elijah came forward and said, “Yahweh, God of Abraham, Isaac, and Israel,[a] make it known today that you are God in Israel, that I am your servant, and that I have done all this at your word.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew text says “Israel,” not the more familiar “Jacob.”
    reason: alternative_reading
