  reasoning_layer_used: Source wording and immediate narrative context
  rationale: “Master” avoids confusing the lowercase title with the divine name.
- pob_phrase: and he will kill me
  simplified_phrase: He will kill me!
  preserved_meaning: Obadiah expects Ahab to execute him if Elijah cannot be found.
  reasoning_layer_used: POB controlling text
