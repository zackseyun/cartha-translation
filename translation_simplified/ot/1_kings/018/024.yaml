translation:
  language: en
  text: “Call on your god,[a] and I will call on Yahweh. Whichever god answers with fire—he is God.” All the people replied, “That is a good proposal.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “your gods.” The Hebrew form can be understood as singular or plural, but the contest here focuses on Baal as their god.
    reason: lexical_alternative
