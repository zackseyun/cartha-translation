  reasoning_layer_used: POB lexical decisions for קרא with בְּשֵׁם and the divine name יהוה
  rationale: The shorter wording expresses the Hebrew invocation idiom in natural English.
- pob_phrase: the God who answers by fire, he is God
  simplified_phrase: Whichever god answers with fire—he is God
  preserved_meaning: The deity who responds through fire will thereby be identified as God.
  reasoning_layer_used: POB lexical decisions for הָאֱלֹהִים אֲשֶׁר יַעֲנֶה בָאֵשׁ and הוּא הָאֱלֹהִים
  rationale: Naming “god” directly clarifies the contestant while preserving the fire test and emphatic verdict.
- pob_phrase: all the people answered and said, “The word is good”
