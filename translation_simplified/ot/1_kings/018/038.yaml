translation:
  language: en
  text: Then Yahweh’s fire fell. It burned up the burnt offering, the wood, the stones, and the dust. It also licked up the water in the trench.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Then fire from Yahweh fell.” The Hebrew may emphasize that the fire came from him.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the fire of Yahweh fell
  simplified_phrase: Yahweh’s fire fell
  preserved_meaning: The fire is directly associated with Yahweh and falls from above.
  reasoning_layer_used: Lexical and theological decisions
  rationale: The possessive form is more natural while preserving the divine name and the image of falling fire.
- pob_phrase: consumed the burnt offering, the wood, the stones, the dust
  simplified_phrase: burned up the burnt offering, the wood, the stones, and the dust
  preserved_meaning: The fire completely destroys the offering and everything around it, even the stones and dust.
  reasoning_layer_used: Lexical decisions and narrative context
  rationale: “Burned up” is common English for what fire does without weakening the miracle.
- pob_phrase: and licked up the water that was in the trench
  simplified_phrase: It also licked up the water in the trench.
  preserved_meaning: The fire removes the trench water while retaining the vivid licking image.
  reasoning_layer_used: Lexical decision
  rationale: A separate sentence makes the final image easier to follow and keeps its dramatic force.
translation_notes:
  risk_flags:
  - risk: “Yahweh’s fire” could be read only as possession rather than fire sent by Yahweh.
    mitigation: The footnote preserves the source-emphasizing alternative.
