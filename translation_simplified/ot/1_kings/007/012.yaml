translation:
  language: en
  text: The great courtyard was surrounded by three rows of cut stone and one row of cedar beams. It was built like the inner courtyard of Yahweh’s temple and the temple’s entrance hall.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “and for the inner courtyard of Yahweh’s temple and for the temple’s entrance hall.” The Hebrew may indicate either comparison or relation here.
    reason: alternative_reading
