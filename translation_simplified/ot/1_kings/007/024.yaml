translation:
  language: en
  text: Under its rim, two rows of gourd-shaped decorations[a] ran all the way around the large basin called the Sea. There were ten decorations along each cubit (roughly half a meter) of its circumference. They were cast in one piece with the basin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term may also be translated “buds” or “knobs”; it describes gourd-like ornamental shapes.
    reason: lexical_alternative
