  simplified_phrase: a round rim that went all the way around it
  preserved_meaning: The rim was circular and extended around the stand on every side.
  reasoning_layer_used: Lexical decision for עָגֹל סָבִיב
  rationale: The fuller clause expresses the repeated idea naturally without weakening the circular image.
- pob_phrase: half a cubit high
  simplified_phrase: about nine inches (23 centimeters) high
  preserved_meaning: The rim rose half a cubit above the stand.
  reasoning_layer_used: Lexical decision for חֲצִי הָאַמָּה קוֹמָה
  rationale: A modern approximate conversion makes the ancient measurement immediately understandable.
- pob_phrase: were of one piece with it
  simplified_phrase: were made as one piece with the stand
  preserved_meaning: The supports and panels were integral parts of the stand rather than separate attachments.
  reasoning_layer_used: Lexical decision for מִמֶּנָּה
  rationale: Naming the stand again removes an unclear pronoun while retaining the architectural sense.
