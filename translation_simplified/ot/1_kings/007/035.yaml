translation:
  language: en
  text: At the top of the stand was a round rim that went all the way around it and stood about nine inches (23 centimeters) high.[a] The supports[b] and panels[c] at the top were made as one piece with the stand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebrew: half a cubit.'
    reason: cultural_note
  - marker: b
    text: Or “handles”; the Hebrew word literally means “hands” and may refer to parts projecting from the stand.
    reason: lexical_alternative
  - marker: c
    text: Or “frames.”
    reason: lexical_alternative
