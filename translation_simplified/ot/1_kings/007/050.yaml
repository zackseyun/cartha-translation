  text: The basins, tools for trimming the lamp wicks, bowls[a], cups, and firepans were made of pure gold. The sockets in which the doors turned were also made of gold. These were for the doors of the inner sanctuary—the Most Holy Place[b]—and for the doors of the temple’s main hall.
