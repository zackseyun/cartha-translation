  text: All these buildings were made with costly stones. The stones were cut to measured sizes and sawed on both their inner and outer faces. The stonework extended from the foundation to the upper edge[a], and outward as far as the great courtyard.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The exact Hebrew term is uncertain; it may mean the coping or top course of the building.
    reason: lexical_alternative
