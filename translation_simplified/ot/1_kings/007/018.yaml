  text: He made the pillars. On one latticework, he made two rows all around it to cover the decorative pillar tops that were on top of the pomegranate-shaped ornaments. He made the second pillar top in the same way.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word translated “pillars” may instead refer to the pomegranate ornaments.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew is difficult; the two rows may instead be part of the pomegranate decoration around the latticework of each pillar top.
    reason: alternative_reading
