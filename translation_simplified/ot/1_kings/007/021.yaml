translation:
  language: en
  text: He set up the pillars at the temple’s front porch. He set up the pillar on the right and named it Jachin. Then he set up the pillar on the left and named it Boaz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jachin and Boaz are the Hebrew names of the pillars; their possible meanings are not translated here.
