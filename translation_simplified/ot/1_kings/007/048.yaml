translation:
  language: en
  text: Solomon made all the objects in Yahweh’s temple. These included the gold altar and the gold table that held the bread of the Presence.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This was the sacred bread placed before Yahweh in the sanctuary.
    reason: cultural_note
simplification_decisions:
- pob_phrase: all the vessels that were in the house of Yahweh
  simplified_phrase: all the objects in Yahweh’s temple
  preserved_meaning: Solomon made the items located in or belonging to Yahweh’s sanctuary.
  reasoning_layer_used: The lexical notes identify the vessels as temple items and allow “temple” for “house.”
  rationale: “Objects in Yahweh’s temple” avoids the misleading modern sense of “vessels” while preserving the source’s location or association.
- pob_phrase: the golden altar, and the table ... of gold
  simplified_phrase: the gold altar and the gold table
  preserved_meaning: Both the altar and the table are identified as gold.
  reasoning_layer_used: The lexical decisions assign the final “gold” to the table while retaining the golden altar.
  rationale: Repeating “gold” makes the description immediately clear.
- pob_phrase: the table on which was the bread of the Presence
  simplified_phrase: the table that held the bread of the Presence
  preserved_meaning: The special bread was placed on this table before Yahweh.
  reasoning_layer_used: The lexical note preserves the table’s physical relationship to the bread.
  rationale: “Held” states the same relationship in natural English.
translation_notes:
  risk_flags:
  - risk: “Objects” is broader than the cultic term “vessels.”
    mitigation: The phrase “in Yahweh’s temple” limits the objects to their sanctuary setting.
  - risk: “Bread of the Presence” may be unfamiliar to new readers.
    mitigation: The footnote briefly explains its sacred setting before Yahweh.
