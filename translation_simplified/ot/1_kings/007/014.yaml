translation:
  language: en
  text: His mother was a widow from the tribe of Naphtali. His father was from Tyre and was a skilled bronze worker.[a] He was filled with the wisdom, understanding, and knowledge needed for every kind of bronze work. He came to King Solomon and did all his work.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can mean copper or bronze; bronze fits the temple furnishings described here.
    reason: lexical_alternative
