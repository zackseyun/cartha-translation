  text: He built the House of the Forest of Lebanon. It was about 150 feet long, 75 feet wide, and 45 feet high.[a] It was supported by four rows of cedar pillars,[b] with cedar beams resting on the pillars.[c]
  philosophy: optimal-equivalence
  footnotes:
