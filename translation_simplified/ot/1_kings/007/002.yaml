    text: Or “It had four rows of cedar pillars”; the Hebrew may describe either support or arrangement.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew literally says “cut pieces” of cedar and may refer to beams, rafters, or another structural element.
    reason: lexical_alternative
