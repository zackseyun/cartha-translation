translation:
  language: en
  text: The capitals—the top sections of the pillars at the temple entrance—were shaped like lily blossoms.[b] The text gives a measurement of four cubits (about six feet), but does not say which dimension this measures.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebrew: “four cubits.” This probably refers to the height of the lily-shaped part of the capitals.'
    reason: cultural_note
  - marker: b
    text: Or “lotus blossoms”; the exact flower represented by the design is uncertain.
    reason: lexical_alternative
