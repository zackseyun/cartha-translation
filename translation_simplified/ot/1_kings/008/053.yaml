translation:
  language: en
  text: For you set them apart from all the peoples of the earth to belong to you as your inheritance. You did this just as you said through your servant Moses when you brought our fathers out of Egypt, Lord Yahweh.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: set them apart for yourself as an inheritance from all the peoples of the earth
  simplified_phrase: set them apart from all the peoples of the earth to belong to you as your inheritance
  preserved_meaning: God separated Israel from all other peoples as his own covenant possession.
  reasoning_layer_used: POB lexical decisions for הִבְדַּלְתָּם, לְךָ, לְנַחֲלָה, and מִכֹּל עַמֵּי הָאָרֶץ
  rationale: The wording explains possession while retaining both separation and the inheritance image.
- pob_phrase: just as you spoke by the hand of Moses your servant
  simplified_phrase: You did this just as you said through your servant Moses
  preserved_meaning: God acted in accordance with the word he had delivered through Moses.
  reasoning_layer_used: POB lexical decisions for כַּאֲשֶׁר, דִּבַּרְתָּ, and בְּיַד מֹשֶׁה
  rationale: A new sentence and the ordinary agency phrase “through Moses” clarify the relationship.
- pob_phrase: when you brought our fathers out from Egypt, Lord GOD
  simplified_phrase: when you brought our fathers out of Egypt, Lord Yahweh
  preserved_meaning: God brought Israel’s forefathers out of Egypt and is addressed by his divine title and covenant name.
  reasoning_layer_used: POB lexical decisions for בְּהוֹצִיאֲךָ, אֶת אֲבֹתֵינוּ, and מִמִּצְרַיִם, with the updated POB theological decision for אֲדֹנָי יְהוִה
  rationale: Natural exodus wording is paired with the doctrinally required rendering “Lord Yahweh.”
interpretive_expansions:
- pob_phrase: for yourself as an inheritance
  rendering: to belong to you as your inheritance
  claim: The people set apart are God’s own possession.
  evidence:
  - The POB rationale for לְךָ identifies divine possession.
  - The POB rationale for לְנַחֲלָה permits the sense of an allotted possession.
  confidence: high
  alternatives_preserved:
  - as your inheritance
translation_notes:
  risk_flags:
  - risk: “Inheritance” may suggest property received after someone’s death to a modern reader.
    mitigation: “To belong to you” makes the intended possession sense clear without removing the covenant image.
