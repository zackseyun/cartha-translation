translation:
  language: en
  text: 'Then hear in heaven[a] and act. Judge your servants: declare the wicked guilty, and bring what he has done back upon his own head; declare the righteous innocent, and give him what his righteousness deserves.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
