  preserved_meaning: God is asked to give a judicial verdict and condemn the guilty person.
  reasoning_layer_used: lexical and theological decisions on forensic judgment
  rationale: The rewrite makes the courtroom sense clear without suggesting moral transformation.
- pob_phrase: bringing his way upon his own head
  simplified_phrase: bring what he has done back upon his own head
