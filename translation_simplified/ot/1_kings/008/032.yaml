  reasoning_layer_used: lexical decision and cultural note on the Hebrew idiom
  rationale: “What he has done” explains “his way,” while “upon his own head” preserves the forceful image.
- pob_phrase: justifying the righteous by giving to him according to his righteousness
  simplified_phrase: declare the righteous innocent, and give him what his righteousness deserves
  preserved_meaning: God vindicates the righteous person and gives him recompense fitting his uprightness.
  reasoning_layer_used: lexical and theological decisions on legal justification and recompense
  rationale: Common legal wording replaces difficult theological phrasing while preserving both verdict and outcome.
