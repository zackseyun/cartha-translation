simplification_decisions:
- pob_phrase: Nevertheless
  simplified_phrase: But
  preserved_meaning: The LORD limits the preceding approval of David’s desire to build.
  reasoning_layer_used: Lexical decision for רַק
  rationale: “But” expresses the contrast in more common English.
- pob_phrase: your son who comes from your own body
  simplified_phrase: your own flesh-and-blood son
  preserved_meaning: The builder will be David’s physical offspring.
  reasoning_layer_used: Lexical decision for הַיֹּצֵא מֵחֲלָצֶיךָ
  rationale: The familiar idiom clearly conveys biological descent without archaic anatomy.
- pob_phrase: rather ... he shall build
  simplified_phrase: Instead ... shall build
  preserved_meaning: The son, not David, is emphatically appointed to build.
  reasoning_layer_used: Lexical decisions for כִּי אִם and הוּא
  rationale: The new sentence and “Instead” make the correction and emphasis easy to follow.
translation_notes:
