translation:
  language: en
  text: But you shall not build the house. Instead, your own flesh-and-blood son shall build the house for my name.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “house” is the temple, dedicated to the LORD and bearing his name.
