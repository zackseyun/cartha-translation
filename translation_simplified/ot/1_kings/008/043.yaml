- pob_phrase: may you hear in heaven, the place where you dwell
  simplified_phrase: May you hear in heaven, where you dwell
  preserved_meaning: Solomon asks God to hear from his heavenly dwelling.
  reasoning_layer_used: POB lexical decisions for תִּשְׁמַע, הַשָּׁמַיִם, and מְכוֹן שִׁבְתֶּךָ
  rationale: The shorter clause preserves both the prayerful force and the heavenly setting.
- pob_phrase: do according to all that the foreigner calls to you for
  simplified_phrase: do everything the foreigner asks you to do
  preserved_meaning: Solomon asks God to act fully in response to the foreigner’s request.
  reasoning_layer_used: POB lexical decisions for וְעָשִׂיתָ, כְּכֹל אֲשֶׁר, and יִקְרָא אֵלֶיךָ
  rationale: Direct request language makes the implied object clear without narrowing its scope.
- pob_phrase: your name is called upon this house that I have built
  simplified_phrase: this house I have built bears your name
  preserved_meaning: The temple is publicly associated with God and belongs to him.
  reasoning_layer_used: POB lexical and theological decisions on שִׁמְךָ נִקְרָא עַל
  rationale: The audited idiomatic equivalent communicates the image’s meaning more clearly than a literal form.
