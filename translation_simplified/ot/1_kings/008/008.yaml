translation:
  language: en
  text: The poles were so long that their ends were visible from the Holy Place, in front of the inner sanctuary.[a] They could not be seen from outside, and they remain there to this day.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in front of the Most Holy Place.” The Hebrew term means the temple’s inner sanctuary.
    reason: lexical_alternative
