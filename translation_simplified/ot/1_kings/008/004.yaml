translation:
  language: en
  text: They brought Yahweh’s ark up[a], together with the tent of meeting and all the sacred objects that were inside it. The priests and the Levites[b] brought them up.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “carried Yahweh’s ark up.” The Hebrew can describe bringing or carrying something upward in a procession.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew names both “the priests” and “the Levites.” Some understand the phrase as referring more specifically to the Levitical priesthood.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the ark of Yahweh
  simplified_phrase: Yahweh’s ark
  preserved_meaning: The covenant ark remains identified with Yahweh by his personal name.
  reasoning_layer_used: lexical and theological decisions
  rationale: The possessive form is more natural while preserving the chosen rendering of the divine name.
- pob_phrase: all the holy vessels that were in the tent
  simplified_phrase: all the sacred objects that were inside it
  preserved_meaning: Every consecrated item kept in the tent is included.
  reasoning_layer_used: lexical decision for כָּל כְּלֵי הַקֹּדֶשׁ
  rationale: “Sacred objects” clearly conveys the broad sense of consecrated implements without suggesting only containers.
- pob_phrase: the priests and the Levites brought them up
  simplified_phrase: The priests and the Levites brought them up.
  preserved_meaning: Both named groups remain connected to the transport action.
  reasoning_layer_used: theological decision on preserving textual tension
  rationale: A separate sentence clarifies the actors without collapsing the two groups into one.
translation_notes:
  risk_flags:
  - risk: “Sacred objects” is broader than the traditional term “holy vessels.”
    mitigation: The broader wording matches the lexical range of the Hebrew term for implements or articles.
  - risk: Readers may infer that priests and Levites performed identical duties.
    mitigation: The main text retains the Hebrew wording, and the footnote preserves the narrower alternative without resolving it.
