translation:
  language: en
  text: 'And now, Yahweh, God of Israel, keep the promise you made to your servant David, my father: “You will not lack a descendant to sit on Israel’s throne before me,[a] if only your sons watch how they live by walking before me as you did.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “A man shall not be cut off from before me for you”; the image means that David’s royal line will continue before God.
    reason: source_note
