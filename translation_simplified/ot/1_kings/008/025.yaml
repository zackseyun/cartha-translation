  preserved_meaning: Solomon asks Yahweh to fulfill what he said to David.
  reasoning_layer_used: lexical decision for שְׁמֹר and immediate context
  rationale: Calling God’s words a promise clearly expresses their function in this prayer.
- pob_phrase: A man shall not be cut off from before me for you, one sitting on the throne of Israel
  simplified_phrase: You will not lack a descendant to sit on Israel’s throne before me
  preserved_meaning: David will continue to have a royal descendant before God on Israel’s throne.
  reasoning_layer_used: POB lexical rationale and idiomatic footnote for כרת
  rationale: This presents the dynastic idiom as one promise while the footnote preserves its cut-off image.
- pob_phrase: your sons keep their way, by walking before me as you have walked before me
