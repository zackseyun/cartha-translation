translation:
  language: en
  text: That day, the king set apart the middle of the courtyard in front of Yahweh’s house, the temple, for sacred use. There he offered the burnt offering, the grain offering, and the fat portions of the peace offerings, because the bronze altar in front of Yahweh was too small to hold these offerings.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: consecrated the middle of the court
  simplified_phrase: set apart the middle of the courtyard ... for sacred use
  preserved_meaning: The king designated the central courtyard area for holy sacrificial use.
  reasoning_layer_used: Lexical decisions for קִדַּשׁ and תּוֹךְ הֶחָצֵר
  rationale: The wording explains the ritual meaning of “consecrated” while preserving the location.
- pob_phrase: the house of Yahweh
  simplified_phrase: Yahweh’s house, the temple
  preserved_meaning: The building is presented as Yahweh’s house and identified as the temple.
  reasoning_layer_used: Lexical decision for לִפְנֵי בֵית יְהוָה and POB footnote
  rationale: This preserves the house image while identifying the building for new readers.
- pob_phrase: because there he offered ... because the bronze altar
  simplified_phrase: There he offered ... because the bronze altar ... was too small
  preserved_meaning: The offerings were made in the courtyard because the bronze altar lacked sufficient capacity.
  reasoning_layer_used: POB syntax and lexical decision for קָטֹן מֵהָכִיל
  rationale: The explicit causal clause removes the ambiguous antecedent of “He did this.”
