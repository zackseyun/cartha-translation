translation:
  language: en
  text: Also, when a foreigner[a]—someone who is not one of your people Israel—comes from a distant land because of your name—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew means a non-Israelite, not merely a traveler; it can also be translated “stranger” or “outsider.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And also concerning the foreigner
  simplified_phrase: Also, when a foreigner
  preserved_meaning: This adds the foreigner’s case to the preceding prayer petitions.
  reasoning_layer_used: Lexical decisions for וְגַם and אֶל, read in the continuing prayer context
  rationale: The temporal opening makes the unfinished sentence easier to follow while preserving its link to the petition.
- pob_phrase: who is not from your people Israel
  simplified_phrase: someone who is not one of your people Israel
  preserved_meaning: The foreigner is outside Israel while Israel remains identified as God’s people.
  reasoning_layer_used: POB lexical and theological decisions on the covenantal distinction
  rationale: The apposition explains the distinction in direct modern English.
- pob_phrase: for the sake of your name
  simplified_phrase: because of your name
  preserved_meaning: God’s name is the reason the foreigner comes.
  reasoning_layer_used: Lexical decision for לְמַעַן שְׁמֶךָ
  rationale: “Because of” states the motive plainly while retaining the important biblical term “name.”
translation_notes:
  risk_flags:
