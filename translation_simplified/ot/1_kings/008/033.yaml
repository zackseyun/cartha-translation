  reasoning_layer_used: Lexical decisions for בְּהִנָּגֵף and לִפְנֵי אוֹיֵב
  rationale: “Defeated by” expresses the military sense in ordinary English while keeping Israel as the recipient of the action.
- pob_phrase: confess your name
  simplified_phrase: acknowledge your name
  preserved_meaning: The people openly recognize God’s character and authority as they return to him.
  reasoning_layer_used: Lexical and theological decisions for וְהוֹדוּ אֶת שְׁמֶךָ
  rationale: “Acknowledge” avoids a misleading modern sense of “confess” while the footnote preserves the Hebrew verb’s range.
- pob_phrase: in this house
