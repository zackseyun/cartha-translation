translation:
  language: en
  text: When your people Israel are defeated by an enemy because they have sinned against you, and they turn back to you, acknowledge your name,[a] pray, and plead with you in this temple,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, acknowledge who you are. Or “praise your name” or “give thanks to your name”; the Hebrew verb can carry any of these senses here.
    reason: lexical_alternative
