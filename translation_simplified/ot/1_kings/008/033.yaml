  preserved_meaning: They pray in the house Solomon built for the LORD.
  reasoning_layer_used: Lexical decision for בַּבַּיִת הַזֶּה and the temple-dedication context
  rationale: “Temple” makes the known referent clear to readers unfamiliar with calling it God’s house.
