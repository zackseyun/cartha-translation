  preserved_meaning: Yahweh is incomparable throughout the whole created order.
  reasoning_layer_used: lexical decision on the cosmic merism
  rationale: “Anywhere” makes the total scope clear, while “heaven above” and “earth below” preserve the source image.
- pob_phrase: keeping the covenant and the steadfast love
  simplified_phrase: You keep your covenant and show steadfast love
  preserved_meaning: Yahweh faithfully maintains both his covenant commitment and his loyal love.
  reasoning_layer_used: lexical and theological decisions on covenant and hesed
  rationale: A direct sentence clarifies God’s action without merging covenant and steadfast love.
- pob_phrase: who walk before you with all their heart
  simplified_phrase: who walk before you with their whole heart devoted to you
  preserved_meaning: The servants live in God’s presence with undivided inner devotion.
  reasoning_layer_used: lexical decisions on the walking idiom and whole heart
  rationale: The walking image remains, and the added phrase explains wholehearted conduct.
