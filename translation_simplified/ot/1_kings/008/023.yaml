  text: And he said, “Yahweh, God of Israel, no God is like you anywhere in heaven above or on earth below. You keep your covenant and show steadfast love[a] to your servants, who walk before you with their whole heart devoted to you.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term includes faithful love and covenant loyalty.
    reason: lexical_alternative
