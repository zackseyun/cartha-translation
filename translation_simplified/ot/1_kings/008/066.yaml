- pob_phrase: he sent the people away
  simplified_phrase: he sent the people on their way
  preserved_meaning: The king dismissed the people and allowed them to depart.
  reasoning_layer_used: POB lexical decision for שִׁלַּח אֶת הָעָם
  rationale: This avoids suggesting rejection while preserving authorized departure.
- pob_phrase: went to their tents
  simplified_phrase: returned to their tents
  preserved_meaning: The people went back to where they lived after the gathering.
  reasoning_layer_used: POB lexical decision and footnote for לְאָהֳלֵיהֶם
  rationale: “Returned” makes the movement clear while the footnote explains the idiom.
- pob_phrase: rejoicing and glad of heart
  simplified_phrase: They rejoiced, and their hearts were glad
  preserved_meaning: The people departed with active joy and inward gladness.
  reasoning_layer_used: POB lexical decisions for שְׂמֵחִים and וְטוֹבֵי לֵב
  rationale: A separate sentence uses natural English while preserving both ideas and the heart image.
