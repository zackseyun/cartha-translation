translation:
  language: en
  text: On the eighth day, he sent the people on their way. They blessed the king and returned to their tents.[a] They rejoiced, and their hearts were glad because of all the good Yahweh had done for his servant David and for his people Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “returned to their homes.” The Hebrew literally says “to their tents.”
    reason: lexical_alternative
