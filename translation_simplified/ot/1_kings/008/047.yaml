simplification_decisions:
- pob_phrase: in the land where they were taken captive ... in the land of those who took them captive
  simplified_phrase: there in their captors’ land
  preserved_meaning: They respond to God while still living in the foreign land of their captors.
  reasoning_layer_used: POB text and source payload
  rationale: The repeated location is compressed without removing the setting of captivity.
- pob_phrase: acted perversely
  simplified_phrase: done what is wrong
  preserved_meaning: They confess that their conduct was morally crooked and wrong.
  reasoning_layer_used: POB wording
  rationale: Common wording makes the confession clear while keeping it distinct from sinning and acting wickedly.
- pob_phrase: saying, ‘We have sinned and acted perversely; we have acted wickedly’
  simplified_phrase: saying, “We have sinned. We have done what is wrong and acted wickedly”
  preserved_meaning: Their confession acknowledges sin, wrongdoing, and wicked conduct.
  reasoning_layer_used: POB text and source clause structure
  rationale: Two shorter sentences preserve all three confessions while improving readability.
