simplification_decisions:
- pob_phrase: If a man sins against his neighbor
  simplified_phrase: Suppose a man sins against his neighbor.
  preserved_meaning: The verse introduces a case of moral wrongdoing against another person.
  reasoning_layer_used: Lexical decisions for יֶחֱטָא, אִישׁ, and לְרֵעֵהוּ
  rationale: “Suppose” and a separate sentence make the legal case easier to follow while retaining “man,” “sins,” and “neighbor.”
- pob_phrase: and an oath is laid on him to make him swear
  simplified_phrase: An oath is then laid on him, requiring him to swear.
  preserved_meaning: The oath is imposed on the man and obligates him to swear.
  reasoning_layer_used: Lexical decisions for וְנָשָׂא בוֹ אָלָה and לְהַאֲלֹתוֹ
  rationale: “Requiring” clarifies the purpose without merging the imposed oath and the act of swearing.
- pob_phrase: and the oath comes before your altar in this house
  simplified_phrase: When the oath comes before your altar in this house,
  preserved_meaning: The oath is presented before God at the temple altar.
  reasoning_layer_used: Lexical decisions for וּבָא אָלָה, לִפְנֵי מִזְבַּחֲךָ, and בַּבַּיִת הַזֶּה
  rationale: “When” gives the unfinished clause a natural lead-in while preserving the oath as the subject and retaining “house.”
