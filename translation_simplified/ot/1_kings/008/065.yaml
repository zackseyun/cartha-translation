translation:
  language: en
  text: At that time, Solomon celebrated the feast, and all Israel joined him. It was a great assembly, with people from Lebo-hamath[a] all the way to the Brook of Egypt.[b] They celebrated before Yahweh our God for seven days and then another seven days—fourteen days in all.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the entrance of Hamath.” The Hebrew may refer either to a place named Lebo-hamath or to the approach to Hamath.
    reason: alternative_reading
  - marker: b
    text: Or “the Wadi of Egypt,” a seasonal streambed rather than a major river.
    reason: lexical_alternative
