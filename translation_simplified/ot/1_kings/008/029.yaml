translation:
  language: en
  text: May your eyes be open toward this house night and day—toward this place, about which you said, “My name will be there.”[a] Hear the prayer your servant offers toward this place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “My name will be there” is temple language for God’s chosen association with this place and implies his covenantal presence, without limiting the phrase to that one meaning.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: that your eyes may be open toward this house night and day
  simplified_phrase: May your eyes be open toward this house night and day
  preserved_meaning: Solomon asks for God’s continual attentive regard while retaining the image of open eyes.
  reasoning_layer_used: Lexical and theological decisions on the purpose clause, open eyes, and night and day
  rationale: A direct request is easier to follow than a dependent purpose clause.
- pob_phrase: toward the place of which you said, ‘My name will be there,’
  simplified_phrase: —toward this place, about which you said, “My name will be there.”
  preserved_meaning: God’s eyes remain directed toward the chosen temple site associated with his name.
  reasoning_layer_used: Lexical and theological decisions on the repeated directional phrase and God’s name
  rationale: The dash clarifies the place while preserving its directional link to God’s open eyes.
- pob_phrase: to hear the prayer that your servant prays toward this place
  simplified_phrase: Hear the prayer your servant offers toward this place.
  preserved_meaning: Solomon asks God to hear his servant’s temple-directed prayer.
  reasoning_layer_used: Lexical decisions on hearing, prayer, servant, and direction toward the place
  rationale: The direct request and “offers” avoid awkward repetition without losing the prayer’s direction.
translation_notes:
  risk_flags:
  - risk: The direct requests may seem less connected to the preceding verse than the POB purpose clauses.
    mitigation: The opening “May” preserves the wording as part of Solomon’s continuing prayer.
  - risk: Readers may take “My name will be there” as a simple statement about a label.
    mitigation: The footnote explains its temple setting without reducing it to one interpretation.
