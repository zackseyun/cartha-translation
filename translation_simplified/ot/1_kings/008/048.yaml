translation:
  language: en
  text: and while they are in the land of the enemies who took them captive, they return to you with all their heart and all their soul.[a] They pray to you facing their land—the land you gave to their fathers—and facing the city you chose and the house I built for your name.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Return to you” can also mean “turn back to you” and can imply repentance here.
    reason: lexical_alternative
  - marker: b
    text: The “house” is the temple dedicated to God's name.
    reason: cultural_note
