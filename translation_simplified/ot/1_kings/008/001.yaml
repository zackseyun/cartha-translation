  text: Then Solomon assembled the elders of Israel, all the tribal heads, and the leaders of the ancestral families of the sons of Israel before him in Jerusalem. They gathered to bring up the ark of Yahweh’s covenant from the city of David, that is, Zion.[a]
  philosophy: optimal-equivalence
