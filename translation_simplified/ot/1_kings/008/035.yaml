translation:
  language: en
  text: When they have sinned against you and the heavens are shut so that no rain falls, and when they pray toward this place and give thanks to your name[a] and turn away from their sin because you have afflicted them[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “praise your name” or “openly acknowledge your name.”
    reason: lexical_alternative
  - marker: b
    text: Or “humbled them”; some read “answered them,” but the drought context favors affliction or humbling.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: When the heavens are shut up and there is no rain because they have sinned against you
  simplified_phrase: When they have sinned against you and the heavens are shut so that no rain falls
  preserved_meaning: The drought follows the people's sin, while the image of closed heavens remains.
  reasoning_layer_used: Lexical decisions for the closed heavens, lack of rain, and sin against God
  rationale: The reordered clause makes the cause and result easier to follow.
- pob_phrase: and they pray toward this place and give thanks to your name and turn from their sin
  simplified_phrase: and when they pray toward this place and give thanks to your name and turn away from their sin
  preserved_meaning: All three actions remain the people's response, and their prayer is directed toward the temple.
  reasoning_layer_used: Theological decision on directional prayer and lexical decision for turning from sin
  rationale: The repeated “when” clarifies the condition, while coordinated verbs prevent an unintended command.
- pob_phrase: because you afflict them
  simplified_phrase: because you have afflicted them
  preserved_meaning: God's discipline prompts the people to abandon their sin.
  reasoning_layer_used: Lexical and theological decisions for תַעֲנֵם
  rationale: The completed English verb form makes the sequence natural without changing POB's reading.
interpretive_expansions:
- pob_phrase: the heavens are shut up and there is no rain
  rendering: the heavens are shut so that no rain falls
  claim: The lack of rain results from the pictured closing of the heavens.
  evidence:
  - The Hebrew places the no-rain clause after the shutting of the heavens.
  - The POB rationale identifies the no-rain clause as the result.
  confidence: high
  alternatives_preserved:
  - the heavens are shut and there is no rain
