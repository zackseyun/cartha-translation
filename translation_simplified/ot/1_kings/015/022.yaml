  simplified_phrase: called everyone in Judah to work; no one was excused
  preserved_meaning: Asa required the people of Judah to take part in the labor.
  reasoning_layer_used: POB lexical decisions for הִשְׁמִיעַ and אֵין נָקִי
  rationale: The wording states the practical force of the summons in ordinary English.
- pob_phrase: they carried away the stones of Ramah and its timber
  simplified_phrase: They removed from Ramah the stones and timber
  preserved_meaning: The workers transported Ramah’s building materials elsewhere for reuse.
  reasoning_layer_used: POB lexical decisions for וַיִּשְׂאוּ, אַבְנֵי הָרָמָה, and עֵצֶיהָ
  rationale: “Removed from Ramah” makes both the movement and its point of origin clear.
- pob_phrase: King Asa built with them
  simplified_phrase: Asa used those materials to build
  preserved_meaning: Asa reused the stones and timber as construction materials.
  reasoning_layer_used: POB lexical decision for וַיִּבֶן בָּם
  rationale: The recast sentence clearly identifies what “them” refers to.
