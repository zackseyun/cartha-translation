translation:
  language: en
  text: Then King Asa called everyone in Judah to work; no one was excused. They removed from Ramah the stones and timber that Baasha had used to fortify it. Asa used those materials to build Geba in Benjamin and Mizpah.
  philosophy: optimal-equivalence
