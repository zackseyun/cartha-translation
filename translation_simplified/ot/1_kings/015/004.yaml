translation:
  language: en
  text: Even so, for David’s sake, Yahweh, Abijam’s God, gave Abijam a lamp in Jerusalem.[a] He did this so that Abijam’s son would succeed him as king and Jerusalem would remain established.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The lamp is a picture of David’s royal line being preserved in Jerusalem; it may also be translated “light.”
    reason: lexical_alternative
