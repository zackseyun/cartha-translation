  text: Asa slept in death with his royal ancestors[a] and was buried with them in the City of David, his royal forefather. His son Jehoshaphat became king in his place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “with his fathers,” a traditional royal expression for death and burial.
    reason: lexical_alternative
