translation:
  language: en
  text: When he became king, he struck down everyone in Jeroboam’s royal house. He left no one in Jeroboam’s line alive,[a] completely destroying the dynasty.[b] This happened according to the word Yahweh had spoken through his servant Ahijah from Shiloh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “he did not leave any breath”; that is, he left no one alive.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says “until he had destroyed him,” which may refer to Jeroboam through his family line, or to his house as a whole.
    reason: lexical_alternative
