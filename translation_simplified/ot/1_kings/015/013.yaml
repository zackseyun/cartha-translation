translation:
  language: en
  text: Asa also removed his mother Maacah[a] from her position as queen mother because she had made a dreadful image[b] for Asherah.[c] He cut down her image and burned it in the Kidron Valley.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “his mother,” but in royal usage this may also mean a grandmother or other female ancestor.
    reason: lexical_alternative
  - marker: b
    text: The exact form of this repulsive worship object is uncertain.
    reason: lexical_alternative
  - marker: c
    text: “Asherah” may mean the goddess Asherah or her worship symbol, often called an Asherah pole.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: He also removed Maacah his mother from being queen mother
  simplified_phrase: Asa also removed his mother Maacah from her position as queen mother
  preserved_meaning: Asa deposed Maacah from an official royal role.
  reasoning_layer_used: lexical decision for וַיְסִרֶהָ and מִגְּבִירָה
  rationale: Naming Asa immediately and saying “from her position” makes the action and office clear.
- pob_phrase: an abominable image for Asherah
  simplified_phrase: a dreadful image for Asherah
  preserved_meaning: Maacah made a repulsive worship object connected with Asherah.
  reasoning_layer_used: latest revision and lexical decisions for מִפְלֶצֶת and לָאֲשֵׁרָה
  rationale: “Dreadful” keeps the strong condemnation without claiming certainty about the object’s form.
- pob_phrase: Asa cut down her image and burned it
  simplified_phrase: He cut down her image and burned it
  preserved_meaning: Asa physically cut apart the object and destroyed it by fire.
  reasoning_layer_used: lexical decisions for וַיִּכְרֹת and וַיִּשְׂרֹף
  rationale: The pronoun avoids repetition while “cut down” preserves the concrete source image.
translation_notes:
  risk_flags:
