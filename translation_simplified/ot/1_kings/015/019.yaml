  rationale: “Treaty” makes the political covenant clear in common English.
- pob_phrase: between my father and your father
  simplified_phrase: just as our fathers did
  preserved_meaning: Their fathers had the same kind of treaty with each other.
  reasoning_layer_used: POB text
  rationale: The shorter wording avoids repetition while preserving the inherited relationship.
