translation:
  language: en
  text: 'Then Asa took all the silver and gold left in the treasuries of Yahweh’s temple and the royal palace. He put the treasure in the care of his servants. Then King Asa sent it to Ben-hadad son of Tabrimmon, son of Hezion. Ben-hadad was king of Aram[a] and lived in Damascus. Asa sent this message:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aram was the ancient region traditionally called Syria.
    reason: cultural_note
