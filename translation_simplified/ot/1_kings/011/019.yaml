translation:
  language: en
  text: Pharaoh was very pleased with Hadad. So he gave Hadad the sister of his own wife[a]—who was also the sister of Tahpenes, the queen mother[b]—to be Hadad’s wife.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Less likely, the Hebrew may mean the sister of Hadad’s wife rather than the sister of Pharaoh’s wife.
    reason: alternative_reading
  - marker: b
    text: Hebrew “the great lady”; this title may instead mean the chief royal lady.
    reason: lexical_alternative
