translation:
  language: en
  text: But I will not tear the kingdom away during your lifetime, for the sake of your father David. I will tear it out of your son’s hand.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Nevertheless, in your days I will not do it
  simplified_phrase: But I will not tear the kingdom away during your lifetime
  preserved_meaning: God will delay the announced judgment until after Solomon’s lifetime.
  reasoning_layer_used: Lexical decisions and theological decision on deferred judgment
  rationale: The rewrite replaces two context-dependent idioms with the action and time they clearly mean.
- pob_phrase: for the sake of David your father
  simplified_phrase: for the sake of your father David
  preserved_meaning: God delays judgment out of covenantal regard for David.
  reasoning_layer_used: Lexical decision for לְמַעַן דָּוִד אָבִיךָ
  rationale: The natural English name order improves readability without weakening the Davidic-mercy motif.
- pob_phrase: from the hand of your son I will tear it away
  simplified_phrase: I will tear it out of your son’s hand
  preserved_meaning: The kingdom will be forcibly removed from the son’s possession and rule.
  reasoning_layer_used: Lexical decisions for מִיַּד and אֶקְרָעֶנָּה
  rationale: Ordinary English clause order keeps both the tearing image and the hand image.
interpretive_expansions:
- pob_phrase: do it ... tear it away
  rendering: tear the kingdom away ... tear it
  claim: The implicit object of both actions is the kingdom announced in the previous verse.
  evidence:
  - The POB footnote identifies the kingdom as the referent.
  - The theological rationale says the object is implicit from the prior context.
  confidence: high
  alternatives_preserved:
  - Leaving the object implicit as “it”
translation_notes:
  risk_flags:
  - risk: “Out of your son’s hand” could be read as a physical action.
    mitigation: Naming the kingdom makes the image clearly refer to removing royal possession and rule.
