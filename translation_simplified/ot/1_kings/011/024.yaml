translation:
  language: en
  text: He drew men to join him and became the leader of a raiding band when David killed them. They[a] went to Damascus, settled there, and ruled there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebrew uses plural verbs here: “they went … settled … ruled.” Some translations use “he” because the surrounding account focuses on Rezon.'
    reason: alternative_reading
