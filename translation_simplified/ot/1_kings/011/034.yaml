translation:
  language: en
  text: But I will not take the entire kingdom away from him. I will keep him as ruler for the rest of his life because of my servant David. I chose David, and he obeyed my commands and laws.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: take the whole kingdom out of his hand
  simplified_phrase: take the entire kingdom away from him
  preserved_meaning: God will not remove the entire kingdom from his control.
  reasoning_layer_used: POB base text and Hebrew source image
  rationale: The wording makes loss of royal control clear without retaining the opaque hand idiom.
- pob_phrase: I will make him ruler all the days of his life
  simplified_phrase: I will keep him as ruler for the rest of his life
  preserved_meaning: He will continue ruling until his death.
  reasoning_layer_used: POB revision preserving “ruler”
  rationale: The revision’s chosen title remains while the time expression becomes natural English.
- pob_phrase: whom I chose, who kept my commandments and my statutes
  simplified_phrase: I chose David, and he obeyed my commands and laws
  preserved_meaning: God chose David, who faithfully observed what God required.
  reasoning_layer_used: POB base text and immediate grammar
  rationale: Naming David removes a difficult relative clause while keeping commands and laws distinct.
translation_notes:
  risk_flags:
  - risk: Replacing the hand image may reduce the Hebrew metaphor’s vividness.
    mitigation: “Take ... away from him” preserves the force of removing the kingdom from his control.
  - risk: “Laws” is broader than the technical sense of “statutes.”
    mitigation: It gives common readers the legal sense while remaining distinct from “commands.”
