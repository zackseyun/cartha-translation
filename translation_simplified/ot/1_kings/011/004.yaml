translation:
  language: en
  text: When Solomon grew old, his wives turned his heart toward other gods. His heart was not fully devoted[a] to Yahweh his God as his father David’s heart had been.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says that his heart was not “whole” with Yahweh, meaning that his loyalty was divided.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And when Solomon was old
  simplified_phrase: When Solomon grew old
  preserved_meaning: The events occurred during Solomon’s old age.
  reasoning_layer_used: Lexical decision for לְעֵת זִקְנַת
  rationale: “Grew old” gives the time setting in natural English.
- pob_phrase: turned his heart after other gods
  simplified_phrase: turned his heart toward other gods
  preserved_meaning: His wives caused his inner loyalty and will to turn in the direction of other gods.
  reasoning_layer_used: Lexical decisions for הִטּוּ אֶת־לְבָבוֹ and אַחֲרֵי אֱלֹהִים אֲחֵרִים
  rationale: “Toward” makes the direction clear while preserving the image of a heart being turned.
- pob_phrase: like the heart of David his father
  simplified_phrase: as his father David’s heart had been
  preserved_meaning: Solomon’s covenant loyalty is explicitly compared with David’s.
  reasoning_layer_used: Lexical decision for כִּלְבַב דָּוִיד אָבִיו
  rationale: The recast comparison is easier to read and keeps the focus on both men’s hearts.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “heart” as emotion alone.
    mitigation: The footnote explains that the image concerns whole or divided loyalty.
