- pob_phrase: Yet I will not tear away the whole kingdom; I will give one tribe to your son
  simplified_phrase: But I will not tear away the whole kingdom. I will give one tribe to your son.
  preserved_meaning: God limits the judgment by leaving Solomon’s son one tribe.
  reasoning_layer_used: Lexical decisions for רַק, אֶקְרָע, and שֵׁבֶט אֶחָד
  rationale: Two short sentences make the limitation and promise easier to follow while retaining the tearing image.
- pob_phrase: for the sake of David my servant and for the sake of Jerusalem
  simplified_phrase: I will do this for the sake of my servant David and for the sake of Jerusalem
  preserved_meaning: God gives equal stated regard to David and Jerusalem as reasons for preserving one tribe.
  reasoning_layer_used: Theological decision on the two parallel reasons
  rationale: The added linking sentence clarifies what the two reasons explain without collapsing them into one.
