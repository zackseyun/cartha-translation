  text: But Solomon’s son will still have one tribe[a], for the sake of my servant David and for the sake of Jerusalem, the city I have chosen from all the tribes of Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew says “one tribe.” Benjamin is often understood as joined with Judah, especially because of Jerusalem’s location, but the text itself says “one tribe.”
    reason: alternative_reading
