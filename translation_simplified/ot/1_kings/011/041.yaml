translation:
  language: en
  text: The rest of Solomon’s acts, all he did, and his wisdom—are they not recorded in the Book of the Acts of Solomon?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This title may also be translated “the Book of the Chronicles of Solomon.” The Hebrew literally says “the words” or “the matters of Solomon,” an expression referring to the record of his acts.
    reason: lexical_alternative
