translation:
  language: en
  text: If you listen to everything I command you, live according to my ways, and do what is right in my eyes by keeping my decrees and commandments—as my servant David did—then I will be with you. I will establish a lasting royal line for you,[a] just as I did for David, and I will give Israel to you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew says “build for you a lasting house,” using “house” for a dynasty; it can also be rendered “faithful house,” “enduring house,” or “sure house.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And it shall be, if you listen to all that I command you
  simplified_phrase: If you listen to everything I command you
  preserved_meaning: God’s promise remains explicitly conditional on responsive listening and obedience.
  reasoning_layer_used: Theological decision on the conditional promise and lexical decision for תִּשְׁמַע.
  rationale: The direct opening removes an awkward formula while keeping the condition clear.
- pob_phrase: walk in my ways
  simplified_phrase: live according to my ways
  preserved_meaning: Jeroboam must conduct his life by God’s moral and covenantal standards.
  reasoning_layer_used: Lexical decision for וְהָלַכְתָּ בִדְרָכַי and its supported alternative.
  rationale: This states the idiom plainly without turning God’s ways into an individualized path.
- pob_phrase: build for you a lasting house
  simplified_phrase: establish a lasting royal line for you
  preserved_meaning: God promises to establish an enduring dynasty for Jeroboam.
  reasoning_layer_used: Lexical and theological decisions for בַיִת נֶאֱמָן.
  rationale: The main text gives the dynastic meaning directly, while the footnote preserves the house-building image.
