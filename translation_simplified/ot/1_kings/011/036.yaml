  text: But I will give one tribe to Solomon’s son. I will do this so that David my servant will always have a lamp[a] before me in Jerusalem. I have chosen that city for myself as the place to put my name.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The lamp pictures the continuing royal line of David; it may also be translated “light.”
    reason: lexical_alternative
