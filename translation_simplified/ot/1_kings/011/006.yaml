translation:
  language: en
  text: So Solomon did what was evil in Yahweh’s eyes. He did not follow Yahweh completely, as his father David had done.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: did what was evil in the eyes of Yahweh
  simplified_phrase: did what was evil in Yahweh’s eyes
  preserved_meaning: Solomon’s conduct was evil by Yahweh’s judgment.
  reasoning_layer_used: lexical decision for בְּעֵינֵי יְהוָה
  rationale: The possessive form is more natural while preserving the Hebrew image of Yahweh’s eyes.
- pob_phrase: and he did not fully follow Yahweh
  simplified_phrase: He did not follow Yahweh completely
  preserved_meaning: Solomon’s loyalty and obedience to Yahweh were incomplete.
  reasoning_layer_used: lexical and theological decisions for מִלֵּא אַחֲרֵי
  rationale: The recast clause makes the idiom clear without turning it into a claim of total apostasy.
- pob_phrase: as David his father had done
  simplified_phrase: as his father David had done
  preserved_meaning: David remains the father and model with whom Solomon is compared.
  reasoning_layer_used: lexical decision for כְּדָוִד אָבִיו
  rationale: Normal English name order makes the comparison easier to read.
translation_notes:
  risk_flags:
  - risk: “Completely” could be mistaken for a claim that David obeyed without any sin.
    mitigation: The wording preserves the verse’s comparison of covenant allegiance without adding a claim of sinlessness.
