translation:
  language: en
  text: Then Yahweh said to Solomon, “Because this is how you have been living,[a] and because you have not been faithful to my covenant and have not obeyed the laws I commanded you to follow, I will certainly tear the kingdom away from you and give it to your servant.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression describes Solomon’s settled conduct or condition; more literally, “this has been with you.”
    reason: lexical_alternative
  - marker: b
    text: Here “servant” means a royal subordinate.
    reason: cultural_note
