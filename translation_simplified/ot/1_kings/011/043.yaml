translation:
  language: en
  text: Then Solomon slept in death with his ancestors.[a] He was buried in the City of David, the royal city of his father. His son Rehoboam reigned in his place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “slept with his fathers,” a customary expression for dying and joining one’s ancestors.
    reason: lexical_alternative
