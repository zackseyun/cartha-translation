  preserved_meaning: Solomon died and joined those of his family who had died before him, while the sleep image remains.
  reasoning_layer_used: POB lexical decisions and footnote
  rationale: “In death” explains the Hebrew expression, and “ancestors” makes its family sense clear.
- pob_phrase: in the city of David his father
  simplified_phrase: in the City of David, the royal city of his father
  preserved_meaning: Solomon was buried in David’s royal city, and David was his father.
  reasoning_layer_used: POB lexical rationale
  rationale: The added description removes the awkward apposition while preserving the dynastic emphasis.
- pob_phrase: and Rehoboam his son reigned in his place
  simplified_phrase: His son Rehoboam reigned in his place.
  preserved_meaning: Rehoboam succeeded Solomon as king.
  reasoning_layer_used: POB lexical decision for תַּחְתָּיו
  rationale: A separate sentence makes the succession notice easier to follow without weakening its replacement sense.
