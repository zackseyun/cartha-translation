translation:
  language: en
  text: because they abandoned me, bowed down in worship to Ashtoreth[a], the god of the Sidonians, to Chemosh, the god of Moab, and to Milcom[b], the god of the Ammonites, and did not live according to my ways by doing what is right in my eyes and obeying my statutes and judgments, as his forefather David did.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the goddess of the Sidonians.” The Hebrew literally says “the god of the Sidonians,” though Ashtoreth is a female deity.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew text reads “Milcom” here; some associate this name with Molech.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: they have forsaken me
  simplified_phrase: they abandoned me
  preserved_meaning: They rejected and left God in covenant unfaithfulness.
  reasoning_layer_used: POB lexical decision for עֲזָבוּנִי
  rationale: “Abandoned” is common English while retaining the force of deliberate desertion.
- pob_phrase: have not walked in my ways
  simplified_phrase: did not live according to my ways
  preserved_meaning: Their conduct did not follow God’s prescribed way of life.
  reasoning_layer_used: POB lexical alternative for וְלֹא הָלְכוּ בִדְרָכַי
  rationale: The wording explains the Hebrew walking image as a pattern of life.
- pob_phrase: to do what is right in my eyes and my statutes and my judgments
  simplified_phrase: by doing what is right in my eyes and obeying my statutes and judgments
  preserved_meaning: Walking in God’s ways includes right conduct and adherence to his legal requirements.
  reasoning_layer_used: POB lexical decisions and applied awkward-English review
  rationale: Adding “obeying” makes the shared verb natural in English without merging the two legal terms.
