simplification_decisions:
- pob_phrase: There he came to the cave and spent the night there.
  simplified_phrase: When Elijah reached the cave, he spent the night there.
  preserved_meaning: Elijah arrived at the cave and stayed there overnight.
  reasoning_layer_used: Lexical decisions for וַיָּבֹא, הַמְּעָרָה, and וַיָּלֶן.
  rationale: The time clause and explicit name make the narrative easier to follow without changing the action.
- pob_phrase: And behold, the word of Yahweh came to him and said to him
  simplified_phrase: 'Then the word of Yahweh came to him:'
  preserved_meaning: Yahweh addressed Elijah through the standard prophetic word formula.
  reasoning_layer_used: Lexical and theological decisions for וְהִנֵּה and דְבַר יְהוָה.
  rationale: “Then” marks the new event, while the colon removes repetitive wording and introduces the message naturally.
- pob_phrase: What are you doing here, Elijah?
  simplified_phrase: What are you doing here, Elijah?
  preserved_meaning: The question probes Elijah’s presence and situation rather than only his motive.
  reasoning_layer_used: Lexical decision for מַה לְּךָ פֹה.
  rationale: The POB wording is already the clearest common-English rendering of the Hebrew idiom.
