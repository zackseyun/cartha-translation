translation:
  language: en
  text: He said, “I have been deeply zealous for Yahweh, the God of Armies, because the people of Israel have abandoned your covenant, torn down your altars, and killed your prophets with the sword. I alone am left, and they are trying to kill me.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I have been very zealous for Yahweh, the God of hosts
  simplified_phrase: I have been deeply zealous for Yahweh, the God of Armies
  preserved_meaning: Elijah emphatically describes his covenantal zeal for Yahweh, whose title evokes hosts or armies.
  reasoning_layer_used: Lexical decisions for קַנֹּא קִנֵּאתִי and אֱלֹהֵי צְבָאוֹת, with the theological decision on יְהוָה
  rationale: “Deeply zealous” keeps the intensified claim without adding service, while “Armies” clarifies the unfamiliar “hosts.”
- pob_phrase: the sons of Israel have forsaken your covenant
  simplified_phrase: the people of Israel have abandoned your covenant
  preserved_meaning: Israel as a covenant people has rejected Yahweh’s covenant.
  reasoning_layer_used: Lexical alternatives for בְּנֵי יִשְׂרָאֵל and עָזְבוּ בְרִיתְךָ
  rationale: The wording identifies the whole nation and expresses its grave breach in common English.
- pob_phrase: they seek my life, to take it
  simplified_phrase: they are trying to kill me
  preserved_meaning: Elijah says that others are actively seeking to take his life.
  reasoning_layer_used: Lexical decisions for וַיְבַקְשׁוּ אֶת נַפְשִׁי and לְקַחְתָּהּ
  rationale: The direct wording makes the Hebrew idiom immediately understandable.
translation_notes:
  risk_flags:
  - risk: “God of Armies” may sound limited to human armies rather than the broader hosts imagery.
    mitigation: The wording retains the documented lexical alternative and keeps it as Yahweh’s divine title.
