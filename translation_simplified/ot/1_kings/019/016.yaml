translation:
  language: en
  text: You must anoint Jehu son of Nimshi to be king over Israel. You must also anoint Elisha son of Shaphat, from Abel-meholah, to be prophet in your place.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “after you” or “instead of you”; the Hebrew can refer to succession or replacement.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And you shall anoint
  simplified_phrase: You must anoint
  preserved_meaning: God directs Elijah to commission each man by anointing him.
  reasoning_layer_used: Lexical decision for תִּמְשַׁח
  rationale: “Must” makes the command clear in modern English while retaining “anoint.”
- pob_phrase: as king over Israel
  simplified_phrase: to be king over Israel
  preserved_meaning: Jehu is appointed to royal authority over Israel.
  reasoning_layer_used: Lexical decisions for לְמֶלֶךְ and עַל יִשְׂרָאֵל
  rationale: “To be king” states the appointed role in more familiar wording.
- pob_phrase: and Elisha son of Shaphat from Abel-meholah you shall anoint as prophet in your place
  simplified_phrase: You must also anoint Elisha son of Shaphat, from Abel-meholah, to be prophet in your place
  preserved_meaning: Elisha, identified by family and hometown, is commissioned as Elijah’s prophetic successor.
  reasoning_layer_used: Lexical and theological decisions for מֵאָבֵל מְחוֹלָה, לְנָבִיא, and תַּחְתֶּיךָ
  rationale: A new sentence and ordinary word order make the second command easier to follow.
translation_notes:
  risk_flags:
  - risk: Modern readers may not know that anointing marked appointment to office.
    mitigation: The phrases “to be king” and “to be prophet” make the commissioning purpose clear without removing the biblical image.
  - risk: “In your place” may sound more abrupt than the Hebrew requires.
    mitigation: The footnote preserves the possible succession and replacement senses.
