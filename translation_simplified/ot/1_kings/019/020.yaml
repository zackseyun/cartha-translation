  preserved_meaning: Elisha leaves the draft animals and runs after Elijah to speak with him.
  reasoning_layer_used: Immediate narrative context and POB lexical decisions for “left,” “oxen,” and “ran after.”
  rationale: Naming Elisha and dividing the action into shorter sentences make the scene easier to follow.
- pob_phrase: Please let me kiss my father and my mother
