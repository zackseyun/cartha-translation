translation:
  language: en
  text: Elisha left the oxen and ran after Elijah. “Please let me kiss my father and mother goodbye,” he said. “Then I will follow you.” Elijah replied, “Go back, for what have I done to you?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Elijah’s reply is difficult. It may also mean, “Go back, for what have I done for you?” or may leave the decision to Elisha.
    reason: alternative_reading
