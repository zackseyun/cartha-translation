translation:
  language: en
  text: 'Then Jezebel sent a messenger to Elijah with this message: “May the gods[a] punish me severely if, by this time tomorrow, I have not killed you just as one of them was killed.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “May God punish me severely.” The Hebrew can mean “God” or “gods,” but the plural fits Jezebel’s setting and the plural verbs used here.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: sent a messenger to Elijah, saying
  simplified_phrase: sent a messenger to Elijah with this message
  preserved_meaning: Jezebel delivers her threat to Elijah through a human envoy.
  reasoning_layer_used: Lexical decision for מַלְאָךְ and לֵאמֹר
  rationale: The wording clearly introduces a message without suggesting a supernatural angel.
- pob_phrase: So may the gods do to me, and more also
  simplified_phrase: May the gods punish me severely
  preserved_meaning: Jezebel invokes severe divine punishment on herself if her oath fails.
  reasoning_layer_used: Lexical and theological decisions on the oath formula and אֱלֹהִים
  rationale: The plain oath wording preserves the plural gods and the formula’s intensifying force.
- pob_phrase: make your life like the life of one of them
  simplified_phrase: killed you just as one of them was killed
  preserved_meaning: Jezebel threatens Elijah with the same deadly fate as one of the slain prophets of Baal.
  reasoning_layer_used: Lexical decisions for נַפְשְׁךָ and כְּנֶפֶשׁ אַחַד מֵהֶם
  rationale: The direct wording makes the threatened death clear while retaining the comparison with one of them.
