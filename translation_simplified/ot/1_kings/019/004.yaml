translation:
  language: en
  text: But Elijah himself traveled a day’s journey into the wilderness. He sat down under a broom tree[a] and asked to die. He said, “I have had enough. Yahweh, take my life now, because I am no better than my fathers.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The broom tree is a desert shrub and may also be called a broom bush.
    reason: cultural_note
simplification_decisions:
- pob_phrase: he himself went a day's journey into the wilderness
  simplified_phrase: Elijah himself traveled a day’s journey into the wilderness
  preserved_meaning: Elijah personally traveled the distance normally covered in one day into the wilderness.
  reasoning_layer_used: Source idiom and immediate narrative context
  rationale: Naming Elijah clarifies the pronoun while “traveled” expresses the journey naturally.
- pob_phrase: came and sat down under a broom tree
  simplified_phrase: sat down under a broom tree
  preserved_meaning: After traveling, Elijah rested beneath the desert shrub.
  reasoning_layer_used: Lexical decision for רֹתֶם and narrative sequence
  rationale: The new sentence makes his arrival clear without repeating a separate verb for coming.
- pob_phrase: It is enough; now, Yahweh, take my life
  simplified_phrase: I have had enough. Yahweh, take my life now
  preserved_meaning: Elijah urgently tells Yahweh that he can endure no more and asks to die.
  reasoning_layer_used: Lexical decisions for רַב עַתָּה, יְהוָה, and נַפְשִׁי
  rationale: Two direct sentences preserve the plea’s urgency in common English.
translation_notes:
  risk_flags:
