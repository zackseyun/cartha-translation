translation:
  language: en
  text: 'When Elijah heard it,[a] he covered his face with his cloak. He went out and stood at the cave entrance. Then a voice spoke to him: “What are you doing here, Elijah?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew does not say exactly what Elijah heard; the context points to what immediately came before, whether understood as the sound or the voice.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: he wrapped his face in his cloak
  simplified_phrase: he covered his face with his cloak
  preserved_meaning: Elijah used his outer garment to conceal his face.
  reasoning_layer_used: Lexical decision for וַיָּלֶט and בְּאַדַּרְתּוֹ
  rationale: “Covered ... with” makes the physical action immediately clear while preserving the source image.
- pob_phrase: went out and stood at the entrance of the cave
  simplified_phrase: went out and stood at the cave entrance
  preserved_meaning: Elijah left the cave interior and took his place at its opening.
  reasoning_layer_used: Lexical decisions for וַיֵּצֵא, וַיַּעֲמֹד, and פֶּתַח הַמְּעָרָה
  rationale: The shorter wording expresses the same movement and location in natural English.
- pob_phrase: And behold, a voice came to him and said
  simplified_phrase: Then a voice spoke to him
  preserved_meaning: The narrative vividly presents a voice directly addressing Elijah.
  reasoning_layer_used: Lexical decisions for וְהִנֵּה and אֵלָיו קוֹל
  rationale: A new sentence with “Then” marks the vivid narrative turn without the unfamiliar expression “behold.”
translation_notes:
  risk_flags:
