translation:
  language: en
  text: He looked, and there beside his head was a loaf of bread baked on hot stones[a] and a jar of water. He ate and drank, then lay down again.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a loaf baked over coals.” The Hebrew may refer to heated stones used for baking or, more generally, to coals.
