translation:
  language: en
  text: So Elijah left that place and found Elisha son of Shaphat plowing. Twelve teams of two animals were ahead of him, and Elisha was working with the twelfth team.[a] Elijah passed by him and threw his cloak over him.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew describes twelve paired teams used for plowing, traditionally understood as twelve yokes of oxen.
    reason: simplification_note
  - marker: b
    text: Traditionally, “threw his mantle over him.” In this context, the cloak represents Elijah’s prophetic office.
    reason: lexical_alternative
