translation:
  language: en
  text: He answered, “I have been deeply loyal to Yahweh, the God who rules over all the armies of heaven and earth, because the sons of Israel have abandoned your covenant, torn down your altars, and killed your prophets with the sword. I am the only one left, and they are trying to take my life.”
