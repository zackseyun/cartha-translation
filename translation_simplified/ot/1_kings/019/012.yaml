  text: After the earthquake came a fire, but Yahweh was not in the fire. After the fire came a faint sound of stillness.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression is delicate and difficult; it may also be translated “a still small voice,” “a gentle whisper,” or “a low whisper.”
    reason: alternative_reading
