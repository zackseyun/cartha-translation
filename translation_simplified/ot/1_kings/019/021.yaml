translation:
  language: en
  text: Elisha turned back from following Elijah. He took his pair of oxen and sacrificed them. He used the oxen’s equipment as fuel to boil the meat. Then he gave the meat to the people, and they ate it. After that, he got up, followed Elijah, and served him.
