translation:
  language: en
  text: But Pharaoh’s daughter moved up from the City of David into the house Solomon had built for her. After that, Solomon built the structure called the Millo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The exact kind of structure is uncertain; the Hebrew term Millo may refer to a fortification, supporting terraces, or earthwork fill.
    reason: lexical_alternative
