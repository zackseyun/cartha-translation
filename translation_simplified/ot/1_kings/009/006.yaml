translation:
  language: en
  text: But if you or your sons[a] turn away and stop following me, do not obey the commandments and laws I have set before you, and go and serve other gods and bow down to them,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “you and your sons.” The warning concerns Solomon and his royal descendants.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: turn away from following me
  simplified_phrase: turn away and stop following me
  preserved_meaning: This keeps the image of turning while making the covenantal rejection immediately clear.
  reasoning_layer_used: Lexical decision for שׁוֹב תְּשֻׁבוּן and מֵאַחֲרַי
  rationale: The added plain verb explains the Hebrew idiom without weakening its emphatic force.
- pob_phrase: do not keep my commandments and my statutes
  simplified_phrase: do not obey the commandments and laws
  preserved_meaning: The wording still distinguishes two kinds of divine requirements.
  reasoning_layer_used: Lexical decisions for שׁמר, מִצְוֺתַי, and חֻקֹּתַי
  rationale: “Obey” and “laws” are clearer to common readers than covenantal “keep” and legal “statutes.”
- pob_phrase: you or your sons
  simplified_phrase: you or your sons
  preserved_meaning: The warning applies to Solomon or his royal descendants rather than to a general audience.
  reasoning_layer_used: Theological decision on dynastic scope
  rationale: The POB wording is retained because simplifying it would risk erasing the royal-line focus.
interpretive_expansions:
- pob_phrase: turn away from following me
  rendering: turn away and stop following me
  claim: Turning away means ceasing to follow the LORD in covenant loyalty.
  evidence:
  - The lexical rationale identifies the phrase as a covenantal idiom for apostasy.
  - The following service of other gods defines the direction of the turning.
  confidence: high
  alternatives_preserved:
  - turn away from following me
translation_notes:
  risk_flags:
  - risk: “Laws” is broader and less technical than “statutes.”
    mitigation: “Commandments and laws” remains a paired expression for distinct divine requirements.
  - risk: The Hebrew may be read as “you and your sons” rather than “you or your sons.”
    mitigation: The main text follows POB’s dynastic reading, and the alternative remains in a footnote.
