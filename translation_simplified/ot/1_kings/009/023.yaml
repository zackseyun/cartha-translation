translation:
  language: en
  text: These were the 550 chief officials[a] in charge of the work for Solomon. They had authority over the people doing the work.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression may also be understood as “chief officers of the deputies.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the chief officers of the deputies
  simplified_phrase: chief officials
  preserved_meaning: The 550 were leading appointed officials, without requiring a separate tier of deputies beneath them.
  reasoning_layer_used: POB lexical decisions and grounding review
  rationale: This clear title preserves the administrative role while the footnote retains the documented alternate structure.
- pob_phrase: who were over the work for Solomon
  simplified_phrase: in charge of the work for Solomon
  preserved_meaning: The officials managed work performed in Solomon’s service.
  reasoning_layer_used: POB lexical decisions for אֲשֶׁר עַל הַמְּלָאכָה and לִשְׁלֹמֹה
  rationale: The wording states responsibility and service in ordinary English.
- pob_phrase: ruling over the people who were doing the work
  simplified_phrase: had authority over the people doing the work
  preserved_meaning: The officials exercised real authority over the workers.
  reasoning_layer_used: POB lexical decision for הָרֹדִים
  rationale: “Had authority over” is clearer than “ruling over” without reducing the role to supervision.
translation_notes:
