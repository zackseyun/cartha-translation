    reason: simplification_note
simplification_decisions:
- pob_phrase: cut off Israel from the face of the land that I have given them
  simplified_phrase: cut Israel off from the land I gave them
  preserved_meaning: God threatens to remove Israel from its given land without claiming total annihilation.
  reasoning_layer_used: lexical and theological decisions
  rationale: The shorter wording keeps the covenant-judgment idiom while removing an unfamiliar expression.
- pob_phrase: the house that I have consecrated for my name
  simplified_phrase: the house that I set apart as holy to bear and honor my name
  preserved_meaning: The temple was made holy to bear and honor God’s name.
  reasoning_layer_used: lexical decisions and cultural footnote
  rationale: Common wording explains both consecration and the Hebrew name idiom.
- pob_phrase: I will cast out from before my face
  simplified_phrase: I will cast ... away from my presence
  preserved_meaning: God forcefully rejects the temple from his presence.
  reasoning_layer_used: lexical decision
  rationale: This replaces the bodily idiom with natural English without weakening the rejection.
