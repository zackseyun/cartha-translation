translation:
  language: en
  text: Then I will cut Israel off from the land I gave them. I will cast the house[a] that I set apart as holy to bear and honor my name away from my presence. Israel will become something all peoples speak of in mocking proverbs and taunts.
  philosophy: optimal-equivalence
  footnotes:
