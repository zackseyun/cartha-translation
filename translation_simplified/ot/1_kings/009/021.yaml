translation:
  language: en
  text: The children of these peoples were still left in the land after the earlier generation. The Israelites had not been able to devote them to destruction.[a] Solomon conscripted them for forced labor, and they remained in that service to this day.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “put them under the ban” or “utterly destroy them.” The Hebrew describes irrevocably devoting people or things to God’s judgment.
    reason: lexical_alternative
