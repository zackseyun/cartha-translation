translation:
  language: en
  text: Three times each year, Solomon offered burnt offerings and peace offerings on the altar he had built for Yahweh. He also burned incense in connection with that altar before Yahweh.[a] In this way he completed the temple.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may refer more broadly to making offerings go up in smoke, not only to burning incense.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says “the house,” meaning the temple.
    reason: simplification_note
