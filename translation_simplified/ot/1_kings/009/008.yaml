  text: This temple will become a ruin.[a] Everyone who passes by it will be appalled and give a sharp whistle.[b] They will ask, “Why has Yahweh done this to this land and this temple?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew reads “this house will be high” or “exalted.” Here it is understood to describe the house as a ruin; compare 2 Chronicles 7:21.
    reason: textual_variant
  - marker: b
    text: Or “hiss.” The sound may express astonishment or scorn.
    reason: lexical_alternative
