translation:
  language: en
  text: Pharaoh, king of Egypt, had gone up and captured Gezer. He set the city on fire and killed the Canaanites living there. Then he gave Gezer to his daughter, Solomon’s wife, as a wedding gift.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew describes a marriage-related gift; it can also be translated “dowry.”
    reason: lexical_alternative
