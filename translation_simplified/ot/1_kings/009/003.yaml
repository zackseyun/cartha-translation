- pob_phrase: I have consecrated
  simplified_phrase: I have set apart as holy
  preserved_meaning: Yahweh designated the house as holy for divine use.
  reasoning_layer_used: Lexical decision for הִקְדַּשְׁתִּי
  rationale: The clearer phrase retains the full sacred force of “consecrated.”
- pob_phrase: this house that you built
  simplified_phrase: this house—the temple you built
  preserved_meaning: The house is Solomon’s temple while remaining Yahweh’s house.
  reasoning_layer_used: POB footnote and lexical decision for הַבַּיִת הַזֶּה
  rationale: The apposition identifies the building without replacing the source image of a house.
- pob_phrase: all the days
  simplified_phrase: always
  preserved_meaning: Yahweh’s eyes and heart remain there continually.
  reasoning_layer_used: Lexical decision for כָּל הַיָּמִים and grounding review
  rationale: “Always” clearly expresses ongoing duration rather than recurring daily action.
