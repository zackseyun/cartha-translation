translation:
  language: en
  text: Yahweh said to him, “I have heard your prayer and your plea for favor that you made before me. I have set apart as holy this house—the temple you built—to put my name there forever. My eyes and my heart will always be there.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “My eyes and my heart” pictures Yahweh’s continuing attention and concern.
    reason: cultural_note
