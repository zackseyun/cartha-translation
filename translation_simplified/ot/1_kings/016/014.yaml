  preserved_meaning: The rhetorical question expects that these deeds are preserved in an official record.
  reasoning_layer_used: Lexical decision for הֲלוֹא הֵם כְּתוּבִים
  rationale: “Recorded” is clearer for archival writing while retaining the rhetorical question.
