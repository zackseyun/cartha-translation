translation:
  language: en
  text: But Omri’s supporters gained the upper hand[a] over the supporters of Tibni son of Ginath. Then Tibni died, and Omri became king.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “became stronger than.” The Hebrew describes Omri’s supporters prevailing over the rival group.
    reason: lexical_alternative
