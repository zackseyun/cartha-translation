  simplified_phrase: Omri’s supporters
  preserved_meaning: The people were politically aligned with Omri.
  reasoning_layer_used: POB lexical decision for הָעָם אֲשֶׁר אַחֲרֵי עָמְרִי
  rationale: “Supporters” states the political allegiance more directly.
- pob_phrase: prevailed over the people who followed Tibni
  simplified_phrase: gained the upper hand over the supporters of Tibni
  preserved_meaning: Omri’s faction became superior to Tibni’s faction in the civil conflict.
  reasoning_layer_used: POB lexical decision for וַיֶּחֱזַק with אֶת and cross-check summary
  rationale: The common idiom keeps the sense of prevailing without specifying how Tibni’s side was overcome.
