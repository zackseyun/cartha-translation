translation:
  language: en
  text: As soon as he became king and sat on his throne, he killed everyone in Baasha’s royal house. He left no male survivor[a], and he spared none of Baasha’s relatives[b] or friends.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “one who urinates against a wall,” a coarse idiom for a male.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term means a close relative with family duties, which could include redeeming property or avenging bloodshed.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And it happened that when he became king, as soon as he sat on his throne
  simplified_phrase: As soon as he became king and sat on his throne
  preserved_meaning: His attack began immediately when he took the throne.
  reasoning_layer_used: Lexical decisions for וַיְהִי, בְמָלְכוֹ, and כְשִׁבְתּוֹ עַל־כִּסְאוֹ
  rationale: The shorter opening keeps the immediate sequence without the formal narrative lead-in.
- pob_phrase: all the house of Baasha
  simplified_phrase: everyone in Baasha’s royal house
  preserved_meaning: He destroyed Baasha’s dynasty rather than a physical building.
  reasoning_layer_used: Lexical decision for אֶת כָּל בֵּית בַּעְשָׁא
  rationale: Adding “royal” makes the dynastic meaning of “house” clear.
- pob_phrase: He did not leave him a single male, or any of his kinsmen or his friends
  simplified_phrase: He left no male survivor, and he spared none of Baasha’s relatives or friends
  preserved_meaning: No male, obligated relative, or friend connected with Baasha was left alive.
  reasoning_layer_used: Lexical decisions for לֹא הִשְׁאִיר לוֹ, מַשְׁתִּין בְּקִיר, וְגֹאֲלָיו, and וְרֵעֵהוּ
  rationale: The recast sentence states the lethal outcome plainly while keeping each group distinct.
translation_notes:
