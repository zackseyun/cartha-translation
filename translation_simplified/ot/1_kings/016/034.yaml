translation:
  language: en
  text: During Ahab’s reign, Hiel from Bethel rebuilt Jericho. When he laid its foundation, it cost him the life of Abiram, his firstborn son. When he set up its gates, it cost him the life of Segub, his youngest son.[a] This fulfilled the word Yahweh had spoken through Joshua son of Nun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “in/with Abiram, his firstborn” and “in/with Segub, his youngest.” In light of Joshua 6:26, this is best understood to mean that Hiel lost these sons.
    reason: alternative_reading
