translation:
  language: en
  text: Ahab also made the Asherah.[a] He went on to provoke Yahweh, the God of Israel, more than any earlier king of Israel had done.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term may mean the goddess Asherah or an object used in her worship, often called an Asherah pole.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: and Ahab went on to do more to provoke Yahweh
  simplified_phrase: He went on to provoke Yahweh ... more
  preserved_meaning: Ahab continued his actions and exceeded his predecessors in provoking Yahweh.
  reasoning_layer_used: Lexical decisions for וַיּוֹסֶף, לַעֲשׂוֹת, and לְהַכְעִיס
  rationale: The recast removes the abstract phrase “do more” while retaining continuation, provocation, and escalation.
- pob_phrase: than all the kings of Israel who were before him
  simplified_phrase: than any earlier king of Israel had done
  preserved_meaning: Ahab surpassed every previous Israelite king in provoking Yahweh.
  reasoning_layer_used: Lexical decisions for the comparative phrase and אֲשֶׁר הָיוּ לְפָנָיו
  rationale: “Any earlier king” states the same comparison in more direct modern English.
