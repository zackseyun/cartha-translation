translation:
  language: en
  text: Yahweh also spoke through the prophet Jehu son of Hanani. Yahweh’s word condemned Baasha and his house for all the evil Baasha had done in Yahweh’s sight. By what his own hands had done, Baasha provoked Yahweh to anger and became like the house of Jeroboam. Yahweh’s word also condemned Baasha and his house because Baasha struck him down.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The singular Hebrew pronoun may refer to Jeroboam personally or, more likely here, to Jeroboam’s house or dynasty as a whole.
    reason: alternative_reading
