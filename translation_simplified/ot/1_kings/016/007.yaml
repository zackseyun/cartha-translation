  simplified_phrase: Yahweh also spoke through the prophet Jehu son of Hanani. Yahweh’s word condemned Baasha and his house
  preserved_meaning: Jehu is Yahweh’s prophetic messenger, and the message judges both Baasha and his ruling house.
  reasoning_layer_used: Lexical decisions for בְּיַד, דְּבַר יְהוָה, אֶל, and בֵּיתוֹ
  rationale: Two direct sentences clarify the prophetic agency and adversarial force.
- pob_phrase: provoking him to anger by the work of his hands
  simplified_phrase: By what his own hands had done, Baasha provoked Yahweh to anger
  preserved_meaning: Baasha’s own actions angered Yahweh, while the concrete image of his hands remains.
  reasoning_layer_used: Lexical decisions for לְהַכְעִיסוֹ and בְּמַעֲשֵׂה יָדָיו
  rationale: Explicit names remove unclear pronouns without weakening the image.
- pob_phrase: and because he struck him down
  simplified_phrase: Yahweh’s word also condemned Baasha and his house because Baasha struck him down
  preserved_meaning: The second ground applies to Yahweh’s judgment against both Baasha and his house, with Baasha as the actor.
  reasoning_layer_used: POB syntax, lexical decision for וְעַל אֲשֶׁר הִכָּה אֹתוֹ, and grounding review
  rationale: Repeating the judgment makes its scope and Baasha’s role explicit.
