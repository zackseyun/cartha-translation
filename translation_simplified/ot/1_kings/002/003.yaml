  text: Carry out the duty Yahweh your God has entrusted to you. Walk in his ways and obey his laws, commands, legal rulings, and covenant instructions, as written in the Law of Moses, so that you may act wisely in everything you do and wherever you turn.[a]
  philosophy: optimal-equivalence
  footnotes:
