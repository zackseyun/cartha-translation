translation:
  language: en
  text: The king said to Abiathar the priest, “Go to your field at Anathoth. You deserve to die,[a] but I will not put you to death today. I will spare you because you carried the ark of the Lord Yahweh before my father David and shared in all the suffering he endured.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says “a man of death,” meaning someone liable to execution.
    reason: lexical_alternative
