translation:
  language: en
  text: So Solomon forced Abiathar out of his role as a priest of Yahweh. In this way, the word Yahweh had spoken at Shiloh concerning Eli’s family was fulfilled.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Solomon did this in order to fulfill the word of Yahweh.” The Hebrew may express either purpose or result.
    reason: alternative_reading
  - marker: b
    text: See 1 Samuel 2:27–36 and 3:11–14 for Yahweh’s word against Eli’s family.
    reason: cross_reference
simplification_decisions:
- pob_phrase: drove Abiathar out from being priest
  simplified_phrase: forced Abiathar out of his role as a priest
  preserved_meaning: Solomon forcefully expelled Abiathar from his priestly office.
  reasoning_layer_used: Lexical decisions for וַיְגָרֶשׁ and מִהְיוֹת כֹּהֵן.
  rationale: This natural wording preserves both the force of expulsion and the loss of office.
- pob_phrase: priest to Yahweh
  simplified_phrase: a priest of Yahweh
  preserved_meaning: Abiathar’s priestly service was directed to Yahweh.
  reasoning_layer_used: Lexical decision for כֹּהֵן לַיהוָה and divine-name policy.
  rationale: “Priest of Yahweh” is clear modern English and retains Yahweh’s personal name.
- pob_phrase: the house of Eli
  simplified_phrase: Eli’s family
  preserved_meaning: The prior divine word concerned Eli’s family line.
  reasoning_layer_used: Lexical decision for עַל בֵּית עֵלִי and narrative context.
  rationale: “Family” clearly expresses the dynastic meaning of “house” in this context.
