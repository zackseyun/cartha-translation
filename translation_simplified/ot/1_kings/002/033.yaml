translation:
  language: en
  text: The guilt for their blood will come back on Joab’s head and on the heads of his descendants forever.[a] But David, his descendants, his royal house, and his throne will have peace from Yahweh forever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally “their blood”; this means responsibility for the blood they shed.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: their blood shall return on the head of Joab
  simplified_phrase: The guilt for their blood will come back on Joab’s head
  preserved_meaning: Joab bears the guilt and consequences of the bloodshed.
  reasoning_layer_used: Lexical decisions for וְשָׁבוּ, דְמֵיהֶם, and בְּרֹאשׁ.
  rationale: This explains the judicial idiom while preserving the image of guilt returning on his head.
- pob_phrase: on the head of his offspring
  simplified_phrase: on the heads of his descendants
  preserved_meaning: The judgment extends to Joab’s posterity.
  reasoning_layer_used: Lexical decision for זַרְעוֹ.
  rationale: “Descendants” clearly expresses the collective posterity while retaining the head image.
- pob_phrase: for his house
  simplified_phrase: his royal house
  preserved_meaning: David’s dynasty is included in the promise of peace.
  reasoning_layer_used: Lexical and theological decisions concerning David’s house and throne.
  rationale: “Royal” makes the dynastic sense clear without merging the house with the throne.
interpretive_expansions:
- pob_phrase: their blood
  rendering: The guilt for their blood
  claim: The blood refers to responsibility for the people Joab killed.
  evidence:
