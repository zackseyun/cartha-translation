translation:
  language: en
  text: He said, “You know that the kingdom was mine and that all Israel looked to me to become king. But the kingdom turned away from me and became my brother’s, because it came to him from Yahweh.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: all Israel had set their faces on me to reign
  simplified_phrase: all Israel looked to me to become king
  preserved_meaning: Israel expected Adonijah to exercise the kingship.
  reasoning_layer_used: POB lexical decisions and footnote a
  rationale: The documented alternative states the Hebrew idiom in natural modern English.
- pob_phrase: the kingdom turned and became my brother’s
  simplified_phrase: the kingdom turned away from me and became my brother’s
  preserved_meaning: The expected succession reversed course and passed to Solomon.
  reasoning_layer_used: POB lexical decisions for וַתִּסֹּב and וַתְּהִי לְאָחִי
  rationale: Adding “away from me” makes the direction of the retained turning image clear.
- pob_phrase: for it was his from Yahweh
  simplified_phrase: because it came to him from Yahweh
  preserved_meaning: Solomon’s kingdom had Yahweh as its divine source.
  reasoning_layer_used: POB footnote b and theological decision on divine appointment
  rationale: The approved alternative is clearer without adding an explicit act of giving.
interpretive_expansions:
- pob_phrase: the kingdom turned
  rendering: the kingdom turned away from me
  claim: The reversal moved the kingdom away from Adonijah’s expected possession.
  evidence:
  - The preceding clauses present the kingdom as Adonijah’s expected rule.
  - The POB lexical rationale describes וַתִּסֹּב as a reversal or transfer.
  confidence: high
  alternatives_preserved:
  - the kingdom turned
  - the kingdom shifted
translation_notes:
