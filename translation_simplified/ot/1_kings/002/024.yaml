translation:
  language: en
  text: And now, as surely as Yahweh lives—the one who has firmly established me as king, seated me on the throne of my father David, and established a royal house for me[a] as he promised—Adonijah will be put to death today.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Royal house” means a lasting family line of kings, or a dynasty.
    reason: lexical_alternative
