  simplified_phrase: as surely as Yahweh lives
  preserved_meaning: Solomon solemnly swears by the living reality of Yahweh.
  reasoning_layer_used: POB lexical decision for חַי יְהוָה
  rationale: Adding “surely” makes the Hebrew oath formula clear in modern English.
- pob_phrase: has established me
  simplified_phrase: has firmly established me as king
  preserved_meaning: Yahweh has confirmed and secured Solomon in his royal position.
  reasoning_layer_used: POB lexical rationale and immediate throne context
  rationale: The wording clarifies what Solomon has been established to be without merging it with his enthronement.
- pob_phrase: has made for me a house
  simplified_phrase: established a royal house for me
  preserved_meaning: Yahweh has given Solomon an enduring royal family line as promised.
  reasoning_layer_used: POB theological decision on royal covenant language
  rationale: “Royal house” keeps the biblical house image while signaling its dynastic sense.
