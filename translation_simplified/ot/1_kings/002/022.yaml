translation:
  language: en
  text: King Solomon replied to his mother, “Why are you asking for Abishag the Shunammite to be given to Adonijah as his wife? You might as well ask for the right to rule as king[a] for him too, since he is my older brother—and for him, for Abiathar the priest, and for Joab son of Zeruiah!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the kingdom” or “the throne.” Here the Hebrew refers to royal rule and the right to reign.
    reason: lexical_alternative
