  preserved_meaning: The narrative draws attention to Joab’s location at the altar.
  reasoning_layer_used: Lexical decisions for וְהִנֵּה and אֵצֶל הַמִּזְבֵּחַ
  rationale: Naming Joab removes pronoun ambiguity, while “there” retains the sudden focus on his location.
- pob_phrase: sent Benaiah son of Jehoiada, saying
