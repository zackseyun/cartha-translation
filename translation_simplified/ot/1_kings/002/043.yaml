translation:
  language: en
  text: Why, then, did you not keep the oath you made before Yahweh and obey the command I gave you?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated “the oath of Yahweh,” meaning an oath made in Yahweh’s name or under his authority.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the oath of Yahweh
  simplified_phrase: the oath you made before Yahweh
  preserved_meaning: The oath was binding before Yahweh and was not an oath spoken by Yahweh.
  reasoning_layer_used: POB lexical rationale and footnote a
  rationale: The clearer wording prevents readers from mistaking Yahweh for the one who swore the oath.
- pob_phrase: the command that I commanded you
  simplified_phrase: obey the command I gave you
  preserved_meaning: The speaker imposed a command that the hearer was obligated to follow.
  reasoning_layer_used: POB lexical decisions for מִצְוָה, צוה, and עַל
  rationale: Using “obey” removes awkward repetition while retaining the command’s binding force.
interpretive_expansions:
- pob_phrase: the oath of Yahweh
  rendering: the oath you made before Yahweh
  claim: The hearer made the oath with Yahweh as its divine witness and authority.
  evidence:
  - The POB rationale says the phrase does not describe an oath spoken by Yahweh.
  - POB footnote a identifies an oath made in Yahweh’s name or under his authority.
  confidence: high
  alternatives_preserved:
  - the oath of Yahweh
  - the oath to Yahweh
  - an oath made in Yahweh’s name
translation_notes:
  risk_flags:
  - risk: “Before Yahweh” does not specify whether the oath was made in his name or directly to him.
    mitigation: Footnote a preserves both closely related understandings without over-resolving them.
