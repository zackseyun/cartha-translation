  text: You also know what Joab son of Zeruiah did to me. He killed two commanders of Israel’s armies—Abner son of Ner and Amasa son of Jether. He committed wartime bloodshed in a time of peace, staining the belt around his waist and the sandals on his feet with their blood.[a]
  philosophy: optimal-equivalence
