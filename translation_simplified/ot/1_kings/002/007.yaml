translation:
  language: en
  text: But treat the sons of Barzillai the Gileadite with kindness.[a] Give them a regular place at your table,[b] because they stood by me when I fled from your brother Absalom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “deal loyally with them,” describing kindness expressed through faithful action.
    reason: lexical_alternative
  - marker: b
    text: A regular place at the king’s table meant continuing royal provision and favor.
    reason: cultural_note
