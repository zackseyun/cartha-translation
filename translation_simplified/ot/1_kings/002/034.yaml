translation:
  language: en
  text: Then Benaiah son of Jehoiada went up and struck Joab down. He put him to death, and Joab was buried at his home[a] in the wilderness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “At his home” may mean on his family property or estate.
    reason: cultural_note
simplification_decisions:
- pob_phrase: went up, struck him down, and put him to death
  simplified_phrase: went up and struck Joab down. He put him to death
  preserved_meaning: Benaiah first attacked Joab and then caused his death as an execution.
  reasoning_layer_used: POB lexical decisions for וַיַּעַל, וַיִּפְגַּע בּוֹ, and וַיְמִתֵהוּ
  rationale: Two short sentences clarify the sequence while keeping the assault and killing distinct.
- pob_phrase: he was buried at his house
  simplified_phrase: Joab was buried at his home
  preserved_meaning: The executed man was buried at or near his residence or property.
  reasoning_layer_used: POB lexical decision and cultural note for בְּבֵיתוֹ
  rationale: Naming Joab removes pronoun confusion, and “home” is more natural than “house” in this burial notice.
interpretive_expansions:
- pob_phrase: him; and he was buried
  rendering: Joab; and Joab was buried
  claim: The attacked, executed, and buried man is Joab.
  evidence:
