translation:
  language: en
  text: Then the king summoned Shimei and said to him, “Did I not make you swear by Yahweh and warn you, ‘On the day you go out and travel anywhere at all, you can be certain that you will die’? And you answered me, ‘What you said is good. I have heard.’”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: sent and called for Shimei
  simplified_phrase: summoned Shimei
  preserved_meaning: The king ordered Shimei to come before him.
  reasoning_layer_used: source syntax and immediate context
  rationale: “Summoned” expresses the two-part Hebrew action naturally in one English verb.
- pob_phrase: know for certain that you shall surely die
  simplified_phrase: you can be certain that you will die
  preserved_meaning: Shimei’s death was presented as the certain consequence of leaving.
  reasoning_layer_used: lexical decision on both emphatic Hebrew constructions
  rationale: The wording keeps the doubled emphasis on certainty without archaic “shall surely.”
- pob_phrase: The word is good
  simplified_phrase: What you said is good
  preserved_meaning: Shimei called the king’s stated condition good.
  reasoning_layer_used: lexical alternatives for דָּבָר
  rationale: The approved speech-focused alternative is clearer than the literal phrase “the word.”
translation_notes:
  risk_flags:
  - risk: “Summoned” compresses the separate actions of sending and calling.
    mitigation: The single verb preserves their combined function without changing the event.
  - risk: “What you said is good” may sound like explicit agreement.
    mitigation: The separate statement “I have heard” remains literal and does not add obedience or acceptance.
