translation:
  language: en
  text: So that Yahweh may make come true what he said about me:[a] “If your sons are careful to walk faithfully[b] before me with all their heart and soul, you will not lack a male descendant on Israel’s throne.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew “about me”; some translations have “to me.”
    reason: alternative_reading
  - marker: b
    text: “Faithfully” may also be rendered “in truth” or “with integrity.”
    reason: lexical_alternative
  - marker: c
    text: The Hebrew image is literally “a man of yours shall not be cut off from upon the throne of Israel.”
    reason: source_note
simplification_decisions:
- pob_phrase: so that Yahweh may establish his word that he spoke concerning me
  simplified_phrase: So that Yahweh may make come true what he said about me
  preserved_meaning: Yahweh will confirm the word he spoke concerning David.
  reasoning_layer_used: Lexical decisions for לְמַעַן, יָקִים, דְּבָרוֹ, and דִּבֶּר עָלַי
  rationale: This expresses the purpose and fulfillment of Yahweh’s word in common English.
- pob_phrase: keep their way by walking before me in truth
  simplified_phrase: are careful to walk faithfully before me
  preserved_meaning: David’s sons must maintain faithful conduct in Yahweh’s presence.
  reasoning_layer_used: Lexical decisions for יִשְׁמְרוּ, דַּרְכָּם, לָלֶכֶת לְפָנַי, and בֶּאֱמֶת
  rationale: This uses natural English while retaining the walking image and faithful conduct.
- pob_phrase: A man of yours shall not be cut off from upon the throne of Israel
  simplified_phrase: you will not lack a male descendant on Israel’s throne
  preserved_meaning: David will continue to have a male dynastic descendant occupying Israel’s throne.
  reasoning_layer_used: Lexical decisions for לֹא יִכָּרֵת לְךָ אִישׁ and מֵעַל כִּסֵּא יִשְׂרָאֵל
  rationale: This states the Hebrew idiom clearly while preserving its individual male and dynastic force.
interpretive_expansions:
- pob_phrase: A man of yours
  rendering: a male descendant
  claim: The promised man is one of David’s male dynastic descendants.
  evidence:
  - The condition concerns David’s sons.
  - The promised position is Israel’s throne.
  - POB identifies the expression as dynastic.
  confidence: high
  alternatives_preserved:
  - a man of yours
  - one of your descendants
