translation:
  language: en
  text: And take note of Shimei son of Gera, a Benjaminite from Bahurim, who is with you. He called down a terrible curse on me when I was going to Mahanaim. Yet he came down to meet me at the Jordan, and I swore to him by Yahweh, “I will not put you to death with the sword.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says, “if I put you to death with the sword,” an incomplete oath formula meaning, “I will not put you to death with the sword.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And behold, with you is Shimei
  simplified_phrase: And take note of Shimei ... who is with you
  preserved_meaning: David draws Solomon’s attention to Shimei, who is within Solomon’s sphere.
  reasoning_layer_used: Lexical decision for וְהִנֵּה and עִמְּךָ.
  rationale: “Take note” carries the attention-directing force without the archaic “behold.”
- pob_phrase: he cursed me with a grievous curse
  simplified_phrase: He called down a terrible curse on me
  preserved_meaning: Shimei directed an intensely severe curse against David.
  reasoning_layer_used: Lexical decisions for קִלְּלַנִי קְלָלָה and נִמְרֶצֶת.
  rationale: The active expression keeps the curse image and its emphatic severity in natural English.
- pob_phrase: on the day I went to Mahanaim. But he came down
  simplified_phrase: when I was going to Mahanaim. Yet he came down
  preserved_meaning: The curse occurred during David’s journey, while Shimei’s later meeting contrasts with it.
  reasoning_layer_used: Lexical decisions for the temporal clause and יָרַד לִקְרָאתִי.
  rationale: Shorter clauses clarify the sequence while “yet” preserves the contrast.
