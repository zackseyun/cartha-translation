translation:
  language: en
  text: 'Then Benaiah went to Yahweh’s tent and said to Joab, “This is what the king says: ‘Come out.’”


    Joab answered, “No. I will die here.”


    So Benaiah returned to the king and reported, “This is what Joab said, and this is how he answered me.”'
  philosophy: optimal-equivalence
