simplification_decisions:
- pob_phrase: And Adonijah was afraid because of Solomon, so
  simplified_phrase: Adonijah was afraid because of Solomon. So
  preserved_meaning: Solomon was the cause of Adonijah’s fear, and that fear led to his action.
  reasoning_layer_used: Lexical decisions for יָרֵא and מִפְּנֵי, including the doctrine-realignment revision.
  rationale: Dividing the long sequence makes the cause and response easier to follow without changing the chosen wording.
- pob_phrase: he arose
  simplified_phrase: he got up
  preserved_meaning: Adonijah rose before going to the altar.
  reasoning_layer_used: Lexical decision for וַיָּקָם.
  rationale: “Got up” is ordinary modern English for the same narrative action.
- pob_phrase: took hold of the horns of the altar
  simplified_phrase: took hold of the horns of the altar
  preserved_meaning: The physical act and its cultic image remain explicit.
  reasoning_layer_used: Lexical and theological decisions for וַיַּחֲזֵק, קַרְנוֹת, and the asylum gesture.
  rationale: The altar’s horns are retained because replacing the image with “sought refuge” would over-explain the action.
