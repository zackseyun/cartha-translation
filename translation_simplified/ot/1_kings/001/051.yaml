translation:
  language: en
  text: Solomon was told, “Look! Adonijah is afraid of King Solomon. He has taken hold of the horns of the altar[a] and is saying, ‘King Solomon, please swear to me today that you will not kill me, your servant, with the sword.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The horns were raised projections at the corners of the altar.
    reason: cultural_note
simplification_decisions:
- pob_phrase: And it was reported to Solomon, saying
  simplified_phrase: Solomon was told
  preserved_meaning: Someone brought Solomon a report.
  reasoning_layer_used: POB translation and source narrative syntax
  rationale: The passive reporting formula is recast in ordinary English without changing the event.
- pob_phrase: Let King Solomon swear to me today
  simplified_phrase: King Solomon, please swear to me today
  preserved_meaning: Adonijah respectfully asks Solomon to make an oath that day.
  reasoning_layer_used: POB translation and immediate narrative context
  rationale: “Please” makes the request clear without turning it into a demand.
- pob_phrase: he will not put his servant to death with the sword
  simplified_phrase: you will not kill me, your servant, with the sword
  preserved_meaning: Adonijah asks Solomon not to execute him while explicitly humbling himself as Solomon’s servant.
  reasoning_layer_used: POB translation and direct-speech context
  rationale: First-person wording improves clarity while retaining Adonijah’s language of submission.
translation_notes:
  risk_flags:
  - risk: Directly addressing Solomon slightly reshapes the POB’s third-person royal wording.
    mitigation: The oath request, royal title, and deferential force are all preserved.
