translation:
  language: en
  text: Adonijah sacrificed sheep, cattle, and fattened animals beside the stone of Zoheleth, near En-rogel. He invited all his brothers—the king’s sons—and all the men of Judah who served the king.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: These men may have been royal attendants or officials.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: which is beside En-rogel
  simplified_phrase: near En-rogel
  preserved_meaning: The stone of Zoheleth was located close to En-rogel.
  reasoning_layer_used: POB lexical decision for the two place-names
  rationale: The shorter location phrase is easier to follow and keeps both names.
- pob_phrase: all his brothers, the king’s sons
  simplified_phrase: all his brothers—the king’s sons
  preserved_meaning: The king’s sons are the brothers being identified.
  reasoning_layer_used: POB lexical rationale on apposition
  rationale: The dash makes the identifying relationship immediately clear.
- pob_phrase: all the men of Judah, the king’s servants
  simplified_phrase: all the men of Judah who served the king
  preserved_meaning: The invited Judean men were in the king’s service.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The clause clarifies the relationship while retaining the masculine reference.
interpretive_expansions:
- pob_phrase: the men of Judah, the king’s servants
  rendering: the men of Judah who served the king
  claim: The final phrase identifies the men of Judah as people in royal service.
  evidence:
  - The POB places “the king’s servants” in apposition to “the men of Judah.”
  - The lexical rationale says the term can refer to service in a royal administrative setting.
  confidence: high
  alternatives_preserved:
  - royal attendants
  - royal officials
