- pob_phrase: Call Bathsheba to me
  simplified_phrase: Call Bathsheba to me
  preserved_meaning: David commands that Bathsheba be summoned into his presence.
  reasoning_layer_used: POB lexical decision and rationale for קִרְאוּ לִי
  rationale: Keeping “Call” avoids implying that Bathsheba was physically brought or escorted.
- pob_phrase: she came before the king and stood before the king
  simplified_phrase: She came into the king’s presence and stood before him
  preserved_meaning: Bathsheba entered the formal royal presence and stood there.
  reasoning_layer_used: POB lexical decisions for בוא + לפני and עמד + לפני
  rationale: The wording clarifies the courtly setting while preserving both actions.
