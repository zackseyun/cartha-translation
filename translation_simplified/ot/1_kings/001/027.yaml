  preserved_meaning: The question concerns the future successor to the living king.
  reasoning_layer_used: Lexical decisions for מִי יֵשֵׁב, עַל כִּסֵּא, and אַחֲרָיו
  rationale: Direct address removes repeated titles while preserving the future reference, throne image, and succession sense.
