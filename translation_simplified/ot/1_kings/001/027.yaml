  preserved_meaning: The speaker pointedly asks why the king's officials were not informed.
  reasoning_layer_used: Lexical and theological decisions for וְלֹא הוֹדַעְתָּ and עֲבָדֶיךָ
  rationale: “Tell” is natural English, while “servants” preserves the courtly relationship.
- pob_phrase: who will sit on the throne of my lord the king after him
