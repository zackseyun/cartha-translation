translation:
  language: en
  text: Just as Yahweh has been with you, my lord the king, may he also be with Solomon. May he make Solomon’s throne greater than yours, my lord King David.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Just as Yahweh has been with my lord the king, so may he be with Solomon
  simplified_phrase: Just as Yahweh has been with you, my lord the king, may he also be with Solomon.
  preserved_meaning: Yahweh’s presence with David is the basis for the wish that he also be with Solomon.
  reasoning_layer_used: POB lexical decisions for the correlative construction, divine accompaniment, and courtly address
  rationale: Direct address with “you” makes the relationship clear without changing Benaiah’s respectful wording.
- pob_phrase: and make his throne greater than the throne of my lord King David
  simplified_phrase: May he make Solomon’s throne greater than yours, my lord King David.
  preserved_meaning: The blessing asks Yahweh to make Solomon’s throne greater than David’s while retaining the concrete throne image.
  reasoning_layer_used: POB lexical decisions for וִיגַדֵּל, כִּסְאוֹ, and the comparative מִן phrase
  rationale: A new sentence and explicit names remove pronoun confusion while preserving the comparison.
translation_notes:
  risk_flags:
  - risk: “Throne” may be read only as a physical seat rather than as an image of royal rule.
    mitigation: The concrete source image is retained, and the surrounding references to Solomon and King David supply the royal sense.
