translation:
  language: en
  text: His father had never challenged him by asking,[a] “Why did you do that?” He was also very handsome, and his mother gave birth to him after Absalom was born.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean that his father never caused him pain or displeasure; here it points to his failure to correct him.
    reason: lexical_alternative
