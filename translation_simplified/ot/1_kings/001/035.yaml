translation:
  language: en
  text: Then follow him as he goes up. When he arrives, he will sit on my throne and reign in my place. I have appointed him[a] as ruler over Israel and over Judah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “I have commanded him to be prince or leader over Israel and over Judah.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: you shall go up after him
  simplified_phrase: follow him as he goes up
  preserved_meaning: They are to go behind Solomon as he ascends in the royal procession.
  reasoning_layer_used: Lexical decisions for וַעֲלִיתֶם and אַחֲרָיו
  rationale: The new wording makes the movement and act of following immediately clear.
- pob_phrase: he shall come and sit on my throne
  simplified_phrase: When he arrives, he will sit on my throne
  preserved_meaning: Solomon will arrive and take the royal seat.
  reasoning_layer_used: Lexical decision for וּבָא and enthronement language for וְיָשַׁב עַל כִּסְאִי
  rationale: The time clause turns the Hebrew sequence into natural English without weakening the throne image.
- pob_phrase: I have appointed him to be ruler
  simplified_phrase: I have appointed him as ruler
  preserved_meaning: David has designated Solomon for ruling office.
  reasoning_layer_used: Lexical and theological decisions for צִוִּיתִי and נָגִיד
  rationale: This keeps “ruler” distinct from “reign” while removing an unnecessary infinitive phrase.
translation_notes:
  risk_flags:
  - risk: “When he arrives” is slightly less literal than “he shall come.”
    mitigation: It preserves the same sequence and leaves the destination unstated.
