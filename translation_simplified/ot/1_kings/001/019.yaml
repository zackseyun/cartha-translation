translation:
  language: en
  text: He sacrificed a great many oxen, fattened cattle, and sheep.[a] He invited all the king’s sons, Abiathar the priest, and Joab, the army commander. But he did not invite Solomon, your servant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can include goats as well as sheep.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: sacrificed oxen, fattened cattle, and sheep in abundance
  simplified_phrase: sacrificed a great many oxen, fattened cattle, and sheep
  preserved_meaning: Adonijah sacrificed a large quantity of all these kinds of livestock.
  reasoning_layer_used: Lexical decisions for זבח, מריא, צאן, and לרב
  rationale: “A great many” clearly applies the lavish quantity to the whole list.
- pob_phrase: Joab the commander of the army
  simplified_phrase: Joab, the army commander
  preserved_meaning: Joab is identified by his official military leadership.
  reasoning_layer_used: Lexical decision for שַׂר הַצָּבָא
  rationale: The shorter title is natural modern English without weakening Joab’s rank.
- pob_phrase: but he did not invite Solomon your servant
  simplified_phrase: But he did not invite Solomon, your servant.
  preserved_meaning: Solomon was excluded and respectfully described as David’s servant.
  reasoning_layer_used: Lexical decisions for עַבְדְּךָ and לֹא קָרָא
  rationale: A separate sentence emphasizes the contrast, and the comma links the respectful title to Solomon.
translation_notes:
  risk_flags:
  - risk: “Sheep” may sound narrower than the Hebrew category of flock animals.
    mitigation: The footnote explains that goats may also be included.
