translation:
  language: en
  text: When my lord the king dies and joins his ancestors, my son Solomon and I will be treated as offenders.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “regarded as guilty.” The Hebrew can also mean “sinners,” but here it refers to being treated as guilty and liable to punishment.
    reason: lexical_alternative
