translation:
  language: en
  text: The king’s servants also came to bless our lord, King David. They said, “May your God make Solomon’s name—his reputation—better than yours, and may he make Solomon’s throne greater than yours.” Then the king bowed while on the bed.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the king worshiped while on the bed.” The Hebrew verb can describe either bowing down or worshiping.
    reason: alternative_reading
