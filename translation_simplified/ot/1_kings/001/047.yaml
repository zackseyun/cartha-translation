- pob_phrase: came to bless our lord King David, saying
  simplified_phrase: came to bless our lord, King David. They said
  preserved_meaning: The servants formally blessed David and introduced their spoken words.
  reasoning_layer_used: POB lexical decisions for לְבָרֵךְ and לֵאמֹר
  rationale: Two sentences make the speech introduction easier to follow without weakening “bless.”
- pob_phrase: his throne greater than your throne
  simplified_phrase: Solomon’s throne greater than yours
  preserved_meaning: The blessing asks God to make Solomon’s royal rule surpass David’s.
  reasoning_layer_used: POB lexical decision for אֶת כִּסְאוֹ מִכִּסְאֶךָ
  rationale: Repeating Solomon’s name makes the pronoun reference immediately clear while preserving the throne image.
- pob_phrase: the king bowed himself on the bed
  simplified_phrase: the king bowed while on the bed
  preserved_meaning: David physically bowed from his place on the bed without specifying the object of the gesture.
  reasoning_layer_used: POB theological decision on וַיִּשְׁתַּחוּ
  rationale: The recast wording is natural English and keeps the action deliberately open to the worship sense.
