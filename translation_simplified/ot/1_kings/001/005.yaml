translation:
  language: en
  text: Adonijah son of Haggith made himself great,[a] declaring, “I will be king.” He arranged for himself a chariot and horsemen, along with fifty men to run ahead of him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
