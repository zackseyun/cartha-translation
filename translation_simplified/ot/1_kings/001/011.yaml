translation:
  language: en
  text: Then Nathan spoke to Bathsheba, Solomon’s mother. He asked, “Haven’t you heard? Adonijah son of Haggith has become king,[a] and our lord David does not know about it.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “has made himself king.” The Hebrew says “has become king” or “has reigned” and does not explicitly say that he made himself king.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Then Nathan said to Bathsheba, Solomon’s mother
  simplified_phrase: Then Nathan spoke to Bathsheba, Solomon’s mother. He asked
  preserved_meaning: Nathan addresses Bathsheba and introduces a question.
  reasoning_layer_used: POB lexical decisions for וַיֹּאמֶר and לֵאמֹר
  rationale: Two short sentences make the speech introduction easier to follow.
- pob_phrase: Have you not heard that
  simplified_phrase: Haven’t you heard?
  preserved_meaning: Nathan asks a rhetorical question expecting that Bathsheba may know the news.
  reasoning_layer_used: POB lexical decisions for הֲלוֹא and שָׁמַעַתְּ
  rationale: The contraction and sentence break express the rhetorical question in natural modern English.
- pob_phrase: does not know it
  simplified_phrase: does not know about it
  preserved_meaning: David is unaware that Adonijah has become king.
  reasoning_layer_used: POB lexical decision for לֹא יָדָע
  rationale: Adding “about” makes the reference sound natural without changing what David does not know.
