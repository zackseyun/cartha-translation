translation:
  language: en
  text: The king sent Zadok the priest, Nathan the prophet, Benaiah son of Jehoiada, and the Cherethites and Pelethites to accompany him. They put him on the king’s mule.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may refer specifically to the king’s female mule.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: sent with him
  simplified_phrase: sent ... to accompany him
  preserved_meaning: The named people went with him by the king’s command.
  reasoning_layer_used: The lexical decision identifies accompaniment as the force of the Hebrew phrase.
  rationale: The infinitive states the relationship more naturally in modern English.
- pob_phrase: and they mounted him on the king’s mule
  simplified_phrase: They put him on the king’s mule.
  preserved_meaning: The group caused him to ride the royal mule.
  reasoning_layer_used: The lexical rationale requires preserving the causative sense of the Hebrew verb.
  rationale: A separate sentence with “put him on” is clearer than the formal verb “mounted.”
