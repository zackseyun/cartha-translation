translation:
  language: en
  text: Just then, while he was still speaking, Jonathan arrived. He was the son of Abiathar the priest. Adonijah said, “Come in! A worthy man like you must be bringing good news.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Worthy man” may also mean a valiant, capable, or respected man.
    reason: lexical_alternative
