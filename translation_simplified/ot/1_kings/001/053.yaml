  preserved_meaning: Solomon dispatched unnamed agents who removed Adonijah from the altar.
  reasoning_layer_used: POB lexical decisions and immediate context
  rationale: Combining the linked actions makes their relationship clear while retaining Solomon's sending and Adonijah's removal.
- pob_phrase: And he came and bowed down to King Solomon
  simplified_phrase: Adonijah came and bowed before the king
  preserved_meaning: Adonijah approached Solomon and made a formal gesture of submission.
  reasoning_layer_used: POB lexical decisions
  rationale: Naming Adonijah clarifies the pronoun, while “bowed” preserves the physical act without specifying full prostration.
- pob_phrase: Go to your house
  simplified_phrase: Go home
  preserved_meaning: Solomon formally dismissed Adonijah to return to his own residence.
  reasoning_layer_used: POB lexical decision and listed alternative
  rationale: “Go home” is the natural modern equivalent of the royal command.
