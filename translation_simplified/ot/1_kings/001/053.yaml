  text: Then King Solomon sent men to bring Adonijah down from the altar. Adonijah came and bowed before the king. Solomon told him, “Go home.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Then King Solomon sent, and they brought him down from the altar
