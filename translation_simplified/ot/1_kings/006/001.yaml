translation:
  language: en
  text: In the 480th year after the sons of Israel left the land of Egypt, during the fourth year of Solomon’s reign over Israel, in Ziv—the second month—Solomon began building the house, the temple, for Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ziv was the old name for the second month in the Hebrew calendar.
    reason: cultural_note
