translation:
  language: en
  text: He covered the entire temple with gold, completing all the work on the temple. He also covered the entire altar associated with the inner sanctuary with gold.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew describes the altar as associated with the inner sanctuary; it may mean that the altar belonged to it or was located in relation to it.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the whole house
  simplified_phrase: the entire temple
  preserved_meaning: The entire temple structure was included.
  reasoning_layer_used: POB lexical decision and temple-building context
  rationale: “Temple” makes the contextual meaning of “house” immediately clear while preserving totality.
- pob_phrase: overlaid ... with gold
  simplified_phrase: covered ... with gold
  preserved_meaning: Gold was applied over the surfaces of the temple and altar.
  reasoning_layer_used: POB lexical alternatives
  rationale: “Covered with gold” expresses the construction action in familiar English.
- pob_phrase: until the whole house was finished
  simplified_phrase: completing all the work on the temple
  preserved_meaning: The gold covering is described in relation to completion of the entire temple.
  reasoning_layer_used: POB lexical rationale for עַד תֹּם and grounding review
  rationale: The revised clause keeps the temple as the stated object of completion without presenting completion as a separate action.
translation_notes:
  risk_flags:
  - risk: “Temple” does not preserve the Hebrew image of the sanctuary as a house.
    mitigation: The temple-building context supports this POB-listed alternative, and no theological distinction depends on retaining “house” here.
  - risk: “Associated with” leaves the altar’s exact spatial relation undefined.
    mitigation: The footnote preserves the Hebrew ambiguity between belonging and location.
