translation:
  language: en
  text: He made olivewood doors for the entrance to the inner sanctuary. The doorposts and the sides of the doorframe had five sides.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the frame and doorposts were a fifth part”; the Hebrew phrase is brief, and this traditional interpretation is architecturally unclear.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: For the entrance of the inner sanctuary he made doors of olivewood
  simplified_phrase: He made olivewood doors for the entrance to the inner sanctuary.
  preserved_meaning: The olivewood doors led into the temple’s innermost sacred room.
  reasoning_layer_used: POB lexical decisions for פֶּתַח, הַדְּבִיר, דַּלְתּוֹת, and עֲצֵי שָׁמֶן
  rationale: Ordinary English word order makes the sentence easier to follow without losing any detail.
- pob_phrase: the doorposts and jambs
  simplified_phrase: The doorposts and the sides of the doorframe
  preserved_meaning: The wording keeps two related parts of the entrance structure distinct.
  reasoning_layer_used: POB lexical decisions for הָאַיִל and מְזוּזוֹת
  rationale: “Sides of the doorframe” explains the less familiar term “jambs” without treating them as the whole frame.
- pob_phrase: were five-sided
  simplified_phrase: had five sides
  preserved_meaning: The likely five-sided shape remains the main reading.
  reasoning_layer_used: POB lexical decision for חֲמִשִׁית
  rationale: The shape is expressed in direct, common English.
