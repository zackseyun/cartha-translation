  text: The temple’s main hall, in front of the inner sanctuary, was forty cubits—about 60 feet (18 meters)—long.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A cubit was based on the length of a forearm, so the modern measurement is approximate.
