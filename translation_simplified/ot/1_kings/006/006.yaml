translation:
  language: en
  text: The lowest level of the side structure was about 7½ feet (2.3 meters) wide, the middle level about 9 feet (2.7 meters), and the third level about 10½ feet (3.2 meters).[a] The outside walls of the temple had stepped ledges all around, so the beams could be supported without being inserted into the temple walls.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew gives the widths as five, six, and seven cubits; a cubit was about 18 inches (45 centimeters).
    reason: cultural_note
