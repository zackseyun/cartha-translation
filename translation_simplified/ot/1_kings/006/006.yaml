  simplified_phrase: The lowest level of the side structure ... the middle level ... the third level
  preserved_meaning: The verse describes three levels of the structure surrounding the temple.
  reasoning_layer_used: POB lexical decision for היצוע
  rationale: “Level of the side structure” clearly identifies both the surrounding structure and its three levels.
- pob_phrase: five cubits ... six cubits ... seven cubits
  simplified_phrase: about 7½ feet ... about 9 feet ... about 10½ feet
  preserved_meaning: Each successive level was one cubit wider than the level below it.
  reasoning_layer_used: Source measurements and POB measure decision
  rationale: Approximate modern equivalents clarify the widths while the footnote preserves the ancient units.
- pob_phrase: he made offsets around the outside of the temple, so that the beams would not be inserted
  simplified_phrase: The outside walls of the temple had stepped ledges all around, so the beams could be supported without being inserted
