  text: 'Go tell Jeroboam, “This is what Yahweh, the God of Israel, says: Because I raised you up from among the people and made you ruler over my people Israel—”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Go and say to Jeroboam
  simplified_phrase: Go tell Jeroboam
  preserved_meaning: Ahijah’s wife must go and deliver the message directly to Jeroboam.
  reasoning_layer_used: Lexical decisions for לְכִי and אִמְרִי
  rationale: “Go tell” naturally preserves both the command to go and the command to speak.
- pob_phrase: Thus says Yahweh
  simplified_phrase: This is what Yahweh ... says
  preserved_meaning: The words that follow are Yahweh’s authoritative message.
  reasoning_layer_used: Lexical decision for כֹּה אָמַר and theological decision for יְהוָה
  rationale: The modern formula is immediately clear while retaining Yahweh’s personal name.
- pob_phrase: Because I raised you up from among the people and made you ruler over my people Israel
  simplified_phrase: Because I raised you up from among the people and made you ruler over my people Israel
  preserved_meaning: Yahweh elevated Jeroboam from the populace and gave him official authority over Israel.
  reasoning_layer_used: Lexical decisions for הֲרִימֹתִיךָ, וָאֶתֶּנְךָ, and נָגִיד
  rationale: These clear words preserve both the elevation image and Jeroboam’s divinely granted authority.
