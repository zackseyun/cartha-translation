translation:
  language: en
  text: Cult prostitutes were also present in the land.[a] They followed all the detestable practices of the nations Yahweh had driven out before the sons of Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may refer specifically to male cult prostitutes or temple prostitutes—people involved in forbidden sexual practices connected with worship.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: There were also cult prostitutes in the land
  simplified_phrase: Cult prostitutes were also present in the land
  preserved_meaning: Such people existed in the land as an additional sign of wrongdoing.
  reasoning_layer_used: Lexical decision for the existential use of הָיָה and the collective sense of קָדֵשׁ.
  rationale: The direct word order is easier to read while retaining the collective reference.
- pob_phrase: They did according to all
  simplified_phrase: They followed all
  preserved_meaning: They imitated the full range of the nations’ practices.
  reasoning_layer_used: Lexical decisions for עָשׂוּ and כְּכֹל.
  rationale: “Followed” expresses conformity more naturally than “did according to.”
- pob_phrase: all the abominations
  simplified_phrase: all the detestable practices
  preserved_meaning: The actions were morally and religiously abhorrent.
  reasoning_layer_used: Lexical decision for הַתּוֹעֲבֹת.
  rationale: “Detestable practices” makes the indictment clear without weakening its force.
