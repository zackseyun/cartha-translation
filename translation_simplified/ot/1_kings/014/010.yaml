translation:
  language: en
  text: So I am going to bring disaster on Jeroboam’s family. I will cut off every male[a] in Jeroboam’s family in Israel, servant or free.[b] I will sweep away Jeroboam’s family as completely as someone sweeps away dung until none is left.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew uses a crude idiom that literally means “one who urinates against a wall.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew pair “slave or free” means everyone without exception, whatever their social position.
    reason: lexical_alternative
