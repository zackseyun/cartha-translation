translation:
  language: en
  text: Rehoboam, Solomon’s son, ruled in Judah. He was forty-one years old when he became king, and he ruled for seventeen years in Jerusalem. Yahweh had chosen Jerusalem from all the tribes of Israel as the special place for his presence and worship.[a] Rehoboam’s mother was Naamah, an Ammonite woman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew says “to put his name there,” an expression marking Jerusalem as the special place of Yahweh’s presence and worship.
    reason: cultural_note
