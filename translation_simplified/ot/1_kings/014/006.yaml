translation:
  language: en
  text: As she stepped through the doorway, Ahijah heard her footsteps. He said, “Come in, Jeroboam’s wife. Why are you pretending to be someone else? I have been sent to you with a hard message.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “severe news.” The Hebrew leaves the noun after “hard” unstated.
    reason: lexical_alternative
