translation:
  language: en
  text: Jeroboam said to his wife, “Please get up and disguise yourself so people will not know that you are Jeroboam’s wife. Then go to Shiloh. Look, the prophet Ahijah is there. He is the one who said that I would become king over this people.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: so that they will not know that you are the wife of Jeroboam
  simplified_phrase: so people will not know that you are Jeroboam’s wife
  preserved_meaning: Her disguise is meant to keep others from recognizing her as Jeroboam’s wife.
  reasoning_layer_used: POB lexical decisions for וְלֹא יֵדְעוּ and כִּי אַתְּ אֵשֶׁת יָרָבְעָם
  rationale: “People” naturally represents the Hebrew’s indefinite plural subject without specifying who they are.
- pob_phrase: and go to Shiloh
  simplified_phrase: Then go to Shiloh.
  preserved_meaning: Jeroboam next instructs her to travel to Shiloh.
  reasoning_layer_used: POB lexical decision for וְהָלַכְתְּ שִׁלֹה
  rationale: A separate sentence makes the sequence of commands immediately clear.
- pob_phrase: he is the one who spoke concerning me, that I would be king over this people
  simplified_phrase: He is the one who said that I would become king over this people.
  preserved_meaning: Ahijah had specifically foretold Jeroboam’s rise to kingship over the people.
  reasoning_layer_used: POB lexical decisions for הוּא דִבֶּר, עָלַי, and לְמֶלֶךְ
  rationale: The direct wording keeps the emphasis on Ahijah while clearly expressing the prophecy about Jeroboam’s accession.
translation_notes:
  risk_flags:
  - risk: “People” could be read as a defined group, while the Hebrew subject is indefinite.
    mitigation: The wording leaves the people unidentified and avoids the stronger claim “no one.”
