  text: They too built their own local shrines and set up sacred stone pillars and Asherah poles[a] on every high hill and under every leafy tree.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be translated “Asherim” or “sacred poles”; these were worship objects associated with Asherah.
    reason: lexical_alternative
