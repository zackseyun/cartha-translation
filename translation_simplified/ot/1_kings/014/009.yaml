- pob_phrase: all who were before you
  simplified_phrase: all those who came before you
  preserved_meaning: The comparison is with earlier people in Jeroboam’s position.
  reasoning_layer_used: Lexical decision for מִכֹּל אֲשֶׁר הָיוּ לְפָנֶיךָ.
  rationale: “Came before you” makes the temporal sense clear.
- pob_phrase: You went and made for yourself
  simplified_phrase: You went on to make other gods for yourself
  preserved_meaning: Jeroboam proceeded to make illicit gods for himself.
  reasoning_layer_used: Lexical decisions for וַתֵּלֶךְ and וַתַּעֲשֶׂה לְּךָ.
  rationale: “Went on to make” expresses the sequence naturally.
- pob_phrase: cast images
  simplified_phrase: images formed by casting
  preserved_meaning: These were physical cult images produced through casting.
  reasoning_layer_used: Lexical and theological decisions for וּמַסֵּכוֹת.
  rationale: The wording explains the process without asserting that the material was metal.
