translation:
  language: en
  text: All Israel will mourn for him and bury him. He alone from Jeroboam’s family will receive burial, because something good toward Yahweh, the God of Israel, has been found in him within Jeroboam’s household.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Toward Yahweh” may describe something in him that was directed toward Yahweh or pleasing to Yahweh.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: he alone of Jeroboam’s house will come to the grave
  simplified_phrase: He alone from Jeroboam’s family will receive burial
  preserved_meaning: He is the only member of Jeroboam’s family who will be buried.
  reasoning_layer_used: POB lexical decision for יָבֹא לְיָרָבְעָם אֶל קָבֶר
  rationale: This replaces an unfamiliar grave idiom with its established contextual meaning.
- pob_phrase: in the house of Jeroboam
  simplified_phrase: within Jeroboam’s household
  preserved_meaning: The good in him was found within Jeroboam’s household and family line.
  reasoning_layer_used: POB lexical decision for בְּבֵית יָרָבְעָם and immediate judgment context
  rationale: “Household” clearly retains the final dynastic framing without repeating “family.”
- pob_phrase: something good toward Yahweh
  simplified_phrase: something good toward Yahweh
  preserved_meaning: An unspecified good quality or disposition in relation to Yahweh was found in him.
  reasoning_layer_used: POB lexical decisions for דָּבָר טוֹב and אֶל יְהוָה
  rationale: The broad wording remains because the Hebrew does not specify the exact nature of the good.
