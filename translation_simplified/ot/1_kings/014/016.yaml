translation:
  language: en
  text: He will give Israel up because of Jeroboam’s sins. Jeroboam committed these sins and led Israel into sin through them.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: because of the sins of Jeroboam, which he committed and by which he caused Israel to sin
  simplified_phrase: because of Jeroboam’s sins. Jeroboam committed these sins and led Israel into sin through them
  preserved_meaning: Jeroboam committed the sins and also caused Israel to sin by them.
  reasoning_layer_used: POB lexical and theological decisions on Jeroboam’s guilt and the causative verb
  rationale: Two sentences clearly distinguish Jeroboam’s sins from his influence on Israel.
- pob_phrase: caused Israel to sin
  simplified_phrase: led Israel into sin
  preserved_meaning: Jeroboam actively induced the people of Israel to sin.
  reasoning_layer_used: POB lexical alternative for the Hiphil of חטא
  rationale: This natural wording retains the verb’s causative force.
translation_notes:
  risk_flags:
  - risk: “Led” may sound less forceful than “caused.”
    mitigation: “Led Israel into sin through them” keeps Jeroboam’s active role and connects Israel’s sin to his sins.
