translation:
  language: en
  text: Jeroboam was king for twenty-two years. Then he lay down with his ancestors[a], and his son Nadab became king in his place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This Hebrew expression means that he died; traditionally, “he slept with his fathers.”
    reason: lexical_alternative
