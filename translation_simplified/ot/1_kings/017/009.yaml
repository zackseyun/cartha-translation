translation:
  language: en
  text: Get up and go to Zarephath, a town that belongs to Sidon.[a] Stay there. Look, I have commanded[b] a widow there to provide for you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean that Zarephath was in or near Sidon; the Hebrew links the town with Sidon without specifying the exact relationship.
    reason: lexical_alternative
  - marker: b
    text: This may mean “appointed,” but the Hebrew says “commanded,” even though the widow may not yet know about the command.
    reason: alternative_reading
