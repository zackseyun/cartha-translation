translation:
  language: en
  text: She answered, “As surely as Yahweh your God lives, I have no bread—not even a small bread-cake. I have only a handful of flour in a jar and a little oil in a jug. Look, I am gathering two sticks. Then I will go inside and make a small bread-cake for my son and myself. We will eat it and then die.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: As Yahweh your God lives
  simplified_phrase: As surely as Yahweh your God lives
  preserved_meaning: The widow makes a solemn oath using Yahweh’s personal name.
  reasoning_layer_used: Lexical and theological decisions on חַי יְהוָה and יְהוָה.
  rationale: Adding “surely” makes the oath formula clear in common English.
- pob_phrase: I have no bread-cake, only a handful of flour
  simplified_phrase: I have no bread—not even a small bread-cake. I have only a handful of flour
  preserved_meaning: She has no prepared bread and possesses only a very small amount of flour.
  reasoning_layer_used: Lexical decisions on מָעוֹג, כִּי אִם, and מְלֹא כַף קֶמַח.
  rationale: The rewrite explains the unfamiliar bread-cake while keeping its specific image.
- pob_phrase: so that I may go in and prepare it for myself and for my son
  simplified_phrase: Then I will go inside and make a small bread-cake for my son and myself
  preserved_meaning: She intends to use her remaining ingredients to prepare food for herself and her son.
  reasoning_layer_used: Lexical decisions on וּבָאתִי וַעֲשִׂיתִיהוּ and לִי וְלִבְנִי.
  rationale: A direct future sequence is easier to follow than the nested purpose clause.
