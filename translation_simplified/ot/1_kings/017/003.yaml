  preserved_meaning: Elijah must change direction and go east.
  reasoning_layer_used: POB lexical decision for וּפָנִיתָ לְּךָ קֵדְמָה
  rationale: Natural English conveys the commanded change of direction without the awkward reflexive.
- pob_phrase: hide yourself by the Wadi Cherith
  simplified_phrase: hide yourself beside the Cherith watercourse
  preserved_meaning: Elijah must conceal himself near the geographical feature called Cherith.
  reasoning_layer_used: POB lexical decisions for וְנִסְתַּרְתָּ and בְּנַחַל כְּרִית
  rationale: “Watercourse” explains “wadi” without implying that water always flows there.
- pob_phrase: Go from here and turn yourself eastward, and hide yourself
