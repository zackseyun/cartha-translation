translation:
  language: en
  text: Go from here and turn toward the east. Then hide yourself beside the Cherith watercourse, east of the Jordan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “opposite the Jordan.”
