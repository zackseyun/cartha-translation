translation:
  language: en
  text: 'He said to him, “I too am a prophet, just like you. An angel[a] spoke to me with a message from Yahweh: ‘Bring him home with you so that he can eat bread and drink water.’” But he lied to him.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “messenger.” The Hebrew word can mean either “angel” or “messenger.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I also am a prophet like you
  simplified_phrase: I too am a prophet, just like you
  preserved_meaning: The speaker claims the same prophetic status as the other man.
  reasoning_layer_used: POB lexical decision for נָבִיא
  rationale: The shorter wording keeps the claim while sounding natural in direct speech.
- pob_phrase: an angel spoke to me by the word of Yahweh, saying
  simplified_phrase: An angel spoke to me with a message from Yahweh
  preserved_meaning: The speaker claims that an angel communicated a message originating from Yahweh.
  reasoning_layer_used: POB lexical decisions for מַלְאָךְ, דִּבֶּר אֵלַי, בִּדְבַר יְהוָה, and יְהוָה
  rationale: This recasts the prophetic idiom in clear English while retaining Yahweh as the source.
- pob_phrase: Bring him back with you to your house, that he may eat bread and drink water
  simplified_phrase: Bring him home with you so that he can eat bread and drink water
  preserved_meaning: The command causes the man to return to the speaker’s house for bread and water.
  reasoning_layer_used: POB lexical decisions for הֲשִׁיבֵהוּ, אִתְּךָ אֶל־בֵּיתֶךָ, וְיֹאכַל לֶחֶם, and וְיֵשְׁתְּ מָיִם
  rationale: Common wording clarifies the destination and purpose without removing the bread-and-water details.
translation_notes:
