translation:
  language: en
  text: The man of God cried out against the altar at Bethel. When King Jeroboam heard what he said, he stretched out his hand from the altar and ordered, “Seize him!” But the hand he had stretched out against the man dried up,[a] and he could not pull it back.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “withered.” Hebrew literally says “dried up.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: when the king heard the word of the man of God, who cried out against the altar at Bethel
  simplified_phrase: The man of God cried out against the altar at Bethel. When King Jeroboam heard what he said
  preserved_meaning: Jeroboam heard the man's spoken denunciation of the altar.
  reasoning_layer_used: POB syntax and lexical decisions for דְּבַר and קָרָא עַל
  rationale: Two direct sentences replace a long embedded clause while keeping the speech and its target clear.
- pob_phrase: saying, “Seize him!”
  simplified_phrase: and ordered, “Seize him!”
  preserved_meaning: Jeroboam issued a forceful command to his attendants.
  reasoning_layer_used: POB lexical decision for תִּפְשֻׂהוּ
  rationale: “Ordered” clearly introduces the king's command in ordinary English.
- pob_phrase: he could not draw it back to himself
  simplified_phrase: he could not pull it back
  preserved_meaning: Jeroboam could not bring his disabled hand back toward his body.
  reasoning_layer_used: POB lexical decision for לַהֲשִׁיבָהּ אֵלָיו
  rationale: “Pull it back” states the physical inability more naturally without changing it.
translation_notes:
  risk_flags:
  - risk: “What he said” is less visibly tied to the Hebrew prophetic idiom “the word.”
    mitigation: The preceding sentence retains the man of God's forceful spoken proclamation.
  - risk: Modern readers may find “dried up” physically unclear.
    mitigation: The footnote gives “withered,” while the next clause shows that the hand became unusable.
