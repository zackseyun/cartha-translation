  text: 'And he cried out against the altar by the word of Yahweh and said[a], “Altar, altar, thus says Yahweh: Behold, a son will be born to the house of David, Josiah by name, and he will sacrifice on you the priests of the high places who burn incense on you[c][b], and human bones will be burned on you.”'
  footnotes:
  - marker: a
    text: Or, 'at the word of the LORD' or 'according to the word of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'he will slaughter on you.' The Hebrew verb is sacrificial in tone, which may intentionally underscore the desecration of the altar.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'bones of אדם'; here אדם is used generically, hence 'human bones.'
    reason: lexical_alternative
