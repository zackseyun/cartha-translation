translation:
  language: en
  text: 'Under Yahweh’s command, he cried out against the altar: “Altar, altar! This is what Yahweh says: Look! A son named Josiah will be born into David’s family line. He will sacrifice on you the priests from the local shrines who burn incense on you, and human bones will be burned on you.”'
  philosophy: optimal-equivalence
