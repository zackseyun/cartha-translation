  preserved_meaning: The prophet spoke with Yahweh’s authorization.
  reasoning_layer_used: POB lexical decision for בִּדְבַר יְהוָה
  rationale: The clearer wording preserves divine commission without the opaque English idiom.
- pob_phrase: a son will be born to the house of David, Josiah by name
  simplified_phrase: A son named Josiah will be born into David’s family line
  preserved_meaning: Josiah will arise as a descendant of David.
  reasoning_layer_used: POB lexical decisions for בֵן נוֹלָד לְבֵית דָּוִד and יֹאשִׁיָּהוּ שְׁמוֹ
  rationale: The sentence uses ordinary naming and family language while keeping the prophecy specific.
- pob_phrase: the priests of the high places
  simplified_phrase: the priests from the local shrines
  preserved_meaning: These priests serve at local cult sites.
  reasoning_layer_used: POB lexical decision for כֹּהֲנֵי הַבָּמוֹת
  rationale: Local shrines communicates the historical setting more clearly than the biblical idiom high places.
