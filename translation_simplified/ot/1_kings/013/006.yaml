translation:
  language: en
  text: Then the king said to the man of God, “Please ask Yahweh your God to show me favor,[a] and pray for me so that my hand will be restored.” The man of God asked Yahweh to show the king favor. The king’s hand was restored and became just as it had been before.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression literally refers to entreating Yahweh’s face; it means seeking his favor.
    reason: lexical_alternative
