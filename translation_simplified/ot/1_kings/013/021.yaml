translation:
  language: en
  text: 'He cried out to the man of God who had come from Judah, “This is what Yahweh says: Because you have rebelled against what Yahweh told you and have not obeyed the command Yahweh your God gave you—”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Thus says Yahweh
  simplified_phrase: This is what Yahweh says
  preserved_meaning: The standard prophetic formula introduces Yahweh’s own message.
  reasoning_layer_used: POB lexical decision for כֹּה אָמַר יְהוָה
  rationale: The modern wording keeps the formula’s authority without archaic “thus.”
- pob_phrase: rebelled against the word of Yahweh
  simplified_phrase: rebelled against what Yahweh told you
  preserved_meaning: The accusation is rebellion against Yahweh’s spoken instruction, not mere accidental failure.
  reasoning_layer_used: POB lexical and theological decisions for מָרִיתָ and פִּי יְהוָה
  rationale: The wording makes the Hebrew idiom understandable while retaining the force of “rebelled.”
- pob_phrase: have not kept the command that Yahweh your God commanded you
  simplified_phrase: have not obeyed the command Yahweh your God gave you
  preserved_meaning: The man failed to obey the specific command given by Yahweh his God.
  reasoning_layer_used: POB lexical decisions for שָׁמַרְתָּ, הַמִּצְוָה, and צִוְּךָ
  rationale: This removes repetitive wording while preserving both the command and his failure to obey it.
