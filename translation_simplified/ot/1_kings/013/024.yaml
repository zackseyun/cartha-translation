translation:
  language: en
  text: He went on his way. A lion found him on the road and killed him. His dead body lay on the road where it had been thrown down. The donkey stood beside it, and the lion stood beside the body.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And he went, and a lion found him on the road and killed him.
  simplified_phrase: He went on his way. A lion found him on the road and killed him.
  preserved_meaning: The man continued his journey before the lion encountered and killed him.
  reasoning_layer_used: POB lexical decisions and narrative sequence
  rationale: Two sentences replace the repeated conjunctions while keeping the events in order.
- pob_phrase: his corpse was cast on the road
  simplified_phrase: His dead body lay on the road where it had been thrown down.
  preserved_meaning: The body was on the road as the result of having been cast down there.
  reasoning_layer_used: POB lexical decision for נִבְלָתוֹ and passive מֻשְׁלֶכֶת
  rationale: “Dead body” is more familiar than “corpse,” while “thrown down” preserves the passive image.
- pob_phrase: the donkey was standing beside it, and the lion was standing beside the corpse
  simplified_phrase: The donkey stood beside it, and the lion stood beside the body.
  preserved_meaning: Both animals remained standing beside the dead man.
  reasoning_layer_used: POB participial scene-setting decisions
  rationale: Simple past gives a natural scene description without changing either animal’s position.
translation_notes:
