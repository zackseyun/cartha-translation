translation:
  language: en
  text: When the prophet who had brought him back from the road heard what had happened, he said, “It is the man of God who rebelled against Yahweh’s command.[a] So Yahweh handed him over to the lion, which mauled and killed him, just as Yahweh had told him.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “rebelled against the mouth of Yahweh,” meaning that he defied Yahweh’s spoken command.
    reason: lexical_alternative
