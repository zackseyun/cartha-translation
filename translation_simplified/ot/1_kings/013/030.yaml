simplification_decisions:
- pob_phrase: And he laid his corpse in his own tomb
  simplified_phrase: He placed the corpse in his own tomb.
  preserved_meaning: The old prophet put the dead man’s corpse in his own burial place.
  reasoning_layer_used: POB lexical decisions for וַיַּנַּח, נִבְלָתוֹ, and בְּקִבְרוֹ
  rationale: “Placed” is clear modern English, while “corpse” and “his own tomb” preserve the source’s force and possession.
- pob_phrase: and they mourned over him, saying
  simplified_phrase: Then they mourned for him and said
  preserved_meaning: They expressed grief for the dead man and spoke the lament that follows.
  reasoning_layer_used: POB lexical decisions for וַיִּסְפְּדוּ and עָלָיו plus the grounding review
  rationale: “Said” introduces the spoken lament without adding an unsupported manner or volume.
- pob_phrase: Alas, my brother!
  simplified_phrase: Oh, my brother!
  preserved_meaning: The words express sorrow and affectionate solidarity with the dead man.
  reasoning_layer_used: POB lexical decisions for הוֹי and אָחִי plus the cultural footnote
  rationale: “Oh” conveys the grief more plainly than the literary word “Alas.”
