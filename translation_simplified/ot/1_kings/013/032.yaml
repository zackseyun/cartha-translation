translation:
  language: en
  text: For the message he cried out at Yahweh’s word against the altar in Bethel—and against every shrine at the high places in the cities of Samaria—will surely be fulfilled.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “all the houses of the high places”; high places were local worship sites.
    reason: simplification_note
simplification_decisions:
- pob_phrase: the word that he cried out by the word of Yahweh
  simplified_phrase: the message he cried out at Yahweh’s word
  preserved_meaning: The prophet publicly delivered a message on the basis of revelation from Yahweh.
  reasoning_layer_used: POB lexical decisions for הַדָּבָר, קָרָא, and בִּדְבַר יְהוָה
  rationale: “Message” distinguishes the prophecy from Yahweh’s authorizing word while keeping the force of “cried out.”
- pob_phrase: all the houses of the high places
  simplified_phrase: every shrine at the high places
  preserved_meaning: The prophecy targets all the local worship structures in Samaria’s cities.
  reasoning_layer_used: POB lexical decision for כָּל בָּתֵּי הַבָּמוֹת and its documented alternative
  rationale: “Shrine” clearly expresses the function of the otherwise opaque phrase “houses of the high places.”
- pob_phrase: will surely come to pass
  simplified_phrase: will surely be fulfilled
  preserved_meaning: The prophetic message is certain to happen as announced.
  reasoning_layer_used: POB theological decision on הָיֹה יִהְיֶה
  rationale: “Be fulfilled” is natural English for a prophecy coming true and preserves the Hebrew emphasis on certainty.
translation_notes:
  risk_flags:
