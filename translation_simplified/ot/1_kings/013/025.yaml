translation:
  language: en
  text: Just then, some men passing by saw the corpse thrown down on the road, with the lion standing beside it. They went to the city where the old prophet lived and reported what they had seen.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And behold
  simplified_phrase: Just then
  preserved_meaning: The narrative suddenly draws attention to what the passersby saw.
  reasoning_layer_used: POB lexical decision for וְהִנֵּה
  rationale: A natural narrative cue preserves the Hebrew marker's suddenness without using formal “behold.”
- pob_phrase: men were passing by and saw
  simplified_phrase: some men passing by saw
  preserved_meaning: The men were in the process of passing by when they saw the scene.
  reasoning_layer_used: POB lexical decision for אֲנָשִׁים עֹבְרִים
  rationale: The shorter clause keeps both the men and the ongoing action in ordinary English.
- pob_phrase: they came and reported it in the city
  simplified_phrase: They went to the city ... and reported what they had seen
  preserved_meaning: They traveled to the city and relayed news of the incident there.
  reasoning_layer_used: POB lexical decisions for וַיָּבֹאוּ and וַיְדַבְּרוּ בָעִיר
  rationale: The destination and the content of the report are stated in the order modern readers expect.
