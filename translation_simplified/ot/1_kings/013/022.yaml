translation:
  language: en
  text: But you came back and ate bread and drank water in the very place where you had been told, “Do not eat bread or drink water.” So your dead body will not be buried in your fathers’ tomb.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: in the place about which he said to you
  simplified_phrase: in the very place where you had been told
  preserved_meaning: The command concerned what the man must not do in that place, not where the command was spoken.
  reasoning_layer_used: lexical decision and immediate context
  rationale: The passive wording avoids implying that the command was delivered at that location.
- pob_phrase: your corpse
  simplified_phrase: your dead body
  preserved_meaning: The judgment concerns the man’s physical body after death.
  reasoning_layer_used: lexical decision
  rationale: “Dead body” is more familiar than “corpse” while retaining the judgment’s starkness.
- pob_phrase: shall not come to the tomb of your fathers
  simplified_phrase: will not be buried in your fathers’ tomb
  preserved_meaning: His body will be denied burial in his paternal family tomb.
  reasoning_layer_used: lexical and theological decisions
  rationale: The direct wording states the concrete burial consequence identified by the POB audit.
interpretive_expansions:
- pob_phrase: shall not come to the tomb of your fathers
  rendering: will not be buried in your fathers’ tomb
  claim: The body’s not coming to the family tomb means that it will not be buried there.
  evidence:
  - The theological decision identifies a literal denial of burial in the ancestral tomb.
  - The lexical rationale identifies the tomb as the paternal family burial place.
  confidence: high
  alternatives_preserved:
