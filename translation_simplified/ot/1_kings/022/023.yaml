translation:
  language: en
  text: 'Now pay attention: Yahweh has put a lying spirit in the mouths of all these prophets of yours, and Yahweh has declared disaster against you.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And now, behold
  simplified_phrase: Now pay attention
  preserved_meaning: The words mark an immediate transition and solemnly call Ahab's attention.
  reasoning_layer_used: POB lexical decisions for וְעַתָּה and הִנֵּה
  rationale: The direct command communicates the attention marker more clearly than the archaic “behold.”
- pob_phrase: in the mouth of all these prophets of yours
  simplified_phrase: in the mouths of all these prophets of yours
  preserved_meaning: The lying spirit is expressed through the speech of every prophet in the group.
  reasoning_layer_used: POB lexical decision for בְּפִי
  rationale: The natural English plural preserves the Hebrew mouth-and-speech image and its distributive sense.
- pob_phrase: Yahweh has spoken disaster against you
  simplified_phrase: Yahweh has declared disaster against you
  preserved_meaning: Yahweh has authoritatively announced harmful judgment against Ahab.
  reasoning_layer_used: POB lexical and theological decisions for דִּבֶּר עָלֶיךָ רָעָה
  rationale: “Declared” makes the judgment announcement idiomatic without changing disaster into moral evil.
translation_notes:
  risk_flags:
  - risk: “Put a lying spirit” leaves the difficult tension of divine agency unresolved.
    mitigation: The wording deliberately retains the POB’s direct rendering rather than softening it to permission.
  - risk: “Declared disaster” could be read as less literally tied to speaking than the POB wording.
    mitigation: “Declared” still denotes an authoritative spoken announcement and preserves the judgment context.
