translation:
  language: en
  text: The messenger who had gone to summon Micaiah said to him, “Listen! The prophets are all speaking with one voice,[a] and what they say favors the king. Please make your message like theirs and speak favorably too.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says “with one mouth,” meaning unanimously.
    reason: lexical_alternative
