simplification_decisions:
- pob_phrase: The rest of the acts of Ahab, and all that he did
  simplified_phrase: everything else Ahab did
  preserved_meaning: This still covers all Ahab’s remaining deeds and activities.
  reasoning_layer_used: The lexical decisions treat “acts” as deeds and keep the broad sense of “did.”
  rationale: The shorter wording removes repetitive archival phrasing without narrowing its scope.
- pob_phrase: and the ivory house that he built, and all the cities that he built
  simplified_phrase: including the ivory house he built and all the cities he built
  preserved_meaning: The house and all the cities remain distinct works attributed to Ahab.
  reasoning_layer_used: The lexical decisions retain “ivory house,” “built,” and the default sense “cities.”
  rationale: The including-clause clarifies their relation to Ahab’s deeds while keeping both building references explicit.
- pob_phrase: are they not written in the Book of the Chronicles of the Kings of Israel?
  simplified_phrase: Isn’t ... written in the Book of the Chronicles of the Kings of Israel?
  preserved_meaning: The question still expects the answer yes and names the same royal record.
  reasoning_layer_used: The lexical decisions preserve the rhetorical question, written record, and established source title.
  rationale: Opening with the question form sounds natural in modern English.
translation_notes:
  risk_flags:
  - risk: “Including” presents the house and cities as examples within the broader account of Ahab’s deeds.
    mitigation: The coordinated source list supports that relation, and both items remain explicit.
  - risk: Readers may confuse this royal record with the biblical book of Chronicles.
    mitigation: Footnote b distinguishes them without claiming more than the POB evidence supports.
