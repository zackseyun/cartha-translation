translation:
  language: en
  text: Then he said, “So hear the word of Yahweh. I saw Yahweh seated on his throne. The entire heavenly host[a] stood beside him, on his right and on his left.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “heavenly host” is heaven’s assembled court or army; the phrase does not specify angels alone.
