translation:
  language: en
  text: He said, “I saw all Israel scattered across the mountains like sheep without a shepherd. Then Yahweh said, ‘They have no master.[a] Let each man go home in peace.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew form is plural, “masters,” but in this context it refers to Israel’s ruling head.
    reason: lexical_alternative
