  text: The spirit said, “I will go out and become a lying spirit,[a] speaking through all King Ahab’s prophets.” The LORD said, “You will entice Ahab,[b] and you will succeed. Go out and do it.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a spirit of falsehood.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word may also mean “deceive” or “persuade.”
