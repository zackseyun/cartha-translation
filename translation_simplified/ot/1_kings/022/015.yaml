translation:
  language: en
  text: So Micaiah came before the king. The king asked him, “Micaiah, should we go and fight at Ramoth-gilead, or should we hold back?” Micaiah answered,[a] “Go up and succeed. Yahweh will place it in the king’s hands.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Micaiah’s answer is probably ironic in context, though the Hebrew does not explicitly mark it as sarcasm.
    reason: lexical_alternative
