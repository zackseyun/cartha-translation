- pob_phrase: drew his bow at random and struck
  simplified_phrase: drew his bow and fired at random. The arrow struck
  preserved_meaning: The unnamed archer fired without choosing the king as his target, yet the arrow hit him.
  reasoning_layer_used: POB lexical decisions for מָשַׁךְ בַּקֶּשֶׁת, לְתֻמּוֹ, and וַיַּכֶּה
  rationale: Two sentences make the accidental shot and its result immediately clear.
- pob_phrase: to his charioteer
  simplified_phrase: to his chariot driver
  preserved_meaning: The king spoke to the person controlling his chariot.
  reasoning_layer_used: POB lexical decision for לְרַכָּבוֹ
  rationale: “Chariot driver” is more familiar than “charioteer” without changing the role.
- pob_phrase: Turn your hand and take me out of the camp
  simplified_phrase: Turn the chariot around and take me away from the fighting
  preserved_meaning: The king ordered the driver to maneuver the chariot away from the battle.
  reasoning_layer_used: POB footnotes c and b and lexical decisions for הֲפֹךְ יָדְךָ and מִן הַמַּחֲנֶה
  rationale: The wording states the idiom’s practical meaning instead of preserving opaque expressions.
