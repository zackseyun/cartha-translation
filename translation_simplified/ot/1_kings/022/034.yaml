translation:
  language: en
  text: But a man drew his bow and fired at random.[a] The arrow struck the king of Israel in the gap between his scale armor and breastplate.[b] The king told his chariot driver, “Turn the chariot around and take me away from the fighting, because I am wounded.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “without aiming”; the archer had no specific target in mind.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew names two armor parts whose exact forms are uncertain.
    reason: cultural_note
