translation:
  language: en
  text: The king of Israel said to Jehoshaphat, “We can still ask Yahweh through one more man. But I hate him, because he does not prophesy anything good about me—only evil. He is Micaiah son of Imlah.” Jehoshaphat replied, “The king should not say that.”
