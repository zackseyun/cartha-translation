translation:
  language: en
  text: Then the king of Israel said to Jehoshaphat, “Didn't I tell you that he would not prophesy anything good about me, but only evil?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “but only disaster.” The Hebrew contrasts “good” with “evil,” which here may mean an unfavorable or disastrous prophecy.
    reason: lexical_alternative
