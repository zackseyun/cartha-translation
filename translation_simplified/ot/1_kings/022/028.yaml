translation:
  language: en
  text: Micaiah said, “If you do return safely, then Yahweh has not spoken through me.” Then he said, “Listen, all you peoples!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses the plural “peoples,” making this a broad public summons rather than an address to only one group.
    reason: cultural_note
simplification_decisions:
- pob_phrase: If you indeed return in peace
  simplified_phrase: If you do return safely
  preserved_meaning: The return is emphatic and means coming back unharmed.
  reasoning_layer_used: Lexical decision for אִם שׁוֹב תָּשׁוּב and בְּשָׁלוֹם
  rationale: “Do return safely” expresses both the Hebrew emphasis and the contextual sense of returning unharmed.
- pob_phrase: Yahweh has not spoken by me
  simplified_phrase: Yahweh has not spoken through me
  preserved_meaning: Micaiah claims to be Yahweh’s prophetic instrument.
  reasoning_layer_used: Lexical and theological decisions for לֹא דִבֶּר יְהוָה בִּי and יְהוָה
  rationale: “Through me” makes the prophetic idiom immediately understandable while retaining the divine name Yahweh.
- pob_phrase: Hear, all you peoples!
  simplified_phrase: Listen, all you peoples!
  preserved_meaning: Micaiah publicly summons multiple peoples to pay attention.
  reasoning_layer_used: Lexical decisions for שִׁמְעוּ and עַמִּים כֻּלָּם
  rationale: “Listen” is the ordinary English command for attention, while “peoples” preserves the source plural.
translation_notes:
  risk_flags:
  - risk: Modern readers may find the plural “peoples” unusual.
    mitigation: A brief footnote explains that the Hebrew deliberately gives the summons broad scope.
