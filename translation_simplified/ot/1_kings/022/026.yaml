translation:
  language: en
  text: Then the king of Israel said, “Take Micaiah back to Amon, the city governor,[a] and to Joash, the king’s son.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the city commander” or “the city’s chief official.” The Hebrew title may refer to a leading civic or military officer.
    reason: lexical_alternative
