- pob_phrase: return him to Amon
  simplified_phrase: take Micaiah back to Amon
  preserved_meaning: Micaiah is being sent back into Amon’s custody.
  reasoning_layer_used: The lexical decision for the causative form of שוב allows “bring him back” or “take him back.”
  rationale: Repeating Micaiah’s name and using “take back” makes the action immediately clear.
- pob_phrase: the governor of the city
  simplified_phrase: the city governor
  preserved_meaning: Amon is identified as the city’s leading official.
  reasoning_layer_used: The lexical decision prefers “governor” while preserving other possible senses in a note.
  rationale: The shorter title is natural modern English without narrowing the Hebrew term.
translation_notes:
  risk_flags:
