- pob_phrase: She wrote in the letters, saying
  simplified_phrase: She wrote these instructions in the letters
  preserved_meaning: She wrote the quoted commands in the letters.
  reasoning_layer_used: Lexical decisions for בַּסְּפָרִים and לֵאמֹר
  rationale: “These instructions” introduces the commands more naturally than the formal quotative “saying.”
- pob_phrase: Proclaim a fast
