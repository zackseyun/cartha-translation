  preserved_meaning: The officials must publicly call the community to fast.
  reasoning_layer_used: Lexical decisions for קִרְאוּ and צוֹם
  rationale: This explains “fast” while preserving the command’s public force.
- pob_phrase: seat Naboth at the head of the people
  simplified_phrase: seat Naboth at the head of the people
  preserved_meaning: Naboth is to be placed conspicuously or prominently among the people.
  reasoning_layer_used: Lexical decision and footnote for בְּרֹאשׁ הָעָם
  rationale: The wording retains the source image and leaves its exact social or spatial sense open.
