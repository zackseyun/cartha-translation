simplification_decisions:
- pob_phrase: Anyone belonging to Ahab
  simplified_phrase: anyone belonging to Ahab’s household
  preserved_meaning: The judgment applies to anyone associated with Ahab’s house or dynasty, not only his blood relatives.
  reasoning_layer_used: POB footnote and lexical decisions for הַמֵּת and לְאַחְאָב
  rationale: “Household” keeps the broad relationship while making it easier to understand.
- pob_phrase: Anyone belonging to Ahab who dies in the city the dogs will eat
  simplified_phrase: Dogs will eat anyone belonging to Ahab’s household who dies in the city.
  preserved_meaning: Anyone of Ahab’s household who dies in the city will be consumed by dogs.
  reasoning_layer_used: POB syntax and lexical decision for יֹאכְלוּ
  rationale: Putting the subject first makes the warning easier to follow.
- pob_phrase: and anyone who dies in the field the birds of the sky will eat
  simplified_phrase: Birds of the sky will eat anyone belonging to Ahab’s household who dies in the field.
  preserved_meaning: The parallel clause retains Ahab’s household as the referent, the field setting, and the image of birds eating the dead.
  reasoning_layer_used: POB lexical decisions for וְהַמֵּת, בַּשָּׂדֶה, and עוֹף הַשָּׁמַיִם
  rationale: Repeating the full referent prevents ambiguity while preserving the city-field contrast.
