translation:
  language: en
  text: When Jezebel heard that Naboth had been stoned and had died, she said to Ahab, “Get up and take possession of the vineyard belonging to Naboth from Jezreel. He refused to give it to you in exchange for silver,[a] but now he is no longer alive; he is dead.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “He refused to sell it to you for money.” The Hebrew says literally, “give it to you for silver.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the vineyard of Naboth the Jezreelite
  simplified_phrase: the vineyard belonging to Naboth from Jezreel
  preserved_meaning: The vineyard belonged to Naboth, who was identified with Jezreel.
  reasoning_layer_used: POB lexical decision for הַיִּזְרְעֵאלִי
  rationale: “From Jezreel” makes the unfamiliar gentilic immediately understandable.
- pob_phrase: which he refused to give you for silver
  simplified_phrase: He refused to give it to you in exchange for silver
  preserved_meaning: Naboth had rejected Ahab’s proposed silver-based transaction without narrowing “give” to “sell.”
  reasoning_layer_used: POB lexical decisions for מֵאֵן לָתֵת לְךָ בְכֶסֶף and בְכֶסֶף
  rationale: A separate sentence and “in exchange for” clarify the transaction while retaining “give” and “silver.”
- pob_phrase: because Naboth is not alive; he is dead
  simplified_phrase: but now he is no longer alive; he is dead
  preserved_meaning: Naboth’s death has removed the obstacle Jezebel has just mentioned.
  reasoning_layer_used: POB lexical decisions for אֵין נָבוֹת חַי and כִּי מֵת
  rationale: The contrastive wording makes Jezebel’s blunt logic natural while preserving the emphatic two-part statement.
translation_notes:
  risk_flags:
  - risk: “But now” expresses the contextual contrast more directly than the Hebrew conjunction.
    mitigation: The wording preserves Jezebel’s stated reason and does not add a new event or motive.
