translation:
  language: en
  text: “Have you seen how Ahab has humbled himself before me? Because he has humbled himself before me, I will not bring this disaster during his lifetime. I will bring it on his family during his son’s lifetime.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Have you seen that Ahab has humbled himself before me?
  simplified_phrase: Have you seen how Ahab has humbled himself before me?
  preserved_meaning: God directs Elijah’s attention to Ahab’s self-humbling without calling it repentance.
  reasoning_layer_used: Lexical and theological decisions on נִכְנַע.
  rationale: “How” makes the question natural while keeping the limited claim of self-humbling.
- pob_phrase: in his days; in his son's days
  simplified_phrase: during his lifetime; during his son’s lifetime
  preserved_meaning: The disaster is delayed beyond Ahab’s life but will come during his son’s life.
  reasoning_layer_used: Lexical decisions on בְּיָמָיו and בִּימֵי בְנוֹ.
  rationale: The wording replaces an older temporal idiom with ordinary English.
- pob_phrase: on his house
  simplified_phrase: on his family
  preserved_meaning: The judgment will fall on Ahab’s family or royal line, not on a building.
  reasoning_layer_used: Lexical rationale and POB footnote on עַל בֵּיתוֹ.
  rationale: “Family” avoids treating household and dynasty as two separate targets.
interpretive_expansions:
- pob_phrase: on his house
  rendering: on his family
  claim: Ahab’s “house” means his family line rather than his residence.
  evidence:
  - The POB footnote gives household or dynasty as possible senses.
  - The lexical rationale says royal “house” can imply a dynasty or household.
  confidence: high
  alternatives_preserved:
  - household
  - dynasty
translation_notes:
  risk_flags:
  - risk: “Family” may not fully display the royal-dynasty nuance.
    mitigation: The rendering preserves the shared family-line sense without falsely combining alternatives.
