translation:
  language: en
  text: “Get up and go down to meet Ahab, the king of Israel, who is in Samaria. Look—he is in Naboth’s vineyard. He has gone down there to take possession of it.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “to possess it” or “to inherit it.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Arise, go down to meet
  simplified_phrase: Get up and go down to meet
  preserved_meaning: The wording keeps both brisk commands and the direction of Ahab’s journey.
  reasoning_layer_used: POB lexical decisions for קום and ירד
  rationale: “Get up” is clearer modern English than “arise” without weakening the command.
- pob_phrase: in the vineyard of Naboth
  simplified_phrase: in Naboth’s vineyard
  preserved_meaning: Ahab is located in the vineyard belonging to Naboth.
  reasoning_layer_used: POB lexical decision for בְּכֶרֶם נָבוֹת
  rationale: The possessive form is shorter and more natural in modern English.
- pob_phrase: where he has gone down to take possession of it
  simplified_phrase: He has gone down there to take possession of it
  preserved_meaning: Ahab went down to the vineyard in order to claim it as his own.
  reasoning_layer_used: POB lexical decisions for אֲשֶׁר יָרַד שָׁם and לְרִשְׁתּוֹ
  rationale: A separate sentence makes the purpose easier to follow while preserving the repeated downward movement.
