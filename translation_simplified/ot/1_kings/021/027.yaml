translation:
  language: en
  text: When Ahab heard these words, he tore his clothes. He put sackcloth[a] against his skin, fasted, and lay down in sackcloth. He moved about in a subdued way.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sackcloth was a coarse material worn as a sign of mourning or humiliation.
    reason: cultural_note
simplification_decisions:
- pob_phrase: And it happened, when Ahab heard these words
  simplified_phrase: When Ahab heard these words
  preserved_meaning: Ahab responded after hearing Elijah’s spoken judgment.
  reasoning_layer_used: Lexical decision for וַיְהִי כִשְׁמֹעַ
  rationale: The shorter opening preserves the sequence in natural modern English.
- pob_phrase: put sackcloth on his flesh
  simplified_phrase: put sackcloth against his skin
  preserved_meaning: The sackcloth was in direct contact with Ahab’s body.
  reasoning_layer_used: Lexical decision for וַיָּשֶׂם שַׂק עַל בְּשָׂרוֹ
  rationale: “Against his skin” keeps the bodily image without the awkward modern sense of “flesh.”
- pob_phrase: went about softly
  simplified_phrase: moved about in a subdued way
  preserved_meaning: Ahab’s manner of moving was quiet, restrained, and humbled.
  reasoning_layer_used: Lexical decision for וַיְהַלֵּךְ אַט
