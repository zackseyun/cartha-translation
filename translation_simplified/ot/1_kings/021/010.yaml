translation:
  language: en
  text: Have two corrupt men sit across from him and testify against him. They are to say, “You cursed[a] God and the king.” Then take him out and stone him to death.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “blessed.” Here “blessed” is a respectful substitute for “cursed.”
    reason: lexical_alternative
