- pob_phrase: seat two worthless men opposite him
  simplified_phrase: have two corrupt men sit across from him
  preserved_meaning: Two morally corrupt male witnesses are positioned facing Naboth in the formal hearing.
  reasoning_layer_used: POB lexical decisions for וְהוֹשִׁיבוּ, שְׁנַיִם אֲנָשִׁים, בְּנֵי בְלִיַּעַל, and נֶגְדּוֹ
  rationale: The active wording and common term “corrupt” make the staged hearing easier to picture.
- pob_phrase: let them testify against him, saying
  simplified_phrase: testify against him. They are to say
  preserved_meaning: The two men must give formal testimony containing the specified false charge.
  reasoning_layer_used: POB lexical decision for וִיעִדֻהוּ and לֵאמֹר
  rationale: Two sentences make the legal accusation easier to follow without weakening its force.
- pob_phrase: stone him, so that he dies
  simplified_phrase: stone him to death
  preserved_meaning: Stoning is the prescribed means of execution and death is its intended result.
  reasoning_layer_used: POB lexical decisions for וְסִקְלֻהוּ and וְיָמֹת
  rationale: The familiar phrase states the same means and intended result more directly.
