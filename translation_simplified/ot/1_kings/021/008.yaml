translation:
  language: en
  text: So she wrote letters using Ahab’s name and stamped them with his seal. She sent them to the elders and nobles who lived in the same city as Naboth.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the elders and nobles who were in Ahab’s city.” The Hebrew could refer to either Naboth’s city or Ahab’s city.
    reason: alternative_reading
