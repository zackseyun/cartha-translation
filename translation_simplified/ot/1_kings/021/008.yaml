  simplified_phrase: using Ahab’s name
  preserved_meaning: Jezebel wrote the letters under Ahab’s identity and authority.
  reasoning_layer_used: lexical decision for בְּשֵׁם אַחְאָב
  rationale: “Using” makes the official representation easier to understand without adding motive.
- pob_phrase: sealed them with his seal
  simplified_phrase: stamped them with his seal
  preserved_meaning: She authenticated the letters with Ahab’s official seal.
  reasoning_layer_used: lexical decision for וַתַּחְתֹּם בְּחֹתָמוֹ
  rationale: “Stamped” clearly describes how a seal was applied while preserving the concrete image.
- pob_phrase: who were in his city, who were living with Naboth
  simplified_phrase: who lived in the same city as Naboth
  preserved_meaning: The elders and nobles were local leaders residing where Naboth lived.
  reasoning_layer_used: theological decision on the suffix in בְּעִירוֹ and lexical decision for הַיֹּשְׁבִים אֶת נָבוֹת
  rationale: The two overlapping location clauses are combined into one natural phrase.
