translation:
  language: en
  text: 'Tell him, “This is what Yahweh says: Have you murdered a man and also taken what belonged to him?” Then tell him, “This is what Yahweh says: In the place where dogs licked Naboth’s blood, dogs will lick your blood too—yes, yours.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And you shall speak to him, saying
  simplified_phrase: Tell him
  preserved_meaning: Elijah is commanded to deliver Yahweh’s message directly to Ahab.
  reasoning_layer_used: POB lexical decision on the prophetic commissioning formula
  rationale: The shorter command is natural English while preserving the repeated instruction.
- pob_phrase: Thus says Yahweh
  simplified_phrase: This is what Yahweh says
  preserved_meaning: The words are Yahweh’s authoritative prophetic message.
  reasoning_layer_used: POB lexical decision on the messenger formula and divine name
  rationale: The common-English formula keeps both prophetic authority and the name Yahweh.
- pob_phrase: your blood—you also
  simplified_phrase: your blood too—yes, yours
  preserved_meaning: Ahab himself will suffer the same bloody disgrace associated with Naboth.
  reasoning_layer_used: POB theological decision on the emphatic גַּם אָתָּה
  rationale: The closing words preserve the Hebrew’s abrupt personal emphasis.
interpretive_expansions:
- pob_phrase: Have you murdered and also taken possession?
  rendering: Have you murdered a man and also taken what belonged to him?
  claim: Ahab took property belonging to the person whose murder is charged to him.
  evidence:
  - The immediate narrative identifies Naboth as the murdered man and his vineyard as the property Ahab took.
  - The POB rationale says Ahab appropriated Naboth’s vineyard after his death.
  confidence: high
  alternatives_preserved:
  - Have you murdered and also taken possession?
  - Have you murdered and also seized his property?
translation_notes:
  risk_flags:
  - risk: “A man” makes the unstated victim explicit without naming him in the accusation.
    mitigation: The context clearly supplies a human victim, and the next sentence identifies Naboth.
