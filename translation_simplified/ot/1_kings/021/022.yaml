  preserved_meaning: Ahab directly caused the people of Israel to commit sin.
  reasoning_layer_used: Lexical decision for וַתַּחֲטִא אֶת יִשְׂרָאֵל and grounding review
  rationale: Retaining “caused” preserves the Hebrew verb’s direct causative force.
