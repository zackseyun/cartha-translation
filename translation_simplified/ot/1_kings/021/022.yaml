- pob_phrase: make your house like the house of
  simplified_phrase: make your house end up like the house of
  preserved_meaning: The LORD will bring Ahab’s royal line to the same ruined state as the earlier dynasties.
  reasoning_layer_used: Lexical decision for וְנָתַתִּי and royal-context decision for בֵּיתְךָ
  rationale: “End up like” clarifies that the comparison concerns the resulting fate of these royal houses.
- pob_phrase: because of the provocation with which you have provoked me
  simplified_phrase: because you have provoked me to anger
  preserved_meaning: Ahab’s offense against the LORD provoked divine anger and is the reason for judgment.
  reasoning_layer_used: Lexical decisions for אֶל הַכַּעַס and אֲשֶׁר הִכְעַסְתָּ
  rationale: The rewrite removes repetition while preserving the cause and the force of provoking anger.
- pob_phrase: caused Israel to sin
