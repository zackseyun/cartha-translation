translation:
  language: en
  text: 'The two wicked men[a] came in and sat facing Naboth. In front of the people, they testified against him: “Naboth cursed[b] God and the king.” Then they took Naboth outside the city and threw stones at him until he died.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew idiom literally means “sons of Belial” or “men of Belial” and describes morally corrupt men.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says “blessed” as a reverential euphemism, but the accusation means “cursed.”
    reason: lexical_alternative
