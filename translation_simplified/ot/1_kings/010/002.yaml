translation:
  language: en
  text: She arrived in Jerusalem with a very large group of attendants.[a] The camels carried spices, a great deal of gold, and precious stones. Then she went to Solomon and spoke with him about everything that was in her heart.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also suggest great wealth or strength, but here it most likely describes her impressive royal company.
    reason: lexical_alternative
