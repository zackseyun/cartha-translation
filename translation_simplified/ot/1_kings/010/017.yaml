translation:
  language: en
  text: There were also 300 shields made with gold hammered into thin sheets. Three minas of gold were applied to each shield.[a] The king put them in the royal building called the House of the Forest of Lebanon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A mina was an ancient unit of weight.
    reason: cultural_note
  - marker: b
    text: This was a royal building in Solomon’s palace complex, perhaps used as an armory; see 1 Kings 7:2.
    reason: cross_reference
