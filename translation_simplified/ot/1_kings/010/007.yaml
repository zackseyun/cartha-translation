translation:
  language: en
  text: I did not believe the reports until I came and saw it with my own eyes. In fact, I had not been told even half of it. Your wisdom and prosperity[a] are far greater than the report I heard.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “wealth.” Here “prosperity” includes Solomon’s royal success and may include his wealth.
    reason: lexical_alternative
