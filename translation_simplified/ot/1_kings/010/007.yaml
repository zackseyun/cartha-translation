  simplified_phrase: until I came and saw it with my own eyes
  preserved_meaning: The queen personally confirmed what she had heard about Solomon.
  reasoning_layer_used: Lexical decision for וַתִּרְאֶינָה עֵינַי
  rationale: The familiar English idiom preserves the Hebrew emphasis on firsthand sight.
- pob_phrase: and behold, not even half was told to me
  simplified_phrase: In fact, I had not been told even half of it
  preserved_meaning: The reality greatly exceeded what the queen had been told.
  reasoning_layer_used: Lexical decisions for וְהִנֵּה and לֹא הֻגַּד לִי הַחֵצִי
  rationale: “In fact” carries the emphatic turn without using the unfamiliar “behold.”
- pob_phrase: You have surpassed the report that I heard in wisdom and prosperity
  simplified_phrase: Your wisdom and prosperity are far greater than the report I heard
  preserved_meaning: Solomon’s actual wisdom and flourishing exceeded the report about him.
  reasoning_layer_used: Lexical decisions for הוֹסַפְתָּ, חָכְמָה וָטוֹב, and שְׁמוּעָה
  rationale: The comparison is recast in natural English while keeping both wisdom and prosperity distinct.
