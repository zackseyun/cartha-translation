translation:
  language: en
  text: The king used the almug wood[a] to make supports[b] for Yahweh’s temple and the royal palace. He also made lyres and harps from it for the singers. Almug wood like this had never arrived before, and none like it had been seen up to the time this account was written.
  philosophy: optimal-equivalence
  footnotes:
