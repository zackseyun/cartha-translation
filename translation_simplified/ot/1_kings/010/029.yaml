- pob_phrase: a chariot was imported from Egypt for six hundred shekels of silver, and a horse for a hundred and fifty
  simplified_phrase: A chariot imported from Egypt cost 600 shekels of silver, and a horse cost 150 shekels of silver
  preserved_meaning: Each imported chariot and horse had the stated price in silver shekels.
  reasoning_layer_used: POB lexical decisions on trade context, unit pricing, and currency
  rationale: The prices and repeated currency unit are stated directly for immediate clarity.
- pob_phrase: and so they exported them
  simplified_phrase: Chariots and horses were also exported
  preserved_meaning: The same kinds of goods were traded onward to other kings.
  reasoning_layer_used: POB lexical decisions for וְכֵן and יֹצִיאוּ
  rationale: Naming the goods removes an unclear pronoun while the passive avoids inventing an agent.
- pob_phrase: to all the kings of the Hittites and to the kings of Aram
  simplified_phrase: to all the Hittite kings and the kings of Aram
  preserved_meaning: The recipients were the Hittite rulers and the rulers of Aram.
  reasoning_layer_used: POB lexical decisions on the recipient groups and proper name Aram
  rationale: The shorter wording keeps both political groups and preserves the name Aram.
