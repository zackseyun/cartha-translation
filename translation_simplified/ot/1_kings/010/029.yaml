translation:
  language: en
  text: A chariot imported from Egypt cost 600 shekels of silver, and a horse cost 150 shekels of silver. Chariots and horses were also exported to all the Hittite kings and the kings of Aram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The kings of Aram were Aramean kings; older translations often say “Syria.”
    reason: alternative_reading
