translation:
  language: en
  text: Your father made our yoke heavy.[a] Now make the hard service he required of us easier and lighten the heavy yoke he placed on us. Then we will serve you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The yoke is an image for the oppressive work and other obligations placed on the people.
    reason: simplification_note
