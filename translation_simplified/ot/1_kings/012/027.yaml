translation:
  language: en
  text: If these people go up to Jerusalem to offer sacrifices at Yahweh’s temple,[a] their hearts will turn back to their lord, Rehoboam king of Judah. Then they will kill me and return to Rehoboam king of Judah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “When these people go up.” The Hebrew can have either sense here, but “if” best expresses Jeroboam’s fear.
    reason: lexical_alternative
