  preserved_meaning: The people make a pilgrimage to Jerusalem to sacrifice at Yahweh’s sanctuary.
  reasoning_layer_used: POB lexical decisions and cultural note
  rationale: “Temple” makes the meaning of Yahweh’s house immediately clear while “go up” preserves the pilgrimage image.
- pob_phrase: the heart of this people will return
  simplified_phrase: their hearts will turn back
  preserved_meaning: The people will renew their inward and political allegiance to Rehoboam.
  reasoning_layer_used: POB lexical rationale for וְשָׁב לֵב הָעָם הַזֶּה
  rationale: The plural wording is natural English while retaining the Hebrew heart image and the idea of returning allegiance.
- pob_phrase: and they will kill me and return to Rehoboam king of Judah
  simplified_phrase: Then they will kill me and return to Rehoboam king of Judah
  preserved_meaning: Jeroboam fears that renewed loyalty to Rehoboam will lead to his death and the people’s political return.
  reasoning_layer_used: POB translation and lexical decisions
  rationale: A new sentence and “Then” make the feared sequence easy to follow without weakening it.
