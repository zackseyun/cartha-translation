translation:
  language: en
  text: When all Israel realized that the king had refused to listen to them, the people replied, “What share do we have in David? We have no inheritance in Jesse’s son. Go home, Israel![a] Now look after your own house, David.[b]” So the Israelites went home.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “To your tents, Israel!”—a call to disperse and withdraw allegiance.
    reason: simplification_note
  - marker: b
    text: “House” may also mean David’s royal dynasty here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: saw that the king had not listened to them
  simplified_phrase: realized that the king had refused to listen to them
  preserved_meaning: Israel recognized that the king had rejected their appeal.
  reasoning_layer_used: Lexical decision for ראה and שׁמע with אֶל
  rationale: The clearer wording expresses the recognition and refusal already identified in the POB rationale.
- pob_phrase: To your tents, O Israel!
  simplified_phrase: Go home, Israel!
  preserved_meaning: The tribes are called to disperse and end their allegiance to the king.
  reasoning_layer_used: POB lexical alternative and idiom rationale
  rationale: The main text gives the idiom’s ordinary meaning while the footnote retains its concrete image.
- pob_phrase: Now see to your own house, David
  simplified_phrase: Now look after your own house, David
  preserved_meaning: David’s royal house is dismissively told to manage its own affairs.
  reasoning_layer_used: Lexical decision for ראה and ambiguity note for בֵיתְךָ
  rationale: “Look after” is common English, while “house” and its dynastic ambiguity remain.
interpretive_expansions:
- pob_phrase: had not listened to them
  rendering: had refused to listen to them
  claim: The king rejected the people’s appeal rather than merely failing to hear it.
  evidence:
  - The POB lexical rationale says שׁמע with אֶל means to heed.
  - The immediate context presents the king’s deliberate refusal.
  confidence: high
  alternatives_preserved:
  - had not listened to them
- pob_phrase: To your tents, O Israel!
  rendering: Go home, Israel!
  claim: The command calls the tribes to disperse and withdraw allegiance.
  evidence:
  - The POB lexical rationale identifies this as a stock call for dispersal and political withdrawal.
  - The next clause reports that Israel departed.
  confidence: high
  alternatives_preserved:
  - To your tents, Israel!
translation_notes:
  risk_flags:
  - risk: “Go home” could hide the Hebrew tent image and its political force.
    mitigation: Footnote a preserves both the literal image and the withdrawal-of-allegiance sense.
  - risk: Modern readers may take “house” only as a building or household.
    mitigation: Footnote b preserves the possible dynastic meaning without resolving the ambiguity.
