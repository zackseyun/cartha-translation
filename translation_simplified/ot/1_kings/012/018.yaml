translation:
  language: en
  text: Then King Rehoboam sent Adoram,[a] the official in charge of forced labor. All Israel stoned Adoram to death. King Rehoboam hurried to climb into his chariot and flee to Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew here has “Adoram”; related passages use the form “Adoniram.”
    reason: alternative_reading
