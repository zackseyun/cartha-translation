- pob_phrase: who was over the forced labor
  simplified_phrase: the official in charge of forced labor
  preserved_meaning: Adoram supervised labor imposed by the state.
  reasoning_layer_used: POB lexical decisions for אֲשֶׁר עַל הַמַּס and הַמַּס
  rationale: “Official in charge” states his government role in ordinary English.
- pob_phrase: stoned him with stones, and he died
  simplified_phrase: stoned Adoram to death
  preserved_meaning: Israel killed Adoram by throwing stones at him.
  reasoning_layer_used: POB lexical decisions for וַיִּרְגְּמוּ ... אֶבֶן and וַיָּמֹת
  rationale: The wording keeps the concrete stoning image while removing English redundancy.
- pob_phrase: made haste to get up into the chariot to flee
  simplified_phrase: hurried to climb into his chariot and flee
  preserved_meaning: Rehoboam urgently mounted the chariot to escape.
  reasoning_layer_used: POB lexical decisions for הִתְאַמֵּץ, לַעֲלוֹת בַּמֶּרְכָּבָה, and לָנוּס
  rationale: The revised clause expresses urgent self-exertion in natural modern English.
