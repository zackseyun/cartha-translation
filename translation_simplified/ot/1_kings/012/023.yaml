translation:
  language: en
  text: “Speak to Rehoboam son of Solomon, king of Judah, to the whole community of Judah and Benjamin,[a] and to the rest of the people.[b] Say to them:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally “the whole house of Judah and Benjamin,” meaning the community united with these tribes.
    reason: simplification_note
  - marker: b
    text: In this context, “the people” may mean those gathered for war, but the Hebrew does not explicitly call them an army.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: all the house of Judah and Benjamin
  simplified_phrase: the whole community of Judah and Benjamin
