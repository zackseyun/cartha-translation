  reasoning_layer_used: POB lexical decision for כָּל בֵּית יְהוּדָה and its corporate-political sense
  rationale: “Community” makes the Hebrew collective idiom understandable without reducing it to a place name.
- pob_phrase: saying,
  simplified_phrase: 'Say to them:'
  preserved_meaning: The command introduces the message that follows in the next verse.
  reasoning_layer_used: POB lexical decision for לֵאמֹר
  rationale: A direct command and colon clearly signal that the message continues.
