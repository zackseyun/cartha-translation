translation:
  language: en
  text: Jeroboam held a festival on the fifteenth day of the eighth month,[a] like the festival celebrated in Judah. He went up to the altar.[b] He did the same at Bethel, sacrificing to the calves he had made. He also installed at Bethel the priests for the worship sites called high places, which he had established.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The festival in Judah was probably the Feast of Booths, held on the fifteenth day of the seventh month; Jeroboam placed his rival festival one month later.
    reason: cross_reference
  - marker: b
    text: The Hebrew can be rendered “went up on the altar,” but here it refers to going up to the altar to officiate.
    reason: lexical_alternative
