translation:
  language: en
  text: He asked them, “What do you advise us to say in answer to these people who said to me, ‘Make the yoke[a] your father put on us lighter’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “yoke” represents the heavy labor and obligations the king imposed on the people.
    reason: cultural_note
simplification_decisions:
- pob_phrase: What do you advise, that we may answer this people
  simplified_phrase: What do you advise us to say in answer to these people?
  preserved_meaning: He asks his advisers what response they recommend giving the people.
  reasoning_layer_used: The lexical decisions preserve both the request for counsel and the purpose of answering.
  rationale: The recast question expresses the relationship in ordinary English.
- pob_phrase: this people who have spoken to me, saying
  simplified_phrase: these people who said to me
  preserved_meaning: The people, not the advisers, made the quoted request.
  reasoning_layer_used: The lexical rationale permits a direct introduction to the quotation.
  rationale: Keeping “these people” as the subject prevents an unclear pronoun reference.
- pob_phrase: Lighten the yoke that your father put on us
  simplified_phrase: Make the yoke your father put on us lighter
  preserved_meaning: The people ask for relief from the burden imposed by the king’s father while the yoke image remains intact.
  reasoning_layer_used: The lexical decisions require the yoke metaphor and the sense of reducing its weight.
  rationale: The new word order is easier to understand without flattening the image.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “yoke” only as a literal object.
    mitigation: The footnote explains the metaphor while preserving the source image.
