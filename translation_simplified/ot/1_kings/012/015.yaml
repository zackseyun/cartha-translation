translation:
  language: en
  text: So the king did not listen to the people. This turn of events came from Yahweh,[a] so that he would fulfill his word—the word he had spoken through Ahijah from Shiloh to Jeroboam son of Nebat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the cause was from Yahweh.” The Hebrew can refer to a cause or to a turn in circumstances.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: for it was a turn of events from Yahweh
  simplified_phrase: This turn of events came from Yahweh
  preserved_meaning: The outcome had its source in Yahweh without explaining the precise mechanics of his causation.
  reasoning_layer_used: Theological decision on divine causation and human action
  rationale: A separate sentence makes the providential claim clear while preserving its tension.
- pob_phrase: in order to establish his word
  simplified_phrase: so that he would fulfill his word
  preserved_meaning: Yahweh brought his earlier prophetic word to completion.
  reasoning_layer_used: Lexical decision for לְמַעַן הָקִים and דְּבָרוֹ
  rationale: “Fulfill” expresses the prophetic sense of “establish” in familiar English while retaining “word.”
- pob_phrase: by the hand of Ahijah the Shilonite
  simplified_phrase: through Ahijah from Shiloh
  preserved_meaning: Yahweh delivered his word through the prophet Ahijah, who was associated with Shiloh.
  reasoning_layer_used: Lexical decisions for בְּיַד and הַשִּׁילֹנִי
  rationale: The Hebrew agency idiom and gentilic are recast in direct modern English.
translation_notes:
  risk_flags:
  - risk: “Came from Yahweh” could be read as specifying direct causation.
    mitigation: “Turn of events” and the footnote preserve the Hebrew breadth without defining the mechanism.
  - risk: “Fulfill” is more explicit than the formal term “establish.”
    mitigation: The prophetic context and POB lexical rationale support fulfillment while “his word” preserves the biblical concept.
