  rationale: “Sent for him” makes the unstated object natural in English without adding a ceremony.
- pob_phrase: and made him king over all Israel
  simplified_phrase: There they made him king over all Israel.
  preserved_meaning: The assembly established Jeroboam as king over Israel.
  reasoning_layer_used: Lexical decision for וַיַּמְלִיכוּ אֹתוֹ
  rationale: A separate sentence clarifies where the royal appointment occurred while retaining “made him king.”
- pob_phrase: None followed the house of David except the tribe of Judah alone
  simplified_phrase: Only the tribe of Judah remained loyal to David’s royal house.
  preserved_meaning: Judah alone continued its political allegiance to David’s dynasty.
  reasoning_layer_used: Lexical and theological decisions on the allegiance formula
