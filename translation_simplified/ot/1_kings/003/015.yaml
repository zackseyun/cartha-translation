  text: Solomon woke up and realized that it had been a dream. Then he came to Jerusalem and stood before the ark of the LORD’s covenant. He offered sacrifices that were burned completely on the altar, as well as peace offerings.[a] Then he held a feast for everyone who served him.
  philosophy: optimal-equivalence
  footnotes:
