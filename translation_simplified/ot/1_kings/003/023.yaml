  rationale: The POB footnote identifies this as the more idiomatic meaning of the feminine demonstratives.
- pob_phrase: This is my son, the living one
  simplified_phrase: The living son is mine
  preserved_meaning: Each woman claims the living son as her own.
  reasoning_layer_used: POB lexical decisions for son and the living one
  rationale: The simpler clause keeps both the male child and the living-versus-dead contrast.
- pob_phrase: No, for
  simplified_phrase: No!
  preserved_meaning: The second woman sharply denies and reverses the first woman's claim.
  reasoning_layer_used: POB lexical decision for לֹא כִי
