- pob_phrase: and he took Pharaoh’s daughter
  simplified_phrase: by marrying Pharaoh’s daughter
  preserved_meaning: Solomon entered the alliance through marriage to Pharaoh’s daughter.
  reasoning_layer_used: POB lexical decision for וַיִּקַּח and alliance context
  rationale: The rewrite replaces the opaque Hebrew marriage idiom “took” with direct modern English.
- pob_phrase: the house of Yahweh
  simplified_phrase: Yahweh’s temple
  preserved_meaning: The building was the sacred house dedicated to Yahweh.
  reasoning_layer_used: POB lexical alternative and theological decision
  rationale: “Temple” makes the building clear while retaining Yahweh’s personal name.
- pob_phrase: until he had finished building his own house, and the house of Yahweh, and the wall around Jerusalem
  simplified_phrase: until Solomon finished building his own house, Yahweh’s temple, and the wall around Jerusalem
  preserved_meaning: Her stay continued until Solomon completed all three building projects.
  reasoning_layer_used: POB temporal and lexical decisions
  rationale: Naming Solomon again and using a clean list makes the long clause easier to follow.
