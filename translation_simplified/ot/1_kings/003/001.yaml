translation:
  language: en
  text: Solomon formed a marriage alliance with Pharaoh, the king of Egypt, by marrying Pharaoh’s daughter. He brought her into the City of David, where she stayed until Solomon finished building his own house, Yahweh’s temple, and the wall around Jerusalem.
  philosophy: optimal-equivalence
