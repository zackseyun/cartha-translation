  - The POB lexical rationale says “took” is a standard idiom for marriage in this context.
  confidence: high
  alternatives_preserved:
  - became related by marriage to Pharaoh
- pob_phrase: brought her into the city of David until
  rendering: brought her into the City of David, where she stayed until
  claim: Pharaoh’s daughter remained in the City of David during the stated period.
  evidence:
  - The clause ending with “until” marks the endpoint of her situation in the City of David.
  - The POB rationale describes this period as her staying there.
  confidence: high
