  rationale: The wording preserves the dramatic discovery without using the unfamiliar command “behold.”
- pob_phrase: behold, he was not my son
  simplified_phrase: I saw that he was not the son
  preserved_meaning: Her close inspection leads her to recognize that the dead infant is not hers.
  reasoning_layer_used: POB lexical decisions for וָאֶתְבּוֹנֵן and לֹא הָיָה בְנִי
  rationale: The result of her careful look is stated in natural narrative English.
- pob_phrase: whom I had borne
