translation:
  language: en
  text: So give me, your servant, a heart that listens,[a] so that I can judge your people and discern between good and evil, for who can judge this great[b] people of yours?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “an understanding heart”; the Hebrew literally says “a hearing” or “listening heart.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word for “great” literally means “heavy” or “weighty.” Here it can express the people’s importance or the weight of governing them.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: give your servant
  simplified_phrase: give me, your servant
  preserved_meaning: Solomon humbly speaks of himself as God’s servant.
  reasoning_layer_used: POB lexical decision for לְעַבְדְּךָ
  rationale: Adding “me” clearly identifies the servant without removing Solomon’s humble title.
- pob_phrase: a listening heart
  simplified_phrase: a heart that listens
  preserved_meaning: Solomon asks for inner receptivity and understanding while retaining the Hebrew heart image.
  reasoning_layer_used: POB lexical and theological decisions for לֵב שֹׁמֵעַ
  rationale: A full clause makes the compact Hebrew image easier to understand.
- pob_phrase: to judge your people, to discern
  simplified_phrase: so that I can judge your people and discern
  preserved_meaning: Wise discernment is the purpose of Solomon’s request and remains distinct from judging.
  reasoning_layer_used: POB lexical decisions for לִשְׁפֹּט and לְהָבִין
  rationale: The purpose clause and coordination make the relationship of the two actions clear.
translation_notes:
  risk_flags:
  - risk: “Heart” may be understood as emotion alone.
    mitigation: The listening language and footnote identify understanding and responsiveness.
  - risk: “Great” does not directly convey the Hebrew image of weight.
    mitigation: The footnote preserves importance and governing weight as contextual possibilities.
