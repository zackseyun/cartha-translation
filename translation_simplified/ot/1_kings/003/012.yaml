translation:
  language: en
  text: See, I have done what you asked. I have given you a heart[a] so wise and discerning that no one like you has ever come before you, and no one like you will arise after you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “heart” means the inner ability to think, judge, and understand, not merely the emotions.
    reason: lexical_alternative
