  preserved_meaning: God has acted in response to Solomon’s stated request.
  reasoning_layer_used: Immediate context and lexical alternative
  rationale: The contextual meaning is clearer than the formal English phrase “according to your words.”
- pob_phrase: such that no one like you has been before you
