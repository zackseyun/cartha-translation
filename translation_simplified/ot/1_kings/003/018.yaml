translation:
  language: en
  text: On the third day after I gave birth, this woman also gave birth. We were together in the house. No outsider[a] was there with us; only the two of us were in the house.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “stranger”; the Hebrew refers to someone who did not belong to their group or household.
    reason: lexical_alternative
