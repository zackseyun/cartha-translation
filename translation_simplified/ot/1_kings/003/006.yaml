translation:
  language: en
  text: Solomon said, “You showed great covenant faithfulness[a] to my father David, your servant, because he walked before you—he lived faithfully, did what was right, and had an upright heart before you. You have kept this great covenant faithfulness toward him. You have given him a son who now sits on his throne, as is clearly seen today.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “steadfast love” or “loyal love.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew expression points to the present situation as visible confirmation.
    reason: cultural_note
simplification_decisions:
- pob_phrase: walked before you in faithfulness, in righteousness, and in uprightness of heart with you
  simplified_phrase: walked before you—he lived faithfully, did what was right, and had an upright heart before you
  preserved_meaning: David lived faithfully and rightly in God’s presence with inner integrity.
  reasoning_layer_used: Lexical decisions for the walking idiom, faithfulness, righteousness, uprightness of heart, and “with you.”
  rationale: The wording explains the walking image while keeping the three distinct moral qualities and their relation to God.
- pob_phrase: you have kept for him this great covenant faithfulness
  simplified_phrase: You have kept this great covenant faithfulness toward him
  preserved_meaning: God continued his covenant loyalty toward David.
  reasoning_layer_used: Lexical and theological decisions for covenant faithfulness and “kept for him.”
  rationale: The recast clause makes the continuation of God’s covenant loyalty easier to follow.
- pob_phrase: a son sitting on his throne, as it is this day
  simplified_phrase: a son who now sits on his throne, as is clearly seen today
  preserved_meaning: Solomon’s present reign visibly fulfills God’s faithfulness to David.
  reasoning_layer_used: Lexical decisions for the enthroned son and the Hebrew present-confirmation idiom.
  rationale: An ordinary relative clause and clear time expression convey the present, visible fulfillment.
