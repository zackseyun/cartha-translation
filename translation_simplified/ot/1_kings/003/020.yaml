translation:
  language: en
  text: In the middle of the night, she got up while I, your servant, was asleep. She took my son from beside me and laid him close to her. Then she laid her dead son close to me.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can mean the bosom or lap; both phrases describe placing a child close against the woman’s body.
    reason: lexical_alternative
