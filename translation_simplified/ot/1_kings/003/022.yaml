translation:
  language: en
  text: But the other woman said, “No! The living child is my son, and the dead child is yours.” The first woman answered, “No! The dead child is your son, and the living child is mine.” They argued before the king.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: My son is the living one, and your son is the dead one.
  simplified_phrase: The living child is my son, and the dead child is yours.
  preserved_meaning: The wording keeps the direct contrast between the two identified children.
  reasoning_layer_used: POB lexical decisions for בְּנִי הַחַי and וּבְנֵךְ הַמֵּת
  rationale: Reordering the claim makes the contrast clear without the awkward phrase “the living one.”
- pob_phrase: And this one said
  simplified_phrase: The first woman answered
  preserved_meaning: The woman who made the first claim responds to the other woman.
  reasoning_layer_used: Immediate narrative context and the POB rationale for וְזֹאת אֹמֶרֶת
  rationale: Identifying her place in the exchange avoids the unclear expression “this one.”
- pob_phrase: So they spoke before the king.
  simplified_phrase: They argued before the king.
  preserved_meaning: Both women presented directly opposing claims in the king’s presence.
  reasoning_layer_used: POB lexical rationale for וַתְּדַבֵּרְנָה and immediate context
  rationale: “Argued” clearly describes their contradictory speech without adding duration.
