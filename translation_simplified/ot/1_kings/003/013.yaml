translation:
  language: en
  text: I have also given you what you did not ask for—wealth and honor—so that throughout your life no man among the kings will be like you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “No one like you has been among the kings throughout your life.”
