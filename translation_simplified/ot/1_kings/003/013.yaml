simplification_decisions:
- pob_phrase: both riches and honor
  simplified_phrase: wealth and honor
  preserved_meaning: 'God gives Solomon two distinct benefits: material wealth and royal honor.'
  reasoning_layer_used: POB lexical decision for גַּם עֹשֶׁר גַּם כָּבוֹד
  rationale: “Wealth” is more common than “riches,” while “honor” retains the royal-status sense.
- pob_phrase: all your days
  simplified_phrase: throughout your life
  preserved_meaning: Solomon’s unmatched standing lasts for his whole lifetime.
  reasoning_layer_used: POB lexical decision for כָּל יָמֶיךָ
  rationale: The Hebrew idiom is expressed in direct modern English.
- pob_phrase: so that there has been no man like you among the kings
  simplified_phrase: so that ... no man among the kings will be like you
  preserved_meaning: The gifts result in Solomon’s unmatched status within the class of kings.
  reasoning_layer_used: POB lexical and theological decisions for אֲשֶׁר לֹא הָיָה כָמוֹךָ אִישׁ and בַּמְּלָכִים
  rationale: The future wording fits the promise context while “so that” preserves the result relationship.
interpretive_expansions:
- pob_phrase: there has been no man like you ... all your days
  rendering: throughout your life no man among the kings will be like you
  claim: Solomon’s incomparable status is presented as lasting through his coming lifetime.
  evidence:
  - The words occur within God’s promise of gifts to Solomon.
  - “All your days” sets the duration as Solomon’s whole life.
  - The POB rationale treats this clause as the result of the granted wealth and honor.
  confidence: moderate
  alternatives_preserved:
  - No one like you has been among the kings throughout your life.
translation_notes:
  risk_flags:
