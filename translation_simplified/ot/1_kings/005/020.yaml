translation:
  language: en
  text: Now order that cedar trees from Lebanon be cut for me. My servants will work alongside yours, and I will pay whatever wages you set for your servants. You know that no worker among us[a] can cut timber as skillfully as the Sidonians.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew says “no man among us”; here the expression means that no one among them had comparable skill.
    reason: lexical_alternative
