  text: He was wiser than every other man,[a] including Ethan the Ezrahite,[b] and Heman, Kalkol, and Darda, the sons of Mahol. His name was known throughout all the surrounding nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “than all humankind”; the Hebrew word can refer either to a man or to humanity as a whole.
    reason: lexical_alternative
  - marker: b
    text: “Ezrahite” is an uncertain family or ethnic designation; some understand it as “Zerahite.”
    reason: lexical_alternative
