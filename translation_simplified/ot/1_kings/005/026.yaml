translation:
  language: en
  text: Yahweh gave Solomon wisdom, just as he had said to him. Hiram and Solomon were at peace with each other, and they made a covenant.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A covenant is a binding agreement between parties.
    reason: simplification_note
simplification_decisions:
- pob_phrase: just as he had spoken to him
  simplified_phrase: just as he had said to him
  preserved_meaning: Yahweh’s gift of wisdom fulfilled his earlier word to Solomon without defining that word as a promise.
  reasoning_layer_used: POB lexical decision for כַּאֲשֶׁר דִּבֶּר לוֹ
  rationale: “Said” is natural English and preserves the Hebrew verb’s broad force.
- pob_phrase: there was peace between Hiram and Solomon
  simplified_phrase: Hiram and Solomon were at peace with each other
  preserved_meaning: The two kings had peaceful relations.
  reasoning_layer_used: POB lexical decision for וַיְהִי שָׁלוֹם
  rationale: The recast clause expresses their mutual relationship directly.
- pob_phrase: the two of them made a covenant
  simplified_phrase: they made a covenant
  preserved_meaning: Hiram and Solomon mutually entered the covenant.
  reasoning_layer_used: POB lexical and theological decisions for וַיִּכְרְתוּ בְרִית and שְׁנֵיהֶם
  rationale: The named plural subject makes “the two of them” unnecessary while retaining covenantal language.
translation_notes:
  risk_flags:
  - risk: Modern readers may not know what “covenant” means in this political setting.
    mitigation: The footnote defines it neutrally as a binding agreement without claiming it created the peace.
