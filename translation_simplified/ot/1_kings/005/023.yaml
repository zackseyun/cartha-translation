translation:
  language: en
  text: My servants will bring the logs down from Lebanon to the sea. I will make them into rafts and send them by sea to the place you direct. There I will take the rafts apart, and you will carry the logs away. You must do what I ask by providing food for my household.
  philosophy: optimal-equivalence
