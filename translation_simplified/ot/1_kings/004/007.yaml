translation:
  language: en
  text: Solomon had twelve officials[a] in charge throughout all Israel. They supplied what the king and his household needed. Each official was responsible for supplying them for one month each year.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term refers broadly to appointed administrators and may also be translated “deputies,” “governors,” or “officers.”
    reason: lexical_alternative
