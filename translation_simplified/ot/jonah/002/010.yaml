simplification_decisions:
- pob_phrase: But as for me
  simplified_phrase: But I
  preserved_meaning: Jonah contrasts himself with the idolaters mentioned before him.
  reasoning_layer_used: lexical decision and immediate context
  rationale: “But” keeps the contrast clear without the formal phrase “as for me.”
- pob_phrase: with the voice of thanksgiving I will sacrifice to you
  simplified_phrase: I will offer a sacrifice to you with words of thanks
  preserved_meaning: Jonah promises sacrificial worship accompanied by spoken thanksgiving.
  reasoning_layer_used: lexical decisions for בְּקוֹל תּוֹדָה and אֶזְבְּחָה
  rationale: Natural word order clarifies the sacrifice, while “words of thanks” preserves audible thanksgiving.
- pob_phrase: what I have vowed I will pay
  simplified_phrase: I will fulfill the vows I have made
  preserved_meaning: Jonah promises to carry out his vows to God.
  reasoning_layer_used: lexical decision for אֲשַׁלֵּמָה
  rationale: “Fulfill” clearly expresses the vow-context meaning of “pay.”
translation_notes:
  risk_flags:
  - risk: “Words of thanks” makes the audible sense explicit without retaining the literal image of “voice.”
    mitigation: The wording preserves both spoken expression and thanksgiving, the image’s contextual force.
  - risk: “Fulfill” softens the concrete payment language of the Hebrew vow idiom.
    mitigation: “Fulfill the vows” clearly communicates the same binding obligation.
