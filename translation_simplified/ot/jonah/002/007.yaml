  rendering: The earth’s bars shut me in
  claim: The bars surrounding Jonah function as an image of imprisonment.
  evidence:
  - POB footnote b explicitly describes imprisonment by the earth’s bars or bolts.
  - The lexical rationale says the surrounding bars convey enclosure.
  confidence: high
  alternatives_preserved:
