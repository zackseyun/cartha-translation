translation:
  language: en
  text: I went down to the roots of the mountains.[a] The earth’s bars shut me in forever.[b] But you brought my life up from the pit,[c] Yahweh my God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “to the farthest bases of the mountains.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew pictures the earth enclosing Jonah with bars or bolts, like a prison.
    reason: simplification_note
  - marker: c
    text: “The pit” can also mean the grave or destruction.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the earth with its bars was around me forever
  simplified_phrase: The earth’s bars shut me in forever
  preserved_meaning: The earth is pictured as imprisoning Jonah with no apparent escape.
  reasoning_layer_used: POB lexical decision and footnote b
  rationale: The active wording makes the prison image immediately clear while retaining its force.
- pob_phrase: but you brought up my life from the pit
  simplified_phrase: But you brought my life up from the pit
  preserved_meaning: Yahweh rescued Jonah from the realm of death below.
  reasoning_layer_used: POB lexical decisions for וַתַּעַל, מִשַּׁחַת, and חַיַּי
  rationale: Ordinary English word order improves readability without losing the upward rescue image.
interpretive_expansions:
