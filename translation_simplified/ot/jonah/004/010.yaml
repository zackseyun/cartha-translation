simplification_decisions:
- pob_phrase: had compassion on the plant
  simplified_phrase: had compassion for this plant
  preserved_meaning: Jonah felt pity and concern for the plant.
  reasoning_layer_used: Lexical decisions for חַסְתָּ and עַל.
  rationale: “Compassion for” is natural modern English and retains the chosen sense of compassionate concern.
- pob_phrase: for which you did not labor and which you did not make grow
  simplified_phrase: even though you did not work for it or make it grow
  preserved_meaning: Jonah neither worked to produce the plant nor caused its growth.
  reasoning_layer_used: Lexical decisions for עָמַלְתָּ and גִדַּלְתּוֹ.
  rationale: Common wording preserves both Jonah’s lack of effort and his lack of agency.
- pob_phrase: which came up in a night and perished in a night
  simplified_phrase: It came up in one night and perished in one night
  preserved_meaning: The plant appeared suddenly and disappeared just as quickly.
  reasoning_layer_used: Lexical decisions for the repeated בִּן־לַיְלָה idiom.
  rationale: A separate sentence makes the repeated night contrast easier to follow.
translation_notes:
  risk_flags:
