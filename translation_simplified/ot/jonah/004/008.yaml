translation:
  language: en
  text: As the sun rose, God appointed a scorching east wind.[a] The sun beat down on Jonah’s head until he became faint. He asked to die and said, “It is better for me to die than to live.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Hebrew word may also mean “sultry” or “vehement,” but the context points to oppressive heat.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the sun beat down on Jonah’s head so that he grew faint
  simplified_phrase: The sun beat down on Jonah’s head until he became faint.
  preserved_meaning: The intense sun physically overwhelmed Jonah without necessarily implying that he lost consciousness.
  reasoning_layer_used: POB lexical decision for וַתַּךְ and וַיִּתְעַלָּף
  rationale: A separate sentence and “until” make the cause and result easier to follow.
- pob_phrase: he asked that he might die
  simplified_phrase: He asked to die
  preserved_meaning: Jonah requested death for himself.
  reasoning_layer_used: POB lexical decision for וַיִּשְׁאַל אֶת נַפְשׁוֹ לָמוּת
  rationale: The shorter infinitive construction states the same request in ordinary English.
- pob_phrase: My death is better than my life
  simplified_phrase: It is better for me to die than to live
  preserved_meaning: Jonah directly compares dying with continuing to live.
  reasoning_layer_used: POB lexical decision for טוֹב מוֹתִי מֵחַיָּי
  rationale: The verbal comparison is clearer in modern English while retaining Jonah’s stark claim.
