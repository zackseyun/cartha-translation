translation:
  language: en
  text: Then Jonah left the city and sat down east of it. There he built himself a temporary shelter[a] and sat in its shade while he waited to see what would happen in the city.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew describes a temporary shelter, often made from branches; it may also be called a booth or hut.
    reason: lexical_alternative
  - marker: b
    text: Or “what would become of the city.”
    reason: lexical_alternative
