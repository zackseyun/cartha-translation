translation:
  language: en
  text: But at dawn the next day, God appointed a worm. It attacked the plant,[a] causing it to wither.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew names a particular kind of plant, possibly the castor-oil plant, but its exact identity is uncertain.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: at the rising of dawn the next day
  simplified_phrase: at dawn the next day
  preserved_meaning: The worm appeared at daybreak on the following day.
  reasoning_layer_used: POB lexical decision for בַּעֲלוֹת הַשַּׁחַר
  rationale: The lexical record identifies “at dawn” as the clear modern equivalent.
- pob_phrase: and it struck the plant so that it withered
  simplified_phrase: It attacked the plant, causing it to wither.
  preserved_meaning: The worm damaged the plant and the plant withered as a result.
  reasoning_layer_used: POB lexical decisions for וַתַּךְ and וַיִּיבָשׁ
  rationale: “Attacked” fits a worm damaging a plant, while “causing” keeps the stated result.
- pob_phrase: God appointed a worm
  simplified_phrase: God appointed a worm
  preserved_meaning: God intentionally designated the worm as his agent.
  reasoning_layer_used: POB theological decision on divine agency
  rationale: The key verb is retained because merely saying God allowed the worm would weaken divine agency.
translation_notes:
  risk_flags:
  - risk: “Appointed a worm” is less common English than “sent a worm.”
    mitigation: It remains because it preserves the deliberate divine action and the repeated appointment pattern in Jonah.
  - risk: The general word “plant” does not identify the Hebrew qiqayon.
    mitigation: The footnote preserves the possible castor-oil identification without claiming certainty.
