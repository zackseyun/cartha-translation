translation:
  language: en
  text: But Yahweh hurled a mighty wind onto the sea. A mighty storm arose on the sea, and the ship seemed ready to break apart.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “the ship thought it would be broken,” a Hebrew personification meaning that it seemed likely to break apart.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a great wind ... a great storm
  simplified_phrase: a mighty wind ... a mighty storm
  preserved_meaning: The repeated adjective still emphasizes the great force of both the wind and the storm.
  reasoning_layer_used: POB lexical decisions for רוּחַ גְּדוֹלָה and סַעַר גָּדוֹל
  rationale: “Mighty” communicates powerful intensity more naturally while preserving the Hebrew repetition.
- pob_phrase: and there was a great storm on the sea
  simplified_phrase: A mighty storm arose on the sea
  preserved_meaning: The storm came about on the sea after Yahweh hurled the wind.
  reasoning_layer_used: POB lexical alternative for וַיְהִי סַעַר גָּדוֹל
  rationale: A new sentence and an active verb make the event easier to follow.
- pob_phrase: about to be broken up
  simplified_phrase: ready to break apart
  preserved_meaning: The ship appeared to be on the verge of coming apart in the storm.
  reasoning_layer_used: POB lexical decisions for חִשְּׁבָה and לְהִשָּׁבֵר
  rationale: “Ready to break apart” expresses the imminent danger in common English.
translation_notes:
  risk_flags:
  - risk: Rendering the ship’s personification as “seemed” reduces the literal image of the ship thinking.
    mitigation: The footnote preserves the Hebrew image and explains its meaning.
