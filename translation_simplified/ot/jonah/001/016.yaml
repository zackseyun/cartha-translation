translation:
  language: en
  text: Then the men were filled with great fear and awe[a] of Yahweh. They offered a sacrifice to Yahweh and made vows.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says they “feared a great fear”; this may emphasize being greatly afraid, showing deep reverence, or both.
    reason: lexical_alternative
