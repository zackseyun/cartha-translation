translation:
  language: en
  text: 'Then they said to him, “Please tell us: Because of whom has this disaster come upon us?[a] What kind of work do you do? Where do you come from? What is your homeland, and what people are you from?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “On whose account has this disaster come upon us?” The word translated “disaster” refers here to the threatening danger facing the sailors, not necessarily to moral evil.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: on whose account this trouble has come upon us
  simplified_phrase: Because of whom has this disaster come upon us?
  preserved_meaning: The sailors ask which person is causally connected with the threatening disaster without explicitly assigning blame.
  reasoning_layer_used: POB lexical decision for בַּאֲשֶׁר לְמִי הָרָעָה הַזֹּאת לָנוּ and grounding review
  rationale: The causal question is clearer than “on whose account” and avoids the stronger blame implied by “responsible.”
- pob_phrase: What is your occupation
  simplified_phrase: What kind of work do you do?
  preserved_meaning: They ask Jonah what work he does.
  reasoning_layer_used: POB lexical decision for מַה מְּלַאכְתְּךָ
  rationale: The direct question replaces the formal word “occupation” with common English.
- pob_phrase: What is your land, and from what people are you?
  simplified_phrase: What is your homeland, and what people are you from?
  preserved_meaning: They ask about Jonah’s place of origin and his people-group.
  reasoning_layer_used: POB lexical decisions for מָה אַרְצֶךָ and וְאֵי מִזֶּה עַם אָתָּה
  rationale: “Homeland” and “what people are you from” express the identity questions naturally without imposing modern political categories.
translation_notes:
  risk_flags:
  - risk: “Because of whom” is less idiomatic than a blame-focused question in modern English.
    mitigation: It preserves the Hebrew’s causal ambiguity, while the footnote gives the POB wording.
