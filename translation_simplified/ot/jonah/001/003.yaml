  preserved_meaning: Jonah intended to escape Yahweh while the concrete presence image and its irony remain.
  reasoning_layer_used: Repeated lexical decision for מִלִּפְנֵי יְהוָה and the theological decision for the divine name.
  rationale: Consistent wording clarifies Jonah’s purpose without removing the Hebrew image or divine name.
