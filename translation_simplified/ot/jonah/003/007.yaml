- pob_phrase: he proclaimed and said in Nineveh
  simplified_phrase: He publicly announced in Nineveh
  preserved_meaning: He formally made the decree known within the city.
  reasoning_layer_used: Lexical decision for וַיַּזְעֵק in its royal-edict context
  rationale: The quotation supplies his words, so one clear announcement clause replaces the Hebrew double verb.
- pob_phrase: by decree of the king and his nobles
  simplified_phrase: The king and his leading officials decree
  preserved_meaning: The order carries the authority of the king and the leaders around him.
  reasoning_layer_used: Lexical alternatives for מִטַּעַם and הַמֶּלֶךְ וּגְדֹלָיו
  rationale: The active wording makes the source and authority of the decree immediately clear.
- pob_phrase: Let neither man nor beast, herd nor flock
  simplified_phrase: No man or animal—no herd or flock
  preserved_meaning: The prohibition covers human beings and every stated class of domestic animal.
  reasoning_layer_used: Lexical and theological decisions for אָדָם, בְּהֵמָה, בָּקָר, and צֹאן
  rationale: This retains generic “man” and the human-animal contrast while replacing archaic “beast.”
translation_notes:
