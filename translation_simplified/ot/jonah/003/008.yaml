simplification_decisions:
- pob_phrase: Let both man and beast be covered with sackcloth
  simplified_phrase: Both man and beast must be covered with sackcloth
  preserved_meaning: The proclamation commands that humans and domestic animals alike be covered with sackcloth.
  reasoning_layer_used: Lexical decisions for וְיִתְכַּסּוּ and שַׂקִּים
  rationale: “Must” makes the decree-like force clear while retaining the sackcloth image.
- pob_phrase: call out mightily to God
  simplified_phrase: call out earnestly to God
  preserved_meaning: They are to plead with God with urgency and intensity.
  reasoning_layer_used: Lexical decision for בְּחָזְקָה
  rationale: “Earnestly” expresses the intensity in familiar modern English.
- pob_phrase: the violence that is in their hands
  simplified_phrase: the violence they are committing
  preserved_meaning: Every man must abandon the violent acts the people are doing.
  reasoning_layer_used: Lexical rationale for אֲשֶׁר בְּכַפֵּיהֶם and doctrine realignment for כַפֵּיהֶם
  rationale: The direct wording explains the Hebrew hand idiom while preserving its collective plural sense.
