translation:
  language: en
  text: So Jonah got up and went to Nineveh, just as Yahweh had told him. Nineveh was an exceptionally great city before God.[a] It was a journey of three days.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be understood simply as “an exceedingly great city,” but it explicitly mentions God.
    reason: alternative_reading
  - marker: b
    text: This may mean the time needed to cross the city or to complete a visit through it.
    reason: lexical_alternative
