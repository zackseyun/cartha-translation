simplification_decisions:
- pob_phrase: Arise, go to Nineveh, the great city
  simplified_phrase: Rise and go to Nineveh, the great city
  preserved_meaning: The command remains urgent and solemn, and Nineveh remains the great city.
  reasoning_layer_used: Lexical decisions for קום, הלך, and העיר הגדולה
  rationale: “Rise and go” is clear modern English without weakening the command.
- pob_phrase: and proclaim to it the proclamation
  simplified_phrase: Proclaim to it the message
  preserved_meaning: Jonah must publicly announce the message to Nineveh without changing “to” into “against.”
  reasoning_layer_used: Lexical and theological decisions for קרא, הקריאה, and אליה
  rationale: “Message” avoids awkward repetition while “proclaim” keeps the public-announcement force.
- pob_phrase: that I speak to you
  simplified_phrase: I tell you
  preserved_meaning: God speaks the message Jonah must announce.
  reasoning_layer_used: Lexical decision for אנכי דבר אליך
  rationale: “I tell you” is natural English and preserves God’s act of speaking to Jonah.
translation_notes:
  risk_flags:
  - risk: Replacing “proclaim/proclamation” with “proclaim/message” reduces the Hebrew wordplay.
    mitigation: The verb “proclaim” retains the formal and public force of Jonah’s commission.
  - risk: Readers may import the wording “against it” from Jonah 1:2.
    mitigation: The main text and note preserve this verse’s distinct wording, “to it.”
