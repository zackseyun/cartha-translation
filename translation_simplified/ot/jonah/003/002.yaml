translation:
  language: en
  text: Rise and go to Nineveh, the great city. Proclaim to it[a] the message I tell you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jonah 1:2 says “cry out against it,” but the Hebrew here says “proclaim to it.”
