translation:
  language: en
  text: When God saw what they had done—how they had turned away from their evil way—he relented.[a] He did not bring on them the disaster[b] he had said he would bring.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “changed his mind”; the Hebrew describes God responding to Nineveh’s repentance without implying that God had done wrong.
    reason: lexical_alternative
  - marker: b
    text: The same Hebrew word describes their moral “evil” and the “disaster” God had threatened as judgment.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: saw their deeds, that they had turned
  simplified_phrase: saw what they had done—how they had turned away
  preserved_meaning: Their changed conduct showed that they had abandoned evil.
  reasoning_layer_used: Lexical decisions for מַעֲשֵׂיהֶם and כִּי שָׁבוּ
  rationale: The rewrite makes the relationship between their actions and their turning clear in natural English.
- pob_phrase: concerning the disaster that he had spoken to bring on them
  simplified_phrase: the disaster he had said he would bring
  preserved_meaning: God withheld the judgment he had announced against Nineveh.
  reasoning_layer_used: Lexical decisions for עַל הָרָעָה and אֲשֶׁר דִּבֶּר לַעֲשׂוֹת לָהֶם
  rationale: The simpler wording removes an awkward clause while retaining the announced disaster.
- pob_phrase: God relented ... and he did not do it
  simplified_phrase: he relented. He did not bring on them the disaster
  preserved_meaning: God truly refrained from carrying out the announced judgment.
  reasoning_layer_used: Theological decision on anthropopathic language
  rationale: Two sentences clarify the outcome without explaining away the tension in “relented.”
translation_notes:
  risk_flags:
  - risk: Modern readers may take “relented” to mean that God admitted an error.
    mitigation: Footnote a preserves the real change in action while excluding moral fault in God.
  - risk: Using different English words may hide that one Hebrew word underlies both “evil” and “disaster.”
    mitigation: Footnote b documents the shared word and its two contextual senses.
