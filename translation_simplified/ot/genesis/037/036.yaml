translation:
  language: en
  text: Meanwhile, the Midianites[a] took Joseph to Egypt, where they sold him to Potiphar. He was one of Pharaoh’s officers[b] and captain of the royal guard.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebrew: “Medanites”; “Midianites” fits the surrounding account and ancient versions.'
    reason: alternative_reading
  - marker: b
