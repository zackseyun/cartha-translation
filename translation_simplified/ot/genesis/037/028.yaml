translation:
  language: en
  text: Then some Midianite traders passed by. They pulled Joseph up and lifted him out of the pit. They sold him to the Ishmaelites for twenty pieces of silver.[a] Then they brought Joseph to Egypt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “twenty silver” without naming the unit.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew leaves some uncertainty about which group performed each action.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Midianite men, traders
  simplified_phrase: some Midianite traders
  preserved_meaning: The people passing by were male traders from Midian.
  reasoning_layer_used: Lexical decisions for אֲנָשִׁים מִדְיָנִים and סֹחֲרִים
  rationale: Combining the nouns removes an awkward apposition without changing the group identified.
- pob_phrase: they pulled Joseph up and lifted him out of the pit, and sold Joseph
  simplified_phrase: They pulled Joseph up and lifted him out of the pit. They sold him
  preserved_meaning: The two upward-motion verbs remain distinct before the sale.
  reasoning_layer_used: Lexical decisions and applied revisions for וַיִּמְשְׁכוּ and וַיַּעֲלוּ
  rationale: Short sentences clarify the sequence while retaining both physical actions.
- pob_phrase: Then they brought Joseph to Egypt
  simplified_phrase: Then they brought Joseph to Egypt
  preserved_meaning: Joseph was transported to Egypt by the unresolved plural agents.
  reasoning_layer_used: Theological decision on subject ambiguity
  rationale: Keeping “they” avoids deciding whether the Midianites or Ishmaelites transported him.
translation_notes:
  risk_flags:
