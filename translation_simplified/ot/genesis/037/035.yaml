translation:
  language: en
  text: Then all his sons and daughters came to comfort him, but he refused their comfort. He said, “I will go down to my son in Sheol, mourning.”[a] So Jacob wept for his son.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “I will go down mourning to Sheol, to my son.” Sheol refers to the realm of the dead and can also be translated “the grave.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: rose up to comfort him
  simplified_phrase: came to comfort him
  preserved_meaning: His sons and daughters took action to console him in his grief.
  reasoning_layer_used: The lexical rationale treats “rose up” as a common narrative verb without special emphasis on standing.
  rationale: “Came to comfort him” expresses the action naturally without making physical movement central.
- pob_phrase: he refused to be comforted
  simplified_phrase: he refused their comfort
  preserved_meaning: Jacob actively resisted the consolation his family offered.
  reasoning_layer_used: The lexical decision identifies active refusal in a bereavement setting.
  rationale: This wording clearly connects his refusal with his family’s attempt to comfort him.
- pob_phrase: So his father wept for him
  simplified_phrase: So Jacob wept for his son
  preserved_meaning: Joseph’s father wept for Joseph.
  reasoning_layer_used: The source clause and narrative context identify both pronoun referents.
  rationale: Naming Jacob and his relationship to Joseph removes pronoun confusion.
interpretive_expansions:
- pob_phrase: I will go down to Sheol to my son, mourning
  rendering: I will go down to my son in Sheol, mourning
  claim: Jacob expects to descend to the realm of the dead where he believes his son is, and he will go as a mourner.
  evidence:
  - The immediate context presents Jacob as grieving for his presumed-dead son.
  - The POB rationale says Jacob speaks of descending to where his son is presumed to be.
  - The POB theological decision describes Sheol as the realm of the dead.
  confidence: high
  alternatives_preserved:
  - I will go down mourning to Sheol, to my son.
  - the grave
translation_notes:
  risk_flags:
  - risk: Linking “my son” directly with “in Sheol” makes the phrase relationship more explicit than the Hebrew word order does.
    mitigation: The footnote preserves the alternate arrangement documented by POB.
  - risk: Modern readers may equate Sheol with a later, more developed doctrine of the afterlife.
    mitigation: The footnote defines it only as the realm of the dead and retains the POB term.
