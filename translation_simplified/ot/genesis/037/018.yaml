translation:
  language: en
  text: They saw him while he was still far away. Before he reached them, they plotted together to kill him.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: They saw him from a distance
  simplified_phrase: They saw him while he was still far away
  preserved_meaning: They noticed him before he was close to them.
  reasoning_layer_used: The lexical decision for מֵרָחֹק preserves the spatial sense of being far off.
  rationale: The new wording connects the distance naturally with the timing of what followed.
- pob_phrase: before he came near to them
  simplified_phrase: Before he reached them
  preserved_meaning: Their action took place before Joseph came close to the group.
  reasoning_layer_used: The lexical decision for יִקְרַב אֲלֵיהֶם allows the natural equivalent “approached them.”
  rationale: “Reached them” is smoother common English in this sequence.
- pob_phrase: they conspired against him to kill him
  simplified_phrase: they plotted together to kill him
  preserved_meaning: They jointly formed a hostile plan whose purpose was Joseph’s death.
  reasoning_layer_used: The lexical rationale for וַיִּתְנַכְּלוּ identifies coordinated malicious planning, and לַהֲמִיתוֹ states its purpose.
  rationale: “Plotted together” makes the coordinated scheme immediately clear without weakening its murderous intent.
translation_notes:
  risk_flags:
  - risk: “Reached them” may sound slightly less spatially precise than “came near to them.”
    mitigation: The first sentence establishes the distance, so the movement toward the group remains clear.
