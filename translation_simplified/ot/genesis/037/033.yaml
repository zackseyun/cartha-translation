translation:
  language: en
  text: He recognized the robe and said, “This robe is my son’s! A wild animal has devoured him. Yosef[a] has surely been torn to pieces.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yosef is the Hebrew name traditionally written as “Joseph” in English.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: He recognized it
  simplified_phrase: He recognized the robe
  preserved_meaning: Jacob identified the garment shown to him.
  reasoning_layer_used: The lexical decision says the suffix refers to the tunic.
  rationale: Naming the garment makes the reference immediately clear.
- pob_phrase: It is my son’s tunic
  simplified_phrase: This robe is my son’s!
  preserved_meaning: Jacob concludes that the garment belongs to his son.
  reasoning_layer_used: The lexical record allows “robe” as a familiar equivalent for the garment.
  rationale: Repeating “robe” keeps Jacob’s statement complete and clear.
translation_notes:
  risk_flags:
  - risk: “Robe” is broader than the more source-specific “tunic.”
    mitigation: The lexical record permits “robe,” and it is clearer for common readers.
  - risk: “Wild animal” does not separately express the Hebrew adjective for harmfulness.
    mitigation: The latest adjudicated POB revision deliberately chose this natural wording to avoid overtranslation.
