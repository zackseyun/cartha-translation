- pob_phrase: and let not our hand be upon him
  simplified_phrase: Let us not lay a hand on him
  preserved_meaning: They would refrain from directly attacking Joseph, while the hand image remains.
  reasoning_layer_used: POB lexical decision for וְיָדֵנוּ אַל תְּהִי בוֹ
  rationale: The familiar English idiom makes the intended violence clear without losing the source image.
- pob_phrase: for he is our brother, our own flesh
  simplified_phrase: because he is our brother, our own flesh
  preserved_meaning: Joseph is their brother and blood relative.
  reasoning_layer_used: POB lexical decisions for כִּי, אָחִינוּ, and בְשָׂרֵנוּ
  rationale: “Because” states the reason plainly while “our own flesh” preserves the concrete kinship image.
- pob_phrase: And his brothers listened
  simplified_phrase: His brothers listened to him
  preserved_meaning: The brothers heard and heeded Judah’s proposal without forcing the sense to full agreement.
  reasoning_layer_used: POB lexical decision for וַיִּשְׁמְעוּ אֶחָיו
  rationale: Adding “to him” gives natural English while the footnote preserves the contextual alternatives.
