translation:
  language: en
  text: This is the family history of Jacob:[a] Joseph was seventeen years old and worked as a shepherd alongside his brothers, caring for the flock. He was a young man with the sons of Bilhah and Zilpah, two of his father’s wives. Joseph brought their father a bad report about them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “These are the generations of Jacob,” a Hebrew heading that introduces the family history that follows.
    reason: lexical_alternative
