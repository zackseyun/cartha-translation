  text: Reuben said to them, “Do not shed blood. Throw him into this pit[a] in the wilderness, but do not lay a hand on him.” He said this so that he could rescue Joseph from their hands and bring him back to his father.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word may also mean “cistern,” a pit used to store water.
    reason: lexical_alternative
