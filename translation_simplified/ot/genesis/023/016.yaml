translation:
  language: en
  text: 'Abraham listened to Ephron. Then, in the hearing of the descendants of Heth,[a] Abraham weighed out for him the amount Ephron had stated: 400 shekels of silver,[b] accepted in trade.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, the Hittites; literally, “the sons of Heth.”
    reason: lexical_alternative
  - marker: b
    text: A shekel was an ancient unit of weight. The final phrase may also mean “silver weighed according to the merchants’ standard.”
    reason: cultural_note
simplification_decisions:
- pob_phrase: the silver that he had spoken
  simplified_phrase: the amount Ephron had stated
  preserved_meaning: Ephron had publicly specified the amount of silver Abraham paid.
  reasoning_layer_used: lexical decision and transaction context
  rationale: This expresses the commercial sense in natural English without changing the amount.
- pob_phrase: the sons of Heth
  simplified_phrase: the descendants of Heth
  preserved_meaning: The phrase identifies the people descended from Heth.
  reasoning_layer_used: lexical decision and footnote
  rationale: “Descendants” makes the genealogical expression clear while the footnote retains the literal form.
- pob_phrase: current with the merchant
  simplified_phrase: accepted in trade
  preserved_meaning: The silver was recognized as valid for commercial exchange.
  reasoning_layer_used: lexical rationale and alternative renderings
  rationale: This clarifies the trade idiom without choosing between acceptability and standard weight.
interpretive_expansions:
