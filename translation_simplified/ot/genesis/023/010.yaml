translation:
  language: en
  text: Ephron was sitting among the people of Heth.[a] Ephron the Hittite answered Abraham where the people of Heth and everyone who came to his city’s gate[b] could hear him. He said,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “sons of Heth,” another name for the Hittites.
    reason: lexical_alternative
  - marker: b
    text: The city gate was a public place where legal and business matters were settled before witnesses.
    reason: cultural_note
simplification_decisions:
- pob_phrase: the sons of Heth
  simplified_phrase: the people of Heth
  preserved_meaning: Ephron was among the clan descended from Heth, also known as the Hittites.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: “People of Heth” makes the group relationship clear while the note preserves the literal Hebrew expression.
- pob_phrase: in the hearing of the sons of Heth, before all who entered the gate of his city
  simplified_phrase: where the people of Heth and everyone who came to his city’s gate could hear him
  preserved_meaning: Ephron spoke publicly before the assembled people and other witnesses at the city gate.
  reasoning_layer_used: POB lexical rationale for בְּאָזְנֵי and לְכֹל בָּאֵי שַׁעַר עִירוֹ
  rationale: The recast sentence expresses the Hebrew hearing idiom in ordinary English without losing the public setting.
- pob_phrase: saying
  simplified_phrase: He said,
  preserved_meaning: The verse introduces Ephron’s direct speech in the next verse.
  reasoning_layer_used: POB lexical decision for לֵאמֹר
  rationale: A separate short clause gives modern readers a natural lead-in to the quotation.
translation_notes:
  risk_flags:
  - risk: “People of Heth” is less literal than the POB’s “sons of Heth.”
    mitigation: Footnote [a] preserves the literal wording and identifies the group as the Hittites.
  - risk: Modern readers may picture the gate only as an entrance.
    mitigation: Footnote [b] explains its role as a public legal and commercial setting.
