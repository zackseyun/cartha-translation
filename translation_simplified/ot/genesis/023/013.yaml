translation:
  language: en
  text: He spoke to Ephron in front of the local community. He said, “Please listen to me. I am giving you the silver for the field.[a] Take it from me so that I can bury my deceased family member there.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated, “I have given” or “I will give”; here it expresses a formal offer.
    reason: alternative_reading
