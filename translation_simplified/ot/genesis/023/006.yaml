translation:
  language: en
  text: Listen to us, my lord. You are a prince of God among us.[a] Bury your dead in one of our finest tombs. None of us will refuse you his tomb for burying your dead.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “a mighty prince among us.” The Hebrew expression “prince of God” may describe someone exceptionally great.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Hear us, my lord
  simplified_phrase: Listen to us, my lord
  preserved_meaning: The speakers respectfully ask Abraham to hear their response.
  reasoning_layer_used: POB lexical decision for שְׁמָעֵנוּ and אֲדֹנִי
  rationale: “Listen” is more natural in a direct modern appeal while “my lord” keeps the social deference.
- pob_phrase: in the choicest of our tombs
  simplified_phrase: in one of our finest tombs
  preserved_meaning: Abraham may use a burial place of the best quality they possess.
  reasoning_layer_used: POB lexical decision for בְּמִבְחַר קְבָרֵינוּ
  rationale: “Finest” and “one of” make the courteous burial offer immediately clear.
- pob_phrase: will withhold his tomb from you, from burying your dead
  simplified_phrase: will refuse you his tomb for burying your dead
  preserved_meaning: No member of the community will deny Abraham a tomb needed for the burial.
  reasoning_layer_used: POB lexical decisions for לֹא יִכְלֶה מִמְּךָ and מִקְּבֹר מֵתֶךָ
  rationale: The recast removes the awkward repeated construction while preserving refusal and burial purpose.
