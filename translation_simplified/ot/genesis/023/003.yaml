translation:
  language: en
  text: Then Abraham got up from beside his dead wife and said to the sons of Heth,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, the Hittites; Hebrew “the sons of Heth.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: rose from before his dead wife
  simplified_phrase: got up from beside his dead wife
  preserved_meaning: Abraham stood and moved away from the immediate presence of Sarah’s body.
  reasoning_layer_used: Lexical decisions for וַיָּקָם and מֵעַל פְּנֵי, with the revision identifying the deceased as his wife.
  rationale: The simpler wording naturally describes Abraham rising from beside the body.
- pob_phrase: spoke to the sons of Heth, saying
  simplified_phrase: said to the sons of Heth
  preserved_meaning: Abraham addressed this people, and his words follow in the next verse.
  reasoning_layer_used: Lexical decisions for וַיְדַבֵּר and לֵאמֹר.
  rationale: English “said to” avoids the formal and repetitive phrase “spoke … saying.”
- pob_phrase: the sons of Heth
  simplified_phrase: the sons of Heth
  preserved_meaning: The source-language family name remains in the text while the conventional identification is supplied in a note.
  reasoning_layer_used: Lexical decision for בְּנֵי חֵת and the POB footnote.
  rationale: Retaining the name respects the POB choice without leaving readers to guess who the group is.
translation_notes:
  risk_flags:
  - risk: “From beside” is less literal than POB’s “from before.”
    mitigation: It is a listed lexical alternative and preserves the contextual image of leaving the body’s immediate presence.
