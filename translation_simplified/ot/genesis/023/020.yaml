simplification_decisions:
- pob_phrase: the field and the cave that was in it were deeded to Abraham
  simplified_phrase: The field and the cave in it became Abraham’s property
  preserved_meaning: The field and cave legally passed into Abraham’s ownership.
  reasoning_layer_used: POB lexical decisions for וַיָּקָם and לְאַבְרָהָם in the legal-purchase context
  rationale: The property-centered wording states the legal result clearly without assigning agency beyond the source.
- pob_phrase: as a burial property
  simplified_phrase: property for burial
  preserved_meaning: Abraham owned the land for use as a burial place.
  reasoning_layer_used: POB lexical decision for לַאֲחֻזַּת קָבֶר
  rationale: This keeps both the ownership and burial purpose in common English.
- pob_phrase: from the sons of Heth
  simplified_phrase: acquired from the sons of Heth[a]
  preserved_meaning: The sons of Heth remain the stated transactional source without being made the explicit sellers.
  reasoning_layer_used: POB lexical decisions for מֵאֵת and בְּנֵי חֵת, informed by the immediate narrative
  rationale: The footnote supplies the familiar name while the main text preserves the source-based designation.
translation_notes:
  risk_flags:
