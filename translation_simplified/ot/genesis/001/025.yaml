  text: God made the wild animals of the earth, each according to its kind. He also made the livestock, each according to its kind, and every small creature that moves along the ground, each according to its kind.[a] God saw that it was good.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “kind” means a category of creature, not necessarily a species in modern scientific classification.
    reason: cultural_note
