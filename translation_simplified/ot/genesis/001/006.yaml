translation:
  language: en
  text: Then God said, "Let there be a space[a] in the middle of the waters, to separate water from water.[b]"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'expanse,' 'firmament,' or 'dome.' The Hebrew word refers to something spread out.
    reason: simplification_note
  - marker: b
    text: Literally, 'separating between waters and waters,' distinguishing the waters below from the waters above.
