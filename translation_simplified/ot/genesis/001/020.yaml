simplification_decisions:
- pob_phrase: Let the waters swarm with swarms of living creatures
  simplified_phrase: Let the waters swarm with living creatures
  preserved_meaning: The waters teem with abundant, moving life.
  reasoning_layer_used: Lexical decisions for יִשְׁרְצוּ and שֶׁרֶץ
  rationale: Removing the repeated noun makes the line natural while “swarm” preserves the active image.
- pob_phrase: and let birds fly
  simplified_phrase: Let birds fly
  preserved_meaning: God commands flying creatures to fly above the earth.
  reasoning_layer_used: Lexical decisions for וְעוֹף and יְעוֹפֵף
  rationale: A new sentence makes the second command easier to follow.
- pob_phrase: across the face of the expanse of the heavens
  simplified_phrase: across the expanse of the heavens
  preserved_meaning: The birds fly across the broad heavenly space.
  reasoning_layer_used: Lexical and theological decisions for עַל פְּנֵי and רְקִיעַ
  rationale: The shorter phrase is natural English and retains the important image of the expanse.
