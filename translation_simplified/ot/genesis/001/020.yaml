translation:
  language: en
  text: Then God said, “Let the waters swarm with living creatures[a], and let birds fly above the earth, across the expanse of the sky[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression emphasizes abundant life, literally “swarm with swarms of living creatures.”
    reason: simplification_note
  - marker: b
    text: Or “expanse of the heavens.” The Hebrew word for “expanse” (raqia) refers to the vast canopy or vault of the sky.
    reason: simplification_note
