translation:
  language: en
  text: 'And God said[a], “Let the earth bring forth every kind of living creature: livestock, crawling creatures, and wild animals, each according to its kind.” And it was so.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “living beings”; literally “a living soul” (Hebrew *nephesh*).
    reason: simplification_note
simplification_decisions:
- simplified_phrase: every kind of living creature ... each according to its kind
  preserved_meaning: The Hebrew repeats the distributive formula. Consolidating this into a framing structure ('every kind... each according to its kind') avoids redundant clunkiness in modern English while fully preserving the theological emphasis on distinct created categories.
  reasoning_layer_used: POB audit trail
  rationale: The Hebrew repeats the distributive formula. Consolidating this into a framing structure ('every kind... each according to its kind') avoids redundant clunkiness in modern English while fully preserving the theological emphasis on distinct created categories.
- simplified_phrase: crawling creatures
  preserved_meaning: In modern English, 'creeping' has acquired negative psychological connotations (e.g., 'creepy'). 'Crawling creatures' more accurately and neutrally conveys the Hebrew 'remes' (small animals moving close to the ground) to a contemporary reader.
  reasoning_layer_used: POB audit trail
  rationale: In modern English, 'creeping' has acquired negative psychological connotations (e.g., 'creepy'). 'Crawling creatures' more accurately and neutrally conveys the Hebrew 'remes' (small animals moving close to the ground) to a contemporary reader.
- simplified_phrase: wild animals
  preserved_meaning: The phrase 'of the earth' was streamlined since the passage already establishes that the earth is bringing them forth. This keeps the list of animal categories ('livestock, crawling creatures, and wild animals') balanced and punchy.
  reasoning_layer_used: POB audit trail
  rationale: The phrase 'of the earth' was streamlined since the passage already establishes that the earth is bringing them forth. This keeps the list of animal categories ('livestock, crawling creatures, and wild animals') balanced and punchy.
