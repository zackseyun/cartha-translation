translation:
  language: en
  text: Every green plant is food for every land animal, every bird in the sky, and every living creature that moves along the ground. And it was so.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: to every beast of the earth
  simplified_phrase: for every land animal
  preserved_meaning: This still refers broadly to animals that live on land without limiting them to wild animals.
  reasoning_layer_used: POB lexical decision for חַיַּת הָאָרֶץ
  rationale: “Land animal” is clearer modern English than “beast of the earth.”
- pob_phrase: every bird of the heavens
  simplified_phrase: every bird in the sky
  preserved_meaning: This keeps the category of birds associated with the realm above the earth.
  reasoning_layer_used: POB lexical decision for עוֹף הַשָּׁמַיִם
  rationale: “In the sky” expresses the Hebrew image naturally for common readers.
- pob_phrase: everything that creeps on the earth in which there is a living creature
  simplified_phrase: every living creature that moves along the ground
  preserved_meaning: This retains both animate life and the broad image of creatures moving along the earth.
  reasoning_layer_used: Applied revision and POB lexical decisions for רוֹמֵשׂ and נֶפֶשׁ חַיָּה
  rationale: “Moves along the ground” avoids making crawling the category’s defining posture.
translation_notes:
  risk_flags:
  - risk: “Living creature” may appear to modify only the ground-moving category.
    mitigation: That scope follows the POB clause structure and does not broaden the Hebrew grammar.
  - risk: “Moves along the ground” is less concrete than POB’s “creeps.”
    mitigation: It preserves the broader movement category without the narrower modern sense of crawling.
