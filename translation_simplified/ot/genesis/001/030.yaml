translation:
  language: en
  text: And to every land animal, every bird of the sky, and every creature that crawls on the earth—everything that has life[a] in it—every green plant is for food. And it was so.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew phrase is literally 'a living soul,' highlighting that animals possess animate life, though often translated as 'living creature.'
    reason: simplification_note
