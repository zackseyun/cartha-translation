translation:
  language: en
  text: So God created the great sea creatures.[a] He also created all the living creatures that move and fill the waters, each according to its kind. He created every winged bird, each according to its kind. God saw that it was good.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be translated “the great sea monsters” or “the great dragons.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and every living creature that moves, with which the waters swarmed
  simplified_phrase: He also created all the living creatures that move and fill the waters
  preserved_meaning: God created the abundant moving life in the waters.
  reasoning_layer_used: lexical decisions for רמש and שרץ
  rationale: The active wording makes the abundance easier to picture without narrowing the creatures involved.
- pob_phrase: according to their kinds
  simplified_phrase: each according to its kind
  preserved_meaning: Aquatic creatures were created in their distinct categories.
  reasoning_layer_used: lexical decision for מין
  rationale: The singular phrasing is more natural after “all the living creatures.”
- pob_phrase: and every winged bird according to its kind
  simplified_phrase: He created every winged bird, each according to its kind
  preserved_meaning: God created all winged birds in their distinct categories.
  reasoning_layer_used: lexical decisions for עוף כנף and מין
  rationale: A separate sentence reduces the long list while keeping birds as a distinct creation category.
