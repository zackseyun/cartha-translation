retained_terms:
- term: created
  reason: Maintains the distinct elevated creation verb (bara) used throughout Genesis 1.
- term: great sea creatures
  reason: Maintains the physical reality of the aquatic creation, with the footnote preserving the possible mythological/monstrous overtones of the Hebrew 'tanninim'.
- term: according to their/its kind
  reason: Retains the vital biblical concept of divine order and categorization within creation.
translation_notes:
  source_alignment_notes: The translation remains completely faithful to the Hebrew source content. The noun phrases 'nephesh chayyah' and 'remes' are represented by 'living, moving creature', and the verb 'sharats' is preserved in 'swarms'.
  readability_notes:
  - By transforming the passive-feeling 'with which the waters swarmed' into the active 'that swarms in the waters', the verse reads much more naturally to a modern English speaker without sacrificing the original meaning.
  compression_notes:
  - No source details or lexical components were omitted. Grammatical structures were reorganized purely to facilitate easier reading.
  risk_flags:
