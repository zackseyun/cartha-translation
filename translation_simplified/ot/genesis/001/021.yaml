translation:
  language: en
  text: So God created the great sea creatures[a] and every living, moving creature that swarms in the waters, according to their kinds. He also created every winged bird according to its kind. And God saw that it was good.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'the great sea monsters' or 'the great dragons.' The Hebrew word refers to giant or powerful serpentine creatures of the deep.
    reason: simplification_note
