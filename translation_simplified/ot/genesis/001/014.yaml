translation:
  language: en
  text: God said, “Let there be lights in the expanse of the heavens to separate the day from the night. Let them be signs, and let them mark appointed times[a], days, and years.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “seasons.” The Hebrew word refers to appointed times, which in other biblical contexts can also include sacred festival times.
    reason: simplification_note
