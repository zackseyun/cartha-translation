  rationale: This uses common wording while retaining the stative sense and both parts of the Hebrew pair.
- pob_phrase: darkness was over the surface of the deep
  simplified_phrase: Darkness lay over the surface of the watery deep
  preserved_meaning: Darkness extended above the deep waters.
  reasoning_layer_used: Lexical decisions on עַל־פְּנֵי and תְהוֹם
  rationale: “Lay over” states the relation naturally, while “surface” preserves the spatial image.
- pob_phrase: was hovering over the surface of the waters
  simplified_phrase: was hovering over the waters
  preserved_meaning: God’s Spirit was in sustained movement above the waters.
  reasoning_layer_used: Lexical decisions on מְרַחֶפֶת and הַמָּיִם
  rationale: “Was hovering” preserves the ongoing action while avoiding a repeated use of “surface.”
