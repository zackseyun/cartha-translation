translation:
  language: en
  text: Then God said, “Let us make man[a] in our image, like us.[b] Let them rule over the fish in the sea, the birds in the heavens, the livestock, the whole earth, and every small creature that crawls on the ground.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “man” means humanity as a whole, which is why the verse later says “them.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew uses plural words here. This may express divine deliberation, an address to the heavenly court, or, in Christian reading, a hint consistent with the Trinity.
    reason: alternative_reading
