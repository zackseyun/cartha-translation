simplification_decisions:
- pob_phrase: Happy am I!
  simplified_phrase: I am happy!
  preserved_meaning: Leah exclaims that she is happy while retaining the naming wordplay.
  reasoning_layer_used: Lexical decision for בְּאָשְׁרִי
  rationale: Ordinary English word order makes Leah’s exclamation immediately clear without adding intensity.
- pob_phrase: For women will call me happy.
  simplified_phrase: For women will call me happy.
  preserved_meaning: Leah gives the expectation that other women will declare her happy as the reason for her exclamation.
  reasoning_layer_used: POB text and lexical decisions for אִשְּׁרוּנִי and בָּנוֹת
  rationale: Keeping “For” preserves the explicit causal link, while “women” conveys the documented idiomatic sense of “daughters.”
- pob_phrase: So she called his name Asher.
  simplified_phrase: So she named him Asher.
  preserved_meaning: Leah gives the child the personal name Asher.
  reasoning_layer_used: Lexical decision for וַתִּקְרָא אֶת־שְׁמוֹ אָשֵׁר
  rationale: “Named him” expresses the Hebrew naming formula in ordinary modern English.
