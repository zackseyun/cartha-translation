translation:
  language: en
  text: The flock mated in front of the rods. It gave birth to young that were striped[a], speckled, and spotted.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “banded”; older translations often say “ring-streaked.”
    reason: lexical_alternative
  - marker: b
    text: The exact difference between “speckled” and “spotted” is uncertain; “spotted” may also mean “patchy,” “blotched,” or “mottled.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: So the flock mated by the rods
  simplified_phrase: The flock mated in front of the rods.
  preserved_meaning: The animals mated while positioned before the rods.
  reasoning_layer_used: lexical decision for אֶל הַמַּקְלוֹת and latest adjudication
  rationale: “In front of” makes the spatial setting clearer without implying that the rods caused the mating.
- pob_phrase: and the flock bore ... young
  simplified_phrase: It gave birth to young
  preserved_meaning: The flock produced offspring through birth.
  reasoning_layer_used: lexical decision for וַתֵּלַדְןָ
  rationale: “Gave birth to” is more familiar than “bore” and keeps the reproductive meaning.
- pob_phrase: striped, speckled, and spotted young
  simplified_phrase: young that were striped, speckled, and spotted
  preserved_meaning: The offspring had three kinds of visible markings.
  reasoning_layer_used: lexical decisions for עֲקֻדִּים, נְקֻדִּים, and וּטְלֻאִים
  rationale: The relative clause is easier to process while preserving all three distinct descriptions.
