translation:
  language: en
  text: That day he removed all the male goats that were streaked and spotted, and all the female goats that were speckled and spotted—every goat that had any white on it. He also removed every dark-colored lamb. He placed these animals in the care of his sons.
  philosophy: optimal-equivalence
