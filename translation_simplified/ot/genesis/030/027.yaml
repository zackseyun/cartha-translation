translation:
  language: en
  text: Then Laban said to him, “If you look on me with favor, please stay. I learned by reading omens[a] that Yahweh has blessed me because of you.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “I learned by experience,” but its stronger sense here is learning through divination or omen-reading.
    reason: lexical_alternative
