  text: But when the weaker animals were mating[a], Jacob did not set the rods in front of them. So the weaker animals belonged to Laban, while the stronger animals belonged to Jacob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may refer more specifically to animals that bred later or were considered inferior.
