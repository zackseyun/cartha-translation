translation:
  language: en
  text: Later,[a] when you inspect the animals I receive as pay, my honesty will speak for me. Any goat found with me that does not have speckles and spots, or any lamb that is not dark-colored,[b] will be considered stolen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may mean “tomorrow” or, more generally, a later time when Laban inspects the flock.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may refer more specifically to brown animals.
    reason: lexical_alternative
