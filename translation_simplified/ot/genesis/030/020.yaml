translation:
  language: en
  text: Leah said, “God has given me a good gift. This time my husband will honor me,[a] because I have given birth to six sons for him.” So she named him Zebulun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “will live with me.” The rare Hebrew verb may suggest both honoring Leah and remaining with her, and it sounds like the name Zebulun.
    reason: lexical_alternative
