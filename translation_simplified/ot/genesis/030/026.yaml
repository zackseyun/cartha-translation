translation:
  language: en
  text: Give me my wives and children, for whom I worked for you, so I can leave. You know the work I have done for you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may refer especially to the wives for whom Jacob worked, rather than to his whole family.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: for whom I have served you
  simplified_phrase: for whom I worked for you
  preserved_meaning: Jacob's labor for Laban was connected with receiving his family.
  reasoning_layer_used: Lexical decision for אֲשֶׁר עָבַדְתִּי אֹתְךָ בָהֵן and POB footnote a
  rationale: The relative clause keeps the family and labor connected while the footnote preserves the narrower reference to the wives.
- pob_phrase: so that I may go
  simplified_phrase: so I can leave
  preserved_meaning: Jacob asks to depart with his family.
  reasoning_layer_used: Lexical decision for וְאֵלֵכָה
  rationale: This wording expresses the desired departure in ordinary English.
- pob_phrase: the service with which I have served you
  simplified_phrase: the work I have done for you
  preserved_meaning: Laban knows the labor Jacob performed for him.
  reasoning_layer_used: Lexical decisions for עֲבֹדָתִי and אֲשֶׁר עֲבַדְתִּיךָ
  rationale: Natural English removes awkward repetition without losing the emphasis on Jacob's labor.
translation_notes:
  risk_flags:
  - risk: The relative clause may sound as though Jacob worked for both his wives and children alike.
    mitigation: The footnote preserves the Hebrew possibility that the clause refers especially to his wives.
