translation:
  language: en
  text: Whenever the stronger animals in the flock were breeding, Jacob would put the sticks in the watering troughs where the animals could see them, so that they might breed with the sticks in front of them.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the stronger of the flock
  simplified_phrase: the stronger animals in the flock
  preserved_meaning: Jacob selected the sturdier animals rather than the weaker ones.
  reasoning_layer_used: POB lexical decision for הַמְקֻשָּׁרוֹת and the contrast in the next verse
  rationale: Adding “animals” makes the phrase immediately clear without limiting the flock to sheep.
- pob_phrase: the rods
  simplified_phrase: the sticks
  preserved_meaning: Jacob used the peeled branches described earlier as breeding implements.
  reasoning_layer_used: POB lexical decision for הַמַּקְלוֹת and immediate context
  rationale: “Sticks” is more familiar modern English for these prepared branches.
- pob_phrase: before the eyes of the flock ... among the rods
  simplified_phrase: where the animals could see them ... with the sticks in front of them
  preserved_meaning: The sticks were visibly placed at the troughs during breeding.
  reasoning_layer_used: POB lexical decisions for לְעֵינֵי הַצֹּאן and בַּמַּקְלוֹת
  rationale: The recast wording preserves the visual setting while avoiding opaque literal idioms.
