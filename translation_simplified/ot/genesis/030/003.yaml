translation:
  language: en
  text: Then Rachel said, “Here is my female servant Bilhah. Sleep with her so that she may give birth on my knees.[a] In this way, I too may be built up through her by having children.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Give birth on my knees” likely describes a custom in which Rachel would symbolically receive Bilhah’s child as her own.
