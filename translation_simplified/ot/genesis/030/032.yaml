translation:
  language: en
  text: Let me go through all your sheep and goats today and separate out every speckled and spotted sheep, every dark-colored[a] sheep, and every speckled and spotted[b] goat. Those animals will be my wages.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “brown.” The Hebrew refers to a dark or brown color.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew terms translated “speckled” and “spotted” may overlap in meaning; “spotted” can also mean “patchy.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: pass through all your flock
  simplified_phrase: go through all your sheep and goats
  preserved_meaning: Jacob asks to go through Laban’s whole flock of small livestock.
  reasoning_layer_used: The lexical decision identifies “flock” as a collective for sheep and goats.
  rationale: Naming both kinds of animals makes the collective term immediately clear.
- pob_phrase: removing from there
  simplified_phrase: separate out
  preserved_meaning: Jacob proposes removing the designated animals as a distinct group.
  reasoning_layer_used: The lexical rationale describes the action as separating animals from the flock.
  rationale: “Separate out” expresses the concrete action in natural English.
- pob_phrase: and that will be my wages
  simplified_phrase: Those animals will be my wages
  preserved_meaning: The selected animals will constitute Jacob’s pay.
  reasoning_layer_used: The lexical decision defines the Hebrew term as wages or pay.
  rationale: The explicit subject makes clear what Jacob will receive.
translation_notes:
  risk_flags:
  - risk: The two patterned-color terms may overlap without being identical.
    mitigation: The main text keeps them coordinated with “and,” while footnote b notes the uncertainty.
  - risk: “Dark-colored” does not specify an exact shade.
    mitigation: Footnote a preserves “brown” as the main lexical alternative.
