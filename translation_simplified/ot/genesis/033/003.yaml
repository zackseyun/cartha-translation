translation:
  language: en
  text: Jacob himself went ahead of his household. As he approached his brother, he bowed to the ground seven times.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “prostrated himself”; the Hebrew verb may describe a full act of obeisance.
