simplification_decisions:
- pob_phrase: And he himself went on ahead of them
  simplified_phrase: Jacob himself went ahead of his household.
  preserved_meaning: Jacob personally took the lead before the whole group traveling behind him.
  reasoning_layer_used: Immediate context and the lexical decisions for וְהוּא and עָבַר לִפְנֵיהֶם.
  rationale: Naming Jacob and his household clarifies the pronouns without excluding anyone in the group.
- pob_phrase: and bowed down to the ground seven times, until he came near to his brother
  simplified_phrase: As he approached his brother, he bowed to the ground seven times.
  preserved_meaning: Jacob repeatedly bowed during his approach to his brother.
  reasoning_layer_used: The lexical decisions for וַיִּשְׁתַּחוּ, אַרְצָה, and עַד גִּשְׁתּוֹ עַד אָחִיו.
  rationale: A time clause expresses the same sequence in more natural English.
interpretive_expansions:
- pob_phrase: he ... them
  rendering: Jacob ... his household
  claim: The pronouns refer to Jacob and the entire dependent group behind him.
  evidence:
  - Genesis 33:1–2 identifies the group as the female servants, wives, and children arranged behind Jacob.
  confidence: high
translation_notes:
  risk_flags:
  - risk: “His household” makes the identity of “them” explicit.
    mitigation: The immediate context clearly identifies the full group traveling behind Jacob.
