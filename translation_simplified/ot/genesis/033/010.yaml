translation:
  language: en
  text: Jacob said, “No, please. If you look on me with favor, accept this gift from my hand. Seeing your face is like seeing the face of God,[a] and you have welcomed me with favor.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or possibly “the face of a god”; “God” best fits Jacob’s recent encounter at Peniel (Genesis 32:30).
    reason: alternative_reading
simplification_decisions:
- pob_phrase: If I have found favor in your eyes
  simplified_phrase: If you look on me with favor
  preserved_meaning: Jacob respectfully asks whether Esau views him with acceptance.
  reasoning_layer_used: Lexical decisions for חֵן and בְּעֵינֶיךָ
  rationale: This explains the idiom while preserving favor and the image of looking.
- pob_phrase: then take my gift from my hand
  simplified_phrase: accept this gift from my hand
  preserved_meaning: Jacob urges Esau to accept the conciliatory gift he personally presents.
  reasoning_layer_used: Lexical decisions for מִנְחָתִי and מִיָּדִי
  rationale: “Accept” clarifies the request while retaining the concrete hand image.
- pob_phrase: you have received me favorably
  simplified_phrase: you have welcomed me with favor
  preserved_meaning: Esau has received Jacob with favorable acceptance.
  reasoning_layer_used: Lexical decision for וַתִּרְצֵנִי and doctrine-realignment revision
  rationale: The wording is natural and keeps the deliberate echo of “favor.”
