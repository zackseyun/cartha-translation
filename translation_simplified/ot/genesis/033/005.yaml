translation:
  language: en
  text: Esau looked up and saw the women and children. He asked, “Who are these with you?” Jacob answered, “The children God has graciously given to your servant.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jacob calls himself “your servant” as a respectful way of speaking to Esau.
    reason: cultural_note
