  reasoning_layer_used: POB lexical decision for וַיִּשָּׂא אֶת עֵינָיו
  rationale: “Looked up” is the POB-approved natural equivalent of the Hebrew image.
- pob_phrase: and he said ... And he said
  simplified_phrase: He asked ... Jacob answered
