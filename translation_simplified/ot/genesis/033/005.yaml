  reasoning_layer_used: Immediate narrative context
  rationale: Naming the speakers prevents confusion when the verse is read by itself.
- pob_phrase: The children whom God has graciously given to your servant
  simplified_phrase: The children God has graciously given to your servant
  preserved_meaning: Jacob calls his children a gracious gift from God while speaking deferentially to Esau.
