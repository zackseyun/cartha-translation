translation:
  language: en
  text: “Please let my lord go on ahead of his servant. I will travel slowly, keeping pace with the livestock in front of me and with the children, until I come to my lord at Seir.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: pass on ahead of his servant
  simplified_phrase: go on ahead of his servant
  preserved_meaning: Jacob politely asks Esau to travel in front while retaining his deferential self-reference.
  reasoning_layer_used: lexical decisions for יַעֲבָר נָא and לִפְנֵי עַבְדּוֹ
  rationale: “Go on ahead” is clearer everyday English for the same direction and polite request.
- pob_phrase: I will proceed slowly
  simplified_phrase: I will travel slowly
  preserved_meaning: Jacob says that his group will move gradually and carefully.
  reasoning_layer_used: lexical decisions for אֶתְנָהֲלָה and לְאִטִּי
  rationale: “Travel slowly” makes the kind of movement explicit without adding a new claim.
- pob_phrase: at the pace of the livestock that is before me and at the pace of the children
  simplified_phrase: keeping pace with the livestock in front of me and with the children
  preserved_meaning: Jacob will regulate the journey by the speed of both the animals and the children.
  reasoning_layer_used: lexical decisions for לְרֶגֶל, הַמְּלָאכָה, and הַיְלָדִים
  rationale: The recast removes repetition while preserving both groups that determine the pace.
translation_notes:
  risk_flags:
  - risk: The third-person phrases “my lord” and “his servant” may sound formal to modern readers.
    mitigation: They are retained because they express Jacob’s deliberate deference to Esau.
