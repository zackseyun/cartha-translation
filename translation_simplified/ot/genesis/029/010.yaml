  text: When Jacob saw Rachel, the daughter of Laban, his mother’s brother, he also saw the flock that belonged to Laban, his mother’s brother. Jacob went over to the well, rolled the stone from its mouth, and watered the flock of Laban, his mother’s brother.[a]
