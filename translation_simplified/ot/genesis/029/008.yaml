translation:
  language: en
  text: They answered, “We cannot water the sheep[a] yet. We have to wait until all the flocks are gathered and the stone is rolled away from the mouth of the well. Then we water them.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can include both sheep and goats.
    reason: lexical_alternative
