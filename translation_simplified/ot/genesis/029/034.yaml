translation:
  language: en
  text: She became pregnant again and gave birth to a son. She said, “Now, this time, my husband will become attached to me, because I have given him three sons.” That is why he was named Levi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb translated “become attached” can also mean “be joined” and sounds like the name Levi.
    reason: lexical_alternative
