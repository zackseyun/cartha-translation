translation:
  language: en
  text: Abraham looked up and saw a ram behind him[a], caught by its horns in the tangled brush. He went over, took the ram, and sacrificed it as a burnt offering instead of his son.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “behind”; the Hebrew does not explicitly say “him.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: lifted up his eyes and looked, and behold
  simplified_phrase: looked up and saw
  preserved_meaning: Abraham raised his gaze and noticed the ram.
  reasoning_layer_used: POB lexical decisions for the Hebrew gaze idiom, וַיַּרְא, and וְהִנֵּה
  rationale: The natural English sequence preserves the sudden discovery without the archaic “behold.”
- pob_phrase: caught in the thicket by its horns
  simplified_phrase: caught by its horns in the tangled brush
  preserved_meaning: The ram was trapped by its horns in dense vegetation.
  reasoning_layer_used: POB lexical decisions for נֶאֱחַז, בַּסְּבַךְ, and בְּקַרְנָיו
  rationale: “Tangled brush” makes the trapping scene easier to picture while keeping the concrete image.
- pob_phrase: offered it up as a burnt offering instead of his son
  simplified_phrase: sacrificed it as a burnt offering instead of his son
  preserved_meaning: The ram became the whole burnt sacrifice in substitution for Isaac.
  reasoning_layer_used: POB lexical and theological decisions for וַיַּעֲלֵהוּ לְעֹלָה and תַּחַת בְּנוֹ
  rationale: “Sacrificed” states the ritual action plainly while preserving the substitutionary wording.
translation_notes:
