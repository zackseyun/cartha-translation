translation:
  language: en
  text: He said, “Please take Isaac—your son, your only one,[a] whom you love—and go to the land of Moriah. There, sacrifice him as a burnt offering on one of the mountains I will tell you.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “your only son.” The Hebrew emphasizes Isaac’s unique place here, though Abraham also had another son, Ishmael.
    reason: lexical_alternative
