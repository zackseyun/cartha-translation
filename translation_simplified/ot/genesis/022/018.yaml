simplification_decisions:
- pob_phrase: And in your offspring all the nations of the earth will be blessed
  simplified_phrase: all the nations on earth will be blessed in your offspring
  preserved_meaning: The worldwide promise of blessing remains connected to Abraham’s offspring without specifying precisely how.
  reasoning_layer_used: POB lexical and theological decisions on בְזַרְעֲךָ and the Abrahamic promise
  rationale: The reordered clause reads naturally while preserving “in” and the promise’s global scope.
- pob_phrase: because you have obeyed my voice
  simplified_phrase: Because you obeyed me
  preserved_meaning: Abraham responded to God’s command with obedience.
  reasoning_layer_used: POB lexical decision on שָׁמַעְתָּ בְּקֹלִי
  rationale: The ordinary English expression conveys the Hebrew idiom’s force without its unfamiliar wording.
