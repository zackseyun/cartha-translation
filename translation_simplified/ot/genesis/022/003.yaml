  preserved_meaning: Abraham rose early and acted promptly.
  reasoning_layer_used: POB lexical decisions for וַיַּשְׁכֵּם and בַּבֹּקֶר
  rationale: “Got up” is more common than “rose” while retaining the early action.
- pob_phrase: took two of his young men with him and Isaac his son
  simplified_phrase: He took Isaac his son and two of his young men with him
  preserved_meaning: Isaac and two young men accompanied Abraham.
  reasoning_layer_used: POB lexical decisions for שְׁנֵי נְעָרָיו and יִצְחָק בְּנוֹ
  rationale: Reordering the companions makes the sentence easier to follow without defining the young men as servants.
- pob_phrase: and arose and went to the place that God had told him
  simplified_phrase: Then he got up and went to the place God had told him
  preserved_meaning: Abraham performed both sequential actions and went to God’s designated place.
  reasoning_layer_used: POB lexical decisions for וַיָּקָם וַיֵּלֶךְ and אֲשֶׁר אָמַר לוֹ הָאֱלֹהִים
  rationale: A new sentence preserves both actions while keeping the destination clause direct.
