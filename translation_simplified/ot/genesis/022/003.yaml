translation:
  language: en
  text: Early in the morning, Abraham got up and saddled his donkey. He took Isaac his son and two of his young men[a] with him, and he split wood for a burnt offering. Then he got up and went to the place God had told him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “two of his servants” or “two of his attendants.”
    reason: lexical_alternative
