translation:
  language: en
  text: Abraham put the wood for the burnt offering on his son Isaac. He carried the fire and the knife, and the two of them continued walking together.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: So Abraham took the wood for the burnt offering and laid it on Isaac his son
  simplified_phrase: Abraham put the wood for the burnt offering on his son Isaac.
  preserved_meaning: Abraham placed the sacrificial wood on Isaac while retaining the physical burden image.
  reasoning_layer_used: POB lexical decisions for עֲצֵי הָעֹלָה, וַיָּשֶׂם עַל, and יִצְחָק בְּנוֹ
  rationale: The shorter clause and familiar name order make the action immediately clear.
- pob_phrase: he took in his hand the fire and the knife
  simplified_phrase: He carried the fire and the knife
  preserved_meaning: Abraham personally carried both the fire and the knife.
  reasoning_layer_used: POB lexical decisions for בְּיָדוֹ, הָאֵשׁ, and הַמַּאֲכֶלֶת
  rationale: “Carried” expresses the natural meaning without suggesting a fire container the Hebrew does not name.
- pob_phrase: the two of them walked on together
  simplified_phrase: the two of them continued walking together
  preserved_meaning: Abraham and Isaac kept moving forward as a pair.
  reasoning_layer_used: POB lexical decisions for שְׁנֵיהֶם יַחְדָּו and וַיֵּלְכוּ
  rationale: “Continued walking” states the narrative movement in common English while preserving the emphasis on togetherness.
translation_notes:
  risk_flags:
  - risk: Modern readers may imagine Abraham carrying an exposed flame.
    mitigation: The text retains “fire” because the Hebrew and POB do not specify a firepot or other container.
