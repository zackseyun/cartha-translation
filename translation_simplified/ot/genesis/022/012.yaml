translation:
  language: en
  text: He said, “Do not strike the boy or do anything else to him. Now I know that you fear God, because you did not hold back your son—your only son—from me.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “did not spare your son.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “your son, your only one”; that is, his one and only son in this covenant context.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Do not lay your hand on the boy, and do not do anything to him
  simplified_phrase: Do not strike the boy or do anything else to him
  preserved_meaning: God completely forbids Abraham from using force against the boy or harming him in any way.
  reasoning_layer_used: POB lexical decisions for תִּשְׁלַח יָדְךָ אֶל and תַּעַשׂ לוֹ מְאוּמָּה
  rationale: “Strike” makes the Hebrew force-bearing idiom immediately clear while the second clause keeps the total prohibition.
- pob_phrase: for now I know that you fear God
  simplified_phrase: Now I know that you fear God
  preserved_meaning: God directly declares that Abraham’s fear of him is now known.
  reasoning_layer_used: POB theological decision on anthropomorphic divine knowledge
  rationale: A new sentence improves readability without softening the text’s theological tension.
- pob_phrase: since you have not withheld your son, your only son, from me
  simplified_phrase: because you did not hold back your son—your only son—from me
  preserved_meaning: Abraham did not keep back from God the son uniquely central to the covenant.
  reasoning_layer_used: POB lexical decisions for חָשַׂכְתָּ, יְחִידְךָ, and מִמֶּנִּי
  rationale: “Hold back” is common English, while the repetition and “from me” preserve the Hebrew emphasis.
translation_notes:
  risk_flags:
  - risk: “Strike” is more explicit than the literal hand image.
    mitigation: The POB lexical rationale identifies applying force or striking as the idiom’s meaning.
  - risk: “Only son” could be misunderstood as denying Ishmael’s existence.
    mitigation: The footnote preserves the Hebrew wording and limits the claim to the covenant context.
