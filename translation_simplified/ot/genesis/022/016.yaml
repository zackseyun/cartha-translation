  preserved_meaning: Yahweh solemnly swears by his own person.
  reasoning_layer_used: Lexical decision for בִּי נִשְׁבַּעְתִּי
  rationale: Natural English word order keeps the oath’s completed action and solemn force.
- pob_phrase: you have done this thing
  simplified_phrase: you have done this
  preserved_meaning: Yahweh refers to Abraham’s obedient action.
  reasoning_layer_used: Lexical decision for עָשִׂיתָ אֶת־הַדָּבָר הַזֶּה
