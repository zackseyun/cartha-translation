translation:
  language: en
  text: Then they reached the place God had told Abraham about. There Abraham built the altar[a] and arranged the wood. He bound his son Isaac and placed him on the altar, on top of the wood.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “the altar”; it may also be translated “an altar.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: came to the place that God had told him
  simplified_phrase: reached the place God had told Abraham about
  preserved_meaning: Abraham and Isaac arrived at the place God had previously identified to Abraham.
  reasoning_layer_used: Lexical rationale and immediate narrative context
  rationale: “Reached” is natural for arriving, and naming Abraham removes an unclear pronoun.
- pob_phrase: Isaac his son
  simplified_phrase: his son Isaac
  preserved_meaning: The bound person was Abraham’s son Isaac.
  reasoning_layer_used: Lexical alternatives
  rationale: The common English word order reads more smoothly without changing the relationship.
- pob_phrase: placed him on the altar, on top of the wood
  simplified_phrase: placed him on the altar, on top of the wood
  preserved_meaning: Isaac was positioned upon the arranged wood on the altar.
  reasoning_layer_used: Lexical rationale and source spatial image
  rationale: The clear physical image is retained because it carries the full force of the Hebrew.
