  text: Abraham said, “My son, God will provide for himself the lamb for a burnt offering.”[a] Then the two of them continued walking together.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “God will see for himself the lamb for a burnt offering.” Here the Hebrew word for “see” can also mean “provide.”
