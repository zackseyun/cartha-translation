  preserved_meaning: God will personally see to the sacrificial lamb while Abraham addresses Isaac affectionately.
  reasoning_layer_used: POB lexical and theological decisions on יִרְאֶה לּוֹ, הַשֶּׂה, לְעֹלָה, and בְּנִי
  rationale: Moving “my son” to the front clarifies the address without resolving Abraham’s intent.
- pob_phrase: So the two of them went on together
