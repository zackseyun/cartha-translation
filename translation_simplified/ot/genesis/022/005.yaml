translation:
  language: en
  text: “Stay here with the donkey,” Abraham told his young men. “The boy and I will go over there. We will worship[a] and come back to you[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “bow down”; the Hebrew word can describe physically bowing low in worship.
    reason: lexical_alternative
  - marker: b
    text: Abraham says “we will come back.” The text does not explain whether he is hiding his intent, expecting both of them to return, or trusting that God will provide.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And Abraham said to his young men
  simplified_phrase: Abraham told his young men
  preserved_meaning: Abraham directly addresses the two young male companions.
  reasoning_layer_used: POB lexical decision for נְעָרָיו
  rationale: The natural speech tag keeps “young men” while removing the heavy opening conjunction.
- pob_phrase: I and the boy will go over there
  simplified_phrase: The boy and I will go over there
  preserved_meaning: Only Abraham and Isaac will continue to the other place.
  reasoning_layer_used: POB lexical decisions for וַאֲנִי וְהַנַּעַר and נֵלְכָה עַד כֹּה
  rationale: Modern English word order improves readability without changing who goes.
- pob_phrase: and we will worship and return to you
  simplified_phrase: We will worship and come back to you
  preserved_meaning: Abraham speaks in the plural about both worshiping and returning.
  reasoning_layer_used: POB lexical and theological decisions for וְנִשְׁתַּחֲוֶה and וְנָשׁוּבָה אֲלֵיכֶם
  rationale: A new sentence and “come back” make the statement clearer while preserving its unresolved plural claim.
translation_notes:
  risk_flags:
