translation:
  language: en
  text: I will certainly bless you, and I will make your offspring very numerous—like the stars in the sky and the sand on the seashore. Your offspring will take control of his enemies’ gate.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Your descendants will take control of their enemies’ gate.” Hebrew treats “offspring” as a singular collective and therefore says “his enemies.”
    reason: alternative_reading
  - marker: b
    text: An enemy’s gate represents control over the enemy’s city.
    reason: cultural_note
simplification_decisions:
- pob_phrase: I will surely bless you, and I will surely multiply your offspring
  simplified_phrase: I will certainly bless you, and I will make your offspring very numerous
  preserved_meaning: God emphatically promises both blessing and a vast increase in Abraham’s offspring.
  reasoning_layer_used: POB lexical decisions for both emphatic Hebrew verb forms
  rationale: Common wording preserves the force without the less familiar verb “multiply.”
- pob_phrase: like the stars of the heavens and like the sand that is on the seashore
  simplified_phrase: like the stars in the sky and the sand on the seashore
  preserved_meaning: Both visible images portray an immeasurably large number.
  reasoning_layer_used: POB lexical decisions and applied revision history
  rationale: Natural English removes the cumbersome relative clause while keeping both images.
- pob_phrase: will possess the gate of his enemies
  simplified_phrase: will take control of his enemies’ gate
  preserved_meaning: Abraham’s collective offspring will gain control over hostile cities.
  reasoning_layer_used: POB lexical decision for יָרַשׁ and theological decision on the collective singular
  rationale: “Take control” explains active possession while retaining the biblical gate image.
interpretive_expansions:
- pob_phrase: multiply your offspring like the stars ... and like the sand
  rendering: make your offspring very numerous—like the stars ... and the sand
  claim: The comparison concerns the immense number of Abraham’s offspring.
  evidence:
  - The multiplication verb directly establishes quantity.
  - Stars and sand are paired as images of vast number.
  confidence: high
- pob_phrase: possess the gate
  rendering: take control of ... gate
  claim: Possessing an enemy’s gate means gaining control over the enemy’s city.
  evidence:
  - The POB lexical rationale identifies active possession and control.
  - The gate functioned as the strategic entrance to a city.
  confidence: high
  alternatives_preserved:
  - will inherit the gate
translation_notes:
  risk_flags:
  - risk: The singular “his” may sound as though only one descendant is meant.
    mitigation: Footnote a preserves the collective-singular tension and gives the plural alternative.
  - risk: Modern readers may understand “gate” as only a physical object.
    mitigation: Footnote b explains the image of control while the main text retains it.
