translation:
  language: en
  text: That is why it was named Babel,[a] because there Yahweh confused the language of the whole earth. From there Yahweh scattered them across the whole earth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Babel sounds like the Hebrew verb for “confused” or “mixed” (balal), which explains the name here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Therefore its name was called Babel
  simplified_phrase: That is why it was named Babel
  preserved_meaning: The name Babel resulted from what happened there.
  reasoning_layer_used: Lexical decision for עַל כֵּן and the Hebrew naming formula
  rationale: The smoother wording keeps both the causal link and the act of naming.
- pob_phrase: and from there Yahweh scattered them
  simplified_phrase: From there Yahweh scattered them
  preserved_meaning: Yahweh caused the people to spread out from that location.
  reasoning_layer_used: Lexical decisions for וּמִשָּׁם and הֱפִיצָם
  rationale: A new sentence makes the second divine action easier to follow.
- pob_phrase: over the face of all the earth
  simplified_phrase: across the whole earth
  preserved_meaning: The people were scattered geographically throughout the earth.
  reasoning_layer_used: Lexical decision for עַל פְּנֵי כָּל הָאָרֶץ
  rationale: “Across” naturally conveys movement over the earth’s surface without the opaque idiom.
