simplification_decisions:
- pob_phrase: These are the generations of Terah
  simplified_phrase: This is the account of Terah’s family line
  preserved_meaning: The phrase still introduces the Genesis section about what proceeds from Terah and his family.
  reasoning_layer_used: POB lexical decision for תּוֹלְדֹת
  rationale: “Account of Terah’s family line” makes the broad genealogical formula understandable without narrowing it to descendants alone.
- pob_phrase: fathered
  simplified_phrase: was the father of
  preserved_meaning: Terah and Haran are identified as the fathers of the named sons.
  reasoning_layer_used: POB lexical decisions for הוֹלִיד
  rationale: The expanded wording is more immediately natural while preserving the genealogical relationship.
- pob_phrase: Terah fathered Abram, Nahor, and Haran; and Haran fathered Lot
  simplified_phrase: Terah was the father of Abram, Nahor, and Haran. Haran was the father of Lot.
  preserved_meaning: The two linked family relationships remain distinct and in the same order.
  reasoning_layer_used: POB syntax and coordination
  rationale: Two short sentences make the relationships easier to follow than the semicolon construction.
