translation:
  language: en
  text: 'Terah took members of his family with him: his son Abram; his grandson Lot, who was Haran’s son; and his daughter-in-law Sarai, Abram’s wife. Together they left Ur of the Chaldeans to go to the land of Canaan. But they traveled only as far as Haran and settled there.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Terah took Abram his son, Lot the son of Haran, his grandson, and Sarai his daughter-in-law, the wife of Abram his son
  simplified_phrase: 'Terah took members of his family with him: his son Abram; his grandson Lot, who was Haran’s son; and his daughter-in-law Sarai, Abram’s wife.'
  preserved_meaning: Terah brought Abram, Lot, and Sarai, with each family relationship clearly identified.
  reasoning_layer_used: POB lexical decisions on family relationships
  rationale: The long list is reorganized so readers can follow each relationship on the first read.
- pob_phrase: and they set out together from Ur of the Chaldeans to go to the land of Canaan
  simplified_phrase: Together they left Ur of the Chaldeans to go to the land of Canaan.
  preserved_meaning: The whole family group departed together with Canaan as their destination.
  reasoning_layer_used: latest revision and textual-crux adjudication
  rationale: A separate sentence avoids the Hebrew’s confusing overlap between “they” and “them.”
- pob_phrase: But when they came as far as Haran, they settled there.
  simplified_phrase: But they traveled only as far as Haran and settled there.
  preserved_meaning: They stopped short of Canaan and made their home in Haran.
  reasoning_layer_used: POB lexical decisions for עַד and ישב
  rationale: The wording clearly contrasts their intended destination with where they settled.
interpretive_expansions:
- pob_phrase: came as far as Haran
  rendering: traveled only as far as Haran
  claim: Haran was the stopping point rather than the stated destination of Canaan.
  evidence:
  - The group set out to go to Canaan.
  - The Hebrew עַד marks Haran as the limit reached.
  - The next clause says they settled there.
  confidence: high
  alternatives_preserved:
  - came as far as Haran
translation_notes:
  risk_flags:
  - risk: “Only as far as” makes the contrast with Canaan more explicit than the Hebrew adverb alone.
    mitigation: The stated destination, עַד, and settlement in Haran jointly support this bounded clarification.
  - risk: “Together” smooths an awkward Hebrew phrase that literally reads “they went out with them.”
    mitigation: The wording follows the controlling POB adjudication while retaining the plural traveling group.
