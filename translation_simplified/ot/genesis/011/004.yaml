translation:
  language: en
  text: They said, “Come, let us build a city and a tower for ourselves, with its top in the heavens.[a] Let us make a name for ourselves so that we will not be scattered across the whole earth.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “with its top reaching to the heavens.” The Hebrew literally says “with its top in the heavens.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: let us build for ourselves a city and a tower
  simplified_phrase: let us build a city and a tower for ourselves
  preserved_meaning: The people urge one another to construct both the city and tower for their own community.
  reasoning_layer_used: Lexical decision for נִבְנֶה לָּנוּ
  rationale: Moving “for ourselves” after both objects makes its scope immediately clear.
- pob_phrase: lest we be scattered
  simplified_phrase: so that we will not be scattered
  preserved_meaning: Their purpose is to prevent the feared result of being spread abroad.
  reasoning_layer_used: Lexical decision for פֶּן and נָפוּץ
  rationale: The negative purpose is expressed in common English without the literary word “lest.”
- pob_phrase: over the face of the whole earth
  simplified_phrase: across the whole earth
  preserved_meaning: They fear being spread throughout the inhabited world, not merely a local land.
  reasoning_layer_used: Lexical and theological decisions for עַל פְּנֵי כָל הָאָרֶץ
  rationale: “Across” replaces the opaque surface idiom while preserving the worldwide scope.
translation_notes:
  risk_flags:
  - risk: “In the heavens” may sound like a precise physical claim rather than the Hebrew’s vivid tower image.
    mitigation: The footnote preserves the clearer possible sense “reaching to the heavens” without removing the literal image.
