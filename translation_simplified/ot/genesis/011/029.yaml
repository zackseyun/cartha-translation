translation:
  language: en
  text: Abram and Nahor each married a wife. Abram’s wife was named Sarai. Nahor’s wife was named Milcah. She was the daughter of Haran, who was the father of both Milcah and Iscah.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Abram and Nahor took wives for themselves
  simplified_phrase: Abram and Nahor each married a wife
  preserved_meaning: Each man entered marriage with his own wife.
  reasoning_layer_used: POB lexical decisions for וַיִּקַּח, לָהֶם, and נָשִׁים
  rationale: “Married” gives the accepted idiomatic sense, while “each” preserves the reflexive force of “for themselves.”
- pob_phrase: The name of Abram’s wife was Sarai, and the name of Nahor’s wife was Milcah
  simplified_phrase: Abram’s wife was named Sarai. Nahor’s wife was named Milcah.
  preserved_meaning: The wives are identified by name without changing either relationship.
  reasoning_layer_used: POB lexical decision for שֵׁם and target readability rules
  rationale: Two direct sentences replace the repeated formal name construction.
- pob_phrase: the daughter of Haran, the father of Milcah and of Iscah
  simplified_phrase: She was the daughter of Haran, who was the father of both Milcah and Iscah.
  preserved_meaning: Milcah is Haran’s daughter, and Haran is father to both named women.
  reasoning_layer_used: POB lexical decisions for בַּת and אֲבִי plus applied revision
  rationale: A relative clause makes the family relationships easier to follow while retaining “father.”
translation_notes:
  risk_flags:
  - risk: “Married” does not preserve the Hebrew image of literally “taking” wives.
    mitigation: The POB footnote and lexical decision explicitly approve “married” as the idiomatic alternative.
