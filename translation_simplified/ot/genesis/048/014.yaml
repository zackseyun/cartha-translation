translation:
  language: en
  text: Israel reached out and put his right hand on Ephraim’s head, even though Ephraim was younger. He put his left hand on Manasseh’s head. In this way he crossed his hands,[a] because Manasseh was the firstborn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean that he positioned his hands deliberately; here the context indicates that he crossed them.
    reason: lexical_alternative
