translation:
  language: en
  text: When Joseph saw that his father had put his right hand on Ephraim’s head, he was displeased by what he saw. He took hold of his father’s hand to move it from Ephraim’s head onto Manasseh’s head.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: had placed his right hand
  simplified_phrase: had put his right hand
  preserved_meaning: Jacob had set his right hand on Ephraim’s head as part of the blessing gesture.
  reasoning_layer_used: POB lexical decision for יָשִׁית and יַד יְמִינוֹ
  rationale: “Put” is more common than “placed” while keeping the same physical action.
- pob_phrase: it was displeasing in his eyes
  simplified_phrase: he was displeased by what he saw
  preserved_meaning: Joseph reacted negatively to the placement of Jacob’s hand.
  reasoning_layer_used: POB lexical decision and doctrine-realignment revision for וַיֵּרַע בְּעֵינָיו
  rationale: The wording is natural English while preserving the Hebrew image of seeing.
- pob_phrase: to remove it from Ephraim’s head to Manasseh’s head
  simplified_phrase: to move it from Ephraim’s head onto Manasseh’s head
  preserved_meaning: Joseph tried to redirect Jacob’s hand from one son’s head to the other’s.
  reasoning_layer_used: POB lexical decision and latest revision for לְהָסִיר and directional עַל
  rationale: “Move” clearly expresses relocation, and “onto” preserves placement on Manasseh’s head.
translation_notes:
  risk_flags:
  - risk: The Hebrew idiom literally says that the action was displeasing “in his eyes.”
    mitigation: “Displeased by what he saw” keeps the visual image without using an awkward English idiom.
