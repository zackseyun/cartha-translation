translation:
  language: en
  text: The angel who has redeemed me from all harm—may he bless these boys.[a] May they bear my name and the name of my fathers, Abraham and Isaac.[b] May they multiply greatly within the land.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “from all evil.” The Hebrew word can include harm, calamity, or trouble.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew idiom is literally, “May my name be called on them.”
    reason: lexical_alternative
  - marker: c
    text: The rare Hebrew verb suggests abundant increase, possibly evoking many fish; “land” may also mean “earth.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: from all evil
  simplified_phrase: from all harm
  preserved_meaning: Jacob recalls deliverance from adversity without excluding the Hebrew word’s broader sense.
  reasoning_layer_used: lexical rationale and POB footnote
  rationale: “Harm” communicates the contextual sense directly, while the footnote preserves “evil.”
- pob_phrase: may my name and the name of my fathers Abraham and Isaac be called on them
  simplified_phrase: May they bear my name and the name of my fathers, Abraham and Isaac
  preserved_meaning: The boys are to carry the family identity and inheritance associated with these names.
  reasoning_layer_used: lexical rationale for the Hebrew name idiom
  rationale: “Bear my name” states the idiom naturally while keeping its name imagery.
- pob_phrase: in the midst of the land
  simplified_phrase: within the land
  preserved_meaning: Their abundant increase will take place in the land.
  reasoning_layer_used: lexical decision for בְּקֶרֶב הָאָרֶץ
  rationale: “Within” is natural English and does not restrict the meaning to the geographical center.
