translation:
  language: en
  text: But his father refused. He said, “I know, my son. I know. He too will become a people, and he too will grow great. Yet his younger brother will grow greater than him, and his descendants will become a fullness of nations.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a multitude of nations.” The Hebrew more literally says “a fullness of nations.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: But his father refused and said
  simplified_phrase: But his father refused. He said
  preserved_meaning: Jacob deliberately rejects Joseph’s attempt and then answers him.
  reasoning_layer_used: POB lexical decision for וַיְמָאֵן and immediate context
  rationale: Splitting the sentence makes the action and response easier to follow.
- pob_phrase: will become great ... will become greater than he
  simplified_phrase: will grow great ... will grow greater than him
  preserved_meaning: Both brothers will rise in prominence, but the younger will surpass the older.
  reasoning_layer_used: POB lexical decisions for יִגְדָּל and the comparative מִמֶּנּוּ
  rationale: “Grow great” is natural English and keeps the future development and comparison.
- pob_phrase: his offspring
  simplified_phrase: his descendants
  preserved_meaning: The promise concerns Ephraim’s future family line collectively.
  reasoning_layer_used: POB lexical decision for וְזַרְעוֹ
  rationale: “Descendants” is clearer for modern readers than the collective term “offspring.”
