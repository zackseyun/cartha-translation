  reasoning_layer_used: POB lexical decision for אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  rationale: “Events” makes the narrative connection clearer in ordinary English without specifying which events.
- pob_phrase: it was said to Yoseph
  simplified_phrase: someone told Yoseph
  preserved_meaning: An unnamed person informed Yoseph of his father’s condition.
  reasoning_layer_used: POB lexical rationale for וַיֹּאמֶר לְיוֹסֵף
  rationale: The active wording is easier to read while keeping the speaker unidentified.
- pob_phrase: So he took his two sons with him, Manasseh and Ephraim
