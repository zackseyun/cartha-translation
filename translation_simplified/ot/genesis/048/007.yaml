translation:
  language: en
  text: As for me, when I came from Paddan, Rachel died beside me[a] in the land of Canaan, while we were still on the way and some distance from Ephrath. I buried her there on the way to Ephrath, that is, Bethlehem.
  philosophy: optimal-equivalence
  footnotes:
