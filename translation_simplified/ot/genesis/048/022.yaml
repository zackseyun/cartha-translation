translation:
  language: en
  text: As for me, I give you one ridge more than your brothers receive.[a] I took it from the Amorite’s possession with my sword and bow.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “ridge” can also mean “portion” and sounds like the name Shechem. The wording may point both to an extra share and to the place later associated with Joseph.
    reason: lexical_alternative
