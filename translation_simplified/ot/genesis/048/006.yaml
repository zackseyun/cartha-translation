translation:
  language: en
  text: But any children you father after Ephraim and Manasseh will be yours. For purposes of inheritance, they will be counted under their brothers’ names.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, they would belong to Ephraim’s or Manasseh’s tribe rather than receive separate tribal inheritances.
    reason: cultural_note
