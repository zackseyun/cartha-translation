translation:
  language: en
  text: So the men took this gift, twice as much money, and Benjamin with them. Then they set out, went down to Egypt,[a] and stood before Joseph.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Went down to Egypt” is the customary biblical way of describing travel from Canaan to Egypt.
    reason: cultural_note
