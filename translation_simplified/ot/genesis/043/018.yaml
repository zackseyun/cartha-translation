translation:
  language: en
  text: The men became afraid because they had been taken into Joseph’s house. They said, “We have been brought in because of the money that was returned in our sacks on our first trip. He may use it as an excuse to turn against us,[a] attack us, take us as slaves, and take our donkeys too.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew idiom is difficult and may also mean “find an occasion against us.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: were afraid because they had been brought into Joseph’s house
  simplified_phrase: became afraid because they had been taken into Joseph’s house
  preserved_meaning: Being taken into Joseph’s house caused their fear.
  reasoning_layer_used: Lexical decision for הוּבְאוּ and the causal force of כִּי.
  rationale: The wording keeps the explicit cause while making the narrative sequence natural.
- pob_phrase: so that he may make a pretext against us
  simplified_phrase: He may use it as an excuse to turn against us
  preserved_meaning: They fear Joseph may use the returned money as an occasion for hostile action.
  reasoning_layer_used: Lexical decision and POB footnote for לְהִתְגֹּלֵל עָלֵינוּ.
  rationale: This explains the difficult idiom without limiting it to a definite legal accusation.
- pob_phrase: fall upon us and take us as slaves, along with our donkeys
  simplified_phrase: attack us, take us as slaves, and take our donkeys too
  preserved_meaning: They fear attack, enslavement, and the seizure of their animals.
  reasoning_layer_used: Lexical decisions for וּלְהִתְנַפֵּל עָלֵינוּ, וְלָקַחַת אֹתָנוּ לַעֲבָדִים, and וְאֶת חֲמֹרֵינוּ.
  rationale: The direct verbs clearly preserve each distinct feared action.
