translation:
  language: en
  text: He asked how they were doing. Then he said, “Is your elderly father, the one you told me about, doing well? Is he still alive?”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: asked them about their well-being
  simplified_phrase: asked how they were doing
  preserved_meaning: Joseph asked about their general welfare, not merely whether there was peace.
  reasoning_layer_used: POB lexical decision for לְשָׁלוֹם
  rationale: The conversational question expresses the Hebrew welfare idiom in common English.
- pob_phrase: whom you spoke of
  simplified_phrase: the one you told me about
  preserved_meaning: Joseph identifies the father the brothers had previously mentioned.
  reasoning_layer_used: POB lexical decision for אֲשֶׁר אֲמַרְתֶּם
  rationale: The rewritten clause is more natural for modern readers while keeping the same reference.
- pob_phrase: Is your elderly father ... well?
  simplified_phrase: Is your elderly father ... doing well?
  preserved_meaning: Joseph asks about the elderly father's general condition.
  reasoning_layer_used: POB lexical decisions for הֲשָׁלוֹם and אֲבִיכֶם הַזָּקֵן
  rationale: “Doing well” keeps the broad sense of welfare and retains the father's age.
translation_notes:
  risk_flags:
  - risk: “Doing well” may be heard as success rather than general welfare.
