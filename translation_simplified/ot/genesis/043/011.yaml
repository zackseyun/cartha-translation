translation:
  language: en
  text: 'Then their father Israel said, “If this is what must happen, do this: Pack some of the land’s finest products in your containers. Take them down to the man as a gift: a little balm and a little honey[a], gum and myrrh[b], pistachios, and almonds.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “honey” may refer to a sweet syrup rather than bee honey.
    reason: lexical_alternative
  - marker: b
    text: The exact substances translated “gum” and “myrrh” are uncertain; they may have been other aromatic resins.
    reason: lexical_alternative
