translation:
  language: en
  text: You will be in charge of my household, and all my people will obey your orders.[a] Only in holding the throne will I outrank you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says, “At your mouth all my people shall kiss,” an expression understood here as obeying or showing homage at Joseph’s command.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: You shall be over my house
  simplified_phrase: You will be in charge of my household
  preserved_meaning: Joseph will have authority over Pharaoh’s household and its administration.
  reasoning_layer_used: POB lexical decision for עַל בֵּיתִי
  rationale: “In charge of” states the intended authority more clearly than “over.”
- pob_phrase: all my people shall obey your command
  simplified_phrase: all my people will obey your orders
  preserved_meaning: Pharaoh’s people must follow Joseph’s spoken directives.
  reasoning_layer_used: POB lexical decisions for פִּיךָ and יִשַּׁק
  rationale: “Orders” is common administrative English while the footnote preserves the Hebrew image.
- pob_phrase: Only with respect to the throne will I be greater than you
  simplified_phrase: Only in holding the throne will I outrank you
  preserved_meaning: Pharaoh retains royal rank above Joseph while granting him broad authority.
  reasoning_layer_used: POB lexical decisions for הַכִּסֵּא and אֶגְדַּל מִמֶּךָּ
  rationale: “Outrank” makes the positional superiority clear without removing the throne image.
translation_notes:
  risk_flags:
  - risk: “Household” may sound narrower than Pharaoh’s full palace administration.
    mitigation: The phrase “in charge” and the POB lexical rationale retain the broader administrative sense.
