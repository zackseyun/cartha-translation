translation:
  language: en
  text: Here is what Pharaoh should do. He should put officials in charge throughout Egypt. During the seven years of plenty, he should collect one-fifth of everything the land produces.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “take” or “levy” one-fifth of the land’s produce.
    reason: lexical_alternative
