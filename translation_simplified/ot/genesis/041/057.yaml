translation:
  language: en
  text: People from all over the earth came to Egypt and went to Joseph to buy grain, because the famine was severe everywhere.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “All over the earth” can also mean “throughout the land” or “throughout the whole world.” Here it broadly describes the lands affected by the famine.
    reason: lexical_alternative
