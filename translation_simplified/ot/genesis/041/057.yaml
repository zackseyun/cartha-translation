  preserved_meaning: People across the famine-stricken world traveled to Egypt.
  reasoning_layer_used: POB lexical decision for וְכָל הָאָרֶץ
  rationale: Naming the people makes the Hebrew collective expression natural in English without narrowing its broad scope.
- pob_phrase: to Egypt to Joseph
  simplified_phrase: to Egypt and went to Joseph
  preserved_meaning: They traveled to Egypt and approached Joseph as the official responsible for grain.
  reasoning_layer_used: POB lexical decisions for מִצְרַיְמָה and אֶל יוֹסֵף
  rationale: Separating the two destinations removes awkward wording while retaining “to Joseph” rather than over-interpreting it as “from Joseph.”
- pob_phrase: in all the earth
  simplified_phrase: everywhere
  preserved_meaning: The famine was severe across the same broad region already described.
  reasoning_layer_used: POB lexical decision for בְּכָל הָאָרֶץ
  rationale: The shorter wording avoids a stiff repetition while preserving the famine's extensive reach.
