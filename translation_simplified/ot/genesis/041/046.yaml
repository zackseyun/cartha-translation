translation:
  language: en
  text: Joseph was thirty years old when he came before Pharaoh, the king of Egypt. Then he left Pharaoh’s presence and traveled throughout the land of Egypt.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: when he stood before Pharaoh king of Egypt
  simplified_phrase: when he came before Pharaoh, the king of Egypt
  preserved_meaning: Joseph appeared in the royal presence of Egypt’s king.
  reasoning_layer_used: POB lexical decisions for בְּעָמְדוֹ, לִפְנֵי, and מֶלֶךְ מִצְרָיִם
  rationale: “Came before” naturally expresses a formal appearance, while the added commas clarify Pharaoh’s title.
- pob_phrase: went out from before Pharaoh
  simplified_phrase: left Pharaoh’s presence
  preserved_meaning: Joseph departed from the place where he had been before Pharaoh.
  reasoning_layer_used: POB lexical alternatives for וַיֵּצֵא and מִלִּפְנֵי פַרְעֹה
  rationale: This replaces an awkward Hebrew-shaped phrase with its clear modern English meaning.
- pob_phrase: traveled through all the land of Egypt
  simplified_phrase: traveled throughout the land of Egypt
  preserved_meaning: Joseph moved broadly across the whole land of Egypt.
  reasoning_layer_used: POB lexical decisions for וַיַּעְבֹר and בְּכָל אֶרֶץ מִצְרַיִם
  rationale: “Throughout” states the comprehensive scope more smoothly without adding a purpose for the journey.
translation_notes:
  risk_flags:
  - risk: “Came before” may sound like simple arrival rather than a formal royal appearance.
    mitigation: The reference to Pharaoh as king keeps the courtly setting clear.
