  preserved_meaning: The cows are emaciated and visibly in poor condition, not morally evil or necessarily diseased.
  reasoning_layer_used: POB lexical decisions for הָרַקּוֹת and וְהָרָעוֹת, with the immediate dream context
  rationale: “Unhealthy-looking” clarifies their poor appearance without diagnosing illness.
- pob_phrase: that came up after them
  simplified_phrase: that came up after the first cows
  preserved_meaning: These cows appeared after the earlier group in the dream.
  reasoning_layer_used: POB lexical decision for הָעֹלֹת אַחֲרֵיהֶן
  rationale: Naming the first cows keeps the dream sequence explicit.
- pob_phrase: are seven years ... will be seven years of famine
  simplified_phrase: stand for seven years ... mean that there will be seven years of famine
  preserved_meaning: Joseph identifies the dream images as symbols of a future seven-year famine.
  reasoning_layer_used: POB lexical decisions for שֶׁבַע שָׁנִים הֵנָּה and יִהְיוּ
  rationale: The recasting makes the symbolic explanation and prediction immediately clear.
