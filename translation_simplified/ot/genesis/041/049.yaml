translation:
  language: en
  text: Yoseph stored up grain in enormous quantities, like the sand of the sea. He stopped counting it because there was too much to count.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yoseph is the Hebrew form of the name traditionally written Joseph in English.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: in very great abundance
  simplified_phrase: in enormous quantities
  preserved_meaning: The grain was stored in an exceptionally large amount.
  reasoning_layer_used: Lexical decision for הַרְבֵּה מְאֹד and the applied revision preserving its intensifying force.
  rationale: “Enormous quantities” is direct modern English for the strong quantity phrase.
- pob_phrase: until he stopped counting, because there was no number
  simplified_phrase: He stopped counting it because there was too much to count.
  preserved_meaning: Yoseph ceased counting because the accumulated grain was beyond practical enumeration.
  reasoning_layer_used: Lexical decisions for חָדַל לִסְפֹּר and כִּי אֵין מִסְפָּר.
  rationale: A separate sentence clearly expresses the Hebrew idiom’s intended result.
interpretive_expansions:
- pob_phrase: because there was no number
  rendering: because there was too much to count
  claim: The phrase means the grain was beyond counting, not that numbers did not exist.
  evidence:
  - The POB footnote explicitly identifies the clause as an idiom meaning “beyond counting.”
  - The preceding clause says Yoseph stopped counting the grain.
  confidence: high
  alternatives_preserved:
  - because it was beyond counting
  - because it could not be counted
translation_notes:
  risk_flags:
  - risk: “Too much to count” could be read as strict mathematical impossibility rather than practical innumerability.
    mitigation: The retained sand-of-the-sea image signals emphatic abundance without requiring a literal claim.
