translation:
  language: en
  text: When morning came, Pharaoh’s spirit was deeply troubled. He sent for all the magicians of Egypt and all its wise men. He told them about his dream,[a] but no one could explain its meaning to Pharaoh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew says “dream” in the singular here but later refers to it as “them,” perhaps meaning the dream’s different parts or the dream experience as a whole.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: In the morning, his spirit was troubled
  simplified_phrase: When morning came, Pharaoh’s spirit was deeply troubled
  preserved_meaning: The morning setting and Pharaoh’s inner disturbance remain explicit.
  reasoning_layer_used: Lexical decisions for וַיְהִי בַבֹּקֶר and וַתִּפָּעֶם רוּחוֹ
  rationale: Naming Pharaoh clarifies the pronoun while preserving the image of his troubled spirit.
- pob_phrase: he sent and called all the magicians of Egypt and all its wise men
  simplified_phrase: He sent for all the magicians of Egypt and all its wise men
  preserved_meaning: Pharaoh summoned every member of both groups of Egyptian specialists.
  reasoning_layer_used: Lexical decisions for וַיִּשְׁלַח וַיִּקְרָא, חַרְטֻמֵּי מִצְרַיִם, and כָּל חֲכָמֶיהָ
  rationale: “Sent for” naturally expresses the summons, while repeated “all” keeps the groups distinct.
- pob_phrase: there was no one who could interpret them for Pharaoh
  simplified_phrase: no one could explain its meaning to Pharaoh
  preserved_meaning: No specialist could tell Pharaoh what his dream meant.
  reasoning_layer_used: Lexical decision for וְאֵין פֹּתֵר אֹתָם לְפַרְעֹה and its documented number ambiguity
  rationale: Plain wording clarifies dream interpretation without asserting that Pharaoh had several dreams.
