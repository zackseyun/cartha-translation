translation:
  language: en
  text: The seven years of famine began, just as Joseph had said. There was famine in every land, but there was bread[a] throughout Egypt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “food.” The Hebrew word for “bread” can also mean food or provisions more broadly.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: began to come
  simplified_phrase: began
  preserved_meaning: The predicted seven-year famine started.
  reasoning_layer_used: Lexical decision for וַתְּחִלֶּינָה and לָבוֹא
  rationale: English does not need the Hebrew arrival idiom to express the famine’s onset.
- pob_phrase: in all the lands
  simplified_phrase: in every land
  preserved_meaning: The famine affected all the lands in view.
  reasoning_layer_used: Lexical decision for בְּכָל הָאֲרָצוֹת
  rationale: The singular distributive wording is more natural while preserving the plural scope.
- pob_phrase: in all the land of Egypt there was bread
  simplified_phrase: there was bread throughout Egypt
  preserved_meaning: Food remained available across Egypt in contrast to the famine elsewhere.
  reasoning_layer_used: Lexical decisions for וּבְכָל אֶרֶץ מִצְרַיִם and הָיָה לָחֶם
  rationale: The reordered clause states the same contrast in ordinary English.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “bread” too narrowly.
    mitigation: The footnote preserves the broader possible sense of food or provisions.
