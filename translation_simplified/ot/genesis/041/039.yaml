translation:
  language: en
  text: Then Pharaoh said to Joseph, “Because[a] God has shown you all this, no one has insight and wisdom like you.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “After.” Here the Hebrew word gives the reason for Pharaoh’s conclusion.
    reason: lexical_alternative
