  reasoning_layer_used: Lexical decisions for אַחֲרֵי and הוֹדִיעַ
  rationale: “Because” makes the causal force direct, while “shown” clearly preserves God’s act of revealing.
- pob_phrase: there is no one as discerning and wise as you
