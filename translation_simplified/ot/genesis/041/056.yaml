translation:
  language: en
  text: The famine was throughout the whole region.[a] Joseph opened all the storehouses[b] and sold grain to the Egyptians. The famine in Egypt became more severe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “over all the face of the earth” and may refer to the whole land or the broader inhabited region affected by the famine.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew is elliptical, literally “all that was in them”; the implied places are storehouses or granaries.
    reason: source_note
