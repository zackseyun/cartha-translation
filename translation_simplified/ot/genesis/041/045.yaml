translation:
  language: en
  text: Pharaoh named Joseph Zaphenath-paneah.[a] He gave Asenath, the daughter of Potiphera, the priest of On, to Joseph as his wife.[b] Then Joseph went throughout the land of Egypt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Also spelled “Zaphenath-paaneah.” The meaning of this Egyptian name is uncertain.
    reason: lexical_alternative
  - marker: b
    text: On was an Egyptian city later known as Heliopolis.
    reason: cultural_note
  - marker: c
    text: Or “went out over the land of Egypt.” This wording may also suggest Joseph’s authority over the land as he traveled through it.
    reason: alternative_reading
