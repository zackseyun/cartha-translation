  text: Pharaoh had Joseph ride in a chariot second in rank only to his own. People went ahead of Joseph, shouting, “Abrek!”[a] So Pharaoh put Joseph in charge of the whole land of Egypt.
  philosophy: optimal-equivalence
  footnotes:
