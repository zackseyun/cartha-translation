translation:
  language: en
  text: Then Pharaoh took his royal seal ring[a] off his own hand and placed it on Joseph’s hand. He dressed Joseph in fine linen clothes and put a gold chain[b] around his neck.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can mean simply “ring,” but here it likely means Pharaoh’s seal ring, which represented royal authority.
    reason: lexical_alternative
  - marker: b
    text: The exact ornament is uncertain; it may have been a gold necklace or collar.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: removed his signet ring from his hand
  simplified_phrase: took his royal seal ring off his own hand
  preserved_meaning: Pharaoh removed the ring that represented his delegated authority.
  reasoning_layer_used: POB lexical decision for טַבַּעְתּוֹ and מֵעַל יָדוֹ
  rationale: “Royal seal ring” explains the unfamiliar term “signet” in common English.
- pob_phrase: put it on Joseph’s hand
  simplified_phrase: placed it on Joseph’s hand
  preserved_meaning: Pharaoh physically transferred the ring to Joseph’s hand.
  reasoning_layer_used: POB lexical decision for וַיִּתֵּן אֹתָהּ עַל יַד יוֹסֵף
  rationale: “Placed” clearly describes the ceremonial action without implying a merely verbal gift.
- pob_phrase: he clothed him in garments of fine linen
  simplified_phrase: He dressed Joseph in fine linen clothes
  preserved_meaning: Pharaoh honored Joseph by clothing him in high-quality linen.
  reasoning_layer_used: POB lexical decisions for וַיַּלְבֵּשׁ אֹתוֹ and בִּגְדֵי שֵׁשׁ
  rationale: The rewrite replaces formal wording and an unclear pronoun with direct modern English.
