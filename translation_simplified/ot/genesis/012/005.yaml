translation:
  language: en
  text: Abram took with him his wife Sarai, his brother’s son Lot, all the possessions they had acquired, and the people they had gathered in Haran.[a] They set out for the land of Canaan, and they reached the land of Canaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be rendered “the persons they had acquired,” or more literally, “the souls they had made.” It likely refers to people who had become part of their household in Haran.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Abram took Sarai his wife, and Lot his brother’s son
  simplified_phrase: Abram took with him his wife Sarai, his brother’s son Lot
  preserved_meaning: Abram brought Sarai and Lot along when he departed.
  reasoning_layer_used: Lexical decisions for וַיִּקַּח, אִשְׁתּוֹ, and בֶּן אָחִיו
  rationale: The reordered names and “with him” clarify the travel sense while retaining the Hebrew kinship wording.
- pob_phrase: the people whom they had acquired in Haran
  simplified_phrase: the people they had gathered in Haran
  preserved_meaning: These people had become associated with Abram’s household in Haran.
  reasoning_layer_used: Lexical decision for הַנֶּפֶשׁ אֲשֶׁר עָשׂוּ and doctrine-realignment revision
  rationale: “Gathered” follows the controlling lexical rationale without implying that Abram created people.
- pob_phrase: they set out to go to the land of Canaan, and they came to the land of Canaan
  simplified_phrase: They set out for the land of Canaan, and they reached the land of Canaan
  preserved_meaning: They departed for Canaan and successfully arrived there.
  reasoning_layer_used: Lexical decisions for וַיֵּצְאוּ לָלֶכֶת and וַיָּבֹאוּ אַרְצָה כְּנַעַן
  rationale: Natural English removes the awkward departure wording while preserving the repeated destination and arrival.
