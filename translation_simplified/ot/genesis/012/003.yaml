translation:
  language: en
  text: I will bless those who bless you, and I will curse anyone who dishonors you.[a] In you, all the families of the earth will be blessed.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “curses you,” but this word is weaker than the word translated “curse” for God’s response.
    reason: lexical_alternative
  - marker: b
    text: This may also be translated, “All the families of the earth will bless themselves by you,” or, “Through you all the families of the earth will be blessed.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the one who treats you lightly
  simplified_phrase: anyone who dishonors you
  preserved_meaning: The human offense is contempt or dishonor, while God’s response is the stronger act of cursing.
  reasoning_layer_used: POB lexical decision for מְקַלֶּלְךָ
  rationale: “Dishonors” expresses the contrast more clearly in common English.
- pob_phrase: and in you all the families of the earth will be blessed
  simplified_phrase: In you, all the families of the earth will be blessed.
  preserved_meaning: The universal promise remains passive and keeps “in you” as the main reading.
  reasoning_layer_used: POB lexical and theological decisions for וְנִבְרְכוּ בְךָ
  rationale: A new sentence makes the promise easier to follow without resolving its ambiguity.
translation_notes:
  risk_flags:
  - risk: “Dishonors” may sound narrower than the Hebrew range of contempt, dishonor, or cursing.
    mitigation: Footnote a preserves the lexical alternative and the contrast between the two Hebrew verbs.
  - risk: The passive or reflexive sense of the final blessing remains debated.
    mitigation: Footnote b preserves both the reflexive and instrumental alternatives.
