    text: Yahweh is the divine name written in Hebrew as YHWH and traditionally rendered “the LORD.”
    reason: lexical_alternative
  - marker: b
    text: Or “proclaimed the name of Yahweh.” The Hebrew expression may refer to calling on Yahweh in worship or publicly declaring his name.
    reason: alternative_reading
