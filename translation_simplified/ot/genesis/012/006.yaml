translation:
  language: en
  text: Abram traveled through the land as far as the place at Shechem, as far as the oak of Moreh.[a] At that time, the Canaanite people were in the land.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew refers to a large tree, perhaps an oak or terebinth; the exact species is uncertain.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew uses the singular “the Canaanite” collectively for the Canaanite people.
    reason: source_note
