  text: Yahweh said to Abram, “Leave your land, your relatives, and your father’s household. Go to the land I will show you.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Go out from your land
  simplified_phrase: Leave your land
  preserved_meaning: Abram is commanded to depart from his own land.
  reasoning_layer_used: POB translation and applied revision
  rationale: “Leave” expresses the preserved command “Go out” in more natural English.
- pob_phrase: your kindred
  simplified_phrase: your relatives
  preserved_meaning: Abram must depart from his wider family connections.
  reasoning_layer_used: POB translation
  rationale: “Relatives” makes the uncommon term “kindred” immediately understandable.
- pob_phrase: and from your father’s house to the land
  simplified_phrase: and your father’s household. Go to the land
  preserved_meaning: Abram must leave his father’s household and travel to God’s chosen land.
  reasoning_layer_used: source payload and POB clause structure
  rationale: Two sentences clarify the departure and destination without merging them.
translation_notes:
  risk_flags:
  - risk: “Household” may be heard as only a dwelling place.
    mitigation: The possessive “father’s” and its place beside “relatives” retain the family-group sense.
