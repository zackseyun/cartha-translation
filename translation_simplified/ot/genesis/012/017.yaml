  text: But because of Sarai, Abram’s wife, Yahweh struck Pharaoh and his household with severe plagues.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Yahweh afflicted Pharaoh and his household with severe plagues
  simplified_phrase: Yahweh struck Pharaoh and his household with severe plagues
  preserved_meaning: Yahweh caused serious harm to Pharaoh and those in his domestic sphere through plagues.
  reasoning_layer_used: POB lexical decisions for וַיְנַגַּע, נְגָעִים גְּדֹלִים, and וְאֶת בֵּיתוֹ
  rationale: “Struck” is clearer than “afflicted” and preserves the Hebrew image without changing the kind of harm.
- pob_phrase: because of Sarai, Abram’s wife
  simplified_phrase: because of Sarai, Abram’s wife
  preserved_meaning: Sarai’s identity as Abram’s wife explains why the plagues came.
  reasoning_layer_used: POB lexical decision for עַל דְּבַר and the appositional identification of Sarai
  rationale: Moving the reason to the beginning makes the cause easier to follow while preserving the narrative emphasis.
