translation:
  language: en
  text: I will make you into a great nation. I will bless you and make your name great. Be a blessing to others.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “You will be a blessing to others.” The Hebrew form is a command, but it may also describe the result of God’s promises.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And I will make you into a great nation
  simplified_phrase: I will make you into a great nation.
  preserved_meaning: God will cause Abram to become a great people-group.
  reasoning_layer_used: Lexical decisions for עשה and לְגוֹי גָּדוֹל
  rationale: A separate sentence presents the first promise clearly without changing its meaning.
- pob_phrase: and I will bless you, and I will make your name great
  simplified_phrase: I will bless you and make your name great.
  preserved_meaning: God will personally bless Abram and cause his name to become great.
  reasoning_layer_used: Lexical decisions for ברך, גדל, and שם
  rationale: This wording avoids implying that God gives Abram a new name while keeping the biblical term “name.”
- pob_phrase: and be a blessing
  simplified_phrase: Be a blessing to others.
  preserved_meaning: Abram is commanded to become a source of blessing.
  reasoning_layer_used: Theological decision on the imperative וֶהְיֵה
  rationale: A separate sentence clearly marks the shift from God’s promises to Abram’s calling.
interpretive_expansions:
- pob_phrase: be a blessing
  rendering: Be a blessing to others
  claim: Abram is to bring blessing beyond himself.
  evidence:
  - The POB lexical rationale describes Abram as a source or embodiment of blessing.
  - Genesis 12:3 says blessing will reach other families through Abram.
  confidence: high
  alternatives_preserved:
  - You will be a blessing to others.
translation_notes:
  risk_flags:
  - risk: “Nation” may suggest only a modern political state.
    mitigation: The wording follows POB, where “nation” denotes the great people-group descended from Abram.
  - risk: The final clause may be understood as a command or as the result of God’s promises.
    mitigation: The main text preserves the command, and the footnote preserves the resultative reading.
