translation:
  language: en
  text: Then Pharaoh gave some men orders about Abram.[a] They sent Abram away with his wife and everything he owned.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew simply says “men”; they were probably Pharaoh’s attendants or agents, but their exact role is not stated.
    reason: cultural_note
simplification_decisions:
- pob_phrase: gave men orders concerning him
  simplified_phrase: gave some men orders about Abram
  preserved_meaning: Pharaoh issued instructions to men regarding Abram.
  reasoning_layer_used: Lexical decisions for וַיְצַו, עָלָיו, and אֲנָשִׁים
  rationale: “About Abram” is clearer than “concerning him,” while “men” preserves the source’s lack of a specific role.
- pob_phrase: they sent him away with his wife and all that belonged to him
  simplified_phrase: They sent Abram away with his wife and everything he owned
  preserved_meaning: The men dismissed Abram together with his wife and all his possessions.
  reasoning_layer_used: Lexical decisions for וַיְשַׁלְּחוּ and כָּל אֲשֶׁר לוֹ
  rationale: Repeating Abram removes pronoun confusion, and “everything he owned” states possession in common English.
translation_notes:
  risk_flags:
  - risk: “Some men” may suggest unidentified outsiders rather than Pharaoh’s personnel.
    mitigation: The footnote gives the likely context without assigning them a role the Hebrew does not specify.
