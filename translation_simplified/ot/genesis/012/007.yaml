translation:
  language: en
  text: Then Yahweh appeared to Abram. He said, “I will give this land to your offspring[a].” Abram built an altar there for Yahweh, who had appeared to him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “seed.” The Hebrew word is singular in form but can refer to offspring as a group.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Then Yahweh appeared to Abram and said
  simplified_phrase: Then Yahweh appeared to Abram. He said
  preserved_meaning: Yahweh visibly appeared to Abram and then spoke to him.
  reasoning_layer_used: POB lexical decision for וַיֵּרָא and narrative context
  rationale: Two short sentences make the sequence easier to follow.
- pob_phrase: To your offspring I will give this land
  simplified_phrase: I will give this land to your offspring
  preserved_meaning: Yahweh promises the land to Abram’s collectively understood offspring.
  reasoning_layer_used: POB lexical and theological decisions for לְזַרְעֲךָ and אֶתֵּן
  rationale: Ordinary English word order clarifies the promise without resolving the collective singular.
- pob_phrase: So there he built an altar to Yahweh
  simplified_phrase: Abram built an altar there for Yahweh
  preserved_meaning: Abram built an altar at that place dedicated to Yahweh.
  reasoning_layer_used: POB lexical decision for וַיִּבֶן שָׁם מִזְבֵּחַ לַיהוָה
  rationale: Naming Abram removes an unclear pronoun, and “for” naturally expresses dedication.
translation_notes:
  risk_flags:
  - risk: “Offspring” may be read as either one person or many descendants.
    mitigation: The footnote preserves the Hebrew word’s singular form and collective use.
