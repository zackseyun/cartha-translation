translation:
  language: en
  text: The springs of the deep and the windows of the heavens[a] were closed, and the rain from the heavens was held back[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “floodgates of the heavens.” The Hebrew literally refers to openings or windows in the heavens.
    reason: lexical_alternative
  - marker: b
    text: Or “ceased.” The Hebrew verb can emphasize the rain being held back, resulting in its stopping.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: were shut
  simplified_phrase: were closed
  preserved_meaning: The springs and heavenly openings were no longer open.
  reasoning_layer_used: POB lexical decision for וַיִּסָּכְרוּ
  rationale: “Closed” is more natural modern English and remains an approved lexical alternative.
- pob_phrase: was restrained
  simplified_phrase: was held back
  preserved_meaning: The rain was prevented from continuing, with cessation as the result.
  reasoning_layer_used: POB lexical decision for וַיִּכָּלֵא
  rationale: “Held back” clearly preserves active containment rather than stating only that the rain ceased.
- pob_phrase: windows of the heavens
  simplified_phrase: windows of the heavens[a]
  preserved_meaning: The concrete image of openings in the heavens remains intact.
  reasoning_layer_used: POB lexical decisions for אֲרֻבֹּת and הַשָּׁמַיִם
  rationale: The image and repeated cosmological wording are retained, while the footnote gives the interpretive alternative.
translation_notes:
  risk_flags:
  - risk: Modern readers may picture ordinary glass windows.
    mitigation: Footnote a explains that the image refers to openings in the heavens and gives “floodgates” as an alternative.
