translation:
  language: en
  text: The dove came back to him in the evening, and there in her mouth was a freshly plucked[a] olive leaf. So Noah knew that the waters had receded[b] from the earth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word means 'freshly torn' or 'newly plucked,' indicating the leaf was taken from a living, growing tree.
    reason: simplification_note
  - marker: b
    text: Or 'subsided.'
    reason: simplification_note
simplification_decisions:
- preserved_meaning: Changed 'came to him at evening time' to 'came back to him in the evening' for better natural flow, while maintaining the verb's motion.
  reasoning_layer_used: POB audit trail
  rationale: Changed 'came to him at evening time' to 'came back to him in the evening' for better natural flow, while maintaining the verb's motion.
- preserved_meaning: Translated the demonstrative 'and behold' (we-hinneh) to 'and there' to maintain the sense of discovery and surprise without using the archaic 'behold.'
  reasoning_layer_used: POB audit trail
  rationale: Translated the demonstrative 'and behold' (we-hinneh) to 'and there' to maintain the sense of discovery and surprise without using the archaic 'behold.'
- preserved_meaning: Simplified 'from upon the earth' to 'from the earth' to eliminate the double preposition which sounds awkward in modern English, without losing the spatial orientation.
  reasoning_layer_used: POB audit trail
  rationale: Simplified 'from upon the earth' to 'from the earth' to eliminate the double preposition which sounds awkward in modern English, without losing the spatial orientation.
- preserved_meaning: Updated 'subsided' to 'receded' to use a more common word for retreating floodwaters.
  reasoning_layer_used: POB audit trail
  rationale: Updated 'subsided' to 'receded' to use a more common word for retreating floodwaters.
retained_terms:
- term: 'freshly plucked: Kept this term because it is crucial to the narrative proof that vegetation was regenerating; simply translating it as ''green'' or ''new'' would miss the physical evidence of growth.'
  reason: Retained to preserve POB's source-grounded terminology.
- term: 'her mouth: Preserved the gendered pronoun matching the Hebrew grammatical gender and concrete physical narrative of the bird carrying the leaf.'
  reason: Retained to preserve POB's source-grounded terminology.
translation_notes:
  source_alignment_notes: 'The translation preserves the action sequence of the Hebrew wayyiqtol verbs: the dove''s arrival (wattabo), Noah''s recognition of the leaf (we-hinneh), and Noah''s subsequent deduction (wayyeda). The core truth that the waters were lowering (qallu) is fully maintained.'
  readability_notes:
  - The resulting text is highly readable, uses clear modern vocabulary ('receded', 'came back to him in the evening'), and removes clunky structural literalisms while preserving the dramatic nature of the original report.
  compression_notes:
  - No information was compressed out of the verse. The poetic and narrative punch of the freshly plucked leaf is preserved intact.
  risk_flags:
  - risk: Low risk. The substitution of 'receded' for 'subsided' is a standard synonym choice with no theological divergence only in commonality of use.
    mitigation: Flag retained for reviewer attention.
