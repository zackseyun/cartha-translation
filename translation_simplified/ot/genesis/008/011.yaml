translation:
  language: en
  text: The dove came to him in the evening, and there in her mouth was a freshly plucked[a] olive leaf. So Noah knew that the waters had receded[b] from the earth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word means “freshly torn” or “newly plucked,” showing that the leaf had just been taken from a living olive tree.
    reason: lexical_alternative
  - marker: b
    text: Or “subsided.”
    reason: lexical_alternative
