translation:
  language: en
  text: But the dove could not find a place to set the sole of her foot. So she returned to him in the ark, because water was still on the surface of the whole earth. Then he reached out his hand, took her, and brought her inside the ark with him.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: found no resting place for the sole of her foot
  simplified_phrase: could not find a place to set the sole of her foot
  preserved_meaning: The dove found nowhere it could settle, while the concrete image of its sole remains.
  reasoning_layer_used: POB lexical decisions for מָנוֹחַ and לְכַף רַגְלָהּ
  rationale: The recast clause is easier to understand without flattening the Hebrew image.
- pob_phrase: stretched out his hand
  simplified_phrase: reached out his hand
  preserved_meaning: Noah extended his hand toward the dove.
  reasoning_layer_used: POB lexical decision for וַיִּשְׁלַח יָדוֹ
  rationale: The POB audit lists “reached out” as a natural equivalent for the idiom.
- pob_phrase: brought her to himself into the ark
  simplified_phrase: brought her inside the ark with him
  preserved_meaning: Noah brought the dove both into the ark and into his company.
  reasoning_layer_used: POB lexical decision for וַיָּבֵא אֹתָהּ אֵלָיו אֶל הַתֵּבָה
  rationale: The natural English wording retains both movements without adding “back.”
