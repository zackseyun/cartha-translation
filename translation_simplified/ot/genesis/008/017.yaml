translation:
  language: en
  text: Bring out every living creature that is with you—all the birds and livestock, and every creature that crawls on the ground—so they may swarm[a] on the earth, be fruitful, and multiply on the earth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “swarm” means to spread and become very numerous.
    reason: simplification_note
simplification_decisions:
- pob_phrase: every living thing that is with you, from all flesh
  simplified_phrase: every living creature that is with you
  preserved_meaning: The command includes every kind of living creature with Noah.
  reasoning_layer_used: POB lexical decisions for כָּל הַחַיָּה, אֲשֶׁר אִתְּךָ, and מִכָּל בָּשָׂר
  rationale: “Living creature” makes the animal sense clear, while “that is with you” retains the source qualifier.
- pob_phrase: every creeping thing that creeps on the earth
  simplified_phrase: every creature that crawls on the ground
  preserved_meaning: The phrase refers to creatures that move close to the ground.
  reasoning_layer_used: POB lexical decisions for רֶמֶשׂ and רֹמֵשׂ
  rationale: This removes awkward repetition while preserving the concrete movement image.
- pob_phrase: so that they may swarm on the earth and be fruitful and multiply on the earth
  simplified_phrase: so they may swarm on the earth, be fruitful, and multiply on the earth
  preserved_meaning: The creatures are to increase abundantly and reproduce on the earth.
  reasoning_layer_used: POB lexical and theological decisions on creation-blessing language
  rationale: The wording remains clear while retaining “swarm” and “be fruitful and multiply” as echoes of Genesis 1.
