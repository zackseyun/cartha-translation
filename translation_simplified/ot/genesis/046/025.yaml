simplification_decisions:
- pob_phrase: These are the sons of Bilhah ... seven persons in all
  simplified_phrase: These were the sons of Bilhah—seven people in all.
  preserved_meaning: The verse identifies Bilhah’s sons and gives their total as seven people.
  reasoning_layer_used: POB lexical decisions for בְּנֵי, כָּל נֶפֶשׁ, and שִׁבְעָה
  rationale: The shorter sentence keeps both the family relationship and the census total clear.
- pob_phrase: whom Laban gave to Rachel his daughter
  simplified_phrase: Laban had given Bilhah to his daughter Rachel
  preserved_meaning: Laban gave Bilhah to Rachel, who was Laban’s daughter.
  reasoning_layer_used: POB lexical decision for אֲשֶׁר נָתַן and לְרָחֵל בִּתּוֹ
  rationale: Naming Bilhah again removes the difficult relative clause and makes each relationship explicit.
- pob_phrase: and she bore these to Jacob
  simplified_phrase: and Bilhah bore these sons to Jacob
  preserved_meaning: Bilhah is the maternal subject, and Jacob is named as the father.
  reasoning_layer_used: POB lexical decisions for וַתֵּלֶד, אֶת אֵלֶּה, and לְיַעֲקֹב
  rationale: Repeating the names and noun prevents unclear pronoun references.
