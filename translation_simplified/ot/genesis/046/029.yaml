  preserved_meaning: Israel remains the covenant name used for Joseph’s father.
  reasoning_layer_used: POB lexical decision for יִשְׂרָאֵל אָבִיו
  rationale: Natural English word order makes the relationship immediately clear.
- pob_phrase: He appeared before him
  simplified_phrase: He presented himself to his father
  preserved_meaning: Joseph made himself visible to his father at their reunion.
  reasoning_layer_used: POB lexical decision and footnote for וַיֵּרָא אֵלָיו
  rationale: Naming both people avoids unclear pronouns and preserves the supported reflexive sense.
- pob_phrase: fell on his neck, and wept on his neck
  simplified_phrase: threw his arms around his father’s neck, and wept against his neck
  preserved_meaning: Joseph embraced his father around the neck and continued weeping in that position.
  reasoning_layer_used: POB lexical decisions for וַיִּפֹּל עַל צַוָּארָיו and וַיֵּבְךְּ עַל צַוָּארָיו
  rationale: The wording explains the Hebrew embrace idiom while preserving the repeated neck image.
