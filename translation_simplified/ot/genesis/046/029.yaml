translation:
  language: en
  text: Then Joseph harnessed his chariot and went up to meet his father Israel in Goshen. He presented himself to his father,[a] threw his arms around his father’s neck, and wept against his neck for a long time.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “appeared before him” or “showed himself to him.”
    reason: lexical_alternative
