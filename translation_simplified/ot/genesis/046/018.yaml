- pob_phrase: These are the sons of Zilpah
  simplified_phrase: These are the sons of Zilpah and their descendants
  preserved_meaning: The group belongs to Zilpah’s family line, beginning with her sons and including their descendants.
  reasoning_layer_used: Lexical decision for בְּנֵי and immediate genealogical context
  rationale: The wording retains “sons” while making clear that not all sixteen were her immediate children.
- pob_phrase: whom Laban gave to Leah his daughter
