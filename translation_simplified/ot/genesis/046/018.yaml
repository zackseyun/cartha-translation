  reasoning_layer_used: Lexical decision for אֲשֶׁר נָתַן לָבָן לְלֵאָה בִתּוֹ
  rationale: Repeating Zilpah’s name replaces the difficult relative clause without changing its referent.
- pob_phrase: 'and she bore these to Jacob: sixteen persons'
  simplified_phrase: Zilpah bore her sons to Jacob. Her family line numbered sixteen people in all.
  preserved_meaning: Zilpah bore children to Jacob, and the listed family line totals sixteen people.
  reasoning_layer_used: Lexical decisions for וַתֵּלֶד, לְיַעֲקֹב, and נָפֶשׁ, with immediate context
  rationale: Separating the births from the total avoids implying that Zilpah personally bore all sixteen.
