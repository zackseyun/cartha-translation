translation:
  language: en
  text: Joseph traveled up to Canaan[a] to bury his father. All Pharaoh’s servants made the journey with him, along with the elders of Pharaoh’s household and all the elders throughout Egypt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Travel from Egypt to Canaan was customarily described as going “up.”
    reason: cultural_note
simplification_decisions:
- pob_phrase: So Joseph went up to bury his father
  simplified_phrase: Joseph traveled up to Canaan to bury his father
  preserved_meaning: Joseph journeyed from Egypt to Canaan for his father’s burial.
  reasoning_layer_used: POB lexical decision and cultural footnote for וַיַּעַל
  rationale: “Traveled up” keeps the Hebrew journey image while making the movement clearer.
- pob_phrase: and with him went up
  simplified_phrase: made the journey with him
  preserved_meaning: The Egyptian delegation accompanied Joseph on the same journey.
  reasoning_layer_used: POB lexical decision for וַיַּעֲלוּ אִתּוֹ
  rationale: The new clause avoids awkward word order without losing their shared travel.
- pob_phrase: all the elders of the land of Egypt
  simplified_phrase: all the elders throughout Egypt
  preserved_meaning: The group included Egypt’s broader national leadership, not only Pharaoh’s household.
  reasoning_layer_used: POB lexical decision for וְכֹל זִקְנֵי אֶרֶץ מִצְרַיִם
  rationale: “Throughout Egypt” expresses the nationwide scope in ordinary English.
