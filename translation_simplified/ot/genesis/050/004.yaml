translation:
  language: en
  text: When the mourning period was over, Joseph spoke to members of Pharaoh’s court. He said, “If you look on me with favor, please tell Pharaoh:”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: When the days of his mourning had passed
  simplified_phrase: When the mourning period was over
  preserved_meaning: The appointed time of mourning had ended before Joseph spoke.
  reasoning_layer_used: Lexical decision for וַיַּעַבְרוּ and יְמֵי בְכִיתוֹ
  rationale: This replaces a formal time expression with ordinary English while keeping the narrative sequence.
- pob_phrase: Pharaoh’s household
  simplified_phrase: members of Pharaoh’s court
  preserved_meaning: Joseph addressed the royal personnel through whom he could approach Pharaoh.
  reasoning_layer_used: Lexical decision for אֶל בֵּית פַּרְעֹה
  rationale: “Court” prevents readers from mistaking the household for Pharaoh’s immediate family.
- pob_phrase: If I have now found favor in your eyes, please speak in Pharaoh’s hearing, saying
  simplified_phrase: If you look on me with favor, please tell Pharaoh
  preserved_meaning: Joseph politely asks the court officials who favor him to convey his words to Pharaoh.
  reasoning_layer_used: Lexical decisions for אִם נָא, מָצָאתִי חֵן בְּעֵינֵיכֶם, and בְּאָזְנֵי פַרְעֹה
  rationale: The wording keeps the image of favorable sight but turns the hearing idiom and repeated quotation formula into natural English.
translation_notes:
  risk_flags:
  - risk: “Court” does not retain the Hebrew house image.
    mitigation: It preserves the POB rationale that the phrase refers to royal household or court personnel.
