translation:
  language: en
  text: When the Canaanites living in the land saw the mourning at Atad’s grain-threshing floor, they said, “This is deep mourning for the Egyptians.” That is why the place was named Abel-mizraim,[a] which lies across the Jordan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Abel-mizraim sounds like “mourning of Egypt,” recalling what the Canaanites said.
    reason: lexical_alternative
  - marker: b
    text: Or “beyond the Jordan”; the wording depends on the geographic point of reference.
    reason: lexical_alternative
