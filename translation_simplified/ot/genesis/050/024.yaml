translation:
  language: en
  text: Joseph said to his brothers, “I am dying. But God will certainly come to your aid.[a] He will bring you up out of this land and into the land he swore to give to Abraham, to Isaac, and to Jacob.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “visit you”; here the Hebrew means that God will give his people decisive attention and act for them.
    reason: lexical_alternative
