  rationale: The direct command is clearer than the formal future construction.
- pob_phrase: the transgression of your brothers and their sin
  simplified_phrase: your brothers for their wrongdoing and sin
  preserved_meaning: The brothers ask forgiveness for their culpable offense and sin.
  reasoning_layer_used: POB lexical wording
  rationale: “Wrongdoing” makes “transgression” understandable while retaining “sin” as a distinct biblical term.
- pob_phrase: when they spoke to him
  simplified_phrase: when they said this to him
  preserved_meaning: Yosef wept upon hearing the quoted appeal.
  reasoning_layer_used: POB base text and discourse context
  rationale: “This” clearly connects his weeping to the message just quoted.
