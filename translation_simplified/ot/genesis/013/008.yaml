simplification_decisions:
- pob_phrase: let there be no strife
  simplified_phrase: let there be no quarrel
  preserved_meaning: Abram politely asks that the conflict cease or be prevented.
  reasoning_layer_used: POB lexical decision for תְהִי מְרִיבָה
  rationale: “Quarrel” expresses interpersonal conflict in more familiar English than “strife.”
- pob_phrase: between me and you, and between my herdsmen and your herdsmen
  simplified_phrase: between you and me, and between my herdsmen and yours
  preserved_meaning: Abram names both his relationship with Lot and the relationship between their livestock workers.
  reasoning_layer_used: POB lexical decisions for repeated בין and רֹעַי ... רֹעֶיךָ
  rationale: The wording reduces repetition while preserving both coordinated spheres of conflict.
- pob_phrase: we are kinsmen
  simplified_phrase: we are relatives
  preserved_meaning: Abram appeals to his broader family relationship with Lot.
  reasoning_layer_used: POB theological decision and applied revision for אֲנָשִׁים אַחִים אֲנָחְנוּ
  rationale: “Relatives” makes the intended kinship clear without implying that they had the same parents.
