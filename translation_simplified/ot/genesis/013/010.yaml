- pob_phrase: lifted up his eyes and saw all the plain of the Jordan
  simplified_phrase: raised his eyes and looked out over the whole plain of the Jordan
  preserved_meaning: Lot directed his gaze across the entire Jordan plain.
  reasoning_layer_used: POB lexical decisions for וַיִּשָּׂא ... עֵינָיו, וַיַּרְא, and כָּל כִּכַּר הַיַּרְדֵּן
  rationale: This keeps the gaze image while expressing it in natural English.
- pob_phrase: that all of it was well watered before Yahweh destroyed Sodom and Gomorrah
  simplified_phrase: Before Yahweh destroyed Sodom and Gomorrah, the whole area was well watered.
  preserved_meaning: The region had abundant water prior to Yahweh’s destruction of the cities.
  reasoning_layer_used: POB lexical decisions for כִּי כֻלָּהּ מַשְׁקֶה and לִפְנֵי שַׁחֵת יְהוָה
  rationale: A separate sentence makes the description and its time setting immediately clear.
- pob_phrase: like the garden of Yahweh, like the land of Egypt, as you go toward Zoar
  simplified_phrase: like Yahweh’s garden and like the land of Egypt, in the direction of Zoar
  preserved_meaning: The fertile plain is compared with Yahweh’s garden and Egypt, with Zoar marking the direction.
  reasoning_layer_used: POB lexical decisions for כְּגַן יְהוָה, כְּאֶרֶץ מִצְרַיִם, and בֹּאֲכָה צֹעַר
  rationale: The wording retains both comparisons and states the directional idiom plainly.
