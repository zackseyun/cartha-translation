translation:
  language: en
  text: Lot raised his eyes and looked out over the whole plain of the Jordan. Before Yahweh destroyed Sodom and Gomorrah, the whole area was well watered. It was like Yahweh’s garden[a] and like the land of Egypt, in the direction of Zoar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Yahweh’s garden” likely points to the lush garden of Eden.
    reason: cross_reference
