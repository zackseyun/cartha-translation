translation:
  language: en
  text: The men who cared for Abram’s livestock quarreled with the men who cared for Lot’s livestock. At that time, the Canaanites and the Perizzites were living in the land.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: there was strife between
  simplified_phrase: quarreled with
  preserved_meaning: The two groups were in active conflict with each other.
  reasoning_layer_used: The lexical decision defines רִיב as conflict or quarreling between two parties.
  rationale: A direct verb makes the conflict easier to understand.
- pob_phrase: the herdsmen of Abram’s livestock
  simplified_phrase: the men who cared for Abram’s livestock
  preserved_meaning: These workers tended Abram’s various domesticated animals.
  reasoning_layer_used: The lexical decisions identify רֹעֵי as animal keepers and מִקְנֵה as livestock broadly.
  rationale: The descriptive wording avoids the less familiar term “herdsmen” without narrowing the animals to sheep.
- pob_phrase: the Canaanite and the Perizzite
  simplified_phrase: the Canaanites and the Perizzites
  preserved_meaning: Both named peoples were living in the land then.
  reasoning_layer_used: The POB footnote states that the singular Hebrew ethnonyms are collective and may be rendered as English plurals.
  rationale: Plural people-group names express the collective sense naturally in modern English.
translation_notes:
  risk_flags:
  - risk: Changing the noun “strife” to the verb “quarreled” slightly reduces its weighty tone.
    mitigation: The rendering still clearly presents active conflict between the two distinct groups.
