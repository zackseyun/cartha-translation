  rationale: “Left Abram” states the separation naturally and makes the pronoun’s referent clear.
- pob_phrase: Please lift up your eyes and look from the place where you are
  simplified_phrase: Please lift your eyes and look out from where you are
  preserved_meaning: Yahweh politely directs Abram to raise his gaze and survey the view from his location.
  reasoning_layer_used: Lexical decisions for שָׂא נָא, עֵינֶיךָ, וּרְאֵה, and the vantage-point phrase
  rationale: “Look out” makes the act of surveying clear while retaining the image of lifting the eyes.
- pob_phrase: northward and southward and eastward and westward
  simplified_phrase: north, south, east, and west
  preserved_meaning: Abram is told to look toward all four compass directions.
  reasoning_layer_used: Lexical decision for the four directional forms
  rationale: Common compass terms preserve each direction without the formal “-ward” endings.
