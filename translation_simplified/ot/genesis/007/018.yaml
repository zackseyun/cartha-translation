  rationale: This avoids implying mere upward movement and keeps the force distinct from the waters’ increase.
- pob_phrase: the ark moved along on the surface of the waters
  simplified_phrase: The ark floated along on the surface of the water
  preserved_meaning: The ark moved upon the floodwater’s surface.
