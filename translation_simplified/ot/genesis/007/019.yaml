simplification_decisions:
- pob_phrase: the waters prevailed exceedingly
  simplified_phrase: the waters grew overwhelmingly strong
  preserved_meaning: The waters became extremely powerful and overpowered the earth.
  reasoning_layer_used: POB lexical decisions for גָּבְרוּ and מְאֹד מְאֹד
  rationale: This expresses overwhelming strength without turning the intensifier into continued upward movement.
- pob_phrase: all the high mountains under all the heavens were covered
  simplified_phrase: they covered all the high mountains under all the heavens
  preserved_meaning: The waters covered every high mountain within the verse’s stated scope.
  reasoning_layer_used: POB lexical decisions for וַיְכֻסּוּ, כָּל הֶהָרִים הַגְּבֹהִים, and תַּחַת כָּל הַשָּׁמָיִם
  rationale: Making the waters the explicit subject clarifies the action while preserving both uses of “all.”
