translation:
  language: en
  text: The waters grew overwhelmingly strong over the earth[a], and they covered all the high mountains under all the heavens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the land,” depending on how broadly the flood’s scope is understood.
