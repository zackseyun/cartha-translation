  reasoning_layer_used: Lexical decision for שָׂרַי אֵשֶׁת אַבְרָם
  rationale: The possessive form connects Sarai naturally to Abram in modern English.
- pob_phrase: Hagar the Egyptian, her female slave ... gave her to Abram her husband as a wife
  simplified_phrase: Hagar, her Egyptian female slave, and gave her to Abram as a wife
  preserved_meaning: Hagar remained Sarai’s enslaved woman even as Sarai gave her to Abram in the status of wife.
  reasoning_layer_used: Lexical and theological decisions on שִׁפְחָתָהּ and לְאִשָּׁה
  rationale: The wording preserves both social realities without recasting Hagar as merely a concubine.
