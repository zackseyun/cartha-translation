translation:
  language: en
  text: He said, “Hagar, Sarai’s servant woman, where have you come from, and where are you going?” She answered, “I am fleeing from my mistress, Sarai.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And he said
  simplified_phrase: He said
  preserved_meaning: The same male speaker continues from the previous verse without being identified again.
  reasoning_layer_used: Theological decision on speaker identification
  rationale: Dropping the opening “And” makes the sentence more natural without adding the speaker’s title.
- pob_phrase: And she said
  simplified_phrase: She answered
  preserved_meaning: Hagar responds directly to the question.
  reasoning_layer_used: Immediate discourse context
  rationale: “Answered” clearly shows the relationship between the question and her reply.
- pob_phrase: from the presence of Sarai my mistress
  simplified_phrase: from my mistress, Sarai
  preserved_meaning: Hagar is escaping from Sarai, the woman who holds authority over her.
  reasoning_layer_used: Lexical decision for מִפְּנֵי and גְּבִרְתִּי
  rationale: The concrete relationship is clearer in modern English without the formal phrase “from the presence of.”
translation_notes:
