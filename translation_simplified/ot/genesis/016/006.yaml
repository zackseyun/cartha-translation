  text: Then Abram said to Sarai, “Your female servant is under your authority. Do to her what seems right to you.” So Sarai treated her harshly,[a] and Hagar ran away from her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “afflicted,” “humiliated,” or “mistreated”; the exact form of harsh treatment is not specified.
    reason: lexical_alternative
