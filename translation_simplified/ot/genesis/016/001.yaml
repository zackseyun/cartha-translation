translation:
  language: en
  text: Sarai was Abram’s wife. She had not given birth to any children for him. She had an Egyptian servant woman[a] named Hagar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term can also be translated “maidservant” or “female servant,” but it describes a woman in bonded service.
    reason: lexical_alternative
