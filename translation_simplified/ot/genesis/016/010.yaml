translation:
  language: en
  text: Then the angel of Yahweh said to her[a], “I will multiply your offspring so greatly that they will be too many to count.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the messenger of Yahweh.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I will greatly multiply your offspring
  simplified_phrase: I will multiply your offspring so greatly
  preserved_meaning: Yahweh will increase her offspring to an extraordinary degree.
  reasoning_layer_used: The lexical decision for הַרְבָּה אַרְבֶּה requires magnitude rather than merely certainty.
  rationale: Moving “greatly” after “offspring” creates a more natural link to the result.
- pob_phrase: so that it cannot be counted because of its multitude
  simplified_phrase: that they will be too many to count
  preserved_meaning: Her collective offspring will be innumerable because of their great number.
  reasoning_layer_used: The lexical decisions for וְלֹא יִסָּפֵר and מֵרֹב identify an idiomatic result of innumerability.
  rationale: The shorter wording states the same result in everyday English.
translation_notes:
  risk_flags:
  - risk: Using “they” shifts from the source’s singular collective grammar.
    mitigation: “Offspring” remains collective, while the plural pronoun is natural modern English.
