translation:
  language: en
  text: This is the family line[a] of Ishmael, Abraham’s son. Hagar, an Egyptian woman enslaved to Sarah, gave birth to him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term is a recurring heading in Genesis and can also mean “generations” or “account.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the generations of Ishmael
  simplified_phrase: the family line of Ishmael
  preserved_meaning: The words introduce Ishmael’s lineage while retaining the sense of a Genesis family heading.
  reasoning_layer_used: POB lexical decision for תֹּלְדֹת and its listed alternative
  rationale: “Family line” is clearer to modern readers than the formulaic “generations.”
- pob_phrase: whom Hagar the Egyptian ... bore to Abraham
  simplified_phrase: Hagar, an Egyptian woman ... gave birth to him
  preserved_meaning: Hagar remains explicitly identified as Ishmael’s Egyptian mother, while Abraham is already named as his father.
  reasoning_layer_used: POB lexical decisions for אֲשֶׁר יָלְדָה and הַמִּצְרִית
  rationale: A separate sentence with “gave birth” is easier to follow than the nested relative clause.
- pob_phrase: Sarah’s slave woman
  simplified_phrase: a woman enslaved to Sarah
  preserved_meaning: Hagar’s female identity and bonded status under Sarah are both retained.
  reasoning_layer_used: POB lexical decision for שִׁפְחַת שָׂרָה
  rationale: The recast phrase sounds natural while avoiding the softer implication of “maidservant.”
