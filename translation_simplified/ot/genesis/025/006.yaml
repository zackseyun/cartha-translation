translation:
  language: en
  text: But Abraham gave gifts to the sons of his secondary wives.[a] While he was still alive, he sent them away from his son Isaac, eastward to the eastern land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionally, “concubines”: women recognized as partners but with lower marital status than wives.'
    reason: cultural_note
simplification_decisions:
- pob_phrase: the sons of his concubines
  simplified_phrase: the sons of his secondary wives
  preserved_meaning: The women had a recognized but lesser marital status.
  reasoning_layer_used: POB lexical decision and HALOT rationale
  rationale: The listed alternative explains the unfamiliar social term in common English.
- pob_phrase: while he was still alive he sent them away
  simplified_phrase: While he was still alive, he sent them away
  preserved_meaning: Abraham separated the sons from Isaac before Abraham died.
  reasoning_layer_used: POB lexical decisions for בְּעוֹדֶנּוּ חַי and וַיְשַׁלְּחֵם
  rationale: A new sentence makes the timing and action easier to follow.
- pob_phrase: eastward to the land of the east
  simplified_phrase: eastward to the eastern land
  preserved_meaning: The sons moved eastward toward an eastern region.
  reasoning_layer_used: POB lexical decisions for קֵדְמָה and אֶל אֶרֶץ קֶדֶם
  rationale: This keeps the explicit direction and destination without awkward repetition.
