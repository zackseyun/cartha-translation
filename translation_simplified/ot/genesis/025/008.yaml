- pob_phrase: in a good old age
  simplified_phrase: at a good old age
  preserved_meaning: Abraham died after a long life viewed positively.
  reasoning_layer_used: Lexical decision for בְּשֵׂיבָה טוֹבָה
  rationale: “At” is more natural modern English for stating a person’s age at death.
- pob_phrase: old and full
  simplified_phrase: He was old, and his life had reached its fullness
  preserved_meaning: The separate descriptions of old age and a life brought to fullness remain distinct.
  reasoning_layer_used: Lexical decisions for זָקֵן and וְשָׂבֵעַ
  rationale: The rewrite explains the otherwise vague word “full” while preserving its image of completeness.
- pob_phrase: and he was gathered to his people
  simplified_phrase: Then he was gathered to his people
  preserved_meaning: The traditional death formula and its unresolved meaning are retained.
  reasoning_layer_used: Theological decision on the Hebrew death formula
  rationale: A new sentence makes the sequence easier to follow without defining the expression as burial or an afterlife reunion.
