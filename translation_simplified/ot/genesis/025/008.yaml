translation:
  language: en
  text: Abraham breathed his last and died at a good old age. He was old, and his life had reached its fullness. Then he was gathered to his people.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Gathered to his people” is a traditional Hebrew expression for death. It may suggest reunion with his dead relatives, but it does not explain exactly what happened.
    reason: cultural_note
