simplification_decisions:
- pob_phrase: These are the generations of Isaac
  simplified_phrase: This is the account of Isaac and his family line
  preserved_meaning: The verse introduces what proceeds from Isaac and his line without limiting the section to descendants alone.
  reasoning_layer_used: POB lexical and theological decisions on the Genesis toledot formula
  rationale: Using both “account” and “family line” makes the broad heading clear in natural English.
- pob_phrase: Isaac, son of Abraham
  simplified_phrase: Isaac was Abraham’s son
  preserved_meaning: Isaac is explicitly identified as Abraham’s son.
  reasoning_layer_used: POB lexical decision for בֶּן אַבְרָהָם
  rationale: A complete sentence is clearer than the compressed heading phrase.
