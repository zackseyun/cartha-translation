translation:
  language: en
  text: Yahweh said to her, “Two nations are in your womb. Two peoples will come from you and separate from each other. One people will be stronger than the other, and the older will serve the younger.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the greater will serve the lesser.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And Yahweh said to her
  simplified_phrase: Yahweh said to her
  preserved_meaning: Yahweh directly gives her the prophecy.
  reasoning_layer_used: POB translation and divine-name lexical decision
  rationale: Removing the opening “And” gives natural modern English while retaining Yahweh’s personal name.
- pob_phrase: two peoples will be separated from within you
  simplified_phrase: Two peoples will come from you and separate from each other
  preserved_meaning: Her descendants will emerge as two distinct peoples.
  reasoning_layer_used: Lexical decisions for מִמֵּעַיִךְ and יִפָּרֵדוּ
  rationale: The active wording clearly expresses both their origin within her and their later division.
- pob_phrase: one people will be stronger than the other
  simplified_phrase: One people will be stronger than the other
  preserved_meaning: The two peoples will not have equal strength.
  reasoning_layer_used: Lexical decisions for וּלְאֹם מִלְאֹם and יֶאֱמָץ
  rationale: This clause is already direct and preserves the comparison without implying how the strength will appear.
interpretive_expansions:
- pob_phrase: will be separated from within you
  rendering: will come from you and separate from each other
  claim: The two peoples originate from her and become distinct from one another.
  evidence:
  - The pregnancy context makes “from within you” refer to coming from her body.
  - The plural separation verb describes the two peoples becoming divided.
  confidence: high
  alternatives_preserved:
  - will be separated from within you
  - will be divided from within you
translation_notes:
  risk_flags:
  - risk: Active wording slightly reduces the passive force of “will be separated.”
    mitigation: “Separate from each other” retains the prophesied division without assigning an outside agent.
  - risk: “Older” is contextual rather than the only possible sense of רַב.
    mitigation: The footnote preserves the viable broader reading “greater ... lesser.”
