translation:
  language: en
  text: As the sun was setting, Abram fell into a deep sleep.[a] Then a great, dark dread came over him.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Abram entered a trance.” The Hebrew may refer to an unusually deep, possibly God-given sleep.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew vividly combines darkness and dread; it may also be translated “a great terror of darkness.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the sun was going down
  simplified_phrase: the sun was setting
  preserved_meaning: Sunset was approaching.
  reasoning_layer_used: Lexical decision for הַשֶּׁמֶשׁ לָבוֹא.
  rationale: “Was setting” expresses the same ongoing action in direct modern English.
- pob_phrase: a deep sleep fell upon Abram
  simplified_phrase: Abram fell into a deep sleep
  preserved_meaning: Abram entered an unusually deep sleep without deciding whether it was a trance.
  reasoning_layer_used: Lexical and theological decisions for תַרְדֵּמָה.
  rationale: The familiar English expression is clearer, while the footnote preserves the possible trance reading.
- pob_phrase: And behold, a great dark dread fell upon him
  simplified_phrase: Then a great, dark dread came over him
  preserved_meaning: The scene vividly presents Abram being overtaken by intense dread joined with darkness.
  reasoning_layer_used: Lexical decisions for וְהִנֵּה, אֵימָה, חֲשֵׁכָה, and נֹפֶלֶת עָלָיו.
  rationale: “Then” avoids an unsupported claim of suddenness, and “came over him” makes the Hebrew idiom natural.
translation_notes:
  risk_flags:
  - risk: “Then” presents the clause as the next event rather than directly reproducing the attention marker.
    mitigation: It serves only as a natural narrative transition and does not claim that the dread arose suddenly.
  - risk: “Dark dread” is an unusual English phrase.
    mitigation: It preserves the Hebrew fusion of darkness and dread, with an alternative supplied in the footnote.
