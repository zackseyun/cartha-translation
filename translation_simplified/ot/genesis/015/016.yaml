translation:
  language: en
  text: In the fourth generation, they will return here, because the Amorites’ evil has not yet reached its full measure.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: for the iniquity of the Amorites
  simplified_phrase: because the Amorites’ evil
  preserved_meaning: The Amorites’ moral wrongdoing is the stated reason for the delay.
  reasoning_layer_used: Lexical decision for עָוֹן and theological decision on delayed judgment
  rationale: “Evil” communicates the ethical sense of “iniquity” in common English without reducing it to subjective guilt.
- pob_phrase: is not yet complete
  simplified_phrase: has not yet reached its full measure
  preserved_meaning: Their evil has not yet reached the divinely appointed point associated with their judgment.
  reasoning_layer_used: Lexical decisions for לֹא שָׁלֵם and עַד הֵנָּה
  rationale: “Reached its full measure” makes the source image of completeness easier to understand while preserving its force.
translation_notes:
  risk_flags:
  - risk: “Full measure” could be read as a broader theory of how divine judgment always works.
    mitigation: The wording remains limited to the Amorites and does not explain the delay beyond the reason stated in this verse.
