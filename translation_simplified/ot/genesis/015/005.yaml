translation:
  language: en
  text: Then he brought him outside and said, “Please look up at the heavens. Count the stars, if you can.” Then he said, “That is how your offspring[a] will be.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “your seed.” The Hebrew word is singular in form but can refer collectively to one’s offspring.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Please look toward the heavens
  simplified_phrase: Please look up at the heavens
  preserved_meaning: He directs the man’s gaze toward the sky while retaining “the heavens.”
  reasoning_layer_used: Lexical decision for הַבֵּט נָא and directional הַשָּׁמַיְמָה
  rationale: “Look up” expresses the direction more naturally in common English.
- pob_phrase: count the stars, if you are able to count them
  simplified_phrase: Count the stars, if you can
  preserved_meaning: The challenge still emphasizes that the stars cannot realistically be counted.
  reasoning_layer_used: Lexical decision for אִם תּוּכַל לִסְפֹּר אֹתָם
  rationale: The shorter conditional avoids needless repetition without weakening the challenge.
- pob_phrase: So shall your offspring be
  simplified_phrase: That is how your offspring will be
  preserved_meaning: His offspring are compared with the stars without resolving the collective-singular wording.
  reasoning_layer_used: Lexical and theological decisions for כֹּה יִהְיֶה זַרְעֶךָ
  rationale: This replaces an archaic formula while preserving the comparison and the key term “offspring.”
translation_notes:
  risk_flags:
  - risk: “That is how” leaves the precise point of comparison implicit.
    mitigation: The immediately preceding command to count the stars preserves the source text’s vivid comparison.
