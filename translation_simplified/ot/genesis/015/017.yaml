translation:
  language: en
  text: The sun had gone down, and it was dark. Then a smoking firepot[a] and a flaming torch passed between the divided animal pieces.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can also mean an oven or furnace.
    reason: lexical_alternative
  - marker: b
    text: These were the animals Abram had cut in two earlier in the covenant ceremony (Genesis 15:10).
    reason: cross_reference
