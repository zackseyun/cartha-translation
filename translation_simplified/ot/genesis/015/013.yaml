translation:
  language: en
  text: 'Then he said to Abram, “You can be certain of this: Your descendants will live as foreigners in a land that is not theirs. The people there will enslave and oppress them for four hundred years.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Know for certain
  simplified_phrase: You can be certain of this
  preserved_meaning: God emphatically assures Abram that this will happen.
  reasoning_layer_used: Lexical decision for יָדֹעַ תֵּדַע
  rationale: The direct assurance expresses the Hebrew emphasis in natural English.
- pob_phrase: your offspring will be sojourners
  simplified_phrase: Your descendants will live as foreigners
  preserved_meaning: Abram’s future family will reside as non-natives outside their own land.
  reasoning_layer_used: Lexical decisions for זַרְעֲךָ and גֵר
  rationale: “Descendants” and “live as foreigners” make the collective family line and foreign residence immediately clear.
- pob_phrase: afflict them
  simplified_phrase: oppress them
  preserved_meaning: They will suffer harsh and degrading treatment.
  reasoning_layer_used: Lexical decision for וְעִנּוּ אֹתָם
  rationale: “Oppress” clearly conveys the contextual force of deliberate affliction.
interpretive_expansions:
- pob_phrase: they will enslave them
  rendering: The people there will enslave ... them
  claim: The enslavers are the people of the foreign land, while Abram’s descendants are the victims.
  evidence:
  - The POB theological decision identifies the foreign land’s inhabitants as the most coherent subject.
  - The plural object refers back to Abram’s descendants.
  - The following context distinguishes the oppressing nation from Abram’s descendants.
  confidence: high
  alternatives_preserved:
  - The Hebrew leaves the oppressors grammatically unspecified.
translation_notes:
