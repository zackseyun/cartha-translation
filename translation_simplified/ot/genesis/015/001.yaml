simplification_decisions:
- pob_phrase: After these things
  simplified_phrase: After these events
  preserved_meaning: The words point back broadly to the preceding narrative happenings.
  reasoning_layer_used: lexical decision and immediate context
  rationale: “Events” makes the narrative reference clearer without narrowing it to spoken words.
- pob_phrase: the word of Yahweh came to Abram in a vision, saying
  simplified_phrase: Yahweh spoke to Abram in a vision
  preserved_meaning: Abram received a direct revelation from Yahweh through a vision.
  reasoning_layer_used: lexical decisions for the revelatory formula, vision, and direct speech
  rationale: The active sentence removes an awkward formula while preserving the revelatory event and its means.
- pob_phrase: Do not fear
  simplified_phrase: Do not be afraid
  preserved_meaning: Yahweh directly commands Abram not to fear.
  reasoning_layer_used: lexical alternative approved by POB
  rationale: “Do not be afraid” is the most immediate wording for common modern readers.
