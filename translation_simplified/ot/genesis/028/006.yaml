translation:
  language: en
  text: Esau saw that Isaac had blessed Jacob and sent him to Paddan-aram to find a wife there. He also saw that during the blessing Isaac had commanded Jacob, “You must not marry a Canaanite woman.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: to take a wife for himself from there
  simplified_phrase: to find a wife there
  preserved_meaning: Isaac sent Jacob to Paddan-aram for the purpose of marrying a woman from that place.
  reasoning_layer_used: lexical decision for לָקַחַת לוֹ מִשָּׁם אִשָּׁה
  rationale: “Find a wife there” expresses the marriage purpose in ordinary modern English.
- pob_phrase: when he blessed him, he commanded him, saying
  simplified_phrase: during the blessing Isaac had commanded Jacob
  preserved_meaning: Isaac gave the command as part of blessing Jacob.
  reasoning_layer_used: lexical decisions for בְּבָרֲכוֹ אֹתוֹ and וַיְצַו עָלָיו לֵאמֹר
  rationale: Naming Isaac and Jacob removes unclear pronouns while keeping the timing and force of the command.
- pob_phrase: You shall not take a wife from the daughters of Canaan
  simplified_phrase: You must not marry a Canaanite woman
  preserved_meaning: Jacob was prohibited from choosing a wife from the Canaanite people.
  reasoning_layer_used: lexical decisions for לֹא תִקַּח and מִבְּנוֹת כְּנָעַן
  rationale: The documented alternatives communicate the prohibition clearly without the unfamiliar marriage idiom.
translation_notes:
  risk_flags:
  - risk: “Canaanite woman” does not retain the literal image “daughters of Canaan.”
    mitigation: The POB lexical record explicitly allows this equivalent and identifies the phrase as referring to Canaanite women.
