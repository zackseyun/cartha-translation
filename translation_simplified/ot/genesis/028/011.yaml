translation:
  language: en
  text: When he reached a certain place, he stopped there for the night because the sun had set. He picked up one of the stones there,[a] placed it under his head, and lay down in that place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “some of the stones there”; the Hebrew can be understood either way.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: came to a certain place and spent the night there
  simplified_phrase: reached a certain place, he stopped there for the night
  preserved_meaning: He arrived at a particular location and stayed overnight.
  reasoning_layer_used: The lexical decisions identify the verb as reaching a location and the stay as overnight.
  rationale: This wording makes the sequence of arriving and stopping immediately clear.
- pob_phrase: one of the stones of the place
  simplified_phrase: one of the stones there
  preserved_meaning: He selected a stone from that location.
  reasoning_layer_used: The lexical decision prefers a single stone while preserving the possible plural reading in a note.
  rationale: Using “there” removes stiff repetition without losing the stone’s connection to the place.
- pob_phrase: put it under his head
  simplified_phrase: placed it under his head
  preserved_meaning: He positioned the stone where his head would rest.
  reasoning_layer_used: The lexical decision explains the Hebrew as the area of the head or a headrest.
  rationale: “Placed” clearly describes the deliberate action in natural English.
translation_notes:
  risk_flags:
  - risk: The Hebrew may refer to some stones rather than one stone.
