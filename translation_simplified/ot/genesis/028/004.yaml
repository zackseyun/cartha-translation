  rendering: God
  claim: God is the one asked to give Abraham's blessing.
  evidence:
  - The preceding blessing invokes God Almighty as the giver.
  - This verse names God as the giver of the land.
  confidence: high
- pob_phrase: the land of your sojournings
  rendering: the land where you live as a foreigner
  claim: The phrase describes residence in land Jacob does not yet possess.
  evidence:
  - The lexical rationale identifies resident-alien dwelling.
  - The purpose clause distinguishes residence from future possession.
  confidence: high
  alternatives_preserved:
  - the land where you sojourn
  - the land of your temporary residence
