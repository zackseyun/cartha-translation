translation:
  language: en
  text: May God give the blessing of Abraham to you and to your offspring along with you, so that you may possess the land where you live as a foreigner, the land God gave to Abraham.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: May he give
  simplified_phrase: May God give
  preserved_meaning: The blessing remains a prayer that God will grant Abraham's covenant blessing.
  reasoning_layer_used: Immediate context and lexical decision on the jussive blessing form
  rationale: Naming God clarifies the pronoun without changing its referent.
- pob_phrase: to you and to your offspring with you
  simplified_phrase: to you and to your offspring along with you
  preserved_meaning: The blessing extends to Jacob and his collective line in relation to him.
  reasoning_layer_used: Lexical decision for לְךָ וּלְזַרְעֲךָ אִתָּךְ
  rationale: “Along with you” retains the Hebrew emphasis in natural English.
- pob_phrase: the land of your sojournings
  simplified_phrase: the land where you live as a foreigner
  preserved_meaning: Jacob resides as a foreigner in the promised land without yet possessing it.
  reasoning_layer_used: Lexical decision for אֶרֶץ מְגֻרֶיךָ and the patriarchal resident-alien motif
  rationale: This concrete wording explains the unfamiliar term “sojournings” without adding a temporal qualifier.
interpretive_expansions:
