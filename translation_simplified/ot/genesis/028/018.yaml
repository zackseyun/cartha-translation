translation:
  language: en
  text: Early in the morning, Jacob got up. He took the stone he had placed near his head, stood it upright as a pillar,[a] and poured oil over its top.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “standing stone.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Jacob rose early in the morning
  simplified_phrase: Early in the morning, Jacob got up
  preserved_meaning: Jacob began these actions early that morning.
  reasoning_layer_used: Lexical decisions for וַיַּשְׁכֵּם and בַּבֹּקֶר
  rationale: “Got up” is more common than “rose,” while the opening phrase keeps the emphasis on the early hour.
- pob_phrase: the stone that he had placed at his head
  simplified_phrase: the stone he had placed near his head
  preserved_meaning: This was the stone positioned by Jacob’s head while he slept.
  reasoning_layer_used: Lexical decision for אֲשֶׁר שָׂם מְרַאֲשֹׁתָיו and immediate context
  rationale: “Near his head” sounds natural without claiming that the stone was directly underneath it.
- pob_phrase: set it up as a pillar
  simplified_phrase: stood it upright as a pillar
  preserved_meaning: Jacob made the stone into a standing pillar.
  reasoning_layer_used: Lexical decisions for וַיָּשֶׂם אֹתָהּ מַצֵּבָה and מַצֵּבָה
  rationale: “Stood it upright” makes the physical action clear while retaining the key term “pillar.”
translation_notes:
  risk_flags:
  - risk: “Pillar” may suggest a shaped architectural column rather than a single upright stone.
    mitigation: The wording “stood it upright” and the footnote “standing stone” clarify the object.
