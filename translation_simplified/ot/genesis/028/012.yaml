  rationale: Two natural sentences preserve the narrative movement and vivid presentation.
- pob_phrase: a stairway was set up on the earth, and its top reached to heaven
  simplified_phrase: a stairway standing on the earth, with its top reaching to heaven
  preserved_meaning: The structure extends from earth toward heaven.
  reasoning_layer_used: Lexical and theological decisions for סֻלָּם, מֻצָּב, and מַגִּיעַ
  rationale: The recast sentence keeps the cosmic vertical image while avoiding stiff passive wording.
- pob_phrase: were ascending and descending on it
  simplified_phrase: going up and coming down on it
  preserved_meaning: God’s angels are moving continuously in both directions along the stairway.
  reasoning_layer_used: Lexical decisions for עֹלִים וְיֹרְדִים and בּוֹ
  rationale: Common motion verbs make the ongoing action immediately clear without changing its referent.
