translation:
  language: en
  text: He had a dream. There before him was a stairway[a] standing on the earth, with its top reaching to heaven. He saw the angels of God going up and coming down on it.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “ladder.” The Hebrew word can mean a structure used for going up and down.
    reason: lexical_alternative
  - marker: b
    text: Or possibly “on him,” though “on it” most naturally refers to the stairway.
    reason: alternative_reading
