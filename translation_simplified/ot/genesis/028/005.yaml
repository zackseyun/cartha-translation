translation:
  language: en
  text: So Isaac sent Jacob away, and Jacob went to Paddan-aram, to Laban. Laban was Rebekah’s brother and the son of Bethuel the Aramean.[a] Rebekah was the mother of Jacob and Esau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Older English translations use “Syrian,” but the Hebrew more precisely says “Aramean.”
    reason: lexical_alternative
