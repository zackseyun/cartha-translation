simplification_decisions:
- pob_phrase: multiply you
  simplified_phrase: give you many descendants
  preserved_meaning: God is asked to increase Jacob’s descendants.
  reasoning_layer_used: POB lexical decision for וְיַרְבֶּךָ
  rationale: This states the family-growth sense intended in the patriarchal blessing.
- pob_phrase: an assembly of peoples
  simplified_phrase: a community of peoples
  preserved_meaning: Jacob’s descendants will form a gathered body made up of multiple peoples.
  reasoning_layer_used: POB lexical decision for לִקְהַל עַמִּים
  rationale: “Community” is familiar English, while “peoples” preserves the source plural.
interpretive_expansions:
- pob_phrase: multiply you
  rendering: give you many descendants
  claim: The promised increase concerns Jacob’s descendants.
  evidence:
  - The POB lexical rationale identifies descendants or numbers as the sense in patriarchal blessings.
  - The resulting community consists of multiple peoples.
  confidence: high
  alternatives_preserved:
  - increase you greatly
  - make you many
translation_notes:
  risk_flags:
  - risk: “Community” may sound less formally assembled than Hebrew קהל.
    mitigation: It retains the collective sense, and “peoples” preserves the plural.
