translation:
  language: en
  text: May God Almighty[a] bless you, make you fruitful, and give you many descendants, so that you may become a community of peoples.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebrew: “El Shaddai,” traditionally translated “God Almighty.”'
