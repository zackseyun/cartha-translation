  text: Look, Yahweh was standing above the stairway.[a] He said, “I am Yahweh, the God of your forefather Abraham and the God of Isaac. I will give this land, where you are lying, to you and your offspring.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “beside him” or “above him,” if the Hebrew pronoun refers to Jacob rather than the stairway.
    reason: alternative_reading
  - marker: b
    text: Hebrew “seed,” meaning offspring viewed collectively.
    reason: lexical_alternative
