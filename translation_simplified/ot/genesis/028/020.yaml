simplification_decisions:
- pob_phrase: made a vow, saying
  simplified_phrase: made this vow
  preserved_meaning: Jacob solemnly committed himself through a formal vow.
  reasoning_layer_used: Lexical decision for נדר and its cognate noun.
  rationale: The colon introduces the vow naturally without the redundant “saying.”
- pob_phrase: will keep me on this way that I am going
  simplified_phrase: watch over me on this journey
  preserved_meaning: Jacob asks God to protect him during his present travels.
  reasoning_layer_used: Lexical decisions for שׁמר and בַּדֶּרֶךְ הַזֶּה.
  rationale: “Watch over” makes the protective sense clear, while “journey” expresses the contextual meaning of “way.”
- pob_phrase: clothing to wear
  simplified_phrase: clothes to wear
  preserved_meaning: Jacob asks God to provide something for him to wear.
  reasoning_layer_used: Lexical decision treating בגד collectively.
  rationale: “Clothes” is more common modern English than the abstract “clothing.”
translation_notes:
  risk_flags:
  - risk: Readers may take “bread” to mean only baked bread.
    mitigation: The footnote preserves the broader lexical possibility of food.
  - risk: The conditional “if” can sound either doubtful or confident.
    mitigation: The main text keeps “if” and does not resolve the POB’s documented theological tension.
