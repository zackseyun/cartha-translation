translation:
  language: en
  text: Look, I am with you. I will watch over you wherever you go, and I will bring you back to this land. I will not leave you until I have done everything I have told you.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And behold, I am with you
  simplified_phrase: Look, I am with you.
  preserved_meaning: God vividly draws Jacob’s attention to his promised presence.
  reasoning_layer_used: POB lexical decision for וְהִנֵּה and theological decision on covenantal presence
  rationale: “Look” keeps the particle’s vivid force in familiar modern English.
- pob_phrase: I will keep you wherever you go
  simplified_phrase: I will watch over you wherever you go
  preserved_meaning: God promises continuing protection wherever Jacob travels.
  reasoning_layer_used: POB lexical decision for וּשְׁמַרְתִּיךָ
  rationale: “Watch over” makes the protective sense of “keep” immediately clear.
- pob_phrase: what I have spoken to you
  simplified_phrase: everything I have told you
  preserved_meaning: God will fulfill all that he has said to Jacob without replacing “spoken” with the narrower “promised.”
  reasoning_layer_used: POB lexical decision for אֵת אֲשֶׁר דִּבַּרְתִּי לָךְ
  rationale: “Everything I have told you” is natural English while preserving the breadth of God’s words.
translation_notes:
  risk_flags:
  - risk: Modern readers may wrongly infer that God will leave Jacob after fulfilling his word.
    mitigation: The wording retains the source’s “until” without making any claim about what happens afterward.
