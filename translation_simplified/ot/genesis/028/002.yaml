  rationale: “Get up” is more natural modern English than “arise.”
- pob_phrase: to the house of Bethuel
  simplified_phrase: to the home of Bethuel
  preserved_meaning: Bethuel’s dwelling or household remains the destination.
  reasoning_layer_used: Lexical decision for בֵּיתָה בְתוּאֵל
  rationale: “Home” communicates the destination more readily than the formal phrase “house of.”
- pob_phrase: take for yourself from there a wife from the daughters of Laban
  simplified_phrase: There, take one of the daughters of Laban ... as your wife
  preserved_meaning: Jacob must obtain his wife there from among Laban’s daughters.
  reasoning_layer_used: Lexical decisions for וְקַח לְךָ, מִשָּׁם, אִשָּׁה, and מִבְּנוֹת לָבָן
  rationale: The recast sentence makes the place, selection, and marriage relationship immediately clear.
