  rationale: The Hebrew 'toledot' functions as a key structural heading in Genesis. In modern English, 'generations' sounds strictly genealogical, whereas 'account of... family' better represents the narrative and familial scope for a general audience.
- preserved_meaning: The Hebrew plural 'dorotav' refers to his contemporaries or the era he lived in. 'Among the people of his time' is a natural modern English equivalent that clearly conveys the comparison between Noah and his corrupt peers, while the literal reading is preserved in a footnote.
