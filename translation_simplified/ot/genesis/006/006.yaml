translation:
  language: en
  text: Yahweh was deeply grieved[a] that he had made human beings[b] on the earth, and he was pained in his heart.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In this context, the Hebrew portrays Yahweh’s deep sorrow over human wickedness; it does not mean that he made a mistaken or unforeseen decision.
    reason: simplification_note
  - marker: b
    text: Hebrew adam here refers collectively to the human race.
    reason: source_note
