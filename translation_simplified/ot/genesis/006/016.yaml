translation:
  language: en
  text: Make a roof for the ark[a], and finish it to within a cubit[b] from the top. Put a door in the side of the ark. Build the ark with lower, second, and third decks[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “window” or “skylight.” The rare Hebrew word may refer to an opening for light rather than a solid roof.
    reason: lexical_alternative
  - marker: b
    text: A cubit is about 18 inches or 45 centimeters. The Hebrew is difficult here; it may describe the roof narrowing at the top or being completed at a cubit near the top.
    reason: cultural_note
  - marker: c
    text: Or “stories” or “levels.”
    reason: lexical_alternative
