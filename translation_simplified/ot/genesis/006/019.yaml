  - By removing the archaic double-preposition construction ('And from... of...'), the sentence flows directly from the verb to the object. Splitting the biological requirement ('They must be male and female') into its own sentence eases cognitive load.
  compression_notes:
  - The redundant 'two of each' was compressed into 'two of every living thing', which carries the identical meaning without awkward phrasing.
