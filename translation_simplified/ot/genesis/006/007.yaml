  text: So Yahweh said[a], “I will blot out man, whom I have created[c], from the face of the ground—from man to livestock to creeping things and to the birds of the heavens—for I am grieved over having made them[b].”
  footnotes:
  - marker: a
    text: Or “humankind.” Hebrew adam can denote humanity collectively; here “man” preserves the representative force and the repetition with the next phrase.
    reason: lexical_alternative
  - marker: b
    text: Or “I regret that I have made them” or “I am sorry that I have made them.” The Hebrew נחם (Niphal) expresses deep sorrow over a prior action; in this context it does not state that God lacked foresight or made a moral error.
    reason: alternative_reading
  - marker: c
    text: “Birds of the heavens” is a literal Hebrew expression, often rendered “birds of the sky.”
    reason: lexical_alternative
