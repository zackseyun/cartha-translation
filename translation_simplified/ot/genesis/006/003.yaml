translation:
  language: en
  text: Then Yahweh said, “My Spirit will not contend with man[a] forever, since he is flesh. Therefore, his days will be one hundred and twenty years.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “My Spirit will not remain in man forever”; the Hebrew verb is difficult and may mean “abide” or “remain” rather than “contend.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: for he is flesh
  simplified_phrase: since he is flesh
  preserved_meaning: The clause still gives the reason for Yahweh’s declaration.
  reasoning_layer_used: POB lexical decision for בְּשַׁגַּם
  rationale: “Since” expresses the same causal link in more familiar English.
- pob_phrase: for he is flesh; therefore his days
  simplified_phrase: since he is flesh. Therefore, his days
  preserved_meaning: The reasoning and resulting limit remain distinct and connected.
  reasoning_layer_used: POB lexical rationale for וְהָיוּ יָמָיו
  rationale: Two sentences make the decree easier to follow without changing its logic.
- pob_phrase: his days will be
  simplified_phrase: his days will be
  preserved_meaning: The wording allows either a limit on human life or the time remaining before judgment.
  reasoning_layer_used: POB audit trail and grounding review
  rationale: Retaining “days” avoids narrowing the debated 120 years to individual lifespan.
