translation:
  language: en
  text: God looked at the earth and saw that it was ruined, because all flesh had ruined its way of life on the earth.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “All flesh” is a Hebrew expression that refers broadly to living beings without specifying its exact scope here. The Hebrew word translated “ruined” can refer to both physical ruin and moral corruption.
    reason: simplification_note
simplification_decisions:
- pob_phrase: And God saw the earth, and behold, it was ruined
  simplified_phrase: God looked at the earth and saw that it was ruined
  preserved_meaning: God observes the earth’s ruined condition, while the vivid attention signaled by “behold” becomes natural English narration.
  reasoning_layer_used: POB lexical decisions for וַיַּרְא, וְהִנֵּה, and נִשְׁחָתָה
  rationale: The recast removes archaic wording but retains the visual emphasis and the broad force of “ruined.”
- pob_phrase: all flesh
  simplified_phrase: all flesh
  preserved_meaning: The broad Hebrew idiom remains unresolved between narrower and wider contextual senses.
  reasoning_layer_used: POB theological decision on כָּל בָּשָׂר
  rationale: The phrase is retained and explained in a note rather than narrowed in the text.
- pob_phrase: had ruined its way
  simplified_phrase: had ruined its way of life
  preserved_meaning: Living beings had brought ruin through their manner of life or conduct.
  reasoning_layer_used: POB lexical decision for דַּרְכּוֹ
  rationale: “Way of life” makes the figurative meaning of “way” clear while preserving the path metaphor.
