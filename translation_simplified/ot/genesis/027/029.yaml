translation:
  language: en
  text: May peoples serve you, and nations bow before you.[a] Rule over your brothers, and may your mother’s sons bow before you. May those who curse you be cursed, and may those who bless you be blessed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “bow before you” means to show honor and submission to a human ruler, not to worship.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Let peoples serve you
  simplified_phrase: May peoples serve you
  preserved_meaning: The blessing calls for peoples to be subject to the person addressed.
  reasoning_layer_used: POB lexical decision for עבד and the blessing context
  rationale: “May” makes the blessing form natural in modern English without weakening its force.
- pob_phrase: Be master over your brothers
  simplified_phrase: Rule over your brothers
  preserved_meaning: He is to hold authority over his brothers.
  reasoning_layer_used: POB lexical decision for הֱוֵה גְבִיר
  rationale: “Rule over” states the intended family authority more directly and avoids the divine title “Lord.”
- pob_phrase: Cursed be those who curse you, and blessed be those who bless you
  simplified_phrase: May those who curse you be cursed, and may those who bless you be blessed
  preserved_meaning: Those who oppose him receive a curse, while those who favor him receive a blessing.
  reasoning_layer_used: POB lexical decisions for the reciprocal curse and blessing formulas
  rationale: Modern clause order makes the paired formulas immediately understandable.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand bowing as divine worship.
    mitigation: The footnote identifies it as honor and submission to a human ruler.
