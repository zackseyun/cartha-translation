translation:
  language: en
  text: Esau held a grudge against Jacob because of the blessing his father had given Jacob. Esau said in his heart, “The time to mourn for my father will soon come. Then I will kill my brother Jacob.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean, “My father’s time of mourning will soon come,” referring to Isaac’s own grief.
    reason: lexical_alternative
