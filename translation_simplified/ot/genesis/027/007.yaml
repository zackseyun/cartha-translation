  rationale: “Tasty meal” is more natural here than the broader phrase “tasty food.”
- pob_phrase: so that I may eat and bless you
  simplified_phrase: Then I will eat it and bless you
  preserved_meaning: Isaac intends to eat the meal and afterward give the blessing.
  reasoning_layer_used: Lexical decisions for וְאֹכֵלָה and וַאֲבָרֶכְכָה
  rationale: Two direct clauses make the intended sequence easier to follow.
- pob_phrase: before Yahweh
  simplified_phrase: in Yahweh’s presence
  preserved_meaning: Isaac will give the blessing consciously before the covenant God.
  reasoning_layer_used: Lexical and theological decisions for לִפְנֵי יְהוָה
  rationale: The clearer English phrase preserves the source image of standing before Yahweh.
