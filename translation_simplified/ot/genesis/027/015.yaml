translation:
  language: en
  text: Then Rebekah took Esau’s finest clothes, which she had in the house, and dressed Jacob in them. Esau was her older son, and Jacob was her younger son.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the choice garments of Esau
  simplified_phrase: Esau’s finest clothes
  preserved_meaning: The clothes were valued or select among Esau’s clothing.
  reasoning_layer_used: The lexical decisions allow “clothes” and recognize “best” as an alternative for “choice.”
  rationale: “Finest clothes” communicates the same idea in familiar modern English.
- pob_phrase: which were with her in the house
  simplified_phrase: which she had in the house
  preserved_meaning: The clothes were in Rebekah’s possession at home.
  reasoning_layer_used: The lexical rationale explicitly identifies this wording as a valid contextual alternative.
  rationale: The active wording is immediately clear without adding the nuance that she stored them there.
- pob_phrase: put them on Jacob her younger son
  simplified_phrase: dressed Jacob in them
  preserved_meaning: Rebekah put Esau’s clothes onto Jacob.
  reasoning_layer_used: The lexical decision lists “dressed” as an equivalent for the Hebrew verb.
  rationale: This avoids an awkward attachment while preserving Rebekah as the one performing the action.
translation_notes:
  risk_flags:
