simplification_decisions:
- pob_phrase: And he said
  simplified_phrase: He replied
  preserved_meaning: Esau responds directly to Isaac’s question.
  reasoning_layer_used: Immediate context and the lexical decision for וַיֹּאמֶר
  rationale: “Replied” makes the exchange easier to follow without changing the speech event.
- pob_phrase: I am your son, your firstborn, Esau
  simplified_phrase: I am Esau, your firstborn son
  preserved_meaning: Esau identifies himself as Isaac’s son and firstborn.
  reasoning_layer_used: Lexical decisions for בִּנְךָ, בְכֹרְךָ, and עֵשָׂו
  rationale: The reordered wording is natural English and retains the important birth-order emphasis.
translation_notes:
  risk_flags:
