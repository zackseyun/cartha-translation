translation:
  language: en
  text: Then Jacob said to his father, “I am Esau, your firstborn. I did what you told me. Please get up, sit down, and eat the meat I hunted, so that you may bless me.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And Jacob said to his father
  simplified_phrase: Then Jacob said to his father
  preserved_meaning: The story advances to Jacob’s reply to his father.
  reasoning_layer_used: Lexical decision for וַיֹּאמֶר
  rationale: “Then” makes the narrative sequence clear in ordinary English.
- pob_phrase: I have done as you told me
  simplified_phrase: I did what you told me
  preserved_meaning: Jacob claims that he followed Isaac’s instructions.
  reasoning_layer_used: Lexical decision for עָשִׂיתִי כַּאֲשֶׁר דִּבַּרְתָּ אֵלַי
  rationale: The simpler clause expresses the same claim naturally.
- pob_phrase: eat from my game
  simplified_phrase: eat the meat I hunted
  preserved_meaning: Jacob presents the food as meat from his own hunt.
  reasoning_layer_used: Lexical decision for וְאָכְלָה מִצֵּידִי
  rationale: “Meat I hunted” explains the less familiar sense of “game.”
translation_notes:
  risk_flags:
  - risk: “The meat I hunted” could sound like the narrator confirms Jacob’s claim.
    mitigation: The wording remains inside Jacob’s direct speech, preserving it as part of his deception.
