translation:
  language: en
  text: What if my father touches me and thinks I am deceiving him?[a] Then I will bring a curse on myself instead of a blessing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean that he will think I am mocking him or acting like a trickster.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Perhaps my father will feel me
  simplified_phrase: What if my father touches me
  preserved_meaning: Jacob fears that Isaac may test him by physical touch.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: The question form expresses Jacob’s anxious uncertainty, while “touches” makes the physical action immediately clear.
- pob_phrase: I will seem to him like a deceiver
  simplified_phrase: thinks I am deceiving him
  preserved_meaning: Isaac may perceive Jacob as someone acting deceptively.
  reasoning_layer_used: POB lexical decision for the perception idiom and participle
  rationale: This recasts the Hebrew perception idiom as direct, natural English without removing the deception sense.
- pob_phrase: and not a blessing
  simplified_phrase: instead of a blessing
  preserved_meaning: The feared curse is the opposite outcome from the blessing Jacob seeks.
  reasoning_layer_used: POB lexical decision for the contrast
  rationale: “Instead of” states the contrast more naturally in modern English.
translation_notes:
  risk_flags:
  - risk: The Hebrew term may suggest mocking or trickery as well as deception.
    mitigation: The footnote preserves these documented lexical alternatives.
