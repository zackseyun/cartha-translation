translation:
  language: en
  text: Rebekah was listening while Isaac spoke to his son Esau. Esau then went out into the open country to hunt game and bring it back.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: when Isaac spoke to Esau his son
  simplified_phrase: while Isaac spoke to his son Esau
  preserved_meaning: Rebekah listened during Isaac’s conversation with Esau.
  reasoning_layer_used: POB lexical decisions for שֹׁמַעַת, בְּדַבֵּר, and בְּנוֹ
  rationale: The ordinary word order and “while” make the overlapping actions immediately clear.
- pob_phrase: and Esau went to the field
  simplified_phrase: Esau then went out into the open country
  preserved_meaning: Esau left for the outdoor area where he would hunt.
  reasoning_layer_used: POB lexical alternatives for וַיֵּלֶךְ and הַשָּׂדֶה
  rationale: “Open country” makes the hunting setting clearer than the potentially agricultural “field.”
- pob_phrase: to hunt game and bring it back
  simplified_phrase: to hunt game and bring it back
  preserved_meaning: Esau intended both to hunt an animal and return with it.
  reasoning_layer_used: POB lexical decisions and applied revision for לָצוּד צַיִד לְהָבִיא
  rationale: This already uses clear English and keeps the two purpose actions distinct.
