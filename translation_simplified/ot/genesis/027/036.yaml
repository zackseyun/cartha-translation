  text: Esau said, “No wonder he is named Jacob![a] He has cheated me twice. He took my rights as the firstborn, and look—now he has taken my blessing too.” Then he asked, “Haven’t you kept any blessing for me?”
  philosophy: optimal-equivalence
  footnotes:
