translation:
  language: en
  text: He also said to Sarah, “I have given your brother a thousand pieces of silver. It is a public payment that protects your honor in the eyes of everyone with you.[a] Before everyone, you are publicly cleared.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “a covering of the eyes for everyone with you.” This difficult image likely refers to public compensation that covers the offense and restores Sarah’s honor.
    reason: lexical_alternative
  - marker: b
    text: The final Hebrew clause is difficult. It may also mean “you are vindicated” or “the matter is settled before everyone.”
    reason: alternative_reading
