simplification_decisions:
- pob_phrase: Did he not himself say to me
  simplified_phrase: Didn't he himself say to me
  preserved_meaning: The question expects an affirmative answer and emphasizes what the man himself said.
  reasoning_layer_used: Lexical decision for הֲלֹא and הוּא
  rationale: The contraction makes the rhetorical question natural without weakening its emphasis.
- pob_phrase: In the integrity of my heart
  simplified_phrase: with an honest heart
  preserved_meaning: Abimelech claims sincere motives regarding this act.
  reasoning_layer_used: Lexical and theological decisions for בְּתָם לְבָבִי
  rationale: “Honest heart” expresses moral sincerity in familiar English without implying total sinlessness.
- pob_phrase: I have done this
  simplified_phrase: I did this
  preserved_meaning: Abimelech refers to the act for which he is defending himself.
  reasoning_layer_used: Lexical decision for עָשִׂיתִי זֹאת
  rationale: The simple past is clearer here and remains within the Hebrew verb's stated range.
