translation:
  language: en
  text: Abraham left that place and traveled toward the Negev.[a] He settled in the region between Kadesh and Shur, and stayed in Gerar as a foreigner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “traveled south.” The Hebrew may refer either to the region called the Negev or more generally to movement southward.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: From there Abraham journeyed
  simplified_phrase: Abraham left that place and traveled
  preserved_meaning: Abraham departed from his previous location and went elsewhere.
  reasoning_layer_used: The lexical decisions identify the verb as setting out or traveling and the adverb as referring to Abraham’s previous location.
  rationale: The new wording expresses the movement in ordinary English.
- pob_phrase: settled between Kadesh and Shur
  simplified_phrase: settled in the region between Kadesh and Shur
  preserved_meaning: Abraham took up residence in the area bounded by the two named places.
  reasoning_layer_used: The lexical rationale treats the phrase as a geographic locator and the verb as taking up residence.
  rationale: Adding “the region” makes the geographic relationship immediately clear.
- pob_phrase: he sojourned in Gerar
  simplified_phrase: stayed in Gerar as a foreigner
  preserved_meaning: Abraham resided in Gerar without belonging there as a native.
  reasoning_layer_used: The lexical decision says the Hebrew verb describes residence as an alien or temporary resident.
  rationale: The wording replaces an unfamiliar biblical term while preserving its foreign-resident sense.
translation_notes:
  risk_flags:
  - risk: “As a foreigner” foregrounds alien status more than the possible temporary duration of the stay.
    mitigation: This follows the POB lexical rationale, which identifies foreign or temporary residence as the verb’s key nuance.
