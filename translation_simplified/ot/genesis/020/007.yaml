translation:
  language: en
  text: So now, return the man’s wife, because he is a prophet. He will pray for you, and you will live. But if you do not return her, know for certain that you will die—you and all who are yours.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression is broad and may also mean “all that belongs to you” or “all you have,” including household members and possessions.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Now then, return the man's wife, for he is a prophet
  simplified_phrase: So now, return the man’s wife, because he is a prophet.
  preserved_meaning: The urgent transition, command, and explicit reason for it remain clear.
  reasoning_layer_used: Lexical decisions for וְעַתָּה, הָשֵׁב, and כִּי נָבִיא הוּא
  rationale: “Because” states the causal link in direct modern English.
- pob_phrase: and he will pray for you, and you will live
  simplified_phrase: He will pray for you, and you will live.
  preserved_meaning: Abraham’s prayer is followed by Abimelech’s survival as its result.
  reasoning_layer_used: Lexical decisions for וְיִתְפַּלֵּל בַּעַדְךָ and וֶחְיֵה
  rationale: A separate sentence keeps the consequential sequence without turning it into purpose.
- pob_phrase: know that you will surely die—you and all who are yours
  simplified_phrase: know for certain that you will die—you and all who are yours
  preserved_meaning: The warning remains certain and extends to those belonging to Abimelech’s household.
  reasoning_layer_used: Lexical and theological decisions for מוֹת תָּמוּת and כָל אֲשֶׁר לָךְ
  rationale: The wording places the certainty in a familiar English expression while retaining the broad scope.
translation_notes:
  risk_flags:
  - risk: “All who are yours” may sound limited to people even though the Hebrew can also include possessions.
    mitigation: The footnote preserves the broader lexical possibilities.
