translation:
  language: en
  text: You have searched through everything I own. What have you found that belongs to your household? Put it here in front of my brothers and your brothers, and let them decide between the two of us.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Since you have searched through all my goods
  simplified_phrase: You have searched through everything I own.
  preserved_meaning: Laban has thoroughly searched Jacob’s movable possessions.
  reasoning_layer_used: The lexical decision treats “goods” as possessions and the verb as a thorough search.
  rationale: A direct sentence and “everything I own” make the accusation immediately clear.
- pob_phrase: what have you found of all the goods of your house?
  simplified_phrase: What have you found that belongs to your household?
  preserved_meaning: Jacob asks whether Laban found any property belonging to Laban’s household.
  reasoning_layer_used: The applied revision identifies the Hebrew preposition as partitive rather than locational.
  rationale: The ownership relationship is clearer than the awkward phrase “goods of your house.”
- pob_phrase: Set it here before my brothers and your brothers
  simplified_phrase: Put it here in front of my brothers and your brothers
  preserved_meaning: Any allegedly stolen item must be displayed publicly before both groups of witnesses.
  reasoning_layer_used: The lexical decisions explain “set” as public production and “before” as presence in witnesses’ sight.
  rationale: “Put” and “in front of” use ordinary English while preserving the public challenge.
interpretive_expansions:
- pob_phrase: of all the goods of your house
  rendering: that belongs to your household
  claim: The disputed goods are property owned by Laban’s household, not goods located in his house.
  evidence:
  - The applied revision says the Hebrew preposition is partitive and marks the items being sought.
  - The lexical rationale identifies the phrase as property belonging to Laban’s household.
  confidence: high
  alternatives_preserved:
  - from all your household goods
  - among all the goods of your household
translation_notes:
  risk_flags:
  - risk: “Brothers” may refer more broadly to male relatives or kinsmen in this setting.
    mitigation: The main text retains “brothers” because the POB lexical decision deliberately preserves the ordinary familial term.
  - risk: The record alternates between “judge” and “decide” in its revision history.
    mitigation: The draft uses “decide,” following the stated chosen lexical rendering and latest revision summary while retaining the arbitral sense.
