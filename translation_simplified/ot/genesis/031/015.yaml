simplification_decisions:
- pob_phrase: Are we not regarded by him as foreigners?
  simplified_phrase: Doesn’t he treat us like outsiders?
  preserved_meaning: Their father treats them as people who do not belong to his family.
  reasoning_layer_used: POB lexical decisions for נָכְרִיּוֹת and נֶחְשַׁבְנוּ לוֹ
  rationale: The active wording and “outsiders” make the family rejection clear in natural English.
- pob_phrase: has indeed completely consumed our money
  simplified_phrase: has used up every bit of our money
  preserved_meaning: He exhausted all the money, with the Hebrew emphasis on completeness retained.
  reasoning_layer_used: POB lexical decisions for וַיֹּאכַל גַּם אָכוֹל and אֶת כַּסְפֵּנוּ
  rationale: “Used up every bit” expresses total depletion more plainly while the footnote preserves the eating image.
