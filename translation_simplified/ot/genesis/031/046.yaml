translation:
  language: en
  text: Then Jacob told his brothers[a], “Gather some stones.” They gathered the stones and piled them into a heap. Then they ate there beside it.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Brothers” may also mean Jacob’s male relatives or companions, not only his literal brothers.
    reason: cultural_note
  - marker: b
    text: Or “they ate there on the heap.”
    reason: lexical_alternative
