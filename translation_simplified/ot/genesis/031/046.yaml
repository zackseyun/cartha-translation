  reasoning_layer_used: POB lexical decision for לְאֶחָיו and immediate context
  rationale: “Told” naturally introduces the command while retaining “brothers” and its broader footnoted sense.
- pob_phrase: took stones and made a heap
  simplified_phrase: gathered the stones and piled them into a heap
  preserved_meaning: The men collected stones and formed a stone heap.
  reasoning_layer_used: POB lexical decisions for לִקְטוּ, אֲבָנִים, and גָל
  rationale: The rewrite makes the physical action clear while preserving the stone-heap image.
- pob_phrase: they ate there by the heap
  simplified_phrase: they ate there beside it
  preserved_meaning: They ate near the heap they had built.
  reasoning_layer_used: POB lexical decision for עַל הַגָּל
  rationale: “Beside it” is plain English, while the possible meaning “on the heap” remains in a footnote.
