translation:
  language: en
  text: “If your gods are found with anyone, that person will not live. In front of our male relatives,[a] point out anything I have that belongs to you, and take it.” Jacob did not know that Rachel had stolen those gods.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “our brothers,” referring here to the wider group of male relatives or kinsmen present.
    reason: cultural_note
  - marker: b
    text: These were Laban’s household gods.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Whoever is found with your gods shall not live
  simplified_phrase: If your gods are found with anyone, that person will not live
  preserved_meaning: Anyone discovered possessing the gods faces Jacob’s solemn death sentence or curse.
  reasoning_layer_used: Lexical decisions for עִם אֲשֶׁר, תִּמְצָא, and לֹא יִחְיֶה
  rationale: The conditional form is easier to follow while preserving the formula’s unresolved force.
- pob_phrase: In the presence of our brothers
  simplified_phrase: In front of our male relatives
  preserved_meaning: The inspection is to happen openly before the assembled male kin.
  reasoning_layer_used: Lexical decision and cultural footnote for נֶגֶד אַחֵינוּ
  rationale: “Male relatives” conveys the wider contextual sense without losing the source phrase’s masculine scope.
- pob_phrase: identify what of yours is with me, and take it for yourself
  simplified_phrase: point out anything I have that belongs to you, and take it
  preserved_meaning: Jacob invites Laban to identify and reclaim any property of his among Jacob’s possessions.
  reasoning_layer_used: Lexical decisions for הַכֶּר לְךָ, מָה עִמָּדִי, and וְקַח לָךְ
  rationale: The rewrite makes the Hebrew ellipsis clear in ordinary English without changing Jacob’s challenge.
translation_notes:
  risk_flags:
  - risk: “Will not live” may sound only predictive to some readers.
    mitigation: The wording preserves POB’s ambiguity rather than making the formula specifically legal, volitional, or predictive.
  - risk: “Your gods” could be mistaken for a general statement about Laban’s religion.
    mitigation: The footnote identifies the stolen objects as his household gods while retaining the source wording in the text.
