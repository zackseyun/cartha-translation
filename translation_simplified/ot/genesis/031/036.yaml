translation:
  language: en
  text: Then Jacob became angry and argued with Laban. He said to him, “What offense have I committed? What sin have I committed that you chased after me so fiercely?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “pursued me.” The Hebrew verb can suggest a burning, intense pursuit.
