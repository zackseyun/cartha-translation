translation:
  language: en
  text: If the God of my father—the God of Abraham and the Fear of Isaac[a]—had not been with me, you would certainly have sent me away by now with nothing. But God saw how I had suffered and how hard I had worked. Last night he gave his judgment.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the One whom Isaac fears.” The Hebrew literally says “the Fear of Isaac,” an unusual title for God.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also mean that God rebuked Laban, as in the warning God gave him the previous night.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: surely by now you would have sent me away empty-handed
  simplified_phrase: you would certainly have sent me away by now with nothing
  preserved_meaning: Laban would have dismissed Jacob without wages or possessions.
  reasoning_layer_used: Lexical decisions for כִּי עַתָּה and רֵיקָם.
  rationale: “With nothing” makes the result immediately clear while retaining the emphatic timing.
- pob_phrase: my affliction and the labor of my hands
  simplified_phrase: how I had suffered and how hard I had worked
  preserved_meaning: God saw both Jacob’s mistreatment and his strenuous labor.
  reasoning_layer_used: Lexical decisions for עָנְיִי and יְגִיעַ כַּפַּי.
  rationale: The abstract nouns become direct verbal clauses in natural English.
- pob_phrase: he judged last night
  simplified_phrase: Last night he gave his judgment
  preserved_meaning: God acted as judge in Jacob’s dispute with Laban.
  reasoning_layer_used: POB main text and the theological decision for וַיּוֹכַח.
  rationale: The recast wording clarifies the judicial action without adding an explicit object.
interpretive_expansions:
- pob_phrase: the labor of my hands
  rendering: how hard I had worked
  claim: The hand image refers to Jacob’s strenuous personal labor.
  evidence:
  - The lexical rationale identifies the phrase as a common expression for hard work.
  confidence: high
  alternatives_preserved:
  - the labor of my hands
  - the toil of my hands
- pob_phrase: he judged last night
  rendering: he gave his judgment
  claim: The verb describes God’s judicial intervention in the dispute.
  evidence:
  - The lexical rationale notes the verb’s deciding, reproving, and vindicating senses.
  - Genesis 31:24 supplies the immediate setting of God’s warning to Laban.
  confidence: moderate
  alternatives_preserved:
  - he judged
  - he rebuked you
  - he decided between us
translation_notes:
  risk_flags:
  - risk: “Fear of Isaac” may sound as though Isaac’s emotion, rather than God, is being named.
    mitigation: The title is retained for theological texture and explained in footnote a.
  - risk: “Gave his judgment” may understate the possible sense that God directly rebuked Laban.
    mitigation: Footnote b preserves the contextual reproof reading without forcing an object into the main text.
