translation:
  language: en
  text: May Abraham’s God and Nahor’s god,[a] the god of their father, judge between us. Then Jacob swore by the Fear of his father Isaac.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Hebrew may instead identify all these titles with the same God: “Abraham’s God and Nahor’s God, the God of their father.”'
    reason: alternative_reading
  - marker: b
    text: “The Fear of his father Isaac” is an unusual title for God that uses the word “fear” or “dread.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the God of Abraham and the god of Nahor
  simplified_phrase: Abraham’s God and Nahor’s god
  preserved_meaning: The different capitalization keeps the possible distinction between the deities invoked.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Possessive wording is more natural while preserving the theological tension.
- pob_phrase: may ... judge
  simplified_phrase: May ... judge
  preserved_meaning: The deity or deities are invoked to act as covenant judge between the two men.
  reasoning_layer_used: POB lexical decision and covenant context
  rationale: Keeping “judge” preserves the source verb’s judicial force in clear English.
- pob_phrase: And Jacob swore
  simplified_phrase: Then Jacob swore
  preserved_meaning: Jacob next makes his oath using his distinctive divine title.
  reasoning_layer_used: POB lexical alternatives and narrative sequence
  rationale: “Then” clearly marks the narrative sequence without implying a stronger connection.
translation_notes:
  risk_flags:
  - risk: Readers may assume the lowercase references certainly denote a different deity.
    mitigation: Footnote a preserves the possible identification of all the titles with the same God.
  - risk: The title “Fear” may sound like an emotion rather than a divine title.
    mitigation: Footnote b explains the unusual title while preserving its source-language image.
