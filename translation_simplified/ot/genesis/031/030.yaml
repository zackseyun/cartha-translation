translation:
  language: en
  text: Now, you did leave because you deeply longed to be back at your father’s home. But why did you steal my gods?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “my household gods.” In this context, Laban means the idols kept by his household.
