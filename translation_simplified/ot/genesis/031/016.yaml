translation:
  language: en
  text: All the wealth God has taken away from our father belongs to us and our children. So now do everything God has told you to do.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb can also mean “rescued” or “delivered,” but here it describes God taking the wealth from Laban and giving it to Jacob’s household.
    reason: lexical_alternative
