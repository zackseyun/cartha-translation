  preserved_meaning: The wealth removed from Laban now rightly belongs to Jacob’s household.
  reasoning_layer_used: POB lexical and theological decisions on הִצִּיל and possession
  rationale: Removing the opening connector and repeated words makes the reason direct while retaining God’s transfer of the wealth.
- pob_phrase: whatever God has said to you, do
  simplified_phrase: do everything God has told you to do
  preserved_meaning: Jacob should carry out all that God commanded him.
