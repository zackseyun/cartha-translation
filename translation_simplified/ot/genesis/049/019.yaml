translation:
  language: en
  text: A band of raiders will attack Gad, but he will raid them at their heels.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In Hebrew, the words for “Gad,” “band of raiders,” and “raid” sound alike.
    reason: lexical_alternative
  - marker: b
    text: “At their heels” may mean attacking them from behind or pursuing them from the rear.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Gad—a raiding band will raid him
  simplified_phrase: A band of raiders will attack Gad
  preserved_meaning: Gad is the target of a hostile raid by an organized band.
  reasoning_layer_used: The lexical decisions identify גְּדוּד as a raiding band and יְגוּדֶנּוּ as hostile raiding.
  rationale: The direct word order makes the action immediately clear while the footnote preserves the Hebrew wordplay.
- pob_phrase: but he will raid at their heels
  simplified_phrase: but he will raid them at their heels
  preserved_meaning: Gad reverses the attack and raids the enemy from or upon their rear.
  reasoning_layer_used: The lexical decisions preserve the repeated verb and the heel image while allowing a collective object.
  rationale: Adding “them” makes the reciprocal action clear without resolving the final phrase too narrowly.
translation_notes:
  risk_flags:
  - risk: Using “attack” in the first clause weakens the audible repetition of “raid.”
    mitigation: The second clause retains “raid,” and footnote a explains the fuller Hebrew wordplay.
  - risk: Modern readers may take “at their heels” only as close pursuit.
    mitigation: Footnote b preserves both pursuit from the rear and attack from behind.
