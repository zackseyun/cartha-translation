translation:
  language: en
  text: 'Then he gave them this command: “I will soon be gathered to my people.[a] Bury me with my ancestors in the cave in the field of Ephron the Hittite.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “I am being gathered to my people.” This Hebrew expression refers to approaching death and being reunited with one’s people in death.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: commanded them and said to them
  simplified_phrase: gave them this command
  preserved_meaning: He solemnly directed them rather than merely offering advice.
  reasoning_layer_used: Lexical decision for וַיְצַו and the common speech formula
  rationale: This removes a repetitive speech formula while keeping the force of a command.
- pob_phrase: I am about to be gathered to my people
  simplified_phrase: I will soon be gathered to my people
  preserved_meaning: His death is near, and the image points toward reunion with his people in death.
  reasoning_layer_used: Lexical and theological decisions for נֶאֱסָף אֶל־עַמִּי
  rationale: “Will soon” expresses imminence naturally while preserving the Hebrew image.
- pob_phrase: with my fathers in the cave that is in the field of Ephron
  simplified_phrase: with my ancestors in the cave in the field of Ephron
  preserved_meaning: He asks to be buried alongside his forefathers in the cave identified with Ephron’s field.
  reasoning_layer_used: Lexical decisions for אֶל־אֲבֹתָי and אֲשֶׁר בִּשְׂדֵה עֶפְרוֹן
  rationale: “Ancestors” clarifies the family relationship, while “field of Ephron” avoids an unsupported ownership claim.
translation_notes:
  risk_flags:
  - risk: “Gathered to my people” may be unfamiliar to modern readers.
    mitigation: The footnote explains its death-and-reunion sense without replacing the source image.
  - risk: “Ancestors” is broader than the literal wording “fathers.”
    mitigation: The burial context and POB rationale show that the phrase refers to Jacob’s forefathers.
