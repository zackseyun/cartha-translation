translation:
  language: en
  text: Your father’s blessings are greater than the blessings of my parents. They reach to the farthest limits of the ancient hills.[a] May these blessings rest on Joseph’s head, on the crown of the head of the one set apart from his brothers.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the everlasting hills.”
    reason: lexical_alternative
  - marker: b
    text: Or “the prince among his brothers”; the Hebrew means “the one consecrated or set apart from his brothers.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: have prevailed beyond
  simplified_phrase: are greater than
  preserved_meaning: The father’s blessings surpass those of his parents.
  reasoning_layer_used: Lexical decision for גָּבְרוּ with עַל
  rationale: The listed alternative states the comparison in immediate, natural English.
- pob_phrase: to the utmost bounds of the ancient hills
  simplified_phrase: They reach to the farthest limits of the ancient hills
  preserved_meaning: The blessings extend to the furthest reaches pictured by the age-old hills.
  reasoning_layer_used: Lexical decisions for עַד, תַּאֲוַת, and גִּבְעֹת עוֹלָם
  rationale: A separate sentence makes the difficult poetic image of extent easier to follow.
- pob_phrase: May they be on the head of Joseph
  simplified_phrase: May these blessings rest on Joseph’s head
  preserved_meaning: The blessing is pronounced as resting upon Joseph.
  reasoning_layer_used: Lexical decisions for תִּהְיֶיןָ and לְרֹאשׁ
  rationale: Naming the blessings removes an unclear pronoun while retaining the blessing formula.
translation_notes:
  risk_flags:
  - risk: The ancient-hills phrase also permits the traditional wording “everlasting hills.”
    mitigation: Footnote a preserves this lexical alternative beside the phrase it qualifies.
  - risk: “Set apart” may obscure Joseph’s distinguished status among his brothers.
    mitigation: Footnote b preserves “prince” while the text retains the chosen consecration sense.
