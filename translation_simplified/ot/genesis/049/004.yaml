  text: Unstable as water, you will not keep the highest place, because you went up to your father’s bed. Then you defiled it—he went up to my bed.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew abruptly shifts to “he went up.” This may be an exclamation about Reuben; more smoothly, “Then you defiled my bed—you went up to it.”
