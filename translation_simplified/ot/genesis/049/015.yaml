translation:
  language: en
  text: He saw that it was a good place to rest[a] and that the land was pleasant. So he bent his shoulder to carry the load and became a servant who was forced to work.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “that rest was good.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also mean that he became a slave laborer or a servant required to pay tribute.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the resting place was good
  simplified_phrase: it was a good place to rest
  preserved_meaning: The concrete resting place is desirable, while the note preserves the possible abstract sense of rest.
  reasoning_layer_used: Lexical decision for מְנֻחָה and its contextual parallel with the land
  rationale: The verbal form “a place to rest” is easier to understand than the abstract noun phrase.
- pob_phrase: he bent his shoulder to bear
  simplified_phrase: he bent his shoulder to carry the load
  preserved_meaning: The bodily image of lowering the shoulder under a burden remains intact.
  reasoning_layer_used: Lexical decisions for וַיֵּט שִׁכְמוֹ and לִסְבֹּל
  rationale: Naming the implied load makes the Hebrew burden-bearing image immediately clear.
- pob_phrase: became a servant for forced labor
  simplified_phrase: became a servant who was forced to work
  preserved_meaning: He entered compelled service without defining it as chattel slavery.
  reasoning_layer_used: Lexical and theological decisions for לְמַס עֹבֵד
  rationale: A relative clause expresses forced labor in natural common English.
translation_notes:
  risk_flags:
  - risk: The exact form of compelled service is debated.
    mitigation: The main text follows the preferred forced-labor sense, while the footnote preserves tributary service and slave labor as alternatives.
