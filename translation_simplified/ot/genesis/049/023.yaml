translation:
  language: en
  text: The archers attacked him bitterly. They shot at him[a] and hated him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “They made his life bitter, fought against him, and hated him—the archers.” The Hebrew translated “shot at him” is difficult and may more generally mean “fought against him” or “attacked him.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: They bitterly attacked him, and shot at him, and hated him—the archers.
  simplified_phrase: The archers attacked him bitterly. They shot at him and hated him.
  preserved_meaning: The archers are the hostile attackers, and all three actions remain distinct.
  reasoning_layer_used: POB translation and lexical decisions for the three hostile verbs and the archers idiom
  rationale: Moving the attackers to the beginning and dividing the line into two sentences makes the poetic wording immediately clear.
- pob_phrase: the archers
  simplified_phrase: The archers
  preserved_meaning: The idiom literally involving possessors of arrows still identifies people who use bows and arrows.
  reasoning_layer_used: POB lexical decisions for בַּעֲלֵי חִצִּים
  rationale: The familiar word “archers” preserves the arrow image without the opaque literal phrase “owners of arrows.”
translation_notes:
  risk_flags:
  - risk: Putting “the archers” first may reduce the dramatic force of naming them at the end.
    mitigation: The clearer order preserves their role as the agents of all three hostile actions.
  - risk: “Shot at him” is not the only possible meaning of the difficult Hebrew verb.
    mitigation: The footnote preserves the broader alternatives documented by POB.
