translation:
  language: en
  text: Zebulun will live beside the seas.[a] He will be along a coast used by ships,[b] and the edge of his territory will be toward Sidon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “seas”; it can also be translated “the sea.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew more literally says “by the shore of ships”; it may describe a haven for ships.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew image is “his flank” and may mean his side, border, or farthest reaches.
    reason: lexical_alternative
