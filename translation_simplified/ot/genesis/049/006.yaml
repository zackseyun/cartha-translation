translation:
  language: en
  text: May my soul take no part in their council[a], and may my honor not be linked to their assembly. In their anger they killed a man, and in their willfulness they crippled an ox by cutting its leg tendons.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “their secret council”; the Hebrew may refer to a confidential gathering.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew is traditionally read “ox,” though some interpret the consonants as “wall.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Let my soul not enter their council
  simplified_phrase: May my soul take no part in their council
  preserved_meaning: Jacob strongly rejects involvement in their deliberations while retaining the poetic image of his soul.
  reasoning_layer_used: POB lexical decision for תָּבֹא נַפְשִׁי
  rationale: “Take no part” states nonparticipation more naturally than a soul physically entering a council.
- pob_phrase: in their self-will
  simplified_phrase: in their willfulness
  preserved_meaning: Their violent act arose from willful, unrestrained intent.
  reasoning_layer_used: POB lexical decision for וּבִרְצֹנָם and grounding review
  rationale: “Willfulness” is understandable and preserves the clause’s negative moral force.
- pob_phrase: they hamstrung an ox
  simplified_phrase: they crippled an ox by cutting its leg tendons
  preserved_meaning: They deliberately maimed the animal in the concrete manner conveyed by the Hebrew verb.
  reasoning_layer_used: POB lexical decisions for עִקְּרוּ and שׁוֹר
  rationale: The wording explains “hamstrung” while preserving its violent physical image.
translation_notes:
  risk_flags:
