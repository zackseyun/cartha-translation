translation:
  language: en
  text: Until Shiloh comes,[a] the scepter will remain with Judah, and the ruler’s staff will remain between his feet. The peoples will obey him.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word rendered “Shiloh” is difficult. It may instead mean “the one who has the right to rule,” and it has also been understood as a title, a place name, or a reference to tribute.
    reason: alternative_reading
  - marker: b
    text: The Hebrew may also mean that the peoples will gather to him or submit to him.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The scepter will not depart from Judah
  simplified_phrase: the scepter will remain with Judah
  preserved_meaning: Judah continues to possess the emblem and authority of royal rule.
  reasoning_layer_used: Lexical decision for שֵׁבֶט and royal/messianic theological decision
  rationale: The positive wording states the same continuity more directly while retaining the royal image.
- pob_phrase: nor the ruler’s staff from between his feet
  simplified_phrase: and the ruler’s staff will remain between his feet
  preserved_meaning: The concrete image of the ruler’s staff staying between Judah’s feet remains intact.
  reasoning_layer_used: Lexical decisions for מְחֹקֵק and מִבֵּין רַגְלָיו
  rationale: The clause is recast into ordinary English without replacing the image with an interpretation about descendants.
- pob_phrase: and to him will be the obedience of the peoples
  simplified_phrase: The peoples will obey him
  preserved_meaning: Multiple peoples will yield obedience to the coming royal figure.
  reasoning_layer_used: Lexical decisions for וְלוֹ, יִקְּהַת, and עַמִּים
  rationale: The abstract construction becomes a clear active sentence while the debated alternatives remain in a footnote.
translation_notes:
  risk_flags:
  - risk: Moving “until Shiloh comes” to the front could make the poetic order less visible.
    mitigation: Its initial position clearly applies the time limit to both royal images.
  - risk: Readers may assume that “Shiloh” has one certain meaning.
    mitigation: Footnote a preserves the documented uncertainty and major alternatives.
