translation:
  language: en
  text: After Jacob finished giving his sons his commands, he pulled his feet up onto the bed. Then he breathed his last and was gathered to his people.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Was gathered to his people” is a Hebrew expression connected with death and reunion with one’s people; it means more than being buried.
    reason: cultural_note
