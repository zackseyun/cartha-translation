simplification_decisions:
- pob_phrase: your hand will be on the neck of your enemies
  simplified_phrase: Your hand will be on your enemies’ necks
  preserved_meaning: The concrete hand-and-neck image still conveys Judah’s mastery over his enemies without specifying how he overcomes them.
  reasoning_layer_used: POB lexical decisions for יָדְךָ and בְּעֹרֶף אֹיְבֶיךָ
  rationale: The natural plural phrasing preserves the source image while avoiding the unsupported action “seize.”
- pob_phrase: the sons of your father
  simplified_phrase: your brothers
  preserved_meaning: The phrase still refers specifically to Jacob’s sons, Judah’s brothers.
  reasoning_layer_used: POB lexical rationale for בְּנֵי אָבִיךָ and immediate family context
  rationale: The direct family relationship is clearer than the Hebrew idiom in modern English.
- pob_phrase: will bow down to you
  simplified_phrase: will bow down before you
  preserved_meaning: Judah’s brothers will show him submission and honor rather than worship him as divine.
  reasoning_layer_used: POB theological decision on יִשְׁתַּחֲווּ לְךָ
  rationale: “Before you” naturally describes homage while preserving the physical act of bowing.
