translation:
  language: en
  text: They told him, “Joseph is still alive! He rules over all Egypt.” But he was stunned, and his heart went numb because he did not believe them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression may also mean “his heart fainted”; it describes his stunned, weakened reaction.
    reason: lexical_alternative
