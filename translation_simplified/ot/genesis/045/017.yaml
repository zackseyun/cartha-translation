  rationale: The rewrite replaces a nested command formula with natural instructional language.
- pob_phrase: load your beasts
  simplified_phrase: Load your animals
  preserved_meaning: The brothers must load the domestic animals used to carry their goods.
  reasoning_layer_used: POB lexical decision for בְּעִירְכֶם
  rationale: “Animals” is clear modern English and avoids the archaic sound of “beasts.”
- pob_phrase: go; return to the land of Canaan
  simplified_phrase: Then leave and return to the land of Canaan
  preserved_meaning: The brothers are to depart from Egypt and arrive back in Canaan.
