translation:
  language: en
  text: So now, you were not the ones who sent me here; God did. He has made me a father to Pharaoh,[a] master over his whole household, and ruler over all the land of Egypt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, like a chief counselor, patron, or benefactor to Pharaoh.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: it was not you who sent me here, but God
  simplified_phrase: you were not the ones who sent me here; God did
  preserved_meaning: The strong contrast emphasizes God's decisive purpose without denying the brothers' real action.
  reasoning_layer_used: theological decision and Hebrew emphasis
  rationale: Two direct clauses make the contrast easier to follow while preserving its force.
- pob_phrase: lord over all his house
  simplified_phrase: master over his whole household
  preserved_meaning: Joseph received delegated authority over Pharaoh's household and estate.
  reasoning_layer_used: lexical decision for אָדוֹן and בֵּית
  rationale: “Master” and “household” communicate the scope of Joseph's authority more clearly.
- pob_phrase: ruler over all the land of Egypt
  simplified_phrase: ruler over all the land of Egypt
  preserved_meaning: Joseph exercises rule throughout Egypt's territory.
  reasoning_layer_used: lexical decision for מֹשֵׁל and אֶרֶץ מִצְרָיִם
  rationale: The wording is already clear and keeps the source's territorial emphasis.
interpretive_expansions:
- pob_phrase: all his house
  rendering: his whole household
  claim: “House” refers broadly to Pharaoh's household and estate, not merely a building.
  evidence:
  - The POB lexical rationale explicitly says that “house” includes the household and estate.
  confidence: high
  alternatives_preserved:
