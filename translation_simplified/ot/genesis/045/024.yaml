translation:
  language: en
  text: Then he sent his brothers on their way. As they left, he told them, “Do not quarrel[a] along the way.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “Do not become agitated, angry, or afraid.”
    reason: lexical_alternative
