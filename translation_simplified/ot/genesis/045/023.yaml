translation:
  language: en
  text: He also sent his father ten donkeys loaded with some of the best things Egypt had to offer[a]. He sent ten female donkeys as well, loaded with grain, bread, and food supplies for his father’s journey.
  philosophy: optimal-equivalence
  footnotes:
