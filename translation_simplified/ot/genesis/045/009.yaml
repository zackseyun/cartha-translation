  preserved_meaning: Joseph introduces the exact message his brothers are to report to their father.
  reasoning_layer_used: POB lexical decision for כֹּה אָמַר
  rationale: The common messenger formula is expressed in natural modern English without changing its function.
- pob_phrase: Come down to me; do not delay
