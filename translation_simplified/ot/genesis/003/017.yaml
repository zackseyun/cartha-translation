translation:
  language: en
  text: He said to Adam[a], “Because you listened to what your wife said[b] and ate from the tree I had commanded you not to eat from, the ground is cursed because of you. Through painful toil, you will get your food from it for the rest of your life.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the man.”
    reason: alternative_reading
  - marker: b
    text: Hebrew “listened to the voice of your wife.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And to Adam he said
  simplified_phrase: He said to Adam
  preserved_meaning: God addresses the individual Adam.
  reasoning_layer_used: POB lexical and theological decisions on אָדָם
  rationale: Ordinary English word order makes the opening immediately clear.
- pob_phrase: you listened to the voice of your wife
  simplified_phrase: you listened to what your wife said
  preserved_meaning: Adam gave heed to his wife’s spoken words without explicitly saying he obeyed her.
  reasoning_layer_used: POB lexical decision and applied revisions on שָׁמַעְתָּ לְקוֹל אִשְׁתֶּךָ
  rationale: The wording explains the Hebrew idiom while the footnote preserves its voice image.
- pob_phrase: the tree about which I commanded you, saying, ‘You shall not eat from it’
  simplified_phrase: the tree I had commanded you not to eat from
  preserved_meaning: Adam ate from the tree despite God’s explicit prohibition.
  reasoning_layer_used: POB lexical decisions on the command clause and prohibition
  rationale: Combining the clauses removes formal syntax without weakening the command.
interpretive_expansions:
- pob_phrase: in painful toil you shall eat from it
  rendering: Through painful toil, you will get your food from it
  claim: Adam will obtain food from the ground through burdensome labor rather than eat the soil itself.
  evidence:
  - The immediate context concerns agricultural labor and food.
  - The POB rationale says the suffix refers to the ground as the source of food.
  - The POB renders בְּעִצָּבוֹן as hardship in labor for food.
  confidence: high
  alternatives_preserved:
  - eat from it
  - eat what it produces
translation_notes:
