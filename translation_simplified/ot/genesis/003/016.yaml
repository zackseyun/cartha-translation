translation:
  language: en
  text: He said to the woman, “I will greatly increase both your pain and your pregnancy.[a] You will give birth to children in pain. You will desire your husband,[b] and he will rule over you.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “your pain and your conception.” The term may refer to conception or pregnancy.
    reason: lexical_alternative
  - marker: b
    text: Or “long for your husband.” The Hebrew leaves open whether this desire is relational, sexual, dependent, or controlling.
    reason: alternative_reading
