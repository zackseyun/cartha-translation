  text: He said, “I heard a sound from you in the garden. I was afraid because I was naked, so I hid.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I heard your voice in the garden.” The Hebrew word can mean either “sound” or “voice.”
