  preserved_meaning: Adam heard something associated with God without specifying speech or how the sound was produced.
  reasoning_layer_used: Lexical and theological decisions on Hebrew qol
  rationale: This is natural English while preserving the deliberately broad sense of “sound.”
- pob_phrase: so I hid myself
  simplified_phrase: so I hid
  preserved_meaning: Adam concealed himself because he was afraid.
  reasoning_layer_used: Lexical decision on the reflexive verb
  rationale: In this context, “hid” naturally means that Adam concealed himself.
- pob_phrase: one long quoted sentence
