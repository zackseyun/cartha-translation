translation:
  language: en
  text: Then the LORD God said to the serpent, “Because you have done this, you are cursed more than all livestock and every wild animal. You will move on your belly and eat dust[a] for as long as you live.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eating dust can also be an image of humiliation and defeat, not only a reference to literal diet.
    reason: cultural_note
simplification_decisions:
- pob_phrase: cursed are you above all livestock and above every beast of the field
  simplified_phrase: you are cursed more than all livestock and every wild animal
  preserved_meaning: The serpent is singled out as especially cursed in comparison with domesticated and wild animals.
  reasoning_layer_used: Lexical decisions for the comparative construction and animal categories.
  rationale: The recast clause uses ordinary English while preserving the comparison and solemn judgment.
- pob_phrase: On your belly you shall go
  simplified_phrase: You will move on your belly
  preserved_meaning: The serpent's movement will be on its belly without specifying the verb “crawl.”
  reasoning_layer_used: Lexical decision for עַל גְּחֹנְךָ תֵלֵךְ.
  rationale: “Move” is clearer than formal “go” here and avoids adding a motion not explicit in the Hebrew verb.
- pob_phrase: all the days of your life
  simplified_phrase: for as long as you live
  preserved_meaning: The curse lasts throughout the serpent's life.
  reasoning_layer_used: Lexical decision for כָּל יְמֵי חַיֶּיךָ.
  rationale: The common expression states the same duration more directly.
translation_notes:
  risk_flags:
  - risk: “Eat dust” may be read only as a statement about diet.
    mitigation: The footnote preserves its possible force as an image of humiliation and defeat.
  - risk: Readers may identify the serpent directly as Satan within this verse.
    mitigation: The main text retains the immediate narrative referent without importing the later identification.
