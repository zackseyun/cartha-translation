translation:
  language: en
  text: I will make the serpent and the woman enemies. I will also make the serpent’s seed and the woman’s seed enemies.[a] He will crush the serpent’s head, and the serpent will bruise his heel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “seed” in both places. It can mean descendants as a group or one representative person.
    reason: lexical_alternative
  - marker: b
    text: The same rare Hebrew verb is used for both blows. “Crush” reflects the head wound, while “bruise” reflects the heel wound.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I will put enmity between you and the woman
  simplified_phrase: I will make the serpent and the woman enemies
  preserved_meaning: God establishes active opposition between the serpent and the woman.
  reasoning_layer_used: Lexical decision for אֵיבָה and the immediate serpent address in Genesis 3:14–15
  rationale: Naming the serpent replaces an ambiguous second-person pronoun with its explicit contextual referent.
- pob_phrase: and between your seed and her seed
  simplified_phrase: I will also make the serpent’s seed and the woman’s seed enemies
  preserved_meaning: The divinely established enmity continues between the serpent’s line and the woman’s line.
  reasoning_layer_used: Lexical and theological decisions for זֶרַע
  rationale: Repeating “seed” preserves the Hebrew image, while naming both sides makes the parallel clear to a modern reader.
- pob_phrase: he will crush your head, and you will bruise his heel
  simplified_phrase: He will crush the serpent’s head, and the serpent will bruise his heel
  preserved_meaning: The singular representative, the serpent referent, and the contrasting head-and-heel wounds remain visible.
  reasoning_layer_used: Latest maintainer revision and theological decisions for הוּא and שׁוּף
  rationale: Naming the serpent removes pronoun ambiguity, and “crush” versus “bruise” makes the head-versus-heel asymmetry explicit.
interpretive_expansions:
- pob_phrase: you ... your
  rendering: the serpent ... the serpent’s
  claim: The second-person pronouns refer to the serpent whom God is addressing.
  evidence:
  - Genesis 3:14 identifies the addressee as the serpent, and the direct speech continues through verse 15.
  confidence: high
  alternatives_preserved:
  - The POB retains second-person pronouns to mirror the Hebrew direct address.
translation_notes:
  risk_flags:
  - risk: Naming “the serpent” replaces the Hebrew second-person pronouns with their contextual referent.
    mitigation: Genesis 3:14 explicitly identifies the addressee, so the clarification does not introduce a new participant.
  - risk: “Seed” can sound only biological or only singular in modern English.
    mitigation: Footnote a preserves both the collective-descendant and representative-individual senses.
  - risk: “Crush” and “bruise” use two English verbs where the Hebrew repeats one rare verb.
    mitigation: Footnote b records the repetition, while the head-and-heel objects support the difference in severity.
