  simplified_phrase: I will make you and the woman enemies
  preserved_meaning: God establishes active opposition between the serpent and the woman.
  reasoning_layer_used: Lexical decision for אֵיבָה and אָשִׁית
  rationale: The direct wording states the same relationship in common English.
- pob_phrase: and between your offspring and her offspring
  simplified_phrase: I will also make your offspring and her offspring enemies
  preserved_meaning: The divinely established hostility continues between both lines of offspring.
  reasoning_layer_used: Lexical and theological decisions for זֶרַע
  rationale: A separate sentence clarifies the parallel while retaining “offspring” and its ambiguity.
- pob_phrase: he will bruise your head, and you will bruise his heel
  simplified_phrase: He will bruise your head, and you will bruise his heel
  preserved_meaning: The singular pronoun, repeated verb, and contrasting body-part images remain intact.
