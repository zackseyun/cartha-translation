translation:
  language: en
  text: I will make you and the woman enemies. I will also make your offspring and her offspring enemies.[a] He will bruise your head, and you will bruise his heel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew “seed” in both places; it can mean descendants as a group or one representative person.
    reason: lexical_alternative
  - marker: b
    text: The same rare Hebrew verb is used in both clauses; it may also be translated “strike.”
    reason: lexical_alternative
