translation:
  language: en
  text: They heard the sound[a] of Yahweh God walking in the garden in the day's breeze.[b] Then the man[c] and his wife hid from Yahweh God's presence among the garden trees.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “voice.” The Hebrew word can mean either “sound” or “voice.”
    reason: lexical_alternative
  - marker: b
    text: Or “in the cool of the day.” The Hebrew literally refers to the day's breeze or wind.
    reason: lexical_alternative
  - marker: c
    text: Hebrew “the man”; alternatively, “Adam.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: in the breeze of the day
  simplified_phrase: in the day's breeze
  preserved_meaning: The day's breeze remains the setting for God's movement in the garden.
  reasoning_layer_used: Lexical decision for לְרוּחַ הַיּוֹם
  rationale: The shorter phrase keeps the source image while sounding natural in English.
- pob_phrase: hid themselves from the presence of Yahweh God
  simplified_phrase: hid from Yahweh God's presence
  preserved_meaning: The man and his wife try to conceal themselves from God's personal presence.
  reasoning_layer_used: Lexical decision for מִפְּנֵי
  rationale: The recasting removes awkward reflexive wording without flattening “presence” to merely “from.”
- pob_phrase: among the trees of the garden
  simplified_phrase: among the garden trees
  preserved_meaning: They hide within the garden's trees.
  reasoning_layer_used: Lexical decision for בְּתוֹךְ עֵץ הַגָּן
  rationale: The compact form is ordinary English and retains the collective sense of “trees.”
