translation:
  language: en
  text: Now the serpent was more crafty[a] than any of the wild animals Yahweh God had made. He said to the woman, “Did God[b] really say, ‘You must not eat from any tree in the garden’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word means 'shrewd' or 'clever.' While it can sometimes be positive, here it describes a deceptive slyness.
    reason: simplification_note
  - marker: b
    text: The narrator uses God’s personal name 'Yahweh God,' but the serpent speaks only of 'God,' showing a shift away from personal intimacy.
    reason: simplification_note
