translation:
  language: en
  text: 'Reuel, Esau’s son, had four sons: Nahath, Zerah, Shammah, and Mizzah. They were chiefs[a] from Reuel’s family line in the land of Edom. They were descendants of Basemath, Esau’s wife.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew title may also be translated “clan chiefs”; it refers to Edomite tribal leaders.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And these are the sons of Reuel, the son of Esau
  simplified_phrase: Reuel, Esau’s son, had four sons
  preserved_meaning: Reuel was Esau’s son, and the four named men were Reuel’s sons.
  reasoning_layer_used: POB lexical decisions for בְּנֵי and רְעוּאֵל בֶּן עֵשָׂו
  rationale: The genealogical formula becomes a direct family statement without changing either relationship.
- pob_phrase: chief Nahath, chief Zerah, chief Shammah, chief Mizzah
  simplified_phrase: Nahath, Zerah, Shammah, and Mizzah. They were chiefs
  preserved_meaning: Each of the four named men held the title of chief.
  reasoning_layer_used: POB lexical decision for אַלּוּף
  rationale: A plural title after the names avoids repetition while clearly applying to all four men.
- pob_phrase: These are the chiefs of Reuel in the land of Edom
  simplified_phrase: They were chiefs from Reuel’s family line in the land of Edom
  preserved_meaning: The four were Edomite chiefs belonging to Reuel’s ancestral line.
  reasoning_layer_used: POB lexical decisions for אֵלֶּה אַלּוּפֵי רְעוּאֵל and בְּאֶרֶץ אֱדוֹם, read within the genealogy
  rationale: “From Reuel’s family line” prevents the mistaken idea that the chiefs served under Reuel personally.
interpretive_expansions:
- pob_phrase: These are the sons of Basemath, Esau’s wife
  rendering: They were descendants of Basemath, Esau’s wife
  claim: The four men belonged to Basemath’s descendant line rather than being her direct sons.
  evidence:
  - Genesis 36:13 identifies Reuel as Basemath’s son.
  - This verse first identifies the four men as Reuel’s sons.
  - The POB rationale says the phrase identifies the maternal line.
  confidence: high
  alternatives_preserved:
  - “Sons of Basemath” remains possible as genealogical wording.
translation_notes:
  risk_flags:
  - risk: “Descendants” is broader than the literal genealogical term “sons.”
    mitigation: The immediate genealogy shows that they were Basemath’s grandsons through Reuel.
  - risk: Moving the plural title after the names changes the Hebrew list’s repeated form.
    mitigation: The wording still identifies every named man as a chief, and the footnote preserves the title’s clan-leader sense.
