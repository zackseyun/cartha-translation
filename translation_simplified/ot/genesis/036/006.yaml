translation:
  language: en
  text: Esau took his wives, his sons and daughters, and everyone in his household. He also took his livestock, all his animals, and all the possessions he had acquired in the land of Canaan. Then he went to a land[a] because of his brother Jacob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts and ancient versions read “the land of Seir”; many English translations say “another land.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: all the persons of his household
  simplified_phrase: everyone in his household
  preserved_meaning: Every person belonging to Esau’s household went with him.
  reasoning_layer_used: POB lexical decision for כָּל נַפְשׁוֹת בֵּיתוֹ
  rationale: “Everyone” expresses the household idiom more naturally without suggesting disembodied souls.
- pob_phrase: And Esau took ... along with ... and went
  simplified_phrase: Esau took ... He also took ... Then he went
  preserved_meaning: Esau brought his whole household, animals, and property when he departed.
  reasoning_layer_used: POB translation and source clause sequence
  rationale: Three short sentences make the long inventory easier to follow while keeping the narrative order.
- pob_phrase: because of his brother Jacob
  simplified_phrase: because of his brother Jacob
  preserved_meaning: Jacob’s presence and the resulting pressure caused Esau’s move.
  reasoning_layer_used: POB revision rationale and Genesis 36:7 context
  rationale: The causal wording is retained because the audited revision identifies it as the controlling sense.
translation_notes:
  risk_flags:
  - risk: “Because of” may sound as though Jacob personally forced Esau to leave.
    mitigation: The wording follows the POB’s causal decision, while the next verse explains the pressure behind the separation.
  - risk: The destination has a documented textual and contextual ambiguity.
    mitigation: The main text keeps “a land,” and the footnote preserves the principal alternatives.
