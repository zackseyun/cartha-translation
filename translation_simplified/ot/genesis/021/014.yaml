  preserved_meaning: Abraham rose early and then took the supplies.
  reasoning_layer_used: Lexical decisions for וַיַּשְׁכֵּם and בַּבֹּקֶר
  rationale: Two sentences retain the explicit rising action while making the sequence easy to follow.
- pob_phrase: a skin of water
  simplified_phrase: a skin bag filled with water
  preserved_meaning: The water was carried in a container made from animal skin.
  reasoning_layer_used: Lexical decision for חֵמַת מַיִם
  rationale: This explains the ancient container without suggesting a modern bottle.
- pob_phrase: gave them to Hagar, putting them on her shoulder, along with the boy, and sent her away
  simplified_phrase: gave these provisions to Hagar and put them on her shoulder. Then he sent her away with the boy
  preserved_meaning: Abraham placed the provisions on Hagar’s shoulder, and the boy accompanied her when she was sent away.
  reasoning_layer_used: Theological decision on the compressed syntax
  rationale: The split sentences prevent readers from thinking that Abraham put the boy on her shoulder.
