translation:
  language: en
  text: Abraham got up early in the morning. He took bread and a skin bag filled with water. He gave these provisions to Hagar and put them on her shoulder. Then he sent her away with the boy. She left and wandered in the wilderness of Beersheba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Hebrew wording is compressed: literally, “putting [it/them] on her shoulder, and the boy.” It may also mean that Abraham gave Hagar the provisions and entrusted the boy to her.'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: rose early in the morning and took
