translation:
  language: en
  text: Sarah said, “God has brought me laughter. Everyone who hears about this will laugh with me.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “will laugh at me” or “will laugh for me,” but the context most likely describes others sharing Sarah’s joy.
    reason: lexical_alternative
