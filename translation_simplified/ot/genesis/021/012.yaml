translation:
  language: en
  text: But God said to Abraham, “Do not be distressed over the boy or your slave woman. Listen to what Sarah tells you, because your promised family line will come through Isaac.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This does not deny that Ishmael was Abraham’s biological son; it identifies God’s promised family line through Isaac.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Do not let it be grievous in your sight because of
  simplified_phrase: Do not be distressed over
  preserved_meaning: God tells Abraham not to remain deeply troubled about the boy and Hagar.
  reasoning_layer_used: Lexical decision for יֵרַע בְּעֵינֶיךָ
  rationale: The direct wording preserves the idiom’s emotional force in natural English.
- pob_phrase: Whatever Sarah says to you, listen to her voice
  simplified_phrase: Listen to what Sarah tells you
  preserved_meaning: Abraham is to heed Sarah’s words.
  reasoning_layer_used: Lexical decision and POB footnote for שְׁמַע בְּקֹלָהּ
  rationale: The Hebrew idiom is made explicit without strengthening it to a general command to obey.
- pob_phrase: through Isaac your offspring will be called
  simplified_phrase: your promised family line will come through Isaac
  preserved_meaning: The line designated by God as Abraham’s promised line is traced through Isaac.
  reasoning_layer_used: Lexical and theological decisions on בְּיִצְחָק and יִקָּרֵא לְךָ זָרַע
  rationale: The rendering clearly conveys covenant-line designation without implying that Ishmael was not Abraham’s son.
