  preserved_meaning: Abimelech did not know who was responsible for the incident.
  reasoning_layer_used: lexical decision for אֶת־הַדָּבָר הַזֶּה
  rationale: The context makes the disputed incident clear without the awkward phrase “this thing.”
- pob_phrase: You also did not tell me
  simplified_phrase: You did not tell me about it either
  preserved_meaning: Abraham, too, had failed to inform Abimelech.
  reasoning_layer_used: lexical decision for וְגַם אַתָּה
  rationale: “Either” preserves the inclusive emphasis of גַּם in more natural dialogue.
- pob_phrase: had not heard of it
  simplified_phrase: had heard nothing about it
  preserved_meaning: Abimelech had received no report about the incident before that day.
  reasoning_layer_used: lexical decisions for לֹא שָׁמַעְתִּי and בִּלְתִּי הַיּוֹם
  rationale: The positive sentence frame is easier to follow while keeping the same time limit.
