translation:
  language: en
  text: Then she went and sat down across from him, about as far away as a bow can shoot. She said, “I do not want to see the boy die.” As she sat there facing him, she raised her voice and wept.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: opposite him, at a distance, about a bowshot away
  simplified_phrase: across from him, about as far away as a bow can shoot
  preserved_meaning: She remained facing him but put roughly an arrow’s range between them.
  reasoning_layer_used: POB lexical decisions for מִנֶּגֶד, הַרְחֵק, and כִּמְטַחֲוֵי קֶשֶׁת
  rationale: The wording explains the old distance expression while preserving the archery image.
- pob_phrase: Let me not look on the death of the boy
  simplified_phrase: I do not want to see the boy die
  preserved_meaning: She did not wish to witness the boy’s death.
  reasoning_layer_used: POB lexical alternative and footnote for אַל אֶרְאֶה בְּמוֹת הַיָּלֶד
  rationale: The POB’s documented alternative expresses the same wish in direct modern English.
- pob_phrase: lifted up her voice and wept
  simplified_phrase: raised her voice and wept
  preserved_meaning: Her weeping became an audible lament.
  reasoning_layer_used: POB lexical decisions for וַתִּשָּׂא אֶת־קֹלָהּ and וַתֵּבְךְּ
  rationale: This keeps the two actions distinct while making the Hebrew idiom immediately clear.
interpretive_expansions:
