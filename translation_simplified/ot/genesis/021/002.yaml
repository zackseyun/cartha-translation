  preserved_meaning: The birth occurred during Abraham’s advanced age.
  reasoning_layer_used: POB lexical decision for לִזְקֻנָיו
  rationale: Naming Abraham removes uncertainty about whose old age is meant.
- pob_phrase: at the appointed time that God had spoken to him
  simplified_phrase: at the appointed time God had told Abraham about
  preserved_meaning: The birth occurred at the divinely fixed time previously announced to Abraham.
  reasoning_layer_used: POB lexical and theological decisions for לַמּוֹעֵד and the relative clause
  rationale: Keeping this phrase with the birth makes the promise fulfillment clear.
