  preserved_meaning: Sarah conceived and then delivered a male child.
  reasoning_layer_used: POB lexical decisions for וַתַּהַר, וַתֵּלֶד, and בֵּן
  rationale: Common modern wording clearly preserves both stages.
- pob_phrase: in his old age
