  preserved_meaning: Sarah demands their forceful expulsion, not a gentle departure.
  reasoning_layer_used: POB lexical decision for גָּרֵשׁ
  rationale: Placing “away” last makes the command easier to read without softening it.
- pob_phrase: will not inherit with my son Isaac
