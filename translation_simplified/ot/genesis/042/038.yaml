translation:
  language: en
  text: But he said, “My son will not go down with you. His brother is dead, and he is his mother’s only son left. If he comes to harm along the way, you would bring me, gray-haired and grieving, down to Sheol.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheol is the Hebrew term for the realm of the dead; it can also be translated “the grave.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: because his brother is dead, and he alone is left
  simplified_phrase: His brother is dead, and he is his mother’s only son left.
  preserved_meaning: Benjamin is Rachel’s only remaining son because Jacob believes Joseph is dead.
  reasoning_layer_used: POB lexical rationale for לְבַדּוֹ נִשְׁאָר and immediate context
  rationale: The added family scope prevents readers from mistaking Benjamin for Jacob’s only surviving son.
- pob_phrase: If harm should happen to him on the journey on which you go
  simplified_phrase: If he comes to harm along the way
  preserved_meaning: Jacob fears serious misfortune during the journey.
  reasoning_layer_used: POB lexical decisions for אָסוֹן and דֶּרֶךְ
  rationale: The common expression preserves both the conditional warning and the travel setting.
- pob_phrase: bring my gray hair down to Sheol in sorrow
  simplified_phrase: bring me, gray-haired and grieving, down to Sheol
  preserved_meaning: Benjamin’s loss would cause the aged Jacob to descend to Sheol in grief.
  reasoning_layer_used: POB lexical and theological decisions for שֵׂיבָתִי, יָגוֹן, and שְׁאוֹל
  rationale: The recasting explains the image while retaining gray hair, grief, descent, and Sheol.
interpretive_expansions:
- pob_phrase: he alone is left
  rendering: he is his mother’s only son left
  claim: Benjamin is the only remaining son of his mother, Rachel, from Jacob’s perspective.
  evidence:
  - The clause contrasts Benjamin with his brother Joseph, whom Jacob believes is dead.
  - The POB lexical rationale identifies Benjamin as Rachel’s sole remaining son.
  confidence: high
  alternatives_preserved:
  - The wording still reflects Jacob’s belief that Joseph is dead.
- pob_phrase: my gray hair
  rendering: me, gray-haired
  claim: Jacob’s gray hair represents Jacob himself in old age.
  evidence:
  - The POB lexical rationale says the concrete image extends to old age.
  confidence: high
  alternatives_preserved:
  - The visible image of gray hair remains in the text.
translation_notes:
  risk_flags:
  - risk: Adding “his mother’s” states the contextual scope more directly than the Hebrew clause.
    mitigation: The immediate contrast with Joseph and the POB lexical rationale establish this scope.
  - risk: Some readers may not know the term “Sheol.”
    mitigation: The footnote explains it without reducing it only to a physical grave.
