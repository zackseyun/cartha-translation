translation:
  language: en
  text: Send one of you to bring your brother back. The rest of you will remain in custody. This will test your claims and show whether you are telling the truth. If not, as Pharaoh lives,[a] you are surely spies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “As Pharaoh lives” is an oath sworn by Pharaoh’s life.
    reason: cultural_note
