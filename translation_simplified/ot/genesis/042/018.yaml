translation:
  language: en
  text: On the third day Joseph told them, “Follow my instructions, and you will stay alive,[a] because I fear God.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Follow my instructions so that you may live.” The Hebrew can present life as either the result or the purpose of obeying.
