translation:
  language: en
  text: When Jacob learned that grain was available in Egypt, he said to his sons, “Why do you keep looking at each other?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Why do you show yourselves?” The Hebrew can have this meaning, but here it most likely describes the brothers looking at each other in hesitation.
    reason: lexical_alternative
