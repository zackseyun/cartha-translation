- pob_phrase: When Jacob saw that there was grain in Egypt
  simplified_phrase: When Jacob learned that grain was available in Egypt
  preserved_meaning: Jacob became aware that Egypt had grain during the famine.
  reasoning_layer_used: Lexical decisions for וַיַּרְא, כִּי יֶשׁ, and שֶׁבֶר
  rationale: “Learned” and “was available” express Jacob’s perception and the narrative sense of grain obtainable in Egypt.
- pob_phrase: looking at one another
  simplified_phrase: looking at each other
  preserved_meaning: The brothers were hesitating and looking among themselves instead of responding.
  reasoning_layer_used: Lexical decision for תִּתְרָאוּ
  rationale: “Each other” is the more natural modern reciprocal expression.
