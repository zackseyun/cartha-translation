translation:
  language: en
  text: “Bring your youngest brother to me. Then I will know that you are honest men, not spies. I will give your brother back to you, and you may trade[a] in the land.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “move about in the land,” but “trade” best fits the famine setting.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Bring your youngest brother to me, so that I may know
  simplified_phrase: Bring your youngest brother to me. Then I will know
  preserved_meaning: Bringing the youngest brother will allow the speaker to determine whether their claim is true.
  reasoning_layer_used: The lexical decision identifies the cohortative as the intended result of the command.
  rationale: Two short sentences make the command and its result easier to follow.
- pob_phrase: that you are not spies, but honest men
  simplified_phrase: that you are honest men, not spies
  preserved_meaning: Their honesty is contrasted directly with the accusation that they are spies.
  reasoning_layer_used: The lexical decisions preserve both כֵנִים as “honest men” and מְרַגְּלִים as “spies.”
  rationale: Reversing the order gives natural English emphasis without changing the contrast.
- pob_phrase: Then I will give your brother back to you, and you may trade in the land
  simplified_phrase: I will give your brother back to you, and you may trade in the land
  preserved_meaning: The detained brother will be returned, and they will receive permission to conduct business in the land.
  reasoning_layer_used: The lexical rationale supports both implied restoration and the commercial sense of סחר.
  rationale: Removing the second “Then” avoids repetitive sequencing while keeping both promised outcomes.
translation_notes:
  risk_flags:
  - risk: The Hebrew verb rendered “trade” can also refer more broadly to moving about.
    mitigation: The footnote preserves that alternative while retaining the contextually preferred commercial sense.
