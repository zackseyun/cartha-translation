    changes_summary: 'doctrine_realignment: Gen 42:7 acted like a stranger toward them. Drafter chose ''acted like a stranger toward them'' for the Hitpael of נכר (relational self-presentation as foreign, not physical disguise), with ''disguised himself'' as explicit rejected alternative. Az'
translation:
  language: en
  text: Joseph recognized his brothers when he saw them. But he acted as if he were a stranger to them[a] and spoke harshly to them. He asked, “Where have you come from?” They answered, “We have come from the land of Canaan to buy food[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean that he made himself unrecognizable to them, but it does not necessarily imply a physical disguise.
    reason: lexical_alternative
  - marker: b
    text: Or “to buy grain”; the word here means food broadly, though grain is especially likely in this famine.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: he acted like a stranger toward them
  simplified_phrase: he acted as if he were a stranger to them
  preserved_meaning: Joseph deliberately presented himself as unknown or foreign to his brothers without specifying a physical disguise.
  reasoning_layer_used: POB lexical decision and doctrine realignment
  rationale: The new wording makes the relational pretense immediately clear while retaining the chosen Hebrew nuance.
- pob_phrase: And they said, “From the land of Canaan, to buy food.”
  simplified_phrase: They answered, “We have come from the land of Canaan to buy food.”
  preserved_meaning: The brothers state both where they came from and why they came.
  reasoning_layer_used: POB translation and lexical decisions
  rationale: A complete English sentence is easier to follow than the source-shaped elliptical reply.
translation_notes:
  risk_flags:
  - risk: Readers may understand Joseph as physically disguised.
    mitigation: The main text emphasizes acting like a stranger, and the footnote keeps the broader lexical alternative without making it certain.
