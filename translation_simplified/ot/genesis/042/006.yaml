translation:
  language: en
  text: Joseph ruled Egypt and was the one who sold grain to all its people. When his brothers came, they bowed low before him, with their faces to the ground.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: was the ruler over the land
  simplified_phrase: ruled Egypt
  preserved_meaning: Joseph exercised governing authority over the country in view.
  reasoning_layer_used: lexical decision and immediate narrative context
  rationale: The context identifies “the land” as Egypt, and the active verb is easier to read.
- pob_phrase: he was the one who sold grain to all the people of the land
  simplified_phrase: was the one who sold grain to all its people
  preserved_meaning: Joseph personally held responsibility for selling grain throughout the land.
  reasoning_layer_used: lexical decisions for הַמַּשְׁבִּיר and לְכָל עַם הָאָרֶץ
  rationale: The shorter wording avoids repeating “the land” while retaining grain sales and their full scope.
- pob_phrase: bowed down to him with their faces to the ground
  simplified_phrase: bowed low before him, with their faces to the ground
  preserved_meaning: The brothers made a deep physical gesture of homage and submission to Joseph.
  reasoning_layer_used: lexical and theological decisions for וַיִּשְׁתַּחֲווּ and אַפַּיִם אָרְצָה
  rationale: “Bowed low” clearly conveys deep obeisance without suggesting divine worship.
