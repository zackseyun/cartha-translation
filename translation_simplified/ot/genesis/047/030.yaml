  rationale: “Ancestors” is clearer today than the idiomatic “fathers,” and “in death” prevents a literal misunderstanding.
- pob_phrase: bury me in their burial place
  simplified_phrase: bury me where they are buried
  preserved_meaning: Jacob asks to be buried in the same family burial site as his ancestors.
  reasoning_layer_used: POB lexical decision for בִּקְבֻרָתָם
  rationale: The clause uses ordinary English without narrowing the site to a grave or tomb.
- pob_phrase: I will do as you have said
