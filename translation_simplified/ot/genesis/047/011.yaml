  preserved_meaning: Joseph gave them a landed holding rather than a covenantal inheritance.
  reasoning_layer_used: POB lexical decision for אֲחֻזָּה
  rationale: “Land of their own” makes the concrete property sense clear in common English.
- pob_phrase: in the best part of the land, in the land of Rameses
