translation:
  language: en
  text: They said to Pharaoh, “We have come to live here as temporary residents. There is no pasture for your servants’ flocks because the famine in Canaan is severe. So please let your servants live in the land of Goshen.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: to sojourn in the land
  simplified_phrase: to live here as temporary residents
  preserved_meaning: They seek residence in Egypt without implying permanent settlement.
  reasoning_layer_used: POB lexical decision for לָגוּר and בָּאָרֶץ
  rationale: The wording explains the unfamiliar term “sojourn” in common English.
- pob_phrase: the flocks that belong to your servants
  simplified_phrase: your servants’ flocks
  preserved_meaning: The flocks belong to the brothers, who address Pharaoh deferentially.
  reasoning_layer_used: POB lexical decisions for לַצֹּאן and אֲשֶׁר לַעֲבָדֶיךָ
  rationale: The possessive form removes a cumbersome relative clause without losing ownership or respect.
- pob_phrase: And now, please let your servants dwell
  simplified_phrase: So please let your servants live
  preserved_meaning: They politely ask Pharaoh for permission to reside in Goshen.
  reasoning_layer_used: POB lexical decision for יֵשְׁבוּ נָא
  rationale: “So” makes the request’s connection to the famine clear, while “live” is more familiar than “dwell.”
translation_notes:
  risk_flags:
  - risk: The word “live” alone could suggest permanent settlement.
    mitigation: The opening phrase “as temporary residents” preserves the limited nature of their stay.
