translation:
  language: en
  text: The land of Egypt is available to you. Settle your father and brothers in the best part of the land; let them live in Goshen. If you know of any capable men among them, appoint them to oversee my livestock.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The land of Egypt is before you
  simplified_phrase: The land of Egypt is available to you
  preserved_meaning: Egypt is open to Joseph for settling his family, without implying an unrestricted choice of any location.
  reasoning_layer_used: POB lexical rationale and cultural note
  rationale: The idiom’s contextual meaning is stated clearly while avoiding the overbroad word “anywhere.”
- pob_phrase: in the best of the land
  simplified_phrase: in the best part of the land
  preserved_meaning: Joseph is to settle his family in a choice portion of Egypt.
  reasoning_layer_used: POB lexical decision for בְּמֵיטַב הָאָרֶץ
  rationale: “Part” makes the phrase natural and keeps the sense of a choice portion.
- pob_phrase: appoint them as overseers of the livestock that belongs to me
  simplified_phrase: appoint them to oversee my livestock
  preserved_meaning: Qualified men may be assigned responsibility for Pharaoh’s animals.
  reasoning_layer_used: POB lexical decisions for וְשַׂמְתָּם, שָׂרֵי מִקְנֶה, and עַל אֲשֶׁר לִי
  rationale: A direct verb phrase expresses the same official assignment in modern English.
