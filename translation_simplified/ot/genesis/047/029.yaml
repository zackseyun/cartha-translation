translation:
  language: en
  text: As Israel’s days drew near their end, he called his son Yosef and said, “If you regard me with favor, please put your hand under my thigh as a sign of a solemn oath.[a] Treat me with loyal kindness and faithfulness.[b] Please do not bury me in Egypt.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This solemn oath gesture also appears in Genesis 24:2.
    reason: cultural_note
  - marker: b
    text: Or “steadfast love and faithfulness”; the Hebrew describes loyal, dependable covenant kindness.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: When the days of Israel drew near for him to die
  simplified_phrase: As Israel’s days drew near their end
  preserved_meaning: Israel was approaching death, while the image of his days drawing near remains.
  reasoning_layer_used: Lexical decisions for וַיִּקְרְבוּ יְמֵי and לָמוּת
  rationale: The shorter wording preserves the Hebrew image without the awkward phrase “for him to die.”
- pob_phrase: If now I have found favor in your eyes
  simplified_phrase: If you regard me with favor
  preserved_meaning: Israel respectfully appeals to Yosef’s favorable regard.
  reasoning_layer_used: Lexical decision for אִם נָא מָצָאתִי חֵן בְּעֵינֶיךָ
  rationale: The Hebrew politeness formula becomes natural English without weakening its respectful tone.
- pob_phrase: deal with me in steadfast love and faithfulness
  simplified_phrase: Treat me with loyal kindness and faithfulness
  preserved_meaning: Israel asks Yosef to act with loyal kindness and dependable faithfulness.
  reasoning_layer_used: Lexical and theological decisions for חֶסֶד וֶאֱמֶת
  rationale: The wording keeps both Hebrew ideas while avoiding repetitive abstractions and an explicit covenant claim.
interpretive_expansions:
- pob_phrase: put your hand under my thigh
  rendering: put your hand under my thigh as a sign of a solemn oath
  claim: The gesture marks a solemn oath rather than an ordinary physical action.
  evidence:
  - The POB cultural note identifies this as an oath gesture in the patriarchal narratives.
  - Genesis 24:2 presents the same gesture in an oath setting.
  confidence: high
  alternatives_preserved:
  - The gesture may be explained only in a footnote.
translation_notes:
  risk_flags:
  - risk: “Loyal kindness” may not convey every covenantal association of חֶסֶד.
    mitigation: The footnote preserves the expression’s covenantal context and an established alternative.
  - risk: Explaining the thigh gesture as an oath states its cultural function directly.
    mitigation: The POB audit and the parallel in Genesis 24:2 explicitly support this clarification.
