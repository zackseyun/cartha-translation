translation:
  language: en
  text: 'So Joseph established this law for Egypt’s farmland, and it remains in force to this day: the required one-fifth of the harvest goes to Pharaoh. Only the priests’ land did not become Pharaoh’s property.'
  philosophy: optimal-equivalence
