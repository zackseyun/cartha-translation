translation:
  language: en
  text: Jacob answered Pharaoh, “I have lived as a foreigner for 130 years. The years of my life have been few and hard, and I have not lived as long as my fathers did during their time as foreigners.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The days of the years of my sojourning
  simplified_phrase: I have lived as a foreigner
  preserved_meaning: Jacob describes his life as temporary residence in a land where he is a foreigner.
  reasoning_layer_used: lexical and theological decisions on מְגוּרַי
  rationale: This makes the historical status clear without spiritualizing it as pilgrimage.
- pob_phrase: Few and evil have been the days of the years of my life
  simplified_phrase: The years of my life have been few and hard
  preserved_meaning: Jacob says his lifespan has been comparatively short and marked by adversity.
  reasoning_layer_used: lexical decisions on מְעַט and רָעִים
  rationale: “Hard” avoids suggesting that Jacob's days were morally wicked.
- pob_phrase: they have not attained to the days of the years of the lives of my fathers
  simplified_phrase: I have not lived as long as my fathers did
  preserved_meaning: Jacob's 130 years fall short of his fathers' lifespans.
  reasoning_layer_used: lexical decisions on הִשִּׂיגוּ and חַיֵּי אֲבֹתַי
  rationale: The comparison is stated in ordinary English while retaining its full sense.
