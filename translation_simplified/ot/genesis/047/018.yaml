  preserved_meaning: Only their own persons and land remain.
  reasoning_layer_used: POB lexical decisions for לֹא נִשְׁאַר לִפְנֵי אֲדֹנִי, גְּוִיָּתֵנוּ, and וְאַדְמָתֵנוּ
