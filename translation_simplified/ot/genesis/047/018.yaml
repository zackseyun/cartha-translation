  reasoning_layer_used: POB lexical decisions for מִקְנֵה הַבְּהֵמָה and אֶל אֲדֹנִי
  rationale: Ordinary wording makes the ownership clear without adding a time marker.
- pob_phrase: Nothing is left before my lord except our bodies and our land
