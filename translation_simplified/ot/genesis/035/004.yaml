translation:
  language: en
  text: So they gave Jacob all the foreign gods they had, along with their earrings. Jacob hid all these things under the terebinth tree near Shechem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A terebinth is a type of large tree; some translations say “oak.”
