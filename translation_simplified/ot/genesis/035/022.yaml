- pob_phrase: that Reuben went and lay with Bilhah, his father's concubine, and Israel heard of it
  simplified_phrase: Reuben went and lay with Bilhah, his father’s concubine. Israel heard about it.
  preserved_meaning: Reuben’s grave sexual act and Israel’s knowledge of it remain distinct narrative events.
  reasoning_layer_used: Lexical and theological decisions for וַיִּשְׁכַּב אֶת and וַיִּשְׁמַע יִשְׂרָאֵל
  rationale: Two sentences make the sequence easier to follow without weakening the sexual idiom or adding a reaction.
- pob_phrase: Now the sons of Jacob were twelve
