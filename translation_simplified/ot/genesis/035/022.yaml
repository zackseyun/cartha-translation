translation:
  language: en
  text: While Israel was living in that land, Reuben went and lay with Bilhah, his father’s concubine.[a] Israel heard about it. Now Jacob had twelve sons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A concubine was a woman with a recognized but lower marital status in an ancient household.
    reason: cultural_note
