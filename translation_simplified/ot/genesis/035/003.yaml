translation:
  language: en
  text: Let us set out and go up to Bethel. There I will build an altar to the God who answered me[a] when I was in trouble and was with me along the road I traveled.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “who answers me,” describing God’s response as general or ongoing.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Let us rise and go up
  simplified_phrase: Let us set out and go up
  preserved_meaning: Jacob urges the group to begin traveling upward toward Bethel.
  reasoning_layer_used: Lexical decision for וְנָקוּמָה and וְנַעֲלֶה
  rationale: “Set out” clearly expresses beginning the journey, while “go up” keeps the ascent.
- pob_phrase: make an altar
  simplified_phrase: build an altar
  preserved_meaning: Jacob intends to construct an altar dedicated to God.
  reasoning_layer_used: Lexical decision for וְאֶעֱשֶׂה שָּׁם מִזְבֵּחַ
  rationale: “Build an altar” is the ordinary English expression and is a documented lexical alternative.
- pob_phrase: in the day of my distress ... on the way that I went
  simplified_phrase: when I was in trouble ... along the road I traveled
  preserved_meaning: God answered Jacob during his trouble and accompanied him on his journey.
  reasoning_layer_used: Lexical decisions for בְּיוֹם צָרָתִי and בַּדֶּרֶךְ אֲשֶׁר הָלָכְתִּי
  rationale: The new wording removes formal idioms while retaining the trouble, road, and travel imagery.
translation_notes:
  risk_flags:
  - risk: “Set out” does not explicitly depict standing up.
    mitigation: It preserves the exhortation to begin moving and remains paired with the spatial phrase “go up.”
  - risk: Past-tense “answered” may obscure the participle’s possible ongoing sense.
    mitigation: The footnote preserves “who answers me” as an important lexical alternative.
