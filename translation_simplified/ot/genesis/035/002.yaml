translation:
  language: en
  text: Then Jacob said to all the people in his household and to everyone else with him, “Get rid of the foreign gods among you. Purify yourselves,[a] and change your clothes.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This purification may have involved ritual cleansing as they prepared to approach God.
    reason: cultural_note
simplification_decisions:
- pob_phrase: his household and to all who were with him
  simplified_phrase: all the people in his household and to everyone else with him
  preserved_meaning: Jacob addressed his entire domestic group and the other people accompanying him.
  reasoning_layer_used: POB lexical decisions for בֵּיתוֹ and כָּל אֲשֶׁר עִמּוֹ
  rationale: The wording makes clear that “household” means people while keeping the accompanying group distinct.
- pob_phrase: Put away the foreign gods
  simplified_phrase: Get rid of the foreign gods
  preserved_meaning: They must remove the objects of alien worship from their community or possession.
  reasoning_layer_used: POB lexical decisions for הָסִרוּ, אֱלֹהֵי הַנֵּכָר, and בְּתֹכְכֶם
  rationale: “Get rid of” states the command plainly without weakening its force.
- pob_phrase: purify yourselves, and change your clothes
