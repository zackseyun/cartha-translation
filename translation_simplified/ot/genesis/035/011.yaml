translation:
  language: en
  text: God said to him, “I am God Almighty. Have children and have many descendants. A nation and a group of nations will come from you,[a] and your own physical descendants will include kings.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated “an assembly” or “a company of nations.”
    reason: lexical_alternative
  - marker: b
    text: Literally “kings will come from your loins,” a bodily image for direct physical descent.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Be fruitful and multiply
  simplified_phrase: Have children and have many descendants
  preserved_meaning: Both imperatives directly call Jacob to produce a numerous line of descendants.
  reasoning_layer_used: Lexical decision for פְּרֵה וּרְבֵה and the patriarchal blessing context
  rationale: This explains the blessing formula while preserving both commands as directly addressed to Jacob.
- pob_phrase: an assembly of nations
  simplified_phrase: a group of nations
  preserved_meaning: Multiple nations will arise from Jacob as a collective.
  reasoning_layer_used: Lexical decision for קְהַל גּוֹיִם
  rationale: “Group” is immediately clear, while the footnote preserves the assembly sense.
- pob_phrase: kings shall come from your loins
  simplified_phrase: your own physical descendants will include kings
  preserved_meaning: Kings will arise through Jacob’s direct biological line.
  reasoning_layer_used: Lexical and theological decisions for מֵחֲלָצֶיךָ
  rationale: The text explains the idiom, while the footnote retains its bodily image.
