- pob_phrase: breathed his last and died
  simplified_phrase: took his last breath and died
  preserved_meaning: Isaac expired, followed by the explicit statement that he died.
  reasoning_layer_used: POB lexical decisions for וַיִּגְוַע and וַיָּמָת
  rationale: The familiar wording keeps the Hebrew sequence and its two distinct verbs.
- pob_phrase: old and full of days
  simplified_phrase: old and having lived a full life
  preserved_meaning: Isaac was old and had experienced the fullness associated with a long life.
  reasoning_layer_used: POB lexical decision for זָקֵן וּשְׂבַע יָמִים and grounding review
  rationale: This explains the idiom without implying a predetermined lifespan or adding a temporal sequence.
- pob_phrase: And Esau and Jacob, his sons, buried him
