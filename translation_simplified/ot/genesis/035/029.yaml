translation:
  language: en
  text: Then Isaac took his last breath and died. He was gathered to his people,[a] old and having lived a full life. His sons, Esau and Jacob, buried him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This Hebrew death formula may mean being joined to one’s ancestors or kin, and it may imply more than physical burial.
    reason: lexical_alternative
