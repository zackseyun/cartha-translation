translation:
  language: en
  text: Then God said to Jacob, “Rise and go up to Bethel, and live there. Build an altar there to the God who appeared to you when you fled from your brother Esau.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Arise, go up to Bethel and dwell there
  simplified_phrase: Rise and go up to Bethel, and live there
  preserved_meaning: Jacob must set out for Bethel and reside there.
  reasoning_layer_used: POB lexical decisions for קוּם, עֲלֵה, and וְשֶׁב שָׁם
  rationale: “Rise” keeps the command’s gravity, while “live” makes “dwell” immediately clear.
- pob_phrase: make there an altar
  simplified_phrase: Build an altar there
  preserved_meaning: Jacob must construct an altar at Bethel.
  reasoning_layer_used: POB lexical decision for וַעֲשֵׂה שָׁם מִזְבֵּחַ
  rationale: “Build an altar” is natural modern English and is an accepted POB alternative.
- pob_phrase: fled from the presence of Esau your brother
  simplified_phrase: fled from your brother Esau
  preserved_meaning: Jacob escaped from Esau.
  reasoning_layer_used: POB footnote and lexical decisions for מִפְּנֵי and עֵשָׂו אָחִיךָ
  rationale: The POB footnote identifies this as the idiomatic meaning of the Hebrew image.
