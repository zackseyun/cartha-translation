translation:
  language: en
  text: In three more days, Pharaoh will lift up your head[a] and give you back your position. You will once again put Pharaoh’s cup in his hand, just as you did before when you served as his cupbearer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lift up your head” means that Pharaoh will look favorably on you and restore you; the same image is used with a grim extension in verse 19.
    reason: lexical_alternative
