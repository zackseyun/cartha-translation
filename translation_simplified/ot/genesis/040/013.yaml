- pob_phrase: restore you to your position
  simplified_phrase: give you back your position
  preserved_meaning: Pharaoh will reinstate him in his former court role.
  reasoning_layer_used: Lexical decision for וַהֲשִׁיבְךָ עַל כַּנֶּךָ
  rationale: “Give you back” states restoration in more familiar English.
- pob_phrase: according to the former custom
  simplified_phrase: once again ... just as you did before
  preserved_meaning: He will resume the same established service he performed earlier.
  reasoning_layer_used: Lexical decision for כַּמִּשְׁפָּט הָרִאשׁוֹן
  rationale: The recast phrase makes the return to his previous duties immediately clear.
- pob_phrase: when you were his cupbearer
  simplified_phrase: when you served as his cupbearer
  preserved_meaning: Cupbearer was his official role in Pharaoh’s court.
  reasoning_layer_used: Lexical decision for אֲשֶׁר הָיִיתָ מַשְׁקֵהוּ
  rationale: “Served as” clearly presents cupbearer as an official duty.
