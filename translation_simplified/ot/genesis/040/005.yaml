  reasoning_layer_used: POB lexical decisions for וַיַּחַלְמוּ חֲלוֹם, שְׁנֵיהֶם, אִישׁ חֲלֹמוֹ, and בְּלַיְלָה אֶחָד
  rationale: The reordered clause uses natural English without flattening “dreamed a dream.”
- pob_phrase: each according to the interpretation of his dream
