translation:
  language: en
  text: In a single night, both men dreamed a dream of their own, and each dream had its own interpretation. These men—the cupbearer[a] and the baker—served the king of Egypt and were held in prison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A cupbearer was a royal official who served the king his drinks.
    reason: cultural_note
