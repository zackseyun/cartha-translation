  rationale: “Held a feast” is more natural modern English than “made a feast.”
- pob_phrase: he lifted up the head of the chief cupbearer and the head of the chief baker
  simplified_phrase: Pharaoh singled out the chief cupbearer and the chief baker—he “lifted up their heads”
