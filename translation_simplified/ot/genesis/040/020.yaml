translation:
  language: en
  text: On the third day, Pharaoh’s birthday, he held a feast for all his servants. At the feast, Pharaoh singled out the chief cupbearer and the chief baker among his servants—he “lifted up their heads,” as the Hebrew says.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression “lifted up their heads” is kept because the story uses it for the different outcomes of the two officials.
    reason: lexical_alternative
