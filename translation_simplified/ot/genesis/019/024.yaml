  preserved_meaning: Yahweh caused sulfur and fire to fall like rain upon the cities.
  reasoning_layer_used: Lexical decision for הִמְטִיר and source-language image
  rationale: The causative wording makes the action clear while preserving the image of rain falling from above.
- pob_phrase: from Yahweh out of the heavens
  simplified_phrase: It came from Yahweh, out of the heavens.
  preserved_meaning: The judgment came from Yahweh and descended from the heavens.
