translation:
  language: en
  text: He said, “Please, my lords,[a] come to your servant’s house. Stay the night and wash your feet. Then get up early and continue your journey.” But they answered, “No. We will spend the night in the public square.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “my lord”; the plural “my lords” best fits Lot’s address to the two visitors.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: turn aside to your servant’s house
  simplified_phrase: come to your servant’s house
  preserved_meaning: Lot respectfully invites the visitors to leave their route and enter his home.
  reasoning_layer_used: POB lexical decisions for סוּרוּ נָא and בֵּית עַבְדְּכֶם
  rationale: “Come to” gives the invitation in clear modern English while retaining Lot’s humble self-description.
- pob_phrase: spend the night, and wash your feet. Then you may rise early and go on your way
  simplified_phrase: Stay the night and wash your feet. Then get up early and continue your journey.
  preserved_meaning: The visitors are invited to accept hospitality, rise early, and resume their route.
  reasoning_layer_used: POB lexical decisions for לין, שׁכם, and הלך לדרך
  rationale: Ordinary verbs and two short sentences clarify the expected sequence without implying mere ability.
- pob_phrase: No, but we will spend the night in the square
  simplified_phrase: No. We will spend the night in the public square.
  preserved_meaning: The visitors refuse Lot’s invitation and intend to lodge in the city’s open common area.
  reasoning_layer_used: POB lexical decision and cultural note for בָרְחוֹב
  rationale: A direct reply is natural English, and “public” identifies the kind of square intended.
