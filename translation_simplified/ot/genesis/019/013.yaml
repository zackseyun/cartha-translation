translation:
  language: en
  text: We are about to destroy this place because their outcry[a] has become so great before Yahweh. Yahweh has sent us to destroy it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the outcry against them.” The Hebrew says “their outcry,” but it may mean the cry raised against the people of this place.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: has become great
  simplified_phrase: has become so great
  preserved_meaning: The outcry has increased to a grave magnitude before Yahweh.
  reasoning_layer_used: Lexical decision for גָדְלָה
  rationale: “Has become so great” naturally conveys both the increase and its serious result.
- pob_phrase: For we are about to destroy this place ... and Yahweh has sent us to destroy it
  simplified_phrase: We are about to destroy this place ... Yahweh has sent us to destroy it.
  preserved_meaning: The speakers announce imminent destruction and say Yahweh commissioned them.
  reasoning_layer_used: Lexical decisions for מַשְׁחִתִים and וַיְשַׁלְּחֵנוּ
  rationale: Removing “For” and using two sentences makes the announcement easier to follow.
translation_notes:
  risk_flags:
  - risk: Readers may take “their outcry” only as a cry made by the city's people.
    mitigation: The footnote preserves the important alternative that the outcry was raised against them.
