translation:
  language: en
  text: 'Please listen: I am your servant, and I have found favor in your eyes. You have shown me how great your steadfast love is by keeping me alive. But I cannot escape to the mountain, because I fear the disaster will catch up with me and I will die.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Look, please, your servant has found favor in your eyes
  simplified_phrase: 'Please listen: I am your servant, and I have found favor in your eyes.'
  preserved_meaning: Lot urgently and respectfully appeals as a servant who has received favorable regard.
  reasoning_layer_used: Lexical decisions for הִנֵּה נָא, עַבְדְּךָ, and מָצָא ... חֵן בְּעֵינֶיךָ.
  rationale: The direct appeal becomes natural English while retaining the servant language and the Hebrew image.
- pob_phrase: you have made great your steadfast love that you have shown me by preserving my life
  simplified_phrase: You have shown me how great your steadfast love is by keeping me alive.
  preserved_meaning: The great, gracious, and loyal love shown to Lot has preserved his life.
  reasoning_layer_used: Lexical and theological decisions for וַתַּגְדֵּל, חַסְדְּךָ, and לְהַחֲיוֹת אֶת נַפְשִׁי.
  rationale: The clause is recast in ordinary English without weakening “steadfast love.”
- pob_phrase: But I cannot escape to the mountain, lest the disaster overtake me and I die
  simplified_phrase: But I cannot escape to the mountain, because I fear the disaster will catch up with me and I will die.
  preserved_meaning: Lot cannot flee toward the mountain because he fears the approaching calamity will reach and kill him.
  reasoning_layer_used: Lexical decisions for פֶּן, תִּדְבָּקַנִי, הָרָעָה, and וָמַתִּי, confirmed by the grounding review.
  rationale: The explicit cause-and-feared-result connection is preserved without the elevated word “lest.”
interpretive_expansions:
- pob_phrase: lest the disaster overtake me and I die
  rendering: because I fear the disaster will catch up with me and I will die
  claim: The consequence is Lot’s expressed fear and explains why he says he cannot flee to the mountain.
  evidence:
  - Hebrew פֶּן introduces a feared consequence.
  - The immediate clause links that danger to escaping toward the mountain.
  confidence: high
  alternatives_preserved:
