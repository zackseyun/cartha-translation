translation:
  language: en
  text: They struck the men at the entrance of the house with blindness, from the least to the greatest. They kept trying to find the doorway until they were exhausted.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Hebrew word may mean a blinding daze or visual confusion, not simply ordinary blindness.
    reason: lexical_alternative
