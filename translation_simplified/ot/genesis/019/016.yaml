translation:
  language: en
  text: But he delayed. So the men[a] seized his hand, his wife’s hand, and the hands of his two daughters. Because Yahweh had compassion on him, they brought him out and placed him outside the city.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In this verse the Hebrew calls the angelic visitors “the men.”
    reason: source_note
simplification_decisions:
- pob_phrase: But he lingered
  simplified_phrase: But he delayed
  preserved_meaning: He did not leave promptly despite the urgent danger.
  reasoning_layer_used: Lexical decision for וַיִּתְמַהְמָהּ
  rationale: “Delayed” states the same action in more familiar English without reducing it to uncertainty.
- pob_phrase: because of Yahweh’s compassion for him
  simplified_phrase: Because Yahweh had compassion on him
  preserved_meaning: Yahweh’s compassion was the reason the men rescued him.
  reasoning_layer_used: Lexical decision for בְּחֶמְלַת יְהוָה עָלָיו
  rationale: A direct clause makes the divine motive easier to follow.
- pob_phrase: set him outside the city
  simplified_phrase: placed him outside the city
  preserved_meaning: The men brought him to a location beyond the city limits.
  reasoning_layer_used: Lexical decisions for וַיַּנִּחֻהוּ and מִחוּץ לָעִיר
  rationale: “Placed” clearly expresses location without suggesting abandonment.
translation_notes:
  risk_flags:
  - risk: Modern readers may assume “the men” refers to ordinary humans.
    mitigation: The footnote identifies them from context while preserving the verse’s source wording.
