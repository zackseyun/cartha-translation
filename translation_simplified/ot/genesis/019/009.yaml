translation:
  language: en
  text: “Get back!” they said. Then they added, “This one came here to live as a foreigner, and now he keeps acting like our judge! We will treat you even worse than them.” Then they pushed against Lot with great force and moved toward the door to break it down.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: This one came to live as a foreigner
  simplified_phrase: This one came here to live as a foreigner
  preserved_meaning: Lot is contemptuously described as a non-native resident.
  reasoning_layer_used: POB lexical decision for הָאֶחָד and בָּא לָגוּר
  rationale: Adding “here” makes the residents’ accusation easier to follow without changing Lot’s status.
- pob_phrase: pressed very hard against the man, against Lot
  simplified_phrase: pushed against Lot with great force
  preserved_meaning: The crowd used intense physical pressure against Lot.
  reasoning_layer_used: POB lexical decision and applied revision for וַיִּפְצְרוּ and מְאֹד
  rationale: The rewrite removes awkward apposition while retaining the physical force and intensifier.
- pob_phrase: came near to break down the door
  simplified_phrase: moved toward the door to break it down
  preserved_meaning: The crowd advanced with the intention of forcing the door open.
  reasoning_layer_used: POB lexical decision for וַיִּגְּשׁוּ לִשְׁבֹּר הַדָּלֶת
  rationale: The new wording states the movement and purpose in ordinary English while keeping the violent image.
