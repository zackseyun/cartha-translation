translation:
  language: en
  text: When God destroyed the cities of the plain, he remembered Abraham[a] and sent Lot out of the destruction as he overthrew the cities where Lot had lived.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: God “remembered Abraham” means that he regarded Abraham faithfully and acted; it does not mean that God had forgotten him.
    reason: cultural_note
simplification_decisions:
- pob_phrase: So it happened, when God destroyed the cities of the plain, that
  simplified_phrase: When God destroyed the cities of the plain
  preserved_meaning: The destruction provides the time and setting for God's action.
  reasoning_layer_used: Lexical decision for וַיְהִי and applied awkward-English revision
  rationale: A direct time clause conveys the Hebrew narrative function without a stilted frame.
- pob_phrase: sent Lot out of the midst of the overthrow
  simplified_phrase: sent Lot out of the destruction
  preserved_meaning: God caused Lot to leave the catastrophe rather than remain within it.
  reasoning_layer_used: Lexical decisions for שׁלח and מִתּוֹךְ הַהֲפֵכָה
  rationale: “Out of the destruction” clearly expresses removal from within the catastrophe.
- pob_phrase: when he overthrew the cities in which Lot had lived
  simplified_phrase: as he overthrew the cities where Lot had lived
  preserved_meaning: Lot was sent out during God's overthrow of the cities that had been his home.
  reasoning_layer_used: Lexical decisions for בַּהֲפֹךְ and the relative clause
  rationale: “As” keeps the temporal link clear without a vague second sentence or repeated “when.”
translation_notes:
  risk_flags:
  - risk: Modern readers may take “remembered” to imply that God had forgotten Abraham.
    mitigation: The footnote explains the Hebrew idiom while retaining its theological resonance.
  - risk: Replacing “overthrow” with “destruction” weakens the Hebrew noun-verb echo.
    mitigation: The verb “overthrew” preserves the source image and lexical connection.
