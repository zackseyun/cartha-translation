translation:
  language: en
  text: He looked out over Sodom and Gomorrah and the entire region of the plain. There before him, smoke was rising from the land like smoke from a furnace.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “like smoke from a kiln.”
