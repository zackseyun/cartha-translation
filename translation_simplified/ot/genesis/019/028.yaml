simplification_decisions:
- pob_phrase: over all the land of the plain
  simplified_phrase: the entire region of the plain
  preserved_meaning: He surveyed the whole geographic district of the plain.
  reasoning_layer_used: POB lexical decision for כָּל פְּנֵי אֶרֶץ הַכִּכָּר
  rationale: “Entire region” expresses the geographic scope more naturally than “all the land.”
- pob_phrase: and he saw, and behold
  simplified_phrase: There before him
  preserved_meaning: The wording presents the smoke as a sudden and vivid sight.
  reasoning_layer_used: POB lexical decisions for וַיַּרְא and וְהִנֵּה
  rationale: This removes the awkward repetition while preserving the force of “behold.”
- pob_phrase: like the smoke of a furnace
  simplified_phrase: like smoke from a furnace
  preserved_meaning: The rising smoke is compared to smoke coming from a furnace.
  reasoning_layer_used: POB lexical decision for כְּקִיטֹר הַכִּבְשָׁן
  rationale: “Smoke from” is more natural modern English without weakening the source image.
