translation:
  language: en
  text: He overthrew[a] those cities and the entire plain,[b] along with everyone who lived in the cities and all the plants that grew from the ground.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “overturned”; the Hebrew describes a catastrophic overthrow.
    reason: lexical_alternative
  - marker: b
    text: Here “the plain” means the district of the Jordan plain.
    reason: cultural_note
simplification_decisions:
- pob_phrase: all the plain
  simplified_phrase: the entire plain
  preserved_meaning: The overthrow covered the whole plain or district.
  reasoning_layer_used: POB lexical decision for כָּל הַכִּכָּר
  rationale: “Entire” states the total extent in natural English.
- pob_phrase: all the inhabitants of the cities
  simplified_phrase: everyone who lived in the cities
  preserved_meaning: Every person living in the cities was included.
  reasoning_layer_used: POB lexical decision for כָּל יֹשְׁבֵי הֶעָרִים
  rationale: This clause replaces “inhabitants” with more familiar wording.
- pob_phrase: the vegetation of the ground
  simplified_phrase: all the plants that grew from the ground
  preserved_meaning: All plant growth from the soil was included.
  reasoning_layer_used: POB lexical decision for צֶמַח הָאֲדָמָה and grounding review
  rationale: “Plants” keeps the source’s plant-life limitation while remaining clear.
