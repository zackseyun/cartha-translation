translation:
  language: en
  text: Lot went out to the men who were to marry his daughters[a] and said, “Get up! Leave this place! Yahweh is about to destroy the city.” But they thought he was joking.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean that these men had already married Lot’s daughters.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: spoke to his sons-in-law, who were to marry his daughters
  simplified_phrase: went out to the men who were to marry his daughters
  preserved_meaning: Lot warned the men who were expected to marry his daughters.
  reasoning_layer_used: Lexical decision for חֲתָנָיו and לֹקְחֵי בְנֹתָיו
  rationale: This removes the potentially confusing label while keeping the POB’s preferred relationship and noting the alternate reading.
- pob_phrase: Get up, get out of this place
  simplified_phrase: Get up! Leave this place!
  preserved_meaning: Lot urgently commanded them both to rise and to leave.
  reasoning_layer_used: Lexical decision for קוּמוּ צְּאוּ
  rationale: Two short commands preserve the abrupt urgency in more natural English.
- pob_phrase: he seemed to his sons-in-law to be joking
  simplified_phrase: they thought he was joking
  preserved_meaning: The men regarded Lot’s warning as unserious.
  reasoning_layer_used: Lexical decisions for כִּמְצַחֵק and בְּעֵינֵי
  rationale: The active wording expresses the Hebrew perception idiom directly.
