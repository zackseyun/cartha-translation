translation:
  language: en
  text: This is the account[a] of the heavens and the earth when they were created, at the time[b] Yahweh[c] God made the earth and the heavens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word 'toledot' is traditionally translated 'generations'; it can also mean 'account,' 'history,' or 'origins' when introducing historical sections in Genesis.
    reason: simplification_note
  - marker: b
    text: The Hebrew idiom 'in the day' means 'when' or 'at the time.'
    reason: simplification_note
  - marker: c
    text: Yahweh is the personal name of God, traditionally represented as 'the LORD' in English translations.
    reason: simplification_note
simplification_decisions:
- simplified_phrase: This is the account
  preserved_meaning: Applying 'generations' to non-living entities (heavens and earth) is highly unintuitive for modern readers. 'Account' is a standard lexical alternative in Genesis headings that preserves the introductory structural purpose of the Hebrew 'toledot' while sounding natural.
  reasoning_layer_used: POB audit trail
  rationale: Applying 'generations' to non-living entities (heavens and earth) is highly unintuitive for modern readers. 'Account' is a standard lexical alternative in Genesis headings that preserves the introductory structural purpose of the Hebrew 'toledot' while sounding natural.
- simplified_phrase: at the time
  preserved_meaning: The Hebrew 'beyom' is a temporal idiom. Translating it literally as 'in the day' might cause modern readers to assume a strict 24-hour day for the entire creation process, whereas 'at the time' is accurate to the idiomatic meaning and avoids misleading chronological rigidity.
  reasoning_layer_used: POB audit trail
  rationale: The Hebrew 'beyom' is a temporal idiom. Translating it literally as 'in the day' might cause modern readers to assume a strict 24-hour day for the entire creation process, whereas 'at the time' is accurate to the idiomatic meaning and avoids misleading chronological rigidity.
