translation:
  language: en
  text: Then Yahweh God took the man and placed him[a] in the garden of Eden to work it and take care of it[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'settled him' or 'caused him to rest'.
