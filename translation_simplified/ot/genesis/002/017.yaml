translation_notes:
  source_alignment_notes: Maintains strict alignment with the POB theological decision to preserve the word 'day' rather than resolving it to 'when' in the primary text. This protects the interpretive tension concerning when the physical or spiritual death occurred. It also accurately represents the emphatic double-verb construction (môt tāmût) as an absolute certainty.
  readability_notes:
  - Greatly improves reading flow by utilizing direct modern command verbs ('must not' and 'will certainly') and a natural causal conjunction ('because'). It resolves the heavy syntax of POB's literal word-order structure.
  compression_notes:
  - No interpretive or devotional thoughts were injected. Syntactic streamlining was applied without omitting any textual elements or theological structures.
  risk_flags:
