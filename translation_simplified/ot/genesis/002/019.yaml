translation:
  language: en
  text: The LORD God had formed[a] every wild animal and every bird of the sky from the ground. He brought them to the man[b] to see what he would call them. Whatever the man called each living creature, that was its name.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “formed.” The Hebrew verb normally expresses simple past action; English “had formed” reflects the likely prior action in this context.
    reason: alternative_reading
  - marker: b
    text: Or “Adam.” The Hebrew ha'adam means “the man” here and can also be rendered “Adam.”
    reason: alternative_reading
