translation:
  language: en
  text: The LORD God had formed[a] every wild animal and every bird of the sky from the ground. He brought them to the man[b]
    to see what he would call them. Whatever the man called each living creature, that was its name.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'formed.' The Hebrew verb can be translated as a simple past tense ('formed') or a past perfect tense ('had formed')
      to show that this creation happened prior to this point in the narrative.
    reason: simplification_note
  - marker: b
    text: Or 'Adam.' The Hebrew word ha'adam is a title meaning 'the man,' but it is also used as a proper name.
    reason: simplification_note
