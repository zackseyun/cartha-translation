translation:
  language: en
  text: Then Judah stepped closer to Joseph and said, “Please, my lord, allow your servant to speak to you. Do not let your anger burn against me, for you are like Pharaoh.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: came near to him
  simplified_phrase: stepped closer to Joseph
  preserved_meaning: Judah physically approached Joseph before speaking.
  reasoning_layer_used: lexical decision for וַיִּגַּשׁ and immediate context
  rationale: Naming Joseph clarifies the pronoun while preserving Judah’s solemn movement toward him.
- pob_phrase: let your servant speak a word in my lord’s hearing
  simplified_phrase: allow your servant to speak to you
  preserved_meaning: Judah respectfully asks permission to address Joseph.
  reasoning_layer_used: lexical decisions for the polite request and Hebrew hearing idiom
  rationale: Natural English conveys the request without the opaque idiom or redundant titles.
- pob_phrase: do not let your anger burn against your servant
  simplified_phrase: do not let your anger burn against me
  preserved_meaning: Judah asks Joseph not to direct his intense anger at him.
  reasoning_layer_used: lexical decision preserving the Hebrew anger metaphor
  rationale: Using “me” avoids stiff repetition while retaining the image of burning anger.
translation_notes:
  risk_flags:
  - risk: Replacing the second “your servant” with “me” slightly reduces the courtly repetition.
    mitigation: The first “your servant” retains Judah’s deferential self-description.
