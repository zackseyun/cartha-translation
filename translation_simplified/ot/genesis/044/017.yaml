translation:
  language: en
  text: But he said, “I would never do such a thing! The man who was found to have the cup will become my servant.[a] But you may go back to your father in peace.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can mean “servant” or “slave”; “slave” fits the punishment of forced bondage here.
    reason: lexical_alternative
