translation:
  language: en
  text: Isn’t this the cup my master drinks from and surely uses for divination? You have done evil by doing this.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Is this not the one from which my master drinks
  simplified_phrase: Isn’t this the cup my master drinks from
  preserved_meaning: The rhetorical question identifies the cup used by the steward’s master.
  reasoning_layer_used: POB lexical decisions for הֲלֹא, זֶה, and אֲשֶׁר יִשְׁתֶּה אֲדֹנִי בּוֹ
  rationale: Naming the cup directly and ending with “from” makes the sentence natural without changing its reference.
- pob_phrase: and by which he indeed practices divination
  simplified_phrase: and surely uses for divination
  preserved_meaning: The cup is emphatically described as an instrument of the master’s divination.
  reasoning_layer_used: POB lexical and theological decisions for נַחֵשׁ יְנַחֵשׁ and בּוֹ
  rationale: “Surely uses” preserves the Hebrew emphasis while avoiding the formal wording “by which.”
- pob_phrase: You have done evil in doing this
  simplified_phrase: You have done evil by doing this
  preserved_meaning: Their specific action is condemned as evil.
  reasoning_layer_used: POB lexical decision and applied revision for הֲרֵעֹתֶם אֲשֶׁר עֲשִׂיתֶם
  rationale: “By doing this” states the connection more naturally while retaining the moral force of “evil.”
translation_notes:
  risk_flags:
  - risk: Readers may take the steward’s words as the narrator’s judgment that Joseph actually practiced divination.
    mitigation: The direct accusation is retained because the POB requires translating the steward’s claim without harmonizing it.
