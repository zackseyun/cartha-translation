  text: “If the cup is found with any one of us, let that person die, and all of us will also become my lord’s slaves.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In Hebrew, the brothers respectfully call themselves “your servants,” then use the same word for the actual slavery they offer as punishment.
