translation:
  language: en
  text: Then he ordered the man in charge of his household, “Load the men's sacks with all the food they can carry. Put each man's silver in the mouth of his sack[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “mouth” of a sack is its opening.
    reason: lexical_alternative
