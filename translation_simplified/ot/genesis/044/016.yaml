translation:
  language: en
  text: 'Judah said, “What can we say to you, my lord? What defense can we make? How can we prove that we are in the right? God has exposed the guilt of your servants. Here we are, my lord: we are your slaves—both the rest of us and the one in whose possession the cup was found.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: What shall we say to my lord? What shall we speak?
  simplified_phrase: What can we say to you, my lord? What defense can we make?
  preserved_meaning: Judah says they have no words or defense left to offer Joseph.
  reasoning_layer_used: Lexical decisions for נֹּאמַר and נְּדַבֵּר
  rationale: Natural questions preserve the buildup from speaking to presenting a defense.
- pob_phrase: how shall we justify ourselves?
  simplified_phrase: How can we prove that we are in the right?
  preserved_meaning: Judah asks how they could show themselves to be in the right.
  reasoning_layer_used: Lexical decision for נִּצְטַדָּק and footnote a
  rationale: This explains the legal sense of “justify” in common English.
- pob_phrase: God has found out the guilt of your slaves. Here we are, my lord’s slaves
  simplified_phrase: 'God has exposed the guilt of your servants. Here we are, my lord: we are your slaves'
  preserved_meaning: The first term is deferential, while the second offers the brothers for actual bondage.
  reasoning_layer_used: Lexical decisions for מָצָא אֶת עֲוֺן, עֲבָדֶיךָ / עֲבָדִים, and הִנֶּנּוּ
  rationale: The wording preserves both exposed guilt and the deliberate servants-to-slaves distinction.
translation_notes:
  risk_flags:
  - risk: “What defense can we make?” states the forensic force of “speak” more directly.
    mitigation: The lexical audit explicitly allows the sense of presenting a case.
  - risk: “In whose possession” replaces the concrete expression “in whose hand.”
    mitigation: It clearly preserves the legal sense that the cup was found under that person’s control.
