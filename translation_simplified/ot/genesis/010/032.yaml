simplification_decisions:
- pob_phrase: the families of the sons of Noah
  simplified_phrase: the family groups descended from Noah’s sons
  preserved_meaning: The verse summarizes the kinship groups that came from Noah’s sons.
  reasoning_layer_used: POB lexical decision for מִשְׁפְּחֹת and the genealogical context
  rationale: “Family groups” clearly conveys extended kinship divisions without the technical tone of “clans.”
- pob_phrase: according to their generations, by their nations
  simplified_phrase: according to their family lines, within their nations
  preserved_meaning: Family lines and nations remain distinct descriptions of how the groups are identified.
  reasoning_layer_used: POB lexical decisions for לְתוֹלְדֹתָם and בְּגוֹיֵהֶם
  rationale: The wording preserves both qualifiers while making “generations” easier to understand.
- pob_phrase: the nations were separated on the earth
  simplified_phrase: the nations became separate and spread out over the earth
  preserved_meaning: The nations divided from one another and dispersed across the earth.
  reasoning_layer_used: POB lexical decision for נִפְרְדוּ and theological decision on global אֶרֶץ
  rationale: The phrase keeps the idea of separation while making the resulting worldwide dispersion clear.
