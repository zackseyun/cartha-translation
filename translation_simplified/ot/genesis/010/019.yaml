  preserved_meaning: The boundary began at Sidon and belonged to the collective Canaanite people.
  reasoning_layer_used: POB lexical decisions for וַיְהִי, גְּבוּל, and הַכְּנַעֲנִי
  rationale: “Ran from” makes the geographic boundary easier to picture while retaining the collective “Canaanites.”
- pob_phrase: as you go toward Gerar ... and as you go toward Sodom
  simplified_phrase: toward Gerar ... and toward Sodom
  preserved_meaning: Both phrases describe the directions and extent of the border.
  reasoning_layer_used: POB lexical decision for בֹּאֲכָה
  rationale: Removing “as you go” gives a more direct route description without adding a sequence.
