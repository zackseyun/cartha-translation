translation:
  language: en
  text: He moved on from there and dug another well. This time, they did not quarrel over it. He named the well Rehoboth.[a] He said, “Now Yahweh has made room for us, and we will be fruitful in the land.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rehoboth sounds like the Hebrew words for “broad places” or “wide spaces.” The name connects with Isaac’s words, “Yahweh has made room for us.”
    reason: lexical_alternative
