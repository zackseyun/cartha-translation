- pob_phrase: He moved from there and dug another well, and they did not quarrel over it.
  simplified_phrase: He moved on from there and dug another well. This time, they did not quarrel over it.
  preserved_meaning: Isaac relocated, dug a new well, and faced no dispute over it.
  reasoning_layer_used: POB lexical decisions and immediate narrative context
  rationale: Two short sentences make the sequence and contrast with the earlier disputes easier to follow.
- pob_phrase: he called its name Rehoboth
  simplified_phrase: He named the well Rehoboth.
  preserved_meaning: Isaac gave the well the place-name Rehoboth.
  reasoning_layer_used: POB lexical decision for the Hebrew naming formula
  rationale: “Named the well” expresses the Hebrew formula in ordinary English without an unclear pronoun.
- pob_phrase: For now Yahweh has made room for us
  simplified_phrase: Now Yahweh has made room for us
  preserved_meaning: Isaac recognizes that Yahweh has at last given his household space without conflict.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Removing the awkward opening “For” gives natural English while retaining the timing, wordplay, and divine name.
