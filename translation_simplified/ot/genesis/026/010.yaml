simplification_decisions:
- pob_phrase: What is this you have done to us?
  simplified_phrase: What have you done to us?
  preserved_meaning: Abimelech forcefully confronts Isaac about the danger he created for the whole community.
  reasoning_layer_used: POB lexical decision for מַה זֹּאת עָשִׂיתָ לָּנוּ
  rationale: The shorter question is more natural in modern English while retaining the accusation and communal object.
- pob_phrase: might easily have lain with your wife
  simplified_phrase: could easily have had sexual relations with your wife
  preserved_meaning: The act was dangerously close to happening and refers specifically to sexual relations.
  reasoning_layer_used: POB lexical decisions for כִּמְעַט and שָׁכַב ... אֶת אִשְׁתֶּךָ
  rationale: The wording makes the sexual idiom immediately clear while the footnote preserves the alternate reading “almost.”
- pob_phrase: brought guilt upon us
  simplified_phrase: brought guilt on us
  preserved_meaning: The people would have incurred objective moral culpability, not merely social blame.
  reasoning_layer_used: POB theological decision on אָשָׁם
  rationale: Removing the formal “upon” improves readability without weakening the moral-religious force of “guilt.”
