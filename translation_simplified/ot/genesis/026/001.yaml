translation:
  language: en
  text: There was another famine in the land—not the earlier famine during Abraham’s lifetime. So Isaac went to Abimelech, king of the Philistines, at Gerar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also explicitly indicate that Isaac went toward Gerar.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a famine in the land, besides the first famine
  simplified_phrase: another famine in the land—not the earlier famine
  preserved_meaning: This famine was distinct from the famine in Abraham’s time.
  reasoning_layer_used: Lexical decisions for מִלְּבַד and הָרָעָב הָרִאשׁוֹן
  rationale: “Another” and “not the earlier famine” make the comparison immediately clear.
- pob_phrase: that had been in the days of Abraham
  simplified_phrase: during Abraham’s lifetime
  preserved_meaning: The earlier famine occurred while Abraham was alive.
  reasoning_layer_used: Lexical decision for אֲשֶׁר הָיָה בִּימֵי אַבְרָהָם
  rationale: “During Abraham’s lifetime” expresses the time reference in common English.
