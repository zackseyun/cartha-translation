translation:
  language: en
  text: I will make your offspring as numerous as the stars in the heavens. I will give your offspring all these lands, and all the nations of the earth will be blessed in your offspring.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “all the nations of the earth will bless themselves by your offspring.” The Hebrew can have this meaning, though “will be blessed” fits the covenant promise well.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: I will multiply your offspring like the stars of the heavens
  simplified_phrase: I will make your offspring as numerous as the stars in the heavens
  preserved_meaning: God promises to cause Isaac’s offspring to become as numerous as the stars.
  reasoning_layer_used: Lexical decisions for וְהִרְבֵּיתִי and כְּכוֹכְבֵי הַשָּׁמַיִם
  rationale: The wording states the numerical comparison directly while preserving the star image and God’s action.
- pob_phrase: and I will give to your offspring all these lands
  simplified_phrase: I will give your offspring all these lands
  preserved_meaning: God promises the identified lands to Isaac’s collective offspring.
  reasoning_layer_used: Lexical decisions for וְנָתַתִּי, לְזַרְעֲךָ, and כָּל הָאֲרָצֹת הָאֵל
  rationale: Removing the unnecessary “to” produces natural English without changing the promise.
- pob_phrase: one long sentence joined by repeated “and” clauses
  simplified_phrase: two sentences with the promises grouped clearly
  preserved_meaning: The three covenant promises remain distinct and in their original order.
  reasoning_layer_used: POB syntax and optimal-equivalence philosophy
  rationale: Dividing the sentence makes each promise easier to follow.
translation_notes:
  risk_flags:
  - risk: The phrase “in your offspring” may sound unusual in modern English.
    mitigation: It is retained because POB preserves the Hebrew wording and its covenantal tension rather than resolving it as “through.”
  - risk: The Hebrew blessing verb may be passive or reflexive.
    mitigation: The main text keeps POB’s passive reading, while the footnote preserves the reflexive alternative.
