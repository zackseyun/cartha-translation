translation:
  language: en
  text: Stay in this land.[a] I will be with you and bless you, for I will give all these lands to you and your offspring.[b] I will also uphold the oath I swore to your father Abraham.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can mean to live there for a time as a foreigner.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “seed,” used here collectively for offspring.
    reason: lexical_alternative
  - marker: c
    text: Or “confirm” or “fulfill” the oath.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Stay in this land, and I will be with you and bless you
  simplified_phrase: Stay in this land. I will be with you and bless you
  preserved_meaning: God commands Isaac to remain and promises his presence and blessing.
  reasoning_layer_used: POB lexical decisions for גּוּר and the covenant-presence formula
  rationale: Dividing the sentence makes the command and promise easier to follow.
- pob_phrase: to you and to your offspring I will give all these lands
  simplified_phrase: I will give all these lands to you and your offspring
  preserved_meaning: God promises the territories to Isaac and his collective line.
  reasoning_layer_used: POB lexical and theological decisions for זֶרַע and אֲרָצוֹת
  rationale: Ordinary English word order clarifies the recipient while retaining “offspring” and “lands.”
- pob_phrase: I will establish the oath that I swore to Abraham your father
  simplified_phrase: I will also uphold the oath I swore to your father Abraham
  preserved_meaning: God will stand behind the solemn promise previously sworn to Abraham.
  reasoning_layer_used: POB lexical and theological decisions for וַהֲקִמֹתִי and הַשְּׁבֻעָה
  rationale: “Uphold” is clearer than “establish” while preserving the oath’s binding force.
