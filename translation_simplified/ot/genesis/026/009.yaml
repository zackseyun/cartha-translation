translation:
  language: en
  text: So Abimelech called Isaac and said, “She is certainly your wife! How could you say, ‘She is my sister’?” Isaac answered, “Because I was afraid someone might kill me because of her.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Surely, she is your wife!
  simplified_phrase: She is certainly your wife!
  preserved_meaning: Abimelech emphatically declares that she is Isaac’s wife.
  reasoning_layer_used: Lexical decision for אַךְ and the applied revision
  rationale: “Certainly” keeps the emphatic statement while sounding natural in modern English.
- pob_phrase: So how could you say
  simplified_phrase: How could you say
  preserved_meaning: Abimelech reproaches Isaac with an incredulous question.
  reasoning_layer_used: Lexical decision for וְאֵיךְ
  rationale: The question itself clearly carries the connection and reproach.
- pob_phrase: Because I said, ‘Lest I die because of her.’
  simplified_phrase: Because I was afraid someone might kill me because of her.
  preserved_meaning: Isaac feared being killed on account of his wife.
  reasoning_layer_used: Lexical decisions for פֶּן and עָלֶיהָ, with POB footnote a
  rationale: The feared outcome is stated directly instead of using the uncommon word “lest.”
interpretive_expansions:
- pob_phrase: Lest I die because of her
  rendering: I was afraid someone might kill me because of her
  claim: Isaac feared that another person would kill him to obtain Rebekah.
  evidence:
  - The POB footnote explains this as men killing Isaac because of her.
  - The particle rendered “lest” marks a feared possible outcome.
  confidence: high
  alternatives_preserved:
  - I might die because of her
  - I might be killed on account of her
translation_notes:
  risk_flags:
  - risk: Naming an unnamed killer makes the cause of Isaac’s feared death explicit.
    mitigation: The POB footnote directly identifies the sense as men killing him because of Rebekah.
