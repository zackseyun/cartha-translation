translation:
  language: en
  text: When Isaac had lived there a long time, Abimelech, king of the Philistines, looked out through the window. He saw Isaac laughing with Rebekah, his wife.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “playing with,” “showing affection to,” or “caressing.” The behavior showed that Rebekah was Isaac’s wife, and the verb is related to Isaac’s name.
    reason: lexical_alternative
