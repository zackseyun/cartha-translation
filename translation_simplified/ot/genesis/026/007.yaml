  preserved_meaning: The people asking were specifically local men.
  reasoning_layer_used: POB lexical decision for אַנְשֵׁי הַמָּקוֹם
  rationale: This replaces an unnatural phrase while preserving the masculine local group.
- pob_phrase: lest the men of the place kill me
  simplified_phrase: because he thought, “The men here may kill me”
  preserved_meaning: Isaac feared that identifying Rebekah as his wife could lead the local men to kill him.
  reasoning_layer_used: POB lexical decisions for פֶּן and יַהַרְגֻנִי
  rationale: Putting the fear into Isaac’s thought removes archaic “lest” and resolves the abrupt shift to first person.
- pob_phrase: beautiful in appearance
  simplified_phrase: beautiful
  preserved_meaning: Rebekah was physically beautiful.
  reasoning_layer_used: POB lexical decision for טוֹבַת מַרְאֶה
  rationale: In this context, the common word “beautiful” already communicates pleasing appearance.
