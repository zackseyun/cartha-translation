translation:
  language: en
  text: When the men who lived there asked about his wife, Isaac said, “She is my sister.” He was afraid to say, “She is my wife,” because he thought, “The men here may kill me because of Rebekah, since she is beautiful.”
  philosophy: optimal-equivalence
