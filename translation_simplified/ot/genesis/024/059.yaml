simplification_decisions:
- pob_phrase: sent away Rebekah their sister
  simplified_phrase: sent their sister Rebekah on her way
  preserved_meaning: Rebekah’s family formally allowed and dispatched her to leave on the journey.
  reasoning_layer_used: POB lexical decision for וַיְשַׁלְּחוּ and immediate narrative context
  rationale: “Sent on her way” expresses departure naturally without reducing the action to merely sending a message or object.
- pob_phrase: and her nurse, and Abraham’s servant, and his men
  simplified_phrase: along with her nurse, Abraham’s servant, and his men
  preserved_meaning: Rebekah departed in the company of all three named parties.
  reasoning_layer_used: POB lexical decisions and Hebrew coordination
  rationale: “Along with” makes the travel group clear while retaining each distinct person or group.
