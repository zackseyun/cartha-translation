translation:
  language: en
  text: They blessed Rebekah and said to her, “Our sister, may your descendants number countless thousands,[a] and may your offspring take control of the gate of those who hate him.”[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “may you become thousands of ten thousands.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew treats “offspring” as a collective singular, so “him” can refer to the offspring as a whole.
    reason: source_note
  - marker: c
    text: A city’s gate represented its strength and control.
    reason: cultural_note
