translation:
  language: en
  text: Now, if you are going to treat my master with kindness and faithfulness, say so. If not, tell me. Then I will turn to the right or to the left.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Turn to the right or to the left” means to take another course of action.
    reason: simplification_note
simplification_decisions:
- pob_phrase: show kindness and faithfulness to my master
  simplified_phrase: treat my master with kindness and faithfulness
  preserved_meaning: The family is being asked to act kindly and dependably toward the servant’s master.
  reasoning_layer_used: POB lexical decision for חֶסֶד וֶאֱמֶת
  rationale: “Treat” makes the relational action clear while preserving kindness and faithfulness.
- pob_phrase: tell me; but if not, tell me
  simplified_phrase: say so. If not, tell me.
  preserved_meaning: The servant asks for a direct answer whether the family agrees or refuses.
  reasoning_layer_used: POB lexical and discourse decisions for הַגִּידוּ לִי and וְאִם לֹא
  rationale: Short sentences clearly preserve the request for either answer.
- pob_phrase: so that I may turn
  simplified_phrase: Then I will turn
  preserved_meaning: After their answer, the servant intends to pursue another course if necessary.
  reasoning_layer_used: POB lexical decision for the cohortative וְאֶפְנֶה and grounding review
  rationale: “Will” expresses resolved consequent action without suggesting mere ability.
