translation:
  language: en
  text: When you go to my family, you will be released from the oath I placed on you.[a] If they refuse to give her to you, you will be released from that oath.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “from my curse”; the Hebrew word can refer to an oath together with its threatened penalty.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: you will be free from my oath
  simplified_phrase: you will be released from the oath I placed on you
  preserved_meaning: The servant is no longer bound by the sworn obligation Abraham imposed.
  reasoning_layer_used: Lexical and theological decisions for תִּנָּקֶה and מֵאָלָתִי
  rationale: “Released” makes the legal sense of freedom from an obligation clearer.
- pob_phrase: and if they do not give to you
  simplified_phrase: If they refuse to give her to you
  preserved_meaning: Abraham’s family may decline to provide the prospective bride.
  reasoning_layer_used: Lexical decision for וְאִם לֹא יִתְּנוּ לָךְ and narrative context
  rationale: The shorter sentence supplies the understood object and states the refusal naturally.
- pob_phrase: Then ... when ...; and if ...
  simplified_phrase: When ... . If ...
  preserved_meaning: The servant must approach Abraham’s family but is released if they refuse.
  reasoning_layer_used: Lexical decision for כִּי and source clause sequence
  rationale: Two sentences make the conditions easier to follow without combining them.
