translation:
  language: en
  text: The servant asked him, “What if the woman is not willing to follow me to this land? Should I then take your son back to the land you came from?”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And the servant said to him
  simplified_phrase: The servant asked him
  preserved_meaning: The servant addresses Abraham with a question.
  reasoning_layer_used: Immediate syntax and narrative context
  rationale: Using “asked” makes the function of his speech immediately clear.
- pob_phrase: Perhaps the woman will not be willing
  simplified_phrase: What if the woman is not willing
  preserved_meaning: The servant raises the possibility that the woman may refuse.
  reasoning_layer_used: POB lexical decision for אוּלַי and לֹא תֹאבֶה
  rationale: “What if” expresses the uncertainty naturally without weakening the woman’s willingness or consent.
- pob_phrase: the land from which you came
  simplified_phrase: the land you came from
  preserved_meaning: The servant refers to Abraham’s former homeland.
  reasoning_layer_used: POB lexical decision for אֶל הָאָרֶץ אֲשֶׁר יָצָאתָ מִשָּׁם
  rationale: The shorter clause is ordinary modern English and keeps the same place reference.
translation_notes:
  risk_flags:
  - risk: “Take your son back” may sound as though Isaac had lived there before.
    mitigation: The wording is retained because the Hebrew and POB deliberately preserve the force of “back.”
