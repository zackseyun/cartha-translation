translation:
  language: en
  text: Instead, go to my land and to my relatives,[a] and take a wife for my son Isaac.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “to my birthplace”; the Hebrew can refer either to a person’s place of origin or to their relatives, but the context favors relatives.
