  preserved_meaning: The command contrasts with the earlier ban on choosing a Canaanite wife.
  reasoning_layer_used: Lexical decisions for כִּי and the directive force of תֵּלֵךְ.
  rationale: “Instead, go” states the contrast and command in direct modern English.
- pob_phrase: to my land and to my kindred
  simplified_phrase: to my land and to my relatives
  preserved_meaning: The servant must go to Abraham’s land and kinship group.
  reasoning_layer_used: Lexical decisions for אֶל אַרְצִי and וְאֶל מוֹלַדְתִּי.
  rationale: “Relatives” is clearer than “kindred,” while the footnote preserves the place-of-origin alternative.
