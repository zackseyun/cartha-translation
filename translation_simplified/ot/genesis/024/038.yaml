translation:
  language: en
  text: No. Instead, you must go to my father’s household and my extended family, and find a wife for my son.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: But you shall go
  simplified_phrase: No. Instead, you must go
  preserved_meaning: The words emphatically correct the preceding option and give the servant an obligation.
  reasoning_layer_used: POB lexical decision for אִם לֹא and תֵּלֵךְ
  rationale: A short correction followed by “must” makes the contrast and command clear.
- pob_phrase: my father's house and to my clan
  simplified_phrase: my father’s household and my extended family
  preserved_meaning: The servant must go to Abraham’s paternal household and wider kinship group.
  reasoning_layer_used: POB lexical decisions and clan footnote
  rationale: “Household” and “extended family” prevent readers from picturing only a building or immediate family.
- pob_phrase: take a wife for my son
  simplified_phrase: find a wife for my son
  preserved_meaning: The servant is to secure a woman to become the son’s wife through the marriage arrangement.
  reasoning_layer_used: POB lexical decisions for וְלָקַחְתָּ, אִשָּׁה, and לִבְנִי
  rationale: “Find a wife” states the servant’s task naturally without suggesting physical seizure.
