translation:
  language: en
  text: 'My master made me swear: “You must not choose a wife for my son from among the Canaanite women in the land where I live.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: saying
  simplified_phrase: ':'
  preserved_meaning: The master’s words still follow as direct speech.
  reasoning_layer_used: POB lexical decision for לֵאמֹר
  rationale: A colon introduces the quotation naturally in modern English.
- pob_phrase: You shall not take a wife
  simplified_phrase: You must not choose a wife
  preserved_meaning: The servant is solemnly forbidden to select a wife for the son.
  reasoning_layer_used: POB lexical decisions for לֹא תִקַּח and אִשָּׁה, supported by the marriage-arrangement context
  rationale: “Must not choose” clearly expresses the prohibition in this marriage arrangement.
- pob_phrase: from the daughters of the Canaanites, in whose land I am dwelling
  simplified_phrase: from among the Canaanite women in the land where I live
  preserved_meaning: The wife must not come from the Canaanite population of the land where Abraham lives.
  reasoning_layer_used: POB lexical decisions and footnote for מִבְּנוֹת הַכְּנַעֲנִי and אֲשֶׁר אָנֹכִי יֹשֵׁב בְּאַרְצוֹ
  rationale: This wording clearly retains both the Canaanite population and the land relationship.
translation_notes:
  risk_flags:
  - risk: “Choose” makes the selection aspect more explicit than the Hebrew image of taking a wife.
    mitigation: The marriage-arrangement context establishes selection as the intended action.
  - risk: The Hebrew uses “the Canaanite” as a singular collective expression.
    mitigation: “Canaanite women” naturally conveys the collective group without implying individual land ownership.
