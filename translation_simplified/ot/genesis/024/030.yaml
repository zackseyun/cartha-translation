translation:
  language: en
  text: When he saw the nose ring[a] and the bracelets on his sister’s wrists, and heard his sister Rebekah say, “This is what the man said to me,” he went to the man. There was the man, standing by the camels at the spring.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can mean “ring,” but “nose ring” follows Genesis 24:47.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And it happened, when he saw ... that he went to the man
  simplified_phrase: When he saw ... he went to the man
  preserved_meaning: Seeing the jewelry and hearing Rebekah’s report preceded his going to the man.
  reasoning_layer_used: The lexical decisions identify the clauses as temporal circumstances in the narrative sequence.
  rationale: Removing the heavy framing gives the same sequence in natural English.
- pob_phrase: the bracelets on his sister’s hands
  simplified_phrase: the bracelets on his sister’s wrists
  preserved_meaning: The bracelets were being worn by his sister.
  reasoning_layer_used: The lexical decision lists “wrists” as an idiomatic alternative for Hebrew “hands.”
  rationale: Modern readers normally describe bracelets as worn on the wrists.
- pob_phrase: And behold, he was standing by the camels at the spring
  simplified_phrase: There was the man, standing by the camels at the spring
  preserved_meaning: The man is vividly presented as already standing beside the camels at the water source.
  reasoning_layer_used: The lexical decisions preserve the vivid force of “behold,” the ongoing posture, and the locative senses.
  rationale: “There was the man” keeps the vivid discovery without archaic wording.
translation_notes:
  risk_flags:
  - risk: Changing “hands” to “wrists” is less formally literal.
    mitigation: “Wrists” is documented in the POB alternatives and preserves where bracelets are worn.
  - risk: “There was the man” may carry less force than “behold.”
    mitigation: The presentational wording still makes the scene immediate and vivid.
