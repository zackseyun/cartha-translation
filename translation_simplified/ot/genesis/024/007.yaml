translation:
  language: en
  text: Yahweh, the God of heaven, took me away from my father’s household and the land where I was born. He spoke to me and swore, ‘I will give this land to your offspring.’ He will send his angel ahead of you, and you must find a wife from there for my son.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “his messenger.” The Hebrew word can mean either “messenger” or “angel,” but a heavenly messenger is more likely here.
    reason: lexical_alternative
