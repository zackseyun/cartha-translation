translation:
  language: en
  text: Then I asked her, “Whose daughter are you?” She answered, “I am the daughter of Bethuel, the son Milcah bore to Nahor.” Then I put the nose ring on her nose and the bracelets on her wrists.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew says “hands,” but the word can also include the wrists or arms.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: asked her, saying
  simplified_phrase: asked her
  preserved_meaning: The question itself is what he said to her.
  reasoning_layer_used: applied revision and Hebrew narrative construction
  rationale: Removing the redundant speech formula makes the sentence natural without losing the act of speaking.
- pob_phrase: The daughter of Bethuel son of Nahor, whom Milcah bore to him
  simplified_phrase: I am the daughter of Bethuel, the son Milcah bore to Nahor
  preserved_meaning: Bethuel was born to Milcah and Nahor, and the woman is Bethuel’s daughter.
  reasoning_layer_used: lexical decision for the genealogy and maternal clause
  rationale: Naming Nahor instead of using “him” makes the family relationship immediately clear.
- pob_phrase: the ring on her nose
  simplified_phrase: the nose ring on her nose
  preserved_meaning: The ring was an ornament placed on her nose.
  reasoning_layer_used: lexical decisions for הַנֶּזֶם and עַל אַפָּהּ
  rationale: Calling it a nose ring identifies the unfamiliar ornament while keeping its exact placement.
