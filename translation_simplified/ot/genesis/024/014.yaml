translation_notes:
  risk_flags:
  - risk: The Hebrew may identify Isaac, rather than the speaker, as “your servant.”
    mitigation: The main text follows the controlling POB decision, and the appositional reading remains in a footnote.
  - risk: “She will be the sign” explains the function of the literal phrase “by her.”
    mitigation: The wording retains the woman as the referent and limits her role to identifying God’s answer.
