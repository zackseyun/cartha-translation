simplification_decisions:
- pob_phrase: make you swear by Yahweh
  simplified_phrase: make you swear an oath by Yahweh
  preserved_meaning: The servant must take a solemn oath with Yahweh as its witness.
  reasoning_layer_used: Lexical decision for וְאַשְׁבִּיעֲךָ and בַּיהוָה
  rationale: Adding “an oath” makes the act clear while preserving the causative force.
- pob_phrase: that you shall not take a wife for my son
  simplified_phrase: You must not choose a wife for my son
  preserved_meaning: The oath forbids selecting a Canaanite woman as the son’s wife.
  reasoning_layer_used: Lexical decision for אֲשֶׁר לֹא תִקַּח and אִשָּׁה לִבְנִי
  rationale: A direct sentence and “must not choose” express the oath’s command in natural English.
- pob_phrase: from the daughters of the Canaanites
  simplified_phrase: from the women of the Canaanite people
  preserved_meaning: The prohibited women belong to the Canaanite people among whom Abraham lives.
  reasoning_layer_used: Lexical decision for מִבְּנוֹת הַכְּנַעֲנִי
  rationale: The wording explains the Hebrew people-group idiom without changing its ethnic reference.
translation_notes:
  risk_flags:
  - risk: “Choose” may sound less formal than arranging a marriage.
    mitigation: The phrase “a wife for my son” keeps the marriage-setting meaning explicit.
