translation:
  language: en
  text: 'I will make you swear an oath by Yahweh,[a] the God of heaven and the God of the earth: You must not choose a wife for my son from the women of the Canaanite people, among whom I live.'
  philosophy: optimal-equivalence
  footnotes:
