translation:
  language: en
  text: So the man entered the house. He unloaded the camels[a] and gave them straw and feed. He also gave water for himself and the men with him to wash their feet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “opened the camels,” an idiom that may mean unloaded, unsaddled, or loosed them.
    reason: lexical_alternative
