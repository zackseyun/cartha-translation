  text: Then Laban and Bethuel replied, “This matter comes from Yahweh. We cannot say anything to you that would oppose or change it.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says, “speak to you bad or good,” an idiom meaning they could not oppose or alter what Yahweh had determined.
