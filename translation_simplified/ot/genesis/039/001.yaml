translation:
  language: en
  text: Joseph had been brought down to Egypt. Potiphar was an Egyptian officer of Pharaoh[a] and captain of the guard. He bought Joseph from the Ishmaelites who had brought him down there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word for “officer” can also mean “eunuch.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Joseph had been brought down to Egypt, and Potiphar ... bought him
  simplified_phrase: Joseph had been brought down to Egypt. Potiphar ... bought Joseph
  preserved_meaning: Joseph’s arrival in Egypt happened before Potiphar bought him.
  reasoning_layer_used: POB lexical decision for הוּרַד and English readability
  rationale: Splitting the long sentence clarifies the sequence without changing it.
- pob_phrase: Potiphar, an officer of Pharaoh, the captain of the guard, an Egyptian
  simplified_phrase: Potiphar was an Egyptian officer of Pharaoh and captain of the guard
  preserved_meaning: Potiphar was Egyptian, served Pharaoh, and commanded the guard.
  reasoning_layer_used: POB lexical decisions and applied revision
  rationale: Turning the stacked titles into a full sentence makes Potiphar’s roles easier to follow.
- pob_phrase: bought him from the Ishmaelites who had brought him down there
  simplified_phrase: He bought Joseph from the Ishmaelites who had brought him down there
  preserved_meaning: Potiphar purchased Joseph from the people who transported him to Egypt.
  reasoning_layer_used: POB lexical decisions for וַיִּקְנֵהוּ and the repeated ירד motif
  rationale: Naming Joseph removes an unclear pronoun while retaining the repeated “brought down” image.
