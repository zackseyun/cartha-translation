translation:
  language: en
  text: So he left everything he owned in Joseph’s hands. He no longer kept track of anything Joseph managed, except for the food Potiphar ate.[a] Joseph was well-built and handsome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “bread,” here meaning food generally.
    reason: lexical_alternative
