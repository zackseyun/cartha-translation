- pob_phrase: all that he had in Joseph’s hand
  simplified_phrase: everything he owned in Joseph’s hands
  preserved_meaning: Potiphar placed all his holdings under Joseph’s control.
  reasoning_layer_used: Lexical decisions for כָּל אֲשֶׁר לוֹ and בְּיַד יוֹסֵף
  rationale: Natural wording retains the hand image for Joseph’s control.
- pob_phrase: he knew nothing with him except the food that he ate
  simplified_phrase: He no longer kept track of anything Joseph managed, except for the food Potiphar ate
  preserved_meaning: Potiphar did not oversee Joseph’s work but still attended to his own food.
  reasoning_layer_used: Lexical rationale and Genesis 39:4–5 context
  rationale: The opaque idiom is clarified, and naming Potiphar prevents a misleading pronoun reference.
- pob_phrase: handsome in form and handsome in appearance
  simplified_phrase: well-built and handsome
  preserved_meaning: Joseph had an attractive physique and overall appearance.
  reasoning_layer_used: Lexical decisions for יְפֵה תֹאַר and וִיפֵה מַרְאֶה
  rationale: The concise wording preserves both physique and visible attractiveness.
