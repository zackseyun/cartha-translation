translation:
  language: en
  text: From the time the Egyptian put Joseph in charge of his household and everything he owned, Yahweh blessed the Egyptian’s household because of Joseph. Yahweh’s blessing rested on everything he owned, in the house and in the field.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: from the time he appointed him over his house and over all that he had
  simplified_phrase: From the time the Egyptian put Joseph in charge of his household and everything he owned
  preserved_meaning: Joseph received authority over the Egyptian’s entire household and property.
  reasoning_layer_used: Lexical decisions for הִפְקִיד, בְּבֵיתוֹ, and וְעַל כָּל אֲשֶׁר יֶשׁ־לוֹ.
  rationale: “Put in charge” and “everything he owned” state the delegated authority in ordinary English.
- pob_phrase: Yahweh blessed the Egyptian’s house
  simplified_phrase: Yahweh blessed the Egyptian’s household
  preserved_meaning: Yahweh’s favor extended to the Egyptian’s domestic estate.
  reasoning_layer_used: Lexical decision for בֵּית הַמִּצְרִי and theological decision for יְהוָה.
  rationale: “Household” avoids suggesting that only the building was blessed while retaining Yahweh’s personal name.
- pob_phrase: Yahweh’s blessing was on all that he had
  simplified_phrase: Yahweh’s blessing rested on everything he owned
  preserved_meaning: Yahweh’s blessing covered the full extent of the Egyptian’s possessions.
  reasoning_layer_used: Lexical decisions for בִּרְכַּת יְהוָה and בְּכָל אֲשֶׁר יֶשׁ־לוֹ.
  rationale: “Rested on” naturally expresses blessing present over all his property.
interpretive_expansions:
- pob_phrase: he appointed him
  rendering: the Egyptian put Joseph in charge
  claim: The pronouns refer to the Egyptian master and Joseph.
  evidence:
  - The verse explicitly names “the Egyptian” and Joseph in the following clause.
  - The immediate narrative identifies Joseph as the servant given oversight.
  confidence: high
translation_notes:
  risk_flags:
