translation:
  language: en
  text: But Yahweh was with Joseph. He showed Joseph steadfast love[a] and gave him favor with the prison warden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “loyal love” or “kindness” and describes enduring, faithful favor.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: extended covenant faithfulness to him
  simplified_phrase: showed Joseph steadfast love
  preserved_meaning: Yahweh treated Joseph with loyal, enduring love rather than mere passing kindness.
  reasoning_layer_used: lexical and theological decisions for חָסֶד, qualified by the audit’s acknowledgment that no covenant is explicitly named
  rationale: This keeps the term’s loyal force without making a formal covenant explicit.
- pob_phrase: he gave him favor in the eyes of
  simplified_phrase: gave him favor with
  preserved_meaning: Yahweh caused the prison official to regard Joseph favorably.
  reasoning_layer_used: lexical decisions for חִנּוֹ and בְּעֵינֵי
  rationale: The common English expression conveys the Hebrew idiom directly.
- pob_phrase: the chief of the prison
  simplified_phrase: the prison warden
  preserved_meaning: The official in charge of the prison favored Joseph.
  reasoning_layer_used: lexical decision for שַׂר and the applied awkward-English revision
  rationale: “Prison warden” is the natural modern title for this official.
