translation:
  language: en
  text: Joseph found favor in his master’s eyes and served him. His master put Joseph in charge of his household and placed everything he owned in Joseph’s hands.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “In Joseph’s hands” means under his authority and care.
