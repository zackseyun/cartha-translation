translation:
  language: en
  text: Can anything be too difficult for Yahweh?[a] At the set time—about this time next year—I will come back to you, and Sarah will have a son.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Can anything be too wonderful for Yahweh?” The Hebrew can describe something extraordinary or beyond one’s ability.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Is anything too difficult for Yahweh?
  simplified_phrase: Can anything be too difficult for Yahweh?
  preserved_meaning: The rhetorical question affirms Yahweh’s power to fulfill his promise.
  reasoning_layer_used: Lexical and theological decisions on הֲיִפָּלֵא and the rhetorical force
  rationale: The recast question is more conversational while keeping “too difficult” rather than overstating it as “impossible.”
- pob_phrase: At the appointed time I will return to you, about this time next year
  simplified_phrase: At the set time—about this time next year—I will come back to you
  preserved_meaning: The speaker will return at the fixed time in the same season of the following year.
  reasoning_layer_used: Lexical decisions on לַמּוֹעֵד, אָשׁוּב, and כָּעֵת חַיָּה
  rationale: “Set time” and “come back” use common English while preserving the fixed timing and return.
