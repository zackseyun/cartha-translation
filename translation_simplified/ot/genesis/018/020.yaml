translation:
  language: en
  text: Then Yahweh said, “There is a great outcry against Sodom and Gomorrah.[a] Their sin is very serious.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated, “The outcry of Sodom and Gomorrah.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew literally describes their sin as “very heavy,” meaning very serious.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The outcry against Sodom and Gomorrah is great
  simplified_phrase: There is a great outcry against Sodom and Gomorrah
  preserved_meaning: A major outcry has arisen concerning wrongdoing in the two cities.
  reasoning_layer_used: POB lexical decision for זַעֲקַת and כִּי רָבָּה
  rationale: The new clause order sounds more natural while retaining the outcry image and its direction against the cities.
- pob_phrase: and their sin is very severe
  simplified_phrase: Their sin is very serious
  preserved_meaning: The cities’ collective wrongdoing is exceptionally grave.
  reasoning_layer_used: POB lexical decision for וְחַטָּאתָם and כִּי כָבְדָה מְאֹד
  rationale: “Very serious” is more common English and keeps the moral weight of the Hebrew idiom.
- pob_phrase: one sentence joining both declarations
  simplified_phrase: two short sentences
  preserved_meaning: Yahweh declares both the greatness of the outcry and the seriousness of the sin.
  reasoning_layer_used: POB syntax and clause relationship
  rationale: Separating the clauses makes each point immediately clear without changing their relationship.
translation_notes:
  risk_flags:
  - risk: “Against” makes the direction of the outcry explicit although the Hebrew can read “of.”
    mitigation: The main text follows the POB decision, and footnote a preserves the lexical alternative.
  - risk: “Very serious” does not display the Hebrew image of heaviness in the main text.
    mitigation: Footnote b preserves the literal image and explains its idiomatic force.
