  preserved_meaning: Abraham modestly offers a small amount of food as hospitality.
  reasoning_layer_used: POB lexical decision and doctrine realignment
  rationale: “Piece” is common modern English and retains Abraham’s modest understatement.
- pob_phrase: so that you may refresh your hearts; after that you may pass on
