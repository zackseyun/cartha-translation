translation:
  language: en
  text: “Let me bring you a piece of bread so that you can eat and refresh yourselves.[a] Then you can continue your journey, since you have come by your servant.” They replied, “Yes, do as you have said.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression pictures food as sustaining or strengthening the heart.
    reason: lexical_alternative
