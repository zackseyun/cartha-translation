translation:
  language: en
  text: What if there are fifty righteous people in the city? Will you really sweep the city away instead of sparing it for the sake of the fifty righteous people there?
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Suppose there are fifty righteous people within the city
  simplified_phrase: What if there are fifty righteous people in the city?
  preserved_meaning: Abraham raises a tentative hypothetical about fifty righteous people located inside the city.
  reasoning_layer_used: POB lexical decisions for אוּלַי and בְּתוֹךְ הָעִיר
  rationale: “What if” and “in” express the same ideas in more familiar English.
- pob_phrase: Will you indeed sweep it away and not spare the place
  simplified_phrase: Will you really sweep the city away instead of sparing it
  preserved_meaning: The question emphatically contrasts destroying the city with withholding judgment from it.
  reasoning_layer_used: POB lexical and theological decisions for הַאַף, תִּסְפֶּה, and נשא
  rationale: “Really” is clearer than “indeed,” while “sweep away” keeps the vivid judgment image.
- pob_phrase: for the sake of the fifty righteous who are within it
  simplified_phrase: for the sake of the fifty righteous people there
  preserved_meaning: The city's righteous people are presented as the reason it might be spared.
  reasoning_layer_used: POB lexical decisions and applied revision history
  rationale: “There” removes a heavy relative clause without losing the people's location.
translation_notes:
  risk_flags:
  - risk: “Instead of” recasts the Hebrew coordination as a direct contrast.
    mitigation: The POB theological rationale explicitly identifies a contrast between destroying and sparing the city.
