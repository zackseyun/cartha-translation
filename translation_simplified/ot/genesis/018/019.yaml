translation:
  language: en
  text: For I have known him,[a] so that he may command his sons and his household after him to follow Yahweh’s way by doing what is right and just. In this way, Yahweh may bring about for Abraham what he has said about him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “I have chosen him.” The Hebrew usually means “know,” but here it may also imply special regard or choice.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: they may keep the way of Yahweh by doing righteousness and justice
  simplified_phrase: to follow Yahweh’s way by doing what is right and just
  preserved_meaning: Yahweh requires a life marked by upright conduct and justice.
  reasoning_layer_used: Lexical decisions for “way,” “righteousness,” and “justice”
  rationale: This explains the way-of-life image while keeping right conduct and justice distinct.
- pob_phrase: Yahweh may bring upon Abraham
  simplified_phrase: Yahweh may bring about for Abraham
  preserved_meaning: Yahweh may cause his word concerning Abraham to be fulfilled for him.
  reasoning_layer_used: Lexical decision for the Hebrew idiom בוא + על
  rationale: “Bring about for” expresses the Hebrew idiom in natural English.
- pob_phrase: his sons and his household after him, and they may keep
  simplified_phrase: his sons and his household after him to follow
  preserved_meaning: Abraham is to command his successors and household to obey Yahweh.
  reasoning_layer_used: Lexical decisions for “sons,” “household,” and “after him”
  rationale: The recast shortens the clause chain without weakening “command” or removing succession.
interpretive_expansions:
- pob_phrase: and they may keep the way of Yahweh
  rendering: to follow Yahweh’s way
  claim: Keeping Yahweh’s way means living as he requires.
  evidence:
