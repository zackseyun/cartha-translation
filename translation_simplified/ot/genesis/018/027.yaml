translation:
  language: en
  text: Then Abraham said in reply, “Now please hear me, my Lord.[a] I have dared to speak to you, even though I am dust and ashes.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “my lord.” The Hebrew can be a respectful form of address, but the surrounding context identifies Abraham’s addressee with the LORD.
    reason: alternative_reading
