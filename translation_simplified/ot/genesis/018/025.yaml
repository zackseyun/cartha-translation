translation:
  language: en
  text: It would be unthinkable for you to do such a thing—to put righteous people to death along with wicked people and treat them both the same. It would be unthinkable for you! Will not the Judge of all the earth do what is just?
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Far be it from you
  simplified_phrase: It would be unthinkable for you
  preserved_meaning: Abraham strongly rejects the possibility of God acting this way.
  reasoning_layer_used: Lexical decision for חָלִילָה
  rationale: The clearer phrase preserves the interjection's force of strong repudiation.
- pob_phrase: so that the righteous would be like the wicked
  simplified_phrase: and treat them both the same
  preserved_meaning: Putting both groups to death would deny the moral distinction between them.
  reasoning_layer_used: Lexical decision for וְהָיָה כַצַּדִּיק כָּרָשָׁע
  rationale: The active wording makes the intolerable result immediately understandable.
- pob_phrase: do justice
  simplified_phrase: do what is just
  preserved_meaning: God is expected to act justly as universal Judge.
  reasoning_layer_used: Lexical and theological decisions for מִשְׁפָּט
  rationale: This accepted alternative states the judicial and ethical meaning in common English.
