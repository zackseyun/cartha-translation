translation:
  language: en
  text: Abraham said, “Please do not be angry, my Lord.[a] But let me speak. What if thirty righteous people are found there?” He answered, “If I find thirty there, I will not destroy the city.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “my lord.” The Hebrew title may be a respectful form of address, but it is capitalized here because Abraham is understood to be speaking to the Lord.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Please, let not my Lord be angry
  simplified_phrase: Please do not be angry, my Lord
  preserved_meaning: Abraham respectfully asks the Lord not to become angry.
  reasoning_layer_used: Lexical decision for אַל נָא יִחַר and theological decision for אֲדֹנָי
  rationale: Direct modern word order preserves both the plea and the reverential title.
- pob_phrase: and I will speak
  simplified_phrase: But let me speak
  preserved_meaning: Abraham respectfully asks permission to continue speaking.
  reasoning_layer_used: Lexical decision for וַאֲדַבֵּרָה
  rationale: The request form communicates the cohortative’s deferential force more naturally.
- pob_phrase: Perhaps thirty will be found there
  simplified_phrase: What if thirty righteous people are found there?
  preserved_meaning: Abraham tentatively asks about finding thirty of the people under discussion.
  reasoning_layer_used: Lexical decisions for אוּלַי and יִמָּצְאוּן, with immediate context
  rationale: A conditional question expresses Abraham’s tentative proposal in clear spoken English.
