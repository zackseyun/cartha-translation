simplification_decisions:
- pob_phrase: if I have found favor in your eyes
  simplified_phrase: if you look on me with favor
  preserved_meaning: Abraham appeals to the addressee’s favorable regard while retaining the image of looking.
  reasoning_layer_used: lexical decision for מָצָאתִי חֵן בְּעֵינֶיךָ
  rationale: The active wording makes the Hebrew idiom easier to understand without removing its visual image.
- pob_phrase: please do not pass by your servant
  simplified_phrase: please do not pass by me, your servant
  preserved_meaning: Abraham respectfully asks the visitor not to continue past him.
  reasoning_layer_used: lexical decisions for תַעֲבֹר מֵעַל and עַבְדֶּךָ
  rationale: Adding “me” clarifies who would be passed while keeping Abraham’s deferential self-description.
