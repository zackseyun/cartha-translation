translation:
  language: en
  text: He looked up, and there were three men standing near him. When he saw them, he ran from the entrance of the tent to meet them and bowed low to the ground.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This was a physical gesture of deep respect; the Hebrew does not necessarily mean that he worshiped them.
    reason: lexical_alternative
