translation:
  language: en
  text: The men left there and headed toward Sodom. But Abraham remained standing before Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some ancient witnesses read, “Yahweh remained standing before Abraham.” The Hebrew Masoretic Text reads, “Abraham remained standing before Yahweh.”
