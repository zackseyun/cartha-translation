simplification_decisions:
- pob_phrase: Then the men turned from there and went toward Sodom
  simplified_phrase: The men left there and headed toward Sodom
  preserved_meaning: The men departed from that place and moved toward Sodom.
  reasoning_layer_used: POB lexical decisions for וַיִּפְנוּ, מִשָּׁם, and וַיֵּלְכוּ
  rationale: “Left there and headed toward” clearly expresses both departure and destination.
- pob_phrase: but Abraham still stood before Yahweh
  simplified_phrase: But Abraham remained standing before Yahweh
  preserved_meaning: Abraham continued to stand in Yahweh’s presence.
  reasoning_layer_used: POB lexical and theological decisions for עוֹדֶנּוּ, עֹמֵד, לִפְנֵי, and יְהוָה
  rationale: “Remained standing” makes the continuing posture clear while preserving the image and divine name.
