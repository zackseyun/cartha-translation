translation:
  language: en
  text: Sarah denied it[a] because she was afraid. “I did not laugh,” she said. But he[b] replied, “No. You did laugh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can mean that Sarah denied it or lied; here it describes her denial that she had laughed.
    reason: lexical_alternative
  - marker: b
    text: The speaker is not named again here, though the surrounding account associates him with the LORD.
    reason: alternative_reading
