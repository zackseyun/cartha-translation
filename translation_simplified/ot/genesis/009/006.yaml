translation:
  language: en
  text: Whoever sheds a person's blood, the killer's own blood shall be shed by other people, because God made human beings in his image.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the blood of man
  simplified_phrase: a person's blood
  preserved_meaning: The victim is any human being, not only a male.
  reasoning_layer_used: POB lexical decision and generic-adam footnote
  rationale: “A person's blood” expresses the generic singular clearly in modern English.
- pob_phrase: by man shall his blood be shed
  simplified_phrase: the killer's own blood shall be shed by other people
  preserved_meaning: Human beings are the agents who shed the murderer's blood.
  reasoning_layer_used: POB lexical and theological decisions on agentive בָּאָדָם
  rationale: The wording clarifies both whose blood is shed and who carries out the consequence.
- pob_phrase: for God made man in his image
  simplified_phrase: because God made human beings in his image
  preserved_meaning: Humanity bears God's image, which grounds the preceding rule.
  reasoning_layer_used: POB imago Dei theological decision
  rationale: “Because” states the reason plainly, and “human beings” prevents a male-only reading.
interpretive_expansions:
- pob_phrase: his blood
  rendering: the killer's own blood
  claim: The pronoun refers to the person who shed the victim's blood.
  evidence:
  - The reciprocal bloodshed structure identifies the first bloodshed's perpetrator as the second bloodshed's subject.
  - The POB rationale explicitly describes this person as “the murderer.”
  confidence: high
  alternatives_preserved:
