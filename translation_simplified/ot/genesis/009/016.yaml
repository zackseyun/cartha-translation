translation:
  language: en
  text: The rainbow[a] will be in the cloud. I will see it and remember the everlasting covenant between God and every living creature—that is, all flesh on the earth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word literally means “bow”; here it refers to the rainbow.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The bow
  simplified_phrase: The rainbow[a]
  preserved_meaning: The visible sky-bow remains the sign of the covenant.
  reasoning_layer_used: POB lexical decision and immediate flood-covenant context
  rationale: “Rainbow” prevents readers from mistaking the covenant sign for a weapon while the footnote preserves the Hebrew image.
- pob_phrase: every living creature among all flesh that is on the earth
  simplified_phrase: every living creature—that is, all flesh on the earth
  preserved_meaning: The covenant includes all embodied living creatures on earth.
  reasoning_layer_used: POB lexical rationale for בְּכָל בָּשָׂר
  rationale: The appositional wording shows that “all flesh” explains the creatures rather than naming a separate group.
- pob_phrase: The bow will be in the cloud, and I will see it and remember
  simplified_phrase: The rainbow will be in the cloud. I will see it and remember
  preserved_meaning: God sees the covenant sign and remembers the covenant.
  reasoning_layer_used: POB syntax and theological decision
  rationale: Two sentences make the sequence easier to follow without explaining away divine remembrance.
