translation:
  language: en
  text: You must also say, “Look, your servant Jacob is coming behind us.” Jacob said, “I will appease him[a] with the gift going ahead of me. After that, I will see his face. Perhaps he will accept me.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb is related to atonement language, but here it means trying to placate Esau with a gift.
    reason: lexical_alternative
