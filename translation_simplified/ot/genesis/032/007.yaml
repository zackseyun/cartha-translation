translation:
  language: en
  text: The messengers came back to Jacob and said, “We came to your brother Esau, and he too is coming to meet you. Four hundred men are with him.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: returned to Jacob, saying
  simplified_phrase: came back to Jacob and said
  preserved_meaning: The messengers returned and reported directly to Jacob.
  reasoning_layer_used: Lexical decisions for וַיָּשֻׁבוּ and לֵאמֹר
  rationale: Ordinary English narration is clearer than the participial speech formula.
- pob_phrase: We came to your brother, to Esau
  simplified_phrase: We came to your brother Esau
  preserved_meaning: Esau is identified as Jacob’s brother and as the person the messengers reached.
  reasoning_layer_used: Lexical decisions for בָּאנוּ, אָחִיךָ, and אֶל עֵשָׂו
  rationale: Removing the repeated preposition makes the apposition natural in English.
- pob_phrase: and he is also coming to meet you, and four hundred men are with him
  simplified_phrase: and he too is coming to meet you. Four hundred men are with him.
  preserved_meaning: Esau himself is approaching Jacob with four hundred men accompanying him.
  reasoning_layer_used: Lexical decisions for וְגַם, הֹלֵךְ, לִקְרָאתְךָ, and עִמּוֹ
  rationale: “He too” keeps the additive emphasis, while a new sentence makes the alarming detail easier to grasp.
translation_notes:
  risk_flags:
  - risk: “He too” may sound slightly emphatic in modern English.
    mitigation: The emphasis preserves the additive force of וְגַם without adding a temporal claim.
