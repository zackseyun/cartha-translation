translation:
  language: en
  text: 'He commanded them, “This is what you must say to my lord Esau: ‘Your servant[a] Jacob says: I have lived as a foreigner with Laban and have stayed there until now.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Your servant” is Jacob’s respectful way of referring to himself before Esau; it does not necessarily mean that he was literally Esau’s servant.
    reason: cultural_note
simplification_decisions:
- pob_phrase: And he commanded them, saying
  simplified_phrase: He commanded them
  preserved_meaning: Jacob gave the messengers an authoritative charge.
  reasoning_layer_used: Lexical decision for וַיְצַו and ordinary English speech structure
  rationale: Removing the redundant speech formula makes the command direct without weakening its force.
- pob_phrase: Thus you shall say ... Thus says
  simplified_phrase: This is what you must say ... Jacob says
  preserved_meaning: The messengers must deliver Jacob’s specified message to Esau.
  reasoning_layer_used: Lexical decisions for כֹּה תֹאמְרוּן and כֹּה אָמַר
  rationale: Modern messenger wording preserves the exact-message formulas more clearly.
- pob_phrase: I have sojourned with Laban and have stayed until now
  simplified_phrase: I have lived as a foreigner with Laban and have stayed there until now
  preserved_meaning: Jacob had resided with Laban as an outsider and continued there up to that time.
  reasoning_layer_used: Lexical decisions for גַּרְתִּי, וָאֵחַר, and עַד עָתָּה
  rationale: The wording explains the unfamiliar term “sojourned” while retaining its outsider nuance.
translation_notes:
  risk_flags:
  - risk: “My lord” could be mistaken for a divine title.
    mitigation: The name Esau and the surrounding deferential language identify it as a social title of respect.
