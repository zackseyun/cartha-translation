translation:
  language: en
  text: He said, “You will no longer be called Jacob. Your name will be Israel, because you have struggled with God[a] and with men[b], and you have prevailed.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “with divine beings.” The Hebrew term can mean God, gods, or heavenly beings; here the context favors “God.”
    reason: alternative_reading
  - marker: b
    text: Or “with people” or “with humans.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Your name shall no longer be called Jacob, but Israel
  simplified_phrase: You will no longer be called Jacob. Your name will be Israel.
  preserved_meaning: Jacob receives Israel as his new name in place of his former name.
  reasoning_layer_used: POB lexical decisions for יֵאָמֵר, עוֹד, and כִּי אִם
  rationale: Two direct sentences make the formal renaming easier to follow.
- pob_phrase: you have striven
  simplified_phrase: you have struggled
  preserved_meaning: The wording retains the contest image and the wordplay explaining Israel.
  reasoning_layer_used: POB lexical decision for שָׂרִיתָ
  rationale: “Struggled” is more familiar than “striven” while preserving the same action.
- pob_phrase: and have prevailed
  simplified_phrase: and you have prevailed
  preserved_meaning: Jacob achieved a successful outcome without implying total conquest of God.
  reasoning_layer_used: POB lexical decision for וַתּוּכָל
  rationale: Repeating the subject makes the final result clear while retaining the careful term “prevailed.”
