translation:
  language: en
  text: When he saw that he could not overcome him,[a] he touched his hip socket. Jacob’s hip joint was dislocated while he wrestled with him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses pronouns here and does not identify Jacob’s opponent again.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: could not prevail against him
  simplified_phrase: could not overcome him
  preserved_meaning: He could not gain victory over his opponent in the struggle.
  reasoning_layer_used: POB lexical decision for לֹא יָכֹל לוֹ
  rationale: “Overcome” gives the wrestling sense in familiar English without implying absolute inability.
- pob_phrase: the socket of his thigh
  simplified_phrase: his hip socket
  preserved_meaning: The touch was at the joint where the thigh meets the hip.
  reasoning_layer_used: POB lexical decision for בְּכַף יְרֵכוֹ
  rationale: “Hip socket” is the clearest modern term for the same body part.
- pob_phrase: the socket of Jacob’s thigh was dislocated as he wrestled with him
  simplified_phrase: Jacob’s hip joint was dislocated while he wrestled with him
  preserved_meaning: Jacob’s joint came out of place during the wrestling, while the pronoun ambiguity remains.
  reasoning_layer_used: POB lexical decisions for וַתֵּקַע and בְּהֵאָבְקוֹ עִמּוֹ, plus the theological decision on pronouns
  rationale: The shorter sentence clarifies the injury while retaining “he” and “him” as the Hebrew does.
translation_notes:
  risk_flags:
  - risk: Readers may be unsure which person touched Jacob.
    mitigation: The pronouns preserve the Hebrew ambiguity, and footnote [a] explains why the opponent is not named.
