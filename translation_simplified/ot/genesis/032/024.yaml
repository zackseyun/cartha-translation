simplification_decisions:
- pob_phrase: He took them and brought them across the stream
  simplified_phrase: Jacob took his wives, children, and female servants across the stream
  preserved_meaning: Jacob caused all the people named in the preceding verse to cross the stream.
  reasoning_layer_used: Immediate context and the lexical decision for the causative form of עבר.
  rationale: Naming Jacob and each group clarifies the pronouns without excluding the female servants.
- pob_phrase: and he brought across what belonged to him
  simplified_phrase: Then he brought his possessions across
  preserved_meaning: Jacob also caused his belongings to cross the stream.
  reasoning_layer_used: Lexical decision for אֲשֶׁר לוֹ and its contextual alternative “his possessions.”
  rationale: “His possessions” states the concrete contextual meaning in common English.
