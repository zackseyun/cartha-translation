translation:
  language: en
  text: As for Ishmael, I have heard you. Look, I have blessed him. I will give him many children and greatly increase his descendants. He will be the father of twelve rulers, and I will make a great nation come from him.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: will make him fruitful, and will multiply him exceedingly
  simplified_phrase: will give him many children and greatly increase his descendants
  preserved_meaning: Ishmael will have offspring whose numbers grow very large.
  reasoning_layer_used: POB text and source parallelism
  rationale: The rewrite explains the fruitfulness image while keeping both offspring and extraordinary increase.
- pob_phrase: He will father twelve princes
  simplified_phrase: He will be the father of twelve rulers
  preserved_meaning: Twelve governing leaders will descend directly from Ishmael.
  reasoning_layer_used: POB lexical choice
  rationale: “Rulers” expresses the governing status of “princes” in more familiar English.
- pob_phrase: I will make him into a great nation
  simplified_phrase: I will make a great nation come from him
  preserved_meaning: God will form a great nation from Ishmael's line.
  reasoning_layer_used: immediate promise context
  rationale: The new wording avoids suggesting that one man personally becomes a nation.
interpretive_expansions:
- pob_phrase: make him fruitful
  rendering: give him many children
  claim: Fruitfulness here refers to Ishmael having offspring.
  evidence:
  - The promise pairs fruitfulness with multiplying Ishmael.
  - The verse continues with twelve rulers and a nation coming from him.
  confidence: high
  alternatives_preserved:
  - make him fruitful
  - give him many descendants
- pob_phrase: make him into a great nation
  rendering: make a great nation come from him
  claim: The nation will arise from Ishmael's descendants.
  evidence:
  - A nation cannot consist of Ishmael alone.
  - The preceding promises concern his offspring and their increase.
  confidence: high
  alternatives_preserved:
  - make his descendants into a great nation
translation_notes:
  risk_flags:
  - risk: “Rulers” is broader than the traditional title “princes.”
    mitigation: It preserves the POB sense that the twelve hold governing status without adding hereditary monarchy.
