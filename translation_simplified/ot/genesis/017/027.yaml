  text: Every man in Abraham’s household was circumcised along with him. This included those born in the household and those bought from a foreigner.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: all the men of his household
  simplified_phrase: Every man in Abraham’s household
  preserved_meaning: The wording keeps the verse’s comprehensive reference to the male members of the household.
  reasoning_layer_used: POB lexical decisions for וְכָל and אַנְשֵׁי בֵיתוֹ
  rationale: Using “every man” and naming Abraham makes the scope and owner immediately clear.
- pob_phrase: those born in the house and those bought with money from a foreigner
  simplified_phrase: This included those born in the household and those bought from a foreigner
  preserved_meaning: Both household-born and purchased members remain distinct groups.
  reasoning_layer_used: POB lexical decisions for יְלִיד בָּיִת, וּמִקְנַת כֶּסֶף, and מֵאֵת בֶּן נֵכָר
  rationale: A second sentence clarifies the two groups without weakening the transactional meaning of “bought.”
- pob_phrase: were circumcised with him
  simplified_phrase: was circumcised along with him
  preserved_meaning: The household members underwent circumcision together with Abraham.
  reasoning_layer_used: POB lexical decisions for נִמֹּלוּ and אִתּוֹ
  rationale: “Along with” makes the accompaniment clearer while preserving the passive action.
