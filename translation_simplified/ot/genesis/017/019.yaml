simplification_decisions:
- pob_phrase: No, but Sarah your wife shall bear you a son
  simplified_phrase: No. Your wife Sarah will bear you a son
  preserved_meaning: God corrects Abraham and promises that Sarah will bear the son.
  reasoning_layer_used: Lexical decision for אֲבָל and predictive יֹלֶדֶת
  rationale: Two direct sentences preserve the correction while making the promise easier to follow.
- pob_phrase: you shall call his name Isaac
  simplified_phrase: you must name him Isaac
  preserved_meaning: God directs Abraham to give the promised son the name Isaac.
  reasoning_layer_used: Lexical decision for the Hebrew naming formula
  rationale: The common English naming expression makes the command immediately clear.
- pob_phrase: I will establish my covenant with him as an everlasting covenant for his offspring after him
  simplified_phrase: I will establish my covenant with him. It will be an everlasting covenant for his offspring after him.
  preserved_meaning: God will put his enduring covenant into force with Isaac and extend it to Isaac’s offspring.
  reasoning_layer_used: Covenant lexical decisions and theological scope decision
  rationale: Splitting the dense sentence improves readability without narrowing or expanding the covenant promise.
