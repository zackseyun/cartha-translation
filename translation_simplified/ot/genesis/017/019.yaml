translation:
  language: en
  text: God said, “No. Your wife Sarah will bear you a son, and you must name him Isaac.[a] I will establish my covenant with him. It will be an everlasting covenant for his offspring after him.”
  philosophy: optimal-equivalence
  footnotes:
