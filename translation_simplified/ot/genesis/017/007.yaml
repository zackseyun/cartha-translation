translation:
  language: en
  text: I will establish my covenant with you and with your offspring after you. It will be an everlasting covenant throughout all their generations. I will be God to you and to your offspring after you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Offspring” is a collective term that may also be translated “seed” or “descendants.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: between me and you and your offspring after you
  simplified_phrase: with you and with your offspring after you
  preserved_meaning: God establishes the covenant with Abraham and his later offspring.
  reasoning_layer_used: POB lexical decision on the repeated “between” structure
  rationale: The repeated “with” clearly identifies both covenant parties in natural English.
- pob_phrase: throughout their generations as an everlasting covenant
  simplified_phrase: It will be an everlasting covenant throughout all their generations.
  preserved_meaning: The covenant endures across every successive generation.
  reasoning_layer_used: POB lexical decisions for “generations” and “everlasting covenant”
  rationale: A separate sentence makes the covenant’s enduring duration easier to follow.
- pob_phrase: to be God to you and to your offspring after you
  simplified_phrase: I will be God to you and to your offspring after you.
  preserved_meaning: God promises an enduring covenant relationship with Abraham and his offspring.
  reasoning_layer_used: POB theological decision on the covenant formula
  rationale: A direct finite sentence preserves the solemn formula while removing the difficult infinitive construction.
translation_notes:
  risk_flags:
  - risk: Using “with” makes the Hebrew image of a covenant standing “between” the parties less visible.
    mitigation: The wording still names God, Abraham, and his offspring as the covenant parties.
  - risk: Modern readers may hear “offspring” as strictly plural and miss its collective singular force.
    mitigation: The footnote preserves the alternatives “seed” and “descendants.”
