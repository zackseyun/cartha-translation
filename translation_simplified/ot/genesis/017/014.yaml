simplification_decisions:
- pob_phrase: And an uncircumcised male who is not circumcised in the flesh of his foreskin
  simplified_phrase: Any male whose foreskin has not been circumcised
  preserved_meaning: The rule concerns every male whose foreskin remains uncircumcised.
  reasoning_layer_used: Lexical decisions for וְעָרֵל זָכָר, אֲשֶׁר לֹא יִמּוֹל, and אֶת בְּשַׂר עָרְלָתוֹ
  rationale: The rewrite removes repetition while retaining the passive sense and anatomical detail.
- pob_phrase: that person shall be cut off from his people
  simplified_phrase: shall be cut off from his people
  preserved_meaning: The person faces a severe but unspecified covenant judgment.
  reasoning_layer_used: Theological decision on כרת and lexical decisions for נפש and עם
  rationale: “Shall be cut off” preserves the passive sanction without implying a human enforcing agent.
- pob_phrase: he has broken my covenant
  simplified_phrase: He has broken my covenant.
  preserved_meaning: His uncircumcised condition violates God's covenant.
  reasoning_layer_used: Lexical decisions for בְּרִית and הֵפַר
  rationale: A separate sentence makes the reason for the judgment easy to follow.
translation_notes:
  risk_flags:
