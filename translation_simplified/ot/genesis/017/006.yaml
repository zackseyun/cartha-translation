- pob_phrase: kings will come from you
  simplified_phrase: your descendants will include kings
  preserved_meaning: Kings will arise from Abraham’s family line.
  reasoning_layer_used: Lexical decision on מִמְּךָ יֵצֵאוּ and immediate covenant context
  rationale: The wording makes the genealogical meaning immediately clear.
