  preserved_meaning: God strongly emphasizes that Abraham will become fruitful.
  reasoning_layer_used: Lexical decision on בִּמְאֹד מְאֹד
  rationale: “Extremely” is more common than “exceedingly” and retains the strong intensifier.
- pob_phrase: I will make nations from you
  simplified_phrase: I will make you the ancestor of nations
  preserved_meaning: God will cause Abraham to become the forefather of multiple nations.
  reasoning_layer_used: Lexical decision on וּנְתַתִּיךָ לְגוֹיִם and theological decision on Abraham’s descendants
