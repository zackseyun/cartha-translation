translation:
  language: en
  text: But I will establish my covenant with Isaac.[a] Sarah will give birth to him for you at this set time next year.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “And I will establish my covenant with Isaac.” The Hebrew says “and,” but the context contrasts Isaac’s covenant with the promise about Ishmael in the previous verse.
