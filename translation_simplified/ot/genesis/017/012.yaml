translation:
  language: en
  text: Generation after generation, every male among you must be circumcised when he is eight days old. This includes those born in your household and those bought with silver from a foreigner who is not one of your descendants.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: at eight days old, every male among you throughout your generations shall be circumcised
  simplified_phrase: Generation after generation, every male among you must be circumcised when he is eight days old
  preserved_meaning: The command applies to every male at eight days old and continues through future generations.
  reasoning_layer_used: lexical decisions for וּבֶן שְׁמֹנַת יָמִים, יִמּוֹל, and לְדֹרֹתֵיכֶם
  rationale: The sentence is reordered and “must” expresses the command in direct modern English.
- pob_phrase: whether born in the house or bought with silver
  simplified_phrase: This includes those born in your household and those bought with silver
  preserved_meaning: Both household-born and purchased males are included.
  reasoning_layer_used: lexical decisions and theological scope decision
  rationale: A second sentence makes the covenant household’s full scope easier to follow while retaining “silver.”
- pob_phrase: who is not from your offspring
  simplified_phrase: who is not one of your descendants
  preserved_meaning: The foreigner is outside Abraham’s biological line.
  reasoning_layer_used: lexical decision for אֲשֶׁר לֹא מִזַּרְעֲךָ הוּא
  rationale: “Descendants” states the family relationship more naturally than “offspring” in this clause.
translation_notes:
  risk_flags:
  - risk: Breaking the verse into two sentences could make the included groups seem separate from the eight-day requirement.
    mitigation: “This includes” explicitly connects both household groups to the preceding command.
