simplification_decisions:
- pob_phrase: I will bless her, and moreover
  simplified_phrase: I will bless her. What is more
  preserved_meaning: God's blessing and the emphatic added promise remain distinct.
  reasoning_layer_used: Lexical decision for וְגַם and the Hebrew repetition of “I will bless her.”
  rationale: Two sentences make the promises easier to follow while keeping the added emphasis.
- pob_phrase: I will give you a son by her
  simplified_phrase: I will give you a son through her
  preserved_meaning: God promises Abraham a son who will be born to Sarah.
  reasoning_layer_used: Lexical decision for נָתַתִּי מִמֶּנָּה לְךָ בֵּן.
  rationale: “Through her” clearly expresses Sarah's maternal role in current English.
- pob_phrase: she will become nations
  simplified_phrase: nations will descend from her
  preserved_meaning: Multiple nations will arise from Sarah's descendants.
  reasoning_layer_used: Lexical and theological decisions for וְהָיְתָה לְגוֹיִם.
  rationale: The natural English wording states the corporate promise clearly, while the footnote preserves the striking Hebrew form.
