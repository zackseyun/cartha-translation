translation:
  language: en
  text: Then Abraham fell facedown and laughed. In his heart he asked, “Will a child[a] be born to a man who is a hundred years old? Will Sarah give birth when she is ninety?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a son.” The Hebrew word can mean either “son” or “child” here.
    reason: lexical_alternative
