  preserved_meaning: God promises an emphatic increase connected directly to Abram.
  reasoning_layer_used: Lexical decisions on רבה, אֹתְךָ, and doubled מְאֹד
  rationale: “Greatly” is common English and preserves the strong emphasis without replacing “you” with “descendants.”
