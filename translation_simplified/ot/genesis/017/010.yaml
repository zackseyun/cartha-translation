simplification_decisions:
- pob_phrase: between me and you and your offspring after you
  simplified_phrase: with you and your descendants after you
  preserved_meaning: God’s covenant binds the present hearers and the generations who follow them.
  reasoning_layer_used: POB lexical decision for בֵּינִי וּבֵינֵיכֶם וּבֵין זַרְעֲךָ אַחֲרֶיךָ
  rationale: “With” removes awkward repetition, while “descendants” clearly expresses the collective sense of offspring.
- pob_phrase: which you shall keep
  simplified_phrase: which you must keep
  preserved_meaning: Keeping the covenant is an obligation, not merely a prediction.
  reasoning_layer_used: POB lexical decision for אֲשֶׁר תִּשְׁמְרוּ
  rationale: “Must” states the required obligation in familiar modern English.
- pob_phrase: every male among you shall be circumcised
  simplified_phrase: Every male among you must be circumcised
  preserved_meaning: The covenant requirement specifically applies to every male in the community.
  reasoning_layer_used: POB lexical and theological decisions for הִמּוֹל, לָכֶם, and כָּל זָכָר
  rationale: The revision modernizes the command while preserving its passive form and male-specific scope.
