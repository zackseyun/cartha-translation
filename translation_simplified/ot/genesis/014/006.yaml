  preserved_meaning: The Horites continue the list of peoples defeated by the kings.
  reasoning_layer_used: The lexical decision for וְאֶת supplies the implied verb from the preceding context.
  rationale: Stating the implied action makes the verse a complete English sentence.
- pob_phrase: which is by the wilderness
  simplified_phrase: near the wilderness
  preserved_meaning: El-paran is located beside or at the edge of the wilderness.
  reasoning_layer_used: The lexical decision for אֲשֶׁר עַל הַמִּדְבָּר preserves the broad spatial sense.
  rationale: “Near” expresses the location in direct modern English.
