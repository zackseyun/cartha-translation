translation:
  language: en
  text: In the fourteenth year, Kedorlaomer came with the kings allied with him. Together they defeated the Rephaim[a] at Ashteroth-karnaim, the Zuzim at Ham, and the Emim at Shaveh-kiriathaim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some translations call the Rephaim “giants,” but here the Hebrew name of the people is retained.
    reason: lexical_alternative
  - marker: b
    text: Shaveh-kiriathaim may also mean “the plain of Kiriathaim.”
    reason: lexical_alternative
