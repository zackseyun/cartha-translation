translation:
  language: en
  text: Then he blessed Abram and said, “Blessed be Abram by God Most High, who possesses heaven and earth.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “who created heaven and earth.” The Hebrew can refer to possessing or creating.
    reason: lexical_alternative
