  rationale: “Then” gives the narrative sequence clearly, and “Abram” makes the pronoun’s referent explicit.
- pob_phrase: possessor of heaven and earth
  simplified_phrase: who possesses heaven and earth
  preserved_meaning: God Most High is identified as the one who possesses all creation.
  reasoning_layer_used: Lexical and theological decisions
  rationale: A familiar verb is clearer than the abstract title while retaining the chosen sense of the Hebrew.
