  preserved_meaning: Each named city still has a king who joins the action.
  reasoning_layer_used: POB lexical decisions for מֶלֶךְ and the place names
  rationale: Combining the repeated title makes the long list easier to read without changing who went out.
- pob_phrase: that is, Zoar
