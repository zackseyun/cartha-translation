translation:
  language: en
  text: Then the kings of Sodom, Gomorrah, Admah, Zeboiim, and Bela (also called Zoar) went out. In the Valley of Siddim, they took their positions for battle with them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “against them.” The Hebrew says “with them” in a context of battle.
    reason: lexical_alternative
