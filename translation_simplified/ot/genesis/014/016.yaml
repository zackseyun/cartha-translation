translation:
  language: en
  text: He brought back all the possessions. He also brought back his relative Lot and Lot’s possessions, along with the women and the people.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: He brought back all the possessions; he also brought back
  simplified_phrase: He brought back all the possessions. He also brought back
  preserved_meaning: The two acts of recovery remain distinct, and the Hebrew repetition is preserved.
  reasoning_layer_used: applied revision and lexical decisions for וַיָּשֶׁב and הֵשִׁיב
  rationale: Two sentences make the verse easier to follow without weakening its repeated emphasis.
- pob_phrase: Lot his kinsman
  simplified_phrase: his relative Lot
  preserved_meaning: Lot is identified as a member of Abram’s extended family, not his literal brother.
  reasoning_layer_used: lexical decision for לוֹט אָחִיו and narrative context
  rationale: “Relative” is common modern English and accurately reflects Lot’s broader family relationship.
- pob_phrase: and his possessions, and also the women and the people
  simplified_phrase: and Lot’s possessions, along with the women and the people
  preserved_meaning: Lot’s property and both groups of rescued people are separately retained.
  reasoning_layer_used: lexical decisions for וּרְכֻשׁוֹ, הַנָּשִׁים, and הָעָם
  rationale: Repeating Lot’s name removes an unclear pronoun while “along with” smooths the list.
translation_notes:
  risk_flags:
