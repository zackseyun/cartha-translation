translation:
  language: en
  text: I will not take even a thread or a sandal strap, or anything else that belongs to you, so that you cannot say, ‘I made Abram rich.’
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: that I would not take from a thread to a sandal strap
  simplified_phrase: I will not take even a thread or a sandal strap
  preserved_meaning: Abram firmly swears that he will take nothing, not even a very small item.
  reasoning_layer_used: Lexical decisions and theological decision on the elliptical oath formula.
  rationale: The direct refusal makes the oath clear while retaining the concrete thread and sandal-strap images.
- pob_phrase: or anything that is yours
  simplified_phrase: or anything else that belongs to you
  preserved_meaning: Abram refuses every possession of the king of Sodom.
  reasoning_layer_used: Lexical decision for מִכָּל אֲשֶׁר לָךְ.
  rationale: “Belongs to you” states the possessive sense in everyday English.
- pob_phrase: lest you say
  simplified_phrase: so that you cannot say
  preserved_meaning: Abram refuses the goods to prevent the king from claiming credit for his wealth.
  reasoning_layer_used: Lexical decision for וְלֹא תֹאמַר and the applied revision record.
  rationale: The purpose clause is expressed without the less common word “lest.”
translation_notes:
  risk_flags:
  - risk: Changing “would not” to “will not” may sound less visibly tied to the oath in the previous verse.
    mitigation: The firm future refusal naturally carries the sworn force established by the context.
