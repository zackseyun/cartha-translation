translation:
  language: en
  text: A fugitive came and told Abram the Hebrew. At that time, Abram was living by the oaks of Mamre the Amorite.[a] Mamre was the brother of Eshcol and Aner,[b] and these men were Abram’s allies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term may also refer to terebinths or, more generally, large trees.
    reason: lexical_alternative
  - marker: b
    text: “Brother” may here mean a more distant male relative.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Now he was dwelling by the oaks of Mamre the Amorite
  simplified_phrase: At that time, Abram was living by the oaks of Mamre the Amorite
  preserved_meaning: Abram was residing near Mamre’s trees when the fugitive arrived.
  reasoning_layer_used: Lexical decision for שֹׁכֵן and immediate syntax
  rationale: Naming Abram removes an unclear pronoun, and “was living” naturally preserves the continuing residence.
- pob_phrase: brother of Eshcol and brother of Aner
  simplified_phrase: Mamre was the brother of Eshcol and Aner
  preserved_meaning: Mamre had the stated family relationship to both men.
  reasoning_layer_used: Lexical decision for אֲחִי and source apposition
  rationale: A separate sentence clarifies that the relationship describes Mamre while retaining the broader possibility in a note.
- pob_phrase: these were allies of Abram
  simplified_phrase: these men were Abram’s allies
  preserved_meaning: Mamre, Eshcol, and Aner were bound to Abram in an alliance.
  reasoning_layer_used: Lexical decision for בַּעֲלֵי בְרִית
  rationale: “These men” gives the plural pronoun a clear human referent without weakening the treaty relationship.
translation_notes:
  risk_flags:
  - risk: “Brother” may suggest a closer relationship than the Hebrew requires.
    mitigation: The footnote preserves the possible broader sense of male relative.
  - risk: “Oaks” may sound botanically certain.
    mitigation: The footnote preserves terebinths and the more general sense of large trees.
