  text: I will take nothing for myself. The only exceptions are what the young men have eaten[a] and the share belonging to the men who went with me—Aner, Eshcol, and Mamre. Let them take their share.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “servants” or “retainers.”
    reason: lexical_alternative
  - marker: b
    text: Or “They will take their share,” though the context favors permission.
    reason: alternative_reading
