translation:
  language: en
  text: When Abram heard that his brother had been taken captive,[a] he gathered[b] his three hundred and eighteen trained men. All of them had been born in his household. Abram pursued the captors as far as Dan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “brother” means a close male relative; Lot was Abram’s nephew.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb translated “gathered” may also mean “mustered,” “led out,” “drew out,” or possibly “armed.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: he mustered his trained men
  simplified_phrase: he gathered[b] his ... trained men
  preserved_meaning: Abram assembled his trained men for the military pursuit.
  reasoning_layer_used: Lexical decisions for וַיָּרֶק and חֲנִיכָיו.
  rationale: “Gathered” is more familiar than “mustered” without choosing the debated sense “armed” or “led out.”
- pob_phrase: his trained men, born in his household, three hundred and eighteen
  simplified_phrase: his three hundred and eighteen trained men. All of them had been born in his household.
  preserved_meaning: The group numbered 318, was trained, and consisted of household-born dependents.
  reasoning_layer_used: Lexical decisions for חֲנִיכָיו, יְלִידֵי בֵיתוֹ, and the number.
  rationale: Two sentences make the number and household relationship easier to follow.
- pob_phrase: his brother
  simplified_phrase: his brother ... [a]
  preserved_meaning: The text retains the Hebrew kinship term while clarifying that Lot was a close male relative.
  reasoning_layer_used: Theological decision on Lot’s kinship term.
  rationale: The footnote prevents readers from mistaking Lot for Abram’s literal brother.
interpretive_expansions:
