translation:
  language: en
  text: Then they turned back and reached En-mishpat[a] (also called Kadesh). They attacked the whole region of the Amalekites and also the Amorites living in Hazazon-tamar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En-mishpat means “spring of judgment.”
    reason: cultural_note
  - marker: b
    text: Hazazon-tamar is identified with En-gedi in 2 Chronicles 20:2.
    reason: cross_reference
simplification_decisions:
- pob_phrase: Then they turned back and came to
  simplified_phrase: Then they turned back and reached
  preserved_meaning: The army reversed direction and arrived at the next named place.
  reasoning_layer_used: POB lexical decisions for וַיָּשֻׁבוּ and וַיָּבֹאוּ
  rationale: “Reached” states the arrival naturally while keeping the sequence of movement.
- pob_phrase: struck
  simplified_phrase: attacked
  preserved_meaning: They inflicted a military blow without implying complete conquest.
  reasoning_layer_used: POB lexical decision for וַיַּכּוּ
  rationale: “Attacked” is clearer modern English and remains within the documented lexical range.
- pob_phrase: all the country of the Amalekites
  simplified_phrase: the whole region of the Amalekites
  preserved_meaning: The attack extended throughout the land occupied by the Amalekites.
  reasoning_layer_used: POB lexical decision for כָּל שְׂדֵה הָעֲמָלֵקִי
  rationale: “Whole region” makes the geographic sense clear without using the literal but misleading “field.”
translation_notes:
  risk_flags:
  - risk: “Attacked” may sound less forceful than the Hebrew image of striking.
    mitigation: The wording still presents direct military violence and avoids overstating the outcome as total defeat.
