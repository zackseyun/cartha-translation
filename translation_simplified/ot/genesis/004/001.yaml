translation:
  language: en
  text: And Adam knew Eve his wife[a]; and she conceived and bore Cain[b], and said, “I have acquired a man from Yahweh.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb literally means “knew.” This source-near wording preserves the expression instead of expanding it into a specific physical or chronological interpretation.
    reason: interpretive_transparency
  - marker: b
    text: The name Cain sounds like the Hebrew verb translated “acquired.”
    reason: lexical_alternative
  - marker: c
    text: The Hebrew literally says “with Yahweh” and may be understood as “from Yahweh”; less likely, it may identify the man as Yahweh.
    reason: alternative_reading
