translation:
  language: en
  text: For Cain is avenged seven times over, and Lamech is avenged seventy-seven times over.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be translated “will be avenged,” expressing certain future vengeance.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew means “seventy-seven,” not “seventy times seven.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: sevenfold
  simplified_phrase: seven times over
  preserved_meaning: Vengeance for Cain has a sevenfold measure.
  reasoning_layer_used: Lexical decision for שִׁבְעָתַיִם.
  rationale: The common phrase makes the same intensification easier to understand.
- pob_phrase: and Lamech seventy-sevenfold
  simplified_phrase: and Lamech is avenged seventy-seven times over
  preserved_meaning: The linked comparison escalates vengeance from Cain’s sevenfold measure to Lamech’s seventy-sevenfold measure.
  reasoning_layer_used: Lexical and theological decisions for וְלֶמֶךְ and שִׁבְעִים וְשִׁבְעָה.
  rationale: Repeating the implied verb clarifies the comparison while preserving the simple link and the number seventy-seven.
