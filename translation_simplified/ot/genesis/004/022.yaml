translation:
  language: en
  text: Zillah also gave birth to Tubal-cain. He forged every kind of cutting tool made of bronze[b] and iron.[a] Tubal-cain’s sister was Naamah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is difficult. It may instead describe Tubal-cain as a sharpener, hammerer, or metalworker rather than as a maker of metal tools.
    reason: alternative_reading
  - marker: b
    text: The word translated “bronze” may also mean “copper.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: bore Tubal-cain
  simplified_phrase: gave birth to Tubal-cain
  preserved_meaning: Zillah was Tubal-cain’s mother.
  reasoning_layer_used: POB lexical decision for יָלְדָה
  rationale: “Gave birth to” is clearer to readers unfamiliar with genealogical use of “bore.”
- pob_phrase: a forger of every cutting tool of bronze and iron
  simplified_phrase: He forged every kind of cutting tool made of bronze and iron.
  preserved_meaning: Tubal-cain made cutting tools from bronze and iron.
  reasoning_layer_used: POB lexical decisions for לֹטֵשׁ and כָּל חֹרֵשׁ
  rationale: A direct sentence clearly identifies Tubal-cain’s work while retaining the tool-making interpretation.
- pob_phrase: the sister of Tubal-cain was Naamah
  simplified_phrase: Tubal-cain’s sister was Naamah
  preserved_meaning: Naamah is identified as Tubal-cain’s sister.
  reasoning_layer_used: POB lexical decision for אֲחוֹת
  rationale: The possessive form is more natural in modern English.
