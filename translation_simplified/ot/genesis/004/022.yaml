  text: Zillah also gave birth to Tubal-cain[a], who forged all kinds of tools from bronze and iron[b]. Tubal-cain’s sister was Naamah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'a craftsman who hammered bronze and iron.'
    reason: simplification_note
  - marker: b
    text: Bronze may also refer to copper.
    reason: simplification_note
