translation:
  language: en
  text: Cain said to Yahweh,[a] “My wrongdoing is too great for me to bear.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean, “My guilt is more than I can bear,” “My punishment is more than I can bear,” or “My wrongdoing is too great to forgive.”
