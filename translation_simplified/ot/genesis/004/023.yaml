translation:
  language: en
  text: 'Lamech spoke to his wives:


    “Adah and Zillah, hear my voice!

    Lamech’s wives, pay attention to what I say!

    I have killed a man because he wounded me,[a]

    even a young man because he struck me.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “I killed a man for my wound, a young man for my bruise.”
    reason: lexical_alternative
  - marker: b
    text: 'Lamech’s words may instead be a threat or general boast: “I would kill a man.”'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: listen to my word
  simplified_phrase: pay attention to what I say
  preserved_meaning: Lamech urgently calls his wives to listen to his speech.
  reasoning_layer_used: Lexical decisions for הַאְזֵנָּה and אִמְרָתִי
  rationale: This wording makes the command immediately clear while retaining its force.
- pob_phrase: for wounding me ... for striking me
  simplified_phrase: because he wounded me ... because he struck me
  preserved_meaning: Lamech gives the injuries as the reason for his retaliation.
  reasoning_layer_used: Lexical and theological decisions for the two ל phrases
  rationale: The causal wording is natural without implying justified self-defense.
- pob_phrase: even a young man
  simplified_phrase: even a young man
  preserved_meaning: The poetic line may identify or intensify the man as a younger male rather than name a second victim.
  reasoning_layer_used: POB rendering, lexical decision for יֶלֶד, and grounding review
  rationale: Retaining “even” avoids making two separate killings explicit.
translation_notes:
  risk_flags:
  - risk: The causal wording could be mistaken for a claim of self-defense.
    mitigation: No language of necessity or justification is added.
  - risk: The Hebrew may express a threat rather than an actual killing.
    mitigation: Footnote b preserves this documented alternative.
