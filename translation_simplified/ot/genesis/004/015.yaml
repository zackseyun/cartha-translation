translation:
  language: en
  text: Then Yahweh said to him, “So whoever kills Cain will face vengeance seven times over.” And Yahweh put a mark on Cain[a] so that no one who found him would strike him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “sign.” The text does not say what form it took.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Therefore whoever kills Cain, vengeance will be taken on him sevenfold
  simplified_phrase: So whoever kills Cain will face vengeance seven times over
  preserved_meaning: Cain’s killer will receive sevenfold vengeance, while the one who exacts it remains unstated.
  reasoning_layer_used: Lexical and theological decisions on יֻקָּם and שִׁבְעָתַיִם
  rationale: The direct wording makes the warning easy to follow without naming the avenger.
- pob_phrase: lest anyone finding him should strike him
  simplified_phrase: so that no one who found him would strike him
  preserved_meaning: The mark was intended to prevent anyone who encountered Cain from striking him.
  reasoning_layer_used: Integrated lexical decisions on לְבִלְתִּי הַכּוֹת אֹתוֹ and כָּל מֹצְאוֹ
  rationale: A natural purpose clause replaces the formal “lest” construction while retaining “strike.”
- pob_phrase: put a mark on Cain
  simplified_phrase: put a mark on Cain
  preserved_meaning: Yahweh gave Cain an unspecified protective mark or sign.
  reasoning_layer_used: Theological decision on the nature of אוֹת
  rationale: Keeping “mark” avoids guessing what form the sign took.
translation_notes:
  risk_flags:
