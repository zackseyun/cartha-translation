translation:
  language: en
  text: Then Yahweh said to him[a], "Therefore, if anyone kills Cain, vengeance will be taken on him seven times over." And Yahweh put a mark on Cain[b], so that no one who found him would attack him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'he will be avenged sevenfold.' The Hebrew phrasing can mean that Cain himself would be avenged, but the main text clarifies that his killer would face God's punishment.
    reason: simplification_note
  - marker: b
    text: Or 'sign.' The Hebrew word refers generally to a sign or distinguishing mark; the text does not specify what form it took.
    reason: simplification_note
simplification_decisions:
- simplified_phrase: vengeance will be taken on him seven times over
  preserved_meaning: Replaced 'sevenfold' with 'seven times over' to make the multiplier clear and natural for a modern audience while retaining the weight of divine retribution.
  reasoning_layer_used: POB audit trail
  rationale: Replaced 'sevenfold' with 'seven times over' to make the multiplier clear and natural for a modern audience while retaining the weight of divine retribution.
- simplified_phrase: so that no one who found him would attack him
  preserved_meaning: Avoided the archaic 'lest' in favor of a modern negative purpose clause. Updated 'strike him' to 'attack him' to capture the modern equivalent of physical, potentially lethal assault implied by the Hebrew verb.
  reasoning_layer_used: POB audit trail
  rationale: Avoided the archaic 'lest' in favor of a modern negative purpose clause. Updated 'strike him' to 'attack him' to capture the modern equivalent of physical, potentially lethal assault implied by the Hebrew verb.
