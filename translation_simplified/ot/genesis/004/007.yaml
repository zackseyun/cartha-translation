translation:
  language: en
  text: If you do what is right, will you not be accepted[a]? But if you do not do what is right, sin is crouching at the door[b]; its desire is for you[c], but you must rule over it[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says 'lifting up.' This can refer to lifting up Cain's face (no longer looking down in anger) or to him being accepted.
    reason: simplification_note
  - marker: b
    text: Or 'a sin offering is lying at the door.' However, the picture of sin as a crouching wild animal is more likely here.
    reason: simplification_note
  - marker: c
    text: Or 'its longing' or 'its urge.' This matches the language used in Genesis 3:16.
    reason: simplification_note
  - marker: d
    text: Or 'you shall rule over it' or 'you can rule over it.' The Hebrew can express a command, a prediction, or a possibility.
    reason: simplification_note
