translation:
  language: en
  text: If you do what is right, will you not be accepted?[a] But if you do not, sin is crouching at the door like a beast.[b] It desires to have you, but you must rule over it.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says “lifting up,” possibly referring to Cain’s face being lifted or to his being accepted.
    reason: lexical_alternative
  - marker: b
    text: Another possible reading is “a sin offering is lying at the door,” though the image more naturally portrays sin as a crouching beast.
    reason: alternative_reading
  - marker: c
    text: The last words may also mean “you shall rule over it” or “you can rule over it.”
    reason: alternative_reading
