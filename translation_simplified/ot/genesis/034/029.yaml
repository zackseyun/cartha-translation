translation:
  language: en
  text: They seized all their wealth, took their young children[a] and wives captive, and looted everything in their homes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “their dependents”; the Hebrew especially points to the young and vulnerable members of a household.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says “house,” which may refer collectively to their homes or households.
    reason: lexical_alternative
