translation:
  language: en
  text: These men are at peace with us. Let them live in the land and trade there.[a] There is plenty of room for them. We will marry their daughters, and we will give our daughters to them in marriage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “trade through the land.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Let them dwell in the land and trade in it
  simplified_phrase: Let them live in the land and trade there
  preserved_meaning: The townsmen are urged to allow the men to settle and conduct business in the land.
  reasoning_layer_used: POB lexical decisions for וְיֵשְׁבוּ, וְיִסְחֲרוּ, and אֹתָהּ
  rationale: “Live” and “there” express the same ideas in more familiar English.
- pob_phrase: for, you see, the land is broad enough for them
  simplified_phrase: There is plenty of room for them
  preserved_meaning: The land is spacious enough to accommodate the newcomers.
  reasoning_layer_used: POB lexical decision and cultural note for רַחֲבַת יָדַיִם
  rationale: The rewrite states the Hebrew idiom’s intended sense without its awkward clause structure.
- pob_phrase: We will take their daughters for wives for ourselves
  simplified_phrase: We will marry their daughters
  preserved_meaning: The speakers propose taking the other group’s daughters as wives.
  reasoning_layer_used: POB lexical decision for נִקַּח לָנוּ לְנָשִׁים
  rationale: “Marry” communicates the Hebrew marriage idiom directly in modern English.
translation_notes:
  risk_flags:
  - risk: “Marry their daughters” compresses the explicit phrase “for ourselves.”
    mitigation: The first-person subject already identifies the proposed husbands and preserves the reciprocal marriage arrangement.
