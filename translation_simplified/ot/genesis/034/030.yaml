translation:
  language: en
  text: Then Jacob said to Simeon and Levi, “You have brought trouble on me. You have made me stink among the people living in this land, among the Canaanites and the Perizzites.[a] There are only a few of us. They will join forces against me and strike me down. My household and I will be destroyed.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses the vivid image “made me stink,” meaning that Jacob had become offensive or odious to the people.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: making me stink among the inhabitants of the land, among the Canaanites and the Perizzites
  simplified_phrase: You have made me stink among the people living in this land, among the Canaanites and the Perizzites.
  preserved_meaning: Jacob says his sons have made him offensive to the local peoples while retaining the Hebrew image.
  reasoning_layer_used: lexical decisions and footnote
  rationale: “People living in this land” replaces “inhabitants,” while repeated “among” avoids making the named peoples an exhaustive list.
- pob_phrase: Since I am few in number
  simplified_phrase: There are only a few of us.
  preserved_meaning: Jacob's group is numerically small.
  reasoning_layer_used: lexical decision for מְתֵי מִסְפָּר
  rationale: The Hebrew idiom becomes direct common English without changing its numerical sense.
- pob_phrase: they will gather against me and strike me down
  simplified_phrase: They will join forces against me and strike me down.
  preserved_meaning: The hostile groups will come together to attack Jacob violently.
  reasoning_layer_used: lexical decision and applied revision for וְנֶאֶסְפוּ עָלַי
  rationale: “Join forces” naturally conveys hostile groups gathering together.
translation_notes:
  risk_flags:
  - risk: Modern readers may first understand “made me stink” as referring to a literal odor.
    mitigation: The footnote explains that the image means becoming offensive or odious.
