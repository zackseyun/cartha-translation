translation:
  language: en
  text: 'While they were taking her out, she sent this message to her father-in-law: “I am pregnant by the man who owns these things. Please identify[a] who owns this signet ring, these cords, and this staff.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “recognize.” The Hebrew word can mean either recognize or identify; here it is a pointed request to examine the evidence.
