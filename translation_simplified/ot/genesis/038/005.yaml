translation:
  language: en
  text: She became pregnant again and gave birth to a son. She named him Shelah. He[a] was at Chezib[b] when she gave birth to him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “he,” probably referring to Judah. Some ancient witnesses and interpreters understand it as “she.”
    reason: alternative_reading
  - marker: b
    text: Chezib is also called Kezib in some passages; both names refer to the same place.
    reason: lexical_alternative
