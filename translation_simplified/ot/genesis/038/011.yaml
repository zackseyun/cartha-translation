- pob_phrase: Lest he also die like his brothers
  simplified_phrase: He too might die, as his brothers did
  preserved_meaning: Judah fears that Shelah may suffer the same fate as Er and Onan.
  reasoning_layer_used: POB lexical decisions for פֶּן and כְּאֶחָיו
  rationale: A direct statement of fear replaces the uncommon conjunction “lest.”
