translation:
  language: en
  text: Then Judah said to his daughter-in-law Tamar, “Live as a widow in your father’s home until my son Shelah grows up.” He thought, “He too might die, as his brothers did.” So Tamar went and lived in her father’s home.
  philosophy: optimal-equivalence
