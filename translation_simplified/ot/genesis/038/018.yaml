translation:
  language: en
  text: He asked, “What should I give you as a pledge?” She answered, “Your personal seal[a], your cord, and the staff in your hand.” He gave them to her and had sexual relations with her, and she became pregnant by him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This was a device used to mark something with the owner’s identity; the Hebrew does not say whether it was a ring or another kind of seal.
    reason: cultural_note
simplification_decisions:
- pob_phrase: What pledge shall I give you?
  simplified_phrase: What should I give you as a pledge?
  preserved_meaning: He asks which item he should leave as security until payment.
  reasoning_layer_used: POB lexical decision for הָעֵרָבוֹן
  rationale: The recast question makes the function of “pledge” easier to follow.
- pob_phrase: Your seal
  simplified_phrase: Your personal seal[a]
  preserved_meaning: She requests his identifying seal without specifying its exact form.
  reasoning_layer_used: POB lexical decision and footnote for חֹתָמְךָ
  rationale: “Personal” and the note explain the object while avoiding the unsupported claim that it was a ring.
- pob_phrase: she conceived by him
  simplified_phrase: she became pregnant by him
  preserved_meaning: Her pregnancy resulted from intercourse with him.
  reasoning_layer_used: POB lexical decision for וַתַּהַר לוֹ and latest revision summary
  rationale: “Became pregnant” is more immediately understandable than “conceived.”
