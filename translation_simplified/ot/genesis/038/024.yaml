translation:
  language: en
  text: About three months later, Judah was told, “Your daughter-in-law Tamar has acted as a prostitute. In fact, she is now pregnant because of her prostitution.” Judah said, “Bring her out and let her be burned to death.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And it happened about three months later that Judah was told
  simplified_phrase: About three months later, Judah was told
  preserved_meaning: The report reached Judah at an approximate time three months later.
  reasoning_layer_used: POB lexical decisions for וַיְהִי, כְּמִשְׁלֹשׁ חֳדָשִׁים, and וַיֻּגַּד לִיהוּדָה
  rationale: The shorter opening keeps the timeline and passive report while removing a heavy narrative frame.
- pob_phrase: and behold, she is also pregnant by prostitution
  simplified_phrase: In fact, she is now pregnant because of her prostitution
  preserved_meaning: The accusation emphasizes with surprise that prostitution resulted in her pregnancy.
  reasoning_layer_used: POB lexical and theological decisions for וְגַם הִנֵּה and לִזְנוּנִים
  rationale: “In fact” conveys the emphatic surprise more naturally than “behold,” while retaining prostitution language.
- pob_phrase: Bring her out, and let her be burned
  simplified_phrase: Bring her out and let her be burned to death
  preserved_meaning: Judah immediately commands execution by burning without naming the agents.
  reasoning_layer_used: POB theological decision on the force of Judah’s sentence
  rationale: The wording keeps the passive command and makes its lethal force clear.
interpretive_expansions:
- pob_phrase: let her be burned
  rendering: let her be burned to death
  claim: Judah orders execution by burning rather than a nonlethal burning.
  evidence:
  - The POB theological rationale identifies the directive as a command for execution by burning.
  - The immediate legal-accusatory context presents this as Judah’s sentence against Tamar.
  confidence: high
  alternatives_preserved:
  - let her be burned
  - bring her out to be burned
translation_notes:
  risk_flags:
  - risk: “Prostitution” may sound like an established fact rather than the report’s accusation.
    mitigation: The charge remains inside direct speech introduced by “Judah was told.”
