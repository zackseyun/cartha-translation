  language: en
  text: He asked the local men, “Where is the cult prostitute[a] who was beside the road at Enaim[b]?” They answered, “There has been no cult prostitute here.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “temple prostitute.” The Hebrew refers to a prostitute associated with religious worship, but it does not specify a temple building.
    reason: lexical_alternative
