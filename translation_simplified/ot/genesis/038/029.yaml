  preserved_meaning: The naming remains impersonal because the text does not identify who named him.
  reasoning_layer_used: POB lexical decision for וַיִּקְרָא שְׁמוֹ פָּרֶץ
  rationale: The passive wording is natural modern English and does not invent a naming subject.
