translation:
  language: en
  text: As he pulled his hand back, his brother suddenly came out. Then she said, “What a breakthrough you have made!” So he was named Perez.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In Hebrew, “breakthrough” and the name Perez come from the same root.
    reason: lexical_alternative
