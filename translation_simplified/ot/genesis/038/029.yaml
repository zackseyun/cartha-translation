  simplified_phrase: As he pulled his hand back, his brother suddenly came out
  preserved_meaning: The first child withdrew his hand, and his brother unexpectedly emerged first.
  reasoning_layer_used: POB lexical decisions for כְּמֵשִׁיב יָדוֹ, וְהִנֵּה, and יָצָא אָחִיו
  rationale: “Pulled” and “suddenly” convey the physical action and narrative surprise in ordinary English.
- pob_phrase: What a breach you have made for yourself!
  simplified_phrase: What a breakthrough you have made!
  preserved_meaning: She exclaims that the child forcefully broke through, anticipating his name.
  reasoning_layer_used: POB lexical decision for מַה פָּרַצְתָּ עָלֶיךָ פָּרֶץ
  rationale: “Breakthrough” keeps the source image and supports the Hebrew naming wordplay without adding an unsupported idea.
- pob_phrase: his name was called Perez
