  preserved_meaning: He reestablished Israel’s territorial boundary.
  reasoning_layer_used: Lexical decision for הֵשִׁיב and גְּבוּל
  rationale: The shorter possessive form keeps the same political and geographical meaning.
- pob_phrase: according to the word of Yahweh ... which he had spoken
  simplified_phrase: This happened just as Yahweh ... had said
  preserved_meaning: The restored border fulfilled Yahweh’s earlier declaration.
  reasoning_layer_used: Lexical decision for כִּדְבַר and immediate syntax
  rationale: A separate sentence makes the fulfillment relationship easier to follow.
- pob_phrase: spoken by the hand of his servant Jonah
  simplified_phrase: said through his servant Jonah
  preserved_meaning: Yahweh delivered his message through Jonah as his prophetic agent.
  reasoning_layer_used: Lexical decision for בְּיַד and עַבְדּוֹ
  rationale: “Through” states the Hebrew agency idiom in ordinary modern English.
