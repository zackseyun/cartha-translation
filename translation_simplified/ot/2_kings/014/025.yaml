translation:
  language: en
  text: He restored Israel’s border from Lebo-hamath[a] to the Sea of the Arabah.[b] This happened just as Yahweh, the God of Israel, had said through his servant Jonah son of Amittai, the prophet from Gath-hepher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, more literally, “the entrance of Hamath.”
    reason: lexical_alternative
  - marker: b
    text: This likely refers to the Dead Sea.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: He restored the border of Israel
