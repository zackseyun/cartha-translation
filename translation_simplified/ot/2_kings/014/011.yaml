- pob_phrase: Amaziah would not listen
  simplified_phrase: Amaziah refused to listen
  preserved_meaning: Amaziah deliberately rejected what he had heard.
  reasoning_layer_used: POB lexical decision for שׁמע
  rationale: “Refused” states the deliberate resistance already carried by “would not.”
- pob_phrase: Jehoash king of Israel ... Amaziah king of Judah
  simplified_phrase: King Jehoash of Israel ... King Amaziah of Judah
  preserved_meaning: Each king and his kingdom remain explicitly identified.
  reasoning_layer_used: SPOB target style
  rationale: Modern title order is easier to read without changing either identity.
- pob_phrase: so Jehoash ... went up, and he and Amaziah ... met
  simplified_phrase: So King Jehoash ... went up, and he met King Amaziah
  preserved_meaning: Jehoash advanced and directly encountered Amaziah.
  reasoning_layer_used: POB syntax and lexical decisions
  rationale: Dividing the opening contrast into a short sentence makes the sequence clearer.
