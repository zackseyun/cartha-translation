translation:
  language: en
  text: Jehoash king of Israel captured Amaziah king of Judah at Beth-shemesh. Amaziah was the son of Jehoash, who was the son of Ahaziah. Then Jehoash came to Jerusalem[a] and tore down a section of the city wall from the Ephraim Gate to the Corner Gate—a stretch about 600 feet (180 meters) long.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew consonantal text reads “they came to Jerusalem,” but the context and the next singular verb support “Jehoash came to Jerusalem.”
    reason: textual_variant
  - marker: b
    text: 'Hebrew: four hundred cubits.'
    reason: cultural_note
