translation:
  language: en
  text: He did what was right in Yahweh’s eyes. But he was not like his ancestor David. In everything, he followed the example of his father Joash.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: yet not like David his father
  simplified_phrase: But he was not like his ancestor David.
  preserved_meaning: Amaziah’s genuine commendation is limited because he did not match David’s standard.
  reasoning_layer_used: Theological decision and cultural note
  rationale: A new sentence makes the contrast clear while identifying David as a dynastic ancestor.
- pob_phrase: he did according to all that Joash his father had done
  simplified_phrase: In everything, he followed the example of his father Joash.
  preserved_meaning: Amaziah’s conduct closely conformed to Joash’s prior conduct.
  reasoning_layer_used: Lexical decisions for כְּכֹל אֲשֶׁר עָשָׂה and עָשָׂה
  rationale: Natural comparison language preserves both comprehensive conformity and prior example.
- pob_phrase: in the eyes of Yahweh
  simplified_phrase: in Yahweh’s eyes
  preserved_meaning: Yahweh is the one evaluating the king’s conduct.
  reasoning_layer_used: Lexical decision for בְּעֵינֵי יְהוָה
  rationale: The shorter form remains clear and preserves the Hebrew image of divine evaluation.
interpretive_expansions:
- pob_phrase: David his father
  rendering: his ancestor David
  claim: Here “father” identifies David as Amaziah’s dynastic ancestor rather than his immediate parent.
  evidence:
