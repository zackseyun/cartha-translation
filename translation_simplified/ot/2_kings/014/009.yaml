translation:
  language: en
  text: 'Then King Jehoash of Israel sent this message to King Amaziah of Judah: “A thornbush[a] in Lebanon sent a message to a cedar in Lebanon: ‘Give your daughter to my son as his wife.’ And a wild beast in Lebanon passed by and trampled the thornbush.”'
