translation:
  language: en
  text: Yahweh saw how bitterly Israel was suffering. No one was left—whether bound or free—and Israel had no one to help them.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean that Israel’s suffering was very grievous or very severe.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew expression translated “whether bound or free” is uncertain; it likely means that no one at all remained or that every group was exhausted.
    reason: alternative_reading
