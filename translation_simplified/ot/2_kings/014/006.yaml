translation:
  language: en
  text: 'But he did not put the killers’ sons to death. He followed what is written in the Book of the Law of Moses, where Yahweh commanded: “Fathers must not be put to death because of their sons, and sons must not be put to death because of their fathers. Instead, each man shall die for his own sin.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the sons of the killers
  simplified_phrase: the killers’ sons
  preserved_meaning: The men’s sons were not executed for their fathers’ actions.
  reasoning_layer_used: lexical decision for בְּנֵי הַמַּכִּים
  rationale: The possessive form is more natural while retaining the source’s masculine wording.
- pob_phrase: according to what is written in the Book of the Law of Moses, which Yahweh commanded, saying
  simplified_phrase: He followed what is written in the Book of the Law of Moses, where Yahweh commanded
  preserved_meaning: His action conformed to Yahweh’s written command in Moses’ Law.
  reasoning_layer_used: lexical decisions for כַּכָּתוּב, בְּסֵפֶר תּוֹרַת מֹשֶׁה, and יְהוָה
  rationale: A new sentence and direct verb make the legal basis easier to follow.
- pob_phrase: Fathers shall not be put to death for sons
  simplified_phrase: Fathers must not be put to death because of their sons
  preserved_meaning: The law prohibits executing fathers on account of their sons.
  reasoning_layer_used: lexical and theological decisions on legal liability
  rationale: “Must not” states the prohibition plainly, and “because of” clarifies the basis of punishment.
translation_notes:
  risk_flags:
  - risk: Readers may take the final “shall die” as a claim about every consequence of sin.
    mitigation: The surrounding execution language keeps the statement within its judicial setting.
