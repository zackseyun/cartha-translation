translation:
  language: en
  text: He did what Yahweh judged to be evil. He continued in all the sins of Jeroboam son of Nebat—the sinful practices by which Jeroboam had caused Israel to sin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Jeroboam son of Nebat, who caused Israel to sin.” The Hebrew can connect this clause directly to Jeroboam rather than to his sinful practices.
    reason: alternative_reading
