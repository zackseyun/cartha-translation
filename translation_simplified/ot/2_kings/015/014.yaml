translation:
  language: en
  text: Then Menahem son of Gadi left Tirzah and went up to Samaria. There he struck down Shallum son of Jabesh and killed him. Then Menahem became king in his place.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: went up from Tirzah and came to Samaria
  simplified_phrase: left Tirzah and went up to Samaria
  preserved_meaning: Menahem traveled from Tirzah to Samaria, while the Hebrew image of going up remains.
  reasoning_layer_used: Lexical decisions for וַיַּעַל, מִתִּרְצָה, and וַיָּבֹא שֹׁמְרוֹן.
  rationale: The rewrite removes the awkward paired motion verbs without losing the route or ascent image.
- pob_phrase: in Samaria
  simplified_phrase: There
  preserved_meaning: The attack happened in Samaria.
  reasoning_layer_used: Lexical decision for בְּשֹׁמְרוֹן.
  rationale: The pronoun preserves the repeated location in smoother English.
- pob_phrase: put him to death, and he reigned in his place
  simplified_phrase: killed him. Then Menahem became king in his place.
  preserved_meaning: Menahem killed Shallum and succeeded him as king.
  reasoning_layer_used: Lexical decisions for וַיְמִיתֵהוּ and וַיִּמְלֹךְ תַּחְתָּיו.
  rationale: Common wording and a sentence break make the violent succession immediately clear.
