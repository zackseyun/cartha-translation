translation:
  language: en
  text: Then Menahem attacked Tiphsah, everyone in it,[a] and its territory from Tirzah, because the city had refused to open its gates to him. He attacked the city and ripped open all its pregnant women.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “everything in it.” The Hebrew can refer broadly to all that was in the city, though the context likely includes its inhabitants.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: struck Tiphsah
  simplified_phrase: attacked Tiphsah
  preserved_meaning: Menahem carried out a violent military action against the city.
  reasoning_layer_used: The lexical decision for יכה permits “attacked” while preserving the violence.
  rationale: “Attacked” makes the military setting immediately clear.
- pob_phrase: all who were in it
  simplified_phrase: everyone in it
  preserved_meaning: The attack included the city’s inhabitants.
  reasoning_layer_used: The lexical rationale says the military context naturally includes the inhabitants.
  rationale: “Everyone” is shorter and more natural in common English.
- pob_phrase: and he struck it, ripping open
  simplified_phrase: He attacked the city and ripped open
  preserved_meaning: Menahem assaulted the city and violently opened the pregnant women’s bodies.
  reasoning_layer_used: The lexical decisions preserve both the repeated attack and the force of בקע.
  rationale: A new sentence clarifies the sequence without softening the atrocity.
interpretive_expansions:
- pob_phrase: because it had not opened to him
  rendering: because the city had refused to open its gates to him
  claim: The city denied Menahem entry rather than merely failing to open something unspecified.
  evidence:
  - The POB cultural note explains that “opened” means opening the city to Menahem in surrender or admission.
  - The singular subject refers collectively to the city.
  confidence: high
  alternatives_preserved:
  - refused to surrender to him
  - refused to admit him
translation_notes:
