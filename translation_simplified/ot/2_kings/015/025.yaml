translation:
  language: en
  text: Pekah son of Remaliah, a high-ranking officer serving the king,[a] conspired against him. In Samaria, at the fortified royal residence, Pekah struck the king down with Argob and Arieh. Fifty men from Gilead were also with Pekah. He killed the king and took his place as king.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The exact military rank of this officer is uncertain; he may have been a captain.
    reason: lexical_alternative
