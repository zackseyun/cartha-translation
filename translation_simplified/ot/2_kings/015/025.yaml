- pob_phrase: his officer
  simplified_phrase: a high-ranking officer serving the king
  preserved_meaning: Pekah held an important military office under the king, though his exact rank is uncertain.
  reasoning_layer_used: POB lexical decision for שָׁלִישׁוֹ
  rationale: This explains Pekah’s status and relationship without assigning him a precise rank.
- pob_phrase: in the citadel of the king’s house
  simplified_phrase: at the fortified royal residence
  preserved_meaning: The attack occurred at the king’s fortified residence.
  reasoning_layer_used: POB lexical decision for בְּאַרְמוֹן בֵּית מֶלֶךְ
  rationale: This avoids the opaque phrase “king’s house” without adding an unsupported architectural detail.
- pob_phrase: put him to death and reigned in his place
  simplified_phrase: killed the king and took his place as king
  preserved_meaning: Pekah caused the king’s death and then succeeded him as ruler.
  reasoning_layer_used: POB lexical decisions for וַיְמִיתֵהוּ and וַיִּמְלֹךְ תַּחְתָּיו
  rationale: The succession formula becomes direct English while remaining distinct from the earlier striking down.
interpretive_expansions:
- pob_phrase: him / his place
  rendering: the king / his place as king
  claim: The pronouns refer to the reigning king whom Pekah killed and succeeded.
  evidence:
