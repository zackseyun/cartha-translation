translation:
  language: en
  text: Then Hoshea son of Elah organized a conspiracy against Pekah son of Remaliah.[a] He struck Pekah down and put him to death, then became king in his place. This happened in the twentieth year of Jotham son of Uzziah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Hebrew repeats the same word root for emphasis: literally, “conspired a conspiracy.”'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says “the twentieth year of Jotham son of Uzziah,” though this creates a chronological difficulty because Jotham’s reign is described elsewhere as shorter than twenty years.
    reason: textual_variant
simplification_decisions:
- pob_phrase: conspired in a conspiracy against
  simplified_phrase: organized a conspiracy against
  preserved_meaning: Hoshea deliberately formed a hostile plot against the king, with the Hebrew emphasis noted in a footnote.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: The natural phrase preserves the force of an active conspiracy without the wooden repetition.
- pob_phrase: struck him down, put him to death
  simplified_phrase: struck Pekah down and put him to death
  preserved_meaning: The violent attack and the causative killing remain distinct actions.
  reasoning_layer_used: POB lexical decisions for וַיַּכֵּהוּ and וַיְמִיתֵהוּ
  rationale: Repeating Pekah’s name makes the new sentence clear while retaining both source verbs.
- pob_phrase: reigned in his place
  simplified_phrase: became king in his place
  preserved_meaning: Hoshea succeeded Pekah as king.
  reasoning_layer_used: POB lexical decision for וַיִּמְלֹךְ תַּחְתָּיו
  rationale: “Became king” states the succession in common English.
