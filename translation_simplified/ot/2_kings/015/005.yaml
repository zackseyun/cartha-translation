translation:
  language: en
  text: Yahweh struck the king, and he had a leprous skin disease.[a] He remained sick until he died and lived in a separate house.[b] Jotham, the king’s son, was in charge of the royal household and judged the people of the country.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term can refer more broadly to a serious skin disease, not necessarily modern leprosy.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew phrase likely means a house where the king lived apart from others.
    reason: lexical_alternative
