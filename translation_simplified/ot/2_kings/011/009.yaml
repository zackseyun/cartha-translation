translation:
  language: en
  text: The commanders over units of one hundred men did everything Jehoiada the priest commanded. Each commander brought his men to Jehoiada—both those coming on duty that Sabbath and those going off duty.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “those entering on the Sabbath and those leaving on the Sabbath”; in this context, these were the incoming and outgoing duty shifts.
    reason: lexical_alternative
