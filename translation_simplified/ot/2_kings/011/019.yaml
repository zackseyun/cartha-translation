translation:
  language: en
  text: Then Jehoiada gathered the commanders over groups of one hundred, the Carites[a], the runners[b], and all the people of the land. Together they led the king down from Yahweh’s temple and went through the runners’ gate to the king’s palace. Then the king sat on the throne of the kings.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term “Carites” is uncertain; it may mean the Cherethites or the bodyguard.
    reason: alternative_reading
  - marker: b
    text: The “runners” were probably royal guards or couriers.
    reason: lexical_alternative
