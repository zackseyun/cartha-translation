translation:
  language: en
  text: In the seventh year, Jehoiada sent for the commanders over units of one hundred, the Carites[a], and the runners[b]. He brought them to him at Yahweh’s house (the temple). There he made a covenant with them, put them under oath, and showed them the king’s son.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Cherethites.” This was probably a royal guard unit, but its exact identity is uncertain.
    reason: alternative_reading
  - marker: b
    text: “The runners” were probably royal guards or couriers.
    reason: cultural_note
simplification_decisions:
- pob_phrase: sent and took the commanders of hundreds
  simplified_phrase: sent for the commanders over units of one hundred
  preserved_meaning: Jehoiada summoned military officers who commanded groups of one hundred.
  reasoning_layer_used: Lexical decisions for שָׁלַח and שָׂרֵי הַמֵּאוֹת
  rationale: “Sent for” conveys the summons, while the added wording explains the officers’ rank.
- pob_phrase: brought them to himself in the house of Yahweh
  simplified_phrase: brought them to him at Yahweh’s house (the temple)
  preserved_meaning: Jehoiada brought the men into his presence at Yahweh’s temple.
  reasoning_layer_used: Lexical and theological decisions for אֵלָיו, בֵּית יְהוָה, and יְהוָה
  rationale: “Brought them to him” preserves Jehoiada’s agency, and the parenthesis identifies Yahweh’s house.
- pob_phrase: made a covenant with them and put them under oath in the house of Yahweh
  simplified_phrase: There he made a covenant with them, put them under oath
  preserved_meaning: At Yahweh’s temple, Jehoiada formally bound the men by covenant and oath.
  reasoning_layer_used: Lexical decisions for כָּרַת בְּרִית and וַיַּשְׁבַּע
  rationale: “There” avoids repeating the location while keeping covenant and oath distinct.
