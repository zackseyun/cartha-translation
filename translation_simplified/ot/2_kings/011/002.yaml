translation:
  language: en
  text: But Jehosheba was King Joram’s daughter and Ahaziah’s sister. She took Joash, Ahaziah’s son, and stole him away from among the king’s sons who were being put to death. They hid Joash and his nurse[a] in a bedroom, away from Athaliah, so he was not put to death.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “his wet nurse.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Jehosheba, the daughter of King Joram, sister of Ahaziah
  simplified_phrase: Jehosheba was King Joram’s daughter and Ahaziah’s sister.
  preserved_meaning: Both family relationships remain explicit, including the source-driven term “sister.”
  reasoning_layer_used: Lexical and theological decisions on family relationships
  rationale: A separate sentence makes the family relationships easier to follow.
- pob_phrase: took Joash son of Ahaziah and stole him away from among the king’s sons who were being put to death
  simplified_phrase: She took Joash, Ahaziah’s son, and stole him away from among the king’s sons who were being put to death.
  preserved_meaning: Jehosheba secretly rescued Joash while the other royal sons were being killed.
  reasoning_layer_used: Lexical decisions on וַתִּקַּח, וַתִּגְנֹב, and הַמּוּמָתִים
  rationale: The rescue becomes its own sentence while the force of “stole” and the ongoing killings remain.
- pob_phrase: along with his nurse, into the bedroom; and they hid him from Athaliah
  simplified_phrase: They hid Joash and his nurse in a bedroom, away from Athaliah
  preserved_meaning: The plural subject hides Joash with his nurse in the bedroom from Athaliah.
  reasoning_layer_used: Source syntax, lexical decisions on nurse and bedroom, and the theological decision on the plural verb
  rationale: This avoids assigning an unstated action to Jehosheba alone and keeps the nurse within the concealment scene.
interpretive_expansions:
- pob_phrase: along with his nurse, into the bedroom; and they hid him from Athaliah
  rendering: They hid Joash and his nurse in a bedroom, away from Athaliah
  claim: The nurse was concealed in the bedroom together with Joash.
  evidence:
  - The reviewed source sequence treats Joash and his nurse as the objects within the plural hiding action.
  - The bedroom phrase locates their concealment from Athaliah.
  confidence: moderate
  alternatives_preserved:
  - The POB wording can be read as placing the nurse with Joash during the rescue into the bedroom.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “nurse” as a medical professional.
    mitigation: The footnote gives the more specific alternative “wet nurse.”
  - risk: The plural “they” does not identify everyone who helped hide Joash and his nurse.
    mitigation: The translation preserves the source’s plural subject without naming unstated participants.
