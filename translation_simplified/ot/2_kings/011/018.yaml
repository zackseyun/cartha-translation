simplification_decisions:
- pob_phrase: went into the house of Baal
  simplified_phrase: went into Baal’s temple
  preserved_meaning: The people entered Baal’s worship site before tearing it down.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: “Temple” makes the building’s religious function clear while “into” preserves the direction of entry.
- pob_phrase: They thoroughly smashed his altars and his images
  simplified_phrase: They completely smashed Baal’s altars and images
  preserved_meaning: They violently and fully destroyed the altars and images belonging to Baal.
  reasoning_layer_used: POB lexical decisions for מִזְבְּחֹתָיו, צְלָמָיו, and שִׁבְּרוּ הֵיטֵב
  rationale: Naming Baal clarifies the pronoun, and “completely” retains the action’s full force.
- pob_phrase: appointed overseers over the house of Yahweh
  simplified_phrase: appointed overseers over Yahweh’s temple
  preserved_meaning: The priest assigned people authority to supervise Yahweh’s temple.
  reasoning_layer_used: POB lexical decisions for פְּקֻדּוֹת and בֵּית יְהוָה, plus the theological decision on YHWH
  rationale: “Over” preserves their sphere of oversight, while “temple” clarifies the building’s function.
translation_notes:
  risk_flags:
