  preserved_meaning: They were people afflicted with the condition called צָרַעַת.
  reasoning_layer_used: POB lexical decision and cultural note
  rationale: The descriptive wording avoids equating the ancient condition only with modern leprosy.
- pob_phrase: they entered one tent and ate and drank, and they carried off
  simplified_phrase: they went into one tent and ate and drank. They carried off
  preserved_meaning: The same sequence of entering, eating, drinking, and removing goods remains intact.
  reasoning_layer_used: Source narrative sequence and POB lexical decisions
  rationale: Dividing the long chain into sentences makes the action easier to follow.
- pob_phrase: Then they returned and entered another tent
