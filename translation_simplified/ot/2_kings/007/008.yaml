translation:
  language: en
  text: When these men with the skin disease reached the edge of the camp,[a] they went into one tent and ate and drank. They carried off silver, gold, and clothing, then went away and hid these things. After that, they came back, entered another tent, carried things off from there too, and went away and hid them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term is traditionally translated “lepers,” but it may refer to a broader range of skin diseases than modern leprosy.
    reason: cultural_note
