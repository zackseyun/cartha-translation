translation:
  language: en
  text: 'Then Elisha said, “Listen to Yahweh’s word. This is what Yahweh says: About this time tomorrow, one measure[a] of fine flour will sell for one shekel,[b] and two measures of barley will sell for one shekel at Samaria’s city gate.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew unit is a seah, a dry measure.
    reason: cultural_note
  - marker: b
    text: A shekel was an ancient unit used to set a price; here it states how much the grain would cost.
    reason: cultural_note
