translation:
  language: en
  text: Then the people went out and looted the Aramean camp. One measure of fine flour sold for a shekel, and twice as much barley sold for the same price,[a] just as Yahweh had said.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew names a seah, an ancient dry measure, and a shekel, an ancient unit of weight used for payment.
    reason: cultural_note
