- pob_phrase: plundered the camp of Aram
  simplified_phrase: looted the Aramean camp
  preserved_meaning: The people took goods from the enemy camp.
  reasoning_layer_used: Lexical decisions for וַיָּבֹזּוּ and מַחֲנֵה אֲרָם
  rationale: The approved alternatives make the military action and camp identity easier to read.
- pob_phrase: a seah of fine flour was sold for a shekel, and two seahs of barley for a shekel
  simplified_phrase: One measure of fine flour sold for a shekel, and twice as much barley sold for the same price
  preserved_meaning: The exact one-to-two quantity ratio and equal price remain clear.
  reasoning_layer_used: Lexical decisions for סְאָה, וְסָאתַיִם, and בְּשֶׁקֶל
  rationale: Common wording replaces the unfamiliar measure while the footnote preserves the ancient terms.
- pob_phrase: according to the word of Yahweh
  simplified_phrase: just as Yahweh had said
  preserved_meaning: The prices fulfilled Yahweh's earlier prophetic word.
  reasoning_layer_used: Lexical rationale for כִּדְבַר יְהוָה and theological decision for יְהוָה
  rationale: The simpler clause states the documented fulfillment sense and retains the divine name.
