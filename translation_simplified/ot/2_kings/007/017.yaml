  reasoning_layer_used: Lexical decisions for הִפְקִיד, הַשָּׁלִישׁ, and the retained hand image
  rationale: The rewrite uses ordinary wording while preserving the officer's close royal role and the Hebrew image.
- pob_phrase: to be in charge of the gate
