translation:
  language: en
  text: The king had put his personal officer—the man whose hand he leaned on[a]—in charge of the city gate. But the people trampled the officer there, and he died. This happened just as the man of God had said when the king came down to him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This Hebrew expression describes a close royal attendant who supported the king.
    reason: cultural_note
