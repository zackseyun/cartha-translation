  - what the Arameans have done to us
- pob_phrase: When they come out from the city
  rendering: When the people come out of the city
  claim: The expected people leaving the city are its hungry inhabitants.
  evidence:
  - The king says the Arameans know that “we” are hungry.
  - The planned capture depends on people leaving the besieged city.
  confidence: high
  alternatives_preserved:
  - When they come out of the city
