translation:
  language: en
  text: Then the king got up during the night and said to his servants, “Let me tell you what the army of Aram has done to us. They know we are hungry, so they have left their camp and hidden in the fields. Their plan is, ‘When the people come out of the city, we will capture them alive and then enter the city.’”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: arose in the night
  simplified_phrase: got up during the night
  preserved_meaning: The king rose from his rest at night.
  reasoning_layer_used: lexical decision for וַיָּקָם and לַיְלָה
  rationale: This uses ordinary modern wording while keeping the concrete action and nighttime setting.
- pob_phrase: they have gone out from the camp to hide themselves in the field
  simplified_phrase: they have left their camp and hidden in the fields
  preserved_meaning: The Arameans left their military camp and concealed themselves outside the city.
  reasoning_layer_used: lexical decisions for camp, hiding, and field
  rationale: The shorter sentence preserves both their departure and concealment.
- pob_phrase: saying, ‘When they come out from the city, we will seize them alive and enter the city’
  simplified_phrase: Their plan is, ‘When the people come out of the city, we will capture them alive and then enter the city’
  preserved_meaning: The king describes an expected ambush followed by entry into the city.
  reasoning_layer_used: lexical decisions for לֵאמֹר, capture alive, and enter
  rationale: Stating that this is their plan makes the quoted strategy easier to follow without presenting it as fact.
interpretive_expansions:
- pob_phrase: what Aram has done to us
  rendering: what the army of Aram has done to us
  claim: Aram refers here to the Aramean military force surrounding the city.
  evidence:
