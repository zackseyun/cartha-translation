translation:
  language: en
  text: They came to the city and called out to its gatekeepers. They reported, “We went to the camp of Aram. No one was there, and there was no human sound.[a] Only the horses and donkeys were tied up, and the tents were left as they were.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “no human voice.” The Hebrew can mean either a voice or human sound more broadly.
    reason: lexical_alternative
