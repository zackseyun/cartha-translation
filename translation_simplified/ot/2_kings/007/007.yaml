translation:
  language: en
  text: They got up and fled at twilight.[a] They left their tents, horses, and donkeys behind, with the camp just as it was, and fled for their lives.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word refers to twilight and does not specify whether it was near dawn or dusk.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: So they arose and fled at twilight
  simplified_phrase: They got up and fled at twilight
  preserved_meaning: They began their urgent escape during twilight.
  reasoning_layer_used: The lexical decision for וַיָּקוּמוּ allows “got up,” while נוּס retains the force of flight.
  rationale: “Got up” is clearer modern English than “arose.”
- pob_phrase: they left their tents, their horses, their donkeys
  simplified_phrase: They left their tents, horses, and donkeys behind
  preserved_meaning: They abandoned the camp’s shelters and animals in their haste.
  reasoning_layer_used: The lexical rationale for עזב notes that the military flight context implies abandonment.
  rationale: “Left behind” makes the hurried abandonment immediately clear.
- pob_phrase: the camp as it was—and fled for their lives
  simplified_phrase: with the camp just as it was, and fled for their lives
  preserved_meaning: They did not stop to alter or clear the camp before escaping to save themselves.
  reasoning_layer_used: The phrase rationale preserves the camp’s existing condition, and the idiom rationale supports “fled for their lives.”
  rationale: The revised clause order is easier to follow while preserving the repeated “fled.”
