translation:
  language: en
  text: “If we say, ‘Let’s go into the city,’ we will die there because of the famine. If we stay here, we will die too. So come, let’s go to the camp of Aram[b] and surrender.[a] If they let us live, we will live; and if they put us to death, we will die.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew idiom literally says “fall into” and here means to go over or surrender to another force.
    reason: lexical_alternative
  - marker: b
    text: Aram is the Hebrew name often rendered “Syria” or “the Arameans.”
    reason: cultural_note
