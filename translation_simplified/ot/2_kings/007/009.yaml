translation:
  language: en
  text: Then they said to each other, “What we are doing is wrong. Today is a day of good news, but we are saying nothing. If we wait until daybreak, guilt will catch up with us.[a] Come, let us go now and tell the king’s household.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “punishment will find us” or “we will become guilty.” The Hebrew literally says, “guilt or wrongdoing will find us.”
    reason: lexical_alternative
  - marker: b
    text: The king’s household may also mean the royal palace or its officials.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: What we are doing is not right
  simplified_phrase: What we are doing is wrong
  preserved_meaning: They recognize that their deliberate silence is morally wrong.
  reasoning_layer_used: POB lexical decision for לֹא כֵן אֲנַחְנוּ עֹשִׂים
  rationale: The direct word “wrong” makes the same moral judgment more immediate.
- pob_phrase: This day is a day of good news, and we are keeping silent
  simplified_phrase: Today is a day of good news, but we are saying nothing
  preserved_meaning: They are deliberately withholding good news that should be shared.
  reasoning_layer_used: POB lexical decisions for יוֹם בְּשֹׂרָה and מַחְשִׁים
  rationale: The contrast word “but” clarifies why their silence is wrong.
- pob_phrase: If we wait until the light of morning, guilt will overtake us
  simplified_phrase: If we wait until daybreak, guilt will catch up with us
  preserved_meaning: Further delay will make them liable for wrongdoing while retaining the image of guilt pursuing them.
  reasoning_layer_used: POB lexical decisions and doctrine realignment for וְחִכִּינוּ עַד אוֹר הַבֹּקֶר and וּמְצָאנוּ עָוֹן
  rationale: “Daybreak” and “catch up with us” preserve both images in familiar English.
