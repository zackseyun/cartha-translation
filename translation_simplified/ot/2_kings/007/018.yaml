translation:
  language: en
  text: What the man of God had told the king came true. He had said, “About this time tomorrow, at the market in Samaria’s city gate, two measures of barley[a] will sell for one shekel, and one measure of fine flour will sell for one shekel[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “two seahs”; a seah was an ancient dry measure.
    reason: cultural_note
  - marker: b
    text: A shekel was an ancient unit of weight used as money.
    reason: cultural_note
