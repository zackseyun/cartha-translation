  preserved_meaning: Hezekiah is causing the people to trust through his words.
  reasoning_layer_used: POB lexical decision for the causative form of בטח
  rationale: “Persuade” states the causative sense naturally without suggesting physical compulsion.
- pob_phrase: Yahweh will surely deliver us
  simplified_phrase: Yahweh will surely rescue us
  preserved_meaning: Hezekiah emphatically promises that Yahweh will save them from military danger.
  reasoning_layer_used: POB lexical decision for the emphatic form הַצֵּל יַצִּילֵנוּ
  rationale: “Rescue” is more immediately clear while “surely” keeps the Hebrew emphasis.
- pob_phrase: will not be given into the hand of the king of Assyria
  simplified_phrase: will not fall into the hands of the king of Assyria
  preserved_meaning: The city will not come under the Assyrian king’s control.
