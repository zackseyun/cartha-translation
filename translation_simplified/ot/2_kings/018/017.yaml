translation:
  language: en
  text: Then the king of Assyria sent the Tartan, the Rab-saris, and the Rab-shakeh[a] from Lachish to King Hezekiah in Jerusalem with a great army. They marched up to Jerusalem. When they arrived, they took their stand beside the water channel of the upper pool, on the road by the field where cloth was washed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: These were probably Assyrian official titles, not personal names; their exact duties are uncertain.
    reason: cultural_note
simplification_decisions:
- pob_phrase: They went up and came to Jerusalem; they went up and came and stood
  simplified_phrase: They marched up to Jerusalem. When they arrived, they took their stand
  preserved_meaning: The army ascended to Jerusalem, arrived, and deliberately positioned itself there.
  reasoning_layer_used: POB lexical decisions on the repeated movement verbs
  rationale: Two natural sentences retain the movement, arrival, and taking of position.
- pob_phrase: the conduit of the upper pool
  simplified_phrase: the water channel of the upper pool
  preserved_meaning: They stood beside the watercourse associated with the upper pool.
  reasoning_layer_used: POB lexical decisions for conduit and upper pool
  rationale: Water channel explains conduit without specifying the channel’s direction or origin.
- pob_phrase: the highway of the washer’s field
  simplified_phrase: the road by the field where cloth was washed
  preserved_meaning: The site was on the road beside the cloth washers’ work area.
  reasoning_layer_used: POB lexical decisions for highway and washer’s field
  rationale: The place description is stated directly for readers unfamiliar with the occupation.
