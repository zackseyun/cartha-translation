translation:
  language: en
  text: Then the Rabshakeh[a] said to them, “Did my master send me to deliver this message just to your master and you? Did he not also send me to the men sitting on the wall? They will have to eat their own dung and drink their own urine[b] along with you.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Rabshakeh was a high Assyrian official and spokesman.
    reason: cultural_note
  - marker: b
    text: The Hebrew uses coarse siege language; some manuscripts and traditions use the euphemism “the water of their feet.”
    reason: lexical_alternative
