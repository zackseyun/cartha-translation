translation:
  language: en
  text: Then King Hezekiah of Judah sent this message to the king of Assyria, who was at Lachish:[a] “I have sinned. Pull back from me. Whatever burden you place on me, I will bear.” The king of Assyria then required Hezekiah to give him three hundred large units of silver by weight and thirty of gold.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean that Hezekiah sent the message to Lachish.
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew measure is talents: three hundred talents of silver and thirty talents of gold.'
    reason: cultural_note
