translation:
  language: en
  text: But if you say to me, ‘We trust in the LORD our God,’ didn’t Hezekiah remove the LORD’s local places of worship[a] and altars? Didn’t he tell the people of Judah and Jerusalem, ‘You must worship at this altar in Jerusalem’?”
  philosophy: optimal-equivalence
