translation:
  language: en
  text: He removed the local worship sites called high places, smashed the sacred stone pillars, and cut down the Asherah.[a] He also crushed the bronze serpent that Moses had made, because until that time the sons of Israel had been burning incense to the serpent. It was called Nehushtan.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Asherah was a worship object and may also be called an Asherah pole or sacred pole.
    reason: lexical_alternative
  - marker: b
    text: Nehushtan probably plays on the Hebrew word for bronze and may mean “a mere piece of bronze.”
    reason: cultural_note
  - marker: c
    text: The Hebrew may instead mean “he called it Nehushtan,” with Hezekiah as the unnamed subject.
    reason: alternative_reading
