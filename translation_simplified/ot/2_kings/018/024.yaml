translation:
  language: en
  text: How, then, can you drive back even one captain[a] from among my master’s lowest-ranking servants, while you rely on Egypt for chariots and horsemen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew title may also mean “governor” or “official.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: turn back the face of
  simplified_phrase: drive back
  preserved_meaning: The Hebrew image describes repelling or resisting an opponent.
  reasoning_layer_used: POB lexical decisions for תָּשִׁיב and אֵת פְּנֵי
  rationale: “Drive back” is natural English while retaining the military image of forcing an opponent back.
- pob_phrase: a single captain among the least of my master's servants
  simplified_phrase: even one captain from among my master’s lowest-ranking servants
  preserved_meaning: Judah is mocked as unable to withstand even one inferior Assyrian officer.
  reasoning_layer_used: POB lexical decisions for אַחַד, פַחַת, and הַקְּטַנִּים
  rationale: The new wording makes the officer’s low rank and the taunt’s force immediately clear.
- pob_phrase: when you trust in Egypt
  simplified_phrase: while you rely on Egypt
  preserved_meaning: Judah depends on Egypt to supply military resources.
  reasoning_layer_used: POB lexical decision for וַתִּבְטַח לְךָ עַל מִצְרַיִם
  rationale: “Rely on” plainly expresses practical military dependence in this context.
