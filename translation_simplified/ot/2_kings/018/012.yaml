translation:
  language: en
  text: This happened because they did not listen to the voice of Yahweh their God.[a] They broke his covenant and failed to keep everything Moses, Yahweh’s servant, had commanded. They refused to listen to Yahweh or to do what Moses had commanded.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here, “listen to the voice” includes obeying what Yahweh said.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: because they did not listen to the voice of Yahweh their God
  simplified_phrase: This happened because they did not listen to the voice of Yahweh their God
  preserved_meaning: Their exile resulted from refusing Yahweh’s voice.
  reasoning_layer_used: Immediate context and lexical decision for עַל אֲשֶׁר
  rationale: “This happened” clearly connects the reason to the preceding exile account.
- pob_phrase: transgressed his covenant, all that Moses the servant of Yahweh commanded
  simplified_phrase: broke his covenant and failed to keep everything Moses, Yahweh’s servant, had commanded
  preserved_meaning: They violated the covenant and did not carry out the full body of Moses’ commands.
  reasoning_layer_used: Lexical decisions for וַיַּעַבְרוּ, בְּרִיתוֹ, and אֵת כָּל אֲשֶׁר צִוָּה
  rationale: Common wording and coordination preserve the two closely joined ideas without merging them.
- pob_phrase: they neither listened nor did it
  simplified_phrase: They refused to listen to Yahweh or to do what Moses had commanded
  preserved_meaning: Their persistent refusal involved both listening and action.
  reasoning_layer_used: Lexical decisions for וְלֹא שָׁמְעוּ and וְלֹא עָשׂוּ
  rationale: The explicit referents remove ambiguity while retaining the repeated refusal.
interpretive_expansions:
- pob_phrase: because
  rendering: This happened because
  claim: The stated reason refers to the exile in the preceding verse.
  evidence:
  - The immediate context describes Israel being carried into exile.
  - The POB rationale identifies this phrase as the reason for that exile.
  confidence: high
  alternatives_preserved:
  - because
- pob_phrase: they neither listened nor did it
  rendering: They refused to listen to Yahweh or to do what Moses had commanded
  claim: Yahweh is the one they refused to hear, and Moses’ commands are what they refused to carry out.
  evidence:
  - The opening clause names Yahweh’s voice.
  - The preceding clause identifies what Moses commanded.
  confidence: high
  alternatives_preserved:
  - They refused to listen or do it.
translation_notes:
  risk_flags:
  - risk: “Failed to keep” could imply passive failure rather than rebellion.
    mitigation: The final sentence explicitly preserves their persistent refusal.
  - risk: “Listen” could be understood as mere hearing.
    mitigation: The footnote explains that the idiom includes obedience.
