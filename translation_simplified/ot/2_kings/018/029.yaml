translation:
  language: en
  text: 'This is what the king says: “Do not let Hezekiah deceive you, because he will not be able to rescue you from his hand.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “From his hand” means “from the king’s power.” The parallel in Isaiah 36:14 reads “from my hand.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: Thus says the king
  simplified_phrase: This is what the king says
  preserved_meaning: It introduces an official declaration from the king.
  reasoning_layer_used: POB lexical decisions for כֹּה and אָמַר
  rationale: The common formula is clearer while retaining the royal proclamation.
- pob_phrase: for he will not be able
  simplified_phrase: because he will not be able
  preserved_meaning: Hezekiah’s inability is the stated reason not to believe him.
  reasoning_layer_used: POB lexical decisions for כִּי and לֹא יוּכַל
  rationale: “Because” makes the causal connection explicit in common English.
- pob_phrase: deliver you
  simplified_phrase: rescue you
  preserved_meaning: Hezekiah is said to be unable to save the people from danger.
  reasoning_layer_used: POB lexical decision for לְהַצִּיל
  rationale: “Rescue” is more immediate in common English and fits the military danger.
translation_notes:
  risk_flags:
