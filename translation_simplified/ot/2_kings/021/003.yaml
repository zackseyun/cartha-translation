translation:
  language: en
  text: He rebuilt the high places—the worship sites that his father Hezekiah had destroyed. He set up altars to Baal and made an Asherah[a], as King Ahab of Israel had done. He bowed down before all the stars and other heavenly bodies and served them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: An Asherah was an object used in the worship of the Canaanite goddess Asherah.
    reason: cultural_note
