- pob_phrase: all the host of heaven
  simplified_phrase: the whole heavenly host
  preserved_meaning: The wording keeps the biblical image of the celestial host without limiting it only to stars.
  reasoning_layer_used: POB lexical decision and footnote
  rationale: This smoother phrase preserves the documented range of heavenly bodies or powers.
- pob_phrase: in the two courts
  simplified_phrase: in both courtyards
  preserved_meaning: There were two distinct temple courts, and the altars were built in each one.
  reasoning_layer_used: POB lexical decision
  rationale: “Both courtyards” makes the count and location immediately clear.
- pob_phrase: the house of Yahweh
  simplified_phrase: Yahweh’s temple
  preserved_meaning: The house of Yahweh refers to the temple belonging to Yahweh.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Temple” gives the intended location plainly while retaining the divine name Yahweh.
