translation:
  language: en
  text: I will stretch over Jerusalem the measuring line I used to judge Samaria and the plumb line I used to judge Ahab’s royal house. I will wipe Jerusalem away just as someone wipes a dish and then turns it upside down.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the measuring line of Samaria and the plumb line of the house of Ahab
  simplified_phrase: the measuring line I used to judge Samaria and the plumb line I used to judge Ahab’s royal house
  preserved_meaning: Jerusalem will face the same standard of judgment as Samaria and Ahab’s dynasty.
  reasoning_layer_used: theological decision and lexical rationale
  rationale: The rewrite explains the judgment metaphor while retaining both measuring tools.
- pob_phrase: the house of Ahab
  simplified_phrase: Ahab’s royal house
  preserved_meaning: The phrase refers to Ahab’s ruling dynasty rather than a building.
  reasoning_layer_used: lexical decision
  rationale: Adding “royal” prevents a likely modern misunderstanding of “house.”
- pob_phrase: as one wipes a dish, wiping it and turning it upside down
  simplified_phrase: just as someone wipes a dish and then turns it upside down
  preserved_meaning: The image portrays emphatic wiping followed by overturning.
  reasoning_layer_used: lexical rationale
  rationale: Ordinary clause order keeps the full dish image without adding a cleansing nuance.
