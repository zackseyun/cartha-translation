translation:
  language: en
  text: He abandoned Yahweh, the God of his fathers.[a] He did not live according to Yahweh’s way.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Fathers” here refers to his male ancestors.
