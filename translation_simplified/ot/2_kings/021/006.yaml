translation:
  language: en
  text: He made his son pass through the fire.[a] He used occult practices to predict the future, interpreted omens, and became involved with mediums and spiritists. He did more and more of what was evil in Yahweh’s eyes, provoking Yahweh to anger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This Hebrew expression likely refers to sacrificing his son in the fire, but it does not specify the exact ritual action.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: practiced soothsaying and divination
  simplified_phrase: used occult practices to predict the future, interpreted omens
  preserved_meaning: 'The two distinct forbidden practices remain: occult prediction and reading omens.'
  reasoning_layer_used: POB lexical decisions for וְעוֹנֵן and וְנִחֵשׁ
  rationale: The wording explains unfamiliar terms without merging the two practices.
- pob_phrase: dealt with mediums and spiritists
  simplified_phrase: became involved with mediums and spiritists
  preserved_meaning: The wording keeps the Hebrew idiom broad rather than limiting it to consultation or appointment.
  reasoning_layer_used: POB lexical decision for וְעָשָׂה אוֹב וְיִדְּעֹנִים
  rationale: “Became involved with” states the broad relationship in natural English.
- pob_phrase: He multiplied doing what was evil
  simplified_phrase: He did more and more of what was evil
  preserved_meaning: His evil conduct increased rather than merely occurring often.
  reasoning_layer_used: POB lexical decision and doctrine realignment for הִרְבָּה לַעֲשׂוֹת
  rationale: “More and more” preserves the intensification in immediately understandable English.
interpretive_expansions:
- pob_phrase: practiced soothsaying and divination
  rendering: used occult practices to predict the future, interpreted omens
  claim: The practices sought hidden knowledge of the future through occult means and signs.
  evidence:
