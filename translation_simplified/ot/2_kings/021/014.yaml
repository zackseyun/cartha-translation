- pob_phrase: they will become plunder and spoil for all their enemies
  simplified_phrase: All their enemies will plunder them and take them as spoil
  preserved_meaning: Every enemy will be able to pillage them and treat them as captured spoil.
  reasoning_layer_used: lexical decisions and rhetorical doubling
  rationale: The active wording is easier to follow while preserving both plundering and spoil.
