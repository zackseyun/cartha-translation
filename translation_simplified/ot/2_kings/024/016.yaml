simplification_decisions:
- pob_phrase: all the men of valor, seven thousand
  simplified_phrase: all 7,000 fighting men
  preserved_meaning: The group consisted of militarily capable men, and its number remains explicit.
  reasoning_layer_used: Lexical decisions for אַנְשֵׁי הַחַיִל and שִׁבְעַת אֲלָפִים.
  rationale: “Fighting men” states the military sense more directly than “men of valor.”
- pob_phrase: all of them mighty men fit for war
  simplified_phrase: All of them were capable men fit for military service.
  preserved_meaning: Every man in these groups was capable of serving in war.
  reasoning_layer_used: Lexical decisions for הַכֹּל, גִּבּוֹרִים, and עֹשֵׂי מִלְחָמָה.
  rationale: “Capable men” preserves martial ability without reducing it to physical strength.
- pob_phrase: brought into exile to Babylon
  simplified_phrase: took ... to Babylon as exiles
  preserved_meaning: The king deported the men to Babylon.
  reasoning_layer_used: Lexical decisions for וַיְבִיאֵם, גּוֹלָה, and בָּבֶלָה.
  rationale: The reordered clause gives the action, destination, and exile status in natural English.
