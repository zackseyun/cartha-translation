  text: The king of Egypt no longer went out from his land, because the king of Babylon had taken everything that belonged to the king of Egypt, from the Brook of Egypt[a] to the Euphrates River.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Wadi of Egypt.” The Hebrew word can refer to a seasonal watercourse or brook; it does not mean the Nile here.
