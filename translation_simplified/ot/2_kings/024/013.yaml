translation:
  language: en
  text: He took away from there all the treasures in the house of Yahweh[a] and in the royal palace. He also cut into pieces all the gold objects that King Solomon of Israel had made in Yahweh’s temple. He did all this just as Yahweh had said.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “house of Yahweh” is the temple; a different Hebrew word later refers more specifically to the temple building or sanctuary.
    reason: lexical_alternative
