translation:
  language: en
  text: He deported the people of Jerusalem—all the officials, skilled warriors, craftsmen, and metalworkers[a]—ten thousand captives in all. No one was left except the poorest people of the land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term may refer to smiths or, more broadly, to skilled metalworkers.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: carried away all Jerusalem
  simplified_phrase: deported the people of Jerusalem
  preserved_meaning: The king forcibly removed Jerusalem’s inhabitants into exile, not the physical city.
  reasoning_layer_used: POB lexical decisions for וְהִגְלָה and כָּל יְרוּשָׁלִַם
  rationale: “Deported” makes the forced exile clear, and “the people” explains the metonymy.
- pob_phrase: the mighty men of valor
  simplified_phrase: skilled warriors
  preserved_meaning: These were capable and valiant fighting men.
  reasoning_layer_used: POB lexical decision for גִּבּוֹרֵי הַחַיִל
  rationale: The clearer phrase preserves both their military role and their ability.
- pob_phrase: ten thousand captives, and all the craftsmen and the smiths
  simplified_phrase: craftsmen, and metalworkers—ten thousand captives in all
  preserved_meaning: The ten thousand is the total deported population, including all the listed groups.
  reasoning_layer_used: POB syntax, lexical decisions, and independent grounding review
  rationale: Keeping the groups together and adding “in all” prevents the workers from sounding additional to the total.
