translation:
  language: en
  text: He took Jehoiachin away to Babylon. He also took the king’s mother, the king’s wives, his court officials,[a] and the leading men of the land.[b] He took them all from Jerusalem into exile in Babylon.
  philosophy: optimal-equivalence
  footnotes:
