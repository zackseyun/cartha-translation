translation:
  language: en
  text: At that time, men serving King Nebuchadnezzar of Babylon advanced against Jerusalem, and the city came under siege.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the servants of Nebuchadnezzar king of Babylon
  simplified_phrase: men serving King Nebuchadnezzar of Babylon
  preserved_meaning: They were agents under Nebuchadnezzar’s authority without being identified more narrowly as soldiers or officials.
  reasoning_layer_used: POB lexical decision for עַבְדֵי
  rationale: This wording avoids the modern impression of household servants while preserving the Hebrew term’s breadth.
- pob_phrase: came up against Jerusalem
  simplified_phrase: advanced against Jerusalem
  preserved_meaning: They moved toward Jerusalem with hostile military intent.
  reasoning_layer_used: POB lexical decision for עָלָה and immediate military context
  rationale: “Advanced against” clearly conveys the hostile movement without requiring readers to understand the Hebrew “went up” idiom.
translation_notes:
  risk_flags:
