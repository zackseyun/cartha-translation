translation:
  language: en
  text: 'Jehu found the brothers of Ahaziah, king of Judah.[a] He asked them, “Who are you?”


    They answered, “We are Ahaziah’s brothers. We came down to see whether the king’s sons and the queen mother’s sons are well.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Brothers” may include close relatives or other kinsmen, not only literal brothers.
    reason: lexical_alternative
  - marker: b
    text: “Queen mother” was an official royal title for the king’s mother.
    reason: cultural_note
