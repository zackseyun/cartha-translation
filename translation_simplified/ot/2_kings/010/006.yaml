  language: en
  text: So he wrote them a second letter. It said, “If you are on my side and will listen to my voice by doing what I say, cut off the heads of your master’s sons. Bring their heads to me at Jezreel at this time tomorrow.” The king’s seventy sons were staying with the city’s leading men, who were raising them.
