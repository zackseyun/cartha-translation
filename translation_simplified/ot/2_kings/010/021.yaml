  reasoning_layer_used: Lexical decisions for עֹבְדֵי הַבַּעַל and the total-attendance clause.
  rationale: The two short clauses preserve the whole group and stress that no worshiper failed to come.
- pob_phrase: the house of Baal was filled from end to end
