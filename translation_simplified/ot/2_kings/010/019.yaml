translation:
  language: en
  text: “Call together before me all the prophets of Baal, all his worshipers, and all his priests. Make sure not one man is missing,[a] because I have a great sacrifice to offer to Baal. Any man who is missing will die.” But Jehu did this by deception in order to destroy the worshipers of Baal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Make sure no one is missing.” The Hebrew uses a singular masculine term generically.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Summon to me
  simplified_phrase: Call together before me
  preserved_meaning: Jehu orders the group to be gathered into his presence.
  reasoning_layer_used: Lexical decision for קִרְאוּ אֵלַי
  rationale: The simpler wording keeps the command’s administrative force and direction toward Jehu.
- pob_phrase: let no man be missing
  simplified_phrase: Make sure not one man is missing
  preserved_meaning: Every individual is required to attend, while the source’s masculine form remains visible.
  reasoning_layer_used: Lexical and theological decisions for אִישׁ אַל יִפָּקֵד
  rationale: The direct command is easier to understand without replacing “man” with a neutral term.
- pob_phrase: Whoever is missing shall not live
  simplified_phrase: Any man who is missing will die
  preserved_meaning: Jehu threatens death for anyone who fails to attend.
  reasoning_layer_used: Lexical decision for כֹּל אֲשֶׁר יִפָּקֵד לֹא יִחְיֶה
  rationale: The natural modern expression preserves the threat’s stark force.
