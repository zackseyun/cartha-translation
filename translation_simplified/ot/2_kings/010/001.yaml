  simplified_phrase: Ahab had seventy sons living in Samaria
  preserved_meaning: Ahab’s seventy male descendants were located in Samaria.
  reasoning_layer_used: lexical decisions for שִׁבְעִים בָּנִים and בְּשֹׁמְרוֹן
  rationale: “Living in” makes the location relationship immediately clear without changing it.
- pob_phrase: wrote letters and sent them to Samaria, to the rulers of Jezreel
  simplified_phrase: wrote letters and sent them there. The letters were for the officials of Jezreel
  preserved_meaning: Jehu sent written messages to Samaria for the named Jezreel officials.
  reasoning_layer_used: lexical decisions for סְפָרִים, שֹׁמְרוֹן, and שָׂרֵי יִזְרְעֶאל
  rationale: Two short sentences clarify the destination and recipients while retaining the difficult Hebrew wording.
- pob_phrase: the elders, and the guardians of Ahab’s sons, saying
  simplified_phrase: 'the community elders, and those responsible for raising Ahab’s sons. He wrote:'
  preserved_meaning: The recipients included civic elders and people entrusted with Ahab’s sons, followed by the letter’s contents.
  reasoning_layer_used: lexical decisions for הַזְּקֵנִים, הָאֹמְנִים, and לֵאמֹר
  rationale: The wording explains both roles and uses a direct introduction to the message.
