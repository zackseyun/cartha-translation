translation:
  language: en
  text: 'Ahab had seventy sons living in Samaria. Jehu wrote letters and sent them there. The letters were for the officials of Jezreel,[a] the community elders, and those responsible for raising Ahab’s sons.[b] He wrote:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “officials of Jezreel,” though some ancient versions read “officials of Samaria.”
    reason: textual_variant
  - marker: b
    text: The Hebrew may also be translated “guardians,” “foster fathers,” or “caretakers.”
    reason: lexical_alternative
