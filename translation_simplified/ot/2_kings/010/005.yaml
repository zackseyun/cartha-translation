translation:
  language: en
  text: 'Then the official in charge of the palace, the official in charge of the city, the elders, and the guardians of the royal sons sent this message to Jehu: “We are your servants. We will do whatever you tell us. We will not make anyone king. Do whatever you think is best.”'
  philosophy: optimal-equivalence
