translation:
  language: en
  text: When they received the letter, they took the king’s sons—all seventy men—and slaughtered them. They put their heads in baskets[a] and sent them to him in Jezreel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word refers to containers; they may have been baskets, pots, or jars.
    reason: lexical_alternative
