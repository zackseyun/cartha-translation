  text: He continued on from there and found Jehonadab son of Rechab coming to meet him. Jehu greeted him[a] and asked, “Is your heart truly loyal to me, as mine is to you?” Jehonadab answered, “Yes, it is!” Jehu said, “Give me your hand.” Jehonadab gave him his hand, and Jehu brought him up into his own chariot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “blessed him”; here the Hebrew verb most likely refers to a greeting.
    reason: lexical_alternative
