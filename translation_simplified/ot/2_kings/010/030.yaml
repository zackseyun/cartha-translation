translation:
  language: en
  text: Yahweh said to Jehu, “You have done well by doing what is right in my eyes. You dealt with Ahab’s family exactly as I had determined in my heart. Because of this, your descendants through the fourth generation will sit on Israel’s throne.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And Yahweh said to Jehu
  simplified_phrase: Yahweh said to Jehu
  preserved_meaning: Yahweh directly addresses Jehu.
  reasoning_layer_used: POB translation and divine-name lexical decision
  rationale: Removing the opening conjunction gives natural English without changing the event.
- pob_phrase: have done to the house of Ahab according to all that was in my heart
  simplified_phrase: dealt with Ahab’s family exactly as I had determined in my heart
  preserved_meaning: Jehu carried out Yahweh’s intended judgment concerning Ahab’s dynasty.
  reasoning_layer_used: Lexical decisions for house of Ahab and heart, bounded by the theological decision
  rationale: “Family” clarifies the dynastic house, while “heart” retains the Hebrew image of inner purpose.
- pob_phrase: your sons to the fourth generation shall sit on the throne of Israel
  simplified_phrase: your descendants through the fourth generation will sit on Israel’s throne
  preserved_meaning: Jehu is promised a four-generation dynasty ruling Israel.
  reasoning_layer_used: Lexical decisions for the generation idiom and throne image
  rationale: “Descendants” makes the succession clear while preserving the royal throne image.
interpretive_expansions:
- pob_phrase: all that was in my heart
  rendering: exactly as I had determined in my heart
  claim: The heart here refers to Yahweh’s settled intention rather than emotion alone.
  evidence:
  - The POB lexical rationale identifies heart as will, intention, or inner purpose.
  - The immediate context concerns Jehu carrying out Yahweh’s judgment.
  confidence: high
  alternatives_preserved:
  - everything I had in my heart
  - everything I intended
translation_notes:
  risk_flags:
  - risk: The commendation could be mistaken for approval of Jehu’s entire reign.
    mitigation: The wording limits Yahweh’s approval to Jehu’s treatment of Ahab’s family.
  - risk: “Descendants” is broader than the Hebrew’s literal “sons.”
    mitigation: “Through the fourth generation” preserves the promised dynastic scope.
