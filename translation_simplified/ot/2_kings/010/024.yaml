translation:
  language: en
  text: Then they went inside to offer sacrifices and burnt offerings. Jehu had posted eighty men outside. He told them, “If any of you lets one of the men I am handing over to you escape, your life will be taken in place of his.”
  philosophy: optimal-equivalence
