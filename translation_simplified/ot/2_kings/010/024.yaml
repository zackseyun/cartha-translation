  simplified_phrase: had posted eighty men outside
  preserved_meaning: Jehu arranged for eighty men to guard the outside area.
  reasoning_layer_used: The lexical decision treats the verb as posting men in a security role.
  rationale: The shorter wording gives the same action in natural English.
- pob_phrase: The man who lets any of the men
  simplified_phrase: If any of you lets one of the men
  preserved_meaning: Each guard is personally responsible for preventing an escape.
  reasoning_layer_used: The lexical decision makes the guards’ implied responsibility explicit.
  rationale: Direct address makes Jehu’s warning easier to follow.
- pob_phrase: his life for that man’s life
  simplified_phrase: your life will be taken in place of his
  preserved_meaning: A guard who allows an escape will forfeit his life for the escapee’s life.
  reasoning_layer_used: The lexical rationale identifies a life-for-life penalty formula.
  rationale: The full clause clarifies the penalty while preserving substitution in the image.
