translation:
  language: en
  text: 'He said to him, “This is what Yahweh says: You sent messengers to consult Baal-zebub, the god of Ekron. Did you do this because there is no God in Israel whose message you could seek? Therefore, you will not get down from the bed you got onto. You will certainly die.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Thus says Yahweh
  simplified_phrase: This is what Yahweh says
  preserved_meaning: The standard prophetic formula introduces Yahweh’s own message.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The common English formula keeps the divine name and prophetic authority.
- pob_phrase: to inquire of Baal-zebub
  simplified_phrase: to consult Baal-zebub
  preserved_meaning: The king sought supernatural guidance from Ekron’s god.
  reasoning_layer_used: POB lexical decision for לִדְרֹשׁ
  rationale: “Consult” clearly conveys seeking an oracle in ordinary English.
- pob_phrase: the bed on which you have gone up, you will not come down from it
  simplified_phrase: you will not get down from the bed you got onto
  preserved_meaning: The judgment retains the paired images of upward and downward movement.
  reasoning_layer_used: POB lexical decisions and doctrine-realignment revision
  rationale: “Got onto” preserves the image without specifying that the king climbed.
interpretive_expansions:
- pob_phrase: to inquire of his word
  rendering: whose message you could seek
  claim: The king could have sought a divine message from Israel’s God.
  evidence:
  - The POB lexical rationale says “his word” likely refers to an oracle or message from God.
  - The question contrasts consulting Baal-zebub with seeking God’s word.
  confidence: high
  alternatives_preserved:
  - to seek his counsel
  - to inquire of his word
translation_notes:
  risk_flags:
  - risk: “Got onto” may sound less elevated than the prophetic context.
    mitigation: It naturally preserves the required upward image without adding a specific manner of ascent.
