  simplified_phrase: replied to
  preserved_meaning: Elijah directly answers the captain.
  reasoning_layer_used: POB base text and source clause structure
  rationale: The natural verb “replied” carries the full force of the Hebrew-style double expression.
- pob_phrase: the captain of fifty
  simplified_phrase: the captain in command of fifty men
  preserved_meaning: The officer commands a group of fifty men.
  reasoning_layer_used: POB base text and immediate context
  rationale: The revised wording makes the military command relationship clear to modern readers.
- pob_phrase: consume you and your fifty
  simplified_phrase: burn up you and your fifty men
  preserved_meaning: Fire destroys both the captain and all fifty men under him.
  reasoning_layer_used: POB base text and repeated fire image
  rationale: “Burn up” clearly expresses what the fire does while preserving the image’s force.
