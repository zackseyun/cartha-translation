translation:
  language: en
  text: Elijah replied to the captain in command of fifty men, “But if I am a man of God, let fire come down from heaven and burn up you and your fifty men.” Then fire came down from heaven and burned up the captain and his fifty men.
  philosophy: optimal-equivalence
