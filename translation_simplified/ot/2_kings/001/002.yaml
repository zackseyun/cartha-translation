  preserved_meaning: Ahaziah commissioned human messengers to carry out his instruction.
  reasoning_layer_used: POB lexical decision for מַלְאָכִים and narrative context
  rationale: The rewrite removes a repetitive speech formula without losing who was sent or why.
- pob_phrase: inquire of Baal-zebub ... whether I will recover
