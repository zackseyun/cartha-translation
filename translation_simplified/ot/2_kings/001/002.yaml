  preserved_meaning: Ahaziah fell through a lattice in an upper-level room located in Samaria.
  reasoning_layer_used: POB lexical decisions for בְּעַד הַשְּׂבָכָה and עֲלִיָּתוֹ
  rationale: The wording keeps the concrete lattice image while making the location easy to picture.
- pob_phrase: So he sent messengers and said to them
