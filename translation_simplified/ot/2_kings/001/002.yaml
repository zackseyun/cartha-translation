translation:
  language: en
  text: 'Ahaziah fell through a latticed opening in his upstairs room in Samaria and was injured. He sent messengers with this command: “Go consult Baal-zebub,[a] the god of Ekron, to find out whether I will recover from this illness.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baal-zebub is the Hebrew form of the name; the later form Beelzebub appears in Greek and in some English traditions.
    reason: alternative_reading
