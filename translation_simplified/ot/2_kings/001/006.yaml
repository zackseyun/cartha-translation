translation:
  language: en
  text: 'They said to him, “A man came up to meet us and told us, ‘Go. Return to the king who sent you and tell him, “This is what Yahweh says: Is it because there is no God in Israel that you are sending messengers to consult Baal-zebub, the god of Ekron? Therefore, you will not come down from the bed you got into. You will surely die.”’”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Go, return to the king who sent you, and speak to him
  simplified_phrase: Go. Return to the king who sent you and tell him
  preserved_meaning: Both commands remain distinct, followed by the order to deliver Yahweh’s message.
  reasoning_layer_used: POB lexical decisions for לְכוּ שׁוּבוּ and וְדִבַּרְתֶּם אֵלָיו
  rationale: Two direct sentences clarify the sequence without adding urgency.
- pob_phrase: Thus says Yahweh
  simplified_phrase: This is what Yahweh says
  preserved_meaning: The prophetic formula and the divine name Yahweh are retained.
  reasoning_layer_used: POB lexical and theological decisions for כֹּה אָמַר יְהוָה
  rationale: The familiar English formula clearly introduces Yahweh’s authoritative message.
- pob_phrase: the bed to which you have gone up—you will not come down from it
  simplified_phrase: you will not come down from the bed you got into
  preserved_meaning: The king will never leave his sickbed because he will die there.
  reasoning_layer_used: POB lexical decisions for הַמִּטָּה, אֲשֶׁר עָלִיתָ שָּׁם, and לֹא תֵרֵד מִמֶּנָּה
  rationale: “Got into” naturally describes entering a sickbed while “come down” retains the source movement image.
