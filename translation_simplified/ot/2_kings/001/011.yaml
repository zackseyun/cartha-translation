translation:
  language: en
  text: 'Once again, the king sent another commander and his fifty soldiers to Elijah. The commander said to him, “Man of God, this is what the king says: ‘Come down at once.’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb means “go down” or “descend.” “Come down” presents the command from the commander’s viewpoint as he speaks to Elijah above him.
    reason: lexical_alternative
