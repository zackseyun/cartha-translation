translation:
  language: en
  text: 'But the angel of Yahweh spoke to Elijah the Tishbite: “Get up and go up to meet the messengers sent by the king of Samaria. Tell them, ‘Are you going to ask Baal-zebub, the god of Ekron, for an answer because there is no God in Israel?’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Are you going to ask Baal-zebub, the god of Ekron, for an answer because Israel has no God to consult?”
    reason: lexical_alternative
