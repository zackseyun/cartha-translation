translation:
  language: en
  text: So Ahaziah died, just as Yahweh’s word, which Elijah had spoken, declared. Because Ahaziah had no son, Jehoram became king in his place. This happened in the second year of the reign of another Jehoram, the son of Jehoshaphat and king of Judah.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: according to the word of Yahweh that Elijah had spoken
  simplified_phrase: just as Yahweh’s word, which Elijah had spoken, declared
  preserved_meaning: Ahaziah’s death happened in accordance with Yahweh’s word spoken by Elijah.
  reasoning_layer_used: Lexical decisions for כִּדְבַר יְהוָה and אֲשֶׁר דִּבֶּר אֵלִיָּהוּ
  rationale: The recast expresses fulfillment naturally while keeping Elijah as the one who spoke the word.
- pob_phrase: because he had no son
  simplified_phrase: Because Ahaziah had no son
  preserved_meaning: Ahaziah’s lack of a son explains why Jehoram succeeded him.
  reasoning_layer_used: Lexical decision for כִּי לֹא הָיָה לוֹ בֵּן and immediate context
  rationale: Naming Ahaziah resolves the pronoun clearly without changing the causal meaning.
- pob_phrase: in the second year of Jehoram son of Jehoshaphat, king of Judah
  simplified_phrase: in the second year of the reign of another Jehoram, the son of Jehoshaphat and king of Judah
  preserved_meaning: The accession is dated by the reign of the Jehoram who ruled Judah.
  reasoning_layer_used: Regnal-date and identification lexical decisions
  rationale: “Another Jehoram” distinguishes Judah’s king from Ahaziah’s successor.
interpretive_expansions:
- pob_phrase: he died / he had no son
  rendering: Ahaziah died / Ahaziah had no son
  claim: The man who died without a son is Ahaziah.
  evidence:
  - The preceding narrative identifies Ahaziah as the king under judgment.
  - Jehoram succeeds this childless king.
  confidence: high
  alternatives_preserved:
  - the king
  - he
- pob_phrase: Jehoram son of Jehoshaphat, king of Judah
  rendering: another Jehoram, the son of Jehoshaphat and king of Judah
  claim: The regnal date refers to Judah’s Jehoram, not the Jehoram succeeding Ahaziah.
  evidence:
  - The patronymic “son of Jehoshaphat” identifies the dated Jehoram.
  - The title “king of Judah” distinguishes him from the northern successor.
  confidence: high
  alternatives_preserved:
  - Jehoram son of Jehoshaphat, king of Judah
translation_notes:
  risk_flags:
  - risk: Adding Ahaziah’s name makes an implicit contextual referent explicit.
    mitigation: The preceding narrative firmly identifies Ahaziah as the deceased king.
  - risk: “Another Jehoram” has no separate matching Hebrew word.
    mitigation: It only clarifies that the verse refers to two men with the same name.
