translation:
  language: en
  text: Have you not heard? I made it long ago[a] and formed it in ancient times. Now I have made it happen, so that you would lay waste fortified cities and turn them into heaps of ruins.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “from afar”; in this context the Hebrew most likely refers to long ago.
    reason: lexical_alternative
  - marker: b
    text: The difficult Hebrew phrase may also mean “standing heaps.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Long ago I made it; from days of old I formed it.
  simplified_phrase: I made it long ago and formed it in ancient times.
  preserved_meaning: God established the event in the distant past while the forming image remains intact.
  reasoning_layer_used: POB lexical decisions for “made,” “formed,” and the two temporal phrases
  rationale: Combining the parallel clauses removes archaic wording without weakening their emphasis on ancient purpose.
- pob_phrase: Now I have brought it to pass
  simplified_phrase: Now I have made it happen
  preserved_meaning: God now causes his long-established purpose to become reality.
  reasoning_layer_used: POB lexical decision and theological decision on divine sovereignty
  rationale: The modern idiom states fulfillment clearly without adding a philosophical claim about causation.
- pob_phrase: lay waste fortified cities into heaps of ruins
  simplified_phrase: lay waste fortified cities and turn them into heaps of ruins
  preserved_meaning: The conquered defended cities become ruined mounds through military destruction.
  reasoning_layer_used: POB lexical decisions and doctrine-realignment revision
  rationale: The added verb makes the result natural in English while retaining both the destruction and heap images.
