translation:
  language: en
  text: Then Hezekiah prayed to Yahweh. He said, “Yahweh, God of Israel, you sit on your throne above the cherubim.[a] You alone are God over every kingdom on earth. You made the heavens and the earth.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be translated “you sit enthroned among the cherubim”; this is a royal image of Yahweh’s throne above the ark.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And Hezekiah prayed before Yahweh and said
  simplified_phrase: Then Hezekiah prayed to Yahweh. He said
  preserved_meaning: Hezekiah addressed his prayer to Yahweh.
  reasoning_layer_used: POB lexical decisions for וַיִּתְפַּלֵּל and לִפְנֵי יְהוָה
  rationale: Two short sentences replace the formal opening and make the action easy to follow.
- pob_phrase: enthroned above the cherubim
  simplified_phrase: you sit on your throne above the cherubim
  preserved_meaning: Yahweh is pictured as the king enthroned above the cherubim.
  reasoning_layer_used: POB lexical rationale for יֹשֵׁב הַכְּרֻבִים
  rationale: The concrete wording explains “enthroned” while keeping the royal-cultic image.
- pob_phrase: all the kingdoms of the earth
  simplified_phrase: every kingdom on earth
  preserved_meaning: Yahweh’s unique deity and authority extend over all earthly kingdoms.
  reasoning_layer_used: POB theological decision on exclusive deity and universal sovereignty
  rationale: The singular distributive wording is more natural without weakening the universal claim.
interpretive_expansions:
- pob_phrase: enthroned above the cherubim
  rendering: you sit on your throne above the cherubim
  claim: The phrase presents Yahweh in the royal image of a king seated on his throne.
  evidence:
  - The POB lexical rationale says the participle conveys enthronement rather than mere sitting.
  - The POB footnote identifies this as a royal-cultic image.
  confidence: high
  alternatives_preserved:
  - you sit enthroned among the cherubim
translation_notes:
  risk_flags:
  - risk: “Prayed to Yahweh” does not directly express the spatial nuance of praying before or in Yahweh’s presence.
    mitigation: It preserves the natural English sense that the prayer was addressed to Yahweh.
  - risk: “On your throne” makes the throne explicit although the Hebrew expresses it through an enthronement image.
    mitigation: The POB rendering and rationale already identify enthronement as the intended force.
