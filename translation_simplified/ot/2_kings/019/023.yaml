translation:
  language: en
  text: Through your messengers, you have mocked the Lord. You have said, “With my many chariots, I myself climbed the mountain heights and reached the farthest parts of Lebanon. I will cut down its tall cedars and its finest cypresses.[a] I will enter its farthest lodging place, its garden-like forest.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “its finest firs”; the exact kind of tree meant by the Hebrew word is uncertain.
    reason: lexical_alternative
