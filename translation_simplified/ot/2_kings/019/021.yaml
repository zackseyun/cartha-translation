simplification_decisions:
- pob_phrase: This is the word that Yahweh has spoken concerning him
  simplified_phrase: This is what Yahweh has said about him
  preserved_meaning: The statement still introduces a divine message about the enemy.
  reasoning_layer_used: The lexical decision allows “message” as the sense of “word” and explains “concerning him” as its subject.
  rationale: The recast formula uses ordinary English without weakening Yahweh’s direct speech.
- pob_phrase: Virgin Daughter Zion despises you; she mocks you
  simplified_phrase: Virgin Daughter Zion despises you and mocks you
  preserved_meaning: Zion personified as an inviolate young woman treats the enemy with contempt.
  reasoning_layer_used: The lexical decisions retain the personified title and distinguish despising from mocking.
  rationale: Joining the parallel actions makes the taunt flow naturally while keeping both verbs.
- pob_phrase: Daughter Jerusalem shakes her head behind you
  simplified_phrase: Daughter Jerusalem shakes her head in scorn as you retreat
  preserved_meaning: Jerusalem contemptuously dismisses the departing enemy.
  reasoning_layer_used: The lexical rationale identifies the gesture as scorn and places it behind a retreating enemy.
  rationale: The wording explains the ancient gesture and clarifies the scene for modern readers.
interpretive_expansions:
- pob_phrase: shakes her head behind you
  rendering: shakes her head in scorn as you retreat
  claim: The gesture expresses contempt while the enemy withdraws.
  evidence:
  - The POB cultural note identifies head-shaking as an idiom of scorn or mockery.
  - The lexical rationale says “behind you” pictures Jerusalem taunting the enemy as he retreats.
  confidence: high
  alternatives_preserved:
