translation:
  language: en
  text: 'This is what Yahweh has said about him: “Virgin Daughter Zion[a] despises you and mocks you. Daughter Jerusalem shakes her head in scorn as you retreat.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
