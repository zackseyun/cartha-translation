  text: 'Isaiah said to them, “Tell your master, ‘This is what Yahweh says: Do not let the words you have heard make you afraid. The servants[a] of the king of Assyria have spoken blasphemous words against me.’”'
  philosophy: optimal-equivalence
  footnotes:
