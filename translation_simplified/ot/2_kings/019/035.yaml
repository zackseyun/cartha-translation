  language: en
  text: That night, the angel of Yahweh went out and struck down 185,000 soldiers in the Assyrian camp. When people[a] got up early the next morning, there before them were all 185,000—dead bodies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “they got up early.” The Hebrew does not say who got up.
    reason: lexical_alternative
