translation:
  language: en
  text: 'Look! You have heard what Assyria’s kings have done to all the lands: they devoted them to destruction.[a] Will you be rescued?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “completely destroyed them.” The Hebrew describes placing them under a ban for destruction.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: what the kings of Assyria have done to all the lands
  simplified_phrase: what Assyria’s kings have done to all the lands
  preserved_meaning: The Assyrian kings had acted against multiple territories.
  reasoning_layer_used: POB lexical decisions for מַלְכֵי אַשּׁוּר and לְכָל הָאֲרָצוֹת
  rationale: The possessive form is shorter while the plural “lands” preserves the political-geographical sense.
- pob_phrase: devoting them to destruction
  simplified_phrase: they devoted them to destruction
  preserved_meaning: The lands were placed under complete destruction, not merely defeated.
  reasoning_layer_used: POB lexical and theological decisions for לְהַחֲרִימָם
  rationale: A direct clause clarifies who acted while retaining the Hebrew ban concept.
- pob_phrase: and will you be delivered?
  simplified_phrase: Will you be rescued?
  preserved_meaning: The speaker directly taunts the hearer about whether rescue is possible.
  reasoning_layer_used: POB lexical rationale for וְאַתָּה תִּנָּצֵל
  rationale: “Rescued” is common English and avoids adding a claim about the hearer’s thoughts.
translation_notes:
  risk_flags:
  - risk: “Devoted to destruction” may be unfamiliar to some readers.
    mitigation: The footnote gives a plain alternative while preserving the Hebrew ban concept.
