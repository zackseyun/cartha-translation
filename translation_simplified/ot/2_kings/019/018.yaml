simplification_decisions:
- pob_phrase: they have cast their gods into the fire
  simplified_phrase: They threw their gods into the fire
  preserved_meaning: The gods were deliberately put into the fire for destruction.
  reasoning_layer_used: POB lexical decision for וְנָתְנוּ
  rationale: “Threw” is clearer modern English for putting something into a fire, and simple past fits the narrative.
- pob_phrase: the work of human hands, wood and stone
  simplified_phrase: only objects made by human hands from wood and stone
  preserved_meaning: The supposed gods were human-made objects composed of wood and stone.
  reasoning_layer_used: POB lexical and theological decisions for מַעֲשֵׂה יְדֵי אָדָם and עֵץ וָאֶבֶן
  rationale: The active wording explains the human manufacture while keeping the contrast with true deity.
- pob_phrase: for they were not gods, but ...; therefore they destroyed them
  simplified_phrase: These were not gods, but ... so they destroyed them
  preserved_meaning: Their destruction followed from the fact that they were merely human-made objects, not true gods.
  reasoning_layer_used: POB lexical decisions for כִּי לֹא אֱלֹהִים הֵמָּה, כִּי אִם, and וַיְאַבְּדוּם
  rationale: Two short sentences make the reason and result easier to follow without weakening the denial of deity.
