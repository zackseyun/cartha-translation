translation:
  language: en
  text: Because your rage against me and your complacency[a] have risen to my ears, I will put my hook in your nose and my bit between your lips. I will turn you around and send you back on the same road you came.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
