  text: He sent Eliakim, the official in charge of the royal palace, along with Shebna the scribe and the elders of the priests. They were wearing sackcloth[a] when they went to Isaiah the prophet, son of Amoz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sackcloth was rough cloth worn as a sign of mourning or distress.
    reason: cultural_note
