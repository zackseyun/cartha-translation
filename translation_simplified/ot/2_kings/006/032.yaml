translation:
  language: en
  text: Elisha was sitting in his house with the elders. The king had sent a man ahead of him. Before the messenger arrived, Elisha said to the elders, “Do you see? This son of a murderer has sent him to cut off my head! When the messenger arrives, shut the door and hold him back at the doorway. Can you not hear his master’s footsteps coming right behind him?”
  philosophy: optimal-equivalence
