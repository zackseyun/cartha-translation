translation:
  language: en
  text: As they came down to capture him, Elisha prayed to Yahweh, “Please strike this nation with blindness.” So Yahweh struck them with blindness,[a] just as Elisha had asked.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may mean a blinding confusion that kept them from seeing clearly, not necessarily total or permanent blindness.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: When they came down against him
  simplified_phrase: As they came down to capture him
  preserved_meaning: The Aramean force moved toward Elisha with the hostile purpose stated in the immediate context.
  reasoning_layer_used: Lexical decision for וַיֵּרְדוּ אֵלָיו and 2 Kings 6:13–14
  rationale: “Capture him” clarifies their stated purpose without implying an assault.
- pob_phrase: So he struck them
  simplified_phrase: So Yahweh struck them
  preserved_meaning: Yahweh answered Elisha’s prayer by afflicting the approaching force.
  reasoning_layer_used: Lexical decision for וַיַּכֵּם and theological decision for יְהוָה
  rationale: Repeating Yahweh’s name removes an unclear pronoun without changing the subject.
- pob_phrase: according to the word of Elisha
  simplified_phrase: just as Elisha had asked
  preserved_meaning: Yahweh acted in direct response to Elisha’s spoken prayer.
  reasoning_layer_used: Lexical decision for כִּדְבַר אֱלִישָׁע and narrative context
  rationale: The natural wording preserves the direct link between Elisha’s request and Yahweh’s action.
