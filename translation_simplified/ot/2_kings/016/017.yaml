translation:
  language: en
  text: Then King Ahaz cut away the frames from the temple stands and removed the basin that rested on them. He also took the Sea[a] down from the bronze oxen beneath it and placed it on a stone pavement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Sea was the name of the large basin made for Solomon’s temple (see 1 Kings 7:23–26).
    reason: cross_reference
