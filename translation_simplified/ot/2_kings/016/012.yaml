translation:
  language: en
  text: When the king arrived from Damascus, he saw the altar. He approached it and went up onto it.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “approached the altar and offered on it.” The Hebrew more literally describes going up onto the altar, but some understand this as shorthand for beginning to offer sacrifices.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: When the king came from Damascus
  simplified_phrase: When the king arrived from Damascus
  preserved_meaning: The king came to the place after traveling from Damascus.
  reasoning_layer_used: Lexical decision for וַיָּבֹא and מִדַּמֶּשֶׂק
  rationale: “Arrived” makes the direction of movement natural in modern English.
- pob_phrase: the king saw the altar; and the king came near to the altar
  simplified_phrase: he saw the altar. He approached it
  preserved_meaning: The king first saw the altar and then moved near it.
  reasoning_layer_used: Lexical decisions for וַיַּרְא and וַיִּקְרַב
  rationale: Two short sentences and pronouns clarify the sequence without changing the actor.
- pob_phrase: went up on it
  simplified_phrase: went up onto it
  preserved_meaning: The king physically moved up onto the altar.
  reasoning_layer_used: Lexical and theological decision for וַיַּעַל עָלָיו
  rationale: “Onto” clearly expresses the source-driven sense of upward movement to the altar’s surface.
translation_notes:
  risk_flags:
  - risk: Using pronouns reduces the Hebrew’s threefold repetition of “the king.”
    mitigation: The king remains the clear subject throughout, preserving his personal agency.
  - risk: Physical ascent onto the altar may seem unexpected to readers.
    mitigation: The main text keeps the chosen literal sense, while the footnote preserves the sacrificial alternative.
