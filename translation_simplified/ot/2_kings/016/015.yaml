translation:
  language: en
  text: 'Then King Ahaz ordered Uriah the priest: “Offer on the great altar the morning burnt offering, the evening grain offering, the king’s burnt offering and grain offering, and the burnt, grain, and drink offerings of all the people of the land. Throw on it all the blood from the burnt offerings and sacrifices. But reserve the bronze altar for me to inquire by.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “to inspect,” “to consider,” or possibly “to seek guidance by.” The Hebrew is difficult, so the exact purpose of the bronze altar is uncertain.
    reason: alternative_reading
