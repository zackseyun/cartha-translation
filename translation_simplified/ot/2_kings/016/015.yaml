  preserved_meaning: Ahaz gives Uriah an authoritative command.
  reasoning_layer_used: Lexical decision for וַיְצַוֵּהוּ
  rationale: A colon introduces the command naturally without weakening its authority.
- pob_phrase: On the great altar offer up
  simplified_phrase: Offer on the great altar
  preserved_meaning: The great altar is where the listed sacrifices must be offered.
  reasoning_layer_used: Altar and sacrificial lexical decisions
  rationale: Ordinary English clause order makes the instruction easier to follow.
- pob_phrase: the burnt offering of all the people of the land and their grain offerings and their drink offerings
  simplified_phrase: the burnt, grain, and drink offerings of all the people of the land
  preserved_meaning: All three kinds of offerings from the people remain distinct.
  reasoning_layer_used: Lexical decisions for עֹלָה, מִנְחָה, and נֶסֶךְ
  rationale: Grouping the repeated possessive phrases shortens the list without merging its categories.
