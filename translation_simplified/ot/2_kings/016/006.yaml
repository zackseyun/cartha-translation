translation:
  language: en
  text: At that time King Rezin of Aram took Elath back for Aram. He drove the Judeans out of the city, and the Arameans moved in and have lived there to this day.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew text reads “Arameans.” Some ancient witnesses and interpreters favor “Edomites,” which agrees with the broader context and 2 Chronicles 28:17.
    reason: textual_variant
simplification_decisions:
- pob_phrase: Rezin king of Aram restored Elath to Aram
  simplified_phrase: King Rezin of Aram took Elath back for Aram
  preserved_meaning: Rezin returned Elath to Aramean political control.
  reasoning_layer_used: Lexical decision for הֵשִׁיב and לַאֲרָם
  rationale: “Took back” states the change of control in ordinary English.
- pob_phrase: drove the Judeans out of Elath
  simplified_phrase: drove the Judeans out of the city
  preserved_meaning: The people of Judah were forcibly expelled from Elath.
  reasoning_layer_used: Lexical decisions for וַיְנַשֵּׁל and הַיְהוּדִים
  rationale: “The city” avoids repeating Elath while retaining the force of expulsion.
- pob_phrase: the Arameans came to Elath and have lived there
  simplified_phrase: the Arameans moved in and have lived there
  preserved_meaning: The Arameans entered Elath as residents and remained there.
  reasoning_layer_used: Lexical decision for וַיֵּשְׁבוּ and theological decision on the ethnonym
  rationale: “Moved in” makes the implied settlement clear without changing the chosen reading.
