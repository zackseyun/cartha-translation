translation:
  language: en
  text: Ahaz died and joined his ancestors.[a] He was buried with his ancestors in the city of David. Then his son Hezekiah became king in his place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says that Ahaz “slept with his fathers,” a standard royal expression meaning that he died and joined his ancestors.
    reason: lexical_alternative
