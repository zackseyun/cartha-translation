translation:
  language: en
  text: 'So Ahaz sent messengers to King Tiglath-pileser of Assyria with this message: “I am your servant and your son.[a] Come and save me from the grip of the king of Aram[b] and the king of Israel, who are rising against me.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Your servant and your son” was diplomatic language showing submission to a more powerful king.
    reason: cultural_note
  - marker: b
    text: Aram is traditionally called Syria.
    reason: alternative_reading
