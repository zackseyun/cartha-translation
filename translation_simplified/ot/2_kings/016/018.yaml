translation:
  language: en
  text: He removed from Yahweh’s temple the covered structure for the Sabbath that they had built there,[a] along with the king’s outer entrance.[b] He did this because of the king of Assyria.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The exact kind of covered structure is uncertain; it may have been a canopy, pavilion, or portico.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb may also mean that he altered, redirected, or relocated these features.
    reason: lexical_alternative
  - marker: c
    text: This may mean that he acted out of fear of the king of Assyria.
    reason: alternative_reading
