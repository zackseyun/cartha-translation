translation:
  language: en
  text: He followed the way of the kings of Israel. He even made his son pass through the fire,[a] copying the detestable practices of the nations Yahweh had driven out before the sons of Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “offered his son in the fire.” The Hebrew literally says “made his son pass through the fire,” an expression linked to a condemned pagan rite.
    reason: alternative_reading
