translation:
  language: en
  text: So the king of Israel went with the king of Judah and the king of Edom. They took a roundabout route and traveled for seven days, but there was no water for the camp or for the livestock[a] traveling with them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “the livestock at their feet,” meaning the animals accompanying them.
    reason: lexical_alternative
