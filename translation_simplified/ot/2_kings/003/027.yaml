translation:
  language: en
  text: Then he took his firstborn son—the son who was to become king after him—and sacrificed him as a burnt offering on the wall. Great wrath came against Israel.[a] So they stopped attacking him and returned to their own land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew does not say whose wrath this was. It may refer to divine wrath, Moab’s fury, or Israel’s demoralization after the sacrifice.
    reason: alternative_reading
