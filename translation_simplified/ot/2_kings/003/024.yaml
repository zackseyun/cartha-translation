  reasoning_layer_used: lexical decisions for וַיָּקֻמוּ, וַיַּכּוּ, and מוֹאָב
  rationale: The wording identifies the military participants and uses the common verb “attacked.”
- pob_phrase: they fled before them
  simplified_phrase: The Moabites fled
  preserved_meaning: Moab’s forces fled from Israel in a rout.
  reasoning_layer_used: lexical decision for וַיָּנֻסוּ מִפְּנֵיהֶם
  rationale: Naming the fleeing group removes confusing pronouns while retaining the rout.
- pob_phrase: went into it and kept striking Moab
  simplified_phrase: advanced into the territory and kept attacking Moab
  preserved_meaning: Israel moved into the area while continuing its military attacks.
  reasoning_layer_used: lexical decisions for וַיָּבֹאוּ בָהּ and וְהַכּוֹת, plus doctrine realignment
  rationale: “Advanced” clarifies the battle movement, while the footnote preserves the suffix’s compressed ambiguity.
