translation:
  language: en
  text: When the Moabites reached Israel’s camp, the Israelite army rose and attacked them. The Moabites fled. Then the Israelites advanced into the territory[a] and kept attacking Moab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “into it,” probably referring to the land or territory of Moab.
    reason: lexical_alternative
