translation:
  language: en
  text: Elisha said, “As surely as Yahweh of hosts lives, before whom I stand,[a] I would not even look at you or see you if I did not respect King Jehoshaphat of Judah, who is here.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Standing before Yahweh can also mean serving him as a prophet.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew pictures showing regard for Jehoshaphat’s face or presence.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: were it not that I regard the presence of Jehoshaphat king of Judah
  simplified_phrase: if I did not respect King Jehoshaphat of Judah, who is here
  preserved_meaning: Elisha responds only because he shows regard for Jehoshaphat’s presence.
  reasoning_layer_used: POB lexical decisions and footnote b
  rationale: The conditional and face-related idiom are recast in direct, common English.
- pob_phrase: I would not look at you or see you
  simplified_phrase: I would not even look at you or see you
  preserved_meaning: The paired verbs strongly emphasize Elisha’s refusal to acknowledge the king.
  reasoning_layer_used: POB lexical decision for the paired verbs
  rationale: Adding “even” makes the force clear while retaining both source images.
- pob_phrase: As Yahweh of hosts lives
  simplified_phrase: As surely as Yahweh of hosts lives
  preserved_meaning: Elisha begins with a solemn oath using Yahweh’s personal name and established title.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Surely” makes the oath function immediately clear without replacing the divine title.
interpretive_expansions:
- pob_phrase: the presence of Jehoshaphat
  rendering: King Jehoshaphat of Judah, who is here
  claim: Jehoshaphat’s presence among the kings is the reason Elisha gives them attention.
  evidence:
  - The POB identifies the Hebrew face idiom as referring to Jehoshaphat’s presence.
  - The conditional says Elisha would otherwise refuse to look at the person addressed.
  confidence: high
  alternatives_preserved:
  - respect the presence of King Jehoshaphat
  - show regard for King Jehoshaphat himself
translation_notes:
  risk_flags:
  - risk: “Who is here” makes the contextual presence more explicit than the POB wording.
    mitigation: Footnote b preserves the Hebrew face/presence image and its idiomatic force.
  - risk: Modern readers may not recognize that “before whom I stand” implies prophetic service.
    mitigation: Footnote a states that possible vocational sense without replacing the literal image.
