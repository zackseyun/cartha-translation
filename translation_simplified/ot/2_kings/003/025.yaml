  language: en
  text: They tore down the cities. On every good plot of land, each man threw his stone until the land was full of stones. They blocked every spring and cut down every good tree.[a] They continued until only the stones of Kir-hareseth remained.[b] Then the slingers surrounded the city and attacked it.
  philosophy: optimal-equivalence
  footnotes:
