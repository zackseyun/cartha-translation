- pob_phrase: the prophets of your father and ... the prophets of your mother
  simplified_phrase: your father’s prophets and your mother’s prophets
  preserved_meaning: Elisha points the king to the prophets associated with his royal parents.
  reasoning_layer_used: POB lexical rationale on the royal house’s prophetic associations
  rationale: Possessive wording is shorter and more natural without narrowing the reference.
- pob_phrase: has called these three kings
  simplified_phrase: has summoned these three kings
  preserved_meaning: Yahweh brought the three kings together for this outcome.
  reasoning_layer_used: POB lexical alternatives for קָרָא
  rationale: “Summoned” makes the contextual sense of “called” immediately clear.
- pob_phrase: to give them into the hand of Moab
