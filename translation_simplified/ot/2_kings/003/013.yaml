translation:
  language: en
  text: Elisha said to the king of Israel, “What do I have to do with you? Go to your father’s prophets and your mother’s prophets.” But the king answered, “No,[a] because Yahweh has summoned these three kings to hand them over to Moab.”
  philosophy: optimal-equivalence
  footnotes:
