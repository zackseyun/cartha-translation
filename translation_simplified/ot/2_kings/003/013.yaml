  preserved_meaning: The kings are to be delivered into Moab’s power.
  reasoning_layer_used: POB lexical decisions for לָתֵת אוֹתָם and בְּיַד מוֹאָב
  rationale: The familiar expression clearly conveys transfer into Moab’s power while retaining the hand image.
