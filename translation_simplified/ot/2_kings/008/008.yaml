translation:
  language: en
  text: The king told Hazael, “Take a gift with you and go meet the man of God. Ask Yahweh through him, ‘Will I recover from this sickness?’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Will I live through this sickness?” The Hebrew verb literally means “live” but here refers to surviving or recovering.
    reason: lexical_alternative
