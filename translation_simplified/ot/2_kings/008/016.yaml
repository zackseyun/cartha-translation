translation:
  language: en
  text: In the fifth year of Joram son of Ahab, king of Israel,[a] Jehoram son of Jehoshaphat became king of Judah. At that time, Jehoshaphat was king of Judah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses closely related but distinct forms for Joram, king of Israel, and Jehoram, king of Judah.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew is compressed and can be translated more literally, “and Jehoshaphat king of Judah”; some understand this as a period of shared rule.
    reason: alternative_reading
