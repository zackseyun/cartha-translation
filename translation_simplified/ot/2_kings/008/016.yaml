  preserved_meaning: The accession is dated by Joram’s fifth regnal year.
  reasoning_layer_used: lexical decision for the chronological notice
  rationale: Removing the opening “And” makes the date formula more natural without changing its time reference.
- pob_phrase: while Jehoshaphat was king of Judah
  simplified_phrase: At that time, Jehoshaphat was king of Judah.
  preserved_meaning: Jehoshaphat’s kingship forms part of the same chronological setting.
  reasoning_layer_used: theological decision on the compressed chronological clause
  rationale: A separate sentence makes the difficult timeline easier to follow without asserting a formal coregency.
- pob_phrase: began to reign
