- pob_phrase: And as he was telling the king how he had restored the dead to life
  simplified_phrase: While Gehazi was telling the king how Elisha had brought the dead back to life
  preserved_meaning: Gehazi was still recounting Elisha’s life-restoring work when the woman arrived.
  reasoning_layer_used: Immediate context and the lexical decision for הֶחֱיָה.
  rationale: Names replace pronouns where needed, and “brought back to life” clearly preserves the causative meaning.
- pob_phrase: behold, the woman ... was crying out to the king
  simplified_phrase: the very woman ... came to plead with the king
  preserved_meaning: Her arrival was a striking coincidence, and she urgently sought the king’s help.
  reasoning_layer_used: The lexical decisions for וְהִנֵּה and צֹעֶקֶת אֶל הַמֶּלֶךְ.
  rationale: “The very woman” conveys the surprise, while “plead” makes the cry for help natural in context.
- pob_phrase: about her house and about her field
  simplified_phrase: for the return of her house and field
  preserved_meaning: Her plea concerned recovering her property.
  reasoning_layer_used: Immediate property-restoration context and the lexical rationale for עַל.
  rationale: The clearer wording states what she was seeking without changing the objects of her plea.
