translation:
  language: en
  text: While Gehazi was telling the king how Elisha had brought the dead back to life, the very woman whose son Elisha had brought back to life came to plead with the king for the return of her house and field. Gehazi said, “My lord the king, this is the woman, and this is her son—the one Elisha brought back to life.”
  philosophy: optimal-equivalence
