translation:
  language: en
  text: Elisha had told the woman whose son he had brought back to life, “Get up and leave with everyone in your household. Live wherever you can for a while, because Yahweh has called for a famine. It has come upon the land and will last seven years.”
  philosophy: optimal-equivalence
