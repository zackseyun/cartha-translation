translation:
  language: en
  text: The king asked the woman, and she told him. Then he put a court official[a] in charge of her case and ordered him, “Give back everything that belongs to her. Also give her all the produce from her field from the day she left the land until now.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “eunuch”; the Hebrew word can mean either a eunuch or, more broadly, a court official.
    reason: lexical_alternative
