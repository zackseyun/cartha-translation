translation:
  language: en
  text: Hazael went to meet him, bringing a gift—all the finest goods of Damascus, enough to load forty camels. When he arrived, he stood before Elisha and said, “Your son,[a] King Ben-hadad of Aram, sent me to ask, ‘Will I recover from this sickness?’”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Your son” is a respectful expression of humility toward a superior; it does not necessarily mean that Ben-hadad was literally Elisha’s son.
    reason: cultural_note
  - marker: b
    text: More literally, “Will I live from this sickness?”
    reason: lexical_alternative
