  preserved_meaning: The action occurred on the day after the previous events.
  reasoning_layer_used: POB lexical decision for מִמָּחֳרָת
  rationale: The shorter opening preserves the narrative sequence in natural English.
- pob_phrase: spread it over his face, and he died
  simplified_phrase: spread it over the king’s face. Then the king died.
  preserved_meaning: The cloth was placed over the sick king’s face before his death.
  reasoning_layer_used: Immediate context in 2 Kings 8:14–15 and POB subject-ambiguity decision
  rationale: Naming the king prevents misleading pronoun linkage while leaving the actor unnamed.
- pob_phrase: Then Hazael reigned in his place
  simplified_phrase: Afterward, Hazael became king in his place.
  preserved_meaning: Hazael succeeded the dead king and ruled instead of him.
  reasoning_layer_used: POB lexical decision for וַיִּמְלֹךְ חֲזָהאֵל תַּחְתָּיו
  rationale: “Became king” clearly expresses the succession formula for common readers.
