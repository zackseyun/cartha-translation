translation:
  language: en
  text: The next day, he took the covering cloth[a], dipped it in water, and spread it over the king’s face. Then the king died. Afterward, Hazael became king in his place.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Hebrew word may mean a bedcover, quilt, or woven or netted cloth; the exact kind of cloth is uncertain.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew does not name the person who took, dipped, and spread the cloth. Many understand that person to be Hazael, but Hazael is not named until the final sentence.
    reason: alternative_reading
