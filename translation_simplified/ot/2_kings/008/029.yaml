translation:
  language: en
  text: King Yoram returned to Jezreel to recover from the wounds the Arameans had given him at Ramah, where he had fought against King Hazael of Aram. Ahaziah, the son of Jehoram and king of Judah, went down to see Yoram son of Ahab in Jezreel because Yoram was ill.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Then King Yoram returned to Jezreel to recover from the wounds that the Arameans had inflicted on him
  simplified_phrase: King Yoram returned to Jezreel to recover from the wounds the Arameans had given him
  preserved_meaning: Yoram went back to Jezreel to recover from battle wounds caused by the Arameans.
  reasoning_layer_used: POB lexical decisions for וַיָּשָׁב, לְהִתְרַפֵּא, and מִן הַמַּכִּים
  rationale: “Had given him” replaces the formal phrase “had inflicted on him” without changing who caused the wounds.
- pob_phrase: at Ramah when he fought against Hazael king of Aram
  simplified_phrase: at Ramah, where he had fought against King Hazael of Aram
  preserved_meaning: The wounds were received at the battle location while Yoram fought Hazael.
  reasoning_layer_used: POB lexical decisions for בָּרָמָה, בְּהִלָּחֲמוֹ, and אֶת חֲזָהאֵל מֶלֶךְ אֲרָם
  rationale: The relative clause makes the battle setting easier to follow while retaining Ramah and the conflict with Hazael.
- pob_phrase: And Ahaziah son of Jehoram, king of Judah, went down to see Yoram son of Ahab
  simplified_phrase: Ahaziah, the son of Jehoram and king of Judah, went down to see Yoram son of Ahab
  preserved_meaning: Ahaziah was Jehoram’s son, ruled Judah, and traveled down to see Yoram.
  reasoning_layer_used: POB lexical decision for וַאֲחַזְיָהוּ...יָרַד and narrative syntax
  rationale: The reordered titles clarify that Ahaziah is both Jehoram’s son and Judah’s king.
interpretive_expansions:
- pob_phrase: because he was sick
  rendering: because Yoram was ill
  claim: The sick person is Yoram rather than Ahaziah.
  evidence:
  - The visit is directed toward Yoram, who has returned to recover from his wounds.
  - The POB rationale identifies the phrase as Yoram’s present condition.
  confidence: high
