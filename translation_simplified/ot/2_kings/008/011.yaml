translation:
  language: en
  text: He held his gaze steady and kept staring until he became ashamed.[a] Then the man of God wept.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew does not make clear whether Elisha or Hazael became ashamed.
    reason: alternative_reading
