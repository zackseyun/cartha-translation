translation:
  language: en
  text: Hazael asked, “Why are you weeping, my lord?” Elisha answered, “Because I know the evil you will do to the sons of Israel.[a] You will set their fortresses on fire. You will kill their young men with the sword, dash their little children to pieces, and rip open their pregnant women.”
