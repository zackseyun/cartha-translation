  preserved_meaning: Elisha explains that he weeps because he knows Hazael’s future evil.
  reasoning_layer_used: Immediate narrative context and POB lexical decision for כִּי יָדַעְתִּי
  rationale: Naming the speaker removes an unclear pronoun without changing the exchange.
- pob_phrase: you will set their fortresses on fire, kill their young men with the sword, dash their little children to pieces, and rip open their pregnant women
  simplified_phrase: You will set their fortresses on fire. You will kill their young men with the sword, dash their little children to pieces, and rip open their pregnant women.
  preserved_meaning: The prophecy explicitly names each atrocity Hazael will commit.
  reasoning_layer_used: POB theological decision to retain graphic prophetic violence
  rationale: Two sentences make the list easier to follow without softening its force.
