  simplified_phrase: Hazael asked, “Why are you weeping, my lord?”
  preserved_meaning: Hazael respectfully asks Elisha why he is continuing to weep.
  reasoning_layer_used: POB lexical decisions for “my lord” and “weeping”
  rationale: Direct address is clearer while retaining Hazael’s respect and the solemn tone.
- pob_phrase: And he said, “Because I know the evil that you will do
