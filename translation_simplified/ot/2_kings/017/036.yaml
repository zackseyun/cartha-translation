translation:
  language: en
  text: Instead, you must fear Yahweh.[a] He brought you up from the land of Egypt with great power and an outstretched arm. Bow down to him and offer sacrifices to him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “fear” means honoring Yahweh with reverent awe and faithful loyalty, not merely being terrified.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: But Yahweh, who brought you up from the land of Egypt
  simplified_phrase: Instead, you must fear Yahweh. He brought you up from the land of Egypt
  preserved_meaning: Yahweh alone is the positive alternative to the other gods, and he is identified as Israel’s deliverer.
  reasoning_layer_used: POB lexical decision for כִּי אִם and the exodus formula
  rationale: The long opening clause becomes two direct sentences while keeping the contrast and deliverance claim.
- pob_phrase: you shall fear him
  simplified_phrase: you must fear Yahweh
  preserved_meaning: The command requires reverent fear and covenant loyalty toward Yahweh.
  reasoning_layer_used: POB theological decision on covenant fear
  rationale: “Must” makes the command natural, while “fear” remains to preserve its biblical force.
- pob_phrase: to him you shall sacrifice
  simplified_phrase: offer sacrifices to him
  preserved_meaning: Sacrificial offerings are to be made to Yahweh alone.
  reasoning_layer_used: POB lexical decision for וְלוֹ תִזְבָּחוּ
  rationale: The verbal idea is expressed in ordinary English without weakening the worship command.
