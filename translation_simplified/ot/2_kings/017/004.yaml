translation:
  language: en
  text: The king of Assyria discovered that Hoshea was involved in a conspiracy. He discovered this because Hoshea had sent messengers to the Egyptian king named So[a] and had stopped sending his yearly tribute to Assyria. So the Assyrian king detained Hoshea, then bound him and put him in prison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The identity of this Egyptian king is uncertain; “So” represents the Hebrew name.
    reason: cultural_note
