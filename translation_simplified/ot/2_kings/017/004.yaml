  preserved_meaning: The Assyrian king detected disloyal political plotting in Hoshea’s conduct.
  reasoning_layer_used: POB lexical decisions for וַיִּמְצָא, קֶשֶׁר, and בְּהוֹשֵׁעַ
  rationale: The rewrite makes the Hebrew idiom natural without changing the charge.
- pob_phrase: So king of Egypt
  simplified_phrase: the Egyptian king named So
  preserved_meaning: So remains the ruler’s untranslated proper name and uncertain identity.
  reasoning_layer_used: POB lexical decision and cultural footnote for סוֹא
  rationale: This order prevents readers from mistaking “So” for a transition word.
- pob_phrase: confined him and bound him in prison
  simplified_phrase: detained Hoshea, then bound him and put him in prison
  preserved_meaning: The Assyrian king first detained Hoshea and then bound and imprisoned him.
  reasoning_layer_used: POB lexical decisions and footnote for וַיַּעַצְרֵהוּ and וַיַּאַסְרֵהוּ
  rationale: “Then” clearly preserves the two distinct actions and their sequence.
