  reasoning_layer_used: The theological decision identifies a contextual contrast between the two practices.
  rationale: “Still” makes the ongoing inconsistency easy to follow without changing the chosen contrast.
- pob_phrase: according to the custom of the nations
  simplified_phrase: following the customs of the nations
  preserved_meaning: Their worship conformed to the established practices of their native peoples.
  reasoning_layer_used: The lexical decision understands mishpat here as customary practice, not a legal ruling.
  rationale: The verbal phrase is more natural in common English than “according to the custom.”
- pob_phrase: from which they had been exiled
  simplified_phrase: from which they had been forced into exile
  preserved_meaning: They had been removed from those nations against their will.
  reasoning_layer_used: The lexical rationale identifies an impersonal passive describing forced relocation.
  rationale: “Forced into exile” makes the involuntary nature of their removal immediately clear.
