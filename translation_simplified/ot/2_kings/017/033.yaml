translation:
  language: en
  text: They feared Yahweh[a], but they still served their own gods, following the customs of the nations from which they had been forced into exile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “They feared Yahweh and served their gods.” The Hebrew says “and,” but the context presents the two practices as inconsistent.
    reason: lexical_alternative
