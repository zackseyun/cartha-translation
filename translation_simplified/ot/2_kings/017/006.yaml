  text: In the ninth year of Hoshea’s reign, the king of Assyria captured Samaria. He forced the people of Israel into exile in Assyria and settled them in Halah, along the Habor River of Gozan,[a] and in the cities of Media.
  philosophy: optimal-equivalence
