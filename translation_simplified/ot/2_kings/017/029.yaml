translation:
  language: en
  text: But each nation continued making its own gods. They put these gods in the shrines that the people of Samaria[a] had built at worship sites called high places, in the cities where each nation lived.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the Samaritans.” Here this means the inhabitants of the region of Samaria.
    reason: lexical_alternative
