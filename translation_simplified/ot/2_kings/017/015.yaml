translation:
  language: en
  text: They rejected his laws, the covenant he had made with their fathers, and the testimonies through which he had warned them. They pursued what was empty and became empty themselves.[a] They followed the nations around them, even though Yahweh had commanded them not to imitate those nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may refer to emptiness, worthlessness, or idols, and uses related words for what they pursued and what they became.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: his statutes
  simplified_phrase: his laws
  preserved_meaning: God's prescribed covenant laws remain in view.
  reasoning_layer_used: POB lexical decision for חֻקָּיו
  rationale: “Laws” communicates the legal sense more readily than “statutes.”
- pob_phrase: They went after vanity and became vain
  simplified_phrase: They pursued what was empty and became empty themselves
  preserved_meaning: They became like the empty or worthless thing they pursued.
  reasoning_layer_used: POB lexical decisions and restored Hebrew wordplay
  rationale: The concrete repetition preserves the Hebrew wordplay without suggesting personal pride.
- pob_phrase: not to do like them
  simplified_phrase: not to imitate those nations
  preserved_meaning: Yahweh had forbidden Israel from copying the surrounding nations' practices.
  reasoning_layer_used: POB rationale for לְבִלְתִּי עֲשׂוֹת כָּהֶם
  rationale: “Not to imitate” states the prohibition in natural modern English.
translation_notes:
  risk_flags:
  - risk: “What was empty” may not immediately signal idols.
    mitigation: The footnote preserves idols as a contextual possibility without removing the Hebrew ambiguity.
