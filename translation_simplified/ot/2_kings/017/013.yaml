translation:
  language: en
  text: Yet Yahweh warned Israel and Judah through every one of his prophets and every seer[a]. He said, “Turn away from your evil ways. Obey my commandments and statutes, in keeping with the whole law I commanded your fathers[b] and sent to you through my servants the prophets.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A seer was one who received visions from God.
    reason: cultural_note
  - marker: b
    text: “Your fathers” may also be understood as “your ancestors.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: by every one of his prophets and every seer, saying
  simplified_phrase: through every one of his prophets and every seer. He said
  preserved_meaning: Yahweh delivered the warning through all his prophetic messengers, including seers.
  reasoning_layer_used: POB lexical decisions and source syntax
  rationale: Splitting the sentence makes the speaker and means of warning easier to follow.
- pob_phrase: Turn from your evil ways and keep my commandments and my statutes
  simplified_phrase: Turn away from your evil ways. Obey my commandments and statutes
  preserved_meaning: The people must abandon evil conduct and follow both kinds of covenant requirements.
  reasoning_layer_used: POB lexical decisions for שׁוּב, שׁמר, מִצְוֺת, and חֻקּוֹת
  rationale: “Obey” states the covenantal sense of “keep” while preserving the two legal terms.
- pob_phrase: according to all the law that I commanded your fathers and that I sent to you by my servants the prophets
  simplified_phrase: in keeping with the whole law I commanded your fathers and sent to you through my servants the prophets
  preserved_meaning: The required obedience accords with the entire law given to the fathers and mediated again through the prophets.
  reasoning_layer_used: POB theological decision on the referent of “that I sent”
  rationale: The revised clause is more natural while keeping “the law” as the likely referent of both verbs.
