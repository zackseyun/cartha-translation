translation:
  language: en
  text: Then the king of Assyria ordered, “Send back one of the priests you exiled from that land. Have him live there and teach the people the customs of the god of that land.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “God of that land.” The lowercase “god” reflects the Assyrian king’s viewpoint.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: commanded, saying
  simplified_phrase: ordered
  preserved_meaning: The king issued an authoritative command and then spoke.
  reasoning_layer_used: Lexical decision for וַיְצַו and discourse function of לֵאמֹר
  rationale: “Ordered” preserves the royal command while avoiding a stiff speech formula.
- pob_phrase: Take there one of the priests whom you exiled from there
  simplified_phrase: Send back one of the priests you exiled from that land
  preserved_meaning: A previously exiled priest is to be returned to the land.
  reasoning_layer_used: Lexical decisions for הֹלִיכוּ שָׁמָּה and אֲשֶׁר הִגְלִיתֶם מִשָּׁם
  rationale: “Send back” expresses the relocation naturally without changing who was exiled.
- pob_phrase: let him go and live there, and let him teach them the custom
  simplified_phrase: Have him live there and teach the people the customs
  preserved_meaning: The one priest must reside there and instruct the inhabitants in required religious practice.
  reasoning_layer_used: Lexical decisions and the theological decision to render the irregular plural verbs with singular sense
  rationale: The shorter command keeps the priest singular and makes the unnamed learners clear.
translation_notes:
  risk_flags:
  - risk: “Send back” selects a natural directional sense where the Hebrew can also mean “take” or “bring there.”
    mitigation: The wording preserves the return to the land without specifying the king’s physical location.
