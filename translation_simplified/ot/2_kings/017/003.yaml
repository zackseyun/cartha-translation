translation:
  language: en
  text: Shalmaneser king of Assyria marched against Hoshea. Hoshea became subject to him and paid him tribute.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: came up against him
  simplified_phrase: marched against Hoshea
  preserved_meaning: Shalmaneser made a military advance against Hoshea without necessarily beginning a full assault.
  reasoning_layer_used: The lexical decision identifies the phrase as a military advance and lists “marched against him” as an acceptable alternative.
  rationale: This wording makes the military action and the pronoun’s referent immediately clear.
- pob_phrase: became his servant
  simplified_phrase: became subject to him
  preserved_meaning: Hoshea came under Shalmaneser’s political authority rather than becoming a personal slave.
  reasoning_layer_used: The lexical rationale defines “servant” here as political subordination in a vassal relationship.
  rationale: “Became subject to him” clearly expresses the change in political status without the technical term “vassal.”
interpretive_expansions:
- pob_phrase: him
  rendering: Hoshea
  claim: Hoshea is the ruler against whom Shalmaneser marched.
  evidence:
  - The same verse immediately names Hoshea as the ruler who became subordinate to Shalmaneser.
  confidence: high
translation_notes:
  risk_flags:
