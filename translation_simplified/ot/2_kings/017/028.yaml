simplification_decisions:
- pob_phrase: whom they had exiled from Samaria
  simplified_phrase: who had been exiled from Samaria
  preserved_meaning: The priest had been forcibly removed from Samaria by unnamed agents.
  reasoning_layer_used: Lexical decision for the Hiphil of גלה
  rationale: The passive wording avoids an awkward unspecified “they” without naming the exilers.
- pob_phrase: came and lived in Bethel
  simplified_phrase: came to Bethel and lived there
  preserved_meaning: The priest arrived in Bethel and took up residence there.
  reasoning_layer_used: Lexical decisions for וַיָּבֹא, וַיֵּשֶׁב, and בְּבֵית אֵל
  rationale: Moving the location beside “came” gives natural English while keeping both actions distinct.
- pob_phrase: and he taught them how they should fear Yahweh
  simplified_phrase: He taught the people how they should fear Yahweh
  preserved_meaning: The priest instructed the people in the proper way to fear Yahweh.
  reasoning_layer_used: Lexical decisions for אֹתָם and אֵיךְ יִירְאוּ, plus the theological decision for יְהוָה
  rationale: A new sentence and an explicit noun make the referent clearer while retaining the source’s fear language.
