translation:
  language: en
  text: For Israel tore itself away from the rule of David’s royal house. They made Jeroboam son of Nebat their king. Jeroboam drove the people of Israel away from following Yahweh[a] and caused them to commit a great sin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may mean that Jeroboam drove Israel away or led Israel astray from following Yahweh.
    reason: lexical_alternative
