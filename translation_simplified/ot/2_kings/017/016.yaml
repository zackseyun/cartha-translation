translation:
  language: en
  text: They abandoned every commandment of Yahweh their God. They made two calf images cast from metal for themselves, and they made an Asherah.[a] They bowed down to all the heavenly bodies and served Baal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term Asherah may refer to the Canaanite goddess or to an object used in her worship, sometimes called an Asherah pole.
    reason: lexical_alternative
