  reasoning_layer_used: POB lexical decision on בְּנֵיהֶם וּבְנוֹתֵיהֶם
  rationale: Dropping the repeated possessive makes the phrase more natural without weakening its emphasis.
- pob_phrase: interpreted omens
  simplified_phrase: read omens
  preserved_meaning: They treated signs as sources of supernatural guidance.
  reasoning_layer_used: POB lexical decision on וַיְנַחֵשׁוּ
  rationale: “Read omens” is clear common English and remains distinct from general divination.
- pob_phrase: sold themselves to do what was evil in the sight of Yahweh
  simplified_phrase: sold themselves to do what Yahweh saw as evil
  preserved_meaning: They willingly surrendered themselves to conduct Yahweh judged evil.
  reasoning_layer_used: POB lexical decisions on וַיִּתְמַכְּרוּ and בְּעֵינֵי יְהוָה
  rationale: The wording preserves the vivid sale image while making the evaluative idiom immediately clear.
