translation:
  language: en
  text: They reported to the king of Assyria, “The peoples you exiled and settled in the cities of Samaria do not know how the god of that land[a] requires people to worship him.[b] So he has sent lions among them. Look—the lions are killing them because they do not know how to worship the god of that land.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This refers to Israel’s God, but lowercase “god” preserves the pagan speakers’ view of him as a local deity.
    reason: alternative_reading
  - marker: b
    text: The Hebrew term may mean “law,” “custom,” “requirement,” or “prescribed practice” for worship.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: So they spoke to the king of Assyria, saying
  simplified_phrase: They reported to the king of Assyria
  preserved_meaning: The king received their spoken report.
  reasoning_layer_used: source syntax and narrative context
  rationale: The shorter wording removes a repetitive speech formula without changing the action.
- pob_phrase: The nations that you have exiled and settled
  simplified_phrase: The peoples you exiled and settled
  preserved_meaning: Assyria forcibly relocated several ethnic populations.
  reasoning_layer_used: lexical decisions for הַגּוֹיִם and הִגְלִיתָ
  rationale: “Peoples” is clearer here while “exiled” retains the forced removal.
- pob_phrase: and behold, they are killing them
  simplified_phrase: Look—the lions are killing them
  preserved_meaning: The report vividly draws attention to the lions’ ongoing attacks.
  reasoning_layer_used: lexical decisions for וְהִנָּם and מְמִיתִים אוֹתָם
  rationale: Naming the lions removes pronoun confusion while “Look” keeps the vivid force.
