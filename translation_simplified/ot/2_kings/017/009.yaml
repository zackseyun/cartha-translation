translation:
  language: en
  text: The Israelites secretly did what was wrong against Yahweh their God.[a] They built their own “high places”—local worship sites—in every town throughout the land, from watchtower outposts to fortified cities.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Hebrew verb may instead mean that they covered up wrong matters concerning Yahweh their God.
    reason: lexical_alternative
  - marker: b
    text: “High places” were local worship sites, often used for worship that Yahweh had not authorized.
    reason: cultural_note
