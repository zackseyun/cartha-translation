translation:
  language: en
  text: To this day, they continue to follow their old religious customs. They do not fear Yahweh or live by their own statutes and ordinances. They also do not obey the law and the commandment that Yahweh commanded Jacob’s descendants to follow. Jacob was the man Yahweh named Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: To “fear Yahweh” includes revering him and remaining loyal to him.
    reason: lexical_alternative
