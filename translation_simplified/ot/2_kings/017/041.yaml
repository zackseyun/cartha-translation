translation:
  language: en
  text: So these nations feared Yahweh, but they also kept serving their carved images.[a] Their children and grandchildren did the same as their ancestors, and they continue to do so to this day.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, their idols; the Hebrew specifically describes images made by carving.
    reason: lexical_alternative
