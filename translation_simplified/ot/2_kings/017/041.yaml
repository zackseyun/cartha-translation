  simplified_phrase: but they also kept serving their carved images
  preserved_meaning: Their reverence for Yahweh coexisted with ongoing service to carved idols.
  reasoning_layer_used: lexical and theological decisions
  rationale: “But also kept” clearly expresses both the contrast and the habitual action.
- pob_phrase: Their children also, and their children's children
  simplified_phrase: Their children and grandchildren
  preserved_meaning: The same conduct continued through later generations.
  reasoning_layer_used: lexical decision
  rationale: “Grandchildren” is the natural modern equivalent of “children's children.”
- pob_phrase: as their fathers did, so they are doing
  simplified_phrase: did the same as their ancestors
  preserved_meaning: The descendants continued the practices of the generations before them.
  reasoning_layer_used: lexical decision
  rationale: The recast comparison removes awkward repetition while retaining the ancestral pattern.
