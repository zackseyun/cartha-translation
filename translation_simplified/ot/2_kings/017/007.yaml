translation:
  language: en
  text: This happened because the people of Israel had sinned against Yahweh their God. Yahweh had brought them out of Egypt, freeing them from the power of Pharaoh, king of Egypt. Yet they had feared other gods.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean that they revered or worshiped other gods.
    reason: lexical_alternative
