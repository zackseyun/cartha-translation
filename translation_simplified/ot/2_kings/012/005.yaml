translation:
  language: en
  text: 'Jehoash said to the priests, “All the money from sacred offerings brought into Yahweh’s temple: the payment from each man who is counted,[a] the payments based on the value assigned to persons,[b] and whatever money a man decides in his heart to bring to Yahweh’s temple—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This likely means the census payment required from counted men; compare Exodus 30:13–16.
    reason: lexical_alternative
  - marker: b
    text: This likely refers to payments connected with the valuation of persons; compare Leviticus 27:2–8.
    reason: cross_reference
simplification_decisions:
- pob_phrase: All the money of the holy things that is brought into the house of Yahweh
  simplified_phrase: All the money from sacred offerings brought into Yahweh’s temple
  preserved_meaning: This is dedicated money brought to Yahweh’s temple.
  reasoning_layer_used: POB lexical decisions for holy things and house of Yahweh
  rationale: “Sacred offerings” and “temple” make the setting clear without adding a command.
- pob_phrase: the money of the valuation of persons
  simplified_phrase: the payments based on the value assigned to persons
  preserved_meaning: The money comes from formal assessments involving persons.
  reasoning_layer_used: POB lexical rationale and Leviticus 27 cross-reference
  rationale: The legal phrase is clarified without claiming that every assessment arose from a vow.
- pob_phrase: all the money that comes up on a man’s heart to bring
  simplified_phrase: whatever money a man decides in his heart to bring
  preserved_meaning: A man inwardly purposes to give this money.
  reasoning_layer_used: POB heart-idiom rationale and cultural note
  rationale: The wording explains the intention while preserving the heart image.
interpretive_expansions:
- pob_phrase: the money of the valuation of persons
  rendering: the payments based on the value assigned to persons
  claim: The phrase concerns money calculated from formal valuations of people.
  evidence:
