translation:
  language: en
  text: His servants Jozabad son of Shimeath and Jehozabad son of Shomer[a] struck him down, and he died. They buried him with his ancestors in the City of David. Then his son Amaziah became king in his place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “his officials.” The Hebrew word can refer to servants or royal officials in this context.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And Jozabad son of Shimeath and Jehozabad son of Shomer, his servants
  simplified_phrase: His servants Jozabad son of Shimeath and Jehozabad son of Shomer
  preserved_meaning: The two named men served the ruler and carried out the attack.
  reasoning_layer_used: POB lexical decision for עֲבָדָיו
  rationale: Moving “his servants” first makes their role clear without changing its possible courtly sense.
- pob_phrase: with his fathers
  simplified_phrase: with his ancestors
  preserved_meaning: He was buried among his forebears in the royal burial place.
  reasoning_layer_used: POB lexical rationale for עִם אֲבֹתָיו
  rationale: “Ancestors” explains the Hebrew family-burial idiom in common English.
- pob_phrase: Amaziah his son reigned in his place
  simplified_phrase: his son Amaziah became king in his place
  preserved_meaning: Amaziah succeeded his father as king.
  reasoning_layer_used: POB lexical decisions for וַיִּמְלֹךְ and תַּחְתָּיו
  rationale: “Became king” states the succession formula more naturally for modern readers.
