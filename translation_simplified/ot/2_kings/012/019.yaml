translation:
  language: en
  text: Then King Jehoash of Judah gathered all the sacred gifts that his royal ancestors—Jehoshaphat, Jehoram, and Ahaziah, the kings of Judah—had dedicated, together with his own sacred gifts. He also took all the gold in the treasuries of Yahweh’s temple and the royal palace. He sent all these valuables to King Hazael of Aram, so Hazael withdrew from Jerusalem.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: all the holy things
  simplified_phrase: all the sacred gifts
  preserved_meaning: The items had been set apart for sacred use.
  reasoning_layer_used: POB lexical decisions for הַקֳּדָשִׁים and הִקְדִּישׁוּ
  rationale: “Sacred gifts” makes the nature of the dedicated valuables clearer without specifying their form.
- pob_phrase: his fathers, the kings of Judah
  simplified_phrase: his royal ancestors ... the kings of Judah
  preserved_meaning: The named former kings were Jehoash’s forefathers, not necessarily his immediate fathers.
  reasoning_layer_used: POB cultural footnote and lexical decision for אֲבֹתָיו
  rationale: “Royal ancestors” directly communicates the genealogical sense intended here.
- pob_phrase: the house of Yahweh and ... the king’s house
  simplified_phrase: Yahweh’s temple and the royal palace
  preserved_meaning: The gold came from the treasuries of the temple and palace.
  reasoning_layer_used: POB lexical alternatives for בֵּית יְהוָה and בֵּית הַמֶּלֶךְ
  rationale: The contextual referents replace an opaque literal use of “house.”
interpretive_expansions:
- pob_phrase: sent it to Hazael king of Aram
  rendering: sent all these valuables to King Hazael of Aram
  claim: The object sent was the full collection of sacred gifts and gold just listed.
  evidence:
  - The POB lexical rationale says the verb takes the collected valuables as its object.
  confidence: high
- pob_phrase: so he went up away from Jerusalem
  rendering: so Hazael withdrew from Jerusalem
  claim: Hazael ceased his advance against Jerusalem after receiving the valuables.
  evidence:
  - The POB footnote identifies “withdrew from Jerusalem” as the idiomatic sense.
  - The POB lexical rationale identifies Hazael as the understood subject.
  confidence: high
  alternatives_preserved:
  - went away from Jerusalem
