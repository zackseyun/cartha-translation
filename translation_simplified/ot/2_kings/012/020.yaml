simplification_decisions:
- pob_phrase: The rest of the acts of Joash, and all that he did
  simplified_phrase: Joash’s other deeds—everything else he did
  preserved_meaning: The record includes Joash’s remaining actions comprehensively.
  reasoning_layer_used: Lexical decisions for וְיֶתֶר, דִּבְרֵי, and וְכָל אֲשֶׁר עָשָׂה
  rationale: The recast removes the dense formula while keeping both remaining deeds and comprehensive scope.
- pob_phrase: are they not written
  simplified_phrase: are recorded
  preserved_meaning: The expected answer to the rhetorical question is that these deeds are documented.
  reasoning_layer_used: Lexical decision for הֲלוֹא and הֵם כְּתוּבִים
  rationale: A direct statement gives modern readers the positive sense expected by the Hebrew question.
- pob_phrase: the Book of the Chronicles of the Kings of Judah
  simplified_phrase: the royal chronicles of the kings of Judah
  preserved_meaning: The source is the historical record associated with Judah’s kings.
  reasoning_layer_used: Lexical decisions for סֵפֶר, דִּבְרֵי הַיָּמִים, and לְמַלְכֵי יְהוּדָה
  rationale: The shorter title clearly identifies an archival royal record without implying the biblical book of Chronicles.
