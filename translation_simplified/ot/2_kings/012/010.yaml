translation:
  language: en
  text: Then Jehoiada the priest took a chest, made a hole in its lid[a], and placed it beside the altar, on the right side as a man enters the house of Yahweh. The priests who guarded the temple threshold put into the chest all the silver[b] that was brought into the house of Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew says “door,” but in this context it likely means the chest’s lid or cover.
    reason: lexical_alternative
  - marker: b
    text: “Silver” may also mean money in general.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: bored a hole in its lid
  simplified_phrase: made a hole in its lid
  preserved_meaning: Jehoiada created an opening in the chest’s cover.
  reasoning_layer_used: POB lexical decisions for וַיִּקֹּב חֹר and בְּדַלְתּוֹ
  rationale: “Made” states the physical action more plainly than “bored.”
- pob_phrase: set it beside the altar, on the right as a man enters
  simplified_phrase: placed it beside the altar, on the right side as a man enters
  preserved_meaning: The chest’s location is described from the entering man’s perspective.
  reasoning_layer_used: POB lexical and gender-policy decisions
  rationale: “Right side” makes the spatial orientation explicit while retaining the generic masculine singular.
- pob_phrase: the priests who guarded the threshold
  simplified_phrase: the priests who guarded the temple threshold
  preserved_meaning: These priests guarded the entrance threshold of Yahweh’s house.
  reasoning_layer_used: POB lexical decision for שֹׁמְרֵי הַסַּף
  rationale: “Temple” identifies the threshold without removing the source image.
interpretive_expansions:
- pob_phrase: put there
  rendering: put into the chest
  claim: “There” refers to the chest as the place where the silver was deposited.
  evidence:
  - The chest had just been given a hole for receiving contributions.
  - The immediate context concerns collecting silver brought into Yahweh’s house.
  confidence: high
translation_notes:
  risk_flags:
