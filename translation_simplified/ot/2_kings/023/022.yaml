translation:
  language: en
  text: For no Passover like this one had been celebrated since the time of the judges who governed Israel, nor throughout the time of the kings of Israel and the kings of Judah.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: such a Passover had not been kept
  simplified_phrase: no Passover like this one had been celebrated
  preserved_meaning: The comparison concerns this Passover’s distinctive character, not a total absence of earlier Passovers.
  reasoning_layer_used: Lexical decision for כַּפֶּסַח הַזֶּה and theological decision on historical scope
  rationale: This wording makes the comparison clear without denying earlier Passover observance.
- pob_phrase: since the days of the judges who judged Israel
  simplified_phrase: since the time of the judges who governed Israel
  preserved_meaning: The comparison begins with Israel’s judges before the monarchy.
  reasoning_layer_used: Lexical decisions for מִימֵי הַשֹּׁפְטִים and אֲשֶׁר שָׁפְטוּ אֶת יִשְׂרָאֵל
  rationale: “Time” and “governed” clarify the period and the judges’ historical role.
- pob_phrase: nor in all the days of the kings of Israel and the kings of Judah
  simplified_phrase: nor throughout the time of the kings of Israel and the kings of Judah
  preserved_meaning: The negated comparison continues through both kingdoms’ monarchies.
  reasoning_layer_used: Lexical decision for וְכֹל יְמֵי מַלְכֵי יִשְׂרָאֵל וּמַלְכֵי יְהוּדָה and grounding review
  rationale: “Nor” preserves the cumulative negation while “throughout the time” reads naturally.
translation_notes:
  risk_flags:
  - risk: “No Passover” could be read as denying all earlier Passover observance.
    mitigation: “Like this one” explicitly limits the claim to a comparable Passover.
