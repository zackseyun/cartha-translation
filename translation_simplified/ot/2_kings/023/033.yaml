  text: 'Pharaoh Neco imprisoned him at Riblah, in the land of Hamath, to keep him from ruling in Jerusalem. Neco also forced Judah to pay tribute: silver weighing one hundred talents and gold weighing one talent.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
