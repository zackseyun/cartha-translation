  text: He brought in all the priests from the towns of Judah. From Geba to Beer-sheba, he defiled the local worship sites where the priests had burned incense. He also tore down the shrines at the city gates. These were at the entrance to the gate of Joshua, the city governor, on a person's left at the city gate.[a]
  philosophy: optimal-equivalence
  footnotes:
