translation:
  language: en
  text: Then the king went up to the temple of Yahweh.[a] All the men of Judah went with him, along with everyone who lived in Jerusalem, the priests, the prophets, and all the people, from the least to the greatest. The king read aloud to them every word of the Book of the Covenant that had been found in Yahweh’s temple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “the house of Yahweh.”
    reason: lexical_alternative
