translation:
  language: en
  text: Jehoiakim gave the silver and gold to Pharaoh. He taxed the land to provide the silver Pharaoh had ordered. He forced the people of the land to pay silver and gold, each person according to the amount assessed for him, to give them to Pharaoh Neco.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neco is also spelled Necho in many English Bibles.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: to give the silver according to Pharaoh’s command
  simplified_phrase: to provide the silver Pharaoh had ordered
  preserved_meaning: The tax supplied the silver demanded by Pharaoh.
  reasoning_layer_used: POB lexical decision for עַל־פִּי פַרְעֹה
  rationale: The rewrite states Pharaoh’s authoritative demand in direct modern English.
- pob_phrase: He exacted the silver and the gold from the people of the land
  simplified_phrase: He forced the people of the land to pay silver and gold
  preserved_meaning: Jehoiakim compelled the people to provide the precious metals.
  reasoning_layer_used: POB lexical decision for נָגַשׂ
  rationale: “Forced ... to pay” clearly preserves the coercive force of “exacted.”
- pob_phrase: each according to his valuation
  simplified_phrase: each person according to the amount assessed for him
  preserved_meaning: The required payment was assessed separately for each person.
  reasoning_layer_used: POB lexical decision for אִישׁ כְּעֶרְכּוֹ
  rationale: The wording explains the individual assessment without assuming it was based on personal means.
translation_notes:
  risk_flags:
  - risk: “Forced ... to pay” states the coercive nuance more directly than “exacted.”
    mitigation: The POB lexical rationale says the Hebrew verb carries the sense of pressing or exacting payment.
  - risk: “Amount assessed for him” may sound more administratively precise than the Hebrew specifies.
    mitigation: The wording preserves individual assessment while avoiding the less certain phrase “according to his means.”
