  text: He took the Asherah[a] out of Yahweh’s temple and carried it beyond Jerusalem to the Kidron Valley. There he burned it, crushed it into dust, and threw the dust onto the graves of ordinary people.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Asherah was an object used in worship of the Canaanite goddess Asherah; its exact form is uncertain.
    reason: lexical_alternative
