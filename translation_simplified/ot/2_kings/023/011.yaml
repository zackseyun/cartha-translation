  text: He removed the horses that the kings of Judah had dedicated to the sun from the entrance to Yahweh’s temple, near the room of Nethan-melech, the court official,[a] in an outer part of the temple grounds.[b] He also set the chariots of the sun on fire.
  philosophy: optimal-equivalence
  footnotes:
