translation:
  language: en
  text: The king made the high-place shrines in front of Jerusalem unfit for worship. They stood on the right side of the Mount of Destruction.[a] Solomon king of Israel had built them for Ashtoreth, the abomination of the Sidonians; Chemosh, the abomination of Moab; and Milcom,[b] the abomination of the Ammonites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Right side” may mean south in Hebrew directional language. The Mount of Destruction may be the hill later known as the Mount of Olives.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew reads “Milcom”; this deity is sometimes associated with Molech.
    reason: alternative_reading
