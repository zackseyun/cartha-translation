translation:
  language: en
  text: Then the king ordered Hilkiah the high priest, the lower-ranking priests, and the temple doorkeepers to remove from Yahweh’s temple every object made for Baal, Asherah,[a] and all the host of heaven. He burned these objects in the fields of the Kidron Valley outside Jerusalem, then carried their dust to Bethel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Asherah pole.” The Hebrew may refer either to the goddess Asherah or to a sacred object associated with her.
    reason: lexical_alternative
