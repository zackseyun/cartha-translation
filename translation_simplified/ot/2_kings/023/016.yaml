translation:
  language: en
  text: Then Josiah turned and saw the tombs on the mountain.[a] He had the bones removed from the tombs and burned them on the altar, defiling it. This happened just as Yahweh had said through the man of God, who had publicly proclaimed that these things would happen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “graves”; the Hebrew word can refer to burial places generally.
    reason: lexical_alternative
