  simplified_phrase: the shrine buildings at the high places
  preserved_meaning: This keeps both the concrete buildings and the established term for illicit worship sites.
  reasoning_layer_used: POB lexical decision for בָּתֵּי הַבָּמוֹת
  rationale: “Shrine buildings” explains what the otherwise opaque “houses” were.
- pob_phrase: which the kings of Israel had made to provoke to anger
  simplified_phrase: The kings of Israel had built them to provoke anger.
  preserved_meaning: The kings established these worship sites for the purpose or result of provoking anger, while its object remains implicit.
  reasoning_layer_used: POB lexical and theological decisions for לְהַכְעִיס
  rationale: The infinitive “to provoke” preserves the source construction’s purpose-oriented force.
- pob_phrase: he did to them according to all the deeds that he had done at Bethel
  simplified_phrase: Josiah treated them in the same comprehensive way he had treated the site at Bethel.
  preserved_meaning: Josiah dealt with all these sites as fully as he had dealt with the site at Bethel.
  reasoning_layer_used: POB lexical decisions for וַיַּעַשׂ לָהֶם and כְּכָל הַמַּעֲשִׂים
