translation:
  language: en
  text: Pharaoh Neco made Eliakim, Josiah’s son, king in place of his father. He changed Eliakim’s name to Jehoiakim. But Pharaoh Neco took Jehoahaz. Afterward, Jehoahaz came to Egypt[a] and died there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “came to Egypt”; it may also be expressed as “went to Egypt.”
    reason: lexical_alternative
