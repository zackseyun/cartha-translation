  preserved_meaning: Pharaoh installed Josiah’s son Eliakim as Josiah’s successor.
  reasoning_layer_used: POB lexical decisions for וַיַּמְלֵךְ, תַּחַת, and אָבִיו
  rationale: The reordered wording removes repeated naming while keeping the causative appointment and family succession clear.
- pob_phrase: and changed his name to Jehoiakim
