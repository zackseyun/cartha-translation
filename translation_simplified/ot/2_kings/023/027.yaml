translation:
  language: en
  text: Yahweh said, “I will remove Judah from my presence too, just as I removed Israel. I will reject[b] this city—Jerusalem, which I chose—and the house[a] about which I said, ‘My name will be there.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “house” is the temple in Jerusalem.
    reason: lexical_alternative
  - marker: b
    text: Or “I have rejected.” The Hebrew can describe a completed action, but here it is understood as part of the coming judgment.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: remove Judah from before me
  simplified_phrase: remove Judah from my presence
  preserved_meaning: Judah will be sent away from Yahweh in relational and covenantal judgment.
  reasoning_layer_used: POB lexical decision for מֵעַל פָּנַי
  rationale: “From my presence” makes the Hebrew idiom immediately understandable.
- pob_phrase: I will also remove Judah ... just as I removed Israel
  simplified_phrase: I will remove Judah ... too, just as I removed Israel
  preserved_meaning: Judah will share the judgment that had already fallen on Israel.
  reasoning_layer_used: POB lexical decisions for גַּם and כַּאֲשֶׁר
  rationale: Moving “too” later gives natural English while retaining the explicit parallel.
- pob_phrase: the house of which I said
  simplified_phrase: the house about which I said
  preserved_meaning: Yahweh’s declaration concerned the Jerusalem temple, where his name would be.
  reasoning_layer_used: POB theological decision for הַבַּיִת and grounding review
  rationale: “About which” clearly identifies the house as the subject of Yahweh’s declaration.
translation_notes:
  risk_flags:
  - risk: Modern readers may not recognize “the house” as the Jerusalem temple.
    mitigation: Footnote a identifies the temple while preserving the source image.
  - risk: The Hebrew form behind “I will reject” can also describe a completed action.
    mitigation: Footnote b preserves that alternate reading while the text follows the future judgment context.
