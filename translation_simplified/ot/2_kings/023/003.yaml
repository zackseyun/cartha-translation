translation:
  language: en
  text: Then the king stood beside the pillar and made the covenant before Yahweh. He committed himself to follow Yahweh, to keep Yahweh’s commands, covenant requirements, and laws with all his heart and soul, and to carry out the words of this covenant written in this book.[a] All the people entered into the covenant.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can also mean “scroll” or “document.”
    reason: cultural_note
  - marker: b
    text: Literally, “stood in the covenant,” expressing their participation and commitment.
    reason: lexical_alternative
simplification_decisions:
