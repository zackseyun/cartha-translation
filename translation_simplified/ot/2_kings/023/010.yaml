translation:
  language: en
  text: He made Topheth, in the Valley of Ben-hinnom, ritually unclean so that it could no longer be used for this practice. He did this to prevent anyone from making a son or daughter pass through the fire to Molech.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Pass through the fire” refers to a ritual offering of children to Molech, probably as child sacrifice.
    reason: cultural_note
