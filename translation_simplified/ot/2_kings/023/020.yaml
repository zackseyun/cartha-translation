  preserved_meaning: These were priests attached to illicit local worship sites.
  reasoning_layer_used: POB lexical and theological rationale
  rationale: “Local shrines” explains the unfamiliar term “high places,” while “unauthorized” preserves their illicit character in Kings.
- pob_phrase: who were there on the altars
  simplified_phrase: On the altars there ... all the priests
  preserved_meaning: The priests were slaughtered on the altars at those sites.
  reasoning_layer_used: Source syntax and POB lexical decisions
  rationale: Reordering the location phrase makes the action easier to follow without changing where the killing occurred.
- pob_phrase: he burned human bones on them
  simplified_phrase: He burned human bones on those altars
  preserved_meaning: Human bones were burned on the same altars.
  reasoning_layer_used: POB pronoun rationale
  rationale: Naming the altars again removes any uncertainty about what “them” refers to.
