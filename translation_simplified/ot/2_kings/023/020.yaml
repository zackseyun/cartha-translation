translation:
  language: en
  text: On the altars there, he slaughtered[a] all the priests of the unauthorized local shrines. He burned human bones on those altars. Then he returned to Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “sacrificed.” The Hebrew verb can refer to sacrificial slaughter, but here it most likely describes violent killing during the destruction of these worship sites.
    reason: lexical_alternative
