translation:
  language: en
  text: During Josiah’s reign, Pharaoh Neco[a], king of Egypt, marched against the king of Assyria to the Euphrates River. King Josiah went to meet him, and he killed him at Megiddo when he saw him.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew Neco; traditionally spelled Necho.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew pronouns are ambiguous. The sentence may mean, “Pharaoh Neco killed Josiah at Megiddo when Josiah went to meet him.”
    reason: alternative_reading
  - marker: c
    text: See also 2 Chronicles 35:20–24 for the parallel account of Josiah’s death.
    reason: cross_reference
