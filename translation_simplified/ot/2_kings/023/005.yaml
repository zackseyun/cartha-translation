translation:
  language: en
  text: He put an end to the idolatrous priests whom the kings of Judah had appointed to burn incense at the local worship sites called high places, in the cities of Judah and around Jerusalem. He also put an end to those who burned incense to Baal, the sun, the moon, the constellations,[a] and the whole array of heavenly bodies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the signs of the zodiac.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: he put an end to the idolatrous priests whom the kings of Judah had appointed to burn incense at the high places
  simplified_phrase: He put an end to the idolatrous priests whom the kings of Judah had appointed to burn incense at the local worship sites called high places
  preserved_meaning: Josiah decisively ended their appointed idolatrous service without specifying how.
  reasoning_layer_used: Lexical decisions for וְהִשְׁבִּית, הַכְּמָרִים, נָתְנוּ, קטר, and בָּמוֹת.
  rationale: The wording preserves the causative force while explaining the unfamiliar term “high places.”
- pob_phrase: and also those who burned incense
  simplified_phrase: He also put an end to those who burned incense
  preserved_meaning: Josiah's decisive action also applied to the second group of incense burners.
  reasoning_layer_used: Syntax and lexical decisions for וְהִשְׁבִּית and וְאֶת הַמְקַטְּרִים.
  rationale: A new sentence makes the coordination clear and carries forward the full force of the main verb.
- pob_phrase: all the host of the heavens
  simplified_phrase: the whole array of heavenly bodies
  preserved_meaning: The phrase collectively describes celestial bodies treated as objects of worship.
  reasoning_layer_used: Lexical rationale and POB footnote c for צְבָא הַשָּׁמָיִם.
  rationale: “Array” preserves the gathered-host image while “heavenly bodies” identifies its referent.
