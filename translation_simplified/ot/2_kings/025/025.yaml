  text: In the seventh month, Ishmael son of Nethaniah and grandson of Elishama came with ten men. Ishmael was a descendant of the royal line. They struck down Gedaliah, and he died. They also struck down the Judeans and the Chaldeans[a] who were with him at Mizpah.
