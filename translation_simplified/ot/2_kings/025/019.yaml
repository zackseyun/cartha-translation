translation:
  language: en
  text: From the city he took one official[a] who was in charge of the soldiers; five men who had direct access to the king[b] and were found there; the secretary to the army commander, who called up the people of the land for military service; and sixty men from the people of the land who were found in the city.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “eunuch”; the Hebrew word may mean a literal eunuch or an official.
    reason: lexical_alternative
  - marker: b
    text: Literally “men who saw the king’s face,” a Hebrew expression for people who had direct access to the king.
    reason: cultural_note
simplification_decisions:
- pob_phrase: appointed over the men of war
  simplified_phrase: in charge of the soldiers
  preserved_meaning: The official had authority over the fighting men.
  reasoning_layer_used: POB lexical decision for פָקִיד עַל אַנְשֵׁי הַמִּלְחָמָה
  rationale: This states the same military responsibility in common English.
- pob_phrase: five men from those who saw the king’s face
  simplified_phrase: five men who had direct access to the king
  preserved_meaning: The men belonged to the group permitted into the king’s presence.
  reasoning_layer_used: POB lexical rationale and cultural footnote
  rationale: This explains the idiom without narrowing the men to attendants rather than other courtiers.
- pob_phrase: the scribe, the commander of the army, who mustered the people of the land
  simplified_phrase: the secretary to the army commander, who called up the people of the land for military service
  preserved_meaning: The military secretary administered the calling up of people for army service.
  reasoning_layer_used: Source syntax, POB lexical alternatives, and grounding review
  rationale: This avoids incorrectly identifying the secretary as the army commander and explains his task.
interpretive_expansions:
- pob_phrase: those who saw the king’s face
  rendering: men who had direct access to the king
  claim: The expression describes men admitted into the king’s presence.
  evidence:
  - The POB cultural note defines the idiom as direct access to the king.
  - The POB lexical rationale allows attendants or courtiers.
  confidence: high
  alternatives_preserved:
  - They may have been attendants or other courtiers.
  - The literal image remains in footnote b.
- pob_phrase: mustered the people of the land
  rendering: called up the people of the land for military service
  claim: The secretary organized people for army service.
  evidence:
  - The POB lexical rationale gives the verb a military-administrative sense.
  - The surrounding title places the duty in an army context.
  confidence: high
  alternatives_preserved:
  - The wording does not decide whether service was compulsory.
  - “Enrolled” remains a possible nuance.
translation_notes:
  risk_flags:
  - risk: “Official” may conceal the possibility that the man was a literal eunuch.
    mitigation: Footnote a preserves that lexical alternative without asserting his physical status.
  - risk: The compressed Hebrew title permits debate over the scribe’s exact relationship to the commander.
    mitigation: The rendering follows the reviewed source syntax while preserving his distinct military-administrative role.
