translation:
  language: en
  text: 'On the twenty-seventh day of the twelfth month, in the thirty-seventh year since King Jehoiachin of Judah was exiled, Evil-merodach king of Babylon lifted Jehoiachin’s head: he released him from prison and raised his status. This happened in the year of Evil-merodach’s reign.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may mean “in the first year of his reign.”
    reason: alternative_reading
