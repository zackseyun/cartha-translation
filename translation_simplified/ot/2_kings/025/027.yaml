- pob_phrase: lifted up the head of Jehoiachin king of Judah out of the prison
  simplified_phrase: 'lifted Jehoiachin’s head: he released him from prison and raised his status'
  preserved_meaning: The royal act freed Jehoiachin and elevated his standing.
  reasoning_layer_used: POB lexical rationale and footnote a for נָשָׂא ... אֶת רֹאשׁ
