translation:
  language: en
  text: Then the city’s defenses were broken through. That night, all the fighting men fled through the gate between the two walls beside the king’s garden. Although the Chaldeans surrounded the city on every side, the king headed toward the Arabah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Arabah is the Jordan rift region extending south from the Jordan Valley; it is traditionally called “the plain.”
    reason: cultural_note
