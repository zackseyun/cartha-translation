translation:
  language: en
  text: They slaughtered Zedekiah’s sons before his eyes. Then he put out Zedekiah’s eyes[a], put him in bronze shackles, and brought him to Babylon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “blinded Zedekiah.” The Hebrew says that he made Zedekiah blind and likely refers to physically putting out his eyes.
    reason: lexical_alternative
