translation:
  language: en
  text: When all the military commanders and their men heard that the king of Babylon had put Gedaliah in charge, they went to him at Mizpah. The commanders were Ishmael son of Nethaniah, Johanan son of Kareah, Seraiah son of Tanhumeth from Netophah, and Jaazaniah son of a man from Maacah; their men went with them.
