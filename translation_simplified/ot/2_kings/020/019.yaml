translation:
  language: en
  text: Then Hezekiah said to Isaiah, “The word of Yahweh that you have spoken is good.” He said this because he thought, “There will be peace and stability[a] during my lifetime, won’t there?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “peace and truth.” The Hebrew word can also mean “truth” or “faithfulness”; here it may refer to dependable stability.
    reason: lexical_alternative
