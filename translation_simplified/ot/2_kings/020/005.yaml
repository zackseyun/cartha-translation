translation:
  language: en
  text: 'Go back to Hezekiah, the leader of my people, and tell him, “This is what Yahweh, the God of your ancestor David, says: I have heard your prayer and seen your tears. Look, I am healing you.[a] On the third day, you will go up to the house of Yahweh—the temple.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “I will heal you.” The Hebrew wording presents the healing as imminent.
    reason: lexical_alternative
