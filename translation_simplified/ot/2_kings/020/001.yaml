translation:
  language: en
  text: 'At that time, Hezekiah became very sick and was near death. The prophet Isaiah, son of Amoz, came to him and said, “This is what Yahweh says: Make the necessary arrangements for your household, because you are about to die.[a] You will not live.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “you are dying” or “you are dead”; the Hebrew announces certain, imminent death.
    reason: lexical_alternative
