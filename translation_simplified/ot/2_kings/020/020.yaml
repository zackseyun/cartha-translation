translation:
  language: en
  text: The rest of Hezekiah’s deeds and all his mighty achievements—including how he built the pool[a] and the water channel and brought water into the city—are they not recorded in the Book of the Chronicles of the Kings of Judah?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “reservoir”; the Hebrew term can mean a constructed basin for holding water.
    reason: lexical_alternative
  - marker: b
    text: This was a royal record concerning Judah’s kings; compare 2 Chronicles 32:30 for Hezekiah’s waterworks.
    reason: cross_reference
