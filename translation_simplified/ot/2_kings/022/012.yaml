translation:
  language: en
  text: The king then gave this command to Hilkiah the priest, Ahikam son of Shaphan, Achbor son of Micaiah, Shaphan the scribe,[a] and Asaiah, who served the king:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word “scribe” may also mean a royal secretary.
    reason: lexical_alternative
  - marker: b
    text: Asaiah may have been a royal official; the Hebrew calls him the king’s “servant.”
    reason: lexical_alternative
