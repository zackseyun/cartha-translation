translation:
  language: en
  text: Go up to Hilkiah the high priest. Have him total the silver brought into Yahweh’s temple. This is the silver the doorkeepers[a] have collected from the people.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “keepers of the threshold.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and let him total the silver that has been brought
  simplified_phrase: Have him total the silver brought
  preserved_meaning: Hilkiah is to determine the total amount of the collected silver.
  reasoning_layer_used: POB lexical decision for וְיַתֵּם and הַמּוּבָא
  rationale: The shorter command keeps the administrative sense of totaling funds.
- pob_phrase: the house of Yahweh
  simplified_phrase: Yahweh’s temple
  preserved_meaning: The silver was brought into the sanctuary belonging to Yahweh.
  reasoning_layer_used: POB lexical alternative for בֵּית יְהוָה and theological decision for יהוה
  rationale: “Temple” makes the location immediately clear while retaining Yahweh’s personal name.
- pob_phrase: the keepers of the threshold
  simplified_phrase: the doorkeepers[a]
  preserved_meaning: The temple officials stationed at the entrances collected the silver.
  reasoning_layer_used: POB lexical decision and footnote for שֹׁמְרֵי הַסַּף
  rationale: The natural job title replaces the opaque literal phrase, which remains in the footnote.
