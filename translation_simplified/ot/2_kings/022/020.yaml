translation:
  language: en
  text: '“Therefore, I tell you: I will gather you to your ancestors, and you will be buried in your graves in peace.[a] Your own eyes will not see the disaster I am bringing on this place.” Then they returned and reported the message to the king.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “in peace.” This may mean that Josiah would die before the coming judgment, not necessarily that his death itself would be peaceful.
    reason: lexical_alternative
