translation:
  language: en
  text: 'Then Shaphan the scribe went to the king and gave him this report: “Your servants have emptied out[a] the silver found in the temple and handed it over to the workers appointed to oversee Yahweh’s temple.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “poured out.” This describes emptying the silver, perhaps for counting or handing it over.
    reason: lexical_alternative
