translation:
  language: en
  text: 'You heard what I said against this place and the people living here: they would become a desolation and a curse.[a] Because your heart was tender, you humbled yourself before Yahweh, tore your clothes, and wept before me. Therefore, I also have heard you, declares Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “an object of horror or astonishment and a curse.” The Hebrew word can refer to desolation or to the horrified astonishment caused by judgment.
    reason: lexical_alternative
