translation:
  language: en
  text: Go and consult Yahweh for me, for the people, and for all Judah about the words in this book that was found. Yahweh’s wrath burns fiercely against us because our fathers[a] did not listen to the words of this book so as to do everything written there that applies to us.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “our ancestors”; the Hebrew specifically says “our fathers,” referring to the nation’s forefathers.
    reason: lexical_alternative
