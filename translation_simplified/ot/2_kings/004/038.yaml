- pob_phrase: Put on the large pot and boil stew for the sons of the prophets
  simplified_phrase: Put the large pot on the fire and boil some stew for them
  preserved_meaning: The servant must set out the cooking pot and prepare boiled stew for the prophetic community.
  reasoning_layer_used: Lexical decisions for שְׁפֹת, הַסִּיר הַגְּדוֹלָה, וּבַשֵּׁל, and נָזִיד
  rationale: The wording states the ordinary cooking action directly and avoids repeating the group's long name.
