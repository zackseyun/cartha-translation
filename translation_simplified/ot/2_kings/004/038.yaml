  reasoning_layer_used: Lexical decision for the circumstantial famine clause
  rationale: Combining the clauses makes the setting immediately clear without changing their relationship.
- pob_phrase: the sons of the prophets
  simplified_phrase: the sons of the prophets—members of the prophetic community
  preserved_meaning: The Hebrew familial image remains while its institutional sense is explained.
  reasoning_layer_used: Lexical and theological decisions on בְנֵי הַנְּבִיאִים
