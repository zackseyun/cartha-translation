translation:
  language: en
  text: Then he said, “At this same time next year,[a] you will be holding a son in your arms.” But she said, “No, my lord, man of God! Do not deceive your servant.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “about this time of life,” a Hebrew expression meaning this same time next year.
    reason: lexical_alternative
