  preserved_meaning: The promise points to the corresponding fixed season in the following year.
  reasoning_layer_used: Lexical decision for לַמּוֹעֵד הַזֶּה and כָּעֵת חַיָּה
  rationale: “This same time next year” states the Hebrew idiom naturally while the footnote preserves its literal image.
- pob_phrase: you will be embracing a son
  simplified_phrase: you will be holding a son in your arms
  preserved_meaning: She will physically hold the promised son.
  reasoning_layer_used: Lexical decisions for חֹבֶקֶת and בֵּן
  rationale: The concrete wording makes the image immediately clear while retaining “son.”
- pob_phrase: But she said, “No, my lord, man of God; do not deceive your servant.”
  simplified_phrase: But she said, “No, my lord, man of God! Do not deceive your servant.”
  preserved_meaning: Her emotional refusal, respect for Elisha, and fear of deception remain distinct.
