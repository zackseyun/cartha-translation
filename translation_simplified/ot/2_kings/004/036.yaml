translation:
  language: en
  text: Then Elisha called Gehazi and said, “Call the woman from Shunem.” Gehazi called her, and she came to Elisha. He said, “Pick up your son.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: this Shunammite woman
  simplified_phrase: the woman from Shunem
  preserved_meaning: She is identified as the woman who came from Shunem.
  reasoning_layer_used: The lexical decision identifies the feminine gentilic as referring to a woman from Shunem.
  rationale: The modern place-based phrase is easier to understand than the uncommon term “Shunammite.”
- pob_phrase: he called Gehazi / she came to him / Then he said
  simplified_phrase: Elisha called Gehazi / she came to Elisha / He said
  preserved_meaning: Elisha gives the instructions, while Gehazi calls the woman.
  reasoning_layer_used: The immediate narrative context identifies the pronoun referents.
  rationale: Using Elisha’s name removes potentially confusing shifts between male pronouns.
- pob_phrase: Take up your son
  simplified_phrase: Pick up your son
  preserved_meaning: Elisha tells the mother to lift and take her restored son.
  reasoning_layer_used: The lexical rationale explains that the imperative means picking up the child in this context.
  rationale: “Pick up” expresses the physical action more naturally in modern English.
translation_notes:
  risk_flags:
