translation:
  language: en
  text: Then he went up and lay on top of the boy. He placed his mouth against the boy’s mouth, his eyes over the boy’s eyes, and his palms against the boy’s palms. He stretched himself out over the boy,[a] and the boy’s flesh became warm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “he bent over the boy.” The rare Hebrew verb may mean bending or stretching oneself over someone.
    reason: lexical_alternative
