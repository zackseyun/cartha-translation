- pob_phrase: lay on the boy
  simplified_phrase: lay on top of the boy
  preserved_meaning: Elisha physically lay over the boy.
  reasoning_layer_used: Lexical decision for וַיִּשְׁכַּב עַל הַיֶּלֶד
  rationale: “On top of” makes the physical position immediately clear.
- pob_phrase: put his mouth on his mouth, his eyes on his eyes, and his palms on his palms
  simplified_phrase: placed his mouth against the boy’s mouth, his eyes over the boy’s eyes, and his palms against the boy’s palms
  preserved_meaning: Each of Elisha’s body parts corresponded closely to the boy’s.
  reasoning_layer_used: Lexical decisions for mouth, eyes, and palms
  rationale: Naming the boy removes pronoun confusion while retaining the Hebrew symmetry and bodily precision.
- pob_phrase: he stretched himself over him
  simplified_phrase: He stretched himself out over the boy
  preserved_meaning: Elisha extended or bent his body over the child.
  reasoning_layer_used: Lexical decision for the rare verb וַיִּגְהַר
  rationale: The added “out” and repeated noun make the posture and its object clearer.
