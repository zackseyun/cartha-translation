translation:
  language: en
  text: Naaman and everyone traveling with him returned to the man of God. When they arrived, Naaman stood before him and said, “Now I know that there is no God anywhere on earth except in Israel. Please accept a gift[a] from me, your servant.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “a blessing.” Here the Hebrew word means a gift or present.
    reason: lexical_alternative
