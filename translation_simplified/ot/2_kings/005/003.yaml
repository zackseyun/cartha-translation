translation:
  language: en
  text: She said to the woman she served, “If only my lord were with the prophet in Samaria! Then the prophet would cure[a] him of his leprosy.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb literally means “gather in” and here describes bringing him back from his disease.
    reason: lexical_alternative
  - marker: b
    text: The traditional term “leprosy” may refer more broadly to a serious skin disease.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: her mistress
  simplified_phrase: the woman she served
  preserved_meaning: She spoke to the female superior in whose household she served.
  reasoning_layer_used: POB lexical decision for גְּבִרְתָּהּ
  rationale: This avoids a misleading modern sense of “mistress” while preserving the household relationship.
- pob_phrase: were before the prophet
  simplified_phrase: were with the prophet
  preserved_meaning: She wished that Naaman could be in the prophet’s presence.
  reasoning_layer_used: POB lexical decision for לִפְנֵי
  rationale: “Were with” expresses the presence idiom in ordinary English.
- pob_phrase: would gather him in from his leprosy
  simplified_phrase: would cure him of his leprosy
  preserved_meaning: The prophet would bring Naaman out of his diseased condition and restore him.
  reasoning_layer_used: POB lexical decision for יֶאֱסֹף and its idiomatic alternative
  rationale: The main text states the idiomatic sense clearly, while the footnote preserves the Hebrew gathering image.
translation_notes:
  risk_flags:
  - risk: Rendering יֶאֱסֹף as “cure” could hide the source-language image of gathering in.
    mitigation: Footnote a retains the literal image and connects it to recovery from disease.
  - risk: Readers may assume biblical “leprosy” means only modern Hansen’s disease.
    mitigation: Footnote b preserves the broader possible sense of a serious skin disease.
