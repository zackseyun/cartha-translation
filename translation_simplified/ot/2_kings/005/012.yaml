translation:
  language: en
  text: “Aren’t Abanah[a] and Pharpar, the rivers of Damascus, better than all the waters in Israel? Couldn’t I wash in those rivers and become clean[b]?” Then Naaman turned and left in a rage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Abanah is also traditionally called “Amana.”
    reason: alternative_reading
  - marker: b
    text: Or “be purified”; the Hebrew can refer both to physical cleansing and to a broader state of cleanness.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Could I not wash in them and be clean?
  simplified_phrase: Couldn’t I wash in those rivers and become clean?
  preserved_meaning: Naaman argues that washing in Damascus’s rivers should cleanse him just as well.
  reasoning_layer_used: Lexical decisions for אֶרְחַץ, בָּהֶם, and וְטָהָרְתִּי
  rationale: The contraction and explicit noun make the rhetorical question easier to follow.
- pob_phrase: So he turned and went away in a rage.
  simplified_phrase: Then Naaman turned and left in a rage.
  preserved_meaning: Naaman departs while intensely angry.
  reasoning_layer_used: Lexical decisions for וַיִּפֶן, וַיֵּלֶךְ, and בְּחֵמָה
  rationale: Naming Naaman and using “left” clarify the action without weakening his rage.
