  text: Naaman commanded the army of the king of Aram.[a] His king considered him an important man and held him in high honor, because Yahweh had given Aram victory through him. Naaman was a mighty warrior, but he suffered from a serious skin disease.[b]
  philosophy: optimal-equivalence
  footnotes:
