translation:
  language: en
  text: So Naaman went down to the Jordan and dipped himself in the river seven times,[a] just as the man of God had instructed him. His flesh was restored and became like the flesh of a little boy, and he was cleansed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “immersed himself.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: dipped himself in the Jordan seven times
  simplified_phrase: dipped himself in the river seven times
  preserved_meaning: Naaman repeatedly dipped or immersed himself in the Jordan River.
  reasoning_layer_used: Lexical decision for בַּיַּרְדֵּן and immediate context
  rationale: Adding “the river” makes the place and action immediately clear.
- pob_phrase: according to the word of the man of God
  simplified_phrase: just as the man of God had instructed him
  preserved_meaning: Naaman acted in obedience to the prophet’s spoken direction.
  reasoning_layer_used: Lexical decision for כִּדְבַר
  rationale: “Had instructed him” clearly expresses the directive sense of the spoken word.
- pob_phrase: his flesh was restored like the flesh of a little boy
  simplified_phrase: His flesh was restored and became like the flesh of a little boy
  preserved_meaning: Naaman’s damaged flesh was physically restored to a childlike condition.
  reasoning_layer_used: Lexical decisions for וַיָּשָׁב בְּשָׂרוֹ and כִבְשַׂר נַעַר קָטֹן
  rationale: The added verb makes the restoration and comparison easier to follow without weakening the bodily image.
