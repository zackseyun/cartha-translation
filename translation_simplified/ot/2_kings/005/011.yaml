  text: But Naaman became angry and left. He said, “I told myself, ‘He will surely come out to me, stand there, call on the name of Yahweh his God, and wave his hand over the affected area to heal the person with the leprous skin disease.’”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: became angry and went away
  simplified_phrase: became angry and left
  preserved_meaning: Naaman departed in anger.
  reasoning_layer_used: Lexical decision for וַיֵּלַךְ and immediate context
  rationale: “Left” states his dismissive departure more directly.
- pob_phrase: Look, I said to myself, ‘Surely he will come out to me
  simplified_phrase: I told myself, ‘He will surely come out to me
  preserved_meaning: Naaman emphatically describes what he expected Elisha to do.
  reasoning_layer_used: Lexical decisions for הִנֵּה, אָמַרְתִּי אֵלַי, and יֵצֵא יָצוֹא
  rationale: The recast keeps his inner speech and certainty in natural English.
- pob_phrase: wave his hand over the place and heal the leprous person
  simplified_phrase: wave his hand over the affected area to heal the person with the leprous skin disease
  preserved_meaning: Naaman expected a dramatic gesture over the afflicted area to bring healing.
  reasoning_layer_used: Lexical decisions for וְהֵנִיף יָדוֹ, אֶל הַמָּקוֹם, and הַמְּצֹרָע
  rationale: “Affected area” clarifies the place while preserving the hand-waving image and cautious disease term.
