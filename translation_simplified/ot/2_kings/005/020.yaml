translation:
  language: en
  text: But Gehazi, the servant of Elisha the man of God, said, “Look! My master spared Naaman, that Aramean, by accepting nothing he brought. As surely as Yahweh lives, I will run after him and get something from him.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: has spared Naaman this Aramean by not taking from his hand what he brought
  simplified_phrase: spared Naaman, that Aramean, by accepting nothing he brought
  preserved_meaning: Elisha spared Naaman from payment by declining everything he offered.
  reasoning_layer_used: POB lexical decisions for חָשַׂךְ and מִקַּחַת מִיָּדוֹ
  rationale: The rewrite removes the opaque hand idiom while preserving refusal as the means of sparing Naaman.
- pob_phrase: As Yahweh lives
  simplified_phrase: As surely as Yahweh lives
  preserved_meaning: Gehazi swears a solemn oath by the living God.
  reasoning_layer_used: POB theological decision and cultural-note rationale for חַי יְהוָה
  rationale: “Surely” helps modern readers recognize the force of the oath formula.
- pob_phrase: take something from him
  simplified_phrase: get something from him
  preserved_meaning: Gehazi intends to obtain part of Naaman’s goods for himself.
  reasoning_layer_used: POB lexical decision for וְלָקַחְתִּי מֵאִתּוֹ מְאוּמָה
  rationale: “Get something” is natural modern English and is a documented lexical alternative.
translation_notes:
  risk_flags:
  - risk: Replacing “from his hand” removes the Hebrew receiving image.
    mitigation: “Accepting nothing he brought” states the idiom’s practical meaning while retaining Naaman’s offered goods.
