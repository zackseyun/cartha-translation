translation:
  language: en
  text: When the king of Israel read the letter, he tore his clothes. He said, “Am I God, able to put people to death and bring them to life? Why has this man sent word telling me to cure someone of his leprosy?[a] Look carefully, and you will see that he is looking for a reason to quarrel with me.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can refer to various serious skin diseases, not only what is now called Hansen’s disease.
    reason: lexical_alternative
  - marker: b
    text: Or “he is looking for an excuse to act against me.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: to put to death and to make alive
  simplified_phrase: able to put people to death and bring them to life
  preserved_meaning: God alone has authority over death and life.
  reasoning_layer_used: lexical and theological decisions
  rationale: This clarifies the rhetorical question while preserving both divine actions.
- pob_phrase: that this man sends word to me to cure a man
  simplified_phrase: Why has this man sent word telling me to cure someone
  preserved_meaning: The sender expects the king of Israel to cure the afflicted man.
  reasoning_layer_used: lexical decision and narrative context
  rationale: A direct question makes the king’s alarm easier to follow.
- pob_phrase: Only take note, please, and see how he is seeking a quarrel with me
  simplified_phrase: Look carefully, and you will see that he is looking for a reason to quarrel with me
  preserved_meaning: The king urges others to recognize that the sender may be seeking a pretext for conflict.
  reasoning_layer_used: lexical decision and alternative-reading footnote
  rationale: This keeps the occasion-or-pretext nuance without overstating active provocation.
translation_notes:
  risk_flags:
  - risk: “Bring them to life” may suggest resurrection more specifically than the Hebrew requires.
    mitigation: Its pairing with putting people to death preserves the broader divine-prerogative expression.
  - risk: Modern readers may understand “leprosy” too narrowly.
    mitigation: Footnote a preserves the Hebrew term’s broader medical range.
