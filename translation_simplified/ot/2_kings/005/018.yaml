translation:
  language: en
  text: '“May Yahweh pardon me, your servant, in this matter: When my master enters Rimmon’s temple[a] to bow down,[b] he leans on my hand for support, so I bow down too. When I bow down in Rimmon’s temple, please pardon me in this matter, Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally “the house of Rimmon,” meaning the temple or shrine of the Syrian god Rimmon.
    reason: cultural_note
  - marker: b
    text: The Hebrew can mean the physical act of bowing or an act of worship.
    reason: lexical_alternative
