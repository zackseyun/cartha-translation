translation:
  language: en
  text: Then Naaman said, “If you will not accept my gift, please let me, your servant, receive as much soil as two mules can carry.[a] From now on, I will offer burnt offerings and sacrifices to no other gods, but only to Yahweh.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Naaman may have wanted Israelite soil because people in the ancient world often associated a god with a particular land, or because he wished to worship Yahweh on Israelite soil; the text does not explain his reason.
    reason: cultural_note
  - marker: b
    text: Yahweh is the divine name represented by YHWH and traditionally rendered “the LORD.”
    reason: alternative_reading
