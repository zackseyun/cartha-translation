translation:
  language: en
  text: Naaman said, “Please take two talents of silver.”[a] He kept urging Gehazi to accept them. Then he tied the silver in two bags, added two sets of clothes, and gave everything to two of his servants. They carried the gifts ahead of Gehazi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A talent was a large ancient unit of weight.
    reason: cultural_note
