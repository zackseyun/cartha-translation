translation:
  language: en
  text: His servants approached him and said, “My father,[a] if the prophet had told you to do something great, wouldn’t you have done it? How much more should you do it when he says to you, ‘Wash, and be clean’?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “My father” is a respectful way for the servants to address their superior; they are not claiming he is their parent.
    reason: cultural_note
  - marker: b
    text: Or “and be cleansed.” The Hebrew can mean becoming clean or purified.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: came near and spoke to him and said
  simplified_phrase: approached him and said
  preserved_meaning: The servants moved toward Naaman and addressed him.
  reasoning_layer_used: Lexical decisions for וַיִּגְּשׁוּ and וַיְדַבְּרוּ אֵלָיו
  rationale: This compresses a repeated speech formula into natural narrative English.
- pob_phrase: some great thing
  simplified_phrase: to do something great
  preserved_meaning: The imagined command could be impressive or demanding.
  reasoning_layer_used: Lexical decision for דָּבָר גָּדוֹל
  rationale: This preserves the phrase’s open sense without narrowing it to difficulty alone.
- pob_phrase: How much more, then, when he says to you
  simplified_phrase: How much more should you do it when he says to you
  preserved_meaning: The servants argue that Naaman should obey the simpler command if he would obey a greater one.
  reasoning_layer_used: Lexical decisions for וְאַף כִּי and הֲלוֹא תַעֲשֶׂה
  rationale: Supplying “do it” makes the greater-to-lesser argument clear while retaining the Hebrew action.
interpretive_expansions:
- pob_phrase: How much more, then, when he says to you
  rendering: How much more should you do it when he says to you
  claim: The action of obeying is understood in the second half of the comparison.
  evidence:
  - The first rhetorical question explicitly uses “do,” and the following greater-to-lesser clause carries that action forward.
  confidence: high
  alternatives_preserved:
  - How much more, then, when he says to you
translation_notes:
  risk_flags:
  - risk: “Something great” may remain broader than some readers expect.
    mitigation: The breadth is retained because the POB rationale includes both impressive and demanding commands.
  - risk: Modern readers may mistake “My father” for literal family language.
    mitigation: Footnote a explains that it is a respectful form of address.
