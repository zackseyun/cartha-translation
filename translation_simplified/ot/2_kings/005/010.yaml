translation:
  language: en
  text: 'Elisha sent a messenger to Naaman with this message: “Go and wash seven times in the Jordan River. Then your flesh will become healthy again, and you will be clean.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: sent a messenger to him, saying
  simplified_phrase: sent a messenger to Naaman with this message
  preserved_meaning: Elisha used a human messenger to deliver the instructions to Naaman.
  reasoning_layer_used: POB lexical decisions and immediate narrative context
  rationale: Naming Naaman and using “with this message” makes the speech introduction immediately clear.
- pob_phrase: in the Jordan
  simplified_phrase: in the Jordan River
  preserved_meaning: Naaman must wash in the body of water named the Jordan.
  reasoning_layer_used: POB lexical alternative
  rationale: Adding “River” helps readers who may not recognize the place name.
- pob_phrase: your flesh will be restored to you
  simplified_phrase: your flesh will become healthy again
  preserved_meaning: Naaman’s diseased flesh will return to its former healthy condition.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The wording explains the Hebrew restoration idiom while retaining its concrete image of flesh.
translation_notes:
  risk_flags:
  - risk: “Healthy again” emphasizes physical healing and could lessen the verse’s purity resonance.
    mitigation: The separate promise “you will be clean” preserves both physical and possible ritual overtones.
