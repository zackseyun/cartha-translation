translation:
  language: en
  text: They said to him, “Look, there are fifty strong men here among your servants. Please let them go and look for your master. Perhaps the Spirit of Yahweh[a] carried him away and threw him onto one of the mountains or into one of the valleys.” But he answered, “Do not send them.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the wind of Yahweh.” The Hebrew word can mean “spirit” or “wind.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Look now, there are fifty strong men among your servants
  simplified_phrase: Look, there are fifty strong men here among your servants
  preserved_meaning: Fifty capable men from the group are available to help.
  reasoning_layer_used: POB lexical decisions for הִנֵּה נָא, יֵשׁ אֶת עֲבָדֶיךָ, and בְּנֵי חַיִל
  rationale: “Here” makes the men's present availability clear while retaining “strong men.”
- pob_phrase: Please let them go and seek your master
  simplified_phrase: Please let them go and look for your master
  preserved_meaning: They politely ask permission to send the men to search for Elijah.
  reasoning_layer_used: POB lexical decision for וִיבַקְשׁוּ אֶת אֲדֹנֶיךָ
  rationale: “Look for” is more common than “seek” and carries the same search meaning.
- pob_phrase: lest the Spirit of Yahweh has carried him away
  simplified_phrase: Perhaps the Spirit of Yahweh carried him away
  preserved_meaning: They fear that divine action may have moved Elijah elsewhere.
  reasoning_layer_used: POB lexical and theological decisions for פֶּן and רוּחַ יְהוָה
  rationale: “Perhaps” states the feared possibility in natural modern English without making it certain.
