  text: Elisha took Elijah’s cloak, which had fallen from him. He struck the water and said, “Where is Yahweh, the God of Elijah?”[a] Then he struck the water again. The water parted to both sides, and Elisha crossed over.
  philosophy: optimal-equivalence
