translation:
  language: en
  text: 'The sons of the prophets[a] who were in Jericho approached Elisha. They asked him, “Do you know that today Yahweh is taking your master away from over your head?”[b]


    Elisha answered, “I know it too. Be silent.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sons of the prophets” refers to members of a prophetic group, probably prophetic disciples.
    reason: cultural_note
  - marker: b
    text: The Hebrew literally says “from over your head,” picturing the removal of someone who has authority over another.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: came near to Elisha and said to him
  simplified_phrase: approached Elisha. They asked him
  preserved_meaning: The prophetic group moves toward Elisha and directly questions him.
  reasoning_layer_used: Lexical decision for וַיִּגְּשׁוּ and immediate narrative context
  rationale: Splitting the sentence and using “asked” makes the action easier to follow.
- pob_phrase: who were at Jericho
  simplified_phrase: who were in Jericho
  preserved_meaning: The verse identifies the prophetic group located at Jericho.
  reasoning_layer_used: Lexical decision for אֲשֶׁר בִּירִיחוֹ
  rationale: “In Jericho” is more natural for modern readers and remains an approved alternative.
- pob_phrase: I also know
  simplified_phrase: I know it too
  preserved_meaning: Elisha says that he shares their knowledge.
  reasoning_layer_used: Lexical decision for גַּם אֲנִי יָדַעְתִּי
  rationale: The object “it” clarifies the reply while “too” preserves the additive force.
translation_notes:
  risk_flags:
  - risk: Modern readers may mistake “sons of the prophets” for biological children.
    mitigation: Footnote [a] explains the likely group or disciple sense without replacing the Hebrew expression.
  - risk: “From over your head” may sound spatial rather than relational.
    mitigation: Footnote [b] explains the authority image while preserving the concrete wording.
