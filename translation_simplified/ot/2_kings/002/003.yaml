translation:
  language: en
  text: Then the group of prophets[a] at Bethel came out to Elisha and said, “Do you know that today Yahweh is taking your master away from over you?” Elisha answered, “I know it too. Be silent.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “sons of the prophets,” a term for members of a prophetic group, possibly disciples.
    reason: simplification_note
simplification_decisions:
- pob_phrase: the sons of the prophets who were at Bethel
  simplified_phrase: the group of prophets at Bethel
  preserved_meaning: This was a community of prophets or prophetic disciples at Bethel.
  reasoning_layer_used: POB lexical decision and alternatives for בְנֵי הַנְּבִיאִים
  rationale: “Group of prophets” avoids a misleading biological sense while the footnote preserves the Hebrew expression.
- pob_phrase: is taking your master from over your head
  simplified_phrase: is taking your master away from over you
  preserved_meaning: Yahweh is imminently removing Elijah from his authority over Elisha.
  reasoning_layer_used: POB lexical rationale and footnote for לֹקֵחַ and מֵעַל רֹאשֶׁךָ
  rationale: This states the removal naturally while preserving the vertical authority image without adding a new concept.
- pob_phrase: And he said, “I also know; be silent.”
  simplified_phrase: Elisha answered, “I know it too. Be silent.”
  preserved_meaning: Elisha shares their knowledge and firmly commands the group not to speak.
  reasoning_layer_used: POB lexical decisions for גַּם אֲנִי יָדַעְתִּי and הֶחֱשׁוּ
  rationale: Naming the speaker and splitting his response make the dialogue easier to follow.
