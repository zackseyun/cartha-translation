translation:
  language: en
  text: After they had crossed, Elijah said to Elisha, “What would you like me to do for you before I am taken from you?” Elisha answered, “Please let me receive a double share of your spirit.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A “double share” likely echoes the inheritance given to a firstborn son. “Your spirit” means the spirit connected with Elijah’s work as a prophet; some understand Elisha to be asking for twice Elijah’s prophetic power.
    reason: source_note
simplification_decisions:
- pob_phrase: when they had crossed over
  simplified_phrase: after they had crossed
  preserved_meaning: Elijah spoke once their crossing was complete.
  reasoning_layer_used: lexical decision for כְעָבְרָם
  rationale: “After” states the completed sequence in ordinary English.
- pob_phrase: Ask what I should do for you
  simplified_phrase: What would you like me to do for you?
  preserved_meaning: Elijah invites Elisha to make a request.
  reasoning_layer_used: lexical decision for שְׁאַל and מָה אֶעֱשֶׂה לָּךְ
  rationale: The question expresses Elijah’s offer more naturally for modern readers.
- pob_phrase: let a double portion of your spirit be upon me
  simplified_phrase: let me receive a double share of your spirit
  preserved_meaning: Elisha requests the double inheritance-like share associated with Elijah’s prophetic spirit.
  reasoning_layer_used: lexical and theological decisions for פִּי שְׁנַיִם, בְּרוּחֲךָ, and אֵלָי
  rationale: The active wording is clearer while “double share” preserves the inheritance image and ambiguity.
translation_notes:
  risk_flags:
  - risk: “Double share” could be mistaken for an unqualified claim that Elisha wanted twice Elijah’s power.
    mitigation: The footnote preserves the likely inheritance sense and the alternative interpretation.
  - risk: “Your spirit” could be read as a direct technical name for the Holy Spirit.
    mitigation: Lowercase wording and the footnote keep the reference tied to Elijah’s prophetic work.
