translation:
  language: en
  text: As Elisha watched, he kept crying out, “My father, my father! The chariot of Israel and its horsemen!”[a] Then he could no longer see Elijah. He grabbed his own clothes and tore them in two.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This cry may identify Elijah as Israel’s true strength and defense, or it may refer to the heavenly chariot and horses Elisha is watching.
    reason: alternative_reading
