  simplified_phrase: Please stay here, because Yahweh has sent me to the Jordan River
  preserved_meaning: Elijah gives Yahweh’s commission as the reason Elisha should remain there.
  reasoning_layer_used: Source conjunction כִּי and POB lexical decisions for שְׁלָחַנִי and הַיַּרְדֵּנָה
  rationale: “Because” states the reason clearly, while “River” identifies the destination.
- pob_phrase: As Yahweh lives, and as you yourself live
  simplified_phrase: As surely as Yahweh lives, and as surely as you live
  preserved_meaning: Elisha solemnly invokes Yahweh’s life and Elijah’s life in an oath.
  reasoning_layer_used: POB footnote and lexical decisions for חַי יְהוָה and וְחֵי נַפְשְׁךָ
  rationale: “As surely” makes the oath’s certainty natural in modern English.
- pob_phrase: the two of them went on
