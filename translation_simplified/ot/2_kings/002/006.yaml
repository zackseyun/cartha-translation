translation:
  language: en
  text: Then Elijah said to him, “Please stay here, because Yahweh has sent me to the Jordan River.” But he replied, “As surely as Yahweh lives, and as surely as you live, I will not leave you.” So they continued on together.
  philosophy: optimal-equivalence
