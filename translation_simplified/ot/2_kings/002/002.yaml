translation:
  language: en
  text: Elijah told Elisha, “Please stay here. Yahweh has sent me as far as Bethel.” Elisha answered, “As surely as Yahweh lives—and as surely as you yourself are alive—I will not leave you.” So the two of them went down to Bethel.
