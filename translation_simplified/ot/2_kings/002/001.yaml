simplification_decisions:
- pob_phrase: It happened, when Yahweh was about to take Elijah up into heaven by a whirlwind, that
  simplified_phrase: Yahweh was about to take Elijah up to heaven by a whirlwind. At that time,
  preserved_meaning: The episode begins as Elijah’s ascent is about to happen, and Yahweh is the one who will take him up.
  reasoning_layer_used: Lexical decisions for וַיְהִי and בְּהַעֲלוֹת, plus the discourse-marker revision
  rationale: The dense opening frame becomes two direct sentences while keeping its prospective timing.
- pob_phrase: went on from Gilgal
  simplified_phrase: traveled on from Gilgal
  preserved_meaning: Elijah and Elisha continued their journey away from Gilgal.
  reasoning_layer_used: Lexical decision for וַיֵּלֶךְ and geographic decision for מִן הַגִּלְגָּל
  rationale: “Traveled on” makes the continuing journey clearer than the general verb “went.”
