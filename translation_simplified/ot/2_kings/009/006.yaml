translation:
  language: en
  text: 'He got up and went into the house. Then he poured the oil on his head and said, “This is what Yahweh, the God of Israel, says: ‘I have anointed you[a] to be king over Yahweh’s people, Israel.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “I anoint you.” The Hebrew may function as the declaration that makes the anointing official.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Thus says Yahweh
  simplified_phrase: This is what Yahweh ... says
  preserved_meaning: The wording still introduces an authoritative message from Yahweh.
  reasoning_layer_used: lexical decision for כֹּה אָמַר
  rationale: The common English formula is clearer while preserving the prophetic messenger formula.
- pob_phrase: I have anointed you king
  simplified_phrase: I have anointed you to be king
  preserved_meaning: The completed pouring of oil appoints him as king.
  reasoning_layer_used: lexical and theological decisions for מְשַׁחְתִּיךָ לְמֶלֶךְ
  rationale: Adding “to be” makes the royal appointment natural in modern English without changing its force.
- pob_phrase: over the people of Yahweh, over Israel
  simplified_phrase: over Yahweh’s people, Israel
  preserved_meaning: Israel is identified as Yahweh’s people and the realm of the new king’s authority.
  reasoning_layer_used: lexical decisions for אֶל עַם יְהוָה and אֶל יִשְׂרָאֵל
  rationale: The apposition removes awkward repetition while retaining both Israel’s identity and the king’s authority.
translation_notes:
  risk_flags:
  - risk: Removing the repeated “over” reduces the Hebrew parallel structure.
    mitigation: The phrase still clearly identifies Israel as Yahweh’s people under the king’s rule.
