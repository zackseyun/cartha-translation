translation:
  language: en
  text: 'So they went back and told him. He said, “This is what Yahweh said through his servant Elijah the Tishbite: ‘In the territory of Jezreel[a], dogs will eat Jezebel’s flesh.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “on the plot of land at Jezreel”; the Hebrew can refer to a particular tract or parcel of land.
    reason: lexical_alternative
