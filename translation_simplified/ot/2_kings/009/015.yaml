  preserved_meaning: Jehu appeals to the group’s will or desire.
  reasoning_layer_used: POB lexical decision for אִם יֵשׁ נַפְשְׁכֶם
  rationale: Common English directly communicates the Hebrew idiom without retaining its opaque form.
- pob_phrase: let no fugitive leave the city to go and tell it
