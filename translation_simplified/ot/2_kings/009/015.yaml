translation:
  language: en
  text: King Jehoram had returned to Jezreel to recover from the wounds the Arameans had inflicted on him while he was fighting Hazael king of Aram. Jehu said, “If this is what you want, do not let anyone escape from the city and carry the news to Jezreel.”
