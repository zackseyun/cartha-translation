translation:
  language: en
  text: “The dogs will eat Jezebel in the territory of Jezreel[a]. No one will bury her.” Then he opened the door and fled.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “on a plot of land in Jezreel.” The Hebrew refers to a tract or portion of land.
