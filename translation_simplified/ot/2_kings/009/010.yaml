simplification_decisions:
- pob_phrase: and there will be no one to bury her
  simplified_phrase: No one will bury her.
  preserved_meaning: Jezebel will remain unburied as part of the announced judgment.
  reasoning_layer_used: The lexical decision supplies Jezebel as the object and reads the clause as future prophecy.
  rationale: A separate direct sentence is easier to read and keeps the full force of the prophecy.
- pob_phrase: And the dogs will eat Jezebel in the territory of Jezreel
  simplified_phrase: The dogs will eat Jezebel in the territory of Jezreel
  preserved_meaning: Dogs will consume Jezebel within Jezreel’s land area.
  reasoning_layer_used: The lexical decisions retain “eat,” “the dogs,” and the land-area sense of חֵלֶק.
  rationale: Removing the opening connector makes the quotation more natural without changing its meaning.
