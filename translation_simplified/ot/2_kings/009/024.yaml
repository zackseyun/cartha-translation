translation:
  language: en
  text: Jehu pulled his bowstring all the way back and struck Jehoram between the arms.[a] The arrow passed through his heart, and he collapsed in his chariot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “between his shoulders” or “between his shoulder blades.” The Hebrew says “between his arms,” but it may refer to the upper back or shoulder area.
    reason: lexical_alternative
