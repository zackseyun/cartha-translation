  text: 'The king sent a second messenger on horseback. When he reached them, he said, “This is what the king says: ‘Is there peace?’[a]” Jehu replied, “Peace is none of your concern. Turn around and follow me.”'
  philosophy: optimal-equivalence
  footnotes:
