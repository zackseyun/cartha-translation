  text: Jehoram ordered, “Harness the chariot!” So they harnessed his chariot.[a] Then the two kings—Jehoram of Israel and Ahaziah of Judah—rode out in separate chariots to meet Jehu. They found him on the plot of land belonging to Naboth the Jezreelite.
