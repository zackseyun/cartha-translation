  preserved_meaning: The rider formally asks about peaceful or favorable conditions on the king’s behalf.
  reasoning_layer_used: POB messenger-formula and shalom decisions
  rationale: Natural English preserves the broad question, while the footnote retains the repeated word “peace.”
- pob_phrase: Turn behind me
