translation:
  language: en
  text: 'So the horseman rode out to meet Jehu. He said, “This is what the king says: ‘Is all well?’”[a]


    Jehu answered, “Peace is none of your concern. Turn around and fall in behind me.”


    Then the watchman reported, “The messenger has reached them, but he has not come back.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Is it peace?” The Hebrew word is shalom (“peace”), which is repeated throughout this exchange.
    reason: lexical_alternative
