  preserved_meaning: The men demand to hear the prophet’s message.
  reasoning_layer_used: Lexical decision for הַגֶּד נָא לָנוּ and immediate context
  rationale: Supplying the implied object makes the request immediately clear.
- pob_phrase: Thus and thus he said to me, saying
  simplified_phrase: He told me something like this
  preserved_meaning: Jehu gives an indefinite or partial summary before quoting the message.
  reasoning_layer_used: Lexical decision and POB footnote for כָּזֹאת וְכָזֹאת
  rationale: This avoids adding multiple statements or an unsupported sequence.
- pob_phrase: Thus says Yahweh
  simplified_phrase: This is what Yahweh says
  preserved_meaning: The message is presented as Yahweh’s own declaration.
  reasoning_layer_used: Lexical and theological decisions for כֹּה אָמַר יְהוָה
  rationale: The prophetic formula is made plain while retaining Yahweh’s name.
