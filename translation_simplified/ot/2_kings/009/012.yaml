translation:
  language: en
  text: 'They said, “That is a lie! Tell us what he said.” Jehu answered, “He told me something like this:[a] ‘This is what Yahweh says: I have anointed you king over Israel.’”'
  philosophy: optimal-equivalence
  footnotes:
