  preserved_meaning: The oil is poured directly onto the man’s head.
  reasoning_layer_used: lexical decision for וְיָצַקְתָּ עַל רֹאשׁוֹ
  rationale: Repeating “the oil” makes the object immediately clear.
- pob_phrase: Thus says Yahweh
  simplified_phrase: This is what Yahweh says
  preserved_meaning: The words remain Yahweh’s authoritative prophetic message.
  reasoning_layer_used: prophetic formula and divine-name decision
  rationale: The common English formula is clearer while retaining Yahweh’s personal name.
- pob_phrase: Then open the door and flee; do not wait.
  simplified_phrase: Then open the door and flee. Do not wait.
  preserved_meaning: He must leave quickly without remaining there.
  reasoning_layer_used: lexical decisions for וְנַסְתָּה and וְלֹא תְחַכֶּה
  rationale: Two short sentences sharpen the urgent sequence of commands.
