translation:
  language: en
  text: Elisha fell ill, and this illness would lead to his death. Joash, the king of Israel, went down to him. Joash wept over Elisha[a] and said, “My father, my father![b] The chariots of Israel and its horsemen!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says that Joash “wept over his face,” giving a vivid picture of his grief.
    reason: source_note
  - marker: b
    text: Elisha used this same cry for Elijah in 2 Kings 2:12.
    reason: cross_reference
simplification_decisions:
- pob_phrase: had become sick with the illness from which he would die
  simplified_phrase: fell ill, and this illness would lead to his death
  preserved_meaning: The illness is identified as the one that would cause Elisha’s death.
  reasoning_layer_used: Lexical decisions for חָלָה, חָלְיוֹ, and אֲשֶׁר יָמוּת בּוֹ
  rationale: Two direct clauses make the narrative sequence and fatal outcome easier to grasp.
- pob_phrase: And Joash king of Israel went down to him and wept over him and said
  simplified_phrase: Joash, the king of Israel, went down to him. Joash wept over Elisha and said
  preserved_meaning: Joash descended to Elisha, mourned over him, and spoke to him.
  reasoning_layer_used: Lexical decisions and applied revision
  rationale: Short sentences and repeated names remove a long chain of actions and unclear pronouns.
- pob_phrase: The chariots of Israel and its horsemen
  simplified_phrase: The chariots of Israel and its horsemen
  preserved_meaning: The military image presents Elisha as Israel’s true strength and defense without explaining away the metaphor.
  reasoning_layer_used: Theological decision on the metaphor
  rationale: The striking image remains unchanged because paraphrasing it would flatten its force and ambiguity.
