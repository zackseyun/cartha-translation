  text: Jehoash son of Jehoahaz became king of Israel in Samaria during the thirty-seventh year of Joash’s reign as king of Judah.[a] Jehoash reigned for sixteen years.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew uses different forms of the name for Joash of Judah and Jehoash of Israel; some English translations call both kings “Joash.”
