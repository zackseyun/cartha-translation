translation:
  language: en
  text: Yet they did not abandon the sinful practices of Jeroboam’s dynasty, by which Jeroboam had caused Israel to sin. The king continued in those practices, and even the Asherah[a] remained standing in Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term can refer to the Canaanite goddess Asherah or to an object used in her worship, probably a standing cult object here.
    reason: lexical_alternative
