  preserved_meaning: They did not leave Jeroboam’s sinful religious pattern.
  reasoning_layer_used: lexical decisions for סָרוּ and מֵחַטֹּאות
  rationale: “Abandon the sinful practices” states the moral and ongoing sense in natural English.
- pob_phrase: the house of Jeroboam
  simplified_phrase: Jeroboam’s dynasty
  preserved_meaning: The phrase refers to Jeroboam’s ruling line and its established religious legacy.
  reasoning_layer_used: lexical decision for בֵּית יָרָבְעָם
  rationale: “Dynasty” avoids suggesting a physical building while using an audited alternative.
- pob_phrase: in them he walked
  simplified_phrase: The king continued in those practices
  preserved_meaning: The current king persisted in Jeroboam’s sinful pattern of conduct.
  reasoning_layer_used: lexical decision for בָּהּ הָלָךְ and narrative context
  rationale: This replaces an opaque conduct idiom and clearly identifies the narrative subject.
