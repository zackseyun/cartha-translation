translation:
  language: en
  text: Jehoash son of Jehoahaz recaptured the cities from Ben-hadad son of Hazael.[a] Ben-hadad had taken them from Jehoash’s father, Jehoahaz, in war. Joash defeated Ben-hadad three times[b] and restored the cities to Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebrew uses two forms of the same king’s name in this verse: “Jehoash” and “Joash.”'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew can also be translated “struck him,” referring here to military defeat.
    reason: lexical_alternative
