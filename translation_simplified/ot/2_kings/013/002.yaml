translation:
  language: en
  text: He did what was evil in Yahweh’s sight. He walked in the sinful ways of Jeroboam son of Nebat, who led Israel into sin, and he did not turn away from those ways.[a]
  philosophy: optimal-equivalence
  footnotes:
