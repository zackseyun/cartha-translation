translation:
  language: en
  text: Jehoahaz lay down in death with his ancestors, and they buried him in Samaria. Then his son Joash[a] took his place as king.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Joash is also called “Jehoash” in some English translations.
