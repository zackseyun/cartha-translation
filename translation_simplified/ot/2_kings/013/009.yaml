  simplified_phrase: lay down in death with his ancestors
  preserved_meaning: Jehoahaz died, as earlier generations had, while the Hebrew image of lying down remains.
  reasoning_layer_used: POB lexical decisions for וַיִּשְׁכַּב and עִם אֲבֹתָיו
  rationale: “In death” clarifies the royal death formula, and “ancestors” is clearer than “fathers.”
- pob_phrase: Joash his son reigned in his place
