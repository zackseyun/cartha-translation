  text: Elisha said, “Open the window that faces east.” The king opened it. Then Elisha said, “Shoot!” and the king shot. Elisha declared, “Yahweh’s arrow of victory[a]—the arrow of victory over Aram! You will strike Aram at Aphek until you have completely destroyed Aram.”
