translation:
  language: en
  text: “A son honors his father, and a slave honors his master. So if I am a father, where is the honor I deserve? If I am a master, where is the fear I deserve?” says the LORD of Armies to you priests who treat my name with contempt. But you ask, “How have we treated your name with contempt?”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: where is my honor?
  simplified_phrase: where is the honor I deserve?
  preserved_meaning: God demands the honor rightly owed to him as father.
  reasoning_layer_used: POB translation and immediate parallel
  rationale: The clearer wording makes the relational obligation explicit without changing the rhetorical question.
- pob_phrase: where is the fear due me?
  simplified_phrase: where is the fear I deserve?
  preserved_meaning: God demands the reverent fear rightly owed to him as master.
  reasoning_layer_used: POB translation
  rationale: This removes the formal phrase “due me” while retaining the claim of rightful fear.
- pob_phrase: priests who despise my name
  simplified_phrase: priests who treat my name with contempt
  preserved_meaning: The priests dishonor the LORD as represented by his name.
  reasoning_layer_used: POB translation and source-language image
  rationale: The common expression “treat with contempt” clarifies “despise” while preserving the image of God's name.
translation_notes:
  risk_flags:
  - risk: Modern readers may hear “fear” as terror rather than reverent submission.
    mitigation: Retaining “fear” preserves the POB's theological force and its parallel with honoring a master.
  - risk: “LORD of Armies” may be unfamiliar to new readers.
    mitigation: The title is retained because it is the POB's chosen divine title and conveys God's sovereign command.
