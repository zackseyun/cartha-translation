translation:
  language: en
  text: 'Yahweh says, “I have loved you.”[a]

    But you reply, “How have you loved us?”

    Yahweh declares, “Esau was Jacob’s brother, was he not? Yet I loved Jacob.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Hebrew may also be translated with the simple past: “I loved you … How did you love us?”'
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: “I have loved you,” says Yahweh.
  simplified_phrase: Yahweh says, “I have loved you.”
  preserved_meaning: Yahweh personally declares his continuing love for Israel.
  reasoning_layer_used: POB lexical decision for אָהַבְתִּי and the divine name
  rationale: Moving the speaker tag first makes the exchange easier to follow without changing the claim.
- pob_phrase: But you say, “How have you loved us?”
  simplified_phrase: But you reply, “How have you loved us?”
  preserved_meaning: Israel challenges Yahweh’s declaration of love.
  reasoning_layer_used: POB disputation-pattern rationale for וַאֲמַרְתֶּם
  rationale: “Reply” clearly marks the people’s words as a response while retaining their question.
- pob_phrase: “Was not Esau Jacob’s brother?”
  simplified_phrase: “Esau was Jacob’s brother, was he not?”
  preserved_meaning: The question appeals to an accepted family relationship as the basis for the contrast.
  reasoning_layer_used: POB lexical rationale for הֲלוֹא and אָח
  rationale: A tag question preserves the expected agreement in more natural modern English.
