translation:
  language: en
  text: When you bring a blind animal to be sacrificed, isn’t that evil? When you bring one that is lame or sick, isn’t that evil? Please present such an animal to your governor. Would he accept you or show you favor? says Yahweh of hosts.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Yahweh of hosts” is a divine title; “hosts” refers to armies.
    reason: source_note
