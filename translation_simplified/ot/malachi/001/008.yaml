  simplified_phrase: bring a blind animal to be sacrificed
  preserved_meaning: The priests bring a blind animal forward as a sacrificial offering.
  reasoning_layer_used: POB lexical decisions for תַגִּישׁוּן, עִוֵּר, and לִזְבֹּחַ
  rationale: The active wording makes the ritual action easier to picture without changing its purpose.
- pob_phrase: And when you present one that is lame or sick
  simplified_phrase: When you bring one that is lame or sick
  preserved_meaning: Animals with disabling or unhealthy defects are also being offered.
  reasoning_layer_used: POB lexical decisions for תַגִּישׁוּ, פִּסֵּחַ, and חֹלֶה
  rationale: The shorter sentence keeps both distinct defects in common English.
- pob_phrase: Present it, please, to your governor
  simplified_phrase: Please present such an animal to your governor
  preserved_meaning: Yahweh pointedly challenges the priests to offer the same unacceptable gift to their civil ruler.
  reasoning_layer_used: POB lexical decisions for הַקְרִיבֵהוּ נָא and פֶחָה
  rationale: “Such an animal” makes the pronoun’s referent immediately clear while retaining the ironic challenge.
