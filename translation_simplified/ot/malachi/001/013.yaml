translation:
  language: en
  text: “You say, ‘What a tiresome task this is!’ and you snort at it with contempt,” says Yahweh, Lord of heaven’s armies.[a] “You bring stolen, lame, and sick animals as your offering. Should I accept it from your hand?” says Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The traditional title is “Yahweh of hosts.”
    reason: simplification_note
simplification_decisions:
- pob_phrase: Look, what a weariness this is
  simplified_phrase: What a tiresome task this is!
  preserved_meaning: The priests complain that Yahweh’s service is wearisome and troublesome.
  reasoning_layer_used: Lexical decision for מַתְּלָאָה
  rationale: The direct complaint expresses weariness without adding the stronger idea of an imposed burden.
- pob_phrase: And you say ... and you snort at it
  simplified_phrase: You say ... and you snort at it with contempt
  preserved_meaning: Their complaint and contempt remain distinct actions, including the concrete image of snorting.
  reasoning_layer_used: Source image and lexical rationale for וְהִפַּחְתֶּם אֹתוֹ
  rationale: The added phrase explains the snort’s force while preserving the physical image.
- pob_phrase: Yahweh of hosts
  simplified_phrase: Yahweh, Lord of heaven’s armies
  preserved_meaning: Yahweh is identified as ruler of the heavenly armies.
  reasoning_layer_used: Theological decision and POB cultural note
  rationale: The main text explains the unfamiliar title, while the footnote retains its traditional form.
interpretive_expansions:
- pob_phrase: you snort at it
  rendering: you snort at it with contempt
  claim: The physical exhalation expresses scorn toward Yahweh’s service and offerings.
  evidence:
  - The lexical rationale says the verb pictures blowing or snorting that expresses contempt.
  - The complaint about weariness establishes the scornful context.
  confidence: high
  alternatives_preserved:
  - you sniff at it
  - you disdain it
- pob_phrase: what is stolen, and the lame, and the sick; thus you bring the offering
  rendering: You bring stolen, lame, and sick animals as your offering.
  claim: The stolen and defective things are sacrificial animals presented as the people’s offering.
  evidence:
  - Lameness and sickness are defects in animals brought for sacrifice.
  - The clause explicitly connects the listed things with the offering.
  confidence: high
  alternatives_preserved:
  - what is stolen, the lame, and the sick
  - thus you bring the offering
translation_notes:
  risk_flags:
  - risk: Explaining “hosts” as heaven’s armies may sound narrower than the traditional title.
    mitigation: The explanation follows the POB cultural note, and the traditional title remains in the footnote.
  - risk: The word “animals” is supplied rather than directly stated in the Hebrew list.
    mitigation: The sacrificial context and the named defects strongly support this clarification.
