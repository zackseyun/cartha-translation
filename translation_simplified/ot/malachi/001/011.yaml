translation:
  language: en
  text: For from sunrise to sunset, my name is great among the nations. In every place, incense is offered to my name, and a pure offering[a] is brought to my name. For my name is great among the nations[b], says Yahweh of hosts.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term can mean an offering generally and often refers to a grain offering.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may describe present reality, a prophetic present, or future certainty; its timing is left open.
    reason: alternative_reading
  - marker: c
    text: “Hosts” refers to armies and preserves the title’s heavenly and military imagery.
    reason: simplification_note
simplification_decisions:
- pob_phrase: from the rising of the sun to its setting
  simplified_phrase: from sunrise to sunset
  preserved_meaning: The sun image and its worldwide east-to-west scope remain intact.
  reasoning_layer_used: lexical decision for מִמִּזְרַח שֶׁמֶשׁ וְעַד מְבוֹאוֹ
  rationale: The shorter idiom is natural modern English without weakening the image.
- pob_phrase: and in every place incense is offered, and a pure offering is brought, to my name
  simplified_phrase: In every place, incense is offered to my name, and a pure offering is brought to my name.
  preserved_meaning: Both distinct sacrificial acts are directed to Yahweh’s name.
  reasoning_layer_used: lexical decisions for מֻקְטָר, מֻגָּשׁ לִשְׁמִי, and מִנְחָה טְהוֹרָה
  rationale: Repeating “to my name” removes the awkward delayed attachment without merging the offerings.
- pob_phrase: one long sentence joined by “and” and “for”
  simplified_phrase: three shorter sentences
  preserved_meaning: The worldwide claim, sacrificial worship, and repeated reason remain in their original order.
  reasoning_layer_used: POB translation structure and explanatory force of כִּי
  rationale: Sentence breaks make the prophetic declaration easier to follow.
