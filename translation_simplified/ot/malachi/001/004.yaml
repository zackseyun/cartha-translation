translation:
  language: en
  text: Even though Edom says, “We have been crushed, but we will return and rebuild what lies in ruins,” Yahweh of Armies says, “They may rebuild,[a] but I will tear down what they build. People will call their land ‘the territory of wickedness’ and call them ‘the people with whom Yahweh is indignant forever.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “They will rebuild, but I will tear down what they build.” The Hebrew may be read as a prediction; the main text emphasizes that their rebuilding will not succeed.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Though Edom says
  simplified_phrase: Even though Edom says
  preserved_meaning: Edom’s confident plan contrasts with Yahweh’s response.
  reasoning_layer_used: Lexical decision for כִּי and immediate context
  rationale: “Even though” makes the concessive contrast immediately clear.
- pob_phrase: We are shattered, but we will return and rebuild the ruins
  simplified_phrase: We have been crushed, but we will return and rebuild what lies in ruins
  preserved_meaning: Edom has suffered national devastation but intends to return and rebuild.
  reasoning_layer_used: Lexical decisions for רֻשַּׁשְׁנוּ, וְנָשׁוּב, and חֳרָבוֹת
  rationale: The new wording explains that devastated places, not ruins themselves, will be rebuilt.
- pob_phrase: they will be called the territory of wickedness, the people with whom Yahweh is indignant forever
  simplified_phrase: People will call their land ‘the territory of wickedness’ and call them ‘the people with whom Yahweh is indignant forever’
  preserved_meaning: Both Edom’s land and its people receive enduring public descriptions of wickedness and divine indignation.
  reasoning_layer_used: Lexical decisions for וְקָרְאוּ לָהֶם, גְּבוּל רִשְׁעָה, and זָעַם
  rationale: Active clauses clearly distinguish the label for the land from the label for the people.
interpretive_expansions:
- pob_phrase: but I will tear down
  rendering: but I will tear down what they build
  claim: Yahweh will undo Edom’s rebuilding work.
  evidence:
  - The preceding clause makes Edom’s rebuilding the direct object understood from context.
  - The POB rationale emphasizes the futility of Edom’s rebuilding before divine opposition.
  confidence: high
  alternatives_preserved:
  - but I will tear down
translation_notes:
  risk_flags:
  - risk: “They may rebuild” can sound like permission rather than concession.
    mitigation: The contrast and footnote clarify that Edom’s effort will be futile, not authorized.
  - risk: The active wording makes the Hebrew impersonal callers explicit as “People.”
    mitigation: It preserves the POB rationale that the third-person plural functions impersonally.
