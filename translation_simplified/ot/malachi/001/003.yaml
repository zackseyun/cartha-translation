- pob_phrase: and I made his mountains a desolation
  simplified_phrase: I turned his mountains into a wasteland
  preserved_meaning: God caused Esau’s mountains to become devastated.
  reasoning_layer_used: Lexical decisions for וָאָשִׂים, הָרָיו, and שְׁמָמָה
  rationale: The concrete wording states the caused result in common English.
- pob_phrase: his inheritance
  simplified_phrase: the land he inherited
  preserved_meaning: Esau’s inherited territorial possession is in view.
  reasoning_layer_used: Lexical decision for נַחֲלָתוֹ
  rationale: This explains the land sense while retaining the idea of inheritance.
- pob_phrase: and his inheritance for the jackals of the wilderness
  simplified_phrase: and I made the land he inherited a home for jackals in the wilderness
  preserved_meaning: God caused Esau’s inherited land to become a wilderness place inhabited by jackals.
  reasoning_layer_used: Hebrew parallel syntax and lexical decision for לְתַנּוֹת מִדְבָּר
  rationale: Supplying “made” preserves the parallel caused-result sense without implying mere abandonment.
