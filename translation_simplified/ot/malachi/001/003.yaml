translation:
  language: en
  text: But I hated Esau.[a] I turned his mountains into a wasteland, and I made the land he inherited a home for jackals in the wilderness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I rejected” or “I loved less.” The Hebrew normally means “I hated.”
    reason: lexical_alternative
