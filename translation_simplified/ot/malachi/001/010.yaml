- pob_phrase: Oh, that there were even one among you who would shut the doors
  simplified_phrase: If only even one of you would close the temple doors!
  preserved_meaning: The prophet wishes that someone would stop the corrupt worship.
  reasoning_layer_used: POB lexical decision and alternative-reading footnote
  rationale: “If only” states the wish naturally, while the footnote preserves the possible question.
- pob_phrase: so that you would not kindle my altar in vain
  simplified_phrase: Then you would no longer kindle the fire on my altar for a pointless purpose.
  preserved_meaning: Closing the doors would prevent further futile sacrificial service.
  reasoning_layer_used: POB lexical rationale and grounding review
  rationale: The wording identifies the altar fire and makes the worship's pointlessness clear.
- pob_phrase: I will not accept an offering from your hand
  simplified_phrase: I will not accept any offering from you
  preserved_meaning: Yahweh rejects the offerings these worshipers bring.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Removing the collective hand idiom communicates the same rejection directly.
