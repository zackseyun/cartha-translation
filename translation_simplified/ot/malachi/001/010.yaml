translation:
  language: en
  text: If only even one of you would close the temple doors![a] Then you would no longer kindle the fire on my altar for a pointless purpose. “I take no pleasure in you,” says Yahweh of hosts, “and I will not accept any offering from you.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Hebrew may also be read as a rhetorical question: “Is there even one of you who would close the doors?”'
    reason: alternative_reading
  - marker: b
    text: The Hebrew word for “offering” can refer more specifically to a grain offering.
    reason: lexical_alternative
