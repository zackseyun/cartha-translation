  text: The deceiver is cursed—the one who has a male animal in his flock and vows to offer it, but then sacrifices a blemished animal to the Lord. “For I am a great King,” says Yahweh of Armies,[a] “and my name inspires fear among the nations.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally, “the LORD of hosts.”
    reason: lexical_alternative
  - marker: b
    text: Or, “my name is revered among the nations.” The Hebrew includes fear, awe, and reverence.
    reason: lexical_alternative
