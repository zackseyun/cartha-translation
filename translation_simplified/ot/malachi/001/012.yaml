translation:
  language: en
  text: But you treat my name[a] as unholy when you say, “The Lord’s table is defiled, and the food offered on it is despised.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “you treat him as unholy,” if the Hebrew pronoun refers directly to the Lord rather than to his name.
    reason: alternative_reading
  - marker: b
    text: Hebrew reads, “its fruit, its food.” The Lord’s table refers to the altar and its food offerings.
    reason: cultural_note
