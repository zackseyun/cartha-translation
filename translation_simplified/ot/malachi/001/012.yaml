- pob_phrase: you are profaning it
  simplified_phrase: you treat my name as unholy
  preserved_meaning: The priests dishonor the Lord’s holy name.
  reasoning_layer_used: lexical and theological decisions
  rationale: This explains “profaning” while preserving its religious force and chosen referent.
- pob_phrase: by saying
  simplified_phrase: when you say
  preserved_meaning: Their words are the means by which they profane the name.
  reasoning_layer_used: lexical decision
  rationale: The ordinary clause is clearer while keeping the link to their speech.
- pob_phrase: its fruit, its food
  simplified_phrase: the food offered on it
  preserved_meaning: The despised food is the sacrificial offering associated with the Lord’s table.
  reasoning_layer_used: lexical decision, immediate context, and source note
  rationale: This avoids implying that the altar produces the food and states the sacrificial relationship clearly.
