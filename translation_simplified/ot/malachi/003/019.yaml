translation:
  language: en
  text: For look! The day is coming, blazing like an oven. All the arrogant and everyone who does evil will be like dry stalks left after harvest. The coming day will set them ablaze, says Yahweh of Armies.[a] It will leave them with neither root nor branch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally, “the LORD of hosts.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For behold, the day is coming, burning like an oven
  simplified_phrase: For look! The day is coming, blazing like an oven.
  preserved_meaning: The opening urgently directs attention to the approaching day and its intense heat.
  reasoning_layer_used: POB lexical decisions for הִנֵּה, בָּא, and בֹּעֵר כַּתַּנּוּר
  rationale: “Look!” gives the attention-command in familiar English, while two sentences make the warning easier to follow.
- pob_phrase: all the arrogant and every evildoer will be stubble
  simplified_phrase: All the arrogant and everyone who does evil will be like dry stalks left after harvest.
  preserved_meaning: Arrogant people and all who practice evil are pictured as harvested field debris ready to burn.
  reasoning_layer_used: POB lexical decisions for זֵדִים, עֹשֵׂה רִשְׁעָה, and קַשׁ
  rationale: The wording explains the agricultural image without replacing it with the distinct image of chaff.
- pob_phrase: The coming day will set them ablaze ... so that it will leave them neither root nor branch
  simplified_phrase: The coming day will set them ablaze ... It will leave them with neither root nor branch.
  preserved_meaning: The verse moves from ignition to complete eradication while keeping the root-and-branch image.
  reasoning_layer_used: POB theological decision on preserving the staged judgment metaphor
  rationale: Separating the result into its own sentence clarifies the progression without reducing it to “consume them.”
