    text: Traditionally, “the LORD of hosts.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the devourer
  simplified_phrase: whatever devours your crops
  preserved_meaning: The destructive agent remains unspecified while its effect on crops is made clear.
  reasoning_layer_used: Lexical decision for בָּאֹכֵל and agricultural context
  rationale: This avoids limiting the devourer to insects, disease, or any other single cause.
- pob_phrase: the fruit of the ground
  simplified_phrase: what your land produces
  preserved_meaning: The phrase still refers broadly to produce growing from the land.
  reasoning_layer_used: Lexical decision for פְּרִי הָאֲדָמָה
  rationale: Common wording makes the agricultural meaning immediately clear without narrowing it to one crop.
- pob_phrase: the vine in the field will not fail to bear for you
  simplified_phrase: The vine in the field will not fail to bear fruit for you
  preserved_meaning: The vine will produce fruit rather than lose its yield.
  reasoning_layer_used: Lexical decisions for תְשַׁכֵּל, הַגֶּפֶן, and בַּשָּׂדֶה
  rationale: Adding “fruit” completes the English expression while preserving the vine image.
