translation:
  language: en
  text: But who will be able to endure the day when he comes? Who will be able to remain standing when he appears? For he is like a refiner’s fire and like strong soap used to clean cloth.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew describes a strong cleansing alkali traditionally called “fullers’ soap.”
    reason: lexical_alternative
