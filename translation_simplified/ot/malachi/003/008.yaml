interpretive_expansions:
- pob_phrase: In the tithe and the contribution.
  rendering: By withholding the tithe and the sacred contribution.
  claim: The people robbed God by failing to give what was due to him.
  evidence:
  - The repeated verb “rob” denotes wrongfully taking from God what was due.
  - The next verse commands the people to bring the whole tithe.
  confidence: high
  alternatives_preserved:
