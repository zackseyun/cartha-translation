translation:
  language: en
  text: “Would a person rob God? Yet you are robbing me. But you ask, ‘How have we robbed you?’ By withholding the tithe[a] and the sacred contribution.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tithe was the required tenth given to God.
    reason: cultural_note
  - marker: b
    text: Or “offering”; this was a contribution set apart for sacred use.
    reason: lexical_alternative
