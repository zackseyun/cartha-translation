translation:
  language: en
  text: “Bring the full tithe—the whole required tenth—into the storehouse, so there will be food in my house. Test me in this now,” says Yahweh of hosts.[a] “See whether I will open heaven’s windows for you and pour out so much blessing that you have more than enough.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hosts” refers to armies, including the armies of heaven.
    reason: simplification_note
