translation:
  language: en
  text: But for you who honor my name with reverent fear, the sun of righteousness[a] will rise, bringing healing in its wings.[b] You will go out and leap like calves from the stall.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the sun of vindication”; the Hebrew can refer to righteousness, justice, or vindication.
    reason: lexical_alternative
  - marker: b
    text: Or “in its rays”; the sun’s rays are pictured as wings.
    reason: lexical_alternative
  - marker: c
    text: The rare Hebrew verb may also mean “skip,” “frolic,” or possibly “grow fat.”
    reason: lexical_alternative
