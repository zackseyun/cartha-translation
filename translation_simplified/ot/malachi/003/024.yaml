translation:
  language: en
  text: He will turn fathers’ hearts toward their children, and children’s hearts toward their fathers. Otherwise, I will come and strike the land with a ban that devotes it to destruction.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “strike the land with utter destruction”; traditionally, “with a curse.” The Hebrew refers to placing something under a ban and devoting it to destruction.
    reason: lexical_alternative
