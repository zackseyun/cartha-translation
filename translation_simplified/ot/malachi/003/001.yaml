translation:
  language: en
  text: See, I am sending my messenger,[a] and he will clear the way before me. Then suddenly, the Lord you are looking for will come to his temple, and the messenger of the covenant, whom you desire—see, he is coming, says Yahweh of Armies.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “messenger” can also mean “angel,” both here and in “the messenger of the covenant.”
    reason: lexical_alternative
  - marker: b
    text: Traditionally, “the LORD of hosts.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Behold, I am sending
  simplified_phrase: See, I am sending
  preserved_meaning: The opening remains an emphatic announcement of certain, imminent action.
  reasoning_layer_used: Lexical decisions for הִנְנִי and שֹׁלֵחַ.
  rationale: “See” is clearer than “behold” while keeping the prophetic call for attention.
- pob_phrase: the Lord whom you seek
  simplified_phrase: the Lord you are looking for
  preserved_meaning: The people continue to seek and expect the coming Lord.
  reasoning_layer_used: Lexical decision for אֲשֶׁר אַתֶּם מְבַקְשִׁים.
  rationale: “Looking for” expresses the ongoing search in ordinary modern English.
- pob_phrase: in whom you delight
  simplified_phrase: whom you desire
  preserved_meaning: The people desire the messenger of the covenant without implying intensified yearning.
  reasoning_layer_used: Lexical decision for אֲשֶׁר אַתֶּם חֲפֵצִים and grounding review.
  rationale: “Desire” is clear and preserves the broader lexical sense better than “long for.”
translation_notes:
  risk_flags:
  - risk: Readers may assume that “the Lord” and “the messenger of the covenant” are certainly identical or certainly distinct.
    mitigation: Both titles remain within one coordinated announcement without resolving their relationship.
  - risk: Using “messenger” may obscure the Hebrew word’s possible angelic sense.
    mitigation: The footnote preserves “angel” as a lexical alternative.
