  preserved_meaning: The speakers call service to God futile or empty of benefit.
  reasoning_layer_used: Lexical decision for שָׁוְא and theological decision on the speakers’ complaint
  rationale: “Pointless” states the cynical complaint in familiar English.
- pob_phrase: what profit is it
  simplified_phrase: What have we gained
  preserved_meaning: The speakers ask what benefit their religious conduct has brought them.
  reasoning_layer_used: Lexical decision for בֶּצַע
  rationale: “Gained” preserves the mercenary nuance in natural English.
- pob_phrase: kept his charge and that we have walked in mourning
  simplified_phrase: doing what he requires and going about in mourning
  preserved_meaning: They claim to have fulfilled God’s demands and practiced outward mournful or penitential conduct.
  reasoning_layer_used: Lexical decisions for מִשְׁמַרְתּוֹ and קְדֹרַנִּית
  rationale: The wording explains the obligation while preserving the mourning image.
