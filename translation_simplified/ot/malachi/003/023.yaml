simplification_decisions:
- pob_phrase: Look, I am sending Elijah the prophet to you
  simplified_phrase: Look! I am sending Elijah the prophet to you
  preserved_meaning: The announcement remains emphatic, and the sending remains vivid and imminent.
  reasoning_layer_used: POB lexical decisions for הִנֵּה and שֹׁלֵחַ
  rationale: A separate exclamation makes the opening emphasis easier to hear.
- pob_phrase: before the coming of ... day
  simplified_phrase: before ... day ... comes
  preserved_meaning: Elijah is sent before Yahweh’s day arrives.
  reasoning_layer_used: POB lexical decisions for לִפְנֵי and בּוֹא
  rationale: A direct verb is clearer than the abstract phrase “the coming of.”
- pob_phrase: the great and fearful day
  simplified_phrase: the great and terrifying day
  preserved_meaning: The day carries both great significance and fear-inspiring judgment.
  reasoning_layer_used: POB lexical and theological decisions for הַגָּדוֹל וְהַנּוֹרָא
  rationale: “Terrifying” clearly conveys the intended dread in modern English.
