translation:
  language: en
  text: Look! I am sending Elijah the prophet[a] to you before the great and terrifying day of Yahweh comes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Elijah” may mean Elijah himself or a forerunner like Elijah; the Hebrew simply says “Elijah the prophet.”
