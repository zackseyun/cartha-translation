simplification_decisions:
- pob_phrase: all the nations will call you blessed
  simplified_phrase: every nation will say, “You are blessed”
  preserved_meaning: All surrounding peoples will openly recognize Israel as blessed.
  reasoning_layer_used: Lexical decision for וְאִשְּׁרוּ and כָּל הַגּוֹיִם
  rationale: Direct speech makes the public declaration immediately clear.
- pob_phrase: for you will be a delightful land
  simplified_phrase: because you will be a land that people delight in
  preserved_meaning: The land will be pleasing and desirable because of divine favor.
  reasoning_layer_used: Lexical decision for כִּי and אֶרֶץ חֵפֶץ
  rationale: The clause explains the reason while preserving the land-of-delight image.
- pob_phrase: Yahweh of hosts
  simplified_phrase: Yahweh of hosts
  preserved_meaning: The divine name and the broad title connected with armies remain intact.
  reasoning_layer_used: Theological decision for יְהוָה and lexical decision for צְבָאוֹת
  rationale: The established title is retained and its unfamiliar term is explained in a note.
