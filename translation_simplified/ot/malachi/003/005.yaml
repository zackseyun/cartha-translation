translation:
  language: en
  text: “Then I will come near to you to judge. I will quickly testify against those who practice sorcery, commit adultery, swear falsely, deny hired workers their pay, oppress widows and children without fathers, and push aside foreigners living among you, denying them justice. They do not fear me,” says Yahweh of Armies.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I will come near to you for judgment, and I will be a swift witness
  simplified_phrase: I will come near to you to judge. I will quickly testify
  preserved_meaning: Yahweh approaches to judge and promptly gives testimony against wrongdoing.
  reasoning_layer_used: POB lexical decisions for וְקָרַבְתִּי, לַמִּשְׁפָּט, and עֵד מְמַהֵר
  rationale: Two direct sentences make the judicial action and its speed easier to follow.
- pob_phrase: those who oppress the wage of a hired worker
  simplified_phrase: those who deny hired workers their pay
  preserved_meaning: The offenders wrong workers by withholding or exploiting what they earned.
  reasoning_layer_used: POB lexical rationale and documented idiomatic alternatives
  rationale: The concrete injustice is clearer than the literal but opaque phrase about oppressing a wage.
- pob_phrase: the fatherless ... the sojourner
  simplified_phrase: children without fathers ... foreigners living among you
  preserved_meaning: The verse names vulnerable children and protected non-native residents.
  reasoning_layer_used: POB lexical decisions and footnote b
  rationale: These phrases explain unfamiliar biblical social categories in common English.
interpretive_expansions:
- pob_phrase: those who turn aside the sojourner
  rendering: push aside foreigners living among you, denying them justice
  claim: Turning aside the resident foreigner is oppressive exclusion with a legal or justice-related force.
  evidence:
  - The POB lexical rationale says the surrounding context supplies a legal-oppressive sense.
  - The documented alternative is “those who deprive the foreigner of justice.”
  confidence: moderate
  alternatives_preserved:
  - push aside foreigners living among you
translation_notes:
  risk_flags:
  - risk: “Denying them justice” makes the contextual legal sense explicit although no separate Hebrew word for justice appears in this clause.
    mitigation: The wording retains the source image “push aside” and records the clarification as a moderate-confidence expansion.
