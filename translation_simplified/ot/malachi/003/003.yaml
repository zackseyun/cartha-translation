translation:
  language: en
  text: He will sit like a refiner who purifies silver. He will purify the sons of Levi, refining them as gold and silver are refined. Then they will belong to the LORD and present an offering[a] in righteousness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a grain offering.” The Hebrew word can refer specifically to a grain offering or more broadly to an offering or gift.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: sit as a refiner and purifier of silver
  simplified_phrase: sit like a refiner who purifies silver
  preserved_meaning: The seated metalworker image and his work of purification remain vivid.
  reasoning_layer_used: Lexical decisions for וְיָשַׁב, מְצָרֵף, and וּמְטַהֵר כֶּסֶף
  rationale: The relative clause explains the refiner’s work in common English.
- pob_phrase: refine them like gold and like silver
  simplified_phrase: refining them as gold and silver are refined
  preserved_meaning: The priestly line is purified as precious metals are purified.
  reasoning_layer_used: Lexical decision for וְזִקַּק and the repeated metal similes
  rationale: The passive comparison makes the metalworking image immediately clear.
- pob_phrase: they will be for Yahweh
  simplified_phrase: they will belong to the LORD
  preserved_meaning: The purified priests are consecrated to Israel’s covenant God.
  reasoning_layer_used: Lexical decisions for וְהָיוּ לַיהוָה and לַיהוָה
  rationale: “Belong to” expresses the relationship naturally while retaining the chosen divine title.
translation_notes:
  risk_flags:
  - risk: “Sons of Levi” may be unfamiliar to readers who do not know their priestly role.
    mitigation: The familial wording remains because the source emphasizes covenant lineage.
  - risk: “In righteousness” carries both ethical and worship-related force.
    mitigation: The phrase remains so its meaning is not reduced to correct ritual procedure.
