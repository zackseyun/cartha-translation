translation:
  language: en
  text: “Ever since the time of your ancestors, you have strayed from my laws and have not obeyed them. Return to me, and I will return to you,” says Yahweh of Armies. But you ask, “How are we to return?”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: From the days of your fathers
  simplified_phrase: Ever since the time of your ancestors
  preserved_meaning: The people's disobedience has continued from earlier generations to the present.
  reasoning_layer_used: POB lexical decision for לְמִימֵי אֲבֹתֵיכֶם and its listed alternative
  rationale: “Ancestors” conveys the broader family-history sense more clearly than “fathers.”
- pob_phrase: turned aside from my statutes and have not kept them
  simplified_phrase: strayed from my laws and have not obeyed them
  preserved_meaning: The people departed from Yahweh's prescribed requirements and failed to follow them.
  reasoning_layer_used: POB lexical decisions for סַרְתֶּם, מֵחֻקַּי, and וְלֹא שְׁמַרְתֶּם
  rationale: “Strayed” keeps the path image, while “laws” and “obeyed” make the covenant accusation immediately clear.
- pob_phrase: Yahweh of hosts
  simplified_phrase: Yahweh of Armies
  preserved_meaning: Yahweh is identified by a title that retains the source's army imagery.
  reasoning_layer_used: POB theological decision for יְהוָה and lexical rationale for צְבָאוֹת
  rationale: “Armies” replaces the unfamiliar word “hosts” without reducing the title to the more interpretive “Almighty.”
translation_notes:
  risk_flags:
  - risk: “Laws” is broader than the more precise covenant term “statutes.”
    mitigation: The surrounding language of straying and obedience preserves the sense of Yahweh's prescribed requirements.
  - risk: “Armies” leaves open whether the title refers specifically to heavenly armies.
    mitigation: This preserves the POB rationale's military and heavenly resonance without resolving the image too narrowly.
