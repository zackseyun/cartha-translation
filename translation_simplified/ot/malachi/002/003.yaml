translation:
  language: en
  text: See, I am rebuking your offspring.[a] I will smear your faces with dung from the animals sacrificed at your festivals, and someone will carry you away with that refuse.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “your seed”; some understand this as grain or crops rather than offspring.
    reason: alternative_reading
  - marker: b
    text: The final clause is difficult; it likely pictures the priests being removed with the sacrificial refuse to an unclean place.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Look, I am rebuking your offspring
  simplified_phrase: See, I am rebuking your offspring.
  preserved_meaning: God announces an immediate judgment against the priests’ descendants.
  reasoning_layer_used: Lexical and theological decisions on הַזֶּרַע
  rationale: The shorter sentence keeps “offspring” as the controlling reading while the footnote preserves the agricultural alternative.
- pob_phrase: I will spread dung on your faces—the dung of your festival sacrifices
  simplified_phrase: I will smear your faces with dung from the animals sacrificed at your festivals
  preserved_meaning: God threatens the priests with humiliating defilement by sacrificial dung.
  reasoning_layer_used: Lexical decisions on וְזֵרִיתִי, פֶּרֶשׁ, and פֶּרֶשׁ חַגֵּיכֶם
  rationale: The active wording explains where the dung came from without weakening the offensive image.
- pob_phrase: one will carry you away with it
  simplified_phrase: someone will carry you away with that refuse
  preserved_meaning: An unspecified agent removes the priests together with the sacrificial waste.
  reasoning_layer_used: Theological decision on וְנָשָׂא אֶתְכֶם אֵלָיו
  rationale: “Someone” is more natural than “one,” while “that refuse” makes the pronoun’s likely reference clear.
