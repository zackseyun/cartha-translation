translation:
  language: en
  text: “If you do not listen, and if you do not take seriously giving glory to my name,” says Yahweh of Armies[a], “I will send the curse among you. I will curse your blessings. In fact, I have already cursed them[b], because you are not taking this seriously.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Yahweh of Hosts.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew could also mean, “I also will curse them,” or, in the singular, “I have cursed it.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: take it to heart to give glory to my name
  simplified_phrase: take seriously giving glory to my name
  preserved_meaning: They must seriously commit themselves to honoring Yahweh’s name.
  reasoning_layer_used: Lexical decisions for תָשִׂימוּ עַל לֵב and לָתֵת כָּבוֹד לִשְׁמִי
  rationale: This directly explains the idiom without adding a threshold of sufficient seriousness.
- pob_phrase: then I will send the curse among you, and I will curse your blessings
  simplified_phrase: I will send the curse among you. I will curse your blessings.
  preserved_meaning: Yahweh threatens a specific covenant curse and the cursing of their blessings.
  reasoning_layer_used: Lexical decisions for הַמְּאֵרָה and וְאָרוֹתִי אֶת בִּרְכוֹתֵיכֶם
  rationale: Two short sentences keep the judgments distinct without narrowing what the blessings are.
- pob_phrase: indeed, I have already cursed them
  simplified_phrase: In fact, I have already cursed them
  preserved_meaning: The curse is plausibly already underway.
  reasoning_layer_used: Theological decision on the force of אָרוֹתִיהָ
  rationale: Natural emphasis preserves the chosen reading while the footnote records the ambiguity.
