translation:
  language: en
  text: You have wearied Yahweh by what you say. But you ask, “How have we wearied him?” You weary him when you say, “In Yahweh’s eyes, everyone who does evil is good, and he delights in them.” Or you ask, “Where is the God of justice?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the God of judgment.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: with your words
  simplified_phrase: by what you say
  preserved_meaning: Their speech is the means by which they weary Yahweh.
  reasoning_layer_used: Lexical decision for בְּדִבְרֵיכֶם
  rationale: The new wording states the same means in more natural English.
- pob_phrase: By saying
  simplified_phrase: You weary him when you say
  preserved_meaning: Their quoted claims explain how they weary Yahweh.
  reasoning_layer_used: Lexical decision for בֶּאֱמָרְכֶם
  rationale: A full sentence makes the link between the charge and its cause easier to follow.
- pob_phrase: Everyone who does evil is good in the eyes of Yahweh
  simplified_phrase: In Yahweh’s eyes, everyone who does evil is good
  preserved_meaning: The cynical claim is that Yahweh regards evildoers as good.
  reasoning_layer_used: Lexical decisions for כָּל עֹשֵׂה רָע, טוֹב, and בְּעֵינֵי יְהוָה
  rationale: Moving the evaluation phrase forward clarifies the sentence while preserving the eye image.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “wearied” as a literal claim that God becomes physically exhausted.
    mitigation: The wording retains POB’s required anthropopathic force without adding an explanation to the verse.
  - risk: “Justice” does not display the full judgment-or-justice range of מִשְׁפָּט.
    mitigation: The footnote preserves “judgment” as the lexical alternative.
