simplification_decisions:
- pob_phrase: have made you despised and abased before all the people
  simplified_phrase: have made you despised and humiliated before all the people
  preserved_meaning: God has brought the priests into public disgrace.
  reasoning_layer_used: Lexical decisions and the theological decision on public shame
  rationale: “Humiliated” clearly expresses their lowered public status while keeping God as the actor.
- pob_phrase: you are not keeping my ways
  simplified_phrase: you do not live by my ways
  preserved_meaning: The priests continually fail to obey God's covenantal standards.
  reasoning_layer_used: Lexical decision for אֵינְכֶם שֹׁמְרִים אֶת דְּרָכַי
  rationale: “Live by” communicates ongoing obedience in natural English.
- pob_phrase: showing partiality in the law
  simplified_phrase: show favoritism when dealing with the law
  preserved_meaning: The priests handle God's law in a biased way.
  reasoning_layer_used: Lexical and theological decisions for נֹשְׂאִים פָּנִים בַּתּוֹרָה
  rationale: The wording explains partiality and leaves the priests' legal or teaching role suitably broad.
interpretive_expansions:
- pob_phrase: in the law
  rendering: when dealing with the law
  claim: The priests show bias in their handling of God's law, whether administering or teaching it.
  evidence:
