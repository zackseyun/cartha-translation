translation:
  language: en
  text: May Yahweh cut off from Jacob’s tents every man who does this—the one who is awake and the one who answers[a]—and the one who brings an offering to Yahweh of hosts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew phrase “awake and answers” is difficult; it may mean “witness and advocate” or may include everyone involved.
    reason: alternative_reading
