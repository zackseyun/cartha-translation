translation:
  language: en
  text: Do we not all have one Father?[a] Did not one God create us? Why, then, are we unfaithful to one another—each man to his brother—and so treat the covenant of our fathers as if it were not sacred?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “One Father” most likely refers to God, though it may refer to a shared covenant ancestor.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Has not one God created us?
  simplified_phrase: Did not one God create us?
  preserved_meaning: The rhetorical question affirms that the one God created them all.
  reasoning_layer_used: Lexical decisions for הֲלוֹא and בְּרָאָנוּ
  rationale: The active form is more natural while preserving the rhetorical force and divine creation.
- pob_phrase: are we faithless, each man to his brother
  simplified_phrase: are we unfaithful to one another—each man to his brother
  preserved_meaning: The community betrays covenant loyalty in its treatment of fellow members.
  reasoning_layer_used: Lexical and theological decisions for נִבְגַּד and אִישׁ בְּאָחִיו
  rationale: “One another” clarifies the communal scope while the apposition retains the masculine source wording.
- pob_phrase: profaning the covenant of our fathers
  simplified_phrase: and so treat the covenant of our fathers as if it were not sacred
  preserved_meaning: Their unfaithfulness dishonors the sacred ancestral covenant without making it actually unholy.
  reasoning_layer_used: Lexical decisions for לְחַלֵּל and בְּרִית אֲבֹתֵינוּ
  rationale: The wording explains profanation plainly while preserving the covenant’s sacred status.
interpretive_expansions:
