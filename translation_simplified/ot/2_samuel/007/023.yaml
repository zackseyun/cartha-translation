translation:
  language: en
  text: Who on earth is like your people Israel? They are the one nation on earth that God went to redeem and make his own people, to make a name for himself, and to do for you[b] great and fearsome[a] things for your land before your people. You redeemed this people for yourself from Egypt, from nations and their gods.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “great and awe-inspiring things”; the Hebrew describes deeds that inspire awe, dread, or fear.
    reason: lexical_alternative
  - marker: b
    text: Here “you” is plural and addresses Israel collectively.
    reason: source_note
  - marker: c
    text: The Hebrew ending is difficult; it may also mean “from Egypt, the nations and its god” or “from Egypt, nations and gods.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And who is like your people, like Israel, the one nation on the earth
  simplified_phrase: Who on earth is like your people Israel? They are the one nation on earth
  preserved_meaning: Israel is presented as God’s unique people among all nations.
  reasoning_layer_used: lexical decisions and rhetorical context
  rationale: Two sentences make the rhetorical question and Israel’s uniqueness easier to grasp.
- pob_phrase: to redeem for himself as a people
  simplified_phrase: to redeem and make his own people
  preserved_meaning: God redeemed Israel to belong to him as his people.
  reasoning_layer_used: lexical and theological decisions
  rationale: The covenant result is stated in ordinary English while retaining redemption.
- pob_phrase: whom you redeemed for yourself from Egypt
  simplified_phrase: You redeemed this people for yourself from Egypt
  preserved_meaning: God redeemed the same people, Israel, from Egypt for himself.
  reasoning_layer_used: lexical decision and immediate context
  rationale: A new sentence gives the relative clause a clear subject and antecedent.
