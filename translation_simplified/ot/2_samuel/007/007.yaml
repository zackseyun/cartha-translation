translation:
  language: en
  text: As I walked from place to place among all the sons of Israel, did I ever say to any of Israel’s tribes[a] that I had commanded to shepherd my people Israel, ‘Why have you not built me a cedar house?’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew reads “tribes of Israel.” The parallel in 1 Chronicles 17:6 reads “judges of Israel,” probably referring to the leaders appointed to shepherd the people.
    reason: textual_variant
simplification_decisions:
- pob_phrase: In all the places where I have walked
  simplified_phrase: As I walked from place to place
  preserved_meaning: God moved among his people rather than remaining in a permanent dwelling.
  reasoning_layer_used: lexical decision for הִתְהַלַּכְתִּי and the paired בְּכֹל / בְּכָל construction
  rationale: The recasting uses ordinary English while preserving the concrete walking image.
- pob_phrase: did I ever speak a word to one of the tribes of Israel
  simplified_phrase: did I ever say to any of Israel’s tribes
  preserved_meaning: The rhetorical question strongly denies that God ever gave such a command.
  reasoning_layer_used: lexical decision for הֲדָבָר דִּבַּרְתִּי and the MT reading אַחַד שִׁבְטֵי יִשְׂרָאֵל
  rationale: “Ever say to any” expresses the emphatic denial in more natural English without replacing “tribes.”
- pob_phrase: whom I commanded to shepherd my people Israel, saying
  simplified_phrase: that I had commanded to shepherd my people Israel
  preserved_meaning: God commissioned those associated with the tribes to care for Israel as shepherds care for a flock.
  reasoning_layer_used: lexical rationale for אֲשֶׁר צִוִּיתִי לִרְעוֹת
  rationale: Removing “saying” lightens the clause while retaining the pastoral metaphor and direct quotation.
translation_notes:
  risk_flags:
  - risk: The Hebrew “tribes” sits awkwardly with the command to shepherd and may point toward tribal leaders.
    mitigation: The main text keeps the Samuel reading, while the footnote preserves the parallel reading “judges.”
  - risk: “Sons of Israel” is less familiar than “Israelites” to modern readers.
    mitigation: It is retained because POB treats the masculine covenantal ethnonym as a deliberate theological choice.
