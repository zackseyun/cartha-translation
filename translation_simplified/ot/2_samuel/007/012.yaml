translation:
  language: en
  text: When your days have reached their full number and you die and join your ancestors, I will raise up your offspring[a] to succeed you—offspring from your own body—and I will firmly establish their kingdom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can refer to one descendant or to offspring collectively; the promise can speak of that offspring through a representative individual.
    reason: lexical_alternative
