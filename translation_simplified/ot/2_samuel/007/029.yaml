translation:
  language: en
  text: Now, please be willing to bless the house[a] of your servant, so that it will remain before you forever. For you, Lord Yahweh,[b] have spoken, and through your blessing the house of your servant will be blessed forever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “house” can include the servant’s household and royal family line.
    reason: lexical_alternative
  - marker: b
    text: Hebrew combines the title “Lord” with the divine name Yahweh.
    reason: source_note
simplification_decisions:
- pob_phrase: please be willing and bless
  simplified_phrase: please be willing to bless
  preserved_meaning: David asks God to consent graciously to give the blessing.
  reasoning_layer_used: lexical decision for הוֹאֵל
  rationale: The infinitive states the request naturally without weakening its petitionary tone.
- pob_phrase: that it may continue before you forever
  simplified_phrase: so that it will remain before you forever
  preserved_meaning: David’s house is to endure permanently before God.
  reasoning_layer_used: lexical rationale for לִהְיוֹת לְעוֹלָם לְפָנֶיךָ
  rationale: “Remain” clearly expresses continuing existence while preserving the image of being before God.
- pob_phrase: and by your blessing
  simplified_phrase: and through your blessing
  preserved_meaning: God’s blessing is the source and means of the house’s lasting blessed state.
  reasoning_layer_used: lexical decision for וּמִבִּרְכָתְךָ
  rationale: “Through” makes the instrumental relationship immediately clear.
