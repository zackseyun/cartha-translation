translation:
  language: en
  text: Then King David went in and sat in Yahweh’s presence. He said, “Lord GOD, who am I? What is my house,[a] that you have brought me this far?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “House” means David’s family and the royal line that would come from him.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: sat before Yahweh and said
  simplified_phrase: sat in Yahweh’s presence. He said
  preserved_meaning: David sat before Yahweh and then spoke to him.
  reasoning_layer_used: The lexical decision explains that “before” expresses being in someone’s presence.
  rationale: The sentence break and explicit presence wording make the scene easier to follow.
- pob_phrase: Who am I, Lord GOD
  simplified_phrase: Lord GOD, who am I?
  preserved_meaning: David addresses God with humility and uses the compound divine title.
  reasoning_layer_used: The lexical decisions preserve both the humility formula and “Lord GOD.”
  rationale: Moving the address first gives the question a more natural English order.
- pob_phrase: what is my house
  simplified_phrase: What is my house,[a]
  preserved_meaning: “House” retains its linked senses of family, household, and dynasty.
  reasoning_layer_used: The theological decision requires retaining the chapter’s central house wordplay.
  rationale: The key image remains in the text while the footnote explains its broader meaning.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “house” only as a building.
