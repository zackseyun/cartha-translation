    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I cut off all your enemies from before you
  simplified_phrase: I cut off all your enemies, removing them from your path
  preserved_meaning: God forcefully removed every enemy who stood against David.
  reasoning_layer_used: Lexical decisions for וָאַכְרִתָה and מִפָּנֶיךָ
  rationale: This keeps the concrete image “cut off” while explaining the spatial idiom.
- pob_phrase: I will make for you a great name
  simplified_phrase: I will make your name great
  preserved_meaning: God promises to give David great renown while retaining the biblical image of his name.
  reasoning_layer_used: Lexical and theological decisions for וְעָשִׂיתִי לְךָ and שֵׁם גָּדוֹל
  rationale: This natural construction preserves the future promise and the key “name” idiom.
- pob_phrase: like the name of the great ones who are on the earth
  simplified_phrase: like that of the great people on earth
  preserved_meaning: David’s name will be comparable to the renown of the world’s great people.
  reasoning_layer_used: Lexical decisions for כְּשֵׁם הַגְּדֹלִים and אֲשֶׁר בָּאָרֶץ
  rationale: “That” preserves the singular comparison without awkwardly repeating “name.”
