translation:
  language: en
  text: I will provide a place for my people Israel and plant them there. They will live in their own place and no longer be disturbed. The sons of wickedness[a] will no longer oppress them as they did before.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, wicked men or evildoers; the Hebrew expression is literally “sons of wickedness.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: appoint a place
  simplified_phrase: provide a place
  preserved_meaning: God takes the initiative to secure a place for Israel.
  reasoning_layer_used: Lexical decision for וְשַׂמְתִּי with מָקוֹם
  rationale: “Provide” expresses the promise naturally without narrowing “place” to “homeland.”
- pob_phrase: so that they may dwell in their own place
  simplified_phrase: They will live in their own place
  preserved_meaning: Israel will settle in the place God assigns them.
  reasoning_layer_used: Lexical decisions for וְשָׁכַן and תַּחְתָּיו
  rationale: A direct sentence replaces the formal purpose clause while retaining settled residence.
- pob_phrase: shall no longer afflict them, as formerly
  simplified_phrase: will no longer oppress them as they did before
  preserved_meaning: Past hostile treatment of Israel will not continue.
  reasoning_layer_used: Lexical decisions for יֹסִיפוּ, לְעַנּוֹתוֹ, and כַּאֲשֶׁר בָּרִאשׁוֹנָה
  rationale: “Oppress” and “as they did before” make the hostile action and time comparison immediately clear.
