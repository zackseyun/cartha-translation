translation:
  language: en
  text: And now, Yahweh God, make the word[a] you spoke about your servant and his house[b] stand firm forever. Do what you have said.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the promise you made.”
    reason: lexical_alternative
  - marker: b
    text: Here, “house” means David’s royal family line or dynasty, not merely his household.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: confirm forever the word
  simplified_phrase: make the word ... stand firm forever
  preserved_meaning: David asks God to make his spoken word remain firmly established forever.
  reasoning_layer_used: Lexical rationale for הָקֵם
  rationale: The concrete image of causing God’s word to stand is clearer than the abstract verb “confirm.”
- pob_phrase: concerning your servant and concerning his house
  simplified_phrase: about your servant and his house
  preserved_meaning: God’s earlier speech concerned David and his royal line.
  reasoning_layer_used: Lexical decisions for עַל and בֵּיתוֹ
  rationale: “About” is common English, while “house” remains to preserve the covenant term.
- pob_phrase: and do as you have spoken
  simplified_phrase: Do what you have said.
  preserved_meaning: David asks God to act according to his own prior words.
  reasoning_layer_used: Lexical rationale for וַעֲשֵׂה and כַּאֲשֶׁר דִּבַּרְתָּ
  rationale: A separate direct sentence expresses the same request in natural English.
translation_notes:
  risk_flags:
  - risk: Modern readers may not recognize “word” as referring to God’s promise.
    mitigation: Footnote a preserves “promise” as the documented lexical alternative.
  - risk: Readers may take “house” to mean only David’s household or building.
    mitigation: Footnote b explains its crucial dynastic sense without replacing the covenant image.
