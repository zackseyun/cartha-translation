translation:
  language: en
  text: 'For you, Yahweh of hosts,[a] God of Israel, have made this known to your servant: “I will build you a house.”[b] So your servant has found the courage to pray this prayer to you.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hosts” refers broadly to the heavenly and earthly forces under Yahweh’s command.
    reason: simplification_note
  - marker: b
    text: Here “house” refers to a lasting royal dynasty. The word also echoes David’s concern about a physical house, or temple, for Yahweh.
    reason: lexical_alternative
