translation:
  language: en
  text: You firmly established Israel as your own people forever. And you, Yahweh,[a] became their God.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh is the personal name of God, represented in many translations as “the LORD.”
    reason: source_note
  - marker: b
    text: The Hebrew can also be translated “were their God,” but “became” emphasizes the covenant being established here.
    reason: lexical_alternative
