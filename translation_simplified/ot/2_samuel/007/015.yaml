- pob_phrase: my steadfast love will not depart from him
  simplified_phrase: my steadfast love will always remain with him
  preserved_meaning: God’s loyal covenant love will not leave the promised royal descendant.
  reasoning_layer_used: Lexical and theological decisions for חַסְדִּי and יָסוּר
  rationale: The positive wording states the same enduring commitment in more immediate English.
- pob_phrase: as I removed it from Saul
  simplified_phrase: I will not take it away as I did from Saul
  preserved_meaning: God contrasts his lasting love for this descendant with the favor he withdrew from Saul.
  reasoning_layer_used: Lexical decision for הֲסִרֹתִי and immediate context
  rationale: Repeating “take it away” makes the pronoun’s reference clear without changing the contrast.
- pob_phrase: whom I removed from before you
  simplified_phrase: whom I removed from before you
  preserved_meaning: Saul was removed from his position in relation to David, though the Hebrew expression remains open.
  reasoning_layer_used: Theological decision on the referent of “from before you”
