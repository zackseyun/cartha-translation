translation:
  language: en
  text: But my steadfast love will always remain with him. I will not take it away as I did from Saul, whom I removed from before you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Removed from before you” refers to Saul’s removal in relation to David, especially from his royal position, but the Hebrew expression is broader than that explanation.
    reason: simplification_note
