translation:
  language: en
  text: Because of your word[a] and in keeping with what is in your heart[b], you have done all these great things to make your servant know them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “because of your promise”; “your word” keeps the broader meaning of the Hebrew.
    reason: lexical_alternative
  - marker: b
    text: What is “in your heart” means your own intention or will.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: according to your heart
  simplified_phrase: in keeping with what is in your heart
  preserved_meaning: God acted according to his own intention, while the Hebrew heart image remains.
  reasoning_layer_used: Lexical and theological decisions on וּכְלִבְּךָ.
  rationale: The expanded phrase clarifies the relationship without replacing the heart metaphor.
- pob_phrase: all this greatness
  simplified_phrase: all these great things
  preserved_meaning: The wording refers clearly to the full display of God's great action.
  reasoning_layer_used: Lexical decision on אֵת כָּל הַגְּדוּלָּה הַזֹּאת.
  rationale: This audited idiomatic alternative avoids narrowing the abstract noun to one particular work.
- pob_phrase: to make your servant know it
  simplified_phrase: to make your servant know them
  preserved_meaning: God caused David, his servant, to know these great things.
  reasoning_layer_used: Lexical decisions on לְהוֹדִיעַ and עַבְדֶּךָ.
  rationale: The wording directly retains the Hebrew verb's causative force.
translation_notes:
  risk_flags:
  - risk: The plural “great things” does not reproduce the Hebrew singular abstract noun “greatness.”
    mitigation: It is an audited idiomatic alternative that preserves the collective scope without introducing a single specific work.
  - risk: Readers may take “your word” as speech alone rather than God's covenant commitment.
    mitigation: Footnote [a] preserves “your promise” as a contextual alternative without narrowing the main text.
