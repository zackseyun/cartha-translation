translation:
  language: en
  text: Just then, the Cushite[a] arrived. He said, “My lord the king, I have good news for you! Yahweh has vindicated you today, freeing you from the grip of everyone who rose up against you.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Cushite was a man from Cush; older translations may call him “the Ethiopian.”
    reason: lexical_alternative
