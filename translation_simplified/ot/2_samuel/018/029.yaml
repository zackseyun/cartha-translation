translation:
  language: en
  text: The king asked, “Is the young man Absalom all right?” Ahimaaz answered, “I saw a great commotion[a] when Joab sent the king’s servant and me, your servant, but I did not know what was happening.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean a large crowd or a great uproar.
    reason: lexical_alternative
