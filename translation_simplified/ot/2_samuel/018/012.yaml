translation:
  language: en
  text: But the man answered Joab, “Even if I were paid a thousand pieces of silver, weighed out into my hands, I would not raise my hand against the king’s son. We heard the king command you, Abishai, and Ittai, ‘Protect the young man Absalom for me.’[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew wording here is difficult; the translation follows the king’s similar command in 18:5.
    reason: textual_variant
