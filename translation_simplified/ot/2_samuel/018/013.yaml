translation:
  language: en
  text: Or suppose I had betrayed the king’s son and put his life in danger. Nothing is hidden from the king. Then you yourself would have stood aside.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: if I had dealt falsely against his life
  simplified_phrase: suppose I had betrayed the king’s son and put his life in danger
  preserved_meaning: The speaker imagines acting treacherously against Absalom’s life without specifying that he was killed.
  reasoning_layer_used: POB translation and immediate narrative context
  rationale: This makes the threat to Absalom clear while preserving the POB’s broader wording.
- pob_phrase: and no matter is hidden from the king
  simplified_phrase: Nothing is hidden from the king.
  preserved_meaning: The king would learn what happened.
  reasoning_layer_used: POB translation
  rationale: A direct sentence replaces the abstract wording without changing its claim.
- pob_phrase: then you yourself would have stood aside
  simplified_phrase: Then you yourself would have stood aside.
  preserved_meaning: Joab would distance himself rather than support the speaker.
  reasoning_layer_used: applied revision
  rationale: The intentionally restored wording is retained because it is already clear.
interpretive_expansions:
- pob_phrase: his life
  rendering: the king’s son ... his life
  claim: The pronoun refers to Absalom, the king’s son.
  evidence:
  - The immediate narrative concerns the king’s command to spare Absalom.
  - The speaker says the king would discover the act against him.
  confidence: high
  alternatives_preserved:
  - Absalom’s personal name remains implicit, as in the POB.
translation_notes:
  risk_flags:
  - risk: “Put his life in danger” interprets the treachery as life-threatening.
    mitigation: It preserves the POB’s focus on Absalom’s life without narrowing the act to a completed killing.
