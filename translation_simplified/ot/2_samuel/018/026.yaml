translation:
  language: en
  text: The watchman saw another man running.[a] He called to the gatekeeper, “Look! A man is running alone.” The king said, “He is bringing news too.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “saw another messenger”; the Hebrew can describe someone running or someone bringing a report, often good news.
    reason: lexical_alternative
