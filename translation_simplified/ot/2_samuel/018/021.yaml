- pob_phrase: what you have seen
  simplified_phrase: what you saw
  preserved_meaning: The Cushite must report the events he personally witnessed.
  reasoning_layer_used: POB lexical decision for אֲשֶׁר רָאִיתָה
  rationale: The simple past is more natural here and remains an approved lexical alternative.
- pob_phrase: bowed down to Joab
  simplified_phrase: bowed low before Joab
  preserved_meaning: The Cushite physically showed respectful deference to Joab.
  reasoning_layer_used: POB lexical decision for וַיִּשְׁתַּחוּ
  rationale: “Bowed low” keeps the physical gesture without suggesting worship or requiring full prostration.
- pob_phrase: and ran
  simplified_phrase: then ran off
  preserved_meaning: After bowing, the Cushite immediately departed at a run.
  reasoning_layer_used: POB lexical decision for וַיָּרֹץ and narrative sequence
  rationale: “Ran off” makes the departure clear while preserving the narrative pace.
