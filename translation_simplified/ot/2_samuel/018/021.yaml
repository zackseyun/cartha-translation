translation:
  language: en
  text: Then Joab said to the Cushite,[a] “Go tell the king what you saw.” The Cushite bowed low before Joab, then ran off.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Cushi,” if this is a personal name; traditionally, “the Ethiopian.”
    reason: lexical_alternative
