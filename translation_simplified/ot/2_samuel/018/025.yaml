translation:
  language: en
  text: The watchman called out and reported this to the king. The king said, “If he is alone, he has news to tell.”[a][b] The man kept coming closer and closer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “there is news in his mouth.”
    reason: source_note
  - marker: b
    text: The Hebrew can mean simply “news,” though here it may imply good news.
    reason: lexical_alternative
