- pob_phrase: called out and told the king
  simplified_phrase: called out and reported this to the king
  preserved_meaning: The watchman audibly informed the king of what he saw.
  reasoning_layer_used: Lexical decisions for וַיִּקְרָא and וַיַּגֵּד לַמֶּלֶךְ
  rationale: “Reported this” makes the watchman’s official action clear without adding new information.
- pob_phrase: there is news in his mouth
  simplified_phrase: he has news to tell
  preserved_meaning: The lone man is carrying a spoken report.
  reasoning_layer_used: Lexical decisions for בְּשׂוֹרָה and בְּפִיו, with the POB footnote
  rationale: The main text explains the idiom naturally, while a footnote preserves its Hebrew image.
- pob_phrase: he kept coming nearer and nearer
  simplified_phrase: The man kept coming closer and closer
  preserved_meaning: He continued approaching with steadily decreasing distance.
  reasoning_layer_used: Lexical decision for וַיֵּלֶךְ הָלוֹךְ וְקָרֵב
  rationale: Naming “the man” avoids an unclear pronoun while retaining the progressive movement.
