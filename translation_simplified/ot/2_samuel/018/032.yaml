translation:
  language: en
  text: The king asked the Cushite[a], “Is the young man Absalom safe and well?” The Cushite answered, “May my lord the king’s enemies, and all who rise up against you to harm you, end up like that young man.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A Cushite was a person from Cush.
    reason: cultural_note
  - marker: b
    text: The Cushite answers indirectly, implying that Absalom has died without saying so plainly.
    reason: cultural_note
