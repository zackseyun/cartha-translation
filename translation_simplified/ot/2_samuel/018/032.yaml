  preserved_meaning: The king asks about Absalom’s overall welfare, including his safety.
  reasoning_layer_used: POB lexical decision for הֲשָׁלוֹם and footnote a
  rationale: “Safe and well” expresses the broad sense of welfare in familiar English.
- pob_phrase: all who rise up against you for evil
  simplified_phrase: all who rise up against you to harm you
  preserved_meaning: The phrase includes anyone who opposes the king with harmful intent.
  reasoning_layer_used: POB lexical decisions for קָמוּ עָלֶיךָ and לְרָעָה
  rationale: “To harm you” clearly states the hostile purpose while retaining the broad image of rising against the king.
- pob_phrase: be like that young man
  simplified_phrase: end up like that young man
  preserved_meaning: The Cushite wishes Absalom’s fate on the king’s enemies while reporting it indirectly.
  reasoning_layer_used: POB lexical decision for כַנַּעַר and footnote b
  rationale: “End up like” clarifies the reference to Absalom’s fate without directly announcing his death.
