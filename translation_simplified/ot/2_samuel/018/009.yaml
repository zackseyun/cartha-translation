  text: Absalom unexpectedly came upon David’s men while he was riding his mule. The mule went beneath the tangled branches of a large terebinth tree[a]. Absalom’s head became caught in the tree, leaving him hanging between heaven and earth as the mule continued on without him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a great oak.” The Hebrew word may refer more generally to a large tree, but “terebinth” is more precise here.
    reason: lexical_alternative
