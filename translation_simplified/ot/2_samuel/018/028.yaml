translation:
  language: en
  text: Ahimaaz called to the king, “Peace!”[a] He bowed low before the king, with his face to the ground. Then he said, “Blessed be Yahweh your God! He has handed over the men who raised their hands against my lord the king.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “Peace!” can also mean “All is well!” or announce good news.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: called out and said to the king
  simplified_phrase: called to the king
  preserved_meaning: Ahimaaz raised his voice to address the king.
  reasoning_layer_used: Lexical decision for וַיִּקְרָא
  rationale: The shorter wording removes repetition while retaining the audible call.
- pob_phrase: bowed down before the king with his face to the ground
  simplified_phrase: bowed low before the king, with his face to the ground
  preserved_meaning: Ahimaaz physically prostrated himself in respect before David.
  reasoning_layer_used: Lexical decisions for וַיִּשְׁתַּחוּ and לְאַפָּיו אָרְצָה
  rationale: “Bowed low” clearly links the action with the vivid face-to-ground posture.
- pob_phrase: has delivered up the men who lifted their hand against
  simplified_phrase: has handed over the men who raised their hands against
  preserved_meaning: Yahweh gave the hostile men into the king’s power while preserving the Hebrew image of raised hands.
  reasoning_layer_used: Lexical decisions for סִגַּר and נָשְׂאוּ אֶת יָדָם
  rationale: Common verbs replace formal wording without reducing the action to the abstract word “rebelled.”
