translation:
  language: en
  text: 'When the Ammonites realized that they had made themselves repulsive to David,[a] they sent out to hire military help: 20,000 Aramean foot soldiers from Beth-rehob and Zobah, the king of Maacah with 1,000 men, and 12,000 men from Tob.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, they had become “a stench” to David.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may instead refer to “Ish-tob” as a place or clan name.
    reason: alternative_reading
