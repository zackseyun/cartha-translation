translation:
  language: en
  text: The Arameans fled from Israel. David killed seven hundred charioteers[a] and forty thousand horsemen. He also struck down Shobach, the commander of their army[b], and Shobach died there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “seven hundred chariot” or “chariot force,” so the exact referent is uncertain. 1 Chronicles 19:18 reads “seven thousand chariots.”
    reason: textual_variant
  - marker: b
    text: Or “the commander of his army”; the Hebrew suffix is singular.
    reason: lexical_alternative
