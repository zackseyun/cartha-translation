- pob_phrase: Aram fled from before Israel
  simplified_phrase: The Arameans fled from Israel
  preserved_meaning: The people of Aram retreated in the face of Israel.
  reasoning_layer_used: POB lexical decision for אֲרָם and מִפְּנֵי
  rationale: The wording replaces a literal Hebrew idiom with natural English while retaining Aram as the people involved.
- pob_phrase: David killed seven hundred charioteers and forty thousand horsemen from Aram
  simplified_phrase: David killed seven hundred charioteers and forty thousand horsemen
  preserved_meaning: David killed the stated numbers from both parts of the Aramean force.
  reasoning_layer_used: POB lexical decisions for רֶכֶב and פָּרָשִׁים
  rationale: The prior sentence already identifies the Arameans, so repeating “from Aram” is unnecessary.
- pob_phrase: and he died there
  simplified_phrase: and Shobach died there
  preserved_meaning: Shobach died there after David struck him down.
  reasoning_layer_used: POB lexical decision for וַיָּמָת שָׁם and immediate context
  rationale: Repeating the name removes an unclear pronoun without adding new meaning.
