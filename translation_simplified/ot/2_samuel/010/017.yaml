translation:
  language: en
  text: When David received the report, he gathered all Israel. He crossed the Jordan and came to Helam. Then the Arameans lined up for battle against David and fought him.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: When it was reported to David
  simplified_phrase: When David received the report
  preserved_meaning: David received an unspecified report, and the messenger remains unnamed.
  reasoning_layer_used: POB lexical decision for וַיֻּגַּד לְדָוִד
  rationale: The active wording is easier to read while preserving the impersonal report.
- pob_phrase: Then Aram drew up in battle formation
  simplified_phrase: Then the Arameans lined up for battle
  preserved_meaning: The people of Aram deployed themselves for combat.
  reasoning_layer_used: POB lexical decision for וַיַּעַרְכוּ אֲרָם
  rationale: The wording replaces a national collective and formal military phrase with clear common English.
- pob_phrase: to meet David and fought with him
  simplified_phrase: against David and fought him
  preserved_meaning: The Arameans approached David as opponents and engaged him in battle.
  reasoning_layer_used: POB lexical decisions and footnote for לִקְרַאת דָּוִד and וַיִּלָּחֲמוּ עִמּוֹ
  rationale: The hostile wording prevents modern readers from mistaking “with” for fighting as David’s allies.
