- pob_phrase: Is David honoring your father in your sight
  simplified_phrase: Do you really think David is honoring your father
  preserved_meaning: The princes challenge Hanun’s view of David’s motives.
  reasoning_layer_used: Lexical decision for בְּעֵינֶיךָ and theological decision on royal-political suspicion
  rationale: The natural question preserves the idiom’s skeptical force without presenting the accusation as fact.
- pob_phrase: comforters
  simplified_phrase: messengers to comfort you after your father’s death
  preserved_meaning: David sent envoys whose stated purpose was to console Hanun when his father died.
  reasoning_layer_used: POB cultural note and lexical decision for מְנַחֲמִים
  rationale: The wording explains the courtly role and names whose death occasioned the visit.
- pob_phrase: to search the city, to spy it out, and to overthrow it
  simplified_phrase: to investigate the city, spy on it, and overthrow it
  preserved_meaning: The advisers accuse David’s servants of investigation, espionage, and intended conquest.
  reasoning_layer_used: Lexical decisions for חֲקוֹר, רגל, and הפך
  rationale: The three hostile actions remain distinct in natural English.
