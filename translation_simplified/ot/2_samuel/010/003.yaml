translation:
  language: en
  text: The Ammonite princes said to Hanun, their lord, “Do you really think David is honoring your father by sending messengers to comfort you after your father’s death? Didn’t David send his servants to investigate the city, spy on it, and overthrow it?”
  philosophy: optimal-equivalence
