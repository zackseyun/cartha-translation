translation:
  language: en
  text: David struck Moab. He made the Moabites lie on the ground and measured them with a line.[a] He marked off two lengths of the line for death and a full length to keep alive. So Moab became subject to David, serving him and bringing him tribute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The line divided the Moabites into measured groups: two portions were assigned to death and one portion was spared.'
    reason: cultural_note
