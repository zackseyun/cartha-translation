translation:
  language: en
  text: David defeated Hadadezer son of Rehob,[a] king of Zobah, when Hadadezer went to regain his power at the River.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew has “Hadadezer”; some ancient textual traditions and the parallel in 1 Chronicles have “Hadarezer.”
    reason: textual_variant
  - marker: b
    text: This may also mean “regain his control” or “reestablish his rule”; the Hebrew expression is literally “restore his hand.”
    reason: lexical_alternative
  - marker: c
    text: “The River” most likely means the Euphrates River.
    reason: cross_reference
