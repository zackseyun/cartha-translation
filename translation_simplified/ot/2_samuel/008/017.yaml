translation:
  language: en
  text: Zadok son of Ahitub and Ahimelech son of Abiathar served as priests.[a] Seraiah served as secretary.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “chief ministers” or “royal officials.” The Hebrew word normally means “priests,” but it may have a broader court role here.
    reason: lexical_alternative
  - marker: b
    text: Or “scribe.” This official was responsible for writing and administration.
    reason: lexical_alternative
