translation:
  language: en
  text: David set up military posts in Aram of Damascus.[a] Aram became David’s servants and paid him tribute. Yahweh gave David victory wherever he went.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aram is the Hebrew name for the region traditionally called Syria; here it refers to the Aramean kingdom centered on Damascus.
    reason: cultural_note
