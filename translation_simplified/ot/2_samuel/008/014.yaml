translation:
  language: en
  text: David set up military posts throughout Edom, and all the Edomites came under David’s rule as his servants.[a] Yahweh gave David victory wherever he went.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “all Edom became servants to David”; the nation’s name stands for its people.
    reason: simplification_note
  - marker: b
    text: Or “Yahweh saved or delivered David wherever he went.” Here the wording refers to deliverance in battle.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: He placed garrisons in Edom; throughout all Edom he placed garrisons
  simplified_phrase: David set up military posts throughout Edom
  preserved_meaning: David established military forces across Edom to control the conquered territory.
  reasoning_layer_used: Lexical decision for נְצִבִים and the distributive force of בְכָל אֱדוֹם
  rationale: The repeated clauses are combined, while “throughout” preserves their comprehensive scope.
- pob_phrase: all Edom became servants to David
  simplified_phrase: all the Edomites came under David’s rule as his servants
  preserved_meaning: The conquered people of Edom entered servile subjection to David.
  reasoning_layer_used: Lexical rationale for עֲבָדִים and POB footnote a
  rationale: The wording identifies Edom’s people and makes their coerced political subjection clear.
- pob_phrase: And Yahweh gave David victory wherever he went
  simplified_phrase: Yahweh gave David victory wherever he went
  preserved_meaning: David’s military success came from Yahweh.
  reasoning_layer_used: Theological decision for יְהוָה and lexical decision for וַיּוֹשַׁע
  rationale: The clear POB wording and the personal divine name are retained.
interpretive_expansions:
- pob_phrase: all Edom became servants to David
  rendering: all the Edomites came under David’s rule as his servants
  claim: Their service was subjection to David’s rule after conquest, not voluntary household service.
  evidence:
  - The immediate context places military posts throughout conquered Edom.
  - The POB lexical rationale identifies servile subjection as salient here.
  confidence: high
  alternatives_preserved:
  - all Edom became servants to David
  - all the Edomites became servants to David
translation_notes:
  risk_flags:
  - risk: Combining the two military-post clauses removes the Hebrew repetition.
    mitigation: “Throughout Edom” preserves the repeated clause’s comprehensive scope.
  - risk: “As his servants” could imply a specific labor arrangement.
    mitigation: “Under David’s rule” limits the claim to the source-supported political subjection.
