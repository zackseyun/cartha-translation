  language: en
  text: David captured 1,700 of his horsemen and 20,000 foot soldiers.[a] Then he cut the hamstrings of the chariot horses to disable them, but left enough horses untouched for 100 chariots.
  philosophy: optimal-equivalence
  footnotes:
