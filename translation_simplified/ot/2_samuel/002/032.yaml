  reasoning_layer_used: The lexical decisions identify Asahel as the body being carried for burial and locate the tomb at Bethlehem.
  rationale: Stating “body” and placing Bethlehem with the movement makes the burial sequence immediately clear.
- pob_phrase: Then Joab and his men traveled all night
  simplified_phrase: Then Joab and his men traveled all night.
  preserved_meaning: Joab’s group kept traveling for the entire night.
  reasoning_layer_used: The lexical decision supports sustained travel without specifying a formal military march.
  rationale: The direct wording is already clear and preserves the full duration.
- pob_phrase: daybreak came upon them at Hebron
  simplified_phrase: Daybreak found them at Hebron.
  preserved_meaning: Joab and his men were at Hebron when daylight came.
  reasoning_layer_used: The Hebrew idiom and POB footnote describe dawn overtaking them at Hebron without fixing their arrival time.
  rationale: This natural image preserves the dawn event without turning it into a precise arrival claim.
