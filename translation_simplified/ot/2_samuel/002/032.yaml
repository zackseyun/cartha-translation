translation:
  language: en
  text: They carried Asahel’s body to Bethlehem and buried him in his father’s tomb.[a] Then Joab and his men traveled all night. Daybreak found them at Hebron.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “his father’s grave.” The Hebrew word can mean either a grave or a tomb used for family burial.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew idiom literally says, “it became light for them at Hebron.”
    reason: lexical_alternative
