translation:
  language: en
  text: Joab son of Zeruiah and David’s men went out and met Abner’s group at the pool of Gibeon.[a] Joab’s group sat on one side of the pool, and Abner’s group sat on the other.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The pool may have been a constructed water reservoir.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the servants of David
  simplified_phrase: David’s men
  preserved_meaning: They were David’s retainers and fighting men, not household servants in the narrow modern sense.
  reasoning_layer_used: POB lexical decision for וְעַבְדֵי דָוִד
  rationale: This avoids a misleading modern sense while retaining their relationship to David.
- pob_phrase: met them together
  simplified_phrase: met Abner’s group
  preserved_meaning: Joab’s party encountered the opposing party named in the preceding verse at the same place.
  reasoning_layer_used: POB lexical decision for וַיִּפְגְּשׁוּם and immediate context
  rationale: Naming the antecedent makes the encounter clear without changing who was met.
- pob_phrase: these sat on one side ... and those on the other side
  simplified_phrase: Joab’s group sat on one side ... and Abner’s group sat on the other
  preserved_meaning: The two opposing parties took positions on opposite sides of the same pool.
  reasoning_layer_used: POB idiom rationale for אֵלֶּה ... וְאֵלֶּה and the repeated spatial phrase
  rationale: Replacing vague demonstratives with group names makes the scene immediately understandable.
