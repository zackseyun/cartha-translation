simplification_decisions:
- pob_phrase: and also his two wives
  simplified_phrase: with his two wives
  preserved_meaning: David’s two wives accompanied him when he went up there.
  reasoning_layer_used: Lexical decision for וְגַם and narrative syntax
  rationale: Using “with” expresses the shared movement more naturally in English.
- pob_phrase: Ahinoam the Jezreelite
  simplified_phrase: Ahinoam from Jezreel
  preserved_meaning: Ahinoam is identified by her place of origin.
  reasoning_layer_used: Lexical decision for הַיִּזְרְעֵלִית
  rationale: “From Jezreel” is clearer than the less familiar gentilic “Jezreelite.”
- pob_phrase: Nabal the Carmelite
  simplified_phrase: Nabal, a man from Carmel
  preserved_meaning: Nabal, not Abigail, is identified as being from Carmel.
  reasoning_layer_used: Lexical decision for הַכַּרְמְלִי and POB footnote
  rationale: The expanded wording makes the place reference and its attachment immediately clear.
