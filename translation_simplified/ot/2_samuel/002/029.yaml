translation:
  language: en
  text: Abner and his men traveled through the Arabah region all that night. They crossed the Jordan, went all the way through Bithron,[a] and arrived at Mahanaim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Bithron” may be the name of a place, or it may mean the whole ravine or gorge region.
    reason: lexical_alternative
