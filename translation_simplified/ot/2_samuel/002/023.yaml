translation:
  language: en
  text: But Asahel refused to turn away. So Abner struck him in the belly[a] with the butt end of his spear. The spear passed through him and came out his back. Asahel fell and died on the spot. Everyone who came to the place where he had fallen and died stopped and stood still.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some older English versions say “the fifth rib,” but the Hebrew term here probably refers more generally to the belly or abdomen.
    reason: lexical_alternative
