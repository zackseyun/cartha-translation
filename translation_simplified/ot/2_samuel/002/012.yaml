simplification_decisions:
- pob_phrase: went out from Mahanaim to Gibeon
  simplified_phrase: set out from Mahanaim for Gibeon
  preserved_meaning: Abner and Ish-bosheth’s servants began traveling from Mahanaim toward Gibeon.
  reasoning_layer_used: Lexical decisions for וַיֵּצֵא, מִמַּחֲנַיִם, and גִּבְעֹנָה
  rationale: “Set out from … for” expresses the journey in natural modern English.
- pob_phrase: Ish-bosheth son of Saul
  simplified_phrase: Ish-bosheth, Saul’s son
  preserved_meaning: Ish-bosheth is identified as Saul’s son.
  reasoning_layer_used: Lexical decision for בֶּן שָׁאוּל
  rationale: The possessive form is easier to read while keeping the same family relationship.
- pob_phrase: the servants of Ish-bosheth
  simplified_phrase: the servants of Ish-bosheth
  preserved_meaning: The group consists of people serving Ish-bosheth in this military-political setting.
  reasoning_layer_used: Lexical decision for וְעַבְדֵי
  rationale: “Servants” is retained because broader terms such as “men” would weaken the stated relationship.
translation_notes:
  risk_flags:
  - risk: Modern readers may hear “servants” as domestic workers.
    mitigation: The term is retained to preserve the source’s broader service relationship without assigning an unsupported rank.
