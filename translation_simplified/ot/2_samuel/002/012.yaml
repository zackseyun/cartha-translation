translation:
  language: en
  text: Then Abner son of Ner and the servants of Ish-bosheth,[a] Saul’s son, set out from Mahanaim for Gibeon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The same man is called Eshbaal in 1 Chronicles 8:33 and 9:39.
