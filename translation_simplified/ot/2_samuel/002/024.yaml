translation:
  language: en
  text: Joab and Abishai chased Abner. The sun went down, and they reached the hill of Ammah, opposite Giah[a], on the way to the wilderness of Gibeon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in front of Giah.” The Hebrew can describe a place as either in front of or opposite another place.
    reason: lexical_alternative
  - marker: b
    text: Or “by the road to the wilderness of Gibeon.” The Hebrew may emphasize the route taken.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Joab and Abishai pursued Abner, and the sun went down
  simplified_phrase: Joab and Abishai chased Abner. The sun went down
  preserved_meaning: They continued a hostile pursuit until sunset.
  reasoning_layer_used: POB lexical decisions for וַיִּרְדְּפוּ and וְהַשֶּׁמֶשׁ בָּאָה
  rationale: “Chased” is common English for hostile pursuit, and the sentence break clarifies the sequence.
- pob_phrase: they came as far as the hill of Ammah
  simplified_phrase: they reached the hill of Ammah
  preserved_meaning: The hill of Ammah was the point they reached.
  reasoning_layer_used: POB lexical decisions for וְהֵמָּה בָּאוּ and עַד
  rationale: “Reached” expresses the endpoint directly without changing the movement.
- pob_phrase: which is opposite Giah on the way to the wilderness of Gibeon
  simplified_phrase: opposite Giah, on the way to the wilderness of Gibeon
  preserved_meaning: The wording retains both the hill’s relation to Giah and its route toward Gibeon’s wilderness.
  reasoning_layer_used: POB lexical decisions for אֲשֶׁר עַל־פְּנֵי גִיחַ and דֶּרֶךְ מִדְבַּר גִּבְעוֹן
  rationale: Removing “which is” makes the geographic description easier to follow while footnotes preserve both ambiguities.
