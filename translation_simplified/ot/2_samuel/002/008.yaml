  preserved_meaning: Abner’s identity and military office under Saul remain explicit.
  reasoning_layer_used: POB lexical decision for שַׂר צָבָא אֲשֶׁר לְשָׁאוּל
  rationale: Making the title a short sentence reduces the burden of the long opening clause.
- pob_phrase: Ish-bosheth son of Saul
  simplified_phrase: Saul’s son Ish-bosheth
  preserved_meaning: Ish-bosheth is still identified as Saul’s son.
  reasoning_layer_used: POB lexical decisions for the filial construction and personal name
  rationale: The reordered relationship is more natural in common English.
- pob_phrase: brought him over to Mahanaim
  simplified_phrase: brought him across to Mahanaim
  preserved_meaning: Abner caused Ish-bosheth to pass over to Mahanaim without specifying the route.
  reasoning_layer_used: POB lexical decision for וַיַּעֲבִרֵהוּ
  rationale: Across preserves the source movement image more clearly than the potentially vague over.
