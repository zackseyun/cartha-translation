translation:
  language: en
  text: But Abner son of Ner was the commander of Saul’s army. He took Saul’s son Ish-bosheth[a] and brought him across to Mahanaim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ish-bosheth is called Eshbaal in 1 Chronicles 8:33 and 9:39.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Abner son of Ner, the commander of Saul’s army
