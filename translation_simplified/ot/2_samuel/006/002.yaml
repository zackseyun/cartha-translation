translation:
  language: en
  text: David set out with everyone who was with him from Baale-judah[a] to bring the ark of God up from there. The ark is called by the Name[b]—the name of Yahweh of Armies, who is enthroned above the cherubim.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Baalah of Judah”; the unusual Hebrew form may refer to the place also associated with Kiriath-jearim.
    reason: alternative_reading
  - marker: b
    text: Or “over which the name of Yahweh of Armies is called”; the Hebrew naming formula is compressed.
    reason: lexical_alternative
  - marker: d
    text: Or “who dwells between the cherubim.”
    reason: lexical_alternative
