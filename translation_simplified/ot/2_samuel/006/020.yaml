translation:
  language: en
  text: Then David went back to bless his household. But Michal daughter of Saul came out to meet him and said, “How honorable the king of Israel looked today! You uncovered yourself in full view of the slave girls of your slaves, like one of the vulgar fellows shamelessly uncovering himself!”
