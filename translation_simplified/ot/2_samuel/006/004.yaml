translation:
  language: en
  text: They moved it from Abinadab’s house on the hill,[a] together with the ark of God. Ahio walked in front of the ark.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Abinadab’s house in Gibeah.” The Hebrew may refer either to a hill or to the place named Gibeah.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: They carried it
  simplified_phrase: They moved it
  preserved_meaning: They transported the object away from Abinadab’s house without specifying exactly how.
  reasoning_layer_used: Lexical decision for וַיִּשָּׂאֻהוּ and narrative context
  rationale: “Moved” is clearer here and avoids suggesting that they carried it by hand.
- pob_phrase: which was on the hill
  simplified_phrase: on the hill
  preserved_meaning: Abinadab’s house was located on the hill.
  reasoning_layer_used: Lexical decision for אֲשֶׁר בַּגִּבְעָה
  rationale: Removing the relative clause makes the location easier to read while retaining the preferred sense.
- pob_phrase: and Ahio was walking before the ark
  simplified_phrase: Ahio walked in front of the ark
  preserved_meaning: Ahio proceeded ahead of the ark during its transport.
  reasoning_layer_used: Lexical decisions for הֹלֵךְ and לִפְנֵי הָאָרוֹן
  rationale: A separate sentence and ordinary spatial wording make the procession clear.
