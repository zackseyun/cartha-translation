translation:
  language: en
  text: David and the whole community of Israel celebrated before Yahweh with all kinds of cypress-wood instruments,[a] as well as lyres, harps, tambourines, rattles,[b] and cymbals.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “with all woods of cypresses,” probably referring to various wooden instruments; the exact kind of tree is uncertain.
    reason: lexical_alternative
  - marker: b
    text: The exact instrument is uncertain; it was probably a shaken percussion instrument, perhaps a sistrum.
    reason: lexical_alternative
