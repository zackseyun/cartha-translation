translation:
  language: en
  text: When they came to Nacon’s grain-threshing place,[a] the oxen stumbled.[b] So Uzza reached out and took hold of the ark of God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The name may also be spelled “Nachon”; less likely, the phrase may mean “the established threshing place.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also mean that the oxen slipped or nearly upset the ark.
    reason: lexical_alternative
