simplification_decisions:
- pob_phrase: When David had finished offering ... he blessed
  simplified_phrase: David finished presenting ... Then he blessed
  preserved_meaning: David completed the sacrifices before blessing the gathered people.
  reasoning_layer_used: Lexical decisions for וַיְכַל and מֵהַעֲלוֹת
  rationale: Two direct sentences make the sequence clear without changing the actions.
- pob_phrase: offering the burnt offering and the peace offerings
  simplified_phrase: presenting the burnt offering and the peace offerings
  preserved_meaning: David carried out both specified kinds of sacrifice.
  reasoning_layer_used: Lexical decisions for מֵהַעֲלוֹת, הָעֹלָה, and וְהַשְּׁלָמִים
  rationale: “Presenting” avoids awkward repetition while retaining both ritual terms.
- pob_phrase: Yahweh of hosts
  simplified_phrase: Yahweh of hosts
  preserved_meaning: The covenant name and the broad traditional divine title remain intact.
  reasoning_layer_used: Theological decision for יְהוָה and lexical decision for צְבָאוֹת
  rationale: The title is retained and explained without reducing its broad sense to armies alone.
translation_notes:
  risk_flags:
  - risk: “Burnt offering” and “peace offerings” may be unfamiliar ritual terms.
    mitigation: They remain because they identify two distinct kinds of sacrifice.
  - risk: Modern readers may not understand “hosts” as a divine title.
    mitigation: The footnote gives one possible sense while preserving the title’s breadth.
