translation:
  language: en
  text: David was not willing to bring the ark of Yahweh into the City of David.[a] Instead, he redirected it to the house of Obed-edom the Gittite.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “up to the City of David.”
    reason: lexical_alternative
  - marker: b
    text: That is, Obed-edom, the man from Gath.
    reason: simplification_note
simplification_decisions:
- pob_phrase: So David was not willing to bring the ark of Yahweh to himself into the City of David
  simplified_phrase: David was not willing to bring the ark of Yahweh into the City of David
  preserved_meaning: David decided not to take the ark to his intended destination in his own city.
  reasoning_layer_used: The lexical decisions identify willingness and destination as the main ideas.
  rationale: Removing “to himself” avoids awkward repetition without changing the destination.
- pob_phrase: but David turned it aside to the house
  simplified_phrase: Instead, he redirected it to the house
  preserved_meaning: David changed the ark’s destination and sent it elsewhere.
  reasoning_layer_used: The lexical decision for וַיַּטֵּהוּ supports directing the ark elsewhere.
  rationale: “Redirected” states the concrete change of course in natural modern English.
- pob_phrase: Obed-edom the Gittite
  simplified_phrase: Obed-edom the Gittite
  preserved_meaning: Obed-edom is identified by his connection with Gath.
  reasoning_layer_used: The lexical decision preserves the conventional gentilic while allowing explanation.
  rationale: The title remains in the text, and the footnote explains it for new readers.
translation_notes:
  risk_flags:
  - risk: Omitting “to himself” may reduce the emphasis on David’s personal intended location.
    mitigation: “Into the City of David” retains the specific destination, and the context identifies it with David.
