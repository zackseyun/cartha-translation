  reasoning_layer_used: POB lexical decision for וַיֻּגַּד and לֵאמֹר
  rationale: The recast removes an awkward passive quotation formula without inventing a messenger.
- pob_phrase: the house of Obed-edom and all that belongs to him
  simplified_phrase: Obed-edom’s household and everything he owns
  preserved_meaning: Yahweh blessed Obed-edom’s household, dependents, and possessions.
