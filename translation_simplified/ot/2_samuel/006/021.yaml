simplification_decisions:
- pob_phrase: chose me above your father and above all his house
  simplified_phrase: chose me over your father and his whole royal house
  preserved_meaning: Yahweh selected David rather than Saul and his royal line.
  reasoning_layer_used: POB lexical decision for the comparative preposition and dynastic house
  rationale: “Chose me over” is natural English, while “royal house” preserves the dynastic sense.
- pob_phrase: to appoint me ruler over the people of Yahweh, over Israel
  simplified_phrase: to make me ruler over Yahweh’s people, Israel
  preserved_meaning: Yahweh gave David authority over his covenant people, namely Israel.
  reasoning_layer_used: POB lexical decisions for appoint, ruler, and the appositional Israel
  rationale: The shorter wording keeps both David’s authority and Israel’s identity as Yahweh’s people.
- pob_phrase: and I celebrated before Yahweh
  simplified_phrase: I celebrated before Yahweh
  preserved_meaning: David describes his joyful public action in Yahweh’s presence.
  reasoning_layer_used: POB lexical decision for וְשִׂחַקְתִּי
  rationale: One direct statement avoids duplicating the celebration or adding a causal meaning.
