translation:
  language: en
  text: There was a worthless man[a] there named Sheba son of Bichri, from the tribe of Benjamin. He sounded the trumpet[b] and said, “We have no share in David’s rule and no inheritance in the son of Jesse. People of Israel, every man should return to his own home or camp!”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a wicked man” or “a scoundrel”; the Hebrew describes his character rather than naming him as a follower of Belial.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says shofar, a horn used as a public signal and traditionally understood as a ram’s horn.
    reason: cultural_note
  - marker: c
    text: The Hebrew rallying cry is literally “Every man to his tents.”
    reason: simplification_note
