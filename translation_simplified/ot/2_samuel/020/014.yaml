translation:
  language: en
  text: He went through the territories of all Israel’s tribes to Abel and Beth-maacah. All the Berites[a] gathered and followed him too.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew “all the Berites.” Some translations have “all the Bichrites,” connecting them with Sheba son of Bichri.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: He passed through all the tribes of Israel
  simplified_phrase: He went through the territories of all Israel’s tribes
  preserved_meaning: He traveled through the geographic regions belonging to Israel’s tribes.
  reasoning_layer_used: Lexical rationale for בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  rationale: “Territories” prevents readers from mistaking the tribes for groups of people he physically passed through.
- pob_phrase: all the Berites assembled
  simplified_phrase: All the Berites gathered
  preserved_meaning: The entire named people group came together.
  reasoning_layer_used: Lexical decision for וַיִּקָּהֲלוּ
  rationale: “Gathered” is more familiar than “assembled” and retains the collective action.
- pob_phrase: and also followed after him
  simplified_phrase: and followed him too
  preserved_meaning: The Berites joined his movement after gathering.
  reasoning_layer_used: Lexical rationale for וַיָּבֹאוּ אַף אַחֲרָיו
  rationale: The shorter idiom is natural English and keeps the force of “also.”
interpretive_expansions:
- pob_phrase: through all the tribes of Israel
  rendering: through the territories of all Israel’s tribes
  claim: The movement was through tribal regions rather than through the people themselves.
  evidence:
