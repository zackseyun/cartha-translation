translation:
  language: en
  text: When David returned to his home in Jerusalem, he took the ten concubines[a] he had left to guard the house and placed them under guard. He provided for them, but he did not have sexual relations with them. They remained confined until they died, living like widows even though David was still alive.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Concubines were women with a recognized but lower-status marital position in the royal household.
    reason: cultural_note
simplification_decisions:
- pob_phrase: came to his house at Jerusalem
  simplified_phrase: returned to his home in Jerusalem
  preserved_meaning: David came back to his royal residence in Jerusalem.
  reasoning_layer_used: lexical decision for בֵּיתוֹ and immediate narrative context
  rationale: “Returned home” expresses the movement naturally without narrowing “house” to “palace.”
- pob_phrase: had left to keep the house
  simplified_phrase: had left to guard the house
  preserved_meaning: The women had been left to watch over the residence.
  reasoning_layer_used: lexical decision for הִנִּיחַ לִשְׁמֹר הַבַּיִת
  rationale: “Guard” clearly conveys the source verb without adding a separate duty.
- pob_phrase: put them in guarded custody ... kept confined until the day of their death
  simplified_phrase: placed them under guard ... remained confined until they died
  preserved_meaning: They lived under continuing guarded confinement for the rest of their lives.
  reasoning_layer_used: doctrine realignment for בֵּית מִשְׁמֶרֶת and צְרֻרוֹת
  rationale: The shorter sentences retain both active guarding and lifelong confinement.
