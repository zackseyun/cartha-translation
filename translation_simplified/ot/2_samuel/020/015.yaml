translation:
  language: en
  text: They came to Abel-beth-maacah and besieged him there.[a] They piled up a siege ramp against the city until it stood against the outer fortification. All the troops with Joab were attacking the city, trying to bring down the wall.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “besieged the city.” The Hebrew says “him,” focusing on Sheba inside the city.
    reason: alternative_reading
