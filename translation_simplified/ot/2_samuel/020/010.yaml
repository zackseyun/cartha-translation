translation:
  language: en
  text: But Amasa was not watching out for the sword in Joab’s hand. Joab struck him in the belly[a] with it, and his entrails spilled onto the ground. Joab did not strike him a second time; Amasa died. Then Joab and his brother Abishai pursued Sheba son of Bichri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “at the fifth rib,” as some older English versions read; here the Hebrew term more likely means the belly or abdomen.
    reason: lexical_alternative
