translation:
  language: en
  text: Then she said, “Long ago, people used to say, ‘Be sure to ask for advice at Abel.’[a] That was how they settled a matter.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Abel is a shortened name for the city Abel-beth-maacah.
    reason: cultural_note
  - marker: b
    text: The Hebrew may also mean “brought the matter to an end.”
    reason: lexical_alternative
