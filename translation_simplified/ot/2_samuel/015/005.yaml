translation:
  language: en
  text: Whenever a man came near to bow before him,[a] he would reach out his hand, take hold of the man, and kiss him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “to show him respect.” The Hebrew describes bowing as an act of honor, not necessarily worship.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And whenever a man came near to bow down to him
  simplified_phrase: Whenever a man came near to bow before him
  preserved_meaning: The man approaches and makes a physical gesture of respect.
  reasoning_layer_used: POB lexical decisions for וְהָיָה, בִּקְרָב, and לְהִשְׁתַּחֲוֺת לוֹ
  rationale: Removing the opening “And” and using “bow before” makes the repeated action more natural.
- pob_phrase: take hold of him
  simplified_phrase: take hold of the man
  preserved_meaning: Absalom physically takes hold of the approaching man.
  reasoning_layer_used: POB lexical decision for וְהֶחֱזִיק לוֹ
  rationale: Repeating “the man” prevents confusion between the two male pronouns.
- pob_phrase: he would reach out his hand
  simplified_phrase: he would reach out his hand
  preserved_meaning: Absalom extends his hand as part of the welcoming gesture.
  reasoning_layer_used: POB lexical decision for וְשָׁלַח אֶת יָדוֹ and grounding review
  rationale: Retaining “his hand” preserves the concrete source image and clarifies the next action.
