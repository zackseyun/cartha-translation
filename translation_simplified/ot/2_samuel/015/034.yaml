translation:
  language: en
  text: But if you return to the city, tell Absalom, ‘My king, I will serve you. Just as I served your father in the past, so now I will serve you.’ Then you will undermine Ahithophel’s advice and help me.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: say to Absalom
  simplified_phrase: tell Absalom
  preserved_meaning: David instructs him what to say directly to Absalom.
  reasoning_layer_used: POB translation and immediate context
  rationale: “Tell” is more natural in this instruction while preserving direct speech.
- pob_phrase: I will be your servant, O king
  simplified_phrase: My king, I will serve you
  preserved_meaning: He is to present himself as Absalom’s loyal servant.
  reasoning_layer_used: POB translation
  rationale: The verbal form expresses the same pledge in clearer modern English.
- pob_phrase: you will frustrate Ahithophel’s counsel for me
  simplified_phrase: you will undermine Ahithophel’s advice and help me
  preserved_meaning: He will obstruct Ahithophel’s plans for David’s benefit.
  reasoning_layer_used: POB translation and source-language clause
  rationale: “Will” preserves the stated result, while the rest makes the obstruction and benefit clear.
translation_notes:
  risk_flags:
