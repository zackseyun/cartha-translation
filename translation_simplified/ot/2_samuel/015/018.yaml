  text: All his servants passed by at his side. All the Cherethites, all the Pelethites, and all the Gittites also passed before the king. The Gittites numbered six hundred men, all of whom had come on foot with him from Gath.[a]
  philosophy: optimal-equivalence
  footnotes:
