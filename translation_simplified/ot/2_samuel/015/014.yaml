  text: Then David told all his servants who were with him in Jerusalem, “Get up! Let’s flee, or none of us will escape from Absalom. Leave at once, or he may quickly catch us, bring disaster on us, and kill the people in the city with the sword.”
  philosophy: optimal-equivalence
