  preserved_meaning: Absalom may inflict deadly sword violence on Jerusalem’s inhabitants.
  reasoning_layer_used: Lexical decision and POB footnote for לְפִי חָרֶב
  rationale: The wording makes the idiom’s lethal force clear while preserving the sword image.
