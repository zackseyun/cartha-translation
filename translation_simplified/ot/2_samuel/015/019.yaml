  text: Then the king said to Ittai, who was from Gath,[a] “Why are you coming with us too? Go back and stay with the king.[b] You are a foreigner, and you are also an exile away from your own place.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Ittai the Gittite.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew does not identify which king is meant; it may refer to the royal authority remaining in Jerusalem.
    reason: alternative_reading
