translation:
  language: en
  text: Absalom would get up early and stand beside the road leading to the city gate. Whenever someone with a dispute came to the king for a legal decision,[a] Absalom would call out, “What city are you from?” The person would answer, “Your servant is from one of the tribes of Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean that the person had a complaint or legal case.
    reason: lexical_alternative
