  preserved_meaning: Ahithophel belonged to the group plotting alongside Absalom.
  reasoning_layer_used: POB lexical decisions for בַּקֹּשְׁרִים and עִם
  rationale: This explains “conspirators” as people actively plotting while preserving Ahithophel’s membership in the group.
- pob_phrase: turn Ahithophel’s counsel into foolishness
