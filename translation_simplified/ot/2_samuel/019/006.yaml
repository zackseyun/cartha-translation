translation:
  language: en
  text: Then Joab came to the king inside the house[a] and said, “Today you have shamed all your servants[b], who saved your life today, along with the lives of your sons, daughters, wives, and concubines.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The house” probably means the royal residence or palace.
    reason: cultural_note
  - marker: b
    text: Hebrew says “shamed the faces of all your servants,” a concrete expression for public shame.
    reason: lexical_alternative
