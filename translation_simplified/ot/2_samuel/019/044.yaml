translation:
  language: en
  text: 'Then the man speaking for Israel answered the man speaking for Judah: “I have ten shares in the king[a], and I have a greater claim to David than you do. Why did you treat me as if I did not matter? Was I not the first to propose bringing back my king?[b]” But the men of Judah spoke more harshly than the men of Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “ten shares” likely refer to the ten northern tribes’ claim to the king.
    reason: cultural_note
  - marker: b
    text: Or, “Did I not speak first about bringing back my king?”
    reason: alternative_reading
