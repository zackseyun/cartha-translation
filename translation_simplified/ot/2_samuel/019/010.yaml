translation:
  language: en
  text: All across the tribes of Israel, the people were arguing with one another.[a] They were saying, “The king saved us from the power of our enemies and rescued us from the Philistines. But now he has fled from the land because of Absalom.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “debating with one another”; the Hebrew describes widespread disagreement among the tribes.
    reason: lexical_alternative
  - marker: b
    text: Or “fled away from Absalom”; the Hebrew indicates that Absalom caused the king to flee.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: all the people were disputing throughout all the tribes of Israel
  simplified_phrase: All across the tribes of Israel, the people were arguing with one another
  preserved_meaning: The disagreement was active and widespread across Israel.
  reasoning_layer_used: POB lexical decision for נָדוֹן and scope decision for בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  rationale: The rewrite uses ordinary wording while keeping the force and national scope of the dispute.
- pob_phrase: delivered us from the hand of our enemies
  simplified_phrase: saved us from the power of our enemies
  preserved_meaning: The king freed the people from their enemies’ control.
  reasoning_layer_used: POB lexical rationale for the Hebrew “hand” idiom
  rationale: “Power” states the idiom’s meaning directly for readers unfamiliar with biblical phrasing.
- pob_phrase: he rescued us from the hand of the Philistines
  simplified_phrase: rescued us from the Philistines
  preserved_meaning: The king freed Israel from Philistine power.
  reasoning_layer_used: POB distinction between הִצִּילָנוּ and מִלְּטָנוּ
  rationale: The shorter wording avoids repeating the idiom while preserving the separate act of rescue.
