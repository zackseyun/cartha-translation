translation:
  language: en
  text: 'Then the king got up and took his seat at the gate. Word spread among all the people: “Look, the king is sitting at the gate.” So they all came before the king. But[a] Israel had fled, each man to his own tent.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “And Israel fled.” The Hebrew can be translated “and,” but “but” highlights the contrast here.
    reason: lexical_alternative
  - marker: b
    text: “Each man to his own tent” means that the men scattered to their homes or tribal territories.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Then the king arose and sat in the gate
  simplified_phrase: Then the king got up and took his seat at the gate
  preserved_meaning: The king rose and assumed a visible public position at the gate.
  reasoning_layer_used: Lexical decisions for וַיָּקָם and וַיֵּשֶׁב בַּשָּׁעַר
  rationale: Common wording replaces “arose” while “took his seat” preserves the public action.
- pob_phrase: And they told all the people, saying
  simplified_phrase: Word spread among all the people
  preserved_meaning: The people were informed that the king was at the gate.
  reasoning_layer_used: Lexical decision for הִגִּידוּ לֵאמֹר
  rationale: The impersonal report is recast as natural English without inventing a specific messenger.
- pob_phrase: Then all the people came before the king
  simplified_phrase: So they all came before the king
  preserved_meaning: All the people responded by entering the king’s presence.
  reasoning_layer_used: Lexical decision for וַיָּבֹא כָל הָעָם לִפְנֵי הַמֶּלֶךְ
  rationale: The pronoun avoids repetition while retaining the public audience scene.
translation_notes:
  risk_flags:
