  rationale: “Reached” clearly expresses movement up to the Jordan without implying a crossing.
- pob_phrase: Judah
  simplified_phrase: the people of Judah
  preserved_meaning: Judah refers collectively to the tribe’s people.
  reasoning_layer_used: POB footnote and lexical decision for וִיהוּדָה
  rationale: The expansion prevents readers from mistaking Judah for a place or one person.
- pob_phrase: to go to meet the king, to bring the king across the Jordan
  simplified_phrase: to meet him and bring him across the river
  preserved_meaning: They intended both to meet the king and to bring him across the Jordan.
  reasoning_layer_used: Lexical decisions for לָלֶכֶת לִקְרַאת and לְהַעֲבִיר
  rationale: Pronouns and “the river” remove heavy repetition while keeping both purposes distinct.
