translation:
  language: en
  text: Barzillai, a man from Gilead, came down from Rogelim. He crossed the Jordan with the king to see him off there.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean that Barzillai went with the king across the Jordan to escort him.
    reason: lexical_alternative
