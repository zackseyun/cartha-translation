  simplified_phrase: I want no part in this
  preserved_meaning: David firmly rejects their course of action.
  reasoning_layer_used: POB lexical decision for מַה לִּי וְלָכֶם
  rationale: The direct statement makes the Hebrew rebuke understandable without retaining its opaque idiom.
- pob_phrase: that you should be an adversary to me today
  simplified_phrase: Why are you opposing me today?
  preserved_meaning: The sons of Zeruiah are acting against David rather than serving his purpose.
  reasoning_layer_used: POB lexical and theological decisions for שָׂטָן
  rationale: “Opposing” uses the common-noun sense and avoids suggesting the proper name Satan.
- pob_phrase: Shall any man be put to death
