  preserved_meaning: David questions whether a man should receive judicial death that day.
  reasoning_layer_used: POB lexical decisions for יוּמַת אִישׁ and אִישׁ
  rationale: “Executed” states the legal force plainly while retaining the source’s masculine representative noun.
