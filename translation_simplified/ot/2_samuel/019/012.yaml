  text: 'King David sent a message to the priests Zadok and Abiathar: “Tell the elders of Judah, ‘Why should you be the last to bring the king back to his home? All Israel’s message[a] has already reached the king at his home.’”'
  philosophy: optimal-equivalence
  footnotes:
