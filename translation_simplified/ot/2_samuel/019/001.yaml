- pob_phrase: was deeply shaken
  simplified_phrase: was overcome with grief
  preserved_meaning: The king experienced intense emotional distress over Absalom’s death.
  reasoning_layer_used: Lexical decision for וַיִּרְגַּז and the mourning context.
  rationale: The wording names the emotion directly while keeping its intensity.
- pob_phrase: the chamber over the gate
  simplified_phrase: the room above the gate
  preserved_meaning: The king entered an upper room built over the gate.
  reasoning_layer_used: Lexical decision for עֲלִיַּת הַשַּׁעַר.
  rationale: “Room above” is more familiar English while preserving the architecture.
- pob_phrase: As he went, he said
  simplified_phrase: On the way, he said
  preserved_meaning: The king spoke this lament while going to the room.
  reasoning_layer_used: Lexical decision for וְכֹה אָמַר בְּלֶכְתּוֹ.
  rationale: The shorter phrase expresses the same movement and timing naturally.
