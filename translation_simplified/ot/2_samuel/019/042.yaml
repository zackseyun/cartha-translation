translation:
  language: en
  text: Now all the men of Israel came to the king and asked him, “Why did our brothers, the men of Judah, steal you away[a] and bring you, your household, and all David’s men across the Jordan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Steal you away” means that Judah acted without including the other Israelites; it does not mean they literally kidnapped David.
    reason: lexical_alternative
