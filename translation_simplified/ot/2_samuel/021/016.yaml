translation:
  language: en
  text: Ishbi-benob,[a] one of Rapha’s descendants,[b] carried a bronze spear weighing about 7½ pounds (3.4 kilograms). He was armed with a new sword,[c] and he declared that he would strike David down.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew form of this name is uncertain; “Jesbi-benob” and other readings are possible.
    reason: textual_variant
  - marker: b
    text: Rapha refers here to the family line associated with the giant Rephaim.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew says only “new”; “sword” is implied and is the traditional understanding.
    reason: lexical_alternative
