translation:
  language: en
  text: So the king took Armoni and Mephibosheth, the two sons of Saul and Rizpah daughter of Aiah. He also took the five sons that Michal[a], Saul’s daughter, had with Adriel son of Barzillai, a man from Meholah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts and ancient interpreters read “Merab” instead of “Michal.” Compare 1 Samuel 18:19, where Adriel is said to have married Merab, Saul’s daughter.
    reason: textual_variant
