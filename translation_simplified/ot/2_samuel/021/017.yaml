translation:
  language: en
  text: 'But Abishai son of Zeruiah came to help him. He struck the Philistine and killed him. Then David’s men made a solemn oath to him: “You must not go into battle with us again, so that you do not put out the lamp of Israel.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the light of Israel.” The lamp is a picture of David’s vital role in sustaining the nation.
    reason: lexical_alternative
