translation:
  language: en
  text: The king summoned the Gibeonites and spoke to them. The Gibeonites were not Israelites but survivors of the Amorites. The Israelites had sworn an oath to them, but Saul had tried to kill them because of his zeal for Israel and Judah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “zeal” can also mean “jealousy.”
    reason: lexical_alternative
