  rationale: “Summoned” makes the king’s official call immediately clear.
- pob_phrase: were not from the sons of Israel, but from the remnant of the Amorites
  simplified_phrase: were not Israelites but survivors of the Amorites
  preserved_meaning: The Gibeonites belonged to the surviving Amorite population rather than Israel.
  reasoning_layer_used: POB lexical and theological decisions for בני ישראל and יֶתֶר
  rationale: Common national wording replaces the familial idiom and the less familiar term “remnant.”
- pob_phrase: had sought to strike them down
