translation:
  language: en
  text: Once again, war broke out with the Philistines at Gob. Elhanan son of Jaare-oregim[b], a man from Bethlehem, struck down Goliath, a man from Gath.[a] The shaft of his spear was as thick as the beam on a weaver’s loom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: First Chronicles 20:5 gives a different account, saying that Elhanan killed Lahmi, Goliath’s brother. Many think the wording here in Samuel is difficult or was corrupted in copying and understand it in harmony with Chronicles.
    reason: textual_variant
  - marker: b
    text: The Hebrew name “Jaare-oregim” is difficult. Some think “oregim,” meaning “weavers,” was accidentally copied here from the end of the verse.
    reason: textual_variant
