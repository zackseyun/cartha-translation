  preserved_meaning: Saul and his household bear moral and judicial guilt for bloodshed.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Household” clarifies the biblical use of “house,” while “bloodguilt” preserves culpability for bloodshed.
- pob_phrase: because he put the Gibeonites to death
