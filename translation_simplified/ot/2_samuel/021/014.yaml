translation:
  language: en
  text: They buried the bones of Saul and his son Jonathan in the territory of Benjamin, at Zela, in the tomb of Saul’s father, Kish. They carried out everything the king had commanded. After that, God responded favorably to the plea concerning the land.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be translated, “God answered prayer for the land.” The Hebrew implies a favorable response to a plea.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Saul and of Jonathan his son
  simplified_phrase: Saul and his son Jonathan
  preserved_meaning: Jonathan is identified as Saul’s son, and both men’s bones were buried.
  reasoning_layer_used: POB lexical decision for שָׁאוּל וִיהוֹנָתָן בְּנוֹ
  rationale: Natural English removes the repeated “of” without changing the relationship.
- pob_phrase: in the land of Benjamin
  simplified_phrase: in the territory of Benjamin
  preserved_meaning: Benjamin refers to the geographic tribal region.
  reasoning_layer_used: POB lexical decision for בְּאֶרֶץ בִּנְיָמִן
  rationale: “Territory” makes the geographic sense clear to modern readers.
- pob_phrase: in the tomb of Kish his father
  simplified_phrase: in the tomb of Saul’s father, Kish
  preserved_meaning: The tomb belonged to Kish, who was Saul’s father.
  reasoning_layer_used: POB lexical rationale for בְּקֶבֶר קִישׁ אָבִיו
  rationale: Naming Saul removes the unclear pronoun reference.
interpretive_expansions:
- pob_phrase: God responded to the plea for the land
  rendering: God responded favorably to the plea concerning the land
  claim: God’s response to the implied supplication was favorable and concerned the land.
  evidence:
