translation:
  language: en
  text: He handed them over to the Gibeonites. They hanged them[a] on the mountain before Yahweh, and all seven fell together. They were put to death early in the harvest season, when the barley harvest was beginning.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean that they impaled them or displayed them publicly; the exact method is uncertain.
    reason: lexical_alternative
