translation:
  language: en
  text: Later, there was another war with the Philistines at Gob. Then Sibbecai the Hushathite struck down Saph,[a] who was one of Rapha’s descendants.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew has “Saph”; the parallel account in 1 Chronicles 20:4 has “Sippai.”
    reason: textual_variant
  - marker: b
    text: Or “one of the descendants of the giant”; the Hebrew may refer to a man named Rapha or to a giant/Rephaite family line.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: After this, there was again war
  simplified_phrase: Later, there was another war
  preserved_meaning: The story moves forward to a further conflict.
  reasoning_layer_used: Lexical decision for אַחֲרֵי כֵן and וַתְּהִי עוֹד הַמִּלְחָמָה
  rationale: “Later” and “another war” express the sequence and repeated conflict in ordinary English.
- pob_phrase: who was among the descendants of Rapha
  simplified_phrase: who was one of Rapha’s descendants
  preserved_meaning: Saph belonged to the family line associated with Rapha.
  reasoning_layer_used: Lexical and theological decisions for אֲשֶׁר בִּילִדֵי הָרָפָה
  rationale: The possessive form is easier to read while retaining Rapha as the controlling main-text choice.
translation_notes:
  risk_flags:
  - risk: Readers may assume Rapha is certainly a personal name.
    mitigation: Footnote b preserves the possible giant or Rephaite-lineage reading.
