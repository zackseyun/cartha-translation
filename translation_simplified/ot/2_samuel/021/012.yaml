translation:
  language: en
  text: Then David went to the people of Jabesh-gilead and took the bones of Saul and his son Jonathan. The people there had stolen the bones from the public square of Beth-shan. The Philistines had hung them there[a] on the day they struck down Saul on Gilboa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hung them” may also mean “displayed them” or, more strongly, “impaled them.”
    reason: lexical_alternative
