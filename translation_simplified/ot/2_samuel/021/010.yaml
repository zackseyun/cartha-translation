translation:
  language: en
  text: Then Rizpah daughter of Aiah took sackcloth and spread it on the rock for herself. From the beginning of harvest until water poured down from the heavens onto the bodies,[a] she kept the birds of the sky from landing on them by day and kept the wild animals of the field away by night.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, until rain fell on them from heaven.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: until water was poured on them from the heavens
  simplified_phrase: until water poured down from the heavens onto the bodies
  preserved_meaning: Water came down from above, almost certainly as rain, while retaining the Hebrew pouring image.
  reasoning_layer_used: POB lexical decision for עַד נִתַּךְ מַיִם עֲלֵיהֶם מִן הַשָּׁמָיִם
  rationale: The active wording is easier to follow without reducing the image to plain “rain.”
- pob_phrase: did not allow the birds of the sky to rest on them
  simplified_phrase: kept the birds of the sky from landing on them
  preserved_meaning: Rizpah prevented birds from settling on the bodies.
  reasoning_layer_used: POB lexical decisions for וְלֹא נָתְנָה and לָנוּחַ עֲלֵיהֶם
  rationale: “Landing” expresses what “rest” means for birds in natural modern English.
- pob_phrase: nor the wild animals of the field by night
  simplified_phrase: and kept the wild animals of the field away by night
  preserved_meaning: Rizpah also guarded the bodies from wild land animals during the night.
  reasoning_layer_used: POB lexical decision for חַיַּת הַשָּׂדֶה and the parallel clause
  rationale: The repeated verb makes the omitted action clear while preserving the day-and-night contrast.
interpretive_expansions:
- pob_phrase: on them
  rendering: onto the bodies
  claim: The pronoun refers to the bodies of those executed in the preceding context.
  evidence:
  - The preceding verses identify the exposed dead as the objects of Rizpah’s vigil.
  - The later birds and wild animals naturally threaten those same bodies.
  confidence: high
  alternatives_preserved:
  - onto them
translation_notes:
  risk_flags:
  - risk: Naming “the bodies” resolves a pronoun whose noun appears in the preceding context rather than this verse.
    mitigation: The later references return to “them,” preserving the verse’s pronoun pattern after clarifying its antecedent once.
