translation:
  language: en
  text: 'Then David said to Abishai and all his servants, “Look: my own son—my own flesh and blood—is trying to kill me. How much more should I expect this man from the tribe of Benjamin to curse me! Leave him alone and let him curse, because Yahweh has told him to.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “because Yahweh has said to him.” The Hebrew leaves what he said unstated, but the context implies the cursing.
    reason: lexical_alternative
