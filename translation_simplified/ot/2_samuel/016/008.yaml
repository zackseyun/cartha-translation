translation:
  language: en
  text: Yahweh has brought all the bloodshed connected with Saul’s family back on you.[a] You became king in Saul’s place, and now Yahweh has handed the kingdom over to your son Absalom. Look at the disaster you are in![b] This has happened because you are a man of bloodshed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “all the bloods of Saul’s house” and may also refer to bloodguilt connected with Saul’s family.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word can mean either evil or disaster; here it most likely refers to the disaster overtaking David.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: has brought back upon you all the blood of the house of Saul
  simplified_phrase: has brought all the bloodshed connected with Saul’s family back on you
  preserved_meaning: Yahweh is said to cause the bloodshed associated with Saul’s house to return upon David.
  reasoning_layer_used: lexical decisions for הֵשִׁיב and כָּל דְּמֵי בֵית שָׁאוּל
  rationale: “Connected with” explains the association without claiming that Saul’s family were necessarily the victims.
- pob_phrase: in whose place you reigned
  simplified_phrase: You became king in Saul’s place
  preserved_meaning: David succeeded Saul as king.
  reasoning_layer_used: lexical decision for אֲשֶׁר מָלַכְתָּ תַּחְתָּיו
  rationale: A separate sentence states the succession plainly.
- pob_phrase: has given the kingdom into the hand of Absalom your son
  simplified_phrase: has handed the kingdom over to your son Absalom
  preserved_meaning: Yahweh is said to transfer control of the kingdom to Absalom.
  reasoning_layer_used: lexical decision for וַיִּתֵּן ... אֶת־הַמְּלוּכָה בְּיַד
  rationale: The common idiom clearly conveys a transfer of royal power.
