  text: Ahithophel said to Absalom, “Go in to your father’s concubines[a]—have sexual relations with them. Your father left them to look after the royal house. Then all Israel will hear that you have made yourself repulsive to your father. The hands of everyone with you will be strengthened; they will become bolder.”
