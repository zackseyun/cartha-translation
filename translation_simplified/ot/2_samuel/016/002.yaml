translation:
  language: en
  text: The king asked Ziba, “What are all these for?” Ziba answered, “The donkeys are for the king’s household to ride. The bread and summer fruit[a] are for the young men[b] to eat. The wine is for anyone who becomes weary in the wilderness to drink.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “summer produce.” The Hebrew word can include fruit and other produce gathered in summer.
    reason: lexical_alternative
  - marker: b
    text: Or “attendants” or “servants.”
    reason: lexical_alternative
