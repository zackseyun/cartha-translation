translation:
  language: en
  text: David and his men continued down the road. Shimei moved along the hillside across from David. As he went, he kept cursing David, throwing stones toward him, and flinging dust.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: So David and his men went on the road
  simplified_phrase: David and his men continued down the road
  preserved_meaning: David and his men kept traveling along their route.
  reasoning_layer_used: POB lexical decision for וַיֵּלֶךְ and בַּדָּרֶךְ
  rationale: “Continued down the road” expresses ongoing travel in natural narrative English.
- pob_phrase: while Shimei went along on the hillside opposite him, going along and cursing
  simplified_phrase: Shimei moved along the hillside across from David. As he went, he kept cursing David
  preserved_meaning: Shimei remained on the facing hillside and cursed David as both continued moving.
  reasoning_layer_used: POB lexical decisions for בְּצֵלַע הָהָר, לְעֻמָּתוֹ, and הֹלֵךְ ... הָלוֹךְ
  rationale: Two sentences clarify the location and preserve the Hebrew emphasis on continuing action.
- pob_phrase: throwing stones opposite him and flinging dust
  simplified_phrase: throwing stones toward him, and flinging dust
  preserved_meaning: Shimei hurled stones in David’s direction and tossed dust as hostile acts.
  reasoning_layer_used: POB lexical decisions and applied revision for וַיְסַקֵּל בָּאֲבָנִים, לְעֻמָּתוֹ, and וְעִפַּר בֶּעָפָר
  rationale: “Toward him” preserves the repeated spatial direction without implying that the stones struck David.
translation_notes:
