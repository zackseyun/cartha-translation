translation:
  language: en
  text: After David had gone a short distance past the hilltop, Ziba, Mephibosheth’s servant, was there to meet him. He had two saddled donkeys loaded with two hundred loaves of bread, one hundred clusters of raisins, one hundred summer fruits,[a] and a wineskin full of wine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may refer specifically to figs, but the word can mean summer fruit more generally.
    reason: lexical_alternative
