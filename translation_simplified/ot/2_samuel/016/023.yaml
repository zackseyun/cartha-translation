simplification_decisions:
- pob_phrase: The counsel of Ahithophel that he gave in those days
  simplified_phrase: In those days, people treated Ahithophel’s advice
  preserved_meaning: The statement concerns the advice Ahithophel gave during that period without adding a habitual sense.
  reasoning_layer_used: POB lexical decisions for עֲצַת, יָעַץ, and בַּיָּמִים הָהֵם
  rationale: The active sentence is easier to follow while keeping “in those days” as a time reference.
- pob_phrase: so was all the counsel of Ahithophel both to David and to Absalom
  simplified_phrase: Both David and Absalom treated all his advice this way
  preserved_meaning: All Ahithophel’s counsel carried this extraordinary weight for both recipients.
  reasoning_layer_used: POB lexical decision for גַּם ... גַּם and theological rationale
  rationale: The separate sentence clearly names who held his advice in such high regard.
