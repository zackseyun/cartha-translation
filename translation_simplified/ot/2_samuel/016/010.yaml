translation:
  language: en
  text: But the king replied, “Why are you getting involved, sons of Zeruiah? If[a] he is cursing me because Yahweh told him, ‘Curse David,’ who has the right to ask him, ‘Why did you do this?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “He is cursing because Yahweh told him, ‘Curse David.’” The Hebrew can give an explanation rather than state a condition.
    reason: alternative_reading
