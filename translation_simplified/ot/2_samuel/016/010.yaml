- pob_phrase: What have I to do with you
  simplified_phrase: Why are you getting involved
  preserved_meaning: The king rebukes the sons of Zeruiah and distances himself from their proposed response.
  reasoning_layer_used: POB lexical decision for מַה לִּי וְלָכֶם
  rationale: The question expresses the idiom’s rebuking force in ordinary English.
- pob_phrase: If he is cursing because Yahweh has said to him
  simplified_phrase: If he is cursing me because Yahweh told him
  preserved_meaning: David allows that Shimei may be cursing David under Yahweh’s direction.
  reasoning_layer_used: POB lexical and theological decisions for כִּי, וְכִי, and אָמַר לוֹ
  rationale: “Told” is clearer than “has said,” while “if” preserves the conditional reading.
- pob_phrase: Why have you done so?
  simplified_phrase: Why did you do this?
  preserved_meaning: The quoted question challenges Shimei’s action.
  reasoning_layer_used: POB lexical decision for מַדּוּעַ עָשִׂיתָה כֵּן
  rationale: The simpler wording keeps the same rhetorical challenge.
