translation:
  language: en
  text: When King David reached Bahurim, a man came out from there. He belonged to a clan of Saul’s family, and his name was Shimei son of Gera. He kept coming out, cursing as he came.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “He kept coming out and cursing.” The Hebrew may describe repeated or sustained action.
    reason: lexical_alternative
