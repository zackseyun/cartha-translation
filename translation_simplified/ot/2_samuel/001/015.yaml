translation:
  language: en
  text: Then David called one of the young men and said, “Come here; strike him down.”[a] The young man struck him, and he died.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “attack him” or “fall upon him”; in this context, the attack was meant to be fatal.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Come near; strike him down.
  simplified_phrase: Come here; strike him down.
  preserved_meaning: David commands the young man both to approach and to strike the man down.
  reasoning_layer_used: The lexical decisions distinguish the approach command גַּשׁ from the violent command פְּגַע בּוֹ.
  rationale: “Come here” is more natural modern English while preserving the separate commands.
- pob_phrase: So he struck him
  simplified_phrase: The young man struck him
  preserved_meaning: The young man carried out David’s command by striking the man.
  reasoning_layer_used: The lexical decision for וַיַּכֵּהוּ keeps the strike separate from the death that follows.
  rationale: Naming the young man removes pronoun ambiguity without merging the action and result.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “strike him down” as nonfatal.
    mitigation: The next clause states that he died, and the footnote explains the fatal context.
