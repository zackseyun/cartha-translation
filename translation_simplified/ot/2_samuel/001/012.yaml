translation:
  language: en
  text: They mourned and wept, and they went without food until evening. They grieved for Saul and his son Jonathan, for Yahweh’s people, and for the people of Israel, because they had fallen by the sword.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: fasted until evening
  simplified_phrase: went without food until evening
  preserved_meaning: They abstained from food as part of their mourning through the end of the day.
  reasoning_layer_used: POB lexical decision for וַיָּצֻמוּ and עַד הָעָרֶב
  rationale: The wording explains fasting directly while preserving its duration and mournful setting.
- pob_phrase: for Saul, for Jonathan his son
  simplified_phrase: for Saul and his son Jonathan
  preserved_meaning: Jonathan is identified specifically as Saul’s son and as an object of grief.
  reasoning_layer_used: POB lexical decision for יְהוֹנָתָן בְּנוֹ
  rationale: Ordinary English word order removes possible confusion about whose son Jonathan was.
- pob_phrase: the house of Israel
  simplified_phrase: the people of Israel
  preserved_meaning: Israel is viewed collectively as a people.
  reasoning_layer_used: POB lexical decision for בֵּית יִשְׂרָאֵל
  rationale: The common collective expression is clearer than the biblical idiom “house of Israel.”
