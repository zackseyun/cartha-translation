  text: Do not report the news in Gath. Do not announce it in the streets of Ashkelon. Otherwise, the daughters of the Philistines will rejoice, and the daughters of the uncircumcised[a] will celebrate in triumph.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The uncircumcised” is a covenant term of reproach for the Philistines.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Do not tell it in Gath
  simplified_phrase: Do not report the news in Gath
  preserved_meaning: The news of Saul and Jonathan’s fall must not be reported in Gath.
  reasoning_layer_used: POB lexical decision for תַּגִּידוּ and immediate context
  rationale: “Report the news” makes the implied object clear in natural English.
- pob_phrase: lest ... rejoice, lest ... exult
  simplified_phrase: Otherwise ... will rejoice, and ... will celebrate in triumph
  preserved_meaning: The warning seeks to prevent the Philistine women’s increasingly intense celebration.
  reasoning_layer_used: POB lexical decisions for פֶּן, שׂמח, and עלז
  rationale: “Otherwise” replaces archaic “lest,” while “celebrate in triumph” preserves the stronger second verb.
- pob_phrase: the daughters of the uncircumcised
  simplified_phrase: the daughters of the uncircumcised[a]
  preserved_meaning: The literal covenant-based term of reproach remains in the text.
  reasoning_layer_used: POB theological decision on עֲרֵלִים
  rationale: The phrase is retained because a general insult would erase its covenantal force.
