translation:
  language: en
  text: I stood over him and put him to death, because I knew he could not survive his fall.[a] Then I took the crown from his head and the ornament from his arm.[b] I brought them here to you, my lord.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This is the Amalekite’s report to David. Compare 1 Samuel 31:4–5 for the earlier account of Saul’s death.
    reason: cross_reference
  - marker: b
    text: The Hebrew term refers to an ornament worn on the arm; it may also be translated “armlet” or “bracelet.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: he would not live after he had fallen
  simplified_phrase: he could not survive his fall
  preserved_meaning: The speaker says Saul’s fall left him certain to die.
  reasoning_layer_used: Lexical decision for כִּי יָדַעְתִּי כִּי לֹא יִחְיֶה and אַחֲרֵי נִפְלוֹ
  rationale: The shorter wording expresses the same stated reason in natural English.
- pob_phrase: the crown that was on his head
  simplified_phrase: the crown from his head
  preserved_meaning: The speaker removed Saul’s royal headpiece.
  reasoning_layer_used: Lexical decision for הַנֵּזֶר
  rationale: “From his head” makes the removal clear without repeating a heavy relative clause.
- pob_phrase: the armlet that was on his arm
  simplified_phrase: the ornament from his arm
  preserved_meaning: The item was an ornament worn on Saul’s arm.
  reasoning_layer_used: Lexical decisions for וְאֶצְעָדָה and זְרֹעוֹ
  rationale: “Ornament” is more immediately understandable, while the footnote retains the precise alternatives.
translation_notes:
  risk_flags:
  - risk: The Amalekite’s claim may appear to conflict with 1 Samuel 31:4–5.
    mitigation: The main text preserves his report without harmonizing it, and the footnote points readers to the earlier account.
  - risk: “Ornament” is broader than the POB term “armlet.”
    mitigation: The phrase “from his arm” preserves its location, and the footnote supplies the narrower terms.
