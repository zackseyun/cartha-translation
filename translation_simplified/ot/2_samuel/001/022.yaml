translation:
  language: en
  text: Jonathan’s bow did not draw back from the blood of the slain or the fat of mighty warriors.[a] Saul’s sword did not come back empty.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Fat” may also suggest the richest or choicest part, strengthening the picture of victory in battle.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: From the blood of the slain, from the fat of the mighty
  simplified_phrase: from the blood of the slain or the fat of mighty warriors
  preserved_meaning: The bow did not recoil from striking and killing powerful fighters.
  reasoning_layer_used: POB lexical decisions for מִן, חֲלָלִים, חֵלֶב, and גִּבּוֹרִים
  rationale: The reordered phrase keeps both battlefield images while clearly connecting them to the bow.
- pob_phrase: Jonathan’s bow did not turn back
  simplified_phrase: Jonathan’s bow did not draw back
  preserved_meaning: Jonathan’s bow remained effective and did not withdraw in battle.
  reasoning_layer_used: POB lexical decision for לֹא נָשׂוֹג אָחוֹר
  rationale: “Draw back” is natural for a bow and preserves the documented sense of withdrawal.
- pob_phrase: Saul’s sword did not return empty
  simplified_phrase: Saul’s sword did not come back empty
  preserved_meaning: Saul’s sword did not return without accomplishing its deadly purpose.
  reasoning_layer_used: POB lexical decision for לֹא תָשׁוּב רֵיקָם
  rationale: “Came back empty” uses common English while preserving the sword’s poetic personification.
