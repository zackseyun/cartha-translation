translation:
  language: en
  text: Then Absalom ordered his young men, “Watch Amnon carefully. When he is in a cheerful mood from the wine, I will tell you, ‘Strike Amnon!’ Then kill him. Do not be afraid. Did I not give you this order myself? Be strong and be courageous men.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Please watch
  simplified_phrase: Watch Amnon carefully
  preserved_meaning: Absalom urgently directs his men to watch Amnon for the right moment.
  reasoning_layer_used: Lexical decision for רְאוּ נָא
  rationale: Naming Amnon and adding “carefully” make the urgent directive clear.
- pob_phrase: when Amnon’s heart is merry with wine
  simplified_phrase: when he is in a cheerful mood from the wine
  preserved_meaning: The wine puts Amnon in good spirits without necessarily making him fully drunk.
  reasoning_layer_used: Lexical decision for כְּטוֹב לֵב אַמְנוֹן בַּיַּיִן and grounding review
  rationale: This states the idiom’s meaning directly and avoids an unclear heart expression.
- pob_phrase: be men of valor
  simplified_phrase: be courageous men
  preserved_meaning: Absalom calls his male retainers to act courageously in carrying out his violent order.
  reasoning_layer_used: Lexical and theological decisions for וִהְיוּ לִבְנֵי חָיִל
  rationale: “Courageous men” explains valor plainly while preserving the masculine martial force.
translation_notes:
  risk_flags:
  - risk: “Cheerful mood from the wine” could be read as full drunkenness.
    mitigation: The wording describes a wine-induced mood without claiming that Amnon was drunk.
