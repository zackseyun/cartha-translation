translation:
  language: en
  text: After this, David’s son Absalom had a beautiful sister named Tamar. Another of David’s sons, Amnon, loved her.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses the ordinary word for “love,” though what follows shows that Amnon’s feelings were corrupt. It could also be translated “was infatuated with her” or “desired her.”
    reason: lexical_alternative
