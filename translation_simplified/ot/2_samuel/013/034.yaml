translation:
  language: en
  text: But Absalom fled. The young man keeping watch looked up and saw many people coming along the road behind him,[a] from the mountainside.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew description of the road and mountainside is compressed; it may also mean “from the road behind him, from the mountainside.”
    reason: alternative_reading
