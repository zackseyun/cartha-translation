translation:
  language: en
  text: Then Jonadab replied. He was the son of Shimeah, David’s brother. “My lord, do not say, ‘They have killed all the king’s sons.’ Only Amnon is dead. Absalom had resolved to do this[a] ever since Amnon sexually violated his sister Tamar[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “this had been set on Absalom’s word or command,” meaning it had been fixed according to his settled intention.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb can also be rendered “humiliated” or, more explicitly in this context, “raped.”
    reason: lexical_alternative
