translation:
  language: en
  text: Amnon was so distressed over his sister Tamar that he made himself sick.[a] She was a virgin, and he could not see any way to do anything to her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “that he became sick.” The Hebrew can describe either making himself sick or becoming sick from his distress.
    reason: lexical_alternative
