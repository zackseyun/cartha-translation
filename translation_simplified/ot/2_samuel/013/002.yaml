- pob_phrase: because of Tamar his sister
  simplified_phrase: over his sister Tamar
  preserved_meaning: Tamar was the cause of Amnon’s distress, and their sibling relationship remains explicit.
  reasoning_layer_used: Lexical decisions for בַּעֲבוּר and אֲחֹתוֹ
  rationale: The new order sounds natural while preserving the cause and kinship.
- pob_phrase: for she was a virgin
  simplified_phrase: She was a virgin
  preserved_meaning: Tamar’s virginity explains why Amnon saw no feasible way to act toward her.
  reasoning_layer_used: Lexical decision for בְתוּלָה and immediate context
  rationale: A separate sentence makes the narrative logic easier to follow.
- pob_phrase: it seemed impossible in Amnon’s eyes to do anything to her
  simplified_phrase: he could not see any way to do anything to her
  preserved_meaning: From Amnon’s perspective, no feasible course of action was available.
  reasoning_layer_used: Lexical decisions for וַיִּפָּלֵא בְּעֵינֵי אַמְנוֹן and לַעֲשׂוֹת לָהּ מְאוּמָה
  rationale: This converts the Hebrew viewpoint idiom into clear English without specifying his later crime.
