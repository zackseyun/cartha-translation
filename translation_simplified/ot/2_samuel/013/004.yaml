    mitigation: Together they preserve the documented sense of visible physical decline.
  - risk: Modern readers may take Amnon’s word “love” as morally approving his desire.
    mitigation: The main text preserves the ordinary Hebrew verb, while the footnote gives the contextual lexical alternative.
