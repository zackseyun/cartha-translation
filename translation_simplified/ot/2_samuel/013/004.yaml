translation:
  language: en
  text: He asked him, “Why do you look so thin and weak morning after morning, son of the king? Won’t you tell me?” Amnon answered, “I love Tamar,[a] my brother Absalom’s sister.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I am in love with Tamar.” The Hebrew more literally says “I love Tamar.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: so gaunt
  simplified_phrase: so thin and weak
  preserved_meaning: Amnon’s physical condition shows visible decline rather than poverty.
  reasoning_layer_used: lexical decision for דַּל
  rationale: Common words make the visible weakness clear without changing its cause.
- pob_phrase: Will you not tell me?
  simplified_phrase: Won’t you tell me?
  preserved_meaning: The question still urges Amnon to explain himself.
  reasoning_layer_used: lexical decision for הֲלוֹא
  rationale: The contraction expresses the same expectation in natural speech.
- pob_phrase: the sister of my brother Absalom
  simplified_phrase: my brother Absalom’s sister
  preserved_meaning: Tamar is identified through Amnon’s relationship to Absalom.
  reasoning_layer_used: lexical decision for אֲחוֹת אַבְשָׁלֹם אָחִי
  rationale: The possessive form is easier to follow while preserving the relational emphasis.
translation_notes:
  risk_flags:
