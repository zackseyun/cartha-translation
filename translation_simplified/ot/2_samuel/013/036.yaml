  text: Just as he finished speaking, the king’s sons arrived. They raised their voices and wept. The king and all his servants also wept bitterly.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And as soon as he finished speaking, behold, the king’s sons came
  simplified_phrase: Just as he finished speaking, the king’s sons arrived
  preserved_meaning: The sons arrived immediately and unexpectedly when the speaker finished.
  reasoning_layer_used: POB lexical decisions for the temporal formula, וְהִנֵּה, and בָּאוּ
  rationale: “Just as” and “arrived” give the scene immediate movement without the archaic “behold.”
- pob_phrase: they raised their voices and wept
  simplified_phrase: They raised their voices and wept
  preserved_meaning: The sons began a loud lament.
  reasoning_layer_used: POB lexical decisions for וַיִּשְׂאוּ קוֹלָם and וַיִּבְכּוּ
  rationale: The wording is already clear and preserves the Hebrew image of lifted voices.
- pob_phrase: wept with very great weeping
