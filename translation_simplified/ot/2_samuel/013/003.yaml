translation:
  language: en
  text: Amnon had a friend named Jonadab. He was the son of David’s brother Shimeah, and he was very shrewd.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “very wise” or “very clever.” Here “shrewd” describes Jonadab’s keen intelligence without implying that he used it well.
