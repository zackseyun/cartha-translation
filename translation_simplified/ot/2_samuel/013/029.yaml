translation:
  language: en
  text: Absalom’s young men[a] carried out his command against Amnon.[b] Then all the king’s sons got up. Each mounted his mule and fled.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term can also mean Absalom’s servants or attendants.
    reason: lexical_alternative
  - marker: b
    text: In the previous verse, Absalom commanded them to strike Amnon down when he was affected by wine.
    reason: cross_reference
simplification_decisions:
- pob_phrase: did to Amnon as Absalom had commanded
  simplified_phrase: carried out his command against Amnon
  preserved_meaning: The young men did exactly what Absalom had ordered concerning Amnon.
  reasoning_layer_used: POB lexical decision and immediate context
  rationale: This replaces an opaque expression without stating the violent act more explicitly than the verse does.
- pob_phrase: all the king’s sons arose
  simplified_phrase: all the king’s sons got up
  preserved_meaning: David’s sons rose suddenly in reaction.
  reasoning_layer_used: POB lexical decision
  rationale: “Got up” is natural modern English while keeping the physical action.
- pob_phrase: and each mounted his mule and fled
  simplified_phrase: Each mounted his mule and fled.
  preserved_meaning: Every king’s son escaped urgently on his own mule.
  reasoning_layer_used: POB lexical decisions
  rationale: A separate sentence makes the rapid sequence easier to follow while retaining the distributive “each.”
translation_notes:
  risk_flags:
  - risk: “Carried out his command” leaves Amnon’s killing implicit in this verse.
    mitigation: The cross-reference footnote identifies the command given in the previous verse.
  - risk: “Young men” may be read as age-only rather than as men serving Absalom.
    mitigation: The lexical footnote preserves “servants” and “attendants” as contextual alternatives.
