translation:
  language: en
  text: Jehonadab told him, “Go to bed and pretend you are sick. When your father comes to visit you, tell him, ‘Please let my sister Tamar come and bring me food. Let her prepare the meal where I can watch, and I will eat it from her hand.’”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Lie down on your bed
  simplified_phrase: Go to bed
  preserved_meaning: Jehonadab tells Amnon to lie down in bed as part of the deception.
  reasoning_layer_used: Lexical decision for שְׁכַב עַל מִשְׁכָּבְךָ
  rationale: The approved alternative is shorter and more natural in modern English.
- pob_phrase: Please let Tamar my sister come and give me food
  simplified_phrase: Please let my sister Tamar come and bring me food
  preserved_meaning: Amnon asks his father to permit Tamar to come and personally provide him with food.
  reasoning_layer_used: Lexical decisions for תָּבֹא נָא and וְתַבְרֵנִי לֶחֶם
  rationale: This retains the request for permission without adding that David dispatches Tamar.
- pob_phrase: let her prepare the meal in my sight, so that I may watch
  simplified_phrase: Let her prepare the meal where I can watch
  preserved_meaning: Tamar is to prepare the meal within Amnon’s view while he watches.
  reasoning_layer_used: Lexical decisions for הַבִּרְיָה and לְמַעַן אֲשֶׁר אֶרְאֶה
  rationale: Combining the sight clauses avoids awkward repetition while preserving the visual action.
translation_notes:
  risk_flags:
  - risk: Combining the two sight clauses reduces their verbal repetition.
    mitigation: “Where I can watch” preserves both visible preparation and Amnon’s observation.
