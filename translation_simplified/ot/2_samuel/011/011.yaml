translation:
  language: en
  text: Uriah said to David, “The ark, Israel, and Judah are staying in temporary shelters. Joab, my lord, and his men are camped in the open countryside. How could I go home to eat and drink and lie with my wife? As surely as you live, and as your soul lives,[a] I will not do such a thing.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This is a solemn Hebrew oath formula that strongly confirms Uriah’s refusal.
    reason: source_note
simplification_decisions:
- pob_phrase: The ark, and Israel and Judah, are staying in shelters
  simplified_phrase: The ark, Israel, and Judah are staying in temporary shelters
  preserved_meaning: The ark and the people remain in makeshift wartime dwellings.
  reasoning_layer_used: POB lexical decision for יֹשְׁבִים בַּסֻּכּוֹת
  rationale: Adding “temporary” makes the kind of shelters clear without replacing the Hebrew image.
- pob_phrase: my lord Joab and the servants of my lord are camped in the open field
  simplified_phrase: Joab, my lord, and his men are camped in the open countryside
  preserved_meaning: Joab and the men under his authority remain exposed at the military camp.
  reasoning_layer_used: POB lexical decisions for אֲדֹנִי, עַל פְּנֵי הַשָּׂדֶה, and חֹנִים
  rationale: The shorter wording removes repetition while retaining Joab’s title, his men, and their exposed camp.
- pob_phrase: Shall I then go to my house to eat and to drink and to lie with my wife?
  simplified_phrase: How could I go home to eat and drink and lie with my wife?
  preserved_meaning: Uriah indignantly refuses the comforts and marital intimacy of home.
  reasoning_layer_used: POB lexical decision and alternative-reading note for וַאֲנִי אָבוֹא אֶל־בֵּיתִי
  rationale: “How could I” makes the rhetorical refusal immediately natural in modern English.
translation_notes:
  risk_flags:
  - risk: “His men” is broader than the literal “servants of my lord.”
    mitigation: Joab’s title and the military camping context preserve their subordinate role.
  - risk: “How could I” may sound more emotional than a formally worded question.
    mitigation: The POB rationale explicitly identifies the question as an indignant refusal.
