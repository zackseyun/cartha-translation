  reasoning_layer_used: POB lexical decision for וַיִּשְׁכַּב עִמָּהּ
  rationale: This states the biblical idiom plainly without becoming casual.
- pob_phrase: purifying herself from her uncleanness
  simplified_phrase: undergoing ritual cleansing from an uncleanness
  preserved_meaning: She was engaged in cleansing from ritual, not moral, uncleanness.
  reasoning_layer_used: POB lexical and theological decisions for the ritual-purity clause
