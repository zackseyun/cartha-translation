translation:
  language: en
  text: David sent messengers and had her brought to him. She came to him, and he had sexual relations with her. She was undergoing ritual cleansing from an uncleanness, likely connected with her menstrual period.[a] Then she returned home.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may instead mean, “She had completed her ritual cleansing from her uncleanness.”
    reason: alternative_reading
