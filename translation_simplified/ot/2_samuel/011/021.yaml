translation:
  language: en
  text: “Who struck down Abimelech son of Jerubbesheth?[a] Was it not a woman who threw the upper stone of a hand mill down on him from the wall?[b] He died at Thebez.[c] Why did you get so close to the wall?” Then say, “Your servant Uriah the Hittite is also dead.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew here says “Jerubbesheth”; Judges 9:1 has the more familiar form “Jerubbaal.”
    reason: alternative_reading
  - marker: b
    text: Or “a piece of a millstone”; the Hebrew likely means the upper stone.
    reason: lexical_alternative
  - marker: c
    text: See Judges 9:53 for this event.
    reason: cross_reference
