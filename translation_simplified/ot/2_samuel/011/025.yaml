translation:
  language: en
  text: 'David told the messenger, “Say this to Joab: ‘Do not think what happened was wrong,[a] because the sword devours one person as well as another. Press your attack against the city and tear it down.’ Then encourage him.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says, “Do not let this matter be evil in your eyes.”
    reason: lexical_alternative
