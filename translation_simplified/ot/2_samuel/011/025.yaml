  preserved_meaning: Joab is to intensify the siege and demolish the city.
  reasoning_layer_used: POB lexical decisions for הַחֲזֵק מִלְחַמְתְּךָ and וְהָרְסָהּ
  rationale: Concrete military wording makes both commands immediately clear.
