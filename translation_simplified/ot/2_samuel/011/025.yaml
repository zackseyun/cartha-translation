  preserved_meaning: David gives the messenger words to relay directly to Joab.
  reasoning_layer_used: POB lexical decision for כֹּה תֹאמַר
  rationale: The common formula gives the same instruction without archaic wording.
- pob_phrase: Do not let this matter be evil in your eyes
  simplified_phrase: Do not think what happened was wrong
  preserved_meaning: David tells Joab not to regard the reported event as wrong or objectionable.
  reasoning_layer_used: POB lexical decision and footnote for אַל יֵרַע בְּעֵינֶיךָ
  rationale: “Wrong” naturally preserves the idiom’s moral force while the footnote retains its image.
- pob_phrase: Strengthen your attack against the city and overthrow it
