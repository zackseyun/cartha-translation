translation:
  language: en
  text: After the mourning period ended, David sent for her and brought her into his home. She became his wife and gave birth to his son. But in Yahweh’s eyes, what David had done was evil.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: When the mourning was over
  simplified_phrase: After the mourning period ended
  preserved_meaning: The customary time of mourning after Uriah’s death came to an end.
  reasoning_layer_used: Lexical decision for הָאֵבֶל and וַיַּעֲבֹר
  rationale: “Mourning period” makes the social time period clear rather than suggesting that grief itself disappeared.
- pob_phrase: David sent and brought her into his house
  simplified_phrase: David sent for her and brought her into his home
  preserved_meaning: David summoned her and took her into his household.
  reasoning_layer_used: Lexical decision for וַיַּאַסְפָהּ אֶל־בֵּיתוֹ
  rationale: “Sent for her” supplies the natural English object while “home” clearly expresses entry into David’s household.
- pob_phrase: the thing that David had done was evil in the eyes of Yahweh
  simplified_phrase: in Yahweh’s eyes, what David had done was evil
  preserved_meaning: Yahweh morally condemned David’s conduct as evil.
  reasoning_layer_used: Lexical and theological decisions for וַיֵּרַע and בְּעֵינֵי יְהוָה
  rationale: The recast clause is easier to follow while retaining both the sight image and the full moral force of “evil.”
translation_notes:
  risk_flags:
  - risk: “Mourning period” may sound more formally fixed than the Hebrew requires.
    mitigation: It remains within the POB lexical alternative and identifies the social mourning interval without assigning a duration.
