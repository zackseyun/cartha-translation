  text: They told David, “Uriah did not go home.”[a] So David asked Uriah, “Haven’t you come from a journey? Why didn’t you go home?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew says “go down to his house” and repeats this wording in David’s question, probably describing the descent from the palace area to Uriah’s home.
    reason: cultural_note
