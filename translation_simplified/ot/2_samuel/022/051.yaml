translation:
  language: en
  text: He brings great salvation to his king. He shows covenant faithfulness to his anointed one[a]—to David and his offspring forever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “His anointed one” can also be translated “his Messiah.” Here it refers first to David and the kings from his line, while also echoing the broader messianic promise.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: He gives great salvation to his king
  simplified_phrase: He brings great salvation to his king
  preserved_meaning: The LORD grants comprehensive saving help to the Davidic king.
  reasoning_layer_used: Lexical decisions for מגדיל and יְשׁוּעוֹת
  rationale: “Brings” expresses the causative action in natural English while retaining “great salvation.”
- pob_phrase: shows covenant faithfulness to his anointed
  simplified_phrase: shows covenant faithfulness to his anointed one
  preserved_meaning: The LORD shows loyal covenant commitment toward the king he has anointed.
  reasoning_layer_used: Lexical and theological decisions for וְעֹשֶׂה חֶסֶד and לִמְשִׁיחוֹ
  rationale: Adding “one” makes the royal title natural without turning the covenant nuance into a separate syntactic claim.
- pob_phrase: to his anointed, to David and to his offspring forever
  simplified_phrase: to his anointed one—to David and his offspring forever
  preserved_meaning: David and his royal line receive God’s enduring covenant faithfulness.
  reasoning_layer_used: Lexical decisions for לִמְשִׁיחוֹ, לְדָוִד, וּלְזַרְעוֹ, and עַד עוֹלָם
  rationale: The dash clearly presents David and his offspring as identifying and extending the anointed king.
translation_notes:
  risk_flags:
  - risk: Modern readers may not recognize the royal and messianic force of “anointed one.”
    mitigation: The footnote identifies the immediate Davidic referent while preserving the broader messianic resonance.
