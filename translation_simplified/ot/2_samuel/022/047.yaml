translation:
  language: en
  text: Yahweh lives! May my rock be praised, and may God—the rock who saves me—be lifted high![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “the rock of my salvation”; also “my saving rock” or “the rock of my deliverance.”
