simplification_decisions:
- pob_phrase: and blessed be my rock
  simplified_phrase: May my rock be praised
  preserved_meaning: The line remains a reverent acclamation honoring God as the speaker’s rock.
  reasoning_layer_used: Lexical rationale for וּבָרוּךְ and the verse’s praise context
  rationale: The active praise wording is easier to understand while retaining the benedictory force.
- pob_phrase: and exalted be God
  simplified_phrase: and may God … be lifted high
  preserved_meaning: The line still calls for God to be exalted.
  reasoning_layer_used: Lexical rationale for וְיָרֻם
  rationale: “Be lifted high” expresses the exaltation image in common English.
- pob_phrase: the rock of my salvation
  simplified_phrase: the rock who saves me
  preserved_meaning: God remains the speaker’s rock and the source of his salvation.
  reasoning_layer_used: Lexical and theological decisions for צוּר and יֶשַׁע
  rationale: The clause explains the relationship directly without removing the rock metaphor.
interpretive_expansions:
- pob_phrase: the rock of my salvation
  rendering: the rock who saves me
  claim: The salvation belongs to and comes from God, who is pictured as the speaker’s rock.
  evidence:
