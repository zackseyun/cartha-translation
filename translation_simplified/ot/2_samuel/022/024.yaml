translation:
  language: en
  text: I lived with integrity in his sight[a], and I guarded myself against my own wrongdoing[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “I was whole or blameless before him.” It describes integrity, not absolute sinlessness.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word translated “wrongdoing” can also mean sin, guilt, or iniquity.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I was blameless before him
  simplified_phrase: I lived with integrity in his sight
  preserved_meaning: David claims moral and covenantal integrity before God, not absolute perfection.
  reasoning_layer_used: Lexical and theological decisions for תָמִים and לוֹ.
  rationale: This wording makes the relational sense clear while preserving the strong claim of integrity.
- pob_phrase: I kept myself from my iniquity
  simplified_phrase: I guarded myself against my own wrongdoing
  preserved_meaning: David actively watched himself so that he would not commit wrongdoing.
  reasoning_layer_used: Lexical decisions for וָאֶשְׁתַּמְּרָה and מֵעֲוֺנִי.
  rationale: “Guarded myself” preserves the reflexive image, while “wrongdoing” is clearer than “iniquity.”
translation_notes:
  risk_flags:
  - risk: “Lived with integrity” could be mistaken for a claim of sinless perfection.
    mitigation: Footnote [a] explicitly limits the claim to integrity rather than absolute sinlessness.
  - risk: “Wrongdoing” does not display the full range of sin, guilt, and iniquity.
    mitigation: Footnote [b] preserves the documented lexical range.
