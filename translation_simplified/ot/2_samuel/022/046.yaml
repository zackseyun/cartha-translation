translation:
  language: en
  text: The foreigners’ courage fails. They emerge trembling from their strongholds.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “The foreigners fade away”; the Hebrew image can describe withering or fading.
    reason: lexical_alternative
  - marker: b
    text: The difficult Hebrew verb may also mean “come cringing,” “come limping,” or, more literally, “gird themselves.”
    reason: lexical_alternative
  - marker: c
    text: Or “from their fortresses”; “from their prisons” or “from their enclosures” is also possible but less likely here.
    reason: lexical_alternative
