translation:
  language: en
  text: When I am in trouble, I call out to Yahweh; I cry out to my God. He hears[a] my voice from his temple[b], and my cry for help reaches his ears.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “He heard my voice,” following the Hebrew verb’s formal past-tense form.
    reason: lexical_alternative
  - marker: b
    text: “Temple” can also mean “palace” or “sanctuary” and may refer to God’s heavenly dwelling.
    reason: lexical_alternative
