  text: You rescued me from conflicts involving my own people.[a] You kept me at the head of nations. A people I had never known served under my rule.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may mean conflicts among David’s own people or conflicts involving them.
    reason: lexical_alternative
  - marker: b
    text: Or “A people I do not know will serve under my rule.”
    reason: lexical_alternative
