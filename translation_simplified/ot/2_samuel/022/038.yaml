translation:
  language: en
  text: I chased my enemies and destroyed them. I did not turn back until they were completely wiped out.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “until I had completely destroyed them” or “until they came to an end.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I pursued my enemies
  simplified_phrase: I chased my enemies
  preserved_meaning: The speaker actively followed his enemies in battle.
  reasoning_layer_used: The lexical decision lists “I chased” as a valid alternative for רדף.
  rationale: “Chased” is more immediately understandable than “pursued” while keeping the military action.
- pob_phrase: until they were consumed
  simplified_phrase: until they were completely wiped out
  preserved_meaning: The enemies were brought to a total and violent end.
  reasoning_layer_used: The lexical rationale for כלה requires completion of defeat and violent finality.
  rationale: “Wiped out” clearly conveys the force that modern readers may miss in “consumed.”
- pob_phrase: and I did not turn back until
  simplified_phrase: I did not turn back until
  preserved_meaning: He continued the pursuit without retreating before its completion.
  reasoning_layer_used: The lexical decision interprets שׁוב as turning back from pursuit.
  rationale: A separate sentence makes the continued action easier to follow without weakening it.
translation_notes:
  risk_flags:
  - risk: “Wiped out” can sound less formal than the POB wording.
    mitigation: The surrounding martial language and “completely” preserve the verse’s grave and violent force.
