translation:
  language: en
  text: You save people who are suffering,[a] but your eyes are on the proud,[b] and you bring them down.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also describe people who are poor, oppressed, or brought low.
    reason: lexical_alternative
  - marker: b
    text: Or “the haughty.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: an afflicted people
  simplified_phrase: people who are suffering
  preserved_meaning: God saves people experiencing hardship and lowliness, without limiting the verse to poverty.
  reasoning_layer_used: POB lexical and theological decisions for עָנִי
  rationale: The clause uses familiar wording while the footnote preserves the Hebrew term’s wider range.
- pob_phrase: the haughty
  simplified_phrase: the proud
  preserved_meaning: The people in view are morally self-exalting, not merely socially prominent.
  reasoning_layer_used: POB lexical decision for רָמִים and moral-theological contrast
  rationale: “Proud” is more common English and retains the intended moral contrast.
- pob_phrase: to bring them low
  simplified_phrase: and you bring them down
  preserved_meaning: God actively humbles those who exalt themselves.
  reasoning_layer_used: POB lexical decision for תַּשְׁפִּיל
  rationale: A direct verb clause makes the action easier to follow while keeping the high-and-low image.
translation_notes:
  risk_flags:
  - risk: “Suffering” may sound broader than the Hebrew range of poor, afflicted, oppressed, or humbled.
    mitigation: Footnote a preserves the main lexical alternatives and the idea of being brought low.
