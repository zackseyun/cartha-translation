translation:
  language: en
  text: Smoke rose from his nostrils.[a] Devouring fire came from his mouth, and coals blazed out from him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word for “nostrils” can also express anger, but here the poem uses the vivid picture of smoke coming from God’s nostrils.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Smoke went up from his nostrils
  simplified_phrase: Smoke rose from his nostrils
  preserved_meaning: The smoke moves upward from God’s nostrils in the poem’s bodily imagery.
  reasoning_layer_used: Lexical decision for עָלָה and theological decision on anthropomorphic imagery
  rationale: “Rose” states the upward movement more smoothly while retaining the concrete image.
- pob_phrase: and consuming fire from his mouth
  simplified_phrase: Devouring fire came from his mouth
  preserved_meaning: Fire issues from God’s mouth and actively consumes.
  reasoning_layer_used: Lexical decisions for תֹּאכֵל and מִפִּיו
  rationale: A complete clause is easier to follow, and “devouring” preserves the fire’s active force.
- pob_phrase: coals blazed from him
  simplified_phrase: coals blazed out from him
  preserved_meaning: Blazing coals emerge from God as the divine warrior.
  reasoning_layer_used: Lexical decisions for בָּעֲרוּ and מִמֶּנּוּ
  rationale: “Out from” makes the direction of the fiery emission immediately clear.
