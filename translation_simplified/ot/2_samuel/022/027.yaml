translation:
  language: en
  text: To those who are pure, you show that you are pure; but when dealing with the crooked, you show yourself shrewd.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Hebrew verb may also be translated “you show yourself twisted” or “you act contrary”; “shrewd” means that God outmatches the devious without becoming morally crooked.
