translation:
  language: en
  text: My God[a] is my rock. I go to him for safety. He is my shield and the horn[b] of my salvation. He is my stronghold, my refuge, and my Savior—you save me from violence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated “God of my rock.”
    reason: lexical_alternative
  - marker: b
    text: A horn is an image of strength and victorious power.
    reason: cultural_note
simplification_decisions:
- pob_phrase: my God, my rock, in whom I take refuge
  simplified_phrase: My God is my rock. I go to him for safety.
  preserved_meaning: God is the speaker’s stable protector and the one he trusts for refuge.
  reasoning_layer_used: POB lexical decisions for צוּרִי and אֶחֱסֶה בוֹ
  rationale: Two direct sentences make the poetic relationship and refuge image easier to grasp.
- pob_phrase: my shield and the horn of my salvation
  simplified_phrase: He is my shield and the horn of my salvation.
  preserved_meaning: God protects the speaker and possesses the power that saves him.
  reasoning_layer_used: POB theological decision on concrete divine metaphors
  rationale: The wording keeps both martial images while the footnote explains the less familiar horn image.
- pob_phrase: my stronghold and my refuge, my savior—you save me from violence
  simplified_phrase: He is my stronghold, my refuge, and my Savior—you save me from violence.
  preserved_meaning: God is the speaker’s secure shelter and the one who continually saves him from violence.
  reasoning_layer_used: POB lexical decisions for מִשְׂגַּבִּי, מְנוּסִי, מֹשִׁעִי, and תֹּשִׁעֵנִי
  rationale: Adding ordinary English sentence structure clarifies the chain of titles without merging them.
