  text: At Yahweh’s rebuke—at the blast of breath from his nostrils—the sea’s channels came into view, and the world’s foundations were exposed.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Then the channels of the sea were seen
  simplified_phrase: the sea’s channels came into view
  preserved_meaning: The sea’s hidden channels became visible.
  reasoning_layer_used: POB lexical decision for וַיֵּרָאוּ and אֲפִקֵי יָם
  rationale: “Came into view” expresses the passive unveiling in more natural English.
- pob_phrase: the foundations of the world were laid bare
  simplified_phrase: the world’s foundations were exposed
  preserved_meaning: The cosmic foundations were uncovered.
  reasoning_layer_used: POB lexical decision for יִגָּלוּ and מֹסְדוֹת תֵּבֵל
  rationale: “Were exposed” keeps the vivid uncovering image while using familiar wording.
- pob_phrase: at the rebuke of Yahweh, at the blast of the breath of his nostrils
  simplified_phrase: At Yahweh’s rebuke—at the blast of breath from his nostrils
  preserved_meaning: Yahweh’s powerful rebuke caused the cosmic upheaval, pictured as forceful breath from his nostrils.
  reasoning_layer_used: POB lexical and theological decisions for בְּגַעֲרַת יְהוָה and מִנִּשְׁמַת רוּחַ אַפּוֹ
  rationale: The recast clause makes the cause clear while preserving the divine name and Hebrew bodily image.
