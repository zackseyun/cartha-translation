translation:
  language: en
  text: Then the woman said, “Why, then, have you planned[a] to do this against the people of God? By saying this, the king makes himself like someone who is guilty, because he has not brought back the one banished from him.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “thought of” or “devised.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: planned such a thing
  simplified_phrase: planned to do this
  preserved_meaning: The king’s intentional course of action remains the focus of the accusation.
  reasoning_layer_used: Lexical decision for חָשַׁבְתָּה and כָּזֹאת
  rationale: The rewrite uses ordinary English while retaining the chosen sense of deliberate planning.
- pob_phrase: in speaking this word, the king is like one who is guilty
  simplified_phrase: by saying this, the king makes himself like someone who is guilty
  preserved_meaning: The king’s own words place him in the position of a guilty person.
  reasoning_layer_used: Lexical decision for the causal construction and כְּאָשֵׁם
  rationale: The active wording clarifies the rhetorical effect without turning the comparison into a direct verdict.
- pob_phrase: his banished one
  simplified_phrase: the one banished from him
  preserved_meaning: The singular person excluded from the king’s presence remains unnamed in the woman’s wording.
  reasoning_layer_used: Lexical decision for נִדְּחוֹ
  rationale: The phrase is clearer without narrowing the reference explicitly to Absalom.
translation_notes:
  risk_flags:
  - risk: “Makes himself” may sound more direct than the compact Hebrew comparison.
    mitigation: The wording retains “like someone who is guilty” so the simile is not flattened into a verdict.
