translation:
  language: en
  text: Then I, your servant, said, “Please, my lord the king, give a decision that will bring relief. For you are like the angel of God,[a] able to discern what is good and what is evil. May Yahweh your God be with you.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “an angel of God” or, more broadly, “a messenger of God.”
    reason: lexical_alternative
