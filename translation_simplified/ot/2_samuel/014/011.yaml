translation:
  language: en
  text: Then she said, “Your Majesty, please remember Yahweh your God. Do not let the avenger of blood[a] continue killing, and do not let them kill my son.” He answered, “As Yahweh lives, not even one hair of your son will fall to the ground.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “avenger of blood” was a close relative responsible for pursuing blood vengeance when a family member was killed.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Please let the king remember Yahweh your God
  simplified_phrase: Your Majesty, please remember Yahweh your God
  preserved_meaning: The woman respectfully appeals to the king’s accountability to Yahweh.
  reasoning_layer_used: Lexical decision for יִזְכָּר נָא and theological decision for יְהוָה
  rationale: Direct address preserves her deferential plea in natural English.
- pob_phrase: so that the avenger of blood may not continue to destroy
  simplified_phrase: Do not let the avenger of blood continue killing
  preserved_meaning: She asks the king to stop the blood avenger’s ongoing lethal action.
  reasoning_layer_used: Lexical decision and doctrine-realignment revision for מֵהַרְבּוֹת גֹּאֵל הַדָּם
  rationale: The wording keeps the continuing force while making the deadly threat clear.
- pob_phrase: and they may not destroy my son
  simplified_phrase: and do not let them kill my son
  preserved_meaning: The indefinite agents of vengeance must not take her son’s life.
  reasoning_layer_used: Lexical rationale for וְלֹא יַשְׁמִידוּ אֶת־בְּנִי
  rationale: “Them” preserves the source’s indefinite plural without broadening it to anyone.
