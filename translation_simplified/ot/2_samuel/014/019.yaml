  text: Then the king asked, “Is Joab involved with you in all this?” The woman answered, “As surely as you live, my lord the king, no one can evade anything you have said. Joab, your servant, commanded me to do this. He put all these words into my mouth.”
  philosophy: optimal-equivalence
