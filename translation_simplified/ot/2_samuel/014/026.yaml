translation:
  language: en
  text: 'At the end of every year, he cut his hair because it had become heavy on him. Whenever he cut it, he weighed the cut hair: two hundred shekels, using the king’s standard.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A shekel here is a unit of weight. The king’s standard was literally the king’s “stone,” a royal standard weight.
    reason: cultural_note
