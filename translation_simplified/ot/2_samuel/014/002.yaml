translation:
  language: en
  text: Joab sent for a wise woman[a] from Tekoa. He told her, “Please pretend to be in mourning. Wear mourning clothes, and do not put oil on your body.[b] You must look like a woman who has been grieving someone’s death for a long time.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Wise” may also suggest that she was skillful or shrewd.
    reason: lexical_alternative
  - marker: b
    text: People normally used oil for grooming and refreshment, but mourners often went without it as a sign of grief.
    reason: cultural_note
simplification_decisions:
- pob_phrase: sent to Tekoa and took from there a wise woman
  simplified_phrase: sent for a wise woman from Tekoa
  preserved_meaning: Joab arranged for a capable woman from Tekoa to come to him.
  reasoning_layer_used: Source syntax and the POB lexical decision for אִשָּׁה חֲכָמָה.
  rationale: The compact wording removes an awkward sequence without changing Joab’s action or her origin.
- pob_phrase: do not anoint yourself with oil
  simplified_phrase: do not put oil on your body
  preserved_meaning: She was to avoid the customary use of oil associated with normal grooming and refreshment.
  reasoning_layer_used: POB lexical rationale and cultural note for סוך with שֶׁמֶן.
  rationale: Common wording explains the physical action without losing its mourning context.
- pob_phrase: be like a woman who has been mourning for the dead many days
  simplified_phrase: look like a woman who has been grieving someone’s death for a long time
  preserved_meaning: Her appearance was to suggest prolonged mourning for a dead person.
  reasoning_layer_used: POB lexical decisions for מִתְאַבֶּלֶת עַל מֵת and זֶה יָמִים רַבִּים.
  rationale: Natural English clarifies the staged appearance, the cause of grief, and its duration.
