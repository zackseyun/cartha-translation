translation:
  language: en
  text: Now my whole family has turned against me, your servant. They said, “Hand over the one who struck his brother. We will put him to death for the life of the brother he killed, and we will destroy the heir as well.” In this way they would put out my one remaining ember—my last hope of continuing the family line. No one would remain to carry on my husband’s name or family line anywhere on earth.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the whole family has risen up against your servant
  simplified_phrase: my whole family has turned against me, your servant
  preserved_meaning: The extended family is acting with hostility toward the woman, who addresses the king humbly.
  reasoning_layer_used: POB lexical decisions for קָמָה ... עַל and שִׁפְחָתֶךָ
  rationale: The recasting states the hostile action and deferential self-reference in ordinary English.
- pob_phrase: put him to death for the life of his brother whom he killed
  simplified_phrase: put him to death for the life of the brother he killed
  preserved_meaning: The family demands his death as life-for-life retribution for killing his brother.
  reasoning_layer_used: POB lexical decisions for וּנְמִתֵהוּ and בְּנֶפֶשׁ אָחִיו
  rationale: The wording simplifies the relative clause while retaining the explicit life-for-life basis.
- pob_phrase: leaving my husband neither name nor remnant on the face of the earth
  simplified_phrase: No one would remain to carry on my husband’s name or family line anywhere on earth
  preserved_meaning: Her husband would lose both his remembered name and his surviving family line.
  reasoning_layer_used: POB lexical decisions and cultural note for שֵׁם וּשְׁאֵרִית
  rationale: The result is stated directly so modern readers can understand the lineage expression.
interpretive_expansions:
- pob_phrase: my remaining ember
  rendering: my one remaining ember—my last hope of continuing the family line
  claim: The ember represents the last surviving hope that the household line will continue.
  evidence:
  - The POB lexical rationale identifies the ember as the last surviving descendant and hope of the household.
  - The following clause concerns preserving the husband’s name and surviving line.
  confidence: high
  alternatives_preserved:
  - my remaining ember
  - my last coal
translation_notes:
  risk_flags:
  - risk: Readers may take “struck” as referring only to a nonfatal assault.
    mitigation: The words “the brother he killed” explicitly preserve the fatal outcome and Hebrew progression.
  - risk: Explaining the ember could weaken the metaphor.
    mitigation: The concrete ember image remains before its concise explanation.
