  preserved_meaning: The king orders Absalom away from his presence and toward Absalom’s own house.
  reasoning_layer_used: POB lexical decision for סבב and contextual rationale
  rationale: The added motion phrase makes the redirection clear in ordinary English.
- pob_phrase: and let him not see my face
  simplified_phrase: He must not see my face
  preserved_meaning: The king firmly denies Absalom access to his presence.
  reasoning_layer_used: POB lexical and theological decisions on the face idiom
  rationale: A direct command is clearer while the concrete Hebrew image remains intact.
- pob_phrase: So Absalom turned aside to his own house
