translation:
  language: en
  text: But the king said, “He must turn away and go to his own house. He must not see my face.”[a] So Absalom turned away and went to his own house, and he did not see the king’s face.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “See my face” and “see the king’s face” mean to enter the king’s presence or receive an audience with him.
    reason: lexical_alternative
