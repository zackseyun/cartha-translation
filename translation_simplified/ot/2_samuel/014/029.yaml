  preserved_meaning: Joab did not consent to approach Absalom.
  reasoning_layer_used: POB lexical decisions for אָבָה and לָבוֹא אֵלָיו
  rationale: Replacing the pronouns with names removes ambiguity without strengthening unwillingness into an explicit refusal.
- pob_phrase: sent again a second time
