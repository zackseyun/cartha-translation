translation:
  language: en
  text: 'Absalom said to Joab, “Look, I sent word asking you to come here so I could send you to the king with this message: ‘Why have I come from Geshur? It would be better for me if I were still there.’[a] Now let me see the king’s face.[b] If I am guilty, let him put me to death.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The concise Hebrew may also mean, “It was better for me when I was still there.”
    reason: lexical_alternative
  - marker: b
    text: Seeing the king’s face means appearing before the king.
    reason: simplification_note
simplification_decisions:
- pob_phrase: I sent word to you, saying, ‘Come here, so that I may send you to the king, to say
  simplified_phrase: I sent word asking you to come here so I could send you to the king with this message
  preserved_meaning: Absalom summoned Joab for the purpose of carrying his message to the king.
  reasoning_layer_used: Lexical decisions for שָׁלַחְתִּי אֵלֶיךָ, בֹּא הֵנָּה, and וְאֶשְׁלְחָה אֹתְךָ
  rationale: The nested wording is recast as one natural purpose statement without merging the summons and commission.
- pob_phrase: It would be better for me still to be there
  simplified_phrase: It would be better for me if I were still there
  preserved_meaning: Absalom says remaining in Geshur would be preferable to his present situation.
  reasoning_layer_used: Lexical decision and revision history for טוֹב לִי עוֹד אֲנִי שָׁם
  rationale: The conditional wording supplies the Hebrew clause’s implied comparison while retaining “still.”
- pob_phrase: if there is guilt in me
  simplified_phrase: If I am guilty
  preserved_meaning: Absalom submits his culpability to the king’s judgment.
  reasoning_layer_used: Lexical decision for עָוֺן
  rationale: The personal construction is more direct English and keeps the judicial sense of guilt.
