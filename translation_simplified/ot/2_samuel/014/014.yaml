translation:
  language: en
  text: For we must die. We are like water spilled on the ground, which cannot be gathered up again. Yet God does not take life away.[a] Instead, he makes plans so that the person banished from him will not remain banished.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “God does not show partiality to a person.” The Hebrew clause is difficult and may be understood differently.
    reason: alternative_reading
  - marker: b
    text: Or, “so that a banished person is not driven away from him.”
    reason: lexical_alternative
