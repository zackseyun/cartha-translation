  text: Joab son of Zeruiah knew that the king’s thoughts and feelings were focused on Absalom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “the king’s heart was toward Absalom.” It may mean that the king longed for Absalom or, more generally, that his heart was set on him. Some understand it negatively, but the following context favors a positive feeling.
    reason: alternative_reading
