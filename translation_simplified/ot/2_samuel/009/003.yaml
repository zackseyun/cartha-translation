translation:
  language: en
  text: Then the king asked, “Is anyone from Saul’s family still alive? I want to show that person the kindness of God.”[a] Ziba replied, “A son of Jonathan is still alive. He has a disability affecting his feet.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “God’s covenant loyalty.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: anyone left of the house of Saul
  simplified_phrase: anyone from Saul’s family still alive
  preserved_meaning: The king asks whether any member of Saul’s family line remains alive.
  reasoning_layer_used: Lexical decisions for הַאֶפֶס עוֹד אִישׁ and לְבֵית שָׁאוּל
  rationale: “Saul’s family” explains the dynastic use of “house” in common English.
- pob_phrase: that I may show him
  simplified_phrase: I want to show that person
  preserved_meaning: The king states his purpose of extending kindness to whoever remains.
  reasoning_layer_used: Lexical decision for וְאֶעֱשֶׂה עִמּוֹ
  rationale: A separate sentence makes the king’s purpose easier to follow.
- pob_phrase: There is still a son of Jonathan, crippled in his feet
  simplified_phrase: A son of Jonathan is still alive. He has a disability affecting his feet.
  preserved_meaning: Ziba identifies Jonathan’s surviving son and describes his physical impairment.
  reasoning_layer_used: Lexical decisions for עוֹד בֵּן לִיהוֹנָתָן and נְכֵה רַגְלָיִם
  rationale: The wording clearly marks the son as the survivor and describes his condition respectfully.
