translation:
  language: en
  text: David said to him, “Do not be afraid. I will certainly show you kindness[a] because of your father Jonathan. I will give back to you all the land that belonged to your grandfather Saul, and you will always share meals at my table.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can also mean “steadfast love,” “loyal love,” or “covenant loyalty.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew says “eat bread at my table,” an expression for continuing provision and shared meals.
    reason: cultural_note
simplification_decisions:
- pob_phrase: for I will surely show you kindness for the sake of Jonathan your father
  simplified_phrase: I will certainly show you kindness because of your father Jonathan
  preserved_meaning: David emphatically promises kindness because of his bond with Jonathan.
  reasoning_layer_used: lexical and theological decisions on emphasis, hesed, and relational motive
  rationale: The shorter wording keeps the certainty, kindness, and reason for David’s action.
- pob_phrase: I will restore to you all the land of Saul your father
  simplified_phrase: I will give back to you all the land that belonged to your grandfather Saul
  preserved_meaning: David will return Saul’s entire landed estate to Mephibosheth.
  reasoning_layer_used: lexical decisions on restore, collective land, and ancestor terminology
  rationale: Common wording clarifies both the property transfer and Saul’s actual relationship to Mephibosheth.
- pob_phrase: you shall always eat bread at my table
  simplified_phrase: you will always share meals at my table
  preserved_meaning: Mephibosheth will continually receive David’s provision and table fellowship.
  reasoning_layer_used: lexical decision and cultural note on the Hebrew meal idiom
  rationale: The natural English idiom states the ongoing privilege while the footnote preserves the bread image.
