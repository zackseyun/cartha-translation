translation:
  language: en
  text: 'Then Nathan said to David, “You are the man![a] This is what Yahweh, the God of Israel, says: ‘I anointed you as king over Israel, and I rescued you from Saul’s grasp.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “You are that man!” The Hebrew literally says, “You are the man.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Thus says Yahweh
  simplified_phrase: This is what Yahweh ... says
  preserved_meaning: Nathan introduces Yahweh’s authoritative message.
  reasoning_layer_used: POB lexical decision for כֹּה אָמַר
  rationale: The common formula is clearer while preserving the prophetic authority.
- pob_phrase: I anointed you king over Israel
  simplified_phrase: I anointed you as king over Israel
  preserved_meaning: Yahweh appointed David to royal office over Israel.
  reasoning_layer_used: POB lexical decisions for מְשַׁחְתִּיךָ and לְמֶלֶךְ
  rationale: Adding “as” makes the appointment relationship natural in modern English.
- pob_phrase: I delivered you from the hand of Saul
  simplified_phrase: I rescued you from Saul’s grasp
  preserved_meaning: Yahweh freed David from Saul’s hostile power.
  reasoning_layer_used: POB lexical decisions for הִצַּלְתִּיךָ and מִיַּד שָׁאוּל
  rationale: “Rescued” is more familiar, while “grasp” preserves the image of Saul’s controlling hand.
translation_notes:
  risk_flags:
  - risk: “Saul’s grasp” changes the literal body-part image of “Saul’s hand.”
    mitigation: The wording retains the physical metaphor while clearly conveying hostile power.
