- pob_phrase: David’s servants were afraid to tell him that the child was dead, for they said
  simplified_phrase: David’s servants were afraid to tell him that the child was dead. They said
  preserved_meaning: The servants feared giving David the news and then explained their concern.
  reasoning_layer_used: Narrative syntax and the POB lexical decision for לְהַגִּיד לוֹ.
  rationale: Two sentences make the sequence easier to follow without specifying whom they addressed.
- pob_phrase: we spoke to him, and he did not listen to our voice
  simplified_phrase: we spoke to David, but he did not listen to us
  preserved_meaning: David did not heed his servants while the child remained alive.
  reasoning_layer_used: POB lexical alternatives for שָׁמַע בְּקוֹלֵנוּ.
  rationale: Naming David clarifies the pronoun, and a natural English idiom avoids suggesting deliberate refusal.
- pob_phrase: How then can we say to him, ‘The child is dead’?
  simplified_phrase: How can we tell him that the child is dead?
  preserved_meaning: The servants anxiously ask how they can report the death after David did not listen before.
  reasoning_layer_used: POB rationale for the anxious rhetorical question and its contextual contrast.
  rationale: The preceding sentence already makes the contrast clear, so no added temporal word is needed.
