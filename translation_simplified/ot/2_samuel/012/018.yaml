translation:
  language: en
  text: On the seventh day, the child died. David’s servants were afraid to tell him that the child was dead. They said, “While the child was still alive, we spoke to David, but he did not listen to us. How can we tell him that the child is dead? He may do something harmful.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew does not specify what harmful action they feared; it could also mean that he might do evil, react badly, or harm himself.
    reason: lexical_alternative
