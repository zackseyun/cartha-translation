translation:
  language: en
  text: Then Nathan went home. Yahweh struck the child whom Uriah’s wife[a] had borne to David, and the child became sick.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew calls her “Uriah’s wife” here rather than naming Bathsheba.
