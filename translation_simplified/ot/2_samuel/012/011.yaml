translation:
  language: en
  text: 'This is what Yahweh says: “Look, I am bringing disaster against you from within your own household. Before your eyes, I will take your wives and give them to one of your associates.[a] He will have sexual relations with your wives openly, under this very sun.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may mean a neighbor, companion, or associate.
    reason: lexical_alternative
  - marker: b
    text: This vivid image means that it will happen openly and publicly.
    reason: simplification_note
simplification_decisions:
- pob_phrase: 'Thus says Yahweh: Behold'
  simplified_phrase: 'This is what Yahweh says: “Look'
  preserved_meaning: Yahweh solemnly announces his message and calls for attention.
  reasoning_layer_used: POB lexical decisions for כֹּה אָמַר and הִנְנִי
  rationale: This uses natural modern English while retaining the prophetic announcement and attention marker.
- pob_phrase: I am raising up disaster against you from your own house
  simplified_phrase: I am bringing disaster against you from within your own household
  preserved_meaning: Yahweh will bring calamity upon David through his own family sphere, not commit moral evil.
  reasoning_layer_used: POB lexical and theological decisions for מֵקִים רָעָה and מִבֵּיתֶךָ
  rationale: “Bringing” and “household” clearly express the judgment and its internal source.
- pob_phrase: give them to your neighbor
  simplified_phrase: give them to one of your associates
  preserved_meaning: The recipient is someone in David’s social sphere without requiring personal intimacy.
  reasoning_layer_used: POB lexical decision and footnote for רֵעַ
  rationale: “Associate” avoids both the next-door sense of “neighbor” and the emotional implication of “someone close.”
interpretive_expansions:
- pob_phrase: he will lie with your wives
  rendering: He will have sexual relations with your wives
  claim: The Hebrew euphemism refers to sexual relations.
  evidence:
  - The POB lexical rationale identifies וְשָׁכַב עִם as a sexual euphemism.
  - The immediate context contrasts this public act with David’s secret sin.
  confidence: high
  alternatives_preserved:
  - he will lie with your wives
  - he will sleep with your wives
- pob_phrase: in the sight of this sun
  rendering: openly, under this very sun
  claim: The act will occur publicly rather than in secret.
  evidence:
  - The POB lexical rationale says the sun image emphasizes public exposure.
  - The POB footnote explains the phrase as openly and publicly.
  confidence: high
  alternatives_preserved:
  - in the sight of this sun
  - in broad daylight
translation_notes:
  risk_flags:
