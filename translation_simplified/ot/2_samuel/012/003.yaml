  preserved_meaning: The lamb regularly shared the man's own food.
  reasoning_layer_used: Lexical decision for מִפִּתּוֹ and the Hebrew descriptive imperfect.
  rationale: “His own food” is clearer than “his morsel,” while “would” preserves habitual action.
- pob_phrase: lie in his bosom
  simplified_phrase: lie against his chest
  preserved_meaning: The lamb regularly rested in close, affectionate contact with the man.
  reasoning_layer_used: Lexical decision for בְחֵיקוֹ and the domestic-imagery theological decision.
  rationale: “Against his chest” preserves the tender physical image in common English.
