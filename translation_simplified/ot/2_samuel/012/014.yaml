translation:
  language: en
  text: Even so,[a] because through what you have done you have shown utter contempt for Yahweh’s enemies, the son born to you will surely die.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Many translations read, “you have given Yahweh’s enemies reason to scorn him,” following an interpretive or emended reading of the difficult Hebrew.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Nevertheless
  simplified_phrase: Even so
  preserved_meaning: The consequence still follows despite the forgiveness announced before this verse.
  reasoning_layer_used: Lexical decision for אֶפֶס and immediate context
  rationale: “Even so” expresses the strong contrast in more natural common English.
- pob_phrase: because by this matter
  simplified_phrase: because through what you have done
  preserved_meaning: David’s deed or wider affair is the cause of the announced consequence.
  reasoning_layer_used: Lexical decision for בַּדָּבָר הַזֶּה
  rationale: The rewrite replaces the abstract phrase “this matter” with a direct reference to David’s action.
- pob_phrase: you have utterly scorned the enemies of Yahweh
  simplified_phrase: you have shown utter contempt for Yahweh’s enemies
  preserved_meaning: David is the subject and Yahweh’s enemies remain the object in the MT-based reading.
  reasoning_layer_used: Lexical and theological decisions for נִאֵץ נִאַצְתָּ אֶת אֹיְבֵי יְהוָה
  rationale: The wording keeps both the emphatic contempt and the POB’s deliberately difficult syntax.
