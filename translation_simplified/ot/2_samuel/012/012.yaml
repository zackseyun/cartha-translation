simplification_decisions:
- pob_phrase: For you did it in secret
  simplified_phrase: For you did this in secret
  preserved_meaning: David concealed his offense, and this explains the announced judgment.
  reasoning_layer_used: Lexical decisions for כִּי, עָשִׂיתָ, and בַסָּתֶר
  rationale: “For” preserves the link to the preceding judgment, while “this” keeps the offense unstated.
- pob_phrase: before all Israel
  simplified_phrase: in full view of all Israel
  preserved_meaning: The announced judgment will be publicly visible to Israel.
  reasoning_layer_used: Lexical decision for נֶגֶד כָּל יִשְׂרָאֵל
  rationale: “In full view” states the public sense more plainly than “before.”
- pob_phrase: before the sun
  simplified_phrase: under the light of the sun
  preserved_meaning: The judgment will occur openly in daylight.
  reasoning_layer_used: Lexical decision for וְנֶגֶד הַשָּׁמֶשׁ
  rationale: The wording keeps the sun image while making the idiom understandable.
