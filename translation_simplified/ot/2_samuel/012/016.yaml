translation:
  language: en
  text: David sought God on behalf of the boy.[a] He fasted. Then he went inside, spent the night, and lay on the ground.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be translated “the child”; this is David’s sick infant son.
