translation:
  language: en
  text: A traveler[a] came to the rich man. The rich man did not want to take any animal from his own flock or herd to prepare food for the traveler. Instead, he took the poor man’s ewe lamb and prepared it for his visitor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “guest.” The Hebrew uses two related but distinct words for a traveler and someone received as a guest.
    reason: lexical_alternative
