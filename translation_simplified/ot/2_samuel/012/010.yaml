translation:
  language: en
  text: Therefore, from now on, the sword[a] will never leave your house,[b] because you have treated me with contempt and taken Uriah the Hittite’s wife to be your wife.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The sword represents continuing violence and conflict.
    reason: simplification_note
  - marker: b
    text: Here “house” can mean David’s family, household, and royal line.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Now therefore
  simplified_phrase: Therefore, from now on
  preserved_meaning: The judgment follows from the previous charge and begins now.
  reasoning_layer_used: Lexical decision for וְעַתָּה
  rationale: This wording makes both the causal and temporal force clear.
- pob_phrase: the sword shall never depart from your house
  simplified_phrase: the sword will never leave your house
  preserved_meaning: Violence and conflict will continue within David’s house.
  reasoning_layer_used: Lexical decisions for חֶרֶב, לֹא תָסוּר, and מִבֵּיתְךָ
  rationale: Common wording preserves the sword image and the broad house metaphor.
- pob_phrase: because you have despised me and have taken
  simplified_phrase: because you have treated me with contempt and taken
  preserved_meaning: David’s actions directly offended God and are the stated reason for the judgment.
  reasoning_layer_used: Lexical and theological decisions for עֵקֶב כִּי and בְזִתָנִי
  rationale: The revision clearly retains both the causal link and the divine referent.
