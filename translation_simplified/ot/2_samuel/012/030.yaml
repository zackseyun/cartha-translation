translation:
  language: en
  text: He removed their king’s crown from his head.[a] It weighed about 75 pounds (34 kilograms) in gold, and a precious stone was set in it.[b] The crown was placed on David’s head. He also carried away a vast amount of plunder from the city.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the crown of Milcom” (also called Malcam), the Ammonite god.
    reason: alternative_reading
  - marker: b
    text: The Hebrew says “one talent,” a large ancient unit of weight whose exact value varied.
    reason: cultural_note
