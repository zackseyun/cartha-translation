translation:
  language: en
  text: David brought out the people who were in the city and forced them to work with saws, iron picks, and iron axes.[a] He also made them work at the brick kiln.[b] He treated all the Ammonite cities this way.[c] Then David and all the people with him returned to Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The exact kinds of tools are uncertain; the Hebrew may mean “the saw, iron sharp tools, and iron cutting tools.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew is difficult; traditionally, “made them pass through the brick kiln,” which some understand as execution rather than forced labor.
    reason: alternative_reading
  - marker: c
    text: Compare the parallel account in 1 Chronicles 20:3, where the wording is also difficult.
    reason: cross_reference
