translation:
  language: en
  text: How much more, then, when wicked men have killed a righteous man in his own house, on his own bed! Should I not now hold you accountable for his blood and purge you from the land?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Purge you from the land” means to remove the murderers by judicial execution.
    reason: cultural_note
simplification_decisions:
- pob_phrase: How much more, when
  simplified_phrase: How much more, then, when
  preserved_meaning: David argues from the lesser case in the previous verse to this more serious case.
  reasoning_layer_used: lexical decision and immediate context
  rationale: “Then” makes the comparison with the previous case easier to follow.
- pob_phrase: require his blood from your hand
  simplified_phrase: hold you accountable for his blood
  preserved_meaning: David will call the killers to account for the life they unlawfully took.
  reasoning_layer_used: lexical and theological decisions
  rationale: The wording explains the legal idiom while retaining the concrete image of blood.
- pob_phrase: purge you from the land
  simplified_phrase: purge you from the land
  preserved_meaning: David announces the murderers’ judicial removal from the land.
  reasoning_layer_used: lexical decision and cultural note
  rationale: The covenantal image is retained and clarified in a footnote rather than flattened.
