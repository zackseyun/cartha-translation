  text: When Abner returned to Hebron, Joab drew him aside into the gateway to speak with him privately. There Joab struck him in the belly,[a] and the blow killed him. Joab did this because Abner had killed Joab’s brother Asahel.
  philosophy: optimal-equivalence
  footnotes:
