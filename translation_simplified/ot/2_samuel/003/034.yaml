translation:
  language: en
  text: “Your hands were not tied, and your feet were not put in bronze shackles. You fell as someone falls before wicked men.[a]” Then all the people wept over him even more.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “sons of injustice,” an expression meaning wicked men or evildoers.
    reason: lexical_alternative
