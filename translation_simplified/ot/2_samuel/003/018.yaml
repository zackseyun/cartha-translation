translation:
  language: en
  text: 'So do it now, because Yahweh has said this about David: “Through my servant David, I will save[a] my people Israel from the power of the Philistines and from the power of all their enemies.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “My servant David will save my people Israel from the power of the Philistines and from the power of all their enemies.” The Hebrew may present David as the subject rather than Yahweh as the one acting through David.
    reason: alternative_reading
