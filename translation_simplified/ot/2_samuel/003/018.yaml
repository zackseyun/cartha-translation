  reasoning_layer_used: lexical decision for וְעַתָּה and עֲשׂוּ
  rationale: Ordinary English word order makes the urgent command immediately clear.
- pob_phrase: By the hand of my servant David
  simplified_phrase: Through my servant David
  preserved_meaning: Yahweh acts by means of David, his appointed servant.
  reasoning_layer_used: lexical and theological decisions for בְּיַד and הוֹשִׁיעַ
  rationale: “Through” clearly expresses David’s agency without suggesting that he saves independently.
- pob_phrase: from the hand of the Philistines and from the hand of all their enemies
  simplified_phrase: from the power of the Philistines and from the power of all their enemies
  preserved_meaning: Yahweh will rescue Israel from hostile control and oppression.
