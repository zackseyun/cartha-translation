translation:
  language: en
  text: 'Then David sent messengers to Ish-bosheth, Saul’s son, with this message: “Give me my wife Michal. I secured our betrothal with one hundred Philistine foreskins.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: See 1 Samuel 18:25–27. Saul demanded the Philistine foreskins as the bride-price for Michal.
    reason: cross_reference
