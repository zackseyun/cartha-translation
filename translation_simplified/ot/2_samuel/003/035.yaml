translation:
  language: en
  text: Then all the people came and tried to get David to eat some bread[a] while it was still daylight. But David swore, “May God do the same to me, and even more, if I taste bread or anything at all before the sun goes down.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “bread” can also mean food more generally.
    reason: lexical_alternative
  - marker: b
    text: This was a solemn oath calling down an unstated punishment if David broke his word.
    reason: cultural_note
