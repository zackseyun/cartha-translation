translation:
  language: en
  text: Abner became furious at Ish-bosheth’s words. He said, “Do you think I am a contemptible dog who has sided with Judah?[a] To this day I have remained loyal to your father Saul’s family, to his brothers, and to his friends. I have not handed you over to David. Yet today you accuse me because of this woman.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally asks, “Am I a dog’s head that belongs to Judah?” The exact force of this insult is uncertain.
    reason: lexical_alternative
