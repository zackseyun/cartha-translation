translation:
  language: en
  text: 'He said, “Good. I will make a covenant with you. But I ask one thing: When you come to see me, you must first bring Michal, Saul’s daughter. Otherwise, you may not see my face.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression “see my face” can also mean “appear before me.”
    reason: lexical_alternative
