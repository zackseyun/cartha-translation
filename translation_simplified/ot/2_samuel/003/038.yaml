translation:
  language: en
  text: Then the king said to his servants, “Surely you realize that a prince[a] and a great man has fallen[b] in Israel today.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a leader.” The Hebrew word can refer to a prince, commander, ruler, or leading official.
    reason: lexical_alternative
  - marker: b
    text: Here “fallen” means died.
    reason: simplification_note
