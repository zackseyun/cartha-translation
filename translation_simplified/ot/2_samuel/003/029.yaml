translation:
  language: en
  text: May the guilt for this death fall on Joab and his whole family line. May Joab’s family never be free from someone who has a bodily discharge, has a defiling skin disease, holds a spindle for spinning thread,[a] is killed by the sword, or lacks bread to eat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some understand the Hebrew phrase as “leans on a staff”; it may also refer to holding a distaff.
    reason: lexical_alternative
