translation:
  language: en
  text: So Joab and his brother Abishai killed Abner.[a] They did this because Abner had killed their brother Asahel in the battle at Gibeon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “And Joab and his brother Abishai killed Abner.” The Hebrew can simply mean “and,” while “so” shows the connection with the preceding account.
    reason: lexical_alternative
