  preserved_meaning: Eglah was married to David without implying that she was his only wife.
  reasoning_layer_used: POB footnote and lexical decision for אֵשֶׁת דָּוִד
  rationale: This wording prevents the English possessive from suggesting exclusivity.
- pob_phrase: These were born to David in Hebron
  simplified_phrase: All these sons were born to David in Hebron
  preserved_meaning: The preceding sons in the list were David’s and were born in Hebron.
  reasoning_layer_used: lexical decisions for אֵלֶּה, יֻלְּדוּ, לְדָוִד, and בְּחֶבְרוֹן
