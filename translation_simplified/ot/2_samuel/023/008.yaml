translation:
  language: en
  text: 'These are the names of David’s mighty warriors: Josheb-basshebeth,[a] a Tahkemonite, was chief of the Three.[b] He was Adino the Eznite.[c] In a single encounter, he wielded his spear against eight hundred men and killed them.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is difficult. The Masoretic Text has “Josheb-basshebeth,” while 1 Chronicles 11:11 has “Jashobeam, a Hachmonite.”
    reason: textual_variant
  - marker: b
    text: Some ancient witnesses and interpreters have “chief of the thirty”; the Masoretic Text has “chief of the Three.”
    reason: alternative_reading
  - marker: c
    text: The Hebrew phrase rendered “Adino the Eznite” is very difficult; many understand it as “he wielded his spear” or “he brandished his spear.”
    reason: lexical_alternative
