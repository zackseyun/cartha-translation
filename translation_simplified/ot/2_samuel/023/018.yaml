translation:
  language: en
  text: Abishai, the brother of Joab and a son of Zeruiah, was the leader of the Three.[a] He fought against three hundred men with his spear and killed them.[b] He was famous among the Three.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew reads “the Three”; because of textual uncertainty and the parallel in 1 Chronicles 11:20, some understand this as “the Thirty.”
    reason: textual_variant
  - marker: b
    text: The terse Hebrew can also be rendered, “He raised or brandished his spear against three hundred slain.”
    reason: lexical_alternative
