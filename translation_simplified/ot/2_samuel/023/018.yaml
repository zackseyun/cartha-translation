  rationale: “Leader” gives the ordinary meaning of “chief” while retaining the chosen group name.
- pob_phrase: He wielded his spear against three hundred and killed them
  simplified_phrase: He fought against three hundred men with his spear and killed them
  preserved_meaning: Abishai used his spear in combat and killed three hundred opponents.
  reasoning_layer_used: POB lexical decisions for עוֹרֵר אֶת־חֲנִיתוֹ and עַל שְׁלֹשׁ מֵאוֹת חָלָל
  rationale: The recast sentence makes the military action immediately clear without weakening it.
- pob_phrase: he had a name among the Three
  simplified_phrase: He was famous among the Three
