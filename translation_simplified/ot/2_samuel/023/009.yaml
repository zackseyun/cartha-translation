  text: Next came Eleazar son of Dodo,[a] son of Ahohi. He was among the three mighty warriors with David when they taunted the Philistines, who had gathered there for battle. The men of Israel had gone up.[b]
  philosophy: optimal-equivalence
  footnotes:
