  preserved_meaning: Zelek is identified by his national origin.
  reasoning_layer_used: The lexical decision identifies “Ammonite” as a term for ethnic or national origin.
  rationale: Naming the place directly is clearer for readers unfamiliar with the label “Ammonite.”
- pob_phrase: Naharai the Beerothite
  simplified_phrase: Naharai from Beeroth
  preserved_meaning: Naharai is identified as a man from Beeroth.
  reasoning_layer_used: The lexical alternatives explicitly permit “the man from Beeroth.”
  rationale: The place-based wording avoids the unfamiliar term “Beerothite.”
- pob_phrase: armor-bearer of Joab son of Zeruiah
  simplified_phrase: who served as armor-bearer to Joab son of Zeruiah
  preserved_meaning: Naharai held the recognized military role of carrying Joab’s martial gear.
