translation:
  language: en
  text: For my house is not so with God.[a] Yet he has made an everlasting covenant with me. He has arranged every part of it and made it secure. This is my entire salvation and everything I desire. Will he not surely make it flourish?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Is not my house so with God?” Many read the opening as a positive rhetorical question.
    reason: alternative_reading
  - marker: b
    text: 'The difficult Hebrew may also be translated as a strong statement: “He will surely make it flourish.”'
    reason: lexical_alternative
