  preserved_meaning: God established an enduring covenant with David.
  reasoning_layer_used: Lexical decision for שָׂם לִי and בְרִית עוֹלָם
  rationale: Ordinary English word order makes the covenant statement easier to follow.
- pob_phrase: ordered in every way and kept secure
  simplified_phrase: He has arranged every part of it and made it secure.
  preserved_meaning: The covenant is fully ordered and safeguarded.
  reasoning_layer_used: Lexical decisions for עֲרוּכָה, בַכֹּל, and וּשְׁמֻרָה
  rationale: A separate active sentence clearly expresses both arrangement and security.
- pob_phrase: all my salvation and all my desire
  simplified_phrase: my entire salvation and everything I desire
  preserved_meaning: David locates the fullness of his salvation and desire in what God has established.
  reasoning_layer_used: Lexical decisions for כָּל יִשְׁעִי and וְכָל חֵפֶץ
  rationale: Common quantifiers replace the less natural repeated use of “all my.”
