translation:
  language: en
  text: But any man who touches them[a] must equip himself with iron and a spear shaft. They must be completely burned with fire, right where they are.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Them” refers to the worthless men compared to thorns in the previous verse.
