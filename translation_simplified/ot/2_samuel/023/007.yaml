simplification_decisions:
- pob_phrase: the man who touches them must arm himself with iron and the shaft of a spear
  simplified_phrase: any man who touches them must equip himself with iron and a spear shaft
  preserved_meaning: Any man approaching these dangerous, thorn-like men must be equipped with the specified materials.
  reasoning_layer_used: POB lexical decisions for וְאִישׁ, יִגַּע בָּהֶם, יִמָּלֵא, בַרְזֶל, and וְעֵץ חֲנִית
  rationale: “Any man” clarifies the generic case, while “equip himself” preserves the source emphasis on being furnished rather than on using the implements.
- pob_phrase: they must be completely burned with fire
  simplified_phrase: They must be completely burned with fire
  preserved_meaning: Fire must destroy them thoroughly.
  reasoning_layer_used: POB lexical decisions for וּבָאֵשׁ and שָׂרוֹף יִשָּׂרְפוּ
  rationale: The wording retains both fire as the means and the Hebrew emphasis on complete burning.
- pob_phrase: in their place
  simplified_phrase: right where they are
  preserved_meaning: The burning takes place on the spot.
  reasoning_layer_used: POB lexical decision for בַּשָּׁבֶת
  rationale: “Right where they are” expresses the same local sense in ordinary English.
