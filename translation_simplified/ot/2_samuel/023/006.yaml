translation:
  language: en
  text: But all worthless people[a] are like thorns thrown aside, because they cannot be picked up by hand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “worthless” means wicked; the Hebrew is not using the later proper name “Belial.”
    reason: lexical_alternative
