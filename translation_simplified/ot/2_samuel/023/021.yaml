translation:
  language: en
  text: He also struck down an Egyptian who had an impressive appearance.[a] The Egyptian was holding a spear. He went down to face him with a staff,[b] snatched the spear from his hand, and killed him with the Egyptian’s own spear.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a handsome man” or “a man of notable appearance”; the Hebrew describes his appearance without specifying beauty or unusual height.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word can also mean “club” or “rod.”
    reason: lexical_alternative
