translation:
  language: en
  text: Then the three elite warriors forced their way through the Philistine camp. They drew water from the well at Bethlehem by the gate and carried it to David. But David would not drink it. Instead, he poured it out to the LORD.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: David poured out the water as an offering to the LORD, in an act like a libation.
    reason: cultural_note
simplification_decisions:
- pob_phrase: the three mighty men broke through the camp of the Philistines
  simplified_phrase: the three elite warriors forced their way through the Philistine camp
  preserved_meaning: David’s three distinguished fighters penetrated the enemy encampment.
  reasoning_layer_used: Lexical decisions for גִּבּוֹרִים and וַיִּבְקְעוּ
  rationale: “Elite warriors” explains their military status, while “forced their way through” preserves the forceful breach.
- pob_phrase: drew water from the well of Bethlehem that was by the gate
  simplified_phrase: drew water from the well at Bethlehem by the gate
  preserved_meaning: They drew water from the specific Bethlehem well located by the gate.
  reasoning_layer_used: Lexical decision for מִבֹּאר בֵּית לֶחֶם אֲשֶׁר בַּשַּׁעַר and grounding review
  rationale: “At Bethlehem by the gate” is natural English and keeps the source’s specific location.
- pob_phrase: and carried it and brought it to David. But he was not willing to drink it
  simplified_phrase: and carried it to David. But David would not drink it
  preserved_meaning: They delivered the water to David, but he deliberately chose not to drink it.
  reasoning_layer_used: Lexical decisions for וַיִּשְׂאוּ, וַיָּבִאוּ, and וְלֹא אָבָה
  rationale: The shorter wording removes redundant motion language while retaining David’s unwillingness.
