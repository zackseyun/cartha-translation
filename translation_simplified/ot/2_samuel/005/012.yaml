translation:
  language: en
  text: David knew that Yahweh had firmly established him as king over Israel. He also knew that Yahweh had made his kingdom great for the sake of Yahweh’s people Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “for the sake of David’s people Israel,” if “his” refers to David rather than to Yahweh.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: had established him as king
  simplified_phrase: had firmly established him as king
  preserved_meaning: Yahweh had confirmed and secured David in the office of king.
  reasoning_layer_used: Lexical decision for הֱכִינוֹ in its royal context.
  rationale: “Firmly” makes the stabilizing force of “established” easier to grasp.
- pob_phrase: had exalted his kingdom
  simplified_phrase: had made his kingdom great
  preserved_meaning: Yahweh had elevated David’s kingdom in status and strength.
  reasoning_layer_used: Lexical decision for נִשֵּׂא and מַמְלַכְתּוֹ.
  rationale: This replaces formal royal language with a clear common expression.
- pob_phrase: his people Israel
  simplified_phrase: Yahweh’s people Israel
  preserved_meaning: Israel is most likely identified as Yahweh’s covenant people.
  reasoning_layer_used: Theological decision on the pronoun’s antecedent.
  rationale: Naming Yahweh removes unclear English pronoun reference while retaining the alternate reading in a note.
interpretive_expansions:
- pob_phrase: his people Israel
  rendering: Yahweh’s people Israel
  claim: The pronoun most likely refers to Yahweh rather than David.
  evidence:
