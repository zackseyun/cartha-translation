translation:
  language: en
  text: That day David said, “Whoever attacks the Jebusites and reaches the water shaft[a]—let him strike the lame and the blind, whom David hates.”[b] That is why people say, “The blind and the lame will not enter the house.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word may mean a conduit, gutter, tunnel, or another part of the city’s water system; its precise meaning is uncertain.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew sentence is difficult. The words “the lame and the blind” may instead continue the Jebusites’ taunt from the previous verse.
    reason: alternative_reading
  - marker: c
    text: “House” may refer here to the royal palace.
    reason: lexical_alternative
