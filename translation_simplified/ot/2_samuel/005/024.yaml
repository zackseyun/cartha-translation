translation:
  language: en
  text: When you hear the sound of marching in the balsam treetops,[a] act decisively, because Yahweh has gone out ahead of you to strike down the Philistine camp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The exact kind of tree named in Hebrew is uncertain. It may be called the “baca tree,” while older English versions often say “mulberry tree.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the sound of marching in the tops of the balsam trees
  simplified_phrase: the sound of marching in the balsam treetops
  preserved_meaning: The sign remains a marching sound heard in the upper parts of the trees.
  reasoning_layer_used: Lexical decisions for קוֹל צְעָדָה and בְּרָאשֵׁי הַבְּכָאִים
  rationale: “Balsam treetops” removes repetition while preserving the concrete location and tree name.
- pob_phrase: then act decisively, for then
  simplified_phrase: act decisively, because
  preserved_meaning: David must respond with vigorous, decisive action because Yahweh is already moving ahead of him.
  reasoning_layer_used: Lexical decisions for אָז תֶּחֱרָץ and כִּי אָז
  rationale: “Because” states the command’s causal connection in direct modern English.
- pob_phrase: Yahweh has gone out before you to strike down the camp of the Philistines
  simplified_phrase: Yahweh has gone out ahead of you to strike down the Philistine camp
  preserved_meaning: When David hears the sign, Yahweh has already begun leading the attack against the Philistines.
  reasoning_layer_used: Lexical decisions for יָצָא, לְפָנֶיךָ, לְהַכּוֹת, and מַחֲנֵה, with the theological decision for יְהוָה
  rationale: “Ahead of you” and “Philistine camp” make the battle setting natural without changing the perfect timing.
