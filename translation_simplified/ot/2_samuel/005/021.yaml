translation:
  language: en
  text: They abandoned their idols there. David and his men carried the idols away.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term can also mean “images,” but here it refers to objects used in worship.
    reason: lexical_alternative
  - marker: b
    text: First Chronicles 14:12 adds that David ordered the idols to be burned; here Samuel says only that David and his men carried them away.
    reason: cross_reference
simplification_decisions:
- pob_phrase: they left their idols there
  simplified_phrase: They abandoned their idols there.
  preserved_meaning: The retreating forces left their cult objects behind.
  reasoning_layer_used: Lexical decision for וַיַּעַזְבוּ and עֲצַבֵּיהֶם
  rationale: “Abandoned” clearly conveys leaving valued objects behind during retreat while “idols” preserves their religious character.
- pob_phrase: and David and his men carried them away
  simplified_phrase: David and his men carried the idols away.
  preserved_meaning: David and his companions physically removed the idols without stating why.
  reasoning_layer_used: Lexical and theological decisions for וַיִּשָּׂאֵם
  rationale: A new sentence and repeated noun make the action clear without importing their later destruction.
translation_notes:
