translation:
  language: en
  text: David made the stronghold his home and named it the City of David. He then built all around, from the Millo[a] inward.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Millo was probably a known structure or terraced fill in Jerusalem, though its exact identity is uncertain. The Hebrew can also be translated “from the Millo and inward” or “from the Millo toward the interior.”
    reason: lexical_alternative
