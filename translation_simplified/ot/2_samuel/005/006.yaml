translation:
  language: en
  text: The king and his men went to Jerusalem, where the Jebusites lived. The Jebusites[a] told David, “You will not get in here. Even the blind and the lame will drive you away!”[b] They were saying, “David will not get in here.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “he said,” probably using the singular to refer collectively to the Jebusites.
    reason: textual_variant
  - marker: b
    text: The Hebrew wording is difficult; the Jebusites were mocking David by claiming that even the blind and the lame could keep him out.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: to the Jebusites, the inhabitants of the land
  simplified_phrase: where the Jebusites lived
  preserved_meaning: Jerusalem was then inhabited by the Jebusites.
  reasoning_layer_used: lexical decision on אֶל הַיְבֻסִי and יוֹשֵׁב הָאָרֶץ
  rationale: The location clause replaces the formal apposition without narrowing the collective sense.
- pob_phrase: You will not come in here
  simplified_phrase: You will not get in here
  preserved_meaning: The Jebusites claimed David could not enter their fortified city.
  reasoning_layer_used: lexical decision on לֹא תָבֹוא הֵנָּה
  rationale: “Get in” states the fortified-city sense in immediate, natural English.
- pob_phrase: even the blind and the lame will turn you away
  simplified_phrase: Even the blind and the lame will drive you away!
  preserved_meaning: The Jebusites mocked David by claiming that even people with disabilities could repel him.
  reasoning_layer_used: lexical and theological decisions on הֱסִירְךָ and הַעִוְרִים וְהַפִּסְחִים
  rationale: “Drive you away” makes the taunt clear while retaining its concrete and offensive wording.
