translation:
  language: en
  text: Hushai said, “You know what your father and his men are like. They are mighty warriors, fierce with bitterness in their souls, like a bear robbed of her cubs out in the open country. Your father is an experienced warrior. He will not spend the night with his troops.”
  philosophy: optimal-equivalence
