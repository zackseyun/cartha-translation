- pob_phrase: You know your father and his men, that they are
  simplified_phrase: You know what your father and his men are like. They are
  preserved_meaning: Hushai appeals to Absalom’s knowledge of David and his men before describing them.
  reasoning_layer_used: POB syntax and the lexical decision for יָדַעְתָּ
  rationale: The long clause becomes two direct sentences without changing Hushai’s point.
- pob_phrase: mighty men and bitter of soul
  simplified_phrase: mighty warriors, fierce with bitterness in their souls
  preserved_meaning: David’s men are powerful fighters whose bitter state makes them dangerously fierce.
  reasoning_layer_used: POB lexical decisions for גִבֹּרִים and מָרֵי נֶפֶשׁ
  rationale: The wording explains the Hebrew idiom while retaining its soul-and-bitterness image.
- pob_phrase: a man of war
  simplified_phrase: an experienced warrior
  preserved_meaning: David is characterized as skilled and seasoned in warfare.
  reasoning_layer_used: POB lexical rationale for אִישׁ מִלְחָמָה
  rationale: The common phrase states the military experience conveyed by the older idiom.
