translation:
  language: en
  text: They also brought honey, curds,[a] sheep,[b] and cheese made from cows’ milk for David and the people with him to eat. They did this because they said, “The people are hungry, weary, and thirsty in the wilderness.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “butter”; the Hebrew refers broadly to a milk product, probably curds here.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may include goats as well as sheep.
    reason: lexical_alternative
