  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term may also mean a hollow or depression in the ground.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also describe a severe defeat or military blow, not a disease.
    reason: lexical_alternative
