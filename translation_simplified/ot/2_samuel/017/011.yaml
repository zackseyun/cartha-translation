  rationale: A direct introduction clearly preserves the contrasting speech act.
- pob_phrase: all Israel be surely gathered to you
  simplified_phrase: Make sure all Israel gathers around you
  preserved_meaning: The whole nation is to assemble under Absalom’s command with strong emphasis.
