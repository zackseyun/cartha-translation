translation:
  language: en
  text: 'But here is my advice: Make sure all Israel gathers around you, from Dan to Beersheba,[a] as numerous as the sand by the sea. Then you yourself should go into battle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “From Dan to Beersheba” means from the northern end of Israel to the southern end—the whole land.
    reason: cultural_note
