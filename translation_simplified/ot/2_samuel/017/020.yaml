  text: Absalom’s servants arrived at the house and asked the woman, “Where are Ahimaaz and Jonathan?” She answered, “They crossed the stream.[a]” The servants searched for them but could not find them, so they returned to Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
