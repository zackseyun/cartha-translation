translation:
  language: en
  text: Then Absalom and all the men of Israel said, “Hushai the Archite’s advice is better than Ahithophel’s.” For Yahweh had determined[a] to make Ahithophel’s good advice fail, so that Yahweh might bring disaster[b] on Absalom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb often means “commanded,” but here it describes Yahweh’s effective determination.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word can also mean “evil,” “harm,” or “calamity”; here it means ruin coming on Absalom in judgment.
    reason: lexical_alternative
