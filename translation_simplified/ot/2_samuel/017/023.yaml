translation:
  language: en
  text: When Ahithophel saw that his advice had not been followed, he saddled the donkey and set out for his home in his city. He gave instructions to his household.[a] Then he hanged himself[b] and died, and he was buried in his father’s tomb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean that he put his household affairs in order.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew can also mean “strangled himself”; in context, it describes his suicide.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: his counsel had not been followed
  simplified_phrase: his advice had not been followed
  preserved_meaning: His strategic recommendation was not accepted and implemented.
  reasoning_layer_used: POB lexical decision for עֲצָתוֹ and נֶעֶשְׂתָה
  rationale: “Advice” is more familiar than “counsel” while retaining the political sense.
- pob_phrase: he saddled the donkey, arose, and went to his house in his city
  simplified_phrase: he saddled the donkey and set out for his home in his city
  preserved_meaning: He prepared the specified donkey and departed for his own home city.
  reasoning_layer_used: POB lexical decisions and doctrine realignment
  rationale: “Set out” naturally expresses the linked actions while “the donkey” preserves the Hebrew article.
- pob_phrase: He gave orders to his household
  simplified_phrase: He gave instructions to his household
  preserved_meaning: Before dying, he directed the members or affairs of his household.
  reasoning_layer_used: POB lexical decision and doctrine realignment
  rationale: “Instructions” is clearer than “orders” without replacing the phrase with the less explicit idiom.
translation_notes:
  risk_flags:
  - risk: The household phrase may refer more broadly to arranging his affairs.
    mitigation: Footnote a preserves this recognized alternative.
  - risk: “Hanged himself” selects one possible manner of suicide over “strangled himself.”
    mitigation: Footnote b retains the verb’s lexical ambiguity.
