- pob_phrase: said to Zadok and to Abiathar the priests
  simplified_phrase: told the priests Zadok and Abiathar
  preserved_meaning: Hushai reported the counsel to both priests.
  reasoning_layer_used: POB lexical decisions and syntax rationale
  rationale: Natural word order makes the shared title and the act of reporting immediately clear.
- pob_phrase: “This and that is what Ahithophel advised ... and this and that is what I have advised.”
  simplified_phrase: what Ahithophel had advised ... and what advice he himself had given
  preserved_meaning: Hushai reported the substance of both sets of advice without repeating them word for word.
  reasoning_layer_used: POB lexical decision for כָּזֹאת וְכָזֹאת and its footnote
  rationale: Indirect speech clearly conveys the Hebrew summary idiom without the opaque phrase “this and that.”
- pob_phrase: I have advised
  simplified_phrase: he himself had given
  preserved_meaning: The wording retains the Hebrew pronoun’s emphasis on Hushai’s own advice.
  reasoning_layer_used: POB lexical decision for יָעַצְתִּי אָנִי
  rationale: “He himself” preserves the contrast and emphasis while fitting indirect speech.
