  reasoning_layer_used: POB lexical decision for עַבְדּוֹ and its footnote
  rationale: Adding “me” makes the third-person self-reference clear without erasing it.
- pob_phrase: the threshing floor
  simplified_phrase: the place where grain is threshed
  preserved_meaning: David intends to buy the agricultural site used for threshing grain.
  reasoning_layer_used: POB lexical decision for הַגֹּרֶן
  rationale: The functional wording explains the unfamiliar historical term without naming an unstated actor.
- pob_phrase: so that the plague may be stopped from being upon the people
  simplified_phrase: so that the plague may be lifted from the people
  preserved_meaning: David seeks the plague’s removal without claiming the result as certain.
  reasoning_layer_used: POB lexical decisions for וְתֵעָצַר and מֵעַל הָעָם
  rationale: “May be lifted” preserves both intended removal and the image of a burden taken away.
