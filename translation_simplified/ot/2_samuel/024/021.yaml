translation:
  language: en
  text: Araunah asked, “Why has my lord the king come to me, his servant?” David answered, “I have come to buy from you the place where grain is threshed, to build an altar to Yahweh, so that the plague may be lifted from the people.”
  philosophy: optimal-equivalence
