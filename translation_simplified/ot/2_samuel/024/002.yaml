translation:
  language: en
  text: So the king said to Joab, the army commander who was with him, “Go through every tribe of Israel, from Dan to Beer-sheba. Count[a] the people, so I can know how many there are.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “register” or “muster.” The Hebrew may refer to taking a census, sometimes for military purposes.
    reason: lexical_alternative
