translation:
  language: en
  text: They reached the fortified city of Tyre and all the cities of the Hivites and Canaanites. Then they went out to the Negev region of Judah[a] and reached Beersheba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the southern region of Judah.” The Hebrew word can refer either to the region called the Negev or more generally to the south.
    reason: lexical_alternative
