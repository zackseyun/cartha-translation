translation:
  language: en
  text: So Gad came to David and told him, “Will your land suffer seven years of famine?[a] Or will you flee from your enemies for three months while they pursue you? Or will your land suffer three days of plague? Think carefully about what answer I should take back to the one who sent me.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The parallel account in 1 Chronicles 21:12 says “three years of famine” instead of “seven years.”
    reason: textual_variant
