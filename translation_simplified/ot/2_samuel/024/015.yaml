translation:
  language: en
  text: So Yahweh sent a plague on Israel. It lasted from that morning until the appointed time.[a] Seventy thousand men died across the land, from Dan to Beersheba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “until the set time.” The Hebrew refers to an appointed or fixed time; “until the time of assembly” is also possible but less likely here.
    reason: alternative_reading
