translation:
  language: en
  text: Then Araunah said to David, “My lord the king may take whatever he thinks best and offer it up. Here are the oxen for the burnt offering. The threshing sledges—tools used to separate grain from its stalks—and the oxen’s equipment are provided as firewood.”
  philosophy: optimal-equivalence
