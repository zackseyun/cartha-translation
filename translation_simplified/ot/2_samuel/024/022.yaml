  reasoning_layer_used: POB lexical decision for הַמֹּרִגִּים
  rationale: A short gloss explains the unfamiliar implement without replacing its name.
- pob_phrase: the threshing sledges and the implements of the oxen are for the wood
  simplified_phrase: The threshing sledges … and the oxen’s equipment are provided as firewood
  preserved_meaning: Araunah supplies both kinds of equipment as fuel for the sacrifice.
  reasoning_layer_used: POB lexical decisions for כְלֵי הַבָּקָר and לָעֵצִים plus immediate context
  rationale: The wording preserves the distinct items and states their intended use rather than mere burnability.
