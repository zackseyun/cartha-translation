translation:
  language: en
  text: But the king said to Araunah, “No. I insist on buying it from you and paying for it. I will not offer Yahweh my God burnt offerings that cost me nothing.” So David bought the place used for threshing grain and the cattle for fifty shekels of silver.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In 1 Chronicles 21:25, David pays six hundred shekels of gold for the site; here he pays fifty shekels of silver for the threshing floor and the cattle.
    reason: cross_reference
