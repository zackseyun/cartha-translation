translation:
  language: en
  text: After David counted the people, he felt guilty. He said to Yahweh, “I have sinned greatly by doing this. Yahweh, please take away your servant’s guilt.[a] I have acted very foolishly.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can also mean “iniquity” and sometimes the punishment resulting from sin.
    reason: lexical_alternative
