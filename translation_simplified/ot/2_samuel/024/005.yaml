  text: They crossed the Jordan and set up camp at Aroer. Their camp was on the right side[a] of the city in the middle of the valley of Gad[b]. Then they went toward Jazer[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some understand “right side” geographically as “south,” but the Hebrew says “right side.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word translated “valley” can also mean a ravine or seasonal streambed.
    reason: lexical_alternative
  - marker: c
    text: Or “to Jazer”; the Hebrew may indicate either direction toward Jazer or movement to it.
    reason: lexical_alternative
