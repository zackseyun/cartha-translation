translation:
  language: en
  text: When David saw the angel striking the people, he said to the LORD, “I am the one who sinned and did wrong. But these people are like sheep—what have they done? Please let your hand fall on me and on my father’s family instead.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Look, I have sinned, and I have done wrong
  simplified_phrase: I am the one who sinned and did wrong
  preserved_meaning: David emphatically accepts personal guilt.
  reasoning_layer_used: POB translation and source syntax
  rationale: The recasting expresses the force of “Look” in natural English.
- pob_phrase: these sheep—what have they done?
  simplified_phrase: these people are like sheep—what have they done?
  preserved_meaning: David portrays the people as innocent sheep under his care.
  reasoning_layer_used: Immediate context and POB metaphor
  rationale: The people are identified without removing the sheep image.
- pob_phrase: against my father's house
  simplified_phrase: on my father’s family instead
  preserved_meaning: David asks that judgment fall on his own family rather than the people.
  reasoning_layer_used: POB translation and common biblical kinship usage
  rationale: “Family” makes the household sense of “house” immediately clear.
interpretive_expansions:
- pob_phrase: these sheep
  rendering: these people are like sheep
  claim: The sheep are a metaphor for the people being struck.
  evidence:
  - The preceding clause explicitly identifies the people as those being struck.
  - David contrasts his guilt with what the sheep have done.
  confidence: high
  alternatives_preserved:
  - these sheep
translation_notes:
  risk_flags:
  - risk: “Let your hand fall on” may still sound figurative to some readers.
    mitigation: The wording preserves the source image while the request for judgment is clear from the contrast and “instead.”
