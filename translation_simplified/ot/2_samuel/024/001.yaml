translation:
  language: en
  text: Once again, Yahweh’s anger burned against Israel. He stirred David up against them,[a] saying, “Go and count Israel and Judah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In 1 Chronicles 21:1, Satan incites David. This verse identifies Yahweh as the one who incites him, so the two accounts are not harmonized here.
    reason: cross_reference
simplification_decisions:
- pob_phrase: Again the anger of Yahweh burned against Israel
  simplified_phrase: Once again, Yahweh’s anger burned against Israel.
  preserved_meaning: Yahweh’s anger toward Israel flared again, with the burning image retained.
  reasoning_layer_used: lexical decisions for וַיֹּסֶף, אַף, יְהוָה, לַחֲרוֹת, and בְּיִשְׂרָאֵל
  rationale: The direct sentence and possessive wording are easier to read while preserving the renewed burning anger.
- pob_phrase: he incited David against them
  simplified_phrase: He stirred David up against them
  preserved_meaning: Yahweh prompted David toward the action directed against Israel.
  reasoning_layer_used: lexical decision for וַיָּסֶת and theological decision on divine agency
  rationale: “Stirred up” is common English and keeps Yahweh as the subject without harmonizing Chronicles.
translation_notes:
  risk_flags:
