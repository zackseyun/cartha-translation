translation:
  language: en
  text: The angel stretched out his hand toward Jerusalem to destroy the city. But Yahweh relented concerning the disaster. He said to the angel who was destroying the people, “Enough! Stop now and pull back your hand.” At that time, the angel of Yahweh was beside the threshing floor[b] of Araunah the Jebusite.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Araunah is called Ornan in the parallel account in 1 Chronicles 21:15.
    reason: cross_reference
  - marker: b
    text: A threshing floor was a level place where grain was separated from its husks.
    reason: cultural_note
simplification_decisions:
- pob_phrase: When the angel stretched out his hand toward Jerusalem to destroy it, Yahweh relented concerning the calamity
  simplified_phrase: The angel stretched out his hand toward Jerusalem to destroy the city. But Yahweh relented concerning the disaster.
  preserved_meaning: The angel began the action of judgment against Jerusalem, but Yahweh turned from allowing further disaster.
  reasoning_layer_used: POB lexical and theological decisions on שׁלח + יד, שׁחת, נחם, and רָעָה
  rationale: Two sentences clarify the sequence while preserving the hand image and the nonmoral sense of disaster.
- pob_phrase: Enough; now withdraw your hand
  simplified_phrase: Enough! Stop now and pull back your hand.
  preserved_meaning: Yahweh commands the angel to end the destructive action immediately.
  reasoning_layer_used: POB lexical decisions on רַב and עַתָּה הֶרֶף יָדֶךָ
  rationale: The direct command explains the idiom without losing its concrete image.
- pob_phrase: And the angel of Yahweh was by the threshing floor of Araunah the Jebusite
  simplified_phrase: At that time, the angel of Yahweh was beside the threshing floor of Araunah the Jebusite.
  preserved_meaning: The angel was located near Araunah's threshing floor.
  reasoning_layer_used: POB lexical decisions on וּמַלְאַךְ יְהוָה, הָיָה עִם, גֹּרֶן, and the proper names
  rationale: The time transition and “beside” make the location natural while retaining the biblical title and historical terms.
translation_notes:
  risk_flags:
  - risk: “Relented” may be misunderstood as admitting moral error.
    mitigation: “Concerning the disaster” keeps the phrase focused on Yahweh stopping further judgment.
  - risk: Readers may assume the verse settles the angel of Yahweh's precise identity.
    mitigation: The text retains the title without identifying the figure as either a created angel or a divine manifestation.
