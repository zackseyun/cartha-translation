translation:
  language: en
  text: But things will not go well for the wicked. He will not live long; his days will be like a shadow, because he does not have reverent fear before God.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: it will not go well for the wicked
  simplified_phrase: things will not go well for the wicked
  preserved_meaning: The wicked will not ultimately have a favorable outcome.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Things” makes the outcome expression natural without imposing a timetable on the principle.
- pob_phrase: he will not prolong his days
  simplified_phrase: He will not live long
  preserved_meaning: The wicked person will not lengthen his lifetime.
  reasoning_layer_used: lexical decision
  rationale: The common expression states the same temporal meaning directly.
- pob_phrase: like a shadow
  simplified_phrase: his days will be like a shadow
  preserved_meaning: The shadow image remains attached to the wicked person’s days and conveys their transience.
  reasoning_layer_used: lexical decision and grounding review
  rationale: The clause makes the image’s connection clear without turning it into a separate claim about life passing.
interpretive_expansions:
- pob_phrase: does not fear before God
  rendering: does not have reverent fear before God
  claim: Fear here means reverence toward God rather than mere terror.
  evidence:
  - The POB lexical rationale describes an ongoing lack of reverence.
  - The phrase “before God” preserves the setting of God’s presence.
  confidence: high
  alternatives_preserved:
  - does not fear before God
  - does not revere God
translation_notes:
  risk_flags:
  - risk: “Will not live long” may sound like an absolute rule for every wicked person.
    mitigation: The wording preserves the proverb-like assertion without adding a mechanistic timetable.
  - risk: Separating the clauses may make the shadow image seem like an additional assertion.
    mitigation: “His days” explicitly keeps the image tied to the source statement about the length and nature of his days.
