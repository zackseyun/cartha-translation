translation:
  language: en
  text: No human being can control the wind or hold it back.[a] No one can control the day of death. No one can be released from military duty during war, and wickedness will not rescue those who make it their own.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Hebrew word can also mean “spirit” or “breath”: “No human being can control the spirit or hold it back.”'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: No man has power over the wind to restrain it
  simplified_phrase: No human being can control the wind or hold it back
  preserved_meaning: Human beings lack power to confine or control the wind.
  reasoning_layer_used: POB lexical and theological decisions on אָדָם, שַׁלִּיט, רוּחַ, and לִכְלוֹא
  rationale: Common wording makes the image immediate while retaining “wind” as the main reading.
- pob_phrase: there is no power over the day of death
  simplified_phrase: No one can control the day of death
  preserved_meaning: The time of death lies beyond human control.
  reasoning_layer_used: POB lexical decision on שִׁלְטוֹן בְּיוֹם הַמָּוֶת
  rationale: The personal construction states the same limit more directly.
- pob_phrase: wickedness will not deliver its owners
  simplified_phrase: wickedness will not rescue those who make it their own
  preserved_meaning: Wickedness cannot bring its practitioners to safety.
  reasoning_layer_used: POB lexical decisions on רֶשַׁע, יְמַלֵּט, and בְּעָלָיו
  rationale: This explains the unusual ownership image without removing it.
