translation:
  language: en
  text: No man can control the wind or hold it back.[a] No one has authority over the day of death. No one can be released from military duty during war, and wickedness will not rescue its master.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Or “the spirit”: “No man can control the spirit or hold it back.” The Hebrew word can mean wind, spirit, or breath.'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: has power over the wind to restrain the wind
  simplified_phrase: can control the wind or hold it back
  preserved_meaning: Human beings cannot master or confine the wind.
  reasoning_layer_used: Lexical decision for שַׁלִּיט and לִכְלוֹא
  rationale: The rewrite removes repetition while retaining both control and restraint.
- pob_phrase: there is no discharge in war
  simplified_phrase: No one can be released from military duty during war
  preserved_meaning: War does not permit release from military service.
  reasoning_layer_used: Lexical decisions for מִשְׁלַחַת and בַּמִּלְחָמָה
  rationale: The wording explains the military sense of the unfamiliar term “discharge.”
- pob_phrase: wickedness will not deliver its master
  simplified_phrase: wickedness will not rescue its master
  preserved_meaning: Wickedness cannot bring its devoted practitioner to safety.
  reasoning_layer_used: Lexical decisions for רֶשַׁע, יְמַלֵּט, and בְּעָלָיו
  rationale: “Rescue” is clearer than “deliver,” while “its master” preserves the personified image.
interpretive_expansions:
- pob_phrase: no discharge in war
  rendering: No one can be released from military duty during war
  claim: The release is specifically from military service.
  evidence:
  - The lexical rationale identifies מִשְׁלַחַת as release from service in a military context.
  - The phrase “in war” supplies the military setting.
  confidence: high
  alternatives_preserved:
  - There is no release during war.
  - There is no exemption in war.
translation_notes:
  risk_flags:
