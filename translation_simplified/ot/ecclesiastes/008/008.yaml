    mitigation: The main text follows POB’s chosen reading, and the footnote preserves the genuine alternative.
  - risk: Modern readers may find the personification “wickedness will not rescue its master” unusual.
    mitigation: The image is retained because it expresses the source relationship between wickedness and the person devoted to it.
