translation:
  language: en
  text: Do not rush to leave his presence.[a] Do not commit yourself to an evil course,[b] because he does whatever he pleases.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean, “Do not become alarmed and leave his presence.”
    reason: lexical_alternative
  - marker: b
    text: This may also mean, “Do not support a wicked cause” or “Do not persist in an evil matter.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Do not be hasty to leave his presence
  simplified_phrase: Do not rush to leave his presence
  preserved_meaning: The warning concerns leaving the ruler impulsively while still preserving the courtly setting.
  reasoning_layer_used: POB lexical decisions for תִּבָּהֵל and מִפָּנָיו תֵּלֵךְ
  rationale: “Rush to leave” expresses rash, hurried action in ordinary English.
- pob_phrase: Do not take your stand in an evil matter
  simplified_phrase: Do not commit yourself to an evil course
  preserved_meaning: The command warns against adopting or maintaining a position in something morally evil.
  reasoning_layer_used: POB lexical decisions for תַּעֲמֹד and בְּדָבָר רָע
  rationale: “Commit yourself” makes the figurative force of taking a stand immediately understandable.
- pob_phrase: for he does whatever he pleases
  simplified_phrase: because he does whatever he pleases
  preserved_meaning: The ruler’s effective power to carry out his will explains the warnings.
  reasoning_layer_used: POB lexical decisions for כִּי and the final clause
  rationale: “Because” makes the verse’s reason-result connection clearer.
translation_notes:
  risk_flags:
