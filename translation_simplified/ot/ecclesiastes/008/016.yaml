translation:
  language: en
  text: When I devoted my heart to understanding wisdom and carefully examining the activity being done on earth—for day and night his eyes see no sleep—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, “he gets no sleep day or night.” The Hebrew says “his eyes see no sleep” and does not make clear whether “his” means the Teacher or a person generally.
    reason: lexical_alternative
