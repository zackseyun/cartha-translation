- pob_phrase: knows the proper time and judgment
  simplified_phrase: knows the right time and what should be done
  preserved_meaning: Wisdom discerns both the fitting time and the right decision, course, or procedure.
  reasoning_layer_used: Lexical decision for עֵת and מִשְׁפָּט
  rationale: The wording explains the broad practical sense of “judgment” without collapsing the two ideas.
