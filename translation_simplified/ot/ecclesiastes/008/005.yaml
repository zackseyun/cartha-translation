translation:
  language: en
  text: Whoever obeys a command will not experience trouble.[a] A wise heart recognizes the right time and the right decision.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “will not know an evil thing”; it may refer to evil itself or, more likely here, to trouble or harmful consequences.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: keeps a command
  simplified_phrase: obeys a command
  preserved_meaning: The person follows a command through obedience.
  reasoning_layer_used: Lexical decision for שׁוֹמֵר
  rationale: “Obeys” gives the intended sense of “keeps” more directly.
- pob_phrase: will not know an evil thing
  simplified_phrase: will not experience trouble
  preserved_meaning: The obedient person avoids trouble or an adverse consequence.
  reasoning_layer_used: Lexical decision and footnote for דָּבָר רָע
  rationale: “Experience trouble” expresses the likely contextual sense without implying guaranteed physical safety.
- pob_phrase: knows the proper time and judgment
  simplified_phrase: recognizes the right time and the right decision
  preserved_meaning: Wisdom discerns both the fitting time and the fitting decision.
  reasoning_layer_used: Lexical decisions for עֵת and מִשְׁפָּט
  rationale: The wording clearly preserves the two distinct objects of wise discernment.
interpretive_expansions:
- pob_phrase: will not know an evil thing
  rendering: will not experience trouble
  claim: “Know” is expressed experientially, and the evil thing is understood as trouble or adverse consequence.
  evidence:
  - The lexical rationale identifies adverse consequence or trouble as the likely contextual sense.
  - The POB footnote explicitly permits trouble or harmful consequence.
  confidence: moderate
  alternatives_preserved:
  - will not know an evil thing
  - will not experience a bad thing
- pob_phrase: judgment
  rendering: the right decision
  claim: “Judgment” refers here to the fitting decision or procedure.
  evidence:
  - The lexical rationale includes decision or the right course in this context.
  - The POB footnote explains the term as the right decision or procedure.
  confidence: high
  alternatives_preserved:
  - judgment
  - the proper procedure
translation_notes:
  risk_flags:
  - risk: “Experience trouble” foregrounds adverse consequence over the possible moral sense of evil.
    mitigation: The footnote preserves both senses and identifies trouble as the more likely one here.
  - risk: “The right decision” does not express the full lexical range of “judgment.”
    mitigation: It preserves the documented contextual sense while avoiding the narrower wording “way to act.”
