simplification_decisions:
- pob_phrase: I say
  simplified_phrase: I tell you
  preserved_meaning: The speaker personally urges the hearer to follow the instruction.
  reasoning_layer_used: POB lexical decision for אֲנִי
  rationale: “I tell you” supplies the implied speech more naturally in modern English.
- pob_phrase: keep the king’s command
  simplified_phrase: obey the king’s command
  preserved_meaning: The hearer is to act according to the king’s authoritative command.
  reasoning_layer_used: POB lexical decisions for פִּי מֶלֶךְ and שְׁמֹר
  rationale: “Obey” makes the intended response to the royal command immediately clear.
- pob_phrase: the oath of God
  simplified_phrase: the oath involving God
  preserved_meaning: The oath has a relationship to God that the Hebrew leaves unspecified.
  reasoning_layer_used: POB theological decision and ambiguity revision
  rationale: “Involving God” is understandable without choosing who made or received the oath.
