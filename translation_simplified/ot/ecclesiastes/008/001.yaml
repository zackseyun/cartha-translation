translation:
  language: en
  text: Who is like the wise man? Who understands what a matter means? A man's wisdom brightens his face and changes his stern expression.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “changes his bold expression.” The Hebrew word can describe sternness, strength, or boldness in a person’s face.
    reason: lexical_alternative
