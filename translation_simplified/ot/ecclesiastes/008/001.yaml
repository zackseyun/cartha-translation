translation:
  language: en
  text: Who can compare with the wise man? Who understands what a matter means? A man's[a] wisdom brightens his face and changes the hard look on his face.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses “man” in a singular, representative sense.
    reason: source_note
  - marker: b
    text: The Hebrew expression may also mean that the bold or stern look on his face is changed.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Who is like the wise man
  simplified_phrase: Who can compare with the wise man
  preserved_meaning: The rhetorical question presents the wise man as exceptional.
  reasoning_layer_used: Lexical decision for כְּהֶחָכָם
  rationale: “Can compare with” states the comparison naturally while retaining the representative singular.
- pob_phrase: who knows the interpretation of a matter
  simplified_phrase: who understands what a matter means
  preserved_meaning: The wise person can discern the meaning or explanation of a matter.
  reasoning_layer_used: Lexical decision for פֵּשֶׁר דָּבָר
  rationale: The rewrite replaces abstract wording with a direct question about meaning.
- pob_phrase: the hardness of his face is changed
  simplified_phrase: changes the hard look on his face
  preserved_meaning: Wisdom alters a hard, severe, or stern facial expression.
  reasoning_layer_used: Lexical decisions for עֹז פָּנָיו and יְשֻׁנֶּא
  rationale: The idiom is expressed as a visible facial expression without overstating the kind of change.
translation_notes:
  risk_flags:
