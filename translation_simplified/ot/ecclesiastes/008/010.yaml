  preserved_meaning: The Teacher reports seeing morally wicked people buried.
  reasoning_layer_used: POB lexical decisions for וּבְכֵן, רָאִיתִי, רְשָׁעִים, and קְבֻרִים
  rationale: “Wicked people” is immediately clear while “buried” preserves the compact description.
- pob_phrase: they had come and gone from the holy place, and they were forgotten in the city where they had done so
  simplified_phrase: They had come and gone from the holy place, and they were forgotten in the city where they had acted this way
  preserved_meaning: Their connection to the sacred place and later disappearance from civic memory remain intentionally unspecified.
  reasoning_layer_used: POB lexical and theological decisions on the difficult holy-place clause
  rationale: “Acted this way” clarifies the backward reference without defining their activity or adding a contrast.
- pob_phrase: This too is vanity
  simplified_phrase: This too is vanity—like vapor, fleeting and elusive
  preserved_meaning: The observation belongs to Ecclesiastes’ recurring image of what is transient and hard to grasp.
  reasoning_layer_used: POB lexical decision and footnote for הָבֶל
  rationale: The familiar term remains while its concrete image and force are explained.
