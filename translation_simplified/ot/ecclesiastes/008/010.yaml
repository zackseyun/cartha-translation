translation:
  language: en
  text: And so I saw wicked people being buried. They had gone in and out of the holy place[a], and they were forgotten[b] in the city where they had acted this way. This too is vapor—fleeting and hard to grasp.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “holy place” may mean the temple grounds or another sacred place.
    reason: cultural_note
  - marker: b
    text: Some ancient versions support “they were praised” instead of “they were forgotten.”
    reason: textual_variant
  - marker: c
    text: The Hebrew word is traditionally translated “vanity” and uses vapor as an image of what is fleeting or elusive.
    reason: lexical_alternative
