translation:
  language: en
  text: So I saw wicked people buried.[a] They had come and gone from the holy place,[b] and they were forgotten in the city where they had acted this way. This too is vanity—like vapor, fleeting and elusive.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some ancient versions and another understanding of the Hebrew read, “and they were praised in the city where they had acted this way.”
    reason: textual_variant
  - marker: b
    text: The “holy place” may be the temple grounds or another sacred place.
    reason: cultural_note
