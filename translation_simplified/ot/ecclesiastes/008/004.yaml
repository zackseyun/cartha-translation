  reasoning_layer_used: POB lexical decisions for דְּבַר, מֶלֶךְ, and שִׁלְטוֹן
  rationale: “Carries authority” expresses the binding force in natural modern English.
- pob_phrase: who may say to him
  simplified_phrase: who can say to him
  preserved_meaning: The rhetorical question stresses that a king cannot readily be challenged.
