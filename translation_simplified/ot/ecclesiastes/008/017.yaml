  simplified_phrase: all that God does
  preserved_meaning: God's work and activity remain the object of the speaker's observation.
  reasoning_layer_used: POB lexical decision for מַעֲשֵׂה הָאֱלֹהִים
  rationale: The verbal wording is clearer while preserving the broad scope of God's work.
- pob_phrase: man cannot find out the work that is done under the sun
  simplified_phrase: man cannot discover what is done under the sun
  preserved_meaning: Humanity cannot succeed in discovering the activity taking place under the sun.
  reasoning_layer_used: POB lexical decisions for הָאָדָם, לִמְצוֹא, and the under-the-sun clause
  rationale: “Discover” clearly expresses intellectual inquiry without weakening the categorical inability.
- pob_phrase: However much man labors to seek it out, he will not find it
  simplified_phrase: No matter how hard he works to understand what is done under the sun, he will not discover it
  preserved_meaning: Even strenuous human inquiry cannot uncover what is done under the sun.
  reasoning_layer_used: POB lexical decisions for בְּשֶׁל אֲשֶׁר, יַעֲמֹל, לְבַקֵּשׁ, and וְלֹא יִמְצָא
  rationale: The object is repeated for clarity, and the failed search remains absolute.
interpretive_expansions:
