translation:
  language: en
  text: 'then I saw all that God does: man cannot discover what is done under the sun. No matter how hard he works to understand what is done under the sun, he will not discover it. Even if a wise man says he knows, he still cannot discover it.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “man” refers to humanity in general, not only to males.
    reason: lexical_alternative
