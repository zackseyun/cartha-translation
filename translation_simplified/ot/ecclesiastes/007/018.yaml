translation:
  language: en
  text: It is good to take hold of this. Do not let go of that either, because the one who fears God will come through them all.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “will come out from them all,” meaning to emerge successfully from these matters; some understand it as “will avoid them all.”
