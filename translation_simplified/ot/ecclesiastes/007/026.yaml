translation:
  language: en
  text: I find the woman more bitter than death. Her heart is traps and nets, and her hands are chains. Someone who is good before God[a] will escape from her, but a sinner will be caught by her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Someone who pleases God.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And I find more bitter than death the woman whose heart is traps and nets, and whose hands are chains.
  simplified_phrase: I find the woman more bitter than death. Her heart is traps and nets, and her hands are chains.
  preserved_meaning: The speaker personally describes the woman as worse than death and retains all three capture images.
  reasoning_layer_used: Lexical decisions for וּמוֹצֶא אֲנִי, מַר מִמָּוֶת, לִבָּהּ, and אֲסוּרִים יָדֶיהָ.
  rationale: Two direct sentences replace the difficult clause order without weakening the metaphors.
- pob_phrase: The one who is good before God
  simplified_phrase: Someone who is good before God
  preserved_meaning: The person stands as good before God, with “pleases God” kept only as an alternative.
  reasoning_layer_used: Lexical and theological decision for טוֹב לִפְנֵי הָאֱלֹהִים.
  rationale: “Someone” is more natural while preserving the deliberately lexical phrase “good before God.”
- pob_phrase: but the sinner will be caught by her
  simplified_phrase: but a sinner will be caught by her
  preserved_meaning: A person characterized as a sinner is captured by the woman.
  reasoning_layer_used: Lexical decisions for וְחוֹטֵא and יִלָּכֶד בָּהּ.
  rationale: The indefinite article makes the contrast natural in modern English without changing its moral force.
translation_notes:
  risk_flags:
  - risk: “The woman” could be misread as a statement about all women.
    mitigation: The singular wording is retained because the source leaves open whether she is a particular woman, a type, or personified folly.
  - risk: The abrupt metaphors may sound unusual to modern readers.
    mitigation: The short sentences clarify their structure while preserving the source’s traps, nets, and chains.
