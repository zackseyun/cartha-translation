simplification_decisions:
- pob_phrase: there is no righteous man on the earth who
  simplified_phrase: no righteous man on earth
  preserved_meaning: No righteous human being anywhere in the world is an exception.
  reasoning_layer_used: Lexical decisions for אֵין, צַדִּיק, אָדָם, and בָּאָרֶץ
  rationale: The shorter construction keeps the universal statement and the representative singular “man.”
- pob_phrase: does good and does not sin
  simplified_phrase: does good without ever sinning
  preserved_meaning: Even someone who does good is not entirely free from sin.
  reasoning_layer_used: Lexical decision for וְלֹא יֶחֱטָא
  rationale: The recast clause expresses the same contrast in more natural English.
interpretive_expansions:
- pob_phrase: does not sin
  rendering: without ever sinning
  claim: The verse denies that any righteous person passes through life entirely free from sin.
  evidence:
