translation:
  language: en
  text: 'During this fleeting life of mine, a life like vapor, I have seen it all: a righteous man perish in his righteousness,[a] and a wicked man live a long life in his evil.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean that he perishes despite his righteousness or because of it.
    reason: alternative_reading
  - marker: b
    text: The Hebrew may also mean that he lives long despite his evil or because of it.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: in the days of my vanity
  simplified_phrase: During this fleeting life of mine, a life like vapor
  preserved_meaning: The speaker describes his life as brief, elusive, and vapor-like rather than morally vain.
  reasoning_layer_used: lexical and theological decisions on הֶבֶל
  rationale: This replaces the misleading modern sense of “vanity” while preserving Ecclesiastes’ vapor image.
- pob_phrase: there is a righteous man perishing ... and there is a wicked man prolonging
  simplified_phrase: a righteous man perish ... and a wicked man live
  preserved_meaning: The verse presents two contrasting cases the speaker has observed.
  reasoning_layer_used: lexical decisions on יֵשׁ and the participles
  rationale: Placing both cases directly after “I have seen” makes the sentence natural without merging them.
- pob_phrase: prolonging his life
  simplified_phrase: live a long life
  preserved_meaning: The wicked man’s lifespan continues longer than expected.
  reasoning_layer_used: lexical decision on מַאֲרִיךְ
  rationale: The common English phrase states the same extended-lifespan sense more directly.
interpretive_expansions:
- pob_phrase: in the days of my vanity
  rendering: During this fleeting life of mine, a life like vapor
  claim: The phrase refers to the speaker’s transient, vapor-like life, not to sinful pride.
  evidence:
  - The source term הֶבֶל evokes vapor, transience, and elusiveness in Ecclesiastes.
  - The POB theological decision identifies the speaker’s fleeting life as the intended sense.
  confidence: high
  alternatives_preserved:
  - my vanity
  - my futility
translation_notes:
  risk_flags:
