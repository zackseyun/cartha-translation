simplification_decisions:
- pob_phrase: Do not be overly righteous
  simplified_phrase: Do not be too righteous
  preserved_meaning: The warning concerns excess rather than rejecting righteousness itself.
  reasoning_layer_used: Lexical and theological decisions on הַרְבֵּה
  rationale: “Too righteous” plainly marks excess without adding a process of trying.
- pob_phrase: do not make yourself too wise
  simplified_phrase: do not make yourself too wise
  preserved_meaning: The wording retains the Hebrew verb’s self-directed force.
  reasoning_layer_used: Lexical decision on תִּתְחַכַּם
  rationale: Keeping “make yourself” avoids weakening the command with an added idea of attempting.
- pob_phrase: Why should you ruin yourself?
  simplified_phrase: Why ruin yourself?
  preserved_meaning: The rhetorical question warns that such excess can bring personal devastation.
  reasoning_layer_used: Lexical decision on תִּשּׁוֹמֵם
  rationale: The shorter question is natural English and keeps the warning’s force.
translation_notes:
  risk_flags:
  - risk: The verse could sound as though genuine righteousness itself is wrong.
    mitigation: “Too” identifies excess while preserving the verse’s deliberate tension.
  - risk: “Ruin” does not convey the Hebrew verb’s full range.
    mitigation: The footnote preserves the senses of destruction, desolation, and being appalled.
