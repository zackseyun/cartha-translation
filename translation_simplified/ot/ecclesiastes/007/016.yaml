translation:
  language: en
  text: Do not take righteousness to an extreme, and do not make yourself too wise. Why bring yourself to ruin?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Why destroy yourself?” The Hebrew can also suggest becoming desolate or appalled.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Do not be overly righteous
  simplified_phrase: Do not take righteousness to an extreme
  preserved_meaning: The warning concerns excessive righteousness, not righteousness itself.
  reasoning_layer_used: Lexical and theological decisions
  rationale: This wording makes the degree warning clear without condemning genuine righteousness.
- pob_phrase: do not make yourself too wise
  simplified_phrase: do not make yourself too wise
  preserved_meaning: The warning remains a direct prohibition against a self-directed pursuit of excessive wisdom.
  reasoning_layer_used: Lexical decision for תִּתְחַכַּם and grounding review
  rationale: Keeping the direct wording preserves the reflexive force without adding an unsupported sense of attempting.
- pob_phrase: Why should you ruin yourself?
  simplified_phrase: Why bring yourself to ruin?
  preserved_meaning: The excess can have a self-destructive outcome.
  reasoning_layer_used: Lexical decision for תִּשּׁוֹמֵם
  rationale: The recast question is natural English and retains the warning force.
translation_notes:
  risk_flags:
  - risk: The verse could be mistaken for rejecting righteousness or wisdom.
    mitigation: “To an extreme” and “too wise” limit both warnings to excess.
  - risk: “Ruin” does not convey every possible sense of the Hebrew verb.
    mitigation: The footnote preserves the alternatives “destroy,” “desolate,” and “appalled.”
