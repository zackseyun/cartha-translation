translation:
  language: en
  text: For oppression makes a wise man act foolishly. A bribe[a] destroys his heart—his judgment, understanding, and will.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a gift.” The Hebrew word can mean any gift, but here it probably means a gift intended to corrupt someone.
    reason: lexical_alternative
