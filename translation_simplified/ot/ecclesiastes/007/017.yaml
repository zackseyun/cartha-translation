  text: Do not be wicked to an extreme,[a] and do not be a fool. Why should you die too soon?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says not to be wicked “excessively” or “too much.” This deliberate tension does not approve of lesser wickedness.
