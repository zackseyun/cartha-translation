translation:
  language: en
  text: Do not be very wicked.[a] Do not be a fool. Why should you die before your time?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says, “Do not be wicked to a great degree.” This deliberate wording does not approve of lesser wickedness.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Do not be excessively wicked
  simplified_phrase: Do not be very wicked
  preserved_meaning: The warning retains the Hebrew degree term without adding an ongoing lifestyle sense.
  reasoning_layer_used: Lexical decisions for תִּרְשַׁע and הַרְבֵּה, guarded by the theological decision to preserve the tension.
  rationale: “Very wicked” is common English and directly modifies the person’s wickedness.
- pob_phrase: Do not be excessively wicked, and do not be a fool.
  simplified_phrase: Do not be very wicked. Do not be a fool.
  preserved_meaning: The two distinct warnings remain direct and separate.
  reasoning_layer_used: Optimal-equivalence style and the retained lexical choice “be a fool.”
  rationale: Two short sentences make the paired commands easier to understand.
translation_notes:
