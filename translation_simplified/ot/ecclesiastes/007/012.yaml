translation:
  language: en
  text: 'For wisdom provides shelter[a], just as money does. But knowledge has this advantage: wisdom preserves the lives of those who have it.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “in the shadow of wisdom, in the shadow of money”; the shadow is an image of shelter or protection.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also mean that wisdom “gives life to” or “keeps alive” those who have it.
    reason: lexical_alternative
