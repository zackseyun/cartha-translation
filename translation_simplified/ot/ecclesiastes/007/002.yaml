  preserved_meaning: The contrast remains between joining mourning and joining a celebratory meal.
  reasoning_layer_used: POB lexical decision for בֵּית מִשְׁתֶּה
  rationale: The ordinary verb “attend” expresses going to the event without repeating an opaque house idiom.
