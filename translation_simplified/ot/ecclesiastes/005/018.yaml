  - his share
translation_notes:
  risk_flags:
  - risk: The “when” construction could be read as saying wealth always brings the ability to enjoy it.
    mitigation: “Along with” presents wealth and the ability as gifts received together in the case described.
  - risk: Modern readers may hear “a man” as excluding women.
    mitigation: The footnote explains the representative force of the Hebrew masculine singular.
