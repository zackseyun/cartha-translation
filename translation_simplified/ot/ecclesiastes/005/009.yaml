translation:
  language: en
  text: Whoever loves money never has enough money. Whoever loves having plenty is never satisfied with what they gain.[a] This too is vapor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew wording is difficult; “having plenty” may mean “wealth,” and “what they gain” may mean “income,” “increase,” or “produce.”
    reason: alternative_reading
  - marker: b
    text: “Vapor” is a recurring image in Ecclesiastes for what is fleeting, elusive, or insubstantial.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: loves silver ... satisfied with silver
  simplified_phrase: loves money ... has enough money
  preserved_meaning: Love of money creates an appetite that money cannot satisfy.
  reasoning_layer_used: POB lexical decisions for כֶּסֶף and יִשְׂבַּע
  rationale: “Money” states the ordinary sense of “silver,” while “never has enough” clearly expresses insatiability.
- pob_phrase: loves abundance with income
  simplified_phrase: loves having plenty ... satisfied with what they gain
  preserved_meaning: A person devoted to abundance remains unsatisfied by further gain.
  reasoning_layer_used: POB lexical decisions for הָמוֹן and תְבוּאָה
  rationale: The rewrite makes the difficult parallel clause readable without narrowing its broad economic sense.
- pob_phrase: this too is vapor
  simplified_phrase: This too is vapor
  preserved_meaning: The pursuit is fleeting, elusive, and unable to provide lasting satisfaction.
  reasoning_layer_used: POB theological decision for הָבֶל
  rationale: The concrete image is retained and briefly explained rather than reduced to “meaningless.”
translation_notes:
  risk_flags:
  - risk: The difficult Hebrew second clause permits more than one relationship between abundance and gain.
    mitigation: The footnote preserves the main lexical alternatives without forcing one syntax.
  - risk: Modern readers may take “vapor” only as a physical substance.
    mitigation: The footnote identifies its recurring figurative force in Ecclesiastes.
