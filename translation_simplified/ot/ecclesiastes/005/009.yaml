    text: The Hebrew clause is compressed; “wealth” may also mean “abundance,” and “what they gain” may mean income, increase, or yield.
    reason: alternative_reading
  - marker: b
    text: Hebrew “vapor,” traditionally translated “vanity,” describes what is fleeting, elusive, or insubstantial.
    reason: lexical_alternative
