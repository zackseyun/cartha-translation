translation:
  language: en
  text: Do not let what you say cause you yourself to sin.[a] Do not tell the messenger,[b] “It was a mistake.” Why should God be angry because of what you said and destroy the work of your hands?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “Do not let your mouth cause your flesh to sin.”
    reason: source_note
  - marker: b
    text: Or “angel.” The Hebrew word can mean either a human messenger or a heavenly messenger.
    reason: alternative_reading
