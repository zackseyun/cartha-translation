    reason: alternative_reading
simplification_decisions:
- pob_phrase: let your mouth cause your flesh to sin
  simplified_phrase: let your words cause you to sin
  preserved_meaning: A person’s own speech can bring that person into sin.
  reasoning_layer_used: POB lexical decisions for the causative verb and “flesh” as the embodied self
  rationale: This keeps the causative force without making the body sound like a separate agent.
- pob_phrase: say before the messenger
  simplified_phrase: tell the messenger
  preserved_meaning: The person gives the excuse directly to the messenger.
  reasoning_layer_used: POB syntax and theological decision on the messenger
  rationale: “Tell” replaces the formal wording while preserving the unresolved identity of the messenger.
- pob_phrase: God be angry at your voice
  simplified_phrase: God be angry at what you said
  preserved_meaning: God responds in anger to the person’s spoken words.
  reasoning_layer_used: POB lexical rationale that “voice” refers to the spoken vow or excuse
  rationale: The idiomatic wording communicates the meaning directly without personifying the voice.
