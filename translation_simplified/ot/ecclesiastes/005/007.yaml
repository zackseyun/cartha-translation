translation:
  language: en
  text: If you see the poor being oppressed and justice and what is right being stolen away in a province, do not be surprised. A high official is watched by someone higher, and even higher authorities are over them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may describe layers of human officials, but it may also suggest that God ultimately watches over them all.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the oppression of the poor
  simplified_phrase: the poor being oppressed
  preserved_meaning: Poor people are suffering oppressive exploitation.
  reasoning_layer_used: Lexical decision for עֹשֶׁק and רָשׁ
  rationale: The active wording makes the injustice easier to picture without narrowing oppression to extortion.
- pob_phrase: the robbery of justice and righteousness
  simplified_phrase: justice and what is right being stolen away
  preserved_meaning: Both legal justice and moral rightness are forcibly denied.
  reasoning_layer_used: Lexical decisions for גֵזֶל, מִשְׁפָּט, and צֶדֶק
  rationale: This keeps the robbery image while expressing righteousness in common English.
- pob_phrase: do not be astonished at the matter; for a high official is watched by one higher
  simplified_phrase: do not be surprised. A high official is watched by someone higher
  preserved_meaning: Such injustice occurs within layers of supervisory authority.
  reasoning_layer_used: Lexical decisions for תִּתְמַהּ, הַחֵפֶץ, and שֹׁמֵר
  rationale: Two short sentences replace the formal clause while retaining the hierarchy and oversight.
translation_notes:
  risk_flags:
  - risk: “Higher authorities” may sound as though the verse refers only to human officials.
    mitigation: The footnote preserves the possible implication of ultimate divine oversight without inserting God into the main text.
