  text: If you see poor people being oppressed, and justice and what is right being stolen away in a government district, do not be surprised by this. One high official watches over another, and still higher ones are over them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may describe layers of human authority, but it may also suggest that God ultimately watches over them.
    reason: alternative_reading
