translation:
  language: en
  text: Do not be rash when you speak.[a] Do not let your heart rush to say anything before God. God is in heaven, and you are on earth, so keep your words few.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “Do not be hasty with your mouth.”
    reason: source_note
simplification_decisions:
- pob_phrase: Do not be hasty to speak
  simplified_phrase: Do not be rash when you speak
  preserved_meaning: The warning still concerns impulsive speech, not merely fast speech.
  reasoning_layer_used: Lexical decision for תְּבַהֵל and the applied source audit
  rationale: “Rash when you speak” states the danger in familiar English while the note preserves the mouth image.
- pob_phrase: do not let your heart be quick to utter a word before God
  simplified_phrase: Do not let your heart rush to say anything before God
  preserved_meaning: The inner thought and will must not hurry into speech in God’s presence.
  reasoning_layer_used: Lexical decisions for לִבְּךָ and יְמַהֵר לְהוֹצִיא דָבָר
  rationale: “Rush to say anything” is natural English and keeps the broad reference to speech.
- pob_phrase: for God is in heaven and you are on earth. Therefore let your words be few.
  simplified_phrase: God is in heaven, and you are on earth, so keep your words few.
  preserved_meaning: Human restraint follows from the contrast between God’s heavenly place and humanity’s earthly place.
  reasoning_layer_used: Lexical decisions for heaven, earth, and the inferential phrase
  rationale: Joining the conclusion with “so” makes the logic immediate without weakening the command.
translation_notes:
  risk_flags:
  - risk: “Say anything” could be mistaken for a total ban on speaking before God.
    mitigation: The commands against rashness and excess define the warning as restraint, not silence.
