translation:
  language: en
  text: Do not be quick to open your mouth,[a] and do not let your heart rush to speak before God. God is in heaven, and you are on earth, so keep your words few.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This warning concerns speech before God broadly, though the context may include rash vows.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Do not be hasty with your mouth
  simplified_phrase: Do not be quick to open your mouth
  preserved_meaning: The bodily image and warning against impulsive speech are both retained.
  reasoning_layer_used: Lexical decision for תְּבַהֵל and עַל פִּיךָ
  rationale: The familiar expression is clearer than “hasty with your mouth.”
- pob_phrase: do not let your heart be quick to bring forth a word before God
  simplified_phrase: do not let your heart rush to speak before God
  preserved_meaning: The heart remains the source of thought and will, while speech stays broader than vows.
  reasoning_layer_used: Lexical decisions for לִבְּךָ, יְמַהֵר, and לְהוֹצִיא דָבָר; theological decision on vows
  rationale: “Rush to speak” naturally expresses hurriedly bringing out words without narrowing them to promises.
- pob_phrase: Therefore let your words be few
  simplified_phrase: so keep your words few
  preserved_meaning: The heaven-and-earth contrast still leads to a command for restrained speech.
  reasoning_layer_used: Lexical decisions for עַל כֵּן and יִהְיוּ דְבָרֶיךָ מְעַטִּים
  rationale: “So keep” states the conclusion and command in direct common English.
