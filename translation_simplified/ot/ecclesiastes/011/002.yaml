translation:
  language: en
  text: Give a share to seven people, and even to eight,[a] because you do not know what disaster will happen on the earth.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The numbers picture broad distribution without specifying what kind of share is meant.
    reason: simplification_note
  - marker: b
    text: Or “on the land.”
    reason: lexical_alternative
