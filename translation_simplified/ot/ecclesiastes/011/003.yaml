  rationale: Repeating “the rain” makes the implied object immediately clear.
- pob_phrase: and if a tree falls to the south or to the north
  simplified_phrase: If a tree falls toward the south or the north
  preserved_meaning: The tree may fall in either direction.
  reasoning_layer_used: POB lexical decisions for בַּדָּרוֹם and בַּצָּפוֹן
  rationale: A new sentence and “toward” make the direction of the fall easier to picture.
- pob_phrase: in the place where the tree falls, there it will lie
  simplified_phrase: it will lie in the place where it falls
  preserved_meaning: A fallen tree remains where it came down.
  reasoning_layer_used: POB lexical decision for שָׁם יְהוּא and its footnote
  rationale: Ordinary English word order removes repetition while retaining the tree’s fixed location.
