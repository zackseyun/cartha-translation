translation:
  language: en
  text: For if a man lives many years, he should rejoice in every one of them. But he should remember the days of darkness, because there will be many. Everything that comes is vapor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “breath,” traditionally “vanity.” The Hebrew word describes what is brief, insubstantial, or hard to grasp.
    reason: lexical_alternative
