translation:
  language: en
  text: Young man, rejoice while you are young. Let your heart make you glad in the days of your youthful strength. Walk in the paths your heart chooses, and follow what your eyes see. But know that God will bring you into judgment for all these things.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may be understood as permission to enjoy life within the bounds of accountability to God, or as an exhortation carrying a serious warning.
    reason: alternative_reading
