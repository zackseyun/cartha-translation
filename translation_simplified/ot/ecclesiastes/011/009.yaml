translation:
  language: en
  text: Rejoice in your youth, young man, and let your heart make you glad while you have the strength of youth. Walk in the paths your heart desires and follow what your eyes see.[a] But know that God will bring you into judgment for all these things.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may be a qualified invitation to enjoy life, or an exhortation carrying a strong warning.
    reason: alternative_reading
