translation:
  language: en
  text: You do not know the path the wind[a] takes or how a baby’s bones form in the womb. In the same way, you do not understand the work of God, who makes everything.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can also mean “spirit” or “breath.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the way of the wind
  simplified_phrase: the path the wind takes
  preserved_meaning: The wind follows a course that people cannot know.
  reasoning_layer_used: Lexical decision for דֶּרֶךְ הָרוּחַ and theological decision favoring “wind”
  rationale: This keeps the path image while expressing it in natural English.
- pob_phrase: how the bones form in the womb of a pregnant woman
  simplified_phrase: how a baby’s bones form in the womb
  preserved_meaning: Human development in the womb is a hidden process.
  reasoning_layer_used: Lexical decisions for כַּעֲצָמִים and בְּבֶטֶן הַמְּלֵאָה
  rationale: Naming the baby removes the awkward idiom without changing its referent.
- pob_phrase: so you do not know
  simplified_phrase: In the same way, you do not understand
  preserved_meaning: Human ignorance of creation illustrates ignorance of God’s activity.
  reasoning_layer_used: POB translation and immediate comparison
  rationale: A new sentence makes the comparison easier to follow.
