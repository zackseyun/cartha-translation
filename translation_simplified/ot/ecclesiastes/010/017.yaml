  preserved_meaning: The land remains directly addressed as a political realm.
  reasoning_layer_used: POB lexical decision for אֶרֶץ
  rationale: Removing “O” makes the address more natural without flattening its poetic force.
- pob_phrase: a son of nobles
  simplified_phrase: comes from a noble family
  preserved_meaning: The king is of honorable or noble lineage.
  reasoning_layer_used: POB lexical decision for בֶּן חוֹרִים
  rationale: The family-language clearly expresses lineage without the opaque Hebrew idiom.
- pob_phrase: for strength and not for drunkenness
  simplified_phrase: to gain strength, not to get drunk
  preserved_meaning: The princes eat for vigor rather than indulgence or intoxication.
  reasoning_layer_used: POB lexical decisions for בִּגְבוּרָה and וְלֹא בַשְּׁתִי
  rationale: Purpose clauses in ordinary English make the moral contrast immediately clear.
