  preserved_meaning: The saying describes a possible danger faced by anyone who digs a pit.
  reasoning_layer_used: POB lexical decisions and final source audit
  rationale: A direct conditional is easier to read while preserving the proverb’s generic force and its uncertainty.
- pob_phrase: whoever breaks through a wall may be bitten by a snake
