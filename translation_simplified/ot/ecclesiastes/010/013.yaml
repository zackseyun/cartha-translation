simplification_decisions:
- pob_phrase: The beginning of the words of his mouth is foolishness
  simplified_phrase: When he begins to speak, his words are foolish
  preserved_meaning: The man's speech is foolish from its beginning.
  reasoning_layer_used: The lexical decisions identify “mouth” as an image for speech and “foolishness” as the wisdom contrast.
  rationale: The temporal clause expresses the Hebrew image naturally without obscuring its reference to speech.
- pob_phrase: and the end of his speech is evil madness
  simplified_phrase: By the end, his speech is evil madness
  preserved_meaning: His speech intensifies from foolishness to morally charged madness.
  reasoning_layer_used: The lexical decisions preserve “madness” as stronger than ordinary folly and prefer “evil” for רָעָה.
  rationale: A new sentence makes the beginning-to-end progression easier to follow while retaining its force.
