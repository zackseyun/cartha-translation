translation:
  language: en
  text: Everyone faces the same fate:[a] the righteous and the wicked, the good, the clean and the unclean, those who offer sacrifices and those who do not. In this, the good person is no different from the sinner, and the person who swears an oath is no different from the person who is afraid to swear one.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the same event” or “the same destiny.”
    reason: lexical_alternative
  - marker: b
    text: This may instead mean a person who respects an oath and is therefore cautious about taking one.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: 'All is the same for all: one fate comes'
  simplified_phrase: Everyone faces the same fate
  preserved_meaning: The same outcome befalls every kind of person.
  reasoning_layer_used: Lexical and theological decisions on מִקְרֶה אֶחָד
  rationale: The active wording makes the sweeping claim immediately understandable without implying rigid determinism.
- pob_phrase: to the one who sacrifices and to the one who does not sacrifice
  simplified_phrase: those who offer sacrifices and those who do not
  preserved_meaning: People on both sides of the sacrificial practice share the same fate.
  reasoning_layer_used: Lexical decision on the contrasting participles
  rationale: The shorter parallel wording keeps both ritual categories distinct.
- pob_phrase: the one who swears is like the one who is afraid to swear
  simplified_phrase: the person who swears an oath is no different from the person who is afraid to swear one
  preserved_meaning: Both the oath-taker and the oath-averse person face the same outcome.
  reasoning_layer_used: Source audit and final-comparison theological decision
  rationale: Naming the oath prevents modern readers from mistaking “swears” for profanity.
interpretive_expansions:
- pob_phrase: the good person is like the sinner; the one who swears is like the one who is afraid to swear
  rendering: In this, the good person is no different from the sinner, and the person who swears an oath is no different from the person who is afraid to swear one.
  claim: The comparisons concern their shared fate, not moral equivalence in every respect.
  evidence:
  - The verse opens by saying that one fate comes to all these groups.
  - The surrounding context has death as the common human outcome.
  confidence: high
  alternatives_preserved:
  - The wording does not specify more precisely how the common fate unfolds.
translation_notes:
  risk_flags:
  - risk: “Fate” could suggest an impersonal doctrine of determinism.
    mitigation: The footnote preserves “event” and “destiny” as lexical alternatives.
  - risk: The final phrase may refer to reverent caution rather than fear of swearing.
    mitigation: The footnote retains this documented alternative.
