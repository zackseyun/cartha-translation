  language: en
  text: 'Everyone faces the same fate: the righteous and the wicked, the good, the clean and the unclean, those who offer sacrifices and those who do not. The same is true of the good person and the sinner, and of the person who takes an oath and the person who approaches an oath with fear.[a]'
