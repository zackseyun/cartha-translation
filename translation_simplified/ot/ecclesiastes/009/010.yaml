translation:
  language: en
  text: Whatever task lies within your reach, do it with the strength you have. For in Sheol,[a] where you are going, there is no work, planning, knowledge, or wisdom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheol refers to the place or state of the dead. It can also be translated “the grave” or “the realm of the dead”; it does not mean “hell” here.
    reason: lexical_alternative
