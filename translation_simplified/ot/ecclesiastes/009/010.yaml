translation:
  language: en
  text: Whatever you have the opportunity and ability to do, do it with the strength you have. For in Sheol[a]—the realm of the dead—where you are going, there is no work, planning, knowledge, or wisdom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheol is the Hebrew term for the realm or state of the dead; it may also be translated “the grave.”
    reason: lexical_alternative
