  preserved_meaning: Human vulnerability is compared with animals suddenly caught in traps.
  reasoning_layer_used: Source imagery and POB clause structure
  rationale: Three shorter sentences preserve the comparison while making it easier to follow.
- pob_phrase: at an evil time
