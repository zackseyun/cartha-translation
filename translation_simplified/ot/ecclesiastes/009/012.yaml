translation:
  language: en
  text: For a man does not even know when his time will come. Fish are caught in a cruel net, and birds in a snare. In the same way, the sons of man[a] are trapped when a time of calamity suddenly falls on them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
