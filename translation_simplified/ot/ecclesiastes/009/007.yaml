translation:
  language: en
  text: Go and eat your bread with joy. Drink your wine with a glad heart, because God has already looked favorably on what you do.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “has accepted your deeds” or “is pleased with what you do.”
