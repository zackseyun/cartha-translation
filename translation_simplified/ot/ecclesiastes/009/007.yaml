simplification_decisions:
- pob_phrase: eat your bread with joy, and drink your wine with a glad heart
  simplified_phrase: eat your bread joyfully. Drink your wine with a glad heart
  preserved_meaning: The two commands and the Hebrew images of bread, wine, joy, and the heart remain distinct.
  reasoning_layer_used: POB lexical decisions
  rationale: Two shorter sentences make the exhortation easier to follow.
- pob_phrase: for God has already approved your works
  simplified_phrase: because God has already approved what you do
  preserved_meaning: God’s prior favorable regard for the person’s deeds grounds the call to enjoy life’s gifts.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Because” makes the reason explicit, while “what you do” is clearer than “works.”
translation_notes:
  risk_flags:
  - risk: “Approved what you do” could be misread as teaching that deeds earn salvation.
    mitigation: The wording states divine favor without claiming how that favor was obtained, in line with the POB theological decision.
