simplification_decisions:
- pob_phrase: Go, eat your bread with joy, and drink your wine with a glad heart
  simplified_phrase: Go and eat your bread with joy. Drink your wine with a glad heart
  preserved_meaning: The two commands and the images of bread, wine, joy, and the heart remain distinct.
  reasoning_layer_used: POB lexical decisions and target readability style
  rationale: Dividing the long exhortation makes it easier to read without weakening either command.
- pob_phrase: for
  simplified_phrase: because
  preserved_meaning: God’s favorable regard remains the reason for the exhortation.
  reasoning_layer_used: POB lexical decision for כִּי
  rationale: “Because” states the explanatory relationship more directly in common English.
- pob_phrase: has already approved your works
  simplified_phrase: has already looked favorably on what you do
  preserved_meaning: God has already regarded the addressee’s deeds with favor.
  reasoning_layer_used: POB lexical and theological decisions for רָצָה and מַעֲשֶׂיךָ
  rationale: The wording clarifies “approved” and “works” while avoiding the suggestion that deeds earn salvation.
translation_notes:
  risk_flags:
  - risk: “What you do” could sound like unlimited approval of every action.
    mitigation: “Looked favorably on” and the footnote preserve the contextual sense of favorable acceptance without making a universal claim.
