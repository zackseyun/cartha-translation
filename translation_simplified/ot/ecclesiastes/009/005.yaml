translation:
  language: en
  text: For those who are alive know they will die. But the dead know absolutely nothing. They can no longer receive any reward, because people have forgotten them.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the living know that they will die
  simplified_phrase: those who are alive know they will die
  preserved_meaning: Living people are aware that death awaits them.
  reasoning_layer_used: POB lexical decision for הַחַיִּים and שֶׁיָּמֻתוּ
  rationale: The expanded wording is more immediate for readers unfamiliar with “the living” as a collective noun.
- pob_phrase: know nothing at all
  simplified_phrase: know absolutely nothing
  preserved_meaning: The Hebrew negation remains emphatic and unqualified.
  reasoning_layer_used: POB lexical and theological decisions for אֵינָם יוֹדְעִים מְאוּמָה
  rationale: “Absolutely” carries the emphasis in clear modern English without softening the statement.
- pob_phrase: there is no longer any reward for them
  simplified_phrase: They can no longer receive any reward
  preserved_meaning: No further reward is available to the dead.
  reasoning_layer_used: POB lexical decision for וְאֵין עוֹד לָהֶם שָׂכָר
  rationale: The personal construction replaces an abstract clause while retaining “reward” and the finality of “no longer.”
