translation:
  language: en
  text: 'This is one evil in everything done under the sun: the same fate comes to everyone.[a] People’s hearts are also full of evil, and madness is in their hearts while they live. Afterward, they join the dead.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the same event happens to everyone.” The Hebrew can mean an event, fate, or outcome that befalls someone.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew ends abruptly, literally, “and afterward, to the dead”; “they join” expresses the movement implied by the context.
    reason: source_note
