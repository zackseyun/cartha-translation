translation:
  language: en
  text: 'This is the evil in everything done under the sun: the same fate comes to everyone.[a] The heart of the sons of man[b] is also full of evil, and madness is in their hearts while they live. Afterward, they go to the dead.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the same event happens to everyone.” The Hebrew can refer to an event, what befalls someone, or a common fate.
    reason: lexical_alternative
  - marker: b
    text: “The sons of man” means humanity as a whole.
    reason: simplification_note
  - marker: c
    text: The Hebrew is abrupt, literally, “and after it, to the dead,” probably referring to what happens after life.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: in all that is done under the sun
  simplified_phrase: in everything done under the sun
  preserved_meaning: The statement still covers all human activity in earthly life.
  reasoning_layer_used: Lexical decision for בְּכֹל אֲשֶׁר נַעֲשָׂה תַּחַת הַשֶּׁמֶשׁ
  rationale: “Everything done” is more direct while retaining Ecclesiastes’ “under the sun” formula.
- pob_phrase: that one fate comes to all
  simplified_phrase: the same fate comes to everyone
  preserved_meaning: Everyone shares one common destiny.
  reasoning_layer_used: Lexical decision for כִּי מִקְרֶה אֶחָד לַכֹּל
  rationale: “The same fate” expresses the common outcome naturally without adding determinism.
- pob_phrase: during their lives
  simplified_phrase: while they live
  preserved_meaning: Evil and madness characterize people throughout their earthly lives.
  reasoning_layer_used: Lexical decision for בְּחַיֵּיהֶם
  rationale: “While they live” is shorter and more natural in modern English.
interpretive_expansions:
- pob_phrase: and afterward, they go to the dead
  rendering: Afterward, they go to the dead.
  claim: After their lives, people join those who have died.
  evidence:
  - The preceding phrase refers to the time while people live.
  - The POB footnote identifies this as the likely sense of the Hebrew ellipsis.
  confidence: moderate
  alternatives_preserved:
  - Literally, “and after it, to the dead.”
translation_notes:
  risk_flags:
  - risk: “The sons of man” may sound male-exclusive to modern readers.
    mitigation: A footnote explains that the phrase means humanity as a whole.
  - risk: The final clause supplies a verb and referent left implicit in the abrupt Hebrew.
    mitigation: A footnote preserves the literal form and qualifies the interpretation as probable.
