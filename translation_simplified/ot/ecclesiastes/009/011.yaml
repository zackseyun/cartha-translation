  simplified_phrase: a fast runner does not always win the race, and a strong person does not always win the battle
  preserved_meaning: Speed and strength do not guarantee victory.
  reasoning_layer_used: Lexical decisions and Hebrew parallelism
  rationale: The implicit outcome is stated directly without adding unsupported superlatives.
- pob_phrase: nor bread to the wise, nor riches to the discerning, nor favor to those who know
  simplified_phrase: The wise do not always have bread to eat. The discerning do not always gain riches, and those with knowledge do not always receive favor.
  preserved_meaning: Wisdom, discernment, and knowledge do not guarantee sustenance, wealth, or social favor.
  reasoning_layer_used: POB lexical decisions
  rationale: Short sentences clarify the parallels while preserving bread as a concrete image.
- pob_phrase: for time and chance happen to them all
  simplified_phrase: Time and chance come upon them all
  preserved_meaning: Unpredictable circumstances affect everyone.
  reasoning_layer_used: Lexical footnote and theological decision
  rationale: The wording remains natural without resolving the tension around chance.
