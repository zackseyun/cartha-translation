translation:
  language: en
  text: I again saw that, under the sun, fast runners do not always win races, and strong people do not always win battles. Wise people do not always have bread to eat, discerning people do not always gain wealth, and those who know do not always receive favor. Time and chance[a] overtake everyone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “time and unexpected events.” The Hebrew emphasizes that unpredictable circumstances come to everyone.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the race is not to the swift, nor the battle to the mighty
  simplified_phrase: fast runners do not always win races, and strong people do not always win battles
  preserved_meaning: Speed and strength do not guarantee success.
  reasoning_layer_used: Lexical decisions for “swift,” “race,” “mighty,” and “battle”
  rationale: Ordinary wording clarifies the outcomes without making the people superlative or limiting the mighty to warriors.
- pob_phrase: bread is not to the wise, nor riches to the discerning, nor favor to those who know
  simplified_phrase: Wise people do not always have bread to eat, discerning people do not always gain wealth, and those who know do not always receive favor
  preserved_meaning: Wisdom, discernment, and knowledge do not guarantee sustenance, wealth, or favor.
  reasoning_layer_used: Lexical decisions for “bread,” “discerning,” “riches,” “those who know,” and “favor”
  rationale: The syntax becomes natural English while bread remains concrete and knowledge remains broad.
- pob_phrase: time and chance happen to them all
  simplified_phrase: Time and chance overtake everyone
  preserved_meaning: Unpredictable circumstances affect every person.
  reasoning_layer_used: Lexical rationale, theological decision, and POB footnote for “chance”
  rationale: “Overtake” conveys circumstances coming upon everyone without making a claim against providence.
interpretive_expansions:
- pob_phrase: the race is not to the swift, nor the battle to the mighty
  rendering: fast runners do not always win races, and strong people do not always win battles
  claim: Human advantages do not guarantee the expected outcome.
  evidence:
