  confidence: high
  alternatives_preserved:
  - the race is not to the swift
  - the battle is not to the mighty
translation_notes:
  risk_flags:
  - risk: “Chance” may be misunderstood as denying divine providence.
    mitigation: The footnote defines it as unpredictable events, leaving the theological tension unresolved.
