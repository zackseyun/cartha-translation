translation:
  language: en
  text: 'Again I saw what happens under the sun: a fast runner does not always win the race, and a strong person does not always win the battle. The wise do not always have bread to eat. The discerning do not always gain riches, and those with knowledge do not always receive favor. Time and chance come upon them all.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Time and chance” may also be translated “time and happening,” “time and mischance,” or “time and occurrence”; unpredictable circumstances overtake everyone.
    reason: lexical_alternative
