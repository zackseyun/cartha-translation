translation:
  language: en
  text: Enjoy life with the wife you love throughout the fleeting days he[a] has given you under the sun. Yes, all your days are fleeting.[b] This is your allotted share in life and in the hard work you do under the sun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew does not name the giver here; the wider context suggests God.
    reason: alternative_reading
  - marker: b
    text: Hebrew hebel, often pictured as vapor, emphasizes that life is brief and impossible to hold onto.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: all the days of your fleeting life that he has given you under the sun—all your fleeting days
  simplified_phrase: throughout the fleeting days he has given you under the sun. Yes, all your days are fleeting.
  preserved_meaning: Life is a brief gift, and the Hebrew repetition remains emphatic.
  reasoning_layer_used: POB lexical decision for hebel and source repetition
  rationale: Two short sentences make the repeated thought easier to follow without removing its force.
- pob_phrase: for that is your portion
  simplified_phrase: This is your allotted share
  preserved_meaning: Enjoying life with one's wife is the share assigned within mortal life.
  reasoning_layer_used: POB lexical decision for חֶלֶק
  rationale: “Allotted share” explains the portion metaphor in common English.
- pob_phrase: in your labor at which you toil
  simplified_phrase: in the hard work you do
  preserved_meaning: The phrase still describes ongoing, strenuous labor.
  reasoning_layer_used: POB lexical decisions for עָמָל and עָמֵל
  rationale: The natural phrase avoids an awkward repeated labor-toil construction.
