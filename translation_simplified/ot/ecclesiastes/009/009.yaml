translation:
  language: en
  text: Enjoy life with the wife you love. Do this throughout the fleeting life given to you under the sun—all your fleeting days.[a][b] This is your allotted share in life and in the hard work you do under the sun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Fleeting” translates Hebrew hebel, which describes life as brief, insubstantial, and often frustrating.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew does not name the giver here; the wider context suggests God.
    reason: alternative_reading
