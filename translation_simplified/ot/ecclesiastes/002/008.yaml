translation:
  language: en
  text: I also collected silver and gold for myself, along with the treasures of kings and provinces. I obtained singers for myself, both men and women, and the delights of the sons of man[a]—a concubine and concubines.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the delights of humankind.” The Hebrew expression is literally “the delights of the sons of man.”
    reason: lexical_alternative
  - marker: b
    text: The rare Hebrew expression is uncertain. It is traditionally understood to refer to a concubine and concubines; it may instead mean “a mistress and mistresses,” “male and female cupbearers,” or “every kind of luxury.”
    reason: lexical_alternative
