  text: For there is a man who works with wisdom, knowledge, and skill. Yet he must give his portion to another man who did none of the work. This too is vapor[a] and a great evil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally rendered “vanity”; “vapor” pictures something fleeting and impossible to hold onto.
    reason: lexical_alternative
