translation:
  language: en
  text: So I hated life. All the work done under the sun[a] weighed heavily on me, because everything is vapor[b]—fleeting and impossible to grasp—and it is all like chasing after wind.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Under the sun” means life in this earthly world.
    reason: cultural_note
  - marker: b
    text: Or “vanity” or “breath”; the Hebrew image suggests what is fleeting, insubstantial, or elusive.
    reason: lexical_alternative
  - marker: c
    text: Or “striving after wind.”
    reason: lexical_alternative
