translation:
  language: en
  text: Who knows whether the person who comes after me will be wise or foolish? Even so, he will control all that I worked hard on, using wisdom, under the sun. This too is vanity.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “This too is vapor,” emphasizing what is fleeting and elusive; possibly, “This too is futile.”
