translation:
  language: en
  text: Who knows whether the person who comes after me will be wise or foolish? Even so, that person will control all the work I labored over and carried out with wisdom under the sun. This too is like vapor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “This too is futile.” The Hebrew word pictures vapor and can suggest what is fleeting or frustrating.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And who knows whether he will be wise or foolish?
  simplified_phrase: Who knows whether the person who comes after me will be wise or foolish?
  preserved_meaning: The speaker does not know whether his successor will be wise or foolish.
  reasoning_layer_used: Immediate context and lexical decision on the indirect question
  rationale: The preceding verse identifies the otherwise unclear pronoun as the person who follows him.
- pob_phrase: Yet he will rule over all my labor
  simplified_phrase: Even so, that person will control all the work I labored over
  preserved_meaning: Regardless of the successor’s character, that person will have authority over the speaker’s hard-won work.
  reasoning_layer_used: Lexical decisions on וְיִשְׁלַט and עֲמָלִי
  rationale: “Control” states the dominion plainly, while “labored over” retains the force of strenuous work.
- pob_phrase: in which I labored and used wisdom under the sun
  simplified_phrase: I labored over and carried out with wisdom under the sun
  preserved_meaning: The speaker both exerted himself and applied wisdom in his earthly work.
  reasoning_layer_used: Doctrine realignment and lexical decisions on עמל, חכם, and תחת השמש
  rationale: The recast clause keeps labor and applied wisdom distinct without the POB’s awkward structure.
interpretive_expansions:
- pob_phrase: he
  rendering: the person who comes after me
  claim: The pronoun refers to the successor who receives control of the speaker’s work.
  evidence:
  - The preceding verse says the speaker must leave his work to the person who comes after him.
  - The POB rationale identifies this person as the heir.
  confidence: high
  alternatives_preserved:
  - he
  - the heir
- pob_phrase: This too is vanity
  rendering: This too is like vapor
  claim: The verdict uses the concrete image of vapor to convey something fleeting, elusive, and potentially futile.
  evidence:
  - The POB lexical decision says הֶבֶל ranges across vapor, transience, and futility.
  - The POB footnote explicitly preserves “vapor” as an alternative.
  confidence: high
  alternatives_preserved:
  - This too is futile
  - This too is vanity
translation_notes:
  risk_flags:
  - risk: “Like vapor” may be understood only as briefness and not as frustration or futility.
    mitigation: The footnote preserves futility and the wider fleeting or frustrating force.
