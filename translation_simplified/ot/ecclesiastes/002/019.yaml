simplification_decisions:
- pob_phrase: And who knows whether he will be wise or foolish?
  simplified_phrase: Who knows whether the person who comes after me will be wise or foolish?
  preserved_meaning: The speaker does not know whether his successor will be wise or foolish.
  reasoning_layer_used: Immediate context and the POB rationale identify “he” as the successor.
  rationale: Naming the person removes an unclear pronoun.
- pob_phrase: Yet he will rule over
  simplified_phrase: Even so, he will control
  preserved_meaning: Regardless of his character, the successor will have authority over the speaker’s work.
  reasoning_layer_used: The lexical decision defines the verb as exercising dominion or control.
  rationale: “Control” gives the practical force of “rule over” in common English.
- pob_phrase: all that I labored for and applied wisdom to
  simplified_phrase: all that I worked hard on, using wisdom
  preserved_meaning: The speaker’s work involved both strenuous effort and the exercise of wisdom.
  reasoning_layer_used: The source audit protects both labor and wise activity without expanding the object.
  rationale: The recast avoids implying that wisdom guarantees successful accomplishments.
interpretive_expansions:
- pob_phrase: he
  rendering: the person who comes after me
  claim: The pronoun refers to the speaker’s successor, who will control his work.
  evidence:
  - The preceding verse speaks of leaving the speaker’s labor to the person who comes after him.
  - The POB rationale identifies this person as the heir.
  confidence: high
  alternatives_preserved:
  - he
  - the heir
translation_notes:
  risk_flags:
