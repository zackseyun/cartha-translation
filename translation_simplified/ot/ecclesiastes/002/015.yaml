translation:
  language: en
  text: I thought to myself, “What happens to a fool will happen to me too. So what was the point of being wiser?” Then I concluded, “This too is vapor—fleeting and impossible to hold onto.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally “vanity”; the Hebrew word pictures vapor or breath and can describe what is fleeting, elusive, or futile.
    reason: lexical_alternative
