  language: en
  text: I thought to myself, “What happens to the fool will happen to me too. Then why was I wiser?” I concluded that this too is vapor—fleeting and impossible to hold onto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally, “vanity.” The Hebrew word pictures vapor or breath and describes what is fleeting, elusive, or futile.
    reason: lexical_alternative
