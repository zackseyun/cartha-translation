translation:
  language: en
  text: The wise man has eyes to see where he is going, but the fool walks in darkness. Even so, I also realized that the same fate[a] comes to them all.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the same event”; the Hebrew refers to what happens to someone.
    reason: lexical_alternative
