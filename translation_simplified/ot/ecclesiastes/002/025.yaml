translation:
  language: en
  text: For who can eat, and who can find enjoyment, without me?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “find enjoyment” is difficult and may instead mean “hasten” or “feel.”
