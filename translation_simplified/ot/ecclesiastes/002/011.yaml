translation:
  language: en
  text: Then I turned to look at everything my hands had accomplished and all the hard work I had put into it. I saw that it was all vapor[a]—fleeting and impossible to hold onto—and like chasing the wind. There was no gain under the sun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can also be translated “breath” or “vanity”; it describes what is fleeting, insubstantial, or frustratingly elusive.
    reason: lexical_alternative
