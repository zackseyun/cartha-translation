simplification_decisions:
- pob_phrase: all my labor in which I toiled
  simplified_phrase: all the work I had struggled to do
  preserved_meaning: The speaker hates both his labor and the burdensome effort he poured into it.
  reasoning_layer_used: POB lexical decisions for כָּל עֲמָלִי and שֶׁאֲנִי עָמֵל
  rationale: This recasts the repeated labor wording in natural English while retaining its intensified sense of toil.
- pob_phrase: because I must leave it
  simplified_phrase: because I must leave it all
  preserved_meaning: Death makes the speaker leave behind the whole result of his work.
  reasoning_layer_used: POB lexical decision for שֶׁאַנִּיחֶנּוּ and immediate context
  rationale: “It all” clearly points back to the full body of work without changing the stated inevitability.
- pob_phrase: the man who will come after me
  simplified_phrase: the man who comes after me
  preserved_meaning: A particular male successor will receive what the speaker leaves behind.
  reasoning_layer_used: POB lexical and theological decisions for לָאָדָם and שֶׁיִּהְיֶה אַחֲרָי
  rationale: Removing the extra “will” makes the clause smoother while preserving the masculine singular successor.
