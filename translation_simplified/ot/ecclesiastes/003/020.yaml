translation:
  language: en
  text: Humans and animals all go to the same place. All came from dust, and all return to dust.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dust” recalls Genesis 3:19 and points to the mortality shared by humans and animals.
    reason: cross_reference
simplification_decisions:
- pob_phrase: All go to one place.
  simplified_phrase: Humans and animals all go to the same place.
  preserved_meaning: Both humans and animals share the same mortal fate.
  reasoning_layer_used: Immediate context and theological decision on the scope of “all.”
  rationale: Naming the two groups makes the verse understandable without adding an afterlife claim.
- pob_phrase: one place
  simplified_phrase: the same place
  preserved_meaning: All share a common destination in death.
  reasoning_layer_used: Lexical decision for מָקוֹם אֶחָד.
  rationale: “The same place” expresses the contextual comparison more naturally in English.
- pob_phrase: All came from the dust, and all return to the dust.
  simplified_phrase: All came from dust, and all return to dust.
  preserved_meaning: Every mortal creature has the same earthly origin and end.
  reasoning_layer_used: Lexical decisions for עָפָר and שָׁב אֶל הֶעָפָר.
  rationale: Removing the repeated article gives natural English while preserving the dust image and origin-return pattern.
interpretive_expansions:
- pob_phrase: All
  rendering: Humans and animals all
  claim: The repeated “all” includes both humans and animals.
  evidence:
  - Ecclesiastes 3:18–21 directly compares humans and animals.
  - The POB lexical rationale identifies both groups as the referents.
  confidence: high
  alternatives_preserved:
  - The verse does not define what lies beyond death.
  - The wording does not deny a spiritual distinction after death.
translation_notes:
  risk_flags:
  - risk: “The same place” could be read as a complete doctrine of the afterlife.
    mitigation: The draft limits the statement to the shared mortal fate described in context.
