translation:
  language: en
  text: What exists now has existed before, and what is still to come has already existed. God seeks what has been driven away.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult Hebrew may also mean “God seeks what is pursued” or “God calls the past to account.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: What has been already is
  simplified_phrase: What exists now has existed before
  preserved_meaning: Present reality has occurred previously.
  reasoning_layer_used: Lexical decisions for מַה שֶּׁהָיָה, כְּבָר, and הוּא
  rationale: The recast clause states the time relationship in ordinary English.
- pob_phrase: what is to be has already been
  simplified_phrase: what is still to come has already existed
  preserved_meaning: Future reality has occurred before.
  reasoning_layer_used: Lexical decision for וַאֲשֶׁר לִהְיוֹת and immediate parallelism
  rationale: “Still to come” makes the forward-looking sense immediately clear.
- pob_phrase: God seeks what has been driven away
  simplified_phrase: God seeks what has been driven away
  preserved_meaning: God seeks that which has been pursued, displaced, or passed on, without resolving the ambiguity.
  reasoning_layer_used: Lexical and theological decision for יְבַקֵּשׁ אֶת נִרְדָּף
  rationale: The difficult image is retained because clearer wording would favor one disputed interpretation.
