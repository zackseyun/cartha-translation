  preserved_meaning: Present reality has existed previously.
  reasoning_layer_used: Lexical decision for מַה שֶּׁהָיָה כְּבָר הוּא
  rationale: This gives the awkward clause natural English while preserving its claim about prior existence.
- pob_phrase: what is to be has already been
