translation:
  language: en
  text: God has made everything beautiful when its time comes. He has also put eternity[a] in human hearts. Yet no human being can understand God’s work from beginning to end.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the world” or “the age.” The Hebrew word is difficult and may mean an awareness of the whole span of time or of the world beyond our immediate experience.
    reason: lexical_alternative
