translation:
  language: en
  text: God has made everything beautiful in its own time. He has also put eternity in the human heart.[a] Even so, no one can fully understand all that God has done from beginning to end.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “eternity” may also mean “the world” or “the age.” Here it may describe an awareness of the whole span of time or of what lies beyond our immediate experience.
    reason: lexical_alternative
