- pob_phrase: man cannot find out the work that God has done
  simplified_phrase: no one can fully understand all that God has done
  preserved_meaning: Human beings cannot exhaustively discover the complete scope of God’s activity.
  reasoning_layer_used: Lexical decisions for הָאָדָם, יִמְצָא, and הַמַּעֲשֶׂה
  rationale: The revision replaces generic “man” and the opaque phrase “find out the work” with clear modern wording.
