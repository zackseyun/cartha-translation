  preserved_meaning: Everything has its particular place within God’s ordering of times.
  reasoning_layer_used: Lexical decision for בְעִתּוֹ and the chapter’s appointed-time context
  rationale: Adding “own” makes the reference to each thing’s time immediately clear.
- pob_phrase: in their heart
  simplified_phrase: in the human heart
  preserved_meaning: God has placed this awareness within humanity’s inner life and understanding.
  reasoning_layer_used: Lexical decision for בְּלִבָּם
