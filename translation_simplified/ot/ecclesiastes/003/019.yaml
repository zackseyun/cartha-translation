translation:
  language: en
  text: The sons of man—that is, all human beings—and the animals face the same fate. One dies just as the other dies, and all have the same breath.[a] Man has no advantage over the animals, for everything is vapor—brief and impossible to hold on to.
  philosophy: optimal-equivalence
  footnotes:
