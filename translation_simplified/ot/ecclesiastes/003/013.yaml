translation:
  language: en
  text: Also, everyone should eat and drink and enjoy what is good in all their labor. This is God's gift.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says “see good,” meaning to experience or enjoy it.
