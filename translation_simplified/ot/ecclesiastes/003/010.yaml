translation:
  language: en
  text: I have seen the task God has given the sons of man to be occupied with.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew phrase “sons of man” refers collectively to humanity.
    reason: simplification_note
  - marker: b
    text: Or, “to be burdened by it” or “to labor at it.” The Hebrew may describe either being occupied with the task or burdened by it.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the task that God has given
  simplified_phrase: the task God has given
  preserved_meaning: God is the one who assigns the human task.
  reasoning_layer_used: POB lexical decision for אֲשֶׁר נָתַן
  rationale: Removing the relative pronoun makes the sentence more direct without changing the relationship.
- pob_phrase: to be occupied with
  simplified_phrase: to be occupied with
  preserved_meaning: People experience the task as an occupation that God has assigned and possibly as a burden.
  reasoning_layer_used: POB lexical and theological decisions for לַעֲנוֹת בּוֹ
  rationale: The passive wording avoids implying that people voluntarily choose the task.
- pob_phrase: the sons of man
  simplified_phrase: the sons of man
  preserved_meaning: The masculine Hebrew idiom represents humanity collectively.
  reasoning_layer_used: POB theological decision for לִבְנֵי הָאָדָם
  rationale: The phrase is retained as required, while the note explains its collective meaning.
translation_notes:
  risk_flags:
  - risk: “Occupied with” may not convey the expression’s possible burdensome force.
    mitigation: Footnote b preserves the stronger senses “burdened by” and “labor at.”
  - risk: Modern readers may mistake “sons of man” for males alone.
    mitigation: Footnote a explains that the phrase refers collectively to humanity.
