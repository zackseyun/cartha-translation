translation:
  language: en
  text: For God will judge every deed, even the things that are hidden, whether good or evil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “concerning every hidden thing” or “with respect to every secret thing.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: will bring every deed into judgment
  simplified_phrase: will judge every deed
  preserved_meaning: God will subject every deed to judicial evaluation.
  reasoning_layer_used: Lexical decisions for יָבִא and בְמִשְׁפָּט
  rationale: The direct verb expresses the same judicial action in clearer English.
- pob_phrase: with every hidden thing
  simplified_phrase: even the things that are hidden
  preserved_meaning: God’s judgment extends to concealed matters without defining them only as hidden deeds.
  reasoning_layer_used: Lexical decision for עַל כָּל נֶעְלָם and POB footnote
  rationale: “Even” clearly conveys comprehensive scope while the footnote preserves the documented relation alternatives.
translation_notes:
  risk_flags:
  - risk: “Will judge” does not retain the literal motion image of bringing deeds into judgment.
    mitigation: It preserves the image’s full judicial force in direct, natural English.
  - risk: The relation between every deed and hidden things remains grammatically open.
    mitigation: The main text avoids making hidden things merely a subset of deeds, and the footnote records the alternatives.
