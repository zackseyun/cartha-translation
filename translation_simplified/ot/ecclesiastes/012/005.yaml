translation:
  language: en
  text: They are also afraid of heights, and dangers on the road fill them with fear. The almond tree blossoms, the grasshopper can barely drag itself along,[a] and the caper berry no longer has any effect.[b] For man is going to his eternal home, and the mourners[c] move about in the street.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “even a grasshopper becomes a burden.” The Hebrew may picture feeble movement or how the smallest thing becomes burdensome in old age.
    reason: lexical_alternative
  - marker: b
    text: Or “desire fails.” The caper berry was associated with appetite or stimulation.
    reason: lexical_alternative
  - marker: c
    text: These may include hired mourners who publicly lamented the dead.
    reason: cultural_note
