translation:
  language: en
  text: They are also afraid of heights, and dangers on the road terrify them. The almond tree blossoms, the grasshopper struggles to drag itself along,[a] and the caper berry no longer has any effect.[b] For man is going to his eternal house, and mourners walk through the streets.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “even the grasshopper becomes a burden”; the Hebrew may picture feeble movement or even a small thing becoming burdensome in old age.
    reason: lexical_alternative
  - marker: b
    text: Or “desire fails”; the caper berry was associated with appetite or stimulation.
    reason: lexical_alternative
  - marker: c
    text: These may include hired mourners who publicly lamented the dead.
    reason: cultural_note
