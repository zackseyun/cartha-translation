  preserved_meaning: The doors face or open toward the public street.
  reasoning_layer_used: Lexical decision for דְלָתַיִם בַּשּׁוּק
  rationale: “Leading to” makes the spatial relationship immediately clear without identifying the doors as a body part.
- pob_phrase: when the sound of the grinding grows faint
  simplified_phrase: as the sound of grinding fades
  preserved_meaning: The audible grinding gradually becomes weaker.
  reasoning_layer_used: Lexical decision for בִּשְׁפַל קוֹל הַטַּחֲנָה
  rationale: “Fades” expresses diminishing sound in ordinary English while retaining the grinding image.
- pob_phrase: one rises
  simplified_phrase: A person gets up
  preserved_meaning: An unspecified person rises in response to a bird’s sound.
  reasoning_layer_used: Lexical decision for וְיָקוּם
  rationale: “A person gets up” preserves the generic subject in more natural modern English.
