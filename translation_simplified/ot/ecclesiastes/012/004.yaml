translation:
  language: en
  text: The doors on the street are shut when the sound of grinding grows faint.[a][b] A person rises at the sound of a bird, and all the daughters of song are brought low.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the double doors.” In this picture of old age, many understand the doors as the lips or mouth.
    reason: alternative_reading
  - marker: b
    text: Many understand the fading sound of grinding as a picture of weakened chewing because the surrounding lines are often read as body imagery.
    reason: lexical_alternative
  - marker: c
    text: “Daughters of song” may mean singers, the ability to sing, or the sounds of song.
    reason: lexical_alternative
