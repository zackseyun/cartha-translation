translation:
  language: en
  text: The doors leading to the street are shut[a] as the sound of grinding fades[b]. A person gets up at the sound of a bird, and all the daughters of song are brought low[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the double doors.” In this picture of old age, the doors may represent the lips or mouth.
    reason: alternative_reading
  - marker: b
    text: Or “the sound of the mill fades.” This may picture diminished chewing.
    reason: lexical_alternative
  - marker: c
    text: Literally “all the daughters of song.” This may mean singers, the ability to sing, or the sounds of song.
    reason: lexical_alternative
