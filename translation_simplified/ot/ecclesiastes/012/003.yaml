  text: On that day, the keepers of the house will tremble.[a] The strong men will stoop, and the grinders will stop working because only a few remain. Those who look through the windows will grow dark.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'These pictures likely describe the decline of old age: the keepers may be the arms or hands, the strong men the legs, the grinders the teeth, and those at the windows the eyes.'
    reason: alternative_reading
  - marker: b
    text: Or “through the lattices.”
    reason: lexical_alternative
