translation:
  language: en
  text: Who knows what is good for a person in this life, during their fleeting days that pass like a shadow? Who can tell a person what will be after them under the sun?
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: what is good for man in life
  simplified_phrase: what is good for a person in this life
  preserved_meaning: The question concerns what is good for any human being during earthly life.
  reasoning_layer_used: POB translation and applied revision
  rationale: The generic “man” becomes the natural “a person” while retaining its universal human scope.
- pob_phrase: during the number of the days of his fleeting life
  simplified_phrase: during their fleeting days
  preserved_meaning: A person's lifetime consists of a limited span of passing days.
  reasoning_layer_used: POB translation
  rationale: The cumbersome counting expression is compressed without losing life's brevity.
- pob_phrase: which he spends like a shadow
  simplified_phrase: that pass like a shadow
  preserved_meaning: Human days are brief and passing like a shadow.
  reasoning_layer_used: source image and POB translation
  rationale: The concrete shadow image is retained and connected directly to the fleeting days.
translation_notes:
  risk_flags:
