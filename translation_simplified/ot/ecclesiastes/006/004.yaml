translation:
  language: en
  text: For its coming is futile,[a] and it goes away in darkness. Its name, too, is covered in darkness.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be understood as “its coming is like a vapor,” suggesting something brief and impossible to hold onto.
    reason: lexical_alternative
  - marker: b
    text: The image may mean that its identity or memory remains unknown.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: it comes in futility
  simplified_phrase: its coming is futile
  preserved_meaning: Its arrival or existence is marked by futility.
  reasoning_layer_used: Lexical decision and source audit for בַהֶבֶל בָּא
  rationale: The recast clause is more natural English without narrowing הֶבֶל to vapor alone.
- pob_phrase: goes in darkness
  simplified_phrase: goes away in darkness
  preserved_meaning: It departs into darkness without explicitly stating that it dies.
  reasoning_layer_used: Lexical decision for יֵלֵךְ and חֹשֶׁךְ
  rationale: “Away” clarifies departure while retaining the repeated darkness image.
- pob_phrase: and its name is covered in darkness
  simplified_phrase: Its name, too, is covered in darkness
  preserved_meaning: Its name remains obscured, echoing the previous darkness.
  reasoning_layer_used: Source audit and lexical decisions for שְׁמוֹ and יְכֻסֶּה
  rationale: A new sentence eases reading while preserving the passive image and repetition.
translation_notes:
  risk_flags:
