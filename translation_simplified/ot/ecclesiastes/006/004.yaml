translation:
  language: en
  text: For he arrives like a vapor[a] and leaves in darkness. Darkness covers his name.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “vapor” can also suggest transience, emptiness, or futility.
    reason: lexical_alternative
  - marker: b
    text: His name being covered may mean that his identity or memory remains unknown.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: comes in vanity
  simplified_phrase: arrives like a vapor
  preserved_meaning: His existence is fleeting and elusive.
  reasoning_layer_used: POB lexical decision and footnote for הֶבֶל
  rationale: The concrete image “vapor” communicates the key theme more clearly than “vanity.”
- pob_phrase: goes in darkness
  simplified_phrase: leaves in darkness
  preserved_meaning: He departs in obscurity without explicitly stating that he dies.
  reasoning_layer_used: POB lexical decisions for יֵלֵךְ and חֹשֶׁךְ
  rationale: “Leaves” is natural English while retaining the deliberately indirect departure image.
- pob_phrase: and in darkness his name is covered
  simplified_phrase: Darkness covers his name
  preserved_meaning: His name remains enveloped in obscurity and is not remembered.
  reasoning_layer_used: POB lexical decisions for חֹשֶׁךְ, שְׁמוֹ, and יְכֻסֶּה
  rationale: An active sentence is easier to read and preserves both the repeated darkness and covered-name images.
translation_notes:
  risk_flags:
  - risk: “Vapor” may emphasize transience more than futility.
    mitigation: The footnote preserves the wider range of the Hebrew theme word.
