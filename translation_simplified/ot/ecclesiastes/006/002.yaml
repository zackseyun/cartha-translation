translation:
  language: en
  text: God gives a man riches, possessions, and honor. He has everything he desires and lacks nothing for himself. Yet God does not enable him to eat from these gifts and enjoy them, because a foreigner[a] eats from them. This is vanity[b]—like vapor—and a terrible sickness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a stranger”; the Hebrew refers to a foreigner or someone outside his circle.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term may also be rendered “vapor” or “futility”; it is a key word in Ecclesiastes.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: There is a man to whom God gives riches, possessions, and honor
  simplified_phrase: God gives a man riches, possessions, and honor.
  preserved_meaning: God gives the man wealth, property, and social standing.
  reasoning_layer_used: Lexical decisions for the generic present tense and representative masculine singular.
  rationale: The direct sentence removes the difficult opening while keeping its proverbial force.
- pob_phrase: so that he lacks nothing for himself of all that he desires
  simplified_phrase: He has everything he desires and lacks nothing for himself.
  preserved_meaning: Nothing the man desires for himself is missing.
  reasoning_layer_used: Lexical and theological decisions treating לְנַפְשׁוֹ as the person himself.
  rationale: The reordered wording expresses the same completeness in ordinary English.
- pob_phrase: a grievous sickness
  simplified_phrase: a terrible sickness
  preserved_meaning: The situation is pictured as a deeply harmful condition.
  reasoning_layer_used: The lexical decision preserves the sickness image and its severity.
  rationale: “Terrible” is more familiar than “grievous” without weakening the image.
