  edition: POB
  yaml_path: translation/ot/ecclesiastes/006/002.yaml
  text: There is a man to whom God gives riches, possessions, and honor, so that he lacks nothing for himself of all that he desires, yet God does not enable him to eat from them[a], because a foreigner eats them[b]. This is vanity[c] and a grievous sickness.
  footnotes:
  - marker: a
    text: Hebrew “to eat from them,” a concrete expression for partaking of or enjoying what he possesses.
    reason: lexical_alternative
  - marker: b
    text: Or “a stranger.” Hebrew אִישׁ נָכְרִי refers to a foreigner or outsider.
    reason: lexical_alternative
  - marker: c
    text: Or “vapor” or “futility” for “vanity” (Hebrew הֶבֶל), a key term in Ecclesiastes.
    reason: lexical_alternative
