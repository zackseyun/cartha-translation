translation:
  language: en
  text: This child never saw the sun[a] or was aware of anything. Even so, it has more rest than that man.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Saw the sun” is a Hebrew way of speaking about experiencing life in this world.
