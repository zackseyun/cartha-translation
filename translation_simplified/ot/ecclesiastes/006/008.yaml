  text: After all, how is a wise man better off than a fool? What advantage is there for a poor man who knows how to live among other people?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “knows how to walk before the living.” Here “walk” refers to how a person lives or behaves.
    reason: lexical_alternative
