translation:
  language: en
  text: Everything that comes to be has already been named, and what human beings are is already known. No human being can dispute with someone stronger than they are.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The stronger one is probably God, though the Hebrew does not say so explicitly.
    reason: alternative_reading
