  reasoning_layer_used: POB lexical decision for מַה שֶּׁהָיָה
  rationale: “Everything” makes the general scope immediately clear.
- pob_phrase: what man is
  simplified_phrase: what human beings are
  preserved_meaning: The singular “man” represents humanity and the human condition.
  reasoning_layer_used: POB lexical decision and footnote for אָדָם
  rationale: The plural form communicates the representative meaning without requiring a note.
- pob_phrase: he cannot contend with one stronger than he
  simplified_phrase: No human being can dispute with someone stronger than they are
  preserved_meaning: Human beings cannot enter into contention with a more powerful party.
  reasoning_layer_used: POB lexical and theological decisions for לָדִין and the unnamed stronger one
  rationale: “Dispute” is more familiar than “contend,” while the stronger party remains unnamed.
