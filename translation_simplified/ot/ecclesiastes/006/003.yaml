translation:
  language: en
  text: If a man fathers a hundred children and lives for many, many years, but his soul[a] does not find satisfaction in the good things of life, and he is not even given a burial, I say that a stillborn child[b] is better off than he is.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “soul” may also mean the whole self or one’s appetite for life.
    reason: lexical_alternative
  - marker: b
    text: Or “a miscarried child” or “an untimely birth.”
    reason: lexical_alternative
