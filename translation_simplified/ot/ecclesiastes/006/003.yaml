translation:
  language: en
  text: If a man fathers a hundred children and lives many years, with his days stretching on and on, but his appetite is never satisfied with what is good in life[a] and he has no burial, I say[b] that a stillborn child[c] is better off than he is.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew says, “his soul is not satisfied with good”; here “soul” may mean the self or appetite.
    reason: lexical_alternative
  - marker: b
    text: Or “I said.”
    reason: lexical_alternative
  - marker: c
    text: Or “a miscarried child” or “an untimely birth.”
    reason: lexical_alternative
