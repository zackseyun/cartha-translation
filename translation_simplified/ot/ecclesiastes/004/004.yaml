translation:
  language: en
  text: I saw that all hard work and all skillful work[a] are driven by one person’s envy of another. This too is vapor and a chase after the wind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “all success in work”; the Hebrew can refer to skill or to the success that comes from it.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: all labor
  simplified_phrase: all hard work
  preserved_meaning: Human work is burdensome and requires exertion.
  reasoning_layer_used: POB lexical decision for עָמָל
  rationale: “Hard work” makes the burden of the labor immediately clear.
- pob_phrase: a man's envy of his neighbor
  simplified_phrase: one person’s envy of another
  preserved_meaning: People are driven by rivalry and comparison with those around them.
  reasoning_layer_used: POB footnote on representative singular force
  rationale: The recasting makes the representative sense clear without narrowing the statement to men.
- pob_phrase: vanity and a chasing after wind
  simplified_phrase: vapor and a chase after the wind
  preserved_meaning: Such striving is fleeting, insubstantial, and impossible to grasp.
  reasoning_layer_used: POB lexical decisions for הֶבֶל and רְעוּת רוּחַ
  rationale: The concrete images communicate the verse’s futility more clearly than the abstract word “vanity.”
translation_notes:
  risk_flags:
  - risk: “Vapor” foregrounds transience and insubstantiality more than the traditional term “vanity.”
    mitigation: The accompanying image of chasing the wind preserves the contextual force of futile pursuit.
