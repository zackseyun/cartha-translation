translation:
  language: en
  text: For if they fall, one will lift up the other. But woe to anyone who falls when no one else is there to lift them up.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: one will lift up his companion
  simplified_phrase: one will lift up the other
  preserved_meaning: One of the two will raise the companion who falls.
  reasoning_layer_used: Lexical decisions for הָאֶחָד, יָקִים, and חֲבֵרוֹ, with the immediate context of two people.
  rationale: “The other” naturally identifies the second person while “will” preserves the expected result.
- pob_phrase: the one who falls
  simplified_phrase: anyone who falls
  preserved_meaning: The warning concerns a solitary person who falls.
  reasoning_layer_used: Lexical decision for הָאֶחָד שֶׁיִּפּוֹל and the wisdom-saying context.
  rationale: “Anyone” presents the warning as a general truth without weakening its force.
- pob_phrase: when there is not a second to lift him up
  simplified_phrase: when no one else is there to lift them up
  preserved_meaning: A person alone has no other person available to raise them.
  reasoning_layer_used: Lexical decisions for וְאֵין שֵׁנִי and לַהֲקִימוֹ.
  rationale: “No one else is there” makes the numerical contrast clear in ordinary English.
