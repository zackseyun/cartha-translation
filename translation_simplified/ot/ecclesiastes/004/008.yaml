  text: 'There is one man[a], and he has no second; he has neither son nor brother, and there is no end to all his labor. Yet his eyes are not satisfied with wealth: “And for whom am I laboring and depriving myself[b] of good?” This too is vanity[c] and a grievous business.'
  footnotes:
