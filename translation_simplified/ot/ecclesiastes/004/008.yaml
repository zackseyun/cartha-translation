translation:
  language: en
  text: There is a man who is completely alone. He has no companion, son, or brother. His work never ends. Yet no amount of wealth satisfies his eyes. He asks, “Who am I working so hard for, while denying myself what is good?” This too is vanity[a] and a grievous occupation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “vanity” can also suggest vapor, transience, or futility.
    reason: lexical_alternative
