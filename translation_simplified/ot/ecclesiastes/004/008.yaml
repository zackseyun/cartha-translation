translation:
  language: en
  text: 'There is a man who is all alone. He has no companion, son, or brother. He never stops working, yet his eyes are never satisfied with wealth: “Who am I working for? Why am I denying myself good?” This too is vanity[a]—a grievous pursuit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “vanity” can also suggest vapor, transience, or futility.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: There is one man, and he has no second; he has neither son nor brother
  simplified_phrase: There is a man who is all alone. He has no companion, son, or brother.
  preserved_meaning: The man lacks both a companion and the close family members named in the Hebrew.
  reasoning_layer_used: POB lexical decisions for יֵשׁ אֶחָד, וְאֵין שֵׁנִי, and גַּם בֵּן וָאָח אֵין לוֹ
  rationale: “All alone” and “no companion” clearly express the Hebrew image of having “no second.”
- pob_phrase: there is no end to all his labor
  simplified_phrase: He never stops working
  preserved_meaning: His labor continues without end.
  reasoning_layer_used: POB lexical decision for וְאֵין קֵץ לְכָל עֲמָלוֹ
  rationale: The active wording expresses endless labor in ordinary English.
- pob_phrase: For whom am I laboring and depriving myself of good? This too is vanity and a grievous business.
  simplified_phrase: Who am I working for? Why am I denying myself good? This too is vanity—a grievous pursuit.
  preserved_meaning: He questions who benefits from his work and why he denies himself life’s good while pursuing wealth.
  reasoning_layer_used: POB lexical and theological decisions for עָמֵל, נַפְשִׁי, הֶבֶל, and עִנְיַן רָע
  rationale: Two short questions keep the distinct ideas clear, while “good” preserves the Hebrew’s broad expression.
translation_notes:
  risk_flags:
  - risk: “All alone” states directly what the combined clauses imply rather than preserving the literal phrase “no second.”
    mitigation: “No companion” preserves the relational meaning, while son and brother remain explicit.
  - risk: “Pursuit” is broader than the possible senses “business,” “task,” or “occupation.”
    mitigation: “Grievous” preserves the negative judgment, and the labor context limits the sense.
