simplification_decisions:
- pob_phrase: the dead, who have already died
  simplified_phrase: those who had already died
  preserved_meaning: The dead are identified as people whose death is already complete.
  reasoning_layer_used: Lexical decisions for אֶת הַמֵּתִים and שֶׁכְּבָר מֵתוּ.
  rationale: The rewrite removes formal repetition while preserving the completed and prior nature of their death.
- pob_phrase: more fortunate than the living, who are still alive
  simplified_phrase: better off than those who were still alive
  preserved_meaning: Qoheleth judges the dead to have an advantage over people who remain alive.
  reasoning_layer_used: Lexical decision for מִן הַחַיִּים and the contextual reading of oppression in Ecclesiastes 4:1–3.
  rationale: “Better off” states the comparison in common English without implying blessedness after death.
translation_notes:
