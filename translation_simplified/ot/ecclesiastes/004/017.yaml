translation:
  language: en
  text: Watch your steps when you go to the house of God. Go there to listen, rather than to offer the kind of sacrifice fools offer. They do not realize that what they are doing is evil.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Guard your steps when you go
  simplified_phrase: Watch your steps when you go
  preserved_meaning: The concrete image still warns readers to approach worship carefully.
  reasoning_layer_used: Lexical decision for שְׁמֹר and רגליך
  rationale: “Watch your steps” is common English and keeps the Hebrew image.
- pob_phrase: and draw near to listen
  simplified_phrase: Go there to listen
  preserved_meaning: The worshiper should approach God’s house for attentive hearing.
  reasoning_layer_used: Lexical decisions for וְקָרוֹב and לִשְׁמֹעַ
  rationale: The simpler purpose clause avoids an unfamiliar worship expression.
- pob_phrase: the sacrifice of fools
  simplified_phrase: the kind of sacrifice fools offer
  preserved_meaning: The criticism targets foolish, unreflective sacrifice rather than every sacrifice.
  reasoning_layer_used: Lexical and theological decisions on זָבַח and worship
  rationale: The expanded phrase makes the Hebrew class expression immediately clear.
translation_notes:
  risk_flags:
