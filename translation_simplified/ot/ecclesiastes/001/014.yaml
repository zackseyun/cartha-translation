translation:
  language: en
  text: I have seen everything people do under the sun. Look, it is all vapor[a]—fleeting and frustrating—and it is like chasing the wind.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally “vanity”; the Hebrew image can also suggest breath, futility, or something impossible to hold onto.
    reason: lexical_alternative
  - marker: b
    text: Or “striving after wind”; a more literal but uncertain possibility is “shepherding the wind.”
    reason: lexical_alternative
