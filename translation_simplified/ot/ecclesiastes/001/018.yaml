  preserved_meaning: Greater wisdom is accompanied by greater emotional distress.
  reasoning_layer_used: POB lexical decisions for בְּרֹב, חָכְמָה, רָב, and כָּעַס
  rationale: The comparative form makes the relationship immediate, while “frustration” gives common wording for the broader idea of vexation.
- pob_phrase: he who increases knowledge increases pain
  simplified_phrase: the more knowledge you gain, the more pain you have
  preserved_meaning: Increasing knowledge also increases pain.
  reasoning_layer_used: POB lexical decisions for דַּעַת and יוֹסִיף מַכְאוֹב
  rationale: The repeated “the more” structure preserves the proverb’s parallel force in natural English.
