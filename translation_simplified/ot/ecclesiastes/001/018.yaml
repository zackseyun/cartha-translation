translation:
  language: en
  text: For the more wisdom you gain, the more frustration you feel,[a] and the more knowledge you gain, the more pain you have.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “frustration” can also mean grief or irritation.
    reason: lexical_alternative
