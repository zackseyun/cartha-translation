  text: Those from earlier times are not remembered. Even those who come later will not be remembered by those who come after them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may refer broadly to former and later people, or to what belonged to earlier and later times.
