  rationale: Ordinary English avoids the awkward expression “who will be.”
- pob_phrase: there will be no remembrance among those who will come afterward
  simplified_phrase: will not be remembered by those who come after them
  preserved_meaning: Still later generations will not remember the later ones.
  reasoning_layer_used: lexical decisions for זִכָּרוֹן, עִם, and שֶׁיִּהְיוּ לָאַחֲרֹנָה
