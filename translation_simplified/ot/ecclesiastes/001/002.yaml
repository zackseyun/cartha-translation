translation:
  language: en
  text: “Vapor of vapors[a],” says Qoheleth[b]. “Everything is vapor—brief, impossible to hold onto, and often not what we expect.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word hevel literally means breath or vapor. Throughout Ecclesiastes it describes what quickly passes, cannot be held or fully understood, and often turns out differently from what people expect. “Vapor” keeps that image without claiming that nothing has meaning.
    reason: simplification_note
  - marker: b
    text: Qoheleth is the author's Hebrew name or title. It's often translated as 'the Teacher' or 'the Preacher,' but we keep 'Qoheleth' to allow for all possible meanings, without favoring one interpretation.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Breath of breaths ... all is mere breath
  simplified_phrase: Vapor of vapors ... Everything is vapor—brief, impossible to hold onto, and often not what we expect
  preserved_meaning: Preserves hevel as a concrete image while stating its transient, elusive, and ironic force.
  reasoning_layer_used: POB lexical and theological decisions for hevel
  rationale: Modern readers can mistake “breath” for substance and “vanity” for pride; “vapor” and the bounded explanation recover the book’s governing image.
interpretive_expansions:
- pob_phrase: all is mere breath
  rendering: Everything is vapor—brief, impossible to hold onto, and often not what we expect
  claim: Qoheleth uses hevel for transience, elusiveness, and ironic mismatch, not a blanket claim that nothing matters.
  evidence:
  - The POB hevel lexical decision documents all three senses across the book.
  - The source uses the concrete image hevel rather than an abstract Hebrew word for meaninglessness.
  confidence: high
  alternatives_preserved:
  - breath
  - mere breath
  - fleeting
translation_notes:
  risk_flags:
  - risk: The explanation could be mistaken for exhausting every contextual use of hevel.
    mitigation: The wording says “often,” retains the vapor image, and leaves verse-specific nuances to their contexts.
