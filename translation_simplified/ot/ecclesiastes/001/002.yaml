  text: Breath of breaths[a], says Qoheleth[b]; breath of breaths, all is mere breath.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word here is *hevel*, which literally means 'breath' or 'vapor.' The author, Qoheleth, uses this word to describe things that are temporary (like a breath that quickly disappears), hard to grasp, and often surprising or not what we expect. Because no single English word captures all these meanings, we use 'breath' to keep the original image, which also helps explain the strong statement 'breath of breaths.' Traditional translations like 'vanity' can be misleading (sounding like 'pride'), and 'meaninglessness' can suggest a hopelessness that Qoheleth's message doesn't fully support.
    reason: simplification_note
  - marker: b
    text: Qoheleth is the author's Hebrew name or title. It's often translated as 'the Teacher' or 'the Preacher,' but we keep 'Qoheleth' to allow for all possible meanings, without favoring one interpretation.
    reason: simplification_note
