translation:
  language: en
  text: “Vapor of vapors[a],” says Qoheleth[b]. “Everything is vapor—brief, impossible to hold onto, and often not what we expect.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word hevel literally means breath or vapor. Throughout Ecclesiastes it describes what quickly passes, cannot be held or fully understood, and often turns out differently from what people expect. “Vapor” keeps that image without claiming that nothing has meaning.
    reason: simplification_note
  - marker: b
    text: Qoheleth is the author's Hebrew name or title. It's often translated as 'the Teacher' or 'the Preacher,' but we keep 'Qoheleth' to allow for all possible meanings, without favoring one interpretation.
    reason: simplification_note
