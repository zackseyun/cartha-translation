translation:
  language: en
  text: I set my heart on understanding wisdom, madness, and foolishness. I learned that this too amounts to chasing the wind.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “striving after wind”; traditionally, “vexation of spirit.”
