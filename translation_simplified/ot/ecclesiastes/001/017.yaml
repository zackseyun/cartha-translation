simplification_decisions:
- pob_phrase: to know wisdom, and to know madness and folly
  simplified_phrase: on understanding wisdom, madness, and foolishness
  preserved_meaning: The speaker deliberately investigates both wisdom and its irrational opposites.
  reasoning_layer_used: POB lexical decisions for ידע, חָכְמָה, הוֹלֵלוֹת, and שִׂכְלוּת
  rationale: The smoother phrasing keeps madness distinct from ordinary foolishness.
- pob_phrase: I came to know that this too is a chasing after wind
  simplified_phrase: I learned that this too amounts to chasing the wind
  preserved_meaning: His investigation led him to discover that this pursuit is futile.
  reasoning_layer_used: POB lexical decisions for יָדַעְתִּי and רַעְיוֹן רוּחַ
  rationale: “Learned” states the result plainly while preserving the wind-chasing image.
