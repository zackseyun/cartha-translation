simplification_decisions:
- pob_phrase: to know wisdom, and to know madness and folly
  simplified_phrase: on understanding wisdom, madness, and foolishness
  preserved_meaning: The speaker deliberately investigates both wisdom and its irrational opposites.
  reasoning_layer_used: POB lexical decisions for לָדַעַת, חָכְמָה, הוֹלֵלוֹת, and שִׂכְלוּת
  rationale: The compact list is easier to follow while keeping madness distinct from foolishness.
- pob_phrase: I came to know
  simplified_phrase: I discovered
  preserved_meaning: The conclusion arose from the speaker’s investigation and experience.
  reasoning_layer_used: POB lexical decision for יָדַעְתִּי
  rationale: “Discovered” states the resulting realization in ordinary English.
- pob_phrase: a chasing after wind
  simplified_phrase: chasing after the wind
  preserved_meaning: The investigation is pictured as a futile attempt to catch what cannot be grasped.
  reasoning_layer_used: POB lexical decision for רַעְיוֹן רוּחַ
  rationale: The concrete wind-chasing image remains intact in a smoother sentence.
