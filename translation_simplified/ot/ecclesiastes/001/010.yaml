  rationale: The direct question is easier to follow and avoids adding a physical act of pointing.
- pob_phrase: See, this is new
  simplified_phrase: Look, this is new
  preserved_meaning: The speaker calls attention to something claimed to be new.
  reasoning_layer_used: Lexical decision for רְאֵה
  rationale: “Look” is a natural modern command that preserves the attention-getting force.
- pob_phrase: in the ages before us
  simplified_phrase: in earlier ages, before our time
  preserved_meaning: The thing existed in past ages preceding the present generation.
  reasoning_layer_used: Lexical decisions for לְעֹלָמִים and אֲשֶׁר הָיָה מִלְּפָנֵינוּ
  rationale: The wording clearly expresses prior ages while preserving their plural temporal sweep.
