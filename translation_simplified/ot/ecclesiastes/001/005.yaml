translation:
  language: en
  text: The sun rises and the sun sets; it hurries back[a] to its place, where it rises again.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'pants.' The Hebrew word suggests the sun is gasping or panting like a runner rushing back to the starting line.
    reason: simplification_note
