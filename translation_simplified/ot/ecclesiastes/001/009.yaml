translation:
  language: en
  text: What has happened before will happen again. What has been done before will be done again. Nothing is new under the sun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Under the sun” is Ecclesiastes’ way of speaking about life in this world.
    reason: cultural_note
simplification_decisions:
- pob_phrase: What has been is what will be
  simplified_phrase: What has happened before will happen again
  preserved_meaning: Past circumstances and occurrences recur in the future.
  reasoning_layer_used: Lexical decision for מַה שֶּׁהָיָה and the theological decision on recurring earthly patterns
  rationale: “Happened” conveys broad recurrence without suggesting that particular entities return to existence.
- pob_phrase: what has been done is what will be done
  simplified_phrase: What has been done before will be done again
  preserved_meaning: Past deeds recur while the passive force of both Hebrew verbs remains intact.
  reasoning_layer_used: Lexical decisions for the two Niphal forms of עשה
  rationale: A separate sentence makes the parallel clear without broadening “done” to “happen.”
- pob_phrase: there is nothing new under the sun
  simplified_phrase: Nothing is new under the sun
  preserved_meaning: The universal-sounding claim concerns observable human life in this world.
  reasoning_layer_used: Lexical and theological decisions on וְאֵין כָּל חָדָשׁ and תַּחַת הַשָּׁמֶשׁ
  rationale: The direct wording preserves the force of the claim and its key earthly-life image.
interpretive_expansions:
- pob_phrase: is what will be ... is what will be done
  rendering: will happen again ... will be done again
  claim: The verse describes recurring patterns in earthly life.
  evidence:
  - The parallel past and future clauses present circumstances and deeds as recurring.
  - The POB theological decision identifies recurring patterns in earthly life.
  confidence: high
  alternatives_preserved:
  - The broad wording does not claim that every recurrence is an exact repetition.
translation_notes:
  risk_flags:
  - risk: “Happened” is broader than the POB’s literal “has been.”
    mitigation: The immediate context and POB theological decision support recurrence without implying that particular entities re-exist.
  - risk: “Nothing is new” may sound like an absolute denial of every kind of novelty.
    mitigation: The retained image “under the sun” and its footnote limit the saying to life in this world.
