translation:
  language: en
  text: All the streams[a] flow into the sea, but the sea does not fill up. The streams return to the place where they flow,[b] and there they flow again.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “rivers.” The Hebrew word can also refer to seasonal streams or their channels.
    reason: lexical_alternative
  - marker: b
    text: The wording points to the waters’ repeated cycle without explaining how they return.
    reason: simplification_note
