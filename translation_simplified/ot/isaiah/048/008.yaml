translation:
  language: en
  text: You had not heard. You had not known. From long ago, your ear had not been opened. For I knew that you would surely break faith and that, from the womb,[a] you would be called a rebel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “From the womb” means from the earliest stage of life.
    reason: simplification_note
  - marker: b
    text: Or “a transgressor”; the Hebrew describes one who rebels or breaks faith.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Indeed, you had not heard; indeed, you had not known; indeed, from of old your ear had not been opened.
  simplified_phrase: You had not heard. You had not known. From long ago, your ear had not been opened.
  preserved_meaning: Three parallel negative statements retain the emphatic buildup and the image of an unopened ear.
  reasoning_layer_used: POB lexical decisions for גַּם, מֵאָז, and פִתְּחָה אָזְנֶךָ
  rationale: Three short parallel sentences make the cumulative emphasis clear without the formal repeated “indeed.”
- pob_phrase: you would surely deal treacherously
  simplified_phrase: you would surely break faith
  preserved_meaning: God knew that Israel would certainly act with betrayal and disloyalty.
  reasoning_layer_used: POB lexical decision for בָּגוֹד תִּבְגּוֹד
  rationale: “Break faith” states treacherous disloyalty plainly while “surely” retains the Hebrew emphasis.
- pob_phrase: you would be called a transgressor
  simplified_phrase: you would be called a rebel
  preserved_meaning: Israel would be characterized as one who defies God and breaks faith.
  reasoning_layer_used: POB lexical decisions for וּפֹשֵׁעַ and קֹרָא לָךְ
  rationale: “Rebel” is clearer than “transgressor” while preserving the sense of defiance.
translation_notes:
  risk_flags:
  - risk: “From the womb” could be read as a precise claim about prenatal guilt.
    mitigation: The footnote explains the POB reading that it refers to the earliest stage of Israel’s existence.
  - risk: “Rebel” is less formally legal than “transgressor.”
    mitigation: The lexical footnote preserves “transgressor” as an alternative and explains the shared sense.
