simplification_decisions:
- pob_phrase: Indeed, my hand founded the earth
  simplified_phrase: Yes, my hand laid the foundation of the earth
  preserved_meaning: God emphatically describes his direct act of establishing the earth through the image of his hand.
  reasoning_layer_used: Lexical and theological decisions on אַף, יָדִי, and יָסְדָה
  rationale: The clearer phrase keeps both the emphasis and the concrete foundation image.
- pob_phrase: when I call to them
  simplified_phrase: When I call them
  preserved_meaning: The heavens and earth respond to God's summons.
  reasoning_layer_used: Lexical decision on קֹרֵא אֲנִי אֲלֵיהֶם
  rationale: English normally uses “call them” here without the extra preposition.
translation_notes:
  risk_flags:
