translation:
  language: en
  text: Leave Babylon; flee from the Chaldeans![a] Announce this with a joyful shout. Make it heard; spread the news to the farthest reaches of the earth. Say, “Yahweh has redeemed his servant Jacob.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew names the Chaldean people; this may also be translated “flee from Chaldea.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Go out from Babylon
  simplified_phrase: Leave Babylon
  preserved_meaning: The people are commanded to depart from Babylon.
  reasoning_layer_used: Lexical decision for צְאוּ and מִבָּבֶל
  rationale: “Leave” expresses the command to depart more directly in common English.
- pob_phrase: Declare this with a shout of joy; make it heard; send it out
  simplified_phrase: Announce this with a joyful shout. Make it heard; spread the news
  preserved_meaning: The joyful message must be proclaimed aloud and circulated widely.
  reasoning_layer_used: Lexical decisions for בְּקוֹל רִנָּה, הַגִּידוּ, הַשְׁמִיעוּ, and הוֹצִיאוּהָ
  rationale: Shorter clauses clarify the distinct commands without merging them.
- pob_phrase: to the end of the earth
  simplified_phrase: to the farthest reaches of the earth
  preserved_meaning: The announcement is to extend throughout the whole earth.
  reasoning_layer_used: Lexical decision for עַד קְצֵה הָאָרֶץ
  rationale: This familiar expression preserves the image of reaching the earth’s outermost edge.
translation_notes:
  risk_flags:
