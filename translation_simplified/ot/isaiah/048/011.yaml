translation:
  language: en
  text: I will act for my own sake—yes, for my own sake. For how could it be treated as unholy?[a] And I will not give my glory to anyone else.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “How could my name be treated as unholy?” The Hebrew does not state explicitly what is being treated this way.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: For my own sake, for my own sake, I will act
  simplified_phrase: I will act for my own sake—yes, for my own sake
  preserved_meaning: God emphatically says that his own sake is the motive for his action.
  reasoning_layer_used: POB lexical decisions for לְמַעֲנִי and אֶעֱשֶׂה
  rationale: The reordered clause is natural English and keeps the emphatic repetition.
- pob_phrase: for how can it be profaned?
  simplified_phrase: For how could it be treated as unholy?
  preserved_meaning: The rhetorical question gives the reason for God's action while leaving its referent unstated.
  reasoning_layer_used: POB lexical decisions for כִּי and יֵחָל, and the implicit-referent theological decision
  rationale: “Treated as unholy” explains “profaned,” while “For” preserves the logical connection.
- pob_phrase: And my glory I will not give to another
  simplified_phrase: And I will not give my glory to anyone else
  preserved_meaning: God will not give his glory to any other party.
  reasoning_layer_used: POB lexical decisions for וּכְבוֹדִי, לְאַחֵר, and אֶתֵּן
  rationale: Ordinary English word order improves clarity without specifying a particular rival.
translation_notes:
  risk_flags:
  - risk: The pronoun “it” remains deliberately unclear because the Hebrew omits the referent.
    mitigation: The footnote offers “my name” as a plausible reading without making it certain.
