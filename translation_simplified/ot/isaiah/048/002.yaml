translation:
  language: en
  text: For they bear the name of the holy city[a] and lean on the God of Israel. His name is Yahweh of Hosts.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “they are called from the holy city.” The Hebrew may refer either to their identity through the city or to their origin there.
    reason: alternative_reading
  - marker: b
    text: “Hosts” can mean forces or armies, especially the armies of heaven.
    reason: lexical_alternative
