translation:
  language: en
  text: 'Come close to me and listen to this: From the beginning, I have not spoken in secret. I was there when it came to be.[a] Now the Lord Yahweh has sent me,[b] and his spirit.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “when it happened” or “when it began to exist.” The Hebrew does not specify exactly what “it” refers to.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew does not identify the speaker. Christian readers have often understood the speaker as the Servant or Messiah.
    reason: alternative_reading
  - marker: c
    text: Or, “and his Spirit.” The Hebrew may refer distinctly to God’s Spirit, but the wording is not fully explicit.
    reason: alternative_reading
