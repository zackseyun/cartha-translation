translation:
  language: en
  text: Come together, all of you, and listen. Which of them announced these things? Yahweh loves this man. He will carry out Yahweh’s purpose against Babylon, and his arm—his power—will be against the Chaldeans.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Yahweh loves him; Yahweh will carry out his own purpose against Babylon, and his arm will be against the Chaldeans.”
    reason: alternative_reading
