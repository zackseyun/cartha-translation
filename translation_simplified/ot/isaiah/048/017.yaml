  preserved_meaning: Yahweh speaks under his covenant titles as Israel’s Redeemer and Holy One.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Ordinary English word order makes the introduction immediately clear while retaining every title.
- pob_phrase: who teaches you to profit
  simplified_phrase: I teach you for your own good
  preserved_meaning: God’s instruction is intended to benefit his people.
  reasoning_layer_used: POB lexical decision for לְהוֹעִיל
  rationale: “For your own good” communicates beneficial purpose without the modern financial sense of “profit.”
- pob_phrase: who leads you in the way you should go
