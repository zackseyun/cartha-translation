translation:
  language: en
  text: 'Yahweh, your Redeemer, the Holy One of Israel, says:


    “I am Yahweh your God. I teach you for your own good, and I lead you on the path you should take.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I guide you on the path you travel.” The Hebrew can describe either the path you take or the path you ought to take.
    reason: alternative_reading
