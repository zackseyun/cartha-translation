translation:
  language: en
  text: I told you about these things long ago. Before they happened, I made sure you heard about them, so that you would not say, “My idol made them happen. My carved image and my cast image commanded them.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I declared it to you long ago
  simplified_phrase: I told you about these things long ago
  preserved_meaning: God made the coming events known long before their fulfillment.
  reasoning_layer_used: Lexical decisions for וָאַגִּיד and מֵאָז
  rationale: “Told you about” expresses advance disclosure in direct common English.
- pob_phrase: before it came to pass I made you hear it
  simplified_phrase: Before they happened, I made sure you heard about them
  preserved_meaning: God ensured that the people heard of the events before they occurred.
  reasoning_layer_used: Lexical decisions for בְּטֶרֶם תָּבוֹא and הִשְׁמַעְתִּיךָ
  rationale: This keeps the causative force while replacing an opaque prophetic idiom.
- pob_phrase: lest you say
  simplified_phrase: so that you would not say
  preserved_meaning: The advance announcement was intended to prevent Israel from crediting idols.
  reasoning_layer_used: Lexical decision for פֶּן and grounding review
  rationale: “Would not” preserves preventative purpose without implying inability to speak.
interpretive_expansions:
- pob_phrase: it ... them
  rendering: these things ... them
  claim: The pronouns refer to the foretold events that later happened.
  evidence:
  - The lexical rationale identifies the referent as the foretold event or events.
  - The claim that an idol “did them” concerns events being brought about.
  confidence: high
  alternatives_preserved:
  - the foretold things
  - the foretold events
translation_notes:
  risk_flags:
  - risk: “Told” has less formal prophetic tone than POB’s “declared.”
    mitigation: The emphasis on advance disclosure preserves the prophetic function clearly.
  - risk: The three image terms may seem repetitive to modern readers.
    mitigation: Their distinct wording is retained because the Hebrew deliberately differentiates them.
