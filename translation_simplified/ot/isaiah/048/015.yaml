translation:
  language: en
  text: I—yes, I—have spoken. I have called him[a] and brought him, and I will make his undertaking succeed.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Him” refers to the man God called and brought, commonly understood from the context to be Cyrus (see Isaiah 48:14).
    reason: cross_reference
  - marker: b
    text: Literally, “I will make his way prosper”; this means God will make his course or undertaking succeed.
    reason: lexical_alternative
