translation:
  language: en
  text: Your dead will come back to life; my dead bodies will rise.[a] Wake up and shout for joy, you who lie in the dust! For your dew is a dew of light,[b] and the earth will cast out the dead.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “my dead body will rise.” The Hebrew says “my corpse,” but the verb is plural and may give the expression a collective sense.
    reason: lexical_alternative
  - marker: b
    text: The difficult Hebrew expression may also mean “dew of lights” or “radiant dew,” suggesting dew associated with life-giving light.
    reason: lexical_alternative
  - marker: c
    text: Or “the shades,” meaning the departed dead pictured as shadowy inhabitants of the underworld.
    reason: alternative_reading
