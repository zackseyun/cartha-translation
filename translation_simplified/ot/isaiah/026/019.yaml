  rationale: This clearer phrase preserves resurrection without reducing it to national revival.
- pob_phrase: Awake ... you who dwell in the dust
  simplified_phrase: Wake up ... you who lie in the dust
  preserved_meaning: The dead are addressed as sleeping in the grave and called to awaken.
  reasoning_layer_used: Lexical decisions for הקיצו and שכני עפר
  rationale: Ordinary English clarifies the grave image while retaining dust and awakening.
- pob_phrase: a dew of lights
