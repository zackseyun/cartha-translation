translation:
  language: en
  text: Yahweh our God, other lords besides you have ruled over us. But through you alone we mention your name.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “But in you alone we mention your name.” The Hebrew can mean either “through you” or “in you” here.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: O Yahweh our God
  simplified_phrase: Yahweh our God
  preserved_meaning: The people directly address Yahweh as their God.
  reasoning_layer_used: POB lexical decisions for יְהוָה and אֱלֹהֵינוּ
  rationale: Dropping “O” makes the direct address natural in modern English without weakening its prayerful force.
- pob_phrase: other lords besides you have ruled over us
  simplified_phrase: other lords besides you have ruled over us
  preserved_meaning: Rival rulers or masters distinct from Yahweh exercised dominion over the people.
  reasoning_layer_used: POB lexical and theological decisions on בְּעָלוּנוּ, אֲדֹנִים, and זוּלָתֶךָ
  rationale: The clear wording retains both the oppressive rule and the source’s explicit contrast with Yahweh.
- pob_phrase: we make mention of your name
  simplified_phrase: we mention your name
  preserved_meaning: The people acknowledge or invoke Yahweh by mentioning his name.
  reasoning_layer_used: POB lexical decisions on נַזְכִּיר and שְׁמֶךָ
  rationale: “Mention” is common English and better preserves the source sense than merely speaking the name.
translation_notes:
  risk_flags:
  - risk: “Other lords” may be understood only as human rulers.
    mitigation: The wording remains broad enough to include oppressive rulers or personified false gods.
  - risk: “Through you” may sound exclusively instrumental.
    mitigation: The footnote preserves the viable alternative “in you alone.”
