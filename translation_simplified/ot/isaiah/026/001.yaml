  preserved_meaning: The song declares the city’s strength and then describes the action of an unnamed singular subject.
  reasoning_layer_used: POB syntax and theological decision
  rationale: Two sentences make the thought easier to follow without resolving the implicit subject.
- pob_phrase: walls and rampart
  simplified_phrase: walls and outer defense
  preserved_meaning: Salvation serves as both the city’s walls and its outer fortification.
  reasoning_layer_used: POB lexical decision for חוֹמוֹת וָחֵל
  rationale: “Outer defense” communicates the function of the less familiar term “rampart.”
