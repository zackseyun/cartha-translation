translation:
  language: en
  text: 'In that day, this song will be sung in the land of Judah:


    “We have a strong city. He[a] sets up salvation as the city’s walls and outer defense.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew does not say who “he” is, though the context most likely points to God.
    reason: alternative_reading
