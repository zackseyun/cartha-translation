translation:
  language: en
  text: O Yahweh, your hand is raised, but they do not see it. They will see your zeal for your people[a] and be put to shame. Yes, the fire directed at your enemies[b] will consume them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the zeal of the people.” The compact Hebrew phrase can be understood in more than one way.
    reason: alternative_reading
  - marker: b
    text: Or “the fire of your enemies.” The Hebrew wording allows either relationship, but the main text best fits divine judgment here.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: They will see and be put to shame by the zeal for your people
  simplified_phrase: They will see your zeal for your people and be put to shame
  preserved_meaning: God’s zeal for his people will become evident and shame his opponents.
  reasoning_layer_used: Theological decision on קִנְאַת עָם and lexical decisions for seeing and shame
  rationale: The clause is reordered into natural English while retaining the preferred reading and its ambiguity in a note.
- pob_phrase: indeed
  simplified_phrase: 'Yes'
  preserved_meaning: The final judgment statement is emphatically reinforced.
  reasoning_layer_used: Lexical decision for אַף
  rationale: “Yes” gives the same emphasis in more familiar English.
- pob_phrase: the fire for your enemies
  simplified_phrase: the fire directed at your enemies
  preserved_meaning: The fire is God’s destructive judgment against his enemies.
  reasoning_layer_used: Lexical decisions for אֵשׁ and צָרֶיךָ plus doctrine realignment
  rationale: “Directed at” clarifies the difficult relationship while preserving both the fire image and the controlling reading.
interpretive_expansions:
- pob_phrase: they do not see
  rendering: they do not see it
  claim: What they fail to see is Yahweh’s raised hand.
  evidence:
