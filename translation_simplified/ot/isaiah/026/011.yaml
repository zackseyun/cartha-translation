  confidence: high
- pob_phrase: They will see
  rendering: They will see your zeal for your people
  claim: Their future recognition concerns Yahweh’s zealous action for his people.
  evidence:
  - The following phrase identifies zeal for the people as the cause of their shame.
  - The POB theological decision reads the zeal as Yahweh’s concern for his people.
  confidence: moderate
  alternatives_preserved:
  - the zeal of the people
