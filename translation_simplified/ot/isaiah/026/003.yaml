translation:
  language: en
  text: You keep the mind that is firmly fixed on you in perfect peace,[a] because it trusts in you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebrew: “peace, peace,” emphasizing full or complete peace.'
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the mind that is stayed on you
  simplified_phrase: the mind that is firmly fixed on you
  preserved_meaning: The inner disposition is firmly directed toward God without merging this with the following act of trust.
  reasoning_layer_used: The lexical decisions for יֵצֶר and סָמוּךְ preserve the mind as subject and its firm Godward orientation.
  rationale: “Firmly fixed on you” replaces the older expression “stayed on you” while keeping firmness distinct from trust.
- pob_phrase: You keep in perfect peace the mind
  simplified_phrase: You keep the mind ... in perfect peace
  preserved_meaning: God keeps the firmly fixed mind in complete peace.
  reasoning_layer_used: The lexical decisions for תִּצֹּר and שָׁלוֹם שָׁלוֹם govern the reordered wording.
  rationale: The new order reads naturally in modern English without changing the relationship between God, the mind, and peace.
translation_notes:
  risk_flags:
  - risk: A mind that “trusts” may sound personified in English.
    mitigation: This preserves POB’s source-driven decision to retain “the mind” as the grammatical subject.
