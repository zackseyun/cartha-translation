translation:
  language: en
  text: Yahweh, when they were in distress, they sought you.[a] When your discipline came upon them,[b] they poured out a prayer in whispers.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “turned to you” or “attended to you.”
    reason: lexical_alternative
  - marker: b
    text: “Discipline” may also be translated “correction” or “instruction.”
    reason: lexical_alternative
  - marker: c
    text: The compact Hebrew may also mean “poured out a whisper” or “uttered a murmur.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: O Yahweh, in distress they sought you
  simplified_phrase: Yahweh, when they were in distress, they sought you.
  preserved_meaning: Their suffering led them to seek Yahweh.
  reasoning_layer_used: Lexical decisions for בַּצַּר and פְּקָדוּךָ
  rationale: A direct time clause makes the relationship clear without narrowing the verb’s documented range.
- pob_phrase: when your discipline was upon them
  simplified_phrase: When your discipline came upon them
  preserved_meaning: The distress involved Yahweh’s corrective discipline.
  reasoning_layer_used: Theological decision for מוּסָר and lexical decision for לָמוֹ
  rationale: “Came upon them” states the relationship naturally while retaining God’s corrective action.
- pob_phrase: they poured out a whispered prayer
  simplified_phrase: they poured out a prayer in whispers
  preserved_meaning: They offered subdued prayer while suffering.
  reasoning_layer_used: Lexical and theological decisions for צָקוּן and לַחַשׁ
  rationale: The wording keeps the pouring image and makes the hushed manner immediately understandable.
translation_notes:
