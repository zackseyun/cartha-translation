  reasoning_layer_used: POB lexical decision and footnote for אֲשַׁחֲרֶךָּ
  rationale: “At dawn” makes the early-morning image immediately clear, while the footnote preserves the earnest-seeking sense.
- pob_phrase: the inhabitants of the world learn righteousness
