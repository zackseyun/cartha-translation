translation:
  language: en
  text: My soul longs for you in the night; deep within me, my spirit seeks you at dawn.[a] For when your judgments are on the earth, the people of the world learn righteousness—how to live rightly.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “earnestly seeks you”; the Hebrew can suggest both seeking at dawn and eager seeking.
    reason: lexical_alternative
  - marker: b
    text: Or “learn justice.”
    reason: lexical_alternative
