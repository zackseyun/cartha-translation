translation:
  language: en
  text: The path of righteous people is level. O Upright One,[a] you make their way smooth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “The path of righteous people is straight; straight is the path of righteous people that you make level.” The Hebrew may describe the path as straight instead of addressing God as “Upright One.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the righteous
  simplified_phrase: righteous people
  preserved_meaning: The Hebrew refers collectively to people who are righteous without specifying gender.
  reasoning_layer_used: lexical decision for צַדִּיק
  rationale: Adding “people” makes the collective expression immediately clear.
- pob_phrase: you make the way of the righteous smooth
  simplified_phrase: you make their way smooth
  preserved_meaning: God smooths the way of the same righteous people named in the first sentence.
  reasoning_layer_used: lexical decisions for מַעְגַּל and תְּפַלֵּס
  rationale: The pronoun avoids heavy repetition while preserving the road image.
translation_notes:
  risk_flags:
  - risk: “O Upright One” may sound unfamiliar as a direct address to God.
    mitigation: The footnote preserves the genuine alternative that “straight” describes the path.
