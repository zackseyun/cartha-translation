translation:
  language: en
  text: We became pregnant[a] and writhed in labor, but it was as though we gave birth to wind.[b] We brought no deliverance to the earth, and the people of the world did not fall.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “We conceived.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word translated “wind” can also mean “breath” or “spirit.”
    reason: lexical_alternative
  - marker: c
