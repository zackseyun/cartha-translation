translation:
  language: en
  text: For he has brought down those who live in the heights—the lofty city.[a] He brings it low, he brings it low to the ground; he brings it down to the dust.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew does not name this city; the phrase may also be translated “the exalted city” or “the city set on high.”
