  reasoning_layer_used: POB lexical decision for יֹשְׁבֵי מָרוֹם
  rationale: “Live” is more familiar than “dwell,” while “the heights” preserves the source image.
- pob_phrase: the lofty city
  simplified_phrase: the lofty city
  preserved_meaning: This retains both spatial height and exalted status without naming the city.
  reasoning_layer_used: POB lexical and theological decisions for קִרְיָה נִשְׂגָּבָה
  rationale: Keeping “lofty” avoids narrowing the deliberate ambiguity to physical location alone.
- pob_phrase: he lays it low, he lays it low to the earth
  simplified_phrase: He brings it low, he brings it low to the ground
  preserved_meaning: The emphatic repetition and the image of the city being overthrown remain intact.
  reasoning_layer_used: POB lexical decisions for שׁפל and עַד אֶרֶץ
  rationale: “Brings it low” is clear modern English, and “ground” supports the parallel image of dust.
