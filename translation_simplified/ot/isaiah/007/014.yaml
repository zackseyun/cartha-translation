translation:
  language: en
  text: Therefore, the Lord himself will give you a sign. Look! The young woman[a] is pregnant and will give birth to a son.[b] She will name him Immanuel.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the virgin.” The Hebrew word means “young woman.” The Greek Septuagint uses a word often understood as “virgin,” and Matthew 1:23 quotes the verse in that form.
    reason: alternative_reading
  - marker: b
    text: Traditionally, “shall conceive and bear a son.” The Hebrew more literally describes the woman as already pregnant and bearing a son.
    reason: lexical_alternative
  - marker: c
    text: Immanuel means “God with us.”
    reason: cultural_note
  - marker: d
    text: Some ancient traditions have “you will name him,” and Matthew 1:23 has “they will name him.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: behold
  simplified_phrase: Look!
  preserved_meaning: The prophetic announcement still calls for immediate, solemn attention.
  reasoning_layer_used: Lexical decision for הִנֵּה
  rationale: “Look!” gives modern readers the force of the older word “behold.”
- pob_phrase: is pregnant and is bearing a son
  simplified_phrase: is pregnant and will give birth to a son
  preserved_meaning: The woman is already pregnant, and the son's birth is presented without claiming immediate imminence.
  reasoning_layer_used: Lexical and theological decisions for הָרָה וְיֹלֶדֶת
  rationale: This natural English avoids the awkward phrase “is bearing” while keeping conception in the past.
- pob_phrase: she will call his name Immanuel
  simplified_phrase: She will name him Immanuel
  preserved_meaning: The woman gives the child the name Immanuel.
  reasoning_layer_used: Lexical decision for וְקָרָאת שְׁמוֹ
  rationale: “Name him” expresses the Hebrew naming idiom in ordinary English.
translation_notes:
  risk_flags:
  - risk: “Will give birth” uses ordinary English future wording for a Hebrew participle with an ongoing or imminent range.
    mitigation: The footnote preserves the more literal wording without asserting that the birth is merely imminent.
  - risk: “Young woman” may be unfamiliar to readers who know the traditional christological wording.
    mitigation: The footnote preserves “virgin” and its connection to the Septuagint and Matthew 1:23.
