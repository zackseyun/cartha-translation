  text: Samaria is the head—the leading city—of Ephraim,[a] and the son of Remaliah is the head—the ruler—of Samaria. If you do not believe, you certainly will not stand firm.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ephraim here refers to the northern kingdom.
    reason: cultural_note
  - marker: b
    text: The Hebrew uses two forms of the same root, linking believing with standing firm; it may also be translated, “If you do not trust, you will not stand firm.”
    reason: lexical_alternative
