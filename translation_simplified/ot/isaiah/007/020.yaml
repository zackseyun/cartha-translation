translation:
  language: en
  text: On that day, the Lord will use the king of Assyria, from beyond the Euphrates River, as a hired razor. He will shave the head and the hair of the feet,[a] and that razor will also sweep away the beard.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may mean the hair of the legs. “Feet” may also be a polite reference to the genital area, adding to the picture of complete humiliation.
    reason: lexical_alternative
