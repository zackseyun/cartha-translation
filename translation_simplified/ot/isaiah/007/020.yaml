  preserved_meaning: The Lord employs Assyria as the instrument of his judgment.
  reasoning_layer_used: lexical and theological decisions
  rationale: The recast sentence makes the razor metaphor and Assyria's role immediately clear.
- pob_phrase: and it will also sweep away the beard
  simplified_phrase: and that razor will also sweep away the beard
  preserved_meaning: The razor completely removes even the beard as part of the humiliating judgment.
  reasoning_layer_used: lexical decision
  rationale: Naming the razor removes an unclear pronoun while retaining the vivid image.
