translation:
  language: en
  text: For before the boy knows how to reject what is evil and choose what is good, the land whose two kings you dread will be deserted.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “abandoned”; the Hebrew may describe the land as left empty or forsaken.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: knows to refuse the evil and choose the good
  simplified_phrase: knows how to reject what is evil and choose what is good
  preserved_meaning: The boy has not yet gained the ability to distinguish between evil and good.
  reasoning_layer_used: Lexical decisions for יֵדַע, מָאֹס, בָּרָע, and בַּטּוֹב
  rationale: This makes the moral contrast natural in modern English.
- pob_phrase: the land before whose two kings you dread
  simplified_phrase: the land whose two kings you dread
  preserved_meaning: The land is identified by its two kings, who cause the hearer dread.
  reasoning_layer_used: Lexical decisions for אֲשֶׁר אַתָּה קָץ מִפְּנֵי and שְׁנֵי מְלָכֶיהָ
  rationale: The relative clause preserves the source relationship without implying joint rule over one territory.
- pob_phrase: will be forsaken
  simplified_phrase: will be deserted
  preserved_meaning: The land will be left abandoned, possibly empty of inhabitants.
  reasoning_layer_used: Lexical decision for תֵּעָזֵב and POB footnote a
  rationale: “Deserted” keeps the passive image while using common English.
translation_notes:
  risk_flags:
