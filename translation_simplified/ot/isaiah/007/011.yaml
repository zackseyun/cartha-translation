translation:
  language: en
  text: Ask Yahweh your God to give you a sign for yourself. Make it as deep as Sheol, the realm of the dead, or as high as heaven.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says, “make it deep … or make it high upward.” “Heaven” expresses the upper extreme implied by the contrast with Sheol.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Ask for yourself a sign from Yahweh your God
  simplified_phrase: Ask Yahweh your God to give you a sign for yourself
  preserved_meaning: Ahaz is personally commanded to request a sign that comes from Yahweh.
  reasoning_layer_used: Lexical decisions for “ask,” “for yourself,” and “from.”
  rationale: The ordinary English clause makes Yahweh’s role as the sign’s source immediately clear.
- pob_phrase: make it as deep as Sheol or as high as heaven
  simplified_phrase: Make it as deep as Sheol, the realm of the dead, or as high as heaven
  preserved_meaning: Ahaz may set the requested sign at either extreme without any limit on its scope.
  reasoning_layer_used: Lexical imperatives and the theological decision on the depth-and-height merism.
  rationale: The direct command preserves Ahaz’s active choice while briefly explaining Sheol.
interpretive_expansions:
- pob_phrase: Sheol
  rendering: Sheol, the realm of the dead
  claim: Sheol names the realm of the dead.
  evidence:
