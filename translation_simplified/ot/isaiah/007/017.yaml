translation:
  language: en
  text: Yahweh will bring days of trouble upon you, your people, and your father’s house.[a] These days will be unlike any since Ephraim turned away from Judah.[b] They will come through the king of Assyria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Your father’s house” may refer more specifically to your ancestral or royal house.
    reason: cultural_note
  - marker: b
    text: Ephraim represents the northern kingdom, which separated from Judah.
    reason: cultural_note
simplification_decisions:
- pob_phrase: days unlike any that have not come
  simplified_phrase: These days will be unlike any
  preserved_meaning: The coming crisis will be unprecedented in the period named.
  reasoning_layer_used: lexical decision for אֲשֶׁר לֹא בָאוּ
  rationale: The rewrite removes the confusing negative construction without changing the comparison.
- pob_phrase: since the day Ephraim turned away from Judah
  simplified_phrase: since Ephraim turned away from Judah
  preserved_meaning: The comparison begins with the northern kingdom’s separation from Judah.
  reasoning_layer_used: lexical decision for סוּר and historical context
  rationale: Dropping “the day” makes the historical reference more natural in English.
- pob_phrase: namely, the king of Assyria
  simplified_phrase: They will come through the king of Assyria
  preserved_meaning: The Assyrian king is the means by which the announced calamity arrives.
  reasoning_layer_used: theological decision on appositional specification
  rationale: A separate sentence makes the difficult apposition immediately understandable.
interpretive_expansions:
- pob_phrase: days
  rendering: days of trouble
  claim: The coming days are a period of calamity rather than neutral time.
  evidence:
