- pob_phrase: namely, the king of Assyria
  rendering: They will come through the king of Assyria
  claim: The Assyrian king is the instrument through whom the days of trouble come.
  evidence:
  - The POB lexical rationale says the days come in the form of the Assyrian king.
  - The POB theological decision identifies the Assyrian king as the instrument.
  confidence: high
  alternatives_preserved:
  - namely, the king of Assyria
  - even the king of Assyria
translation_notes:
  risk_flags:
  - risk: “Through” states the instrumental relationship more directly than the Hebrew apposition.
    mitigation: The wording follows the POB’s lexical and theological rationale while retaining the king as the climax.
  - risk: Modern readers may take “father’s house” to mean only Ahaz’s immediate household.
    mitigation: The footnote preserves its possible ancestral and royal scope.
