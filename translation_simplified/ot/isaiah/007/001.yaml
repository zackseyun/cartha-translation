translation:
  language: en
  text: During the reign of Ahaz, the son of Jotham and grandson of Uzziah, king of Judah, King Rezin of Aram[a] and King Pekah of Israel, the son of Remaliah, marched to Jerusalem to make war against it. But he[b] was not able to fight against it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aram is traditionally called Syria.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says “he,” although Rezin and Pekah are both named as attackers.
    reason: source_note
