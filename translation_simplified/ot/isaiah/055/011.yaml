translation:
  language: en
  text: In the same way, the word that goes out from my mouth will not return to me without results. It will accomplish what I desire and succeed in doing what I sent it to do.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: so will my word be that goes out from my mouth
  simplified_phrase: In the same way, the word that goes out from my mouth
  preserved_meaning: God compares the effect of his spoken word to the rain and snow in the preceding verses.
  reasoning_layer_used: lexical decision for כֵּן and immediate context
  rationale: “In the same way” makes the comparison clear while retaining the image of speech leaving God's mouth.
- pob_phrase: it will not return to me empty
  simplified_phrase: will not return to me without results
  preserved_meaning: God's word never returns without achieving an effect.
  reasoning_layer_used: lexical decision and footnote for רֵיקָם
  rationale: “Without results” directly explains what “empty” means here.
- pob_phrase: succeed in the purpose for which I sent it
  simplified_phrase: succeed in doing what I sent it to do
  preserved_meaning: God's word successfully completes its intended mission.
  reasoning_layer_used: lexical decision for וְהִצְלִיחַ and אֲשֶׁר שְׁלַחְתִּיו
  rationale: The active wording replaces an abstract purpose clause with ordinary English.
