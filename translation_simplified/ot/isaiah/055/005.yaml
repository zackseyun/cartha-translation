  reasoning_layer_used: POB lexical decision for הֵן
  rationale: “See!” keeps the force of the announcement in familiar English.
- pob_phrase: will run to you
  simplified_phrase: will come running to you
  preserved_meaning: The nation will move swiftly toward the addressee.
  reasoning_layer_used: POB lexical decision for אֵלֶיךָ יָרוּצוּ
  rationale: The added verb makes the movement natural in English while preserving the vivid image of running.
- pob_phrase: for he has glorified you
  simplified_phrase: for he has given you glory
  preserved_meaning: God has publicly honored and exalted the unnamed addressee.
  reasoning_layer_used: POB lexical decision for פֵאֲרָךְ
  rationale: The recast phrase makes divine glorification easier to understand without specifying its form.
