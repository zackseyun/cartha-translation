simplification_decisions:
- pob_phrase: Incline your ear and come to me
  simplified_phrase: Turn your ear toward me and come to me
  preserved_meaning: The concrete image calls the hearers to listen attentively and approach God.
  reasoning_layer_used: Lexical decisions for הַטּוּ אָזְנְכֶם and וּלְכוּ אֵלַי
  rationale: “Turn your ear” keeps the Hebrew image in familiar English.
- pob_phrase: hear, and your soul shall live
  simplified_phrase: Listen, so that you may live
  preserved_meaning: Receptive listening leads to life for the whole person.
  reasoning_layer_used: Lexical decisions for שִׁמְעוּ and וּתְחִי נַפְשְׁכֶם
  rationale: “You may live” communicates the whole-person sense of נֶפֶשׁ without suggesting only an immaterial soul.
- pob_phrase: and I will make with you an everlasting covenant
  simplified_phrase: I will make an everlasting covenant with you
  preserved_meaning: God promises a permanent covenant with the hearers.
  reasoning_layer_used: Lexical decisions for כרת ברית and בְּרִית עוֹלָם
  rationale: Natural English word order makes the promise easier to follow.
