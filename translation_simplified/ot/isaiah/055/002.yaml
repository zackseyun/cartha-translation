translation:
  language: en
  text: Why do you weigh out silver[a] for what is not bread? Why labor for what does not satisfy? Listen closely to me. Eat what is good, and let your soul delight in abundance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In ancient times, people often paid by weighing out silver.
    reason: cultural_note
simplification_decisions:
- pob_phrase: weigh out silver for what is not bread
  simplified_phrase: weigh out silver[a] for what is not bread
  preserved_meaning: The ancient payment image and the contrast with true nourishment remain intact.
  reasoning_layer_used: POB lexical decisions for תִשְׁקְלוּ, כֶסֶף, and בְּלוֹא לֶחֶם
  rationale: A brief note explains the unfamiliar payment practice without removing the Hebrew image.
- pob_phrase: and your labor for what does not satisfy
  simplified_phrase: Why labor for what does not satisfy?
  preserved_meaning: Human effort is spent pursuing something that cannot bring fullness.
  reasoning_layer_used: POB lexical decisions for יְגִיעֲכֶם and לְשָׂבְעָה
  rationale: A direct question restores the implied action in natural English while retaining labor rather than narrowing it to earnings.
- pob_phrase: Listen carefully to me, and eat what is good, and let your soul delight itself in richness
  simplified_phrase: Listen closely to me. Eat what is good, and let your soul delight in abundance.
  preserved_meaning: The emphatic call, food imagery, inner-person focus, and promise of rich provision are preserved.
  reasoning_layer_used: POB lexical and theological decisions for שִׁמְעוּ שָׁמוֹעַ, וְאִכְלוּ טוֹב, נַפְשְׁכֶם, and בַּדֶּשֶׁן
  rationale: Shorter sentences and common wording make the invitation clear without explicitly spiritualizing it.
translation_notes:
  risk_flags:
  - risk: “Abundance” is less concrete than the Hebrew image of fatness or richness.
    mitigation: The surrounding bread, satisfaction, and eating language preserves the nourishment metaphor.
