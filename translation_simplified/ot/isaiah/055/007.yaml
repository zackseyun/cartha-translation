translation:
  language: en
  text: Let wicked people abandon the paths they follow, and let evil people abandon their sinful thoughts. Let them return to Yahweh,[a] and he will have compassion on them. Let them return to our God, for he forgives abundantly.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh is the divine name represented by YHWH in Hebrew.
    reason: source_note
