  reasoning_layer_used: POB lexical decisions for יַעֲזֹב, רָשָׁע, and דַּרְכּוֹ
  rationale: Plural generic wording is natural English, and “abandon” preserves the command’s moral force.
- pob_phrase: the man of iniquity
