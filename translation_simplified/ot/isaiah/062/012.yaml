simplification_decisions:
- pob_phrase: And they will call them
  simplified_phrase: People will call them
  preserved_meaning: An unspecified group will give the people these honored names.
  reasoning_layer_used: Lexical rationale for וְקָרְאוּ
  rationale: “People” clarifies the indefinite subject without making the clause passive.
- pob_phrase: the redeemed of Yahweh
  simplified_phrase: those Yahweh has redeemed
  preserved_meaning: Yahweh rescued these people, and they now bear the result of his action.
  reasoning_layer_used: Lexical and theological decisions for גְּאוּלֵי יְהוָה
  rationale: The active clause explains “redeemed” while retaining Yahweh’s covenant name.
- pob_phrase: Sought Out, a city not forsaken
  simplified_phrase: Sought After, a city that is not abandoned
  preserved_meaning: Both expressions form the restored city’s newly bestowed description.
  reasoning_layer_used: Lexical rationales for דְרוּשָׁה and עִיר לֹא נֶעֱזָבָה
  rationale: Familiar wording preserves the paired designation by keeping the whole phrase inside the quotation.
translation_notes:
  risk_flags:
  - risk: “Sought After” may imply desirability more strongly than the broader Hebrew verb requires.
    mitigation: The footnote preserves “Sought Out” and “Inquired For” as alternatives.
  - risk: “Abandoned” weakens Isaiah’s thematic echo of “forsaken.”
    mitigation: It still preserves the central contrast between former rejection and restored status.
