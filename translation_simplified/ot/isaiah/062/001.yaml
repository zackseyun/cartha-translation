translation:
  language: en
  text: For Zion’s sake, I will not keep silent;[a] for Jerusalem’s sake, I will not be quiet,[b] until her righteousness[c] shines out like a bright light and her salvation burns like a torch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The speaker is not identified here; this may be the prophet, the LORD, or another representative voice.
    reason: alternative_reading
  - marker: b
    text: “I will not be quiet” may also be translated “I will not rest” or “I will not remain still.”
    reason: lexical_alternative
  - marker: c
    text: “Righteousness” may also include the sense of public vindication.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and for Jerusalem’s sake I will not be quiet
  simplified_phrase: for Jerusalem’s sake, I will not be quiet
  preserved_meaning: The speaker will not cease speaking or acting for Jerusalem.
  reasoning_layer_used: POB lexical decision for אֶשְׁקֹט and grounding review
  rationale: “Be quiet” preserves the parallel with keeping silent without overemphasizing physical inactivity.
- pob_phrase: until her righteousness goes out like brightness
  simplified_phrase: until her righteousness shines out like a bright light
  preserved_meaning: Zion’s righteousness will become publicly visible with radiant brightness.
  reasoning_layer_used: POB lexical decisions for יֵצֵא and כַנֹּגַהּ
  rationale: “Shines out” expresses the light image in clear, natural English without narrowing it to dawn.
translation_notes:
  risk_flags:
  - risk: “Shines out” is more explicit than the source verb “goes out.”
    mitigation: The immediate comparison with brightness directly supports the shining sense.
  - risk: Readers may assume that the speaker is the LORD or the prophet.
    mitigation: Footnote [a] preserves the verse’s unresolved speaker ambiguity.
