translation:
  language: en
  text: For just as a young man marries a virgin, so your sons[a] will marry you as their bride. Just as a bridegroom rejoices over his bride, your God will rejoice over you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some ancient versions and many interpreters read “your builder” or “your builders” instead of “your sons.”
    reason: alternative_reading
