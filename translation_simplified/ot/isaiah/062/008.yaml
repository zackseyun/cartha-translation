translation:
  language: en
  text: 'Yahweh has sworn by his right hand and his strong arm: “I will never again hand over your grain for your enemies to eat. Foreigners will not drink the new wine you worked to produce.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: give your grain as food for your enemies
  simplified_phrase: hand over your grain for your enemies to eat
  preserved_meaning: Yahweh promises that the people's enemies will no longer consume their grain.
  reasoning_layer_used: Lexical decisions for מַאֲכָל and לְאֹיְבַיִךְ
  rationale: The active wording states the same outcome in more direct everyday English.
- pob_phrase: your new wine for which you have labored
  simplified_phrase: the new wine you worked to produce
  preserved_meaning: Foreigners will not consume the wine produced through the people's labor.
  reasoning_layer_used: Lexical decision for אֲשֶׁר יָגַעַתְּ בּוֹ
  rationale: This wording makes the connection between labor and the wine immediately clear.
- pob_phrase: I will never again ... nor will
  simplified_phrase: I will never again ... Foreigners will not
  preserved_meaning: Both clauses carry the strong negative force of Yahweh's oath.
  reasoning_layer_used: Theological decision on the implicit negation in the Hebrew oath formula
  rationale: Two sentences improve readability without weakening the solemn promise.
