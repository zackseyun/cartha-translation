translation:
  language: en
  text: 'See! Yahweh has announced this to the farthest part of the earth: Tell Daughter Zion[a], “See, your salvation[b] is coming! See, his reward is with him, and his payment is before him.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Daughter Zion” pictures the city and its people as a woman.
    reason: cultural_note
  - marker: b
    text: Or “your savior.” Hebrew says “your salvation,” but the following lines speak of this salvation as “he.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Behold
  simplified_phrase: See!
  preserved_meaning: The repeated call demands attention to Yahweh’s announcement.
  reasoning_layer_used: Lexical decision for הִנֵּה
  rationale: “See!” keeps the emphatic poetic force in familiar English.
- pob_phrase: to the end of the earth
  simplified_phrase: to the farthest part of the earth
  preserved_meaning: Yahweh’s public announcement reaches the earth’s remote boundary.
  reasoning_layer_used: Lexical decision for אֶל קְצֵה הָאָרֶץ
  rationale: The clearer wording preserves the Hebrew singular image.
- pob_phrase: his recompense before him
  simplified_phrase: his payment is before him
  preserved_meaning: His due return is pictured before him in parallel with his reward being with him.
  reasoning_layer_used: Lexical decisions for וּפְעֻלָּתוֹ and לְפָנָיו
  rationale: “Payment” replaces an uncommon term without adding a giver, recipient, or motion.
translation_notes:
  risk_flags:
  - risk: Readers may understand “salvation” as impersonal despite the masculine pronouns.
    mitigation: The footnote preserves “your savior” as an alternative without overruling the Hebrew noun.
  - risk: “Payment” can suggest ordinary wages rather than the broader idea of due return.
    mitigation: The possessive wording and spatial parallel preserve the source image without over-explaining it.
