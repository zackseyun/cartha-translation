translation:
  language: en
  text: Keep appealing to the LORD, and give him no rest until he firmly establishes Jerusalem and makes it praised throughout the earth.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “give him no silence”; the Hebrew pictures people appealing to the LORD without stopping.
    reason: lexical_alternative
  - marker: b
    text: Or “throughout the land”; the Hebrew word can mean either “earth” or “land.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and give him no rest
  simplified_phrase: Keep appealing to the LORD, and give him no rest
  preserved_meaning: The watchmen must continue petitioning the LORD without ceasing.
  reasoning_layer_used: The immediate context and theological decision identify “him” as the LORD and explain the idiom as unceasing appeal.
  rationale: Naming the LORD and stating the action makes the image immediately clear while retaining “give him no rest.”
- pob_phrase: until he establishes
  simplified_phrase: until he firmly establishes
  preserved_meaning: The LORD will set Jerusalem firmly in place.
  reasoning_layer_used: The lexical rationale says the Hebrew verb carries the sense of establishing or making firm.
  rationale: “Firmly” brings out the verb’s force in common English.
- pob_phrase: makes Jerusalem a praise in the earth
  simplified_phrase: makes it praised throughout the earth
  preserved_meaning: Jerusalem will become renowned and praised across the earth.
  reasoning_layer_used: The lexical decisions preserve Jerusalem as something praised and favor the worldwide sense of “earth.”
  rationale: The active English wording communicates the metaphor naturally without the awkward phrase “a praise.”
interpretive_expansions:
- pob_phrase: give him no rest
  rendering: Keep appealing to the LORD, and give him no rest
  claim: The command means to continue petitioning the LORD without stopping.
  evidence:
  - Isaiah 62:6 identifies the addressee as those who remind the LORD.
  - The POB lexical rationale explains the expression as keeping up an appeal to him.
  confidence: high
  alternatives_preserved:
  - give him no silence
translation_notes:
  risk_flags:
  - risk: “Firmly” makes the establishing sense more explicit than the POB main text.
    mitigation: The POB lexical rationale directly includes “making firm” as part of the Hebrew verb’s sense.
  - risk: “Throughout the earth” selects the broader sense of the ambiguous Hebrew word.
    mitigation: The land alternative remains in a footnote, following the POB audit.
