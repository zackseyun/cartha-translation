translation:
  language: en
  text: Jerusalem, I have stationed watchmen on your walls. They will never be silent, day or night. You who keep reminding Yahweh,[a] give yourselves no rest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “call on Yahweh” or “put Yahweh in remembrance.” The vivid Hebrew expression describes persistent appeal to God.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: On your walls, Jerusalem, I have appointed watchmen
  simplified_phrase: Jerusalem, I have stationed watchmen on your walls
  preserved_meaning: The speaker deliberately places watchmen on Jerusalem’s city walls.
  reasoning_layer_used: Lexical decisions for הִפְקַדְתִּי and שֹׁמְרִים
  rationale: “Stationed” makes the wall-watch image immediate while retaining deliberate assignment.
- pob_phrase: all day and all night, continually, they will never be silent
  simplified_phrase: They will never be silent, day or night
  preserved_meaning: Their activity continues without interruption.
  reasoning_layer_used: Lexical decision for the intensified duration phrase
  rationale: The shorter English form naturally conveys unbroken duration without losing the Hebrew emphasis.
- pob_phrase: take no rest for yourselves
  simplified_phrase: give yourselves no rest
  preserved_meaning: Those appealing to Yahweh must not become quiet or inactive.
  reasoning_layer_used: Lexical decision for אַל דֳּמִי לָכֶם
  rationale: The direct command is more natural in modern English and retains the call to persistence.
