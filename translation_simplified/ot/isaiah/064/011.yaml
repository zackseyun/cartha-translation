simplification_decisions:
- pob_phrase: Will you restrain yourself over these things
  simplified_phrase: will you still hold yourself back in the face of all this
  preserved_meaning: The speaker asks whether Yahweh will continue withholding action amid the devastation.
  reasoning_layer_used: lexical decision and immediate context
  rationale: This preserves the circumstantial force of “over these things” in natural English.
- pob_phrase: Will you keep silent
  simplified_phrase: Will you remain silent
  preserved_meaning: Yahweh is asked whether he will continue without responding.
  reasoning_layer_used: lexical decision
  rationale: “Remain silent” clearly conveys continued silence.
- pob_phrase: afflict us so very severely
  simplified_phrase: afflict us so severely
  preserved_meaning: The people describe their suffering as extreme and attribute the affliction to Yahweh.
  reasoning_layer_used: lexical decision
  rationale: The streamlined intensifier preserves the extreme degree in natural English.
