translation:
  language: en
  text: Yahweh, will you still hold yourself back in the face of all this? Will you remain silent and afflict us so severely?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “humble us so greatly.” The Hebrew verb can mean either afflict or humble.
