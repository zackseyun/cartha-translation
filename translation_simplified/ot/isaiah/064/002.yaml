translation:
  language: en
  text: When you did awe-inspiring things beyond what we expected, you came down. The mountains flowed down before you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew pictures the mountains flowing or dissolving; it may also be understood as “melted” or “quaked” at your presence.
