  preserved_meaning: The whole people collectively are what Yahweh has made.
  reasoning_layer_used: Lexical decisions on וּמַעֲשֵׂה יָדְךָ and כֻּלָּנוּ.
  rationale: “All of us” preserves the collective emphasis in natural modern English.
