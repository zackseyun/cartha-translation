simplification_decisions:
- pob_phrase: But now, O Yahweh, you are our Father;
  simplified_phrase: But now, Yahweh, you are our Father.
  preserved_meaning: The prayer turns to a renewed appeal based on Yahweh’s relationship as Father.
  reasoning_layer_used: Lexical and theological decisions on וְעַתָּה, יְהוָה, and אָבִינוּ.
  rationale: Removing the dated vocative “O” and ending the sentence makes the direct address easier to read.
- pob_phrase: we are the clay, and you are our potter;
  simplified_phrase: You are our potter, and we are the clay you shape.
  preserved_meaning: Yahweh is the potter who forms his people as clay.
  reasoning_layer_used: Lexical decisions on חֹמֶר and יֹצְרֵנוּ.
  rationale: Reordering the clauses and stating what a potter does clarifies the metaphor without flattening it.
- pob_phrase: we all are the work of your hand
