translation:
  language: en
  text: No one calls on your name or rouses himself to take hold of you, because you have hidden your face from us and handed us over to the power of our own iniquity.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “you have melted us in the hand of our iniquity.” The Hebrew pictures the people dissolving or wasting away under their sin’s power.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And there is no one who calls on your name
  simplified_phrase: No one calls on your name
  preserved_meaning: There is a total absence of people invoking God in prayer.
  reasoning_layer_used: Lexical decision for וְאֵין and קוֹרֵא בְשִׁמְךָ
  rationale: The shorter wording keeps the established biblical prayer idiom.
- pob_phrase: who stirs himself up to take hold of you
  simplified_phrase: or rouses himself to take hold of you
  preserved_meaning: No one actively moves himself to seek and hold fast to God.
  reasoning_layer_used: Lexical decisions for מִתְעוֹרֵר and לְהַחֲזִיק בָּךְ
  rationale: “Rouses himself” is clearer while retaining both the reflexive action and the grasping image.
- pob_phrase: have given us over into the hand of our iniquity
  simplified_phrase: handed us over to the power of our own iniquity
  preserved_meaning: God judges the people by giving them over to the controlling power of their own sin.
  reasoning_layer_used: Lexical and theological decisions for וַתְּמוּגֵנוּ בְּיַד עֲוֺנֵנוּ
  rationale: The wording explains the hand idiom without resolving the tension between divine judgment and human guilt.
