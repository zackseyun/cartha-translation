- pob_phrase: We all became like one who is unclean
  simplified_phrase: Every one of us has become like someone unclean
  preserved_meaning: The whole community entered a condition pictured as personal uncleanness.
  reasoning_layer_used: POB lexical and theological decisions on וַנְּהִי and כַטָּמֵא
  rationale: The wording is more natural while keeping the impurity image broad rather than purely ritual or moral.
- pob_phrase: all our righteous deeds are like a filthy garment
  simplified_phrase: All our righteous acts are like filthy clothing
  preserved_meaning: Even their concrete acts of righteousness are pictured as defiled clothing.
  reasoning_layer_used: POB lexical decisions on צִדְקֹתֵינוּ and בֶגֶד עִדִּים
  rationale: “Acts” and “clothing” are common words that preserve both the concrete deeds and the defiling image.
- pob_phrase: we all wither like a leaf, and our iniquities carry us away like the wind
  simplified_phrase: We all wither like a leaf. Our iniquities carry us away as wind carries a leaf.
  preserved_meaning: The people decay like a leaf and are helplessly removed by their iniquities as by wind.
  reasoning_layer_used: POB lexical decisions on נבל, עָוֹן, רוּחַ, and נשא
  rationale: Two short sentences clarify how the wind image works without weakening its force.
