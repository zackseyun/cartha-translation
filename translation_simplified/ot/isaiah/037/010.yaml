translation:
  language: en
  text: 'Tell Hezekiah king of Judah: “Do not let your God, whom you trust, deceive you[a] by telling you, ‘Jerusalem will not fall into the hands of the king of Assyria.’”'
  philosophy: optimal-equivalence
  footnotes:
