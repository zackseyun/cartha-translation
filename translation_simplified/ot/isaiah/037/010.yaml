simplification_decisions:
- pob_phrase: Thus you shall say to Hezekiah king of Judah
  simplified_phrase: Tell Hezekiah king of Judah
  preserved_meaning: The messengers are commanded to deliver this message directly to Hezekiah.
  reasoning_layer_used: Lexical decisions for כֹּה and תֹאמְרוּן
  rationale: The direct imperative expresses the formal messenger instruction in ordinary English.
- pob_phrase: deceive you, saying
  simplified_phrase: deceive you by telling you
  preserved_meaning: The taunt claims that God's assurance is the means of deceiving Hezekiah.
  reasoning_layer_used: Lexical decision for the second לֵאמֹר and theological decision on the Assyrian taunt
  rationale: This wording makes the relationship between the accusation and the quoted assurance easy to follow.
- pob_phrase: will not be given into the hand of the king of Assyria
  simplified_phrase: will not fall into the hands of the king of Assyria
  preserved_meaning: Jerusalem will not come under the Assyrian king's power.
  reasoning_layer_used: Lexical decisions for לֹא תִנָּתֵן and בְּיַד
  rationale: The familiar English idiom preserves both the transfer of power and the Hebrew hand image.
translation_notes:
  risk_flags:
  - risk: The accusation could be mistaken for the narrator's judgment about God.
    mitigation: The opening messenger formula and nested quotation keep it clearly within the hostile Assyrian message.
