translation:
  language: en
  text: The Rabshakeh[a] was sent by his master, the king of Assyria, to insult the living God. Perhaps Yahweh your God will hear his words and rebuke them. So lift up a prayer for the remnant who are still present.[b]
  philosophy: optimal-equivalence
  footnotes:
