translation:
  language: en
  text: The people who lived there were powerless. They were shattered[a] and put to shame. They were like grass in a field, like fresh green growth, like grass on rooftops, and like a field before its crop has grown.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “dismayed.” The Hebrew can describe inward dismay as well as being broken or shattered.
    reason: lexical_alternative
  - marker: b
    text: The final image is difficult; it probably describes a field ruined before the crop matures.
    reason: lexical_alternative
