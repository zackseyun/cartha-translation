translation:
  language: en
  text: They said to him, “Hezekiah says, ‘Today is a day of distress, rebuke, and disgrace.[a] The babies are ready to be born, but there is no strength to give birth to them.[b]’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a day of distress, reproof, and contempt.”
    reason: lexical_alternative
  - marker: b
    text: This childbirth picture describes a crisis that has reached its decisive moment when no strength remains.
    reason: simplification_note
