translation:
  language: en
  text: For some of the people who remain will leave Jerusalem, and survivors will come from Mount Zion. The zeal of Yahweh of hosts will make this happen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “zeal” can also mean “jealousy.” Here it describes Yahweh’s intense commitment to fulfill his promise.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a remnant will go out
  simplified_phrase: some of the people who remain will leave
  preserved_meaning: Some people left after judgment will depart from Jerusalem.
  reasoning_layer_used: Lexical decision for שְׁאֵרִית and יצא
  rationale: This explains the unfamiliar prophetic term and expresses movement from the city naturally.
- pob_phrase: and survivors from Mount Zion
  simplified_phrase: and survivors will come from Mount Zion
  preserved_meaning: Survivors will emerge from Mount Zion.
  reasoning_layer_used: Lexical decision for פְלֵיטָה and Hebrew parallelism
  rationale: Supplying the verb makes the parallel clause complete in natural English.
- pob_phrase: The zeal of Yahweh of hosts will do this
  simplified_phrase: The zeal of Yahweh of hosts will make this happen
  preserved_meaning: Yahweh’s intense covenant commitment will accomplish the promise.
  reasoning_layer_used: Lexical and theological decisions for קִנְאַת and the divine title
  rationale: The wording clarifies the result while preserving zeal as the effective agency.
translation_notes:
  risk_flags:
  - risk: “Some of the people who remain” may sound less like a fixed prophetic term than “remnant.”
    mitigation: The wording directly conveys the audited sense of people left after judgment.
  - risk: “Zeal” can obscure the Hebrew word’s possible sense of jealousy.
    mitigation: The footnote preserves the lexical alternative and explains its contextual force.
