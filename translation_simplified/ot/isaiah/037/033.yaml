translation:
  language: en
  text: 'Therefore, this is what Yahweh says about the king of Assyria: “He will not enter this city. He will not shoot an arrow there, advance against it with a shield, or build a siege ramp against it.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Therefore thus says Yahweh concerning
  simplified_phrase: Therefore, this is what Yahweh says about
  preserved_meaning: The wording keeps both the logical connection and the prophetic announcement formula.
  reasoning_layer_used: POB lexical decisions for לָכֵן, כֹּה אָמַר, and אֶל מֶלֶךְ אַשּׁוּר
  rationale: Common phrasing makes the formal introduction immediately understandable.
- pob_phrase: He will not come into this city
  simplified_phrase: He will not enter this city
  preserved_meaning: The Assyrian king and his invading power will not get inside the city.
  reasoning_layer_used: POB lexical decision for לֹא יָבוֹא אֶל הָעִיר הַזֹּאת
  rationale: “Enter” states the same movement more directly.
- pob_phrase: come before it with a shield, or heap up a siege ramp against it
  simplified_phrase: advance against it with a shield, or build a siege ramp against it
  preserved_meaning: 'The two distinct siege preparations remain: a shielded advance and construction of an assault ramp.'
  reasoning_layer_used: POB lexical decisions for יְקַדְּמֶנָּה מָגֵן and יִשְׁפֹּךְ עֳלֶיהָ סֹלְלָה
  rationale: Modern military verbs clarify both images without removing either one.
translation_notes:
