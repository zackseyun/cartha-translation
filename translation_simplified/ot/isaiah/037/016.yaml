translation:
  language: en
  text: Yahweh of the heavenly forces, God of Israel, you sit enthroned above the cherubim.[a][b] You alone are God over every kingdom on earth. You made the heavens and the earth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “you dwell between the cherubim” or “you sit enthroned upon the cherubim.”
    reason: lexical_alternative
  - marker: b
    text: The cherubim were associated with Yahweh’s royal presence at the ark and temple.
    reason: cultural_note
simplification_decisions:
- pob_phrase: O Yahweh of hosts
  simplified_phrase: Yahweh of the heavenly forces
  preserved_meaning: Yahweh is identified with the broad host of heavenly powers.
  reasoning_layer_used: POB lexical decision for צְבָאוֹת
  rationale: “Heavenly forces” makes the traditional but opaque word “hosts” understandable without limiting it to human armies.
- pob_phrase: enthroned above the cherubim
  simplified_phrase: you sit enthroned above the cherubim
  preserved_meaning: Yahweh is pictured as king in the royal presence associated with the cherubim.
  reasoning_layer_used: POB lexical rationale for יֹשֵׁב הַכְּרֻבִים
  rationale: The finite clause makes the prayer easier to follow while retaining the throne image.
- pob_phrase: over all the kingdoms of the earth
  simplified_phrase: over every kingdom on earth
  preserved_meaning: Yahweh alone is God with sovereignty over all earthly kingdoms.
  reasoning_layer_used: POB lexical and theological decisions on divine exclusivity and sovereignty
  rationale: The singular distributive wording is more natural while preserving universal scope.
translation_notes:
  risk_flags:
  - risk: “Heavenly forces” may sound less familiar than the traditional title “Yahweh of hosts.”
    mitigation: The wording preserves the POB rationale’s broad heavenly sense rather than narrowing it to armies alone.
  - risk: The location implied by the cherubim expression remains open to more than one reading.
    mitigation: Footnote a preserves the documented alternatives without changing the main POB choice.
