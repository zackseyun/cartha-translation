  text: You have used your servants to mock the Lord. You have boasted, “With my many chariots, I myself have climbed the mountain heights and reached the most remote parts of Lebanon. I will cut down its tall cedars and its finest cypress trees.[a] I will enter its farthest height, its fruitful forest.”
