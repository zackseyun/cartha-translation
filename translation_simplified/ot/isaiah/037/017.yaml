simplification_decisions:
- pob_phrase: Incline your ear, O LORD, and hear
  simplified_phrase: LORD, turn your ear and listen
  preserved_meaning: The prayer urgently asks the LORD to pay attention while retaining the bodily image of the ear.
  reasoning_layer_used: POB text and Hebrew source image
  rationale: “Turn your ear” is clearer modern English than “incline your ear” without removing the image.
- pob_phrase: open your eyes, O LORD, and see
  simplified_phrase: Open your eyes and see
  preserved_meaning: The speaker asks the LORD to take notice of the threat.
  reasoning_layer_used: POB text and immediate parallel structure
  rationale: Removing the repeated address makes the short prayer flow naturally while keeping the distinct command.
- pob_phrase: all the words of Sennacherib, which he has sent
  simplified_phrase: all the words Sennacherib has sent
  preserved_meaning: Sennacherib sent a message whose words insult the living God.
  reasoning_layer_used: POB text and applied revision
  rationale: The relative clause is recast in ordinary English while preserving the approved phrase “to mock.”
