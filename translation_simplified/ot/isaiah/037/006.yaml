translation:
  language: en
  text: 'Isaiah told them, “Tell your master, ‘This is what Yahweh says: Do not let the words you heard make you afraid. The servants of the king of Assyria used those words to blaspheme me.[a]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “insult me” or “defy me.” The Hebrew refers to abusive or contemptuous speech against God.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And Isaiah said to them, “Thus you shall say to your master”
  simplified_phrase: Isaiah told them, “Tell your master”
  preserved_meaning: Isaiah instructs the messengers what to report to their human ruler.
  reasoning_layer_used: Lexical decisions for the narrative verb, audience, messenger formula, and “master.”
  rationale: The direct command replaces a formal formula while preserving the messenger relationship.
- pob_phrase: Thus says Yahweh
  simplified_phrase: This is what Yahweh says
  preserved_meaning: The message that follows comes from Yahweh himself.
  reasoning_layer_used: Lexical and theological decisions for the prophetic formula and divine name.
  rationale: The modern formula remains solemn and retains the covenant name Yahweh.
- pob_phrase: Do not be afraid because of the words that you have heard, with which the servants ... have blasphemed me
  simplified_phrase: Do not let the words you heard make you afraid. The servants ... used those words to blaspheme me.
  preserved_meaning: The Assyrian servants’ abusive words are the occasion for fear and are directed against Yahweh.
  reasoning_layer_used: Lexical and theological decisions for “because of,” “words,” “servants,” and “blasphemed me.”
  rationale: Two short sentences clarify the relationship between the threat and the offense against God.
translation_notes:
  risk_flags:
  - risk: “Blaspheme” may sound narrower than the Hebrew’s abusive and defiant sense.
    mitigation: The footnote preserves the broader alternatives “insult” and “defy.”
