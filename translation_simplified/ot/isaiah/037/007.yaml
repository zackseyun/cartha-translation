translation:
  language: en
  text: Look! I am putting a spirit[a] in him, so he will hear a report[b] and return to his own land. Then I will cause him to be killed by the sword in his own land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “an inward impulse” or “a disposition”; the Hebrew does not specify the exact kind of influence.
    reason: lexical_alternative
  - marker: b
    text: Or “news” or “a rumor”; the Hebrew does not say whether the information is confirmed.
    reason: lexical_alternative
