  reasoning_layer_used: Lexical decision for הִנְנִי
  rationale: “Look!” keeps the attention-getting force in familiar English.
- pob_phrase: so that he will hear a report and return to his own land
  simplified_phrase: so he will hear a report and return to his own land
  preserved_meaning: God’s action results in the king hearing the report and returning home.
  reasoning_layer_used: Lexical decision for the Hebrew event sequence
  rationale: “So” states the consequential link in direct, natural English.
- pob_phrase: I will cause him to fall by the sword
  simplified_phrase: I will cause him to be killed by the sword
  preserved_meaning: God will bring about the king’s violent death by the sword.
  reasoning_layer_used: Lexical decisions for the causative form of נפל and the sword idiom
  rationale: The wording makes the fatal result clear while preserving divine agency and the sword image.
