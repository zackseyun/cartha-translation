    mitigation: Footnote a preserves the lexical alternative while following the POB’s contextual choice.
  - risk: Naming Yahweh as the destroyer follows the POB decision but resolves a grammatical ambiguity.
    mitigation: Footnote b preserves the possible reading in which the coming day is the subject.
