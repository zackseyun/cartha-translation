translation:
  language: en
  text: See, the day of Yahweh is coming—a cruel day, full of wrath and fierce anger—to make the earth desolate. Yahweh will destroy the sinners who live on it.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “earth” can also mean “land.”
    reason: lexical_alternative
  - marker: b
    text: The final sentence could instead mean that the day of Yahweh will destroy the earth’s sinners.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Behold
  simplified_phrase: See
  preserved_meaning: The word calls attention to a solemn prophetic announcement.
  reasoning_layer_used: POB lexical decision for הִנֵּה
  rationale: “See” gives the announcement familiar wording without making it casual.
- pob_phrase: is coming—cruel, with wrath and fierce anger
  simplified_phrase: is coming—a cruel day, full of wrath and fierce anger
  preserved_meaning: The coming day is unsparing and marked by multiple expressions of divine anger.
  reasoning_layer_used: POB lexical decisions for אַכְזָרִי, עֶבְרָה, and חֲרוֹן אָף
  rationale: Repeating “day” clarifies what is cruel while retaining the piled-up anger terms.
- pob_phrase: to make the earth a desolation, and he will destroy its sinners from it
  simplified_phrase: to make the earth desolate. Yahweh will destroy the sinners who live on it
  preserved_meaning: The coming day will devastate the earth, and Yahweh will destroy its sinful inhabitants.
  reasoning_layer_used: POB lexical decisions and theological decision on the subject of יַשְׁמִיד
  rationale: Two direct clauses clarify the actions while keeping the day linked to desolation and Yahweh linked to destruction.
translation_notes:
  risk_flags:
