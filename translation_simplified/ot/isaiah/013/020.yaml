translation:
  language: en
  text: No one will ever live there. Generation after generation, no one will make a home there. No Arab[a] will pitch a tent there, and no shepherd will make his flock rest there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “desert nomad.” The Hebrew word can mean an Arab specifically or, in this context, a nomadic desert-dweller.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: It will never be inhabited
  simplified_phrase: No one will ever live there
  preserved_meaning: The city will remain permanently without inhabitants.
  reasoning_layer_used: Lexical decisions for תֵשֵׁב and לָנֶצַח
  rationale: Active wording makes the permanent desolation immediately clear.
- pob_phrase: it will not be dwelt in from generation to generation
  simplified_phrase: Generation after generation, no one will make a home there
  preserved_meaning: Successive generations will not settle in the city.
  reasoning_layer_used: Lexical decisions for תִשְׁכֹּן and עַד דּוֹר וָדוֹר
  rationale: Ordinary wording preserves both ongoing duration and the repeated idea of dwelling.
- pob_phrase: shepherds will not make their flocks lie down there
  simplified_phrase: no shepherd will make his flock rest there
  preserved_meaning: Shepherds will not cause their animals to lie down and rest there.
  reasoning_layer_used: Lexical decision for יַרְבִּצוּ
  rationale: The revision is idiomatic while retaining the Hebrew verb’s causative pastoral action.
translation_notes:
  risk_flags:
