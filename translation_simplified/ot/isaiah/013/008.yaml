translation:
  language: en
  text: They will be shaken with alarm. Pain and labor pangs will grip them, and they will writhe like a woman giving birth. Each man will stare in shock at his neighbor. Their faces will look like flames.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “their faces will be aflame.” The Hebrew literally says, “their faces are faces of flames,” which may describe their color or terror showing on their faces.
    reason: lexical_alternative
