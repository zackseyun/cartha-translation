translation:
  language: en
  text: But desert animals will rest there, and owls[a] will fill the houses. Ostriches will live there, and wild goats[b] will dance there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The uncertain Hebrew word may instead mean “howling creatures” or “jackals.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also mean “goat-demons” or “satyrs.”
    reason: alternative_reading
