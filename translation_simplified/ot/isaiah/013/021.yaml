- pob_phrase: desert creatures will lie down there
  simplified_phrase: desert animals will rest there
  preserved_meaning: Desert wildlife will settle in the desolate place.
  reasoning_layer_used: The lexical decision identifies unspecified creatures of arid places and an animal resting there.
  rationale: “Desert animals” and “rest” use familiar language while keeping the scene of animals occupying the site.
- pob_phrase: their houses will be full of owls
  simplified_phrase: owls will fill the houses
  preserved_meaning: The abandoned houses will become occupied by owls.
  reasoning_layer_used: The lexical rationale treats the houses as those of the city or its inhabitants.
  rationale: The active wording is easier to read without changing who occupies the houses.
- pob_phrase: ostriches will dwell there
  simplified_phrase: ostriches will live there
  preserved_meaning: Ostriches will inhabit the ruined place.
  reasoning_layer_used: The lexical decision lists “will live” as a natural equivalent of “will dwell.”
  rationale: “Live” replaces the less common biblical word “dwell.”
