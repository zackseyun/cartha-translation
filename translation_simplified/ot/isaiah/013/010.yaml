translation:
  language: en
  text: For the stars in the sky and their constellations[a] will give no light. The sun is darkened as it rises, and the moon will not make its light shine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may refer specifically to Orion, but here it may mean constellations more generally.
    reason: lexical_alternative
