  preserved_meaning: The stars are pictured as part of the darkened heavens.
  reasoning_layer_used: POB lexical decision for כוֹכְבֵי הַשָּׁמַיִם
  rationale: “In the sky” expresses the same image in ordinary modern English.
- pob_phrase: will not give their light
  simplified_phrase: will give no light
  preserved_meaning: The stars and constellations cease to provide light.
  reasoning_layer_used: POB lexical decision for לֹא יָהֵלּוּ אוֹרָם
  rationale: The shorter negative construction is clearer without weakening the image.
- pob_phrase: the sun is darkened at its rising
  simplified_phrase: The sun is darkened as it rises
  preserved_meaning: The sun becomes dark at sunrise in the prophetic scene.
  reasoning_layer_used: POB lexical decision and doctrine-realignment revision for חָשַׁךְ and בְּצֵאתוֹ
  rationale: “As it rises” replaces the formal phrase while retaining the vivid prophetic present.
