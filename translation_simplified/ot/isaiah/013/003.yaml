  text: I myself have commanded those I set apart for my purpose. I have also summoned my warriors to carry out my anger—those who exult in my majesty.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “those who exult in my triumph”; the Hebrew may also mean “my proudly exulting ones.”
