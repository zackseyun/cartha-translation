- pob_phrase: my consecrated ones
  simplified_phrase: those I set apart for my purpose
  preserved_meaning: God appointed these agents for his work without implying moral holiness.
  reasoning_layer_used: lexical and theological decisions
  rationale: Common wording makes the functional sense of consecration clear.
- pob_phrase: summoned my warriors for my anger
  simplified_phrase: summoned my warriors to carry out my anger
  preserved_meaning: God calls warriors to execute his judgment.
  reasoning_layer_used: lexical decision and immediate context
  rationale: The purpose clause explains their role without weakening divine anger.
- pob_phrase: my proudly exulting ones
  simplified_phrase: those who exult in my majesty
  preserved_meaning: The warriors exult in God's exaltation, while other possible nuances remain footnoted.
  reasoning_layer_used: lexical and theological decisions
  rationale: This clear reading preserves the first-person reference that “proudly” obscured.
