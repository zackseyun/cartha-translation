translation:
  language: en
  text: I will punish the world[a] for its evil and wicked people for their sins. I will put an end to the pride of the arrogant and humble the pride of the ruthless.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the inhabited world.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the wicked for their iniquity
  simplified_phrase: wicked people for their sins
  preserved_meaning: God punishes morally guilty people for their offenses.
  reasoning_layer_used: Lexical decisions for רְשָׁעִים and עֲוֺנָם
  rationale: “Wicked people” and “sins” state the same moral judgment in familiar English.
- pob_phrase: I will humble the haughtiness of the ruthless
  simplified_phrase: humble the pride of the ruthless
  preserved_meaning: God will bring the self-exaltation of ruthless oppressors low.
  reasoning_layer_used: Lexical decisions for גַאֲוַת, עָרִיצִים, and אַשְׁפִּיל
  rationale: “Pride” avoids the less familiar “haughtiness” while keeping pride as the direct object.
translation_notes:
  risk_flags:
  - risk: “Sins” may sound less weighty than “iniquity.”
    mitigation: “Evil,” “wicked,” and “punish” preserve the strong moral and judicial force.
  - risk: Repeating “pride” reduces the lexical distinction between the parallel Hebrew terms.
    mitigation: The repetition clearly preserves both distinct judgments and their parallel structure.
