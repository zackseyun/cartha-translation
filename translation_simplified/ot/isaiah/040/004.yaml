  preserved_meaning: The valley is elevated as part of the landscape transformation.
  reasoning_layer_used: Lexical decision for יִנָּשֵׂא
  rationale: “Raised” states the passive change in more common English.
- pob_phrase: will be made low
  simplified_phrase: will be lowered
  preserved_meaning: Mountains and hills are reduced in height.
  reasoning_layer_used: Lexical decision for יִשְׁפָּלוּ
  rationale: “Lowered” is concise and keeps the parallel with valleys being raised.
- pob_phrase: the uneven ground will become level, and the ridges a plain
  simplified_phrase: Uneven ground will become level, and the ridges will become a plain
  preserved_meaning: Both kinds of difficult terrain are transformed into flat ground.
  reasoning_layer_used: Lexical decisions for הֶעָקֹב, מִישׁוֹר, הָרְכָסִים, and בִקְעָה
  rationale: Repeating “will become” makes the poetic parallel immediately clear.
