translation:
  language: en
  text: Every valley will be raised, and every mountain and hill will be lowered. Uneven ground[a] will become level, and the ridges[b] will become a plain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the crooked ground”; the Hebrew can describe ground that is crooked or uneven.
    reason: lexical_alternative
  - marker: b
    text: Or “the rough places”; the rare Hebrew word may refer more generally to rugged terrain.
    reason: lexical_alternative
