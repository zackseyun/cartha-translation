simplification_decisions:
- pob_phrase: To whom, then, will you liken God
  simplified_phrase: Who, then, will you compare God to?
  preserved_meaning: The question challenges the hearer to name anyone comparable to God.
  reasoning_layer_used: POB lexical decisions for תְּדַמְּיוּן and אֵל
  rationale: “Compare” is more familiar than “liken” and preserves the rhetorical challenge.
- pob_phrase: what likeness will you compare to him?
  simplified_phrase: What likeness will you set beside him?
  preserved_meaning: The question asks what likeness anyone could place alongside God for comparison.
  reasoning_layer_used: POB lexical decisions for דְּמוּת, תַּעַרְכוּ, and לֽוֹ
  rationale: “Set beside” makes the comparison image clear without narrowing “likeness” to a crafted object.
translation_notes:
  risk_flags:
  - risk: “Set beside” may be heard as merely describing physical placement.
    mitigation: The parallel first question clearly establishes that the purpose is comparison.
