translation:
  language: en
  text: Go up on a high mountain, messenger of good news to Zion.[a] Raise your voice with strength, messenger of good news to Jerusalem. Raise it; do not be afraid. Tell the cities of Judah, “Look—your God!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Zion, messenger of good news, go up on a high mountain ... Jerusalem, messenger of good news, raise your voice.” The Hebrew may identify Zion and Jerusalem themselves as the messengers.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: bearer of good news to Zion
  simplified_phrase: messenger of good news to Zion
  preserved_meaning: A feminine herald is addressed as bringing good news associated with Zion.
  reasoning_layer_used: Lexical decision and theological ambiguity
  rationale: “Messenger” is more familiar, while the footnote preserves the possible personification of the cities.
- pob_phrase: lift up your voice with strength
  simplified_phrase: Raise your voice with strength
  preserved_meaning: The herald must proclaim the news forcefully.
  reasoning_layer_used: Lexical decisions for הָרִימִי and בַכֹּחַ
  rationale: “Raise your voice” is natural English, and omitting “all” avoids unsupported intensification.
- pob_phrase: Behold your God!
  simplified_phrase: Look—your God!
  preserved_meaning: The cities of Judah are commanded to direct their attention to their God.
  reasoning_layer_used: Lexical decision for הִנֵּה and theological decision for אֱלֹהֵיכֶם
  rationale: “Look” makes the attention-command clear while correctly retaining “God.”
translation_notes:
  risk_flags:
  - risk: “Messenger” may sound more definite than the Hebrew syntax allows.
    mitigation: The footnote preserves the reading in which Zion and Jerusalem are themselves addressed as heralds.
