    mitigation: The pronoun is retained because POB preserves the Hebrew’s implied divine subject without repeating God’s name.
  - risk: Replacing “stubble” could weaken the specific harvest image.
    mitigation: “Leftover stalks after harvest” states the same image, while the footnote retains the traditional term.
