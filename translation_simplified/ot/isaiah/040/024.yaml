translation:
  language: en
  text: They have only just been planted. They have only just been sown. Their stem has barely begun to take root in the ground. Then he only has to blow on them, and they wither. A storm carries them away like leftover stalks after harvest.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew image is stubble; “storm” may also be translated “whirlwind.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Scarcely are they planted, scarcely are they sown
  simplified_phrase: They have only just been planted. They have only just been sown.
  preserved_meaning: The repeated wording stresses how quickly their new rise is undone.
  reasoning_layer_used: POB lexical decision for אַף בַּל
  rationale: Short repeated sentences preserve the emphatic sequence in everyday English.
- pob_phrase: scarcely has their stem taken root in the earth
  simplified_phrase: Their stem has barely begun to take root in the ground.
  preserved_meaning: The plant has not had time to become established.
  reasoning_layer_used: POB lexical decisions for שֹׁרֵשׁ and גִּזְעָם
  rationale: “Begun” makes the incomplete rooting easier to picture without changing the metaphor.
- pob_phrase: a storm carries them away like stubble
  simplified_phrase: A storm carries them away like leftover stalks after harvest.
  preserved_meaning: The storm carries them off as easily as harvest stubble.
  reasoning_layer_used: POB lexical decisions for סְעָרָה, כַּקַּשׁ, and תִּשָּׂאֵם
  rationale: The concrete description explains the less familiar word “stubble” in the main text.
interpretive_expansions:
- pob_phrase: he merely blows on them
  rendering: he only has to blow on them
  claim: God removes them with effortless action.
  evidence:
  - The POB rationale says “merely” reflects the minimal action implied by the context.
  - Isaiah 40:23–24 presents God as the one who reduces rulers to nothing.
  confidence: high
  alternatives_preserved:
  - An impersonal wind is a possible grammatical reading, though not the POB choice.
translation_notes:
  risk_flags:
