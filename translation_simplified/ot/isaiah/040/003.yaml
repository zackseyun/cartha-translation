simplification_decisions:
- pob_phrase: A voice cries
  simplified_phrase: A voice calls out
  preserved_meaning: An unnamed herald makes a forceful public announcement.
  reasoning_layer_used: Lexical decision for קוֹרֵא
  rationale: “Calls out” is clearer common English while retaining the herald’s force.
- pob_phrase: prepare the way of Yahweh
  simplified_phrase: prepare a road for Yahweh
  preserved_meaning: The people must prepare a route for Yahweh’s coming.
  reasoning_layer_used: Lexical decisions for פַּנּוּ and דֶּרֶךְ
  rationale: “Road” makes the route-building image immediately clear and matches the parallel highway.
- pob_phrase: prepare ...; make straight
  simplified_phrase: prepare .... Make a straight
  preserved_meaning: The two parallel commands remain distinct and equally forceful.
  reasoning_layer_used: POB syntax and lexical parallelism
  rationale: Two sentences make the commands easier to follow without merging them.
