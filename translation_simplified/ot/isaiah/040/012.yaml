translation:
  language: en
  text: Who has measured the waters in the hollow of his hand? Who has measured the heavens with the span of his hand and measured the dust of the earth in a measuring container?[a] Who has weighed the mountains on scales and the hills on a balance?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew refers to an ancient measuring container, possibly one holding a third of a larger unit; its exact size is uncertain.
    reason: lexical_alternative
