simplification_decisions:
- pob_phrase: To whom then will you compare me
  simplified_phrase: Who, then, will you compare me to?
  preserved_meaning: God directly challenges his hearers to name anyone comparable to him.
  reasoning_layer_used: Lexical decision for תְדַמְּיוּנִי and the theological decision on divine incomparability.
  rationale: The natural question form replaces formal preposition placement without weakening the comparison.
- pob_phrase: that I should be equal?
  simplified_phrase: Who is my equal?
  preserved_meaning: No proposed comparison can place anyone on God's level.
  reasoning_layer_used: Lexical decision for וְאֶשְׁוֶה and the rhetorical context.
  rationale: A second direct question makes the equality clause immediately clear.
- pob_phrase: says the Holy One
  simplified_phrase: The Holy One says
  preserved_meaning: The exact divine title identifies the speaker.
  reasoning_layer_used: Lexical and theological decisions for יֹאמַר קָדוֹשׁ.
  rationale: Moving the speech label to the front gives natural English dialogue while retaining the title.
translation_notes:
  risk_flags:
  - risk: “Who is my equal?” may sound more independent than the Hebrew result clause.
    mitigation: The paired questions preserve the original logical movement from comparison to equality.
