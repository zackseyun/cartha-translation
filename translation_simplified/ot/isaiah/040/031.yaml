translation:
  language: en
  text: But those who wait for Yahweh[a] will gain new strength. They will rise on wings like eagles.[b] They will run without growing weary; they will walk without fainting.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “those who hope in Yahweh”; it describes waiting with expectant hope.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term can refer to eagles or, more broadly, to large birds of prey, including vultures.
    reason: lexical_alternative
