translation:
  language: en
  text: Don’t you know? Haven’t you heard? Yahweh is the everlasting God, the Creator of the farthest reaches of the earth. He never grows faint or weary. No one can fully search out his understanding.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Have you not known? Have you not heard?
  simplified_phrase: Don’t you know? Haven’t you heard?
  preserved_meaning: The questions remind and rebuke the hearers about what they should already know.
  reasoning_layer_used: Lexical decisions for הֲלוֹא, יָדַעְתָּ, and אִם לֹא שָׁמַעְתָּ.
  rationale: Modern contractions make the parallel rhetorical questions sound natural without weakening their force.
- pob_phrase: the ends of the earth
  simplified_phrase: the farthest reaches of the earth
  preserved_meaning: Yahweh created the whole earth, including its most distant places.
  reasoning_layer_used: Lexical decision for קְצוֹת הָאָרֶץ.
  rationale: This wording explains the geographic image while preserving its sense of vast extent.
- pob_phrase: his understanding is unsearchable
  simplified_phrase: No one can fully search out his understanding
  preserved_meaning: God’s understanding cannot be completely investigated or comprehended.
  reasoning_layer_used: Lexical decisions for אֵין חֵקֶר and לִתְבוּנָתוֹ.
  rationale: The active sentence makes the uncommon term “unsearchable” immediately understandable.
translation_notes:
  risk_flags:
  - risk: “Farthest reaches” explains rather than exactly reproduces the traditional image “ends of the earth.”
    mitigation: It retains the idea of the earth’s most distant extremities rather than flattening it to “everywhere.”
