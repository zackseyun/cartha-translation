translation:
  language: en
  text: He sits above the circle of the earth,[a] and the people who live there are like grasshoppers. He stretches out the heavens like a thin curtain[b] and spreads them out like a tent to live in.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean the earth’s “vault” or “horizon,” describing a circular expanse or dome-like boundary.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew describes something thin or fine and may also be rendered “gauze” or “veil.”
    reason: lexical_alternative
