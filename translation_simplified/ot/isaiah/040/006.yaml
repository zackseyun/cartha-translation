translation:
  language: en
  text: A voice says, “Cry out!” Then I said,[a] “What should I cry out?” All flesh—that is, all humanity—is grass. Everything lovely about humanity is like a flower in the field.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Another traditional reading has “And one said” or “And he said.”
    reason: alternative_reading
  - marker: b
    text: Or “Everything glorious about humanity.”
    reason: lexical_alternative
