translation:
  language: en
  text: Has anyone ever measured[b] Yahweh’s Spirit?[a] Has any man ever made his counsel known to him?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Yahweh’s mind.” The Hebrew word can mean spirit, breath, or inner disposition; the Greek tradition reflected in Romans 11:34 reads “mind.”
    reason: lexical_alternative
  - marker: b
    text: Or “directed Yahweh’s Spirit” or “instructed him.” These reflect other interpretations of the Hebrew and the ancient Greek tradition.
    reason: alternative_reading
