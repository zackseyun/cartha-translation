simplification_decisions:
- pob_phrase: the glory of his forest and of his fruitful land
  simplified_phrase: the splendor of his forest and fruitful land
  preserved_meaning: The collective abundance and majesty of Assyria’s woodland and cultivated land are consumed.
  reasoning_layer_used: POB lexical decisions for וּכְבוֹד, יַעְרוֹ, and וְכַרְמִלּוֹ
  rationale: “Splendor” clearly expresses the impressive abundance without turning it into separate splendid things.
- pob_phrase: from soul to flesh
  simplified_phrase: completely
  preserved_meaning: The destruction consumes the whole of the forest and fruitful land’s splendor.
  reasoning_layer_used: POB lexical decision for מִנֶּפֶשׁ וְעַד בָּשָׂר
  rationale: The plain adverb states the idiom’s totalizing force because its literal image is unnatural here.
- pob_phrase: and it will be like the wasting away of a sick man
  simplified_phrase: It will waste away like a sick man
  preserved_meaning: The devastated splendor progressively collapses like a person weakened by sickness.
  reasoning_layer_used: POB lexical decisions for כִּמְסֹס and נֹסֵס
  rationale: The active comparison is easier to follow while retaining the image of sickness and decline.
interpretive_expansions:
- pob_phrase: from soul to flesh
  rendering: completely
  claim: The consumption is comprehensive rather than partial.
  evidence:
