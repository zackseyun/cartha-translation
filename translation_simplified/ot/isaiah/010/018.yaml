  language: en
  text: He will completely consume the splendor of his forest and fruitful land. It will waste away like a sick man.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “it will be like someone wasting away.” The final Hebrew phrase is difficult, and the last word may be understood differently.
