translation:
  language: en
  text: They have crossed over the pass.[a] Geba is our place for the night. Ramah trembles; Gibeah of Saul has fled.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the crossing.” The Hebrew refers generally to a place where people cross; here it most likely means a mountain pass.
