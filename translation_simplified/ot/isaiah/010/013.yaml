translation:
  language: en
  text: For he says, “I have done all this by the strength of my own hand and by my wisdom, because I understand what I am doing. I remove the borders of peoples and plunder their treasures.[a] Like a mighty man, I bring down those who sit on thrones.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “their stored wealth,” “possessions,” or “stores.” The Hebrew word is rare and refers to riches that have been laid up.
    reason: lexical_alternative
  - marker: b
    text: Or “the inhabitants.” The Hebrew can refer broadly to those who dwell somewhere, though here it may mean rulers seated in power.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: By the strength of my hand I have done it
  simplified_phrase: I have done all this by the strength of my own hand
  preserved_meaning: The speaker proudly credits his conquests to his own power while retaining the concrete image of his hand.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “All this” supplies the conquest context, and “my own” makes the self-glorifying boast immediately clear.
- pob_phrase: for I have understanding
  simplified_phrase: because I understand what I am doing
  preserved_meaning: The speaker claims that his success comes from his own discernment.
  reasoning_layer_used: POB lexical decision for כִּי נְבֻנוֹתִי
  rationale: The verbal wording is more natural in common English without weakening the claim.
- pob_phrase: those who sit enthroned
  simplified_phrase: those who sit on thrones
  preserved_meaning: The speaker claims to humiliate and overthrow people seated in power.
  reasoning_layer_used: POB lexical decision for יוֹשְׁבִים
  rationale: The concrete throne image communicates ruling power more plainly than “enthroned.”
