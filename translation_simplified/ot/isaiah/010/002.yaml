translation:
  language: en
  text: They deny the poor justice and rob the afflicted among my people of their rights.[a] They make widows their plunder and plunder the fatherless.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the poor among my people.” The Hebrew term can refer to poverty, affliction, or oppression.
    reason: lexical_alternative
  - marker: b
    text: Or “orphans.” The Hebrew specifically refers to those without a father.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: to turn aside the poor from justice
  simplified_phrase: They deny the poor justice
  preserved_meaning: Those in power deliberately keep the poor from receiving justice.
  reasoning_layer_used: Lexical decision for לְהַטּוֹת and the judicial context
  rationale: “Deny” clearly expresses the audited sense of diverting or withholding justice.
- pob_phrase: to rob the afflicted of my people of their right
  simplified_phrase: rob the afflicted among my people of their rights
  preserved_meaning: Afflicted members of God's people are deprived of what the law owes them.
  reasoning_layer_used: Lexical decisions for גזל, מִשְׁפָּט, and עֲנִיֵּי עַמִּי
  rationale: The plural “rights” sounds natural while preserving the legal force.
- pob_phrase: so that widows may become their spoil, and they may plunder the fatherless
  simplified_phrase: They make widows their plunder and plunder the fatherless
  preserved_meaning: The oppressors exploit both named vulnerable groups as though taking war plunder.
  reasoning_layer_used: Lexical and theological decisions on שָׁלָל, בזז, widows, and the fatherless
  rationale: The direct sentence retains both the spoil image and the explicit act of plundering.
interpretive_expansions:
- pob_phrase: to turn aside the poor from justice
  rendering: They deny the poor justice
  claim: The oppressors prevent the poor from receiving justice rather than persuading them to reject it.
  evidence:
