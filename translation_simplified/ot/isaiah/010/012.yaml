translation:
  language: en
  text: When the Lord has finished all his work on Mount Zion and in Jerusalem, I will punish the fruit produced by the proud heart of the king of Assyria and the splendor of his haughty gaze.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And it will happen that when the Lord has finished
  simplified_phrase: When the Lord has finished
  preserved_meaning: The Lord will complete his work before punishing Assyria’s king.
  reasoning_layer_used: POB lexical decisions for וְהָיָה, כִּי, and יְבַצַּע
  rationale: The shorter opening expresses the same future sequence in natural English.
- pob_phrase: the fruit of the greatness of the heart
  simplified_phrase: the fruit produced by the proud heart
  preserved_meaning: The king’s inward pride produces conduct that God will punish.
  reasoning_layer_used: POB lexical decisions for פְּרִי and גֹדֶל לְבַב
  rationale: This keeps the fruit and heart images while making their relationship clear.
- pob_phrase: the splendor of his haughty eyes
  simplified_phrase: the splendor of his haughty gaze
  preserved_meaning: The king proudly glories in his elevated view of himself.
  reasoning_layer_used: POB lexical decisions for תִּפְאֶרֶת and רוּם עֵינָיו
  rationale: “Gaze” communicates a proud look more naturally while retaining the eye imagery.
interpretive_expansions:
- pob_phrase: the greatness of the heart
  rendering: the proud heart
  claim: The heart’s greatness is negative arrogance in this judgment context.
  evidence:
  - The POB rationale identifies “arrogance of the heart” as a valid contextual alternative.
  - The clause announces divine punishment for the king’s attitude and its fruit.
  confidence: high
  alternatives_preserved:
  - greatness of heart
  - arrogance of heart
translation_notes:
  risk_flags:
  - risk: “Proud heart” makes the negative sense more explicit than the POB main wording.
    mitigation: The judgment context and POB lexical rationale directly support this sense.
  - risk: Readers may take the Lord’s work in Zion and Jerusalem as only destructive.
    mitigation: The locative wording is retained without adding “against,” preserving the POB’s theological tension.
