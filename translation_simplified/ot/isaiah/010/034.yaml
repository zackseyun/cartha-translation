translation:
  language: en
  text: The forest’s tangled growth will be cut down with an iron tool, and Lebanon will fall at the hand of a mighty one.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Lebanon will fall at the hand of the Mighty One,” if “mighty one” is a title for God.
