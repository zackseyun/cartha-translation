simplification_decisions:
- pob_phrase: the thickets of the forest
  simplified_phrase: the forest’s tangled growth
  preserved_meaning: The dense, interwoven parts of the forest are cut down.
  reasoning_layer_used: POB lexical decision for סִבְכֵי
  rationale: “Tangled growth” makes the forest image immediately clear without limiting it to branches.
- pob_phrase: with iron
  simplified_phrase: with an iron tool
  preserved_meaning: Iron is the means used to cut down the forest.
  reasoning_layer_used: POB lexical decision for בַּבַּרְזֶל
  rationale: Adding “tool” explains the metonymy without specifying an axe.
- pob_phrase: by a mighty one
  simplified_phrase: at the hand of a mighty one
  preserved_meaning: A powerful agent causes Lebanon to fall, while the agent’s identity remains open.
  reasoning_layer_used: POB lexical and theological decisions for בְּאַדִּיר
  rationale: The common idiom clarifies agency while preserving the lower-case ambiguity.
