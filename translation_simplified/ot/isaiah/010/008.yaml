  rationale: The contraction makes the rhetorical question sound natural in modern English.
- pob_phrase: my commanders all kings
  simplified_phrase: all my commanders equal in rank to kings
  preserved_meaning: The Assyrian king claims that every subordinate commander has kinglike status.
