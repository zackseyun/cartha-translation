- pob_phrase: he does not think so
  simplified_phrase: that is not what he thinks
  preserved_meaning: The Assyrian king’s thinking differs from the purpose stated in context.
  reasoning_layer_used: lexical and theological decisions
  rationale: “That” makes the contrast easier to follow without explaining God’s purpose inside the verse.
- pob_phrase: his heart does not reckon so
  simplified_phrase: nor is it what he plans in his heart
  preserved_meaning: His inward intention does not match the preceding purpose.
  reasoning_layer_used: lexical decisions for לְבָבוֹ and יַחְשֹׁב
  rationale: “Plans in his heart” expresses deliberate inward thought in ordinary English.
- pob_phrase: it is in his heart to destroy, and to cut off not a few nations
  simplified_phrase: His heart is set on destroying and cutting off not merely a few nations
  preserved_meaning: His settled intention is to destroy and eliminate a large number of nations.
  reasoning_layer_used: lexical decisions for בִּלְבָבוֹ, לְהַשְׁמִיד, לְהַכְרִית, and לֹא מְעָט
  rationale: The wording clarifies firm intent while retaining the heart image, both destructive actions, and the Hebrew understatement.
