translation:
  language: en
  text: Therefore the Lord, Yahweh of Armies, will send a wasting sickness among his powerful warriors. Beneath his glory[a], a blaze will be kindled like a blazing fire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Instead of his glory”; “glory” here can mean his splendor or pomp.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: among his stout warriors
  simplified_phrase: among his powerful warriors
  preserved_meaning: The judgment falls on Assyria’s strong military elite.
  reasoning_layer_used: POB lexical and theological decisions on בְּמִשְׁמַנָּיו
  rationale: “Powerful” clearly conveys the strength represented by the Hebrew image of fatness.
- pob_phrase: and under his glory
  simplified_phrase: Beneath his glory
  preserved_meaning: Destructive fire lies beneath Assyria’s outward splendor.
  reasoning_layer_used: POB lexical decision on וְתַחַת כְּבֹדוֹ
  rationale: “Beneath” makes the spatial image easier to picture while retaining “glory.”
- pob_phrase: a burning will be kindled like the burning of fire
  simplified_phrase: a blaze will be kindled like a blazing fire
  preserved_meaning: The intensified fire image portrays severe divine judgment.
  reasoning_layer_used: POB lexical decisions on יֵקַד יְקֹד and כִּיקוֹד אֵשׁ
  rationale: “Blaze” removes the awkward repeated noun while preserving the emphatic fire imagery.
translation_notes:
  risk_flags:
  - risk: “Beneath” may obscure the possible substitutional sense of תחת.
    mitigation: The footnote preserves the alternative “Instead of his glory.”
  - risk: “Powerful warriors” does not reproduce the Hebrew image of fatness.
    mitigation: It follows the POB’s contextual reading of robust military elites.
