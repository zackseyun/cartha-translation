translation:
  language: en
  text: My hand found the peoples’ wealth[a] as easily as someone finds a nest. I gathered all the earth[b] as someone gathers abandoned eggs. No one fluttered a wing, opened a mouth, or chirped.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the resources of the peoples.” The Hebrew word can also refer to strength or military force, but here it means wealth taken in conquest.
    reason: lexical_alternative
  - marker: b
    text: Or “the whole land.” “All the earth” preserves the deliberately universal scope of the boast.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the wealth of the peoples
  simplified_phrase: the peoples’ wealth
  preserved_meaning: The speaker boasts of taking the possessions of conquered peoples.
  reasoning_layer_used: POB lexical decision for לְחֵיל הָעַמִּים
  rationale: The possessive form is more natural while retaining the chosen sense of wealth.
- pob_phrase: as one finds a nest; and as one gathers abandoned eggs, I gathered all the earth
  simplified_phrase: as easily as someone finds a nest. I gathered all the earth as someone gathers abandoned eggs.
  preserved_meaning: Conquest is pictured as effortlessly taking undefended eggs from a nest.
  reasoning_layer_used: POB lexical rationales and source imagery
  rationale: Two sentences make the comparison easier to follow without weakening the nest-and-eggs image.
- pob_phrase: there was none that fluttered a wing
  simplified_phrase: No one fluttered a wing
  preserved_meaning: No conquered people offered even the slightest resistance.
  reasoning_layer_used: POB lexical decision for נֹדֵד כָּנָף
  rationale: The direct wording is clearer while preserving the bird image and lack of resistance.
interpretive_expansions:
- pob_phrase: as one finds a nest
  rendering: as easily as someone finds a nest
  claim: The comparison emphasizes how effortless the conquest seemed to the speaker.
  evidence:
  - The abandoned-eggs image presents the wealth as defenseless and readily taken.
  - The POB rationale identifies easy acquisition as the metaphor’s force.
  confidence: high
  alternatives_preserved:
  - The wording remains a comparison rather than stating that conquest was literally effortless.
translation_notes:
  risk_flags:
  - risk: “All the earth” could be mistaken for a literal claim of worldwide conquest.
    mitigation: The footnote identifies it as the universal scope of the speaker’s boast.
