translation:
  language: en
  text: So I join Jazer in weeping for the vine of Sibmah. Heshbon and Elealeh, I soak you with my tears, because a shout has fallen over your summer fruit and harvest.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may mean that an invader’s battle cry has come upon the harvest, or that the joyful harvest shout has ceased.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: I weep with the weeping of Jazer
  simplified_phrase: I join Jazer in weeping
  preserved_meaning: The speaker shares in Jazer’s mourning.
  reasoning_layer_used: Lexical decision for בִּבְכִי יַעְזֵר
  rationale: The recasting makes the association clear without removing Jazer’s personified grief.
- pob_phrase: I drench you with my tears
  simplified_phrase: I soak you with my tears
  preserved_meaning: The speaker’s tears metaphorically saturate the named cities.
  reasoning_layer_used: Lexical decisions for אֲרַיָּוֶךְ and דִּמְעָתִי
  rationale: “Soak” is common English that retains the vivid image of overwhelming tears.
- pob_phrase: over your summer fruit and over your harvest
  simplified_phrase: over your summer fruit and harvest
  preserved_meaning: The ominous shout affects both the ripe produce and the harvest.
  reasoning_layer_used: Lexical decisions for קֵיץ and קָצִיר
  rationale: Removing the repeated preposition shortens the line without merging the two agricultural terms.
translation_notes:
  risk_flags:
  - risk: Modern readers may assume the shout is certainly a battle cry.
    mitigation: The main text keeps the broad word “shout,” and the footnote preserves both documented readings.
  - risk: “Join Jazer” may sound like literal travel or assembly.
    mitigation: The phrase “in weeping” clearly marks shared mourning rather than physical movement.
