translation:
  language: en
  text: The fields of Heshbon are wasting away, and so is the vine of Sibmah. The rulers of the nations have struck down its best vines.[a] The vines reached as far as Jazer and wandered into the wilderness. Their shoots spread out[b] and crossed the sea.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “its tendrils”; the Hebrew may refer either to select vine stock or to the vine’s branches or shoots.
    reason: lexical_alternative
  - marker: b
    text: Or “their branches spread out.” The Hebrew word translated “spread out” is difficult and may be understood in more than one way.
    reason: lexical_alternative
  - marker: c
    text: “The sea” may refer specifically to the Dead Sea.
    reason: cultural_note
