translation:
  language: en
  text: Justice has been driven back, and righteousness stands far away. This is because truth has stumbled in the public square,[a] and what is right cannot enter.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in the street.” The Hebrew refers to an open public place.
    reason: lexical_alternative
  - marker: b
    text: Literally, “uprightness cannot enter.”
    reason: lexical_alternative
