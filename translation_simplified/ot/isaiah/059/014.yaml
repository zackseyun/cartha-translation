  reasoning_layer_used: POB lexical decision for הֻסַּג and אָחוֹר
  rationale: “Driven back” makes the passive opposition to justice more immediate while preserving the backward-motion image.
- pob_phrase: for truth has stumbled
  simplified_phrase: This is because truth has stumbled
  preserved_meaning: The failure of truth explains why justice and righteousness are absent.
  reasoning_layer_used: POB lexical decision for כִּי
  rationale: A new sentence with “This is because” makes the logical connection easier to follow.
- pob_phrase: uprightness cannot enter
  simplified_phrase: what is right cannot enter
  preserved_meaning: Moral rightness is personified as excluded from public life.
  reasoning_layer_used: POB lexical decision for נְכֹחָה and theological distinction of the virtues
  rationale: “What is right” is clearer for common readers, while the footnote retains the more literal term.
