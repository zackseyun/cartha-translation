  text: For our acts of rebellion are many in your sight, and our sins testify against us. For our acts of rebellion remain with us, and we know our own wrongdoing.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: our transgressions are many before you
  simplified_phrase: our acts of rebellion are many in your sight
  preserved_meaning: Their many rebellious offenses are fully present before God.
  reasoning_layer_used: Lexical decisions for פְשָׁעֵינוּ and נֶגְדֶּךָ
  rationale: “Acts of rebellion” and “in your sight” clarify the moral and spatial-forensic senses.
- pob_phrase: our transgressions are with us
  simplified_phrase: our acts of rebellion remain with us
  preserved_meaning: Their rebellious offenses continue as a present reality they cannot deny.
  reasoning_layer_used: Lexical decision for פְשָׁעֵינוּ אִתָּנוּ and grounding review
  rationale: “Remain” clarifies continuing presence while the repeated plural preserves the concrete offenses.
- pob_phrase: we know our iniquities
  simplified_phrase: we know our own wrongdoing
  preserved_meaning: They are consciously aware of their morally guilty conduct.
  reasoning_layer_used: Lexical and theological decisions for וַעֲוֺנֹתֵינוּ and יְדַעֲנוּם
  rationale: “Wrongdoing” is common English yet remains distinct from “rebellion” and “sins.”
