translation:
  language: en
  text: A Redeemer[a] will come to Zion and to those among Jacob’s people who turn away from rebellion, declares Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A “Redeemer” is one who rescues and reclaims others, often with the duty of a close relative.
    reason: cultural_note
