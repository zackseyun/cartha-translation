  reasoning_layer_used: lexical decision for בְּיַעֲקֹב
  rationale: This makes the covenant name refer clearly to a people rather than a place.
- pob_phrase: turn from transgression
  simplified_phrase: turn away from rebellion
  preserved_meaning: They morally turn away from sin against rightful authority.
  reasoning_layer_used: lexical and theological decisions for שָׁבֵי פֶשַׁע
  rationale: “Rebellion” clearly conveys the force of the Hebrew while preserving the act of turning.
