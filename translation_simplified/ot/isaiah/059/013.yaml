translation:
  language: en
  text: We sin against and deny Yahweh, and we turn away from following our God. We speak words that oppress others and call for revolt.[a] In our hearts we plan lies and then speak them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word translated “revolt” can also mean “rebellion” or, in this context, turning away from God.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: transgressing and denying Yahweh
  simplified_phrase: We sin against and deny Yahweh
  preserved_meaning: The people confess both moral rebellion and denial of Yahweh.
  reasoning_layer_used: Lexical decision for פָּשֹׁעַ and theological decision for יהוה
  rationale: “Sin against” expresses the moral breach plainly while retaining Yahweh’s covenant name.
- pob_phrase: speaking oppression and revolt
  simplified_phrase: We speak words that oppress others and call for revolt
  preserved_meaning: Their speech advances oppressive injustice and defiant rebellion rather than merely discussing them.
  reasoning_layer_used: Lexical decisions for דַּבֶּר, עֹשֶׁק, and וְסָרָה
  rationale: This wording makes oppression and revolt the wrongful character and content of their speech.
- pob_phrase: conceiving and uttering from the heart words of falsehood
  simplified_phrase: In our hearts we plan lies and then speak them
  preserved_meaning: False speech is formed inwardly before being expressed outwardly.
  reasoning_layer_used: Lexical decisions for הֹרוֹ וְהֹגוֹ, מִלֵּב, and דִּבְרֵי שָׁקֶר
  rationale: The rewrite clearly presents the inward-to-outward sequence.
interpretive_expansions:
- pob_phrase: speaking oppression and revolt
  rendering: We speak words that oppress others and call for revolt
  claim: The speech itself promotes or carries out oppression and revolt rather than merely mentioning them.
  evidence:
  - The POB treats עֹשֶׁק and סָרָה as the objects of “speaking.”
  - The lexical audit defines עֹשֶׁק as oppressive injustice and סָרָה as revolt or rebellion.
  confidence: moderate
  alternatives_preserved:
  - speaking oppression and rebellion
  - speaking words of oppression and revolt
translation_notes:
  risk_flags:
  - risk: “Sin against” is broader than the source image of transgression or rebellion.
    mitigation: It still presents an active moral offense against Yahweh rather than an accidental failure.
  - risk: “Call for revolt” may sound political, though the Hebrew can describe broader rebellion against God.
    mitigation: The footnote preserves the contextual religious sense without narrowing the main text.
