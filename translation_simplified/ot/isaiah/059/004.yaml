  preserved_meaning: The appeal seeks what is morally right and just.
  reasoning_layer_used: Lexical and theological decisions on צֶדֶק
  rationale: The clearer phrase preserves the term’s broad moral and judicial force.
- pob_phrase: pleads with faithfulness
  simplified_phrase: argues a case with integrity
  preserved_meaning: No one conducts a legal case reliably and honestly.
  reasoning_layer_used: Lexical decision on נִשְׁפָּט בֶּאֱמוּנָה
  rationale: This makes the forensic setting plain while retaining faithfulness as integrity.
- pob_phrase: speaking falsehood
  simplified_phrase: speaking what is false
  preserved_meaning: Their speech is deceptive and untrue.
  reasoning_layer_used: Lexical decision on שָׁוְא
  rationale: Ordinary wording conveys falsehood without narrowing it to specific lies.
