translation:
  language: en
  text: No one appeals for what is right[a], and no one argues a case with integrity. Trusting in emptiness and speaking what is false, they conceive trouble and give birth to wickedness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
