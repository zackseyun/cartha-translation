translation:
  language: en
  text: So people in the west will fear Yahweh’s name, and people where the sun rises[a] will fear his glory. For Yahweh will come like a rushing river that is driven by his breath.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “people in the east.” Literally, “from the rising of the sun.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew is difficult. It may mean, “It will come like a rushing river, driven by the Spirit of Yahweh.” A traditional interpretation is, “When the enemy comes like a flood, the Spirit of Yahweh will raise a banner against him.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: they will fear the name of Yahweh from the west
  simplified_phrase: people in the west will fear Yahweh’s name
  preserved_meaning: People throughout the western lands will respond to Yahweh’s revealed identity with fear and awe.
  reasoning_layer_used: POB lexical decisions for וְיִירְאוּ, מִמַּעֲרָב, and אֶת שֵׁם יְהוָה
  rationale: The reordered clause makes the geographic relationship clear while retaining the strong word “fear.”
- pob_phrase: from the rising of the sun
  simplified_phrase: people where the sun rises
  preserved_meaning: The eastern horizon remains expressed through the poetic image of sunrise.
  reasoning_layer_used: POB lexical decision for וּמִמִּזְרַח שֶׁמֶשׁ
  rationale: Adding “people” clarifies the parallel without reducing the image to a compass point.
- pob_phrase: for he will come like a rushing river, driven by the breath of Yahweh
  simplified_phrase: For Yahweh will come like a rushing river that is driven by his breath
  preserved_meaning: Yahweh’s forceful coming explains the worldwide fear and is pictured as a river propelled by his breath.
  reasoning_layer_used: POB lexical and theological decisions for כִּי, יָבֹא, כַנָּהָר, רוּחַ יְהוָה, and נֹסְסָה בוֹ
  rationale: Naming Yahweh and using a relative clause preserve the reason link and make the river image easier to follow.
interpretive_expansions:
- pob_phrase: they will fear ... from the west, and his glory from the rising of the sun
  rendering: people in the west will fear ... and people where the sun rises will fear
  claim: The same human response applies to both geographic halves of the poetic parallel.
  evidence:
  - The Hebrew coordinates “from the west” with “from the rising of the sun.”
  - The POB rationale identifies worldwide fear and reverence as the verse’s result.
  confidence: high
  alternatives_preserved:
  - A more elliptical rendering that leaves the second verb unstated.
translation_notes:
  risk_flags:
  - risk: “His breath” may be read as only physical breath rather than also carrying divine-Spirit resonance.
    mitigation: Footnote b preserves “the Spirit of Yahweh” as a plausible reading.
  - risk: The difficult final clause permits substantially different syntax and imagery.
    mitigation: Footnote b records both the impelled-river reading and the prominent traditional interpretation.
