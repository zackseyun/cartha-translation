translation:
  language: en
  text: He will repay them according to what they have done. His adversaries will face his wrath, and his enemies will receive their punishment. He will repay the distant coastlands[a] with what they deserve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “islands.” The Hebrew term can refer to islands or to distant coastal nations.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: According to their deeds, so he will repay
  simplified_phrase: He will repay them according to what they have done
  preserved_meaning: His repayment is measured by their actions.
  reasoning_layer_used: Lexical decisions for כְּעַל and גְּמֻלוֹת; theological decision on proportionate judgment
  rationale: The clause is reordered into natural English while keeping their actions as the basis of judgment.
- pob_phrase: wrath to his adversaries, repayment to his enemies
  simplified_phrase: His adversaries will face his wrath, and his enemies will receive their punishment
  preserved_meaning: Those hostile to him receive judicial wrath and repayment.
  reasoning_layer_used: Lexical decisions for חֵמָה, לְצָרָיו, גְּמוּל, and לְאֹיְבָיו
  rationale: Two direct clauses make the parallel judgment easier to understand.
- pob_phrase: to the coastlands he will repay what is due
  simplified_phrase: He will repay the distant coastlands with what they deserve
  preserved_meaning: Far-off maritime lands receive the judicial repayment due to them.
  reasoning_layer_used: Lexical decisions for לָאִיִּים and גְּמוּל יְשַׁלֵּם
  rationale: The wording explains both the coastlands’ scope and the repayment in familiar English.
