translation:
  language: en
  text: Like blind people, we feel along the wall. We keep feeling our way as if we had no eyes. Even at noon, we stumble as though it were twilight. Among vigorous people,[a] we are like the dead.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Hebrew word translated “vigorous people” is uncertain; it may instead mean “fertile places” or “robust people.”
    reason: lexical_alternative
