translation:
  language: en
  text: Truth could not be found. Anyone who turned away from evil was plundered.[a] Yahweh saw that there was no justice, and he judged this to be evil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Hebrew expression may also mean “was treated as prey,” emphasizing that the person became a victim.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: truth was missing
  simplified_phrase: Truth could not be found
  preserved_meaning: Truth was absent from public and moral life.
  reasoning_layer_used: Lexical decision for נֶעְדֶּרֶת in its social and judicial context
  rationale: The active English expression makes the absence of truth immediately clear without implying that it had vanished permanently.
- pob_phrase: whoever turned away from evil was plundered
  simplified_phrase: Anyone who turned away from evil was plundered
  preserved_meaning: A person who rejected wrongdoing became a victim.
  reasoning_layer_used: Lexical decision for generic וְסָר and rare מִשְׁתּוֹלֵל
  rationale: “Anyone” clearly expresses the generic meaning while retaining the chosen image of being plundered.
- pob_phrase: it was evil in his eyes that there was no justice
  simplified_phrase: he judged this to be evil
  preserved_meaning: Yahweh morally condemned the absence of justice as evil.
  reasoning_layer_used: Lexical rationale for וַיֵּרַע בְּעֵינָיו and מִשְׁפָּט
  rationale: The recast wording explains the Hebrew sight idiom while preserving its strong moral judgment.
