translation:
  language: en
  text: Their webs[a] cannot be turned into clothing. They cannot cover themselves with what they have done. Their deeds are wicked, and their hands do violent work.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In context, these are spiderwebs.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Their webs will not become clothing
  simplified_phrase: Their webs cannot be turned into clothing
  preserved_meaning: What they have woven cannot serve as clothing.
  reasoning_layer_used: Lexical decision for קוּרֵיהֶם and לְבֶגֶד
  rationale: The wording keeps the web-and-clothing image while making its failure clearer.
- pob_phrase: nor will they cover themselves with their deeds
  simplified_phrase: They cannot cover themselves with what they have done
  preserved_meaning: Their own actions cannot provide the covering they need.
  reasoning_layer_used: Lexical and theological decisions on יִתְכַּסּוּ and בְּמַעֲשֵׂיהֶם
  rationale: The sentence preserves the moral-covering metaphor in ordinary English.
- pob_phrase: the work of violence is in their hands
  simplified_phrase: their hands do violent work
  preserved_meaning: They are responsible for carrying out violence.
  reasoning_layer_used: Lexical decisions on פֹעַל חָמָס and בְּכַפֵּיהֶם
  rationale: The active wording keeps both the work and hands images while clarifying culpability.
translation_notes:
  risk_flags:
  - risk: The active final clause is less formally close to the Hebrew expression “in their hands.”
    mitigation: It retains both “hands” and “work” and preserves the source’s accusation of responsibility.
