translation:
  language: en
  text: “As for me, this is my covenant with them,” says Yahweh. “My Spirit is upon you, and I have put my words in your mouth. Neither my Spirit nor my words will ever depart from your mouth, from the mouths of your descendants, or from the mouths of their descendants, from now and forever,” says Yahweh.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: my Spirit that is upon you, and my words that I have put in your mouth, shall not depart
  simplified_phrase: My Spirit is upon you, and I have put my words in your mouth. Neither my Spirit nor my words will ever depart
  preserved_meaning: Both Yahweh’s Spirit and his words are included in the enduring covenant promise.
  reasoning_layer_used: Hebrew coordinated subjects and the plural verb לֹא יָמוּשׁוּ
  rationale: Two sentences clarify the relationships while explicitly keeping both subjects under the promise.
- pob_phrase: your offspring, or from the mouth of your offspring’s offspring
  simplified_phrase: your descendants, or from the mouths of their descendants
  preserved_meaning: The promise continues through successive generations.
  reasoning_layer_used: Lexical decisions for זַרְעֲךָ and זֶרַע זַרְעֲךָ
  rationale: “Descendants” communicates posterity in natural modern English.
- pob_phrase: shall not depart from your mouth
  simplified_phrase: will ever depart from your mouth
  preserved_meaning: The covenant promises that the Spirit and words will remain without interruption.
  reasoning_layer_used: Lexical decision for לֹא יָמוּשׁוּ and the temporal phrase מֵעַתָּה וְעַד עוֹלָם
  rationale: “Will ever depart” makes the lasting force clear without weakening the mouth image.
translation_notes:
  risk_flags:
  - risk: The singular “you” has more than one possible referent in context.
    mitigation: The draft retains singular “you” without identifying the addressee.
  - risk: Speaking of the Spirit departing from a mouth may sound unusual in modern English.
    mitigation: The wording preserves the source’s shared plural verb and repeated mouth image.
