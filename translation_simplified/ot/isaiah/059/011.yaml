translation:
  language: en
  text: We all growl like bears and keep moaning like doves. We hope for justice,[a] but there is none. We hope for salvation,[b] but it remains far from us.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “wait for justice” or “look for justice”; the Hebrew verb can express both waiting and hoping.
    reason: lexical_alternative
  - marker: b
    text: Or “deliverance.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: We all growl like bears, and like doves we moan continually
  simplified_phrase: We all growl like bears and keep moaning like doves.
  preserved_meaning: The two animal images and the contrast between harsh growling and repeated mournful sound remain distinct.
  reasoning_layer_used: POB lexical decisions for נֶהֱמֶה, וְכַיּוֹנִים, and הָגֹה נֶהְגֶּה
  rationale: Ordinary clause order and “keep moaning” make the repeated lament easier to grasp.
- pob_phrase: we hope for justice, but there is none; for salvation
  simplified_phrase: We hope for justice, but there is none. We hope for salvation
  preserved_meaning: Both justice and salvation remain objects of frustrated hope.
  reasoning_layer_used: POB lexical and theological decisions for מִשְׁפָּט and יְשׁוּעָה
  rationale: Repeating “we hope” removes the difficult ellipsis and separates the expectations clearly.
- pob_phrase: it is far from us
  simplified_phrase: it remains far from us
  preserved_meaning: Salvation is still remote from the speakers.
  reasoning_layer_used: POB lexical decision for רָחֲקָה מִמֶּנּוּ
  rationale: “Remains” naturally emphasizes their continuing lack of salvation.
