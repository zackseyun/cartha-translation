translation:
  language: en
  text: For Dimon’s waters are full of blood.[a] Indeed, I will bring still more upon Dimon:[b] a lion will come against those fleeing from Moab and those who remain in the land.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The name Dimon may echo the Hebrew word for “blood”; some identify the place as Dibon.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says that more will be added but does not name the additional calamities.
    reason: alternative_reading
  - marker: c
    text: The lion may be a literal lion or a picture of further judgment.
    reason: alternative_reading
