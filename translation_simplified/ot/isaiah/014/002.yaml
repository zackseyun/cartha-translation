translation:
  language: en
  text: Other peoples will take the Israelites and bring them back to their homeland. Then, in Yahweh’s land, the house of Israel will possess[a] those peoples as male and female slaves. Israel will become the captor of those who captured them and will rule over those who oppressed them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb translated “possess” can also carry the sense of receiving as an inheritance.
    reason: lexical_alternative
