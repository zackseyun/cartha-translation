translation:
  language: en
  text: What answer will be given to the nation’s messengers?[a] “Yahweh has founded Zion, and the afflicted[b] among his people will find refuge in her.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the nation’s envoys” or “ambassadors.”
    reason: lexical_alternative
  - marker: b
    text: Or “the poor” or “the humble.” The Hebrew can refer to poverty, suffering, or lowliness.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And what will one answer the messengers of the nation?
  simplified_phrase: What answer will be given to the nation’s messengers?
  preserved_meaning: The question asks for the expected reply without naming a specific speaker.
  reasoning_layer_used: Lexical decision for יַעֲנֶה and discourse context
  rationale: The passive wording avoids the awkward generic “one” without adding obligation.
- pob_phrase: the afflicted of his people
  simplified_phrase: the afflicted among his people
  preserved_meaning: Vulnerable and oppressed members of Yahweh’s people are in view.
  reasoning_layer_used: Lexical decision for עֲנִיֵּי עַמּוֹ
  rationale: “Among” states the relationship naturally without limiting affliction to poverty.
- pob_phrase: and in her the afflicted of his people will find refuge
  simplified_phrase: and the afflicted among his people will find refuge in her
  preserved_meaning: Personified Zion remains the place where the afflicted find safety.
  reasoning_layer_used: Theological decision on Zion’s personification
  rationale: Natural English word order improves clarity while retaining the image of Zion as “her.”
translation_notes:
  risk_flags:
  - risk: Readers may find referring to a city as “her” unusual.
    mitigation: The wording preserves the Hebrew personification of Zion.
