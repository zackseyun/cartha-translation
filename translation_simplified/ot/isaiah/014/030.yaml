translation:
  language: en
  text: The poorest of the poor will have pasture,[a] and the needy will lie down in safety. I will kill your root through famine, and your remnant will be slain.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the firstborn of the poor will graze.” The Hebrew expression may mean “the poorest of the poor.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says “he will slay your remnant,” but it does not clearly identify who “he” is.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: The firstborn of the poor will graze
  simplified_phrase: The poorest of the poor will have pasture
  preserved_meaning: The most destitute will receive provision, expressed through the pastoral image.
  reasoning_layer_used: POB footnote and lexical decisions for בְּכוֹרֵי דַלִּים and וְרָעוּ
  rationale: The idiomatic sense prevents a misleading picture of literal firstborn children grazing, while the note retains the Hebrew image.
- pob_phrase: I will kill your root with famine
  simplified_phrase: I will kill your root through famine
  preserved_meaning: Famine is the means of destroying the nation at its source.
  reasoning_layer_used: Lexical decisions for בָרָעָב and שָׁרְשֵׁךְ
  rationale: “Through famine” clearly shows the means of judgment while preserving the root image.
- pob_phrase: it will slay your remnant
  simplified_phrase: your remnant will be slain
  preserved_meaning: The remaining survivors will be killed without identifying the uncertain agent.
  reasoning_layer_used: Theological decision on the ambiguous final subject
  rationale: The passive wording preserves the unresolved agent without an unclear pronoun.
interpretive_expansions:
- pob_phrase: The firstborn of the poor will graze
  rendering: The poorest of the poor will have pasture
  claim: The expression refers to the most destitute receiving secure provision.
  evidence:
