translation:
  language: en
  text: Wail, city gate! Cry out, city! All Philistia, melt away in fear! Smoke is coming from the north, and no one straggles in the invader’s ranks.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “and no one lags behind in his appointed place.” The Hebrew may picture the invading troops fully assembled and in order.
    reason: alternative_reading
