- pob_phrase: Sheol beneath is stirred up for you, to meet your coming
  simplified_phrase: Sheol below—the realm of the dead—is stirred up as you approach
  preserved_meaning: The underworld is personified as becoming agitated when the fallen king arrives.
  reasoning_layer_used: Lexical and theological decisions for Sheol, beneath, and the king’s coming
  rationale: The rewrite clarifies Sheol while preserving its name, downward setting, and vivid personification.
- pob_phrase: it rouses the shades for you
  simplified_phrase: It wakes the spirits of the dead to meet you
  preserved_meaning: Sheol causes its dead inhabitants to rise in response to the newcomer.
  reasoning_layer_used: Lexical decisions for rouses and shades
  rationale: Common wording replaces the obscure term “shades” without treating the Rephaim as an ethnic group.
- pob_phrase: all the leaders of the earth
  simplified_phrase: including all the great rulers of the earth
  preserved_meaning: The dead being awakened are the earth’s formerly prominent rulers.
  reasoning_layer_used: Lexical decision for the male-goat metaphor
  rationale: “Great rulers” states the metaphor’s contextual sense while the footnote preserves its source image.
