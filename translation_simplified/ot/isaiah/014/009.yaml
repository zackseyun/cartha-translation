translation:
  language: en
  text: Sheol below—the realm of the dead—is stirred up as you approach. It wakes the spirits of the dead to meet you, including all the great rulers of the earth.[a] It makes all the kings of the nations rise from their thrones.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally calls these rulers “the male goats of the earth,” a picture of prominent leaders.
    reason: lexical_alternative
