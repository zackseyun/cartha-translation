  preserved_meaning: A settled, deliberate plan is directed against the earth as a whole.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Determined” removes awkward repetition while preserving deliberate intent and the chosen universal scope.
- pob_phrase: and this is the hand that is stretched out against all the nations
  simplified_phrase: and this is the hand stretched out against all the nations
  preserved_meaning: The hand image portrays active power directed in judgment against every nation.
  reasoning_layer_used: POB lexical decisions and source parallelism
  rationale: The reduced relative clause improves flow while retaining the linked declaration and vivid image.
