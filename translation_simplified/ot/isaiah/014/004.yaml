translation:
  language: en
  text: 'You will speak this taunt against the king of Babylon:


    “How the oppressor has come to an end!

    How the insolence[a] has come to an end!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word is rare and uncertain; it may instead mean “golden city,” “onslaught,” or “exacting tyranny.”
