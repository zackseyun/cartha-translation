translation:
  language: en
  text: Even the cypress trees[a] and the cedars of Lebanon rejoice over you. They say, “Ever since you lay down, no woodcutter has come up to cut us down.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
