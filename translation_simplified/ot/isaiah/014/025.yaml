translation:
  language: en
  text: I will break Assyria in my land and trample him on my mountains. Then his yoke will be lifted from the people, and his burden will be lifted from the people’s shoulder.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “the Assyrian,” referring to Assyria’s ruler or army; here Assyria is pictured as a person.
    reason: alternative_reading
  - marker: b
    text: Hebrew shifts from plural “them” to singular “his shoulder.” The singular may picture the oppressed people collectively or refer to each person individually.
    reason: textual_variant
