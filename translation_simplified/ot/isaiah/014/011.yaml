translation:
  language: en
  text: Your royal splendor[a] has been brought down to Sheol[b], along with the sound of your harps. Maggots are spread beneath you like a bed, and worms cover you like a blanket.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “pomp,” “majesty,” or “pride.”
    reason: lexical_alternative
  - marker: b
    text: Sheol is the realm of the dead, not specifically the later concept of hell.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Your pomp
  simplified_phrase: Your royal splendor
  preserved_meaning: The king’s exalted display and majesty are being humiliated.
  reasoning_layer_used: Applied revision and lexical decision for גְּאוֹנֶךָ
  rationale: “Royal splendor” makes the regal sense of “pomp” immediately clear.
- pob_phrase: maggots are spread out beneath you
  simplified_phrase: Maggots are spread beneath you like a bed
  preserved_meaning: The corpse lies on decay-creatures as though they were bedding.
  reasoning_layer_used: Lexical decision for יֻצַּע and source-language image
  rationale: The comparison preserves the verb’s grim bedding image in plain English.
- pob_phrase: worms are your covering
  simplified_phrase: worms cover you like a blanket
  preserved_meaning: Worms lie over the dead ruler as a covering.
  reasoning_layer_used: Lexical decision for וּמְכַסֶּיךָ
  rationale: The active wording clearly conveys the parallel covering image.
