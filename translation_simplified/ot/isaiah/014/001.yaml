translation:
  language: en
  text: For Yahweh will show compassion to Jacob. He will once again choose Israel and settle them in their own land. Foreigners[a] will join them and attach themselves to Jacob’s household.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term can also mean “sojourners” or “resident foreigners”—non-Israelites living among Israel, not merely passing visitors.
    reason: lexical_alternative
  - marker: b
    text: Or “will be joined to the house of Jacob.”
    reason: alternative_reading
