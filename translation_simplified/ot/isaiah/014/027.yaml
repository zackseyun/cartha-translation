translation:
  language: en
  text: For Yahweh of hosts[a] has made his plan, and who can stop it? He has stretched out his hand to act, and who can turn it back?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Yahweh of hosts” is a title presenting Yahweh as commander of heavenly and earthly armies.
    reason: cultural_note
