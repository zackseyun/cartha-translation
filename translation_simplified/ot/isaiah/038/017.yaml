translation:
  language: en
  text: Indeed, it was for my well-being that I suffered such bitterness. But you kept me from the pit of destruction,[a] for you threw all my sins behind your back.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “you loved my soul out of the pit of destruction.” The Hebrew verb can express deep love or attachment.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Behold, for my peace I had great bitterness
  simplified_phrase: Indeed, it was for my well-being that I suffered such bitterness
  preserved_meaning: Hezekiah’s bitter suffering was connected with his well-being without defining the precise relationship.
  reasoning_layer_used: Lexical decisions for לְשָׁלוֹם and מַר לִי מָר
  rationale: The wording uses natural English while preserving both severe suffering and broad well-being.
- pob_phrase: you have held my soul back from the pit of destruction
  simplified_phrase: you kept me from the pit of destruction
  preserved_meaning: God personally preserved Hezekiah’s life from destructive death while retaining the pit image.
  reasoning_layer_used: Lexical and theological decisions for חָשַׁקְתָּ, נַפְשִׁי, and מִשַּׁחַת בְּלִי
  rationale: “Me” clearly refers to the whole person in this death-deliverance context.
- pob_phrase: you have cast all my sins behind your back
  simplified_phrase: you threw all my sins behind your back
  preserved_meaning: God removed Hezekiah’s sins from his notice or regard.
  reasoning_layer_used: Lexical decision for הִשְׁלַכְתָּ אַחֲרֵי גֵוְךָ
  rationale: “Threw” is common English and preserves the vivid bodily metaphor.
