  preserved_meaning: He endured and waited for morning during his distress.
  reasoning_layer_used: POB lexical decision for שִׁוִּיתִי with the temporal phrase עַד בֹּקֶר
  rationale: The recast phrase expresses the same waiting in more natural everyday English.
- pob_phrase: all my bones
  simplified_phrase: every bone in my body
  preserved_meaning: The lion image conveys violent bodily suffering throughout his whole body.
  reasoning_layer_used: POB lexical decisions for יְשַׁבֵּר and כָּל עַצְמוֹתַי
  rationale: The fuller body phrase makes the concrete image immediately clear without weakening it.
