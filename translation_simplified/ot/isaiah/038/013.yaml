translation:
  language: en
  text: I waited for morning to come.[a] Like a lion, he breaks every bone in my body.[b] From day to night, you bring me to an end.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “I calmed myself until morning.” The opening Hebrew verb is difficult and may refer to waiting or composing oneself.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew shifts from “he breaks” to “you bring me to an end.” This poetic change in address is preserved here.
    reason: alternative_reading
