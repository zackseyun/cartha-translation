  preserved_meaning: The preceding realities sustain human life in general.
  reasoning_layer_used: Lexical and theological decisions on עֲלֵיהֶם and יִחְיוּ
  rationale: The active wording is clearer while “human beings” preserves the generic human subject.
- pob_phrase: in all these is the life of my spirit
