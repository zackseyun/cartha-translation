translation:
  language: en
  text: Lord, these things keep human beings alive[a], and all of them give life to my spirit. So restore me to health and let me live.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew has no stated subject and may also be translated “they live” or “one lives.”
    reason: lexical_alternative
