translation:
  language: en
  text: For the realm of the dead[a] does not thank you, and death does not praise you. Those who go down to the pit do not hope for your faithfulness.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew Sheol, the realm of the dead, not merely a burial place.
    reason: simplification_note
  - marker: b
    text: The Hebrew may also mean “do not wait for your truth.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Sheol
