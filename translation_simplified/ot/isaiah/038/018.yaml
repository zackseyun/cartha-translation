  preserved_meaning: The wording names the underworld or realm of death rather than only a grave.
  reasoning_layer_used: POB lexical decision for שְׁאוֹל
  rationale: The familiar explanation replaces an opaque Hebrew term while the footnote retains it.
- pob_phrase: death does not praise you;
  simplified_phrase: and death does not praise you.
  preserved_meaning: Death remains personified in poetic parallel with the realm of the dead.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Adding “and” makes the parallel clauses flow naturally without weakening the image.
translation_notes:
  risk_flags:
