translation:
  language: en
  text: 'Go tell Hezekiah, “This is what the LORD, the God of your ancestor David, says: I have heard your prayer and seen your tears. Look, I will give you fifteen more years to live.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Go and say to Hezekiah
  simplified_phrase: Go tell Hezekiah
  preserved_meaning: The command to deliver God’s message directly to Hezekiah remains intact.
  reasoning_layer_used: POB base text and source clause structure
  rationale: The shorter wording is natural English and keeps both the command and recipient.
- pob_phrase: Thus says the LORD
  simplified_phrase: This is what the LORD ... says
  preserved_meaning: The message is explicitly introduced as the LORD’s declaration.
  reasoning_layer_used: POB divine-name and speech formula decision
  rationale: The familiar formula becomes immediately understandable without weakening its authority.
- pob_phrase: I will add fifteen years to your days
  simplified_phrase: I will give you fifteen more years to live
  preserved_meaning: The LORD promises to extend Hezekiah’s life by fifteen years.
  reasoning_layer_used: POB base text and source time expression
  rationale: The idiom about adding to his days is recast in ordinary English.
interpretive_expansions:
- pob_phrase: David your father
  rendering: your ancestor David
  claim: David is identified as Hezekiah’s forefather rather than his immediate parent.
  evidence:
  - The POB kinship phrase applies “father” to the earlier king David.
  - Hezekiah’s royal identity in the immediate wording links him to David’s line.
  confidence: high
  alternatives_preserved:
  - David your father
  - David your forefather
- pob_phrase: add fifteen years to your days
  rendering: give you fifteen more years to live
  claim: The added days refer to an extension of Hezekiah’s lifespan.
  evidence:
  - The promise specifies fifteen years as the amount added to Hezekiah’s days.
  - The POB wording directly presents the addition as personal time granted to Hezekiah.
  confidence: high
  alternatives_preserved:
  - add fifteen years to your life
translation_notes:
  risk_flags:
  - risk: “Ancestor” does not preserve the source’s father image word for word.
    mitigation: It preserves the intended family-line relationship and prevents readers from mistaking David for Hezekiah’s immediate father.
  - risk: “Give ... years to live” replaces the concrete image of adding to one’s days.
    mitigation: The wording retains the exact fifteen-year extension while making the idiom clear.
