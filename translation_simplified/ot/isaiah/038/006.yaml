simplification_decisions:
- pob_phrase: deliver you and this city from the hand of the king of Assyria
  simplified_phrase: deliver both you and this city from the king of Assyria’s hand
  preserved_meaning: God promises to free Hezekiah and Jerusalem from the Assyrian king’s power.
  reasoning_layer_used: The lexical decisions retain “deliver” and the concrete image of the king’s hand.
  rationale: The reordered phrase is easier to follow while preserving the Hebrew image and military context.
- pob_phrase: and I will defend this city
  simplified_phrase: I will defend this city
  preserved_meaning: God also promises active protection for Jerusalem.
  reasoning_layer_used: The lexical rationale identifies “defend” as active military protection.
  rationale: A separate sentence makes the second promise clear without merging it with deliverance.
