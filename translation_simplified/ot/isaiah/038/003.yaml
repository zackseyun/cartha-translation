  simplified_phrase: Hezekiah said
  preserved_meaning: Hezekiah is the speaker.
  reasoning_layer_used: Immediate context and the named subject in the final clause
  rationale: Naming the speaker removes an unclear pronoun without changing the referent.
- pob_phrase: and have done what is good in your eyes
  simplified_phrase: I have done what you consider good
  preserved_meaning: Hezekiah says his conduct met God's standard of goodness.
  reasoning_layer_used: POB lexical rationale for the evaluative idiom
  rationale: The rewrite states the idiom's meaning in ordinary English.
- pob_phrase: And Hezekiah wept greatly
  simplified_phrase: Then Hezekiah wept bitterly
  preserved_meaning: Hezekiah wept with great emotional intensity.
  reasoning_layer_used: POB lexical decision for the Hebrew intensity construction
  rationale: “Wept bitterly” naturally conveys intense weeping in modern English.
