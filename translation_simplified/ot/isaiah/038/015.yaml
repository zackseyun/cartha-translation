  text: What can I say? He spoke to me, and he himself made it happen. Through all my years, I will move slowly through life because of the bitterness in my soul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I will move quietly through all my years in the bitterness of my soul.” The rare verb may suggest slow or subdued movement, and the bitterness may describe either the reason or the manner.
