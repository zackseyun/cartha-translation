translation:
  language: en
  text: 'In those days, Hezekiah became so sick that he was near death. Then Isaiah son of Amoz, the prophet, came to him and said, “This is what Yahweh says: Put your household affairs in order, because you are about to die[a]. You will not live.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression announces his impending death as certain; it can be translated more literally, “you are dying” or “you are dead.”
    reason: lexical_alternative
