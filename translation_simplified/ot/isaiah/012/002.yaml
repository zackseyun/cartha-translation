translation:
  language: en
  text: See, God is my salvation. I will trust and not be afraid, because Yah, Yahweh,[a] is my strength and my song.[b] He has become my salvation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew uses “Yah,” a short form of “Yahweh,” followed by “Yahweh” for poetic emphasis.
    reason: source_note
  - marker: b
    text: This line closely echoes Exodus 15:2.
    reason: cross_reference
simplification_decisions:
- pob_phrase: Behold
  simplified_phrase: See
  preserved_meaning: An emphatic call to pay attention.
  reasoning_layer_used: Lexical decision for הִנֵּה
  rationale: “See” gives the same attention marker in familiar modern English.
- pob_phrase: for Yah, Yahweh, is my strength and song
  simplified_phrase: because Yah, Yahweh, is my strength and my song
  preserved_meaning: Confidence rests on Yahweh as the speaker’s strength and song.
  reasoning_layer_used: Lexical decisions and Exodus 15:2 theological decision
  rationale: “Because” makes the logical connection clear while retaining the divine names and poetic pairing.
- pob_phrase: and he has become my salvation
  simplified_phrase: He has become my salvation.
  preserved_meaning: The speaker has experienced God as salvation, repeating the verse’s key term.
  reasoning_layer_used: Lexical decision for וַיְהִי לִי לִישׁוּעָה
  rationale: A separate sentence reduces complexity without weakening the repeated confession.
