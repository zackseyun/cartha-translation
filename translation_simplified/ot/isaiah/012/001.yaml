translation:
  language: en
  text: When that day comes, you will say, “I will praise you, Yahweh,[a] because even though you were angry with me, your anger has turned away, and you comfort me.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “I will thank you” or “I will give thanks to you.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And you will say in that day
  simplified_phrase: When that day comes, you will say
  preserved_meaning: The speaker will respond at the promised future time.
  reasoning_layer_used: The lexical rationale identifies this as a future prophetic expression.
  rationale: The reordered clause makes the future time reference immediately clear.
- pob_phrase: for though you were angry with me
  simplified_phrase: because even though you were angry with me
  preserved_meaning: Yahweh’s anger had opposed the speaker, but its removal and his comfort give reason for praise.
  reasoning_layer_used: The lexical and theological decisions require both the causal and concessive senses.
  rationale: “Because even though” states the reason for praise while preserving the contrast.
- pob_phrase: your anger has turned away, and you comfort me
  simplified_phrase: your anger has turned away, and you comfort me
  preserved_meaning: Yahweh’s anger has ceased, and his comfort continues.
  reasoning_layer_used: The lexical decisions preserve the turning-away image and ongoing comfort.
  rationale: The wording is already clear and retains both distinct source ideas.
translation_notes:
  risk_flags:
  - risk: “When that day comes” is less formally prophetic than “in that day.”
    mitigation: It still identifies the promised future time without defining its exact scope.
