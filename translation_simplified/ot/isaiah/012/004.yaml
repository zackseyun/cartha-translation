translation:
  language: en
  text: 'On that day you will say: “Give thanks to Yahweh[a] and call on his name. Tell the peoples what he has done. Proclaim that his name is exalted.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses God’s divine name, YHWH, here rendered “Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Or, “Proclaim, for his name is exalted.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And you will say on that day
  simplified_phrase: On that day you will say
  preserved_meaning: The people will speak at the future time announced by the prophet.
  reasoning_layer_used: Lexical decision for וַאֲמַרְתֶּם and the prophetic time marker
  rationale: Natural English places the time phrase first while keeping the future sense.
- pob_phrase: Make his deeds known among the peoples
  simplified_phrase: Tell the peoples what he has done
  preserved_meaning: God’s actions are to be publicly made known to other peoples.
  reasoning_layer_used: Lexical decisions for הוֹדִיעוּ, בָעַמִּים, and עֲלִילֹתָיו
  rationale: The active wording replaces an abstract expression without adding “mighty” or narrowing the audience.
- pob_phrase: proclaim that his name is exalted
  simplified_phrase: Proclaim that his name is exalted
  preserved_meaning: The worshipers publicly declare the majesty of God’s name.
  reasoning_layer_used: Lexical and theological decision for הַזְכִּירוּ כִּי נִשְׂגָּב שְׁמוֹ
  rationale: The key biblical term “exalted” remains because simpler substitutes would weaken the image of majestic height.
translation_notes:
  risk_flags:
  - risk: The Hebrew conjunction may mean “for” rather than introduce what is proclaimed.
    mitigation: The causal reading is preserved in footnote b.
  - risk: Readers may not recognize Yahweh as the divine name represented by YHWH.
    mitigation: Footnote a identifies the name without replacing the chosen main-text rendering.
