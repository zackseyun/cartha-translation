simplification_decisions:
- pob_phrase: just as I swore ... so I have sworn
  simplified_phrase: I swore ... In the same way, I have sworn
  preserved_meaning: God’s present oath is compared directly with his oath concerning Noah’s flood.
  reasoning_layer_used: Lexical and theological decisions on אֲשֶׁר and כֵּן
  rationale: Two sentences make the comparison easier to follow without weakening its logic.
- pob_phrase: the waters of Noah would never again pass over the earth
  simplified_phrase: those waters would never again sweep over the earth
  preserved_meaning: The floodwaters would never again move destructively over the earth.
  reasoning_layer_used: Lexical decision on מֵעֲבֹר and עַל הָאָרֶץ
  rationale: “Sweep over” makes the motion and force of the flood image clearer.
