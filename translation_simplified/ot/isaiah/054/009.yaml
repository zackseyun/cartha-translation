translation:
  language: en
  text: For this is like the waters of Noah to me.[a] I swore that those waters would never again sweep over the earth. In the same way, I have sworn that I will not be angry with you or rebuke you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some ancient versions read “the days of Noah,” but the Hebrew text says “the waters of Noah.”
