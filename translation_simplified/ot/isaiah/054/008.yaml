- pob_phrase: In a surge of wrath
  simplified_phrase: In a burst of anger
  preserved_meaning: Yahweh’s anger came as an intense outburst.
  reasoning_layer_used: The lexical decision says the rare paired nouns intensify anger and may describe a burst or surge.
  rationale: “Burst of anger” gives the poetic phrase in clear, common English.
- pob_phrase: I hid my face from you for a moment
  simplified_phrase: I turned my face away from you for a moment
  preserved_meaning: Yahweh briefly withdrew his favor or presence while the face image remains intact.
  reasoning_layer_used: The lexical rationale identifies the wording as an idiom and approves “turned my face away” as an alternative.
  rationale: This wording clarifies the idiom while keeping the brief duration attached to the withdrawal.
- pob_phrase: I have had compassion on you
  simplified_phrase: I have shown you compassion
  preserved_meaning: Yahweh declares that he has acted toward his people with deep mercy.
  reasoning_layer_used: The lexical decision defines the verb as deep compassion or mercy.
  rationale: “Shown you compassion” expresses the action in natural English.
interpretive_expansions:
