translation:
  language: en
  text: Sing, woman unable to have children, you who have not given birth! Burst into song and shout for joy, you who have not been in labor! For the desolate woman has more[a] children than the married woman, says Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew states the comparison compactly and may also be expressed, “The desolate woman’s children are many—more numerous than the married woman’s.”
    reason: lexical_alternative
