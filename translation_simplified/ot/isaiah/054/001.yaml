  simplified_phrase: woman unable to have children, you who have not given birth
  preserved_meaning: The addressee is unable to bear children and has not given birth.
  reasoning_layer_used: Lexical decisions for עֲקָרָה and לֹא יָלָדָה
  rationale: Common wording explains “barren” while preserving the separate description that she has not given birth.
- pob_phrase: break forth into singing
  simplified_phrase: Burst into song
  preserved_meaning: She is commanded to begin singing suddenly and joyfully.
  reasoning_layer_used: Lexical decisions for פִּצְחִי and רִנָּה
  rationale: This familiar phrase preserves the vivid image of song breaking out.
- pob_phrase: the children of the desolate woman are more than the children of the married woman
