  language: en
  text: 'Know this: if anyone rises against you,[a] their hostility does not come from me. Whoever rises against you will fall in defeat before you.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be rendered “gathers against you”; it refers here to hostile opposition.
    reason: lexical_alternative
