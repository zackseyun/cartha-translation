  reasoning_layer_used: Lexical decisions for כְּלִי, יוּצַר, and עָלַיִךְ
  rationale: “Made to attack” expresses the hostile setting in ordinary English.
- pob_phrase: every tongue that rises against you in judgment you will condemn
  simplified_phrase: You will condemn every tongue that rises to accuse you in judgment
  preserved_meaning: Yahweh’s servants will defeat every hostile accusation in a legal setting.
  reasoning_layer_used: Lexical decisions for לָשׁוֹן, תָּקוּם, לַמִּשְׁפָּט, and תַּרְשִׁיעִי
  rationale: The reordered clause retains universal scope, the tongue image, and the legal force.
- pob_phrase: their righteousness is from me
  simplified_phrase: their righteousness comes from me
  preserved_meaning: The servants’ righteousness has Yahweh as its source.
  reasoning_layer_used: Theological decision on צִדְקָתָם and lexical decision on מֵאִתִּי
  rationale: “Comes from me” states source naturally without reducing righteousness to vindication alone.
