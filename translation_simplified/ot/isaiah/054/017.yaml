translation:
  language: en
  text: No weapon made to attack you will succeed. You will condemn every tongue that rises to accuse you in judgment.[a] This is the heritage of Yahweh’s servants, and their righteousness comes from me,[b] declares Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “you will prove it guilty.” The Hebrew uses legal language for declaring guilt.
    reason: lexical_alternative
  - marker: b
    text: Or “their vindication comes from me.” The Hebrew can have this legal sense here.
    reason: alternative_reading
