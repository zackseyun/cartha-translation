simplification_decisions:
- pob_phrase: your husband is your Maker
  simplified_phrase: the one who made you is your husband
  preserved_meaning: Zion’s Maker is described through the explicit marital metaphor of her husband.
  reasoning_layer_used: lexical and theological decisions
  rationale: This replaces the less familiar title “Maker” while preserving the marital image.
- pob_phrase: Yahweh of Armies is his name
  simplified_phrase: His name is Yahweh of Armies
  preserved_meaning: God’s personal name and the military force of his title remain unchanged.
  reasoning_layer_used: lexical and theological decisions
  rationale: Ordinary English word order makes the title easier to read without weakening it.
- pob_phrase: And your Redeemer is the Holy One of Israel
  simplified_phrase: The Holy One of Israel is your Redeemer
  preserved_meaning: Both established divine titles still identify the same one who rescues Zion.
  reasoning_layer_used: lexical decisions
  rationale: Reordering the clause gives the sentence a clearer subject and predicate.
