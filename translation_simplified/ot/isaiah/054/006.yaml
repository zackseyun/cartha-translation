translation:
  language: en
  text: For Yahweh has called you like an abandoned wife grieving deep within[a]—like a wife married in her youth when she is rejected[b], says your God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be translated “an abandoned woman grieving deep within,” but the marriage imagery favors “wife.”
    reason: lexical_alternative
  - marker: b
    text: The compact Hebrew clause can carry slightly different nuances, such as “when,” “if,” or “though she is rejected or despised.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: like a wife forsaken and grieved in spirit
  simplified_phrase: like an abandoned wife grieving deep within
  preserved_meaning: The wife has been left behind and suffers profound inner anguish.
  reasoning_layer_used: Lexical decisions for עֲזוּבָה and וַעֲצוּבַת רוּחַ
  rationale: Common wording preserves both abandonment and deep inner grief.
- pob_phrase: like a wife of youth
  simplified_phrase: like a wife married in her youth
  preserved_meaning: She is a wife whose marriage began when she was young.
  reasoning_layer_used: Lexical decision for וְאֵשֶׁת נְעוּרִים
  rationale: The wording explains the compact Hebrew image while retaining marriage and youth.
- pob_phrase: when she is rejected
  simplified_phrase: when she is rejected
  preserved_meaning: The rejection remains a temporal or conditional circumstance without imposing a definite sequence.
  reasoning_layer_used: Lexical decision and alternative-reading note for כִּי תִמָּאֵס
  rationale: Keeping “when” avoids the unwarranted chronology implied by “and then.”
translation_notes:
  risk_flags:
  - risk: “Married in her youth” explains rather than formally reproduces “wife of youth.”
    mitigation: It retains both the marriage image and the reference to youth.
  - risk: The main text uses “when,” though the compact Hebrew may allow other nuances.
    mitigation: Footnote b preserves the conditional and concessive alternatives.
