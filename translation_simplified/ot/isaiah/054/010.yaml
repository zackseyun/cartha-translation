translation:
  language: en
  text: “For the mountains could move away, and the hills could be shaken. But my steadfast love[a] will never move away from you, and my covenant of peace[b] will never be shaken,” says Yahweh, who has compassion on you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Steadfast love” also means loyal, covenant love.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word for “peace” includes wholeness and well-being.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the mountains may depart
  simplified_phrase: the mountains could move away
  preserved_meaning: Even mountains, symbols of stability, can be removed from their place.
  reasoning_layer_used: POB lexical decision for מוּשׁ and cosmic-stability imagery
  rationale: “Move away” makes physical departure clearer while supporting its repetition with God's love.
- pob_phrase: my steadfast love will not depart from you
  simplified_phrase: my steadfast love will never move away from you
  preserved_meaning: Yahweh's loyal love will not be separated from his people.
  reasoning_layer_used: POB lexical and theological decisions for חֶסֶד
  rationale: “Never move away” states the contrast naturally and preserves the mountain image.
- pob_phrase: the hills may be shaken ... my covenant of peace will not be shaken
  simplified_phrase: the hills could be shaken ... my covenant of peace will never be shaken
  preserved_meaning: Created landmarks may become unstable, but Yahweh's covenant remains secure.
  reasoning_layer_used: POB doctrine realignment preserving the repeated מוֹט verb
  rationale: Repeating “shaken” keeps the deliberate contrast between the hills and the covenant.
translation_notes:
