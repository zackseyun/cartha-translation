translation:
  language: en
  text: Look, I myself have created the metalworker who fans a coal fire and makes a weapon for his work.[a][b] I myself have also created the destroyer to bring ruin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word translated “weapon” can also mean an implement or other article.
    reason: lexical_alternative
  - marker: b
    text: Or “makes a weapon for the work it will do.”
    reason: alternative_reading
