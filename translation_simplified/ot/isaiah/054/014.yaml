translation:
  language: en
  text: You will be firmly established in righteousness.[a] You will be far from oppression, for you will not be afraid; and far from terror,[b] for it will not come near you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “You will be firmly established by righteousness.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word may also mean “destruction” or “ruin.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: In righteousness you will be established
  simplified_phrase: You will be firmly established in righteousness
  preserved_meaning: Zion will be made firm in righteousness without resolving whether righteousness is the sphere or means.
  reasoning_layer_used: Lexical decisions for בִּצְדָקָה and תִּכּוֹנָנִי
  rationale: Natural word order and “firmly” clarify the passive image while footnote a preserves the alternative.
- pob_phrase: you will be far from oppression, for you will not fear
  simplified_phrase: You will be far from oppression, for you will not be afraid
  preserved_meaning: Freedom from fear remains the stated assurance connected with distance from oppression.
  reasoning_layer_used: POB translation and lexical decisions for עֹשֶׁק and כִּי לֹא תִירָאִי
  rationale: “Afraid” is more natural common English, while “for” retains the Hebrew clause relationship.
- pob_phrase: and from terror, for it will not come near you
  simplified_phrase: and far from terror, for it will not come near you
  preserved_meaning: Terror is pictured as a threat that will remain distant and cannot approach Zion.
  reasoning_layer_used: Lexical decision for מְחִתָּה and grammatical agreement of תִקְרַב
  rationale: Supplying “far” completes the English phrase without weakening the personified image or its explanation.
translation_notes:
  risk_flags:
  - risk: The preposition with “righteousness” may indicate either sphere or means.
    mitigation: The main text retains “in,” and footnote a preserves “by” as an alternative.
  - risk: “Terror” may also denote destruction or ruin.
    mitigation: Footnote b preserves the broader lexical range.
