translation:
  language: en
  text: They will be rounded up like prisoners and put into a pit. They will be locked in prison, and after a long time they will be punished.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “they will be visited.” The Hebrew can mean that they will be attended to or called to account, but punishment is most likely here.
    reason: alternative_reading
