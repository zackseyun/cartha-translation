translation:
  language: en
  text: The city of chaos[a] lies in ruins. Every house is shut so that no one can enter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the city of emptiness” or “the desolate city.” The Hebrew word can describe chaos, emptiness, or desolation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: is broken down
  simplified_phrase: lies in ruins
  preserved_meaning: The city has been broken and remains in a ruined state.
  reasoning_layer_used: The lexical decision identifies a passive, resultative sense suited to urban collapse.
  rationale: “Lies in ruins” clearly pictures the devastated state of the city.
- pob_phrase: every house is shut up so that none may enter
  simplified_phrase: Every house is shut so that no one can enter
  preserved_meaning: Each house is closed in a way that prevents entry.
  reasoning_layer_used: The lexical decisions preserve both physical closure and prevented access.
  rationale: “Shut” avoids suggesting a specific means of closure while keeping the result clear.
translation_notes:
  risk_flags:
  - risk: “Chaos” may sound narrower than the Hebrew word, which can also mean emptiness or desolation.
    mitigation: The footnote preserves the documented lexical range.
