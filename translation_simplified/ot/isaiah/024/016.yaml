translation:
  language: en
  text: 'From the edge of the earth[a] we hear songs: “Glory to the righteous one.”[b] But I say, “I am wasting away! I am wasting away! Woe is me! The treacherous act treacherously; they commit treachery upon treachery.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “from the wing of the earth” or “from the ends of the earth.”
    reason: lexical_alternative
  - marker: b
    text: Or “Glory to the righteous,” if the singular expression refers collectively to righteous people.
    reason: alternative_reading
  - marker: c
    text: The Hebrew translated “I am wasting away” is difficult; it may instead mean “My secret is mine” or “A mystery to me.”
    reason: alternative_reading
