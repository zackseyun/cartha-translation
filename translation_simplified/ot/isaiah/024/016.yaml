  preserved_meaning: Faithless people continue to behave with deliberate treachery.
  reasoning_layer_used: POB lexical decision for בֹּגְדִים בָּגָדוּ
  rationale: “Act” is more natural than “deal” here while retaining the Hebrew root repetition.
- pob_phrase: with treachery the treacherous deal treacherously
