translation:
  language: en
  text: 'This is what will happen: Anyone who runs from the sound of terror will fall into the pit. Anyone who comes up out of the pit will be caught in a trap. For the windows high above are opened,[a] and the foundations of the earth shake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the floodgates of heaven are opened.” The Hebrew more literally says, “the windows from on high are opened.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: 'And it will happen: the one who flees'
  simplified_phrase: 'This is what will happen: Anyone who runs'
  preserved_meaning: The wording introduces the coming result and keeps the fleeing person generic.
  reasoning_layer_used: POB lexical decisions for וְהָיָה and הַנָּס
  rationale: The recast opening is direct modern English without weakening its predictive force.
- pob_phrase: the one who comes up from the midst of the pit
  simplified_phrase: Anyone who comes up out of the pit
  preserved_meaning: A person who emerges from inside the pit still faces another trap.
  reasoning_layer_used: POB lexical decision for וְהָעוֹלֶה מִתּוֹךְ הַפַּחַת and grounding review
  rationale: “Comes up out of” keeps the spatial movement without adding climbing as the means.
- pob_phrase: the windows from on high
  simplified_phrase: the windows high above
  preserved_meaning: Openings above unleash judgment while the exact mechanism remains unspecified.
  reasoning_layer_used: POB lexical and theological decisions for אֲרֻבּוֹת מִמָּרוֹם
  rationale: The simpler word order preserves the source image and leaves the traditional alternative in a note.
