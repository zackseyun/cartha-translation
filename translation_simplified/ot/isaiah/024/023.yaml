translation:
  language: en
  text: Then the moon will be ashamed, and the sun will be disgraced. This will happen because Yahweh of hosts reigns on Mount Zion and in Jerusalem. Before his elders[a], there is glory.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “its elders,” referring to Zion or Jerusalem rather than to Yahweh.
    reason: alternative_reading
  - marker: b
    text: The Hebrew ends tersely with “glory” and may mean “his glory” or simply “glory.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: for Yahweh of hosts reigns
  simplified_phrase: This will happen because Yahweh of hosts reigns
  preserved_meaning: Yahweh’s reign explains why the moon and sun are shamed.
  reasoning_layer_used: lexical decision for כִּי and מָלַךְ
  rationale: A separate explanatory sentence makes the causal relationship immediately clear.
- pob_phrase: the moon will be ashamed, and the sun disgraced
  simplified_phrase: the moon will be ashamed, and the sun will be disgraced
  preserved_meaning: Both heavenly lights are poetically portrayed as humiliated.
  reasoning_layer_used: lexical decisions for חפר and בוש
  rationale: Repeating “will be” gives the parallel clauses a complete and natural English form.
- pob_phrase: and before his elders there is glory
  simplified_phrase: Before his elders, there is glory
  preserved_meaning: Glory is manifested in the presence of elders associated primarily with Yahweh.
  reasoning_layer_used: lexical and theological decisions for זְקֵנָיו and כָּבוֹד
  rationale: A new sentence clarifies the terse final clause without assigning the glory more specifically than the Hebrew does.
translation_notes:
  risk_flags:
  - risk: Modern readers may not understand the title “Yahweh of hosts.”
    mitigation: The title is retained because POB preserves its broad sense rather than narrowing it to one kind of army.
  - risk: The referent of “his” and the exact force of the final word “glory” remain uncertain.
    mitigation: Both documented ambiguities are preserved in footnotes.
