translation:
  language: en
  text: That is why a curse[a] has devoured the earth.[b] Those who live on it bear their guilt. That is why the people of the earth are scorched, and only a few people remain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “an oath,” but “curse” fits the broken covenant and judgment described here.
    reason: lexical_alternative
  - marker: b
    text: Or “the land”; “earth” is used because the chapter presents the judgment as worldwide.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Therefore
  simplified_phrase: That is why
  preserved_meaning: The judgment results from the wrongdoing described in the previous verse.
  reasoning_layer_used: Lexical decision for עַל כֵּן and immediate context
  rationale: The common phrase keeps the causal force and its repetition.
- pob_phrase: those who dwell in it
  simplified_phrase: Those who live on it
  preserved_meaning: The statement concerns the earth’s inhabitants.
  reasoning_layer_used: Lexical decision for יֹשְׁבֵי בָהּ
  rationale: “Live” is more natural modern English than “dwell.”
- pob_phrase: few men are left
  simplified_phrase: only a few people remain
  preserved_meaning: A very small number of human beings survive the judgment.
  reasoning_layer_used: Lexical decisions for אֱנוֹשׁ, מִזְעָר, and וְנִשְׁאַר
  rationale: “People” clearly communicates the collective reference to humanity.
translation_notes:
  risk_flags:
  - risk: “People” does not directly convey the Hebrew term’s emphasis on mortal humanity.
    mitigation: The wording still preserves its collective human reference without implying adult males only.
  - risk: Modern readers may understand “curse” as casual hostile speech.
    mitigation: The footnote identifies it as the consequence of a broken covenant and divine judgment.
