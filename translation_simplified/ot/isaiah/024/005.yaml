translation:
  language: en
  text: The earth is defiled by the people who live on it, because they have disobeyed laws, violated an established law,[a] and broken the everlasting covenant.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “changed an established law.” The Hebrew may mean altering it or overstepping it.
    reason: lexical_alternative
  - marker: b
    text: This covenant is not identified here. It may refer to the covenant with Noah or to God’s enduring moral order for humanity.
    reason: alternative_reading
