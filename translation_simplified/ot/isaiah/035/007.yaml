translation:
  language: en
  text: The burning sand[a] will become a pool, and the thirsty ground will become springs of water. Where jackals make their home and lie down,[b] grass, reeds, and rushes will grow.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the mirage.” The Hebrew can describe either parching heat or the shimmering desert landscape.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also mean “in the jackals’ dwelling place, their resting place.”
    reason: lexical_alternative
