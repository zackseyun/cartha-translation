  reasoning_layer_used: POB lexical decisions for צִמָּאוֹן and לְמַבּוּעֵי מָיִם
  rationale: Adding “will become” makes the parallel transformation clear without changing its image.
- pob_phrase: in the haunt of jackals, where they lie down
