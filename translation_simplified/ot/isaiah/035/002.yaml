translation:
  language: en
  text: It will be covered with blossoms. It will rejoice greatly and shout for joy. It will receive the glory of Lebanon and the majesty of Carmel and Sharon.[a] They[b] will see the glory of Yahweh, the majesty of our God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lebanon, Carmel, and Sharon were famous for their beauty and fertile land.
    reason: cultural_note
  - marker: b
    text: The Hebrew says “they,” likely referring to the people of the restored land, though it may continue the poetic focus on the renewed regions.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: will blossom abundantly
  simplified_phrase: will be covered with blossoms
  preserved_meaning: The land will flourish with an abundance of flowers.
  reasoning_layer_used: The lexical decision requires both emphatic abundance and the concrete blossoming image.
  rationale: The new wording makes the abundant transformation immediately visible.
- pob_phrase: rejoice—yes, with rejoicing and a shout of joy
  simplified_phrase: rejoice greatly and shout for joy
  preserved_meaning: The personified land celebrates with intense, audible joy.
  reasoning_layer_used: The lexical decisions preserve intensified rejoicing and a climactic joyful cry.
  rationale: The simpler clause keeps both the strong joy and the separate shout.
- pob_phrase: will be given to it
  simplified_phrase: will receive
  preserved_meaning: The renewed land will be granted the splendor associated with those regions.
  reasoning_layer_used: The lexical decision establishes a future restoration in which the land gains this glory.
  rationale: The active wording is easier to follow without naming an unstated giver.
translation_notes:
  risk_flags:
  - risk: The plural “They” has an uncertain poetic referent.
    mitigation: The main text retains the pronoun, and footnote b preserves the documented alternatives.
