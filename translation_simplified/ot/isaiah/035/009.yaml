translation:
  language: en
  text: No lion will be there. No ravenous wild animal will come onto that road or be found there. But the redeemed will walk there.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “it,” likely referring to the highway in the previous verse.
    reason: cross_reference
  - marker: b
    text: The Hebrew word translated “redeemed” differs from the word translated “ransomed” in the next verse.
    reason: source_note
simplification_decisions:
- pob_phrase: and no ravenous beast will go up on it; it will not be found there
  simplified_phrase: No ravenous wild animal will come onto that road or be found there.
  preserved_meaning: No fierce predatory animal will enter or be present on the way.
  reasoning_layer_used: Lexical decisions for פְרִיץ חַיּוֹת, יַעֲלֶנָּה, and תִמָּצֵא
  rationale: “Wild animal” is clearer than “beast,” while “ravenous” preserves the animal’s threatening force.
- pob_phrase: but the redeemed will walk there
  simplified_phrase: But the redeemed will walk there.
  preserved_meaning: Those reclaimed through redemption will travel safely there.
  reasoning_layer_used: Theological decision for גְּאוּלִים
  rationale: “The redeemed” remains because it preserves the key term and its distinction from “ransomed” in verse 10.
- pob_phrase: No lion will be there, and no ravenous beast
  simplified_phrase: No lion will be there. No ravenous wild animal
  preserved_meaning: The place will be free from lions and other dangerous animals.
  reasoning_layer_used: Source syntax and lexical decisions
  rationale: Two short sentences make the safety contrast easier to follow without merging the two animal images.
