translation:
  language: en
  text: A highway will be there, a road called the Holy Way. No one who is unclean[a] will travel on it. This way will be for God’s people.[b] Anyone who travels on it, even a fool, will not go astray.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Unclean” may include ritual or moral impurity; the Hebrew does not limit it to one kind.
    reason: simplification_note
  - marker: b
    text: The Hebrew clause is difficult and may also mean “he will be with them” or “the way will belong to them.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And there shall be a highway there, and a road, and it shall be called the Holy Way
  simplified_phrase: A highway will be there, a road called the Holy Way
  preserved_meaning: A prepared road will exist there and bear the sacred name “Holy Way.”
  reasoning_layer_used: POB lexical decisions for מַסְלוּל, דֶּרֶךְ, and הַקֹּדֶשׁ
  rationale: The opening becomes a direct sentence while retaining both the highway image and the holy title.
- pob_phrase: The unclean shall not pass over it
  simplified_phrase: No one who is unclean will travel on it
  preserved_meaning: People who are unclean will be excluded from using the way.
  reasoning_layer_used: POB lexical and theological decisions for טָמֵא and יַעַבְרֶנּוּ
  rationale: “Will travel” preserves the declarative exclusion and movement imagery without narrowing uncleanness.
- pob_phrase: whoever walks on the way—even fools—shall not go astray
  simplified_phrase: Anyone who travels on it, even a fool, will not go astray
  preserved_meaning: Even foolish travelers on this way will not stray from it.
  reasoning_layer_used: POB lexical decisions for הֹלֵךְ דֶּרֶךְ, אֱוִילִים, and לֹא יִתְעוּ
  rationale: Ordinary travel language keeps both the reference to fools and the image of straying.
interpretive_expansions:
- pob_phrase: it shall be for them
  rendering: This way will be for God’s people
  claim: “Them” refers to the people for whom God provides the way.
  evidence:
  - The POB rationale identifies “them” as God’s redeemed people.
  - Isaiah 35:9–10 describes the travelers as the redeemed and ransomed.
  confidence: moderate
  alternatives_preserved:
  - he will be with them
  - the way will belong to them
translation_notes:
  risk_flags:
  - risk: “God’s people” makes the unclear pronoun’s referent explicit.
    mitigation: The main text follows the POB decision, and footnote b preserves other readings.
  - risk: Modern readers may take “unclean” to mean physically dirty.
    mitigation: Footnote a preserves its broad ritual and moral resonance.
