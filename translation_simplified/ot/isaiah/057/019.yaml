  text: “I create the fruit of the lips—what lips produce. ‘Peace, peace to the one far away and to the one near,’ says Yahweh, ‘and I will heal him.’”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Creating the fruit of the lips
  simplified_phrase: I create the fruit of the lips—what lips produce
  preserved_meaning: Yahweh brings forth a spoken response, while the Hebrew fruit image and its broad meaning remain intact.
  reasoning_layer_used: Lexical decisions for בּוֹרֵא and נוב שְׂפָתָיִם
  rationale: A finite clause and brief explanation clarify the compressed idiom without making the peace proclamation its content.
- pob_phrase: to the one far off and to the one near
  simplified_phrase: to the one far away and to the one near
  preserved_meaning: Peace is proclaimed to distant and nearby recipients without identifying the groups.
  reasoning_layer_used: Theological decision on the recipients’ identity
  rationale: “Far away” is natural English and preserves the deliberate openness.
- pob_phrase: and I will heal him
  simplified_phrase: and I will heal him
  preserved_meaning: Yahweh promises healing while retaining the Hebrew singular expression.
  reasoning_layer_used: Lexical decision for וּרְפָאתִיו
  rationale: Keeping “him” avoids implying that healing applies to only one unspecified recipient.
