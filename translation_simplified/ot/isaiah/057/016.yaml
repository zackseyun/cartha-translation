translation:
  language: en
  text: For I will not keep contending with them forever or remain angry without end. Otherwise, the human spirit[a] would grow faint before me, and the breaths of life that I have made would fail.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Spirit” can also mean “breath”; “breaths of life” may also be rendered “souls” or “lives.”
    reason: lexical_alternative
