translation:
  language: en
  text: Behind the door and the doorpost, you set up your memorial symbol.[a] For you uncovered yourself, turning away from me, and went up. You made your bed wider and made a covenant for yourself with them.[b] You loved their bed. You gazed at a hand.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “you set up your memorial.” This may be an idolatrous token hidden from view.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew uses the language of making a covenant, though the word “covenant” is not directly stated.
    reason: source_note
  - marker: c
    text: Hebrew “a hand.” This obscure phrase may refer to a monument or marker, or it may be a sexual expression.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: you set up your memorial
  simplified_phrase: you set up your memorial symbol
  preserved_meaning: The object remains a concrete but ambiguous remembrance token.
  reasoning_layer_used: Lexical decision and footnote a
  rationale: “Memorial symbol” explains the object without confidently calling it an idol.
- pob_phrase: for away from me you uncovered yourself and went up
  simplified_phrase: For you uncovered yourself, turning away from me, and went up
  preserved_meaning: The clause keeps both its connection to the preceding charge and its separation from God.
  reasoning_layer_used: Lexical decision and grounding review
  rationale: The recast clause makes the apostate movement natural in English while retaining “for.”
- pob_phrase: you made your bed wide, and you made a covenant for yourself with them
  simplified_phrase: You made your bed wider and made a covenant for yourself with them
  preserved_meaning: The sexual bed image and the self-directed covenant action remain distinct.
  reasoning_layer_used: Lexical and theological decisions
  rationale: The shorter coordination improves flow while preserving the force of “for yourself.”
