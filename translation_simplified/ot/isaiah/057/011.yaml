translation:
  language: en
  text: Who did you dread and fear so much that you lied? You did not remember me or take it to heart. Was it not because I have kept silent for so long that you do not fear me?
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And whom did you dread and fear, so that you lied
  simplified_phrase: Who did you dread and fear so much that you lied?
  preserved_meaning: Fear of others led the people to lie.
  reasoning_layer_used: Lexical decisions for דאג, ירא, and the result force of כי
  rationale: The wording keeps both fear terms and makes their link to lying natural in English.
- pob_phrase: did not lay it to your heart
  simplified_phrase: or take it to heart
  preserved_meaning: They did not seriously consider God or his claims.
  reasoning_layer_used: Lexical decision for the Hebrew heart idiom
  rationale: The common English idiom preserves the heart image and its inward seriousness.
- pob_phrase: I have kept silent, and that from long ago
  simplified_phrase: I have kept silent for so long
  preserved_meaning: God's silence had continued for a long time.
  reasoning_layer_used: Lexical and theological decisions on divine silence
  rationale: This recasts the duration naturally without implying indifference or approval.
translation_notes:
  risk_flags:
  - risk: “For so long” expresses duration rather than the more literal starting point “from long ago.”
    mitigation: It preserves the POB decision that God's silence had lasted a long time.
