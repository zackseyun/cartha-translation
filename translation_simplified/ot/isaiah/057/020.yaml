translation:
  language: en
  text: But wicked people are like a sea being tossed about. It cannot become calm, and its waters toss up sludge and mud.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the wicked
  simplified_phrase: wicked people
  preserved_meaning: The phrase refers to people who are wicked, not to wickedness as an abstract idea.
  reasoning_layer_used: POB lexical decision for וְהָרְשָׁעִים
  rationale: Adding “people” prevents an abstract reading while keeping the contrast with the previous verse.
- pob_phrase: the tossing sea
  simplified_phrase: a sea being tossed about
  preserved_meaning: The sea is pictured as driven and continually disturbed.
  reasoning_layer_used: POB lexical and theological decisions for נִגְרָשׁ
  rationale: The passive wording preserves the source image of the sea being driven while using natural English.
- pob_phrase: mire and mud
  simplified_phrase: sludge and mud
  preserved_meaning: The waters bring up two kinds of muddy filth.
  reasoning_layer_used: POB lexical decisions for רֶפֶשׁ and טִיט
  rationale: “Sludge” makes the less familiar word “mire” immediately understandable without losing the dirty-water image.
translation_notes:
