  preserved_meaning: God’s anger was caused by the person’s morally wrong gain.
  reasoning_layer_used: Lexical decision for בַּעֲוֺן and בִּצְעוֹ
  rationale: The clause is reordered and “iniquity” becomes the common adjective “sinful.”
- pob_phrase: I hid myself and was angry
