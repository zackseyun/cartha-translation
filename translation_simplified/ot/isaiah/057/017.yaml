translation:
  language: en
  text: I was angry because of his sinful, unjust gain.[a] I struck him and hid myself from him in anger.[b] And he kept turning away, following the path of his own heart.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “because of his sinful covetousness.” The Hebrew can mean greedy desire or profit gained through greed.
    reason: lexical_alternative
  - marker: b
    text: Or “hid my face from him in anger.” The Hebrew says “hid,” while “hid my face” is a common biblical expression.
    reason: alternative_reading
