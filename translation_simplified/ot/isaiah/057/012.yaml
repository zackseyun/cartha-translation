translation:
  language: en
  text: I myself will make known your righteousness[a] and what you have done, but none of it will help you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “righteousness” can also mean “justice.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: will declare
  simplified_phrase: will make known
  preserved_meaning: God will openly communicate the truth about these things.
  reasoning_layer_used: Lexical decision for אַגִּיד
  rationale: “Make known” expresses the chosen sense in more familiar English without adding the stronger idea of exposing.
- pob_phrase: your works
  simplified_phrase: what you have done
  preserved_meaning: The phrase still refers to the addressee’s deeds.
  reasoning_layer_used: Lexical decision for מַעֲשַׂיִךְ
  rationale: The clause replaces a potentially theological-sounding use of “works” with ordinary English.
- pob_phrase: they will not profit you
  simplified_phrase: none of it will help you
  preserved_meaning: The addressee’s claimed righteousness and deeds will provide no benefit.
  reasoning_layer_used: Lexical decision for יוֹעִילוּךְ and contrast rationale
  rationale: “Help” is a documented lexical sense, and “none of it” gives the plural reference a clear English form.
translation_notes:
  risk_flags:
  - risk: Readers may take “your righteousness” as sincere praise rather than contextual irony.
    mitigation: The wording preserves POB’s deliberate restraint and lets the surrounding rebuke convey the irony.
  - risk: “None of it” changes the Hebrew plural reference into a collective expression.
    mitigation: The collective still clearly includes both the claimed righteousness and the deeds.
