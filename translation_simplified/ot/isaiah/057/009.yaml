translation:
  language: en
  text: You traveled to the king[a] with oil and more and more perfume. You sent your envoys far away, and you degraded yourself all the way down to Sheol.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or possibly, “to Molech,” if “the king” is an allusive title for that deity.
    reason: alternative_reading
  - marker: b
    text: Sheol is the realm of the dead.
    reason: cultural_note
simplification_decisions:
- pob_phrase: multiplied your perfumes
  simplified_phrase: more and more perfume
  preserved_meaning: The amount of perfume increased lavishly.
  reasoning_layer_used: Lexical decisions for וַתַּרְבִּי and רִקֻּחָיִךְ
  rationale: The simpler phrase preserves both the increase and the perfume imagery.
- pob_phrase: sent your envoys far away
  simplified_phrase: sent your envoys far away
  preserved_meaning: Her diplomatic messengers were sent over a great distance.
  reasoning_layer_used: Lexical decisions for צִרַיִךְ and עַד מֵרָחֹק
  rationale: Keeping “far away” clearly expresses great distance without adding a destination.
- pob_phrase: debased yourself even to Sheol
  simplified_phrase: degraded yourself all the way down to Sheol
  preserved_meaning: She brought herself to an extreme depth of moral degradation.
  reasoning_layer_used: Lexical decisions for וַתַּשְׁפִּילִי and עַד שְׁאוֹל
  rationale: Common wording retains the self-abasement and strengthens the source’s downward image.
translation_notes:
  risk_flags:
  - risk: Readers may assume “the king” can only mean a human ruler.
    mitigation: The footnote preserves the possible allusion to Molech without overriding the Hebrew wording.
  - risk: Readers unfamiliar with Sheol may mistake it for an ordinary grave.
    mitigation: The footnote identifies it as the realm of the dead.
