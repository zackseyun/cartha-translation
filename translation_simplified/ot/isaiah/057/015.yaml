translation:
  language: en
  text: 'For this is what the One who is high and lifted up says, the One who lives in eternity[a] and whose name is Holy:


    “I live in the high and holy place, but I also live with those who are crushed[b] and lowly in spirit. I revive the spirits of the lowly and the hearts of those who are crushed.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “who lives forever.” The Hebrew can refer either to eternal duration or to dwelling in eternity.
    reason: lexical_alternative
  - marker: b
    text: Traditionally, “contrite.” The Hebrew image is of people who have been crushed or broken.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For thus says
  simplified_phrase: For this is what ... says
  preserved_meaning: The words that follow are introduced as God’s declaration.
  reasoning_layer_used: POB translation and target-style guidance
  rationale: The modern construction replaces a formal biblical formula without weakening its authority.
- pob_phrase: who inhabits eternity
  simplified_phrase: who lives in eternity
  preserved_meaning: God’s dwelling is associated with eternity, while the footnote preserves the duration sense.
  reasoning_layer_used: POB lexical decision for שֹׁכֵן עַד
  rationale: “Lives in” makes the elevated image immediately understandable while retaining its documented ambiguity.
- pob_phrase: and also with the crushed and lowly in spirit
  simplified_phrase: but I also live with those who are crushed and lowly in spirit
  preserved_meaning: The exalted God is truly present with crushed and inwardly lowly people.
  reasoning_layer_used: POB theological decision on transcendence and immanence
  rationale: Repeating “I live” clarifies the implied verb and makes the deliberate contrast easy to follow.
translation_notes:
  risk_flags:
  - risk: “Lives in eternity” may be heard only as describing a realm rather than eternal duration.
    mitigation: Footnote a preserves “lives forever” as an equally possible emphasis.
  - risk: Modern readers may take “crushed” only as physical injury.
    mitigation: The surrounding references to spirit and heart indicate the inward human condition, while footnote b preserves “contrite.”
