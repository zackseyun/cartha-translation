translation:
  language: en
  text: When you cry for help, tell all the idols you have gathered to save you![a] The wind will sweep every one of them away; a breath will blow them away. But whoever finds shelter in me will inherit the land[b] and possess my holy mountain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “your gathered ones,” which may also refer to allies or other things trusted for help.
    reason: lexical_alternative
  - marker: b
    text: Or “the earth”; “the land” fits the reference to God’s holy mountain.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: let your gathered idols rescue you!
  simplified_phrase: tell all the idols you have gathered to save you!
  preserved_meaning: God ironically challenges the powerless idols to provide rescue.
  reasoning_layer_used: Lexical decision for יַצִּילֻךְ and contextual reading of קִבּוּצַיִךְ.
  rationale: The active wording makes the taunt immediately clear while keeping idols as the main contextual referent.
- pob_phrase: the wind will carry all of them off; a breath will take them away
  simplified_phrase: The wind will sweep every one of them away; a breath will blow them away.
  preserved_meaning: The idols are so powerless that wind or breath can remove them.
  reasoning_layer_used: Lexical decisions for רוּחַ and הָבֶל and the poetic-pair footnote.
  rationale: “Sweep” and “blow” express the concrete wind-and-breath image in familiar English.
- pob_phrase: whoever takes refuge in me
  simplified_phrase: whoever finds shelter in me
  preserved_meaning: The person continually seeking God's protection is secure in him.
  reasoning_layer_used: Lexical decision for וְהַחֹסֶה בִי.
  rationale: “Finds shelter” makes the refuge image easier to picture without reducing it to abstract belief.
interpretive_expansions:
- pob_phrase: When you cry out
