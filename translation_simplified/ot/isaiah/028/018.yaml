  text: Your covenant with death will be canceled. Your agreement with Sheol[a] will not hold. When the scourge sweeps through like a flood,[b] it will trample you underfoot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheol is the Hebrew term for the realm of the dead; it can also be rendered “the grave.”
