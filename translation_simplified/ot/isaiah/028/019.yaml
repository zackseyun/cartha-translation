- pob_phrase: As often as it passes through
  simplified_phrase: Each time it sweeps through
  preserved_meaning: The judgment repeatedly moves through with destructive force.
  reasoning_layer_used: Lexical decisions for מִדֵּי and עבר, with the immediate context of the overflowing scourge
  rationale: “Each time” states the repetition plainly, while “sweeps through” preserves the forceful image.
- pob_phrase: for morning by morning it will pass through, by day and by night
  simplified_phrase: It will sweep through morning after morning, day and night
  preserved_meaning: The judgment will recur continually, morning and night.
  reasoning_layer_used: Lexical decisions for בַבֹּקֶר בַבֹּקֶר and בַּיּוֹם וּבַלָּיְלָה
  rationale: A separate sentence and familiar time expressions make the repeated action easier to follow.
- pob_phrase: and it will be sheer terror to understand the message
