translation:
  language: en
  text: Woe to the proud crown of Ephraim’s drunkards,[a] and to the fading flower of its glorious beauty at the top of a fertile valley! Wine has struck these people down.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be expressed as “the crown of pride”; the crown and flower are parallel images referring to the same object.
    reason: lexical_alternative
  - marker: b
    text: “Struck down” pictures the people as beaten or overcome by wine.
    reason: lexical_alternative
