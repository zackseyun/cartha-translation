  text: For a threshing sledge is not used on black cumin[a], and a cart wheel is not rolled over cumin[b]. Instead, black cumin is beaten out with a staff, and cumin with a rod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may refer to dill; “fitches” is an archaic translation term. It most likely means black cumin.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew most likely means cumin, though caraway is also possible.
    reason: lexical_alternative
