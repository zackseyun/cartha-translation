translation:
  language: en
  text: His glorious beauty is a fading flower above the fertile valley. It will be like an early fig before summer:[a] whoever sees it swallows it down as soon as it is in his hand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
