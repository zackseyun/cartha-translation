translation:
  language: en
  text: 'So this is what the Lord GOD says: “Look! I am laying a stone in Zion—a tested stone, a precious cornerstone, and a firm foundation.[c] Whoever believes[a] will not hurry.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Whoever trusts.” The Hebrew includes the sense of trusting reliance.
    reason: lexical_alternative
  - marker: b
    text: Or “will not be in haste”; some understand this as “will not panic.”
    reason: lexical_alternative
  - marker: c
    text: Romans 9:33 and 1 Peter 2:6 later apply this stone to the Messiah.
    reason: cross_reference
simplification_decisions:
- pob_phrase: Therefore thus says the Lord GOD
  simplified_phrase: So this is what the Lord GOD says
  preserved_meaning: The statement introduces the Lord GOD’s resulting declaration.
  reasoning_layer_used: POB translation and divine-title lexical decision
  rationale: Ordinary sentence structure improves clarity while preserving the divine title.
- pob_phrase: Behold, I am laying in Zion a stone
  simplified_phrase: Look! I am laying a stone in Zion
  preserved_meaning: God emphatically announces that he is establishing the stone in Zion.
  reasoning_layer_used: Lexical decisions for הִנְנִי, יִסַּד, and בְּצִיּוֹן
  rationale: “Look!” carries the emphatic prophetic summons in common English.
- pob_phrase: a sure foundation; the one who believes will not be in haste
  simplified_phrase: a firm foundation. Whoever believes will not hurry
  preserved_meaning: The foundation is secure, and the believing person will not respond by rushing.
  reasoning_layer_used: Lexical decisions for מוּסָד מוּסָּד, הַמַּאֲמִין, and לֹא יָחִישׁ
  rationale: Two sentences and direct wording preserve firmness and the broad sense of not hurrying.
translation_notes:
  risk_flags:
  - risk: “Will not hurry” may not by itself convey the possible contextual implication of panic.
    mitigation: Footnote b preserves “will not panic” as an interpretive possibility.
  - risk: Readers may assume the Hebrew text explicitly identifies the cornerstone as the Messiah.
    mitigation: The main text retains the image, while footnote c records its later messianic application.
