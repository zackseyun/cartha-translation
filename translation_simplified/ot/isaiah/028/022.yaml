translation:
  language: en
  text: So stop scoffing now, or your bonds will be tightened. For I have heard from the Lord Yahweh of Armies[b] that complete destruction has been decreed against the whole land.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
