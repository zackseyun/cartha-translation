translation:
  language: en
  text: Because you have said, “We have made a covenant with death and an agreement with Sheol.[a] When the overwhelming scourge sweeps through, it will not reach us,[b] because we have taken refuge in falsehood and hidden ourselves in deceit.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheol is the Hebrew name for the realm of the dead; it does not necessarily mean hell.
    reason: cultural_note
  - marker: b
    text: The Hebrew expression combines the images of a sweeping flood and a striking scourge.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: When the overwhelming scourge passes through
  simplified_phrase: When the overwhelming scourge sweeps through
  preserved_meaning: The destructive force moves through with the force of a flood while retaining the scourge image.
  reasoning_layer_used: Lexical decision for שיט שׁוֹטֵף and its documented imagery
  rationale: “Sweeps through” makes the floodlike motion easier to picture.
- pob_phrase: it will not come to us
  simplified_phrase: it will not reach us
  preserved_meaning: The speakers claim that the coming destruction cannot touch them.
  reasoning_layer_used: Listed lexical alternative for לֹא יְבוֹאֵנוּ
  rationale: “Reach us” states the intended sense in more natural English.
- pob_phrase: we have made falsehood our refuge
  simplified_phrase: we have taken refuge in falsehood
  preserved_meaning: The speakers rely on lies as though they were a place of safety.
  reasoning_layer_used: Lexical decisions for כָזָב and מַחְסֵנוּ
  rationale: The active expression is clearer while preserving the refuge metaphor.
translation_notes:
  risk_flags:
  - risk: Modern readers may mistake Sheol for the later concept of hell.
    mitigation: A brief footnote identifies it as the Hebrew realm of the dead.
  - risk: “Overwhelming scourge” remains an unusual mixed image.
    mitigation: The wording retains both forces, and the footnote explains the flood and scourge imagery.
