translation:
  language: en
  text: After he has leveled the ground, does he not scatter black cumin[a] seed and sow cumin? Does he not plant wheat in rows[b], barley in its assigned place, and spelt[c] along the edge of the field?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “black caraway”; the exact plant is uncertain.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may instead mean “in the best place” or “as the main crop.”
    reason: lexical_alternative
  - marker: c
    text: Or “emmer”; the exact kind of grain is uncertain.
    reason: lexical_alternative
