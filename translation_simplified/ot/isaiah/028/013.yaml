translation:
  language: en
  text: 'So this is what Yahweh’s word will be to them:[a]


    “Order after order, order after order;

    line after line, line after line;

    a little here, a little there.”


    This is so that they may go and stumble backward, be broken, caught in a snare, and captured.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Order” may also be translated “command.” The terse Hebrew repetition may imitate mocking or childish speech.
    reason: lexical_alternative
