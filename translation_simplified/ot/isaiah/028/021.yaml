  reasoning_layer_used: lexical decision and cross-reference
  rationale: The wording makes decisive action explicit while preserving the historical comparison.
- pob_phrase: he will be stirred up as in the Valley at Gibeon
  simplified_phrase: He will be stirred to act, as he did in the Valley at Gibeon
  preserved_meaning: Yahweh will be moved to intervene as in the battle associated with Gibeon.
  reasoning_layer_used: lexical decision, revision record, and cross-reference
  rationale: The clause uses a natural idiom and compares Yahweh’s present action with his earlier intervention.
- pob_phrase: to do his work ... and to perform his task
  simplified_phrase: He will do his work ... and carry out his task
  preserved_meaning: Yahweh will accomplish the work and task described as strange and foreign.
  reasoning_layer_used: lexical and theological decisions
  rationale: The direct wording clarifies both parallel actions without merging them.
