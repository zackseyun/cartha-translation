translation:
  language: en
  text: For Yahweh will rise to take action, as he did at Mount Perazim.[a] He will be stirred to act, as he did in the Valley at Gibeon.[b] He will do his work—his strange work—and carry out his task—his foreign task.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mount Perazim recalls Yahweh bursting out against David’s enemies (2 Samuel 5:20; 1 Chronicles 14:11).
    reason: cross_reference
  - marker: b
    text: The Valley at Gibeon likely recalls Yahweh intervening in battle there (Joshua 10:10–14).
    reason: cross_reference
  - marker: c
    text: The paired words “strange” and “foreign” portray this act of judgment as unusual or unfamiliar; they may also be translated “alien” and “strange.”
    reason: lexical_alternative
