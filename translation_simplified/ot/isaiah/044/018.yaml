translation:
  language: en
  text: They do not know or understand, because he[a] has smeared over[c] their eyes so they cannot see and their hearts[b] so they cannot understand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew does not identify who “he” is.
    reason: alternative_reading
  - marker: b
    text: Here “hearts” includes their ability to think and understand, not only their emotions.
    reason: cultural_note
  - marker: c
    text: The Hebrew pictures their eyes and hearts as coated over; this is often translated “blinded.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: They do not know, nor do they understand
  simplified_phrase: They do not know or understand
  preserved_meaning: They lack both knowledge and understanding without claiming that they know nothing at all.
  reasoning_layer_used: Lexical decisions for יָדְעוּ and יָבִינוּ and grounding review
  rationale: The coordinated negatives become natural English without making them absolute.
- pob_phrase: their eyes from seeing
  simplified_phrase: their eyes so they cannot see
  preserved_meaning: Their sight is prevented.
  reasoning_layer_used: Lexical decision for מֵרְאוֹת עֵינֵיהֶם
  rationale: A result clause clearly expresses the Hebrew prevention construction.
- pob_phrase: their hearts from understanding
  simplified_phrase: their hearts so they cannot understand
  preserved_meaning: Their inner capacity for thought and perception is obstructed.
  reasoning_layer_used: Lexical decisions for מֵהַשְׂכִּיל לִבֹּתָם and לִבֹּתָם
  rationale: This retains “hearts” while making its cognitive sense clear.
