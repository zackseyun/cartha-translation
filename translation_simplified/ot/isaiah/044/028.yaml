  text: who says about Cyrus, “He is my shepherd. He will carry out everything I intend.” He says about Jerusalem, “It will be rebuilt,” and about the temple, “Its foundation will be laid.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: who says of Cyrus
  simplified_phrase: who says about Cyrus
  preserved_meaning: God identifies Cyrus and speaks about his appointed role.
  reasoning_layer_used: POB translation and source payload
  rationale: “About” is more natural than “of” in modern English.
- pob_phrase: he will fulfill all my purpose
  simplified_phrase: He will carry out everything I intend.
  preserved_meaning: Cyrus will accomplish all that God has planned for him to do.
  reasoning_layer_used: POB translation and immediate context
  rationale: The concrete wording makes “fulfill my purpose” immediately understandable.
- pob_phrase: saying of Jerusalem ... and of the temple
  simplified_phrase: He says about Jerusalem ... and about the temple
  preserved_meaning: The same speaker declares both Jerusalem’s rebuilding and the laying of the temple’s foundation.
