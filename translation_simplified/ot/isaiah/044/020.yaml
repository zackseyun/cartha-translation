translation:
  language: en
  text: He feeds on ashes.[a] His deceived heart has led him down the wrong path. He cannot save himself or ask, “Isn’t what I hold in my right hand a lie?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
