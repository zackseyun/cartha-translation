  preserved_meaning: His inner thinking and will are deceived and have turned him away from truth.
  reasoning_layer_used: POB lexical decisions for לֵב, הוּתַל, and הִטָּהוּ
  rationale: The familiar path image makes moral and spiritual misdirection easier to grasp.
