  simplified_phrase: He cannot save himself
  preserved_meaning: The idolater is unable to rescue his own person from his condition.
  reasoning_layer_used: POB lexical and theological decision for נֶפֶשׁ
  rationale: “Save himself” is common English and avoids treating נפש as only an immaterial soul.
- pob_phrase: Is there not a lie in my right hand?
