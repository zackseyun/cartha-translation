- pob_phrase: your transgressions
  simplified_phrase: your acts of rebellion
  preserved_meaning: The wrongdoing is deliberate rebellion, not merely a mistake.
  reasoning_layer_used: POB lexical decision for פְּשָׁעֶיךָ
  rationale: This uses a clear lexical alternative while retaining the word’s moral force.
- pob_phrase: like a cloud, and your sins like a mist
  simplified_phrase: like a vanishing cloud, and your sins like fading mist
  preserved_meaning: God removes both rebellion and sin as completely as clouds and mist disappear.
  reasoning_layer_used: POB cloud-term rationale and poetic parallelism
  rationale: The added modifiers make the poetic image immediately understandable.
- pob_phrase: Return to me, for I have redeemed you
  simplified_phrase: Come back to me, because I have redeemed you
  preserved_meaning: God calls his people to return on the basis of his completed redemptive action.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Common wording clarifies both the relational appeal and its stated reason.
