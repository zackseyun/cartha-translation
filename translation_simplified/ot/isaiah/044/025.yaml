  reasoning_layer_used: POB text and source context
  rationale: “Fortune-tellers” is a familiar equivalent for “diviners.”
- pob_phrase: turns wise men back and makes their knowledge foolish
  simplified_phrase: makes the wise retreat and makes their knowledge foolish
  preserved_meaning: God drives the wise back and directly reduces their knowledge to folly.
  reasoning_layer_used: POB text and grounding review
  rationale: “Retreat” preserves the turning-back image without adding coercion, while the final clause retains the causative judgment.
