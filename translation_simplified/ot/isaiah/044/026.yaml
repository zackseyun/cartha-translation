translation:
  language: en
  text: He makes his servant’s word come true and carries out the plans of his messengers.[a] He says about Jerusalem, “People will live in her,” and about the cities of Judah, “They will be rebuilt.” He also says, “I will raise her ruins back up.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “his angels.” The Hebrew word can mean human or heavenly messengers, but here it most likely refers to prophets.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: confirms the word of his servant
  simplified_phrase: makes his servant’s word come true
  preserved_meaning: God validates the servant’s prophetic word by bringing it to pass.
  reasoning_layer_used: Lexical decision for מֵקִים with דְּבַר עַבְדּוֹ
  rationale: The rewrite makes the idiom immediately clear while retaining “word” and the singular servant.
- pob_phrase: fulfills the counsel of his messengers
  simplified_phrase: carries out the plans of his messengers
  preserved_meaning: God brings the messengers’ announced plans to completion.
  reasoning_layer_used: Lexical decisions for וַעֲצַת and יַשְׁלִים
  rationale: “Carries out the plans” expresses effective accomplishment in common English.
- pob_phrase: She will be inhabited ... I will raise up her ruins
  simplified_phrase: People will live in her ... I will raise her ruins back up
  preserved_meaning: Jerusalem will again be populated and restored from devastation.
  reasoning_layer_used: Lexical decisions for תּוּשָׁב and אֲקוֹמֵם with restoration context
  rationale: The active wording is easier to understand, while the feminine city image and raised-ruins image remain.
