translation:
  language: en
  text: Yahweh says, “I am your Redeemer, the one who formed you in the womb. I am Yahweh, the maker of everything. I alone stretched out the heavens, and I spread out the earth by myself.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult Hebrew ending may also be understood as “Who was with me?” Either way, Yahweh created without any helper.
    reason: alternative_reading
