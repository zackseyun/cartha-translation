translation:
  language: en
  text: Do not be afraid or tremble. Did I not make this known to you long ago and declare it? You are my witnesses. Is there any God besides me? There is no other Rock[a]. I know of none.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Rock” is a title for God that pictures him as stable and reliable.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Do not fear, and do not tremble
  simplified_phrase: Do not be afraid or tremble
  preserved_meaning: Both commands remain, with the second strengthening the warning against fear.
  reasoning_layer_used: POB lexical decisions for תִּפְחֲדוּ and תִּרְהוּ
  rationale: Natural negative coordination makes the paired prohibition easier to read.
- pob_phrase: Have I not long ago made you hear and declared it?
  simplified_phrase: Did I not make this known to you long ago and declare it?
  preserved_meaning: God caused the people to receive his earlier proclamation.
  reasoning_layer_used: POB lexical decisions for מֵאָז, הִשְׁמַעְתִּיךָ, and וְהִגַּדְתִּי
  rationale: “Make this known” expresses the causative sense in ordinary English.
- pob_phrase: There is no Rock; I know of none.
  simplified_phrase: There is no other Rock. I know of none.
  preserved_meaning: No deity besides God can serve as the stable and reliable Rock.
  reasoning_layer_used: POB theological decisions on divine exclusivity and צוּר
  rationale: Splitting the clauses clarifies the emphatic denial while retaining the divine title.
