  text: And who is like me? Let that rival speak up. Let him declare the matter and lay it out in order before me, from the time when I established a people long ago. Let them tell their hearers what events are coming and what will happen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word translated “events” can also mean “signs” or “tokens.”
    reason: alternative_reading
