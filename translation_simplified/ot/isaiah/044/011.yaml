translation:
  language: en
  text: Look! Everyone connected with him[a] will be put to shame. The craftsmen are merely human. Let them all come together and stand up. They will be terrified, and together they will be put to shame.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Him” may refer to the idol or to the idol-maker.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: all his companions
  simplified_phrase: everyone connected with him
  preserved_meaning: All those associated with him share his coming shame.
  reasoning_layer_used: lexical decision for חֲבֵרָיו
  rationale: “Connected with” expresses association in familiar English without narrowing the relationship.
- pob_phrase: the craftsmen are only men
  simplified_phrase: The craftsmen are merely human
  preserved_meaning: The idol-makers have no divine status or power.
  reasoning_layer_used: lexical and theological decisions for הֵמָּה מֵאָדָם
  rationale: “Merely human” states the intended human-versus-divine contrast clearly.
- pob_phrase: Let them all gather and stand up
  simplified_phrase: Let them all come together and stand up
  preserved_meaning: The verse challenges all of them to assemble and present themselves.
  reasoning_layer_used: applied revision and lexical decisions for יִתְקַבְּצוּ and יַעֲמֹדוּ
  rationale: “Come together” is more immediately understandable than “gather” while keeping the summons.
translation_notes:
  risk_flags:
  - risk: The singular pronoun may point to either the idol or its maker.
    mitigation: The main text retains the pronoun, and the footnote preserves both possibilities.
