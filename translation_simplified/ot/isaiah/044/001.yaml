  preserved_meaning: God commands Israel to pay attention as the message turns from rebuke to reassurance.
  reasoning_layer_used: POB lexical decisions for וְעַתָּה and שְׁמַע
  rationale: “Listen” communicates the imperative clearly while “But now” preserves the contrasting transition.
- pob_phrase: Jacob my servant, and Israel, whom I have chosen
  simplified_phrase: Jacob—Israel, my servant. I have chosen you.
  preserved_meaning: Jacob and Israel are parallel names for the same covenant people, whom God calls his servant and has chosen.
  reasoning_layer_used: POB lexical and theological decisions for עַבְדִּי, וְיִשְׂרָאֵל, and בָּחַרְתִּי בוֹ
  rationale: The dash links both names as one addressee, and the short second sentence makes God’s enduring choice clear.
