  reasoning_layer_used: Lexical decision for יָשִׁיב אֶל לִבּוֹ
  rationale: The wording makes the Hebrew idiom clear without suggesting a continual habit.
- pob_phrase: I burned half of it in the fire; I also baked bread on its coals; I roasted meat and ate
  simplified_phrase: I burned half the wood in the fire. I also baked bread over its coals, roasted meat, and ate.
  preserved_meaning: The same wood used for ordinary cooking is later treated as divine.
  reasoning_layer_used: Lexical decisions and immediate context
  rationale: Naming the wood clarifies the contrast while leaving the object of “ate” unstated.
- pob_phrase: make the rest of it into an abomination
  simplified_phrase: make the rest into a detestable idol
  preserved_meaning: The remaining wood becomes a religiously abhorrent object of worship.
  reasoning_layer_used: Lexical and theological decisions for תוֹעֵבָה
  rationale: “Detestable idol” clearly conveys both the strong condemnation and its religious setting.
