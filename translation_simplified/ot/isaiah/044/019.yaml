translation:
  language: en
  text: He does not stop to think about this. He has no knowledge or understanding to say, “I burned half the wood in the fire. I also baked bread over its coals, roasted meat, and ate. Should I make the rest into a detestable idol? Should I bow down to a mere block of wood?”
