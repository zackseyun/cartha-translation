translation:
  language: en
  text: Heavens, sing for joy, because Yahweh has acted![a] Depths of the earth, shout aloud! Mountains, forest, and every tree in it, burst into joyful song! Yahweh has redeemed Jacob, and in Israel he displays his glory.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Yahweh has done it” or “Yahweh has done this.” The Hebrew does not state what he has done.
    reason: lexical_alternative
  - marker: b
    text: Or, “in Israel he shows himself glorious” or “he glorifies himself.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Sing for joy, O heavens
  simplified_phrase: Heavens, sing for joy
  preserved_meaning: The heavens are directly summoned to joyful praise.
  reasoning_layer_used: Lexical decision for רָנּוּ and poetic vocative context
  rationale: Ordinary English word order preserves the personification without the archaic vocative “O.”
- pob_phrase: Break forth into singing, O mountains, O forest, and every tree in it
  simplified_phrase: Mountains, forest, and every tree in it, burst into joyful song
  preserved_meaning: All parts of the landscape are called to a sudden, joyful outburst of praise.
  reasoning_layer_used: Lexical decisions for פִּצְחוּ, רִנָּה, and the vocative series
  rationale: “Burst into joyful song” makes the vivid poetic command immediately understandable.
- pob_phrase: for Yahweh has redeemed Jacob, and in Israel he displays his glory
  simplified_phrase: Yahweh has redeemed Jacob, and in Israel he displays his glory
  preserved_meaning: Yahweh rescues his covenant people and manifests his own glory in Israel.
  reasoning_layer_used: Lexical and theological decisions for גָאַל and יִתְפָּאָר
  rationale: A new sentence clarifies the reason for creation’s praise while retaining the key theological terms.
