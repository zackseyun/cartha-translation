translation:
  language: en
  text: All who make idols are empty, and the things they treasure are of no use. Their witnesses[a] can neither see nor know, so they will be put to shame.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Their witnesses” may mean those who speak for the idols or, ironically, the idols themselves.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: fashion an idol
  simplified_phrase: make idols
  preserved_meaning: People actively form objects for idol worship.
  reasoning_layer_used: Lexical decision for יֹצְרֵי פֶסֶל
  rationale: “Make idols” states the concrete action in common English.
- pob_phrase: are nothing
  simplified_phrase: are empty
  preserved_meaning: The idol-makers are condemned as futile, not as nonexistent or lacking human value.
  reasoning_layer_used: Lexical and theological decisions for תֹּהוּ
  rationale: “Empty” retains the polemical image while avoiding a judgment about personal worth.
- pob_phrase: the things they delight in do not profit
  simplified_phrase: the things they treasure are of no use
  preserved_meaning: Their prized idol-objects provide no benefit.
  reasoning_layer_used: Lexical decisions for וַחֲמוּדֵיהֶם and בַּל יוֹעִילוּ
  rationale: This wording clearly conveys both their attachment and the objects’ uselessness.
translation_notes:
  risk_flags:
  - risk: “Empty” may be understood literally rather than as a charge of futility.
    mitigation: The useless treasured objects in the same sentence establish the intended sense.
  - risk: “Their witnesses” has two possible referents.
    mitigation: The footnote preserves both documented readings without resolving the ambiguity.
