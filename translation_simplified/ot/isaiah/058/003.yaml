translation:
  language: en
  text: “Why have we fasted if you do not see it? Why have we humbled ourselves if you do not notice?” Look! On the day you fast, you pursue what pleases you,[a] and you drive all your workers hard.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “you pursue your own business.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may refer either to oppressed workers or to labor being demanded from them.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Why have we fasted, and you have not seen?
  simplified_phrase: Why have we fasted if you do not see it?
  preserved_meaning: The people complain that God has not taken notice of their fasting.
  reasoning_layer_used: POB lexical decision for רָאִיתָ
  rationale: The conditional form makes the rhetorical complaint natural in modern English while retaining the concrete verb “see.”
- pob_phrase: on the day of your fast
  simplified_phrase: On the day you fast
  preserved_meaning: Their selfish conduct occurs during their religious fast.
  reasoning_layer_used: POB lexical decision for בְּיוֹם צֹמְכֶם
  rationale: The verbal form removes an awkward noun phrase without changing the timing.
- pob_phrase: you pursue your own pleasure
  simplified_phrase: you pursue what pleases you
  preserved_meaning: They seek their own interests while fasting.
  reasoning_layer_used: POB lexical and theological decisions for תִּמְצְאוּ חֵפֶץ
  rationale: The clause states the preferred self-interest reading in more familiar English.
translation_notes:
