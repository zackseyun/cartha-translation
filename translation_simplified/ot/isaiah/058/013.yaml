translation:
  language: en
  text: If you keep your foot from trampling on the Sabbath—that is, from pursuing your own interests on my holy day—and if you call the Sabbath a delight and Yahweh’s holy day worthy of honor, then honor it[a] by not following your own ways, pursuing your own interests[b], or speaking a word[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “honor him,” referring to Yahweh rather than to the Sabbath.
    reason: alternative_reading
  - marker: b
    text: The Hebrew may also mean “your own pleasure,” “your own desire,” or “your own business.”
    reason: lexical_alternative
  - marker: c
    text: The Hebrew literally says “speaking a word” and may refer to ordinary, self-serving, or idle speech.
    reason: lexical_alternative
