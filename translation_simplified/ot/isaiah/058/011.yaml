translation:
  language: en
  text: Yahweh will always guide you. Even in dry, scorched places, he will satisfy your soul and make your bones strong.[a] You will be like a well-watered garden, like a spring whose water never fails.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “refresh your bones”; the Hebrew may describe strengthening or renewing them.
    reason: lexical_alternative
