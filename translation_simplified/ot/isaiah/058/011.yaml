  preserved_meaning: Yahweh fully meets inward need amid harsh, arid conditions.
  reasoning_layer_used: Lexical and theological decisions for בְּצַחְצָחוֹת and נַפְשֶׁךָ
  rationale: The reordered clause makes the contrast clear while retaining “soul” and the scorched-place image.
- pob_phrase: strengthen your bones
