    mitigation: The metaphor remains open because the POB does not limit it to one kind of exaltation or blessing.
  - risk: Rendering “father” as “ancestor” makes the covenant-family idiom less visible.
    mitigation: The footnote preserves the Hebrew wording and explains its covenant-family sense.
