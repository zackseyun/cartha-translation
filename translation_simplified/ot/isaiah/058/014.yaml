translation:
  language: en
  text: Then you will find your delight in Yahweh. I will make you ride on the heights of the earth[a] and let you fully enjoy the inheritance of Jacob, your ancestor.[b] The mouth of Yahweh has spoken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the high places of the earth” or “the heights of the land.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says “Jacob your father,” using covenant-family language for Jacob as the people’s forefather.
    reason: cultural_note
simplification_decisions:
- pob_phrase: you will delight yourself in Yahweh
  simplified_phrase: you will find your delight in Yahweh
  preserved_meaning: Yahweh remains the personal focus of deep joy.
  reasoning_layer_used: POB lexical decision for תִּתְעַנַּג עַל and the divine-name doctrine
  rationale: The natural English phrasing preserves the personal and covenant-centered delight.
- pob_phrase: I will feed you with the inheritance of Jacob your father
  simplified_phrase: let you fully enjoy the inheritance of Jacob, your ancestor
  preserved_meaning: Yahweh grants his people the full enjoyment of Jacob’s covenant inheritance.
  reasoning_layer_used: POB lexical rationales for וְהַאֲכַלְתִּיךָ and נַחֲלַת יַעֲקֹב אָבִיךָ
  rationale: This conveys the eating image’s contextual force without suggesting that the inheritance is literal food.
- pob_phrase: for the mouth of Yahweh has spoken
  simplified_phrase: The mouth of Yahweh has spoken.
  preserved_meaning: The mouth image solemnly affirms the authority and certainty of Yahweh’s word.
  reasoning_layer_used: POB lexical decision for the prophetic formula
  rationale: A direct final sentence is easier to follow while preserving the source image.
interpretive_expansions:
- pob_phrase: I will feed you with the inheritance
  rendering: let you fully enjoy the inheritance
  claim: The causative eating expression means Yahweh will grant enjoyment of the covenant inheritance.
  evidence:
  - The object of the causative eating verb is Jacob’s inheritance.
  - The POB lexical rationale identifies bestowed enjoyment of covenant blessing as the expression’s force.
  confidence: high
  alternatives_preserved:
  - I will feed you with the inheritance
  - I will cause you to eat the inheritance
translation_notes:
  risk_flags:
