translation:
  language: en
  text: Cry out at full voice; do not hold back. Raise your voice like a trumpet,[a] and announce to my people their rebellion, and to the descendants of Jacob their sins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew refers to a horn, often a ram’s horn, used for loud signals and public announcements.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Cry out with your throat
  simplified_phrase: Cry out at full voice
  preserved_meaning: The command calls for a loud, urgent proclamation using the whole voice.
  reasoning_layer_used: POB lexical decision for בְגָרוֹן
  rationale: The common idiom preserves the bodily force without the unnatural phrase “with your throat.”
- pob_phrase: declare to my people their rebellion
  simplified_phrase: announce to my people their rebellion
  preserved_meaning: God commands a direct, public disclosure of his people’s willful defiance.
  reasoning_layer_used: POB lexical decisions for וְהַגֵּד and פִּשְׁעָם
  rationale: “Announce” is familiar English and retains the public force of the prophetic command.
- pob_phrase: the house of Jacob
  simplified_phrase: the descendants of Jacob
  preserved_meaning: The phrase identifies Jacob’s covenant people collectively and remains distinct from “my people.”
  reasoning_layer_used: POB theological decision on the parallel expressions
  rationale: “Descendants” clearly conveys the corporate ancestral identity without suggesting a small household.
translation_notes:
  risk_flags:
  - risk: “At full voice” makes the literal throat image less visible.
    mitigation: It preserves the bodily intensity and is reinforced by the trumpet comparison.
  - risk: “Descendants of Jacob” makes the ancestral relationship more explicit than the traditional expression “house of Jacob.”
    mitigation: It preserves the collective covenant people and avoids narrowing the phrase to a small family.
