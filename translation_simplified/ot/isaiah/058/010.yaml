translation:
  language: en
  text: If you give yourself fully[a] to helping the hungry and satisfy the needs of those who suffer, then your light will rise in the darkness, and your gloom will become as bright as noon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression can be rendered “draw out your soul”; it means giving yourself for another person’s good.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: pour yourself out for the hungry
  simplified_phrase: give yourself fully to helping the hungry
  preserved_meaning: The help involves personal self-giving, not merely handing over an object.
  reasoning_layer_used: POB lexical decision for וְתָפֵק with נַפְשֶׁךָ
  rationale: The new wording explains the idiom while retaining its self-giving force.
- pob_phrase: satisfy the afflicted soul
  simplified_phrase: satisfy the needs of those who suffer
  preserved_meaning: The command calls for sufficient help for distressed people as whole persons.
  reasoning_layer_used: POB lexical and theological decisions for נֶפֶשׁ נַעֲנָה and תַּשְׂבִּיעַ
  rationale: This preserves the verb’s fullness while avoiding a misleading body-soul distinction.
- pob_phrase: your gloom will be like noonday
  simplified_phrase: your gloom will become as bright as noon
  preserved_meaning: Deep personal darkness is transformed into the brightness of midday.
  reasoning_layer_used: POB lexical decisions for וַאֲפֵלָתְךָ and כַּצָּהֳרָיִם
  rationale: Adding “bright” makes the contrast clear while preserving the light image.
interpretive_expansions:
- pob_phrase: satisfy the afflicted soul
  rendering: satisfy the needs of those who suffer
  claim: The afflicted soul is a suffering whole person who is to receive sufficient help.
  evidence:
  - POB identifies נֶפֶשׁ as the whole person and תַּשְׂבִּיעַ as satisfying or filling to fullness.
  - The parallel clause concerns self-giving help for the hungry.
  confidence: high
  alternatives_preserved:
  - satisfy the afflicted person
  - bring full relief to those who suffer
translation_notes:
  risk_flags:
  - risk: “Satisfy the needs” makes the object of satisfaction explicit rather than preserving the Hebrew image of satisfying a person.
    mitigation: The wording retains sufficient provision and identifies the recipients as whole people who suffer.
