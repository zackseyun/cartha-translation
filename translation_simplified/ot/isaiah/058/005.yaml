translation:
  language: en
  text: Is this the kind of fast I choose? Is it just a day when a man humbles himself, bows his head like a reed, and spreads sackcloth and ashes beneath him?[a] Will you call that a fast—a day acceptable to the LORD?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sackcloth and ashes were outward signs of sorrow and humility.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Is this the fast that I choose
  simplified_phrase: Is this the kind of fast I choose?
  preserved_meaning: The LORD questions whether such fasting is the kind he desires.
  reasoning_layer_used: POB translation and immediate rhetorical structure
  rationale: The shorter question makes the divine challenge easier to follow.
- pob_phrase: a day for a man to humble himself
  simplified_phrase: a day when a man humbles himself
  preserved_meaning: The fast involves a man deliberately humbling himself for a day.
  reasoning_layer_used: POB translation and applied revision
  rationale: The ordinary time clause preserves the audited wording “a man.”
- pob_phrase: to spread out sackcloth and ashes
  simplified_phrase: spreads sackcloth and ashes beneath him
  preserved_meaning: The man lays out traditional signs of mourning and humility.
  reasoning_layer_used: Source image and POB rendering
  rationale: “Beneath him” clarifies the physical action without removing the ancient image.
interpretive_expansions:
- pob_phrase: a day for a man to humble himself? Is it to bow down
  rendering: Is it just a day when a man humbles himself, bows his head
  claim: The question challenges fasting reduced to outward self-humbling.
  evidence:
  - The repeated rhetorical questions reject the described observance as the fast the LORD chooses.
  - The following actions are visible signs of humility.
  confidence: high
  alternatives_preserved:
  - The acts may still accompany sincere fasting, though they are not sufficient by themselves.
translation_notes:
  risk_flags:
  - risk: “Just” could be read as condemning every use of these outward practices.
    mitigation: The wording presents them as insufficient for the chosen fast, not inherently wrong.
