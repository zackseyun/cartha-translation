- pob_phrase: You trusted in your wickedness
  simplified_phrase: You relied on your wickedness
  preserved_meaning: Babylon depended confidently on her own evil conduct.
  reasoning_layer_used: POB lexical decision for וַתִּבְטְחִי and בְרָעָתֵךְ
  rationale: “Relied on” states the intended sense of trust in more natural English.
- pob_phrase: and you said in your heart
  simplified_phrase: You told yourself
  preserved_meaning: The boast was an inward thought.
  reasoning_layer_used: POB lexical decision for בְלִבֵּךְ
  rationale: The common English idiom makes the inward speech immediately clear.
- pob_phrase: I am, and there is no one besides me
  simplified_phrase: I am, and there is no one besides me
  preserved_meaning: Babylon makes an absolute and blasphemous claim of unrivaled status.
  reasoning_layer_used: POB theological decision for אֲנִי וְאַפְסִי עוֹד
  rationale: The wording is retained to preserve its stark self-exaltation and theological irony.
