translation:
  language: en
  text: You relied on your wickedness and said, “No one sees me.” But your wisdom and knowledge led you astray. You told yourself, “I am, and there is no one besides me.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “I am, and there is nothing else.” Here the Hebrew likely expresses Babylon’s claim that no one rivals her.
    reason: alternative_reading
