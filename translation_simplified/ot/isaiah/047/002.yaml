  preserved_meaning: The head covering is removed as part of Babylon’s public humiliation.
  reasoning_layer_used: Lexical decision for צַמָּתֵךְ and theological decision on humiliation imagery
  rationale: “Take off” is ordinary English, while the footnote preserves the possible reference to hair.
- pob_phrase: strip off your skirt, uncover the leg, cross over the rivers
  simplified_phrase: Strip off your long skirt and bare your leg. Cross the rivers.
  preserved_meaning: The commands portray loss of dignity and bodily exposure while crossing waterways.
  reasoning_layer_used: Lexical decisions for שֹׁבֶל, שׁוֹק, עִבְרִי, and נְהָרוֹת
