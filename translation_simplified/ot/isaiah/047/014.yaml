translation:
  language: en
  text: Look! They have become like stubble—the dry stalks left after harvest. Fire burns them up. They cannot escape the flame’s power. This is not a coal for warmth or a fire anyone can sit beside.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew wording is difficult; it may also be translated, “There is no ember to warm by.” The point is that this is a consuming blaze, not a useful hearth fire.
    reason: lexical_alternative
