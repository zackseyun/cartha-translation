translation:
  language: en
  text: Now then, listen to this, you who love luxury and sit securely. You tell yourself, “I am, and there is no one besides me.[a] I will not sit as a widow or experience the loss of children.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “I am, and there is nothing else.” Both readings express Babylon’s claim to unrivaled status.
    reason: alternative_reading
