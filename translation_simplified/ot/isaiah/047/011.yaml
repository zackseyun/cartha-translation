translation:
  language: en
  text: But evil will strike you, and you will not know how to charm it away.[a] Disaster will overwhelm you, and you will not be able to atone for it.[b] Then ruin you did not foresee will suddenly come upon you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is difficult and may instead mean “you will not know its dawning” or “you will not know how to avert it.”
    reason: lexical_alternative
  - marker: b
    text: Here “atone for it” means to remove or ward off the disaster, not to offer a sacrifice for it.
    reason: simplification_note
simplification_decisions:
- pob_phrase: evil will come upon you
  simplified_phrase: evil will strike you
  preserved_meaning: A harmful judgment will descend on Babylon.
  reasoning_layer_used: The lexical decision retains “evil” while the judgment context identifies it as calamity.
  rationale: “Strike” expresses the threatening force more directly than “come upon.”
- pob_phrase: disaster will fall upon you
  simplified_phrase: Disaster will overwhelm you
  preserved_meaning: Babylon will be unable to escape the destructive disaster.
  reasoning_layer_used: The lexical decision defines הֹוָה as destructive ruin or disaster.
  rationale: “Overwhelm” gives the image natural force without weakening the judgment.
- pob_phrase: And ruin will come upon you suddenly, which you do not foresee
  simplified_phrase: Then ruin you did not foresee will suddenly come upon you
  preserved_meaning: Unexpected devastation will arrive abruptly.
  reasoning_layer_used: The lexical decisions preserve “ruin,” “suddenly,” and the contextual sense “foresee.”
  rationale: Reordering the clauses makes the sentence easier to follow.
translation_notes:
  risk_flags:
  - risk: “Charm it away” represents a difficult and debated Hebrew expression.
    mitigation: Footnote a preserves the principal lexical alternatives.
  - risk: Modern readers may take “atone” only in a sacrificial sense.
    mitigation: Footnote b explains its contextual sense while retaining the key term.
