translation:
  language: en
  text: Take your stand now with your spells and your many acts of sorcery. You have worked hard at them since you were young. Perhaps you can gain an advantage; perhaps you can cause terror.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Stand now with your enchantments and with your many sorceries
  simplified_phrase: Take your stand now with your spells and your many acts of sorcery
  preserved_meaning: Babylon is told to rely on its repeated magical practices.
  reasoning_layer_used: POB lexical decisions and theological decision
  rationale: “Take your stand” keeps the concrete image, while “spells” and “acts of sorcery” are clearer modern terms.
- pob_phrase: in which you have labored from your youth
  simplified_phrase: You have worked hard at them since you were young
  preserved_meaning: Babylon has devoted sustained effort to these practices for a long time.
  reasoning_layer_used: POB lexical decisions
  rationale: A separate sentence makes the effortful, lifelong practice immediately clear.
- pob_phrase: perhaps you may be able to profit, perhaps you may inspire terror
  simplified_phrase: Perhaps you can gain an advantage; perhaps you can cause terror
  preserved_meaning: The practices might benefit Babylon or frighten its opponents.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Gain an advantage” avoids the monetary sense of “profit,” while the repeated “perhaps” preserves the taunt.
translation_notes:
  risk_flags:
