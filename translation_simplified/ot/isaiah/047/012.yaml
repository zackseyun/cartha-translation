    mitigation: The POB lexical record identifies “spells” as the clear modern equivalent.
  - risk: The ironic tone may not be obvious when the verse is read alone.
    mitigation: The wording does not label the irony and preserves the repeated doubtful “perhaps” so context can supply the taunt.
