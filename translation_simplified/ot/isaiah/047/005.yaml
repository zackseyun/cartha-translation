translation:
  language: en
  text: Daughter of the Chaldeans,[a] sit in silence and go into darkness. No one will call you the lady who rules over kingdoms any longer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This is Babylon pictured as a woman.
