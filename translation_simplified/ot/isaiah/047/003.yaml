translation:
  language: en
  text: Your nakedness will be exposed; your disgrace will be plain to see. I will take vengeance and spare no one.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The final Hebrew clause is difficult. It may also mean “I will let no one intervene” or “I will meet no one.”
