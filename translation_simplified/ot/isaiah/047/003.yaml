  rationale: “Exposed” states the humiliating public uncovering more directly.
- pob_phrase: indeed, your disgrace will be seen
  simplified_phrase: your disgrace will be plain to see
  preserved_meaning: Babylon’s humiliation will become publicly visible.
  reasoning_layer_used: Lexical decisions for גַּם, תֵּרָאֶה, and חֶרְפָּתֵךְ
  rationale: The idiom “plain to see” gives the emphatic clause natural modern force.
- pob_phrase: I will spare no man
