translation:
  language: en
  text: Come down, virgin daughter Babylon,[a] and sit in the dust. Sit on the ground, daughter of the Babylonian people,[b] with no throne. No one will call you tender and pampered anymore.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Babylon is pictured as a young royal woman who is now being humiliated.
    reason: cultural_note
  - marker: b
    text: 'Hebrew: “daughter of the Chaldeans,” another poetic title for Babylon.'
    reason: source_note
simplification_decisions:
- pob_phrase: Come down and sit in the dust, virgin daughter Babylon
  simplified_phrase: Come down, virgin daughter Babylon, and sit in the dust.
  preserved_meaning: Babylon is summoned to leave her exalted position and suffer humiliation.
  reasoning_layer_used: Lexical decisions and theological decision on personification
  rationale: Reordering the address makes the command easier to follow while keeping the royal-woman image.
- pob_phrase: daughter of the Chaldeans
  simplified_phrase: daughter of the Babylonian people
  preserved_meaning: The title still personifies Babylon through the people associated with it.
  reasoning_layer_used: Lexical rationale and cultural context
  rationale: The common name identifies the unfamiliar Chaldeans without removing the poetic title.
- pob_phrase: For they will no longer call you tender and delicate
  simplified_phrase: No one will call you tender and pampered anymore.
  preserved_meaning: Babylon will lose its reputation for privileged softness and luxury.
  reasoning_layer_used: Lexical decisions for the impersonal plural and עֲנֻגָּה
  rationale: “No one” expresses the indefinite subject naturally, and “pampered” clarifies the luxurious sense.
interpretive_expansions:
- pob_phrase: daughter of the Chaldeans
  rendering: daughter of the Babylonian people
  claim: The Chaldeans here are identified for modern readers as the Babylonian people.
  evidence:
  - The phrase stands in parallel with “virgin daughter Babylon.”
  - The POB rationale identifies this as another personifying title for Babylon.
  confidence: high
  alternatives_preserved:
  - The original title is retained in a footnote.
