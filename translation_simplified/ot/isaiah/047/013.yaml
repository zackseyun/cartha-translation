translation:
  language: en
  text: Your many plans have worn you out. Now let your astrologers take their stand and save you—those who divide the heavens[a], gaze at the stars, and predict month by month[b] what is coming upon you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult Hebrew phrase probably pictures astrologers dividing the sky into sections for interpretation.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may instead mean “announce at each new moon.”
    reason: lexical_alternative
