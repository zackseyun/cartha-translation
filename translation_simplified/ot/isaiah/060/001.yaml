simplification_decisions:
- pob_phrase: Arise, shine
  simplified_phrase: Rise! Shine
  preserved_meaning: Zion receives two direct commands to rise and become visibly radiant.
  reasoning_layer_used: Lexical decisions for קומי and אורי
  rationale: Separate commands make the prophetic summons immediate and clear.
- pob_phrase: for your light has come
  simplified_phrase: because your light has come
  preserved_meaning: The arrival of Zion’s light is the reason for the commands.
  reasoning_layer_used: Lexical decision for כי and theological decision on prophetic perfects
  rationale: Because states the causal link plainly while retaining the present perfect.
- pob_phrase: the glory of Yahweh has risen upon you
  simplified_phrase: Yahweh’s glory has risen over you
  preserved_meaning: God’s glorious presence appears over Zion like the rising sun.
  reasoning_layer_used: Lexical decisions for כבוד, על, and זרח
  rationale: The possessive and over are natural English while has risen keeps the dawn image.
