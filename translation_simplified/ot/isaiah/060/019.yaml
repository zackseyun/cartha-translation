  preserved_meaning: The sun ceases to serve as Zion’s daytime light.
  reasoning_layer_used: POB lexical decision for לְאוֹר יוֹמָם
  rationale: The active wording expresses the same function in ordinary English.
- pob_phrase: nor will the moon shine for you for brightness
  simplified_phrase: and the moon will not shine for you
  preserved_meaning: The moon will not provide its brightness for Zion.
  reasoning_layer_used: POB lexical decisions for וּלְנֹגַהּ and לֹא יָאִיר לָךְ
  rationale: The shining image carries the brightness sense without the awkward final phrase.
- pob_phrase: but Yahweh will be for you an everlasting light, and your God your glory
  simplified_phrase: Instead, Yahweh will be your everlasting light, and your God will be your glory
  preserved_meaning: Yahweh replaces the created lights as Zion’s enduring light and glory.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Instead” makes the contrast clear while preserving the divine name and central images.
