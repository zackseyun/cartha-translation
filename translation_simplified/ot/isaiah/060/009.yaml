translation:
  language: en
  text: Surely the distant coastlands[a] wait for me. The ships of Tarshish[b] will come first, bringing your sons from far away. Your sons will come with their silver and gold to honor the name of Yahweh your God and to honor the Holy One of Israel, because he has glorified you.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the islands” or “the distant shores”; the Hebrew term broadly includes maritime lands.
    reason: lexical_alternative
  - marker: b
    text: “Ships of Tarshish” may refer to ships associated with Tarshish or to large seagoing trading ships.
    reason: source_note
  - marker: c
    text: Or “because he has beautified you” or “because he has honored you.”
    reason: lexical_alternative
