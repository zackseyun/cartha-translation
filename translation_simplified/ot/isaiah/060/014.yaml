translation:
  language: en
  text: The sons of those who made you suffer will come to you bowed low. Everyone who despised you will bow down at the soles of your feet.[a] They will call you the City of Yahweh, Zion belonging to the Holy One of Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This bowing shows submission and honor, not worship of Zion.
    reason: cultural_note
simplification_decisions:
- pob_phrase: those who afflicted you
  simplified_phrase: those who made you suffer
  preserved_meaning: Their fathers had harmed and oppressed Zion.
  reasoning_layer_used: lexical decision for מְעַנַּיִךְ
  rationale: The common phrase “made you suffer” clearly conveys affliction without weakening it.
- pob_phrase: will come to you bowed down
  simplified_phrase: will come to you bowed low
  preserved_meaning: They approach Zion in a physically lowered posture of submission.
  reasoning_layer_used: lexical decision for שְׁחֹחַ
  rationale: “Bowed low” preserves the bodily image while distinguishing it from the next act of bowing.
- pob_phrase: Zion of the Holy One of Israel
  simplified_phrase: Zion belonging to the Holy One of Israel
  preserved_meaning: The title identifies Zion as belonging to Israel’s Holy One.
  reasoning_layer_used: lexical decision for צִיּוֹן קְדוֹשׁ יִשְׂרָאֵל
  rationale: Adding “belonging to” prevents readers from mistaking Zion for the Holy One.
interpretive_expansions:
- pob_phrase: Zion of the Holy One of Israel
  rendering: Zion belonging to the Holy One of Israel
  claim: The compressed title marks Zion as belonging to the Holy One of Israel.
  evidence:
