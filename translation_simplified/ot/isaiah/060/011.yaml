  simplified_phrase: always remain open; they will never be shut, day or night
  preserved_meaning: Zion’s gates remain open without interruption.
  reasoning_layer_used: Lexical decisions for תָּמִיד and יוֹמָם וָלַיְלָה
  rationale: Common wording preserves the emphatic picture of unceasing access.
- pob_phrase: so that the wealth of the nations may be brought to you
  simplified_phrase: so that the wealth of the nations may be brought to you
  preserved_meaning: The gates remain open to allow the nations’ riches to enter Zion.
  reasoning_layer_used: Lexical decisions for לְהָבִיא and theological decision for חֵיל גּוֹיִם
  rationale: Keeping the purpose clause preserves why the gates remain open.
- pob_phrase: with their kings led in procession
  simplified_phrase: with their kings led in procession
  preserved_meaning: The kings are passively led in a ceremonial or submissive manner.
  reasoning_layer_used: Lexical and theological decisions for נְהוּגִים
  rationale: The procession image preserves the passive movement without forcing captivity.
