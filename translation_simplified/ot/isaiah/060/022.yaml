  reasoning_layer_used: Lexical decision for יִהְיֶה and לָאֶלֶף, supported by the growth parallelism.
  rationale: “Grow to” states the promised numerical increase in natural English.
- pob_phrase: in its time I will hasten it
  simplified_phrase: At the appointed time, I will make it happen swiftly
  preserved_meaning: Yahweh will bring about the promise rapidly at its proper time.
  reasoning_layer_used: Theological decision preserving appointed timing together with divine hastening.
  rationale: The new wording makes both timing and speed immediately understandable.
