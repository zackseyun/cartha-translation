translation:
  language: en
  text: The smallest will grow to a thousand people,[a] and the least will become a mighty nation. I am Yahweh. At the appointed time, I will make it happen swiftly.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “A thousand” may also mean “a clan,” but the numerical meaning best fits the promised growth.
    reason: lexical_alternative
