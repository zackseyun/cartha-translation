translation:
  language: en
  text: People will no longer hear of violence in your land or of devastation and destruction within your borders. You will name your walls Salvation and your gates Praise.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Devastation and destruction” can also be translated “plunder and ruin.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Violence will no longer be heard in your land
  simplified_phrase: People will no longer hear of violence in your land
  preserved_meaning: Reports or sounds of violence will no longer be present in the land.
  reasoning_layer_used: The lexical decision allows “will be heard of” and identifies the construction as passive in sense.
  rationale: The active sentence is easier to understand while keeping the same broad claim.
- pob_phrase: devastation or destruction within your borders
  simplified_phrase: or of devastation and destruction within your borders
  preserved_meaning: Ruin caused by violence will no longer be known throughout the territory.
  reasoning_layer_used: The lexical decisions preserve both parallel ruin terms and the spatial border image.
  rationale: Linking both terms to “hear of” makes their relationship to the opening clause clear.
- pob_phrase: you will call your walls Salvation, and your gates Praise
  simplified_phrase: You will name your walls Salvation and your gates Praise
  preserved_meaning: The restored city’s walls and gates receive the title-like names Salvation and Praise.
  reasoning_layer_used: The theological decision requires both words to remain capitalized, name-like titles.
  rationale: “Name” makes the naming action immediately clear without weakening the city images.
translation_notes:
  risk_flags:
  - risk: Changing the passive wording to “People will no longer hear of” supplies an unstated generic subject.
    mitigation: The wording follows the documented alternative “will be heard of” without narrowing who hears.
