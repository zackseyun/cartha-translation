translation:
  language: en
  text: All Kedar’s flocks will be gathered to you, and Nebaioth’s rams will serve you. They will go up onto my altar as offerings I accept, and I will make my glorious temple beautiful.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally calls the temple “my glorious house.”
