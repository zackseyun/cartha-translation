simplification_decisions:
- pob_phrase: All the flocks of Kedar
  simplified_phrase: All Kedar’s flocks
  preserved_meaning: The collective flocks belonging to Kedar remain in view.
  reasoning_layer_used: Lexical decision for צֹאן and קֵדָר
  rationale: The possessive form is shorter and more natural without narrowing “flocks” to sheep.
- pob_phrase: the rams of Nebaioth will minister to you
  simplified_phrase: Nebaioth’s rams will serve you
  preserved_meaning: The rams provide service to the personified Zion.
  reasoning_layer_used: Lexical decision for יְשָׁרְתוּנֶךְ
  rationale: “Serve” is the documented plain-language alternative and retains the worship context.
- pob_phrase: They will go up with acceptance on my altar
  simplified_phrase: They will go up onto my altar as offerings I accept
  preserved_meaning: The animals ascend the altar as sacrifices God receives favorably.
  reasoning_layer_used: Lexical and theological decisions for יַעֲלוּ עַל רָצוֹן
  rationale: The wording preserves the upward image while making the sacrificial acceptance clear.
