translation:
  language: en
  text: You were abandoned and hated, and no one passed through. But I will give you honor that lasts forever,[a] and I will make you a joy for generation after generation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be expressed as “everlasting majesty” or “everlasting glory”; it describes an honored status, not sinful pride.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Instead of your being forsaken and hated
  simplified_phrase: You were abandoned and hated. But
  preserved_meaning: God promises to reverse Zion’s former rejection.
  reasoning_layer_used: Lexical decisions for תַּחַת and עֲזוּבָה
  rationale: Direct clauses make the reversal easier to follow.
- pob_phrase: with no one passing through
  simplified_phrase: and no one passed through
  preserved_meaning: The city was deserted, with no one passing through it.
  reasoning_layer_used: Lexical decision for וְאֵין עוֹבֵר
  rationale: The wording preserves the desolation image without narrowing who passed through.
- pob_phrase: I will make you an everlasting majesty, a joy from generation to generation
  simplified_phrase: I will give you honor that lasts forever, and I will make you a joy for generation after generation
  preserved_meaning: God will give Zion lasting honored status and make her a continuing joy.
  reasoning_layer_used: Lexical and theological decisions for גאון, עוֹלָם, מְשׂוֹשׂ, and דּוֹר וָדוֹר
  rationale: Common wording retains both Zion’s honored status and the image of her being made a joy.
