translation:
  language: en
  text: All your people will be righteous. They will possess the land forever.[a][b] They are the shoot from his planting, the work of my hands, so that I may be glorified.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “will inherit the land.”
    reason: lexical_alternative
  - marker: b
    text: Or “the earth.”
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew: “the shoot of his planting.” The Hebrew then shifts to “the work of my hands.” Some interpreters smooth the first phrase to “the shoot of my planting.”'
    reason: textual_variant
simplification_decisions:
- pob_phrase: And all your people will be righteous; forever they will possess the land
  simplified_phrase: All your people will be righteous. They will possess the land forever.
  preserved_meaning: Every person among Zion’s people will be righteous and will possess the land permanently.
  reasoning_layer_used: POB lexical decisions for “all,” “righteous,” “forever,” “possess,” and “land”
  rationale: Two direct sentences make the promise easier to follow without weakening its scope or permanence.
- pob_phrase: the shoot of his planting, the work of my hands
  simplified_phrase: They are the shoot from his planting, the work of my hands
  preserved_meaning: The people are pictured as growth produced by his planting and as God’s own handiwork.
  reasoning_layer_used: POB lexical and theological decisions on the plant image and person shift
  rationale: The added subject identifies the people while preserving both images and the shift from “his” to “my.”
- pob_phrase: that I may be glorified
  simplified_phrase: so that I may be glorified
  preserved_meaning: God’s work in his people results in his being glorified.
  reasoning_layer_used: POB lexical decision for לְהִתְפָּאֵר
  rationale: “So that” expresses the purpose naturally without changing its theological focus.
translation_notes:
