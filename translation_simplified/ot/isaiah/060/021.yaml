    mitigation: The main text preserves the Masoretic person shift, and footnote c explains it without claiming an unsupported textual tradition.
  - risk: “Land” may be understood too narrowly although the Hebrew can also mean “earth.”
    mitigation: Footnote b preserves the broader lexical possibility.
