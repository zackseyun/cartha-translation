translation:
  language: en
  text: I will bring gold in place of bronze, and silver in place of iron. I will bring bronze in place of wood, and iron in place of stone. I will make peace serve as your overseers[a], and righteousness[b] serve as your taskmasters[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “your administration” or “your officers.”
    reason: lexical_alternative
  - marker: b
    text: Or “justice.”
    reason: lexical_alternative
  - marker: c
    text: Or “your rulers” or “your oppressors”; the Hebrew often refers to those who demand labor or tribute.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Instead of bronze I will bring gold, and instead of iron I will bring silver
  simplified_phrase: I will bring gold in place of bronze, and silver in place of iron.
  preserved_meaning: God will supply superior materials to replace the former ones.
  reasoning_layer_used: Lexical decisions for תַּחַת and אָבִיא
  rationale: Natural English order makes the substitutions easier to follow.
- pob_phrase: instead of wood, bronze, and instead of stones, iron
  simplified_phrase: I will bring bronze in place of wood, and iron in place of stone.
  preserved_meaning: Bronze replaces wood, and iron replaces building stone.
  reasoning_layer_used: Lexical decisions and source parallelism
  rationale: A new sentence and repeated verb clearly distinguish the two exchanges.
- pob_phrase: I will make peace your overseers, and righteousness your taskmasters
  simplified_phrase: I will make peace serve as your overseers, and righteousness serve as your taskmasters.
  preserved_meaning: Peace and righteousness are poetically portrayed as Jerusalem’s transformed authorities.
  reasoning_layer_used: Theological decision and doctrine realignment
  rationale: Adding “serve as” explains the poetic relationship while preserving the personification and plural parallelism.
