translation:
  language: en
  text: Together they stoop and bow down.[a] They cannot rescue what is being carried. They themselves[b] go into captivity.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The first verb may also mean “crouch” or suggest collapsing.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew can literally refer to their “self,” “life,” or “soul”; here it means the idols themselves.
    reason: lexical_alternative
