translation:
  language: en
  text: Some people pour gold out of their purses and weigh silver on a scale. They hire a goldsmith, who makes it into a god. Then they bow down to it; they even lie facedown before it.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Those who lavish gold from the purse
  simplified_phrase: Some people pour gold out of their purses
  preserved_meaning: They freely expend their stored gold to make an idol.
  reasoning_layer_used: Lexical decision for הַזָּלִים and זָהָב מִכִּיס
  rationale: The concrete action of pouring out gold is easier to picture than “lavish” while retaining extravagant spending.
- pob_phrase: hire a goldsmith, and he makes it into a god
  simplified_phrase: They hire a goldsmith, who makes it into a god
  preserved_meaning: A hired craftsman turns the precious metal into an object regarded as a deity.
  reasoning_layer_used: Lexical and theological decisions for יִשְׂכְּרוּ צוֹרֵף and וְיַעֲשֵׂהוּ אֵל
  rationale: The relative clause makes the sequence natural while preserving the deliberate phrase “a god.”
- pob_phrase: they bow down, indeed they prostrate themselves
  simplified_phrase: Then they bow down to it; they even lie facedown before it
  preserved_meaning: Their worship intensifies from bowing to full bodily prostration.
  reasoning_layer_used: Lexical decision for יִסְגְּדוּ אַף יִשְׁתַּחֲווּ
  rationale: “Lie facedown” clearly expresses prostration, and “even” preserves the rhetorical escalation.
interpretive_expansions:
- pob_phrase: they bow down, indeed they prostrate themselves
  rendering: they bow down to it; they even lie facedown before it
  claim: The crafted god is the object of both acts.
  evidence:
  - The singular crafted object in the preceding clause remains the immediate referent.
  - Both Hebrew verbs describe homage directed toward an object of worship.
  confidence: high
  alternatives_preserved:
  - The wording still distinguishes bowing from full prostration.
translation_notes:
  risk_flags:
  - risk: The words “a god” could be mistaken for affirming that the object is truly divine.
    mitigation: The statement that a hired goldsmith makes it keeps Isaiah’s polemical portrayal of a manufactured false deity clear.
