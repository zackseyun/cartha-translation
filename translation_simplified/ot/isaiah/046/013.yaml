translation:
  language: en
  text: I have brought my righteousness[a] close. It is not far away, and my salvation will not be late. I will place salvation in Zion, for Israel my splendor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “my justice” or “my vindication.”
    reason: lexical_alternative
  - marker: b
    text: Or “my glory.” The Hebrew leaves the exact relationship between God’s splendor and Israel compressed.
