simplification_decisions:
- pob_phrase: I have brought near my righteousness
  simplified_phrase: I have brought my righteousness close
  preserved_meaning: God has made his righteousness near while retaining the broad theological term.
  reasoning_layer_used: Lexical and theological decisions for צִדְקָתִי
  rationale: Ordinary English word order makes the image clearer without narrowing righteousness to justice or vindication.
- pob_phrase: my salvation will not delay
  simplified_phrase: my salvation will not be late
  preserved_meaning: God’s salvation will come without delay.
  reasoning_layer_used: Lexical decision for לֹא תְאַחֵר
  rationale: “Will not be late” expresses the imminent force in common English.
- pob_phrase: I will place salvation in Zion, for Israel my splendor
  simplified_phrase: I will place salvation in Zion, for Israel my splendor
  preserved_meaning: God locates salvation in Zion while the compressed relation between his splendor and Israel remains unresolved.
  reasoning_layer_used: Lexical decisions for וְנָתַתִּי and תִּפְאַרְתִּי, plus the theological ambiguity decision
  rationale: Keeping “place” and restrained punctuation avoids creating a clearer syntactic relation than the Hebrew warrants.
translation_notes:
  risk_flags:
  - risk: The final phrase remains unusual because the Hebrew compresses how God’s splendor relates to Israel.
    mitigation: The wording preserves that ambiguity, and footnote b alerts readers to it.
