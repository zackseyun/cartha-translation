simplification_decisions:
- pob_phrase: house of Jacob, and all the remnant of the house of Israel
  simplified_phrase: house of Jacob, and all the remnant of the house of Israel
  preserved_meaning: God addresses both coordinated groups while retaining Isaiah’s important term “remnant.”
  reasoning_layer_used: Hebrew coordination and theological decision on remnant terminology
  rationale: Keeping “and” prevents the second group from sounding like a restatement of the first.
- pob_phrase: who have been borne by me ... carried
  simplified_phrase: I have carried you ... and borne you
  preserved_meaning: God himself bears his people, unlike the idols that people must carry.
  reasoning_layer_used: Lexical decisions and immediate-context agency rationale
  rationale: Active wording clarifies God’s agency while preserving both carrying images.
- pob_phrase: from birth ... from the womb
  simplified_phrase: from the womb ... from birth
  preserved_meaning: God’s care began at the people’s earliest life.
  reasoning_layer_used: Lexical decisions for בטן and רחם and POB footnote
  rationale: Reordering the poetic parallels avoids suggesting that the womb comes after birth.
translation_notes:
  risk_flags:
