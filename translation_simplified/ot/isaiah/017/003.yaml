  preserved_meaning: Ephraim will no longer have its fortress.
  reasoning_layer_used: Lexical decisions for וְנִשְׁבַּת and מִבְצָר
  rationale: The recast uses ordinary English without specifying how the fortress ends.
- pob_phrase: and the kingdom from Damascus
  simplified_phrase: and Damascus’s kingdom will come to an end
  preserved_meaning: Damascus will no longer continue as a kingdom.
  reasoning_layer_used: Lexical decisions for מַמְלָכָה and the carried sense of וְנִשְׁבַּת
  rationale: Supplying the shared verb makes the compressed Hebrew structure clear.
- pob_phrase: the remnant of Aram
  simplified_phrase: what remains of Aram
  preserved_meaning: The surviving remainder of Aram is in view.
  reasoning_layer_used: Lexical decision for שְׁאָר אֲרָם
  rationale: Common wording replaces a specialized prophetic term while retaining Aram’s name.
