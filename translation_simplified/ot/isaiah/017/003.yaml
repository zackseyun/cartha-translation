translation:
  language: en
  text: Ephraim’s fortress will be gone, and Damascus’s kingdom will come to an end. What remains of Aram will be like the glory of the people of Israel.[a] The LORD of hosts declares this.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Glory” may also mean honor or splendor; the comparison may point to the same coming decline as Israel’s, but the Hebrew leaves this unstated.
    reason: alternative_reading
