translation:
  language: en
  text: He will not turn to the altars—the things his hands have made. He will pay no attention to what his fingers have made—the Asherah poles[a] and the incense altars.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Asherim.” These were objects used in the worship of Asherah, though their exact form is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or “sun-pillars” or “sun images.” The exact kind of pagan worship object is uncertain.
    reason: lexical_alternative
