translation:
  language: en
  text: On the day you plant, you make it flourish. By morning, you make your seed sprout. But in a day of grief[b] and incurable pain, the harvest vanishes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is difficult and may instead mean “the harvest is a heap.”
    reason: lexical_alternative
  - marker: b
    text: “A day of grief” may also mean “a day of sickness” or “a day of affliction.”
    reason: lexical_alternative
