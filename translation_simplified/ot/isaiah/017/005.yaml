simplification_decisions:
- pob_phrase: as when one gathers standing grain at harvest
  simplified_phrase: like a harvester gathering standing grain
  preserved_meaning: The comparison pictures a worker gathering grain that is still standing in the field.
  reasoning_layer_used: Lexical decisions for כֶּאֱסֹף, קָצִיר, and קָמָה
  rationale: “A harvester” states the implied worker naturally without changing the generic action.
- pob_phrase: the ears
  simplified_phrase: the heads of grain
  preserved_meaning: The phrase refers to the grain-bearing tops of the stalks.
  reasoning_layer_used: Lexical decision for שִׁבֳּלִים
  rationale: “Heads of grain” avoids the likely modern misunderstanding of “ears.”
- pob_phrase: as when one gleans ears
  simplified_phrase: like someone gathering the heads left behind
  preserved_meaning: The person gathers grain remaining after the main harvest.
  reasoning_layer_used: Lexical decision for כִּמְלַקֵּט
  rationale: The wording explains the unfamiliar farming term “gleans” in the main text.
