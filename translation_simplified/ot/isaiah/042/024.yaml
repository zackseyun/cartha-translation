translation:
  language: en
  text: Who handed Jacob over to be plundered, and Israel over to looters? Was it not Yahweh, the one we have sinned against? They were not willing to follow his ways, and they did not listen to his law.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “instruction.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: gave Jacob over to plunder
  simplified_phrase: handed Jacob over to be plundered
  preserved_meaning: Jacob was delivered into the power of people who would despoil him.
  reasoning_layer_used: Lexical decision for ל/משוסה and its source-language image.
  rationale: The passive wording clearly shows what being given over to plunder means.
- pob_phrase: he against whom we have sinned
  simplified_phrase: the one we have sinned against
  preserved_meaning: Yahweh is the one whom the people have offended by their sin.
  reasoning_layer_used: Lexical decisions for זוּ and חָטָאנוּ לּוֹ.
  rationale: Natural English preserves the relative clause and its emphasis on Yahweh.
- pob_phrase: walk in his ways
  simplified_phrase: follow his ways
  preserved_meaning: They were unwilling to conduct their lives according to Yahweh’s ways.
  reasoning_layer_used: Lexical decision for בִדְרָכָיו הָלוֹךְ.
  rationale: “Follow” makes the conduct image immediately understandable without generalizing it.
translation_notes:
  risk_flags:
  - risk: Readers may find the shift from “we” to “they” unexpected.
    mitigation: The shift is retained because the Hebrew moves from communal confession to third-person description.
  - risk: “Law” may sound narrower than Hebrew torah.
    mitigation: A brief footnote preserves “instruction” as the important lexical alternative.
