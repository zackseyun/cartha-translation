translation:
  language: en
  text: Sing a new song to Yahweh! From the farthest edge of the earth, sing his praise—you who go down to the sea, all that fills it, and the coastlands[a] with everyone who lives there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “islands”; the Hebrew word can mean islands or distant coastal lands.
    reason: lexical_alternative
