simplification_decisions:
- pob_phrase: I have called you in righteousness
  simplified_phrase: I have called you in righteousness
  preserved_meaning: Yahweh’s call is characterized by the broad Hebrew sense of righteousness or justice.
  reasoning_layer_used: Lexical decision for בְצֶדֶק and grounding review
  rationale: The audited phrase is retained because a simpler paraphrase would narrow its meaning.
- pob_phrase: I will keep you
  simplified_phrase: I will watch over you
  preserved_meaning: Yahweh will guard and protect the servant.
  reasoning_layer_used: Lexical decision for וְאֶצָּרְךָ
  rationale: “Watch over” makes the protective meaning clear in modern English.
- pob_phrase: and give you as a covenant for the people, as a light for the nations
  simplified_phrase: I will give you to be a covenant for the people and a light for the nations
  preserved_meaning: The servant himself is given in a covenantal role for the people and as light for the nations.
  reasoning_layer_used: Theological decisions on servant identity and the people-nations contrast
  rationale: The recast wording is natural while preserving both distinct roles and the direct covenant image.
translation_notes:
  risk_flags:
  - risk: “Righteousness” may be unfamiliar or seem limited to moral conduct.
    mitigation: The footnote preserves “justice” as the other important lexical sense.
  - risk: Calling the servant a covenant remains unusual for modern readers.
    mitigation: The direct image is retained rather than narrowed to covenant mediator.
