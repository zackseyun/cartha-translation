simplification_decisions:
- pob_phrase: Behold my servant, whom I uphold
  simplified_phrase: Here is my servant, the one I support
  preserved_meaning: God calls attention to his servant and declares that he sustains him.
  reasoning_layer_used: Lexical decisions for הֵן and אֶתְמָךְ בּוֹ
  rationale: Common wording replaces the elevated introduction and the less familiar sense of “uphold.”
- pob_phrase: my chosen one, in whom my soul delights
  simplified_phrase: He is my chosen one, and my whole being delights in him
  preserved_meaning: God specially chose the servant and takes profound delight in him.
  reasoning_layer_used: Lexical decision for רָצְתָה נַפְשִׁי
  rationale: A separate sentence clarifies the relationship while preserving the force of the soul image.
- pob_phrase: I have put my Spirit upon him; he will bring forth justice to the nations
  simplified_phrase: I have placed my Spirit on him. He will bring justice to the nations.
  preserved_meaning: God empowers the servant by his Spirit for a worldwide mission of justice.
  reasoning_layer_used: Lexical and theological decisions for רוּחִי, מִשְׁפָּט, and יוֹצִיא
  rationale: Shorter clauses use natural English without weakening the divine Spirit or the servant’s mission.
