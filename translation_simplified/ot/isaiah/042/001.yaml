translation:
  language: en
  text: Here is my servant,[a] the one I support. He is my chosen one, and my whole being delights in him. I have placed my Spirit on him. He will bring justice[b] to the nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In the New Testament, this verse is applied to Jesus the Messiah (see Matthew 12:18).
    reason: cross_reference
  - marker: b
