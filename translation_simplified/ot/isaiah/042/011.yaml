translation:
  language: en
  text: Let the wilderness and its towns lift their voices. Let the settlements where Kedar lives do the same. Let the people of Sela[a] sing for joy. Let them shout from the mountaintops.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the people who live in the rock.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the wilderness and its cities
  simplified_phrase: the wilderness and its towns
  preserved_meaning: The wilderness and its inhabited places are poetically called to praise.
  reasoning_layer_used: Lexical decisions for מִדְבָּר and וְעָרָיו
  rationale: “Towns” is natural English for inhabited places in the wilderness.
- pob_phrase: the settlements where Kedar dwells
  simplified_phrase: the settlements where Kedar lives do the same
  preserved_meaning: Kedar’s settlements share the command to lift their voices.
  reasoning_layer_used: Lexical decisions for חֲצֵרִים and תֵּשֵׁב קֵדָר
  rationale: A separate sentence clearly carries the opening command over to Kedar’s settlements.
- pob_phrase: the inhabitants of Sela
  simplified_phrase: the people of Sela
  preserved_meaning: Those living in Sela are called to joyful song.
  reasoning_layer_used: Lexical decisions for יֹשְׁבֵי and סֶלַע
  rationale: “People of” is common English and retains Sela as the likely place name.
translation_notes:
  risk_flags:
  - risk: “Do the same” explicitly carries the opening command over to Kedar’s settlements.
    mitigation: The Hebrew syntax places these settlements under the same call to lift their voices.
  - risk: Readers may take Sela only as a place name, though the Hebrew can mean “the rock.”
    mitigation: The footnote preserves the singular lexical alternative.
