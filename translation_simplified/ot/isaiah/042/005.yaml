translation:
  language: en
  text: 'This is what God, Yahweh, says: He created the heavens and stretched them out. He spread out[a] the earth and what comes from it.[b] He gives breath to the people on it and spirit[c] to those who walk on it:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also suggest hammering or beating something out until it spreads.
    reason: lexical_alternative
  - marker: b
    text: This may mean the earth’s offspring or produce.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew word can also mean “breath” or “wind.”
    reason: lexical_alternative
