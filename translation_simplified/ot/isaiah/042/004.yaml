  preserved_meaning: The servant will endure until his work is accomplished, while both source images remain intact.
  reasoning_layer_used: POB lexical decisions and immediate context
  rationale: The sentence break clarifies his perseverance without removing either image.
- pob_phrase: establishes justice in the earth
  simplified_phrase: puts justice in place on the earth
  preserved_meaning: The servant will establish justice with the broad earthly scope indicated by the verse.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Common wording preserves the resultative force and avoids implying distribution in every location.
- pob_phrase: the coastlands will wait for his instruction
  simplified_phrase: The coastlands will wait expectantly for his instruction
  preserved_meaning: Distant maritime lands will look forward to the servant’s weighty teaching.
  reasoning_layer_used: POB lexical decisions
  rationale: “Expectantly” communicates the documented hopeful sense while retaining “instruction.”
