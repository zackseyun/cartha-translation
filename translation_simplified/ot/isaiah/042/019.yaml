translation:
  language: en
  text: Who is blind if not my servant? Who is as deaf as the messenger I send? Who is as blind as the one who is at peace,[a] as blind as Yahweh’s servant?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the one who is perfect” or “the one who is blameless.” The Hebrew word may describe someone complete, whole, or in a right relationship.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Who is blind but my servant
  simplified_phrase: Who is blind if not my servant?
  preserved_meaning: The rhetorical question singles out the servant for blindness.
  reasoning_layer_used: Lexical decision for כִּי אִם and theological decision on the servant’s identity
  rationale: The familiar phrase “if not” makes the exclusive force of “but” immediately clear.
- pob_phrase: and deaf like my messenger whom I send?
  simplified_phrase: Who is as deaf as the messenger I send?
  preserved_meaning: God’s commissioned messenger is rebuked as deaf.
  reasoning_layer_used: Lexical decisions for חֵרֵשׁ, מַלְאָכִי, and אֶשְׁלָח
  rationale: A separate question clarifies the parallel accusation without identifying the messenger more narrowly.
- pob_phrase: Who is blind like the one who is at peace, and blind like the servant of Yahweh?
  simplified_phrase: Who is as blind as the one who is at peace, as blind as Yahweh’s servant?
  preserved_meaning: The repeated blindness and the difficult relational description remain central.
  reasoning_layer_used: Lexical and theological decisions for מְשֻׁלָּם and עֶבֶד יְהוָה
  rationale: The repeated comparison is recast in natural English while keeping its rhetorical force.
translation_notes:
