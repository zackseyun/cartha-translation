translation:
  language: en
  text: So God poured out on Israel the heat of his anger and the fierce force of battle. It set him ablaze on every side, but he did not understand what it meant. It burned him, but he did not take it to heart.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Israel is pictured as one man, so the verse refers to the nation as “him.”
    reason: cultural_note
