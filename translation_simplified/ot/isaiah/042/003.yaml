simplification_decisions:
- pob_phrase: A bruised reed he will not break
  simplified_phrase: He will not break a bruised reed
  preserved_meaning: The servant will not finish breaking what is already damaged and fragile.
  reasoning_layer_used: POB lexical and theological decisions on קָנֶה, רָצוּץ, and יִשְׁבּוֹר
  rationale: Ordinary English word order makes the line easier to read while retaining the concrete metaphor.
- pob_phrase: a dimly burning wick he will not extinguish
  simplified_phrase: put out a dimly burning wick
  preserved_meaning: The servant will not extinguish a flame that is close to going out.
  reasoning_layer_used: POB lexical decisions on פִשְׁתָּה, כֵהָה, and יְכַבֶּנָּה
  rationale: “Put out” is clearer everyday English and preserves the lamp image.
- pob_phrase: he will faithfully bring forth justice
  simplified_phrase: He will faithfully bring about justice
  preserved_meaning: The servant will reliably cause justice to be established.
  reasoning_layer_used: POB lexical and theological decisions on לֶאֱמֶת, יוֹצִיא, and מִשְׁפָּט
  rationale: “Bring about” clearly expresses producing justice without changing “faithfully” or resolving its noted alternative.
