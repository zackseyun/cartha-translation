  preserved_meaning: Yahweh is God’s personal name and unique identity.
  reasoning_layer_used: Lexical and theological decisions on the divine name
  rationale: Two short sentences clarify the declaration without replacing Yahweh with a title.
- pob_phrase: I will not give my glory to another
