translation:
  language: en
  text: Those who trust in an idol and say to a cast-metal image, “You are our gods,” will be turned back and completely put to shame.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Turned back” can also mean that they will retreat or be driven back.
    reason: lexical_alternative
