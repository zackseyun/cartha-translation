  preserved_meaning: The idolaters will be defeated and emphatically disgraced.
  reasoning_layer_used: POB lexical decisions and Hebrew clause structure
  rationale: Reordering the sentence identifies the people first while preserving both results of judgment.
- pob_phrase: a cast image
  simplified_phrase: a cast-metal image
  preserved_meaning: The object is a manufactured image made by casting metal.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Adding “metal” makes the manufacturing term clear without merging it with “idol.”
- pob_phrase: utterly put to shame
  simplified_phrase: completely put to shame
  preserved_meaning: The Hebrew emphatic expression describes total public disgrace.
  reasoning_layer_used: POB lexical decision on יֵבֹשׁוּ בֹשֶׁת
  rationale: “Completely” is more common English while retaining the full emphasis.
