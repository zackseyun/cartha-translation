translation:
  language: en
  text: I will force your oppressors to eat their own flesh. They will become drunk on their own blood as though it were sweet wine.[a] Then all flesh—all humanity—will know that I am Yahweh, your Savior and Redeemer, the Mighty One of Jacob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “new wine.” The Hebrew word can refer to sweet or freshly pressed wine or juice.
    reason: lexical_alternative
