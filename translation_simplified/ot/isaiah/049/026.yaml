- pob_phrase: I will make those who oppress you eat
  simplified_phrase: I will force your oppressors to eat
  preserved_meaning: Yahweh causes Zion’s oppressors to undergo this judgment.
  reasoning_layer_used: Lexical decision for the causative verb and the noun for oppressors.
  rationale: “Force your oppressors” states the causative action more directly.
- pob_phrase: they will become drunk with their own blood as with sweet wine
  simplified_phrase: They will become drunk on their own blood as though it were sweet wine.
  preserved_meaning: The shocking image compares blood-intoxication to drunkenness from wine.
  reasoning_layer_used: Lexical decisions and the theological decision to retain violent imagery.
  rationale: “Drunk on” and “as though” make the comparison natural without softening it.
- pob_phrase: Then all flesh will know that I, Yahweh, am your Savior and your Redeemer
  simplified_phrase: Then all flesh—all humanity—will know that I am Yahweh, your Savior and Redeemer
  preserved_meaning: Every human being will recognize Yahweh as Zion’s Savior and covenant Redeemer.
  reasoning_layer_used: Theological decision for “all flesh” and lexical decisions for the divine titles.
  rationale: The added gloss explains the prophetic idiom while retaining its biblical wording.
