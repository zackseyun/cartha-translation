  text: Kings will be like foster fathers to you, caring for and protecting you, and their princesses will be like nursing mothers to you. They will bow before you with their faces to the ground and lick the dust at your feet. Then you will know that I am Yahweh. Those who wait for me in hope will not end in disgrace.
