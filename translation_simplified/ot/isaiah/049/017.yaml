  reasoning_layer_used: Lexical decisions for מְהָרְסַיִךְ and וּמַחֲרִבַיִךְ
  rationale: Naming the city clarifies the personified addressee while preserving the demolition and ruin images.
- pob_phrase: will depart from you
  simplified_phrase: will leave you
  preserved_meaning: The destroyers will go away from Zion.
  reasoning_layer_used: Lexical decisions for מִמֵּךְ and יֵצֵאוּ
  rationale: “Will leave you” expresses the same separation in more common English.
