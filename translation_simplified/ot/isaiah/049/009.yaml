- pob_phrase: to those in darkness, “Show yourselves.”
  simplified_phrase: to those in darkness, “Come into view!”
  preserved_meaning: Those hidden in darkness are commanded to become visible.
  reasoning_layer_used: POB lexical decision for הִגָּלוּ
  rationale: “Come into view” clearly expresses the command to become visible without defining the darkness.
- pob_phrase: on all the bare heights will be their pasture
  simplified_phrase: every bare hilltop will be their pasture
  preserved_meaning: Every exposed, treeless height will serve as a grazing place.
  reasoning_layer_used: POB lexical decisions for שְׁפָיִם and מַרְעִיתָם
  rationale: Ordinary word order and “hilltop” make the landscape easier to picture without adding a provision nuance.
