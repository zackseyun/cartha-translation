translation:
  language: en
  text: Look all around you and see! They are all gathering together and coming to you. “As surely as I live,” declares Yahweh, “you will wear them all like jewelry and fasten them on yourself like a bride.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Lift up your eyes all around and see
  simplified_phrase: Look all around you and see!
  preserved_meaning: Zion is commanded to look in every direction and notice what is happening.
  reasoning_layer_used: Lexical decisions for שְׂאִי, סָבִיב, and וּרְאִי
  rationale: The direct command naturally expresses the comprehensive summons.
- pob_phrase: they all gather together; they come to you
  simplified_phrase: They are all gathering together and coming to you
  preserved_meaning: The whole group is vividly pictured assembling and approaching Zion.
  reasoning_layer_used: Lexical decisions for כֻּלָּם, נִקְבְּצוּ, and בָאוּ לָךְ
  rationale: The coordinated wording remains fluid while preserving gathering and coming as distinct actions.
- pob_phrase: you will surely put them all on like an ornament and bind them on like a bride
  simplified_phrase: you will wear them all like jewelry and fasten them on yourself like a bride
  preserved_meaning: The returning people will adorn Zion as jewelry adorns a bride.
  reasoning_layer_used: Lexical decisions for כָּעֲדִי, תִלְבָּשִׁי, וּתְקַשְּׁרִים, and כַּכַּלָּה
  rationale: “Wear” and “fasten” make the concrete bridal-adornment image immediately understandable.
interpretive_expansions:
- pob_phrase: As I live
  rendering: As surely as I live
  claim: The divine oath emphatically guarantees the promise that follows.
  evidence:
  - The lexical rationale identifies חַי אָנִי as a standard divine oath formula.
  - The following כִּי has the emphatic force represented by “surely.”
  confidence: high
  alternatives_preserved:
  - As I live
translation_notes:
  risk_flags:
