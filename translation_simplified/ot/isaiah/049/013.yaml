translation:
  language: en
  text: Heavens, shout for joy! Earth, rejoice! Mountains, burst into joyful song! For Yahweh[a] has comforted his people, and he will have compassion on his afflicted people.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh is God's personal name; many translations represent it as “the LORD.”
    reason: source_note
  - marker: b
    text: The Hebrew may also describe them as his poor or his humble people.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Shout for joy, O heavens, and rejoice, O earth
  simplified_phrase: Heavens, shout for joy! Earth, rejoice!
  preserved_meaning: The heavens and earth are directly summoned to celebrate.
  reasoning_layer_used: POB lexical decisions for רָנּוּ, שָׁמַיִם, וְגִילִי, and אָרֶץ
  rationale: Two short exclamations make the poetic summons easier to follow.
- pob_phrase: let the mountains break out in singing
  simplified_phrase: Mountains, burst into joyful song!
  preserved_meaning: The mountains are pictured as suddenly joining the joyful praise.
  reasoning_layer_used: POB lexical decisions for יפצחו and רִנָּה
  rationale: The direct command retains the personification and vocal joy.
- pob_phrase: for Yahweh has comforted his people and will have compassion on his afflicted ones
  simplified_phrase: For Yahweh has comforted his people, and he will have compassion on his afflicted people.
  preserved_meaning: Yahweh's comfort and compassion toward his afflicted people are the reason for the cosmic rejoicing.
  reasoning_layer_used: POB lexical decisions for כִּי, נִחַם, עַמּוֹ, וַעֲנִיָּו, and יְרַחֵם
  rationale: The wording keeps the causal link while replacing the awkward phrase “afflicted ones.”
interpretive_expansions:
- pob_phrase: his afflicted ones
  rendering: his afflicted people
  claim: The afflicted ones belong to the covenant people named in the parallel clause.
  evidence:
  - The paired clauses describe those Yahweh comforts and treats with compassion.
  - Both Hebrew expressions carry the possessive “his.”
  confidence: high
  alternatives_preserved:
  - his poor people
  - his humble people
translation_notes:
  risk_flags:
