  language: en
  text: 'This is what Yahweh says: “Even people held captive by the mighty will be taken away from their captors.[a] Those seized as prey by the ruthless will escape. I myself will challenge whoever challenges you, and I myself will save your children.[b]”'
  philosophy: optimal-equivalence
  footnotes:
