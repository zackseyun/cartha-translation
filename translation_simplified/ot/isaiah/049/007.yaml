translation:
  language: en
  text: 'This is what Yahweh, Israel’s Redeemer, his Holy One,[a] says to the one who is deeply despised,[b] whom the nation detests, and who is a servant under rulers:


    “Kings will see you and rise to their feet. Princes will bow down. They will do this because of Yahweh, who is faithful—the Holy One of Israel, who has chosen you.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew says “his Holy One.” The phrase is difficult. It may identify the one addressed, or it may be read as a title for Yahweh.
    reason: alternative_reading
  - marker: b
    text: The compressed Hebrew may also mean “despised by people” or simply “the despised one.”
    reason: lexical_alternative
  - marker: c
    text: The Hebrew does not explicitly say whom the princes bow to. The homage occurs because of Yahweh, who is faithful.
    reason: alternative_reading
