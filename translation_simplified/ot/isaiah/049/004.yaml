translation:
  language: en
  text: But I said, “I have worked hard for nothing. I have used up my strength on what is empty and no more lasting than a breath. Yet surely justice for me rests with Yahweh,[a] and my God holds my reward.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “my cause” or “my vindication rests with Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Or “my recompense” or “my wages.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I have labored in vain
  simplified_phrase: I have worked hard for nothing
  preserved_meaning: The speaker describes strenuous work that appears to have achieved nothing.
  reasoning_layer_used: Lexical decision for לְרִיק and יָגַעְתִּי
  rationale: Common wording makes both the exertion and apparent lack of results immediately clear.
- pob_phrase: I have spent my strength for emptiness and vanity
  simplified_phrase: I have used up my strength on what is empty and no more lasting than a breath
  preserved_meaning: The effort was exhausted on something empty, fleeting, and seemingly futile.
  reasoning_layer_used: Lexical decisions for לְתֹהוּ וְהֶבֶל and כֹּחִי כִלֵּיתִי
  rationale: The rewrite preserves both Hebrew ideas and restores the concrete breath image behind “vanity.”
- pob_phrase: my justice is with Yahweh, and my reward is with my God
  simplified_phrase: justice for me rests with Yahweh, and my God holds my reward
  preserved_meaning: The servant entrusts his rightful case and recompense to God.
  reasoning_layer_used: Lexical and theological decisions for מִשְׁפָּטִי, פְעֻלָּתִי, and the divine name
  rationale: Natural English clarifies God's keeping without narrowing justice to completed vindication.
interpretive_expansions:
- pob_phrase: vanity
  rendering: no more lasting than a breath
  claim: The phrase presents the apparent result as fleeting and impossible to retain.
  evidence:
  - The lexical record identifies הֶבֶל as vapor or breath with an extended sense of futility.
  - The paired terms must remain distinct rather than collapse into one idea.
  confidence: high
  alternatives_preserved:
  - vanity
  - futility
- pob_phrase: my reward is with my God
  rendering: my God holds my reward
  claim: The reward remains in God's keeping despite the work's apparent failure.
  evidence:
  - The lexical rationale explains “with my God” as custody or keeping.
  - The parallel statement entrusts the servant's justice to Yahweh.
  confidence: high
  alternatives_preserved:
  - my reward is with my God
  - my reward comes from my God
