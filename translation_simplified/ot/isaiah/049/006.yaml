translation:
  language: en
  text: He said, “It is too small a task for you to be my servant only by raising up the tribes of Jacob and bringing back those of Israel who have been preserved.[a] I will also make you a light for the nations, so that you will be my salvation to the farthest part of the earth.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the survivors of Israel.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: It is too small a thing for you to be my servant
  simplified_phrase: It is too small a task for you to be my servant only
  preserved_meaning: Serving Israel alone is not the full extent of the servant’s mission.
  reasoning_layer_used: Lexical decision for נָקֵל and theological decision on mission scope
  rationale: “Task” and “only” make the idiom and contrast clear in ordinary English.
- pob_phrase: the preserved ones of Israel
  simplified_phrase: those of Israel who have been preserved
  preserved_meaning: The servant will bring back the people of Israel who were kept or guarded.
  reasoning_layer_used: Lexical decision for נְצִירֵי יִשְׂרָאֵל
  rationale: The clause avoids an unnatural label while retaining the passive sense of preservation.
- pob_phrase: to the end of the earth
  simplified_phrase: to the farthest part of the earth
  preserved_meaning: God’s salvation extends to earth’s most distant extremity.
  reasoning_layer_used: Lexical decision for עַד קְצֵה הָאָרֶץ
  rationale: “Farthest part” explains the singular extremity image in natural English.
interpretive_expansions:
- pob_phrase: too small a thing
  rendering: too small a task ... only
  claim: The mission to Israel by itself is insufficient because God also commissions the servant for the nations.
  evidence:
  - The next clause expands the mission with “I will also make you a light for the nations.”
  - The POB lexical rationale says the mission to Israel alone is inadequate within God’s larger purpose.
  confidence: high
  alternatives_preserved:
  - too light a thing
  - too insignificant a task
translation_notes:
  risk_flags:
  - risk: “Be my salvation” is a weighty expression that may sound like a complete identification of the servant with salvation.
    mitigation: The wording retains the source predicate without resolving the servant’s identity or narrowing his role to merely bringing salvation.
