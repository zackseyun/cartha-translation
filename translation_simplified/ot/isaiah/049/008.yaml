translation:
  language: en
  text: 'This is what Yahweh says: “At a time when I showed favor, I answered you. On a day of salvation,[a] I helped you. I will protect you and give you as a covenant for the people, so that you may restore the land and assign the desolate land portions as inheritances.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “deliverance.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Thus says Yahweh
  simplified_phrase: This is what Yahweh says
  preserved_meaning: Yahweh introduces his own authoritative declaration.
  reasoning_layer_used: POB translation and divine-name lexical decision
  rationale: The common formula is easier to understand while retaining Yahweh’s name and authority.
- pob_phrase: In a time of favor
  simplified_phrase: At a time when I showed favor
  preserved_meaning: Yahweh answered during a favorable time of his choosing.
  reasoning_layer_used: POB lexical decision for בְּעֵת רָצוֹן
  rationale: The wording makes the abstract phrase natural without adding favor to “answered.”
- pob_phrase: to apportion the desolate inheritances
  simplified_phrase: assign the desolate land portions as inheritances
  preserved_meaning: Devastated inherited portions will again be allocated as inheritances.
  reasoning_layer_used: POB lexical decision for לְהַנְחִיל נְחָלוֹת שֹׁמֵמוֹת
  rationale: The phrase explains the land-based inheritance while avoiding an unsupported possessive.
interpretive_expansions:
- pob_phrase: to raise up the land
  rendering: to restore the land
  claim: The raising image refers to bringing the devastated land back into an established condition.
  evidence:
  - The POB lexical rationale gives “restore the land” as an allowed sense.
  - The following desolate inheritances provide a restorative context.
  confidence: high
  alternatives_preserved:
  - raise up the land
  - establish the land
