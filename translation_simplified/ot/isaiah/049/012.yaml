  text: Look! Some will come from far away. Look! Others will come from the north and from the sea,[a] and still others from the land of Sinim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “from the west,” since “the sea” can refer to the west in Hebrew geography.
    reason: lexical_alternative
  - marker: b
    text: Sinim is an uncertain place-name. It may refer to Syene (modern Aswan) in southern Egypt; other locations have also been proposed.
    reason: alternative_reading
