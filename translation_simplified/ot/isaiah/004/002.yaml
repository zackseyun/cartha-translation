translation:
  language: en
  text: In that day, for Israel’s survivors, Yahweh’s branch[a] will be beautiful and glorious, and the fruit of the land will be majestic and splendid.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Yahweh’s growth” or “what Yahweh causes to sprout.” The Hebrew may point both to the land flourishing again and to the prophetic image of Yahweh’s “Branch.”
    reason: alternative_reading
  - marker: b
    text: Or “the remnant of Israel.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the branch of Yahweh will be for beauty and for glory
  simplified_phrase: Yahweh’s branch will be beautiful and glorious
  preserved_meaning: The branch is marked by beauty and glory while its identity remains open.
  reasoning_layer_used: POB lexical and theological decisions on צֶמַח יְהוָה
  rationale: The possessive and direct adjectives make the clause natural without resolving the branch image.
- pob_phrase: the fruit of the land for majesty and for splendor
  simplified_phrase: the fruit of the land will be majestic and splendid
  preserved_meaning: The land’s fruit is characterized by majesty and splendor.
  reasoning_layer_used: POB lexical decisions on פְרִי הָאָרֶץ, גָאוֹן, and תִפְאֶרֶת
  rationale: Adding the verb makes the parallel clause clear while retaining its agricultural image.
- pob_phrase: for the survivors of Israel
  simplified_phrase: for Israel’s survivors
  preserved_meaning: The whole promised restoration is presented for those of Israel who survive.
  reasoning_layer_used: POB syntax and lexical decision on פְלֵיטַת יִשְׂרָאֵל
  rationale: Placing the phrase before both images preserves its possible scope over the whole description.
translation_notes:
