translation:
  language: en
  text: On that day, seven women will take hold of one man and say, “We will provide our own food and clothing. Just let us be called by your name.[a] Take away our disgrace.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This likely implies marriage or another legal and social attachment to the man; the disgrace may include having no husband’s name or status.
    reason: cultural_note
