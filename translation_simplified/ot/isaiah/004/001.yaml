  preserved_meaning: The event occurs in the prophetic time being described.
  reasoning_layer_used: Lexical decision for בַּיּוֹם הַהוּא
  rationale: “On that day” is the more natural modern form of the same prophetic expression.
- pob_phrase: We will eat our own bread and wear our own clothing
  simplified_phrase: We will provide our own food and clothing
  preserved_meaning: The women promise not to depend on the man for food or clothes.
  reasoning_layer_used: Lexical decisions and immediate context
  rationale: “Provide our own” states their self-support clearly while retaining both needs.
- pob_phrase: let your name be called over us
  simplified_phrase: let us be called by your name
  preserved_meaning: They ask to come under the man’s name without explicitly saying “marry us.”
  reasoning_layer_used: Lexical alternative and theological decision
  rationale: The approved alternative makes the idiom understandable without narrowing its implication.
