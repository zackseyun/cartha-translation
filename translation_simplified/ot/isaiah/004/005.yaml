translation:
  language: en
  text: Then Yahweh will create over all of Mount Zion and every gathering there a cloud by day, smoke, and the bright glow of a flaming fire by night.[a] For above all the glory there will be a canopy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The cloud and fire recall how Yahweh led his people through the wilderness (Exodus 13:21–22).
    reason: cross_reference
  - marker: b
    text: The Hebrew word can also mean a covering and may suggest a wedding canopy.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: over the whole site of Mount Zion and over her assemblies
  simplified_phrase: over all of Mount Zion and every gathering there
  preserved_meaning: Yahweh's visible presence extends over Zion's whole location and its gathered people.
  reasoning_layer_used: Lexical decisions for מְכוֹן and מִקְרָאֶיהָ
  rationale: This removes the abstract word “site” and makes the assemblies easier to understand.
- pob_phrase: a cloud by day, and smoke, and the brightness of a flaming fire by night
  simplified_phrase: a cloud by day, smoke, and the bright glow of a flaming fire by night
  preserved_meaning: One act of creation produces the daytime cloud, temporally unqualified smoke, and radiant fire at night.
  reasoning_layer_used: Source syntax and lexical decisions for עָנָן, וְעָשָׁן, and וְנֹגַהּ אֵשׁ לֶהָבָה
  rationale: The coordinated list keeps smoke distinct and avoids assigning it to either day or night.
- pob_phrase: for over all the glory there will be a canopy
  simplified_phrase: For above all the glory there will be a canopy
  preserved_meaning: The canopy over the glory explains the preceding signs of Yahweh's presence.
  reasoning_layer_used: Lexical decisions for כִּי, כָּבוֹד, and חֻפָּה
  rationale: “For” preserves the explanatory link, while “above” makes the spatial image clear.
translation_notes:
  risk_flags:
  - risk: Readers may not recognize the wilderness imagery behind the cloud and fire.
    mitigation: Footnote a identifies the Exodus echo without adding it to the main text.
  - risk: “Canopy” may be understood only as an ordinary shelter.
    mitigation: Footnote b preserves the broader sense “covering” and the possible wedding-canopy association.
