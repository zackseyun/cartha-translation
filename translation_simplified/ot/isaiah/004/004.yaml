  text: The promise will be fulfilled when the Lord washes away the filth of Zion’s daughters and cleanses Jerusalem of bloodshed. He will do this by a spirit of justice and a spirit of burning.[a][b]
  philosophy: optimal-equivalence
  footnotes:
