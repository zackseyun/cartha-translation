translation:
  language: en
  text: Then whoever remains in Zion, whoever is left in Jerusalem, will be called holy—everyone recorded for life in Jerusalem.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “everyone listed among the living in Jerusalem.”
    reason: lexical_alternative
  - marker: b
    text: This may refer to a register of survivors while also echoing the biblical image of God’s book of life.
    reason: cross_reference
simplification_decisions:
- pob_phrase: And it shall be that
  simplified_phrase: Then
  preserved_meaning: The verse looks ahead to what will happen after the preceding events.
  reasoning_layer_used: lexical decision for וְהָיָה
  rationale: “Then” expresses the prophetic transition in direct modern English.
- pob_phrase: whoever remains in Zion and whoever is left in Jerusalem
  simplified_phrase: whoever remains in Zion, whoever is left in Jerusalem
  preserved_meaning: Both parallel descriptions identify the surviving remnant.
  reasoning_layer_used: lexical decisions for הַנִּשְׁאָר and וְהַנּוֹתָר
  rationale: The appositional phrasing keeps both remnant expressions without a heavy repeated conjunction.
- pob_phrase: everyone who is recorded for life
  simplified_phrase: everyone recorded for life
  preserved_meaning: The holy remnant consists of those entered in the life-related register.
  reasoning_layer_used: lexical and theological decisions for הַכָּתוּב לַחַיִּים
  rationale: Removing “who is” improves flow while retaining the deliberately open phrase “recorded for life.”
translation_notes:
