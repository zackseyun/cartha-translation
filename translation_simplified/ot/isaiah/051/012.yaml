  rationale: “The one” clarifies the self-identification while preserving its repeated emphasis.
- pob_phrase: Who are you that you fear
  simplified_phrase: Why are you afraid of
  preserved_meaning: God directly challenges his people’s fear of human threats.
  reasoning_layer_used: Lexical decisions for מִי אַתְּ and וַתִּירְאִי.
  rationale: The direct question conveys the same rhetorical challenge in ordinary English.
- pob_phrase: the son of man, who is made like grass
  simplified_phrase: a human being who is as short-lived as grass
  preserved_meaning: An ordinary human being is frail and temporary, like grass.
  reasoning_layer_used: Lexical and theological decisions for בֶּן אָדָם, חָצִיר, and יִנָּתֵן.
  rationale: The wording explains the non-titular idiom and the grass image without removing the image.
