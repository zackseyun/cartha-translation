  rationale: “Bowed down” is more natural English while preserving the difficult Hebrew image.
- pob_phrase: his bread will not be lacking
  simplified_phrase: he will not run out of bread
  preserved_meaning: He is assured continued provision of bread or food.
  reasoning_layer_used: POB lexical decision for וְלֹא יֶחְסַר לַחְמוֹ
  rationale: The active wording states the same assurance in everyday English.
