translation:
  language: en
  text: The one bowed down will soon be set free.[a] He will not die in the pit,[b] and he will not run out of bread.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “The captive will soon be released.” The difficult Hebrew wording may picture someone bowed down under oppression.
    reason: lexical_alternative
  - marker: b
    text: The “pit” may mean a dungeon, a grave, or a place of destruction.
    reason: alternative_reading
