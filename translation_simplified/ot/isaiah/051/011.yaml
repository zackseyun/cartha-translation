translation:
  language: en
  text: Those whom Yahweh has redeemed will return. They will come to Zion singing for joy.[a] Everlasting joy will crown them. Gladness and joy will catch up with them, while sorrow and sighing flee away.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “shouting for joy.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the redeemed of Yahweh
  simplified_phrase: those whom Yahweh has redeemed
  preserved_meaning: Yahweh has rescued these people, and they belong to the restored community.
  reasoning_layer_used: POB lexical decision for פְדוּיֵי and theological decision for יְהוָה
  rationale: The active relative clause makes “redeemed” easier to understand while retaining Yahweh’s personal name.
- pob_phrase: everlasting joy will be upon their heads
  simplified_phrase: Everlasting joy will crown them
  preserved_meaning: Enduring joy is pictured as resting upon them like a crown.
  reasoning_layer_used: POB lexical rationale for עַל רֹאשָׁם
  rationale: “Crown them” preserves the head image in more natural English.
- pob_phrase: gladness and joy will overtake them
  simplified_phrase: Gladness and joy will catch up with them
  preserved_meaning: Gladness and joy are personified as pursuing and reaching them.
  reasoning_layer_used: POB lexical decision for יַשִּׂיגוּן
  rationale: “Catch up with” clearly expresses the pursuit image behind “overtake.”
