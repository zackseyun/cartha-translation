translation:
  language: en
  text: Look back to Abraham, your father, and to Sarah, who gave birth to you. When I called Abraham, he was only one man.[a] I blessed him and made his descendants many.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “when he was alone.” The Hebrew literally says “one.”
    reason: lexical_alternative
