- pob_phrase: Look to Abraham your father
  simplified_phrase: Look back to Abraham, your father
  preserved_meaning: The readers are directed to Abraham as their covenant ancestor and example.
  reasoning_layer_used: POB lexical decision for הַבִּיטוּ and אַבְרָהָם אֲבִיכֶם
  rationale: “Look back” makes the historical reference clear while preserving the visual image.
- pob_phrase: Sarah who bore you
  simplified_phrase: Sarah, who gave birth to you
  preserved_meaning: Sarah is pictured as the maternal ancestor of the people.
  reasoning_layer_used: POB lexical decision for שָׂרָה תְּחוֹלֶלְכֶם
  rationale: “Gave birth to you” expresses the maternal image more clearly for modern readers.
- pob_phrase: I blessed him and multiplied him
  simplified_phrase: I blessed him and made his descendants many
  preserved_meaning: God blessed one man and produced a great people from him.
  reasoning_layer_used: POB lexical decision for וַאֲבָרְכֵהוּ and וְאַרְבֵּהוּ
  rationale: The wording states the result of “multiplied him” in ordinary English.
