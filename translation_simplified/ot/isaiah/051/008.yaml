translation:
  language: en
  text: For moths will eat them up as if they were clothing, and worms will eat them up as if they were wool. But my righteousness[a] will last forever, and my salvation will continue through every generation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “my justice.” The Hebrew word can refer both to what is morally right and to justice.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the moth will eat them like a garment
  simplified_phrase: moths will eat them up as if they were clothing
  preserved_meaning: The vivid image compares their destruction to fabric being consumed by moths.
  reasoning_layer_used: Lexical decisions for garment, eat, and moth
  rationale: The plural generic and explicit comparison make the image natural in modern English.
- pob_phrase: the worm will eat them like wool
  simplified_phrase: worms will eat them up as if they were wool
  preserved_meaning: Fabric-destroying larvae will consume them as they consume wool.
  reasoning_layer_used: Lexical decisions for worm, eat, and wool
  rationale: The wording keeps the second decay image without over-identifying the insect.
- pob_phrase: my salvation to generation after generation
  simplified_phrase: my salvation will continue through every generation
  preserved_meaning: God’s saving action endures across all successive generations.
  reasoning_layer_used: Lexical decision for the generational idiom
  rationale: A complete modern clause clearly expresses the idiom’s continuing duration.
translation_notes:
  risk_flags:
  - risk: Using plural “moths” and “worms” changes the Hebrew generic singulars.
    mitigation: English generic plurals preserve the same class-wide sense more naturally.
  - risk: “Righteousness” may not communicate the word’s justice-related sense to every reader.
    mitigation: The footnote preserves “justice” as the documented lexical alternative.
