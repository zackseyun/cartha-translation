translation:
  language: en
  text: “I have placed my words in your mouth[a] and sheltered you under the shadow of my hand. I did this to plant the heavens,[b] lay the foundation of the earth, and say to Zion, ‘You are my people.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The singular “you” may refer to the servant, the prophet, or Israel/Zion as a people.
    reason: source_note
  - marker: b
    text: This unusual image may refer to creation or to restoration pictured as a new creation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: covered you with the shadow of my hand
  simplified_phrase: sheltered you under the shadow of my hand
  preserved_meaning: God protects the addressee while retaining the shadow-of-the-hand image.
  reasoning_layer_used: Lexical decision for כִּסִּיתִיךָ and וּבְצֵל יָדִי
  rationale: “Sheltered under” makes the protective sense clear without removing the Hebrew image.
- pob_phrase: to found the earth
  simplified_phrase: lay the foundation of the earth
  preserved_meaning: God establishes the earth using foundation imagery.
  reasoning_layer_used: Lexical decision for וְלִיסֹד אָרֶץ
  rationale: The fuller phrase is more immediately understandable than “found” as a verb.
- pob_phrase: and covered you ... to plant
  simplified_phrase: and sheltered you.... I did this to plant
  preserved_meaning: The following actions remain the purpose of what God has done.
  reasoning_layer_used: Source syntax and POB clause relationship
  rationale: A new sentence clarifies the dense chain of clauses without changing its purpose.
