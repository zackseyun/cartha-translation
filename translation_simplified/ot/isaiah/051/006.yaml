translation:
  language: en
  text: Look up at the heavens, and look down at the earth. For the heavens will vanish like smoke.[a] The earth will wear out like a garment, and the people who live on it will die like gnats.[b] But my salvation will last forever, and my righteousness[c] will never be broken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “will dissipate like smoke.” The Hebrew verb is difficult, but it describes the heavens passing away.
    reason: lexical_alternative
  - marker: b
    text: Or, “will likewise die.” The Hebrew expression is difficult and can be understood either way.
    reason: lexical_alternative
  - marker: c
    text: Or, “justice.” The Hebrew word can mean both righteousness and justice.
    reason: lexical_alternative
