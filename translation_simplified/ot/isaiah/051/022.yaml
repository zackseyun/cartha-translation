translation:
  language: en
  text: 'This is what your Lord says—Yahweh, your God, who takes up his people’s case: “Look! I have taken from your hand the cup that made you stagger—the bowl that holds the cup of my wrath.[a] You will never drink from it again.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew piles up the images of a bowl and a cup to emphasize the vessel of God’s wrath.
    reason: source_note
simplification_decisions:
- pob_phrase: Thus says your Lord, Yahweh, and your God
  simplified_phrase: This is what your Lord says—Yahweh, your God
  preserved_meaning: All three divine titles remain distinct and identify the one speaker.
  reasoning_layer_used: theological decision on the sequence of divine titles
  rationale: The new structure makes the stacked titles easier to follow without merging them.
- pob_phrase: who pleads the cause of his people
  simplified_phrase: who takes up his people’s case
  preserved_meaning: Yahweh acts for his people in a legal dispute.
  reasoning_layer_used: lexical decision for יָרִיב עַמּוֹ
  rationale: This familiar legal expression clearly preserves the judicial sense.
- pob_phrase: the cup of staggering, the bowl of the cup of my wrath
  simplified_phrase: the cup that made you stagger—the bowl that holds the cup of my wrath
  preserved_meaning: The judgment cup causes staggering, and both vessel images remain for emphasis.
  reasoning_layer_used: lexical decisions for כּוֹס הַתַּרְעֵלָה and קֻבַּעַת, plus the theological decision to retain the cup image
  rationale: The effect clause explains the staggering, while “holds” makes the relationship between bowl and cup readable.
