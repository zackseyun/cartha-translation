translation:
  language: en
  text: You forgot Yahweh, your Maker, who stretched out the heavens and laid the foundation of the earth. All day long, you were constantly afraid of the oppressor’s fury as he prepared to destroy.[a] But where is the oppressor’s fury?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “as if he were ready to destroy.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: founded the earth
  simplified_phrase: laid the foundation of the earth
  preserved_meaning: Yahweh established the earth as its Creator.
  reasoning_layer_used: lexical decision for וְיֹסֵד אָרֶץ
  rationale: The fuller singular image is immediately clear and follows the audited lexical alternative.
- pob_phrase: you feared continually all day long
  simplified_phrase: All day long, you were constantly afraid
  preserved_meaning: The fear persisted throughout the day.
  reasoning_layer_used: lexical decision for תָּמִיד כָּל הַיּוֹם
  rationale: Natural English word order preserves both expressions of duration.
- pob_phrase: when he set himself to destroy
  simplified_phrase: as he prepared to destroy
  preserved_meaning: The oppressor deliberately made ready to cause destruction.
  reasoning_layer_used: lexical and theological decisions for כַּאֲשֶׁר כּוֹנֵן לְהַשְׁחִית
  rationale: Prepared is clearer while retaining the oppressor as the subject.
translation_notes:
  risk_flags:
  - risk: The destruction clause may describe apparent readiness rather than actual preparation.
    mitigation: The footnote preserves the supported modal alternative.
  - risk: The two duration expressions may sound repetitive in English.
    mitigation: Both remain because the Hebrew intensifies the persistence of the fear.
