simplification_decisions:
- pob_phrase: There is no one to guide her among all the sons she has borne
  simplified_phrase: Of all the sons she gave birth to, not one is there to guide her
  preserved_meaning: None of Jerusalem's own sons provides her with guidance and care.
  reasoning_layer_used: Lexical decisions for מְנַהֵל, מִכָּל בָּנִים, and יָלָדָה
  rationale: The reordered sentence clarifies the group from which no helper can be found.
- pob_phrase: she has borne
  simplified_phrase: she gave birth to
  preserved_meaning: The maternal image of Jerusalem bringing forth sons remains explicit.
  reasoning_layer_used: Lexical decision for יָלָדָה
  rationale: “Gave birth to” is more familiar than “has borne” for common readers.
- pob_phrase: and no one to take her by the hand among all the sons she has raised
  simplified_phrase: Of all the sons she raised, not one is there to take her by the hand
  preserved_meaning: None of the sons she brought up offers personal support or guidance.
  reasoning_layer_used: Lexical decisions for מַחֲזִיק בְּיָדָהּ and גִּדֵּלָה
  rationale: A separate parallel sentence makes the repeated abandonment easier to grasp while preserving the hand image.
