translation:
  language: en
  text: For I am Yahweh, your God. I stir up the sea, making its waves roar.[a] Yahweh of Armies is his name.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “I calm the sea,” but the roaring waves favor “stir up” here.
    reason: lexical_alternative
