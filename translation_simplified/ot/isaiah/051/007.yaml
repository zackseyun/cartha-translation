translation:
  language: en
  text: Listen to me, you who know righteousness,[a] people who have my law in your hearts.[b] Do not fear the scorn of man,[c] and do not let their insults shatter you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “justice.”
    reason: lexical_alternative
