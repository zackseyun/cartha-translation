simplification_decisions:
- pob_phrase: people with my law in their hearts
  simplified_phrase: people who have my law in your hearts
  preserved_meaning: God’s law is within and internalized by the people.
  reasoning_layer_used: Lexical decision for עַם תּוֹרָתִי בְלִבָּם
  rationale: This natural wording preserves the heart image and the covenantal force of “law.”
- pob_phrase: the reproach of man
  simplified_phrase: the scorn of man
  preserved_meaning: Frail human beings direct contempt and verbal abuse at God’s people.
  reasoning_layer_used: Lexical and theological decisions for חֶרְפַּת אֱנוֹשׁ
  rationale: “Scorn” is clearer than “reproach,” while “man” preserves the source’s singular generic contrast.
- pob_phrase: do not be dismayed by their insults
  simplified_phrase: do not let their insults shatter you
  preserved_meaning: Their abusive speech must not cause inward collapse.
  reasoning_layer_used: Lexical decision and doctrine-realignment for אַל תֵּחָתּוּ
  rationale: The active wording is natural English and preserves the strong image of being shattered.
