translation:
  language: en
  text: My righteousness is near. My salvation has gone out. My arms will judge the peoples. Distant coastlands will wait for me and hope for my powerful arm.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Righteousness” may also be translated “justice” or “vindication.”
    reason: lexical_alternative
  - marker: b
    text: God’s arm is an image of his power in action; the Hebrew says “arms” first and then “arm.”
    reason: simplification_note
simplification_decisions:
- pob_phrase: My righteousness is near, my salvation has gone out, and my arms will judge the peoples
  simplified_phrase: My righteousness is near. My salvation has gone out. My arms will judge the peoples.
  preserved_meaning: God’s approaching righteousness, issued salvation, and judgment remain distinct actions.
  reasoning_layer_used: POB syntax and lexical decisions
  rationale: Three short sentences make the sequence easier to follow without changing the arm imagery.
- pob_phrase: the coastlands will wait for me
  simplified_phrase: Distant coastlands will wait for me
  preserved_meaning: Remote maritime peoples will wait expectantly for the LORD.
  reasoning_layer_used: Lexical decision and footnote for אִיִּים
  rationale: “Distant” makes the geographic scope clear while retaining “coastlands.”
- pob_phrase: and for my arm they will hope
  simplified_phrase: and hope for my powerful arm
  preserved_meaning: They will expectantly hope for the LORD’s power to act.
  reasoning_layer_used: Lexical and theological decisions on זְרֹעִי and יְיַחֵלוּן
  rationale: This preserves hope directed toward the coming action of God’s arm rather than recasting it as trust in an object.
