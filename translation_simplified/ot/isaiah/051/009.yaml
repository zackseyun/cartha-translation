translation:
  language: en
  text: Arm of Yahweh, awake! Awake! Put on your strength. Awake and act as you did in ancient days, in generations long past. Was it not you who cut Rahab[a] to pieces and pierced the dragon[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rahab is a poetic name for a proud enemy power, probably referring here to Egypt.
    reason: cross_reference
  - marker: b
    text: Or “sea monster.”
    reason: lexical_alternative
