translation:
  language: en
  text: Yahweh’s Spirit will rest on him—a spirit of wisdom and understanding, a spirit of sound judgment and strength, and a spirit of knowledge and the fear of Yahweh.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew repeats “spirit” to describe the qualities and work of Yahweh’s Spirit.
    reason: simplification_note
  - marker: b
    text: “Fear of Yahweh” includes reverent awe and submission, not mere terror.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the Spirit of Yahweh ... a spirit ... a spirit ... a spirit
  simplified_phrase: Yahweh’s Spirit ... a spirit ... a spirit ... a spirit
  preserved_meaning: The repeated phrases describe the qualities and work of Yahweh’s Spirit while preserving the Hebrew pattern.
  reasoning_layer_used: lexical rationale and theological decision on descriptive appositions
  rationale: The possessive opening is natural English, while lowercase indefinite repetitions preserve their descriptive role.
- pob_phrase: counsel and might
  simplified_phrase: sound judgment and strength
  preserved_meaning: The Spirit gives wise governing judgment and the strength to act.
  reasoning_layer_used: lexical decisions for עֵצָה and גְבוּרָה
  rationale: Familiar terms clarify both distinct qualities without weakening the royal context.
- pob_phrase: the fear of Yahweh
  simplified_phrase: the fear of Yahweh
  preserved_meaning: The covenantal idea of reverent awe and submission remains intact.
  reasoning_layer_used: lexical and theological decision for יִרְאַת יְהוָה
  rationale: The key biblical phrase is retained and explained rather than softened.
translation_notes:
  risk_flags:
  - risk: Repeated uses of “a spirit” might be misunderstood as separate spirits.
    mitigation: Footnote a positively identifies them as descriptions of Yahweh’s Spirit.
  - risk: Modern readers may take “fear” to mean terror alone.
    mitigation: Footnote b explains its broader sense of reverent awe and submission.
