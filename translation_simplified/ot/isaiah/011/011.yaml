translation:
  language: en
  text: In that day, the Lord will once again reach out his hand. This second time, he will acquire the remnant of his people who are still left in Assyria, Egypt, Pathros, Cush, Elam, Shinar, Hamath, and the coastlands of the sea.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Acquire” may also be translated “recover.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew expression translated “coastlands of the sea” can also mean “islands of the sea.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: will again extend his hand, a second time, to acquire
  simplified_phrase: will once again reach out his hand. This second time, he will acquire
  preserved_meaning: The Lord acts again to acquire his people, while the hand image and second-time emphasis remain explicit.
  reasoning_layer_used: lexical and theological decisions
  rationale: Two short sentences clarify the action without removing the Hebrew image or ordinal force.
- pob_phrase: the remnant of his people who remain, from
  simplified_phrase: the remnant of his people who are still left in
  preserved_meaning: The people in view are the remaining part of the Lord’s people in the listed lands.
  reasoning_layer_used: lexical decisions and immediate context
  rationale: “Still left in” clearly connects the remnant with the named locations.
- pob_phrase: from Assyria, from Egypt, from Pathros, from Cush, from Elam, from Shinar, from Hamath
  simplified_phrase: in Assyria, Egypt, Pathros, Cush, Elam, Shinar, Hamath
  preserved_meaning: All seven named regions remain distinct places where the remnant is left.
  reasoning_layer_used: place-name lexical decisions
  rationale: Removing repeated prepositions makes the long list easier to read without omitting any region.
translation_notes:
  risk_flags:
  - risk: “Acquire” may sound commercial to a modern reader.
    mitigation: Footnote a gives the contextual alternative “recover” without adding unsupported interpretation.
  - risk: “Coastlands” may be understood more narrowly than the Hebrew expression.
    mitigation: Footnote b preserves “islands of the sea” as an important alternative.
