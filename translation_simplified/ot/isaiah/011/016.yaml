  reasoning_layer_used: lexical and theological decisions, with immediate context
  rationale: This keeps Isaiah’s key term “remnant” and clearly identifies the people who remain in Assyria.
- pob_phrase: as there was for Israel
  simplified_phrase: just as there was a highway for Israel
  preserved_meaning: The coming highway is compared with Israel’s route out of Egypt.
  reasoning_layer_used: lexical decision and immediate context
  rationale: Repeating “highway” makes the compressed comparison clear.
- pob_phrase: in the day of his coming up from the land of Egypt
  simplified_phrase: when they came up from the land of Egypt
  preserved_meaning: Israel’s departure from Egypt remains the historical pattern.
  reasoning_layer_used: lexical decision and exodus typology
  rationale: The natural time clause preserves the exodus image without awkward collective wording.
