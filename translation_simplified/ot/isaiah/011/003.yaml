translation:
  language: en
  text: He will find joy in revering Yahweh.[a] He will not judge merely by what he sees or make decisions merely from what he hears.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may more literally describe his perception as a kind of “smelling,” suggesting keen discernment shaped by reverence for Yahweh.
