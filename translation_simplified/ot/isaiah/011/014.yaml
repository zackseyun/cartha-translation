  reasoning_layer_used: lexical decision and cultural note for בְּכָתֵף פְּלִשְׁתִּים and יָמָּה
  rationale: This wording conveys the likely geography without misleadingly specifying Philistia’s own western edge.
- pob_phrase: the sons of the east / the sons of Ammon
  simplified_phrase: the peoples of the east / the Ammonites
  preserved_meaning: Both phrases identify people groups rather than literal family relationships.
  reasoning_layer_used: lexical decisions for בְּנֵי קֶדֶם and וּבְנֵי עַמּוֹן
  rationale: Natural group names make the Hebrew kinship idioms immediately clear.
- pob_phrase: Edom and Moab will be the putting forth of their hand
