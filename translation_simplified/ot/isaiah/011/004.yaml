translation:
  language: en
  text: But[a] he will judge the poor with righteousness and give fair decisions for the humble people of the earth. His spoken word will strike the earth like a rod, and the breath from his lips will put the wicked to death.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Or “And.” “But” highlights the contrast with the previous verse: he does not judge by appearances.'
    reason: lexical_alternative
  - marker: b
    text: Or “the wicked one.” The Hebrew may refer either to the wicked generally or to one wicked figure.
    reason: alternative_reading
