translation:
  language: en
  text: I will put the key of the house of David on his shoulder. What he opens, no one will be able to shut; and what he shuts, no one will be able to open.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This picture of authority that no one can challenge is echoed in Revelation 3:7.
    reason: cross_reference
simplification_decisions:
- pob_phrase: And I will place
  simplified_phrase: I will put
  preserved_meaning: God will set the key on his shoulder as promised.
  reasoning_layer_used: Lexical decision for וְנָתַתִּי
  rationale: “Put” is common English and retains the concrete action.
- pob_phrase: he will open ... he will shut
  simplified_phrase: What he opens ... what he shuts
  preserved_meaning: His decisions to open or shut cannot be reversed.
  reasoning_layer_used: Lexical decisions for the parallel opening and shutting clauses
  rationale: The recast structure makes the balanced contrast easier to follow.
interpretive_expansions:
- pob_phrase: no one will shut ... no one will open
  rendering: no one will be able to shut ... no one will be able to open
  claim: No one has the power to reverse his actions.
  evidence:
  - The POB lexical rationales identify unopposable authority and actions that cannot be overturned.
  - The paired Hebrew clauses express the absence of anyone who can perform the contrary action.
  confidence: high
  alternatives_preserved:
  - The wording does not specify how this authority is exercised.
  - The immediate reference remains delegated authority connected with David’s house.
translation_notes:
  risk_flags:
  - risk: Modern readers may not know what the key of the house of David represents.
    mitigation: The shoulder image is preserved, while the footnote briefly identifies authority without adding messianic interpretation to the verse.
