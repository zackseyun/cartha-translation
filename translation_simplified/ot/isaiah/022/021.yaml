translation:
  language: en
  text: I will put your tunic on him and tie your sash securely around him. I will place your authority in his hands. He will become a father[a] to the people of Jerusalem and the house of Judah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “father” means a protective, responsible leader, not a biological parent.
    reason: simplification_note
simplification_decisions:
- pob_phrase: I will clothe him with your tunic, and I will fasten your sash on him
  simplified_phrase: I will put your tunic on him and tie your sash securely around him
  preserved_meaning: The official garments are transferred and firmly secured on the new officeholder.
  reasoning_layer_used: Lexical decisions for לבש, כֻּתֹּנֶת, אַבְנֵט, and חזק
  rationale: Ordinary dressing language makes the investiture action immediately clear.
- pob_phrase: I will place your authority into his hand
  simplified_phrase: I will place your authority in his hands
  preserved_meaning: The official's governing power is entrusted to him while the hand image remains.
  reasoning_layer_used: Lexical decisions for מֶמְשָׁלָה and אֶתֵּן בְּיָדוֹ
  rationale: The common English expression preserves both entrusted authority and the concrete image.
- pob_phrase: the inhabitants of Jerusalem
  simplified_phrase: the people of Jerusalem
  preserved_meaning: The phrase collectively refers to those who live in Jerusalem.
  reasoning_layer_used: Lexical decision for לְיוֹשֵׁב יְרוּשָׁלִַם
  rationale: “The people of Jerusalem” is clearer than the formal term “inhabitants.”
