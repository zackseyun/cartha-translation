translation:
  language: en
  text: He removed Judah’s protective covering.[a] On that day, you turned your attention to the weapons in the House of the Forest.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew pictures Judah’s defense or protection as a covering.
    reason: lexical_alternative
  - marker: b
    text: The House of the Forest was likely the royal palace building used as an armory, elsewhere called the House of the Forest of Lebanon.
    reason: cross_reference
simplification_decisions:
- pob_phrase: the covering of Judah
  simplified_phrase: Judah’s protective covering
  preserved_meaning: The concrete covering image remains while its protective force is clarified.
  reasoning_layer_used: POB lexical and theological decisions on מָסַךְ
  rationale: This wording makes the metaphor understandable without replacing it with the narrower word “defense.”
- pob_phrase: you looked to the weapons
  simplified_phrase: you turned your attention to the weapons
  preserved_meaning: Singular Judah or Jerusalem directs its attention toward the weapons.
  reasoning_layer_used: POB lexical decision on וַתַּבֵּט and addressee decision
  rationale: The recast avoids the unnatural phrase “looked to” while preserving the singular prophetic address.
- pob_phrase: the weapons of the House of the Forest
  simplified_phrase: the weapons in the House of the Forest
  preserved_meaning: The weapons are associated with the building known by this title.
  reasoning_layer_used: POB lexical decision and cross-reference for בֵּית הַיָּעַר
  rationale: Using “in” helps readers understand the building as the location of the weapons.
