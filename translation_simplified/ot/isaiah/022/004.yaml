translation:
  language: en
  text: So I said, “Look away from me. Let me weep bitterly.[a] Do not insist on comforting me because of the destruction of the daughter of my people.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Turn away from me; I will weep bitterly.” More literally, “be bitter in weeping.”
    reason: lexical_alternative
  - marker: b
    text: “The daughter of my people” is a prophetic image that personifies the speaker’s people as a daughter.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Therefore I said
  simplified_phrase: So I said
  preserved_meaning: The speaker presents these words as a response to the preceding calamity.
  reasoning_layer_used: POB translation and immediate context
  rationale: “So” expresses the same connection in more natural modern English.
- pob_phrase: Look away from me; let me weep bitterly
  simplified_phrase: Look away from me. Let me weep bitterly.
  preserved_meaning: The speaker asks others to leave him alone in his intense grief.
  reasoning_layer_used: POB lexical decisions for שְׁעוּ and אֲמָרֵר בַּבֶּכִי
  rationale: Two sentences make the separate requests easier to follow without weakening the bitter-weeping image.
- pob_phrase: Do not labor to comfort me over
  simplified_phrase: Do not insist on comforting me because of
  preserved_meaning: The speaker rejects determined efforts to console him about the calamity.
  reasoning_layer_used: POB lexical rationale for תָּאִיצוּ and revision audit
  rationale: “Insist on” clearly conveys unwanted pressure, while “because of” makes the relation to the destruction natural in English.
