translation:
  language: en
  text: Yahweh of hosts[a] has planned this:[b] to disgrace all proud splendor and bring down everyone honored on earth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hosts” means armies, including the forces of heaven and earth.
    reason: simplification_note
  - marker: b
    text: This may also mean, “has planned this against Tyre.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: has purposed it
  simplified_phrase: has planned this
  preserved_meaning: Yahweh has determined the announced judgment.
  reasoning_layer_used: Lexical and theological decisions on יְעָצָהּ
  rationale: “Planned this” is common English, while the note preserves the possible reference to Tyre.
- pob_phrase: to defile the pride of all beauty
  simplified_phrase: to disgrace all proud splendor
  preserved_meaning: Yahweh will dishonor the pride and splendor being exalted.
  reasoning_layer_used: Lexical decisions on לְחַלֵּל, גְּאוֹן, and כָּל צְבִי
  rationale: This keeps pride as part of the object without adding people as its explicit bearers.
- pob_phrase: to humble all the honored ones of the earth
  simplified_phrase: bring down everyone honored on earth
  preserved_meaning: Yahweh will abase all eminent people throughout the earth.
  reasoning_layer_used: Lexical decisions on לְהָקֵל and כָּל נִכְבַּדֵּי אָרֶץ
  rationale: “Bring down” clearly expresses humbling without limiting the honored people to nobles.
translation_notes:
  risk_flags:
  - risk: “Hosts” may be unfamiliar to some readers.
    mitigation: A brief note explains the title without narrowing its broad scope.
  - risk: “Proud splendor” makes the compact Hebrew relationship more natural but remains somewhat elastic.
    mitigation: The wording preserves both pride and splendor without assigning the pride explicitly to people.
