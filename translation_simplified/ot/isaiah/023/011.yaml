translation:
  language: en
  text: 'He has reached out his hand over the sea[a] and made kingdoms tremble. Yahweh has given the command concerning Canaan[b]: destroy her strongholds.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “against the sea.” The Hebrew preposition can be understood in more than one way here.
    reason: alternative_reading
  - marker: b
    text: “Canaan” here likely refers to the Phoenician region associated with Tyre.
    reason: cultural_note
simplification_decisions:
- pob_phrase: has stretched out his hand over the sea
  simplified_phrase: has reached out his hand over the sea
  preserved_meaning: The concrete image of God deliberately extending his power in judgment remains intact.
  reasoning_layer_used: POB lexical decisions for יָדוֹ, נָטָה, and עַל הַיָּם
  rationale: “Reached out” is more immediately natural while preserving the hand image and the preposition’s ambiguity.
- pob_phrase: Yahweh has commanded concerning Canaan, to destroy her strongholds
  simplified_phrase: 'Yahweh has given the command concerning Canaan: destroy her strongholds'
  preserved_meaning: Yahweh orders the destruction of Canaan’s fortified places.
  reasoning_layer_used: POB lexical and theological decisions for יְהוָה, צִוָּה, כְּנַעַן, and מָעֻזְנֶיהָ
