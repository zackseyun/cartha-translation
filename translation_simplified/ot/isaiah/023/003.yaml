translation:
  language: en
  text: Across the seas came grain from Shihor,[a] the harvest of the Nile, which was Tyre’s income. She became a center of trade for the nations.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Shihor probably refers to the Nile or one of its branches; the phrase may also mean “grain from the Nile.”
    reason: lexical_alternative
  - marker: b
    text: More literally, “she became the trade or merchandise of the nations.”
    reason: lexical_alternative
