translation:
  language: en
  text: Her merchandise and earnings will be holy to Yahweh.[a] They will not be stored away or hoarded. Instead, her merchandise will go to those who live in Yahweh’s presence, so they can eat their fill and have durable clothing.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “her hire.” The word may echo this chapter’s picture of Tyre as a prostitute.
    reason: lexical_alternative
  - marker: b
    text: The final words are difficult and may also mean “lasting clothing,” “stately clothing,” or “ample covering.”
    reason: lexical_alternative
