translation:
  language: en
  text: 'Sidon, be ashamed, for the sea—the stronghold of the sea[a]—has spoken: “I have not gone through labor or given birth. I have not raised young men or brought up virgins.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may describe the sea as powerful and secure, or it may refer to Tyre as a fortress at sea.
    reason: lexical_alternative
  - marker: b
    text: Or “young women”; the Hebrew term specifically refers to virgins.
    reason: lexical_alternative
