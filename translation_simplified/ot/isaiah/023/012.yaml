translation:
  language: en
  text: He said, “Oppressed virgin daughter of Sidon,[a] you will celebrate no more. Get up and go over to Kittim.[b] Even there you will find no rest.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Virgin daughter of Sidon” personifies Sidon as a young woman.
    reason: simplification_note
  - marker: b
    text: Kittim likely refers to Cyprus and may also suggest western lands across the sea.
    reason: cultural_note
simplification_decisions:
- pob_phrase: You will exult no more
  simplified_phrase: you will celebrate no more
  preserved_meaning: Sidon’s exuberant rejoicing will come to an end.
  reasoning_layer_used: Lexical decision for לֹא תוֹסִיפִי עוֹד and לַעְלֹז
  rationale: “Celebrate” communicates exuberant public joy more plainly than “exult.”
- pob_phrase: Arise, cross over to Kittim
  simplified_phrase: Get up and go over to Kittim
  preserved_meaning: Sidon is urgently commanded to leave for Kittim.
  reasoning_layer_used: Lexical decision for קוּמִי עֲבֹרִי
  rationale: The two commands remain distinct but use ordinary modern wording.
- pob_phrase: oppressed virgin daughter of Sidon
  simplified_phrase: Oppressed virgin daughter of Sidon
  preserved_meaning: The prophetic personification and Sidon’s oppressed condition are retained.
  reasoning_layer_used: Lexical decisions for הַמְעֻשָּׁקָה and בְּתוּלַת בַּת צִידוֹן
  rationale: The source image is kept and briefly explained in a note.
translation_notes:
  risk_flags:
