translation:
  language: en
  text: Throughout all their distress, he was not distressed.[a] The angel of his presence saved them. Because of his love and compassion, he redeemed them. He lifted them up and carried them throughout the days of long ago.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
