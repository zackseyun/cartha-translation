translation:
  language: en
  text: Why, Yahweh, do you make us wander away from your ways?[a] Why do you harden our heart so that we do not fear you? Return to us for the sake of your servants, the tribes that are your inheritance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “let us wander.” The Hebrew directly says “make us wander,” preserving the lament’s tension about God’s sovereignty.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: wander from your ways
  simplified_phrase: wander away from your ways
  preserved_meaning: The people stray from the way Yahweh calls them to follow.
  reasoning_layer_used: Lexical decision for מִדְּרָכֶיךָ
  rationale: “Away from” makes the separation clear in ordinary English.
- pob_phrase: harden our heart from fearing you
  simplified_phrase: harden our heart so that we do not fear you
  preserved_meaning: The people's hardening results in their failure to revere Yahweh.
  reasoning_layer_used: Lexical decisions for תַּקְשִׁיחַ, לִבֵּנוּ, and מִיִּרְאָתֶךָ
  rationale: The result clause avoids awkward English without adding a second divine action.
- pob_phrase: the tribes of your inheritance
  simplified_phrase: the tribes that are your inheritance
  preserved_meaning: Israel’s tribes are Yahweh’s covenant inheritance.
  reasoning_layer_used: Lexical decisions for שִׁבְטֵי and נַחֲלָתֶךָ
  rationale: The relative clause clarifies the relationship while retaining “inheritance.”
interpretive_expansions:
