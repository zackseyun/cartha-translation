translation:
  language: en
  text: Livestock find rest when they go down into a valley. In the same way, the Spirit of Yahweh[a] gave your people rest.[b] You led your people like this to make a glorious name for yourself.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the wind of Yahweh”; the Hebrew word can mean spirit, wind, or breath, but “Spirit” best fits this context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew says “gave him rest,” treating Israel as one people.
    reason: alternative_reading
