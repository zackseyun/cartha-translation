simplification_decisions:
- pob_phrase: Look down from heaven and see, from your holy and glorious dwelling.
  simplified_phrase: Look down from heaven and see from your holy and glorious dwelling.
  preserved_meaning: The speaker asks God to look down from his holy, glorious dwelling in heaven.
  reasoning_layer_used: Lexical decisions for הַבֵּט, וּרְאֵה, and זְבֻל.
  rationale: Removing the awkward pause makes the appeal natural without supplying an unstated object.
- pob_phrase: Where are your zeal and your mighty acts?
  simplified_phrase: Where is your zeal? Where are your mighty acts?
  preserved_meaning: The lament separately asks about God's covenant passion and powerful intervention.
  reasoning_layer_used: Lexical and theological decisions for קִנְאָה and גְבוּרוֹת.
  rationale: Two short questions keep both ideas distinct and make the lament easier to follow.
- pob_phrase: The stirring of your inward parts and your compassions are withheld from me.
  simplified_phrase: The deep stirring within you and your mercies are held back from me.
  preserved_meaning: God's deep inner emotion and his compassionate mercies seem restrained from reaching the speaker.
  reasoning_layer_used: Lexical decisions for הֲמוֹן, מֵעֶיךָ, רַחֲמֶיךָ, and הִתְאַפָּקוּ, with the anthropopathic-language decision.
  rationale: The wording explains the bodily idiom while preserving the stirring and mercies as paired ideas.
interpretive_expansions:
- pob_phrase: The stirring of your inward parts
  rendering: The deep stirring within you
  claim: The bodily image refers to profound inner emotion rather than literal physical movement.
  evidence:
  - The POB cultural note identifies the phrase as an idiom for deep inner emotion or compassion.
  - The theological decision requires preserving the embodied force rather than reducing it to abstract feelings.
  confidence: high
  alternatives_preserved:
