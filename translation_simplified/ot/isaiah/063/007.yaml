translation:
  language: en
  text: I will tell of Yahweh’s steadfast love[a] and the praiseworthy things he has done.[b] I will tell of all he has given us and of the great goodness he has shown to the house of Israel. He has shown this goodness to them in keeping with his compassion and his abundant steadfast love.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Steadfast love” means loyal, enduring covenant love; it may also be translated “lovingkindness” or “mercies.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may refer to Yahweh’s praiseworthy deeds or to expressions of praise for him.
    reason: lexical_alternative
