translation:
  language: en
  text: Then he remembered what happened long ago, in the days of Moses and his people. He asked, “Where is the one who brought them up out of the sea, together with the shepherds[a] who cared for his flock? Where is the one who placed his Holy Spirit within him[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew has “the shepherds of his flock”; some read “the shepherd of his flock,” probably referring to Moses.
    reason: alternative_reading
  - marker: b
    text: The Hebrew says “within him,” but the reference is uncertain; it may mean “within them” or “among them.”
    reason: alternative_reading
