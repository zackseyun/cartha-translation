simplification_decisions:
- pob_phrase: But they rebelled and grieved his Holy Spirit; so he turned against them as an enemy
  simplified_phrase: But they rebelled and grieved his Holy Spirit. So he became their enemy.
  preserved_meaning: Their rebellion grieved God's Holy Spirit and led to a reversal in God's stance toward them.
  reasoning_layer_used: POB lexical and theological decisions on וְעִצְּבוּ, רוּחַ קָדְשׁוֹ, and וַיֵּהָפֵךְ לָהֶם לְאוֹיֵב
  rationale: Two direct sentences make the cause and relational reversal easier to follow.
- pob_phrase: he himself fought against them
  simplified_phrase: He himself fought against them.
  preserved_meaning: God personally acted in judgment against them.
  reasoning_layer_used: POB lexical decisions on הוּא and נִלְחַם בָּם
  rationale: The emphatic wording remains because it is clear and source-significant.
translation_notes:
