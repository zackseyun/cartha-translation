translation:
  language: en
  text: I looked, but no one was there to help me. I was appalled; no one was there to support me. So my own arm brought me deliverance,[a] and my wrath held me up.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “brought me victory.” The Hebrew word can refer to salvation, deliverance, or victory.
    reason: lexical_alternative
