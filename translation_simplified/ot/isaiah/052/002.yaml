translation:
  language: en
  text: Shake the dust off yourself. Rise and take your honored seat, Jerusalem.[a] Captive daughter Zion, loosen the bonds around your neck.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “sit”; here it suggests restored honor or royal dignity.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew form is difficult and may mean “untie yourself” or “be freed.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: Shake yourself from the dust
  simplified_phrase: Shake the dust off yourself
  preserved_meaning: Jerusalem is to shake off the dust of humiliation while the concrete dust image remains.
  reasoning_layer_used: Lexical decision for הִתְנַעֲרִי מֵעָפָר
  rationale: The new word order expresses the reflexive image in ordinary English.
- pob_phrase: rise up, sit enthroned
  simplified_phrase: Rise and take your honored seat
  preserved_meaning: Jerusalem rises from abasement to a restored place of dignity.
  reasoning_layer_used: Theological decision on שְּׁבִי in the restoration oracle
  rationale: “Honored seat” makes the contextual dignity clear without requiring a literal throne.
- pob_phrase: Loosen the bonds of your neck, captive daughter Zion
  simplified_phrase: Captive daughter Zion, loosen the bonds around your neck
  preserved_meaning: Personified Zion is commanded to remove the restraints of captivity.
  reasoning_layer_used: Lexical decisions for התפתחו, מוֹסְרֵי, צַוָּארֵךְ, and בַּת צִיּוֹן
  rationale: Fronting the addressee and using “around” makes the command immediately understandable.
