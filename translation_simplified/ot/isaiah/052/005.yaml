simplification_decisions:
- pob_phrase: And now, what do I have here?
  simplified_phrase: Now, what do I find here?
  preserved_meaning: Yahweh protests in astonishment at his people’s condition.
  reasoning_layer_used: POB lexical rationale for מַה־לִּי פֹה
  rationale: “Find here” expresses the rhetorical question in natural English.
- pob_phrase: those who rule over them
  simplified_phrase: Those who rule over them
  preserved_meaning: The wording clearly identifies the rulers as those exercising power over the captive people.
  reasoning_layer_used: POB lexical decision for מֹשְׁלָיו and grounding review
  rationale: Keeping the full relationship avoids suggesting that these are Israel’s own leaders.
- pob_phrase: and continually, all day long
  simplified_phrase: and ... constantly, all day long
  preserved_meaning: The contempt for Yahweh’s name continues throughout the day without relief.
  reasoning_layer_used: POB lexical rationale for וְתָמִיד כָּל־הַיּוֹם
  rationale: “Constantly” is common English, while “all day long” preserves the emphasis.
