translation:
  language: en
  text: Wake up, wake up, Zion! Wear your strength like clothing. Jerusalem, holy city, put on your beautiful clothes. For the uncircumcised and the unclean[a] will never enter you again.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: These are covenant and purity terms for people excluded from Jerusalem’s holiness. The verse leaves open whether the scope is ethnic, ritual, moral, or connected with a future picture of complete holiness.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Awake, awake; put on your strength, Zion
  simplified_phrase: Wake up, wake up, Zion! Wear your strength like clothing.
  preserved_meaning: Zion is urgently commanded to rise and clothe herself with strength.
  reasoning_layer_used: Lexical decisions for עוּרִי עוּרִי and לִבְשִׁי עֻזֵּךְ
  rationale: Short sentences clarify both commands while preserving the repetition and clothing image.
- pob_phrase: put on your beautiful garments
  simplified_phrase: put on your beautiful clothes
  preserved_meaning: Jerusalem is pictured dressing in beauty as part of her restoration.
  reasoning_layer_used: Lexical decision for לִבְשִׁי בִּגְדֵי תִפְאַרְתֵּךְ
  rationale: “Clothes” is more familiar than “garments” and retains the restoration image.
- pob_phrase: For no longer shall ... enter you again
  simplified_phrase: For ... will never enter you again
  preserved_meaning: The promised end of their entry grounds the call for Jerusalem to awaken and dress.
  reasoning_layer_used: Lexical decision for כִּי לֹא יוֹסִיף יָבֹא בָךְ עוֹד and review of כִּי
  rationale: “For” retains the logical connection, while “never again” states emphatic future cessation naturally.
