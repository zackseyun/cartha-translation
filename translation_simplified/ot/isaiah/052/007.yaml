translation:
  language: en
  text: How beautiful are the feet of the messenger on the mountains! He brings good news, announces peace, brings good news of good things, and announces salvation. He says to Zion, “Your God reigns.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Your God has become king” or “Your God is king.” The Hebrew can emphasize enthronement or reigning rule.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the one who brings good news
  simplified_phrase: the messenger
  preserved_meaning: The person is identified by the good news he brings.
  reasoning_layer_used: Lexical decision for מְבַשֵּׂר
  rationale: “Messenger” makes the person’s role immediately clear without making it a technical office.
- pob_phrase: who brings good news, who announces peace, who brings good news of good things, who announces salvation
  simplified_phrase: He brings good news, announces peace, brings good news of good things, and announces salvation.
  preserved_meaning: All four announcements remain distinct, including the Hebrew repetition of good news.
  reasoning_layer_used: Lexical decisions and applied revision
  rationale: A new sentence removes the long relative-clause chain while retaining every proclamation.
- pob_phrase: who says to Zion
  simplified_phrase: He says to Zion
  preserved_meaning: The messenger directly addresses Zion with the royal announcement.
  reasoning_layer_used: Lexical decision for אֹמֵר לְצִיּוֹן
  rationale: A separate sentence makes the climactic message easier to follow.
translation_notes:
