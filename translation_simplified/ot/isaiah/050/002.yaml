translation:
  language: en
  text: Why was no man[a] there when I came? Why did no one answer when I called? Is my hand really too short to bring redemption? Do I lack the power to rescue? Look! With my rebuke I dry up the sea and turn rivers into desert. Their fish stink because there is no water, and they die of thirst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “man” represents any person who might have answered.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Why, when I came, was there no man?
  simplified_phrase: Why was no man there when I came?
  preserved_meaning: God asks why nobody was present when he came.
  reasoning_layer_used: Lexical decision for וְאֵין אִישׁ and the gendered-term theological decision.
  rationale: The reordered question is easier to follow while retaining “man.”
- pob_phrase: Is my hand really too short to redeem, or is there no power in me to deliver?
  simplified_phrase: Is my hand really too short to bring redemption? Do I lack the power to rescue?
  preserved_meaning: God challenges the idea that he cannot redeem or rescue.
  reasoning_layer_used: Lexical decisions for the shortened-hand image, redemption, power, and deliverance.
  rationale: Two short questions preserve both ideas and make the contrast clear.
- pob_phrase: Behold, by my rebuke I dry up the sea; I make rivers a wilderness
  simplified_phrase: Look! With my rebuke I dry up the sea and turn rivers into desert.
  preserved_meaning: God points to his power to remove water from seas and rivers by his own rebuke.
  reasoning_layer_used: Lexical decisions for הֵן, בְּגַעֲרָתִי, and the river-to-wilderness transformation.
  rationale: Modern wording retains God's ownership of the rebuke and the drought image.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “man” as excluding women rather than as representative language.
    mitigation: The footnote explains that it represents any person who might answer.
  - risk: “My hand” could be mistaken for a statement about God's physical form.
    mitigation: The next question makes clear that the image concerns his power to rescue.
