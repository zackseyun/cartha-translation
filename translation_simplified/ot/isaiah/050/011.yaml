    reason: lexical_alternative
simplification_decisions:
- pob_phrase: who kindle a fire
  simplified_phrase: who light your own fire
  preserved_meaning: They create the fire on which they rely.
  reasoning_layer_used: lexical decision and theological decision on self-reliance
  rationale: “Light” is more familiar than “kindle,” while “your own” highlights the fire as self-made.
- pob_phrase: who gird yourselves with burning arrows
  simplified_phrase: who arm yourselves with burning arrows
  preserved_meaning: They equip themselves with hostile, burning weapons.
  reasoning_layer_used: lexical decision for מְאַזְּרֵי and זִיקוֹת
  rationale: “Arm yourselves” makes the girding metaphor immediately understandable without losing the weapon image.
- pob_phrase: walk in the light of your fire
  simplified_phrase: Walk by the light of your fire
  preserved_meaning: They are ironically commanded to rely on the light they made.
  reasoning_layer_used: lexical rationale and theological decision on judicial irony
  rationale: “By the light” is natural English and retains the ironic command.
interpretive_expansions:
- pob_phrase: your fire
  rendering: your own fire
  claim: The fire is self-made and represents what the hearers rely on.
  evidence:
