translation:
  language: en
  text: 'Look, all of you who light your own fire and arm yourselves with burning arrows.[a] Walk by the light of your fire and among the arrows you have set ablaze. This comes to you from my hand: you will lie down in torment.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may instead refer to sparks, firebrands, or flaming darts.
    reason: lexical_alternative
  - marker: b
