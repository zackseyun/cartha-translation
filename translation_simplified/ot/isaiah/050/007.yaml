translation:
  language: en
  text: But the Lord Yahweh[a] helps me. For that reason, I have not been disgraced. For that reason, I am determined to stand firm; I have set my face like flint. I know that I will not be put to shame.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew title is literally “Lord YHWH.” “Yahweh” is the name represented by YHWH.
    reason: source_note
simplification_decisions:
- pob_phrase: But the Lord GOD helps me; therefore I have not been disgraced.
  simplified_phrase: But the Lord Yahweh helps me. For that reason, I have not been disgraced.
  preserved_meaning: Yahweh’s help is the reason the speaker has not suffered disgrace.
  reasoning_layer_used: The theological decision requires Yahweh for YHWH, while the lexical decision marks the following phrase as a consequence.
  rationale: Short sentences clarify the cause and result while applying the updated divine-name decision.
- pob_phrase: Therefore I have set my face like flint
  simplified_phrase: For that reason, I am determined to stand firm; I have set my face like flint.
  preserved_meaning: Because of God’s help, the speaker faces opposition with firm resolve.
  reasoning_layer_used: The POB cultural note explains the flint image as firm resolve in the face of opposition.
  rationale: The wording explains the unfamiliar idiom while retaining its concrete image.
- pob_phrase: and I know that I will not be put to shame
  simplified_phrase: I know that I will not be put to shame.
  preserved_meaning: The speaker is certain that he will not be publicly shamed or proved wrong.
  reasoning_layer_used: The lexical decision preserves the passive, resultative force of בוש.
  rationale: A separate sentence makes the final assurance easier to follow.
interpretive_expansions:
