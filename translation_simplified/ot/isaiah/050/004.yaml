translation:
  language: en
  text: Lord Yahweh has given me the tongue of someone who is taught, so I know how to help weary people with a word.[a] Morning after morning he awakens me;[b] he awakens my ear to hear like someone who is taught.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb is difficult; it may mean “sustain” or “help” and, less likely, “answer” the weary with a word.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew leaves the object of the first “awakens” unstated; “me” is supplied from the context.
    reason: source_note
