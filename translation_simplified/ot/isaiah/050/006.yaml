translation:
  language: en
  text: I gave my back to those who beat me and my cheeks to those who pulled out my beard.[a] I did not hide my face when they humiliated me and spit on me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may mean “those who pulled out my hair,” but the beard is most likely meant here.
    reason: lexical_alternative
