  rationale: Common English replaces the formal formula while retaining the divine name and authority.
- pob_phrase: your mother's certificate of divorce, with which I sent her away
  simplified_phrase: the divorce document I gave your mother when I sent her away
  preserved_meaning: The LORD uses the legal image of a divorce document and dismissal.
  reasoning_layer_used: POB translation and source-language image
  rationale: The legal image remains, but the clause is reordered into natural English.
- pob_phrase: Look, you were sold because of your iniquities
  simplified_phrase: The truth is, you were sold because of your own sins
  preserved_meaning: Their sale resulted from their wrongdoing, not from the LORD’s debt.
  reasoning_layer_used: POB translation and immediate rhetorical contrast
  rationale: Familiar wording clarifies the emphatic contrast without weakening responsibility.
