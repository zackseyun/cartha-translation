translation:
  language: en
  text: When its harvest dries up[a], it is broken into pieces. Women come and use it to make fires. These people do not understand. Therefore, their Maker will have no compassion on them, and the one who formed them will show them no favor.
  philosophy: optimal-equivalence
  footnotes:
