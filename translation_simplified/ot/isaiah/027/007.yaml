  reasoning_layer_used: Lexical decision for מַכֵּהוּ
  rationale: “His attacker” expresses the same role in shorter, natural English.
- pob_phrase: Has he struck him ... has he been killed
  simplified_phrase: Did he strike him ... was he killed
  preserved_meaning: Both clauses remain rhetorical questions comparing how he was struck and killed.
  reasoning_layer_used: Lexical decisions for הִכָּהוּ and הֹרָג
  rationale: Simple past forms make the paired questions easier to follow without changing their force.
- pob_phrase: as his slain were killed
  simplified_phrase: as his slain were killed
  preserved_meaning: The possessive relationship and its compressed ambiguity remain intact.
  reasoning_layer_used: Lexical decision for הֲרֻגָיו and theological decision on pronoun referents
  rationale: Retaining “his slain” avoids replacing the Hebrew relationship with a generic group.
