  text: 'Therefore, through this, Jacob’s guilt will be atoned for. This will be the full result of taking away his sin: when he turns all the stones of the altar into crushed chalk, no Asherah pole[a] or incense altar will remain standing.'
  philosophy: optimal-equivalence
  footnotes:
