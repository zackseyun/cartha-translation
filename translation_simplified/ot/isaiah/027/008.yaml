translation:
  language: en
  text: You brought measured judgment against her[a] when you sent her away.[b] He drove her out with his fierce wind on the day the east wind blew.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Hebrew expression may also mean “with restraint” or “in exact measure”; the judgment was limited rather than total destruction.
    reason: lexical_alternative
  - marker: b
    text: “Her” personifies Zion, Israel, or God’s people without specifying which one.
    reason: alternative_reading
  - marker: c
    text: The east wind was a scorching, destructive wind from the desert.
    reason: cultural_note
