translation:
  language: en
  text: When that day comes, a great trumpet will sound. Those perishing[a] in the land of Assyria and those driven away[b] in the land of Egypt will come. They will worship[c] the LORD on the holy mountain in Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “those who were lost.”
    reason: lexical_alternative
  - marker: b
    text: Or “those banished” or “the outcasts.”
    reason: lexical_alternative
  - marker: c
    text: The Hebrew describes bowing down or lying facedown before the LORD.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And in that day
  simplified_phrase: When that day comes
  preserved_meaning: A decisive future time is announced without defining its exact horizon.
  reasoning_layer_used: Lexical decision and theological decision on prophetic gathering imagery
  rationale: The time formula is recast in ordinary English without narrowing its prophetic scope.
- pob_phrase: a great trumpet will be blown
  simplified_phrase: a great trumpet will sound
  preserved_meaning: A trumpet of great significance will be sounded.
  reasoning_layer_used: Lexical decision for יִתָּקַע בְּשׁוֹפָר גָּדוֹל
  rationale: The active English idiom communicates the same event more naturally.
- pob_phrase: and those perishing ... and those driven away ... will come and worship
  simplified_phrase: Those perishing ... and those driven away ... will come. They will worship
  preserved_meaning: Both displaced groups will come and worship the LORD.
  reasoning_layer_used: Lexical decisions for the participles and worship verb
  rationale: Splitting the long sentence clarifies the gathering while keeping both groups distinct.
translation_notes:
  risk_flags:
