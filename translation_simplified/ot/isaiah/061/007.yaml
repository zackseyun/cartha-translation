translation:
  language: en
  text: Your shame will be replaced with a double share.[a] Instead of disgrace, they will shout for joy over their share. So they will possess twice as much in their own land, and their joy will last forever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew shifts here from “your” to “they” and “their”; some translations use “you” and “your” throughout.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Instead of your shame, there will be a double portion
  simplified_phrase: Your shame will be replaced with a double share
  preserved_meaning: Shame gives way to a restored amount twice as great.
  reasoning_layer_used: Lexical decisions for תַּחַת and מִשְׁנֶה
  rationale: The active wording makes the promised reversal immediate while retaining the double-share idea.
- pob_phrase: Therefore in their land they will possess a double portion
  simplified_phrase: So they will possess twice as much in their own land
  preserved_meaning: They will securely receive a doubled possession in the land belonging to them.
  reasoning_layer_used: Lexical decisions for לָכֵן, בְּאַרְצָם, יִירָשׁוּ, and מִשְׁנֶה
  rationale: Common wording clarifies the result without losing the land, possession, or doubled amount.
- pob_phrase: everlasting joy will be theirs
  simplified_phrase: their joy will last forever
  preserved_meaning: Their promised joy will endure without end.
  reasoning_layer_used: Lexical decision for שִׂמְחַת עוֹלָם
  rationale: The verbal form is easier to understand while preserving the promise's duration.
