translation:
  language: en
  text: For I am Yahweh. I love justice, and I hate robbery linked to burnt offerings.[a] I will faithfully give them what is due to them, and I will establish an everlasting covenant with them.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is difficult and may mean robbery in, for, or alongside a burnt offering; it connects injustice with worship without specifying the exact connection.
    reason: alternative_reading
  - marker: b
    text: The Hebrew says, “cut an everlasting covenant,” an idiom meaning to establish one.
    reason: cultural_note
simplification_decisions:
- pob_phrase: robbery with burnt offering
  simplified_phrase: robbery linked to burnt offerings
  preserved_meaning: Robbery remains associated with sacrificial worship without defining the precise relationship.
  reasoning_layer_used: Lexical and theological decisions on גָזֵל בְּעוֹלָה
  rationale: “Linked to” makes the difficult association readable while preserving its documented ambiguity.
- pob_phrase: give them their recompense in faithfulness
  simplified_phrase: faithfully give them what is due to them
  preserved_meaning: Yahweh will reliably grant them their just recompense.
  reasoning_layer_used: Lexical decision on פְעֻלָּתָם and בֶּאֱמֶת
  rationale: The recast sentence explains “recompense” and clearly attaches faithfulness to God's giving.
- pob_phrase: cut an everlasting covenant
  simplified_phrase: establish an everlasting covenant
  preserved_meaning: Yahweh will bring an enduring covenant into effect with them.
  reasoning_layer_used: Lexical decision on אֶכְרֹת and POB cultural note
  rationale: “Establish” communicates the covenant idiom naturally while the footnote preserves its cutting image.
