translation:
  language: en
  text: They will rebuild ruins from long ago.[a] They will raise back up the places devastated in earlier times. They will renew cities that had remained in ruins for generation after generation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “ancient ruins”; the Hebrew can refer to remote antiquity or a long span of time.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the ancient ruins
  simplified_phrase: ruins from long ago
  preserved_meaning: The ruins have stood for a very long time.
  reasoning_layer_used: Lexical decision for חָרְבוֹת עוֹלָם
  rationale: The wording makes the time reference immediately clear without suggesting everlasting ruin.
- pob_phrase: they will raise up the former desolations
  simplified_phrase: They will raise back up the places devastated in earlier times
  preserved_meaning: Long-devastated places will be brought back into a standing condition.
  reasoning_layer_used: Lexical decisions for שֹׁמְמוֹת רִאשֹׁנִים and יְקוֹמֵמוּ
  rationale: The rewrite identifies the desolations as places while preserving the concrete image of raising them up.
- pob_phrase: the ruined cities, the desolations of generation after generation
  simplified_phrase: cities that had remained in ruins for generation after generation
  preserved_meaning: The cities had been desolate across successive generations and will be renewed.
  reasoning_layer_used: Lexical decision for שֹׁמְמוֹת דּוֹר וָדוֹר
  rationale: The relative clause clearly connects the long desolation with the ruined cities.
