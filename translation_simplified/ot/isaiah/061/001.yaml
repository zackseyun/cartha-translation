translation:
  language: en
  text: The Spirit of the Lord GOD rests on me, because Yahweh has anointed me to bring good news to the humble.[a] He has sent me to bind up those whose hearts are broken, to proclaim freedom to captives, and to proclaim release from prison to those who are bound.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the poor”; the Hebrew word can also refer to the meek or afflicted.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew expression is difficult; it may instead mean “opening of the eyes” or, more generally, “release” for those who are bound.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: is upon me
  simplified_phrase: rests on me
  preserved_meaning: The divine Spirit is present on the speaker and empowers his prophetic mission.
  reasoning_layer_used: Lexical decision for עָלַי in prophetic commissioning language.
  rationale: “Rests on me” expresses the commissioning relationship in natural English.
- pob_phrase: to bind up the brokenhearted
  simplified_phrase: to bind up those whose hearts are broken
  preserved_meaning: The speaker treats inwardly wounded people as wounds needing bandaging.
  reasoning_layer_used: Lexical decisions for לַחֲבֹשׁ and לְנִשְׁבְּרֵי לֵב.
  rationale: The expanded wording makes the metaphor immediately understandable without reducing it to general healing.
- pob_phrase: to proclaim liberty to the captives and opening of the prison to the bound
  simplified_phrase: to proclaim freedom to captives, and to proclaim release from prison to those who are bound
  preserved_meaning: Both freedom and release from confinement remain the content of the public proclamation.
  reasoning_layer_used: Lexical decisions for לִקְרֹא, דְּרוֹר, אֲסוּרִים, and פְּקַח־קוֹחַ.
  rationale: Repeating “to proclaim” clarifies the parallel promises while preserving their shared governing verb.
translation_notes:
  risk_flags:
  - risk: “The humble” may be understood only as a character trait rather than also including the poor or afflicted.
    mitigation: Footnote a preserves the Hebrew word’s broader social and experiential range.
  - risk: “Release from prison” reflects one debated interpretation of פְּקַח־קוֹחַ.
    mitigation: Footnote b preserves the important alternatives while retaining the contextually supported main reading.
