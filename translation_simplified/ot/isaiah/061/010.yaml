  preserved_meaning: The speaker responds to God with deep joy.
  reasoning_layer_used: POB lexical decision for תָּגֵל נַפְשִׁי
  rationale: “Rejoice” communicates the poetic joy more clearly than the less familiar “exult.”
- pob_phrase: who adorns himself with a priestly headdress
  simplified_phrase: who puts on an ornate priestly headdress
  preserved_meaning: The bridegroom's festive adornment retains the likely priestly allusion.
  reasoning_layer_used: POB lexical decision and footnote for יְכַהֵן פְּאֵר
  rationale: “Puts on” makes the action immediate while “priestly” preserves the source image.
- pob_phrase: who decks herself with her jewelry
