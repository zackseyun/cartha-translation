translation:
  language: en
  text: I will rejoice greatly in Yahweh; my soul will rejoice in my God. He has clothed me in garments of salvation and wrapped me in a robe of righteousness.[a] I am like a bridegroom who puts on an ornate priestly headdress,[b] and like a bride who adorns herself with jewelry.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “a mantle of righteousness” or “a robe of justice.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew likely describes a bridegroom putting on a headdress like a priest.
    reason: lexical_alternative
