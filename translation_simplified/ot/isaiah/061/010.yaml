  preserved_meaning: The bride beautifies herself with bridal ornaments.
  reasoning_layer_used: POB lexical decision for תַּעְדֶּה כֵלֶיהָ
  rationale: “Adorns” is common modern English and avoids the dated expression “decks herself.”
