translation:
  language: en
  text: to provide for Zion’s mourners by giving them a festive headdress[a] instead of ashes, oil for joyful celebration instead of mourning, and a garment of praise instead of a faint spirit. They will be called oaks of righteousness[b][c], planted by Yahweh so that he may display his glory.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “beauty”; the Hebrew likely pictures festive headwear replacing ashes worn in mourning.
    reason: lexical_alternative
  - marker: b
    text: Or “terebinths of righteousness”; “oaks” preserves the image with a familiar tree.
    reason: lexical_alternative
  - marker: c
    text: Or “oaks of justice.”
    reason: alternative_reading
