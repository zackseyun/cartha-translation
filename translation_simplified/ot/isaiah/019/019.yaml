translation:
  language: en
  text: In that day, there will be an altar dedicated to Yahweh within Egypt. Beside Egypt’s border, there will also be a pillar[a] dedicated to Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can also mean “standing stone.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: in the midst of the land of Egypt
  simplified_phrase: within Egypt
  preserved_meaning: The altar will be located inside Egypt, not merely at its edge.
  reasoning_layer_used: POB lexical decision for בְּתוֹךְ and אֶרֶץ מִצְרַיִם
  rationale: “Within Egypt” states the location naturally without losing the contrast with the border.
- pob_phrase: and a pillar to Yahweh beside its border
  simplified_phrase: Beside Egypt’s border, there will also be a pillar dedicated to Yahweh
  preserved_meaning: A second structure near Egypt’s boundary will belong to Yahweh.
  reasoning_layer_used: POB lexical decisions for מַצֵּבָה, אֵצֶל, גְּבוּלָהּ, and לַיהוָה
  rationale: A new sentence names Egypt directly and makes the spatial contrast easier to follow.
interpretive_expansions:
- pob_phrase: to Yahweh
  rendering: dedicated to Yahweh
  claim: Both the altar and the pillar are set apart for Yahweh.
  evidence:
