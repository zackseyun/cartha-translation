    mitigation: The footnote preserves “standing stone” as the lexical alternative.
  - risk: The positive reference to a pillar may seem at odds with condemnations of cultic pillars elsewhere.
    mitigation: The wording preserves the verse’s positive prophetic context without harmonizing the tension.
