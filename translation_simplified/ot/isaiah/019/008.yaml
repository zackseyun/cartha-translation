translation:
  language: en
  text: The fishermen will grieve. Everyone who casts a hook into the Nile will mourn, and those who spread a net over the water will waste away.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: will lament
  simplified_phrase: will grieve
  preserved_meaning: The fishermen will feel deep sorrow.
  reasoning_layer_used: The lexical decision allows mourning or grief without requiring a loud cry.
  rationale: “Grieve” is familiar English and avoids implying an explicitly vocal lament.
- pob_phrase: all who cast a hook into the Nile
  simplified_phrase: everyone who casts a hook into the Nile
  preserved_meaning: The clause identifies all people who fish by casting a hook into the Nile.
  reasoning_layer_used: The lexical decisions preserve the occupational group, concrete action, hook, and Nile setting.
  rationale: “Everyone” reads naturally while retaining the source image of casting a hook.
- pob_phrase: those who spread a net over the waters will waste away
  simplified_phrase: those who spread a net over the water will waste away
  preserved_meaning: People who fish with nets will languish severely.
  reasoning_layer_used: The lexical decisions preserve the net-spreading image and the force of becoming feeble.
  rationale: The singular mass noun “water” is smoother modern English without changing the image.
translation_notes:
  risk_flags:
  - risk: “Grieve” emphasizes sorrow more than the possible nuance of sighing or groaning.
    mitigation: It remains within the documented lexical range and preserves the distinction from “mourn.”
