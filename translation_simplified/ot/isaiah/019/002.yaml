translation:
  language: en
  text: I will turn the Egyptians against one another.[a] People will fight their own brothers and neighbors. City will fight city, and kingdom will fight kingdom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says, “Egypt against Egypt,” describing conflict within Egypt.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I will stir up Egyptians against Egyptians
  simplified_phrase: I will turn the Egyptians against one another
  preserved_meaning: God will cause internal conflict among the Egyptian people.
  reasoning_layer_used: POB lexical and theological decisions on the repeated name Egypt
  rationale: “Against one another” states the civil-conflict sense in familiar English.
- pob_phrase: each will fight against his brother, and each against his neighbor
  simplified_phrase: People will fight their own brothers and neighbors
  preserved_meaning: The conflict will spread through families and the wider community.
  reasoning_layer_used: POB lexical decisions on distributive איש, brother, and neighbor
  rationale: The plural sentence avoids repetitive syntax while keeping both social relationships distinct.
- pob_phrase: city against city, kingdom against kingdom
  simplified_phrase: City will fight city, and kingdom will fight kingdom
  preserved_meaning: The turmoil will escalate from personal conflict to civic and political conflict.
  reasoning_layer_used: POB lexical decisions on city and kingdom
  rationale: Adding “will fight” makes the compressed Hebrew pattern immediately clear.
