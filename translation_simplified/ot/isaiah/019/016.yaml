simplification_decisions:
- pob_phrase: trembling and afraid
  simplified_phrase: shaking with fear
  preserved_meaning: Egypt will visibly tremble because it is afraid.
  reasoning_layer_used: lexical decision for וְחָרַד וּפָחַד
  rationale: The clearer phrase preserves the intensified physical and emotional fear response.
- pob_phrase: because of the waving of the hand of Yahweh of Armies, which he waves against it
  simplified_phrase: because Yahweh of Armies waves his hand against it
  preserved_meaning: Yahweh makes a hostile hand motion toward Egypt in judgment.
  reasoning_layer_used: lexical decisions for מִפְּנֵי, תְּנוּפַת יַד, and אֲשֶׁר הוּא מֵנִיף עָלָיו
  rationale: The active clause removes repetition while retaining the concrete hand-motion image and its hostile direction.
