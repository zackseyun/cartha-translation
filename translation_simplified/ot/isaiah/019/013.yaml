translation:
  language: en
  text: The leaders of Zoan have become foolish, and the leaders of Noph[a] are deceived. These men—the cornerstone supporting Egypt’s tribes—have led the nation astray.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Noph is the Hebrew name for Memphis.
    reason: cultural_note
simplification_decisions:
- pob_phrase: the princes of Zoan ... the princes of Noph
  simplified_phrase: the leaders of Zoan ... the leaders of Noph
  preserved_meaning: They are members of Egypt’s ruling elite.
  reasoning_layer_used: POB lexical decision for שָׂרֵי
  rationale: “Leaders” avoids suggesting only royal sons while preserving their governing role.
- pob_phrase: They have led Egypt astray
  simplified_phrase: have led the nation astray
  preserved_meaning: Egypt’s leaders have caused Egypt to go in the wrong direction.
  reasoning_layer_used: POB lexical decisions for הִתְעוּ and מִצְרַיִם
  rationale: “The nation” avoids repeating Egypt without weakening the causative meaning.
- pob_phrase: they who are the cornerstone of her tribes
  simplified_phrase: These men—the cornerstone supporting Egypt’s tribes—
  preserved_meaning: The leaders are pictured as the chief support of Egypt’s constituent groups.
  reasoning_layer_used: POB lexical decisions for פִּנַּת and שְׁבָטֶיהָ
  rationale: The recast apposition keeps the cornerstone image while making its role easier to grasp.
