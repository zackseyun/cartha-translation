translation:
  language: en
  text: In that day, a highway will connect Egypt and Assyria. People from Assyria will enter Egypt, and people from Egypt will enter Assyria. Egypt will serve God together with Assyria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, the Hebrew says, “Egypt will serve Assyria.” But the surrounding verses favor the sense that Egypt and Assyria will serve God together.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: there will be a highway from Egypt to Assyria
  simplified_phrase: a highway will connect Egypt and Assyria
  preserved_meaning: The highway remains an image of open connection between the nations.
  reasoning_layer_used: Lexical decision for מְסִלָּה and the international-route context.
  rationale: “Will connect” directly explains the highway’s function.
- pob_phrase: Assyria will come into Egypt, and Egypt into Assyria
  simplified_phrase: People from Assyria will enter Egypt, and people from Egypt will enter Assyria
  preserved_meaning: Both nations will cross into each other’s lands.
  reasoning_layer_used: Lexical decisions for בוא and the Hebrew elliptical parallel clause.
  rationale: Naming the people and supplying the omitted verb clarify both movements.
- pob_phrase: Egypt will serve with Assyria
  simplified_phrase: Egypt will serve God together with Assyria
  preserved_meaning: Egypt and Assyria join in religious service rather than political subjugation.
  reasoning_layer_used: POB theological decision and Isaiah 19:24–25.
  rationale: Adding “God” makes the contextually favored object of their shared service clear.
