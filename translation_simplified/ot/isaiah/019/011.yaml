- pob_phrase: the wise counselors of Pharaoh give foolish counsel
  simplified_phrase: Pharaoh’s wise advisers give stupid advice
  preserved_meaning: Pharaoh’s reputedly wise court advisers offer advice marked by severe stupidity.
  reasoning_layer_used: POB lexical decisions and doctrine-realignment revision
  rationale: Common words replace formal court language while preserving the source’s sharp insult.
- pob_phrase: a son of wise men, a son of ancient kings
  simplified_phrase: I come from wise ancestors, from the line of ancient kings
  preserved_meaning: The speaker boasts of inherited wisdom and an ancient royal pedigree.
  reasoning_layer_used: POB lexical decisions and cultural footnote b
  rationale: The idiom is stated as ancestry so modern readers do not mistake it for immediate sonship.
