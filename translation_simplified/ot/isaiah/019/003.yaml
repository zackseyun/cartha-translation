translation:
  language: en
  text: Egypt’s spirit will be drained away from within, and I will swallow up its plans. Then the Egyptians will consult idols, ghosts,[a] mediums, and spiritists.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Hebrew word translated “ghosts” may instead mean “mutterers” or “charmers.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the spirit of Egypt will be emptied out within it
  simplified_phrase: Egypt’s spirit will be drained away from within
  preserved_meaning: Egypt will suffer an inner collapse while the image of its spirit being emptied remains.
  reasoning_layer_used: Lexical decisions for נָבְקָה, רוּחַ, and בְּקִרְבּוֹ
  rationale: “Drained away from within” makes the national depletion natural in English without reducing “spirit” to courage alone.
- pob_phrase: I will swallow up its counsel
  simplified_phrase: I will swallow up its plans
  preserved_meaning: God will consume and frustrate Egypt’s deliberations and policy.
  reasoning_layer_used: Lexical decisions for עֲצָתוֹ and אֲבַלֵּעַ
  rationale: “Plans” is clearer than “counsel,” while “swallow up” preserves the concrete Hebrew image.
- pob_phrase: they will seek the idols, the ghosts, the mediums, and the spiritists
  simplified_phrase: Then the Egyptians will consult idols, ghosts, mediums, and spiritists
  preserved_meaning: In crisis, Egypt’s people will seek guidance from illicit spiritual sources.
  reasoning_layer_used: Lexical and theological decisions for וְדָרְשׁוּ אֶל and the occult terms
  rationale: “Consult” states the divinatory sense clearly, and “the Egyptians” identifies the implied subject.
translation_notes:
  risk_flags:
