  preserved_meaning: This is a weighty prophetic pronouncement concerning Egypt.
  reasoning_layer_used: POB lexical decision for מַשָּׂא
  rationale: “Prophetic message” makes the heading immediately understandable without reducing it to an ordinary message.
- pob_phrase: Behold
  simplified_phrase: Look!
  preserved_meaning: The prophet urgently directs attention to the vision.
  reasoning_layer_used: POB lexical decision for הִנֵּה
  rationale: “Look!” preserves the vivid attention-directing force in common English.
- pob_phrase: before him
  simplified_phrase: in his presence
  preserved_meaning: The idols shake because Yahweh has come near.
  reasoning_layer_used: POB lexical decision and footnote for מִפָּנָיו
  rationale: “In his presence” clearly expresses the Hebrew sense of being before Yahweh’s face.
