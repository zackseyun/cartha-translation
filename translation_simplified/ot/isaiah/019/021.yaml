translation:
  language: en
  text: Yahweh will reveal himself to the people of Egypt.[a] In that day, they will know Yahweh. They will worship with sacrifices and offerings. They will make vows to Yahweh and carry them out.
  philosophy: optimal-equivalence
  footnotes:
