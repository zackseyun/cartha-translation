translation:
  language: en
  text: It will serve as a sign and a witness to Yahweh of Armies in Egypt. They will cry out to Yahweh because of those who oppress them. He will send them a savior and champion,[a] and he will rescue them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression translated “a savior and champion” is difficult; the second term may instead mean “a great one.”
    reason: lexical_alternative
