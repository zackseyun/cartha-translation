  text: until a spirit from above is poured out on us.[a] Then the wilderness will become fruitful land,[b] and the fruitful land will be regarded as a forest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Spirit from above”; the Hebrew may refer specifically to God’s Spirit.
    reason: alternative_reading
  - marker: b
    text: The Hebrew means fertile or cultivated land, not necessarily the place called Carmel.
    reason: lexical_alternative
