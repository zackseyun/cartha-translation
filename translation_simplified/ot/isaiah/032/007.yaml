translation:
  language: en
  text: A rogue’s methods are evil.[a] He makes plans to ruin humble people with lies, even when a poor man speaks what is right.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word for “methods” can also mean tools, instruments, or weapons.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the rogue’s devices are evil
  simplified_phrase: A rogue’s methods are evil
  preserved_meaning: The rogue’s ways of acting are morally evil.
  reasoning_layer_used: The lexical decision for כֵלַי permits the metaphorical sense “methods.”
  rationale: “Methods” is clearer than “devices” while the footnote preserves the implement image.
- pob_phrase: he devises schemes
  simplified_phrase: He makes plans
  preserved_meaning: He deliberately forms harmful plans.
  reasoning_layer_used: The lexical decisions for זִמּוֹת and יָעַץ establish intentional planning.
  rationale: The purpose that follows makes the plans’ malicious character clear.
- pob_phrase: to ruin the humble with lying words
  simplified_phrase: to ruin humble people with lies
  preserved_meaning: He seeks to harm humble people by using false speech.
  reasoning_layer_used: The lexical decisions preserve the victim, destructive intent, and means of harm.
  rationale: The shorter wording expresses the same ideas in common English.
translation_notes:
  risk_flags:
