    mitigation: Footnote a retains the literal alternatives tools, instruments, and weapons.
  - risk: “What is right” is slightly broader than the legal-ethical wording “what is just.”
    mitigation: It preserves the clause’s ambiguity without limiting it to a courtroom case.
