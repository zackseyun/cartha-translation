translation:
  language: en
  text: Blessed are you who plant seed wherever there is water and let the ox and donkey roam freely.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: who sow beside all waters
  simplified_phrase: who plant seed wherever there is water
  preserved_meaning: The people sow in abundant, well-watered places.
  reasoning_layer_used: POB lexical decisions for זֹרְעֵי and עַל כָּל מָיִם
  rationale: “Plant seed” explains “sow” while preserving the well-watered agricultural setting.
- pob_phrase: who let the feet of the ox and the donkey range free
  simplified_phrase: let the ox and donkey roam freely
  preserved_meaning: The animals are turned loose to move or graze freely.
  reasoning_layer_used: POB lexical decision and footnote for מְשַׁלְּחֵי רֶגֶל
  rationale: “Roam freely” states the established idiomatic sense without adding a destination.
