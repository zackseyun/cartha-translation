simplification_decisions:
- pob_phrase: You complacent women, rise up; hear my voice.
  simplified_phrase: Get up, you women who are too comfortable and unconcerned; listen to me.
  preserved_meaning: The prophet urgently summons women whose comfortable ease includes blameworthy unconcern.
  reasoning_layer_used: POB lexical decisions for שַׁאֲנַנּוֹת, קֹמְנָה, שְׁמַעְנָה, and קוֹלִי.
  rationale: The reordered wording explains complacency while keeping the two commands distinct.
- pob_phrase: You confident daughters, listen to my word.
  simplified_phrase: You daughters who feel safe and self-assured, pay attention to what I say.
  preserved_meaning: The women feel secure and are commanded to listen attentively to the prophet’s message.
  reasoning_layer_used: POB lexical decisions for בָּנוֹת, בֹּטְחוֹת, הַאְזֵנָּה, and אִמְרָתִי.
  rationale: The wording clarifies subjective security and attentive listening while retaining “daughters.”
