translation:
  language: en
  text: Get up, you women who are too comfortable and unconcerned; listen to me. You daughters[a] who feel safe and self-assured, pay attention to what I say.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Daughters” is the Hebrew form of address for these women.
