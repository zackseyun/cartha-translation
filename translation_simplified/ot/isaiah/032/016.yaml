translation:
  language: en
  text: Then justice will make its home in the wilderness, and righteousness will live in the fertile fields.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in Carmel.” The Hebrew word can mean fertile, cultivated land or the place named Carmel.
