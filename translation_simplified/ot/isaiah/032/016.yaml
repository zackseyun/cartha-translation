  preserved_meaning: Justice is pictured as settling permanently in the land.
  reasoning_layer_used: Lexical decision for וְשָׁכַן and its settled-residence image
  rationale: “Make its home” expresses settled residence in familiar English while preserving the personification.
- pob_phrase: righteousness will abide
  simplified_phrase: righteousness will live
  preserved_meaning: Righteousness will remain as an established presence.
  reasoning_layer_used: Lexical decision for תֵּשֵׁב and the poetic parallelism
  rationale: “Live” is clearer than “abide” and keeps the parallel image of residence.
- pob_phrase: in the fruitful field
