translation:
  language: en
  text: Tremble, you complacent women! Shudder, you women who feel secure! Strip off your clothes and make yourselves bare. Tie sackcloth around your waist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says to tie something around the waist without naming it; the mourning context strongly suggests sackcloth.
    reason: cultural_note
simplification_decisions:
- pob_phrase: you confident ones
  simplified_phrase: you women who feel secure
  preserved_meaning: The women believe they are safe, though the prophetic warning challenges that confidence.
  reasoning_layer_used: Lexical decision for בֹּטְחוֹת and immediate context
  rationale: The clause makes the ironic sense of their confidence easier to grasp while preserving the feminine address.
- pob_phrase: Strip, make yourselves bare
  simplified_phrase: Strip off your clothes and make yourselves bare
  preserved_meaning: The two commands call for removing clothing and becoming exposed as a sign of mourning or humiliation.
  reasoning_layer_used: Lexical decisions for פְּשֹׁטָה and וְעֹרָה
  rationale: Naming the clothes clarifies what “strip” means without collapsing the two commands.
- pob_phrase: tie sackcloth around your waist
  simplified_phrase: Tie sackcloth around your waist
  preserved_meaning: The women are commanded to put on the customary garment of mourning.
  reasoning_layer_used: Lexical decision for וַחֲגֹרָה עַל חֲלָצָיִם and cultural note
  rationale: The clear modern wording is retained because it already explains the ancient mourning action.
