translation:
  language: en
  text: But a noble man plans what is noble,[a] and he stands firm in what is noble.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “plans what is generous.” The Hebrew word can refer to nobility or generosity.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also mean “he stands by noble things” or “he is established in them.”
    reason: alternative_reading
