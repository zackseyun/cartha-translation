translation:
  language: en
  text: For Yahweh has poured a spirit of deep sleep[a] over you. He has shut your eyes—that is, your prophets[b]—and covered your heads—that is, your seers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a spirit of stupor”; the Hebrew can describe deep sleep or a numbing, sleep-like state.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew probably identifies the prophets as the people’s “eyes” and the seers as their “heads”; it may instead describe them as separate objects of Yahweh’s action.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: has poured out on you a spirit of deep sleep
  simplified_phrase: has poured a spirit of deep sleep over you
  preserved_meaning: Yahweh actively imposes an overwhelming, sleep-like condition while the pouring image remains.
  reasoning_layer_used: lexical and theological decisions
  rationale: The natural word order clarifies the sentence without softening Yahweh’s direct agency.
- pob_phrase: and has shut your eyes—the prophets—and covered your heads—the seers
  simplified_phrase: He has shut your eyes—that is, your prophets—and covered your heads—that is, your seers.
  preserved_meaning: The prophets are identified with the people’s eyes and the seers with their heads.
  reasoning_layer_used: syntactic and theological decisions
  rationale: A new sentence and “that is” make the preferred appositional reading clear while retaining both Hebrew images.
interpretive_expansions:
- pob_phrase: your eyes—the prophets ... your heads—the seers
  rendering: your eyes—that is, your prophets ... your heads—that is, your seers
  claim: The prophets and seers explain the metaphorical references to the people’s eyes and heads.
  evidence:
  - The POB syntactic decision treats both prophetic titles as appositional clarifications.
  - The parallel wording supports the chosen identification.
  confidence: high
  alternatives_preserved:
  - The prophetic titles may be separate objects of Yahweh’s actions.
translation_notes:
  risk_flags:
