    mitigation: The lexical footnote preserves “stupor” as an alternative and describes the numbing condition.
  - risk: The difficult Hebrew syntax permits a different relation between the body images and prophetic titles.
    mitigation: The alternative-reading footnote preserves that uncertainty.
