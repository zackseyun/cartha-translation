translation:
  language: en
  text: You turn things upside down! Should the potter be treated like the clay? Should something that was made say about its maker, “He did not make me”? Should something that was formed say about the one who formed it, “He does not understand”?
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Shall the potter be regarded as clay
  simplified_phrase: Should the potter be treated like the clay?
  preserved_meaning: The absurd reversal between the potter and the clay remains explicit.
  reasoning_layer_used: Lexical and theological decisions on the potter-clay metaphor
  rationale: Common wording preserves the concrete image and rhetorical force.
- pob_phrase: that what is made should say of its maker
  simplified_phrase: Should something that was made say about its maker
  preserved_meaning: The created object denies the one who made it.
  reasoning_layer_used: Lexical decisions for מַעֲשֶׂה and לְעֹשֵׂהוּ
  rationale: A separate question makes the maker-made contrast easier to follow.
- pob_phrase: what is formed say of the one who formed it
  simplified_phrase: Should something that was formed say about the one who formed it
  preserved_meaning: The formed object accuses the one who formed it of lacking understanding.
  reasoning_layer_used: Lexical decisions for יֵצֶר, לְיוֹצְרוֹ, and הֵבִין
  rationale: Repeating the full contrast keeps the parallel image clear.
