translation:
  language: en
  text: I will bring suffering on Ariel[a]. There will be mourning and cries of sorrow, and she will become like an altar hearth to me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ariel” is a name for Jerusalem, but it can also mean “altar hearth.” The Hebrew uses the same word twice as a wordplay. The final words could instead be translated, “she will become like Ariel to me.”
    reason: lexical_alternative
