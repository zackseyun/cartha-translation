    mitigation: The source-language sound image is retained, while the surrounding ground-and-dust imagery supplies its unsettling context.
  - risk: Modern readers may not connect “medium” with speaking to the dead.
    mitigation: The footnote gives the necromantic sense without implying that the city literally becomes a ghost.
