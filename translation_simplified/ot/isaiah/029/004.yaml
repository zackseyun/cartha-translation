translation:
  language: en
  text: Then you will be brought low to the ground. You will speak from the earth, and your words from the dust will be faint. Your voice will sound like the voice of a medium coming from the earth; your words will chirp from the dust.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also suggest a ghostly voice or the voice of someone who speaks with the dead.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Then you will be brought low; from the earth you will speak
  simplified_phrase: Then you will be brought low to the ground. You will speak from the earth
  preserved_meaning: The city is humiliated so severely that its voice seems to come from the ground.
  reasoning_layer_used: Lexical decisions for שׁפל and אֶרֶץ, with the judgment context
  rationale: A sentence break clarifies the judgment while preserving the earth image.
- pob_phrase: from the dust your speech will be low
  simplified_phrase: your words from the dust will be faint
  preserved_meaning: The city's speech is weak and subdued because it has been brought low.
  reasoning_layer_used: Lexical decision for תִּשַּׁח and its documented subdued-utterance sense
  rationale: “Faint” expresses low speech more naturally without fixing it only as a whisper.
- pob_phrase: Your voice will be like that of a medium from the earth
  simplified_phrase: Your voice will sound like the voice of a medium coming from the earth
  preserved_meaning: The voice is compared to the eerie, faint voice associated with necromancy.
  reasoning_layer_used: Lexical and theological decisions for אוֹב
  rationale: The recast comparison is easier to follow and still identifies the medium explicitly.
translation_notes:
  risk_flags:
