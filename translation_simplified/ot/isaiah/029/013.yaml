translation:
  language: en
  text: The Lord said, “These people come near to me with their mouths. They honor me with their lips,[a] but their hearts are far from me. Their fear of me has become a human command that they are taught.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Their words express honor, but their inner devotion does not match them.
    reason: simplification_note
  - marker: b
    text: “Fear of me” can also mean “reverence for me” or “worship of me.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: this people draws near with its mouth and honors me with its lips
  simplified_phrase: These people come near to me with their mouths. They honor me with their lips
  preserved_meaning: The people approach God with outward words of honor.
  reasoning_layer_used: POB lexical decisions for נִגַּשׁ and בְּפִיו וּבִשְׂפָתָיו
  rationale: Plural wording and two short sentences make the collective image natural while preserving both mouth and lips.
- pob_phrase: while its heart is far from me
  simplified_phrase: but their hearts are far from me
  preserved_meaning: Their inward devotion remains distant from God despite their outward honor.
  reasoning_layer_used: POB lexical decision for לִבּוֹ רִחַק מִמֶּנִּי
  rationale: The contrast is stated directly in natural plural English.
- pob_phrase: a commandment of men that is taught
  simplified_phrase: a human command that they are taught
  preserved_meaning: Their fear of God has become a human prescription received through instruction.
  reasoning_layer_used: POB lexical and theological decisions for מִצְוַת אֲנָשִׁים and מְלֻמָּדָה
  rationale: The wording keeps the command’s human origin distinct from the fact that it is taught.
translation_notes:
  risk_flags:
  - risk: Changing the singular collective “this people” to plural wording may soften the prophetic form.
    mitigation: The same group and accusation are preserved in more natural modern English.
  - risk: Modern readers may understand “fear” only as terror.
    mitigation: Footnote b preserves the supported senses of reverence and worship without resolving the ambiguity.
