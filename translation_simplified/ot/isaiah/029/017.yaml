translation:
  language: en
  text: Is it not just a very little while before Lebanon becomes an orchard[a] and the orchard is considered a forest?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “fruitful field.” The Hebrew refers to fertile, cultivated land.
