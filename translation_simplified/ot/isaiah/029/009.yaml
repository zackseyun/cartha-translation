translation:
  language: en
  text: Be stunned and amazed.[a] Blind yourselves and be blind.[b] They are drunk, but wine did not make them drunk. They stagger, but strong drink did not make them stagger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Linger in bewilderment and be amazed.” The Hebrew can suggest stunned hesitation.
    reason: lexical_alternative
  - marker: b
    text: The rare Hebrew verbs may also mean “Be dazed and stupefied.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Be stunned and be astonished
  simplified_phrase: Be stunned and amazed
  preserved_meaning: The forceful command describes stunned bewilderment.
  reasoning_layer_used: POB lexical decisions for הִתְמַהְמְהוּ and וּתְמָהוּ
  rationale: “Amazed” is more familiar than “astonished” while retaining the poetic parallel.
- pob_phrase: They are drunk, but not with wine
  simplified_phrase: They are drunk, but wine did not make them drunk
  preserved_meaning: Their condition resembles drunkenness but is not caused by wine.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The recast clause makes the contrast immediately clear without explaining the metaphor.
- pob_phrase: they stagger, but not from strong drink
  simplified_phrase: They stagger, but strong drink did not make them stagger
  preserved_meaning: Their staggering is real imagery but is not caused by intoxicating drink.
  reasoning_layer_used: POB lexical decisions for נָעוּ and וְלֹא שֵׁכָר
  rationale: The repeated cause-and-effect wording clarifies the poetic contrast.
translation_notes:
  risk_flags:
