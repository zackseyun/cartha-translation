translation:
  language: en
  text: It will be like a hungry man who dreams that he is eating, only to wake with an empty stomach; and like a thirsty man who dreams that he is drinking, only to wake faint and still craving water. So it will be for the multitude of all the nations waging war against Mount Zion.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: behold, he is eating, but he wakes and his appetite is empty
  simplified_phrase: dreams that he is eating, only to wake with an empty stomach
  preserved_meaning: The dream seems to satisfy his hunger, but waking reveals that his bodily need remains unmet.
  reasoning_layer_used: Lexical and theological decisions for נֶפֶשׁ in the hunger imagery
  rationale: “Empty stomach” conveys the intended bodily hunger without suggesting an empty immaterial soul.
- pob_phrase: and as when a thirsty man dreams, and behold, he is drinking, but he wakes
  simplified_phrase: and like a thirsty man who dreams that he is drinking, only to wake
  preserved_meaning: The thirsty-man image remains a second, cumulative comparison joined to the hungry-man image.
  reasoning_layer_used: Source conjunction and repeated comparative structure
  rationale: “And like” preserves the paired comparison while using natural English.
- pob_phrase: So will be the multitude of all the nations that wage war against Mount Zion
  simplified_phrase: So it will be for the multitude of all the nations waging war against Mount Zion
  preserved_meaning: The comparison applies to the whole multitude of nations attacking Mount Zion.
  reasoning_layer_used: Lexical decisions for הֲמוֹן, כָּל הַגּוֹיִם, הַצֹּבְאִים, and עַל
  rationale: Ordinary clause order retains the full scope and hostile military action without adding “great” or “from.”
interpretive_expansions:
- pob_phrase: his appetite craves
  rendering: still craving water
  claim: His desire for water continues after he wakes.
  evidence:
  - The immediate context identifies him as thirsty and dreaming of drinking.
  - The POB footnote says the Hebrew emphasizes continuing desire after waking.
  confidence: high
  alternatives_preserved:
  - his soul craves
  - his throat is parched
translation_notes:
  risk_flags:
  - risk: “Empty stomach” narrows נֶפֶשׁ to bodily hunger rather than its broader range of life or self.
    mitigation: The POB theological decision explicitly selects appetite in this hunger-and-thirst context.
