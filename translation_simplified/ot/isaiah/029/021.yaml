  preserved_meaning: A man is treated as guilty on the basis of a word or charge.
  reasoning_layer_used: lexical decision and legal context
  rationale: This gives the favored judicial sense without calling the accusation trivial or baseless.
- pob_phrase: lay a snare for the one who reproves in the gate
  simplified_phrase: set a trap for the one who brings correction in court
  preserved_meaning: Wrongdoers maliciously entrap someone who challenges them in a place of judgment.
  reasoning_layer_used: lexical decisions and cultural note
  rationale: “Set a trap” keeps the snare image, while “in court” explains the gate’s legal function.
- pob_phrase: turn aside the righteous with emptiness
  simplified_phrase: deny justice to the righteous on empty grounds
  preserved_meaning: The righteous person’s cause is rejected without a valid basis.
  reasoning_layer_used: lexical decisions and immediate legal context
  rationale: This clarifies the legal harm while preserving emptiness as an image of baseless grounds.
