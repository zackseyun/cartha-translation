translation:
  language: en
  text: those who declare a man guilty on the basis of an accusation,[a] set a trap for the one who brings correction in court, and deny justice to the righteous on empty grounds.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “cause a man to sin by a word,” though the legal setting favors the meaning in the text.
    reason: lexical_alternative
