  preserved_meaning: Jacob refers corporately to the covenant people, not merely one person.
  reasoning_layer_used: POB lexical decision for אֶל בֵּית יַעֲקֹב
  rationale: “People” makes the corporate sense of “house” immediately clear.
- pob_phrase: he who redeemed Abraham
