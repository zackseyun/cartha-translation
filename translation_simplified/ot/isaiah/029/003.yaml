translation:
  language: en
  text: I will camp all around you. I will besiege you with fortified positions and set up siege towers against you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may refer more broadly to siege structures, such as towers, ramps, or fortified barriers.
