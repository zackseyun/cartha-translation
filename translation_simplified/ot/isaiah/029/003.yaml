simplification_decisions:
- pob_phrase: encamp against you all around
  simplified_phrase: camp all around you
  preserved_meaning: God will surround the city in a hostile military encampment.
  reasoning_layer_used: Lexical decision for וְחָנִיתִי and כַדּוּר
  rationale: Common wording preserves both the military action and complete encirclement.
- pob_phrase: besiege you with siegeworks
  simplified_phrase: besiege you with fortified positions
  preserved_meaning: God will use fixed military emplacements in the siege.
  reasoning_layer_used: Lexical decision for מֻצָּב
  rationale: This replaces the opaque term “siegeworks” without choosing the less likely “garrison.”
- pob_phrase: raise up siege towers against you
  simplified_phrase: set up siege towers against you
  preserved_meaning: God directly establishes offensive siege structures against the city.
  reasoning_layer_used: Lexical and theological decisions for וַהֲקִימֹתִי and divine agency
  rationale: “Set up” is clearer while retaining God's direct action and the military image.
translation_notes:
  risk_flags:
