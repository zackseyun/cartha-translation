translation:
  language: en
  text: The vast forces of all the nations fighting against Ariel[a]—all who attack her and her stronghold[b] and press her hard—will be like a dream, like a vision in the night.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ariel is Isaiah’s poetic name for Jerusalem here.
    reason: cross_reference
  - marker: b
    text: Or “her fortress”; some understand the Hebrew as “the siegeworks against her.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the multitude of all the nations that wage war
  simplified_phrase: the vast forces of all the nations fighting
  preserved_meaning: A large body of foreign nations is engaged in warfare against Ariel.
  reasoning_layer_used: Lexical decisions for הֲמוֹן and צבא in their military context.
  rationale: “Vast forces” expresses the large hostile body more naturally than “multitude.”
- pob_phrase: even all who wage war against her and her stronghold
  simplified_phrase: all who attack her and her stronghold
  preserved_meaning: The same enemies assault both Ariel and her fortified place.
  reasoning_layer_used: Lexical decisions for צבא and מְצוֹדָה.
  rationale: “Attack” avoids repetitive formal wording while keeping the military force.
- pob_phrase: who distress her
  simplified_phrase: press her hard
  preserved_meaning: The attackers subject Ariel to severe hostile pressure.
  reasoning_layer_used: Lexical rationale for the Hiphil participle of צוּק/ציק.
  rationale: “Press her hard” clearly conveys active hostile pressure.
interpretive_expansions:
- pob_phrase: the multitude of all the nations
  rendering: the vast forces of all the nations
  claim: The multitude is a large military body rather than a general crowd.
  evidence:
  - The following participle describes these nations as waging war.
  - The POB lexical rationale identifies a military context.
  confidence: high
  alternatives_preserved:
  - the multitude of all the nations
  - the vast crowd from all the nations
