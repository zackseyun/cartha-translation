  preserved_meaning: The fire is vividly portrayed as flaming and destructive.
  reasoning_layer_used: Lexical decision on וְלַהַב אֵשׁ אוֹכֵלָה
  rationale: “Blaze” makes the flame image natural while preserving the consuming-fire imagery.
