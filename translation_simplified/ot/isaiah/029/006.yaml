translation:
  language: en
  text: Yahweh of hosts will visit you in judgment, with thunder, earthquake, and a loud noise, with whirlwind and storm, and with the blaze of a consuming fire.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Visit” is a biblical way of saying that God intervenes; here, the context shows that he comes in judgment.
    reason: lexical_alternative
