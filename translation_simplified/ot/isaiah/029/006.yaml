  preserved_meaning: The visitation comes from Yahweh and is an act of judgment against Jerusalem.
  reasoning_layer_used: Lexical and theological decisions on מֵעִם and תִּפָּקֵד
  rationale: The active wording is easier to follow while retaining the important biblical image of divine visitation.
- pob_phrase: and a great noise
  simplified_phrase: and a loud noise
  preserved_meaning: A powerful sound accompanies Yahweh’s visitation.
  reasoning_layer_used: Lexical decision on וְקוֹל גָּדוֹל
  rationale: “Loud noise” expresses the contextual sense in ordinary English without implying a spoken voice.
- pob_phrase: the flame of a consuming fire
