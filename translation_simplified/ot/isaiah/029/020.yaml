translation:
  language: en
  text: For the ruthless person will come to nothing. The arrogant mocker will be brought to an end, and everyone who watches for a chance to do wrong will be cut off.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the ruthless one
  simplified_phrase: the ruthless person
  preserved_meaning: A single violent or oppressive person is in view.
  reasoning_layer_used: POB lexical decision for עָרִיץ
  rationale: “Person” is more natural than the abstract-sounding “one” without narrowing the term to a political tyrant.
- pob_phrase: the scoffer will be finished
  simplified_phrase: the arrogant mocker will be brought to an end
  preserved_meaning: The contemptuous mocker will cease under judgment.
  reasoning_layer_used: POB lexical decisions for לֵץ and וְכָלָה
  rationale: This wording makes both the person's character and coming end immediately clear.
- pob_phrase: all who watch for wrongdoing
  simplified_phrase: everyone who watches for a chance to do wrong
  preserved_meaning: These people deliberately stay alert for opportunities to commit evil.
  reasoning_layer_used: POB lexical decisions for שֹׁקְדֵי and אָוֶן
  rationale: The recast phrase clarifies the deliberate vigilance expressed by the Hebrew participle.
interpretive_expansions:
