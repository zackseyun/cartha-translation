translation:
  language: en
  text: Everyone is put to shame[a] because of a people who can do them no good. They provide no help or benefit, but bring only shame and public disgrace.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word is difficult and can suggest becoming odious, but “put to shame” best fits the surrounding words about shame and disgrace.
    reason: lexical_alternative
