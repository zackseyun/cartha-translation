- pob_phrase: cannot profit them
  simplified_phrase: can do them no good
  preserved_meaning: The people are unable to provide any useful benefit.
  reasoning_layer_used: POB lexical decision for לֹא יוֹעִילוּ לָמוֹ
  rationale: Common wording makes their complete lack of usefulness immediately clear.
- pob_phrase: who are not for help and not for profit
  simplified_phrase: They provide no help or benefit
  preserved_meaning: The two distinct ideas of assistance and usefulness remain in parallel.
  reasoning_layer_used: POB lexical decisions for לְעֵזֶר and לְהוֹעִיל
  rationale: A direct verbal clause replaces the opaque nominal construction without merging its two ideas.
- pob_phrase: but for shame and also for reproach
  simplified_phrase: but bring only shame and public disgrace
  preserved_meaning: The alliance results in shame and humiliating reproach rather than help.
  reasoning_layer_used: POB lexical decisions for כִּי, לְבֹשֶׁת, and לְחֶרְפָּה
  rationale: “Public disgrace” communicates the social force of “reproach” in familiar English.
