translation:
  language: en
  text: You will treat as unclean the silver covering of your carved idols and the gold plating of your cast images. You will throw these coverings away like a menstrual cloth and say to them, “Get out!”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: defile the silver overlay
  simplified_phrase: treat as unclean the silver covering
  preserved_meaning: The valuable covering is rejected as unclean.
  reasoning_layer_used: POB translation and source image
  rationale: “Treat as unclean” states the force of “defile” in ordinary English.
- pob_phrase: scatter them like a menstrual cloth
  simplified_phrase: throw these coverings away like a menstrual cloth
  preserved_meaning: The silver and gold coverings are discarded as unclean and repulsive.
  reasoning_layer_used: POB translation, source syntax, and grounding review
  rationale: Naming “these coverings” removes pronoun ambiguity while preserving the stark comparison.
- pob_phrase: you will say to them, “Go out!”
  simplified_phrase: say to them, “Get out!”
  preserved_meaning: The rejected coverings are directly ordered away.
  reasoning_layer_used: Applied revision preserving the plural reference
  rationale: “Get out” is a natural modern command, and “them” retains the audited plural choice.
translation_notes:
