simplification_decisions:
- pob_phrase: Turn aside from the way; depart from the path
  simplified_phrase: Leave the way; turn off the path
  preserved_meaning: Both commands retain the image of abandoning a course or path.
  reasoning_layer_used: POB lexical decisions for סור, דרך, נטה, and ארח
  rationale: Natural movement language makes both parallel commands clear and forceful.
- pob_phrase: from before us
  simplified_phrase: from our presence
  preserved_meaning: The people demand that Israel’s God no longer be present before them.
  reasoning_layer_used: POB lexical decision for מִפָּנֵינוּ
  rationale: “From our presence” conveys the spatial-relational sense in ordinary English.
- pob_phrase: the Holy One of Israel
  simplified_phrase: the Holy One of Israel
  preserved_meaning: The fixed Isaianic title identifies Israel’s holy God.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Retaining the title preserves its theological force and covenantal identification.
translation_notes:
