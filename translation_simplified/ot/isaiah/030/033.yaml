translation:
  language: en
  text: For Topheth[a] was prepared long ago; it is ready for the king. It has been made deep and wide. Its burning pile has plenty of fire and wood. Yahweh’s breath, like a stream of sulfur, sets it ablaze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Topheth is a place-name associated with burning and judgment.
    reason: cultural_note
simplification_decisions:
- pob_phrase: has long been prepared
  simplified_phrase: was prepared long ago
  preserved_meaning: Topheth was made ready well beforehand.
  reasoning_layer_used: Lexical decision for מֵאֶתְמוּל
  rationale: The time idiom is stated directly in ordinary English.
- pob_phrase: He has made it deep and wide
  simplified_phrase: It has been made deep and wide
  preserved_meaning: The place was deliberately prepared with great depth and breadth.
  reasoning_layer_used: Lexical decision for הֶעְמִיק הִרְחִב
  rationale: The passive avoids an unclear pronoun without identifying the unstated agent.
- pob_phrase: with a pyre of fire and wood in abundance
  simplified_phrase: Its burning pile has plenty of fire and wood
  preserved_meaning: The prepared burning pile has abundant fire and fuel.
  reasoning_layer_used: Lexical decisions for מְדֻרָתָהּ and הַרְבֵּה
  rationale: “Burning pile” clarifies “pyre” without making it specifically a pit or adding a filling action.
translation_notes:
