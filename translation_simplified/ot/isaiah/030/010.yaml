translation:
  language: en
  text: They say to the seers, “Do not see visions,” and to the visionaries, “Do not show us visions of what is right.[a] Tell us smooth things that please us; show us illusions.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “what is straightforward” or “truthful things.” The Hebrew term refers to what is straight, upright, or correct.
    reason: lexical_alternative
  - marker: b
    text: Or “deceptions” or “delusions.”
    reason: lexical_alternative
