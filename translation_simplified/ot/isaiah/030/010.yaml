  preserved_meaning: The people demand that the seers stop receiving or reporting prophetic visions.
  reasoning_layer_used: Lexical decisions for רֹאִים and תִרְאוּ
  rationale: Adding “visions” makes the prophetic sense clear while preserving the see/seers wordplay.
- pob_phrase: Do not envision for us what is right
  simplified_phrase: Do not show us visions of what is right
  preserved_meaning: The people reject prophetic messages that are morally and factually upright.
