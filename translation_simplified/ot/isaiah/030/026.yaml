translation:
  language: en
  text: The moon will shine as brightly as the sun. The sun’s light will be seven times as bright, like the light of seven days. This will happen on the day when Yahweh bandages his people’s fractures and heals the wound caused by his blow.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also describe this as the bruise or crushing caused by his blow.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the light of the moon will be like the light of the sun
  simplified_phrase: The moon will shine as brightly as the sun
  preserved_meaning: The moon’s light is compared with the sun’s brightness.
  reasoning_layer_used: lexical decisions for light, moon, sun, and explicit comparison
  rationale: The active wording makes the comparison immediate without changing the image.
- pob_phrase: the light of the sun will be sevenfold
  simplified_phrase: The sun’s light will be seven times as bright
  preserved_meaning: The sun’s light will be multiplied sevenfold.
  reasoning_layer_used: lexical decision for שִׁבְעָתַיִם
  rationale: “Seven times as bright” expresses the multiplication in common English.
- pob_phrase: Yahweh binds up the fracture of his people
  simplified_phrase: Yahweh bandages his people’s fractures
  preserved_meaning: Yahweh restores his injured people through a medical image.
  reasoning_layer_used: lexical decisions for חֲבֹשׁ, שֶׁבֶר, and עַמּוֹ
  rationale: “Bandages” clarifies the healing action while preserving the injury metaphor.
translation_notes:
  risk_flags:
  - risk: The phrase “like the light of seven days” may suggest either combined or intensified light.
    mitigation: The wording retains POB’s deliberate ambiguity rather than choosing one explanation.
  - risk: Readers could miss that Yahweh both struck and heals his people.
    mitigation: “The wound caused by his blow” keeps God’s agency and the judgment-restoration tension explicit.
