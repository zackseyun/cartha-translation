translation:
  language: en
  text: The oxen and donkeys that work the soil will eat seasoned animal feed[a], winnowed with a shovel and fork.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “salted animal feed”; the Hebrew may refer more specifically to feed improved with salt or other seasoning.
    reason: lexical_alternative
  - marker: b
    text: The shovel and fork were farming tools used to toss the feed into the air while winnowing it.
    reason: cultural_note
