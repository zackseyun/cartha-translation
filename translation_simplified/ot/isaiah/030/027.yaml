translation:
  language: en
  text: Look! The name of Yahweh is coming from far away. His anger burns, and dense smoke rises.[a] His lips are full of wrath, and his tongue is like a fire that devours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew phrase is difficult and may more literally mean “heaviness of lifting up.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Look, the name of Yahweh comes from afar
  simplified_phrase: Look! The name of Yahweh is coming from far away.
  preserved_meaning: The vision urgently presents Yahweh’s manifested presence approaching from a distance.
  reasoning_layer_used: Lexical and theological decisions on הִנֵּה, שֵׁם יְהוָה, and בָּא מִמֶּרְחָק.
  rationale: A separate sentence and common wording clarify the scene while retaining “the name of Yahweh” as the subject.
- pob_phrase: burning with his anger, and with dense smoke
  simplified_phrase: His anger burns, and dense smoke rises.
  preserved_meaning: Yahweh approaches in fiery anger amid the difficult smoke or rising-mass image.
  reasoning_layer_used: Lexical decision on בֹּעֵר אַפּוֹ and וְכֹבֶד מַשָּׂאָה, with the POB footnote.
  rationale: Two direct clauses make the imagery easier to picture without removing the Hebrew uncertainty.
- pob_phrase: his tongue is like a consuming fire
  simplified_phrase: his tongue is like a fire that devours
  preserved_meaning: The image portrays Yahweh’s speech as actively destructive fire.
  reasoning_layer_used: Lexical decision on וּלְשׁוֹנוֹ כְּאֵשׁ אֹכָלֶת.
  rationale: The active verb “devours” makes the force of “consuming” immediately clear.
interpretive_expansions:
- pob_phrase: with dense smoke
  rendering: dense smoke rises
  claim: The smoke is pictured as rising in the fiery appearance.
  evidence:
  - The lexical rationale allows “lifting,” “uprising,” or a mass and specifically supports rising smoke.
  - The immediate context depicts burning anger and consuming fire.
  confidence: moderate
  alternatives_preserved:
  - heaviness of lifting up
