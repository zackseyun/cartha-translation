translation:
  language: en
  text: 'For this is what the Lord GOD, the Holy One of Israel, says: “You will be saved[b] when you turn back[a] and rest. You will be strong when you are quiet and trust me.” But you were not willing to do this.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Turning back may include repentance and returning to God.
    reason: lexical_alternative
  - marker: b
    text: Or “delivered.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: In returning and rest you will be saved
  simplified_phrase: You will be saved when you turn back and rest
  preserved_meaning: Deliverance comes through turning back and resting rather than pursuing self-reliant action.
  reasoning_layer_used: Lexical and theological decisions for בְּשׁוּבָה, וָנַחַת, and תִּוָּשֵׁעוּן
  rationale: The active phrase “turn back” keeps the Hebrew image while making the relationship between the actions and salvation clear.
- pob_phrase: in quietness and trust will be your strength
  simplified_phrase: You will be strong when you are quiet and trust me
  preserved_meaning: Judah’s true strength lies in calm reliance on God.
  reasoning_layer_used: Lexical decisions for בְּהַשְׁקֵט, בְּבִטְחָה, and גְּבוּרָה
  rationale: The clause is recast in ordinary English without merging quietness and trust.
- pob_phrase: But you were unwilling
  simplified_phrase: But you were not willing to do this
  preserved_meaning: The people rejected the course God offered.
  reasoning_layer_used: Lexical decision for וְלֹא אֲבִיתֶם
  rationale: “To do this” supplies the natural English object from the preceding commands.
interpretive_expansions:
- pob_phrase: trust
  rendering: trust me
  claim: The trust is directed toward God, who is speaking.
  evidence:
  - The Lord GOD is the speaker in the immediate sentence.
  - The POB rationale identifies reliance on God as the contextual sense.
  confidence: high
  alternatives_preserved:
  - trust
  - have confidence
translation_notes:
  risk_flags:
