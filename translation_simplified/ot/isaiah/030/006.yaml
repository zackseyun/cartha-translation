translation:
  language: en
  text: 'A prophetic message about the animals of the Negev:[a]


    People travel through a land of danger and hardship, with lionesses and lions,[b] vipers, and flying fiery serpents. They carry their wealth on the shoulders of donkeys and their treasures on the humps of camels, to a people who cannot benefit them.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Negev is the southern region; the Hebrew may also be translated “the animals of the South.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew uses two different words for lions, but their exact distinction here is uncertain.
    reason: lexical_alternative
  - marker: c
    text: Or “a people who will not help them.”
    reason: lexical_alternative
