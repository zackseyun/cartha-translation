  text: It will be broken like a potter’s jar, smashed without pity. It will shatter so completely that not one piece will remain that can carry burning coals from the hearth[a] or scoop water from a cistern.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “take fire from the burning place”; this likely means carrying coals or embers from a hearth.
    reason: lexical_alternative
  - marker: b
    text: Or “from a pool”; the word can mean a gathered body of water, but “cistern” best fits this setting.
    reason: lexical_alternative
