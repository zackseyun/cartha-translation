translation:
  language: en
  text: Therefore, this sin will be like a crack in a high wall that is bulging outward and beginning to fall. It will suddenly break apart—in an instant.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: this iniquity
  simplified_phrase: this sin
  preserved_meaning: The people's wrongdoing remains the cause of the coming disaster.
  reasoning_layer_used: POB base text
  rationale: “Sin” gives the moral meaning of “iniquity” in familiar English.
- pob_phrase: like a falling breach, bulging out in a high wall
  simplified_phrase: like a crack in a high wall that is bulging outward and beginning to fall
  preserved_meaning: The wall has a visible weakness that is giving way but has not yet fully collapsed.
  reasoning_layer_used: POB base text, applied revision, and grounding review
  rationale: “Crack” avoids implying completed destruction, while “beginning to fall” preserves the adjudicated image.
- pob_phrase: whose breaking comes suddenly, in an instant
  simplified_phrase: It will suddenly break apart—in an instant
  preserved_meaning: The unstable wall's final destruction comes abruptly and very quickly.
  reasoning_layer_used: POB base text
  rationale: A separate sentence clearly preserves the progression from instability to sudden destruction.
translation_notes:
  risk_flags:
  - risk: “Crack” may sound smaller than the Hebrew wall defect.
    mitigation: The bulging and beginning-to-fall language shows that the weakness threatens the whole wall.
