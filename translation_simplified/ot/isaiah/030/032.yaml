translation:
  language: en
  text: Every blow from the rod Yahweh appointed for punishment and lays on him will be accompanied by tambourines and lyres.[a] Yahweh will fight against them in battles with sweeping movements.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “every passing of the appointed rod.” The Hebrew phrase is difficult; “blow” understands each passing as a strike.
    reason: lexical_alternative
  - marker: b
    text: Or “Yahweh will fight against it” or “against him.” The Hebrew pronoun is singular, but its referent is uncertain.
    reason: alternative_reading
