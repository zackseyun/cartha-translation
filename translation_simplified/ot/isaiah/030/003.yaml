translation:
  language: en
  text: Then trusting Pharaoh as your stronghold will bring you shame. Taking refuge in Egypt’s shadow will bring you humiliation.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Egypt’s “shadow” is an image of the protection Egypt was expected to provide.
    reason: cultural_note
