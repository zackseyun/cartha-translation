  preserved_meaning: Pharaoh’s promised strength and protection will result in shame.
  reasoning_layer_used: Lexical decisions for מָעוֹז and וְהָיָה
  rationale: The rewrite preserves the stronghold image while making the act of misplaced trust clear.
- pob_phrase: and refuge in Egypt’s shadow your humiliation
