translation:
  language: en
  text: For Assyria will be shattered at the sound of Yahweh’s voice.[a] Yahweh will strike it with a rod.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “will be terrified” or “will collapse”; the Hebrew word can include fear, breaking, and defeat.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew does not name the subject of “will strike”; Yahweh is the most natural meaning in context.
    reason: alternative_reading
