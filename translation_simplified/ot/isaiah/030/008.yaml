translation:
  language: en
  text: Come now. Write this message on a tablet in front of them, and record it in a scroll. Then it will remain for a later day,[a] as a witness[b] forever and ever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “for the latter day” or “for the last day.”
    reason: alternative_reading
  - marker: b
    text: Or “forever”; the Hebrew may emphasize the written record as enduring testimony.
    reason: lexical_alternative
