translation:
  language: en
  text: “Woe to the rebellious children!” declares Yahweh. “They carry out plans that do not come from me. They pour out a drink offering[a], but not by my Spirit. So they add sin to sin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “weave a covering”; in this context, some understand the phrase more broadly as “make an alliance.” The pointed Hebrew most naturally reads “pour out a drink offering.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: who carry out a plan, but not from me
  simplified_phrase: They carry out plans that do not come from me.
  preserved_meaning: Their plans do not originate with Yahweh.
  reasoning_layer_used: POB lexical decision for לַעֲשׂוֹת עֵצָה and וְלֹא מִנִּי
  rationale: A direct sentence makes the source and rejection of the plans easier to follow.
- pob_phrase: pour out a libation
  simplified_phrase: pour out a drink offering
  preserved_meaning: They perform the poured ritual act retained from the Masoretic reading.
  reasoning_layer_used: POB lexical and theological decisions for וְלִנְסֹךְ מַסֵּכָה
  rationale: “Drink offering” explains the unfamiliar term “libation” without removing the ritual image.
- pob_phrase: so as to add sin to sin
  simplified_phrase: So they add sin to sin.
  preserved_meaning: Their actions increase their cumulative guilt.
  reasoning_layer_used: POB lexical decisions for לְמַעַן סְפוֹת and חַטָּאת עַל חַטָּאת
  rationale: The shorter sentence preserves the repeated image of accumulating sin.
translation_notes:
  risk_flags:
  - risk: The drink-offering phrase has important alternative interpretations tied to alliance-making.
    mitigation: The main text retains the POB’s Masoretic reading, while the footnote preserves the ambiguity.
