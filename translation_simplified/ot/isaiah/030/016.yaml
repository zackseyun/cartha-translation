translation:
  language: en
  text: But you said, “No! We will flee on horses.” So you will indeed flee. You also said, “We will ride on fast horses.” So those chasing you will be fast too.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: No, for we will flee on horses
  simplified_phrase: No! We will flee on horses.
  preserved_meaning: The people emphatically reject God’s warning and choose mounted flight.
  reasoning_layer_used: POB lexical decisions for לֹא כִּי and עַל סוּס
  rationale: Two short sentences express the force more naturally than the formal connective “for.”
- pob_phrase: therefore you will flee
  simplified_phrase: So you will indeed flee.
  preserved_meaning: Their proposed escape becomes their fate in a judicial reversal.
  reasoning_layer_used: POB lexical decision for עַל כֵּן and תְּנוּסוּן
  rationale: “So” is common English, while “indeed” preserves the emphatic prophetic irony.
- pob_phrase: your pursuers will be swift
  simplified_phrase: those chasing you will be fast too
  preserved_meaning: The enemy pursuing them will match or exceed the speed they trust in.
  reasoning_layer_used: POB lexical decisions for יִקַּלּוּ and רֹדְפֵיכֶם
  rationale: The active phrase is immediately understandable and “too” makes the parallel clear.
