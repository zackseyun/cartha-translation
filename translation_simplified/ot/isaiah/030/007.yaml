translation:
  language: en
  text: Egypt’s help is completely useless. So I call her “Rahab[a] Who Sits Still.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rahab is a poetic name for Egypt that can also suggest pride or boasting.
    reason: lexical_alternative
  - marker: b
    text: The compressed Hebrew may also mean “Rahab—they sit still” or “the boaster who does nothing.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: For Egypt’s help is utterly empty and worthless
  simplified_phrase: Egypt’s help is completely useless
  preserved_meaning: Egypt’s promised aid has no value and will accomplish nothing.
  reasoning_layer_used: Lexical decisions for הֶבֶל, וָרִיק, and יַעְזֹרוּ
  rationale: “Completely useless” states the combined force of “empty and worthless” in direct common English.
- pob_phrase: therefore
  simplified_phrase: So
  preserved_meaning: The taunting name follows as a conclusion from Egypt’s uselessness.
  reasoning_layer_used: Lexical decision for לָכֵן
  rationale: “So” keeps the logical connection in more natural modern English.
- pob_phrase: Rahab Who Sits Still
  simplified_phrase: Rahab Who Sits Still
  preserved_meaning: The poetic title mocks proud Egypt for failing to act.
  reasoning_layer_used: Lexical and theological decisions for רַהַב הֵם שָׁבֶת
  rationale: The vivid taunt-name is retained because replacing it would weaken its image and ambiguity.
translation_notes:
  risk_flags:
