translation:
  language: en
  text: At that time, a gift will be brought from a people who are tall and smooth-skinned. They are feared far and wide, a nation marked by command after command and by trampling, and their land is divided by rivers. The gift will be brought to the LORD of Armies at Mount Zion, the place that bears his name.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: from a people tall and smooth-skinned, from a people feared far and wide
  simplified_phrase: from a people who are tall and smooth-skinned. They are feared far and wide
  preserved_meaning: The same people are described by their appearance and widespread fearsome reputation.
  reasoning_layer_used: POB base text
  rationale: Two shorter sentences make the repeated description easier to follow.
- pob_phrase: a nation of command upon command and trampling
  simplified_phrase: a nation marked by command after command and by trampling
  preserved_meaning: The unusual repeated-command wording and the forceful trampling image both remain distinct.
  reasoning_layer_used: source-language image preserved through POB wording
  rationale: The recast grammar is clearer without resolving the difficult phrase beyond the POB.
- pob_phrase: to the place of the name of the LORD of Armies, Mount Zion
  simplified_phrase: to the LORD of Armies at Mount Zion, the place that bears his name
  preserved_meaning: Mount Zion is the named destination and is specially associated with the LORD of Armies.
  reasoning_layer_used: POB base text and applied doctrine-realignment revision
  rationale: The destination is stated directly while the biblical language about God's name is retained.
translation_notes:
  risk_flags:
  - risk: “Command after command” remains difficult because the POB preserves an unusual expression.
    mitigation: The wording stays deliberately close enough to avoid imposing an unsupported interpretation.
  - risk: “The place that bears his name” may sound less concrete than ordinary location language.
    mitigation: Mount Zion is named directly, preserving both the location and the theological force of the name.
