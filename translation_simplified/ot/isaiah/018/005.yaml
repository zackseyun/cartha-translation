translation:
  language: en
  text: For before the harvest, when the blossoms have finished flowering and the flowers are becoming ripening grapes, he will cut off the shoots with pruning knives. He will remove and cut off the spreading branches.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew words for the vine growth are rare and may also mean sprigs, tendrils, or trailing branches.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: when the blossom is finished
  simplified_phrase: when the blossoms have finished flowering
  preserved_meaning: The flowering stage reaches completion before harvest.
  reasoning_layer_used: Lexical decision for כְּתָם פֶּרַח
  rationale: This clearly marks the completed growth stage without implying that every blossom has disappeared.
- pob_phrase: the flower becomes a ripening grape
  simplified_phrase: the flowers are becoming ripening grapes
  preserved_meaning: The vine is moving from blossom to developing fruit.
  reasoning_layer_used: Lexical decision for וּבֹסֶר גֹּמֵל יִהְיֶה נִצָּה
  rationale: The progressive wording makes the agricultural sequence easy to follow.
- pob_phrase: he will remove and lop off the spreading branches
  simplified_phrase: He will remove and cut off the spreading branches
  preserved_meaning: Both emphatic actions of removing and cutting away the vine growth remain present.
  reasoning_layer_used: Lexical decisions for הַנְּטִישׁוֹת and הֵסִיר הֵתַז
  rationale: A separate sentence and familiar pruning verb preserve both actions without awkward repetition.
