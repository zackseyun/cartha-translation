translation:
  language: en
  text: They will all be left exposed to the birds of prey of the mountains and to the wild animals. The birds of prey will remain on them through the summer, and every wild animal will remain on them through the winter.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: left to the birds of prey of the mountains and to the beasts of the earth
  simplified_phrase: left exposed to the birds of prey of the mountains and to the wild animals
  preserved_meaning: The slain are abandoned where mountain scavenger birds and land animals can reach them.
  reasoning_layer_used: Lexical decisions for יֵעָזְבוּ, לְעֵיט, הָרִים, and וּלְבֶהֱמַת הָאָרֶץ
  rationale: “Exposed” clarifies the scene, while “of the mountains” preserves the geographic association.
- pob_phrase: the birds of prey will summer on them
  simplified_phrase: The birds of prey will remain on them through the summer
  preserved_meaning: The birds stay with the abandoned bodies during the summer.
  reasoning_layer_used: Lexical decisions for וְקָץ, הָעַיִט, and עָלָיו
  rationale: This explains the uncommon verb “summer” without asserting continuous feeding.
- pob_phrase: every beast of the earth will winter on them
  simplified_phrase: every wild animal will remain on them through the winter
  preserved_meaning: Each wild land animal may stay with the bodies during the winter.
  reasoning_layer_used: Lexical decisions for תֶּחֱרָף, בֶּהֱמַת הָאָרֶץ, and עָלָיו
  rationale: This preserves the distributive “every” and makes “winter” immediately clear.
interpretive_expansions:
- pob_phrase: will all be left
  rendering: will all be left exposed
  claim: The slain are abandoned without burial or protection from scavengers.
  evidence:
