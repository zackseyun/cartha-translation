translation:
  language: en
  text: You send envoys by sea in papyrus boats across the surface of the water. Go, swift messengers, to a nation of tall, smooth-skinned people, a people feared far and wide—a mighty nation that tramples down, whose land is divided by rivers.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally describes the nation as “stretched out and polished”; it likely refers to the people's appearance.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew expression translated “mighty” is obscure; it may read “a nation of line upon line” or something similar.
    reason: lexical_alternative
  - marker: c
    text: Or “whose land rivers plunder.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: sending envoys by sea, in papyrus vessels over the surface of the waters
  simplified_phrase: You send envoys by sea in papyrus boats across the surface of the water
  preserved_meaning: The addressed land sends diplomatic messengers by water in boats made from papyrus.
  reasoning_layer_used: POB lexical decisions and immediate context
  rationale: Direct address and the common word “boats” make the description easier to follow.
- pob_phrase: to a nation tall and smooth-skinned
  simplified_phrase: to a nation of tall, smooth-skinned people
  preserved_meaning: The difficult Hebrew phrase likely describes the people's physical appearance.
  reasoning_layer_used: POB lexical decision for גּוֹי מְמֻשָּׁךְ וּמוֹרָט
  rationale: Adding “people” makes clear that the description applies to the inhabitants.
- pob_phrase: a nation mighty and trampling down, whose land the rivers divide
  simplified_phrase: a mighty nation that tramples down, whose land is divided by rivers
  preserved_meaning: The nation is powerful and actively tramples down, while rivers cut through its territory.
  reasoning_layer_used: POB lexical decisions for קַו קָו, וּמְבוּסָה, and בָּזְאוּ
  rationale: A relative clause clarifies the active sense without supplying an unstated object.
