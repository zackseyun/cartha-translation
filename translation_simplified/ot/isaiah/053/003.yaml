translation:
  language: en
  text: He was despised and abandoned by men,[a] a man who knew many pains and was familiar with sickness.[b] Like someone people hide their faces from, he was despised, and we did not value him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “rejected by men.”
    reason: alternative_reading
  - marker: b
    text: Traditionally, “a man of sorrows, and acquainted with grief.”
