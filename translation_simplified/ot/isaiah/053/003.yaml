  preserved_meaning: He was left socially isolated by other people.
  reasoning_layer_used: POB lexical decision for חֲדַל אִישִׁים
  rationale: “Abandoned” expresses social desertion in familiar modern English.
- pob_phrase: a man of pains and acquainted with sickness
  simplified_phrase: a man who knew many pains and was familiar with sickness
  preserved_meaning: His suffering was varied and concrete, and sickness was a familiar reality to him.
  reasoning_layer_used: POB lexical and theological decisions for מַכְאֹבוֹת and חֹלִי
  rationale: The wording remains natural while preserving plural pains and concrete sickness.
- pob_phrase: like one from whom people hide their faces ... we did not esteem him
