  preserved_meaning: People turned away from him in contempt and considered him to have no worth.
  reasoning_layer_used: POB lexical decisions for the elliptical face-hiding clause and חָשַׁב
  rationale: The recast syntax preserves both the physical image and the evaluative confession.
