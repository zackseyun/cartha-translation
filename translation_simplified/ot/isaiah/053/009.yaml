translation:
  language: en
  text: They designated his burial place among the wicked and with a rich man in his deaths.[a][b] Yet he had committed no violence, and no deceit was in his mouth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “in his deaths”; many translations understand this as “in his death” or “at his death.”
    reason: lexical_alternative
  - marker: b
    text: The subject of “designated” is not stated; this could also be translated, “His burial place was designated.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: they assigned his grave
  simplified_phrase: They designated his burial place
  preserved_meaning: Someone appointed where he would be buried without identifying who did so.
  reasoning_layer_used: lexical decision for וַיִּתֵּן and קִבְרוֹ; theological decision on the unstated subject
  rationale: “Designated his burial place” states the burial arrangement in clear modern English while retaining the impersonal “they.”
- pob_phrase: with the wicked
  simplified_phrase: among the wicked
  preserved_meaning: His intended burial associated him with wicked people.
  reasoning_layer_used: lexical decision for רְשָׁעִים
  rationale: “Among” makes the group relationship more natural without weakening the moral category.
- pob_phrase: although he had done no violence
  simplified_phrase: Yet he had committed no violence
  preserved_meaning: His shameful burial treatment contrasted with his innocence of violence.
  reasoning_layer_used: lexical decisions for עַל and חָמָס
  rationale: A new sentence beginning with “Yet” makes the contrast easier to follow.
translation_notes:
  risk_flags:
