translation:
  language: en
  text: He was oppressed and made to suffer,[a] but he did not open his mouth. He was like a lamb being led to slaughter, like a female sheep that is silent while its wool is cut off. In the same way, he did not open his mouth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult Hebrew may also mean, “He was oppressed, but he humbled himself.”
    reason: alternative_reading
