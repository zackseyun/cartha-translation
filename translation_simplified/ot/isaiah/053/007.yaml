- pob_phrase: he was afflicted
  simplified_phrase: made to suffer
  preserved_meaning: He endured affliction and harsh treatment.
  reasoning_layer_used: POB lexical decision for נַעֲנֶה
  rationale: The common phrase “made to suffer” preserves the passive suffering emphasized in context.
- pob_phrase: like a ewe silent before her shearers
  simplified_phrase: like a female sheep that is silent while its wool is cut off
  preserved_meaning: The female sheep remains quiet while others shear her.
  reasoning_layer_used: POB lexical decisions for רָחֵל, גֹזְזֶיהָ, and נֶאֱלָמָה
  rationale: The wording explains “ewe” and “shearers” while preserving the Hebrew image and feminine specificity.
- pob_phrase: so he did not open his mouth
  simplified_phrase: In the same way, he did not open his mouth
  preserved_meaning: The servant's silence fulfills the comparison and is repeated for emphasis.
  reasoning_layer_used: POB lexical and rhetorical decision for the repeated clause
  rationale: A separate sentence makes the comparison clear without weakening the deliberate repetition.
