translation:
  language: en
  text: But he was pierced[a] because of our rebellion; he was crushed because of our sins. The punishment that brought us peace[b] was upon him, and by his wound[c] we are healed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “wounded.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word for “peace” (shalom) also means “wholeness” or “well-being.”
    reason: lexical_alternative
  - marker: c
    text: Or “stripe” or “bruise.” The Hebrew noun is singular.
    reason: lexical_alternative
