translation:
  language: en
  text: Therefore, I will give him a share among the many,[a] and he will divide the plunder with the strong. I will do this because he poured out his life, giving himself over to death, and was counted among transgressors.[b] Yet he bore the sin of many and intercedes for transgressors.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I will allot him a portion among the many.” The compact Hebrew allows more than one closely related wording.
    reason: alternative_reading
  - marker: b
    text: Transgressors are people who rebel and violate what is right.
    reason: simplification_note
simplification_decisions:
- pob_phrase: I will allot him a portion among the many
  simplified_phrase: I will give him a share among the many
  preserved_meaning: God assigns the servant a victor’s share without defining “many” more narrowly or broadly.
  reasoning_layer_used: lexical decision and theological decision on “many”
  rationale: “Give him a share” expresses the difficult apportioning image in common English.
- pob_phrase: because he poured out his life to death and was numbered with transgressors
  simplified_phrase: I will do this because he poured out his life, giving himself over to death, and was counted among transgressors
  preserved_meaning: The servant’s willing death and identification with transgressors are the grounds for his exaltation.
  reasoning_layer_used: lexical decisions and immediate clause structure
  rationale: A new sentence and ordinary clause order make the causal relationship clear.
- pob_phrase: was numbered with transgressors
  simplified_phrase: was counted among transgressors
  preserved_meaning: He was regarded as belonging among rebellious offenders.
  reasoning_layer_used: documented lexical alternative
  rationale: “Counted among” is more familiar than “numbered with” while preserving the passive judgment.
interpretive_expansions:
- pob_phrase: he poured out his life to death
  rendering: he poured out his life, giving himself over to death
  claim: The pouring image means that he surrendered his own life to death.
  evidence:
  - The lexical rationale identifies his life or self as being given over.
  - The active verb and destination “to death” support willing self-surrender.
  confidence: high
  alternatives_preserved:
  - he poured out his life to death
  - he exposed his life to death
translation_notes:
  risk_flags:
  - risk: “Give him a share among the many” may sound more definite than the compact Hebrew syntax.
    mitigation: Footnote [a] preserves the POB wording and notes the closely related ambiguity.
