translation:
  language: en
  text: Like sheep, all of us have wandered away. Each of us has gone his own way. And Yahweh has laid all our wrongdoing[a] on him.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word may also mean guilt or the consequences of guilt.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also be rendered, “Yahweh caused all our wrongdoing to fall on him” or “to meet on him.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: All of us, like sheep, have gone astray
  simplified_phrase: Like sheep, all of us have wandered away
  preserved_meaning: Everyone is pictured as sheep wandering from the proper way.
  reasoning_layer_used: Lexical decisions for כֻּלָּנוּ, כַּצֹּאן, and תָּעִינוּ
  rationale: The wording keeps the sheep image and universal scope in immediately clear English.
- pob_phrase: each of us has turned to his own way
  simplified_phrase: Each of us has gone his own way
  preserved_meaning: Every person has individually followed his own direction.
  reasoning_layer_used: Lexical and theological decisions for אִישׁ and לְדַרְכּוֹ
  rationale: This common expression preserves the individual and self-directed turning.
- pob_phrase: Yahweh has laid on him the iniquity of us all
  simplified_phrase: Yahweh has laid all our wrongdoing on him
  preserved_meaning: Yahweh placed the moral wrong belonging to everyone on the servant without defining the exact mechanics.
  reasoning_layer_used: Lexical and theological decisions for הִפְגִּיעַ בּוֹ and עֲוֹן
  rationale: “Wrongdoing” is clearer than “iniquity,” while the footnote preserves the Hebrew word’s wider range.
translation_notes:
  risk_flags:
  - risk: “Wrongdoing” may understate the possible senses of guilt or its consequences.
    mitigation: Footnote a preserves those documented alternatives.
  - risk: “His own way” could be mistaken as applying only to men.
    mitigation: “All of us” and “each of us” make the universal scope clear.
