translation:
  language: en
  text: Yet Yahweh was pleased to crush him and make him sick. If his life is made a guilt offering,[a] he will see offspring and live for many days. Yahweh’s purpose will succeed through him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A guilt offering was a sacrifice required to deal with guilt and make reparation. The Hebrew wording is difficult and may also mean, “If his life makes a guilt offering,” or, “If you make his life a guilt offering.”
    reason: alternative_reading
