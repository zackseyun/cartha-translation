  preserved_meaning: God's new work is already emerging like a plant.
  reasoning_layer_used: Lexical decisions for עַתָּה תִצְמָח
  rationale: Natural clause order preserves both the growth image and its immediacy.
- pob_phrase: do you not perceive it?
