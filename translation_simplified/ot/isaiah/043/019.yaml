  preserved_meaning: God is actively bringing about a fresh work.
  reasoning_layer_used: Lexical decisions for עֹשֶׂה חֲדָשָׁה
  rationale: The common expression preserves God's present initiative without narrowing its fulfillment.
- pob_phrase: now it springs up
