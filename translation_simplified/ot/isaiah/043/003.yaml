translation:
  language: en
  text: For I am Yahweh, your God. I am the Holy One of Israel, your Savior. I have given Egypt to pay your ransom. I have given Cush[a] and Seba in exchange for you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cush was an ancient region south of Egypt, often associated with Nubia or Ethiopia.
    reason: cultural_note
simplification_decisions:
- pob_phrase: For I am Yahweh your God, the Holy One of Israel, your Savior
  simplified_phrase: For I am Yahweh, your God. I am the Holy One of Israel, your Savior.
  preserved_meaning: Yahweh identifies himself as Israel’s God, Holy One, and Savior.
  reasoning_layer_used: POB lexical decisions for the divine name and divine titles
  rationale: Two sentences make the titles easier to follow without weakening them.
- pob_phrase: I have given Egypt as your ransom
  simplified_phrase: I have given Egypt to pay your ransom.
  preserved_meaning: Egypt is the compensatory price given for Israel’s preservation.
  reasoning_layer_used: POB lexical and theological decisions on כָפְרְךָ
  rationale: The active wording explains the ransom image while keeping its exchange force.
- pob_phrase: Cush and Seba in exchange for you
  simplified_phrase: I have given Cush and Seba in exchange for you.
  preserved_meaning: Cush and Seba are also given in Israel’s place.
  reasoning_layer_used: POB lexical decision on תַּחְתֶּיךָ
  rationale: Repeating the verb turns the compressed clause into a complete, clear sentence.
