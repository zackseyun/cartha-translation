translation:
  language: en
  text: “You are my witnesses,” declares Yahweh. “You are also my servant,[a] the one I have chosen. I chose you so that you may know, believe me,[b] and understand that I am he.[c] No god was formed before me, and there will be no god after me.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “servant” refers collectively to Israel or Jacob, though the Hebrew title is singular.
    reason: source_note
  - marker: b
    text: Or “trust me” or “believe in me.”
    reason: lexical_alternative
  - marker: c
    text: Or “I am the one”; Hebrew uses a compact formula of divine self-identification.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: You are my witnesses, declares Yahweh, and my servant whom I have chosen
  simplified_phrase: “You are my witnesses,” declares Yahweh. “You are also my servant, the one I have chosen.”
  preserved_meaning: The people are both Yahweh’s witnesses and his chosen servant.
  reasoning_layer_used: POB syntax and theological decision on the servant
  rationale: Two sentences clarify the paired roles while retaining the singular title.
- pob_phrase: so that you may know and believe me and understand
  simplified_phrase: I chose you so that you may know, believe me, and understand
  preserved_meaning: Yahweh chose them for knowledge, belief, and understanding.
  reasoning_layer_used: POB lexical decisions for purpose and the three verbs
  rationale: Ordinary clause order preserves all three distinct ideas without adding an object to “know.”
- pob_phrase: and after me there will be none
  simplified_phrase: and there will be no god after me
  preserved_meaning: No deity will exist after Yahweh.
  reasoning_layer_used: POB lexical decision and footnote on the Hebrew ellipsis
  rationale: Supplying “god” makes the implied category immediately clear.
