simplification_decisions:
- pob_phrase: thus says Yahweh, he who created you, Jacob, and he who formed you, Israel
  simplified_phrase: 'this is what Yahweh says: “Jacob, I created you. Israel, I formed you.”'
  preserved_meaning: Yahweh both created and carefully formed his covenant people, addressed as Jacob and Israel.
  reasoning_layer_used: POB lexical decisions for ברא, יצר, and the paired covenant names
  rationale: The dense prophetic introduction becomes direct speech while keeping both distinct acts and both names.
- pob_phrase: Do not fear
