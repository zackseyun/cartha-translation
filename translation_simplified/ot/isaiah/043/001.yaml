  preserved_meaning: Yahweh commands his people not to fear.
  reasoning_layer_used: POB lexical decision for אַל תִּירָא
  rationale: The common expression is immediately clear while retaining the command’s solemn force.
- pob_phrase: for I have redeemed you; I have called you by name; you are mine
  simplified_phrase: because I have redeemed you. I have called you by name. You are mine.
  preserved_meaning: Yahweh grounds the command in redemption, personal calling, and covenant possession.
  reasoning_layer_used: POB lexical and theological decisions for גאל and לִי אָתָּה
  rationale: Three short sentences preserve each theological claim without burying them in a long clause.
