translation:
  language: en
  text: Do not be afraid, because I am with you. I will bring your offspring[a] from the east and gather you[b] from the west.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “descendants.” The Hebrew uses a collective singular.
    reason: lexical_alternative
  - marker: b
    text: Here “you” refers to Israel as one people.
    reason: cultural_note
