translation:
  language: en
  text: 'This is what Yahweh, your Redeemer, the Holy One of Israel, says: “For your sake I have sent to Babylon.[a] I have brought them all down as fugitives[b]—even the Babylonians themselves, in the ships of their rejoicing.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “sent to Babylon” without stating whom or what God sent; it may also mean “sent against Babylon.”
    reason: alternative_reading
  - marker: b
    text: The Hebrew word translated “fugitives” is difficult and may instead mean “bars,” or less likely, “nobles.”
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew: “the Chaldeans,” the people of Babylon.'
    reason: cultural_note
