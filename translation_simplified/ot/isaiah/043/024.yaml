translation:
  language: en
  text: You did not use your silver to buy me sweet cane[a], or satisfy me with the fat from your sacrifices. Instead, you burdened me with your sins[b] and made me weary with your iniquities.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sweet cane was a costly, fragrant cane, also called calamus or aromatic cane.
    reason: cultural_note
  - marker: b
    text: Literally, “you made me serve with your sins.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: buy me sweet cane with silver
  simplified_phrase: use your silver to buy me sweet cane
  preserved_meaning: Israel did not spend silver to obtain the fragrant cane for God.
  reasoning_layer_used: Lexical decisions for קָנִיתָ, קָנֶה, and בַכֶּסֶף
  rationale: The reordered clause uses ordinary English while retaining the concrete silver and sweet cane.
- pob_phrase: the fat of your sacrifices
  simplified_phrase: the fat from your sacrifices
  preserved_meaning: The sacrificial fat portions that were offered to God remain explicit.
  reasoning_layer_used: Lexical decision for חֵלֶב זְבָחֶיךָ
  rationale: “From” makes the relationship clearer without weakening the sacrificial image.
- pob_phrase: you wearied me
  simplified_phrase: made me weary
  preserved_meaning: Israel’s iniquities are portrayed as causing God weariness.
  reasoning_layer_used: Lexical decision for הוֹגַעְתַּנִי and theological decision on anthropomorphism
  rationale: The common verbal form preserves the source text’s force and theological tension.
translation_notes:
