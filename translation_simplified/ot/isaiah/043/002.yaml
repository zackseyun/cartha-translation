translation:
  language: en
  text: When you go through the waters, I am with you. When you cross rivers, they will not sweep over you.[a] When you walk through fire, you will not be scorched,[b] and the flame will not burn you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “overwhelm you.” The Hebrew can describe floodwaters sweeping over someone or carrying them away.
    reason: lexical_alternative
  - marker: b
    text: Or “burned.” The Hebrew uses a different word in the next phrase, “the flame will not burn you.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: When you pass through the waters
  simplified_phrase: When you go through the waters
  preserved_meaning: The person moves through threatening waters rather than avoiding them.
  reasoning_layer_used: Lexical decision for תַעֲבֹר and theological decision on concrete danger imagery
  rationale: “Go through” is more immediate common English while keeping the movement and water image.
- pob_phrase: and through the rivers, they will not sweep over you
  simplified_phrase: When you cross rivers, they will not sweep over you
  preserved_meaning: The rivers remain dangerous, but they will not flood over the person.
  reasoning_layer_used: Lexical decisions for וּבַנְּהָרוֹת and לֹא יִשְׁטְפוּךָ
  rationale: A separate sentence makes the parallel promise easier to follow without weakening the flood image.
- pob_phrase: When you walk through fire, you will not be scorched, and the flame will not burn you
  simplified_phrase: When you walk through fire, you will not be scorched, and the flame will not burn you
  preserved_meaning: The two distinct Hebrew expressions for injury by fire remain separate.
  reasoning_layer_used: Lexical decisions for תִכָּוֶה and תִבְעַר בָּךְ
  rationale: The wording is already clear, and retaining both verbs preserves the poetic twofold expression.
translation_notes:
  risk_flags:
  - risk: Readers may treat the imagery as a universal promise that believers will never suffer physical harm.
    mitigation: The main text preserves the poetic images without adding a claim of complete invulnerability.
  - risk: “Sweep over” may be understood less broadly than the Hebrew flood verb.
    mitigation: Footnote a preserves the supported alternative “overwhelm.”
