translation:
  language: en
  text: So I treated the leaders of the sanctuary as no longer sacred. I handed Jacob over to destruction[a] and made Israel a target of insults.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “placed Jacob under the ban,” meaning devoted him to destruction in divine judgment.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: profaned the princes of the sanctuary
  simplified_phrase: treated the leaders of the sanctuary as no longer sacred
  preserved_meaning: God removed these sacred leaders from their holy standing rather than merely dishonoring them.
  reasoning_layer_used: lexical and theological decisions on וָאֲחַלֵּל and שָׂרֵי קֹדֶשׁ
  rationale: This explains the sacred force of “profaned” and uses the clearer word “leaders.”
- pob_phrase: I gave Jacob over to destruction
  simplified_phrase: I handed Jacob over to destruction
  preserved_meaning: God subjected his covenant people to severe divine judgment.
  reasoning_layer_used: lexical and theological decisions on וְאֶתְּנָה and לַחֵרֶם
  rationale: “Handed over” makes the judgment sense of “gave” immediately clear.
- pob_phrase: Israel to reviling
  simplified_phrase: made Israel a target of insults
  preserved_meaning: Israel became the object of abusive speech and public shame.
  reasoning_layer_used: lexical decision on לְגִדּוּפִים
  rationale: The recast clause states naturally who receives the insults.
interpretive_expansions:
- pob_phrase: profaned
  rendering: treated ... as no longer sacred
  claim: The judgment concerns the leaders’ sacred standing, not only their reputation.
  evidence:
  - The piel of חלל carries the force of treating something as profane or desecrating it.
  - The phrase “leaders of the sanctuary” locates them in the sacred sphere.
  confidence: high
  alternatives_preserved:
  - defiled
  - desecrated
translation_notes:
  risk_flags:
  - risk: “Leaders of the sanctuary” may be understood as priests specifically.
    mitigation: The text retains the broader word “leaders” because the Hebrew does not explicitly say “priests.”
  - risk: “No longer sacred” may sound like a neutral change of status.
    mitigation: The surrounding destruction and insults preserve its force as divine judgment.
