translation:
  language: en
  text: “I myself declared it, saved you, and announced it. No foreign god was among you. You are my witnesses,” declares Yahweh, “and I am God.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I myself declared and saved and announced
  simplified_phrase: I myself declared it, saved you, and announced it.
  preserved_meaning: Yahweh distinctly declares, saves his people, and announces what he has done.
  reasoning_layer_used: The lexical decisions preserve the three coordinated divine actions without specifying an unstated sequence or object.
  rationale: Supplying simple English objects makes the actions natural without adding a future-looking claim.
- pob_phrase: and there was no foreign god among you
  simplified_phrase: No foreign god was among you.
  preserved_meaning: No foreign deity was present among Israel as the source of salvation.
  reasoning_layer_used: The theological decision identifies the foreign one as a foreign god in this context.
  rationale: A separate direct sentence makes the contrast easy to follow.
translation_notes:
  risk_flags:
  - risk: The pronouns “you” and “it” are supplied because the Hebrew leaves the objects implicit.
    mitigation: They clarify the immediate address and divine acts without defining the declaration as a prior prediction.
