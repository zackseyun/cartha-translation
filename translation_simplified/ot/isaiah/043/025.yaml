  preserved_meaning: God completely removes serious covenant offenses.
  reasoning_layer_used: lexical decisions on מֹחֶה and פְשָׁעֶיךָ
  rationale: “Erases” keeps the removal image, while “acts of rebellion” explains the force of “transgressions.”
- pob_phrase: your sins I will not remember
  simplified_phrase: I will no longer hold your sins against you
  preserved_meaning: God resolves not to keep these sins in view for judgment.
