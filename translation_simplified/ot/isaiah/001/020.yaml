translation:
  language: en
  text: But if you refuse and rebel, the sword will devour you.[a] For the mouth of Yahweh has spoken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “you will be eaten by the sword.” This reverses the promise in verse 19 that the obedient will eat the good of the land.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: you will be devoured by the sword
  simplified_phrase: the sword will devour you
  preserved_meaning: The sword remains the vivid agent of violent judgment, and the eating image still contrasts with verse 19.
  reasoning_layer_used: POB lexical decision and footnote on חֶרֶב and תְּאֻכְּלוּ
  rationale: The active sentence is easier to follow while preserving the prophetic image and wordplay.
- pob_phrase: for the mouth of Yahweh has spoken
  simplified_phrase: For the mouth of Yahweh has spoken
  preserved_meaning: Yahweh’s authoritative declaration confirms the warning.
  reasoning_layer_used: POB lexical and theological decisions on כִּי, פִּי יְהוָה, and יְהוָה
  rationale: A separate sentence improves readability while retaining the connective, mouth image, and divine name.
translation_notes:
  risk_flags:
  - risk: “Devour” may be understood literally rather than as an image of violent judgment.
