translation:
  language: en
  text: From the sole of the foot to the head, not one part of the body is healthy.[a] It is covered with wounds, bruises, and fresh injuries from blows.[b] These injuries have not been pressed to drain them, bandaged, or softened with oil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The nation is pictured as a wounded body.
    reason: source_note
  - marker: b
    text: Or “fresh wounds”; the Hebrew describes recent, raw injuries.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: there is no soundness in it
  simplified_phrase: not one part of the body is healthy
  preserved_meaning: The pictured body has no healthy or unharmed part.
  reasoning_layer_used: Lexical decision for מְתֹם and the corporate-body metaphor.
  rationale: Common wording makes the total lack of bodily health immediately clear.
- pob_phrase: only wounds and bruises and fresh blows
  simplified_phrase: It is covered with wounds, bruises, and fresh injuries from blows
  preserved_meaning: The entire body bears recent, untreated injuries caused by blows.
  reasoning_layer_used: Lexical decisions for פֶּצַע, חַבּוּרָה, and מַכָּה טְרִיָּה.
  rationale: The recast list reads naturally while retaining both recent injury and assault imagery.
- pob_phrase: they have not been pressed out, or bandaged, or softened with oil
  simplified_phrase: These injuries have not been pressed to drain them, bandaged, or softened with oil
  preserved_meaning: None of the customary treatments has been given to the wounds.
  reasoning_layer_used: Medical-context lexical decisions for the three treatment verbs.
  rationale: A clear subject and the purpose of pressing make the treatment sequence understandable.
interpretive_expansions:
- pob_phrase: there is no soundness in it
  rendering: not one part of the body is healthy
  claim: The lack of soundness extends over the whole pictured body.
  evidence:
