  - The POB rationale identifies the nation as a corporate body.
  confidence: high
  alternatives_preserved:
  - there is no soundness in it
  - there is nothing healthy in it
- pob_phrase: pressed out
  rendering: pressed to drain them
  claim: The wounds were not squeezed to expel matter before further treatment.
  evidence:
