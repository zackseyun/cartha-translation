translation:
  language: en
  text: “What use are your many sacrifices to me?” says Yahweh. “I have had enough of burnt offerings of rams and the fat of well-fed animals. I take no pleasure in the blood of bulls, lambs, and goats.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Why are your many sacrifices to me?
  simplified_phrase: What use are your many sacrifices to me?
  preserved_meaning: Yahweh questions the value of their many sacrifices to him.
  reasoning_layer_used: POB lexical decision for לָמָּה לִּי and immediate context
  rationale: This natural question carries the value-focused force in the main text rather than suggesting a request for their motive.
- pob_phrase: the fat of fattened animals
  simplified_phrase: the fat of well-fed animals
  preserved_meaning: The offerings include fat from livestock specially fed for sacrifice.
  reasoning_layer_used: POB lexical decision for חֵלֶב מְרִיאִים
  rationale: “Well-fed animals” is clearer common English while preserving the sense of fattened livestock.
- pob_phrase: I do not delight
  simplified_phrase: I take no pleasure
  preserved_meaning: Yahweh finds no pleasure in these sacrifices and rejects them.
  reasoning_layer_used: POB lexical decision for לֹא חָפָצְתִּי
  rationale: The common expression preserves the force of Yahweh’s negative judgment.
