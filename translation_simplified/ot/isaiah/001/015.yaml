translation:
  language: en
  text: When you hold out your open palms in prayer, I hide my eyes from you. Even when you offer many prayers, I am not listening. Your hands are full of blood.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Blood” may mean bloodshed or guilt for shedding blood.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: spread out your palms
  simplified_phrase: hold out your open palms in prayer
  preserved_meaning: The concrete gesture of presenting open palms in prayer remains visible.
  reasoning_layer_used: Lexical decision and footnote a
  rationale: This makes the ancient prayer gesture immediately understandable while retaining the image of palms.
- pob_phrase: even though you multiply prayers
  simplified_phrase: Even when you offer many prayers
  preserved_meaning: Their repeated prayers do not change God's refusal to listen.
  reasoning_layer_used: Lexical decisions for גַּם כִּי and תַרְבּוּ תְפִלָּה
  rationale: Common wording replaces the unnatural phrase “multiply prayers” without weakening its emphasis.
- pob_phrase: I hide my eyes from you; ... I am not listening
  simplified_phrase: I hide my eyes from you. ... I am not listening.
  preserved_meaning: God deliberately refuses to receive their hypocritical worship.
  reasoning_layer_used: Theological decision on anthropomorphic language
  rationale: Two sentences improve readability while preserving both forceful bodily images.
