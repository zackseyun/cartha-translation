translation:
  language: en
  text: Do not bring any more worthless offerings of grain. Incense is detestable to me. You observe new moon festivals and Sabbaths and call people together for worship. But I cannot endure evil and a solemn worship gathering.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “I cannot endure evil together with a solemn worship gathering.” The brief Hebrew leaves the relationship between the evil and the gathering unstated.
    reason: alternative_reading
