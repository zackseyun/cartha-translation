translation:
  language: en
  text: How could the faithful city have become a prostitute! She was once full of justice; righteousness made its home in her. But now murderers live there!
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: How the faithful city has become a prostitute!
  simplified_phrase: How could the faithful city have become a prostitute!
  preserved_meaning: The prophet laments Jerusalem’s shocking change from faithfulness to corruption while retaining the prostitute metaphor.
  reasoning_layer_used: Lexical and theological decisions for אֵיכָה and לְזוֹנָה
  rationale: “How could” makes the exclamatory lament immediately clear without turning it into a request for information.
- pob_phrase: righteousness lodged in her
  simplified_phrase: righteousness made its home in her
  preserved_meaning: Righteousness is pictured as residing habitually within the personified city.
  reasoning_layer_used: Lexical decision for יָלִין בָּהּ
  rationale: “Made its home” is natural English that preserves the source image of righteousness residing in the city.
- pob_phrase: but now murderers
  simplified_phrase: But now murderers live there!
  preserved_meaning: Murderers have replaced the righteousness that formerly resided in Jerusalem.
  reasoning_layer_used: Lexical decision for מְרַצְּחִים
  rationale: Supplying the implied verb completes the elliptical Hebrew contrast for modern readers.
