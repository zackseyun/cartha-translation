translation:
  language: en
  text: Yahweh of Hosts[a] left only a very small remnant[b] of us. If he had not, we would have become like Sodom; we would have resembled Gomorrah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hosts” means armies, including the armies of heaven.
    reason: simplification_note
  - marker: b
    text: Or, “preserved for us a few survivors.”
    reason: lexical_alternative
