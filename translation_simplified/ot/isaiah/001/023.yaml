translation:
  language: en
  text: Your rulers are rebels who work with thieves. Every one of them loves bribes and runs after payments.[a] They give no justice to orphans, and a widow’s case does not come before them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may mean payments, rewards, or gifts, probably received corruptly.
    reason: lexical_alternative
