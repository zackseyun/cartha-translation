  preserved_meaning: Their strong desire for the oaks will become a cause of shame.
  reasoning_layer_used: Lexical decisions for יֵבֹשׁוּ, מֵאֵילִים, and חֲמַדְתֶּם
  rationale: The recast clause states the cause of shame in direct, natural English while retaining strong desire.
- pob_phrase: you will be disgraced because of the gardens that you chose
  simplified_phrase: the gardens you chose will bring you disgrace
  preserved_meaning: Their deliberate choice of the gardens will become a cause of disgrace.
  reasoning_layer_used: Lexical decisions for וְתַחְפְּרוּ, מֵהַגַּנּוֹת, and בְּחַרְתֶּם
  rationale: The active wording is easier to follow and preserves both disgrace and deliberate choice.
