translation:
  language: en
  text: Listen to the word of Yahweh, you rulers of Sodom.[a] Pay attention to the instruction of our God,[b] you people of Gomorrah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isaiah is comparing Judah’s leaders and people to Sodom and Gomorrah, not saying they literally belong to those cities.
    reason: cultural_note
  - marker: b
    text: The Hebrew word translated “instruction” can also mean “law” or “teaching.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Hear the word of Yahweh
  simplified_phrase: Listen to the word of Yahweh
  preserved_meaning: This remains a direct command to hear and heed Yahweh’s prophetic word.
  reasoning_layer_used: Lexical decision for שִׁמְעוּ and דְבַר יְהוָה
  rationale: “Listen” states the intended response more naturally in modern English while retaining the prophetic formula.
- pob_phrase: give ear to the instruction of our God
  simplified_phrase: Pay attention to the instruction of our God
  preserved_meaning: The second command remains pointed and distinct from the first while retaining divine instruction and “our God.”
  reasoning_layer_used: Lexical decisions for הַאֲזִינוּ, תּוֹרַת, and אֱלֹהֵינוּ
  rationale: “Pay attention” replaces an unfamiliar idiom without weakening the command.
