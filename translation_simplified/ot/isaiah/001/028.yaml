simplification_decisions:
- pob_phrase: rebels and sinners will be broken together
  simplified_phrase: rebels and sinners alike will be broken
  preserved_meaning: Both the rebellious and the sinful share the same ruin.
  reasoning_layer_used: Lexical decisions for פֹּשְׁעִים, חַטָּאִים, שֶׁבֶר, and יַחְדָּו
  rationale: “Alike” makes their shared fate clear while keeping the concrete image of being broken.
- pob_phrase: those who forsake Yahweh
  simplified_phrase: everyone who abandons Yahweh
  preserved_meaning: People who turn away from Yahweh face judgment.
  reasoning_layer_used: Lexical and theological decisions for עֹזְבֵי יְהוָה and יְהוָה
  rationale: “Abandons” is more familiar than “forsakes,” while Yahweh remains the divine name.
translation_notes:
  risk_flags:
  - risk: “Will be broken” may sound less final than the Hebrew sense of ruin.
    mitigation: The footnote preserves the stronger alternatives “will be destroyed” and “will perish.”
