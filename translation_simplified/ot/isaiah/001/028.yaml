translation:
  language: en
  text: But rebels and sinners alike will be broken,[a] and everyone who abandons Yahweh will come to an end.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “will be destroyed” or “will perish.”
