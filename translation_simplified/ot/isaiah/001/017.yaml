translation:
  language: en
  text: Learn to do what is good. Seek justice. Correct the oppressor.[a] Give justice to children without fathers. Plead the widow’s case.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult Hebrew phrase may instead mean “help the oppressed” or “set things right for the oppressed.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Learn to do good; seek justice
  simplified_phrase: Learn to do what is good. Seek justice.
  preserved_meaning: God commands his people to learn good conduct and actively pursue justice.
  reasoning_layer_used: POB lexical decisions for לִמְדוּ, הֵיטֵב, דִּרְשׁוּ, and מִשְׁפָּט
  rationale: Two short sentences make the distinct commands immediately clear.
- pob_phrase: judge for the fatherless
  simplified_phrase: Give justice to children without fathers.
  preserved_meaning: The command calls for just legal action on behalf of a specifically vulnerable group.
  reasoning_layer_used: POB lexical decisions for שִׁפְטוּ and יָתוֹם
  rationale: This wording explains the legal sense and the less familiar term “fatherless.”
- pob_phrase: plead for the widow
  simplified_phrase: Plead the widow’s case.
  preserved_meaning: The command requires legal advocacy for the widow.
  reasoning_layer_used: POB lexical decision for רִיבוּ
  rationale: Adding “case” makes the courtroom meaning clear without adding commentary.
