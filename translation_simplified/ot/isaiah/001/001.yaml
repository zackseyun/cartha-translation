translation:
  language: en
  text: This is the vision Isaiah son of Amoz saw about Judah and Jerusalem.[a] He saw it during the reigns of Uzziah, Jotham, Ahaz, and Hezekiah, kings of Judah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “against Judah and Jerusalem.” The Hebrew can refer either to the vision’s subject or to those it speaks against.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: The vision of Isaiah son of Amoz, which he saw
  simplified_phrase: This is the vision Isaiah son of Amoz saw
  preserved_meaning: Isaiah is identified as the one who saw the prophetic vision.
  reasoning_layer_used: Lexical decisions for חֲזוֹן and חָזָה
  rationale: The direct sentence keeps both “vision” and “saw,” preserving the Hebrew image and wordplay.
- pob_phrase: concerning Judah and Jerusalem
  simplified_phrase: about Judah and Jerusalem
  preserved_meaning: Judah and Jerusalem are the broad subject of the vision.
  reasoning_layer_used: Theological decision on the scope of עַל
  rationale: “About” is common English and avoids narrowing the whole vision to condemnation.
- pob_phrase: in the days of Uzziah, Jotham, Ahaz, and Hezekiah, kings of Judah
  simplified_phrase: during the reigns of Uzziah, Jotham, Ahaz, and Hezekiah, kings of Judah
  preserved_meaning: The vision came in the period when the named men ruled Judah.
  reasoning_layer_used: Lexical decision for בִּימֵי and immediate royal apposition
  rationale: “During the reigns” makes the historical time reference immediately clear.
