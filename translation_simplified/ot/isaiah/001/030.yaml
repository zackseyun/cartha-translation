  preserved_meaning: The tree’s single leaf is in the process of withering.
  reasoning_layer_used: The lexical decision identifies the Hebrew participle as describing withering or fading and retains the singular leaf.
  rationale: The revised wording keeps the image active rather than presenting the leaf as already withered.
- pob_phrase: a garden that has no water
  simplified_phrase: a garden with no water
  preserved_meaning: The garden is deprived of water.
  reasoning_layer_used: The lexical rationale requires the image of deprivation to remain explicit.
  rationale: The shorter phrase is natural English and preserves the full image.
