translation:
  language: en
  text: 'Listen, heavens! Pay attention, earth, because Yahweh has spoken:


    “I raised children and made them great,[a]

    but they rebelled against me.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I raised children and lifted them up” or “I brought them up.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Hear, O heavens, and give ear, O earth
