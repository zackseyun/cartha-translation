  preserved_meaning: Heaven and earth are directly summoned as solemn witnesses.
  reasoning_layer_used: Lexical decisions for שׁמע, אזן, שׁמים, and ארץ
  rationale: Common imperatives replace archaic wording while preserving the cosmic address.
- pob_phrase: for Yahweh has spoken
  simplified_phrase: because Yahweh has spoken
  preserved_meaning: Yahweh’s authoritative speech is the reason heaven and earth must listen.
  reasoning_layer_used: Lexical and theological decisions for כי, יְהוָה, and דבר
  rationale: Because clearly preserves the causal link in natural English.
- pob_phrase: I have reared children and brought them up
  simplified_phrase: I raised children and made them great
  preserved_meaning: Yahweh nurtured his people as children and also elevated them.
  reasoning_layer_used: Lexical decisions and POB footnote for גדל and רומם
  rationale: The wording distinguishes upbringing from elevation without assigning a specific social rank.
