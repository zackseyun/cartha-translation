translation:
  language: en
  text: Daughter Zion[a] has been left alone, like a temporary shelter in a vineyard, like a hut in a cucumber field[b], and like a city under siege.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Daughter Zion” personifies Zion, or Jerusalem, as a daughter.
    reason: simplification_note
  - marker: b
    text: The Hebrew may refer more broadly to a field of melons, gourds, or similar vine crops.
    reason: lexical_alternative
  - marker: c
    text: Or possibly “like a guarded city,” though “a city under siege” best fits the context.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: daughter Zion is left
  simplified_phrase: Daughter Zion has been left alone
  preserved_meaning: Zion is personified as a daughter left isolated after devastation.
  reasoning_layer_used: Lexical and theological decisions on וְנוֹתְרָה and בַת צִיּוֹן
  rationale: The wording keeps the personification while making the resulting isolation clear.
- pob_phrase: like a shelter in a vineyard
  simplified_phrase: like a temporary shelter in a vineyard
  preserved_meaning: Zion resembles a fragile field shelter rather than a permanent building.
  reasoning_layer_used: Lexical decision on כְּסֻכָּה
  rationale: “Temporary” restores the shelter's impermanent force for readers unfamiliar with field booths.
- pob_phrase: like a besieged city
  simplified_phrase: like a city under siege
  preserved_meaning: Zion is compared to a city surrounded and distressed by enemies.
  reasoning_layer_used: Lexical decision on כְּעִיר נְצוּרָה
  rationale: The common expression “under siege” communicates the same contextual reading more naturally.
