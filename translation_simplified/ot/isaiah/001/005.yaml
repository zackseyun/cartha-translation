translation:
  language: en
  text: Why should you suffer more blows? You keep rebelling. Your whole head is sick,[a] and your whole heart is faint.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Where else can you be struck?” The Hebrew may ask what part of the body remains for further blows, since the whole body is sick.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: be struck again
  simplified_phrase: suffer more blows
  preserved_meaning: The people face repeated punishment pictured as physical blows.
  reasoning_layer_used: lexical decisions and theological decision
  rationale: This keeps the force of repeated chastisement in more immediate English.
- pob_phrase: You continue in rebellion
  simplified_phrase: You keep rebelling
  preserved_meaning: The people persist in rebelliously turning away.
  reasoning_layer_used: lexical decision for תּוֹסִיפוּ סָרָה and latest revision
  rationale: The verbal wording is clearer while preserving the clause as a statement, not a second question.
- pob_phrase: the whole head ... the whole heart
  simplified_phrase: your whole head ... your whole heart
  preserved_meaning: The nation is pictured collectively as a completely afflicted body.
  reasoning_layer_used: lexical decisions for כָּל רֹאשׁ and וְכָל לֵבָב
  rationale: The added possessive makes the body image easier to connect to the people being addressed.
interpretive_expansions:
- pob_phrase: the whole head ... the whole heart
  rendering: your whole head ... your whole heart
  claim: The head and heart belong figuratively to the people addressed as one body.
  evidence:
  - The immediate clauses address the people as “you.”
  - POB identifies both singular expressions as collective body imagery for the nation.
  confidence: high
  alternatives_preserved:
