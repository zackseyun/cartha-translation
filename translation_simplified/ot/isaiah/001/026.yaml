simplification_decisions:
- pob_phrase: your judges as at the first
  simplified_phrase: your judges as they were at first
  preserved_meaning: God will restore the city’s judges according to an earlier ideal without identifying a specific period or former individuals.
  reasoning_layer_used: POB lexical decisions for וְאָשִׁיבָה and כְּבָרִאשֹׁנָה
  rationale: This wording avoids implying that the present judges personally held office long ago.
- pob_phrase: your counselors
  simplified_phrase: your advisers
  preserved_meaning: The civic leaders who give counsel remain distinct from the judges.
  reasoning_layer_used: POB lexical decision for וְיֹעֲצַיִךְ
  rationale: “Advisers” is the clearer modern term for people who give counsel.
- pob_phrase: Afterward
  simplified_phrase: After that
  preserved_meaning: The city receives these names after its leaders are restored.
  reasoning_layer_used: POB lexical decision for אַחֲרֵי כֵן
  rationale: “After that” states the sequence in common English.
