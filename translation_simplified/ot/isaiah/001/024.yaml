translation:
  language: en
  text: 'Therefore, the Lord—Yahweh of Armies, the Mighty One of Israel—declares: “Ah! I will find relief from those who oppose me, and I will avenge myself on my enemies.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Therefore the declaration of the Lord, Yahweh of Armies, the Mighty One of Israel
  simplified_phrase: Therefore, the Lord—Yahweh of Armies, the Mighty One of Israel—declares
  preserved_meaning: This remains a solemn divine pronouncement identified by the same titles and personal name.
  reasoning_layer_used: POB lexical and theological decisions for נְאֻם, הָאָדוֹן, יְהוָה, צְבָאוֹת, and אֲבִיר יִשְׂרָאֵל
  rationale: Changing the noun phrase to a direct verb makes the introduction easier to follow.
- pob_phrase: my foes
  simplified_phrase: those who oppose me
  preserved_meaning: The phrase still identifies God's adversaries without weakening their opposition.
  reasoning_layer_used: POB lexical decision for מִצָּרַי
  rationale: The expanded phrase is more familiar to common readers than “foes.”
- pob_phrase: I will get relief
  simplified_phrase: I will find relief
  preserved_meaning: God will gain relief or satisfaction through action against his opponents.
  reasoning_layer_used: POB lexical decision for אֶנָּחֵם and theological distinction between relief and vengeance
  rationale: “Find relief” is natural English while keeping this action distinct from vengeance.
