translation:
  language: en
  text: Ah,[a] what a sinful nation! They are a people weighed down by sin, descendants of evildoers, children whose actions are corrupt. They have abandoned Yahweh[b] and despised the Holy One of Israel. They have turned their backs on him.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression conveys both sorrow and condemnation; it may also be translated “Woe” or “Alas.”
    reason: lexical_alternative
  - marker: b
    text: Yahweh is the divine name represented in many translations as “the LORD.”
    reason: source_note
  - marker: c
    text: Or “they have become estranged and gone backward.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Ah, sinful nation, a people heavy with iniquity
  simplified_phrase: Ah, what a sinful nation! They are a people weighed down by sin
  preserved_meaning: The nation is condemned for sin while the Hebrew image of a crushing moral weight remains.
  reasoning_layer_used: Lexical decisions for הוֹי, כֶּבֶד, and עָוֺן
  rationale: The shorter sentences and familiar word “sin” make the accusation clear without losing its weight.
- pob_phrase: offspring of evildoers, children who act corruptly
  simplified_phrase: descendants of evildoers, children whose actions are corrupt
  preserved_meaning: Both the inherited family image and the charge of corrupt conduct remain distinct.
  reasoning_layer_used: Corporate/familial theological decision and lexical decisions
  rationale: “Descendants” and “whose actions are corrupt” are natural modern expressions for the same familial indictment.
- pob_phrase: They have forsaken Yahweh ... they have turned backward
  simplified_phrase: They have abandoned Yahweh ... They have turned their backs on him
  preserved_meaning: The people have contemptuously rejected Yahweh and moved away from him.
  reasoning_layer_used: Lexical decisions for עָזַב and נָזֹרוּ אָחוֹר
  rationale: The common idioms clarify the rejection while preserving the bodily image of turning away.
translation_notes:
  risk_flags:
  - risk: “Sin” may not display every nuance of wrongdoing and culpability carried by “iniquity.”
    mitigation: The image “weighed down” retains the sense that their wrongdoing brings a grave moral burden.
  - risk: “Turned their backs” may understate the possible nuance of estrangement and backward movement.
    mitigation: Footnote c preserves that documented alternative.
