  simplified_phrase: I will hold you accountable for your sins and for your fathers’ sins together
  preserved_meaning: Yahweh considers the present generation’s culpable wrongdoing together with that of their fathers.
  reasoning_layer_used: theological decision on intergenerational guilt and judgment
  rationale: The wording completes the fragment while making people, not sins, the object of accountability.
- pob_phrase: reproached me
  simplified_phrase: insulted me
  preserved_meaning: Their actions expressed scorn toward Yahweh.
  reasoning_layer_used: lexical decision for חֵרְפוּנִי
  rationale: “Insulted” gives the documented sense in familiar English without specifying the manner.
- pob_phrase: measure their former deed into their lap
  simplified_phrase: measure their former deeds back into their laps
  preserved_meaning: Yahweh will respond personally and directly to their earlier conduct.
  reasoning_layer_used: lexical decisions for וּמַדֹּתִי, פְעֻלָּתָם, רִאשֹׁנָה, and עַל חֵיקָם
  rationale: The wording clarifies the repayment force while retaining the deed, measuring, and lap images.
