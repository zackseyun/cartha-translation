translation:
  language: en
  text: “I will hold you accountable for your sins and for your fathers’ sins together,” says Yahweh, “because they burned incense on the mountains and insulted me on the hills. So I will measure their former deeds back into their laps.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term for “deeds” can also mean “payment,” while the image of measuring something into their laps already expresses personal repayment.
    reason: lexical_alternative
