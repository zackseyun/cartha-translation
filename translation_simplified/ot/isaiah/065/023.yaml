translation:
  language: en
  text: They will not work hard only for their efforts to come to nothing. They will not have children only for disaster[a] to strike them. They are the offspring of people blessed by Yahweh, and their descendants will be with them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can also mean terror, panic, or sudden disaster.
    reason: lexical_alternative
