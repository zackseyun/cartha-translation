translation:
  language: en
  text: 'Therefore, this is what the Lord Yahweh says:


    “Look! My servants[a] will have food, but you will go hungry.

    Look! My servants will drink, but you will be thirsty.

    Look! My servants will rejoice, but you will be disgraced.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term can also mean “slaves,” but “servants” fits those who belong to and serve God in this context.
    reason: lexical_alternative
  - marker: b
    text: Or “be ashamed.” The Hebrew may describe feeling shame or being publicly disgraced; the judgment context supports “be disgraced.”
    reason: lexical_alternative
