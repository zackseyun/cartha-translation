translation:
  language: en
  text: Whoever pronounces a blessing on himself in the land[b] will invoke the God of Amen[a] in that blessing. Whoever swears an oath in the land will swear by the God of Amen. This is because the former troubles are forgotten and hidden from my eyes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Amen” describes God as firm, faithful, and true; it may also be translated “the God of truth” or “the faithful God.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word may also mean “earth.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: blesses himself ... will bless himself by the God of Amen
  simplified_phrase: pronounces a blessing on himself ... will invoke the God of Amen in that blessing
  preserved_meaning: The person invokes God while reflexively pronouncing a blessing on himself.
  reasoning_layer_used: POB lexical decision for the reflexive form and its self-invoking sense
  rationale: This states the relationship to God clearly while preserving the reflexive blessing.
- pob_phrase: whoever swears ... will swear
  simplified_phrase: Whoever swears an oath ... will swear
  preserved_meaning: The person formally takes an oath by God.
  reasoning_layer_used: POB lexical decision for the oath verb
  rationale: Adding “an oath” prevents the modern misunderstanding of offensive speech without needless synonym switching.
- pob_phrase: because the former troubles are forgotten, and because they are hidden from my eyes
  simplified_phrase: This is because the former troubles are forgotten and hidden from my eyes
  preserved_meaning: The earlier troubles are both forgotten and no longer before God's sight.
  reasoning_layer_used: POB lexical decisions for the causal link and both descriptions
  rationale: A separate sentence clarifies the reason while retaining both source images.
interpretive_expansions:
- pob_phrase: will bless himself by the God of Amen
  rendering: will invoke the God of Amen in that blessing
  claim: The self-blessing calls upon God rather than presenting God merely as an agent.
  evidence:
