- pob_phrase: who walk in a way that is not good
  simplified_phrase: They walk down a path that is not good
  preserved_meaning: Their usual conduct follows a morally unacceptable course without strengthening “not good” to “evil.”
  reasoning_layer_used: Lexical and theological decisions on הַהֹלְכִים הַדֶּרֶךְ לֹא טוֹב.
  rationale: A new sentence and the concrete word “path” make the conduct metaphor easier to grasp.
