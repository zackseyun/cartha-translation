translation:
  language: en
  text: I will bring descendants from Jacob, and from Judah an heir who will inherit my mountains. My chosen ones will possess those mountains, and my servants will live there.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: bring forth offspring from Jacob
  simplified_phrase: bring descendants from Jacob
  preserved_meaning: God will cause a continuing people to come from Jacob.
  reasoning_layer_used: lexical decision for זֶרַע
  rationale: “Descendants” clearly expresses the collective sense of “offspring.”
- pob_phrase: an heir of my mountains
  simplified_phrase: an heir who will inherit my mountains
  preserved_meaning: Someone from Judah will receive God's mountains as an inheritance.
  reasoning_layer_used: lexical decision for יוֹרֵשׁ and theological decision on territorial language
  rationale: The relative clause makes the heir's relationship to the mountains immediately clear.
- pob_phrase: will possess it, and my servants will dwell there
  simplified_phrase: will possess those mountains, and my servants will live there
  preserved_meaning: God's chosen people will occupy the mountains and remain there.
  reasoning_layer_used: lexical decisions for וִירֵשׁוּהָ and יִשְׁכְּנוּ שָׁמָּה
  rationale: The explicit noun removes pronoun confusion, while “live” gives the plain sense of “dwell.”
