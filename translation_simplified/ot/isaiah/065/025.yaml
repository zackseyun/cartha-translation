translation:
  language: en
  text: The wolf and the lamb will graze side by side. The lion will eat straw as cattle do, and dust will be the serpent’s food.[a] They will do no evil and cause no destruction anywhere on my holy mountain,” says Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This description of the serpent likely echoes Genesis 3:14.
    reason: cross_reference
simplification_decisions:
- pob_phrase: will graze together
  simplified_phrase: will graze side by side
  preserved_meaning: The predator and its vulnerable prey feed together peacefully.
  reasoning_layer_used: POB lexical decision for יִרְעוּ כְאֶחָד
  rationale: “Side by side” makes the peaceful shared action immediately vivid.
- pob_phrase: like the cattle
  simplified_phrase: as cattle do
  preserved_meaning: The lion’s diet is compared with the ordinary diet of cattle.
  reasoning_layer_used: POB lexical decision for כַּבָּקָר
  rationale: The recast comparison is smoother while keeping “cattle” collective.
- pob_phrase: They will not do evil or destroy on all my holy mountain
  simplified_phrase: They will do no evil and cause no destruction anywhere on my holy mountain
  preserved_meaning: Evil, harm, and destructive action will be entirely absent from Yahweh’s holy mountain.
  reasoning_layer_used: POB lexical decisions for רעע, שׁחת, and בְּכָל הַר קָדְשִׁי
  rationale: The positive clause form and “anywhere” clarify the total absence of evil and destruction.
translation_notes:
  risk_flags:
  - risk: “Do no evil” may sound morally broader than animal violence alone.
    mitigation: The wording retains POB’s chosen moral force while “destruction” anchors it in the peace setting.
  - risk: The serpent eating dust may be read only as a zoological statement.
    mitigation: The footnote identifies the likely Genesis 3:14 echo without adding the curse to the main text.
