translation:
  language: en
  text: So I will destine you to die by the sword.[a] All of you will fall to your knees and be slaughtered. For I called, but you did not answer; I spoke, but you did not listen. You did what was evil in my sight and chose what did not please me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Destine” can also mean “appoint” and echoes the name “Destiny” in the previous verse.
    reason: source_note
simplification_decisions:
- pob_phrase: destine you for the sword
  simplified_phrase: destine you to die by the sword
  preserved_meaning: God actively appoints them to judgment by the sword.
  reasoning_layer_used: lexical and theological decisions
  rationale: The wording explains the sword idiom while retaining “destine” and its contextual wordplay.
- pob_phrase: bow down for the slaughter
  simplified_phrase: fall to your knees and be slaughtered
  preserved_meaning: They bend the knee as they collapse under deadly judgment.
  reasoning_layer_used: lexical decision and footnote b
  rationale: The concrete bodily image remains, while its judgment setting becomes clear.
- pob_phrase: did what was evil in my eyes, and chose what I did not delight in
  simplified_phrase: did what was evil in my sight and chose what did not please me
  preserved_meaning: God judges their actions as evil and rejects what they deliberately chose.
  reasoning_layer_used: lexical decisions
  rationale: Common English replaces two less familiar expressions without weakening God's personal disapproval.
