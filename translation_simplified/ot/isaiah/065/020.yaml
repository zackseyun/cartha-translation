  language: en
  text: No infant there will live for only a few days, and no old person will fail to live out a full lifetime. Anyone who dies at a hundred will be considered young,[a] but even at a hundred years old, a sinner will still be under a curse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says, “the youth will die a hundred years old.”
