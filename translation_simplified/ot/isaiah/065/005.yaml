translation:
  language: en
  text: They say, “Stay away! Do not come near me, because I am holier than you.”[a] Such people are smoke in my nostrils, a fire that burns all day long.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “because I am too holy for you,” or “because I have kept myself holy and separate from you.” The Hebrew is difficult, but in each reading the speakers claim religious or moral superiority.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Keep to yourself; do not come near me
  simplified_phrase: Stay away! Do not come near me
  preserved_meaning: The speakers dismiss others and demand social-religious distance.
  reasoning_layer_used: POB lexical decision for קְרַב אֵלֶיךָ and אַל תִּגַּשׁ בִּי
  rationale: “Stay away” states the dismissive command more directly while retaining both commands.
- pob_phrase: These
  simplified_phrase: Such people
  preserved_meaning: God refers back to the people who make this arrogant claim.
  reasoning_layer_used: POB lexical decision for אֵלֶּה
  rationale: The explicit noun makes the reference immediately clear in English.
- pob_phrase: a fire burning all day long
  simplified_phrase: a fire that burns all day long
  preserved_meaning: Their ongoing provocation is pictured as a continually burning fire.
  reasoning_layer_used: POB lexical decisions for אֵשׁ יֹקֶדֶת and כָּל הַיּוֹם
  rationale: A finite relative clause is more natural while preserving the fire image and duration.
translation_notes:
  risk_flags:
  - risk: “I am holier than you” may sound like an endorsed fact rather than the speakers’ arrogant boast.
    mitigation: Quotation and context identify it as their claim, while the following judgment condemns them.
  - risk: The difficult Hebrew holiness clause permits other renderings.
    mitigation: Footnote [a] preserves the main alternatives without weakening the controlling POB reading.
