translation:
  language: en
  text: Look! My servants will sing[a] because their hearts are glad. But you will cry out because your hearts ache, and you will wail because your spirits are broken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “shout for joy.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Look, my servants will sing for gladness of heart
  simplified_phrase: Look! My servants will sing because their hearts are glad.
  preserved_meaning: God’s servants will openly rejoice because of their inner gladness.
  reasoning_layer_used: POB lexical decisions for הִנֵּה, יָרֹנּוּ, and מִטּוּב לֵב
  rationale: The direct causal wording makes the Hebrew heart idiom immediately clear while keeping its joyful force.
- pob_phrase: you will cry out from pain of heart
  simplified_phrase: you will cry out because your hearts ache
  preserved_meaning: The addressed group will make a loud cry because of deep inner pain.
  reasoning_layer_used: POB lexical decisions for תִּצְעֲקוּ and מִכְּאֵב לֵב
  rationale: “Your hearts ache” is natural English that preserves both the emotional pain and the heart image.
- pob_phrase: from a broken spirit you will wail
  simplified_phrase: you will wail because your spirits are broken
  preserved_meaning: Their inner brokenness will cause loud lamentation.
  reasoning_layer_used: POB lexical decisions for מִשֵּׁבֶר רוּחַ and תְּיֵלִילוּ
  rationale: The clause is reordered into ordinary English without weakening the broken-spirit metaphor or the intensity of “wail.”
translation_notes:
  risk_flags:
  - risk: Plural “hearts” and “spirits” replace Hebrew collective singular expressions.
    mitigation: The plural wording fits the plural audience while preserving the same inner-state images.
