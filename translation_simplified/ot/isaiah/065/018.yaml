  rationale: “See” gives the solemn emphasis in familiar modern English.
- pob_phrase: Jerusalem as rejoicing
  simplified_phrase: Jerusalem as a city of rejoicing
  preserved_meaning: Jerusalem is being made an embodiment and source of rejoicing.
