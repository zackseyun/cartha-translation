translation:
  language: en
  text: I made myself available to people who had not asked for me.[a] I allowed people who were not looking for me to find me. To a nation that did not call on my name, I said, “Here I am! Here I am!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “I was sought.” The Hebrew can be read as a simple passive, but the context suggests that God made himself available to people who had not sought him.
    reason: lexical_alternative
  - marker: b
    text: Paul applies this verse to the Gentiles in Romans 10:20.
    reason: cross_reference
simplification_decisions:
- pob_phrase: I let myself be sought
  simplified_phrase: I made myself available
  preserved_meaning: God willingly made himself accessible to people who had not sought him.
  reasoning_layer_used: Lexical rationale for נִדְרַשְׁתִּי and its contextual self-disclosure nuance.
  rationale: The clearer wording expresses availability while the footnote preserves the Hebrew passive image.
- pob_phrase: I let myself be found by those who did not seek me
  simplified_phrase: I allowed people who were not looking for me to find me
  preserved_meaning: God enabled discovery by people who had not been seeking him.
  reasoning_layer_used: Lexical decisions for נִמְצֵאתִי and לְלֹא בִקְשֻׁנִי.
  rationale: The active English structure is easier to follow without removing God's initiative.
- pob_phrase: I said, ‘Here I am, here I am,’ to a nation
  simplified_phrase: To a nation ... I said, “Here I am! Here I am!”
  preserved_meaning: God emphatically presented himself to an unresponsive nation.
  reasoning_layer_used: Lexical rationale for הִנֵּנִי הִנֵּנִי and the theological decision for גּוֹי.
  rationale: Reordered clauses clarify the addressee while retaining the emphatic repetition and “nation.”
interpretive_expansions:
- pob_phrase: by those who did not ask
  rendering: to people who had not asked for me
  claim: The unexpressed object of their asking is God himself.
  evidence:
  - The parallel clause explicitly says that they did not seek God.
  - The verse presents God as the one making himself available and found.
  confidence: high
  alternatives_preserved:
  - had not asked
  - had not inquired
translation_notes:
  risk_flags:
  - risk: “Made myself available” may obscure the Hebrew passive image “I was sought.”
    mitigation: Footnote [a] preserves the literal alternative and its ambiguity.
  - risk: Modern readers may assume “nation” excludes the Gentile application.
    mitigation: Footnote [b] notes Paul’s use of the verse in Romans 10:20.
