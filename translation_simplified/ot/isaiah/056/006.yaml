translation:
  language: en
  text: And as for foreigners[a] who join themselves to Yahweh in order to serve him, love the name of Yahweh, and be his servants—everyone who keeps the Sabbath from profaning it and holds firmly to my covenant—
  philosophy: optimal-equivalence
