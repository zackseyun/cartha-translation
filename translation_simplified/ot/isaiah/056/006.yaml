simplification_decisions:
- pob_phrase: the sons of the foreigner
  simplified_phrase: foreigners
  preserved_meaning: People from outside Israel are included without limiting the phrase to literal sons.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The smoother alternative preserves corporate inclusion while the footnote retains the Hebrew image.
- pob_phrase: to minister to him
  simplified_phrase: to serve him
  preserved_meaning: The foreigners devote themselves to service offered to Yahweh.
  reasoning_layer_used: POB lexical decision for לְשָׁרְתוֹ
  rationale: “Serve” is the POB-approved alternative and is clearer in common English.
- pob_phrase: holds fast my covenant
  simplified_phrase: holds firmly to my covenant
  preserved_meaning: Each person remains firmly committed to Yahweh’s covenant.
  reasoning_layer_used: POB lexical decision for וּמַחֲזִיקִים בִּבְרִיתִי
  rationale: The natural English idiom preserves the image of a firm grip.
