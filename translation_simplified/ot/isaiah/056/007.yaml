translation:
  language: en
  text: I will bring them to my holy mountain and give them joy in my house of prayer. Their whole burnt offerings and their other sacrifices will be accepted on my altar, because my house will be called a house of prayer for all peoples.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “for all nations.” Here “peoples” means people from every ethnic group, not modern nation-states.
    reason: lexical_alternative
