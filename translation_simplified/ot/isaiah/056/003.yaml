translation:
  language: en
  text: No foreigner who has joined the LORD should say, “The LORD will certainly exclude me from his people.” No eunuch[a] should say, “Look, I am a dry tree.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here, a eunuch is a man unable to father children.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Let not the foreigner who has joined himself to the LORD say
  simplified_phrase: No foreigner who has joined the LORD should say
  preserved_meaning: A foreigner devoted to the LORD must not expect rejection.
  reasoning_layer_used: POB translation and source syntax
  rationale: The modern construction preserves both the prohibition and the foreigner’s bond with the LORD.
- pob_phrase: will surely separate me from his people
  simplified_phrase: will certainly exclude me from his people
  preserved_meaning: The speaker fears being kept outside the LORD’s people.
  reasoning_layer_used: POB translation and immediate context
  rationale: “Exclude” clearly expresses the feared separation from the LORD’s people.
- pob_phrase: and let not the eunuch say
  simplified_phrase: No eunuch should say
  preserved_meaning: The same prohibition also addresses the eunuch.
  reasoning_layer_used: POB translation and source parallelism
  rationale: A new sentence makes the parallel command easier to follow.
interpretive_expansions:
- pob_phrase: the eunuch
  rendering: eunuch[a]
  claim: In this context, the eunuch is unable to father children.
  evidence:
  - The dry-tree image presents his fear in terms of having no descendants.
  - Isaiah 56:4–5 promises faithful eunuchs an enduring name.
  confidence: high
  alternatives_preserved:
  - The main text retains “eunuch,” which can have broader usage elsewhere.
translation_notes:
  risk_flags:
  - risk: “Exclude” is more explicit than the spatial image “separate.”
    mitigation: It preserves the stated fear of separation from the LORD’s people.
  - risk: Readers may understand “dry tree” only as a general image of failure.
    mitigation: The image remains intact, and the note identifies the contextual concern without making an exhaustive lexical claim.
