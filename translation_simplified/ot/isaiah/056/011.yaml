  text: The dogs have greedy appetites; they never have enough. They are shepherds who understand nothing. They have all turned to their own way. Each one seeks his own dishonest gain—every one of them, without exception.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult Hebrew phrase may instead mean “from every quarter”; either way, it emphasizes how widespread their corruption is.
    reason: alternative_reading
