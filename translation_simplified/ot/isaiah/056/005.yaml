translation:
  language: en
  text: Inside my house and within my walls, I will give them[a] a monument and a name—something better than having sons and daughters. I will give him[b] an everlasting name that will never be cut off.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression translated “a monument and a name” literally says “a hand and a name” and refers to a lasting memorial.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew shifts from “them” to “him,” focusing the promise on an individual within the group.
    reason: alternative_reading
