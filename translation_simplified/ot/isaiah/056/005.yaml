- pob_phrase: in my house and within my walls
  simplified_phrase: Inside my house and within my walls
  preserved_meaning: The promised memorial stands within the LORD’s sacred precincts.
  reasoning_layer_used: lexical decision for בְּבֵיתִי and וּבְחֹמֹתַי
  rationale: Moving the location first gives the sentence a clearer natural order.
- pob_phrase: a monument and a name better than sons and daughters
  simplified_phrase: a monument and a name—something better than having sons and daughters
  preserved_meaning: God promises lasting remembrance more valuable than biological descendants.
  reasoning_layer_used: lexical and theological decisions for יָד וָשֵׁם and the comparative phrase
  rationale: The added break and “having” clarify what is being compared without weakening the monument image.
- pob_phrase: an everlasting name that will not be cut off
  simplified_phrase: an everlasting name that will never be cut off
  preserved_meaning: The honored remembrance will endure permanently and will not come to an end.
  reasoning_layer_used: lexical decision for שֵׁם עוֹלָם and אֲשֶׁר לֹא יִכָּרֵת
  rationale: “Never” states the force of the negative plainly while retaining the source image “cut off.”
