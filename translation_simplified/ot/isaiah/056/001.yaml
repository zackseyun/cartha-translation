translation:
  language: en
  text: 'This is what Yahweh says: “Uphold justice and do what is right, because my salvation will soon come, and my righteousness[a] will soon be revealed.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “righteousness” may also include Yahweh’s justice or his act of vindication.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Thus says Yahweh
  simplified_phrase: This is what Yahweh says
  preserved_meaning: The wording still introduces Yahweh’s authoritative prophetic declaration.
  reasoning_layer_used: Lexical decision for כֹּה and theological decision for יְהוָה
  rationale: The familiar formula is stated in direct modern English while retaining the divine name.
- pob_phrase: Keep justice, and do righteousness
  simplified_phrase: Uphold justice and do what is right
  preserved_meaning: The two commands still call for maintaining just order and practicing right conduct.
  reasoning_layer_used: Lexical and theological distinction between מִשְׁפָּט and צְדָקָה
  rationale: Concrete wording clarifies the ethical commands without merging their distinct ideas.
- pob_phrase: my salvation is near to come, and my righteousness to be revealed
  simplified_phrase: my salvation will soon come, and my righteousness will soon be revealed
  preserved_meaning: Yahweh’s saving action and righteousness are both near to becoming manifest.
  reasoning_layer_used: Lexical decisions for קְרוֹבָה, יְשׁוּעָתִי, and לְהִגָּלוֹת
  rationale: Ordinary future clauses express the same imminence more naturally.
translation_notes:
  risk_flags:
  - risk: “Do what is right” carries less explicit theological terminology than “do righteousness.”
    mitigation: The wording preserves right conduct as a separate command, while “my righteousness” remains in the second clause.
  - risk: “My righteousness” can be misunderstood as referring only to moral character.
    mitigation: The footnote preserves the possible senses of divine justice and vindication.
