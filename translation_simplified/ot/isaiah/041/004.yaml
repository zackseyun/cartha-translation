translation:
  language: en
  text: Who has acted and made all this happen, calling one generation after another from the beginning? I, Yahweh, am the first. I am also with the last generations[a]—I am he.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew wording is difficult and has also been understood to mean, “I am the last.”
    reason: alternative_reading
