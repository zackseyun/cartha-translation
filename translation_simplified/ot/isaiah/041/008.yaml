simplification_decisions:
- pob_phrase: Israel, my servant, Jacob
  simplified_phrase: Israel—you people of Jacob—are my servant
  preserved_meaning: Israel and Jacob name the same covenant people, whom God calls his servant.
  reasoning_layer_used: POB lexical decisions and immediate context
  rationale: The added wording makes the apposition clear to readers unfamiliar with Israel’s two names.
- pob_phrase: Jacob, whom I have chosen
  simplified_phrase: I have chosen you
  preserved_meaning: God’s completed choice of Israel continues to define their relationship.
  reasoning_layer_used: POB lexical rationale
  rationale: A direct sentence removes the dense relative clause without weakening God’s continuing choice.
- pob_phrase: offspring of Abraham
  simplified_phrase: the offspring of Abraham
  preserved_meaning: Israel is Abraham’s collective offspring.
  reasoning_layer_used: POB lexical decision
  rationale: The key collective term remains because it is understandable and preserves the source image.
interpretive_expansions:
- pob_phrase: Jacob
  rendering: you people of Jacob
  claim: Jacob refers corporately to Israel rather than only to the individual patriarch.
  evidence:
  - The verse directly addresses Israel and calls Jacob God’s servant.
  - The POB rationale identifies Jacob as appositional to Israel.
  confidence: high
  alternatives_preserved:
  - Jacob as Israel’s covenant name
translation_notes:
  risk_flags:
  - risk: “My friend” may obscure the Hebrew’s more literal sense, “the one who loves me.”
