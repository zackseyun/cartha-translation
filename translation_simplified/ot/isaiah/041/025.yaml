translation:
  language: en
  text: I have stirred up one from the north, and he has come. From the east, where the sun rises, he calls on my name.[a] He will advance against rulers as if they were clay. He will trample them like a potter treading mud.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Calls on my name” may also mean “invokes my name” or “proclaims my name.”
    reason: lexical_alternative
  - marker: b
    text: The one God stirred up is often understood to be Cyrus, but this verse does not name him.
    reason: cross_reference
simplification_decisions:
- pob_phrase: from the rising of the sun
  simplified_phrase: From the east, where the sun rises
  preserved_meaning: The wording identifies the east while retaining the sunrise image.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: The geographical meaning is made immediate without losing the Hebrew image.
- pob_phrase: He will come upon rulers as upon clay
  simplified_phrase: He will advance against rulers as if they were clay
  preserved_meaning: He moves against rulers as a conqueror who can easily overcome them.
  reasoning_layer_used: POB lexical decisions for וְיָבֹא, סְגָנִים, and כְּמוֹ חֹמֶר
  rationale: “Advance against” makes the hostile movement clear while keeping the clay comparison.
- pob_phrase: like a potter he treads mud
  simplified_phrase: He will trample them like a potter treading mud
  preserved_meaning: The conqueror forcefully subdues rulers through the image of a potter treading wet material.
  reasoning_layer_used: POB lexical decisions for יוֹצֵר, יִרְמָס, and טִיט
  rationale: The recast sentence clearly connects the rulers to the forceful potter image.
