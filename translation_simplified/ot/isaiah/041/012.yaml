simplification_decisions:
- pob_phrase: You will seek them and not find them—those men who contend with you
  simplified_phrase: You will look for those who quarrel with you, but you will not find them
  preserved_meaning: The people in conflict with Israel will disappear so completely that they cannot be found.
  reasoning_layer_used: POB lexical decisions for בקש, מצא, and מַצֻּתֶךָ
  rationale: Everyday wording and ordinary clause order preserve the search-and-not-find sequence.
- pob_phrase: The men who wage war against you
  simplified_phrase: Those who wage war against you
  preserved_meaning: The phrase still identifies people actively making war against Israel.
  reasoning_layer_used: POB lexical decision for אַנְשֵׁי מִלְחַמְתֶּךָ
  rationale: Removing “men” improves flow without turning the personal opponents into an abstraction.
- pob_phrase: like nothing, like nonexistence
  simplified_phrase: like nothing, as if they no longer existed
  preserved_meaning: The paired comparisons portray the enemies’ complete disappearance with intensifying poetic force.
  reasoning_layer_used: POB theological decision on paired expressions for enemy annihilation
  rationale: The recasting avoids an abstract term while preserving the second comparison as rhetoric rather than metaphysics.
translation_notes:
  risk_flags:
  - risk: “As if they no longer existed” may sound more temporal than the Hebrew noun.
    mitigation: The wording preserves both the comparative force and the context’s image of enemies who can no longer be found.
