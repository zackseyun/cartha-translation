translation:
  language: en
  text: Who has raised up a man from the east and summoned him in righteousness[a] to serve at his feet?[b] He hands nations over to this man and brings kings under his power.[c] He makes them like dust before the man’s sword and like wind-driven stubble before his bow.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “summoned him in victory” or “summoned him in justice”; the Hebrew phrase is difficult.
    reason: lexical_alternative
  - marker: b
    text: Serving at someone’s feet pictures following him and being ready to carry out his purpose.
    reason: simplification_note
  - marker: c
    text: The difficult Hebrew clause may also mean “makes him tread down kings.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: has stirred up one from the east
  simplified_phrase: has raised up a man from the east
  preserved_meaning: Someone is caused to arise from the east for action.
  reasoning_layer_used: POB lexical decision for הֵעִיר and theological decision to leave the figure unnamed
  rationale: “Raised up a man” is clearer while avoiding an imported identification.
- pob_phrase: He gives nations before him and subdues kings
  simplified_phrase: He hands nations over to this man and brings kings under his power
  preserved_meaning: The one who raised the man gives him victory over nations and kings.
  reasoning_layer_used: POB lexical decisions for יִתֵּן לְפָנָיו גּוֹיִם and וּמְלָכִים יַרְדְּ
  rationale: The recast clarifies the pronouns and the conquest without hiding the difficult clause.
- pob_phrase: he gives them like dust to his sword, like driven stubble to his bow
  simplified_phrase: He makes them like dust before the man’s sword and like wind-driven stubble before his bow
  preserved_meaning: The defeated peoples are helpless before the conqueror’s weapons, like dust and dry stalks blown away.
  reasoning_layer_used: POB lexical decisions for יִתֵּן כֶּעָפָר חַרְבּוֹ and כְּקַשׁ נִדָּף קַשְׁתּוֹ
  rationale: Ordinary clause order makes both source images immediately understandable.
interpretive_expansions:
- pob_phrase: to his feet
  rendering: to serve at his feet
  claim: The summoned man follows and stands ready for the one who raised him.
  evidence:
  - The POB rationale says the phrase can express attendance, following, or being at someone’s disposal.
  - The wording retains the source image of the feet.
  confidence: moderate
  alternatives_preserved:
  - follow at his feet
  - be at his disposal
translation_notes:
  risk_flags:
  - risk: “In righteousness” may also express justice, vindication, or victory.
    mitigation: Footnote a preserves the principal lexical alternatives.
  - risk: The Hebrew clause about kings is textually and syntactically difficult.
    mitigation: Footnote c preserves another major reading without weakening the main conquest sense.
