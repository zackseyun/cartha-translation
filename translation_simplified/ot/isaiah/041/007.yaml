translation:
  language: en
  text: The craftsman helps the metalworker, and the worker who smooths with a hammer helps the one who strikes the anvil. He says about the joining, “It is good.” Then he fastens it with nails so it will not wobble.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may refer to the joining process or material, perhaps solder, and the final words may also mean “so it will not be moved” or “so it will not topple.”
    reason: lexical_alternative
