  preserved_meaning: Their actions and products accomplish nothing.
  reasoning_layer_used: lexical decision for מַעֲשֵׂיהֶם
  rationale: The wording makes the broad sense of “works” clear without limiting it to objects alone.
- pob_phrase: Their cast images are wind and emptiness
