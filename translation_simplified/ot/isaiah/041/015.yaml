  language: en
  text: Look! I have made you a new, sharp board for threshing grain, with cutting edges.[a] You will thresh the mountains and crush them. You will make the hills like chaff.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “possessing edges” or “possessing mouths”; it may describe many cutting edges or serrated teeth.
    reason: lexical_alternative
  - marker: b
    text: Chaff is the light husk separated from grain during threshing.
    reason: cultural_note
