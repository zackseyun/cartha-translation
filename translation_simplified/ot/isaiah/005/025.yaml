translation:
  language: en
  text: So Yahweh’s anger burned against his people. He reached out his hand against them and struck them. The mountains shook, and their dead bodies were like refuse[a] in the streets. Even after all this, his anger has not turned away. His hand is still stretched out against them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “sweepings”; the Hebrew refers to something swept away or discarded.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Therefore the anger of Yahweh burned against his people, and he stretched out his hand against them and struck them
  simplified_phrase: So Yahweh’s anger burned against his people. He reached out his hand against them and struck them.
  preserved_meaning: Yahweh’s burning anger leads to active judgment against his own people.
  reasoning_layer_used: Lexical and theological decisions on burning anger and the outstretched hand
  rationale: Short sentences and “reached out” clarify the action while preserving both Hebrew images.
- pob_phrase: the mountains quaked, and their corpses were like refuse in the midst of the streets
  simplified_phrase: The mountains shook, and their dead bodies were like refuse in the streets.
  preserved_meaning: The judgment shakes the mountains and leaves bodies openly discarded in city streets.
  reasoning_layer_used: Lexical decisions for וַיִּרְגְּזוּ, נִבְלָתָם, כַּסּוּחָה, and בְּקֶרֶב חוּצוֹת
  rationale: Common words replace elevated phrasing without softening the scene’s horror.
- pob_phrase: For all this, his anger has not turned away
  simplified_phrase: Even after all this, his anger has not turned away.
  preserved_meaning: The judgment already described has not exhausted Yahweh’s anger.
  reasoning_layer_used: Lexical rationale for the recurring Isaianic refrain
  rationale: “Even after” makes the refrain’s contrast immediately clear.
interpretive_expansions:
- pob_phrase: For all this
  rendering: Even after all this
  claim: The preceding judgment did not bring Yahweh’s anger to an end.
  evidence:
  - The POB rationale says the refrain marks the insufficiency of prior judgment to exhaust divine anger.
  confidence: high
  alternatives_preserved:
  - For all this
  - Despite all this
- pob_phrase: his hand is still stretched out
  rendering: His hand is still stretched out against them.
  claim: The outstretched hand continues to threaten judgment against his people.
  evidence:
  - The same verse first says Yahweh stretched out his hand against his people and struck them.
  - The POB rationale identifies the final image as ongoing punitive action.
  confidence: high
  alternatives_preserved:
  - His hand is still stretched out
