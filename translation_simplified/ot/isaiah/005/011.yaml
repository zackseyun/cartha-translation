  preserved_meaning: They eagerly seek alcoholic drink other than wine.
  reasoning_layer_used: POB lexical decisions for שֵׁכָר and יִרְדֹּפוּ
  rationale: “Intoxicating drink” avoids suggesting only distilled spirits, while “chase” preserves the pursuit image.
- pob_phrase: who stay late into the evening
  simplified_phrase: and stay up late into the twilight
