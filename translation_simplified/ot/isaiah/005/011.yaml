translation:
  language: en
  text: How terrible for those who get up early to chase after intoxicating drink and stay up late into the twilight[a] until wine inflames them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “until evening”; the Hebrew word refers to twilight, usually dusk here, but its exact nuance can vary.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Woe to those who rise early in the morning
  simplified_phrase: How terrible for those who get up early
  preserved_meaning: The prophetic cry still expresses severe denunciation and impending judgment.
  reasoning_layer_used: POB lexical decisions for הוֹי and מַשְׁכִּימֵי
  rationale: This wording makes the warning immediately understandable while retaining its gravity.
- pob_phrase: pursue strong drink
