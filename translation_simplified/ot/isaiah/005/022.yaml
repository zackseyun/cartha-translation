translation:
  language: en
  text: Woe to those whose heroism is drinking wine and whose strength is mixing intoxicating drinks.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: heroes at drinking wine
  simplified_phrase: whose heroism is drinking wine
  preserved_meaning: The wording keeps the ironic picture of people acting like heroes only in their drinking prowess.
  reasoning_layer_used: POB lexical decision for גִּבּוֹרִים
  rationale: The possessive form makes the sarcasm clear in natural English without removing the heroic image.
- pob_phrase: men of strength at mixing
  simplified_phrase: whose strength is mixing
  preserved_meaning: The parallel claim of supposed strength in preparing alcohol remains distinct from drinking wine.
  reasoning_layer_used: POB lexical decisions for וְאַנְשֵׁי חַיִל and לִמְסֹךְ
  rationale: The recast parallel avoids the stiff phrase “men of strength at” while retaining its irony.
- pob_phrase: strong drink
  simplified_phrase: intoxicating drinks
  preserved_meaning: The phrase still refers broadly to alcoholic beverages rather than one specific type.
  reasoning_layer_used: POB lexical decision for שֵׁכָר
  rationale: “Intoxicating drinks” is clearer to modern readers and avoids suggesting only high-alcohol liquor.
translation_notes:
  risk_flags:
  - risk: The ironic warrior language could be mistaken for sincere praise.
    mitigation: Keeping “Woe” and framing drinking as their supposed heroism preserves the denunciation.
