  preserved_meaning: Yahweh’s divine title presents him as ruler over every host.
  reasoning_layer_used: POB lexical decision for צְבָאוֹת
  rationale: “Armies” makes the old term “hosts” understandable while the note preserves its breadth.
- pob_phrase: is exalted in justice
  simplified_phrase: shows how exalted he is by carrying out justice
  preserved_meaning: Yahweh’s lofty status is displayed through his just judgment.
  reasoning_layer_used: POB lexical rationale and immediate judgment context
  rationale: The active wording clearly connects his exalted status with his exercise of justice.
- pob_phrase: is shown holy in righteousness
  simplified_phrase: shows that he is holy by acting in righteousness
  preserved_meaning: God’s righteous action reveals his holiness without making him become holy.
  reasoning_layer_used: POB theological decision on divine holiness
  rationale: The recast clause avoids an awkward passive and protects God’s unchanging holiness.
interpretive_expansions:
- pob_phrase: in justice ... in righteousness
  rendering: by carrying out justice ... by acting in righteousness
  claim: Justice and righteousness are the actions through which Yahweh’s exalted status and holiness are displayed.
