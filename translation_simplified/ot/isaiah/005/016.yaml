translation:
  language: en
  text: But Yahweh of Armies[a] shows how exalted he is by carrying out justice.[b] The Holy God shows that he is holy by acting in righteousness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This title includes more than human armies; it also points to the armies of heaven.
    reason: cultural_note
  - marker: b
    text: The Hebrew may also be translated “by carrying out judgment.”
    reason: lexical_alternative
