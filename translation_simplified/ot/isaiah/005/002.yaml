translation:
  language: en
  text: He prepared the soil, cleared away the stones, and planted the vineyard with fine grapevines. He built a tower in the middle of it and carved out a winepress there. He expected a crop of grapes, but instead it produced wild grapes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “worthless grapes” or “bad fruit.” The Hebrew refers to poor or foul fruit rather than the good grapes he expected.
    reason: lexical_alternative
