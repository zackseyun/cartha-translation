  simplified_phrase: the planting he delighted in
  preserved_meaning: Judah remains pictured as what God planted and cherished.
  reasoning_layer_used: lexical decision for נְטַע שַׁעֲשׁוּעָיו
  rationale: The active clause expresses the possessive phrase in natural English without losing the agricultural image.
- pob_phrase: He looked for justice, but behold, bloodshed; for righteousness, but behold, an outcry
  simplified_phrase: He looked for justice, but instead there was bloodshed. He looked for righteousness, but instead there was an outcry.
  preserved_meaning: Both contrasts between God's expectation and Israel's wrongdoing remain distinct and emphatic.
  reasoning_layer_used: lexical decisions and source parallelism
  rationale: Two complete sentences make the parallel contrasts immediately clear.
