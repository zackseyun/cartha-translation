translation:
  language: en
  text: For the vineyard of Yahweh of Armies is the house of Israel, and the men of Judah are the planting he delighted in. He looked for justice, but instead there was bloodshed. He looked for righteousness, but instead there was an outcry.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In Hebrew, the words for “justice” and “bloodshed” sound alike, as do the words for “righteousness” and “outcry.” This wordplay sharpens the contrast between what Yahweh sought and what he found.
    reason: source_note
