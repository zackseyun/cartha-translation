translation:
  language: en
  text: Therefore my people go into exile because they lack knowledge. Their prominent people are dying of hunger, and their great crowd is parched with thirst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “their nobles.” The Hebrew describes the honored or prominent people of the nation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: for lack of knowledge
  simplified_phrase: because they lack knowledge
  preserved_meaning: Their lack of knowledge is the reason for the exile.
  reasoning_layer_used: Lexical decision for מִבְּלִי דָעַת and theological decision on knowledge
  rationale: The causal link is stated directly while “knowledge” keeps its broad prophetic sense.
- pob_phrase: their honored men
  simplified_phrase: their prominent people
  preserved_meaning: The nation’s socially distinguished people are in view.
  reasoning_layer_used: Lexical decision for כְבוֹדוֹ
  rationale: “Prominent people” is clear modern English and does not imply that only males are meant.
- pob_phrase: their multitude
  simplified_phrase: their great crowd
  preserved_meaning: The mass of the nation suffers severe thirst.
  reasoning_layer_used: Lexical decision for הֲמוֹנוֹ
  rationale: The direct possessive keeps the Hebrew relationship without adding an unwarranted “among” idea.
translation_notes:
  risk_flags:
  - risk: “Knowledge” could be understood as merely intellectual information.
    mitigation: The broad term remains because the POB preserves its covenantal and moral range.
  - risk: “Prominent people” replaces the literal image of the nation’s “glory.”
    mitigation: The wording follows the POB lexical decision, and the footnote preserves “nobles” as an alternative.
