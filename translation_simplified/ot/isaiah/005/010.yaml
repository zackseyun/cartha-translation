translation:
  language: en
  text: For a vineyard large enough for ten teams of oxen to work will yield only one small measure of wine, and a large measure of seed will yield only one small measure of grain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebrew uses ancient measures: the vineyard yields one bath of liquid, while a homer of seed yields only one ephah of grain. The point is that a great deal of land and seed will produce very little.'
    reason: cultural_note
