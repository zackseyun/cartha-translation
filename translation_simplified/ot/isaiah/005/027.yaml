  simplified_phrase: No one dozes or sleeps
  preserved_meaning: The force remains constantly alert without even light sleep.
  reasoning_layer_used: The lexical decisions distinguish יָנוּם from יִישָׁן.
  rationale: “Dozes” is more familiar than “slumbers” while preserving the two degrees of sleep.
- pob_phrase: the belt at his waist is not loosened, and the strap of his sandals is not broken
  simplified_phrase: No soldier’s belt comes loose, and no sandal strap breaks
  preserved_meaning: Each soldier’s clothing and footwear stay securely fastened and ready for action.
  reasoning_layer_used: The lexical decisions for belt, waist, loosened, strap, broken, and sandals.
  rationale: The active wording is easier to read and keeps both concrete equipment images.
