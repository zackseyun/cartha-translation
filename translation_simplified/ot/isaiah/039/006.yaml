  rationale: The singular expression is more natural in common English while retaining the prophetic warning.
- pob_phrase: all that is in your house, and what your fathers have stored up
  simplified_phrase: everything in your house and everything your fathers have stored up
  preserved_meaning: Both the contents of the house and the accumulated wealth will be taken.
  reasoning_layer_used: POB lexical decisions for house and stored wealth
  rationale: Repeating “everything” makes the full extent of the loss immediately clear.
- pob_phrase: will be carried to Babylon; not a thing will be left
