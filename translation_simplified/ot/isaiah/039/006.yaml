translation:
  language: en
  text: “Look! The time is coming when everything in your house and everything your fathers[a] have stored up to this day will be carried away to Babylon. Nothing will be left,” says Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “your ancestors.” The Hebrew literally says “your fathers.”
    reason: lexical_alternative
