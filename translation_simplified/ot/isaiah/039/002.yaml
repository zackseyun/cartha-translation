translation:
  language: en
  text: 'Hezekiah was glad that the envoys had come.[a] He showed them everything in his treasure house: the silver, gold, spices, and fine oil. He also showed them his entire armory[b] and everything stored in his storehouses. Hezekiah showed them everything in his house and everywhere under his rule.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean that Hezekiah was pleased with the envoys or rejoiced because of them and their gifts.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew expression may refer more broadly to a building that held his equipment.
    reason: alternative_reading
