translation:
  language: en
  text: Then Yahweh said, “Just as my servant Isaiah went around naked[a] and barefoot for three years as a sign and an omen against Egypt and Cush,[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “stripped,” perhaps meaning that he wore only a loincloth or undergarment rather than being completely nude.
    reason: lexical_alternative
  - marker: b
    text: Cush was the region south of Egypt, often associated with Nubia; some translations call it Ethiopia.
    reason: cultural_note
simplification_decisions:
- pob_phrase: has walked naked and barefoot
  simplified_phrase: went around naked and barefoot
  preserved_meaning: Isaiah continually appeared without normal clothing and footwear during the sign-act.
  reasoning_layer_used: POB lexical decisions for הָלַךְ, עָרוֹם, and וְיָחֵף
  rationale: “Went around” expresses the ongoing public action more naturally while retaining “naked” and “barefoot.”
- pob_phrase: a sign and a portent
  simplified_phrase: a sign and an omen
  preserved_meaning: Isaiah's action both signified and foreshadowed judgment.
  reasoning_layer_used: POB lexical decision for אוֹת וּמוֹפֵת
  rationale: “Omen” is more familiar than “portent” and preserves the distinct prophetic warning.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “naked” as necessarily meaning complete nudity.
    mitigation: Footnote a preserves the documented possibility that Isaiah was stripped only to an undergarment.
