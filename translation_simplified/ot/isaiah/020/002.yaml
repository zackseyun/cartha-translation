translation:
  language: en
  text: 'At that time, Yahweh spoke through Isaiah son of Amoz: “Go, take the sackcloth off your waist and your sandals off your feet.” Isaiah did this and went around naked[a] and barefoot.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “stripped” or “bare,” perhaps inadequately clothed rather than completely nude.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: spoke by the hand of Isaiah son of Amoz, saying
  simplified_phrase: spoke through Isaiah son of Amoz
  preserved_meaning: Yahweh delivered his words through Isaiah as his prophet.
  reasoning_layer_used: POB lexical decision on דִּבֶּר ... בְּיַד
  rationale: “Through” expresses the Hebrew mediation formula in natural modern English.
- pob_phrase: loosen the sackcloth from your waist
  simplified_phrase: take the sackcloth off your waist
  preserved_meaning: Isaiah was commanded to remove the sackcloth he wore at his waist.
  reasoning_layer_used: POB lexical decisions on וּפִתַּחְתָּ and הַשַּׂק
  rationale: The simpler action wording makes the intended result immediately clear.
- pob_phrase: And he did so, walking naked and barefoot
  simplified_phrase: Isaiah did this and went around naked and barefoot
  preserved_meaning: Isaiah carried out the command and continued publicly without normal clothing or footwear.
  reasoning_layer_used: POB lexical decisions on וַיַּעַשׂ כֵּן, הָלֹךְ, עָרוֹם, and יָחֵף
  rationale: Naming Isaiah and using “went around” removes ambiguity while retaining the sign-act’s force.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “naked” only as complete nudity.
    mitigation: The footnote preserves the documented possibility that Isaiah was stripped down or inadequately clothed.
