translation:
  language: en
  text: Do not label as a conspiracy everything that this people calls a conspiracy. Do not fear what they fear, and do not be terrified.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: call conspiracy everything that this people calls conspiracy
  simplified_phrase: label as a conspiracy everything that this people calls a conspiracy
  preserved_meaning: They must not adopt the people's alarmist label of conspiracy.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Label as” clearly expresses assigning the same conspiratorial judgment while retaining “this people.”
- pob_phrase: nor be in dread
  simplified_phrase: and do not be terrified
  preserved_meaning: The final command intensifies the warning against fear.
  reasoning_layer_used: lexical decision for תַעֲרִיצוּ
  rationale: “Be terrified” is common English and preserves the stronger force beyond ordinary fear.
translation_notes:
  risk_flags:
  - risk: “Conspiracy” may suggest that a secret plot has been proven.
    mitigation: The wording presents conspiracy as the people's label rather than confirming its truth.
  - risk: “What they fear” may refer to either the people's fear or its object.
    mitigation: The broad POB wording is retained without making the feared referents plural.
