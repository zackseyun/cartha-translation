translation:
  language: en
  text: Look! I and the children Yahweh has given me are signs and wonders in Israel. These signs and wonders come from Yahweh of Armies,[a] who lives on Mount Zion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
