simplification_decisions:
- pob_phrase: Behold, I and the children
  simplified_phrase: Look! I and the children
  preserved_meaning: Isaiah calls attention to himself and his children together.
  reasoning_layer_used: Lexical decisions for הִנֵּה and אָנֹכִי
  rationale: “Look!” gives the attention call in clear modern English without adding self-presentation.
- pob_phrase: are for signs and wonders in Israel from Yahweh of Armies
  simplified_phrase: are signs and wonders in Israel. These signs and wonders come from Yahweh of Armies
  preserved_meaning: Isaiah and his children function as signs and wonders whose source is Yahweh.
  reasoning_layer_used: Lexical decisions for לְאֹתוֹת, וּלְמוֹפְתִים, and מֵעִם
  rationale: Two sentences make the function and divine source easier to follow.
- pob_phrase: who dwells on Mount Zion
  simplified_phrase: who lives on Mount Zion
  preserved_meaning: Yahweh is characteristically present on Mount Zion.
  reasoning_layer_used: Lexical decision for הַשֹּׁכֵן
  rationale: “Lives” expresses ongoing residence in more common English.
translation_notes:
  risk_flags:
  - risk: “Look!” may sound less formally prophetic than “Behold.”
    mitigation: It preserves the source marker’s direct attention-calling force.
  - risk: “Lives on Mount Zion” could be mistaken for limiting Yahweh to one place.
    mitigation: The wording states the POB’s location without claiming exclusivity.
