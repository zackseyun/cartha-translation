translation:
  language: en
  text: When people say to you, “Ask mediums and spiritists for guidance—the ones who chirp and mutter,” should not a people ask their God for guidance? Should they ask the dead for guidance on behalf of the living?
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And when they say to you
  simplified_phrase: When people say to you
  preserved_meaning: This introduces an expected situation without identifying particular speakers.
  reasoning_layer_used: Lexical decisions for וְכִי and יֹאמְרוּ אֲלֵיכֶם
  rationale: “People” makes the indefinite plural natural in English.
- pob_phrase: Consult the mediums and the spiritists
  simplified_phrase: Ask mediums and spiritists for guidance
  preserved_meaning: The occult practitioners are approached as sources of guidance.
  reasoning_layer_used: Lexical decisions for דִּרְשׁוּ, הָאֹבוֹת, and הַיִּדְּעֹנִים
  rationale: This explains the contextual meaning of “consult” in everyday language.
- pob_phrase: Should they consult the dead on behalf of the living?
  simplified_phrase: Should they ask the dead for guidance on behalf of the living?
  preserved_meaning: The verse rebukes seeking guidance from the dead for those who are alive.
  reasoning_layer_used: Lexical and theological decisions for בְּעַד הַחַיִּים and אֶל הַמֵּתִים
  rationale: Repeating “guidance” preserves the contrast between asking God and asking the dead.
interpretive_expansions:
- pob_phrase: Consult
  rendering: Ask ... for guidance
  claim: The consultation is specifically a search for guidance.
  evidence:
  - The lexical rationale defines דרש here as seeking guidance from a source.
  - The theological audit identifies the proper source of guidance as the verse’s central contrast.
  confidence: high
  alternatives_preserved:
  - consult
  - inquire of
translation_notes:
  risk_flags:
  - risk: Modern readers may hear “chirp” as humorous rather than eerie.
    mitigation: Pairing it with “mutter” preserves the strange occult-speech image.
