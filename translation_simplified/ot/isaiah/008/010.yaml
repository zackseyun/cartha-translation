translation:
  language: en
  text: Make a plan—it will fail. Speak a word—it will not succeed, because God is with us.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “with us is God,” echoing the name Immanuel (“God with us”) in Isaiah 7:14 and 8:8.
    reason: cross_reference
simplification_decisions:
- pob_phrase: Make a plan, and it will be thwarted
  simplified_phrase: Make a plan—it will fail
  preserved_meaning: The opponents are challenged to plan, but their plan will be defeated.
  reasoning_layer_used: Lexical decisions for עֻצוּ, עֵצָה, and וְתֻפָר
  rationale: “It will fail” gives the outcome in more familiar English than “it will be thwarted.”
- pob_phrase: speak a word, and it will not stand
  simplified_phrase: Speak a word—it will not succeed
  preserved_meaning: What the opponents say will not be established or accomplish its purpose.
  reasoning_layer_used: Lexical decisions for דַּבְּרוּ, דָבָר, and וְלֹא יָקוּם
  rationale: “Will not succeed” clearly conveys failure without claiming that the word has no effect at all.
translation_notes:
  risk_flags:
  - risk: “Will not succeed” does not retain the source image of a word failing to stand.
    mitigation: It preserves the audited contextual sense that the spoken matter will not be established.
