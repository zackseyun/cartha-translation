translation:
  language: en
  text: For the land that suffered anguish will no longer be covered in gloom.[a] In the past, he brought disgrace on the lands of Zebulun and Naphtali. But in the days to come, he will bring glory to the road by the sea, the region across the Jordan, and Galilee of the nations.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew at the start of the verse is difficult; “gloom” may also mean “darkness” or “dimness.”
    reason: lexical_alternative
  - marker: b
    text: This may also be translated “Galilee of the Gentiles”; the Hebrew literally says “Galilee of the nations.”
    reason: lexical_alternative
  - marker: c
    text: Matthew 4:15–16 connects this region with the beginning of Jesus’ public ministry.
    reason: cross_reference
