translation:
  language: en
  text: Be shattered,[a] you peoples, and be broken! Listen, all distant parts of the earth. Prepare yourselves for battle, and be broken! Prepare yourselves for battle, and be broken!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
