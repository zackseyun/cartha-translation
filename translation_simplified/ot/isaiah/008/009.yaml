  preserved_meaning: The verse directly addresses multiple hostile peoples and announces their ruin.
  reasoning_layer_used: POB lexical and theological decisions on רֹעוּ and עַמִּים
  rationale: Replacing “O” with “you” makes the direct address natural while retaining the chosen judgment reading.
- pob_phrase: Strap yourselves on for battle
