translation:
  language: en
  text: Treat Yahweh[a] of hosts[b] as holy. Let him be the one you fear and the one you dread.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh is the personal divine name represented by YHWH in Hebrew.
    reason: source_note
  - marker: b
    text: Hosts means armies and may include both heavenly and earthly forces.
    reason: cultural_note
simplification_decisions:
- pob_phrase: you shall regard him as holy
  simplified_phrase: Treat Yahweh of hosts as holy
  preserved_meaning: People must acknowledge and honor Yahweh's holiness, not make him holy.
  reasoning_layer_used: POB lexical and theological decisions on אֹתוֹ תַקְדִּישׁוּ
  rationale: The direct command is easier to understand while preserving the holiness emphasis.
- pob_phrase: Let him be your fear
  simplified_phrase: Let him be the one you fear
  preserved_meaning: Yahweh is to be the object of their fear and reverence.
  reasoning_layer_used: POB lexical decision on מוֹרַאֲכֶם
  rationale: Naming him as the one feared makes the Hebrew predicate natural in English.
- pob_phrase: and let him be your dread
  simplified_phrase: and the one you dread
  preserved_meaning: The second phrase heightens fear into intense dread.
  reasoning_layer_used: POB lexical decision on מַעֲרִצְכֶם and Hebrew parallelism
  rationale: The shorter parallel wording remains forceful and keeps fear and dread distinct.
