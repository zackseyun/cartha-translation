  text: He will judge between the nations and settle disputes for many peoples.[a] They will hammer their swords into plow blades and their spears into pruning knives. No nation will raise a sword against another nation, and they will no longer train for war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “correct many peoples” or “arbitrate for many peoples.”
    reason: lexical_alternative
