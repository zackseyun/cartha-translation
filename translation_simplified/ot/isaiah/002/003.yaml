translation:
  language: en
  text: Many peoples will come[a] and say, “Come, let us go up to Yahweh’s mountain, to the house of the God of Jacob, so he may teach us his ways and we may follow his paths.” For Yahweh’s instruction[b] will go out from Zion, and his word from Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “go” or “walk”; here it describes peoples moving toward Zion.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word torah can also mean “law” or “teaching.”
    reason: lexical_alternative
