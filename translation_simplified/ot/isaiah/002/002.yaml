translation:
  language: en
  text: In the latter days[a], the mountain of Yahweh’s house will stand firmly as the highest of the mountains[b]. It will rise above the hills, and all the nations will stream to it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in the last days” or “in days to come.”
    reason: alternative_reading
  - marker: b
    text: Or “will be firmly established on top of the mountains.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: shall be established as the highest of the mountains
  simplified_phrase: will stand firmly as the highest of the mountains
  preserved_meaning: The mountain will be secure and preeminent.
  reasoning_layer_used: Lexical decision for נָכוֹן יִהְיֶה and theological decision on the mountain’s exaltation
  rationale: “Stand firmly” expresses secure establishment in more familiar English.
- pob_phrase: and shall be lifted up above the hills
  simplified_phrase: It will rise above the hills
  preserved_meaning: The mountain is pictured as elevated over the hills.
  reasoning_layer_used: Lexical decision for וְנִשָּׂא מִגְּבָעוֹת
  rationale: A new sentence and active wording make the image easier to follow.
- pob_phrase: and all the nations shall stream to it
  simplified_phrase: and all the nations will stream to it
  preserved_meaning: Every nation is pictured flowing toward the mountain like a river.
  reasoning_layer_used: Lexical decisions for וְנָהֲרוּ and כָּל הַגּוֹיִם
  rationale: The familiar future form keeps the striking river image intact.
