simplification_decisions:
- pob_phrase: all the high mountains, and against all the lofty hills
  simplified_phrase: every high mountain and every lofty hill
  preserved_meaning: The judgment is directed against each elevated mountain and hill in the poetic catalogue.
  reasoning_layer_used: lexical decisions for וְעַל, כָּל, הֶהָרִים, and הַגְּבָעוֹת
  rationale: “Every” preserves the distributive force while making the parallel line concise and natural.
- pob_phrase: lofty hills
  simplified_phrase: lofty hill
  preserved_meaning: The hills have a fixed elevated quality without implying that they are moving upward.
  reasoning_layer_used: lexical and theological decisions for הַנִּשָּׂאוֹת
  rationale: “Lofty” naturally conveys raised terrain while leaving any symbolism to the wider context.
translation_notes:
  risk_flags:
