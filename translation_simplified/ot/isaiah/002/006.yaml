  simplified_phrase: they have embraced practices from the east
  preserved_meaning: The people are characterized by adopting practices that came from the east.
  reasoning_layer_used: lexical and theological decisions
  rationale: This clarifies adoption without treating eastern origin alone as the offense.
- pob_phrase: they strike hands with
  simplified_phrase: they join hands with
  preserved_meaning: They associate or make common cause with others, possibly through agreements.
  reasoning_layer_used: lexical decision and revision history
  rationale: “Join hands” keeps the hand image while leaving the rare verb broad.
- pob_phrase: the children of foreigners
  simplified_phrase: the children of foreigners
  preserved_meaning: The phrase identifies children or offspring of foreigners without extending it to remote ancestry.
  reasoning_layer_used: lexical decision and grounding review
  rationale: Retaining the POB wording avoids the unsupported breadth of “descendants.”
