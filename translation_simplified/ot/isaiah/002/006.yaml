translation:
  language: en
  text: For you have forsaken your people, the house of Jacob, because they have embraced practices from the east,[a] practice divination like the Philistines, and join hands with the children of foreigners.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally “from the east”; this likely means practices or influences that came from the east.
