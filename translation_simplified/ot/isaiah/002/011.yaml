translation:
  language: en
  text: Man’s proud look[a] will be brought down, and the pride of men will be humbled. On that day, Yahweh alone will be exalted.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “man” and “men” refer to humanity; the Hebrew pictures pride shown in a person’s eyes and bearing.
