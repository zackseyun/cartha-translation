  preserved_meaning: The explicit kidney fat of sacrificed rams remains in view.
  reasoning_layer_used: Lexical decision for מֵחֵלֶב כִּלְיוֹת אֵילִים
  rationale: The possessive construction is natural English and avoids adding an unsupported anatomical relation.
