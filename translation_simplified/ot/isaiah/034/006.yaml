translation:
  language: en
  text: Yahweh’s sword is full of blood and coated with fat—the blood of lambs and goats,[a] and the fat of rams’ kidneys. For Yahweh has a sacrifice in Bozrah,[b] and a great slaughter in the land of Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew specifically refers to male goats.
    reason: lexical_alternative
  - marker: b
    text: Or “there is a sacrifice for Yahweh in Bozrah.” The Hebrew clause has no verb and can be understood either way.
    reason: alternative_reading
