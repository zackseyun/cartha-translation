  preserved_meaning: The sword belongs to Yahweh and serves as his instrument of judgment.
  reasoning_layer_used: Lexical decision for לַיהוָה
  rationale: The possessive form is shorter and more natural while preserving Yahweh’s relation to the sword.
- pob_phrase: it is made fat with fat
  simplified_phrase: coated with fat
  preserved_meaning: The sword is covered with sacrificial animal fat.
  reasoning_layer_used: Lexical decision for הֻדַּשְׁנָה and theological decision on sacrificial imagery
  rationale: “Coated” makes the physical image clear while retaining the sacrificial fat imagery.
- pob_phrase: with the fat of the kidneys of rams
