translation:
  language: en
  text: Her palaces will be overgrown with thorns, and nettles and brambles will fill her fortresses. She will become a home for jackals and a pasture for ostriches.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “daughters of the ostrich,” an idiom meaning ostriches.
    reason: source_note
simplification_decisions:
- pob_phrase: Thorns will grow over her palaces
  simplified_phrase: Her palaces will be overgrown with thorns
  preserved_meaning: Thorny plants will spread across the ruined palaces.
  reasoning_layer_used: Lexical decision for וְעָלְתָה and אַרְמְנֹתֶיהָ
  rationale: The passive wording presents the image of abandoned buildings covered by vegetation more directly.
- pob_phrase: nettles and brambles in her fortresses
  simplified_phrase: nettles and brambles will fill her fortresses
  preserved_meaning: Invasive wild plants will occupy the fortified structures.
  reasoning_layer_used: Lexical decisions for קִמּוֹשׂ, וָחוֹחַ, and בְּמִבְצָרֶיהָ
  rationale: Adding a plain verb makes the compressed Hebrew parallel easy to follow.
- pob_phrase: a haunt of jackals
  simplified_phrase: a home for jackals
  preserved_meaning: The desolate place will become inhabited by jackals.
  reasoning_layer_used: Lexical decisions for נְוֵה and תַנִּים
  rationale: “Home” clearly communicates an animal dwelling place without the potentially supernatural sense of “haunt.”
