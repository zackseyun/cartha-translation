translation:
  language: en
  text: Wild oxen[a] will fall along with them, and young bulls will fall with the mighty ones.[b] Their land will be soaked with blood, and fat will enrich its dust.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The exact animal is uncertain; it may have been an oryx or another powerful wild bovine.
    reason: lexical_alternative
  - marker: b
    text: “Mighty ones” may mean powerful warriors, strong bulls, or both within the poetic image.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: will fall with them
  simplified_phrase: will fall along with them
  preserved_meaning: The wild oxen are struck down together with the others under judgment.
  reasoning_layer_used: Lexical decision for וְיָרְדוּ and עִמָּם
  rationale: “Along with” makes the shared fate immediately clear without naming an uncertain antecedent.
- pob_phrase: their land will be drenched with blood
  simplified_phrase: Their land will be soaked with blood
  preserved_meaning: The land is saturated by blood in the scene of violent judgment.
  reasoning_layer_used: Lexical decisions for וְרִוְּתָה and מִדָּם
  rationale: “Soaked” is common English that keeps the force of the gruesome saturation image.
- pob_phrase: their dust made rich with fat
  simplified_phrase: fat will enrich its dust
  preserved_meaning: Fat from the fallen makes the land’s dust rich.
  reasoning_layer_used: Lexical decisions for וַעֲפָרָם, מֵחֵלֶב, and יְדֻשָּׁן
  rationale: The active clause is easier to read while preserving both the concrete dust and enriching fat.
