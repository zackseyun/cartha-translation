translation:
  language: en
  text: For Yahweh is angry with all the nations, and his wrath is against all their forces.[a] He has devoted them to destruction[b] and handed them over to be slaughtered.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “all their armies.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew describes devoting something to destruction under divine judgment, sometimes called putting it under the ban.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: has indignation against all the nations
  simplified_phrase: is angry with all the nations
  preserved_meaning: Yahweh’s heightened judicial anger is directed against all the nations.
  reasoning_layer_used: POB lexical decision for קֶצֶף
  rationale: Common wording makes the anger clear, while “wrath” preserves the verse’s solemn force.
- pob_phrase: against all their host
  simplified_phrase: against all their forces
  preserved_meaning: The judgment includes the nations’ collective military or assembled strength.
  reasoning_layer_used: POB lexical decision for צְבָאָם
  rationale: “Forces” is clearer than “host” without limiting the term to formal armies.
- pob_phrase: he has given them over to the slaughter
  simplified_phrase: handed them over to be slaughtered
  preserved_meaning: Yahweh has judicially delivered them over to slaughter.
  reasoning_layer_used: POB lexical decisions for נְתָנָם and לַטָּבַח
  rationale: The active wording expresses the same handing-over and slaughter in natural English.
translation_notes:
  risk_flags:
  - risk: “Devoted” may suggest positive religious dedication to some readers.
    mitigation: Footnote b identifies this as destruction under divine judgment.
