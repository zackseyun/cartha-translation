simplification_decisions:
- pob_phrase: Her wadis
  simplified_phrase: Her streambeds
  preserved_meaning: The channels in Edom’s dry landscape will be transformed under judgment.
  reasoning_layer_used: POB lexical decision for נְחָלֶיהָ and its preserved alternatives
  rationale: “Streambeds” communicates the geographic image without requiring readers to know “wadis.”
- pob_phrase: will be turned into pitch
  simplified_phrase: will become pitch
  preserved_meaning: The streambeds undergo the same prophetic transformation into pitch.
  reasoning_layer_used: POB lexical decision for נֶהֶפְכוּ
  rationale: “Will become” states the result naturally while retaining the transformation image.
- pob_phrase: and her dust into sulfur; her land will become burning pitch
  simplified_phrase: Her dust will become sulfur, and her land will become burning pitch.
  preserved_meaning: The dust and the whole land are each portrayed as transformed into substances of fiery judgment.
  reasoning_layer_used: POB lexical decisions and theological decision on feminine personification
  rationale: A new sentence makes the parallel transformations easier to follow while preserving “her” throughout.
