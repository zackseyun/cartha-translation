translation:
  language: en
  text: Her streambeds[a] will become pitch. Her dust will become sulfur, and her land will become burning pitch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “streams.” The Hebrew refers to wadis, which may be streambeds or seasonal streams.
