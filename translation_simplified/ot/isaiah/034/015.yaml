translation:
  language: en
  text: There the arrow snake[a] will make its nest and lay its eggs. She will hatch them and shelter them in her shadow.[b] Yes, birds of prey called kites[c] will gather there, each with her mate.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word is uncertain; it may refer to an owl or another desert creature.
    reason: alternative_reading
  - marker: b
    text: Or “brood over them in her shade.”
    reason: lexical_alternative
  - marker: c
    text: The Hebrew may refer to vultures or to birds of prey more generally.
    reason: alternative_reading
