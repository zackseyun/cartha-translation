  rationale: Naming the land clarifies the feminine pronoun without suggesting legal inheritance.
- pob_phrase: will dwell in her
  simplified_phrase: will live there
  preserved_meaning: The owl and raven will remain as inhabitants of the ruined land.
  reasoning_layer_used: Lexical decision for יִשְׁכְּנוּ בָהּ
  rationale: Common wording preserves the image of continuing habitation.
- pob_phrase: he will stretch over her the measuring line of desolation and the plumb stones of emptiness
