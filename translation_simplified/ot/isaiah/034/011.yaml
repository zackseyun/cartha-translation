translation:
  language: en
  text: The desert owl and the hedgehog will take possession of the land.[a] The owl and the raven will live there. He will stretch a measuring line of desolation over it and use plumb stones of emptiness.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The exact animals are uncertain. “Desert owl” may instead refer to a pelican or cormorant, and “hedgehog” to a porcupine or bittern.
    reason: lexical_alternative
  - marker: b
    text: “Desolation” and “emptiness” echo Genesis 1:2 and picture the land as creation being undone.
    reason: cross_reference
