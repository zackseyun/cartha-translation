translation:
  language: en
  text: Desert creatures will meet hyenas,[a] and one goat-demon will call to another. Yes, Lilith[b] will settle there and find a place to rest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “jackals”; the exact animal meant by the Hebrew word is uncertain.
    reason: lexical_alternative
  - marker: b
    text: “Lilith” may also be translated “night creature” or “night monster”; some older translations say “screech owl.”
    reason: lexical_alternative
