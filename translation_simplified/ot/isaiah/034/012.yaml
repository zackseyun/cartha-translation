simplification_decisions:
- pob_phrase: They will call its nobles
  simplified_phrase: Its nobles will be called
  preserved_meaning: Unspecified people will call for Edom’s nobles without specifying the kind of call.
  reasoning_layer_used: POB main text and difficult-syntax decision
  rationale: The passive removes the unclear “they” while avoiding the narrower idea of an official summons.
- pob_phrase: there will be no kingdom there
  simplified_phrase: no kingdom will exist there
  preserved_meaning: Edom will have no functioning kingdom.
  reasoning_layer_used: Lexical decision for מְלוּכָה
  rationale: “Exist” expresses the kingdom’s absence in direct modern English.
- pob_phrase: all its princes will be nothing
  simplified_phrase: Its princes will all be no more
  preserved_meaning: Edom’s ruling class will cease to exist.
  reasoning_layer_used: Lexical decision for אָפֶס and contextual rationale
  rationale: “Be no more” conveys total disappearance rather than mere worthlessness.
translation_notes:
  risk_flags:
  - risk: The Hebrew may make the nobles the callers rather than those called.
