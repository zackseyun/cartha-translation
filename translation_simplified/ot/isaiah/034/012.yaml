translation:
  language: en
  text: Its nobles will be called,[a] but no kingdom will exist there. Its princes will all be no more.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Its nobles will call, but no kingdom will exist there.” The Hebrew wording is difficult.
