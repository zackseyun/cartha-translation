translation:
  language: en
  text: 'Now then, please make this bet[a] with my master, the king of Assyria: I will give you two thousand horses—if you can supply riders for them.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “make a pledge” or “strike a bargain,” but here it is a mocking challenge.
    reason: lexical_alternative
