translation:
  language: en
  text: Then Eliakim, Shebna, and Joah said to the Rabshakeh[a], “Please speak to us, your servants, in Aramaic. We understand it. Do not speak to us in Judean[b] where the people on the wall can hear.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rabshakeh was probably an Assyrian official title, not a personal name.
    reason: cultural_note
  - marker: b
    text: Or “Hebrew.” The original term refers specifically to the language spoken by the people of Judah.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Please speak to your servants in Aramaic, for we understand it
  simplified_phrase: Please speak to us, your servants, in Aramaic. We understand it.
  preserved_meaning: The officials politely ask for Aramaic and humbly call themselves servants.
  reasoning_layer_used: Lexical decisions for דַּבֶּר נָא, עֲבָדֶיךָ, אֲרָמִית, and שֹׁמְעִים
  rationale: Two short sentences make the diplomatic request easier to follow without losing its deferential tone.
- pob_phrase: in the hearing of the people who are on the wall
  simplified_phrase: where the people on the wall can hear
  preserved_meaning: The speakers do not want those on the wall to overhear the message.
  reasoning_layer_used: Lexical decisions for בְּאָזְנֵי and הָעָם אֲשֶׁר עַל הַחוֹמָה
  rationale: The source idiom is recast as ordinary English while keeping the act of hearing explicit.
- pob_phrase: the Rabshakeh
  simplified_phrase: the Rabshakeh[a]
  preserved_meaning: The uncertain Assyrian office remains an identifiable title without specifying his duties.
  reasoning_layer_used: Lexical decision for רַב שָׁקֵה
  rationale: The title is retained because alternatives such as “field commander” may be too specific.
translation_notes:
