translation:
  language: en
  text: But the Rabshakeh said, “Was it only to your master and you that my master sent me with this message? Did he not also send me to the men sitting on the wall, who will have to eat their own dung and drink their own urine[a] along with you?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses deliberately crude siege language; its written form for “urine” replaces an even cruder expression.
    reason: source_note
