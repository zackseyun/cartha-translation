translation:
  language: en
  text: How could you possibly drive back even one captain from among my master’s lowest-ranking servants, when you rely on Egypt for chariots and horsemen?
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: How then can you repulse a single captain
  simplified_phrase: How could you possibly drive back even one captain
  preserved_meaning: The rhetorical taunt says Judah cannot resist even one subordinate Assyrian officer.
  reasoning_layer_used: POB lexical decisions and doctrine realignment
  rationale: “Drive back” is clearer than “repulse,” while “even one” preserves the emphatic taunt.
- pob_phrase: of the least of my master's servants
  simplified_phrase: from among my master’s lowest-ranking servants
  preserved_meaning: The captain belongs to the lower ranks of the Assyrian king’s servants.
  reasoning_layer_used: POB lexical decision for הַקְטַנִּים
  rationale: The recast wording makes rank, rather than physical size, immediately clear.
- pob_phrase: when you trust in Egypt for chariots and horsemen
  simplified_phrase: when you rely on Egypt for chariots and horsemen
  preserved_meaning: Judah is depending on Egypt to provide military forces.
  reasoning_layer_used: POB lexical decisions for trust, chariots, and horsemen
  rationale: “Rely on” plainly expresses practical military dependence without changing its force.
translation_notes:
  risk_flags:
