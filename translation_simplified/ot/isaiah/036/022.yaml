translation:
  language: en
  text: Then Eliakim son of Hilkiah, the official in charge of the palace, Shebna the secretary, and Joah son of Asaph, the court recorder, went to Hezekiah. Their clothes were torn as a sign of distress. They reported to him what the Rabshakeh[a] had said.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rabshakeh is an Assyrian title for a high-ranking court official, perhaps the chief cupbearer.
    reason: cultural_note
