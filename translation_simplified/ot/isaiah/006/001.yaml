translation:
  language: en
  text: In the year King Uzziah died, I saw the Lord, high and lifted up, sitting on a throne. The hem of his robe filled the temple.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can mean “palace” or “temple”; here it refers to the heavenly sanctuary.
