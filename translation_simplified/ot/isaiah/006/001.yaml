  preserved_meaning: The vision occurred during the year of Uzziah’s death.
  reasoning_layer_used: Lexical decision for בִּשְׁנַת מוֹת
  rationale: A direct verb is clearer than the abstract noun phrase.
- pob_phrase: the Lord seated on a throne, high and lifted up
