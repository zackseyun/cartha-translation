translation:
  language: en
  text: Then I heard the Lord’s voice. He said, “Who should I send? Who will go for us?”[a] I answered, “Here I am, ready to go. Send me.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “for us.” This may refer to God’s heavenly council. Some Christian readers also connect it with the Trinity, but the text does not explain who “us” means.
    reason: alternative_reading
