translation:
  language: en
  text: Yahweh will send the people far away, and many places throughout the land will be left deserted.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “abandonment will be great” or “desolation will be great throughout the land.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: remove people far away
  simplified_phrase: send the people far away
  preserved_meaning: Yahweh causes the population to be taken a great distance away.
  reasoning_layer_used: Lexical decision for וְרִחַק and the applied revision for collective הָאָדָם.
  rationale: “Send” expresses forced removal more naturally while retaining the idea of distance.
- pob_phrase: the forsaken places will be many
  simplified_phrase: many places ... will be left deserted
  preserved_meaning: Large areas will be uninhabited after the people are removed.
  reasoning_layer_used: Lexical and theological decisions for הָעֲזוּבָה.
  rationale: The active wording makes the concrete result of abandonment immediately clear.
- pob_phrase: in the midst of the land
  simplified_phrase: throughout the land
  preserved_meaning: The deserted areas will be widespread within the land.
  reasoning_layer_used: Lexical decision for בְּקֶרֶב הָאָרֶץ.
  rationale: “Throughout” communicates the intended broad spatial extent in ordinary English.
translation_notes:
  risk_flags:
