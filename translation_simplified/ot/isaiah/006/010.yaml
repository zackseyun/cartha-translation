translation:
  language: en
  text: Make the heart of this people dull and unresponsive. Make their ears heavy and their eyes blind,[a] so that they do not see with their eyes, hear with their ears, or understand with their heart, turn back,[b] and be healed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may picture their eyes as shut or smeared over, making them unresponsive.
    reason: lexical_alternative
  - marker: b
    text: Or “return”; in this context, turning back may include repentance.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Make the heart of this people dull
  simplified_phrase: Make the heart of this people dull and unresponsive
  preserved_meaning: The heart remains the inner center of thought and will, made unable to respond.
  reasoning_layer_used: Lexical decisions for הַשְׁמֵן and לֵב
  rationale: “Unresponsive” explains the Hebrew idiom while retaining the biblical term “heart.”
- pob_phrase: make their ears heavy, and blind their eyes
  simplified_phrase: Make their ears heavy and their eyes blind
  preserved_meaning: The distinct images of impaired hearing and sight remain direct divine commands.
  reasoning_layer_used: Lexical and theological decisions for הַכְבֵּד, הָשַׁע, and judicial hardening
  rationale: The shorter parallel structure is easier to read without weakening the imperatives.
- pob_phrase: lest they see ... and hear ... and understand
  simplified_phrase: so that they do not see ... hear ... or understand
  preserved_meaning: The clause retains the stark preventative force of the Hebrew.
  reasoning_layer_used: Lexical decision for פֶּן and theological decision on judicial hardening
  rationale: “So that they do not” is clearer modern English than “lest” while preserving the tension.
