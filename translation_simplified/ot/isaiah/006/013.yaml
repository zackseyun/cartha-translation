translation:
  language: en
  text: Even if a tenth remains in the land, that tenth will again be burned away. It will be like a terebinth or an oak whose stump remains when it is cut down.[a] The holy seed is that stump.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “when its leaves fall.” The Hebrew wording is uncertain; “when it is cut down” best fits the image of a remaining stump.
    reason: lexical_alternative
