translation:
  language: en
  text: Then I said, “Lord, until when?”[a] He answered, “Until the cities lie in ruins, with no one living in them; the houses have no one in them; and the land is devastated and desolate.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “How long, Lord?”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Until when, Lord?
  simplified_phrase: Lord, until when?
  preserved_meaning: Isaiah asks when the judgment will end, while “until” maintains the link to the Lord’s answer.
  reasoning_layer_used: POB lexical decision for עַד מָתַי
  rationale: Moving the address first makes the unusual question easier to read without removing its key wording.
- pob_phrase: cities lie waste, without inhabitant, and houses without man
  simplified_phrase: cities lie in ruins, with no one living in them; the houses have no one in them
  preserved_meaning: The cities are ruined, and no people remain in either the cities or the houses.
  reasoning_layer_used: POB lexical and theological decisions for מֵאֵין יוֹשֵׁב and מֵאֵין אָדָם
  rationale: Direct everyday wording preserves the explicit human absence without suggesting only men are absent.
- pob_phrase: the land is laid waste, a desolation
  simplified_phrase: the land is devastated and desolate
  preserved_meaning: The doubled wording retains the intensified picture of the land’s devastation.
  reasoning_layer_used: POB lexical decisions for תִּשָּׁאֶה and שְׁמָמָה
  rationale: Two coordinated common words preserve the Hebrew’s piled-up devastation language without implying exhaustive totality.
translation_notes:
  risk_flags:
  - risk: “Until when” is less idiomatic than “How long.”
    mitigation: It preserves the POB’s deliberate link with the answer, while the idiomatic alternative remains in a footnote.
