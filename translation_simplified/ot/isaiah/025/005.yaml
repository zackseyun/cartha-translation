translation:
  language: en
  text: Like heat in a dry land, you quiet the uproar of strangers. Like heat weakened by the shade of a cloud, the song of the ruthless is brought low.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The final phrase may also be translated “is silenced” or “is humbled.” The context favors being subdued rather than answering.
    reason: lexical_alternative
