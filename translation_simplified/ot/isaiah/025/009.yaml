    reason: source_note
simplification_decisions:
- pob_phrase: And it will be said on that day
  simplified_phrase: On that day, these words will be spoken
  preserved_meaning: The saying occurs in the future prophetic setting, while the speaker remains unspecified.
  reasoning_layer_used: Lexical decision for וְאָמַר and בַּיּוֹם הַהוּא
  rationale: The passive wording is clearer while avoiding an invented subject.
- pob_phrase: Behold
  simplified_phrase: Look!
  preserved_meaning: The speaker urgently draws attention to the recognized identity of God.
  reasoning_layer_used: Lexical decision for הִנֵּה
  rationale: The direct command preserves the particle’s heightened force in common English.
- pob_phrase: we have waited for him, that he might save us
  simplified_phrase: We have waited for him to save us
  preserved_meaning: The people have waited for God with the expectation that he would rescue them.
  reasoning_layer_used: Lexical decisions for קִוִּינוּ לוֹ and וְיוֹשִׁיעֵנוּ
  rationale: The infinitive expresses the same expected rescue without the awkward purpose clause.
translation_notes:
  risk_flags:
  - risk: “To save us” may be heard only as purpose rather than hopeful expectation.
    mitigation: The retained perfect “have waited” and personal object preserve the POB’s expectant waiting.
