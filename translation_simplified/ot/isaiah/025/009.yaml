translation:
  language: en
  text: 'On that day, these words will be spoken: “Look! This is our God. We have waited for him to save us. This is Yahweh.[a] We have waited for him. Let us rejoice and be glad in his salvation.”'
  philosophy: optimal-equivalence
  footnotes:
