translation:
  language: en
  text: On this mountain, he will swallow up the covering over all peoples.[a] He will swallow up the veil spread over all nations.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the shroud wrapped around all peoples.” The Hebrew repeats related words to emphasize the covering.
    reason: lexical_alternative
  - marker: b
    text: The covering and veil likely point ahead to the swallowing up of death in the next verse, but the image may have a broader meaning.
    reason: cross_reference
