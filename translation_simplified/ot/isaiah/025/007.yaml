  rationale: The shorter phrase keeps the broad metaphor while the footnote preserves the Hebrew repetition.
- pob_phrase: and the veil that is spread over all nations
  simplified_phrase: He will swallow up the veil spread over all nations.
  preserved_meaning: God removes both the covering and the parallel veil from all humanity.
