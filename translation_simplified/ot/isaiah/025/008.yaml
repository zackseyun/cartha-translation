translation:
  language: en
  text: He will swallow up death forever.[a] The Lord Yahweh will wipe away tears from every face. He will remove his people’s public disgrace from the whole earth, for Yahweh has spoken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “He has swallowed up death forever.” The Hebrew describes the promised future act as certain.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: He will swallow up death forever, and the Lord GOD will wipe away tears from every face
  simplified_phrase: He will swallow up death forever. The Lord Yahweh will wipe away tears from every face.
  preserved_meaning: Yahweh will permanently end death and personally remove sorrow.
  reasoning_layer_used: POB lexical decisions, theological decision on YHWH, and optimal-equivalence philosophy
  rationale: Two sentences clarify the promises, while “Yahweh” makes the divine name visible and preserves both images.
- pob_phrase: the reproach of his people
  simplified_phrase: his people’s public disgrace
  preserved_meaning: Yahweh will remove the shame and outward dishonor borne by his people.
  reasoning_layer_used: POB lexical decision for וְחֶרְפַּת עַמּוֹ
  rationale: “Public disgrace” clearly conveys the social force of “reproach.”
- pob_phrase: from all the earth
  simplified_phrase: from the whole earth
  preserved_meaning: The removal of disgrace extends throughout the earth.
  reasoning_layer_used: POB lexical decision for מֵעַל כָּל הָאָרֶץ
  rationale: “The whole earth” is natural English and retains the universal scope.
translation_notes:
  risk_flags:
  - risk: “Public disgrace” may sound narrower than reproach that includes taunting shame.
    mitigation: The phrase retains both shame and its outward social dimension.
