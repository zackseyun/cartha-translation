translation:
  language: en
  text: On this mountain, Yahweh of Armies will make a feast for all the peoples. There will be rich, marrow-filled food and aged wine, well refined.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “fat things” and “wine on the lees”; these images describe an abundant, luxurious feast.
    reason: lexical_alternative
