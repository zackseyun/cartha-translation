translation:
  language: en
  text: 'For look: Yahweh will come in fire[a], with his chariots like a whirlwind, to repay with the fury of his anger and to rebuke with flames of fire.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “with fire”; the Hebrew can describe either accompaniment or the sphere in which he comes.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and his chariots like the whirlwind
  simplified_phrase: with his chariots like a whirlwind
  preserved_meaning: Yahweh’s chariots are part of his coming and are compared to a violent whirlwind.
  reasoning_layer_used: The Hebrew syntax and the lexical decision for סוּפָה.
  rationale: Using “with” makes the compressed phrase readable without giving the chariots a separate verb.
- pob_phrase: to repay his anger in fury
  simplified_phrase: to repay with the fury of his anger
  preserved_meaning: Yahweh comes to execute judicial repayment in intense anger.
  reasoning_layer_used: The lexical decisions for לְהָשִׁיב, חֵמָה, and אַפּוֹ.
  rationale: The recast keeps both repayment and his anger while making their relationship clearer in English.
- pob_phrase: his rebuke with flames of fire
  simplified_phrase: to rebuke with flames of fire
  preserved_meaning: Yahweh carries out an authoritative rebuke through fiery judgment.
  reasoning_layer_used: The lexical decisions for גַעֲרָתוֹ and בְּלַהֲבֵי אֵשׁ.
  rationale: Turning the noun into a verb supplies natural parallel syntax without adding a separate delivery event.
translation_notes:
  risk_flags:
  - risk: “With his chariots” makes their accompaniment more explicit than the compressed Hebrew clause.
    mitigation: It keeps the chariots within Yahweh’s coming rather than predicting a separate arrival.
  - risk: “The fury of his anger” relates two distinct wrath terms more tightly than POB’s wording.
    mitigation: Both ideas remain explicit, and neither the judicial repayment nor the intensity is reduced.
