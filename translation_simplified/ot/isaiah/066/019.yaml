translation:
  language: en
  text: 'I will place a sign among them.[a] From among them I will send survivors to the nations: to Tarshish, Pul, and Lud, whose people draw the bow; to Tubal and Javan; and to distant coastlands[b] that have not heard of my fame or seen my glory. They will proclaim my glory among the nations.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in them” or “on them”; the exact relationship of the sign to the people is not specified.
    reason: lexical_alternative
  - marker: b
    text: Or “faraway islands.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And I will set a sign among them
  simplified_phrase: I will place a sign among them
  preserved_meaning: God deliberately establishes an unspecified sign among the group.
  reasoning_layer_used: Lexical and theological decisions on שׂים, אוֹת, and בָהֶם
  rationale: “Place” is common English, while “sign” and “among them” preserve the documented ambiguity.
- pob_phrase: and from them I will send survivors to the nations—to ...
  simplified_phrase: 'From among them I will send survivors to the nations: to ...'
  preserved_meaning: God sends members of the surviving group to foreign nations.
  reasoning_layer_used: Lexical decisions on מֵהֶם, פְּלֵיטִים, and גּוֹיִם
  rationale: A new sentence and colon make the mission and destination list easier to follow.
- pob_phrase: that have not heard my report and have not seen my glory—and they will declare my glory
  simplified_phrase: that have not heard of my fame or seen my glory. They will proclaim my glory
  preserved_meaning: These distant peoples do not yet know God's renown or manifested glory, which the survivors will announce.
  reasoning_layer_used: Lexical decisions on שִׁמְעִי, כְּבוֹדִי, and וְהִגִּידוּ plus latest revision record
  rationale: “Heard of my fame” communicates what is heard about God, and two sentences clarify the proclamation.
