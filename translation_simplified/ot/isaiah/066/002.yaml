translation:
  language: en
  text: '“I made all these things with my hand, and that is how they came to exist,” declares Yahweh. “But I will look with favor on this kind of person: someone who is poor[a] and broken in spirit, and who trembles at my word.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “afflicted.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: My hand made all these things
  simplified_phrase: I made all these things with my hand
  preserved_meaning: Yahweh personally created everything, and the concrete hand image remains.
  reasoning_layer_used: lexical decision for יָדִי עָשָׂתָה
  rationale: Natural English word order preserves the hand image without adding emphasis.
- pob_phrase: to this one I will look
  simplified_phrase: I will look with favor on this kind of person
  preserved_meaning: Yahweh will give favorable attention to the person he describes.
  reasoning_layer_used: lexical rationale for וְאֶל זֶה אַבִּיט
  rationale: The wording explains the idiom while retaining its future expression and look image.
- pob_phrase: contrite in spirit
  simplified_phrase: broken in spirit
  preserved_meaning: The person’s inner life is humbled, crushed, or wounded.
  reasoning_layer_used: lexical decision for נְכֵה רוּחַ
  rationale: This documented alternative is more readily understood by common readers.
interpretive_expansions:
- pob_phrase: and so all these things came to be
  rendering: and that is how they came to exist
  claim: Everything exists because Yahweh made it.
  evidence:
  - The lexical rationale says the verb expresses resultant existence because God made these things.
  - The preceding clause identifies Yahweh as their maker.
  confidence: high
  alternatives_preserved:
  - and so all these things came to be
  - and they came into being
- pob_phrase: to this one I will look
  rendering: I will look with favor on this kind of person
  claim: Yahweh’s looking means giving favorable regard, not merely seeing.
  evidence:
  - The POB lexical rationale explicitly identifies the look as favorable regard.
  - The following description identifies the person who receives that regard.
  confidence: high
  alternatives_preserved:
  - I will pay attention to this person
  - I will regard this person
