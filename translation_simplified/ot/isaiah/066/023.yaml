translation:
  language: en
  text: The time will come when, at every new moon[a] and every Sabbath, all flesh[b] will come and bow down before me, says Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A new moon marked the beginning of a month and was a regular time of worship.
    reason: cultural_note
  - marker: b
    text: “All flesh” most naturally means all humanity here, while preserving the Hebrew sense of embodied creatures.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And it shall be
  simplified_phrase: The time will come when
  preserved_meaning: The verse introduces a future state in prophetic speech.
  reasoning_layer_used: POB lexical decision for וְהָיָה
  rationale: The new wording expresses the prophetic future in ordinary modern English.
- pob_phrase: from new moon to its new moon and from Sabbath to its Sabbath
  simplified_phrase: at every new moon and every Sabbath
  preserved_meaning: Worship recurs at each monthly new moon and weekly Sabbath.
  reasoning_layer_used: POB lexical and theological decisions on recurring observances
  rationale: This replaces the opaque Hebrew recurrence pattern while retaining both worship occasions.
- pob_phrase: shall come to bow down before me
  simplified_phrase: will come and bow down before me
  preserved_meaning: All flesh approaches Yahweh and physically bows in worship.
  reasoning_layer_used: POB lexical decisions for יָבוֹא, לְהִשְׁתַּחֲוֺת, and לְפָנַי
  rationale: The natural clause keeps both the movement toward God and the concrete act of bowing.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “all flesh” to mean meat or all animal life.
    mitigation: The footnote explains its primary human reference without erasing its broader creaturely resonance.
  - risk: “At every” could sound like a generalized schedule rather than the Hebrew from-to idiom.
    mitigation: It directly conveys the idiom’s documented sense of regular recurrence while retaining new moon and Sabbath.
