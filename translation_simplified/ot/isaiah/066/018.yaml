translation:
  language: en
  text: I know what they do and what they think.[a] The time is coming to gather all nations and language groups.[b] They will come and see my glory.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew opening is abrupt and difficult; it may also mean, “As for me, because of what they do and think, I am coming to gather all nations and language groups.”
    reason: alternative_reading
  - marker: b
    text: Hebrew literally says “nations and tongues,” using “tongues” for groups that speak different languages.
    reason: lexical_alternative
