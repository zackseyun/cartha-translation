  simplified_phrase: what they do and what they think
  preserved_meaning: God knows both their actions and their inner thoughts or plans.
  reasoning_layer_used: POB lexical decisions and opening-clause footnote
  rationale: Concrete verb phrases are clearer than abstract nouns.
- pob_phrase: all the nations and tongues
  simplified_phrase: all nations and language groups
  preserved_meaning: The gathering includes every nation and language community.
  reasoning_layer_used: POB lexical decisions for גּוֹיִם and לְשֹׁנוֹת
  rationale: “Language groups” gives the idiomatic sense while the footnote retains the Hebrew image.
- pob_phrase: and they will come and see my glory
  simplified_phrase: They will come and see my glory.
  preserved_meaning: The gathered peoples will witness God’s manifest glory.
  reasoning_layer_used: POB lexical decisions for וּבָאוּ, וְרָאוּ, and כְּבוֹדִי
  rationale: A separate sentence makes the prophetic sequence easier to follow.
