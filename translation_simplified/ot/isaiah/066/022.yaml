translation:
  language: en
  text: “For the new heavens and the new earth that I am making will remain in my presence,” declares Yahweh. “In the same way, your offspring and your name will remain.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb translated “remain” can also mean “stand” or “endure” in both places.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For just as ... so
  simplified_phrase: For ... In the same way
  preserved_meaning: The new creation’s lasting existence remains the basis and pattern for the people’s promised continuance.
  reasoning_layer_used: Lexical decisions for כַאֲשֶׁר and כֵּן
  rationale: Two sentences make the comparison easier to follow without weakening it.
- pob_phrase: shall remain before me
  simplified_phrase: will remain in my presence
  preserved_meaning: The new heavens and earth will continue to exist before God.
  reasoning_layer_used: Lexical decisions for עמד and לְפָנַי
  rationale: Modern wording clarifies both enduring existence and the relational sense of God’s presence.
- pob_phrase: your offspring and your name shall remain
  simplified_phrase: your offspring and your name will remain
  preserved_meaning: The people’s offspring and name are promised enduring continuance.
  reasoning_layer_used: Lexical and theological decisions for זַרְעֲכֶם and וְשִׁמְכֶם
  rationale: The wording modernizes “shall” while retaining the concrete term “name” and the promise’s open theological scope.
