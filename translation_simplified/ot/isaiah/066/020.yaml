translation:
  language: en
  text: Yahweh says, “They will bring all your brothers[c] from every nation as an offering to me. They will bring them on horses, in chariots and litters,[a] and on mules and camels.[b] They will bring them to Jerusalem, my holy mountain. It will be just like the sons of Israel bringing an offering in a ceremonially clean container to the house of Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Hebrew term may instead mean “covered wagons.”
    reason: lexical_alternative
  - marker: b
    text: The rare Hebrew term translated “camels” may mean “swift camels.”
    reason: lexical_alternative
  - marker: c
    text: “Brothers” may refer more broadly to their own people, not only male siblings.
    reason: cultural_note
