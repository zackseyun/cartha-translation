translation:
  language: en
  text: 'This is what Yahweh says: “Look! I am making peace flow to her like a river, and the glory of the nations[a] like an overflowing stream. You will nurse at her breast, be carried on the hip, and be bounced on the knees.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This can also mean “the wealth” or “the abundance of the nations”; the Hebrew includes their splendor and riches.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: 'For thus says Yahweh: Behold'
  simplified_phrase: 'This is what Yahweh says: “Look!”'
  preserved_meaning: Yahweh introduces his action with vivid emphasis.
  reasoning_layer_used: POB lexical decision for הִנְנִי and stable divine-name policy
  rationale: The common wording keeps the prophetic announcement and the force of “Behold.”
- pob_phrase: I am extending peace to her like a river
  simplified_phrase: I am making peace flow to her like a river
  preserved_meaning: Yahweh is bringing abundant, steady peace to the maternal city.
  reasoning_layer_used: POB lexical decisions for נֹטֶה אֵלֶיהָ, שָׁלוֹם, and כְּנָהָר
  rationale: The verb “flow” makes the river image immediately understandable without reducing peace to mere prosperity.
- pob_phrase: and you will nurse, you will be carried on the hip, and bounced on the knees
  simplified_phrase: You will nurse at her breast, be carried on the hip, and be bounced on the knees
  preserved_meaning: The people receive nourishment and affectionate care like young children.
  reasoning_layer_used: POB lexical decisions for וִינַקְתֶּם and the two child-care images
  rationale: The shorter list clarifies “nurse” while preserving all three maternal images.
interpretive_expansions:
- pob_phrase: you will nurse
  rendering: You will nurse at her breast
  claim: The nursing is the action of a child receiving milk from the maternal city.
  evidence:
  - The immediate context presents Zion or Jerusalem as a mother.
  - The POB rationale says the active verb keeps the maternal imagery.
  confidence: high
  alternatives_preserved:
  - The maternal figure remains “her” rather than being explicitly named Zion or Jerusalem.
translation_notes:
  risk_flags:
  - risk: “Making peace flow” is less formally close to the Hebrew image of extending peace toward her.
    mitigation: The wording retains the direction toward her and the explicit river simile.
  - risk: “At her breast” is supplied from the maternal context rather than stated in this verse.
    mitigation: The phrase prevents the modern misunderstanding that the people provide nursing care.
