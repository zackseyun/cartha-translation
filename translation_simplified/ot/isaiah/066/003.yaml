translation:
  language: en
  text: Slaughtering an ox is like striking down a man. Sacrificing a lamb is like breaking a dog’s neck. Offering a grain offering is like offering pig’s blood. Presenting frankincense as a memorial offering is like blessing wickedness.[a] They too have chosen their own ways, and they take pleasure in what is detestable.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “blessing an idol”; the Hebrew can refer to wickedness, evil, or idolatrous wrongdoing.
    reason: lexical_alternative
