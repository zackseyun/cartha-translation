translation:
  language: en
  text: 'Yahweh says: “Heaven is my throne. The earth is the footstool beneath my feet. What kind of house[a] would you build for me? What could be my resting place?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
