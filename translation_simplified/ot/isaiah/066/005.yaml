translation:
  language: en
  text: 'Listen to what Yahweh says, you who tremble at his word: Your own brothers hate you and cast you out[a] because of my name. They say, “Let Yahweh be glorified, so that we may see your joy.”[b] But they will be put to shame.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “exclude you” or “banish you.”
    reason: lexical_alternative
  - marker: b
    text: 'They are likely mocking the faithful; the line could instead be a pious-sounding statement: “May Yahweh be honored, and let us see your joy.”'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Hear the word of Yahweh
  simplified_phrase: Listen to what Yahweh says
  preserved_meaning: Yahweh directly summons the hearers to attend to his message.
  reasoning_layer_used: Lexical decision for שִׁמְעוּ and דְּבַר יְהוָה
  rationale: The wording makes the prophetic summons immediately clear while retaining Yahweh’s divine name.
- pob_phrase: Your brothers who hate you, who cast you out for my name’s sake
  simplified_phrase: Your own brothers hate you and cast you out because of my name
  preserved_meaning: Fellow members of the people hate and exclude the faithful on account of Yahweh’s name.
  reasoning_layer_used: Lexical decisions for אֲחֵיכֶם, מְנַדֵּיכֶם, and לְמַעַן שְׁמִי
  rationale: Two relative clauses become direct verbs, while “own brothers” preserves the painful family image.
- pob_phrase: but they will be put to shame
  simplified_phrase: But they will be put to shame
  preserved_meaning: Yahweh promises a future reversal for the persecutors.
  reasoning_layer_used: Lexical decision for יֵבֹשׁוּ and theological reading of the contrast
  rationale: This clear biblical expression already communicates the reversal without added explanation.
translation_notes:
  risk_flags:
  - risk: The quoted words may sound sincere rather than mocking.
    mitigation: Footnote b preserves both the likely taunting sense and the less sarcastic reading.
  - risk: Modern readers may take “brothers” to mean only biological siblings.
    mitigation: The family image is retained because it carries the source text’s social sting.
