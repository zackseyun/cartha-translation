translation:
  language: en
  text: Rejoice with Jerusalem![a] All who love her, be glad in her. All who mourn over her, rejoice greatly with her![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Rejoice over Jerusalem.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew repeats the idea of joy here to give the command extra force.
    reason: source_note
simplification_decisions:
- pob_phrase: Rejoice with Jerusalem and be glad in her, all you who love her
  simplified_phrase: Rejoice with Jerusalem! All who love her, be glad in her.
  preserved_meaning: Those who love the personified city are called to rejoice with Jerusalem and be glad in her.
  reasoning_layer_used: POB lexical decisions and clause parallelism
  rationale: Two direct sentences clarify the call while retaining the distinct phrases “with Jerusalem” and “in her.”
- pob_phrase: rejoice with her in joy
  simplified_phrase: rejoice greatly with her
  preserved_meaning: The repeated Hebrew joy terms intensify the command to rejoice with Jerusalem.
  reasoning_layer_used: POB footnote b and lexical rationale for מָשׂוֹשׂ
  rationale: “Greatly” conveys the Hebrew emphasis without awkward repetition in English.
- pob_phrase: all you who mourn over her
  simplified_phrase: All who mourn over her
  preserved_meaning: The command addresses everyone grieving over Jerusalem.
  reasoning_layer_used: POB lexical decisions for הַמִּתְאַבְּלִים and עָלֶיהָ
  rationale: The recast clause remains direct address while reading more naturally.
