translation:
  language: en
  text: “Those who set themselves apart as holy and make themselves ritually clean to enter the gardens, following one in the middle,[a] eat pig meat, detestable things, and mice. They will all come to an end together,” declares Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew phrase is difficult. It may mean following a ritual leader, following someone into the center, or proceeding one after another in a ritual.
    reason: alternative_reading
