  preserved_meaning: They prepare themselves through self-directed rites of holiness and cleansing.
  reasoning_layer_used: POB lexical decisions for the reflexive forms of קדשׁ and טהר
  rationale: The wording explains both ritual actions while preserving their reflexive force.
