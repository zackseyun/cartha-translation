- pob_phrase: So I also will choose harsh treatment for them
  simplified_phrase: So I too will choose harsh treatment for them
  preserved_meaning: God’s choice of judgment answers the people’s sinful choice.
  reasoning_layer_used: Lexical and theological decisions on גַּם אֲנִי and אֶבְחַר
  rationale: “So I too” makes the emphatic correspondence natural while retaining “choose.”
- pob_phrase: I will bring their fears upon them
  simplified_phrase: bring upon them the very things they fear
  preserved_meaning: What the people dread will become their experienced judgment.
  reasoning_layer_used: Lexical decision on וּמְגוּרֹתָם and אָבִיא לָהֶם
  rationale: The concrete wording avoids treating “fears” as mere emotions.
- pob_phrase: because I called and no one answered, I spoke and they did not listen
  simplified_phrase: I will do this because I called, but no one answered. I spoke, but they did not listen.
  preserved_meaning: Their refusal to respond is the stated reason for judgment.
  reasoning_layer_used: Lexical decisions and applied revision on the causal flow
  rationale: Short sentences clarify the cause without adding contrast before their evil actions.
