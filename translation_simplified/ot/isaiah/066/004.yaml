translation:
  language: en
  text: So I too will choose harsh treatment for them[a] and bring upon them the very things they fear. I will do this because I called, but no one answered. I spoke, but they did not listen. They did what was evil in my eyes and chose what gave me no delight.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term may also mean “mockeries,” “delusions,” or “abusive dealings”; here it describes severe judgment.
    reason: lexical_alternative
