translation:
  language: en
  text: “Would I bring a pregnancy to the moment of delivery but not cause the child to be born?” says Yahweh. “Or would I, the one who causes birth, close the womb?” says your God.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In Hebrew, “your” is singular and feminine because God is speaking to Zion as a woman.
    reason: cultural_note
