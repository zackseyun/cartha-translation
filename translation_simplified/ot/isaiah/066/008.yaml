translation:
  language: en
  text: Who has ever heard of such a thing? Who has ever seen such things? Can a land be brought to birth in a single day? Can a nation be born all at once? For Zion went into labor and also gave birth to her children.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “her sons.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Who has heard such a thing? Who has seen things like these?
  simplified_phrase: Who has ever heard of such a thing? Who has ever seen such things?
  preserved_meaning: The questions express amazement at an unheard-of and unseen event.
  reasoning_layer_used: Lexical decisions for כָּזֹאת and כָּאֵלֶּה
  rationale: Adding “ever” makes the rhetorical force natural while retaining the singular and plural contrast.
- pob_phrase: Can a land be brought forth in one day?
  simplified_phrase: Can a land be brought to birth in a single day?
  preserved_meaning: A land is pictured as coming forth through childbirth with astonishing speed.
  reasoning_layer_used: Lexical decision for הֲיּוּחַל אֶרֶץ
  rationale: “Brought to birth” clarifies the image without reducing it to abstract national restoration.
- pob_phrase: Zion was in labor
  simplified_phrase: Zion went into labor
  preserved_meaning: Zion remains personified as a mother giving birth to her people.
  reasoning_layer_used: Theological decision on Zion’s personification
  rationale: “Went into labor” is more natural modern English and keeps the maternal image intact.
translation_notes:
  risk_flags:
  - risk: A land being brought to birth remains an unusual image in English.
    mitigation: The unusual wording is retained because the source deliberately extends the childbirth metaphor to the land.
