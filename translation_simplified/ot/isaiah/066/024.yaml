translation:
  language: en
  text: They will go out and look at the dead bodies of the men who rebelled against me. For the worm[a] that feeds on them will not die, and their fire will never be put out. Everyone will find them repulsive.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word may also mean a grub or maggot.
    reason: lexical_alternative
