translation:
  language: en
  text: 'This is what Yahweh said to me:


    “A lion or a young lion growls over its prey.[a] Even when a whole group of shepherds is called together against it, their shouts do not frighten it, and their uproar does not intimidate it.[b] In the same way, Yahweh of hosts will come down to wage war on Mount Zion and its hill.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a lion and a young lion”; the Hebrew may use the two terms as a poetic pair.
    reason: lexical_alternative
  - marker: b
    text: Or “it does not respond to their uproar”; the Hebrew verb most likely means that the lion is not subdued or intimidated.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For thus Yahweh said to me
  simplified_phrase: This is what Yahweh said to me
  preserved_meaning: Yahweh directly introduces his message to the prophet.
  reasoning_layer_used: POB lexical decision for אֵלַי and the prophetic report formula
  rationale: The common English formula removes archaic wording without changing the speaker or addressee.
- pob_phrase: though a band of shepherds is called out against it
  simplified_phrase: Even when a whole group of shepherds is called together against it
  preserved_meaning: A full group of shepherds assembles to confront the lion without deterring it.
  reasoning_layer_used: POB lexical decisions for מְלֹא רֹעִים and יִקָּרֵא עָלָיו
  rationale: “Whole group” and “called together” make the collective action immediately clear.
- pob_phrase: it is not terrified by their voice or cowed by their noise
  simplified_phrase: their shouts do not frighten it, and their uproar does not intimidate it
  preserved_meaning: The shepherds’ loud commotion neither frightens nor subdues the lion.
  reasoning_layer_used: POB lexical and theological decisions for לֹא יֵחָת and לֹא יַעֲנֶה
  rationale: The wording preserves both parallel ideas without implying that the lion physically retreats.
translation_notes:
  risk_flags:
  - risk: “Does not intimidate it” selects the contextual subdual sense of a debated Hebrew verb.
    mitigation: Footnote b preserves the more literal alternative “does not respond.”
  - risk: Modern readers may not immediately understand the title “Yahweh of hosts.”
    mitigation: The title remains because it is the POB theological choice, while “wage war” conveys its martial setting.
