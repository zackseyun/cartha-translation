translation:
  language: en
  text: Woe to those who go down to Egypt for help! They rely on horses. They trust in chariots because there are so many, and in horsemen because they are very strong. But they do not look to the Holy One of Israel or seek Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh is the divine name represented by YHWH in Hebrew.
    reason: source_note
simplification_decisions:
- pob_phrase: Woe to those who go down to Egypt for help, who rely on horses
  simplified_phrase: Woe to those who go down to Egypt for help! They rely on horses.
  preserved_meaning: The prophetic warning condemns those who seek Egypt’s military support.
  reasoning_layer_used: Lexical decisions for הוֹי, הַיֹּרְדִים, and שׁען
  rationale: Two sentences make the warning and dependence easier to follow while keeping the image of going down and relying.
- pob_phrase: trust in chariots because they are many, and in horsemen because they are very strong
  simplified_phrase: They trust in chariots because there are so many, and in horsemen because they are very strong.
  preserved_meaning: Their confidence rests on Egypt’s large and powerful military forces.
  reasoning_layer_used: Lexical decisions for רֶכֶב, פָּרָשִׁים, and עָצְמוּ
  rationale: The recast clause clearly links each reason to the military force it describes.
- pob_phrase: but do not look to the Holy One of Israel and do not seek Yahweh
  simplified_phrase: But they do not look to the Holy One of Israel or seek Yahweh.
  preserved_meaning: Reliance on military power is contrasted with dependence on Israel’s holy God.
  reasoning_layer_used: Lexical and theological decisions for שׁעה, קְדוֹשׁ יִשְׂרָאֵל, דרשׁ, and YHWH
  rationale: The shorter coordination preserves both failures and retains the divine title and covenant name.
translation_notes:
  risk_flags:
  - risk: “Woe” may be unfamiliar to some readers.
    mitigation: It is retained because it carries the force of a prophetic judgment announcement.
