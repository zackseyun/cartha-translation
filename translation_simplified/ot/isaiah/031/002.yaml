  preserved_meaning: The LORD’s true wisdom contrasts with Judah’s reliance on human wisdom.
  reasoning_layer_used: POB theological decision and immediate context
  rationale: Naming the LORD makes the contextual subject clear to a reader seeing the verse alone.
- pob_phrase: his words
