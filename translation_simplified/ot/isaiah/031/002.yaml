translation:
  language: en
  text: Yet the LORD is wise too, and he brings disaster.[a] He does not take back what he has said. He rises against the household of those who do evil and against the help supplied by those who practice wickedness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “calamity”; this means disaster brought in judgment, not moral evil.
    reason: lexical_alternative
