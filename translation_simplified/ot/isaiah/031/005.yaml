translation:
  language: en
  text: Like birds hovering overhead, Yahweh of Armies will shield Jerusalem. He will shield and deliver it; he will pass over it[a] and rescue it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “spare” or “protect.” The Hebrew also echoes the Passover in Exodus.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Like birds hovering
  simplified_phrase: Like birds hovering overhead
  preserved_meaning: The image remains birds flying protectively above Jerusalem.
  reasoning_layer_used: lexical decision for עָפוֹת and the spatial force of the simile
  rationale: “Overhead” makes the protective picture immediately clear without replacing the bird image.
- pob_phrase: so Yahweh of Armies will shield Jerusalem—shielding and delivering
  simplified_phrase: Yahweh of Armies will shield Jerusalem. He will shield and deliver it
  preserved_meaning: Yahweh personally protects Jerusalem, with the repeated shield language retaining its emphasis.
  reasoning_layer_used: lexical decisions for יָגֵן, גָּנוֹן, and יְהוָה
  rationale: Two finite sentences replace the dense verbal chain while preserving its repetition.
- pob_phrase: passing over and rescuing
  simplified_phrase: he will pass over it and rescue it
  preserved_meaning: Both the Passover-associated action and the distinct act of rescue remain.
  reasoning_layer_used: lexical and theological decisions for פָּסֹחַ and וְהִמְלִיט
  rationale: Explicit subject and object make the paired actions easier to follow.
translation_notes:
  risk_flags:
