translation:
  language: en
  text: “Assyria’s rock[a] will vanish because of terror, and its leaders will panic at the battle signal,” declares Yahweh, whose fire is in Zion and whose furnace is in Jerusalem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “rock” may mean Assyria’s stronghold, refuge, or ruler.
    reason: lexical_alternative
  - marker: b
    text: The fire and furnace likely picture Yahweh’s consuming presence in judgment, but the image is not more narrowly defined.
    reason: cultural_note
