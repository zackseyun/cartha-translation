translation:
  language: en
  text: Assyria will fall by a sword no man wields; a sword no human being wields will devour it. Assyria will flee from the sword, and its young men will be forced into labor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The sword is not wielded by human power, but the exact means of the LORD’s judgment is not specified.
    reason: source_note
simplification_decisions:
- pob_phrase: a sword not of man ... a sword not of humankind
  simplified_phrase: a sword no man wields; a sword no human being wields
  preserved_meaning: The repeated contrast denies human agency without identifying the exact means of judgment.
  reasoning_layer_used: lexical and theological decisions
  rationale: Active wording makes the nonhuman agency clear while preserving both parallel statements.
- pob_phrase: he will flee from before the sword
  simplified_phrase: Assyria will flee from the sword
  preserved_meaning: Assyria is treated collectively as fleeing the instrument of judgment.
  reasoning_layer_used: lexical decision and immediate context
  rationale: Naming Assyria removes an unclear pronoun and replaces the Hebrew idiom with natural English.
- pob_phrase: his young men will become forced labor
  simplified_phrase: its young men will be forced into labor
  preserved_meaning: Assyria’s young men will enter compulsory service after its defeat.
  reasoning_layer_used: lexical decisions
  rationale: The passive construction clearly expresses their coerced resulting condition.
interpretive_expansions:
- pob_phrase: not of man ... not of humankind
  rendering: no man wields ... no human being wields
  claim: The sword does not operate through human agency.
  evidence:
  - The Hebrew twice negates human association with the sword.
  - The POB theological decision identifies a nonhuman instrument of judgment.
  - The POB footnote explains that the sword is not wielded by human power.
  confidence: high
  alternatives_preserved:
  - The sword may be literal but not humanly wielded.
  - The sword may symbolize another form of divine intervention.
translation_notes:
  risk_flags:
  - risk: “Wields” emphasizes agency more directly than the terse Hebrew phrases do.
    mitigation: The footnote preserves the possibility of origin or means and leaves the exact form of judgment unspecified.
