translation:
  language: en
  text: Egypt is only human, not God. Its horses are flesh, not spirit.[a] When Yahweh reaches out his hand to act against them, the helper will stumble, and those who receive its help will fall. All of them will come to an end together.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “spirit” contrasts with “flesh” and may refer broadly to life-force, immaterial power, or divine power; it does not necessarily refer to the Holy Spirit.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Egypt is man and not God
  simplified_phrase: Egypt is only human, not God
  preserved_meaning: Egypt is a merely human nation, sharply contrasted with God.
  reasoning_layer_used: POB lexical and theological decisions on אָדָם
  rationale: “Only human” makes the collective contrast clear without suggesting that maleness is the point.
- pob_phrase: their horses
  simplified_phrase: Its horses
  preserved_meaning: The horses belong to Egypt, treated as one nation.
  reasoning_layer_used: POB lexical decisions on מִצְרַיִם and סוּסֵיהֶם
  rationale: The singular pronoun naturally refers to Egypt as a collective nation.
- pob_phrase: the one helped
  simplified_phrase: those who receive its help
  preserved_meaning: The recipients of Egypt’s aid will fall along with Egypt.
  reasoning_layer_used: POB lexical decisions on עוֹזֵר and עָזֻר
  rationale: The active wording clearly distinguishes those receiving aid from the helper.
interpretive_expansions:
- pob_phrase: Yahweh stretches out his hand
  rendering: Yahweh reaches out his hand to act against them
  claim: The hand image describes Yahweh taking decisive action against Egypt and those relying on it.
  evidence:
  - The POB lexical rationale identifies the expression as decisive divine action or judgment.
  - The resulting collapse of both helper and helped shows that the action is against them.
  confidence: high
  alternatives_preserved:
  - decisive divine action
  - divine judgment
translation_notes:
  risk_flags:
  - risk: “Spirit” could be mistaken for a definite reference to the Holy Spirit.
    mitigation: Lowercase wording and the footnote preserve the broader possibilities of life-force, immaterial power, or divine power.
  - risk: Changing singular “the one helped” to plural may appear to alter number.
    mitigation: The plural clearly expresses the collective recipients included in “all of them.”
