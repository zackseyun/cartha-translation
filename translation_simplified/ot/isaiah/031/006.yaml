translation:
  language: en
  text: Sons of Israel, return to the one from whom you have deeply rebelled.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “return to the one against whom you have rebelled so deeply.” The Hebrew wording allows either emphasis.
    reason: alternative_reading
  - marker: b
    text: “Sons of Israel” is the literal Hebrew expression for the people of Israel.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Return to him from whom
  simplified_phrase: return to the one from whom
  preserved_meaning: Israel must return to the unnamed person from whom they turned in rebellion.
  reasoning_layer_used: lexical and theological decisions
  rationale: The wording keeps the POB’s relational emphasis without adding the divine name.
- pob_phrase: have deeply revolted
  simplified_phrase: have deeply rebelled
  preserved_meaning: Israel’s rebellion was active and profound.
  reasoning_layer_used: lexical decision for הֶעְמִיקוּ סָרָה
  rationale: “Deeply rebelled” states the intensified rebellion directly without adding spatial distance.
- pob_phrase: the sons of Israel
  simplified_phrase: Sons of Israel
  preserved_meaning: The command addresses Israel collectively using the chosen Hebrew expression.
  reasoning_layer_used: lexical decision for בְּנֵי יִשְׂרָאֵל
  rationale: Direct address makes the sentence easier to follow while retaining the POB term.
translation_notes:
  risk_flags:
  - risk: “From whom” is less idiomatic than expressing rebellion against someone.
    mitigation: Footnote a gives the natural relational alternative while preserving the POB’s main emphasis.
  - risk: “Sons of Israel” may appear to refer only to males.
    mitigation: Footnote b explains that it names the people of Israel collectively.
