translation:
  language: en
  text: For you have shattered the yoke that weighed him down, the staff pressing on his shoulder, and the rod of his oppressor, just as you did on the day of Midian.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The day of Midian” recalls the LORD’s defeat of Midian in the days of Gideon (Judges 7).
    reason: cross_reference
  - marker: b
    text: The Hebrew describes this victory as already accomplished to emphasize its certainty; it may also be rendered “you will shatter.”
    reason: alternative_reading
