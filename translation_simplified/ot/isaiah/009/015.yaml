translation:
  language: en
  text: This people’s leaders have become people who lead them astray,[a] and those they lead are swallowed up.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Those who bless this people are leading them astray, and those they bless are swallowed up.” The Hebrew can refer either to guiding people or to declaring them blessed.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the guides of this people have become those who lead them astray
  simplified_phrase: This people’s leaders have become people who lead them astray
  preserved_meaning: The leaders now have the ongoing role of misdirecting the people.
  reasoning_layer_used: Lexical decisions for וַיִּהְיוּ, מְאַשְּׁרֵי, and מַתְעִים
  rationale: This wording preserves both the resulting condition and the leaders’ continuing activity.
- pob_phrase: those guided by them
  simplified_phrase: those they lead
  preserved_meaning: The consequence falls on people under the leaders’ direction, whether or not they follow willingly.
  reasoning_layer_used: Lexical decision for וּמְאֻשָּׁרָיו
  rationale: The active wording is plain English without implying voluntary allegiance.
- pob_phrase: are swallowed up
  simplified_phrase: are swallowed up
  preserved_meaning: The vivid image conveys engulfing ruin without reducing it to a single explanation.
  reasoning_layer_used: Lexical decision for מְבֻלָּעִים
  rationale: The source image is understandable and retains its open-ended destructive force.
translation_notes:
  risk_flags:
  - risk: “Swallowed up” may not specify the exact form of ruin.
    mitigation: Its openness preserves the source metaphor rather than overinterpreting it.
  - risk: The main text favors guidance over the possible blessing sense of אשר.
    mitigation: Footnote [a] preserves the documented alternative reading.
