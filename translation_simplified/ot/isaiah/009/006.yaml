  preserved_meaning: The promised king’s dominion and peace increase endlessly.
  reasoning_layer_used: Lexical decisions for למרבה, הַמשרה, ולשלום, and אין קץ
  rationale: The active sentence clarifies ongoing growth while preserving the royal scope.
- pob_phrase: on the throne of David and over his kingdom
  simplified_phrase: He will rule on David’s throne and over David’s kingdom
  preserved_meaning: The promised ruler exercises Davidic kingship while retaining the throne image.
  reasoning_layer_used: Lexical and theological decisions on the Davidic promise
  rationale: The sentence makes the act of ruling clear without weakening the source’s enthronement image.
- pob_phrase: to establish it and to uphold it
  simplified_phrase: He will establish and uphold that kingdom
  preserved_meaning: The ruler makes the kingdom firm and continually supports it.
  reasoning_layer_used: Lexical decisions for להכין אתה and ולסעדה
  rationale: Naming the kingdom removes an unclear pronoun while keeping both actions distinct.
