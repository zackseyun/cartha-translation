translation:
  language: en
  text: Manasseh devours Ephraim, and Ephraim devours Manasseh.[a] Yet the two join forces against Judah. Even after all this, his anger has not turned away. His hand is still stretched out in judgment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew leaves out the verb; “devours” continues the image from the previous verse.
    reason: lexical_alternative
