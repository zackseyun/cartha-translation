translation:
  language: en
  text: Aram from the east and the Philistines from the west[a] greedily devoured Israel[b]. Even after all this, his anger has not turned away, and his hand is still stretched out to strike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says “from behind”; paired with “from the east,” it likely means “from the west.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew says “with full mouth,” picturing voracious or complete destruction.
    reason: simplification_note
simplification_decisions:
- pob_phrase: devoured Israel with full mouth
  simplified_phrase: greedily devoured Israel
  preserved_meaning: Israel’s enemies consumed it with total, voracious force while retaining the devouring image.
  reasoning_layer_used: lexical decision for וַיֹּאכְלוּ and בְּכָל פֶּה
  rationale: “Greedily” makes the Hebrew idiom understandable without weakening its violent image.
- pob_phrase: For all this
  simplified_phrase: Even after all this
  preserved_meaning: God’s judgment continues despite the blows Israel has already suffered.
  reasoning_layer_used: lexical rationale for בְּכָל זֹאת
  rationale: “Even after” states the refrain’s contrast in ordinary English.
- pob_phrase: his hand is still stretched out
  simplified_phrase: his hand is still stretched out to strike
  preserved_meaning: The outstretched hand remains an image of God’s continuing judgment.
  reasoning_layer_used: theological decision on the pronouns and lexical rationale for וְעוֹד יָדוֹ נְטוּיָה
  rationale: “To strike” prevents the image from sounding like an offer of help.
