  - The following clause says that his anger has not turned away.
  confidence: high
  alternatives_preserved:
  - For all this
  - Despite all this
- pob_phrase: his hand is still stretched out
  rendering: his hand is still stretched out to strike
  claim: The stretched-out hand signifies continuing divine judgment against Israel.
  evidence:
  - The POB lexical rationale identifies this as a prophetic image of ongoing judgment.
  - The POB theological decision assigns the hand and anger to God’s continuing judgment.
  confidence: high
  alternatives_preserved:
  - his hand is still stretched out
  - his hand remains outstretched
