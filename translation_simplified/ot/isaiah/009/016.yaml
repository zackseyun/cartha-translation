translation:
  language: en
  text: So the Lord takes no pleasure in their young men. He has no compassion on their fatherless children or widows, because all of them are godless and do evil, and every mouth speaks disgraceful folly. Despite all this, his anger has not turned away; his hand is still stretched out in judgment.
