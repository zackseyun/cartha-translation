translation:
  language: en
  text: For a child has been born to us.[a] A son has been given to us. The authority to rule rests on his shoulder. He is called Wonderful Counselor, Mighty God, Father of Eternity,[b] and Prince of Peace.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'In this prophetic context, this may also be translated traditionally: “For to us a child is born, to us a son is given. The government will rest on his shoulder, and he will be called . . .”'
    reason: alternative_reading
  - marker: b
    text: “Father of Eternity” closely reflects the Hebrew; traditionally, “Everlasting Father.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a child has been born to us, a son has been given to us
  simplified_phrase: A child has been born to us. A son has been given to us.
  preserved_meaning: The parallel statements present the child as born for the people and the son as given to them.
  reasoning_layer_used: POB lexical and temporal decisions
  rationale: Two sentences make the prophetic proclamation easier to follow without changing its tense.
- pob_phrase: the rule is on his shoulder
  simplified_phrase: The authority to rule rests on his shoulder.
  preserved_meaning: Royal authority belongs to him, while the Hebrew shoulder image remains.
  reasoning_layer_used: POB lexical rationale for הַמִּשְׂרָה and shoulder imagery
  rationale: “Authority to rule” explains the less natural phrase “the rule” while keeping the image.
- pob_phrase: his name is called
  simplified_phrase: He is called
  preserved_meaning: The child receives the full sequence of royal titles without naming who gives them.
  reasoning_layer_used: POB naming-formula and theological decisions
  rationale: The shorter English naming formula is natural and keeps every title attached to the child.
interpretive_expansions:
- pob_phrase: the rule
  rendering: the authority to rule
  claim: The phrase refers to the child’s royal ruling authority, not merely an administration.
  evidence:
  - The POB lexical rationale defines the term as ruling authority or dominion.
  - The shoulder image presents that authority as borne by the child.
  confidence: high
  alternatives_preserved:
  - the rule
  - the government
  - dominion
translation_notes:
  risk_flags:
