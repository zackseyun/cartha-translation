simplification_decisions:
- pob_phrase: They are put to shame and also humiliated, all of them together
  simplified_phrase: All of them are put to shame and humiliated together
  preserved_meaning: Every one of them shares the same shame and humiliation.
  reasoning_layer_used: Lexical decisions for כֻּלָּם, יַחְדָּו, בּוֹשׁוּ, and נִכְלְמוּ
  rationale: Placing “all of them” first and keeping “together” in the clause makes their shared fate clear.
- pob_phrase: the makers of idols
  simplified_phrase: those who make idols
  preserved_meaning: The people who fashion false gods are the ones disgraced.
  reasoning_layer_used: Lexical and theological decisions for חָרָשֵׁי צִירִים
  rationale: The verbal phrase is more natural while retaining the anti-idolatry referent.
- pob_phrase: go in disgrace
  simplified_phrase: go into disgrace
  preserved_meaning: They enter a state of public dishonor.
  reasoning_layer_used: Lexical decisions for הָלְכוּ and בַכְּלִמָּה
  rationale: “Go into” clearly describes entering a condition rather than physical travel.
