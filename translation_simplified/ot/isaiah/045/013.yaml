    mitigation: The footnote preserves “justice” as a contextual alternative without narrowing the main text.
  - risk: “Not for payment or a bribe” could be read as qualifying both preceding actions.
    mitigation: Its position directly after the exile phrase preserves its most immediate connection to their release.
