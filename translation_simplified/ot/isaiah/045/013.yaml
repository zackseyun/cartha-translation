translation:
  language: en
  text: I have stirred him into action in righteousness,[a] and I will make all his ways straight. He will rebuild my city and release my people from exile, not for payment or a bribe, says Yahweh of Armies.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “raised him up in righteousness” or “stirred him into action in justice.”
    reason: lexical_alternative
  - marker: b
    text: 'Traditional: “the LORD of Hosts.”'
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: stirred him up
  simplified_phrase: stirred him into action
  preserved_meaning: Yahweh actively moved him to fulfill a purpose.
  reasoning_layer_used: Lexical decision for הַעִירֹתִהוּ
  rationale: The added words clarify the image of rousing someone for a purpose.
- pob_phrase: send my exiles away
  simplified_phrase: release my people from exile
  preserved_meaning: He will free the people who have been living in exile.
  reasoning_layer_used: Lexical decisions for גָלוּתִי and יְשַׁלֵּחַ
  rationale: This wording clearly identifies the exiles as people being released.
- pob_phrase: not for a price and not for a bribe
  simplified_phrase: not for payment or a bribe
  preserved_meaning: The exiles’ release will not be bought or secured through bribery.
  reasoning_layer_used: Lexical decisions for לֹא בִמְחִיר and וְלֹא בְשֹׁחַד
  rationale: The concise wording remains directly attached to the release of the exiles.
interpretive_expansions:
- pob_phrase: send my exiles away
  rendering: release my people from exile
  claim: The phrase refers to freeing the exiled community rather than moving an abstract state of captivity.
  evidence:
  - The POB lexical rationale identifies the personal sense as most natural with this verb.
  - The historical context concerns Jerusalem’s exiled people being allowed to leave.
  confidence: high
  alternatives_preserved:
  - send my exiles away
  - release my deportees
translation_notes:
  risk_flags:
