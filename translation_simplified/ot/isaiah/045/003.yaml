simplification_decisions:
- pob_phrase: the treasures of darkness
  simplified_phrase: treasures hidden in darkness
  preserved_meaning: The treasures are material wealth concealed in dark or inaccessible places.
  reasoning_layer_used: POB lexical decision and theological decision on the promise imagery
  rationale: The clearer lexical alternative preserves the concrete darkness image without spiritualizing the wealth.
- pob_phrase: the hidden riches of secret places
  simplified_phrase: riches stored away in secret places
  preserved_meaning: The riches are concealed stores of material wealth.
  reasoning_layer_used: POB lexical rationale for וּמַטְמֻנֵי מִסְתָּרִים
  rationale: “Stored away” explains hidden hoards while keeping the separate image of secret places.
- pob_phrase: Yahweh, the one who calls you by name, the God of Israel
  simplified_phrase: Yahweh, the God of Israel, who calls you by your name
  preserved_meaning: Yahweh identifies himself as Israel’s God who personally summons Cyrus.
  reasoning_layer_used: POB theological decision and lexical decision for הַקּוֹרֵא בְשִׁמְךָ
  rationale: Reordering the titles makes the sentence easier to follow while retaining the divine name and personal specificity.
