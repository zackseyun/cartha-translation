translation:
  language: en
  text: I did not speak in secret or in a land of darkness. I did not tell Jacob’s descendants, “Seek me in vain.” I, Yahweh, speak what is righteous and declare what is upright.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Righteous” can also convey what is right or just.
    reason: lexical_alternative
