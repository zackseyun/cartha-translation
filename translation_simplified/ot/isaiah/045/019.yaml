  preserved_meaning: Yahweh did not hide his revelation in secrecy or darkness.
  reasoning_layer_used: POB lexical decisions and theological rationale
  rationale: Adding “or” clarifies the paired negative settings in natural English.
- pob_phrase: the offspring of Jacob
  simplified_phrase: Jacob’s descendants
  preserved_meaning: The phrase collectively identifies the people descended from Jacob.
  reasoning_layer_used: POB lexical decision for לְזֶרַע יַעֲקֹב
  rationale: “Descendants” is more familiar than the collective use of “offspring.”
- pob_phrase: speak righteousness
  simplified_phrase: speak what is righteous
  preserved_meaning: Yahweh’s speech is morally right, reliable, and just.
  reasoning_layer_used: POB lexical and theological decisions for צֶדֶק
  rationale: Adding “what is” makes the phrase natural while retaining its moral weight.
