translation:
  language: en
  text: Yahweh saves Israel[a] with salvation that lasts forever. You will never be put to shame or disgraced, for all eternity.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Israel is saved in Yahweh”; the Hebrew can describe Yahweh as the one who saves or as the one in whom salvation is found.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Israel is saved by Yahweh with an everlasting salvation
  simplified_phrase: Yahweh saves Israel with salvation that lasts forever
  preserved_meaning: Yahweh brings about Israel’s salvation, and that salvation never ends.
  reasoning_layer_used: Lexical decisions for נוֹשַׁע, בַּיהוָה, and תְּשׁוּעַת עוֹלָמִים
  rationale: Active voice and a plain relative clause make the promise easier to understand without changing its agent or duration.
- pob_phrase: forever and ever
  simplified_phrase: for all eternity
  preserved_meaning: Israel’s freedom from shame and disgrace will never end.
  reasoning_layer_used: Lexical decision for עַד עוֹלְמֵי עַד
  rationale: The common phrase “for all eternity” preserves the Hebrew expression’s emphatic endless duration.
