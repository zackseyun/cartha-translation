translation:
  language: en
  text: 'This is what Yahweh says to Cyrus, his anointed[a]:


    “I have grasped your right hand and will help you subdue nations. I will loosen the belts of kings, stripping them of their strength. I will open doors[b] before you, and the gates will not be shut.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word for “anointed” is from the same word family as “Messiah.” Here it describes Cyrus as appointed by Yahweh for this task.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew form may refer specifically to double doors.
    reason: lexical_alternative
