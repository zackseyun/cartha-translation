- pob_phrase: whose right hand I have grasped, to subdue nations before him
  simplified_phrase: I have grasped your right hand and will help you subdue nations
  preserved_meaning: Yahweh supports and empowers Cyrus in overcoming nations.
  reasoning_layer_used: POB lexical rationale for הֶחֱזַקְתִּי בִימִינוֹ and לְרַד
  rationale: Direct address clarifies the relationship while retaining the right-hand image.
- pob_phrase: to loosen the loins of kings
