translation:
  language: en
  text: I am Yahweh. There is no other God besides me. I give you strength,[a] even though you have not known me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I arm you” or “I equip you.” The Hebrew verb describes preparing someone with strength for action.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I am Yahweh, and there is no other; besides me there is no God.
  simplified_phrase: I am Yahweh. There is no other God besides me.
  preserved_meaning: Yahweh alone is God, and no other exists.
  reasoning_layer_used: POB lexical and theological decisions on Yahweh and the exclusivity statement
  rationale: Two direct sentences preserve the absolute claim while removing repetitive clause structure.
- pob_phrase: I strengthen you
  simplified_phrase: I give you strength
  preserved_meaning: Yahweh empowers Cyrus for action.
  reasoning_layer_used: POB lexical decision for אֲאַזֶּרְךָ
  rationale: The verbal idea is expressed in a familiar form without losing the sense of empowerment.
- pob_phrase: though you have not known me
  simplified_phrase: even though you have not known me
  preserved_meaning: Yahweh strengthens Cyrus despite Cyrus’s lack of prior knowledge of him.
  reasoning_layer_used: POB theological decision on the concessive final clause
  rationale: “Even though” makes the intended contrast immediately clear.
translation_notes:
  risk_flags:
  - risk: Combining the two exclusivity clauses may reduce the Hebrew parallelism.
    mitigation: The wording still states both that no other God exists and that none exists besides Yahweh.
