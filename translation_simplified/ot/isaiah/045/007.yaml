simplification_decisions:
- pob_phrase: forming light and creating darkness
  simplified_phrase: I form light and create darkness.
  preserved_meaning: Yahweh is the one who forms light and creates darkness, with both verbs kept distinct.
  reasoning_layer_used: POB lexical decisions and the verse’s final self-identification
  rationale: A direct subject and finite verbs make the poetic statement easier to follow.
- pob_phrase: making peace and creating calamity
  simplified_phrase: I make peace and create calamity.
  preserved_meaning: Yahweh has sovereign agency over both peace and adversity without being called the creator of moral evil.
  reasoning_layer_used: POB lexical and theological decisions for שָׁלוֹם and רָע
  rationale: A separate sentence preserves the contrast while reducing the dense participial sequence.
- pob_phrase: I am Yahweh, who does all these things
  simplified_phrase: I am Yahweh, and I do all these things.
  preserved_meaning: Yahweh emphatically identifies himself as responsible for every reality just named.
  reasoning_layer_used: POB divine-name doctrine and summary-clause rationale
  rationale: The coordinated clause is more direct while keeping the comprehensive claim.
interpretive_expansions:
