translation:
  language: en
  text: I myself will go ahead of you and level the rough places.[a] I will smash bronze doors and cut through iron bars.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “make the uneven places level.” The Hebrew is difficult; it may refer more specifically to mountains or heights.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: go before you
  simplified_phrase: go ahead of you
  preserved_meaning: God personally promises to go in advance.
  reasoning_layer_used: Lexical and theological decisions
  rationale: “Ahead of you” makes the spatial promise immediately clear while “myself” retains the emphasis.
- pob_phrase: break in pieces doors of bronze
  simplified_phrase: smash bronze doors
  preserved_meaning: God will forcefully break apart strong bronze doors.
  reasoning_layer_used: Lexical decision for אֲשַׁבֵּר and דַּלְתוֹת נְחוּשָׁה
  rationale: “Smash” expresses the intensified action in concise, natural English.
- pob_phrase: cut through bars of iron
  simplified_phrase: cut through iron bars
  preserved_meaning: God will decisively sever the iron bars securing the way.
  reasoning_layer_used: Lexical decision for בְרִיחֵי בַרְזֶל and אֲגַדֵּעַ
  rationale: Reordering the nouns gives ordinary English without weakening the image.
