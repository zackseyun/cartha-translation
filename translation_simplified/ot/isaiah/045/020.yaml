translation:
  language: en
  text: Gather and come. Come near together, you survivors from the nations. Those who carry their carved wooden idols and pray to a god that cannot save know nothing.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Gather yourselves and come; draw near together
  simplified_phrase: Gather and come. Come near together
  preserved_meaning: The survivors are commanded to assemble, come, and approach as a group.
  reasoning_layer_used: The lexical decisions identify three coordinated commands and retain the collective force of “together.”
  rationale: Two short sentences make the summons easier to follow without merging its commands.
- pob_phrase: you survivors of the nations
  simplified_phrase: you survivors from the nations
  preserved_meaning: The people addressed are those who escaped or survived among the nations.
  reasoning_layer_used: The lexical decision prefers “survivors” as the clearest contextual meaning of פְּלִיטֵי.
  rationale: “From the nations” is more natural common English for the group’s origin.
- pob_phrase: They have no knowledge, those who carry the wood of their carved image
  simplified_phrase: Those who carry their carved wooden idols ... know nothing
  preserved_meaning: The idol worshipers are ignorant, and the objects they carry are man-made images of wood.
  reasoning_layer_used: The lexical rationale requires both the carved-image idea and the polemical emphasis on wood.
  rationale: The clause is reordered into ordinary English, while “carved wooden idols” keeps the full image.
translation_notes:
  risk_flags:
  - risk: “Know nothing” may sound broader than the prophetic charge about idol worship.
    mitigation: It directly reflects POB’s listed alternative and remains tied to the idol worshipers in the same sentence.
  - risk: Replacing “the wood of their carved image” could weaken the source image.
    mitigation: “Carved wooden idols” explicitly preserves both the material and the man-made carving.
