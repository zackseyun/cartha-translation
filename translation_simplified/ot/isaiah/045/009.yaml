translation:
  language: en
  text: Woe to anyone who argues with his Maker! He is only a broken piece of pottery among other broken pieces made from earth. Does clay say to the one shaping it, “What are you making?” Does what you made say, “He has no hands”?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or possibly, “It has no handles,” meaning that the object criticizes its own shape rather than its maker’s ability.
    reason: lexical_alternative
