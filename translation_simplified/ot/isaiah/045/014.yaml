translation:
  language: en
  text: 'Yahweh says: “Egypt’s wealth, the goods of Cush[a], and the Sabeans—men of great stature—will come over to you and belong to you. They will walk behind you and come in chains. They will bow down to you and pray to you:[b] ‘Surely God is in you. There is no other; there is no other god.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cush is the Hebrew name for a region south of Egypt, traditionally called Ethiopia in some English versions.
    reason: cultural_note
  - marker: b
    text: Or “make earnest requests to you.” The Hebrew verb can mean prayer or earnest pleading.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Thus says Yahweh
  simplified_phrase: Yahweh says
  preserved_meaning: Yahweh introduces the message as his own declaration.
  reasoning_layer_used: POB divine-name decision and target readability style
  rationale: The shorter introduction is natural English while retaining Yahweh’s name and authority.
- pob_phrase: the merchandise of Cush
  simplified_phrase: the goods of Cush
  preserved_meaning: Cush’s commercial goods or trade wealth will pass to the addressee.
  reasoning_layer_used: POB lexical decision for סְחַר
  rationale: “Goods” communicates the concrete economic sense more readily than “merchandise.”
- pob_phrase: will pass over to you and will be yours
  simplified_phrase: will come over to you and belong to you
  preserved_meaning: The peoples and their wealth will move into the addressee’s sphere and possession.
  reasoning_layer_used: POB lexical decisions for עָלַיִךְ יַעֲבֹרוּ and וְלָךְ יִהְיוּ
  rationale: The recast wording makes both movement and possession immediately clear.
translation_notes:
  risk_flags:
  - risk: “Pray to you” may sound like divine worship is being offered to Zion or Israel.
    mitigation: The main text preserves the difficult direct address, while the footnote gives the supported sense of earnest pleading.
  - risk: The movement in chains depicts captivity or forced submission and should not be softened.
    mitigation: The concrete images of walking behind and coming in chains remain explicit.
