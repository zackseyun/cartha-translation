translation:
  language: en
  text: 'Yahweh comes to court with the elders and rulers of his people: “You are the ones who have devoured the vineyard.[a] What you stole from the poor is in your houses.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The vineyard likely represents the people or community; “devoured” pictures their destructive exploitation.
    reason: cross_reference
simplification_decisions:
- pob_phrase: enters into judgment with
  simplified_phrase: comes to court with
  preserved_meaning: Yahweh enters judicial proceedings with the leaders while the Hebrew wording “with” remains intact.
  reasoning_layer_used: lexical and theological decisions on בְּמִשְׁפָּט, יָבֹוא, and עִם
  rationale: “Comes to court” makes the legal setting immediately clear without changing “with” to “against.”
- pob_phrase: the elders of his people and its princes
  simplified_phrase: the elders and rulers of his people
  preserved_meaning: Both groups are identified as leaders of Yahweh’s people.
  reasoning_layer_used: lexical decisions on זִקְנֵי עַמּוֹ and וְשָׂרָיו
  rationale: “Rulers” is a permitted alternative that is clearer than the historical title “princes.”
- pob_phrase: the plunder of the poor
  simplified_phrase: what you stole from the poor
  preserved_meaning: Their houses contain goods seized unjustly from poor people.
  reasoning_layer_used: lexical decision on גְּזֵלַת
  rationale: The verbal wording states the robbery plainly in common English.
translation_notes:
  risk_flags:
  - risk: “Comes to court” may sound like a modern courtroom rather than a prophetic judgment scene.
    mitigation: The wording preserves the judicial force while avoiding the stronger claim that Yahweh comes “against” them.
  - risk: Readers may take the vineyard only as literal property.
    mitigation: The footnote preserves its likely metaphorical reference without replacing the image in the text.
