  language: en
  text: Perfume will be replaced by decay, a belt by a rope,[a] carefully arranged hair by baldness,[b] and a rich robe by sackcloth tied around the waist. A brand will replace beauty.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Hebrew word may mean a cord or a rope-like mark of humiliation.
    reason: lexical_alternative
  - marker: b
    text: The difficult Hebrew phrase may refer more broadly to elaborate adornment or finely made clothing, but its contrast with baldness favors arranged hair.
    reason: lexical_alternative
  - marker: c
    text: The final Hebrew clause is difficult; it may refer more generally to shame or disfigurement replacing beauty.
    reason: textual_variant
