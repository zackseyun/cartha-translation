translation:
  language: en
  text: The people will oppress each other—one person against another, and everyone against their neighbor. Young people will act arrogantly toward their elders.[a] Those who are looked down on will act arrogantly toward those who are honored.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Elders” may refer to older people, people of senior social standing, or both.
    reason: lexical_alternative
