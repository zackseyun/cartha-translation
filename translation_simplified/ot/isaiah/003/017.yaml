translation:
  language: en
  text: Therefore the Lord will afflict the daughters of Zion with scabs on their heads, and Yahweh will expose their private parts.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term is difficult. It may mean “their nakedness” more generally, and some understand it as “their foreheads.”
    reason: lexical_alternative
