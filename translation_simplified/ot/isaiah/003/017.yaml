  preserved_meaning: Yahweh publicly uncovers their intimate parts as an act of humiliating judgment.
  reasoning_layer_used: Lexical and theological decisions for פָּתְהֵן and יְעָרֶה
  rationale: “Expose” is clearer modern English, while the footnote preserves the disputed noun.
- pob_phrase: the Lord ... Yahweh
