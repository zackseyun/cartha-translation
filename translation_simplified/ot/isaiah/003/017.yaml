  preserved_meaning: The Lord punishes them by inflicting a diseased, scabby condition on the tops of their heads.
  reasoning_layer_used: Lexical decisions for וְשִׂפַּח and קָדְקֹד
  rationale: The recast clause uses ordinary word order while keeping both the bodily affliction and punitive force.
- pob_phrase: will lay bare their private parts
