translation:
  language: en
  text: Their faces give evidence against them. Like Sodom, they proclaim their sin and do not try to hide it. How terrible for them! They have brought evil on themselves.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Like Sodom” recalls the city’s open, shameless wickedness; see Genesis 13:13 and 19:5.
    reason: cross_reference
simplification_decisions:
- pob_phrase: The look on their faces testifies against them
  simplified_phrase: Their faces give evidence against them
  preserved_meaning: Their visible expressions serve as evidence of their guilt.
  reasoning_layer_used: Lexical decision for הַכָּרַת פְּנֵיהֶם and forensic sense of עָנְתָה בָּם
  rationale: This replaces courtroom language with a direct statement while keeping its evidential force.
- pob_phrase: they do not hide it
  simplified_phrase: they do not try to hide it
  preserved_meaning: They make their sin known without concealing it.
  reasoning_layer_used: Lexical decisions for הִגִּידוּ and לֹא כִחֵדוּ
  rationale: The wording makes their shameless openness immediately clear.
- pob_phrase: Woe to themselves
  simplified_phrase: How terrible for them!
  preserved_meaning: The prophet announces grave trouble upon the people themselves.
  reasoning_layer_used: Theological decision on reflexive נֶפֶשׁ
  rationale: This expresses the force of “woe” without suggesting a narrowly immaterial soul.
translation_notes:
  risk_flags:
