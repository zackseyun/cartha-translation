simplification_decisions:
- pob_phrase: no inhabitant
  simplified_phrase: No one who lives there
  preserved_meaning: No resident of the restored city will report being sick.
  reasoning_layer_used: Lexical decision for שָׁכֵן and immediate context
  rationale: The wording replaces the formal noun “inhabitant” with an ordinary description of a resident.
- pob_phrase: the people who dwell there
  simplified_phrase: the people who live there
  preserved_meaning: The statement applies collectively to the settled population in that place.
  reasoning_layer_used: Lexical decision for הַיֹּשֵׁב בָּהּ
  rationale: “Live there” naturally expresses settled residence in common English.
- pob_phrase: are forgiven their iniquity
  simplified_phrase: their sins … are forgiven
  preserved_meaning: The people's moral wrongdoing and guilt are removed through forgiveness.
  reasoning_layer_used: Lexical decisions for נְשֻׂא עָוֺן
  rationale: The recast word order and familiar term “sins” make the Hebrew idiom immediately clear.
translation_notes:
  risk_flags:
  - risk: Using “sins” may make the Hebrew nuance of guilt being removed less visible.
    mitigation: The footnote preserves the concrete image of guilt being carried away or lifted.
  - risk: Readers may infer that each person's sickness was directly caused by personal sin.
    mitigation: The two blessings remain separate statements without asserting a causal link.
