translation:
  language: en
  text: He who walks in righteousness and speaks what is right, who despises profit gained by extortion, who shakes his hands free of any bribe, who refuses to listen to talk of bloodshed, and who shuts his eyes rather than look on evil—
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: speaks what is upright
  simplified_phrase: speaks what is right
  preserved_meaning: His speech is morally upright and honest.
  reasoning_layer_used: POB lexical decision for דֹבֵר מֵישָׁרִים
  rationale: “What is right” expresses moral uprightness in more familiar English.
- pob_phrase: gain from extortions
  simplified_phrase: profit gained by extortion
  preserved_meaning: He strongly rejects wealth obtained through repeated oppressive acts.
  reasoning_layer_used: POB lexical decision for בֶּצַע מַעֲשַׁקּוֹת
  rationale: The revised wording makes the source of the corrupt profit immediately clear.
- pob_phrase: stops his ears from hearing of bloodshed
  simplified_phrase: refuses to listen to talk of bloodshed
  preserved_meaning: He deliberately avoids hearing about or becoming complicit in murderous wrongdoing.
  reasoning_layer_used: POB lexical decision and cultural note for מִשְּׁמֹעַ דָּמִים
  rationale: This recasts an opaque body-part idiom while retaining active refusal and the broad reference to bloodshed.
translation_notes:
  risk_flags:
  - risk: “Talk of bloodshed” may suggest violent plans more strongly than reports of bloodshed.
    mitigation: The broad word “talk” avoids limiting the phrase to planning and preserves the POB ambiguity.
  - risk: “Shakes his hands free of any bribe” retains a source-language image that may be unfamiliar.
    mitigation: The phrase “of any bribe” makes the refusal signaled by the gesture clear.
