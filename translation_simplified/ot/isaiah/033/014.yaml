translation:
  language: en
  text: 'Sinners in Zion are filled with fear. Trembling grips the godless[a]: “Who among us can live with a fire that consumes[b]? Who among us can live with flames that burn forever?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the hypocrites.” The Hebrew word can refer more broadly to people who are impious or irreligious.
    reason: lexical_alternative
  - marker: b
    text: This fire echoes biblical descriptions of God’s holy and judging presence; compare Deuteronomy 4:24 and Hebrews 12:29.
    reason: cross_reference
simplification_decisions:
- pob_phrase: are afraid
  simplified_phrase: are filled with fear
  preserved_meaning: Fear has come upon the sinners in Zion.
  reasoning_layer_used: Lexical decision for פָּחֲדוּ
  rationale: This natural wording expresses their resulting state of fear.
- pob_phrase: a consuming fire
  simplified_phrase: a fire that consumes
  preserved_meaning: The fire remains active and devouring without adding an unstated object.
  reasoning_layer_used: Lexical and theological decisions for אֵשׁ אוֹכֵלָה
  rationale: The clause makes the participial image clear without claiming that it consumes everything.
- pob_phrase: everlasting burnings
  simplified_phrase: flames that burn forever
  preserved_meaning: The plural image of enduring flames remains intact.
  reasoning_layer_used: Lexical decision for מוֹקְדֵי עוֹלָם
  rationale: Concrete wording makes both the flame imagery and its duration easy to understand.
translation_notes:
  risk_flags:
  - risk: Readers may take the fire only as ordinary physical fire.
    mitigation: Footnote b identifies its biblical association with God’s holy and judging presence without replacing the metaphor.
  - risk: “Burn forever” may be read as importing a later doctrinal framework.
    mitigation: The wording stays within the Hebrew image of enduring flames and makes no further claim.
