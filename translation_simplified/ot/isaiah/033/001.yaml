translation:
  language: en
  text: Woe to you! You destroy others, but you have not been destroyed. You betray others, but you have not been betrayed.[a] When you finish destroying, you will be destroyed.[b] When you stop betraying, others will betray you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “they have not betrayed him,” but the main text follows the direct address and parallel wording of the verse.
    reason: alternative_reading
  - marker: b
    text: 'The Hebrew can also mean “plunder”: “When you finish plundering, you will be plundered.”'
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Woe to you, destroyer, though you yourself have not been destroyed
  simplified_phrase: Woe to you! You destroy others, but you have not been destroyed.
  preserved_meaning: The prophetic warning and reversal from destroying to being destroyed remain intact.
  reasoning_layer_used: POB lexical decisions for הוֹי and שׁוֹדֵד
  rationale: The title becomes a direct action statement, and the dense clause is split for clarity.
- pob_phrase: and betrayer, though they have not betrayed you
  simplified_phrase: You betray others, but you have not been betrayed.
  preserved_meaning: The aggressor practices betrayal without yet receiving the same treatment.
  reasoning_layer_used: POB lexical decisions for בּוֹגֵד and בָגְדוּ בוֹ, with footnote a
  rationale: The passive wording keeps the contrast clear without turning the unnamed subject into “no one.”
- pob_phrase: when you cease betraying, they will betray you
  simplified_phrase: When you stop betraying, others will betray you.
  preserved_meaning: The betrayer will eventually experience betrayal in return.
  reasoning_layer_used: POB lexical decisions for כַּנְּלֹתְךָ לִבְגֹּד and יִבְגְּדוּ בָךְ
  rationale: “Stop” is more familiar than “cease,” while “others” naturally represents the unnamed subject.
interpretive_expansions:
- pob_phrase: destroyer ... betrayer ... they
  rendering: You destroy others ... You betray others ... others will betray you
  claim: The addressee’s destructive and treacherous actions are directed against other people, who remain unspecified.
  evidence:
  - The participles identify the addressee by destructive and treacherous conduct.
  - The repeated verbs present corresponding acts done and later received.
  - POB treats the clauses as continuous direct address.
  confidence: high
  alternatives_preserved:
  - The Hebrew third-person “him” remains in footnote a.
  - The final subject may be a specific unnamed group.
translation_notes:
  risk_flags:
  - risk: Changing “destroyer” and “betrayer” from titles to verbs may lessen their accusatory force.
    mitigation: The opening “Woe to you!” and repeated direct accusations preserve the denunciation.
  - risk: The passive “you have not been betrayed” leaves the original plural subject unstated.
    mitigation: This avoids an unsupported universal claim, while footnote a preserves the Hebrew pronoun issue.
