  preserved_meaning: The land is personified as mourning while its physical desolation remains clear.
  reasoning_layer_used: Lexical decisions for אָבַל and אֻמְלְלָה
  rationale: “Dries up” makes the physical devastation immediately understandable without removing the land’s mourning.
- pob_phrase: is ashamed
