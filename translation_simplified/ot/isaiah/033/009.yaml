translation:
  language: en
  text: The land mourns and dries up. Lebanon is put to shame and withers away. Sharon has become like a desert plain,[a] and Bashan and Carmel shake off their leaves.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew “like the Arabah,” a geographic name that can also refer to a desert plain.
    reason: lexical_alternative
