  preserved_meaning: Lebanon is poetically portrayed as humiliated by its devastation.
  reasoning_layer_used: Lexical decision for הֶחְפִּיר
  rationale: The verbal phrase is natural modern English and retains the personification.
- pob_phrase: like the Arabah
  simplified_phrase: like a desert plain
  preserved_meaning: Sharon has become arid instead of remaining fertile.
  reasoning_layer_used: Lexical decision and alternatives for כָּעֲרָבָה
  rationale: The main text gives the clear landscape image while the footnote preserves the geographic term.
