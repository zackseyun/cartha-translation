translation:
  language: en
  text: Yahweh, show us grace; we wait for you. Be their strength every morning,[a] and be our salvation when we are in trouble.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “their arm.” Here “arm” is an image of strength or saving power. Some understand “their” as referring collectively to the people praying and translate it “our.”
    reason: alternative_reading
