translation:
  language: en
  text: Your ropes hang loose. They cannot firmly secure the base of the mast or spread the sail.[a] Then a great amount of plunder will be divided up.[b] Even people who are lame will carry off the spoil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “spread the banner.” The Hebrew word usually means a banner or signal flag, but “sail” fits the ship picture here.
    reason: lexical_alternative
  - marker: b
    text: The broken ship pictures the enemy’s downfall and how easily its wealth will be taken.
    reason: cultural_note
simplification_decisions:
- pob_phrase: they cannot hold firm the base of their mast
  simplified_phrase: They cannot firmly secure the base of the mast
  preserved_meaning: The loose ropes cannot keep the mast structure secure.
  reasoning_layer_used: POB lexical decisions for יְחַזְּקוּ, כֵן, and תָּרְנָם
  rationale: The recast clause uses ordinary English while retaining the deliberately cautious word “base.”
- pob_phrase: abundant plunder will be divided
  simplified_phrase: a great amount of plunder will be divided up
  preserved_meaning: A large quantity of captured wealth will be apportioned.
  reasoning_layer_used: POB lexical decision for עַד שָׁלָל מַרְבֶּה
  rationale: “A great amount” is more immediately understandable than “abundant” in this construction.
- pob_phrase: even the lame will carry off the spoil
  simplified_phrase: Even people who are lame will carry off the spoil
  preserved_meaning: The enemy will be so helpless that even those with limited mobility can take its goods.
  reasoning_layer_used: POB lexical decisions for פִּסְחִים and בָּזְזוּ בַז
  rationale: Person-first wording is clear and dignified without weakening the verse’s force.
