  preserved_meaning: Rowing ships cannot navigate this watery place.
  reasoning_layer_used: lexical decisions for בַּל תֵּלֶךְ בּוֹ and אֳנִי שַׁיִט
  rationale: A separate sentence and “travel” make the navigation image easier to follow.
- pob_phrase: and no mighty vessel can pass through
