translation:
  language: en
  text: Look at Zion, the city of our appointed festivals.[a] Your own eyes will see Jerusalem as a peaceful home—a tent that will never be moved. Its stakes will never be pulled up, and none of its ropes will break.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the city of our appointed gatherings.” The Hebrew may refer to appointed festivals or worship assemblies.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Look upon Zion
  simplified_phrase: Look at Zion
  preserved_meaning: A direct command calls the hearer to observe Zion.
  reasoning_layer_used: lexical decision for חֲזֵה
  rationale: “Look at” keeps the imperative force in more common English.
- pob_phrase: a quiet habitation
  simplified_phrase: a peaceful home
  preserved_meaning: Jerusalem is pictured as a dwelling free from disturbance.
  reasoning_layer_used: lexical decisions for נָוֶה and שַׁאֲנָן
  rationale: “Peaceful home” expresses the settled, undisturbed dwelling in familiar language.
- pob_phrase: none of its ropes will be torn apart
  simplified_phrase: none of its ropes will break
  preserved_meaning: The tent cords will remain intact, completing the image of lasting stability.
  reasoning_layer_used: lexical decision for וְכָל חֲבָלָיו בַּל יִנָּתֵקוּ
  rationale: “Break” is natural English and retains the physical tent image.
translation_notes:
  risk_flags:
  - risk: “Peaceful” may be heard as broader than the Hebrew sense of being quiet or undisturbed.
    mitigation: The unmoved tent, stakes, and ropes keep the emphasis on secure stability.
