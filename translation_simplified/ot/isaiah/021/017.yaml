simplification_decisions:
- pob_phrase: the remainder of the number of the bowmen ... will be few
  simplified_phrase: Only a few ... archers will remain
  preserved_meaning: The surviving archers will be reduced to a small number.
  reasoning_layer_used: POB lexical decisions for שְׁאָר, מִסְפַּר, קֶשֶׁת, and יִמְעָטוּ
  rationale: This recasts the awkward quantitative wording as natural English while retaining the bow image.
- pob_phrase: the mighty men of the sons of Kedar
  simplified_phrase: Kedar’s mighty archers
  preserved_meaning: The men are Kedar’s powerful warriors who fight with bows.
  reasoning_layer_used: POB lexical decisions for גִּבּוֹרֵי and בְנֵי קֵדָר
  rationale: The compact possessive identifies the people clearly without separating the warriors from the archers.
- pob_phrase: for Yahweh, the God of Israel, has spoken
  simplified_phrase: because Yahweh, the God of Israel, has spoken
  preserved_meaning: Yahweh’s declaration guarantees the announced outcome.
  reasoning_layer_used: POB lexical and theological decisions for יְהוָה and דִּבֵּר
  rationale: “Because” makes the logical connection clear while preserving the divine name and prophetic certainty.
