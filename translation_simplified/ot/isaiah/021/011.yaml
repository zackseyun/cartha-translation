    mitigation: The main text retains Dumah, and the footnote presents the Edom connection only as an interpretation.
  - risk: The clearer question may lose some of the Hebrew idiom’s open-ended poetic force.
    mitigation: The rendering preserves the repeated address, question, and image of the night progressing.
