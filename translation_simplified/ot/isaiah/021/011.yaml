translation:
  language: en
  text: 'A prophetic message about Dumah:[a]


    Someone calls to me from Seir,

    “Watchman, how far has the night gone?

    Watchman, how far has the night gone?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dumah may also echo the Hebrew word for “silence.” Some interpreters connect Dumah with Edom because Seir is mentioned next.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: An oracle concerning Dumah
  simplified_phrase: A prophetic message about Dumah
  preserved_meaning: The heading introduces a prophetic pronouncement directed toward Dumah.
  reasoning_layer_used: POB lexical decision for מַשָּׂא and theological decision on Dumah
  rationale: “Prophetic message” explains the less familiar term “oracle” while keeping Dumah as an unresolved proper name.
- pob_phrase: One calls to me from Seir
  simplified_phrase: Someone calls to me from Seir
  preserved_meaning: An unidentified singular speaker calls from Seir.
  reasoning_layer_used: POB lexical decision for קֹרֵא
  rationale: “Someone” is more natural common English and does not identify the speaker.
- pob_phrase: what of the night?
  simplified_phrase: how far has the night gone?
  preserved_meaning: The repeated question asks about the state or progress of the night.
  reasoning_layer_used: POB lexical decisions for מַה מִלַּיְלָה and מַה מִלֵּיל
  rationale: The clearer idiom directly communicates the question while preserving its night-watch image and repetition.
translation_notes:
  risk_flags:
