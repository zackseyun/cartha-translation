translation:
  language: en
  text: Then he cried out, “A lion![a] My lord, I remain on the watchtower all day, and I stay at my post every night.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “A lion!” The difficult phrase may compare the watchman’s cry to a lion’s roar.
    reason: alternative_reading
  - marker: b
