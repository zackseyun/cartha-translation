translation:
  language: en
  text: A prophetic message about the wilderness of the sea:[a] Like whirlwinds sweeping through the Negev,[b] it comes from the wilderness—from a fearsome land.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the desert by the sea.” The unusual Hebrew phrase may be a poetic name for a place.
    reason: lexical_alternative
  - marker: b
    text: Or “like storms sweeping through the south.” The Negev is the southern desert region.
    reason: cultural_note
  - marker: c
    text: The Hebrew does not say what “it” refers to; it may mean the storm-like force just described.
    reason: lexical_alternative
