translation:
  language: en
  text: You have even appointed prophets to make announcements about you in Jerusalem, saying, “There is a king in Judah!”[a] The king will now hear these reports. So come, and let us discuss the matter together.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says only “king in Judah”; it implies a claim to kingship but does not name Nehemiah in the quoted words.
    reason: alternative_reading
