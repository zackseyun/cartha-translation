translation:
  language: en
  text: He was hired to make me afraid, so that I would do what he suggested and sin. Then they would have grounds for a damaging report against me and could use it to disgrace me.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: 'He was hired for this purpose: that I should become afraid'
  simplified_phrase: He was hired to make me afraid
  preserved_meaning: His payment was intended to frighten Nehemiah.
  reasoning_layer_used: Lexical decisions for לְמַעַן, שָׂכוּר, and אִירָא
  rationale: The direct purpose clause is clearer than the formal introductory construction.
- pob_phrase: act that way
  simplified_phrase: do what he suggested
  preserved_meaning: Nehemiah was being pressured to carry out Shemaiah's proposed action.
  reasoning_layer_used: Lexical decision for וְאֶעֱשֶׂה כֵן and immediate context
  rationale: The clearer wording identifies what “that way” refers to without adding a new action.
- pob_phrase: they would have grounds for an evil report, in order that they might reproach me
  simplified_phrase: they would have grounds for a damaging report against me and could use it to disgrace me
  preserved_meaning: Nehemiah's enemies wanted material they could use to damage his reputation.
  reasoning_layer_used: Lexical decisions for וְהָיָה לָהֶם לְשֵׁם רָע and יְחָרְפוּנִי
  rationale: Common wording makes the slander and public shame readily understandable.
translation_notes:
  risk_flags:
  - risk: “Damaging report” may sound less morally charged than POB's “evil report.”
    mitigation: “Against me” and “use it to disgrace me” retain the report's hostile purpose.
