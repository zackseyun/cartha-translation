translation:
  language: en
  text: My God, remember Tobiah and Sanballat for what they have done. Remember also Noadiah the prophetess and the other prophets who kept trying to frighten me.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Remember Tobiah and Sanballat, my God, according to these deeds of theirs
  simplified_phrase: My God, remember Tobiah and Sanballat for what they have done.
  preserved_meaning: Nehemiah asks God to remember the two opponents in accordance with their actions.
  reasoning_layer_used: Lexical and theological decisions on זָכְרָה and כְּמַעֲשָׂיו אֵלֶּה
  rationale: The direct address comes first, and ordinary wording replaces the dense phrase without adding explicit judgment.
- pob_phrase: and also Noadiah the prophetess and the rest of the prophets
  simplified_phrase: Remember also Noadiah the prophetess and the other prophets
  preserved_meaning: The prayer includes Noadiah and the remaining prophets with the first two opponents.
  reasoning_layer_used: Lexical decisions on וְגַם and וּלְיֶתֶר הַנְּבִיאִים
  rationale: Repeating “Remember” creates a clear sentence while preserving the added group.
- pob_phrase: who were trying to make me afraid
  simplified_phrase: who kept trying to frighten me
  preserved_meaning: The prophets were engaged in an ongoing effort to cause Nehemiah fear.
  reasoning_layer_used: Lexical decision on אֲשֶׁר הָיוּ מְיָרְאִים אוֹתִי
  rationale: “Kept trying to frighten me” states the ongoing causative action in natural English.
