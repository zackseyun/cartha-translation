translation:
  language: en
  text: Then I went to the home of Shemaiah, son of Delaiah and grandson of Mehetabel. He was shut in. He said, “Let us meet at God’s house, inside the temple building.[a] Let us shut the temple doors, because people are coming to kill you. Yes, they are coming at night to kill you.”
  philosophy: optimal-equivalence
  footnotes:
