translation:
  language: en
  text: They were all trying to frighten us. They said, “Their hands will grow weak and they will stop working, so the work will not be finished.” But now, God,[a] strengthen my hands.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is naturally read as a brief prayer to God; with a different vocalization, some understand, “But now I strengthened my hands.”
