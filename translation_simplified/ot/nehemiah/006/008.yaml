simplification_decisions:
- pob_phrase: So I sent to him, saying
  simplified_phrase: So I sent him this reply
  preserved_meaning: Nehemiah sent the man a direct response.
  reasoning_layer_used: The lexical decisions treat this as the next narrative action introducing direct speech.
  rationale: “Sent him this reply” expresses the action in ordinary English.
- pob_phrase: These things that you are saying have not happened
  simplified_phrase: These things you are saying did not happen
  preserved_meaning: Nehemiah denies that the reported events were real.
  reasoning_layer_used: The lexical rationale says היה denies the reality or occurrence of the accusations.
  rationale: The simple past states the denial clearly without changing its force.
- pob_phrase: you are inventing them out of your own heart
  simplified_phrase: You are making them up in your own mind
  preserved_meaning: The accusations are fabrications originating in the accuser’s own thought and intention.
  reasoning_layer_used: The lexical decisions allow “making them up” and explain that heart includes thought and intention.
  rationale: “In your own mind” prevents readers from mistaking the Hebrew image as chiefly emotional.
translation_notes:
  risk_flags:
  - risk: Replacing “heart” removes the source-language body image.
    mitigation: “Mind” directly preserves its contextual force of inner thought and intention.
