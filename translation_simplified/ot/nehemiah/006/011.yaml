  text: But I said, “Should a man in my position run away? And how could a man like me enter the temple[a] and live? I will not go in.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “sanctuary.” The proposal likely required Nehemiah to enter a restricted temple area improperly, not merely to hide inside the building.
