translation:
  language: en
  text: But as soon as they had relief,[a] they returned to doing evil before you. So you abandoned them to the power of their enemies, who ruled over them. Then they turned back and cried out to you. You heard from heaven and delivered them many times, in keeping with your abundant mercies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “when they had relief.” The Hebrew can state the timing without emphasizing how quickly they returned to evil.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: as soon as they had rest
  simplified_phrase: as soon as they had relief
  preserved_meaning: A period of relief was followed immediately by renewed evil.
  reasoning_layer_used: Lexical decision for וּכְנוֹחַ and its contextual rationale
  rationale: “Relief” makes the historical sense of “rest” clearer while the footnote preserves the less emphatic timing.
- pob_phrase: abandoned them into the hand of their enemies
  simplified_phrase: abandoned them to the power of their enemies
  preserved_meaning: God withdrew protection and gave them over to enemy control as judgment.
  reasoning_layer_used: Lexical decision for בְּיַד אֹיְבֵיהֶם and theological decision on divine abandonment
  rationale: “To the power of” explains the Hebrew hand idiom without weakening “abandoned.”
- pob_phrase: and you heard from heaven and delivered them many times according to your abundant mercies
  simplified_phrase: You heard from heaven and delivered them many times, in keeping with your abundant mercies
  preserved_meaning: God repeatedly heard and rescued them because his acts matched his abundant compassion.
  reasoning_layer_used: Iterative verbal decision and lexical decisions for נצל, רַחֲמִים, and עִתִּים
  rationale: A new sentence and natural clause order clarify the repeated pattern while retaining “delivered” and plural “mercies.”
translation_notes:
  risk_flags:
  - risk: “As soon as” emphasizes an immediate relapse more strongly than the temporal clause alone requires.
    mitigation: The retained footnote gives the less emphatic alternative.
  - risk: Replacing the concrete “hand” image removes a source-language metaphor.
    mitigation: “Power” states the documented meaning of the idiom and preserves the enemies’ control.
