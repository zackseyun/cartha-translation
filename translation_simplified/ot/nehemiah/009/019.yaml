translation:
  language: en
  text: But because your mercies[a] are so abundant, you did not abandon them in the wilderness. By day, the pillar of cloud remained above them to lead them on the way. By night, the pillar of fire remained above them to give them light and to light the way they were to go.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “because of your great compassion.” The Hebrew literally says “your many mercies.”
    reason: lexical_alternative
