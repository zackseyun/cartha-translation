translation:
  language: en
  text: You alone are Yahweh. You made the heavens, even the highest heavens, and all their heavenly host.[a] You made the earth and everything on it, and the seas and everything in them. You keep them all alive, and the heavenly host bows down to you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “heavenly host” may include the stars, heavenly beings, or both.
    reason: lexical_alternative
