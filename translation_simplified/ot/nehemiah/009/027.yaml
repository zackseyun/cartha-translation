translation:
  language: en
  text: So you handed them over to the power of their enemies, who oppressed them. But when they were in distress, they cried out to you. You heard them from heaven, and in your great compassion you gave them deliverers,[a] who saved them from the power of their enemies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated “saviors.” Here it refers to human agents God gave to rescue his people.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: gave them into the hand of their adversaries
  simplified_phrase: handed them over to the power of their enemies
  preserved_meaning: God placed them under the control of hostile opponents.
  reasoning_layer_used: Lexical decisions for נתן, בְּיַד, and צָרֵיהֶם
  rationale: The wording explains the Hebrew hand image as power while preserving its force.
- pob_phrase: in the time of their distress
  simplified_phrase: when they were in distress
  preserved_meaning: They appealed to God during their suffering.
  reasoning_layer_used: Lexical decision for עֵת + צָרָה
  rationale: The time phrase becomes a direct modern clause without weakening their distress.
- pob_phrase: according to your abundant mercies
  simplified_phrase: in your great compassion
  preserved_meaning: God acted out of his abundant mercy toward them.
  reasoning_layer_used: Lexical decision for רַחֲמִים and its documented alternative
  rationale: The documented alternative expresses the same basis for God's rescue in common English.
translation_notes:
  risk_flags:
  - risk: “Deliverers” may be mistaken for divine saviors.
    mitigation: The footnote identifies them as human agents given by God.
