  text: They captured fortified cities and fertile land. They took possession of houses filled with every good thing, carved water-storage pits, vineyards, olive trees, and fruit trees in abundance. They ate their fill and grew fat.[a] They delighted in your great goodness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew image describes prosperity from abundant food; it does not necessarily imply moral judgment here.
    reason: simplification_note
