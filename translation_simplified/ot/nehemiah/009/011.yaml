  preserved_meaning: The people traveled through the sea’s interior on dry ground.
  reasoning_layer_used: Lexical decision for בְתוֹךְ הַיָּם
  rationale: “Middle” replaces the less familiar “midst,” while “it” avoids repetition.
- pob_phrase: their pursuers
