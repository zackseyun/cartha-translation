translation:
  language: en
  text: You warned them so that they would return to your law. But they acted in arrogant defiance and did not listen to your commandments. They sinned against your judgments—the judgments by which a man who obeys them will live.[a][b] They turned a stubborn shoulder and stiffened their necks; they refused to listen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a person who obeys them will live.” The Hebrew word translated “man” refers here to any human being.
    reason: lexical_alternative
  - marker: b
    text: This echoes Leviticus 18:5, where obeying God’s statutes is described as the path of life.
    reason: cross_reference
  - marker: c
    text: The shoulder and neck images picture stubborn resistance.
    reason: simplification_note
simplification_decisions:
- pob_phrase: in order to bring them back to your law
  simplified_phrase: so that they would return to your law
  preserved_meaning: God’s warning was intended to turn the people back to his law.
  reasoning_layer_used: Lexical decision for לַהֲשִׁיבָם אֶל תּוֹרָתֶךָ
  rationale: The simpler clause keeps both the purpose and the idea of returning.
- pob_phrase: acted presumptuously
  simplified_phrase: acted in arrogant defiance
  preserved_meaning: Their conduct was proud, insolent rebellion rather than an innocent mistake.
  reasoning_layer_used: Lexical decision for הֵזִידוּ
  rationale: Common wording makes the verb’s active covenant rebellion clear.
- pob_phrase: by which a man shall live if he does them
  simplified_phrase: the judgments by which a man who obeys them will live
  preserved_meaning: A generic man will live by obeying God’s judgments.
  reasoning_layer_used: Lexical and theological decisions for אָדָם and the Leviticus 18:5 echo
  rationale: The recast clause remains clear without adding a concessive relationship.
interpretive_expansions:
- pob_phrase: acted presumptuously
  rendering: acted in arrogant defiance
  claim: Their presumption took the form of deliberate, arrogant resistance to God.
  evidence:
  - The lexical rationale says זיד conveys insolence rather than mere inward pride.
  - The surrounding refusals to listen identify the action as rebellion.
  confidence: high
  alternatives_preserved:
  - acted presumptuously
  - acted proudly
  external_witnesses:
  - HALOT
translation_notes:
  risk_flags:
  - risk: “Arrogant defiance” states the rebellious force more directly than “presumptuously.”
    mitigation: The supplied lexical rationale and repeated refusal to listen support this clarification.
  - risk: The shoulder and neck metaphors may remain unfamiliar to some readers.
    mitigation: A brief footnote explains their shared image of stubborn resistance.
