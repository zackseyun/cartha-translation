  language: en
  text: But they refused to listen. They forgot the wonders you had done among them. In their rebellion, they stubbornly stiffened their necks and appointed a leader to take them back into slavery. But you are a God whose forgiveness is abundant.[a] You are gracious and compassionate, slow to anger and abundant in steadfast love, and you did not abandon them.
