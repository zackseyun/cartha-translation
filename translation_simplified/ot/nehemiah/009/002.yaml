translation:
  language: en
  text: Then the descendants of Israel separated themselves from all foreigners. They stood and confessed their own sins and the wrongs committed by their ancestors.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “the iniquities of their fathers”; they included their ancestors’ wrongdoing in this shared confession.
    reason: source_note
simplification_decisions:
- pob_phrase: the offspring of Israel
  simplified_phrase: the descendants of Israel
  preserved_meaning: The people are identified by their shared descent from Israel.
  reasoning_layer_used: Lexical decision for זֶרַע יִשְׂרָאֵל
  rationale: “Descendants” expresses the genealogical meaning more naturally than “offspring.”
- pob_phrase: the iniquities of their fathers
  simplified_phrase: the wrongs committed by their ancestors
  preserved_meaning: They acknowledged the morally serious wrongdoing of earlier generations.
  reasoning_layer_used: Lexical and theological decisions for עֲוֺנוֹת אֲבֹתֵיהֶם
  rationale: This replaces difficult religious wording while keeping ancestral wrongdoing distinct from their own sins.
- pob_phrase: and they stood and confessed
  simplified_phrase: They stood and confessed
  preserved_meaning: Their standing posture accompanied their confession.
  reasoning_layer_used: Lexical decisions for וַיַּעַמְדוּ and וַיִּתְוַדּוּ
  rationale: A new sentence makes the sequence easier to follow without changing either action.
translation_notes:
  risk_flags:
  - risk: Confessing ancestral wrongdoing could be mistaken for claiming inherited personal culpability.
    mitigation: The wording says the ancestors committed the wrongs, while the footnote preserves the corporate confession.
