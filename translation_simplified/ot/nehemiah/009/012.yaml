translation:
  language: en
  text: During the day, you led them with a pillar of cloud. At night, you used a pillar of fire to light the way they should go.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: By a pillar of cloud you led them by day
  simplified_phrase: During the day, you led them with a pillar of cloud
  preserved_meaning: God guided Israel in the daytime by means of the cloud pillar.
  reasoning_layer_used: POB lexical decision for וּבְעַמּוּד עָנָן and יוֹמָם
  rationale: The new order follows ordinary English while keeping the cloud as God's means of guidance.
- pob_phrase: by a pillar of fire by night to give them light
  simplified_phrase: At night, you used a pillar of fire to light
  preserved_meaning: God used the fire pillar at night to provide light.
  reasoning_layer_used: POB lexical decisions for וּבְעַמּוּד אֵשׁ, לַיְלָה, and לְהָאִיר לָהֶם
  rationale: The active wording makes the instrument and purpose immediately clear.
- pob_phrase: on the way in which they should go
  simplified_phrase: the way they should go
  preserved_meaning: The light revealed the intended route for Israel.
  reasoning_layer_used: POB lexical decisions for אֶת הַדֶּרֶךְ and אֲשֶׁר יֵלְכוּ בָהּ
  rationale: Removing the formal relative construction gives natural English without weakening the intended direction.
