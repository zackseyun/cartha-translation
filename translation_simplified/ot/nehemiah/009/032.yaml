translation:
  language: en
  text: And now, our God, you are the great, mighty, and fearsome God.[a] You keep your covenant and show steadfast love. Please do not consider all the hardship that has come upon us a small matter. It has fallen on our kings and officials, our priests and prophets, our fathers,[b] and all your people, from the time of the kings of Assyria until today.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “awesome.” The Hebrew describes God as inspiring reverent fear.
    reason: lexical_alternative
  - marker: b
    text: Or “our ancestors.” The Hebrew refers to the forefathers of the people.
    reason: lexical_alternative
