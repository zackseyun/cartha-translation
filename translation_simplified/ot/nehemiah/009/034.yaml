  preserved_meaning: All four groups belong to Israel and share responsibility.
  reasoning_layer_used: POB lexical decisions
  rationale: Using one “our” makes the list smoother without changing its scope.
- pob_phrase: did not keep your law
  simplified_phrase: did not obey your law
  preserved_meaning: They failed to live according to God’s covenantal law.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Obey” states the idiomatic force of keeping the law in common English.
- pob_phrase: and they did not pay attention
