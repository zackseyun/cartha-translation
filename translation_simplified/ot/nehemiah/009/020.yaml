  text: You gave them your good Spirit to teach them. You did not keep your manna from their mouths, and you gave them water when they were thirsty.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “your good spirit.” The Hebrew can refer to God’s Spirit or to your good spirit; here it most likely refers to God’s Spirit guiding and teaching Israel.
