translation:
  language: en
  text: You found that he was faithful to you in his heart. You made a covenant with him, promising to give his offspring[a] the land of the Canaanites, Hittites, Amorites, Perizzites, Jebusites, and Girgashites. You have done what you said you would do, because you are righteous.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “his descendants”; the Hebrew word is singular in form but refers collectively to those descended from him.
    reason: lexical_alternative
  - marker: b
    text: Or “just.”
    reason: lexical_alternative
