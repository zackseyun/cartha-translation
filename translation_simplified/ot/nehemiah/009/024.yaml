translation:
  language: en
  text: Then their sons entered the land and took possession of it. You subdued the people living there—the Canaanites—and gave them into the sons’ power, along with their kings and the peoples of the land. The sons could deal with them as they pleased.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the sons came in and took possession of the land
  simplified_phrase: their sons entered the land and took possession of it
  preserved_meaning: The descendants of Israel entered Canaan and occupied it.
  reasoning_layer_used: lexical and theological decisions on הַבָּנִים and וַיִּירְשׁוּ
  rationale: Adding “their” makes the family connection clear while retaining the Hebrew image of sons.
- pob_phrase: the inhabitants of the land, the Canaanites
  simplified_phrase: the people living there—the Canaanites
  preserved_meaning: God subdued the Canaanite inhabitants of the land.
  reasoning_layer_used: lexical decisions on יֹשְׁבֵי הָאָרֶץ and הַכְּנַעֲנִים
  rationale: Common wording replaces the formal term “inhabitants” without weakening the conquest language.
- pob_phrase: gave them into their hand ... to do with them according to their will
  simplified_phrase: gave them into the sons’ power ... The sons could deal with them as they pleased
  preserved_meaning: God placed the Canaanites and their rulers under Israel’s control.
  reasoning_layer_used: lexical alternatives and theological decision on conquest language
  rationale: The Hebrew power idiom is stated directly, and the dense clause is divided for clarity.
