translation:
  language: en
  text: But they acted defiantly and rebelled against you. They threw your law behind their backs. They killed your prophets, who had warned them so that they would return to you. They committed grave acts of blasphemy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “blasphemy” includes acts of contempt toward God, not only blasphemous words.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: acted presumptuously and rebelled against you
  simplified_phrase: acted defiantly and rebelled against you
  preserved_meaning: Their defiant conduct led into open rebellion against God.
  reasoning_layer_used: Lexical and theological decisions on the paired rebellion verbs
  rationale: “Acted defiantly” is clearer than “acted presumptuously” and retains the action sense without merging the two verbs.
- pob_phrase: cast your law behind their backs
  simplified_phrase: threw your law behind their backs
  preserved_meaning: They contemptuously rejected God's law.
  reasoning_layer_used: Lexical decision preserving the Hebrew rejection image
  rationale: “Threw” is common English and keeps the vivid physical image.
- pob_phrase: who had warned them in order to bring them back to you
  simplified_phrase: who had warned them so that they would return to you
  preserved_meaning: The prophets warned the people with the aim of turning them back to God.
  reasoning_layer_used: Lexical decisions for prophetic warning and restorative purpose
  rationale: The simpler purpose clause keeps the warnings’ intended relational direction.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “blasphemy” as speech alone.
    mitigation: The footnote explains that the Hebrew also covers contemptuous acts toward God.
