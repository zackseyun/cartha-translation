translation:
  language: en
  text: The land yields a rich harvest, but it goes to the kings you have put over us because of our sins. They rule over our bodies[a] and our livestock as they please. We are in great distress.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “our persons”; the Hebrew says “our bodies.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Its abundant produce goes to the kings
  simplified_phrase: The land yields a rich harvest, but it goes to the kings
  preserved_meaning: The land produces plenty, yet its harvest benefits the foreign rulers.
  reasoning_layer_used: Lexical decisions and the previous-verse referent
  rationale: This names the land directly and expresses its abundant produce as a clear action.
- pob_phrase: whom you have set over us because of our sins
  simplified_phrase: you have put over us because of our sins
  preserved_meaning: God subjected the people to these kings as judgment for their sins.
  reasoning_layer_used: Theological decision on divine agency
  rationale: “Put over us” is simpler while preserving God's direct judicial action.
- pob_phrase: They rule over our bodies and over our livestock as they please
  simplified_phrase: They rule over our bodies and our livestock as they please
  preserved_meaning: The kings continually exercise arbitrary power over the people and their animals.
  reasoning_layer_used: Lexical decisions for rule, bodies, livestock, and as they please
  rationale: This removes repetition while retaining ongoing rule and the bodily image.
interpretive_expansions:
- pob_phrase: Its abundant produce goes to the kings
  rendering: The land yields a rich harvest, but it goes to the kings
  claim: The plentiful harvest contrasts with the people's inability to enjoy it.
  evidence:
  - The suffix refers to the land in the previous verse.
  - The harvest benefits the kings while the people remain in great distress.
  confidence: high
  alternatives_preserved:
  - The land’s abundant harvest goes to the kings.
translation_notes:
  risk_flags:
  - risk: “But” makes the lament's contrast more explicit than the Hebrew conjunction alone.
    mitigation: The surrounding clauses support the contrast between a rich harvest and the people's distress.
  - risk: “You have put over us” could be mistaken for approval of the kings' conduct.
    mitigation: The verse attributes the subjection to divine judgment without endorsing the kings' oppressive rule.
