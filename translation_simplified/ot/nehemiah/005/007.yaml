translation:
  language: en
  text: After thinking the matter over, I brought charges against the nobles and officials.[a] I told them, “Each of you is charging interest to your own brothers—your fellow Israelites.” Then I called a large public assembly to confront them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean, “I contended with the nobles and officials.”
    reason: lexical_alternative
