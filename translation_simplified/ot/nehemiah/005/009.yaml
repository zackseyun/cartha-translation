translation:
  language: en
  text: So I said, “What you are doing is not good. Shouldn’t you walk in fear of our God—that is, live with reverence for him—because our enemy nations bring disgrace on us?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “so that our enemy nations will not bring disgrace on us.” The Hebrew may express either motive or intended avoidance.
    reason: lexical_alternative
