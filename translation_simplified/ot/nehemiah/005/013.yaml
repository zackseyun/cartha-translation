translation:
  language: en
  text: I also shook out the fold of my robe and said, “In the same way, may God shake every man who does not keep this promise out of his home and the fruits of his labor.[a] May he be shaken out and left with nothing.” The whole assembly said, “Amen,” and praised Yahweh. Then the people kept their promise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may mean either his labor itself or what his labor has produced.
    reason: lexical_alternative
