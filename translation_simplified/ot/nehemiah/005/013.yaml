  preserved_meaning: The curse asks God to dispossess any man who breaks the promise, matching Nehemiah’s gesture.
  reasoning_layer_used: lexical decision for נער and contextual oath imagery
  rationale: The recast sentence preserves the repeated shaking image while clarifying the comparison.
- pob_phrase: did according to this promise
