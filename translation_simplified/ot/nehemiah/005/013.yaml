  preserved_meaning: Nehemiah shook the part of his clothing used to hold items as a symbolic act.
  reasoning_layer_used: lexical decision for חָצְנִי
  rationale: “Robe” makes the ancient garment easier to picture without changing the gesture.
- pob_phrase: So may God shake out every man
