  preserved_meaning: The creditors must return the people’s property immediately.
  reasoning_layer_used: Lexical decision for הָשִׁיבוּ and urgency decision for כְּהַיּוֹם.
  rationale: “Give back” is clearer than “restore” while keeping the command and urgency.
- pob_phrase: the hundredth part
  simplified_phrase: the one percent
  preserved_meaning: They must return the specified hundredth share taken from the people.
  reasoning_layer_used: Lexical alternatives for וּמְאַת.
  rationale: “One percent” expresses the same fraction in familiar modern language.
- pob_phrase: that you have been exacting from them
  simplified_phrase: that you have been taking from them
  preserved_meaning: The wording describes an ongoing oppressive creditor practice without defining its precise mechanism.
  reasoning_layer_used: Lexical and theological decisions for אֲשֶׁר אַתֶּם נֹשִׁים בָּהֶם.
  rationale: “Taking from them” is plain English, while the footnote preserves the financial ambiguity.
