translation:
  language: en
  text: Also, from the day King Artaxerxes appointed me governor in Judah—the twentieth year of his reign—until his thirty-second year, twelve years in all, my brothers and I did not eat from the governor’s food allowance.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally “the governor’s bread,” meaning the food or allowance customarily due to the governor.
    reason: lexical_alternative
