translation:
  language: en
  text: The governors before me burdened the people with heavy demands. They took bread and wine from them, plus forty shekels’ weight of silver.[a] Even their servants exercised authority over the people. But I did not act that way, because I feared God.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A shekel was an ancient unit of weight.
    reason: cultural_note
  - marker: b
    text: Literally “because of the fear of God,” meaning reverence for God and accountability to him.
    reason: simplification_note
simplification_decisions:
- pob_phrase: laid heavy burdens on the people
  simplified_phrase: burdened the people with heavy demands
  preserved_meaning: The earlier governors imposed oppressive demands while retaining the Hebrew image of heaviness.
  reasoning_layer_used: POB lexical decision for הִכְבִּידוּ עַל הָעָם
  rationale: The recast wording makes the kind of burden clearer without flattening the source image.
- pob_phrase: besides forty shekels of silver
  simplified_phrase: plus forty shekels’ weight of silver
  preserved_meaning: Bread and wine were taken in addition to a levy of forty shekels of silver.
  reasoning_layer_used: POB lexical decision and footnote for אַחַר כֶּסֶף שְׁקָלִים אַרְבָּעִים
  rationale: “Plus” clearly marks the added levy, while “weight” explains the ancient measure.
- pob_phrase: because of the fear of God
  simplified_phrase: because I feared God
  preserved_meaning: Nehemiah acted differently out of reverence for God and accountability before him.
  reasoning_layer_used: POB theological decision for יִרְאַת אֱלֹהִים
  rationale: The personal verb is easier to understand, and the footnote preserves the biblical idiom.
translation_notes:
  risk_flags:
  - risk: Modern readers may hear “feared God” as terror alone.
    mitigation: The footnote identifies reverence and accountability as the intended sense.
  - risk: The exact modern value of forty shekels is not supplied.
    mitigation: The text identifies the shekel as a weight without asserting an uncertain conversion.
