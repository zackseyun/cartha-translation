translation:
  language: en
  text: Mattaniah son of Micah, son of Zabdi, son of Asaph, was the leader and began the thanksgiving in prayer.[a] Bakbukiah was second among his brothers. Abda was the son of Shammua, son of Galal, son of Jeduthun.
  philosophy: optimal-equivalence
