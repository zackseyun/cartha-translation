translation:
  language: en
  text: Uzzi was the official who supervised the Levites in Jerusalem. He was the son of Bani, who was the son of Hashabiah, who was the son of Mattaniah, who was the son of Mica. Uzzi was one of Asaph’s descendants, who were singers. He also supervised the work at God’s house.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “He was responsible for the work at God’s house.”
    reason: lexical_alternative
