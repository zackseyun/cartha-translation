  text: Pethahiah son of Meshezabel, a descendant of Zerah son of Judah, served at the king’s side[a] in every matter concerning the people.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “at the king’s hand” and may mean that Pethahiah was the king’s agent.
    reason: lexical_alternative
  - marker: b
    text: Or “in every matter handled for the people.”
    reason: lexical_alternative
