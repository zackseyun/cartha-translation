simplification_decisions:
- pob_phrase: And their brothers
  simplified_phrase: Their fellow members included
  preserved_meaning: These were associated male members of the same broader group.
  reasoning_layer_used: POB lexical decision for וַאֲחֵיהֶם
  rationale: “Fellow members” clarifies the group relationship without implying literal siblings.
- pob_phrase: mighty men of valor
  simplified_phrase: brave and strong men
  preserved_meaning: The men were marked by courage and strength without necessarily holding a military role.
  reasoning_layer_used: POB lexical decision for גִּבּוֹרֵי חַיִל and grounding review
  rationale: This preserves valor and might while avoiding the narrower claim that they were warriors.
- pob_phrase: and the overseer over them was
  simplified_phrase: Their overseer was
  preserved_meaning: Zabdiel held an appointed supervisory role over the group.
  reasoning_layer_used: POB lexical decision for וּפָקִיד עֲלֵיהֶם
  rationale: Removing the repeated “over” makes the sentence natural without changing the office.
