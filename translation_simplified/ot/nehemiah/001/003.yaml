translation:
  language: en
  text: They told me, “The survivors of the captivity who remain there in the province are suffering great trouble and disgrace. Jerusalem’s wall is broken down, and its gates have been destroyed by fire.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And they said to me
  simplified_phrase: They told me
  preserved_meaning: They reported this news directly to Nehemiah.
  reasoning_layer_used: POB lexical decision for וַיֹּאמְרוּ לִי
  rationale: “Told me” introduces a report more naturally in modern English.
- pob_phrase: The remnant there in the province who survived the captivity
  simplified_phrase: The survivors of the captivity who remain there in the province
  preserved_meaning: The people left after the catastrophe are still living in the province.
  reasoning_layer_used: POB lexical decisions for הַנִּשְׁאָרִים / נִשְׁאֲרוּ, מִן הַשְּׁבִי, and בַּמְּדִינָה
  rationale: The wording keeps both survivor and remaining ideas without relying on the biblical term “remnant.”
- pob_phrase: its gates have been burned with fire
  simplified_phrase: its gates have been destroyed by fire
  preserved_meaning: Fire burned and ruined Jerusalem’s gates, leaving the damage in place.
  reasoning_layer_used: POB lexical decision for וּשְׁעָרֶיהָ נִצְּתוּ בָאֵשׁ
  rationale: This removes English redundancy while preserving the concrete image of destruction by fire.
translation_notes:
  risk_flags:
  - risk: Replacing “remnant” could reduce its collective biblical resonance.
    mitigation: “Survivors” and “remain” together preserve the repeated Hebrew emphasis on those left after catastrophe.
