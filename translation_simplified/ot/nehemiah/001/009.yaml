translation:
  language: en
  text: But if you return to me, keep my commandments, and carry them out, then even if you have been driven away as far as the ends of the heavens, I will gather you from there and bring you to the place I have chosen, where I will make my name dwell.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “where I will set my name.” The Hebrew pictures God’s name as dwelling in the chosen place.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: keep my commandments and do them
  simplified_phrase: keep my commandments, and carry them out
  preserved_meaning: Keeping God’s commandments and actively obeying them remain distinct.
  reasoning_layer_used: Lexical decisions for וּשְׁמַרְתֶּם מִצְוֺתַי and וַעֲשִׂיתֶם אֹתָם
  rationale: “Carry them out” expresses active obedience naturally without merging the two clauses.
- pob_phrase: your outcasts ... I will gather them
  simplified_phrase: you have been driven away ... I will gather you
  preserved_meaning: God promises to regather the addressed community after they have been driven into exile.
  reasoning_layer_used: Lexical decisions for נִדַּחֲכֶם and מִשָּׁם אֲקַבְּצֵם
  rationale: Consistent second-person wording avoids an unsupported limiting phrase and makes the promise easier to follow.
- pob_phrase: to make my name dwell there
  simplified_phrase: where I will make my name dwell
  preserved_meaning: God identifies the chosen place with his dwelling name without confining his being there.
  reasoning_layer_used: Theological decision on the divine-presence formula
  rationale: The recast clause reads naturally while retaining the important dwelling image.
