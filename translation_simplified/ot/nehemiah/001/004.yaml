translation:
  language: en
  text: When I heard these things, I sat down and wept. I mourned for days, and I continued fasting and praying before the God of heaven.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And when I heard these words
  simplified_phrase: When I heard these things
  preserved_meaning: Nehemiah responds to the report he has just received.
  reasoning_layer_used: POB lexical decision for הַדְּבָרִים הָאֵלֶּה
  rationale: “Things” naturally includes both the report's words and the matters described.
- pob_phrase: I sat down and wept and mourned for days
  simplified_phrase: I sat down and wept. I mourned for days
  preserved_meaning: His immediate physical grief led into sustained mourning.
  reasoning_layer_used: POB lexical decisions and source clause sequence
  rationale: Two sentences make the progression easier to follow without weakening it.
- pob_phrase: I was fasting and praying
  simplified_phrase: I continued fasting and praying
  preserved_meaning: His fasting and prayer were ongoing actions.
  reasoning_layer_used: POB aspect rationale for היה with participles
  rationale: “Continued” states the durative force clearly in ordinary English.
translation_notes:
  risk_flags:
  - risk: “Continued” could be read as uninterrupted fasting and prayer.
    mitigation: The wording marks ongoing practice without specifying that every moment was occupied by it.
