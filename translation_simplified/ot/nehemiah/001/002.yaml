translation:
  language: en
  text: Hanani, one of my brothers, came with some men from Judah. I asked them about the Jews[a] who had escaped and were left from the captivity, and about Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Judeans.” The Hebrew can refer specifically to the people of Judah or more broadly to the Jewish people.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: came—he and some men from Judah—
  simplified_phrase: came with some men from Judah
  preserved_meaning: Hanani came accompanied by an unspecified number of men from Judah.
  reasoning_layer_used: POB lexical decisions for וַיָּבֹא and וַאֲנָשִׁים מִיהוּדָה
  rationale: The direct wording removes the interrupting apposition while preserving the companions and their origin.
- pob_phrase: who had escaped, who were left from the captivity
  simplified_phrase: who had escaped and were left from the captivity
  preserved_meaning: The Jews are described both as those who escaped and as those left from the captivity.
  reasoning_layer_used: POB lexical decisions for הַפְּלֵיטָה, אֲשֶׁר נִשְׁאֲרוּ, and מִן הַשֶּׁבִי
  rationale: The wording keeps the two descriptions distinct and does not make captivity the explicit object of escaped.
translation_notes:
  risk_flags:
  - risk: “Were left from the captivity” is less idiomatic than “survived the exile.”
    mitigation: The wording preserves the POB distinction and avoids resolving captivity as either exile or imprisonment.
