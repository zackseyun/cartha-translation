translation:
  language: en
  text: Was it not because of these things that Solomon, king of Israel, sinned? Among the many nations, there was no king like him. His God loved him, and God made him king over all Israel. Yet foreign women caused even him to sin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “foreign wives.” The Hebrew says “foreign women”; “wives” is a contextual alternative from Solomon’s story, but is not explicit in this verse.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Yet among the many nations there was no king like him
  simplified_phrase: Among the many nations, there was no king like him.
  preserved_meaning: No king among the many nations could be compared with Solomon.
  reasoning_layer_used: Lexical decision for וּבַגּוֹיִם הָרַבִּים and its comparative setting
  rationale: The shorter sentence preserves “many” while expressing the comparison clearly.
- pob_phrase: and he was loved by his God
  simplified_phrase: His God loved him
  preserved_meaning: Solomon was the recipient of his God’s love.
  reasoning_layer_used: Lexical decision for וְאָהוּב לֵאלֹהָיו הָיָה
  rationale: The active sentence is easier to read without changing the relationship.
- pob_phrase: Even him foreign women caused to sin
  simplified_phrase: Yet foreign women caused even him to sin
  preserved_meaning: Despite Solomon’s exceptional status, foreign women led him into sin.
  reasoning_layer_used: Lexical decisions for גַּם אֹתוֹ and הֶחֱטִיאוּ
  rationale: Natural word order keeps both the causative meaning and the emphasis on Solomon.
translation_notes:
  risk_flags:
