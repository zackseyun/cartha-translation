translation:
  language: en
  text: I put Shelemiah the priest, Zadok the scribe, and Pedaiah, one of the Levites, in charge of the storerooms. Hanan son of Zaccur, son of Mattaniah, worked alongside them.[a] Because these men were considered faithful, they were responsible for distributing the provisions to their brothers.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean that Hanan served under their direction.
    reason: lexical_alternative
  - marker: b
    text: “Brothers” refers here to their fellow members of the community.
    reason: lexical_alternative
