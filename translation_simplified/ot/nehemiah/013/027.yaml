  preserved_meaning: The rhetorical question still rejects heeding them and participating in a serious moral offense.
  reasoning_layer_used: POB lexical decisions for הֲנִשְׁמַע and הָרָעָה הַגְּדוֹלָה הַזֹּאת
  rationale: Natural word order and “terrible” make the rebuke immediately clear.
- pob_phrase: acting unfaithfully against our God by marrying foreign women
  simplified_phrase: By marrying foreign women, we would be unfaithful to our God.
  preserved_meaning: The marriages are identified as covenantal unfaithfulness against God.
  reasoning_layer_used: POB theological decision for לִמְעֹל בֵּאלֹהֵינוּ and lexical decision for לְהֹשִׁיב
  rationale: A separate sentence clarifies how the proposed action violates faithfulness to God.
