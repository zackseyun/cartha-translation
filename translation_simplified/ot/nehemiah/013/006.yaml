translation:
  language: en
  text: But I was not in Jerusalem while all this was happening. In the thirty-second year of Artaxerxes king of Babylon,[a] I had gone to the king. After some time, I asked him for permission to leave.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew text says “king of Babylon,” although Artaxerxes was a Persian king.
    reason: source_note
