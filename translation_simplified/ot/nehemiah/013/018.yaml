translation:
  language: en
  text: Didn’t your fathers do the same thing? Then our God brought all this evil[a] on us and on this city. Yet by treating the Sabbath as unholy, you are increasing the wrath against Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “evil” means the disaster or calamity God brought as judgment.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Did not your fathers do this
  simplified_phrase: Didn’t your fathers do the same thing
  preserved_meaning: Their fathers had committed the same kind of offense.
  reasoning_layer_used: Lexical decisions for הֲלֹוא, כֹה, and עָשׂוּ
  rationale: “The same thing” makes the backward reference clear while retaining the rhetorical question.
- pob_phrase: you are adding wrath against Israel
  simplified_phrase: you are increasing the wrath against Israel
  preserved_meaning: Their continuing offense adds to the divine judgment directed against Israel.
  reasoning_layer_used: Lexical and theological decisions for מוֹסִיפִים and חָרוֹן
  rationale: “Increasing” expresses the ongoing addition naturally while preserving the weight of “wrath.”
- pob_phrase: by profaning the Sabbath
  simplified_phrase: by treating the Sabbath as unholy
  preserved_meaning: They dishonor the Sabbath’s sacred status.
  reasoning_layer_used: Lexical decision for לְחַלֵּל
  rationale: The plain wording explains “profaning” without removing the holy-versus-unholy contrast.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “evil” to mean that God acted immorally.
    mitigation: The footnote identifies the evil as punitive disaster or calamity.
