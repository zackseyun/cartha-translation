translation:
  language: en
  text: Eliashib prepared a large storeroom for Tobiah. In the past, this room had been used to store the grain offering, the frankincense, the temple vessels, and the tithes of grain, new wine, and oil. These tithes were the portions required for the Levites, the singers, and the gatekeepers. The contribution for the priests was also stored there.
  philosophy: optimal-equivalence
