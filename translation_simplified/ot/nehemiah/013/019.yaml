  preserved_meaning: The guards were posted to prevent loads from entering Jerusalem.
  reasoning_layer_used: POB lexical decision for לֹא יָבֹא מַשָּׂא
  rationale: The natural purpose clause retains the concrete term “load” and its contextual range.
