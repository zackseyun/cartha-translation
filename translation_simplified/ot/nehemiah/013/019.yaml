translation:
  language: en
  text: As evening fell and the gates of Jerusalem grew dark before the Sabbath began, I ordered the doors shut. I also ordered that no one open them until the Sabbath was over. I stationed some of my young men[a] at the gates to make sure no load[b] was brought in on the Sabbath day.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “servants” or “attendants”; these were members of Nehemiah’s personal group.
    reason: lexical_alternative
  - marker: b
    text: “Load” may refer to goods being brought into the city for trade.
    reason: lexical_alternative
