  simplified_phrase: As evening fell and the gates of Jerusalem grew dark before the Sabbath began
  preserved_meaning: The growing darkness marked the approach of the Sabbath while retaining the image of the darkening gates.
  reasoning_layer_used: POB lexical decision for צָלֲלוּ and footnote a
  rationale: The rewrite explains the evening idiom without removing its concrete image.
- pob_phrase: I said that the doors should be shut, and I said that they should not open them
  simplified_phrase: I ordered the doors shut. I also ordered that no one open them
  preserved_meaning: 'Nehemiah gave two directives: shut the doors and do not reopen them.'
  reasoning_layer_used: POB lexical decisions for וָאֹמְרָה and אֲשֶׁר לֹא יִפְתָּחוּם
  rationale: “Ordered” makes the administrative force clear while keeping both commands distinct.
- pob_phrase: so that no load might come in
