translation:
  language: en
  text: 'So I confronted them and cursed them.[a] I struck some of the men and pulled out their hair. Then I made them swear by God: “You must not arrange for your daughters to marry their sons. You must not marry any of their daughters or arrange for your sons to marry them.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “put them under oath before God.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I contended with them
  simplified_phrase: I confronted them
  preserved_meaning: Nehemiah directly opposed the offenders.
  reasoning_layer_used: POB lexical decision for וָאָרִיב
  rationale: “Confronted” conveys the forceful dispute more clearly in common English.
- pob_phrase: You shall not give your daughters to their sons
  simplified_phrase: You must not arrange for your daughters to marry their sons
  preserved_meaning: The oath forbids arranging these marriages.
  reasoning_layer_used: POB lexical and theological decisions on the oath formula and marriage-giving language
  rationale: The wording makes both the solemn prohibition and the marriage context immediately clear.
- pob_phrase: nor take any of their daughters for your sons or for yourselves
  simplified_phrase: You must not marry any of their daughters or arrange for your sons to marry them
  preserved_meaning: The ban applies both to the men themselves and to marriages arranged for their sons.
  reasoning_layer_used: POB lexical decisions for וְאִם תִּשְׂאוּ and לִבְנֵיכֶם וְלָכֶם
  rationale: The two affected groups are stated separately to avoid the opaque idiom “take daughters.”
