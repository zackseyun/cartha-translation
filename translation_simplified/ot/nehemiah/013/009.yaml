translation:
  language: en
  text: Then I gave the order, and they cleansed the temple rooms.[a] I brought back into those rooms the items used in God’s house, along with the grain offering and the frankincense.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Cleansed” includes purification for sacred use, not merely ordinary cleaning.
    reason: lexical_alternative
