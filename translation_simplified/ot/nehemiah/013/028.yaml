translation:
  language: en
  text: Joiada was a son of Eliashib the high priest. One of Joiada’s sons was a son-in-law of Sanballat the Horonite.[a] So I drove him away from me.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “was related by marriage to Sanballat.” “Son-in-law” is the most likely meaning here.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew can also mean “chased him away” or “banished him”; it emphasizes that he was forcibly removed.
    reason: lexical_alternative
