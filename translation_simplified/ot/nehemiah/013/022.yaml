- pob_phrase: that they should purify themselves and come to guard the gates
  simplified_phrase: to make themselves ritually clean. Then they were to come and guard the gates
  preserved_meaning: The Levites were to cleanse themselves before taking responsibility for the gates.
  reasoning_layer_used: Lexical decisions for טהר, בוא, and שמר
  rationale: Two sentences clarify the sequence without weakening the instruction.
- pob_phrase: to keep the Sabbath day holy
  simplified_phrase: so that the Sabbath day would be kept holy
  preserved_meaning: Guarding the gates served to preserve the Sabbath as holy.
  reasoning_layer_used: Lexical decision for קדשׁ and immediate context
  rationale: The purpose clause clearly connects guarding the gates with Sabbath holiness.
- pob_phrase: according to the greatness of your steadfast love
  simplified_phrase: in keeping with your great steadfast love
  preserved_meaning: Nehemiah asks God to spare him in a manner corresponding to God’s abundant covenant love.
  reasoning_layer_used: Lexical and theological decisions for כְּרֹב חַסְדֶּךָ
  rationale: This natural wording preserves steadfast love as the measure of the requested mercy.
