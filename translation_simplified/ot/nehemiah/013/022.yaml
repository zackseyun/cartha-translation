translation:
  language: en
  text: I told the Levites to make themselves ritually clean. Then they were to come and guard the gates, so that the Sabbath day would be kept holy. My God, remember this too in my favor,[a] and spare me in keeping with your great steadfast love.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Remember me for this too, my God.” The Hebrew can refer either to Nehemiah or to what he had done.
    reason: lexical_alternative
  - marker: b
    text: “Steadfast love” refers to God’s loyal covenant love and mercy.
    reason: lexical_alternative
