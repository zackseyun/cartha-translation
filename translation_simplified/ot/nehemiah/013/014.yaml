  preserved_meaning: Nehemiah describes deeds of loyalty rather than merely generic good works.
  reasoning_layer_used: Lexical and theological decisions for חֲסָדַי.
  rationale: “Loyal deeds” is plain English and leaves the word’s covenantal and kindness nuances open in the footnote.
- pob_phrase: for the house of my God and for its services
  simplified_phrase: for your temple and its duties
  preserved_meaning: The deeds concerned God’s temple and its ordered responsibilities.
  reasoning_layer_used: Lexical decisions for בְּבֵית אֱלֹהַי and וּבְמִשְׁמָרָיו.
  rationale: “Temple” and “duties” make the historical setting and responsibilities immediately clear.
