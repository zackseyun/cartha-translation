translation:
  language: en
  text: The officials did not know where I had gone or what I was doing. Until then, I had not told the Jews,[a] the priests, the nobles, the officials, or anyone else doing the work.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Judeans.” The Hebrew term can refer either to the people of Judah or more broadly to the Jewish community.
    reason: lexical_alternative
