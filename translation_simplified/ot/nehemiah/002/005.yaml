translation:
  language: en
  text: Then I said to the king, “If it pleases you, Your Majesty, and if you look favorably on me, your servant, please send me to Judah—to the city where my ancestors are buried—so that I can rebuild it.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: If it pleases the king
  simplified_phrase: If it pleases you, Your Majesty
  preserved_meaning: Nehemiah respectfully seeks the king’s approval.
  reasoning_layer_used: POB lexical decision on the courtly idiom
  rationale: Direct address sounds natural while keeping the formal, deferential tone.
- pob_phrase: if your servant has found favor before you
  simplified_phrase: if you look favorably on me, your servant
  preserved_meaning: Nehemiah humbly appeals to his favorable standing with the king.
  reasoning_layer_used: POB lexical decisions on favorable standing and royal self-designation
  rationale: The wording explains the idiom while retaining “your servant” as humble royal address.
- pob_phrase: to the city of my fathers’ graves
  simplified_phrase: to the city where my ancestors are buried
  preserved_meaning: Nehemiah asks to return to the city containing his ancestors’ graves.
  reasoning_layer_used: POB lexical decision and literal footnote
  rationale: “Ancestors” prevents “fathers” from being mistaken for immediate parents.
translation_notes:
