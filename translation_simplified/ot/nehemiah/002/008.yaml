translation:
  language: en
  text: I also asked the king for a letter to Asaph, who managed the king’s forest.[a] The letter was to authorize Asaph to give me timber for beams for the gates of the fortress by the temple,[b] the city wall, and the house where I would live. The king gave me what I asked for because the good hand of my God was upon me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also refer to the king’s park, orchard, or other managed woodland.
    reason: lexical_alternative
  - marker: b
    text: Literally “the house”; here it likely refers to the temple.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a letter to Asaph, the keeper of the king’s forest, that he should give me timber
  simplified_phrase: a letter to Asaph, who managed the king’s forest. The letter was to authorize Asaph to give me timber
  preserved_meaning: Asaph supervised the royal woodland and was to supply Nehemiah with construction wood.
  reasoning_layer_used: Lexical decisions for אִגֶּרֶת, שֹׁמֵר הַפַּרְדֵּס, and יִתֶּן לִי עֵצִים
  rationale: Two sentences and “authorize” clarify the official letter’s practical purpose.
- pob_phrase: for the house that I will occupy
  simplified_phrase: the house where I would live
  preserved_meaning: The timber was also for Nehemiah’s intended residence.
  reasoning_layer_used: Lexical decision for הַבַּיִת אֲשֶׁר אָבוֹא אֵלָיו and latest revision
  rationale: “Where I would live” is clearer common English for the residence Nehemiah would occupy.
- pob_phrase: according to the good hand of my God upon me
  simplified_phrase: because the good hand of my God was upon me
  preserved_meaning: Nehemiah attributes the king’s favorable response to God’s active providence.
  reasoning_layer_used: Theological decision on divine providence
  rationale: The causal wording explains the idiom’s function while retaining its image of God’s hand.
