translation:
  language: en
  text: So that night I went out through the Valley Gate. I traveled toward the Dragon Spring[a] and the Dung Gate, inspecting[b] Jerusalem’s walls along the way. The walls had been broken down, and fire had consumed the city’s gates.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew place name may also be translated “Serpent Spring” or “Jackal Spring.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew expression is difficult; in this context it refers to inspecting the damaged walls.
    reason: source_note
simplification_decisions:
- pob_phrase: So I went out by night through the Valley Gate
  simplified_phrase: So that night I went out through the Valley Gate
  preserved_meaning: Nehemiah left through the named gate during the night as the next action in the narrative.
  reasoning_layer_used: POB lexical decision for וָאֵצְאָה and לַיְלָה
  rationale: “That night” is more natural for common readers than “by night.”
- pob_phrase: toward the Dragon Spring and toward the Dung Gate, and I inspected
  simplified_phrase: I traveled toward the Dragon Spring and the Dung Gate, inspecting Jerusalem’s walls along the way
  preserved_meaning: Nehemiah followed this route while examining the damaged walls.
  reasoning_layer_used: POB lexical decisions for the route terms and וָאֱהִי שֹׂבֵר
  rationale: The recast sentence makes the movement and ongoing inspection easy to follow.
- pob_phrase: its gates that had been consumed by fire
  simplified_phrase: fire had consumed the city’s gates
  preserved_meaning: Jerusalem’s gates had been destroyed by fire, with the source image of consuming fire retained.
  reasoning_layer_used: POB lexical decision for וּשְׁעָרֶיהָ אֻכְּלוּ בָאֵשׁ
  rationale: Naming “the city” removes an unclear pronoun while preserving the vivid image.
translation_notes:
