translation:
  language: en
  text: Ezra opened the book[a] in full view of all the people. He was standing on a platform above them, and when he opened it, they all stood.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “scroll.” The Hebrew word can refer to a written document in scroll form.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: in the sight of all the people
  simplified_phrase: in full view of all the people
  preserved_meaning: Ezra opened the book publicly where the gathered people could see the action.
  reasoning_layer_used: Lexical rationale for לְעֵינֵי.
  rationale: This natural wording retains the visual and public focus on opening the book.
- pob_phrase: for he was above all the people
  simplified_phrase: He was standing on a platform above them
  preserved_meaning: Ezra was physically elevated above the assembly, not socially superior to them.
  reasoning_layer_used: POB lexical rationale and Nehemiah 8:4 context.
  rationale: The platform named in the immediate context makes the physical elevation unmistakable.
- pob_phrase: and when he opened it, all the people stood
  simplified_phrase: and when he opened it, they all stood
  preserved_meaning: The whole assembly stood when Ezra opened the book.
  reasoning_layer_used: Lexical decisions for וּכְפִתְחוֹ and עָמְדוּ.
  rationale: The pronouns are clear from the preceding clauses and avoid needless repetition.
interpretive_expansions:
