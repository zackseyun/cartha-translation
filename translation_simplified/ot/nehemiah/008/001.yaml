simplification_decisions:
- pob_phrase: at the square that was before the Water Gate
  simplified_phrase: in the public square in front of the Water Gate
  preserved_meaning: The people assembled in the open civic space located before the gate.
  reasoning_layer_used: POB lexical decisions for הָרְחוֹב and לִפְנֵי שַׁעַר הַמָּיִם
  rationale: “Public square” clarifies the setting, and “in front of” is natural modern English.
- pob_phrase: And all the people gathered ... and they told Ezra
  simplified_phrase: All the people gathered ... They told Ezra
  preserved_meaning: The whole community assembled and instructed Ezra to bring the Book.
  reasoning_layer_used: POB syntax and lexical decisions
  rationale: Two sentences make the sequence easier to follow without changing the actions.
- pob_phrase: the Book of the Law of Moses
  simplified_phrase: the Book of the Law of Moses
  preserved_meaning: Ezra was to bring the recognized book or scroll identified as the Law of Moses.
  reasoning_layer_used: POB lexical decision for סֵפֶר תּוֹרַת מֹשֶׁה and grounding review
  rationale: Retaining the construct avoids implying that a broader book merely contains the Law.
