translation:
  language: en
  text: Everyone in the gathered community who had returned from captivity made temporary shelters and lived in them. The sons of Israel had not celebrated the feast in this way since the days of Jeshua son of Nun.[a] There was very great rejoicing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jeshua son of Nun is the man commonly known as Joshua son of Nun.
    reason: alternative_reading
