translation:
  language: en
  text: Ezra praised Yahweh, the great God. All the people answered, “Amen! Amen!” as they raised their hands.[a] Then they bowed low and worshiped Yahweh with their faces to the ground.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Amen! Amen!” was their repeated response of strong agreement.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Ezra blessed Yahweh
  simplified_phrase: Ezra praised Yahweh
  preserved_meaning: Ezra spoke blessing and praise to God rather than giving God a benefit.
  reasoning_layer_used: Lexical decision for וַיְבָרֶךְ and grounding review
  rationale: “Praised” clearly expresses the audited sense of blessing directed toward God.
- pob_phrase: all the people answered, “Amen, Amen,” while lifting up their hands
  simplified_phrase: All the people answered, “Amen! Amen!” as they raised their hands
  preserved_meaning: The whole assembly raises its hands while giving an emphatic spoken response.
  reasoning_layer_used: Lexical decisions for וַיַּעֲנוּ, אָמֵן אָמֵן, and בְּמֹעַל יְדֵיהֶם
  rationale: “As” clearly keeps the gesture simultaneous with the response.
- pob_phrase: bowed down and worshiped Yahweh
  simplified_phrase: bowed low and worshiped Yahweh
  preserved_meaning: Their physical bowing and their act of worship remain distinct.
  reasoning_layer_used: Lexical decisions for וַיִּקְּדוּ and וַיִּשְׁתַּחֲווּ
  rationale: “Bowed low” makes the posture clear while preserving worship as a separate action.
