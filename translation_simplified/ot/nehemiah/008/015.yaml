translation:
  language: en
  text: 'They were also to announce this message throughout all their cities and in Jerusalem: “Go into the hill country and bring back branches[b] from olive trees, oil trees,[a] myrtles, palms, and other leafy trees. Use them to build booths—temporary shelters—as it is written.”'
  philosophy: optimal-equivalence
  footnotes:
