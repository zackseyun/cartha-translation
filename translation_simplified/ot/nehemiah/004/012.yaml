translation:
  language: en
  text: Each builder worked with his sword strapped at his side. The man who sounded the trumpet[a] was beside me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word refers specifically to a shofar, a trumpet made from a ram’s horn.
