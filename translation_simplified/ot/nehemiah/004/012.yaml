- pob_phrase: the builders each had his sword strapped at his side while they built
  simplified_phrase: Each builder worked with his sword strapped at his side
  preserved_meaning: Every worker continued building while wearing a sword ready at his side.
  reasoning_layer_used: Lexical decisions for אִישׁ, אֲסוּרִים, עַל מָתְנָיו, and the repeated forms of בנה.
  rationale: The clause is recast in ordinary English while keeping both the building work and each worker’s armed readiness.
- pob_phrase: the one blowing the trumpet was beside me
  simplified_phrase: The man who sounded the trumpet was beside me
  preserved_meaning: The person responsible for sounding the warning trumpet remained close to Nehemiah.
  reasoning_layer_used: Lexical decisions for וְהַתּוֹקֵעַ בַּשּׁוֹפָר and אֶצְלִי.
  rationale: The verbal participle becomes a natural English description without implying that he blew the trumpet continuously.
