translation:
  language: en
  text: I looked at what was happening. Then I stood up and said to the nobles, the officials, and all the other people, “Do not be afraid of them. Remember that the Lord is great and fearsome.[a] Fight for your brothers, your sons and daughters, your wives, and your houses.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “great and awesome.” The Hebrew word describes someone who inspires awe or dread.
    reason: lexical_alternative
  - marker: b
    text: “Houses” can include both households and dwellings.
    reason: simplification_note
