translation:
  language: en
  text: The Levites were Jeshua, Binnui, Kadmiel, Sherebiah, Judah, and Mattaniah.[a] Mattaniah and his brothers were responsible for the songs of thanksgiving.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may instead mean that all the named Levites and their brothers were responsible for the songs of thanksgiving.
    reason: alternative_reading
