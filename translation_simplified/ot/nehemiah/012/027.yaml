translation:
  language: en
  text: When Jerusalem’s wall was dedicated, they looked for the Levites in all the places where they lived and brought them to Jerusalem so that they could celebrate the dedication with joy, thanksgiving, and singing, accompanied by cymbals, harps, and lyres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew names two different stringed instruments, but their exact ancient forms are uncertain.
    reason: cultural_note
