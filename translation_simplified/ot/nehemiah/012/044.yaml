translation:
  language: en
  text: On that day, men were appointed to oversee the storerooms for the contributions, the first produce, and the tithes.[a] They were to collect from the fields belonging to the towns the shares that the law required for the priests and Levites. The people of Judah rejoiced because of the priests and Levites who were serving.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tithe was a tenth portion given under the law.
    reason: cultural_note
