translation:
  language: en
  text: Do not cover over their guilt.[a] Do not erase their sin from your sight, because they provoked anger in front of the builders.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The image “cover over” means to overlook or forgive their guilt.
    reason: lexical_alternative
  - marker: b
    text: Or, “because they angered you in front of the builders.” The Hebrew leaves the object of anger unstated.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: do not let their sin be blotted out
  simplified_phrase: do not erase their sin
  preserved_meaning: Their sin must not be removed from God's notice.
  reasoning_layer_used: lexical decision for תִּמָּחֶה
  rationale: “Erase” expresses the record-removal image in familiar English.
- pob_phrase: from before you
  simplified_phrase: from your sight
  preserved_meaning: The prayer asks that the sin remain before God's awareness.
  reasoning_layer_used: lexical decision for מִלְּפָנֶיךָ
  rationale: “From your sight” makes the relational image natural and clear.
- pob_phrase: in the presence of the builders
  simplified_phrase: in front of the builders
  preserved_meaning: The provocation occurred publicly before those rebuilding.
  reasoning_layer_used: lexical decision for לְנֶגֶד הַבּוֹנִים
  rationale: “In front of” is the common-English equivalent of the locative phrase.
translation_notes:
  risk_flags:
  - risk: “Cover over” may be mistaken for merely hiding guilt.
    mitigation: Footnote a explains its sense of overlooking or forgiving guilt.
  - risk: The unstated object of “provoked anger” may sound incomplete.
    mitigation: Footnote b preserves the likely reading without forcing it into the text.
