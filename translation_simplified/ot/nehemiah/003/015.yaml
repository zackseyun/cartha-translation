translation:
  language: en
  text: Shallun son of Col-hozeh, an official of the district of Mizpah, repaired the Fountain Gate. He himself rebuilt it and put a roof on it. He also installed its doors, bolts, and bars. Then he repaired the wall beside the Pool of Shelah,[a] near the king’s garden, as far as the stairs that go down from the City of David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Pool of Siloah,” traditionally associated with Siloam. The Hebrew place-name here is Shelah.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: He rebuilt it and roofed it, and set up its doors, its bolts, and its bars
  simplified_phrase: He himself rebuilt it and put a roof on it. He also installed its doors, bolts, and bars.
  preserved_meaning: Shallun personally rebuilt, covered, and fitted the gate with its working parts.
  reasoning_layer_used: Lexical decisions for יִבְנֶנּוּ, וִיטַלְלֶנּוּ, and the gate fittings
  rationale: Short sentences and familiar construction terms make the work easier to picture.
- pob_phrase: the wall of the Pool of Shelah by the king’s garden
  simplified_phrase: the wall beside the Pool of Shelah, near the king’s garden
  preserved_meaning: The repaired wall stood by the pool and in relation to the king’s garden.
  reasoning_layer_used: Topographical lexical decisions for בְּרֵכַת הַשֶּׁלַח and לְגַן הַמֶּלֶךְ
  rationale: “Beside” and “near” clarify the location without claiming an exact boundary.
