  rationale: “People of” is clearer common English than “inhabitants of.”
- pob_phrase: set up its doors, its bolts, and its bars
  simplified_phrase: installed its doors, bolts, and bars
  preserved_meaning: They put the gate doors and securing hardware in place.
  reasoning_layer_used: POB lexical decisions for וַיַּעֲמִידוּ and the gate hardware
  rationale: “Installed” naturally describes placing doors and hardware in position.
- pob_phrase: a thousand cubits of the wall
  simplified_phrase: about 1,500 feet (457 meters) of the wall
  preserved_meaning: They repaired the stated long section of wall.
  reasoning_layer_used: POB cultural footnote on אֶלֶף אַמָּה
  rationale: The modern measurements make the distance immediately understandable while a note retains the Hebrew unit.
