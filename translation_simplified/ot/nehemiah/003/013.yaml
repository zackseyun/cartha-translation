translation:
  language: en
  text: Hanun and the people of Zanoah repaired the Valley Gate.[a] They built it and installed its doors, bolts, and bars. They also repaired about 1,500 feet (457 meters) of the wall, as far as the Dung Gate.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “strengthened” the Valley Gate.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says “a thousand cubits.”
    reason: source_note
  - marker: c
    text: Or “Refuse Gate.”
    reason: lexical_alternative
