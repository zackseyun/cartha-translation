    text: Or “corner.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew is literally “the upper house of the king”; it may refer to the upper palace.
    reason: lexical_alternative
  - marker: c
    text: This was likely a guarded courtyard used for detention.
    reason: cultural_note
