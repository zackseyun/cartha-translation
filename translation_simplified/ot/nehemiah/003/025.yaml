  text: Palal son of Uzai repaired the section facing the angle[a] and the tower that jutted out from the king’s upper building[b], beside the guard courtyard[c]. After him, Pedaiah son of Parosh repaired the next section.
  philosophy: optimal-equivalence
  footnotes:
