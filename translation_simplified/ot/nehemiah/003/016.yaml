  text: After him,[a] Nehemiah son of Azbuk made repairs. He ruled half the district of Beth-zur. His work extended to the point across from David’s tombs, to the man-made pool, and to the mighty men’s building.[b]
  philosophy: optimal-equivalence
  footnotes:
