  text: In front of his brothers and the army of Samaria, he said, “What are these feeble Jews doing? Will they restore the wall for themselves?[a] Will they offer sacrifices? Will they finish it in one day? Will they bring these stones back to life from heaps of dust, even though the stones have been burned?”
  philosophy: optimal-equivalence
  footnotes:
