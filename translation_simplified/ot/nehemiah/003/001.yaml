translation:
  language: en
  text: Then Eliashib the high priest and his brothers, the priests, began the work. They built the Sheep Gate. They themselves consecrated it[a] and put its doors in place. They also consecrated the section extending from there to the Tower of the Hundred and on to the Tower of Hananel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “dedicated it.” The Hebrew verb means setting something apart as holy or for a special purpose.
    reason: lexical_alternative
