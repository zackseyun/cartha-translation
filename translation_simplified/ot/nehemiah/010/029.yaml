translation:
  language: en
  text: The rest of the people included the priests, the Levites, the gatekeepers, the singers, the temple servants, and all who had separated themselves from the neighboring peoples in order to follow God’s law. Their wives, sons, and daughters were also included—everyone among them who knew and understood.
  philosophy: optimal-equivalence
