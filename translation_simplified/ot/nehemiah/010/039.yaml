translation:
  language: en
  text: A priest descended from Aaron must be with the Levites when they collect the tithe. The Levites must then take one-tenth of the tithe they receive up to the house of our God and put it in the storehouse rooms.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the priest, a son of Aaron, shall be with the Levites
  simplified_phrase: A priest descended from Aaron must be with the Levites
  preserved_meaning: A priest from Aaron’s line is required to accompany the Levites.
  reasoning_layer_used: lexical decision for הַכֹּהֵן בֶּן־אַהֲרֹן and covenantal force of וְהָיָה
  rationale: “Descended from Aaron” clearly expresses lineage, while “must” preserves the legal requirement.
- pob_phrase: the tithe of the tithe
  simplified_phrase: one-tenth of the tithe they receive
  preserved_meaning: The Levites give a tenth from the tithe collected for them.
  reasoning_layer_used: POB lexical footnote and decision for מַעְשַׂר הַמַּעְשֵׂר
  rationale: The clearer wording explains the technical phrase without changing the required portion.
- pob_phrase: to the chambers of the storehouse
  simplified_phrase: and put it in the storehouse rooms
  preserved_meaning: The portion is deposited in temple rooms used to store tithes and offerings.
  reasoning_layer_used: lexical and theological decisions for הַלְּשָׁכוֹת and בֵית הָאוֹצָר
  rationale: “Storehouse rooms” is ordinary English and avoids suggesting a money treasury.
interpretive_expansions:
