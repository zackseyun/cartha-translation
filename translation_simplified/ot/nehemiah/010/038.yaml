translation:
  language: en
  text: We will bring the first portion of our dough, our sacred contributions, fruit from every tree, new wine, and oil to the priests, into the storerooms of the house of our God. We will give the Levites a tenth of the produce from our land, for they are the ones who collect the tithes in every town where we work.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in every town connected with our service.” The Hebrew expression is compressed and may refer to towns where the people did their agricultural work.
    reason: alternative_reading
