translation:
  language: en
  text: They join with their brothers—their nobles—and make a solemn oath. They accept a curse upon themselves if they break this pledge. They promise to live by God’s law, given through Moses, God’s servant. They will carefully observe and carry out all the commandments, legal rulings, and decrees of Yahweh our Lord.
  philosophy: optimal-equivalence
