translation:
  language: en
  text: If people from the surrounding lands bring goods or grain to sell on the Sabbath, we will not buy from them on the Sabbath or on any other holy day. In the seventh year, we will let the land rest and cancel every debt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew phrase translated “every debt” may also mean “every claim” or “every exaction”; it is literally “the burden of every hand.”
    reason: lexical_alternative
