  reasoning_layer_used: lexical decision for עַמֵּי הָאָרֶץ
  rationale: The clearer wording preserves the reference to multiple surrounding populations.
- pob_phrase: on the Sabbath or on a holy day
  simplified_phrase: on the Sabbath or on any other holy day
  preserved_meaning: The ban applies both to the Sabbath and to additional sacred days.
  reasoning_layer_used: lexical decision for וּבְיוֹם קֹדֶשׁ
  rationale: “Any other” makes the extension of the prohibition natural in English.
- pob_phrase: we will forego the seventh year and every debt
  simplified_phrase: In the seventh year, we will let the land rest and cancel every debt
  preserved_meaning: They pledge to observe the agricultural rest and release financial claims in the seventh year.
  reasoning_layer_used: theological decision on the sabbatical-year obligation
  rationale: The rewrite states the two obligations directly instead of using the opaque verb “forego.”
