simplification_decisions:
- pob_phrase: laid on ourselves the obligation
  simplified_phrase: bound ourselves
  preserved_meaning: The community imposed a binding requirement on itself.
  reasoning_layer_used: Lexical and theological decisions on וְהֶעֱמַדְנוּ and מִצְוֺת
  rationale: This natural wording preserves the force of a self-imposed obligation.
- pob_phrase: a third of a shekel
  simplified_phrase: one-third of a shekel
  preserved_meaning: The exact amount of the annual contribution remains explicit.
  reasoning_layer_used: Lexical decision on שְׁלִשִׁית הַשֶּׁקֶל
  rationale: The fraction is clear in the main text, while the footnote explains the ancient unit.
- pob_phrase: for the service of the house of our God
  simplified_phrase: for the work of the temple of our God
  preserved_meaning: The contribution supported the service and work connected with God's temple.
  reasoning_layer_used: Lexical decisions on לַעֲבֹדַת and בֵּית אֱלֹהֵינוּ
  rationale: “Work” and “temple” make the purpose and place immediately understandable.
