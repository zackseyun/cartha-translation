  text: The following people returned from Tel-melah, Tel-harsha, Kerub, Addon,[a] and Immer. But they could not identify their ancestral families or trace their family lines, so it was uncertain whether they were Israelites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ezra 2:59 has “Addan” instead of “Addon.”
    reason: textual_variant
