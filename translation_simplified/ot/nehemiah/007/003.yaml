translation:
  language: en
  text: I told them, “Jerusalem’s gates must not be opened until the sun is hot.[a] While the men are still standing guard, they must shut the gate doors and secure them. Appoint guards from among Jerusalem’s residents.[b] Each guard must serve his assigned watch and stand in front of his own house.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This means later in the morning, not merely at sunrise.
    reason: simplification_note
  - marker: b
    text: The Hebrew can refer either to the guards or to their assigned watches.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And I said to them
  simplified_phrase: I told them
  preserved_meaning: Nehemiah directly gave these instructions to the appointed leaders.
  reasoning_layer_used: POB translation and immediate context
  rationale: The shorter wording naturally conveys his act of giving orders.
- pob_phrase: the inhabitants of Jerusalem
  simplified_phrase: Jerusalem’s residents
  preserved_meaning: The guards were to be chosen from people living in the city.
  reasoning_layer_used: POB lexical decision for יֹשְׁבֵי יְרוּשָׁלִַם
  rationale: “Residents” is common English for people who live in a place.
- pob_phrase: each at his watch and each opposite his own house
  simplified_phrase: Each guard must serve his assigned watch and stand in front of his own house
  preserved_meaning: Each guard had an assigned watch and a position in front of his own home.
  reasoning_layer_used: POB lexical decisions for מִשְׁמָרוֹ and נֶגֶד בֵּיתוֹ
  rationale: The wording clearly retains the duty and house-front elements as distinct ideas.
translation_notes:
  risk_flags:
  - risk: Readers may mistake “until the sun is hot” for a temperature report rather than a time instruction.
    mitigation: Footnote a explains that the gates stayed closed until later in the morning.
  - risk: “Assigned watch” selects the duty sense of a Hebrew term that can also refer to guards.
    mitigation: Footnote b preserves the lexical ambiguity.
