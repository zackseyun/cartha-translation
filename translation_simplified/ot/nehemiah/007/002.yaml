translation:
  language: en
  text: Then I put my brother Hanani and Hananiah, the commander of the fortress, in charge of Jerusalem. I did this because he[a] was faithful[b] and feared God more than many others.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “He” most naturally refers to Hananiah, though the description may support the appointment of both men.
    reason: alternative_reading
  - marker: b
    text: Or “trustworthy”; literally, “a man of truth.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: appointed ... over Jerusalem
  simplified_phrase: put ... in charge of Jerusalem
  preserved_meaning: Nehemiah assigned Hanani and Hananiah authority and responsibility for Jerusalem.
  reasoning_layer_used: lexical decision for וָאֲצַוֶּה and עַל יְרוּשָׁלִָם
  rationale: The clearer wording expresses the administrative force of the appointment.
- pob_phrase: because he was
  simplified_phrase: I did this because he was
  preserved_meaning: Hananiah's character was the reason for the appointment.
  reasoning_layer_used: theological decision on the singular pronoun
  rationale: A new sentence eases the structure while retaining the singular and its documented ambiguity.
- pob_phrase: more than many
  simplified_phrase: more than many others
  preserved_meaning: His fear of God exceeded that of many people without claiming it exceeded most people.
  reasoning_layer_used: lexical decision for מֵרַבִּים
  rationale: Adding “others” makes the comparison natural without strengthening it.
translation_notes:
  risk_flags:
  - risk: The singular “he” may seem unclear after two named appointees.
    mitigation: The footnote identifies Hananiah as the most natural referent while preserving the alternative.
  - risk: “Feared God” may be mistaken for mere terror.
    mitigation: The biblical expression is retained because POB identifies it as reverent fear toward God.
