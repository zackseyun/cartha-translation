translation:
  language: en
  text: These are the sons of the province[a] who came up out of captivity and exile. Nebuchadnezzar king of Babylon had carried them away. They returned to Jerusalem and Judah, each man to his own city.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sons of the province” means those who belonged to or descended from the province.
    reason: simplification_note
  - marker: b
    text: “Each man to his own city” refers to the returnees going back in their household or family groups.
    reason: simplification_note
