translation:
  language: en
  text: That day Moses swore, “The land where you set foot will be an inheritance belonging to you and your sons[a] forever, because you followed Yahweh my God wholeheartedly.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “descendants.” The Hebrew says “sons.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Moses swore on that day, saying
  simplified_phrase: That day Moses swore
  preserved_meaning: Moses made a solemn oath at that time.
  reasoning_layer_used: POB lexical decision for וַיִּשָּׁבַע and ordinary English direct-speech structure
  rationale: The shorter introduction keeps the oath’s solemn force without the formal word “saying.”
- pob_phrase: the land on which your foot has trodden shall be an inheritance for you and for your sons forever
  simplified_phrase: The land where you set foot will be an inheritance belonging to you and your sons forever
  preserved_meaning: The land Caleb entered would become an enduring inherited possession for him and his sons.
  reasoning_layer_used: POB lexical decisions for the foot-treading image, נַחֲלָה, and וּלְבָנֶיךָ
  rationale: “Set foot” preserves the concrete image, while the revised wording clearly includes both Caleb and his sons as heirs.
- pob_phrase: you have fully followed Yahweh my God
  simplified_phrase: you followed Yahweh my God wholeheartedly
  preserved_meaning: Caleb followed Yahweh with complete loyalty.
  reasoning_layer_used: POB lexical decision for מִלֵּאתָ אַחֲרֵי and theological decision for Yahweh
  rationale: “Wholeheartedly” expresses the Hebrew idiom naturally while retaining Yahweh’s personal name.
translation_notes:
  risk_flags:
  - risk: “Inheritance” may still be unfamiliar as a covenantal land-allotment term.
    mitigation: “Belonging to you and your sons” makes the inherited possession clear without erasing the biblical concept.
  - risk: “Sons” may be read more narrowly than the enduring family line intended in context.
    mitigation: The footnote retains the source wording while noting “descendants” as an alternative.
