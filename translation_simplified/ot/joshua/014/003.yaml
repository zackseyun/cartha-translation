  preserved_meaning: Moses had previously assigned these tribes their inherited territory.
  reasoning_layer_used: Lexical decisions for נָתַן and נַחֲלַת
  rationale: The new word order is easier to follow, while “already” preserves the prior action.
- pob_phrase: beyond the Jordan
