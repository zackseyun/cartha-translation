translation:
  language: en
  text: These are the portions of land that the sons of Israel[a] received as their inheritance in the land of Canaan. Eleazar the priest, Joshua son of Nun, and the leaders of the fathers’ houses—the ancestral family groups within Israel’s tribes—allotted these portions to them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Israelites.” The Hebrew literally says “the sons of Israel,” a covenant family name for the people.
    reason: lexical_alternative
