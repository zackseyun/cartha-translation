translation:
  language: en
  text: Then the men from the tribe of Judah approached Joshua at Gilgal.[a] Caleb son of Jephunneh, the Kenizzite, said to Joshua, “You know what Yahweh said to Moses, the man of God, about you and me at Kadesh-barnea.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “the sons of Judah,” a family-based expression for the tribe’s men.
    reason: simplification_note
