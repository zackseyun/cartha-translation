- pob_phrase: the sons of Judah came near to Joshua
  simplified_phrase: the men from the tribe of Judah approached Joshua
  preserved_meaning: A male group representing Judah drew near to Joshua.
  reasoning_layer_used: Lexical and theological decisions on בְנֵי יְהוּדָה and וַיִּגְּשׁוּ
  rationale: This makes the tribal sense clear while preserving the group’s masculine reference in the text and the familial image in a note.
- pob_phrase: the word that Yahweh spoke to Moses
  simplified_phrase: what Yahweh said to Moses
  preserved_meaning: Caleb refers to Yahweh’s specific spoken message to Moses.
  reasoning_layer_used: Lexical decision on הַדָּבָר and דִּבֶּר יְהוָה
  rationale: The natural English clause retains the focus on a divine utterance.
- pob_phrase: concerning me and concerning you
