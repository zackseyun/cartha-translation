translation:
  language: en
  text: The boundary line then went up to Beth-hoglah. It continued past the north side of Beth-arabah, then went up to Bohan’s stone. Bohan was a son of Reuben.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the border
  simplified_phrase: the boundary line
  preserved_meaning: This is the line marking the territory, not the territory itself.
  reasoning_layer_used: POB lexical decision for הַגְּבוּל
  rationale: “Boundary line” makes the geographic meaning immediately clear.
- pob_phrase: passed north of Beth-arabah
  simplified_phrase: continued past the north side of Beth-arabah
  preserved_meaning: The line proceeded past Beth-arabah on its northern side.
  reasoning_layer_used: POB lexical decisions for וְעָבַר and מִצְּפוֹן
  rationale: The added spatial wording clarifies how the boundary related to the town.
- pob_phrase: the stone of Bohan son of Reuben
  simplified_phrase: Bohan’s stone. Bohan was a son of Reuben.
  preserved_meaning: The landmark was associated with Bohan, who is identified as a son of Reuben.
  reasoning_layer_used: POB lexical decisions for אֶבֶן בֹּהַן and בֶּן רְאוּבֵן
  rationale: Using the approved possessive alternative and a separate sentence removes a dense name sequence.
