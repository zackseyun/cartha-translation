translation:
  language: en
  text: From there, the border ran south to the uphill pass at Akrabbim,[a] crossed over to Zin, and then went up south of Kadesh-barnea.[b] It then passed Hezron, went up to Addar, and turned toward Karka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Akrabbim likely means “scorpions,” but here it is the name of a place.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may instead describe the border as going up from the south toward Kadesh-barnea.
    reason: alternative_reading
  - marker: c
    text: The name Karka may also be spelled Karkaa.
    reason: alternative_reading
