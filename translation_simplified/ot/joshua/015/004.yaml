translation:
  language: en
  text: From there, the boundary continued to Azmon. It then reached the Brook of Egypt[a] and ended at the sea. This will be your southern boundary.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Wadi of Egypt.” The Hebrew word often refers to a seasonal watercourse or wadi. The traditional “River of Egypt” may suggest the Nile too strongly here.
    reason: lexical_alternative
