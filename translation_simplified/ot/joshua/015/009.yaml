translation:
  language: en
  text: Then the border curved[a] from the mountaintop to the spring of the waters of Nephtoah. From there it continued to the cities of Mount Ephron, then curved to Baalah, also called Kiriath-jearim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean that the border turned or was marked out along this route.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: from the top of the mountain
  simplified_phrase: from the mountaintop
  preserved_meaning: The route begins at the mountain's top.
  reasoning_layer_used: POB lexical decision for מֵרֹאשׁ הָהָר
  rationale: “Mountaintop” is shorter and equally clear.
- pob_phrase: and went out to
  simplified_phrase: From there it continued to
  preserved_meaning: The border proceeds onward to the next location.
  reasoning_layer_used: POB lexical rationale for וְיָצָא
  rationale: This expresses the boundary's movement in ordinary modern English.
- pob_phrase: that is, Kiriath-jearim
  simplified_phrase: also called Kiriath-jearim
  preserved_meaning: Baalah and Kiriath-jearim identify the same place.
  reasoning_layer_used: POB lexical rationale for הִיא קִרְיַת יְעָרִים
  rationale: “Also called” makes the identification immediately clear.
