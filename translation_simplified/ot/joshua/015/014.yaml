  preserved_meaning: Caleb forced the former occupants to leave the location.
  reasoning_layer_used: The lexical decision for וַיֹּרֶשׁ and מִשָּׁם.
  rationale: Ordinary English places the object between “drove” and “out” and names the location afterward.
- pob_phrase: the children of Anak
  simplified_phrase: all of Anak’s family line
  preserved_meaning: The named men belonged genealogically to Anak’s line.
  reasoning_layer_used: The lexical rationale for יְלִידֵי הָעֲנָק and footnote b.
  rationale: This avoids awkward repetition while retaining the verse’s second genealogical expression.
