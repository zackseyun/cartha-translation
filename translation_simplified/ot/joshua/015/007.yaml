translation:
  language: en
  text: From the Valley of Achor, the border went up to Debir. It then turned north toward Gilgal,[a] which is across from the Ascent of Adummim. The ascent lies south of the seasonal streambed. From there, the border continued to the waters of En-shemesh and ended at En-rogel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “to Gilgal”; the Hebrew may describe either movement toward Gilgal or arrival there.
    reason: lexical_alternative
