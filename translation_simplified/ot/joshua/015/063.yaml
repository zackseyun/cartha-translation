translation:
  language: en
  text: But the sons of Judah[a] could not force out the Jebusites who lived in Jerusalem. So the Jebusites have continued to live there with the sons of Judah to this day.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sons of Judah” means the descendants who belonged to the tribe of Judah.
    reason: simplification_note
simplification_decisions:
- pob_phrase: dispossess the Jebusites, the inhabitants of Jerusalem
  simplified_phrase: force out the Jebusites who lived in Jerusalem
  preserved_meaning: Judah was unable to remove the Jebusites from their possession of Jerusalem.
  reasoning_layer_used: POB lexical decision for לְהוֹרִישָׁם and contextual identification of the inhabitants
  rationale: The clearer phrase preserves the conquest setting without using the uncommon word “dispossess.”
- pob_phrase: the sons of Judah
  simplified_phrase: the sons of Judah[a]
  preserved_meaning: The phrase refers collectively to Judah’s tribal descendants.
  reasoning_layer_used: POB lexical and theological decisions for בְנֵי יְהוּדָה
  rationale: The main text keeps the Hebrew family image, while the note prevents a male-only misunderstanding.
- pob_phrase: have lived with the sons of Judah in Jerusalem to this day
  simplified_phrase: have continued to live there with the sons of Judah to this day
  preserved_meaning: Their coexistence in Jerusalem lasted from the past until the narrator’s present.
  reasoning_layer_used: POB lexical and theological decisions for וַיֵּשֶׁב and the unusual coexistence construction
  rationale: “Continued to live” states the ongoing situation in ordinary English without defining the relationship more narrowly.
translation_notes:
  risk_flags:
  - risk: “Force out” is slightly broader than the possession-focused term “dispossess.”
    mitigation: The Jerusalem setting and Judah’s failed removal of its inhabitants preserve the intended conquest sense.
  - risk: Modern readers may take “sons of Judah” to mean only male individuals.
    mitigation: The footnote explains that it names Judah’s tribal descendants collectively.
