translation:
  language: en
  text: Then the border reached the shoulder on the north side of Ekron. It turned toward Shikkeron, crossed Mount Baalah, and continued to Jabneel. From there, the border ended at the sea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This sea was likely the Mediterranean Sea, Judah’s western boundary.
    reason: cultural_note
simplification_decisions:
- pob_phrase: went out to the shoulder of Ekron northward
  simplified_phrase: reached the shoulder on the north side of Ekron
  preserved_meaning: The border reached Ekron’s northern side while retaining the Hebrew topographical image of a shoulder.
  reasoning_layer_used: POB lexical decisions for יָצָא, כֶּתֶף, and עֶקְרוֹן צָפוֹנָה
  rationale: The new order makes the direction clear without removing the concrete shoulder image.
- pob_phrase: the border bent toward Shikkeron, and passed over Mount Baalah
  simplified_phrase: It turned toward Shikkeron, crossed Mount Baalah
  preserved_meaning: The border changed direction toward Shikkeron and passed across Mount Baalah.
  reasoning_layer_used: POB lexical decisions for תָּאַר and עָבַר
  rationale: Common movement verbs make the route easier to follow.
- pob_phrase: went out to Jabneel; and the ends of the border were at the sea
  simplified_phrase: continued to Jabneel. From there, the border ended at the sea
  preserved_meaning: The border proceeded to Jabneel and terminated at the sea.
  reasoning_layer_used: POB lexical decisions for יָצָא, תֹּצְאוֹת, and יָמָּה
  rationale: Two direct sentences replace the difficult boundary formula while keeping its endpoint.
