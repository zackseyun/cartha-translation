translation:
  language: en
  text: It also included Gilead, the territory belonging to the Geshurites and Maacathites,[a] all of Mount Hermon,[b] and all of Bashan as far as Salecah—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word may also mean the border of the Geshurites and Maacathites, but here it most likely means their territory.
    reason: lexical_alternative
  - marker: b
    text: This may mean the entire Mount Hermon mountain region, not only its summit.
    reason: cultural_note
simplification_decisions:
- pob_phrase: and Gilead, and the territory
  simplified_phrase: It also included Gilead, the territory
  preserved_meaning: The verse continues the preceding list of land included in the allotment.
  reasoning_layer_used: Immediate syntax and POB territorial-list rationale
  rationale: A complete opening clause makes the continuing list easier to read.
- pob_phrase: the territory of the Geshurite and the Maacathite
  simplified_phrase: the territory belonging to the Geshurites and Maacathites
  preserved_meaning: The singular Hebrew people-names collectively refer to both peoples and their shared territorial description.
  reasoning_layer_used: POB lexical decisions for גְבוּל and the collective gentilics
  rationale: Plural people-names and “belonging to” make the territorial relationship immediately clear.
- pob_phrase: all Mount Hermon
  simplified_phrase: all of Mount Hermon
  preserved_meaning: The wording keeps the full extent of Hermon without deciding between the mountain and the wider massif.
  reasoning_layer_used: POB lexical decision and footnote for כֹל הַר חֶרְמוֹן
  rationale: The natural English construction retains the source image and its geographic breadth.
translation_notes:
  risk_flags:
  - risk: “It also included” supplies an implied subject from the preceding territorial context.
    mitigation: The wording only clarifies the list structure and does not add a new territorial claim.
  - risk: Readers may understand Mount Hermon as only one summit.
    mitigation: The footnote preserves the possible wider sense of the whole mountain region.
