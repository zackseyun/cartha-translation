translation:
  language: en
  text: Their territory began at Mahanaim and included all of Bashan, the whole kingdom of Og king of Bashan, and all the villages of Jair in Bashan—a total of sixty cities.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: These settlements were traditionally called “Havvoth-jair.”
    reason: lexical_alternative
  - marker: b
    text: Here “cities” does not necessarily mean large urban centers; the word can also refer to towns.
    reason: simplification_note
