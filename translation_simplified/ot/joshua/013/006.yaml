translation:
  language: en
  text: I myself will drive out all the people living in the hill country from Lebanon to Misrephoth-maim, and all the Sidonians, ahead of the sons of Israel. But you must assign this land to Israel as an inheritance, just as I have commanded you.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: All the inhabitants of the hill country ... all the Sidonians—I myself will drive them out
  simplified_phrase: I myself will drive out all the people living in the hill country ... and all the Sidonians
  preserved_meaning: God emphatically promises to remove both named populations without making one a subset of the other.
  reasoning_layer_used: POB lexical decisions for יֹשְׁבֵי הָהָר, כָּל צִידֹנִים, and אָנֹכִי אוֹרִישֵׁם
  rationale: The active order is easier to follow while preserving the two coordinated groups and the emphatic “I myself.”
- pob_phrase: before the sons of Israel
  simplified_phrase: ahead of the sons of Israel
  preserved_meaning: God will remove the inhabitants from Israel’s path or presence.
  reasoning_layer_used: POB lexical decision for מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  rationale: “Ahead of” preserves the directional image without adding a temporal process.
- pob_phrase: Only allot it to Israel as an inheritance
  simplified_phrase: But you must assign this land to Israel as an inheritance
  preserved_meaning: Despite God’s promise, Joshua must distribute the land as Israel’s covenantally granted inheritance.
  reasoning_layer_used: POB lexical decisions for רַק and הַפִּלֶהָ and theological decision for נַחֲלָה
  rationale: The wording makes the contrast, Joshua’s duty, and the land object clear while retaining “inheritance.”
interpretive_expansions:
- pob_phrase: allot it
  rendering: assign this land
  claim: The object Joshua must assign is the land.
  evidence:
  - The POB lexical rationale says the feminine singular object refers to the land.
  confidence: high
  alternatives_preserved:
  - allot it
  - divide it
translation_notes:
  risk_flags:
  - risk: “Ahead of” interprets the relational idiom directionally.
    mitigation: It avoids the rejected temporal wording and remains within the POB sense of removal in Israel’s presence or advance.
  - risk: “Assign” does not explicitly mention distribution by lot.
    mitigation: It preserves the POB land-distribution sense without making the mechanism explicit.
