translation:
  language: en
  text: The tribe of Levi was the only tribe he did not give land as an inheritance. Instead, the offerings presented by fire to Yahweh, the God of Israel, are the tribe’s inheritance.[a] This is what Yahweh had told them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some understand this as “Yahweh, the God of Israel, is the tribe’s inheritance.”
    reason: alternative_reading
