  preserved_meaning: Levi alone received no territorial inheritance.
  reasoning_layer_used: Lexical decision and land-allotment context
  rationale: The clause is reordered into natural English while retaining its restrictive force.
- pob_phrase: the offerings by fire to Yahweh
