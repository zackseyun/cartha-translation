  preserved_meaning: Sacrificial offerings associated with fire are Levi’s inheritance.
  reasoning_layer_used: Lexical decision for אִשֵּׁי יְהוָה
  rationale: “Presented by fire” preserves the source image without implying that every offering was entirely burned.
- pob_phrase: as he spoke to him
