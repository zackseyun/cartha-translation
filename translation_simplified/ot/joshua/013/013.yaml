  text: But the Israelites did not drive out the people of Geshur or Maacath. So the people of Geshur and Maacath lived among the Israelites to this day.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the sons of Israel
  simplified_phrase: the Israelites
  preserved_meaning: The phrase still refers to the people of Israel as a nation.
  reasoning_layer_used: POB base text and source payload
  rationale: The common national name is clearer than the literal family expression.
- pob_phrase: the Geshurites or the Maacathites
  simplified_phrase: the people of Geshur or Maacath
  preserved_meaning: Israel failed to remove both named peoples from the land.
  reasoning_layer_used: POB base text and source payload
  rationale: Using “the people of” makes the unfamiliar group names immediately understandable.
- pob_phrase: and Geshur and Maacath lived among Israel
  simplified_phrase: So the people of Geshur and Maacath lived among the Israelites
  preserved_meaning: These peoples continued living within Israel because they were not driven out.
  reasoning_layer_used: POB base text and applied revision
  rationale: Two sentences clarify the result while retaining the reviewed choice “lived.”
