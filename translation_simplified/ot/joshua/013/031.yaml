translation:
  language: en
  text: Their land also included half of Gilead and the cities of Ashtaroth and Edrei in Og’s kingdom in Bashan. This land was assigned to half of the sons of Machir[a], son of Manasseh, and was divided among their clans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sons of Machir” may also refer more broadly to Machir’s descendants.
    reason: lexical_alternative
