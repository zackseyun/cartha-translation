translation:
  language: en
  text: Og’s whole kingdom was in Bashan, and he ruled in Ashtaroth and Edrei. He was among the Rephaim[a] who remained. Moses struck them down and drove them from their land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the giants.” The Hebrew name Rephaim likely refers to an ancient people group.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: all the kingdom of Og in Bashan
  simplified_phrase: Og’s whole kingdom was in Bashan
  preserved_meaning: Og’s entire realm was located in Bashan.
  reasoning_layer_used: Lexical decisions for כָּל מַמְלְכוּת and בַּבָּשָׁן
  rationale: The possessive form and complete sentence make the realm’s extent and location clear.
- pob_phrase: he was left of the remnant of the Rephaim
  simplified_phrase: He was among the Rephaim who remained
  preserved_meaning: Og belonged to the surviving remnant of the Rephaim without implying that he alone survived.
  reasoning_layer_used: Lexical and theological decisions for הוּא נִשְׁאַר and הָרְפָאִים
  rationale: This natural wording retains both the idea of survival and the group name.
- pob_phrase: dispossessed them
  simplified_phrase: drove them from their land
  preserved_meaning: Those defeated by Moses lost possession of their territory.
  reasoning_layer_used: Lexical decision for וַיֹּרִשֵׁם
  rationale: The concrete wording explains the legal-military term in common English.
interpretive_expansions:
- pob_phrase: dispossessed them
  rendering: drove them from their land
  claim: Their dispossession involved removal from the territory they possessed.
  evidence:
