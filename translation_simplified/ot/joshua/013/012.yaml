    mitigation: The wording preserves the source ambiguity instead of narrowing it to Og and his people.
  - risk: Some readers may understand Rephaim only as giants rather than as a people group.
    mitigation: The main text retains the Hebrew group name, and the footnote gives “giants” only as an alternative.
