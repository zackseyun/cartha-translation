  text: The territory assigned by lot to Joseph’s descendants began at the Jordan near Jericho. The boundary ran eastward to the waters of Jericho,[a] then through the wilderness and up from Jericho into the hill country of Bethel.
  philosophy: optimal-equivalence
  footnotes:
