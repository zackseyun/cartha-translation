translation:
  language: en
  text: The descendants of Ephraim also had cities set apart for them within the land inherited by the descendants of Manasseh—all those cities and their villages.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the sons of Ephraim
  simplified_phrase: the descendants of Ephraim
  preserved_meaning: The phrase still names Ephraim's whole tribal line rather than only his immediate sons.
  reasoning_layer_used: POB lexical decision for לִבְנֵי אֶפְרַיִם
  rationale: The POB rationale identifies this as a tribal designation, so “descendants” is clearer for modern readers.
- pob_phrase: within the inheritance of the sons of Manasseh
  simplified_phrase: within the land inherited by the descendants of Manasseh
  preserved_meaning: The cities lay inside Manasseh's covenantal land allotment.
  reasoning_layer_used: POB lexical decisions for בְּתוֹךְ, נַחֲלַת, and בְּנֵי מְנַשֶּׁה
  rationale: Turning the abstract “inheritance” into “land inherited” makes the territorial meaning immediately clear.
- pob_phrase: all the cities and their villages
  simplified_phrase: all those cities and their villages
  preserved_meaning: The summary includes every designated city together with its dependent villages.
  reasoning_layer_used: POB lexical decisions for כָּל הֶעָרִים and וְחַצְרֵיהֶן
  rationale: “Those” clearly links the summary to the cities just mentioned without weakening its total scope.
interpretive_expansions:
- pob_phrase: the cities set apart for the sons of Ephraim
  rendering: The descendants of Ephraim also had cities set apart for them
  claim: The cities belonged to Ephraim's allotment even though they were located inside Manasseh's territory.
  evidence:
  - The Hebrew dative marks the cities as being for Ephraim.
  - The POB lexical rationale says the cities were designated for Ephraim within Manasseh's inheritance.
  confidence: high
  alternatives_preserved:
  - Cities were designated for Ephraim.
  - Cities were separated from Manasseh's territory for Ephraim.
translation_notes:
  risk_flags:
