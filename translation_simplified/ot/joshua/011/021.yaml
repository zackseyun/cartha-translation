translation:
  language: en
  text: At that time Joshua came and eliminated the Anakim from the hill country. He eliminated them from Hebron, Debir, Anab, all the hill country of Judah, and all the hill country of Israel. Joshua devoted them and their cities to destruction.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More formally, “put them under the ban.” The Hebrew expression means devoting persons or things to destruction.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: cut off the Anakim from the hill country
  simplified_phrase: eliminated the Anakim from the hill country
  preserved_meaning: Joshua exterminated the Anakim from that region without merging this action with the later ban terminology.
  reasoning_layer_used: Lexical decision for וַיַּכְרֵת and theological distinction from הֶחֱרִימָם.
  rationale: “Eliminated” rules out peaceful relocation while preserving the distinction from devotion to destruction.
- pob_phrase: from the hill country—from Hebron, from Debir, from Anab
  simplified_phrase: He eliminated them from Hebron, Debir, Anab
  preserved_meaning: The named locations remain the places from which Joshua eliminated the Anakim.
  reasoning_layer_used: Lexical decisions for the place-name list and hill-country geography.
  rationale: A separate sentence and plain list make the long geographic sequence easier to follow.
- pob_phrase: together with their cities
  simplified_phrase: and their cities
  preserved_meaning: The Anakim and their associated cities were both devoted to destruction.
  reasoning_layer_used: Lexical decision for עִם עָרֵיהֶם.
  rationale: The simple conjunction expresses accompaniment clearly here.
translation_notes:
