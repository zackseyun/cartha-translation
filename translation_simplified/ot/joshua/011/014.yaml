translation:
  language: en
  text: The sons of Israel[a] took for themselves all the goods and livestock from these cities. But they killed all the people with the sword until they had destroyed them all. They left none of the people breathing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The sons of Israel” means the Israelites.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: all the spoil of these cities, along with the livestock
  simplified_phrase: all the goods and livestock from these cities
  preserved_meaning: Israel took the cities’ goods and domesticated animals as war plunder.
  reasoning_layer_used: Lexical decisions for שְׁלַל and הַבְּהֵמָה
  rationale: “Goods” is clearer than “spoil,” while the conquest context still shows that they were taken in war.
- pob_phrase: the sons of Israel plundered for themselves
  simplified_phrase: The sons of Israel took for themselves
  preserved_meaning: The covenant people seized the property for their own benefit.
  reasoning_layer_used: Lexical and theological decisions for בְּנֵי יִשְׂרָאֵל and בָּזְזוּ לָהֶם
  rationale: The rewrite keeps the familial title and beneficiary while replacing the difficult verb.
- pob_phrase: they struck with the edge of the sword until they had destroyed them
  simplified_phrase: they killed all the people with the sword until they had destroyed them all
  preserved_meaning: The human population was killed by the sword and completely destroyed.
  reasoning_layer_used: Lexical decisions for כָּל הָאָדָם, הִכּוּ לְפִי חֶרֶב, and עַד הִשְׁמִדָם אֹתָם
  rationale: Ordinary clause order makes the violent action and its full extent immediately clear.
