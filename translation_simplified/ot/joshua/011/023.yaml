translation:
  language: en
  text: So Joshua took all the land,[a] just as Yahweh had told Moses. Joshua gave the land to Israel as an inheritance, dividing it among their tribes. Then the land had rest from war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the whole land.” This summarizes Joshua’s conquest of the land under discussion.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: according to all that Yahweh had spoken to Moses
  simplified_phrase: just as Yahweh had told Moses
  preserved_meaning: Joshua’s actions fulfilled what Yahweh had previously said to Moses.
  reasoning_layer_used: lexical decision for כְּכֹל אֲשֶׁר דִּבֶּר
  rationale: The simpler clause preserves both conformity to Yahweh’s word and its prior timing.
- pob_phrase: according to their divisions by their tribes
  simplified_phrase: dividing it among their tribes
  preserved_meaning: The inherited land was apportioned to Israel on a tribal basis.
  reasoning_layer_used: lexical decisions for כְּמַחְלְקֹתָם and לְשִׁבְטֵיהֶם
  rationale: The verbal form states the same distribution in ordinary English.
- pob_phrase: And the land had rest from war
  simplified_phrase: Then the land had rest from war
  preserved_meaning: Major conflict ceased and the land entered a period of tranquility.
  reasoning_layer_used: lexical decision for שָׁקְטָה מִמִּלְחָמָה
  rationale: “Then” clarifies the narrative sequence while retaining the biblical image of the land resting.
