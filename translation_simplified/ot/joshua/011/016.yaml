translation:
  language: en
  text: 'So Joshua took all this land: the hill country, the whole Negev region, the whole land of Goshen,[a] the lowland,[b] the Arabah region,[c] and the hill country of Israel together with its lowland.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This Goshen was a region in Canaan, not necessarily the Goshen in Egypt.
    reason: cultural_note
  - marker: b
    text: The Hebrew term refers to the low hills between the central highlands and the coastal plain; it is also called the Shephelah.
    reason: lexical_alternative
  - marker: c
    text: The Arabah is a geographic region sometimes described as the Jordan Valley or the desert plain.
    reason: lexical_alternative
