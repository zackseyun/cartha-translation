translation:
  language: en
  text: Yahweh gave them into Israel’s hands. The Israelites struck them down and pursued them as far as Great Sidon, Misrephoth-maim,[a] and the Valley of Mizpeh in the east. They struck them down until no survivor was left among them.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Misrephoth-maim is a place name; the Hebrew may mean “burnings of waters.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb behind “was left” is singular and may refer to Israel collectively or to Joshua as Israel’s representative.
    reason: alternative_reading
