translation:
  language: en
  text: The LORD hardened their hearts so that they would fight Israel. His purpose was to devote them to destruction[a], so that there would be no plea for mercy for them[b], but to destroy them, just as the LORD had commanded Moses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Devote them to destruction” means to place them under the LORD’s judgment for destruction.
    reason: simplification_note
  - marker: b
    text: The Hebrew may also mean that they would receive no mercy; it does not specify who might make or grant the plea.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: For it was from the LORD to harden their hearts
  simplified_phrase: The LORD hardened their hearts
  preserved_meaning: The LORD directly caused their hearts to become hardened against Israel.
  reasoning_layer_used: Theological decision on divine agency and lexical decision for לְחַזֵּק אֶת לִבָּם.
  rationale: The direct sentence removes an awkward idiom without weakening the LORD’s agency.
- pob_phrase: to meet Israel in battle
  simplified_phrase: so that they would fight Israel
  preserved_meaning: Their hardened resolve led them into hostile battle against Israel.
  reasoning_layer_used: Lexical decision for לִקְרַאת הַמִּלְחָמָה אֶת יִשְׂרָאֵל.
  rationale: “Fight Israel” states the military action in ordinary English.
- pob_phrase: so that he might devote them to destruction ... so that there would be no plea for mercy for them, but so that he might destroy them
  simplified_phrase: His purpose was to devote them to destruction ... so that there would be no plea for mercy for them, but to destroy them
  preserved_meaning: The hardening served the LORD’s purpose of judgment, absence of a plea for mercy, and destruction.
  reasoning_layer_used: Lexical and theological decisions for חרם, תְּחִנָּה, and שמד.
  rationale: The new sentence clarifies the linked purposes while preserving each distinct idea.
translation_notes:
  risk_flags:
  - risk: “Devote them to destruction” may be unfamiliar to common readers.
    mitigation: Footnote a explains its judgment sense without overstating its degree.
  - risk: The mercy clause may refer either to a plea or to mercy being granted.
    mitigation: The main text retains the chosen plea wording, while footnote b preserves the alternative.
