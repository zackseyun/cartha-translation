- pob_phrase: all the cities of these kings, and all their kings
  simplified_phrase: every city belonging to these kings, as well as the kings themselves
  preserved_meaning: Joshua captured both the kings’ cities and the kings.
  reasoning_layer_used: POB lexical decision for עָרֵי הַמְּלָכִים הָאֵלֶּה
  rationale: The wording clarifies the two objects without turning the cities into a special class of royal cities.
- pob_phrase: He devoted them to destruction
  simplified_phrase: devoted them to destruction, with a plain-language footnote
  preserved_meaning: The victims were placed under the irrevocable ban of destruction.
  reasoning_layer_used: POB lexical and theological decisions for הֶחֱרִים
  rationale: The key covenantal term remains in the text while the footnote explains it.
- pob_phrase: just as Moses the servant of Yahweh had commanded
  simplified_phrase: In doing this, he followed the command Moses, Yahweh’s servant, had given
  preserved_meaning: Joshua’s actions conformed to Moses’ earlier command.
  reasoning_layer_used: POB lexical decisions for כַּאֲשֶׁר צִוָּה, עֶבֶד יְהוָה, and יְהוָה
