translation:
  language: en
  text: Joshua captured every city belonging to these kings, as well as the kings themselves. He struck them down with the edge of the sword and devoted them to destruction.[a] In doing this, he followed the command Moses, Yahweh’s servant, had given.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Devoted them to destruction” translates a Hebrew term for placing people or things under an irrevocable ban requiring their destruction.
    reason: lexical_alternative
