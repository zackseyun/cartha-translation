translation:
  language: en
  text: At that time Joshua went back[a] and captured Hazor. He struck its king with the sword[b], because Hazor had once been the head—the chief—of all these kingdoms.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “returned.” The Hebrew describes Joshua moving back during the campaign.
    reason: lexical_alternative
  - marker: b
    text: In context, this likely means that Joshua killed the king, though the Hebrew verb itself means “struck.”
    reason: lexical_alternative
