translation:
  language: en
  text: These are the kings whom Joshua and the sons of Israel[a] struck down in the land west of the Jordan, from Baal-gad in the Valley of Lebanon to Mount Halak, which rises toward Seir. Joshua gave this land to the tribes of Israel as their inheritance, according to their tribal divisions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression is “sons of Israel”; it can also be rendered “Israelites.”
    reason: lexical_alternative
