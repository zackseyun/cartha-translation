translation:
  language: en
  text: Sihon king of the Amorites lived in Heshbon. His territory began at Aroer, on the bank of the Arnon Valley,[a] and included the middle of that valley and half of Gilead. It extended as far as the Jabbok Valley, the border of the Ammonites.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term can refer to a valley, wadi, or streambed; here the Arnon marked a territorial boundary.
    reason: cultural_note
  - marker: b
    text: Hebrew literally says “sons of Ammon,” meaning the Ammonites.
    reason: lexical_alternative
