translation:
  language: en
  text: These are the kings of the land on the sunrise side of the Jordan—the east side—whom the Israelites struck down. The Israelites took possession of their territory, from the Arnon stream valley to Mount Hermon, including the whole eastern Arabah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Arabah is the rift valley region around the Jordan River and farther south.
    reason: cultural_note
