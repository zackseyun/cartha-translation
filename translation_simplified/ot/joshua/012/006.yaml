translation:
  language: en
  text: Moses, Yahweh’s servant, and the sons of Israel[a] struck them down. Then Moses, Yahweh’s servant, gave the land as an inheritance to the Reubenites, the Gadites, and the half-tribe of Manasseh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This Hebrew expression can also be translated “the Israelites.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Moses the servant of Yahweh
  simplified_phrase: Moses, Yahweh’s servant
  preserved_meaning: Moses retains his honored role as Yahweh’s devoted and commissioned servant.
  reasoning_layer_used: POB lexical decision for עֶבֶד and theological decision for יְהוָה
  rationale: The possessive form is more natural while preserving the title and divine name.
- pob_phrase: struck them down, and Moses
  simplified_phrase: struck them down. Then Moses
  preserved_meaning: The defeat occurs before Moses assigns the land.
  reasoning_layer_used: Source clause sequence and POB battle-summary wording
  rationale: Two sentences make the sequence easier to follow without weakening the battle image.
- pob_phrase: gave it as an inheritance
  simplified_phrase: gave the land as an inheritance
  preserved_meaning: Moses assigned the conquered territory as a hereditary possession.
  reasoning_layer_used: POB lexical rationale for וַיִּתְּנָהּ and יְרֻשָּׁה
  rationale: Naming the land removes an unclear pronoun while retaining the covenant inheritance concept.
