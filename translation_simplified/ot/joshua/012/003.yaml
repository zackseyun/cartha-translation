translation:
  language: en
  text: His territory also included the Arabah[a], extending eastward as far as the Sea of Kinnereth. It also extended eastward as far as the Sea of the Arabah—the Salt Sea[b]—by way of Beth-jeshimoth, and southward below the slopes of Pisgah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Arabah is the rift valley region around the Jordan River, not merely a generic plain.
    reason: lexical_alternative
  - marker: b
    text: The Salt Sea was later commonly called the Dead Sea.
    reason: cultural_note
