translation:
  language: en
  text: This territory covered the hill country, the western lowlands[a], the Arabah desert plain[b], the mountain slopes, the wilderness, and the Negev in the south[c]. Its peoples were the Hittites, Amorites, Canaanites, Perizzites, Hivites, and Jebusites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The western lowlands were also known as the Shephelah.
    reason: lexical_alternative
  - marker: b
    text: The Arabah was the rift valley and desert plain.
    reason: cultural_note
  - marker: c
    text: Negev can also be translated “south country.”
    reason: lexical_alternative
