translation:
  language: en
  text: On that day, Joshua made a covenant[a] with the people. There at Shechem, he established a law and a legal ruling for them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression is literally “cut a covenant.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a statute and an ordinance
  simplified_phrase: a law and a legal ruling
  preserved_meaning: The two distinct legal provisions remain explicit.
  reasoning_layer_used: POB lexical decisions for חֹק and מִשְׁפָּט
  rationale: Common legal terms replace less familiar wording without merging the two ideas.
- pob_phrase: he set for them
  simplified_phrase: he established ... for them
  preserved_meaning: Joshua formally put binding legal provisions in place for the people.
  reasoning_layer_used: POB lexical decision for וַיָּשֶׂם
  rationale: “Established” makes the legal sense of “set” immediately clear.
- pob_phrase: and there in Shechem
  simplified_phrase: There at Shechem
  preserved_meaning: Shechem remains the location of Joshua’s legal action.
  reasoning_layer_used: POB lexical decision for בִּשְׁכֶם
  rationale: A new sentence gives the location natural emphasis and improves readability.
translation_notes:
  risk_flags:
