translation:
  language: en
  text: 'Joshua said to all the people, “This is what Yahweh, the God of Israel, says: ‘Long ago, your fathers[b] lived across the River.[a] Among them was Terah, the father of Abraham and Nahor. They served other gods.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The River was likely the Euphrates.
    reason: cultural_note
  - marker: b
    text: Here “fathers” means forefathers or ancestors.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Thus says Yahweh
  simplified_phrase: This is what Yahweh ... says
  preserved_meaning: Joshua introduces Yahweh’s direct message with the standard messenger formula.
  reasoning_layer_used: POB lexical decision for כֹּה אָמַר
  rationale: The expanded formula is clearer in modern English without weakening divine authority.
- pob_phrase: lived beyond the River
  simplified_phrase: lived across the River
  preserved_meaning: The ancestors lived on the far side of the known river, likely the Euphrates.
  reasoning_layer_used: POB lexical decision and cultural note for בְּעֵבֶר הַנָּהָר
  rationale: “Across” is more natural while retaining the Hebrew geographic expression.
- pob_phrase: Terah, the father of Abraham and the father of Nahor
  simplified_phrase: Among them was Terah, the father of Abraham and Nahor
  preserved_meaning: Terah belonged to their forefathers and was the father of both Abraham and Nahor.
  reasoning_layer_used: POB lexical decisions for אֲבוֹתֵיכֶם and the Terah clause
  rationale: The recast sentence removes repetition and clarifies how Terah relates to the preceding group.
