translation:
  language: en
  text: Joshua wrote these words in the Book of God’s Law. Then he took a large stone and set it up there under the oak[a] in Yahweh’s sanctuary.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “terebinth”; the exact kind of tree is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or “by Yahweh’s sanctuary.”
    reason: alternative_reading
