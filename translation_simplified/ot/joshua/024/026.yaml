  preserved_meaning: Joshua recorded the covenant words before setting up the stone.
  reasoning_layer_used: POB lexical decisions for כתב, דברים, and ספר תורת אלהים
  rationale: Two shorter sentences make the sequence easier to follow without merging the actions.
- pob_phrase: the Book of the Law of God
