translation:
  language: en
  text: The sons of Israel had brought Joseph’s bones up from Egypt. They buried them at Shechem, in the plot of land Jacob had bought from the sons of Hamor, the father of Shechem,[a] for one hundred qesitahs.[b] That land became an inheritance for Joseph’s sons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Father” may have the broader sense of founder or chief ancestor.
    reason: lexical_alternative
  - marker: b
    text: A qesitah was an ancient unit of money or value; its exact worth is unknown.
    reason: cultural_note
simplification_decisions:
- pob_phrase: which the sons of Israel had brought up from Egypt, they buried
  simplified_phrase: The sons of Israel had brought Joseph’s bones up from Egypt. They buried them
  preserved_meaning: The earlier removal from Egypt and later burial remain distinct actions.
  reasoning_layer_used: Lexical decisions for הֶעֱלוּ and קָבְרוּ
  rationale: Two sentences replace the difficult relative-clause structure while preserving the sequence.
- pob_phrase: in the portion of the field
  simplified_phrase: in the plot of land
  preserved_meaning: The burial site was a defined parcel of property.
  reasoning_layer_used: Lexical decision for בְּחֶלְקַת הַשָּׂדֶה
  rationale: “Plot of land” gives the ordinary modern sense without changing the referent.
- pob_phrase: and it became an inheritance for the sons of Joseph
  simplified_phrase: That land became an inheritance for Joseph’s sons
  preserved_meaning: The purchased property became hereditary land belonging to Joseph’s descendants.
  reasoning_layer_used: Lexical decisions for וַיִּהְיוּ and לְנַחֲלָה
  rationale: Naming the land removes an unclear pronoun while retaining the inheritance concept.
translation_notes:
  risk_flags:
