translation:
  language: en
  text: Now fear Yahweh. Serve him wholeheartedly and faithfully. Get rid of the gods your fathers served beyond the River[a] and in Egypt, and serve Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, beyond the Euphrates River.
    reason: cultural_note
simplification_decisions:
- pob_phrase: serve him with integrity and faithfulness
  simplified_phrase: Serve him wholeheartedly and faithfully
  preserved_meaning: Yahweh requires sincere, undivided, and reliable covenant service.
  reasoning_layer_used: POB lexical decisions for בְּתָמִים and וּבֶאֱמֶת
  rationale: The adverbs express the paired qualities more directly in common English.
- pob_phrase: put away the gods
  simplified_phrase: Get rid of the gods
  preserved_meaning: The people must remove the rival gods completely.
  reasoning_layer_used: POB lexical decision for וְהָסִירוּ
  rationale: “Get rid of” makes the command immediately clear without weakening it.
- pob_phrase: Now fear Yahweh and serve him ... and put away ... and serve Yahweh
  simplified_phrase: Now fear Yahweh. Serve him ... Get rid of ... and serve Yahweh.
  preserved_meaning: Joshua gives distinct commands and repeats the call to serve Yahweh for emphasis.
  reasoning_layer_used: POB discourse and repeated-imperative decisions
  rationale: Shorter sentences clarify the commands while preserving their order and repetition.
translation_notes:
  risk_flags:
  - risk: “Wholeheartedly” may sound mainly emotional to some readers.
    mitigation: Pairing it with “faithfully” preserves the sense of undivided and reliable service.
  - risk: “Beyond the River” is unclear without ancient geographical knowledge.
    mitigation: The footnote identifies the River as the Euphrates without adding that interpretation to the text.
