translation:
  language: en
  text: I sent the hornet[a] ahead of you, and it drove the two Amorite kings out of your way. Your swords and bows did not drive them out.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or this may be a picture of panic or terror sent by God rather than literal hornets.
    reason: lexical_alternative
