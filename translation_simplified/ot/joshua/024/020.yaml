translation:
  language: en
  text: If you abandon Yahweh and serve foreign gods, he will turn against you. He will bring disaster on you and destroy you, even after he has been good to you.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: forsake Yahweh
  simplified_phrase: abandon Yahweh
  preserved_meaning: Israel would reject its covenant relationship with Yahweh.
  reasoning_layer_used: POB lexical decision for תַעַזְבוּ
  rationale: “Abandon” is common English while retaining the force of deliberate relational desertion.
- pob_phrase: then he will turn and do you harm
  simplified_phrase: he will turn against you. He will bring disaster on you
  preserved_meaning: Yahweh will reverse his favorable dealings and bring judgment on Israel.
  reasoning_layer_used: POB lexical and theological decisions for וְשָׁב and וְהֵרַע לָכֶם
  rationale: The new wording clarifies the reversal and avoids suggesting that Yahweh commits moral evil.
- pob_phrase: consume you
  simplified_phrase: destroy you
  preserved_meaning: Yahweh’s judgment may bring Israel to an end.
  reasoning_layer_used: POB lexical alternative for וְכִלָּה אֶתְכֶם
  rationale: “Destroy” states the severe result more directly for modern readers.
