  preserved_meaning: The named river that Israel crossed remains the same.
  reasoning_layer_used: lexical decision for הַיַּרְדֵּן
  rationale: Adding “River” helps readers unfamiliar with the biblical place name.
- pob_phrase: one long sentence joining arrival, battle, and victory
  simplified_phrase: three short sentences
  preserved_meaning: The sequence remains crossing, conflict, and God-given victory.
  reasoning_layer_used: source clause sequence and theological agency decision
  rationale: Shorter sentences make the narrative progression easier to follow.
- pob_phrase: I gave them into your hand
  simplified_phrase: I handed them over to you
  preserved_meaning: God gave Israel power over its enemies and caused the victory.
  reasoning_layer_used: lexical idiom and theological decision on divine agency
  rationale: The common expression keeps the hand image while making the conquest idiom clear.
