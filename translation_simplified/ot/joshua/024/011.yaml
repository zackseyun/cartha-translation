translation:
  language: en
  text: Then you crossed the Jordan River and came to Jericho. The men of Jericho[a] fought against you—the Amorites, Perizzites, Canaanites, Hittites, Girgashites, Hivites, and Jebusites. But I handed them over to you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the leaders of Jericho.” The Hebrew literally refers to the city’s masters or owners and may mean its rulers or leading men.
    reason: lexical_alternative
