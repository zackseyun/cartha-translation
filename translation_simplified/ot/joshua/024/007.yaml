translation:
  language: en
  text: They cried out to Yahweh. He placed darkness between you and the Egyptians. Then he brought the sea over him[a] and covered him with it. You saw with your own eyes what I did in Egypt. After that, you lived in the wilderness for many days.
  philosophy: optimal-equivalence
  footnotes:
