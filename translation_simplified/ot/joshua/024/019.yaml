translation:
  language: en
  text: Joshua said to the people, “You cannot serve Yahweh, because he is a holy God. He is a jealous God who accepts no rival. He will not forgive[a] your rebellion and your sins.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “bear or carry away.” This Hebrew expression commonly means “forgive.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: You are not able to serve Yahweh
  simplified_phrase: You cannot serve Yahweh
  preserved_meaning: The people lack the ability to fulfill covenant service to Yahweh.
  reasoning_layer_used: Lexical decision for תוּכְלוּ and לַעֲבֹד
  rationale: “Cannot” states the same incapacity in more direct modern English.
- pob_phrase: your transgressions and your sins
  simplified_phrase: your rebellion and your sins
  preserved_meaning: Both defiance against God's authority and sin more broadly remain distinct.
  reasoning_layer_used: Lexical decisions for פִשְׁעֲכֶם and חַטֹּאותֵיכֶם
  rationale: “Rebellion” makes the covenant-violation force clearer than “transgressions.”
- pob_phrase: for he is a holy God; he is a jealous God
  simplified_phrase: because he is a holy God. He is a jealous God who accepts no rival.
  preserved_meaning: God's holiness and exclusive covenant claim explain Joshua's warning.
  reasoning_layer_used: Lexical and theological decisions for אֱלֹהִים קְדֹשִׁים and אֵל קַנּוֹא
  rationale: Two sentences ease the structure while preserving both divine attributes.
interpretive_expansions:
- pob_phrase: a jealous God
  rendering: a jealous God who accepts no rival
  claim: God demands exclusive allegiance and does not tolerate rival gods.
  evidence:
  - The lexical rationale says קַנּוֹא denotes God's exclusive claim and intolerance of rival allegiance.
  - The immediate covenant setting concerns whether Israel will serve Yahweh alone.
  confidence: high
  alternatives_preserved:
  - a jealous God
  - a zealous God
translation_notes:
  risk_flags:
  - risk: “Cannot serve” could be misunderstood as an absolute claim that no one can ever serve Yahweh.
    mitigation: The verse keeps Joshua's forceful warning, while the surrounding covenant context bounds the statement.
  - risk: “Will not forgive” could sound like a denial that Yahweh ever forgives.
    mitigation: The wording follows POB's contextual decision that Joshua warns against presuming pardon for covenant rebellion.
