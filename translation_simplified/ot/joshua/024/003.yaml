translation:
  language: en
  text: Then I brought your father Abraham from across the River[a] and led him all through Canaan. I increased his offspring[b] and gave him Isaac.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The River” likely refers to the Euphrates.
    reason: cultural_note
  - marker: b
    text: Or “descendants”; the Hebrew word for “offspring” is singular in form but collective in meaning.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: took your father Abraham from beyond the River
  simplified_phrase: brought your father Abraham from across the River
  preserved_meaning: God moved Abraham from the far side of the River while retaining Israel’s ancestral designation for him.
  reasoning_layer_used: Lexical and theological decisions on וָאֶקַּח, אֲבִיכֶם, and מֵעֵבֶר הַנָּהָר.
  rationale: “Brought” and “from across” express the movement more naturally while preserving “father” and “the River.”
- pob_phrase: through all the land of Canaan
  simplified_phrase: all through Canaan
  preserved_meaning: God led Abraham throughout the land of Canaan.
  reasoning_layer_used: Lexical decision on בְּכָל אֶרֶץ כְּנָעַן.
  rationale: The shorter wording keeps the full extent of Abraham’s movement without the formal phrase “the land of.”
- pob_phrase: multiplied his offspring
  simplified_phrase: increased his offspring
  preserved_meaning: God caused Abraham’s line of offspring to grow.
  reasoning_layer_used: Lexical decisions on וָאַרְבֶּה and זַרְעוֹ.
  rationale: “Increased” is more immediate modern English while retaining the collective sense of “offspring.”
translation_notes:
  risk_flags:
  - risk: Modern readers may not know which river is meant.
    mitigation: A footnote gives the likely identification without inserting it into the main text.
  - risk: “Offspring” may be read as referring to only one child.
    mitigation: A footnote preserves the collective sense and the alternative “descendants.”
