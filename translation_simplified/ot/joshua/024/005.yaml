translation:
  language: en
  text: Then I sent Moses and Aaron. I struck Egypt[a] with what I did there.[b] After that, I brought you out.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “afflicted Egypt”; the Hebrew describes the LORD striking Egypt with blows.
    reason: lexical_alternative
  - marker: b
    text: Literally, “according to what I did in its midst.”
    reason: source_note
simplification_decisions:
- pob_phrase: Then I sent Moses and Aaron, and I struck Egypt
  simplified_phrase: Then I sent Moses and Aaron. I struck Egypt
  preserved_meaning: God sent Moses and Aaron before striking Egypt.
  reasoning_layer_used: POB lexical decisions and event sequence
  rationale: Two sentences make the sequence easier to follow.
- pob_phrase: as I did in its midst
  simplified_phrase: with what I did there
  preserved_meaning: God struck Egypt in connection with his acts within Egypt.
  reasoning_layer_used: POB lexical rationale and listed alternative for the compressed Hebrew clause
  rationale: “With” avoids imposing an explicitly instrumental relationship, while “there” clearly points back to Egypt.
- pob_phrase: and afterward I brought you out
  simplified_phrase: After that, I brought you out
  preserved_meaning: God brought Israel out after his acts against Egypt.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The new sentence clarifies the timing while retaining the corporate address “you.”
translation_notes:
  risk_flags:
  - risk: “With” leaves the Hebrew clause’s exact relationship compressed.
    mitigation: Footnote b preserves the literal construction without limiting the acts to the plagues.
  - risk: Modern readers may take “you” as only Joshua’s immediate audience.
    mitigation: The corporate address remains unchanged to preserve Israel’s covenant solidarity.
