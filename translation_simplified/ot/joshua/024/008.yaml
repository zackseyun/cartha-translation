translation:
  language: en
  text: Then I brought you into the land of the Amorites, who lived beyond the Jordan River. They fought against you, and I handed them over to you. You took possession of their land, and I destroyed them, removing them from your presence.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: who lived beyond the Jordan
  simplified_phrase: who lived beyond the Jordan River
  preserved_meaning: The Amorites lived across the Jordan from the stated viewpoint.
  reasoning_layer_used: POB lexical decision
  rationale: Adding “River” helps unfamiliar readers identify the Jordan without changing the location.
- pob_phrase: and they fought with you
  simplified_phrase: They fought against you
  preserved_meaning: The Amorites engaged Israel as enemies in battle.
  reasoning_layer_used: POB lexical decision and immediate context
  rationale: “Against you” prevents readers from thinking the Amorites fought alongside Israel.
- pob_phrase: I gave them into your hand
  simplified_phrase: I handed them over to you
  preserved_meaning: God delivered the Amorites into Israel’s power.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: This natural English idiom keeps God as the one who granted Israel victory.
interpretive_expansions:
- pob_phrase: from before you
  rendering: removing them from your presence
  claim: God’s destruction removed the Amorites from before Israel.
  evidence:
  - The POB lexical rationale identifies removal from Israel’s sight or presence.
  confidence: high
  alternatives_preserved:
  - from before you
  - from your presence
translation_notes:
  risk_flags:
