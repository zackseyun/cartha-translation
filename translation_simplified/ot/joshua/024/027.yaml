translation:
  language: en
  text: Joshua said to all the people, “Look at this stone! It will be a witness against us.[a] It has heard every word Yahweh spoke with us.[b] It will also be a witness against you, so that you do not deny your God.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “a witness for us” or “to us,” but the context emphasizes its testimony against covenant unfaithfulness.
    reason: lexical_alternative
  - marker: b
    text: The stone is pictured as hearing the covenant words and serving as a witness.
    reason: cultural_note
  - marker: c
    text: “Deny your God” may also mean “deal falsely with your God” or “prove false to your God.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: “Look, this stone”
  simplified_phrase: “Look at this stone!”
  preserved_meaning: Joshua directly calls the people’s attention to the covenant stone.
  reasoning_layer_used: Lexical decision for הִנֵּה
  rationale: The direct command is more natural while retaining the force of “Look.”
- pob_phrase: “for it has heard all the words of Yahweh that he spoke with us”
  simplified_phrase: “It has heard every word Yahweh spoke with us.”
  preserved_meaning: The stone is personified as hearing all of Yahweh’s covenant words.
  reasoning_layer_used: Lexical and theological decisions on שָׁמְעָה and personification
  rationale: The shorter sentence preserves both the complete scope and the source image.
- pob_phrase: “lest you deny your God”
  simplified_phrase: “so that you do not deny your God”
  preserved_meaning: The stone warns the people against rejecting their covenant commitment to God.
  reasoning_layer_used: Lexical decisions for פֶּן and תְּכַחֲשׁוּן
  rationale: The modern clause clearly expresses the same preventive warning.
translation_notes:
  risk_flags:
  - risk: Modern readers may take the stone’s hearing literally rather than as personification.
    mitigation: Footnote b identifies the deliberate covenant-witness image without removing it from the text.
  - risk: “Against” is stronger than other possible senses of the Hebrew preposition.
    mitigation: Footnote a preserves the alternatives while following the POB’s contextual judgment.
