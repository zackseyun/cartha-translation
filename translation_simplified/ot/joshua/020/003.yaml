translation:
  language: en
  text: so that anyone who kills another person unintentionally and unknowingly may flee there. These cities will provide refuge from the avenger of blood.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “avenger of blood” was the person responsible for avenging a death within Israel’s family-based legal system.
    reason: cultural_note
simplification_decisions:
- pob_phrase: a manslayer who strikes down a person
  simplified_phrase: anyone who kills another person
  preserved_meaning: The person caused a human death but is not described as a deliberate murderer.
  reasoning_layer_used: Lexical and theological decisions on רוֹצֵחַ and מַכֵּה נֶפֶשׁ
  rationale: Common wording replaces an unfamiliar legal term while the qualifiers rule out deliberate murder.
- pob_phrase: unintentionally, without knowledge
  simplified_phrase: unintentionally and unknowingly
  preserved_meaning: Both expressions qualify the killing as lacking intent or awareness.
  reasoning_layer_used: Lexical decisions on בִּשְׁגָגָה and בִּבְלִי דָעַת
  rationale: “Unknowingly” avoids an unclear pronoun while preserving the broad legal qualification.
- pob_phrase: and they shall be for you a refuge
  simplified_phrase: These cities will provide refuge
  preserved_meaning: The designated cities protect the accidental killer.
  reasoning_layer_used: Lexical decision on וְהָיוּ לָכֶם לְמִקְלָט and immediate context
  rationale: Naming the cities clarifies the plural pronoun and makes the formal clause natural.
translation_notes:
  risk_flags:
  - risk: “Unknowingly” does not specify exactly what the killer did not know.
    mitigation: The broad wording preserves the Hebrew phrase without over-defining its legal scope.
