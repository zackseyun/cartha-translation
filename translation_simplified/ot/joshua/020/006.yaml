translation:
  language: en
  text: He must live in that city until he appears before the assembled community for judgment. He must remain there until the high priest serving at that time dies. Then the person who killed someone may return to his own city and home, the city from which he fled.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: until he stands before the congregation for judgment
  simplified_phrase: until he appears before the assembled community for judgment
  preserved_meaning: He must appear before the gathered community acting in its judicial role.
  reasoning_layer_used: Lexical decisions for עמד לפני and הָעֵדָה
  rationale: Ordinary legal wording clarifies both the appearance and the community’s judicial role.
- pob_phrase: until the death of the high priest who is in office in those days
  simplified_phrase: He must remain there until the high priest serving at that time dies.
  preserved_meaning: His required residence continues until the high priest then serving dies.
  reasoning_layer_used: Lexical decisions for וְיָשַׁב and the high-priest clause
  rationale: A separate sentence makes the continuing residence requirement easy to follow.
- pob_phrase: the manslayer may return and come to his city and to his house
  simplified_phrase: the person who killed someone may return to his own city and home
  preserved_meaning: The killer, not yet judged a murderer, is permitted to return to his community and household.
  reasoning_layer_used: Lexical and theological decisions for הָרֹצֵחַ and אָז יָשׁוּב
  rationale: Plain wording preserves legal neutrality, authorized return, and the repeated reference to the city.
translation_notes:
  risk_flags:
  - risk: “The person who killed someone” is longer than the legal term “manslayer.”
    mitigation: The wording is immediately clear and does not imply a murder conviction.
