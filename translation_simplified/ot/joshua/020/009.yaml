translation:
  language: en
  text: These cities were appointed for all the Israelites and for the non-Israelite residents living among them. Anyone who unintentionally struck and killed a person could flee to one of these cities. There, that person would not die at the hand of the avenger of blood—a relative who avenged the death—before standing before the assembly.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: for all the sons of Israel
  simplified_phrase: for all the Israelites
  preserved_meaning: The protection applied to the whole people of Israel.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The POB identifies “Israelites” as the clear idiomatic equivalent of the national expression.
- pob_phrase: the sojourner residing among them
  simplified_phrase: the non-Israelite residents living among them
  preserved_meaning: The law also protected non-native residents within Israelite society.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: This explains the legal category without importing modern immigration language.
- pob_phrase: so that anyone who struck down a person unintentionally might flee there and not die by the hand of the avenger of blood until he stood before the congregation
  simplified_phrase: Anyone who unintentionally struck and killed a person could flee to one of these cities. There, that person would not die at the hand of the avenger of blood ... before standing before the assembly.
  preserved_meaning: An unintentional killer could flee there and remain protected from death at the avenger’s hand until appearing before the assembly.
  reasoning_layer_used: POB lexical decisions and immediate context
  rationale: Two sentences clarify the sequence while retaining the lethal outcome, the avenger’s agency, and the legal endpoint.
