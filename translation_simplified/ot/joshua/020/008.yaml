- pob_phrase: beyond the Jordan east of Jericho
  simplified_phrase: on the east side of the Jordan, east of Jericho
  preserved_meaning: The cities lay across the Jordan from Canaan proper and east of Jericho.
  reasoning_layer_used: POB lexical decisions for וּמֵעֵבֶר and יְרִיחוֹ מִזְרָחָה
  rationale: The clearer directional wording preserves the same geographical location.
- pob_phrase: they designated
  simplified_phrase: they set apart
  preserved_meaning: The cities were officially assigned for their stated purpose.
  reasoning_layer_used: POB lexical decision for נָתְנוּ
  rationale: “Set apart” expresses official selection in more familiar language.
- pob_phrase: from the tribe of Reuben/Gad/Manasseh
  simplified_phrase: in the territory of Reuben/Gad/Manasseh
  preserved_meaning: Each city belonged to the named tribe’s allotted land.
  reasoning_layer_used: POB tribal-allotment lexical rationales
  rationale: “In the territory of” makes the geographical relationship immediately clear.
