translation:
  language: en
  text: On the east side of the Jordan, east of Jericho, they set apart Bezer in the wilderness on the plateau, in the territory of Reuben; Ramoth in Gilead[a], in the territory of Gad; and Golan in Bashan, in the territory of Manasseh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally called “Ramoth-gilead.” The Hebrew literally says “Ramoth in Gilead.”
    reason: lexical_alternative
