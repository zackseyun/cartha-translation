  text: If the avenger of blood[a] chases him, the city leaders must not give the man who caused the death into the avenger’s power. He struck his neighbor unintentionally and had not hated him before.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “avenger of blood” was a family representative who could seek to avenge a killing.
    reason: cultural_note
  - marker: b
    text: Literally, “from yesterday and the day before,” a Hebrew expression meaning “previously.”
    reason: lexical_alternative
