simplification_decisions:
- pob_phrase: Only be very careful to do
  simplified_phrase: Only take great care to obey
  preserved_meaning: The wording retains the urgent call to carry out what was commanded.
  reasoning_layer_used: Lexical decisions for רַק, שִׁמְרוּ מְאֹד, and לַעֲשׂוֹת
  rationale: “Take great care to obey” expresses actual performance in direct modern English.
- pob_phrase: Moses the servant of Yahweh commanded you
  simplified_phrase: Moses, Yahweh’s servant, commanded you
  preserved_meaning: Moses remains Yahweh’s honored servant and explicitly commands the people.
  reasoning_layer_used: Lexical decision for עֶבֶד יְהוָה and source verb צִוָּה
  rationale: The possessive form is smoother English while “commanded” preserves Moses’ authority.
- pob_phrase: to love Yahweh your God, to walk in all his ways, to keep his commandments, to cling to him, and to serve him
  simplified_phrase: love Yahweh your God, walk in all his ways, keep his commandments, cling to him, and serve him
  preserved_meaning: All five distinct covenant duties and both key relational images remain intact.
  reasoning_layer_used: Theological decision to retain covenantal ethical metaphors
  rationale: Direct commands after the colon make the list easier to follow.
translation_notes:
