  language: en
  text: Rather, this altar is a witness between us and you, and between our descendants and yours for generations to come. It shows that we may serve the LORD in his presence with our burnt offerings, sacrifices, and peace offerings. This is so that in the future your children will not say to ours, “You have no share in the LORD.”
