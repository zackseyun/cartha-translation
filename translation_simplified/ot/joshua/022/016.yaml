translation:
  language: en
  text: 'This is what the whole community of Yahweh says: “What is this act of unfaithfulness you have committed against the God of Israel? Today you are turning away from following Yahweh by building an altar for yourselves. Today you are rebelling against Yahweh.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Thus says the whole congregation of Yahweh
  simplified_phrase: This is what the whole community of Yahweh says
  preserved_meaning: The entire covenant community delivers the message while Yahweh remains the divine name.
  reasoning_layer_used: POB lexical decisions for כֹּה אָמְרוּ, כֹּל עֲדַת יְהוָה, and יְהוָה
  rationale: The formal opening and “congregation” are recast in familiar modern English.
- pob_phrase: What is this breach of faith that you have committed against the God of Israel
  simplified_phrase: What is this act of unfaithfulness you have committed against the God of Israel?
  preserved_meaning: The question identifies their alleged covenant disloyalty toward Israel’s God rather than asking for their motive.
  reasoning_layer_used: POB lexical and theological decisions for מַעַל
  rationale: “Act of unfaithfulness” clearly expresses the serious relational and covenantal offense.
- pob_phrase: turning away today from following Yahweh by building for yourselves an altar, rebelling today against Yahweh
  simplified_phrase: Today you are turning away from following Yahweh by building an altar for yourselves. Today you are rebelling against Yahweh.
  preserved_meaning: The altar is treated as evidence of both abandoning allegiance to Yahweh and rebelling against him that day.
  reasoning_layer_used: POB lexical decisions for לָשׁוּב מֵאַחֲרֵי, בִּבְנוֹתְכֶם, לִמְרָדְכֶם, and repeated הַיּוֹם
  rationale: Two short sentences keep both charges and attach each occurrence of “today” correctly.
