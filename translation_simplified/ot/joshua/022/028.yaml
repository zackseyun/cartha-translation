translation:
  language: en
  text: So we said, “If they ever say this to us or to our descendants in future generations, we will answer, ‘Look at this copy[a] of Yahweh’s altar, which our fathers made. It was not made for burnt offerings. It was not made for sacrifices. Instead, it is a witness between us and you.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “pattern,” “model,” or “representation.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: If they should say to us or to our generations in time to come
  simplified_phrase: If they ever say this to us or to our descendants in future generations
  preserved_meaning: The statement concerns a possible future challenge to the speakers or their later generations.
  reasoning_layer_used: Lexical decisions for וְהָיָה כִּי and מָחָר
  rationale: The wording states the future possibility naturally without presenting it as certain.
- pob_phrase: the pattern of the altar of Yahweh
  simplified_phrase: this copy of Yahweh’s altar
  preserved_meaning: The altar is a representation of Yahweh’s altar, not the authorized altar itself.
  reasoning_layer_used: Lexical decision for תַּבְנִית and POB footnote
  rationale: “Copy” makes the representative function clear, while the footnote preserves the broader lexical range.
- pob_phrase: not for burnt offering and not for sacrifice, but it is a witness
  simplified_phrase: It was not made for burnt offerings. It was not made for sacrifices. Instead, it is a witness
  preserved_meaning: The altar had no sacrificial purpose but served as testimony between the groups.
  reasoning_layer_used: Doctrine realignment preserving לֹא...וְלֹא and כִּי עֵד הוּא
  rationale: The short sentences retain both denials, and “Instead” makes the contrasting purpose explicit.
translation_notes:
  risk_flags:
  - risk: “Copy” may imply greater exactness than the Hebrew term requires.
    mitigation: The footnote preserves “pattern,” “model,” and “representation” as alternatives.
