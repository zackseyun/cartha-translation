translation:
  language: en
  text: Phinehas son of Eleazar the priest said to the people of the tribes of Reuben, Gad, and Manasseh, “Today we know that Yahweh is among us, because you have not been unfaithful to Yahweh in this matter. So you have saved the Israelites from judgment at Yahweh’s hand.”
  philosophy: optimal-equivalence
