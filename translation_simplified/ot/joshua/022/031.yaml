  preserved_meaning: Phinehas addresses the three tribal groups named in the Hebrew.
  reasoning_layer_used: POB lexical decision and listed gentilics alternative
  rationale: The wording replaces a repetitive ancestry formula with a clear description of the tribal groups.
- pob_phrase: you have not acted unfaithfully against Yahweh
  simplified_phrase: you have not been unfaithful to Yahweh
  preserved_meaning: They had not committed covenantal treachery against Yahweh.
  reasoning_layer_used: POB lexical and theological decisions on מעל
  rationale: The simpler construction keeps the force of disloyalty rather than reducing it to a technical offense.
- pob_phrase: you have delivered the sons of Israel from the hand of Yahweh
  simplified_phrase: you have saved the Israelites from judgment at Yahweh’s hand
  preserved_meaning: Their faithfulness spared Israel from Yahweh’s active power in judgment.
  reasoning_layer_used: POB lexical decision, theological decision, and cultural note
  rationale: The rendering explains the Hebrew idiom while retaining the image of Yahweh’s hand.
