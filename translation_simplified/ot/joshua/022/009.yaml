translation:
  language: en
  text: So the Reubenites, the Gadites, and the half-tribe of Manasseh left the other Israelites at Shiloh in the land of Canaan. They returned to Gilead, the territory that belonged to them and that they had taken possession of[a] at Yahweh’s command through Moses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean that they had received and held this territory.
    reason: lexical_alternative
