  preserved_meaning: The tribal groups descended from Reuben and Gad remain distinct.
  reasoning_layer_used: POB lexical alternatives
  rationale: The accepted smoother alternatives identify the same tribal groups in common English.
- pob_phrase: returned and departed from the sons of Israel, from Shiloh
  simplified_phrase: left the other Israelites at Shiloh. They returned
  preserved_meaning: Both their departure from Israel’s assembly and their return journey are retained.
  reasoning_layer_used: Hebrew verb sequence and lexical rationales
  rationale: Two direct clauses preserve both verbs without the POB’s difficult clause order.
- pob_phrase: the land of their possession
