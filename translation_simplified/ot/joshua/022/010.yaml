translation:
  language: en
  text: When they reached the region of the Jordan in the land of Canaan, the tribes of Reuben and Gad and the half-tribe of Manasseh built an altar there beside the Jordan. It was a large altar that could easily be seen.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the sons of Reuben and the sons of Gad
  simplified_phrase: the tribes of Reuben and Gad
  preserved_meaning: The builders were the tribal groups descended from Reuben and Gad.
  reasoning_layer_used: POB lexical decisions
  rationale: The tribal names communicate the Hebrew family-based expression more directly to modern readers.
- pob_phrase: an altar great in appearance
  simplified_phrase: It was a large altar that could easily be seen.
  preserved_meaning: The altar was visually notable because of its size and conspicuous appearance.
  reasoning_layer_used: POB lexical decisions and lexical footnote b
  rationale: A separate sentence explains the difficult phrase without suggesting why the altar was built.
- pob_phrase: by the Jordan
  simplified_phrase: beside the Jordan
  preserved_meaning: The altar stood near the Jordan rather than on the river itself.
  reasoning_layer_used: POB lexical decision for עַל הַיַּרְדֵּן
  rationale: “Beside” makes the geographical relationship immediately clear.
translation_notes:
  risk_flags:
  - risk: Calling the altar “large” may emphasize physical size more than the broader Hebrew adjective “great.”
    mitigation: The added phrase “could easily be seen” preserves the POB emphasis on its notable appearance.
  - risk: Replacing “sons of” with “tribes of” removes the Hebrew familial idiom.
    mitigation: The wording preserves the intended corporate identity and is clearer for readers unfamiliar with tribal formulas.
