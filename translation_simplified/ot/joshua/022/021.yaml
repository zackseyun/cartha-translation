  reasoning_layer_used: POB lexical decisions for בְּנֵי רְאוּבֵן and וּבְנֵי גָד
  rationale: “Descendants” preserves the genealogical relationship while avoiding a misleading reference only to immediate sons.
- pob_phrase: answered and spoke to
  simplified_phrase: 'answered ... They said:'
  preserved_meaning: Both the response and the act of speaking remain explicit.
  reasoning_layer_used: POB lexical decisions for וַיַּעֲנוּ and וַיְדַבְּרוּ
  rationale: Two short sentences preserve both Hebrew verbs in natural English.
- pob_phrase: the heads of the clans of Israel
  simplified_phrase: the leaders of Israel’s clans
  preserved_meaning: The addressees are the leaders of Israel’s clan divisions.
  reasoning_layer_used: POB lexical decision for אֶת רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  rationale: “Leaders” is clearer than the figurative title “heads” without changing their role.
