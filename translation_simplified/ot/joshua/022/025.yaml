translation:
  language: en
  text: For Yahweh has made the Jordan River a boundary between us and you, descendants of Reuben and Gad. You have no part in Yahweh.[a] So your children might make our children stop fearing Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “You have no share in Yahweh.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the Jordan
  simplified_phrase: the Jordan River
  preserved_meaning: The Jordan itself forms the dividing boundary.
  reasoning_layer_used: POB lexical decision for אֶת הַיַּרְדֵּן
  rationale: Adding “River” identifies the geographic feature without changing its name.
- pob_phrase: sons of Reuben and sons of Gad
  simplified_phrase: descendants of Reuben and Gad
  preserved_meaning: The phrase identifies the tribal peoples descended from Reuben and Gad.
  reasoning_layer_used: POB lexical decision for בְּנֵי רְאוּבֵן וּבְנֵי גָד
  rationale: “Descendants” makes the tribal identity clear to modern readers.
- pob_phrase: You have no portion in Yahweh
  simplified_phrase: You have no part in Yahweh
  preserved_meaning: The accusation denies their participation in Yahweh and his covenant people.
  reasoning_layer_used: POB lexical rationale for חֵלֶק and theological decision on יְהוָה
  rationale: “Part” is clearer than “portion” while preserving the participatory sense and Yahweh’s name.
translation_notes:
  risk_flags:
  - risk: “No part in Yahweh” may remain unfamiliar as a covenant expression.
    mitigation: The footnote gives “no share in Yahweh” without narrowing the expression.
