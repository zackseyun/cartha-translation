translation:
  language: en
  text: The tribes of Reuben and Gad named the altar Witness,[a] because it is a witness between us that Yahweh is God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The explanation may instead be part of the altar’s full name: “A Witness Between Us That Yahweh Is God.”'
