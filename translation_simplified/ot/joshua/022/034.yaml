simplification_decisions:
- pob_phrase: the sons of Reuben and the sons of Gad
  simplified_phrase: the tribes of Reuben and Gad
  preserved_meaning: The descendants of Reuben and Gad are the groups who named the altar.
  reasoning_layer_used: POB lexical decision and narrative context
  rationale: “The tribes of” identifies these corporate groups more clearly than the literal family expression.
- pob_phrase: called the altar Witness
  simplified_phrase: named the altar Witness
  preserved_meaning: Witness is presented as the altar’s name.
  reasoning_layer_used: POB lexical decision for וַיִּקְרְאוּ and עֵד
  rationale: “Named” makes the naming function immediately clear while retaining the attested name.
- pob_phrase: for it is a witness between us that Yahweh is God
  simplified_phrase: because it is a witness between us that Yahweh is God
  preserved_meaning: The altar testifies between the tribes to their shared confession that Yahweh is God.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Because” plainly marks the clause as the narrator’s explanation for the name.
translation_notes:
  risk_flags:
  - risk: “The tribes of” is less formally transparent than “the sons of.”
    mitigation: It preserves the contextual reference to the Reubenite and Gadite descendant groups.
  - risk: The explanatory clause may function as the altar’s full name.
    mitigation: Footnote [a] preserves this alternative while the main text follows the POB decision.
