translation:
  language: en
  text: Now Yahweh your God has given your fellow Israelites rest from conflict, just as he told them. So turn and go back to your tents in the land that belongs to you—the land Moses, Yahweh’s servant, gave you across the Jordan.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: your brothers
  simplified_phrase: your fellow Israelites
  preserved_meaning: The people addressed are fellow members of Israel, viewed as covenant kin.
  reasoning_layer_used: POB footnote b and lexical decision for לַאֲחֵיכֶם
  rationale: The clearer wording prevents readers from mistaking them for literal siblings.
- pob_phrase: turn and go to your tents
  simplified_phrase: turn and go back to your tents
  preserved_meaning: They are commanded to leave their present location and return to their dwellings.
  reasoning_layer_used: POB lexical decisions for פְּנוּ and לְאָהֳלֵיכֶם
  rationale: “Go back” clarifies the direction while retaining the historical image of tents.
- pob_phrase: to the land of your possession
  simplified_phrase: in the land that belongs to you
  preserved_meaning: The land is their established holding.
  reasoning_layer_used: POB lexical decision for אֶרֶץ אֲחֻזַּתְכֶם
  rationale: The rewrite expresses land possession in ordinary English without importing “inheritance.”
