translation:
  language: en
  text: But if the land you possess is unclean,[a] cross over into the land that belongs to Yahweh, where Yahweh’s Tabernacle is, and take possession of land among us. But do not rebel against Yahweh or against us by building an altar of your own besides the altar of Yahweh our God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The verse does not explain in what sense their land might be unclean.
    reason: simplification_note
simplification_decisions:
- pob_phrase: the land of your possession ... the land of Yahweh’s possession
  simplified_phrase: the land you possess ... the land that belongs to Yahweh
  preserved_meaning: The contrast between their territory and land belonging to Yahweh remains clear.
  reasoning_layer_used: POB lexical decisions
  rationale: Direct clauses replace the abstract possession phrases while preserving their deliberate contrast.
- pob_phrase: where Yahweh’s tabernacle dwells
  simplified_phrase: where Yahweh’s Tabernacle is
  preserved_meaning: Yahweh’s Tabernacle is located in the land to which they are invited.
  reasoning_layer_used: POB lexical decision and grounding review
  rationale: The natural locative wording communicates the point without the awkward image of a structure dwelling.
- pob_phrase: cross over for yourselves ... and take possession among us
  simplified_phrase: cross over ... and take possession of land among us
  preserved_meaning: They are invited to relocate and obtain a landholding among the western tribes.
  reasoning_layer_used: POB lexical decisions and immediate context
  rationale: The wording states the practical offer clearly while retaining the land-tenure sense.
translation_notes:
  risk_flags:
  - risk: Modern readers may assume “unclean” has one precise ritual meaning.
    mitigation: The footnote preserves the POB decision not to define the kind of uncleanness.
  - risk: “Where Yahweh’s Tabernacle is” does not reproduce the Hebrew dwelling word directly.
    mitigation: It preserves the clause’s locative meaning while the retained term “Tabernacle” carries the dwelling-place concept.
