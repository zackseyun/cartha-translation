translation:
  language: en
  text: If we built an altar for ourselves to turn away from following Yahweh, or if we built it to offer a burnt offering or a grain offering on it, or if we built it to sacrifice peace offerings on it, may Yahweh himself call us to account for it.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: or if to offer on it burnt offering or grain offering
  simplified_phrase: or if we built it to offer a burnt offering or a grain offering on it
  preserved_meaning: The oath separately denies that they built the altar for either kind of offering.
  reasoning_layer_used: POB lexical decisions and the reviewed conditional structure
  rationale: Supplying “we built it” preserves the repeated condition in natural English.
- pob_phrase: or if to make on it sacrifices of peace offerings
  simplified_phrase: or if we built it to sacrifice peace offerings on it
  preserved_meaning: The oath separately denies that they built the altar for peace offerings.
  reasoning_layer_used: POB lexical decision for זִבְחֵי שְׁלָמִים and the reviewed conditional structure
  rationale: The ordinary verb “sacrifice” keeps the distinct offering category and restores the repeated condition.
- pob_phrase: may Yahweh himself require it
  simplified_phrase: may Yahweh himself call us to account for it
  preserved_meaning: They invoke Yahweh’s judgment if their denial is false.
  reasoning_layer_used: POB lexical and theological decisions for יְהוָה הוּא יְבַקֵּשׁ
  rationale: The clearer judicial wording preserves the oath’s self-condemning force.
