translation:
  language: en
  text: We would never rebel against Yahweh or turn away from following him today by building another altar for burnt offerings, grain offerings, or sacrifices besides the altar of Yahweh our God, which is in front of his tabernacle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The tabernacle was the sacred tent sanctuary where Yahweh lived among Israel.
    reason: cultural_note
