- pob_phrase: And you shall command the priests who carry
  simplified_phrase: Then command the priests carrying
  preserved_meaning: Joshua is directly instructed to command the priests who bear the ark.
  reasoning_layer_used: POB lexical decisions for וְאַתָּה, תְּצַוֶּה, and נֹשְׂאֵי
