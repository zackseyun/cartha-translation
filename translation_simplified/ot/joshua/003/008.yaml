  reasoning_layer_used: POB lexical decisions for עַד קְצֵה מֵי הַיַּרְדֵּן and בַּיַּרְדֵּן
  rationale: Naming the Jordan as a river removes an opaque Hebrew-style construction.
- pob_phrase: you shall stand in the Jordan
