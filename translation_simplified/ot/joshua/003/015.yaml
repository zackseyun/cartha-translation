translation:
  language: en
  text: When the priests carrying the ark reached the Jordan, their feet dipped into the water at its edge. (Throughout harvest season, the Jordan overflowed all its banks.)
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: those carrying the ark came as far as the Jordan
  simplified_phrase: the priests carrying the ark reached the Jordan
  preserved_meaning: The ark-bearers arrived at the river, and the context identifies them as priests.
  reasoning_layer_used: Lexical decisions for עַד הַיַּרְדֵּן and נֹשְׂאֵי הָאָרוֹן
  rationale: “Reached” expresses arrival at the river more directly, while “priests carrying the ark” removes cumbersome repetition.
- pob_phrase: the feet of the priests carrying the ark were dipped in the edge of the water
  simplified_phrase: their feet dipped into the water at its edge
  preserved_meaning: The priests’ feet actually entered the water at the river’s margin.
  reasoning_layer_used: Lexical decisions for נִטְבְּלוּ and בִּקְצֵה הַמָּיִם
  rationale: “Dipped into” keeps the physical entry expressed by the Hebrew while using natural English.
- pob_phrase: the Jordan was full over all its banks all the days of harvest
  simplified_phrase: Throughout harvest season, the Jordan overflowed all its banks
  preserved_meaning: The river was at flood stage across its banks during the harvest period.
  reasoning_layer_used: Lexical decisions for מָלֵא עַל כָּל גְּדוֹתָיו and כֹּל יְמֵי קָצִיר, with footnote b
  rationale: The revised wording states the flood condition and time period in clear modern English.
translation_notes:
  risk_flags:
  - risk: Combining the two references to the ark-carriers may reduce the Hebrew repetition.
    mitigation: The text still clearly identifies the priests as the people carrying the ark.
