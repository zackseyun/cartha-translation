translation:
  language: en
  text: 'They gave the people this command: “When you see the Levitical priests[a] carrying the ark of the covenant of Yahweh your God, leave where you are and follow it.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the priests, the Levites.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And they commanded the people, saying
  simplified_phrase: They gave the people this command
  preserved_meaning: The leaders authoritatively instructed the assembled Israelites.
  reasoning_layer_used: Lexical decision for וַיְצַוּוּ and discourse function of לֵאמֹר.
  rationale: This removes a Hebrew speech formula while retaining the command’s authority.
- pob_phrase: you shall set out from your place
  simplified_phrase: leave where you are
  preserved_meaning: The people must depart from their current location.
  reasoning_layer_used: Lexical decisions for תִּסְעוּ and מִמְּקוֹמְכֶם.
  rationale: The modern wording conveys movement without adding the narrower idea of breaking camp.
- pob_phrase: go after it
  simplified_phrase: follow it
  preserved_meaning: The people must move behind the covenant ark.
  reasoning_layer_used: Lexical decision for וַהֲלַכְתֶּם אַחֲרָיו.
  rationale: “Follow it” states the same spatial action in more natural English.
translation_notes:
  risk_flags:
  - risk: “Ark of the covenant” may be unfamiliar to new readers.
    mitigation: The established biblical term is retained because replacing it could obscure a key covenant object.
  - risk: “Levitical priests” may hide the Hebrew appositional form.
    mitigation: The lexical alternative is preserved in a footnote.
