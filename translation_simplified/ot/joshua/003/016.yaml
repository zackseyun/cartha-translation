translation:
  language: en
  text: The water flowing down from upstream stopped and piled up in a single heap very far away, at the town of Adam beside Zarethan. The water flowing toward the Sea of the Arabah—the Salt Sea[a]—was completely cut off. Then the people crossed opposite Jericho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Salt Sea was later commonly called the Dead Sea.
    reason: cultural_note
simplification_decisions:
- pob_phrase: the waters flowing down from above stood still; they rose up in one heap
  simplified_phrase: The water flowing down from upstream stopped and piled up in a single heap
  preserved_meaning: The upstream flow stopped and formed one piled barrier of water.
  reasoning_layer_used: POB lexical decisions for ירדים, עמד, and קום + נֵד
  rationale: This uses ordinary river language while preserving both the stoppage and the concrete heap image.
- pob_phrase: at Adam, the city beside Zarethan
  simplified_phrase: at the town of Adam beside Zarethan
  preserved_meaning: Adam is a place located beside Zarethan.
  reasoning_layer_used: POB lexical decisions for בְאָדָם and מִצַּד
  rationale: Calling Adam a town immediately prevents readers from mistaking it for the person.
- pob_phrase: And those flowing down toward the Sea of the Arabah, the Salt Sea, were completely cut off
  simplified_phrase: The water flowing toward the Sea of the Arabah—the Salt Sea—was completely cut off
  preserved_meaning: The downstream flow toward the Salt Sea ceased entirely.
  reasoning_layer_used: POB lexical decisions for the resumed participle and paired verbs
  rationale: The explicit noun and separate sentence clarify the downstream result without weakening its totality.
translation_notes:
  risk_flags:
  - risk: “Stopped and piled up” could be read as two loosely related events.
    mitigation: “In a single heap” keeps the stoppage tied to the piled-water barrier.
