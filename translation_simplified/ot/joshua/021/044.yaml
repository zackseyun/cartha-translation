translation:
  language: en
  text: Yahweh gave them rest on every side. He fulfilled everything he had sworn to their fathers. Not one man among all their enemies could stand against them. Yahweh handed all their enemies over to their power.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “gave all their enemies into their hand,” an image meaning that Yahweh placed the enemies under their power.
    reason: simplification_note
simplification_decisions:
- pob_phrase: according to all that he had sworn to their fathers
  simplified_phrase: He fulfilled everything he had sworn to their fathers.
  preserved_meaning: Yahweh completely carried out his oath to Israel’s fathers.
  reasoning_layer_used: lexical decision for כְּכֹל אֲשֶׁר נִשְׁבַּע
  rationale: The separate active sentence makes the exact fulfillment easier to grasp.
- pob_phrase: Not one man from all their enemies stood before them
  simplified_phrase: Not one man among all their enemies could stand against them.
  preserved_meaning: No single male opponent could successfully resist Israel.
  reasoning_layer_used: lexical decisions for וְלֹא עָמַד אִישׁ בִּפְנֵיהֶם and אִישׁ
  rationale: “Stand against” keeps the Hebrew image while clearly expressing successful resistance.
- pob_phrase: gave all their enemies into their hand
  simplified_phrase: handed all their enemies over to their power
  preserved_meaning: Yahweh granted Israel complete power over its enemies.
  reasoning_layer_used: lexical decision for נָתַן ... בְּיָדָם
  rationale: “Handed over” echoes the original image while stating the idiom’s meaning naturally.
translation_notes:
  risk_flags:
  - risk: “Fulfilled” states the oath’s completion more directly than the POB wording.
    mitigation: The Hebrew phrase and POB rationale explicitly emphasize exact fulfillment.
  - risk: Rendering “into their hand” as “to their power” reduces the visible Hebrew image.
    mitigation: “Handed over” preserves part of the image, and the footnote gives the literal wording.
