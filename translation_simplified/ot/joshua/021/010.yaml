- pob_phrase: from the families of the Kohathites, from the sons of Levi
  simplified_phrase: They came from the Kohathite families among Levi’s descendants
  preserved_meaning: Aaron’s descendants belonged to the Kohathite division within Levi’s broader line.
  reasoning_layer_used: The lexical decisions preserve both the Kohathite family grouping and its descent from Levi.
  rationale: A separate sentence makes the nested genealogy easier to follow.
- pob_phrase: because the first lot was for them
  simplified_phrase: The first allotment, decided by lot, went to Aaron’s descendants
  preserved_meaning: Aaron’s line received the first allocation in the sequence determined by lot.
