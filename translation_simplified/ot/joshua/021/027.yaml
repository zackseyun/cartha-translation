translation:
  language: en
  text: 'The Israelites gave the descendants of Gershon, who belonged to the Levite clans, two cities from the half-tribe of Manasseh: Golan in Bashan, a city of refuge for someone who had killed a person, together with its pasturelands, and Beeshterah[a] with its pasturelands.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew Beeshterah; 1 Chronicles 6:71 has Ashtaroth.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And to the sons of Gershon, from the clans of the Levites, from the half-tribe of Manasseh, they gave
  simplified_phrase: The Israelites gave the descendants of Gershon, who belonged to the Levite clans, two cities from the half-tribe of Manasseh
  preserved_meaning: Israel allotted Gershon’s Levitical descendants two cities located in Manasseh’s half-tribe.
  reasoning_layer_used: lexical decisions, implicit allotment formula, and immediate context
  rationale: The reordered sentence clearly distinguishes the givers, recipients, and territorial source.
- pob_phrase: the city of refuge for the manslayer
  simplified_phrase: a city of refuge for someone who had killed a person
  preserved_meaning: Golan provided legal refuge for a person responsible for a death.
  reasoning_layer_used: lexical decision for עִיר מִקְלַט הָרֹצֵחַ
  rationale: This explains “manslayer” without claiming that the killing was intentional.
- pob_phrase: with its pasturelands ... with its pasturelands—two cities
  simplified_phrase: two cities ... together with its pasturelands ... with its pasturelands
  preserved_meaning: The grant comprised two cities and the grazing lands belonging to each.
  reasoning_layer_used: lexical decisions for מִגְרָשֶׁהָ and עָרִים שְׁתָּיִם
  rationale: Stating the total before the list makes the allocation easier to follow.
interpretive_expansions:
- pob_phrase: they gave
  rendering: The Israelites gave
  claim: The unstated plural givers are identified as the Israelites.
  evidence:
  - Joshua 21:3 identifies the Israelites as those who gave cities to the Levites.
  - The chapter’s allotment formula supplies the otherwise implicit giver.
  confidence: high
  alternatives_preserved:
  - they gave
translation_notes:
  risk_flags:
  - risk: Naming the Israelites makes an implicit subject explicit.
    mitigation: The immediate chapter context directly identifies them as the givers.
  - risk: Readers may assume every killing covered by a city of refuge was deliberate.
    mitigation: The neutral wording does not specify intent.
