translation:
  language: en
  text: So they gave them Kiriath-arba, also called Hebron, in the hill country of Judah, together with its surrounding pasturelands. Arba was the father of Anak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Arba was an ancestor of Anak.” The Hebrew may refer to a father or a more distant ancestor.
    reason: lexical_alternative
