  text: Then the Levite family leaders—the heads of their fathers’ houses[a]—approached Eleazar the priest, Joshua son of Nun, and the family-group leaders of the tribes of Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Fathers’ houses” were extended family groups organized under paternal leadership.
    reason: cultural_note
  - marker: b
    text: The Hebrew literally says “sons of Israel,” meaning the Israelites.
    reason: lexical_alternative
