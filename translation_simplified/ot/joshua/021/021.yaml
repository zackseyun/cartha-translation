translation:
  language: en
  text: They gave the Levites Shechem and its pasturelands in the hill country of Ephraim. Shechem was a city of refuge, where a person who had caused a death could flee for protection until the case was judged.[a] They also gave them Gezer and its pasturelands.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term refers to someone who killed a person; it does not by itself mean a convicted murderer.
    reason: lexical_alternative
