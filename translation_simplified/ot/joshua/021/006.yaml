  text: Gershon’s descendants received thirteen cities by lot. These cities came from the family groups[a] of the tribe of Issachar, the tribe of Asher, the tribe of Naphtali, and the half-tribe of Manasseh in Bashan.
  philosophy: optimal-equivalence
