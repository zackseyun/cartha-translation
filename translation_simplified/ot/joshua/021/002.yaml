translation:
  language: en
  text: At Shiloh in the land of Canaan, they said to them, “Yahweh commanded through Moses that we be given cities to live in, together with pasturelands for our livestock.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And they spoke to them at Shiloh in the land of Canaan, saying
  simplified_phrase: At Shiloh in the land of Canaan, they said to them
  preserved_meaning: They addressed the same people at the same location and introduced their request.
  reasoning_layer_used: POB lexical decisions for וַיְדַבְּרוּ, אֲלֵיהֶם, and לֵאמֹר
  rationale: The ordinary speech formula replaces the awkward combination of “spoke” and “saying.”
- pob_phrase: commanded through Moses to give us
  simplified_phrase: commanded through Moses that we be given
  preserved_meaning: Yahweh issued the command, with Moses serving as its mediator.
  reasoning_layer_used: POB lexical decision for בְיַד מֹשֶׁה and theological decision for יְהוָה
  rationale: The passive clause makes the command natural in English without supplying an unnamed giver.
- pob_phrase: cities to dwell in, along with their pasturelands
  simplified_phrase: cities to live in, together with pasturelands
  preserved_meaning: The requested allotment includes residences and grazing land.
  reasoning_layer_used: POB lexical decisions for לָשָׁבֶת and וּמִגְרְשֵׁיהֶן
  rationale: “Live in” is clearer than “dwell in,” while “pasturelands” retains the land’s practical use.
