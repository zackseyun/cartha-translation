translation:
  language: en
  text: They gave Aaron the priest’s sons Hebron,[a] the city of refuge for someone who had caused a person’s death, along with its pasturelands. They also gave them Libnah and its pasturelands.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses a legal term for someone who has killed a person and may flee to a city of refuge; it does not necessarily mean a premeditated murderer.
    reason: lexical_alternative
