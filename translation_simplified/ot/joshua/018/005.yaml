- pob_phrase: shall remain at its border
  simplified_phrase: will keep its existing territory
  preserved_meaning: Judah’s established territorial boundaries are to remain unchanged.
  reasoning_layer_used: POB lexical rationale and doctrine-realignment revision
  rationale: The clearer wording states the territorial sense that POB assigns to the Hebrew image of standing.
- pob_phrase: shall remain at their border
