translation:
  language: en
  text: The Levites will not receive a tribal share of land among you, because Yahweh’s priestly service is their inheritance. Gad, Reuben, and half the tribe of Manasseh have already received their inheritance east of the Jordan. Moses, Yahweh’s servant, gave it to them.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: there is no portion for the Levites among you
  simplified_phrase: The Levites will not receive a tribal share of land among you
  preserved_meaning: The Levites have no share in the tribal land allotment.
  reasoning_layer_used: Lexical decision for חֵלֶק and the land-allotment context
  rationale: “Tribal share of land” avoids implying that the Levites could possess no land at all.
- pob_phrase: the priesthood of Yahweh is their inheritance
  simplified_phrase: Yahweh’s priestly service is their inheritance
  preserved_meaning: The priestly service belonging to Yahweh is the Levites’ inheritance.
  reasoning_layer_used: Lexical decision for כְהֻנַּת יְהוָה and theological decision for Yahweh
  rationale: This keeps the institutional meaning without implying that every Levite is a priest.
- pob_phrase: beyond the Jordan eastward, which Moses the servant of Yahweh gave them
  simplified_phrase: east of the Jordan. Moses, Yahweh’s servant, gave it to them.
  preserved_meaning: Their inheritance was on the Jordan’s eastern side and was given through Moses.
  reasoning_layer_used: Geographic and honorific-title lexical decisions
  rationale: Two direct sentences clarify the location and who gave the inheritance.
interpretive_expansions:
- pob_phrase: no portion
  rendering: will not receive a tribal share of land
  claim: The denied portion is a share in the tribal territory being allotted.
  evidence:
  - The verse contrasts the Levites with tribes that received territorial inheritances.
  - The POB lexical rationale identifies a land-allotment context.
  confidence: high
  alternatives_preserved:
  - no share in the tribal land
  - no tribal land allotment
translation_notes:
  risk_flags:
  - risk: “Priestly service” may be less familiar than a verbal description of what the Levites do.
    mitigation: The institutional wording preserves the distinction between priests and other Levites.
  - risk: “Tribal share of land” makes the contextual object more explicit than the Hebrew noun “portion.”
    mitigation: The wording limits the denial to the territorial allotment contrasted in this verse.
