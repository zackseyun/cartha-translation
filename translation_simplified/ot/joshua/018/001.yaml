translation:
  language: en
  text: Then the whole community of the sons of Israel[a] assembled at Shiloh. They set up the tent of meeting there, and the land lay subdued before them—under their control.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Israelites,” or traditionally “the children of Israel.” The Hebrew literally says “the sons of Israel.”
    reason: lexical_alternative
  - marker: b
    text: Or “the land was conquered before them.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the whole congregation of the sons of Israel
  simplified_phrase: the whole community of the sons of Israel
  preserved_meaning: Israel is presented as one assembled covenant community, while the masculine Hebrew designation remains visible.
  reasoning_layer_used: POB lexical and theological decisions on עֲדָה and בְּנֵי יִשְׂרָאֵל
  rationale: “Community” is clearer than “congregation” here without reducing the formal corporate sense.
- pob_phrase: assembled at Shiloh and set up the tent of meeting there
  simplified_phrase: assembled at Shiloh. They set up the tent of meeting there
  preserved_meaning: The community gathered at Shiloh and established the sacred tent at that location.
  reasoning_layer_used: POB lexical decisions on וַיִּקָּהֲלוּ, וַיַּשְׁכִּינוּ, and אֹהֶל מוֹעֵד
  rationale: Splitting the clause into two sentences makes the sequence easier to follow.
- pob_phrase: the land was subdued before them
  simplified_phrase: the land lay subdued before them—under their control
  preserved_meaning: The land had been brought into subjection to Israel without claiming that every area was fully conquered.
  reasoning_layer_used: POB lexical and theological decisions on נִכְבְּשָׁה and לִפְנֵיהֶם
  rationale: The added plain-language phrase explains the Hebrew image while retaining it.
interpretive_expansions:
- pob_phrase: the land was subdued before them
  rendering: the land lay subdued before them—under their control
  claim: Being subdued before Israel means that the land was under Israel’s control.
  evidence:
  - The POB lexical rationale says the passive verb indicates that the land had been brought under Israel’s control.
  - The POB rationale for “before them” says the idiom depicts the land as lying subdued before Israel.
  confidence: high
  alternatives_preserved:
  - the land was conquered before them
translation_notes:
  risk_flags:
  - risk: “Under their control” could be mistaken for a claim that every part of the land had been conquered.
    mitigation: “Lay subdued” and footnote b preserve the POB’s restrained wording and its distinction from total conquest.
  - risk: “Sons of Israel” may sound unfamiliar to modern readers.
    mitigation: Footnote a supplies the clearer alternative “the Israelites” while preserving the POB’s source-driven designation.
