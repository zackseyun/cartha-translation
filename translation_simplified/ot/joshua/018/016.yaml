translation:
  language: en
  text: The border then went down to the end of the mountain facing the Valley of Ben-hinnom. This mountain is at the northern end of the Valley of Rephaim. From there, the border continued down through the Valley of Hinnom to the southern slope of the Jebusite settlement,[a] and then down to En-rogel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew says “the Jebusite,” likely referring to the Jebusite settlement—that is, Jerusalem; it may also be rendered “the southern side of the Jebusite.”
    reason: lexical_alternative
