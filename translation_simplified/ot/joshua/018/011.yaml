translation:
  language: en
  text: The lot came up for the tribe of Benjamin, according to its clans. The territory[a] assigned by that lot lay between the people of Judah and the descendants of Joseph.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the boundary of their allotment.”
    reason: lexical_alternative
  - marker: b
    text: The descendants of Joseph here are the tribes descended from him, especially Ephraim and Manasseh.
    reason: cultural_note
