translation:
  language: en
  text: Just as every good thing Yahweh your God said would happen to you has happened, Yahweh will bring on you every bad thing he said would happen.[a] He will do this until he has destroyed you from this good land that Yahweh your God has given you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says “every bad word” or “matter,” matching the “good thing” God had spoken earlier.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And it shall happen that, just as every good word ... has come upon you
  simplified_phrase: Just as every good thing ... said would happen to you has happened
  preserved_meaning: All the good Yahweh spoke has been fulfilled and establishes the comparison with coming judgment.
  reasoning_layer_used: Lexical decisions for וְהָיָה, כַּאֲשֶׁר, and כָּל הַדָּבָר הַטּוֹב
  rationale: The rewrite removes the formal opening and expresses fulfilled speech in natural English.
- pob_phrase: will bring upon you every bad word
  simplified_phrase: will bring on you every bad thing he said would happen
  preserved_meaning: Yahweh will fulfill his adverse words just as surely as his good words.
  reasoning_layer_used: Lexical and theological decisions for כָּל הַדָּבָר הָרָע
  rationale: The wording keeps both the spoken-word connection and the resulting judgment.
- pob_phrase: until he has destroyed you from off this good land
  simplified_phrase: until he has destroyed you from this good land
  preserved_meaning: The judgment ends in their destruction from the land Yahweh gave them.
  reasoning_layer_used: Lexical decisions for עַד הַשְׁמִידוֹ אֹתְכֶם and מֵעַל
  rationale: Removing “off” makes the spatial phrase readable without adding a separate removal action.
