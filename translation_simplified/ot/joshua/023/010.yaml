translation:
  language: en
  text: One man among you will chase a thousand. This will happen because Yahweh your God fights for you, just as he told you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “just as he promised you.” The Hebrew more literally says, “just as he spoke to you.”
