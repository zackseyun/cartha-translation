  preserved_meaning: A single representative man from Israel is in view.
  reasoning_layer_used: POB lexical and theological decisions on אִישׁ אֶחָד and מִכֶּם
  rationale: Removing “from” makes the partitive phrase natural without neutralizing its masculine form.
- pob_phrase: because Yahweh your God is the one who fights for you
  simplified_phrase: This will happen because Yahweh your God fights for you
  preserved_meaning: Israel’s extraordinary victory comes from Yahweh fighting on their behalf.
  reasoning_layer_used: POB lexical decisions on כִּי, הוּא, and הַנִּלְחָם לָכֶם
  rationale: Two sentences clarify the cause while preserving Yahweh’s emphasized role.
