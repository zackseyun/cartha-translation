  text: Therefore, be very firm in following and carrying out everything written in the Book of the Law of Moses.[a] Do not turn away from it either to the right or to the left.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “Law” can also mean “instruction,” but here it refers to the body of law given through Moses.
    reason: lexical_alternative
