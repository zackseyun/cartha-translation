translation:
  language: en
  text: 'See what I have done: I have assigned to your tribes, as their inheritance, the territory of these nations that still remain, along with the territory of all the nations I have cut off. This land extends from the Jordan River to the Great Sea—the Mediterranean—in the west, where the sun sets.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: See, I have allotted to you
  simplified_phrase: 'See what I have done: I have assigned to your tribes'
  preserved_meaning: Joshua emphatically directs attention to his completed assignment of territory.
  reasoning_layer_used: The lexical decisions identify “See” as emphatic and “allotted” as assignment by lot.
  rationale: The recast opening is more natural while retaining the command and completed action.
- pob_phrase: as an inheritance for your tribes
  simplified_phrase: to your tribes, as their inheritance, the territory
  preserved_meaning: Each tribe receives territorial possession as its inheritance.
  reasoning_layer_used: The lexical rationale defines the inheritance as inherited territorial possession.
  rationale: Naming the territory makes the object of the allotment immediately clear.
- pob_phrase: from the Jordan ... to the Great Sea toward the going down of the sun
  simplified_phrase: from the Jordan River to the Great Sea—the Mediterranean—in the west, where the sun sets
  preserved_meaning: The boundaries run westward from the Jordan to the sea while retaining the sunset image.
  reasoning_layer_used: The lexical decisions treat the wording as a boundary span and the sunset phrase as an idiom for west.
  rationale: The modern names and sentence order clarify the geography without losing the Hebrew image.
