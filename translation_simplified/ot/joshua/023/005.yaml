translation:
  language: en
  text: Yahweh your God himself will drive them away from you and make them lose possession of their land. You will take possession of their land,[a] just as Yahweh your God told you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “inherit their land.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: drive them out from before you
  simplified_phrase: drive them away from you
  preserved_meaning: Yahweh will force the nations out of Israel’s presence.
  reasoning_layer_used: Lexical decisions for יֶהְדֳּפֵם and מִפְּנֵיכֶם
  rationale: This keeps the forceful removal while replacing an unnatural spatial idiom.
- pob_phrase: dispossess them from before you
  simplified_phrase: make them lose possession of their land
  preserved_meaning: Yahweh will cause the current occupants to lose possession of the land.
  reasoning_layer_used: Lexical and theological decisions for וְהוֹרִישׁ אֹתָם
  rationale: This explains dispossession plainly while retaining the nations as those Yahweh acts upon.
- pob_phrase: just as Yahweh your God spoke to you
  simplified_phrase: just as Yahweh your God told you
  preserved_meaning: Israel’s possession will accord with Yahweh’s prior words.
  reasoning_layer_used: Lexical decisions for כַּאֲשֶׁר דִּבֶּר and לָכֶם
  rationale: “Told you” is natural English without changing “spoke” into the more interpretive “promised.”
translation_notes:
  risk_flags:
  - risk: “Make them lose possession” explains rather than retains the legal term “dispossess.”
    mitigation: The wording preserves Yahweh’s causative action and the contrast with Israel taking possession.
