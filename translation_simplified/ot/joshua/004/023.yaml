translation:
  language: en
  text: 'Yahweh your God dried up the water of the Jordan River in front of you until you had crossed it. He did the same to the Sea of Reeds[a]: he dried it up in front of us until we had crossed it.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally called “the Red Sea.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the waters of the Jordan
  simplified_phrase: the water of the Jordan River
  preserved_meaning: Yahweh removed the river’s water so Israel could cross.
  reasoning_layer_used: Lexical decisions for מֵי הַיַּרְדֵּן and הוֹבִישׁ
  rationale: Naming the Jordan as a river helps unfamiliar readers while preserving the concrete image of dried water.
- pob_phrase: before you
  simplified_phrase: in front of you
  preserved_meaning: The water was dried up ahead of the people as they crossed.
  reasoning_layer_used: Lexical decisions for מִפְּנֵיכֶם and מִפָּנֵינוּ
  rationale: “In front of” expresses the Hebrew spatial idiom in common English.
- pob_phrase: just as Yahweh your God did to the Sea of Reeds, which he dried up before us until we crossed over
  simplified_phrase: 'He did the same to the Sea of Reeds: he dried it up in front of us until we had crossed it.'
  preserved_meaning: The Jordan crossing parallels Yahweh’s earlier drying of the sea for Israel.
  reasoning_layer_used: Lexical decisions for כַּאֲשֶׁר עָשָׂה, הוֹבִישׁ, and עַד עָבְרֵנוּ
  rationale: The colon clarifies the repeated action while retaining the sea as its object.
