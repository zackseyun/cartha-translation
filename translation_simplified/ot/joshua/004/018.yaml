  reasoning_layer_used: lexical and theological decisions
  rationale: The shorter possessive form keeps Yahweh’s personal name and the covenant relationship clear.
- pob_phrase: the soles of the priests’ feet were lifted up to the dry ground
  simplified_phrase: stepped onto dry ground
  preserved_meaning: The priests moved their feet out of the riverbed onto dry land.
  reasoning_layer_used: lexical decision for נִתְּקוּ and immediate context
  rationale: The active wording expresses the same physical movement in ordinary English.
- pob_phrase: went as before over all its banks
  simplified_phrase: flowed over all its banks as before
  preserved_meaning: The Jordan resumed its former overflowing course.
  reasoning_layer_used: lexical alternatives and cross-check rationale
