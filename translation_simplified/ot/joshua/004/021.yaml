  preserved_meaning: Joshua addresses the covenant community of Israel.
  reasoning_layer_used: POB lexical decision and its listed alternative “the Israelites”
  rationale: This replaces an unfamiliar literal expression with clear communal language.
- pob_phrase: in time to come
  simplified_phrase: in the future
  preserved_meaning: The question will be asked at a later time, not necessarily the next day.
  reasoning_layer_used: POB lexical rationale for the idiomatic use of Hebrew “tomorrow”
  rationale: The simpler phrase clearly conveys the intended future setting.
- pob_phrase: ask their fathers in time to come, saying
  simplified_phrase: ask their fathers in the future
  preserved_meaning: The clause establishes the future occasion when children directly ask about the stones.
  reasoning_layer_used: POB decisions for “When” and the second speech introducer
  rationale: Keeping “When” preserves the occasion-setting force, while quotation marks make “saying” unnecessary.
