translation:
  language: en
  text: Joshua told them, “Go in front of the ark of Yahweh your God into the middle of the Jordan. Each man must lift one stone onto his shoulder—one stone for each tribe of the sons of Israel.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The sons of Israel” is the formal Hebrew covenant name for the people of Israel.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And Joshua said to them
  simplified_phrase: Joshua told them
  preserved_meaning: Joshua addressed the selected men and gave them instructions.
  reasoning_layer_used: Lexical decision for וַיֹּאמֶר and immediate context
  rationale: “Told them” naturally introduces the command without changing the narrative action.
- pob_phrase: Cross over before the ark ... into the middle of the Jordan
  simplified_phrase: Go in front of the ark ... into the middle of the Jordan
  preserved_meaning: The men must move ahead of the ark into the river’s middle as one commanded route.
  reasoning_layer_used: Lexical decisions for עִבְרוּ, לִפְנֵי, and אֶל תּוֹךְ הַיַּרְדֵּן
  rationale: One movement expression avoids implying that they cross the river before entering its middle.
- pob_phrase: let each man lift up one stone on his shoulder, according to the number of the tribes
  simplified_phrase: Each man must lift one stone onto his shoulder—one stone for each tribe
  preserved_meaning: Each male representative carries one stone, with the total matching the tribes.
