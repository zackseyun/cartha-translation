translation:
  language: en
  text: 'Command them: ‘Pick up twelve stones for yourselves from this very place in the middle of the Jordan, where the priests stood with their feet firmly planted. Carry the stones across with you, and put them down where you will stay tonight.’'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: and command them, saying
  simplified_phrase: 'Command them:'
  preserved_meaning: Joshua must give the twelve men a direct command.
  reasoning_layer_used: POB lexical decision for וְצַוּוּ
  rationale: Direct speech makes “saying” unnecessary while retaining the command’s force.
- pob_phrase: Take up for yourselves from here, from the midst of the Jordan
  simplified_phrase: Pick up twelve stones for yourselves from this very place in the middle of the Jordan
  preserved_meaning: The men must lift the stones from the specified place within the river.
  reasoning_layer_used: POB lexical decisions for שְׂאוּ, לָכֶם, and מִזֶּה מִתּוֹךְ הַיַּרְדֵּן
  rationale: The reordered wording is natural English and keeps both the lifting action and the location’s vivid specificity.
- pob_phrase: from the place where the priests’ feet stood firm ... and set them down at the lodging place where you will spend the night
  simplified_phrase: where the priests stood with their feet firmly planted ... and put them down where you will stay tonight
  preserved_meaning: The stones come from the priests’ firm standing place and are deposited at Israel’s overnight stop.
  reasoning_layer_used: POB lexical decisions for מִמַּצַּב רַגְלֵי הַכֹּהֲנִים, הָכִין, וְהִנַּחְתֶּם, and בַּמָּלוֹן
  rationale: Concrete modern wording preserves the image of stable footing and clarifies that the lodging place is only an overnight stop.
translation_notes:
  risk_flags:
  - risk: “For yourselves” could be mistaken as implying private ownership of the stones.
    mitigation: The shared commands to carry and deposit them keep the phrase focused on personal participation.
