translation:
  language: en
  text: They said to him, “We are your servants. We have come from a land very far away because the name of Yahweh your God is famous. We have heard reports about him[a] and about everything he did in Egypt.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “we have heard of his fame” or “we have heard of his renown.”
    reason: lexical_alternative
