translation:
  language: en
  text: But the Israelites did not strike them down,[a] because the leaders of the congregation had sworn an oath to them by Yahweh, the God of Israel. Then the whole congregation grumbled against the leaders.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
