translation:
  language: en
  text: They said to Joshua, “We are your servants.[a]” Joshua asked them, “Who are you? Where are you from?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “slaves.” Here “servants” is deferential language used in a diplomatic appeal.
