simplification_decisions:
- pob_phrase: Then Joshua said to them
  simplified_phrase: Joshua asked them
  preserved_meaning: Joshua responds by questioning the speakers.
  reasoning_layer_used: The lexical decision identifies Joshua’s words as direct questions within the narrative sequence.
  rationale: Using “asked” makes the speech function immediately clear.
- pob_phrase: Who are you, and where do you come from?
  simplified_phrase: Who are you? Where are you from?
  preserved_meaning: Joshua asks both their identity and their place of origin.
  reasoning_layer_used: The lexical decisions keep the two Hebrew questions distinct and treat the second as a question of origin.
  rationale: Two short questions are easier to read while preserving both inquiries.
translation_notes:
