  text: When all the kings across the Jordan[a] heard about this—the Hittite, Amorite, Canaanite, Perizzite, Hivite, and Jebusite kings in the hill country, the western foothills[b], and along the entire coast of the Great Sea (the Mediterranean) toward Lebanon—
