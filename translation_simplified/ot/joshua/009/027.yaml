translation:
  language: en
  text: That day Joshua assigned them to serve as woodcutters and water carriers[a] for the congregation and for Yahweh’s altar. This service continues to this day at the place Yahweh would choose.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “people who draw water.”
    reason: lexical_alternative
