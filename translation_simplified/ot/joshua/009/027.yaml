  preserved_meaning: Joshua appointed them to an ongoing class of laborers.
  reasoning_layer_used: Lexical decision for וַיִּתְּנֵם and the participial role expressions.
  rationale: “Assigned them to serve” makes the idiomatic appointment clear without weakening Joshua’s action.
- pob_phrase: for the congregation and for the altar of Yahweh, to this day
  simplified_phrase: for the congregation and for Yahweh’s altar. This service continues to this day
  preserved_meaning: Their labor served both Israel’s congregation and worship at Yahweh’s altar and remained ongoing.
