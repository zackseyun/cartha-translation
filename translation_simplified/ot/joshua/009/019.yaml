translation:
  language: en
  text: But all the leaders told the whole community, “We swore an oath to them by Yahweh, the God of Israel. So now we cannot lay a hand on them.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, we cannot harm or attack them; the Hebrew literally says “touch them.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: said to all the congregation
  simplified_phrase: told the whole community
  preserved_meaning: The leaders addressed the gathered people of Israel.
  reasoning_layer_used: POB lexical decision for הָעֵדָה
  rationale: “Community” is clearer to readers unfamiliar with the biblical use of “congregation.”
- pob_phrase: We have sworn to them
  simplified_phrase: We swore an oath to them
  preserved_meaning: The leaders had made a binding oath whose force continued.
  reasoning_layer_used: POB lexical rationale for נִשְׁבַּעְנוּ לָהֶם
  rationale: Naming the oath directly makes the binding promise easier to understand.
- pob_phrase: and now we cannot touch them
  simplified_phrase: So now we cannot lay a hand on them
  preserved_meaning: Because of the oath, the leaders could not harm the Gibeonites.
  reasoning_layer_used: POB lexical rationale for וְעַתָּה and לִנְגֹּעַ בָּהֶם
  rationale: “So” clarifies the consequence, while “lay a hand on” preserves the Hebrew touch image and its harmful sense.
