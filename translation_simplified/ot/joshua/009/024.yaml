translation:
  language: en
  text: 'They replied to Joshua, “We, your servants, were clearly told what Yahweh your God commanded his servant Moses: to give you all the land and to destroy everyone living in it as you advanced. We were terrified for our lives because of you. That is why we did this.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: They answered Joshua and said
  simplified_phrase: They replied to Joshua
  preserved_meaning: The Gibeonites respond directly to Joshua.
  reasoning_layer_used: POB lexical decisions for וַיַּעֲנוּ and וַיֹּאמְרוּ
  rationale: “Replied” naturally combines the two speech-introduction verbs.
- pob_phrase: all the inhabitants of the land
  simplified_phrase: everyone living in it
  preserved_meaning: The command concerns all people dwelling in the land.
  reasoning_layer_used: POB lexical decision for כָּל יֹשְׁבֵי הָאָרֶץ
  rationale: The common phrase retains the full scope without formal wording.
- pob_phrase: So we feared greatly for our lives because of you, and we did this thing
  simplified_phrase: We were terrified for our lives because of you. That is why we did this.
  preserved_meaning: Intense fear for survival caused the Gibeonites’ action.
  reasoning_layer_used: POB lexical decisions for וַנִּירָא מְאֹד, לְנַפְשֹׁתֵינוּ, and וַנַּעֲשֶׂה אֶת הַדָּבָר הַזֶּה
  rationale: Two direct sentences make the intense fear and causal link clear.
