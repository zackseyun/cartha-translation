translation:
  language: en
  text: So our elders and everyone living in our land told us, “Take supplies with you for the journey and go meet them. Say to them, ‘We are your servants.’[a] Now make a covenant with us.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Your servants” is respectful diplomatic language here; the Hebrew word can also mean “slaves” in other contexts.
    reason: lexical_alternative
  - marker: b
    text: More literally, “cut a covenant with us.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: all the inhabitants of our land
  simplified_phrase: everyone living in our land
  preserved_meaning: All the people who lived in their land are included.
  reasoning_layer_used: POB lexical decision for יֹשְׁבֵי אַרְצֵנוּ
  rationale: This preserves the collective sense without the formal word “inhabitants.”
- pob_phrase: Take provisions in your hand for the journey
  simplified_phrase: Take supplies with you for the journey
  preserved_meaning: They were to carry what they needed for their travel.
  reasoning_layer_used: POB lexical decisions for צֵידָה, בְיֶדְכֶם, and לַדֶּרֶךְ
  rationale: “Supplies with you” expresses possession naturally without limiting the provisions to food.
- pob_phrase: Say to them, “We are your servants”; and now make a covenant with us.
  simplified_phrase: Say to them, ‘We are your servants.’ Now make a covenant with us.
  preserved_meaning: The declaration to the people and the elders’ further instruction remain distinct.
  reasoning_layer_used: POB discourse structure and lexical decision for וְעַתָּה
  rationale: The quotation boundary keeps the final command outside the words the envoys are told to say.
