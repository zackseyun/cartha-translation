translation:
  language: en
  text: Now please swear to me by Yahweh that, just as I have shown kindness to you, you will show the same kindness to my father’s whole family and give me a sure sign.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a reliable pledge.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: just as I have shown kindness to you, you also will show kindness
  simplified_phrase: just as I have shown kindness to you, you will show the same kindness
  preserved_meaning: Rahab asks the men to return the loyal kindness she showed them.
  reasoning_layer_used: Lexical decisions for חֶסֶד and the requested future sense
  rationale: “The same kindness” makes the reciprocal comparison immediately clear.
- pob_phrase: my father’s house
  simplified_phrase: my father’s whole family
  preserved_meaning: Rahab’s request concerns her father’s household rather than a building.
  reasoning_layer_used: Lexical decision for בֵּית אָבִי
  rationale: The Hebrew household idiom is expressed directly in common English.
- pob_phrase: swear ... that ... show kindness ... and give me a sure sign
  simplified_phrase: swear ... that ... show the same kindness ... and give me a sure sign
  preserved_meaning: Both promised kindness and the sure sign remain coordinated parts of the requested oath.
  reasoning_layer_used: Source syntax and lexical decision for וּנְתַתֶּם לִי
  rationale: Keeping both actions in one sentence preserves the scope of the oath.
translation_notes:
  risk_flags:
  - risk: “Whole family” may sound less like an organized household than the Hebrew idiom.
    mitigation: It clearly conveys the broad family group intended in this context.
