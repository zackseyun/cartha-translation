translation:
  language: en
  text: For we have heard how Yahweh dried up the Red Sea[a] in front of you when you left Egypt. We have also heard what you did to Sihon and Og, the two Amorite kings across the Jordan, whom you devoted to destruction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew Yam Suph, traditionally “Red Sea”; more literally, “Sea of Reeds.”
    reason: lexical_alternative
