- pob_phrase: when you came out of Egypt
  simplified_phrase: when you left Egypt
  preserved_meaning: Israel's departure from Egypt
  reasoning_layer_used: lexical decision for בְּצֵאתְכֶם מִמִּצְרָיִם
  rationale: “Left Egypt” states the same event in more direct everyday English.
- pob_phrase: and what you did to the two kings of the Amorites who were beyond the Jordan—to Sihon and Og
  simplified_phrase: We have also heard what you did to Sihon and Og, the two Amorite kings across the Jordan
  preserved_meaning: Rahab had heard what Israel did to the two named Amorite kings east of the Jordan
  reasoning_layer_used: lexical decisions for עֲשִׂיתֶם, לִשְׁנֵי מַלְכֵי הָאֱמֹרִי, בְּעֵבֶר הַיַּרְדֵּן, and לְסִיחֹן וּלְעוֹג
  rationale: A new sentence and earlier naming remove the nested clause without changing the information.
- pob_phrase: before you
