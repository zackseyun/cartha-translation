translation:
  language: en
  text: So they went into the hills[a] and stayed there for three days, until the men chasing them came back. Those men searched all along the road but could not find them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “to the mountain” or “to the hill country.” It probably refers to the hills west of Jericho, not one mountain peak.
    reason: lexical_alternative
