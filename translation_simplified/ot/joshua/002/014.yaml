translation:
  language: en
  text: The men told her, “We pledge our lives for yours—even to death—if you do not reveal our business. When Yahweh gives us the land, we will treat you with covenant faithfulness and reliability.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “we will show you kindness and faithfulness.” The Hebrew expression describes loyal and reliable commitment.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Our lives for yours, even to death
  simplified_phrase: We pledge our lives for yours—even to death
  preserved_meaning: The men solemnly offer their lives in place of Rahab’s if they break their commitment.
  reasoning_layer_used: Lexical decision for נַפְשֵׁנוּ תַחְתֵּיכֶם לָמוּת
  rationale: “Pledge” makes the oath-like force clear while retaining substituted lives and death.
- pob_phrase: this matter of ours
  simplified_phrase: our business
  preserved_meaning: Rahab must not disclose the men’s secret matter.
  reasoning_layer_used: Lexical decision for אֶת דְּבָרֵנוּ זֶה
  rationale: “Our business” is natural English and avoids adding a location or narrowing the matter further.
- pob_phrase: deal with you in covenant faithfulness and truth
  simplified_phrase: treat you with covenant faithfulness and reliability
  preserved_meaning: They promise Rahab loyal covenantal treatment marked by dependable faithfulness.
  reasoning_layer_used: Lexical and theological decisions for חֶסֶד וֶאֱמֶת
  rationale: “Treat” clarifies the action, while “reliability” preserves broad relational truthfulness without limiting it to one promise.
