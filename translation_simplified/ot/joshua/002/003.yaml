translation:
  language: en
  text: 'So the king of Jericho sent Rahab this message: “Bring out the men who came to you and entered your house. They have come to search the entire land.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “to spy out the whole land.” The Hebrew can refer to reconnaissance in this context.
    reason: lexical_alternative
