translation:
  language: en
  text: At nightfall, when the gate was about to close,[a] the men left. I do not know where the men went. Go after them quickly, because you will catch up with them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “when it was dark”; the Hebrew connects the gate’s closing with the onset of darkness.
    reason: lexical_alternative
