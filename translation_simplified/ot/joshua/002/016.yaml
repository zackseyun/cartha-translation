  simplified_phrase: She told them
  preserved_meaning: She directly gave the men these instructions.
  reasoning_layer_used: POB translation and immediate narrative context
  rationale: The direct English verb removes an unnecessary opening conjunction without changing the speech.
- pob_phrase: lest the pursuers encounter you
  simplified_phrase: so the men chasing you do not come upon you
  preserved_meaning: Her direction is meant to prevent a hostile encounter with those pursuing them.
  reasoning_layer_used: POB lexical decisions for פֶּן, יִפְגְּעוּ בָכֶם, and הָרֹדְפִים
  rationale: The warning is recast in common English while retaining the pursuit and possible encounter.
- pob_phrase: Afterward you may go on your way
  simplified_phrase: Then you may go on your way
  preserved_meaning: They may continue only after the pursuers return.
  reasoning_layer_used: POB lexical decision for וְאַחַר and תֵּלְכוּ לְדַרְכְּכֶם
  rationale: “Then” states the sequence more simply while preserving the permission to proceed.
