translation:
  language: en
  text: She told them, “Go into the hill country,[a] so the men chasing you do not come upon you. Hide there for three days, until they return. Then you may go on your way.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “to the mountain”; the Hebrew may mean one mountain or the surrounding hill country.
    reason: lexical_alternative
