  preserved_meaning: The men call for attention and give Rahab a binding instruction for their entry into the land.
  reasoning_layer_used: Lexical decisions for הִנֵּה, בָאִים בָּאָרֶץ, and תִּקְשְׁרִי
  rationale: The direct introduction and command make the formal condition easier to follow.
- pob_phrase: in the window through which you let us down
