  preserved_meaning: Rahab must place the cord at the same window used for the spies’ escape.
  reasoning_layer_used: Lexical decision for בַּחַלּוֹן אֲשֶׁר הוֹרַדְתֵּנוּ בוֹ
  rationale: Ordinary location wording replaces the heavier relative clause without changing the scene.
- pob_phrase: you shall gather into your house ... all your father’s household
  simplified_phrase: Bring ... everyone in your father’s household into your house
  preserved_meaning: Rahab must assemble her named relatives and the whole paternal family unit inside her home.
