translation:
  language: en
  text: She said to the men, “I know that Yahweh has given you the land. We are terrified of you, and everyone living in the land has lost courage because of you.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “has melted before you.” The Hebrew uses the picture of melting to describe losing courage.
    reason: lexical_alternative
