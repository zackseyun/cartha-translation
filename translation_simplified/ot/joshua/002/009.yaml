  reasoning_layer_used: POB lexical decisions for אֵימָה and נָפְלָה ... עָלֵינוּ
  rationale: The direct wording clearly identifies who is afraid and preserves the force of “terror.”
- pob_phrase: all the inhabitants of the land have melted away before you
  simplified_phrase: everyone living in the land has lost courage because of you
  preserved_meaning: All the land’s people have become afraid and discouraged because of Israel.
  reasoning_layer_used: POB lexical decisions for נָמֹגוּ, יֹשְׁבֵי הָאָרֶץ, and מִפְּנֵיכֶם
