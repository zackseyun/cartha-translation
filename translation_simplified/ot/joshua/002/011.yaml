translation:
  language: en
  text: When we heard this, our hearts melted, and no one had any courage left because of you. For Yahweh[a] your God is God in heaven above and on earth below.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh is the personal name of God represented by YHWH in Hebrew.
    reason: source_note
simplification_decisions:
- pob_phrase: When we heard it
  simplified_phrase: When we heard this
  preserved_meaning: The words point back to the report described in the preceding verse.
  reasoning_layer_used: POB lexical decision and immediate context
  rationale: “This” gives the supplied object a clearer English reference.
- pob_phrase: no spirit remained in any man
  simplified_phrase: no one had any courage left
  preserved_meaning: The people had completely lost their inner courage.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: The plain wording states the idiom’s contextual sense without suggesting the Holy Spirit.
- pob_phrase: heavens above and on the earth below
  simplified_phrase: heaven above and on earth below
  preserved_meaning: Yahweh is God throughout the whole heavenly and earthly realm.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The familiar English pairing keeps the heaven-earth contrast and its universal scope.
translation_notes:
  risk_flags:
