  preserved_meaning: The search party followed the spies on the route leading to the Jordan.
  reasoning_layer_used: POB lexical decisions for רָדְפוּ and דֶּרֶךְ הַיַּרְדֵּן
  rationale: The rewrite removes the awkward phrase “pursued after” while keeping the pursuit and its route.
- pob_phrase: as far as the fords
  simplified_phrase: all the way to the shallow crossing places
  preserved_meaning: The men pursued them to places where the Jordan could be crossed on foot.
  reasoning_layer_used: POB footnote and lexical decision for עַל הַמַּעְבְּרוֹת
  rationale: The concrete explanation replaces the unfamiliar term “fords” without losing the river-crossing image.
- pob_phrase: and they shut the gate behind them as soon as the pursuers had gone out after them
  simplified_phrase: As soon as the pursuers had gone out, the city gate was shut behind them
  preserved_meaning: The gate was closed immediately after the pursuers departed to follow the spies.
  reasoning_layer_used: POB lexical decisions for וְהַשַּׁעַר, אַחֲרֵי, and כַּאֲשֶׁר יָצְאוּ
  rationale: Reordering the clause makes the timing clear and avoids an uncertain English antecedent for “they.”
