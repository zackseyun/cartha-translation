  text: The men chased them along the road to the Jordan, all the way to the shallow crossing places. As soon as the pursuers had gone out, the city gate was shut behind them.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: pursued after them on the way to the Jordan
