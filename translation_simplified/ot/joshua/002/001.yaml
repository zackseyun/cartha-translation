translation:
  language: en
  text: Joshua son of Nun secretly sent two men from Shittim to spy on the land. He told them, “Go and look over the land and Jericho.”[a] They went to the house of a prostitute named Rahab and lay down there.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may refer to the land in general and Jericho in particular.
    reason: lexical_alternative
  - marker: b
    text: This may mean that they stayed there; the Hebrew literally says “lay down there” and does not imply sexual activity.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: sent two men secretly from Shittim as spies
  simplified_phrase: secretly sent two men from Shittim to spy on the land
  preserved_meaning: Joshua covertly commissioned two male agents to gather information about the land.
  reasoning_layer_used: Lexical decisions for “two men,” “as spies,” and “secretly.”
  rationale: The role phrase becomes a direct purpose clause in natural English.
- pob_phrase: saying, “Go, see the land and Jericho”
  simplified_phrase: He told them, “Go and look over the land and Jericho”
  preserved_meaning: Joshua commanded them to examine the land, with Jericho explicitly named.
  reasoning_layer_used: Lexical decision and revision history for “the land and Jericho.”
  rationale: A new sentence and “look over” clarify the command without resolving the coordination.
- pob_phrase: the house of a prostitute whose name was Rahab
  simplified_phrase: the house of a prostitute named Rahab
  preserved_meaning: The men entered a house associated with Rahab, whom the Hebrew identifies as a prostitute.
  reasoning_layer_used: Lexical and theological decisions for the house and Rahab’s occupation.
  rationale: The shorter wording remains natural while avoiding the added domestic nuance of “home.”
