translation:
  language: en
  text: Then the border turned west toward Aznoth-tabor. From there it continued to Hukkok. It met Zebulun on the south, Asher on the west, and Judah at the Jordan toward the east, where the sun rises.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “Judah at the Jordan toward the east.” The geography is difficult because Naphtali did not directly border Judah’s tribal territory in the usual sense. Some understand the wording differently or suspect a problem in the Hebrew text, but this translation preserves the Hebrew wording.
    reason: textual_variant
simplification_decisions:
- pob_phrase: and from there it went out to Hukkok
  simplified_phrase: From there it continued to Hukkok
  preserved_meaning: The boundary line proceeded from Aznoth-tabor to Hukkok.
  reasoning_layer_used: Lexical decision for וְיָצָא מִשָּׁם
  rationale: “Continued” expresses the border formula in ordinary geographic English.
- pob_phrase: and it reached Zebulun ... and it reached Asher
  simplified_phrase: It met Zebulun ... Asher
  preserved_meaning: The border came into contact with the territories of Zebulun and Asher.
  reasoning_layer_used: Lexical decisions for וּפָגַע and וּבְאָשֵׁר פָּגַע
  rationale: “Met” avoids repetition while retaining the idea of territorial contact.
- pob_phrase: toward the east, where the sun rises
  simplified_phrase: toward the east, where the sun rises
  preserved_meaning: The direction is east, expressed through the Hebrew sunrise image.
  reasoning_layer_used: Lexical decision for מִזְרַח הַשָּׁמֶשׁ
  rationale: The clear directional phrase and its source-language image are both retained.
