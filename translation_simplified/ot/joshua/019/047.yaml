translation:
  language: en
  text: But the territory of the sons of Dan extended beyond them.[a] So the sons of Dan went up and fought against Leshem. They captured it, struck it with the edge of the sword, took possession of it, and lived there. They renamed Leshem Dan, after Dan their father.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the border of the sons of Dan extended beyond them.” Some understand this to mean that their territory was too small, but the Hebrew wording describes the territory spatially.
    reason: alternative_reading
  - marker: b
    text: Leshem is associated with Laish in Judges 18:7, 14, 27, 29.
    reason: cross_reference
