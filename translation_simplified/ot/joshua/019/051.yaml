translation:
  language: en
  text: These are the land inheritances of the tribes of the sons of Israel.[a] At Shiloh, Eleazar the priest, Joshua son of Nun, and the tribes’ family leaders assigned these inheritances by casting lots before Yahweh, at the entrance to the tent of meeting. So they finished dividing the land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The sons of Israel” is the Hebrew expression for the people descended from Israel.
    reason: simplification_note
simplification_decisions:
- pob_phrase: These are the inheritances that ... apportioned
  simplified_phrase: These are the land inheritances ... assigned these inheritances
  preserved_meaning: The portions were inherited tribal lands formally allocated by Israel’s leaders.
  reasoning_layer_used: POB lexical decisions for הַנְּחָלֹת and נִחֲלוּ
  rationale: The sentence is divided and reordered while retaining both inheritance and official assignment.
- pob_phrase: the heads of the fathers’ houses of the tribes
  simplified_phrase: the tribes’ family leaders
  preserved_meaning: These men led the tribes’ clans or ancestral households.
  reasoning_layer_used: POB lexical rationale for וְרָאשֵׁי הָאָבוֹת
  rationale: “Family leaders” communicates the social role without the opaque phrase “fathers’ houses.”
- pob_phrase: by lot
  simplified_phrase: by casting lots
  preserved_meaning: The inheritances were allocated through the established lot procedure.
  reasoning_layer_used: POB lexical decision for בְּגוֹרָל
  rationale: The verbal form makes the unfamiliar procedure easier to picture.
interpretive_expansions:
