translation:
  language: en
  text: After they finished dividing the land into its territories,[a] the sons of Israel[b] gave Joshua son of Nun an inheritance among them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “according to its borders.” The Hebrew can refer to territories or their boundary lines.
    reason: lexical_alternative
  - marker: b
    text: That is, the Israelites; the Hebrew literally says “the sons of Israel.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: When they finished apportioning the land by its territories
  simplified_phrase: After they finished dividing the land into its territories
  preserved_meaning: The tribal territories had been fully assigned before Joshua received his share.
  reasoning_layer_used: Lexical decisions for וַיְכַלּוּ, לִנְחֹל, and לִגְבוּלֹתֶיהָ
  rationale: “Dividing” expresses the distributive sense more plainly than “apportioning.”
- pob_phrase: the sons of Israel
  simplified_phrase: the sons of Israel[b]
  preserved_meaning: The formal Hebrew national and covenantal designation remains in the text.
  reasoning_layer_used: Theological decision for בְנֵי יִשְׂרָאֵל
  rationale: A footnote gives the familiar meaning “Israelites” without replacing the chosen formal expression.
- pob_phrase: gave an inheritance to Joshua son of Nun among them
  simplified_phrase: gave Joshua son of Nun an inheritance among them
  preserved_meaning: Joshua received an allotted covenant-land share within Israel.
  reasoning_layer_used: Lexical decisions for נתן, נַחֲלָה, and בְּתוֹכָם
  rationale: Natural English word order improves readability while retaining the key term “inheritance.”
translation_notes:
