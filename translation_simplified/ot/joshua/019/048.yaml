translation:
  language: en
  text: This was[a] the land inherited[b] by the tribe of Dan, clan by clan. It included these cities and their villages.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “This is.” The Hebrew summary formula may be expressed in either present or past tense in English.
    reason: lexical_alternative
  - marker: b
    text: Or “the land allotted.” The Hebrew word describes both an assigned portion and an inheritance.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the inheritance of the tribe of the sons of Dan
  simplified_phrase: the land inherited by the tribe of Dan
  preserved_meaning: Dan’s covenantal territorial inheritance remains the controlling sense.
  reasoning_layer_used: POB lexical decisions for נַחֲלַת and בְנֵי דָן
  rationale: The rewrite makes the territorial meaning clear and removes the formal phrase “sons of Dan.”
- pob_phrase: according to their clans
  simplified_phrase: clan by clan
  preserved_meaning: The land was distributed according to the tribe’s kinship divisions.
  reasoning_layer_used: POB lexical decision for לְמִשְׁפְּחֹתָם
  rationale: The shorter phrase expresses the same organizing principle in natural English.
- pob_phrase: these cities with their villages
  simplified_phrase: It included these cities and their villages
  preserved_meaning: The summary covers the listed cities and their dependent villages.
  reasoning_layer_used: POB lexical decisions for הֶעָרִים הָאֵלֶּה and וְחַצְרֵיהֶן
  rationale: A complete sentence makes the summary relationship easier to follow.
translation_notes:
  risk_flags:
  - risk: “Land inherited” may understate the administrative sense of an assigned allotment.
    mitigation: Footnote [b] preserves “land allotted” as the lexical alternative.
