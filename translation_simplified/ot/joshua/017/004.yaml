translation:
  language: en
  text: The daughters came to Eleazar the priest, Joshua son of Nun, and the leaders. They said, “Yahweh commanded Moses to give us inherited land among the men of our clan.” So he gave them inherited land among their father’s brothers—that is, within their father’s clan—as Yahweh had commanded.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: came near before Eleazar the priest, and before Joshua son of Nun, and before the leaders
  simplified_phrase: came to Eleazar the priest, Joshua son of Nun, and the leaders
  preserved_meaning: The daughters formally approached the named authorities.
  reasoning_layer_used: Lexical decisions for וַתִּקְרַבְנָה and repeated לִפְנֵי
  rationale: The simpler wording removes repetition while retaining their public approach to the authorities.
- pob_phrase: an inheritance
  simplified_phrase: inherited land
  preserved_meaning: The gift was a hereditary share of allotted land.
  reasoning_layer_used: Lexical decision for נַחֲלָה and Joshua’s land-allotment context
  rationale: “Inherited land” makes the concrete nature of the inheritance immediately clear.
- pob_phrase: according to the command of Yahweh
  simplified_phrase: as Yahweh had commanded
  preserved_meaning: The allotment was carried out under Yahweh’s authoritative command.
  reasoning_layer_used: Lexical decision for אֶל־פִּי יְהוָה
  rationale: The recast clause expresses the Hebrew idiom in ordinary English.
interpretive_expansions:
- pob_phrase: among our brothers
  rendering: among the men of our clan
  claim: The daughters requested land within the allotment of their male clan members, not necessarily literal siblings.
  evidence:
  - Joshua 17:3 identifies the speakers as Zelophehad’s daughters and says he had no sons.
  - The POB cultural note defines the group as their male clan members.
  confidence: high
  alternatives_preserved:
  - among our brothers
  - among our male relatives
- pob_phrase: among their father's brothers
  rendering: among their father’s brothers—that is, within their father’s clan
  claim: The land was allotted within the daughters’ paternal clan.
  evidence:
  - The Hebrew specifically names their father’s brothers.
  - The POB cultural note identifies this group as their paternal clan.
  confidence: high
  alternatives_preserved:
  - among their father’s brothers
translation_notes:
  risk_flags:
