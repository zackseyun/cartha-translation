translation:
  language: en
  text: The tribe of Manasseh received land by lot because Manasseh was Joseph’s firstborn son. Machir was Manasseh’s firstborn son and the father of Gilead.[a] Because Machir was a warrior, Gilead and Bashan were assigned to him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Father of Gilead” may mean the ancestor or founder of Gilead, not only an immediate biological father.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The lot fell to the tribe of Manasseh
  simplified_phrase: The tribe of Manasseh received land by lot
  preserved_meaning: Manasseh’s territory was assigned through the lot-casting process.
  reasoning_layer_used: POB lexical decision for וַיְהִי הַגּוֹרָל and its inheritance context
  rationale: The active wording makes the territorial result clear while retaining assignment by lot.
- pob_phrase: to Machir the firstborn of Manasseh, the father of Gilead
  simplified_phrase: Machir was Manasseh’s firstborn son and the father of Gilead
  preserved_meaning: Machir’s place in Manasseh’s family line and his connection to Gilead remain distinct.
  reasoning_layer_used: POB lexical decisions for לְמָכִיר, בְּכוֹר מְנַשֶּׁה, and אֲבִי הַגִּלְעָד
  rationale: A complete sentence removes the dense genealogical clause without resolving the documented ambiguity in “father.”
- pob_phrase: because he was a man of war, there belonged Gilead and Bashan
  simplified_phrase: Because Machir was a warrior, Gilead and Bashan were assigned to him
  preserved_meaning: Machir’s military identity is given as the reason these territories became his possession.
  reasoning_layer_used: POB lexical decisions for אִישׁ מִלְחָמָה and וַיְהִי לוֹ
  rationale: Naming Machir and using ordinary inheritance language clarify the pronoun and awkward word order.
interpretive_expansions:
- pob_phrase: The lot fell
  rendering: received land by lot
  claim: The lot determined a territorial inheritance rather than an abstract outcome.
  evidence:
  - The POB lexical rationale identifies territorial inheritance as the context.
  - The immediate verse names Gilead and Bashan as assigned territories.
  confidence: high
  alternatives_preserved:
  - The lot fell to the tribe of Manasseh
