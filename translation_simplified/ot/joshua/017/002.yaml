translation:
  language: en
  text: 'The rest of Manasseh’s sons[a] received land according to their clans[b]: the male descendants of Abiezer, Helek, Asriel, Shechem, Hepher, and Shemida. These were the male descendants of Manasseh, son of Joseph.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “sons” includes the descendants who formed Manasseh’s remaining clan groups.
    reason: lexical_alternative
  - marker: b
    text: A clan was a recognized kinship group within a tribe.
    reason: cultural_note
simplification_decisions:
- pob_phrase: And it was for the remaining sons of Manasseh
  simplified_phrase: The rest of Manasseh’s sons received land
  preserved_meaning: Manasseh’s remaining descendant groups were included in the land allotment.
  reasoning_layer_used: Lexical rationales for וַיְהִי, לִבְנֵי מְנַשֶּׁה, and הַנּוֹתָרִים
  rationale: The awkward opening becomes a direct allotment statement while retaining “sons.”
- pob_phrase: for the sons of Abiezer, and for the sons of Helek ...
  simplified_phrase: the male descendants of Abiezer, Helek ...
  preserved_meaning: The land went to the descendant groups of every named man.
  reasoning_layer_used: Lexical decisions for the repeated filial formula and הַזְּכָרִים
  rationale: The repeated legal formula is compressed without dropping any name or the male distinction.
- pob_phrase: These were the male sons of Manasseh son of Joseph
  simplified_phrase: These were the male descendants of Manasseh, son of Joseph
  preserved_meaning: The groups were Manasseh’s male descendants, in contrast with the daughters nearby, and Manasseh was Joseph’s son.
  reasoning_layer_used: Lexical rationale for הַזְּכָרִים and cross-reference footnote c
  rationale: “Male descendants” states the contrast clearly without the unnatural phrase “male sons.”
