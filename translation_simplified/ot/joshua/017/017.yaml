  text: Joshua said to the descendants of Joseph, Ephraim and Manasseh, “There are many of you, and you are very strong. You will not receive just one share of land.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the house of Joseph—to Ephraim and Manasseh—saying
  simplified_phrase: the descendants of Joseph, Ephraim and Manasseh
  preserved_meaning: Ephraim and Manasseh are the two tribal groups descended from Joseph whom Joshua addressed.
  reasoning_layer_used: POB lexical decisions for בֵּית יוֹסֵף and לְאֶפְרַיִם וְלִמְנַשֶּׁה
  rationale: “Descendants” makes the familial-tribal expression clear, and ordinary English does not need “saying” before the quotation.
- pob_phrase: You are a numerous people, and you have great strength
  simplified_phrase: There are many of you, and you are very strong
  preserved_meaning: The group is both large in number and strong in capacity.
  reasoning_layer_used: POB lexical decisions for עַם רַב and וְכֹחַ גָּדוֹל לָךְ
  rationale: The rewrite separates numerical size from strength in direct, natural English.
- pob_phrase: you shall not have only one allotment
  simplified_phrase: You will not receive just one share of land
  preserved_meaning: Joseph’s descendants will receive more than a single inheritance portion.
  reasoning_layer_used: POB lexical decision for לֹא יִהְיֶה לְךָ גּוֹרָל אֶחָד
  rationale: “Share of land” explains the otherwise technical term “allotment” while retaining the restrictive force of “only one.”
