translation:
  language: en
  text: Within the territories of Issachar and Asher, Manasseh’s allotment included Beth-shean and Ibleam, with their dependent villages.[a] It also included the inhabitants of Dor, En-dor, Taanach, and Megiddo, with the dependent villages of each town. These were the three regions.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally “daughter villages,” a Hebrew image for villages or settlements that depended on a main town.
    reason: cultural_note
  - marker: b
    text: Or “the three heights” or “the three districts.” The Hebrew phrase is difficult and may refer to a geographical or administrative grouping.
    reason: lexical_alternative
