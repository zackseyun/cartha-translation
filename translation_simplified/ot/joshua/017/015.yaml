translation:
  language: en
  text: Joshua said to them, “If you have so many people, go up into the forest in the land of the Perizzites and the Rephaim. Clear land there for yourselves, because the hill country of Ephraim does not have enough room for you.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: If you are a numerous people
  simplified_phrase: If you have so many people
  preserved_meaning: Joshua acknowledges that their population is numerous.
  reasoning_layer_used: POB lexical decision for עַם רַב
  rationale: This states numerical size directly and avoids suggesting physical size.
- pob_phrase: go up to the forest and clear land for yourselves there
  simplified_phrase: go up into the forest ... Clear land there for yourselves
  preserved_meaning: They must enter the wooded area and make usable land for themselves.
  reasoning_layer_used: POB lexical decisions for עֲלֵה לְךָ הַיַּעְרָה and וּבֵרֵאתָ לְךָ שָׁם
  rationale: Two sentences separate the movement from the work while preserving the forest-clearing image.
- pob_phrase: the hill country of Ephraim is too narrow for you
  simplified_phrase: the hill country of Ephraim does not have enough room for you
  preserved_meaning: Their present upland territory is too cramped for their population.
  reasoning_layer_used: POB lexical decisions for כִּי אָץ לְךָ and הַר אֶפְרָיִם
  rationale: The wording expresses the shortage of territory in ordinary English.
