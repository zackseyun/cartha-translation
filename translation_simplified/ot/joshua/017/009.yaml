  text: Then the border went down to the Brook of Kanah.[a] The cities south of the brook belonged to Ephraim and were within Manasseh’s territory. Manasseh’s border lay north of the brook and ended at the Mediterranean Sea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term may also mean a seasonal streambed or ravine, so this may be called the Wadi Kanah.
    reason: lexical_alternative
