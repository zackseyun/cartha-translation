translation:
  language: en
  text: The descendants of Joseph said, “The hill country is not enough for us. All the Canaanites living in the valley region have chariots fitted with iron. That includes those in Beth-shean and its smaller dependent towns, and those in the Valley of Jezreel.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the sons of Joseph
  simplified_phrase: the descendants of Joseph
  preserved_meaning: Joseph’s tribal descendants are speaking, not only his immediate sons.
  reasoning_layer_used: Immediate narrative context and collective usage
  rationale: “Descendants” makes the group identity clear to a modern reader.
- pob_phrase: the valley land
  simplified_phrase: the valley region
  preserved_meaning: The Canaanite lowlands are contrasted with the hill country.
  reasoning_layer_used: POB lexical decision for אֶרֶץ הָעֵמֶק
  rationale: “Valley region” is more natural while preserving the geographic contrast.
- pob_phrase: both those in Beth-shean and its daughter towns and those in the Valley of Jezreel
  simplified_phrase: That includes those in Beth-shean and its smaller dependent towns, and those in the Valley of Jezreel.
  preserved_meaning: Both groups of Canaanite settlements are included in the complaint.
  reasoning_layer_used: POB cultural note for וּבְנוֹתֶיהָ
  rationale: A separate sentence explains the Hebrew settlement idiom without interrupting the list.
