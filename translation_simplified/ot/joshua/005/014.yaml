translation:
  language: en
  text: He replied, “No.[a] I have now come as the commander of Yahweh’s army.” Then Joshua fell facedown to the ground and bowed down.[b] He asked, “My lord, what are you saying to your servant?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Neither. I have now come as the commander of Yahweh’s army.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew can also mean “worshiped”; “bowed down” preserves the act without deciding who this figure is.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: He said, “No; rather, I have now come as the commander of the army of Yahweh.”
  simplified_phrase: He replied, “No. I have now come as the commander of Yahweh’s army.”
  preserved_meaning: The speaker rejects Joshua’s alternatives and identifies himself as the commander of Yahweh’s army.
  reasoning_layer_used: Lexical decisions for לֹא, כִּי, שַׂר, צְבָא יְהוָה, and עַתָּה בָאתִי
  rationale: Short sentences clearly separate the rejection from the speaker’s identity.
- pob_phrase: Then Joshua fell with his face to the ground and bowed down
  simplified_phrase: Then Joshua fell facedown to the ground and bowed down.
  preserved_meaning: Joshua prostrates himself and bows reverently without defining the act as worship.
  reasoning_layer_used: Lexical and theological decisions for פָּנָיו אַרצה and וַיִּשְׁתָּחוּ
  rationale: “Facedown” gives the posture plainly while retaining bowing as a distinct act.
- pob_phrase: What is my lord saying to his servant?
  simplified_phrase: My lord, what are you saying to your servant?
  preserved_meaning: Joshua directly and respectfully asks for the message while humbly calling himself the figure’s servant.
  reasoning_layer_used: Lexical decisions for אֲדֹנִי and מְדַבֵּר אֶל עַבְדּוֹ
  rationale: Second-person wording makes the direct address natural without weakening Joshua’s humility.
translation_notes:
  risk_flags:
  - risk: “No” may not clearly indicate that neither proposed side is being chosen.
    mitigation: Footnote a preserves “Neither” as the documented alternative.
  - risk: Readers may take “bowed down” as either excluding or proving worship.
    mitigation: Footnote b preserves the Hebrew ambiguity without identifying the figure beyond his title.
