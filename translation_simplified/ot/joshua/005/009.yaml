translation:
  language: en
  text: Yahweh said to Joshua, “Today I have rolled away from you the disgrace connected with Egypt.”[b] So that place was named Gilgal,[a] and it was still called that when this was written.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Gilgal” sounds like the Hebrew verb translated “rolled away.”
    reason: cultural_note
  - marker: b
    text: The disgrace connected with Egypt may refer to Israel’s shame in Egypt, Egyptian taunts, or covenant disgrace now removed.
    reason: lexical_alternative
