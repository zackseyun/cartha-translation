translation:
  language: en
  text: When Joshua was by Jericho[a], he looked up. There in front of him stood a man holding a drawn sword. Joshua went up to him and asked, “Are you for us or for our enemies?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in Jericho” or “near Jericho”; the Hebrew does not specify his precise location in relation to the city.
    reason: lexical_alternative
