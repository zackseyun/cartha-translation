translation:
  language: en
  text: The day after they ate from the land’s produce,[a] the manna stopped. The sons of Israel[b] had no more manna. That year they ate crops grown in the land of Canaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the land’s stored produce.” The Hebrew may refer to food kept from the previous year’s crop.
    reason: lexical_alternative
  - marker: b
    text: “Sons of Israel” is the literal Hebrew expression; it refers to the Israelites.
    reason: lexical_alternative
