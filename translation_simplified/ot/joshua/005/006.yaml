translation:
  language: en
  text: For forty years, the Israelites walked through the wilderness, until that whole group—the fighting men who had left Egypt—had died because they had not listened to Yahweh’s voice. Yahweh had sworn to them that he would not allow them to see the land he had sworn to their fathers to give to us[a]—a land flowing with milk and honey.
