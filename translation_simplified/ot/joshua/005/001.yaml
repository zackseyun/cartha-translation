translation:
  language: en
  text: When all the Amorite kings west of the Jordan and all the Canaanite kings along the coast heard that Yahweh had dried up the Jordan before the sons of Israel until we had crossed over, their hearts melted with fear, and they had no courage left because of the sons of Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts and ancient versions read “until they had crossed over.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: all the kings of the Amorites who were beyond the Jordan to the west
  simplified_phrase: all the Amorite kings west of the Jordan
  preserved_meaning: All Amorite rulers on the Jordan’s western side are included.
  reasoning_layer_used: lexical decision for בְּעֵבֶר הַיַּרְדֵּן יָמָּה
  rationale: The shorter wording gives the same geography in ordinary English.
- pob_phrase: all the kings of the Canaanites who were by the sea
  simplified_phrase: all the Canaanite kings along the coast
  preserved_meaning: The Canaanite rulers in the coastal region are included.
  reasoning_layer_used: lexical decision for עַל הַיָּם and POB footnote a
  rationale: “Along the coast” makes the regional meaning immediately clear.
- pob_phrase: their heart melted, and there was no longer spirit in them
  simplified_phrase: their hearts melted with fear, and they had no courage left
  preserved_meaning: The kings collectively lost their resolve and courage before Israel.
  reasoning_layer_used: lexical decisions for וַיִּמַּס לְבָבָם and רוּחַ
  rationale: Natural English preserves the melting-heart image and explains the spirit idiom.
