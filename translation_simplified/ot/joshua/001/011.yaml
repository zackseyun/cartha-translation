  preserved_meaning: The people must ready their own provisions for the coming journey.
  reasoning_layer_used: POB lexical decision for הָכִינוּ לָכֶם צֵידָה
  rationale: “Supplies” is more familiar than “provisions” and still includes what a journey requires.
- pob_phrase: you are crossing this Jordan to go in to take possession of the land that Yahweh your God is giving you to possess it
