translation:
  language: en
  text: Just be strong and very courageous. Take care to obey the whole law that Moses my servant commanded you. Do not turn away from it, either to the right or to the left, so that you may act wisely wherever you go.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “you may prosper” or “you may have success” in all you do or wherever you go.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Only be strong and very courageous
  simplified_phrase: Just be strong and very courageous
  preserved_meaning: The charge retains its restrictive emphasis and its full call for strength and courage.
  reasoning_layer_used: Lexical decisions for רַק and חֲזַק וֶאֱמַץ
  rationale: “Just” preserves the limiting emphasis without suggesting this command ranks above all others.
- pob_phrase: being careful to do according to all the law
  simplified_phrase: Take care to obey the whole law
  preserved_meaning: Joshua must carefully observe and carry out every part of the Mosaic law.
  reasoning_layer_used: Lexical and theological decisions for לִשְׁמֹר לַעֲשׂוֹת and תּוֹרָה
  rationale: “Obey” clearly joins careful observance with action while retaining the covenant term “law.”
- pob_phrase: Do not turn from it to the right or to the left
  simplified_phrase: Do not turn away from it, either to the right or to the left
  preserved_meaning: Joshua must not deviate from the law in either direction.
  reasoning_layer_used: Lexical decision for אַל תָּסוּר מִמֶּנּוּ יָמִין וּשְׂמֹאול
  rationale: “Turn away” clarifies the command while preserving its directional image.
translation_notes:
  risk_flags:
  - risk: “Just” can sometimes sound minimizing in modern English.
    mitigation: Here its placement before the paired commands conveys the audited restrictive emphasis rather than reducing their importance.
  - risk: “Act wisely” does not fully display the possible success nuance.
    mitigation: Footnote a preserves the alternatives “prosper” and “have success.”
