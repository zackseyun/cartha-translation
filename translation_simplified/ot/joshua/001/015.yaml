  text: until Yahweh gives your brothers[a] rest, just as he has given you rest, and they too take possession of the land Yahweh your God is giving them. Then return to your own allotted land and take possession of it—the land Moses, Yahweh’s servant, gave you east of the Jordan River, toward the sunrise.
