translation:
  language: en
  text: Your wives, young children, and livestock are to stay in the land Moses gave you on the other side of the Jordan. But all your able warriors must cross the Jordan armed,[a] ahead of your brothers,[b] and help them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in battle formation” or “ready for war.”
    reason: alternative_reading
  - marker: b
    text: “Brothers” here refers to their fellow Israelites.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: shall remain in the land that Moses gave you beyond the Jordan
  simplified_phrase: are to stay in the land Moses gave you on the other side of the Jordan
  preserved_meaning: Their families and livestock will continue living in the territory Moses assigned east of the Jordan.
  reasoning_layer_used: Lexical decisions for יֵשְׁבוּ and בְּעֵבֶר הַיַּרְדֵּן
  rationale: Common wording replaces the formal “shall remain” and the less transparent “beyond.”
- pob_phrase: all the mighty men of valor
  simplified_phrase: all your able warriors
  preserved_meaning: Every man capable of fighting is required to go.
  reasoning_layer_used: Lexical decision for כֹּל גִּבּוֹרֵי הַחַיִל
  rationale: “Able warriors” clearly expresses the military role without the traditional idiom.
- pob_phrase: cross over before your brothers, armed
  simplified_phrase: cross the Jordan armed, ahead of your brothers
  preserved_meaning: The warriors must cross equipped for battle and advance in front of the other Israelites.
  reasoning_layer_used: Lexical and theological decisions for חֲמֻשִׁים and לִפְנֵי אֲחֵיכֶם
  rationale: Ordinary clause order makes the movement and military duty immediately clear.
interpretive_expansions:
- pob_phrase: cross over
  rendering: cross the Jordan
  claim: The river to be crossed is the Jordan.
  evidence:
  - The preceding clause names the Jordan as the geographic boundary.
  confidence: high
  alternatives_preserved:
  - cross over
translation_notes:
  risk_flags:
