translation:
  language: en
  text: Be strong and courageous, because you will give this people the land as their inheritance—the land I swore to give to their fathers.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Their fathers” means Israel’s forefathers, especially the patriarchs; it may also be translated “their ancestors.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: for you shall cause this people to inherit
  simplified_phrase: because you will give this people the land as their inheritance
  preserved_meaning: Joshua will cause Israel to receive the land as its inheritance.
  reasoning_layer_used: The lexical decision for תַּנְחִיל authorizes this idiomatic rendering while preserving its causative inheritance sense.
  rationale: This replaces an unnatural causative construction without shifting the action toward entering the land.
- pob_phrase: the land that I swore to their fathers to give to them
  simplified_phrase: the land I swore to give to their fathers
  preserved_meaning: God pledged by oath to give the land to Israel’s covenant forefathers.
  reasoning_layer_used: The lexical and theological decisions retain both the divine oath and the masculine patriarchal reference.
  rationale: The reordered clause is easier to follow while keeping the oath, land, and recipients explicit.
translation_notes:
  risk_flags:
  - risk: “Give” could be read as making Joshua the ultimate owner or source of the land.
    mitigation: “As their inheritance” and God’s oath make clear that Joshua carries out God’s promised grant.
