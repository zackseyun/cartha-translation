translation:
  language: en
  text: Keep this book of the law always on your lips. Think deeply about it day and night,[a] so that you carefully obey everything written in it. Then you will make your way prosperous and act wisely.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean to quietly repeat or recite it while reflecting on it.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: shall not depart from your mouth
  simplified_phrase: Keep ... always on your lips
  preserved_meaning: Joshua must continually speak and keep God's written law ready to recite.
  reasoning_layer_used: Lexical decision for יָמוּשׁ and מִפִּיךָ
  rationale: The active wording is easier to understand while preserving the concrete image of words remaining on the lips.
- pob_phrase: you shall meditate on it
  simplified_phrase: Think deeply about it
  preserved_meaning: Joshua must continually reflect on the law, with its oral nuance retained in the footnote.
  reasoning_layer_used: Lexical and theological decisions for וְהָגִיתָ
  rationale: This makes meditation immediately clear without reducing it to silent thought alone.
- pob_phrase: be careful to do according to all that is written in it
  simplified_phrase: carefully obey everything written in it
  preserved_meaning: Reflection must lead to complete and attentive obedience to the written law.
  reasoning_layer_used: Lexical decisions for לְמַעַן תִּשְׁמֹר לַעֲשׂוֹת and כְּכָל הַכָּתוּב בּוֹ
  rationale: The shorter wording expresses both careful observance and the comprehensive written standard.
translation_notes:
  risk_flags:
  - risk: “Think deeply” may sound entirely inward.
    mitigation: The lips image and anchored footnote preserve the Hebrew verb's oral-recitation nuance.
  - risk: “Make your way prosperous” may be mistaken for a promise of material wealth.
    mitigation: The wording retains the POB's causative choice and pairs it with obedient, wise action.
