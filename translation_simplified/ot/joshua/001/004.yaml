translation:
  language: en
  text: Your territory will extend from the wilderness and this Lebanon to the great river, the Euphrates. It will include all the land of the Hittites and reach the Great Sea,[a] toward where the sun goes down.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, the Mediterranean Sea.
    reason: cultural_note
  - marker: b
    text: That is, toward the west; the Hebrew literally describes the sun going down.
    reason: lexical_alternative
