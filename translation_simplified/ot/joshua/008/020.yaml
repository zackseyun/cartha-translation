  reasoning_layer_used: POB lexical decisions and cultural note for וְלֹא הָיָה בָהֶם יָדַיִם and לָנוּס הֵנָּה וָהֵנָּה
  rationale: The Hebrew idiom is stated directly while preserving the impossibility of escape in either direction.
