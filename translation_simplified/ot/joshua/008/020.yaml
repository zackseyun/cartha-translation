  reasoning_layer_used: POB lexical decision for עָלָה עֲשַׁן הָעִיר הַשָּׁמַיְמָה
  rationale: The participial wording is smoother while retaining the ongoing upward movement and concrete sky image.
- pob_phrase: there was no power in them to flee this way or that way
  simplified_phrase: they could not escape in either direction
