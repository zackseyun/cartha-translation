translation:
  language: en
  text: The soldiers waiting in ambush quickly sprang from their position. As soon as Joshua stretched out his hand[a], they ran into the city, captured it, and quickly set it on fire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “when Joshua stretched out his hand.” The Hebrew can express the timing either way.
    reason: lexical_alternative
