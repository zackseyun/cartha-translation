translation:
  language: en
  text: Joshua built the altar just as Moses, Yahweh’s servant, had commanded the sons of Israel. As written in the Book of the Law of Moses, he used whole stones[a] that had not been worked with any iron tool. On the altar they offered burnt offerings to Yahweh and sacrificed peace offerings.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “uncut stones.” The Hebrew describes stones left whole and intact.
    reason: lexical_alternative
  - marker: b
    text: Also called “fellowship offerings” or “offerings of well-being.”
    reason: lexical_alternative
