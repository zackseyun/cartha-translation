translation:
  language: en
  text: Treat Ai and its king as you treated Jericho and its king. But this time, you may take the city’s goods and livestock as plunder for yourselves. Set up an ambush behind the city.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: you shall do to Ai and its king as you did to Jericho and its king
  simplified_phrase: Treat Ai and its king as you treated Jericho and its king
  preserved_meaning: Joshua must follow the same pattern used against Jericho and its king.
  reasoning_layer_used: The lexical decisions identify the Hebrew form as a directive and the comparison as the model from Jericho.
  rationale: The active verb “treat” expresses the command more naturally than “do to.”
- pob_phrase: its spoil and its livestock you may plunder for yourselves
  simplified_phrase: you may take the city’s goods and livestock as plunder for yourselves
  preserved_meaning: The Israelites are permitted to keep Ai’s captured property and domesticated animals.
  reasoning_layer_used: The lexical decisions define spoil as goods taken in war and retain the contextual force of permission.
  rationale: The new wording explains “spoil” while preserving the military image of plunder.
- pob_phrase: Set an ambush for yourself behind the city
  simplified_phrase: Set up an ambush behind the city
  preserved_meaning: Joshua must arrange a concealed force at the rear of Ai.
  reasoning_layer_used: The lexical decisions treat the participle as an ambush or ambushing force and the final phrase as a location.
  rationale: “Set up an ambush” is ordinary modern military English, and the command still addresses Joshua.
interpretive_expansions:
- pob_phrase: Only
  rendering: But this time
  claim: The permission to take plunder marks an exception to what happened at Jericho.
  evidence:
