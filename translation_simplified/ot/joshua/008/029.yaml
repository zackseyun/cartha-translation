translation:
  language: en
  text: Joshua hanged the king of Ai on a tree until evening.[a] At sunset, Joshua ordered them to take the corpse down from the tree. They threw it at the entrance to the city gate and piled a large heap of stones over him. That heap remains to this day.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “hung”; the Hebrew verb means “to hang/suspend” and does not specify impalement.
    reason: lexical_alternative
  - marker: b
    text: That is, it remained there until the narrator’s time.
    reason: simplification_note
simplification_decisions:
- pob_phrase: And he hanged the king of Ai
  simplified_phrase: Joshua hanged the king of Ai
  preserved_meaning: Joshua is the implied singular subject of the hanging.
  reasoning_layer_used: POB theological decision on narrative subject
  rationale: Naming Joshua removes an unclear pronoun without changing the chosen reading.
- pob_phrase: And at sunset Joshua commanded, and they took his corpse down
  simplified_phrase: At sunset, Joshua ordered them to take the corpse down
  preserved_meaning: Joshua gave the order at sunset, and others removed the corpse.
  reasoning_layer_used: Source syntax and POB lexical decisions
  rationale: Ordinary English preserves the distinction between Joshua’s order and their action.
- pob_phrase: they raised over him a large heap of stones that remains to this day
  simplified_phrase: They piled a large heap of stones over him. That heap remains to this day.
  preserved_meaning: They placed a substantial stone heap over the king, and it endured to the narrator’s time.
  reasoning_layer_used: POB lexical rationale and applied revision
  rationale: Two sentences clearly identify the action and what remained.
translation_notes:
  risk_flags:
  - risk: “Hanged” may suggest a more specific execution method than the Hebrew gives.
    mitigation: Footnote a preserves the broader lexical sense and excludes unwarranted impalement.
  - risk: Readers may understand “to this day” as the modern present.
    mitigation: Footnote b identifies the phrase as the narrator’s historical viewpoint.
