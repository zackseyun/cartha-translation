translation:
  language: en
  text: All Israel, including its elders, officers, and judges, stood on both sides of the ark, facing the Levitical priests who carried the ark of Yahweh’s covenant. Resident foreigners and native-born Israelites were included alike. Half the people faced Mount Gerizim, and the other half faced Mount Ebal. This was just as Moses, Yahweh’s servant, had commanded at first,[a] to bless the people of Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may mean “as the first act” or may refer to Moses’ earlier command about the blessing.
    reason: lexical_alternative
