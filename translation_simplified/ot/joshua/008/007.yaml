simplification_decisions:
- pob_phrase: rise up from the ambush
  simplified_phrase: rise from your ambush position
  preserved_meaning: The troops are to move out from the place where they have been lying in wait.
  reasoning_layer_used: The lexical decision for מֵהָאֹרֵב allows “ambush position” or “place of ambush.”
  rationale: The added word “position” makes the military movement clear.
- pob_phrase: take the city
  simplified_phrase: take possession of the city
  preserved_meaning: The troops are to seize the city and bring it under their control.
  reasoning_layer_used: The lexical decision for וְהוֹרַשְׁתֶּם emphasizes possession while recognizing “capture” as possible.
  rationale: This wording preserves the verb’s possession-oriented force.
- pob_phrase: give it into your hand
  simplified_phrase: give it into your hand
  preserved_meaning: Yahweh will place the city under the troops’ power.
  reasoning_layer_used: The lexical decision for בְּיֶדְכֶם preserves the Hebrew image of delivery into someone’s power.
  rationale: Keeping the singular collective “hand” retains the source idiom without obscuring it.
translation_notes:
  risk_flags:
  - risk: “Take possession” may sound broader than the immediate military capture.
    mitigation: The footnote preserves “capture the city” as a valid contextual alternative.
