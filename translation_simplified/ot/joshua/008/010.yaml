  text: Early that morning, Joshua assembled the people.[a] Then he and the elders of Israel went up to Ai ahead of the people.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean that Joshua counted or inspected the people; the military setting favors assembling them.
