translation:
  language: en
  text: Then Yahweh said to Joshua, “Do not be afraid or discouraged. Take all the fighting men with you. Get up and go up to Ai. Look, I have given you control over the king of Ai, his people, his city, and his land.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Do not fear and do not be dismayed
  simplified_phrase: Do not be afraid or discouraged
  preserved_meaning: Yahweh commands Joshua not to fear or lose courage.
  reasoning_layer_used: POB lexical decisions for ירא and חתת
  rationale: The approved alternatives express both prohibitions in familiar English.
- pob_phrase: Take with you all the fighting men, and arise, go up to Ai
  simplified_phrase: Take all the fighting men with you. Get up and go up to Ai.
  preserved_meaning: Joshua must bring the whole combat force, rise, and ascend to Ai.
  reasoning_layer_used: POB lexical and theological decisions for the military expression and two imperatives
  rationale: Two short sentences preserve the full force, masculine reference, and ascent command.
- pob_phrase: See, I have given into your hand
  simplified_phrase: Look, I have given you control over
  preserved_meaning: Yahweh has certainly placed Ai and its domain under Joshua’s power.
  reasoning_layer_used: POB lexical decision for ראה and נתתי בידך
  rationale: Natural English makes the hand idiom’s meaning clear while retaining the divine assurance.
