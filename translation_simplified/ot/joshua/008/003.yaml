translation:
  language: en
  text: Joshua and all the fighters got ready to go up against Ai. Joshua chose thirty thousand mighty warriors and sent them out at night.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Joshua and all the fighting people rose to go up against Ai
  simplified_phrase: Joshua and all the fighters got ready to go up against Ai
  preserved_meaning: Joshua and the whole fighting force began the action against Ai without stating that they all departed immediately.
  reasoning_layer_used: POB lexical decisions for וַיָּקָם, כָל עַם הַמִּלְחָמָה, and לַעֲלוֹת
  rationale: “Got ready” marks the beginning of action, while “go up against” keeps the hostile movement toward Ai.
- pob_phrase: thirty thousand men, mighty men of valor
  simplified_phrase: thirty thousand mighty warriors
  preserved_meaning: Joshua selected thirty thousand capable and valiant fighting men.
  reasoning_layer_used: POB lexical decision for גִּבּוֹרֵי הַחַיִל and doctrine-realignment revision
  rationale: “Mighty warriors” preserves the military force without the archaic phrase “men of valor.”
- pob_phrase: sent them out by night
  simplified_phrase: sent them out at night
  preserved_meaning: Joshua dispatched the selected warriors during the night.
  reasoning_layer_used: POB lexical decisions for וַיִּשְׁלָחֵם and לָיְלָה
  rationale: “At night” is common modern English and preserves the timing.
translation_notes:
  risk_flags:
  - risk: “Got ready” presents the beginning of the action as preparation rather than simply rising.
    mitigation: It avoids claiming immediate departure and remains bounded by the stated purpose of going against Ai.
