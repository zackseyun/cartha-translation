translation:
  language: en
  text: Joshua and all Israel let the enemy drive them back, and they fled along the road toward the wilderness.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “were defeated by the enemy.” In context, they were likely pretending to lose as part of the ambush plan.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may mean the road leading toward the wilderness or a route through it.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: let themselves be beaten before them
  simplified_phrase: let the enemy drive them back
  preserved_meaning: Israel appears to suffer defeat in front of its opponent while retaining the likely sense of a planned retreat.
  reasoning_layer_used: lexical decision for וַיִּנָּגְעוּ and narrative context
  rationale: “Drive them back” expresses the military action more naturally while “let” preserves its likely deliberate character.
- pob_phrase: by the way of the wilderness
  simplified_phrase: along the road toward the wilderness
  preserved_meaning: Israel fled on the route associated with the wilderness.
  reasoning_layer_used: lexical decision for דֶּרֶךְ הַמִּדְבָּר
  rationale: The new wording replaces the opaque phrase “by the way of” with ordinary directional English.
interpretive_expansions:
- pob_phrase: before them
  rendering: the enemy
  claim: The pronoun refers to the opposing force from Ai.
  evidence:
