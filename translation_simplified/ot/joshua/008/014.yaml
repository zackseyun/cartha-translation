translation:
  language: en
  text: When the king of Ai saw this, the men of the city—including the king and all his people—got up early and hurried out to fight Israel at the appointed place before the Arabah.[a] But he did not know that an ambush was waiting for him behind the city.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in front of the plain.” The Hebrew may refer to the Arabah region or more generally to a desert plain.
    reason: lexical_alternative
