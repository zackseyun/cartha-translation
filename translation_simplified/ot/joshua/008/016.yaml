translation:
  language: en
  text: Everyone in the city was called together[a] to chase them. They chased Joshua and were drawn away from the city.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “cried out”; here the Hebrew probably refers to being called together for the chase.
    reason: lexical_alternative
  - marker: b
