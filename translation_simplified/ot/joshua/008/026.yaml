translation:
  language: en
  text: Joshua kept his hand extended with the javelin until he had devoted everyone living in Ai to destruction.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “utterly destroyed everyone living in Ai.” The Hebrew verb refers to putting people or things under the ban by devoting them to destruction.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: did not draw back his hand, which he had stretched out with the javelin
  simplified_phrase: kept his hand extended with the javelin
  preserved_meaning: Joshua continued holding out his hand and weapon throughout the battle.
  reasoning_layer_used: Lexical decisions for הֵשִׁיב, יָדוֹ, נָטָה, and בַּכִּידוֹן
  rationale: The positive wording states the same continuous action more directly while preserving the raised-hand image and javelin.
- pob_phrase: all the inhabitants of Ai
  simplified_phrase: everyone living in Ai
  preserved_meaning: The statement includes all who dwelled in Ai.
  reasoning_layer_used: Lexical decision for כָּל יֹשְׁבֵי הָעָי
  rationale: Common wording replaces the formal term “inhabitants” without changing its scope.
translation_notes:
  risk_flags:
  - risk: “Devoted ... to destruction” remains less familiar than ordinary military language.
    mitigation: The wording preserves the covenantal judgment nuance, and the footnote gives the clearer lexical alternative.
