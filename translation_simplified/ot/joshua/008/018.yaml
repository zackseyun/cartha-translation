translation:
  language: en
  text: Then Yahweh said to Joshua, “Stretch out the javelin[a] in your hand toward Ai, because I will hand the city over to you.” Joshua then stretched out his javelin toward the city.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “spear”; the Hebrew term can refer to a javelin, spear, or lance.
    reason: lexical_alternative
