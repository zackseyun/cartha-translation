translation:
  language: en
  text: The Canaanites and everyone else living in the land will hear about this. They will surround us and wipe us out, so that our people and our name disappear from the earth. Then what will you do for the honor of your great name?
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: all the inhabitants of the land
  simplified_phrase: everyone else living in the land
  preserved_meaning: All the surrounding peoples, not the whole world, are included.
  reasoning_layer_used: lexical decision on וְכֹל יֹשְׁבֵי הָאָרֶץ
  rationale: Common wording replaces the formal noun “inhabitants” while preserving the local scope.
- pob_phrase: cut off our name from the earth
  simplified_phrase: wipe us out, so that our people and our name disappear from the earth
  preserved_meaning: Israel would cease to exist as a people and be erased from remembrance.
  reasoning_layer_used: lexical decision and cultural note on the Hebrew idiom
  rationale: The rewrite explains the idiom while retaining its forceful image of the name disappearing.
- pob_phrase: what will you do for your great name?
  simplified_phrase: what will you do for the honor of your great name?
  preserved_meaning: Joshua appeals to God's public reputation as bound up with Israel's fate.
  reasoning_layer_used: theological decision on God's great name
  rationale: Adding “honor” makes the appeal understandable without replacing the biblical term “name.”
interpretive_expansions:
- pob_phrase: will hear
  rendering: will hear about this
  claim: The surrounding peoples will hear about Israel's defeat.
  evidence:
