- pob_phrase: for your great name
  rendering: for the honor of your great name
  claim: God's name here includes his public honor among the nations.
  evidence:
  - The POB theological decision identifies God's public honor and reputation as the chosen reading.
  - The surrounding nations and Israel's threatened destruction supply the public setting.
  confidence: high
  alternatives_preserved:
  - for your great name
  - for the sake of your great name
translation_notes:
