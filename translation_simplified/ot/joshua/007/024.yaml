translation:
  language: en
  text: Then Joshua took Achan son of Zerah, along with the silver, the cloak, the gold bar,[a] his sons and daughters, his ox, his donkey, his flock, his tent, and everything that belonged to him. All Israel went with Joshua, and together they brought them all up to the Valley of Achor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew “tongue of gold,” meaning a tongue-shaped piece of gold; traditionally “a wedge of gold.”
    reason: lexical_alternative
  - marker: b
    text: Achor sounds like the Hebrew word for “trouble.”
    reason: cultural_note
