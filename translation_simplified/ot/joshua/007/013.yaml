  simplified_phrase: Set the people apart as holy ... Set yourselves apart as holy in preparation for tomorrow
  preserved_meaning: Both commands retain the shared idea of holy preparation for the next day.
  reasoning_layer_used: POB lexical decisions for קַדֵּשׁ, הִתְקַדְּשׁוּ, and לְמָחָר
  rationale: The wording explains “consecrate” while preserving its holy and reflexive force.
- pob_phrase: for thus says Yahweh
  simplified_phrase: This is what Yahweh ... says
  preserved_meaning: The statement remains a direct divine declaration using the personal name Yahweh.
  reasoning_layer_used: POB divine-name and discourse decisions
  rationale: The common English formula is easier to understand without changing the speaker or authority.
- pob_phrase: in your midst ... stand before your enemies ... remove ... from your midst
  simplified_phrase: among you ... stand against your enemies ... remove it from among you
  preserved_meaning: Israel cannot withstand its enemies until the banned object is removed from the community.
  reasoning_layer_used: POB lexical decisions and immediate narrative context
  rationale: Natural English replaces repeated formal phrasing while retaining the standing image and condition.
