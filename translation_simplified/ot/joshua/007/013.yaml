translation:
  language: en
  text: 'Get up. Set the people apart as holy, and tell them, “Set yourselves apart as holy in preparation for tomorrow. This is what Yahweh, the God of Israel, says: ‘Israel, there is something among you that has been devoted to destruction.[a] You cannot stand against your enemies until you remove it from among you.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term traditionally translated “the ban” or “the devoted thing” refers here to something placed under an irrevocable ban for destruction.
    reason: lexical_alternative
