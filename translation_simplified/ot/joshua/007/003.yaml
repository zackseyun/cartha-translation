translation:
  language: en
  text: They came back to Joshua and said, “Do not send everyone up there.[a] Send about two thousand men—or perhaps three thousand—to go up and attack Ai. Do not wear everyone out by sending them there, because Ai has only a few people.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “all the people,” which in this military setting may mean the whole fighting force.
    reason: lexical_alternative
