translation:
  language: en
  text: The men of Ai struck down about thirty-six of Israel’s men. They pursued the Israelites from the area in front of the gate all the way to Shebarim,[a] striking them down as they fled down the slope. The people lost their courage—their hearts melted and became like water.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may instead mean “the quarries” or “the broken places.”
    reason: alternative_reading
