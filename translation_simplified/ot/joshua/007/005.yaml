  preserved_meaning: Ai’s men chased Israel from the gate area to the stated destination.
  reasoning_layer_used: Lexical decisions for רדף, לפני, and שברים
  rationale: Ordinary spatial wording replaces the stiff phrase “from before” while retaining Shebarim and its ambiguity.
- pob_phrase: struck them down on the descent
