translation:
  language: en
  text: Joshua said, “Ah, Lord GOD![a] Why did you bring this people across the Jordan at all? Was it to hand us over to the Amorites and destroy us? If only we had chosen to settle on the other side of the Jordan!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew “Lord YHWH”; GOD represents the divine name without saying “Lord LORD.”
    reason: source_note
simplification_decisions:
- pob_phrase: to give us into the hand of the Amorites
  simplified_phrase: to hand us over to the Amorites
  preserved_meaning: Joshua fears being delivered into Amorite power.
  reasoning_layer_used: lexical decision for לָתֵת אֹתָנוּ בְּיַד הָאֱמֹרִי
  rationale: “Hand us over” clearly expresses the Hebrew power-and-control idiom.
- pob_phrase: we had been willing to dwell beyond the Jordan
  simplified_phrase: we had chosen to settle on the other side of the Jordan
  preserved_meaning: Joshua wishes they had willingly remained settled east of the Jordan.
  reasoning_layer_used: lexical decisions for הוֹאַלְנוּ, וַנֵּשֶׁב, and בְּעֵבֶר הַיַּרְדֵּן
  rationale: “Chosen to settle” preserves volition and settled residence without implying satisfaction.
- pob_phrase: why have you brought this people across the Jordan at all—to give us into the hand of the Amorites, to destroy us?
  simplified_phrase: Why did you bring this people across the Jordan at all? Was it to hand us over to the Amorites and destroy us?
  preserved_meaning: Joshua’s anguished question keeps both feared purposes under God’s act of bringing Israel across.
  reasoning_layer_used: lexical decision for הֵעֲבַרְתָּ הַעֲבִיר and independent grounding review
  rationale: Two questions clarify the lament without assigning the destruction specifically to the Amorites.
