translation:
  language: en
  text: Among the plunder I saw a beautiful cloak from Shinar, silver weighing two hundred shekels,[a] and a gold bar[b] weighing fifty shekels. I craved them and took them. Look! They are buried in the ground inside my tent, with the silver under the cloak.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A shekel was an ancient unit of weight.
    reason: cultural_note
  - marker: b
    text: Hebrew literally says “a tongue of gold,” probably meaning a tongue-shaped piece of gold.
    reason: lexical_alternative
  - marker: c
    text: Hebrew says “under it”; the pronoun most likely refers to the cloak.
    reason: lexical_alternative
