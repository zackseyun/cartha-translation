translation:
  language: en
  text: The person found with the devoted thing[a] must be burned with fire, together with everything that belongs to him, because he has broken Yahweh’s covenant and committed an outrageous act in Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally, “the accursed thing”; the Hebrew refers to something devoted to God by being placed under a ban and set apart for destruction.
    reason: lexical_alternative
