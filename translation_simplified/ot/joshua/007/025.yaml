translation:
  language: en
  text: Joshua said, “Why did you bring trouble on us? Today Yahweh will bring trouble on you.” Then all Israel stoned him. They burned them with fire and stoned them.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew shifts from “him” to “them,” possibly including Achan’s household or possessions; it does not specify further.
    reason: alternative_reading
  - marker: b
    text: The Hebrew uses two different verbs for stoning, but both are translated “stoned” here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Why have you troubled us? Yahweh will trouble you this day.
  simplified_phrase: Why did you bring trouble on us? Today Yahweh will bring trouble on you.
  preserved_meaning: Joshua declares that the trouble Achan caused will now return upon him from Yahweh.
  reasoning_layer_used: Lexical decision for עכר and בַּיּוֹם הַזֶּה
  rationale: The repeated phrase “bring trouble” keeps the Hebrew wordplay while “today” makes the timing natural.
- pob_phrase: all Israel stoned him with stones
  simplified_phrase: all Israel stoned him
  preserved_meaning: All Israel carried out execution by throwing stones at Achan.
  reasoning_layer_used: Lexical decision for רגם
  rationale: The verb “stoned” already communicates the use of stones, so the redundant instrument is omitted.
- pob_phrase: they burned them with fire and stoned them with stones
  simplified_phrase: They burned them with fire and stoned them.
  preserved_meaning: The plural objects underwent burning and stoning, though their identity remains unresolved.
  reasoning_layer_used: Theological decision on the singular-to-plural shift and lexical decisions for שרף and סקל
  rationale: Natural English removes one redundancy while preserving both actions and the unexplained plural.
translation_notes:
  risk_flags:
  - risk: Modern readers may not know whom the plural “them” includes.
    mitigation: Footnote a preserves the ambiguity and gives only the possibilities supported by the context.
  - risk: Repeating “stoned” may sound awkward after the burning.
    mitigation: Footnote b explains that the source deliberately uses two stoning verbs.
