translation:
  language: en
  text: In the morning, present yourselves tribe by tribe. The tribe Yahweh selects[a] must come forward clan by clan. The clan Yahweh selects must come forward household by household. The household Yahweh selects must come forward man by man.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb can mean “takes,” “captures,” or “seizes.” Here it means the group or person Yahweh identifies, likely by sacred lot.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: you shall come near by your tribes
  simplified_phrase: present yourselves tribe by tribe
  preserved_meaning: Israel must formally appear before Yahweh in an ordered sequence of tribes.
  reasoning_layer_used: The lexical decision allows “present yourselves” and identifies a formal approach for identification.
  rationale: This wording makes the commanded procedure immediately clear.
- pob_phrase: and it shall be that the tribe that Yahweh selects shall come near by clans
  simplified_phrase: The tribe Yahweh selects must come forward clan by clan
  preserved_meaning: Yahweh identifies one tribe, whose clans then appear in order.
  reasoning_layer_used: The lexical decisions preserve divine selection, clan structure, and distributive grouping.
  rationale: The shorter sentence replaces the formal formula without changing the sequence.
- pob_phrase: shall come near by households ... shall come near man by man
  simplified_phrase: must come forward household by household ... must come forward man by man
  preserved_meaning: The process narrows from clans to households and finally to individual adult males.
  reasoning_layer_used: The lexical decisions distinguish households from clans and retain the masculine distributive force.
  rationale: Repeated plain wording keeps each stage distinct and easy to follow.
translation_notes:
  risk_flags:
  - risk: “Come forward” is less literal than the repeated image “come near.”
    mitigation: The staged formal presentation before Yahweh remains explicit throughout.
  - risk: Modern readers may assume “selects” describes an unexplained direct announcement.
    mitigation: The footnote preserves the verb’s range and cautiously notes the likely use of sacred lot.
