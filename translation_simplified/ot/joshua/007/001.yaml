translation:
  language: en
  text: But the Israelites were unfaithful concerning the things set apart for destruction.[a] This was because Achan, from the tribe of Judah, took some of them. He was the son of Carmi, grandson of Zabdi, and great-grandson of Zerah. So Yahweh’s anger burned against the Israelites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the devoted things,” or formally “the ban”; these things were set apart to God for destruction or removal from ordinary use.
    reason: lexical_alternative
