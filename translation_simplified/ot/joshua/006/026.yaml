translation:
  language: en
  text: At that time Joshua put the people under oath. He said, “Anyone who sets out to rebuild this city, Jericho, is cursed before Yahweh. Laying its foundation will cost him his firstborn, and setting up its gates will cost him his youngest.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “with/in his firstborn ... with/in his youngest”; the wording indicates their loss but does not say exactly how it will happen.
    reason: lexical_alternative
