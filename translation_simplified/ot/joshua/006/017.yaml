translation:
  language: en
  text: The city and everything in it must be given over to the LORD by being destroyed.[a] Only Rahab the prostitute will live, along with everyone who is with her in the house, because she hid the messengers we sent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term means irrevocably devoted to the LORD, here through destruction; it is sometimes translated “under the ban.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: shall be devoted to destruction for Yahweh
  simplified_phrase: must be given over to the LORD by being destroyed
  preserved_meaning: The city is irrevocably devoted to the LORD through destruction.
  reasoning_layer_used: Lexical and theological decisions for חֵרֶם and לַיהוָה
  rationale: The wording explains both dedication and destruction in common English.
- pob_phrase: Only Rahab the prostitute shall live, she and all who are with her in the house
  simplified_phrase: Only Rahab the prostitute will live, along with everyone who is with her in the house
  preserved_meaning: Rahab and those physically gathered with her are the sole exception.
  reasoning_layer_used: Lexical decisions for רַק, תִּחְיֶה, and אִתָּהּ בַּבַּיִת
  rationale: The recast sentence removes the awkward repeated pronoun without weakening the exception.
