  text: Seven priests carried seven ram’s-horn trumpets[a] and marched in front of the ark of Yahweh. They kept blowing the trumpets as they went. The armed men marched ahead of the priests, and the rear guard marched behind the ark.
  philosophy: optimal-equivalence
