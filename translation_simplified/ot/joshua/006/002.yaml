  text: Yahweh said to Joshua, “See, I have handed Jericho over to you, along with its king and its mighty warriors.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And Yahweh said to Joshua
  simplified_phrase: Yahweh said to Joshua
  preserved_meaning: Yahweh directly addresses Joshua as the narrative continues.
  reasoning_layer_used: POB lexical decision for וַיֹּאמֶר
  rationale: The opening “And” is omitted because English narrative flow does not require it here.
- pob_phrase: I have given Jericho into your hand
  simplified_phrase: I have handed Jericho over to you
  preserved_meaning: Yahweh declares Jericho to be under Joshua’s power with victory treated as certain.
  reasoning_layer_used: POB lexical and theological decisions for נָתַתִּי and בְיָדְךָ
  rationale: “Handed over” makes the Hebrew power idiom natural while retaining its hand image and completed force.
- pob_phrase: the mighty men of valor
  simplified_phrase: its mighty warriors
  preserved_meaning: The king’s strong and capable fighting men are included in Yahweh’s grant.
  reasoning_layer_used: POB lexical decision for גִּבּוֹרֵי הֶחָיִל
  rationale: “Mighty warriors” clearly expresses both strength and military prowess without the archaic phrase “men of valor.”
