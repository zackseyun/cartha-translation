translation:
  language: en
  text: So the young men who were spies went in and brought out Rahab, her father and mother, her brothers, and everyone in her household.[a] They also brought out all her extended family and placed them outside Israel’s camp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may include everything that belonged to her, though the context points mainly to people in her household.
    reason: lexical_alternative
