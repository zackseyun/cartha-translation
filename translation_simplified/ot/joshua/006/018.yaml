translation:
  language: en
  text: But you must stay away from what is devoted to destruction.[a] Do not take any of it, or you yourselves will become devoted to destruction.[b] You will also make Israel’s camp devoted to destruction and bring trouble on it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This means anything irrevocably devoted to God to be destroyed.
    reason: lexical_alternative
  - marker: b
    text: Or “you will put yourselves under the ban.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: But as for you, keep yourselves from
  simplified_phrase: But you must stay away from
  preserved_meaning: The direct, emphatic warning remains strong and contrastive.
  reasoning_layer_used: Lexical decisions for וְרַק, אַתֶּם, and שִׁמְרוּ
  rationale: Common wording replaces a formal reflexive construction without weakening the command.
- pob_phrase: and take some of what is devoted to destruction
  simplified_phrase: Do not take any of it
  preserved_meaning: Israel must take nothing from what God has devoted to destruction.
  reasoning_layer_used: Lexical decision for וּלְקַחְתֶּם מִן־הַחֵרֶם
  rationale: A direct command makes the prohibited action immediately clear.
- pob_phrase: and make the camp of Israel devoted to destruction, and bring trouble on it
  simplified_phrase: You will also make Israel’s camp devoted to destruction and bring trouble on it
  preserved_meaning: Disobedience would expose the whole camp to judgment and trouble without implying a later step.
  reasoning_layer_used: Lexical decisions for וְשַׂמְתֶּם, מַחֲנֵה יִשְׂרָאֵל, and וַעֲכַרְתֶּם אֹתוֹ
  rationale: “Also” preserves the coordinated communal consequences without adding chronology.
