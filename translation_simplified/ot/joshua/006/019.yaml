translation:
  language: en
  text: But all the silver and gold, and every object made of bronze or iron, is set apart as holy for Yahweh. It must go into Yahweh’s treasury.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the vessels of bronze and iron
  simplified_phrase: every object made of bronze or iron
  preserved_meaning: All bronze and iron articles are included, not only containers.
  reasoning_layer_used: Lexical decision for כְּלִי as a broad term for objects or implements.
  rationale: “Object” avoids the misleading modern sense of “vessel.”
- pob_phrase: are holy to Yahweh
  simplified_phrase: is set apart as holy for Yahweh
  preserved_meaning: The metals and objects form one collective whole consecrated to Yahweh.
  reasoning_layer_used: Source grammar and the lexical rationale for קֹדֶשׁ הוּא לַיהוָה.
  rationale: The wording explains consecration while retaining the key concept of holiness.
- pob_phrase: they shall go into the treasury of Yahweh
  simplified_phrase: It must go into Yahweh’s treasury
  preserved_meaning: The whole collection is required to enter the treasury belonging to Yahweh.
  reasoning_layer_used: Source singular יָבֹוא and the lexical decision for אוֹצַר יְהוָה.
  rationale: A separate sentence makes the command clear and preserves the Hebrew collective singular.
interpretive_expansions:
- pob_phrase: holy to Yahweh
  rendering: set apart as holy for Yahweh
  claim: Here holiness means that these goods are reserved for Yahweh.
  evidence:
  - The POB rationale identifies a consecratory force in the phrase.
  confidence: high
  alternatives_preserved:
  - holy to Yahweh
  - belongs as holy to Yahweh
translation_notes:
  risk_flags:
  - risk: “Must go” makes the verse’s required outcome more explicit than the Hebrew motion verb alone.
    mitigation: The preceding prohibition and POB’s “shall go” support an obligatory sense without naming an agent.
