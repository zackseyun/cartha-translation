translation:
  language: en
  text: The people shouted and blew the trumpets. When they heard the sound of the trumpet, they gave a mighty shout. The wall fell down,[a] and the people went up into the city, each man moving straight ahead. They captured the city.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says that the wall “fell beneath itself,” an unusual expression that may mean it collapsed straight down.
    reason: lexical_alternative
