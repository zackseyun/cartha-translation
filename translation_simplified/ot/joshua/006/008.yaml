translation:
  language: en
  text: After Joshua spoke to the people, the seven priests carrying the seven ram’s-horn trumpets[a] moved forward before Yahweh[b] and blew the trumpets. The ark of Yahweh’s covenant followed behind them.
  philosophy: optimal-equivalence
  footnotes:
