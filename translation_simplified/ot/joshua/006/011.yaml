translation:
  language: en
  text: So the ark of Yahweh went around the city once.[a] Then they entered the camp and spent the night there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew presents the ark as going around the city, though the priests carried it.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: went around the city, circling it once
  simplified_phrase: went around the city once
  preserved_meaning: The ark completed one movement around the city.
  reasoning_layer_used: Lexical decisions for וַיַּסֵּב, הַקֵּף, and פַּעַם אֶחָת
  rationale: The shorter wording removes repetition while keeping the single circling action.
- pob_phrase: came into the camp
  simplified_phrase: entered the camp
  preserved_meaning: They moved into Israel's camp.
  reasoning_layer_used: Lexical decision for וַיָּבֹאוּ
  rationale: “Entered” expresses the stated destination in direct modern English.
- pob_phrase: spent the night in the camp
  simplified_phrase: spent the night there
  preserved_meaning: They stayed overnight in the camp.
  reasoning_layer_used: Lexical decisions for וַיָּלִינוּ and בַּמַּחֲנֶה
  rationale: “There” avoids awkward repetition because the camp has just been named.
