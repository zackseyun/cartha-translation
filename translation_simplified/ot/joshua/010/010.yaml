translation:
  language: en
  text: Yahweh threw them into confusion in front of Israel.[a] He inflicted a great slaughter on them at Gibeon, then pursued them along the road that climbs to Beth-horon. He continued striking them down as far as Azekah and Makkedah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “threw them into panic.” The Hebrew describes confusion or panic in battle.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: before Israel
  simplified_phrase: in front of Israel
  preserved_meaning: The enemies were thrown into confusion before Israel without limiting the phrase to confrontation, sight, or advantage.
  reasoning_layer_used: POB lexical decision and grounding review
  rationale: This uses ordinary English while preserving the Hebrew phrase’s documented range.
- pob_phrase: by the way of the ascent of Beth-horon
  simplified_phrase: along the road that climbs to Beth-horon
  preserved_meaning: The pursuit followed the uphill road toward Beth-horon.
  reasoning_layer_used: POB lexical decision on topography
  rationale: The concrete road and upward climb remain clear in natural English.
- pob_phrase: and pursued them ... and struck them down
  simplified_phrase: then pursued them ... He continued striking them down
  preserved_meaning: Yahweh pursued the enemy and kept striking them down over the stated distance.
  reasoning_layer_used: POB lexical decisions and doctrine realignment
  rationale: Separate clauses clarify the sequence while retaining divine agency and violent finality.
translation_notes:
  risk_flags:
  - risk: “In front of Israel” may be read only as a spatial description.
    mitigation: It avoids narrowing the phrase to active confrontation and leaves its presence or advantage nuances open.
