translation:
  language: en
  text: “Come up here and help me. Together, let us attack Gibeon, because it has made peace[a] with Joshua and the sons of Israel[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “has made an alliance with.” The Hebrew can refer to peaceful relations or treaty peace.
    reason: lexical_alternative
  - marker: b
    text: That is, the Israelites or the people of Israel.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Come up to me and help me
  simplified_phrase: Come up here and help me
  preserved_meaning: The rulers are commanded to approach the speaker and give him aid.
  reasoning_layer_used: Lexical decision for עֲלוּ אֵלַי
  rationale: “Here” makes the speaker-centered direction natural while retaining the upward approach.
- pob_phrase: and let us strike Gibeon
  simplified_phrase: Together, let us attack Gibeon
  preserved_meaning: The speaker urges the group to join him in military action against Gibeon.
  reasoning_layer_used: Lexical decision for וְנַכֶּה
  rationale: “Attack” states the military sense clearly, while “let us” preserves the shared appeal.
- pob_phrase: the sons of Israel
  simplified_phrase: the sons of Israel
  preserved_meaning: The Hebrew familial expression identifies Israel’s covenant people as a nation.
  reasoning_layer_used: Theological decision for בני ישראל
  rationale: The phrase is retained because POB deliberately preserves its masculine familial wording.
translation_notes:
  risk_flags:
  - risk: “Attack” is less image-based than the literal “strike.”
    mitigation: It preserves the documented military sense without adding a narrower kind of violence.
  - risk: Modern readers may not recognize “sons of Israel” as a national designation.
    mitigation: A brief footnote identifies them as the Israelites or people of Israel.
