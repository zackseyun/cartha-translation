translation:
  language: en
  text: Joshua said to them, “Do not be afraid, and do not lose heart. Be strong and courageous, because this is what Yahweh will do to every enemy you fight.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Do not fear and do not be dismayed
  simplified_phrase: Do not be afraid, and do not lose heart
  preserved_meaning: The two commands still forbid both fear and the collapse of resolve.
  reasoning_layer_used: POB lexical decisions for ירא and חתת
  rationale: Common expressions replace formal wording without merging the two Hebrew ideas.
- pob_phrase: for thus Yahweh will do
  simplified_phrase: because this is what Yahweh will do
  preserved_meaning: Joshua points to Yahweh’s demonstrated action as the reason for courage.
  reasoning_layer_used: POB lexical decision for כִּי כָכָה and theological decision for יְהוָה
  rationale: The causal link and demonstrative force become clear while the divine name remains Yahweh.
- pob_phrase: to all your enemies against whom you are fighting
  simplified_phrase: to every enemy you fight
  preserved_meaning: Yahweh will act against all the enemies Israel fights.
  reasoning_layer_used: POB lexical decisions for לְכָל אֹיְבֵיכֶם and אֲשֶׁר אַתֶּם נִלְחָמִים אוֹתָם
  rationale: The shorter English clause removes awkward repetition while keeping the full scope and conflict.
