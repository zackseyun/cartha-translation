translation:
  language: en
  text: But you must not stop. Chase your enemies and attack those at the rear.[a] Do not let them enter their cities, because Yahweh your God has handed them over to you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew pictures striking the tail end of a fleeing army, including those who fall behind.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: But as for you, do not stand still
  simplified_phrase: But you must not stop
  preserved_meaning: The troops are emphatically ordered to continue the pursuit.
  reasoning_layer_used: POB lexical decision for וְאַתֶּם and אַל תַּעֲמֹדוּ
  rationale: This recasts the contrast and military command in direct modern English.
- pob_phrase: pursue your enemies and strike their rear guard
  simplified_phrase: Chase your enemies and attack those at the rear
  preserved_meaning: They must pursue the fleeing force and strike its hindmost part.
  reasoning_layer_used: POB lexical decision and footnote for רִדְפוּ and וְזִנַּבְתֶּם
  rationale: The wording avoids suggesting that a formal rear-guard unit is necessarily meant.
- pob_phrase: has given them into your hand
  simplified_phrase: has handed them over to you
  preserved_meaning: Yahweh has placed the enemies under Israel's power and made victory certain.
  reasoning_layer_used: POB lexical decision for כִּי נְתָנָם and בְּיֶדְכֶם
  rationale: The natural English idiom preserves both divine action and the force of the hand image.
