translation:
  language: en
  text: They captured the city. With the sword, they struck the city, its king, all its towns, and everyone in it. Joshua left no survivor, just as he had done at Eglon. He devoted the city and everyone in it to destruction.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “He utterly destroyed the city and everyone in it.” The Hebrew describes devoting them to destruction.
    reason: lexical_alternative
