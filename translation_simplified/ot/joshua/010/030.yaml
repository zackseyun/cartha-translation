- pob_phrase: gave it and its king into the hand of Israel
  simplified_phrase: handed the city and its king over to Israel
  preserved_meaning: Yahweh placed the city and its king under Israel’s power.
  reasoning_layer_used: POB lexical decision on וַיִּתֵּן ... בְּיַד יִשְׂרָאֵל
  rationale: The common phrase “handed over” clearly expresses the Hebrew power-transfer idiom.
- pob_phrase: every person who was in it
  simplified_phrase: everyone in it
  preserved_meaning: The statement includes all people within the city rather than referring to immaterial souls.
  reasoning_layer_used: POB lexical and theological decisions on נֶפֶשׁ
  rationale: “Everyone” is concise modern English and avoids a misleading doctrinal sense of “soul.”
- pob_phrase: he did to its king just as he had done to the king of Jericho
  simplified_phrase: He treated its king just as he had treated the king of Jericho
  preserved_meaning: The city’s king received the same treatment as Jericho’s king.
  reasoning_layer_used: POB lexical decision on the comparative עשה formula
  rationale: “Treated” makes the comparison natural without adding details not stated here.
