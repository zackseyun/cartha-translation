    mitigation: The text directly repeats that the sun stood still, preserving the narrative’s extraordinary claim.
  - risk: “About a full day” could suggest more precision than the Hebrew comparative phrase.
    mitigation: “About” limits precision, and footnote c preserves “nearly a full day.”
