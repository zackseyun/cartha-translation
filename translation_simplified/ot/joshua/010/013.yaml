  reasoning_layer_used: POB lexical decision for עַד יִקֹּם גּוֹי אֹיְבָיו
  rationale: The past perfect makes the sequence clear while the footnote preserves the idiom’s alternatives.
- pob_phrase: Is this not written in the Book of Jashar?
