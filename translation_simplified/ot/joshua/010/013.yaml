- pob_phrase: The sun stood still in the middle of the sky and did not hurry to set
  simplified_phrase: The sun stood still in the middle of the sky and did not hurry to set
  preserved_meaning: The repeated statement emphasizes that the sun stopped and its setting was extraordinarily delayed.
  reasoning_layer_used: POB lexical decisions and theological decision on the astronomical miracle
  rationale: Keeping “stood still” preserves the repeated assertion of stopped motion and the vivid delayed-setting image.
translation_notes:
  risk_flags:
