translation:
  language: en
  text: The sun stood still, and the moon stopped, until the nation had taken vengeance on its enemies.[a] Is this not recorded in the Book of Jashar?[b] The sun stood still in the middle of the sky and did not hurry to set for about a full day.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean that the nation avenged itself on its enemies or was vindicated against them.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew title may also be translated “the Book of the Upright.”
    reason: alternative_reading
  - marker: c
    text: Or “nearly a full day.”
    reason: lexical_alternative
