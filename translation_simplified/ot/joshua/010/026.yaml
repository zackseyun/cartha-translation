translation:
  language: en
  text: Afterward, Joshua struck them down and put them to death. Then he hung their bodies on five trees,[a] and they stayed there until evening.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew describes suspending the bodies on trees or wood. “Impaled” is possible, but less certain.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: After this Joshua struck them down and put them to death, and he hanged them
  simplified_phrase: Afterward, Joshua struck them down and put them to death. Then he hung their bodies
  preserved_meaning: Joshua struck them before executing them and then displayed their bodies.
  reasoning_layer_used: POB lexical decisions for וַיַּכֵּם, וַיְמִיתֵם, and וַיִּתְלֵם
  rationale: Two sentences clarify the sequence while keeping the striking and execution distinct.
- pob_phrase: they remained hanging on the trees until the evening
  simplified_phrase: they stayed there until evening
  preserved_meaning: The bodies continued hanging on the trees through the stated endpoint.
  reasoning_layer_used: POB lexical decisions for וַיִּהְיוּ תְּלוּיִם and עַד הָעָרֶב
  rationale: “Stayed there” expresses the continuing state in more natural English without repeating “hanging.”
interpretive_expansions:
- pob_phrase: he hanged them
  rendering: he hung their bodies
  claim: The hanging followed their deaths and was therefore the display of their bodies.
  evidence:
