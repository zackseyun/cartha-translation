translation:
  language: en
  text: Joshua struck the entire region—the hill country, the Negev,[a] the lowland, and the slopes—and all its kings. He left no survivors. He devoted every breathing thing to destruction,[b] just as Yahweh, the God of Israel, had commanded.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Negev is the dry southern region of the land.
    reason: cultural_note
  - marker: b
    text: The Hebrew term means devoting something irrevocably to destruction; it can also be translated “put under the ban.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: all the land
  simplified_phrase: the entire region
  preserved_meaning: The statement covers the whole territory discussed here, not the entire earth.
  reasoning_layer_used: POB lexical decision for כָּל הָאָרֶץ
  rationale: “Region” makes the geographic scope clear to modern readers.
- pob_phrase: He left no survivor
  simplified_phrase: He left no survivors
  preserved_meaning: No survivor remained from the targeted population.
  reasoning_layer_used: POB lexical decision for לֹא הִשְׁאִיר שָׂרִיד
  rationale: The plural is more natural in modern English without changing the total scope.
- pob_phrase: but devoted to destruction every breathing thing
  simplified_phrase: He devoted every breathing thing to destruction
  preserved_meaning: Joshua placed everything that breathed irrevocably under destruction.
  reasoning_layer_used: POB lexical and theological decisions for כָּל הַנְּשָׁמָה and הֶחֱרִים
  rationale: A separate sentence and ordinary word order improve clarity while preserving both the breathing image and the charged warfare language.
