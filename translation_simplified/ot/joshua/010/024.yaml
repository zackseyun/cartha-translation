translation:
  language: en
  text: When these kings were brought out to Joshua, he called together all the men of Israel who were there with the army. He said to the army commanders who had gone with him, “Come forward and put your feet on the necks of these kings.” They came forward and put their feet on the kings’ necks.
  philosophy: optimal-equivalence
