  simplified_phrase: When these kings were brought out to Joshua
  preserved_meaning: The kings were brought before Joshua at this point in the sequence.
  reasoning_layer_used: The lexical decision treats the Hebrew narrative formula as a temporal clause.
  rationale: The passive wording avoids an unclear pronoun while keeping the same event.
- pob_phrase: the commanders of the men of war
  simplified_phrase: the army commanders
  preserved_meaning: Joshua addressed the military leaders who had accompanied him.
  reasoning_layer_used: The lexical decision identifies these men as commanders in a military setting.
  rationale: The shorter modern expression clearly conveys their role.
- pob_phrase: Come near
  simplified_phrase: Come forward
  preserved_meaning: Joshua ordered the commanders to approach physically.
  reasoning_layer_used: The lexical alternatives permit “Come forward” for the imperative.
  rationale: “Come forward” sounds more natural for approaching in an assembled group.
