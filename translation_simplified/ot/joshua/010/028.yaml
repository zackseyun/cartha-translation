translation:
  language: en
  text: That same day, Joshua captured Makkedah. He struck the city with the edge of the sword and devoted its king and everyone in it to destruction.[a] He left no survivors. He treated the king of Makkedah just as he had treated the king of Jericho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Devoted to destruction” means placed under the ban of destruction; it can also be translated “utterly destroyed.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And Joshua captured Makkedah on that day and struck it with the edge of the sword
  simplified_phrase: That same day, Joshua captured Makkedah. He struck the city with the edge of the sword
  preserved_meaning: Joshua took and attacked the city while the sword-edge image remains intact.
  reasoning_layer_used: Lexical decisions for לָכַד, וַיַּכֶּהָ, and לְפִי חֶרֶב
  rationale: Two sentences make the military sequence easier to follow.
- pob_phrase: its king and every person in it
  simplified_phrase: its king and everyone in it
  preserved_meaning: The destruction included the king and all the city's people.
  reasoning_layer_used: Lexical decision for כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  rationale: “Everyone” is more natural than “every person” without changing the scope.
- pob_phrase: he did to the king of Makkedah just as he had done to the king of Jericho
  simplified_phrase: He treated the king of Makkedah just as he had treated the king of Jericho
  preserved_meaning: The king received the same treatment as Jericho's king.
  reasoning_layer_used: Lexical alternative recorded for עשה + ל
  rationale: “Treated” makes the terse Hebrew comparison immediately clear without specifying the action further.
