translation:
  language: en
  text: Then, on the day Yahweh gave the Amorites over to the Israelites, Joshua spoke to Yahweh. In front of Israel he said, “Sun, stand still[a] at Gibeon, and moon, stand still in the Valley of Aijalon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb may also mean “be still” or “stop.”
