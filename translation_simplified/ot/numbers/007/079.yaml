translation:
  language: en
  text: His offering was one silver plate[a] weighing 130 shekels and one silver basin[b] weighing 70 shekels. The weights were measured by the sanctuary’s official standard.[c] Both vessels were filled with fine flour mixed with oil for a grain offering.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word may also mean a silver bowl; the vessel’s exact shape is uncertain.
    reason: lexical_alternative
  - marker: b
    text: The basin may have been a bowl used for ritual sprinkling.
    reason: lexical_alternative
  - marker: c
    text: A shekel was a unit of weight; the sanctuary shekel was the official standard used here.
    reason: cultural_note
