  simplified_phrase: Moses gave the sons of Kohath no carts or oxen
  preserved_meaning: The Kohathites received none of the transportation equipment given to the other Levitical clans.
  reasoning_layer_used: lexical decision and immediate context
  rationale: Naming the giver and the items makes the implied references clear.
- pob_phrase: the service of the holy things was upon them
  simplified_phrase: They were responsible for the holy objects
  preserved_meaning: The Kohathites were assigned the duty of handling the sacred furnishings.
  reasoning_layer_used: lexical decision
  rationale: This replaces a difficult Hebrew-shaped obligation idiom with ordinary English.
- pob_phrase: they were to carry them on the shoulder
  simplified_phrase: had to carry them on their shoulders
  preserved_meaning: Their assigned duty required personal shoulder-borne transport.
  reasoning_layer_used: lexical decision
  rationale: The plural wording is natural English while preserving the physical image and obligation.
