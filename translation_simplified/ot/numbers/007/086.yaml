translation:
  language: en
  text: There were twelve gold dishes[a] filled with incense. Each one weighed ten shekels[b] by the official sanctuary standard. Together, the dishes weighed 120 shekels in gold.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The incense vessels may also be called pans or bowls; older translations call them spoons.
    reason: lexical_alternative
  - marker: b
    text: Here a shekel is a unit of weight, measured by the sanctuary’s official standard.
    reason: cultural_note
