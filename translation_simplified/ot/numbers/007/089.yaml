translation:
  language: en
  text: When Moses entered the tent of meeting to speak with the LORD, he heard the voice speaking to him from above the mercy seat—the cover on the ark of the testimony—and from between the two cherubim. Then the LORD spoke to Moses.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be understood as “Then the voice spoke to him.”
    reason: alternative_reading
