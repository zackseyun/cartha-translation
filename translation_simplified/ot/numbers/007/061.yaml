    reason: lexical_alternative
  - marker: b
    text: Or “bowl”; this was a vessel used in sanctuary service.
    reason: lexical_alternative
  - marker: c
    text: Here shekels are units of weight, measured according to the sanctuary’s standard.
    reason: cultural_note
