  text: His offering was one silver plate[a] weighing 130 shekels and one silver basin[b] weighing 70 shekels, measured by the sanctuary’s standard weight.[c] Both vessels were filled with fine flour mixed with oil for a grain offering.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
