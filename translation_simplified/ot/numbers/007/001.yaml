translation:
  language: en
  text: When[a] Moses finished setting up the tabernacle, he anointed it and set it apart for holy use. He did the same with all the tabernacle’s furnishings, the altar, and all the altar’s utensils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “On the day Moses finished setting up the tabernacle.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And it happened on the day Moses finished
  simplified_phrase: When Moses finished
  preserved_meaning: The clause still marks the completion of the tabernacle as the time of the following actions.
  reasoning_layer_used: POB lexical decision and footnote on the Hebrew temporal expression
  rationale: The documented idiomatic alternative is easier to read and the footnote preserves the Hebrew form.
- pob_phrase: consecrated it
  simplified_phrase: set it apart for holy use
  preserved_meaning: The objects were ritually dedicated as holy rather than morally changed.
  reasoning_layer_used: POB theological decision on cultic holiness terminology
  rationale: The plain phrase explains the ritual meaning of “consecrated” without weakening it.
- pob_phrase: along with all its furnishings, and the altar with all its utensils; he anointed them and consecrated them
  simplified_phrase: He did the same with all the tabernacle’s furnishings, the altar, and all the altar’s utensils
  preserved_meaning: Moses both anointed and consecrated every listed sanctuary object.
  reasoning_layer_used: POB lexical decisions for the two occurrences of כָּל כֵּלָיו and the resumptive plural
  rationale: A second sentence and explicit possessors make the object groups easier to follow.
interpretive_expansions:
- pob_phrase: consecrated
  rendering: set it apart for holy use
  claim: Consecration here means ritual dedication for holy use.
  evidence:
  - The POB theological decision identifies cultic holiness rather than moral transformation.
  - The immediate context concerns the tabernacle, its furnishings, the altar, and its utensils.
  confidence: high
  alternatives_preserved:
  - consecrated
  - made holy
translation_notes:
  risk_flags:
  - risk: “He did the same” compresses the Hebrew repetition of both ritual actions.
    mitigation: The immediately preceding clause names both anointing and setting apart, so both actions remain clear.
