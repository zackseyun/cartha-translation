translation:
  language: en
  text: His offering was a silver plate weighing 130 shekels and a silver basin weighing 70 shekels, measured by the sanctuary’s standard.[a] Both vessels were filled with fine flour mixed with oil for a grain offering.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here a shekel is a unit of weight; these weights were measured by the sanctuary’s standard.
    reason: cultural_note
