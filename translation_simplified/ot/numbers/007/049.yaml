  reasoning_layer_used: POB lexical decisions for both weight clauses
  rationale: Direct weight phrases make the inventory easier to follow without hiding the ancient unit.
- pob_phrase: according to the sanctuary shekel
  simplified_phrase: using the sanctuary shekel as the standard
