translation:
  language: en
  text: His offering was one silver plate[b] weighing 130 shekels and one silver basin weighing 70 shekels, using the sanctuary shekel as the standard.[a] Both vessels were filled with fine flour mixed with oil for a grain offering.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A shekel was an ancient unit of weight; here the sanctuary shekel supplied the standard.
    reason: cultural_note
  - marker: b
    text: Or “dish” for “plate,” and “bowl” for “basin.”
    reason: lexical_alternative
