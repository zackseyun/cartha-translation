translation:
  language: en
  text: I see him—but not now. I look at him—but he is not near. A star has come forth from Jacob, and a scepter has risen from Israel.[a] It will crush the corners of Moab[b] and tear down all the sons of Sheth.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The star and scepter are royal images that may point to a coming ruler.
    reason: simplification_note
  - marker: b
    text: “The corners of Moab” is a figurative expression that may refer to Moab’s outer reaches or its strength.
    reason: cultural_note
  - marker: c
    text: Or “all the sons of Seth.” The Hebrew is uncertain; some understand it more broadly as humanity or a hostile people.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: I behold him, but not near
  simplified_phrase: I look at him—but he is not near
  preserved_meaning: The second act of prophetic sight remains distinct, while “near” keeps its temporal or spatial nuance.
  reasoning_layer_used: lexical decisions for אֲשׁוּרֶנּוּ and קָרוֹב
  rationale: Common wording replaces “behold” without resolving the ambiguity of “near.”
- pob_phrase: it will crush the corners of Moab
  simplified_phrase: It will crush the corners of Moab
  preserved_meaning: The violent action and concrete image of Moab’s corners remain unchanged.
  reasoning_layer_used: lexical decisions for וּמָחַץ and פַּאֲתֵי מוֹאָב
  rationale: The source image is retained, while the note briefly explains its likely figurative force.
- pob_phrase: A star has come forth from Jacob, and a scepter has risen from Israel
  simplified_phrase: A star has come forth from Jacob, and a scepter has risen from Israel
  preserved_meaning: The prophetic certainty, royal imagery, and parallel names remain intact.
  reasoning_layer_used: lexical and theological decisions on prophetic perfects and royal imagery
  rationale: These images remain because replacing them with “ruler” would erase the verse’s symbolic force.
translation_notes:
  risk_flags:
  - risk: “He is not near” may be heard spatially rather than temporally.
    mitigation: The wording preserves the POB ambiguity instead of narrowing it to “not soon.”
  - risk: “Sons of Sheth” remains difficult for modern readers.
    mitigation: The footnote preserves the Seth reading and broader interpretations without settling the uncertainty.
