translation_notes:
  risk_flags:
  - risk: “Wake” may sound narrower than the Hebrew sense of making the lion rise.
    mitigation: The preceding statement that he lay down preserves the rising-from-rest image.
  - risk: Singular “you” may not plainly identify Israel or Jacob as a representative whole.
    mitigation: The singular is retained to preserve the oracle’s poetic ambiguity.
