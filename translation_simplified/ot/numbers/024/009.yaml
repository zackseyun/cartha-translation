translation:
  language: en
  text: Like a lion and a lioness,[a] he crouched, then lay down. Who would wake him? Those who bless you are blessed, and those who curse you are cursed.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “like a great lion.” The Hebrew uses a second word for lion that may emphasize strength or maturity; “lioness” preserves the distinction.
    reason: lexical_alternative
  - marker: b
    text: This blessing-and-curse statement echoes Genesis 12:3 and Genesis 27:29.
    reason: cross_reference
simplification_decisions:
- pob_phrase: He crouched, he lay down like a lion, and like a lioness
  simplified_phrase: Like a lion and a lioness, he crouched, then lay down
  preserved_meaning: Both feline comparisons describe the same powerful animal settling into rest.
  reasoning_layer_used: Lexical decisions for כָּרַע, שָׁכַב, אֲרִי, and לָבִיא
  rationale: Reordering the line clearly coordinates the lion and lioness images while keeping both postures.
- pob_phrase: who will rouse him?
  simplified_phrase: Who would wake him?
  preserved_meaning: No one would readily disturb the resting lion and make him rise.
  reasoning_layer_used: Lexical decision for מִי יְקִימֶנּוּ and immediate lion imagery
  rationale: “Wake” is more familiar than “rouse” and fits a lion lying at rest.
interpretive_expansions:
- pob_phrase: He crouched, he lay down
  rendering: he crouched, then lay down
  claim: The lion bends low before settling into rest.
  evidence:
