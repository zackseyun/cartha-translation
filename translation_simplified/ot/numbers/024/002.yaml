- pob_phrase: lifted up his eyes
  simplified_phrase: raised his eyes
  preserved_meaning: Balaam directed his eyes upward before seeing Israel.
  reasoning_layer_used: POB lexical decisions for וַיִּשָּׂא and עֵינָיו
  rationale: “Raised his eyes” keeps the Hebrew image in more natural modern English.
- pob_phrase: dwelling according to its tribes
  simplified_phrase: camped tribe by tribe
  preserved_meaning: Israel was settled in an ordered encampment arranged by tribes.
  reasoning_layer_used: POB lexical decisions and lexical-alternative footnote
  rationale: The POB already recognizes “camped tribe by tribe” as a clear contextual rendering.
- pob_phrase: and the Spirit of God came upon him
  simplified_phrase: Then the Spirit of God came upon him
  preserved_meaning: God’s Spirit came upon Balaam after he saw Israel’s camp.
  reasoning_layer_used: POB syntax and theological decision
  rationale: A new sentence and “Then” make the sequence easier to follow without changing it.
