simplification_decisions:
- pob_phrase: How good are your tents, O Jacob
  simplified_phrase: Jacob, how good your tents are!
  preserved_meaning: The speaker admires the tents of Jacob, meaning the people of Israel.
  reasoning_layer_used: Lexical decision for מַה and contextual identification of Jacob
  rationale: Modern word order makes the exclamation immediately clear without turning it into a question.
- pob_phrase: your dwellings, O Israel
  simplified_phrase: Israel, how good your homes are!
  preserved_meaning: Israel’s places of residence are praised in poetic parallel with its tents.
  reasoning_layer_used: Lexical decision for מִשְׁכְּנֹתֶיךָ and theological rejection of cultic “tabernacles”
  rationale: “Homes” clearly conveys ordinary places where the people live and avoids sanctuary language.
- pob_phrase: good … dwellings
  simplified_phrase: good … homes
  preserved_meaning: The broad praise applies to both parallel lines.
  reasoning_layer_used: Hebrew poetic parallelism and lexical decision for טֹּבוּ
  rationale: Repeating “good” completes the second English sentence while preserving the poem’s parallel praise.
