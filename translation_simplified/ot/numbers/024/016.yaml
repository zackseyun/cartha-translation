simplification_decisions:
- pob_phrase: the declaration of one who hears the words of God
  simplified_phrase: This is the declaration of one who hears God’s words
  preserved_meaning: A solemn prophetic statement comes from one characterized by hearing God’s words.
  reasoning_layer_used: Lexical decisions for נְאֻם, שֹׁמֵעַ, and אִמְרֵי אֵל
  rationale: The direct opening and possessive form make the line easier to read without weakening its prophetic weight.
- pob_phrase: and knows the knowledge of the Most High
  simplified_phrase: and has knowledge of the Most High
  preserved_meaning: The speaker possesses knowledge pertaining to or given by the Most High.
  reasoning_layer_used: Lexical decision for דַּעַת עֶלְיוֹן
  rationale: This removes the awkward repetition of “knows” and “knowledge” while retaining the compact ambiguity.
- pob_phrase: who sees the vision of the Almighty, falling down, yet with uncovered eyes
  simplified_phrase: He sees the vision of the Almighty. He falls down, yet his eyes are uncovered
  preserved_meaning: The speaker receives the divine vision while falling down with uncovered eyes.
  reasoning_layer_used: Lexical decisions for מַחֲזֵה שַׁדַּי, נֹפֵל, and וּגְלוּי עֵינָיִם
  rationale: Short sentences clarify the actions while preserving the literal falling and uncovered-eyes image.
