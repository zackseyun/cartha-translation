translation:
  language: en
  text: If Balak gave me his house filled with silver and gold, I still could not go beyond what Yahweh says. I could not do good or evil on my own. Whatever Yahweh says is what I will say.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: If Balak were to give me his house full of silver and gold
  simplified_phrase: If Balak gave me his house filled with silver and gold
  preserved_meaning: Balak’s imagined lavish payment would not change Balaam’s response.
  reasoning_layer_used: Lexical decision for אִם יִתֶּן and מְלֹא בֵיתוֹ כֶּסֶף וְזָהָב
  rationale: The simpler conditional keeps both the hypothetical sense and the image of immense wealth.
- pob_phrase: I could not go beyond the word of Yahweh
  simplified_phrase: I still could not go beyond what Yahweh says
  preserved_meaning: Balaam cannot cross the boundary set by Yahweh’s spoken word.
  reasoning_layer_used: Lexical decision for לַעֲבֹר אֶת־פִּי יְהוָה
  rationale: This wording makes “word” concrete as what Yahweh says while retaining the boundary image.
- pob_phrase: to do good or evil from my own heart
  simplified_phrase: I could not do good or evil on my own
  preserved_meaning: Balaam cannot independently choose his action apart from Yahweh’s word.
  reasoning_layer_used: Lexical and theological decisions on מִלִּבִּי and Balaam’s limitation
  rationale: A separate sentence replaces the opaque heart idiom with its stated sense of personal initiative.
translation_notes:
  risk_flags:
  - risk: “On my own” does not preserve the Hebrew heart image.
    mitigation: It directly preserves the audited meaning of action arising from Balaam himself.
