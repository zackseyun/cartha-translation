translation:
  language: en
  text: But ships will come from the coast of Kittim.[a] They will oppress Asshur and Eber.[b] He too will meet destruction.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kittim may mean Cyprus specifically or western seafaring peoples more broadly.
    reason: alternative_reading
  - marker: b
    text: Asshur may mean Assyria; Eber may refer to a people, the Hebrews, or peoples beyond a boundary such as the Euphrates.
    reason: alternative_reading
  - marker: c
    text: The Hebrew says “he too,” but it is uncertain whom “he” refers to; it may represent a people or its ruler.
    reason: alternative_reading
