translation:
  language: en
  text: On the tenth day of this seventh month, there must be a sacred assembly for you. You must afflict yourselves,[a] and you must not do any work.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This Hebrew ritual expression may also be translated “humble yourselves” or “deny yourselves.” It was especially associated with fasting.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: there shall be a holy convocation for you
  simplified_phrase: there must be a sacred assembly for you
  preserved_meaning: The day is appointed for an officially summoned holy gathering.
  reasoning_layer_used: POB lexical decisions for מִקְרָא קֹדֶשׁ and יִהְיֶה לָכֶם
  rationale: “Sacred assembly” is clearer than “holy convocation” without turning the clause into a direct attendance command.
- pob_phrase: you shall afflict yourselves
  simplified_phrase: you must afflict yourselves
  preserved_meaning: The command retains the broad ritual and penitential force of self-affliction.
  reasoning_layer_used: POB theological decision for וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  rationale: The main text preserves the source image while the note explains its ritual sense.
- pob_phrase: you shall do no work at all
  simplified_phrase: you must not do any work
  preserved_meaning: All work is prohibited on that day.
  reasoning_layer_used: POB lexical decisions for כָּל מְלָאכָה and לֹא תַעֲשׂוּ
  rationale: A direct modern prohibition preserves the comprehensive force.
