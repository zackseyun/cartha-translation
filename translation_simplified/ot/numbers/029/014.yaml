translation:
  language: en
  text: Their grain offerings must be made from fine flour mixed with oil. Use three-tenths of an ephah for each of the thirteen bulls, and two-tenths of an ephah for each of the two rams.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “three tenth-measures” and “two tenth-measures,” traditionally understood as tenths of an ephah.
    reason: cultural_note
