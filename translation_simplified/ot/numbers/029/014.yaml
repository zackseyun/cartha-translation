  preserved_meaning: Each bull receives the stated flour measure, and there are thirteen bulls in all.
  reasoning_layer_used: POB measure note and distributive lexical decisions
  rationale: Naming the traditional unit and joining each animal to the total group makes the allocation clear.
- pob_phrase: two-tenths for each ram, for the two rams
