  simplified_phrase: Their grain offerings must be made from fine flour mixed with oil.
  preserved_meaning: The required grain offerings consist of fine flour prepared with oil.
  reasoning_layer_used: POB lexical decisions for מִנְחָה, סֹלֶת, and בְּלוּלָה בַשָּׁמֶן
  rationale: A direct requirement is easier to follow than the dense sacrificial formula.
- pob_phrase: three-tenths for each bull, for the thirteen bulls
