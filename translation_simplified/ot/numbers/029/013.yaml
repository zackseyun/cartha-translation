translation:
  language: en
  text: You must present to Yahweh a burnt offering—an offering by fire, a pleasing aroma to Yahweh:[a] thirteen bulls from the herd, two rams, and fourteen one-year-old male lambs. Every animal must be without blemish.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This Hebrew expression indicates that the offering is acceptable to Yahweh; it may also be translated “a soothing aroma” or “a sweet aroma.”
    reason: lexical_alternative
