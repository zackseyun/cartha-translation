translation:
  language: en
  text: On the eighth day, hold a sacred assembly.[a] Do not do your regular work.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a closing assembly.” The Hebrew term can refer to the gathering that concludes a festival.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: you shall have a solemn assembly
  simplified_phrase: hold a sacred assembly
  preserved_meaning: The people must gather formally for a sacred festival assembly.
  reasoning_layer_used: Lexical decision for עֲצֶרֶת and the theological decision on festival terminology
  rationale: “Hold a sacred assembly” makes the command immediately clear without specifying a later liturgical meaning.
- pob_phrase: you shall do no regular work
  simplified_phrase: Do not do your regular work
  preserved_meaning: Ordinary occupational work is prohibited, not every possible activity.
  reasoning_layer_used: Lexical decisions for כָּל מְלֶאכֶת עֲבֹדָה and לֹא תַעֲשׂוּ
  rationale: The direct command is more natural while preserving the scope of the work prohibition.
translation_notes:
  risk_flags:
