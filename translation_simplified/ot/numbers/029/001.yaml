translation:
  language: en
  text: In the seventh month, on the first day of the month, you must gather for a sacred assembly. Do not do any of your regular work. This will be a day marked by a trumpet-blast for you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a day of shouting or acclamation.” The Hebrew word refers to a loud sound and may mean a trumpet signal, a shout, or acclamation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: you shall have a holy convocation
  simplified_phrase: you must gather for a sacred assembly
  preserved_meaning: The people are commanded to attend an officially appointed sacred gathering.
  reasoning_layer_used: POB lexical decision for מִקְרָא קֹדֶשׁ
  rationale: This replaces the unfamiliar word “convocation” while retaining both the gathering and its sacred character.
- pob_phrase: You shall do no laborious work
  simplified_phrase: Do not do any of your regular work
  preserved_meaning: Ordinary work is prohibited on the festival day, not every possible activity.
  reasoning_layer_used: POB lexical decision for כָּל מְלֶאכֶת עֲבֹדָה
  rationale: “Regular work” communicates the festival restriction more naturally than “laborious work.”
- pob_phrase: It shall be a day of trumpet-blast for you
  simplified_phrase: This will be a day marked by a trumpet-blast for you
  preserved_meaning: The appointed day is distinguished by the loud festal sound described by teruah.
  reasoning_layer_used: POB lexical and theological decisions for יוֹם תְּרוּעָה
  rationale: “Marked by” clarifies how the trumpet-blast characterizes the day without importing a later festival title.
