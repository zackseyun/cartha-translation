translation:
  language: en
  text: 'You must present to Yahweh a burnt offering—an offering made by fire, with an aroma pleasing to him: one bull, one ram, and seven one-year-old lambs without blemish.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “An aroma pleasing to him” is a fixed sacrificial expression for an offering acceptable to God; it may also be translated “a soothing aroma.”
    reason: lexical_alternative
