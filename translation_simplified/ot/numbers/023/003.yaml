translation:
  language: en
  text: Balaam said to Balak, “Take your place beside your burnt offering while I go. Perhaps Yahweh will come to meet me. Whatever he shows me, I will tell you.” Then Balaam went to a bare, exposed hilltop.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew describes a bare or barren high place.
    reason: lexical_alternative
