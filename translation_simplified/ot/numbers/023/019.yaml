translation:
  language: en
  text: 'God is not a man: he does not lie. He is not a human being[a]: he does not change his mind.[b] Has he said something and will he not do it? Has he spoken and will he not fulfill it?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “son of man,” an ordinary expression for a human being here, not a messianic title.
    reason: cultural_note
  - marker: b
    text: Or “relent”; this means changing course, not repenting of wrongdoing.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: or a son of man
  simplified_phrase: He is not a human being
  preserved_meaning: The phrase contrasts God with fallible humanity rather than using a messianic title.
  reasoning_layer_used: lexical and theological decisions
  rationale: The plain expression prevents a likely misunderstanding while the note preserves the Hebrew idiom.
- pob_phrase: Has he said, and will he not do it?
  simplified_phrase: Has he said something and will he not do it?
  preserved_meaning: God reliably carries out what he says.
  reasoning_layer_used: lexical decision and rhetorical context
  rationale: Adding “something” supplies the natural implied object without weakening the question.
- pob_phrase: will he not establish it?
  simplified_phrase: will he not fulfill it?
  preserved_meaning: God brings his spoken word into effect.
  reasoning_layer_used: lexical decision and immediate parallel
  rationale: “Fulfill” clearly expresses the single verb without presenting alternate renderings as separate actions.
interpretive_expansions:
- pob_phrase: will he not establish it?
  rendering: will he not fulfill it?
  claim: Establishing the spoken word means bringing it to fulfillment.
  evidence:
  - The lexical audit lists “fulfill it” as a valid contextual rendering.
  - The parallel question asks whether God will do what he has said.
  confidence: high
  alternatives_preserved:
  - establish it
  - confirm it
translation_notes:
  risk_flags:
  - risk: Replacing “son of man” in the main text reduces the Hebrew poetic parallelism.
    mitigation: The footnote preserves the source expression and explains its ordinary human sense.
  - risk: Using “fulfill” does not retain the literal image of making a word stand.
    mitigation: The wording preserves the audited contextual meaning and avoids multiplying one source verb into two actions.
