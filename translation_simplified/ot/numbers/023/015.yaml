  text: He told Balak, “Take your place here beside your burnt offering. I will go over there to meet him.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “I will meet there” or “I will encounter him there.” It does not explicitly identify whom Balaam expects to meet.
