translation:
  language: en
  text: He has not looked on trouble among Jacob’s people or seen misery among Israel’s people.[a] Yahweh, their God, is with them,[b] and the shout of a king is among them.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may instead mean, “He has not seen iniquity in Jacob, nor has he seen trouble or perversity in Israel.”
    reason: alternative_reading
  - marker: b
    text: Hebrew uses “his” and “him,” speaking of Israel as one collective person.
    reason: lexical_alternative
  - marker: c
    text: This may describe royal acclamation among Israel, possibly pointing to Yahweh’s presence as King.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: trouble in Jacob ... misery in Israel
  simplified_phrase: trouble among Jacob’s people ... misery among Israel’s people
  preserved_meaning: Trouble and misery remain the distinct objects found among the covenant people.
  reasoning_layer_used: POB lexical decisions for הִבִּיט, אָוֶן, עָמָל, and the locative ב phrases
  rationale: Naming the people clarifies the collective references without changing what God looks on or sees.
- pob_phrase: Yahweh his God is with him
  simplified_phrase: Yahweh, their God, is with them
  preserved_meaning: Yahweh is Israel’s God and is present with the nation.
  reasoning_layer_used: POB lexical decisions for אֱלֹהָיו and עִמּוֹ
  rationale: Plural pronouns express the collective reference naturally in modern English.
- pob_phrase: the shout of a king is among them
  simplified_phrase: the shout of a king is among them
  preserved_meaning: A royal shout is heard among Israel without identifying the king.
  reasoning_layer_used: POB lexical and theological decisions for תְרוּעַת מֶלֶךְ
  rationale: The concrete royal image and its deliberate ambiguity remain intact.
interpretive_expansions:
- pob_phrase: Jacob ... Israel ... him
  rendering: Jacob’s people ... Israel’s people ... them
  claim: Jacob and Israel refer collectively to the nation.
  evidence:
