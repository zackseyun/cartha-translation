translation:
  language: en
  text: 'Then he spoke this formal saying[a]:


    “Balak, king of Moab, led me from Aram,

    from the mountains in the east.

    He said, ‘Come and curse Jacob for me.

    Come and denounce Israel.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew describes a formal poetic saying; it may also be called an “oracle.”
    reason: lexical_alternative
