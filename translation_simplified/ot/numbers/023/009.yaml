translation:
  language: en
  text: For I see them from the top of the rocks, and I look at them from the hills. Look! They are a people who live apart and do not count themselves among the nations.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “are not counted among the nations.” The Hebrew can be understood either reflexively or passively.
    reason: alternative_reading
