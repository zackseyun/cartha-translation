- pob_phrase: from the top of the rocks I see him
  simplified_phrase: I see them from the top of the rocks
  preserved_meaning: Balaam sees the people collectively from a high rocky vantage point.
  reasoning_layer_used: POB lexical decisions for מֵרֹאשׁ, צֻרִים, and אֶרְאֶנּוּ
  rationale: The reordered clause and plural pronoun read naturally while preserving the rocky image and collective referent.
- pob_phrase: from the hills I behold him
  simplified_phrase: I look at them from the hills
  preserved_meaning: Balaam looks attentively at the same people from the hills.
  reasoning_layer_used: POB lexical decision for אֲשׁוּרֶנּוּ
  rationale: “Look at” avoids archaic “behold” and the potentially supervisory sense of “watch.”
- pob_phrase: a people dwelling alone, and not reckoning itself among the nations
  simplified_phrase: They are a people who live apart and do not count themselves among the nations
  preserved_meaning: The people have a distinct identity and do not class themselves with other nations.
  reasoning_layer_used: POB lexical and theological decisions for לְבָדָד יִשְׁכֹּן and לֹא יִתְחַשָּׁב
  rationale: Finite clauses express the reflexive reading in direct modern English.
