translation:
  language: en
  text: Aaron will be gathered to his people in death.[a] He will not enter the land I have given to the sons of Israel.[b] This is because you both rebelled against my spoken command at the waters of Meribah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew image describes death as being gathered to one’s people; it does not specify details about the afterlife.
    reason: source_note
  - marker: b
    text: This traditional Hebrew expression refers to the people of Israel as a whole.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Aaron will be gathered to his people
  simplified_phrase: Aaron will be gathered to his people in death
  preserved_meaning: The solemn image of joining one’s people is retained and identified as a death expression.
  reasoning_layer_used: Lexical and theological decisions on the Hebrew death idiom
  rationale: The added words help modern readers understand the idiom without reducing it to “will die.”
- pob_phrase: because he will not enter the land ... because you rebelled
  simplified_phrase: He will not enter the land ... This is because you both rebelled
  preserved_meaning: Aaron’s exclusion from the land remains the consequence of rebellion.
  reasoning_layer_used: POB syntax and causal lexical decisions
  rationale: Two sentences make the chain of cause and consequence easier to follow.
- pob_phrase: against my command
  simplified_phrase: against my spoken command
  preserved_meaning: The rebellion was against a command God had uttered.
  reasoning_layer_used: Lexical decision for the Hebrew idiom “against my mouth”
  rationale: “Spoken” preserves the force of the Hebrew mouth image in clear English.
interpretive_expansions:
- pob_phrase: gathered to his people
  rendering: gathered to his people in death
  claim: The gathering is a Hebrew expression for Aaron’s death.
  evidence:
  - The lexical rationale identifies the Niphal of אסף here as a death idiom.
  - The theological decision requires preserving the image rather than rendering only “will die.”
  confidence: high
  alternatives_preserved:
  - The footnote avoids defining the state of the dead.
- pob_phrase: you rebelled
  rendering: you both rebelled
  claim: The rebuke addresses Moses and Aaron together.
  evidence:
  - The Hebrew verb מְרִיתֶם is second-person plural.
  - The immediate context addresses Moses concerning the judgment on both leaders.
  confidence: high
translation_notes:
  risk_flags:
