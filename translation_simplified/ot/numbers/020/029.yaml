translation:
  language: en
  text: When the whole community saw[a] that Aaron had died, all the people of Israel wept for him for thirty days.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “realized.” Here “saw” can mean recognizing that Aaron had died.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: all the congregation
  simplified_phrase: the whole community
  preserved_meaning: The entire assembled Israelite community recognized Aaron’s death.
  reasoning_layer_used: The lexical decision identifies the congregation as the assembled Israelite community.
  rationale: “Community” is clearer than the formal term “congregation” in this narrative.
- pob_phrase: all the house of Israel
  simplified_phrase: all the people of Israel
  preserved_meaning: The corporate expression refers to the entire people of Israel.
  reasoning_layer_used: The POB cultural note explains the phrase as a corporate name for the whole people.
  rationale: The wording states the corporate meaning in ordinary English.
- pob_phrase: wept for Aaron thirty days
  simplified_phrase: wept for him for thirty days
  preserved_meaning: Israel openly grieved Aaron for the full thirty-day period.
  reasoning_layer_used: The lexical decisions preserve “wept” and identify thirty days as a duration.
  rationale: The added “for” makes the duration natural and unambiguous in modern English.
translation_notes:
  risk_flags:
  - risk: “Saw” may suggest only physical sight to a modern reader.
    mitigation: The anchored footnote preserves the contextual alternative “realized.”
