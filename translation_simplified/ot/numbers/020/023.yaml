simplification_decisions:
- pob_phrase: And Yahweh spoke to Moses and to Aaron ... saying
  simplified_phrase: Yahweh said to Moses and Aaron
  preserved_meaning: Yahweh addresses both Moses and Aaron before the speech that follows.
  reasoning_layer_used: Lexical decisions for וַיֹּאמֶר and לֵאמֹר
  rationale: “Said” combines the Hebrew speech formula into natural English without losing its function.
- pob_phrase: at Mount Hor ... on the border
  simplified_phrase: At Mount Hor on the border
  preserved_meaning: The speech occurs at Mount Hor, which is located on Edom’s border.
  reasoning_layer_used: Lexical decisions for בְּהֹר הָהָר and עַל גְּבוּל
  rationale: Placing the location first gives the verse a clearer English sentence flow.
- pob_phrase: the land of Edom
  simplified_phrase: Edom
  preserved_meaning: Edom remains the territory whose border is being identified.
  reasoning_layer_used: Lexical decision for אֶרֶץ אֱדוֹם
  rationale: “The border of Edom” is clear modern English for the same geographic relationship.
