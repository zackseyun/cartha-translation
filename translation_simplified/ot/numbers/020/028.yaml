translation:
  language: en
  text: Moses removed Aaron’s garments[a] and dressed Aaron’s son Eleazar in them. Aaron died there at the top of the mountain. Then Moses and Eleazar came down from the mountain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: These were Aaron’s official priestly garments, transferred to Eleazar as he succeeded his father.
    reason: cultural_note
simplification_decisions:
- pob_phrase: stripped Aaron of his garments
  simplified_phrase: removed Aaron’s garments
  preserved_meaning: Moses took the garments off Aaron without implying more than the concrete action.
  reasoning_layer_used: Lexical decision for וַיַּפְשֵׁט and theological restraint concerning בְּגָדָיו.
  rationale: “Removed” avoids the distracting modern suggestion of forced exposure while preserving the action.
- pob_phrase: put them on Eleazar his son
  simplified_phrase: dressed Aaron’s son Eleazar in them
  preserved_meaning: Moses placed the same garments on Eleazar, Aaron’s son.
  reasoning_layer_used: Lexical decision for וַיַּלְבֵּשׁ and its approved alternative.
  rationale: The reordered wording is more natural and makes the family relationship immediately clear.
- pob_phrase: and Aaron died there on the top of the mountain. Then
  simplified_phrase: Aaron died there at the top of the mountain. Then
  preserved_meaning: Aaron died at that mountain location before Moses and Eleazar descended.
  reasoning_layer_used: Lexical decisions for וַיָּמָת, שָׁם, and בְּרֹאשׁ הָהָר.
  rationale: A separate sentence presents the sequence clearly without weakening the statement of death.
translation_notes:
  risk_flags:
  - risk: “Removed” is less forceful than the POB’s “stripped.”
    mitigation: The wording still states directly that Moses took Aaron’s garments off him.
  - risk: The garments’ priestly role is not explicit in the main text.
    mitigation: The footnote explains their official role while honoring the POB decision to retain the general noun.
