translation:
  language: en
  text: Take the staff. You and your brother Aaron must gather the whole community. Speak to the rock in front of everyone, and it will give its water. Then you will bring water out of the rock for the people and give the community and their livestock water to drink.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Take the staff, and assemble the congregation, you and Aaron your brother
  simplified_phrase: Take the staff. You and your brother Aaron must gather the whole community.
  preserved_meaning: Moses and Aaron are commanded to gather Israel while Moses takes the staff.
  reasoning_layer_used: POB lexical decisions for “staff,” “congregation,” and the identification of Aaron
  rationale: Two short sentences and “whole community” make the command easier to follow.
- pob_phrase: speak to the rock before their eyes
  simplified_phrase: Speak to the rock in front of everyone
  preserved_meaning: Moses and Aaron must address the rock where the gathered people can witness it.
  reasoning_layer_used: POB theological decision on the public nature of the command
  rationale: “In front of everyone” clearly conveys the public visibility stressed by the Hebrew idiom.
- pob_phrase: give drink to the congregation and to their livestock
  simplified_phrase: give the community and their livestock water to drink
  preserved_meaning: Both the people and their domestic animals are to receive water.
  reasoning_layer_used: POB lexical decisions for the causative verb and “livestock”
  rationale: The wording states plainly what is given while retaining both recipients.
translation_notes:
  risk_flags:
  - risk: “In front of everyone” does not retain the literal image “before their eyes.”
    mitigation: It preserves the image’s central force by making the public witness unmistakable.
