translation:
  language: en
  text: Yahweh said to Moses and Aaron, “You failed to believe me[a] and to treat me as holy in front of the sons of Israel.[b] So you will not bring this assembly into the land I have given them.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “trust me.” The Hebrew can mean believing or trusting someone.
    reason: lexical_alternative
  - marker: b
    text: “The sons of Israel” means the Israelite people.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Because you did not believe me, to treat me as holy
  simplified_phrase: You failed to believe me and to treat me as holy
  preserved_meaning: Moses and Aaron both failed to believe Yahweh and failed to uphold his holiness publicly.
  reasoning_layer_used: POB theological decision on the nature of their failure
  rationale: The coordinated wording makes both charges clear without explaining how their action showed unbelief.
- pob_phrase: before the eyes of the sons of Israel
  simplified_phrase: in front of the sons of Israel
  preserved_meaning: Their failure occurred publicly before Israel.
  reasoning_layer_used: POB lexical decision for לְעֵינֵי
  rationale: “In front of” expresses the visible, public setting in ordinary English.
- pob_phrase: therefore you shall not bring
  simplified_phrase: So you will not bring
  preserved_meaning: Yahweh solemnly declares the consequence of their failure.
  reasoning_layer_used: POB lexical decisions for לָכֵן and תָבִיאוּ
  rationale: A new sentence with “So” makes the consequence easier to follow while retaining its certainty.
interpretive_expansions:
- pob_phrase: you did not believe me, to treat me as holy
  rendering: You failed to believe me and to treat me as holy
  claim: The verse charges Moses and Aaron with both unbelief and failure to treat Yahweh as holy.
  evidence:
  - The POB theological decision explicitly preserves both elements of the charge.
  - The POB lexical decisions identify believing Yahweh and treating him as holy as distinct source ideas.
  confidence: high
  alternatives_preserved:
  - “Trust me” remains in a footnote.
  - The text does not specify exactly how their act displayed unbelief.
translation_notes:
