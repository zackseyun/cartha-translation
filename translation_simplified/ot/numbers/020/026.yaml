translation:
  language: en
  text: Take Aaron’s garments off him and put them on his son Eleazar. Then Aaron will be gathered and will die there.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Strip Aaron of his garments
  simplified_phrase: Take Aaron’s garments off him
  preserved_meaning: Aaron’s garments are to be removed from him.
  reasoning_layer_used: The lexical decision lists “Take off” as a valid equivalent for the command.
  rationale: This avoids the harsh modern sense of “strip” while keeping the command direct.
- pob_phrase: Eleazar his son
  simplified_phrase: his son Eleazar
  preserved_meaning: The garments are transferred to Aaron’s son, Eleazar.
  reasoning_layer_used: The lexical decision permits this word order in natural English.
  rationale: Naming the relationship first makes the sentence easier to follow.
- pob_phrase: Then Aaron will be gathered and die there
  simplified_phrase: Then Aaron will be gathered and will die there
  preserved_meaning: Aaron will be gathered in the biblical death idiom and die in that place.
  reasoning_layer_used: The lexical and theological decisions retain “will be gathered” without adding “to his people.”
  rationale: Repeating “will” clarifies the two linked statements while preserving the death image.
translation_notes:
  risk_flags:
  - risk: “Will be gathered” may be unfamiliar as a death expression.
    mitigation: The following words “will die there” clarify its context without adding words absent from this verse.
