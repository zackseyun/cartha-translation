translation:
  language: en
  text: 'Then Israel made this vow to the LORD: “If you truly hand this people over to me, I will devote their cities to destruction.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: made a vow to Yahweh and said
  simplified_phrase: made this vow to the LORD
  preserved_meaning: Israel formally made a solemn promise to the covenant God.
  reasoning_layer_used: POB lexical decision for וַיִּדַּר ... נֶדֶר and לַיהוָה
  rationale: The direct quotation already shows what Israel said, and “the LORD” follows the audited divine-name convention.
- pob_phrase: If you indeed give this people into my hand
  simplified_phrase: If you truly hand this people over to me
  preserved_meaning: Israel asks God to place the enemy under its power, with strong emphasis on the request.
  reasoning_layer_used: POB lexical decision for אִם נָתֹן תִּתֵּן and בְּיָדִי
  rationale: “Truly” keeps the Hebrew emphasis, while “hand over” makes the power idiom natural and retains its hand imagery.
- pob_phrase: devote their cities to destruction
  simplified_phrase: devote their cities to destruction
  preserved_meaning: The cities would be formally and irrevocably set apart for destruction, not merely defeated.
  reasoning_layer_used: POB lexical and theological decisions for וְהַחֲרַמְתִּי
  rationale: This key wording is retained because simpler “destroy” would erase the formal force of ḥerem.
translation_notes:
  risk_flags:
  - risk: Modern readers may not immediately grasp the formal force of “devote ... to destruction.”
    mitigation: The wording remains understandable in context and preserves the theological-ritual meaning that “destroy” alone would lose.
