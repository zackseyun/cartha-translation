translation:
  language: en
  text: Then the people came to Moses and said, “We have sinned by speaking against Yahweh and against you. Pray to Yahweh to take the snake[a] away from us.” So Moses prayed for the people.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “the snake” in the singular, but it may refer to the plague of snakes as a whole.
    reason: lexical_alternative
