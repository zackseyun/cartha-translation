translation:
  language: en
  text: Then Yahweh said to Moses, “Make a fiery serpent[a] and put it on a pole. Anyone who has been bitten will live when they look at it.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term means “burning one” and here refers to the deadly serpent.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Make for yourself a fiery serpent and set it on a pole
  simplified_phrase: Make a fiery serpent and put it on a pole
  preserved_meaning: Moses is personally commanded to make and mount the serpent-image.
  reasoning_layer_used: Lexical decisions for עֲשֵׂה לְךָ, שָׂרָף, and נֵס
  rationale: The shorter commands sound natural while preserving the fiery-serpent image and concrete pole.
- pob_phrase: it shall be that everyone who is bitten, when he looks at it, shall live
  simplified_phrase: Anyone who has been bitten will live when they look at it
  preserved_meaning: Every bitten person who looks at the serpent will survive.
  reasoning_layer_used: Lexical decisions for הַנָּשׁוּךְ, וְרָאָה אֹתוֹ, and וָחָי
  rationale: The direct conditional sentence removes formal syntax without changing the promised result.
translation_notes:
  risk_flags:
