translation:
  language: en
  text: '“the well the princes dug,

    the well the people’s nobles opened up

    with the ruler’s staff and with their own staffs.”[a]


    Then they traveled from the wilderness to Mattanah.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may instead mean “with the lawgiver.”
    reason: alternative_reading
  - marker: b
    text: The Hebrew simply says “from the wilderness, Mattanah”; the context indicates travel to Mattanah.
    reason: lexical_alternative
