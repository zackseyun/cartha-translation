  rationale: “Opened up” makes the second digging image easier to grasp without merging it with “dug.”
- pob_phrase: with the ruler’s staff, with their staffs
  simplified_phrase: with the ruler’s staff and with their own staffs
  preserved_meaning: The leaders used staffs, including a staff that symbolized rule.
  reasoning_layer_used: POB lexical and theological decision for בִּמְחֹקֵק
  rationale: The coordinated phrase reads naturally while retaining the favored instrumental meaning.
- pob_phrase: And from the wilderness they went to Mattanah
  simplified_phrase: Then they traveled from the wilderness to Mattanah
  preserved_meaning: The people moved from the wilderness to the next named stop.
  reasoning_layer_used: POB itinerary-transition decision for וּמִמִּדְבָּר מַתָּנָה
  rationale: “Then they traveled” clearly connects this line to the journey itinerary.
