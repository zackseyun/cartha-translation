translation:
  language: en
  text: They left Mount Hor and took the road toward the Red Sea[a] so they could go around the land of Edom. Along the way, the people became impatient.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the road toward the Sea of Reeds.” The Hebrew name is yam suph.
    reason: lexical_alternative
  - marker: b
    text: Or “the people became discouraged” or “lost heart along the way.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Then they set out from Mount Hor by the way of the Red Sea
  simplified_phrase: They left Mount Hor and took the road toward the Red Sea
  preserved_meaning: The people broke camp at Mount Hor and followed the route associated with the Red Sea.
  reasoning_layer_used: POB lexical decisions for וַיִּסְעוּ and דֶּרֶךְ יַם סוּף
  rationale: Common travel language replaces the itinerary formula and the opaque phrase “by the way of.”
- pob_phrase: to go around the land of Edom
  simplified_phrase: so they could go around the land of Edom
  preserved_meaning: Their purpose in taking this route was to bypass Edom.
  reasoning_layer_used: POB lexical decision for לִסְבֹב
  rationale: A purpose clause makes the route's purpose immediately clear.
- pob_phrase: and the people became impatient on the way
  simplified_phrase: Along the way, the people became impatient.
  preserved_meaning: The people grew impatient during the journey.
  reasoning_layer_used: POB lexical decisions for וַתִּקְצַר נֶפֶשׁ הָעָם and בַּדָּרֶךְ
  rationale: A separate sentence gives the emotional response clearer emphasis without resolving its ambiguity.
translation_notes:
  risk_flags:
  - risk: “Toward the Red Sea” may sound purely directional rather than like a route designation.
    mitigation: The wording retains the road image, and footnote a preserves the Hebrew naming alternative.
  - risk: “Became impatient” does not express every possible shade of discouragement in the Hebrew idiom.
    mitigation: Footnote b preserves “became discouraged” and “lost heart” as viable alternatives.
