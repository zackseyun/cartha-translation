translation:
  language: en
  text: Moab, disaster has come upon you! You people of Chemosh are ruined! Chemosh has made his sons[a] flee and his daughters become captives of Sihon, king of the Amorites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Moab’s sons” and “Moab’s daughters.” The Hebrew may refer to Moab rather than Chemosh.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Woe to you, Moab!
  simplified_phrase: Moab, disaster has come upon you!
  preserved_meaning: The line announces catastrophic loss directly to Moab.
  reasoning_layer_used: Lexical decision for אוֹי and taunt-song context
  rationale: “Disaster has come” makes the force of “woe” immediately clear without softening it.
- pob_phrase: You are ruined, people of Chemosh!
  simplified_phrase: You people of Chemosh are ruined!
  preserved_meaning: Moab is addressed as a ruined people identified with Chemosh.
  reasoning_layer_used: Lexical decisions for אָבַדְתָּ and עַם כְּמוֹשׁ
  rationale: Reordering the address gives the sentence ordinary English flow.
- pob_phrase: He has made his sons fugitives and his daughters captives
  simplified_phrase: Chemosh has made his sons flee and his daughters become captives
  preserved_meaning: Chemosh’s sons are driven into flight, while his daughters are taken captive.
  reasoning_layer_used: Lexical decisions for נָתַן, פְּלֵיטִם, and בַּשְּׁבִית
  rationale: “Made his sons flee” explains the less familiar word “fugitives” while preserving the flight image and Chemosh’s agency.
