translation:
  language: en
  text: Israel struck him with the sword’s edge. Then Israel took possession of his land from the Arnon River to the Jabbok River, as far as the sons of Ammon.[a] Israel’s conquest reached only that far because their border was strong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The sons of Ammon” means the Ammonites, the people of Ammon.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Israel struck him with the edge of the sword and took possession
  simplified_phrase: Israel struck him with the sword’s edge. Then Israel took possession
  preserved_meaning: Israel struck the ruler and afterward seized his land.
  reasoning_layer_used: POB lexical decisions for וַיַּכֵּהוּ, לְפִי חָרֶב, and וַיִּירַשׁ
  rationale: Two short sentences clarify the sequence while preserving the sword image and avoiding an unwarranted claim that he was killed.
- pob_phrase: the Arnon as far as the Jabbok
  simplified_phrase: the Arnon River to the Jabbok River
  preserved_meaning: The rivers mark the extent of the territory Israel acquired.
  reasoning_layer_used: POB lexical decision for מֵאַרְנֹן עַד יַבֹּק
  rationale: Adding “River” immediately identifies these unfamiliar names as geographic boundaries.
- pob_phrase: the sons of Ammon
  simplified_phrase: the sons of Ammon, with a plain-language footnote
  preserved_meaning: The masculine kinship expression refers collectively to the Ammonite people.
  reasoning_layer_used: POB theological decision on בְּנֵי עַמּוֹן
  rationale: The main text retains the audited source-transparent wording while the note explains it for new readers.
interpretive_expansions:
- pob_phrase: for the border of the sons of Ammon was strong
  rendering: Israel’s conquest reached only that far because their border was strong.
  claim: The strong Ammonite border explains why Israel’s conquest extended no farther.
  evidence:
  - The POB rationale states that כִּי gives the reason the conquest extended only this far.
  - The preceding boundary phrases define the extent of the conquered land.
  confidence: high
  alternatives_preserved:
  - “Strong” may describe natural or military strength; the text does not specify.
translation_notes:
  risk_flags:
  - risk: “Reached only that far” makes the limiting force more explicit than the POB wording.
    mitigation: The expansion follows the POB rationale for the explanatory conjunction and territorial context.
  - risk: Modern readers may take “strong border” to mean a fortified wall.
    mitigation: The broad word “strong” is retained without specifying how the border was strong.
