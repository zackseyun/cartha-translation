translation:
  language: en
  text: So Moses made a bronze serpent[a] and put it on the pole. Whenever a serpent bit someone, that person looked at the bronze serpent and lived.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word for the metal can mean copper or bronze.
    reason: lexical_alternative
  - marker: b
    text: Jesus refers to this event in John 3:14–15.
    reason: cross_reference
simplification_decisions:
- pob_phrase: set it on the pole
  simplified_phrase: put it on the pole
  preserved_meaning: Moses mounted the crafted serpent on the upright pole.
  reasoning_layer_used: POB lexical decision for הַנֵּס
  rationale: “Put” expresses the physical action naturally in common English.
- pob_phrase: And it happened that if the serpent bit a man
  simplified_phrase: Whenever a serpent bit someone
  preserved_meaning: The condition applied to any person bitten by a serpent.
  reasoning_layer_used: POB lexical rationale, Hebrew conditional construction, and representative-language footnote
  rationale: “Whenever” clarifies each occurrence, while “someone” makes the documented generic scope clear.
- pob_phrase: and he looked at the bronze serpent, he lived
  simplified_phrase: that person looked at the bronze serpent and lived
  preserved_meaning: The bitten person lived after looking at the bronze serpent.
  reasoning_layer_used: POB lexical and theological decisions for וְהִבִּיט אֶל and וָחָי
  rationale: Repeating the person clearly distinguishes the victim from the biting serpent.
interpretive_expansions:
- pob_phrase: a man
  rendering: someone; that person
  claim: The masculine singular represents any bitten person rather than males only.
  evidence:
  - POB footnote c explicitly identifies “a man” as representative.
  - The POB theological decision says the form functions generically here.
  confidence: high
  alternatives_preserved:
