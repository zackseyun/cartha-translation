translation:
  language: en
  text: Send out men for yourself[a] to scout the land of Canaan, which I am giving to the sons of Israel.[b] You must send one man from each ancestral tribe. Each man must be a leader among his people.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may emphasize Moses’ personal involvement or may simply authorize him to send the men.
    reason: source_note
  - marker: b
    text: “Sons of Israel” is a covenant family name for the whole people of Israel.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Send for yourself men, and let them scout out
  simplified_phrase: Send out men for yourself to scout
  preserved_meaning: Moses is to send male representatives on a scouting mission, while the phrase “for yourself” remains visible.
  reasoning_layer_used: Lexical and theological decisions on שְׁלַח לְךָ, אֲנָשִׁים, and וְיָתֻרוּ
  rationale: The ordinary infinitive removes the stiff “let them” construction without resolving the Hebrew nuance.
- pob_phrase: one man from each tribe of his fathers
  simplified_phrase: one man from each ancestral tribe
  preserved_meaning: Each man represents a tribe defined by family descent.
  reasoning_layer_used: Lexical decision on לְמַטֵּה אֲבֹתָיו
  rationale: “Ancestral tribe” expresses the kinship structure in clear modern English.
- pob_phrase: every one a leader among them
  simplified_phrase: Each man must be a leader among his people
  preserved_meaning: Every selected representative must already be a recognized tribal leader.
  reasoning_layer_used: Lexical decision on כֹּל נָשִׂיא בָהֶם
  rationale: A complete sentence makes the qualification easier to understand.
translation_notes:
  risk_flags:
  - risk: “For yourself” remains unusual in modern English.
    mitigation: The footnote preserves the documented ambiguity without choosing one interpretation.
  - risk: “Sons of Israel” may sound as though it excludes women.
    mitigation: The footnote explains that it names the covenant people as a whole.
