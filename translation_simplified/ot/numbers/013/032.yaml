translation:
  language: en
  text: Then they gave the sons of Israel[a] a bad report[b] about the land they had explored. They said, “We traveled through that land to explore it. It is a land that devours those who live there, and all the people we saw were men of great size.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sons of Israel” is the Hebrew covenant name for the people of Israel.
    reason: cultural_note
  - marker: b
    text: “Bad report” may carry the stronger sense “slander.”
    reason: lexical_alternative
