translation:
  language: en
  text: When it is time to move the tabernacle, the Levites must take it down. When it is time to make camp, they must set it up. Anyone who is not authorized to approach the tabernacle and comes near it must be put to death.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: When the tabernacle is to set out
  simplified_phrase: When it is time to move the tabernacle
  preserved_meaning: The portable sanctuary is about to begin its journey.
  reasoning_layer_used: lexical decision for וּבִנְסֹעַ and immediate travel context
  rationale: The rewrite states the practical movement directly instead of picturing the tabernacle as traveling by itself.
- pob_phrase: when the tabernacle is to camp
  simplified_phrase: When it is time to make camp
  preserved_meaning: The tabernacle is set up when the traveling camp stops.
  reasoning_layer_used: lexical decision for וּבַחֲנֹת and the paired dismantling and setup actions
  rationale: The common phrase “make camp” clearly marks the end of travel and the time for setup.
- pob_phrase: shall take it down; ... shall set it up
  simplified_phrase: must take it down. ... must set it up
  preserved_meaning: The Levites are required to dismantle and erect the tabernacle.
  reasoning_layer_used: lexical decisions for יוֹרִידוּ אֹתוֹ and יָקִימוּ אֹתוֹ
  rationale: Two short sentences make the required sequence easier to follow while keeping both actions distinct.
interpretive_expansions:
- pob_phrase: the outsider who comes near
  rendering: Anyone who is not authorized to approach the tabernacle and comes near it
  claim: The outsider is a person barred from approaching the sacred sanctuary, not simply an ethnic foreigner.
  evidence:
  - The POB lexical decision defines זָר as someone unauthorized for sanctuary service.
  - The theological decision rejects a merely ethnic meaning in this tabernacle context.
  confidence: high
  alternatives_preserved:
  - The wording does not limit the outsider to an ethnic foreigner.
  - The wording does not specify whether every non-Levite is included in all circumstances.
translation_notes:
  risk_flags:
  - risk: “Make camp” shifts the surface subject from the tabernacle to the traveling camp.
    mitigation: The paired command to set up the tabernacle preserves the contextual action and timing.
