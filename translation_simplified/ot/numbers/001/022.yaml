translation:
  language: en
  text: 'The sons of Simeon were listed by their lines of descent, clans, and households traced through their fathers. Every male twenty years old or older who was eligible for military service[a] was counted by name, one by one[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “who went out to war.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew literally says “head by head,” meaning that each person was counted individually.
    reason: cultural_note
