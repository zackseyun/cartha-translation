  preserved_meaning: The census organized the tribe by genealogical, clan, and household divisions.
  reasoning_layer_used: POB lexical decisions for תּוֹלְדֹתָם, לְמִשְׁפְּחֹתָם, and לְבֵית אֲבֹתָם
