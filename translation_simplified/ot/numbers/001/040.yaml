translation:
  language: en
  text: 'The sons of Asher were counted by their lines of descent, clans, and ancestral households. Every man twenty years old or older who was eligible for military service[a] was counted by name:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says “everyone going out to war,” an expression for those eligible for military service. In this census context, these were men.
    reason: lexical_alternative
