translation:
  language: en
  text: These were the men called from the community. They were leaders of their ancestral tribes and heads of Israel’s thousands.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Called” may mean summoned or designated.
    reason: lexical_alternative
  - marker: b
    text: “Thousands” may mean groups of a thousand or Israel’s clan or military divisions.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the ones called from the congregation
  simplified_phrase: the men called from the community
  preserved_meaning: They belonged to Israel’s community and were called, summoned, or designated from it.
  reasoning_layer_used: POB lexical decisions and immediate context
  rationale: “Community” is clearer than “congregation,” while “called” preserves the documented range.
- pob_phrase: the leaders of their fathers’ tribes
  simplified_phrase: leaders of their ancestral tribes
  preserved_meaning: They led the tribes connected with their paternal ancestry.
  reasoning_layer_used: POB lexical decision for מַטּוֹת אֲבוֹתָם
  rationale: “Ancestral tribes” expresses the family-line meaning in natural modern English.
- pob_phrase: the heads of the thousands of Israel
  simplified_phrase: heads of Israel’s thousands
  preserved_meaning: They were chief persons over Israel’s groups called thousands.
  reasoning_layer_used: POB lexical decisions for רָאשֵׁי and אַלְפֵי יִשְׂרָאֵל
  rationale: The shorter form keeps both the head metaphor and the deliberately open term “thousands.”
