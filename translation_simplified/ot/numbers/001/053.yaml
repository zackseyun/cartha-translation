translation:
  language: en
  text: But the Levites must camp around the tabernacle of the testimony.[a] They must do this so that divine wrath does not fall on the community of the sons of Israel.[b] The Levites must guard the tabernacle and take responsibility for it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The tabernacle was Israel’s sacred tent of worship. “Testimony” refers to the sacred testimony associated with it.
    reason: cultural_note
  - marker: b
    text: Or, “against the community of the Israelites.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: shall camp around
  simplified_phrase: must camp around
  preserved_meaning: The Levites are commanded to camp around the tabernacle.
  reasoning_layer_used: Lexical decision for יַחֲנוּ.
  rationale: “Must” states the directive force more plainly than “shall.”
- pob_phrase: the congregation of the sons of Israel
  simplified_phrase: the community of the sons of Israel
  preserved_meaning: The covenant community descended from Israel remains in view.
  reasoning_layer_used: Lexical and gender-accurate decisions.
  rationale: “Community” is more familiar, while “sons of Israel” preserves the source form.
- pob_phrase: shall keep charge of the tabernacle
  simplified_phrase: must guard the tabernacle and take responsibility for it
  preserved_meaning: The Levites have an assigned duty to guard and care for the tabernacle.
  reasoning_layer_used: Lexical decisions for וְשָׁמְרוּ and מִשְׁמֶרֶת.
  rationale: This makes both guarding and entrusted responsibility clear.
interpretive_expansions:
- pob_phrase: wrath
  rendering: divine wrath
  claim: The threatened wrath is God’s judicial response to failure around the sanctuary.
  evidence:
  - The POB theological decision identifies the wrath as divine judgment.
  - The immediate context concerns guarding the tabernacle’s sacred boundaries.
  confidence: high
  alternatives_preserved:
  - general anger
  - human displeasure
translation_notes:
  risk_flags:
  - risk: The cultural note could narrow “testimony” beyond what the POB establishes.
    mitigation: The note describes its sacred association without identifying it categorically as covenant testimony.
  - risk: “Guard” alone could sound narrower than keeping an assigned charge.
    mitigation: “Take responsibility for it” preserves the broader entrusted duty.
