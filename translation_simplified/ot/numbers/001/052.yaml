simplification_decisions:
- pob_phrase: The sons of Israel shall camp
  simplified_phrase: The Israelites must camp
  preserved_meaning: The people of Israel are instructed to camp in the prescribed way.
  reasoning_layer_used: Lexical decision and instructional context
  rationale: “Israelites” is natural modern English, and “must” retains the prescriptive force.
- pob_phrase: each man by his camp and each man by his banner
  simplified_phrase: each man by his camp and by his banner
  preserved_meaning: Every man is placed in association with his assigned camp and its identifying banner.
  reasoning_layer_used: Lexical decisions for אִישׁ, מַחֲנֶה, and דֶּגֶל
  rationale: Repeating “by” preserves the broad relationship without implying ownership or a precise location.
- pob_phrase: according to their divisions
  simplified_phrase: in their divisions
  preserved_meaning: The Israelites are organized into defined groupings when they camp.
  reasoning_layer_used: Lexical decision for לְצִבְאֹתָם
  rationale: “In their divisions” expresses the ordered grouping in direct modern English.
