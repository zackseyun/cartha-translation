translation:
  language: en
  text: 'The sons of Manasseh were registered by name and grouped by their family lines, clans, and ancestral households. The census included every man aged twenty or older who was eligible for military service:'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: by their generations, by their clans, by their fathers’ houses
  simplified_phrase: grouped by their family lines, clans, and ancestral households
  preserved_meaning: The census organized the tribe by three related levels of kinship.
  reasoning_layer_used: POB lexical decisions for תּוֹלְדֹתָם, לְמִשְׁפְּחֹתָם, and לְבֵית אֲבֹתָם
  rationale: The wording clarifies the kinship structure without merging its distinct divisions.
- pob_phrase: by the number of names
  simplified_phrase: registered by name
  preserved_meaning: Individuals were formally enumerated by their names.
  reasoning_layer_used: POB lexical decision for בְּמִסְפַּר שֵׁמוֹת
  rationale: The active census wording is easier to understand than the formal Hebrew expression.
- pob_phrase: from twenty years old and upward, every man going out for military service
  simplified_phrase: every man aged twenty or older who was eligible for military service
  preserved_meaning: The count covered military-eligible males beginning at age twenty.
  reasoning_layer_used: POB lexical and gendered-census theological decisions
  rationale: The revision uses natural English while retaining the age threshold, male reference, and military scope.
