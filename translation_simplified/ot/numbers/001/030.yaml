translation:
  language: en
  text: The descendants of Zebulun were registered by name, according to their family lines, clans, and fathers’ households. The census included every man twenty years old or older who was able to go to war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “fit for military service.” The Hebrew expression is literally “going out to war.”
    reason: lexical_alternative
