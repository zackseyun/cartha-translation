translation:
  language: en
  text: 'Joseph’s descendants from the tribe of Ephraim were registered by their family lines, clans, and ancestral households. Every man twenty years old or older who could go out to war[a] was listed by name:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “who was eligible for military service.” The Hebrew idiom speaks of going out to war.
    reason: lexical_alternative
