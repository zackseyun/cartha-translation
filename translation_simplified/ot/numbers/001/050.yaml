translation:
  language: en
  text: But put the Levites in charge of the tabernacle of the testimony[a], all its furnishings, and everything that belongs to it. They must carry the tabernacle and all its furnishings, perform its sacred service, and camp around it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The tabernacle was Israel’s portable sanctuary; the phrase can also be translated “tent of the testimony.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: appoint the Levites over
  simplified_phrase: put the Levites in charge of
  preserved_meaning: Moses must assign the Levites responsibility for the tabernacle.
  reasoning_layer_used: The lexical decision reads הַפְקֵד with עַל as commissioning oversight.
  rationale: The new wording makes the administrative duty immediately clear.
- pob_phrase: they are to minister to it
  simplified_phrase: perform its sacred service
  preserved_meaning: The Levites must carry out service connected with the sanctuary.
  reasoning_layer_used: The lexical and theological decisions preserve the sacred-service force of שרת.
  rationale: This avoids the unclear idea of ministering to a building while retaining the cultic sense.
- pob_phrase: they are to camp around the tabernacle
  simplified_phrase: camp around it
  preserved_meaning: The Levites must camp in a perimeter around the sanctuary.
  reasoning_layer_used: The lexical decision identifies commanded encampment around the tabernacle.
  rationale: The pronoun removes needless repetition without weakening the command.
interpretive_expansions:
- pob_phrase: minister to it
  rendering: perform its sacred service
  claim: The required service is sanctuary service rather than ordinary assistance.
  evidence:
  - The Piel of שרת has a ministerial sense in this sanctuary context.
  - The POB theological decision explicitly preserves the sacred-service nuance.
  confidence: high
  alternatives_preserved:
  - serve it
  - attend to it
  - minister at it
