translation:
  language: en
  text: Take a census of the whole community of the sons of Israel.[a] Count every male by name, one person at a time, according to their clans and ancestral households.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, the Israelites; the Hebrew literally says “sons of Israel.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew literally says “by their heads” or “by their skulls,” an idiom meaning that each person is counted individually.
    reason: lexical_alternative
