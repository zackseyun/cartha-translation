translation:
  language: en
  text: These are the people Moses and Aaron counted.[a] The twelve leaders of Israel were with them, one man representing each ancestral household.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “enrolled in the census.” The Hebrew may emphasize either the people counted or their census enrollment.
    reason: lexical_alternative
  - marker: b
    text: An “ancestral household” was a clan unit within Israel’s tribal structure.
    reason: cultural_note
