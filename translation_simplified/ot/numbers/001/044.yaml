  preserved_meaning: The verse identifies the people enrolled in the census by Moses and Aaron.
  reasoning_layer_used: Lexical decisions for הַפְּקֻדִים and פָּקַד
  rationale: The active sentence removes repetition while keeping the people, counters, and census action clear.
- pob_phrase: the leaders of Israel—twelve men
  simplified_phrase: The twelve leaders of Israel
  preserved_meaning: Israel’s participating leaders were twelve men.
  reasoning_layer_used: Lexical decisions for נְשִׂיאֵי יִשְׂרָאֵל and שְׁנֵים עָשָׂר אִישׁ
  rationale: Putting “twelve” before “leaders” makes the identification immediate without weakening the masculine reference.
- pob_phrase: each one for his fathers’ house
