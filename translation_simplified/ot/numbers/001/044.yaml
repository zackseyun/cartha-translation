  preserved_meaning: Each man served for one patrilineal clan or household unit.
  reasoning_layer_used: Lexical decisions for אִישׁ אֶחָד and לְבֵית אֲבֹתָיו
  rationale: This wording explains the representative role and replaces an opaque biblical idiom.
