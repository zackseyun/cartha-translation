  rationale: “Descendants” prevents a likely modern misunderstanding while preserving the tribal reference.
- pob_phrase: by their generations, by their clans, by their fathers’ houses
  simplified_phrase: according to their lines of descent, clans, and fathers’ households
  preserved_meaning: The men were organized by lineage, clan, and the smaller patriarchal household unit.
