  rationale: The revision clarifies the three levels without merging their distinct roles.
- pob_phrase: according to the number of names, from twenty years old and upward
  simplified_phrase: were listed by name ... twenty years old or older
  preserved_meaning: Individuals were counted by name beginning at age twenty.
  reasoning_layer_used: POB lexical rationale for individual enumeration and the age threshold
  rationale: Ordinary census wording replaces the formal Hebrew clause order.
