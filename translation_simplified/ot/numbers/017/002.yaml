translation:
  language: en
  text: Tell Eleazar son of Aaron the priest to remove the censers[a] from the burning area and scatter the fire far away, because the censers have become holy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Censers were pans used to carry burning coals and incense.
    reason: cultural_note
simplification_decisions:
- pob_phrase: lift the censers out from among the burning
  simplified_phrase: remove the censers from the burning area
  preserved_meaning: Eleazar must take the censers away from the place of burning.
  reasoning_layer_used: POB lexical decision for וְיָרֵם and מִבֵּין הַשְּׂרֵפָה
  rationale: “Remove” and “burning area” express the action and setting in ordinary English.
- pob_phrase: scatter the fire farther away
  simplified_phrase: scatter the fire far away
  preserved_meaning: The fire must be dispersed at a distance from the holy censers.
  reasoning_layer_used: POB lexical decision for וְאֶת הָאֵשׁ זְרֵה הָלְאָה
  rationale: The shorter wording keeps both the scattering action and distance.
- pob_phrase: for they have become holy
  simplified_phrase: because the censers have become holy
  preserved_meaning: The censers acquired a holy status through their prior presentation before the LORD.
  reasoning_layer_used: POB theological decision on the referent of כִּי קָדֵשׁוּ
  rationale: Naming the censers removes an unclear pronoun without changing the chosen referent.
