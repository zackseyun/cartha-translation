translation:
  language: en
  text: Take the censers that belonged to these men, whose sin cost them their lives. Hammer the censers into metal sheets and use them to cover the altar. Because the censers were presented before Yahweh, they became holy. They will serve as a sign to the people of Israel.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: As for the censers of these men who sinned at the cost of their lives
  simplified_phrase: Take the censers that belonged to these men, whose sin cost them their lives.
  preserved_meaning: The censers belonged to men whose rebellion led to their deaths.
  reasoning_layer_used: Lexical and theological decisions on בְּנַפְשֹׁתָם.
  rationale: The direct command and relative clause make the consequence of their sin easier to follow.
- pob_phrase: let them make them into hammered plates as a covering for the altar
  simplified_phrase: Hammer the censers into metal sheets and use them to cover the altar.
  preserved_meaning: The censers are to be beaten into thin metal pieces that form the altar covering.
  reasoning_layer_used: Lexical decisions on the command, hammered sheets, and altar covering.
  rationale: Explicit nouns remove unclear pronouns while keeping the metalworking image and sacred purpose.
- pob_phrase: they shall be a sign to the sons of Israel
  simplified_phrase: They will serve as a sign to the people of Israel.
  preserved_meaning: The sacred altar covering will have an ongoing memorial-warning function for Israel.
  reasoning_layer_used: Lexical decision on לִבְנֵי יִשְׂרָאֵל and theological context.
  rationale: People of Israel is clearer modern corporate language than sons of Israel.
interpretive_expansions:
- pob_phrase: they presented them before Yahweh and they became holy
  rendering: Because the censers were presented before Yahweh, they became holy.
  claim: The censers, not the men, are the objects that became holy.
  evidence:
  - The censers are the nearest natural plural referent.
  - Their sacred status explains why their metal must be reused for the altar.
  confidence: high
  alternatives_preserved:
  - The censers were consecrated.
