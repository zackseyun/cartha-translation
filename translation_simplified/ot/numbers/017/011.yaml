  preserved_meaning: Aaron must prepare the priestly vessel with altar fire and incense.
  reasoning_layer_used: POB lexical decisions for censer, altar fire, and incense
  rationale: Short sentences and “add” make the ritual sequence easier to follow.
- pob_phrase: go quickly to the congregation
  simplified_phrase: Then hurry to the congregation
  preserved_meaning: Aaron must urgently go to the gathered Israelite community.
  reasoning_layer_used: POB lexical decision for וְהוֹלֵךְ מְהֵרָה and הָעֵדָה
  rationale: “Hurry” expresses both movement and urgency in ordinary English.
- pob_phrase: wrath has gone out from before Yahweh
  simplified_phrase: Wrath has gone out from Yahweh’s presence
  preserved_meaning: Divine judgment has proceeded from Yahweh’s presence.
  reasoning_layer_used: POB lexical and theological decisions for הַקֶּצֶף, מִלִּפְנֵי יְהוָה, and the divine name
  rationale: “From Yahweh’s presence” explains the Hebrew image without removing it.
