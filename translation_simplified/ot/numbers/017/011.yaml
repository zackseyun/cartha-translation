translation:
  language: en
  text: Moses said to Aaron, “Take the censer.[a] Put fire from the altar in it and add incense. Then hurry to the congregation and make atonement for them. Wrath has gone out from Yahweh’s presence; the plague has begun.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A censer was a priestly container used to carry fire and burn incense; it may also be called a firepan.
    reason: cultural_note
