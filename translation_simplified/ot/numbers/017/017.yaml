translation:
  language: en
  text: Speak to the sons of Israel[a]. Collect from their leaders one staff[b] for each family group descended through the father’s line—twelve staffs in all. Write each leader’s name on his own staff.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Israelites.” The Hebrew expression literally means “the sons of Israel.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word can also be translated “rod”; here it means a physical staff.
    reason: lexical_alternative
