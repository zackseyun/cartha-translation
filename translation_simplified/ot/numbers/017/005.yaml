translation:
  language: en
  text: 'This served as a reminder to the Israelites: no one outside Aaron’s family may approach Yahweh to burn incense, so that such a person would not become like Korah and his group. All this was just as Yahweh had told him through Moses.[a]'
  philosophy: optimal-equivalence
  footnotes:
