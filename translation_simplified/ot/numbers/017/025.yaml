translation:
  language: en
  text: Yahweh said to Moses, “Put Aaron’s staff back in front of the testimony.[a] Keep it there as a sign for the sons of rebellion.[b] In this way, you will put an end to their grumbling against me, so they will not die.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “testimony” likely means the covenant testimony associated with the ark.
    reason: cultural_note
  - marker: b
    text: “Sons of rebellion” means rebels or rebellious sons.
    reason: lexical_alternative
