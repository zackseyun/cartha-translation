translation:
  language: en
  text: But the next day, the whole community of the sons of Israel grumbled against both Moses and Aaron. They said, “You have killed Yahweh’s people.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: all the congregation of the sons of Israel
  simplified_phrase: the whole community of the sons of Israel
  preserved_meaning: The entire covenant community joined in the complaint, while the source’s masculine expression remains visible.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Community” is clearer than “congregation” here without reducing the group to an informal crowd.
- pob_phrase: against Moses and against Aaron
  simplified_phrase: against both Moses and Aaron
  preserved_meaning: The accusation is directed at each leader.
  reasoning_layer_used: lexical decision
  rationale: “Both” carries the Hebrew emphasis more naturally than repeating “against.”
- pob_phrase: saying, “You have killed the people of Yahweh.”
  simplified_phrase: They said, “You have killed Yahweh’s people.”
  preserved_meaning: The community directly accuses Moses and Aaron of killing the people who belong to Yahweh.
  reasoning_layer_used: lexical and theological decisions
  rationale: A new sentence and possessive wording make the accusation easier to follow while retaining Yahweh’s covenant name.
translation_notes:
  risk_flags:
  - risk: “Community” may sound less formally covenantal than “congregation.”
    mitigation: “The whole community of the sons of Israel” preserves the corporate identity and total participation.
