translation:
  language: en
  text: Put them in the tent of meeting, in front of the testimony,[a] where I meet with you.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The testimony” is the covenant witness, probably connected with the covenant tablets in the sanctuary; the wording does not specify the exact object.
    reason: lexical_alternative
  - marker: b
    text: This may also be translated “where I make myself known to you” or “where I appoint to meet with you.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And you shall place them
  simplified_phrase: Put them
  preserved_meaning: God directly commands Moses to place the objects there.
  reasoning_layer_used: Lexical decision for וְהִנַּחְתָּם
  rationale: The shorter imperative expresses the same directive force in natural English.
- pob_phrase: before the testimony
  simplified_phrase: in front of the testimony
  preserved_meaning: The objects are to be placed physically before the covenant testimony.
  reasoning_layer_used: Lexical and theological decisions for לִפְנֵי הָעֵדוּת
  rationale: “In front of” makes the spatial meaning clear while leaving the testimony’s exact referent open.
translation_notes:
  risk_flags:
  - risk: Modern readers may not know what “the testimony” refers to.
    mitigation: The footnote explains its covenant setting without choosing among the tablets, ark, or broader covenant witness.
