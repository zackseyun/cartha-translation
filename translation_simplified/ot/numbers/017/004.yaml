translation:
  language: en
  text: Eleazar the priest took the bronze censers[a] offered by the men who had been burned.[b] The censers were then hammered flat to make a covering for the altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Censers were pans used to hold burning coals and incense.
    reason: cultural_note
  - marker: b
    text: These men had been consumed by fire in the preceding events.
    reason: source_note
simplification_decisions:
- pob_phrase: the bronze censers that the burned men had offered
  simplified_phrase: the bronze censers offered by the men who had been burned
  preserved_meaning: The bronze ritual vessels had previously been presented as offerings by the men burned in the preceding account.
  reasoning_layer_used: POB lexical decisions for מַחְתּוֹת, הִקְרִיבוּ, and הַשְּׂרֻפִים
  rationale: The passive phrase is more natural while retaining the concrete idea that the men were burned.
- pob_phrase: and they were hammered out as a covering for the altar
  simplified_phrase: The censers were then hammered flat to make a covering for the altar.
  preserved_meaning: The bronze vessels were beaten into an overlay intended for the altar.
  reasoning_layer_used: POB lexical decisions for וַיְרַקְּעוּם, צִפּוּי, and לַמִּזְבֵּחַ
  rationale: The new sentence explains the metalworking action and its purpose in ordinary English.
