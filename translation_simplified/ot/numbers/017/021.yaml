translation:
  language: en
  text: Moses spoke to the Israelites. Then each of their leaders gave Moses one staff for his ancestral family group. There were twelve staffs, and Aaron’s staff was among them.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the sons of Israel
  simplified_phrase: the Israelites
  preserved_meaning: The phrase refers collectively to the people of Israel.
  reasoning_layer_used: POB footnote and lexical alternative for בְּנֵי יִשְׂרָאֵל
  rationale: “Israelites” gives the corporate meaning directly in common English.
- pob_phrase: all their leaders gave him a staff, one staff for each leader
  simplified_phrase: each of their leaders gave Moses one staff
  preserved_meaning: Every leader contributed one representative staff.
  reasoning_layer_used: lexical decision on the distributive phrase
  rationale: The shorter wording clearly preserves one staff from each leader.
- pob_phrase: according to their fathers’ houses
  simplified_phrase: for his ancestral family group
  preserved_meaning: Each staff represented a kinship group organized through the paternal ancestral line.
  reasoning_layer_used: lexical decision on לְבֵית אֲבֹתָם
  rationale: “Ancestral family group” avoids suggesting only a leader’s immediate family.
translation_notes:
  risk_flags:
  - risk: “Ancestral family group” does not fully reproduce the ancient fathers’-house social structure.
    mitigation: The wording preserves both ancestry and the broader kinship-group sense without narrowing it to an immediate family.
