translation:
  language: en
  text: Write Aaron’s name on the staff representing Levi, for there is one staff for each leader of an ancestral family.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, more literally, “one staff for the head of their ancestral family.” The Hebrew can refer to each family leader.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: you shall write Aaron’s name
  simplified_phrase: Write Aaron’s name
  preserved_meaning: God directly commands Moses to inscribe Aaron’s name.
  reasoning_layer_used: lexical decision for תִּכְתֹּב
  rationale: A direct command naturally conveys the Hebrew instruction.
- pob_phrase: the staff of Levi
  simplified_phrase: the staff representing Levi
  preserved_meaning: The physical staff represents the tribe of Levi rather than belonging personally to Levi.
  reasoning_layer_used: lexical decisions for מַטֵּה and לֵוִי
  rationale: The clarification prevents readers from mistaking Levi for the staff’s owner.
- pob_phrase: for there shall be one staff for the head of their fathers’ house
  simplified_phrase: for there is one staff for each leader of an ancestral family
  preserved_meaning: One representative staff corresponds to each leader of a paternal family group.
  reasoning_layer_used: POB footnote and lexical decisions for כִּי, לְרֹאשׁ, and בֵּית אֲבוֹתָם
  rationale: Plain kinship language preserves the explanatory clause without adding necessity.
