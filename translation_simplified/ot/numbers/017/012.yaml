translation:
  language: en
  text: Aaron did just as Moses had said. He took the pan used for burning incense and ran into the middle of the assembly. But the plague had already begun among the people. Aaron put the incense on the fire and made atonement for them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here, making atonement means performing the priestly act that turned away God’s judgment from the people.
    reason: simplification_note
