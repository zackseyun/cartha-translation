translation:
  language: en
  text: 'So he sent messengers to call for Balaam son of Beor. Balaam was at Pethor, by the River,[a] in the land of the sons of his people.[b] The message was: “Look! A people has come out of Egypt. Look! They have covered the face of the land,[c] and they are staying across from me.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The River” probably means the Euphrates River.
    reason: cross_reference
  - marker: b
    text: Or “in the land of his people.” The Hebrew wording is difficult, and “his” may refer to different people.
    reason: alternative_reading
  - marker: c
    text: The Hebrew image is literally “the eye of the land,” meaning its visible surface or face.
    reason: lexical_alternative
