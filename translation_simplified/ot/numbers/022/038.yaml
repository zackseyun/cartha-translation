translation:
  language: en
  text: Balaam said to Balak, “Look, I am here now. But can I say just anything? I will speak only the word God puts in my mouth.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I have come to you now
  simplified_phrase: I am here now
  preserved_meaning: Balaam emphasizes that he has now arrived before Balak.
  reasoning_layer_used: Lexical decision for בָאתִי אֵלֶיךָ עַתָּה
  rationale: The simpler arrival statement preserves the immediacy of Balaam’s words.
- pob_phrase: Am I really able to speak anything at all?
  simplified_phrase: But can I say just anything?
  preserved_meaning: The rhetorical question emphatically denies Balaam unrestricted power to speak.
  reasoning_layer_used: Lexical and theological decisions for הֲיָכוֹל אוּכַל and דַּבֵּר מְאוּמָה
  rationale: The shorter question sounds natural while keeping the emphatic limitation.
- pob_phrase: I will speak only the word that God puts in my mouth
  simplified_phrase: I will speak only the word God puts in my mouth
  preserved_meaning: Balaam is constrained to deliver only the message God gives him.
  reasoning_layer_used: Lexical and theological decisions for יָשִׂים אֱלֹהִים בְּפִי and אֹתוֹ אֲדַבֵּר
  rationale: The wording keeps both the mouth image and the exclusive force of “only.”
translation_notes:
  risk_flags:
  - risk: “Just anything” could be heard as merely casual speech rather than inability.
    mitigation: The following sentence clearly states that Balaam may speak only God’s word.
