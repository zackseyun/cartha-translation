translation:
  language: en
  text: The donkey saw me and moved out of my way three times. If she had not moved away from me,[a] I would have killed you by now and let her live.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says, “perhaps she turned aside from before me,” but the context indicates the counterfactual sense given here.
    reason: lexical_alternative
