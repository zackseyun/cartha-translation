translation:
  language: en
  text: The angel of Yahweh said to him, “Why did you hit your donkey three times? Look, I have come to oppose you,[a] because the path you are taking is reckless in my sight.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word means “adversary” or “opponent” here; it does not necessarily refer to Satan.
    reason: lexical_alternative
  - marker: b
    text: The rare Hebrew verb may also describe his path as perverse or contrary.
    reason: alternative_reading
