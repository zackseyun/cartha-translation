translation:
  language: en
  text: The donkey saw the angel of Yahweh[a] and pressed herself against the wall, pinning Balaam’s foot against it. So Balaam hit her again.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the messenger of Yahweh.” Here the messenger is a supernatural being, so the main text says “angel.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: pressed herself against the wall and pressed Balaam’s foot against the wall
  simplified_phrase: pressed herself against the wall, pinning Balaam’s foot against it
  preserved_meaning: The donkey’s movement trapped Balaam’s foot against the wall.
  reasoning_layer_used: POB lexical decisions for לחץ and the object construction
  rationale: “Pinning” clearly expresses the physical result without repeating “pressed” and “the wall.”
- pob_phrase: so he struck her again
  simplified_phrase: So Balaam hit her again
  preserved_meaning: Balaam responded by striking the donkey another time.
  reasoning_layer_used: POB lexical decision for וַיֹּסֶף לְהַכֹּתָהּ and immediate narrative context
  rationale: Naming Balaam removes pronoun ambiguity, and “hit” is common English for the same action.
