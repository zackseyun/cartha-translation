translation:
  language: en
  text: Then Yahweh uncovered Balaam’s eyes.[a] Balaam saw the angel of Yahweh standing in the road, holding a drawn sword. Balaam bowed low and fell facedown on the ground.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “opened Balaam’s eyes.” The Hebrew literally says “uncovered.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Then Yahweh uncovered Balaam’s eyes, and he saw
  simplified_phrase: Then Yahweh uncovered Balaam’s eyes. Balaam saw
  preserved_meaning: Yahweh removed the barrier to Balaam’s sight, after which Balaam saw the angel.
  reasoning_layer_used: Lexical decision for וַיְגַל and narrative context
  rationale: Two sentences clarify the sequence while retaining the Hebrew image of uncovering.
- pob_phrase: with his sword drawn in his hand
  simplified_phrase: holding a drawn sword
  preserved_meaning: The angel stood armed with an unsheathed sword.
  reasoning_layer_used: Lexical decision for וְחַרְבּוֹ שְׁלֻפָה בְיָדוֹ
  rationale: The shorter wording states the same visible action in natural English.
- pob_phrase: he bowed down and prostrated himself with his face to the ground
  simplified_phrase: Balaam bowed low and fell facedown on the ground
  preserved_meaning: Balaam lowered himself and then placed his body face down before the angel.
  reasoning_layer_used: Lexical and theological decisions for וַיִּקֹּד and וַיִּשְׁתַּחוּ
  rationale: Common physical language preserves both actions without interpreting them explicitly as worship.
translation_notes:
  risk_flags:
