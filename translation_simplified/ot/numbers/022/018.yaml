- pob_phrase: go beyond the word of Yahweh my God, to do anything small or great
  simplified_phrase: go beyond what Yahweh my God has said, whether in a small matter or a great one
  preserved_meaning: Balaam says he cannot depart from Yahweh’s word in any matter, minor or major.
