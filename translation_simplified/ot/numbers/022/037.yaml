simplification_decisions:
- pob_phrase: Did I not indeed send to you to call you?
  simplified_phrase: I certainly sent for you, didn’t I?
  preserved_meaning: Balak emphatically reminds Balaam that he summoned him and expects agreement.
  reasoning_layer_used: Lexical decisions for הֲלֹא, שָׁלֹחַ שָׁלַחְתִּי, and לִקְרֹא לָךְ.
  rationale: The tag question and “sent for you” express the summons naturally, while “certainly” preserves emphasis without asserting urgency.
- pob_phrase: Why did you not come to me?
  simplified_phrase: Why didn’t you come to me?
  preserved_meaning: Balak asks why Balaam failed to come to him.
  reasoning_layer_used: Lexical decision for לָמָּה לֹא הָלַכְתָּ אֵלָי.
  rationale: The contraction makes Balak’s direct speech natural without changing its force.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “honor” as respect alone.
    mitigation: The footnote preserves its possible sense of reward or high status.
