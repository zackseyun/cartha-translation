- pob_phrase: because he was going
  simplified_phrase: because Balaam was traveling
  preserved_meaning: God’s anger arose while Balaam’s journey was underway.
  reasoning_layer_used: lexical decision and immediate narrative context
  rationale: “Was traveling” expresses the ongoing action in ordinary English.
- pob_phrase: took his stand in the road as an adversary to him
  simplified_phrase: positioned himself in the road to oppose him
  preserved_meaning: The angel deliberately placed himself in Balaam’s path as his opponent.
  reasoning_layer_used: lexical and theological decisions
  rationale: The wording keeps both the deliberate positioning and the angel’s opposing role.
- pob_phrase: his two young men were with him
  simplified_phrase: two young men were traveling with him
  preserved_meaning: Two young male companions accompanied Balaam on the journey.
  reasoning_layer_used: lexical decision and scene context
  rationale: Adding “traveling” makes their role in the scene immediately clear without calling them servants.
