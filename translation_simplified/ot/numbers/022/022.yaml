translation:
  language: en
  text: But God’s anger burned because Balaam was traveling. The angel of Yahweh positioned himself in the road to oppose him.[a] Balaam was riding his donkey,[b] and two young men were traveling with him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses the common noun “adversary” or “opponent,” not necessarily the proper name Satan.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word specifically refers to a female donkey.
    reason: lexical_alternative
