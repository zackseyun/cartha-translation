  reasoning_layer_used: POB lexical decision for וְחַרְבּוֹ שְׁלוּפָה בְיָדוֹ
  rationale: The shorter wording keeps the threatening sword image in natural English.
- pob_phrase: the donkey turned aside from the road and went into the field
  simplified_phrase: She left the road and went into a field
  preserved_meaning: The female donkey moved off the roadway into the adjacent field.
  reasoning_layer_used: POB lexical decisions for וַתֵּט, מִן הַדֶּרֶךְ, and וַתֵּלֶךְ בַּשָּׂדֶה
  rationale: A direct motion verb makes the action immediately clear while “she” preserves the donkey’s sex.
- pob_phrase: to turn her back to the road
