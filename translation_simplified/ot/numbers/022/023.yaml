translation:
  language: en
  text: The donkey saw the angel of Yahweh[a] standing in the road, holding a drawn sword. She left the road and went into a field. Balaam struck her to make her go back onto the road.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the messenger of Yahweh.”
    reason: lexical_alternative
