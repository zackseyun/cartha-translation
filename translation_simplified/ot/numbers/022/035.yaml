translation:
  language: en
  text: Then the angel of Yahweh said to Balaam, “Go with the men. But you must say only what I tell you to say.” So Balaam went with Balak’s officials.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: but only the word that I speak to you, that you shall speak
  simplified_phrase: But you must say only what I tell you to say.
  preserved_meaning: Balaam may speak only the message Yahweh gives him.
  reasoning_layer_used: Lexical decisions for וְאֶפֶס, הַדָּבָר, and אֹתוֹ תְדַבֵּר
  rationale: The direct command removes the awkward repetition while preserving its strong restriction.
- pob_phrase: the officials of Balak
  simplified_phrase: Balak’s officials
  preserved_meaning: The men belong to Balak’s diplomatic entourage.
  reasoning_layer_used: Lexical decision for שָׂרֵי בָלָק
  rationale: The possessive form is shorter and more natural without implying royal sons.
translation_notes:
  risk_flags:
  - risk: Replacing “the word” with “what I tell you” reduces the Hebrew verbal echo.
    mitigation: The repeated verb “say” preserves the speech focus and Balaam’s obligation to repeat only the given message.
