simplification_decisions:
- pob_phrase: For I will greatly honor you
  simplified_phrase: I will greatly honor you
  preserved_meaning: Balak emphatically promises Balaam great honor as grounds for his renewed request.
  reasoning_layer_used: POB discourse and lexical decisions for כִּי and כַבֵּד אֲכַבֶּדְךָ
  rationale: Dropping “For” makes the promise flow naturally while the following “So” preserves its role as the reason for the request.
- pob_phrase: I will do whatever you say to me
  simplified_phrase: do whatever you tell me
  preserved_meaning: Balak promises unrestricted compliance with whatever Balaam says.
  reasoning_layer_used: POB lexical decision for וְכֹל אֲשֶׁר תֹּאמַר אֵלַי אֶעֱשֶׂה
  rationale: “Tell me” is plain English and keeps the source broader than requests alone.
translation_notes:
  risk_flags:
