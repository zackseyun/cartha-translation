translation:
  language: en
  text: When the cloud stayed over the tabernacle for many days, the sons of Israel[a] obeyed Yahweh’s requirement and did not break camp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, the Israelites; the Hebrew says “the sons of Israel.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the cloud remained over the tabernacle
  simplified_phrase: the cloud stayed over the tabernacle
  preserved_meaning: The visible cloud continued in place above Israel’s wilderness sanctuary.
  reasoning_layer_used: Lexical decision for וּבְהַאֲרִיךְ and עַל הַמִּשְׁכָּן
  rationale: “Stayed” expresses the extended duration in direct, common English.
- pob_phrase: kept the charge of Yahweh
  simplified_phrase: obeyed Yahweh’s requirement
  preserved_meaning: They carefully observed the duty Yahweh had imposed.
  reasoning_layer_used: Lexical decision for וְשָׁמְרוּ אֶת מִשְׁמֶרֶת יְהוָה
  rationale: This wording makes the duty and their obedience clear without reducing it to a generic command.
- pob_phrase: did not set out
  simplified_phrase: did not break camp
  preserved_meaning: They did not pull up camp and continue their wilderness journey.
  reasoning_layer_used: Lexical decision for וְלֹא יִסָּעוּ
  rationale: “Break camp” clearly conveys departure in this wilderness-travel setting.
translation_notes:
  risk_flags:
  - risk: “Requirement” may carry less covenantal weight than “charge.”
    mitigation: The verb “obeyed” preserves the sense of faithfully fulfilling Yahweh’s assigned duty.
