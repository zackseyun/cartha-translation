translation:
  language: en
  text: But if a man is ritually clean and is not away on a journey, yet does not observe the Passover, that person will be cut off from his people.[a] This is because he did not present Yahweh’s offering at its appointed time. That man will bear his sin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “cut off” but does not specify here whether this judgment means death, exclusion, or another severe covenant penalty.
    reason: lexical_alternative
  - marker: b
    text: Or, “bear his guilt.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: is clean
  simplified_phrase: is ritually clean
  preserved_meaning: The man is ceremonially eligible to observe the Passover, not morally sinless.
  reasoning_layer_used: POB lexical decision for טָהוֹר
  rationale: The clarifier prevents readers from mistaking ritual status for moral purity.
- pob_phrase: is not on a journey, yet fails to keep the Passover
  simplified_phrase: is not away on a journey, yet does not observe the Passover
  preserved_meaning: The man has no travel exemption but neglects the Passover observance.
  reasoning_layer_used: POB lexical decisions and surrounding context
  rationale: The wording makes the travel exception and neglected observance immediately clear.
- pob_phrase: that person shall be cut off ... because ...; that man shall bear his sin
  simplified_phrase: that person will be cut off ... This is because ... That man will bear his sin
  preserved_meaning: The severe judgment, its reason, and the man’s liability remain distinct consequences rather than commands to an enforcer.
  reasoning_layer_used: POB theological decision, Hebrew clause sequence, and grounding review
  rationale: Short sentences clarify the logic while future wording preserves the announced consequences.
interpretive_expansions:
- pob_phrase: clean
  rendering: ritually clean
  claim: The cleanness in view is ceremonial fitness for Passover observance.
  evidence:
