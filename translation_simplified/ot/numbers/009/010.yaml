translation:
  language: en
  text: 'Tell the sons of Israel[a]: “If any man among you, now or in future generations, is ceremonially unclean because of a dead body or is away on a distant journey, he must still observe the Passover for Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “sons of Israel,” referring here to the Israelite community as a whole.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Speak to the sons of Israel, saying
  simplified_phrase: Tell the sons of Israel
  preserved_meaning: Moses is commanded to address the Israelite community.
  reasoning_layer_used: lexical decision for דַּבֵּר and gendered covenantal address
  rationale: “Tell” removes the formal speech formula while retaining the command and the chosen gendered title.
- pob_phrase: whether among you or among your generations
  simplified_phrase: among you, now or in future generations
  preserved_meaning: The rule applies both to the present community and to later generations.
  reasoning_layer_used: lexical rationale for לָכֶם and לְדֹרֹתֵיכֶם
  rationale: The time span is stated directly instead of preserving an unclear English parallel.
- pob_phrase: he shall still keep the Passover to Yahweh
  simplified_phrase: he must still observe the Passover for Yahweh
  preserved_meaning: The man remains obligated to observe Passover despite impurity or distant travel.
  reasoning_layer_used: lexical decision for וְעָשָׂה פֶסַח and theological decision for יהוה
  rationale: “Observe” and “must” make the legal obligation clear while retaining “still” and the divine name Yahweh.
interpretive_expansions:
- pob_phrase: unclean by a dead body
  rendering: ceremonially unclean because of a dead body
  claim: The uncleanness is ritual impurity caused by association with a corpse.
  evidence:
  - The lexical rationale identifies טָמֵא לָנֶפֶשׁ as a priestly legal idiom for corpse impurity.
  - The immediate passage regulates eligibility to observe Passover.
  confidence: high
  alternatives_preserved:
  - unclean because of a corpse
translation_notes:
  risk_flags:
  - risk: “Now or in future generations” makes the temporal scope more explicit than the POB wording.
    mitigation: The rendering follows the POB rationale that the rule extends from the present community to descendants.
  - risk: “For Yahweh” replaces the POB’s “to Yahweh.”
    mitigation: The lexical record recognizes both “to” and “for” as expressing that the Passover is directed to Yahweh.
