  preserved_meaning: They carried out the whole Passover observance.
  reasoning_layer_used: POB lexical decision for וַיַּעֲשׂוּ and הַפֶּסַח
  rationale: “Observed” clearly expresses performing the commanded religious practice.
- pob_phrase: in the wilderness of Sinai
