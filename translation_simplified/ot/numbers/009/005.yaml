translation:
  language: en
  text: So the sons of Israel observed the Passover in the Sinai wilderness. They did this at twilight[a] on the fourteenth day of the first month, exactly as Yahweh had commanded Moses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “between the evenings,” an expression for the twilight period.
    reason: lexical_alternative
