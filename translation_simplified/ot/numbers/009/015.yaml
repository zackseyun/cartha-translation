translation:
  language: en
  text: On the day the tabernacle was set up, the cloud covered it—the tent that housed the covenant testimony.[a] In the evening, the cloud over the tabernacle looked like fire and remained there until morning.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated “the tent of witness.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the tabernacle, the tent of the testimony
  simplified_phrase: it—the tent that housed the covenant testimony
  preserved_meaning: The second phrase identifies the tabernacle and connects the testimony with what was housed there.
  reasoning_layer_used: POB theological and lexical decisions
  rationale: The apposition is clarified without treating the tent as a separate structure.
- pob_phrase: like the appearance of fire
  simplified_phrase: looked like fire
  preserved_meaning: The cloud resembled fire visually but is not identified as fire.
  reasoning_layer_used: POB lexical decision for כְּמַרְאֵה אֵשׁ
  rationale: The simpler wording preserves the source’s comparison.
- pob_phrase: it was over the tabernacle ... until morning
  simplified_phrase: the cloud over the tabernacle ... remained there until morning
  preserved_meaning: The cloud continued over the tabernacle through the night.
  reasoning_layer_used: POB lexical decisions and immediate context
  rationale: Naming the cloud removes an unclear pronoun and makes the duration natural in English.
interpretive_expansions:
- pob_phrase: the tent of the testimony
  rendering: the tent that housed the covenant testimony
  claim: The testimony is the covenant testimony housed in the tabernacle.
  evidence:
  - The POB lexical rationale explicitly identifies it as the covenant testimony housed there.
  confidence: high
  alternatives_preserved:
  - the tent of witness
- pob_phrase: it was over the tabernacle
  rendering: the cloud over the tabernacle
  claim: The pronoun refers to the cloud.
  evidence:
  - The cloud is the stated subject that covered the tabernacle in the preceding clause.
  confidence: high
translation_notes:
  risk_flags:
  - risk: “Looked like fire” could be misread as identifying the cloud as actual fire.
    mitigation: The comparative word “like” preserves the distinction between appearance and identity.
