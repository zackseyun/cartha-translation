  simplified_phrase: a foreigner living among you
  preserved_meaning: This is a resident foreigner among Israel, not a passing traveler.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: The wording explains the unfamiliar legal term in ordinary English.
- pob_phrase: would keep the Passover
  simplified_phrase: wants to observe the Passover
  preserved_meaning: The person intends to participate in the Passover rite.
  reasoning_layer_used: POB lexical decision for וְעָשָׂה פֶסַח
  rationale: “Observe” makes the ritual idiom immediately understandable.
- pob_phrase: according to the statute of the Passover and according to its ordinance; so he shall do it
  simplified_phrase: he must do so according to the Passover’s prescribed statute and procedure
  preserved_meaning: The observance must conform to both the established requirement and its proper procedure.
  reasoning_layer_used: POB lexical decisions for חֻקָּה, מִשְׁפָּט, and כֵּן יַעֲשֶׂה
  rationale: The recast sentence removes repetition while retaining both legal ideas and the command’s force.
