translation:
  language: en
  text: If a foreigner living among you wants to observe the Passover for Yahweh, he must do so according to the Passover’s prescribed statute and procedure. The same statute applies to you, to the resident foreigner, and to the native-born person of the land.
  philosophy: optimal-equivalence
