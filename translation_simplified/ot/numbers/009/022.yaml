translation:
  language: en
  text: The cloud might stay over the tabernacle for two days, a month, or a longer time.[a] As long as it remained there, the Israelites stayed in camp and did not set out. But when the cloud lifted, they set out.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “days,” which here likely means many days or an extended period.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Whether it was two days, or a month, or a longer time, when the cloud remained over the tabernacle
  simplified_phrase: The cloud might stay over the tabernacle for two days, a month, or a longer time.
  preserved_meaning: The cloud could remain over the tabernacle for any of the listed durations.
  reasoning_layer_used: Lexical decisions for the repeated alternatives, durations, and בְּהַאֲרִיךְ.
  rationale: A direct statement makes the range of durations easier to follow.
- pob_phrase: dwelling over it
  simplified_phrase: As long as it remained there
  preserved_meaning: The cloud had a settled, continuing presence over the tabernacle.
  reasoning_layer_used: Lexical decision for לִשְׁכֹּן עָלָיו.
  rationale: The new clause preserves the abiding sense without the awkward participle.
- pob_phrase: the sons of Israel would camp and would not set out
  simplified_phrase: the Israelites stayed in camp and did not set out
  preserved_meaning: Israel customarily remained encamped until the cloud lifted.
  reasoning_layer_used: Lexical decisions for בְנֵי יִשְׂרָאֵל, יַחֲנוּ, and נסע.
  rationale: The common name and ordinary past wording make the customary action immediately clear.
