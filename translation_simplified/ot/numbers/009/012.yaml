translation:
  language: en
  text: They must not leave any of it until morning or break any of its bones. They must observe the Passover according to all its rules.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: They shall leave none of it until morning
  simplified_phrase: They must not leave any of it until morning
  preserved_meaning: Nothing from the Passover meal may remain until morning.
  reasoning_layer_used: Lexical decision for יַשְׁאִירוּ and the partitive sense of מִמֶּנּוּ
  rationale: The direct prohibition is easier to understand than the formal “shall leave none” construction.
- pob_phrase: they shall not break a bone of it
  simplified_phrase: or break any of its bones
  preserved_meaning: No bone belonging to it may be broken.
  reasoning_layer_used: Lexical decision recognizing the singular noun as distributive
  rationale: “Any of its bones” states the distributive sense in natural modern English.
- pob_phrase: according to all the statute of the Passover they shall keep it
  simplified_phrase: They must observe the Passover according to all its rules.
  preserved_meaning: They must carry out the entire prescribed observance of Passover.
  reasoning_layer_used: Lexical decisions for חֻקַּת and יַעֲשׂוּ אֹתוֹ
  rationale: “Observe” and “all its rules” clearly express keeping the full Passover ordinance.
translation_notes:
  risk_flags:
  - risk: “Any of its bones” is less formally close to the Hebrew singular “a bone.”
    mitigation: The POB lexical reasoning confirms that the singular is distributive and permits this wording.
