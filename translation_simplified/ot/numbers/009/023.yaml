translation:
  language: en
  text: They camped when Yahweh commanded them, and they set out when he commanded them. They carried out the responsibility Yahweh had entrusted to them, following the command Yahweh gave through Moses.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: At the command of Yahweh they camped, and at the command of Yahweh they set out.
  simplified_phrase: They camped when Yahweh commanded them, and they set out when he commanded them.
  preserved_meaning: Yahweh directly determined both when Israel camped and when they departed.
  reasoning_layer_used: POB lexical decisions for עַל־פִּי, יַחֲנוּ, and יִסָּעוּ
  rationale: The clauses use ordinary English while keeping the two actions under Yahweh’s authority.
- pob_phrase: They kept the charge of Yahweh
  simplified_phrase: They carried out the responsibility Yahweh had entrusted to them
  preserved_meaning: Israel observed the responsibility Yahweh had placed in their care.
  reasoning_layer_used: POB lexical decisions for מִשְׁמֶרֶת and שָׁמָרוּ
  rationale: This makes the custodial and obedient senses of “kept the charge” understandable.
- pob_phrase: at the command of Yahweh by the hand of Moses
  simplified_phrase: following the command Yahweh gave through Moses
  preserved_meaning: They acted according to Yahweh’s direction, which Moses communicated as mediator.
  reasoning_layer_used: POB lexical decisions for עַל־פִּי and בְּיַד מֹשֶׁה
  rationale: The agency idiom is clarified without separating Yahweh’s charge from his command.
