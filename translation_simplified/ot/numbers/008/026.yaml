translation:
  language: en
  text: But he may still assist his fellow Levites in their ministry at the tent of meeting, fulfilling his assigned responsibilities. He must not do the regular work there. Apply this rule to the Levites in their duties.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: minister with his brothers
  simplified_phrase: assist his fellow Levites in their ministry
  preserved_meaning: The older Levite may continue supporting the other male members of his Levitical group in sacred service.
  reasoning_layer_used: lexical and theological decisions
  rationale: This identifies the brothers as fellow Levites while retaining the sacred setting and supportive role.
- pob_phrase: to keep the charge
  simplified_phrase: fulfilling his assigned responsibilities
  preserved_meaning: He continues to carry out responsibilities entrusted to him.
  reasoning_layer_used: lexical decision for לִשְׁמֹר מִשְׁמֶרֶת
  rationale: The wording explains the otherwise opaque expression “keep the charge.”
- pob_phrase: he shall do no service
  simplified_phrase: He must not do the regular work there
  preserved_meaning: He is exempt from the ordinary labor performed by younger Levites.
  reasoning_layer_used: lexical and theological decisions
  rationale: A separate sentence makes the prohibition clear without implying that all participation ends.
interpretive_expansions:
- pob_phrase: But he may minister
  rendering: But he may still assist
  claim: The permission concerns continued participation after retirement from regular service.
  evidence:
  - The preceding age regulation supplies the post-retirement setting.
  - The POB theological decision distinguishes permitted assistance from prohibited labor.
  confidence: high
  alternatives_preserved:
  - The activity may include assistance or oversight rather than one narrowly defined task.
- pob_phrase: do no service
  rendering: must not do the regular work there
  claim: The prohibition applies to regular Levitical labor, not every form of ministry.
  evidence:
  - The Hebrew contrasts ministerial activity with עֲבֹדָה and עבד.
  - The POB lexical rationale identifies this as work proper to younger Levites.
  confidence: high
  alternatives_preserved:
  - The prohibited activity may also be described as labor or service.
