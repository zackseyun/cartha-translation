translation:
  language: en
  text: Aaron did as instructed. He positioned the lamps toward the front of the lampstand,[a][b] just as Yahweh had commanded Moses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean “facing the front of” or “opposite the front of” the lampstand.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also mean that Aaron lit the lamps; the verb can refer to setting them in place or lighting them.
    reason: lexical_alternative
