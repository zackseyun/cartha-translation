simplification_decisions:
- pob_phrase: And I have given the Levites as a gift to Aaron and to his sons from among the sons of Israel
  simplified_phrase: I have given the Levites to Aaron and his sons as a gift from among the sons of Israel.
  preserved_meaning: The Levites are selected from Israel and given as a gift to Aaron's priestly family.
  reasoning_layer_used: Lexical decisions for וָאֶתְּנָה, נְתֻנִים, and מִתּוֹךְ
  rationale: The reordered sentence clearly identifies both the recipients and the group from which the Levites were chosen.
- pob_phrase: to do the service of the sons of Israel in the tent of meeting
  simplified_phrase: They will carry out service on behalf of the sons of Israel at the tent of meeting
  preserved_meaning: The Levites perform Israel's assigned tabernacle service in a representative role.
  reasoning_layer_used: Lexical decision for לַעֲבֹד אֶת עֲבֹדַת and theological decision on the Levites' role
  rationale: “On behalf of” prevents readers from mistaking Israel for the people performing the service.
- pob_phrase: so that there may not be a plague among the sons of Israel when the sons of Israel come near
  simplified_phrase: This is so that no plague will strike the sons of Israel when they approach
  preserved_meaning: This arrangement protects Israel from a plague when the people approach the sacred place.
  reasoning_layer_used: Lexical decisions for נֶגֶף and בְּגֶשֶׁת
  rationale: The direct wording removes needless repetition without weakening the warning.
