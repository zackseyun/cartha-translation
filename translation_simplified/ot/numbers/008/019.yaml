translation:
  language: en
  text: I have given the Levites to Aaron and his sons as a gift from among the sons of Israel. They will carry out service on behalf of the sons of Israel at the tent of meeting and make atonement for the sons of Israel. This is so that no plague will strike the sons of Israel when they approach the holy place.[a]
