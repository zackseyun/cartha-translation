  text: Moses, Aaron, and the whole congregation of the sons of Israel[a] did for the Levites everything that Yahweh had commanded Moses concerning them. In this way, the sons of Israel did for the Levites exactly what Yahweh had commanded concerning them.
  philosophy: optimal-equivalence
