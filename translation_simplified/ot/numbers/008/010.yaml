translation:
  language: en
  text: Bring the Levites into Yahweh’s presence. Then the sons of Israel[a] shall lay their hands on them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This is a Hebrew expression for the people of Israel as a whole; it may also be translated “the Israelites.”
