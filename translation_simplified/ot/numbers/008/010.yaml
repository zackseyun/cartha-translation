simplification_decisions:
- pob_phrase: You shall bring the Levites before Yahweh
  simplified_phrase: Bring the Levites into Yahweh’s presence.
  preserved_meaning: The Levites are commanded to be brought near before Yahweh in the ritual setting.
  reasoning_layer_used: The lexical decision for וְהִקְרַבְתָּ and לִפְנֵי יְהוָה permits clear idiomatic wording.
  rationale: A direct command and “into Yahweh’s presence” make the action immediately clear.
- pob_phrase: and the sons of Israel shall lay their hands on the Levites
  simplified_phrase: Then the sons of Israel shall lay their hands on them.
  preserved_meaning: The covenant people perform the physical laying-on-of-hands action upon the Levites.
  reasoning_layer_used: The lexical and theological decisions preserve both the ritual action and the expression “sons of Israel.”
  rationale: A new sentence and a clear pronoun reduce repetition without weakening the ritual image.
