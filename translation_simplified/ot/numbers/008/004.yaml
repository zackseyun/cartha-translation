translation:
  language: en
  text: 'This is how the gold lampstand was made: it was hammered into shape, and every part from its base to its flower-shaped ornament was hammered work.[a] He made the lampstand according to the pattern Yahweh had shown Moses.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew emphasizes shaping the lampstand by hammering; some understand it also to mean that it was made of one piece.
    reason: lexical_alternative
  - marker: b
    text: “Pattern” could also be translated “appearance” or “vision.”
    reason: lexical_alternative
