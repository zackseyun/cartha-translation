  text: From among the Israelites,[b] Aaron shall present the Levites before Yahweh as a wave offering.[a] He shall do this so that they may carry out sacred service for Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A wave offering was a ritual presentation to Yahweh; the Levites were not being sacrificed.
    reason: cultural_note
  - marker: b
    text: “From among the Israelites” may also mean “on behalf of the Israelites.”
    reason: alternative_reading
