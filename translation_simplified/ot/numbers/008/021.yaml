translation:
  language: en
  text: The Levites purified themselves and washed their clothes. Then Aaron presented them before Yahweh in the ritual of a wave offering.[a] He made atonement for them so they would be ritually clean.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be rendered “waved them as a wave offering”; it describes their ritual presentation before Yahweh.
    reason: lexical_alternative
