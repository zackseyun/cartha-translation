translation:
  language: en
  text: Then the Levites must place their hands on the bulls’ heads. You must offer one bull as a sin offering[a] and the other as a burnt offering to Yahweh, to make atonement for the Levites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “purification offering.” The Hebrew term can refer to an offering connected with both sin and purification.
    reason: lexical_alternative
