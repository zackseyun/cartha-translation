  preserved_meaning: The Levites physically perform the required ritual gesture on both bulls.
  reasoning_layer_used: POB lexical decisions for יִסְמְכוּ, יְדֵיהֶם, and עַל רֹאשׁ הַפָּרִים
  rationale: “Place” and the possessive form make the ritual action easier to picture without weakening it.
- pob_phrase: and you shall offer one as a sin offering and the other as a burnt offering
  simplified_phrase: You must offer one bull as a sin offering and the other as a burnt offering
  preserved_meaning: The singular officiant is commanded to offer the two bulls in distinct sacrificial roles.
  reasoning_layer_used: POB lexical decisions for וַעֲשֵׂה, חַטָּאת, and עֹלָה
  rationale: A new sentence and the repeated word “bull” clarify who acts and what is offered.
