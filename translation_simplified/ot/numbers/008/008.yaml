translation:
  language: en
  text: 'Then they must take a young bull and the grain offering that goes with it: fine flour mixed with oil. You must also take a second young bull for a sin offering.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “purification offering.” The Hebrew term can refer to the sacrifice traditionally called the sin offering, with emphasis on its purifying function.
    reason: lexical_alternative
