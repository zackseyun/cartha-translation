- pob_phrase: facing the tent of meeting
  rendering: at a distance from it
  claim: The phrase marks the camps’ separated position relative to the tent rather than requiring inward physical orientation.
  evidence:
  - The Hebrew spatial construction places the camps relative to the tent and then says they surround it.
  - Numbers 2:17 places the Levites between the tribal camps and the tent.
  - The POB audit lists “opposite” as a lexical alternative.
  confidence: moderate
  alternatives_preserved:
  - opposite it
  - facing it
