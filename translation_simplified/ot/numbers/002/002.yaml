translation:
  language: en
  text: The sons of Israel must camp, each man by his banner[a] and with the identifying signs of his father’s household. They must camp all around the tent of meeting, at a distance from it.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “standard”; this was a banner identifying a tribe or military division.
    reason: lexical_alternative
  - marker: b
    text: Or “opposite it”; the Hebrew describes their position relative to the tent, not necessarily the direction they faced.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: shall camp
  simplified_phrase: must camp
  preserved_meaning: The camping arrangement is commanded rather than merely predicted.
  reasoning_layer_used: POB lexical decision for יַחֲנוּ
  rationale: “Must” expresses the directive force in familiar modern English.
- pob_phrase: according to the signs of their fathers’ houses
  simplified_phrase: with the identifying signs of his father’s household
  preserved_meaning: Each man camps with markers connected to his paternal household group.
  reasoning_layer_used: POB lexical decisions for בְאֹתֹת and לְבֵית אֲבֹתָם
  rationale: “Identifying” explains the signs, and “household” clarifies the kinship group.
- pob_phrase: they shall camp facing the tent of meeting, all around it
  simplified_phrase: They must camp all around the tent of meeting, at a distance from it
  preserved_meaning: Israel’s camps surround the meeting tent while remaining spatially separated from it.
  reasoning_layer_used: Source syntax, POB alternatives for מִנֶּגֶד, and Numbers 2 camp layout
  rationale: The wording avoids implying that every camper physically faced inward.
interpretive_expansions:
- pob_phrase: the signs
  rendering: the identifying signs
  claim: The signs distinguish the paternal household groups.
  evidence:
