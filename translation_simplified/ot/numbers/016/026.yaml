translation:
  language: en
  text: He told the gathered people, “Please move away from the tents of these wicked men. Do not touch anything they own, or you may be swept away in the judgment connected with all their sins.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “destroyed because of all their sins.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: spoke to the congregation, saying
