  preserved_meaning: He addressed the assembled Israelite community.
  reasoning_layer_used: lexical decision for הָעֵדָה
  rationale: This replaces biblical-sounding phrasing while preserving the corporate gathering.
- pob_phrase: anything that belongs to them
  simplified_phrase: anything they own
  preserved_meaning: The prohibition covers all their possessions.
  reasoning_layer_used: lexical decision for בְּכָל אֲשֶׁר לָהֶם
  rationale: The shorter wording expresses the same comprehensive prohibition.
- pob_phrase: lest you be swept away
  simplified_phrase: or you may be swept away
  preserved_meaning: They are urgently warned that they could share in the coming destruction.
  reasoning_layer_used: lexical and theological decisions for פֶּן תִּסָּפוּ
  rationale: This removes the uncommon conjunction “lest” while retaining the judgment image.
