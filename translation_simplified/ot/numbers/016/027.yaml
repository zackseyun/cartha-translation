translation:
  language: en
  text: So they left the area around the dwelling of Korah, Dathan, and Abiram. Then Dathan and Abiram came out and stood at the entrances to their tents, together with their wives, their sons, and their little children.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: moved away from around the dwelling
  simplified_phrase: left the area around the dwelling
  preserved_meaning: The people withdrew from the vicinity of the dwelling rather than moving upward.
  reasoning_layer_used: POB lexical decisions for וַיֵּעָלוּ, מֵעַל, מִשְׁכַּן, and מִסָּבִיב
  rationale: This wording clearly expresses withdrawal while retaining the source's limited identification of the dwelling.
- pob_phrase: came out, standing at the entrance of their tents
  simplified_phrase: came out and stood at the entrances to their tents
  preserved_meaning: Dathan and Abiram emerged and stood at their respective tent entrances.
  reasoning_layer_used: POB lexical decisions for יָצְאוּ, נִצָּבִים, פֶּתַח, and אָֽהֳלֵיהֶם
  rationale: Two direct verbs replace the awkward participial construction.
- pob_phrase: with their wives, their sons, and their little children
  simplified_phrase: together with their wives, their sons, and their little children
  preserved_meaning: Their families accompanied them, with sons and younger children remaining distinct groups.
  reasoning_layer_used: POB lexical decisions for וּנְשֵׁיהֶם, וּבְנֵיהֶם, and וְטַפָּם
  rationale: Together with makes the accompaniment clear without merging the family categories.
translation_notes:
  risk_flags:
  - risk: Dwelling could be mistaken for the LORD's tabernacle.
    mitigation: The names and immediate reference to their tents identify it as the dwelling associated with the three men.
