translation:
  language: en
  text: They gathered against Moses and Aaron and said, “You have gone too far! For the whole community—every one of them—is holy, and Yahweh is among them. So why do you set yourselves above Yahweh’s assembly?”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: They assembled against Moses and against Aaron
  simplified_phrase: They gathered against Moses and Aaron
  preserved_meaning: The group deliberately came together in opposition to both leaders.
  reasoning_layer_used: Lexical decisions for וַיִּקָּהֲלוּ and עַל
  rationale: “Gathered against” is familiar wording that retains the confrontational sense.
- pob_phrase: all the congregation—all of them—
  simplified_phrase: the whole community—every one of them—
  preserved_meaning: The speakers emphatically claim holiness for everyone in Israel’s community.
  reasoning_layer_used: Lexical decision for כָל הָעֵדָה כֻּלָּם
  rationale: “Community” is clearer than “congregation,” while the repeated phrase preserves the emphasis.
- pob_phrase: do you exalt yourselves above
  simplified_phrase: do you set yourselves above
  preserved_meaning: They accuse Moses and Aaron of raising themselves over Yahweh’s assembly.
  reasoning_layer_used: Lexical decision for תִּתְנַשְּׂאוּ עַל
  rationale: “Set yourselves above” clearly conveys deliberate self-elevation.
translation_notes:
  risk_flags:
  - risk: The claim that every member is holy could be mistaken for the narrator’s judgment.
    mitigation: The wording keeps the claim within the rebels’ quoted accusation without adding commentary.
