simplification_decisions:
- pob_phrase: He has brought you near
  simplified_phrase: God has given you ... the privilege of coming near to him
  preserved_meaning: God granted Korah access and honored service, while the image of coming near remains.
  reasoning_layer_used: The lexical rationale identifies both spatial nearness and cultic status, and the immediate context identifies God.
  rationale: Naming God removes pronoun ambiguity, and “privilege” explains the granted access.
- pob_phrase: all your brothers, the sons of Levi
  simplified_phrase: all your fellow Levites
  preserved_meaning: The group consists of Korah's fellow descendants of Levi.
  reasoning_layer_used: The lexical alternatives explicitly permit “all your fellow Levites.”
  rationale: This replaces an unfamiliar genealogical expression with its clear group name.
- pob_phrase: yet you are seeking the priesthood as well
  simplified_phrase: Yet you also want the priesthood!
  preserved_meaning: Korah and his company desire the priestly office in addition to their Levitical privilege.
  reasoning_layer_used: The lexical and theological decisions preserve both the contrast and the distinct office of priesthood.
  rationale: “Want” makes the rebuke natural, while “also” keeps the demand for further status.
interpretive_expansions:
- pob_phrase: He has brought you near
  rendering: God has given you ... the privilege of coming near to him
  claim: God granted access for honored Levitical service rather than merely reducing physical distance.
  evidence:
