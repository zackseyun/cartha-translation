translation:
  language: en
  text: Then he told Korah and everyone with him, “In the morning Yahweh will make it clear[a] who belongs to him and who is holy. He will bring that person near to himself.[b] The one Yahweh chooses is the one he will bring near to himself.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Yahweh will know who belongs to him”; here “know” likely means publicly showing who truly belongs to him.
    reason: lexical_alternative
  - marker: b
    text: “Bring near” refers to being allowed to approach Yahweh for sacred service.
    reason: cultural_note
simplification_decisions:
- pob_phrase: And he spoke to Korah and to all his congregation, saying
  simplified_phrase: Then he told Korah and everyone with him
  preserved_meaning: He addressed Korah’s entire assembled group.
  reasoning_layer_used: POB lexical decision for עֲדָתוֹ
  rationale: This replaces the formal speech formula and unfamiliar sense of “congregation” with natural narrative English.
- pob_phrase: Yahweh will make known
  simplified_phrase: Yahweh will make it clear
  preserved_meaning: Yahweh will publicly reveal the people’s true status.
  reasoning_layer_used: POB lexical rationale for וְיֹדַע יְהוָה
  rationale: “Make it clear” expresses public disclosure more directly for modern readers.
- pob_phrase: The one whom he chooses, he will bring near to himself
  simplified_phrase: The one Yahweh chooses is the one he will bring near to himself
  preserved_meaning: Only Yahweh’s chosen person receives authorized access for sacred service.
  reasoning_layer_used: POB lexical decisions for בחר and the repeated קרב clause
  rationale: The recast sentence clarifies the emphasis while preserving the repeated priestly image.
translation_notes:
  risk_flags:
  - risk: “Everyone with him” is broader in tone than the corporate term “congregation.”
    mitigation: It remains limited to Korah’s assembled group in the opening address.
  - risk: Modern readers may take “bring near” as merely physical movement.
    mitigation: Footnote b explains its sacred-service meaning without removing the source image.
