  text: So you and your whole group have joined together against Yahweh. Who is Aaron that you grumble against him?
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Therefore, you and all your company who have assembled
  simplified_phrase: So you and your whole group have joined together
  preserved_meaning: Moses draws a conclusion and addresses Korah’s gathered faction as a whole.
  reasoning_layer_used: POB lexical decisions for לָכֵן, עֲדָתְךָ, and הַנֹּעָדִים
  rationale: Common wording makes the faction’s united action immediately clear.
- pob_phrase: against Yahweh—and Aaron, what is he
  simplified_phrase: against Yahweh. Who is Aaron
  preserved_meaning: Their rebellion is chiefly against Yahweh, while Aaron’s personal importance is minimized.
  reasoning_layer_used: POB theological decision on the true target of the rebellion
  rationale: Two sentences clarify the contrast without making Yahweh and Aaron equal targets.
- pob_phrase: that you grumble against him?
  simplified_phrase: that you grumble against him?
  preserved_meaning: The rhetorical question directly condemns their rebellious complaints against Aaron.
  reasoning_layer_used: POB lexical decisions for תלונו and עָלָיו plus grounding review
  rationale: The direct wording avoids adding an unsupported modal sense.
translation_notes:
  risk_flags:
  - risk: “Who is Aaron” could be mistaken for a request to identify him.
