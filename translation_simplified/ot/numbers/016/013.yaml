translation:
  language: en
  text: Was it not enough that you brought us up from a land flowing with milk and honey to kill us in the wilderness?[a] Must you also make yourself our ruler?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The speakers sarcastically describe Egypt as “a land flowing with milk and honey,” a phrase normally used for the promised land.
    reason: cultural_note
  - marker: b
    text: Or “lord it over us.”
