translation:
  language: en
  text: Then they fell facedown and said, “God, you are the God of the spirits of all humanity.[a] If one man sins,[b] will you be angry with the whole community?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the God who gives breath to all living beings.”
    reason: lexical_alternative
  - marker: b
    text: “One man” may represent any individual whose sin should not bring judgment on everyone.
    reason: lexical_alternative
