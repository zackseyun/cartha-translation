simplification_decisions:
- pob_phrase: And Yahweh spoke
  simplified_phrase: Then Yahweh spoke
  preserved_meaning: Yahweh's speech advances the narrative.
  reasoning_layer_used: The lexical rationale identifies the opening verb form as narrative progression.
  rationale: “Then” expresses the narrative sequence more naturally in modern English.
- pob_phrase: to Moses and to Aaron
  simplified_phrase: to Moses and Aaron
  preserved_meaning: Both Moses and Aaron are distinct addressees.
  reasoning_layer_used: The lexical decision for וְאֶל protects the coordination of both addressees.
  rationale: English does not need the repeated “to” to show that Yahweh addressed both men.
- pob_phrase: saying,
  simplified_phrase: ':'
  preserved_meaning: The words that follow are introduced as Yahweh's direct speech.
  reasoning_layer_used: The lexical rationale describes לֵאמֹר as a conventional speech introducer.
  rationale: A colon introduces the following speech clearly without the awkward formula “spoke … saying.”
translation_notes:
  risk_flags:
  - risk: Removing the repeated “to” could make the Hebrew coordination less visible.
    mitigation: The wording still plainly names Moses and Aaron as the two recipients.
  - risk: Replacing “saying” with punctuation reduces formal similarity to the Hebrew formula.
    mitigation: The colon preserves its function of introducing the speech that follows.
