translation:
  language: en
  text: Then Moses sent for Dathan and Abiram, Eliab’s sons. But they refused, saying, “We will not come up.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “We will not go up.” The Hebrew verb can refer either to going up to Moses’ location or to appearing before him when summoned.
    reason: lexical_alternative
