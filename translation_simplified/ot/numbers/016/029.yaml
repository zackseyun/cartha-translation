- pob_phrase: die the death of all mankind
  simplified_phrase: die as everyone else dies
  preserved_meaning: They would die in the ordinary way common to humanity.
  reasoning_layer_used: POB lexical decision for כְּמוֹת and collective כָּל הָאָדָם
  rationale: The recast keeps the emphatic comparison while using natural modern English.
- pob_phrase: the fate of all mankind is visited on them
  simplified_phrase: the usual human fate comes upon them
  preserved_meaning: They would experience only what ordinarily befalls human beings.
  reasoning_layer_used: POB lexical decisions for פְּקֻדָּה and פקד
  rationale: This removes the opaque passive wording without reducing the phrase to punishment.
