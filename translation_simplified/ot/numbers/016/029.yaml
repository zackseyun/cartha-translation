translation:
  language: en
  text: If these men die as everyone else dies, and the usual human fate comes upon them,[a] then Yahweh has not sent me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “they receive the visitation that comes to everyone”; the Hebrew repeats a word root that can refer to visitation, appointment, or what befalls someone.
    reason: lexical_alternative
