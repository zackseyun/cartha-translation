translation:
  language: en
  text: Is it not enough for you[a] that the God of Israel has separated you from the community of Israel to bring you near to himself, to serve at Yahweh’s tabernacle, and to stand before the community to minister to them?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
