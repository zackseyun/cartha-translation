translation:
  language: en
  text: Korah, together with Dathan, Abiram, and On, took men.[a] Korah was the son of Izhar, the son of Kohath, the son of Levi. Dathan and Abiram were sons of Eliab, and On was the son of Peleth. All three were sons of Reuben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “he took” without stating what he took; “men” is supplied from the next verse.
    reason: lexical_alternative
  - marker: b
    text: “Sons of Reuben” identifies their family line through Reuben.
    reason: cultural_note
