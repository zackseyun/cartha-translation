translation:
  language: en
  text: Look! You have risen in your fathers’ place—a brood of sinful men[a]—and you are making Yahweh’s burning anger against Israel even greater.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “an increase of sinful men” or “offspring of sinful men”; “brood” preserves the rebuking tone.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew literally pictures Yahweh’s anger as a burning nose, an expression for intense anger.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And behold
  simplified_phrase: Look!
  preserved_meaning: Moses begins with an emphatic call for attention.
  reasoning_layer_used: Lexical decision for וְהִנֵּה
  rationale: The common command “Look!” keeps the warning’s rhetorical force without the formal word “behold.”
- pob_phrase: you have risen up in your fathers’ place
  simplified_phrase: you have risen in your fathers’ place
  preserved_meaning: These men have arisen as successors to the previous generation.
  reasoning_layer_used: Lexical decisions for קַמְתֶּם and תַּחַת אֲבֹתֵיכֶם
  rationale: The wording keeps the rising image while expressing generational succession naturally.
- pob_phrase: to add still more to the burning anger
  simplified_phrase: and you are making the burning anger even greater
  preserved_meaning: Their conduct intensifies Yahweh’s already severe anger.
  reasoning_layer_used: Lexical decisions for לִסְפּוֹת, עוֹד, and חֲרוֹן אַף
  rationale: A direct verbal clause makes the consequence clear while retaining the burning-anger image.
translation_notes:
  risk_flags:
  - risk: “Brood” may sound unusually harsh to some modern readers.
    mitigation: The rebuking term is retained because it conveys the source noun’s offspring sense and negative force.
  - risk: Changing the purpose clause to a continuing-action clause may sound less intentional.
    mitigation: The rendering preserves the accusation that their conduct further increases Yahweh’s anger without claiming a private motive.
