translation:
  language: en
  text: Moses said to them, “If all the armed men from the tribes of Gad and Reuben cross the Jordan with you to fight before Yahweh, and the land is brought under your control, then you must give them the land of Gilead as their possession.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the sons of Gad and the sons of Reuben
  simplified_phrase: the men from the tribes of Gad and Reuben
  preserved_meaning: The men still belong to the two named Israelite tribes.
  reasoning_layer_used: POB lexical rationale identifies this as tribal identity language.
  rationale: The tribal wording is clearer to readers than the formal kinship expression.
- pob_phrase: every armed man for battle
  simplified_phrase: all the armed men ... to fight
  preserved_meaning: Every equipped fighting man must join the campaign.
  reasoning_layer_used: POB lexical decisions for חָלוּץ and מִלְחָמָה preserve the military setting.
  rationale: Ordinary English states both who must go and why they go.
- pob_phrase: the land is subdued before you
  simplified_phrase: the land is brought under your control
  preserved_meaning: The land must be brought into submission as Israel advances.
  reasoning_layer_used: POB lexical rationale preserves the passive result without implying annihilation.
  rationale: This wording explains the older military sense of “subdued” without overstating it.
translation_notes:
  risk_flags:
