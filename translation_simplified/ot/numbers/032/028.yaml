translation:
  language: en
  text: So Moses gave orders about the Reubenites and Gadites[a] to Eleazar the priest, Joshua son of Nun, and the leaders of Israel’s clans and tribes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “gave orders to them,” with “them” referring to the leaders named in this verse.
    reason: lexical_alternative
