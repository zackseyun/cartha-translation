  preserved_meaning: The people named were leaders within Israel’s clan and tribal structure.
  reasoning_layer_used: cultural note and lexical decision for רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  rationale: The simpler wording explains the compressed Hebrew administrative title.
