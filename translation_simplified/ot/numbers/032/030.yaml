translation:
  language: en
  text: But if they do not cross over with you, equipped for battle, they will receive property among you in Canaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “they will be settled among you in Canaan.” The Hebrew can refer to being established in possession of the land, not only to receiving it.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: cross over armed with you
  simplified_phrase: cross over with you, equipped for battle
  preserved_meaning: They must accompany Israel across as troops prepared for war.
  reasoning_layer_used: POB lexical decisions for יַעַבְרוּ, חֲלוּצִים, and אִתְּכֶם
  rationale: The reordered phrase reads naturally while retaining both the crossing and military readiness.
- pob_phrase: then they shall receive property
  simplified_phrase: they will receive property
  preserved_meaning: Receiving property in Canaan is the stated outcome if they do not cross over armed.
  reasoning_layer_used: POB lexical decision for וְנֹאחֲזוּ and grounding review
  rationale: The future wording preserves the conditional result without adding an unsupported command.
- pob_phrase: in the land of Canaan
  simplified_phrase: in Canaan
  preserved_meaning: Their property will be within Canaan proper.
  reasoning_layer_used: POB lexical decision for בְּאֶרֶץ כְּנָעַן
  rationale: The shorter place-name is natural English and keeps the same location.
