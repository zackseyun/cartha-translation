translation:
  language: en
  text: But every one of your servants who is armed for battle will cross over and go into battle before Yahweh,[a] just as my lord says.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Before Yahweh” means that they will fight in his presence and under his authority.
