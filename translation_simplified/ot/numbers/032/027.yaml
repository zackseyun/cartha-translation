simplification_decisions:
- pob_phrase: your servants will cross over, every man armed for battle
  simplified_phrase: every one of your servants who is armed for battle will cross over
  preserved_meaning: Each servant equipped for military action will cross the boundary.
  reasoning_layer_used: POB lexical decisions for כָּל, חֲלוּץ, צָבָא, and יַעַבְרוּ
  rationale: The reordered clause makes the subject clear while preserving the distributive “every” and the movement of crossing.
- pob_phrase: for the war
  simplified_phrase: and go into battle
  preserved_meaning: Their purpose in crossing is to take part in the military campaign.
  reasoning_layer_used: POB lexical decision for לַמִּלְחָמָה and applied revision context
  rationale: The ordinary phrase “go into battle” clearly expresses movement toward war without reducing it to a vague purpose.
translation_notes:
  risk_flags:
  - risk: “Before Yahweh” may sound merely spatial to a modern reader.
    mitigation: The footnote preserves the POB explanation that the campaign occurs in Yahweh’s presence and under his authority.
  - risk: Readers may mistake “my lord” for a divine title.
    mitigation: Lowercase “lord” retains the POB distinction between respectful address to Moses and the divine name Yahweh.
