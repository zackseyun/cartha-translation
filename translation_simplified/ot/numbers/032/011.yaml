  text: Not one of the men who came up from Egypt at age twenty or older will ever enter the land I promised with an oath to Abraham, Isaac, and Jacob, because they did not follow me fully.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Surely none of the men ... shall see
  simplified_phrase: Not one of the men ... will ever enter
  preserved_meaning: The divine oath certainly excludes these men from entering the land.
  reasoning_layer_used: POB lexical and theological decisions on the oath formula and contextual sense of “see”
  rationale: “Not one” conveys the strong negation, while “enter” states the contextual sense without adding a second action.
- pob_phrase: from twenty years old and upward
  simplified_phrase: at age twenty or older
  preserved_meaning: The judgment applies to men who met the stated age threshold.
  reasoning_layer_used: POB lexical decision on the age-threshold formula
  rationale: This common age expression is concise and immediately clear.
- pob_phrase: the land that I swore to Abraham, to Isaac, and to Jacob
  simplified_phrase: the land I promised with an oath to Abraham, Isaac, and Jacob
  preserved_meaning: God solemnly pledged the land to the three patriarchs.
  reasoning_layer_used: POB lexical decision on נִשְׁבַּעְתִּי and the covenantal context
  rationale: “Promised with an oath” clearly expresses the object and solemn force of God’s swearing.
interpretive_expansions:
- pob_phrase: shall see the land
  rendering: will ever enter the land
  claim: Seeing the land here means experiencing it by entering it, not merely viewing it.
  evidence:
