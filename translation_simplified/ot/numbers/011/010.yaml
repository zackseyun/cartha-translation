translation:
  language: en
  text: Moses heard the people weeping in their clan groups, each man at the entrance of his tent. Yahweh’s anger burned fiercely, and Moses was deeply displeased.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “it was evil in the eyes of Moses.”
