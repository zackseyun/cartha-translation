simplification_decisions:
- pob_phrase: weeping by their clans
  simplified_phrase: weeping in their clan groups
  preserved_meaning: The people were weeping in their organized kinship groups.
  reasoning_layer_used: lexical decision for לְמִשְׁפְּחֹתָיו
  rationale: “Clan groups” makes the kinship arrangement immediately clear.
- pob_phrase: the anger of Yahweh burned greatly
  simplified_phrase: Yahweh’s anger burned fiercely
  preserved_meaning: Yahweh was intensely angry, with anger still pictured as burning.
  reasoning_layer_used: lexical decisions for וַיִּחַר אַף יְהוָה and מְאֹד
  rationale: The natural possessive form keeps both the source image and its intensity.
- pob_phrase: it was evil in the eyes of Moses
  simplified_phrase: Moses was deeply displeased
  preserved_meaning: Moses responded to the situation with a strong negative judgment.
  reasoning_layer_used: lexical decision and POB alternative for וּבְעֵינֵי מֹשֶׁה רָע
  rationale: The idiomatic wording avoids implying that Moses declared a visible object morally evil.
translation_notes:
  risk_flags:
  - risk: “Deeply displeased” expresses the idiom rather than its literal sight-based wording.
    mitigation: The footnote preserves the literal Hebrew expression.
