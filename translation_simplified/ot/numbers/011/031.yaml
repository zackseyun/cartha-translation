translation:
  language: en
  text: Then a wind came from Yahweh.[a] It drove quail in from the sea and dropped them beside the camp. The quail spread all around the camp, as far as a person could travel in a day in every direction. They were about three feet above the ground.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can also mean “spirit,” but here “wind” best fits because it carries the quail from the sea.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “about two cubits above the face of the ground.” This may describe how high the quail were spread or flying, rather than a layer of birds three feet deep.
    reason: alternative_reading
