translation:
  language: en
  text: Tell the people, ‘Consecrate yourselves for tomorrow—set yourselves apart in preparation for what Yahweh will do. You will eat meat, because Yahweh heard you crying and saying, “Who will feed us meat? It was good for us in Egypt.” And Yahweh will give you meat, and you will eat it.’
  philosophy: optimal-equivalence
