  rationale: A direct command is clearer than the formal future construction.
- pob_phrase: Consecrate yourselves for tomorrow
  simplified_phrase: Consecrate yourselves for tomorrow—set yourselves apart in preparation for what Yahweh will do
  preserved_meaning: The people must set themselves apart for Yahweh’s coming action.
