  preserved_meaning: Yahweh’s spoken declaration to Moses remains the subject of the promised fulfillment.
  reasoning_layer_used: POB lexical decision for דְבָרִי
  rationale: The approved lexical alternative is clearer to readers unfamiliar with “word” as a divine declaration.
interpretive_expansions:
