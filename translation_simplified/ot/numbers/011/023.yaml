- pob_phrase: Has Yahweh’s hand become short?
  simplified_phrase: Has Yahweh’s hand become too short to act?
  preserved_meaning: The bodily image of Yahweh’s hand still challenges the idea that his power is limited.
  reasoning_layer_used: POB lexical and theological decisions on the divine-hand idiom
  rationale: Adding “to act” makes the unfamiliar image understandable without replacing it.
- pob_phrase: my word
