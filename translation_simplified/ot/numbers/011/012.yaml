translation:
  language: en
  text: Did I conceive all these people? Did I give birth to him[a]? Yet you tell me, “Carry him close to your chest, as a guardian[b] carries a nursing child, to the land you promised his fathers with an oath.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew treats the people as one child, using “him” and “his fathers”; English could use “them” and “their fathers.”
    reason: alternative_reading
  - marker: b
    text: The Hebrew word for “guardian” may also be translated “nurse.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: all this people
  simplified_phrase: all these people
  preserved_meaning: The group remains pictured as one child through the singular pronouns that follow.
  reasoning_layer_used: lexical alternatives and theological decision on the collective singular
  rationale: The plural opening is natural English, while the footnote explains the Hebrew collective image.
- pob_phrase: that you should say to me
  simplified_phrase: Yet you tell me
  preserved_meaning: Moses protests that God has assigned him a parentlike burden.
  reasoning_layer_used: lexical rationale and immediate rhetorical context
  rationale: A direct sentence makes the protest easier to follow.
- pob_phrase: Carry him in your bosom
  simplified_phrase: Carry him close to your chest
  preserved_meaning: Moses must carry the people as closely and securely as an infant.
  reasoning_layer_used: lexical decision for בְחֵיקֶךָ
  rationale: The wording preserves the bodily image without the uncommon word “bosom.”
interpretive_expansions:
- pob_phrase: the land that you swore to his fathers
  rendering: the land you promised his fathers with an oath
  claim: God pledged by oath to give the land to the people’s ancestors.
  evidence:
