translation:
  language: en
  text: Moses went out and told the people what Yahweh had said. Then he gathered seventy men from among the people’s elders and had them stand around the tent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The context likely refers to the tent of meeting, though the Hebrew says simply “the tent.”
    reason: cross_reference
