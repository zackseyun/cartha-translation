translation:
  language: en
  text: But Moses said, “I am here among six hundred thousand people on foot.[a] Yet you have said, ‘I will give them meat, and they will eat it for a whole month.’”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “six hundred thousand men on foot.” The Hebrew may refer to people traveling on foot or to foot soldiers.
    reason: alternative_reading
  - marker: b
    text: Hebrew literally says “a month of days,” meaning a full month.
    reason: simplification_note
