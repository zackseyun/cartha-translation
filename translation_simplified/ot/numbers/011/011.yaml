translation:
  language: en
  text: Moses said to Yahweh,[a] “Why have you treated me, your servant, badly? Why have I not received your favor? You have made me bear the burden of all these people.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Why have you done harm to your servant?” The Hebrew expresses Moses’ anguished complaint about how he has been treated.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: treated your servant badly
  simplified_phrase: treated me, your servant, badly
  preserved_meaning: Moses calls himself Yahweh’s servant while directly complaining about his treatment.
  reasoning_layer_used: Lexical and theological decisions for הֲרֵעֹתָ and לְעַבְדֶּךָ.
  rationale: The recast identifies the servant as Moses without implying moral evil in God or adding severity.
- pob_phrase: found favor in your eyes
  simplified_phrase: received your favor
  preserved_meaning: Moses asks why Yahweh has not shown him favor.
  reasoning_layer_used: Lexical decision and cultural note for מָצָתִי חֵן בְּעֵינֶיךָ.
  rationale: The common English expression states the Hebrew idiom clearly.
- pob_phrase: that you have laid the burden of all this people on me
  simplified_phrase: You have made me bear the burden of all these people.
  preserved_meaning: Moses complains that responsibility for the entire people rests heavily on him.
  reasoning_layer_used: Lexical decisions for מַשָּׂא, כָּל הָעָם הַזֶּה, and עָלַי.
  rationale: A separate sentence clarifies the complaint while preserving the burden image and collective scope.
translation_notes:
  risk_flags:
  - risk: Splitting the final clause into a sentence may make its link to the question about favor less explicit.
    mitigation: Its immediate placement still presents the burden as the basis of Moses’ complaint.
