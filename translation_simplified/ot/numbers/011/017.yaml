translation:
  language: en
  text: I will come down and speak with you there. I will take some of the Spirit[a] that is on you and put it on them. They will help you carry the burden of leading the people, so you will not have to carry it alone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “spirit.” Here the word refers to the divine empowering presence given for leadership.
    reason: lexical_alternative
