  simplified_phrase: They will help you carry the burden of leading the people
  preserved_meaning: The elders will share Moses’ heavy leadership responsibility.
  reasoning_layer_used: Lexical decisions for נשא and מַשָּׂא, supported by the immediate context
  rationale: Common wording preserves the image of carrying a burden while clarifying what the burden involves.
- pob_phrase: so that you will not bear it by yourself alone
  simplified_phrase: so you will not have to carry it alone
  preserved_meaning: Moses will no longer carry the responsibility without help.
  reasoning_layer_used: Lexical decision for לְבַדֶּךָ and the clause’s purpose/result force
  rationale: The shorter clause removes redundancy while retaining the emphasis that Moses had been carrying it alone.
