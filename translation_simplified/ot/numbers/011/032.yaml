translation:
  language: en
  text: The people set to work gathering the quail. They continued all that day, all night, and all the next day. Even the person who gathered the least collected ten large measures[a][b]. Then they spread the quail out for themselves all around the camp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew unit is the homer, a large dry measure whose exact modern equivalent is uncertain.
    reason: cultural_note
  - marker: b
    text: The Hebrew may instead mean “ten donkey-loads.”
    reason: lexical_alternative
