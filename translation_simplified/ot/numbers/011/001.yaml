- pob_phrase: were like those who complain of hardship in the hearing of Yahweh, and Yahweh heard it
  simplified_phrase: were like those who complain about hardship, and Yahweh heard their complaint
  preserved_meaning: The people’s complaint about hardship came to Yahweh’s attention, while the difficult comparison remains open.
  reasoning_layer_used: Lexical decisions for כְּמִתְאֹנְנִים, רַע, בְּאָזְנֵי יְהוָה, and וַיִּשְׁמַע יְהוָה
  rationale: The wording removes the misleading sense of performance and identifies what Yahweh heard.
- pob_phrase: and his anger burned
  simplified_phrase: His anger burned.
  preserved_meaning: Yahweh responded with burning anger.
  reasoning_layer_used: Lexical decision for וַיִּחַר אַפּוֹ
  rationale: A separate sentence clarifies the sequence while preserving the heat image.
- pob_phrase: and the fire of Yahweh burned among them and consumed some at the edge of the camp
  simplified_phrase: Then the fire of Yahweh burned among them and consumed some at the edge of the camp.
  preserved_meaning: Fire directly associated with Yahweh judged people or portions at the camp’s outskirts.
  reasoning_layer_used: Lexical and theological decisions on divine judgment by fire
  rationale: “Then” marks the narrative sequence without weakening Yahweh’s connection to the fire.
