translation:
  language: en
  text: The people were like those who complain about hardship,[a] and Yahweh heard their complaint. His anger burned. Then the fire of Yahweh burned among them and consumed some at the edge of the camp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Hebrew expression may also mean “the people were complaining” or “the people seemed to be complaining.”
    reason: lexical_alternative
