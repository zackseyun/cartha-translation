translation:
  language: en
  text: Then Yahweh said to Moses, “Gather seventy men for me from among Israel’s elders. Choose men you know are recognized as the people’s elders and officials.[a] Bring them to the tent of meeting, and have them stand there with you.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: These officials had administrative responsibilities among the people.
    reason: cultural_note
simplification_decisions:
- pob_phrase: seventy men from the elders of Israel, whom you know to be the elders of the people and its officers
  simplified_phrase: seventy men for me from among Israel’s elders. Choose men you know are recognized as the people’s elders and officials
  preserved_meaning: Moses must select seventy known male leaders from Israel’s existing elders.
  reasoning_layer_used: POB lexical decisions for מִזִּקְנֵי יִשְׂרָאֵל, אֲשֶׁר יָדַעְתָּ כִּי, and וְשֹׁטְרָיו
  rationale: Two sentences clarify both the group selected from and the qualifications of those chosen.
- pob_phrase: its officers
  simplified_phrase: the people’s ... officials
  preserved_meaning: The selected elders also hold recognized administrative responsibility among the people.
  reasoning_layer_used: POB lexical decision and footnote for וְשֹׁטְרָיו
  rationale: “Officials” avoids the modern military sense of “officers” while retaining the administrative role.
- pob_phrase: and let them stand there with you
  simplified_phrase: and have them stand there with you
  preserved_meaning: Moses is to ensure that the seventy present themselves beside him at the appointed place.
  reasoning_layer_used: POB lexical decision for וְהִתְיַצְּבוּ שָׁם עִמָּךְ
  rationale: The active command to Moses is clearer in ordinary English without weakening the directive.
translation_notes:
  risk_flags:
  - risk: “Officials” may sound broader than the Hebrew administrative office.
    mitigation: The footnote identifies their administrative responsibilities among the people.
