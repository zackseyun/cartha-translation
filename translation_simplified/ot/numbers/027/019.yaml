translation:
  language: en
  text: Bring him before Eleazar the priest and the whole community. In front of them all, publicly commission him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “command” or “charge”; here it refers to publicly entrusting Joshua with his responsibilities.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: You shall set him before
  simplified_phrase: Bring him before
  preserved_meaning: Moses must place Joshua in the formal presence of Eleazar and the community.
  reasoning_layer_used: Lexical decision for the causative form of עמד and the ceremonial context.
  rationale: “Bring him before” expresses the required action in ordinary English.
- pob_phrase: all the congregation
  simplified_phrase: the whole community
  preserved_meaning: The entire assembled community of Israel is present.
  reasoning_layer_used: Lexical alternatives for כָּל הָעֵדָה.
  rationale: “Whole community” is clearer for readers unfamiliar with “congregation.”
- pob_phrase: you shall commission him in their sight
  simplified_phrase: In front of them all, publicly commission him
  preserved_meaning: Moses must formally appoint Joshua in a ceremony witnessed by the community.
  reasoning_layer_used: Lexical rationales for וְצִוִּיתָה and לְעֵינֵיהֶם, plus the public-installation theological decision.
  rationale: The wording clearly conveys both the formal commission and its public nature.
interpretive_expansions:
- pob_phrase: in their sight
  rendering: In front of them all, publicly
  claim: The commissioning is a public act witnessed by the gathered community.
  evidence:
  - The Hebrew idiom לְעֵינֵיהֶם denotes an act visible in their presence.
  - The surrounding scene places Joshua before Eleazar and the whole community.
  confidence: high
  alternatives_preserved:
  - in their sight
  - in their presence
translation_notes:
  risk_flags:
  - risk: “Publicly” restates an idea already conveyed by “in front of them all.”
    mitigation: The slight repetition makes the ceremonial nature of the commission clear without importing authority from verse 20.
