translation:
  language: en
  text: Our father died in the wilderness. But he was not part of Korah’s group, which joined together against Yahweh. Instead, he died because of his own sin,[a] and he had no sons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be rendered “in his own sin”; it does not identify the particular sin.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: among the congregation of those who gathered themselves against Yahweh in the company of Korah
  simplified_phrase: part of Korah’s group, which joined together against Yahweh
  preserved_meaning: His father did not belong to Korah’s rebellious faction.
  reasoning_layer_used: POB lexical decisions and immediate context
  rationale: The shorter wording keeps both the group identity and its hostile action against Yahweh.
- pob_phrase: rather, he died for his own sin
  simplified_phrase: Instead, he died because of his own sin
  preserved_meaning: His death was attributed to his own unspecified sin, not Korah’s rebellion.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Because of” makes the intended causal sense clear without naming the sin.
- pob_phrase: and he had no sons
  simplified_phrase: and he had no sons
  preserved_meaning: He left no male offspring, which is central to the inheritance issue.
  reasoning_layer_used: POB lexical decision and narrative context
  rationale: “Sons” is already plain English and must remain specific here.
translation_notes:
  risk_flags:
  - risk: “His own sin” could be taken as identifying a particular offense.
    mitigation: The footnote states that the verse does not specify the sin.
