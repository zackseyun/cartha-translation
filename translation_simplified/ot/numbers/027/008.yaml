  rationale: The shorter command expresses the same speech formula in natural English.
- pob_phrase: If a man dies and has no son
  simplified_phrase: If a man dies without a son
  preserved_meaning: The law applies when a deceased man has no male heir.
  reasoning_layer_used: The lexical decisions preserve the masculine legal case and the absence of a son.
  rationale: Combining the clauses makes the legal condition easier to read.
- pob_phrase: you shall transfer his inheritance to his daughter
  simplified_phrase: you must pass his inheritance on to his daughter
  preserved_meaning: The daughter is to receive the man's inheritance by legal transfer.
  reasoning_layer_used: The lexical decisions define the verb as transferring property rights and retain “inheritance.”
  rationale: “Pass on” clearly describes inheritance transfer in common English.
