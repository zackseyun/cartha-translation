translation:
  language: en
  text: Why should our father’s name be lost from his clan simply because he had no son? Give us a share of land among our father’s brothers.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term refers to a landed holding allotted within the clan.
    reason: cultural_note
simplification_decisions:
- pob_phrase: our father's name be taken away from among his clan
  simplified_phrase: our father’s name be lost from his clan
  preserved_meaning: His name and family line would no longer have a recognized place in the clan.
  reasoning_layer_used: POB lexical decision for יִגָּרַע and שֵׁם
  rationale: “Be lost from” makes the Hebrew name-loss image easier to understand without removing it.
- pob_phrase: because he had no son
  simplified_phrase: simply because he had no son
  preserved_meaning: The lack of a male heir is the reason being challenged.
  reasoning_layer_used: POB lexical and theological decisions on gender-specific inheritance language
  rationale: “Simply” brings out the rhetorical protest while retaining the explicit reference to a son.
- pob_phrase: Give us a possession
  simplified_phrase: Give us a share of land
  preserved_meaning: They ask for an allotted landed holding within their father’s clan.
  reasoning_layer_used: POB lexical decision and cultural note for אֲחֻזָּה
  rationale: “A share of land” states the legal-land meaning in familiar English.
interpretive_expansions:
- pob_phrase: a possession
  rendering: a share of land
  claim: The requested possession is an allotted landed holding, not property in general.
  evidence:
  - The POB lexical rationale identifies אֲחֻזָּה as a landed holding or allotted property.
  - The POB cultural note places the holding within the clan’s inheritance structure.
  confidence: high
  alternatives_preserved:
  - an inheritance holding
  - a landed holding
translation_notes:
  risk_flags:
  - risk: “Share” could be read as an unspecified fractional interest.
    mitigation: “Of land” and the footnote preserve the clan-allotment sense.
