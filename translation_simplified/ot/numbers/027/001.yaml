  preserved_meaning: The women approached those in authority in preparation for their formal petition.
  reasoning_layer_used: POB lexical decision and footnote
  rationale: “Came forward” is natural English and retains the formal sense without naming an unstated destination.
- pob_phrase: Zelophehad son of Hepher, son of Gilead, son of Machir, son of Manasseh
  simplified_phrase: Their family line was Zelophehad son of Hepher, son of Gilead, son of Machir, son of Manasseh.
  preserved_meaning: The full lineage supporting the inheritance claim remains intact.
  reasoning_layer_used: POB lexical decision on the repeated genealogy
  rationale: A separate sentence makes the genealogy easier to follow while retaining every “son of” link.
- pob_phrase: from the clans of Manasseh son of Joseph
  simplified_phrase: They belonged to the clans of Manasseh son of Joseph.
  preserved_meaning: The daughters’ family is affiliated with Manasseh’s clans and Joseph’s line.
