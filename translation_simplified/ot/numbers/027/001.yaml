translation:
  language: en
  text: The daughters of Zelophehad came forward. Their family line was Zelophehad son of Hepher, son of Gilead, son of Machir, son of Manasseh. They belonged to the clans of Manasseh son of Joseph. Zelophehad’s daughters were Mahlah, Noah[a], Hoglah, Milcah, and Tirzah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This Noah was one of Zelophehad’s daughters, not the man named Noah in Genesis.
    reason: cultural_note
