translation:
  language: en
  text: Joshua must stand before Eleazar the priest. Eleazar will seek Yahweh’s decision for him by means of the Urim.[a] At his command, Joshua and all the Israelites with him—the whole congregation—will go out and come in.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Urim was a priestly means of seeking Yahweh’s decision.
    reason: cultural_note
simplification_decisions:
- pob_phrase: he shall stand before Eleazar the priest
  simplified_phrase: Joshua must stand before Eleazar the priest
  preserved_meaning: Joshua is directed to present himself before Eleazar in the commissioning context.
  reasoning_layer_used: Lexical decision for יַעֲמֹד and immediate context
  rationale: Naming Joshua and using “must” makes the directive clear without weakening it.
- pob_phrase: who shall inquire for him by the judgment of the Urim before Yahweh
  simplified_phrase: Eleazar will seek Yahweh’s decision for him by means of the Urim
  preserved_meaning: Eleazar makes the priestly inquiry before Yahweh on Joshua’s behalf.
  reasoning_layer_used: Lexical decisions for וְשָׁאַל לוֹ and בְּמִשְׁפַּט הָאוּרִים
  rationale: The rewrite replaces formal cultic syntax with a direct statement of the same procedure.
- pob_phrase: he and all the sons of Israel with him, even all the congregation
  simplified_phrase: Joshua and all the Israelites with him—the whole congregation
  preserved_meaning: Joshua and the entire gathered people act together under the command.
  reasoning_layer_used: Lexical decisions for בְּנֵי יִשְׂרָאֵל and הָעֵדָה
  rationale: “Israelites” is ordinary English, while “whole congregation” keeps the corporate sense.
interpretive_expansions:
