translation:
  language: en
  text: Yahweh said to Moses, “Take all the leaders of the people and impale them[a] for Yahweh in broad daylight.[b] Do this so that Yahweh’s burning anger may turn away from Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew most directly refers to the leaders. Another possible reading is that the leaders must execute the guilty people.
    reason: alternative_reading
  - marker: b
