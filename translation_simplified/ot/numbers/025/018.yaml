translation:
  language: en
  text: For they are hostile to you, using schemes that deceived you in the Peor incident[a] and in the affair involving Cozbi. She was the daughter of a Midianite leader and a woman of their own people[b]. She was struck down on the day the plague came because of the Peor incident.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Peor refers to the incident involving Baal-peor described earlier in this chapter.
    reason: cross_reference
  - marker: b
    text: Hebrew “their sister,” likely meaning a woman of their own people or kin-group.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For they are hostile to you through their schemes, by which they deceived you
  simplified_phrase: For they are hostile to you, using schemes that deceived you
  preserved_meaning: Their ongoing hostility operates through deceptive schemes directed against Israel.
  reasoning_layer_used: Lexical decisions for צֹרְרִים, בְּנִכְלֵיהֶם, and נִכְלוּ
  rationale: One connected clause preserves the schemes as the means of their hostility.
- pob_phrase: in the matter of Peor and in the matter of Cozbi
  simplified_phrase: in the Peor incident and in the affair involving Cozbi
  preserved_meaning: The deception involved both the Peor incident and the specific affair concerning Cozbi.
  reasoning_layer_used: Lexical and theological decisions on עַל דְּבַר פְּעוֹר and the repeated idiom
  rationale: “Incident” and “affair” clearly express the two parallel matters without sounding technical.
- pob_phrase: the daughter of a leader of Midian, their sister, who was struck down on the day of the plague because of the matter of Peor
  simplified_phrase: She was the daughter of a Midianite leader and a woman of their own people. She was struck down on the day the plague came because of the Peor incident.
  preserved_meaning: Cozbi's status, kin-group connection, death, and the plague's causal link to Peor remain intact.
  reasoning_layer_used: Lexical decisions for בַת נְשִׂיא מִדְיָן, אֲחֹתָם, הַמֻּכָּה, and בְיוֹם הַמַּגֵּפָה
  rationale: Short sentences clarify her identity while retaining the forceful image “struck down.”
