translation:
  language: en
  text: Phinehas, the son of Eleazar and grandson of Aaron the priest, has turned away my wrath that rested on the sons of Israel. He acted among them with my own jealousy.[a] Therefore, I did not completely destroy the sons of Israel in my jealousy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “with my own zeal.” The Hebrew uses related forms of the same word for Phinehas’s action and God’s response. Here God’s jealousy expresses his demand for his people’s exclusive loyalty.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: son of Eleazar, son of Aaron the priest
  simplified_phrase: the son of Eleazar and grandson of Aaron the priest
  preserved_meaning: Phinehas is identified through his father Eleazar and his grandfather Aaron the priest.
  reasoning_layer_used: POB genealogy and source syntax
  rationale: The family relationships are stated directly instead of repeating the potentially confusing word “son.”
- pob_phrase: has turned back my wrath from upon
  simplified_phrase: has turned away my wrath that rested on
  preserved_meaning: Phinehas averted the divine wrath that was upon Israel.
  reasoning_layer_used: lexical decisions for הֵשִׁיב and מֵעַל
  rationale: Natural English preserves the Hebrew image of wrath resting on the people.
- pob_phrase: I did not consume
  simplified_phrase: I did not completely destroy
  preserved_meaning: God withheld the threatened total destruction.
  reasoning_layer_used: lexical decision for כִלִּיתִי
  rationale: “Completely destroy” makes the force of “consume” immediately clear.
