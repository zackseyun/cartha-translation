simplification_decisions:
- pob_phrase: put him in custody
  simplified_phrase: kept him under guard
  preserved_meaning: The man was detained without implying that he had received a prison sentence.
  reasoning_layer_used: The lexical decision for בַּמִּשְׁמָר allows “under guard” and cautions against overstating formal imprisonment.
  rationale: “Kept him under guard” makes the temporary restraint easy to understand.
- pob_phrase: So they put him in custody, because
  simplified_phrase: They kept him under guard because
  preserved_meaning: The lack of a clear ruling was the stated reason for detaining him.
  reasoning_layer_used: The source conjunction כִּי and POB syntax explicitly mark the causal relationship.
  rationale: Keeping “because” clearly connects the detention with the unresolved decision.
translation_notes:
  risk_flags:
  - risk: “Made clear” may refer broadly to the required action rather than only to the specific penalty.
    mitigation: The wording preserves the POB ambiguity, while the footnote gives the narrower alternative.
