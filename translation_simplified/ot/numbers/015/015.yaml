translation:
  language: en
  text: For the assembly, there will be one law for you and for the foreigner who lives among you. This permanent law will continue throughout your generations. Just as it applies to you, so it will apply to the foreigner before Yahweh.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: one statute
  simplified_phrase: one law
  preserved_meaning: A single binding rule applies to both groups.
  reasoning_layer_used: Lexical decision for חֻקָּה אַחַת
  rationale: “Law” gives the legal force of “statute” in familiar English.
- pob_phrase: the sojourner who sojourns with you
  simplified_phrase: the foreigner who lives among you
  preserved_meaning: This is a non-native person residing among Israel, not a passing stranger.
  reasoning_layer_used: Lexical decisions for לַגֵּר and הַגָּר
  rationale: The wording clearly conveys both foreign identity and ongoing residence.
- pob_phrase: a permanent statute throughout your generations
  simplified_phrase: This permanent law will continue throughout your generations
  preserved_meaning: The law remains in force across successive generations.
  reasoning_layer_used: Lexical decisions for חֻקַּת עוֹלָם and לְדֹרֹתֵיכֶם
  rationale: A direct verbal clause makes the law’s continuing force easier to understand.
interpretive_expansions:
- pob_phrase: As you are, so shall the sojourner be before Yahweh
  rendering: Just as it applies to you, so it will apply to the foreigner before Yahweh
  claim: The comparison gives both groups equal treatment under the law in view.
  evidence:
  - The Hebrew comparative construction stresses parity between the two groups.
  - The preceding clause establishes one statute for both groups.
  confidence: high
  alternatives_preserved:
  - The immediate context may limit this parity to the sacrificial regulations being discussed.
translation_notes:
  risk_flags:
  - risk: “Foreigner” alone could suggest any non-Israelite, including a visitor.
    mitigation: “Who lives among you” preserves the person’s ongoing resident status.
  - risk: The parity could be read as extending beyond the law discussed here.
    mitigation: Repeating “it applies” ties the comparison directly to that law.
