translation:
  language: en
  text: If a resident foreigner or anyone living among you offers a food offering[a] to Yahweh as a pleasing aroma, that person must do so in the same way you do—now and in future generations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “an offering made by fire.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a sojourner is staying with you, or anyone who is among you
  simplified_phrase: a resident foreigner or anyone living among you
  preserved_meaning: The rule applies to a non-Israelite resident or anyone included by the broader expression.
  reasoning_layer_used: lexical decisions for יָגוּר, גֵּר, and אוֹ אֲשֶׁר בְּתוֹכְכֶם
  rationale: “Resident foreigner” explains “sojourner,” while omitting “else” avoids creating a separate legal class.
- pob_phrase: throughout your generations
  simplified_phrase: now and in future generations
  preserved_meaning: The rule remains in force across successive generations.
  reasoning_layer_used: lexical decision for לְדֹרֹתֵיכֶם
  rationale: The new wording makes the rule’s continuing application immediately clear.
- pob_phrase: just as you do, so he shall do
  simplified_phrase: that person must do so in the same way you do
  preserved_meaning: The same sacrificial procedure is required in this case without distinction.
  reasoning_layer_used: lexical and theological decisions on the comparative legal formula
  rationale: The recasting uses natural English while preserving both obligation and equal practice.
translation_notes:
  risk_flags:
  - risk: “Anyone living among you” may be read more broadly than the narrower view limited to integrated resident foreigners.
    mitigation: The wording follows POB’s inclusive rendering without making broader claims about covenant status.
