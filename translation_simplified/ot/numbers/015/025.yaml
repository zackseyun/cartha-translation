translation:
  language: en
  text: The priest will make atonement for the whole community of Israel, and they will be forgiven. This is because their wrong was unintentional and they have brought their offering made by fire to Yahweh, along with their sin offering before Yahweh for that unintentional wrong.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The term “sin offering” may also be translated “purification offering.”
    reason: lexical_alternative
