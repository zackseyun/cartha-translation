translation:
  language: en
  text: The whole community of Israel will be forgiven, including the resident foreigner living among them, because what the people did was unintentional.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “because all the people were in error.” The Hebrew clause is compact and can be understood either way.
