translation:
  language: en
  text: But if one person sins without meaning to, she[a] must bring a one-year-old female goat as a sin offering.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses feminine grammar here, but the law does not apply only to women.
    reason: source_note
  - marker: b
    text: Or “purification offering.” The Hebrew term can refer to an offering that deals with sin or impurity.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: sins unintentionally
  simplified_phrase: sins without meaning to
  preserved_meaning: The sin was not deliberate or defiant.
  reasoning_layer_used: Lexical decision for בִּשְׁגָגָה and its legal contrast with high-handed sin
  rationale: The everyday phrase states the same legal distinction more directly.
- pob_phrase: then she shall present
  simplified_phrase: she must bring
  preserved_meaning: The offender is required to supply the prescribed sacrifice.
  reasoning_layer_used: Lexical decision for וְהִקְרִיבָה in sacrificial law
  rationale: “Must bring” makes the legal requirement clear in ordinary English.
- pob_phrase: as a sin offering
  simplified_phrase: as a sin offering
  preserved_meaning: The goat serves as the prescribed offering for the sin.
  reasoning_layer_used: Theological decision for חַטָּאת
  rationale: The established biblical term remains because replacing it would obscure the ritual category.
translation_notes:
  risk_flags:
  - risk: The feminine pronoun may suggest that the law applies only to women.
    mitigation: A source note explains that the feminine wording reflects Hebrew grammar, not a gender restriction.
  - risk: “Sin offering” may understate the offering’s possible purification function.
    mitigation: The lexical alternative is preserved in a footnote.
