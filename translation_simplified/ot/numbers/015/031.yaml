simplification_decisions:
- pob_phrase: Because he has despised the word of Yahweh
  simplified_phrase: That is because he has treated what Yahweh said with contempt
  preserved_meaning: The offender actively scorned Yahweh’s spoken command rather than merely neglecting it.
  reasoning_layer_used: Lexical decisions for בָּזָה and דְבַר יְהוָה
  rationale: This wording makes the nature and object of the contempt clear.
- pob_phrase: shall surely be cut off
  simplified_phrase: will certainly be cut off
  preserved_meaning: The announced judgment is certain, but its exact form remains unspecified.
  reasoning_layer_used: Lexical and theological decisions for הִכָּרֵת תִּכָּרֵת
  rationale: “Will certainly” conveys an emphatic outcome without suggesting an obligation.
- pob_phrase: his guilt is on him
  simplified_phrase: His guilt rests on him
  preserved_meaning: The offender remains personally liable for his guilt.
  reasoning_layer_used: Lexical decision and doctrine-realignment revision for עֲוֺנָהּ בָּהּ
  rationale: “Rests on him” clarifies personal liability without naming an unstated penalty.
translation_notes:
  risk_flags:
  - risk: Readers may assume that “cut off” identifies a specific punishment.
    mitigation: The footnote explains that the verse does not specify the judgment’s exact form.
