translation:
  language: en
  text: That is because he has treated what Yahweh said with contempt and has broken his commandment. That person will certainly be cut off.[a] His guilt rests on him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses the solemn image “cut off” but does not specify the exact form of the judgment here.
