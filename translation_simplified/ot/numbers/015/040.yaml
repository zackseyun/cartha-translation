simplification_decisions:
- pob_phrase: remember and do all my commandments
  simplified_phrase: remember all my commandments, do what they say
  preserved_meaning: Remembering God's commandments and carrying them out remain distinct actions.
  reasoning_layer_used: Lexical decisions for תִּזְכְּרוּ, וַעֲשִׂיתֶם, and מִצְוֺתָי
  rationale: The clearer wording explains what it means to do commandments without weakening the command.
- pob_phrase: be holy to your God
  simplified_phrase: be holy to your God
  preserved_meaning: Holiness retains its ethical, covenantal, and worship-related range.
  reasoning_layer_used: Theological decision on covenant holiness
  rationale: The key theological term “holy” remains because a narrower paraphrase would lose part of its meaning.
