translation:
  language: en
  text: 'Or, for a ram, prepare this grain offering: two-tenths of an ephah of fine flour mixed with one-third of a hin of oil.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: An ephah was an ancient dry measure, and a hin was an ancient liquid measure. The Hebrew says only “two-tenths,” but the sacrificial measurement system makes “of an ephah” understood.
    reason: cultural_note
