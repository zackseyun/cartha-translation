translation:
  language: en
  text: Along with the bull, present a grain offering of fine flour. Use three-tenths of an ephah[a] of flour, mixed with half a hin[b] of oil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “three-tenths”; in this sacrificial instruction, this means three-tenths of an ephah.
    reason: lexical_alternative
  - marker: b
    text: A hin was an ancient liquid measure.
    reason: cultural_note
