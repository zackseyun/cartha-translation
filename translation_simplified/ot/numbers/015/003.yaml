  reasoning_layer_used: Lexical decision for אִשֶּׁה and grounding review
  rationale: This keeps the fire image while avoiding confusion with the distinct burnt offering category.
- pob_phrase: as a freewill offering
  simplified_phrase: as a voluntary offering
  preserved_meaning: The offering is freely given rather than made to fulfill a vow.
  reasoning_layer_used: Lexical decision for בִנְדָבָה
  rationale: “Voluntary” states this sacrificial category in familiar English.
- pob_phrase: from the herd or from the flock
  simplified_phrase: from cattle or from sheep or goats
  preserved_meaning: The sacrificial animal comes from large or small livestock.
  reasoning_layer_used: Lexical decisions for מִן הַבָּקָר and מִן הַצֹּאן
  rationale: Naming the animals makes both livestock groups immediately clear.
