translation:
  language: en
  text: and you present to Yahweh an offering through fire—a burnt offering or a sacrifice—from cattle or from sheep or goats, to fulfill a vow, as a voluntary offering, or at one of your appointed times.[a] You offer it to make a pleasing aroma to Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “at one of your appointed festivals.” The Hebrew may refer broadly to appointed times or specifically to festivals.
    reason: lexical_alternative
