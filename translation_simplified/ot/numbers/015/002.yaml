translation:
  language: en
  text: Speak to the sons of Israel[a]. Tell them, “When you enter the land where you will live—the land I am giving to you—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “sons of Israel”; this refers to Israel’s covenant community. It may also be translated “the Israelites” or “the children of Israel.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Speak to the sons of Israel and say to them
  simplified_phrase: Speak to the sons of Israel. Tell them
  preserved_meaning: Moses is commanded to deliver God’s words formally to Israel.
  reasoning_layer_used: POB lexical decisions for דַּבֵּר and וְאָמַרְתָּ אֲלֵהֶם
  rationale: Two short sentences make the command formula easier to follow without merging its two verbs.
- pob_phrase: the land of your dwellings, which I am giving to you
  simplified_phrase: the land where you will live—the land I am giving to you
  preserved_meaning: The land will be Israel’s home and is God’s present, certain gift to them.
  reasoning_layer_used: POB lexical decision for מוֹשְׁבֹתֵיכֶם and theological decision on נֹתֵן
  rationale: The rewrite explains the unusual phrase while retaining the ongoing force of “I am giving.”
- pob_phrase: When you come into the land
  simplified_phrase: When you enter the land
  preserved_meaning: The instruction applies upon Israel’s expected future arrival in the land.
  reasoning_layer_used: POB lexical decisions for כִּי and תָבֹאוּ
  rationale: “Enter” is more natural here while preserving the expected future circumstance.
