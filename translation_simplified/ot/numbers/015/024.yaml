translation:
  language: en
  text: Then, if the whole congregation acted unintentionally without realizing it, they must offer one bull from the herd as a burnt offering to Yahweh, as a pleasing aroma. With it they must present the required grain offering and drink offering, following the prescribed procedure. They must also offer one male goat as a sin offering.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “purification offering.” The Hebrew term can refer both to sin and to the offering’s ritual-cleansing effect.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: if it was done unintentionally and escaped the notice of the congregation
  simplified_phrase: if the whole congregation acted unintentionally without realizing it
  preserved_meaning: The community’s act was inadvertent and initially unnoticed by them.
  reasoning_layer_used: POB lexical decisions and immediate context
  rationale: The rewrite states the same idiomatic meaning in direct, ordinary English.
- pob_phrase: with its grain offering and its drink offering, according to the ordinance
  simplified_phrase: With it they must present the required grain offering and drink offering, following the prescribed procedure.
  preserved_meaning: Both accompanying offerings must be presented according to the established ritual regulation.
  reasoning_layer_used: POB lexical decisions
  rationale: “Prescribed procedure” makes the ritual sense of “ordinance” immediately clear.
- pob_phrase: and one male goat for a sin offering
  simplified_phrase: They must also offer one male goat as a sin offering.
  preserved_meaning: A male goat is required for the distinct sin offering.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: A separate sentence clarifies that this is an additional required sacrifice.
