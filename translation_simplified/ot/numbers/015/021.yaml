  reasoning_layer_used: Lexical decision for מֵרֵאשִׁית and עֲרִסֹתֵיכֶם
  rationale: Adding “part” makes the partitive meaning immediately clear.
- pob_phrase: you shall give
  simplified_phrase: You must give
  preserved_meaning: This is a direct command, not merely a prediction.
  reasoning_layer_used: Lexical decision for תִּתְּנוּ
  rationale: “Must” expresses the command naturally in modern English.
- pob_phrase: throughout your generations
  simplified_phrase: Do this in every generation
  preserved_meaning: The obligation continues among successive generations.
  reasoning_layer_used: Lexical decision for לְדֹרֹתֵיכֶם
  rationale: A separate sentence makes the enduring requirement easier to understand.
