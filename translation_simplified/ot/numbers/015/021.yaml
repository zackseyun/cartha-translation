translation:
  language: en
  text: You must give Yahweh a contribution from the first part of your dough.[a][b] Do this in every generation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also refer to your kneading bowls, meaning the dough in them.
    reason: lexical_alternative
  - marker: b
    text: The word “contribution” can also be translated “offering”; traditionally, “heave offering.”
    reason: lexical_alternative
