simplification_decisions:
- pob_phrase: Speak to the sons of Israel and say to them
  simplified_phrase: Tell the people of Israel
  preserved_meaning: Moses must deliver God’s instruction to Israel as a people.
  reasoning_layer_used: POB lexical decisions for דַּבֵּר, בְּנֵי יִשְׂרָאֵל, and וְאָמַרְתָּ אֲלֵהֶם
  rationale: The shorter wording avoids suggesting minors while naturally expressing the speech command.
- pob_phrase: When you come into the land
  simplified_phrase: When you enter the land
  preserved_meaning: The instruction applies when the people go into the land.
  reasoning_layer_used: POB lexical decisions for בְּבֹאֲכֶם and אֶל הָאָרֶץ
  rationale: “Enter” clearly conveys movement into the land.
- pob_phrase: to which I am bringing you
  simplified_phrase: I am bringing you into
  preserved_meaning: God himself is bringing Israel into the land.
  reasoning_layer_used: POB lexical decision for אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  rationale: The direct clause is easier to follow and retains God’s ongoing action.
