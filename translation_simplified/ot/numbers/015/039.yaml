translation:
  language: en
  text: The tassel will serve as a reminder for you. When you see it, remember all Yahweh’s commandments and carry them out. Do not chase after your own heart and eyes. To chase after them is to prostitute yourselves.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses sexual infidelity as an image of covenant unfaithfulness; it may also be rendered “you go astray after them.”
    reason: lexical_alternative
