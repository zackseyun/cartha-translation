translation:
  language: en
  text: Then anyone who brings an offering to Yahweh must also present a grain offering. It must be one-tenth of an ephah of fine flour, mixed with one-fourth of a hin of oil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: An ephah was an ancient measure for dry goods, and a hin was an ancient measure for liquids.
    reason: cultural_note
