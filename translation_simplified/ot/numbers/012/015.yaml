translation:
  language: en
  text: So Miriam was kept outside the camp for seven days. The people did not move on until she was brought back into the camp.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “until Miriam was gathered in,” referring to her return to the camp after being excluded.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: was confined outside the camp
  simplified_phrase: was kept outside the camp
  preserved_meaning: Miriam was required to remain outside Israel’s camp.
  reasoning_layer_used: The lexical decision for וַתִּסָּגֵר and the exclusion context.
  rationale: “Was kept outside” expresses imposed exclusion in more familiar language.
- pob_phrase: the people did not set out
  simplified_phrase: the people did not move on
  preserved_meaning: Israel’s traveling community delayed its journey.
  reasoning_layer_used: The lexical decision for לֹא נָסַע in the wilderness travel setting.
  rationale: “Did not move on” clearly conveys that the whole community remained where it was.
- pob_phrase: until Miriam was brought back in
  simplified_phrase: until she was brought back into the camp
  preserved_meaning: The people waited until Miriam was restored to the camp after her exclusion.
  reasoning_layer_used: The lexical decision for עַד הֵאָסֵף מִרְיָם and the controlling POB revision.
  rationale: Naming the camp directly makes the destination clear without changing the restoration sense.
