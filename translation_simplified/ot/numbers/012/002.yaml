translation:
  language: en
  text: They said, “Is Moses really the only one Yahweh has spoken through?[a] Hasn’t he also spoken through us?” Yahweh heard what they said.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Is Moses really the only one Yahweh has spoken to? Hasn’t he also spoken to us?” The Hebrew can refer either to the recipient or to the person through whom God speaks.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Has Yahweh indeed spoken only through Moses?
  simplified_phrase: Is Moses really the only one Yahweh has spoken through?
  preserved_meaning: The question strongly challenges Moses’ unique role as the channel of Yahweh’s speech.
  reasoning_layer_used: Lexical and theological decisions on הֲרַק אַךְ and בְּמֹשֶׁה.
  rationale: The recast question uses ordinary English while retaining both emphasis and exclusivity.
- pob_phrase: And Yahweh heard it.
  simplified_phrase: Yahweh heard what they said.
  preserved_meaning: Yahweh heard Miriam and Aaron’s challenge.
  reasoning_layer_used: Lexical decision on וַיִּשְׁמַע יְהוָה.
  rationale: Naming the implied object makes the sentence immediately clear.
translation_notes:
  risk_flags:
  - risk: Readers may assume the Hebrew can only mean that Yahweh spoke through them.
    mitigation: The footnote preserves the legitimate alternative “spoken to.”
