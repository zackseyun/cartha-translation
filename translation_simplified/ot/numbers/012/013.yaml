simplification_decisions:
- pob_phrase: So Moses cried out to Yahweh, saying
  simplified_phrase: Then Moses cried out to Yahweh
  preserved_meaning: Moses urgently appealed directly to Yahweh.
  reasoning_layer_used: The source conjunction and discourse formula, together with the lexical decision for וַיִּצְעַק.
  rationale: “Then” keeps the narrative connection, while direct quotation makes “saying” unnecessary in natural English.
- pob_phrase: O God, please heal her.
  simplified_phrase: God, please heal her!
  preserved_meaning: Moses directly and urgently asks God to heal Miriam.
  reasoning_layer_used: The lexical decisions for אֵל, נָא, רְפָא, and לָהּ, plus the revision retaining one “please.”
  rationale: Dropping formal “O” and using an exclamation point makes the urgent prayer clear without changing its request.
