translation:
  language: en
  text: The cloud moved away from above the tent. Miriam was afflicted with a serious skin disease, like snow.[a] Aaron turned toward her and saw that she had the disease.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term traditionally translated “leprous” can refer to various serious skin diseases or ritual skin afflictions, not only to modern leprosy (Hansen’s disease).
    reason: lexical_alternative
