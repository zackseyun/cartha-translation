translation:
  language: en
  text: I speak with him mouth to mouth—that is, directly. I speak plainly, not in riddles, and he looks upon the form of Yahweh.[a] So why were you not afraid to speak against Moses, my servant?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the likeness of Yahweh” or “the appearance of Yahweh.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Mouth to mouth I speak with him
  simplified_phrase: I speak with him mouth to mouth—that is, directly
  preserved_meaning: God speaks with Moses in a direct, unmediated way while the Hebrew image remains visible.
  reasoning_layer_used: lexical decision for פֶּה אֶל פֶּה
  rationale: The inline explanation makes the unfamiliar image immediately understandable without replacing it.
- pob_phrase: he beholds the form of Yahweh
  simplified_phrase: he looks upon the form of Yahweh
  preserved_meaning: Moses intentionally looks upon Yahweh’s disclosed form without defining its nature.
  reasoning_layer_used: lexical and theological decisions for יַבִּיט and וּתְמֻנַת יְהוָה
  rationale: “Looks upon” is clearer than “beholds” while retaining the solemn, intentional sense.
- pob_phrase: my servant, against Moses
  simplified_phrase: Moses, my servant
  preserved_meaning: Moses is identified as God’s servant and as the target of the hostile speech.
  reasoning_layer_used: lexical decision for לְדַבֵּר בְּעַבְדִּי בְמֹשֶׁה
  rationale: Natural English apposition removes awkward repetition without weakening the rebuke.
