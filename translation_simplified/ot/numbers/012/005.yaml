translation:
  language: en
  text: Then Yahweh came down in a pillar of cloud and stood at the entrance to the tent.[a] He called Aaron and Miriam, and they both came forward.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The context indicates that this was the tent of meeting.
    reason: cross_reference
  - marker: b
    text: The Hebrew literally says “went out” or “came out,” likely meaning that they came forward when Yahweh called them.
    reason: lexical_alternative
