  reasoning_layer_used: POB lexical decision for the divine name
  rationale: Removing the opening “And” gives natural modern English while retaining Yahweh’s personal name.
- pob_phrase: Let her be shut up outside the camp for seven days
  simplified_phrase: She must be kept outside the camp for seven days
  preserved_meaning: Miriam is required to remain excluded from the camp for the full period.
  reasoning_layer_used: POB lexical decision for תִּסָּגֵר and camp-purity context
  rationale: The passive requirement remains clear without the potentially misleading phrase “shut up.”
- pob_phrase: and afterward she may be brought back in
