translation:
  language: en
  text: 'Yahweh suddenly spoke to Moses, Aaron, and Miriam: “All three of you, come out[a] to the tent of meeting.” So all three went out.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be translated “Go out”; it refers to leaving the place where they were.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And Yahweh said suddenly to Moses and to Aaron and to Miriam
  simplified_phrase: Yahweh suddenly spoke to Moses, Aaron, and Miriam
  preserved_meaning: Yahweh addressed all three without warning.
  reasoning_layer_used: POB lexical decisions for יְהוָה and פִּתְאֹם
  rationale: Natural word order keeps both the divine name and the suddenness of the speech.
- pob_phrase: Come out, you three
  simplified_phrase: All three of you, come out
  preserved_meaning: Each of the three was summoned to leave their present place.
  reasoning_layer_used: POB lexical decisions for צְאוּ and שְׁלָשְׁתְּכֶם
  rationale: The reordered command sounds natural while retaining the emphasis on all three.
- pob_phrase: And the three of them went out
  simplified_phrase: So all three went out
  preserved_meaning: Moses, Aaron, and Miriam all obeyed the summons.
