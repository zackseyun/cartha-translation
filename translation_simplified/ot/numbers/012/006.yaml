- pob_phrase: make myself known to him ... speak to him
  simplified_phrase: make myself known to that prophet ... speak to that prophet
  preserved_meaning: Yahweh reveals himself and speaks specifically to the prophet.
  reasoning_layer_used: Lexical decisions for אֵלָיו אֶתְוַדָּע and אֲדַבֶּר בּוֹ
  rationale: Repeating “that prophet” makes each pronoun’s referent immediately clear.
- pob_phrase: if there is a prophet among you, I, Yahweh, make myself known to him in a vision; I speak to him in a dream
