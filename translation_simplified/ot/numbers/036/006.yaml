translation:
  language: en
  text: 'This is what Yahweh has commanded concerning the daughters of Zelophehad: “They may marry whomever they think best, but they must marry within a clan of their father’s tribe.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “within a family of their father’s tribe.” This requirement keeps their inheritance within their father’s tribal line.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: This is the word that Yahweh has commanded concerning
  simplified_phrase: This is what Yahweh has commanded concerning
  preserved_meaning: The sentence introduces an authoritative divine command about Zelophehad’s daughters.
  reasoning_layer_used: Lexical decision for זֶה הַדָּבָר and theological decision for יְהוָה
  rationale: “This is what” gives the formal directive in natural English while retaining Yahweh’s name.
- pob_phrase: Let them become wives to whomever seems good in their eyes
  simplified_phrase: They may marry whomever they think best
  preserved_meaning: The daughters may choose their marriage partners within the stated restriction.
  reasoning_layer_used: Lexical decisions for לַטּוֹב בְּעֵינֵיהֶם and תִּהְיֶינָה לְנָשִׁים
  rationale: The Hebrew idiom is expressed in ordinary English, and “marry” replaces the awkward phrase “become wives.”
- pob_phrase: only they must become wives within the family of the tribe of their father
  simplified_phrase: but they must marry within a clan of their father’s tribe
  preserved_meaning: Marriage is restricted to a clan within their father’s tribe.
  reasoning_layer_used: Lexical decisions for אַךְ and לְמִשְׁפַּחַת מַטֵּה אֲבִיהֶם, confirmed by Numbers 36:7–9
  rationale: “Clan” clearly names the larger kinship group and avoids the modern sense of a nuclear family.
translation_notes:
  risk_flags:
  - risk: Some readers may not know the distinction between a clan and a tribe.
    mitigation: The wording places the clan within the father’s tribe, and the footnote explains the inheritance purpose.
