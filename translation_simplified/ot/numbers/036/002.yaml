translation:
  language: en
  text: They said, “My lord, Yahweh commanded you to give the land to the sons of Israel[a] as their inheritance, dividing it by lot. Yahweh also commanded you to give the inheritance of our brother Zelophehad to his daughters.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “children of Israel” or “Israelites.” The Hebrew reads “sons of Israel.”
    reason: lexical_alternative
