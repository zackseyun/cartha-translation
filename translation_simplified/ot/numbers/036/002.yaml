- pob_phrase: Yahweh commanded my lord
  simplified_phrase: My lord, Yahweh commanded you
  preserved_meaning: The clan leaders respectfully address Moses as the person Yahweh commanded.
  reasoning_layer_used: POB lexical decision for אֲדֹנִי
  rationale: Direct address with “you” is clearer while “my lord” preserves the respectful title.
- pob_phrase: to give the land as an inheritance by lot
  simplified_phrase: to give the land ... as their inheritance, dividing it by lot
  preserved_meaning: The land is Israel’s inherited grant and is distributed through lots.
  reasoning_layer_used: POB lexical decisions for בְּנַחֲלָה and בְּגוֹרָל
  rationale: The procedural phrase is recast as an action so modern readers can follow it easily.
- pob_phrase: and my lord was commanded by Yahweh
  simplified_phrase: Yahweh also commanded you
  preserved_meaning: Moses received a further command from Yahweh concerning Zelophehad’s inheritance.
  reasoning_layer_used: POB lexical decision for צֻוָּה בַיהוָה
  rationale: Changing the passive clause to active voice removes repetition without changing the source of the command.
