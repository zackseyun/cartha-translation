translation:
  language: en
  text: And when the Jubilee year comes for the sons of Israel,[a] the daughters’ inherited land will become part of the inheritance of the tribe they marry into. Their land will then be lost from the inheritance of our fathers’ tribe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This can also be translated “the Israelites”; the Hebrew literally says “the sons of Israel.”
    reason: lexical_alternative
