simplification_decisions:
- pob_phrase: No inheritance shall pass from one tribe to another tribe
  simplified_phrase: An inheritance must not be transferred from one tribe to another
  preserved_meaning: Inherited land must not change from one tribe’s ownership to another’s.
  reasoning_layer_used: The lexical decision for תִסֹּב identifies a legal transfer between tribes.
  rationale: “Must not be transferred” states the legal prohibition more directly in modern English.
- pob_phrase: for each of the tribes
  simplified_phrase: Each tribe
  preserved_meaning: The command applies separately to every Israelite tribe.
  reasoning_layer_used: The lexical decision for אִישׁ preserves its distributive force as “each.”
  rationale: A new sentence removes the formal connective without losing the stated rule.
- pob_phrase: shall hold fast to its own inheritance
  simplified_phrase: must hold firmly to its own inheritance
  preserved_meaning: Every tribe must remain attached to the inheritance allotted to it.
  reasoning_layer_used: The lexical decision for יִדְבְּקוּ preserves the image of firm attachment.
  rationale: “Must hold firmly” keeps the clinging image while making the obligation clear.
