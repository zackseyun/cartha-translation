translation:
  language: en
  text: Then the family leaders of the clan descended from Gilead son of Machir, son of Manasseh—one of the clans descended from Joseph—approached Moses and the other leaders, who were the family heads of the Israelites, to present their case.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the heads of the fathers’ houses
  simplified_phrase: the family leaders
  preserved_meaning: These men were recognized leaders of kinship households within Israel’s tribal structure.
  reasoning_layer_used: POB lexical decision for רָאשֵׁי הָאָבוֹת
  rationale: Common wording replaces an opaque Hebrew social idiom while retaining the leadership role.
- pob_phrase: the clan of the sons of Gilead ... from the clans of the sons of Joseph
  simplified_phrase: the clan descended from Gilead ... one of the clans descended from Joseph
  preserved_meaning: The wording keeps Gilead’s clan linked through Manasseh to the larger lineage of Joseph.
  reasoning_layer_used: POB lexical decisions for בְּנֵי גִלְעָד and מִמִּשְׁפְּחֹת בְּנֵי יוֹסֵף
  rationale: “Descended from” makes the genealogical meaning of “sons of” immediately clear.
- pob_phrase: came near and spoke before Moses and before the leaders, the heads of the fathers’ houses of the sons of Israel
  simplified_phrase: approached Moses and the other leaders, who were the family heads of the Israelites, to present their case
  preserved_meaning: They formally approached Moses and leaders who were themselves Israelite family heads in order to speak.
  reasoning_layer_used: POB lexical decisions for וַיִּקְרְבוּ, וַיְדַבְּרוּ, לִפְנֵי, and רָאשֵׁי אָבוֹת לִבְנֵי יִשְׂרָאֵל
  rationale: The recast sentence preserves the formal approach and the appositional identification in natural English.
