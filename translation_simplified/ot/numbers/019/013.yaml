translation:
  language: en
  text: Anyone who touches the dead body of a person but does not ritually purify himself defiles Yahweh’s tabernacle. That person shall be cut off from Israel.[a] Because the water for purification[b] was not sprinkled on him, he remains unclean; his uncleanness is still on him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The exact form of being “cut off” is not specified here.
    reason: simplification_note
  - marker: b
    text: The Hebrew literally says “water of impurity,” meaning the water used to remove impurity caused by contact with a corpse.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a dead person, the body of a man who has died
  simplified_phrase: the dead body of a person
  preserved_meaning: The phrase still refers specifically to a human corpse.
  reasoning_layer_used: Lexical decision for בְּמֵת and its appositional phrase
  rationale: The repeated description is compressed into direct modern English.
- pob_phrase: Because the water for impurity was not sprinkled on him, he shall be unclean
  simplified_phrase: Because the water for purification was not sprinkled on him, he remains unclean
  preserved_meaning: The specially prepared water was not applied, so his ritual impurity continues.
  reasoning_layer_used: Lexical decisions for מֵי נִדָּה and טָמֵא יִהְיֶה
  rationale: The purpose of the water and the continuing status are stated more naturally.
- pob_phrase: the tabernacle of Yahweh
  simplified_phrase: Yahweh’s tabernacle
  preserved_meaning: The sanctuary remains identified as Yahweh’s dwelling place.
  reasoning_layer_used: Lexical decision for מִשְׁכַּן יהוה
  rationale: The possessive form is shorter and clearer without weakening the sanctuary language.
interpretive_expansions:
- pob_phrase: purify himself
  rendering: ritually purify himself
  claim: The required purification concerns ritual uncleanness rather than repentance from moral sin.
  evidence:
