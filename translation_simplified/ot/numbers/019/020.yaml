translation:
  language: en
  text: But any man who becomes unclean and does not purify himself will be cut off from the community.[a] This is because he has defiled Yahweh’s sanctuary. The purification water has not been sprinkled on him; he is unclean.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression does not specify whether this means exclusion, death, or another form of divine judgment.
    reason: source_note
simplification_decisions:
- pob_phrase: the man who becomes unclean
  simplified_phrase: any man who becomes unclean
  preserved_meaning: The masculine form applies generically to an individual Israelite who enters a state of ritual impurity.
  reasoning_layer_used: Lexical decisions for אִישׁ and יִטְמָא.
  rationale: “Any man” makes the general legal rule clear while preserving the source form.
- pob_phrase: from the midst of the assembly
  simplified_phrase: from the community
  preserved_meaning: The person is cut off from the gathered covenant community.
  reasoning_layer_used: Lexical decision for מִתּוֹךְ הַקָּהָל.
  rationale: “From the community” states the communal consequence in ordinary English.
- pob_phrase: because he has defiled the sanctuary of Yahweh
  simplified_phrase: This is because he has defiled Yahweh’s sanctuary.
  preserved_meaning: Defiling Yahweh’s sacred dwelling is the stated reason for the cutting-off judgment.
  reasoning_layer_used: Source syntax and lexical decisions for מִקְדַּשׁ יְהוָה and טִמֵּא.
  rationale: A short sentence keeps the causal link explicit and easy to follow.
