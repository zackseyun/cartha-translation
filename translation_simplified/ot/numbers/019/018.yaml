translation:
  language: en
  text: Then a man who is ritually clean must take hyssop[a] and dip it into the water. He must sprinkle the water on the tent, all the objects in it, everyone who had been there, and anyone who had touched a human bone, the body of someone who was killed, a dead person, or a grave.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hyssop is the plant used in this purification ritual.
    reason: cultural_note
simplification_decisions:
- pob_phrase: a clean man
  simplified_phrase: a man who is ritually clean
  preserved_meaning: The man meets the ceremonial purity requirement, not a standard of moral character.
  reasoning_layer_used: POB theological decisions on ritual purity and gendered language
  rationale: This explains “clean” while retaining the source’s masculine singular.
- pob_phrase: on all the vessels, on the persons who were there
  simplified_phrase: all the objects in it, everyone who had been there
  preserved_meaning: Every relevant item and person in the tent receives the purification water.
  reasoning_layer_used: POB lexical decisions for הַכֵּלִים and הַנְּפָשׁוֹת
  rationale: Common wording replaces formal terms without narrowing their reference.
- pob_phrase: the slain body, or the dead person
  simplified_phrase: the body of someone who was killed, a dead person
  preserved_meaning: A violently killed body remains distinct from the broader category of any dead person.
  reasoning_layer_used: POB lexical decisions for בֶחָלָל and בַמֵּת
  rationale: The wording makes the source distinction clear without technical language.
