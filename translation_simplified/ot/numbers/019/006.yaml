translation:
  language: en
  text: Then the priest must take cedar wood, hyssop, and scarlet yarn and throw them into the middle of the fire as the cow burns.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “heifer.” Traditional English versions often use “heifer” here.
