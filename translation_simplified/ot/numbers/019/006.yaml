simplification_decisions:
- pob_phrase: shall take
  simplified_phrase: must take
  preserved_meaning: The priest is required to perform the next step in the ritual.
  reasoning_layer_used: Lexical decision for וְלָקַח and the ritual context
  rationale: “Must” states the prescribed action in direct modern English.
- pob_phrase: into the midst of the burning of the cow
  simplified_phrase: into the middle of the fire as the cow burns
  preserved_meaning: The materials are thrown into the ongoing burning process, not merely placed near it.
  reasoning_layer_used: Lexical decisions for אֶל תּוֹךְ and שְׂרֵפַת הַפָּרָה
  rationale: The recast phrase keeps both the middle location and the continuing burning clear.
interpretive_expansions:
- pob_phrase: the burning of the cow
  rendering: the fire as the cow burns
  claim: The burning process involves a fire into which the ritual materials are thrown.
  evidence:
  - The verb “throw” and the noun “burning” describe adding the materials during combustion.
  - The immediate ritual instruction presents the cow as actively being burned.
  confidence: high
  alternatives_preserved:
  - the burning of the cow
  - the burning of the heifer
translation_notes:
  risk_flags:
