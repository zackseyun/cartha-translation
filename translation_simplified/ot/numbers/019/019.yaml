  preserved_meaning: A person who is ritually clean must apply the prescribed purification water by sprinkling it.
  reasoning_layer_used: POB lexical decisions and applied revision
  rationale: “Must” expresses the legal requirement, while “purification water” identifies the implied object.
- pob_phrase: on the third day and on the seventh day; thus he shall purify him on the seventh day
  simplified_phrase: on the third and seventh days. In this way, the clean person must purify the unclean person on the seventh day.
  preserved_meaning: Both required times remain explicit, and the clean person must perform the seventh-day purification.
  reasoning_layer_used: POB lexical decisions and grounding review
  rationale: Two sentences and named participants clarify the sequence while preserving its mandatory force.
- pob_phrase: Then he shall wash his clothes and bathe in water, and he shall be clean at evening
  simplified_phrase: The person being purified must then wash their clothes and bathe in water. At evening, they will be ritually clean.
  preserved_meaning: The person undergoing purification washes their clothes and body before becoming ritually clean at evening.
  reasoning_layer_used: POB lexical decisions and immediate ritual context
  rationale: The wording identifies the washer and separates the required actions from their timed result.
