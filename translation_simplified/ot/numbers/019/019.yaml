translation:
  language: en
  text: A ritually clean person must sprinkle the purification water on the ritually unclean person on the third and seventh days. In this way, the clean person must purify the unclean person on the seventh day. The person being purified must then wash their clothes and bathe in water. At evening, they will be ritually clean.
  philosophy: optimal-equivalence
