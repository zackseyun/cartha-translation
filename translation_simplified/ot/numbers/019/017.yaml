  reasoning_layer_used: The lexical rationale recognizes an indefinite agent in this legal instruction.
  rationale: “Someone must” expresses the command naturally without assigning a specific agent.
- pob_phrase: some of the dust from the burning of the purification offering
  simplified_phrase: some of the dust left from burning the purification offering
  preserved_meaning: The material comes from burning the offering used in the purification rite.
  reasoning_layer_used: The lexical and theological decisions retain “dust” and “purification offering.”
  rationale: This wording plainly explains the dust’s origin while preserving the chosen terms.
- pob_phrase: he shall put living water on it in a vessel
  simplified_phrase: In a container, they must add fresh or flowing water to the dust
  preserved_meaning: The prescribed source water is added to the dust within a receptacle.
  reasoning_layer_used: The lexical decisions permit idiomatic water wording and “container” as a clear equivalent for “vessel.”
  rationale: “Add” avoids specifying pouring or a separate placement step not stated in the source.
