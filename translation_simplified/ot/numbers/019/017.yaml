translation:
  language: en
  text: For a person who is unclean, someone must take some of the dust left from burning the purification offering.[a] In a container, they must add fresh or flowing water to the dust.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally, “ashes from the burning of the sin offering”; the Hebrew says “dust,” and the offering serves to remove ritual impurity.
    reason: lexical_alternative
  - marker: b
    text: Literally, “living water,” meaning water from a fresh or flowing source.
    reason: lexical_alternative
