translation:
  language: en
  text: The person who collects the heifer’s ashes must wash his clothes. He will remain ritually unclean until evening. This is a permanent law for the sons of Israel[a] and for every foreign resident among them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sons of Israel” is a covenant expression for the whole people of Israel.
    reason: source_note
simplification_decisions:
- pob_phrase: the one who gathers the ashes of the heifer
  simplified_phrase: the person who collects the heifer’s ashes
  preserved_meaning: The person performing the gathering remains the subject.
  reasoning_layer_used: POB lexical decisions for הָאֹסֵף and אֵפֶר הַפָּרָה
  rationale: The active wording is shorter and more natural while retaining the heifer and her ashes.
- pob_phrase: shall wash his clothes, and he shall be unclean until the evening
  simplified_phrase: must wash his clothes. He will remain ritually unclean until evening.
  preserved_meaning: The required washing and temporary impurity remain distinct provisions.
  reasoning_layer_used: POB lexical and theological decisions on washing and impurity
  rationale: Two sentences make the ritual requirement and its duration easier to follow.
- pob_phrase: the sojourner who sojourns among them as a permanent statute
  simplified_phrase: a permanent law ... for every foreign resident among them
  preserved_meaning: The enduring rule also applies to non-native residents within Israel.
  reasoning_layer_used: POB lexical decisions for גֵּר and חֻקַּת עוֹלָם
  rationale: Common legal wording replaces the repeated and less familiar terms without erasing resident-outsider status.
