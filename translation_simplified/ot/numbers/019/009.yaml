translation:
  language: en
  text: Then a ceremonially clean man must gather the heifer’s ashes and put them in a ceremonially clean place outside the camp. The ashes must be kept for the community of Israel to make water for removing ritual impurity. It is a sin offering.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a purification offering.” The Hebrew term can refer to a sin offering or, in priestly rituals, an offering that brings purification.
    reason: alternative_reading
