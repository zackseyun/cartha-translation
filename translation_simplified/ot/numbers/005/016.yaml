simplification_decisions:
- pob_phrase: shall bring her near
  simplified_phrase: must bring her forward
  preserved_meaning: The priest is required to bring the woman into position for the ceremony.
  reasoning_layer_used: The lexical decision lists “shall bring her forward” as an acceptable rendering of the Hiphil of קרב.
  rationale: “Must” makes the legal requirement clear, while “bring her forward” expresses the spatial action naturally.
- pob_phrase: make her stand
  simplified_phrase: have her stand
  preserved_meaning: The priest causes the woman to take her place standing before Yahweh.
  reasoning_layer_used: The lexical rationale requires the causative force of the Hiphil of עמד to remain.
  rationale: “Have her stand” keeps the causative meaning in smoother modern English.
translation_notes:
  risk_flags:
  - risk: “Bring her forward” may sound less spatially precise than “bring her near.”
    mitigation: It is an approved lexical alternative, and the following phrase identifies where she is brought.
