translation:
  language: en
  text: Then the priest must take holy water[a] in a clay container. He must take some dust from the floor[b] of the tabernacle and put it into the water.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “holy water” means water set apart for sacred ritual use.
    reason: simplification_note
  - marker: b
    text: Or “ground.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: in an earthen vessel
  simplified_phrase: in a clay container
  preserved_meaning: The container is made of earthenware or clay.
  reasoning_layer_used: POB lexical decision for בִּכְלִי חָרֶשׂ
  rationale: “Clay container” states the material in familiar modern English.
- pob_phrase: shall take ... shall take ... and put
  simplified_phrase: must take ... must take ... and put
  preserved_meaning: These actions are required steps in the ritual procedure.
  reasoning_layer_used: POB lexical decision for the procedural verb sequence
  rationale: “Must” communicates required action more naturally than legal-style “shall.”
- pob_phrase: some of the dust that is on the floor of the tabernacle
  simplified_phrase: some dust from the floor of the tabernacle
  preserved_meaning: The priest takes only a portion of the dust from the tabernacle floor.
  reasoning_layer_used: POB lexical decisions for מִן הֶעָפָר and בְּקַרְקַע הַמִּשְׁכָּן
  rationale: The shorter wording preserves both the partitive sense and the source location.
