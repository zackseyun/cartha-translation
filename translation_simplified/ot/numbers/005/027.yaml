translation:
  language: en
  text: He will make her drink the water. If she has defiled herself and been unfaithful to her husband, the water that brings the curse will enter her with a bitter effect.[a] Her belly will swell, and her thigh will waste away.[b] She will become a curse among her people.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “will enter her as bitter water.” The Hebrew may describe either the water itself or its bitter effect.
    reason: lexical_alternative
  - marker: b
    text: Literally “her thigh will fall.” This may refer indirectly to a severe affliction of her reproductive organs, but the exact meaning is uncertain.
    reason: lexical_alternative
