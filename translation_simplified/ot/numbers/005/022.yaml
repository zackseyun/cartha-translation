translation:
  language: en
  text: May these curse-bringing waters enter deep inside your body and make your belly swell and your thigh waste away.[a] Then the woman must say, “Amen, amen.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “to swell the belly and cause the thigh to fall.” The difficult Hebrew wording may refer indirectly to harm to her reproductive organs.
    reason: lexical_alternative
