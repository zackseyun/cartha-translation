translation:
  language: en
  text: Then the priest must have the woman swear the oath connected with this curse. He must say to her, “May Yahweh make you an example your people use in curses and oaths, when he makes your thigh waste away[a] and your abdomen swell.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression may refer to the thigh wasting away or may be a euphemism involving the reproductive organs.
    reason: lexical_alternative
  - marker: b
    text: “Abdomen” may also mean “belly” or “womb”; the exact bodily effect is uncertain.
    reason: lexical_alternative
