translation:
  language: en
  text: But if the woman has not become unclean and is clean, she will be cleared of the accusation and will be able to conceive children.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebrew: “will be sown with seed,” an image referring to conception or the ability to have children.'
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: has not defiled herself and is clean
  simplified_phrase: has not become unclean and is clean
  preserved_meaning: She has not incurred the moral and ritual uncleanness at issue.
  reasoning_layer_used: POB lexical decisions for לֹא נִטְמְאָה and וּטְהֹרָה הִוא
  rationale: “Become unclean” is plain English and avoids specifying agency not explicit in the verb.
- pob_phrase: she will be cleared
  simplified_phrase: she will be cleared of the accusation
  preserved_meaning: The ordeal vindicates her from the charge against her.
  reasoning_layer_used: POB lexical rationale for וְנִקְּתָה and immediate context
  rationale: Naming the accusation makes the meaning of “cleared” immediately understandable.
- pob_phrase: will conceive offspring
  simplified_phrase: will be able to conceive children
  preserved_meaning: The outcome concerns her capacity for conception without requiring one immediate pregnancy.
  reasoning_layer_used: POB lexical and theological decisions for וְנִזְרְעָה זָרַע
  rationale: This wording preserves the broader fertility sense while avoiding the formal word “offspring.”
interpretive_expansions:
- pob_phrase: she will be cleared
  rendering: she will be cleared of the accusation
  claim: Her clearing is vindication from the accusation tested by the ordeal.
  evidence:
  - The immediate context concerns an accusation of adultery.
  - The POB lexical rationale identifies vindication from the accusation as the intended sense.
  confidence: high
  alternatives_preserved:
  - cleared
  - acquitted
  - unharmed
- pob_phrase: will conceive offspring
  rendering: will be able to conceive children
  claim: The promise concerns confirmed or restored capacity to conceive, not necessarily one immediate conception.
  evidence:
  - The POB theological decision identifies capacity to conceive as the chosen reading.
  - The Hebrew seed-sowing idiom can refer broadly to conception or fertility.
  confidence: moderate
  alternatives_preserved:
  - will conceive
  - continued fertility
translation_notes:
  risk_flags:
  - risk: “Become unclean” may be heard as only ritual impurity.
    mitigation: The surrounding ordeal supplies the moral and sexual context.
  - risk: “Will be able to conceive children” states the capacity reading more directly than the Hebrew idiom.
    mitigation: The footnote preserves the source image and acknowledges its conception sense.
