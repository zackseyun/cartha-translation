translation:
  language: en
  text: Then the priest must take a handful from the grain offering. This handful is its memorial portion, and he must burn it on the altar. After that, he must make the woman drink the water.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the bitter water.” The surrounding passage describes it that way, but this verse simply says “the water.”
    reason: lexical_alternative
