- pob_phrase: take a handful from the grain offering, its memorial portion
  simplified_phrase: take a handful from the grain offering. This handful is its memorial portion
  preserved_meaning: The priest removes the prescribed handful, which serves as the offering’s memorial portion.
  reasoning_layer_used: Lexical decisions for וְקָמַץ, מִן־הַמִּנְחָה, and אֶת אַזְכָּרָתָהּ
  rationale: A second sentence makes the ritual relationship clear without replacing the technical term.
- pob_phrase: shall take ... and burn ... shall make
  simplified_phrase: must take ... must burn ... must make
  preserved_meaning: Each action remains a required step in the ritual instructions.
  reasoning_layer_used: Legal-instruction syntax noted in the lexical rationale for וְקָמַץ
  rationale: “Must” communicates required action more directly in modern English.
- pob_phrase: afterward
  simplified_phrase: After that
  preserved_meaning: The woman drinks only after the memorial portion is burned.
  reasoning_layer_used: Lexical decision for וְאַחַר
  rationale: The common phrase keeps the sequence easy to follow.
