translation:
  language: en
  text: Command the sons of Israel to send out of the camp anyone with a serious skin condition,[a] anyone with a bodily discharge, and anyone who is ritually unclean through contact with a dead body.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term covers serious skin afflictions in ritual law and does not necessarily mean modern leprosy.
    reason: lexical_alternative
