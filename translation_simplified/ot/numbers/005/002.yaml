  simplified_phrase: Command the sons of Israel to send out
  preserved_meaning: The directive remains a forceful command addressed to Israel as a people.
  reasoning_layer_used: POB lexical decisions for צַו, בְּנֵי יִשְׂרָאֵל, and וִישַׁלְּחוּ
  rationale: The infinitive construction is clearer modern English than the clause with “that they.”
- pob_phrase: everyone with a skin disease, and everyone with a discharge
  simplified_phrase: anyone with a serious skin condition, anyone with a bodily discharge
  preserved_meaning: Both distinct bodily conditions that require removal from the camp remain named.
  reasoning_layer_used: POB lexical decisions and footnote for צָרוּעַ and זָב
  rationale: “Condition” avoids a narrow modern diagnosis, while “bodily” clarifies the kind of discharge.
- pob_phrase: everyone unclean by a dead body
  simplified_phrase: anyone who is ritually unclean through contact with a dead body
  preserved_meaning: The phrase still describes corpse-related ritual impurity rather than moral guilt.
  reasoning_layer_used: POB lexical rationale and theological decision for טָמֵא לָנָפֶשׁ
  rationale: The Hebrew idiom is stated directly so modern readers can understand the source of uncleanness.
