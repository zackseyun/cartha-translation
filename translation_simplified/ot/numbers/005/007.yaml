  - The POB lexical rationale identifies אָשָׁם here as liability or compensation rather than a guilt offering.
  - The following requirement to add one-fifth confirms a repayment context.
  confidence: high
  alternatives_preserved:
  - The POB audit retains “for his guilt” as a closer expression of culpability.
  - The payment may still be described as restitution or compensation.
