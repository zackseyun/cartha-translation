  reasoning_layer_used: lexical and theological decisions for וְהֵשִׁיב אֶת אֲשָׁמוֹ בְּרֹאשׁוֹ
  rationale: “Repay in full what is owed” makes the non-sacrificial financial sense immediately clear.
