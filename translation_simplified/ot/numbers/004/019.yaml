translation:
  language: en
  text: But this is what you must do for them, so that they may live and not die when they approach the most holy things:[a] Aaron and his sons must come and assign each man his task and the load he must carry.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be translated “the Holy of Holies” or “the most holy place,” but here it likely refers to the holiest sacred objects.
    reason: alternative_reading
