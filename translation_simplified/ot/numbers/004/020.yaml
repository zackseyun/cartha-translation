translation:
  language: en
  text: But they must not enter to look at the sacred objects, not even for a moment.[a] If they do, they will die.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “for an instant” or “while the sacred objects are being covered.”
