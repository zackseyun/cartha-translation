simplification_decisions:
- pob_phrase: go in to look at the holy things
  simplified_phrase: enter to look at the sacred objects
  preserved_meaning: The Kohathites are forbidden to enter and view the sacred tabernacle furnishings.
  reasoning_layer_used: Lexical decisions and theological decision on the referent of הַקֹּדֶשׁ
  rationale: “Enter” is more direct, and “sacred objects” makes the concrete collective referent clear.
- pob_phrase: or they will die
  simplified_phrase: If they do, they will die.
  preserved_meaning: Death is the stated consequence of violating the prohibition.
  reasoning_layer_used: Lexical decision for וָמֵתוּ
  rationale: A separate conditional sentence makes the warning easier to follow without weakening it.
