translation:
  language: en
  text: When the camp sets out, Aaron and his sons must come and take down the veil that serves as a screen. They must use it to cover the ark of the testimony.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally, “the ark of the covenant,” but the Hebrew here says “testimony.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: shall come and take down
  simplified_phrase: must come and take down
  preserved_meaning: Aaron and his sons are instructed to remove the veil before the camp travels.
  reasoning_layer_used: lexical decisions for וּבָא and וְהוֹרִדוּ
  rationale: “Must” presents the future instruction in clear modern English.
- pob_phrase: the veil of the screen
  simplified_phrase: the veil that serves as a screen
  preserved_meaning: The sanctuary veil functions as a screening partition.
  reasoning_layer_used: lexical decisions for פָּרֹכֶת and הַמָּסָךְ
  rationale: The rewrite keeps both the specific veil and the Hebrew screen image while clarifying their relationship.
- pob_phrase: and cover the ark of the testimony with it
  simplified_phrase: They must use it to cover the ark of the testimony
  preserved_meaning: The removed veil is used to cover the ark identified by the testimony.
  reasoning_layer_used: lexical and theological decisions for וְכִסּוּ בָהּ and אֲרֹן הָעֵדֻת
  rationale: A new sentence makes the action and the pronoun’s reference easier to follow without replacing “testimony” with “covenant.”
