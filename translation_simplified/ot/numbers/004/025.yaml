translation:
  language: en
  text: They must carry the tabernacle curtains, the tent of meeting and its covering, the fine leather covering[a] laid over it on top, and the screen at the entrance to the tent of meeting.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word refers to an uncertain kind of material or animal hide; traditional translations include “badger skin,” and some use the Hebrew name “tahash.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: They shall carry
  simplified_phrase: They must carry
  preserved_meaning: The appointed carriers are obligated to transport these sanctuary materials.
  reasoning_layer_used: Lexical decision for וְנָשְׂאוּ in its transport context.
  rationale: “Must” expresses the command naturally in modern English.
- pob_phrase: the tent of meeting with its covering, and the covering of fine leather
  simplified_phrase: the tent of meeting and its covering, the fine leather covering
  preserved_meaning: The tent and its distinct covering layers remain separately named.
  reasoning_layer_used: Lexical decisions for מִכְסֵהוּ and מִכְסֵה הַתַּחַשׁ.
  rationale: The reordered list makes the separate items easier to follow.
- pob_phrase: that is over it above
  simplified_phrase: laid over it on top
  preserved_meaning: The fine leather forms the uppermost covering over the tent.
  reasoning_layer_used: Lexical rationale for אֲשֶׁר עָלָיו מִלְמָעְלָה.
  rationale: The concrete wording removes the awkward repetition while preserving position.
translation_notes:
  risk_flags:
