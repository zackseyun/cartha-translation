translation:
  language: en
  text: 'Then they must place on the altar all the tools used in service there: the fire pans, forks, shovels, and basins—all the altar’s tools. They must spread a covering of fine leather[a] over the altar and put its carrying poles in place.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word for this animal hide is uncertain. It may refer to goatskin, porpoise skin, or, more generally, durable leather.
    reason: lexical_alternative
