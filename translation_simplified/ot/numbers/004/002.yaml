translation:
  language: en
  text: Take a census[a] of Kohath’s descendants among Levi’s descendants. Count them by clan and by their fathers’ households.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression literally means “lift up the head,” an idiom for counting people in a census.
    reason: lexical_alternative
