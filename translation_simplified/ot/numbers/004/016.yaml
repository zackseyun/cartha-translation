translation:
  language: en
  text: Eleazar son of Aaron the priest will be responsible for the lamp oil, the fragrant incense, the regular grain offering, and the anointing oil. He will also oversee the whole tabernacle and everything in it, including the sanctuary[a] and all its furnishings.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “holy place”; here the term likely refers more broadly to the sacred area.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the oversight of Eleazar son of Aaron the priest shall be
  simplified_phrase: Eleazar son of Aaron the priest will be responsible for
  preserved_meaning: Eleazar is entrusted with supervision of the listed sacred supplies.
  reasoning_layer_used: POB lexical and theological decisions on פְקֻדַּת
  rationale: The active wording makes the assigned responsibility immediately clear.
- pob_phrase: the oil for the light
  simplified_phrase: the lamp oil
  preserved_meaning: The oil is used for the sanctuary lampstand.
  reasoning_layer_used: POB lexical alternatives for שֶׁמֶן הַמָּאוֹר
  rationale: “Lamp oil” is the clearest permitted equivalent for modern readers.
- pob_phrase: the oversight of the whole tabernacle and all that is in it, the sanctuary and its furnishings
  simplified_phrase: He will also oversee the whole tabernacle and everything in it, including the sanctuary and all its furnishings
  preserved_meaning: Eleazar’s supervision extends broadly to the tabernacle, its sacred area, and its equipment.
  reasoning_layer_used: POB theological decision and applied revision on the second פְקֻדַּת and closing apposition
  rationale: A second sentence untangles the dense nominal structure while retaining its broad scope.
translation_notes:
  risk_flags:
  - risk: “Including” presents the closing nouns as specifying what is within Eleazar’s wider oversight.
    mitigation: This follows the POB’s appositional reading without narrowing the sanctuary to one inner room.
