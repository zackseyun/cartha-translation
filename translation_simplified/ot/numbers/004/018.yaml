translation:
  language: en
  text: Do not cause the Kohathite families to be cut off from the Levites.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Do not destroy the Kohathite clans from among the Levites.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Do not cut off
  simplified_phrase: Do not cause ... to be cut off
  preserved_meaning: The command forbids bringing about the Kohathites’ loss while retaining the Hebrew image of being cut off.
  reasoning_layer_used: Lexical decision for תַּכְרִיתוּ and theological decision on the prohibition’s force
  rationale: The causative wording makes the agents’ responsibility clear without specifying how the loss would happen.
- pob_phrase: the tribe of the families of the Kohathites
  simplified_phrase: the Kohathite families
  preserved_meaning: The Kohathites remain identified as family groups within the Levites.
  reasoning_layer_used: Lexical decisions for שֵׁבֶט, מִשְׁפְּחֹת, and הַקְּהָתִי
  rationale: The shorter wording removes a confusing genealogical stack without changing the group in view.
- pob_phrase: from among the Levites
  simplified_phrase: from the Levites
  preserved_meaning: The Kohathite families are presented as a subgroup within the larger Levite body.
  reasoning_layer_used: Lexical decision for מִתּוֹךְ and contextual note on הַלְוִיִּם
  rationale: Ordinary English expresses the same separation clearly without the formal phrase “from among.”
translation_notes:
  risk_flags:
  - risk: “Cut off” may be understood as exclusion rather than destruction or death.
    mitigation: The footnote preserves “destroy” as a possible force, while the main text keeps the POB’s deliberate breadth.
