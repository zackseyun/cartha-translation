translation:
  language: en
  text: Then they must take all the tools used for serving in the sanctuary. They must wrap them in a blue cloth, cover them with fine leather,[a] and place them on the carrying frame.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word is uncertain; it may refer to a particular animal skin or to a kind of fine or durable leather.
    reason: lexical_alternative
  - marker: b
    text: Or “place them on the carrying pole.” The singular Hebrew word may refer to the whole carrying apparatus.
    reason: lexical_alternative
