simplification_decisions:
- pob_phrase: All those counted, whom Moses and Aaron and the leaders of Israel counted among the Levites
  simplified_phrase: All those included in the census of the Levites by Moses, Aaron, and the leaders of Israel
  preserved_meaning: The verse identifies everyone officially counted as part of the Levite census and names those who conducted it.
  reasoning_layer_used: The lexical decisions identify both forms of פקד as official census language.
  rationale: Using “included in the census” avoids awkward repetition while preserving the official counting sense.
- pob_phrase: by their clans and by their fathers' houses
  simplified_phrase: grouped by clan and ancestral family group
  preserved_meaning: The Levites were organized according to two levels of kinship.
  reasoning_layer_used: The lexical rationale and cultural footnote define fathers’ houses as ancestral family divisions within clans.
  rationale: The clearer terms retain both distinct family structures without the opaque phrase “fathers’ houses.”
translation_notes:
  risk_flags:
  - risk: “Ancestral family group” is less technically precise than the conventional term “fathers’ house.”
    mitigation: It follows the POB cultural note while preserving the unit as distinct from the clan.
