translation:
  language: en
  text: When it is time for the camp to set out, Aaron and his sons must finish covering the sanctuary and all its furnishings. Only then are the sons of Kohath to come and carry them. They must not touch the holy things,[a] or they will die. These holy things are the load assigned to the sons of Kohath in the tent of meeting.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the sanctuary.” The Hebrew can refer either to the sacred objects or more broadly to the sanctuary.
    reason: alternative_reading
