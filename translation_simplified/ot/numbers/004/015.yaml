- pob_phrase: When Aaron and his sons have finished covering the sanctuary and all the furnishings of the sanctuary, when the camp sets out, after that
  simplified_phrase: When it is time for the camp to set out, Aaron and his sons must finish covering the sanctuary and all its furnishings. Only then
  preserved_meaning: Aaron and his sons must complete the coverings before the sons of Kohath begin carrying the sacred items.
  reasoning_layer_used: Lexical decisions on completion, covering, camp departure, and sequence
  rationale: The dense opening is divided into chronological steps without changing the required order.
- pob_phrase: the sons of Kohath shall come to carry them
  simplified_phrase: the sons of Kohath are to come and carry them
  preserved_meaning: The sons of Kohath have an assigned transport duty rather than mere permission to carry the items.
  reasoning_layer_used: Lexical decision for לָשֵׂאת and grounding review
  rationale: “Are to” clearly presents carrying as their duty while keeping the sequence.
- pob_phrase: These are the burden of the sons of Kohath
  simplified_phrase: These holy things are the load assigned to the sons of Kohath
  preserved_meaning: The sacred items are the concrete carrying load assigned to the sons of Kohath.
  reasoning_layer_used: Lexical decision for מַשָּׂא and immediate context
  rationale: The wording identifies both the load and the duty while preserving the carrying image.
