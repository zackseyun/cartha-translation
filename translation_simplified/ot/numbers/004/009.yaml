translation:
  language: en
  text: Then they must take a blue cloth[a] and use it to cover the lampstand that provides light, together with its lamps, tongs, firepans, and all the equipment for its oil used in serving the lampstand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “blue-purple cloth,” referring to the distinctive dyed fabric used in the tabernacle.
    reason: lexical_alternative
