translation:
  language: en
  text: If someone suddenly dies beside the Nazirite, this makes his consecrated head ritually unclean. He must then shave his head on the day of his cleansing—the seventh day.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And if someone dies suddenly beside him
  simplified_phrase: If someone suddenly dies beside the Nazirite
  preserved_meaning: An abrupt, unexpected death in the Nazirite’s immediate presence creates the stated condition.
  reasoning_layer_used: Lexical decisions for וְכִי, יָמוּת מֵת, עָלָיו, and בפתע פתאם
  rationale: Naming the Nazirite clarifies the pronoun without changing the conditional case.
- pob_phrase: and he defiles his consecrated head
  simplified_phrase: this makes his consecrated head ritually unclean
  preserved_meaning: The sudden death interrupts the ritual consecration represented by the Nazirite’s head and hair.
  reasoning_layer_used: Lexical decision for וְטִמֵּא and theological decision on רֹאשׁ נִזְרוֹ
  rationale: The recast clause removes an unclear subject while retaining ritual defilement and consecration.
- pob_phrase: then he shall shave his head on the day of his cleansing; on the seventh day he shall shave it
  simplified_phrase: He must then shave his head on the day of his cleansing—the seventh day.
  preserved_meaning: Shaving is required as part of cleansing on the seventh day.
  reasoning_layer_used: Lexical decisions for וְגִלַּח רֹאשׁוֹ, בְּיוֹם טָהֳרָתוֹ, and בַּיּוֹם הַשְּׁבִיעִי
  rationale: Combining the repeated command makes the required timing clear in ordinary English.
interpretive_expansions:
- pob_phrase: he defiles
  rendering: this makes ... ritually unclean
  claim: The uncleanness is ritual rather than ordinary physical dirtiness.
  evidence:
  - The POB rationale identifies death impurity and ritual cleansing as the verse’s domain.
  - The theological audit describes impurity interrupting Nazirite consecration.
  confidence: high
  alternatives_preserved:
  - defiles
  - makes unclean
translation_notes:
  risk_flags:
  - risk: Combining the two shaving clauses reduces the Hebrew legal repetition.
    mitigation: The rendering retains both the cleansing setting and the seventh-day timing.
