translation:
  language: en
  text: 'Then he must present his offering to Yahweh: a one-year-old male lamb with no defects as a burnt offering, a one-year-old female lamb with no defects as a sin offering[a], and one ram with no defects for peace offerings[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “purification offering.” The Hebrew term can refer both to sin and to the sacrifice that removes impurity or offense.
    reason: alternative_reading
  - marker: b
    text: Or “fellowship offerings” or “offerings of well-being.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and he shall present
  simplified_phrase: Then he must present
  preserved_meaning: The command continues the ritual procedure and remains obligatory.
  reasoning_layer_used: Lexical decision for וְהִקְרִיב and procedural context
  rationale: “Then” marks sequence, while “must” expresses the legal requirement in common English.
- pob_phrase: one year-old ewe lamb without blemish
  simplified_phrase: a one-year-old female lamb with no defects
  preserved_meaning: The animal is a female lamb in its first year and must be fit for sacrifice.
  reasoning_layer_used: Lexical decisions for כַבְשָׂה, בַּת שְׁנָתָהּ, and תְּמִימָה
  rationale: “Female lamb” and “with no defects” clarify unfamiliar livestock and ritual language.
- pob_phrase: one ram without blemish for peace offerings
  simplified_phrase: one ram with no defects for peace offerings
  preserved_meaning: The count, required condition, and plural sacrificial category are retained.
  reasoning_layer_used: Lexical decisions for אַיִל, תָמִים, and שְׁלָמִים, plus grounding review
  rationale: This simplifies “without blemish” while preserving the Hebrew and POB plural category.
translation_notes:
