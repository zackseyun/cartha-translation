translation:
  language: en
  text: Throughout his Nazirite vow,[a] no razor may touch his head. Until the full time of his separation to Yahweh is complete, he is to be holy and let his hair grow long and untrimmed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A Nazirite vow was a vow of separation and dedication to Yahweh.
    reason: cultural_note
