translation:
  language: en
  text: He must not make himself ritually unclean when a close relative dies—not even his father, mother, brother, or sister—because he is consecrated to his God, as shown by the hair on his head.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: He shall not make himself unclean for them at their death
  simplified_phrase: He must not make himself ritually unclean when a close relative dies
  preserved_meaning: The Nazirite must not incur ritual uncleanness on the occasion of a relative’s death.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Ritually” prevents moral misunderstanding, while “when” directly states the occasion.
- pob_phrase: not even for his father or his mother, for his brother or his sister
  simplified_phrase: not even his father, mother, brother, or sister
  preserved_meaning: The emphatic prohibition includes each named close relative.
  reasoning_layer_used: lexical decision
  rationale: The shorter list preserves the singular relatives and the force of “not even.”
- pob_phrase: the consecration of his God is on his head
  simplified_phrase: he is consecrated to his God, as shown by the hair on his head
  preserved_meaning: His consecrated status belongs to his God and has a visible sign on his head.
  reasoning_layer_used: lexical decision and cultural note
  rationale: This distinguishes his consecrated status from the hair that symbolizes it.
interpretive_expansions:
- pob_phrase: the consecration of his God is on his head
  rendering: he is consecrated to his God, as shown by the hair on his head
  claim: The Nazirite’s hair visibly shows his consecration to God without being identical to that consecration.
  evidence:
  - The POB lexical decision says the term points to consecrated status.
  - The POB cultural note identifies the hair as its symbol.
  - Numbers 6:5 supplies the immediate context of uncut hair.
  confidence: high
  alternatives_preserved:
  - the sign of his consecration to his God is on his head
  - his consecration to his God is marked by the hair on his head
translation_notes:
  risk_flags:
  - risk: Naming the hair makes the head imagery more explicit than this verse does by itself.
    mitigation: The wording presents hair only as the sign, following the POB note and immediate context.
