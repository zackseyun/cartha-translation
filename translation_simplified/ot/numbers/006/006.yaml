  preserved_meaning: The prohibition applies during the entire period of his dedicated separation to the LORD.
  reasoning_layer_used: Lexical and theological decisions on הַזִּירוֹ and לַיהוָה
  rationale: The verbal wording makes the duration and dedication clear without adding “vow” to the main text.
