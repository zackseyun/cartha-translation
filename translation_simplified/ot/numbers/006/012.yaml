translation:
  language: en
  text: He must begin the days of his Nazirite vow[a] again for the LORD. He must also bring a one-year-old male lamb as a guilt offering. The days he completed earlier will no longer count, because his Nazirite vow had become ritually defiled.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A Nazirite vow was a period of special separation and dedication to the LORD.
    reason: cultural_note
