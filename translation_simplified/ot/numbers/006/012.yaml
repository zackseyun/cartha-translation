  preserved_meaning: The interrupted period of consecrated separation must restart and is dedicated to YHWH.
  reasoning_layer_used: Lexical and theological decisions for נזר and יהוה
  rationale: This replaces an abstract ritual phrase with a clear action while retaining the Nazirite institution and the required divine title.
- pob_phrase: a male lamb a year old
  simplified_phrase: a one-year-old male lamb
  preserved_meaning: The required sacrifice is a male lamb in its first year.
  reasoning_layer_used: Lexical decision for כֶּבֶשׂ בֶּן שְׁנָתוֹ
  rationale: The reordered phrase is more natural in modern English without changing the sacrificial specification.
- pob_phrase: the former days shall be void
  simplified_phrase: The days he completed earlier will no longer count
  preserved_meaning: Days observed before the defilement do not count toward fulfilling the vow.
  reasoning_layer_used: Lexical decision and POB footnote for יִפְּלוּ
  rationale: This states the legal effect directly instead of using the opaque word “void.”
