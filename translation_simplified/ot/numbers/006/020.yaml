translation:
  language: en
  text: The priest must wave them before Yahweh as a wave offering. This sacred portion belongs to the priest, in addition to the breast of the wave offering and the thigh of the contribution offering.[a] Afterward, the Nazirite may drink wine.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the thigh of the heave offering.”
    reason: lexical_alternative
  - marker: b
    text: Or, “the Nazirite shall drink wine.” Here the context indicates that the Nazirite is again permitted to drink wine after completing the vow.
    reason: alternative_reading
