translation:
  language: en
  text: This is the law for a Nazirite:[a] When his time of being set apart is complete, he must be brought[b] to the entrance of the tent of meeting.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A Nazirite was a person set apart to God under a special vow.
    reason: cultural_note
  - marker: b
    text: The Hebrew formally says “he shall bring him,” but it does not identify who brings the Nazirite.
    reason: lexical_alternative
