  language: en
  text: Also bring a basket of bread made without yeast. It must include cakes made from fine flour mixed with oil and thin wafers made without yeast and spread with oil.[a] Bring the grain offering and drink offerings that go with the sacrifices as well.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses the usual word for “anointed,” here referring to oil spread on the wafers.
    reason: lexical_alternative
