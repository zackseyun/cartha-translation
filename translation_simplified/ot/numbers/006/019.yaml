translation:
  language: en
  text: Then the priest must take the boiled shoulder of the ram, one unleavened loaf from the basket, and one unleavened wafer. After the Nazirite has shaved his consecrated head,[a] the priest must place these items on the Nazirite’s palms.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says “after he has shaved his consecration.” Here it means the hair or head that marked his Nazirite consecration.
    reason: lexical_alternative
