  rationale: “Must” states the legal requirement more directly than “shall” for modern readers.
- pob_phrase: and put them on the palms of the Nazirite
  simplified_phrase: the priest must place these items on the Nazirite’s palms
  preserved_meaning: The priest places all three ritual items on the person’s palms.
  reasoning_layer_used: POB lexical decisions for וְנָתַן and עַל כַּפֵּי
  rationale: Repeating the participants removes pronoun ambiguity while preserving the physical image of the palms.
- pob_phrase: after he has shaved his consecrated head
  simplified_phrase: After the Nazirite has shaved his consecrated head
  preserved_meaning: The shaving of the hair marking his consecration occurs before the priest places the items.
  reasoning_layer_used: POB theological decision for נִזְרוֹ
  rationale: Naming the Nazirite makes the sequence clear without replacing the embodied ritual meaning.
