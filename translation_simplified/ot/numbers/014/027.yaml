translation:
  language: en
  text: How long will this evil community keep grumbling against me? I have heard the complaints that the sons of Israel[a] keep making against me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The sons of Israel” means the Israelites and reflects the masculine wording of the Hebrew.
    reason: simplification_note
simplification_decisions:
- pob_phrase: How long shall
  simplified_phrase: How long will
  preserved_meaning: God’s question still expresses exasperation over their continuing rebellion.
  reasoning_layer_used: POB lexical decision for עַד מָתַי
  rationale: “Will” replaces the formal “shall” without weakening the question.
- pob_phrase: this evil congregation
  simplified_phrase: this evil community
  preserved_meaning: God morally condemns the assembled people of Israel as a group.
  reasoning_layer_used: POB lexical decisions for עֵדָה and רָעָה
  rationale: “Community” is a listed lexical alternative, while “evil” retains the severity of God’s judgment.
- pob_phrase: the complaints of the sons of Israel, which they are grumbling against me
  simplified_phrase: the complaints that the sons of Israel keep making against me
  preserved_meaning: Their repeated complaints are directed in opposition to God, and he has heard them.
  reasoning_layer_used: POB lexical decisions and applied revision for תְּלֻנּוֹת, מַלִּינִים, עָלַי, and שָׁמָעְתִּי
  rationale: The relative clause is recast into natural English while preserving repetition and opposition.
translation_notes:
  risk_flags:
  - risk: “Community” may sound broader than an assembled congregation.
    mitigation: The immediate context and the footnoted identity of Israel keep the collective reference clear.
  - risk: “Sons of Israel” may be mistaken as referring only to Jacob’s immediate sons.
    mitigation: The footnote explains that the phrase refers to the Israelites and preserves the POB’s gender-accurate choice.
