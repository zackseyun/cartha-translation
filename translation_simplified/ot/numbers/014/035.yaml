translation:
  language: en
  text: “I, Yahweh, have spoken. I will certainly[a] do this to this entire evil community that has banded together against me. They will come to their end in this wilderness, and there they will die.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses an oath-like expression to emphasize that this will certainly happen.
    reason: source_note
simplification_decisions:
- pob_phrase: Surely I will do this
  simplified_phrase: I will certainly do this
  preserved_meaning: God solemnly affirms that his judgment will happen.
  reasoning_layer_used: Lexical and theological decisions on the Hebrew oath formula אִם לֹא.
  rationale: Moving the emphasis after “will” gives the oath-like certainty in more natural English.
- pob_phrase: all this evil congregation
  simplified_phrase: this entire evil community
  preserved_meaning: God judges the whole assembled group as morally evil.
  reasoning_layer_used: Lexical and theological decisions on הָעֵדָה and הָרָעָה.
  rationale: “Community” is more familiar than “congregation” while keeping the corporate meaning.
- pob_phrase: who have gathered together against me
  simplified_phrase: that has banded together against me
  preserved_meaning: The community acted collectively in opposition to Yahweh.
  reasoning_layer_used: Lexical decision on הַנּוֹעָדִים עָלַי.
  rationale: “Banded together” clearly conveys both collective action and opposition.
translation_notes:
  risk_flags:
  - risk: “Community” may sound less formal than the judicial term “congregation.”
    mitigation: “Entire evil community” preserves the corporate scope and moral judgment.
