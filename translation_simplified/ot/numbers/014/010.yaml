simplification_decisions:
- pob_phrase: all the congregation
  simplified_phrase: the whole community
  preserved_meaning: The assembled people of Israel acted together as a group.
  reasoning_layer_used: POB lexical decision for כָּל הָעֵדָה
  rationale: “Whole community” is clearer modern English while preserving the collective sense.
- pob_phrase: said to stone them with stones
  simplified_phrase: said they should stone them
  preserved_meaning: The community called for Joshua and Caleb to be attacked by stoning, without explicitly adding death.
  reasoning_layer_used: POB lexical decisions for לִרְגּוֹם, אֹתָם, and בָּאֲבָנִים
  rationale: The verb “stone” already communicates the use of stones in natural English.
- pob_phrase: the glory of Yahweh appeared
  simplified_phrase: Yahweh’s glory appeared
  preserved_meaning: Yahweh visibly manifested his glorious presence.
  reasoning_layer_used: POB lexical and theological decisions for כְבוֹד יְהוָה and נִרְאָה
  rationale: The possessive form is easier to read without weakening the divine manifestation.
