translation:
  language: en
  text: Yahweh is slow to anger and full of steadfast love.[a] He forgives wrongdoing and rebellion, but he will certainly not declare the guilty innocent. He brings judgment for the wrongdoing of fathers upon their children, to the third and fourth generations.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Steadfast love” includes mercy and faithful covenant loyalty.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew describes God “visiting” the fathers’ wrongdoing on their children, a judicial image whose precise mechanism is not explained here.
    reason: source_note
simplification_decisions:
- pob_phrase: abundant in steadfast love
  simplified_phrase: full of steadfast love
  preserved_meaning: Yahweh possesses steadfast, covenant-faithful love in great measure.
  reasoning_layer_used: Lexical decision for רַב חֶסֶד
  rationale: “Full of” expresses abundance in more familiar English while retaining the key term “steadfast love.”
- pob_phrase: forgiving iniquity and transgression
  simplified_phrase: forgives wrongdoing and rebellion
  preserved_meaning: Yahweh forgives both moral crookedness and willful breach.
  reasoning_layer_used: Lexical decisions for עָוֺן and פָשַׁע
  rationale: Common words replace difficult religious terms while keeping the two kinds of sin distinct.
- pob_phrase: will by no means clear the guilty
  simplified_phrase: will certainly not declare the guilty innocent
  preserved_meaning: Yahweh does not acquit guilty people as though they were innocent.
  reasoning_layer_used: Lexical decision and doctrine realignment for וְנַקֵּה לֹא יְנַקֶּה
  rationale: The judicial sense and emphatic negation are made immediately understandable.
interpretive_expansions:
- pob_phrase: visiting the iniquity of fathers on children
  rendering: brings judgment for the wrongdoing of fathers upon their children
  claim: The visitation is a divine judicial response rather than mere observation.
  evidence:
  - The POB lexical rationale says פקד here brings consequences or punishment to bear.
  - The theological decision requires retaining divine judgment across generations.
  confidence: high
  alternatives_preserved:
  - The footnote retains the Hebrew image of “visiting.”
  - The precise mechanism of the judgment remains unresolved.
translation_notes:
  risk_flags:
  - risk: “Brings judgment” makes the judicial force more explicit than POB’s traditional image “visiting.”
    mitigation: A footnote preserves the source image and states that its precise mechanism is unexplained.
  - risk: The intergenerational statement may appear to conflict with texts on individual responsibility.
    mitigation: The wording preserves the source’s theological tension without harmonizing or softening it.
