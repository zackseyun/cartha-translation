simplification_decisions:
- pob_phrase: whom you said would become plunder
  simplified_phrase: the ones you said would be carried off as plunder
  preserved_meaning: The vulnerable children were expected to be taken by an enemy as spoils of war.
  reasoning_layer_used: Lexical decision for לָבַז and the military context
  rationale: “Carried off as plunder” makes the military image immediately understandable.
- pob_phrase: I will bring in
  simplified_phrase: I will bring your little ones into the land
  preserved_meaning: God will cause the little ones to enter the land.
  reasoning_layer_used: Lexical decision for וְהֵבֵיאתִי אֹתָם and immediate context
  rationale: Naming the people and destination removes an unclear English ellipsis.
- pob_phrase: they will know the land
  simplified_phrase: They will come to know the land
  preserved_meaning: They will know the land through direct experience.
  reasoning_layer_used: Lexical decision for וְיָדְעוּ
  rationale: “Come to know” keeps the Hebrew image while suggesting lived experience.
