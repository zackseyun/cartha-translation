translation:
  language: en
  text: Your sons will live as shepherds in the wilderness for forty years. They will bear the consequences of your acts of sexual unfaithfulness[a] until all your bodies lie dead in the wilderness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses sexual imagery for the people's covenant unfaithfulness to the LORD.
