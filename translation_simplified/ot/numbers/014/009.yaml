translation:
  language: en
  text: But do not rebel against Yahweh. Do not be afraid of the people who live in the land. They are our bread.[a] Their protection is gone,[b] and Yahweh is with us. Do not be afraid of them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew picture means they will be easily conquered, as food is consumed.
    reason: lexical_alternative
  - marker: b
    text: Literally, “their shadow has departed from over them”; here “shadow” means shelter or protection.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Only, do not rebel against Yahweh
  simplified_phrase: But do not rebel against Yahweh
  preserved_meaning: The opening strongly contrasts trust in Yahweh with rebellion against him.
  reasoning_layer_used: Lexical decision for אַךְ and immediate context
  rationale: “But” conveys the emphatic contrast without adding an exclusive object.
- pob_phrase: the people of the land
  simplified_phrase: the people who live in the land
  preserved_meaning: The command concerns the inhabitants of the land Israel is approaching.
  reasoning_layer_used: Lexical decision for עַם הָאָרֶץ
  rationale: The relative clause makes the Hebrew expression immediately clear.
- pob_phrase: their protection has departed from over them
  simplified_phrase: Their protection is gone
  preserved_meaning: The people no longer have the protective covering they possessed.
  reasoning_layer_used: Lexical and theological decisions for צִלָּם
  rationale: The shorter wording preserves the loss and protective sense without awkward phrasing.
