simplification_decisions:
- pob_phrase: are living in the valley
  simplified_phrase: live in the valley
  preserved_meaning: The two people groups continue to reside in the valley.
  reasoning_layer_used: Lexical decisions for יוֹשֵׁב and בָּעֵמֶק
  rationale: The simple present expresses ongoing residence in more direct English.
- pob_phrase: by the way of the Red Sea
  simplified_phrase: on the road to the Red Sea
  preserved_meaning: The people must travel the wilderness route leading toward the Red Sea.
  reasoning_layer_used: Lexical decision for דֶּרֶךְ יַם סוּף
  rationale: “On the road to” makes the route or direction clear without changing the place name.
- pob_phrase: set out for yourselves into the wilderness
  simplified_phrase: set out into the wilderness
  preserved_meaning: The command is directed emphatically to the people themselves.
  reasoning_layer_used: Lexical decisions for וּסְעוּ, לָכֶם, and הַמִּדְבָּר
  rationale: English already makes the command personal, so the awkward phrase “for yourselves” can be omitted.
translation_notes:
  risk_flags:
