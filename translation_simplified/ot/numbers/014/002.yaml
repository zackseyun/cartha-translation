translation:
  language: en
  text: All the sons of Israel[a] grumbled against Moses and Aaron. The whole congregation said to them, “If only we had died in the land of Egypt! If only we had died here in this wilderness!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The sons of Israel” refers here to the Israelites as a people.
    reason: simplification_note
simplification_decisions:
- pob_phrase: And all the sons of Israel grumbled against Moses and against Aaron
  simplified_phrase: All the sons of Israel grumbled against Moses and Aaron.
  preserved_meaning: The whole people directed their rebellious complaint at both leaders.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The shorter sentence keeps the gendered national title and the confrontational force of “grumbled against.”
- pob_phrase: and the whole congregation said to them
  simplified_phrase: The whole congregation said to them
  preserved_meaning: The assembled covenant community speaks collectively to Moses and Aaron.
  reasoning_layer_used: POB lexical decision for כָּל הָעֵדָה
  rationale: A new sentence makes the shift from grumbling to direct speech easier to follow.
- pob_phrase: Or if only we had died in this wilderness!
  simplified_phrase: If only we had died here in this wilderness!
  preserved_meaning: They express a second unrealized wish to have died where they now are.
  reasoning_layer_used: POB lexical decisions for לוּ, מָתְנוּ, and בַּמִּדְבָּר הַזֶּה
  rationale: Repeating “If only” preserves the lament, while “here” makes “this wilderness” immediately clear.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “sons of Israel” as referring only to males.
    mitigation: The footnote explains that it is the national designation for the Israelites as a people.
