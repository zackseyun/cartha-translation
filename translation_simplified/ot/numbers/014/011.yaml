translation:
  language: en
  text: Yahweh said to Moses, “How much longer will this people show contempt for me? How much longer will they continue not to believe in me,[a] even after all the signs I have done among them?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “trust me.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: How long will this people treat me with contempt?
  simplified_phrase: How much longer will this people show contempt for me?
  preserved_meaning: The people continue to reject Yahweh contemptuously.
  reasoning_layer_used: Lexical decision for יְנַאֲצֻנִי and the collective force of הָעָם הַזֶּה.
  rationale: “Show contempt” is clear modern English and keeps the rebuke's force.
- pob_phrase: And how long will they not believe in me
  simplified_phrase: How much longer will they continue not to believe in me
  preserved_meaning: Yahweh rebukes their continuing unbelief rather than an inability to believe.
  reasoning_layer_used: Lexical and theological decisions for לֹא יַאֲמִינוּ בִי.
  rationale: “Continue not to believe” preserves the ongoing, accusatory force without implying mere failure.
- pob_phrase: despite all the signs that I have done among them
  simplified_phrase: even after all the signs I have done among them
  preserved_meaning: Their unbelief continues in spite of Yahweh's signs among the people.
  reasoning_layer_used: Contextual lexical decisions for בְּכֹל הָאֹתוֹת and בְּקִרְבּוֹ.
  rationale: “Even after” makes the contrast immediately understandable.
translation_notes:
  risk_flags:
  - risk: “Continue not to believe” is less idiomatic than “still refuse to believe.”
    mitigation: It preserves POB's belief language and does not add an explicit claim of refusal.
