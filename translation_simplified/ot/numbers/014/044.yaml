translation:
  language: en
  text: But they defiantly went up to the top of the mountain. Yet the ark of Yahweh’s covenant and Moses stayed in the camp.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: they presumed to go up
  simplified_phrase: they defiantly went up
  preserved_meaning: Their ascent was willful and disobedient, not merely bold.
  reasoning_layer_used: Lexical and theological decisions for וַיַּעְפִּלוּ
  rationale: The documented alternative “defiantly” makes the moral force immediately clear.
- pob_phrase: did not move from the midst of the camp
  simplified_phrase: stayed in the camp
  preserved_meaning: Neither the ark nor Moses accompanied the people up the mountain.
  reasoning_layer_used: Lexical decision for לֹא מָשׁוּ מִקֶּרֶב הַמַּחֲנֶה
  rationale: The positive wording is more natural while preserving their location and lack of movement.
- pob_phrase: the ark of the covenant of Yahweh
  simplified_phrase: the ark of Yahweh’s covenant
  preserved_meaning: The ark is identified with the covenant belonging to Yahweh.
  reasoning_layer_used: Lexical decision for וַאֲרוֹן בְּרִית יְהוָה and divine-name doctrine
  rationale: The possessive form is easier to read and retains Yahweh’s personal name.
