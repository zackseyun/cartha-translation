translation:
  language: en
  text: You spied out the land for forty days. So you will bear the weight of your guilt for forty years—one year for each day, one year for each day. Then you will come to know my opposition.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “my alienation,” “my hostility,” or “my displeasure.”
