  text: They set out from Rameses in the first month, on the fifteenth day of that month. The day after the Passover, the Israelites[a] left openly and boldly, in full view of all the Egyptians.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “the sons of Israel.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew literally says “with a high hand,” an idiom for leaving openly and boldly.
    reason: cultural_note
