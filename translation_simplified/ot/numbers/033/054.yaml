translation:
  language: en
  text: Divide the land among your clans by lot. Give a larger group a larger share of land, and a smaller group a smaller share. Whatever area the lot assigns to a group will belong to that group. Receive your allotments according to your ancestral tribes.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: You shall apportion the land by lot according to your clans.
  simplified_phrase: Divide the land among your clans by lot.
  preserved_meaning: The land is distributed among the clans through the use of lots.
  reasoning_layer_used: POB lexical decisions for וְהִתְנַחַלְתֶּם, בְּגוֹרָל, and לְמִשְׁפְּחֹתֵיכֶם
  rationale: The direct wording preserves the lot’s full role in apportioning the land.
- pob_phrase: To the larger group you shall increase its inheritance, and to the smaller you shall reduce its inheritance.
  simplified_phrase: Give a larger group a larger share of land, and a smaller group a smaller share.
  preserved_meaning: More numerous groups receive more land, while less numerous groups receive less.
  reasoning_layer_used: POB lexical decisions for לָרַב, נַחֲלָה, and לַמְעַט
  rationale: “Share of land” makes the concrete inheritance clear while retaining the size-based rule.
- pob_phrase: You shall receive your inheritances according to the tribes of your fathers.
  simplified_phrase: Receive your allotments according to your ancestral tribes.
  preserved_meaning: The land allotments are received within divisions based on tribal ancestry.
  reasoning_layer_used: POB lexical decisions for תִּתְנֶחָלוּ and לְמַטּוֹת אֲבֹתֵיכֶם
  rationale: “Allotments” naturally expresses the concrete land distribution, and “ancestral tribes” clarifies its structure.
