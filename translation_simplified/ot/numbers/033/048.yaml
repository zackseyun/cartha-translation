translation:
  language: en
  text: They broke camp in the mountains of Abarim and traveled to the plains of Moab. There they camped beside the Jordan near Jericho.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the steppes of Moab.” The Hebrew can refer to plains or steppe-land.
    reason: lexical_alternative
  - marker: b
    text: Or “beside the Jordan opposite Jericho.” The Hebrew does not explicitly say “opposite,” but the location may be understood that way.
    reason: lexical_alternative
