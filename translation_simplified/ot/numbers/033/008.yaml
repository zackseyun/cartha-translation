translation:
  language: en
  text: They set out from the area in front of Hahiroth[a] and passed through the middle of the sea into the wilderness. Then they made a three-day journey in the wilderness of Etham and camped at Marah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Exodus usually calls this place Pi-hahiroth, but the Hebrew here has the shorter name Hahiroth.
    reason: source_note
simplification_decisions:
- pob_phrase: from before Hahiroth
  simplified_phrase: from the area in front of Hahiroth
  preserved_meaning: They departed from the location before Hahiroth without changing the name to Pi-hahiroth.
  reasoning_layer_used: POB lexical decision and source note for מִפְּנֵי הַחִירֹת
  rationale: Adding “area” makes the spatial phrase natural in modern English.
- pob_phrase: through the midst of the sea
  simplified_phrase: through the middle of the sea
  preserved_meaning: Their route went within the sea rather than beside it.
  reasoning_layer_used: POB lexical decision for בְּתוֹךְ הַיָּם
  rationale: “Middle” is more common than “midst” and preserves the image.
- pob_phrase: they went a three-day journey in the wilderness of Etham
  simplified_phrase: they made a three-day journey in the wilderness of Etham
  preserved_meaning: They traveled for the stated span within the named wilderness.
  reasoning_layer_used: POB lexical decisions for וַיֵּלְכוּ דֶּרֶךְ שְׁלֹשֶׁת יָמִים and בְּמִדְבַּר אֵתָם
  rationale: “Made” is natural English, while “in” retains the source’s locative wording.
