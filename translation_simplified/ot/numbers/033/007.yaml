translation:
  language: en
  text: After leaving Etham, they reversed direction[a] and went to Pi-hahiroth, across from Baal-zephon. They camped in front of Migdol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “returned,” but here it probably describes a change in their route.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: They set out from Etham
  simplified_phrase: After leaving Etham
  preserved_meaning: The Israelites broke camp at Etham and continued their journey.
  reasoning_layer_used: The lexical decision identifies the verb as the itinerary formula for breaking camp and moving on.
  rationale: “After leaving” gives the travel sequence in ordinary English.
- pob_phrase: turned back to Pi-hahiroth
  simplified_phrase: reversed direction and went to Pi-hahiroth
  preserved_meaning: They changed their route and traveled to Pi-hahiroth.
  reasoning_layer_used: The lexical decision favors a change of direction while retaining Pi-hahiroth as the destination.
  rationale: The new wording makes both the route change and destination immediately clear.
- pob_phrase: camped before Migdol
  simplified_phrase: camped in front of Migdol
  preserved_meaning: They made camp at a position facing or directly before Migdol.
  reasoning_layer_used: The lexical decision permits “in front of” as the spatial sense of the Hebrew phrase.
  rationale: “In front of” avoids the less familiar geographic use of “before.”
translation_notes:
  risk_flags:
  - risk: “Reversed direction” may sound more exact than the Hebrew verb by itself.
    mitigation: The footnote preserves “returned” and identifies a route change as the likely contextual sense.
