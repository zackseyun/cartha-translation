translation:
  language: en
  text: At Yahweh’s command, Moses recorded the places they set out from for each stage of their journey. These are their journey stages, identified by their starting places.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Hebrew deliberately reverses the wording: first the starting places in relation to the journeys, then the journeys in relation to the starting places.'
    reason: source_note
simplification_decisions:
- pob_phrase: their starting points according to their journeys
  simplified_phrase: the places they set out from for each stage of their journey
  preserved_meaning: Moses recorded the departure place connected with each successive journey stage.
  reasoning_layer_used: Lexical decisions for מוֹצָאֵיהֶם and לְמַסְעֵיהֶם
  rationale: Concrete wording explains both the departure places and their relation to the successive stages.
- pob_phrase: and these were their journeys according to their starting points
  simplified_phrase: These are their journey stages, identified by their starting places
  preserved_meaning: The coming itinerary presents the journey stages in relation to their departure places.
  reasoning_layer_used: Lexical rationale, footnote c, and doctrine-realignment revision
  rationale: The heading remains direct and preserves the reversed order without adding a claim about a record or list.
- pob_phrase: at the command of Yahweh
  simplified_phrase: At Yahweh’s command
  preserved_meaning: Moses made the record under Yahweh’s direction.
  reasoning_layer_used: Theological decision for יְהוָה and lexical decision for עַל־פִּי
  rationale: Moving the phrase first clarifies Yahweh’s authority while retaining the divine name.
