translation:
  language: en
  text: But if you do not drive out the people who live in the land, those you allow to remain will become barbs in your eyes and thorns in your sides.[a] They will harass you in the land where you live.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Barbs” may also be translated “sharp pricks,” and “thorns” may mean “hooks”; both images describe persistent, painful trouble.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the inhabitants of the land from before you
  simplified_phrase: the people who live in the land
  preserved_meaning: Israel must remove the land’s current inhabitants.
  reasoning_layer_used: POB lexical decisions for יֹשְׁבֵי הָאָרֶץ and מִפְּנֵיכֶם
  rationale: The spatial phrase is compressed because “drive out” already clearly expresses removal.
- pob_phrase: those whom you let remain from among them
  simplified_phrase: those you allow to remain
  preserved_meaning: The warning concerns inhabitants whom Israel permits to stay.
  reasoning_layer_used: POB lexical decision for תּוֹתִירוּ
  rationale: “Allow to remain” keeps the causative force in ordinary English.
- pob_phrase: and they will harass you on the land where you are living
  simplified_phrase: They will harass you in the land where you live.
  preserved_meaning: The remaining inhabitants will cause ongoing hostile trouble where Israel settles.
  reasoning_layer_used: POB lexical decisions for וְצָרֲרוּ and the final land clause
  rationale: A new sentence and natural English preposition make the warning easier to follow.
