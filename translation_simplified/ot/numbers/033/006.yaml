simplification_decisions:
- pob_phrase: They set out from Sukkoth
  simplified_phrase: They left Sukkoth
  preserved_meaning: They departed from Sukkoth as the next stage of their journey.
  reasoning_layer_used: The lexical decision identifies the verb as movement in a travel itinerary.
  rationale: “Left” states the same movement more directly.
- pob_phrase: and camped at Etham
  simplified_phrase: and set up camp at Etham
  preserved_meaning: They stopped and made camp at the place called Etham.
  reasoning_layer_used: The lexical decision defines the verb as making camp.
  rationale: “Set up camp” makes the action immediately clear.
- pob_phrase: which is at the edge of the wilderness
  simplified_phrase: at the edge of the wilderness
  preserved_meaning: Etham was located at the wilderness boundary.
  reasoning_layer_used: The lexical decisions retain the geographic sense of “edge” and the uncultivated-land sense of “wilderness.”
  rationale: Removing the relative clause shortens the sentence without losing location information.
