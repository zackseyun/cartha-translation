translation:
  language: en
  text: But if her father objects to her vow on the day he hears about it, none of her vows or other commitments she has made binding on herself will remain in force. The LORD will forgive her, because her father objected to it.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: forbids her
  simplified_phrase: objects to her vow
  preserved_meaning: Her father opposes the daughter's vow when he hears about it.
  reasoning_layer_used: Lexical decision for הֵנִיא and the immediate vow context.
  rationale: This identifies what he opposes without narrowing his action to preventing performance.
- pob_phrase: her binding obligations by which she has bound herself
  simplified_phrase: other commitments she has made binding on herself
  preserved_meaning: These are self-imposed commitments with binding force.
  reasoning_layer_used: Lexical decisions for וֶאֱסָרֶיהָ and אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ.
  rationale: This removes dense legal repetition while preserving self-binding commitments.
- pob_phrase: shall stand
  simplified_phrase: will remain in force
  preserved_meaning: The vows do not continue as valid obligations.
  reasoning_layer_used: Lexical decision for לֹא יָקוּם.
  rationale: This states the legal effect in clear modern English.
interpretive_expansions:
- pob_phrase: forbids her
  rendering: objects to her vow
  claim: The father's opposition is directed at the daughter's vow.
  evidence:
  - The verse concerns whether her vows remain binding.
  - The POB rationale says the verb denotes opposing or nullifying the vow.
  confidence: high
  alternatives_preserved:
