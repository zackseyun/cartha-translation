translation:
  language: en
  text: But if she is married to a husband,[a] while her vows still rest on her, or she has bound herself by a rash spoken commitment,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “she becomes a man’s wife.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may simply mean “a spoken commitment,” though it likely implies one made impulsively.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: she belongs to a husband
  simplified_phrase: she is married to a husband
  preserved_meaning: She is in the legal and covenantal relationship of marriage.
  reasoning_layer_used: POB lexical decision and footnote
  rationale: This avoids suggesting ownership while expressing the Hebrew marriage idiom clearly.
- pob_phrase: her vows are upon her
  simplified_phrase: her vows still rest on her
  preserved_meaning: The vows remain obligations upon her without yet deciding their legal validity.
  reasoning_layer_used: POB lexical rationale
  rationale: “Rest on her” keeps the Hebrew image of an obligation lying upon her.
- pob_phrase: a rash utterance of her lips by which she has bound herself
  simplified_phrase: she has bound herself by a rash spoken commitment
  preserved_meaning: Her impulsive words create a self-imposed obligation distinct from a formal vow.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The recast clause uses ordinary English while retaining both rash speech and self-binding.
