simplification_decisions:
- pob_phrase: the heads of the tribes of the sons of Israel
  simplified_phrase: the tribal heads of the sons of Israel
  preserved_meaning: Moses addressed the chiefs of Israel’s tribal divisions while retaining the Hebrew image of heads.
  reasoning_layer_used: POB lexical decisions for רָאשֵׁי הַמַּטּוֹת and לִבְנֵי יִשְׂרָאֵל
  rationale: “Tribal heads” is shorter and clearer while preserving both the leadership image and covenant expression.
- pob_phrase: saying
  simplified_phrase: He said
  preserved_meaning: Moses introduces the direct quotation.
  reasoning_layer_used: POB lexical decision for לֵאמֹר
  rationale: A separate sentence replaces the awkward participle with ordinary English.
- pob_phrase: This is the word that Yahweh has commanded
  simplified_phrase: This is what Yahweh has commanded
  preserved_meaning: The words that follow are Yahweh’s authoritative command.
  reasoning_layer_used: POB lexical decision and footnote for זֶה הַדָּבָר
