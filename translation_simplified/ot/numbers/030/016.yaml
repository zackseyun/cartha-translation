translation:
  language: en
  text: But if he does cancel her vows after he has already heard about them,[a] he will bear responsibility for her guilt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew strongly emphasizes that he cancels the vows.
    reason: simplification_note
  - marker: b
    text: This may also mean that he will bear the punishment resulting from her guilt.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: does indeed nullify them
  simplified_phrase: does cancel her vows
  preserved_meaning: He emphatically annuls the woman's vows.
  reasoning_layer_used: lexical decision and immediate context
  rationale: “Cancel” is clearer than “nullify,” while “does” and the note preserve the Hebrew emphasis.
- pob_phrase: after he has heard of them
  simplified_phrase: after he has already heard about them
  preserved_meaning: He cancels the vows only after gaining prior knowledge of them.
  reasoning_layer_used: lexical decision and doctrine realignment
  rationale: “Already” makes the prior-knowledge sequence easy to follow.
- pob_phrase: then he shall bear her guilt
  simplified_phrase: he will bear responsibility for her guilt
  preserved_meaning: The husband assumes liability for the wrong connected with the delayed cancellation.
  reasoning_layer_used: theological decision
  rationale: “Bear responsibility” clarifies the legal-moral idiom without removing the guilt language.
