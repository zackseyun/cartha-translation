translation:
  language: en
  text: But if her husband hears about it and, that same day, refuses to allow it, he cancels the vow that bound her or the promise she spoke[a] by which she bound herself. Then Yahweh will forgive her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “the binding utterance she spoke” or, possibly, “the rash promise she spoke.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: on the day her husband hears of it
  simplified_phrase: her husband hears about it and, that same day
  preserved_meaning: Her husband responds on the day he learns of the commitment.
  reasoning_layer_used: POB lexical decision for בְּיוֹם שְׁמֹעַ
  rationale: The ordinary time expression preserves the Hebrew idiom’s temporal force.
- pob_phrase: he forbids her and annuls her vow that is upon her
  simplified_phrase: refuses to allow it, he cancels the vow that bound her
  preserved_meaning: He disallows the vow and removes its binding force.
  reasoning_layer_used: POB lexical decisions for יָנִיא, וְהֵפֵר, and אֲשֶׁר עָלֶיהָ
  rationale: Common wording preserves both his refusal and the vow’s cancellation.
- pob_phrase: the rash utterance of her lips
  simplified_phrase: the promise she spoke
  preserved_meaning: The phrase refers to a spoken commitment by which she obligated herself.
  reasoning_layer_used: POB lexical and theological decisions for מִבְטָא שְׂפָתֶיהָ
  rationale: Neutral wording avoids presenting the uncertain impulsive nuance as settled.
translation_notes:
  risk_flags:
