translation:
  language: en
  text: But if her husband does cancel them on the day he hears about them, then none of the commitments she made with her lips—whether vows or obligations she placed on herself—will remain in force. Her husband has canceled them, and the LORD will forgive her.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: indeed annuls them
  simplified_phrase: does cancel them
  preserved_meaning: The husband decisively makes the commitments invalid.
  reasoning_layer_used: Lexical decision for הָפֵר יָפֵר
  rationale: The emphatic “does” preserves the Hebrew intensification in common English.
- pob_phrase: nothing that came from her lips
  simplified_phrase: none of the commitments she made with her lips
  preserved_meaning: Every spoken commitment covered by the legal expression is included.
  reasoning_layer_used: Lexical decision and footnote for כָּל מוֹצָא שְׂפָתֶיהָ
  rationale: This identifies the legal sense while retaining the concrete image of her lips.
- pob_phrase: shall stand
  simplified_phrase: will remain in force
  preserved_meaning: Her vows and obligations are no longer legally binding.
  reasoning_layer_used: Lexical decision for לֹא יָקוּם
  rationale: The legal effect is clearer than the opaque idiom “stand.”
translation_notes:
  risk_flags:
  - risk: “Cancel” may sound less legal than “annul.”
    mitigation: “Will remain in force” preserves the decisive legal effect.
  - risk: The record is inconsistent between “Yahweh” and “the LORD.”
    mitigation: The lexical decision names “the LORD” as the standard rendering of YHWH.
