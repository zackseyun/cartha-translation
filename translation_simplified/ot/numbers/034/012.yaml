translation:
  language: en
  text: Then the border will go down to the Jordan River and end at the Salt Sea.[a][b] This will be your land, with these borders on every side.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “its extremities will be at the Salt Sea.” The Hebrew can refer to the border’s terminal points.
    reason: lexical_alternative
  - marker: b
    text: The Salt Sea is commonly called the Dead Sea.
    reason: cultural_note
simplification_decisions:
- pob_phrase: shall go down to the Jordan
  simplified_phrase: will go down to the Jordan River
  preserved_meaning: The border line moves toward the Jordan.
  reasoning_layer_used: lexical decision for וְיָרַד and הַיַּרְדֵּנָה
  rationale: “Will” is more natural than legal “shall,” and “River” helps unfamiliar readers identify the Jordan.
- pob_phrase: and its end shall be at the Salt Sea
  simplified_phrase: and end at the Salt Sea
  preserved_meaning: The border terminates at the Salt Sea.
  reasoning_layer_used: lexical decision for תוֹצְאֹתָיו and יָם הַמֶּלַח
  rationale: The clause becomes a direct verb phrase while the footnote preserves the possible sense “extremities.”
- pob_phrase: according to its borders all around
  simplified_phrase: with these borders on every side
  preserved_meaning: The stated boundaries define the land on all sides.
  reasoning_layer_used: lexical decision for לִגְבֻלֹתֶיהָ סָבִיב
  rationale: The concrete wording removes the awkward phrase “according to” without changing the boundary sense.
translation_notes:
  risk_flags:
  - risk: Changing “shall” to “will” may sound less formally prescriptive.
    mitigation: The future description of the assigned border remains clear in context.
  - risk: Using singular “end” in the main text may understate the Hebrew term’s possible plural or extremity sense.
    mitigation: Footnote a preserves the documented lexical alternative.
