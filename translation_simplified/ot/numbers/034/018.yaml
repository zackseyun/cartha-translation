simplification_decisions:
- pob_phrase: you shall take
  simplified_phrase: choose
  preserved_meaning: The people are commanded to select designated leaders.
  reasoning_layer_used: The lexical decision identifies the verb as a command to the plural audience.
  rationale: “Choose” expresses the intended action in natural modern English.
- pob_phrase: one leader from each tribe
  simplified_phrase: one leader from each tribe
  preserved_meaning: Exactly one representative is selected for every tribe.
  reasoning_layer_used: The lexical audit explains the repeated Hebrew wording as distributive.
  rationale: This clear English phrase preserves the one-per-tribe requirement.
- pob_phrase: to inherit the land
  simplified_phrase: to assign the land as an inheritance
  preserved_meaning: The leaders are appointed to allot Israel’s inherited land.
  reasoning_layer_used: The immediate context and lexical rationale favor the administrative causative sense.
  rationale: This wording prevents readers from mistaking the leaders for the land’s recipients.
