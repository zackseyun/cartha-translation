translation:
  language: en
  text: The border will run downhill from Shepham to Riblah, east of Ain.[a] It will then continue downhill until it reaches the slope[b] on the east side of the Sea of Kinnereth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be translated “on the east side of Ain.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew literally calls this slope the sea’s “shoulder.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: shall go down
