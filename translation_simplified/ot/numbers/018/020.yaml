  reasoning_layer_used: Lexical decisions for בְּאַרְצָם and תִנְחָל
  rationale: The rewrite supplies the understood object and uses ordinary English word order.
- pob_phrase: and no portion shall be yours among them
  simplified_phrase: nor will you receive a share of it among them
  preserved_meaning: Aaron will have no allotted share of the land among Israel.
  reasoning_layer_used: Lexical decisions for חֵלֶק and בְּתוֹכָם
  rationale: “Nor” preserves the reinforcing denial while “receive a share” clarifies the allotment.
- pob_phrase: I am your portion and your inheritance
  simplified_phrase: I am your portion and your inheritance
  preserved_meaning: Yahweh himself is Aaron's covenantal provision in place of a land inheritance.
  reasoning_layer_used: Lexical and theological center identified in the POB audit
  rationale: The linked inheritance terms remain because they carry the verse's central theological claim.
