translation:
  language: en
  text: Yahweh said to Aaron, “You will not inherit any of their land, nor will you receive a share of it among them. I am your portion and your inheritance among the sons of Israel.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sons of Israel” can also be translated “people of Israel” or “Israelites.”
    reason: lexical_alternative
