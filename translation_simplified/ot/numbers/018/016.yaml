translation_notes:
  risk_flags:
  - risk: Readers may confuse these shekels with modern currency.
    mitigation: The main text calls the sanctuary shekel a weight standard, and the footnote identifies both units as ancient weights.
  - risk: “For the assessed value” does not explicitly name the priest as assessor.
    mitigation: It preserves the POB’s legal valuation without adding an uncertain title to the verse.
