translation:
  language: en
  text: 'When each firstborn person who must be redeemed is one month old, you must redeem that person for the assessed value: five shekels of silver, using the sanctuary shekel as the standard weight.[a] One shekel equals twenty gerahs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Shekels and gerahs were ancient units of weight used to measure silver.
    reason: cultural_note
simplification_decisions:
- pob_phrase: those to be redeemed from a month old
  simplified_phrase: When each firstborn person who must be redeemed is one month old
  preserved_meaning: The generic legal instruction concerns redeemable human firstborn beginning at one month of age.
  reasoning_layer_used: lexical decisions for וּפְדוּיָו and מִבֶּן חֹדֶשׁ, with immediate context
  rationale: Naming the firstborn person makes the legal subject and age threshold clear.
- pob_phrase: according to your valuation
  simplified_phrase: for the assessed value
  preserved_meaning: The required payment follows the valuation addressed to the priest.
  reasoning_layer_used: lexical decision for בְּעֶרְכְּךָ
  rationale: The passive wording states the legal assessment naturally without changing its force.
- pob_phrase: by the sanctuary shekel; it is twenty gerahs
  simplified_phrase: using the sanctuary shekel as the standard weight. One shekel equals twenty gerahs.
  preserved_meaning: The sanctuary shekel is the required weight standard, and that shekel consists of twenty gerahs.
  reasoning_layer_used: lexical decisions for בְּשֶׁקֶל הַקֹּדֶשׁ and עֶשְׂרִים גֵּרָה הוּא
  rationale: The wording retains the named standard and replaces the unclear pronoun with its referent.
