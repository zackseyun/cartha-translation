- pob_phrase: shall keep your priesthood
  simplified_phrase: must guard your priestly duties
  preserved_meaning: They must protect and faithfully carry out the priestly office entrusted to them.
  reasoning_layer_used: POB lexical decision for תִּשְׁמְרוּ and כְּהֻנַּתְכֶם
  rationale: “Guard” restores the custodial force, while “priestly duties” makes the responsibility immediately clear.
- pob_phrase: for what is within the veil
  simplified_phrase: everything behind the sanctuary curtain
  preserved_meaning: Their responsibility includes the sacred area on the inner side of the curtain.
  reasoning_layer_used: POB lexical decision for וּלְמִבֵּית לַפָּרֹכֶת
  rationale: “Sanctuary curtain” explains the ritual object while preserving its physical boundary image.
- pob_phrase: I give your priesthood as a gift of service
  simplified_phrase: I give you the priesthood as a gift so that you may serve
  preserved_meaning: God grants the priesthood as a gift that is expressed through service.
  reasoning_layer_used: POB lexical and theological decisions for עֲבֹדַת מַתָּנָה
  rationale: The compressed Hebrew relationship is recast as natural English without losing either gift or service.
