translation:
  language: en
  text: But you and your sons must guard your priestly duties. You are responsible for everything concerning the altar and everything behind the sanctuary curtain, and you must perform this service. I give you the priesthood as a gift so that you may serve.[a] But anyone not authorized for priestly service who comes near must be put to death.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may instead emphasize that the service itself is the gift.
    reason: lexical_alternative
