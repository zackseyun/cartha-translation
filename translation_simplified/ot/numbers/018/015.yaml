translation:
  language: en
  text: The first offspring to open any womb, whether human or animal, that is presented to Yahweh will belong to you. But you must redeem[a] every firstborn human, and you must also redeem every firstborn animal considered unclean.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “redeem” means to secure the firstborn’s release by making the required payment.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Every firstborn that opens the womb, of all flesh
  simplified_phrase: The first offspring to open any womb, whether human or animal
  preserved_meaning: This keeps both the firstborn scope and the Hebrew image of opening the womb.
  reasoning_layer_used: Lexical decisions for פֶּטֶר רֶחֶם and כָּל ... לְכָל בָּשָׂר
  rationale: “First offspring” and “any womb” express the comprehensive idiom in ordinary English.
- pob_phrase: that they present to Yahweh
  simplified_phrase: that is presented to Yahweh
  preserved_meaning: The offering is brought to Yahweh without identifying the unstated plural subject.
  reasoning_layer_used: Source syntax and lexical decision for אֲשֶׁר יַקְרִיבוּ לַיהוָה
  rationale: The passive wording avoids adding “the people” while remaining natural English.
- pob_phrase: you must surely redeem the firstborn of man ... and ... the firstborn of the unclean beast
  simplified_phrase: you must redeem every firstborn human ... and ... every firstborn animal considered unclean
  preserved_meaning: Both groups remain under an emphatic obligation to be redeemed rather than offered.
  reasoning_layer_used: Lexical and theological decisions for פָּדֹה תִפְדֶּה and בְּכוֹר הַבְּהֵמָה הַטְּמֵאָה
  rationale: Repeated “must redeem” preserves the command’s force while clarifying the ritual category.
interpretive_expansions:
- pob_phrase: redeem
  rendering: secure the firstborn’s release by making the required payment
  claim: Redemption here releases the firstborn through the required payment.
  evidence:
  - The immediate context gives a redemption price for human firstborn in Numbers 18:16.
  confidence: high
translation_notes:
  risk_flags:
  - risk: “Will belong to you” could suggest permanent priestly ownership of firstborn humans.
    mitigation: The immediate command to redeem every firstborn human preserves the verse’s qualification.
