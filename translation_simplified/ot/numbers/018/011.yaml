  preserved_meaning: A portion of their gifts is designated for sacred use.
  reasoning_layer_used: POB lexical decision and lexical-alternative footnote for תְּרוּמַת
  rationale: The wording explains the unfamiliar offering term without losing its sacred function.
- pob_phrase: to your sons and your daughters with you
  simplified_phrase: to you and to your sons and daughters
  preserved_meaning: Aaron and both his male and female children receive these offerings.
  reasoning_layer_used: POB lexical decision for וּלְבָנֶיךָ וְלִבְנֹתֶיךָ אִתָּךְ
  rationale: Natural English preserves the explicit inclusion of sons and daughters.
- pob_phrase: Everyone in your house who is clean
  simplified_phrase: Anyone in your household who is ritually clean
  preserved_meaning: Permission is limited to ritually eligible members of Aaron’s household.
  reasoning_layer_used: POB theological decision on ritual purity and lexical decision for בְּבֵיתְךָ
  rationale: The revision prevents readers from mistaking ritual status for physical cleanliness.
