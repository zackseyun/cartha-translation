translation:
  language: en
  text: 'This also belongs to you: the part of the sons of Israel’s gifts that is set apart for sacred use, together with all their wave offerings. I have given these offerings to you and to your sons and daughters. This is a permanent rule. Anyone in your household who is ritually clean may eat them.'
