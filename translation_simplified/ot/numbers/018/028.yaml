translation:
  language: en
  text: In the same way, you too must set apart a contribution for Yahweh from all the tithes you receive from the sons of Israel.[a] From those tithes, give Yahweh’s contribution to Aaron the priest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Israelites.” The Hebrew expression is literally “sons of Israel.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: So you also shall present
  simplified_phrase: In the same way, you too must set apart
  preserved_meaning: The Levites must follow the corresponding command by dedicating a portion to Yahweh.
  reasoning_layer_used: Lexical decision for כֵּן, תָּרִימוּ, and גַם אַתֶּם
  rationale: The new wording makes the connection, emphasis, and required ritual action immediately clear.
- pob_phrase: from all your tithes, which you receive
  simplified_phrase: from all the tithes you receive
  preserved_meaning: The contribution must come from every tithe the Levites receive.
  reasoning_layer_used: Lexical decision for מִכֹּל מַעְשְׂרֹתֵיכֶם and contextual reading of תִּקְחוּ
  rationale: Removing the possessive and relative-clause pause gives the same administrative instruction in natural English.
- pob_phrase: and from it you shall give Yahweh’s contribution
  simplified_phrase: From those tithes, give Yahweh’s contribution
  preserved_meaning: A portion of the received tithes is to be given as Yahweh’s dedicated contribution.
  reasoning_layer_used: Lexical decision for וּנְתַתֶּם מִמֶּנּוּ and תְּרוּמַת יְהוָה
  rationale: Naming the tithes again makes the partitive reference clear without changing its scope.
translation_notes:
  risk_flags:
  - risk: “Set apart” may sound less ceremonial than “present.”
    mitigation: “A contribution for Yahweh” retains the act of formally dedicating the portion.
  - risk: “Sons of Israel” may be mistaken as referring only to male individuals.
    mitigation: The footnote gives “the Israelites” while preserving the source-driven covenant expression in the text.
