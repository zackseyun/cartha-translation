translation:
  language: en
  text: 'Then Yahweh said to Aaron, “Know this: I myself have put you in charge of the contributions offered to me—all the holy gifts from the sons of Israel. I have given these gifts to you as the share that belongs to you because you are the anointed priest.[a] They are also for your sons. This is a permanent law.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be translated “for anointing,” but it most likely refers to Aaron’s share by virtue of his anointed priestly office.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And I, behold, I have given you the charge
  simplified_phrase: 'Know this: I myself have put you in charge'
  preserved_meaning: Yahweh emphatically calls attention to the responsibility he has entrusted to Aaron.
  reasoning_layer_used: Lexical decisions for וַאֲנִי הִנֵּה, נָתַתִּי לְךָ, and מִשְׁמֶרֶת.
  rationale: The new wording expresses the emphasis and assigned responsibility in ordinary English.
- pob_phrase: my contributions, all the holy gifts
  simplified_phrase: the contributions offered to me—all the holy gifts
  preserved_meaning: The consecrated contributions from Israel belong to Yahweh and are entrusted to Aaron.
  reasoning_layer_used: Lexical decisions for תְּרוּמֹתַי and קָדְשֵׁי.
  rationale: Adding “offered to me” makes the possessive relationship immediately clear.
- pob_phrase: as your anointing portion, and to your sons as a permanent statute
  simplified_phrase: as the share that belongs to you because you are the anointed priest. They are also for your sons. This is a permanent law.
  preserved_meaning: Aaron receives the gifts through his anointed office, and the enduring grant extends to his sons.
  reasoning_layer_used: Theological decision for לְמָשְׁחָה and lexical decision for לְחָק עוֹלָם.
  rationale: Short sentences explain the priestly entitlement while retaining the law’s enduring force.
