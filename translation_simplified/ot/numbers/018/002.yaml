translation:
  language: en
  text: Also bring your brothers—the tribe of Levi, your father’s tribe—near to you. They are to join you[a] and serve you while you and your sons are before the tent of the testimony.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew for “join” can also mean “be attached to” and echoes the name Levi.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says “tent of the testimony,” not the more familiar “tent of meeting.”
    reason: alternative_reading
