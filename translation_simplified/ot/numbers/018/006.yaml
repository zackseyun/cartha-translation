translation:
  language: en
  text: 'Now see: I myself have taken your brothers, the Levites, from among the sons of Israel. I have given them to you as a gift. They are given to Yahweh to carry out the service at the tent of meeting.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And I—behold, I have taken
  simplified_phrase: 'Now see: I myself have taken'
  preserved_meaning: God strongly emphasizes his own action while continuing his speech.
  reasoning_layer_used: POB lexical decisions for וַאֲנִי and הִנֵּה
  rationale: The direct wording keeps the solemn emphasis without the archaic “behold.”
- pob_phrase: given to you as a gift, given to Yahweh
  simplified_phrase: I have given them to you as a gift. They are given to Yahweh
  preserved_meaning: The Levites are both God's gift to Aaron and his sons and people given to Yahweh.
  reasoning_layer_used: POB lexical decisions for לָכֶם, מַתָּנָה, נְתֻנִים, and לַיהוָה
  rationale: Two short sentences clarify the two relationships while preserving the repeated giving language.
- pob_phrase: to perform the service of the tent of meeting
  simplified_phrase: to carry out the service at the tent of meeting
  preserved_meaning: The Levites are appointed to fulfill the sacred service associated with the tent of meeting.
  reasoning_layer_used: POB lexical decision for עֲבֹדַת אֹהֶל מוֹעֵד and applied revision
  rationale: “Carry out” is natural modern English, while “service” retains the verse's cultic sense.
translation_notes:
  risk_flags:
  - risk: Modern readers may mistake “brothers” for literal siblings.
    mitigation: The appositive “the Levites” identifies them as Aaron's tribal kin.
  - risk: “Sons of Israel” is less natural than “Israelites” in modern English.
    mitigation: It is retained because the POB theological decision deliberately preserves the Hebrew masculine form.
