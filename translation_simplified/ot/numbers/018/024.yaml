translation:
  language: en
  text: I have given the Levites the Israelites’ tithe—the tenth share they lift up to the LORD as a contribution. This tithe is the Levites’ inheritance. That is why I said, “They will not receive an inheritance of land among the Israelites.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the tithe of the children of Israel
  simplified_phrase: the Israelites’ tithe—the tenth share
  preserved_meaning: The required tenth given by Israel remains the gift assigned to the Levites.
  reasoning_layer_used: source text and POB translation
  rationale: The brief explanation makes the biblical term “tithe” understandable without replacing it.
- pob_phrase: which they lift up to the LORD as a contribution
  simplified_phrase: they lift up to the LORD as a contribution
  preserved_meaning: The contribution retains the source-driven image of being lifted up to the LORD.
  reasoning_layer_used: applied revision
  rationale: The wording keeps “lift up,” which the latest doctrinal review specifically restored.
- pob_phrase: therefore I have said to them
  simplified_phrase: That is why I said
  preserved_meaning: The Levites’ tithe explains the following declaration about their inheritance.
  reasoning_layer_used: POB syntax and immediate context
  rationale: A shorter causal sentence makes the logic easier to follow.
interpretive_expansions:
- pob_phrase: they shall have no inheritance
  rendering: They will not receive an inheritance of land
  claim: The inheritance denied to the Levites is a territorial share among Israel, not the tithe just given as their inheritance.
  evidence:
  - The verse contrasts the tithe given as the Levites’ inheritance with the inheritance they do not receive among Israel.
  - The phrase “among the Israelites” points to their share within Israel’s allotted territory.
  confidence: high
  alternatives_preserved:
  - They will receive no inheritance among the Israelites.
translation_notes:
  risk_flags:
  - risk: Adding “of land” makes the contextual sense more explicit than the POB wording.
    mitigation: The wording is limited to the inheritance contrasted with the tithe and received among Israel.
