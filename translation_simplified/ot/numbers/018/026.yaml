translation:
  language: en
  text: 'Speak to the Levites and tell them: “When you receive from the sons of Israel the tithe—the required tenth—that I have given you as your inheritance, you must present one tenth of that tithe as Yahweh’s contribution.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And to the Levites you shall speak and say to them
  simplified_phrase: Speak to the Levites and tell them
  preserved_meaning: Both verbs in the Hebrew instruction formula remain as direct commands.
  reasoning_layer_used: POB lexical decision for תְּדַבֵּר ... וְאָמַרְתָּ
  rationale: The reordered clause sounds natural while preserving the two-part command.
- pob_phrase: When you take from the sons of Israel the tithe
  simplified_phrase: When you receive from the sons of Israel the tithe—the required tenth
  preserved_meaning: The Levites receive the required tenth contributed by the sons of Israel.
  reasoning_layer_used: POB lexical decisions for כִּי תִקְחוּ, בְּנֵי יִשְׂרָאֵל, and הַמַּעֲשֵׂר
  rationale: “Receive” clarifies the transaction, and the brief apposition explains “tithe.”
- pob_phrase: then you shall present from it Yahweh’s contribution, a tithe from the tithe
  simplified_phrase: you must present one tenth of that tithe as Yahweh’s contribution
  preserved_meaning: The Levites must set apart for Yahweh a tenth of the tithe they receive.
  reasoning_layer_used: POB lexical and theological decisions for וַהֲרֵמֹתֶם, תְּרוּמַת יְהוָה, and מַעֲשֵׂר מִן הַמַּעֲשֵׂר
  rationale: The amount and purpose are stated directly without losing the act of presentation or Yahweh’s name.
