  rationale: Removing repeated possessives makes the list easier to follow while retaining each offering type.
- pob_phrase: It is most holy for you and for your sons
  simplified_phrase: These portions are most holy and belong to you and your sons
  preserved_meaning: The portions have the highest sacrificial holiness status and are assigned to Aaron and his male priestly descendants.
