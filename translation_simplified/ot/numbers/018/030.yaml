translation:
  language: en
  text: Say to the Levites, “When you present the best part[a] of the tithe as a contribution, the tithe will be credited to you as your own produce, like grain from a threshing floor or wine from a winepress.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally “its fat,” an expression meaning its richest or best portion.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And you shall say to them
  simplified_phrase: Say to the Levites
  preserved_meaning: Moses is directly instructed to address the Levites.
  reasoning_layer_used: Immediate context and lexical decision
  rationale: The direct command is clearer, and the preceding context identifies the audience.
- pob_phrase: When you lift up its best part from it
  simplified_phrase: When you present the best part of the tithe as a contribution
  preserved_meaning: The Levites must set apart and present the choicest portion of the tithe.
  reasoning_layer_used: Lexical decisions for בַּהֲרִימְכֶם, חֶלְבּוֹ, and מִמֶּנּוּ
  rationale: “Present as a contribution” explains the offering idiom while the footnote preserves the Hebrew image.
- pob_phrase: it shall be counted to the Levites as the produce
  simplified_phrase: the tithe will be credited to you as your own produce
  preserved_meaning: The tithe is legally regarded as the Levites’ produce.
  reasoning_layer_used: Lexical decision for וְנֶחְשַׁב and immediate context
  rationale: “Credited” retains the accounting sense while making the Levites’ relation to the produce explicit.
