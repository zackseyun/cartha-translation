translation:
  language: en
  text: I have given you, your sons, and your daughters all the contributions from the holy offerings that the Israelites lift up to the LORD. This is a permanent statute. It is a covenant of salt[a] before the LORD, lasting forever for you and your descendants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A “covenant of salt” is a binding covenant meant to endure.
    reason: cultural_note
