translation:
  language: en
  text: Then Yahweh said to Aaron, “You, your sons, and your father’s family together will bear the iniquity connected with the sanctuary.[a] You and your sons together will bear the iniquity connected with your priesthood.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may mean bearing the guilt for offenses against the sanctuary or being responsible for them.
    reason: lexical_alternative
  - marker: b
    text: This may mean bearing the guilt for offenses connected with the priesthood or being responsible for them.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: your father’s house with you
  simplified_phrase: your father’s family together
  preserved_meaning: Aaron’s wider paternal family shares this responsibility with him.
  reasoning_layer_used: lexical decision for בֵית אָבִיךָ and אִתָּךְ
  rationale: “Family” prevents readers from mistaking the Hebrew kinship expression for a building.
- pob_phrase: shall bear
  simplified_phrase: will bear
  preserved_meaning: The statement assigns an obligation or liability to Aaron and those with him.
  reasoning_layer_used: lexical decision for תִּשְׂאוּ
  rationale: “Will” is natural modern English while “bear” retains the theological image.
- pob_phrase: the iniquity of the sanctuary / your priesthood
  simplified_phrase: the iniquity connected with the sanctuary / your priesthood
  preserved_meaning: The iniquity concerns offenses arising within these sacred responsibilities.
  reasoning_layer_used: POB footnotes and theological decision on bearing iniquity
  rationale: “Connected with” clarifies the relationship without choosing between guilt and responsibility.
