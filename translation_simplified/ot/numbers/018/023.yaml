translation:
  language: en
  text: The Levite himself must carry out the service of the tent of meeting, and the Levites must bear their iniquity.[a] This is a permanent law for every generation. Among the sons of Israel, the Levites will receive no share of inherited land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “bear their guilt.” The Hebrew expression can include guilt, iniquity, or the responsibility and consequences connected with it.
    reason: lexical_alternative
