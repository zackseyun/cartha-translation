translation:
  language: en
  text: 'Gad’s descendants, by their clans: the Zephonite clan, descended from Zephon; the Haggite clan, descended from Haggi; and the Shunite clan, descended from Shuni.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some English traditions use “Ziphon” and “Ziphonites” here, as in Genesis 46:16. The Hebrew text of this verse reads “Zephon,” so that name is used here.
    reason: textual_variant
