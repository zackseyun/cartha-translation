  text: 'Amram’s wife was named Jochebed. She was a daughter of Levi[a] and was born to him in Egypt.[b] She gave birth to Amram’s children: Aaron and Moses, and their sister Miriam.'
  philosophy: optimal-equivalence
  footnotes:
