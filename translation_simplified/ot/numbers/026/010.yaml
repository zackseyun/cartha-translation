translation:
  language: en
  text: The earth[a] opened its mouth and swallowed them and Korah. This happened when the gathered group died and the fire consumed 250 men. They[b] became a warning sign.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the land.”
    reason: lexical_alternative
  - marker: b
    text: “They” may refer especially to the judged rebels or to the 250 men.
    reason: simplification_note
simplification_decisions:
- pob_phrase: and the earth opened its mouth and swallowed them and Korah, when the congregation died, when the fire consumed two hundred fifty men
  simplified_phrase: The earth opened its mouth and swallowed them and Korah. This happened when the gathered group died and the fire consumed 250 men.
  preserved_meaning: The swallowing and the deadly fire remain connected in time without changing who the verse names.
  reasoning_layer_used: POB syntax and lexical decisions
  rationale: Two sentences clarify the dense chain of temporal clauses.
- pob_phrase: the congregation
  simplified_phrase: the gathered group
  preserved_meaning: The phrase identifies an assembled company rather than an unspecified group.
  reasoning_layer_used: POB lexical decision for עֵדָה
  rationale: “Gathered group” is plain English and preserves the idea of an assembled company.
- pob_phrase: two hundred fifty men
  simplified_phrase: 250 men
  preserved_meaning: The exact number and male reference remain unchanged.
  reasoning_layer_used: POB lexical decision for חֲמִשִּׁים וּמָאתַיִם אִישׁ
  rationale: Digits make the number quicker to read.
