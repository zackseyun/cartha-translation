translation:
  language: en
  text: A total of 23,000 males were counted among them, from one month old and older. They were not counted among the sons of Israel, because they were not given an inheritance among the sons of Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew phrase rendered “sons of Israel” can also be translated “Israelites.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: those counted from among them were twenty-three thousand, every male
  simplified_phrase: A total of 23,000 males were counted among them
  preserved_meaning: The census included 23,000 males from this group.
  reasoning_layer_used: Lexical decisions for פְקֻדֵיהֶם, the number, and כָּל זָכָר
  rationale: The total-first wording is more natural while keeping the census meaning and male designation.
- pob_phrase: from a month old and upward
  simplified_phrase: from one month old and older
  preserved_meaning: The count included every male beginning at one month of age.
  reasoning_layer_used: Lexical decision for מִבֶּן חֹדֶשׁ וָמָעְלָה
  rationale: Modern age wording makes the threshold immediately clear.
- pob_phrase: because no inheritance was given to them
  simplified_phrase: because they were not given an inheritance
  preserved_meaning: They received no inheritance among the sons of Israel.
  reasoning_layer_used: Lexical decision for נִתַּן לָהֶם נַחֲלָה
  rationale: The active English clause is easier to follow without changing the passive sense of receiving no allotment.
translation_notes:
