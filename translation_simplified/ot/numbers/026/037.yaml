translation:
  language: en
  text: The registered total for Ephraim’s clans was 32,500. These are Joseph’s descendants, according to their clans.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses “sons of Ephraim” and “sons of Joseph” as genealogical terms for their descendants.
    reason: simplification_note
simplification_decisions:
- pob_phrase: the clans of the sons of Ephraim
  simplified_phrase: Ephraim’s clans
  preserved_meaning: The registered clans are kinship groups descended from Ephraim.
  reasoning_layer_used: POB lexical decisions for מִשְׁפְּחֹת and בְּנֵי אֶפְרַיִם
  rationale: The possessive form clearly preserves both the clans and their lineage.
- pob_phrase: 'according to those numbered of them: thirty-two thousand and five hundred'
  simplified_phrase: The registered total ... was 32,500
  preserved_meaning: The number is the official census total of those enrolled.
  reasoning_layer_used: POB lexical decision and footnote for לִפְקֻדֵיהֶם
  rationale: This states the census result directly without implying a total population count.
- pob_phrase: the sons of Joseph according to their clans
  simplified_phrase: Joseph’s descendants, according to their clans
  preserved_meaning: The closing statement identifies Joseph’s lineage by its clan divisions.
  reasoning_layer_used: POB lexical decisions for בְנֵי יוֹסֵף and לְמִשְׁפְּחֹתָם
  rationale: “Descendants” clarifies the genealogy while the closing clan formula remains intact.
interpretive_expansions:
- pob_phrase: according to those numbered of them
  rendering: The registered total
  claim: The numbering refers to official census registration.
  evidence:
