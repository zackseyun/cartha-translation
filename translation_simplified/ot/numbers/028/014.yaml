translation:
  language: en
  text: For the wine poured out as an offering, use half a hin[a] for the bull, one-third of a hin for the ram, and one-fourth of a hin for the lamb. These drink offerings accompany the monthly burnt offering, presented each month throughout the year.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A hin was an ancient liquid measure of approximately four liters.
    reason: cultural_note
  - marker: b
    text: Or, “This is the burnt offering of the new moon in its month, for the months of the year.”
    reason: lexical_alternative
