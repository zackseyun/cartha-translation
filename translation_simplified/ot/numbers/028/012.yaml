  text: For each bull, also bring a grain offering of three-tenths of an ephah of fine flour mixed with oil. For the ram, bring two-tenths of an ephah of fine flour mixed with oil as a grain offering.[a]
  philosophy: optimal-equivalence
  footnotes:
