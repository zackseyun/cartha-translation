translation:
  language: en
  text: This is the regular burnt offering—a sacrifice burned completely—established at Mount Sinai.[a] It is a food offering to Yahweh,[b] with an aroma pleasing to him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “made” or “offered at Mount Sinai.”
    reason: alternative_reading
  - marker: b
    text: Here “food offering” means a sacrificial gift presented in fire.
    reason: cultural_note
