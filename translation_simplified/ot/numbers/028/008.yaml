translation:
  language: en
  text: Offer the second lamb between the evenings.[a] With it, offer the same grain offering and drink offering as in the morning. This will be a food offering, a pleasing aroma to Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This Hebrew expression is often understood as “at twilight,” but its exact time is debated.
    reason: lexical_alternative
  - marker: b
    text: “Food offering” may also be translated “offering by fire.”
    reason: lexical_alternative
