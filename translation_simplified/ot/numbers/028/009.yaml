translation:
  language: en
  text: On the Sabbath day, also offer two male lambs, each one year old and without any defect. Include a grain offering of two-tenths of an ephah[a] of fine flour mixed with oil, together with the drink offering for this Sabbath sacrifice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: An ephah was an ancient dry measure; this offering required two-tenths of one.
    reason: cultural_note
