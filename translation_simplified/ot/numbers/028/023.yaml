  language: en
  text: Offer these in addition to the regular morning burnt offering.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be understood as “in addition to the continual burnt offering,” but either way these offerings are added to the regular offering.
