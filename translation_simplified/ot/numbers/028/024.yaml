translation:
  language: en
  text: Each day for seven days, offer sacrifices like these as food[a]—an offering made by fire, with an aroma pleasing to Yahweh. Offer them in addition to the regular burnt offering and its drink offering.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “food” is a sacrificial image and does not mean bread alone.
