translation:
  language: en
  text: Whenever the ark began to move, Moses said, “Rise up, Yahweh![a] May your enemies be scattered, and may those who hate you run away from you.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Rise up” asks Yahweh to act with power; it does not imply that he was literally inactive.
    reason: cultural_note
simplification_decisions:
- pob_phrase: whenever the ark set out
  simplified_phrase: whenever the ark began to move
  preserved_meaning: This happened each time the ark started a journey.
  reasoning_layer_used: POB lexical decision for וַיְהִי בִּנְסֹעַ
  rationale: The wording keeps the recurring circumstance while making “set out” immediately clear.
- pob_phrase: let your enemies be scattered
  simplified_phrase: may your enemies be scattered
  preserved_meaning: Moses petitions Yahweh to disperse his enemies.
  reasoning_layer_used: POB lexical decision for וְיָפֻצוּ
  rationale: “May” naturally expresses the prayer-like force of the Hebrew verb.
- pob_phrase: let those who hate you flee before you
  simplified_phrase: may those who hate you run away from you
  preserved_meaning: Those persistently hostile to Yahweh retreat from his presence.
  reasoning_layer_used: POB lexical decisions for וְיָנֻסוּ, מְשַׂנְאֶיךָ, and מִפָּנֶיךָ
  rationale: “Run away from you” replaces the less familiar expression “flee before you” without weakening the retreat.
translation_notes:
  risk_flags:
  - risk: “Run away” is less elevated than “flee.”
    mitigation: The phrase remains serious and clearly conveys forced retreat from Yahweh.
