translation:
  language: en
  text: On your days of joy, at your appointed times, and on the first day of each month,[a] blow the trumpets over your burnt offerings and your peace offerings.[b] The trumpet blasts will serve as a memorial for you before your God. I am Yahweh your God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “at your new moons.” The Hebrew literally says “at the beginnings of your months.”
    reason: lexical_alternative
  - marker: b
    text: Or “fellowship offerings.”
    reason: lexical_alternative
