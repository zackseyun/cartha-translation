translation:
  language: en
  text: Moses said to Hobab son of Reuel the Midianite, who was Moses’ father-in-law,[a] “We are leaving for the place Yahweh said he would give us. Come with us, and we will treat you well, because Yahweh has spoken of good things for Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word may also mean Moses’ brother-in-law or, more generally, his relative by marriage.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: We are setting out for the place of which Yahweh said, ‘I will give it to you.’
  simplified_phrase: We are leaving for the place Yahweh said he would give us.
  preserved_meaning: Israel is beginning its journey toward the place Yahweh promised to give them.
  reasoning_layer_used: Lexical decisions for נֹסְעִים אֲנַחְנוּ and the divine promise
  rationale: The direct quotation and formal relative clause become one natural sentence without changing the promise.
- pob_phrase: we will do you good
  simplified_phrase: we will treat you well
  preserved_meaning: Moses promises that Hobab will benefit by traveling with Israel.
  reasoning_layer_used: Lexical decision for וְהֵטַבְנוּ לָךְ
  rationale: The clearer English idiom retains the sense of acting for Hobab’s good.
- pob_phrase: Yahweh has spoken good concerning Israel
  simplified_phrase: Yahweh has spoken of good things for Israel
