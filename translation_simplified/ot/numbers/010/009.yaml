translation:
  language: en
  text: When[a] you go to war in your land against an enemy who is oppressing you, sound the alarm with the trumpets. Then you will be remembered before Yahweh your God[b], and you will be saved from your enemies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “If you go to war in your land.” The Hebrew can describe either a future situation or a condition.
    reason: alternative_reading
  - marker: b
    text: This may also be expressed as “Yahweh your God will remember you,” but the Hebrew uses the passive form “you will be remembered.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And when you go to war in your land against the enemy who oppresses you
  simplified_phrase: When you go to war in your land against an enemy who is oppressing you
  preserved_meaning: Israel may face warfare in its own land against an actively oppressive enemy.
  reasoning_layer_used: Lexical decisions for וְכִי and עַל הַצַּר הַצֹּרֵר אֶתְכֶם
  rationale: The wording uses natural English while retaining both the enemy and the enemy’s ongoing oppression.
- pob_phrase: then you shall sound an alarm with the trumpets
  simplified_phrase: sound the alarm with the trumpets
  preserved_meaning: The trumpets must give a military alarm signal.
  reasoning_layer_used: Lexical decision for וַהֲרֵעֹתֶם and chapter context
  rationale: A direct command is clearer than “you shall” and keeps the trumpet blast’s signaling function.
- pob_phrase: and you shall be remembered before Yahweh your God, and you shall be saved
  simplified_phrase: Then you will be remembered before Yahweh your God, and you will be saved
  preserved_meaning: The alarm brings Israel before Yahweh for favorable attention and rescue.
  reasoning_layer_used: Lexical and theological decisions for וֲנִזְכַּרְתֶּם and וְנוֹשַׁעְתֶּם
  rationale: Splitting the long sentence improves readability while preserving the passive wording and divine deliverance.
translation_notes:
  risk_flags:
  - risk: “When” may sound more certain than the Hebrew construction requires.
    mitigation: Footnote [a] preserves the conditional reading “if.”
  - risk: The passive phrase “you will be remembered” may be less immediately clear in English.
    mitigation: Footnote [b] gives the interpretive alternative without replacing the POB’s chosen form.
