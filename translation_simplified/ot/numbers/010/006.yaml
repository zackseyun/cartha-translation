translation:
  language: en
  text: When you blow the second alarm,[a] the camps on the south side must set out. The priests must blow this alarm for those camps to set out.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “alarm” means a distinctive trumpet blast used as a signal to direct the camps.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the camps that are encamped on the south side
  simplified_phrase: the camps on the south side
  preserved_meaning: The signal applies to the tribal camps stationed on the south side.
  reasoning_layer_used: POB lexical decisions for הַמַּחֲנוֹת, הַחֹנִים, and תֵּימָנָה
  rationale: The location remains clear without the redundant phrase “camps that are encamped.”
- pob_phrase: shall set out
  simplified_phrase: must set out
  preserved_meaning: The trumpet signal directs the southern camps to begin traveling.
  reasoning_layer_used: POB lexical decision for וְנָסְעוּ and the procedural context
  rationale: “Must” states the required response in direct modern English.
- pob_phrase: they shall blow an alarm for their departures
  simplified_phrase: The priests must blow this alarm for those camps to set out
  preserved_meaning: The designated trumpet-blowers sound the prescribed signal that directs the southern camps to depart.
  reasoning_layer_used: POB lexical decisions for תְּרוּעָה יִתְקְעוּ and לְמַסְעֵיהֶם, with Numbers 10:8
  rationale: Naming the priests removes a misleading pronoun while the purpose clause preserves the signal’s procedural role.
