  text: Moses, Aaron, and Aaron’s sons camped east of the tabernacle, in front of the tent of meeting and facing the sunrise. They were responsible for guarding the sanctuary on behalf of the people of Israel. Any unauthorized person who approaches the sanctuary must be put to death.
