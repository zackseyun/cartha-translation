translation:
  language: en
  text: Nadab and Abihu died in Yahweh’s presence when they presented him with fire he had not authorized[a] in the wilderness of Sinai. They had no sons. Eleazar and Ithamar served as priests in the presence of their father Aaron.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally, “strange fire” or “foreign fire”; the Hebrew likely means fire not authorized for the offering.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also mean that they served as priests during their father Aaron’s lifetime.
    reason: lexical_alternative
