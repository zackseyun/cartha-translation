simplification_decisions:
- pob_phrase: Bring near the tribe of Levi
  simplified_phrase: Bring the tribe of Levi forward
  preserved_meaning: Moses is commanded to bring the Levites near for formal presentation.
  reasoning_layer_used: Lexical decision for הַקְרֵב and immediate context
  rationale: “Bring forward” makes the act of presentation clear while retaining the movement toward Aaron.
- pob_phrase: set it before Aaron the priest
  simplified_phrase: place them before Aaron the priest
  preserved_meaning: The tribe is to be positioned in Aaron’s presence.
  reasoning_layer_used: Lexical decision for וְהַעֲמַדְתָּ אֹתוֹ
  rationale: “Place” is common English, and “them” naturally refers to the people of the tribe.
- pob_phrase: and they shall serve him
  simplified_phrase: They will serve him
  preserved_meaning: The Levites will render service to Aaron in his priestly role.
  reasoning_layer_used: Lexical and theological decisions for וְשֵׁרְתוּ אֹתוֹ
  rationale: A new sentence improves readability without weakening Aaron as the direct recipient of their service.
translation_notes:
  risk_flags:
