  preserved_meaning: God made the firstborn holy for his own possession and service.
  reasoning_layer_used: POB lexical decisions for הִקְדַּשְׁתִּי and לִי
  rationale: This explains “consecrated” while retaining the explicit possessive purpose.
- pob_phrase: from man to beast
  simplified_phrase: both people and animals
  preserved_meaning: The expression includes human and animal firstborn without adding “male.”
  reasoning_layer_used: POB lexical and theological decisions for מֵאָדָם עַד בְּהֵמָה
  rationale: The stock expression is recast in clear modern English without narrowing its range.
