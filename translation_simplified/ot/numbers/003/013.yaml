translation:
  language: en
  text: For every firstborn belongs to me. On the day I struck down every firstborn in the land of Egypt, I set apart as holy for myself every firstborn in Israel, both people and animals. They will be mine. I am Yahweh.
  philosophy: optimal-equivalence
