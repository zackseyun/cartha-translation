translation:
  language: en
  text: The sons of Merari, listed by clan, were Mahli and Mushi. These are the clans of the Levites,[a] grouped by their ancestral households.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the clans of Levi.” The Hebrew singular can refer collectively to the Levites or to Levi, their tribal ancestor.
    reason: alternative_reading
