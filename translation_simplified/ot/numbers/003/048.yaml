translation:
  language: en
  text: Give the silver to Aaron and his sons as the price to redeem the firstborn Israelites who exceeded the number of Levites.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And you shall give the silver
  simplified_phrase: Give the silver
  preserved_meaning: God directs Moses to hand over the silver as the next required action.
  reasoning_layer_used: The lexical decision treats the Hebrew verb as a directive in an instructional sequence.
  rationale: A direct command is clearer modern English than “you shall give.”
- pob_phrase: as the redemption price for
  simplified_phrase: as the price to redeem
  preserved_meaning: The silver is the payment by which the people in view are redeemed.
  reasoning_layer_used: The lexical decision identifies the silver as the redemption payment rather than the redeemed persons.
  rationale: The verbal wording explains the payment’s purpose without losing the redemption concept.
- pob_phrase: those among them who are in excess
  simplified_phrase: the firstborn Israelites who exceeded the number of Levites
  preserved_meaning: These are the surplus firstborn Israelites beyond the corresponding number of Levites.
  reasoning_layer_used: The lexical rationale identifies the counted groups and explains the census relationship.
  rationale: Naming both groups makes the numerical comparison immediately understandable.
interpretive_expansions:
- pob_phrase: those among them who are in excess
  rendering: the firstborn Israelites who exceeded the number of Levites
  claim: The people requiring redemption were the firstborn Israelites beyond the total number of Levites.
  evidence:
  - The POB lexical rationale explicitly identifies the surplus as firstborn Israelites beyond the number of Levites.
  - The immediate census-redemption context establishes the comparison between firstborn Israelites and Levites.
  confidence: high
