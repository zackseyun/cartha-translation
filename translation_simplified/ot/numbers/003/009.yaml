  preserved_meaning: God commands that the Levites be placed under Aaron and his sons for service.
  reasoning_layer_used: Lexical decision for וְנָתַתָּה and the immediate context of Numbers 3:6–7
  rationale: “Must assign” states the command and avoids implying personal ownership.
- pob_phrase: they are wholly given
  simplified_phrase: They are completely assigned
  preserved_meaning: The Levites are emphatically and fully designated to Aaron.
  reasoning_layer_used: Lexical decision for the repeated נְתוּנִם נְתוּנִם
  rationale: “Completely assigned” preserves the Hebrew emphasis while clarifying the transfer.
