translation:
  language: en
  text: Appoint Aaron and his sons as priests. They must guard the priestly office entrusted to them. Any unauthorized person[a] who comes near must be put to death.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew “outsider,” meaning anyone not authorized for priestly access, not an ethnic foreigner.
    reason: lexical_alternative
