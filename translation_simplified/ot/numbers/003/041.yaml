translation:
  language: en
  text: I am Yahweh. Take the Levites as mine in place of every firstborn among the sons of Israel.[a] Also take the Levites’ livestock in place of every firstborn animal among the livestock of the sons of Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, among the Israelites; the Hebrew reads “among the sons of Israel.”
    reason: lexical_alternative
