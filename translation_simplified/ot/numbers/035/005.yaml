translation:
  language: en
  text: 'Measure 2,000 cubits[a] outside the city on each side: east, south, west, and north. The city must be in the middle. This surrounding land will serve as pastureland[b] for the cities.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A cubit was an ancient unit of length, usually about 18 inches (45 centimeters).
    reason: cultural_note
  - marker: b
    text: The Hebrew term can also mean the common or open land around a city; such land was often used for grazing.
    reason: lexical_alternative
