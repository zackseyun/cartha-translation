translation:
  language: en
  text: Do not accept a ransom for someone who has fled to his city of refuge if it would let him return and live in the land before the priest dies.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A “ransom” here means a payment accepted in place of the required legal consequence.
    reason: lexical_alternative
  - marker: b
    text: The compact Hebrew may also forbid a payment connected with his remaining in or returning from the city of refuge before the priest dies.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: you shall not take a ransom
  simplified_phrase: Do not accept a ransom
  preserved_meaning: The command forbids receiving a payment in place of the required legal consequence.
  reasoning_layer_used: POB lexical decision for כֹּפֶר
  rationale: The direct command is clearer while retaining the legal term “ransom.”
- pob_phrase: so that he may return to live in the land before the death of the priest
  simplified_phrase: if it would let him return and live in the land before the priest dies
  preserved_meaning: No payment may permit the manslayer to return early, before the priest’s death.
  reasoning_layer_used: POB theological decision and temporal rationale
  rationale: The conditional wording states the prohibited result in ordinary English.
translation_notes:
  risk_flags:
