translation:
  language: en
  text: The pastureland around each city that you give to the Levites must measure 1,000 cubits—about 1,500 feet (450 meters)—outward from the city wall, all the way around.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Pastureland” can also mean common or open land surrounding the city.
    reason: lexical_alternative
  - marker: b
    text: Hebrew says “city wall”; some understand this more generally as the city boundary.
    reason: lexical_alternative
