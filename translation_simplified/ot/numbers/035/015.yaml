- pob_phrase: These six cities shall be for refuge
  simplified_phrase: These six cities will serve as places of refuge
  preserved_meaning: The six cities are legally designated to provide refuge.
  reasoning_layer_used: Lexical decision for תִהְיֶינָה and לְמִקְלָט
  rationale: The active wording clearly states the cities’ purpose without weakening the legal declaration.
- pob_phrase: for the sojourner and for the resident among them
  simplified_phrase: for sojourners and other non-native residents living among them
  preserved_meaning: Both distinct classes of non-native residents are included.
  reasoning_layer_used: Lexical decisions and cultural footnote for גֵּר and תּוֹשָׁב
  rationale: The wording explains their non-native status while keeping the two groups distinct.
- pob_phrase: may flee there
  simplified_phrase: may flee to one of these cities
  preserved_meaning: An unintentional killer may seek refuge in any designated city.
  reasoning_layer_used: Lexical decision for לָנוּס שָׁמָּה and immediate context
  rationale: Replacing the pronoun with its referent makes the destination immediately clear.
