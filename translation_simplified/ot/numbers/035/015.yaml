translation:
  language: en
  text: These six cities will serve as places of refuge for the sons of Israel[a] and for sojourners and other non-native residents living among them.[b] Anyone who kills a person unintentionally may flee to one of these cities.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, the Israelites; “sons of Israel” preserves the Hebrew national designation.
    reason: lexical_alternative
  - marker: b
    text: “Sojourners” and “residents” represent two distinct groups of non-native people living within Israelite society.
    reason: cultural_note
