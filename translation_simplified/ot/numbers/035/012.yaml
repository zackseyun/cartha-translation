translation:
  language: en
  text: These cities will be places where you can take refuge from the avenger.[a] A person who has killed someone must not die before standing before the community to be judged.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term can mean “blood avenger” or “kinsman-avenger”—a relative responsible for avenging the person who was killed.
    reason: lexical_alternative
