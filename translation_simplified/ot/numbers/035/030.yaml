translation:
  language: en
  text: A person who strikes someone down as an act of murder must be put to death on the testimony of witnesses. But the testimony of one witness alone is not enough to put anyone to death.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Whoever strikes down a person, the murderer
  simplified_phrase: A person who strikes someone down as an act of murder
  preserved_meaning: The violent killing is identified as murder, not merely any act that causes death.
  reasoning_layer_used: POB lexical decisions for מַכֵּה נֶפֶשׁ and הָרֹצֵחַ
  rationale: The recast sentence removes the difficult apposition while retaining both the violent image and legal culpability.
- pob_phrase: shall be put to death on the testimony of witnesses
  simplified_phrase: must be put to death on the testimony of witnesses
  preserved_meaning: The legal penalty depends on evidence given by multiple witnesses.
  reasoning_layer_used: POB lexical decision for לְפִי עֵדִים
  rationale: “Must” states the legal requirement in common English while keeping testimony as its basis.
- pob_phrase: one witness shall not testify against a person for death
  simplified_phrase: the testimony of one witness alone is not enough to put anyone to death
  preserved_meaning: A single witness cannot provide sufficient grounds for a person's execution.
  reasoning_layer_used: POB lexical decisions for וְעֵד אֶחָד, לֹא יַעֲנֶה, and בְנֶפֶשׁ לָמוּת
  rationale: The compressed legal wording is restated as a clear rule about insufficient evidence.
interpretive_expansions:
