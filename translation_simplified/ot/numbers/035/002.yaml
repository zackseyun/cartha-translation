translation:
  language: en
  text: Command the sons of Israel[a] to give the Levites cities from the land they received as their inherited property, for the Levites to live in. You must also give the Levites pasturelands[b] around those cities.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This means the Israelites as a people; the Hebrew literally says “sons of Israel.”
    reason: lexical_alternative
  - marker: b
    text: These were open lands around a city, especially used for grazing and other community needs.
    reason: cultural_note
