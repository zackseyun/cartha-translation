- pob_phrase: from the many you shall increase, and from the few you shall diminish
  simplified_phrase: tribes with larger inheritances must give more cities, and tribes with smaller inheritances must give fewer
  preserved_meaning: The number of cities required rises or falls with each tribe’s allotted inheritance.
  reasoning_layer_used: POB footnote a and lexical decisions for the proportional idiom
  rationale: The implied tribes and the practical meaning of increase and diminish are stated directly.
- pob_phrase: Each one, according to his inheritance that they inherit, shall give some of his cities
  simplified_phrase: Each tribe must give the Levites some of its cities in proportion to the land it inherits
  preserved_meaning: Every tribal group contributes cities according to the size of its inheritance.
  reasoning_layer_used: POB lexical decisions and restored plural יִנְחָלוּ
  rationale: Naming each tribe removes the confusing shift between singular and plural pronouns.
