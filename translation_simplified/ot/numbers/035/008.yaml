translation:
  language: en
  text: 'The cities you give from the Israelites’ land must be apportioned this way: tribes with larger inheritances must give more cities, and tribes with smaller inheritances must give fewer. Each tribe must give the Levites some of its cities in proportion to the land it inherits.'
  philosophy: optimal-equivalence
