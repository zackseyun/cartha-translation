- pob_phrase: if he struck him with a wooden object in the hand
  simplified_phrase: suppose he strikes someone with a hand-held wooden object
  preserved_meaning: The blow is delivered with a wooden object that can be wielded by hand.
  reasoning_layer_used: POB lexical decisions for בִּכְלִי עֵץ, יָד, and הִכָּהוּ
  rationale: The hypothetical is recast in natural modern English while keeping the hand-held wooden object and the act of striking.
- pob_phrase: by which one could die
  simplified_phrase: that could cause death
  preserved_meaning: The object is capable of killing a person.
  reasoning_layer_used: POB lexical decision for אֲשֶׁר יָמוּת בּוֹ
  rationale: The clearer causal wording preserves the object's lethal capacity rather than limiting the phrase to this death.
- pob_phrase: must surely be put to death
  simplified_phrase: must certainly be put to death
  preserved_meaning: The death penalty is both mandatory and emphatic.
  reasoning_layer_used: POB lexical decision for מוֹת יוּמַת
  rationale: Certainly expresses the Hebrew emphasis in familiar English without weakening the legal requirement.
