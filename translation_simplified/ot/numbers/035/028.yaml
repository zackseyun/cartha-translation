translation:
  language: en
  text: For he must stay in his city of refuge until the high priest dies. After the high priest dies, the person who killed someone[a] may return to his own land.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This is a legal term for someone who caused a death; it does not necessarily mean a murderer.
    reason: lexical_alternative
  - marker: b
    text: That is, his own landholding or property.
    reason: simplification_note
