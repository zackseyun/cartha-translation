translation:
  language: en
  text: Or suppose someone, acting out of hostility, strikes another person with his hand, and that person dies. The attacker must certainly be put to death; he is a murderer. The avenger of blood[a] must put the murderer to death when he meets him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “avenger of blood” was the family member responsible for avenging the victim’s death.
    reason: cultural_note
simplification_decisions:
- pob_phrase: if he struck him with his hand in enmity
  simplified_phrase: suppose someone, acting out of hostility, strikes another person with his hand
  preserved_meaning: The assault is deliberate, hostile, and carried out by hand.
  reasoning_layer_used: lexical decisions and immediate legal context
  rationale: The wording clarifies the participants and replaces the uncommon “enmity” with ordinary English.
- pob_phrase: the one who struck him must surely be put to death
  simplified_phrase: The attacker must certainly be put to death
  preserved_meaning: The law imposes an emphatic and mandatory death penalty.
  reasoning_layer_used: lexical decision for מוֹת יוּמַת
  rationale: “Attacker” avoids repetition while “must certainly” retains the Hebrew emphasis.
- pob_phrase: the avenger of blood
  simplified_phrase: the avenger of blood[a]
  preserved_meaning: The established Israelite legal role remains distinct rather than becoming a general executioner.
  reasoning_layer_used: theological decision for גֹּאֵל הַדָּם
  rationale: The legal title is retained, with its family role explained in a note.
translation_notes:
  risk_flags:
  - risk: Modern readers may mistake the avenger of blood for an unrelated private vigilante.
    mitigation: The footnote identifies the role as a responsibility held by a family member.
