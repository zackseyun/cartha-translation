translation:
  language: en
  text: The congregation must rescue the person who caused the death from the power of the avenger of blood.[a] They must bring him back to the city of refuge to which he fled. He must live there until the high priest dies—the high priest who had been anointed with the holy oil.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “avenger of blood” was the person legally responsible for avenging the death, often a close relative.
    reason: cultural_note
  - marker: b
    text: The Hebrew says “whom he anointed,” but it does not identify who performed the anointing; many translations read “who had been anointed.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the manslayer
  simplified_phrase: the person who caused the death
  preserved_meaning: The person killed someone, but the wording does not assume intentional murder.
  reasoning_layer_used: Lexical and theological decisions on הָרֹצֵחַ
  rationale: This replaces an unfamiliar legal term without assigning guilt the passage has not established.
- pob_phrase: from the hand of the avenger of blood
  simplified_phrase: from the power of the avenger of blood
  preserved_meaning: The congregation delivers the person from the avenger’s control.
  reasoning_layer_used: Lexical decision on מִיַּד
  rationale: The documented idiomatic alternative is clearer while preserving the legal title.
- pob_phrase: the congregation shall return him to his city of refuge, where he fled; and he shall live in it
  simplified_phrase: They must bring him back to the city of refuge to which he fled. He must live there
  preserved_meaning: The community restores him to his designated refuge, where he must remain.
  reasoning_layer_used: Lexical decisions on שוב, עיר מקלט, and ישב
  rationale: Short sentences and ordinary verbs make the legal requirement easier to follow.
interpretive_expansions:
- pob_phrase: the high priest, whom he anointed with the holy oil
  rendering: the high priest who had been anointed with the holy oil
  claim: The clause identifies the high priest by his consecrating anointing without naming its agent.
  evidence:
  - The Hebrew makes the high priest the object of the anointing verb.
  - The verb’s subject is left unstated in Hebrew.
  - The POB audit lists the passive wording as a documented alternative.
  confidence: moderate
  alternatives_preserved:
  - whom he anointed with the holy oil
