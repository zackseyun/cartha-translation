translation:
  language: en
  text: You must camp outside the main camp for seven days. Everyone who killed a person or touched the body of someone who was killed must purify themselves on the third day and the seventh day. You and your captives must all do this.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: camp outside the camp
  simplified_phrase: camp outside the main camp
  preserved_meaning: They must remain encamped beyond the community’s camp.
  reasoning_layer_used: Lexical decision for חֲנוּ and מִחוּץ לַמַּחֲנֶה
  rationale: Adding “main” makes the repeated use of “camp” immediately understandable.
- pob_phrase: touched one slain
  simplified_phrase: touched the body of someone who was killed
  preserved_meaning: Contact with a person’s slain body causes the impurity addressed here.
  reasoning_layer_used: Lexical decisions for וְכֹל נֹגֵעַ בֶּחָלָל and בֶּחָלָל
  rationale: The clearer wording states the corpse-contact already implied by the context.
- pob_phrase: you and your captives
  simplified_phrase: You and your captives must all do this
  preserved_meaning: The purification requirement applies to both the Israelites and their war captives.
  reasoning_layer_used: Lexical decision for אַתֶּם וּשְׁבִיכֶם
  rationale: A separate sentence makes the scope of the command clear.
interpretive_expansions:
- pob_phrase: touched one slain
  rendering: touched the body of someone who was killed
  claim: The contact is with the corpse of a slain person.
  evidence:
  - The lexical rationale says the context implies corpse-contact and resulting ritual impurity.
  - The prescribed third and seventh days match purification after contact with the dead.
  confidence: high
  alternatives_preserved:
  - touched one slain
  - touched a slain body
translation_notes:
  risk_flags:
  - risk: “Main camp” adds a clarifying descriptor not explicit in Hebrew.
    mitigation: It only distinguishes the community’s encampment from the place where they must camp outside it.
