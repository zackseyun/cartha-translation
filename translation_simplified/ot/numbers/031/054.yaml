translation:
  language: en
  text: Moses and Eleazar the priest took the gold from the commanders over military units of thousands and hundreds. They brought it into the tent of meeting to serve as a memorial for the sons of Israel[a] in Yahweh’s presence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sons of Israel” is the Hebrew covenant name for the Israelites.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the commanders of thousands and of hundreds
  simplified_phrase: the commanders over military units of thousands and hundreds
  preserved_meaning: The leaders commanded military-administrative units called thousands and hundreds.
  reasoning_layer_used: POB lexical decision for שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  rationale: Adding “military units” prevents readers from mistaking the numbers for exact troop totals.
- pob_phrase: and they brought it into
  simplified_phrase: They brought it into
  preserved_meaning: Moses and Eleazar carried the gold into the designated sacred tent.
  reasoning_layer_used: Source syntax and POB translation
  rationale: A new sentence makes the sequence easier to follow without changing who acted.
- pob_phrase: as a memorial ... before Yahweh
  simplified_phrase: to serve as a memorial ... in Yahweh’s presence
  preserved_meaning: The gold had a commemorative purpose in the sacred presence of Yahweh.
  reasoning_layer_used: POB lexical decisions for זִכָּרוֹן and לִפְנֵי יְהוָה
  rationale: The wording explains the gold’s function and makes the cultic phrase natural in modern English.
