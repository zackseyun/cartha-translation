translation:
  language: en
  text: 'From the fighting men who went into battle, set aside a required share for Yahweh: one out of every five hundred from each group—the human captives, the cattle, the donkeys, and the sheep and goats.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: levy a tribute for Yahweh
  simplified_phrase: set aside a required share for Yahweh
  preserved_meaning: The portion is mandatory and belongs to Yahweh.
  reasoning_layer_used: Lexical decisions for וַהֲרֵמֹתָ and מֶכֶס, and the theological decision for יהוה
  rationale: “Required share” makes the assessed portion clear without suggesting a voluntary gift.
- pob_phrase: the men of war who went out to battle
  simplified_phrase: the fighting men who went into battle
  preserved_meaning: The share is taken from the men who participated in the campaign.
  reasoning_layer_used: Lexical decision for מֵאֵת אַנְשֵׁי הַמִּלְחָמָה הַיֹּצְאִים לַצָּבָא
  rationale: This uses ordinary English while retaining the masculine military group.
- pob_phrase: from the people ... and from the flock
  simplified_phrase: the human captives ... and the sheep and goats
  preserved_meaning: The spoil includes a human category and the small livestock denoted by the flock term.
  reasoning_layer_used: Lexical decisions for אָדָם and צֹאן, supported by the immediate spoil context
  rationale: The clearer labels distinguish the captives from the soldiers and identify the kind of livestock.
interpretive_expansions:
- pob_phrase: one out of five hundred, from the people and from the cattle and from the donkeys and from the flock
  rendering: one out of every five hundred from each group
  claim: The required share is calculated separately for every listed category.
  evidence:
  - The Hebrew repeats “from” before each category.
  - The POB treats the people and three animal groups as distinct portions of the spoil.
  confidence: high
  alternatives_preserved:
  - one out of five hundred from the people and animals
- pob_phrase: from the people
  rendering: the human captives
  claim: The people counted here are the human portion of the captured spoil, not the fighting men.
  evidence:
  - The POB audit identifies אָדָם as the human portion of the spoil.
  - Numbers 31:9 and 31:11–12 place captured people alongside livestock in the spoil.
  confidence: high
  alternatives_preserved:
  - the people
  - the human beings
translation_notes:
  risk_flags:
  - risk: “Human captives” states contextual information more directly than the POB main text.
    mitigation: The POB audit and immediate context explicitly identify these people as part of the captured spoil.
  - risk: “Sheep and goats” specifies the members of the collective term “flock.”
    mitigation: The POB lexical rationale lists this as a supported rendering of the small-livestock category.
