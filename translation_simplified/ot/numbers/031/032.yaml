translation:
  language: en
  text: The plunder[a] remaining from the spoil the troops had taken was 675,000 sheep.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses two closely related words for what is taken in war, here translated “plunder” and “spoil.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the remainder of the spoil
  simplified_phrase: remaining from the spoil
  preserved_meaning: This was the portion of the war spoil that remained.
  reasoning_layer_used: The lexical decision for יֶתֶר marks a remainder in relation to the spoil.
  rationale: The participial wording is shorter and more natural while keeping the remainder relationship.
- pob_phrase: the people of the army
  simplified_phrase: the troops
  preserved_meaning: The people who served in the army had taken the spoil.
  reasoning_layer_used: The lexical record lists “the troops” as a smoother alternative for עַם הַצָּבָא.
  rationale: The common military term avoids an awkward literal phrase.
- pob_phrase: had plundered
  simplified_phrase: had taken
  preserved_meaning: The troops had seized the spoil in war.
  reasoning_layer_used: The lexical decision for אֲשֶׁר בָּזְזוּ permits “had taken” in this context.
  rationale: Using “taken” avoids the clumsy phrase “plunder had plundered” without weakening the military context.
