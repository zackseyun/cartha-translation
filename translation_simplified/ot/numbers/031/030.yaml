translation:
  language: en
  text: From the half assigned to the sons of Israel, take one out of every fifty from the people and from each kind of livestock—cattle, donkeys, and flocks of sheep and goats. Give them to the Levites who are responsible for guarding Yahweh’s tabernacle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The tabernacle was the sacred tent at the center of Israel’s worship.
    reason: cultural_note
