- pob_phrase: Everything that can go through the fire
  simplified_phrase: every object that can withstand fire
  preserved_meaning: Each item of spoil suitable for purification by fire is included.
  reasoning_layer_used: POB lexical decisions for כָּל דָּבָר and אֲשֶׁר יָבֹא בָאֵשׁ
  rationale: “Object” makes the concrete reference clear, while “withstand fire” states the practical distinction.
- pob_phrase: only it must be purified
  simplified_phrase: Even then, it must also be purified
  preserved_meaning: Fire treatment does not remove the additional requirement involving purification water.
  reasoning_layer_used: POB lexical decision for אַךְ and immediate clause contrast
  rationale: “Even then” clearly marks the qualification, and “also” preserves the added requirement.
- pob_phrase: everything that cannot go through the fire, you shall pass through the water
  simplified_phrase: Any object that cannot withstand fire must be put through the water
  preserved_meaning: Items unsuitable for fire treatment still undergo the corresponding water treatment.
  reasoning_layer_used: POB lexical decisions for the contrasting clauses and repeated causative verb
  rationale: The wording clarifies the fire-safe contrast while retaining the parallel action with water.
