translation:
  language: en
  text: Put every object that can withstand fire through the fire, and it will be clean. Even then, it must also be purified with the special water used to remove ritual impurity.[a] Any object that cannot withstand fire must be put through the water.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated “water of impurity”; traditionally, “water of separation” (see Numbers 19).
    reason: lexical_alternative
