translation:
  language: en
  text: Moses told the people, “Choose men from among you and arm them for battle. Send them against Midian to carry out Yahweh’s vengeance on Midian.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “vengeance for Yahweh.” The Hebrew can mean vengeance belonging to Yahweh or carried out on his behalf.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: So Moses spoke to the people, saying
  simplified_phrase: Moses told the people
  preserved_meaning: Moses addressed the Israelite community and introduced his command.
  reasoning_layer_used: lexical decision for וַיְדַבֵּר and הָעָם
  rationale: The shorter wording removes a formal speech formula without changing who spoke or to whom.
- pob_phrase: Arm men from among you for the army
  simplified_phrase: Choose men from among you and arm them for battle
  preserved_meaning: The people must select male combatants from their own community and equip them for war.
  reasoning_layer_used: lexical decisions for הֵחָלְצוּ, מֵאִתְּכֶם, אֲנָשִׁים, and לַצָּבָא
  rationale: Two direct actions make the selection and military preparation easier to understand.
- pob_phrase: let them go against Midian to execute
  simplified_phrase: Send them against Midian to carry out
  preserved_meaning: The armed men are to undertake hostile action against Midian and perform the commanded vengeance.
  reasoning_layer_used: lexical decisions for וְיִהְיוּ עַל מִדְיָן and לָתֵת
  rationale: Common verbs replace formal wording while retaining the military movement and action.
interpretive_expansions:
- pob_phrase: Arm men from among you
  rendering: Choose men from among you and arm them
  claim: The command includes selecting men out of the community as well as preparing them for war.
  evidence:
  - The POB rationale says מֵאִתְּכֶם indicates selection out of the people themselves.
  - The military sense of הֵחָלְצוּ supports arming or equipping them.
  confidence: high
  alternatives_preserved:
  - Arm men from among you
  - Prepare men from among you for battle
translation_notes:
  risk_flags:
  - risk: “Send them” makes Moses’ directive more explicit than the Hebrew idiom itself.
    mitigation: It preserves the POB’s controlling sense “let them go against Midian” without specifying the form of attack.
  - risk: “Yahweh’s vengeance” may be read only as vengeance personally performed by Yahweh.
    mitigation: Footnote [a] preserves the possible sense of vengeance carried out on Yahweh’s behalf.
