translation:
  language: en
  text: Moses sent them into battle, one thousand men from each tribe. Phinehas son of Eleazar the priest went with them. He had with him the sacred articles[a] and the trumpets used to sound the battle signal.
  philosophy: optimal-equivalence
  footnotes:
