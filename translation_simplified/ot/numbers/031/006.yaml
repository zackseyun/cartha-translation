- pob_phrase: sent them to the war, a thousand from each tribe
  simplified_phrase: sent them into battle, one thousand men from each tribe
  preserved_meaning: Moses sent the fighting force supplied equally by the tribes.
  reasoning_layer_used: POB lexical decisions for לַצָּבָא and אֶלֶף לַמַּטֶּה
  rationale: “Into battle” is natural English, and “men” clarifies who each tribe supplied.
- pob_phrase: them and Phinehas son of Eleazar the priest, to the war
  simplified_phrase: Phinehas son of Eleazar the priest went with them
  preserved_meaning: Phinehas accompanied the tribal force on the campaign.
  reasoning_layer_used: POB lexical and theological decisions on Phinehas’s role
  rationale: A separate sentence removes awkward repetition while keeping Phinehas with the expedition.
- pob_phrase: with the holy vessels and the trumpets for the battle cry in his hand
  simplified_phrase: He had with him the sacred articles and the trumpets used to sound the battle signal
  preserved_meaning: Phinehas had the sacred objects and military signal trumpets with him or under his charge.
