translation:
  language: en
  text: A corrupt witness makes a mockery of justice, and wicked people gulp down evil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word translated “evil” can also mean harmful deceit or falsehood.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: A worthless witness
  simplified_phrase: A corrupt witness
  preserved_meaning: The witness is morally base, not merely ineffective.
  reasoning_layer_used: POB lexical decision for בְּלִיַּעַל
  rationale: “Corrupt” makes the intended moral sense of “worthless” immediately clear.
- pob_phrase: mocks justice
  simplified_phrase: makes a mockery of justice
  preserved_meaning: The witness treats justice with scorn.
  reasoning_layer_used: POB lexical decision for יָלִיץ
  rationale: The fuller idiom clearly expresses active contempt for justice.
- pob_phrase: the mouth of the wicked swallows iniquity
  simplified_phrase: wicked people gulp down evil
  preserved_meaning: Wicked people are vividly pictured as consuming moral evil.
  reasoning_layer_used: POB lexical decisions for פִי, יְבַלַּע, רְשָׁעִים, and אָוֶן
  rationale: “Gulp down” preserves the bodily image while “evil” replaces the less familiar “iniquity.”
