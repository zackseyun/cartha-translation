translation:
  language: en
  text: Also, wanting something without knowledge is not good.[a] Those who rush headlong sin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “A person without knowledge is not good.” The Hebrew can refer either to desire or to a person.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: desire without knowledge
  simplified_phrase: wanting something without knowledge
  preserved_meaning: Desire is harmful when it is not joined with knowledge.
  reasoning_layer_used: POB lexical decision for נֶפֶשׁ and בְּלֹא דַעַת
  rationale: The verbal phrase is easier for common readers while retaining desire as the main interpretation.
- pob_phrase: whoever hurries with his feet
  simplified_phrase: Those who rush headlong
  preserved_meaning: Rash haste leads people into wrongdoing.
  reasoning_layer_used: POB lexical decisions and wisdom-source audit
  rationale: “Rush headlong” keeps the force of bodily, uncontrolled haste without the awkward phrase “with his feet.”
- pob_phrase: and whoever
  simplified_phrase: Those who
  preserved_meaning: The warning applies generally to anyone characterized by haste.
  reasoning_layer_used: POB lexical rationale for the generic participle
  rationale: A new sentence makes the proverb easier to read without weakening its connection or universal warning.
