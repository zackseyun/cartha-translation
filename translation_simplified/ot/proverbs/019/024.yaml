translation:
  language: en
  text: A lazy person buries his hand deep in the food dish and leaves it there; he will not even lift it to his mouth.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The sluggard
  simplified_phrase: A lazy person
  preserved_meaning: This describes someone who is habitually lazy.
  reasoning_layer_used: POB lexical decision for עָצֵל
  rationale: The common phrase is easier for readers unfamiliar with the wisdom term “sluggard.”
- pob_phrase: buries his hand in the dish
  simplified_phrase: buries his hand deep in the food dish and leaves it there
  preserved_meaning: The exaggerated picture of a hand buried in a serving vessel remains vivid.
  reasoning_layer_used: POB lexical decisions for טָמַן and בַּצַּלָּחַת
  rationale: “Deep” and “food” make the absurd eating scene immediately clear without flattening the image.
- pob_phrase: bring it back to his mouth
  simplified_phrase: lift it to his mouth
  preserved_meaning: He refuses to complete the minimal motion needed to eat.
  reasoning_layer_used: POB lexical decision for לֹא יְשִׁיבֶנָּה
  rationale: “Lift it” states the physical action in ordinary English while retaining the hand-to-mouth movement.
