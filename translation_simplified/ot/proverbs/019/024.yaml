translation:
  language: en
  text: A lazy person buries his hand in the dish,[a] but will not even bring it back to his mouth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “hides his hand in the dish.” The Hebrew can mean either “buries” or “hides”; “buries” preserves the proverb’s exaggerated picture.
    reason: lexical_alternative
