translation:
  language: en
  text: Good sense makes a man slow to anger.[a] It is honorable to overlook an offense.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says that his good sense “lengthens his nose,” an idiom for delaying anger.
    reason: source_note
simplification_decisions:
- pob_phrase: A man's insight makes him slow to anger
  simplified_phrase: Good sense makes a man slow to anger
  preserved_meaning: Practical wisdom causes a man to restrain his anger.
  reasoning_layer_used: POB lexical decisions for שֵׂכֶל, אָדָם, and הֶאֱרִיךְ אַפּוֹ
  rationale: “Good sense” states the practical meaning of “insight” more directly while retaining generic “man” and the anger idiom.
- pob_phrase: and it is his glory to overlook an offense
  simplified_phrase: It is honorable to overlook an offense
  preserved_meaning: Passing over a wrong is commendable rather than a promise of public recognition.
  reasoning_layer_used: POB lexical decisions for וְתִפְאַרְתּוֹ, עֲבֹר עַל, and פָּשַׁע
  rationale: The evaluative wording clarifies “his glory” without strengthening “overlook” into “forgive.”
translation_notes:
  risk_flags:
  - risk: “It is honorable” makes the personal pronoun in “his glory” less explicit.
    mitigation: The preceding sentence supplies the person, while the wording preserves the proverb’s commendation without implying a reward.
