translation:
  language: en
  text: Good judgment keeps a man from becoming angry quickly.[a] It is honorable for him to overlook an offense.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says that his good judgment “lengthens his nose,” an expression for being slow to anger.
    reason: source_note
