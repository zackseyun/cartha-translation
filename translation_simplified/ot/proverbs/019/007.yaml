translation:
  language: en
  text: All of a poor man's brothers[b] hate him. How much more, then, do his friends stay away from him! He chases after words, but they are nowhere to be found.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “He chases after words that mean nothing,” or “He chases after promises, but they are not there.” The final Hebrew clause is difficult and may be understood in several ways.
    reason: alternative_reading
  - marker: b
    text: Here “brothers” refers to family members in the proverb's social setting.
    reason: cultural_note
