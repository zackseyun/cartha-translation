translation:
  language: en
  text: All of a poor man's brothers[a] hate him. His friends stay even farther away! He chases after words, but they are not there.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “brothers” refers to male family members in the proverb’s social setting.
    reason: cultural_note
  - marker: b
    text: Or, “He chases words that amount to nothing,” or “He chases promises, but they are not there.” The Hebrew of this final clause is difficult.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: All the brothers of a poor man
  simplified_phrase: All of a poor man's brothers
  preserved_meaning: Every brother of the poor man is included.
  reasoning_layer_used: POB lexical decisions for רָשׁ and אֲחֵי
  rationale: The possessive form is more natural while retaining “poor man” and “brothers.”
- pob_phrase: how much more do his friends keep far from him!
  simplified_phrase: His friends stay even farther away!
  preserved_meaning: His friends distance themselves from him to an even greater degree.
  reasoning_layer_used: POB lexical decisions for אַף כִּי and רָחֲקוּ מִמֶּנּוּ
  rationale: “Even farther” expresses the proverb’s comparison in ordinary English.
- pob_phrase: He pursues words, but they are not there.
  simplified_phrase: He chases after words, but they are not there.
  preserved_meaning: The poor man seeks words that prove absent or unreal.
  reasoning_layer_used: POB lexical decisions for מְרַדֵּף, אֲמָרִים, and לֹא הֵמָּה
  rationale: “Chases after” clarifies the pursuit without adding persistence or resolving the difficult ending.
translation_notes:
  risk_flags:
  - risk: Modern readers may not know what the absent “words” represent.
    mitigation: The footnote preserves the supported possibilities of empty words or missing promises.
  - risk: The difficult final Hebrew clause could be mistaken for a certain interpretation.
    mitigation: The main text remains restrained, and the footnote explicitly preserves the ambiguity.
