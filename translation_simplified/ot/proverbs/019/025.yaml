translation:
  language: en
  text: Strike a scoffer,[a] and a naive person will become prudent. Rebuke a person who has understanding, and that person will gain knowledge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “mocker.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the simple
  simplified_phrase: a naive person
  preserved_meaning: This is a gullible or inexperienced person, not someone lacking intelligence.
  reasoning_layer_used: POB lexical decision for פֶתִי
  rationale: The wording makes the wisdom category clear to readers unfamiliar with “the simple.”
- pob_phrase: will become shrewd
  simplified_phrase: will become prudent
  preserved_meaning: The person develops practical wisdom and discernment.
  reasoning_layer_used: POB lexical decision for יַעְרִם
  rationale: “Prudent” avoids the modern suggestion that shrewdness is crafty or self-serving.
- pob_phrase: one who has understanding
  simplified_phrase: a person who has understanding
  preserved_meaning: The singular person is already characterized by discernment.
  reasoning_layer_used: POB lexical decision for לְנָבוֹן
  rationale: The revision uses ordinary personal wording while preserving the singular sense.
translation_notes:
  risk_flags:
  - risk: “Naive” can sometimes suggest innocence rather than gullibility.
    mitigation: The stated result, becoming prudent, keeps the intended wisdom contrast clear.
