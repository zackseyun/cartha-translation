translation:
  language: en
  text: Wealth brings many friends, but a poor man ends up separated from his friend.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “is deserted by his friend.” The Hebrew does not specify whether the poor man withdraws or his friend abandons him, though the context suggests abandonment.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Wealth adds many friends
  simplified_phrase: Wealth brings many friends
  preserved_meaning: Having wealth causes a person to gain more social connections.
  reasoning_layer_used: Lexical decision for יֹסִיף and רֵעִים רַבִּים
  rationale: “Brings” expresses the causal social sense more naturally than “adds.”
- pob_phrase: is separated from his friend
  simplified_phrase: ends up separated from his friend
  preserved_meaning: The poor man becomes socially cut off while the Hebrew leaves the agent unstated.
  reasoning_layer_used: Lexical decision for יִפָּרֵד and POB footnote
  rationale: “Ends up separated” is natural English and preserves the documented ambiguity.
translation_notes:
  risk_flags:
  - risk: Readers may not know whether the poor man withdraws or is abandoned.
    mitigation: The main text remains neutral, and the footnote gives the likely contextual sense without making it certain.
