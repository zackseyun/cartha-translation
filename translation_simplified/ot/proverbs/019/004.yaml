translation:
  language: en
  text: Wealth brings many friends, but a poor man ends up cut off from his friend.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “is deserted by his friend.” The Hebrew describes separation without saying directly who leaves whom.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Wealth adds many friends
  simplified_phrase: Wealth brings many friends
  preserved_meaning: Having wealth increases a person's social companions.
  reasoning_layer_used: Lexical decision for יֹסִיף and רֵעִים רַבִּים
  rationale: “Brings” expresses the social result more naturally than “adds.”
- pob_phrase: is separated from his friend
  simplified_phrase: ends up cut off from his friend
  preserved_meaning: The poor man experiences separation from his friend without specifying who caused it.
  reasoning_layer_used: Lexical decision and POB footnote for יִפָּרֵד
  rationale: “Ends up cut off” is plain English while keeping the Hebrew verb's ambiguity.
translation_notes:
  risk_flags:
  - risk: “Cut off” could be heard as deliberate rejection rather than unspecified separation.
    mitigation: The passive wording and footnote preserve uncertainty about who withdraws.
