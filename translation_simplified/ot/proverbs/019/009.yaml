translation:
  language: en
  text: Anyone who gives false testimony will not escape punishment. Anyone who breathes out lies[a] will perish.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew pictures lies flowing out as readily as breath.
    reason: simplification_note
simplification_decisions:
- pob_phrase: A false witness
  simplified_phrase: Anyone who gives false testimony
  preserved_meaning: The person lies while serving as a legal or testimonial witness.
  reasoning_layer_used: POB lexical decision for עֵד שְׁקָרִים
  rationale: The verbal form makes the legal action clearer to readers unfamiliar with the term “false witness.”
- pob_phrase: will not go unpunished
  simplified_phrase: will not escape punishment
  preserved_meaning: Punishment is certain, and the guilty person will not avoid it.
  reasoning_layer_used: POB lexical decision for לֹא יִנָּקֶה
  rationale: “Will not escape punishment” states the same judicial consequence in more direct English.
- pob_phrase: and one who breathes out lies will perish
  simplified_phrase: Anyone who breathes out lies will perish
  preserved_meaning: A habitual producer of lies will ultimately be ruined.
  reasoning_layer_used: POB lexical decisions for וְיָפִיחַ כְּזָבִים and יֹאבֵד
  rationale: A new sentence eases the parallel structure while retaining the breath image and severe outcome.
translation_notes:
  risk_flags:
  - risk: “Gives false testimony” may sound more explicitly courtroom-based than some readers take the proverb.
    mitigation: The POB lexical rationale identifies עֵד as a legal or testimonial witness.
