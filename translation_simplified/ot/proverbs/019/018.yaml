translation:
  language: en
  text: Discipline your son, because there is hope for him.[a] But do not make his death your goal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Discipline your son while there is hope.” The Hebrew may give either the reason for discipline or the time to act.
    reason: lexical_alternative
