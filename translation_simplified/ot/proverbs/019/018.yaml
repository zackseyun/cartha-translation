translation:
  language: en
  text: Give your son corrective discipline, because there is hope.[a] Do not seek to put him to death.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “while there is hope.” The Hebrew may give either the reason for discipline or the time when it should happen.
    reason: alternative_reading
  - marker: b
    text: The Hebrew literally says, “do not lift up your soul to put him to death,” meaning not to direct your desire or resolve toward his death.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Discipline your son
  simplified_phrase: Give your son corrective discipline
  preserved_meaning: The father is to use discipline intended to correct his son.
  reasoning_layer_used: POB lexical decision for יַסֵּר
  rationale: This avoids the earlier circular wording while making the corrective purpose clear.
- pob_phrase: do not set your heart on putting him to death
  simplified_phrase: Do not seek to put him to death
  preserved_meaning: The parent must not direct his desire or resolve toward causing his son's death.
  reasoning_layer_used: POB lexical and theological decisions for אַל תִּשָּׂא נַפְשֶׁךָ and הֲמִיתוֹ
  rationale: “Seek” expresses directed desire without adding the absolute force of “never.”
interpretive_expansions:
