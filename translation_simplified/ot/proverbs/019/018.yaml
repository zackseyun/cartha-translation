  rationale: “Because” makes the causal connection immediately clear.
- pob_phrase: do not set your heart on putting him to death
  simplified_phrase: do not make his death your goal
  preserved_meaning: The parent must not desire or pursue a deadly outcome.
  reasoning_layer_used: Hebrew idiom analysis and theological decision
  rationale: “Make his death your goal” clearly expresses directed desire without the opaque Hebrew image.
