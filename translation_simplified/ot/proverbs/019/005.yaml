translation:
  language: en
  text: Anyone who gives false testimony will be punished. Whoever tells lies will not escape.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew “breathes out lies,” an image of speaking lies freely or continually.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: A false witness
  simplified_phrase: Anyone who gives false testimony
  preserved_meaning: The person lies while acting as a witness.
  reasoning_layer_used: POB lexical decision for עֵד שְׁקָרִים
  rationale: Action-based wording makes the testimonial setting clear.
- pob_phrase: will not go unpunished
  simplified_phrase: will be punished
  preserved_meaning: The false witness cannot avoid punishment.
  reasoning_layer_used: POB lexical decision for יִנָּקֶה
  rationale: The direct positive form is easier to understand.
- pob_phrase: one who breathes out lies
  simplified_phrase: Whoever tells lies
  preserved_meaning: The person speaks lies, while the Hebrew image remains in the footnote.
  reasoning_layer_used: POB lexical decision and footnote for וְיָפִיחַ כְּזָבִים
  rationale: The main text explains the opaque image in ordinary English.
translation_notes:
  risk_flags:
  - risk: “Will be punished” makes the Hebrew negative expression positive and direct.
    mitigation: It preserves the POB meaning that punishment cannot be avoided.
  - risk: “Tells lies” does not itself retain the breathing image or its possible repeated or free manner.
    mitigation: The footnote preserves the image and its documented nuance.
