translation:
  language: en
  text: Those who gain good sense love their own lives; those who hold on to understanding will find what is good.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Whoever gains sense
  simplified_phrase: Those who gain good sense
  preserved_meaning: Acquiring practical discernment is in view.
  reasoning_layer_used: POB lexical decision for קֹנֶה לֵּב
  rationale: “Good sense” states the wisdom meaning of the Hebrew image in familiar English.
- pob_phrase: whoever keeps understanding
  simplified_phrase: those who hold on to understanding
  preserved_meaning: Understanding must be attentively preserved.
  reasoning_layer_used: POB lexical decisions for שֹׁמֵר and תְּבוּנָה
  rationale: “Hold on to” makes active preservation clearer than the less natural phrase “keeps understanding.”
- pob_phrase: will find good
  simplified_phrase: will find what is good
  preserved_meaning: Such a person reaches a good outcome.
  reasoning_layer_used: POB lexical decision for לִמְצֹא טוֹב
  rationale: Adding “what is” gives the phrase natural modern English form without narrowing the good promised.
translation_notes:
