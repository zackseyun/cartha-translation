translation:
  language: en
  text: Whoever obeys the commandment protects their life, but whoever is careless about how they live will die.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “will be put to death,” following the written Hebrew consonants; the traditional marginal reading is “will die.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: keeps the commandment
  simplified_phrase: obeys the commandment
  preserved_meaning: The person continually follows what is commanded.
  reasoning_layer_used: Lexical decision for שֹׁמֵר and מִצְוָה
  rationale: “Obeys” states the intended sense of keeping a command in ordinary English.
- pob_phrase: preserves his life
  simplified_phrase: protects their life
  preserved_meaning: Obedience guards the person’s life.
  reasoning_layer_used: Lexical decision for שֹׁמֵר נַפְשׁוֹ and the life-death parallel
  rationale: “Protects” is more familiar while retaining the image of guarding life.
- pob_phrase: is careless about his ways
  simplified_phrase: is careless about how they live
  preserved_meaning: The person heedlessly neglects their own conduct.
  reasoning_layer_used: Final source audit for בּוֹזֵה דְרָכָיו
  rationale: “How they live” makes the idiom about personal conduct immediately clear.
translation_notes:
  risk_flags:
  - risk: “The commandment” may sound like one previously named command rather than a generic reference to what is commanded.
    mitigation: It is retained because the POB deliberately preserves the weight of the Hebrew singular.
