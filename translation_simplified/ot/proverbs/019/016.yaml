translation:
  language: en
  text: Whoever obeys the commandment protects his life, but whoever has no regard for his own conduct[a] will die.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “whoever has no regard for God’s ways.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: keeps the commandment
  simplified_phrase: obeys the commandment
  preserved_meaning: The person continually observes what is commanded.
  reasoning_layer_used: Lexical decisions for שֹׁמֵר and מִצְוָה.
  rationale: “Obeys” clearly expresses what it means to keep a commandment.
- pob_phrase: keeps his life
  simplified_phrase: protects his life
  preserved_meaning: Obedience preserves the person’s life rather than only an immaterial soul.
  reasoning_layer_used: Lexical and theological decisions for נַפְשׁוֹ.
  rationale: “Protects” makes the life-and-death contrast clear.
- pob_phrase: despises his ways
  simplified_phrase: has no regard for his own conduct
  preserved_meaning: The person carelessly disregards how he lives.
  reasoning_layer_used: Lexical decision for בּוֹזֵה דְרָכָיו and the chosen theological referent.
  rationale: This wording avoids suggesting that the person commendably rejects bad behavior.
interpretive_expansions:
- pob_phrase: keeps his life
  rendering: protects his life
  claim: Keeping the commandment preserves the person’s life.
  evidence:
  - The contrast with death supports the sense of preserving life.
  confidence: high
  alternatives_preserved:
  - keeps his life
  - protects himself
- pob_phrase: his ways
  rendering: his own conduct
  claim: The pronoun most naturally refers to the subject’s own way of living.
  evidence:
  - The Hebrew suffix naturally points back to the singular subject.
  - The proverb contrasts obedience with disregard for one’s conduct.
  confidence: high
  alternatives_preserved:
  - God’s ways
  - the way of the commandment
translation_notes:
  risk_flags:
  - risk: “Conduct” makes the likely referent more explicit than the Hebrew “ways.”
    mitigation: The footnote preserves the principal alternative reference to God’s ways.
