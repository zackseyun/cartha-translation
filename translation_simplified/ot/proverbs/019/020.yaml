simplification_decisions:
- pob_phrase: counsel
  simplified_phrase: guidance
  preserved_meaning: Considered direction that should be attentively followed.
  reasoning_layer_used: Lexical decision for עֵצָה
  rationale: “Guidance” is more familiar than “counsel” while retaining the wisdom-setting sense.
- pob_phrase: accept discipline
  simplified_phrase: accept discipline
  preserved_meaning: Willingly receive corrective training that forms character.
  reasoning_layer_used: Lexical decision for מוּסָר and grounding review
  rationale: Retaining “discipline” preserves both formation and correction rather than narrowing the meaning to rebuke.
- pob_phrase: in the end
  simplified_phrase: in the future
  preserved_meaning: Heeding guidance leads toward wisdom in one’s future or eventual outcome.
  reasoning_layer_used: Lexical decision and POB footnote for בְּאַחֲרִיתֶךָ
  rationale: “In the future” avoids limiting the phrase to old age while the footnote preserves its outcome sense.
translation_notes:
  risk_flags:
