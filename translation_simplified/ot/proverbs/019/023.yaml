translation:
  language: en
  text: Fearing Yahweh leads to life. A person who fears him will sleep content, and harm will not come upon them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This wisdom saying describes the usual pattern of life under God, not a guarantee that faithful people will never suffer.
    reason: simplification_note
