translation:
  language: en
  text: The fear of Yahweh leads to life. Whoever has this fear will rest content, and harm will not come upon them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “fear” includes reverence and awe toward Yahweh, not merely terror.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and whoever has it
  simplified_phrase: Whoever has this fear
  preserved_meaning: The person possesses reverent fear of Yahweh.
  reasoning_layer_used: lexical decision for יִרְאַת and immediate antecedent
  rationale: Naming “this fear” removes an unclear pronoun without weakening the Hebrew term.
- pob_phrase: will rest satisfied
  simplified_phrase: will rest content
  preserved_meaning: The person enjoys settled, secure repose.
  reasoning_layer_used: lexical decisions for וְשָׂבֵעַ and יָלִין
  rationale: “Rest content” expresses secure satisfaction in natural modern English.
- pob_phrase: he will not be visited by harm
  simplified_phrase: harm will not come upon them
  preserved_meaning: Adverse circumstances do not overtake the person as the proverb’s general outcome.
  reasoning_layer_used: lexical decisions for יִפָּקֶד and רָע; theological decision on proverbial generalization
  rationale: The active wording makes the visitation image understandable while retaining harm as an approaching threat.
translation_notes:
  risk_flags:
  - risk: Modern readers may hear an absolute promise that faithful people never suffer.
    mitigation: The wording retains the proverb’s general statement without expanding it into guaranteed immunity from every trouble.
