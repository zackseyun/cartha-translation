translation:
  language: en
  text: A son who severely mistreats his father and drives his mother away brings shame and disgrace.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “A son who plunders his father and chases his mother away brings shame and disgrace.” The first verb describes severe, destructive mistreatment and may include taking his father’s property.
    reason: lexical_alternative
