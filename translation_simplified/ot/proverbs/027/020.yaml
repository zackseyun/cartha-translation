translation:
  language: en
  text: Sheol, the realm of the dead, and Abaddon[a] are never satisfied. Man’s eyes are never satisfied either.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Abaddon may also be translated “Destruction”; the Hebrew can refer to destruction itself or to its personified realm.
    reason: lexical_alternative
  - marker: b
    text: “Man” here means human beings generally.
    reason: lexical_alternative
