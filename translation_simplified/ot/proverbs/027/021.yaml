translation:
  language: en
  text: Silver is tested in a refining pot, and gold in a furnace. In the same way, a man is tested by his praise.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may mean that a man is tested by what he praises or by the praise he receives.
    reason: alternative_reading
