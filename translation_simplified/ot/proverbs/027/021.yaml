  rationale: “Refining pot” explains the unfamiliar vessel while preserving the refining image.
- pob_phrase: the furnace for gold
  simplified_phrase: gold in a furnace
  preserved_meaning: A furnace is used to test and refine gold.
  reasoning_layer_used: POB lexical decision for כּוּר and the parallel Hebrew structure
  rationale: The first clause naturally supplies the repeated idea of testing.
- pob_phrase: and a man is tested by his praise
  simplified_phrase: In the same way, a man is tested by his praise
  preserved_meaning: Praise tests a man's character without deciding whether it comes from him or is directed to him.
  reasoning_layer_used: POB theological decision preserving the final colon's ambiguity
  rationale: “His praise” retains both documented readings, which the note explains.
interpretive_expansions:
