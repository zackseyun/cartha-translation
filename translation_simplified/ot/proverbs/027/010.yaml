translation:
  language: en
  text: Do not abandon your friend or your father’s friend.[a] When disaster strikes, do not go to your brother’s house for help.[b] A neighbor nearby is better than a brother far away.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be translated “and your father’s friend.”
    reason: lexical_alternative
  - marker: b
    text: “Brother” may also mean a close relative or family member.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Do not forsake
  simplified_phrase: Do not abandon
  preserved_meaning: The command still warns against deserting a loyal relationship.
  reasoning_layer_used: Lexical decision for אַל תַּעֲזֹב
  rationale: “Abandon” carries the relational force in more familiar English.
- pob_phrase: in the day of your calamity
  simplified_phrase: When disaster strikes
  preserved_meaning: The phrase still refers to a time of serious personal misfortune.
  reasoning_layer_used: Lexical decision for בְּיוֹם אֵידֶךָ
  rationale: The new wording expresses the same event in ordinary English.
- pob_phrase: a nearby neighbor is better than a distant brother
  simplified_phrase: A neighbor nearby is better than a brother far away
  preserved_meaning: Physical nearness is contrasted with family ties at a distance.
  reasoning_layer_used: Lexical and theological decisions for שָׁכֵן קָרוֹב and מֵאָח רָחוֹק
  rationale: The recast comparison is natural while retaining “brother” and the source image.
