  text: Do not abandon your friend or your father’s friend.[a] When disaster strikes, do not go to your brother’s house for help.[b] A neighbor who lives nearby is better than a brother who is far away.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated “and your father’s friend.”
    reason: lexical_alternative
  - marker: b
    text: “Brother” can also refer more broadly to a close relative.
    reason: lexical_alternative
