  rendering: do not go to your brother’s house for help
  claim: Going to the brother’s house in disaster means seeking practical help from him.
  evidence:
  - The POB lexical rationale explicitly identifies seeking help from the brother’s household.
  - The surrounding comparison concerns the practical value of someone nearby in trouble.
  confidence: high
  alternatives_preserved:
