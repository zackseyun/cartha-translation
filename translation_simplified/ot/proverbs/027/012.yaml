translation:
  language: en
  text: A sensible man sees danger and takes cover, but people without good judgment keep going and suffer for it.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “are punished.” The Hebrew can mean suffering a penalty or bearing the consequences.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: A prudent man
  simplified_phrase: A sensible man
  preserved_meaning: He shows practical wisdom and good judgment.
  reasoning_layer_used: POB lexical decision for עָרוּם
  rationale: “Sensible” expresses positive shrewdness in familiar English.
- pob_phrase: hides himself
  simplified_phrase: takes cover
  preserved_meaning: He withdraws to protect himself from approaching danger.
  reasoning_layer_used: POB lexical decision for נִסְתָּר
  rationale: “Takes cover” clearly conveys protective withdrawal from danger.
- pob_phrase: the simple pass on
  simplified_phrase: people without good judgment keep going
  preserved_meaning: Undiscerning people continue forward without taking precautions.
  reasoning_layer_used: POB lexical decisions for פְּתָאיִם and עָבְרוּ
  rationale: The wording preserves the lack of discernment and continued movement.
translation_notes:
  risk_flags:
  - risk: “Takes cover” may suggest a specific situation more strongly than the broader image of hiding oneself.
    mitigation: It preserves the central action of withdrawing from recognized danger.
  - risk: “People without good judgment” explains the wisdom category rather than retaining its traditional label.
    mitigation: It preserves the documented contrast with the sensible person and avoids reducing the term to mere inexperience.
