translation:
  language: en
  text: A prudent man sees danger and takes cover, but naive people keep going and suffer the consequences.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “are punished.” The Hebrew can refer either to punishment or to bearing the consequences.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: hides himself
  simplified_phrase: takes cover
  preserved_meaning: The prudent man withdraws from approaching danger.
  reasoning_layer_used: POB lexical decision for נִסְתָּר
  rationale: “Takes cover” preserves the response-to-danger image in more natural English.
- pob_phrase: the simple pass on
  simplified_phrase: naive people keep going
  preserved_meaning: Undiscerning people continue forward without taking precautions.
  reasoning_layer_used: POB lexical decisions for פְּתָאיִם and עָבְרוּ
  rationale: The wording makes the wisdom term and the contrast in movement immediately clear.
- pob_phrase: suffer for it
  simplified_phrase: suffer the consequences
  preserved_meaning: Their failure to avoid danger brings harm or penalty upon them.
  reasoning_layer_used: POB lexical decision for נֶעֱנָשׁוּ
  rationale: “Suffer the consequences” states the implied result without limiting it to judicial punishment.
translation_notes:
  risk_flags:
  - risk: “Takes cover” may sound mainly like protection from physical danger.
    mitigation: The broad word “danger” leaves the proverb applicable to any foreseeable harm.
  - risk: “Suffer the consequences” may weaken the possible sense of punishment.
    mitigation: The footnote preserves “are punished” as a valid lexical alternative.
