translation:
  language: en
  text: Take his garment as collateral because he has guaranteed a stranger’s debt; require a pledge from him because he has done so for a foreign woman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can mean a non-Israelite woman or, in Proverbs, a woman involved in a socially or morally forbidden relationship.
    reason: lexical_alternative
