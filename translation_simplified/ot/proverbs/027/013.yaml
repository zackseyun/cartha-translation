translation:
  language: en
  text: Take his garment as collateral, because he guaranteed a stranger’s debt. If he guarantees a foreign woman’s debt, take collateral from him.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew second line is terse. It can also be understood as, “Hold the garment as security for a foreign woman.”
    reason: lexical_alternative
  - marker: b
    text: In Proverbs, “foreign woman” may mean either a non-Israelite woman or a woman involved in a socially or morally forbidden relationship.
    reason: lexical_alternative
