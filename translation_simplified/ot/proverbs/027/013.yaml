- pob_phrase: Take his garment
  simplified_phrase: Take his garment as collateral
  preserved_meaning: The garment is to be taken as security for the man’s risky guarantee.
  reasoning_layer_used: Lexical decisions for בִּגְדוֹ and חַבְלֵהוּ and the collateral context
  rationale: Naming collateral makes the ancient financial practice clear without narrowing the kind of garment.
- pob_phrase: he has put up security for a stranger
  simplified_phrase: he has guaranteed a stranger’s debt
  preserved_meaning: He has made himself responsible for the financial obligation of someone outside his close circle.
  reasoning_layer_used: Lexical decision for עָרַב
  rationale: Guaranteeing another person’s debt expresses the legal-financial sense in familiar English.
- pob_phrase: take a pledge from him for a foreign woman
  simplified_phrase: require a pledge from him because he has done so for a foreign woman
  preserved_meaning: The man who gave the guarantee must provide the collateral.
  reasoning_layer_used: Applied source-audit revision concerning the masculine singular suffix of חַבְלֵהוּ
  rationale: The wording clearly identifies the man, rather than the woman or garment, as the source of the pledge.
