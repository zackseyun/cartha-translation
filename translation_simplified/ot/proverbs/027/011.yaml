- pob_phrase: Be wise, my son
  simplified_phrase: My son, be wise
  preserved_meaning: The father directly urges his son to be wise.
  reasoning_layer_used: POB lexical decisions for חֲכַם and בְּנִי
  rationale: The reordered address sounds natural while retaining the command and masculine relationship.
- pob_phrase: and make my heart glad
