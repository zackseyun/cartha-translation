simplification_decisions:
- pob_phrase: Like a bird that wanders from its nest, so is a man
  simplified_phrase: A man ... is like a bird
  preserved_meaning: The man remains the subject of comparison with the wandering bird.
  reasoning_layer_used: POB lexical decision for כֵּן and the proverb's simile structure
  rationale: Reversing the clause order makes the comparison easier to follow without changing it.
- pob_phrase: who wanders from his place
  simplified_phrase: wandering away from his own place
  preserved_meaning: The man is moving restlessly away from the place associated with him.
  reasoning_layer_used: POB lexical decisions for נוֹדֵד and מִמְּקוֹמוֹ
  rationale: “Away from” states the direction naturally, while “place” keeps the Hebrew broad.
- pob_phrase: a bird that wanders from its nest
  simplified_phrase: a bird roaming away from its nest
  preserved_meaning: The concrete image is a bird moving restlessly away from its nest.
  reasoning_layer_used: POB lexical decisions for צִפּוֹר, נוֹדֶדֶת, and קִנָּהּ
  rationale: “Roaming away” gives modern readers the restless motion of the image.
