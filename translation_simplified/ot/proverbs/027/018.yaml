  simplified_phrase: Anyone who takes good care of a fig tree
  preserved_meaning: Careful attention to the tree leads to its fruit.
  reasoning_layer_used: Lexical decision for נֹצֵר and its agricultural context
  rationale: “Takes good care of” makes the practical sense of “tends” immediately clear.
- pob_phrase: and he who watches over his master
  simplified_phrase: In the same way, anyone who faithfully looks after their master
  preserved_meaning: Attentive, faithful care for a human superior parallels tending the tree.
  reasoning_layer_used: Lexical and theological decisions for שֹׁמֵר אֲדֹנָיו
  rationale: The new wording clarifies faithful service while keeping the master human and the two images distinct.
- pob_phrase: will be honored
  simplified_phrase: will be honored
  preserved_meaning: Faithful care results in receiving fitting recognition.
  reasoning_layer_used: Lexical decision for יְכֻבָּד
  rationale: The familiar wording is already clear and preserves honor rather than reducing it to reward.
