translation:
  language: en
  text: Anyone who takes good care of a fig tree will eat its fruit. In the same way, anyone who faithfully looks after their master[a] will be honored.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Looks after” means giving one’s master attentive, faithful care, not merely physical protection.
    reason: lexical_alternative
