simplification_decisions:
- pob_phrase: Whoever blesses his neighbor with a loud voice
  simplified_phrase: Anyone who ... loudly blesses a neighbor
  preserved_meaning: Someone speaks a blessing to another person in a loud, intrusive manner.
  reasoning_layer_used: POB lexical decisions for מְבָרֵךְ, רֵעֵהוּ, and בְּקוֹל גָּדוֹל
  rationale: The adverb and modern general construction make the saying natural without reducing the blessing to a greeting.
- pob_phrase: rising early in the morning
  simplified_phrase: gets up early in the morning
  preserved_meaning: The person deliberately rises early before giving the loud blessing.
  reasoning_layer_used: POB lexical decision for בַּבֹּקֶר הַשְׁכֵּים
  rationale: “Gets up early” conveys the deliberate earliness in ordinary English.
- pob_phrase: it will be counted to him as a curse
  simplified_phrase: will have that blessing counted as a curse
  preserved_meaning: The supposed blessing is ironically reckoned as its opposite.
  reasoning_layer_used: POB lexical decisions for קְלָלָה and תֵּחָשֶׁב לוֹ, with cultural footnote b
  rationale: The wording clarifies the referent while leaving the person making the judgment unstated.
interpretive_expansions:
- pob_phrase: it
  rendering: that blessing
  claim: The loud early-morning blessing is what is counted as a curse.
  evidence:
  - The act of blessing is the natural referent in the immediate context.
  - POB footnote b identifies the blessing as being received like a curse.
  confidence: high
  alternatives_preserved:
  - The reckoning may be by observers or experienced in effect by the person concerned.
  - The wording does not identify who makes the judgment.
translation_notes:
