translation:
  language: en
  text: Even if you pound a fool together with crushed grain, using a mortar and pestle, his foolishness will still not leave him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A mortar is a sturdy bowl, and a pestle is the tool used to pound grain inside it.
    reason: cultural_note
simplification_decisions:
- pob_phrase: grind a fool in a mortar with a pestle among crushed grain
  simplified_phrase: pound a fool together with crushed grain, using a mortar and pestle
  preserved_meaning: The fool is pictured being pounded with grain by the same tools used to crush it.
  reasoning_layer_used: POB lexical decisions and applied revision
  rationale: The recast clause makes the unusual image easier to follow while retaining every concrete element.
- pob_phrase: will not depart from him
  simplified_phrase: will still not leave him
  preserved_meaning: Even extreme physical pounding cannot separate the fool from his ingrained foolishness.
  reasoning_layer_used: POB lexical decision for תָסוּר מֵעָלָיו and concessive אִם
  rationale: “Leave” is more common than “depart,” and “still” reinforces the failed extreme attempt.
