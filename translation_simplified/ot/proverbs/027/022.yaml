translation:
  language: en
  text: Even if you pound a fool in a grain-pounding bowl with a heavy pounding tool, along with the crushed grain,[a] his foolishness will not leave him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew names the bowl and tool as a mortar and pestle, which were used for pounding grain.
    reason: simplification_note
simplification_decisions:
- pob_phrase: grind a fool in a mortar with a pestle
  simplified_phrase: pound a fool in a grain-pounding bowl with a heavy pounding tool
  preserved_meaning: The fool is subjected to the forceful pounding used to process grain.
  reasoning_layer_used: POB lexical decisions for תִּכְתּוֹשׁ, מַּכְתֵּשׁ, and עֱלִי
  rationale: The direct wording explains the unfamiliar tools while preserving the violent image.
- pob_phrase: among crushed grain
  simplified_phrase: along with the crushed grain
  preserved_meaning: The fool is pictured being pounded together with the grain.
  reasoning_layer_used: POB lexical decision for רִיפוֹת and applied revision
  rationale: “Along with” makes the relationship within the image immediately clear.
- pob_phrase: will not depart from him
  simplified_phrase: will not leave him
  preserved_meaning: Even such extreme treatment cannot separate the fool from his ingrained foolishness.
  reasoning_layer_used: POB lexical decisions for תָסוּר מֵעָלָיו and אִוַּלְתּוֹ
  rationale: “Will not leave him” expresses the same idiom in common English.
