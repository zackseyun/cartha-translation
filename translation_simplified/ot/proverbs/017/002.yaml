translation:
  language: en
  text: A slave[a] who acts wisely will have authority over a son who brings shame. He will receive a share of the inheritance along with the brothers.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “servant.” The Hebrew refers to a bonded subordinate; “slave” preserves the proverb’s striking social reversal.
    reason: lexical_alternative
  - marker: b
    text: Or “siblings.” The Hebrew says “brothers” and likely refers to the family heirs.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: A prudent slave
  simplified_phrase: A slave who acts wisely
  preserved_meaning: The slave behaves with practical wisdom and insight.
  reasoning_layer_used: Lexical decision for מַשְׂכִּיל
  rationale: The verbal phrase makes practical wisdom clearer than the less familiar adjective “prudent.”
- pob_phrase: will rule over
  simplified_phrase: will have authority over
  preserved_meaning: The wise slave will hold authority over the disgraceful son.
  reasoning_layer_used: Lexical decision for יִמְשֹׁל
  rationale: This wording explains the kind of rule without weakening the social reversal.
- pob_phrase: among brothers he will share the inheritance
  simplified_phrase: He will receive a share of the inheritance along with the brothers
  preserved_meaning: The slave will be included with the family heirs in receiving inherited property.
  reasoning_layer_used: Lexical decisions for יַחֲלֹק, נַחֲלָה, and וּבְתוֹךְ אַחִים
  rationale: The recast sentence states the inheritance arrangement in ordinary English.
interpretive_expansions:
- pob_phrase: he will share the inheritance
  rendering: He will receive a share of the inheritance
  claim: The slave receives an apportioned portion rather than merely helping divide the estate.
  evidence:
  - The POB lexical rationale says the verb here means to share in or receive a portion of the inheritance.
  - The surrounding phrase places him among the family heirs.
  confidence: high
  alternatives_preserved:
  - he will share the inheritance
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “slave” only through modern race-based chattel slavery.
    mitigation: The footnote identifies the broader Hebrew sense while preserving the bonded status central to the proverb.
  - risk: “Brothers” may sound as though other possible family heirs are excluded.
    mitigation: The footnote preserves “siblings” as a possible broader sense without replacing the Hebrew masculine term.
