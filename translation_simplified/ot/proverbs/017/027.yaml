translation:
  language: en
  text: Whoever holds back his words has knowledge. A discerning man[a] is calm.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “man,” using a masculine singular form to express a general truth about a discerning person.
    reason: cultural_note
  - marker: b
    text: The Hebrew literally says “is cool in spirit,” using temperature as an image of calm self-control.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: restrains his words
  simplified_phrase: holds back his words
  preserved_meaning: The person limits what he says through self-control.
  reasoning_layer_used: Lexical decision for חוֹשֵׂךְ
  rationale: “Holds back” is a documented alternative and is more common in everyday English.
- pob_phrase: a man of understanding
  simplified_phrase: a discerning man
  preserved_meaning: The man is characterized by understanding and discernment.
  reasoning_layer_used: Lexical and theological decisions for אִישׁ תְּבוּנָה
  rationale: “Discerning” states the quality directly while retaining the source’s masculine form.
- pob_phrase: is cool in spirit
  simplified_phrase: is calm
  preserved_meaning: The discerning man has emotional composure and self-control.
  reasoning_layer_used: Lexical decisions for וְקַר and רוּחַ
  rationale: “Is calm” gives the established idiomatic sense clearly, while the footnote preserves the temperature image.
interpretive_expansions:
- pob_phrase: is cool in spirit
  rendering: is calm
  claim: The temperature image describes emotional composure and self-control.
  evidence:
