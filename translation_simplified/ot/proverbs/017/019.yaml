- pob_phrase: Whoever loves transgression
  simplified_phrase: Those who love rebellion
  preserved_meaning: The wrongdoing is willful and morally serious, not an accidental mistake.
  reasoning_layer_used: POB lexical decision for פֶּשַׁע
  rationale: “Rebellion” is more immediately understandable than “transgression” while retaining its force.
- pob_phrase: loves strife
  simplified_phrase: love conflict
  preserved_meaning: Taking pleasure in wrongdoing goes together with taking pleasure in contention.
  reasoning_layer_used: POB lexical decision for מַצָּה
  rationale: “Conflict” expresses the proverb’s broad scope in common English.
- pob_phrase: makes his door high
  simplified_phrase: raise their doorway high
  preserved_meaning: The concrete architectural image and its possible figurative force remain intact.
  reasoning_layer_used: POB lexical decisions for מַגְבִּיהַּ and פִּתְחוֹ
  rationale: The plural generic form reads naturally without resolving the image’s ambiguity.
