translation:
  language: en
  text: Those who love rebellion love conflict. Those who raise their doorway high are inviting ruin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “seek ruin.” The high doorway may suggest proud self-exaltation, showy building, or conduct that invites disaster.
