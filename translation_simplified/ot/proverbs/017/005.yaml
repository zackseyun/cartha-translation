translation:
  language: en
  text: Anyone who mocks a poor person insults God, who made that person. Anyone who is glad when disaster strikes will not go unpunished.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the poor
  simplified_phrase: a poor person
  preserved_meaning: The proverb condemns contempt toward any person who is poor.
  reasoning_layer_used: Lexical decision for לָרָשׁ and proverbial context
  rationale: The singular wording makes the personal offense clearer in modern English.
- pob_phrase: his Maker
  simplified_phrase: God, who made that person
  preserved_meaning: Mocking a poor person insults God as that person's Creator.
  reasoning_layer_used: Theological decision on the referent of עֹשֵׂהוּ
  rationale: The clause explains the biblical title without weakening its theological point.
- pob_phrase: rejoices at calamity
  simplified_phrase: is glad when disaster strikes
  preserved_meaning: Taking pleasure in ruin or misfortune is condemned.
  reasoning_layer_used: Lexical decisions for שָׂמֵחַ and לְאֵיד
  rationale: The concrete clause is easier to understand than the abstract phrase.
interpretive_expansions:
- pob_phrase: his Maker
  rendering: God, who made that person
  claim: The Maker is God, and the possessive relation points to the poor person.
  evidence:
  - The suffix in עֹשֵׂהוּ naturally refers back to the poor person.
  - The POB theological decision identifies the Maker as God.
  confidence: high
  alternatives_preserved:
