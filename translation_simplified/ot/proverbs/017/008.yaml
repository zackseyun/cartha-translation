translation:
  language: en
  text: To the person who has it, a bribe seems like a stone that brings favor.[a] Wherever they turn, they succeed.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may suggest a precious stone or a charm thought to bring favor.
    reason: lexical_alternative
  - marker: b
    text: Or “they prosper.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: To its owner
  simplified_phrase: To the person who has it
  preserved_meaning: The proverb presents the bribe from the perspective of the person who possesses it.
  reasoning_layer_used: Lexical decision for בְּעֵינֵי בְעָלָיו
  rationale: This uses ordinary English while preserving the possessor’s viewpoint.
- pob_phrase: a stone that brings favor
  simplified_phrase: seems like a stone that brings favor
  preserved_meaning: The stone image and its perceived power to gain favor remain intact.
  reasoning_layer_used: Final source audit and lexical decision for אֶבֶן חֵן
  rationale: “Seems like” marks the holder’s viewpoint without deciding whether the stone is precious or a charm.
- pob_phrase: wherever he turns, he succeeds
  simplified_phrase: Wherever they turn, they succeed
  preserved_meaning: The holder remains the subject who succeeds in every direction or undertaking.
  reasoning_layer_used: Lexical decisions for אֶל כָּל אֲשֶׁר יִפְנֶה and יַשְׂכִּיל
  rationale: Singular “they” removes the unclear pronoun while preserving the Hebrew subject relationship.
translation_notes:
  risk_flags:
  - risk: The verse could sound as though it approves of bribery.
    mitigation: “Seems like” clearly frames the claim as the bribe holder’s perspective.
