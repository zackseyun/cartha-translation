- pob_phrase: Whoever repays evil for good
  simplified_phrase: If anyone repays good with evil
  preserved_meaning: A person responds to good by doing evil in return.
  reasoning_layer_used: POB lexical decisions for מֵשִׁיב, תַּחַת, רָעָה, and טוֹבָה
  rationale: The conditional form and familiar word order make the exchange easier to grasp.
- pob_phrase: evil will not depart from his house
  simplified_phrase: evil will not leave their household
  preserved_meaning: Evil or its harmful consequence remains attached to the offender’s home or family sphere.
