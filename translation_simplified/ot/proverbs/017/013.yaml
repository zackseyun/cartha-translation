translation:
  language: en
  text: If anyone repays good with evil, evil[a] will not leave their household.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “disaster.” The second occurrence of the Hebrew word can mean evil or the disaster that follows.
    reason: lexical_alternative
