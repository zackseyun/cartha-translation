translation:
  language: en
  text: Starting a conflict is like letting water escape through a break. Leave the quarrel before it breaks out.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb is difficult and may also mean “bursts forth” or “is exposed/escalates.” The point is to stop the quarrel before it becomes unmanageable.
    reason: lexical_alternative
