  simplified_phrase: Grand words do not fit a fool
  preserved_meaning: Elevated or overblown speech is inappropriate for a morally deficient fool.
  reasoning_layer_used: POB lexical decisions and footnote a
  rationale: “Grand words” states the broad Hebrew sense in familiar English without implying moral excellence.
- pob_phrase: much less do lying lips suit a nobleman
  simplified_phrase: Lying lips fit a nobleman even less
  preserved_meaning: False speech is especially inappropriate for someone of noble rank or character.
  reasoning_layer_used: POB lexical decisions and footnote b
  rationale: The shorter comparison preserves both the intensification and the concrete image of lying lips.
