translation:
  language: en
  text: It is also wrong to punish a righteous man or to strike people of high rank because they do what is right.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The last clause may instead mean “or to strike leaders contrary to justice.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term translated “people of high rank” may also be rendered “nobles,” “princes,” or “leaders.”
    reason: lexical_alternative
