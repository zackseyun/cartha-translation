translation:
  language: en
  text: A rebellious man looks for nothing but evil. A cruel messenger[a] will be sent to punish him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a cruel angel.” The Hebrew word can mean either “messenger” or “angel.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: seeks only evil
  simplified_phrase: looks for nothing but evil
  preserved_meaning: His pursuit is restricted to evil.
  reasoning_layer_used: Lexical decision for אַךְ and יְבַקֶּשׁ
  rationale: The common phrase “nothing but” clearly preserves the emphatic force of “only.”
- pob_phrase: and a cruel messenger will be sent against him
  simplified_phrase: A cruel messenger will be sent to punish him
  preserved_meaning: A harsh agent will be dispatched against the rebellious man.
  reasoning_layer_used: Lexical decisions for מַלְאָךְ, אַכְזָרִי, יְשֻׁלַּח, and בּוֹ
  rationale: A new sentence and an explicit purpose make the consequence easier to understand.
interpretive_expansions:
- pob_phrase: sent against him
  rendering: sent to punish him
  claim: The messenger is sent as an agent of punishment against the rebellious man.
  evidence:
  - The hostile sense of בּוֹ is reflected in POB’s “against him.”
  - The lexical rationale describes the messenger’s direction as punitive.
  - The second line presents the consequence of seeking evil.
  confidence: high
  alternatives_preserved:
  - sent against him
translation_notes:
  risk_flags:
  - risk: “Messenger” may be understood only as a human courier.
    mitigation: The footnote preserves the possible supernatural reading “angel.”
