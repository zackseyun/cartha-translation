translation:
  language: en
  text: Even a fool seems wise when he keeps quiet; when he closes his lips, he seems discerning.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: who keeps silent is considered wise
  simplified_phrase: seems wise when he keeps quiet
  preserved_meaning: Silence can make even a fool appear wise to others.
  reasoning_layer_used: Lexical decisions for מַחֲרִישׁ and חָכָם יֵחָשֵׁב
  rationale: The reordered clause is easier to read while keeping the passive sense of being regarded as wise.
- pob_phrase: one who closes his lips, discerning
  simplified_phrase: when he closes his lips, he seems discerning
  preserved_meaning: Restraint in speech can make a person appear discerning.
  reasoning_layer_used: Lexical decisions for אֹטֵם, שְׂפָתָיו, and נָבוֹן
  rationale: Adding the repeated verb completes the English sentence while preserving the concrete image of closed lips.
translation_notes:
  risk_flags:
