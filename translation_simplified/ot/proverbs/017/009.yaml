translation:
  language: en
  text: If you cover over an offense,[a] you seek love. But if you keep bringing it up, you drive close friends apart.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: To “cover over” an offense means not exposing it or dwelling on it; the Hebrew preserves the image of covering rather than directly saying “forgive.”
    reason: simplification_note
