  rationale: The direct conditional form makes the proverb easier to follow while retaining its covering image and moral logic.
- pob_phrase: he who repeats a matter
  simplified_phrase: if you keep bringing it up
  preserved_meaning: Repeatedly revisiting the offense damages the relationship.
  reasoning_layer_used: POB footnote b and lexical decisions for שֹׁנֶה and בְדָבָר
  rationale: This wording clearly expresses revisiting an offense rather than merely repeating words.
- pob_phrase: separates close friends
