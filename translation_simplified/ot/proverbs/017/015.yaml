translation:
  language: en
  text: Yahweh detests both the person who declares a wicked person innocent and the person who declares a righteous person guilty.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The one who acquits the wicked
  simplified_phrase: the person who declares a wicked person innocent
  preserved_meaning: A morally culpable person receives a wrongful legal verdict.
  reasoning_layer_used: Lexical decision for מַצְדִּיק and רָשָׁע
  rationale: The wording explains the courtroom sense of “acquits” without narrowing “wicked” to merely “guilty.”
- pob_phrase: the one who condemns the righteous
  simplified_phrase: the person who declares a righteous person guilty
  preserved_meaning: A person who is in the right receives a wrongful guilty verdict.
  reasoning_layer_used: Lexical and theological decisions for וּמַרְשִׁיעַ and צַדִּיק
  rationale: The clearer verdict language preserves both the judicial contrast and the moral force of “righteous.”
- pob_phrase: both alike are an abomination to Yahweh
  simplified_phrase: Yahweh detests both
  preserved_meaning: Each perversion of justice is equally loathsome to Yahweh.
  reasoning_layer_used: Lexical decisions for תּוֹעֲבַת, יְהוָה, and גַּם שְׁנֵיהֶם
  rationale: The active sentence uses common English while retaining the strong divine rejection and equal emphasis.
translation_notes:
  risk_flags:
