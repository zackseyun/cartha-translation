translation:
  language: en
  text: A man’s words are like deep water; the fountain of wisdom is a flowing brook.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “A man’s words are deep waters—a flowing brook, a fountain of wisdom.” The Hebrew may use all three water images to describe the man’s words.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: The words of a man's mouth
  simplified_phrase: A man’s words
  preserved_meaning: The saying concerns the words spoken by an individual man.
  reasoning_layer_used: POB lexical decision for פִי אִישׁ
  rationale: The shorter phrase removes an unnecessary English idiom without changing who speaks.
- pob_phrase: are deep waters
  simplified_phrase: are like deep water
  preserved_meaning: The man’s words are pictured through the concrete image of deep water.
  reasoning_layer_used: POB lexical decisions for מַיִם and עֲמֻקִּים
  rationale: Making the comparison explicit helps readers recognize the metaphor without defining what the depth implies.
- pob_phrase: the fountain of wisdom is a flowing brook
  simplified_phrase: the fountain of wisdom is a flowing brook
  preserved_meaning: Wisdom’s fountain is directly identified with a brook whose water is actively flowing.
  reasoning_layer_used: POB lexical decisions for נַחַל, נֹבֵעַ, and מְקוֹר חָכְמָה
  rationale: The direct predicate is retained because changing it to “flows like” would weaken the Hebrew water image.
