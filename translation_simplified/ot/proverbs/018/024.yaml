translation:
  language: en
  text: A man may have many companions and still come to ruin.[a] Yet there is a friend who sticks closer than a brother.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “A man with many companions must show himself friendly.” The Hebrew verb is difficult and can be understood in more than one way.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: A man of many companions
  simplified_phrase: A man may have many companions
  preserved_meaning: The man has many associates, who are distinct from the loyal friend in the second line.
  reasoning_layer_used: Lexical decision for רֵעִים and the contextual contrast
  rationale: The verbal form is easier to read and avoids suggesting that the companions physically surround him.
- pob_phrase: may come to ruin
  simplified_phrase: and still come to ruin
  preserved_meaning: Having many companions does not prevent a disastrous outcome.
  reasoning_layer_used: Lexical decision for לְהִתְרֹעֵעַ and the contrast between the two lines
  rationale: “Still” makes the contrast clear without making ruin inevitable.
- pob_phrase: but there is a friend
  simplified_phrase: Yet there is a friend
  preserved_meaning: One deeply loyal friend contrasts with the man's many companions.
  reasoning_layer_used: Lexical decision for וְיֵשׁ and the proverb's parallel structure
  rationale: A new sentence makes the contrast easier to follow while preserving its force.
interpretive_expansions:
- pob_phrase: A man of many companions may come to ruin
  rendering: A man may have many companions and still come to ruin
  claim: Many companions do not necessarily protect someone from ruin.
  evidence:
  - The second line contrasts numerous companions with one closely attached friend.
  - POB’s rationale says that having many companions can still end badly.
  confidence: high
  alternatives_preserved:
  - The footnote preserves the reading “must show himself friendly.”
