translation:
  language: en
  text: The first person to tell his side of a dispute seems to be right—until the other person comes and questions him.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The first to present his case
  simplified_phrase: The first person to tell his side of a dispute
  preserved_meaning: The first party speaks first in a dispute and gives his account.
  reasoning_layer_used: Lexical decisions for הָרִאשׁוֹן, בְּרִיבוֹ, and יבא
  rationale: This replaces formal legal wording with language common readers readily understand.
- pob_phrase: his neighbor
  simplified_phrase: the other person
  preserved_meaning: The second party in the dispute now responds.
  reasoning_layer_used: Lexical decision for רֵעֵהוּ and the POB footnote
  rationale: In this adversarial setting, “the other person” avoids the misleading modern sense of someone living nearby.
- pob_phrase: examines him
  simplified_phrase: questions him
  preserved_meaning: The second person tests the first speaker's claims rather than merely listening.
  reasoning_layer_used: Lexical decision for וַחֲקָרוֹ
  rationale: “Questions him” communicates scrutiny without the technical force of “cross-examines.”
