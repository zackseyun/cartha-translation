translation:
  language: en
  text: The first person to tell his side of a dispute seems right—until the other person involved comes and questions him closely.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The first to present his case
  simplified_phrase: The first person to tell his side of a dispute
  preserved_meaning: The first speaker gives his account in a contested matter.
  reasoning_layer_used: POB lexical decisions for הָרִאשׁוֹן and בְּרִיבוֹ
  rationale: This replaces formal legal wording with a clear description while retaining the dispute setting.
- pob_phrase: examines him
  simplified_phrase: questions him closely
  preserved_meaning: The second speaker tests the first speaker’s claims through careful scrutiny.
  reasoning_layer_used: POB lexical decision for וַחֲקָרוֹ
  rationale: This makes the act of examination concrete without using the technical term “cross-examines.”
interpretive_expansions:
- pob_phrase: his neighbor
  rendering: the other person involved
  claim: The neighbor is the other participant in the dispute, not merely someone who lives nearby.
  evidence:
