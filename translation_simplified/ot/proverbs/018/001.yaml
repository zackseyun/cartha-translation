translation:
  language: en
  text: Those who isolate themselves pursue their own desires; they lash out against all sound judgment.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The second line may also mean, “They quarrel with all sound wisdom.” The Hebrew verb is rare and difficult.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Whoever isolates himself seeks his own desire
  simplified_phrase: Those who isolate themselves pursue their own desires
  preserved_meaning: Self-isolation is driven by the person’s own wants rather than community and counsel.
  reasoning_layer_used: POB lexical decisions for נִפְרָד, לְתַאֲוָה, and יְבַקֵּשׁ
  rationale: The plural form is natural modern English, and “pursue” clearly expresses purposeful seeking.
- pob_phrase: he breaks out against all sound judgment
  simplified_phrase: they lash out against all sound judgment
  preserved_meaning: The isolated person responds to good judgment with forceful hostility or contention.
  reasoning_layer_used: POB lexical decisions for בְּכָל, תּוּשִׁיָּה, and יִתְגַּלָּע
  rationale: “Lash out” makes the hostile image understandable while the note preserves the verb’s uncertainty.
translation_notes:
  risk_flags:
  - risk: “Lash out” may suggest a sharper emotional outburst than the rare Hebrew verb certainly establishes.
    mitigation: The footnote gives the less vivid alternative “quarrel” and identifies the Hebrew uncertainty.
  - risk: The proverb could be misread as condemning every kind of solitude.
    mitigation: “Isolate themselves” retains the POB sense of deliberate separation from community and counsel.
