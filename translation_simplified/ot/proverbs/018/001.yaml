translation:
  language: en
  text: Those who cut themselves off from others pursue what they want for themselves; they lash out against every sound judgment.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The second line may also mean, “They quarrel with all sound wisdom.” The Hebrew verb is rare and difficult.
