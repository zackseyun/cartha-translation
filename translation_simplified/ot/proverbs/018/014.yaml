translation:
  language: en
  text: A person's spirit can carry them through illness. But who can endure a crushed spirit?
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: A man's spirit
  simplified_phrase: A person's spirit
  preserved_meaning: The proverb speaks generally about any person's inner spirit.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: The source masculine is representative, so “person” makes its general force immediately clear.
- pob_phrase: can sustain him in sickness
  simplified_phrase: can carry them through illness
  preserved_meaning: A person's inner spirit can support that person while physically ill.
  reasoning_layer_used: POB lexical decisions for יְכַלְכֵּל and מַחֲלֵהוּ
  rationale: “Carry them through” expresses sustaining someone during illness in natural common English.
- pob_phrase: but a crushed spirit—who can bear it?
  simplified_phrase: But who can endure a crushed spirit?
  preserved_meaning: A deeply broken inner spirit is extraordinarily difficult to bear.
  reasoning_layer_used: POB lexical decisions for נְכֵאָה and יִשָּׂאֶנָּה
  rationale: The direct question is easier to follow while retaining the vivid image and rhetorical force.
