translation:
  language: en
  text: A man's[a] heart rises with pride before destruction, but humility comes before honor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “man” is used in the general sense of any person.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a man's heart is haughty
  simplified_phrase: a man's heart rises with pride
  preserved_meaning: The heart's rising expresses a proud and arrogant attitude.
  reasoning_layer_used: The lexical decision explains that the Hebrew literally depicts the heart as high but idiomatically means pride.
  rationale: This wording uses common language while retaining the Hebrew image of the heart rising.
- pob_phrase: and before honor comes humility
  simplified_phrase: but humility comes before honor
  preserved_meaning: Humility precedes honor in contrast to pride preceding destruction.
  reasoning_layer_used: The lexical decisions and parallel structure establish the contrast between destruction and honor.
  rationale: Adding “but” makes the proverb's contrast immediately clear without changing its meaning.
translation_notes:
  risk_flags:
