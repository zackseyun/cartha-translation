- pob_phrase: harder to win
  simplified_phrase: harder to win over
  preserved_meaning: The offended brother is exceptionally difficult to approach successfully after the relational breach.
  reasoning_layer_used: POB lexical decision and applied revision
  rationale: “Win over” completes the English idiom without adding the rejected idea of winning him back.
- pob_phrase: the bar of a citadel
  simplified_phrase: the bar that locks a citadel’s gate
  preserved_meaning: Quarrels create a formidable barrier like a citadel’s securing bar.
  reasoning_layer_used: POB lexical decision and defensive imagery
  rationale: Naming the bar’s ordinary function makes the ancient defensive image immediately understandable.
