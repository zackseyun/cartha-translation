translation:
  language: en
  text: A brother who has been offended is harder to win back than a fortified city. Quarrels are like the bars that lock a citadel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Offended” can also mean “wronged,” and “citadel” can also be translated “palace.”
    reason: lexical_alternative
