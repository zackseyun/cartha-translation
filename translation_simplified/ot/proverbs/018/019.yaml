translation:
  language: en
  text: An offended brother is harder to win over than a fortified city.[a] Quarrels are like the bar that locks a citadel’s gate.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “A wronged brother.” The Hebrew may describe a brother who has been offended or wronged.
    reason: lexical_alternative
  - marker: b
    text: The word translated “citadel” can also mean “palace” or “fortified residence.”
    reason: lexical_alternative
