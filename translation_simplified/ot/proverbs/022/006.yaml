translation:
  language: en
  text: Begin training a boy according to his way.[a] Even when he grows old, he will not turn away from that path.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Train a boy in the way he should go.” The Hebrew says “according to his way,” which can be understood in more than one way.
    reason: alternative_reading
  - marker: b
    text: “Boy” is the Hebrew masculine singular term for a young person. This proverb gives a general principle, not a promise with no exceptions.
    reason: cultural_note
