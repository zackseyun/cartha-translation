  preserved_meaning: Training begins as a formative process during youth.
  reasoning_layer_used: Lexical decision for חֲנֹךְ and לַנַּעַר
  rationale: “Begin training” makes the initiating sense clear without weakening the command.
- pob_phrase: even when he grows old he will not turn from it
  simplified_phrase: Even when he grows old, he will not turn away from that path
  preserved_meaning: The boy is expected to remain on the same way into old age.
  reasoning_layer_used: Lexical decisions for יַזְקִין, לֹא יָסוּר, and מִמֶּנָּה
  rationale: “That path” gives the pronoun a clear antecedent while preserving the biblical way image.
