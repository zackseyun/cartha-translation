translation:
  language: en
  text: A prudent person sees danger and takes cover, but naive people keep going and suffer the consequences.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “are punished”; the Hebrew can refer either to a penalty or to suffering the results of one’s actions.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: A prudent man
  simplified_phrase: A prudent person
  preserved_meaning: The proverb describes someone who recognizes danger and acts wisely.
  reasoning_layer_used: lexical decision for עָרוּם and proverbial context
  rationale: “Person” makes the general application clear while retaining the positive sense of prudence.
- pob_phrase: hides himself
  simplified_phrase: takes cover
  preserved_meaning: The prudent person withdraws to avoid the danger.
  reasoning_layer_used: lexical decision for וַיִּסָּתֵר
  rationale: “Takes cover” preserves the protective hiding image in natural English.
- pob_phrase: the simple pass on and suffer for it
  simplified_phrase: naive people keep going and suffer the consequences
  preserved_meaning: Those lacking discernment continue into danger and experience its harmful result.
  reasoning_layer_used: lexical decisions for פְתָיִם, עָבְרוּ, and וְנֶעֱנָשׁוּ
  rationale: The wording clearly describes inexperience, continued movement, and resulting harm without deciding between punishment and natural consequences.
translation_notes:
  risk_flags:
  - risk: “Naive” may sound less like an established biblical wisdom term than “the simple.”
    mitigation: It directly conveys the POB lexical rationale that these people lack experience and discernment.
