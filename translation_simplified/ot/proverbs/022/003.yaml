translation:
  language: en
  text: A man with good judgment notices danger and takes cover. But naive people keep going and suffer the consequences.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: A prudent man
  simplified_phrase: A man with good judgment
  preserved_meaning: The man acts with wise discernment rather than craftiness.
  reasoning_layer_used: POB lexical decision for עָרוּם
  rationale: The phrase explains prudence in familiar language while retaining the masculine singular form.
- pob_phrase: sees danger and hides himself
  simplified_phrase: notices danger and takes cover
  preserved_meaning: He recognizes a threatening circumstance and withdraws for protection.
  reasoning_layer_used: POB lexical decisions for רָאָה, רָעָה, and וַיִּסָּתֵר
  rationale: This keeps the concrete image of seeing danger and responding protectively.
- pob_phrase: the simple pass on and suffer for it
  simplified_phrase: naive people keep going and suffer the consequences
  preserved_meaning: Those lacking discernment continue ahead and experience harm without specifying judicial punishment.
  reasoning_layer_used: POB lexical decisions for פְתָיִם, עָבְרוּ, and וְנֶעֱנָשׁוּ
  rationale: The wording makes the wisdom contrast and resulting harm immediately clear.
translation_notes:
  risk_flags:
  - risk: “Naive people” may sound more fixed than the wisdom term for those who lack experience and discernment.
    mitigation: The contrast with good judgment keeps the term focused on teachable lack of discernment.
