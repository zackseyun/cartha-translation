simplification_decisions:
- pob_phrase: Incline your ear and hear
  simplified_phrase: Turn your ear toward ... and listen
  preserved_meaning: The physical image and the two commands still express deliberate attention.
  reasoning_layer_used: POB lexical decisions for הַט, אָזְנְךָ, and וּשְׁמַע
  rationale: “Turn” and “listen” make the image immediately understandable without collapsing it.
- pob_phrase: set your heart on my knowledge
  simplified_phrase: Take my knowledge to heart
  preserved_meaning: The hearer must deliberately receive the speaker’s knowledge in thought and will.
  reasoning_layer_used: POB lexical decisions for וְלִבְּךָ, תָּשִׁית, and לְדַעְתִּי
  rationale: The familiar English expression preserves both the heart language and the call for inward commitment.
