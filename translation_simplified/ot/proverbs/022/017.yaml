translation:
  language: en
  text: Turn your ear toward the words of the wise and listen to them. Take my knowledge to heart.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Take my teaching to heart.” The Hebrew may mean the speaker’s knowledge or the teaching that comes from it.
