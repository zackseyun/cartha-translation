simplification_decisions:
- pob_phrase: He who loves purity of heart
  simplified_phrase: Those who love purity of heart
  preserved_meaning: The proverb describes any person who values inner moral purity.
  reasoning_layer_used: The lexical decision treats the participle as a generic personal expression.
  rationale: A generic plural is clearer and avoids cumbersome gendered wording.
- pob_phrase: whose speech is gracious
  simplified_phrase: speak graciously
  preserved_meaning: The person’s words are marked by grace and pleasantness.
  reasoning_layer_used: The lexical decisions identify “lips” as a figure for speech and חֵן as its gracious quality.
  rationale: The verb phrase states the same idea in direct, common English.
- pob_phrase: the king is his friend
  simplified_phrase: have the king as their friend
  preserved_meaning: Such people enjoy friendship with the ruler.
  reasoning_layer_used: The lexical decisions retain “friend” and prefer “the king” while acknowledging a generic reading.
  rationale: This wording fits the plural subject while preserving the proverb’s relational promise.
translation_notes:
  risk_flags:
