translation:
  language: en
  text: Foolishness is tied tightly to a boy’s heart; the rod of discipline will drive it far away from him.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Folly is bound up
  simplified_phrase: Foolishness is tied tightly
  preserved_meaning: Moral senselessness is deeply attached to the boy’s inner life.
  reasoning_layer_used: Lexical decisions for אִוֶּלֶת and קְשׁוּרָה
  rationale: Common words preserve both the moral meaning and the image of close attachment.
- pob_phrase: in the heart of a boy
  simplified_phrase: to a boy’s heart
  preserved_meaning: The source refers to a male youth and keeps the heart as the center of thought, will, and desire.
  reasoning_layer_used: Lexical and theological decisions for בְלֶב and נָעַר
  rationale: The possessive form reads naturally while retaining the source’s heart image and masculine referent.
- pob_phrase: the rod of discipline will drive it far from him
  simplified_phrase: the rod of discipline will drive it far away from him
  preserved_meaning: Concrete corrective discipline causes foolishness to become distant from the boy.
  reasoning_layer_used: Lexical and theological decisions for שֵׁבֶט מוּסָר and יַרְחִיקֶנָּה
  rationale: Adding “away” makes the separation natural in English without softening the rod image.
translation_notes:
  risk_flags:
  - risk: Modern readers may hear “rod” only as punishment rather than corrective training.
    mitigation: The phrase “of discipline” preserves the broader formative sense documented by POB.
  - risk: Modern readers may understand “heart” as emotion alone.
    mitigation: The source metaphor is retained because replacing it would hide Hebrew thought, will, and desire.
