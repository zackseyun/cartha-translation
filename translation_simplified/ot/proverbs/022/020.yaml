translation:
  language: en
  text: Have I not written thirty sayings for you, full of advice and knowledge?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Have I not written for you before now about advice and knowledge?” The Hebrew expression is difficult; many understand it as “thirty,” referring to a collection of sayings.
    reason: alternative_reading
  - marker: b
    text: Some traditional English versions have “excellent things” instead of “thirty sayings,” based on another interpretation of the difficult Hebrew expression.
    reason: lexical_alternative
