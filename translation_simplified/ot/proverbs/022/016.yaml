simplification_decisions:
- pob_phrase: One who oppresses the poor
  simplified_phrase: Those who exploit the poor
  preserved_meaning: The action is ongoing economic and social abuse of poor people.
  reasoning_layer_used: Lexical decisions for עֹשֵׁק and דָּל
  rationale: “Exploit” clearly conveys oppression for personal gain in this economic setting.
- pob_phrase: to increase his own wealth
  simplified_phrase: to make themselves richer
  preserved_meaning: The oppressors seek their own financial benefit.
  reasoning_layer_used: Lexical decision for לְהַרְבּוֹת לוֹ
  rationale: This wording states the same purpose in ordinary English.
- pob_phrase: both come only to poverty
  simplified_phrase: will both end up with nothing but poverty
  preserved_meaning: Both practices lead specifically and restrictively to economic lack.
  reasoning_layer_used: Lexical decisions for אַךְ and לְמַחְסוֹר
  rationale: “Nothing but” preserves the Hebrew particle’s restrictive emphasis.
