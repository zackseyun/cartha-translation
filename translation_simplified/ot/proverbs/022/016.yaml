translation:
  language: en
  text: Those who exploit the poor to make themselves richer, and those who give to the rich, will both end up with nothing but poverty.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The compressed Hebrew may instead refer to one person: “Whoever exploits the poor to become richer and gives to the rich will end up with nothing but poverty.”'
