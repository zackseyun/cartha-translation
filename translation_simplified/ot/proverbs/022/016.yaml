translation:
  language: en
  text: Anyone who exploits poor people to grow richer, or gives to the rich,[a] will end up with nothing but poverty.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may instead describe one person who both exploits the poor and gives to the rich; that person ends in poverty.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: One who oppresses the poor
  simplified_phrase: Anyone who exploits poor people
  preserved_meaning: The person takes unfair advantage of people who are poor or socially weak.
  reasoning_layer_used: POB lexical decision for עֹשֵׁק and דָּל
  rationale: “Exploits” clearly conveys economic oppression in this context.
- pob_phrase: to increase his own wealth
  simplified_phrase: to grow richer
  preserved_meaning: The exploitation is intended to benefit the oppressor financially.
  reasoning_layer_used: POB lexical decision for לְהַרְבּוֹת לוֹ
  rationale: The shorter phrase states the same purpose in ordinary English.
- pob_phrase: will come only to poverty
  simplified_phrase: will end up with nothing but poverty
  preserved_meaning: The emphatic result is poverty rather than gain.
  reasoning_layer_used: POB lexical decisions for אַךְ and לְמַחְסוֹר
  rationale: “Nothing but” preserves the force of “only” while making the outcome natural in English.
translation_notes:
  risk_flags:
  - risk: Using “or” may obscure the possible reading that one person performs both actions.
    mitigation: The footnote preserves the cumulative reading allowed by the compressed Hebrew.
