translation:
  language: en
  text: Do not rob poor people because they are poor. Do not crush needy people at the city gate, where legal cases are decided.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the poor because he is poor
  simplified_phrase: poor people because they are poor
  preserved_meaning: Poverty is the reason the vulnerable person is targeted for robbery.
  reasoning_layer_used: POB lexical decisions for דָּל and כִּי דַל הוּא
  rationale: The plural wording is natural English and keeps the causal repetition.
- pob_phrase: the afflicted
  simplified_phrase: needy people
  preserved_meaning: The victims are socially vulnerable people exposed to exploitation.
  reasoning_layer_used: POB lexical decision for עָנִי and immediate parallelism
  rationale: “Needy people” is a documented alternative that avoids broadening the command to every kind of suffering.
- pob_phrase: at the gate
  simplified_phrase: at the city gate, where legal cases are decided
  preserved_meaning: The gate is both the physical setting and a place of public judgment.
  reasoning_layer_used: POB footnote a and lexical decision for בַשָּׁעַר
  rationale: The added explanation makes the ancient legal setting immediately clear.
interpretive_expansions:
- pob_phrase: at the gate
  rendering: at the city gate, where legal cases are decided
  claim: The city gate served as a place for legal proceedings and public judgments.
  evidence:
  - POB footnote a explicitly identifies the gate as a place where legal cases and public judgments were decided.
  - The lexical rationale for בַשָּׁעַר confirms its judicial function.
  confidence: high
  alternatives_preserved:
