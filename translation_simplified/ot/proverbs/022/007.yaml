translation:
  language: en
  text: Rich people rule over poor people, and a person who borrows is a slave to the person who lends.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The rich rules over the poor
  simplified_phrase: Rich people rule over poor people
  preserved_meaning: The rich actively exercise rule over the poor as a general social reality.
  reasoning_layer_used: The lexical decisions for עָשִׁיר, בְּרָשִׁים, and יִמְשׁוֹל preserve generic groups and the active sense of ruling over others.
  rationale: The plural wording is natural English while keeping the source’s strong claim of rule.
- pob_phrase: the borrower is a slave to the lender
  simplified_phrase: a person who borrows is a slave to the person who lends
  preserved_meaning: Borrowing places the borrower in severe dependence on the lender.
  reasoning_layer_used: The lexical decisions preserve the borrower-lender relationship and the force of עֶבֶד as “slave.”
  rationale: Expanding the role nouns clarifies the relationship while retaining the forceful slave image.
translation_notes:
  risk_flags:
  - risk: “Slave” may sound like a claim that every loan creates literal legal slavery.
    mitigation: The image is retained because the source deliberately portrays severe dependence on a lender.
