translation:
  language: en
  text: Let us swallow them alive, as Sheol[a] swallows people; let us swallow them whole, like people who go down into the pit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheol is the Hebrew name for the realm of the dead; it may also be translated “the grave.”
    reason: lexical_alternative
  - marker: b
    text: Or “intact”; here “whole” describes their physical condition, not their moral character.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Let us swallow them alive like Sheol
  simplified_phrase: Let us swallow them alive, as Sheol swallows people
  preserved_meaning: The violent speakers compare consuming living victims to Sheol’s consuming power.
  reasoning_layer_used: Lexical decision for נִבְלָעֵם and theological decision to retain Sheol
  rationale: The added verb makes the comparison clear while preserving the swallowing image.
- pob_phrase: and whole like those who go down to the pit
  simplified_phrase: let us swallow them whole, like people who go down into the pit
  preserved_meaning: The victims are pictured as being swallowed intact, like people descending to death.
  reasoning_layer_used: Lexical decisions for וּתְמִימִים and כְּיֹרְדֵי בוֹר
  rationale: The semicolon keeps the parallel clauses together so the final comparison remains tied to the victims.
interpretive_expansions:
- pob_phrase: like Sheol
  rendering: as Sheol swallows people
  claim: The comparison portrays Sheol as consuming people.
  evidence:
  - The lexical rationale identifies Sheol’s consuming character.
  - The preceding verb supplies the swallowing image.
  confidence: high
  alternatives_preserved:
  - like the grave
translation_notes:
  risk_flags:
  - risk: Readers may understand Sheol as only a physical grave.
    mitigation: Footnote a identifies it as the Hebrew realm of the dead.
  - risk: “Whole” may be mistaken for moral blamelessness.
    mitigation: Footnote b explains that it means physically intact.
