  preserved_meaning: Sheol is pictured as consuming people while they are alive.
  reasoning_layer_used: Lexical rationale for כִּשְׁאוֹל and cross-check review
  rationale: The complete comparison makes Sheol’s consuming image easier to understand.
- pob_phrase: and whole like those who go down to the pit
  simplified_phrase: and whole, like people who go down into the pit
  preserved_meaning: The victims are pictured as intact while descending to the realm of death.
  reasoning_layer_used: Lexical decisions for וּתְמִימִים and כְּיֹרְדֵי בוֹר
  rationale: Common wording preserves both physical wholeness and the concrete pit image.
