translation:
  language: en
  text: Let us swallow them alive, as Sheol[a] does, and whole,[b] like people who go down into the pit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheol is the Hebrew name for the realm of the dead; it can also be translated “the grave.”
    reason: lexical_alternative
  - marker: b
    text: Here “whole” means intact or in one piece.
    reason: lexical_alternative
