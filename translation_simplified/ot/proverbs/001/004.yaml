translation:
  language: en
  text: to give practical wisdom to the inexperienced, and knowledge and good judgment to the young man.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the youth” or “a young person.” The Hebrew says “young man,” who may represent young people generally in wisdom instruction.
