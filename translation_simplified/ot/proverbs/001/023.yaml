translation:
  language: en
  text: Turn back when I correct you. Look, I will pour out my spirit to you and make my words known to you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Because personified Wisdom is speaking here, “my spirit” can refer to Wisdom’s own spirit, mind, or inner thought. Some readers see a broader connection with God’s Spirit, but the verse does not directly make that identification.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Turn at my rebuke
  simplified_phrase: Turn back when I correct you
  preserved_meaning: Wisdom calls the hearers to change course in response to her correction.
  reasoning_layer_used: Lexical decisions for תָּשׁוּבוּ and לְתוֹכַחְתִּי
  rationale: This wording makes the required response to Wisdom’s rebuke clear in ordinary English.
- pob_phrase: behold
  simplified_phrase: Look
  preserved_meaning: Wisdom draws attention to the promise that follows.
  reasoning_layer_used: Lexical decision for הִנֵּה
  rationale: “Look” keeps the attention-marking force without archaic wording.
translation_notes:
  risk_flags:
  - risk: Readers may identify “my spirit” only with the Holy Spirit or only with Wisdom’s inner thought.
    mitigation: The footnote preserves both the immediate literary setting and the broader interpretive possibilities.
