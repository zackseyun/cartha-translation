translation:
  language: en
  text: Turn back when I correct you. I will pour out my spirit to you and make my words known to you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “my spirit” can refer to Wisdom’s own spirit, mind, or inner thought. Some readers also see a broader connection with God’s Spirit, but this verse does not directly identify it as God’s Spirit.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Turn at my rebuke
  simplified_phrase: Turn back when I correct you
  preserved_meaning: Wisdom calls the hearers to change course in response to her correction.
  reasoning_layer_used: Lexical decisions for תָּשׁוּבוּ and לְתוֹכַחְתִּי
  rationale: This makes the response relationship clear while preserving the image of turning.
- pob_phrase: behold
  simplified_phrase: sentence break and direct promise
  preserved_meaning: Wisdom draws attention to the promise that follows.
  reasoning_layer_used: Lexical decision for הִנֵּה
  rationale: A short new sentence emphasizes the promise without using an archaic attention word.
- pob_phrase: I will pour out my spirit to you
  simplified_phrase: I will pour out my spirit to you
  preserved_meaning: Wisdom promises an abundant disclosure while retaining the range of “spirit.”
  reasoning_layer_used: Lexical and theological decisions for אַבִּיעָה רוּחִי
  rationale: The pouring image and lowercase “spirit” preserve the metaphor and documented ambiguity.
translation_notes:
  risk_flags:
  - risk: “Turn back” may suggest returning to a physical place.
    mitigation: “When I correct you” makes the moral change of course clear.
  - risk: Readers may identify “my spirit” directly with God’s Spirit.
    mitigation: The footnote preserves the possible senses and denies a direct identification in this verse.
