simplification_decisions:
- pob_phrase: do not walk in the way with them
  simplified_phrase: do not go with them down their road
  preserved_meaning: The son must not accompany them or adopt their course of life.
  reasoning_layer_used: The lexical decisions for תֵּלֵךְ and בְּדֶרֶךְ preserve both the road image and its moral force.
  rationale: This replaces an awkward English idiom with a natural sentence while keeping the journey image.
- pob_phrase: keep your foot from their path
  simplified_phrase: Keep your foot off their path
  preserved_meaning: The son must deliberately avoid the course they take.
  reasoning_layer_used: The lexical decisions for מְנַע, רַגְלְךָ, and מִנְּתִיבָתָם protect the command and foot-path image.
  rationale: “Keep your foot off” is clearer modern English for active avoidance.
translation_notes:
  risk_flags:
