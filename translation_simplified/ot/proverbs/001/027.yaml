translation:
  language: en
  text: when what you dread crashes in like a storm[a], and disaster sweeps in like a whirlwind, when trouble and anguish come upon you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “like devastation”; the Hebrew image can point both to a storm’s crashing force and to the ruin it causes.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: your dread comes like a storm
  simplified_phrase: what you dread crashes in like a storm
  preserved_meaning: The feared disaster comes suddenly and forcefully, while the storm comparison remains intact.
  reasoning_layer_used: Lexical decisions for פַּחְדְּכֶם and כְּשָׁאוָה
  rationale: This clarifies the object of dread and conveys the source image’s crashing force.
- pob_phrase: your calamity arrives like a whirlwind
  simplified_phrase: disaster sweeps in like a whirlwind
  preserved_meaning: Calamity arrives with the violent movement of a whirlwind.
  reasoning_layer_used: Lexical decisions for אֵידְכֶם, סוּפָה, and יֶאֱתֶה
  rationale: “Disaster” is more common, while “sweeps in” naturally carries the whirlwind image.
- pob_phrase: distress and anguish come upon you
  simplified_phrase: trouble and anguish come upon you
  preserved_meaning: Two parallel forms of severe adversity come upon the hearers.
  reasoning_layer_used: Lexical decisions for צָרָה, צוּקָה, and עֲלֵיכֶם
  rationale: “Trouble” is plain English, and “come upon you” avoids adding an unsupported result.
