translation:
  language: en
  text: when your dread comes crashing in like a storm,[a] and disaster sweeps in like a whirlwind, when trouble and anguish come upon you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “like devastation”; the Hebrew can describe destructive ruin as well as the crashing force of a storm.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: your dread comes like a storm
  simplified_phrase: your dread comes crashing in like a storm
  preserved_meaning: Dread comes suddenly with a storm’s destructive force, while “dread” retains the Hebrew ambiguity.
  reasoning_layer_used: POB lexical decisions for פַּחְדְּכֶם and כְּשָׁאוָה
  rationale: The added motion clarifies the image without resolving whether dread is the fear itself or what is feared.
- pob_phrase: your calamity arrives like a whirlwind
  simplified_phrase: disaster sweeps in like a whirlwind
  preserved_meaning: A destructive event arrives with the sudden force of a violent windstorm.
  reasoning_layer_used: POB lexical decisions for אֵידְכֶם, סוּפָה, and יֶאֱתֶה
  rationale: Common wording makes the whirlwind image immediate while preserving its force.
- pob_phrase: distress and anguish come upon you
  simplified_phrase: trouble and anguish come upon you
  preserved_meaning: Severe trouble and emotional pressure overtake the hearers.
  reasoning_layer_used: POB lexical decisions for צָרָה, צוּקָה, and עֲלֵיכֶם
  rationale: “Trouble” is clearer than “distress,” while “anguish” preserves the second term’s intensity.
translation_notes:
  risk_flags:
  - risk: “Comes crashing in” adds motion not directly expressed by the verb alone.
    mitigation: The storm term itself includes destructive crashing force according to the POB audit.
