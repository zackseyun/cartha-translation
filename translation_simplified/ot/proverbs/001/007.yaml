translation:
  language: en
  text: The fear of Yahweh is the beginning of knowledge.[a] But fools treat wisdom and discipline[b] with contempt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This fear includes reverence, awe, and submission to God.
    reason: lexical_alternative
  - marker: b
    text: Here “discipline” means training that may include instruction and correction.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The fear of Yahweh is the beginning of knowledge
  simplified_phrase: The fear of Yahweh is the beginning of knowledge
  preserved_meaning: Fear of Yahweh remains both the starting point and foundation of knowledge.
  reasoning_layer_used: The lexical and theological decisions for רֵאשִׁית and יִרְאַת יְהוָה.
  rationale: Keeping “beginning” preserves both senses documented in the POB audit.
- pob_phrase: fools despise wisdom and discipline
  simplified_phrase: But fools treat wisdom and discipline with contempt
  preserved_meaning: Fools strongly reject both wisdom and corrective training.
  reasoning_layer_used: The lexical decisions for בָּזוּ, חָכְמָה, and מוּסָר.
  rationale: “Treat with contempt” states the force of “despise” in immediately clear English.
translation_notes:
