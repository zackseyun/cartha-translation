  text: Let the wise man listen and learn more. Let the discerning man gain guidance.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be translated, “The wise man will listen and learn more, and the discerning man will gain guidance.”
