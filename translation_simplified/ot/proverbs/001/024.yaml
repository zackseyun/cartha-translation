translation:
  language: en
  text: Because I called to you but you refused to listen, I held out my hand, but no one paid attention.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Because I called and you refused
  simplified_phrase: Because I called to you but you refused to listen
  preserved_meaning: Wisdom’s rejected call is part of the reason for the judgment that follows.
  reasoning_layer_used: The lexical decisions require the causal force of “Because” and support “called” and deliberate refusal.
  rationale: The wording keeps the causal link while making the refused response clear.
- pob_phrase: I stretched out my hand
  simplified_phrase: I held out my hand
  preserved_meaning: Wisdom made a visible gesture of appeal or warning toward the hearers.
  reasoning_layer_used: The lexical alternatives permit “held out” while requiring the concrete hand image.
  rationale: “Held out” is natural English and preserves the physical gesture.
- pob_phrase: and no one paid attention
  simplified_phrase: but no one paid attention
  preserved_meaning: Nobody listened attentively or responded to Wisdom’s gesture.
  reasoning_layer_used: The lexical rationale permits natural English contrast without adding an obedience sense.
  rationale: “But” clearly marks that the gesture was ignored.
interpretive_expansions:
- pob_phrase: you refused
  rendering: you refused to listen
  claim: The hearers refused to listen to Wisdom’s call.
  evidence:
  - The preceding clause says Wisdom called to them.
  - The POB footnote identifies attentive listening as the relevant response.
  confidence: high
  alternatives_preserved:
  - you refused
translation_notes:
  risk_flags:
  - risk: “Refused to listen” supplies a complement that is implicit in the Hebrew.
    mitigation: The immediate context supports it, while the audit preserves the more general alternative “you refused.”
  - risk: “Held out my hand” may indicate either appeal or warning.
    mitigation: The concrete gesture remains without choosing between those functions.
