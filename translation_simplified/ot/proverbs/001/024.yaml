  text: Because I called to you but you refused to listen, and I reached out my hand but no one paid attention,
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Because I called and you refused
  simplified_phrase: Because I called to you but you refused to listen
  preserved_meaning: Wisdom’s rejected call is part of the reason for the judgment that follows.
  reasoning_layer_used: The lexical decisions preserve the causal force of יַעַן and the refusal expressed by מאן.
  rationale: This wording keeps the essential causal link while making the refused response explicit.
- pob_phrase: I stretched out my hand
  simplified_phrase: I reached out my hand
  preserved_meaning: Wisdom made a concrete gesture toward her hearers.
  reasoning_layer_used: The lexical rationale requires the physical hand image to remain.
  rationale: “Reached out” expresses the gesture naturally in modern English.
- pob_phrase: and no one paid attention
  simplified_phrase: but no one paid attention
  preserved_meaning: No one responded with attentive listening.
  reasoning_layer_used: The lexical decision for קשב emphasizes active attention without necessarily implying obedience.
  rationale: “But” makes the contrast clear without strengthening the response into obedience.
interpretive_expansions:
- pob_phrase: you refused
  rendering: you refused to listen
  claim: The hearers refused to listen to Wisdom’s call.
  evidence:
  - The preceding words say that Wisdom called to them.
  - The POB footnote identifies attentive listening as the relevant response.
  confidence: high
  alternatives_preserved:
  - you refused
  - you were unwilling to listen
translation_notes:
  risk_flags:
  - risk: The verse ends as a dependent causal statement rather than a complete sentence.
    mitigation: The final comma preserves its intended connection to Wisdom’s response in the following verses.
