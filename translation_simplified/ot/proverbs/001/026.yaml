simplification_decisions:
- pob_phrase: I also will laugh at your calamity
  simplified_phrase: I too will laugh when disaster strikes you
  preserved_meaning: Wisdom answers their refusal by laughing when severe disaster reaches them.
  reasoning_layer_used: Lexical decisions for גַּם, אֵיד, and שׂחק
  rationale: “Disaster strikes you” expresses calamity in immediate, common English while “too” keeps the answering force.
- pob_phrase: I will mock when your dread comes
  simplified_phrase: I will mock you when terror comes upon you
  preserved_meaning: Wisdom will mock when their terror or dreaded event arrives.
  reasoning_layer_used: Lexical decision for פחד and theological decision on tone
  rationale: The wording keeps the force of “mock” and leaves the referent of “terror” open through the footnote.
translation_notes:
  risk_flags:
  - risk: “Laugh” and “mock” may sound harsher than readers expect from Wisdom.
    mitigation: The strong verbs are retained because the POB explicitly preserves the verse’s judicial tension.
