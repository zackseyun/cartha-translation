translation:
  language: en
  text: How long will you simple ones[a] love being simple? How long will scoffers enjoy scoffing and fools hate knowledge?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Simple ones” means people who are gullible or not yet morally formed, not merely people with limited intelligence.
    reason: simplification_note
simplification_decisions:
- pob_phrase: O simple ones
  simplified_phrase: you simple ones
  preserved_meaning: Wisdom directly addresses a recognized moral and spiritual category.
  reasoning_layer_used: POB theological decision on wisdom-category terminology
  rationale: Removing “O” makes the direct address natural while retaining the key category.
- pob_phrase: love simplicity
  simplified_phrase: love being simple
  preserved_meaning: The simple willingly remain in their morally unformed condition.
  reasoning_layer_used: POB lexical decisions for פְּתָיִם and פֶתִי
  rationale: The verbal phrase is easier to understand and preserves the Hebrew wordplay.
- pob_phrase: delight in scoffing
  simplified_phrase: enjoy scoffing
  preserved_meaning: Scoffers take willing pleasure in scornful behavior.
  reasoning_layer_used: POB lexical decisions for חָמְדוּ and לָצוֹן
  rationale: “Enjoy” states the same volitional pleasure in more common English.
translation_notes:
  risk_flags:
  - risk: Modern readers may hear “simple” as an insult about intelligence.
    mitigation: The footnote defines it as Proverbs’ moral category of gullibility and immaturity.
