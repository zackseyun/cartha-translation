simplification_decisions:
- pob_phrase: Like the legs that hang limp from a lame man, so is a proverb in the mouth of fools.
  simplified_phrase: A proverb in the mouth of fools is like limp legs on a lame person.
  preserved_meaning: The comparison links a fool’s proverb with legs that hang slack on a lame person.
  reasoning_layer_used: POB translation and lexical decisions for דַּלְיוּ, מִפִּסֵּחַ, and וּמָשָׁל
  rationale: Reversing the comparison gives readers the subject first while keeping the vivid image clear.
- pob_phrase: legs that hang limp from a lame man
  simplified_phrase: limp legs on a lame person
  preserved_meaning: The legs remain slack in association with a person who is lame.
  reasoning_layer_used: POB lexical decisions for דַּלְיוּ, שֹׁקַיִם, and מִפִּסֵּחַ
  rationale: This concise wording avoids wrongly implying that the person is entirely unable to walk.
