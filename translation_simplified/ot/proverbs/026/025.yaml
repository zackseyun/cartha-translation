translation:
  language: en
  text: When he makes his voice sound kind, do not trust him, because seven[a] detestable things are in his heart.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In wisdom writing, “seven” can suggest fullness or completeness, but the Hebrew specifically gives the number seven.
    reason: cultural_note
simplification_decisions:
- pob_phrase: When he makes his voice gracious
  simplified_phrase: When he makes his voice sound kind
  preserved_meaning: He deliberately makes the manner of his speech seem appealing or favorable.
  reasoning_layer_used: Lexical decisions for יְחַנֵּן and קוֹלוֹ
  rationale: “Sound kind” clarifies the deceptive manner while preserving the image of his voice.
- pob_phrase: for seven abominations are in his heart
  simplified_phrase: because seven detestable things are in his heart
  preserved_meaning: His morally abhorrent inner thoughts and intentions are the reason he must not be trusted.
  reasoning_layer_used: Lexical decisions for שֶׁבַע, תּוֹעֵבוֹת, and בְּלִבּוֹ
  rationale: “Detestable things” is familiar English, while “because,” “seven,” and “heart” preserve the source logic and imagery.
translation_notes:
  risk_flags:
  - risk: “Kind” may sound milder than the broader idea of gracious or charming speech.
    mitigation: “Makes his voice sound” preserves the deliberate and potentially deceptive presentation.
  - risk: Readers may understand “seven” only as an exact count.
    mitigation: The footnote notes its likely sense of fullness while retaining the stated number.
