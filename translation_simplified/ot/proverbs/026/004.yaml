translation:
  language: en
  text: Do not answer a fool according to his foolishness,[a] or you may become like him too.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may mean answering in the same foolish manner as the fool.
    reason: lexical_alternative
  - marker: b
    text: Verse 5 gives the complementary instruction to answer a fool according to his foolishness; together, the sayings call for wisdom about when and how to respond.
    reason: cross_reference
simplification_decisions:
- pob_phrase: according to his folly
  simplified_phrase: according to his foolishness
  preserved_meaning: The answer must not match the fool's folly, while the phrase's deliberate breadth remains open.
  reasoning_layer_used: Lexical and theological decisions on כְאִוַּלְתּוֹ
  rationale: “Foolishness” is more familiar than “folly” without resolving the tension with verse 5.
- pob_phrase: lest you also become like him
  simplified_phrase: or you may become like him too
  preserved_meaning: Answering wrongly risks making the responder resemble the fool.
  reasoning_layer_used: Lexical decisions on פֶּן, תִּשְׁוֶה, and גַם אָתָּה
  rationale: The direct consequence clause replaces the less common word “lest.”
