translation:
  language: en
  text: Do not answer a fool in a way that matches his foolishness, or you too will become like him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Verse 5 gives the complementary instruction to answer a fool according to his foolishness. Together, the sayings call for wisdom suited to each situation.
    reason: cross_reference
simplification_decisions:
- pob_phrase: answer a fool according to his folly
  simplified_phrase: answer a fool in a way that matches his foolishness
  preserved_meaning: The answer must not correspond to the fool's foolishness, without limiting that correspondence to manner or deserved response.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Matches” clearly expresses correspondence while preserving the deliberate ambiguity with verse 5.
- pob_phrase: lest
  simplified_phrase: or
  preserved_meaning: The second clause warns of a consequence that must be avoided.
  reasoning_layer_used: POB lexical decision for פֶּן
  rationale: “Or” states the warning naturally in modern English.
- pob_phrase: you also become like him
  simplified_phrase: you too will become like him
  preserved_meaning: Answering on the fool's terms would make the hearer resemble him.
  reasoning_layer_used: POB lexical decisions for תִּשְׁוֶה and גַם אָתָּה
  rationale: The direct wording preserves both the consequence and the emphasis on “you too.”
interpretive_expansions:
- pob_phrase: according to his folly
  rendering: in a way that matches his foolishness
  claim: The answer corresponds to the fool's foolishness without specifying exactly how it does so.
  evidence:
  - The Hebrew correspondence marker allows more than one kind of matching.
  - The POB preserves the phrase's ambiguity because verse 5 uses it positively.
  confidence: high
  alternatives_preserved:
  - in a foolish manner
  - as his foolishness deserves
translation_notes:
  risk_flags:
  - risk: “Matches” may initially suggest only imitating the fool's manner.
    mitigation: The wording remains broad, and the footnote points readers to verse 5's complementary command.
