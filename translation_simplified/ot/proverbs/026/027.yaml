translation:
  language: en
  text: If you dig a pit, you will fall into it; if you roll a stone, it will roll back on you.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Whoever digs a pit will fall into it
  simplified_phrase: If you dig a pit, you will fall into it
  preserved_meaning: A harmful act predictably traps the person who does it.
  reasoning_layer_used: The lexical decisions treat the participle as generic and the imperfect as a predictable consequence.
  rationale: A direct conditional states the same proverbial cause and effect more naturally.
- pob_phrase: he who rolls a stone, it will come back on him
  simplified_phrase: if you roll a stone, it will roll back on you
  preserved_meaning: The stone returns against the person who set it moving.
  reasoning_layer_used: The lexical rationale identifies a harmful, boomerang-like reversal while preserving the stone image.
  rationale: “Roll back on you” removes the awkward clause structure and keeps the vivid recoil.
translation_notes:
  risk_flags:
  - risk: Second-person wording could be heard as addressing only one person rather than stating a general truth.
    mitigation: The repeated “if you” construction functions naturally as a universal proverb in English.
