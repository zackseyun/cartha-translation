  preserved_meaning: The answer must fit and expose the folly rather than imitate it.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: The clearer wording expresses correspondence while preserving the proverb’s tension.
- pob_phrase: lest he be wise in his own eyes
  simplified_phrase: or he will see himself as wise
  preserved_meaning: Without a fitting answer, the fool may regard himself as wise.
  reasoning_layer_used: POB lexical decisions for פֶּן and בְּעֵינָיו
  rationale: The modern clause keeps the visual metaphor while making self-estimation explicit.
