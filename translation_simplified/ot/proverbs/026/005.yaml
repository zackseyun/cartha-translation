translation:
  language: en
  text: Answer a fool in a way that fits his foolishness,[a] so he does not see himself as wise.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This means to answer in a way suited to exposing his foolishness, not to copy his foolish behavior.
    reason: lexical_alternative
  - marker: b
    text: This saying stands in deliberate tension with Proverbs 26:4; wisdom must discern when silence or an answer is fitting.
    reason: cross_reference
