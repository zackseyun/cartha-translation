translation:
  language: en
  text: Answer a fool in the way his foolishness calls for,[a] or he will see himself as wise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This does not mean copying the fool’s behavior. Proverbs 26:4–5 teaches that wisdom must discern when to remain silent and when to give a fitting answer.
    reason: cross_reference
