translation:
  language: en
  text: Though someone hides his hatred through deception, his evil will be exposed before the gathered community.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Though hatred is covered with deceit
  simplified_phrase: Though someone hides his hatred through deception
  preserved_meaning: A person uses deceptive conduct to conceal his hatred, but the concealment does not prevent exposure.
  reasoning_layer_used: The lexical audit allows a passive or reflexive sense for תִּכַּסֶּה and identifies deceit as the means of concealment.
  rationale: The active wording is natural English, while “Though” preserves the proverb’s concessive force.
- pob_phrase: in the assembly
  simplified_phrase: before the gathered community
  preserved_meaning: The person’s evil becomes known in a concrete communal gathering.
  reasoning_layer_used: The lexical decision defines קָהָל as an assembled group or congregation rather than publicity in general.
  rationale: The phrase explains the setting without using the potentially opaque word “assembly.”
translation_notes:
  risk_flags:
  - risk: Making the implied person explicit could sound more specific than the Hebrew passive wording.
    mitigation: The reflexive sense allowed by the audit and the phrase “his evil” support the active formulation.
