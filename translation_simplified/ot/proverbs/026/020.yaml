  preserved_meaning: The fire goes out because its fuel is absent.
  reasoning_layer_used: POB lexical decision for בְּאֶפֶס and עֵצִים
  rationale: “Without wood” states the same condition in simpler English.
- pob_phrase: where there is no whisperer
  simplified_phrase: Without someone who quietly spreads harmful talk
  preserved_meaning: Conflict subsides when the person fueling it with damaging speech is absent.
  reasoning_layer_used: POB lexical decision and footnote for נִרְגָּן
  rationale: The description explains the unfamiliar role while retaining its quiet-speech image.
- pob_phrase: strife grows quiet
