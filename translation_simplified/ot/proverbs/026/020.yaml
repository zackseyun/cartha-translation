translation:
  language: en
  text: Without wood, a fire goes out. Without someone who quietly spreads harmful talk,[a] a quarrel dies down.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew describes a “whisperer,” someone who spreads damaging talk, often quietly or secretly.
