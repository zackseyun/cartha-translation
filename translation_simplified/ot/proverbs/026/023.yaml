translation:
  language: en
  text: Warm, eager words on the lips of someone with an evil heart are like worthless silver residue coating a clay pot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “burning lips”; the image suggests speech that sounds intensely warm or eager.
