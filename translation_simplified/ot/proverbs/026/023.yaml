simplification_decisions:
- pob_phrase: silver dross overlaid on earthenware
  simplified_phrase: worthless silver residue coating a clay pot
  preserved_meaning: A cheap clay object has only a thin, deceptive silver-like surface.
  reasoning_layer_used: POB lexical decisions for כֶּסֶף סִיגִים, מְצֻפֶּה, and עַל חָרֶשׂ
  rationale: Common words make the physical comparison clear while preserving the contrast between worthless residue and clay.
- pob_phrase: fervent lips
  simplified_phrase: warm, eager words on the lips
  preserved_meaning: The speech sounds intensely warm or enthusiastic while retaining the Hebrew image of lips.
  reasoning_layer_used: POB lexical decision and footnote for דֹּלְקִים and שְׂפָתַיִם
  rationale: The wording explains “fervent” without narrowing it specifically to flattery.
- pob_phrase: with an evil heart
  simplified_phrase: of someone with an evil heart
  preserved_meaning: Attractive outward speech is joined to inward moral evil.
  reasoning_layer_used: POB lexical decision for וְלֶב רָע
  rationale: Naming the speaker removes an awkward body-part construction without softening “evil.”
interpretive_expansions:
