translation:
  language: en
  text: Righteousness protects the person who walks a path of integrity, but wickedness brings the sinner down.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “sinner” usually means “sin” or “sin offering,” but the contrast here points to a person characterized by sin.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the one whose way is blameless
  simplified_phrase: the person who walks a path of integrity
  preserved_meaning: The person’s conduct is morally upright without implying sinless perfection.
  reasoning_layer_used: Lexical decisions for תָּם דָּרֶךְ and דֶּרֶךְ
  rationale: The wording makes the ethical-path image clear in natural English.
- pob_phrase: wickedness overturns the sinner
  simplified_phrase: wickedness brings the sinner down
  preserved_meaning: A sinner’s own wickedness causes destructive ruin.
  reasoning_layer_used: Lexical decision for תְּסַלֵּף and the wisdom-source audit
  rationale: “Brings down” plainly expresses the verb’s force of destructive reversal.
translation_notes:
  risk_flags:
  - risk: “Sinner” resolves a Hebrew noun that ordinarily denotes sin.
    mitigation: The footnote preserves the lexical tension and explains the contextual choice.
  - risk: “Integrity” could weaken the ethical force of “blameless.”
    mitigation: The phrase “walks a path of integrity” retains the proverb’s focus on upright conduct.
