translation:
  language: en
  text: Righteousness protects people who live with integrity, but wickedness brings sin to ruin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “wickedness ruins the sinner.” The Hebrew word may refer either to sin or to a sinful person.
