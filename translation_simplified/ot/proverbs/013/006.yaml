simplification_decisions:
- pob_phrase: guards the blameless in the way
  simplified_phrase: protects people who live with integrity
  preserved_meaning: Righteousness protects people whose conduct is marked by wholeness and integrity.
  reasoning_layer_used: Lexical decisions for תִּצֹּר, תָּם, and דָּרֶךְ
  rationale: This removes the unsupported idea of following a path while clearly expressing integrity in one’s way of life.
- pob_phrase: wickedness overturns sin
  simplified_phrase: wickedness brings sin to ruin
  preserved_meaning: Wickedness causes destructive ruin in relation to sin, with the possible personal sense kept in the footnote.
  reasoning_layer_used: Lexical decision for תְּסַלֵּף and theological decision for חַטָּאת
  rationale: “Brings to ruin” makes the destructive verb clearer while retaining POB’s chosen abstract reading.
