translation:
  language: en
  text: Whoever treats a word with contempt will be ruined because of it. But he who fears the commandment will be repaid.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “will be rewarded.” The Hebrew means that he will receive fitting repayment.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: despises a word
  simplified_phrase: treats a word with contempt
  preserved_meaning: The person rejects a word or matter as unworthy while the proverb remains open about its exact kind.
  reasoning_layer_used: POB lexical decision for בָּז and לְדָבָר
  rationale: The clearer phrase preserves both the strong moral force and the broad meaning of “word.”
- pob_phrase: will be ruined by it
  simplified_phrase: will be ruined because of it
  preserved_meaning: The rejected word becomes the occasion of the person’s ruin or harm.
  reasoning_layer_used: POB lexical decision for יֵחָבֶל לוֹ
  rationale: “Because of it” states the connection in more natural modern English.
- pob_phrase: but he who fears the commandment will be rewarded
  simplified_phrase: But he who fears the commandment will be repaid
  preserved_meaning: Reverent fear toward the commandment brings a fitting positive recompense.
  reasoning_layer_used: POB lexical decisions for וִירֵא, מִצְוָה, and יְשֻׁלָּם; doctrine realignment
  rationale: This keeps the biblical language of fear and commandment while restoring the audited choice “repaid.”
