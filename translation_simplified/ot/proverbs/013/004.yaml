simplification_decisions:
- pob_phrase: The sluggard's appetite craves
  simplified_phrase: A lazy person has cravings
  preserved_meaning: A habitually lazy person continues to desire what he does not have.
  reasoning_layer_used: POB lexical decisions for מִתְאַוָּה, נַפְשׁוֹ, and עָצֵל
  rationale: The recasting replaces the less familiar “sluggard” and awkward personified appetite with direct modern English.
- pob_phrase: the appetite of the diligent
  simplified_phrase: diligent people
  preserved_meaning: Those characterized by diligence stand in contrast to the lazy person.
  reasoning_layer_used: POB lexical decision for חָרֻצִים
  rationale: Naming the people directly makes the contrast immediate without changing who is satisfied.
- pob_phrase: will be richly satisfied
  simplified_phrase: will be richly satisfied
  preserved_meaning: Diligence leads to abundant satisfaction rather than merely material prosperity.
  reasoning_layer_used: POB lexical decision and footnote for תְּדֻשָּׁן
  rationale: The clear POB wording is retained, and the Hebrew abundance image remains in the note.
