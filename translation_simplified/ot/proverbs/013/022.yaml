translation:
  language: en
  text: A good man passes an inheritance down to his grandchildren. But a sinner’s wealth is stored up for righteous people.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: leaves an inheritance to his grandchildren
  simplified_phrase: passes an inheritance down to his grandchildren
  preserved_meaning: A good man provides a family legacy that reaches the next two generations.
  reasoning_layer_used: The lexical decisions for יַנְחִיל and בְּנֵי בָנִים preserve inheritance and grandchildren.
  rationale: “Passes down” makes the transfer across generations immediately clear.
- pob_phrase: but the wealth of a sinner is stored up for the righteous
  simplified_phrase: But a sinner’s wealth is stored up for righteous people.
  preserved_meaning: The sinner’s wealth is reserved to benefit those who are righteous.
  reasoning_layer_used: The lexical decisions for חֵיל, חוֹטֵא, צָפוּן, and לַצַּדִּיק control the wording.
  rationale: The possessive form and “righteous people” make the contrast easier to follow.
- pob_phrase: A good man leaves ... but ...
  simplified_phrase: A good man passes ... . But ...
  preserved_meaning: The proverb contrasts the lasting outcome of goodness with the fate of a sinner’s wealth.
  reasoning_layer_used: The POB translation’s antithetical parallelism governs the sentence relationship.
  rationale: Two sentences reduce the clause load while keeping the contrast explicit.
