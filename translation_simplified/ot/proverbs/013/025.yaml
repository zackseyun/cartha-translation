translation:
  language: en
  text: A righteous man eats until he is satisfied,[a] but the belly of the wicked remains hungry.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “until his appetite is satisfied” or “until his soul is satisfied.”
    reason: lexical_alternative
