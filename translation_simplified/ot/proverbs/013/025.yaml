  rationale: Natural wording preserves the documented ambiguity, which the footnote makes explicit.
- pob_phrase: the belly of the wicked lacks
  simplified_phrase: the belly of the wicked remains hungry
  preserved_meaning: The wicked continue to experience bodily need and lack satisfaction.
  reasoning_layer_used: POB lexical decisions for וּבֶטֶן and תֶּחְסָר
  rationale: This retains the singular belly image while expressing its lack clearly in the eating context.
