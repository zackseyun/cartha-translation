simplification_decisions:
- pob_phrase: Only by arrogance comes strife
  simplified_phrase: Conflict comes only from arrogance
  preserved_meaning: Arrogant self-assertion is presented as the source of conflict in view.
  reasoning_layer_used: Lexical decisions for רַק, בְּזָדוֹן, יִתֵּן, and מַצָּה
  rationale: Ordinary English word order preserves the emphatic restriction and the link between arrogance and conflict.
- pob_phrase: wisdom is with those who take counsel
  simplified_phrase: wisdom is with those who receive advice
  preserved_meaning: Wisdom characterizes people who receive counsel from others.
  reasoning_layer_used: Lexical decision for נֹועָצִים and doctrine-realignment revision
  rationale: “Receive advice” is plain English without implying that the advice is accepted or followed.
