translation:
  language: en
  text: A man's wealth can pay the ransom that saves his life. But a poor man hears no rebuke.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a poor man hears no threat or reproof.” This may mean that no one targets him for extortion or ransom because he has nothing to pay.
