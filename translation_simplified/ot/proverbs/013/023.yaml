translation:
  language: en
  text: A poor person’s freshly plowed land produces plenty of food, yet some people are swept away because justice is absent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Yet something is swept away without justice.” The compact Hebrew can be understood impersonally.
    reason: alternative_reading
