translation:
  language: en
  text: The poor people’s newly plowed land yields plenty of food, yet some people are swept into ruin because justice is lacking.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Yet something is swept away without justice.” The compact Hebrew does not clearly identify who or what is lost.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: The fallow ground of the poor yields abundant food
  simplified_phrase: The poor people’s newly plowed land yields plenty of food
  preserved_meaning: The poor’s arable land produces an abundant supply of food.
  reasoning_layer_used: POB lexical decisions for נִיר, רָאשִׁים, רָב, and אֹכֶל
  rationale: This replaces the unfamiliar term while keeping the land as the producer and the yield as actual.
- pob_phrase: some are swept away
  simplified_phrase: some people are swept into ruin
  preserved_meaning: Some people suffer devastating loss without specifying its mechanism.
  reasoning_layer_used: POB lexical decision for נִסְפֶּה and theological decision on the second colon
  rationale: “Into ruin” makes the vivid image understandable while the footnote preserves the impersonal alternative.
- pob_phrase: for lack of justice
  simplified_phrase: because justice is lacking
  preserved_meaning: Their ruin results from the absence of just treatment or judgment.
  reasoning_layer_used: POB lexical decision for בְּלֹא מִשְׁפָּט
  rationale: The causal wording is familiar and retains the proverb’s social critique.
interpretive_expansions:
- pob_phrase: some are swept away
  rendering: some people are swept into ruin
  claim: The indefinite victims are people who are ruined.
  evidence:
  - The POB deliberately renders the construction as “some are.”
  - The lexical audit includes “ruined” among the senses of נִסְפֶּה.
  - The theological audit adopts the reading that people are ruined when justice is absent.
  confidence: moderate
  alternatives_preserved:
  - Something may be swept away without justice.
  - The lost thing could be produce rather than people.
translation_notes:
  risk_flags:
  - risk: “Some people” makes the personal reading clearer than the compact Hebrew does.
    mitigation: The footnote preserves the impersonal alternative and identifies the uncertainty.
  - risk: “Newly plowed land” selects one agricultural nuance of נִיר.
    mitigation: It is a documented POB lexical alternative and preserves the field image.
