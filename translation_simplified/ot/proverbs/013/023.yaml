- pob_phrase: but some are swept away for lack of justice
  simplified_phrase: yet some people are swept away because justice is absent
  preserved_meaning: Some people are ruined because they do not receive just treatment.
  reasoning_layer_used: POB lexical and theological decisions for נִסְפֶּה and בְּלֹא מִשְׁפָּט
  rationale: The wording identifies the affected people and expresses the cause naturally.
