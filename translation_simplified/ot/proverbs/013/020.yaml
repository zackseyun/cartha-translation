translation:
  language: en
  text: Those who walk with wise people become wise, but those who keep company with fools suffer harm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “are harmed,” “fare badly,” or “come to ruin.” The Hebrew can refer to injury or any seriously bad outcome.
