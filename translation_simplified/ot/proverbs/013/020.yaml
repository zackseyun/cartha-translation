simplification_decisions:
- pob_phrase: Whoever walks with the wise
  simplified_phrase: Those who walk with wise people
  preserved_meaning: Regular association with wise persons shapes a person’s way of life.
  reasoning_layer_used: POB lexical decision for הָלוֹךְ and חֲכָמִים
  rationale: “Wise people” is more immediately natural while “walk” preserves the Hebrew image.
- pob_phrase: will become wise
  simplified_phrase: become wise
  preserved_meaning: Wisdom develops as a result of associating with the wise.
  reasoning_layer_used: POB resultative reading of וְחָכָם
  rationale: The present-tense proverb states the same general result without weakening the progression.
- pob_phrase: a companion of fools
  simplified_phrase: those who keep company with fools
  preserved_meaning: The warning concerns ongoing association with morally and intellectually foolish people.
  reasoning_layer_used: POB lexical decision for וְרֹעֶה
  rationale: The verbal phrase clearly parallels “walk with” and avoids the misleading literal image of shepherding.
translation_notes:
  risk_flags:
  - risk: “Walk” might be understood as only literal travel.
    mitigation: The parallel phrase “keep company with” makes the association metaphor clear.
