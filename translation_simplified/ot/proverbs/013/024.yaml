    reason: source_note
simplification_decisions:
- pob_phrase: withholds his rod
  simplified_phrase: holds back his rod
  preserved_meaning: He refrains from using the rod while the concrete image remains intact.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Holds back” is more familiar than “withholds” without softening the image.
- pob_phrase: whoever loves him
  simplified_phrase: whoever loves his son
  preserved_meaning: The loved person is the son named in the first half of the proverb.
  reasoning_layer_used: POB lexical decision and immediate context
  rationale: Repeating “his son” makes the reference immediately clear.
- pob_phrase: diligently disciplines him
  simplified_phrase: diligently disciplines him
  preserved_meaning: Love is expressed through earnest discipline directed toward the son.
  reasoning_layer_used: POB lexical decision and source audit
  rationale: The direct verb phrase is clearer than a cumbersome periphrastic construction.
translation_notes:
  risk_flags:
  - risk: Readers may take “rod” to mean that discipline is exclusively physical.
    mitigation: The concrete image remains, while “disciplines” preserves the broader scope of the Hebrew term.
  - risk: “Hates” may sound like a psychological diagnosis rather than stark proverbial contrast.
    mitigation: It remains because the POB audit requires the Hebrew proverb’s rhetorical force.
