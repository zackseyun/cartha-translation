translation:
  language: en
  text: Whoever holds back his rod[a] hates his son, but whoever loves his son diligently disciplines him.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “spares his rod.”
    reason: lexical_alternative
  - marker: b
