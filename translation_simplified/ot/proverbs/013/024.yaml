translation:
  language: en
  text: Whoever holds back his rod hates his son, but whoever loves his son is diligent in disciplining him.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Whoever withholds his rod
  simplified_phrase: Whoever holds back his rod
  preserved_meaning: The parent refrains from using the rod, while the concrete rod image remains intact.
  reasoning_layer_used: POB lexical decisions for חוֹשֵׂךְ and שִׁבְטוֹ
  rationale: “Holds back” is clearer than “withholds” without softening the action.
- pob_phrase: but whoever loves him
  simplified_phrase: but whoever loves his son
  preserved_meaning: The son remains the specific object of the parent's love.
  reasoning_layer_used: POB lexical decision for וְאֹהֲבוֹ and immediate context
  rationale: Repeating “his son” makes the pronoun reference immediately clear.
- pob_phrase: diligently seeks discipline
  simplified_phrase: is diligent in disciplining him
  preserved_meaning: Love leads the parent to take earnest, intentional action to discipline his son.
  reasoning_layer_used: POB lexical decisions for שִׁחֲרוֹ and מוּסָר, confirmed by the grounding review
  rationale: The wording preserves active diligence rather than merely treating discipline as a priority.
interpretive_expansions:
- pob_phrase: diligently seeks discipline
  rendering: is diligent in disciplining him
  claim: The loving parent actively and earnestly disciplines his son.
  evidence:
  - The POB audit says שִׁחֲרוֹ conveys earnest or diligent seeking.
  - The proverb contrasts withholding the rod with active discipline.
  confidence: high
  alternatives_preserved:
