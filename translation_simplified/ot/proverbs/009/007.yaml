translation:
  language: en
  text: If you correct an arrogant mocker, you bring disgrace on yourself. If you rebuke a wicked man, you end up marked.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “his blemish.” It may mean a stain on the rebuker’s reputation, an injury, or abuse from the wicked person.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Whoever corrects
  simplified_phrase: If you correct
  preserved_meaning: The statement remains a general principle about anyone who gives correction.
  reasoning_layer_used: lexical decision and proverb form
  rationale: A direct conditional is easier to follow while preserving the participle’s general force.
- pob_phrase: a scoffer
  simplified_phrase: an arrogant mocker
  preserved_meaning: The person contemptuously and arrogantly rejects wisdom.
  reasoning_layer_used: lexical decision for לֵץ
  rationale: “Arrogant mocker” makes the nature of the scoffing clear in common English.
- pob_phrase: incurs a blemish
  simplified_phrase: end up marked
  preserved_meaning: The rebuker incurs some form of stigma, injury, or abuse.
  reasoning_layer_used: final source audit and footnote
  rationale: This preserves the blemish image and ambiguity without suggesting moral defilement.
interpretive_expansions:
- pob_phrase: a scoffer
  rendering: an arrogant mocker
  claim: The scoffing includes arrogant and contemptuous rejection of wisdom.
  evidence:
  - The POB lexical rationale defines the scoffer as a contemptuous, arrogant rejecter of wisdom.
  confidence: high
  alternatives_preserved:
  - scoffer
translation_notes:
  risk_flags:
  - risk: “End up marked” does not specify whether the effect is reputational, physical, or verbal.
    mitigation: The footnote preserves the Hebrew expression and its principal possible senses.
