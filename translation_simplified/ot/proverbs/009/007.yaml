translation:
  language: en
  text: When you correct a scoffer who rejects wisdom, you bring disgrace on yourself. When you rebuke a wicked man, he may respond with insults and abuse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew “his blemish.” The expression may picture the reproach or abuse the rebuker receives from the wicked man.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Whoever corrects a scoffer
  simplified_phrase: When you correct a scoffer who rejects wisdom
  preserved_meaning: This remains a general principle about correcting a contemptuous rejecter of wisdom.
  reasoning_layer_used: POB lexical decisions for יֹסֵר and לֵץ
  rationale: The added description explains “scoffer” without claiming that wisdom is the explicit object of mockery.
- pob_phrase: gets dishonor for himself
  simplified_phrase: you bring disgrace on yourself
  preserved_meaning: The person giving correction incurs public shame or disgrace.
  reasoning_layer_used: POB lexical decisions for לֹקֵחַ לוֹ and קָלוֹן
  rationale: The direct second-person wording expresses the reflexive result in natural English.
- pob_phrase: gets a blemish for himself
  simplified_phrase: he may respond with insults and abuse
  preserved_meaning: The rebuker may receive reproach or abuse from the wicked man.
  reasoning_layer_used: POB lexical decision and footnote for מוּמוֹ
  rationale: The main text gives the likely contextual sense while the footnote preserves the source image and ambiguity.
