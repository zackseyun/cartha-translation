simplification_decisions:
- pob_phrase: you are wise for yourself
  simplified_phrase: you yourself will benefit
  preserved_meaning: Wisdom brings personal benefit to the wise person.
  reasoning_layer_used: POB lexical decision for חָכַמְתָּ ... חָכַמְתָּ לָּךְ
  rationale: The emphatic “yourself” preserves the repeated focus on the person while stating the idiom naturally.
- pob_phrase: if you scoff, you alone will bear it
  simplified_phrase: If you scoff, you alone will bear it
  preserved_meaning: The scoffer bears sole personal responsibility for an unspecified burden.
  reasoning_layer_used: POB lexical decisions for וְלַצְתָּ, לְבַדְּךָ, and תִשָּׂא
  rationale: This wording is already concise and keeps both arrogant derision and the Hebrew image of bearing a burden.
