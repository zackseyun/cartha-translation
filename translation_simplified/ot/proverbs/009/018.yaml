translation:
  language: en
  text: But he does not realize that the dead are there[a] and that the people she has invited are deep in Sheol.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated “the departed spirits.”
    reason: lexical_alternative
  - marker: b
    text: Sheol is the Hebrew name for the realm of the dead.
    reason: cultural_note
simplification_decisions:
- pob_phrase: he does not know
  simplified_phrase: he does not realize
  preserved_meaning: The man remains unaware of the deadly reality behind the invitation.
  reasoning_layer_used: Lexical decision for יָדַע and immediate context
  rationale: “Does not realize” naturally expresses his present ignorance of a hidden danger.
- pob_phrase: her guests
  simplified_phrase: the people she has invited
  preserved_meaning: They are the people invited by the woman.
  reasoning_layer_used: Lexical decision for קְרֻאֶיהָ
  rationale: The fuller phrase makes the invitation motif immediately clear.
- pob_phrase: in the depths of Sheol
  simplified_phrase: deep in Sheol
  preserved_meaning: Her invited people are pictured far down in the realm of the dead.
  reasoning_layer_used: Lexical and theological decisions for בְּעִמְקֵי שְׁאוֹל
  rationale: “Deep in” keeps the downward image in simpler syntax.
