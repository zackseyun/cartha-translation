simplification_decisions:
- pob_phrase: The beginning of wisdom is the fear of Yahweh
  simplified_phrase: To fear Yahweh is the beginning of wisdom
  preserved_meaning: Fear of Yahweh remains wisdom’s starting point.
  reasoning_layer_used: Lexical decisions for תְּחִלַּת and יִרְאַת
  rationale: The infinitive form makes the relationship easier to grasp without weakening “fear.”
- pob_phrase: the knowledge of the Holy One is understanding
  simplified_phrase: to know the Holy One is understanding
  preserved_meaning: Knowing God is identified with true understanding.
  reasoning_layer_used: Lexical and theological decisions for וְדַעַת, קְדֹשִׁים, and בִּינָה
  rationale: The verbal wording is more natural while retaining the Hebrew parallelism.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “fear” to mean only terror.
    mitigation: The key theological term is retained because it includes both reverent awe and proper dread.
  - risk: “The Holy One” resolves a grammatically plural Hebrew form as singular.
    mitigation: The footnote preserves the literal plural alternative.
