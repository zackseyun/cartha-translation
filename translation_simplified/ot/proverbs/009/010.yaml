simplification_decisions:
- pob_phrase: The beginning of wisdom is the fear of Yahweh
  simplified_phrase: Wisdom begins with fearing Yahweh
  preserved_meaning: Fear of Yahweh is the starting point of wisdom.
  reasoning_layer_used: Lexical decisions for תְּחִלַּת and יִרְאַת
  rationale: The active wording is easier to read while retaining both “begins” and the full force of “fearing.”
- pob_phrase: and the knowledge of the Holy One is understanding
  simplified_phrase: Knowing the Holy One is understanding
  preserved_meaning: Knowledge of the Holy One constitutes true understanding.
  reasoning_layer_used: Lexical and theological decisions for קְדֹשִׁים and בִּינָה
  rationale: The gerund removes an abstract noun phrase without changing the singular divine referent or the equation with understanding.
- pob_phrase: one compound sentence joined by “and”
  simplified_phrase: two parallel sentences
  preserved_meaning: The two matching statements remain distinct and mutually reinforcing.
  reasoning_layer_used: Hebrew synonymous parallelism noted in the theological rationale
  rationale: Dividing the parallel lines makes the verse easier to grasp on first reading.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “fearing” to mean only terror.
    mitigation: The term is retained because the POB audit requires both reverent awe and proper dread rather than a narrower substitute.
  - risk: The singular “Holy One” could conceal the Hebrew plural form.
    mitigation: The footnote preserves the literal plural and its genuine ambiguity.
