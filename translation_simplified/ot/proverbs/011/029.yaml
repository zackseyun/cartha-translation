- pob_phrase: troubles his own house
  simplified_phrase: brings trouble on his own household
  preserved_meaning: The person causes harm within his own family or domestic community.
  reasoning_layer_used: POB lexical decision for עוֹכֵר and בֵּיתוֹ
  rationale: This makes the active harm and family sense clear without suggesting total ruin.
- pob_phrase: will inherit wind
  simplified_phrase: will inherit only wind
  preserved_meaning: His ironic reward is something empty and insubstantial.
  reasoning_layer_used: POB lexical decisions and footnote for יִנְחַל רוּחַ
  rationale: The wording keeps both the inheritance irony and the concrete wind image.
- pob_phrase: the wise of heart
  simplified_phrase: a person with a wise heart
  preserved_meaning: The person is characterized inwardly by wisdom.
  reasoning_layer_used: POB lexical decision for לַחֲכַם־לֵב
  rationale: This uses ordinary English while preserving the Hebrew heart image.
