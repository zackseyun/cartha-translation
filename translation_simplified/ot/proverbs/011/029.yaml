translation:
  language: en
  text: Whoever brings trouble on his own household will inherit only wind, and a fool will become the servant of a person with a wise heart.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Inherit only wind” means ending up with nothing of substance or value.
    reason: lexical_alternative
