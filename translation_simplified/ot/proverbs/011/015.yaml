translation:
  language: en
  text: If you agree to be responsible for an outsider’s obligation, you will surely suffer harm. But if you hate making such pledges, you will be safe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally “hates those who strike hands,” referring to the handclasp used to confirm a pledge or guarantee.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Whoever guarantees for a stranger
  simplified_phrase: If you agree to be responsible for an outsider’s obligation
  preserved_meaning: A person assumes responsibility for someone outside their own circle without specifying the kind of obligation.
  reasoning_layer_used: Lexical decisions for עָרַב and זָר
  rationale: The wording explains the unfamiliar sense of guaranteeing for someone while keeping the obligation general.
- pob_phrase: but whoever hates making pledges is safe
  simplified_phrase: But if you hate making such pledges, you will be safe
  preserved_meaning: Firm aversion to entering these guarantees protects a person from the resulting danger.
  reasoning_layer_used: Lexical decisions for שֹׂנֵא, תֹקְעִים, and בּוֹטֵחַ
  rationale: Direct second-person wording makes the contrast easier to follow without weakening “hates” or “safe.”
interpretive_expansions:
- pob_phrase: guarantees for a stranger
  rendering: agree to be responsible for an outsider’s obligation
  claim: The guarantee makes the guarantor responsible for another person’s unspecified obligation.
  evidence:
  - The lexical rationale for עָרַב identifies pledging oneself as guarantor for another’s obligation.
  - The source audit says the Hebrew does not specify the precise obligation.
  confidence: high
  alternatives_preserved:
  - The obligation may be financial or another kind of pledged responsibility.
  - “Outsider” remains social rather than specifically ethnic.
translation_notes:
  risk_flags:
  - risk: “Obligation” may sound formal to some readers.
    mitigation: It avoids falsely limiting the pledge to a debt while the surrounding wording explains the idea.
