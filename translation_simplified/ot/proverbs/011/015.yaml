translation:
  language: en
  text: Anyone who guarantees a stranger’s obligation is sure to suffer harm, but whoever hates making pledges with a handshake[a] is safe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here a handshake means the ancient gesture used to seal a pledge or guarantee, not an ordinary greeting.
    reason: cultural_note
