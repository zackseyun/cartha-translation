simplification_decisions:
- pob_phrase: With his mouth the godless man destroys his neighbor
  simplified_phrase: A godless man ruins his neighbor with his words
  preserved_meaning: His speech is the means by which he brings harm to his neighbor.
  reasoning_layer_used: Lexical decisions for בְּפֶה and יַשְׁחִת
  rationale: The recast clause uses natural English while preserving the concrete force of harmful speech.
- pob_phrase: but by knowledge the righteous are delivered
  simplified_phrase: but the righteous are rescued through knowledge
  preserved_meaning: Knowledge is the means by which the righteous are delivered.
  reasoning_layer_used: Lexical and theological decisions for וּבְדַעַת, צַדִּיקִים, and יֵחָלֵצוּ
  rationale: The clearer clause order retains the righteous as the subject and keeps knowledge as the means.
