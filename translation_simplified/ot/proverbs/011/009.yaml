simplification_decisions:
- pob_phrase: With his mouth the godless man destroys his neighbor
  simplified_phrase: A godless man destroys his neighbor with his words
  preserved_meaning: His speech is the means by which he ruins another person.
  reasoning_layer_used: Lexical decisions for בְּפֶה and יַשְׁחִת
  rationale: Natural clause order identifies speech as the instrument of harm.
- pob_phrase: but by knowledge the righteous are delivered
  simplified_phrase: but the righteous are rescued through knowledge
  preserved_meaning: Knowledge is the means by which righteous people are delivered, while the agent remains unstated.
  reasoning_layer_used: Lexical and theological decisions for וּבְדַעַת, צַדִּיקִים, and יֵחָלֵצוּ
  rationale: The passive wording is clear and preserves the source’s openness about the agent.
