translation:
  language: en
  text: The right conduct of a blameless man makes his path straight. But a wicked man falls because of his own wickedness.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “falls in his wickedness.” The Hebrew may describe either what causes his fall or the evil way of life in which he falls.
    reason: lexical_alternative
