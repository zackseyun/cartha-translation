simplification_decisions:
- pob_phrase: Wealth is of no use
  simplified_phrase: wealth will not help you
  preserved_meaning: Material wealth provides no benefit in the crisis described.
  reasoning_layer_used: Lexical decision for הוֹן and יוֹעִיל
  rationale: The active wording is more direct while preserving wealth's ineffectiveness.
- pob_phrase: righteousness delivers from death
  simplified_phrase: righteousness will rescue you from death
  preserved_meaning: Righteousness is presented as life-preserving without defining a later doctrinal framework.
  reasoning_layer_used: Lexical and theological decisions for צְדָקָה and תַּצִּיל
  rationale: “Rescue” makes the deliverance image clearer while retaining the key term “righteousness.”
translation_notes:
  risk_flags:
