translation:
  language: en
  text: On a day of wrath, wealth will not help you, but righteousness will rescue you from death.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A “day of wrath” may mean a time of judgment or calamity; the proverb does not specify further.
