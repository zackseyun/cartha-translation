translation:
  language: en
  text: Wealth cannot help when the day of wrath comes,[a] but righteousness rescues from death.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The day of wrath” may mean a time of judgment or calamity; the proverb does not specify further.
    reason: alternative_reading
  - marker: b
    text: Here “righteousness” can include justice and living in the right way.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Wealth is of no use
  simplified_phrase: Wealth cannot help
  preserved_meaning: Material possessions are ineffective in the coming crisis.
  reasoning_layer_used: Lexical decision for יוֹעִיל and הוֹן
  rationale: The active wording is easier to grasp while preserving wealth’s inability to benefit.
- pob_phrase: on the day of wrath
  simplified_phrase: when the day of wrath comes
  preserved_meaning: The failure of wealth occurs at a decisive but unspecified time of wrath.
  reasoning_layer_used: Theological decision on the day of wrath
  rationale: The recast sounds natural without limiting the phrase to final judgment or ordinary disaster.
- pob_phrase: delivers from death
  simplified_phrase: rescues from death
  preserved_meaning: Righteousness has life-preserving power against death.
  reasoning_layer_used: Lexical decision for תַּצִּיל and מִמָּוֶת
  rationale: “Rescues” makes the deliverance image immediate while keeping death explicit.
translation_notes:
  risk_flags:
  - risk: “The day of wrath” may be read only as final divine judgment.
    mitigation: Footnote a preserves the broader possibilities of judgment or calamity.
  - risk: “Righteousness” may be mistaken for a narrowly technical doctrinal term.
    mitigation: Footnote b identifies its wisdom-context sense of justice and right living.
