translation:
  language: en
  text: People[a] curse anyone who holds back grain, but blessing comes to the one who sells it.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the nation” or “the public.”
    reason: lexical_alternative
  - marker: b
    text: Or “the one who supplies grain”; the Hebrew commonly refers here to selling grain rather than hoarding it.
    reason: lexical_alternative
