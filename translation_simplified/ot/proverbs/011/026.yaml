translation:
  language: en
  text: People curse anyone who holds back grain, but blessing rests on the head of the one who sells it.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the nation” or “the public.”
    reason: lexical_alternative
  - marker: b
    text: Or “the one who supplies grain”; the Hebrew may emphasize making grain available, usually by selling it here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The one who withholds grain—the people curse him
  simplified_phrase: People curse anyone who holds back grain
  preserved_meaning: The public condemns a person who habitually keeps grain from others.
  reasoning_layer_used: POB lexical decisions for מֹנֵעַ, בָּר, יִקְּבֻהוּ, and לְאֹם
  rationale: An active sentence is easier to follow while retaining the proverb’s general judgment.
- pob_phrase: blessing is on the head of
  simplified_phrase: blessing rests on the head of
  preserved_meaning: Blessing comes upon the grain seller, pictured as resting on the person’s head.
  reasoning_layer_used: POB lexical decision for לְרֹאשׁ
  rationale: “Rests” makes the Hebrew image natural without removing it.
- pob_phrase: the one who sells it
  simplified_phrase: the one who sells it
  preserved_meaning: The contrast concerns making grain available through sale rather than hoarding it.
  reasoning_layer_used: POB lexical decision for מַשְׁבִּיר
  rationale: The wording stays because “distributes” could wrongly suggest only charitable giving.
translation_notes:
  risk_flags:
  - risk: “On the head” may sound unfamiliar to modern readers.
    mitigation: “Rests” clarifies the image while preserving its concrete force.
  - risk: “Sells” may understate the participle’s broader sense of supplying grain.
    mitigation: Footnote b preserves that lexical alternative without weakening the contextual choice.
