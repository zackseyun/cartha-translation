- pob_phrase: despises his neighbor
  simplified_phrase: treats his neighbor with contempt
  preserved_meaning: The person actively regards and treats his neighbor with contempt.
  reasoning_layer_used: POB lexical decision for בָּז and לְרֵעֵהוּ
  rationale: The fuller phrase makes “despises” immediately clear while retaining the broad social meaning of “neighbor.”
- pob_phrase: lacks sense
  simplified_phrase: has no sense
  preserved_meaning: Contempt for a neighbor reveals a lack of sound judgment.
  reasoning_layer_used: POB lexical decision and footnote for חֲסַר לֵב
  rationale: This natural expression communicates the Hebrew idiom without suggesting an emotional or physical lack of heart.
- pob_phrase: keeps silent
  simplified_phrase: keeps quiet
  preserved_meaning: A discerning man deliberately restrains his speech.
  reasoning_layer_used: POB lexical decision for יַחֲרִישׁ
  rationale: “Keeps quiet” is common English and preserves the deliberate restraint expressed by the verb.
