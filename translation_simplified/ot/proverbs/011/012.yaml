translation:
  language: en
  text: Whoever treats his neighbor with contempt has no sense. But a man[a] with understanding keeps silent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses “man” in a representative sense; the proverb applies generally.
    reason: source_note
simplification_decisions:
- pob_phrase: despises his neighbor
  simplified_phrase: treats his neighbor with contempt
  preserved_meaning: The person actively regards and treats a neighbor with scorn.
  reasoning_layer_used: POB lexical decision for בָּז and לְרֵעֵהוּ
  rationale: The expanded wording makes the social action of contempt immediately clear.
- pob_phrase: Whoever despises his neighbor lacks sense, but
  simplified_phrase: Whoever treats his neighbor with contempt has no sense. But
  preserved_meaning: Contempt for a neighbor reveals poor judgment and contrasts with restrained wisdom.
  reasoning_layer_used: POB translation and proverb structure
  rationale: Splitting the contrast into two sentences makes the proverb easier to follow.
- pob_phrase: a man of understanding
  simplified_phrase: a man with understanding
  preserved_meaning: The representative man possesses discernment and therefore exercises restraint.
  reasoning_layer_used: POB lexical and theological decisions for וְאִישׁ תְּבוּנוֹת
  rationale: “With understanding” is more natural common English while retaining the masculine representative wording.
