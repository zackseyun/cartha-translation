simplification_decisions:
- pob_phrase: the righteous is repaid
  simplified_phrase: the righteous receive what is due
  preserved_meaning: The representative class receives due recompense without limiting it to reward or punishment.
  reasoning_layer_used: POB lexical and theological decisions on צַדִּיק and יְשֻׁלָּם
  rationale: The plural agreement sounds natural in English while keeping the class expression and broad recompense.
- pob_phrase: if ... how much more
  simplified_phrase: if ... how much more will ... receive what is due
  preserved_meaning: The explicit lesser-to-greater comparison remains central.
  reasoning_layer_used: POB lexical decision on אַף כִּי and grounding review
  rationale: Repeating the predicate completes the comparison for modern readers.
- pob_phrase: on earth
  simplified_phrase: on earth
  preserved_meaning: The recompense occurs in earthly life, though “in the land” remains possible.
  reasoning_layer_used: POB lexical decision on בָּאָרֶץ
  rationale: The main text keeps POB’s broad choice and the footnote preserves the alternative.
interpretive_expansions:
- pob_phrase: how much more the wicked and the sinner
  rendering: how much more will the wicked and the sinner receive what is due
  claim: The second clause applies the same due recompense to the wicked and the sinner.
  evidence:
  - The a-fortiori construction carries the first clause’s predicate into the second.
  - The POB audit identifies due repayment as the comparison’s controlling meaning.
  confidence: high
  alternatives_preserved:
  - The recompense may involve reward, discipline, or both.
translation_notes:
  risk_flags:
  - risk: “Receive what is due” could be heard as only positive reward.
    mitigation: The wording is neutral, and the audit leaves the kind of recompense unresolved.
  - risk: The Hebrew may mean either “earth” or “land.”
    mitigation: The main text follows POB’s broader reading, while the footnote preserves “land.”
