simplification_decisions:
- pob_phrase: Indeed, the righteous is repaid
  simplified_phrase: Even a righteous person receives what is due
  preserved_meaning: The righteous person receives due recompense, whether reward, discipline, or both.
  reasoning_layer_used: Lexical and theological decisions for צַדִּיק and יְשֻׁלָּם.
  rationale: This wording is natural English while keeping the kind of repayment unspecified.
- pob_phrase: how much more the wicked and the sinner
  simplified_phrase: how much more, then, a wicked person and a sinner
  preserved_meaning: The second group is even more certain to receive due repayment.
  reasoning_layer_used: Lexical decision for אַף כִּי and the grammar revision.
  rationale: The wording preserves the forceful comparison and the Hebrew clause’s unstated verb.
translation_notes:
  risk_flags:
  - risk: “What is due” may sound mainly like positive reward.
    mitigation: The neutral phrase can include either favorable or adverse consequences, as required by the POB rationale.
  - risk: Supplying “a person” may make the representative singular more explicit than the POB.
    mitigation: It avoids gender-specific wording while preserving the singular example.
