translation:
  language: en
  text: A righteous person is rescued from trouble, and a wicked person faces trouble instead.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “a wicked person comes in that person’s place.” The Hebrew expresses reversal or substitution without specifying how or when.
    reason: lexical_alternative
