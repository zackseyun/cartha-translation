simplification_decisions:
- pob_phrase: trusts in his wealth
  simplified_phrase: depends on wealth for security
  preserved_meaning: Wealth is treated as the source of confidence and security.
  reasoning_layer_used: Lexical rationales for בּוֹטֵחַ and בְּעָשְׁרוֹ
  rationale: This states the misplaced dependence clearly without making wealth the object of an ambiguous transitive verb.
- pob_phrase: the righteous
  simplified_phrase: those who live rightly
  preserved_meaning: The plural describes people characterized by righteousness.
  reasoning_layer_used: Lexical decision for צַדִּיקִים
  rationale: This presents righteousness as a way of life rather than as isolated good actions.
- pob_phrase: will flourish like leaves
  simplified_phrase: will thrive like green leaves
  preserved_meaning: Righteous people are pictured as sharing the healthy growth of foliage.
  reasoning_layer_used: Lexical and theological decisions for וְכֶעָלֶה and יִפְרָחוּ
  rationale: “Thrive” and “green leaves” make the verdant plant image immediately clear.
