- pob_phrase: trusts in his wealth
  rendering: depends on wealth for security
  claim: The person looks to wealth as a source of security.
  evidence:
  - The lexical rationale identifies the warning as one against misplaced security.
  confidence: high
- pob_phrase: like leaves
  rendering: like green leaves
  claim: The leaves are pictured as healthy and flourishing.
