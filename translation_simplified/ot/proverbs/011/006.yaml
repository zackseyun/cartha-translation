translation:
  language: en
  text: Doing what is right rescues upright people, but treacherous people are trapped by their own desire.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean that treacherous people are caught in their ruin or destruction.
