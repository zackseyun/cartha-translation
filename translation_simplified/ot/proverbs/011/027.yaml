translation:
  language: en
  text: Whoever earnestly looks for what is good seeks favor.[a] But evil will come to whoever looks for it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may mean favor from God, from people, or both.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: diligently seeks good
  simplified_phrase: earnestly looks for what is good
  preserved_meaning: The person actively and seriously pursues good.
  reasoning_layer_used: POB lexical decisions for שֹׁחֵר and טוֹב
  rationale: This makes both the intensity of the search and its object immediately clear.
- pob_phrase: evil comes to the one who searches for it
  simplified_phrase: evil will come to whoever looks for it
  preserved_meaning: The evil a person pursues comes back upon that person.
  reasoning_layer_used: POB lexical decisions for וְדֹרֵשׁ, רָעָה, and תְבוֹאֶנּוּ
  rationale: The direct wording preserves the image of evil coming to the person who seeks it.
translation_notes:
  risk_flags:
