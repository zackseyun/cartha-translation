simplification_decisions:
- pob_phrase: Whoever diligently seeks good
  simplified_phrase: Anyone who eagerly looks for what is good
  preserved_meaning: The person earnestly pursues good rather than merely noticing it.
  reasoning_layer_used: Lexical decision for שֹׁחֵר and טוֹב
  rationale: “Eagerly looks for what is good” expresses the intensive search in familiar English.
- pob_phrase: but whoever seeks evil—it will come upon him
  simplified_phrase: But anyone who looks for evil will have that same evil come upon them
  preserved_meaning: The evil being sought returns upon its seeker.
  reasoning_layer_used: Source audit and applied revision
  rationale: The wording identifies evil as both the object sought and what comes upon the seeker.
interpretive_expansions:
- pob_phrase: it will come upon him
  rendering: that same evil come upon them
  claim: The pronoun refers back to the evil the person seeks.
  evidence:
  - The Hebrew suffix follows רָעָה, “evil.”
  - The POB source audit requires evil to remain the subject of the consequence.
  confidence: high
  alternatives_preserved:
  - it will come upon him
  - evil will come upon that person
translation_notes:
  risk_flags:
  - risk: Readers may assume that “favor” comes only from God or only from people.
    mitigation: The footnote preserves the Hebrew’s unspecified source of favor.
