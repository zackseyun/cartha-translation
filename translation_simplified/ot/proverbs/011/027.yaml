translation:
  language: en
  text: Anyone who eagerly looks for what is good is seeking favor.[a] But anyone who looks for evil will have that same evil come upon them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Favor” may mean acceptance or goodwill from God, from people, or from both; the Hebrew does not specify.
