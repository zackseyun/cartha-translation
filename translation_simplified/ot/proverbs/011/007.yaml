translation:
  language: en
  text: When a wicked man dies, his hope dies with him, and the expectation connected with strength comes to nothing.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the expectation of strong people comes to nothing.” The Hebrew may refer either to strength or to strong people.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: his hope perishes
  simplified_phrase: his hope dies with him
  preserved_meaning: The wicked man’s hope ends when he dies.
  reasoning_layer_used: Lexical decision for תֹּאבַד and the verse’s temporal parallelism
  rationale: This wording clearly links the end of his hope with his death while preserving its finality.
- pob_phrase: the expectation of strength
  simplified_phrase: the expectation connected with strength
  preserved_meaning: The expectation related to strength or power ultimately fails.
  reasoning_layer_used: Lexical and theological decisions for וְתוֹחֶלֶת אוֹנִים
  rationale: “Connected with” clarifies the broad relation without adding possession or narrowing strength to wealth.
translation_notes:
  risk_flags:
  - risk: The difficult Hebrew may refer to strong people rather than strength itself.
    mitigation: Footnote a preserves the viable personal reading without overriding the main POB choice.
