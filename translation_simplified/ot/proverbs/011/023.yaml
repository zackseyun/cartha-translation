translation:
  language: en
  text: Righteous people desire only what is good. But the expectation of wicked people is wrath.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew leaves unclear whose wrath this is and whether wrath is what the wicked expect or what finally awaits them.
    reason: source_note
simplification_decisions:
- pob_phrase: The desire of the righteous is only good
  simplified_phrase: Righteous people desire only what is good
  preserved_meaning: The desires of righteous people are directed only toward good.
  reasoning_layer_used: POB lexical decisions for “desire,” “the righteous,” “only,” and “good”
  rationale: The abstract wording becomes a direct statement while preserving its moral category and exclusivity.
- pob_phrase: the expectation of the wicked is wrath
  simplified_phrase: the expectation of wicked people is wrath
  preserved_meaning: The expectation of wicked people is associated with wrath, without resolving whether wrath is expected or awaits them.
  reasoning_layer_used: POB lexical and theological decisions on the final clause
  rationale: “Wicked people” is more natural for common readers, while “is wrath” preserves the documented ambiguity.
