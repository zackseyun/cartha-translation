translation:
  language: en
  text: Righteous people desire only what is good, but what wicked people hope for amounts to wrath.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew does not say whose wrath this is; it may mean the wicked person’s own fury or the wrath that comes upon the wicked.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the righteous
  simplified_phrase: righteous people
  preserved_meaning: People characterized by righteousness remain the first moral group in the contrast.
  reasoning_layer_used: POB lexical decision for צַדִּיקִים
  rationale: The expanded wording is more immediately natural for readers unfamiliar with biblical category labels.
- pob_phrase: The desire of the righteous is only good
  simplified_phrase: Righteous people desire only what is good
  preserved_meaning: Their desire is restricted to good.
  reasoning_layer_used: POB lexical decisions for תַּאֲוַת, אַךְ, and טוֹב
  rationale: A direct subject-and-verb sentence replaces the abstract noun construction.
- pob_phrase: the hope of the wicked is wrath
  simplified_phrase: what wicked people hope for amounts to wrath
  preserved_meaning: The wicked person’s hope results in or has the character of wrath.
  reasoning_layer_used: POB theological decision on the final clause
  rationale: This wording clarifies the clause while leaving the source of the wrath unstated.
interpretive_expansions:
- pob_phrase: is wrath
  rendering: amounts to wrath
  claim: The final clause describes the outcome or character of the wicked person’s hope.
  evidence:
  - The POB theological rationale explicitly permits the senses “results in” or “amounts to.”
  - The Hebrew leaves the relation terse and does not identify whose wrath is meant.
  confidence: high
  alternatives_preserved:
  - the wicked person’s angry expectation
  - wrath that comes upon the wicked
translation_notes:
  risk_flags:
