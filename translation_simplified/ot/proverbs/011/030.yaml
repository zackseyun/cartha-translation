translation:
  language: en
  text: The fruit that righteous people bear is a tree of life, and whoever wins people over[a] is wise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “takes persons” or “takes lives.” In this proverb, it can refer to gaining or influencing people, not specifically to converting them.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The fruit of the righteous
  simplified_phrase: The fruit that righteous people bear
  preserved_meaning: Righteous people produce beneficial fruit while the fruit image remains intact.
  reasoning_layer_used: Lexical decisions for פְּרִי and צַדִּיק
  rationale: The active wording makes the metaphor easier to understand without replacing it with an abstract result.
- pob_phrase: he who wins souls
  simplified_phrase: whoever wins people over
  preserved_meaning: A wise person gains or influences persons rather than explicitly bringing about religious conversion.
  reasoning_layer_used: Lexical and theological decisions for לֹקֵחַ נְפָשׂוֹת
  rationale: “People” conveys the contextual sense of “souls,” while “wins over” retains the idiom’s active force.
interpretive_expansions:
- pob_phrase: wins souls
  rendering: wins people over
  claim: The phrase can refer broadly to gaining or influencing people, not specifically to evangelistic conversion.
  evidence:
  - The POB lexical rationale says נְפָשׂוֹת includes persons or lives.
  - The POB theological decision identifies wise influence as the controlling sense.
  confidence: high
  alternatives_preserved:
  - takes persons
  - takes lives
translation_notes:
  risk_flags:
