translation:
  language: en
  text: The fruit of righteous people is a tree of life. Whoever wins people over[a] is wise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “takes persons” or “takes lives” and may refer broadly to gaining influence with people.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the righteous
  simplified_phrase: righteous people
  preserved_meaning: The phrase refers generally to people who live rightly, without limiting it to men.
  reasoning_layer_used: POB lexical decision for צַדִּיק
  rationale: The plural wording makes the generic sense immediately clear.
- pob_phrase: and he who wins souls is wise
  simplified_phrase: Whoever wins people over is wise
  preserved_meaning: Wisdom is shown by gaining or influencing people, not specifically by evangelistic conversion.
  reasoning_layer_used: POB lexical and theological decisions for לֹקֵחַ נְפָשׂוֹת
  rationale: This wording avoids the modern religious misunderstanding of “wins souls.”
- pob_phrase: The fruit of the righteous is a tree of life, and
  simplified_phrase: The fruit of righteous people is a tree of life. Whoever
  preserved_meaning: The concrete fruit and tree-of-life images remain linked to righteous living.
  reasoning_layer_used: POB lexical decisions for פְּרִי and עֵץ חַיִּים
  rationale: Dividing the proverb into two sentences makes its parallel claims easier to follow.
interpretive_expansions:
- pob_phrase: wins souls
  rendering: wins people over
  claim: “Souls” refers here to whole persons, and “wins” means gaining or influencing them.
  evidence:
  - The POB lexical rationale says נְפָשׂוֹת includes persons or lives rather than only immaterial souls.
  - The POB theological decision identifies broad wise influence rather than explicit evangelistic conversion.
  confidence: high
  alternatives_preserved:
  - takes persons
  - takes lives
translation_notes:
  risk_flags:
  - risk: “Wins people over” may sound more narrowly persuasive than the Hebrew idiom requires.
    mitigation: The footnote preserves the literal alternatives and the broader sense of influence.
