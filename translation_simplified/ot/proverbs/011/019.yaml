  language: en
  text: So, righteous living leads to life,[a] but whoever keeps pursuing evil brings death on himself.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Indeed, righteousness is for life.” The Hebrew first line has no stated verb.
