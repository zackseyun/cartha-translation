translation:
  language: en
  text: So, doing what is right leads to life, but anyone who keeps pursuing evil is heading toward their own death.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: righteousness
  simplified_phrase: doing what is right
  preserved_meaning: Moral uprightness rather than the narrower idea of social justice.
  reasoning_layer_used: POB lexical and theological decisions on צְדָקָה
  rationale: The verbal phrase makes the moral way of life clear to readers unfamiliar with “righteousness.”
- pob_phrase: whoever pursues evil
  simplified_phrase: anyone who keeps pursuing evil
  preserved_meaning: A continuing or habitual pursuit of moral evil.
  reasoning_layer_used: POB lexical decision on וּמְרַדֵּף and רָעָה
  rationale: “Keeps pursuing” clearly conveys the participle’s ongoing force.
- pob_phrase: heads toward his own death
  simplified_phrase: is heading toward their own death
  preserved_meaning: Pursuing evil directs each person toward that person’s death.
  reasoning_layer_used: POB lexical decision on לְמוֹתוֹ and applied grammar revision
  rationale: The natural singular “their” avoids a gender-marked generic pronoun without weakening the personal outcome.
translation_notes:
  risk_flags:
