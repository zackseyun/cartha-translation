  preserved_meaning: Moral uprightness is a way of life, not merely a single right act.
  reasoning_layer_used: POB lexical and theological decisions on צְדָקָה
  rationale: This keeps the ethical sense of righteousness while making it concrete for common readers.
- pob_phrase: he who pursues evil
  simplified_phrase: whoever keeps pursuing evil
  preserved_meaning: The participle describes anyone habitually chasing evil.
  reasoning_layer_used: POB lexical decision on וּמְרַדֵּף
  rationale: “Whoever keeps pursuing” is inclusive, natural English that preserves the ongoing force.
- pob_phrase: to his own death
  simplified_phrase: brings death on himself
  preserved_meaning: Pursuing evil results in the pursuer’s own death.
  reasoning_layer_used: POB lexical decision on לְמוֹתוֹ
  rationale: The active wording clearly expresses the stated result without weakening personal responsibility.
