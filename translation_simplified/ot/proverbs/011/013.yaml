translation:
  language: en
  text: A gossip gives away a secret, but someone who is trustworthy in spirit[a] keeps it private.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally “faithful of spirit,” describing someone who is inwardly reliable and discreet.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: reveals a secret
  simplified_phrase: gives away a secret
  preserved_meaning: The gossip makes private information known.
  reasoning_layer_used: POB lexical decisions for מְגַלֶּה and סּוֹד
  rationale: “Gives away” expresses harmful disclosure in familiar English.
- pob_phrase: one who is faithful in spirit
  simplified_phrase: someone who is trustworthy in spirit
  preserved_meaning: The person is inwardly reliable and discreet.
  reasoning_layer_used: POB lexical decision for נֶאֱמַן רוּחַ
  rationale: “Trustworthy” clarifies the kind of faithfulness while retaining “spirit.”
- pob_phrase: conceals a matter
  simplified_phrase: keeps it private
  preserved_meaning: The trustworthy person does not disclose the confidential matter.
  reasoning_layer_used: POB lexical decisions for מְכַסֶּה and דָבָר
  rationale: The pronoun preserves the parallel, and “keeps it private” is immediately clear.
