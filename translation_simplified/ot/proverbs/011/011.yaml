translation:
  language: en
  text: A city prospers through the blessing of upright people,[a] but wicked people tear it down with their words.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Their “blessing” may mean either their spoken blessing or the good influence they bring.
