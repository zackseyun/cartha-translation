translation:
  language: en
  text: A king’s lips pronounce a divine verdict. When he judges, his mouth does not betray justice.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “divine verdict” often means “divination” or “oracle,” but here it refers to a king’s judicial decision.
    reason: lexical_alternative
