translation:
  language: en
  text: Gray hair is a crown of honor when it accompanies a righteous way of life.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated, “Gray hair is a crown of glory; it is found on the path of righteousness.”
    reason: lexical_alternative
  - marker: b
    text: This is a general wisdom principle, not a promise that every righteous person will live to old age.
    reason: cultural_note
simplification_decisions:
- pob_phrase: a crown of glory
  simplified_phrase: a crown of honor
  preserved_meaning: Gray hair is pictured as a crown that brings dignity and esteem.
  reasoning_layer_used: Lexical decision for תִּפְאֶרֶת
  rationale: “Honor” gives the intended sense of “glory” in immediate, common English.
- pob_phrase: it is found in the way of righteousness
  simplified_phrase: when it accompanies a righteous way of life
  preserved_meaning: Gray hair is honorable when associated with morally upright living.
  reasoning_layer_used: Theological decision on the second colon
  rationale: The new wording explains the Hebrew life-path idiom without making longevity a guarantee.
interpretive_expansions:
- pob_phrase: it is found in the way of righteousness
  rendering: when it accompanies a righteous way of life
  claim: The second line connects the honor of gray hair with a life marked by righteousness.
  evidence:
  - The POB cultural note states that gray hair is honorable when it accompanies a righteous life.
  - The theological decision identifies this as the intended general wisdom principle.
  - The Hebrew “way” idiom denotes a course of life or conduct.
  confidence: high
  alternatives_preserved:
  - The more literal “it is found on the path of righteousness” is retained in footnote a.
translation_notes:
  risk_flags:
  - risk: “When it accompanies” states the relational force more directly than the ambiguous Hebrew “is found.”
    mitigation: Footnote a preserves the more literal wording and its ambiguity.
  - risk: Readers may still treat the proverb as a guarantee of long life for righteous people.
    mitigation: Footnote b explicitly identifies it as a general wisdom principle.
