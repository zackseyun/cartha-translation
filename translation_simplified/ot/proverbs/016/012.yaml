simplification_decisions:
- pob_phrase: It is an abomination
  simplified_phrase: It is detestable
  preserved_meaning: Wicked conduct by kings is morally abhorrent.
  reasoning_layer_used: POB lexical decision for תּוֹעֲבַת
  rationale: “Detestable” expresses the strong moral judgment in more familiar English.
- pob_phrase: to do wickedness
  simplified_phrase: to do what is wicked
  preserved_meaning: Kings are condemned for engaging in morally evil conduct.
  reasoning_layer_used: POB lexical decisions for עֲשׂוֹת and רֶשַׁע
  rationale: The recast phrase sounds natural while retaining the moral force of “wickedness.”
- pob_phrase: a throne is established by righteousness
  simplified_phrase: righteousness makes a throne secure
  preserved_meaning: A king’s rule becomes stable through righteous conduct.
  reasoning_layer_used: POB lexical and theological decisions for בְּצְדָקָה, יִכּוֹן, and כִּסֵּא
