translation:
  language: en
  text: Through steadfast love and faithfulness, atonement is made for wrongdoing.[a] Through fear of Yahweh, a person turns away from evil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “steadfast love and truth.” The Hebrew does not say who makes atonement.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: iniquity is atoned for
  simplified_phrase: atonement is made for wrongdoing
  preserved_meaning: Wrongdoing receives atonement while the one who makes it remains unstated.
  reasoning_layer_used: Lexical and theological decisions on יְכֻפַּר and עָוֺן
  rationale: The recast passive is easier to read without resolving the agent.
- pob_phrase: and by the fear of Yahweh one turns away from evil
  simplified_phrase: Through fear of Yahweh, a person turns away from evil
  preserved_meaning: Reverence for Yahweh is the means by which people reject moral evil.
  reasoning_layer_used: Lexical decisions on יְהוָה, סוּר, and מֵרָע
  rationale: A second sentence and a generic “a person” make the proverb natural in modern English.
translation_notes:
  risk_flags:
  - risk: Readers may assume that human virtue earns atonement.
    mitigation: The passive wording and footnote preserve the Hebrew’s unstated agent.
