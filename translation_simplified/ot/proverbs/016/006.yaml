translation:
  language: en
  text: Through steadfast love and faithfulness, sin is atoned for.[a][b] Reverent fear of Yahweh leads people to turn away from evil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “steadfast love and truth.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew does not say who brings about the atonement.
    reason: alternative_reading
