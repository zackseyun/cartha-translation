simplification_decisions:
- pob_phrase: Everyone who is proud in heart is an abomination to Yahweh
  simplified_phrase: Everyone with a proud heart is detestable to Yahweh
  preserved_meaning: Yahweh strongly rejects every inwardly proud person.
  reasoning_layer_used: POB lexical decisions for תּוֹעֲבַת and גְּבַהּ לֵב
  rationale: “Detestable” communicates the strong moral force of “abomination” in more immediately understandable English.
- pob_phrase: he will not go unpunished
  simplified_phrase: they will not escape punishment
  preserved_meaning: No proud person will avoid Yahweh’s punishment.
  reasoning_layer_used: POB lexical decision for לֹא יִנָּקֶה
  rationale: The active wording is clearer while preserving the certainty that punishment cannot be avoided.
translation_notes:
  risk_flags:
