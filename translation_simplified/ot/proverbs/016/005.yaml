translation:
  language: en
  text: 'Everyone with a proud heart is detestable to Yahweh. Be assured[a]: they will not escape punishment.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “hand to hand.” It is probably an assurance formula, but it may mean “even if they join hands” in alliance.
