  preserved_meaning: The man is characterized by crooked or perverse conduct.
  reasoning_layer_used: POB lexical decision for תַּהְפֻּכוֹת
  rationale: “Twisted ways” avoids an unclear or narrowly sexual reading of “perverse.”
- pob_phrase: stirs up strife
