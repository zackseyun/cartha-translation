translation:
  language: en
  text: It is better to be slow to anger than to be a mighty man, and better to rule your own spirit[a] than to capture a city.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “spirit” means a person’s inner disposition and impulses; it may also be translated “temper” or “self.”
    reason: lexical_alternative
