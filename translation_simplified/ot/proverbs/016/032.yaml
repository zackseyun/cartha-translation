translation:
  language: en
  text: It is better to be slow to anger than to be a mighty warrior. It is better to rule your own spirit[a] than to capture a city.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “spirit” means a person’s inner impulses or temper.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Better is one who is slow to anger than a mighty man
  simplified_phrase: It is better to be slow to anger than to be a mighty warrior.
  preserved_meaning: Patience is greater than impressive human strength.
  reasoning_layer_used: Lexical decisions for אֶרֶךְ אַפַּיִם and גִּבּוֹר
  rationale: The recast comparison is natural English, while “warrior” makes the implied military contrast clear.
- pob_phrase: and one who rules his spirit than one who captures a city
  simplified_phrase: It is better to rule your own spirit than to capture a city.
  preserved_meaning: Mastering one’s inner impulses is greater than military conquest.
  reasoning_layer_used: Lexical and theological decisions for בְּרוּחוֹ and מִלֹּכֵד עִיר
  rationale: A second complete sentence clarifies the parallel without weakening the inner-versus-outer conquest image.
interpretive_expansions:
- pob_phrase: a mighty man
  rendering: a mighty warrior
  claim: The mighty person is presented with military force in view.
  evidence:
  - The lexical rationale notes that גִּבּוֹר often has martial connotations.
  - The parallel line compares him with someone who captures a city.
  confidence: high
  alternatives_preserved:
  - mighty man
  - strong man
translation_notes:
  risk_flags:
  - risk: “Warrior” is narrower than the broader possible sense of “mighty man.”
    mitigation: The city-capture parallel strongly supports the martial sense in this proverb.
  - risk: Modern readers may take “spirit” as referring only to an immaterial soul.
    mitigation: The anchored footnote identifies the intended sense as inner impulses or temper.
