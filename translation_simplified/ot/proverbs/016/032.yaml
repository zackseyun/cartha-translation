  preserved_meaning: Self-restraint in anger is greater than outward strength.
  reasoning_layer_used: POB lexical decisions for טוֹב and אֶרֶךְ אַפַּיִם
  rationale: The recast comparison uses ordinary English while retaining “slow to anger” and “mighty man.”
- pob_phrase: one who rules his spirit than one who captures a city
  simplified_phrase: better to rule your own spirit than to capture a city
  preserved_meaning: Mastering one’s inner impulses surpasses military conquest.
  reasoning_layer_used: POB theological decision for רוּחַ and lexical decision for לֹכֵד עִיר
  rationale: The direct wording clarifies the parallel while preserving both inner rule and city capture.
