translation:
  language: en
  text: Entrust what you do to Yahweh,[a] and your plans will stand firm.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says, “Roll what you do onto Yahweh,” an image of placing it in his care.
    reason: lexical_alternative
  - marker: b
    text: “Plans” can also mean “thoughts” or “purposes.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Commit your works to Yahweh
  simplified_phrase: Entrust what you do to Yahweh
  preserved_meaning: Place your actions and undertakings in Yahweh’s care.
  reasoning_layer_used: Lexical decisions for גֹּל and מַעֲשֶׂיךָ
  rationale: “Entrust” and “what you do” express the idiom and broad noun in common English.
- pob_phrase: your plans will be established
  simplified_phrase: your plans will stand firm
  preserved_meaning: The plans will become established and secure.
  reasoning_layer_used: Lexical decision for וְיִכֹּנוּ
  rationale: “Stand firm” clearly conveys the Hebrew result of being established.
