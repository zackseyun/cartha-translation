translation:
  language: en
  text: Entrust what you do to Yahweh[a], and your plans[b] will stand firm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says, “Roll what you do onto Yahweh,” an image of placing it in his care.
    reason: lexical_alternative
  - marker: b
    text: Or “thoughts” or “purposes.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Commit your works to Yahweh
  simplified_phrase: Entrust what you do to Yahweh
  preserved_meaning: Place your actions and undertakings in Yahweh’s care.
  reasoning_layer_used: Lexical decisions for גֹּל and מַעֲשֶׂיךָ
  rationale: “Entrust what you do” makes both the idiom and the broad sense of “works” immediately clear.
- pob_phrase: will be established
  simplified_phrase: will stand firm
  preserved_meaning: The plans will become settled and secure.
  reasoning_layer_used: Lexical decision for וְיִכֹּנוּ
  rationale: “Stand firm” expresses the Hebrew result in more familiar language.
translation_notes:
  risk_flags:
