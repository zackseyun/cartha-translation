translation:
  language: en
  text: Yahweh has made everything for its purpose—even the wicked, whom he has destined for the day of disaster.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “for himself.” The Hebrew can also mean, “Yahweh has made everything for himself.”
    reason: lexical_alternative
  - marker: b
    text: Or “the day of calamity” or “a day of evil.” Here “evil” means disaster or ruin, not moral evil.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Yahweh has made everything for its purpose, even the wicked
  simplified_phrase: Yahweh has made everything for its purpose—even the wicked
  preserved_meaning: The wicked remain included in Yahweh’s ordering of everything toward its fitting end.
  reasoning_layer_used: POB syntax and theological decision
  rationale: The dash highlights the exceptional case without breaking its connection to Yahweh’s action.
- pob_phrase: even the wicked for the day of disaster
  simplified_phrase: even the wicked, whom he has destined for the day of disaster
  preserved_meaning: Yahweh orders the wicked toward eventual disaster rather than creating moral evil.
  reasoning_layer_used: POB theological decision and lexical decision for לְיוֹם רָעָה
  rationale: The relative clause makes the implied relationship clear while keeping Yahweh as its source.
interpretive_expansions:
- pob_phrase: even the wicked for the day of disaster
  rendering: even the wicked, whom he has destined for the day of disaster
  claim: Yahweh’s ordering includes the wicked facing eventual disaster or judgment.
  evidence:
  - The POB theological decision says the wicked are destined for a day of disaster or judgment.
  - The Hebrew phrase לְיוֹם רָעָה identifies disaster as their appointed end.
  confidence: high
  alternatives_preserved:
  - for the day of calamity
  - for a day of evil
translation_notes:
  risk_flags:
  - risk: “Destined” could be misunderstood to mean that Yahweh causes wickedness itself.
    mitigation: The wording limits the destiny to the day of disaster, and footnote b distinguishes disaster from moral evil.
