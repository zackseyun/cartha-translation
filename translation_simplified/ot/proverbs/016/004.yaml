translation:
  language: en
  text: Yahweh made everything for its own purpose.[a] Even the wicked are destined for the day of disaster.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “for himself”; the Hebrew phrase can also mean, “Yahweh made everything for himself.”
