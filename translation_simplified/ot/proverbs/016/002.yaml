  preserved_meaning: The man is judging his own conduct favorably.
  reasoning_layer_used: POB lexical decisions for זַךְ and בְּעֵינָיו
  rationale: This expresses the Hebrew self-assessment idiom in ordinary English.
- pob_phrase: weighs the spirits
  simplified_phrase: weighs people's inner spirits
  preserved_meaning: Yahweh accurately assesses human inner dispositions while retaining the weighing image.
  reasoning_layer_used: POB lexical and theological decisions for וְתֹכֵן רוּחוֹת
  rationale: Adding “people's inner” prevents “spirits” from sounding like supernatural beings.
