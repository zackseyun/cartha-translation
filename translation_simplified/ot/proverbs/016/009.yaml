simplification_decisions:
- pob_phrase: A man's heart plans his way
  simplified_phrase: In his heart, a man plans his path
  preserved_meaning: The heart remains the place of thought and intention, while the path pictures his intended course in life.
  reasoning_layer_used: Lexical decisions for לֵב, יְחַשֵּׁב, and דַּרְכּוֹ
  rationale: The recast clause states the action directly while preserving the Hebrew images of heart and path.
- pob_phrase: Yahweh establishes his steps
  simplified_phrase: Yahweh establishes his steps
  preserved_meaning: Yahweh decisively orders the man's actual course without denying genuine human planning.
  reasoning_layer_used: Lexical decision for יָכִין and theological decision on divine sovereignty and human planning
  rationale: Retaining “establishes” preserves the decisive contrast without narrowing it to stability, guidance, or determinism.
translation_notes:
  risk_flags:
  - risk: “Establishes his steps” may remain unfamiliar to some readers.
    mitigation: The path-and-steps imagery supplies the life-course sense, and the footnote gives the clearer alternative “directs.”
