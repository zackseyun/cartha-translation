translation:
  language: en
  text: A man plans his path in his mind,[a] but Yahweh makes his steps firm.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally “heart,” meaning the inner center of thought and intention.
    reason: simplification_note
  - marker: b
    text: Or “directs his steps.” The Hebrew can mean “makes firm,” “establishes,” or “directs.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: A man's heart plans his way
  simplified_phrase: A man plans his path in his mind
  preserved_meaning: A man intentionally plans his course of life within himself.
  reasoning_layer_used: POB lexical decisions for heart, plans, man, and way
  rationale: “Mind” clarifies thought and intention, while the note preserves the Hebrew heart image and “path” retains the course-of-life metaphor.
- pob_phrase: Yahweh establishes his steps
  simplified_phrase: Yahweh makes his steps firm
  preserved_meaning: Yahweh decisively establishes the man's course without denying genuine human planning.
  reasoning_layer_used: POB lexical and theological decisions for יָכִין and divine sovereignty
  rationale: The wording states the verb's core image plainly without implying that every step is fixed in a location.
translation_notes:
  risk_flags:
  - risk: “Mind” does not reproduce the Hebrew image of the heart.
    mitigation: Footnote [a] supplies the literal image and explains its contextual meaning.
  - risk: “Makes his steps firm” may be mistaken for a promise of ease or success.
    mitigation: The parallel and footnote keep the sense focused on Yahweh establishing or directing the course.
