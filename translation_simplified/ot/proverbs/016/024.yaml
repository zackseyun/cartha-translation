translation:
  language: en
  text: Pleasant words are like honey from the comb. They are sweet to a person’s life[a] and bring healing to the bones.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean one’s self; in this food image, “appetite” is possible.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Pleasant words are honey from the comb
  simplified_phrase: Pleasant words are like honey from the comb
  preserved_meaning: Pleasant speech is compared to comb honey, not to the wax comb itself.
  reasoning_layer_used: POB lexical decision for צוּף דְּבַשׁ
  rationale: The explicit comparison is natural English and preserves the honey image.
- pob_phrase: sweet to the soul
  simplified_phrase: They are sweet to a person’s life
  preserved_meaning: Pleasant words benefit a person’s life or self, while appetite remains possible.
  reasoning_layer_used: POB lexical decision and footnote for לַנֶּפֶשׁ
  rationale: “A person’s life” avoids a narrow immaterial sense without claiming the total-person reading.
- pob_phrase: and healing to the bones
  simplified_phrase: and bring healing to the bones
  preserved_meaning: Pleasant words have a deeply restorative effect expressed through the concrete image of bones.
  reasoning_layer_used: POB lexical decisions for וּמַרְפֵּא and לָעָצֶם
  rationale: Adding a verb produces natural English while retaining the bodily image.
