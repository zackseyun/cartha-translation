translation:
  language: en
  text: Otherwise, I may have plenty, deny you, and say, “Who is Yahweh?” Or I may become poor, steal, and bring dishonor to the name of my God.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “misuse the name of my God.” The Hebrew expression literally speaks of grasping God’s name and likely means dishonoring it.
    reason: lexical_alternative
