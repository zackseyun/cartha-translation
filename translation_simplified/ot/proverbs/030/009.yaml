translation:
  language: en
  text: If I have plenty, I may deny you and say, “Who is Yahweh?” Or if I become poor, I may steal and dishonor the name of my God.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: lest I become full
  simplified_phrase: If I have plenty, I may
  preserved_meaning: Abundance could lead to the feared result of denying God.
  reasoning_layer_used: Lexical decision for פֶּן and אֶשְׂבַּע
  rationale: The conditional wording expresses the warning naturally while retaining uncertainty.
- pob_phrase: or lest I become poor and steal
  simplified_phrase: Or if I become poor, I may steal
  preserved_meaning: Poverty could tempt the speaker to theft.
  reasoning_layer_used: Lexical decisions for אִוָּרֵשׁ and גָנַבְתִּי
  rationale: A short conditional clause makes the feared sequence easy to follow.
- pob_phrase: profane the name of my God
  simplified_phrase: dishonor the name of my God
  preserved_meaning: Theft would bring contempt on God’s name through the speaker’s conduct.
  reasoning_layer_used: Lexical and theological decision for תָפַשְׂתִּי שֵׁם אֱלֹהָי
  rationale: “Dishonor” communicates the idiom clearly without limiting it to spoken misuse.
translation_notes:
  risk_flags:
  - risk: “Dishonor” may sound less technical than “profane.”
    mitigation: The wording retains the core idea of bringing contempt on God’s name through wrongdoing.
