translation:
  language: en
  text: Do not add anything to God’s words.[b] Otherwise, God will rebuke you, and you will be shown to be a liar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “shown to be false.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew says “his words.” The context points to God, though the wording can be understood more generally.
    reason: source_note
simplification_decisions:
- pob_phrase: Do not add to his words
  simplified_phrase: Do not add anything to God’s words.
  preserved_meaning: The command forbids supplementing God’s words.
  reasoning_layer_used: Lexical decisions and the theological decision from Proverbs 30:5
  rationale: “Anything” clarifies the scope, and naming God identifies the contextual referent.
- pob_phrase: lest
  simplified_phrase: Otherwise,
  preserved_meaning: God’s rebuke remains the consequence the warning seeks to prevent.
  reasoning_layer_used: Lexical decision for פֶּן
  rationale: “Otherwise” gives the warning force in familiar English.
- pob_phrase: and you be proved a liar
  simplified_phrase: and you will be shown to be a liar
  preserved_meaning: The person is exposed as false without making the exposure a separate action explicitly assigned to God.
  reasoning_layer_used: Lexical decision for וְנִכְזָבְתָּ and grounding review
  rationale: The passive wording is clear while retaining the Hebrew’s resultative force.
interpretive_expansions:
- pob_phrase: add to
  rendering: add anything to
  claim: The prohibition covers any addition to the words.
  evidence:
  - The documented lexical alternative is “add anything.”
  - The negative prohibition applies to the act of adding.
  confidence: high
- pob_phrase: his words; he rebuke
  rendering: God’s words; God will rebuke
  claim: The pronouns refer to God in the immediate context.
  evidence:
  - Proverbs 30:5 speaks of every word of God.
  - The POB theological decision identifies God as the natural referent.
  confidence: high
  alternatives_preserved:
  - The Hebrew pronoun can be read more generally, as noted in footnote b.
translation_notes:
  risk_flags:
  - risk: Naming God makes the contextual referent explicit beyond the Hebrew pronoun.
    mitigation: Footnote b gives the literal wording and preserves the documented broader reading.
  - risk: Splitting the warning into two sentences may soften its compact form.
    mitigation: “Otherwise” keeps the consequence directly connected to the command.
