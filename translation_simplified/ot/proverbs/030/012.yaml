translation:
  language: en
  text: There is a generation of people who consider themselves pure, yet they have not been washed clean of their filth.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word for “filth” can also mean dung or excrement; the image is deliberately vivid.
