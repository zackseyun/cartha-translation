translation:
  language: en
  text: Anyone who mocks a father and treats obedience to a mother[a] with contempt will have that mocking eye pecked out by ravens in the valley. Young eagles[b] will eat it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “treats a mother’s command or instruction with contempt.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word may refer to eagles or vultures.
    reason: lexical_alternative
