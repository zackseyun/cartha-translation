translation:
  language: en
  text: The eye that mocks a father and scorns obeying a mother[a] will be pecked out by ravens in the valley[b] and eaten by young eagles.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “scorns a mother’s command or instruction”; the rare Hebrew word refers to the obedience or heed owed to her.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also mean a wadi or dry streambed.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew word can refer to an eagle or a vulture.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: despises obedience to a mother
  simplified_phrase: scorns obeying a mother
  preserved_meaning: The person treats the obedience owed to a mother with contempt.
  reasoning_layer_used: POB lexical decision for יִקֲּהַת אֵם
  rationale: The verbal form is easier to understand while the note preserves the rare term’s ambiguity.
- pob_phrase: the ravens of the valley will peck it out
  simplified_phrase: will be pecked out by ravens in the valley
  preserved_meaning: Valley ravens violently remove the mocking eye.
  reasoning_layer_used: POB lexical decisions for יִקְּרוּהָ and עֹרְבֵי נַחַל
  rationale: The passive wording makes the eye’s fate easier to follow without weakening the image.
- pob_phrase: the young of the eagle will eat it
  simplified_phrase: eaten by young eagles
  preserved_meaning: Young eagles consume the eye after it is torn out.
  reasoning_layer_used: POB lexical decision for בְנֵי נָשֶׁר
  rationale: The shorter natural phrase retains the bird image and its grim result.
translation_notes:
  risk_flags:
  - risk: Readers may take “eye” only as a body part and miss that it represents the contemptuous person.
    mitigation: The concrete eye image is retained because it carries the proverb’s force.
  - risk: “Eagles” may conceal that נשר can also denote vultures.
    mitigation: Footnote c preserves the lexical ambiguity.
