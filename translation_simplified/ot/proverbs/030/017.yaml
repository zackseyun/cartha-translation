  text: The eye that mocks a father and despises obedience to a mother[a]—the ravens of the valley[b] will peck it out, and the young of the eagle[c] will eat it.
  footnotes:
  - marker: a
    text: Or 'a mother's command/instruction'; the rare Hebrew term likely refers to the obedience or heed owed to one's mother.
    reason: lexical_alternative
