translation:
  language: en
  text: Who has gone up to heaven[a] and come down? Who has gathered the wind in his hands? Who has wrapped the waters in a garment? Who has set the farthest reaches of the earth in place? What is his name? What is his son’s name—if you know?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the heavens.”
    reason: lexical_alternative
  - marker: b
    text: Or “surely you know!” The Hebrew may give the final challenge this force.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: has established all the ends of the earth
  simplified_phrase: has set the farthest reaches of the earth in place
  preserved_meaning: The question still concerns establishing the earth to its furthest limits.
  reasoning_layer_used: Lexical decision for הֵקִים כָּל אַפְסֵי אָרֶץ
  rationale: Common wording explains both “established” and the idiom “ends of the earth.”
- pob_phrase: What is his name, and what is his son's name
  simplified_phrase: What is his name? What is his son’s name
  preserved_meaning: Both questions remain distinct, including the specific reference to his son.
  reasoning_layer_used: Lexical and theological decisions on שְׁמוֹ and שֶׁם בְּנוֹ
  rationale: Two short questions are easier to follow without identifying either figure.
translation_notes:
  risk_flags:
  - risk: Readers may treat “his son” as an explicit identification not supplied by the verse.
    mitigation: The text retains the question without adding a messianic or human identification.
  - risk: The final Hebrew clause can sound like either a condition or an ironic challenge.
    mitigation: The main text follows “if you know,” while a footnote preserves the alternate force.
