translation:
  language: en
  text: Who has gone up to heaven and come down? Who has gathered the wind in his hands? Who has wrapped up the waters in a cloak? Who has set the farthest reaches of the earth in place? What is his name, and what is his son’s name[b]? Surely you know![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “if you know.” The words are an ironic challenge.
    reason: lexical_alternative
  - marker: b
    text: Christian interpretation has often found significance in “his son,” but the Hebrew does not identify the son.
    reason: cross_reference
simplification_decisions:
- pob_phrase: wrapped the waters in a garment
  simplified_phrase: wrapped up the waters in a cloak
  preserved_meaning: The waters are pictured as being bound inside an outer garment.
  reasoning_layer_used: Lexical decision for צָרַר מַיִם בַּשִּׂמְלָה
  rationale: “Wrapped up” and “cloak” make the concrete image easier to picture.
- pob_phrase: established all the ends of the earth
  simplified_phrase: set the farthest reaches of the earth in place
  preserved_meaning: The question concerns who fixed the whole earth in its ordered place.
  reasoning_layer_used: Lexical decision for הֵקִים כָּל אַפְסֵי אָרֶץ
  rationale: The new wording explains both “established” and the idiom “ends of the earth.”
- pob_phrase: surely you know!
  simplified_phrase: Surely you know!
  preserved_meaning: The closing words remain an ironic challenge rather than a plain assertion.
  reasoning_layer_used: Lexical decision and doctrine realignment for כִּי תֵדָע
  rationale: The controlling POB wording is retained because it clearly carries the intended taunting force.
translation_notes:
  risk_flags:
  - risk: Readers may take “Surely you know!” as a sincere assertion.
    mitigation: The footnote identifies its ironic force and preserves “if you know” as an alternative.
  - risk: Readers may assume the son is explicitly identified in the Hebrew.
    mitigation: The footnote preserves the phrase while stating that the verse does not identify him.
