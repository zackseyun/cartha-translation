translation:
  language: en
  text: Sheol, the realm of the dead; a womb that cannot bear children; earth that never has enough water; and fire that never says, “Enough.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The final Hebrew expression is difficult; “Enough” best fits the context, though some propose a meaning related to wealth or substance.
    reason: lexical_alternative
