translation:
  language: en
  text: There is a generation of people who curse their own fathers and do not bless their own mothers.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “do not bless” can also mean “do not speak well of” or “do not honor.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a generation that curses
  simplified_phrase: a generation of people who curse
  preserved_meaning: “Generation” still describes a class of people marked by the same behavior.
  reasoning_layer_used: POB lexical decision for דּוֹר and the repeated pattern in Proverbs 30:11–14
  rationale: Adding “of people” makes the collective expression immediately clear without losing the literary term “generation.”
- pob_phrase: its father ... its mother
  simplified_phrase: their own fathers ... their own mothers
  preserved_meaning: Each person’s offense is directed against that person’s parents.
  reasoning_layer_used: POB lexical decisions for אָבִיו and אִמּוֹ
  rationale: Plural personal pronouns avoid the unnatural impression that a generation itself has parents.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “generation” only as an age group.
    mitigation: The phrase “generation of people” allows the broader sense of a class characterized by shared conduct.
