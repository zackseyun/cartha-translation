  preserved_meaning: The generation is a class of people characterized by contempt for their fathers.
  reasoning_layer_used: Lexical decisions for דּוֹר, אָבִיו, and יְקַלֵּל
  rationale: The plural wording makes the collective sense natural while retaining “generation” and the force of “curse.”
- pob_phrase: does not bless its mother
  simplified_phrase: do not bless their mothers
  preserved_meaning: These people fail to bless, speak well of, or honor their mothers.
  reasoning_layer_used: Lexical decision for לֹא יְבָרֵךְ and POB footnote b
  rationale: The main text retains “bless” for the Hebrew parallel, while the note explains its contextual sense.
