translation:
  language: en
  text: 'an eagle’s flight through the sky,

    a snake’s path across a rock,

    a ship’s course through the heart of the sea,

    and a man’s way with a young woman.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a maiden.” The Hebrew means a young woman and does not by itself specify virginity.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the way of an eagle in the sky
  simplified_phrase: an eagle’s flight through the sky
  preserved_meaning: The line still portrays the eagle’s difficult-to-trace movement in the sky.
  reasoning_layer_used: Lexical decision for דֶּרֶךְ and immediate poetic context
  rationale: “Flight” makes the kind of movement clear without explaining the mystery.
- pob_phrase: the way of a snake on a rock
  simplified_phrase: a snake’s path across a rock
  preserved_meaning: The image remains a snake moving over a rocky surface.
  reasoning_layer_used: Lexical decisions for דֶּרֶךְ and עֲלֵי צוּר
  rationale: “Path across” is more natural English while retaining the path image.
- pob_phrase: the way of a ship in the heart of the sea
  simplified_phrase: a ship’s course through the heart of the sea
  preserved_meaning: The ship’s movement through the midst of the sea and the Hebrew heart image are both retained.
  reasoning_layer_used: Lexical decision and cultural note for בְלֶב יָם
  rationale: “Course through” clarifies motion while preserving the vivid expression “heart of the sea.”
translation_notes:
  risk_flags:
  - risk: “A man’s way with a young woman” may suggest courtship or sexual relations more strongly to some readers.
    mitigation: The wording remains deliberately broad, matching the POB decision not to resolve the Hebrew’s suggestive ambiguity.
