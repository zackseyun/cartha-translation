  language: en
  text: under a woman who is hated when she gets married, and under a female servant when she takes her mistress’s place.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb can also mean “inherits from her mistress”; here it likely means taking over her mistress’s place or status.
