translation:
  language: en
  text: For churning milk makes butter,[a] squeezing a nose draws blood, and stirring up anger starts a quarrel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may refer to butter, curds, or another milk product made by churning or curdling.
    reason: lexical_alternative
  - marker: b
    text: In Hebrew, the words for “nose” and “anger” are related, creating a wordplay that links the last two lines.
    reason: lexical_alternative
