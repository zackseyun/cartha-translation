translation:
  language: en
  text: You must strike him with the rod. By doing so, you will rescue his life[a] from Sheol[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “his soul.” The Hebrew word can mean a person’s life, self, or soul.
    reason: lexical_alternative
  - marker: b
    text: Sheol is the Hebrew name for the realm of the dead; it may also be rendered “the grave.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: You are to strike him with the rod
  simplified_phrase: You must strike him with the rod
  preserved_meaning: The wording keeps both the directive force and the concrete act of striking with a rod.
  reasoning_layer_used: POB lexical decisions for בַּשֵּׁבֶט and תַּכֶּנּוּ
  rationale: “You must” states the command more directly without softening the physical verb.
- pob_phrase: and you will deliver
  simplified_phrase: By doing so, you will rescue
  preserved_meaning: The discipline is presented as the means of deliverance from death.
  reasoning_layer_used: POB lexical decision for תַּצִּיל and immediate clause relationship
  rationale: “Rescue” is common English, while “by doing so” makes the connection between the clauses easy to follow.
interpretive_expansions:
- pob_phrase: and you will deliver
  rendering: By doing so, you will rescue
  claim: The rescue is the stated result of the disciplinary action.
  evidence:
  - The Hebrew clauses directly join striking with the resulting deliverance.
  - The POB rationale reads the verse proverbially as preserving the child from a path leading to death.
  confidence: high
  alternatives_preserved:
  - and you will deliver
translation_notes:
  risk_flags:
  - risk: “By doing so” could sound like an absolute guarantee rather than proverbial wisdom.
    mitigation: The wording retains POB’s direct future statement without adding claims beyond it.
  - risk: Modern readers may mistake Sheol for a fully defined doctrine of the afterlife.
    mitigation: The footnote gives the broader Hebrew sense and preserves “the grave” as an alternative.
