translation:
  language: en
  text: Strike him with the rod, and you will rescue his life from the realm of the dead.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew Sheol means the realm of the dead; it may also be translated “the grave.”
    reason: lexical_alternative
  - marker: b
    text: Or “his soul.” The Hebrew word can mean a person’s life, self, or soul.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: you shall strike him
  simplified_phrase: strike him
  preserved_meaning: The command still names the physical act of striking rather than reducing it to general discipline.
  reasoning_layer_used: POB lexical decision for תַּכֶּנּוּ
  rationale: The direct imperative is clearer in modern English and preserves the Hebrew action.
- pob_phrase: you will deliver his life
  simplified_phrase: you will rescue his life
  preserved_meaning: The discipline is presented proverbially as keeping the child’s life from death or destruction.
  reasoning_layer_used: POB lexical and theological decisions for תַּצִּיל and נַפְשׁוֹ
  rationale: “Rescue” is common English while “his life” avoids imposing a body-soul distinction.
- pob_phrase: from Sheol
  simplified_phrase: from the realm of the dead
  preserved_meaning: The destination remains the Hebrew realm of death rather than merely a physical grave.
  reasoning_layer_used: POB lexical decision and footnote for מִשְּׁאוֹל
  rationale: The main text explains the unfamiliar term, while the footnote retains “Sheol” for auditability.
translation_notes:
  risk_flags:
  - risk: Modern readers may hear “rod” as either a general symbol or an endorsement of uncontrolled violence.
    mitigation: The concrete term is retained because the Hebrew names the instrument, without adding claims about method or severity.
  - risk: “Realm of the dead” may sound more specific than the Hebrew concept allows.
    mitigation: The footnote preserves “Sheol” and the alternative “the grave.”
