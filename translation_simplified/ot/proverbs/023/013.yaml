translation:
  language: en
  text: Do not hold back discipline from a boy.[a] For if you strike him with a rod,[b] he will not die.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “child” or “youth,” but the proverb uses a masculine singular form.
    reason: lexical_alternative
  - marker: b
    text: This proverb says that such correction is not itself fatal; it does not approve of abuse or promise that harm can never occur.
    reason: cultural_note
