translation:
  language: en
  text: Do not deny a boy discipline.[a] For if you strike him with a rod, he will not die.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “child” or “youth,” but its form here is masculine singular.
    reason: lexical_alternative
  - marker: b
    text: This proverb says that such correction is not in itself fatal; it does not approve abuse or promise that no act of violence can ever cause death.
    reason: cultural_note
