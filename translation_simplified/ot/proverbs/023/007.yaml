translation:
  language: en
  text: For his private calculations[a] show what he is really like. “Eat and drink,” he tells you, but his heart is not with you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “private thoughts.” The Hebrew more specifically suggests reckoning or calculating.
    reason: lexical_alternative
