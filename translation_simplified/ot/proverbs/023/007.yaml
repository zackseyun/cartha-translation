translation:
  language: en
  text: For what he calculates in his own mind shows what he is really like. “Eat and drink,” he tells you, but in his heart he is not truly with you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The first sentence may also be translated, “For what he thinks within himself shows what he is really like.” The Hebrew word suggests reckoning or calculating.
    reason: lexical_alternative
