simplification_decisions:
- pob_phrase: to dine
  simplified_phrase: to eat
  preserved_meaning: The person is sharing a meal with someone in authority.
  reasoning_layer_used: The lexical decision identifies the verb as eating a meal in a formal setting.
  rationale: “Eat” is more common than “dine” and keeps the meal setting clear.
- pob_phrase: carefully consider
  simplified_phrase: think carefully about
  preserved_meaning: The intensified Hebrew wording calls for careful thought and discernment.
  reasoning_layer_used: The lexical decision preserves the emphatic force of בין תבין.
  rationale: This wording is ordinary English while retaining thoughtful evaluation.
- pob_phrase: what is before you
  simplified_phrase: what is before you
  preserved_meaning: The phrase may refer to the food and also to the broader situation.
  reasoning_layer_used: The lexical rationale and POB footnote document the phrase’s intentional breadth.
  rationale: Retaining this wording avoids narrowing the command to physical items alone.
translation_notes:
  risk_flags:
  - risk: Readers may take “what is before you” to mean only the food.
    mitigation: The footnote preserves the possible reference to the whole situation.
