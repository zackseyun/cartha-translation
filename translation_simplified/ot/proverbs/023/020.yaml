simplification_decisions:
- pob_phrase: Do not be among
  simplified_phrase: Do not keep company with
  preserved_meaning: The prohibition concerns associating with people marked by these habits.
  reasoning_layer_used: The lexical decision for בְסֹבְאֵי identifies the preposition as expressing association.
  rationale: This wording makes the relational sense of “among” immediately clear.
- pob_phrase: heavy drinkers of wine
  simplified_phrase: people who drink too much wine
  preserved_meaning: The phrase describes a habitual practice of excessive drinking.
  reasoning_layer_used: The lexical decision for סבא emphasizes heavy drinking rather than drinking itself.
  rationale: Common wording replaces the less direct label without weakening the excess.
- pob_phrase: gluttonous eaters of meat
  simplified_phrase: gorge themselves on meat
  preserved_meaning: The phrase condemns reckless, excessive eating of meat.
  reasoning_layer_used: The lexical decisions for זלל and בָשָׂר preserve excessive consumption and meat as food.
  rationale: The active expression is clearer while retaining the force of habitual overindulgence.
