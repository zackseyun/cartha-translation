  rationale: “Keep company with” clearly expresses association without suggesting formal membership.
- pob_phrase: heavy drinkers of wine
  simplified_phrase: people who drink too much wine
  preserved_meaning: The wording describes people characterized by excessive wine drinking.
  reasoning_layer_used: The lexical decision for סֹבְאֵי identifies habitual heavy drinking rather than drinking in general.
  rationale: The descriptive wording is immediately clear to a modern reader.
- pob_phrase: those who gorge themselves on meat
  simplified_phrase: gorge themselves on meat
  preserved_meaning: The concrete image of excessive meat consumption remains intact.
  reasoning_layer_used: The lexical decisions for זֹלֲלֵי and בָשָׂר preserve both the excess and its explicit object.
  rationale: Sharing “people who” across both clauses avoids unnecessary repetition.
