simplification_decisions:
- pob_phrase: Do not let your heart envy sinners
  simplified_phrase: Do not envy sinners in your heart
  preserved_meaning: The command still forbids inward envy of people characterized by sin.
  reasoning_layer_used: Lexical decisions for יְקַנֵּא, לִבְּךָ, and בַּחַטָּאִים
  rationale: Natural English word order preserves the source's heart image and inward focus.
- pob_phrase: but be in the fear of Yahweh
  simplified_phrase: Instead, revere Yahweh
  preserved_meaning: The contrasting command calls for reverent fear directed toward Yahweh.
  reasoning_layer_used: Lexical alternative for בְּיִרְאַת יְהוָה and theological decision on the elliptical clause
  rationale: “Revere” clearly expresses the warranted sense and avoids suggesting mere terror.
- pob_phrase: all day long
  simplified_phrase: all day long
  preserved_meaning: The command applies throughout the whole day.
  reasoning_layer_used: Lexical decision for כָּל הַיּוֹם
  rationale: The clear modern phrase preserves the source's full-duration emphasis.
