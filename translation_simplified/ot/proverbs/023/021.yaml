simplification_decisions:
- pob_phrase: the drunkard and the glutton
  simplified_phrase: people who habitually drink too much or gorge themselves
  preserved_meaning: The wording presents habitual heavy drinking and self-indulgent overeating as distinct paths to poverty.
  reasoning_layer_used: POB lexical decisions for סֹבֵא and זוֹלֵל
  rationale: Describing each behavior and using “or” keeps the parallel types clear.
- pob_phrase: will come to poverty
  simplified_phrase: will become poor
  preserved_meaning: The conduct results in impoverishment rather than literal dispossession.
  reasoning_layer_used: POB lexical decision for יִוָּרֵשׁ
  rationale: The shorter phrase gives the same consequence in ordinary English.
- pob_phrase: and drowsiness will clothe one with rags
  simplified_phrase: Drowsiness will clothe a person in rags.
  preserved_meaning: The image presents sleepy neglect as a generic route to ragged poverty.
  reasoning_layer_used: POB lexical decisions for נוּמָה, תַּלְבִּישׁ, and קְרָעִים
  rationale: A separate sentence clarifies the image without tying its victim only to the preceding types.
