  simplified_phrase: when she is old
  preserved_meaning: The warning applies during the mother’s condition of old age, not only as she enters it.
  reasoning_layer_used: POB lexical decisions for כִּי and זָקְנָה
  rationale: Retaining this wording avoids shifting the focus to the process of growing old.
