- pob_phrase: for he will despise
  simplified_phrase: because he will despise
  preserved_meaning: The fool’s contemptuous rejection is the reason for the command.
  reasoning_layer_used: POB lexical decisions for כִּי and יָב֗וּז
  rationale: Because states the explanatory connection more plainly while retaining the strong verb despise.
- pob_phrase: the good sense in your words
