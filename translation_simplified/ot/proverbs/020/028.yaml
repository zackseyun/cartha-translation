translation:
  language: en
  text: Steadfast love[a] and faithfulness keep a king secure. Through steadfast love, he keeps his throne secure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Steadfast love” means loyal, enduring love expressed through committed care.
    reason: simplification_note
simplification_decisions:
- pob_phrase: preserve a king
  simplified_phrase: keep a king secure
  preserved_meaning: These virtues protect and sustain a king.
  reasoning_layer_used: Lexical decision for יִצְּרוּ and its contextual rationale
  rationale: “Keep secure” states the protective effect in common English.
- pob_phrase: and he upholds his throne by steadfast love
  simplified_phrase: Through steadfast love, he keeps his throne secure
  preserved_meaning: The king sustains his royal rule by steadfast love.
  reasoning_layer_used: Grammar revision and lexical decisions for סָעַד, בַּחֶסֶד, and כִּסְאוֹ
  rationale: The rewrite keeps the king as the active subject and preserves the throne image.
- pob_phrase: Steadfast love ... steadfast love
  simplified_phrase: Steadfast love ... steadfast love
  preserved_meaning: The same loyal and enduring love governs both clauses.
  reasoning_layer_used: Lexical decision for חֶסֶד and POB footnote c
  rationale: The repetition remains because it is deliberate in the Hebrew.
translation_notes:
  risk_flags:
  - risk: “Secure” may sound limited to physical safety.
    mitigation: Its use with both king and throne conveys the broader stability of his rule.
