  preserved_meaning: These virtues guard and sustain a king and his rule.
  reasoning_layer_used: The lexical decision for יִצְּרוּ includes the protective senses “guard” and “keep.”
  rationale: “Protect” is familiar English and avoids narrowing the meaning to personal security.
- pob_phrase: his throne is upheld
  simplified_phrase: supports his throne
  preserved_meaning: Steadfast love sustains the king’s rule while retaining the concrete throne image.
  reasoning_layer_used: The lexical decisions for סָעַד and כִּסְאוֹ preserve both support and the throne image.
  rationale: Active wording is easier to read while conveying the same sustaining action.
