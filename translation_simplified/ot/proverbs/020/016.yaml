translation:
  language: en
  text: Take his garment, because he has guaranteed a stranger’s debt or obligation. Take security from him when he guarantees debts or obligations for foreigners.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is terse. The final clause may instead refer to keeping his garment as collateral.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: for he has put up security for a stranger
  simplified_phrase: because he has guaranteed a stranger’s debt or obligation
  preserved_meaning: He has accepted responsibility for what an outsider owes or must fulfill.
  reasoning_layer_used: POB lexical rationale for עָרַב and cultural footnote b
  rationale: “Guaranteed” explains the legal expression without narrowing it to debt alone.
- pob_phrase: hold him in pledge
  simplified_phrase: Take security from him
  preserved_meaning: The command requires protection against the liability he assumed.
  reasoning_layer_used: POB lexical rationale for חַבְלֵהוּ and alternative-reading footnote a
  rationale: This states one documented reading in ordinary legal language while the footnote preserves the other.
- pob_phrase: for foreigners
  simplified_phrase: when he guarantees debts or obligations for foreigners
  preserved_meaning: The security concerns liabilities he assumed for people outside his community.
  reasoning_layer_used: POB lexical decisions for וּבְעַד and נכרים
  rationale: The added verb makes the compressed parallel clause understandable in English.
interpretive_expansions:
- pob_phrase: put up security
  rendering: guaranteed a stranger’s debt or obligation
  claim: The man accepted liability for another person’s debt or obligation.
  evidence:
