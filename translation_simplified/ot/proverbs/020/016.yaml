simplification_decisions:
- pob_phrase: for he has guaranteed a stranger’s debt
  simplified_phrase: because he guaranteed an outsider’s debt
  preserved_meaning: He accepted financial responsibility for the debt of someone outside his usual circle.
  reasoning_layer_used: POB lexical decisions for כִּי, עָרַב, and זָר
  rationale: “Because” states the cause directly, while “outsider” makes the social sense of “stranger” clearer.
- pob_phrase: take it as security
  simplified_phrase: take it as collateral
  preserved_meaning: The garment is to be taken as a pledge securing the financial obligation.
  reasoning_layer_used: POB lexical decision and wisdom-source audit for חַבְלֵהוּ
  rationale: “Collateral” expresses the financial function more directly for modern readers.
translation_notes:
