translation:
  language: en
  text: Do not say, “I will take revenge for this evil.” Wait for Yahweh with hope, and he will save you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Save” may also mean “deliver” or “vindicate” here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I will repay evil
  simplified_phrase: I will take revenge for this evil
  preserved_meaning: The speaker intends to retaliate for an evil suffered.
  reasoning_layer_used: POB lexical decision and retaliatory context
  rationale: “Take revenge” makes the reciprocal retaliation clear in ordinary English.
- pob_phrase: Wait for Yahweh
  simplified_phrase: Wait for Yahweh with hope
  preserved_meaning: Waiting for Yahweh includes expectant hope in him.
  reasoning_layer_used: POB lexical rationale and footnote b
  rationale: The added phrase brings the documented hopeful expectation into the main text.
- pob_phrase: he will save you
  simplified_phrase: he will save you
  preserved_meaning: Yahweh will rescue, deliver, or vindicate the person who waits for him.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Save” is retained because it preserves the verb’s broad scope.
interpretive_expansions:
