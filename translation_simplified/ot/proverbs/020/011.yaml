simplification_decisions:
- pob_phrase: a youth
  simplified_phrase: a young person
  preserved_meaning: The proverb applies broadly to someone young, not only to a small child or a mature man.
  reasoning_layer_used: POB lexical decision for נָעַר
  rationale: “Young person” is more familiar than “youth” while keeping the broad age range.
- pob_phrase: by his deeds
  simplified_phrase: by what they do
  preserved_meaning: A young person’s character becomes recognizable through actions.
  reasoning_layer_used: POB lexical decisions for בְּמַעֲלָלָיו and יִתְנַכֶּר
  rationale: The ordinary phrase “what they do” clearly expresses deeds as the means of recognition.
- pob_phrase: whether his conduct is pure and upright
  simplified_phrase: whether their behavior is pure and right
  preserved_meaning: The actions reveal whether the young person’s overall moral conduct is clean and upright.
  reasoning_layer_used: POB lexical decisions for זַךְ, יָשָׁר, and פָּעֳלוֹ
  rationale: “Behavior” and “right” make the ethical evaluation immediately understandable.
translation_notes:
  risk_flags:
  - risk: “Is known” may sound merely reputational rather than revealing character.
    mitigation: The alternative-reading footnote preserves the sense that actions show what the person is.
