translation:
  language: en
  text: Even a young person is known by what they do—whether their behavior is pure and right.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Even a young person shows what they are by what they do—whether their behavior is pure and right.”
