translation:
  language: en
  text: A king seated on his throne to judge separates out all evil with his discerning gaze, like chaff from grain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “every evil person.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: sitting on a throne of judgment
  simplified_phrase: seated on his throne to judge
  preserved_meaning: The king is pictured carrying out his royal duty of judgment.
  reasoning_layer_used: POB lexical decisions for יוֹשֵׁב and עַל כִּסֵּא דִין
  rationale: The rewrite turns the dense noun phrase into ordinary English while keeping the royal setting.
- pob_phrase: winnows all evil
  simplified_phrase: separates out all evil ... like chaff from grain
  preserved_meaning: The king identifies and removes evil as winnowing separates chaff from grain.
  reasoning_layer_used: POB lexical decision for מְזָרֶה
  rationale: The agricultural image is explained because many readers will not know the verb “winnow.”
- pob_phrase: with his eyes
  simplified_phrase: with his discerning gaze
  preserved_meaning: The king’s gaze exposes and distinguishes evil.
  reasoning_layer_used: POB lexical decision for בְעֵינָיו
  rationale: “Discerning gaze” makes the function of the king’s eyes clear without dropping the visual image.
interpretive_expansions:
- pob_phrase: with his eyes
  rendering: with his discerning gaze
  claim: The king’s look represents active judicial discernment rather than mere physical sight.
  evidence:
  - The POB rationale says the king’s discerning gaze exposes and separates evil.
  - The judgment-throne context gives the gaze a judicial function.
  confidence: high
  alternatives_preserved:
  - with his eyes
  - by his gaze
