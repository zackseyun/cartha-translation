simplification_decisions:
- pob_phrase: Whoever curses
  simplified_phrase: If anyone speaks a curse against
  preserved_meaning: The person deliberately invokes a curse against a parent.
  reasoning_layer_used: POB lexical decision for מְקַלֵּל
  rationale: This wording prevents readers from mistaking “curses” for merely using offensive language.
- pob_phrase: his father or mother—his lamp
  simplified_phrase: their father or mother, their lamp
  preserved_meaning: The proverb applies generally to anyone who curses either parent.
  reasoning_layer_used: POB lexical decisions and wisdom-source audit
  rationale: Singular “their” expresses the general case naturally without changing its scope.
- pob_phrase: his lamp will go out in deepest darkness
  simplified_phrase: their lamp will go out in the deepest darkness
  preserved_meaning: The lamp remains a concrete image, and it goes out without a stated agent in utter darkness.
  reasoning_layer_used: POB lexical decisions for יִדְעַךְ, נֵרוֹ, and בְאִישׁוֹן חֹשֶׁךְ
  rationale: The natural English wording preserves both the intransitive action and the Hebrew darkness idiom.
interpretive_expansions:
