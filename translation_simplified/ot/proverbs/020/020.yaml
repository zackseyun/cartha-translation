translation:
  language: en
  text: If anyone speaks a curse against their father or mother, their lamp will go out in the deepest darkness.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The lamp may picture the person’s life, well-being, or family line.
