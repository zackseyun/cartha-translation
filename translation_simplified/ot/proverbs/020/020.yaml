  text: Anyone who speaks a curse against either his father or his mother—his lamp will be put out in deepest darkness.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The lamp may picture a person’s life, well-being, or future. The Hebrew expression translated “deepest darkness” literally refers to the “pupil of darkness.”
    reason: cultural_note
