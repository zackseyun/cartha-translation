translation:
  language: en
  text: A person who reveals secrets goes around spreading harmful gossip. Do not keep company with anyone who talks too freely.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: One who reveals secrets goes about as a gossip
  simplified_phrase: A person who reveals secrets goes around spreading harmful gossip
  preserved_meaning: The person habitually circulates private information through damaging talk.
  reasoning_layer_used: POB lexical decisions for גּוֹלֶה, סוֹד, and הוֹלֵךְ רָכִיל
  rationale: The wording keeps the movement image while making the action and harmful character of the gossip clear.
- pob_phrase: do not associate
  simplified_phrase: Do not keep company
  preserved_meaning: The reader is warned not to join or maintain companionship with such a person.
  reasoning_layer_used: POB lexical decision for לֹא תִתְעָרָב
  rationale: “Keep company” expresses the relational warning in more familiar English.
- pob_phrase: one who opens his lips wide
  simplified_phrase: anyone who talks too freely
  preserved_meaning: The warning concerns a person who speaks excessively and cannot be trusted with confidential matters.
  reasoning_layer_used: POB lexical decisions and footnote b for וּלְפֹתֶה שְׂפָתָיו
  rationale: The idiom is stated directly so readers understand that uncontrolled speech is in view.
interpretive_expansions:
- pob_phrase: goes about as a gossip
  rendering: goes around spreading harmful gossip
  claim: The gossip is damaging talk that the person actively circulates.
  evidence:
  - The POB lexical rationale says רָכִיל involves trafficking in damaging talk.
  - The immediate context links the gossip with revealing secrets.
  confidence: high
  alternatives_preserved:
  - goes around gossiping
  - goes about as a slanderer
translation_notes:
  risk_flags:
