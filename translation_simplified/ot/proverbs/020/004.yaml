translation:
  language: en
  text: The lazy man does not plow because it is winter.[a] At harvest he looks for something,[b] but there is nothing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “The lazy man does not plow in winter.” The Hebrew can describe either the time or his reason for not plowing.
    reason: lexical_alternative
  - marker: b
    text: Or “he asks for something.” The Hebrew can mean either ask or seek.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Because of winter, the lazy man does not plow
  simplified_phrase: The lazy man does not plow because it is winter
  preserved_meaning: Winter serves as his reason for failing to plow.
  reasoning_layer_used: POB lexical decision for מֵחֹרֶף
  rationale: Ordinary clause order makes the causal meaning easier to grasp.
- pob_phrase: at harvest he seeks
  simplified_phrase: At harvest he looks for something
  preserved_meaning: When harvest arrives, he seeks what his neglected work should have produced.
  reasoning_layer_used: POB lexical decisions for ישאל and בַּקָּצִיר
  rationale: “Looks for something” is clearer modern English while leaving the object unstated.
- pob_phrase: and there is nothing
  simplified_phrase: but there is nothing
  preserved_meaning: His failure to work leaves nothing available at harvest.
  reasoning_layer_used: POB lexical decision for וָאָיִן
  rationale: “But” makes the resulting contrast natural without specifying what is absent.
translation_notes:
  risk_flags:
  - risk: The causal wording may obscure the possible temporal reading “in winter.”
    mitigation: Footnote a preserves the documented alternative.
  - risk: “Looks for something” may sound broader than seeking or requesting produce.
    mitigation: The harvest setting and footnote b preserve the intended range without naming an object.
