translation:
  language: en
  text: Because of winter, the lazy man does not plow.[a] When harvest comes, he asks,[b] but there is nothing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “The lazy man does not plow in winter.” The Hebrew may refer either to the time or to winter as the cause.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says “asks” without stating what he asks for; the context may imply produce.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Because of winter, the lazy man does not plow
  simplified_phrase: Because of winter, the lazy man does not plow
  preserved_meaning: Winter is the cause or deterrent for his failure to plow, without asserting his personal motive.
  reasoning_layer_used: POB lexical decision for מֵחֹרֶף and grounding review
  rationale: The causal wording avoids the unsupported suggestion that winter is his stated excuse.
- pob_phrase: at harvest
  simplified_phrase: When harvest comes
  preserved_meaning: The consequence becomes evident at harvest time.
  reasoning_layer_used: POB lexical decision for בַּקָּצִיר
  rationale: A time clause is easier to read in modern English.
- pob_phrase: and there is nothing
  simplified_phrase: but there is nothing
  preserved_meaning: His asking meets the complete absence of the expected result.
  reasoning_layer_used: POB lexical decision for וָאָיִן
  rationale: “But” makes the proverb’s contrast clear without changing its outcome.
translation_notes:
  risk_flags:
  - risk: The Hebrew may describe when he does not plow rather than why.
    mitigation: Footnote a preserves the temporal reading.
  - risk: The object of his asking is unstated.
    mitigation: Footnote b notes the possible implication of produce without adding it to the text.
