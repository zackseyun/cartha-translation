translation:
  language: en
  text: A man’s steps come from Yahweh. So how can he understand the path of his own life?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses “a man” to represent a person generally.
    reason: source_note
  - marker: b
    text: “Come from Yahweh” names Yahweh as the source of a man’s steps without explaining how this happens.
    reason: lexical_alternative
