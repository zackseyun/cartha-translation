  preserved_meaning: Yahweh is the source of the man’s steps, though the manner is unspecified.
  reasoning_layer_used: POB lexical decision and source audit
  rationale: The active wording is easier to read without defining how Yahweh directs events.
- pob_phrase: how then can a man understand
