  reasoning_layer_used: POB lexical rationale for מַה and clause parallelism
  rationale: “So” preserves the inference, while the pronoun avoids unnatural repetition.
- pob_phrase: his way
  simplified_phrase: the path of his own life
  preserved_meaning: The way is the man’s course of life, pictured as a path.
  reasoning_layer_used: POB lexical rationale for דַּרְכּוֹ
  rationale: The wording explains the life-path metaphor while keeping its concrete image.
