translation:
  language: en
  text: Yahweh directs a man's steps.[a] How, then, can a man understand his own path?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “a man” represents a person generally; the Hebrew uses masculine singular terms.
    reason: lexical_alternative
