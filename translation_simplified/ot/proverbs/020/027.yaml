translation:
  language: en
  text: A man's spirit is Yahweh's lamp. It searches every hidden place deep within him.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “A man's breath is Yahweh's lamp.”
    reason: lexical_alternative
  - marker: b
    text: Literally “all the chambers of the belly,” a Hebrew image for a person's deepest inner parts.
    reason: cultural_note
simplification_decisions:
- pob_phrase: The spirit of man
  simplified_phrase: A man's spirit
  preserved_meaning: The singular man represents a human being, and spirit remains broader than conscience.
  reasoning_layer_used: Lexical and theological decisions for נִשְׁמַת אָדָם
  rationale: The possessive form is natural English without narrowing spirit to conscience.
- pob_phrase: is the lamp of Yahweh, searching
  simplified_phrase: is Yahweh's lamp. It searches
  preserved_meaning: The human spirit remains the concrete lamp through which hidden things are searched.
  reasoning_layer_used: Lexical decisions for נֵר and חֹפֵשׂ
  rationale: Two sentences make the ongoing lamp metaphor easier to follow.
- pob_phrase: all the innermost chambers of the belly
  simplified_phrase: every hidden place deep within him
  preserved_meaning: The search reaches every concealed part of the person's inner being.
  reasoning_layer_used: Lexical decisions for כָּל and חַדְרֵי בָטֶן, plus the POB cultural note
  rationale: “Every” retains the comprehensive scope while the footnote preserves the bodily image.
interpretive_expansions:
- pob_phrase: the innermost chambers of the belly
  rendering: hidden place deep within him
  claim: The bodily-room image refers to a person's concealed inner life.
  evidence:
  - The POB cultural note identifies the phrase as an idiom for a person's deepest inner parts.
  - The lexical rationale describes the chambers as hidden inner recesses.
  confidence: high
  alternatives_preserved:
  - The literal bodily image remains in footnote b.
translation_notes:
  risk_flags:
  - risk: “Man” may be mistaken as referring only to males.
    mitigation: The wording retains POB's representative singular, while footnote b uses “a person” to show the generic sense.
  - risk: Replacing “belly” in the main text could weaken the Hebrew image.
    mitigation: “Hidden place deep within” keeps the interior force, and footnote b supplies the literal image.
