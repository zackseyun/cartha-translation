translation:
  language: en
  text: Charm is deceptive, and beauty fades away,[a] but a woman[b] who fears Yahweh will be praised.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “beauty is vapor,” an image of something that quickly disappears and cannot be held onto.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word can also mean “wife.”
    reason: alternative_reading
  - marker: c
    text: The Hebrew may also mean “may praise herself,” though the context strongly favors “will be praised.”
    reason: alternative_reading
