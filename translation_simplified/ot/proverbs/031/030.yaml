  simplified_phrase: Charm is deceptive
  preserved_meaning: Outward charm can give a false impression.
  reasoning_layer_used: Lexical decision for שֶׁקֶר
  rationale: “Deceptive” states the same judgment in familiar modern English.
- pob_phrase: beauty is fleeting
  simplified_phrase: beauty fades away
  preserved_meaning: Physical beauty does not last.
  reasoning_layer_used: Lexical decision for הֶבֶל
  rationale: “Fades away” makes the transience of the vapor image immediately clear.
- pob_phrase: shall be praised
  simplified_phrase: will be praised
  preserved_meaning: The woman who fears Yahweh is the proper object of praise.
  reasoning_layer_used: Lexical and theological decision for תִתְהַלָּל
  rationale: “Will” replaces the formal “shall” without changing the favored passive sense.
