translation:
  language: en
  text: She carefully considers a field and acquires it.[a] She uses the fruit of her own work to plant a vineyard.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “plans for a field and takes it”; the Hebrew describes deliberate action but does not specifically say she buys it.
    reason: lexical_alternative
  - marker: b
    text: “The fruit of her own work” means the yield or proceeds produced by her labor.
    reason: cultural_note
simplification_decisions:
- pob_phrase: She considers a field and acquires it
  simplified_phrase: She carefully considers a field and acquires it
  preserved_meaning: She deliberately evaluates the land and then takes possession of it without specifying how.
  reasoning_layer_used: POB lexical decisions for זָמְמָה and וַתִּקָּחֵהוּ
  rationale: “Carefully” makes the purposeful deliberation clear while “acquires” avoids narrowing the action to buying.
- pob_phrase: from the fruit of her hands
  simplified_phrase: She uses the fruit of her own work
  preserved_meaning: The results or proceeds of her labor provide the resources for planting.
  reasoning_layer_used: POB lexical decision and cultural note for מִפְּרִי כַפֶּיהָ
  rationale: The wording keeps the fruit image while explaining that her hands represent her own labor.
