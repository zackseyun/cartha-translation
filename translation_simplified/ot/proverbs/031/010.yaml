translation:
  language: en
  text: Who can find a capable wife of noble character? She is worth far more than jewels.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a capable woman of noble character”; the household setting favors “wife.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may refer to pearls, rubies, or another kind of precious jewel.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: A wife of noble character—who can find?
  simplified_phrase: Who can find a capable wife of noble character?
  preserved_meaning: The rhetorical question emphasizes how rare such a wife is, while “capable” helps convey her strength and competence.
  reasoning_layer_used: POB lexical decisions for אֵשֶׁת, חַיִל, and מִי יִמְצָא
  rationale: The clause is reordered into natural English without weakening its emphasis on rarity.
- pob_phrase: Her value is far beyond jewels
  simplified_phrase: She is worth far more than jewels
  preserved_meaning: Her exceptional worth surpasses precious valuables without implying a market price.
  reasoning_layer_used: POB lexical decisions for וְרָחֹק, פְּנִינִים, and מִכְרָהּ
  rationale: The direct comparison is clearer and avoids the commercial tone of assigning her a value.
