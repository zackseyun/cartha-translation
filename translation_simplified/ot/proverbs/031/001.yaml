  reasoning_layer_used: The lexical decision identifies this wording as a heading formula.
  rationale: “Here are” makes the heading function immediately clear.
- pob_phrase: an oracle that his mother taught him
  simplified_phrase: His mother taught him this oracle
  preserved_meaning: Lemuel’s mother taught him the oracle that follows.
  reasoning_layer_used: The lexical decisions prefer “oracle” and the instructional sense of “taught.”
