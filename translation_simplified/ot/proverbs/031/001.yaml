translation:
  language: en
  text: Here are the words of King Lemuel. His mother taught him this oracle:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Here are the words of King Lemuel of Massa, which his mother taught him.” The Hebrew may refer either to an oracle or to the place named Massa.
    reason: alternative_reading
  - marker: b
    text: The word translated “taught” can also mean “instructed” or “disciplined.”
    reason: lexical_alternative
