  reasoning_layer_used: Lexical decisions for פָּתְחָה and בְחָכְמָה
  rationale: Adding “speaks” clarifies the mouth idiom while preserving its concrete image.
- pob_phrase: the instruction of kindness is on her tongue
  simplified_phrase: her tongue is ready to give kind instruction
  preserved_meaning: She habitually gives instruction characterized by kindness.
