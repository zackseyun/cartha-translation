translation:
  language: en
  text: When she opens her mouth, she speaks with wisdom, and her tongue is ready to give kind instruction.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word for “instruction” can also mean “law” or “teaching.”
    reason: lexical_alternative
  - marker: b
    text: The word translated “kind” can also convey “steadfast love,” “mercy,” or “faithful love.”
    reason: lexical_alternative
