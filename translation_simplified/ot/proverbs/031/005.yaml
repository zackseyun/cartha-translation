translation:
  language: en
  text: Otherwise, he may drink and forget what has been decreed, and make unjust decisions in the cases of all who are suffering.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: lest he drink
  simplified_phrase: Otherwise, he may drink
  preserved_meaning: Drinking is presented as the action being warned against.
  reasoning_layer_used: Lexical decision for פֶּן and יִשְׁתֶּה
  rationale: “Otherwise” and “may” express the warning in natural modern English.
- pob_phrase: pervert the justice due to
  simplified_phrase: make unjust decisions in the cases of
  preserved_meaning: The ruler may wrongly alter judicial outcomes for vulnerable people.
  reasoning_layer_used: Lexical decisions for וִישַׁנֶּה and דִּין
  rationale: The new wording makes the judicial setting and wrongful action immediately clear.
- pob_phrase: all the afflicted
  simplified_phrase: all who are suffering
  preserved_meaning: The phrase refers broadly to people marked by suffering or oppression.
  reasoning_layer_used: Lexical decision and footnote for בְּנֵי עֹנִי
  rationale: This replaces an abstract label with clear person-centered language.
translation_notes:
  risk_flags:
  - risk: “Make unjust decisions” is less pictorial than “pervert justice.”
    mitigation: It preserves the documented legal-ethical force by explicitly describing wrongful judicial rulings.
