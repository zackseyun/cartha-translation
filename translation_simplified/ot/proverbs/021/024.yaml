translation:
  language: en
  text: A person who acts with arrogant rage is called a proud and arrogant scoffer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The final phrase may also mean “with rage driven by presumption”; the Hebrew connects the rage with willful arrogance.
