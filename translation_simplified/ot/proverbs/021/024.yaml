simplification_decisions:
- pob_phrase: “Proud, arrogant scoffer” is his name
  simplified_phrase: is called a proud and arrogant scoffer
  preserved_meaning: The words identify the person’s settled character and reputation.
  reasoning_layer_used: The lexical decision for שְׁמוֹ allows “is he called” while retaining all three character labels.
  rationale: The ordinary English expression makes the Hebrew naming formula immediately clear.
- pob_phrase: one who acts
  simplified_phrase: A person who acts
  preserved_meaning: The wording describes characteristic conduct rather than one isolated act.
  reasoning_layer_used: The lexical rationale for עֹשֶׂה identifies its habitual, character-defining force.
  rationale: Turning the participle into a complete subject produces a direct English sentence.
- pob_phrase: with arrogant fury
  simplified_phrase: with arrogant rage
  preserved_meaning: The person acts in intense anger marked by presumptuous arrogance.
  reasoning_layer_used: The source audit treats עֶבְרָה as intense anger and זָדוֹן as arrogant self-will.
  rationale: “Rage” is more common than “fury” without reducing the image’s intensity.
translation_notes:
  risk_flags:
  - risk: Using “is called” makes the literal “is his name” formula less visible.
    mitigation: The rendering preserves its function as a public characterization, as allowed by the POB lexical alternatives.
  - risk: Rendering זָדוֹן as “arrogant” may obscure its nuance of presumption.
    mitigation: The footnote preserves the documented alternative and its link to willful arrogance.
