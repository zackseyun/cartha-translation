translation:
  language: en
  text: Proud eyes and an arrogant heart—the lamp of wicked people—are sin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “The plowing of wicked people is sin.” The Hebrew word translated “lamp” may instead refer to plowing, tillage, or fallow ground.
    reason: alternative_reading
