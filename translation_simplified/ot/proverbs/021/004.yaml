  preserved_meaning: The image of eyes expressing sinful pride remains intact.
  reasoning_layer_used: POB lexical decision for רוּם עֵינַיִם
  rationale: “Proud” is more familiar than “haughty” and keeps the same moral force.
- pob_phrase: a proud heart
  simplified_phrase: an arrogant heart
  preserved_meaning: The heart still represents inner self-exaltation rather than generosity.
  reasoning_layer_used: POB lexical decision for וּרְחַב לֵב
  rationale: “Arrogant” clearly identifies the kind of pride condemned here.
- pob_phrase: the lamp of the wicked
  simplified_phrase: the lamp of wicked people
  preserved_meaning: The lamp image and its link to morally guilty people remain without fixing its precise function.
  reasoning_layer_used: POB lexical and theological decisions for נִר רְשָׁעִים
  rationale: “Wicked people” is clearer to new readers while the compact metaphor preserves the documented ambiguity.
