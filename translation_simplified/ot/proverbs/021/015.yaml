translation:
  language: en
  text: Doing what is just brings joy to people who live rightly, but it brings destruction to those who do evil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “destruction” can also mean terror, dismay, or ruin.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Doing justice
  simplified_phrase: Doing what is just
  preserved_meaning: Justice remains a moral action and a general principle.
  reasoning_layer_used: Lexical decision for מִשְׁפָּט and עֲשׂוֹת
  rationale: The concrete wording is easier for readers unfamiliar with the abstract phrase “doing justice.”
- pob_phrase: is a joy to the righteous
  simplified_phrase: brings joy to people who live rightly
  preserved_meaning: Those characterized by righteousness delight in just action.
  reasoning_layer_used: Lexical decisions for שִׂמְחָה and לַצַּדִּיק
  rationale: The rewrite explains “the righteous” in ordinary English without reducing it to one good deed.
- pob_phrase: but destruction to evildoers
  simplified_phrase: but it brings destruction to those who do evil
  preserved_meaning: The same just action has a ruinous effect on people characterized by evil.
  reasoning_layer_used: Lexical decisions for וּמְחִתָּה and לְפֹעֲלֵי אָוֶן
  rationale: Repeating “brings” supplies the implied relation and makes the contrast immediately clear.
translation_notes:
  risk_flags:
