translation:
  language: en
  text: Doing what is right and practicing justice is more acceptable to Yahweh than offering a sacrifice.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: To do righteousness
  simplified_phrase: Doing what is right
  preserved_meaning: The verse commends right conduct rather than merely holding right beliefs.
  reasoning_layer_used: The lexical decision allows “what is right” while preserving the ethical sense of righteousness.
  rationale: Common wording makes the action immediately understandable without merging it with justice.
- pob_phrase: and justice
  simplified_phrase: and practicing justice
  preserved_meaning: Justice remains a distinct kind of ethical action alongside doing what is right.
  reasoning_layer_used: The lexical rationale identifies justice here as ethical conduct and just judgment.
  rationale: Adding “practicing” makes the active sense clear in natural English.
- pob_phrase: is more acceptable to Yahweh than sacrifice
  simplified_phrase: is more acceptable to Yahweh than offering a sacrifice
  preserved_meaning: Yahweh values right and just conduct above sacrificial worship.
  reasoning_layer_used: The lexical and theological decisions preserve divine preference, comparison, and the name Yahweh.
  rationale: “Offering a sacrifice” clarifies that the comparison concerns performing a sacrificial act.
interpretive_expansions:
- pob_phrase: than sacrifice
  rendering: than offering a sacrifice
  claim: The noun refers to the act of presenting a sacrifice in worship.
  evidence:
  - The comparison evaluates doing right against sacrificial practice.
  - The lexical rationale treats “sacrifice” as a general collective expression.
  confidence: high
  alternatives_preserved:
  - than sacrifice
  - than sacrificial offering
translation_notes:
  risk_flags:
