translation:
  language: en
  text: A wicked person serves as a ransom for a righteous person, and a treacherous person takes the place of someone upright.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, the wicked serves as a substitute for the righteous, and the treacherous for the upright.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The wicked is a ransom for the righteous
  simplified_phrase: A wicked person serves as a ransom for a righteous person
  preserved_meaning: A wicked person bears the substitutionary role pictured by the ransom metaphor.
  reasoning_layer_used: POB lexical decisions for כֹּפֶר, לַצַּדִּיק, and רָשָׁע
  rationale: Adding “person” and “serves as” makes the generic relationship natural without weakening the ransom image.
- pob_phrase: the treacherous one in place of the upright
  simplified_phrase: a treacherous person takes the place of someone upright
  preserved_meaning: The treacherous person is substituted for the morally upright person.
  reasoning_layer_used: POB lexical decisions for וְתַחַת, יְשָׁרִים, and בּוֹגֵד
  rationale: The active phrase “takes the place of” clearly expresses substitution in common English.
translation_notes:
  risk_flags:
