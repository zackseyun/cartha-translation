translation:
  language: en
  text: He keeps craving all day long. But a righteous person gives and does not hold back.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: All day long he craves and craves
  simplified_phrase: He keeps craving all day long
  preserved_meaning: His desire continues throughout the day and is strongly persistent.
  reasoning_layer_used: POB lexical decision for הִתְאַוָּה תַאֲוָה and כָּל הַיּוֹם
  rationale: “Keeps craving” naturally conveys the Hebrew intensification without adding greed or an object.
- pob_phrase: a righteous man
  simplified_phrase: a righteous person
  preserved_meaning: The proverb describes any representative righteous individual.
  reasoning_layer_used: POB lexical rationale for צַדִּיק
  rationale: “Person” keeps the indefinite representative sense in inclusive modern English.
- pob_phrase: but a righteous man gives and does not hold back
  simplified_phrase: But a righteous person gives and does not hold back.
  preserved_meaning: The righteous person’s habitual generosity contrasts with persistent craving.
  reasoning_layer_used: POB lexical decisions for יִתֵּן and לֹא יַחְשֹׂךְ
  rationale: A separate sentence makes the contrast easier to grasp while retaining both actions.
translation_notes:
  risk_flags:
  - risk: Replacing the Hebrew-style repetition may slightly reduce its rhetorical force.
    mitigation: “Keeps craving” together with “all day long” preserves persistent, intensified desire.
