    mitigation: The added clarity is bounded by the lexical rationale and the verse’s verb “turns.”
  - risk: The verse could be read as settling later debates about divine sovereignty and human freedom.
    mitigation: The draft states Yahweh’s control but adds no philosophical explanation.
