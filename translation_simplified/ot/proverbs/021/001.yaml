translation:
  language: en
  text: Just as water can be directed through channels, a king’s heart is in Yahweh’s hand; he turns it wherever he desires.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: A king’s heart is like channels of water
  simplified_phrase: Just as water can be directed through channels, a king’s heart
  preserved_meaning: The king’s inner direction is compared to water guided through divided channels.
  reasoning_layer_used: Lexical decision for פַּלְגֵי מַיִם
  rationale: Recasting the image as a familiar comparison makes its force clear without removing the channels.
- pob_phrase: in the hand of Yahweh; he turns it
  simplified_phrase: is in Yahweh’s hand; he turns it
  preserved_meaning: Yahweh has real control over the king’s inner disposition and direction.
  reasoning_layer_used: Theological decision on divine sovereignty over rulers
  rationale: The wording keeps both the hand image and the strong verb while avoiding a theory of providence.
interpretive_expansions:
- pob_phrase: channels of water
  rendering: water can be directed through channels
  claim: The water-channel image involves water being guided along a chosen course.
  evidence:
  - The lexical rationale identifies divided channels and directed irrigation flow.
  - The following verb “he turns it” supplies the idea of direction.
  confidence: high
  alternatives_preserved:
  - streams of water
  - watercourses
translation_notes:
  risk_flags:
