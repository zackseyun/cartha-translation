translation:
  language: en
  text: Whoever closes his ear when the poor cry for help will also cry out and receive no answer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word may also mean the weak or needy.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: shuts his ear to the cry of the poor
  simplified_phrase: closes his ear when the poor cry for help
  preserved_meaning: The concrete image of deliberately refusing to listen to vulnerable people remains intact.
  reasoning_layer_used: POB lexical decisions for אֹטֵם, אָזְנוֹ, מִזַּעֲקַת, and דָּל
  rationale: The clause is recast into ordinary English while preserving the deliberate refusal and ear image.
- pob_phrase: and not be answered
  simplified_phrase: and receive no answer
  preserved_meaning: The person's own call goes unanswered without naming who withholds the answer.
  reasoning_layer_used: POB lexical and theological decisions for וְלֹא יֵעָנֶה
  rationale: The active English expression is clearer while retaining the Hebrew passive ambiguity.
interpretive_expansions:
- pob_phrase: the cry of the poor
  rendering: when the poor cry for help
  claim: The poor are crying because they need help, not merely making a sound.
  evidence:
  - The immediate contrast concerns refusing to hear a vulnerable person's cry and later receiving no answer to one's own call.
  - The POB renders דָּל as “the poor” while noting weakness and need as part of its range.
  confidence: high
  alternatives_preserved:
  - the cries of the poor
  - the cry of the weak
  - the cry of the needy
translation_notes:
  risk_flags:
  - risk: “Cry for help” makes the purpose of the cry explicit.
    mitigation: The expansion is limited to what the reciprocal context strongly implies.
  - risk: “Receive no answer” may sound less visibly passive than “not be answered.”
    mitigation: It still leaves the one who does not answer completely unstated.
