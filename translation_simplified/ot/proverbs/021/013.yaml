translation:
  language: en
  text: A man who closes his ear when the poor[a] cry for help will also call out, but he will receive no answer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the weak” or “the needy.” The Hebrew word includes people who are poor, weak, or socially vulnerable.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Whoever shuts his ear to the cry of the poor
  simplified_phrase: A man who closes his ear when the poor cry for help
  preserved_meaning: He deliberately refuses to listen to vulnerable people in distress.
  reasoning_layer_used: POB lexical decisions for אֹטֵם, אָזְנוֹ, מִזַּעֲקַת, and דָּל
  rationale: The recast clause keeps the concrete ear image while making the situation immediately clear.
- pob_phrase: will also call out and not be answered
  simplified_phrase: will also call out, but he will receive no answer
  preserved_meaning: His own appeal will meet the same refusal he showed others.
  reasoning_layer_used: POB lexical and theological decisions for גַּם הוּא, יִקְרָא, and וְלֹא יֵעָנֶה
  rationale: “Receive no answer” is natural English and leaves the one withholding an answer unstated.
interpretive_expansions:
