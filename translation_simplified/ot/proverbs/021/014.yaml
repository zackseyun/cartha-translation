  language: en
  text: A gift given in secret holds back anger, and a bribe hidden in the fold of a garment[a] holds back fierce rage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “in the bosom” or “in the lap,” picturing something concealed in the fold of a garment.
    reason: lexical_alternative
