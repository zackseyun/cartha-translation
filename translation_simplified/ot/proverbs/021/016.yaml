simplification_decisions:
- pob_phrase: wanders from the way of understanding
  simplified_phrase: strays from the path of understanding
  preserved_meaning: The man continues to deviate from a wise course of life.
  reasoning_layer_used: Lexical decisions for תּוֹעֶה, דֶּרֶךְ, and הַשְׂכֵּל
  rationale: “Strays from the path” clearly preserves both the life-path image and the sense of deviation.
- pob_phrase: will come to rest in the assembly of the dead
  simplified_phrase: will end up among the dead
  preserved_meaning: His straying ultimately brings him into the company of the dead.
  reasoning_layer_used: Lexical and theological decisions for קהל, רְפָאִים, and יָנוּחַ
  rationale: “Will end up among” states the fatal result clearly without suggesting peaceful rest.
translation_notes:
