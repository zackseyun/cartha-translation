  preserved_meaning: People marked by steady, industrious effort.
  reasoning_layer_used: POB lexical decision for חָרוּץ
  rationale: “Hardworking people” is more familiar than the abstract label “the diligent.”
- pob_phrase: lead to abundance
  simplified_phrase: lead to plenty
  preserved_meaning: Diligent planning reliably produces surplus or gain.
  reasoning_layer_used: POB lexical decision and antithetical context for לְמוֹתָר
  rationale: “Plenty” expresses the positive outcome in common English while the footnote preserves the wider lexical range.
- pob_phrase: is hasty surely comes to want
  simplified_phrase: rushes surely ends up in need
  preserved_meaning: Impulsive haste reliably results in lack or poverty.
  reasoning_layer_used: POB lexical decisions for אָץ and לְמַחְסוֹר
  rationale: The active wording makes both the rushed conduct and its outcome immediately clear.
