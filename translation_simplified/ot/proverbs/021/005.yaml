translation:
  language: en
  text: The plans of hardworking people surely lead to plenty,[a] but everyone who rushes surely ends up in need.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “profit”; the Hebrew can mean surplus, advantage, or gain.
    reason: lexical_alternative
  - marker: b
    text: Or “poverty”; the Hebrew can refer to lack, need, or impoverishment.
    reason: lexical_alternative
