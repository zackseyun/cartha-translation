translation:
  language: en
  text: The plans of hardworking people surely lead to plenty, but everyone who acts hastily surely ends up in need.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the diligent
  simplified_phrase: hardworking people
  preserved_meaning: The proverb describes people who apply steady effort.
  reasoning_layer_used: POB lexical decision for חָרוּץ
  rationale: “Hardworking people” expresses diligence in familiar modern English.
- pob_phrase: lead to abundance
  simplified_phrase: lead to plenty
  preserved_meaning: Careful, diligent plans reliably produce surplus rather than lack.
  reasoning_layer_used: POB lexical decision for לְמוֹתָר
  rationale: “Plenty” clearly preserves the contrast with need.
- pob_phrase: everyone who is hasty surely comes to want
  simplified_phrase: everyone who acts hastily surely ends up in need
  preserved_meaning: A pattern of acting too quickly reliably results in lack.
  reasoning_layer_used: POB lexical decisions for אָץ, אַךְ, and לְמַחְסוֹר
  rationale: This removes the unsupported direction in “rushes ahead” and replaces the older idiom “comes to want.”
translation_notes:
  risk_flags:
