translation:
  language: en
  text: A righteous person[a] thinks carefully about the house of a wicked person and brings wicked people to ruin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “The Righteous One,” meaning God. In that reading, God considers the house of the wicked and brings the wicked to ruin.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: The righteous one
  simplified_phrase: A righteous person
  preserved_meaning: The singular figure represents any person who lives rightly.
  reasoning_layer_used: POB lexical and theological decisions on צַדִּיק
  rationale: This uses familiar English while keeping the preferred human-generic subject.
- pob_phrase: considers
  simplified_phrase: thinks carefully about
  preserved_meaning: The righteous person gives discerning attention to the wicked person’s house.
  reasoning_layer_used: POB lexical decision on מַשְׂכִּיל
  rationale: The fuller phrase makes the idea of thoughtful consideration immediately clear.
- pob_phrase: the house of the wicked, bringing the wicked to ruin
  simplified_phrase: the house of a wicked person and brings wicked people to ruin
  preserved_meaning: The first wicked figure is singular, while the final reference is plural and ends in ruin.
  reasoning_layer_used: POB lexical decisions on לְבֵית רָשָׁע, רְשָׁעִים, מְסַלֵּף, and לָרָע
  rationale: Explicit singular and plural wording prevents the English term “the wicked” from hiding the Hebrew number shift.
translation_notes:
  risk_flags:
  - risk: The Hebrew can be read with God rather than a righteous person as the subject.
    mitigation: Footnote [a] preserves the viable divine-subject reading.
  - risk: “House” may refer to a building, household, or wider estate.
    mitigation: The direct image is retained without narrowing its possible scope.
