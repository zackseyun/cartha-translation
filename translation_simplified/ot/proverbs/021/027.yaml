translation:
  language: en
  text: The sacrifice of wicked people is abhorrent to God. It is even more abhorrent when they bring it with evil intent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “as part of a wicked scheme.” The Hebrew can refer either to corrupt intent or to a malicious plan.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the wicked
  simplified_phrase: wicked people
  preserved_meaning: The phrase still refers generally to people who are morally guilty.
  reasoning_layer_used: lexical decision for רְשָׁעִים
  rationale: The expanded noun phrase is immediately clear to readers unfamiliar with “the wicked” as a category.
- pob_phrase: is an abomination
  simplified_phrase: is abhorrent to God
  preserved_meaning: The sacrifice is strongly condemned as repulsive before God.
  reasoning_layer_used: lexical and theological decisions for תּוֹעֵבָה
  rationale: “Abhorrent to God” explains the biblical term while retaining its strong moral and theological force.
- pob_phrase: how much more when he brings it
  simplified_phrase: It is even more abhorrent when they bring it
  preserved_meaning: The second clause intensifies the condemnation under the added condition of evil intent.
  reasoning_layer_used: lexical decision for אַף כִּי
  rationale: A complete sentence states the escalated comparison more naturally in modern English.
interpretive_expansions:
- pob_phrase: an abomination
  rendering: abhorrent to God
  claim: God is the one before whom the wicked person’s sacrifice is abhorrent.
  evidence:
  - The POB lexical rationale defines the term as abhorrent before God.
  - The theological decision identifies the verse as a judgment on corrupt worship.
  confidence: high
  alternatives_preserved:
  - is an abomination
  - is detestable
translation_notes:
  risk_flags:
  - risk: Naming God makes the implied evaluator explicit rather than leaving it unstated.
    mitigation: The lexical rationale and worship context strongly identify God as the evaluator.
  - risk: “Evil intent” may be read only as inward motive rather than also as a malicious plan.
    mitigation: The footnote preserves the documented scheme-based alternative.
