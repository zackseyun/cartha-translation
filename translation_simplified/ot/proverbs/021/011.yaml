translation:
  language: en
  text: Those who are naive learn wisdom when a scoffer is punished. A wise man[a] gains knowledge when he is taught.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses a masculine singular form as a representative type; it may also be expressed as “a wise person.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the simple become wise
  simplified_phrase: Those who are naive learn wisdom
  preserved_meaning: Morally and intellectually unformed people can begin to acquire wisdom.
  reasoning_layer_used: POB lexical decision for פתי and יֶחְכַּם
  rationale: “Naive” avoids suggesting low intelligence, while “learn wisdom” clearly expresses growth.
- pob_phrase: and when a wise man is instructed, he gains knowledge
  simplified_phrase: A wise man gains knowledge when he is taught
  preserved_meaning: A wise man responds to instruction by acquiring knowledge.
  reasoning_layer_used: POB lexical and theological decisions for וּבְהַשְׂכִּיל, לְחָכָם, and יִקַּח דָּעַת
  rationale: The reordered clause and common verb “taught” make the sentence easier to follow without neutralizing the masculine type.
translation_notes:
  risk_flags:
  - risk: “Naive” may be heard as merely inexperienced rather than morally unformed.
    mitigation: The phrase “learn wisdom” keeps the term within Proverbs’ moral and intellectual framework.
  - risk: “A wise man” may sound universally gender-exclusive to modern readers.
    mitigation: The footnote explains that the Hebrew presents a representative masculine type.
