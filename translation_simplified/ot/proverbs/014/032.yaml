translation:
  language: en
  text: The wicked man’s evil brings him down,[a] but the righteous person finds refuge at his death.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “In his calamity, the wicked man is brought down.”
    reason: lexical_alternative
  - marker: b
    text: Or “finds refuge in his death” or “when he dies”; the Hebrew does not explicitly say “hope.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: By his evil the wicked is driven away
  simplified_phrase: The wicked man’s evil brings him down
  preserved_meaning: The wicked man’s evil causes his downfall.
  reasoning_layer_used: POB lexical decisions for בְּרָעָתוֹ and יִדָּחֶה
  rationale: The direct clause is easier to follow while preserving the moral cause and downfall.
- pob_phrase: the righteous
  simplified_phrase: the righteous person
  preserved_meaning: A righteous individual represents the proverbial class of righteous people.
  reasoning_layer_used: POB lexical decision for צַדִּיק
  rationale: Adding “person” makes the substantival adjective immediately clear.
- pob_phrase: finds refuge in his death
  simplified_phrase: finds refuge at his death
  preserved_meaning: The righteous person finds refuge in relation to his death, though its nature remains unstated.
  reasoning_layer_used: POB lexical and theological decisions for וְחֹסֶה בְּמוֹתוֹ
  rationale: “At his death” is natural English and retains the possessive and theological ambiguity.
translation_notes:
  risk_flags:
  - risk: “Brings him down” recasts the passive image in active English.
    mitigation: It preserves the documented sense of being overthrown or cast down.
  - risk: “At his death” may be understood only temporally.
    mitigation: The footnote preserves “in his death” and does not add explicit hope.
