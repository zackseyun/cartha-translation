translation:
  language: en
  text: When disaster strikes, the wicked are brought down, but the righteous take refuge at the time of death.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “because of their evil.” The Hebrew can refer either to moral evil or to calamity.
    reason: lexical_alternative
  - marker: b
    text: Literally, “in his death”; the Hebrew does not specify the nature of this refuge.
    reason: source_note
simplification_decisions:
- pob_phrase: In his calamity
  simplified_phrase: When disaster strikes
  preserved_meaning: Calamity is the circumstance in which the wicked person falls.
  reasoning_layer_used: POB lexical decision for בְּרָעָתוֹ
  rationale: The ordinary time clause makes the circumstance immediately clear while the footnote preserves the moral alternative.
- pob_phrase: is driven away
  simplified_phrase: are brought down
  preserved_meaning: The wicked suffer a passive downfall.
  reasoning_layer_used: POB lexical decision for יִדָּחֶה
  rationale: This common expression conveys overthrow without defining its exact form.
- pob_phrase: at his death
  simplified_phrase: at the time of death
  preserved_meaning: The righteous take refuge in connection with dying.
  reasoning_layer_used: POB lexical and theological decisions for בְּמוֹתוֹ
  rationale: The clearer phrase keeps the timing general and does not assert a specific hope beyond death.
translation_notes:
  risk_flags:
  - risk: “Brought down” may sound less spatially forceful than “driven away.”
    mitigation: It retains the passive downfall allowed by the documented lexical range.
  - risk: “At the time of death” may be read as excluding refuge beyond death.
    mitigation: The source footnote preserves the compact Hebrew wording and its unresolved theological scope.
