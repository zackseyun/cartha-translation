  simplified_phrase: A fool’s proud speech is like a rod
  preserved_meaning: A fool’s proud speech is pictured as a rod without defining whether it harms others or brings punishment.
  reasoning_layer_used: POB lexical decisions for בְּפִי, חֹטֶר, and גַּאֲוָה
  rationale: The comparison clarifies the compact image without introducing a transformation.
- pob_phrase: the lips of the wise
