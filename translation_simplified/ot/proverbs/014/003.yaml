translation:
  language: en
  text: A fool’s proud speech is like a rod, but the words of the wise protect those who speak them.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word for “rod” can also mean “shoot” or “branch,” but “rod” better fits the warning here.
    reason: lexical_alternative
  - marker: b
    text: Hebrew says “guard them”; this most likely means that the wise are protected by their own words.
    reason: lexical_alternative
