  preserved_meaning: The phrase refers to what wise people say.
  reasoning_layer_used: POB lexical decision for וְשִׂפְתֵי
  rationale: “Words” makes the body-part image immediately clear in modern English.
- pob_phrase: will guard them
  simplified_phrase: protect those who speak them
  preserved_meaning: Wise speech protects the wise people who utter it.
  reasoning_layer_used: POB footnote b and lexical decision for תִּשְׁמוּרֵם
  rationale: The likely antecedent is clarified while the Hebrew ambiguity is noted.
