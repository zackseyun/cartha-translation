simplification_decisions:
- pob_phrase: The crown of the wise is their wealth
  simplified_phrase: For wise people, wealth is a crown of honor
  preserved_meaning: The wealth of wise people is pictured as a crown that visibly distinguishes them.
  reasoning_layer_used: POB lexical decisions for עֲטֶרֶת and עָשְׁרָם
  rationale: Ordinary word order clarifies the relationship while preserving the crown image and wealth.
- pob_phrase: the folly of fools is folly
  simplified_phrase: fools are marked by foolishness
  preserved_meaning: Foolishness is the distinguishing characteristic of fools.
  reasoning_layer_used: POB lexical decision for אִוֶּלֶת כְּסִילִים אִוֶּלֶת
  rationale: The wording conveys the emphatic repetition without adding an unsupported claim of exclusivity.
interpretive_expansions:
- pob_phrase: crown
  rendering: crown of honor
  claim: The crown represents visible honor or distinction.
  evidence:
  - The POB lexical rationale identifies the crown as a symbol of honor.
  confidence: high
  alternatives_preserved:
  - crown
  - ornament
  - wreath
- pob_phrase: the folly of fools is folly
  rendering: fools are marked by foolishness
  claim: The repetition presents foolishness as the fools’ distinguishing mark.
  evidence:
