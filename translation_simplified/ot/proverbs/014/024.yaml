    mitigation: The rendering preserves the proverb’s metaphor without saying that wealth causes wisdom.
  - risk: Replacing the Hebrew repetition may reduce its wordplay.
    mitigation: “Marked by” conveys its emphatic force, and the footnote gives the literal repetition.
