translation:
  language: en
  text: For wise people, wealth is a crown of honor; but fools are marked by foolishness.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some ancient versions and interpreters read, “the wealth of fools is foolishness.” The Hebrew text reads literally, “the foolishness of fools is foolishness.”
