translation:
  language: en
  text: Hard work brings gain, but mere talk leads only to need.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “poverty.” The Hebrew word can mean need, lack, or poverty.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: In all labor there is profit
  simplified_phrase: Hard work brings gain
  preserved_meaning: Productive effort yields a beneficial result as a general principle.
  reasoning_layer_used: The lexical decisions identify labor as exerting work and profit as gain or advantage.
  rationale: The direct subject-verb wording states the proverb naturally in common English.
- pob_phrase: but mere talk leads only to lack
  simplified_phrase: but mere talk leads only to need
  preserved_meaning: Words without productive effort result only in deficiency or want.
  reasoning_layer_used: The lexical decisions preserve the dismissive force of mere talk and the broad range of lack, want, or poverty.
  rationale: “Need” is more immediately understandable than the abstract noun “lack,” while the footnote preserves the stronger alternative.
translation_notes:
  risk_flags:
  - risk: “Hard work brings gain” could be mistaken for an exceptionless promise about every task.
    mitigation: Its concise antithetical form retains the POB’s intended force as a general wisdom principle.
