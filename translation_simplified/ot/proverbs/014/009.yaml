translation:
  language: en
  text: Fools make light of guilt,[a] but there is favor among those who do what is right.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Fools make light of the guilt offering.”
    reason: alternative_reading
  - marker: b
    text: Or “acceptance” or “goodwill.” The Hebrew does not say whose favor this is.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: mock guilt
  simplified_phrase: make light of guilt
  preserved_meaning: Fools treat guilt and the seriousness of wrongdoing with contempt.
  reasoning_layer_used: Lexical decision for יָלִיץ and theological decision for אָשָׁם
  rationale: “Make light of” states the kind of mocking meant in clearer everyday English.
- pob_phrase: the upright
  simplified_phrase: those who do what is right
  preserved_meaning: The contrast concerns people who are morally upright.
  reasoning_layer_used: Lexical decision for יְשָׁרִים
  rationale: The descriptive phrase makes the wisdom term immediately understandable.
translation_notes:
  risk_flags:
  - risk: “Favor” may be understood as specifically divine or specifically human.
    mitigation: The main text remains broad, and the footnote preserves “acceptance” and “goodwill” without naming the giver.
  - risk: The abstract sense “guilt” may obscure the possible sacrificial meaning.
    mitigation: The footnote preserves “guilt offering” as an alternative reading.
