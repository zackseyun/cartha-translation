translation:
  language: en
  text: Fools treat guilt as a joke,[a] but favor is found among those who do what is right.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Fools mock the guilt offering.” The Hebrew word can mean either guilt or a sacrifice offered for guilt.
    reason: alternative_reading
  - marker: b
    text: The word translated “favor” can also mean acceptance or goodwill; the Hebrew does not say whose favor this is.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: mock guilt
  simplified_phrase: treat guilt as a joke
  preserved_meaning: Fools scorn guilt and refuse to take it seriously.
  reasoning_layer_used: Lexical decision for יָלִיץ and the ethical reading of אָשָׁם
  rationale: The common idiom makes the force of “mock” immediately clear without weakening it.
- pob_phrase: among the upright there is favor
  simplified_phrase: favor is found among those who do what is right
  preserved_meaning: Favor is associated with morally upright people, without naming its source.
  reasoning_layer_used: Lexical and theological decisions for יְשָׁרִים and רָצוֹן
  rationale: The recast sentence explains “the upright” while preserving the broad meaning of favor.
translation_notes:
  risk_flags:
  - risk: Modern readers may hear “guilt” only as an emotion rather than actual culpability.
    mitigation: The main text retains POB’s chosen term, while the footnote preserves the sacrificial alternative.
  - risk: “Favor is found” may sound slightly impersonal.
    mitigation: This wording avoids deciding whether the favor comes from God or from other people.
