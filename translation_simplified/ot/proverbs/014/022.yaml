translation:
  language: en
  text: Don't those who plan evil lose their way? But steadfast love and faithfulness are for those who plan good.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew does not state the exact relationship here. It may mean that those who plan good show steadfast love and faithfulness.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: those who devise evil
  simplified_phrase: those who plan evil
  preserved_meaning: The evil is intentional and planned.
  reasoning_layer_used: lexical decision for חֹרְשֵׁי רָע
  rationale: “Plan” expresses deliberate intent in more familiar English than “devise.”
- pob_phrase: go astray
  simplified_phrase: lose their way
  preserved_meaning: They depart from the morally right path.
  reasoning_layer_used: lexical decision for יִתְעוּ
  rationale: “Lose their way” makes the path image immediately understandable.
- pob_phrase: those who devise good
  simplified_phrase: those who plan good
  preserved_meaning: They deliberately seek what is morally good.
  reasoning_layer_used: lexical decision for חֹרְשֵׁי טוֹב
  rationale: Repeating “plan” preserves the deliberate contrast between evil and good.
translation_notes:
  risk_flags:
  - risk: The verbless second line can describe qualities shown by these people or blessings given to them.
    mitigation: The broad phrase “are for” and the footnote preserve both possibilities.
