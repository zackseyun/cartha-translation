translation:
  language: en
  text: Don’t those who plan evil go astray? But steadfast love and faithfulness belong to those who plan what is good.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Steadfast love and faithfulness” may also be translated “kindness and truth” or “mercy and faithfulness.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Will not those who devise evil go astray?
  simplified_phrase: Don’t those who plan evil go astray?
  preserved_meaning: The rhetorical question affirms that people who deliberately plan evil stray from the right moral path.
  reasoning_layer_used: Lexical decisions for הֲלוֹא, יִתְעוּ, and חֹרְשֵׁי רָע
  rationale: The contraction makes the question natural while preserving its expected affirmative answer and path image.
- pob_phrase: those who devise good
  simplified_phrase: those who plan what is good
  preserved_meaning: The phrase describes people who intentionally plan morally good things.
  reasoning_layer_used: Lexical decisions for חֹרְשֵׁי טוֹב and טוֹב
  rationale: “Plan what is good” is natural English and maintains the deliberate contrast with planning evil.
translation_notes:
  risk_flags:
  - risk: “Belong to” leaves open whether these qualities characterize such people or come to them.
    mitigation: The phrase is retained because the Hebrew omits the verb and the POB intentionally preserves this ambiguity.
