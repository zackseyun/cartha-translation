translation:
  language: en
  text: A naive person believes every word,[a] but a prudent person thinks carefully about the steps they take.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “believes everything” or “believes every matter.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: A simple man
  simplified_phrase: A naive person
  preserved_meaning: This is an inexperienced, easily led person, not someone of low intelligence.
  reasoning_layer_used: POB lexical decision for פֶּתִי
  rationale: “Naive person” makes the wisdom category clearer in modern English.
- pob_phrase: a prudent man considers
  simplified_phrase: a prudent person thinks carefully about
  preserved_meaning: The prudent person uses practical discernment before choosing a course.
  reasoning_layer_used: POB lexical decisions for עָרוּם and יָבִין
  rationale: The rewrite expresses active reflection in familiar language.
- pob_phrase: his steps
  simplified_phrase: the steps they take
  preserved_meaning: The concrete image still represents the person’s own conduct and course of life.
  reasoning_layer_used: POB lexical decision for לַאֲשֻׁרוֹ and grounding review
  rationale: This keeps the possessive sense without implying scrutiny of every discrete action.
translation_notes:
  risk_flags:
  - risk: “Naive” may be heard as merely innocent.
    mitigation: The contrast with prudent thought conveys the intended sense of being easily led.
