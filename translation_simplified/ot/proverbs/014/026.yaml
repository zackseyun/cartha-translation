    mitigation: The main text follows the POB’s chosen referent, and the footnote preserves the less likely reference to Yahweh.
  - risk: “Firm confidence” could be heard only as a subjective feeling.
    mitigation: The parallel refuge image retains the proverb’s protective-security dimension.
