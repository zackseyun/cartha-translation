simplification_decisions:
- pob_phrase: the heart of a discerning man
  simplified_phrase: the heart of someone with understanding
  preserved_meaning: Wisdom resides within a representative person who has understanding.
  reasoning_layer_used: POB lexical decision for נָבוֹן and its listed alternative
  rationale: The wording is easier for modern readers while preserving the Hebrew heart image.
- pob_phrase: in the midst of fools it makes itself known
  simplified_phrase: among fools, it shows itself openly
  preserved_meaning: Wisdom becomes outwardly evident among fools rather than remaining quietly within.
  reasoning_layer_used: POB lexical decisions for וּבְקֶרֶב and תִּוָּדֵעַ
  rationale: The recast clause makes the inward-outward contrast immediately clear.
interpretive_expansions:
- pob_phrase: rests ... makes itself known
  rendering: rests quietly ... shows itself openly
  claim: The two clauses contrast wisdom settled within a discerning person with wisdom becoming outwardly evident among fools.
  evidence:
