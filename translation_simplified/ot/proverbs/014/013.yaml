translation:
  language: en
  text: Even while a person laughs, their heart may ache,[a] and joy ends in grief.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Even while a person laughs, their heart aches.”
    reason: lexical_alternative
  - marker: b
    text: Or “joy’s outcome is grief” or “after joy comes grief.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Even in laughter
  simplified_phrase: Even while a person laughs
  preserved_meaning: Laughter can be present at the same time as inner pain.
  reasoning_layer_used: Lexical decision for גַּם and בִּשְׂחוֹק
  rationale: The concrete image remains but is recast as ordinary English action.
- pob_phrase: the heart may ache
  simplified_phrase: their heart may ache
  preserved_meaning: A laughing person may still suffer inwardly.
  reasoning_layer_used: Lexical decision for יִכְאַב and לֵב
  rationale: The pronoun clearly connects the inner pain to the person laughing.
- pob_phrase: the end of joy is grief
  simplified_phrase: joy ends in grief
  preserved_meaning: Joy’s final result or what follows it can be grief.
  reasoning_layer_used: Lexical decision for וְאַחֲרִיתָהּ and תוּגָה
  rationale: The shorter clause preserves the sober movement from joy to grief.
translation_notes:
  risk_flags:
  - risk: The Hebrew imperfect may state a general present rather than a possibility.
    mitigation: Footnote a preserves the general-present reading.
  - risk: “Ends in” may suggest outcome more strongly than simple sequence.
    mitigation: Footnote b preserves both outcome and afterward readings.
