translation:
  language: en
  text: Even while someone laughs, the heart aches,[a] and joy ends in grief.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the heart may ache”; the Hebrew can state a general truth or something that may happen.
    reason: source_note
  - marker: b
    text: Or “joy’s outcome is grief” or “after joy comes grief.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Even in laughter
  simplified_phrase: Even while someone laughs
  preserved_meaning: Pain can be present despite outward laughter.
  reasoning_layer_used: POB lexical decision for גַּם and בִּשְׂחוֹק
  rationale: The verbal form is easier to picture while preserving the contrast.
- pob_phrase: the end of joy is grief
  simplified_phrase: joy ends in grief
  preserved_meaning: Joy may reach an outcome marked by grief.
  reasoning_layer_used: POB lexical decisions for וְאַחֲרִיתָהּ and תוּגָה
  rationale: The active wording makes the result clear without losing the sober contrast.
