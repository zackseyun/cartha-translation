translation:
  language: en
  text: When there are no oxen, the feeding trough stays clean. But the strength of an ox brings abundant crops.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Where there are no oxen, the manger is clean
  simplified_phrase: When there are no oxen, the feeding trough stays clean
  preserved_meaning: Without draft animals, their feeding place remains free from the mess of keeping them.
  reasoning_layer_used: POB lexical decisions for בְּאֵין, אֲלָפִים, אֵבוּס, and בָּר
  rationale: “Feeding trough” avoids the modern nativity association of “manger,” while “stays clean” expresses the practical contrast clearly.
- pob_phrase: but abundant crops come by the strength of an ox
  simplified_phrase: But the strength of an ox brings abundant crops
  preserved_meaning: The ox’s labor is the means by which a large harvest is gained.
  reasoning_layer_used: POB lexical decisions for וְרָב, תְּבוּאוֹת, בְּכֹחַ, and שׁוֹר
  rationale: The active wording makes the cause-and-result relationship easier to understand without weakening the farming image.
translation_notes:
  risk_flags:
  - risk: “Clean” could be understood as hygienic rather than simply free from the mess of keeping oxen.
    mitigation: The feeding-trough setting and contrast with productive oxen preserve the intended practical sense.
