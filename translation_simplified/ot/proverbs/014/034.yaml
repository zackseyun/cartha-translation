  preserved_meaning: Right conduct raises a nation's standing while preserving the image of upward movement.
  reasoning_layer_used: lexical decision for תְרוֹמֵם
  rationale: “Lifts up” is clearer than “exalts” and retains the Hebrew elevation image.
- pob_phrase: sin is a disgrace to peoples
  simplified_phrase: sin brings disgrace to peoples
  preserved_meaning: A people's sin results in public shame.
  reasoning_layer_used: theological decision on the difficult second colon
  rationale: The active wording states the accepted contrast more naturally without removing the Hebrew uncertainty.
- pob_phrase: Righteousness
  simplified_phrase: Righteousness
  preserved_meaning: The broad moral and social sense of doing what is right remains intact.
  reasoning_layer_used: lexical decision for צְדָקָה
  rationale: The biblical term is retained because narrower wording such as “justice” would reduce its scope.
