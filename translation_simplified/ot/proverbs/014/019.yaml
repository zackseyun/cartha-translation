simplification_decisions:
- pob_phrase: The evil ... the good
  simplified_phrase: Evil people ... good people
  preserved_meaning: Both expressions refer to classes of people defined by their conduct.
  reasoning_layer_used: POB lexical decisions for רָעִים and טוֹבִים
  rationale: Adding “people” makes the substantival adjectives immediately clear.
- pob_phrase: bow down
  simplified_phrase: bow low
  preserved_meaning: The physical image of deep, humbled submission remains intact.
  reasoning_layer_used: POB lexical decision for שַׁחוּ
  rationale: “Bow low” is natural English and preserves the force of the Hebrew image.
- pob_phrase: the righteous
  simplified_phrase: a righteous person
  preserved_meaning: The singular describes a representative righteous individual.
  reasoning_layer_used: POB lexical decision for צַדִּיק
  rationale: The explicit noun prevents readers from mistaking the phrase for a plural group.
