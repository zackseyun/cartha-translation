simplification_decisions:
- pob_phrase: The evil
  simplified_phrase: Evil people
  preserved_meaning: The words refer to people characterized by evil.
  reasoning_layer_used: POB lexical decision for רָעִים
  rationale: The explicit noun is clearer than a substantival adjective.
- pob_phrase: bow down
  simplified_phrase: bow low
  preserved_meaning: The image of deep humbling or submission remains intact.
  reasoning_layer_used: POB lexical decision for שַׁחוּ
  rationale: “Bow low” conveys the depth without deciding whether the act is voluntary or compelled.
- pob_phrase: the righteous
  simplified_phrase: a righteous person
  preserved_meaning: The singular describes a representative righteous individual.
  reasoning_layer_used: POB lexical decision for צַדִּיק
  rationale: The explicit noun prevents confusion with an abstract quality.
interpretive_expansions:
- pob_phrase: and the wicked at the gates of the righteous
  rendering: and wicked people are at the gates of a righteous person
  claim: The elliptical clause is expressed as presence at the gates without adding a second act of bowing.
  evidence:
  - The Hebrew second clause has no expressed verb.
  - The POB retains the gate scene without repeating “bow.”
  confidence: high
  alternatives_preserved:
