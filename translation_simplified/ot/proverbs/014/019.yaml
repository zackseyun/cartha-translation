translation:
  language: en
  text: Evil people bow low before good people, and wicked people are at the gates of a righteous person.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Being at a righteous person’s gates may suggest coming for help, pleading, or acknowledging that person’s standing.
