translation:
  language: en
  text: Those who exploit the poor show contempt for the God who made them. But those who show favor to people in need honor God.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean, “Those who honor the poor show favor to people in need.” The main text understands “honor” as referring to God because of the parallel line.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Whoever oppresses the poor insults his Maker
  simplified_phrase: Those who exploit the poor show contempt for the God who made them
  preserved_meaning: Exploiting vulnerable people is an affront to their Creator.
  reasoning_layer_used: POB lexical decisions for עֹשֵׁק, חֵרֵף, and עֹשֵׂהוּ
  rationale: The wording makes the oppression and Maker image immediately clear without weakening either.
- pob_phrase: whoever is gracious to the needy
  simplified_phrase: those who show favor to people in need
  preserved_meaning: The person responds generously and favorably to those who lack what they need.
  reasoning_layer_used: POB lexical decisions for חֹנֵן and אֶבְיוֹן
  rationale: “Show favor” preserves the grace-and-favor sense in more familiar English.
interpretive_expansions:
- pob_phrase: honors him
  rendering: honor God
  claim: The pronoun refers to the poor person’s Maker, God.
  evidence:
