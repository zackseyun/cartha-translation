translation:
  language: en
  text: Whoever looks down on a neighbor sins, but whoever shows kindness to the poor is blessed.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Blessed” describes a state of flourishing and favor, not merely a feeling of happiness.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: despises his neighbor
  simplified_phrase: looks down on a neighbor
  preserved_meaning: The person treats someone in the community with contempt.
  reasoning_layer_used: The lexical decisions for בָּז and לְרֵעֵהוּ.
  rationale: This common idiom makes contempt clear while preserving “neighbor.”
- pob_phrase: is gracious to the poor
  simplified_phrase: shows kindness to the poor
  preserved_meaning: The person treats poor people with gracious, practical goodwill.
  reasoning_layer_used: The lexical decisions for וּמְחוֹנֵן and עניים, confirmed by the grounding review.
  rationale: “Shows kindness” clearly conveys beneficial treatment rather than mere preference.
- pob_phrase: blessed is he
  simplified_phrase: whoever ... is blessed
  preserved_meaning: The gracious person stands in an objective state of blessing and flourishing.
  reasoning_layer_used: The lexical and theological decisions for אַשְׁרָיו.
  rationale: The recast removes archaic word order while retaining the wisdom term “blessed.”
translation_notes:
  risk_flags:
  - risk: “Looks down on” could be understood as an attitude without outward mistreatment.
    mitigation: The idiom still conventionally expresses contempt, matching the documented lexical sense.
  - risk: “Kindness” is broader than the Hebrew concept of gracious favor.
    mitigation: The context limits it to beneficial treatment of poor people without shifting the sense to mercy alone.
