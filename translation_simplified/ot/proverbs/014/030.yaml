translation:
  language: en
  text: A calm heart gives life to the body,[a] but jealousy[b] rots the bones.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “A healing heart gives life to the body.” The Hebrew word translated “calm” is connected with healing and health.
    reason: lexical_alternative
  - marker: b
    text: Or “envy.” The Hebrew word can mean jealousy, envy, or zeal, depending on the context.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: A tranquil heart
  simplified_phrase: A calm heart
  preserved_meaning: The heart is the inner disposition, characterized here by peace and health.
  reasoning_layer_used: POB lexical decision for לֵב and מַרְפֵּא
  rationale: “Calm” is more familiar than “tranquil,” while the footnote preserves the word’s connection with healing.
- pob_phrase: is life to the body
  simplified_phrase: gives life to the body
  preserved_meaning: A calm inner disposition benefits a person’s physical life.
  reasoning_layer_used: POB lexical decisions for חַיֵּי and בְשָׂרִים
  rationale: The verbal wording makes the Hebrew verbless statement natural in modern English.
- pob_phrase: is rottenness to the bones
  simplified_phrase: rots the bones
  preserved_meaning: Jealousy causes deep, destructive decay while retaining the concrete image of bones.
  reasoning_layer_used: POB lexical decisions for רֶקֶב and עֲצָמוֹת
  rationale: The active verb states the contrast clearly without weakening the vivid decay image.
translation_notes:
  risk_flags:
