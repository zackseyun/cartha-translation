  preserved_meaning: The mocker’s search fails to obtain wisdom.
  reasoning_layer_used: POB idiom revision for וָאָיִן
  rationale: The pronoun clearly points back to wisdom and avoids the less natural “finds none.”
- pob_phrase: to one who has understanding
  simplified_phrase: to someone who understands
  preserved_meaning: Knowledge is readily gained by a person characterized by understanding.
  reasoning_layer_used: POB text and lexical decision for לְנָבוֹן
  rationale: The clause becomes direct modern English without changing its generic sense.
