translation:
  language: en
  text: A wise man fears evil and turns away from it. But a fool acts recklessly[a], sure of himself.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “becomes enraged” or “oversteps the bounds”; here it most likely describes rash, uncontrolled behavior.
    reason: lexical_alternative
