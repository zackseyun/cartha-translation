translation:
  language: en
  text: Those who are easily led inherit foolishness, but people with good judgment are crowned with knowledge.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “crown themselves with knowledge.” The Hebrew may describe either their action or their resulting honor.
