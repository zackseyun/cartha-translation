simplification_decisions:
- pob_phrase: the path of the righteous
  simplified_phrase: the path of the righteous
  preserved_meaning: The life-course of morally righteous people remains distinct from the way of the wicked.
  reasoning_layer_used: POB theological decision and immediate context
  rationale: The key biblical category “the righteous” is already clear and should remain stable.
- pob_phrase: going on and shining
  simplified_phrase: That light continues on and shines
  preserved_meaning: The dawn light advances while continuing to shine.
  reasoning_layer_used: POB lexical decisions and doctrine realignment
  rationale: A new sentence clarifies the image while keeping the Hebrew sequence as two distinct actions.
- pob_phrase: until the day is fully established
  simplified_phrase: until full day
  preserved_meaning: The light progresses from dawn to daylight in its complete, settled state.
  reasoning_layer_used: POB lexical rationale for נְכוֹן and הַיּוֹם
  rationale: “Full day” expresses the endpoint naturally without the opaque phrase “fully established.”
translation_notes:
  risk_flags:
  - risk: “Until full day” compresses the source idea that the day becomes firmly established.
    mitigation: The phrase retains the settled endpoint, and the decision audit records the fuller nuance.
  - risk: “That light” makes the light, rather than the path, the immediate grammatical subject.
    mitigation: The wording only clarifies the simile’s internal image and leaves the righteous path as its subject.
