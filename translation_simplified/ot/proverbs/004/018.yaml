translation:
  language: en
  text: But the path of the righteous is like the light of dawn.[a] That light continues on and shines until full day.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “like the brightness of dawn.”
    reason: lexical_alternative
  - marker: b
    text: Or, “growing brighter until full day.”
