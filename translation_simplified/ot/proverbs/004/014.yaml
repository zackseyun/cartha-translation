translation:
  language: en
  text: Do not set foot on the path of the wicked. Do not go down the road of evil men.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “do not advance” or “do not go straight on.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Do not enter the path
  simplified_phrase: Do not set foot on the path
  preserved_meaning: The warning is not to begin following the wicked course pictured as a path.
  reasoning_layer_used: The lexical decisions for אֹרַח and אַל תָּבֹא preserve the path image and the sense of entering it.
  rationale: This familiar expression makes the warning immediate without losing the path image.
- pob_phrase: do not walk in the way
  simplified_phrase: Do not go down the road
  preserved_meaning: The command forbids traveling or proceeding along an evil course.
  reasoning_layer_used: The lexical decisions for תְּאַשֵּׁר and דֶּרֶךְ support movement along a road or way.
  rationale: Removing “keep” avoids implying that the reader is already on that road.
- pob_phrase: evil men
  simplified_phrase: evil men
  preserved_meaning: The masculine plural representatively describes men characterized by evil.
  reasoning_layer_used: The theological gender decision requires retaining the source’s masculine representative form.
  rationale: Retaining the phrase preserves the audited gender distinction.
translation_notes:
  risk_flags:
  - risk: “Set foot on” is more idiomatic than the Hebrew verb “enter.”
    mitigation: It retains both the prohibition against beginning and the concrete path image.
