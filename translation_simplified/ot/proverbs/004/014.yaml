translation:
  language: en
  text: Do not step onto the path of wicked people. Do not keep going down the road of those who do evil.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Do not enter the path of the wicked
  simplified_phrase: Do not step onto the path of wicked people
  preserved_meaning: The reader must not begin following the course of life chosen by wicked people.
  reasoning_layer_used: The lexical decisions for אֹרַח and אַל תָּבֹא preserve entering a concrete path used as a life metaphor.
  rationale: “Step onto” makes entering a path natural and vivid in common English.
- pob_phrase: do not proceed in the way of evildoers
  simplified_phrase: Do not keep going down the road of those who do evil
  preserved_meaning: The reader must not continue or advance in the conduct of evildoers.
  reasoning_layer_used: The lexical rationale for תְּאַשֵּׁר requires forward movement, while דֶּרֶךְ maintains the travel image.
  rationale: “Keep going down” clearly expresses continued movement without the formal word “proceed.”
- pob_phrase: evildoers
  simplified_phrase: those who do evil
  preserved_meaning: The phrase identifies people by their evil conduct without adding gender.
  reasoning_layer_used: The applied revision directs the substantival plural רָעִים to be rendered without adding “men.”
  rationale: The descriptive phrase is easier for new readers than the compact term “evildoers.”
translation_notes:
  risk_flags:
  - risk: “Step onto” is more physically vivid than the general verb “enter.”
    mitigation: It remains within the source’s concrete path metaphor and preserves the command not to begin that course.
