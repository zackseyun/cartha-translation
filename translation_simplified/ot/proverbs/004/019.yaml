translation:
  language: en
  text: The path wicked people follow is like deep darkness.[a] They do not know what makes them stumble.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “thick darkness” or “gloom.” The Hebrew describes especially dense darkness.
    reason: lexical_alternative
  - marker: b
    text: Or “what they stumble over.” The Hebrew can refer either to the cause of their stumbling or to the object they stumble over.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The way of the wicked
  simplified_phrase: The path wicked people follow
  preserved_meaning: The path remains a picture of their course of life and conduct.
  reasoning_layer_used: The lexical decisions for דֶּרֶךְ and רְשָׁעִים.
  rationale: This wording replaces the less familiar collective phrase “the wicked” with direct modern English while preserving the path image.
- pob_phrase: is like deep darkness; they do not know
  simplified_phrase: is like deep darkness. They do not know
  preserved_meaning: The comparison and the wicked people's lack of awareness remain distinct.
  reasoning_layer_used: POB translation structure and lexical rationale for כָּאֲפֵלָה and לֹא יָדְעוּ.
  rationale: Dividing the proverb into two sentences makes its contrast easier to follow.
translation_notes:
