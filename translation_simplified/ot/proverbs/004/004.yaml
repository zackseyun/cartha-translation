translation:
  language: en
  text: He taught me, saying, “Hold my words firmly in your heart.[a] Keep my commandments and live.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In Hebrew, “heart” includes your thoughts, will, and understanding, not only your emotions.
