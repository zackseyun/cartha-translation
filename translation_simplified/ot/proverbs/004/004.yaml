  rationale: The shorter speech introduction removes repetition without changing who taught or spoke.
- pob_phrase: Let your heart hold fast to my words
  simplified_phrase: Keep my words firmly in your heart
  preserved_meaning: The son must firmly retain and follow his father’s words within his whole inner person.
