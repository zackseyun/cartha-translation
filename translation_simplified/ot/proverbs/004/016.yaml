translation:
  language: en
  text: For they do not sleep until they have done evil. Their sleep is taken from them unless they make someone stumble.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “unless they themselves stumble.” The brief Hebrew wording can be understood either way, but the context favors harming someone else.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: unless they have done evil
  simplified_phrase: until they have done evil
  preserved_meaning: They do not sleep before committing evil.
  reasoning_layer_used: Lexical decision for יָרֵעוּ and immediate context
  rationale: “Until” states the time relationship more directly without narrowing the evil done.
- pob_phrase: and their sleep is taken away
  simplified_phrase: Their sleep is taken from them.
  preserved_meaning: Their ability to sleep is removed.
  reasoning_layer_used: Lexical decision for וְנִגְזְלָה and שְׁנָתָם
  rationale: A new sentence and explicit pronoun make the passive image easier to follow.
- pob_phrase: unless they make someone stumble
  simplified_phrase: unless they make someone stumble
  preserved_meaning: The wicked remain restless until they cause another person’s downfall.
  reasoning_layer_used: Theological decision on יכשולו
  rationale: The stumble image is retained because it conveys harm without limiting it to a physical fall.
translation_notes:
  risk_flags:
  - risk: The Hebrew may mean that the wicked themselves stumble.
    mitigation: The main text follows the contextually favored causative reading while the footnote preserves the alternative.
