  rationale: “Follow” makes the life-direction image clearer while retaining the way metaphor.
- pob_phrase: keep to the paths of the righteous
  simplified_phrase: stay on the paths of those who do what is right
  preserved_meaning: Continue in the life-course of morally upright people.
  reasoning_layer_used: The lexical decisions favor staying on the paths and define the righteous as the morally upright.
  rationale: The wording explains “righteous” in common English without losing the path image.
