translation:
  language: en
  text: For those who do what is right will live in the land[a], and those who live with integrity will remain there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the earth.” The Hebrew word can mean either “land” or “earth”; here the context points to a place where people continue to live or from which they are removed.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the upright
  simplified_phrase: those who do what is right
  preserved_meaning: People who are morally upright are in view.
  reasoning_layer_used: lexical decision for יְשָׁרִים
  rationale: The verbal phrase makes the ethical sense immediately clear.
- pob_phrase: will dwell in the land
  simplified_phrase: will live in the land
  preserved_meaning: They will have an enduring place of habitation in the land.
  reasoning_layer_used: lexical decisions for יִשְׁכְּנוּ and אָרֶץ
  rationale: “Live” is more common than “dwell” while retaining the concrete promise.
- pob_phrase: the blameless will remain in it
  simplified_phrase: those who live with integrity will remain there
  preserved_meaning: People of blameless character will continue in the land.
  reasoning_layer_used: lexical decisions for וּתְמִימִים, יִוָּתְרוּ, and בָהּ
  rationale: “Live with integrity” communicates ethical wholeness without implying sinless perfection.
