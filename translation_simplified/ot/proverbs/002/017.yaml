translation:
  language: en
  text: She abandons her close companion from her youth[a] and disregards the covenant of her God.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This close companion is probably the man she married when she was young.
    reason: lexical_alternative
  - marker: b
    text: This probably means her marriage covenant made under God’s authority or witness, but it may also include her broader covenant duty to God.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: who abandons
  simplified_phrase: She abandons
  preserved_meaning: The woman previously described is the one who abandons this relationship.
  reasoning_layer_used: Hebrew syntax and immediate context
  rationale: A complete sentence is easier to understand than a dependent clause.
- pob_phrase: the companion of her youth
  simplified_phrase: her close companion from her youth
  preserved_meaning: This is an intimate early-life companion, probably her husband.
  reasoning_layer_used: POB lexical decisions for אַלּוּף and נְעוּרֶיהָ
  rationale: The wording clarifies intimacy without claiming continuous companionship or requiring “husband.”
- pob_phrase: forgets the covenant of her God
  simplified_phrase: disregards the covenant of her God
  preserved_meaning: She fails to honor a binding covenant connected with her God.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Disregards” expresses covenantal neglect rather than an accidental memory lapse.
interpretive_expansions:
- pob_phrase: forgets
  rendering: disregards
  claim: Her forgetting means failing to honor the covenant, not merely failing to remember it.
  evidence:
  - The POB lexical rationale identifies covenantal disregard as the contextual sense.
  - The parallel clause describes abandoning her intimate companion.
  confidence: high
  alternatives_preserved:
  - forgets
  - neglects
translation_notes:
  risk_flags:
  - risk: “From her youth” may still be read as describing duration rather than an early-life bond.
    mitigation: The footnote explains the likely sense without asserting uninterrupted companionship.
  - risk: Readers may understand the covenant as referring only to marriage.
    mitigation: The footnote preserves the possible broader covenant obligation to God.
