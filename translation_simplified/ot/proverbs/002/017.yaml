translation:
  language: en
  text: She abandons the close companion of her youth and disregards the covenant of her God.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The close companion is probably the husband she married in her youth.
    reason: lexical_alternative
  - marker: b
    text: This covenant likely refers to her marriage covenant made under God's authority or witness, though it may also echo her broader covenant obligation to God.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: who abandons the companion of her youth
  simplified_phrase: She abandons the close companion of her youth
  preserved_meaning: She forsakes an intimate companion from her younger years, probably her husband.
  reasoning_layer_used: Lexical decision for אַלּוּף and immediate context
  rationale: “Close” clarifies the intimate bond without making “husband” certain in the main text.
- pob_phrase: forgets the covenant of her God
  simplified_phrase: disregards the covenant of her God
  preserved_meaning: She fails to honor a binding covenant connected with her God.
  reasoning_layer_used: Lexical and theological decisions for בְּרִית and שָׁכֵחָה
  rationale: “Disregards” conveys covenantal neglect rather than an accidental lapse of memory.
interpretive_expansions:
- pob_phrase: companion
  rendering: close companion
  claim: The companion is an intimate associate rather than a casual acquaintance.
  evidence:
  - The lexical decision identifies אַלּוּף as an intimate companion.
  - The parallel references to youth and covenant likely point to marriage.
  confidence: high
  alternatives_preserved:
  - husband
  - mate
translation_notes:
  risk_flags:
  - risk: “Disregards” interprets forgetting as covenantal neglect.
    mitigation: The POB lexical rationale explicitly supports this contextual sense.
  - risk: The covenant may be read only as marital.
    mitigation: Footnote b preserves the possible broader covenant obligation to God.
