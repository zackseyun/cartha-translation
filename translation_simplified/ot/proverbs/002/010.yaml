simplification_decisions:
- pob_phrase: wisdom will enter your heart
  simplified_phrase: wisdom will come into your heart
  preserved_meaning: Wisdom enters and shapes the inner person.
  reasoning_layer_used: Lexical decision for בוא and theological decision on “heart”
  rationale: “Come into” expresses the entry image in more familiar English while retaining “heart.”
- pob_phrase: knowledge will be pleasant to your soul
  simplified_phrase: Your soul will find knowledge delightful
  preserved_meaning: Knowledge becomes pleasing to the whole inner person.
  reasoning_layer_used: Lexical decisions for נֶפֶשׁ and נעם
  rationale: The active English form is easier to read while preserving both “soul” and the sense of pleasure.
- pob_phrase: one coordinated sentence
  simplified_phrase: two short sentences
  preserved_meaning: The two closely related promised results remain distinct.
  reasoning_layer_used: POB syntax and parallel Hebrew clauses
  rationale: Dividing the clauses makes the parallel thought easier to grasp.
translation_notes:
  risk_flags:
  - risk: “For” may be read only as causal even though a temporal reading is possible.
    mitigation: Footnote a preserves “when” as the documented alternative.
  - risk: Modern readers may understand “soul” too narrowly as a separable spiritual part.
    mitigation: Footnote b identifies the broader senses “inner self” and “life.”
