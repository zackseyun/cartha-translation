translation:
  language: en
  text: For[a] wisdom will come into your heart. Your soul[b] will find knowledge delightful.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “When wisdom comes into your heart.”
    reason: alternative_reading
  - marker: b
    text: Here “soul” can also mean your inner self or life.
