translation:
  language: en
  text: He keeps practical, reliable wisdom[a] in reserve for those who do what is right. He is a shield for those who live with integrity.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “sound judgment,” “resourcefulness,” or wisdom that leads to success and well-being.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: stores up sound wisdom
  simplified_phrase: keeps practical, reliable wisdom in reserve
  preserved_meaning: God reserves effective and trustworthy wisdom for later benefit.
  reasoning_layer_used: POB lexical decisions for וְצָפַן and תּוּשִׁיָּה
  rationale: This keeps the reserve image while explaining what “sound wisdom” means.
- pob_phrase: for the upright
  simplified_phrase: for those who do what is right
  preserved_meaning: The recipients are people whose conduct is morally upright.
  reasoning_layer_used: POB lexical decision for לַיְשָׁרִים
  rationale: The phrase states the familiar ethical meaning in everyday English.
- pob_phrase: those who walk in integrity
  simplified_phrase: those who live with integrity
  preserved_meaning: God shields people whose habitual way of life is marked by integrity.
  reasoning_layer_used: POB lexical decisions for לְהֹלְכֵי and תֹם
  rationale: “Live” makes the Hebrew conduct metaphor immediately clear without suggesting sinlessness.
