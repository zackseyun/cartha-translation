simplification_decisions:
- pob_phrase: Whoever is greedy for dishonest gain
  simplified_phrase: People who greedily seek dishonest profit
  preserved_meaning: The pursuit of profit is marked by greed and dishonesty.
  reasoning_layer_used: POB lexical decision for בּוֹצֵעַ בָּצַע
  rationale: The active wording makes the conduct easier to picture without weakening its illicit character.
- pob_phrase: troubles his own house
  simplified_phrase: bring trouble into their own homes
  preserved_meaning: Their conduct harms their household or family sphere.
  reasoning_layer_used: POB lexical decisions for עֹכֵר and בֵּיתוֹ
  rationale: This keeps the house image while expressing the consequence in natural English.
- pob_phrase: but whoever hates bribes will live
  simplified_phrase: But those who hate bribes will live
  preserved_meaning: Rejecting corrupt gifts is contrasted with greedy wrongdoing and leads to life.
  reasoning_layer_used: POB lexical decisions for מַתָּנוֹת and יִחְיֶה
  rationale: A separate sentence clarifies the contrast while retaining the proverb’s terse promise.
