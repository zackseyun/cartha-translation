simplification_decisions:
- pob_phrase: Whoever is greedy for gain
  simplified_phrase: Anyone who greedily chases profit
  preserved_meaning: An intense desire to acquire profit drives the person’s conduct.
  reasoning_layer_used: POB lexical decision for בּוֹצֵעַ בָּצַע
  rationale: The active wording makes acquisitive greed easier to grasp without adding a new motive.
- pob_phrase: troubles his own house
  simplified_phrase: brings trouble on their own home
  preserved_meaning: The person’s conduct harms the household or family sphere.
  reasoning_layer_used: POB lexical decisions for עֹכֵר and בֵּיתוֹ
  rationale: “Brings trouble on” states the cause and effect clearly while “home” preserves the Hebrew house image.
- pob_phrase: he who hates bribes
  simplified_phrase: anyone who hates bribes
  preserved_meaning: The contrasting person firmly rejects corrupt gifts.
  reasoning_layer_used: POB lexical decisions for וְשׂוֹנֵא and מַתָּנוֹת
  rationale: Gender-neutral wording keeps the proverb universal and retains its strong rejection of bribery.
