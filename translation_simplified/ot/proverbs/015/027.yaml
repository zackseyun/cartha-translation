  text: People who greedily seek dishonest profit bring trouble into their own homes. But those who hate bribes will live.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word means “gifts”; here it refers to gifts used as bribes.
