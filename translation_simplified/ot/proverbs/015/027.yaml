translation:
  language: en
  text: Anyone who greedily chases profit brings trouble on their own home, but anyone who hates bribes[a] will live.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word literally means “gifts,” but here it likely refers to bribes.
