translation:
  language: en
  text: A lazy person’s way is like a thorn hedge. But the path of upright people is a raised, well-built road.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also describe a level or smooth path; its main picture is a built-up road free from obstacles.
