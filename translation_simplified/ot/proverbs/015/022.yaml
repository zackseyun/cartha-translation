translation:
  language: en
  text: Without advice, plans fail. With many advisers, they stand firm.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: for lack of counsel
  simplified_phrase: without advice
  preserved_meaning: Plans fail when counsel or deliberation is absent.
  reasoning_layer_used: POB lexical decisions for בְּאֵין and סוֹד
  rationale: “Without advice” states the cause in familiar modern English.
- pob_phrase: but with many advisers they stand
  simplified_phrase: With many advisers, they stand firm
  preserved_meaning: Plans become established and stable when shaped by many advisers.
  reasoning_layer_used: POB lexical decisions for וּבְרֹב יוֹעֲצִים and תָּקוּם, confirmed by the grounding review
  rationale: “Stand firm” preserves the standing image without overstating it as guaranteed success.
translation_notes:
  risk_flags:
  - risk: “Advice” may sound narrower than counsel or deliberation.
    mitigation: The contrast with many advisers supports this practical sense.
  - risk: “Stand firm” may suggest endurance rather than establishment.
    mitigation: It preserves the source image while the contrast with failing plans clarifies the meaning.
