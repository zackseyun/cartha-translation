simplification_decisions:
- pob_phrase: In the house of the righteous there is great wealth
  simplified_phrase: A righteous person’s home has great wealth
  preserved_meaning: The righteous person’s house or estate contains abundant material resources.
  reasoning_layer_used: POB lexical decisions for בֵּית, צַדִּיק, חֹסֶן, and רָב
  rationale: The direct sentence and generic singular are easier to read while preserving the concrete home image.
- pob_phrase: the income of the wicked is troubled
  simplified_phrase: a wicked person’s income is beset by trouble
  preserved_meaning: The wicked person’s income or yield is itself disturbed and may face ruin.
  reasoning_layer_used: POB lexical decision and applied grammar revision for תְבוּאָה and נֶעְכָּרֶת
  rationale: This natural passive wording avoids adding the unsupported idea that the income causes trouble.
translation_notes:
  risk_flags:
  - risk: Readers may understand “income” only as wages rather than produce or yield.
    mitigation: The footnote preserves the broader agricultural and economic senses.
  - risk: “Beset by trouble” may sound weaker than the possible sense of ruin.
    mitigation: The footnote explicitly preserves “comes to ruin” as an alternative.
