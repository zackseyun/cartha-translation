translation:
  language: en
  text: A righteous person’s home has great wealth, but a wicked person’s income is beset by trouble.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Income” can also mean produce, yield, or harvest; “is beset by trouble” may include the sense “comes to ruin.”
