translation:
  language: en
  text: Sheol and Abaddon[a] lie completely open before Yahweh. How much more, then, are human hearts open to him!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheol is the realm of the dead; Abaddon can mean destruction or the realm of destruction.
