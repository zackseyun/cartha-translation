translation:
  language: en
  text: Yahweh tears down the household of proud people,[a] but he makes a widow’s property line secure.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tears down” may also be translated “uproots”; “household” can include a person’s home or estate.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew pictures Yahweh making firm the boundary that marks the widow’s property.
    reason: simplification_note
simplification_decisions:
- pob_phrase: the house of the proud
  simplified_phrase: the household of proud people
  preserved_meaning: The wording retains the broader sense of a house, family, or estate belonging to arrogant people.
  reasoning_layer_used: POB lexical decisions for בֵּית and גֵּאִים
  rationale: “Household” avoids limiting the image to a physical residence.
- pob_phrase: he sets firm the boundary of the widow
  simplified_phrase: he makes a widow’s property line secure
  preserved_meaning: Yahweh makes firm the vulnerable widow’s land boundary.
  reasoning_layer_used: POB lexical decisions for וְיַצֵּב and גְּבוּל plus footnote b
  rationale: “Makes secure” preserves the establishing act while making the property image clear.
interpretive_expansions:
- pob_phrase: the boundary of the widow
  rendering: a widow’s property line
  claim: The boundary is the line marking the widow’s property.
  evidence:
  - The POB lexical rationale includes a property line within the meaning of the boundary.
  - The POB footnote identifies the image as protection of the widow’s property rights.
  confidence: high
  alternatives_preserved:
  - boundary
  - landmark
translation_notes:
  risk_flags:
  - risk: “Household” may favor the social or estate sense over a physical building.
    mitigation: Footnote a preserves the range of home, household, and estate.
  - risk: “Secure” expresses the protective result of making the boundary firm.
    mitigation: The verb “makes” retains Yahweh’s establishing act rather than implying ongoing maintenance.
