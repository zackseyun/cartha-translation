  language: en
  text: Yahweh tears down the homes of proud people,[a] but he sets a widow’s property line firmly in place.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Homes” can also refer to the households or estates of proud people.
    reason: lexical_alternative
  - marker: b
    text: Or “boundary marker”; it marked the limits of the widow’s property.
    reason: lexical_alternative
