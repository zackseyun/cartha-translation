simplification_decisions:
- pob_phrase: Yahweh is far from the wicked
  simplified_phrase: Yahweh keeps his distance from people who live wickedly
  preserved_meaning: Yahweh is relationally separated from people characterized by wickedness.
  reasoning_layer_used: POB lexical and theological decisions on רָחוֹק and רְשָׁעִים
  rationale: The wording makes the moral-relational distance clear without suggesting that God is geographically absent.
- pob_phrase: he hears the prayer of the righteous
  simplified_phrase: he listens when people who live rightly pray
  preserved_meaning: Yahweh gives favorable attention to the prayers of people characterized by righteousness.
  reasoning_layer_used: POB lexical decisions on יִשְׁמָע, תְפִלָּה, and צַדִּיקִים
  rationale: The noun phrase becomes a natural English clause while stopping short of promising an automatic answer.
translation_notes:
  risk_flags:
  - risk: “Keeps his distance” could be mistaken for total absence or lack of awareness.
    mitigation: The first clause is relational, while “listens” preserves the contrast of favorable attention.
