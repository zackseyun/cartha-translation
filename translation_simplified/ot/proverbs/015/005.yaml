translation:
  language: en
  text: A fool despises his father’s discipline, but anyone who listens to correction and follows it becomes wise.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “is prudent” or “shows shrewdness.”
    reason: lexical_alternative
