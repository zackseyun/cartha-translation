  language: en
  text: A fool rejects his father’s discipline with contempt, but anyone who accepts correction shows good judgment.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean, “but whoever holds on to correction becomes prudent.”
