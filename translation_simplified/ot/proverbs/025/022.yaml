translation:
  language: en
  text: By doing this, you will pile burning coals on his head,[a] and the LORD will repay you.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew image may mean bringing an enemy to shame and repentance or increasing his judgment.
    reason: lexical_alternative
  - marker: b
    text: Here “repay” means favorable repayment and may be translated “reward.”
    reason: lexical_alternative
