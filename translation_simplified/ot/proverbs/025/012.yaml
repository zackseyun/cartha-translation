  simplified_phrase: a wise person who offers correction
  preserved_meaning: The wise person gives constructive correction rather than merely making an accusation.
  reasoning_layer_used: POB lexical decision for מוֹכִיחַ
  rationale: This replaces the uncommon noun “reprover” with clear, natural English.
- pob_phrase: a gold ring and an ornament of fine gold
  simplified_phrase: a gold ring and fine gold jewelry
  preserved_meaning: Both valuable gold ornaments remain joined in the comparison.
  reasoning_layer_used: POB lexical decisions for נֶזֶם, וַחֲלִי, and כָּתֶם
  rationale: “Jewelry” is more familiar than “ornament,” while “and” preserves the paired images.
interpretive_expansions:
- pob_phrase: to a listening ear
  rendering: To someone willing to listen
  claim: The hearer is receptive to correction, not merely physically able to hear.
  evidence:
