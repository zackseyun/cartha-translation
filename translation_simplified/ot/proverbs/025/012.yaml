translation:
  language: en
  text: To someone willing to listen, a wise person who offers correction is like a gold ring and fine gold jewelry.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The ring could be a nose ring or an earring; the Hebrew does not specify.
    reason: lexical_alternative
