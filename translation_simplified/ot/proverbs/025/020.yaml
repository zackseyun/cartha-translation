translation:
  language: en
  text: Singing songs to someone with a troubled heart is like taking off clothing on a cold day and like pouring vinegar onto mineral soda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This mineral soda, also called natron, is an alkali that reacts disruptively with vinegar.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Like one who takes off a garment on a cold day ... is one who sings songs
  simplified_phrase: Singing songs ... is like taking off clothing on a cold day
  preserved_meaning: Singing to a distressed person is compared to removing needed clothing in the cold.
  reasoning_layer_used: POB syntax and lexical decisions for מַעֲדֶה and בֶּגֶד
  rationale: Reordering the comparison gives English readers the main point before its images.
- pob_phrase: to a troubled heart
  simplified_phrase: to someone with a troubled heart
  preserved_meaning: The heart describes a distressed person, not a morally evil one.
  reasoning_layer_used: POB lexical decision for עַל לֶב רָע
  rationale: Naming the person makes the emotional meaning natural without weakening the heart image.
- pob_phrase: vinegar on soda
  simplified_phrase: pouring vinegar onto mineral soda
  preserved_meaning: The proverb depicts an unsuitable combination that produces a disruptive reaction.
  reasoning_layer_used: POB lexical decision and footnote for נָתֶר
  rationale: Adding “mineral” prevents readers from assuming an ordinary soft drink or modern baking soda.
translation_notes:
  risk_flags:
