  text: Someone who sings songs to a person with a troubled heart is like someone taking off a garment on a cold day—and like vinegar on a mineral alkali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The first Hebrew word is uncertain and may instead refer to taking off an ornament. The alkali here is the mineral often called natron.
