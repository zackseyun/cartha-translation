simplification_decisions:
- pob_phrase: Like a muddied spring and a polluted fountain is
  simplified_phrase: is like a muddied spring and a polluted fountain
  preserved_meaning: The righteous man's yielding is compared to both damaged sources of water.
  reasoning_layer_used: POB lexical decisions for מַעְיָן, נִרְפָּשׂ, מָקוֹר, and מָשְׁחָת
  rationale: Natural word order preserves both linked water images.
- pob_phrase: gives way before the wicked
  simplified_phrase: gives in to the wicked
  preserved_meaning: The righteous man capitulates morally or socially to the wicked.
  reasoning_layer_used: POB lexical decisions for מָט and לִפְנֵי
  rationale: “Gives in to” makes the intended yielding clear in common English.
translation_notes:
  risk_flags:
