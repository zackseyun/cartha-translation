  language: en
  text: A man who cannot control his spirit[a] is like a city broken open, with no wall to protect it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “control his temper” or “control himself.” The Hebrew says “his spirit,” referring here to a person’s inner impulses or temper.
