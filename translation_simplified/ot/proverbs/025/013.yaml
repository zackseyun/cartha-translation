translation:
  language: en
  text: A faithful messenger is as refreshing to those who send him as the coolness of snow on a harvest day,[a] and he refreshes his masters.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the cold of snow.” The picture is probably of snow-cooled refreshment, not snow falling during harvest.
    reason: lexical_alternative
