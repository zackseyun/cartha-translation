translation:
  language: en
  text: Do not keep showing up at your neighbor’s house. Visit only now and then, or he may have his fill of you and come to hate you.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says, “Make your foot rare from your neighbor’s house,” meaning to visit infrequently.
    reason: lexical_alternative
  - marker: b
    text: The word translated “neighbor” can also mean “friend” or “companion.”
    reason: alternative_reading
