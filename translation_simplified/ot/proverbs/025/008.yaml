  rationale: “Rush out to start” keeps the movement image while making the idiom clear.
- pob_phrase: lest in the end, when your neighbor puts you to shame, you not know what to do
  simplified_phrase: Otherwise, when your neighbor puts you to shame in the end, you may not know what to do
  preserved_meaning: The bewilderment occurs at the dispute’s outcome when the neighbor brings shame.
  reasoning_layer_used: Lexical decisions for פֶּן, בְּאַחֲרִיתָהּ, בְּהַכְלִים, and מַה תַּעֲשֶׂה
