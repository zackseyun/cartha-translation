translation:
  language: en
  text: Do not rush out to start a dispute.[a] Otherwise, when your neighbor puts you to shame in the end, you may not know what to do.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The dispute may be a personal quarrel or a legal case.
    reason: lexical_alternative
