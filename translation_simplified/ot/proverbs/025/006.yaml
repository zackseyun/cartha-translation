simplification_decisions:
- pob_phrase: exalt yourself before a king
  simplified_phrase: promote yourself in a king’s presence
  preserved_meaning: The proverb warns against making yourself appear honored or important before a king.
  reasoning_layer_used: Lexical decisions for תִּתְהַדַּר and לִפְנֵי מֶלֶךְ
  rationale: This uses common language for self-promotion while keeping the royal setting.
- pob_phrase: stand in the place of great men
  simplified_phrase: take a place among great men
  preserved_meaning: The person must not position himself among those of high social standing.
  reasoning_layer_used: Lexical decisions for בִּמְקוֹם גְּדֹלִים and תַּעֲמֹד
  rationale: This makes the social action clear without losing the image of claiming a place.
