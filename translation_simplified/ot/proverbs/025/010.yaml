translation:
  language: en
  text: Otherwise, someone who hears it may shame you, and your bad reputation will never leave you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is difficult. The final words are literally about a “bad report” that “will not return”; this may mean that the report cannot be taken back or that the resulting disgrace will not go away.
