translation:
  language: en
  text: Otherwise, someone who hears it may disgrace you, and your bad reputation[a] may never go away.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may mean that a damaging report about you keeps circulating, or that the disgrace cannot be undone.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: lest one who hears it disgrace you
  simplified_phrase: Otherwise, someone who hears it may disgrace you
  preserved_meaning: An overheard disclosure can result in public humiliation.
  reasoning_layer_used: POB lexical decisions for פֶּן, יְחַסֶּדְךָ, and שֹׁמֵעַ
  rationale: “Otherwise” and “someone” express the warning in natural modern English.
- pob_phrase: your bad reputation not turn back
  simplified_phrase: your bad reputation may never go away
  preserved_meaning: The resulting damage to the person’s reputation may continue and resist reversal.
  reasoning_layer_used: POB lexical decisions for דִבָּתְךָ and לֹא תָשׁוּב
  rationale: “May never go away” makes the reversal image immediately understandable.
translation_notes:
  risk_flags:
  - risk: The rare Hebrew verb may mean “shame” or “reproach” rather than “disgrace.”
    mitigation: The main text retains POB’s chosen public-disgrace sense without narrowing it further.
  - risk: The final clause can describe either a continuing report or irreversible disgrace.
    mitigation: The footnote preserves both documented possibilities.
