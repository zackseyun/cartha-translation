  preserved_meaning: It introduces the harmful consequence being warned against.
  reasoning_layer_used: Lexical decision for פֶּן
  rationale: “Otherwise” is clearer in modern common English while keeping the warning.
- pob_phrase: one who hears it
  simplified_phrase: someone who hears it
  preserved_meaning: An unspecified person hears what was said.
  reasoning_layer_used: Lexical decision for שֹׁמֵעַ
  rationale: “Someone” is more natural than the formal phrase “one who.”
- pob_phrase: your bad reputation never leaves you
  simplified_phrase: your bad reputation will never leave you
  preserved_meaning: The damaging report or resulting disgrace may have a lasting effect.
  reasoning_layer_used: Lexical decision for דִבָּתְךָ and לֹא תָשׁוּב
  rationale: Adding “will” makes the consequence read as a complete natural clause.
