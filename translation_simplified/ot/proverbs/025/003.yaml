simplification_decisions:
- pob_phrase: As the heavens are high and the earth is deep
  simplified_phrase: The heavens are high, and the earth is deep.
  preserved_meaning: The height of the heavens and depth of the earth provide the proverb’s dimensional image.
  reasoning_layer_used: POB lexical decisions and applied revision
  rationale: A separate sentence preserves the description without adding a claim that these dimensions cannot be measured.
- pob_phrase: so the hearts of kings cannot be searched out
  simplified_phrase: In the same way, no one can fully uncover what is in the hearts of kings.
  preserved_meaning: The inner thoughts and purposes of kings cannot be completely discovered.
  reasoning_layer_used: Lexical decisions for לֵב מְלָכִים and אֵין חֵקֶר
  rationale: “Fully uncover what is in” expresses the investigative image in clear English while retaining the heart metaphor.
