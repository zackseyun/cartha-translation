  preserved_meaning: The north wind causes rain.
  reasoning_layer_used: POB lexical decision for תְּחוֹלֵל and poetic parallelism
  rationale: The common verb “brings” keeps the causative meaning without the less familiar expression “brings forth.”
- pob_phrase: a secret tongue
  simplified_phrase: a tongue that speaks behind someone’s back
  preserved_meaning: The concrete tongue image still refers to covert speech about another person.
  reasoning_layer_used: POB lexical decision and source-audit rationale for לְשׁוֹן סָתֶר
  rationale: The expanded wording explains the marked phrase while avoiding the narrower claim that all such speech is slander.
