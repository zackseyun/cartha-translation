  language: en
  text: The north wind brings rain,[a] and a tongue that speaks behind someone’s back brings an angry face.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “The north wind drives away rain.” The Hebrew verb can be understood either way.
    reason: alternative_reading
