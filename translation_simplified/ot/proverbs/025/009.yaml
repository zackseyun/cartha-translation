  preserved_meaning: Confidential information belonging to another person must not be disclosed.
  reasoning_layer_used: POB lexical decisions for סוֹד, אַחֵר, and אַל תְּגָל
  rationale: The simpler possessive wording keeps both the secrecy and its ownership clear.
