translation:
  language: en
  text: Something said at just the right time is like apples of gold in silver settings.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “something said in just the right way”; the Hebrew idiom can refer to fitting or timely speech.
    reason: lexical_alternative
  - marker: b
    text: The ancient fruit may not have been the same as a modern apple.
    reason: cultural_note
  - marker: c
    text: Or “in silver carvings” or “in silver filigree.”
    reason: lexical_alternative
