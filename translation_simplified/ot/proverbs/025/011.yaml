translation:
  language: en
  text: A word spoken at just the right time is like apples of gold set in silver.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word may refer to a fruit other than the modern apple.
    reason: cultural_note
  - marker: b
    text: The silver may be an ornamental setting, carving, or filigree.
    reason: lexical_alternative
