translation:
  language: en
  text: He will accept no payment to compensate for what happened.[a] No matter how large a bribe you offer, he will not give in.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term may also be translated “ransom” or “compensation.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: accept no ransom
  simplified_phrase: accept no payment to compensate for what happened
  preserved_meaning: He will reject compensation intended to avert the consequences.
  reasoning_layer_used: POB lexical decision for כָל כֹּפֶר
  rationale: This wording explains the payment as compensation without implying genuine reconciliation.
- pob_phrase: will not be persuaded
  simplified_phrase: will not give in
  preserved_meaning: He remains unwilling to yield to the offered payment.
  reasoning_layer_used: POB lexical decision and applied revision for לֹא יֹאבֶה
  rationale: “Give in” preserves the verb’s volitional force rather than suggesting emotional dissatisfaction.
- pob_phrase: no matter how large the bribe
  simplified_phrase: No matter how large a bribe you offer
  preserved_meaning: Even a very large single bribe cannot change his refusal.
  reasoning_layer_used: POB lexical decision for כִּי תַרְבֶּה שֹׁחַד
  rationale: The added verb makes the implied action clear while preserving the concessive force and singular bribe.
interpretive_expansions:
- pob_phrase: ransom
  rendering: payment to compensate for what happened
  claim: The payment is offered as compensation intended to avert consequences.
  evidence:
  - The POB lexical rationale defines כֹּפֶר as a compensatory payment intended to avert consequences.
  - The POB footnote permits “compensation” as an alternative.
  confidence: high
  alternatives_preserved:
  - ransom
  - compensation
translation_notes:
  risk_flags:
  - risk: “Compensate” may sound as though the payment could settle the offense.
    mitigation: The verse states that the payment is refused and that even a large bribe will not make him yield.
