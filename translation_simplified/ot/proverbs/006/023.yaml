translation:
  language: en
  text: For the commandment is a lamp, and instruction[a] is light. Corrections that train you lead to life.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “teaching.” Here this means authoritative instruction, not necessarily law.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: disciplinary reproofs
  simplified_phrase: corrections that train you
  preserved_meaning: The corrections may be acts or words and are meant to form the learner through discipline.
  reasoning_layer_used: POB lexical decisions for תּוֹכְחוֹת and מוּסָר
  rationale: “Corrections” preserves the full range while “train you” makes their formative purpose clear.
- pob_phrase: are the way of life
  simplified_phrase: lead to life
  preserved_meaning: Accepting formative correction sets a person on the course toward life.
  reasoning_layer_used: POB lexical decision for דֶרֶךְ חַיִּים
  rationale: The directional meaning of the wisdom idiom is stated in direct modern English.
- pob_phrase: the commandment is a lamp, and instruction is light
  simplified_phrase: the commandment is a lamp, and instruction is light
  preserved_meaning: Authoritative commands and teaching illuminate and guide a person’s course.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The clear lamp-and-light imagery retains the distinction between the concrete lamp and its light.
interpretive_expansions:
- pob_phrase: disciplinary reproofs
  rendering: corrections that train you
  claim: The corrections form the person who receives them through discipline.
  evidence:
  - The POB rationale describes מוּסָר as formative discipline or correction.
  - The POB audit allows תּוֹכְחוֹת to include acts or words of correction.
  confidence: high
  alternatives_preserved:
  - disciplinary reproofs
  - reproofs of discipline
- pob_phrase: are the way of life
  rendering: lead to life
  claim: The way-of-life image describes a course directed toward life.
  evidence:
  - The POB rationale defines דֶרֶךְ חַיִּים as the course that leads to and embodies life.
  confidence: high
  alternatives_preserved:
  - are the way of life
  - are a path to life
translation_notes:
  risk_flags:
  - risk: “Lead to life” foregrounds the destination more than the course that also embodies life.
    mitigation: It preserves the central directional sense documented in the POB rationale without narrowing what life entails.
