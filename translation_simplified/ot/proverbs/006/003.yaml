translation:
  language: en
  text: So do this, my son, and free yourself, because you are in your neighbor’s palm—that is, under that person’s power. Go, humble yourself,[a] and urge your neighbors.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Hebrew verb may also mean “throw yourself down” or “submit yourself.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says “neighbors” here, though it referred to one neighbor earlier.
    reason: source_note
