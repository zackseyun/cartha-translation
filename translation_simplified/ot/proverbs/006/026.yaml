translation:
  language: en
  text: Getting involved with a prostitute will leave you with nothing but a loaf of bread.[a] But another man’s wife hunts for your precious life.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is compressed; more literally, it says, “because of a prostitute, to a loaf of bread,” which many understand as being reduced to poverty.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word translated “life” can also mean “soul” or “self.”
    reason: lexical_alternative
