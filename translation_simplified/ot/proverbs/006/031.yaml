translation:
  language: en
  text: Yet if he is caught, he must pay back seven times what he stole.[a] He must give up all his household’s wealth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can mean sevenfold restitution or repayment in the amount of seven.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: if he is found
  simplified_phrase: if he is caught
  preserved_meaning: The thief is discovered and held responsible.
  reasoning_layer_used: The lexical rationale identifies discovery as the point when restitution follows.
  rationale: “Caught” expresses this naturally in the theft context.
- pob_phrase: he must repay sevenfold
  simplified_phrase: he must pay back seven times what he stole
  preserved_meaning: He is required to make multiplied restitution.
  reasoning_layer_used: The lexical decisions define obligatory repayment and a sevenfold amount.
  rationale: The wording makes both the action and its measure clear.
- pob_phrase: he must give all the wealth of his house
  simplified_phrase: He must give up all his household’s wealth
  preserved_meaning: He may have to surrender the full wealth of his house.
  reasoning_layer_used: The lexical rationale identifies total forfeiture of household assets.
  rationale: “Household’s wealth” remains clear without broadening wealth to everything owned.
interpretive_expansions:
- pob_phrase: repay sevenfold
  rendering: pay back seven times what he stole
  claim: The sevenfold amount is measured against what the thief stole.
  evidence:
  - The numeral modifies the verb for making restitution.
  - The POB footnote allows repayment in the amount of seven.
  confidence: high
  alternatives_preserved:
  - sevenfold restitution
  - repayment in the amount of seven
translation_notes:
