simplification_decisions:
- pob_phrase: it prepares its food in summer
  simplified_phrase: During summer, it gets its food ready
  preserved_meaning: The ant makes its food ready during the summer season.
  reasoning_layer_used: The lexical decisions for תָּכִין and בַּקַּיִץ support readiness and seasonal timing.
  rationale: The reordered clause uses familiar language while preserving the action and timing.
- pob_phrase: it gathers its provisions at harvest
  simplified_phrase: At harvest time, it gathers food supplies
  preserved_meaning: The ant collects food for its needs during harvest.
  reasoning_layer_used: The lexical decisions for אָגְרָה, בַּקָּצִיר, and מַאֲכָלָהּ identify gathering, harvest time, and food.
  rationale: “Food supplies” clarifies the kind of provisions without losing the storage sense.
