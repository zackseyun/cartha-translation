translation:
  language: en
  text: For she has brought many people down to death; the full number of those she has slain is very great.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “very great” can also mean “strong” or “powerful,” but here it most likely emphasizes the large number of victims.
    reason: lexical_alternative
