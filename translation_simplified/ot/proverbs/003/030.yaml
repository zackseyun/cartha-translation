  rationale: “Get into a dispute” avoids limiting the command to starting conflict, while “someone” clearly conveys the generic reference.
- pob_phrase: without cause
  simplified_phrase: for no reason
  preserved_meaning: The dispute has no valid basis or justification.
  reasoning_layer_used: POB lexical decision for חִנָּם and doctrine-realignment revision
  rationale: “For no reason” uses the audited modern wording for an unjustified dispute.
