translation:
  language: en
  text: Do not plan to harm your neighbor while they live safely beside you.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: devise harm
  simplified_phrase: plan to harm
  preserved_meaning: The command forbids intentionally planning injury against another person.
  reasoning_layer_used: The lexical decisions for תַּחֲרֹשׁ and רָעָה identify deliberate planning and concrete harm.
  rationale: “Plan to harm” expresses the inward intention in more familiar English.
- pob_phrase: dwells securely with you
  simplified_phrase: live safely beside you
  preserved_meaning: The neighbor resides nearby in a state of safety.
  reasoning_layer_used: The lexical decisions for יוֹשֵׁב, לָבֶטַח, and אִתָּךְ support ordinary residence, security, and close proximity.
  rationale: “Live safely beside you” replaces formal wording while preserving settled and secure nearness.
translation_notes:
  risk_flags:
  - risk: “Safely” may sound like objective protection rather than the neighbor’s unsuspecting security.
    mitigation: The surrounding command against secret planning keeps the neighbor’s vulnerable trust implicit without overdefining it.
