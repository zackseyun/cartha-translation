translation:
  language: en
  text: For Yahweh corrects[a] the person he loves, just as a father corrects the son he delights in.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “reproves.” The Hebrew focuses on confronting someone in order to correct them.
    reason: lexical_alternative
  - marker: b
    text: Or, “and like a father delights in a son he favors.” The Hebrew wording may instead describe the father’s delight, while still comparing Yahweh’s correction to a father’s treatment of his son.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: reproves the one he loves
  simplified_phrase: corrects the person he loves
  preserved_meaning: Yahweh confronts and corrects a particular person whom he loves.
  reasoning_layer_used: Lexical decisions for יוֹכִיחַ and אֶת אֲשֶׁר
  rationale: “Corrects the person” is familiar English that retains the verb’s corrective force and the singular personal reference.
- pob_phrase: as a father the son in whom he delights
  simplified_phrase: just as a father corrects the son he delights in
  preserved_meaning: Yahweh’s loving correction is compared to a father’s correction of a favored son.
  reasoning_layer_used: Lexical and theological decisions on the father-son image and יִרְצֶה
  rationale: Repeating “corrects” completes the comparison naturally while preserving the father-son image.
interpretive_expansions:
- pob_phrase: as a father the son in whom he delights
  rendering: just as a father corrects the son he delights in
  claim: The father’s implied action in the comparison is correction, carried over from the first clause.
  evidence:
  - The comparative phrase depends on the preceding corrective verb.
  - Proverbs 3:11–12 concerns Yahweh’s correction and discipline.
  confidence: high
  alternatives_preserved:
  - and like a father delights in a son he favors
translation_notes:
  risk_flags:
  - risk: Repeating “corrects” makes the comparison’s implied action explicit.
    mitigation: The grammar and immediate context support the expansion, and the alternative is noted.
  - risk: The final Hebrew clause may emphasize the father’s delight rather than directly restate correction.
    mitigation: Footnote [b] gives that alternative as a complete, understandable reading.
