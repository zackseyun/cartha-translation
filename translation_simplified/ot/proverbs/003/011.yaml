  rationale: The active wording clarifies who gives the discipline without reducing it to punishment.
- pob_phrase: do not loathe his reproof
  simplified_phrase: Do not hate his rebuke
  preserved_meaning: The son must not respond with strong aversion to Yahweh’s verbal correction.
  reasoning_layer_used: lexical decisions for תָּקֹץ and תּוֹכַחַת
  rationale: Common wording preserves both the emotional force and the distinct idea of verbal rebuke.
