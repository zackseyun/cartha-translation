translation:
  language: en
  text: Do not tell your neighbor, “Go and come back tomorrow. Then I will give,” when you can give it now.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Do not say to your neighbor
  simplified_phrase: Do not tell your neighbor
  preserved_meaning: The verse forbids directing a nearby fellow person to delay receiving what should be given.
  reasoning_layer_used: POB lexical decision for רֵעַ and immediate context
  rationale: “Tell” makes the quoted instruction sound natural while retaining “neighbor.”
- pob_phrase: Go, and come back, and tomorrow I will give
  simplified_phrase: Go and come back tomorrow. Then I will give
  preserved_meaning: The neighbor is sent away with a promise to give on the next day.
  reasoning_layer_used: POB lexical decisions for לֵךְ, שׁוּב, מָחָר, and אֶתֵּן
  rationale: Two short sentences clarify the timing without supplying the unstated object of “give.”
- pob_phrase: when you have it with you
  simplified_phrase: when you can give it now
  preserved_meaning: The person must not delay when the needed resource is already available.
  reasoning_layer_used: POB lexical rationale and cultural note for יֵשׁ אִתָּךְ
  rationale: The wording states the practical force of present possession in ordinary English.
interpretive_expansions:
- pob_phrase: when you have it with you
  rendering: when you can give it now
  claim: Having the resource present means the person is presently able to give rather than needing to delay.
  evidence:
  - The POB lexical rationale says the resource is presently available.
  - The POB cultural note says the person already has the means to give and should not delay.
  confidence: high
  alternatives_preserved:
  - when you already have it available
translation_notes:
  risk_flags:
  - risk: “Can give” may sound broader than physically having the resource present.
    mitigation: Adding “now” and retaining “it” keeps the focus on immediate availability.
