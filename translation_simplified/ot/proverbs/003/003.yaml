translation:
  language: en
  text: Never let steadfast love and faithfulness leave you.[a] Tie them around your neck. Write them on your heart as if it were a writing tablet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “mercy and truth.” The Hebrew words here describe loyal love and reliability.
    reason: lexical_alternative
