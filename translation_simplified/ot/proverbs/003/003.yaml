translation:
  language: en
  text: Never let steadfast love and faithfulness[a] leave you. Tie them around your neck. Write them on the tablet of your heart.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “mercy and truth.” The Hebrew words describe loyal love and reliability.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Let steadfast love and faithfulness not forsake you
  simplified_phrase: Never let steadfast love and faithfulness leave you
  preserved_meaning: The virtues remain personified, and the warning still calls for never losing them.
  reasoning_layer_used: Lexical decision for אַל יַעַזְבֻךָ
  rationale: “Leave you” expresses the exhortation more naturally than “forsake you.”
- pob_phrase: bind them around your neck
  simplified_phrase: Tie them around your neck
  preserved_meaning: The concrete image of deliberately fastening these virtues at the neck remains intact.
  reasoning_layer_used: Lexical decisions for קָשְׁרֵם and גַּרְגְּרוֹתֶיךָ
  rationale: “Tie” is more familiar than “bind” while preserving the physical metaphor.
- pob_phrase: write them on the tablet of your heart
  simplified_phrase: Write them on the tablet of your heart
  preserved_meaning: The image presents steadfast love and faithfulness as permanently inscribed within the inner person.
  reasoning_layer_used: Lexical decision for לוּחַ לִבֶּךָ
  rationale: The phrase remains because replacing “tablet” would weaken the source-language image.
translation_notes:
  risk_flags:
  - risk: Modern readers may first associate “tablet” with an electronic device.
    mitigation: The words “write” and “heart” make the ancient writing-surface metaphor clear in context.
