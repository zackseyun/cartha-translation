translation:
  language: en
  text: By wisdom Yahweh laid the earth’s foundation; by understanding he set the heavens firmly in place.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be translated “with wisdom” and “with understanding,” but here it most likely describes the means Yahweh used in creation.
