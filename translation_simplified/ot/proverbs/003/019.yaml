  language: en
  text: Yahweh used wisdom to lay the earth’s foundation; he used understanding to set the heavens firmly in place.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be translated “with wisdom” and “with understanding,” but here it most likely describes the means Yahweh used in creation.
