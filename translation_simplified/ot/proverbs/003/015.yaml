translation:
  language: en
  text: Wisdom is more precious than jewels.[a] Nothing you treasure can compare with her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “rubies”; the exact kind of precious gem is uncertain.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: She
  simplified_phrase: Wisdom
  preserved_meaning: The feminine figure is wisdom personified as a woman.
  reasoning_layer_used: lexical decision and surrounding context
  rationale: Naming wisdom makes the reference clear while retaining “her” and the personification.
- pob_phrase: none of your delights
  simplified_phrase: Nothing you treasure
  preserved_meaning: No desirable or valued thing equals wisdom.
  reasoning_layer_used: lexical decision and doctrine realignment
  rationale: This uses common English without changing “delights” into merely inward desires.
- pob_phrase: and none ... can compare with her
  simplified_phrase: Nothing ... can compare with her.
  preserved_meaning: The second comparison emphatically denies that anything valued can equal wisdom.
  reasoning_layer_used: POB syntax and lexical rationale
  rationale: A new sentence makes the contrast easier to grasp without weakening it.
