simplification_decisions:
- pob_phrase: Trust in Yahweh with all your heart
  simplified_phrase: Trust Yahweh completely
  preserved_meaning: The command calls for total inner trust in Yahweh, not merely an emotional response.
  reasoning_layer_used: POB lexical decisions for בְּטַח, יְהוָה, בְּכָל, and לִבֶּךָ
  rationale: “Completely” states the full-person force of “with all your heart” in clear modern English.
- pob_phrase: do not lean on your own understanding
  simplified_phrase: Do not depend on your own understanding
  preserved_meaning: Personal understanding must not become the support on which a person relies.
  reasoning_layer_used: POB lexical decision for תִּשָּׁעֵן and its footnote
  rationale: “Depend on” gives the metaphor’s meaning directly, while the footnote preserves its physical image.
translation_notes:
  risk_flags:
  - risk: Replacing “heart” may obscure the Hebrew image of the whole inner person.
    mitigation: “Completely” preserves the image’s intended force of total personal trust.
  - risk: Replacing “lean on” may hide the source-language metaphor.
    mitigation: The footnote retains the picture of leaning on something for support.
