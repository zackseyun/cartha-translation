translation:
  language: en
  text: A ruler without good judgment commits many acts of oppression, but anyone who hates unjust gain will live a long life.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: lacking understanding
  simplified_phrase: without good judgment
  preserved_meaning: The ruler lacks the discernment needed to govern wisely.
  reasoning_layer_used: POB lexical decision for חֲסַר תְּבוּנוֹת
  rationale: “Good judgment” states the wisdom sense in familiar English.
- pob_phrase: is great in acts of oppression
  simplified_phrase: commits many acts of oppression
  preserved_meaning: The ruler repeatedly uses authority in oppressive and exploitative ways.
  reasoning_layer_used: POB lexical decisions for וְרַב מַעֲשַׁקּוֹת and מַעֲשַׁקּוֹת
  rationale: The active wording makes the ruler’s repeated conduct immediately clear.
- pob_phrase: will prolong his days
  simplified_phrase: will live a long life
  preserved_meaning: The person who rejects unjust gain is associated with length of life.
  reasoning_layer_used: POB lexical decision for יַאֲרִיךְ יָמִים
  rationale: This expresses the Hebrew long-life idiom in direct modern English.
