simplification_decisions:
- pob_phrase: but whoever hardens his heart
  simplified_phrase: But whoever makes his heart hard and stubborn
  preserved_meaning: The concrete image of a hard heart remains, while its moral sense of stubbornness is made clear.
  reasoning_layer_used: POB lexical decision for וּמַקְשֶׁה לִבּוֹ
  rationale: The added word “stubborn” explains the familiar image without replacing it.
- pob_phrase: will fall into calamity
  simplified_phrase: will fall into disaster
  preserved_meaning: A hardened heart leads to severe trouble or ruin.
  reasoning_layer_used: POB lexical decision for בְּרָעָה
  rationale: “Disaster” is more common than “calamity” and retains the serious consequence.
- pob_phrase: Blessed is the man who always fears, but
  simplified_phrase: Blessed is the man who always fears. But
  preserved_meaning: The contrast between continual fear and a hardened heart remains intact.
  reasoning_layer_used: POB syntax and theological decision
  rationale: Two sentences make the contrast easier to follow without resolving the unstated object of fear.
interpretive_expansions:
- pob_phrase: hardens his heart
  rendering: makes his heart hard and stubborn
  claim: A hard heart here describes chosen stubbornness.
  evidence:
  - The POB lexical rationale identifies a moral and volitional sense of stubbornness.
  - The Hebrew causative form means to make the heart hard.
  confidence: high
  alternatives_preserved:
  - hardens his heart
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “always fears” as general anxiety or timidity.
