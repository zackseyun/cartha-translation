translation:
  language: en
  text: Blessed is the man who always lives with fear,[a] but whoever hardens his heart will fall into disaster.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew does not say what he fears; the wisdom context suggests reverent caution and moral alertness.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew can also mean that he will fall into evil, harm, or trouble.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: who is always fearful
  simplified_phrase: who always lives with fear
  preserved_meaning: He continually has fear, while the object of that fear remains unstated.
  reasoning_layer_used: Lexical and theological decisions on מְפַחֵד תָּמִיד
  rationale: The active wording is easier to read without reducing fear to mere caution.
- pob_phrase: will fall into calamity
  simplified_phrase: will fall into disaster
  preserved_meaning: A hardened heart leads to disastrous trouble.
  reasoning_layer_used: Lexical decision on בְּרָעָה
  rationale: “Disaster” is more common than “calamity” while retaining the severe consequence.
translation_notes:
  risk_flags:
  - risk: Modern readers may hear “lives with fear” as anxiety or cowardice.
    mitigation: The footnote identifies the likely wisdom sense without supplying an unstated object.
  - risk: “Disaster” narrows a Hebrew word that can also mean evil, harm, or trouble.
    mitigation: The footnote preserves the broader lexical range.
