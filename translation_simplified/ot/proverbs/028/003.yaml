  preserved_meaning: The victims are people weakened by low status, poverty, or lack of power.
  reasoning_layer_used: POB lexical decision for דַּלִּים
  rationale: “Vulnerable people” clarifies their exposed position without repeating the earlier word “poor.”
- pob_phrase: a sweeping rain
  simplified_phrase: a downpour
  preserved_meaning: The rain has the force to sweep things away.
  reasoning_layer_used: POB lexical decisions for מָטָר and סֹחֵף
  rationale: “Downpour” expresses destructive, sweeping rain in familiar English.
translation_notes:
  risk_flags:
  - risk: “Vulnerable” may emphasize lack of power more than low social status.
    mitigation: The term still covers the weakness, poverty, and low status identified in the POB rationale.
  - risk: “Downpour” implies heavy rain rather than explicitly saying it sweeps things away.
    mitigation: The word conveys forceful rain while the foodless result preserves its harmful effect.
