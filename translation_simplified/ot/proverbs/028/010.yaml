translation:
  language: en
  text: Anyone who leads good people astray onto an evil path will fall into their own pit.[a] But people of integrity will inherit what is good.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “into their own ruin.” The Hebrew can refer to a pit or to destruction.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Whoever leads the upright astray onto an evil path
  simplified_phrase: Anyone who leads good people astray onto an evil path
  preserved_meaning: Someone causes morally upright people to stray onto an evil course.
  reasoning_layer_used: POB lexical decisions for מַשְׁגֶּה, יְשָׁרִים, and בְּדֶרֶךְ רָע
  rationale: “Good people” explains “the upright,” while “astray” retains the explicit causative force.
- pob_phrase: will himself fall into his own pit
  simplified_phrase: will fall into their own pit
  preserved_meaning: The person who misleads others suffers the consequence pictured as falling into a personal trap.
  reasoning_layer_used: POB lexical and theological decisions for בִּשְׁחוּתוֹ and הוּא יִפּוֹל
  rationale: Gender-neutral wording preserves the poetic-justice image of the offender’s own pit.
- pob_phrase: the blameless will inherit good
  simplified_phrase: people of integrity will inherit what is good
  preserved_meaning: People of moral integrity will receive good that remains broadly defined.
  reasoning_layer_used: POB lexical decisions for תְמִימִים, יִנְחֲלוּ, and טוֹב
  rationale: The wording clarifies “blameless” while retaining “inherit” and the breadth of “good.”
translation_notes:
  risk_flags:
  - risk: “Good people” is broader and less character-focused than “the upright.”
    mitigation: The moral sense remains clear, and “people of integrity” preserves the stronger character language in the contrast.
  - risk: Singular “their” makes the Hebrew masculine pronouns gender-neutral.
    mitigation: The generic reference and focus on the offender’s own pit remain intact.
