translation:
  language: en
  text: Anyone who leads those who do right down an evil path will fall into their own pit,[a] but people of integrity will inherit what is good.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “will fall into their own ruin.” The Hebrew can refer either to a pit or to ruin or destruction.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Whoever leads the upright astray in an evil way
  simplified_phrase: Anyone who leads those who do right down an evil path
  preserved_meaning: A person causes morally upright people to follow evil conduct.
  reasoning_layer_used: Lexical decisions for מַשְׁגֶּה, יְשָׁרִים, and בְּדֶרֶךְ רָע
  rationale: The wording explains “upright” while preserving the path metaphor and the act of misleading.
- pob_phrase: will himself fall into his own pit
  simplified_phrase: will fall into their own pit
  preserved_meaning: The person who misleads others suffers the consequence pictured by the trap-like pit.
  reasoning_layer_used: Lexical and theological decisions for בִּשְׁחוּתוֹ and הוּא יִפּוֹל
  rationale: The concrete pit image remains, while natural singular “they” avoids the heavier emphatic construction.
- pob_phrase: the blameless will inherit good
  simplified_phrase: people of integrity will inherit what is good
  preserved_meaning: Those characterized by moral wholeness will receive good as an inheritance.
  reasoning_layer_used: Lexical decisions for וּתְמִימִים, יִנְחֲלוּ, and טוֹב
  rationale: “People of integrity” clarifies “blameless,” while “inherit” and the broad sense of “good” remain intact.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “pit” only as a literal hole.
    mitigation: The footnote preserves the Hebrew alternative of ruin or destruction.
