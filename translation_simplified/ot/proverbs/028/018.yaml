translation:
  language: en
  text: Whoever lives with integrity will be kept safe, but whoever's ways are crooked will suddenly fall.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew “in one”; likely meaning “suddenly” or “all at once.”
