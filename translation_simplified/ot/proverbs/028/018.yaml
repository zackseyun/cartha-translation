translation:
  language: en
  text: Whoever walks the path of integrity will be kept safe. But if his ways are crooked, he will fall at once.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “in one,” probably meaning “at once” or “suddenly.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: walks in integrity
  simplified_phrase: walks the path of integrity
  preserved_meaning: The person’s way of life is morally upright without implying sinless perfection.
  reasoning_layer_used: lexical decision for הוֹלֵךְ and תָּמִים
  rationale: Adding “path” makes the way-of-life image immediately clear while retaining integrity.
- pob_phrase: will be delivered
  simplified_phrase: will be kept safe
  preserved_meaning: The proverb promises practical preservation rather than explicitly doctrinal salvation.
  reasoning_layer_used: lexical and theological decisions for יִוָּשֵׁעַ
  rationale: “Kept safe” is common English and avoids a narrowly theological reading of “saved.”
- pob_phrase: but one crooked in his ways will fall at once
  simplified_phrase: But if his ways are crooked, he will fall at once
  preserved_meaning: Crooked conduct leads to a sudden downfall.
  reasoning_layer_used: lexical decisions for נֶעְקַשׁ, דְּרָכַיִם, יִפּוֹל, and בְּאֶחָת
  rationale: The conditional wording untangles the clause while preserving its moral contrast and fall image.
