translation:
  language: en
  text: Anyone who increases his wealth through interest and other gains from loans is gathering that wealth for someone who shows kindness to the poor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses two terms for gains from lending, often implying exploitation; they are traditionally translated “interest and usury.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: by interest and profit
  simplified_phrase: through interest and other gains from loans
  preserved_meaning: The wealth comes from two related forms of gain through lending.
  reasoning_layer_used: The lexical notes and POB footnote identify both Hebrew terms as gains from lending.
  rationale: This wording clarifies the lending context without implying a separate excessive charge.
- pob_phrase: gathers it
  simplified_phrase: is gathering that wealth
  preserved_meaning: The person is unknowingly accumulating the wealth for someone else.
  reasoning_layer_used: The lexical decision identifies the pronoun as referring back to the wealth.
  rationale: Repeating “that wealth” makes the pronoun’s meaning immediately clear.
- pob_phrase: one who is gracious to the poor
  simplified_phrase: someone who shows kindness to the poor
  preserved_meaning: The eventual recipient characteristically treats the poor with favor and mercy.
  reasoning_layer_used: The lexical decision for חנן supports showing favor or being gracious.
  rationale: The present-tense verbal phrase explains “gracious” in common English.
interpretive_expansions:
- pob_phrase: interest and profit
  rendering: interest and other gains from loans
  claim: Both forms of gain arise from lending.
  evidence:
  - Both lexical rationales identify lending as the setting of the Hebrew terms.
  - The POB footnote describes both terms as gains from lending.
  confidence: high
  alternatives_preserved:
  - interest and usury
translation_notes:
  risk_flags:
  - risk: Readers may take the verse as a precise judgment on every modern form of interest.
    mitigation: The footnote preserves the terms’ often exploitative force without narrowing the main text beyond the POB.
