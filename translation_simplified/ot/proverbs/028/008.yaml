translation:
  language: en
  text: Those who increase their wealth by charging interest and taking profit on loans are gathering it for someone who shows kindness to the poor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew terms describe gain from lending and often carry an exploitative sense.
