simplification_decisions:
- pob_phrase: Whoever increases his wealth
  simplified_phrase: Those who increase their wealth
  preserved_meaning: A person adds to existing wealth, without necessarily becoming rich.
  reasoning_layer_used: Lexical decisions for מַרְבֶּה and הוֹנוֹ
  rationale: The plural wording makes the general statement natural while retaining the broader idea of increasing wealth.
- pob_phrase: by interest and profit
  simplified_phrase: by charging interest and taking profit on loans
  preserved_meaning: The wealth comes from additional amounts gained through lending.
  reasoning_layer_used: Lexical decisions for נֶשֶׁךְ and תַּרְבִּית
  rationale: This identifies the lending practice while keeping both forms of financial gain.
- pob_phrase: one who is gracious to the poor
  simplified_phrase: someone who shows kindness to the poor
  preserved_meaning: The eventual recipient treats poor people with favor and mercy.
  reasoning_layer_used: Lexical decisions for חנן and דַּלִּים
  rationale: The active phrase states gracious conduct in familiar English.
