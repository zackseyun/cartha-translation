translation:
  language: en
  text: Those who give to the poor will not be in need, but those who turn their eyes away will have many curses.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Whoever gives to the poor will have no lack
  simplified_phrase: Those who give to the poor will not be in need
  preserved_meaning: People who habitually help the poor are promised freedom from need.
  reasoning_layer_used: POB lexical decision for נוֹתֵן and אֵין מַחְסוֹר
  rationale: The plural form and common phrase “not be in need” express the proverb naturally.
- pob_phrase: he who hides his eyes
  simplified_phrase: those who turn their eyes away
  preserved_meaning: The person deliberately refuses to notice or help the poor.
  reasoning_layer_used: POB lexical decision and documented idiom for וּמַעְלִים עֵינָיו
  rationale: This wording keeps the eye image while making the deliberate avoidance easier to understand.
