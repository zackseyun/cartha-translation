translation:
  language: en
  text: Whoever covers up his acts of rebellion will not thrive, but whoever confesses them and turns away from them will be shown mercy.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: covers his transgressions
  simplified_phrase: covers up his acts of rebellion
  preserved_meaning: The wording keeps the covering image while clearly describing the concealment of serious wrongdoing.
  reasoning_layer_used: POB lexical decisions for מְכַסֶּה and פְשָׁעָיו
  rationale: “Covers up” is common English, and “acts of rebellion” preserves the strong moral force of “transgressions.”
- pob_phrase: will not prosper
  simplified_phrase: will not thrive
  preserved_meaning: The person will not flourish within the proverb’s moral order.
  reasoning_layer_used: POB lexical decision for יַצְלִיחַ
  rationale: “Thrive” communicates broad flourishing more plainly than “prosper.”
- pob_phrase: confesses and forsakes them
  simplified_phrase: confesses them and turns away from them
  preserved_meaning: Mercy is connected with both admitting the wrongs and abandoning them.
  reasoning_layer_used: POB lexical decisions for וּמוֹדֶה, וְעֹזֵב, and the implicit object
  rationale: “Turns away from” clearly expresses leaving sinful conduct without weakening the separate command to confess.
translation_notes:
  risk_flags:
