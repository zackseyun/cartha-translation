translation:
  language: en
  text: Whoever hides his acts of rebellion will not thrive. But whoever confesses them and turns away from them will be shown mercy.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: covers his transgressions
  simplified_phrase: hides his acts of rebellion
  preserved_meaning: The person conceals serious, willful wrongdoing rather than bringing it into the open.
  reasoning_layer_used: POB lexical decisions for מְכַסֶּה and פְשָׁעָיו
  rationale: “Hides” states the moral sense of the covering image clearly, while “acts of rebellion” preserves the strong force of transgressions.
- pob_phrase: will not prosper
  simplified_phrase: will not thrive
  preserved_meaning: Such a person will not flourish within God’s moral order.
  reasoning_layer_used: POB lexical decision for יַצְלִיחַ
  rationale: “Thrive” expresses broad flourishing more plainly than “prosper,” without limiting the warning to money.
- pob_phrase: confesses and forsakes them
  simplified_phrase: confesses them and turns away from them
  preserved_meaning: Receiving mercy is linked with both admitting the offenses and abandoning them.
  reasoning_layer_used: POB lexical decisions for וּמוֹדֶה, וְעֹזֵב, and the implicit object
  rationale: The wording keeps confession and changed conduct as two distinct responses in natural English.
translation_notes:
  risk_flags:
  - risk: Readers may assume that God is explicitly named as the giver of mercy.
    mitigation: The passive “will be shown mercy” retains the Hebrew and POB choice not to identify the agent directly.
