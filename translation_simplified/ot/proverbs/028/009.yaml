  language: en
  text: Whoever turns their ear away, refusing to listen to God’s law—even that person’s prayer is an abomination.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “law” can also mean God’s authoritative instruction or teaching, not only legal commands.
