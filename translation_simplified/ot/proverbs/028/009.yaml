translation:
  language: en
  text: Whoever turns a deaf ear to God’s law—even that person’s prayer is an abomination.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Law” can also mean God’s authoritative instruction or teaching, not only legal commands.
    reason: lexical_alternative
