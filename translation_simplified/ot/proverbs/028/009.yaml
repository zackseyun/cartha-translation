  simplified_phrase: turns a deaf ear to
  preserved_meaning: The person deliberately refuses to listen, while the Hebrew ear image remains present.
  reasoning_layer_used: Lexical decisions for מֵסִיר, אָזְנוֹ, and מִשְּׁמֹעַ
  rationale: The familiar English idiom expresses deliberate refusal more naturally than the literal clause.
- pob_phrase: his prayer
  simplified_phrase: that person’s prayer
  preserved_meaning: The prayer belongs to the same person who rejects the law.
  reasoning_layer_used: Generic subject and lexical decision for תְּפִלָּתוֹ
  rationale: The gender-neutral wording avoids an awkward pronoun without changing the proverb’s scope.
interpretive_expansions:
