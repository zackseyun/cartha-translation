  preserved_meaning: Righteous flourishing brings abundant public esteem and splendor.
  reasoning_layer_used: POB lexical rationale for תִפְאָרֶת
  rationale: “Honor” is a listed sense and is clearer here than the broad term “glory.”
- pob_phrase: people hide themselves
  simplified_phrase: people go into hiding
  preserved_meaning: Ordinary people withdraw from public view under wicked rule.
  reasoning_layer_used: POB lexical rationale for יְחֻפַּשׂ and applied revision
