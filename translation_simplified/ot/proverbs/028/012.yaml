translation:
  language: en
  text: When righteous people rejoice, there is great honor. But when wicked people gain power, people[a] go into hiding.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses a singular generic word that can mean “a person,” “a man,” or people collectively.
    reason: lexical_alternative
