translation:
  language: en
  text: When wicked people rise to power,[a] a person goes into hiding. But when the wicked perish, righteous people become more numerous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean that a person “is hidden.”
    reason: lexical_alternative
