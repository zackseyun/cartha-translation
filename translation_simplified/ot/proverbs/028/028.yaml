  preserved_meaning: Wicked persons gain a dominant public position.
  reasoning_layer_used: Lexical rationale and immediate social setting
  rationale: This makes the proverb’s social setting clear in ordinary English.
- pob_phrase: a man hides himself
  simplified_phrase: a person goes into hiding
  preserved_meaning: A representative human withdraws from view for safety.
  reasoning_layer_used: Lexical decision for אָדָם and the reflexive sense of יִסָּתֵר
