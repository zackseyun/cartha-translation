translation:
  language: en
  text: Those who work their land will have plenty of bread, but those who chase after worthless things[a] will have their fill of poverty.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “empty things” and may refer to empty or worthless people.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Whoever works his land
  simplified_phrase: Those who work their land
  preserved_meaning: Diligent labor on one’s own land leads to provision.
  reasoning_layer_used: Lexical decision for עֹבֵד אַדְמָתוֹ
  rationale: The plural form is natural modern English without changing the agricultural meaning.
- pob_phrase: he who pursues worthless things
  simplified_phrase: those who chase after worthless things
  preserved_meaning: The contrast is with actively following futile pursuits rather than doing productive work.
  reasoning_layer_used: Lexical decision for וּמְרַדֵּף רֵקִים
  rationale: “Chase after” makes the active pursuit easier to picture while retaining the documented ambiguity in a note.
- pob_phrase: will have his fill of poverty
  simplified_phrase: will have their fill of poverty
  preserved_meaning: The ironic repetition of having one’s fill remains paired with plenty of bread.
  reasoning_layer_used: Lexical decision for יִשְׂבַּע רִישׁ
  rationale: Only the pronoun changes, preserving the proverb’s concrete wordplay and warning.
translation_notes:
  risk_flags:
  - risk: “Worthless things” may obscure that the Hebrew can refer to empty things or people.
    mitigation: The footnote preserves both documented alternatives without forcing one into the text.
