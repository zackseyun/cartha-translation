- pob_phrase: It is no transgression
  simplified_phrase: There is nothing wrong with it
  preserved_meaning: The person denies that robbing his father and mother is morally wrong.
  reasoning_layer_used: POB lexical decision for אֵין פָּשַׁע
  rationale: The wording makes the denial immediately clear without limiting it to a legal offense.
- pob_phrase: a destructive man
