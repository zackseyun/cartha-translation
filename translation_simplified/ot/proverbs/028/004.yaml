translation:
  language: en
  text: People who abandon the law[a] praise the wicked. But those who obey the law oppose them.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “law” can also mean authoritative instruction or teaching.
    reason: lexical_alternative
  - marker: b
    text: Or “contend with them”; the Hebrew describes active opposition.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Those who forsake the law
  simplified_phrase: People who abandon the law
  preserved_meaning: They are characterized by deliberately leaving authoritative moral instruction.
  reasoning_layer_used: POB lexical decision for עֹזְבֵי
  rationale: “Abandon” is clearer than “forsake” while retaining its moral weight.
- pob_phrase: those who keep the law
  simplified_phrase: those who obey the law
  preserved_meaning: They faithfully follow the law rather than merely possessing it.
  reasoning_layer_used: POB lexical decision for שֹׁמְרֵי
  rationale: “Obey” makes the intended observance clear in common English.
- pob_phrase: contend with them
  simplified_phrase: oppose them
  preserved_meaning: They actively stand against the wicked without implying physical violence.
  reasoning_layer_used: POB lexical and theological decisions for יִתְגָּרוּ בָם
  rationale: “Oppose” states the adversarial relationship more plainly than “contend.”
translation_notes:
  risk_flags:
  - risk: “Law” may sound narrower than the wisdom-context sense of authoritative instruction.
    mitigation: Footnote a preserves the broader lexical range.
  - risk: “Oppose” is less vivid than the Hebrew idea of engaging in contention.
    mitigation: Footnote b retains “contend with them” as an alternative.
