translation:
  language: en
  text: Those who abandon the law[a] praise wicked people, but those who obey the law oppose them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “law” can also mean authoritative instruction or teaching.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Those who forsake the law
  simplified_phrase: Those who abandon the law
  preserved_meaning: They deliberately turn away from authoritative moral instruction.
  reasoning_layer_used: POB lexical decision for עֹזְבֵי and תּוֹרָה
  rationale: “Abandon” keeps the moral force of “forsake” in more familiar English.
- pob_phrase: the wicked
  simplified_phrase: wicked people
  preserved_meaning: The singular Hebrew expression represents wicked persons as a class.
  reasoning_layer_used: POB lexical decision for רָשָׁע
  rationale: “Wicked people” makes the representative meaning immediately clear.
- pob_phrase: those who keep the law contend with them
  simplified_phrase: those who obey the law oppose them
  preserved_meaning: Those who follow the law actively stand against wicked people or law-forsakers.
  reasoning_layer_used: POB lexical decisions for שֹׁמְרֵי, יִתְגָּרוּ, and בָם
  rationale: “Obey” and “oppose” express the two actions in direct modern English without implying physical violence.
translation_notes:
  risk_flags:
  - risk: “Them” may refer to wicked people generally or more specifically to those who abandon the law.
    mitigation: The pronoun is retained so the documented ambiguity is not narrowed.
