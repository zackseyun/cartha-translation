translation:
  language: en
  text: Wicked people run away when no one is chasing them, but righteous people are confident like a young lion.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Wicked people run away though no one chases them, but righteous people are bold like a young lion.”
