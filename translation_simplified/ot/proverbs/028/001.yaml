- pob_phrase: The wicked flee
  simplified_phrase: Wicked people run away
  preserved_meaning: The proverb speaks generally about people characterized by wickedness who flee.
  reasoning_layer_used: Lexical and theological decisions on generic moral classes
  rationale: Common wording preserves the moral category without making it gender-specific.
- pob_phrase: when no one is pursuing
  simplified_phrase: when no one is chasing them
  preserved_meaning: They run away even though nobody is pursuing them.
  reasoning_layer_used: Lexical decision for וְאֵין רֹדֵף
  rationale: “Chasing them” states the same circumstance in everyday English.
- pob_phrase: the righteous are confident like a young lion
  simplified_phrase: righteous people are confident like a young lion
  preserved_meaning: Righteous people have the settled courage pictured by a young lion.
  reasoning_layer_used: Lexical decisions for וְצַדִּיקִים, כִּכְפִיר, and יִבְטָח
  rationale: The wording keeps confidence rather than overstating it as complete fearlessness, while preserving the young-lion image.
