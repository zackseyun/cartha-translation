  reasoning_layer_used: Lexical and theological decisions on בּוֹטֵחַ and בְּלִבּוֹ
  rationale: “Relies on” is natural English, and the brief explanation prevents “heart” from meaning emotion alone.
- pob_phrase: but he who walks in wisdom
