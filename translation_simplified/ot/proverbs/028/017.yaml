translation:
  language: en
  text: A man weighed down by guilt for taking a life will flee to the pit. Let no one help him.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: burdened by bloodguilt for taking a life
  simplified_phrase: weighed down by guilt for taking a life
  preserved_meaning: The man bears crushing liability for having taken a life.
  reasoning_layer_used: POB lexical decisions and wisdom source audit
  rationale: “Weighed down by guilt” makes the bloodguilt idiom clear while preserving its burden image.
- pob_phrase: let no one support him
  simplified_phrase: Let no one help him
  preserved_meaning: Others are forbidden to aid or sustain the guilty man in his flight.
  reasoning_layer_used: POB lexical decision for אַל יִתְמְכוּ בוֹ
  rationale: “Help” expresses the prohibition in more familiar English without narrowing the kind of aid.
translation_notes:
  risk_flags:
  - risk: “Guilt” may sound merely emotional rather than legal or moral liability.
    mitigation: “For taking a life” grounds the guilt in the man's act, while “weighed down” retains its crushing force.
  - risk: Modern readers may not know whether “the pit” means a grave, dungeon, or destruction.
    mitigation: The concrete source image remains intentionally open, as in the POB reasoning.
