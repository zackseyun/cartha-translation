translation:
  language: en
  text: Whoever joins a thief in crime hates his own life. He hears the public oath calling witnesses to speak, but he does not testify.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This public oath warned that anyone who withheld relevant testimony would be under a curse; compare Leviticus 5:1.
    reason: cultural_note
simplification_decisions:
- pob_phrase: shares with a thief
  simplified_phrase: joins a thief in crime
  preserved_meaning: The person participates with a thief in stolen gain or criminal activity.
  reasoning_layer_used: POB lexical decision for חוֹלֵק עִם גַּנָּב
  rationale: The clearer wording expresses criminal partnership rather than ordinary sharing.
- pob_phrase: an adjuration
  simplified_phrase: the public oath calling witnesses to speak
  preserved_meaning: The person hears a curse-bearing public oath requiring those with knowledge to come forward.
  reasoning_layer_used: Wisdom source audit and POB cultural footnote
  rationale: The legal practice is explained in common English instead of retained as a technical term.
- pob_phrase: hates his own life; he hears ... but does not testify
  simplified_phrase: hates his own life. He hears ... but he does not testify
  preserved_meaning: Complicity is self-destructive, and the accomplice refuses to give testimony when publicly called.
  reasoning_layer_used: POB lexical decisions and sentence structure
  rationale: Two sentences make the contrast easier to follow without weakening the image or legal sense.
interpretive_expansions:
- pob_phrase: shares with a thief
  rendering: joins a thief in crime
  claim: The sharing is participation in the thief’s criminal activity, not ordinary sharing.
  evidence:
  - The POB lexical rationale identifies complicity, partnership, or sharing in stolen gain.
  - The immediate context connects the participant with withheld legal testimony.
  confidence: high
  alternatives_preserved:
  - participates in stolen gain
  - partners with a thief
- pob_phrase: he hears an adjuration
  rendering: He hears the public oath calling witnesses to speak
  claim: The adjuration publicly summons people with relevant knowledge to testify.
  evidence:
  - The POB footnote defines it as a public oath calling knowledgeable people to speak.
  - The source audit identifies a legal oath invoking a curse and calling for disclosure.
  - Leviticus 5:1 provides the stated comparison for this legal setting.
  confidence: high
  alternatives_preserved:
  - hears a curse-bearing oath
  - is publicly called to testify
translation_notes:
  risk_flags:
