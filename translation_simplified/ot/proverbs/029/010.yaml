  rationale: This documented alternative makes the Hebrew idiom immediately understandable.
- pob_phrase: the blameless
  simplified_phrase: a blameless person
  preserved_meaning: A person innocent or blameless in conduct
  reasoning_layer_used: POB lexical decision for תָם
