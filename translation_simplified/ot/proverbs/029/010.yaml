translation:
  language: en
  text: Bloodthirsty people hate a blameless person, but upright people seek to protect that person.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the upright seek that person’s life.” The Hebrew expression may refer either to seeking that person or to caring for and protecting that person’s life.
    reason: alternative_reading
