translation:
  language: en
  text: A poor man and a man who exploits others meet[a]. Yahweh gives light to both their eyes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “an oppressor,” “a deceitful man,” or “a usurer.”
    reason: lexical_alternative
  - marker: b
    text: “Gives light to the eyes” may mean giving sight or life, or sustaining and enlightening a person.
    reason: lexical_alternative
