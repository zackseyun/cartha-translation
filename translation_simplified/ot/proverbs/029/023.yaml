translation:
  language: en
  text: A man's pride will bring him down, but a man with a humble spirit will receive honor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “will hold on to honor” or “will attain honor.” The Hebrew verb can mean grasping, holding, or obtaining.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: will bring him low
  simplified_phrase: will bring him down
  preserved_meaning: Pride causes the proud man to lose his high position or standing.
  reasoning_layer_used: Lexical decision for תַּשְׁפִּילֶנּוּ and the proverb's contrast with honor.
  rationale: “Bring him down” is more natural today while preserving the causative image of being made low.
- pob_phrase: one who is lowly in spirit
  simplified_phrase: a man with a humble spirit
  preserved_meaning: The contrast concerns a man's inward humility, not merely low social status.
  reasoning_layer_used: Lexical decision for וּשְׁפַל רוּחַ.
  rationale: This wording clearly expresses inward humility while retaining the biblical term “spirit.”
- pob_phrase: will obtain honor
  simplified_phrase: will receive honor
  preserved_meaning: The humble man comes into possession of social honor or esteem.
  reasoning_layer_used: Lexical decisions for יִתְמֹךְ and כָּבוֹד.
  rationale: “Receive honor” is common English, while the footnote preserves the Hebrew verb's wider range.
translation_notes:
  risk_flags:
  - risk: “Receive” may sound more passive than the Hebrew verb's senses of grasping or holding.
    mitigation: The footnote preserves the important lexical alternatives.
