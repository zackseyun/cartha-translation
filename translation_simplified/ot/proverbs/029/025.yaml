translation:
  language: en
  text: Being afraid of people becomes a trap, but whoever trusts in Yahweh will be kept high beyond danger’s reach.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The fear of man
  simplified_phrase: Being afraid of people
  preserved_meaning: Anxious fear directed toward other human beings
  reasoning_layer_used: Lexical decision for חֶרְדַּת אָדָם and theological decision on its generic force
  rationale: The wording makes the generic meaning immediately clear without narrowing the kind of fear.
- pob_phrase: lays a snare
  simplified_phrase: becomes a trap
  preserved_meaning: Fear of people ensnares the fearful person
  reasoning_layer_used: Lexical decisions for יִתֵּן and מוֹקֵשׁ with POB footnote a
  rationale: “Becomes a trap” explains the proverb’s image in ordinary English while retaining its force.
- pob_phrase: will be set on high
  simplified_phrase: will be kept high beyond danger’s reach
  preserved_meaning: The trusting person is placed in an inaccessible and secure position
  reasoning_layer_used: Lexical decision for יְשֻׂגָּב with POB footnote b
  rationale: The rendering preserves the height image while clarifying that it represents protection.
