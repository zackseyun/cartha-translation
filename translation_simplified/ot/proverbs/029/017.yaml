simplification_decisions:
- pob_phrase: and he will give you rest
  simplified_phrase: and he will give you relief
  preserved_meaning: The disciplined son will enable the parent to be at ease.
  reasoning_layer_used: POB lexical decision for וִינִיחֶךָ
  rationale: “Relief” clearly expresses the causative sense of rest while “and” preserves the result relationship.
- pob_phrase: he will give delights
  simplified_phrase: he will give joy
  preserved_meaning: The son will bring the parent something inwardly pleasing.
  reasoning_layer_used: POB lexical decision and footnote for מַעֲדַנִּים
  rationale: “Joy” is a documented alternative that is immediately understandable.
- pob_phrase: to your soul
  simplified_phrase: to your inner self
  preserved_meaning: The benefit reaches the parent’s inward life, not merely physical circumstances.
  reasoning_layer_used: POB lexical decision and footnote for לְנַפְשֶׁךָ
  rationale: “Inner self” communicates the Hebrew sense without requiring specialized ideas about the soul.
translation_notes:
  risk_flags:
  - risk: “Joy” is narrower than the Hebrew range of pleasant or delightful things.
    mitigation: The footnote preserves the broader lexical possibility.
  - risk: “Inner self” foregrounds one sense of a term that can also mean life or soul.
    mitigation: The footnote retains the other documented senses.
