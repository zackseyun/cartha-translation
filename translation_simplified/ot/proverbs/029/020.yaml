translation:
  language: en
  text: Do you see a man who speaks without thinking? There is more hope for a fool than for him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The opening may also be translated, “Have you seen a man who speaks without thinking?”
