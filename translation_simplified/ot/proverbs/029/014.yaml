  preserved_meaning: The proverb describes a kind of king, not merely what happens at one moment.
  reasoning_layer_used: POB lexical decision for שׁוֹפֵט and the grounding review
  rationale: Keeping “who judges” preserves the Hebrew’s description of the king.
- pob_phrase: his throne will be established forever
  simplified_phrase: his throne will stand firm forever
  preserved_meaning: His royal rule will have enduring stability.
