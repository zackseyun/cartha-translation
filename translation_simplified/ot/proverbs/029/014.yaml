translation:
  language: en
  text: A king who judges the poor fairly will have a secure throne forever.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Fairly” may also mean truthfully or faithfully; the Hebrew word includes truthfulness, reliability, and justice in judgment.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: judges the poor with truth
  simplified_phrase: judges the poor fairly
  preserved_meaning: The king gives the poor judgments marked by truthfulness, reliability, and justice.
  reasoning_layer_used: POB lexical decision for בֶּאֱמֶת and grounding review
  rationale: “Fairly” clearly expresses the judicial sense, while the note preserves the Hebrew phrase’s wider range.
- pob_phrase: his throne will be established
  simplified_phrase: will have a secure throne
  preserved_meaning: The king’s rule will be made stable and lasting.
  reasoning_layer_used: POB lexical decisions for כִּסְאוֹ and יִכּוֹן
  rationale: This recasting keeps the throne image while making the resulting stability clear.
translation_notes:
  risk_flags:
  - risk: “Fairly” emphasizes justice more than the Hebrew word’s truthfulness and faithfulness senses.
    mitigation: The lexical footnote preserves the other warranted senses.
  - risk: “Forever” could be read as an absolute guarantee of endless duration.
    mitigation: The wording follows the POB and functions proverbially as enduring royal stability.
