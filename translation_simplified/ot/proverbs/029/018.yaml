translation:
  language: en
  text: Where there is no revelation from God,[a] a people run wild; but the man who obeys the law is happy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated “vision” or “prophetic vision”; it means divine revelation, not human plans or ambition.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Where there is no vision
  simplified_phrase: Where there is no revelation from God
  preserved_meaning: The vision is divine or prophetic revelation, not human planning.
  reasoning_layer_used: POB lexical and theological decisions on חָזוֹן
  rationale: The clearer wording prevents the common modern misunderstanding of “vision.”
- pob_phrase: a people cast off restraint
  simplified_phrase: a people run wild
  preserved_meaning: The people become socially unrestrained and unchecked.
  reasoning_layer_used: POB lexical decision on יִפָּרַע
  rationale: “Run wild” expresses the same force in immediate, common English.
- pob_phrase: the one who keeps the law—happy is he
  simplified_phrase: the man who obeys the law is happy
  preserved_meaning: A representative singular man is happy because he observes the law.
  reasoning_layer_used: POB lexical and theological decisions on וְשֹׁמֵר, תּוֹרָה, and אַשְׁרֵהוּ
  rationale: The recast clause is natural English while retaining the law, obedience, happiness, and masculine singular.
interpretive_expansions:
- pob_phrase: vision
  rendering: revelation from God
  claim: The vision in this proverb is revelation given by God.
  evidence:
  - The POB lexical rationale identifies חָזוֹן as revelatory or prophetic vision.
  - The POB theological decision rejects mere social planning or ambition.
  confidence: high
