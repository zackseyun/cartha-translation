simplification_decisions:
- pob_phrase: Where there is no revelation
  simplified_phrase: Without revelation from God
  preserved_meaning: The condition is the absence of divine revelation.
  reasoning_layer_used: lexical and theological decisions
  rationale: Adding “from God” prevents readers from mistaking revelation for human vision or planning.
- pob_phrase: a people runs wild
  simplified_phrase: people run wild
  preserved_meaning: A community becomes unrestrained when divine revelation is absent.
  reasoning_layer_used: lexical decision
  rationale: The generic plural is more natural in common English while retaining the social consequence.
- pob_phrase: the one who keeps the law
  simplified_phrase: the one who obeys the law
  preserved_meaning: The happy person characteristically follows God's authoritative instruction.
  reasoning_layer_used: lexical decision
  rationale: “Obeys” makes clear that “keeps” means observing the law rather than possessing it.
