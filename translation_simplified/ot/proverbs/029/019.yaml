translation:
  language: en
  text: Words alone will not correct a servant.[a] Even when he understands, he gives no response.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “slave.” The Hebrew word may mean either, depending on the social setting.
    reason: lexical_alternative
  - marker: b
