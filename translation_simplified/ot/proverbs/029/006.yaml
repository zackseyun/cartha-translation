translation:
  language: en
  text: There is a snare in an evil man’s sin,[a] but a righteous man sings out and rejoices.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “An evil man’s sin brings about a snare.” The Hebrew may mean either that the snare lies within his sin or that his sin causes it.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: In the transgression of an evil man there is a snare
  simplified_phrase: There is a snare in an evil man’s sin
  preserved_meaning: The snare is bound up with the evil man’s wrongdoing without identifying who is caught.
  reasoning_layer_used: Lexical decisions for בְּפֶשַׁע and מוֹקֵשׁ plus POB footnote a
  rationale: This uses common syntax and “sin” while preserving the snare image and the primary locative reading.
- pob_phrase: the righteous
  simplified_phrase: a righteous man
  preserved_meaning: One righteous man represents the contrasting class of righteous people.
  reasoning_layer_used: Lexical decision for צַדִּיק
  rationale: The singular wording makes the contrast with the evil man easier to follow.
- pob_phrase: sings for joy and rejoices
  simplified_phrase: sings out and rejoices
  preserved_meaning: The righteous man gives a ringing expression of joy and also rejoices.
  reasoning_layer_used: Lexical decisions for יָרוּן and וְשָׂמֵחַ plus latest revision
  rationale: “Sings out” keeps the vocal force while retaining both expressions of joy.
translation_notes:
  risk_flags:
  - risk: The main text foregrounds the reading that the snare lies within the sin.
    mitigation: The footnote preserves the alternative that the sin brings the snare about.
