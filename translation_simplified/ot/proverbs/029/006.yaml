translation:
  language: en
  text: An evil man’s wrongdoing leads to a trap,[a] but a righteous man sings for joy[b] and rejoices.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may mean that the trap lies within his wrongdoing or results from it.
    reason: alternative_reading
  - marker: b
    text: Or “shouts for joy.”
    reason: lexical_alternative
