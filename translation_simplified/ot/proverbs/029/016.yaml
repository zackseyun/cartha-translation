translation:
  language: en
  text: When wicked people become more numerous, rebellion increases. But people who do what is right will see the wicked fall.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: When the wicked increase
  simplified_phrase: When wicked people become more numerous
  preserved_meaning: The number of morally guilty people grows.
  reasoning_layer_used: Lexical decision for בִּרְבוֹת and רְשָׁעִים
  rationale: The wording makes clear that the proverb concerns growth in the number of wicked people.
- pob_phrase: transgression increases
  simplified_phrase: rebellion increases
  preserved_meaning: Violations marked by defiance become more widespread.
  reasoning_layer_used: Lexical decision for פָּשַׁע
  rationale: “Rebellion” is more familiar than “transgression” while retaining the source word’s force.
- pob_phrase: the righteous will look upon their downfall
  simplified_phrase: people who do what is right will see the wicked fall
  preserved_meaning: The righteous will witness the eventual fall of the wicked.
  reasoning_layer_used: Lexical and theological decisions for צַדִּיקִים, יִרְאוּ, and the suffix in בְּמַפַּלְתָּם
  rationale: The rewrite uses ordinary English, preserves the image of seeing a fall, and identifies the supported referent.
interpretive_expansions:
- pob_phrase: their downfall
  rendering: the wicked fall
  claim: The people who fall are the wicked mentioned in the first line.
  evidence:
  - The wicked are the nearest antecedent of the plural suffix.
  - The contrast and parallelism connect their increase with their eventual fall.
  confidence: high
  alternatives_preserved:
  - The suffix could refer more generally to those who fall.
translation_notes:
  risk_flags:
