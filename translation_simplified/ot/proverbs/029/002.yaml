translation:
  language: en
  text: When the number of righteous people grows,[a] the people rejoice. But under the rule of a wicked man, they groan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “When there are many righteous people.” The Hebrew can refer either to their increasing or to their being numerous.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: When the righteous increase
  simplified_phrase: When the number of righteous people grows
  preserved_meaning: Righteous people become more numerous.
  reasoning_layer_used: POB lexical decision for בִּרְבוֹת and צַדִּיקִים
  rationale: The wording makes clear that “increase” refers to the number of righteous people.
- pob_phrase: but when a wicked man rules
  simplified_phrase: But under the rule of a wicked man
  preserved_meaning: The contrast concerns the time when one wicked male ruler governs.
  reasoning_layer_used: POB lexical decisions for וּבִמְשֹׁל and רָשָׁע
  rationale: The prepositional phrase gives the same temporal contrast in more flowing English.
- pob_phrase: the people groan
  simplified_phrase: they groan
  preserved_meaning: The same people suffer openly under wicked rule.
  reasoning_layer_used: POB lexical decisions for עָם and יֵאָנַח
  rationale: The pronoun avoids needless repetition while keeping the people as the subject.
translation_notes:
  risk_flags:
  - risk: “Grows” could obscure the alternative sense that the righteous are already numerous.
    mitigation: Footnote a preserves the documented lexical alternative.
