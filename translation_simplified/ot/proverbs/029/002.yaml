translation:
  language: en
  text: When the number of righteous people grows[a], the people rejoice. But when a wicked man rules, the people groan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “When there are many righteous people.” The Hebrew can refer either to their number growing or to their being numerous.
