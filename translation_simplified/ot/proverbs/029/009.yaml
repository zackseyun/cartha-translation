translation:
  language: en
  text: When a wise man gets into a dispute with a foolish man,[a] whether one rages or laughs,[b] there is no calm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew does not say which man rages or laughs; many understand it to be the foolish man.
    reason: alternative_reading
  - marker: b
    text: The laughter may be mocking or scornful.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: has a dispute with
  simplified_phrase: gets into a dispute with
  preserved_meaning: The wise man enters into contention with the foolish man without requiring a courtroom setting.
  reasoning_layer_used: POB lexical decision for נִשְׁפָּט
  rationale: The new wording makes the action more immediate in common English.
- pob_phrase: whether he rages or laughs
  simplified_phrase: whether one rages or laughs
  preserved_meaning: The person who rages or laughs remains unidentified.
  reasoning_layer_used: POB lexical decisions and alternative-reading footnote
  rationale: Using “one” avoids assigning either reaction to a particular man.
- pob_phrase: there is no rest
  simplified_phrase: there is no calm
  preserved_meaning: The dispute produces neither quiet nor resolution.
  reasoning_layer_used: POB lexical decision for וְאֵין נָחַת
  rationale: “No calm” states the sense naturally without weakening the outcome.
translation_notes:
  risk_flags:
  - risk: Readers may still assume the foolish man is the one who rages or laughs.
    mitigation: Footnote a explicitly preserves the Hebrew subject ambiguity.
  - risk: Ordinary laughter may sound harmless rather than scornful.
    mitigation: Footnote b preserves the possible mocking sense.
