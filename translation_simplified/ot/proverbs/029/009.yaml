translation:
  language: en
  text: When a wise man argues with a foolish man, whether he rages or laughs, the dispute never settles down.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew does not say which man rages or laughs; many understand it to be the foolish man. The laughter may be mocking.
    reason: alternative_reading
