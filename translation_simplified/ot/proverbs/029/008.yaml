  text: Mockers fan a city into turmoil,[a] but wise men turn anger away.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “set a city ablaze”; the Hebrew uses a fire-like image for stirring up public disorder.
    reason: lexical_alternative
