translation:
  language: en
  text: Look![a] It was completely overgrown with thorns. Nettles[b] covered the ground, and its stone wall was broken down.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew draws attention to what the observer saw.
    reason: simplification_note
  - marker: b
    text: The exact plants called “thorns” and “nettles” are uncertain; both are harmful wild growth.
