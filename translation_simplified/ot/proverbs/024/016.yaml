translation:
  language: en
  text: For a righteous person falls seven times[a] and gets back up again, but the wicked stumble when disaster strikes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Seven times” means repeatedly, while preserving the proverb’s picture of completeness.
    reason: cultural_note
