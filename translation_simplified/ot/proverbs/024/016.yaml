  rationale: This common phrase preserves recovery without claiming a separate rising after every fall.
- pob_phrase: stumble in calamity
  simplified_phrase: stumble when disaster strikes
  preserved_meaning: The wicked collapse when adversity comes, not because of moral evil.
  reasoning_layer_used: POB lexical and theological decisions for בְרָעָה
