translation:
  language: en
  text: You wicked man, do not hide near a righteous person’s home, waiting to attack.[a] Do not violently ruin the place where he rests.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Do not ambush the home of a righteous person.”
