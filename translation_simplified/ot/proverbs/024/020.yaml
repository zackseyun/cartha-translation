translation:
  language: en
  text: For an evil person has no lasting future.[a] The lamp of the wicked will be put out.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean that the evil person has no good final outcome.
    reason: lexical_alternative
  - marker: b
    text: The extinguished lamp pictures the loss of life, prosperity, or any enduring place.
    reason: simplification_note
simplification_decisions:
- pob_phrase: there will be no future for the evil
  simplified_phrase: an evil person has no lasting future
  preserved_meaning: A single evil person has no enduring prospect or favorable outcome.
  reasoning_layer_used: lexical and theological decisions on אַחֲרִית and singular לָרָע
  rationale: This wording makes the personal singular reference clear without making evil an abstraction.
- pob_phrase: the lamp of the wicked will be put out
  simplified_phrase: The lamp of the wicked will be put out
  preserved_meaning: The wicked will lose life, prosperity, or enduring standing.
  reasoning_layer_used: lexical decision and POB footnote on נֵר and יִדְעָךְ
  rationale: The concrete lamp image remains in the text while the note explains its force.
interpretive_expansions:
