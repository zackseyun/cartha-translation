simplification_decisions:
- pob_phrase: and your poverty will come like a prowler
  simplified_phrase: Then poverty will creep up on you like a prowler
  preserved_meaning: Poverty arrives gradually and threateningly as a consequence of laziness.
  reasoning_layer_used: Lexical decision for וּבָא and מִתְהַלֵּךְ, with the preceding context
  rationale: “Then” marks the consequence, while “creep up” makes the prowler image immediately clear.
- pob_phrase: your need like an armed man
  simplified_phrase: need will come against you like an armed man
  preserved_meaning: Need arrives as an unavoidable and threatening opponent.
  reasoning_layer_used: Lexical decisions for וּמַחְסֹרֶיךָ and כְּאִישׁ מָגֵן
  rationale: Supplying “will come against you” completes the parallel in natural English without weakening the armed-man image.
translation_notes:
  risk_flags:
  - risk: “Creep up” may suggest secrecy more strongly than the Hebrew movement term alone.
    mitigation: The retained prowler comparison bounds the wording within the POB’s threatening image.
