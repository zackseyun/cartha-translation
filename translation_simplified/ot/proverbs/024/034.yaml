simplification_decisions:
- pob_phrase: and your poverty will come
  simplified_phrase: Then your poverty will arrive
  preserved_meaning: Poverty is the consequence of the laziness described in the previous verse.
  reasoning_layer_used: lexical decision and immediate context
  rationale: “Then” makes the consequence clear, and “arrive” naturally fits the traveler image.
- pob_phrase: and your need like
  simplified_phrase: and your need will come like
  preserved_meaning: Need is pictured as approaching in parallel with poverty.
  reasoning_layer_used: Hebrew poetic parallelism
  rationale: Repeating “will come” completes the shortened second clause for modern readers.
- pob_phrase: a man with a shield
  simplified_phrase: a man carrying a shield
  preserved_meaning: The concrete image of a shield-bearing man remains intact.
  reasoning_layer_used: source audit and lexical decision
  rationale: “Carrying” clarifies the relationship without generalizing the shield to unspecified weapons.
