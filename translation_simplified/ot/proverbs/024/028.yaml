translation:
  language: en
  text: Do not give testimony against your neighbor without a good reason, or[a] deceive with your words.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated “and deceive with your words.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: be a witness against your neighbor
  simplified_phrase: give testimony against your neighbor
  preserved_meaning: It still prohibits acting as a witness against one’s neighbor.
  reasoning_layer_used: The lexical decision identifies a legal or quasi-legal setting.
  rationale: “Give testimony” makes the witness’s action immediately clear.
- pob_phrase: without cause
  simplified_phrase: without a good reason
  preserved_meaning: The testimony is prohibited when it is groundless or unjustified.
  reasoning_layer_used: The lexical decision allows “without reason” and explains the sense as unjustified.
  rationale: “Without a good reason” is clearer in common English.
- pob_phrase: deceive with your lips
  simplified_phrase: deceive with your words
  preserved_meaning: The prohibition still concerns using speech to deceive.
  reasoning_layer_used: The lexical rationale identifies “lips” as an idiom for speech and permits “with your words.”
  rationale: “With your words” states the idiom’s meaning naturally.
translation_notes:
  risk_flags:
  - risk: “Or” could sound as though it offers a choice between two wrong actions.
    mitigation: Both actions remain prohibitions, and the footnote preserves the Hebrew alternative “and.”
