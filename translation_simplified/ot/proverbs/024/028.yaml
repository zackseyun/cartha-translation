simplification_decisions:
- pob_phrase: be a witness against your neighbor
  simplified_phrase: testify against your neighbor
  preserved_meaning: It retains the legal or quasi-legal act of giving testimony against someone.
  reasoning_layer_used: POB lexical decisions for עֵד and בְּרֵעֶךָ
  rationale: “Testify” states the action directly in common English.
- pob_phrase: without cause
  simplified_phrase: when there is no valid reason
  preserved_meaning: It forbids testimony that is groundless or unjustified.
  reasoning_layer_used: POB lexical decision for חִנָּם
  rationale: “No valid reason” makes the ethical and legal sense clear.
- pob_phrase: Would you deceive with your lips?
  simplified_phrase: Would you deceive with your words?
  preserved_meaning: It retains the rhetorical question and identifies the lips as an image for deceptive speech.
  reasoning_layer_used: Wisdom source audit and POB lexical decisions for וַהֲפִתִּיתָ and בִּשְׂפָתֶיךָ
  rationale: “With your words” communicates the Hebrew speech idiom naturally.
