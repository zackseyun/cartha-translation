simplification_decisions:
- pob_phrase: Whoever says to the wicked
  simplified_phrase: Anyone who says to a wicked person
  preserved_meaning: The speaker is indefinite, and the person addressed belongs to the moral category of the wicked.
  reasoning_layer_used: POB lexical decisions for אֹמֵר and לְרָשָׁע
  rationale: “Anyone” and “a wicked person” express the generic proverb in ordinary English.
- pob_phrase: peoples will curse him; nations will denounce him
  simplified_phrase: will be cursed by peoples and denounced by nations
  preserved_meaning: Both broad groups reject the person, while cursing remains distinct from public denunciation.
