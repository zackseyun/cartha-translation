translation:
  language: en
  text: My son, fear Yahweh and the king. Do not get involved with people who are bent on disruptive change.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “those who change” and may refer to rebels or people inclined toward upheaval and disloyal change.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Fear Yahweh, my son, and the king
  simplified_phrase: My son, fear Yahweh and the king
  preserved_meaning: Both Yahweh and the king remain objects of the command to fear.
  reasoning_layer_used: Lexical and theological decisions
  rationale: Moving the address first gives natural English without resolving the theological tension.
- pob_phrase: do not associate with
  simplified_phrase: Do not get involved with
  preserved_meaning: The son must not mix himself among or participate with such people.
  reasoning_layer_used: Lexical decisions for עִם and אַל תִּתְעָרָב
  rationale: “Get involved with” expresses the warning in clear common English.
- pob_phrase: those who are given to change
  simplified_phrase: people who are bent on disruptive change
  preserved_meaning: These people are characterized by an inclination toward destabilizing change or upheaval.
  reasoning_layer_used: Lexical decision for שׁוֹנִים and immediate political context
  rationale: “Bent on” conveys a settled inclination without claiming that disruption is their deliberate aim.
interpretive_expansions:
- pob_phrase: those who are given to change
  rendering: people who are bent on disruptive change
  claim: The change in view is destabilizing or disloyal rather than ordinary improvement.
  evidence:
  - The POB rationale identifies people inclined toward change or upheaval.
  - The warning follows commands concerning loyalty to Yahweh and the king.
  confidence: moderate
  alternatives_preserved:
  - rebels
  - those who change
translation_notes:
  risk_flags:
  - risk: “Disruptive change” narrows the Hebrew’s broader wording.
    mitigation: The footnote preserves the literal expression and identifies the contextual sense as possible.
  - risk: Applying “fear” to Yahweh and the king may suggest equal authority.
    mitigation: The wording preserves the Hebrew syntax without asserting theological equality.
