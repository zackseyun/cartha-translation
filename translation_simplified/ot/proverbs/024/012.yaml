translation:
  language: en
  text: But if you say, “We did not know about this,” doesn’t the one who weighs hearts[a] understand? Doesn’t the one who watches over your life[b] know? He will repay each person according to what they have done.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Weighs hearts” is a Hebrew image for examining the inner person.
    reason: cultural_note
  - marker: b
    text: The Hebrew word translated “life” can also mean “self” or “soul.”
    reason: lexical_alternative
