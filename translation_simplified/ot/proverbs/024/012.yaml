translation:
  language: en
  text: If you say, “Look, we did not know about this,” does not the one who weighs hearts[a] understand? Does not the one who guards your soul[b] know? Will he not repay a man[c] according to what he has done?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Weighs hearts” pictures God examining people’s inner motives.
    reason: cultural_note
  - marker: b
    text: Or “guards your life”; the Hebrew word can mean soul, life, or self.
    reason: lexical_alternative
  - marker: c
    text: Here “a man” means any human being.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: he who keeps your soul
  simplified_phrase: the one who guards your soul
  preserved_meaning: God watches over the whole person while the key term “soul” remains.
  reasoning_layer_used: POB lexical and theological decisions on נצר and נֶפֶשׁ
  rationale: “Guards” makes the protective sense clearer without reducing “soul” to physical life.
- pob_phrase: according to his work
  simplified_phrase: according to what he has done
  preserved_meaning: God’s repayment corresponds to each person’s actions.
  reasoning_layer_used: POB lexical alternative for כְּפָעֳלוֹ
  rationale: The clause states the moral sense of “work” in ordinary English.
- pob_phrase: one coordinated rhetorical question
  simplified_phrase: three short rhetorical questions
  preserved_meaning: Each question expects the answer yes and exposes the excuse as futile.
  reasoning_layer_used: POB decision on הֲלֹא and source syntax
  rationale: Dividing the long sentence makes its parallel claims easier to follow.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “soul” as only an immaterial part of a person.
    mitigation: The footnote preserves the broader Hebrew possibilities of life and self.
  - risk: “A man” may sound limited to males.
    mitigation: The footnote states that the Hebrew singular is generic here.
