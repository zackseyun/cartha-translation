simplification_decisions:
- pob_phrase: lest Yahweh see it
  simplified_phrase: or Yahweh will see it
  preserved_meaning: The action warned against may bring a negative consequence from Yahweh.
  reasoning_layer_used: lexical decision and latest doctrine realignment
  rationale: “Or” gives the warning naturally in modern English while following the controlling lexical choice.
- pob_phrase: and it be evil in his eyes
  simplified_phrase: see it as evil
  preserved_meaning: Yahweh judges the person’s conduct to be evil.
  reasoning_layer_used: Hebrew evaluative idiom and lexical rationale
  rationale: This keeps the image of seeing while making its evaluative meaning immediately clear.
- pob_phrase: and he turn his anger away from him
  simplified_phrase: and turn his anger away from your enemy
  preserved_meaning: Yahweh may remove the anger directed against the enemy.
  reasoning_layer_used: lexical rationale and immediate context
  rationale: Naming the enemy makes the pronoun clear without changing who receives relief.
interpretive_expansions:
- pob_phrase: from him
  rendering: from your enemy
  claim: The pronoun refers to the enemy mentioned in the preceding verse.
  evidence:
  - Proverbs 24:17 identifies the fallen person as “your enemy.”
  - The POB lexical rationale says the anger is removed from the enemy being judged.
  confidence: high
  alternatives_preserved:
  - from him
translation_notes:
  risk_flags:
