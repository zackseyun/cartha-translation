translation:
  language: en
  text: A wise man is strong,[a] and a man with knowledge strengthens his power.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also be understood as “a wise, strong man.”
    reason: lexical_alternative
  - marker: b
    text: Or “a man with knowledge increases strength.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a man of knowledge
  simplified_phrase: a man with knowledge
  preserved_meaning: The man is characterized by knowledge.
  reasoning_layer_used: The lexical decisions for אִישׁ and דַּעַת.
  rationale: “With knowledge” is more familiar English than “of knowledge.”
- pob_phrase: strengthens his might
  simplified_phrase: strengthens his power
  preserved_meaning: Knowledge makes the man’s personal capacity stronger.
  reasoning_layer_used: The lexical decisions for מְאַמֶּץ and כֹּחַ and the restored choice “his power.”
  rationale: “Power” clearly expresses personal capacity while “strengthens” preserves the verb’s force.
translation_notes:
  risk_flags:
