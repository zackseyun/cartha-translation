translation:
  language: en
  text: Do not say, “He did it to me, so I will do the same to him. I will pay him back for what he did.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: As he has done to me, so I will do to him
  simplified_phrase: He did it to me, so I will do the same to him
  preserved_meaning: The speaker intends to retaliate by repeating the other man’s action against him.
  reasoning_layer_used: Lexical decisions for עָשָׂה לִי and כֵּן אֶעֱשֶׂה לּוֹ
  rationale: Ordinary clause order and “the same” make the retaliatory symmetry immediately clear.
- pob_phrase: I will repay the man according to his deed
  simplified_phrase: I will pay him back for what he did
  preserved_meaning: The speaker plans personal repayment measured by the offender’s action.
  reasoning_layer_used: Lexical decisions for אָשִׁיב and כְּפָעֳלוֹ
  rationale: “Pay him back” and “what he did” express the same idea in common English.
