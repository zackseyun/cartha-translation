translation:
  language: en
  text: Rescue people as they are being taken away to die. Hold back those who are stumbling toward slaughter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The final Hebrew words are difficult. They can also mean “if you hold back” and may continue into the next verse, or they may mean “do not hold back.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: those being taken away to death
  simplified_phrase: people as they are being taken away to die
  preserved_meaning: People are already being moved toward death and urgently need rescue.
  reasoning_layer_used: Lexical decision for לְקֻחִים לַמָּוֶת
  rationale: “To die” is more natural for common readers than the abstract destination phrase “to death.”
- pob_phrase: and hold back those staggering to the slaughter
  simplified_phrase: Hold back those who are stumbling toward slaughter.
  preserved_meaning: The reader must intervene for people unsteadily approaching violent death.
  reasoning_layer_used: Lexical and theological decisions for וּמָטִים לַהֶרֶג and אִם תַּחְשׂוֹךְ
  rationale: A separate sentence makes the second urgent command clear while retaining the vivid movement toward slaughter.
