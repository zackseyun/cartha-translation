  simplified_phrase: those who are being led away to die
  preserved_meaning: People are being moved toward imminent death and urgently need rescue.
  reasoning_layer_used: Lexical decisions for לְקֻחִים and לַמָּוֶת
  rationale: The rewrite uses ordinary English while preserving the ongoing movement toward death.
- pob_phrase: those staggering to the slaughter
  simplified_phrase: those stumbling toward slaughter
  preserved_meaning: The people are unstable and in immediate danger of violent death.
  reasoning_layer_used: Lexical decisions for וּמָטִים and לַהֶרֶג
  rationale: “Stumbling toward” keeps the vivid image of peril in more familiar wording.
- pob_phrase: and those staggering to the slaughter, hold them back
  simplified_phrase: Hold back those stumbling toward slaughter.
  preserved_meaning: The second line remains a direct command to intervene.
  reasoning_layer_used: Theological decision on the syntactical force of אִם תַּחְשׂוֹךְ
  rationale: A separate sentence makes the parallel command immediately clear without adding content.
