  rationale: The active form and common phrase “good judgment” make the general truth easier to grasp.
- pob_phrase: but one with a twisted heart will be despised
  simplified_phrase: But they will despise a man whose heart is morally twisted
  preserved_meaning: A person with a crooked inner disposition becomes an object of contempt.
  reasoning_layer_used: POB lexical decisions and cultural note for נַעֲוֵה לֵב
  rationale: A separate active sentence clarifies the contrast while retaining the heart image.
interpretive_expansions:
- pob_phrase: twisted heart
  rendering: heart is morally twisted
  claim: The twisting describes moral crookedness in the inner person, not a physical condition.
  evidence:
