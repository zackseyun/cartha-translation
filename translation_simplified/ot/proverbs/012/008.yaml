translation:
  language: en
  text: People praise a man for his good judgment. But they will despise a man whose heart is morally twisted.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: A man is praised according to his insight
  simplified_phrase: People praise a man for his good judgment
  preserved_meaning: A man's wise discernment is the basis for the praise he receives.
