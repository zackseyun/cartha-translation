  simplified_phrase: does not roast the game he has caught
  preserved_meaning: The lazy man fails to make use of game already obtained.
  reasoning_layer_used: Lexical rationale for יַחֲרֹךְ and צֵידוֹ
  rationale: The wording keeps the concrete roasting image while making “game” immediately clear.
- pob_phrase: diligence is a man’s precious wealth
  simplified_phrase: a man’s diligence is wealth worth treasuring
  preserved_meaning: Diligence itself is highly valuable wealth.
  reasoning_layer_used: Lexical rationale for הוֹן, יָקָר, and חָרוּץ
  rationale: The recast clause states the same contrast in more natural English.
