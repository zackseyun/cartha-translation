translation:
  language: en
  text: A lazy man does not roast the game he has caught.[a][b] But a man’s diligence is wealth worth treasuring.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “A lazy man does not catch his prey.” The verb may refer more broadly to obtaining or preparing game.
    reason: lexical_alternative
  - marker: b
    text: The proverb uses “man” in a representative sense to speak about people generally.
    reason: cultural_note
