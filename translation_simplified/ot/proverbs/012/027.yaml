  reasoning_layer_used: POB lexical decisions for יַחֲרֹךְ and צֵידוֹ
  rationale: The expanded possessive clarifies the hunting image while retaining the preferred sense “roast.”
- pob_phrase: but diligence is a man’s precious wealth
  simplified_phrase: But a man’s precious wealth is diligence
  preserved_meaning: Diligence itself is a highly valuable possession.
  reasoning_layer_used: POB lexical decisions for הוֹן, יָקָר, אָדָם, and חָרוּץ
  rationale: Reversing the clause order gives the compressed contrast natural emphasis without weakening the possessive sense.
