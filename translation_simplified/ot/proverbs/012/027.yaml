  text: A lazy man does not roast the game he has.[a] But a man’s precious wealth is diligence.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “A lazy man does not catch his prey.” The Hebrew verb may refer more broadly to obtaining or preparing game.
    reason: lexical_alternative
  - marker: b
    text: Here “a man” represents people generally.
    reason: cultural_note
