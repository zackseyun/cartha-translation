simplification_decisions:
- pob_phrase: Whoever speaks truth
  simplified_phrase: A person who tells the truth
  preserved_meaning: The person speaks honestly and reliably.
  reasoning_layer_used: POB lexical decision for יָפִיחַ אֱמוּנָה
  rationale: “Tells the truth” is natural common English, while the note preserves the Hebrew image.
- pob_phrase: declares what is right
  simplified_phrase: says what is right
  preserved_meaning: Truthful speech communicates what is right or just.
  reasoning_layer_used: POB lexical decision for יַגִּיד צֶדֶק
  rationale: “Says” replaces formal “declares” without narrowing “what is right.”
- pob_phrase: declares deceit
  simplified_phrase: speaks deceit
  preserved_meaning: The false witness expresses deceptive content.
  reasoning_layer_used: POB lexical decisions for עֵד שְׁקָרִים מִרְמָה
  rationale: Keeping “deceit” as the object preserves the contrast between truthful and deceptive testimony.
