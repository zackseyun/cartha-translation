translation:
  language: en
  text: Whoever speaks[a] truth[b] tells what is right, but a false witness speaks deceit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally “breathes out”; Hebrew uses a vivid picture for speaking.
    reason: simplification_note
  - marker: b
    text: Or “faithfulness” or “trustworthiness”; “what is right” may also be rendered “righteousness” or “justice.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: He who breathes out truth
  simplified_phrase: Whoever speaks truth
  preserved_meaning: The person gives truthful and reliable speech.
  reasoning_layer_used: Lexical decision for יָפִיחַ and אֱמוּנָה
  rationale: “Speaks” gives the idiomatic meaning clearly, while the footnote preserves the breathing image.
- pob_phrase: declares righteousness
  simplified_phrase: tells what is right
  preserved_meaning: Truthful speech makes known what is morally right or just.
  reasoning_layer_used: Chosen lexical rendering for צֶדֶק and doctrine-realignment revision
  rationale: “What is right” preserves the approved broad sense without limiting it to morality or courtroom justice.
- pob_phrase: but a false witness, deceit
  simplified_phrase: but a false witness speaks deceit
  preserved_meaning: False testimony communicates deception.
  reasoning_layer_used: Lexical rationale for the verbless final clause מִרְמָה
  rationale: Supplying “speaks” makes the Hebrew ellipsis understandable while retaining its sharp contrast.
interpretive_expansions:
- pob_phrase: but a false witness, deceit
  rendering: but a false witness speaks deceit
  claim: The verbless clause implies that the false witness speaks deceit.
  evidence:
  - The lexical rationale says the final noun elliptically describes what the false witness yields or speaks.
  - The parallel first clause supplies the speech setting.
  confidence: high
  alternatives_preserved:
  - produces deceit
  - the terse wording “a false witness—deceit”
translation_notes:
  risk_flags:
