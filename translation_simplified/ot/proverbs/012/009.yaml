simplification_decisions:
- pob_phrase: one who is lightly esteemed
  simplified_phrase: to be considered unimportant
  preserved_meaning: The person has low social standing without necessarily being hated.
  reasoning_layer_used: POB lexical decision for נִקְלֶה
  rationale: Common wording makes the social judgment immediately clear.
- pob_phrase: one who honors himself
  simplified_phrase: to make yourself important
  preserved_meaning: The person actively claims or presents personal importance, whether through self-exaltation or pretense.
  reasoning_layer_used: POB lexical decision for מִמְּתַכַּבֵּד
  rationale: This wording preserves the outward social-honor sense rather than reducing it to inward self-assessment.
- pob_phrase: lacks bread
  simplified_phrase: have no bread
  preserved_meaning: The concrete image of lacking basic food remains intact.
  reasoning_layer_used: POB lexical decision for וַחֲסַר לָחֶם
  rationale: The everyday phrase is easier to read while preserving the Hebrew image.
