translation:
  language: en
  text: It is better to be considered unimportant and have a servant than to make yourself important and have no bread.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Make yourself important” may also mean “honor yourself”; the Hebrew can suggest pretending to be important.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: one who is lightly esteemed
  simplified_phrase: to be considered unimportant
  preserved_meaning: Other people regard the person as having little social importance.
  reasoning_layer_used: Lexical decision for נִקְלֶה
  rationale: Common wording preserves low social regard without implying hatred.
- pob_phrase: one who honors himself
  simplified_phrase: to make yourself important
  preserved_meaning: The person exalts or presents himself as important, possibly as a pretense.
  reasoning_layer_used: Lexical decision and POB footnote for מִמְּתַכַּבֵּד
  rationale: This wording keeps self-exaltation primary while leaving room for pretense.
- pob_phrase: lacks bread
  simplified_phrase: have no bread
  preserved_meaning: The person lacks basic food despite appearing important.
  reasoning_layer_used: Lexical decision for וַחֲסַר לָחֶם
  rationale: Plain syntax keeps the concrete bread image and its implication of need.
translation_notes:
  risk_flags:
  - risk: “Make yourself important” may still be understood only as social pretense.
    mitigation: The footnote preserves the broader reflexive sense, “honor yourself,” and marks pretense as possible.
