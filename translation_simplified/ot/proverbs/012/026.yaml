  preserved_meaning: The righteous person guides another person toward the proper course.
  reasoning_layer_used: POB translation and antithetic parallelism
  rationale: The active wording makes the guiding relationship immediately clear while retaining the contrast with being led astray.
- pob_phrase: the way of the wicked
  simplified_phrase: the path of the wicked
  preserved_meaning: The wicked follow a course of life that causes people to stray.
  reasoning_layer_used: POB lexical decision for וְדֶרֶךְ
