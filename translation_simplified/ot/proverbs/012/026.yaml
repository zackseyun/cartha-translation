translation:
  language: en
  text: A righteous person shows a neighbor the right way, but the path of the wicked leads them astray.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The first line may also mean, “A righteous person is better than his neighbor.” The Hebrew wording is difficult.
    reason: alternative_reading
  - marker: b
    text: The Hebrew word translated “neighbor” can also mean “friend” or “companion.”
    reason: lexical_alternative
