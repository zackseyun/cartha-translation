simplification_decisions:
- pob_phrase: Whoever loves discipline
  simplified_phrase: Those who love discipline
  preserved_meaning: The proverb speaks generally of anyone who values formative correction.
  reasoning_layer_used: The lexical decisions treat the participle as generic and מוּסָר as formative discipline.
  rationale: The plural is natural and inclusive while “love” preserves the source’s force and parallel.
- pob_phrase: he who hates reproof
  simplified_phrase: those who hate correction
  preserved_meaning: The person strongly rejects verbal correction or rebuke.
  reasoning_layer_used: The lexical decision for תוֹכַחַת identifies verbal correction as the intended sense.
  rationale: “Correction” is more familiar than “reproof” without weakening the contrast.
translation_notes:
  risk_flags:
  - risk: “Stupid” may sound unusually harsh to modern readers.
    mitigation: It remains because the POB preserves the Hebrew proverb’s sharp moral judgment.
