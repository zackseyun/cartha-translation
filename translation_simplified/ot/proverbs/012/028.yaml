  preserved_meaning: Righteous living is pictured as a path whose outcome is life.
  reasoning_layer_used: POB lexical decisions and theological rationale
  rationale: The active wording makes the proverb’s outcome clear while preserving its path image.
- pob_phrase: and in its pathway there is no death
  simplified_phrase: there is no death along its way
  preserved_meaning: The way of righteousness does not end in death.
  reasoning_layer_used: POB chosen reading of the difficult second colon
  rationale: “Along its way” is natural English and retains the parallel path metaphor.
