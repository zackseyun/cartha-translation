translation:
  language: en
  text: The words of wicked people are an ambush meant to spill blood, but the mouth of the upright rescues those in danger.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew says “rescues them.” This most likely refers to people threatened by the wicked, though it may mean that upright people rescue themselves by what they say.
    reason: lexical_alternative
