  rationale: The plural form is natural and inclusive without changing the proverb’s subject.
- pob_phrase: he who pursues worthless things
  simplified_phrase: those who chase worthless things
  preserved_meaning: The contrast concerns pursuing futile aims instead of productive work.
  reasoning_layer_used: POB lexical decision and revision for וּמְרַדֵּף רֵיקִים
  rationale: “Chase” states the active pursuit in more familiar language while the note preserves the personal alternative.
- pob_phrase: lacks sense
  simplified_phrase: lack good judgment
  preserved_meaning: The person is deficient in practical understanding.
  reasoning_layer_used: POB lexical decision for חֲסַר לֵב
