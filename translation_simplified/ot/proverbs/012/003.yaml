  preserved_meaning: Wickedness cannot provide enduring stability for a person.
  reasoning_layer_used: Lexical decision for יִכּוֹן and instrumental reading of בְּרֶשַׁע
  rationale: The active wording clearly expresses wickedness as an ineffective means of gaining security.
