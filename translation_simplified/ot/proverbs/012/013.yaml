  preserved_meaning: Sinful speech is the means by which the evil man is trapped, while the Hebrew image of lips remains.
  reasoning_layer_used: POB lexical decisions and wisdom-source grammar audit
  rationale: “Sinful words” makes “transgression of the lips” immediately understandable.
- pob_phrase: an evil man is ensnared
  simplified_phrase: An evil man is trapped
  preserved_meaning: The evil man is caught as if in a snare.
  reasoning_layer_used: POB lexical decision for מוֹקֵשׁ
  rationale: “Trapped” expresses the snare image in common English.
- pob_phrase: the righteous comes out of trouble
  simplified_phrase: the righteous man comes out of trouble
  preserved_meaning: The singular masculine righteous counterpart emerges from adversity.
  reasoning_layer_used: POB theological decision on gendered singular substantives
  rationale: Adding “man” clarifies the singular contrast while preserving the representative masculine form.
