translation:
  language: en
  text: People who work hard[a] will rule, but lazy people will be put to forced labor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew pictures “the hand of the diligent,” using the hand for a person’s ability and action.
    reason: simplification_note
  - marker: b
    text: Forced labor means compulsory labor service, not simply hard work.
    reason: cultural_note
