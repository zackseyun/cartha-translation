simplification_decisions:
- pob_phrase: The wicked
  simplified_phrase: Wicked people
  preserved_meaning: The phrase still names people characterized by moral evil.
  reasoning_layer_used: POB lexical decision for רְשָׁעִים
  rationale: The explicit noun is easier for new readers than a substantival adjective.
- pob_phrase: are overthrown and are no more
  simplified_phrase: are brought down and are gone
  preserved_meaning: The wicked suffer ruin and no longer remain.
  reasoning_layer_used: POB lexical decisions for הָפוֹךְ and וְאֵינָם
  rationale: Common wording communicates both their overthrow and resulting disappearance.
- pob_phrase: the house of the righteous will stand
  simplified_phrase: the household of righteous people will remain standing
  preserved_meaning: The righteous person’s established household endures rather than being overthrown.
  reasoning_layer_used: POB lexical decisions for בֵית, צַדִּיקִים, and יַעֲמֹד
  rationale: “Household” clarifies the likely social sense while “standing” preserves the concrete image.
translation_notes:
  risk_flags:
  - risk: Using “household” may narrow the Hebrew image, which can also mean a physical house.
    mitigation: The footnote preserves “house” as an important lexical alternative.
