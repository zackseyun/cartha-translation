simplification_decisions:
- pob_phrase: The wicked
  simplified_phrase: Wicked people
  preserved_meaning: This still names people who are morally evil.
  reasoning_layer_used: POB lexical decision for רְשָׁעִים
  rationale: The added noun makes the moral category immediately clear.
- pob_phrase: and are no more
  simplified_phrase: and gone
  preserved_meaning: Their overthrow ends in their disappearance.
  reasoning_layer_used: POB lexical decision for וְאֵינָם
  rationale: “Gone” expresses the same result in ordinary modern English.
- pob_phrase: the house of the righteous will stand
  simplified_phrase: the house of righteous people will remain standing
  preserved_meaning: The concrete house image conveys the lasting stability of the righteous person’s house or household.
  reasoning_layer_used: POB lexical decisions for בֵית, צַדִּיקִים, and יַעֲמֹד
  rationale: “Remain standing” makes the contrast with overthrow clearer while preserving the image.
