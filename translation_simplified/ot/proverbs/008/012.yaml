translation:
  language: en
  text: I am wisdom.[a] I live with good sense, and I find knowledge and sound judgment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also say, “I, wisdom, have lived with good sense.” The words translated “sound judgment” can also mean “plans” or “devices.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I, wisdom
  simplified_phrase: I am wisdom
  preserved_meaning: Wisdom remains the personified speaker without being made a proper name or identified with Christ.
  reasoning_layer_used: theological decision on personification
  rationale: The direct statement makes the poetic speaker immediately clear.
- pob_phrase: dwell with prudence
  simplified_phrase: live with good sense
  preserved_meaning: Wisdom resides with positively valued practical prudence rather than deceitful craftiness.
  reasoning_layer_used: lexical decisions for שׁכן and עָרְמָה
  rationale: “Live with good sense” uses familiar language while preserving the dwelling image.
- pob_phrase: discretion
  simplified_phrase: sound judgment
  preserved_meaning: The final noun describes a commendable capacity for careful judgment while remaining distinct from knowledge.
  reasoning_layer_used: lexical decision for מְזִמּוֹת
  rationale: “Sound judgment” is a documented alternative that is clearer to common readers.
