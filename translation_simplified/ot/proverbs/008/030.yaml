translation:
  language: en
  text: Then I was there beside him, like a master craftsman.[a] Day after day I was his delight, always rejoicing in his presence.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “like a little child” (or “as a faithful one”); the Hebrew word is difficult and may have a different meaning.
    reason: alternative_reading
  - marker: b
    text: Or “always playing in his presence.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: like a master workman
  simplified_phrase: like a master craftsman
  preserved_meaning: Wisdom is pictured beside God with the skill associated with creation.
  reasoning_layer_used: Lexical and theological decisions for אָמוֹן
  rationale: “Master craftsman” is more familiar while retaining the POB’s controlling interpretation.
- pob_phrase: and I was his delight day after day
  simplified_phrase: Day after day I was his delight
  preserved_meaning: Wisdom continually brought God delight.
  reasoning_layer_used: Lexical decisions for שַׁעֲשֻׁעִים and יוֹם יוֹם
  rationale: The reordered clause reads naturally without weakening its repeated, ongoing sense.
- pob_phrase: rejoicing before him at all times
  simplified_phrase: always rejoicing in his presence
  preserved_meaning: Wisdom continually rejoiced before God.
  reasoning_layer_used: Lexical decisions for מְשַׂחֶקֶת, לְפָנָיו, and בְּכָל עֵת
  rationale: “In his presence” makes the relational meaning of “before him” immediately clear.
translation_notes:
  risk_flags:
  - risk: “Master craftsman” may appear to settle the disputed meaning of אָמוֹן.
    mitigation: Footnote a preserves the important child and faithful-one alternatives.
  - risk: “Rejoicing” does not display the full play imagery possible in מְשַׂחֶקֶת.
    mitigation: Footnote b preserves “playing” as a lexical alternative.
