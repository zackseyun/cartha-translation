translation:
  language: en
  text: Then I was there beside him, a skilled worker.[a] Day after day I was a delight, always playing in his presence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word is difficult. Another possible reading is “a little child.”
