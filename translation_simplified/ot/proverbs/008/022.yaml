translation:
  language: en
  text: Yahweh possessed me[a] at the beginning of his activity, before the works he did long ago.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “Yahweh created me” or “Yahweh acquired me.” This verse has played a major role in debates about personified Wisdom and the Son.
