simplification_decisions:
- pob_phrase: at the beginning of his way
  simplified_phrase: at the start of his activity
  preserved_meaning: Wisdom was present when Yahweh began his ordered course of action.
  reasoning_layer_used: Lexical decisions for רֵאשִׁית and דַּרְכּוֹ
  rationale: “Activity” clarifies God’s “way” without limiting it to a particular act.
- pob_phrase: before his works of old
  simplified_phrase: before his works of long ago
  preserved_meaning: Wisdom preceded Yahweh’s works in the remote past.
  reasoning_layer_used: Lexical decisions for קֶדֶם, מִפְעָלָיו, and מֵאָז
  rationale: “Of long ago” expresses remote antiquity in natural modern English.
