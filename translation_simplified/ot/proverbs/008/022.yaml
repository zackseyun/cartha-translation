translation:
  language: en
  text: Yahweh possessed me at the start of his activity, before his works of long ago.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Yahweh created me” or “Yahweh acquired me.” The Hebrew verb has more than one possible meaning, and this verse has been central to historical debates about personified Wisdom and the Son.
