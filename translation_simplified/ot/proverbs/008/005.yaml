simplification_decisions:
- pob_phrase: you simple ones
  simplified_phrase: you who are naive
  preserved_meaning: The address is to inexperienced or gullible people, not people with limited intelligence.
  reasoning_layer_used: POB lexical decision for פְתָאיִם
  rationale: “Naive” avoids the misleading modern sense of “simple.”
- pob_phrase: Learn prudence
  simplified_phrase: develop good judgment
  preserved_meaning: The hearers must acquire sensible, discerning wisdom rather than deceptive craftiness.
  reasoning_layer_used: POB lexical decisions for הָבִינוּ and עָרְמָה
  rationale: “Develop good judgment” states the positive wisdom sense in natural English.
- pob_phrase: learn understanding
  simplified_phrase: gain understanding
  preserved_meaning: Fools are commanded to acquire the inner capacity for discernment and judgment.
  reasoning_layer_used: POB lexical decisions for הָבִינוּ and לֵב
  rationale: “Gain understanding” clearly names the capacity to be acquired.
translation_notes:
  risk_flags:
