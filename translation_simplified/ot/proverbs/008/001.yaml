simplification_decisions:
- pob_phrase: Does not wisdom call
  simplified_phrase: Doesn’t wisdom call out?
  preserved_meaning: Wisdom publicly calls to people in a rhetorical question expecting yes.
  reasoning_layer_used: Lexical decision for הֲלֹא and תִקְרָא
  rationale: The contraction and split question sound natural, while “call out” remains a documented lexical alternative.
- pob_phrase: and understanding raise her voice?
  simplified_phrase: Doesn’t understanding raise her voice?
  preserved_meaning: Understanding is personified as a woman who speaks openly.
  reasoning_layer_used: Theological decision on feminine personification and lexical decision for תִּתֵּן קוֹלָהּ
  rationale: Repeating the question makes the parallel lines immediately clear without removing the feminine image.
