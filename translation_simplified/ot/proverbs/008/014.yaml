translation:
  language: en
  text: Wise guidance and practical wisdom are mine. I am understanding itself; strength is mine.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Counsel
  simplified_phrase: Wise guidance
  preserved_meaning: Wisdom possesses prudent direction, not merely casual advice.
  reasoning_layer_used: POB lexical decision for עֵצָה
  rationale: “Wise guidance” makes the elevated sense of “counsel” immediately clear.
- pob_phrase: sound wisdom
  simplified_phrase: practical wisdom
  preserved_meaning: Wisdom includes sound judgment that is effective in action.
  reasoning_layer_used: POB lexical decision for תוּשִׁיָּה
  rationale: “Practical wisdom” clearly conveys competence and useful wisdom without promising material success.
- pob_phrase: are mine ... is mine
  simplified_phrase: are mine ... is mine
  preserved_meaning: The repeated wording emphasizes that guidance, wisdom, and strength belong to personified Wisdom.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The poetic repetition remains because it carries deliberate emphasis.
interpretive_expansions:
- pob_phrase: I am understanding
  rendering: I am understanding itself
  claim: Personified Wisdom embodies understanding rather than merely possessing it.
  evidence:
