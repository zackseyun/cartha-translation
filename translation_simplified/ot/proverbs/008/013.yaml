translation:
  language: en
  text: Fearing the LORD means hating evil. I hate pride and arrogance, the path of evil, and twisted speech.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “a mouth of perversions”; it may also be translated “a perverse mouth” or “a mouth of crookedness.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The fear of the LORD is to hate evil
  simplified_phrase: Fearing the LORD means hating evil
  preserved_meaning: Reverence for the LORD necessarily opposes moral evil.
  reasoning_layer_used: Lexical decision for יִרְאַת יְהוָה and שְׂנֹאת
  rationale: The verbal form states the same relationship in more natural English.
- pob_phrase: the way of evil
  simplified_phrase: the path of evil
  preserved_meaning: Evil is pictured as a course or pattern of conduct.
  reasoning_layer_used: Lexical decision for דֶרֶךְ רָע
  rationale: “Path” keeps the Hebrew way metaphor while sounding natural.
- pob_phrase: a mouth of perversions
  simplified_phrase: twisted speech
  preserved_meaning: The speaker hates speech characterized by distortion and perversity.
  reasoning_layer_used: Lexical decisions for פִי תַהְפֻּכוֹת and תַהְפֻּכוֹת
  rationale: The main text states the idiom plainly, while the footnote preserves its literal image.
