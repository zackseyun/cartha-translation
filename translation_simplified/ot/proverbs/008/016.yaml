translation:
  language: en
  text: Rulers and nobles govern through me, as do all who judge rightly.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “all judges of righteousness” or “all judges of justice.” The Hebrew term covers both moral rightness and judicial justice.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: By me rulers rule
  simplified_phrase: Rulers govern through me
  preserved_meaning: Rulers exercise authority by means of Wisdom.
  reasoning_layer_used: Lexical and theological decisions on Wisdom’s agency
  rationale: The active wording makes Wisdom’s agency clear without implying endorsement of every ruler.
- pob_phrase: and nobles
  simplified_phrase: and nobles govern through me
  preserved_meaning: Nobles likewise exercise authority through Wisdom.
  reasoning_layer_used: Hebrew parallelism and the lexical decision for וּנְדִיבִים
  rationale: Supplying the shared verb expresses the compressed parallel in natural English.
- pob_phrase: all judges of righteousness
  simplified_phrase: all who judge rightly
  preserved_meaning: The judges exercise judgment according to moral rightness and judicial justice.
  reasoning_layer_used: Lexical decisions for שֹׁפְטֵי צֶדֶק and צֶדֶק
  rationale: The plain wording clarifies the judicial action while the footnote preserves the compact alternatives.
interpretive_expansions:
- pob_phrase: and nobles, all judges of righteousness
  rendering: and nobles govern through me, as do all who judge rightly
  claim: Wisdom is the means by which the nobles and judges exercise their authority.
  evidence:
  - The first clause explicitly presents Wisdom as the means of ruling.
  - Hebrew parallelism carries the governing idea into the verbless continuation.
  confidence: high
  alternatives_preserved:
  - The final phrase may summarize the preceding governing leaders.
translation_notes:
  risk_flags:
  - risk: Supplying “as do” makes the omitted governing relationship explicit for the judges.
    mitigation: The parallel structure supports carrying the first clause’s verb and agency forward.
  - risk: “Judge rightly” favors an adverbial expression of צֶדֶק.
    mitigation: The footnote preserves “judges of righteousness” and “judges of justice.”
