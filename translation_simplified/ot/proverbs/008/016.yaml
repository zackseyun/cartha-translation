translation:
  language: en
  text: Through me rulers govern, and nobles—all who judge justly—exercise authority.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “all judges who uphold righteousness” or “all judges who uphold justice.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: By me
  simplified_phrase: Through me
  preserved_meaning: Wisdom is the means by which governing authority is rightly exercised.
  reasoning_layer_used: Lexical decision for בִּי and theological decision on Wisdom’s agency
  rationale: “Through me” makes Wisdom’s instrumental role immediately clear without implying endorsement of every ruler.
- pob_phrase: rulers rule
  simplified_phrase: rulers govern
  preserved_meaning: Rulers carry out governing authority by means of Wisdom.
  reasoning_layer_used: Lexical decision for יָשֹׂרוּ
  rationale: “Govern” avoids repetitive wording while preserving the political sense of ruling.
- pob_phrase: nobles—all who judge justly
  simplified_phrase: nobles—all who judge justly—exercise authority
  preserved_meaning: The governing verb carries into the second parallel line and applies to nobles characterized by just judgment.
  reasoning_layer_used: Source audit of Hebrew parallelism
  rationale: Supplying “exercise authority” turns the fragment into clear English while preserving the implied governing action.
translation_notes:
  risk_flags:
  - risk: “Through me” could be read as Wisdom endorsing every political authority.
    mitigation: The wording describes Wisdom as the means of right governance, not as approval of every ruler.
  - risk: Rendering צֶדֶק as “justly” may obscure its noun senses of righteousness and justice.
    mitigation: The footnote preserves both lexical alternatives.
