simplification_decisions:
- pob_phrase: for I will speak noble things
  simplified_phrase: because I will speak noble things
  preserved_meaning: 'Wisdom gives the reason to listen: her words are noble and highly worthy.'
  reasoning_layer_used: POB lexical decisions for כִּי and נְגִידִים
  rationale: “Because” clarifies the explanatory link without changing noble speech into a topic of discussion.
- pob_phrase: the opening of my lips will be upright things
  simplified_phrase: when I open my lips, I will say what is right
  preserved_meaning: Wisdom’s speech is morally upright.
  reasoning_layer_used: POB lexical decisions for וּמִפְתַּח שְׂפָתַי and מֵישָׁרִים
  rationale: The active clause preserves the opening-lips image while expressing moral uprightness naturally.
