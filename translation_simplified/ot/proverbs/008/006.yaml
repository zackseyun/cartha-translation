translation:
  language: en
  text: Listen, because I will speak noble things,[a] and when I open my lips, I will say what is right.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Noble things” may also be translated “excellent things”; the Hebrew describes speech of high worth.
