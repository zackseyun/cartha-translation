simplification_decisions:
- pob_phrase: When he established the heavens, I was there
  simplified_phrase: I was there when he set the heavens in place
  preserved_meaning: Wisdom was present when God established the heavens.
  reasoning_layer_used: Lexical decisions for בַּהֲכִינוֹ, שָׁמַיִם, and שָׁם
  rationale: The reordered clause is easier to follow while keeping “there” locative and the heavens cosmological.
- pob_phrase: when he inscribed a circle
  simplified_phrase: when he drew a circle
  preserved_meaning: God traced a circular form or boundary in the creation scene.
  reasoning_layer_used: Lexical decisions for בְּחֻקוֹ and חוּג
  rationale: “Drew” makes the concrete action immediately clear without replacing the circle with one interpretation.
translation_notes:
  risk_flags:
  - risk: Modern readers may not know whether the circle is the horizon or another cosmic boundary.
    mitigation: The footnote preserves both possibilities without resolving the poetic image.
  - risk: “Face of the deep” is less ordinary than “surface of the waters.”
    mitigation: The phrase remains understandable in context and preserves the source-language image.
