simplification_decisions:
- pob_phrase: established the heavens
  simplified_phrase: set the heavens in place
  preserved_meaning: God made the heavens firm and ordered them in creation.
  reasoning_layer_used: Lexical decision for בַּהֲכִינוֹ and creation context
  rationale: “Set in place” expresses the creation action in familiar English.
- pob_phrase: inscribed a circle
  simplified_phrase: drew a circle
  preserved_meaning: God traced or marked out a circular boundary.
  reasoning_layer_used: Lexical decisions for בְּחֻקוֹ and חוּג
  rationale: “Drew” clarifies the concrete image without interpreting the circle as a horizon.
- pob_phrase: When he established ... when he inscribed
  simplified_phrase: When he set ... when he drew
  preserved_meaning: Wisdom was present during both distinct acts of creation.
  reasoning_layer_used: Hebrew temporal clauses and theological decision on Wisdom’s presence
  rationale: The repeated “when” preserves the parallel temporal presentation of both acts.
translation_notes:
  risk_flags:
  - risk: Readers may not know what the circle on the deep represents.
