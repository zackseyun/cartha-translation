translation:
  language: en
  text: I did not listen to my instructors or pay attention to my teachers.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: listen to the voice of my instructors
  simplified_phrase: listen to my instructors
  preserved_meaning: The speaker refused attentive reception of his instructors and their teaching.
  reasoning_layer_used: The lexical audit says the Hebrew idiom means to listen or heed without requiring explicit obedience.
  rationale: Removing “the voice of” makes the idiom natural while keeping its direct object and force.
- pob_phrase: nor did I incline my ear to my teachers
  simplified_phrase: or pay attention to my teachers
  preserved_meaning: The speaker failed to give his teachers attentive heed.
  reasoning_layer_used: The lexical audit identifies inclining the ear as an image for paying attention.
  rationale: The common idiom states the image’s function clearly for modern readers.
- pob_phrase: and ... nor did I
  simplified_phrase: I did not ... or ...
  preserved_meaning: The two related failures remain distinct under one negation.
  reasoning_layer_used: The conjunction audit identifies two coordinated negative clauses.
  rationale: One concise sentence expresses the parallel clauses without formal inversion.
translation_notes:
  risk_flags:
  - risk: Replacing the ear image with its meaning removes the source’s bodily metaphor.
    mitigation: The clear phrase “pay attention” preserves the metaphor’s audited function.
