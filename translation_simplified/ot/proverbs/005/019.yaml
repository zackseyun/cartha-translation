translation:
  language: en
  text: She is a loving doe, a graceful mountain goat. Let her breasts always satisfy you, and let her love always carry you away.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: a loving doe, a graceful mountain goat—
  simplified_phrase: She is a loving doe, a graceful mountain goat.
  preserved_meaning: The wife is praised through two graceful wild-animal images.
  reasoning_layer_used: POB lexical decisions and immediate context
  rationale: A complete sentence makes the poetic description easier to follow while keeping both metaphors.
- pob_phrase: may her breasts satisfy you at all times
  simplified_phrase: Let her breasts always satisfy you
  preserved_meaning: The verse openly commends continual sexual delight within marriage.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Let” gives the line direct force, while “always” states the same duration more simply.
- pob_phrase: be intoxicated always with her love
  simplified_phrase: let her love always carry you away
  preserved_meaning: Her love should continually captivate and overwhelm him in a positive sense.
  reasoning_layer_used: POB lexical decision for תִּשְׁגֶּה
  rationale: “Carry you away” clearly expresses the positive figurative sense without suggesting literal drunkenness.
translation_notes:
  risk_flags:
  - risk: “Carry you away” softens some of the force of the intoxication image.
    mitigation: The phrase still presents her love as powerfully overwhelming and follows the POB’s stated alternative sense.
  - risk: The explicit reference to breasts may surprise some readers.
    mitigation: It is retained because the Hebrew and the POB deliberately use concrete marital-sexual imagery.
