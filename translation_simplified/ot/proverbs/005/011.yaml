simplification_decisions:
- pob_phrase: and you groan at your end
  simplified_phrase: In the end, you will groan
  preserved_meaning: The person will cry out in anguish at the path’s final outcome, possibly at life’s end.
  reasoning_layer_used: POB lexical decisions for וְנָהַמְתָּ and בְאַחֲרִיתֶךָ
  rationale: The new order is natural English while the footnote preserves the Hebrew phrase’s two possible senses.
- pob_phrase: when your flesh and your body are consumed
  simplified_phrase: as your flesh and body waste away
  preserved_meaning: The person’s physical being is progressively ruined.
  reasoning_layer_used: POB lexical decisions for בִּכְלוֹת, בְּשָׂרְךָ, and וּשְׁאֵרֶךָ
  rationale: “Waste away” clearly expresses bodily consumption while retaining both concrete body terms.
