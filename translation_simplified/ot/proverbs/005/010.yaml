  rationale: “Otherwise” states the warning naturally in modern English.
- pob_phrase: be filled with your strength
  simplified_phrase: have their fill of your strength
  preserved_meaning: Outsiders consume or benefit from the person’s power and resources.
  reasoning_layer_used: lexical decisions for יִשְׂבְּעוּ and כֹּחֶךָ
  rationale: This keeps the Hebrew image of being filled while using a familiar expression.
- pob_phrase: your labors go to the house of a foreigner
  simplified_phrase: what you worked hard for will end up in a foreigner’s household
  preserved_meaning: The results of painful effort pass into an outsider’s household.
