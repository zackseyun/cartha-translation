  preserved_meaning: The warned-against action will bring an undesirable consequence.
  reasoning_layer_used: POB lexical decision for פֶּן
  rationale: “Otherwise” expresses the warning naturally in modern English.
- pob_phrase: your labors go to the house of a foreigner
  simplified_phrase: your hard work will end up in a foreigner’s household
  preserved_meaning: The addressee’s toil or its gains pass into an outsider’s household.
  reasoning_layer_used: POB lexical decisions for וַעֲצָבֶיךָ and בְּבֵית
  rationale: “Hard work” retains the ambiguity while “end up” makes the implied transfer clear.
