translation:
  language: en
  text: Otherwise, strangers will have their fill of your strength, and what you worked hard for will end up in a foreigner’s household.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may refer to your hard labor itself or to the wealth it produced.
    reason: lexical_alternative
