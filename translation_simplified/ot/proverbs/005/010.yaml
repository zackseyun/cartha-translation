translation:
  language: en
  text: Otherwise, strangers will have their fill of your strength,[a] and your hard work will end up in a foreigner’s household.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Strength” may include vigor, productive ability, and resources.
    reason: lexical_alternative
  - marker: b
    text: This may refer to your labor itself, what it produces, or your hard-earned wealth.
    reason: lexical_alternative
