translation:
  language: en
  text: Her tracks wander so she will not make the path of life straight, and she does not realize it.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The compact Hebrew may also mean, “Lest you consider the path of life, her paths wander.” The final clause may address the listener: “and you do not realize it.”'
    reason: lexical_alternative
