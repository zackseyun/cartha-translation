translation:
  language: en
  text: You are in danger of not considering the path that leads to life. Her paths wander, and you do not know where they lead.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The compact Hebrew may instead mean, “She does not consider the path of life. Her paths wander, and she does not know it.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Lest you ponder the path of life
  simplified_phrase: You are in danger of not considering the path that leads to life
  preserved_meaning: The verse warns that the listener may fail to weigh the life-giving course.
  reasoning_layer_used: Latest source audit and lexical decisions for פֶּן תְּפַלֵּס and אֹרַח חַיִּים
  rationale: This states the warning plainly without claiming that her wandering actively prevents reflection.
- pob_phrase: her paths wander
  simplified_phrase: Her paths wander
  preserved_meaning: Her course is unstable and wayward.
  reasoning_layer_used: Lexical decisions for נָעוּ and מַעְגְּלֹתֶיהָ
  rationale: The clear road image and its force are retained.
- pob_phrase: you do not know them
  simplified_phrase: you do not know where they lead
  preserved_meaning: The listener cannot discern the course of her wandering paths.
  reasoning_layer_used: Latest source audit and final-clause alternative reading
  rationale: The implicit object of knowing is expressed in natural English.
interpretive_expansions:
- pob_phrase: the path of life
  rendering: the path that leads to life
  claim: Life is presented as the outcome of the figurative path.
  evidence:
  - The Hebrew phrase directly joins the path image with life.
  - The surrounding warning contrasts her course with the path of life.
  confidence: high
  alternatives_preserved:
  - the path of life
  - the way of life
- pob_phrase: you do not know them
  rendering: you do not know where they lead
  claim: Not knowing her paths means being unable to discern their course.
  evidence:
  - The plural object naturally refers to her wandering paths.
  - The road metaphor supports speaking of where paths lead.
  confidence: moderate
  alternatives_preserved:
  - you do not know them
