- pob_phrase: Lest she should level the path of life
  simplified_phrase: so she will not make the path of life straight
  preserved_meaning: Her wandering prevents the path of life from becoming a straight course.
  reasoning_layer_used: Lexical decisions for פֶּן and תְּפַלֵּס
  rationale: “So she will not make ... straight” preserves the prevention force and the selected road image in common English.
- pob_phrase: her tracks wander
  simplified_phrase: Her tracks wander
  preserved_meaning: Her course is wavering and unstable.
  reasoning_layer_used: Lexical decisions for נָעוּ and מַעְגְּלֹתֶיהָ
  rationale: The concrete travel image remains clear and distinct from the path of life.
- pob_phrase: she does not know it
  simplified_phrase: she does not realize it
  preserved_meaning: The woman is unaware that her course wanders.
  reasoning_layer_used: Theological decision on the final clause’s subject
  rationale: “Realize” clarifies awareness while retaining the preferred feminine subject.
