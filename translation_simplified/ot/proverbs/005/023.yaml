simplification_decisions:
- pob_phrase: for lack of discipline
  simplified_phrase: because he lacks discipline
  preserved_meaning: The absence of corrective moral discipline causes his death.
  reasoning_layer_used: POB lexical decision for בְּאֵין and מוּסָר
  rationale: The direct causal clause is easier to understand while retaining discipline’s moral-formative force.
- pob_phrase: and in the abundance of his folly
  simplified_phrase: With so much folly
  preserved_meaning: His folly is great and accompanies his ruinous wandering.
  reasoning_layer_used: POB lexical decisions for וּבְרֹב and אִוַּלְתּוֹ
  rationale: The shorter wording preserves both the abundance and the key wisdom term “folly.”
- pob_phrase: and ... he goes astray
  simplified_phrase: With so much folly, he goes astray.
  preserved_meaning: His moral folly is bound to his ruinous deviation.
  reasoning_layer_used: POB lexical decision for יִשְׁגֶּה
  rationale: A separate sentence makes the outcome clear without turning the image into physical staggering.
translation_notes:
  risk_flags:
