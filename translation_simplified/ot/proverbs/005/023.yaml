simplification_decisions:
- pob_phrase: for lack of discipline
  simplified_phrase: because he lacks discipline
  preserved_meaning: The absence of corrective moral discipline causes his death.
  reasoning_layer_used: Lexical decision for בְּאֵין and מוּסָר
  rationale: The verbal clause states the same causal relationship in more direct English.
- pob_phrase: in the abundance of his folly
  simplified_phrase: in his great folly
  preserved_meaning: His moral folly is very great and accompanies his ruinous wandering.
  reasoning_layer_used: Lexical decisions for רֹב and אִוַּלְתּוֹ
  rationale: “Great folly” expresses the Hebrew intensification without the awkward phrase “abundance of folly.”
- pob_phrase: and ... he goes astray
  simplified_phrase: In his great folly, he goes astray.
  preserved_meaning: His folly results in ruinous moral deviation.
  reasoning_layer_used: Lexical decision for יִשְׁגֶּה
  rationale: A separate sentence makes the outcome easier to follow while retaining the moral image of straying.
translation_notes:
  risk_flags:
  - risk: Present-tense “dies” may be read as immediate rather than proverbial.
    mitigation: The footnote preserves the equally possible future-tense rendering.
