simplification_decisions:
- pob_phrase: The righteous ... the wicked
  simplified_phrase: Righteous people ... wicked people
  preserved_meaning: Both expressions still describe each kind of person as a general class.
  reasoning_layer_used: POB lexical decisions for צַדִּיק and רְשָׁעִים
  rationale: Adding “people” makes the substantival adjectives immediately clear without changing their moral force.
- pob_phrase: will not dwell in the land
  simplified_phrase: will not make their home in the land
  preserved_meaning: The wicked will not enjoy settled residence in the land.
  reasoning_layer_used: POB lexical decision for יִשְׁכְּנוּ
  rationale: “Make their home” expresses settled habitation in familiar English.
