translation:
  language: en
  text: Whoever accepts discipline follows the path to life[a], but whoever rejects correction leads others astray.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “is a path to life.” The Hebrew wording is brief and can be understood either way.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: keeps discipline
  simplified_phrase: accepts discipline
  preserved_meaning: The person continues to receive formative training and correction.
  reasoning_layer_used: The lexical decision for מוּסָר includes both training and correction.
  rationale: “Accepts discipline” makes willing adherence clear in common English.
- pob_phrase: is on the path to life
  simplified_phrase: follows the path to life
  preserved_meaning: Discipline directs a person along a moral course toward life.
  reasoning_layer_used: The lexical decisions preserve אֹרַח as a life-path image and לְחַיִּים as direction toward life.
  rationale: “Follows the path” keeps the metaphor while sounding more active and natural.
- pob_phrase: forsakes reproof
  simplified_phrase: rejects correction
  preserved_meaning: The person refuses morally serious verbal correction.
  reasoning_layer_used: The lexical decisions identify עזב as abandonment and תּוֹכַחַת as correction or rebuke.
  rationale: “Rejects correction” states the contrast in familiar modern language.
translation_notes:
  risk_flags:
