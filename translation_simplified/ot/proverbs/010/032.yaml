translation:
  language: en
  text: The lips of righteous people know what is fitting to say,[a] but the mouths of wicked people speak twisted things.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “what is pleasing” or “what is acceptable.” The Hebrew word can also mean “favor” or “goodwill.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the righteous
  simplified_phrase: righteous people
  preserved_meaning: The phrase still refers generally to people who live rightly.
  reasoning_layer_used: POB lexical decision for צַדִּיק
  rationale: Adding “people” makes the generic group clear in ordinary English.
- pob_phrase: what is acceptable
  simplified_phrase: what is fitting to say
  preserved_meaning: Righteous people discern what kind of speech is appropriate and pleasing.
  reasoning_layer_used: POB lexical decision for רָצוֹן and immediate speech context
  rationale: “Fitting to say” clearly places acceptability in the proverb’s speech setting.
- pob_phrase: speaks perversity
  simplified_phrase: speak twisted things
  preserved_meaning: The wicked produce morally crooked or perverse speech.
  reasoning_layer_used: POB lexical decision for תַּהְפֻּכוֹת
  rationale: “Twisted things” uses common language while preserving the image of crookedness.
