translation:
  language: en
  text: Whoever gives a deceptive wink causes grief, and a fool who speaks foolishly will come to ruin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “a fool of lips”; it may also mean “a babbling fool.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Whoever winks the eye
  simplified_phrase: Whoever gives a deceptive wink
  preserved_meaning: The concrete wink remains a harmful gesture without being defined as a secret signal.
  reasoning_layer_used: POB lexical decision and independent grounding review
  rationale: “Deceptive” clarifies the negative force while avoiding an unsupported covert mechanism.
- pob_phrase: a fool of lips
  simplified_phrase: a fool who speaks foolishly
  preserved_meaning: The fool is characterized by foolish speech.
  reasoning_layer_used: POB lexical rationale and doctrine-realignment revision
  rationale: The Hebrew idiom becomes clear English, while the literal image remains in the footnote.
interpretive_expansions:
- pob_phrase: winks the eye
  rendering: gives a deceptive wink
  claim: The wink has a harmful, deceptive character rather than being a neutral gesture.
  evidence:
