- pob_phrase: What the wicked dreads will come upon him
  simplified_phrase: What wicked people fear will overtake them
  preserved_meaning: The feared outcome of wicked people eventually reaches them.
  reasoning_layer_used: POB lexical decisions for מְגוֹרַת, רָשָׁע, and הִיא תְבוֹאֶנּוּ
  rationale: The plural wording is clearer while “overtake” preserves the image of the feared outcome arriving.
- pob_phrase: the desire of the righteous
  simplified_phrase: what righteous people desire
  preserved_meaning: The righteous have a desired outcome that stands in contrast to the wicked person’s fear.
  reasoning_layer_used: POB lexical decisions for תַאֲוַת and צַדִּיקִים
  rationale: The clause form is more direct for common readers and retains the proverb’s contrast.
