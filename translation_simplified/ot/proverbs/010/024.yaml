translation:
  language: en
  text: What wicked people fear will come upon them, but what righteous people desire will be granted.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: What the wicked dreads
  simplified_phrase: What wicked people fear
  preserved_meaning: The phrase still means the feared outcome, not merely the feeling of fear.
  reasoning_layer_used: POB lexical decision for מְגוֹרַת and רָשָׁע
  rationale: Common wording makes the generic reference immediately clear.
- pob_phrase: the desire of the righteous
  simplified_phrase: what righteous people desire
  preserved_meaning: The righteous person's hoped-for outcome remains distinct from the wicked person's feared outcome.
  reasoning_layer_used: POB lexical decisions and antithetical parallelism
  rationale: A direct clause is easier to understand than the abstract noun phrase.
- pob_phrase: will be granted
  simplified_phrase: will be granted
  preserved_meaning: The desire will be fulfilled without naming the unstated giver.
  reasoning_layer_used: POB theological decision on the implicit subject of יִתֵּן
  rationale: The passive wording preserves the source's ambiguity about who grants it.
translation_notes:
  risk_flags:
  - risk: Using plural people and them shifts the Hebrew's representative singular into an explicit generic plural.
    mitigation: The plural keeps POB's class-wide proverbial meaning without adding gender.
