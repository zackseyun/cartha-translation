translation:
  language: en
  text: Yahweh does not leave a righteous person hungry. But he pushes away what wicked people crave.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “he pushes away the ruin of wicked people.” The Hebrew word may mean “craving” or “ruin.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: will not let the righteous person go hungry
  simplified_phrase: does not leave a righteous person hungry
  preserved_meaning: Yahweh keeps a morally righteous person from lacking food.
  reasoning_layer_used: Lexical decisions for יַרְעִיב, נֶפֶשׁ, and צַדִּיק
  rationale: The shorter clause keeps hunger concrete and treats the Hebrew “person” as the whole living self.
- pob_phrase: he drives away the craving of the wicked
  simplified_phrase: he pushes away what wicked people crave
  preserved_meaning: Yahweh repels the desires pursued by wicked people.
  reasoning_layer_used: Lexical and theological decisions for הַוַּת, רְשָׁעִים, and יֶהְדֹּף
  rationale: The wording makes the relationship clear while preserving the source image of pushing something away.
