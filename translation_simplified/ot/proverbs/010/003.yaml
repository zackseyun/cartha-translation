simplification_decisions:
- pob_phrase: the righteous person
  simplified_phrase: a righteous person
  preserved_meaning: The verse describes any person who belongs to the moral category of the righteous.
  reasoning_layer_used: Lexical decision for נֶפֶשׁ and צַדִּיק
  rationale: The indefinite singular sounds natural while retaining both “person” and the biblical term “righteous.”
- pob_phrase: he drives away the craving of the wicked
  simplified_phrase: he pushes away what wicked people crave
  preserved_meaning: Yahweh forcefully rejects or frustrates the desires of wicked people.
  reasoning_layer_used: Lexical decisions for הַוַּת, רְשָׁעִים, and יֶהְדֹּף
  rationale: The new wording clarifies the relationship between the people and their craving while preserving the source image of pushing away.
