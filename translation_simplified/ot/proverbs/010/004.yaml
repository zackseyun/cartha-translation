simplification_decisions:
- pob_phrase: A slack hand
  simplified_phrase: A lazy hand
  preserved_meaning: The hand remains the image for work done with negligence or laziness.
  reasoning_layer_used: POB lexical decision for רְמִיָּה and כַף
  rationale: “Lazy” communicates the labor-related meaning more directly than “slack.”
- pob_phrase: the hand of the diligent
  simplified_phrase: a hardworking hand
  preserved_meaning: The second hand image still contrasts diligent work with lazy work.
  reasoning_layer_used: POB lexical decisions for יָד and חָרוּצִים
  rationale: “Hardworking” is clearer for common readers than the substantive phrase “the diligent.”
- pob_phrase: makes one poor ... makes rich
  simplified_phrase: makes a person poor ... makes a person rich
  preserved_meaning: Both halves retain the causal contrast between work habits and economic outcomes.
  reasoning_layer_used: POB lexical decisions for עֹשֶׂה, רָאשׁ, and תַּעֲשִׁיר
  rationale: Repeating “a person” makes the balanced result explicit and natural in English.
