translation:
  language: en
  text: A lazy hand makes a person poor, but a hardworking hand makes a person rich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word translated “lazy” can also mean “deceitful,” but this proverb’s focus on work favors “lazy.”
