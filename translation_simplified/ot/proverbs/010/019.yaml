translation:
  language: en
  text: When people use many words, sin does not stop. But those who control their lips act wisely.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: When words are many
  simplified_phrase: When people use many words
  preserved_meaning: An abundance of speech creates the circumstance described in the proverb.
  reasoning_layer_used: The lexical decision for בְּרֹב דְּבָרִים supports an idiomatic statement about many words.
  rationale: Adding “people use” makes the action natural and clear in English.
- pob_phrase: transgression does not cease
  simplified_phrase: sin does not stop
  preserved_meaning: Wrongdoing continues amid abundant speech.
  reasoning_layer_used: The lexical decisions identify פָּשַׁע as moral wrongdoing and חדל as stopping or ceasing.
  rationale: “Sin” and “does not stop” express the same warning in familiar language.
- pob_phrase: whoever restrains his lips is prudent
  simplified_phrase: those who control their lips act wisely
  preserved_meaning: A person who limits speech demonstrates practical wisdom.
  reasoning_layer_used: The lexical decisions preserve the lips image and allow מַשְׂכִּיל to mean acting wisely.
  rationale: The generic plural avoids a gendered pronoun while keeping the Hebrew image.
translation_notes:
  risk_flags:
  - risk: “Sin” is broader than the more specific “transgression.”
    mitigation: It retains the required moral force in language more familiar to common readers.
