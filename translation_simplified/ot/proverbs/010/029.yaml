translation:
  language: en
  text: Yahweh’s way is a fortress that protects people who live with integrity, but it brings destruction to those who do evil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Yahweh’s way” may mean how Yahweh acts, the path he sets before people, or both.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: is a stronghold for the blameless
  simplified_phrase: is a fortress that protects people who live with integrity
  preserved_meaning: Yahweh’s way gives concrete protection to people characterized by moral integrity.
  reasoning_layer_used: POB lexical decisions for מָעוֹז and לַתֹּם
  rationale: The wording explains the fortress image and replaces the less familiar “blameless” with its stated ethical sense.
- pob_phrase: but destruction for those who do evil
  simplified_phrase: but it brings destruction to those who do evil
  preserved_meaning: The same way that protects the upright results in ruin for evildoers.
  reasoning_layer_used: POB lexical decision and source audit for וּמְחִתָּה
  rationale: Supplying “it brings” makes the Hebrew ellipsis natural while retaining the sharp contrast.
