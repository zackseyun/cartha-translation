  rendering: a fortress that protects people who live with integrity
  claim: The stronghold image describes protection, and “blameless” identifies people of integrity.
  evidence:
  - The POB lexical rationale defines מָעוֹז as a place or source of protection.
  - The POB lexical rationale identifies תֹּם with integrity or blamelessness.
  confidence: high
  alternatives_preserved:
  - stronghold for the blameless
  - refuge for the upright
translation_notes:
  risk_flags:
