translation:
  language: en
  text: For people of integrity, the way of Yahweh[a] is a fortress. But for those who do evil, it is destruction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The way of Yahweh” may mean how Yahweh acts, the path he gives people to follow, or both.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The way of Yahweh is a stronghold for the blameless
  simplified_phrase: For people of integrity, the way of Yahweh is a fortress
  preserved_meaning: Yahweh's way protects people characterized by moral integrity.
  reasoning_layer_used: Lexical decisions for מָעוֹז and תֹּם
  rationale: “Fortress” keeps the concrete protection image, while “people of integrity” avoids implying sinless perfection.
- pob_phrase: but destruction for those who do evil
  simplified_phrase: But for those who do evil, it is destruction
  preserved_meaning: The same way stands as destruction rather than protection for evildoers.
  reasoning_layer_used: Lexical decisions for מְחִתָּה and פֹעֲלֵי אָוֶן
  rationale: The separate sentence clarifies the contrast without adding a causal mechanism.
translation_notes:
  risk_flags:
  - risk: “It” could require readers to look back for its referent.
    mitigation: The immediately preceding phrase clearly identifies “the way of Yahweh” as the shared subject.
  - risk: Readers may take “the way of Yahweh” in only one of its documented senses.
    mitigation: The footnote preserves both meanings without choosing between them.
