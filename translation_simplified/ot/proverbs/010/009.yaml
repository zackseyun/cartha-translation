translation:
  language: en
  text: Those who live with integrity walk safely, but those who twist their own paths will be found out.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “will become known” or “will be exposed.” The Hebrew may refer either to the crooked person being recognized or to that person’s conduct being uncovered.
