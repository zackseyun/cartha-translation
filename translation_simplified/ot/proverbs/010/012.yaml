translation:
  language: en
  text: Hatred stirs up quarrels, but love covers every wrong.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: To “cover” a wrong means not exposing it or keeping the conflict going; it does not mean hiding injustice.
    reason: simplification_note
simplification_decisions:
- pob_phrase: stirs up conflicts
  simplified_phrase: stirs up quarrels
  preserved_meaning: Hatred provokes or intensifies disputes.
  reasoning_layer_used: Lexical decisions for תְּעוֹרֵר and מְדָנִים
  rationale: “Stirs up” preserves incitement without limiting hatred to starting a dispute.
- pob_phrase: all transgressions
  simplified_phrase: every wrong
  preserved_meaning: Love responds differently to offenses of every kind.
  reasoning_layer_used: Lexical decisions for כָּל and פְּשָׁעִים
  rationale: “Every wrong” is common English while retaining the moral force of an offense.
- pob_phrase: love covers
  simplified_phrase: love covers
  preserved_meaning: Love does not expose offenses or keep conflict alive.
  reasoning_layer_used: Lexical and theological decisions for תְּכַסֶּה
  rationale: The concrete image remains because “forgives” would narrow its meaning.
interpretive_expansions:
- pob_phrase: love covers all transgressions
  rendering: 'Footnote: not exposing a wrong or keeping the conflict going'
  claim: The covering image describes love refusing to broadcast offenses or prolong conflict.
  evidence:
  - The POB footnote explains covering as not exposing or perpetuating offenses.
  - The theological rationale contrasts love with hatred that inflames disputes.
  confidence: high
  alternatives_preserved:
  - Covering is not reduced to forgiveness alone.
  - The note rules out hiding injustice.
translation_notes:
  risk_flags:
  - risk: “Covers” could be misunderstood as concealing abuse or injustice.
    mitigation: The footnote explicitly rules out hiding injustice.
