translation:
  language: en
  text: Hatred makes conflicts flare up, but love covers every wrong.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: stirs up conflicts
  simplified_phrase: makes conflicts flare up
  preserved_meaning: Hatred actively incites and intensifies disputes.
  reasoning_layer_used: POB lexical decision for תְּעוֹרֵר and מְדָנִים
  rationale: The new wording makes the active image immediately clear in common English.
- pob_phrase: all transgressions
  simplified_phrase: every wrong
  preserved_meaning: Love covers offenses without narrowing them to a specific kind of sin.
  reasoning_layer_used: POB lexical and theological decisions for כָּל פְּשָׁעִים
  rationale: “Every wrong” keeps the moral force while avoiding the formal term “transgressions.”
- pob_phrase: love covers
  simplified_phrase: love covers
  preserved_meaning: Love does not expose or perpetuate offenses as hatred does.
  reasoning_layer_used: POB theological decision for תְּכַסֶּה אַהֲבָה
  rationale: The concrete covering image is retained because replacing it with “forgives” would overresolve its meaning.
translation_notes:
  risk_flags:
  - risk: “Covers every wrong” could be misread as requiring people to hide injustice.
    mitigation: The wording preserves the source metaphor without adding that unethical conclusion.
