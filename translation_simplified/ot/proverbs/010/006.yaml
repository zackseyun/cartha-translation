  text: Blessings rest on the heads of those who do what is right, but the mouths of wicked people hide violence.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “but violence covers the mouths of wicked people.” The Hebrew can be understood either way.
    reason: alternative_reading
