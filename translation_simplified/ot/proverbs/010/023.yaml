translation:
  language: en
  text: A fool treats wicked behavior like a joke, but wisdom is for a man with understanding.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “A fool treats an evil scheme like a game.” The Hebrew can also refer to a shameless or outrageous act.
