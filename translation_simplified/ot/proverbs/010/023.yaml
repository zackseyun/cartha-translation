simplification_decisions:
- pob_phrase: Doing wickedness is like a joke to a fool
  simplified_phrase: A fool treats wicked behavior like a joke
  preserved_meaning: The fool regards morally evil conduct as amusing play.
  reasoning_layer_used: Lexical decisions for כִּשְׂחוֹק, לִכְסִיל, and זִמָּה
  rationale: The active wording clearly expresses the fool’s perspective while preserving the joke image and moral force.
- pob_phrase: a man of understanding
  simplified_phrase: a man with understanding
  preserved_meaning: The representative man is characterized by discernment.
  reasoning_layer_used: Lexical and theological decisions for לְאִישׁ תְּבוּנָה
  rationale: The phrase is natural English and preserves understanding as a settled wisdom quality.
translation_notes:
