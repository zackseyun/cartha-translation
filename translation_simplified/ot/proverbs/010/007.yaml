translation:
  language: en
  text: The memory of those who do what is right is a blessing, but the name of wicked people will rot away.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “name” includes a person’s reputation and legacy.
    reason: simplification_note
simplification_decisions:
- pob_phrase: the righteous
  simplified_phrase: those who do what is right
  preserved_meaning: It still describes people characterized by righteous conduct.
  reasoning_layer_used: POB lexical decision for צַדִּיק
  rationale: The descriptive phrase makes the moral category clear to readers unfamiliar with “the righteous.”
- pob_phrase: the wicked
  simplified_phrase: wicked people
  preserved_meaning: It retains the proverb’s generic category of morally wicked people.
  reasoning_layer_used: POB lexical decision for רְשָׁעִים
  rationale: Adding “people” makes the substantival adjective immediately clear.
- pob_phrase: the name of the wicked will rot
  simplified_phrase: the name of wicked people will rot away
  preserved_meaning: The vivid image says their reputation and legacy will decay.
  reasoning_layer_used: POB lexical decisions for שֵׁם and יִרְקָב
  rationale: The concrete words “name” and “rot” remain, while “away” makes the English expression more natural.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “name” as only a personal label.
    mitigation: The footnote explains its broader sense of reputation and legacy.
