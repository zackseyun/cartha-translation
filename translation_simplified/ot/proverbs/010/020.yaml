translation:
  language: en
  text: The tongue of the righteous is like fine silver, but the heart of the wicked has little value.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “is little” or “is almost nothing.”
