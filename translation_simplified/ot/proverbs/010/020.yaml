  preserved_meaning: The righteous person’s speech is compared to high-quality, valuable silver.
  reasoning_layer_used: Lexical decisions for כֶּסֶף and נִבְחָר
  rationale: “Fine silver” keeps the concrete silver image while making its high quality easier to understand.
- pob_phrase: is of little worth
  simplified_phrase: has little value
  preserved_meaning: The inner life of the wicked is evaluated as having very little worth.
  reasoning_layer_used: Lexical decision for כִּמְעָט
  rationale: “Has little value” states the same valuation in more common English.
interpretive_expansions:
