translation:
  language: en
  text: Their brothers[a], listed by their ancestral family groups, were Michael, Meshullam, Sheba, Jorai, Jachan, Zia, and Eber—seven in all.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “brothers” may also mean other male relatives within the clan.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: according to their fathers’ houses
  simplified_phrase: listed by their ancestral family groups
  preserved_meaning: The men are identified according to their paternal family or clan divisions.
  reasoning_layer_used: POB lexical decision and cultural note
  rationale: This conveys the formula’s classificatory force without the opaque phrase “fathers’ houses.”
- pob_phrase: Michael, Meshullam, Sheba, Jorai, Jachan, Zia, and Eber—seven
  simplified_phrase: were Michael, Meshullam, Sheba, Jorai, Jachan, Zia, and Eber—seven in all
  preserved_meaning: The verse names seven men and then states their total.
  reasoning_layer_used: POB lexical decision for שִׁבְעָה
  rationale: Ordinary sentence structure and “in all” make the list and its total immediately clear.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “brothers” only as sons of the same parents.
    mitigation: The footnote preserves the possible wider sense of male clan relatives.
  - risk: “Ancestral family groups” does not explicitly say that these groups followed the paternal line.
    mitigation: “Ancestral” preserves descent, while “listed by” retains the genealogical classification.
