translation:
  language: en
  text: These are the sons of Reuben, Israel’s firstborn son. Reuben was the firstborn, but because he defiled his father’s marriage bed, his rights as firstborn were given to the sons of Joseph son of Israel. Even so, Joseph’s sons were not listed in the family record as the firstborn—
  philosophy: optimal-equivalence
