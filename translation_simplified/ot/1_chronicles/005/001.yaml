- pob_phrase: The sons of Reuben, the firstborn of Israel—for he was the firstborn
  simplified_phrase: These are the sons of Reuben, Israel’s firstborn son. Reuben was the firstborn
  preserved_meaning: Reuben remains Israel’s biological firstborn despite losing his birthright.
  reasoning_layer_used: Lexical and theological decisions on firstborn status
  rationale: Two sentences make the genealogical introduction and explanation easier to follow.
- pob_phrase: his father’s bed
  simplified_phrase: his father’s marriage bed
  preserved_meaning: Reuben sexually violated the honor of his father’s marriage.
  reasoning_layer_used: Lexical decision on יְצוּעֵי אָבִיו
  rationale: Adding “marriage” makes the Hebrew idiom clear while preserving its concrete image.
- pob_phrase: his birthright was given
  simplified_phrase: his rights as firstborn were given
  preserved_meaning: The legal privileges belonging to the firstborn passed from Reuben to Joseph’s sons.
  reasoning_layer_used: Lexical decision on בְּכֹרָתוֹ
  rationale: The phrase explains the less familiar term “birthright” in common English.
