translation:
  language: en
  text: Beerah was his son and a leader of the Reubenites. King Tilgath-pilneser[a] of Assyria took him away into exile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew here spells the king’s name “Tilgath-pilneser.” Many English versions use the more familiar form “Tiglath-pileser.”
    reason: lexical_alternative
