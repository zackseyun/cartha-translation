translation:
  language: en
  text: But they were unfaithful to the God of their ancestors. They prostituted themselves[a] by following the gods worshiped by the peoples of the land—the peoples God had destroyed ahead of them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses prostitution as a picture of abandoning God to worship other gods.
    reason: source_note
simplification_decisions:
- pob_phrase: acted unfaithfully against the God of their fathers
  simplified_phrase: were unfaithful to the God of their ancestors
  preserved_meaning: They broke faith with the God worshiped by their ancestors.
  reasoning_layer_used: Lexical decisions for וַיִּמְעֲלוּ and בֵּאלֹהֵי אֲבוֹתֵיהֶם
  rationale: Natural relational wording preserves the covenant breach without the awkward phrase “acted unfaithfully against.”
- pob_phrase: prostituted themselves after the gods
  simplified_phrase: prostituted themselves by following the gods
  preserved_meaning: Their pursuit of other gods was spiritual infidelity.
  reasoning_layer_used: Lexical and theological decisions for וַיִּזְנוּ אַחֲרֵי
  rationale: This keeps the sexual metaphor while expressing the pursuit idiom naturally.
- pob_phrase: the gods of the peoples of the land, whom God had destroyed before them
  simplified_phrase: the gods worshiped by the peoples of the land—the peoples God had destroyed ahead of them
  preserved_meaning: They adopted the gods of peoples God had removed as Israel advanced.
  reasoning_layer_used: Lexical decision for אֱלֹהֵי עַמֵּי הָאָרֶץ and its relative clause
  rationale: The wording identifies the peoples as those destroyed and makes the conquest setting clear.
