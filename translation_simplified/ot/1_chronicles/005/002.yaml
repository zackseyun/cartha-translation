translation:
  language: en
  text: For Judah was more powerful than his brothers, and the ruler[a] came from his family line. Even so, the status and rights of the firstborn son belonged to Joseph.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “leader” or “prince.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: prevailed over his brothers
  simplified_phrase: was more powerful than his brothers
  preserved_meaning: Judah held greater prominence than the other brother tribes.
  reasoning_layer_used: Lexical decision for גָּבַר with בְּאֶחָיו
  rationale: The comparison states Judah’s superiority without adding a process of becoming or implying military conquest.
- pob_phrase: though the birthright belonged to Joseph
  simplified_phrase: Even so, the status and rights of the firstborn son belonged to Joseph
  preserved_meaning: Joseph held the distinct firstborn status despite Judah’s supremacy and rulership.
  reasoning_layer_used: Lexical and theological decisions for הַבְּכֹרָה
  rationale: This explains “birthright” while preserving the contrast between Judah’s authority and Joseph’s firstborn privileges.
interpretive_expansions:
- pob_phrase: from him came the ruler
  rendering: the ruler came from his family line
  claim: The ruler arose from Judah’s descendants.
  evidence:
  - The singular pronoun most naturally refers to Judah.
  - The POB rationale identifies dynastic leadership as the contextual sense.
  confidence: high
  alternatives_preserved:
  - leader
  - prince
- pob_phrase: the birthright
  rendering: the status and rights of the firstborn son
  claim: The birthright includes the recognized position and privileges of the firstborn.
  evidence:
  - The lexical rationale defines הַבְּכֹרָה as the right or status of the firstborn.
  - The theological audit distinguishes Joseph’s firstborn status from Judah’s rulership.
  confidence: high
  alternatives_preserved:
  - inheritance privileges
translation_notes:
  risk_flags:
  - risk: “Family line” makes the dynastic sense more explicit than the Hebrew pronoun alone.
    mitigation: The POB rationale supports origin from Judah and dynastic leadership.
  - risk: Explaining “birthright” as status and rights is broader than inheritance alone.
    mitigation: The POB audit explicitly defines it as both the right and status of the firstborn.
