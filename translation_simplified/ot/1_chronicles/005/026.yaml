translation:
  language: en
  text: So the God of Israel stirred the spirit of Pul, king of Assyria—the spirit of Tilgath-pilneser, king of Assyria.[a][b] The king took the Reubenites, the Gadites, and the half-tribe of Manasseh away into exile. He brought them to Halah, Habor, Hara, and the Gozan River, where they remained to the writer’s own day.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may instead refer to Pul and Tilgath-pilneser as two separate rulers.
    reason: alternative_reading
  - marker: b
    text: “Tilgath-pilneser” reflects the Hebrew form here; the more familiar English form is “Tiglath-pileser.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: even the spirit of Tilgath-pilneser king of Assyria
  simplified_phrase: —the spirit of Tilgath-pilneser, king of Assyria
  preserved_meaning: The main text presents the names appositionally while the footnote preserves the two-ruler reading.
  reasoning_layer_used: POB theological decision and revision history
  rationale: The dash makes the relationship easier to follow without using the overconfident phrase “that is.”
- pob_phrase: he took ... into exile, and brought them
  simplified_phrase: The king took ... away into exile. He brought them
  preserved_meaning: The Assyrian king forcibly removed and relocated the tribes.
  reasoning_layer_used: POB lexical decisions for וַיַּגְלֵם and וַיְבִיאֵם
  rationale: Two sentences clarify the sequence and identify the pronoun’s referent.
- pob_phrase: the river Gozan
  simplified_phrase: the Gozan River
  preserved_meaning: The destination remains the same named geographic feature.
  reasoning_layer_used: POB place-name lexical decision
  rationale: Modern English normally places “River” after a proper name.
interpretive_expansions:
- pob_phrase: to this day
  rendering: where they remained to the writer’s own day
  claim: The exiled people were still in those locations when the account was written.
  evidence:
  - The Hebrew idiom marks continuation up to the narrator’s time.
  - The immediate clause links the phrase to the exiles’ relocation.
  confidence: high
  alternatives_preserved:
  - to this day
translation_notes:
  risk_flags:
  - risk: The dash may still suggest that Pul and Tilgath-pilneser are certainly the same ruler.
    mitigation: Footnote [a] explicitly preserves the viable two-ruler interpretation.
  - risk: “The writer’s own day” explains rather than formally reproduces the Hebrew idiom.
    mitigation: It prevents readers from mistaking “this day” for the present day while retaining its temporal force.
