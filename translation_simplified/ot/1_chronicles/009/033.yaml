translation:
  language: en
  text: These singers were leaders of the Levites’ ancestral families. They were in the rooms and were exempt from other duties,[a] because this work was their responsibility day and night.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Hebrew term may also mean “excused” or “released.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: heads of fathers’ houses of the Levites
  simplified_phrase: leaders of the Levites’ ancestral families
  preserved_meaning: They led formal family groups within the tribe of Levi.
  reasoning_layer_used: POB lexical decision for רָאשֵׁי אָבוֹת
  rationale: “Ancestral families” makes the clan structure clearer than “fathers’ houses.”
- pob_phrase: in the chambers, free from other duties
  simplified_phrase: in the rooms and were exempt from other duties
  preserved_meaning: They occupied institutional rooms and were freed from other duties.
  reasoning_layer_used: POB lexical decisions for בַּלְּשָׁכוֹת and פטירים
  rationale: “Rooms” is more familiar, while “exempt” preserves the rare term’s likely sense without making its scope absolute.
- pob_phrase: they were occupied in the work day and night
  simplified_phrase: this work was their responsibility day and night
  preserved_meaning: They bore an ongoing obligation to perform this work.
  reasoning_layer_used: POB lexical decisions for עֲלֵיהֶם, בַּמְּלָאכָה, and יוֹמָם וָלַיְלָה
  rationale: The wording expresses the Hebrew responsibility idiom in ordinary English.
