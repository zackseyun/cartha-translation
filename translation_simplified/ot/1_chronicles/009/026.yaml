  text: For these four capable gatekeepers were Levites. They were trusted with responsibility for the rooms and storerooms in the house of God.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: four mighty gatekeepers
  simplified_phrase: four capable gatekeepers
  preserved_meaning: The gatekeepers were distinguished by strength, ability, or prominence.
  reasoning_layer_used: POB lexical decision for גִּבֹּרֵי
  rationale: “Capable” conveys their proven ability more clearly than the potentially martial “mighty.”
- pob_phrase: were entrusted with
  simplified_phrase: were trusted with responsibility for
  preserved_meaning: They held an official charge because they were considered reliable.
  reasoning_layer_used: POB lexical decisions for בֶאֱמוּנָה and וְהָיוּ עַל
  rationale: The expanded wording clearly preserves both trustworthiness and assigned oversight.
- pob_phrase: the chambers and with the storehouses
  simplified_phrase: the rooms and storerooms
  preserved_meaning: They supervised the temple rooms and places where goods or valuables were stored.
  reasoning_layer_used: POB lexical decisions for הַלְּשָׁכוֹת and הָאֹצְרוֹת
  rationale: Common building terms replace formal administrative vocabulary without narrowing the objects stored.
