translation:
  language: en
  text: Ahaz was the father of Jarah.[a] Jarah was the father of Alemeth, Azmaveth, and Zimri. Zimri was the father of Moza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The parallel genealogy in 1 Chronicles 8:36 has “Jehoaddah” instead of “Jarah.” The manuscripts of Chronicles here have “Jarah,” so that name is used in the text.
    reason: textual_variant
