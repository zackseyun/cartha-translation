translation:
  language: en
  text: Altogether, 212 were chosen to serve as gatekeepers at the entrances. They were registered by family line in their villages. David and Samuel the seer[a] established them in this position of trust.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Seer” is an older title for a prophet.
    reason: cultural_note
  - marker: b
    text: Or, “established them because of their faithfulness,” or “established them in their faithfulness.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: All these who were chosen as gatekeepers at the thresholds were two hundred and twelve
  simplified_phrase: Altogether, 212 were chosen to serve as gatekeepers at the entrances
  preserved_meaning: The total number chosen for guarding the entry points was 212.
  reasoning_layer_used: Lexical decisions for הַבְּרוּרִים, לְשֹׁעֲרִים, and בַּסִּפִּים
  rationale: The direct count and ordinary clause order make the sentence easier to follow.
- pob_phrase: were enrolled by genealogy in their villages
  simplified_phrase: were registered by family line in their villages
  preserved_meaning: Their service was formally recorded according to ancestry in their local settlements.
  reasoning_layer_used: Lexical decisions for הִתְיַחְשָׂם and בְחַצְרֵיהֶם
  rationale: “Registered by family line” states genealogical enrollment in common English.
- pob_phrase: established them in their office of trust
  simplified_phrase: established them in this position of trust
  preserved_meaning: David and Samuel placed them in an official responsibility requiring trustworthiness.
  reasoning_layer_used: Lexical and theological decisions for יִסַּד and בֶּאֱמוּנָתָם
  rationale: “Position of trust” keeps both the official charge and its moral nuance.
