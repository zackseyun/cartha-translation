translation:
  language: en
  text: Their brothers[a], who were leaders of their ancestral households, numbered 1,760. They were men of proven ability who did the work required for service in the house of God.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “brothers” may include other male relatives from their clans.
    reason: lexical_alternative
  - marker: b
    text: The “house of God” is the temple.
    reason: simplification_note
