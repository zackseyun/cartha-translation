translation:
  language: en
  text: Shallum son of Kore, son of Ebiasaph, son of Korah, and his brothers from the Korahite ancestral family were in charge of this service. They guarded the thresholds of the tent.[a] Their ancestors had been in charge of Yahweh’s camp,[b] guarding its entrance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “guarded the gates of the tent.” The Hebrew literally says “keepers of the thresholds of the tent.”
    reason: lexical_alternative
  - marker: b
    text: Yahweh is the personal name of God represented by YHWH in Hebrew.
    reason: source_note
simplification_decisions:
- pob_phrase: and his brothers from his father’s house, the Korahites
  simplified_phrase: and his brothers from the Korahite ancestral family
  preserved_meaning: The men belonged to Shallum’s paternal clan, the line of Korah.
  reasoning_layer_used: POB lexical decisions for brothers, father’s house, and Korahites
  rationale: “Ancestral family” makes the clan relationship clear while retaining “brothers.”
- pob_phrase: were over the work of the service, keepers of the thresholds of the tent
  simplified_phrase: were in charge of this service. They guarded the thresholds of the tent
  preserved_meaning: They had continuing responsibility for sanctuary service and guarded its access points.
  reasoning_layer_used: POB lexical decisions for oversight, service, keepers, thresholds, and tent
  rationale: Two direct sentences clarify the duty while preserving the threshold image.
- pob_phrase: their fathers had been over the camp of Yahweh, keepers of the entrance
  simplified_phrase: Their ancestors had been in charge of Yahweh’s camp, guarding its entrance
  preserved_meaning: Earlier generations oversaw and guarded the sacred camp.
  reasoning_layer_used: POB lexical and theological decisions for fathers, camp, entrance, and Yahweh
  rationale: “Ancestors” clarifies the historical reference, and active wording makes the duty easier to follow.
translation_notes:
  risk_flags:
  - risk: “Ancestors” is broader than the literal “fathers.”
    mitigation: The clan setting and retrospective verb support earlier family generations.
  - risk: Modern readers may understand “thresholds” only as floor sills.
    mitigation: The footnote gives the contextual alternative “gates” while preserving the Hebrew image.
