  preserved_meaning: The wording keeps the emphatic identification of Yahweh as Israel’s God.
  reasoning_layer_used: The lexical and theological decisions require the personal name “Yahweh” and the singular phrase “our God.”
  rationale: The comma clearly presents “our God” as identifying Yahweh.
- pob_phrase: his judgments are in all the earth
  simplified_phrase: His judgments are throughout all the earth.
  preserved_meaning: Yahweh’s judgments are present worldwide without implying movement.
  reasoning_layer_used: The lexical decision retains “judgments,” and the scope decision favors universal “earth.”
  rationale: “Are throughout” states worldwide extent naturally without adding an image of reaching.
