translation:
  language: en
  text: Sing to him! Sing songs of praise to him! Tell[a] about all the wonderful things he has done.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “reflect on.” Here, the public call to praise favors “tell about.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: sing praises to him
  simplified_phrase: Sing songs of praise to him!
  preserved_meaning: The command calls people to honor God through singing.
  reasoning_layer_used: Lexical decision for זַמְּרוּ and poetic parallelism
  rationale: “Songs of praise” makes the worship sense immediately clear while remaining distinct from the first command.
- pob_phrase: speak of all his wondrous deeds
  simplified_phrase: Tell about all the wonderful things he has done
  preserved_meaning: The people must recount every extraordinary act God has performed.
  reasoning_layer_used: Lexical decisions for שִׂיחוּ, בְּכָל, and נִפְלְאֹתָיו
  rationale: This recasts an elevated phrase in direct, common English without weakening its comprehensive force.
translation_notes:
  risk_flags:
  - risk: “Tell” gives the Hebrew verb’s public, spoken sense more strongly than its possible reflective sense.
    mitigation: The context supports outward speech, and the footnote preserves the reflective alternative.
