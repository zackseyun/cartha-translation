- pob_phrase: the tent that David had pitched for it
  simplified_phrase: the tent David had set up for it
  preserved_meaning: David prepared this tent specifically for the ark.
  reasoning_layer_used: Lexical and theological decisions for הָאֹהֶל and אֲשֶׁר נָטָה לוֹ דָּוִיד
  rationale: “Set up” is clearer than “pitched” while avoiding the imported label “tabernacle.”
- pob_phrase: and they offered burnt offerings and peace offerings before God
