translation:
  language: en
  text: They brought the ark of God into the tent David had set up for it and placed it in the middle.[a] Then they offered burnt offerings and peace offerings before God.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean simply “inside the tent.”
    reason: lexical_alternative
  - marker: b
    text: Peace offerings may also be called “fellowship offerings” or “offerings of well-being.”
