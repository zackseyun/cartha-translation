translation:
  language: en
  text: And say, “Save us, God who saves us. Gather us and rescue us from the nations, so that we may give thanks to your holy name and rejoice as we praise you.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “rejoice in your praise,” possibly meaning “rejoice in the praise you deserve.”
    reason: lexical_alternative
