translation:
  language: en
  text: Then the trees of the forest will sing for joy[a] in Yahweh’s presence, because he is coming[b] to judge the earth.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “shout for joy.” The Hebrew describes a joyful sound that may be sung or shouted.
    reason: lexical_alternative
  - marker: b
    text: Or “he comes.” The Hebrew can express this coming action with vivid certainty in this poetic setting.
    reason: lexical_alternative
  - marker: c
    text: Or “the land,” though the wider setting points to the whole earth.
    reason: alternative_reading
