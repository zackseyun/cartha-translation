  text: All the earth, tremble before him! Yes, the world stands firm; it will not be shaken.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Tremble before him, all the earth
  simplified_phrase: All the earth, tremble before him!
  preserved_meaning: The whole earth is summoned to tremble in God's presence.
  reasoning_layer_used: POB lexical decisions for חִילוּ, מִלְּפָנָיו, and כָּל הָאָרֶץ
  rationale: Direct word order makes the command easier to grasp while keeping its universal scope and force.
- pob_phrase: indeed, the world is established
  simplified_phrase: Yes, the world stands firm
  preserved_meaning: The world is securely ordered and sustained under God's rule.
  reasoning_layer_used: POB lexical and theological decisions for אַף and תִּכּוֹן
  rationale: “Stands firm” expresses secure stability more clearly than the passive phrase “is established.”
- pob_phrase: it shall not be moved
  simplified_phrase: it will not be shaken
  preserved_meaning: The world will not totter or lose its God-given stability.
  reasoning_layer_used: POB lexical decision for תִּמּוֹט and cosmic-stability rationale
  rationale: “Will not be shaken” preserves the Hebrew stability image without suggesting absolute physical immobility.
translation_notes:
  risk_flags:
  - risk: The stability language could be misread as a scientific claim that the earth never moves.
    mitigation: “Stands firm” and “will not be shaken” frame the line as poetic security under God's rule.
