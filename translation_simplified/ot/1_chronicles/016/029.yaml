translation:
  language: en
  text: Give Yahweh the glory his name deserves. Bring an offering and come before him. Bow down to Yahweh in holy splendor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “in the splendor of holiness”; possibly, “in holy attire.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Ascribe to Yahweh the glory due his name
  simplified_phrase: Give Yahweh the glory his name deserves
  preserved_meaning: The command calls people to acknowledge the honor rightly owed to Yahweh.
  reasoning_layer_used: Lexical decision for הָבוּ and כְּבוֹד שְׁמוֹ
  rationale: “Give” and “deserves” express the worship formula in familiar English.
- pob_phrase: bring an offering and come before him
  simplified_phrase: Bring an offering and come before him.
  preserved_meaning: Worshipers are to approach God while presenting an offering.
  reasoning_layer_used: Lexical decisions for שְׂאוּ מִנְחָה and וּבֹאוּ לְפָנָיו
  rationale: A separate sentence makes the paired actions easier to follow.
- pob_phrase: Bow down to Yahweh in holy splendor
  simplified_phrase: Bow down to Yahweh in holy splendor.
  preserved_meaning: The embodied act of reverent worship and the poetic holiness image remain intact.
  reasoning_layer_used: Lexical and theological decisions for הִשְׁתַּחֲווּ and בְּהַדְרַת קֹדֶשׁ
  rationale: The wording is already clear and preserves both the physical action and poetic ambiguity.
translation_notes:
  risk_flags:
  - risk: “Give” could be mistaken for transferring glory to Yahweh rather than acknowledging it.
    mitigation: The phrase “the glory his name deserves” signals recognition of honor already owed.
  - risk: “Holy splendor” may refer either to holiness’s beauty or to sacred attire.
    mitigation: The footnote preserves both documented alternatives without narrowing the main text.
