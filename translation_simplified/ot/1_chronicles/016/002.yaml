  simplified_phrase: After David finished presenting
  preserved_meaning: David completed the sacrifices before blessing the people.
  reasoning_layer_used: POB lexical decision for וַיְכַל and מֵהַעֲלוֹת
  rationale: “After” and “presenting” express the sequence naturally without repeating “offering.”
- pob_phrase: the burnt offering
  simplified_phrase: the sacrifice that was completely burned
  preserved_meaning: This sacrifice was wholly consumed by fire.
  reasoning_layer_used: POB lexical alternative “the whole burnt offering”
  rationale: The wording explains an unfamiliar ritual term while preserving its concrete image.
- pob_phrase: in the name of Yahweh
  simplified_phrase: in Yahweh’s name
  preserved_meaning: David blessed the people under the authority of Yahweh’s personal name.
  reasoning_layer_used: POB lexical and theological decision for בְּשֵׁם יְהוָה
  rationale: The possessive form is plainer English and retains the divine name.
