translation:
  language: en
  text: After David finished presenting the sacrifice that was completely burned and the peace offerings,[a] he blessed the people in Yahweh’s name.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Peace offerings may also be called “fellowship offerings” or “offerings of well-being.”
