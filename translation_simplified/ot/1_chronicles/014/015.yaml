  preserved_meaning: David is commanded to advance into combat when he hears the sign.
  reasoning_layer_used: lexical decision for תֵּצֵא בַמִּלְחָמָה
  rationale: The wording turns the military idiom into direct, common English.
- pob_phrase: for God has gone out before you
  simplified_phrase: God has gone out ahead of you
  preserved_meaning: God has already taken the lead into battle before David acts.
  reasoning_layer_used: lexical and theological decisions for יָצָא הָאֱלֹהִים לְפָנֶיךָ
  rationale: “Ahead of you” clearly expresses God’s leading position while preserving the image of going out.
- pob_phrase: the camp of the Philistines
  simplified_phrase: the Philistine camp
  preserved_meaning: God will strike the Philistines in their military camp.
  reasoning_layer_used: lexical decision for מַחֲנֵה פְלִשְׁתִּים
