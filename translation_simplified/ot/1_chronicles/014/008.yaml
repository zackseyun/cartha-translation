translation:
  language: en
  text: When the Philistines heard that David had been anointed king over all Israel, they all went up to search for him. David heard about this and went out to meet them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “went out against them.” The Hebrew literally says “went out before them,” which may imply a military confrontation without stating it explicitly.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: all the Philistines went up to seek David
  simplified_phrase: they all went up to search for him
  preserved_meaning: The whole Philistine group went up looking for David without specifying their intent.
  reasoning_layer_used: Lexical decisions for כָל פְּלִשְׁתִּים and לְבַקֵּשׁ אֶת דָּוִיד
  rationale: Pronouns reduce repetition, and “search for” makes “seek” immediately clear.
- pob_phrase: And David heard
  simplified_phrase: David heard about this
  preserved_meaning: David received news of the Philistines’ action.
  reasoning_layer_used: Narrative context and the lexical decision for וַיִּשְׁמַע דָּוִיד
  rationale: “About this” states the implied object in natural modern English.
- pob_phrase: went out before them
  simplified_phrase: went out to meet them
  preserved_meaning: David went out toward the approaching Philistines without making military confrontation certain.
  reasoning_layer_used: Lexical decision and POB footnote for וַיֵּצֵא לִפְנֵיהֶם
  rationale: The audited alternative is clear English, while the footnote preserves the literal image and stronger possible sense.
