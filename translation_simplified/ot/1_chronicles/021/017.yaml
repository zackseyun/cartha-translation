translation:
  language: en
  text: Then David said to God, “Was I not the one who ordered the people to be counted? I am the one who sinned and did great evil. But what have these people—your flock—done? Yahweh my God, please let your hand of judgment fall on me and on my family line. Do not strike your people with this plague.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Was it not I who ordered the people to be counted?
  simplified_phrase: Was I not the one who ordered the people to be counted?
  preserved_meaning: David emphatically accepts responsibility for ordering the census.
  reasoning_layer_used: POB lexical decisions for הֲלֹא and וַאֲנִי הוּא אֲשֶׁר
  rationale: The recast question sounds natural while preserving its rhetorical force.
- pob_phrase: But these sheep—what have they done?
  simplified_phrase: But what have these people—your flock—done?
  preserved_meaning: David portrays the people as an innocent flock under God’s care.
  reasoning_layer_used: POB lexical decision and cultural note for הַצֹּאן
  rationale: The apposition clearly identifies one group while preserving the flock image.
- pob_phrase: against me and against my father’s house
  simplified_phrase: fall on me and on my family line
  preserved_meaning: David asks that judgment reach him and his wider household rather than the people.
  reasoning_layer_used: POB lexical rationale for בִּי וּבְבֵית אָבִי
  rationale: “Family line” preserves more of the household breadth than “family.”
interpretive_expansions:
- pob_phrase: these sheep
  rendering: these people—your flock
  claim: The flock represents the people affected by the plague.
  evidence:
  - The POB cultural note explicitly identifies the sheep as a metaphor for the people.
  - The following plea calls them “your people.”
  confidence: high
  alternatives_preserved:
  - these sheep
  - this flock
- pob_phrase: your hand
  rendering: your hand of judgment
  claim: God’s hand here means his active power exercised in punishment.
  evidence:
  - The POB lexical rationale identifies the hand as an image of power in judgment.
  - The plague context makes the punitive sense clear.
  confidence: high
  alternatives_preserved:
  - your hand be against
  - your hand fall on
translation_notes:
  risk_flags:
  - risk: “Your flock” makes the people’s relationship to God explicit.
    mitigation: The verse immediately calls the same group “your people.”
  - risk: “Family line” may suggest later descendants more strongly than “father’s house.”
    mitigation: It retains the audited household and family-line range without specifying a dynasty.
