translation:
  language: en
  text: 'Go and tell David, “This is what Yahweh says: I am putting three things[a] before you. Choose one for yourself, and I will do it to you.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “Three I am stretching out upon you.” The Hebrew does not name the three things; the next verse explains them.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Go and speak to David, saying
  simplified_phrase: Go and tell David
  preserved_meaning: The command is to deliver Yahweh’s message directly to David.
  reasoning_layer_used: Lexical decisions for דבר and the quotative לֵאמֹר
  rationale: “Tell David” naturally combines the speech verb and quotation formula without losing their function.
- pob_phrase: Thus says Yahweh
  simplified_phrase: This is what Yahweh says
  preserved_meaning: The prophetic messenger formula still identifies Yahweh as the speaker.
  reasoning_layer_used: Lexical and theological decisions for כֹּה אָמַר יְהוָה
  rationale: The common formula is clearer in modern English while retaining the divine name.
- pob_phrase: I am setting three things before you
  simplified_phrase: I am putting three things before you
  preserved_meaning: Yahweh presents three unnamed choices to David without identifying them early.
  reasoning_layer_used: Lexical and theological decisions on the implicit object
  rationale: “Putting” is more familiar than “setting,” while “things” preserves the Hebrew ambiguity.
translation_notes:
  risk_flags:
  - risk: “Three things” may sound vague before the reader reaches the next verse.
    mitigation: The wording preserves the source’s deliberate lack of a noun, and the footnote explains it.
  - risk: “I will do it to you” is less idiomatic than a fuller punitive paraphrase.
    mitigation: It retains the POB wording and avoids specifying the nature of the consequence too early.
