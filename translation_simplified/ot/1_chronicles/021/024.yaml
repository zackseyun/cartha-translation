translation:
  language: en
  text: But King David said to Ornan, “No. I will certainly buy it, paying the full price in silver. I will not take what belongs to you to give to Yahweh, and I will not offer a burnt offering that costs me nothing.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: No, for I will surely buy it for the full price in silver
  simplified_phrase: No. I will certainly buy it, paying the full price in silver.
  preserved_meaning: David firmly refuses the gift and insists on paying its entire value in silver.
  reasoning_layer_used: Lexical decisions for לֹא כִּי, קָנֹה אֶקְנֶה, and בְּכֶסֶף מָלֵא.
  rationale: Two direct sentences make the refusal and emphatic commitment easier to follow.
- pob_phrase: I will not take for Yahweh what is yours
  simplified_phrase: I will not take what belongs to you to give to Yahweh
  preserved_meaning: David will not appropriate Ornan’s property for dedication to Yahweh.
  reasoning_layer_used: Lexical decisions for אֶשָּׂא, אֲשֶׁר לְךָ, and לַיהוָה, with the divine-name decision.
  rationale: Ordinary English word order clarifies both ownership and the intended recipient.
- pob_phrase: nor offer up a burnt offering for nothing
  simplified_phrase: and I will not offer a burnt offering that costs me nothing
  preserved_meaning: David refuses to present a sacrifice for which he has paid nothing.
  reasoning_layer_used: Lexical decisions for וְהַעֲלוֹת עוֹלָה and חִנָּם.
  rationale: The wording states the practical sense of “for nothing” while retaining the sacrificial term.
interpretive_expansions:
- pob_phrase: for nothing
  rendering: that costs me nothing
  claim: The lack of cost applies specifically to David as the person making the offering.
  evidence:
  - The lexical rationale says David’s point is that his worship should not cost him nothing.
  - The immediate context is David’s insistence that he personally pay the full price.
  confidence: high
  alternatives_preserved:
  - for nothing
  - without cost
translation_notes:
  risk_flags:
  - risk: “Costs me nothing” makes the personal economic implication more explicit than the compact Hebrew adverb.
    mitigation: The full-price statement and POB lexical rationale directly support this clarification.
  - risk: “Burnt offering” may be unfamiliar to new readers.
    mitigation: The established ritual term is retained so the specific kind of sacrifice is not generalized.
