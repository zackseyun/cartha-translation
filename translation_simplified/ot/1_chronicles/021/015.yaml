translation:
  language: en
  text: God sent an angel to Jerusalem to destroy the city. But while the angel was destroying it, Yahweh saw and relented concerning the disaster. He told the destroying angel, “Enough! Stop now—withdraw your hand.” The angel of Yahweh was standing beside Ornan the Jebusite’s threshing floor, the place where grain was threshed.
  philosophy: optimal-equivalence
