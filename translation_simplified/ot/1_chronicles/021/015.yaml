  preserved_meaning: The angel was sent toward Jerusalem to destroy it.
  reasoning_layer_used: Lexical decisions for לִירוּשָׁלִַם and לְהַשְׁחִיתָהּ
  rationale: Repeating “the city” makes the pronoun’s referent clear.
- pob_phrase: Enough; now withdraw your hand
  simplified_phrase: Enough! Stop now—withdraw your hand.
  preserved_meaning: Yahweh commands the angel to cease the destruction immediately.
  reasoning_layer_used: Lexical decisions for רַב and הֶרֶף יָדֶךָ
  rationale: “Stop now” explains the idiom while retaining its hand image.
- pob_phrase: the threshing floor of Ornan the Jebusite
  simplified_phrase: Ornan the Jebusite’s threshing floor, the place where grain was threshed
  preserved_meaning: The angel stood near Ornan’s agricultural threshing site.
  reasoning_layer_used: Lexical decision for גֹּרֶן and grounding review
  rationale: The apposition explains the historical term without replacing the named location or asserting Ornan was threshing then.
