translation:
  language: en
  text: David approached Ornan. Ornan looked and saw him, then left the threshing floor.[a] He bowed low before David with his face to the ground.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A threshing floor was a level place where grain was separated from the stalks and husks.
    reason: cultural_note
simplification_decisions:
- pob_phrase: When David came to Ornan
  simplified_phrase: David approached Ornan
  preserved_meaning: David came to where Ornan was.
  reasoning_layer_used: Lexical decisions for וַיָּבֹא and עַד
  rationale: “Approached” expresses the movement toward Ornan in direct modern English.
- pob_phrase: he went out from the threshing floor
  simplified_phrase: then left the threshing floor
  preserved_meaning: Ornan moved out from the agricultural work area.
  reasoning_layer_used: Lexical decision for וַיֵּצֵא מִן הַגֹּרֶן
  rationale: “Left” states the same movement more naturally, while the note explains the historical setting.
- pob_phrase: bowed down before David with his face to the ground
  simplified_phrase: bowed low before David with his face to the ground
  preserved_meaning: Ornan fully prostrated himself before David without necessarily worshiping him.
  reasoning_layer_used: Lexical and theological decisions for וַיִּשְׁתַּחוּ and אַפַּיִם אָרְצָה
  rationale: “Bowed low” is clear, and the face-to-ground image preserves the full force of the act.
