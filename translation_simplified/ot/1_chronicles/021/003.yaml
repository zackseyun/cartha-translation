translation:
  language: en
  text: But Joab said, “May Yahweh make his people a hundred times as numerous as they are now! My lord the king, are they not all your servants? Why do you want this? Why should it bring guilt on Israel?”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: add to his people a hundred times as many as they are
  simplified_phrase: make his people a hundred times as numerous as they are now
  preserved_meaning: Joab wishes that Yahweh would multiply his people to one hundred times their present number.
  reasoning_layer_used: Lexical decisions for יוֹסֵף and the comparative Hebrew idiom
  rationale: This wording clearly expresses Joab’s prayerful wish without making the total sound like a hundredfold increase plus the original number.
- pob_phrase: servants of my lord
  simplified_phrase: your servants
  preserved_meaning: All the people are already under the king’s authority.
  reasoning_layer_used: Lexical and theological decision for עֲבָדִים
  rationale: Direct address sounds natural while preserving “servants” rather than “slaves.”
- pob_phrase: Why does my lord seek this? Why should it become guilt for Israel?
  simplified_phrase: Why do you want this? Why should it bring guilt on Israel?
  preserved_meaning: Joab questions the king’s pursuit and warns that it could make Israel guilty.
  reasoning_layer_used: Lexical decisions for יְבַקֵּשׁ זֹאת and לְאַשְׁמָה
  rationale: Common English clarifies both the king’s desire and the resulting guilt without narrowing the action further.
