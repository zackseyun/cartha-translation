- pob_phrase: before your foes
  rendering: as you flee from your enemies
  claim: The phrase describes retreat or rout in the face of hostile forces.
  evidence:
  - The POB lexical rationale identifies this as an idiom for fleeing or being routed.
  - The following clause depicts enemy swords catching up in pursuit.
  confidence: high
  alternatives_preserved:
  - being routed before your enemies
