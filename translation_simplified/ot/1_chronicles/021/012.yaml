translation:
  language: en
  text: 'Either three years of famine; three months of being swept away as you flee from your enemies, while their swords catch up with you; or three days of Yahweh’s sword: plague in the land, with the angel of Yahweh bringing destruction throughout Israel. Now think carefully and tell me what answer I should take back to the one who sent me.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: being swept away before your foes while the sword of your enemies overtakes you
  simplified_phrase: being swept away as you flee from your enemies, while their swords catch up with you
  preserved_meaning: David’s forces are routed and pursued without specifying that every person is killed.
  reasoning_layer_used: POB lexical decisions for נִסְפֶּה, מִפְּנֵי צָרֶיךָ, and לְמַשֶּׂגֶת
  rationale: The wording explains the military pursuit while retaining the image of being swept away.
- pob_phrase: three days of the sword of Yahweh, even pestilence in the land
  simplified_phrase: 'three days of Yahweh’s sword: plague in the land'
  preserved_meaning: The plague is presented as Yahweh’s weapon of judgment.
  reasoning_layer_used: POB lexical decision and applied revision on the appositional relationship
  rationale: The colon makes the relationship clear, and “plague” is more familiar than “pestilence.”
- pob_phrase: Now consider what answer I should return
  simplified_phrase: Now think carefully and tell me what answer I should take back
  preserved_meaning: Gad asks David to decide what reply he should deliver to his sender.
  reasoning_layer_used: POB lexical decisions for רְאֵה and מָה אָשִׁיב דָּבָר
  rationale: The direct wording expresses the Hebrew reply idiom in ordinary English.
