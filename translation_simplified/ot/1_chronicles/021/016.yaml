  text: David looked up and saw the angel of Yahweh standing between earth and the heavens.[a] His drawn sword was in his hand, stretched out over Jerusalem. David and the elders were wearing sackcloth.[b] They fell facedown.
  philosophy: optimal-equivalence
  footnotes:
