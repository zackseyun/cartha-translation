translation:
  language: en
  text: Joab reported the census total to David. All Israel had 1,100,000 men who could draw the sword for battle, and Judah had 470,000 such men.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: gave the number of the census of the people to David
  simplified_phrase: reported the census total to David
  preserved_meaning: Joab communicated to David the total obtained by counting the people.
  reasoning_layer_used: POB lexical decision for מִסְפַּר מִפְקַד הָעָם
  rationale: The shorter wording preserves both the census and its resulting total.
- pob_phrase: All Israel was 1,100,000 men
  simplified_phrase: All Israel had 1,100,000 men
  preserved_meaning: The clause states the resulting total for Israel.
  reasoning_layer_used: POB lexical decision for וַיְהִי כָל יִשְׂרָאֵל
  rationale: Using “had” states the census result in natural modern English.
- pob_phrase: men drawing the sword ... men drawing the sword
  simplified_phrase: men who could draw the sword for battle ... such men
  preserved_meaning: Both totals count men associated with military service while retaining the sword-drawing image.
  reasoning_layer_used: POB lexical decisions for אִישׁ and שֹׁלֵף חֶרֶב, applied to both totals
  rationale: “Such men” clearly applies the same military category to Judah without cumbersome repetition.
interpretive_expansions:
- pob_phrase: men drawing the sword
  rendering: men who could draw the sword for battle
  claim: The phrase identifies men available or qualified for armed service, not men drawing swords at that moment.
  evidence:
  - The verse counts men with the same participial sword-drawing idiom in both clauses.
  - The POB rationale identifies the expression as a vivid military idiom and notes “bearing the sword” as an alternative.
  confidence: high
  alternatives_preserved:
  - men drawing the sword
  - men bearing the sword
  - men wielding the sword
translation_notes:
  risk_flags:
  - risk: Adding “could” makes military capability more explicit than the Hebrew participle alone.
    mitigation: The military census context supports the clarification, and the original sword image remains.
