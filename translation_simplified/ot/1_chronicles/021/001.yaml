translation:
  language: en
  text: Then Satan rose up to oppose Israel. He urged David to count the people of Israel.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “an adversary.” The Hebrew word translated “Satan” can also mean “adversary.”
    reason: lexical_alternative
  - marker: b
    text: In 2 Samuel 24:1, the LORD, angry with Israel, incites David; here Satan is the immediate agent.
    reason: cross_reference
simplification_decisions:
- pob_phrase: stood up against Israel
  simplified_phrase: rose up to oppose Israel
  preserved_meaning: Satan took hostile action against Israel.
  reasoning_layer_used: Lexical decisions for וַיַּעֲמֹד and עַל יִשְׂרָאֵל
  rationale: “Rose up to oppose” keeps the concrete image and makes the hostility clear.
- pob_phrase: incited David
  simplified_phrase: urged David
  preserved_meaning: Satan prompted David to act without forcing him.
  reasoning_layer_used: Lexical decision for וַיָּסֶת
  rationale: “Urged” is common English and does not imply compulsion.
- pob_phrase: count Israel
  simplified_phrase: count the people of Israel
  preserved_meaning: David was prompted to count Israel’s people.
  reasoning_layer_used: Lexical decisions for לִמְנוֹת and אֶת יִשְׂרָאֵל
  rationale: The added words clearly identify whom David was to count.
interpretive_expansions:
