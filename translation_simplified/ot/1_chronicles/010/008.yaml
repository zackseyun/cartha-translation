translation:
  language: en
  text: The next day, the Philistines came to take armor, clothing, and other valuables from those killed in battle. They found the bodies of Saul and his sons where they had fallen on Mount Gilboa.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: It happened on the next day that
  simplified_phrase: The next day
  preserved_meaning: The action took place the day after the battle.
  reasoning_layer_used: POB lexical decision and discourse-marker revision
  rationale: The shorter opening preserves the time sequence without the cumbersome narrative formula.
- pob_phrase: to strip the slain
  simplified_phrase: to take armor, clothing, and other valuables from those killed in battle
  preserved_meaning: The Philistines removed spoil from people killed in the battle.
  reasoning_layer_used: POB lexical decisions and cultural note
  rationale: The wording explains the battlefield action without limiting the spoil to armor and clothing.
- pob_phrase: they found Saul and his sons fallen
  simplified_phrase: They found the bodies of Saul and his sons where they had fallen
  preserved_meaning: Saul and his sons were dead at the place where they fell in battle.
  reasoning_layer_used: POB lexical decision for נֹפְלִים and immediate narrative context
  rationale: This states their death clearly while preserving the source image of falling in battle.
interpretive_expansions:
- pob_phrase: to strip the slain
  rendering: to take armor, clothing, and other valuables from those killed in battle
  claim: The stripping involved taking battlefield spoil, including but not limited to armor and clothing.
  evidence:
  - The POB cultural note names armor and clothing as examples of spoil.
  - The lexical rationale describes stripping garments or armor from bodies.
  - The immediate context is the aftermath of battle.
  confidence: high
  alternatives_preserved:
  - The broader sense of plundering remains in “other valuables.”
- pob_phrase: Saul and his sons fallen
  rendering: the bodies of Saul and his sons where they had fallen
  claim: Saul and his sons were dead where they had fallen in battle.
  evidence:
  - The POB rationale says the battle idiom denotes those struck down.
  - The POB lists “lying dead” as a lexical alternative.
  - The surrounding account concerns the battle dead.
  confidence: high
  alternatives_preserved:
  - The concrete image of their having fallen is retained.
