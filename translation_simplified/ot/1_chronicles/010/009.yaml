translation:
  language: en
  text: They stripped him, then took his head and weapons. They sent the news throughout Philistine territory, announcing it to their idols[a] and to the people.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “images.” The Hebrew term refers here to the Philistines’ idol-images.
