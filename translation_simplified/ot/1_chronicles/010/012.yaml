translation:
  language: en
  text: Then all the brave warriors arose. They carried away Saul’s body and the bodies of his sons and brought them to Jabesh.[a] They buried their bones under the oak[b] in Jabesh, and they fasted for seven days.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The full name of this place is Jabesh-gilead; this verse shortens it to “Jabesh.”
    reason: cross_reference
  - marker: b
    text: The Hebrew word may refer to an oak or a terebinth, both large trees.
    reason: lexical_alternative
