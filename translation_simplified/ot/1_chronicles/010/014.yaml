translation:
  language: en
  text: Saul did not seek Yahweh. So Yahweh put him to death and handed the kingdom over to David son of Jesse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “handed the kingship over.”
