translation:
  language: en
  text: Then Yahweh’s anger blazed against Uzza. He struck Uzza down because Uzza had reached out his hand to the ark. Uzza died there in the presence of God.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Yahweh’s anger burned against Uzza
  simplified_phrase: Yahweh’s anger blazed against Uzza
  preserved_meaning: Yahweh’s anger was kindled against Uzza, with the Hebrew fire image retained.
  reasoning_layer_used: lexical decision for וַיִּחַר אַף יְהוָה
  rationale: “Blazed” keeps the force of burning anger in concise modern English.
- pob_phrase: he had put out his hand to the ark
  simplified_phrase: Uzza had reached out his hand to the ark
  preserved_meaning: Uzza physically extended his hand to the ark without assigning a motive.
  reasoning_layer_used: lexical decision and POB footnote for שָׁלַח יָדוֹ עַל הָאָרוֹן
  rationale: “Reached out his hand” is clearer while remaining within POB’s documented alternative.
- pob_phrase: and he died there before God
  simplified_phrase: Uzza died there in the presence of God
  preserved_meaning: Uzza died there before God, while the source’s distinct titles Yahweh and God remain.
  reasoning_layer_used: lexical and theological decisions for לִפְנֵי אֱלֹהִים
  rationale: “In the presence of God” makes the solemn phrase immediately understandable.
