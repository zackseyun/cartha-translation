translation:
  language: en
  text: 'David spoke to all the Israelites gathered there: “If you agree, and if Yahweh our God approves, let us send word throughout every region of Israel to our fellow Israelites who remain there. Let us also send word to the priests and Levites living among them in towns with pasturelands, so that they may gather with us.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: all the assembly of Israel
  simplified_phrase: all the Israelites gathered there
  preserved_meaning: David addresses the gathered national body of Israel.
  reasoning_layer_used: POB lexical decision for קְהַל
  rationale: This expresses the concrete gathering without the less familiar noun “assembly.”
- pob_phrase: our brothers who remain in all the lands of Israel
  simplified_phrase: our fellow Israelites who remain there ... throughout every region of Israel
  preserved_meaning: The representative term “brothers” refers to Israelites across Israel’s territories.
  reasoning_layer_used: POB footnotes b–c and lexical decisions
  rationale: “Fellow Israelites” prevents a literal-family misunderstanding while “every region” preserves the plural territorial breadth.
- pob_phrase: the cities of their pasturelands
  simplified_phrase: towns with pasturelands
  preserved_meaning: The priests and Levites lived in towns to which surrounding grazing land belonged.
  reasoning_layer_used: POB cultural note d and lexical decision for מִגְרְשֵׁיהֶם
  rationale: The shorter wording makes the ancient land arrangement understandable without removing the pastureland detail.
interpretive_expansions:
- pob_phrase: if it is from Yahweh our God
  rendering: if Yahweh our God approves
  claim: David makes the plan conditional on divine sanction as well as the people’s agreement.
  evidence:
  - The POB rationale says the phrase coordinates popular approval with divine sanction.
  - The immediate clause presents two conditions before David proposes sending word.
  confidence: high
  alternatives_preserved:
  - if this is from Yahweh our God
translation_notes:
  risk_flags:
  - risk: “Approves” states the sense of divine sanction more directly than the source idiom.
    mitigation: The conditional “if” is retained, so David does not claim certainty about Yahweh’s approval.
