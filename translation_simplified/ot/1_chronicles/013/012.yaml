translation:
  language: en
  text: That day David feared God. He asked, “How can I bring the ark of God to me?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “was afraid of God”; here it describes fear in response to God’s judgment, while still allowing a sense of reverential dread.
    reason: lexical_alternative
