translation:
  language: en
  text: David and all Israel went up to Baalah, also called Kiriath-jearim, which belongs to Judah. They went there to bring up the ark of God. The ark bears the name of Yahweh, who is enthroned above the cherubim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is compressed and may also mean “the ark that is called by the Name” or “where the Name is invoked.” Compare 2 Samuel 6:2.
    reason: alternative_reading
