translation:
  language: en
  text: 'They found that Eleazar’s descendants had more family leaders[a] than Ithamar’s descendants. So they organized them into divisions: sixteen family heads from Eleazar’s descendants and eight from Ithamar’s descendants.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also describe these leaders as prominent or valiant men, but the context concerns heads of priestly families.
    reason: lexical_alternative
