translation:
  language: en
  text: Shemaiah son of Nethanel, a Levite and scribe, recorded these divisions in the presence of the king and the officials. Also present were Zadok the priest, Ahimelech son of Abiathar, and the leaders of the priestly and Levitical family groups. The priestly family groups were selected in turn, one from Eleazar’s line and one from Ithamar’s line.
