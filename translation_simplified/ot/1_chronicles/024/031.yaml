translation:
  language: en
  text: These Levites also cast lots alongside their relatives, the descendants of Aaron.[a] They did this in the presence of King David, Zadok, Ahimelech, and the leaders of the priestly and Levitical family groups. The leading family branches and the junior family branches were treated alike.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “corresponding to” or “opposite” their relatives.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew uses singular forms, likely referring collectively to the leading and junior family branches.
    reason: lexical_alternative
