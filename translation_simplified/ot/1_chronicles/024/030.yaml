  preserved_meaning: Mushi is named as the father of the three men in the genealogy.
  reasoning_layer_used: POB lexical decision for וּבְנֵי
  rationale: The possessive form states the same family relationship in ordinary English.
- pob_phrase: the sons of the Levites
  simplified_phrase: Levite descendants
  preserved_meaning: The men belonged to the genealogical line and tribe of Levi.
  reasoning_layer_used: POB lexical decision for בְּנֵי הַלְוִיִּם
  rationale: “Descendants” makes the genealogical idiom clear without changing the tribal reference.
- pob_phrase: according to their fathers’ houses
  simplified_phrase: listed by their ancestral families
  preserved_meaning: The genealogy organizes them by paternal households or clans.
  reasoning_layer_used: POB lexical decision for לְבֵית אֲבֹתֵיהֶם
  rationale: This replaces an unfamiliar biblical idiom with its stated genealogical sense.
