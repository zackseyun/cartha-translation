translation:
  language: en
  text: These were their assigned duties for serving in the house of Yahweh. They were to enter according to their prescribed order,[a] under the authority of their ancestor Aaron,[b] just as Yahweh, the God of Israel, had commanded him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “according to their prescribed rules or procedure.”
    reason: lexical_alternative
  - marker: b
    text: Literally “under the hand of Aaron,” an expression for his authority or administration.
    reason: simplification_note
