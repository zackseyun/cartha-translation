translation:
  language: en
  text: In Hananiah’s family line were Pelatiah and Jeshaiah. The genealogy also lists the sons of Rephaiah, Arnan, Obadiah, and Shecaniah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew wording is compressed and difficult. It begins literally with “the son of Hananiah,” though two names follow. The later groups may refer more broadly to descendants rather than immediate sons.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: 'And the sons of Hananiah: Pelatiah and Jeshaiah'
  simplified_phrase: In Hananiah’s family line were Pelatiah and Jeshaiah.
  preserved_meaning: Both names remain connected with Hananiah without asserting that both were certainly his immediate sons.
  reasoning_layer_used: POB lexical decision for singular וּבֶן and POB alternative-reading footnote
  rationale: “Family line” keeps the genealogical connection while preserving the difficult syntax.
- pob_phrase: the sons of Rephaiah, the sons of Arnan, the sons of Obadiah, the sons of Shecaniah
  simplified_phrase: The genealogy also lists the sons of Rephaiah, Arnan, Obadiah, and Shecaniah.
  preserved_meaning: The four genealogical groups remain distinct, ordered, and described as sons without defining their links to one another.
  reasoning_layer_used: POB translation and lexical decision for repeated בְּנֵי
  rationale: A list sentence clarifies the structure without inventing disputed relationships.
translation_notes:
