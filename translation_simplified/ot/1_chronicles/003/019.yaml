translation:
  language: en
  text: Pedaiah’s sons were Zerubbabel and Shimei. Zerubbabel’s sons were Meshullam and Hananiah.[a] Their sister was Shelomith.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew text says “son of Zerubbabel” in the singular, though two sons are named here. This may be a textual irregularity or a genealogical use of the singular for more than one person.
