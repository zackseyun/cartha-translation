translation:
  language: en
  text: When the people of Aram[a] saw that Israel had defeated them, they sent messengers and summoned Aramean forces from beyond the River.[b] Shophach, the commander of Hadadezer’s army, led them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aram is the Hebrew name traditionally rendered “Syria.”
    reason: lexical_alternative
  - marker: b
    text: “The River” probably refers to the Euphrates, but the Hebrew does not name it.
    reason: lexical_alternative
