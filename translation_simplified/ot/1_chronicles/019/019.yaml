translation:
  language: en
  text: When Hadadezer’s servants saw that Israel had defeated them, they made peace with David and became subject to him. After that, Aram was no longer willing to help the Ammonites.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: had been defeated before Israel
  simplified_phrase: Israel had defeated them
  preserved_meaning: Hadadezer’s forces suffered military defeat at Israel’s hands.
  reasoning_layer_used: Lexical decision for נִגְּפוּ and לִפְנֵי יִשְׂרָאֵל
  rationale: The active wording makes the Hebrew defeat idiom immediately clear.
- pob_phrase: served him
  simplified_phrase: became subject to him
  preserved_meaning: Their peace with David included political subjection to him.
  reasoning_layer_used: Lexical decision for וַיַּעַבְדֻהוּ
  rationale: This avoids suggesting ordinary personal service while preserving political submission.
- pob_phrase: the sons of Ammon
  simplified_phrase: the Ammonites
  preserved_meaning: The phrase names the people descended from or belonging to Ammon.
  reasoning_layer_used: Lexical decision for בְּנֵי עַמּוֹן and POB footnote a
  rationale: The standard English ethnic name is clearer to modern readers.
