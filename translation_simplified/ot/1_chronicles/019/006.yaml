translation:
  language: en
  text: The Ammonites realized that they had made themselves detestable to David.[a] So Hanun and the Ammonites sent 1,000 talents of silver[c] to hire chariots and horsemen for themselves from Aram-naharaim,[b] Aram-maacah, and Zobah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says that they “had made themselves stink” to David, meaning that they had become offensive or detestable to him.
    reason: lexical_alternative
  - marker: b
    text: Aram-naharaim is traditionally understood as “Aram of the Two Rivers,” that is, Mesopotamia.
    reason: cultural_note
  - marker: c
    text: A talent was a large unit of weight, so 1,000 talents of silver was an enormous payment.
    reason: cultural_note
