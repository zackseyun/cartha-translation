  text: They went and reported to David what had happened to the men. Because the men were deeply humiliated, David sent people to meet them.[a] The king said, “Stay in Jericho until your beards grow back. Then return.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew does not say whom David sent; messengers or other representatives are implied.
    reason: source_note
