translation:
  language: en
  text: When David received the report, he called together all Israel and crossed the Jordan. He advanced against them and arranged his troops in battle formation. Then David formed his battle line to meet Aram, and Aram’s forces fought against him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “fought with him,” but here it means that Aram’s forces fought against David.
    reason: lexical_alternative
