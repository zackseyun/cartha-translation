  text: The army of Aram fled from the Israelite army.[a] David killed 7,000 of Aram’s chariot warriors and 40,000 foot soldiers. He also put Shophach, the army commander, to death.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The parallel passage in 2 Samuel 10:18 has “700 chariots and 40,000 horsemen.” Chronicles here has “7,000 chariot warriors and 40,000 foot soldiers.”
    reason: textual_variant
  - marker: b
    text: Shophach is called Shobach in the parallel account in 2 Samuel 10:16, 18.
    reason: alternative_reading
