translation:
  language: en
  text: All these men were descendants of Asher. They were leaders of their ancestral families, select men, mighty warriors, and chief leaders. They were enrolled for wartime army service.[a] They numbered 26,000 men.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “registered by genealogy for wartime army service.” The Hebrew verb often refers to genealogical registration in Chronicles.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: sons of Asher
  simplified_phrase: descendants of Asher
  preserved_meaning: The men belonged to Asher’s tribal line rather than all being his immediate sons.
  reasoning_layer_used: genealogical context
  rationale: “Descendants” makes the genealogical sense clear to modern readers.
- pob_phrase: heads of their fathers’ houses
  simplified_phrase: leaders of their ancestral families
  preserved_meaning: They headed the clans or households descended through their fathers.
  reasoning_layer_used: lexical decision for רָאשֵׁי בֵית הָאָבוֹת
  rationale: This replaces an opaque Hebrew social idiom with its clear meaning.
- pob_phrase: they were enrolled for service in the army for war. Their number in men was twenty-six thousand
  simplified_phrase: They were enrolled for wartime army service. They numbered 26,000 men.
  preserved_meaning: They were registered for military service, and the total was 26,000 men.
  reasoning_layer_used: lexical decisions for וְהִתְיַחְשָׂם, בַּצָּבָא, בַּמִּלְחָמָה, and מִסְפָּרָם אֲנָשִׁים
  rationale: Natural English removes repetition and the awkward counting formula without changing the military sense.
