  text: Along the borders of Manasseh’s territory were Beth-shean, Taanach, Megiddo, and Dor, together with the dependent towns around each of them.[a] The descendants of Joseph son of Israel lived in these places.
  philosophy: optimal-equivalence
  footnotes:
