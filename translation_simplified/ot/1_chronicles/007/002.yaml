translation:
  language: en
  text: Tola’s sons were Uzzi, Rephaiah, Jeriel, Jahmai, Ibsam, and Samuel. They were leaders of the ancestral families in Tola’s line and mighty warriors, listed by family line. In David’s time, the total number in these family lines was 22,600.
