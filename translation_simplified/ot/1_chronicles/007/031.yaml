  text: Beriah’s sons were Heber and Malchiel. Malchiel was the father[a] of Birzaith.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “father” may mean an ancestor or the founder of a clan or settlement, not necessarily an immediate biological father.
    reason: lexical_alternative
  - marker: b
    text: The name Birzaith may also be written Birzoth or Berazoth.
    reason: alternative_reading
