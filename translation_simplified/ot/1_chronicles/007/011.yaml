translation:
  language: en
  text: All these were sons of Jediael,[a] listed by their family heads. They numbered 17,200 mighty warriors, fit for military service in war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sons” may also mean “descendants” in this genealogy.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: according to the heads of the fathers’ houses
  simplified_phrase: listed by their family heads
  preserved_meaning: The men are counted according to their ancestral family leaders.
  reasoning_layer_used: lexical decision, cultural note, and grounding review
  rationale: This conveys genealogical classification without suggesting an administrative chain of command.
- pob_phrase: mighty men of valor
  simplified_phrase: mighty warriors
  preserved_meaning: They were strong, capable fighting men.
  reasoning_layer_used: lexical decision
  rationale: The modern military term preserves both strength and fighting ability.
- pob_phrase: seventeen thousand two hundred, able to go out in the army for war
  simplified_phrase: They numbered 17,200 ... fit for military service in war
  preserved_meaning: The census counted 17,200 men eligible for wartime military duty.
  reasoning_layer_used: lexical decisions and latest revision pass
  rationale: A separate sentence and numerals make the total and military eligibility easy to grasp.
translation_notes:
  risk_flags:
