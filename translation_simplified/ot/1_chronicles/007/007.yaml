translation:
  language: en
  text: Bela’s sons were Ezbon, Uzzi, Uzziel, Jerimoth, and Iri. Each of these five was the head of an ancestral family and a mighty warrior. Their genealogical records listed a total of 22,034.
  philosophy: optimal-equivalence
