  preserved_meaning: All five men led clan-based family groups, while the leadership image of “head” remains.
  reasoning_layer_used: POB lexical decision for רָאשֵׁי בֵּית אָבוֹת
  rationale: “Ancestral family” makes the social unit clearer than “fathers’ house.”
- pob_phrase: mighty men of valor
  simplified_phrase: mighty warrior
  preserved_meaning: Each man was recognized as a capable fighting man of proven strength.
  reasoning_layer_used: POB lexical decision for גִּבּוֹרֵי חֲיָלִים
  rationale: “Mighty warrior” is the POB-approved plain-English alternative.
- pob_phrase: their genealogical enrollment was twenty-two thousand and thirty-four
  simplified_phrase: Their genealogical records listed a total of 22,034
  preserved_meaning: The number comes from their registration in genealogical records.
  reasoning_layer_used: POB lexical decisions for וְהִתְיַחְשָׂם and the following number
  rationale: The active wording explains the technical enrollment phrase more naturally.
