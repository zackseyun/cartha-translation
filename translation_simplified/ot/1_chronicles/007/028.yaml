translation:
  language: en
  text: Their land and settlements included Bethel and the smaller towns belonging to it, Naaran[a] to the east, Gezer and its smaller towns to the west, and Shechem and its smaller towns, as far as Ayyah[b] and its smaller towns.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some render Naaran as “Naarah,” based on a related place-name tradition elsewhere.
    reason: alternative_reading
  - marker: b
    text: The Hebrew text reads “Ayyah”; some ancient witnesses and translations have “Gaza.”
    reason: textual_variant
  - marker: c
    text: Hebrew literally calls these “daughter towns,” meaning smaller towns or villages belonging to a larger city.
    reason: cultural_note
