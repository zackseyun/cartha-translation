translation:
  language: en
  text: 'Look: a son will be born to you. His life will be marked by rest, and I will give him rest from every enemy around him. His name will be Solomon,[a] and during his lifetime I will give Israel peace and quiet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In Hebrew, the name Solomon is connected with the word for peace. This verse also emphasizes the rest God will give him.
    reason: cultural_note
