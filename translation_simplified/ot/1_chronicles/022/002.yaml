translation:
  language: en
  text: David ordered that the foreigners living in the land of Israel be brought together. He assigned stonecutters to shape stones for building the house of God.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The house of God refers to the temple David was preparing for Solomon to build.
