translation:
  language: en
  text: Look, in my hardship,[a] I have prepared for Yahweh’s house—the temple—gold weighing 100,000 large units and silver weighing one million large units.[b] I have also prepared more bronze and iron than could be weighed, along with timber and stones. You may add to them.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in my poverty.” The Hebrew can refer to affliction, hardship, or poverty.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew unit is the talent, a large unit of weight.
    reason: cultural_note
  - marker: c
    text: Or “You shall add to them.”
    reason: lexical_alternative
