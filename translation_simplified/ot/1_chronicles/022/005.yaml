translation:
  language: en
  text: David said, “My son Solomon is young and inexperienced. The house[a] to be built for Yahweh must be extraordinarily great—famous and splendid in every land. I will prepare for it now.” So before he died, David made extensive preparations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “house” is the temple, Yahweh’s sanctuary.
    reason: simplification_note
