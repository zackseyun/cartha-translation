translation:
  language: en
  text: Yahweh your God is with you, is he not? Has he not given you rest from enemies on every side? For he has handed the people living in the land over to my power, and the land has been brought under control before Yahweh and before his people.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “His people” most likely means Yahweh’s people, though it could mean David’s people.
    reason: alternative_reading
