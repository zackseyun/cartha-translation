  simplified_phrase: Has he not given you rest from enemies on every side?
  preserved_meaning: Yahweh has granted relief from surrounding enemies.
  reasoning_layer_used: Lexical decision for וְהֵנִיחַ לָכֶם מִסָּבִיב
  rationale: The added words identify the kind of rest intended in this conquest setting.
- pob_phrase: the inhabitants of the land into my hand
  simplified_phrase: the people living in the land over to my power
  preserved_meaning: God placed the land’s inhabitants under David’s control.
  reasoning_layer_used: Lexical decisions for נָתַן בְּיָדִי and יֹשְׁבֵי הָאָרֶץ
  rationale: Common wording explains the hand idiom while preserving the force of transfer.
- pob_phrase: the land has been subdued
