translation:
  language: en
  text: Now commit your heart and soul to seeking Yahweh your God. Rise up and build the sanctuary of Yahweh God, so that the ark of Yahweh’s covenant and the sacred objects used in God’s worship may be brought into the temple that will be built for Yahweh’s name.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: set your heart and your soul to seek
  simplified_phrase: commit your heart and soul to seeking
  preserved_meaning: Both inner faculties remain explicit, emphasizing deliberate and wholehearted devotion.
  reasoning_layer_used: POB lexical and theological decisions on the anthropological pair
  rationale: “Commit” expresses deliberate resolve naturally for modern readers.
- pob_phrase: the holy vessels of God
  simplified_phrase: the sacred objects used in God’s worship
  preserved_meaning: These are holy articles associated with the worship of God.
  reasoning_layer_used: POB lexical decision for וּכְלֵי קֹדֶשׁ הָאֱלֹהִים
  rationale: “Sacred objects” avoids suggesting that all the items were containers.
- pob_phrase: into the house that is to be built
  simplified_phrase: into the temple that will be built
  preserved_meaning: The house is the planned temple building.
  reasoning_layer_used: POB cultural note and lexical decision for לַבַּיִת
  rationale: “Temple” makes the historical meaning immediately clear.
interpretive_expansions:
- pob_phrase: the holy vessels of God
  rendering: the sacred objects used in God’s worship
  claim: The holy items are articles associated with worship, not merely containers.
  evidence:
  - The POB lexical rationale describes them as objects or utensils used in worship.
  confidence: high
  alternatives_preserved:
  - God’s holy articles
  - the holy furnishings of God
