translation:
  language: en
  text: Gershom’s descendants[a] were given thirteen cities, assigned to them by clan. The cities came from the tribes of Issachar, Asher, and Naphtali, and from Manasseh in Bashan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew spells the clan name here as “Gershom”; many English versions use “Gershon.”
    reason: alternative_reading
  - marker: b
    text: Some translations say “the half-tribe of Manasseh in Bashan,” but “half-tribe” is not stated in the Hebrew here.
    reason: lexical_alternative
