translation:
  language: en
  text: The remaining sons of Kohath[a] received ten cities from the families of the half-tribe of Manasseh.[b] The cities were assigned by casting lots.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “sons of Kohath” refers to his descendants as a group.
    reason: simplification_note
  - marker: b
    text: 'The Hebrew uses a repetitive formula: “from the families of the tribe, from the half-tribe, the half of Manasseh.”'
    reason: source_note
simplification_decisions:
- pob_phrase: the sons of Kohath who remained
  simplified_phrase: the remaining sons of Kohath
  preserved_meaning: This identifies the Kohathite descendants left after the earlier distributions.
  reasoning_layer_used: POB lexical decision for הַנּוֹתָרִים and applied revision
  rationale: The shorter wording preserves both the remainder and the genealogical expression.
- pob_phrase: from the families of the tribe, from the half-tribe, the half of Manasseh
  simplified_phrase: from the families of the half-tribe of Manasseh
  preserved_meaning: The cities came from the portion belonging to Manasseh’s half-tribe.
  reasoning_layer_used: POB lexical decision and footnote for the tribal formula
  rationale: The main text states the formula’s referent clearly while a footnote preserves its repetition.
- pob_phrase: ten cities were given by lot
  simplified_phrase: received ten cities ... The cities were assigned by casting lots
  preserved_meaning: Ten cities were allocated to the Kohathites through the lot procedure.
  reasoning_layer_used: POB lexical decisions for עָרִים עָשֶׂר and בַּגּוֹרָל
  rationale: Two direct clauses clarify the recipient and retain the concrete action of casting lots.
