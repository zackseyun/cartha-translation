translation:
  language: en
  text: After Baal-hanan died, Hadad became king in his place. His city was called Pai,[a] and his wife was Mehetabel, daughter of Matred, daughter of Mezahab.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Genesis 36:39 calls the city “Pau,” while Chronicles reads “Pai.”
    reason: textual_variant
  - marker: b
    text: The second “daughter of” may mean “granddaughter of” in this genealogy, but the Hebrew wording is kept in the text.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Baal-hanan died, and Hadad reigned in his place.
  simplified_phrase: After Baal-hanan died, Hadad became king in his place.
  preserved_meaning: Hadad succeeded Baal-hanan as king after his death.
  reasoning_layer_used: Lexical decision for וַיִּמְלֹךְ תַּחְתָּיו
  rationale: “Became king” makes the royal succession immediately clear.
- pob_phrase: The name of his city was Pai
  simplified_phrase: His city was called Pai
  preserved_meaning: Pai was the name of Hadad’s city.
  reasoning_layer_used: Lexical decisions for וְשֵׁם עִירוֹ and פָּעִי
  rationale: The shorter naming formula is natural English and retains the Chronicles form “Pai.”
- pob_phrase: the name of his wife was Mehetabel
