translation:
  language: en
  text: Two sons were born to Eber. One was named Peleg,[a] because the earth was divided during his lifetime. His brother was named Joktan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the land was divided.” The Hebrew does not say what kind of division took place.
    reason: lexical_alternative
