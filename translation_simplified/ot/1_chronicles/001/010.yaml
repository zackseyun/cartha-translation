simplification_decisions:
- pob_phrase: And Cush fathered Nimrod
  simplified_phrase: Cush was the father of Nimrod
  preserved_meaning: Cush directly fathered Nimrod in the genealogy.
  reasoning_layer_used: POB lexical decision for יָלַד
  rationale: This wording is more familiar to common readers than using “fathered” as a verb.
- pob_phrase: he began to be a mighty one
  simplified_phrase: Nimrod began to be a mighty man
  preserved_meaning: Nimrod began to possess notable might without specifying that he was a warrior or ruler.
  reasoning_layer_used: POB lexical decisions for הוּא, הֵחֵל, לִהְיוֹת, and גִּבּוֹר
  rationale: Repeating Nimrod’s name clarifies the subject while “mighty man” keeps the broad characterization.
