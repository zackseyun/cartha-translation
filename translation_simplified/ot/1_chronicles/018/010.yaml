translation:
  language: en
  text: So he sent his son Hadoram to King David to see how David was doing and to bless him.[a] He did this because David had fought Hadadezer and defeated him, since Hadadezer had been at war with Tou. He also sent all kinds of objects made of gold, silver, and bronze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In this diplomatic setting, “bless him” can also mean “congratulate him.”
    reason: lexical_alternative
