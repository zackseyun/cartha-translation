  reasoning_layer_used: POB lexical decision for לִשְׁאוֹל לוֹ לְשָׁלוֹם
  rationale: The common wording makes the Hebrew well-being idiom immediately clear.
- pob_phrase: because he had fought against Hadadezer and struck him down
  simplified_phrase: because David had fought Hadadezer and defeated him
