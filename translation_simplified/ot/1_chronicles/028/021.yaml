translation:
  language: en
  text: Look, the organized groups of priests and Levites are ready to perform every kind of service in the house of God. Every willing man[a] with practical wisdom and skill for every kind of task will work beside you. The officials and all the people will also be ready to carry out everything you direct.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “every volunteer with wisdom and skill.”
    reason: lexical_alternative
