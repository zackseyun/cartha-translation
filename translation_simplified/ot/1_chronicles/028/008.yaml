translation:
  language: en
  text: Now, in the presence of all Israel, the assembly of Yahweh, and with our God listening, obey every commandment of Yahweh your God and devote yourselves to them. Do this so that you may possess[a] the good land and pass it on to your sons after you as an inheritance forever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “inherit.” The Hebrew verb can mean either possessing or inheriting the land in this context.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: in the sight of all Israel ... and in the hearing of our God
  simplified_phrase: in the presence of all Israel ... and with our God listening
  preserved_meaning: The command is given publicly before Israel and under God’s attentive witness.
  reasoning_layer_used: POB lexical decisions for לְעֵינֵי and וּבְאָזְנֵי אֱלֹהֵינוּ
  rationale: The wording keeps the witness setting while making the paired idioms easier to follow.
- pob_phrase: keep and seek all the commandments
  simplified_phrase: obey every commandment ... and devote yourselves to them
  preserved_meaning: Israel must both follow Yahweh’s commands and pursue them with covenant loyalty.
  reasoning_layer_used: POB lexical decisions for שִׁמְרוּ, וְדִרְשׁוּ, and כָּל מִצְוֺת
  rationale: The two distinct duties remain clear without relying on the opaque phrase “seek commandments.”
- pob_phrase: leave it as an inheritance to your sons after you forever
  simplified_phrase: pass it on to your sons after you as an inheritance forever
  preserved_meaning: The land is to remain an enduring inheritance for their male descendants.
  reasoning_layer_used: POB lexical and theological decisions for וְהִנְחַלְתֶּם, לִבְנֵיכֶם, and עַד עוֹלָם
  rationale: “Pass it on” expresses the causative inheritance idea in ordinary English while retaining “sons.”
interpretive_expansions:
- pob_phrase: seek all the commandments
  rendering: devote yourselves to them
  claim: Seeking the commandments means committed pursuit, not merely intellectual investigation.
  evidence:
  - The POB lexical rationale identifies a volitional covenantal sense for דרשׁ.
  - The paired command “obey” supports active commitment to Yahweh’s commandments.
  confidence: high
  alternatives_preserved:
  - seek them
  - pursue them
