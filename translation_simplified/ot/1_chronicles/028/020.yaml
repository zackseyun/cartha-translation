translation:
  language: en
  text: David said to his son Solomon, “Be strong and courageous, and carry out the work. Do not be afraid or discouraged, because Yahweh God, my God, is with you. He will not fail you[a] or abandon you until all the work for Yahweh’s temple service is finished.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “let go of you”; the Hebrew verb can describe support that does not weaken or release its hold.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and do it
  simplified_phrase: and carry out the work
  preserved_meaning: Solomon must act and proceed with the temple task.
  reasoning_layer_used: POB lexical rationale and immediate context
  rationale: The clearer wording identifies the action already supplied by the context.
- pob_phrase: Do not fear or be dismayed
  simplified_phrase: Do not be afraid or discouraged
  preserved_meaning: Solomon must not give way to fear or lose his resolve.
  reasoning_layer_used: POB lexical decisions for ירא and חתת
  rationale: Common wording preserves both fear and collapse of courage.
- pob_phrase: all the work for the service of the house of Yahweh
  simplified_phrase: all the work for Yahweh’s temple service
  preserved_meaning: The task includes all work connected with and enabling the temple’s service.
  reasoning_layer_used: POB construct-chain rationale and immediate context
  rationale: This keeps the work distinct from the temple service it supports while making “house” clear as the temple.
interpretive_expansions:
- pob_phrase: and do it
  rendering: and carry out the work
  claim: The commanded action is the temple work entrusted to Solomon.
  evidence:
  - The POB lexical rationale identifies the contextual action as Solomon’s temple work.
  - The final clause names the work connected with Yahweh’s temple service.
  confidence: high
  alternatives_preserved:
  - and do it
  - and act
translation_notes:
  risk_flags:
  - risk: “Until” could imply that God would abandon Solomon after the work ended.
    mitigation: The wording preserves the stated endpoint without making any claim about what follows.
  - risk: “Temple” replaces the Hebrew image “house of Yahweh.”
    mitigation: The rendering preserves the established sanctuary referent and Yahweh’s personal name.
