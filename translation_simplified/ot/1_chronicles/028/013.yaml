  text: for the organized groups of priests and Levites, for all the work of serving in Yahweh’s house, and for all the objects used in that service.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the divisions of the priests and the Levites
  simplified_phrase: the organized groups of priests and Levites
  preserved_meaning: The priests and Levites were arranged into assigned service groups.
  reasoning_layer_used: POB lexical decision for מַחְלְקוֹת
  rationale: “Organized groups” makes the administrative sense clear without the opaque traditional term “courses.”
- pob_phrase: all the work of the service of the house of Yahweh
  simplified_phrase: all the work of serving in Yahweh’s house
  preserved_meaning: The phrase includes every assigned task connected with service at Yahweh’s house.
  reasoning_layer_used: POB lexical decisions for מְלֶאכֶת, עֲבוֹדַת, and בֵּית יְהוָה
  rationale: The verbal wording removes a dense chain of nouns while retaining both work and sacred service.
- pob_phrase: all the vessels of service of the house of Yahweh
  simplified_phrase: all the objects used in that service
  preserved_meaning: The reference covers the various objects used for service in Yahweh’s house.
  reasoning_layer_used: POB lexical decision for כְּלֵי and immediate repeated context
  rationale: “Objects” is clearer than “vessels” and remains broad enough to include more than containers.
translation_notes:
  risk_flags:
  - risk: “Objects” may sound less sacred or technical than “vessels.”
    mitigation: The phrase “used in that service” preserves their dedicated temple function.
