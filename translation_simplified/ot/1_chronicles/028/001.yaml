translation:
  language: en
  text: David gathered all Israel’s leaders in Jerusalem. They included the tribal leaders; the leaders of the divisions that served the king; the commanders of thousands and hundreds; those in charge of all the property and livestock belonging to the king and his sons; the court officials[a]; the mighty men; and every valiant warrior.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term may also mean “eunuchs.”
    reason: lexical_alternative
