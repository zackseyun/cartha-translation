translation:
  language: en
  text: 'David also gave Solomon the complete plan he had in the Spirit[a]: the courtyards of the house of the LORD, all the rooms around it, the storage rooms of the house of God, and the storage rooms for the sacred items.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the complete plan he had in his own spirit,” meaning in his own mind or heart.
    reason: alternative_reading
