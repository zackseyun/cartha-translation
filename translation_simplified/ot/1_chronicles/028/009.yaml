  preserved_meaning: Abandoning covenant loyalty to God brings his lasting rejection.
  reasoning_layer_used: Lexical decisions for תַּעַזְבֶנּוּ and יַזְנִיחֲךָ לָעַד
  rationale: The common verbs preserve the warning’s full severity without archaic wording.
