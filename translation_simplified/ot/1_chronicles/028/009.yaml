translation:
  language: en
  text: Solomon, my son, know the God of your father. Serve him with an undivided heart and a willing soul. Yahweh examines every heart and understands the motive behind every thought. If you seek him, he will let you find him.[a] But if you abandon him, he will reject you forever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “he will be found by you.” The Hebrew form can have a passive or reflexive sense.
    reason: lexical_alternative
