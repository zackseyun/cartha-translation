translation:
  language: en
  text: Then King David stood up and said, “Listen to me, my brothers[a] and my people. I intended to build a resting place for the ark of Yahweh’s covenant—the footstool of our God.[b] I made preparations to build it.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “my kinsmen”; the Hebrew says “my brothers,” a masculine plural form used in this public address.
    reason: lexical_alternative
  - marker: b
    text: The ark is pictured as the footstool associated with God’s presence; compare Psalm 132:7.
    reason: cross_reference
