translation:
  language: en
  text: David brought the people out of the city and made them work[a] with saws, iron tools, and axes.[b] He did the same in every Ammonite city. Then David and all the people returned to Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Another possible reading is that David killed them with saws, iron threshing-sledges, and cutting tools; this interpretation is often linked to 2 Samuel 12:31.
    reason: alternative_reading
  - marker: b
    text: The exact kinds of iron tools named in the Hebrew are uncertain.
    reason: lexical_alternative
