translation:
  language: en
  text: At the turn of the year,[a] when kings usually went out on military campaigns, Joab led the army into the land of the Ammonites and devastated it. He then laid siege to Rabbah. David, however, stayed in Jerusalem. Joab attacked Rabbah and tore it down.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This time of year is often understood as spring; the Hebrew literally says “at the turning of the year.”
    reason: lexical_alternative
