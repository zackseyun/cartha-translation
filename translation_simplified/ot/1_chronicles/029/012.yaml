translation:
  language: en
  text: Wealth and honor both come from your presence,[a] and you rule over everything. Power and might are in your hand. In your hand is the power to make all great and strengthen all.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says “from before you”; it may also be translated “from you.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Both riches and honor come from before you
  simplified_phrase: Wealth and honor both come from your presence
  preserved_meaning: Material abundance and honor proceed from God's presence.
  reasoning_layer_used: Lexical and theological decisions for מִלְּפָנֶיךָ
  rationale: “Your presence” makes the Hebrew image understandable without reducing it to merely “from you.”
- pob_phrase: you rule over all
  simplified_phrase: you rule over everything
  preserved_meaning: God continually rules over all that exists.
  reasoning_layer_used: Lexical decision for מוֹשֵׁל בַּכֹּל
  rationale: “Everything” expresses the comprehensive scope naturally in this clause.
- pob_phrase: in your hand it is to make great and to strengthen all
  simplified_phrase: In your hand is the power to make all great and strengthen all
  preserved_meaning: God controls the ability to elevate and strengthen all.
  reasoning_layer_used: Lexical decisions for בְיָדְךָ, לְגַדֵּל, and לְחַזֵּק
  rationale: This wording explains the idiom without making God's hand an independent agent and retains both parallel actions.
interpretive_expansions:
- pob_phrase: in your hand it is
  rendering: In your hand is the power
  claim: The hand image expresses God's possession and control of the ability to act.
  evidence:
  - The lexical rationale identifies the hand idiom as possession and control.
  - The surrounding clauses describe God's universal rule, power, and might.
  confidence: high
  alternatives_preserved:
  - in your hand it is
  - by your hand
  - in your power
translation_notes:
  risk_flags:
  - risk: “Your presence” is less literal than “from before you.”
    mitigation: The footnote preserves the literal Hebrew image and the simpler alternative.
  - risk: The repeated “all” may refer to persons, things, or both.
    mitigation: The main text keeps “all” and does not narrow its reference.
