simplification_decisions:
- pob_phrase: Moreover, because of my delight in the house of my God
  simplified_phrase: And because I delight in the house of my God
  preserved_meaning: David adds a further statement and gives his delight in God's house as his motive.
  reasoning_layer_used: Lexical decisions for וְעוֹד and בִּרְצוֹתִי
  rationale: The verb “delight” is more direct than the abstract phrase “because of my delight.”
- pob_phrase: I have a personal treasure of gold and silver, and I have given it
  simplified_phrase: I have also given my own treasure of gold and silver
  preserved_meaning: David gives valued property belonging personally to him.
  reasoning_layer_used: Lexical decisions for סְגֻלָּה and נָתַתִּי
  rationale: Combining possession and donation removes a cumbersome clause while keeping the treasure explicitly David's own.
- pob_phrase: over and above all that I have prepared for the holy house
  simplified_phrase: in addition to everything I have already prepared for the holy house
  preserved_meaning: David's personal gift is additional to all his earlier preparations.
  reasoning_layer_used: Lexical and theological decisions for לְמַעְלָה, מִכָּל הֲכִינוֹתִי, and בֵית הַקֹּדֶשׁ
  rationale: “In addition to” states the comparison plainly, while “already” marks the preparations as prior.
interpretive_expansions:
