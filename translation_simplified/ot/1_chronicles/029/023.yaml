translation:
  language: en
  text: Then Solomon became king in place of his father David. He sat on Yahweh’s throne, prospered, and all Israel obeyed him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “listened to him” or “heeded him,” but here it implies obedience to the king.
    reason: lexical_alternative
