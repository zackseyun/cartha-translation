  preserved_meaning: Solomon succeeded David as king while exercising kingship under Yahweh’s rule.
  reasoning_layer_used: Lexical and theological decisions on royal succession and Yahweh’s throne
  rationale: Two short clauses clarify the succession while preserving the concrete throne image.
- pob_phrase: all Israel listened to him
  simplified_phrase: all Israel obeyed him
  preserved_meaning: The nation accepted and followed Solomon’s royal authority.
  reasoning_layer_used: Lexical decision for וַיִּשְׁמְעוּ אֵלָיו
  rationale: “Obeyed” makes the authority-context meaning clear while the footnote preserves the Hebrew wording’s range.
