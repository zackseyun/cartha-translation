  preserved_meaning: A large quantity of marble or similar polished stone was prepared.
  reasoning_layer_used: POB lexical decisions for שַׁיִשׁ and לָרֹב
  rationale: Dropping the redundant “stones” produces natural English without reducing the quantity.
