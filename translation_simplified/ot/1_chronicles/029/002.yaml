translation:
  language: en
  text: 'With all my strength, I have prepared materials for the house of my God: gold for the gold objects, silver for the silver objects, bronze for the bronze objects, iron for the iron objects, and wood for the wooden objects. I have also prepared onyx stones,[a] settings,[b] stones of antimony,[c] multicolored stones,[d] every kind of precious stone, and marble in abundance.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The exact kinds of stone meant by “onyx” and “marble” are uncertain; these are traditional identifications.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word may mean settings, mountings, or inlays.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew phrase is difficult; it may refer to stones connected with dark pigment, decorative inlay, or another ornamental material.
    reason: lexical_alternative
  - marker: d
    text: The Hebrew word may refer to multicolored or richly patterned work; in this list it likely refers to decorative stonework.
    reason: lexical_alternative
