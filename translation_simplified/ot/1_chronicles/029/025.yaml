  simplified_phrase: that no earlier king over Israel had possessed
  preserved_meaning: Solomon’s royal majesty was unprecedented among Israel’s previous kings.
  reasoning_layer_used: Lexical decisions for אֲשֶׁר לֹא הָיָה עַל כָּל מֶלֶךְ, לְפָנָיו, and עַל יִשְׂרָאֵל
