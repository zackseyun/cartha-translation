translation:
  language: en
  text: Yahweh, greatness, power, splendor, victory,[a] and majesty all belong to you. For everything in heaven and on earth is yours. The kingdom belongs to you, Yahweh, and you are exalted as head over all.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “victory” may also mean enduring supremacy or preeminence.
    reason: lexical_alternative
