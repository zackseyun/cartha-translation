translation:
  language: en
  text: 3,000 talents (large units of weight) of gold from Ophir[a], and 7,000 talents of refined silver, to cover the walls of the buildings with these metals.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Ophir gold.” The Hebrew may describe where the gold came from or the kind of gold it was.
    reason: lexical_alternative
  - marker: b
    text: A talent was a large unit of weight, not a reference to skill or ability.
    reason: cultural_note
