translation:
  language: en
  text: All the officials and powerful men, as well as all of King David’s sons, pledged their loyalty to King Solomon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says they “gave the hand under” Solomon, an image of submitting to his authority and promising loyalty.
    reason: source_note
simplification_decisions:
- pob_phrase: the mighty men
  simplified_phrase: powerful men
  preserved_meaning: The term can describe men known for valor, power, or status without identifying them only as warriors.
  reasoning_layer_used: POB lexical decision for גִּבֹּרִים
  rationale: “Powerful men” is clear English and preserves both the martial and status-related possibilities.
- pob_phrase: all the sons of King David
  simplified_phrase: all of King David’s sons
  preserved_meaning: Every son of David is included, and David’s royal title remains explicit.
  reasoning_layer_used: POB lexical decision for בְּנֵי הַמֶּלֶךְ דָּוִיד
  rationale: The possessive form is more natural in modern English without changing the relationship.
- pob_phrase: pledged allegiance to
  simplified_phrase: pledged their loyalty to
  preserved_meaning: They formally submitted to Solomon and promised to remain loyal.
  reasoning_layer_used: POB lexical decision and footnote for נָתְנוּ יָד תַּחַת
  rationale: “Pledged their loyalty” communicates the formal idiom in immediately understandable English.
translation_notes:
  risk_flags:
  - risk: “Powerful men” may not display the Hebrew term’s possible military connotation as clearly as “warriors.”
    mitigation: The broader wording preserves the documented ambiguity rather than limiting the group to soldiers.
