- pob_phrase: we are sojourners before you, and temporary residents
  simplified_phrase: we live before you as foreigners and temporary residents
  preserved_meaning: The people live in God's presence without permanent status on earth.
  reasoning_layer_used: POB lexical decisions for גֵרִים, לְפָנֶיךָ, and תוֹשָׁבִים
  rationale: The active wording explains “sojourners” while retaining both foreignness and temporary residence.
- pob_phrase: as all our fathers were
  simplified_phrase: just as all our fathers did
  preserved_meaning: Earlier generations shared the same temporary earthly condition.
  reasoning_layer_used: POB lexical decision for כְּכָל אֲבֹתֵינוּ
  rationale: The natural verbal form clarifies the comparison while retaining “fathers.”
- pob_phrase: Our days on the earth are like a shadow, and there is no hope
  simplified_phrase: Our days on earth are like a passing shadow; there is no hope that they will last
  preserved_meaning: Human life is fleeting and offers no enduring earthly prospect.
  reasoning_layer_used: POB lexical and theological decisions for כַּצֵּל and וְאֵין מִקְוֶה
  rationale: “Passing” preserves the shadow image while making its transient force immediately clear.
