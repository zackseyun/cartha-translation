translation:
  language: en
  text: For we live before you as foreigners and temporary residents, just as all our fathers did. Our days on earth are like a passing shadow; there is no hope that they will last.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This refers to the brevity of earthly life, not to an absence of hope in God.
    reason: cross_reference
