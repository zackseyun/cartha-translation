  text: The events of King David’s reign, from beginning to end, are written in the records of Samuel the seer, in the records of Nathan the prophet, and in the records of Gad the seer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew uses different words for the titles translated “seer” for Samuel and Gad.
    reason: lexical_alternative
