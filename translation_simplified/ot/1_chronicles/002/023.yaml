translation:
  language: en
  text: But Geshur and Aram took the villages of Jair[a] away from them. They also took Kenath and the dependent towns around it[b]—sixty cities in all. All these were sons of Machir[c], the father of Gilead.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Havvoth-jair,” a place-name meaning “tent-villages of Jair.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew literally calls these Kenath’s “daughters,” meaning settlements dependent on the city.
    reason: cultural_note
  - marker: c
    text: “Sons of Machir” may mean his descendants or clan members, not only his immediate sons.
    reason: lexical_alternative
