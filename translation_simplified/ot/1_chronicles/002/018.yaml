translation:
  language: en
  text: Caleb son of Hezron had children with his wife Azubah and with Jerioth.[a] Her sons were Jesher, Shobab, and Ardon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is difficult. Jerioth may be another woman, or the name may be connected with Azubah.
    reason: alternative_reading
  - marker: b
    text: The Hebrew says “her sons.” The genealogy has also been understood in other ways.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: fathered children by
  simplified_phrase: had children with
  preserved_meaning: Caleb was the father of children born through the named women.
  reasoning_layer_used: Lexical decision for הוֹלִיד and its genealogical context.
  rationale: Common wording replaces a formal genealogical expression without changing the relationship.
- pob_phrase: and these were her sons
  simplified_phrase: Her sons were
  preserved_meaning: The feminine singular Hebrew suffix remains explicit.
  reasoning_layer_used: Masoretic grammar and the theological decision not to smooth the genealogy.
  rationale: A direct sentence is easier to read while preserving “her,” not “his.”
translation_notes:
  risk_flags:
  - risk: The wording may suggest with certainty that Jerioth was a second woman.
    mitigation: Footnote a preserves the documented possibility that Jerioth is connected appositionally with Azubah.
  - risk: The referent of “her” remains unclear in the difficult genealogy.
    mitigation: Footnote b retains the Masoretic wording without imposing a reconstruction.
