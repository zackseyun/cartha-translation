  text: Afterward, when Hezron was sixty years old, he had relations with a daughter of Machir, the father of Gilead,[a] and took her as his wife. She gave birth to his son Segub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “father of Gilead” may also mean Gilead’s ancestor or founder.
    reason: lexical_alternative
