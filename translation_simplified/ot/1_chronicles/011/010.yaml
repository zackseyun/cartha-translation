translation:
  language: en
  text: These were the leaders of David’s mighty warriors. They strongly supported his royal rule.[a] Together with all Israel, they acted to make him king, in keeping with what Yahweh had said concerning Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may more literally mean “strengthened themselves with him,” but here it likely describes their strong support for David as king.
    reason: lexical_alternative
