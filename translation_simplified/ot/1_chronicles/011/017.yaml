  simplified_phrase: David longed for water and said
  preserved_meaning: David expressed a strong desire for the water he then named.
  reasoning_layer_used: POB lexical decision for ויתאו and immediate context
  rationale: Naming water as the object makes the sentence immediately clear without weakening his longing.
- pob_phrase: Who will give me water to drink
  simplified_phrase: If only someone would give me water to drink
  preserved_meaning: David voices a strong wish for someone to provide the water.
  reasoning_layer_used: POB lexical alternative for מי
  rationale: The idiomatic wish form communicates the force more naturally than a literal question.
- pob_phrase: the well of Bethlehem that is by the gate
  simplified_phrase: the well by Bethlehem’s gate
  preserved_meaning: The well is identified by its location near Bethlehem’s city gate.
  reasoning_layer_used: POB lexical decisions for מבּור and אשר בשער
  rationale: The shorter possessive construction keeps the same location in ordinary English.
