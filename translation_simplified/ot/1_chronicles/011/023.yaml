translation:
  language: en
  text: He struck down the Egyptian, a man about 2.3 meters (7½ feet) tall.[a] The Egyptian held a spear with a shaft like a beam from a weaver’s loom. He went down to him with a staff, snatched the spear from the Egyptian’s hand, and killed him with his own spear.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebrew: “five cubits.” A cubit was the length from the elbow to the fingertips, though its exact length varied.'
    reason: cultural_note
