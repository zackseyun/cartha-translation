translation:
  language: en
  text: Abishai, Joab’s brother, was the leader of the Three.[a] He wielded his spear against three hundred men and left them slain. He was renowned among the Three.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “the Three.” The parallel passage in 2 Samuel 23:18 has textual and contextual difficulties involving “three” and “thirty.”
    reason: textual_variant
