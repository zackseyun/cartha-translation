  text: David said, “Whoever strikes down a Jebusite before anyone else will become chief and commander.” Joab son of Zeruiah went up first,[a] so he became chief.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Went up” may describe climbing toward the stronghold during the attack, but the Hebrew simply says “went up.”
    reason: cultural_note
