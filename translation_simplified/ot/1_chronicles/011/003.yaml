  preserved_meaning: The recognized representatives of the whole nation came to David.
  reasoning_layer_used: POB lexical decision for זִקְנֵי
  rationale: The possessive form is more natural while retaining the specific office of elder.
- pob_phrase: at Hebron before Yahweh
  simplified_phrase: There ... in Yahweh’s presence
  preserved_meaning: The covenant was made at Hebron with Yahweh as the solemn divine witness.
  reasoning_layer_used: POB lexical decisions for בְּחֶבְרוֹן and לִפְנֵי יְהוָה
  rationale: A new sentence avoids repetition, and “in Yahweh’s presence” makes “before Yahweh” immediately clear.
- pob_phrase: according to the word of Yahweh by Samuel
  simplified_phrase: just as Yahweh had said through Samuel
  preserved_meaning: David’s appointment agreed with Yahweh’s earlier message mediated by Samuel.
  reasoning_layer_used: POB lexical decisions for כִּדְבַר יְהוָה and בְּיַד שְׁמוּאֵל
  rationale: The clause becomes ordinary English without narrowing Yahweh’s word to a promise.
