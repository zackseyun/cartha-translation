translation:
  language: en
  text: Long before now, even when Saul was king, you were the one who led Israel out and brought them back. Yahweh your God said to you, “You will care for my people Israel as a shepherd, and you will be ruler over my people Israel.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “ruler” can also mean “leader” or “prince”; it is not the usual word for “king.”
    reason: lexical_alternative
