translation:
  language: en
  text: 'This is the list of David’s mighty warriors: Jashobeam son of Hachmoni was the leader of the Thirty. In a single battle, he wielded his spear against three hundred men who were slain.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may describe him as raising or brandishing his spear against three hundred slain at one time or on one occasion.
    reason: lexical_alternative
