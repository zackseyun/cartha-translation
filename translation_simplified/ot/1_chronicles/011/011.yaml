  preserved_meaning: The verse introduces a roster of David’s renowned fighters.
  reasoning_layer_used: Lexical decisions for מִסְפַּר and הַגִּבֹּרִים
  rationale: “List” and “warriors” clearly identify the roster and its military setting.
- pob_phrase: the chief of the Thirty
  simplified_phrase: the leader of the Thirty
  preserved_meaning: Jashobeam held the leading rank in the named group.
  reasoning_layer_used: Lexical decision for רֹאשׁ הַשלושים
  rationale: “Leader” expresses his rank in more common English.
- pob_phrase: he wielded his spear against three hundred slain in one encounter
  simplified_phrase: In a single battle, he wielded his spear against three hundred men who were slain
  preserved_meaning: His spear action was directed against three hundred slain during one combat occasion.
  reasoning_layer_used: Lexical decisions for עורר, עַל, חָלָל, and בְּפַעַם אֶחָת
  rationale: The passive wording keeps the compact agency relation without asserting that he personally killed every man.
