translation:
  language: en
  text: The three broke through into the Philistine camp and drew water from the well by Bethlehem’s gate. They carried the water to David, but he would not drink it. Instead, he poured it out to Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew verb can also mean that David poured it out as a drink offering to Yahweh.
    reason: lexical_alternative
