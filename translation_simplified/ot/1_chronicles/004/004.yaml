translation:
  language: en
  text: Penuel[a] was the father[b] of Gedor, and Ezer was the father[b] of Hushah. Penuel and Ezer were sons of Hur. Hur was Ephrathah’s firstborn and the father[b] of Bethlehem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Penuel is spelled “Peniel” in some other passages; both are forms of the same name.
    reason: lexical_alternative
  - marker: b
    text: In this genealogy, “father of” may also mean “founder of” or “ancestor of,” especially when a town or clan is named.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Penuel, the father of Gedor, and Ezer, the father of Hushah
  simplified_phrase: Penuel was the father of Gedor, and Ezer was the father of Hushah.
  preserved_meaning: Penuel and Ezer retain their stated relationships to Gedor and Hushah.
  reasoning_layer_used: POB lexical decisions for אֲבִי and the proper names
  rationale: Turning the appositional phrases into a complete sentence makes the genealogy easier to follow.
- pob_phrase: these were the sons of Hur
  simplified_phrase: Penuel and Ezer were sons of Hur.
  preserved_meaning: The pronoun points to both men just named as Hur’s sons.
  reasoning_layer_used: Immediate syntax and the POB rendering of בְנֵי
  rationale: Repeating the names removes an unclear backward reference without changing the relationship.
- pob_phrase: Hur, the firstborn of Ephrathah, the father of Bethlehem
  simplified_phrase: Hur was Ephrathah’s firstborn and the father of Bethlehem.
  preserved_meaning: Hur remains identified as Ephrathah’s firstborn and as the father of Bethlehem.
  reasoning_layer_used: POB lexical decisions for בְּכֹר and אֲבִי
  rationale: A separate clause clarifies that both descriptions refer to Hur.
