  rationale: “Become as numerous” gives the population sense of “multiply” in ordinary English while retaining “all.”
- pob_phrase: the sons of Judah
  simplified_phrase: the descendants of Judah
  preserved_meaning: The comparison is with Judah’s broader genealogical line.
  reasoning_layer_used: POB lexical rationale for עַד בְּנֵי יְהוּדָה
  rationale: “Descendants” avoids suggesting that only Judah’s immediate sons are meant.
