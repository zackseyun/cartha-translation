translation:
  language: en
  text: Meonothai was the father of Ophrah. Seraiah was the father of Joab, who was the father[a] of Ge-harashim.[b] The place had this name because the people associated with it were craftsmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “father” may mean the founder or ancestral head of the place.
    reason: alternative_reading
  - marker: b
    text: Ge-harashim likely means “Valley of Craftsmen.”
    reason: lexical_alternative
