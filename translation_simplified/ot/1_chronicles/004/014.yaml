  preserved_meaning: Meonothai stands in a direct genealogical relationship to Ophrah.
  reasoning_layer_used: POB lexical decision for הוֹלִיד
  rationale: This replaces the less common verb “fathered” with familiar genealogical English.
- pob_phrase: Seraiah fathered Joab, the father of Ge-harashim
  simplified_phrase: Seraiah was the father of Joab, who was the father of Ge-harashim
  preserved_meaning: Seraiah fathered Joab, while Joab had a father, founder, or ancestral-head relationship to Ge-harashim.
  reasoning_layer_used: POB lexical decisions for הוֹלִיד and אֲבִי
  rationale: The relative clause separates the relationships without narrowing the second one.
- pob_phrase: for they were craftsmen
