translation:
  language: en
  text: Ezrah’s sons were Jether, Mered, Epher, and Jalon.[a] She conceived Miriam, Shammai, and Ishbah,[b] who was the father of Eshtemoa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “the son of Ezrah,” but the following list names several sons.
    reason: textual_variant
  - marker: b
    text: The Hebrew does not identify the woman meant by “she.”
    reason: lexical_alternative
  - marker: c
    text: “Father of Eshtemoa” may instead mean “founder of Eshtemoa” if Eshtemoa was a clan or settlement.
    reason: lexical_alternative
