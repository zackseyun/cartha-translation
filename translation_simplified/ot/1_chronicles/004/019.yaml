translation:
  language: en
  text: Hodiah’s wife was Naham’s sister. Her sons were the forefathers of Keilah the Garmite and Eshtemoa the Maacathite.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew has the singular phrase “father of” after the plural “sons.” In genealogies, “father” can also mean an ancestor, founder, or clan head, so the exact relationship is uncertain.
    reason: lexical_alternative
