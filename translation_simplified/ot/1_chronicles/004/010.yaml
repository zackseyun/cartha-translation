translation:
  language: en
  text: 'Jabez prayed to the God of Israel: “Please bless me greatly and give me more land. Keep your hand with me to help me. Protect me from harm[a], so that I will not suffer pain.[b]” And God gave him what he asked for.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “protect me from evil.” The Hebrew can refer either to moral evil or to harmful calamity; the context here favors harm.
    reason: lexical_alternative
  - marker: b
    text: This request not to suffer pain echoes the explanation of Jabez’s name in the previous verse.
    reason: cross_reference
