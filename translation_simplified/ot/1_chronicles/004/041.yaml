translation:
  language: en
  text: These men, who were listed by name, came during the reign of Hezekiah king of Judah. They attacked both the tents and the Meunites[a] they found there and devoted them all to destruction. This remained the case to the writer’s own day. Then they settled in their place because there was pasture there for their flocks.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word is difficult. It is traditionally understood as “Meunites,” but it may instead mean “dwellings” or “places where people lived.”
    reason: alternative_reading
