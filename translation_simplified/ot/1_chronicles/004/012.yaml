translation:
  language: en
  text: Eshton was the father of Beth-rapha, Paseah, and Tehinnah. Tehinnah was the father of Ir-nahash.[a] These men belonged to Rekah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
