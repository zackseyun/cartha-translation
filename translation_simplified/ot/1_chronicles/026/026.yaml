translation:
  language: en
  text: Shelomoth and his brothers were responsible for all the treasuries that held the sacred items. These items had been dedicated by King David, the family heads[a], the commanders over units of thousands and hundreds, and the army commanders.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: These were leaders of extended family groups, sometimes called fathers’ houses.
    reason: cultural_note
