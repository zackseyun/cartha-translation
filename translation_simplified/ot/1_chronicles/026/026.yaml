- pob_phrase: were over all the treasuries of the holy things
  simplified_phrase: were responsible for all the treasuries that held the sacred items
  preserved_meaning: Shelomoth and his brothers oversaw treasuries containing consecrated items.
  reasoning_layer_used: POB lexical decisions for עַל, אֹצְרוֹת, and הַקֳּדָשִׁים
  rationale: This wording clearly states both their administrative role and what the treasuries contained.
- pob_phrase: the heads of the fathers’ houses
  simplified_phrase: the family heads
  preserved_meaning: They were leaders within Israel’s clan-based family structure.
  reasoning_layer_used: POB lexical rationale and cultural note for רָאשֵׁי הָאָבוֹת
  rationale: The common phrase replaces an opaque ancient title while the note retains its clan sense.
- pob_phrase: the commanders of thousands and hundreds, and the commanders of the army
  simplified_phrase: the commanders over units of thousands and hundreds, and the army commanders
  preserved_meaning: Military officers over established unit categories and the army also dedicated the items.
  reasoning_layer_used: POB lexical decisions for שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת and שָׂרֵי הַצָּבָא
  rationale: The plural unit wording clarifies the numbers without narrowing them to one unit of each size.
