translation:
  language: en
  text: His 2,700 brothers were valiant men who led their ancestral families. King David put them in charge of the Reubenites, the Gadites, and the half-tribe of Manasseh. They were responsible for all matters concerning God and all matters concerning the king.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: his brothers, valiant men, were two thousand seven hundred heads of fathers’ houses
  simplified_phrase: His 2,700 brothers were valiant men who led their ancestral families
  preserved_meaning: The 2,700 men were Hashabiah’s male relatives, noted for valor and leadership of ancestral family groups.
  reasoning_layer_used: Lexical decisions for וְאֶחָיו, בְּנֵי חַיִל, the number, and רָאשֵׁי הָאָבוֹת
  rationale: This replaces an opaque social title with a clear description while retaining ancestry, leadership, and valor.
- pob_phrase: King David appointed them over
  simplified_phrase: King David put them in charge of
  preserved_meaning: David officially assigned them authority and responsibility over the named tribes.
  reasoning_layer_used: Lexical decisions for וַיַּפְקִידֵם and עַל
  rationale: This common administrative wording makes their assigned authority immediately clear.
- pob_phrase: for every matter of God and of the king
  simplified_phrase: They were responsible for all matters concerning God and all matters concerning the king
  preserved_meaning: Their responsibility covered distinct divine and royal spheres without narrowing either sphere.
  reasoning_layer_used: Lexical and theological decisions on the two spheres of responsibility
  rationale: Repeating the phrase clearly preserves the two categories and avoids presenting them as one combined sphere.
translation_notes:
  risk_flags:
  - risk: “Ancestral families” is less structurally specific than “fathers’ houses.”
    mitigation: The wording preserves ancestry and family leadership without retaining an opaque technical expression.
  - risk: “Matters concerning God” may include more than specifically ritual duties.
    mitigation: The broad wording preserves the POB’s deliberate ambiguity while distinguishing it from royal affairs.
