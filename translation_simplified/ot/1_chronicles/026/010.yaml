translation:
  language: en
  text: Hosah, a descendant of Merari, also had sons. Shimri was their leader. He was not the firstborn, but his father appointed him as leader.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “for he was not the firstborn”; the Hebrew may give his birth order as background for his father’s appointment rather than emphasize the contrast.
    reason: lexical_alternative
