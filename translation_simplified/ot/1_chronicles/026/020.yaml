- pob_phrase: And of the Levites
  simplified_phrase: Among the Levites
  preserved_meaning: Ahijah belonged to the Levites and received this oversight assignment.
  reasoning_layer_used: POB lexical decision and alternative-reading footnote
  rationale: “Among” makes the elliptical opening natural while the footnote preserves its heading-like possibility.
- pob_phrase: was over
  simplified_phrase: was in charge of
  preserved_meaning: Ahijah had administrative oversight of both sets of treasuries.
  reasoning_layer_used: POB lexical decision for עַל
  rationale: “In charge of” states the governance sense in common English.
- pob_phrase: the holy things
  simplified_phrase: things set apart as holy
  preserved_meaning: These items were reserved for sacred use.
  reasoning_layer_used: POB lexical decision and lexical-alternative footnote
  rationale: The wording explains the sacred status of the items without changing their relation to the treasuries.
