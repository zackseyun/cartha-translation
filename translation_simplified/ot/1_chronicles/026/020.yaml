translation:
  language: en
  text: Among the Levites[a], Ahijah was in charge of the treasuries of the house of God and the treasuries of things set apart as holy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Hebrew may also introduce a new section: “As for the Levites: Ahijah was in charge of …”'
    reason: alternative_reading
