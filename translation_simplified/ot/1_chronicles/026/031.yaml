translation:
  language: en
  text: Among the Hebronites, Jeriah was the chief, according to their family lines and ancestral clans. In the fortieth year of David’s reign, they were identified through a careful search. At Jazer in Gilead, men of great strength and ability were found among them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew phrase may refer to mighty warriors or, more broadly, especially capable men.
    reason: lexical_alternative
