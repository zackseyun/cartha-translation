translation:
  language: en
  text: Chenaniah, the leader of the Levites, was in charge of the carrying work because he was skilled at it.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “was in charge of the singing because he was skilled at it.” The Hebrew word usually refers to a burden or carrying, but some understand it here in a musical sense because the surrounding verses mention singers and musicians.
    reason: alternative_reading
