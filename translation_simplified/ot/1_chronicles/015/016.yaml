translation:
  language: en
  text: Then David told the Levite leaders, “Appoint your fellow Levites as singers. Harps, lyres, and cymbals are to accompany them as they make the music ring out loudly and raise joyful songs with their voices.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “lift up their voices with joy”; the Hebrew literally says “raise with a voice or sound for joy.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the leaders of the Levites
  simplified_phrase: the Levite leaders
  preserved_meaning: David addresses those who lead the Levites.
  reasoning_layer_used: Lexical decision for לְשָׂרֵי הַלְוִיִּם
  rationale: The shorter form is natural English and keeps their leadership role.
- pob_phrase: their brothers, the singers
  simplified_phrase: your fellow Levites as singers
  preserved_meaning: The leaders are to appoint singers from their own Levitical community.
  reasoning_layer_used: POB cultural footnote and lexical decisions for אֶת אֲחֵיהֶם and הַמְשֹׁרְרִים
  rationale: “Fellow Levites” makes the kinship reference clear without implying only biological siblings.
- pob_phrase: with musical instruments—harps, lyres, and cymbals—sounding aloud, to raise songs of joy
  simplified_phrase: Harps, lyres, and cymbals are to accompany them as they make the music ring out loudly and raise joyful songs with their voices
  preserved_meaning: The singers serve with three kinds of instruments, producing audible music and joyful vocal praise.
  reasoning_layer_used: POB lexical decisions and independent grounding review
  rationale: The wording distinguishes instrumental accompaniment from raised voices without assigning every instrument to every singer.
interpretive_expansions:
- pob_phrase: their brothers
  rendering: your fellow Levites
  claim: The brothers are members of the same Levitical community, not necessarily biological siblings.
  evidence:
  - The POB cultural note explicitly identifies them as fellow Levites.
  - The command is addressed to leaders of the Levites.
  confidence: high
  alternatives_preserved:
  - brothers
  - kinsmen
- pob_phrase: to raise songs of joy
  rendering: raise joyful songs with their voices
  claim: The joyful songs are raised vocally while the instruments accompany the singers.
  evidence:
  - The Hebrew expression includes “voice” or “sound.”
  - The POB footnote gives “lift up the voice with joy” as an alternative.
  confidence: moderate
  alternatives_preserved:
  - lift up their voices with joy
  - raise the sound for joy
translation_notes:
  risk_flags:
  - risk: “Accompany them” may suggest separate instrumentalists more clearly than the Hebrew does.
    mitigation: The wording avoids saying that every singer personally plays all three instruments.
  - risk: “Raise joyful songs with their voices” combines the POB choice with a more explicit vocal reference.
    mitigation: The footnote preserves the direct Hebrew alternative and its ambiguity between voice and sound.
