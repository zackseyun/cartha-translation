translation:
  language: en
  text: David wore a robe of fine linen. All the Levites who carried the ark, the singers, and Chenaniah, a leader,[a] also wore robes of fine linen. David also wore a linen ephod.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew phrase describing Chenaniah’s role is difficult; it may refer to leading the singing, the carrying, or the music.
    reason: alternative_reading
  - marker: b
    text: An ephod was a special garment associated with worship; the verse does not say that David was a priest.
    reason: cultural_note
simplification_decisions:
- pob_phrase: David was clothed with a robe of fine linen, as were all the Levites
  simplified_phrase: David wore a robe of fine linen. All the Levites ... also wore robes of fine linen.
  preserved_meaning: David and the listed participants wore fine-linen robes.
  reasoning_layer_used: Lexical decisions for מְכֻרְבָּל, מְעִיל, and בּוּץ
  rationale: Two direct sentences clarify who wore the robes while preserving their material and ceremonial character.
- pob_phrase: Chenaniah, the leader of the singing of the singers
  simplified_phrase: Chenaniah, a leader
  preserved_meaning: Chenaniah held a leadership role, though its precise sphere remains uncertain.
  reasoning_layer_used: Theological decision and POB footnote on the difficult Hebrew phrase
  rationale: The main text states only the certain leadership element, while footnote a preserves the disputed possibilities.
- pob_phrase: and on David was a linen ephod
  simplified_phrase: David also wore a linen ephod
  preserved_meaning: David wore the linen ephod as an additional garment.
  reasoning_layer_used: Lexical decisions for וְעַל דָּוִיד and אֵפוֹד בָּד
  rationale: Natural English replaces the formal construction without changing or interpreting the garment name.
interpretive_expansions:
- pob_phrase: and on David was a linen ephod
  rendering: David also wore a linen ephod
  claim: The ephod was an additional garment worn with David’s fine-linen robe.
  evidence:
  - The POB places the ephod in a separate clause and says the Hebrew structure distinguishes it from the robe.
  confidence: high
translation_notes:
  risk_flags:
  - risk: Calling Chenaniah simply “a leader” omits his disputed sphere of responsibility.
    mitigation: Footnote a preserves the possible connections with singing, carrying, or music.
  - risk: Readers may infer that wearing an ephod made David a priest.
    mitigation: Footnote b identifies its worship setting without assigning David a priestly office.
