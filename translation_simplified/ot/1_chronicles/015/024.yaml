translation:
  language: en
  text: The priests Shebaniah, Jehoshaphat, Nethanel, Amasai, Zechariah, Benaiah, and Eliezer were blowing the trumpets[a] in front of the ark of God. Obed-edom and Jehiah served as gatekeepers for the ark.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: These were likely the straight trumpets that priests used in worship.
    reason: cultural_note
simplification_decisions:
- pob_phrase: And Shebaniah, Jehoshaphat, Nethanel, Amasai, Zechariah, Benaiah, and Eliezer the priests
  simplified_phrase: The priests Shebaniah, Jehoshaphat, Nethanel, Amasai, Zechariah, Benaiah, and Eliezer
  preserved_meaning: All seven named men belonged to the priestly group.
  reasoning_layer_used: POB lexical decision for הַכֹּהֲנִים
  rationale: Placing “the priests” first makes the long list easier to understand.
- pob_phrase: before the ark of God
  simplified_phrase: in front of the ark of God
  preserved_meaning: The priests were positioned ahead of the ark.
  reasoning_layer_used: POB lexical decision for לִפְנֵי
  rationale: “In front of” expresses the spatial relationship in common English.
- pob_phrase: and Obed-edom and Jehiah were gatekeepers for the ark
  simplified_phrase: Obed-edom and Jehiah served as gatekeepers for the ark
  preserved_meaning: The two men had an assigned gatekeeping responsibility connected with the ark.
  reasoning_layer_used: POB lexical decisions for שֹׁעֲרִים and לָאָרוֹן
  rationale: A separate sentence and “served as” make their assigned role immediately clear.
