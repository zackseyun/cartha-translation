translation:
  language: en
  text: So David, the elders of Israel, and the commanders over units of a thousand went with joy to bring the ark of Yahweh’s covenant up from Obed-edom’s house.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the commanders of the thousands
  simplified_phrase: the commanders over units of a thousand
  preserved_meaning: These were leaders responsible for organized groups numbered by thousands.
  reasoning_layer_used: POB lexical decision for שָׂרֵי הָאֲלָפִים
  rationale: “Units of a thousand” makes the organizational sense clearer without deciding whether the units were strictly military.
- pob_phrase: the ark of the covenant of Yahweh
  simplified_phrase: the ark of Yahweh’s covenant
  preserved_meaning: The ark belonged to the covenant associated with Yahweh.
  reasoning_layer_used: POB lexical and theological decisions for אֲרוֹן בְּרִית יְהוָה and יְהוָה
  rationale: The possessive form is more natural while retaining the ark, the covenant, and Yahweh’s personal name.
- pob_phrase: from the house of Obed-edom
  simplified_phrase: from Obed-edom’s house
  preserved_meaning: The ark was being moved from the residence of Obed-edom.
  reasoning_layer_used: POB lexical decision for מִן בֵּית עֹבֵד אֱדֹם
  rationale: The possessive form states the same relationship in ordinary English.
translation_notes:
  risk_flags:
  - risk: “Units of a thousand” may sound like an exact head count.
    mitigation: The wording preserves the ancient organizational label without claiming each unit contained exactly one thousand people.
