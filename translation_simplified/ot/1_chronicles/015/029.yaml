translation:
  language: en
  text: As the ark of Yahweh’s covenant arrived at the city of David, Michal, Saul’s daughter, looked out the window. She saw King David dancing and celebrating,[a] and in her heart she despised him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “rejoicing” or “making merry.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the ark of the covenant of Yahweh
  simplified_phrase: the ark of Yahweh’s covenant
  preserved_meaning: The ark remains identified with Yahweh and his covenant.
  reasoning_layer_used: lexical and theological decisions
  rationale: The possessive form is easier to read while retaining Yahweh’s personal name.
- pob_phrase: Michal the daughter of Saul looked out through the window
  simplified_phrase: Michal, Saul’s daughter, looked out the window
  preserved_meaning: Michal is still identified by her connection to Saul and is shown watching from a window.
  reasoning_layer_used: lexical decision
  rationale: Natural English removes the formal apposition and unnecessary preposition without losing the narrative emphasis.
- pob_phrase: saw King David dancing and playing
  simplified_phrase: saw King David dancing and celebrating
  preserved_meaning: David was moving energetically and taking part in joyful public festivity.
  reasoning_layer_used: lexical decision and doctrine-realignment revision
  rationale: “Celebrating” conveys the festive sense and avoids the misleading modern idea of playing a game.
