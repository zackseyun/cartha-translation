translation:
  language: en
  text: 'Amram’s sons were Aaron and Moses. Aaron was set apart so that he would be consecrated as most holy.[a] He and his sons were to do these things forever: burn incense before Yahweh, serve him as priests, and pronounce blessings in his name.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression literally means “holiness of holinesses,” a superlative meaning “most holy”; it can also be translated “holy of holies.”
