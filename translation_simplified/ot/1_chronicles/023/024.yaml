  simplified_phrase: descendants of Levi who led their ancestral families
  preserved_meaning: The listed Levites were leading representatives of their ancestral families.
  reasoning_layer_used: POB lexical decisions for לְבֵית אֲבֹתֵיהֶם and רָאשֵׁי הָאָבוֹת
  rationale: This clearly identifies the listed descendants as family leaders rather than people organized under separate leaders.
- pob_phrase: according to those counted of them, by the number of names, head by head
  simplified_phrase: was registered by name and counted separately
  preserved_meaning: Every eligible individual was named and counted separately in the register.
  reasoning_layer_used: POB lexical decisions for לִפְקוּדֵיהֶם, בְּמִסְפַּר שֵׁמוֹת, and לְגֻלְגְּלֹתָם
  rationale: This states the census procedure directly while the footnote preserves the Hebrew image.
- pob_phrase: doing the work for the service of the house of Yahweh, from twenty years old and upward
  simplified_phrase: twenty years old or older and did the work of serving in Yahweh’s house
  preserved_meaning: The count included Levites at least twenty years old who performed service connected with Yahweh’s house.
  reasoning_layer_used: POB lexical and theological decisions for service, age eligibility, and the divine name
  rationale: This uses ordinary age and service language while retaining the name Yahweh.
