translation:
  language: en
  text: These were the descendants of Levi who led their ancestral families. Each one who was twenty years old or older and did the work of serving in Yahweh’s house was registered by name and counted separately.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says “head by head,” meaning that each person was counted separately.
    reason: source_note
