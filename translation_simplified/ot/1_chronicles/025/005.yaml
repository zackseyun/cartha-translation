translation:
  language: en
  text: All of them were Heman’s sons. Heman was the king’s seer[a] in matters involving words from God, to raise up the horn.[b] God gave Heman fourteen sons and three daughters.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A seer received revelation from God. The Hebrew may also mean that Heman served by means of God’s words.
    reason: lexical_alternative
  - marker: b
    text: The horn is a biblical image of strength, honor, or high status; the Hebrew does not say whose horn is raised.
    reason: lexical_alternative
