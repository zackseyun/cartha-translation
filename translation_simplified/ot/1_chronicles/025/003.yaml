translation:
  language: en
  text: 'From Jeduthun’s family: his sons Gedaliah, Zeri, Jeshaiah, Hashabiah, and Mattithiah—six in all[a]. Their father, Jeduthun, directed them. He prophesied by playing the lyre, giving thanks and praise to Yahweh.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew lists five names but says “six.” Another son may be omitted, or Jeduthun himself may be counted.
    reason: textual_variant
  - marker: b
    text: Or “prophesied by playing the lyre for thanksgiving and praise to Yahweh.”
    reason: lexical_alternative
