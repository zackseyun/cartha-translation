translation:
  language: en
  text: Asaph’s sons were Zaccur, Joseph, Nethaniah, and Asharelah. Asaph directed them, and he prophesied under the king’s direction.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “prophesied” describes Asaph’s prophetic activity in connection with temple music; it means more than simply performing music.
    reason: source_note
