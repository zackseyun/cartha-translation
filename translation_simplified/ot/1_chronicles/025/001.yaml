translation:
  language: en
  text: 'David and the army commanders set apart descendants or guild members of Asaph, Heman, and Jeduthun for temple service.[a] These men prophesied with lyres, harps, and cymbals.[b] The number of men assigned to this service was:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “sons of,” which may mean immediate sons, other descendants, or members of their guilds.
    reason: lexical_alternative
  - marker: b
    text: Or, more formally, “the prophets with lyres, harps, and cymbals,” referring to Asaph, Heman, and Jeduthun.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the sons of Asaph, Heman, and Jeduthun
  simplified_phrase: descendants or guild members of Asaph, Heman, and Jeduthun
  preserved_meaning: The men may have been descendants or members of groups associated with these leaders.
  reasoning_layer_used: lexical decision and POB footnote
  rationale: This states the likely range without limiting the men to immediate sons.
- pob_phrase: set apart for the service
  simplified_phrase: set apart ... for temple service
  preserved_meaning: David and the commanders designated the men for organized sacred service.
  reasoning_layer_used: lexical rationale and cultic context
  rationale: Naming the temple makes the sphere of service clear.
- pob_phrase: their number, the men for the work of their service, was
  simplified_phrase: The number of men assigned to this service was
  preserved_meaning: The following list counts the men designated for this service.
  reasoning_layer_used: lexical decisions and forward-pointing syntax
  rationale: The recast clause clearly identifies whom the coming enumeration counts.
interpretive_expansions:
