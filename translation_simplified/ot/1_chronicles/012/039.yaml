  simplified_phrase: fighting men ... organized for battle
  preserved_meaning: They were military men arranged and prepared as a battle force.
  reasoning_layer_used: POB lexical decisions for אַנְשֵׁי מִלְחָמָה and עֹדְרֵי מַעֲרָכָה
  rationale: Common military wording preserves both their identity and the formation nuance.
- pob_phrase: with a whole heart
  simplified_phrase: fully committed in their hearts
  preserved_meaning: Their intention to make David king was complete and undivided.
  reasoning_layer_used: POB lexical decision for בְּלֵבָב שָׁלֵם
  rationale: The wording explains the idiom while retaining its heart image.
- pob_phrase: all the rest of Israel were of one heart
  simplified_phrase: all the rest of Israel were also united in heart
  preserved_meaning: The Israelites not already listed shared one intention concerning David's kingship.
  reasoning_layer_used: POB lexical and theological decisions for כָּל שֵׁרִית יִשְׂרָאֵל and לֵב אֶחָד
  rationale: This keeps national unity and avoids importing prophetic remnant theology.
