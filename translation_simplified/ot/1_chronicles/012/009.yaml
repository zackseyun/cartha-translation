translation:
  language: en
  text: Some men from the tribe of Gad broke away and went to David at the stronghold in the wilderness.[a] They were mighty warriors, soldiers ready for battle who knew how to fight with shields and spears. They had faces like lions and were as swift as gazelles on the mountains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “went to the stronghold in the wilderness.” The Hebrew may describe movement toward the stronghold rather than arrival there.
    reason: alternative_reading
