  preserved_meaning: Men belonging to Manasseh changed their political and military allegiance to David.
  reasoning_layer_used: POB lexical decision for וּמִמְּנַשֶּׁה and נָפְלוּ עַל דָּוִיד
  rationale: The clearer wording explains both the tribal name and the military idiom.
- pob_phrase: when he came with the Philistines against Saul for battle
