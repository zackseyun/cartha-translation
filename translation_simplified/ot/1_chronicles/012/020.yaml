  preserved_meaning: David accompanied the Philistines for hostile battle against Saul.
  reasoning_layer_used: POB lexical decision for בְּבֹאוֹ עִם פְּלִשְׁתִּים עַל שָׁאוּל לַמִּלְחָמָה
  rationale: The purpose clause is recast as the natural English phrase “to fight Saul.”
- pob_phrase: because the lords of the Philistines, after taking counsel, sent him away
