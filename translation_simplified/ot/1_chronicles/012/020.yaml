translation:
  language: en
  text: Some men from the tribe of Manasseh also went over to David’s side when he came with the Philistines to fight Saul. But they did not help the Philistines, because the Philistine lords met together and sent David away. They said, “He may go back over to his master Saul, and it could cost us our heads.”
  philosophy: optimal-equivalence
