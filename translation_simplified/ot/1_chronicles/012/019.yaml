  simplified_phrase: the Spirit clothed Amasai, the leader of the Thirty. Amasai said
  preserved_meaning: The Spirit empowered Amasai to speak while the Hebrew clothing image and his military rank remain intact.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Splitting the sentence and repeating the name makes the action clear without removing the metaphor.
- pob_phrase: Yours are we, David, and with you, son of Jesse
  simplified_phrase: We are yours, David! We stand with you, son of Jesse!
  preserved_meaning: Amasai declares loyalty to David and commitment to stand with him.
  reasoning_layer_used: POB lexical rationale for the elliptical allegiance formula
  rationale: Natural English states the implied verbs while retaining both parts of the pledge.
- pob_phrase: received them and made them chiefs of the troops
  simplified_phrase: welcomed these men and appointed them as commanders over his troops
  preserved_meaning: David accepted the men and gave them military leadership.
  reasoning_layer_used: POB lexical decisions for וַיְקַבְּלֵם and וַיִּתְּנֵם בְּרָאשֵׁי הַגְּדוּד
  rationale: The clearer verbs express acceptance and formal appointment in ordinary English.
