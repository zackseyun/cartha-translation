translation:
  language: en
  text: Then the Spirit clothed Amasai[a], the leader of the Thirty. Amasai said, “We are yours, David! We stand with you, son of Jesse! Peace, peace to you, and peace to those who help you, because your God helps you.” David welcomed these men and appointed them as commanders over his troops.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “a spirit clothed Amasai” or “the spirit came upon Amasai.”
    reason: alternative_reading
