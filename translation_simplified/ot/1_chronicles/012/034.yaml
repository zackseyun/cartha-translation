translation:
  language: en
  text: From Zebulun came 50,000 men fit for military service. They were ready for battle and equipped with every kind of weapon. They came to help[a] with undivided hearts.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “to join the ranks” or “to support”; the uncommon Hebrew verb describes their united support.
    reason: alternative_reading
  - marker: b
    text: Literally, “without heart and heart,” meaning their loyalty was not divided.
    reason: lexical_alternative
