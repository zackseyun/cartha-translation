  text: 'As David went to Ziklag, some men from Manasseh switched sides and joined him: Adnah, Jozabad, Jediael, Michael, another Jozabad, Elihu, and Zillethai. They were leaders of Manasseh’s divisions, known as “thousands.”[a]'
