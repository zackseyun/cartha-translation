  text: There were 120,000 from across the Jordan[a]—Reubenites, Gadites, and members of the half-tribe of Manasseh. They had every kind of military equipment for war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated “beyond the Jordan” or “on the other side of the Jordan,” depending on the geographical viewpoint.
    reason: lexical_alternative
