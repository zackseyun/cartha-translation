translation:
  language: en
  text: David went out before them and answered them, “If you have come peacefully to help me, my heart will be one with you. But if you have come to betray me to my enemies,[a] even though my hands are free of violence, may the God of our fathers see and judge.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “deceive me,” but here it suggests treachery involving David’s enemies.
    reason: lexical_alternative
  - marker: b
    text: The final word may also mean “rebuke” or “decide,” with God examining the matter and giving judgment.
    reason: alternative_reading
