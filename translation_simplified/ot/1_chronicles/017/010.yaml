translation:
  language: en
  text: since the time when I appointed judges over my people Israel. I will overpower all your enemies. What is more, I tell you that Yahweh will build you a house.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “build you a house” means establish a royal family line for you, while preserving the passage’s wordplay about a house for Yahweh.
    reason: lexical_alternative
