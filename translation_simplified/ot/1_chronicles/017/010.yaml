  preserved_meaning: The phrase points back to the period when God appointed Israel’s judges.
  reasoning_layer_used: lexical decision for וּלְמִיָּמִים
  rationale: “Since the time” expresses the temporal link in more natural modern English.
- pob_phrase: I will subdue all your enemies
  simplified_phrase: I will overpower all your enemies
  preserved_meaning: God promises decisive future action against every enemy.
  reasoning_layer_used: lexical decisions for וְהִכְנַעְתִּי and כָּל אֹיְבֶיךָ
  rationale: “Overpower” makes “subdue” immediately understandable without weakening its force.
- pob_phrase: Moreover, I tell you
