simplification_decisions:
- pob_phrase: Go and say to David my servant
  simplified_phrase: Go tell my servant David
  preserved_meaning: Yahweh commands the messenger to deliver these words to David, his servant.
  reasoning_layer_used: Lexical decisions for לֵךְ, וְאָמַרְתָּ, and עַבְדִּי
  rationale: Natural English uses “tell” and places “my servant” before David’s name.
- pob_phrase: Thus says Yahweh
  simplified_phrase: This is what Yahweh says
  preserved_meaning: The formal prophetic message still comes directly from Yahweh.
  reasoning_layer_used: Lexical decision for כֹּה אָמַר יְהוָה and theological decision on the divine name
  rationale: The common formula is clearer while retaining Yahweh’s covenant name.
- pob_phrase: You shall not build for me the house to dwell in
  simplified_phrase: You are not the one to build the house for me to dwell in
  preserved_meaning: David is specifically excluded as the person who will build Yahweh’s house.
  reasoning_layer_used: Lexical decision for לֹא אַתָּה and latest doctrine realignment
  rationale: This wording preserves the Hebrew emphasis on David rather than sounding like only a general prohibition.
