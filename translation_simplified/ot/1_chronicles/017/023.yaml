translation:
  language: en
  text: And now, Yahweh, make the word you have spoken about your servant and his house[a] stand firm forever. Do what you have said.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “house” can mean David’s household, family line, or royal dynasty.
    reason: lexical_alternative
