- pob_phrase: Now therefore, this is what you shall say
  simplified_phrase: So now, say this
  preserved_meaning: God directs the messenger to deliver what follows as a resulting next step.
  reasoning_layer_used: POB lexical decision for וְעַתָּה and כֹּה תֹאמַר
  rationale: The shorter wording keeps both the transition and the command.
- pob_phrase: from following the flock
  simplified_phrase: where you tended the sheep
  preserved_meaning: David had been doing a shepherd’s work before God elevated him.
  reasoning_layer_used: POB lexical decision for מִן אַחֲרֵי הַצֹּאן
  rationale: This makes the shepherd image immediately clear in ordinary English.
- pob_phrase: to be ruler over my people Israel
  simplified_phrase: and made you ruler over my people Israel
  preserved_meaning: God personally appointed David to govern Israel.
  reasoning_layer_used: POB lexical decisions for לְקַחְתִּיךָ and לִהְיוֹת נָגִיד
  rationale: The active clause clearly connects God’s initiative with David’s appointment.
