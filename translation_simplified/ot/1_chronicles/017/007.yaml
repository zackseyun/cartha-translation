translation:
  language: en
  text: 'So now, say this to my servant David: “This is what Yahweh of Hosts[a] says: I took you from the pasture, where you tended the sheep, and made you ruler over my people Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hosts” means armies and can include the armies of heaven.
    reason: simplification_note
