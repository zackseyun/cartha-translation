simplification_decisions:
- pob_phrase: I have been with you wherever you have gone
  simplified_phrase: I was with you wherever you went
  preserved_meaning: The LORD recounts his past presence and support throughout David’s journeys.
  reasoning_layer_used: lexical and theological decisions
  rationale: Simple past preserves the audited sequence of past faithfulness followed by a future promise.
- pob_phrase: I have cut off all your enemies from before you
  simplified_phrase: I cut off all your enemies, removing them from your path
  preserved_meaning: The LORD removed every enemy who stood against David.
  reasoning_layer_used: lexical decisions
  rationale: The wording keeps the Hebrew image “cut off” while explaining the spatial idiom.
- pob_phrase: I will make for you a name like the name of the great ones
  simplified_phrase: I will make your name famous, like the names of the great people
  preserved_meaning: The LORD promises David a reputation comparable to that of prominent people.
  reasoning_layer_used: lexical decisions
  rationale: Adding “famous” makes the biblical name idiom immediately understandable without removing it.
