translation:
  language: en
  text: Who is like your people Israel? They are one nation on earth. You, God, went out to redeem them as your own people and to make a name for yourself through great and fearsome deeds. You drove nations out before your people—the people you redeemed from Egypt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew wording at the end is difficult, and the parallel wording in 2 Samuel 7:23 is also textually uncertain.
    reason: textual_variant
simplification_decisions:
- pob_phrase: one nation on the earth, whom God went to redeem for himself as a people
  simplified_phrase: They are one nation on earth. You, God, went out to redeem them as your own people
  preserved_meaning: Israel is one nation whom God decisively acted to redeem as his people.
  reasoning_layer_used: Lexical decisions for גּוֹי אֶחָד, הָלַךְ, and לִפְדּוֹת לוֹ עָם
  rationale: Two direct sentences clarify the comparison while preserving God's movement and covenant redemption.
- pob_phrase: to make for yourself a name by great and fearsome deeds
  simplified_phrase: and to make a name for yourself through great and fearsome deeds
  preserved_meaning: God's redemptive acts establish his renown and inspire awe and dread.
  reasoning_layer_used: Lexical and theological decisions for לָשׂוּם לְךָ שֵׁם and נוראות
  rationale: The linked infinitive keeps God's renown connected to his redemptive action.
- pob_phrase: driving out nations from before your people, whom you redeemed from Egypt
  simplified_phrase: You drove nations out before your people—the people you redeemed from Egypt
  preserved_meaning: God expelled nations before Israel, whom he had redeemed from Egypt.
  reasoning_layer_used: Lexical decisions for לְגָרֵשׁ, מִפְּנֵי עַמְּךָ, and פָּדִיתָ
  rationale: A direct sentence makes the expulsion clear while retaining the spatial image.
