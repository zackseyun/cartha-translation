  rationale: Dropping “O” makes the address natural in modern English while retaining “Yahweh.”
- pob_phrase: there is none like you
  simplified_phrase: no one is like you
  preserved_meaning: No being compares with Yahweh.
  reasoning_layer_used: lexical decision for אֵין כָּמוֹךָ
  rationale: “No one” is clearer modern English than the formal “none.”
- pob_phrase: in all that we have heard with our own ears
