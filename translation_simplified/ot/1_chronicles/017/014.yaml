translation:
  language: en
  text: But I will give him a secure position in my house[a] and in my kingdom forever. His throne will be secure forever.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “My house” may mean God’s temple, his royal household, or his wider covenant domain.
    reason: alternative_reading
  - marker: b
