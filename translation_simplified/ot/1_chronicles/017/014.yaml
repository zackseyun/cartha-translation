simplification_decisions:
- pob_phrase: I will establish him in my house and in my kingdom
  simplified_phrase: I will give him a secure position in my house and in my kingdom
  preserved_meaning: God will firmly place the royal descendant within his house and kingdom.
  reasoning_layer_used: The lexical decision for וְהַעֲמַדְתִּיהוּ identifies firm establishment in a royal position.
  rationale: “Secure position” clearly conveys royal standing without sounding merely spatial.
- pob_phrase: his throne will be established forever
  simplified_phrase: His throne will be secure forever
  preserved_meaning: His throne will have enduring firmness and stability.
  reasoning_layer_used: The lexical decision for יִהְיֶה נָכוֹן permits “will be secure.”
  rationale: This states the future promise clearly without adding a continuative sense.
interpretive_expansions:
- pob_phrase: establish him
  rendering: give him a secure position
  claim: The establishment concerns a firm royal position rather than merely causing him to stand.
  evidence:
