translation:
  language: en
  text: Wherever I walked among all Israel,[a] did I ever say to any of Israel’s judges—whom I commanded to shepherd my people—‘Why have you not built me a house made of cedar wood?’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The parallel passage in 2 Samuel 7:7 has “tribes of Israel,” while the Hebrew text of Chronicles here has “judges.”
