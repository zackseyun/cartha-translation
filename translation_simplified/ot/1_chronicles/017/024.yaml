translation:
  language: en
  text: May your name be firmly established and held in great honor forever, as people say, “Yahweh of hosts,[a] the God of Israel, is God for Israel.”[b] And may the royal house of your servant David be firmly established in your presence.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hosts” refers to all the forces under Yahweh’s command.
    reason: simplification_note
  - marker: b
    text: This may also be rendered “is Israel’s God”; the Hebrew more literally says “is God for Israel.”
    reason: lexical_alternative
  - marker: c
    text: David’s “royal house” means his dynasty.
    reason: cultural_note
simplification_decisions:
- pob_phrase: May it be established, and may your name be magnified forever
  simplified_phrase: May your name be firmly established and held in great honor forever
  preserved_meaning: Yahweh’s name is the subject of both requests and is to remain established and greatly honored.
  reasoning_layer_used: Hebrew syntax, immediate context, and lexical decisions for וְיֵאָמֵן, וְיִגְדַּל, and שִׁמְךָ
  rationale: This restores the shared subject and expresses the honorific force of “magnified” in common English.
- pob_phrase: the house of David your servant
  simplified_phrase: the royal house of your servant David
  preserved_meaning: The prayer concerns the continuing royal dynasty of David, God’s servant.
  reasoning_layer_used: Lexical decision and cultural note for בַּיִת
  rationale: “Royal” clarifies the dynastic sense while preserving the biblical house image.
- pob_phrase: be established before you
  simplified_phrase: be firmly established in your presence
  preserved_meaning: David’s dynasty is prayed to remain secure before God.
  reasoning_layer_used: Lexical decisions for נָכוֹן and לְפָנֶיךָ
  rationale: “Firmly” conveys stability, and “in your presence” clarifies the relational phrase.
interpretive_expansions:
- pob_phrase: saying
  rendering: as people say
  claim: The expression introduces words spoken in acclamation of Yahweh.
  evidence:
  - The POB rationale says the expression introduces the acclamation that follows.
  confidence: moderate
  alternatives_preserved:
  - saying
  - namely
translation_notes:
  risk_flags:
  - risk: “As people say” supplies an implied human speaker not explicitly named in Hebrew.
    mitigation: It avoids imposing a strict purpose or result relation and preserves “saying” as an alternative.
  - risk: “Royal house” makes the dynastic sense explicit.
    mitigation: The wording retains the house image and explains the sense in a footnote.
