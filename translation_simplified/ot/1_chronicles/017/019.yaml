translation:
  language: en
  text: Yahweh, for the sake of your servant and as your heart desired,[a] you have done this great work so that all these great things would be known.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “according to your will.” Hebrew says “according to your heart.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew moves from one great work to the many great things it includes.
    reason: simplification_note
simplification_decisions:
- pob_phrase: according to your heart
  simplified_phrase: as your heart desired
  preserved_meaning: God acted from his own inner will while the Hebrew heart image remains.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The wording explains the metaphor without replacing it.
- pob_phrase: all this greatness
  simplified_phrase: this great work
  preserved_meaning: The singular summarizes God's great action on behalf of his servant.
  reasoning_layer_used: POB lexical decision and footnote b
  rationale: “Great work” is clearer English while preserving the singular summary.
- pob_phrase: to make known all these great things
  simplified_phrase: so that all these great things would be known
  preserved_meaning: God's action had the purpose of making its many expressions known.
  reasoning_layer_used: POB lexical decision for לְהוֹדִיעַ
  rationale: A purpose clause is easier to follow than the infinitive construction.
translation_notes:
  risk_flags:
  - risk: “Great work” is more concrete than the Hebrew abstraction “greatness.”
    mitigation: The footnote preserves the singular-to-plural movement and the context identifies God's action.
  - risk: “As your heart desired” may sound more emotional than the Hebrew intends.
    mitigation: The footnote gives “according to your will” as the intended alternative.
