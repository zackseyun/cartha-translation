translation:
  language: en
  text: Baal-hanan the Gederite was in charge of the olive trees and sycamore trees[b] in the Shephelah[a]. Joash was in charge of the stores of oil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Shephelah was the foothill region of Judah; the name can also be translated “the lowland.”
    reason: cultural_note
  - marker: b
    text: These may also be called “sycamore-fig trees.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Over the olive trees and the sycamore trees ... was Baal-hanan
  simplified_phrase: Baal-hanan ... was in charge of the olive trees and sycamore trees
  preserved_meaning: Baal-hanan had supervisory responsibility for these trees.
  reasoning_layer_used: POB lexical decision for וְעַל and the administrative context
  rationale: The direct clause order and “in charge of” make the official role immediately clear.
- pob_phrase: the Gederite
  simplified_phrase: the Gederite
  preserved_meaning: Baal-hanan is identified by his connection with Geder.
  reasoning_layer_used: POB lexical decision for הַגְּדֵרִי
  rationale: The established identity term is retained because replacing it adds no needed clarity.
- pob_phrase: and over the stores of oil was Joash
  simplified_phrase: Joash was in charge of the stores of oil
  preserved_meaning: Joash supervised the stored oil or its storage facilities.
  reasoning_layer_used: POB lexical decisions for וְעַל and אֹצְרוֹת
  rationale: A separate sentence and ordinary word order clarify Joash’s responsibility without narrowing what “stores” denotes.
translation_notes:
