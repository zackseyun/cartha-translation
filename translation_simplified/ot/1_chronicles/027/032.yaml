translation:
  language: en
  text: Jonathan, David’s uncle, was an adviser. He was discerning and was also a scribe.[a] Jehiel son of Hachmoni was with the king’s sons.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A scribe was a writing and administrative official.
    reason: cultural_note
  - marker: b
    text: The Hebrew simply says “was with”; it does not specify whether Jehiel served or supervised the king’s sons.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: was a counselor, a man of understanding, and a scribe
  simplified_phrase: was an adviser. He was discerning and was also a scribe.
  preserved_meaning: Jonathan officially gave counsel, had discernment, and served as a scribe.
  reasoning_layer_used: POB lexical decisions for יוֹעֵץ, אִישׁ מֵבִין, and סוֹפֵר
  rationale: Short clauses and common wording make Jonathan’s three qualities easier to distinguish.
- pob_phrase: was with the king’s sons
  simplified_phrase: was with the king’s sons
  preserved_meaning: Jehiel’s association with the king’s male children is stated without defining his role.
  reasoning_layer_used: POB lexical decisions for עִם and בְּנֵי הַמֶּלֶךְ
  rationale: The restrained wording preserves both the Hebrew’s gendered term and its uncertainty about Jehiel’s duties.
translation_notes:
  risk_flags:
