translation:
  language: en
  text: The Israelites were counted and organized into divisions. Their family heads,[a] commanders over thousands and hundreds, and officers served the king in all matters concerning these divisions. Each division numbered 24,000. Month by month throughout the year, one division came in for duty as another went out.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew “heads of fathers’ houses,” meaning leaders of extended ancestral families.
    reason: cultural_note
