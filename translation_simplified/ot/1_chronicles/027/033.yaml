translation:
  language: en
  text: Ahithophel served as the king’s counselor. Hushai the Archite was the king’s friend.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “companion” or “associate”; in a royal court, the word may refer to a trusted companion of the king.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And Ahithophel was counselor to the king
  simplified_phrase: Ahithophel served as the king’s counselor.
  preserved_meaning: Ahithophel held a role in which he gave counsel to the king.
  reasoning_layer_used: The lexical decisions identify יוֹעֵץ as a court counselor and לַמֶּלֶךְ as a relation of royal service.
  rationale: The possessive form and “served as” express the court role in more natural English.
- pob_phrase: and Hushai the Archite was the king’s friend
  simplified_phrase: Hushai the Archite was the king’s friend.
  preserved_meaning: Hushai, identified as the Archite, had a close relationship with the king.
  reasoning_layer_used: The lexical decisions retain the conventional title “Archite” and the plain sense “friend.”
  rationale: A separate sentence makes the two court relationships easier to follow.
translation_notes:
  risk_flags:
  - risk: Modern readers may hear “friend” as only a private friendship rather than a trusted court relationship.
    mitigation: The footnote preserves the broader senses “companion” and “associate” and notes the royal setting.
