translation:
  language: en
  text: Ner’s son was Kish, and Kish’s son was Saul. Saul’s sons were Jonathan, Malchi-shua, Abinadab, and Eshbaal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
