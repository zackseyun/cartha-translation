simplification_decisions:
- pob_phrase: Ner fathered Kish, and Kish fathered Saul
  simplified_phrase: Ner’s son was Kish, and Kish’s son was Saul
  preserved_meaning: The direct father-to-son line from Ner through Kish to Saul remains clear.
  reasoning_layer_used: Lexical decision for הוֹלִיד in a genealogy
  rationale: The son relationship expresses the same direct male descent in more familiar English.
- pob_phrase: and Saul fathered Jonathan, Malchi-shua, Abinadab, and Eshbaal
  simplified_phrase: Saul’s sons were Jonathan, Malchi-shua, Abinadab, and Eshbaal
  preserved_meaning: All four named men remain identified as Saul’s direct sons.
  reasoning_layer_used: Lexical decisions and original-language primacy
  rationale: A separate sentence makes the family relationship easier to follow while retaining every name.
translation_notes:
  risk_flags:
  - risk: Changing “fathered” to “son” wording could be read as less explicitly biological.
    mitigation: The genealogical context and direct possessive relationship preserve the intended male descent.
  - risk: Readers may know Eshbaal only as Ish-bosheth.
    mitigation: The main text keeps Chronicles’ Hebrew name, while the footnote supplies the name used in 2 Samuel.
