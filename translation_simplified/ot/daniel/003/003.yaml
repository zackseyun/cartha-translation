translation:
  language: en
  text: Then the provincial rulers[a], deputies, governors, advisers, treasurers, judges, other legal officials, and all the remaining provincial officials gathered for the dedication of the image[b] that King Nebuchadnezzar had set up. They stood in front of the image that Nebuchadnezzar had set up.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Aramaic names a specific Persian office traditionally called a satrap.
    reason: cultural_note
  - marker: b
    text: Or “statue”; the Aramaic term can refer to a physical image or a monumental figure.
    reason: lexical_alternative
