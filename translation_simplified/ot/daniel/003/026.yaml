translation:
  language: en
  text: Then Nebuchadnezzar approached the opening of the blazing furnace. He said, “Shadrach, Meshach, and Abed-nego, servants of the Most High God, come out! Come here!” So Shadrach, Meshach, and Abed-nego came out from inside the fire.
