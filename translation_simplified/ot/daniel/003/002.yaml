translation:
  language: en
  text: Then King Nebuchadnezzar sent word to gather the provincial rulers[a], prefects, governors, counselors, treasurers, judges, magistrates, and all the officials of the provinces. They were to come to the dedication of the image[b] he had set up.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Aramaic uses the Persian title “satraps” for these provincial rulers.
    reason: source_note
  - marker: b
    text: Or “statue.” The Aramaic word can mean an image generally or a monumental statue here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: sent to assemble
  simplified_phrase: sent word to gather
  preserved_meaning: The king summoned the officials to gather together.
  reasoning_layer_used: The lexical decisions allow “sent word” and “to gather” as clear equivalents.
  rationale: This replaces a formal construction with ordinary English while keeping the official summons.
- pob_phrase: the satraps
  simplified_phrase: the provincial rulers
  preserved_meaning: The title refers to Persian imperial authorities over provinces.
  reasoning_layer_used: The lexical decision lists “provincial governors” as an alternative while preserving “satraps” for historical precision.
  rationale: The main text explains the unfamiliar office, while the footnote retains its historical title.
- pob_phrase: to come to the dedication of the image that King Nebuchadnezzar had set up
  simplified_phrase: They were to come to the dedication of the image he had set up.
  preserved_meaning: All the listed officials were summoned to attend the dedication of Nebuchadnezzar’s image.
  reasoning_layer_used: The lexical decisions preserve “come,” “dedication,” “image,” and the prior act of setting it up.
  rationale: A new sentence and a pronoun make the purpose easier to follow without changing it.
translation_notes:
  risk_flags:
  - risk: “Provincial rulers” is less historically specific than “satraps.”
    mitigation: The footnote preserves the Persian title and its administrative setting.
  - risk: “Image” may suggest something smaller than the monumental object in context.
    mitigation: The footnote preserves “statue” as the contextual alternative.
