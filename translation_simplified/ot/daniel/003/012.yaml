  rationale: “Appointed to oversee” states their official responsibility in natural English without broadening it to the whole government.
- pob_phrase: have paid no attention to you
  simplified_phrase: pay no attention to you
  preserved_meaning: The accusers charge the men with ongoing disregard for the king.
  reasoning_layer_used: POB lexical decision and footnote for the Aramaic idiom
  rationale: The direct present tense keeps the accusation clear without adding an unstated command.
- pob_phrase: the golden image that you have set up
