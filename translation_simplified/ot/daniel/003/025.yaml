translation:
  language: en
  text: He said, “Look! I see four men walking in the middle of the fire. They are no longer tied up, and they are not hurt. The fourth looks like a son of the gods.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, following traditional Christian interpretation, “the Son of God.” The Aramaic more literally says “a son of the gods,” reflecting Nebuchadnezzar’s own perspective.
    reason: alternative_reading
