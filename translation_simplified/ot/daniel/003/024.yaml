translation:
  language: en
  text: Then King Nebuchadnezzar was shocked and jumped to his feet. He asked his counselors, “Didn’t we throw three men into the middle of the fire while they were tied up?” They replied, “Certainly, Your Majesty.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: was astonished and rose up in haste
  simplified_phrase: was shocked and jumped to his feet
  preserved_meaning: The king reacts with startled alarm and rises suddenly.
  reasoning_layer_used: POB lexical decisions for תְּוַהּ and בְּהִתְבְּהָלָה
  rationale: The new wording combines surprise and hurried movement in natural modern English.
- pob_phrase: He answered and said to his counselors
  simplified_phrase: He asked his counselors
  preserved_meaning: The king addresses his court advisers with a question.
  reasoning_layer_used: POB lexical decision for the Semitic speech formula and לְהַדָּבְרוֹהִי
  rationale: English does not need the repeated speech formula when the following words are clearly a question.
- pob_phrase: three men, bound, into the midst of the fire
  simplified_phrase: three men into the middle of the fire while they were tied up
  preserved_meaning: All three men were restrained when they were thrown into the fire's interior.
  reasoning_layer_used: POB lexical decisions for מְכַפְּתִין and לְגוֹא נוּרָא
  rationale: The clause makes their restrained condition clear while preserving the spatial force of “middle.”
