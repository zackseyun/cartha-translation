translation:
  language: en
  text: 'I now issue this decree: Anyone from any people, nation, or language who says anything offensive[a] against the God of Shadrach, Meshach, and Abed-nego will be torn limb from limb, and that person’s house will be left in ruins.[b] For no other god is able to rescue like this.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “who blasphemes.”
    reason: lexical_alternative
  - marker: b
    text: The Aramaic may imply a disgraceful heap or dunghill.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And from me a decree is issued
  simplified_phrase: I now issue this decree
  preserved_meaning: The king formally announces a binding decree.
  reasoning_layer_used: POB lexical decision for שִׂים טְעֵם
  rationale: The active wording is easier to follow while retaining the royal proclamation.
- pob_phrase: any people, nation, or language that speaks
  simplified_phrase: Anyone from any people, nation, or language who says
  preserved_meaning: The decree applies across every ethnic, national, and language group.
  reasoning_layer_used: POB lexical decision for עַם אֻמָּה וְלִשָּׁן
  rationale: Naming an individual from each group makes the sentence natural without weakening its universal scope.
- pob_phrase: his house shall be made a ruin
  simplified_phrase: that person’s house will be left in ruins
  preserved_meaning: The offender’s household property will be destroyed and disgraced.
  reasoning_layer_used: POB lexical decision for נְוָלִי יִשְׁתַּוֵּה
  rationale: The concrete plural “ruins” clearly communicates destruction while the footnote preserves the debated nuance.
translation_notes:
  risk_flags:
