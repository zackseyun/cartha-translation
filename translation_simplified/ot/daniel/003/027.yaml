translation:
  language: en
  text: The provincial rulers[a], high officials, governors, and the king’s advisers gathered together. They saw that the fire had no power over these men’s bodies. The hair on their heads was not singed, their clothing[b] was unchanged, and there was no smell of fire on them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Aramaic title is “satraps,” rulers of provinces in the Persian system.
    reason: cultural_note
  - marker: b
    text: The exact kind of garment is uncertain; it may refer to their cloaks.
    reason: lexical_alternative
