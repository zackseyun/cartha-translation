translation:
  language: en
  text: 'Now, if you are ready, this is what you must do: When you hear the horn, pipe, lyre, triangular harp,[a] harp, bagpipe,[b] and every kind of music, fall down and worship the image I made. If you do, all will be well. But if you do not worship it, you will immediately be thrown deep into a blazing furnace of fire. Then who is the god who will rescue you from my hands?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The exact instrument is uncertain; it is also called a trigon.
    reason: lexical_alternative
  - marker: b
    text: The instrument may instead have been a double pipe.
    reason: lexical_alternative
