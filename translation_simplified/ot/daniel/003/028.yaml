translation:
  language: en
  text: Nebuchadnezzar declared, “Blessed be the God of Shadrach, Meshach, and Abed-nego! He sent his angel[a] and rescued his servants, who trusted in him. They refused to obey the king’s command and were willing to give up their bodies rather than serve or worship any god except their own God.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “messenger.” The Aramaic word can mean either “angel” or “messenger.”
    reason: lexical_alternative
