  simplified_phrase: about 90 feet (27 meters) high and 9 feet (2.7 meters) wide
  preserved_meaning: The image’s ancient measurements are expressed as approximate modern equivalents.
  reasoning_layer_used: POB lexical decisions and cultural note on the cubit
  rationale: Modern units make the image’s great height and narrow width immediately understandable.
- pob_phrase: an image of gold
  simplified_phrase: an image of gold
  preserved_meaning: The wording remains neutral about the object’s precise form and leaves open whether it was solid gold or gold-covered.
  reasoning_layer_used: POB lexical and theological decisions for צְלֵם and דִּי דְהַב
  rationale: The key wording is retained because “statue” is narrower and “idol” would anticipate the later narrative.
- pob_phrase: He set it up in the plain of Dura, in the province of Babylon
  simplified_phrase: He set it up on the plain of Dura, in the province of Babylon
  preserved_meaning: Nebuchadnezzar installed the image in the named level region within Babylon’s province.
  reasoning_layer_used: POB lexical decisions for אֲקִימֵהּ, בְּבִקְעַת, and בִּמְדִינַת בָּבֶל
  rationale: “On the plain” is more natural English for placing a monument in a level area.
