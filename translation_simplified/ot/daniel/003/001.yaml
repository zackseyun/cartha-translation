translation:
  language: en
  text: King Nebuchadnezzar made an image of gold.[a] It was about 90 feet (27 meters) high and 9 feet (2.7 meters) wide.[b] He set it up on the plain of Dura, in the province of Babylon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Aramaic word can also mean “statue.” The later context shows that the image was used as an idol, but this verse does not yet call it one.
    reason: lexical_alternative
  - marker: b
    text: The Aramaic gives the measurements as sixty cubits high and six cubits wide; a cubit was roughly the length of a forearm.
    reason: cultural_note
