translation:
  language: en
  text: When you hear the sound of the horn, pipe, lyre, triangular stringed instrument,[a] zither, bagpipe,[b] and every kind of music, you must fall down and pay homage[c] to the gold statue that King Nebuchadnezzar has set up.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The exact instrument is uncertain. It was traditionally understood as a triangular stringed instrument; “trigon” and “triangle harp” are other possible renderings.
    reason: lexical_alternative
  - marker: b
    text: The exact instrument is uncertain; it may have been a double pipe rather than a bagpipe.
    reason: lexical_alternative
  - marker: c
    text: Or “worship”; the Aramaic word refers to bowing in reverence and here describes idolatrous homage.
    reason: alternative_reading
