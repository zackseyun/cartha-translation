translation:
  language: en
  text: At that very moment, the fingers of a human hand came out and wrote on the plaster of the king’s palace wall, opposite the lampstand. The king saw the palm of the hand as it was writing.[a]
  philosophy: optimal-equivalence
  footnotes:
