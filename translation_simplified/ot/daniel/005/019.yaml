translation:
  language: en
  text: Because of the greatness he had been given,[a] all peoples, nations, and language groups were terrified and trembled before him. He killed anyone he wanted and let anyone he wanted live. He raised anyone he wanted to a high position and humbled anyone he wanted.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The previous verse identifies God as the one who gave him this greatness.
    reason: cross_reference
simplification_decisions:
- pob_phrase: the greatness that he gave him
  simplified_phrase: the greatness he had been given
  preserved_meaning: The king received his greatness from the giver identified in the previous verse.
  reasoning_layer_used: theological decision on implicit divine agency
  rationale: The passive wording clears up the pronoun chain without naming God in the main text.
- pob_phrase: all peoples, nations, and languages
  simplified_phrase: all peoples, nations, and language groups
  preserved_meaning: The triad includes every kind of people under his imperial rule.
  reasoning_layer_used: lexical decision for the conventional Danielic triad
  rationale: “Language groups” clearly refers to people distinguished by language.
- pob_phrase: were trembling and fearing before him
  simplified_phrase: were terrified and trembled before him
  preserved_meaning: The peoples felt intense fear and physically trembled in the king’s presence.
  reasoning_layer_used: lexical decisions for the paired participles and presence idiom
  rationale: The wording keeps both fear and trembling in natural English.
interpretive_expansions:
- pob_phrase: he raised up
  rendering: He raised anyone he wanted to a high position
  claim: The raising refers to elevating a person’s rank or status.
  evidence:
  - The lexical rationale identifies “raised up” as figurative elevation of status.
  - Its contrast with “humbled” supports a change in rank and honor.
  confidence: high
  alternatives_preserved:
  - raised up
  - promoted
  - exalted
