translation:
  language: en
  text: This was because Daniel—whom the king named Belteshazzar—had an extraordinary spirit,[a] knowledge, and understanding. He could interpret dreams, explain riddles, and untangle difficult problems. So call for Daniel now, and he will explain what it means.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “an excellent spirit.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: were found in him, in Daniel
  simplified_phrase: Daniel ... had
  preserved_meaning: Daniel possessed the extraordinary qualities and abilities listed.
  reasoning_layer_used: POB lexical decision on הִשְׁתְּכַחַת בֵּהּ
  rationale: The active wording is easier to follow than the literal passive construction.
- pob_phrase: solve difficulties
  simplified_phrase: untangle difficult problems
  preserved_meaning: Daniel could resolve matters that were hard to understand.
  reasoning_layer_used: POB lexical decision on מְשָׁרֵא קִטְרִין
  rationale: “Untangle” keeps the source image of loosening knots while making the idiom clear.
- pob_phrase: let Daniel be called ... he will show the interpretation
  simplified_phrase: call for Daniel ... he will explain what it means
  preserved_meaning: The queen urges the king to summon Daniel because he can make the interpretation known.
  reasoning_layer_used: POB lexical decisions on יִתְקְרֵי and פִשְׁרָה יְהַחֲוֵה
  rationale: Direct modern wording preserves both the command and Daniel’s promised explanation.
translation_notes:
  risk_flags:
  - risk: “Extraordinary spirit” could be read as explicitly naming the divine Spirit.
    mitigation: The wording and footnote preserve the POB ambiguity without identifying the spirit’s source.
