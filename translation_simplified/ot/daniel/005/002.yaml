translation:
  language: en
  text: As Belshazzar drank the wine,[a] he ordered the gold and silver vessels to be brought in. Nebuchadnezzar, his father,[b] had taken them from the temple in Jerusalem. The king, his nobles, his wives, and his concubines were to drink from them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “while under the influence of the wine”; the Aramaic literally says “in the taste of the wine.”
    reason: lexical_alternative
  - marker: b
    text: In royal usage, “father” can also mean “ancestor” or “predecessor.”
    reason: alternative_reading
