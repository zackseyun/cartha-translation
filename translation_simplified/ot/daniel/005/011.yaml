translation:
  language: en
  text: There is a man in your kingdom who has a spirit of the holy gods in him.[a] In your father’s time, this man was found to have light, insight, and wisdom like the wisdom of the gods. Your father, King Nebuchadnezzar, appointed him head of the magicians, enchanters, Chaldean wise men, and diviners. It was your father the king who did this.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Spirit of the holy God” or “the spirit of the holy God.” The Aramaic says “gods,” but some understand the queen to mean the one true God.
    reason: alternative_reading
  - marker: b
    text: Here “father” may also mean an ancestor or a previous king in the dynasty.
    reason: cultural_note
simplification_decisions:
- pob_phrase: in whom is a spirit of the holy gods
  simplified_phrase: who has a spirit of the holy gods in him
  preserved_meaning: The spirit is present within the man, and the queen describes it in plural pagan terms.
  reasoning_layer_used: lexical and theological decisions
  rationale: Ordinary clause order improves clarity while retaining the indwelling image and plural wording.
- pob_phrase: in the days of your father
  simplified_phrase: In your father’s time
  preserved_meaning: These qualities were evident during Nebuchadnezzar’s reign.
  reasoning_layer_used: lexical decision and cultural note
  rationale: The modern time expression keeps “father” while the footnote preserves its broader dynastic sense.
- pob_phrase: appointed him chief of the magicians, enchanters, Chaldeans, and diviners—your father, the king
  simplified_phrase: appointed him head of the magicians, enchanters, Chaldean wise men, and diviners. It was your father the king who did this.
  preserved_meaning: Nebuchadnezzar placed him over four distinct groups of court specialists, with emphatic repetition of the king’s role.
  reasoning_layer_used: lexical decisions and source rhetoric
  rationale: Two sentences clarify the appointment and preserve the source’s repeated emphasis.
interpretive_expansions:
- pob_phrase: Chaldeans
  rendering: Chaldean wise men
  claim: Here “Chaldeans” identifies a class of Babylonian court experts rather than merely an ethnic group.
  evidence:
  - The POB lexical decision says the term often denotes Babylonian wise men in Daniel.
  - The immediate list consists of court specialists in occult and interpretive arts.
  confidence: high
  alternatives_preserved:
  - Chaldeans
translation_notes:
  risk_flags:
  - risk: Modern readers may take “father” to mean only Belshazzar’s biological father.
    mitigation: The main text retains the source wording, and footnote b explains the dynastic sense.
  - risk: The plural “holy gods” may sound like the narrator’s theology rather than the queen’s courtly language.
    mitigation: Footnote a preserves the singular interpretation while the main text follows the Aramaic plural and narrative viewpoint.
