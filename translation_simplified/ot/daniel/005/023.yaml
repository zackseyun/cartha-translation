- pob_phrase: have exalted yourself against
  simplified_phrase: have raised yourself up against
  preserved_meaning: The king arrogantly set himself above and against God.
  reasoning_layer_used: Lexical decision for הִתְרוֹמַמְתָּ
  rationale: The familiar wording preserves the upward image of self-exaltation.
- pob_phrase: the vessels of his house
  simplified_phrase: the vessels from his temple
  preserved_meaning: These were implements taken from God's temple in Jerusalem.
  reasoning_layer_used: Lexical decisions for מָאנַיָּא and בַיְתֵהּ
  rationale: “Temple” makes the intended meaning of God's house immediately clear.
- pob_phrase: the God in whose hand is your breath, and to whom belong all your ways
  simplified_phrase: the God who holds your breath in his hand and to whom every path you take belongs
  preserved_meaning: God rules over the king's life and his entire course of conduct.
  reasoning_layer_used: Lexical and theological decisions on נִשְׁמְתָךְ and אֹרְחָתָךְ
  rationale: This keeps the breath-in-hand and path images while making the grammar natural.
