translation:
  language: en
  text: But you have raised yourself up against the Lord of heaven.[a] The vessels from his temple were brought before you, and you, your nobles, your wives, and your concubines have been drinking wine from them. You praised gods made of silver, gold, bronze, iron, wood, and stone—gods that do not see, hear, or know. But you have not honored the God who holds your breath in his hand and to whom every path you take belongs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Master of heaven.”
    reason: lexical_alternative
