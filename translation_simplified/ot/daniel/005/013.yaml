translation:
  language: en
  text: Then Daniel was brought into the king’s presence. The king said to Daniel, “Are you that Daniel, one of the people whom my father the king took from Judah into exile?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “my father” may mean “my predecessor”—an ancestor or earlier king, not necessarily the king’s biological father.
    reason: cultural_note
