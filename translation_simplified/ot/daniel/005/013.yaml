- pob_phrase: one of the exiles of Judah, whom the king my father brought from Judah
  simplified_phrase: one of the people whom my father the king took from Judah into exile
  preserved_meaning: Daniel belonged to the Judean community deported by the earlier king.
  reasoning_layer_used: Lexical decisions for בְּנֵי גָלוּתָא and the relative clause
  rationale: This clearly describes Daniel’s deportation and uses natural English title order.
