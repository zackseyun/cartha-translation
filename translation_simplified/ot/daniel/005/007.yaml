translation:
  language: en
  text: The king shouted for the enchanters, the Chaldeans,[a] and the diviners to be brought in. He told Babylon’s wise men, “Whoever reads this writing and tells me what it means will wear purple clothing and a gold chain around his neck. He will become the third-highest ruler in the kingdom.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “Chaldeans” may refer to a class of Babylonian court sages or astrologers, not only to an ethnic group.
    reason: lexical_alternative
