simplification_decisions:
- pob_phrase: answered and said before the king
  simplified_phrase: answered in the king’s presence
  preserved_meaning: Daniel responded while standing in the royal court.
  reasoning_layer_used: Lexical decisions for עָנֵה ... וְאָמַר and קֳדָם מַלְכָּא
  rationale: The paired speech verbs are compressed while the response and courtly setting remain clear.
- pob_phrase: Let your gifts remain yours
  simplified_phrase: Keep your gifts for yourself
  preserved_meaning: Daniel directly refuses the king’s offered gifts.
  reasoning_layer_used: Lexical decision for לָךְ לֶהֶוְיָן and latest revision
  rationale: The direct command makes Daniel’s refusal immediately understandable.
- pob_phrase: make its interpretation known to him
  simplified_phrase: tell him what it means
  preserved_meaning: Daniel promises to explain the mysterious writing to the king.
  reasoning_layer_used: Lexical decisions for פִשְׁרָא and אֲהוֹדְעִנֵּהּ
  rationale: Common wording preserves both the interpretation and its communication to the king.
