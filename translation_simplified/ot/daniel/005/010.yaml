translation:
  language: en
  text: Because of what the king and his nobles were saying, the queen came into the banquet hall. She said,[a] “O king, live forever! Do not let your thoughts terrify you. Do not let your face grow pale.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Aramaic can also be translated “answered and said,” but it may simply introduce speech.
    reason: lexical_alternative
  - marker: b
    text: Literally, “do not let your brightness change,” an expression describing the fearful change in someone’s face.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Because of the words of the king and his nobles
  simplified_phrase: Because of what the king and his nobles were saying
  preserved_meaning: Their speech caused the queen to enter the hall.
  reasoning_layer_used: Lexical rationale for לָקֳבֵל and מִלֵּי
  rationale: This recasts the abstract phrase as natural English without changing its cause-and-speech sense.
- pob_phrase: The queen spoke and said
  simplified_phrase: She said
  preserved_meaning: The queen began speaking to the king.
  reasoning_layer_used: Lexical rationale for עֲנָת ... וַאֲמֶרֶת
  rationale: The shorter English speech formula avoids an awkward double verb while the footnote preserves the alternative.
- pob_phrase: Do not let your thoughts terrify you, and do not let your face grow pale
  simplified_phrase: Do not let your thoughts terrify you. Do not let your face grow pale.
  preserved_meaning: The queen gives two distinct commands about the king’s inner fear and visible distress.
  reasoning_layer_used: Lexical decisions and doctrine realignment
  rationale: Two sentences make both commands easier to follow while retaining the approved facial-color idiom.
