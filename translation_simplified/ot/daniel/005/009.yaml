translation:
  language: en
  text: Then King Belshazzar became very alarmed. His face lost its color,[a] and his leading officials were confused.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “his appearance changed.” Fear caused a visible change in his face.
