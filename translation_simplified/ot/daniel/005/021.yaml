translation:
  language: en
  text: He was driven away from other people. His mind was made like that of an animal, and he lived among wild donkeys. He was given grass to eat like oxen, and dew from the sky drenched his body. This continued until he understood that the Most High God rules over the realm of human rule and appoints whomever he chooses over it.
  philosophy: optimal-equivalence
