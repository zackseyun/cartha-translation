  simplified_phrase: driven away from other people
  preserved_meaning: He was forcibly removed from human society.
  reasoning_layer_used: POB lexical decisions for טְרִיד and בְּנֵי אֲנָשָׁא
  rationale: The wording explains the human contrast while preserving his forced removal.
- pob_phrase: his heart was made like the beasts
  simplified_phrase: his mind was made like that of an animal
  preserved_meaning: His inner mind and disposition were made animal-like.
  reasoning_layer_used: POB lexical decision for לִבְבֵהּ and its stated alternative
  rationale: “Mind” clarifies the sense of “heart” while retaining the passive animal comparison.
- pob_phrase: his dwelling was with the wild donkeys; he was fed grass like oxen; his body was drenched with the dew of heaven
  simplified_phrase: he lived among wild donkeys. He was given grass to eat like oxen, and dew from the sky drenched his body
  preserved_meaning: He lived like an animal outdoors, eating grass and becoming thoroughly wet with dew.
  reasoning_layer_used: POB lexical decisions for dwelling, wild donkeys, grass, oxen, body, and drenched
  rationale: Direct clauses clarify the scene while preserving each concrete image.
