translation:
  language: en
  text: Then the gold vessels taken from God’s temple in Jerusalem were brought in. The king, his nobles, his wives[a], and his concubines[b] drank from them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Aramaic term can refer to royal consorts; some translate it “queens.”
    reason: lexical_alternative
  - marker: b
    text: Concubines were recognized partners who had a lower status than wives.
    reason: cultural_note
simplification_decisions:
- pob_phrase: the temple, the house of God, which was in Jerusalem
  simplified_phrase: God’s temple in Jerusalem
  preserved_meaning: The temple is identified as God’s house and located in Jerusalem.
  reasoning_layer_used: POB lexical decisions for הֵיכְלָא, בֵית אֱלָהָא, and בִירוּשְׁלֶם
  rationale: The shorter possessive form preserves the apposition without the dense relative clauses.
- pob_phrase: and the king and his nobles, his wives and his concubines drank from them
  simplified_phrase: The king, his nobles, his wives, and his concubines drank from them.
  preserved_meaning: All four groups used the sacred vessels as drinking containers.
  reasoning_layer_used: POB lexical decisions for the participants and וְאִשְׁתִּיו בְּהוֹן
  rationale: A new sentence makes the action and its participants easier to follow.
translation_notes:
  risk_flags:
  - risk: “God’s temple” compresses the biblical expression “the house of God.”
    mitigation: The wording preserves both divine ownership and the identification of the building as the temple.
