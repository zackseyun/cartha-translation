translation:
  language: en
  text: Daniel and his companions were to seek mercy from the God of heaven about this mystery,[a] so that they would not perish with the rest of Babylon’s wise men.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “secret.” Here “mystery” means a hidden matter that requires revelation from God.
