translation:
  language: en
  text: You saw a stone cut from the mountain, though no human hands cut it. It crushed the iron, bronze, clay, silver, and gold. By showing you this, the great God has revealed to the king what will happen after this. The dream is certain, and its interpretation can be trusted.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: a stone was cut from the mountain not by hands
  simplified_phrase: a stone cut from the mountain, though no human hands cut it
  preserved_meaning: The stone was cut without human agency, while the image of hands and the unstated agent remain.
  reasoning_layer_used: POB lexical footnote and theological decision
  rationale: Adding “human” makes the idiom clear without naming who cut the stone.
- pob_phrase: and that it crushed the iron, the bronze, the clay, the silver, and the gold
  simplified_phrase: It crushed the iron, bronze, clay, silver, and gold.
  preserved_meaning: The stone crushes every listed material in the statue.
  reasoning_layer_used: POB lexical decisions
  rationale: A separate sentence makes the action and list easier to follow.
- pob_phrase: The dream is certain, and its interpretation is trustworthy.
  simplified_phrase: The dream is certain, and its interpretation can be trusted.
  preserved_meaning: Both the dream and its interpretation are dependable.
  reasoning_layer_used: POB lexical decisions
  rationale: “Can be trusted” expresses “trustworthy” in more familiar wording.
interpretive_expansions:
- pob_phrase: Just as you saw that
  rendering: By showing you this
  claim: The vision is how God disclosed what would happen.
