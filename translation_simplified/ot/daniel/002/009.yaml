translation:
  language: en
  text: But if you do not tell me what the dream was, only one decree applies to all of you.[a] You have agreed to speak lying and corrupt words to me until circumstances change. So tell me the dream. Then I will know that you can tell me what it means.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Aramaic word can mean a royal decree, law, or judicial sentence.
    reason: lexical_alternative
