translation:
  language: en
  text: During the time of those kings,[a] the God of heaven will establish a kingdom that can never be destroyed. It will never pass into the hands of another people. It will crush all these kingdoms and bring them to an end, but it will stand forever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Those kings” refers to the kings or kingdoms pictured in Nebuchadnezzar’s dream, but their precise historical identity is disputed.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And in the days of those kings
  simplified_phrase: During the time of those kings
  preserved_meaning: God establishes the kingdom within the period associated with the previously mentioned kings.
  reasoning_layer_used: Lexical decision and theological decision on the referent of “those kings.”
  rationale: “During the time” expresses the temporal phrase in ordinary English without narrowing the disputed referent.
- pob_phrase: will set up a kingdom that will never be destroyed
  simplified_phrase: will establish a kingdom that can never be destroyed
  preserved_meaning: God founds a permanently indestructible kingdom.
  reasoning_layer_used: Lexical decisions for יְקִים and the negative enduring clause.
  rationale: “Establish” is immediately clear while retaining God as the kingdom’s founder.
- pob_phrase: It will crush and put an end to all these kingdoms
  simplified_phrase: It will crush all these kingdoms and bring them to an end
  preserved_meaning: God’s kingdom both shatters the other kingdoms and ends their rule.
  reasoning_layer_used: Distinct lexical decisions for תַּדִּק and וְתָסֵיף.
  rationale: The reordered wording is natural English and keeps both forceful actions distinct.
interpretive_expansions:
- pob_phrase: the kingdom will not be left to another people
  rendering: It will never pass into the hands of another people.
  claim: The kingdom will not pass into another people’s possession or control.
  evidence:
  - The lexical rationale says the kingdom will not pass into the possession of another people.
  - The immediate context contrasts this kingdom’s permanence with the succession of human kingdoms.
  confidence: high
  alternatives_preserved:
  - will not be left to another people
  - will not be given over to another people
translation_notes:
  risk_flags:
  - risk: “Those kings” may be taken as identifying one specific historical group.
    mitigation: The footnote preserves the POB’s documented uncertainty about the precise referent.
