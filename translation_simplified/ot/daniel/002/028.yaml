translation:
  language: en
  text: 'But there is a God in heaven[a] who reveals mysteries. He has made known to King Nebuchadnezzar what will happen in the later days.[b] This was your dream, and these were the visions in your head as you lay on your bed:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Aramaic formally says “a God in heaven,” though in context Daniel means the true God.
    reason: alternative_reading
  - marker: b
    text: Also “the last days”; this may refer to a climactic future period without specifying a particular end-times framework.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: who reveals mysteries, and he has made known
  simplified_phrase: who reveals mysteries. He has made known
  preserved_meaning: God characteristically reveals hidden matters and has disclosed this particular future to the king.
  reasoning_layer_used: Lexical decisions for גָּלֵא and וְהוֹדַע
  rationale: Splitting the sentence improves readability while preserving the two distinct actions.
- pob_phrase: in the latter days
  simplified_phrase: in the later days
  preserved_meaning: The dream concerns a future period that may have climactic significance.
  reasoning_layer_used: Temporal theological decision for בְּאַחֲרִית יוֹמַיָּא
  rationale: “Later” is more familiar than “latter,” while the footnote preserves the phrase’s open-ended force.
- pob_phrase: the visions of your head
  simplified_phrase: the visions in your head
  preserved_meaning: Nebuchadnezzar experienced mental visions while lying in bed.
  reasoning_layer_used: Lexical decision for וְחֶזְוֵי רֵאשָׁךְ
  rationale: The natural preposition clarifies the idiom without removing its head imagery.
translation_notes:
  risk_flags:
