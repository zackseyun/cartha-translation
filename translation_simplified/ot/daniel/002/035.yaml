translation:
  language: en
  text: Then the iron, clay, bronze, silver, and gold were all crushed at once. They became like chaff on a threshing floor in summer, and the wind carried them away, leaving no trace. But the stone that struck the statue became a great mountain and filled the whole earth.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Earth” can also mean “land,” but the wider scope of the vision favors “earth” here.
    reason: alternative_reading
