translation:
  language: en
  text: The king replied, “I am certain that you are trying to buy time, because you realize that the matter[a] has gone from me.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean “the word has gone from me,” “the matter has escaped me,” or “my command is firm.” The Aramaic can be understood in more than one way here.
    reason: alternative_reading
