translation:
  language: en
  text: The iron you saw was mixed with clay. In the same way, they will mix themselves with the seed of man.[a] Yet they will not hold together with one another, just as iron does not mix with pottery.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Aramaic phrase can also be translated “human seed.” It may refer to intermarriage, but its precise meaning is uncertain.
    reason: lexical_alternative
