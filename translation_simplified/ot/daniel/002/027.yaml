translation:
  language: en
  text: Daniel replied in the king’s presence, “No wise men, enchanters[b], magicians, or diviners can reveal to the king the mystery[a] he is asking about.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “secret.” “Mystery” preserves the chapter’s theme of a hidden matter that only God can disclose.
    reason: lexical_alternative
  - marker: b
    text: “Enchanters” names one class of Babylonian specialists; “astrologers” is a traditional alternative.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: answered before the king and said
  simplified_phrase: replied in the king’s presence
  preserved_meaning: Daniel responds while standing in the royal court.
  reasoning_layer_used: Lexical decisions for עָנֵה and קֳדָם
  rationale: This removes a repetitive speech formula while keeping the formal court setting.
- pob_phrase: The mystery that the king asks
  simplified_phrase: the mystery he is asking about
  preserved_meaning: The mystery is the hidden matter currently requested by the king.
  reasoning_layer_used: Lexical decisions for רָזָה and שָׁאֵל
  rationale: The new clause uses natural English without weakening the chapter’s mystery theme.
- pob_phrase: are able to make known to the king
  simplified_phrase: can reveal to the king
  preserved_meaning: The specialists lack the ability to disclose the mystery to the king.
  reasoning_layer_used: Lexical decisions for יָכְלִין and לְהַחֲוָיָה
  rationale: “Can reveal” states the same capability and disclosure more directly.
