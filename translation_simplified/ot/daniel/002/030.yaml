translation:
  language: en
  text: But this mystery[a] was not revealed to me because I am wiser than everyone else alive. It was revealed so that you, the king, could learn what it means and understand the thoughts of your heart.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “secret”; in Daniel, this is a hidden matter disclosed by God.
    reason: lexical_alternative
  - marker: b
    text: Here “heart” includes a person’s mind and inner thoughts.
    reason: simplification_note
simplification_decisions:
- pob_phrase: not because of wisdom that is in me more than in all the living
  simplified_phrase: not ... because I am wiser than everyone else alive
  preserved_meaning: Daniel denies that the revelation came because his wisdom surpassed that of other living people.
  reasoning_layer_used: lexical and theological decisions
  rationale: The direct comparison is clearer while preserving Daniel’s humility.
- pob_phrase: the interpretation may be made known to the king
  simplified_phrase: you, the king, could learn what it means
  preserved_meaning: The revelation enables the king to know the dream’s interpretation.
  reasoning_layer_used: lexical decision for פִשְׁרָא and purpose-clause analysis
  rationale: “Learn what it means” explains “interpretation” in ordinary English.
- pob_phrase: the thoughts of your heart
  simplified_phrase: the thoughts of your heart
  preserved_meaning: The biblical heart includes thought and inward reflection.
  reasoning_layer_used: theological decision on anthropological language
  rationale: The source image is retained and clarified in a note.
