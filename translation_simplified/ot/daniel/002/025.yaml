translation:
  language: en
  text: Then Arioch quickly brought Daniel to the king and said, “I have found a man among the exiles from Judah[a] who will tell the king the interpretation.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “among the Jewish exiles” or “among the Judean exiles.” The Aramaic identifies Daniel as belonging to the people of Judah in exile.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: hurriedly brought Daniel before the king
  simplified_phrase: quickly brought Daniel to the king
  preserved_meaning: Arioch urgently took Daniel into the king’s presence.
  reasoning_layer_used: Lexical decisions for בְּהִתְבְּהָלָה, הַנְעֵל, and קֳדָם מַלְכָּא
  rationale: Common wording preserves both the haste and the royal audience.
- pob_phrase: from among the exiles of Judah
  simplified_phrase: among the exiles from Judah
  preserved_meaning: Daniel belonged to the people of Judah who were living in exile.
  reasoning_layer_used: Lexical and theological decision for דִּי יְהוּד
  rationale: The recast phrase is easier to follow while retaining Judah and the exilic setting.
- pob_phrase: will make the interpretation known to the king
  simplified_phrase: will tell the king the interpretation
  preserved_meaning: Daniel will communicate the interpretation to the king.
  reasoning_layer_used: Lexical decisions for פִשְׁרָא and יְהוֹדַע
  rationale: “Tell” simplifies the causative expression while “interpretation” preserves Daniel’s key technical term.
