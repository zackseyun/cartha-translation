simplification_decisions:
- pob_phrase: You, O king, are the king of kings
  simplified_phrase: O king, you are the king of kings.
  preserved_meaning: The king is addressed directly and given the superlative royal title “king of kings.”
  reasoning_layer_used: POB lexical decisions for מַלְכָּא and מֶלֶךְ מַלְכַיָּא
  rationale: Reordering the address makes the sentence easier to follow without weakening the title.
- pob_phrase: to whom the God of heaven has given the kingdom, the might, the power, and the glory
  simplified_phrase: The God of heaven has given you the kingdom, might, power, and glory.
  preserved_meaning: Nebuchadnezzar’s rule and royal greatness are gifts from the God of heaven.
  reasoning_layer_used: POB lexical and theological decisions on the divine gift
  rationale: A separate direct sentence clearly identifies God as the giver and the king as the recipient.
