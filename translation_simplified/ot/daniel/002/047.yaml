translation:
  language: en
  text: The king said to Daniel, “Truly, your God is God of gods and Lord of kings. He reveals mysteries,[a] because you were able to reveal this mystery.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “secrets.” “Mysteries” refers to hidden matters that God reveals.
    reason: lexical_alternative
