translation:
  language: en
  text: The king replied to the Chaldeans[a], “What I have said is firm:[b] If you do not tell me the dream and its interpretation, you will be made into severed limbs,[c] and your houses will be turned into a refuse heap.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “Chaldeans” refers to a group of court wise men.
    reason: cultural_note
  - marker: b
    text: Or, “The word has gone out from me.”
    reason: alternative_reading
  - marker: c
    text: The Aramaic literally refers to “limbs” or “members”; traditionally, “you will be made into pieces.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The king answered and said
  simplified_phrase: The king replied
  preserved_meaning: The king responds directly to the Chaldeans.
  reasoning_layer_used: POB lexical decision for מַלְכָּא and ordinary English narrative style
  rationale: “Replied” expresses the same response without the repetitive formula.
- pob_phrase: The word from me is firm
  simplified_phrase: What I have said is firm
  preserved_meaning: The king declares that his pronouncement is fixed.
  reasoning_layer_used: POB theological decision for מִנִּי אַזְדָּא
  rationale: The clearer wording keeps the chosen firm sense while the footnote preserves the disputed reading.
- pob_phrase: make known to me
  simplified_phrase: tell me
  preserved_meaning: The Chaldeans must disclose both the dream and its interpretation to the king.
  reasoning_layer_used: POB lexical decision for תְהוֹדְעוּנַּנִי
  rationale: “Tell me” naturally conveys the causative act of making something known.
interpretive_expansions:
- pob_phrase: made into limbs
  rendering: made into severed limbs
  claim: The threat describes violent dismemberment rather than merely becoming bodily members.
  evidence:
