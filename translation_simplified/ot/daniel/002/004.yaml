  preserved_meaning: This remains a formal wish for the king’s long life.
  reasoning_layer_used: POB lexical decision for לְעָלְמִין חֱיִי
  rationale: Adding “may” makes the royal acclamation immediately understandable as a wish.
- pob_phrase: Tell the dream to your servants
  simplified_phrase: Tell us, your servants, what you dreamed
  preserved_meaning: The speakers deferentially ask the king to relate his dream.
  reasoning_layer_used: POB lexical decisions for אֱמַר, חֶלְמָא, and לְעַבְדָךְ
  rationale: Ordinary English identifies the servants as the speakers without losing the courtly self-description.
- pob_phrase: we will declare the interpretation
