translation:
  language: en
  text: Then the king promoted Daniel[a] and gave him many magnificent gifts. He appointed Daniel to rule the whole province of Babylon and made him the highest-ranking official over all the wise men of Babylon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Aramaic literally says that the king “made Daniel great,” meaning that he raised him to a higher position.
    reason: lexical_alternative
