- pob_phrase: made Daniel great
  simplified_phrase: promoted Daniel
  preserved_meaning: The king raised Daniel to a position of greater honor and authority.
  reasoning_layer_used: POB lexical decision for רַבִּי and its footnote
  rationale: “Promoted” states the court-context meaning in familiar English.
- pob_phrase: many great gifts
  simplified_phrase: many magnificent gifts
  preserved_meaning: The gifts were both numerous and impressive.
  reasoning_layer_used: POB lexical decision for מַתְּנָן רַבְרְבָן שַׂגִּיאָן
  rationale: “Magnificent” avoids the awkward repetition of “great” while retaining the gifts’ impressive quality.
- pob_phrase: chief prefect over all the wise men of Babylon
  simplified_phrase: the highest-ranking official over all the wise men of Babylon
  preserved_meaning: Daniel received the leading administrative position over Babylon’s court sages.
  reasoning_layer_used: POB lexical decision and cultural note for רַב סִגְנִין
  rationale: The plain description replaces an unfamiliar official title without reducing Daniel’s rank.
