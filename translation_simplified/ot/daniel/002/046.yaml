translation:
  language: en
  text: Then King Nebuchadnezzar fell facedown before Daniel to show him deep honor.[a] He commanded that an offering and incense be offered to Daniel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be translated “worshiped Daniel” or “bowed down before Daniel”; the Aramaic describes extreme reverence without necessarily treating Daniel as divine.
    reason: alternative_reading
  - marker: b
    text: The command more specifically includes pouring out a liquid offering for Daniel.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: fell on his face and paid homage to Daniel
  simplified_phrase: fell facedown before Daniel to show him deep honor
  preserved_meaning: Nebuchadnezzar prostrated himself and showed Daniel extreme reverence.
  reasoning_layer_used: Lexical and theological decisions for נְפַל עַל אַנְפּוֹהִי and סְגִד
  rationale: The wording keeps the physical image while explaining the less familiar phrase “paid homage.”
- pob_phrase: to him
  simplified_phrase: to Daniel
  preserved_meaning: Daniel is the recipient of the commanded offerings.
  reasoning_layer_used: Immediate syntax and POB translation
  rationale: Repeating Daniel removes a potentially confusing pronoun without changing its referent.
interpretive_expansions:
- pob_phrase: paid homage
  rendering: to show him deep honor
  claim: Nebuchadnezzar’s prostration expressed extreme reverence toward Daniel.
  evidence:
  - The POB lexical decision defines סְגִד as prostration or reverential homage.
  - Falling facedown supplies the visible act of extreme reverence.
  confidence: high
  alternatives_preserved:
