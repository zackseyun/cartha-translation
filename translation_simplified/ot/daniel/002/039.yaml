  preserved_meaning: A distinct and lesser kingdom will succeed Nebuchadnezzar’s kingdom.
  reasoning_layer_used: Lexical decisions and theological decision on comparative inferiority
  rationale: The clause is reordered and divided naturally while retaining the chosen comparative sense.
- pob_phrase: and yet a third kingdom, of bronze
  simplified_phrase: Then a third kingdom—the bronze kingdom—will arise
  preserved_meaning: The third kingdom corresponds to the bronze part of the statue.
  reasoning_layer_used: Lexical decisions and statue-vision context
  rationale: “Then” makes the sequence clear, while “bronze kingdom” keeps the source image.
