translation:
  language: en
  text: After you, another kingdom will arise, but it will be inferior to yours.[a] Then a third kingdom—the bronze kingdom—will arise and rule over all the earth.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Aramaic can also be translated “lower than you”; it describes the next kingdom as lower in rank or splendor than Nebuchadnezzar’s kingdom.
    reason: lexical_alternative
  - marker: b
    text: “All the earth” can also mean “the whole land”; here it likely describes broad imperial rule.
    reason: lexical_alternative
