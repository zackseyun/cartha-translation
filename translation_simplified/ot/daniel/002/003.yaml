translation:
  language: en
  text: The king said to them, “I had a dream,[a] and my spirit[b] is troubled. I need to know the dream.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew emphasizes this statement, more literally, “A dream I dreamed.”
    reason: source_note
  - marker: b
    text: “My spirit” means the king’s inner self or mind.
    reason: lexical_alternative
  - marker: c
    text: “Know the dream” may include knowing its content, its meaning, or both.
    reason: simplification_note
