translation:
  language: en
  text: 'The feet and toes you saw were made partly of potter’s clay and partly of iron. In the same way, the kingdom will be divided, though it will have some of iron’s firmness.[a] This matches what you saw: iron mixed with clay mud.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “some of iron’s strength.” The Aramaic term can mean firmness, strength, or stability.
    reason: lexical_alternative
  - marker: b
    text: Or “muddy clay.” The source uses words for both clay and mud.
    reason: lexical_alternative
