translation:
  language: en
  text: This is the dream I, King Nebuchadnezzar, saw. Belteshazzar, tell its meaning. None of the wise men in my kingdom can explain it to me, but you can, because the spirit of the holy gods is in you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the Spirit of the holy God is in you.” The Aramaic forms are plural, but some understand the phrase as referring to the one God.
    reason: alternative_reading
