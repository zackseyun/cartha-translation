  rationale: The active wording is easier to read while retaining the full force of his sovereign will.
- pob_phrase: there is no one who can strike his hand
  simplified_phrase: No one can strike his hand to stop him
  preserved_meaning: No one can interfere with or restrain his action.
  reasoning_layer_used: Lexical decision for יְמַחֵא בִידֵהּ and doctrine realignment
  rationale: The wording preserves the source image and immediately explains its idiomatic force.
