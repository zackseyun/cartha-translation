translation:
  language: en
  text: All the people of earth count as nothing before him. He does whatever he wills among the army of heaven[a] and the people of earth. No one can strike his hand to stop him[b] or say to him, “What have you done?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Also “the host of heaven”; the phrase does not specify angels, stars, or other heavenly beings.
    reason: lexical_alternative
  - marker: b
    text: The image means that no one can interfere with or restrain his action.
    reason: lexical_alternative
