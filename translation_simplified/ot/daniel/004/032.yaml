  preserved_meaning: Earth’s inhabitants have no weight or standing against his sovereign authority.
  reasoning_layer_used: Lexical decision for כְּלָה חֲשִׁיבִין and immediate context
  rationale: “Count as nothing” keeps the idea of evaluation without implying that people do not exist.
