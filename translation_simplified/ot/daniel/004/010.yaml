translation:
  language: en
  text: As I lay on my bed, I saw visions in my mind. Then I saw a watcher—a holy one—come down from heaven.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Aramaic calls this being “a watcher, a holy one” without identifying the being more specifically as an angel.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I was looking in the visions of my head as I lay on my bed
  simplified_phrase: As I lay on my bed, I saw visions in my mind
  preserved_meaning: He perceived dream-visions while lying in bed.
  reasoning_layer_used: Lexical decisions for חָזֵה הֲוֵית, בְּחֶזְוֵי, רֵאשִׁי, and עַל מִשְׁכְּבִי
  rationale: This uses the documented idiomatic alternative “in my mind” and avoids adding that the visions unfolded.
- pob_phrase: and behold ... came down
  simplified_phrase: Then I saw ... come down
  preserved_meaning: The wording draws attention to the heavenly figure appearing in the vision.
  reasoning_layer_used: Lexical decisions for וַאֲלוּ and נָחִת
  rationale: Repeating “I saw” naturally preserves the marked introduction better than sequence alone.
- pob_phrase: a watcher, a holy one
  simplified_phrase: a watcher—a holy one—
  preserved_meaning: The distinctive heavenly title remains, and the watcher is identified as holy without being called an angel.
  reasoning_layer_used: Lexical and theological decisions for עִיר וְקַדִּישׁ
  rationale: Dashes clarify the apposition while preserving the text’s deliberate restraint about the being’s identity.
interpretive_expansions:
- pob_phrase: visions of my head
  rendering: visions in my mind
  claim: The visions were perceived mentally during his dream rather than located physically inside his head.
  evidence:
  - The POB lexical rationale lists “in my mind” as the smoother contextual alternative for רֵאשִׁי.
  - The immediate setting places the visions while Nebuchadnezzar lay on his bed.
  confidence: high
  alternatives_preserved:
  - visions of my head
translation_notes:
  risk_flags:
