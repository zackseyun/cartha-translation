translation:
  language: en
  text: Let him no longer have a human heart; let him be given the heart of a beast instead. Let seven periods of time pass over him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The exact length of these seven periods is not stated here; they may also be called seven “times” or seven “seasons.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Let his heart be changed from that of a man
  simplified_phrase: Let him no longer have a human heart
  preserved_meaning: His human inner disposition is to be changed without naming who causes it.
  reasoning_layer_used: Lexical decision for לִבְבֵהּ and theological decision on the judgment
  rationale: The wording removes the awkward “that of a man” while retaining the human-heart image.
- pob_phrase: let the heart of a beast be given to him
  simplified_phrase: let him be given the heart of a beast instead
  preserved_meaning: A beast’s disposition replaces his human disposition.
  reasoning_layer_used: Lexical decision for וּלְבַב חֵיוָה יִתְיְהִב לֵהּ
  rationale: The passive wording leaves the agent unstated, and “instead” clarifies the contrast.
- pob_phrase: seven times
  simplified_phrase: seven periods of time
  preserved_meaning: Seven appointed but unspecified spans are to elapse for him.
  reasoning_layer_used: Lexical decision for שִׁבְעָה עִדָּנִין
  rationale: “Periods of time” is clearer than the potentially confusing plural “times” without fixing their length.
interpretive_expansions:
