  - the realm of mankind
translation_notes:
  risk_flags:
  - risk: The plural “human kingdoms” may sound more distributive than the source’s singular collective expression.
    mitigation: Omitting “every” keeps the wording collective rather than making an explicit claim about each individual kingdom.
  - risk: Readers may assume that “seven times” necessarily means seven years.
    mitigation: The footnote preserves the broader meaning and presents seven years only as a common interpretation.
