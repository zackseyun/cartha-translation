translation:
  language: en
  text: You will be driven away from human society and will live with the wild animals. You will be made to eat grass like oxen, and the dew of heaven will drench you. This will continue until seven times have passed.[a] Then you will know that the Most High rules over human kingdoms and gives them to whomever he chooses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Seven times” may mean seven periods of time; many understand them as seven years.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: driven away from men
  simplified_phrase: driven away from human society
  preserved_meaning: He will be forcibly removed from life among other people.
  reasoning_layer_used: Lexical rationale for אֲנָשָׁא and טָרְדִין
  rationale: This clearly expresses the contrast between human society and animal life.
- pob_phrase: your dwelling will be with the beasts of the field
  simplified_phrase: will live with the wild animals
  preserved_meaning: He will live outside civilized human space among wild land animals.
  reasoning_layer_used: Lexical rationale for חֵיוַת בָּרָא and מְדֹרָךְ
  rationale: Common wording preserves the image of living among animals outside society.
- pob_phrase: seven times will pass over you
  simplified_phrase: This will continue until seven times have passed
  preserved_meaning: He will endure this condition for an unspecified span described as seven times.
  reasoning_layer_used: Lexical and theological decisions on עִדָּנִין
  rationale: The natural sentence structure retains the deliberate ambiguity of the duration.
interpretive_expansions:
- pob_phrase: in the kingdom of men and gives it
  rendering: over human kingdoms and gives them
  claim: The singular collective expression refers to the sphere of human rule without asserting each kingdom individually.
