translation:
  language: en
  text: This sentence comes by the decree of the watchers,[a] and this decision comes by the word of the holy ones.[b] This is so that all who live may know that the Most High rules over the kingdom of mankind. He gives it to whomever he chooses and appoints a man from the lowest rank to rule over it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Watchers” is Daniel’s term for heavenly beings, often understood to be angels.
    reason: cultural_note
  - marker: b
    text: The compressed Aramaic may instead mean, “The sentence is by the decree of the watchers, and the decision is a request by the word of the holy ones.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The sentence is by the decree of the watchers, and the decision by the word of the holy ones
  simplified_phrase: This sentence comes by the decree of the watchers, and this decision comes by the word of the holy ones
  preserved_meaning: Both the watchers’ decree and the holy ones’ word are constitutive of the ruling.
  reasoning_layer_used: Lexical decisions for בִּגְזֵרַת, פִּתְגָמָא, וּמֵאמַר, and שְׁאֵלְתָא
  rationale: Repeating “comes by” clarifies the compressed clauses without adding an unsupported action.
- pob_phrase: the Most High rules in the kingdom of mankind
  simplified_phrase: the Most High rules over the kingdom of mankind
  preserved_meaning: The Most High has authority over the human realm and its kingship.
  reasoning_layer_used: POB footnote c and lexical rationale for בְּמַלְכוּת אֱנוֹשָׁא
  rationale: “Rules over” makes the intended dominion clear in natural English.
- pob_phrase: sets up over it the lowliest of men
  simplified_phrase: appoints a man from the lowest rank to rule over it
  preserved_meaning: The Most High installs even a very low-ranking man as ruler.
  reasoning_layer_used: Lexical decisions for וּשְׁפַל אֲנָשִׁים and יְקִים עֲלַיְהּ
  rationale: The wording explains both the rank idiom and the installation of a ruler.
interpretive_expansions:
- pob_phrase: rules in the kingdom of mankind
  rendering: rules over the kingdom of mankind
  claim: The clause describes the Most High’s dominion over the human kingdom.
  evidence:
  - POB footnote c permits “over the kingdom of men.”
  - The following clauses describe God giving the kingdom and appointing its ruler.
  confidence: high
  alternatives_preserved:
  - rules in the kingdom of mankind
  - rules over the kingdom of humanity
- pob_phrase: sets up over it
  rendering: appoints ... to rule over it
  claim: Setting someone up over the kingdom means installing him as its ruler.
  evidence:
  - The immediate context concerns granting kingship and installing a ruler.
  - The POB lexical rationale identifies appointment of a ruler as the contextual sense.
  confidence: high
  alternatives_preserved:
  - sets up over it
  - raises up over it
translation_notes:
  risk_flags:
  - risk: Modern readers may not know who the watchers are.
    mitigation: Footnote a identifies them as heavenly beings while retaining Daniel’s image.
  - risk: The Aramaic concerning the holy ones may refer to a request or petition.
    mitigation: Footnote b preserves this documented alternative without replacing the POB’s main reading.
