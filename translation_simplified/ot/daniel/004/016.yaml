translation:
  language: en
  text: 'Then Daniel, who was also called Belteshazzar, was horrified and speechless[a] for about an hour. His thoughts terrified him.


    The king said, “Belteshazzar, do not let the dream or its interpretation terrify you.”


    Belteshazzar replied, “My lord, may the dream be for those who hate you, and its interpretation for your enemies.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Aramaic describes being shocked into silence and may also be translated “was stunned” or “was astonished.”
    reason: lexical_alternative
