translation:
  language: en
  text: At last Daniel came into my presence. He was also called Belteshazzar, named after my god. The spirit of the holy gods was in him, and I told him my dream:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Aramaic may also mean “the Spirit of the holy God” or “the spirit of the holy God,” but “the spirit of the holy gods” best reflects the king’s pagan perspective here.
    reason: alternative_reading
