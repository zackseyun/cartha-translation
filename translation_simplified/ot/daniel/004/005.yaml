  reasoning_layer_used: Lexical decision for עַל קָדָמַי.
  rationale: “Into my presence” conveys the formal setting in natural modern English.
- pob_phrase: he whose name was Belteshazzar, after the name of my god
  simplified_phrase: He was also called Belteshazzar, named after my god.
  preserved_meaning: Belteshazzar was Daniel’s other name and was connected to the king’s god.
  reasoning_layer_used: Lexical decisions for the naming clauses.
  rationale: The direct wording removes repetition while preserving the naming relationship.
- pob_phrase: and in whom is the spirit of the holy gods—and I told the dream before him
  simplified_phrase: The spirit of the holy gods was in him, and I told him my dream
  preserved_meaning: The king said that a divine spirit was in Daniel and then reported telling Daniel the dream.
  reasoning_layer_used: Lexical and theological decisions for רוּחַ אֱלָהִין קַדִּישִׁין and the concluding conjunction.
  rationale: Two direct clauses preserve the king’s pagan framing without adding a causal claim.
