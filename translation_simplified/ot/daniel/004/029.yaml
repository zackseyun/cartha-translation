translation:
  language: en
  text: You will be driven away from human society and will live with the wild animals. You will be forced to eat grass like oxen. Seven times[a] will pass over you, until you know that the Most High rules over human kingdoms and gives kingship to anyone he chooses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Seven times” may mean seven years or, more generally, seven periods of time.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: driven away from men
  simplified_phrase: driven away from human society
  preserved_meaning: Nebuchadnezzar will be removed from life among human beings, in contrast to the animals.
  reasoning_layer_used: lexical decision for אֲנָשָׁא and its stated human-animal contrast
  rationale: “Human society” makes the collective sense clear without referring only to males.
- pob_phrase: your dwelling will be with the beasts of the field
  simplified_phrase: will live with the wild animals
  preserved_meaning: His place of life will be among non-domestic animals in the open country.
  reasoning_layer_used: lexical decisions for מְדֹרָךְ and חֵיוַת בָּרָא
  rationale: The rewrite replaces a formal noun phrase with a direct modern clause.
- pob_phrase: the Most High rules in the kingdom of men and gives it to whomever he wills
  simplified_phrase: the Most High rules over human kingdoms and gives kingship to anyone he chooses
  preserved_meaning: The Most High governs human rule and freely grants royal authority.
  reasoning_layer_used: lexical decisions for שַׁלִּיט עִלָּיָא, בְּמַלְכוּת אֲנָשָׁא, and יִתְּנִנַּהּ
  rationale: The wording identifies what “it” means while keeping divine rule and choice distinct.
interpretive_expansions:
- pob_phrase: gives it
  rendering: gives kingship
  claim: The object being granted is royal rule or kingship.
  evidence:
  - The preceding phrase names the kingdom of men.
  - The POB lexical rationale says the clause concerns granting kingship.
  confidence: high
  alternatives_preserved:
  - gives it
  - grants royal authority
