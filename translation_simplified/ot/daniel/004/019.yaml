simplification_decisions:
- pob_phrase: You are the king, who has grown great and strong
  simplified_phrase: You are the king. You have become great and powerful.
  preserved_meaning: Daniel identifies the king as the dream’s tree and describes his rise in power.
  reasoning_layer_used: POB lexical decisions for אַנְתָּה הוּא, מַלְכָּא, רְבַית, and וּתְקֵפְתְּ
  rationale: Two direct sentences make the identification and description easier to follow.
- pob_phrase: your greatness has become great
  simplified_phrase: Your greatness has grown
  preserved_meaning: The king’s greatness has increased while the source repetition remains visible.
  reasoning_layer_used: POB lexical decisions for וּרְבוּתָךְ and רְבָת
  rationale: “Has grown” expresses increase more naturally than “has become great.”
- pob_phrase: your dominion
  simplified_phrase: your rule
  preserved_meaning: The phrase still refers to the king’s ruling authority.
  reasoning_layer_used: POB lexical decision for וְשָׁלְטָנָךְ
  rationale: “Rule” is clearer common English for royal dominion.
