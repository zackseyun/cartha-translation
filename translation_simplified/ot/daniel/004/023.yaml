translation:
  language: en
  text: Because they said to leave the tree’s stump with its roots, your kingdom will be kept for you. It will be yours again when you recognize that Heaven[a] rules.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the heavens rule.” Here “Heaven” is a respectful way of referring to God’s sovereign authority.
    reason: alternative_reading
