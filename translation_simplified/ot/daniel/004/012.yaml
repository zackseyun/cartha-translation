translation:
  language: en
  text: But leave its rooted stump in the ground, with a band[a] of iron and bronze around it among the grass of the field. Let him be soaked with the dew of heaven, and let him live among the wild animals in the grass of the earth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “with a fetter of iron and bronze.” The Aramaic can mean a band or another kind of restraint.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Nevertheless, leave the stump of its roots in the earth
  simplified_phrase: But leave its rooted stump in the ground
  preserved_meaning: The felled tree’s base and living root system must remain in the soil.
  reasoning_layer_used: POB lexical decisions for בְּרַם, עִקַּר שָׁרְשׁוֹהִי, and בְּאַרְעָא
  rationale: Common words and a compact phrase make the command easier to picture.
- pob_phrase: even with a band of iron and bronze
  simplified_phrase: with a band of iron and bronze around it
  preserved_meaning: An iron-and-bronze restraint encircles the stump without defining its exact form.
  reasoning_layer_used: POB lexical decision and footnote for אֱסוּר
  rationale: “Around it” clarifies how the band relates to the stump while the footnote preserves the lexical alternative.
- pob_phrase: let his portion be with the beasts
  simplified_phrase: let him live among the wild animals
  preserved_meaning: The man’s assigned condition is to be among wild animals.
  reasoning_layer_used: POB lexical and theological decisions for חֲלָק and the shift to the king
  rationale: The decree’s practical meaning is stated in ordinary English without removing the personal shift.
