translation:
  language: en
  text: 'And because the king saw a watcher[a]—a holy one—come down from heaven and give this command: “Cut down the tree and destroy it. But leave its rooted stump in the ground, with an iron and bronze band[b] around it, among the grass of the field. Let him be drenched with the dew of heaven, and let him have his share with the wild animals until seven times[c] pass over him”—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “sentinel”; this is a heavenly being described as watchful, without specifying that being’s exact kind.
    reason: lexical_alternative
  - marker: b
    text: Or “with a fetter of iron and bronze.”
    reason: lexical_alternative
  - marker: c
    text: “Seven times” may mean seven periods of time; the exact length is not specified.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: coming down from heaven and saying
  simplified_phrase: come down from heaven and give this command
  preserved_meaning: The king sees the heavenly figure descend and issue the quoted orders.
  reasoning_layer_used: POB lexical decisions for נָחִת מִן שְׁמַיָּא and the command verbs
  rationale: The participial wording becomes a direct narrative lead-in without changing the action.
- pob_phrase: the stump of its roots in the earth
  simplified_phrase: its rooted stump in the ground
  preserved_meaning: The tree is destroyed above ground while its root-stump remains.
  reasoning_layer_used: POB lexical decision for עִקַּר שָׁרְשׁוֹהִי
  rationale: “Rooted stump” preserves the concrete image in natural English.
- pob_phrase: let his portion be with the beasts of the field
  simplified_phrase: let him have his share with the wild animals
  preserved_meaning: His assigned share or condition is to be with the field animals.
  reasoning_layer_used: POB lexical decision for וְעִם חֵיוַת בָּרָא חֲלָקֵהּ
  rationale: “Have his share” keeps the broader lot or portion rather than reducing it to location.
