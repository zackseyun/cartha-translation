translation:
  language: en
  text: Belteshazzar, chief of the magicians, I know that the spirit of the holy gods[a] is in you and that no mystery is too difficult for you. Describe the visions I saw in my dream, and tell me what the dream means.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the Spirit of the holy God” or “the spirit of the holy God.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: whom I know has the spirit of the holy gods in you
  simplified_phrase: I know that the spirit of the holy gods is in you
  preserved_meaning: Nebuchadnezzar believes a divine spirit enables Daniel.
  reasoning_layer_used: POB syntax and theological decision
  rationale: The direct clause removes the tangled relative construction while retaining the king’s plural expression.
- pob_phrase: tell me the visions of my dream that I saw
  simplified_phrase: Describe the visions I saw in my dream
  preserved_meaning: Daniel is asked to recount the distinct visionary contents of the dream.
  reasoning_layer_used: POB lexical decision for חֶזְוֵי חֶלְמִי
  rationale: “Describe” makes the request natural without reducing the visions to merely “my dream.”
- pob_phrase: and its interpretation
  simplified_phrase: and tell me what the dream means
  preserved_meaning: Daniel is also asked to give the dream’s interpretation.
  reasoning_layer_used: POB lexical decision for וּפִשְׁרֵהּ
  rationale: Common wording communicates the technical sense of dream interpretation clearly.
