  preserved_meaning: Daniel respectfully asks the king to receive his counsel.
  reasoning_layer_used: POB lexical decisions for מִלְכִּי and יִשְׁפַּר עֲלָיִךְ
  rationale: The direct request is clearer while retaining Daniel’s deferential tone.
- pob_phrase: break off your sins by righteousness
  simplified_phrase: put an end to your sins by doing what is right
  preserved_meaning: The king must decisively stop sinning and practice righteous conduct.
  reasoning_layer_used: POB lexical and theological decisions for פְרֻק and בְּצִדְקָה
  rationale: This states the ethical call plainly without implying that good works atone for guilt.
- pob_phrase: there may perhaps be a prolonging of your prosperity
  simplified_phrase: Then perhaps your prosperity will continue
  preserved_meaning: The king’s well-being may be extended, but the outcome is not certain.
  reasoning_layer_used: POB lexical decisions for הֵן, תֶּהֱוֵא אַרְכָה, and לִשְׁלֵוְתָךְ
  rationale: The active wording removes an abstract noun while preserving the tentative outcome.
