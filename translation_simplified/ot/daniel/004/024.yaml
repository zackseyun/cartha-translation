translation:
  language: en
  text: 'Therefore, O king, please accept my advice: put an end to your sins by doing what is right, and to your wickedness by showing mercy to the poor.[a] Then perhaps your prosperity will continue.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Aramaic may also be translated, “redeem your sins by doing what is right, and your wickedness by showing mercy to the poor.”
    reason: lexical_alternative
  - marker: b
    text: Or “perhaps your peace will continue” or “perhaps your tranquility will continue.”
    reason: lexical_alternative
