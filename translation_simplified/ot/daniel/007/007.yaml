translation:
  language: en
  text: After this, as I continued watching the visions in the night, I suddenly saw a fourth beast. It was terrifying, dreadful, and extremely strong. It had huge iron teeth. It devoured and crushed, then trampled what was left under its feet. It was different from every beast before it, and it had ten horns.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I kept looking in the visions of the night, and behold
  simplified_phrase: as I continued watching the visions in the night, I suddenly saw
  preserved_meaning: Daniel's continued attention and the scene's sudden appearance are both retained.
  reasoning_layer_used: Lexical decisions for חָזֵה הֲוֵית, בְּחֶזְוֵי לֵילְיָא, and וַאֲרוּ.
  rationale: Natural narrative wording preserves the ongoing action and vivid transition.
- pob_phrase: exceedingly strong; It had large iron teeth
  simplified_phrase: extremely strong. It had huge iron teeth.
  preserved_meaning: The beast's exceptional power and the imposing size and material of its teeth remain explicit.
  reasoning_layer_used: Lexical decisions for וְתַקִּיפָא יַתִּירָא and וְשִׁנַּיִן דִּי פַרְזֶל לַהּ רַבְרְבָן.
  rationale: Common intensifiers replace formal wording without weakening the image.
- pob_phrase: it devoured and crushed, and it trampled the remainder with its feet
  simplified_phrase: It devoured and crushed, then trampled what was left under its feet.
  preserved_meaning: The three destructive actions remain distinct, while their objects stay unspecified.
  reasoning_layer_used: Lexical decisions for אָכְלָה, וּמַדֱּקָה, and וּשְׁאָרָא בְּרַגְלַיּה רָפְסָה.
  rationale: The recast clause uses natural English and avoids narrowing the open imagery.
