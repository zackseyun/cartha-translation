translation:
  language: en
  text: In the first year that Belshazzar was king of Babylon, Daniel saw a dream and visions in his mind as he lay in bed. Then he wrote down the dream and gave a summary of it.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “He wrote down the dream and stated the head of the words.” This Aramaic expression probably means that he recorded the main points.
