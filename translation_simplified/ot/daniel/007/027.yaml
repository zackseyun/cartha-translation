translation:
  language: en
  text: The kingdom, ruling power, and greatness of all kingdoms throughout the world will be given to the people of the saints of the Most High.[a] His kingdom will last forever,[b] and all dominions will serve[c] and obey him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the people of the holy ones of the Most High” or “the holy people of the Most High.”
    reason: lexical_alternative
  - marker: b
    text: 'The Aramaic uses singular pronouns: “His kingdom … serve and obey him.” This may point to the ruler seen earlier in the vision, though the kingdom is also given to the saints.'
    reason: alternative_reading
  - marker: c
    text: In Daniel, “serve” can also mean “worship” when the service is offered to God.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the kingdom and the dominion and the greatness
  simplified_phrase: the kingdom, ruling power, and greatness
  preserved_meaning: The three distinct aspects of worldwide sovereignty remain intact.
  reasoning_layer_used: POB lexical decisions for מַלְכוּתָה, שָׁלְטָנָא, and רְבוּתָא
  rationale: “Ruling power” explains political dominion while preserving the three-part expression.
- pob_phrase: of the kingdoms under all heaven
  simplified_phrase: of all kingdoms throughout the world
  preserved_meaning: The phrase still covers the entire world order.
  reasoning_layer_used: POB lexical rationale for דִּי מַלְכְוָת תְּחוֹת כָּל שְׁמַיָּא
  rationale: The ancient global idiom is expressed in ordinary English.
- pob_phrase: His kingdom shall be an everlasting kingdom
  simplified_phrase: His kingdom will last forever
  preserved_meaning: The singular ruler’s kingdom remains unending.
  reasoning_layer_used: POB lexical and theological decisions for מַלְכוּתֵהּ and מַלְכוּת עָלַם
  rationale: The shorter clause clearly expresses perpetuity without changing the singular pronoun.
