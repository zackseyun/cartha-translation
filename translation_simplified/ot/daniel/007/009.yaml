translation:
  language: en
  text: I kept watching until thrones were set in place.[a] Then the Ancient of Days[b] took his seat. His clothes were as white as snow, and the hair on his head was like pure wool. His throne blazed with flames, and its wheels were burning fire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “thrones were placed.” The traditional “thrones were cast down” is less likely because a heavenly court is being assembled.
    reason: alternative_reading
  - marker: b
    text: “Ancient of Days” is an Aramaic title expressing great age and eternal majesty.
    reason: cultural_note
