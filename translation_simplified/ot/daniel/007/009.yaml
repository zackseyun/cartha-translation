  simplified_phrase: Then the Ancient of Days took his seat
  preserved_meaning: The divine figure takes his place in the heavenly court after the thrones are arranged.
  reasoning_layer_used: lexical and immediate-context reasoning
  rationale: “Then” makes the sequence clear without changing the court scene.
- pob_phrase: His clothing was white as snow
  simplified_phrase: His clothes were as white as snow
  preserved_meaning: His clothing is compared to snow for whiteness.
  reasoning_layer_used: lexical decision
  rationale: “Clothes” is more familiar than the collective noun “clothing” while retaining the simile.
- pob_phrase: His throne was flames of fire; its wheels were a burning fire
  simplified_phrase: His throne blazed with flames, and its wheels were burning fire
  preserved_meaning: The throne and its wheels remain vividly characterized by fire.
  reasoning_layer_used: lexical decision and source-image guardrail
