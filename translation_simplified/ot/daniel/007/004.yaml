translation:
  language: en
  text: The first beast looked like a lion and had eagle’s wings. I kept watching until its wings were torn off. Then it was lifted from the ground and made to stand upright on two feet like a man. It was also given a human heart.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The first was like a lion, and it had the wings of an eagle
  simplified_phrase: The first beast looked like a lion and had eagle’s wings
  preserved_meaning: The first creature is compared to a lion and possesses an eagle’s wings.
  reasoning_layer_used: Source context and lexical decisions for קַדְמָיְתָא, כְאַרְיֵה, and וְגַפִּין דִּי נְשַׁר לַהּ
  rationale: Naming it as the first beast makes the sequence clear without changing the visionary comparison.
- pob_phrase: its wings were plucked off
  simplified_phrase: its wings were torn off
  preserved_meaning: The beast’s wings were forcibly removed.
  reasoning_layer_used: Documented lexical alternative for מְּרִיטוּ גַפַּיהּ
  rationale: “Torn off” is more immediately understandable while keeping the violent image.
- pob_phrase: lifted up from the earth and made to stand on two feet like a man
  simplified_phrase: lifted from the ground and made to stand upright on two feet like a man
  preserved_meaning: The beast is raised and caused to take a humanlike upright stance.
  reasoning_layer_used: Lexical and theological decisions for וּנְטִילַת מִן אַרְעָא and וְעַל רַגְלַיִן כֶּאֱנָשׁ הֳקִימַת
  rationale: “Ground” and “stand upright” make the physical movement easier to picture.
