translation:
  language: en
  text: After this, I kept watching. There before me was another beast, like a leopard. It had four bird wings on its back[a] and four heads. It was given authority to rule.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “on its sides”; the Aramaic may refer more generally to its back or upper body.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: After this I kept looking, and behold, another, like a leopard
  simplified_phrase: After this, I kept watching. There before me was another beast, like a leopard.
  preserved_meaning: Daniel continues watching and vividly sees the next beast in the vision.
  reasoning_layer_used: Lexical decisions for the ongoing action, visionary interjection, and sequential reference.
  rationale: Two sentences make the vision sequence clear while preserving its vivid presentation.
- pob_phrase: it had four wings of a bird on its back
  simplified_phrase: It had four bird wings on its back
  preserved_meaning: The beast has four wings like those of a bird, located on its back or upper body.
  reasoning_layer_used: Lexical decisions for גַּפִּין, דִּי עוֹף, and עַל גביּה.
  rationale: The compact phrase “bird wings” is natural English without weakening the image.
- pob_phrase: dominion was given to it
  simplified_phrase: It was given authority to rule.
  preserved_meaning: Ruling power was granted to the beast by an unnamed giver.
  reasoning_layer_used: Lexical and theological decisions for שָׁלְטָן and the unnamed agent.
  rationale: “Authority to rule” explains dominion while retaining the passive form and theological reserve.
