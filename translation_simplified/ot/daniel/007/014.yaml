translation:
  language: en
  text: He was given ruling authority, glory, and a kingdom, so that all peoples, nations, and language groups would serve him.[a] His rule will last forever and never pass away. His kingdom will never be destroyed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Serve” may also include worship or paying homage; the Aramaic does not limit the meaning to political service.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And to him was given dominion and glory and a kingdom
  simplified_phrase: He was given ruling authority, glory, and a kingdom
  preserved_meaning: The figure receives royal power, glory, and a kingdom from an unstated giver.
  reasoning_layer_used: POB syntax and lexical decisions for יְהִיב and שָׁלְטָן
  rationale: The active English word order is easier to read while the passive verb keeps the giver unstated.
- pob_phrase: all peoples, nations, and languages
  simplified_phrase: all peoples, nations, and language groups
  preserved_meaning: Every ethnic, national, and linguistic community is included.
  reasoning_layer_used: POB lexical decisions for עַמְמַיָּא, אֻמַיָּא, and לִשָּׁנַיָּא
  rationale: “Language groups” makes clear that people, rather than abstract languages, serve him.
- pob_phrase: His dominion is an everlasting dominion, which will not pass away
  simplified_phrase: His rule will last forever and never pass away
  preserved_meaning: His royal authority is permanent and will never end or be removed.
  reasoning_layer_used: POB lexical decisions for שָׁלְטָן עָלַם and יֶעְדֵּה
  rationale: The simpler sentence preserves both everlasting duration and the image of never passing away.
translation_notes:
  risk_flags:
  - risk: “Ruling authority” does not repeat the same noun as “rule” as closely as the Aramaic does.
    mitigation: Both phrases use the same ruling concept and retain the verse’s emphasis on permanent royal power.
  - risk: Modern readers may hear “serve” as only political obedience.
    mitigation: The footnote preserves the possible senses of worship and homage without forcing one interpretation.
