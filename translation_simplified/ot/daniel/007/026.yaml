simplification_decisions:
- pob_phrase: the court will sit
  simplified_phrase: the court will take its seat
  preserved_meaning: The heavenly court convenes while the source image of sitting is retained.
  reasoning_layer_used: lexical decision for דִינָא and יִתִּב
  rationale: “Take its seat” makes the courtroom action clearer in ordinary English.
- pob_phrase: his dominion
  simplified_phrase: his power to rule
  preserved_meaning: The ruler’s governing power is removed without identifying him more narrowly.
  reasoning_layer_used: lexical and theological decisions for שָׁלְטָנֵהּ
  rationale: “Power to rule” explains the less familiar term “dominion” while preserving the singular pronoun.
- pob_phrase: to be destroyed and annihilated to the end
  simplified_phrase: destroyed—wiped out completely
  preserved_meaning: The paired expressions still emphasize the total and final destruction of his ruling power.
  reasoning_layer_used: lexical decisions for לְהַשְׁמָדָה, וּלְהוֹבָדָה, and עַד סוֹפָא
  rationale: The dash keeps the intensifying parallelism while “completely” states the phrase’s final force naturally.
