translation:
  language: en
  text: As I continued watching the visions of the night, I saw one like a son of man[a] coming with the clouds of heaven.[b] He came to the Ancient of Days, and they brought him into his presence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “one like a human being.” The Aramaic literally says “like a son of man,” a phrase that later became an important messianic title.
    reason: lexical_alternative
  - marker: b
    text: Traditionally, “on the clouds of heaven.” The Aramaic says “with,” which may describe the clouds accompanying him rather than him traveling on them.
    reason: alternative_reading
