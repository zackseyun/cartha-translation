  preserved_meaning: An immense host serves him while the numerical imagery remains explicit.
  reasoning_layer_used: Lexical and theological decisions on the heavenly attendants
  rationale: “Times” makes the unusual numerical expression immediately understandable without reducing it to mere innumerability.
- pob_phrase: The court sat
