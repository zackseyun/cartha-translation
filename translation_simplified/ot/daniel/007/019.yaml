translation:
  language: en
  text: Then I wanted to be certain about the fourth beast. It was unlike all the others and was extremely terrifying. It had iron teeth and bronze claws.[a] It devoured and crushed, and it trampled under its feet whatever was left.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word translated “claws” can also mean “nails.”
    reason: lexical_alternative
