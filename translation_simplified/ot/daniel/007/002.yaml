simplification_decisions:
- pob_phrase: Daniel answered and said
  simplified_phrase: Daniel said
  preserved_meaning: The standard narrative formula introduces Daniel’s report.
  reasoning_layer_used: POB lexical decision for עָנֵה ... וְאָמַר
  rationale: The shorter wording is natural English and does not suggest that Daniel was answering an unstated question.
- pob_phrase: I was seeing in my vision by night
  simplified_phrase: In my vision during the night, I watched
  preserved_meaning: Daniel continuously observed a nighttime vision.
  reasoning_layer_used: POB lexical decisions for חָזֵה הֲוֵית, בְּחֶזְוִי, and עִם לֵילְיָא
  rationale: The recast sentence preserves the ongoing action, visionary setting, and nighttime setting in ordinary English.
- pob_phrase: and behold, the four winds of heaven were stirring up the great sea
  simplified_phrase: as the four winds of heaven stirred up the great sea
  preserved_meaning: Daniel’s attention is directed to heavenly winds actively agitating the vast sea.
  reasoning_layer_used: POB lexical and theological decisions for וַאֲרוּ, רוּחֵי, and מְגִיחָן
  rationale: “Watched as” carries the vivid focus while avoiding the archaic command “behold.”
