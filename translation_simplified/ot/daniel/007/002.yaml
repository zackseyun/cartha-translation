translation:
  language: en
  text: Daniel said, “In my vision during the night, I watched as the four winds[a] of heaven stirred up the great sea.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the four spirits of heaven.” The Aramaic word can mean either “winds” or “spirits.”
