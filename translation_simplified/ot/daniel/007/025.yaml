translation:
  language: en
  text: He will speak against the Most High and relentlessly wear down the saints who belong to the Most High. He will try to change times[a] and law. The saints will be put under his power[b] for a time, times, and half a time.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “appointed times,” possibly meaning fixed seasons or festival times.
    reason: lexical_alternative
  - marker: b
    text: The Aramaic literally says “they will be given into his hand”; “they” most naturally refers to the saints.
    reason: alternative_reading
  - marker: c
    text: This expression describes a limited period and is often understood as three and a half times or years, but its exact meaning is debated.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: he will wear out the saints of the Most High
  simplified_phrase: relentlessly wear down the saints who belong to the Most High
  preserved_meaning: He will subject the Most High’s saints to sustained, exhausting oppression.
  reasoning_layer_used: lexical decision for יְבַלֵּא and theological decision on the saints
  rationale: “Wear down” keeps the source metaphor while “relentlessly” makes its sustained force clear.
- pob_phrase: He will intend to change
  simplified_phrase: He will try to change
  preserved_meaning: He plans and attempts the change without implying that he succeeds.
  reasoning_layer_used: lexical decision for יִסְבַּר
  rationale: “Try” expresses hostile intent in ordinary English without overstating success.
- pob_phrase: they will be given into his hand
  simplified_phrase: The saints will be put under his power
  preserved_meaning: The saints will be placed under his control for a limited period.
  reasoning_layer_used: lexical decisions for יִתְיַהֲבוּן and בִּידֵהּ plus the referent note
  rationale: The wording identifies the likely referent and explains the hand-as-power image directly.
