translation:
  language: en
  text: and about the ten horns on its head and the other horn that came up. Three horns fell before it. This horn had eyes and a mouth that spoke great things.[a] It looked more imposing than the other horns.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “spoke boastful things” or “uttered great boasts.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the other horn that came up, before which three fell
  simplified_phrase: the other horn that came up. Three horns fell before it.
  preserved_meaning: Another horn emerged, and three horns fell before it.
  reasoning_layer_used: Lexical decisions for סִלְקַת and וְנפלו מִן קדמיה תְּלָת
  rationale: Two short sentences make the sequence clear while keeping the vision’s horn imagery.
- pob_phrase: the horn that had eyes and a mouth speaking great things
  simplified_phrase: This horn had eyes and a mouth that spoke great things.
  preserved_meaning: The specific horn had eyes and spoke great things through its mouth.
  reasoning_layer_used: Lexical and theological decisions for וְעַיְנִין לַהּ and וְפֻם מְמַלִּל רַבְרְבָן
  rationale: A direct sentence preserves the vivid features and keeps “great things” rather than resolving it as boasting.
- pob_phrase: whose appearance was greater than that of its companions
  simplified_phrase: It looked more imposing than the other horns.
  preserved_meaning: The horn appeared more prominent than the related horns.
  reasoning_layer_used: Lexical decision for רַב מִן חַבְרָתַהּ
  rationale: “More imposing” expresses visible prominence, while “other horns” identifies the companions plainly.
