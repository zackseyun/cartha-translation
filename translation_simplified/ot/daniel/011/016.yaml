  text: The attacker will do whatever he wants, and no one will be able to stand against him. He will take his stand in the Beautiful Land,[a] with the power to destroy in his hand.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “Beautiful Land” is the land of Israel and Judah; it may also be translated “the glorious land.”
