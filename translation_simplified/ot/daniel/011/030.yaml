translation:
  language: en
  text: Ships of Kittim will come against him,[a] and he will lose heart. He will turn back and rage against the holy covenant, and he will take action.[b] Then he will turn back and pay attention to those who abandon the holy covenant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “ships from Kittim.” Kittim may refer to Cyprus or, more broadly, to western sea powers.
    reason: lexical_alternative
  - marker: b
    text: Or “he will show regard for” those who abandon the holy covenant.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: he will be disheartened
  simplified_phrase: he will lose heart
  preserved_meaning: Opposition from the ships will discourage or intimidate him.
  reasoning_layer_used: Lexical decision for וְנִכְאָה
  rationale: “Lose heart” expresses the military setback in more familiar English.
- pob_phrase: and he will act
  simplified_phrase: and he will take action
  preserved_meaning: He will do something hostile without the text specifying the exact action.
  reasoning_layer_used: Lexical decision for וְעָשָׂה
  rationale: “Take action” sounds natural while preserving the Hebrew verb’s deliberate vagueness.
- pob_phrase: those who forsake the holy covenant
  simplified_phrase: those who abandon the holy covenant
  preserved_meaning: These people leave or reject the covenant without further defining it.
  reasoning_layer_used: Lexical and theological decisions for עֹזְבֵי and the holy covenant
  rationale: “Abandon” is clearer than “forsake” and does not narrow the covenant’s identity.
translation_notes:
  risk_flags:
  - risk: Modern readers may not know where or what Kittim is.
    mitigation: The footnote preserves its possible reference to Cyprus or broader western sea powers.
  - risk: “Take action” remains intentionally nonspecific.
    mitigation: The wording preserves the source ambiguity, and the footnote records the main contextual alternative.
