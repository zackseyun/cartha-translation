- pob_phrase: not to his posterity, and not according to the dominion with which he ruled
  simplified_phrase: It will not pass to his descendants, and those who receive it will not have the power he had
  preserved_meaning: His descendants will not inherit the kingdom, and its recipients will not rule with his degree of power.
