translation:
  language: en
  text: Those among the people who have insight will help the many understand. Yet for days they will stumble because of sword and flame, captivity and plunder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Stumble” may include collapse, defeat, or death under persecution.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: will give understanding to the many
  simplified_phrase: will help the many understand
  preserved_meaning: Those with insight cause others to understand rather than merely understanding for themselves.
  reasoning_layer_used: POB lexical decision for יָבִינוּ
  rationale: The active wording expresses the causative sense in ordinary English.
- pob_phrase: but they will stumble by sword and by flame, by captivity and by plunder
  simplified_phrase: Yet ... they will stumble because of sword and flame, captivity and plunder
  preserved_meaning: The listed forms of persecution bring about their stumbling without limiting that image to death.
  reasoning_layer_used: POB lexical and theological decisions for וְנִכְשְׁלוּ and the repeated beth phrases
  rationale: “Because of” clearly connects the afflictions to their stumbling in natural English.
- pob_phrase: for days
  simplified_phrase: for days
  preserved_meaning: Their suffering continues for an indefinite number of days.
  reasoning_layer_used: POB lexical decision for יָמִים
  rationale: The retained phrase avoids assigning a more specific duration than the source gives.
translation_notes:
  risk_flags:
  - risk: “The many” is less natural than “many people.”
    mitigation: It remains because POB preserves the Hebrew form’s article-like force.
  - risk: “Stumble” may sound too mild for this severe persecution.
    mitigation: The footnote gives its broader range without making death necessary.
