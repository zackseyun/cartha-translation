translation:
  language: en
  text: He will also carry away to Egypt, as plunder, their gods, their cast-metal images, and their valuable silver and gold objects. Then for some years he will keep his distance from the king of the north.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may instead mean that he will outlast the king of the north or remain stronger than him for years.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: carry off to Egypt ... as plunder
  simplified_phrase: carry away to Egypt, as plunder
  preserved_meaning: He seizes the defeated people's sacred valuables and takes them to Egypt as war spoils.
  reasoning_layer_used: Lexical decisions for יָבִא מִצְרָיִם and בַּשְּׁבִי
  rationale: The new word order makes the seizure and destination easier to follow.
- pob_phrase: their cast images and with their precious vessels of silver and gold
  simplified_phrase: their cast-metal images, and their valuable silver and gold objects
  preserved_meaning: The plunder includes cast images and prized articles of silver and gold, with the materials describing the articles.
  reasoning_layer_used: Lexical decisions for נְסִכֵיהֶם, כְּלֵי חֶמְדָּתָם, and כֶּסֶף וְזָהָב
  rationale: This avoids the unclear modern sense of “vessels” and limits “silver and gold” to the valuable objects.
- pob_phrase: he will stand aloof from the king of the north
  simplified_phrase: he will keep his distance from the king of the north
  preserved_meaning: For a time, he remains apart from the northern king rather than engaging him.
  reasoning_layer_used: Theological decision on יַעֲמֹד מִמֶּלֶךְ הַצָּפוֹן
  rationale: “Keep his distance” preserves the separation image without specifying a particular military action.
