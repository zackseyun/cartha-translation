translation:
  language: en
  text: After some years, the two kings will form an alliance. The daughter of the king of the South will go to the king of the North to make an agreement.[a] But her arm will lose its strength, and neither the king nor his power will endure. She will be handed over, along with those who brought her, her father,[b] and the one who supported her in those times.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “to make equitable terms” or “to bring about an upright settlement.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew masculine form supports “her father,” though some understand the word as “child” or as referring to someone else.
    reason: lexical_alternative
