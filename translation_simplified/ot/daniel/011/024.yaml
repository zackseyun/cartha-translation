translation:
  language: en
  text: 'When the province is secure, he will enter its richest regions.[a] He will do what neither his fathers nor their fathers did: he will scatter plunder, loot, and property among them. He will make plans against fortresses, but only until a certain time.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “He will peacefully or unexpectedly enter the richest regions of the province.”
    reason: lexical_alternative
  - marker: b
    text: Or, “until the appointed time”; the Hebrew expression is indefinite here.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: In a time of security he will come into the richest parts of the province
  simplified_phrase: When the province is secure, he will enter its richest regions
  preserved_meaning: He enters the wealthiest areas during a period of security.
  reasoning_layer_used: Lexical decisions for בְּשַׁלְוָה, מִשְׁמַנֵּי מְדִינָה, and יָבוֹא
  rationale: The ordinary clause order improves clarity without strengthening “enter” to “invade.”
- pob_phrase: neither his fathers nor his fathers’ fathers did
  simplified_phrase: neither his fathers nor their fathers did
  preserved_meaning: His actions are unprecedented across the two preceding generations.
  reasoning_layer_used: Lexical decision for אֲבֹתָיו וַאֲבוֹת אֲבֹתָיו
  rationale: The wording preserves the repeated generations in more natural English.
- pob_phrase: plunder, spoil, and goods; and against fortresses he will devise his plans
  simplified_phrase: plunder, loot, and property ... He will make plans against fortresses
  preserved_meaning: The three kinds of captured wealth remain distinct from his deliberate plans against fortified places.
  reasoning_layer_used: Lexical decisions for בִּזָּה וְשָׁלָל וּרְכוּשׁ and מִבְצָרִים יְחַשֵּׁב מַחְשְׁבֹתָיו
  rationale: Common nouns and separate sentences make both actions easier to follow.
