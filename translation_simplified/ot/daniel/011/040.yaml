translation:
  language: en
  text: At the time of the end, the king of the South will clash with him. Then the king of the North will storm against him[a] with chariots, horsemen, and many ships. He will enter the lands, sweep through them, and move on.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew does not identify who “him” refers to, and interpreters differ about the ruler intended.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the king of the South will clash with him, and the king of the North will storm against him
  simplified_phrase: the king of the South will clash with him. Then the king of the North will storm against him
  preserved_meaning: Both kings take hostile action against the unnamed figure.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Two sentences clarify the sequence without identifying the disputed pronoun.
- pob_phrase: he will enter into the lands
  simplified_phrase: He will enter the lands
  preserved_meaning: The northern king advances into multiple territories.
  reasoning_layer_used: POB lexical decision for וּבָא בָאֲרָצוֹת
  rationale: Removing unnecessary “into” makes the military movement natural in modern English.
- pob_phrase: sweep through and pass on
  simplified_phrase: sweep through them, and move on
  preserved_meaning: His overwhelming advance continues beyond the lands he enters.
  reasoning_layer_used: POB lexical decisions for וְשָׁטַף and וְעָבָר
  rationale: “Move on” clearly distinguishes continued advance from sweeping through the lands.
