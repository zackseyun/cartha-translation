translation:
  language: en
  text: Then another ruler will rise in his place. He will send an official through the splendor of the kingdom to collect tribute.[a] But within a short time he will be broken—not in anger or in battle.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may refer either to the most splendid part of the realm or to the kingdom’s majesty more generally.
    reason: lexical_alternative
  - marker: b
    text: The compressed Hebrew may also mean “not by wrath.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Then one will arise in his place
  simplified_phrase: Then another ruler will rise in his place
  preserved_meaning: A new ruler succeeds the previous ruler.
  reasoning_layer_used: The lexical rationale identifies this as a dynastic succession formula.
  rationale: Calling him another ruler makes the succession clear without naming a specific king.
- pob_phrase: who will send an exactor
  simplified_phrase: He will send an official ... to collect tribute
  preserved_meaning: The ruler sends someone to enforce required payments.
  reasoning_layer_used: The lexical decision describes the exactor as a revenue-enforcing official.
  rationale: The unfamiliar term “exactor” is replaced by a plain description of the official’s task.
- pob_phrase: within a few days
  simplified_phrase: within a short time
  preserved_meaning: The ruler’s downfall comes soon.
  reasoning_layer_used: The lexical rationale treats the phrase as an idiom for brevity.
  rationale: This avoids requiring a literal count of several calendar days.
interpretive_expansions:
- pob_phrase: one
  rendering: another ruler
  claim: The person who arises is the next ruler in the succession.
  evidence:
  - The lexical rationale calls this a dynastic succession formula.
  - The phrase “in his place” indicates succession.
  confidence: high
- pob_phrase: an exactor
  rendering: an official ... to collect tribute
  claim: The person sent is an official charged with collecting required payment.
  evidence:
  - The lexical rationale describes a revenue-enforcing official.
  - The POB footnote says the Hebrew denotes one who exacts tribute or payment.
  confidence: high
  alternatives_preserved:
  - The term may carry the broader sense of an oppressor.
translation_notes:
  risk_flags:
  - risk: “The splendor of the kingdom” may refer to either a splendid region or the realm’s majesty.
    mitigation: Footnote a preserves both possibilities without adding the unwarranted word “all.”
  - risk: “Not in anger” could be mistaken for a fully resolved description of his downfall.
    mitigation: Footnote b preserves the compressed alternative “not by wrath.”
