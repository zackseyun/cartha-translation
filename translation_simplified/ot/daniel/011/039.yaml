translation:
  language: en
  text: He will attack the strongest fortresses with a foreign god.[a][b] He will give great honor to those he recognizes and appoint them to rule over many. He will distribute land for a price.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “fortified strongholds” or “the fortresses of strongholds.”
    reason: lexical_alternative
  - marker: b
    text: “With” may mean either alongside the foreign god or by means of that god.
    reason: lexical_alternative
  - marker: c
    text: The last phrase may mean that he distributes land for payment or as a reward.
    reason: lexical_alternative
