  simplified_phrase: He will give great honor to those he recognizes
  preserved_meaning: The king chooses certain people and causes them to receive abundant honor.
  reasoning_layer_used: Lexical decisions for הִכִּיר and יַרְבֶּה כָבוֹד
  rationale: The rewrite states the compressed Hebrew idiom in ordinary English without changing its subject or recipients.
- pob_phrase: he will make them rule over many
  simplified_phrase: appoint them to rule over many
  preserved_meaning: The king gives his favored people authority over many others.
  reasoning_layer_used: Lexical decision for וְהִמְשִׁילָם בָּרַבִּים
  rationale: “Appoint” clearly expresses his act of placing them in power.
- pob_phrase: he will divide land for a price
  simplified_phrase: He will distribute land for a price
  preserved_meaning: The king parcels out land through a transaction whose exact form is unspecified.
  reasoning_layer_used: Lexical decision for וַאֲדָמָה יְחַלֵּק בִּמְחִיר
  rationale: “Distribute” is clearer than “divide” while retaining the transactional wording.
