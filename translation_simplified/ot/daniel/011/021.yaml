translation:
  language: en
  text: A despised man will take his place. He will not have been given the honor of kingship. Yet he will come in quietly[a] and seize control of the kingdom through political schemes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “peaceably,” emphasizing an appearance of calm or security rather than open aggression.
    reason: lexical_alternative
  - marker: b
    text: Or “by flattery,” referring to deceptive, smooth speech used to gain power.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: in his place a despised man will arise
  simplified_phrase: A despised man will take his place
  preserved_meaning: A man held in contempt will succeed the previous ruler.
  reasoning_layer_used: Lexical decisions for וְעָמַד and עַל־כַּנּוֹ
  rationale: “Take his place” states the political succession more directly in common English.
- pob_phrase: on whom they had not bestowed the majesty of kingship
  simplified_phrase: He will not have been given the honor of kingship
  preserved_meaning: He will not receive the recognized dignity and office of royal rule.
  reasoning_layer_used: Lexical decisions for וְלֹא נָתְנוּ עָלָיו and הוֹד מַלְכוּת
  rationale: “Given the honor” replaces formal “bestowed the majesty” while retaining both royal dignity and office.
- pob_phrase: seize the kingdom by intrigues
  simplified_phrase: seize control of the kingdom through political schemes
  preserved_meaning: He will gain firm political control through deceptive manipulation.
  reasoning_layer_used: Lexical decisions for וְהֶחֱזִיק מַלְכוּת and בַּחֲלַקְלַקּוֹת
  rationale: “Political schemes” makes the kind of intrigue clear without losing its deceptive force.
