translation:
  language: en
  text: Some of those who have insight will stumble.[a] Among them,[b] this will serve to refine and purify them and make them white[c] until the time of the end. For the appointed time is still to come.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “will fall.” The image may refer to downfall through persecution or trial.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also mean “by them” or “through them.”
    reason: lexical_alternative
  - marker: c
    text: “Make them white” is a Hebrew image for cleansing or purification.
    reason: simplification_note
simplification_decisions:
