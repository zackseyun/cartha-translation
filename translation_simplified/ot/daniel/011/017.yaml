translation:
  language: en
  text: He will set his face on coming with the full strength of his kingdom. He will bring fair terms with him,[a] and he will act. He will give him the “daughter of women”[b] in order to destroy it.[c] But she will not succeed,[c] and she will not be for him.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult Hebrew may instead mean that upright people accompany him or that an agreement is made with him.
    reason: alternative_reading
  - marker: b
    text: “The daughter of women” likely means a royal daughter given in a political marriage.
    reason: cultural_note
  - marker: c
    text: The feminine Hebrew forms may refer to the woman or to a kingdom or scheme; the sense may be, “to ruin her, but the scheme will fail.”
    reason: lexical_alternative
  - marker: d
    text: The Hebrew may mean that she will not belong to him or will not be on his side.
    reason: lexical_alternative
