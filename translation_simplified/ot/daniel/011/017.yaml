  text: He will set his face to come with the strength of his whole kingdom[a], and upright terms will be with him; and he will act. He will give him the daughter of women to destroy it, but she will not stand[d][c][b], and she will not be for him.
  footnotes:
  - marker: a
    text: Or 'and equitable terms will be with him,' or 'and an agreement will be made with him.' The Hebrew phrase 'upright ones' is difficult in context and may refer either to persons with him or to fair terms/arrangements.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'the daughter of women,' likely referring to a royal daughter given in marriage; many understand this historically as a political marriage alliance.
    reason: cultural_note
  - marker: c
    text: The Hebrew suffix in 'to destroy it/her' is feminine singular and may refer either to the woman ('to ruin her') or to a feminine antecedent such as a kingdom or plan.
    reason: lexical_alternative
  - marker: d
    text: Or 'but it will not stand' or 'but she will not succeed.' The feminine verb may refer to the woman or to the scheme.
    reason: alternative_reading
