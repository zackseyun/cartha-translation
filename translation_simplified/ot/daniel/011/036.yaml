translation:
  language: en
  text: The king will do whatever he wants. He will raise himself up and make himself greater than every god. He will speak astonishing things[a] against the God of gods. He will succeed until the time of indignation comes to an end[b], because what has been decreed will happen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “marvelous things,” but here it describes shocking, arrogant speech.
    reason: lexical_alternative
  - marker: b
    text: Or “until the time of wrath comes to an end.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: will do as he pleases
  simplified_phrase: will do whatever he wants
  preserved_meaning: The king acts according to his own unchecked will.
  reasoning_layer_used: POB lexical decision for וְעָשָׂה כִרְצוֹנוֹ
  rationale: Common wording preserves the force of autonomous self-will.
- pob_phrase: will exalt himself and magnify himself above every god
  simplified_phrase: will raise himself up and make himself greater than every god
  preserved_meaning: Both stages of the king’s self-exaltation remain distinct.
  reasoning_layer_used: POB lexical decisions for וְיִתְרוֹמֵם, וְיִתְגַּדֵּל, and עַל כָּל אֵל
  rationale: Concrete verbs clarify the image while retaining its intensification.
- pob_phrase: he will prosper until the indignation is finished
  simplified_phrase: he will succeed until the time of indignation comes to an end
  preserved_meaning: His success is temporary and lasts only to the fixed end of the indignation.
  reasoning_layer_used: POB lexical and theological decisions for וְהִצְלִיחַ and עַד כָּלָה זַעַם
  rationale: The rewrite clarifies duration without naming the source of the indignation.
