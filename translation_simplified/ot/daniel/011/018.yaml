translation:
  language: en
  text: Then he will turn his face toward the coastlands[a] and capture many. But a commander will stop the insults he directs against him. In fact, the commander will turn those insults back on him.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “islands.” The Hebrew word can refer to islands or more broadly to coastal regions.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew of these final clauses is difficult. It may mean that the commander ends the king’s insults and turns them back on him.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: turn his face to the coastlands
  simplified_phrase: turn his face toward the coastlands
  preserved_meaning: He directs himself toward a coastal or maritime campaign while the Hebrew face-image remains intact.
  reasoning_layer_used: POB lexical decision for וישב פניו and לאיים
  rationale: “Toward” makes the direction natural in English without weakening the source image.
- pob_phrase: put an end to his reproach against him
  simplified_phrase: stop the insults he directs against him
  preserved_meaning: The commander ends the king’s hostile reproach against him.
  reasoning_layer_used: POB lexical and theological decisions for והשבית and חרפתו לו
  rationale: “Stop the insults” expresses the difficult military-context wording in common English.
- pob_phrase: indeed, he will repay his reproach to him
  simplified_phrase: In fact, the commander will turn those insults back on him
  preserved_meaning: The commander reverses and repays the king’s reproach rather than adopting the rejected privative reading.
  reasoning_layer_used: POB doctrine realignment and lexical decision for בלתי חרפתו ישיב לו
  rationale: Repeating “the commander” clarifies the subject while “turn back” preserves the source image of reversal.
interpretive_expansions:
- pob_phrase: his reproach against him
  rendering: the insults he directs against him
  claim: The reproach is hostile insult directed by the king against the commander.
  evidence:
  - The POB lexical rationale gives “the insult he inflicted on him” as a viable relational sense.
  - The POB theological decision identifies the king’s reproach as what the commander stops and repays.
  confidence: moderate
  alternatives_preserved:
  - A commander removes reproach from himself.
  - A ruler ends the disgrace brought by the king.
