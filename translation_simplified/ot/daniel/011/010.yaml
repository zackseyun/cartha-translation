translation:
  language: en
  text: His sons will prepare for war and gather a vast army. One[a] will certainly advance, sweeping through like a flood. Then he will return and fight as far as his fortress.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew shifts from “his sons” to one unnamed son.
    reason: alternative_reading
  - marker: b
    text: Or “his stronghold”; the Hebrew does not make clear whose fortress it is.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: will stir themselves up and assemble a multitude of great forces
  simplified_phrase: will prepare for war and gather a vast army
  preserved_meaning: The sons ready themselves for conflict and mass numerous troops.
  reasoning_layer_used: Lexical decisions for יִתְגָּרוּ and הֲמוֹן חֲיָלִים רַבִּים
  rationale: Common military language replaces the difficult reflexive wording and dense troop description.
- pob_phrase: one will certainly come and overflow and pass through
  simplified_phrase: One will certainly advance, sweeping through like a flood
  preserved_meaning: A single unnamed son makes an emphatic, overwhelming military advance through the territory.
  reasoning_layer_used: Lexical decisions for וּבָא בּוֹא, וְשָׁטַף, and וְעָבָר
  rationale: “Advance” clarifies the movement while the flood image preserves its overwhelming force.
- pob_phrase: then he will return and stir up war as far as his fortress
  simplified_phrase: Then he will return and fight as far as his fortress
  preserved_meaning: The singular actor returns and renews the conflict as far as the fortress, whose owner remains unclear.
  reasoning_layer_used: Lexical and theological decisions for וְיָשֹׁב, וְיִתְגָּרוּ, and עַד מָעֻזֹּה
  rationale: The revision keeps the return, renewed conflict, and its extent connected without resolving the fortress’s owner.
translation_notes:
  risk_flags:
  - risk: “One” could obscure the Hebrew shift from several sons to one actor.
    mitigation: Footnote a identifies the shift without naming the son.
  - risk: “His fortress” may imply a clearer owner than the context provides.
    mitigation: Footnote b preserves uncertainty about whose fortress is meant.
