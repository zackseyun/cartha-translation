translation:
  language: en
  text: 'Then he said, “Do you know why I have come to you? Now I will go back to fight against the prince of Persia. And take notice: when I leave,[a] the prince of Greece[b] is coming.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “and I am leaving.”
    reason: lexical_alternative
  - marker: b
    text: These “princes” are probably supernatural rulers associated with nations, though this verse does not explicitly say so.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: I will return to fight against
  simplified_phrase: I will go back to fight against
  preserved_meaning: The speaker will resume an earlier conflict with Persia’s prince.
  reasoning_layer_used: Lexical decision for אָשׁוּב and לְהִלָּחֵם עִם
  rationale: “Go back” expresses the return in more common English.
- pob_phrase: behold
  simplified_phrase: take notice
  preserved_meaning: The speaker solemnly draws Daniel’s attention to what follows.
  reasoning_layer_used: Lexical decision for וְהִנֵּה
  rationale: “Take notice” keeps the attention-directing force without archaic wording.
- pob_phrase: when I go out
  simplified_phrase: when I leave
  preserved_meaning: The clause describes the speaker’s departure while retaining its temporal reading.
  reasoning_layer_used: Lexical decision and POB footnote a
  rationale: “Leave” is the clearest ordinary English for departing in this context.
translation_notes:
  risk_flags:
  - risk: “When I leave” may sound more definite than the terse Hebrew clause.
    mitigation: Footnote a preserves the alternative simple-departure wording.
  - risk: Modern readers may assume the princes are only human rulers.
    mitigation: Footnote b notes the likely supernatural context without adding that label to the verse.
