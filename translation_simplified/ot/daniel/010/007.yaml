translation:
  language: en
  text: I, Daniel, was the only one who saw the vision. The men with me did not see it. But a great trembling fell on them,[a] and they fled to hide.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This can also mean, “great terror fell on them.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And I, Daniel, alone saw the vision
  simplified_phrase: I, Daniel, was the only one who saw the vision.
  preserved_meaning: Daniel emphasizes that he alone saw the vision.
  reasoning_layer_used: Lexical decisions for אֲנִי דָנִיֵּאל and לְבַדִּי
  rationale: The new sentence makes the contrast immediately clear while retaining Daniel’s emphatic self-identification.
- pob_phrase: and the men who were with me did not see the vision
  simplified_phrase: The men with me did not see it.
  preserved_meaning: Daniel’s male companions did not see the vision.
  reasoning_layer_used: Lexical decisions for אֲנָשִׁים and הַמַּרְאָה
  rationale: A separate sentence and the pronoun “it” avoid needless repetition without changing the contrast.
- pob_phrase: and they fled to hide themselves
  simplified_phrase: and they fled to hide
  preserved_meaning: They escaped with the purpose of hiding.
  reasoning_layer_used: Lexical decisions for וַיִּבְרְחוּ and בְּהֵחָבֵא
  rationale: The reflexive wording is unnecessary in modern English because the purpose of their flight remains clear.
translation_notes:
  risk_flags:
  - risk: “A great trembling fell on them” is less idiomatic than “came over them.”
    mitigation: The wording retains the vivid source-language image, while the footnote preserves the important alternative sense of terror.
