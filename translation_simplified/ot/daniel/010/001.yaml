translation:
  language: en
  text: In the third year of the reign of Cyrus, king of Persia, a word was revealed to Daniel, who was also called Belteshazzar. The word was true and concerned a great conflict.[a] Daniel understood the word and understood the vision.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “and a great warfare.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: In the third year of Cyrus king of Persia
  simplified_phrase: In the third year of the reign of Cyrus, king of Persia
  preserved_meaning: The revelation came during Cyrus’s third year as king of Persia.
  reasoning_layer_used: source syntax and historical context
  rationale: Adding “reign” makes the dating formula clear in modern English.
- pob_phrase: who was called Belteshazzar
  simplified_phrase: who was also called Belteshazzar
  preserved_meaning: Belteshazzar was another name used for Daniel.
  reasoning_layer_used: lexical decision for נִקְרָא שְׁמוֹ
  rationale: “Also” makes clear that Belteshazzar refers to Daniel, not another person.
- pob_phrase: he understood the word and had understanding in the vision
  simplified_phrase: Daniel understood the word and understood the vision
  preserved_meaning: Daniel grasped both the revealed word and the vision.
  reasoning_layer_used: lexical decisions for וּבִין, וּבִינָה לוֹ, and בַּמַּרְאֶה
  rationale: Repeating “understood” preserves both claims without making the vision the means of insight.
interpretive_expansions:
- pob_phrase: In the third year of Cyrus king of Persia
  rendering: In the third year of the reign of Cyrus, king of Persia
  claim: The third year refers to Cyrus’s reign.
  evidence:
  - The Hebrew dating formula relates the year to Cyrus as king.
  confidence: high
translation_notes:
  risk_flags:
  - risk: “Great conflict” does not display the phrase’s full military force.
    mitigation: The footnote preserves the formal alternative “great warfare.”
  - risk: “Understood the vision” states the likely object of Daniel’s understanding more directly than POB’s wording.
    mitigation: It preserves the locative sense without imposing the disputed instrumental reading “through the vision.”
