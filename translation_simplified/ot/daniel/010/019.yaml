translation:
  language: en
  text: He said, “Do not be afraid. You are a man greatly loved.[a] May you have peace. Be strong—yes, be strong!” As he spoke to me, I gained strength. Then I said, “My lord, please speak, because you have given me strength.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a highly esteemed man” or “a man much desired”; the Hebrew is an expression of special favor and preciousness.
    reason: lexical_alternative
