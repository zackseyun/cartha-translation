  preserved_meaning: The Persian prince actively resisted the speaker.
  reasoning_layer_used: lexical decision for עֹמֵד לְנֶגְדִּי
  rationale: “Opposed me” states the adversarial force in direct modern English.
- pob_phrase: But ... and behold ... and
  simplified_phrase: Two sentences with “But then”
  preserved_meaning: Michael's arrival is presented as a marked turn after twenty-one days of opposition.
  reasoning_layer_used: lexical decision for וְהִנֵּה and optimal-equivalence philosophy
  rationale: The sentence break eases reading, while “But then” preserves the vivid narrative turn.
- pob_phrase: one of the chief princes
  simplified_phrase: one of the chief princes
  preserved_meaning: Michael holds high rank without being explicitly identified as an angel.
  reasoning_layer_used: lexical and theological decisions for שַׂר
  rationale: Retaining “prince” protects the text's documented ambiguity about these figures.
