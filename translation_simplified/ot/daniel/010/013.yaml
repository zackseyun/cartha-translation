translation:
  language: en
  text: But the prince of the kingdom of Persia opposed me for twenty-one days. But then Michael, one of the chief princes,[a] came to help me, and I was left there beside the kings of Persia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “one of the first princes” or “one of the foremost princes.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says “the kings of Persia,” in the plural; some translations use the singular, “the king of Persia.”
    reason: alternative_reading
