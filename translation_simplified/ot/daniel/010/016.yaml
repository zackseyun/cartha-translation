translation:
  language: en
  text: Something resembling a human figure[a] touched my lips. Then I opened my mouth, began to speak, and said to the one standing in front of me, “My lord, this vision has overwhelmed me with pain, and I have no strength left.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses an unusually layered expression that may also be translated “one in human likeness”; it is not the title “Son of Man.”
