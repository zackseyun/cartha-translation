translation:
  language: en
  text: He said to me, “Daniel, you are greatly loved.[a] Understand what I am telling you. Stand in your place,[b] because I have now been sent to you.” When he said this, I stood up, trembling.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “you are highly esteemed.” The Hebrew is an honorific describing Daniel as precious or desirable.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew expression may also mean “stand upright” or “stand at your station.”
    reason: lexical_alternative
