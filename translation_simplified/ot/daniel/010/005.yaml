translation:
  language: en
  text: I raised my eyes and looked. There before me was a man dressed in linen, with a belt of Uphaz gold around his waist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a belt of fine gold from Uphaz.” The Hebrew may emphasize the gold’s quality as well as where it came from.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I lifted up my eyes and looked, and behold
  simplified_phrase: I raised my eyes and looked. There before me was
  preserved_meaning: Daniel directs his gaze and then sees the figure in a vivid visionary moment.
  reasoning_layer_used: Lexical decisions for וָאֶשָּׂא, עֵינַי, וָאֵרֶא, and וְהִנֵּה
  rationale: Two short sentences preserve the stages of perception while expressing “behold” naturally.
- pob_phrase: a man clothed in linen
  simplified_phrase: a man dressed in linen
  preserved_meaning: The figure is male and wears linen, but the text does not identify him further.
  reasoning_layer_used: Lexical and theological decisions on אִישׁ אֶחָד and לָבוּשׁ בַּדִּים
  rationale: “Dressed” is common English, while “a man” preserves the intended neutrality.
- pob_phrase: with his waist girded with the gold of Uphaz
  simplified_phrase: with a belt of Uphaz gold around his waist
  preserved_meaning: Gold associated with Uphaz encircles the man’s waist without making provenance the only possible nuance.
  reasoning_layer_used: Lexical decisions on מָתְנָיו, חֲגֻרִים, and בְּכֶתֶם אוּפָז
  rationale: The concrete belt image replaces “girded,” while “Uphaz gold” leaves the source-and-quality nuance open.
interpretive_expansions:
- pob_phrase: his waist girded with the gold of Uphaz
  rendering: a belt of Uphaz gold around his waist
  claim: The gold forms or adorns a belt-like item encircling the waist.
  evidence:
  - The POB lists “belted” as an alternative for חֲגֻרִים.
  - The immediate phrase places the gold at the man’s waist.
  confidence: high
  alternatives_preserved:
  - It could be a gold-wrapped sash rather than a rigid belt.
  - Uphaz may indicate the gold’s quality as well as its source.
translation_notes:
  risk_flags:
  - risk: “Belt” is more specific than the Hebrew’s general image of being girded.
    mitigation: The audit preserves the possibility of a sash or another waist-binding garment.
  - risk: “Uphaz gold” may not fully convey whether Uphaz signals source, quality, or both.
    mitigation: The footnote preserves the alternative wording and both nuances.
