translation:
  language: en
  text: Then the king told Ashpenaz, the head of his court officials, to bring in some Israelites, including those from the royal line and from the nobility.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “the head of his eunuchs.” The term can refer either to eunuchs or more generally to high royal officials.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the chief of his court officials
  simplified_phrase: the head of his court officials
  preserved_meaning: Ashpenaz held authority over the king’s court officials.
  reasoning_layer_used: POB lexical decision for רַב סָרִיסָיו
  rationale: “Head” expresses his leadership role in more familiar English while the footnote preserves the lexical ambiguity.
- pob_phrase: some of the sons of Israel
  simplified_phrase: some Israelites
  preserved_meaning: The king sought people belonging to Israel.
  reasoning_layer_used: POB lexical decision for מִבְּנֵי יִשְׂרָאֵל
  rationale: “Israelites” clearly communicates the people-group meaning intended here.
- pob_phrase: both from the royal offspring and from the nobles
  simplified_phrase: including those from the royal line and from the nobility
  preserved_meaning: Those selected included Israelites of royal descent and high social rank.
  reasoning_layer_used: POB lexical decisions and applied revision
  rationale: “Royal line” keeps the descent idea, while “nobility” naturally names the elite social class.
