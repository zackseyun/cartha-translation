translation:
  language: en
  text: They were to be young men with no physical defects, handsome, skilled in every kind of wisdom, well educated, quick to understand, and able to serve in the king’s palace.[a] They were to be taught the writings and language of the Chaldeans.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “to stand in the king’s palace,” an expression for attending or serving there.
    reason: lexical_alternative
  - marker: b
    text: “Chaldeans” may here refer broadly to the Babylonians, but the Hebrew specifically says “Chaldeans.”
    reason: cultural_note
