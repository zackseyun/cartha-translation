translation:
  language: en
  text: The king asked them about every matter of wisdom and understanding. He found them ten times better than all the magicians and enchanters[a] throughout his kingdom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “magicians and astrologers.” The exact meaning of the second term is uncertain; it names a class of Babylonian wise men.
    reason: alternative_reading
