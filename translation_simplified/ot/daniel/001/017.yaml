simplification_decisions:
- pob_phrase: As for these four youths
  simplified_phrase: God gave these four youths
  preserved_meaning: The verse identifies the same four young trainees and attributes their abilities to God.
  reasoning_layer_used: POB lexical decisions for הַיְלָדִים, הָאֵלֶּה אַרְבַּעְתָּם, and נָתַן לָהֶם הָאֱלֹהִים
  rationale: A direct opening is clearer while keeping God's agency explicit.
- pob_phrase: in every kind of literature
  simplified_phrase: in all kinds of writings
  preserved_meaning: The phrase refers broadly to written learning rather than every individual book.
  reasoning_layer_used: POB lexical decision for בְּכָל סֵפֶר
  rationale: “Writings” expresses the broad literary domain in common English.
- pob_phrase: Daniel had understanding in every vision and dream
  simplified_phrase: Daniel also understood every vision and dream
  preserved_meaning: Daniel had comprehensive understanding concerning visions and dreams without specifying interpretation or reception.
  reasoning_layer_used: POB lexical and theological decisions for הֵבִין and בְּכָל חָזוֹן וַחֲלֹמוֹת
  rationale: The active verb is natural English, and “every” preserves the source's full scope.
