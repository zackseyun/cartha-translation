translation:
  language: en
  text: But Daniel decided that he would not defile himself by eating the king’s food or drinking his wine. He asked the chief of the eunuchs[a] for permission so that he would not defile himself.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term may also mean “the chief official” or “the commander of the court officials.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: resolved in his heart
  simplified_phrase: decided that he would
  preserved_meaning: Daniel made a deliberate, settled decision.
  reasoning_layer_used: Lexical decision for וַיָּשֶׂם ... עַל לִבּוֹ
  rationale: A direct modern verb clearly conveys the idiom’s inward resolve.
- pob_phrase: with the king’s food or with the wine he drank
  simplified_phrase: by eating the king’s food or drinking his wine
  preserved_meaning: Daniel intended to refuse both provisions supplied by the king.
  reasoning_layer_used: Lexical decisions for פַּתְבַּג and יֵין מִשְׁתָּיו
  rationale: Verbal wording makes the actions involving the food and wine immediately clear.
- pob_phrase: he sought permission from the chief of the eunuchs that he might not defile himself
  simplified_phrase: He asked the chief of the eunuchs for permission so that he would not defile himself
  preserved_meaning: Daniel requested official authorization to avoid defiling himself.
  reasoning_layer_used: Lexical decisions for וַיְבַקֵּשׁ and אֲשֶׁר לֹא יִתְגָּאָל
  rationale: The separate sentence states the request and its purpose directly.
translation_notes:
  risk_flags:
  - risk: Readers may assume a specific reason the provisions would defile Daniel.
    mitigation: The text retains “defile” without choosing a dietary, ceremonial, or idolatrous explanation.
  - risk: “Eunuchs” may identify the officials too narrowly.
    mitigation: The footnote preserves the broader court-official meaning.
