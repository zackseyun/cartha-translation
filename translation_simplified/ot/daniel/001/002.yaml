translation:
  language: en
  text: The Lord gave King Jehoiakim of Judah into Nebuchadnezzar’s hand—that is, into his power—along with some of the objects from God’s house. Nebuchadnezzar brought them to the land of Shinar,[a] to the house of his god.[b] He brought the objects into his god’s treasury.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Shinar is the ancient name for Babylonia.
    reason: cultural_note
  - marker: b
    text: The “house of his god” means his god’s temple; the Hebrew repeats “house” to echo “God’s house” earlier in the verse.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Jehoiakim king of Judah
  simplified_phrase: King Jehoiakim of Judah
  preserved_meaning: Jehoiakim remains identified as Judah’s king.
  reasoning_layer_used: POB lexical decision on the royal title
  rationale: Natural English places the title before the king’s name.
- pob_phrase: some of the vessels of the house of God
  simplified_phrase: some of the objects from God’s house
  preserved_meaning: Nebuchadnezzar received part of the physical contents of God’s house.
  reasoning_layer_used: POB lexical decision for כְּלֵי and בֵית הָאֱלֹהִים
  rationale: “Objects” is clearer than the specialized use of “vessels,” while “God’s house” preserves the Hebrew image.
- pob_phrase: he brought the vessels into the treasury of his god
  simplified_phrase: He brought the objects into his god’s treasury.
  preserved_meaning: The captured temple objects were placed in the pagan god’s treasury.
  reasoning_layer_used: POB lexical decision for אוֹצָר and preserved Hebrew repetition
  rationale: A new sentence makes the repeated action easier to follow without removing it.
