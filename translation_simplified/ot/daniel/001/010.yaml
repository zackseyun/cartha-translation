translation:
  language: en
  text: But the chief of the eunuchs[a] said to Daniel, “I am afraid of my lord the king. He assigned your food and drink. If he sees that you look worse than the other young men your age, you will put my head—and my life—at risk before the king.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the chief official.” The Hebrew term can refer either to eunuchs or more broadly to royal court officials.
    reason: lexical_alternative
