translation:
  language: en
  text: So Yahweh kept watch over the disaster until he brought it upon us. Yahweh our God is righteous in everything he has done, and we did not listen to his voice or obey him.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: kept watch over the disaster and brought it upon us
  simplified_phrase: kept watch over the disaster until he brought it upon us
  preserved_meaning: Yahweh remained vigilant concerning the announced disaster and then brought it on the people.
  reasoning_layer_used: POB lexical decision for וַיִּשְׁקֹד and its contextual rationale
  rationale: Adding “until” makes the watchfulness image and its connection to judgment easier to follow.
- pob_phrase: righteous in all the works that he has done
  simplified_phrase: righteous in everything he has done
  preserved_meaning: All of Yahweh’s actions, including this judgment, were righteous.
  reasoning_layer_used: POB lexical and theological decisions for צַדִּיק and רָעָה
  rationale: “Everything” replaces the formal phrase “all the works” without weakening the claim.
- pob_phrase: we have not listened to his voice
  simplified_phrase: we did not listen to his voice or obey him
  preserved_meaning: The people failed to listen to Yahweh in the obedient sense intended by the Hebrew idiom.
  reasoning_layer_used: POB lexical decision for וְלֹא שָׁמַעְנוּ בְּקֹלוֹ and footnote c
  rationale: The wording retains the voice image while directly explaining that listening required obedience.
