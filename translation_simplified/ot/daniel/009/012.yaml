translation:
  language: en
  text: He made the words he had spoken against us and against our leaders who governed us[a] come true by bringing this great disaster on us. Nothing like what happened in Jerusalem had ever happened anywhere under heaven.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “our judges who judged us” or “our rulers who ruled us.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: He has confirmed his words that he spoke against us
  simplified_phrase: He made the words he had spoken against us come true
  preserved_meaning: God fulfilled the judgment he had previously announced against the people.
  reasoning_layer_used: Lexical decision for וַיָּקֶם and the theological decision identifying God as the implied subject.
  rationale: “Made ... come true” clearly expresses that God caused his warning to stand fulfilled.
- pob_phrase: our judges who judged us
  simplified_phrase: our leaders who governed us
  preserved_meaning: The judgment also concerned the people’s governing authorities.
  reasoning_layer_used: Lexical decision for שֹׁפְטֵינוּ אֲשֶׁר שְׁפָטוּנוּ and its documented alternatives.
  rationale: “Leaders who governed us” avoids the overly narrow modern sense of courtroom judges.
- pob_phrase: such as had not been done under all heaven, as it was done in Jerusalem
  simplified_phrase: Nothing like what happened in Jerusalem had ever happened anywhere under heaven
  preserved_meaning: Jerusalem suffered a disaster presented as without precedent throughout the world.
  reasoning_layer_used: Lexical decisions for the comparative clause, the heaven idiom, and the Jerusalem clause.
  rationale: The recast sentence makes the comparison direct while retaining the biblical image “under heaven.”
