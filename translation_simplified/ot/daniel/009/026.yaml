translation:
  language: en
  text: After the sixty-two weeks, an anointed one[a] will be cut off. He will have nothing.[b] The people of the coming ruler[c] will destroy the city and the sanctuary. Its end will come with a flood.[d] War will continue until the end, and desolations have been decreed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Messiah.” The Hebrew says “an anointed one,” and interpreters differ on whether this specifically means the Messiah.
    reason: alternative_reading
  - marker: b
    text: Or “nothing will be for him” or “no one will be for him.” The Hebrew is brief and difficult.
    reason: lexical_alternative
  - marker: c
    text: Or “the people of a coming ruler.”
    reason: lexical_alternative
  - marker: d
    text: Or “his end will come with a flood.” It is uncertain what the pronoun refers to.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: an anointed one will be cut off and will have nothing
  simplified_phrase: an anointed one will be cut off. He will have nothing.
  preserved_meaning: The anointed one is removed violently and left with nothing, without defining the precise loss.
  reasoning_layer_used: Lexical and theological decisions on יִכָּרֵת, מָשִׁיחַ, and וְאֵין לוֹ
  rationale: Two short sentences make the compressed clause easier to follow while retaining its ambiguity.
- pob_phrase: the city and the sanctuary the people of the coming ruler will destroy
  simplified_phrase: The people of the coming ruler will destroy the city and the sanctuary.
  preserved_meaning: The coming ruler’s people destroy both the city and its holy precinct.
  reasoning_layer_used: Lexical decisions on עַם נָגִיד הַבָּא and הָעִיר וְהַקֹּדֶשׁ
  rationale: Ordinary English word order clearly identifies who carries out the destruction.
- pob_phrase: until the end there will be war
  simplified_phrase: War will continue until the end
  preserved_meaning: Warfare remains ongoing up to the end.
  reasoning_layer_used: Lexical rationale for וְעַד קֵץ מִלְחָמָה
  rationale: “Continue” expresses the ongoing force in direct modern English.
translation_notes:
  risk_flags:
  - risk: Readers may assume “an anointed one” cannot refer to the Messiah.
    mitigation: Footnote a preserves the messianic reading without resolving the debated identification.
  - risk: “Its end” may sound more definite than the ambiguous Hebrew pronoun.
    mitigation: Footnote d preserves the possible personal reading “his end.”
