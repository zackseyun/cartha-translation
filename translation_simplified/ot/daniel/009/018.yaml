translation:
  language: en
  text: My God, turn your ear toward us and hear. Open your eyes and see our desolations and the city that bears your name. We bring our pleas before you not because of our righteous deeds, but because of your abundant mercies.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Incline your ear, my God, and hear
  simplified_phrase: My God, turn your ear toward us and hear
  preserved_meaning: The embodied image asks God to turn attentively toward the petitioners and listen.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Turn your ear” communicates attentive listening more naturally than “incline” or “bend down.”
- pob_phrase: the city that is called by your name
  simplified_phrase: the city that bears your name
  preserved_meaning: The city remains identified with God and under his covenantal ownership.
  reasoning_layer_used: lexical decision
  rationale: “Bears your name” expresses the Hebrew naming idiom in clear modern English.
- pob_phrase: we are not presenting our pleas before you because of our righteousnesses
  simplified_phrase: We bring our pleas before you not because of our righteous deeds
  preserved_meaning: The prayer rejects Israel’s merit as the basis for its appeal.
  reasoning_layer_used: lexical footnote and theological decision
  rationale: “Righteous deeds” clearly conveys the likely sense of the unusual Hebrew plural.
interpretive_expansions:
- pob_phrase: Incline your ear
  rendering: turn your ear toward us
  claim: The request is for God to direct his attention toward the people praying.
  evidence:
  - The lexical audit explains that the ear idiom requests attentive listening.
  - The surrounding first-person plural pleas identify the petitioners.
  confidence: high
  alternatives_preserved:
  - turn your ear and hear
- pob_phrase: our righteousnesses
  rendering: our righteous deeds
  claim: The plural refers to righteous acts that might be offered as grounds for the plea.
  evidence:
  - The POB lexical note identifies righteous acts or claims of righteousness as the likely sense.
  - The verse contrasts human righteousness with God’s mercies.
  confidence: high
  alternatives_preserved:
  - our claims of righteousness
translation_notes:
  risk_flags:
