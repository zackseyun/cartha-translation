translation:
  language: en
  text: Seventy weeks[a] have been decreed for your people and your holy city. They are decreed to bring the transgression to an end, to seal up sins,[b] and to make atonement for iniquity. They will also bring in everlasting righteousness, seal up vision and prophet,[c] and anoint the most holy place.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew says “seventy sevens”; many understand this to mean seventy periods of seven years.
    reason: lexical_alternative
  - marker: b
    text: Or “put an end to sins.”
    reason: lexical_alternative
  - marker: c
    text: Hebrew says “vision and prophet”; some understand this to mean “vision and prophecy.”
    reason: alternative_reading
  - marker: d
    text: Or “anoint a most holy one”; the Hebrew may refer to the holiest place or thing, though some understand it as a person.
    reason: alternative_reading
