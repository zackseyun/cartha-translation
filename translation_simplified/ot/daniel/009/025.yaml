translation:
  language: en
  text: 'Know this and understand it: From the time the word goes out to restore and rebuild Jerusalem until an anointed one[a], a ruler, there will be seven weeks. For another sixty-two weeks[b], Jerusalem will be restored and rebuilt, with a public square and a moat[c], even during troubled times.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “until Messiah, a ruler” or “until Messiah the Prince.” The Hebrew says “anointed one, ruler/prince.”
    reason: alternative_reading
  - marker: b
    text: “Seven weeks” and “sixty-two weeks” may also be translated “seven sevens” and “sixty-two sevens.”
    reason: lexical_alternative
  - marker: c
    text: The Hebrew word translated “moat” is uncertain and may mean a trench or defensive ditch.
    reason: lexical_alternative
