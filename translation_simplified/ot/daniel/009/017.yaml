  reasoning_layer_used: Lexical decision for תְּפִלַּת עַבְדְּךָ.
  rationale: The possessive form is shorter and more natural in common English.
- pob_phrase: and let your face shine upon your sanctuary
  simplified_phrase: Let your face shine with favor on your sanctuary
  preserved_meaning: Daniel asks God to turn his gracious favor toward his holy sanctuary.
  reasoning_layer_used: Lexical rationale and doctrine realignment preserving the covenant-blessing image.
  rationale: “On” is common English, and “with favor” explains the preserved image.
