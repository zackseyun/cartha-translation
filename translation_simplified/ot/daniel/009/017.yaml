translation:
  language: en
  text: Now, our God, hear your servant’s prayer and his pleas for mercy. Let your face shine with favor on your sanctuary, which lies desolate, for the Lord’s sake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “for your own sake, O Lord.” The Hebrew says “for the sake of the Lord,” using a divine title in the third person even though Daniel is speaking directly to God.
    reason: alternative_reading
