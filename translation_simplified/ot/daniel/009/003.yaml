translation:
  language: en
  text: So I turned my face toward the Lord God to seek him in prayer and plead for mercy. I fasted, wore rough mourning cloth,[a] and put ashes on myself to show sorrow and humility.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The traditional term for rough mourning cloth is “sackcloth.”
    reason: cultural_note
