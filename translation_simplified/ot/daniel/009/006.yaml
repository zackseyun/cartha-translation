translation:
  language: en
  text: Your servants the prophets spoke in your name to our kings, our officials, our fathers,[a] and everyone in the land. Yet we did not listen to them.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “our ancestors.” Literally “our fathers.”
    reason: lexical_alternative
  - marker: b
    text: “Listen” here includes the sense of taking heed and responding; it may also be translated “obey.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: We have not listened to your servants the prophets, who spoke
  simplified_phrase: Your servants the prophets spoke ... Yet we did not listen to them.
  preserved_meaning: The people failed to heed the prophets who served God.
  reasoning_layer_used: POB syntax and lexical decision for שָׁמַעְנוּ
  rationale: Two direct sentences make the relationship between speaking and failing to listen easier to follow.
- pob_phrase: and to all the people of the land
  simplified_phrase: and everyone in the land
  preserved_meaning: The prophets addressed the whole population, not only its leaders.
  reasoning_layer_used: POB lexical decision for כָּל עַם הָאָרֶץ
  rationale: “Everyone in the land” expresses the collective phrase in natural modern English.
translation_notes:
  risk_flags:
  - risk: Reordering the clauses could weaken the verse’s opening emphasis on confession.
    mitigation: “Yet” clearly marks the people’s failure as the main point.
  - risk: Modern readers may take “our fathers” to mean only immediate parents.
    mitigation: The footnote preserves “ancestors” as the contextual alternative.
