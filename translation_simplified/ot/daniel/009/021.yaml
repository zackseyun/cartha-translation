translation:
  language: en
  text: While I was still praying, Gabriel—the man I had seen in the earlier vision—flew swiftly[a] to me. He arrived at the time of the evening offering.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew phrase is difficult. Less likely, it may mean that Gabriel came wearily or in weariness.
    reason: alternative_reading
