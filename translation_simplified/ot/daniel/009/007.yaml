translation:
  language: en
  text: O Lord, you are righteous, but today we bear open shame on our faces—the men of Judah, the residents of Jerusalem, and all Israel, both those nearby and those far away, in every land where you have driven them—because of the unfaithfulness they committed against you.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: To you, O Lord, belongs righteousness
  simplified_phrase: O Lord, you are righteous
  preserved_meaning: God is morally right and vindicated in contrast to his people.
  reasoning_layer_used: Lexical and theological decisions on הַצְּדָקָה
  rationale: The direct statement expresses the same confessional contrast in ordinary English.
- pob_phrase: shame of face, as it is this day
  simplified_phrase: today we bear open shame on our faces
  preserved_meaning: The people presently experience visible, public disgrace.
  reasoning_layer_used: Lexical rationales for בֹּשֶׁת הַפָּנִים and כַּיּוֹם הַזֶּה
  rationale: This keeps the face image while clearly expressing the idiom and its present force.
- pob_phrase: the inhabitants of Jerusalem ... those who are near and those who are far away, in all the lands
  simplified_phrase: the residents of Jerusalem ... both those nearby and those far away, in every land
  preserved_meaning: The confession includes Israelites in Jerusalem and throughout the exile.
  reasoning_layer_used: Lexical decisions on inhabitants, near and far, and lands
  rationale: Common wording and shorter phrases clarify the geographic scope without narrowing it.
interpretive_expansions:
- pob_phrase: shame of face
  rendering: open shame on our faces
  claim: The shame is visible and public, not merely inward.
  evidence:
  - The POB lexical rationale identifies the idiom as public disgrace visible on the face.
  confidence: high
  alternatives_preserved:
  - shame on our faces
translation_notes:
  risk_flags:
  - risk: “You are righteous” may soften the nuance that God is shown to be in the right.
    mitigation: The wording retains “righteous” within the verse’s direct contrast with Israel’s deserved shame.
  - risk: The movement from “we” to “them” may feel abrupt in English.
    mitigation: The identifying list remains attached to “we,” while the pronoun shift preserves the POB structure and divine agency.
