translation:
  language: en
  text: He will make a firm covenant[a] with the many for one week. For half of that week, he will stop sacrifice and offering.[b] On the wing of abominations,[c] one who brings desolation will come, until the decreed end is poured out on the desolator.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “confirm a covenant” or “strengthen a covenant.”
    reason: lexical_alternative
  - marker: b
    text: The second term may refer specifically to a grain offering.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew phrase “wing of abominations” is difficult; “pinnacle of abominations” is another possible reading.
    reason: alternative_reading
  - marker: d
    text: The final words may instead mean “on the one made desolate” or “on the desolate place.”
    reason: alternative_reading
