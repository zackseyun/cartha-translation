  preserved_meaning: He causes the sacrificial practices to cease during half of the stated week.
  reasoning_layer_used: Lexical decision for וַחֲצִי הַשָּׁבוּעַ and יַשְׁבִּית
  rationale: A separate sentence and the verb “stop” make the action easier to follow while retaining its causative force.
- pob_phrase: will come one who makes desolate
  simplified_phrase: one who brings desolation will come
  preserved_meaning: A person who causes desolation will arrive.
  reasoning_layer_used: Lexical decision for מְשֹׁמֵם
  rationale: Ordinary English word order improves readability without identifying the disputed figure.
- pob_phrase: And on the wing of abominations
  simplified_phrase: On the wing of abominations
  preserved_meaning: The difficult Hebrew wing image and its association with abominations remain intact.
  reasoning_layer_used: Lexical and theological decisions for כְּנַף שִׁקּוּצִים
  rationale: The image is retained because replacing it with an architectural interpretation would erase the documented ambiguity.
