translation:
  language: en
  text: Lord, in keeping with all your righteous acts,[a] please let your anger and wrath turn away from Jerusalem, your city and holy mountain. Our sins and the iniquities of our fathers[b] have made Jerusalem and your people objects of scorn to everyone around us.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “your acts of justice” or “your righteousness.” The Hebrew plural points especially to the righteous things God has done.
    reason: lexical_alternative
  - marker: b
    text: “Our fathers” means our ancestors—the generations who came before us.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: according to all your righteous acts
  simplified_phrase: in keeping with all your righteous acts
  preserved_meaning: Daniel asks God to act in accordance with his many righteous deeds.
  reasoning_layer_used: Lexical decision for כְּכָל צִדְקֹתֶיךָ and its theological rationale.
  rationale: This states the standard of Daniel’s appeal in natural English.
- pob_phrase: because through our sins and the iniquities of our fathers
  simplified_phrase: Our sins and the iniquities of our fathers have made
  preserved_meaning: The present people’s sins and their fathers’ iniquities caused the resulting shame.
  reasoning_layer_used: Lexical decisions for the causal beth and corporate solidarity in guilt.
  rationale: The active sentence makes the cause and result clear while preserving intergenerational guilt.
- pob_phrase: have become a reproach to all those around us
  simplified_phrase: objects of scorn to everyone around us
  preserved_meaning: Jerusalem and God’s people have entered a state of public shame among surrounding peoples.
  reasoning_layer_used: Lexical decision for לְחֶרְפָּה and the doctrine-realignment revision.
  rationale: “Objects of scorn” plainly communicates the public-shame force of “reproach.”
