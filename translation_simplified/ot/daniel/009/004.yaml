translation:
  language: en
  text: I prayed to Yahweh my God and confessed. I said, “Please, Lord, you are the great and awe-inspiring God. You keep your covenant and show steadfast love to those who love you and obey your commandments.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: confessed and said
  simplified_phrase: confessed. I said
  preserved_meaning: Daniel confesses and then gives the words of his prayer.
  reasoning_layer_used: Lexical decision for וָאֶתְוַדֶּה and Hebrew narrative sequence
  rationale: Two short sentences clarify the sequence without adding an object to the confession.
- pob_phrase: the great and awesome God
  simplified_phrase: you are the great and awe-inspiring God
  preserved_meaning: God is great and inspires reverent fear.
  reasoning_layer_used: POB lexical footnote and decision for הַנּוֹרָא
  rationale: “Awe-inspiring” avoids the casual sense of “awesome” and the overly negative sense of “fearsome.”
- pob_phrase: who keeps the covenant and steadfast love for those who love him and keep his commandments
  simplified_phrase: You keep your covenant and show steadfast love to those who love you and obey your commandments
  preserved_meaning: God remains true to his covenant and shows loyal love to those who love him and follow his commands.
  reasoning_layer_used: Lexical and theological decisions for בְּרִית, חֶסֶד, and מִצְוֹת
  rationale: Direct address and ordinary verbs clarify the relationship while retaining the key biblical terms.
translation_notes:
  risk_flags:
  - risk: Changing third-person references to second person reduces the Hebrew shift in person.
    mitigation: The wording remains direct prayer and preserves every covenant claim.
  - risk: “Obey” states the practical force of keeping God's commandments.
    mitigation: “Commandments” remains explicit, so the distinct biblical concept is preserved.
