translation:
  language: en
  text: Then the king gave the order. They brought Daniel and threw him into the lions’ den. The king said to Daniel, “Your God, whom you serve continually, will rescue you.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “may he rescue you.” The Aramaic may express a wish, though the main text presents the king’s confidence that God will rescue Daniel.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: gave the command
  simplified_phrase: gave the order
  preserved_meaning: The king issued a royal directive that was immediately carried out.
  reasoning_layer_used: Lexical decision for אֲמַר in context
  rationale: “Gave the order” is common English for the same royal command.
- pob_phrase: The king answered and said to Daniel
  simplified_phrase: The king said to Daniel
  preserved_meaning: The narrative formula introduces the king’s words to Daniel.
  reasoning_layer_used: Lexical decision for עָנֵה ... וְאָמַר
  rationale: The two-verb Semitic formula functions as a simple speech introduction in English.
- pob_phrase: he will deliver you
  simplified_phrase: will rescue you
  preserved_meaning: The king expresses confidence that God will save Daniel from immediate danger.
  reasoning_layer_used: Lexical and theological decisions for יְשֵׁיזְבִנָּךְ
  rationale: “Rescue” clearly communicates deliverance from the lions while retaining the declarative force.
