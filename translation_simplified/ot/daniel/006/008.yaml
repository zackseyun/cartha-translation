translation:
  language: en
  text: 'All the kingdom’s high officials—the prefects, provincial rulers, advisers, and governors—have agreed together[a] to establish a royal decree and put this prohibition into force: For thirty days, anyone who makes a request to any god or person other than you, Your Majesty, must be thrown into the lions’ den.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “have consulted together”; the term can refer both to joint discussion and to reaching an agreement.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the prefects and satraps, the counselors and governors
  simplified_phrase: the prefects, provincial rulers, advisers, and governors
  preserved_meaning: The list still identifies the different groups of royal officials.
  reasoning_layer_used: POB lexical decisions for the four administrative titles
  rationale: “Provincial rulers” and “advisers” explain unfamiliar official titles in common English.
- pob_phrase: to establish a royal statute and to enforce an injunction
  simplified_phrase: to establish a royal decree and put this prohibition into force
  preserved_meaning: The officials want a royal rule enacted and its prohibition made legally binding.
  reasoning_layer_used: POB lexical decisions for the two legal phrases and grounding review
  rationale: “Put this prohibition into force” preserves enactment rather than suggesting later policing.
- pob_phrase: whoever makes a petition to any god or man
  simplified_phrase: anyone who makes a request to any god or person
  preserved_meaning: The rule forbids directing a formal request to any divine or human recipient.
  reasoning_layer_used: POB lexical decisions for the petition idiom and its addressee
  rationale: “Makes a request” and “person” are natural modern equivalents that retain the ban’s scope.
translation_notes:
  risk_flags:
  - risk: Replacing “satraps” with “provincial rulers” removes the historical Persian title.
    mitigation: The functional rank is preserved through a POB-approved lexical alternative.
  - risk: “Prohibition” is less technical than the legal term “injunction.”
    mitigation: “Put into force” clearly preserves its binding legal character.
