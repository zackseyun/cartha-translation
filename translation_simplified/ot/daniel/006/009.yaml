  rationale: “Your Majesty” is the natural modern form of respectful royal address.
- pob_phrase: establish the injunction
  simplified_phrase: put this ban into effect
  preserved_meaning: The king is urged to make the proposed legal prohibition binding.
  reasoning_layer_used: The lexical decisions describe a prohibitory edict being given legal force.
  rationale: This wording clearly expresses both the prohibition and the act of enforcing it.
- pob_phrase: sign the document
  simplified_phrase: sign the official document
  preserved_meaning: The king must formally authorize the written decree.
  reasoning_layer_used: The lexical rationale identifies an official written legal act.
  rationale: “Official” makes the document’s legal character clear without adding another action.
