- pob_phrase: came near and spoke before the king concerning the king’s injunction
  simplified_phrase: approached the king and asked about his binding order
  preserved_meaning: They formally approached the king about his prohibitory royal order.
  reasoning_layer_used: POB lexical decisions for קְרִיבוּ, קֳדָם, and אֱסָר
  rationale: “Binding order” clearly conveys the legal and restrictive force of “injunction.”
- pob_phrase: makes a petition to any god or man
  simplified_phrase: makes a request to any god or man
  preserved_meaning: The order forbids directing a request to any god or human being other than the king.
  reasoning_layer_used: POB lexical decisions for יִבְעֵה and מִן כָּל אֱלָהּ וֶאֱנָשׁ
  rationale: “Makes a request” avoids formal jargon without adding an unstated object.
- pob_phrase: The matter is certain, according to the law of the Medes and Persians, which cannot be changed
  simplified_phrase: The order stands. Under the law of the Medes and Persians, it cannot be changed.
  preserved_meaning: The king confirms that the order is legally valid and irrevocable.
  reasoning_layer_used: POB lexical decisions for יַצִּיבָא מִלְּתָא and דִּי לָא תֶעְדֵּא
  rationale: Two short sentences express the order’s firm legal status in natural English.
