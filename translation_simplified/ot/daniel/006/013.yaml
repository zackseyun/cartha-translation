translation:
  language: en
  text: 'Then they approached the king and asked about his binding order: “Did you not sign an order that for thirty days, any man[a] who makes a request to any god or man—except to you, Your Majesty—must be thrown into the lions’ den?”


    The king answered, “The order stands. Under the law of the Medes and Persians, it cannot be changed.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Any man” is generic wording in this legal statement; it may also be translated “any person.”
    reason: lexical_alternative
