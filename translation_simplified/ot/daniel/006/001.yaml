translation:
  language: en
  text: Darius the Mede received the kingdom[a] when he was about sixty-two years old.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “took the kingdom.” “Received” does not specify whether Darius conquered, inherited, or was appointed over the kingdom.
