translation:
  language: en
  text: 'I issue this decree: Throughout my entire kingdom, people must tremble and fear[a] before Daniel’s God. He is the living God, and he endures forever. His kingdom will never be destroyed, and his rule will never end.'
  philosophy: optimal-equivalence
  footnotes:
