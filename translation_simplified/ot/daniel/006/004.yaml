translation:
  language: en
  text: Then Daniel himself stood out above the other high officials and provincial governors[a] because an extraordinary spirit was in him.[b] The king planned to put him in charge of the whole kingdom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The original term is “satraps,” officials who governed provinces in the Persian Empire.
    reason: cultural_note
  - marker: b
    text: Or “an excellent spirit was in him.” This may refer broadly to Daniel’s exceptional inner quality, wisdom, or character.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: this Daniel distinguished himself above
  simplified_phrase: Daniel himself stood out above
  preserved_meaning: Daniel was notably superior to the other officials, with the original emphasis on him retained.
  reasoning_layer_used: Lexical decisions for דָּנִיֵּאל דְּנָה and הֲוָא מִתְנַצַּח
  rationale: “Stood out” expresses Daniel’s evident excellence in more immediate English.
- pob_phrase: the satraps
  simplified_phrase: provincial governors
  preserved_meaning: The officials held authority over provinces in the imperial administration.
  reasoning_layer_used: Lexical alternative for אֲחַשְׁדַּרְפְּנַיָּא
  rationale: The familiar job description is clearer, while the historical title remains in a note.
- pob_phrase: to set him over the whole kingdom
  simplified_phrase: to put him in charge of the whole kingdom
  preserved_meaning: The king intended to give Daniel authority over the entire realm.
  reasoning_layer_used: Lexical decisions for לַהֲקָמוּתֵהּ and עַל כָּל מַלְכוּתָא
  rationale: “Put him in charge” makes the intended authority clear without implying that the appointment had happened.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “spirit” as explicitly referring to the Holy Spirit.
    mitigation: The wording and note preserve the POB’s broader ambiguity about Daniel’s exceptional inner quality.
  - risk: Replacing “satraps” could obscure the specific Persian office.
    mitigation: The cultural note retains the historical term and briefly explains it.
