translation:
  language: en
  text: Then King Darius wrote to all the peoples, nations, and language groups living throughout the earth:[a] “May your peace increase greatly.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “throughout the earth” refers to the full extent of Darius’s empire.
    reason: cultural_note
  - marker: b
    text: Or “May your peace be multiplied.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: peoples, nations, and languages
  simplified_phrase: peoples, nations, and language groups
  preserved_meaning: The greeting addresses every ethnic, national, and linguistic group under Darius.
  reasoning_layer_used: POB lexical decision and contextual rationale
  rationale: “Language groups” makes clear that the king is addressing people, not abstract languages.
- pob_phrase: that dwell in all the earth
  simplified_phrase: living throughout the earth
  preserved_meaning: The royal message extends across the realm described by the proclamation.
  reasoning_layer_used: POB lexical decision and cultural note
  rationale: “Living” is more familiar than “dwell,” while the footnote explains the imperial scope.
- pob_phrase: May your peace abound
  simplified_phrase: May your peace increase greatly
  preserved_meaning: Darius wishes his recipients growing peace and well-being.
  reasoning_layer_used: POB lexical decisions for שְׁלָמְכוֹן and יִשְׂגֵּא
  rationale: The direct wording clearly expresses the greeting’s idea of increasing peace.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “throughout the earth” as a claim about the entire globe.
    mitigation: The footnote identifies it as royal language for the extent of Darius’s empire.
