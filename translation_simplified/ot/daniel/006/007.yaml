translation:
  language: en
  text: Then these senior officials and provincial governors[a] went together to the king and said, “King Darius, may you live forever!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: These Persian provincial governors were called satraps.
    reason: cultural_note
  - marker: b
    text: This was a customary royal greeting, not a claim that the king would never die.
    reason: cultural_note
