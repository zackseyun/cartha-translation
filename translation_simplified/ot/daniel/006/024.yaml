translation:
  language: en
  text: Then the king was overjoyed to find Daniel alive.[a] He ordered that Daniel be lifted out of the pit. When Daniel had been lifted out, they found that he had not been harmed at all, because he had trusted in his God.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Aramaic says the king was very glad “because of him,” referring to Daniel’s preservation.
    reason: source_note
  - marker: b
    text: The verb can also be translated “believed his God”; “trusted” emphasizes Daniel’s personal reliance on God.
    reason: lexical_alternative
