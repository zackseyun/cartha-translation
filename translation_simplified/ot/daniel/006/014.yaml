translation:
  language: en
  text: 'Then they answered in the king’s presence: “Daniel, one of the exiles from Judah, pays no attention to you, O king, or to the prohibition you signed. He prays three times a day.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Aramaic does not name the recipient of Daniel’s prayer here, though the context identifies his God.
    reason: source_note
