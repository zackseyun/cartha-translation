translation:
  language: en
  text: Near the end of their kingdom, when those who rebel have reached the full extent of their rebellion, a king will arise. He will be fierce and hard-faced, and skilled in intrigue.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “will understand riddles” or “dark sayings.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: at the latter end of their kingdom
  simplified_phrase: near the end of their kingdom
  preserved_meaning: The verse points to the final period of the same collective kingdom.
  reasoning_layer_used: Lexical decisions for וּבְאַחֲרִית and מַלְכוּתָם
  rationale: This replaces elevated wording while retaining the temporal and singular collective senses.
- pob_phrase: when the transgressors have reached their full measure
  simplified_phrase: when those who rebel have reached the full extent of their rebellion
  preserved_meaning: Their moral rebellion reaches its completed extent rather than the rebels ceasing to exist.
  reasoning_layer_used: Lexical decisions for כְּהָתֵם and הַפֹּשְׁעִים
  rationale: This makes explicit what reaches completion while preserving the force of rebellion.
- pob_phrase: fierce in countenance and skilled in intrigue
  simplified_phrase: fierce and hard-faced, and skilled in intrigue
  preserved_meaning: The king has a severe, audacious demeanor and practical cunning.
  reasoning_layer_used: Lexical and theological decisions for עַז פָּנִים and וּמֵבִין חִידוֹת
  rationale: This preserves the facial image without implying inward hardening and keeps the controlling political sense.
interpretive_expansions:
- pob_phrase: the transgressors have reached their full measure
  rendering: those who rebel have reached the full extent of their rebellion
  claim: What reaches completion is their rebellion, not their existence.
  evidence:
  - The lexical rationale explicitly says their rebellion reaches its full extent.
  - The immediate clause concerns the completion of their wrongdoing.
  confidence: high
  alternatives_preserved:
  - when the transgressors have reached their full measure
translation_notes:
  risk_flags:
  - risk: “Skilled in intrigue” interprets a phrase that can refer to understanding riddles or dark sayings.
    mitigation: The main text follows the POB decision, while the footnote preserves the lexical alternatives.
  - risk: “Hard-faced” could be mistaken for a purely physical description.
    mitigation: Pairing it with “fierce” conveys the intended severe and audacious demeanor.
