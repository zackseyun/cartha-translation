translation:
  language: en
  text: I, Daniel, was overwhelmed and remained sick for days. Afterward, I got up and returned to the king’s work. But the vision left me appalled, and no one understood it.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “but I did not understand it.” The brief Hebrew wording can refer either to no one or to Daniel himself.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: was overcome and was sick for days
  simplified_phrase: was overwhelmed and remained sick for days
  preserved_meaning: The vision left Daniel depleted or overcome, followed by an illness of unspecified duration.
  reasoning_layer_used: Lexical decisions for נִהְיֵיתִי, נֶחֱלֵיתִי, and יָמִים
  rationale: “Overwhelmed” is clearer than “overcome,” while “remained” naturally connects the sickness with its duration.
- pob_phrase: Then I rose and did the king’s work
  simplified_phrase: Afterward, I got up and returned to the king’s work
  preserved_meaning: Daniel recovered enough to resume his royal duties.
  reasoning_layer_used: Lexical decisions for וָאָקוּם and וָאֶעֱשֶׂה אֶת מְלֶאכֶת הַמֶּלֶךְ
  rationale: The new wording makes the sequence and resumption of work immediately clear.
- pob_phrase: I was appalled by the vision
  simplified_phrase: the vision left me appalled
  preserved_meaning: The revelation had a powerful, troubling effect on Daniel.
  reasoning_layer_used: Lexical decisions for וָאֶשְׁתּוֹמֵם and הַמַּרְאֶה
  rationale: The active construction clearly links Daniel’s distress to the vision without weakening “appalled.”
interpretive_expansions:
- pob_phrase: Then I rose and did the king’s work
  rendering: Afterward, I got up and returned to the king’s work
  claim: Daniel resumed his royal work after his illness.
  evidence:
  - The narrative sequence places getting up and doing the king’s work after days of sickness.
  - The POB rationale identifies recovery and resumption as the action conveyed.
  confidence: high
  alternatives_preserved:
  - Afterward, I got up and did the king’s work.
translation_notes:
  risk_flags:
  - risk: “Returned to” makes the resumption of royal work more explicit than the Hebrew verb itself.
    mitigation: The preceding illness and POB rationale strongly support this bounded clarification.
  - risk: The final Hebrew clause may refer specifically to Daniel rather than to no one generally.
    mitigation: The main text follows POB’s impersonal reading, and the personal reading remains in the footnote.
