translation:
  language: en
  text: Through his shrewdness, he will make deceit succeed under his control. He will think himself great. He will destroy many while they feel safe, and he will rise up against the Prince of princes. Yet he will be broken without any human hand.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, his defeat will not come through ordinary human power.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: make deceit prosper in his hand
  simplified_phrase: make deceit succeed under his control
  preserved_meaning: He deliberately causes deception to succeed through his own power and agency.
  reasoning_layer_used: Lexical decisions for וְהִצְלִיחַ, מִרְמָה, and בְּיָדוֹ
  rationale: This replaces an opaque hand idiom while preserving its sense of agency and control.
- pob_phrase: in his heart he will magnify himself
  simplified_phrase: He will think himself great
  preserved_meaning: He will inwardly exalt himself rather than merely gain public status.
  reasoning_layer_used: Lexical decision for וּבִלְבָבוֹ יַגְדִּיל
  rationale: The simpler wording keeps the focus on his proud view of himself.
- pob_phrase: he will be broken without hand
  simplified_phrase: he will be broken without any human hand
  preserved_meaning: He will be overthrown, but not through ordinary human power.
  reasoning_layer_used: Lexical and theological decisions for וּבְאֶפֶס יָד and יִשָּׁבֵר
  rationale: The wording retains the breaking image while making the elliptical idiom understandable.
interpretive_expansions:
- pob_phrase: in a time of security
  rendering: while they feel safe
  claim: The many are destroyed when they are secure and unsuspecting.
  evidence:
  - The lexical rationale says the phrase likely describes the unsuspecting condition of those destroyed.
  - The clause directly connects their security with his destruction of many.
  confidence: high
  alternatives_preserved:
  - during a time of security
  - while they are at ease
- pob_phrase: without hand
  rendering: without any human hand
  claim: His overthrow will not be accomplished by ordinary human agency.
  evidence:
  - The Hebrew idiom strongly implies nonhuman agency according to the POB theological decision.
  - The POB footnote explicitly gives “without human hand” as the intended sense.
  confidence: high
  alternatives_preserved:
  - without hand
