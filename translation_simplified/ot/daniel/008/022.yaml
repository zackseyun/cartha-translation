translation:
  language: en
  text: The broken horn was replaced by four others. Four kingdoms will arise from that nation, but they will not have the power of the broken horn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the power of the first king,” whom the broken horn represents.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: as for the broken horn, in whose place four arose
  simplified_phrase: The broken horn was replaced by four others
  preserved_meaning: Four successor horns arose after the first horn was broken.
  reasoning_layer_used: lexical decision and immediate vision context
  rationale: The rewrite turns the dense relative clause into a direct sentence while retaining the horn image.
- pob_phrase: four kingdoms will arise from that nation
  simplified_phrase: Four kingdoms will arise from that nation
  preserved_meaning: Four political realms will emerge from the previously mentioned nation.
  reasoning_layer_used: lexical decision
  rationale: The clear POB wording is retained because it already expresses the political meaning naturally.
- pob_phrase: but not with its power
  simplified_phrase: but they will not have the power of the broken horn
  preserved_meaning: The successor kingdoms will lack the power of the original horn or kingdom.
  reasoning_layer_used: theological decision
  rationale: Naming the broken horn clarifies the pronoun without choosing the personal alternative.
translation_notes:
  risk_flags:
