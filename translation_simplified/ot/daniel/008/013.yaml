translation:
  language: en
  text: Then I heard one holy one speaking. Another holy one asked the speaker[a], “How long will the events shown in this vision last—the regular burnt offering, the transgression that causes desolation, and the handing over of both the sanctuary and the host[b] to be trampled?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The obscure Hebrew may instead mean “Palmoni, the speaker,” treating Palmoni as a name or title.
    reason: alternative_reading
  - marker: b
    text: “Host” may mean the people connected with the sanctuary, an army, or another collective force.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: one holy one said to the one speaking
  simplified_phrase: Another holy one asked the speaker
  preserved_meaning: One holy being directs a question to the holy being who was speaking.
  reasoning_layer_used: Lexical decisions for קָדוֹשׁ, לַפַּלְמוֹנִי, and הַמְדַבֵּר
  rationale: This removes awkward repetition while the footnote preserves the uncertain addressee wording.
- pob_phrase: How long is the vision concerning
  simplified_phrase: How long will the events shown in this vision last
  preserved_meaning: The question asks about the duration of what the vision depicts without saying that each listed item continues.
  reasoning_layer_used: POB rendering of הֶחָזוֹן and immediate context
  rationale: This states the duration question naturally while avoiding an added claim about the regular offering.
- pob_phrase: the desolating transgression, and the giving over of both the sanctuary and the host to be trampled
  simplified_phrase: the transgression that causes desolation, and the handing over of both the sanctuary and the host to be trampled
  preserved_meaning: The transgression brings desolation, and the sanctuary and host are surrendered to desecration.
  reasoning_layer_used: Lexical decisions for הַפֶּשַׁע שֹׁמֵם, תֵּת, קֹדֶשׁ, צָבָא, and מִרְמָס
  rationale: Clearer relational wording preserves both the desolating effect and the trampling image.
interpretive_expansions:
- pob_phrase: How long is the vision concerning
  rendering: How long will the events shown in this vision last
  claim: The question concerns the duration of the events depicted by the vision as a whole.
  evidence:
  - The listed offering, transgression, and trampling identify the vision’s subject matter.
  - POB uses “concerning” to connect the duration question with this content.
  confidence: high
  alternatives_preserved:
