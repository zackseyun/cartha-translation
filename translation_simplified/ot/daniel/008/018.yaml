translation:
  language: en
  text: As he was speaking with me, I fell into a deep sleep[a] and lay facedown on the ground. But he touched me and made me stand again in my place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may describe deep sleep or a sleep-like stupor, but it does not require the technical idea of a trance.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And while he was speaking with me
  simplified_phrase: As he was speaking with me
  preserved_meaning: His speech was still in progress when Daniel was overcome by sleep.
  reasoning_layer_used: Lexical decision for וּבְדַבְּרוֹ
  rationale: “As” expresses the same temporal relationship more directly.
- pob_phrase: with my face to the ground
  simplified_phrase: lay facedown on the ground
  preserved_meaning: Daniel collapsed or was prostrate with his face toward the ground.
  reasoning_layer_used: Lexical decision for עַל־פָּנַי אָרְצָה
  rationale: The rewrite turns the compressed posture into a clear physical description.
- pob_phrase: made me stand up where I had been standing
  simplified_phrase: made me stand again in my place
  preserved_meaning: The touch restored Daniel to a standing position at his place.
  reasoning_layer_used: Lexical decision and doctrine realignment for וַיַּעֲמִידֵנִי עַל־עָמְדִי
  rationale: This keeps both the causative action and the source idiom’s sense of restored position.
translation_notes:
  risk_flags:
  - risk: “Deep sleep” may sound like ordinary sleep rather than an overpowering stupor.
    mitigation: The footnote preserves the lexical range without imposing the technical term “trance.”
  - risk: “In my place” could be read as a formal station or office.
    mitigation: “Stand again” and the physical context indicate restoration to Daniel’s previous position.
