simplification_decisions:
- pob_phrase: And out of one of them came a small horn
  simplified_phrase: A small horn came out of one of them.
  preserved_meaning: The horn emerges from one member of the preceding group.
  reasoning_layer_used: Lexical decisions for וּמִן הָאַחַת מֵהֶם and יָצָא
  rationale: Ordinary subject-verb order makes the emergence easier to follow.
- pob_phrase: and it grew exceedingly great
  simplified_phrase: It grew very great
  preserved_meaning: The horn grows to an exceptional degree without implying a temporal endpoint.
  reasoning_layer_used: Lexical decision for וַתִּגְדַּל יֶתֶר and grounding review
  rationale: “Very” expresses the intensification in common English without adding a limit to the growth.
- pob_phrase: toward the south, toward the east, and toward the Beautiful Land
  simplified_phrase: reaching toward the south, the east, and the Beautiful Land
  preserved_meaning: The horn’s growth extends toward all three named destinations.
  reasoning_layer_used: Directional lexical decisions and theological decision for הַצְּבִי
  rationale: “Reaching” clearly connects the growth with the destinations while leaving the horn symbolic.
