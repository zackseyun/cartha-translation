translation:
  language: en
  text: The male goat became extremely powerful. But at the height of his power, his great horn was broken. Four prominent horns came up in its place, toward the four winds of heaven.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The phrase “four winds of heaven” refers to the four directions of the world.
    reason: cultural_note
simplification_decisions:
- pob_phrase: grew exceedingly great
  simplified_phrase: became extremely powerful
  preserved_meaning: The goat grew very great in power and prominence.
  reasoning_layer_used: Lexical decision for הִגְדִּיל עַד מְאֹד
  rationale: The clearer wording preserves the increase in power and its strong intensity.
- pob_phrase: when he was strong
  simplified_phrase: at the height of his power
  preserved_meaning: The horn broke when the goat had reached great strength.
  reasoning_layer_used: Lexical decision for וּכְעָצְמוֹ
  rationale: This natural phrase clearly expresses the contextual sense of strength.
- pob_phrase: four conspicuous horns came up
  simplified_phrase: Four prominent horns came up
  preserved_meaning: Four clearly visible and significant horns emerged after the great horn broke.
  reasoning_layer_used: Lexical decisions for חָזוּת אַרְבַּע and וַתַּעֲלֶנָה
  rationale: “Prominent” is more familiar than “conspicuous” while retaining visibility and importance.
