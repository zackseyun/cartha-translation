translation:
  language: en
  text: A host was handed over along with the regular burnt offering at the temple because of transgression.[a][b] It threw truth to the ground, then acted and succeeded.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A “host” may mean an army or a body of people.
    reason: lexical_alternative
  - marker: b
    text: The difficult Hebrew construction may instead mean “against the regular burnt offering.”
    reason: alternative_reading
  - marker: c
    text: The vision does not clearly identify what “it” refers to; it may be the hostile power described earlier.
    reason: alternative_reading
