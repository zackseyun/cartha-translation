translation:
  language: en
  text: I heard a man’s voice[a] coming from between the banks of the Ulai. He called out, “Gabriel, make this man understand the vision.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “a human voice.”
