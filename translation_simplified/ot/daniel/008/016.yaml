simplification_decisions:
- pob_phrase: the voice of a man between the banks of the Ulai
  simplified_phrase: a man’s voice coming from between the banks of the Ulai
  preserved_meaning: Daniel hears a male voice from the space between the waterway’s banks.
  reasoning_layer_used: Lexical decisions for קוֹל אָדָם and בֵּין אוּלָי
  rationale: The possessive form and “coming from” make the location natural without losing the concrete male voice or riverbank image.
- pob_phrase: and he called out and said
  simplified_phrase: He called out
  preserved_meaning: The speaker raises his voice to deliver the command that follows.
  reasoning_layer_used: Lexical decision for וַיִּקְרָא וַיֹּאמַר
  rationale: The quotation supplies the act of speaking, while “called out” preserves the force of both introductory verbs.
- pob_phrase: make this one understand the vision
  simplified_phrase: make this man understand the vision
  preserved_meaning: Gabriel is commanded to cause Daniel, the male person in view, to understand the vision.
  reasoning_layer_used: Lexical and theological decisions for הָבֵן and לְהַלָּז
  rationale: “This man” identifies Daniel naturally while “make” retains the Hebrew verb’s causative force.
translation_notes:
  risk_flags:
  - risk: “Coming from” states the spatial relation more directly than the Hebrew preposition alone.
    mitigation: The POB rationale already understands the voice as located in the space between the Ulai’s banks.
