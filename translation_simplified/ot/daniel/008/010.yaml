translation:
  language: en
  text: It grew upward as high as the host of heaven.[a] It threw some of that host and some of the stars down to earth and trampled them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the army of heaven.” This may symbolize heavenly beings, God’s people, or celestial powers; the Hebrew does not identify them here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: It grew as high as the host of heaven
  simplified_phrase: It grew upward as high as the host of heaven
  preserved_meaning: Its growth extended upward to the level of the heavenly host without necessarily implying contact.
  reasoning_layer_used: Lexical decision for עַד and the theological decision to preserve the image’s ambiguity.
  rationale: “Upward” makes the vertical movement clear while “as high as” avoids implying contact.
- pob_phrase: it cast some of the host and some of the stars down to the earth
  simplified_phrase: It threw some of that host and some of the stars down to earth
  preserved_meaning: It forcefully caused only part of the host and stars to fall to earth.
  reasoning_layer_used: Lexical decisions for וַתַּפֵּל, אַרְצָה, and the partitive מִן.
  rationale: “Threw down” uses common wording while repeated “some” preserves the partial scope.
- pob_phrase: and trampled them
  simplified_phrase: and trampled them
  preserved_meaning: It trampled those it had thrown down.
  reasoning_layer_used: Lexical decision for וַתִּרְמְסֵם and its plural suffix.
  rationale: The direct wording already makes the violent image and its objects clear.
translation_notes:
  risk_flags:
  - risk: “Host of heaven” may be unfamiliar or understood as one clearly identified group.
    mitigation: The footnote gives the army sense and keeps the possible symbolic referents open.
