translation:
  language: en
  text: He approached me. As he came near, I was terrified and fell facedown. He said to me, “Understand, son of man,[a] that the vision is for the time of the end.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Or “human one” or “mortal.” Hebrew: “son of man.”'
    reason: lexical_alternative
  - marker: b
