    reason: alternative_reading
simplification_decisions:
- pob_phrase: So he came near where I was standing
  simplified_phrase: He approached me
  preserved_meaning: He moved close to Daniel’s standing place.
  reasoning_layer_used: The lexical decision identifies the phrase as referring naturally to Daniel’s location.
  rationale: “Approached me” expresses the same movement in direct, common English.
- pob_phrase: and when he came, I was terrified and fell on my face
  simplified_phrase: As he came near, I was terrified and fell facedown
  preserved_meaning: Daniel was overcome with fear and fell prostrate as the figure approached.
  reasoning_layer_used: The lexical decisions preserve both the intensity of fear and the Hebrew prostration image.
  rationale: “Fell facedown” makes the physical action immediately clear without weakening it.
- pob_phrase: Then he said to me
  simplified_phrase: He said to me
  preserved_meaning: The figure speaks after approaching Daniel.
  reasoning_layer_used: The source clause sequence supplies the narrative order.
  rationale: A new sentence makes the sequence clear without needing the transition word.
translation_notes:
  risk_flags:
  - risk: “Son of man” may be mistaken here for a direct title rather than an address emphasizing Daniel’s humanity.
    mitigation: The footnote preserves the alternatives “human one” and “mortal” without resolving the literary nuance.
  - risk: “The time of the end” could be read as specifying a complete end-times system.
    mitigation: The wording remains general, and the footnote preserves the possible sense “appointed end.”
