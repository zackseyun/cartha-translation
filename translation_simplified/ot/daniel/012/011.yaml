translation:
  language: en
  text: There will be 1,290 days from the time the regular temple offering[a] is stopped and the abomination that causes desolation[b] is set up.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally, “the daily sacrifice.” The Hebrew refers to the regular offering made at the temple.
    reason: lexical_alternative
  - marker: b
    text: This may also be translated “the abomination of desolation” or “the desolating abomination.”
    reason: alternative_reading
