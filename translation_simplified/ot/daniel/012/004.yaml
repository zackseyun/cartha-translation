translation:
  language: en
  text: But you, Daniel, keep these words closed and seal the book[a] until the time of the end. Many people will go here and there[b], and knowledge will increase.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the scroll.”
    reason: lexical_alternative
  - marker: b
    text: Or “will run back and forth.” The Hebrew may also mean, “Many will search through something, and knowledge will increase.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: shut up the words
  simplified_phrase: keep these words closed
  preserved_meaning: Daniel must keep the revealed words closed and inaccessible without implying total secrecy.
  reasoning_layer_used: Lexical decisions for סְתֹם and הַדְּבָרִים
  rationale: This wording explains the command naturally while preserving the image of closing.
- pob_phrase: Many will roam about
  simplified_phrase: Many people will go here and there
  preserved_meaning: Many will move about, while the possible sense of searching remains open.
  reasoning_layer_used: Lexical and theological decisions for יְשֹׁטְטוּ רַבִּים
  rationale: The common phrase conveys broad movement without resolving the Hebrew ambiguity.
translation_notes:
  risk_flags:
  - risk: Readers may understand “go here and there” only as physical travel.
    mitigation: Footnote b preserves the possible sense of searching without adding a causal claim.
