translation:
  language: en
  text: At that time, Michael will arise—the great prince who stands over[a] your people. There will be a time of distress unlike any since there has been a nation. At that time, your people will escape[b]—everyone found recorded in the book.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “stands for.”
    reason: lexical_alternative
  - marker: b
    text: Or “will be delivered.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Michael, the great prince who stands over the sons of your people, will arise
  simplified_phrase: Michael will arise—the great prince who stands over your people
  preserved_meaning: Michael is the great heavenly prince who takes decisive action on behalf of Daniel’s people.
  reasoning_layer_used: Lexical and theological decisions on Michael’s action, role, and the collective sense of “sons”
  rationale: The reordered clause is easier to follow, and “your people” clearly expresses the collective reference.
- pob_phrase: such as has not happened since there was a nation until that time
  simplified_phrase: unlike any since there has been a nation
  preserved_meaning: The coming distress will be without precedent throughout national history.
  reasoning_layer_used: Lexical decision on the historical comparison
  rationale: The shorter comparison keeps the source’s singular “nation” while using natural English.
- pob_phrase: everyone who is found written in the book
  simplified_phrase: everyone found recorded in the book
  preserved_meaning: Those listed in the book are the ones who escape.
  reasoning_layer_used: Lexical decisions on “written” and “book”
  rationale: “Recorded” makes the sense of being listed clear to modern readers.
interpretive_expansions:
- pob_phrase: the sons of your people
  rendering: your people
  claim: The Hebrew expression refers collectively to the members or descendants of Daniel’s people, not only to male children.
  evidence:
  - The POB lexical rationale recognizes the collective sense of the Hebrew expression.
  - The verse immediately calls the same group “your people.”
  - Daniel 10:21 likewise relates Michael to Daniel’s people collectively.
  confidence: high
  alternatives_preserved:
  - the sons of your people
  - the children of your people
translation_notes:
  risk_flags:
  - risk: “Stands over” may suggest mere rank rather than protective oversight.
    mitigation: The footnote preserves the representative alternative “stands for.”
  - risk: “Escape” may sound like unaided flight rather than deliverance.
    mitigation: The footnote preserves “will be delivered” without narrowing the verse to a specific doctrine of salvation.
