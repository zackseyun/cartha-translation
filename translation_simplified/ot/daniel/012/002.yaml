translation:
  language: en
  text: Many[a] who sleep in the dust of the earth will wake up—one group to everlasting life, and the other to shame and everlasting contempt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “many,” not explicitly “all”; it may also be translated “multitudes.”
    reason: alternative_reading
  - marker: b
    text: Or “reproaches” for “shame,” and “everlasting abhorrence” for “everlasting contempt”; compare Isaiah 66:24.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: many of those sleeping in the dust of the earth will awake
  simplified_phrase: many who sleep in the dust of the earth will wake up
  preserved_meaning: The wording keeps death as sleep, burial in dust, and resurrection as waking.
  reasoning_layer_used: POB lexical decisions for מִיְּשֵׁנֵי, אַדְמַת עָפָר, and יָקִיצוּ
  rationale: Common verbs clarify the clause while preserving its sleep-and-waking image.
- pob_phrase: these ... and those
  simplified_phrase: one group ... and the other
  preserved_meaning: Those who awake remain divided according to two different destinies.
  reasoning_layer_used: POB lexical decision for אֵלֶּה and theological decision on resurrection scope
  rationale: Naming the contrasted groups is natural English and does not change “many” to “all.”
- pob_phrase: to reproaches, to everlasting contempt
  simplified_phrase: to shame and everlasting contempt
  preserved_meaning: The two distinct negative outcomes remain shame and enduring contempt.
  reasoning_layer_used: POB lexical alternative for חֲרָפוֹת and theological decision on the negative destiny
  rationale: “Shame” is clearer modern English, while the footnote preserves “reproaches.”
translation_notes:
  risk_flags:
  - risk: Readers may assume “many” necessarily excludes a general resurrection.
    mitigation: The footnote preserves the documented ambiguity without changing the Hebrew to “all.”
  - risk: “Shame” may obscure the social force conveyed by “reproaches.”
    mitigation: The footnote retains “reproaches” as a lexical alternative.
