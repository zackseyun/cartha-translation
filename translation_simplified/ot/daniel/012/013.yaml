translation:
  language: en
  text: But you, go on your way to the end.[a] You will rest,[b] and at the end of the days[c] you will stand in the place assigned to you.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “continue until the end.”
    reason: lexical_alternative
  - marker: b
    text: “Rest” likely points to Daniel’s death before the final fulfillment.
    reason: lexical_alternative
  - marker: c
    text: “The end of the days” refers to the final time described in this vision; compare Daniel 12:2.
    reason: cross_reference
  - marker: d
    text: Or “stand to receive your allotted portion,” meaning the share or inheritance assigned to you.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: But as for you
  simplified_phrase: But you
  preserved_meaning: The words turn from the preceding revelation back to Daniel personally.
  reasoning_layer_used: lexical decision for וְאַתָּה
  rationale: The shorter wording keeps the contrast while sounding more direct.
- pob_phrase: go to the end
  simplified_phrase: go on your way to the end
  preserved_meaning: Daniel is commanded to proceed toward the appointed end.
  reasoning_layer_used: lexical decision for לֵךְ לַקֵּץ
  rationale: “Go on your way” makes the command natural without changing its endpoint.
- pob_phrase: stand in your allotted place
  simplified_phrase: stand in the place assigned to you
  preserved_meaning: Daniel will stand in the place or share appointed for him.
  reasoning_layer_used: lexical and theological decisions for וְתַעֲמֹד לְגֹרָלְךָ
  rationale: “Assigned” explains allotment while “stand” preserves the source image and its restrained resurrection implication.
translation_notes:
  risk_flags:
