translation:
  language: en
  text: Then I heard the man dressed in linen, who was above the river’s waters. He raised both hands—his right and his left—toward heaven and swore by the One who lives forever that this would last for a time, times, and half a time.[a] When the holy people’s power has been completely shattered,[b] all these things will be completed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “for an appointed time, appointed times, and half.” Many understand this as a year, two years, and half a year.
    reason: alternative_reading
  - marker: b
    text: Hebrew says “the hand of the holy people”; here “hand” likely means power or strength.
    reason: lexical_alternative
