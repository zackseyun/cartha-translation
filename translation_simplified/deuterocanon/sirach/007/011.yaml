translation:
  language: en
  text: Do not look down on a man whose spirit is bitter. Remember that there is one who brings people low and raises them up.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “raises up and brings low”; the Greek parallel says “brings low and raises up.” The main text follows the Greek-supported order because it fits the warning not to look down on someone in distress.
    reason: textual_variant
simplification_decisions:
- pob_phrase: Do not despise
  simplified_phrase: Do not look down on
  preserved_meaning: The command forbids treating someone with contempt.
  reasoning_layer_used: Hebrew lexical decision for אַל תִּבֶז
  rationale: This common idiom preserves the broad sense of contempt without limiting it to mockery.
- pob_phrase: in bitterness of spirit
  simplified_phrase: whose spirit is bitter
  preserved_meaning: The man is experiencing deep inner bitterness or distress.
  reasoning_layer_used: Hebrew lexical decision for בְּמַר רוּחַ
  rationale: Ordinary sentence structure retains the source image of a bitter spirit.
- pob_phrase: one who humbles and exalts
  simplified_phrase: one who brings people low and raises them up
  preserved_meaning: An unnamed singular actor reverses human status from lowliness to exaltation.
  reasoning_layer_used: Greek-supported sequence and theological decision on the implicit subject
  rationale: Concrete verbs clarify the reversal while leaving the actor unnamed and preserving the preferred order.
translation_notes:
  risk_flags:
