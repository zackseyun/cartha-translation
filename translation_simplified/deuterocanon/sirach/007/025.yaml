translation:
  language: en
  text: Arrange a daughter’s marriage,[a] and you will have taken care of that responsibility. Give her in marriage to a sensible man.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says that “the matter” will come to an end; the Greek says that a great task will be completed.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Marry off a daughter
  simplified_phrase: Arrange a daughter’s marriage
  preserved_meaning: A parent is instructed to take action to secure a daughter’s marriage.
  reasoning_layer_used: Hebrew idiom confirmed by the Greek parallel
  rationale: “Arrange a daughter’s marriage” states the ancient parental action without the potentially dismissive tone of “marry off.”
- pob_phrase: the matter will be settled
  simplified_phrase: you will have taken care of that responsibility
  preserved_meaning: The parental concern or task connected with arranging the marriage is completed.
  reasoning_layer_used: Lexical decision for וְיֵצֵא עֵסֶק and Greek consistency check
  rationale: The new wording makes the vague “matter” understandable while retaining the sense of completion.
- pob_phrase: an intelligent man
  simplified_phrase: a sensible man
  preserved_meaning: The prospective husband should possess discernment and sound judgment.
  reasoning_layer_used: Lexical decision for נָבוֹן
  rationale: “Sensible” expresses practical discernment more naturally here than “intelligent.”
