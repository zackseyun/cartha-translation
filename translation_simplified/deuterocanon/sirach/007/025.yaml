    mitigation: The footnote preserves the Hebrew ambiguity and the Greek completion reading.
  - risk: The verse reflects an ancient setting in which a parent arranges a daughter’s marriage.
    mitigation: The translation preserves that setting without adding approval, criticism, or modern harmonization.
