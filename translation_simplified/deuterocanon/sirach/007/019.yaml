translation:
  language: en
  text: Do not look down on a wife who has good sense.[a] Her graciousness is more precious than pearls.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a prudent wife” or “a wise wife”; the Hebrew emphasizes insight and good sense.
    reason: lexical_alternative
  - marker: b
    text: The Greek reads, “Do not miss a wise and good woman, for her grace is beyond gold.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Do not despise
  simplified_phrase: Do not look down on
  preserved_meaning: The warning still forbids treating her with contempt.
  reasoning_layer_used: POB lexical decision for אַל תִּמְאַס
  rationale: This common expression makes relational contempt immediately clear.
- pob_phrase: an intelligent wife
  simplified_phrase: a wife who has good sense
  preserved_meaning: The wife is praised for insight, prudence, and intelligence.
  reasoning_layer_used: POB lexical and theological decisions for אִשָּׁה מַשְׁכֶּלֶת
  rationale: “Good sense” expresses the Hebrew quality in natural everyday English.
- pob_phrase: her graciousness is better than pearls
  simplified_phrase: Her graciousness is more precious than pearls
  preserved_meaning: Her gracious quality surpasses costly treasure in value.
  reasoning_layer_used: POB lexical decisions for וְטוֹבַת חֵן and מִפְּנִינִים
  rationale: “More precious” clarifies the value comparison while preserving the pearl image.
translation_notes:
  risk_flags:
  - risk: “Good sense” may sound less explicitly cognitive than “intelligent.”
    mitigation: Footnote a preserves “prudent” and “wise” as lexical alternatives.
  - risk: The Hebrew noun can mean either “wife” or “woman.”
    mitigation: The main text follows POB’s context-based choice of “wife” without treating it as unambiguous.
