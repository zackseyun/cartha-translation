translation:
  language: en
  text: Do not hesitate to be with those who weep; share the grief of those who mourn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek witness reads instead: “Do not hesitate to visit the sick, for by doing such things you will be loved.” This differs substantially from the surviving Hebrew.'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Do not delay with those who weep
  simplified_phrase: Do not hesitate to be with those who weep
  preserved_meaning: The command urges prompt companionship with people who are weeping.
  reasoning_layer_used: The Hebrew lexical decisions preserve both urgency and solidarity rather than separation.
  rationale: “Do not hesitate to be with” clearly conveys both prompt action and companionship.
- pob_phrase: mourn with those who mourn
  simplified_phrase: share the grief of those who mourn
  preserved_meaning: The reader is called to enter into another person’s mourning.
  reasoning_layer_used: The lexical rationale says the Hebrew form expresses entering into mourning with others.
  rationale: “Share the grief” communicates participation in mourning in familiar English.
translation_notes:
  risk_flags:
  - risk: “Share the grief” states the participatory force more directly than the repeated verb “mourn.”
    mitigation: The Hebrew lexical rationale explicitly identifies entering into mourning with others.
  - risk: The Greek witness contains a substantially different exhortation.
    mitigation: The main text follows the surviving Hebrew, and the Greek reading is retained in the footnote.
