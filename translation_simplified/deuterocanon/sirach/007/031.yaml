translation:
  language: en
  text: Honor God, and treat the priest with honor. Give the priests the share that belongs to them, as you were commanded.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says, “Fear the Lord and glorify the priest, and give him his portion, as you have been commanded from the beginning,” and then lists priestly offerings.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: honor the priest
  simplified_phrase: treat the priest with honor
  preserved_meaning: The priestly office is to be treated with dignity and honor.
  reasoning_layer_used: Hebrew lexical decision for וַהֲדַר
  rationale: The expanded wording makes the command natural without weakening its force.
- pob_phrase: give them their portion
  simplified_phrase: Give the priests the share that belongs to them
  preserved_meaning: The commanded portion is collectively due to the priests.
  reasoning_layer_used: Hebrew plural suffix and theological decision on חֶלְקָם
  rationale: Naming the priests clarifies the plural pronoun while retaining the Hebrew number.
- pob_phrase: as you were commanded
  simplified_phrase: as you were commanded
  preserved_meaning: The required share rests on a prior command to the hearer.
  reasoning_layer_used: Hebrew lexical decision for כַּאֲשֶׁר צֻוֵּיתָה
  rationale: This wording is already direct and clear in modern English.
interpretive_expansions:
- pob_phrase: them
  rendering: the priests
  claim: The plural pronoun refers collectively to priests and their allotted dues.
  evidence:
  - The Hebrew possessive suffix in חֶלְקָם is plural.
  - The POB theological decision identifies priests as the natural collective referent.
  confidence: high
  alternatives_preserved:
  - the priest’s share
  - his portion in the Greek parallel
  external_witnesses:
  - The Greek parallel uses the singular “his portion.”
translation_notes:
  risk_flags:
  - risk: Changing “portion” to “share that belongs to them” may sound less like a formal priestly allotment.
    mitigation: The wording keeps the sense of an owed, commanded share and the footnote preserves the fuller Greek witness.
