translation:
  language: en
  text: Do not mistreat a faithful worker or a hired laborer who gives himself fully to his work.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew wording is difficult; the Greek parallel describes a hired laborer who “gives his life.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: a faithful servant
  simplified_phrase: a faithful worker
  preserved_meaning: The person works honestly and faithfully, without limiting the phrase to a household servant.
  reasoning_layer_used: lexical decision for עוֹבֵד אֱמֶת and the Greek parallel
  rationale: “Worker” is broader and matches the documented lexical choice.
- pob_phrase: nor a hired laborer
  simplified_phrase: or a hired laborer
  preserved_meaning: The second kind of worker remains included under the same prohibition.
  reasoning_layer_used: lexical decision for וְכֵן
  rationale: “Or” is more natural after a single negative command while keeping the parallel force.
- pob_phrase: who gives himself
  simplified_phrase: who gives himself fully to his work
  preserved_meaning: The laborer devotes his whole self and strength to the work.
  reasoning_layer_used: lexical decision for נוֹחֵן נַפְשׁוֹ and Greek διδόντα ψυχὴν αὐτοῦ
  rationale: The added wording makes the idiom clear without suggesting literal death.
interpretive_expansions:
- pob_phrase: who gives himself
  rendering: who gives himself fully to his work
  claim: His self-giving refers to wholehearted effort in labor.
  evidence:
  - The immediate context concerns a hired laborer.
  - The lexical rationale identifies the sense as spending himself in labor.
  - The Greek parallel retains the strong image of giving his life.
  confidence: high
  alternatives_preserved:
  - who gives his life
  - who devotes himself
