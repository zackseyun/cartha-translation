translation:
  language: en
  text: Do not prepare and sow injustice against a brother, or you may reap that injustice seven times over.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can literally mean “reap him” or “reap it”; here it refers to the injustice that was sown.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek has a different form: “Turn away from injustice, and it will turn away from you.”'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: sow furrows of injustice
  simplified_phrase: prepare and sow injustice
  preserved_meaning: The wording keeps the image of preparing ground and sowing wrongdoing.
  reasoning_layer_used: Hebrew lexical decisions for חֲרוּשֵׁי and תִּזְרַע
  rationale: “Prepare” makes the unusual furrow image understandable without reducing it to generic wrongdoing.
- pob_phrase: lest you reap it sevenfold
  simplified_phrase: or you may reap that injustice seven times over
  preserved_meaning: Wrongdoing may return to the wrongdoer in greatly intensified measure.
  reasoning_layer_used: POB theological decision on the suffix and lexical decision for שִׁבְעָתָיִם
  rationale: The clearer warning form retains both the harvest image and the sevenfold consequence.
translation_notes:
  risk_flags:
  - risk: Replacing “furrows” with “prepare” makes the plowing image less explicit.
    mitigation: The paired agricultural verbs “sow” and “reap” preserve the proverb’s controlling image.
  - risk: The Hebrew object of “reap” is grammatically ambiguous.
    mitigation: The main text follows the POB reading while footnote a records the alternative.
