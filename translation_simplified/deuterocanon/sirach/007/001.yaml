translation:
  language: en
  text: Do not do evil, and evil will not catch up with you.[a] Stay far away from wickedness, and it will turn away from you.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The second “evil” may also mean the harm or calamity that results from evil actions.
    reason: lexical_alternative
  - marker: b
    text: The last words may also be translated, “and it will leave you.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: evil will not overtake you
  simplified_phrase: evil will not catch up with you
  preserved_meaning: Evil is pictured as pursuing someone but failing to reach them.
  reasoning_layer_used: Lexical decision for יַשִּׂיגְךָ and the Greek parallel
  rationale: “Catch up with” makes the pursuit image immediately clear in common English.
- pob_phrase: keep far from iniquity
  simplified_phrase: Stay far away from wickedness
  preserved_meaning: The command requires active distance from serious moral evil.
  reasoning_layer_used: Lexical decisions for הַרְחֵק and עָוֹן
  rationale: “Stay far away” keeps the spatial image, while “wickedness” expresses the moral weight more plainly.
translation_notes:
  risk_flags:
  - risk: Readers may take the second “evil” only as moral evil rather than also as harmful consequences.
    mitigation: The footnote preserves the documented sense of harm or calamity.
  - risk: Changing “iniquity” to “wickedness” may narrow the term’s possible sense of guilt.
    mitigation: The exhortational context favors the moral sense selected by the POB.
