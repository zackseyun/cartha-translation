translation:
  language: en
  text: Do not try to prove yourself right before a king,[a] and do not try to show how clever you are before him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek reads, “Do not seek rulership from the Lord, nor a seat of glory from a king.” This translation follows the substantially different Hebrew text.
    reason: textual_variant
simplification_decisions:
- pob_phrase: justify yourself
  simplified_phrase: try to prove yourself right
  preserved_meaning: The warning is against presenting yourself as being in the right before royal authority.
  reasoning_layer_used: Hebrew lexical decision for תִּצְטַדֵּק
  rationale: This expresses reflexive self-vindication in everyday English.
- pob_phrase: show understanding before a king
  simplified_phrase: try to show how clever you are before him
  preserved_meaning: The warning is against displaying your discernment or cleverness in a king’s presence.
  reasoning_layer_used: Hebrew lexical decision for תִּתְבּוֹנֵן
  rationale: This makes the social display clear without implying that the cleverness is false.
interpretive_expansions:
- pob_phrase: show understanding
  rendering: try to show how clever you are
  claim: The command concerns presenting yourself to the king as discerning or clever.
  evidence:
  - The lexical rationale identifies presenting oneself as discerning or clever.
  - The parallel warning against self-justification supports a social display of ability.
  confidence: high
  alternatives_preserved:
  - show understanding
  - display discernment
translation_notes:
  risk_flags:
  - risk: The surviving Greek gives a substantially different command about seeking rulership and honor.
    mitigation: The main text follows the Hebrew-primary policy, and the Greek reading is retained in a footnote.
