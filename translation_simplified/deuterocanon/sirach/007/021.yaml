translation:
  language: en
  text: Love an intelligent slave[a] as you love yourself. Do not keep him enslaved.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “intelligent”; the Greek parallel says “good.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: as yourself
  simplified_phrase: as you love yourself
  preserved_meaning: The slave is to receive the same personal love and regard one has for oneself.
  reasoning_layer_used: POB lexical decision for כְּנֶפֶשׁ
  rationale: The added verb makes the comparison immediately clear in English.
- pob_phrase: do not withhold freedom from him
  simplified_phrase: Do not keep him enslaved
  preserved_meaning: The slave must not be denied release into free status.
  reasoning_layer_used: POB lexical decisions for וְאַל תִּמְנַע and חֹפֶשׁ
  rationale: The direct wording replaces an abstract phrase while preserving the command to grant freedom.
interpretive_expansions:
- pob_phrase: do not withhold freedom from him
  rendering: Do not keep him enslaved
  claim: Withholding freedom means continuing the person's bonded status rather than releasing him.
  evidence:
  - The Hebrew חֹפֶשׁ denotes release into free status.
  - The POB rationale says the following command concerns granting freedom.
  confidence: high
  alternatives_preserved:
  - Do not deny him freedom.
  - Do not keep freedom from him.
  external_witnesses:
  - The Greek parallel likewise speaks of not depriving him of freedom.
translation_notes:
  risk_flags:
  - risk: “Keep him enslaved” is more direct than the POB's abstract wording.
    mitigation: The rendering remains bounded by the lexical rationale that freedom here means release from bonded status.
