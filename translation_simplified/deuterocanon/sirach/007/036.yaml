translation:
  language: en
  text: Whenever you speak, remember your life's end, and you will never sin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Hebrew reads approximately, “Do not turn your heart away from someone who loves you, for that person will love you.” It differs greatly from the Greek followed in the main text.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: In all your words
  simplified_phrase: Whenever you speak
  preserved_meaning: The instruction applies to everything the reader says.
  reasoning_layer_used: The lexical decision permits a natural expression focused on speech.
  rationale: This wording states the comprehensive scope in ordinary English.
- pob_phrase: remember your end
  simplified_phrase: remember your life's end
  preserved_meaning: The reader should keep mortality or life's final outcome in mind without specifying judgment or the afterlife.
  reasoning_layer_used: The lexical and theological decisions preserve the phrase's breadth while excluding the modern sense of purpose or goal.
  rationale: Adding “life's” clarifies the intended kind of end without narrowing its documented ambiguity.
interpretive_expansions:
- pob_phrase: your end
  rendering: your life's end
  claim: The end in view is the end or final outcome of one's life, not one's purpose.
  evidence:
  - The POB lexical rationale identifies mortality or final outcome as the phrase's range.
  - The theological decision rejects a narrower claim about afterlife or judgment.
  confidence: high
  alternatives_preserved:
  - mortality
  - final outcome
translation_notes:
  risk_flags:
  - risk: “You will never sin” may sound like a guarantee of permanent sinlessness.
    mitigation: The strong result clause is retained because it reflects the Greek and the controlling POB decision.
  - risk: The surviving Hebrew gives a substantially different command.
    mitigation: The footnote presents its approximate sense while identifying the Greek as the basis of the main text.
