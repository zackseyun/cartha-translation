translation:
  language: en
  text: Do not bring guilt on yourself among the assembly at the gates of God,[a] and do not cause your own downfall in the congregation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel reads, “Do not sin among the city’s multitude, and do not cast yourself down in a crowd.” It may reflect a different Hebrew text or a smoother interpretation of “the gates of God.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: make yourself guilty
  simplified_phrase: bring guilt on yourself
  preserved_meaning: The person incurs moral guilt through his own conduct.
  reasoning_layer_used: Hebrew lexical decision for אַל תַּרְשִׁיעֲךָ
  rationale: The new wording is more direct while retaining the Hebrew’s emphasis on incurred guilt.
- pob_phrase: in the assembly at the gates of God
  simplified_phrase: among the assembly at the gates of God
  preserved_meaning: The wrongdoing occurs within a public assembly associated with God’s gates.
  reasoning_layer_used: Hebrew primacy and theological decision on שַׁעֲרֵי אֵל
  rationale: “Among” clarifies participation in the group without smoothing away the unusual Hebrew phrase.
- pob_phrase: bring yourself down
  simplified_phrase: cause your own downfall
  preserved_meaning: The person’s conduct causes him to fall or be brought low publicly.
  reasoning_layer_used: Hebrew lexical decision for וְאַל תַּפִּילְךָ
  rationale: This natural English wording keeps both personal responsibility and the source image of falling.
