translation:
  language: en
  text: Do not exchange a friend for payment, or a brother[a] who is as valuable as the gold from Ophir.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Brother” may mean a literal brother or, more broadly, a close relative or companion.
    reason: lexical_alternative
  - marker: b
    text: Ophir was famous for its exceptionally precious gold.
    reason: cultural_note
  - marker: c
    text: 'The Greek has a very different reading: “Remember that anger does not last long.” The main text follows the surviving Hebrew.'
    reason: textual_variant
simplification_decisions:
- pob_phrase: trade away a friend for a price
  simplified_phrase: exchange a friend for payment
  preserved_meaning: Do not surrender a friendship in return for financial gain or compensation.
  reasoning_layer_used: The lexical decisions preserve the commercial exchange without limiting payment to cash.
  rationale: “Exchange ... for payment” is plain English and keeps the source term broader than money.
- pob_phrase: a brother who is worth the gold of Ophir
  simplified_phrase: a brother who is as valuable as the gold from Ophir
  preserved_meaning: A brother has value comparable to exceptionally precious wealth and must not be exchanged for it.
  reasoning_layer_used: The lexical rationale reads the difficult Hebrew as a comparison of value and retains Ophir.
  rationale: “As valuable as” makes the comparison clear while preserving the image of Ophir’s gold.
translation_notes:
  risk_flags:
  - risk: “Exchange” may sound less forceful than “trade away.”
    mitigation: The command and phrase “for payment” retain the warning against treating a friend as merchandise.
  - risk: The Hebrew and Greek preserve sharply different textual traditions.
    mitigation: The footnote gives the Greek reading while the main text follows the surviving Hebrew.
