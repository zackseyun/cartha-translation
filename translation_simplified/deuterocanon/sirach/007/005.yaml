translation:
  language: en
  text: Do not seek to become a ruler if you lack the ability to put an end to arrogant wrongdoing.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek has a substantially different form: “Do not justify yourself before the Lord, and do not act wise before a king.”'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: if you have no strength
  simplified_phrase: if you lack the ability
  preserved_meaning: A person should not pursue rule without the practical capacity to govern effectively.
  reasoning_layer_used: lexical decision for חַיִל
  rationale: “Ability” makes the broad governing capacity clearer than “strength,” which may sound merely physical.
- pob_phrase: insolence
  simplified_phrase: arrogant wrongdoing
  preserved_meaning: The ruler must restrain proud, presumptuous misconduct.
  reasoning_layer_used: lexical decision for זָדוֹן
  rationale: This wording expresses both the pride and the active misconduct contained in the Hebrew term.
interpretive_expansions:
- pob_phrase: insolence
  rendering: arrogant wrongdoing
  claim: The prohibited attitude appears as proud misconduct that a ruler must stop.
  evidence:
  - The lexical rationale describes זָדוֹן as proud, presumptuous, or arrogant wrongdoing.
  - The governing context presents it as something a capable ruler must bring to an end.
  confidence: high
  alternatives_preserved:
  - insolence
  - arrogance
  - presumption
translation_notes:
  risk_flags:
  - risk: The Greek parallel preserves a substantially different verse.
    mitigation: The surviving Hebrew controls the main text, while the Greek form remains in a footnote.
  - risk: “Ability” may understate the force of Hebrew חַיִל.
    mitigation: The phrase still denotes sufficient capacity to govern and decisively end misconduct.
