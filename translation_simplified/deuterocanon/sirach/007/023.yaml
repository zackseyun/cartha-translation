translation:
  language: en
  text: Do you have sons? Discipline them, and arrange marriages for them while they are young.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel says, “Do you have children? Discipline them, and bend their neck from youth.” The surviving Hebrew instead speaks of arranging marriages for sons while they are young.
    reason: alternative_reading
