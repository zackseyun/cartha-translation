translation:
  language: en
  text: Build trust with your neighbor in poverty,[a] so that together you may have your fill of the good things he has. Stay by him in a time of distress, so that you may share in his inheritance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word translated “trust” can also mean faith or faithfulness; it does not specify whose poverty is meant.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Gain faith with your neighbor
  simplified_phrase: Build trust with your neighbor
  preserved_meaning: The wording expresses the interpersonal trust or faithfulness intended in this context.
  reasoning_layer_used: POB lexical and theological decisions on πίστις
  rationale: “Trust” prevents “faith” from being mistaken for shared religious belief while the note preserves its lexical range.
- pob_phrase: in his good things you may be filled together
  simplified_phrase: together you may have your fill of the good things he has
  preserved_meaning: Both people share fully in the neighbor’s broadly defined good things.
  reasoning_layer_used: POB lexical decisions on ἀγαθά and ὁμοῦ πλησθῇς
  rationale: This natural wording preserves both togetherness and the image of fullness.
- pob_phrase: remain with him
  simplified_phrase: Stay by him
  preserved_meaning: The command calls for steadfast presence during distress.
  reasoning_layer_used: POB lexical decision on διάμενε αὐτῷ
  rationale: “Stay by him” conveys continuing loyal support in direct modern English.
