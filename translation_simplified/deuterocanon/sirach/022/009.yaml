translation:
  language: en
  text: Weep for the dead, because the light has gone out.[a] Weep also for the fool,[b] because understanding has failed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek preserves the poetic image of light going out instead of stating its meaning directly.
    reason: lexical_alternative
  - marker: b
    text: In wisdom literature, “fool” means someone lacking moral discernment as well as good judgment.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Weep over the dead
  simplified_phrase: Weep for the dead
  preserved_meaning: The dead person remains the object of audible grief.
  reasoning_layer_used: Lexical decisions for κλαῦσον and νεκρῷ
  rationale: “Weep for” is more natural modern English than “weep over.”
- pob_phrase: for the light has failed
  simplified_phrase: because the light has gone out
  preserved_meaning: The concrete image of light ending is retained without adding a possessive or replacing it with “life.”
  reasoning_layer_used: Lexical and theological decisions for ἐξέλιπεν and φῶς
  rationale: “Has gone out” makes the image clearer while preserving its poetic compression.
- pob_phrase: and weep over the fool
  simplified_phrase: Weep also for the fool
  preserved_meaning: The separate command to weep and the sharp wisdom-literature category remain intact.
  reasoning_layer_used: Lexical and theological decisions for μωρῷ
  rationale: A new sentence makes the parallel easier to follow.
translation_notes:
  risk_flags:
  - risk: The light going out may be mistaken for a literal event.
    mitigation: The footnote identifies it as a poetic image without defining its referent more narrowly.
  - risk: Modern readers may hear “fool” as a casual insult about intelligence alone.
    mitigation: The footnote explains its moral and wisdom-literature sense.
