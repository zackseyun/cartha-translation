translation:
  language: en
  text: Do not talk at length with a fool, and do not go to someone who has no understanding. Keep away from him, so that you avoid trouble and are not defiled by his disruptive behavior.[a] Turn away from him, and you will find rest. His madness will not wear you down.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word is rare and may refer more specifically to something the fool shakes or flings off, or more broadly to his disruptive or contaminating behavior.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Do not multiply words with a fool
  simplified_phrase: Do not talk at length with a fool
  preserved_meaning: The warning is against prolonged speech with a fool.
  reasoning_layer_used: POB lexical decision for μὴ πληθύνῃς λόγον
  rationale: The Greek idiom becomes immediate common English without weakening the command.
- pob_phrase: do not go to an unintelligent man
  simplified_phrase: do not go to someone who has no understanding
  preserved_meaning: The person lacks sound understanding or discernment, while the movement toward him remains explicit.
  reasoning_layer_used: POB lexical decision for ἀσύνετος and revision preserving πορεύου motion
  rationale: This avoids suggesting a technical judgment about intelligence.
- pob_phrase: you will not grow weary because of his madness
  simplified_phrase: His madness will not wear you down
  preserved_meaning: Keeping away prevents the fool's madness from draining the hearer.
  reasoning_layer_used: POB lexical decisions for ἀκηδιάω and ἀπόνοια
  rationale: The result is stated in direct, natural English.
