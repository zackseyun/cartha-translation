  reasoning_layer_used: POB lexical decisions for ἐπὶ μετεώρου κείμενοι and κατέναντι ἀνέμου
  rationale: The wording makes the physical scene immediate without weakening the image.
- pob_phrase: so a timid heart, set on a foolish thought
  simplified_phrase: In the same way, a timid heart resting on a foolish thought
  preserved_meaning: A fearful inner life depends on a foolish idea, plan, or purpose.
  reasoning_layer_used: POB lexical decision for ἐπὶ διανοήματος μωροῦ
  rationale: “Resting on” clearly shows dependence while the footnote preserves the phrase’s range.
- pob_phrase: will never hold out against any fear
