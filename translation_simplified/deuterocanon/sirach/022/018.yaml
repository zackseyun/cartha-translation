translation:
  language: en
  text: Stakes set high up, directly facing the wind, will never stay firm. In the same way, a timid heart resting on a foolish thought[a] will never stand firm against any fear.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Thought” may also mean a plan or purpose.
    reason: lexical_alternative
