translation:
  language: en
  text: If you speak against a friend, do not give up hope,[a] because you can still be reconciled. The exceptions are insult, arrogance, revealing a secret, and a treacherous blow. Any of these will drive every friend away.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “do not be afraid.” The Greek can express fear or caution, but the promise of reconciliation supports the sense “do not give up hope.”
    reason: lexical_alternative
