translation:
  language: en
  text: People mourn someone who has died for seven days. But they mourn a fool and an ungodly man[a] for as long as he lives.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek uses masculine singular forms generically in this wisdom saying; this may also be rendered “an ungodly person ... for as long as they live.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Mourning for the dead is seven days
  simplified_phrase: People mourn someone who has died for seven days
  preserved_meaning: The customary period of mourning after a death is seven days.
  reasoning_layer_used: Lexical decisions for πένθος, νεκροῦ, and ἑπτὰ ἡμέραι
  rationale: The concrete wording replaces an abstract construction while keeping the same mourning period.
- pob_phrase: all the days of his life
  simplified_phrase: for as long as he lives
  preserved_meaning: Mourning over the fool and ungodly man continues throughout his lifetime.
  reasoning_layer_used: Lexical rationale for πᾶσαι αἱ ἡμέραι τῆς ζωῆς αὐτοῦ
  rationale: The common English phrase preserves the full duration and the contrast with seven days.
interpretive_expansions:
- pob_phrase: but for a fool and an ungodly man
  rendering: But they mourn a fool and an ungodly man
  claim: The second clause repeats the idea of mourning from the first clause.
  evidence:
