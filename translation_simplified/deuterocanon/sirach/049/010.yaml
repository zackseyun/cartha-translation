translation:
  language: en
  text: May the bones of the twelve prophets bloom where they lie.[a] For they brought healing to Jacob[b] and delivered his people through faithful hope.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This image honors the prophets after death; Hebrew has the difficult “from beneath them,” while Greek has “from their place.”
    reason: textual_variant
  - marker: b
    text: Greek reads “comforted Jacob” instead of the Hebrew “healed Jacob.”
    reason: alternative_reading
  - marker: c
    text: The Hebrew may mean “exalted him in faithful hope,” while Greek reads “delivered them in faith of hope.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: may their bones flourish from where they lie
  simplified_phrase: may the bones of the twelve prophets bloom where they lie
  preserved_meaning: The prophets’ bones are pictured as new growth expressing honor after death.
  reasoning_layer_used: lexical decisions and funerary-image rationale
  rationale: “Bloom” keeps the concrete growth image in more familiar English.
- pob_phrase: they healed Jacob
  simplified_phrase: they brought healing to Jacob
  preserved_meaning: The prophets restored Jacob while retaining the Hebrew-led healing image.
  reasoning_layer_used: Hebrew-priority theological decision
  rationale: The verbal phrase sounds more natural without replacing Hebrew “healed” with Greek “comforted.”
- pob_phrase: delivered them
  simplified_phrase: delivered his people
  preserved_meaning: The plural object refers to Jacob understood collectively as Israel.
  reasoning_layer_used: lexical rationale and Greek plural object
  rationale: Naming the people removes an unclear pronoun while preserving the adopted Greek-informed reading.
interpretive_expansions:
- pob_phrase: delivered them
  rendering: delivered his people
  claim: Jacob represents the people of Israel in this line.
  evidence:
  - The POB rationale states that Jacob is used corporately for the people.
  - The Greek parallel has a plural object after singular Jacob.
  confidence: high
  alternatives_preserved:
  - The Hebrew may instead refer to Jacob with a singular object.
translation_notes:
  risk_flags:
