translation:
  language: en
  text: Yehoshua son of Jehozadak was also remembered.[a] In their days, Yehoshua and those with him raised up a holy temple and established it for everlasting glory.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: An uncertain Hebrew line adds, “who set up an altar in a time of distress”; the Greek does not contain this line.
    reason: textual_variant
simplification_decisions:
- pob_phrase: So also Yehoshua son of Jehozadak
  simplified_phrase: Yehoshua son of Jehozadak was also remembered
  preserved_meaning: Yehoshua is introduced as another honored leader in the commemorative sequence.
  reasoning_layer_used: POB lexical decision for גם and immediate literary context
  rationale: The passive wording makes the commemorative connection natural without treating his existence as the point.
- pob_phrase: in their days they
  simplified_phrase: In their days, Yehoshua and those with him
  preserved_meaning: The plural refers to Yehoshua together with his associates or generation.
  reasoning_layer_used: POB Greek-parallel decision for οἱ ἐν ἡμέραις αὐτῶν
  rationale: Naming the group removes unclear pronouns while preserving the source's plural reference.
- pob_phrase: raised up a holy temple, established for everlasting glory
  simplified_phrase: raised up a holy temple and established it for everlasting glory
  preserved_meaning: They raised the temple and set it firmly in place for enduring glory.
  reasoning_layer_used: POB lexical decisions for וירימו, ומכונן, and לכבוד עולם
  rationale: Turning the participial phrase into a coordinated verb makes the action easier to follow.
interpretive_expansions:
- pob_phrase: they
  rendering: Yehoshua and those with him
  claim: The plural builders included Yehoshua and his associates or generation.
  evidence:
  - The POB audit says the Greek plural likely refers to Yehoshua and his associates or generation.
  - The Hebrew line uses a plural verb for raising the temple.
  confidence: moderate
  alternatives_preserved:
  - Yehoshua and his generation
  - Yehoshua and his associates
