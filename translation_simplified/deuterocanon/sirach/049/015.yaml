translation:
  language: en
  text: A man like Joseph was born.[a] Even after his death, his body was cared for.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek parallel has a fuller reading: “But Joseph became a man, leader of his brothers, support of the people, and his bones were cared for.” The surviving Hebrew is shorter.'
    reason: alternative_reading
  - marker: b
    text: This likely refers to the later honoring and burial of Joseph’s remains; see Exodus 13:19 and Joshua 24:32.
    reason: cross_reference
simplification_decisions:
- pob_phrase: Like Joseph, a man was born
  simplified_phrase: A man like Joseph was born
  preserved_meaning: Joseph remains the standard of comparison, and the concise Hebrew wording is retained.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Natural English word order makes the comparison easier to understand without importing the Greek praise.
- pob_phrase: and even his body was cared for
  simplified_phrase: Even after his death, his body was cared for
  preserved_meaning: Joseph’s dead body received later care and honor.
  reasoning_layer_used: POB lexical rationale and cross-reference footnote
  rationale: The added time phrase makes the posthumous setting clear while preserving the Hebrew image of his body.
interpretive_expansions:
- pob_phrase: even his body was cared for
  rendering: Even after his death, his body was cared for
  claim: The care occurred after Joseph’s death.
  evidence:
  - The lexical rationale says “body” can refer to a dead body or corpse.
  - The Greek parallel refers to Joseph’s bones being cared for.
  - Exodus 13:19 and Joshua 24:32 describe the later care and burial of Joseph’s remains.
  confidence: high
  alternatives_preserved:
  - The main text does not specify whether the care means transport, honoring, or burial.
translation_notes:
  risk_flags:
  - risk: The short Hebrew phrase about a man being born remains elliptical and may be understood in more than one way.
    mitigation: The main text follows POB’s comparative reading, while the fuller Greek form remains in a footnote.
  - risk: “After his death” is implied rather than directly stated in the Hebrew clause.
    mitigation: The dead-body sense, Greek reference to bones, and biblical burial tradition jointly support the clarification.
