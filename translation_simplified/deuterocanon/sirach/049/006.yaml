translation:
  language: en
  text: They set the holy city on fire and devastated its streets in connection with Yirmeyahu’s prophetic ministry.[a] For they mistreated him, though he had been formed in the womb to be a prophet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The compressed Hebrew may also mean “through Yirmeyahu,” connecting the destruction with his prophetic work or warning; the exact connection is uncertain.
    reason: alternative_reading
  - marker: b
    text: This recalls Yirmeyahu’s calling before birth in Jeremiah 1:5.
    reason: cross_reference
simplification_decisions:
- pob_phrase: by the hand of Yirmeyahu
  simplified_phrase: in connection with Yirmeyahu’s prophetic ministry
  preserved_meaning: The destruction was connected with Yirmeyahu’s prophetic role without making him its direct agent.
  reasoning_layer_used: theological decision on ביד ירמיהו and alternative-reading footnote
  rationale: The clearer wording prevents a likely misunderstanding while the footnote preserves the compressed syntax and uncertainty.
- pob_phrase: made its streets desolate
  simplified_phrase: devastated its streets
  preserved_meaning: The city’s streets were laid waste.
  reasoning_layer_used: lexical decisions for וישמו and ארחתיה
  rationale: The active verb is familiar English and retains the image of ruined streets.
- pob_phrase: for they afflicted him, though he had been formed in the womb as a prophet
  simplified_phrase: For they mistreated him, though he had been formed in the womb to be a prophet
  preserved_meaning: The people treated Yirmeyahu harshly despite his prophetic designation before birth.
  reasoning_layer_used: lexical decisions for כי ענוהו and מרחם נוצר נביא
  rationale: The wording uses common terms while retaining the causal link, contrast, and womb image.
