translation:
  language: en
  text: A wound can be bandaged, and people can make peace after insults. But someone who has revealed secrets has lost hope.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “is beyond hope” or “has despaired.” The Greek does not say what hope has been lost; the context most likely points to hope of restoring trust after betraying a confidence.
    reason: lexical_alternative
