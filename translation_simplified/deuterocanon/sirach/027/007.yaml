translation:
  language: en
  text: Do not praise someone until you have heard them express their thoughts.[a] This is how a person is tested.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “before reflection” or “before a person’s reasoning is known.”
    reason: lexical_alternative
