translation:
  language: en
  text: A kiln reveals the quality of a potter’s vessels. In the same way, a man’s reasoning[a] reveals what kind of man he is.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “thoughts” or “deliberation.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: A potter’s vessels are tested by the kiln
  simplified_phrase: A kiln reveals the quality of a potter’s vessels
  preserved_meaning: Firing in the kiln proves the quality of the pottery.
  reasoning_layer_used: POB lexical decision for לְבָעֵר כִּבְשָׁן and the Greek parallel
  rationale: The active wording makes the pottery image easier to grasp while preserving the kiln’s testing role.
- pob_phrase: and likewise a man by his reasoning
  simplified_phrase: In the same way, a man’s reasoning reveals what kind of man he is
  preserved_meaning: A man’s quality becomes known through the way he reasons.
  reasoning_layer_used: POB lexical and theological decisions for אִישׁ and עַל חֶשְׁבּוֹנוֹ
  rationale: The comparison is stated as a complete sentence while retaining the masculine representative wording.
