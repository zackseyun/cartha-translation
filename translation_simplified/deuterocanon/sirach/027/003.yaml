  reasoning_layer_used: Lexical decisions for κρατήσῃ, κατὰ σπουδήν, and ἐν φόβῳ Κυρίου
  rationale: This natural wording preserves both diligent steadfastness and “fear of the Lord” as the sphere in which he stands firm.
