translation:
  language: en
  text: A lion waits to ambush its prey. In the same way, sins wait to ambush those who keep doing wrong.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: lies in wait for prey
  simplified_phrase: waits to ambush its prey
  preserved_meaning: The lion deliberately waits to attack what it hunts.
  reasoning_layer_used: The lexical decision for ἐνεδρεύει preserves the image of a concealed ambush.
  rationale: “Waits to ambush” makes the predatory action immediately clear.
- pob_phrase: so sins do
  simplified_phrase: In the same way, sins wait to ambush
  preserved_meaning: Sins are personified as predators stalking wrongdoers.
  reasoning_layer_used: The theological decision requires retaining sins themselves as the stalking subject.
  rationale: Repeating the ambush language makes the comparison clear without replacing sins with consequences.
- pob_phrase: those who practice injustice
  simplified_phrase: those who keep doing wrong
  preserved_meaning: The saying concerns people actively or habitually committing unjust acts.
  reasoning_layer_used: The lexical decisions for ἐργαζομένους and ἄδικα support ongoing wrongdoing.
  rationale: This wording replaces an abstract phrase with common English while preserving continued action.
translation_notes:
  risk_flags:
  - risk: “Ambush” may suggest a sudden attack more strongly than “lies in wait.”
    mitigation: The source verb explicitly allows the sense of setting an ambush.
