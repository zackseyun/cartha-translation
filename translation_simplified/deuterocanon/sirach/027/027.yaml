translation:
  language: en
  text: If anyone does evil, that evil will roll onto them,[a] and they will never know where it came from.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek pictures evil rolling onto the person who did it; it may also suggest that the evil rolls back on them.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Whoever does evil
  simplified_phrase: If anyone does evil
  preserved_meaning: The statement applies generally to every evildoer.
  reasoning_layer_used: The lexical decision for ὁ ποιῶν preserves its generic, proverbial force.
  rationale: The conditional form is more direct in common English.
- pob_phrase: onto himself it will roll
  simplified_phrase: that evil will roll onto them
  preserved_meaning: Evil is pictured as moving onto the person who did it.
  reasoning_layer_used: The lexical and theological decisions require the rolling and directional imagery to remain visible.
  rationale: Naming “that evil” clarifies the subject while keeping the source image.
- pob_phrase: he will certainly not know from where it came upon him
  simplified_phrase: they will never know where it came from
  preserved_meaning: The evildoer emphatically fails to recognize the source of the returning evil.
  reasoning_layer_used: The lexical decision identifies οὐ μή as emphatic negation and πόθεν as origin.
  rationale: “Never know” expresses the strong denial in simpler English.
translation_notes:
  risk_flags:
  - risk: Singular “they” changes the source’s masculine grammatical form.
    mitigation: It preserves the generic reference to any person without changing the meaning.
  - risk: “Never” may sound broader than a simple future denial.
    mitigation: The Greek emphatic negation and POB rationale support this force.
