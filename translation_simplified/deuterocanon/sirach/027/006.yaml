translation:
  language: en
  text: A tree’s fruit shows how it was cared for. In the same way, a man’s reasoning[a] shows what his heart is inclined toward.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can mean reasoning or thought; the Greek parallel points to words that express the thought of a man’s heart.
    reason: alternative_reading
