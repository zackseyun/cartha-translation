translation:
  language: en
  text: Who was tested by wealth and proved to have integrity? Let that be to his honor.[a] Who could have done wrong but did not, and could have done evil but did not want to?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew of the first line is difficult; a more literal reading is, “Who blessed him, and he was complete in his life,” but the context supports the meaning given here.
    reason: textual_variant
  - marker: b
    text: Or “Who could have turned aside but did not, and could have done harm but did not consent?”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: was tested by it and was found complete
  simplified_phrase: was tested by wealth and proved to have integrity
  preserved_meaning: The person remained morally sound when wealth tested him.
  reasoning_layer_used: POB lexical decisions and immediate context
  rationale: The wording names the implied test and expresses moral completeness in common English.
- pob_phrase: Let it be for him a boast
  simplified_phrase: Let that be to his honor
  preserved_meaning: Such proven integrity deserves honorable praise.
  reasoning_layer_used: POB lexical rationale
  rationale: “To his honor” avoids suggesting arrogant self-praise while keeping the commendation.
- pob_phrase: was able to transgress and did not transgress
  simplified_phrase: could have done wrong but did not
  preserved_meaning: He had the ability or opportunity to act wrongly but refused.
  reasoning_layer_used: POB lexical decisions
  rationale: The plain phrase keeps the ethical force without the less familiar word “transgress.”
interpretive_expansions:
