translation:
  language: en
  text: Blessed is the man who proves to be blameless and does not stray from the right path in matters of wealth.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult Hebrew may also mean that he has not pursued wealth wrongly or been led astray by money.
    reason: alternative_reading
  - marker: b
    text: The Greek parallel differs substantially, so this translation follows the surviving Hebrew with caution.
    reason: textual_variant
simplification_decisions:
- pob_phrase: is found blameless
  simplified_phrase: proves to be blameless
  preserved_meaning: His moral integrity is shown to be genuine, not sinless perfection.
  reasoning_layer_used: POB lexical decision for נמצא and תמים
  rationale: “Proves to be” makes the evaluative sense natural in modern English.
- pob_phrase: has not gone astray after wealth
  simplified_phrase: does not stray from the right path in matters of wealth
  preserved_meaning: Wealth has not drawn him away from morally upright conduct.
  reasoning_layer_used: POB lexical and theological decisions on ויחר ממון לא נלוז
  rationale: The wording preserves the path image while clarifying the difficult relation to wealth.
interpretive_expansions:
- pob_phrase: after wealth
  rendering: in matters of wealth
  claim: The clause concerns moral integrity in relation to wealth.
  evidence:
  - The surviving Hebrew contains both “wealth” and “not gone astray.”
  - The POB theological decision identifies integrity in relation to wealth as the controlling sense.
  - The Greek parallel supports integrity concerning possessions but differs substantially.
  confidence: moderate
  alternatives_preserved:
  - wrongly pursuing wealth
  - being led astray by money
  external_witnesses:
  - Greek parallel
translation_notes:
  risk_flags:
