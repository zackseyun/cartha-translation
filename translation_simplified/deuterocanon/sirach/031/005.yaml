translation:
  language: en
  text: Anyone who eagerly chases financial gain will not escape punishment. Anyone who loves profit will go astray because of it.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Hebrew has this warning about pursuing gain. The Greek version has a different saying here about divinations, omens, and dreams.
    reason: textual_variant
simplification_decisions:
- pob_phrase: One who eagerly pursues gain
  simplified_phrase: Anyone who eagerly chases financial gain
  preserved_meaning: The person continually and deliberately seeks material advantage.
  reasoning_layer_used: Hebrew lexical decisions for רודף and חרוץ
  rationale: “Chases financial gain” makes the active economic pursuit immediately clear.
- pob_phrase: will not go unpunished
  simplified_phrase: will not escape punishment
  preserved_meaning: The person will be held accountable and face punishment.
  reasoning_layer_used: Hebrew idiom לא ינקה
  rationale: The recast wording expresses the same consequence in more direct English.
- pob_phrase: will go astray by it
  simplified_phrase: will go astray because of it
  preserved_meaning: Love of profit becomes the cause of moral or practical error.
  reasoning_layer_used: Hebrew lexical decisions for בו and ישגה
  rationale: “Because of it” states the causal relationship more naturally.
interpretive_expansions:
