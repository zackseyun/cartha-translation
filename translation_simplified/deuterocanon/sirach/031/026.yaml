translation:
  language: en
  text: Years of life remain with a discerning man. He makes it through the night, and in the morning he is still alive.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also be translated, “his soul is with him,” since the same word may mean life, self, or soul.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek text differs greatly: “He who takes away his neighbor’s livelihood is killing him.” The main text follows the surviving Hebrew.'
    reason: textual_variant
simplification_decisions:
- pob_phrase: Years of life are with a discerning man
  simplified_phrase: Years of life remain with a discerning man
  preserved_meaning: Discernment is associated with life being sustained, without turning the line into a definite promise of long life.
  reasoning_layer_used: Hebrew lexical decision for שנות חיים
  rationale: “Remain with” makes the Hebrew image more natural while retaining “years of life.”
- pob_phrase: he will lie down until morning
  simplified_phrase: He makes it through the night
  preserved_meaning: He spends the night and reaches morning safely.
  reasoning_layer_used: Hebrew lexical decision for ילין עד בקר
  rationale: The wording keeps the overnight image while expressing it in ordinary English.
- pob_phrase: his life is with him
  simplified_phrase: in the morning he is still alive
  preserved_meaning: His life continues through the night rather than referring specifically to an immaterial soul.
  reasoning_layer_used: Lexical and theological decisions for נפש
  rationale: The direct wording avoids a misleading English use of “soul.”
interpretive_expansions:
- pob_phrase: he will lie down until morning, and his life is with him
  rendering: He makes it through the night, and in the morning he is still alive.
  claim: The two clauses describe surviving the night and reaching morning alive.
  evidence:
  - The POB rationale reads נפש here as continued life or preservation.
  - The immediate Hebrew wording joins the night, morning, and retained life.
  confidence: high
  alternatives_preserved:
  - The footnote preserves “his soul is with him.”
translation_notes:
  risk_flags:
