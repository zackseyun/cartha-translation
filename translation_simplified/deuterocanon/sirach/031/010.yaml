translation:
  language: en
  text: Who is such a man?[a] He has faced such tests and proved sound. This will bring him honor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The difficult Hebrew could be read more literally: “Who is this who clung to it and had peace, and it became glory for him?”'
    reason: alternative_reading
  - marker: b
    text: 'The Greek differs greatly and may reflect another form of the text: “Whoever has not been tested in a little knows little.”'
    reason: textual_variant
simplification_decisions:
- pob_phrase: Who is this
  simplified_phrase: Who is such a man?
  preserved_meaning: The verse calls attention to an exceptional person.
  reasoning_layer_used: POB lexical decision for מי הוא זה
  rationale: This makes the rhetorical question natural while keeping its force.
- pob_phrase: has been tested in these things and has become complete
  simplified_phrase: has faced such tests and proved sound
  preserved_meaning: Testing has shown the person to be whole and reliable.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: This names the testing clearly while leaving its uncertain sphere broad.
- pob_phrase: it will be for him a ground for boasting
  simplified_phrase: This will bring him honor
  preserved_meaning: Passing the test will result in praise or honor for him.
  reasoning_layer_used: POB lexical decision for והיה לו תפארה
  rationale: The future result remains clear without suggesting sinful pride.
