translation:
  language: en
  text: A person with an evil eye—someone stingy or envious—hates God.[a] God created nothing worse than this.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Evil eye” is a Hebrew expression for a person who is stingy, envious, or resentful of others.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek text has a completely different sentence: “For their hope is in the one who saves them.”'
    reason: textual_variant
