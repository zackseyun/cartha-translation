translation:
  language: en
  text: A foolish man suffers pain, and his sleep wanders away. He retches and chokes, and his face is turned.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew wording for these symptoms and for “his face is turned” is difficult; the Greek text of this verse is entirely different.
    reason: textual_variant
simplification_decisions:
- pob_phrase: Pain and sleepless wandering
  simplified_phrase: suffers pain, and his sleep wanders away
  preserved_meaning: The man experiences bodily pain while sleep flees from him.
  reasoning_layer_used: POB lexical decisions for מכאוב and ונדד ישנה
  rationale: This explains the wandering-sleep image without reducing it to ordinary insomnia.
- pob_phrase: retching and choking
  simplified_phrase: He retches and chokes
  preserved_meaning: Both distinct symptoms of gastric and constrictive distress remain.
  reasoning_layer_used: POB lexical decisions for ומער and ותשניק
  rationale: Finite verbs make the list natural while retaining both physical symptoms.
- pob_phrase: a turned face with a foolish man
  simplified_phrase: A foolish man ... his face is turned
  preserved_meaning: The symptoms accompany a foolish man, while the uncertain face image remains a state rather than an action.
  reasoning_layer_used: POB lexical decisions for ופני הפוכות and עם איש כסיל; grounding review
  rationale: The passive state avoids choosing between an averted face and a distorted expression.
interpretive_expansions:
- pob_phrase: with a foolish man
  rendering: A foolish man suffers ... his sleep ... He ... his face
  claim: The listed symptoms are presented as the foolish man’s experience.
  evidence:
  - The Hebrew places the symptom list “with a foolish man.”
  - The POB identifies a singular foolish man as accompanying the symptoms.
  confidence: high
  alternatives_preserved:
  - These symptoms are with a foolish man.
translation_notes:
  risk_flags:
  - risk: Making the foolish man the grammatical subject is more explicit than the Hebrew list.
    mitigation: The wording states only the association already expressed by “with a foolish man.”
  - risk: “His face is turned” remains unusual because the Hebrew expression is uncertain.
    mitigation: The result-state wording and footnote avoid forcing either an averted face or a distorted expression.
