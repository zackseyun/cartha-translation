translation:
  language: en
  text: Take your place at the table[a] as a refined man[b] should. Do not gulp down your food, or you will make yourself disgusting.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally refers to reclining, the customary posture at formal meals.
    reason: cultural_note
  - marker: b
    text: The Hebrew may also mean “a distinguished man” or “a chosen man”; the exact nuance is uncertain.
    reason: lexical_alternative
  - marker: c
    text: The surviving Greek text at this verse does not correspond to this Hebrew line.
    reason: textual_variant
