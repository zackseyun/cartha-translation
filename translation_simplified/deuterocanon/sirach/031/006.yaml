translation:
  language: en
  text: Many people have been ruined by gold and by putting their trust in pearls.[a] They found no escape from evil and no rescue on the day of wrath.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word may refer to pearls or, more broadly, to costly gems or jewels.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek text differs greatly here: “Unless it is sent from the Most High in visitation, do not give your heart to them.” The main text follows the surviving Hebrew.'
    reason: textual_variant
simplification_decisions:
- pob_phrase: Many have been ruined by gold
  simplified_phrase: Many people have been ruined by gold
  preserved_meaning: Gold has brought many people to moral or practical ruin.
  reasoning_layer_used: POB lexical decision for חבולי and זהב
  rationale: Adding “people” makes the sentence immediately clear without changing its claim.
- pob_phrase: and by trusting in pearls
  simplified_phrase: and by putting their trust in pearls
  preserved_meaning: Reliance on costly treasures contributes to their downfall.
  reasoning_layer_used: POB lexical decisions for הבוטח and פנינים
  rationale: The fuller idiom sounds natural while retaining trust as the central fault.
- pob_phrase: nor deliverance on the day of wrath
  simplified_phrase: and no rescue on the day of wrath
  preserved_meaning: Wealth cannot provide divine rescue when judgment comes.
  reasoning_layer_used: POB lexical decisions for להושע and ביום עברה
  rationale: “No rescue” is common English and keeps the gravity of judgment.
