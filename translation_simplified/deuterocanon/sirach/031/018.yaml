  simplified_phrase: Understand your neighbor as yourself
  preserved_meaning: The command calls for thoughtful understanding of one’s neighbor without changing it to love.
  reasoning_layer_used: Lexical and theological decisions for דעה
  rationale: “Understand” conveys thoughtful regard while preserving the Hebrew’s distinct ethical emphasis.
- pob_phrase: in everything you hate, be considerate
  simplified_phrase: think carefully about everything you hate
  preserved_meaning: The reader must reflect deliberately on whatever is personally hateful.
  reasoning_layer_used: Lexical decision for התבונן and alternative-reading footnote
  rationale: “Think carefully” expresses deliberate moral reflection in clear modern English.
