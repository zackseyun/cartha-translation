translation:
  language: en
  text: Understand your neighbor as yourself, and think carefully about everything you hate.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean, “In every matter, consider what you yourself would hate,” using what you dislike as a test for how to treat others.
    reason: alternative_reading
  - marker: b
    text: The ancient Greek text differs greatly, reading approximately, “Whom does he attend to? And what is his support?” This translation follows the surviving Hebrew text.
    reason: textual_variant
