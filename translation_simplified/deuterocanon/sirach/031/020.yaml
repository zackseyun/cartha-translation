translation:
  language: en
  text: 'Know this: your neighbor is a man like you.[a][b] Eat the food served to you.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “a man like you”; the saying also applies more broadly to any person like yourself.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek witness has a substantially different line: “lifting up the soul and enlightening the eyes, giving healing, life, and blessing.”'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Know that your neighbor is a man like yourself
  simplified_phrase: 'Know this: your neighbor is a man like you.'
  preserved_meaning: The reader must recognize that his neighbor shares the same human standing.
  reasoning_layer_used: Hebrew lexical decisions and gendered-expression decision
  rationale: A short introductory phrase and direct comparison make the exhortation easier to grasp while retaining the masculine Hebrew wording.
- pob_phrase: and eat what is set before you
  simplified_phrase: Eat the food served to you.
  preserved_meaning: The command concerns eating what has been placed before the reader at a meal.
  reasoning_layer_used: Meal-context lexical rationale for ששם לפניך
  rationale: A separate sentence and ordinary meal language replace the less explicit table-setting idiom.
