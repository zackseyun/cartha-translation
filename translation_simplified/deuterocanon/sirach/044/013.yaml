translation:
  language: en
  text: Their memory will endure forever.[a] Their righteousness will never be forgotten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek reads, “Their offspring will remain forever, and their glory will not be blotted out.” The Masada scroll also has “offspring” or “seed” instead of the Cairo Geniza Hebrew’s “memory.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: Their remembrance will stand forever
  simplified_phrase: Their memory will endure forever
  preserved_meaning: The lasting memory of these honored people continues forever.
  reasoning_layer_used: The lexical decisions permit “memory” for זכרם and “endure” for יעמד.
  rationale: Common wording makes the line immediately clear while preserving the image’s force of lasting endurance.
- pob_phrase: and their righteousness will not be forgotten
  simplified_phrase: Their righteousness will never be forgotten
  preserved_meaning: Their righteousness remains permanently remembered.
  reasoning_layer_used: The lexical decision retains “righteousness” and the passive sense of לא תשכח.
  rationale: A separate sentence and “never” give the same meaning in more direct English.
translation_notes:
  risk_flags:
  - risk: Replacing “stand” with “endure” reduces the literal posture image.
    mitigation: “Endure forever” preserves the image’s intended force of permanent continuance.
  - risk: The Greek and Masada witnesses preserve a materially different reading.
    mitigation: The main text follows the controlling Cairo Hebrew while the footnote preserves the alternative.
