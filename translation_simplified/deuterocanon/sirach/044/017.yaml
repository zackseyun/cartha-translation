translation:
  language: en
  text: Noah was found to be righteous and blameless. When destruction came, he became a substitute.[a] Because of him, survivors remained. Through his covenant, the flood came to an end.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The expression may also mean “an exchange,” “compensation,” or “a ransom”—something given in place of another.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says that the flood ended, while the Greek parallel appears to speak of the flood coming instead.
    reason: textual_variant
simplification_decisions:
- pob_phrase: at the time of destruction
  simplified_phrase: When destruction came
  preserved_meaning: This remains a time of catastrophic ruin or judgment.
  reasoning_layer_used: POB lexical decision for לעת כלה
  rationale: The clause uses ordinary English without weakening the destructive force.
- pob_phrase: a remnant remained
  simplified_phrase: survivors remained
  preserved_meaning: Some people were preserved through the destruction because of Noah.
  reasoning_layer_used: POB lexical decisions for בעבורו and שארית
  rationale: “Survivors” makes the remnant idea immediately clear.
- pob_phrase: the flood ceased
  simplified_phrase: the flood came to an end
  preserved_meaning: The flood stopped, following the Hebrew witness.
  reasoning_layer_used: POB lexical and theological decisions for חדל מבול
  rationale: The natural phrase preserves the Hebrew-based reading.
translation_notes:
  risk_flags:
  - risk: “Substitute” retains an unusual and somewhat uncertain relationship between Noah and those preserved.
    mitigation: The lexical footnote preserves the alternatives without specifying whom Noah replaced.
  - risk: The Hebrew and Greek witnesses differ on whether the flood ceased or came.
    mitigation: The main text follows the controlling Hebrew witness and the footnote notes the Greek difference.
