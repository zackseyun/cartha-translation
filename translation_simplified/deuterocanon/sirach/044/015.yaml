translation:
  language: en
  text: The assembled community tells again of their wisdom,[a] and the congregation tells of their praise.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says their wisdom is repeated; the Greek says peoples will recount their wisdom.
    reason: alternative_reading
  - marker: b
    text: The fragmentary Masada scroll preserves only the closing words about their praise and the congregation.
    reason: textual_variant
simplification_decisions:
- pob_phrase: Their wisdom is proclaimed by the assembly
  simplified_phrase: The assembled community tells again of their wisdom
  preserved_meaning: The gathered community publicly repeats the ancestors’ wisdom.
  reasoning_layer_used: Hebrew lexical decisions for תשנה and עדה
  rationale: The active wording is easier to follow while preserving repetition and the public setting.
- pob_phrase: their praise is recounted by the congregation
  simplified_phrase: the congregation tells of their praise
  preserved_meaning: The gathered people continue speaking about why the ancestors deserve praise.
  reasoning_layer_used: Hebrew lexical decisions for יספר, תהלה, and קהל
  rationale: “Tells of” replaces the less familiar “is recounted” without weakening the communal report.
translation_notes:
  risk_flags:
  - risk: “Tells again of” may sound less formal than the Hebrew poetic parallelism.
    mitigation: The wording retains both the repetition and the distinct communal terms.
