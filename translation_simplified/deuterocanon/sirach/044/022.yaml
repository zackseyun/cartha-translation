translation:
  language: en
  text: Because of Isaac’s father Abraham, he established through Isaac a covenant[a] with every firstborn.[b] The blessing came to rest on the head of Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The transmitted Hebrew reads “son” here, but the Greek parallel and the surrounding Hebrew support “covenant.”
    reason: textual_variant
  - marker: b
    text: The Hebrew reads “every firstborn,” while the Greek has the broader wording “all people.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And in Isaac he established, because of Abraham his father
  simplified_phrase: Because of Isaac’s father Abraham, he established through Isaac
  preserved_meaning: The covenant was established in or through Isaac because of Abraham.
  reasoning_layer_used: POB lexical decisions and Greek parallel
  rationale: The reordered clause is easier to follow, and “through Isaac” preserves the source-supported sense of “in Isaac.”
- pob_phrase: a covenant with every firstborn
  simplified_phrase: a covenant with every firstborn
  preserved_meaning: The difficult Hebrew reading remains the controlling wording.
  reasoning_layer_used: POB textual and lexical decisions
  rationale: The phrase is retained because simplifying it would erase the documented Hebrew-Greek ambiguity.
- pob_phrase: the blessing rested on the head of Israel
  simplified_phrase: The blessing came to rest on the head of Israel
  preserved_meaning: The concrete image presents blessing as settling upon Israel.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: A separate sentence clarifies the movement while preserving the Hebrew image and the name “Israel.”
translation_notes:
  risk_flags:
  - risk: The Hebrew is textually difficult around “son” and “covenant.”
    mitigation: A textual footnote states why the POB follows “covenant.”
  - risk: Israel may evoke both Jacob and the people descended from him.
    mitigation: The main text keeps the proper name without resolving the ambiguity.
