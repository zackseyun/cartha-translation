translation:
  language: en
  text: There were national leaders skilled in planning, rulers who investigated matters,[a] people wise in speech, as their writings showed,[b] and governors serving at their appointed posts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel instead emphasizes understanding in the scribal administration of the people; this translation follows the Hebrew.
    reason: alternative_reading
  - marker: b
    text: Some Hebrew witnesses read “in their books” rather than “through their writings”; both readings point to literary wisdom.
    reason: textual_variant
simplification_decisions:
- pob_phrase: leaders of nations in their planning
  simplified_phrase: national leaders skilled in planning
  preserved_meaning: The leaders are distinguished by their ability to plan.
  reasoning_layer_used: Hebrew lexical decisions for שרי גוים and במזמתם
  rationale: The active description makes the compressed political phrase immediately clear.
- pob_phrase: rulers in their investigations
  simplified_phrase: rulers who investigated matters
  preserved_meaning: The rulers engage in searching inquiry.
  reasoning_layer_used: Doctrine-realigned lexical decision for במחקרותם
  rationale: The clause keeps the chosen inquiry sense without implying a particular kind of investigation.
- pob_phrase: wise in discourse through their writings
  simplified_phrase: people wise in speech, as their writings showed
  preserved_meaning: Their writings provide evidence of their wisdom in expression.
  reasoning_layer_used: Lexical decisions for חכמי שיח and בספרתם
  rationale: This avoids adding an act of sharing while preserving both expressive and literary wisdom.
interpretive_expansions:
- pob_phrase: governors in their watches
  rendering: governors serving at their appointed posts
  claim: Their watches are understood as assigned places or periods of public service.
  evidence:
  - The POB lexical rationale includes appointed service and office-related senses for משמרת.
  confidence: moderate
  alternatives_preserved:
  - governors at their watches
  - governors serving in their assigned duties
translation_notes:
  risk_flags:
  - risk: “As their writings showed” presents the writings as evidence of wisdom rather than leaving the relationship implicit.
    mitigation: The wording preserves the POB’s instrumental “through their writings” without adding communication or distribution.
  - risk: “Appointed posts” may favor administrative service over literal guard duty.
    mitigation: The retained idea of assigned service leaves room for civic, administrative, or guard-related work.
