  rationale: This expresses the abstract verb in direct, common English.
- pob_phrase: he set him over the tribes
  simplified_phrase: He placed him over the tribes
  preserved_meaning: He was appointed to a position over the tribes.
  reasoning_layer_used: The lexical decision and final doctrinal revision preserve the relationship expressed by “over.”
  rationale: “Placed” is clearer here while retaining the chosen authority framing.
- pob_phrase: as twelve divisions
  simplified_phrase: arranged as twelve divisions
  preserved_meaning: The tribal arrangement was constituted in twelve parts.
  reasoning_layer_used: The compressed Hebrew and the Greek parallel support a division among the tribes into twelve.
  rationale: “Arranged” makes the resultative relationship clear without implying divisions within each tribe.
