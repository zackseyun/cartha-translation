translation:
  language: en
  text: He kept the commandments of the Most High and entered into a covenant with him. In his own flesh, he made a cut as a statute.[a][b] When he was tested, he proved faithful.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The cut in his flesh likely refers to circumcision, the bodily sign of Abraham’s covenant.
    reason: cross_reference
  - marker: b
    text: The Hebrew reads “statute,” while the Greek parallel reads “covenant.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: who kept the commandments of the Most High and entered into covenant with him
  simplified_phrase: He kept the commandments of the Most High and entered into a covenant with him.
  preserved_meaning: Abraham obeyed the Most High and entered a covenant relationship with him.
  reasoning_layer_used: POB lexical decisions and immediate context
  rationale: A complete sentence improves readability while retaining the divine title and covenant language.
- pob_phrase: In his flesh he cut for him a statute
  simplified_phrase: In his own flesh, he made a cut as a statute.
  preserved_meaning: The statute involved a concrete cut in Abraham’s body without specifying the exact logical relation.
  reasoning_layer_used: Hebrew wording, POB lexical rationale, and theological decision
  rationale: This preserves the bodily cutting image and “statute” without adding an unsupported means-to-end claim.
- pob_phrase: in testing he was found faithful
  simplified_phrase: When he was tested, he proved faithful.
  preserved_meaning: The test showed that Abraham was faithful.
  reasoning_layer_used: POB lexical decision
  rationale: An ordinary time clause expresses the same result more naturally.
translation_notes:
  risk_flags:
  - risk: “As a statute” remains unusual because the Hebrew clause is compressed and its internal relation is uncertain.
    mitigation: The wording keeps the relation open, while footnote a gives the likely circumcision reference cautiously.
  - risk: The Hebrew and Greek differ between “statute” and “covenant.”
    mitigation: The main text follows the Hebrew, and footnote b preserves the Greek reading.
