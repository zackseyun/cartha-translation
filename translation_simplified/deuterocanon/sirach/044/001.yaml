  preserved_meaning: Faithful love, including loyalty and kindness, characterizes these men.
  reasoning_layer_used: Hebrew lexical decision and theological decision
  rationale: “Known for” makes the Hebrew description natural without asserting specific acts.
- pob_phrase: in their generations
  simplified_phrase: from generations past
  preserved_meaning: These fathers belonged to earlier historical generations.
  reasoning_layer_used: Hebrew lexical decision
  rationale: The clearer time phrase preserves the Hebrew plural while avoiding an awkward idiom.
