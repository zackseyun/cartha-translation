simplification_decisions:
- pob_phrase: With their offspring their good endures faithfully
  simplified_phrase: Their good remains firmly established with their descendants
  preserved_meaning: Their broadly defined good continues securely with later generations.
  reasoning_layer_used: Hebrew lexical decisions and doctrine realignment
  rationale: This recasts the terse clause while retaining the breadth of “good,” the firmness of its endurance, and the chosen relation “with.”
- pob_phrase: their inheritance is for their children's children
  simplified_phrase: Their inheritance passes on to their children’s children
  preserved_meaning: Their inheritance continues through multiple generations.
  reasoning_layer_used: Hebrew lexical decisions for ונחלתם and לבני בניהם
  rationale: The active wording clarifies intergenerational transfer without limiting the descendants to males.
interpretive_expansions:
- pob_phrase: their inheritance is for
  rendering: Their inheritance passes on to
  claim: The inheritance continues from one generation to the next.
  evidence:
