translation:
  language: en
  text: Their good remains firmly established with their descendants.[a] Their inheritance passes on to their children’s children.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek reads, “Their offspring stood in the covenants, and their children because of them.” The older Masada Hebrew text also has a covenant-focused reading.
