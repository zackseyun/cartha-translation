translation:
  language: en
  text: Some of them are no longer remembered. They passed away as though they had never existed, and the same thing happened to their children after them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is shorter and compressed; the Greek parallel includes the fuller wording about never having existed and their children.
    reason: textual_variant
simplification_decisions:
- pob_phrase: And there are some for whom there is no remembrance
  simplified_phrase: Some of them are no longer remembered
  preserved_meaning: A group among the ancestors has been forgotten.
  reasoning_layer_used: Hebrew lexical decision for זכר
  rationale: The active wording expresses the abstract idea of having no remembrance in common English.
- pob_phrase: they ceased to be, just as they had ceased, as though they had never existed
  simplified_phrase: They passed away as though they had never existed
  preserved_meaning: They came to an end and disappeared from memory as if they had never lived.
  reasoning_layer_used: Hebrew cessation language clarified by the Greek parallel
  rationale: This removes the awkward repetition while preserving both death and the image of total disappearance.
- pob_phrase: and so did their children after them
  simplified_phrase: and the same thing happened to their children after them
  preserved_meaning: Their descendants shared the same fate of passing away without remembrance.
  reasoning_layer_used: Greek parallel lexical decision
  rationale: The explicit clause makes the POB comparison immediately understandable without adding a new outcome.
translation_notes:
  risk_flags:
  - risk: The fuller wording about never existing and the children is absent from the shorter Hebrew witness.
    mitigation: The footnote identifies the Greek parallel as the source of the fuller form.
  - risk: “Passed away” may sound less forceful than “ceased to be.”
    mitigation: The image “as though they had never existed” retains the force of complete disappearance.
