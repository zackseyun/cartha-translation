simplification_decisions:
- pob_phrase: Men of valor
  simplified_phrase: Men of courage and ability
  preserved_meaning: The men are praised for strength, capability, and valor rather than merely wealth.
  reasoning_layer_used: Hebrew lexical decision for אנשי חיל
  rationale: The paired common terms make the phrase's broad commendatory sense immediately clear.
- pob_phrase: steadfast in strength
  simplified_phrase: firm in their strength
  preserved_meaning: Their strength was established and dependable.
  reasoning_layer_used: Hebrew lexical decision for וסמכי כח
  rationale: This removes the awkward abstraction while retaining settled strength.
- pob_phrase: at ease in their place
  simplified_phrase: settled in peace where they lived
  preserved_meaning: They enjoyed quiet, stable life in their established setting.
  reasoning_layer_used: Hebrew lexical decisions for ושוקטים and על מכונתם, checked against the Greek parallel
  rationale: The wording clearly conveys both peacefulness and a settled place without narrowing it to a building.
translation_notes:
  risk_flags:
  - risk: “Where they lived” may sound less concrete than “dwellings.”
    mitigation: “Settled” preserves the Hebrew sense of an established place while avoiding over-specification.
  - risk: The Greek may describe wealthy men rather than men of valor.
    mitigation: The footnote preserves that alternative while the main text follows the primary Hebrew witness.
