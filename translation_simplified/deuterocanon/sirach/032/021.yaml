translation:
  language: en
  text: Do not trust a path that can make you stumble.[a] Be on guard about your future.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult Hebrew word may describe a path that is slippery or treacherous, or that causes a fall.
    reason: lexical_alternative
  - marker: b
    text: The supplied Greek text appears to come from a different verse, so this translation follows the surviving Hebrew.
    reason: textual_variant
