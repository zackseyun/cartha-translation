  reasoning_layer_used: POB lexical decisions for בדרך and מחתף
  rationale: The active clause clarifies the difficult image without limiting it to “slippery” or “treacherous.”
- pob_phrase: in your end be on guard
  simplified_phrase: Be on guard about your future
  preserved_meaning: The command still calls for vigilance concerning the reader’s own eventual outcome.
  reasoning_layer_used: POB lexical decisions for ובאחריתך and השמר; grounding review
