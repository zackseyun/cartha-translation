translation:
  language: en
  text: Watch yourself[a] in everything you do, because whoever does this keeps the commandment.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “guard your soul” or “guard your life”; the Hebrew can refer to the whole self, soul, or life.
    reason: lexical_alternative
  - marker: b
    text: Or “keeps a commandment”; the singular may refer to God’s commandment in a general sense.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: In all your deeds guard yourself
  simplified_phrase: Watch yourself in everything you do
  preserved_meaning: The reader must remain morally vigilant over the whole self in every area of conduct.
  reasoning_layer_used: Lexical decisions for מעשיך, שמור, and נפשך
  rationale: The new wording replaces formal “deeds” and awkward clause order while preserving comprehensive self-watch.
- pob_phrase: the one who does this
  simplified_phrase: whoever does this
  preserved_meaning: The statement applies generically to any person who follows the instruction.
  reasoning_layer_used: Lexical and theological decision for עושה זה
  rationale: “Whoever” states the generic force more directly in common English.
- pob_phrase: for
  simplified_phrase: because
  preserved_meaning: The second clause gives the reason for the command.
  reasoning_layer_used: Lexical decision for כי
  rationale: “Because” makes the logical connection immediately clear to modern readers.
translation_notes:
  risk_flags:
  - risk: “Watch yourself” could be heard as a warning about physical danger.
    mitigation: “In everything you do” and the commandment clause keep the focus on moral conduct.
  - risk: The singular “commandment” may sound like one specific command.
    mitigation: The footnote preserves the possible generic sense and the alternative “a commandment.”
