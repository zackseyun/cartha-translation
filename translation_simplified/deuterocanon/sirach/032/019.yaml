  preserved_meaning: The emotional response follows the completed action.
  reasoning_layer_used: POB lexical decision for ואחר מעשיך
  rationale: A temporal clause is clearer than the abstract phrase “after your deeds.”
- pob_phrase: do not be regretful
  simplified_phrase: do not regret it
  preserved_meaning: The command warns against regret or self-reproach after acting.
  reasoning_layer_used: POB lexical decision for אל תתקצף
  rationale: This removes the unsupported intensity of “be filled” and follows the POB’s contextual judgment.
