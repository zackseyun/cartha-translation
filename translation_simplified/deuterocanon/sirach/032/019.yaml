  preserved_meaning: Do not undertake an action without advice or careful deliberation.
  reasoning_layer_used: POB lexical decisions for בלא עצה and אל תפעל
  rationale: The wording makes both audited senses of “counsel” clear in ordinary English.
- pob_phrase: after your deeds
