translation:
  language: en
  text: Do not act without seeking advice or thinking it through. After you act, do not regret it.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean, “do not become upset or angry” after you act.
    reason: lexical_alternative
