translation:
  language: en
  text: Elder, speak, for this is appropriate for you. Speak with good judgment,[a] but do not interfere with the singing.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The compressed Hebrew may also mean “show prudent restraint” or “be modest in your wisdom.”
    reason: lexical_alternative
  - marker: b
    text: 'The Greek has a substantially different reading: “The one offering fine flour repays a favor.”'
    reason: textual_variant
simplification_decisions:
- pob_phrase: Speak, elder, for it is fitting for you
