translation:
  language: en
  text: Anyone who seeks the law will come to understand it.[a] But anyone who only pretends to follow it will be caught by it.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek version has a substantially different verse about unjust sacrifice and the Lord judging without partiality.
    reason: textual_variant
  - marker: b
    text: The uncertain Hebrew may describe a pretender, a self-deceived person, or someone similarly insincere.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Whoever seeks the law will grasp it
  simplified_phrase: Anyone who seeks the law will come to understand it
  preserved_meaning: A sincere seeker successfully gains an understanding of the law.
  reasoning_layer_used: Lexical decisions for דורש, תורה, and יפיקנה
  rationale: “Come to understand” states the wisdom-context sense of “grasp” in familiar English.
- pob_phrase: the one who plays the hypocrite
  simplified_phrase: anyone who only pretends to follow it
  preserved_meaning: The person approaches the law with performative insincerity rather than genuine commitment.
  reasoning_layer_used: Lexical and theological decisions for ומתלהלה
  rationale: The wording explains the difficult idiom while the footnote preserves its uncertainty.
- pob_phrase: will be caught by it
  simplified_phrase: will be caught by it
  preserved_meaning: The same law sought by the sincere person traps the insincere person.
  reasoning_layer_used: Lexical decisions for יוקש and בו
  rationale: The clear source image and its ambiguous pronoun require no further simplification.
interpretive_expansions:
- pob_phrase: plays the hypocrite
  rendering: only pretends to follow it
  claim: The hypocrisy concerns an insincere posture toward the law.
  evidence:
