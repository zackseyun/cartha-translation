- pob_phrase: He who keeps the law guards his life
  simplified_phrase: By obeying the law, a person protects his life
  preserved_meaning: Careful observance of God’s law preserves the person who practices it.
  reasoning_layer_used: Hebrew lexical decisions for נוצר, תורה, and שומר נפשו
  rationale: “Obeying” makes “keeps” immediately clear while “protects his life” preserves the guarding image and its practical sense.
- pob_phrase: he who trusts in Yahweh
  simplified_phrase: Whoever trusts in the LORD
  preserved_meaning: The promise applies generally to anyone who relies on the covenant God.
  reasoning_layer_used: Theological decision on יהוה and lexical decision for בטח
  rationale: “Whoever” is natural modern English, and “the LORD” follows the project’s required divine-name rendering.
