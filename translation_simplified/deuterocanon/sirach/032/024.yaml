translation:
  language: en
  text: By obeying the law, a person protects his life. Whoever trusts in the LORD will not be put to shame.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek text has a substantially different saying here: “until he repays a person according to his deeds, and people’s works according to their thoughts.” The main text follows the surviving Hebrew.'
    reason: textual_variant
