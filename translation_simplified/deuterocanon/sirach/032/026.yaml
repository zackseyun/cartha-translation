translation:
  language: en
  text: When he[b] is in distress, mercy is beautiful[a]—like rain clouds during a drought.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “mercy is fitting.” The word can describe something as beautiful, pleasant, or appropriate.
    reason: lexical_alternative
  - marker: b
    text: The Greek says “he” in the general sense of any person in distress.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Mercy is beautiful in the time of his distress
  simplified_phrase: When he is in distress, mercy is beautiful
  preserved_meaning: Mercy is especially welcome and valuable when a person is suffering.
  reasoning_layer_used: POB lexical decisions for ὡραῖον, ἔλεος, θλίψεως, and αὐτοῦ
  rationale: The clause is reordered into natural English while retaining “mercy,” “beautiful,” “distress,” and the generic masculine pronoun.
- pob_phrase: like rain clouds in a time without rain
  simplified_phrase: like rain clouds during a drought
  preserved_meaning: Mercy in distress is compared to the welcome sight of rain-bearing clouds when rain is absent.
  reasoning_layer_used: POB lexical decisions for νεφέλαι ὑετοῦ and ἀβροχίας
  rationale: “During a drought” states the same condition more directly while preserving the rain-cloud image.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “he” as referring to a specific man rather than to anyone in distress.
    mitigation: Footnote b explains the Greek’s generic masculine usage.
  - risk: “Beautiful” may sound visual rather than expressing mercy’s welcome and fitting character.
    mitigation: Footnote a preserves the adjective’s range without weakening the main image.
