translation:
  language: en
  text: A wise man leans toward correction, but one who is easily led astray follows his own desires. A wise man does not hide his anger, but a mocker does not keep his tongue under control.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek reads: “He will not disregard an orphan’s plea or a widow when she pours out her complaint.” The surviving Hebrew differs substantially here.'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: will incline himself to reproof
  simplified_phrase: leans toward correction
  preserved_meaning: The wise man willingly turns toward firm correction.
  reasoning_layer_used: POB lexical decisions for יטה and תוכחות
  rationale: This keeps the physical image of leaning while using familiar words.
- pob_phrase: one who is deceived
  simplified_phrase: one who is easily led astray
  preserved_meaning: The person is vulnerable to deception and follows personal desire.
  reasoning_layer_used: POB lexical decision for נפתה
  rationale: This states the continuing vulnerability more clearly than a single completed deception.
- pob_phrase: a scoffer will not guard his tongue
  simplified_phrase: a mocker does not keep his tongue under control
  preserved_meaning: An insolent mocker fails to restrain his speech.
  reasoning_layer_used: POB lexical decisions for לץ and לא ישמר לשונו
  rationale: The wording is more common while retaining the tongue image and lack of restraint.
interpretive_expansions:
- pob_phrase: one who is deceived
  rendering: one who is easily led astray
  claim: The expression describes a person readily vulnerable to deception.
  evidence:
  - The POB lexical rationale identifies one who is easily led astray or naive.
  - The contrast with the wise man presents an enduring disposition.
  confidence: high
  alternatives_preserved:
  - one who is deceived
  - the gullible man
