translation:
  language: en
  text: Anyone who fears Yahweh will understand judgment.[a] From dawn,[b] they will bring wise sayings out of their heart.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some Hebrew witnesses read “his judgment.”
    reason: alternative_reading
  - marker: b
    text: The Hebrew is uncertain and may mean “early,” “at daybreak,” or possibly “at twilight.”
    reason: lexical_alternative
  - marker: c
    text: Another Hebrew form reads, “Those who fear Yahweh will understand his judgment, and with much wisdom they will bring it out of their heart.” The Greek has substantially different wording.
    reason: textual_variant
simplification_decisions:
- pob_phrase: One who fears Yahweh
  simplified_phrase: Anyone who fears Yahweh
  preserved_meaning: The representative singular still refers to every person who reveres Yahweh.
  reasoning_layer_used: lexical decision for ירא יהוה and theological decision for יהוה
  rationale: “Anyone” makes the general statement immediate while retaining Yahweh and the biblical concept of fearing him.
- pob_phrase: and from the dawn he will bring forth wise sayings from his heart
  simplified_phrase: From dawn, they will bring wise sayings out of their heart
  preserved_meaning: Wise speech emerges from within the person beginning at the uncertain time described by מנשף.
  reasoning_layer_used: lexical decisions for מנשף, יוציא, ובחכמות רבות, and מלבם
  rationale: A new sentence and common verb phrase clarify the line while preserving the image of wisdom coming out of the heart.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “judgment” only as condemnation rather than discernment or a judicial decision.
    mitigation: The wording retains POB’s deliberately broad choice because the unstable Hebrew does not justify narrowing it.
  - risk: “From dawn” may sound more certain than the Hebrew evidence allows.
    mitigation: The footnote preserves the possible senses “early,” “daybreak,” and “twilight.”
