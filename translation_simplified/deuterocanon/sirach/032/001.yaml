translation:
  language: en
  text: If you are chosen to lead the gathering,[a] do not act as though you are above the others. Be with them as one of them. Look after them, and only then recline at the meal.[b] Prepare what is needed before you take your own place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The opening words are uncertain: they are bracketed in Kahana’s edition of the surviving Hebrew. The surrounding lines support this meaning, though the Greek parallel differs substantially in wording.'
    reason: textual_variant
  - marker: b
    text: At formal meals in the ancient world, people commonly reclined at the table.
    reason: cultural_note
