translation:
  language: en
  text: A man's body does not last, but a name known for kindness will not disappear.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel reads, “the name of sinners will not be blotted out as good,” or possibly, “for good.” The Hebrew reads, “a name of kindness will not be cut off.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: A man's body is vanity
  simplified_phrase: A man's body does not last
  preserved_meaning: The human body is fleeting and insubstantial.
  reasoning_layer_used: Hebrew lexical decision for הבל and its stated sense of transience
  rationale: This explains the difficult wisdom term without suggesting that the body is worthless.
- pob_phrase: a gracious name
  simplified_phrase: a name known for kindness
  preserved_meaning: A person's name carries a reputation for kindness.
  reasoning_layer_used: Hebrew lexical decisions for שם and חסד
  rationale: This keeps the biblical term “name” while clarifying its reputational sense.
- pob_phrase: will not be cut off
  simplified_phrase: will not disappear
  preserved_meaning: The good name will endure rather than perish.
  reasoning_layer_used: Hebrew lexical decision for לא יכרת
  rationale: This states the force of the Hebrew idiom naturally without claiming absolute temporal permanence.
interpretive_expansions:
- pob_phrase: a gracious name
  rendering: a name known for kindness
  claim: The name refers to a reputation characterized by kindness.
  evidence:
  - The POB lexical rationale says “name” naturally carries the sense of reputation here.
  - The Hebrew חסד positively qualifies the enduring name.
  confidence: high
  alternatives_preserved:
  - gracious name
  - a name of kindness
translation_notes:
  risk_flags:
  - risk: “Will not disappear” does not preserve the literal cutting image.
    mitigation: It preserves the documented sense of enduring rather than perishing, while the footnote retains the Hebrew idiom.
  - risk: The Greek parallel differs substantially from the Hebrew second clause.
    mitigation: The main text follows the validated Hebrew witness, and the Greek reading remains in the footnote.
