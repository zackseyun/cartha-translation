translation:
  language: en
  text: O death, how bitter it is for a man to think of you when he lives securely with what he has,[a] free from trouble, successful in everything, and still strong enough to enjoy pleasure.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew wording is uncertain; the Greek supports the sense of living peacefully and securely with what one has.
    reason: textual_variant
  - marker: b
    text: The Hebrew says “pleasure,” while the Greek more specifically says “food.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: how bitter is your remembrance
  simplified_phrase: how bitter it is for a man to think of you
  preserved_meaning: The thought of death is bitter, rather than death merely being called bitter in the abstract.
  reasoning_layer_used: POB lexical decision on Hebrew זכרך and Greek μνημόσυνον
  rationale: This replaces the formal noun “remembrance” with ordinary English while preserving the direct address.
- pob_phrase: at ease in his possessions
  simplified_phrase: lives securely with what he has
  preserved_meaning: The man lives peacefully and securely with his means.
  reasoning_layer_used: POB lexical decision informed by the Greek parallel
  rationale: This clarifies the uncertain phrase without claiming more precision than the witnesses allow.
- pob_phrase: to a man untroubled and prospering in everything
  simplified_phrase: free from trouble, successful in everything
  preserved_meaning: The man is undisturbed and broadly prosperous.
  reasoning_layer_used: POB lexical decisions on Hebrew שליו and ומצליח בכל
  rationale: This uses familiar wording and fits the qualities into one clear sentence.
translation_notes:
  risk_flags:
  - risk: “Think of you” is less literary than “your remembrance.”
    mitigation: The direct address and the focus on remembering death remain explicit.
  - risk: The Hebrew and Greek differ between “pleasure” and “food.”
    mitigation: The main text follows the POB’s broader Hebrew-based wording, while the footnote preserves the Greek alternative.
