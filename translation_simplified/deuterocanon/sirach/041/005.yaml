translation:
  language: en
  text: The children of despised people are something evil,[a][c] and a fool’s descendants live in fear of wicked people.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew of the first line is difficult; the Greek reads more like, “The children of sinners are detestable children.”
    reason: alternative_reading
  - marker: b
    text: 'The Greek differs in the second line: “They keep company in the dwellings of the ungodly.”'
    reason: alternative_reading
  - marker: c
    text: The older Masada manuscript is fragmentary here, so the readable wording comes mainly from the Cairo Geniza Hebrew.
    reason: textual_variant
simplification_decisions:
- pob_phrase: The children of the despised are an evil thing
  simplified_phrase: The children of despised people are something evil
  preserved_meaning: The line keeps the Hebrew’s harsh negative judgment while identifying “the despised” as people.
  reasoning_layer_used: POB lexical decisions for נמאס and דבר רעים
  rationale: Common wording replaces an opaque nominal expression without resolving the difficult Hebrew further.
- pob_phrase: the offspring of a fool
  simplified_phrase: a fool’s descendants
  preserved_meaning: The phrase still refers broadly to a fool’s posterity rather than only one generation.
  reasoning_layer_used: POB lexical decisions for נכד and אויל
  rationale: The possessive form is easier to read, while “descendants” preserves the broad generational sense.
- pob_phrase: are in the terror of the wicked
  simplified_phrase: live in fear of wicked people
  preserved_meaning: The descendants remain under fear associated with those who are morally wicked.
  reasoning_layer_used: POB lexical decisions for מגור and רשע
  rationale: The English idiom makes the fearful condition and the collective sense of “the wicked” clear.
interpretive_expansions:
- pob_phrase: are in the terror of the wicked
  rendering: live in fear of wicked people
  claim: The Hebrew describes fear as the descendants’ condition in relation to wicked people.
  evidence:
  - The POB renders מגור as “terror” and treats רשע collectively as “the wicked.”
  - The POB lexical rationale allows “fear” as a less intense English equivalent.
  confidence: moderate
  alternatives_preserved:
  - The Greek alternative about keeping company with the ungodly remains in footnote b.
translation_notes:
  risk_flags:
  - risk: The first Hebrew line is difficult and textually unstable.
    mitigation: The draft follows the POB’s Hebrew-led meaning and retains the Greek alternative and manuscript note.
  - risk: “Live in fear of” is more idiomatic and slightly more explicit than the Hebrew construction.
    mitigation: The wording preserves fear as a condition without specifying its cause beyond the POB’s phrase “of the wicked.”
