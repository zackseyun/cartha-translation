translation:
  language: en
  text: If wisdom is kept hidden and treasure is kept out of sight, what good is either one?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek version begins with, “Keep instruction in peace, children.” The Hebrew used here begins with the statement about hidden wisdom.
    reason: textual_variant
simplification_decisions:
- pob_phrase: Hidden wisdom and a concealed treasure
  simplified_phrase: If wisdom is kept hidden and treasure is kept out of sight
  preserved_meaning: Both wisdom and treasure provide no benefit while they remain concealed.
  reasoning_layer_used: Hebrew lexical decisions and Greek consistency check
  rationale: The rewrite keeps the two valuable things and the repeated image of concealment in ordinary English.
- pob_phrase: what benefit is there in either of them?
  simplified_phrase: what good is either one?
  preserved_meaning: The rhetorical question asks what practical value either hidden thing has.
  reasoning_layer_used: POB lexical decision for מה תועלה and בשתיהם
  rationale: “What good” expresses practical benefit more directly for common readers.
interpretive_expansions:
- pob_phrase: Hidden wisdom and a concealed treasure—what benefit is there in either of them?
  rendering: If wisdom is kept hidden and treasure is kept out of sight, what good is either one?
  claim: Their hidden condition is why neither provides practical benefit.
  evidence:
  - The Hebrew describes both wisdom and treasure as hidden before asking their benefit.
  - The POB rationale says both are useless when not brought forth.
  confidence: high
  alternatives_preserved:
  - The wording does not say why either one was hidden.
  external_witnesses:
  - The Greek parallel likewise joins hidden wisdom and unseen treasure to the question of benefit.
translation_notes:
  risk_flags:
  - risk: The conditional wording makes the proverb’s implied logic explicit.
    mitigation: It adds no cause beyond the hidden condition already linked to the rhetorical question.
