translation:
  language: en
  text: Everything that comes from nothing returns to nothing. In the same way, ungodly people go from emptiness to emptiness.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A substantially different Greek form reads: “Everything that is from earth goes away to earth; so the ungodly go from a curse to destruction.”'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Everything from nothing returns to nothing
  simplified_phrase: Everything that comes from nothing returns to nothing
  preserved_meaning: All that originates from nothing goes back to nothing.
  reasoning_layer_used: Hebrew syntax and lexical decisions for מאפס, אל אפס, and ישוב
  rationale: Adding “that comes” turns the compressed proverb into a complete natural-English clause.
- pob_phrase: so the ungodly
  simplified_phrase: In the same way, ungodly people
  preserved_meaning: The second statement directly compares impious people with the first statement.
  reasoning_layer_used: Lexical and theological decisions for כן and חנף
  rationale: The fuller wording makes the comparison and its subject immediately clear.
translation_notes:
  risk_flags:
  - risk: “From nothing” may sound like a broad philosophical claim about creation.
    mitigation: The phrase remains because the Hebrew and POB deliberately preserve the proverb’s stark repetition.
  - risk: The surviving Greek has materially different imagery.
    mitigation: Its alternate form is preserved in a footnote rather than blended with the Hebrew.
