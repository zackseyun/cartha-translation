translation:
  language: en
  text: Do not fear that your death has been appointed.[a] Remember that those who lived before you and those who will live after you share this fate with you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew wording is compressed; the Greek parallel speaks of “the judgment of death.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the decree of your death
  simplified_phrase: that your death has been appointed
  preserved_meaning: Death is presented as an appointed or decreed end, not merely as death in general.
  reasoning_layer_used: POB lexical and theological decisions informed by the Hebrew and Greek parallel
  rationale: The verbal form makes the appointed sense clear without dropping the POB’s controlling choice.
- pob_phrase: those before and those after
  simplified_phrase: those who lived before you and those who will live after you
  preserved_meaning: Both earlier and later people are included.
  reasoning_layer_used: POB lexical decision on ראשנים ואחרנים
  rationale: The fuller wording makes the temporal contrast immediately understandable.
- pob_phrase: are with you
  simplified_phrase: share this fate with you
  preserved_meaning: People of every time share the same mortality.
  reasoning_layer_used: POB footnote and lexical rationale on עמך
  rationale: The contextual meaning replaces an otherwise unclear metaphor.
interpretive_expansions:
- pob_phrase: are with you
  rendering: share this fate with you
  claim: Earlier and later people share the same mortal fate as the person addressed.
  evidence:
  - POB footnote b explicitly explains the phrase as a fate shared by earlier and later people.
  - The immediate context identifies death as the fate under discussion.
  confidence: high
