translation:
  language: en
  text: 'A lesson about shame: Listen, sons,[a] and be ashamed in keeping with my judgments. Not all shame is right to hold on to, and not every disgrace is a right choice.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sons” preserves the wisdom teacher’s masculine form of address.
    reason: cultural_note
  - marker: b
    text: The Greek reads, “It is not good to preserve every shame, and not everything is approved by all in faith.” Its final clause differs notably from the Hebrew.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Instruction in shame
  simplified_phrase: A lesson about shame
  preserved_meaning: The heading introduces formative teaching concerning shame.
  reasoning_layer_used: Lexical decision for מוסר
  rationale: “Lesson about” expresses wisdom instruction in familiar English.
- pob_phrase: hear, sons
  simplified_phrase: Listen, sons
  preserved_meaning: The teacher directly calls his male pupils to pay attention.
  reasoning_layer_used: Lexical and theological decisions for שמעו בנים
  rationale: “Listen” is natural English, while “sons” retains the gendered address.
- pob_phrase: Not every shame is fitting to keep, and not every disgrace is rightly chosen
  simplified_phrase: Not all shame is right to hold on to, and not every disgrace is a right choice
  preserved_meaning: Some shame should be retained, but not every form of disgrace should be chosen or approved.
  reasoning_layer_used: Lexical decisions for לא כל בשת נאה לשמור and ולא כל הכלם נבחר
  rationale: The wording preserves both the keeping and choosing images without the POB’s awkward phrasing.
translation_notes:
  risk_flags:
  - risk: Modern readers may assume that shame is always harmful.
    mitigation: The contrast preserves the teaching that shame can be appropriate or inappropriate.
  - risk: “A right choice” may sound more active than the Hebrew sense of approved or preferable.
    mitigation: The phrase retains the source’s selection image while keeping its ethical force clear.
