  rationale: This explains “woe” without adding a future time frame.
- pob_phrase: who have abandoned
  simplified_phrase: who have abandoned
  preserved_meaning: The relative clause identifies the men by their deliberate rejection of the law.
  reasoning_layer_used: Lexical decision and relative-clause rationale
  rationale: Keeping the relative clause avoids turning its explanatory link into an explicit causal claim.
- pob_phrase: the law of the Most High
