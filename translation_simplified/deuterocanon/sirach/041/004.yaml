translation:
  language: en
  text: This is the fate God has given every mortal.[a] So why reject what the Most High has decreed?[b] Whether a person lives a thousand years, a hundred, or ten,[c] in Sheol there is no reproof concerning life.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “from God”; the Greek parallel says “from the Lord.”
    reason: alternative_reading
  - marker: b
    text: The difficult Hebrew reads “the law of the Most High,” while the Greek parallel reads “the good pleasure of the Most High”; “decreed” reflects both in this context.
    reason: alternative_reading
  - marker: c
    text: The Hebrew number sequence is difficult; the Greek parallel reads “ten, a hundred, or a thousand years.”
    reason: textual_variant
  - marker: d
    text: The Greek parallel has “Hades,” while the Hebrew supports “Sheol,” the realm of the dead; the difficult final phrase can also be rendered “there is no rebuke of life in Sheol.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the lot of all flesh from God
  simplified_phrase: the fate God has given every mortal
  preserved_meaning: Mortality is the God-given fate shared by all humanity.
  reasoning_layer_used: POB lexical decisions on חלק כל בשר and מאל
  rationale: “Every mortal” explains the idiom “all flesh” while keeping God as the source.
- pob_phrase: the decree of the Most High
  simplified_phrase: what the Most High has decreed
  preserved_meaning: The divine determination should not be rejected.
  reasoning_layer_used: POB lexical and theological decisions on בתורת עליון
  rationale: The verbal form is natural English and retains the mediating sense of “decree.”
- pob_phrase: there is no rebuke of life in Sheol
  simplified_phrase: in Sheol there is no reproof concerning life
  preserved_meaning: Sheol has no reproof or reckoning concerning life, though the phrase remains difficult.
  reasoning_layer_used: POB lexical rationale on איש תוכחות בשאול חיים
  rationale: “Concerning life” improves readability without deciding the exact force of “reproof.”
