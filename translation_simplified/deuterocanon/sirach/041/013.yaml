translation:
  language: en
  text: The good things of life last only a limited number of days, but a good name lasts for days beyond counting.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Greek: “A good name will remain forever.”'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: The good of life is a limited number of days
  simplified_phrase: The good things of life last only a limited number of days
  preserved_meaning: Life's goodness and benefits are confined to a countable lifespan.
  reasoning_layer_used: Lexical decisions for טובת חי and ימי מספר
  rationale: This wording clarifies the difficult noun phrase without treating life as actively producing benefits.
- pob_phrase: the good of a name
  simplified_phrase: a good name
  preserved_meaning: A person's good reputation or remembered honor endures.
  reasoning_layer_used: Lexical decision for שם and POB footnote b
  rationale: “Good name” retains the source image and avoids narrowing it to an already honored name.
- pob_phrase: days without number
  simplified_phrase: days beyond counting
  preserved_meaning: A good name endures beyond the limited days of life.
  reasoning_layer_used: Lexical and theological decision for ימי אין מספר
  rationale: The natural idiom preserves the Hebrew contrast while the footnote records the Greek interpretation.
interpretive_expansions:
- pob_phrase: the good of a name is days without number
  rendering: a good name lasts for days beyond counting
  claim: The second clause describes the enduring duration of a good reputation.
  evidence:
  - The Hebrew contrasts countable days with days that cannot be counted.
  - The Greek parallel explicitly says that a good name remains forever.
  - POB explains “name” as reputation or remembered honor.
  confidence: high
  alternatives_preserved:
  - the good of a name
  - a good reputation
  - a good name will remain forever
translation_notes:
  risk_flags:
  - risk: “Lasts” makes the duration relationship more explicit than the compressed Hebrew wording.
    mitigation: The Hebrew contrast and Greek parallel both support an enduring-duration sense.
  - risk: “Days beyond counting” may suggest immense duration rather than strict eternity.
    mitigation: It preserves the primary Hebrew idiom, while the footnote supplies the Greek reading “forever.”
