  rationale: This recasts the difficult Hebrew-based structure in natural English without adopting the Greek plural.
- pob_phrase: disgrace is always with his offspring
  simplified_phrase: disgrace remains with his descendants
  preserved_meaning: Public shame continues among the unjust person’s later family line.
  reasoning_layer_used: Hebrew lexical decisions for וריש עם, זרעו, and תמיד, clarified by the Greek parallel
  rationale: “Remains” expresses ongoing duration, while “descendants” makes the family reference clear.
