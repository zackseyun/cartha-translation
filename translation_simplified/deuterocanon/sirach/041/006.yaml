translation:
  language: en
  text: Evil rule comes from an unjust person, and disgrace remains with his descendants.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Hebrew is difficult here. The Greek reads, “The inheritance of sinners’ children will perish, and reproach will continue with their offspring.” Both point to lasting disgrace for the descendants of the unjust.
    reason: alternative_reading
