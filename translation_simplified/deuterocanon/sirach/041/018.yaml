translation:
  language: en
  text: Be ashamed when you tell a lie in front of a master and mistress,[a] when you commit a transgression before an assembly and the people, when you commit wrongdoing before a companion and a friend, and when you steal where you live.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew has “master and mistress”; the Greek parallel has “judge and ruler.”
    reason: textual_variant
  - marker: b
    text: The final Hebrew phrase is difficult; the Greek parallel supports the meaning “steal.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: Before a master and mistress, be ashamed of a lie
  simplified_phrase: Be ashamed when you tell a lie in front of a master and mistress
  preserved_meaning: Lying in the presence of a master and mistress is a cause for shame.
  reasoning_layer_used: Hebrew lexical decisions for מאדון וגברת and על שקר
  rationale: A direct verbal clause makes the command clear while preserving the Hebrew pair.
- pob_phrase: before an assembly and the people, of transgression
  simplified_phrase: when you commit a transgression before an assembly and the people
  preserved_meaning: Transgression before the gathered community is shameful.
  reasoning_layer_used: Hebrew lexical decisions for מעדה ועם and על פשע
  rationale: The added verb clarifies the compressed list without weakening “transgression.”
- pob_phrase: before a companion and a friend, of wrongdoing; and where you sojourn, of theft
  simplified_phrase: when you commit wrongdoing before a companion and a friend, and when you steal where you live
  preserved_meaning: One should be ashamed of wrongdoing before close associates and of stealing where one lives.
  reasoning_layer_used: Hebrew lexical decisions for מחבר ורע, מעל, ממקום תגור, and the Greek-supported reading of זר
  rationale: Finite clauses and “where you live” improve readability while keeping the people as witnesses rather than victims.
translation_notes:
  risk_flags:
  - risk: The final Hebrew wording is uncertain, so “steal” is more specific than the surviving Hebrew alone permits.
    mitigation: The text follows POB’s Greek-supported decision and notes the uncertainty in a footnote.
