translation:
  language: en
  text: Do not say, “I have sinned, but nothing has happened to me,” just because God is patient.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “God is slow to anger.”
    reason: lexical_alternative
  - marker: b
