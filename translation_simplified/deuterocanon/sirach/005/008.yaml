    mitigation: The Hebrew controls the main text, and the Greek remains in a textual-variant footnote.
  - risk: “Very merciful” renders the plural “mercies” as an English quality.
    mitigation: The wording preserves the audited sense of abundant divine compassion without adding temporal repetition.
