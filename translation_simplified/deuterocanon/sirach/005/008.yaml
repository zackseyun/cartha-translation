translation:
  language: en
  text: And you said, “He is very merciful. He will forgive my many wrongs.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek parallel has a different warning: “Do not rely on wealth gained by wrongdoing, for it will not help you when the time of visitation or calamity comes.” The surviving Hebrew instead warns against presuming on God’s mercy.'
    reason: textual_variant
simplification_decisions:
- pob_phrase: His mercies are many
  simplified_phrase: He is very merciful
  preserved_meaning: God’s mercy is abundant.
  reasoning_layer_used: POB lexical decisions for רַחֲמָיו and רַבִּים
  rationale: This states the Hebrew idiom plainly without adding a past-time emphasis.
- pob_phrase: for the multitude of my iniquities he will forgive
  simplified_phrase: He will forgive my many wrongs
  preserved_meaning: The speaker expects forgiveness for numerous serious offenses.
  reasoning_layer_used: POB lexical decisions for לְרֹב, עֲוֹנוֹתַי, and יִסְלָח
  rationale: The direct clause order keeps the number, moral fault, and expected forgiveness clear.
translation_notes:
  risk_flags:
