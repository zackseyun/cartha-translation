translation:
  language: en
  text: Do not rely on being forgiven as a reason to keep piling one sin on another.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel says, “Do not delay turning to the Lord or put it off from day to day. The Lord’s wrath will suddenly come, and at the time of punishment you will perish.” The surviving Hebrew is shorter and warns against relying on forgiveness while continuing to sin.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: rely on forgiveness
  simplified_phrase: rely on being forgiven
  preserved_meaning: The warning concerns presuming that one will receive pardon.
  reasoning_layer_used: Lexical decision for סְלִיחָה and theological decision on divine forgiveness
  rationale: The verbal form is easier to understand while keeping forgiveness as the object of reliance.
- pob_phrase: to add sin to sin
  simplified_phrase: as a reason to keep piling one sin on another
  preserved_meaning: Presumed forgiveness becomes a basis for continuing to commit offenses.
  reasoning_layer_used: Hebrew infinitive linkage and lexical decision for עָוֹן עַל עָוֹן
  rationale: The wording makes the logical link clear and preserves the image of sins accumulating.
interpretive_expansions:
- pob_phrase: to add sin to sin
  rendering: as a reason to keep piling one sin on another
  claim: The verse warns against treating expected forgiveness as grounds for continued sin.
  evidence:
  - The Hebrew infinitive links reliance on forgiveness with adding further sin.
  - The POB theological decision identifies presumptuous continuation in wrongdoing as the controlling sense.
  - The Greek parallel supports this by warning against delaying repentance.
  confidence: high
  alternatives_preserved:
  - A more general warning against overconfidence about pardon remains possible but is less specific.
