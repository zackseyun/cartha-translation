translation:
  language: en
  text: Do not rely on wealth that was gained dishonestly or may prove unreliable. It will not help you when the day of wrath comes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek tradition has a very different verse: “If you have understanding, answer your neighbor; but if not, put your hand over your mouth.” This translation follows the surviving Hebrew.'
    reason: textual_variant
simplification_decisions:
- pob_phrase: trust in deceitful wealth
  simplified_phrase: rely on wealth that was gained dishonestly or may prove unreliable
  preserved_meaning: Wealth associated with falsehood may be fraudulent in origin or unreliable in effect.
  reasoning_layer_used: POB lexical decision and footnote b
  rationale: The wording makes both documented senses clear without choosing only one.
- pob_phrase: will not profit
  simplified_phrase: will not help you
  preserved_meaning: Such wealth will provide no benefit or protection.
  reasoning_layer_used: POB lexical decision for לֹא יוֹעִילוּ
  rationale: Common wording states the practical result while retaining the warning.
- pob_phrase: in the day of wrath
  simplified_phrase: when the day of wrath comes
  preserved_meaning: A coming time of wrath and reckoning is in view without naming its source.
  reasoning_layer_used: POB theological decision for עֶבְרָה
  rationale: The recast phrase is natural English while preserving the judicial force of “wrath.”
