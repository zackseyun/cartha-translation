translation:
  language: en
  text: Do not follow your heart and your eyes when they lead you to evil desires.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek version has a substantially different verse: “Do not say, ‘Who will overpower me?’ For the Lord will surely take vengeance on you.” This translation follows the Hebrew text.'
    reason: textual_variant
simplification_decisions:
- pob_phrase: Do not go after
  simplified_phrase: Do not follow
  preserved_meaning: The command forbids allowing personal desire and attraction to guide one’s conduct.
  reasoning_layer_used: POB lexical decision for אַל תֵּלֵךְ with אַחֲרֵי
  rationale: “Follow” states the Hebrew idiom in natural modern English.
- pob_phrase: to walk in evil desires
  simplified_phrase: when they lead you to evil desires
  preserved_meaning: The heart and eyes can direct a person toward a course governed by morally evil desires.
  reasoning_layer_used: POB lexical and theological decisions for לָלֶכֶת בַּחֲמוּדוֹת רָעָה
  rationale: The recast clause makes the relationship clear without treating evil desires as merely a location.
interpretive_expansions:
- pob_phrase: after your heart and your eyes, to walk in evil desires
  rendering: your heart and your eyes when they lead you to evil desires
  claim: The heart and eyes represent inward desire and outward attraction that can guide a person toward evil desires.
  evidence:
  - The POB rationale identifies the heart as inward desire and the eyes as outward attraction.
  - The Hebrew verbal sequence connects following the heart and eyes with walking in evil desires.
  confidence: high
  alternatives_preserved:
  - The concrete images “heart” and “eyes” remain in the main text.
  - “Evil desires” retains the POB’s chosen moral sense.
