translation:
  language: en
  text: The same applies to anyone who keeps company with an insolent man and rolls around in that man’s sins.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek has a substantially different line: “If evil comes upon you, you will find him there ahead of you, and as one helping, he will trip up your heel.” The surviving Hebrew instead gives the warning in the main text.'
    reason: alternative_reading
