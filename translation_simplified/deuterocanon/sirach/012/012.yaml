translation:
  language: en
  text: Treat him with the same caution you would show someone who reveals secrets. Then he will find no way to ruin you. Understand where jealousy leads.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jealousy may also be translated “envy.”
    reason: lexical_alternative
  - marker: b
    text: The Greek version gives a fuller warning, but this translation follows the surviving Hebrew.
    reason: source_note
simplification_decisions:
- pob_phrase: Be to him like one who reveals a secret
  simplified_phrase: Treat him with the same caution you would show someone who reveals secrets
  preserved_meaning: The reader must deal guardedly with this person as with someone who exposes confidential matters.
  reasoning_layer_used: POB lexical rationale and footnote a
  rationale: The rewrite states the simile’s likely practical force while preserving its image.
- pob_phrase: he will not find a way to ruin you
  simplified_phrase: he will find no way to ruin you
  preserved_meaning: Caution prevents the hostile person from gaining an opportunity to cause serious harm.
  reasoning_layer_used: POB lexical decisions for וְלֹא יִמְצָא and לְהַשְׁחִיתְךָ
  rationale: This natural phrasing keeps “ruin” without suggesting physical annihilation.
- pob_phrase: know the outcome of jealousy
  simplified_phrase: Understand where jealousy leads
  preserved_meaning: The reader must recognize jealousy’s eventual harmful result.
  reasoning_layer_used: POB lexical decisions for וְדַע, אַחֲרִית, and קִנְאָה
  rationale: The idiom becomes ordinary English while retaining the Hebrew imperative and outcome sense.
