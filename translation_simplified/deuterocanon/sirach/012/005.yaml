translation:
  language: en
  text: Do not give him food,[a] or he may use your gift to turn against you.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew wording is difficult; it literally refers to “items of bread,” while the Greek supports the general sense “food.”
    reason: lexical_alternative
  - marker: b
    text: Or “use your gift to gain power over you”; the Greek expresses this stronger sense.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: your bread
  simplified_phrase: food
  preserved_meaning: Material food given to the person remains the object of the warning.
  reasoning_layer_used: Lexical decision informed by the difficult Hebrew phrase and Greek parallel.
  rationale: “Food” gives the established contextual sense without retaining an unclear expression.
- pob_phrase: lest by it
  simplified_phrase: or he may use your gift
  preserved_meaning: The food given could become the means of harm to the giver.
  reasoning_layer_used: Hebrew instrumental pronoun clarified by the Greek warning clause.
  rationale: The revision states the connection in ordinary English and makes the pronoun’s reference clear.
- pob_phrase: he set himself against you
  simplified_phrase: to turn against you
  preserved_meaning: He may respond to the gift with hostility toward the giver.
  reasoning_layer_used: POB lexical decision favoring opposition without overstating domination.
  rationale: “Turn against you” is natural English while retaining the adversarial force.
interpretive_expansions:
- pob_phrase: by it
  rendering: use your gift
  claim: The food given may become the means by which the recipient harms the giver.
  evidence:
  - The Hebrew preposition marks the food as the means involved.
  - The Greek parallel presents the gift as enabling hostile power.
  confidence: high
  alternatives_preserved:
  - by it
  - use the food
  - gain power through it
translation_notes:
  risk_flags:
  - risk: “Food” does not preserve the Hebrew’s concrete bread wording in the main text.
    mitigation: Footnote a records the bread image and the textual difficulty.
  - risk: “Turn against you” may sound weaker than the Greek idea of domination.
    mitigation: Footnote b preserves the stronger Greek-supported alternative.
