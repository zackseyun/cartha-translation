translation:
  language: en
  text: If you do good for someone, know whom you are helping. Then there will be hope because of your kindness.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “there will be hope for your own well-being,” while the Greek says, “there will be thanks for your good deeds.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: If you do good
  simplified_phrase: If you do good for someone
  preserved_meaning: Doing good means benefiting another person.
  reasoning_layer_used: Hebrew lexical decision for תֵּטִיב and the following recipient phrase
  rationale: Adding “for someone” makes the implied recipient immediately clear.
- pob_phrase: know to whom you do good
  simplified_phrase: know whom you are helping
  preserved_meaning: Be aware of the person receiving your good deed.
  reasoning_layer_used: Hebrew lexical decisions for תֵּדַע and לְמִי
  rationale: “Helping” avoids unnatural repetition while preserving the command.
- pob_phrase: and there will be hope for your kindness
  simplified_phrase: Then there will be hope because of your kindness
  preserved_meaning: The kindness leads to an asserted prospect of a favorable outcome or response.
  reasoning_layer_used: POB resultative reading of וִיהִי and theological decision on תִקְוָה לְטוֹבָתָךְ
  rationale: “Then there will be” preserves the stated consequence without defining its exact form.
interpretive_expansions:
- pob_phrase: there will be hope for your kindness
  rendering: there will be hope because of your kindness
  claim: The hope arises in connection with the act of kindness.
  evidence:
  - The POB theological decision identifies a favorable outcome or response connected with the act.
  - The Greek parallel points toward thanks or favor for good deeds.
  confidence: moderate
  alternatives_preserved:
  - hope for your own well-being
  - thanks for your good deeds
translation_notes:
  risk_flags:
  - risk: “Because of” selects one relationship that the broad Hebrew preposition does not fully define.
    mitigation: The footnote preserves the principal welfare-oriented and gratitude-oriented readings.
