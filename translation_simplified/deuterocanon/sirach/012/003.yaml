translation:
  language: en
  text: No good comes to those who keep doing evil,[a] or to those who show no mercy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew wording is difficult; the Greek parallel supports “keep doing evil.”
    reason: alternative_reading
  - marker: b
    text: The Hebrew term can refer to mercy or charity; the Greek parallel supports this sense.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: one who persists in wickedness
  simplified_phrase: those who keep doing evil
  preserved_meaning: The person continues in evil conduct rather than committing only an isolated wrong.
  reasoning_layer_used: POB lexical decision on לִמְנֹחַ רָשָׁע, supported by the Greek parallel
  rationale: Common verbs make the ongoing conduct immediately clear.
- pob_phrase: nor to one who does not show mercy
  simplified_phrase: or to those who show no mercy
  preserved_meaning: The second group withholds ethical mercy or charity.
  reasoning_layer_used: POB theological decision on צְדָקָה and Greek ἐλεημοσύνη
  rationale: The direct wording keeps the mercy reading while simplifying the negative structure.
