translation:
  language: en
  text: When a man has good fortune, even an enemy acts like a friend.[a] But when he faces trouble, even a friend stays away.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “even an enemy becomes a friend.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: In a man's prosperity
  simplified_phrase: When a man has good fortune
  preserved_meaning: The man is experiencing favorable circumstances or success.
  reasoning_layer_used: POB lexical decision for בְּטוֹבַת
  rationale: “Has good fortune” states the favorable condition in familiar English.
- pob_phrase: even an enemy is friendly
  simplified_phrase: even an enemy acts like a friend
  preserved_meaning: An enemy behaves like a friend without necessarily becoming a genuine friend.
  reasoning_layer_used: POB lexical decision and footnote for רֵעַ
  rationale: This wording preserves the relational irony without claiming true reconciliation.
- pob_phrase: but in his adversity even a friend keeps apart
  simplified_phrase: But when he faces trouble, even a friend stays away
  preserved_meaning: During hardship, a friend may withdraw and keep his distance.
  reasoning_layer_used: POB lexical decisions for וּבְרָעָתוֹ and בּוֹדֵד
  rationale: The wording replaces abstract terms with a direct description of hardship and withdrawal.
translation_notes:
  risk_flags:
  - risk: “Acts like a friend” may suggest behavior rather than the stronger sense of becoming a friend.
    mitigation: The footnote preserves the stronger lexical alternative.
