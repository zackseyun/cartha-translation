translation:
  language: en
  text: Do good to a righteous person, and you will be repaid. If that person does not repay you, the LORD will.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Greek: “the Most High.” The Hebrew reads “the LORD.”'
    reason: textual_variant
simplification_decisions:
- pob_phrase: you will find repayment
  simplified_phrase: you will be repaid
  preserved_meaning: Doing good will result in repayment.
  reasoning_layer_used: Lexical decisions for תִּמְצָא and תַשְׁלוּמַת
  rationale: The passive wording expresses the Hebrew idiom’s result in ordinary English.
- pob_phrase: if not from him, then from Yahweh
  simplified_phrase: If that person does not repay you, the LORD will
  preserved_meaning: The repayment will come either from the righteous recipient or from the LORD.
  reasoning_layer_used: Hebrew syntax and theological decision on the divine name
  rationale: The completed conditional makes both possible sources of repayment clear.
- pob_phrase: the righteous
  simplified_phrase: a righteous person
  preserved_meaning: The recipient is one ethically and religiously upright person.
  reasoning_layer_used: Lexical decision for לַצַּדִּיק and the grounding review
  rationale: This keeps the singular referent without treating grammatical masculine form as proof of a male recipient.
interpretive_expansions:
- pob_phrase: if not from him, then from Yahweh
  rendering: If that person does not repay you, the LORD will
  claim: The final clause implies that the LORD will provide the same repayment.
  evidence:
  - The Hebrew contrast names two possible sources of one repayment.
  - The Greek parallel preserves the same repayment contrast.
  confidence: high
  alternatives_preserved:
  - if not from that person, then from the LORD
  external_witnesses:
  - Greek parallel
translation_notes:
  risk_flags:
  - risk: The passive wording removes the Hebrew image of finding repayment.
    mitigation: It preserves the idiom’s contextual result without weakening the promise.
  - risk: The Hebrew and Greek use different divine titles.
    mitigation: The main text follows the Hebrew, while the Greek reading remains in the footnote.
