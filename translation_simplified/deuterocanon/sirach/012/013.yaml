simplification_decisions:
- pob_phrase: set him beside you
  simplified_phrase: place him at your side
  preserved_meaning: Do not give him a position close to you.
  reasoning_layer_used: Hebrew lexical decisions for עמד and אצל
  rationale: This keeps the spatial image while using more natural English.
- pob_phrase: lest he push you aside and stand in your place
  simplified_phrase: or he may push you aside and take your place
  preserved_meaning: He could displace you and assume your former position.
  reasoning_layer_used: Hebrew lexical decisions for הדף, עמד, and תחת
  rationale: “Take your place” clearly expresses the contextual sense of replacement.
