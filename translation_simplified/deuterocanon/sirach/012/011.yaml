translation_notes:
  risk_flags:
  - risk: “Acts gently” does not retain the Hebrew walking image.
    mitigation: It preserves the idiom’s contextual force and prevents a narrowly physical reading.
  - risk: “Be careful to be afraid” may sound less idiomatic than a general warning to beware.
    mitigation: It preserves the Hebrew fear-word rather than replacing it with the Greek parallel’s guarding language.
