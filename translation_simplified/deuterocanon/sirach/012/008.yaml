translation:
  language: en
  text: You cannot tell who your friends are in good times,[a] but in hard times an enemy cannot remain hidden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Hebrew says “in good times.” The Greek differs in the first half of the verse, but the Hebrew is followed here.
    reason: textual_variant
