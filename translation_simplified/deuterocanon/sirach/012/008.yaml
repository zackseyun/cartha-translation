- pob_phrase: A friend is not known in prosperity
  simplified_phrase: You cannot tell who your friends are in good times
  preserved_meaning: Favorable circumstances do not reveal who is truly a friend.
  reasoning_layer_used: Hebrew lexical decisions and proverb structure
  rationale: The wording makes the recognition sense clear and replaces “prosperity” with ordinary English.
- pob_phrase: an enemy is not hidden in adversity
  simplified_phrase: in hard times an enemy cannot remain hidden
  preserved_meaning: Trouble exposes a hostile person rather than concealing that person.
  reasoning_layer_used: Hebrew lexical decisions and antithetical parallelism
  rationale: “Hard times” clarifies adversity while retaining the Hebrew image of an enemy being hidden.
