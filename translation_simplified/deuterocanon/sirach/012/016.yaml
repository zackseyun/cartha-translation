translation:
  language: en
  text: Who will feel sorry for a snake charmer who gets bitten, or for anyone who goes near a dangerous predator?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek text differs greatly here: it describes an enemy who speaks sweetly while secretly planning violence. The main text follows the surviving Hebrew.'
    reason: textual_variant
simplification_decisions:
- pob_phrase: Who will pity
  simplified_phrase: Who will feel sorry for
  preserved_meaning: The rhetorical question asks who would show compassion after such reckless behavior.
  reasoning_layer_used: POB lexical decision for יוּחַן
  rationale: “Feel sorry for” expresses “pity” in familiar modern English.
- pob_phrase: who is bitten
  simplified_phrase: who gets bitten
  preserved_meaning: The snake charmer suffers the expected injury without naming what bites him.
  reasoning_layer_used: POB lexical decision for נָשׁוּךְ
  rationale: This ordinary passive construction is clearer and preserves the Hebrew sense.
- pob_phrase: a beast of prey
  simplified_phrase: a dangerous predator
  preserved_meaning: The animal is a threatening hunter, reflecting the Hebrew image of a toothed beast.
  reasoning_layer_used: POB lexical decision and footnote for חַיַּת שֵׁן
  rationale: “Dangerous predator” is immediately clear without broadening the image to any wild animal.
