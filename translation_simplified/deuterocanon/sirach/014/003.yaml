- pob_phrase: a small-hearted man
  simplified_phrase: a miser
  preserved_meaning: The person has a morally petty and withholding attitude toward wealth.
  reasoning_layer_used: Hebrew source, Greek parallel, and immediate context
  rationale: “Miser” avoids suggesting limited intelligence and makes the financial vice clear.
- pob_phrase: a man with an evil eye
  simplified_phrase: anyone with a greedy eye
  preserved_meaning: The eye image condemns a corrupt attitude toward possessions.
  reasoning_layer_used: POB translation and source parallels
  rationale: “Greedy” clarifies the idiom while retaining its forceful eye image.
interpretive_expansions:
- pob_phrase: small-hearted man
  rendering: miser
  claim: The inner smallness is expressed as moral pettiness about wealth rather than limited intelligence.
  evidence:
