  rationale: “Sets up camp” expresses the concrete camping image in more natural English.
- pob_phrase: her house
  simplified_phrase: Wisdom’s house
  preserved_meaning: The house belongs to Wisdom, who is personified as a woman.
  reasoning_layer_used: POB theological decision and immediate context
  rationale: Naming Wisdom makes the pronoun’s referent clear to a reader seeing this verse alone.
- pob_phrase: drives his tent peg into her wall
  simplified_phrase: drives his tent peg into her wall
