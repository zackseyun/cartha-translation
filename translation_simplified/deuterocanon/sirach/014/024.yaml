  text: He sets up camp around Wisdom’s house and drives his tent peg into her wall—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “stays near Wisdom’s house and fastens a peg in her walls.” The Hebrew says “around,” while the Greek parallel says “near.”
    reason: lexical_alternative
