translation:
  language: en
  text: A greedy person[a] sees his own portion as too little. By taking his neighbor’s share, he destroys his own.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word is difficult here; the Greek parallel supports the meaning “greedy person.”
    reason: alternative_reading
