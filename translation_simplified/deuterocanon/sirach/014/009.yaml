  preserved_meaning: Greed makes a person regard what he has as insufficient.
  reasoning_layer_used: POB lexical decisions and Greek-supported theological decision
  rationale: The verb “sees” makes the Hebrew eye idiom natural while preserving its image and meaning.
- pob_phrase: and by taking his neighbor’s share he destroys his own portion
  simplified_phrase: By taking his neighbor’s share, he destroys his own.
  preserved_meaning: Taking what belongs to another person ultimately ruins the greedy person’s own portion.
