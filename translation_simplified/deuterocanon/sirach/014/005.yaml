translation:
  language: en
  text: If someone treats himself badly, whom will he treat well? He will not enjoy the good things he has.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: If he is evil to himself
  simplified_phrase: If someone treats himself badly
  preserved_meaning: The person acts harmfully and wrongly toward himself.
  reasoning_layer_used: Hebrew lexical decision for רַע לְנַפְשׁוֹ
  rationale: This recasts the difficult predicate as clear language about a person's treatment of himself.
- pob_phrase: to whom will he do good?
  simplified_phrase: whom will he treat well?
  preserved_meaning: The question asks who else could benefit from such a person.
  reasoning_layer_used: Hebrew lexical decision for לְמִי יֵיטִיב
  rationale: The paired wording makes the contrast in conduct easy to follow.
- pob_phrase: his own good things
  simplified_phrase: the good things he has
  preserved_meaning: The phrase remains broader than wealth alone and includes his resources or prosperity.
  reasoning_layer_used: Hebrew lexical decision for בְּטוֹבָתוֹ and Greek consistency check
  rationale: This replaces an unnatural phrase without narrowing it to possessions.
translation_notes:
  risk_flags:
  - risk: “Treats himself badly” may sound less morally forceful than “is evil to himself.”
    mitigation: The contrast with treating others well preserves the verse’s ethical judgment.
