translation:
  language: en
  text: Anyone who denies himself the use of what he owns stores it up for someone else, and strangers will indulge themselves with his wealth.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew has “a stranger,” while the Greek parallel has “others”; the plural expresses the general sense.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: He who deprives himself
  simplified_phrase: Anyone who denies himself the use of what he owns
  preserved_meaning: The person withholds the benefit and use of his possessions from himself.
  reasoning_layer_used: Hebrew lexical decisions and immediate contrast
  rationale: This clarifies the object of deprivation without narrowing it to pleasure alone.
- pob_phrase: will gather for another
  simplified_phrase: stores it up for someone else
  preserved_meaning: His accumulation will ultimately benefit another person.
  reasoning_layer_used: Hebrew lexical decision for יִקְבֹּץ לְאַחֵר
  rationale: “Stores it up” naturally conveys accumulation and preserves the verse’s irony.
- pob_phrase: strangers will revel in his goods
  simplified_phrase: strangers will indulge themselves with his wealth
  preserved_meaning: People other than the owner will abundantly enjoy his possessions.
  reasoning_layer_used: Hebrew lexical decisions with Greek parallel support
  rationale: The wording is clear modern English while retaining the force of lavish enjoyment.
interpretive_expansions:
- pob_phrase: deprives himself
  rendering: denies himself the use of what he owns
  claim: The deprivation concerns withholding the use and benefit of his possessions from himself.
  evidence:
  - The second clause identifies the accumulated things as his goods.
  - The contrast says strangers will enjoy what he withheld from himself.
  confidence: high
  alternatives_preserved:
  - deprives himself
  - withholds his possessions from himself
translation_notes:
  risk_flags:
  - risk: The explicit reference to using possessions is more specific than the Hebrew reflexive expression.
    mitigation: The reference to his goods and the strangers’ enjoyment firmly bounds the clarification.
  - risk: The Hebrew noun for “stranger” is singular.
    mitigation: The footnote records the singular Hebrew and plural Greek while retaining POB’s generic plural.
