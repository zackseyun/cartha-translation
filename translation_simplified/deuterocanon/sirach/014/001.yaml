translation:
  language: en
  text: Happy is the man whose own words have not made him stumble,[a] and whose heart does not condemn him in the sorrow of sin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is difficult; it may literally mean “whose mouth has not forsaken him,” while the Greek supports stumbling through speech.
    reason: alternative_reading
  - marker: b
    text: The Hebrew is uncertain; the Greek may also mean that he has not been pierced by sorrow over sin.
    reason: textual_variant
simplification_decisions:
- pob_phrase: whose mouth has not caused him to stumble
  simplified_phrase: whose own words have not made him stumble
  preserved_meaning: His speech has not led him into moral failure.
  reasoning_layer_used: POB lexical decision with Greek parallel support
  rationale: “Own words” makes the speech meaning clear while preserving the image of stumbling.
- pob_phrase: whose heart has not condemned him
  simplified_phrase: whose heart does not condemn him
  preserved_meaning: His heart does not deliver an inward verdict against him.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The direct present form preserves the heart’s role in inward judgment.
interpretive_expansions:
- pob_phrase: whose heart has not condemned him
  rendering: whose heart does not condemn him in the sorrow of sin
  claim: The inward condemnation is associated with sorrow related to sin.
  evidence:
  - The Greek parallel reads “in the sorrow of sin.”
  - The POB theological decision uses this phrase to clarify the uncertain clause.
  confidence: moderate
  alternatives_preserved:
  - sorrow arising from sin
  - sorrow associated with sin
  - being pierced by sorrow over sin
  external_witnesses:
  - Greek parallel
translation_notes:
  risk_flags:
  - risk: The Hebrew wording in both clauses is uncertain.
    mitigation: The footnotes preserve the Hebrew difficulty and the Greek-supported alternatives.
  - risk: “In the sorrow of sin” leaves the relationship between sorrow and sin open.
    mitigation: The wording retains the documented ambiguity without making sorrow the means of condemnation.
