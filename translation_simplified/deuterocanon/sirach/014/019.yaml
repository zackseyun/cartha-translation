simplification_decisions:
- pob_phrase: All his works rot away
  simplified_phrase: Everything he makes rots away
  preserved_meaning: The whole of a person's work is subject to decay.
  reasoning_layer_used: Lexical decisions for כָּל, מַעֲשָׂיו, and רָקוֹב יִרְקָבוּ
  rationale: Common wording preserves both the total scope and the forceful image of rotting.
- pob_phrase: the work of his hands
  simplified_phrase: What his hands produce
  preserved_meaning: The clause refers to the tangible result of his activity while retaining the image of his hands.
  reasoning_layer_used: Lexical decisions for וּפֹעַל and יָדָיו
  rationale: The recast phrase explains “work” as the product of action without losing the hand imagery.
- pob_phrase: and the work of his hands is dragged along behind him
  simplified_phrase: What his hands produce is dragged along behind him
  preserved_meaning: His work is pictured as being pulled after its maker.
  reasoning_layer_used: Hebrew-primary theological decision for יִמָּשֵׁךְ אַחֲרָיו
  rationale: A new sentence eases the syntax while preserving the Hebrew image and subject.
translation_notes:
  risk_flags:
