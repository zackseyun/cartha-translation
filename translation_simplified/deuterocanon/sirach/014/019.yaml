    mitigation: “Everything” preserves the comprehensive scope, while the second clause confirms the focus on produced work.
  - risk: The Greek shifts the second clause from the work to the worker.
    mitigation: The main text follows the validated Hebrew, and the Greek reading remains in a footnote.
