  rationale: “Deny yourself” expresses the same warning in more common English.
- pob_phrase: do not let your share in a good desire pass you by
  simplified_phrase: Do not miss out on your share in a good desire
  preserved_meaning: One should not fail to receive or enjoy one’s portion in a good longing.
