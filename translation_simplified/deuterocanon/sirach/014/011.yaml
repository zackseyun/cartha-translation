  rationale: “Resources” keeps the meaning broader than money while using familiar language.
- pob_phrase: do good to yourself
  simplified_phrase: do yourself good
  preserved_meaning: The son is directly urged to benefit himself.
  reasoning_layer_used: Hebrew lexical decision for הֵיטִיב לָךְ and Greek parallel
  rationale: This natural expression retains the broad ethical exhortation without limiting it to possessions.
- pob_phrase: present worthy offerings to the Lord
