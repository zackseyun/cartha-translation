translation:
  language: en
  text: Before you die, do good to someone you love.[a] Give to them as much as your means allow.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel says “a friend.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: one you love
  simplified_phrase: someone you love
  preserved_meaning: The person may be any loved one, not only a friend.
  reasoning_layer_used: Hebrew lexical decision and theological decision, checked against the Greek parallel
  rationale: “Someone” is more natural here while retaining the Hebrew's broad relational sense.
- pob_phrase: according to what your hand attains, give to him
  simplified_phrase: Give to them as much as your means allow
  preserved_meaning: The amount given should fit the giver's practical resources or ability.
  reasoning_layer_used: Hebrew idiom, lexical rationale, and Greek consistency check
  rationale: The plain wording explains the opaque hand-and-reach idiom without narrowing it to money alone.
- pob_phrase: do good to one you love, and ... give to him
  simplified_phrase: do good to someone you love. Give to them
  preserved_meaning: Doing good and giving remain distinct but connected instructions.
  reasoning_layer_used: POB syntax and lexical decisions
  rationale: Two sentences make the instruction easier to follow without merging its commands.
translation_notes:
  risk_flags:
  - risk: “Means” may be heard mainly as financial resources.
    mitigation: “As much as your means allow” can also naturally include practical capacity, matching the POB rationale.
