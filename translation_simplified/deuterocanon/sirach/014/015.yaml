translation:
  language: en
  text: Won’t you leave your wealth to someone else, and what you worked for to those who receive allotted shares?
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: to another
  simplified_phrase: to someone else
  preserved_meaning: Another person will receive the wealth left behind.
  reasoning_layer_used: Hebrew lexical decision for לְאַחֵר
  rationale: “Someone else” is clearer everyday English for the same beneficiary.
- pob_phrase: your labor
  simplified_phrase: what you worked for
  preserved_meaning: The phrase includes what the person’s work produced or gained.
  reasoning_layer_used: Hebrew lexical rationale and Greek parallel
  rationale: This wording clarifies that something gained through work is left behind.
- pob_phrase: those who cast the lot
  simplified_phrase: those who receive allotted shares
  preserved_meaning: Other people receive portions assigned through the division of the estate.
  reasoning_layer_used: POB footnote, Hebrew idiom, and Greek parallel
  rationale: The revision correctly identifies them as recipients rather than agents dividing the property.
interpretive_expansions:
- pob_phrase: your labor
  rendering: what you worked for
  claim: The noun includes the product or gain resulting from the person’s work.
  evidence:
  - The POB lexical rationale says the term can denote toil or what one has labored for.
  - The Greek parallel supports both effort and its product.
  confidence: high
  alternatives_preserved:
  - your labor
  - the fruit of your labor
- pob_phrase: those who cast the lot
  rendering: those who receive allotted shares
  claim: The people in view are recipients of portions assigned in the division.
  evidence:
  - The POB footnote gives “those who receive an allotted share” as an interpretive rendering.
  - The Greek parallel points to division of an inheritance or allotted portion.
  confidence: moderate
  alternatives_preserved:
  - heirs by allotment
  - those who cast the lot
translation_notes:
  risk_flags:
  - risk: “Allotted shares” makes the inheritance setting more explicit than the Hebrew idiom alone.
    mitigation: The POB footnote and Greek parallel directly support this bounded clarification.
