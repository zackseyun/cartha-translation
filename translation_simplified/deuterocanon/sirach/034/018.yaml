translation:
  language: en
  text: Even God will not delay. He will go out like a warrior and will not hold back. He will crush the hips of the cruel and repay the nations with vengeance. He will take away arrogance’s ruling scepter and completely cut down the staff of the wicked.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek text has a completely different reading: “lifting up the soul and enlightening the eyes, giving healing, life, and blessing.”'
    reason: textual_variant
simplification_decisions:
- pob_phrase: Even God will not delay, and like a warrior he will go out and not hold back
  simplified_phrase: Even God will not delay. He will go out like a warrior and will not hold back.
  preserved_meaning: God acts promptly and advances with the unstoppable force of a warrior.
  reasoning_layer_used: POB lexical decisions for לא יתמהמה, כגבור יצא, and לא יתאפק
  rationale: Two short sentences make the action easier to follow while retaining the martial image.
- pob_phrase: crushes the loins of the cruel
  simplified_phrase: crush the hips of the cruel
  preserved_meaning: God violently breaks the strength of cruel people.
  reasoning_layer_used: POB lexical decision for מתני אכזרי
  rationale: “Hips” is clearer today than “loins” and preserves the concrete bodily image.
- pob_phrase: dispossesses the scepter of arrogance
  simplified_phrase: take away arrogance’s ruling scepter
  preserved_meaning: God removes the illegitimate power wielded in arrogance.
  reasoning_layer_used: POB lexical decision for יוריש and שבט זדון
  rationale: The new wording explains the scepter as ruling power without discarding the symbol.
