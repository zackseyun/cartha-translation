- pob_phrase: For dreams have misled many
  simplified_phrase: Dreams have led many people astray.
  preserved_meaning: Dreams can cause people to go in a wrong direction.
  reasoning_layer_used: The lexical decision for ἐπλάνησεν and its stated alternative support the wandering image.
  rationale: “Led astray” makes the warning vivid and adds the implied word “people” for clarity.
- pob_phrase: and those who hoped in them have fallen
  simplified_phrase: Those who put their hope in dreams have fallen.
  preserved_meaning: People who rely on dreams may suffer downfall.
  reasoning_layer_used: The lexical and theological decisions identify dreams as the object of misplaced hope while retaining the fall metaphor.
  rationale: A new sentence and the repeated noun “dreams” make the relationship clear without resolving the kind of downfall.
