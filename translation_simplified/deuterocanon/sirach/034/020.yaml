translation:
  language: en
  text: The LORD’s kindness is welcome in times of distress, like a rain cloud during a drought.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek reads: “The Most High does not delight in the offerings of the ungodly, nor is he appeased for sins by a multitude of sacrifices.” The Hebrew and Greek texts differ substantially here.'
    reason: textual_variant
simplification_decisions:
- pob_phrase: The kindness of Yahweh is fitting
  simplified_phrase: The LORD’s kindness is welcome
  preserved_meaning: The LORD’s benevolent favor is pleasing and especially appropriate when people are in need.
  reasoning_layer_used: Lexical decisions for נאה, חסד, and יהוה
  rationale: “Is welcome” naturally expresses positive suitability without claiming when the kindness arrives.
- pob_phrase: in a time of distress
  simplified_phrase: in times of distress
  preserved_meaning: The LORD’s kindness is welcome during serious trouble or hardship.
  reasoning_layer_used: Lexical decision for בזמן מצוקה
  rationale: The plural idiom reads naturally while retaining the full seriousness of distress.
- pob_phrase: like a rain cloud in a time of drought
  simplified_phrase: like a rain cloud during a drought
  preserved_meaning: The cloud remains a concrete image of welcome, life-giving relief amid parched conditions.
  reasoning_layer_used: Lexical decisions for כעב חזיזים and בעת בצרת
  rationale: “During a drought” is ordinary English and preserves the agricultural image.
