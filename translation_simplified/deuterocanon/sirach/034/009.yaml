translation:
  language: en
  text: A man who has traveled[b] has learned much. A man with wide experience will share his understanding.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Hebrew line differs greatly and says approximately, “In all your deeds show a cheerful face, and gladly tithe what is holy.” Because it does not fit this context, the main text follows the Greek.
    reason: textual_variant
  - marker: b
    text: Or “has been educated.” The Greek can have this meaning, but the context favors learning through travel and experience.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: knows many things
  simplified_phrase: has learned much
  preserved_meaning: Travel has given the man broad knowledge.
  reasoning_layer_used: POB lexical decision for ἔγνω πολλά
  rationale: The approved alternative states the result of travel in more natural English.
- pob_phrase: one with much experience
  simplified_phrase: a man with wide experience
  preserved_meaning: Extensive experience is the basis of the person's insight.
  reasoning_layer_used: POB lexical decision for ὁ πολυπειρῶν
  rationale: “Wide experience” is concise and familiar while keeping the experiential emphasis.
- pob_phrase: will recount understanding
  simplified_phrase: will share his understanding
  preserved_meaning: The experienced man can communicate the insight he has gained.
  reasoning_layer_used: POB lexical decisions for ἐκδιηγήσεται and σύνεσιν
  rationale: “Share” clearly conveys expressing understanding without the stiffness of “recount.”
