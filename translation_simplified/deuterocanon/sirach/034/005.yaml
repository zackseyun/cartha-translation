translation:
  language: en
  text: Fortune-telling, interpreting omens, and dreams are empty and cannot be trusted. The heart imagines them like a woman in labor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Hebrew line here is about giving generously to the poor and may belong elsewhere; this verse follows the Greek text.
    reason: textual_variant
simplification_decisions:
- pob_phrase: Divinations
  simplified_phrase: Fortune-telling
  preserved_meaning: Practices that seek hidden knowledge or predict events remain in view.
  reasoning_layer_used: Greek lexical decision for μαντεῖαι
  rationale: The common term explains the practice without limiting it to a specific method.
- pob_phrase: omens
  simplified_phrase: interpreting omens
  preserved_meaning: The phrase still refers to treating signs as portents.
  reasoning_layer_used: Greek lexical decision for οἰωνισμοί
  rationale: The added action makes clear that omen-reading is the practice being condemned.
- pob_phrase: the heart imagines them like a woman in labor
  simplified_phrase: The heart imagines them like a woman in labor
  preserved_meaning: The heart remains the source of imagined appearances, and the childbirth simile keeps its original relation to the imagining.
  reasoning_layer_used: Greek lexical decisions for φαντάζεται, καρδία, and ὡς ὠδινούσης
  rationale: Keeping the compact simile avoids adding a second heart or claiming what the woman imagines.
interpretive_expansions:
- pob_phrase: are empty
  rendering: are empty and cannot be trusted
  claim: Their emptiness includes practical unreliability.
  evidence:
