translation:
  language: en
  text: Wine is like life to a person, if you drink it in the right amount. What is life like for someone harmed by wine?[a] For wine too was created to bring people gladness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or possibly, “What is life like for someone who lacks wine?” The brief Greek phrase can be understood either way.
    reason: alternative_reading
