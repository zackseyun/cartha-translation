simplification_decisions:
- pob_phrase: One who fears the Lord
  simplified_phrase: Anyone who fears the Lord
  preserved_meaning: The statement applies generally to each person who reveres the Lord.
  reasoning_layer_used: POB lexical decision for ὁ φοβούμενος
  rationale: “Anyone” makes the representative sense immediate while retaining the biblical concept of fearing the Lord.
- pob_phrase: will not be shaken, and will not be afraid
  simplified_phrase: will not be shaken or afraid
  preserved_meaning: The Lord keeps the person from both destabilizing fear and loss of courage.
  reasoning_layer_used: POB lexical decisions for πτοέω and δειλιάω
  rationale: The shorter coordination preserves both distinct assurances.
interpretive_expansions:
- pob_phrase: for he is his hope
  rendering: because the Lord is their hope
  claim: The first pronoun refers to the Lord, while the second refers to the person who fears him.
  evidence:
  - The POB lexical rationale identifies the Lord as the natural referent of αὐτός.
  - The preceding clause names both the Lord and the person who fears him.
  confidence: high
  alternatives_preserved:
  - because he is their hope
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “fear the Lord” as mere terror.
    mitigation: The key biblical phrase is retained, while the assurance against fear signals its positive sense.
  - risk: The supplied Hebrew line differs completely from the Greek main text.
    mitigation: The footnote gives the audited Hebrew wording and explains why the Greek controls the verse.
