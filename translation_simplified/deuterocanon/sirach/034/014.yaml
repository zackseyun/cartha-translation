translation:
  language: en
  text: Anyone who fears the Lord will not be shaken or afraid, because the Lord is their hope.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The supplied Cairo Geniza Hebrew line reads, “He will not neglect the cry of an orphan, nor a widow when she multiplies her complaint.” It likely comes from a different verse line, so the main text follows the Greek.
