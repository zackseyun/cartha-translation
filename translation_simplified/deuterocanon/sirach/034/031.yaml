translation:
  language: en
  text: At a feast with wine, do not rebuke your neighbor. Do not put him down while he is enjoying himself. Do not insult him or pressure him with demands.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “pressure him to repay what he owes”; the Greek can refer broadly to demands or more specifically to collecting a debt.
    reason: lexical_alternative
