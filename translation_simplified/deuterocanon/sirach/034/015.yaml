translation:
  language: en
  text: Think about how you would feel in your neighbor’s place, and consider every matter carefully.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The surviving Hebrew wording is very different: “Does not a tear run down the cheek, and a sigh over her destroyers or rebels?” Because the source tradition is uncertain, the main text follows the Greek.'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Judge your neighbor's feelings by your own
  simplified_phrase: Think about how you would feel in your neighbor’s place
  preserved_meaning: Understand another person’s feelings by using your own experience as a guide.
  reasoning_layer_used: Greek lexical decisions for νόει, τὰ τοῦ πλησίον, and ἐκ σεαυτοῦ
  rationale: The rewrite makes the intended empathy clear and avoids the misleading modern sense of “judge.”
- pob_phrase: think carefully about every matter
  simplified_phrase: consider every matter carefully
  preserved_meaning: Give deliberate thought to every situation.
  reasoning_layer_used: Greek lexical decisions for ἐπὶ παντὶ πράγματι and διανοοῦ
  rationale: The wording remains broad while using a smoother English command.
interpretive_expansions:
- pob_phrase: by your own
  rendering: how you would feel in your neighbor’s place
  claim: The reader should use personal experience to understand the neighbor by analogy.
  evidence:
  - The lexical rationale says ἐκ σεαυτοῦ means reasoning from one’s own experience.
  - The Greek context links reflective understanding with what concerns the neighbor.
  confidence: high
  alternatives_preserved:
  - Use your own feelings to understand your neighbor’s.
  - Understand your neighbor’s situation from your own experience.
translation_notes:
  risk_flags:
