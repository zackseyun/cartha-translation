translation:
  language: en
  text: When the poor cry for help, their cry passes through the cloud and does not rest until it reaches God. It does not stop until God gives it his attention and the righteous Judge executes judgment.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “does justice.” The Hebrew expression literally means “does judgment.”
    reason: lexical_alternative
  - marker: b
    text: The surviving Hebrew supports this translation, but the Greek version has substantially different wording, making the source text uncertain.
    reason: textual_variant
simplification_decisions:
- pob_phrase: The cry of the poor
  simplified_phrase: When the poor cry for help, their cry
  preserved_meaning: The poor make an urgent appeal from distress.
  reasoning_layer_used: Lexical decision for שועת דל
  rationale: The recast clause makes the appeal for help immediately clear while retaining its urgency.
- pob_phrase: until it reaches him
  simplified_phrase: until it reaches God
  preserved_meaning: The cry’s implied destination is God.
  reasoning_layer_used: Theological decision on the implicit divine referent
  rationale: Naming God removes an unclear pronoun without adding a new referent.
- pob_phrase: until God attends
  simplified_phrase: until God gives it his attention
  preserved_meaning: God takes responsive notice of the poor person’s cry.
  reasoning_layer_used: Lexical decision for יפקוד אל
  rationale: The common wording clarifies “attends” without specifying how God responds.
