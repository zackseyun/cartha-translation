translation:
  language: en
  text: Until he repays a man for what he has done and gives each person what his scheme deserves; until he takes up his people's case and fills them with joy through his salvation.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The surviving Greek text has a substantially different verse: “One who sacrifices from injustice offers a blemished offering, and the gifts of lawless men are not accepted.” The Hebrew witness is followed here.'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: repays a man for his deed
  simplified_phrase: repays a man for what he has done
  preserved_meaning: God gives judicial repayment for a person's moral actions.
  reasoning_layer_used: Lexical decision for פעלו in the context of recompense.
  rationale: The clause uses ordinary English while retaining the deed-and-repayment relationship.
- pob_phrase: a person's recompense according to his scheme
  simplified_phrase: gives each person what his scheme deserves
  preserved_meaning: Each person's morally charged purpose receives fitting recompense.
  reasoning_layer_used: Lexical decisions for גמול אדם and כמזימתו.
  rationale: The active wording makes the judicial sense clear without neutralizing “scheme.”
- pob_phrase: pleads the case of his people and gladdens them
  simplified_phrase: takes up his people's case and fills them with joy
  preserved_meaning: God champions his people in a judicial image and causes them to rejoice.
  reasoning_layer_used: Lexical decisions for יריב ריב עמו and ושמחם.
  rationale: The rewrite replaces formal wording but keeps both the legal image and caused joy.
interpretive_expansions:
- pob_phrase: a person's recompense according to his scheme
  rendering: gives each person what his scheme deserves
  claim: The recompense is fittingly determined by the person's scheme.
  evidence:
  - The POB lexical rationale identifies גמול as judicial or moral recompense.
  - The phrase “according to” makes the scheme the measure of repayment.
  confidence: high
  alternatives_preserved:
  - according to his scheme
