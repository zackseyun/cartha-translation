  preserved_meaning: The speaker gained experience while moving about, with possible overtones of straying.
  reasoning_layer_used: POB lexical decision for ἐν τῇ ἀποπλανήσει μου
  rationale: The plural sounds more natural in English while retaining the Greek image and its ambiguity.
- pob_phrase: my understanding is more than my words
