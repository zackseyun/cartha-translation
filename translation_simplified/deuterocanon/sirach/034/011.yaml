  text: I have seen many things in my wanderings,[b] and I understand more than I can express in words.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Hebrew line does not match this verse, so this translation follows the ancient Greek text.
    reason: textual_variant
  - marker: b
    text: The Greek may also mean “in my travels,” “in my straying,” or “in my error.”
    reason: lexical_alternative
