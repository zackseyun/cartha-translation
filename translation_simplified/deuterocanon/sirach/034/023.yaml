translation:
  language: en
  text: Anyone who takes away a neighbor’s means of support is murdering that neighbor. Anyone who keeps back the pay owed to a hired worker is shedding blood.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The verse directly equates depriving people of their means of support or pay with murder and bloodshed; it does not merely say these acts are similar.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Whoever takes away a neighbor’s livelihood
  simplified_phrase: Anyone who takes away a neighbor’s means of support
  preserved_meaning: The person deprives a neighbor of what sustains life.
  reasoning_layer_used: POB lexical decision for ὁ ἀφαιρούμενος συμβίωσιν
  rationale: “Means of support” clearly conveys livelihood or subsistence without limiting it to earning income.
- pob_phrase: is murdering him
  simplified_phrase: is murdering that neighbor
  preserved_meaning: Depriving someone of support is stated as directly equivalent to murder.
  reasoning_layer_used: POB theological decision on the homicide metaphor
  rationale: Naming the neighbor clarifies the referent while preserving the verse’s stark force.
- pob_phrase: withholds a hired worker’s wages
  simplified_phrase: keeps back the pay owed to a hired worker
  preserved_meaning: The worker is wrongfully deprived of earned wages.
  reasoning_layer_used: POB lexical decisions for ἀποστερῶν and μισθὸν μισθωτοῦ
  rationale: “Pay owed” makes the worker’s rightful claim immediately clear.
translation_notes:
  risk_flags:
  - risk: “Shedding blood” may be mistaken for literal violence.
    mitigation: The footnote explains the direct moral equivalence while retaining the biblical image.
