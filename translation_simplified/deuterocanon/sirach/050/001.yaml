translation:
  language: en
  text: Simon son of Yohanan the priest was a glory to his brothers and the splendor of his people.[a] In his time, God’s house was repaired,[b] and the temple was strengthened.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel calls him “Simon son of Onias, the great priest” (or “high priest”), while the Hebrew reads “Simon son of Yohanan the priest.”
    reason: alternative_reading
  - marker: b
    text: The Hebrew may also mean that God’s house was cared for or restored; the Greek points to building work.
    reason: lexical_alternative
