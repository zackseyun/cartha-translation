translation:
  language: en
  text: The song rang out, and they arranged his lamp above the crowd.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek has a substantially different wording: “The psalm-singers praised with their voices, and the melody sounded sweet in the crowded house.” The Hebrew second line may be difficult or differently preserved.'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the song gave forth its voice
  simplified_phrase: the song rang out
  preserved_meaning: The song produced a strong, audible sound in the worship gathering.
  reasoning_layer_used: Hebrew lexical decisions for וַיִּתֵּן, הַשִּׁיר, and קוֹלוֹ
  rationale: “Rang out” expresses the Hebrew sound-producing idiom in natural English while retaining the song image.
- pob_phrase: over the multitude
  simplified_phrase: above the crowd
  preserved_meaning: The Hebrew spatial image places something over or above the assembled people.
  reasoning_layer_used: Hebrew lexical decisions for וְעַל and הֲמּוֹן
  rationale: “Above the crowd” is clearer modern English without resolving the uncertain spatial relationship.
- pob_phrase: they set his lamp in order
  simplified_phrase: they arranged his lamp
  preserved_meaning: They ordered or positioned the lamp associated with an uncertain male referent.
  reasoning_layer_used: Hebrew lexical decisions for הֶעֱרִיכוּ and נֵרוֹ
  rationale: “Arranged” makes the ceremonial action concise while preserving the literal lamp and uncertain pronoun.
