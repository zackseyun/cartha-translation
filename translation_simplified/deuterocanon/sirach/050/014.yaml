translation:
  language: en
  text: until he finished serving at the altar and setting the Most High’s arrangements in order.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek says, “arranging the offering of the Most High Almighty.” The Hebrew is less specific: “setting the arrangements of the Most High in order.”'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: ministering at the altar
  simplified_phrase: serving at the altar
  preserved_meaning: He was carrying out priestly worship at the altar.
  reasoning_layer_used: The lexical decision identifies this as priestly service rather than ordinary labor.
  rationale: “Serving” is clearer than “ministering,” while “at the altar” preserves the priestly setting.
- pob_phrase: arranging the orderings of the Most High
  simplified_phrase: setting the Most High’s arrangements in order
  preserved_meaning: He put the sacred arrangements associated with the Most High into their proper order without specifying what they were.
  reasoning_layer_used: The lexical and theological decisions preserve the Hebrew term’s broad, elliptical sense.
  rationale: “Setting … in order” is natural English, while “arrangements” avoids narrowing the Hebrew to offerings.
translation_notes:
  risk_flags:
  - risk: “Arrangements” remains somewhat general because the Hebrew does not identify the arranged objects.
    mitigation: The main text preserves that ambiguity, and the footnote gives the Greek’s more specific offering reading.
