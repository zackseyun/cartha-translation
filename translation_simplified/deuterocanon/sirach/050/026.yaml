simplification_decisions:
- pob_phrase: the inhabitants of Seir and Philistia
  simplified_phrase: the people who live in Seir and Philistia
  preserved_meaning: This still refers collectively to residents of both regions.
  reasoning_layer_used: POB lexical decisions for יוֹשְׁבֵי, שֵׂעִיר, and וּפְלֶשֶׁת
  rationale: The rewrite replaces formal “inhabitants” with familiar wording while keeping Seir and Philistia as place-names.
- pob_phrase: the foolish nation that dwells in Shechem
  simplified_phrase: the foolish nation living in Shechem
  preserved_meaning: This retains the continuing residence of the nation in Shechem and the source’s condemnation of it as foolish.
  reasoning_layer_used: POB lexical decisions for גּוֹי, נָבָל, הַדָּר, and בִּשְׁכֶם
  rationale: The shorter participial phrase is natural modern English without weakening “foolish” or replacing “nation.”
translation_notes:
  risk_flags:
  - risk: Modern readers may hear “foolish” as merely unintelligent rather than morally and intellectually corrupt.
    mitigation: The main text retains the POB’s audited term without adding commentary to the verse.
  - risk: The Hebrew and Greek differ over whether the first place is Seir or the mountain of Samaria.
    mitigation: The Hebrew reading controls the text, and the Greek reading remains in a footnote.
