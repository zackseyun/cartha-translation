translation:
  language: en
  text: May God’s mercy faithfully remain with Shimon[a]. May God establish for him the covenant of Phinehas[b]. May this covenant never be cut off from Shimon or his descendants, for as long as heaven endures.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel reads, “Entrust his mercy with us, and in his days may he redeem us.” It differs substantially from the surviving Hebrew, which speaks of Shimon and the covenant of Phinehas.
    reason: alternative_reading
  - marker: b
    text: The covenant of Phinehas refers to the enduring priestly covenant in Numbers 25:12–13.
    reason: cross_reference
simplification_decisions:
- pob_phrase: may his mercy remain faithful with Shimon
  simplified_phrase: May God’s mercy faithfully remain with Shimon
  preserved_meaning: God’s mercy is asked to remain with Shimon in covenant faithfulness.
  reasoning_layer_used: lexical decisions for יֵאָמֵן, עִם, and חַסְדּוֹ
  rationale: The wording keeps both mercy and faithfulness while making the relationship natural in English.
- pob_phrase: which shall not be cut off from him or from his offspring
  simplified_phrase: May this covenant never be cut off from Shimon or his descendants
  preserved_meaning: The covenant is to continue unbroken for Shimon and his line.
  reasoning_layer_used: lexical decisions for אֲשֶׁר לֹא יִכָּרֵת and וּלְזַרְעוֹ
  rationale: Naming the covenant and Shimon clarifies the pronouns while preserving the Hebrew image “cut off.”
- pob_phrase: as long as the days of heaven endure
  simplified_phrase: for as long as heaven endures
  preserved_meaning: The prayer asks for the covenant to last through an immeasurably long span.
  reasoning_layer_used: lexical decision for כִּימֵי שָׁמָיִם
  rationale: The shorter wording keeps both the temporal meaning and the image of enduring heaven.
interpretive_expansions:
- pob_phrase: his mercy ... may he establish
  rendering: God’s mercy ... May God establish
  claim: The possessive and subject refer to God.
  evidence:
