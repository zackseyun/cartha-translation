    mitigation: Footnote a preserves the Hebrew alternative while the main text follows the POB’s Greek-supported purpose reading.
  - risk: Modern readers may hear “glory” as a noun rather than an action.
    mitigation: Footnote b supplies “boast,” preserving the active sense of exulting or taking pride.
