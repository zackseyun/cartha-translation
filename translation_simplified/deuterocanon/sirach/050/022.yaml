translation:
  language: en
  text: Now, please bless Yahweh, the God of Israel. He works wonders on the earth. He raises people to greatness from the womb and deals with them as he chooses.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel reads, “and deals with us according to his mercy,” instead of, “and deals with him as he chooses.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: who does wondrous things on the earth
  simplified_phrase: He works wonders on the earth.
  preserved_meaning: God performs extraordinary acts on the earth.
  reasoning_layer_used: Hebrew lexical decision for הַמַּפְלִיא לַעֲשׂוֹת and בָּאָרֶץ
  rationale: A separate sentence and the familiar phrase “works wonders” make the praise easier to follow.
- pob_phrase: who makes man great from the womb
  simplified_phrase: He raises people to greatness from the womb
  preserved_meaning: God elevates human beings beginning from the womb.
  reasoning_layer_used: Lexical and theological decisions for הַמְגַדֵּל אָדָם and מֵרֶחֶם
  rationale: The plural generic makes the representative human sense clear while preserving elevation and the womb image.
- pob_phrase: deals with him according to his will
  simplified_phrase: deals with them as he chooses
  preserved_meaning: God acts toward human beings in keeping with his sovereign will.
  reasoning_layer_used: Hebrew witness and final-clause theological decision
  rationale: “As he chooses” expresses the Hebrew-based meaning in ordinary English without adopting the Greek alternative.
translation_notes:
  risk_flags:
  - risk: The Hebrew and Greek differ significantly in the final clause.
    mitigation: The main text follows the primary Hebrew witness, while the Greek reading remains in a footnote.
  - risk: Plural wording changes the Hebrew singular representative form.
    mitigation: The plural clearly conveys the audited generic-human sense without narrowing it to one male individual.
