translation:
  language: en
  text: Then the priests—the sons of Aaron—would sound a loud blast on hammered-metal trumpets.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek has a longer form here about the priest pouring out a wine offering at the altar; the surviving Hebrew contains only the line about the trumpets.
    reason: textual_variant
