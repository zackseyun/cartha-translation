  rationale: Reordering the titles makes their relationship clear while preserving the priestly lineage.
- pob_phrase: would raise a shout with hammered trumpets
  simplified_phrase: would sound a loud blast on hammered-metal trumpets
  preserved_meaning: The priests produced a loud acclamation or signal by means of the trumpets.
