translation:
  language: en
  text: During his time, a wall with corner structures was built, along with a residence like a royal palace.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew phrase is difficult; the corner structures may be sections of the wall, towers, or part of a fortified enclosure.
    reason: lexical_alternative
  - marker: b
    text: The Greek has a very different line about a water reservoir surrounded by bronze, probably reflecting a different or damaged textual tradition.
    reason: textual_variant
