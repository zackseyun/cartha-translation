translation:
  language: en
  text: How splendid he looked when he appeared from the tent,[a] and when he came out from behind the curtain of the sacred house.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “when he looked out from the tent”; the Greek instead reads “in the circuit of the people.”
    reason: textual_variant
  - marker: b
    text: The “sacred house” is the temple; the curtain, also called the veil, screened off the inner sanctuary.
    reason: cultural_note
