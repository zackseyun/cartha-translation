  preserved_meaning: The high priest became visible from the sanctuary area.
  reasoning_layer_used: Lexical decision for בְּהַשְׁגִּיחוֹ
  rationale: “Appeared” clearly conveys his coming into view, while the note preserves the Hebrew wording.
- pob_phrase: from the house of the curtain
  simplified_phrase: from behind the curtain of the sacred house
  preserved_meaning: He emerged from the temple area marked off by the sanctuary curtain.
  reasoning_layer_used: Lexical and theological decisions for מִבֵּית הַפָּרֹכֶת
  rationale: The spatial wording is clearer while retaining the distinct house and curtain images.
