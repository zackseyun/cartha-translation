translation:
  language: en
  text: When he received the portions of the sacrifice from his brothers,[a] he stood in the place arranged for him beside the altar.[b] Around him, the sons of Aaron formed a crown in their splendor, like young cedar trees in Lebanon. They surrounded him like willows beside a stream.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek reads “from the hands of the priests.” Here the context identifies his brothers as fellow priests.
    reason: alternative_reading
  - marker: b
    text: The Hebrew expression is difficult; the Greek places him beside the altar hearth.
    reason: textual_variant
