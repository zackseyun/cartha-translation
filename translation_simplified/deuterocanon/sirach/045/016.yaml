translation:
  language: en
  text: He was to serve God in worship and act as his priest, and to bless God’s people in God’s name. God chose him from among all the living to offer burnt offerings and the fat portions set apart for sacrifice.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek version is fuller: “to offer an offering to the Lord, incense and a pleasing aroma as a memorial, and to make atonement for your people.” The surviving Hebrew text is shorter.'
    reason: textual_variant
simplification_decisions:
- pob_phrase: to minister and to serve as priest to him
  simplified_phrase: to serve God in worship and act as his priest
  preserved_meaning: This keeps sacred service distinct from the priestly office.
  reasoning_layer_used: Hebrew lexical decisions for לשרת and ולכהן
  rationale: “Serve God in worship” clearly expresses the sacred setting.
- pob_phrase: He chose him from among all the living
  simplified_phrase: God chose him from among all the living
  preserved_meaning: God chose him from the full breadth of the living.
  reasoning_layer_used: Hebrew lexical decision for ויבחר בו מכל חי
  rationale: Naming God clarifies the pronoun without narrowing the Hebrew phrase.
- pob_phrase: fat portions
  simplified_phrase: fat portions set apart for sacrifice
  preserved_meaning: These are the specific sacrificial fat parts offered on the altar.
  reasoning_layer_used: Hebrew lexical decision for וחלבים
  rationale: The added phrase prevents readers from understanding fat in general.
interpretive_expansions:
- pob_phrase: him / his / He
  rendering: God / God’s
  claim: The divine pronouns refer to God as the one served, the authority behind the blessing, and the one who chose Aaron.
  evidence:
  - The priestly duties in the immediate context are directed toward God.
  - The blessing is pronounced in the divine name.
  confidence: high
  alternatives_preserved:
  - Retain the pronouns when the wider context is displayed.
- pob_phrase: fat portions
  rendering: fat portions set apart for sacrifice
  claim: The phrase means designated sacrificial portions rather than fat generally.
  evidence:
  - The lexical audit identifies these as sacrificial fat parts offered on the altar.
  - They appear alongside burnt offerings.
  confidence: high
  alternatives_preserved:
  - fat portions
  - choice fat pieces
translation_notes:
  risk_flags:
  - risk: Replacing divine pronouns with “God” makes their referent explicit.
    mitigation: The immediate priestly context strongly identifies God as the referent.
  - risk: The Greek parallel contains material absent from the surviving Hebrew.
    mitigation: The main text follows the Hebrew, and the footnote preserves the fuller Greek reading.
