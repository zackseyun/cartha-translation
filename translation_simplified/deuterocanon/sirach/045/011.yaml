translation:
  language: en
  text: On the breastpiece were precious stones, mounted in settings[b] and engraved like seals. Each stone served as a memorial, engraved with the name of one of the sons of Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek reads “tribes of Israel”; Hebrew reads “sons of Israel,” whose names represent the tribes.
    reason: alternative_reading
  - marker: b
    text: Greek explicitly says the stones were set in gold, while Hebrew only implies mounted settings.
    reason: textual_variant
simplification_decisions:
- pob_phrase: precious stones upon the breastpiece
  simplified_phrase: On the breastpiece were precious stones
  preserved_meaning: The valuable stones were attached to the high priest’s chest-piece.
  reasoning_layer_used: POB lexical decision for אבני חפץ and החשן
  rationale: Ordinary sentence order makes the description easier to follow.
- pob_phrase: engraved like a seal in their settings
  simplified_phrase: mounted in settings and engraved like seals
  preserved_meaning: The stones were securely set and cut in the style of signet seals.
  reasoning_layer_used: POB lexical decisions for פתוחי חותם and במלואים
  rationale: The revision separates mounting from engraving while preserving both details.
- pob_phrase: every precious stone as a memorial, engraved with writing according to the number of the sons of Israel
  simplified_phrase: Each stone served as a memorial, engraved with the name of one of the sons of Israel
  preserved_meaning: The stones commemorated Israel through inscriptions corresponding to Israel’s sons.
  reasoning_layer_used: POB theological decision on the engraved stones
  rationale: The concrete name-bearing function is stated directly instead of using the opaque numerical phrase.
interpretive_expansions:
- pob_phrase: engraved with writing according to the number of the sons of Israel
  rendering: engraved with the name of one of the sons of Israel
  claim: Each stone bore a name corresponding to an Israelite son or tribe.
  evidence:
  - The POB theological decision identifies engraved names corresponding to Israel’s sons or tribes.
  - The Greek parallel reads “according to the number of the tribes of Israel.”
  confidence: high
  alternatives_preserved:
  - The footnote preserves the Greek reading “tribes of Israel.”
translation_notes:
  risk_flags:
  - risk: “Name of one” makes the distributive relationship more explicit than the Hebrew wording alone.
    mitigation: The POB theological decision and Greek parallel support this reading.
  - risk: Readers may confuse Israel’s sons with a group different from the tribes.
    mitigation: Footnote a explains that their names represent the tribes.
