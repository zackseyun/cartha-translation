translation:
  language: en
  text: Moses ordained him[a] and anointed him with holy oil. He and his descendants received an everlasting covenant, lasting as long as the heavens endure.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “filled his hand,” an expression for ordaining someone to priestly office.
    reason: lexical_alternative
  - marker: b
    text: 'The surviving Greek continues: “to minister to him and serve as priest, and to bless his people in his name.” The main text follows the surviving Hebrew.'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: It became for him an everlasting covenant, and for his offspring
  simplified_phrase: He and his descendants received an everlasting covenant
  preserved_meaning: The covenant belongs to him and to his continuing family line.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The active English sentence clarifies the beneficiaries without enlarging the promise.
- pob_phrase: offspring
  simplified_phrase: descendants
  preserved_meaning: The Hebrew collective term refers to his family line.
  reasoning_layer_used: POB lexical decision for ולזרעו
  rationale: “Descendants” is more immediately understandable to common readers.
- pob_phrase: for as long as the heavens endure
  simplified_phrase: lasting as long as the heavens endure
  preserved_meaning: The covenant has enduring duration expressed through cosmic imagery.
  reasoning_layer_used: POB lexical decision for כימי שמים
  rationale: The participial wording connects the duration directly to the covenant.
