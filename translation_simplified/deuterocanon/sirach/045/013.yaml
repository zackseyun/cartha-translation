translation:
  language: en
  text: No one before Aaron had garments like these. No one outside his family line will ever wear them; only his sons and their descendants may wear them, generation after generation.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew in the second half is difficult and may speak of God entrusting or confirming this privilege to Aaron and his sons; the Greek states that these garments are for his sons and descendants alone.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Before him there had not been such garments
  simplified_phrase: No one before Aaron had garments like these
  preserved_meaning: Aaron's garments were without precedent.
  reasoning_layer_used: Lexical decision for לפניו and the immediate context identifying Aaron.
  rationale: Naming Aaron and using “garments like these” makes the comparison immediately clear.
- pob_phrase: no foreigner will ever wear them
  simplified_phrase: No one outside his family line will ever wear them
  preserved_meaning: The garments are permanently restricted to Aaron's authorized priestly line.
  reasoning_layer_used: Lexical rationale for זר and the theological decision on hereditary exclusivity.
  rationale: “Outside his family line” avoids suggesting that nationality alone is the issue.
- pob_phrase: his descendants throughout their generations
  simplified_phrase: their descendants may wear them, generation after generation
  preserved_meaning: The privilege continues through successive generations of Aaron's descendants.
  reasoning_layer_used: Lexical decision for לבניו... בניו לדורותם and the Greek parallel.
  rationale: The repeated phrase expresses the continuing hereditary right in ordinary English.
interpretive_expansions:
- pob_phrase: him / foreigner
  rendering: Aaron / no one outside his family line
  claim: The pronoun refers to Aaron, and the excluded person is anyone outside his priestly family line.
  evidence:
  - The surrounding passage concerns Aaron and his high-priestly clothing.
  - The Greek parallel excludes outsiders while including Aaron's sons and descendants.
  confidence: high
  alternatives_preserved:
  - The footnote preserves the possible Hebrew sense of entrusting or confirming the privilege.
  external_witnesses:
  - The Greek parallel in Sirach 45:13 supports hereditary exclusion.
translation_notes:
  risk_flags:
  - risk: The difficult Hebrew may describe entrusting or confirming the privilege rather than explicitly excluding outsiders.
    mitigation: The footnote preserves that reading while the main text follows the Greek-supported POB decision.
  - risk: “Family line” could be read more broadly than the authorized priestly descendants.
    mitigation: The following clause limits the line to Aaron's sons and their descendants.
