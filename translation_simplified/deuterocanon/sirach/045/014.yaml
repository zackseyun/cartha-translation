translation:
  language: en
  text: His grain offering will be completely burned up twice each day, day after day.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel says, “His sacrifices will be completely burned up, continually, twice each day.” The Hebrew specifically says “his grain offering.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: shall be burned up whole
  simplified_phrase: will be completely burned up
  preserved_meaning: The entire grain offering is consumed by fire.
  reasoning_layer_used: Hebrew lexical decisions for כליל and תקטר
  rationale: This recasts the awkward phrase while preserving complete consumption in sacrificial fire.
- pob_phrase: every day, twice a day
  simplified_phrase: twice each day, day after day
  preserved_meaning: The offering is made twice daily on an ongoing basis.
  reasoning_layer_used: Hebrew lexical decisions for בכל יום, צמיד, and פעמים
  rationale: The new wording clearly expresses both the daily frequency and its regular continuation.
