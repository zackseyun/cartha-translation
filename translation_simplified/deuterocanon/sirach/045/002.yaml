translation:
  language: en
  text: God honored him and gave him strength in the heights.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek has a substantially different reading: “He made him like the glory of holy ones and made him great in the terrors of enemies.” The Hebrew reads, “God honored him and gave him strength in the heights.” Here, “the heights” may refer to a high or exalted place.'
