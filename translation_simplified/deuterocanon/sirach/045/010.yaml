translation:
  language: en
  text: holy garments made with gold, blue, and purple, crafted in artistic patterns; a breastpiece for judgment,[a] an ephod,[b] a sash, and crimson yarn woven into the garments by a weaver.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This is the high priest’s breastpiece associated with judgment and decisions in Exodus.
    reason: cross_reference
  - marker: b
    text: An ephod was a special garment worn by Israel’s high priest.
    reason: cultural_note
simplification_decisions:
- pob_phrase: of gold, blue, and purple
  simplified_phrase: made with gold, blue, and purple
  preserved_meaning: The garments used the same costly materials and colors.
  reasoning_layer_used: POB lexical decision for זהב תכלת, וארגמן
  rationale: “Made with” clearly connects the listed materials and colors to the garments.
- pob_phrase: the work of a designer
  simplified_phrase: crafted in artistic patterns
  preserved_meaning: The garments displayed intentional, skilled, patterned workmanship.
  reasoning_layer_used: POB lexical rationale for מעשה חשב and Greek consistency check
  rationale: This avoids the occupational sense of “designer” while preserving ornate craftsmanship.
- pob_phrase: scarlet yarn, the work of a weaver
  simplified_phrase: crimson yarn woven into the garments by a weaver
  preserved_meaning: A weaver incorporated the crimson material into the priestly textile work.
  reasoning_layer_used: POB lexical decisions for ושני תולעת and מעשה אורג
  rationale: This keeps the weaver explicit without misleadingly saying that the yarn itself was woven.
interpretive_expansions:
- pob_phrase: an ephod
  rendering: An ephod was a special garment worn by Israel’s high priest.
  claim: The retained technical term names a high-priestly garment.
  evidence:
  - The POB theological decision identifies the items as Aaronic high-priestly vestments.
  - The POB lexical decision describes the ephod as a technical object without a precise English equivalent.
  confidence: high
  alternatives_preserved:
  - priestly vest
- pob_phrase: a breastpiece of judgment
  rendering: This is the high priest’s breastpiece associated with judgment and decisions in Exodus.
  claim: The phrase refers to the Exodus priestly breastpiece connected with discernment.
  evidence:
  - The POB lexical rationale links judgment with judicial discernment or oracular decision.
  - The POB cross-reference identifies this as established priestly terminology from Exodus.
  confidence: high
  alternatives_preserved:
  - judicial discernment
  - oracular decision
translation_notes:
  risk_flags:
  - risk: The exact technique described by מעשה חשב may include weaving rather than embroidery.
    mitigation: “Crafted in artistic patterns” preserves skilled ornamentation without naming a specific technique.
  - risk: The Hebrew color term may be rendered “scarlet” or “crimson.”
    mitigation: “Crimson yarn” follows the controlling POB lexical decision without overdefining the shade.
