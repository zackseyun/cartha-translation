translation:
  language: en
  text: 'For this reason, he also established a binding law for Phinehas: an everlasting covenant to provide for the sanctuary.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek parallel is longer: “Therefore a covenant of peace was established for him, as guardian of the holy things and for his people, so that the dignity of the priesthood might belong to him and his descendants forever.” The surviving Hebrew is shorter and focuses on a law and an everlasting covenant to provide for the sanctuary.'
    reason: alternative_reading
