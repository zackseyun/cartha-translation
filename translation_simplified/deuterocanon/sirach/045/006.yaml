translation:
  language: en
  text: He[a] exalted Aaron, who was Moses’ brother from the tribe of Levi and a holy man like Moses.[b] He appointed Aaron under a permanent ordinance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew does not name the subject; the context points to God.
    reason: source_note
  - marker: b
    text: The Greek identifies Aaron as Moses’ brother and compares his holiness with Moses; the cited Hebrew is shorter.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: a holy one like himself
  simplified_phrase: a holy man like Moses
  preserved_meaning: Aaron is holy and is compared with Moses in honor.
  reasoning_layer_used: POB lexical decision for קדוש and Greek ὅμοιον αὐτῷ with “his brother”
  rationale: Naming Moses prevents the comparison from being mistaken as a comparison with God.
- pob_phrase: from the tribe of Levi
  simplified_phrase: Moses’ brother from the tribe of Levi
  preserved_meaning: Aaron belongs to Levi’s tribe and is identified as Moses’ brother.
  reasoning_layer_used: POB Greek parallel and lexical decision for למטה לוי
  rationale: The Greek relationship clarifies the comparison while the tribal identity remains explicit.
- pob_phrase: made him an everlasting statute
  simplified_phrase: appointed Aaron under a permanent ordinance
  preserved_meaning: Aaron received an enduring appointment with legal force.
  reasoning_layer_used: POB lexical and theological decisions for וישימהו and לחק עולם
  rationale: This explains the compressed idiom without calling Aaron or his appointment a law.
interpretive_expansions:
- pob_phrase: like himself
  rendering: like Moses
  claim: The comparison is with Moses rather than with the implicit divine subject.
  evidence:
  - The Greek calls Aaron “his brother” immediately after the comparison.
  - The surrounding passage concerns Moses and Aaron.
  confidence: high
  alternatives_preserved:
  - like himself
- pob_phrase: made him an everlasting statute
  rendering: appointed Aaron under a permanent ordinance
  claim: The phrase describes Aaron’s enduring legal appointment.
  evidence:
  - The POB rationale identifies an enduring legal-priestly appointment.
  - The POB lists “appointed him” and “lasting ordinance” as supported alternatives.
  confidence: high
  alternatives_preserved:
  - made him an everlasting statute
  - appointed him for an everlasting statute
translation_notes:
  risk_flags:
  - risk: The unnamed subject may be unclear without context.
    mitigation: The pronoun is retained, and a note says the context points to God.
  - risk: “Appointed” makes the terse legal idiom more explicit.
    mitigation: The wording preserves legal permanence without naming a specific office.
