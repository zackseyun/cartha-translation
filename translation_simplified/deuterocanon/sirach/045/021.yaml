translation:
  language: en
  text: He gave Aaron the best of the sacred bread. Aaron and his descendants are entitled to eat the food offerings made to Yahweh.[a] The sacred bread placed in God’s presence[b] is Aaron’s allotted share, a gift to him and his descendants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew term for these food offerings is often translated “offerings by fire.”
    reason: lexical_alternative
  - marker: b
    text: This sacred bread is traditionally called the “bread of the Presence” or “showbread.”
    reason: simplification_note
simplification_decisions:
- pob_phrase: the choicest holy bread
  simplified_phrase: the best of the sacred bread
  preserved_meaning: The bread is especially valued and set apart as holy.
  reasoning_layer_used: POB lexical decision for ראשית קדש
  rationale: Common wording preserves both its priority and sacred character.
- pob_phrase: they shall eat the food offerings of Yahweh
  simplified_phrase: Aaron and his descendants are entitled to eat the food offerings made to Yahweh
  preserved_meaning: Aaron’s priestly line has an established right to eat Yahweh’s sacrificial food portions.
  reasoning_layer_used: POB lexical decisions for אשי יהוה and יאכלון
  rationale: “Are entitled to eat” conveys the assigned priestly right rather than casual permission.
- pob_phrase: is his portion
  simplified_phrase: is Aaron’s allotted share
  preserved_meaning: The bread belongs to Aaron as his assigned priestly provision.
  reasoning_layer_used: POB lexical decision for חלקו
  rationale: “Allotted share” makes the formal grant immediately understandable.
interpretive_expansions:
- pob_phrase: him / they / his offspring
  rendering: Aaron / Aaron and his descendants
  claim: The pronouns refer to Aaron and the continuing priestly line descended from him.
  evidence:
  - The immediate context concerns Aaron’s priestly rights.
  - The plural Hebrew verb points to more than Aaron alone.
  - The Greek parallel extends the gift to Aaron’s offspring.
  confidence: high
  alternatives_preserved:
  - The pronouns may be retained when the wider context is visible.
  external_witnesses:
  - The Greek parallel identifies Aaron’s offspring as beneficiaries.
- pob_phrase: the bread of the Presence
  rendering: the sacred bread placed in God’s presence
  claim: “Presence” refers to sacred bread set before God in the sanctuary.
  evidence:
  - The POB lexical rationale identifies it as sacred bread set before God.
  confidence: high
  alternatives_preserved:
  - bread of the Presence
  - showbread
translation_notes:
  risk_flags:
  - risk: “Are entitled to eat” makes the legal force more explicit than the Hebrew verb alone.
    mitigation: The priestly context and allotted-share clause support an established right.
  - risk: Replacing the cultic title in the main text may reduce recognition.
    mitigation: Footnote b retains both “bread of the Presence” and “showbread.”
