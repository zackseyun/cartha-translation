    mitigation: It preserves the POB’s contextual conclusion that the phrase indicates an honored rank rather than land inheritance.
  - risk: The Hebrew and Greek differ between courage and glory.
    mitigation: The main text follows the Hebrew, while footnote [a] preserves the Greek alternative.
