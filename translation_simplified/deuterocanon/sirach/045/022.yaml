translation:
  language: en
  text: But he will not inherit any land among the Israelites, and no share of the land will be assigned to him. The offerings made to Yahweh will be his share and his inheritance among the Israelites.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel has, “for he himself is your portion and inheritance,” instead of the Hebrew wording about offerings made to Yahweh.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: in their land he will not inherit
  simplified_phrase: he will not inherit any land among the Israelites
  preserved_meaning: The priestly line receives no landed inheritance in Israel.
  reasoning_layer_used: lexical decision for בארצם and לא ינחל
  rationale: The rewrite states the object of inheritance directly in natural English.
- pob_phrase: among them he will not be allotted an inheritance
  simplified_phrase: no share of the land will be assigned to him
  preserved_meaning: No territorial allotment is assigned to him among Israel.
  reasoning_layer_used: lexical decision for לא יחלק נחלה and Greek consistency check
  rationale: “Assigned a share of the land” makes the passive allotment sense immediately clear.
- pob_phrase: among the sons of Israel
  simplified_phrase: among the Israelites
  preserved_meaning: The phrase refers corporately to the people of Israel.
  reasoning_layer_used: lexical alternative documented for בתוך בני ישראל
  rationale: “Israelites” communicates the corporate reference without an opaque literal expression.
