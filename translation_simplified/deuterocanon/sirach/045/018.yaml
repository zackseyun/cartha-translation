translation:
  language: en
  text: Outsiders became angry with him and were jealous of him in the wilderness. They were people associated with Dathan and Abiram, along with Korah’s group, and they were filled with furious anger.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The surviving Hebrew is shorter: “Outsiders became angry with him and were jealous of him in the wilderness.” The Greek also names the people associated with Dathan, Abiram, and Korah.'
    reason: textual_variant
simplification_decisions:
- pob_phrase: Strangers grew angry with him
  simplified_phrase: Outsiders became angry with him
  preserved_meaning: People regarded as unauthorized or alien became angry with Aaron.
  reasoning_layer_used: Hebrew lexical decisions for זרים and ויחרו בו
  rationale: “Outsiders” avoids implying unknown people or ethnic foreigners while preserving the Hebrew category.
- pob_phrase: men of Dathan and Abiram, and the company of Korah
  simplified_phrase: people associated with Dathan and Abiram, along with Korah’s group
  preserved_meaning: The Greek identifies two coordinated groups of rebels.
  reasoning_layer_used: Greek lexical decisions and theological source decision
  rationale: The explicit coordination clearly distinguishes Dathan and Abiram’s associates from Korah’s group.
- pob_phrase: in fury and wrath
  simplified_phrase: filled with furious anger
  preserved_meaning: The Greek doublet strongly intensifies the rebels’ hostile anger.
  reasoning_layer_used: Greek lexical decision for ἐν θυμῷ καὶ ὀργῇ
  rationale: One direct phrase conveys the doublet’s intensifying force in ordinary English.
interpretive_expansions:
- pob_phrase: men of Dathan and Abiram
  rendering: people associated with Dathan and Abiram
  claim: These men belonged to the faction connected with Dathan and Abiram.
  evidence:
  - The Greek phrase οἱ περὶ identifies people associated with Dathan and Abiram.
  - The POB lexical rationale supports this sense.
  confidence: high
  alternatives_preserved:
  - men of Dathan and Abiram
  - followers of Dathan and Abiram
  external_witnesses:
  - Greek parallel in LXX Swete 1909
translation_notes:
  risk_flags:
  - risk: “Outsiders” could be mistaken for ethnic foreigners.
    mitigation: The named Israelite rebels and the footnote indicate unauthorized opponents.
  - risk: The names and intensified anger are absent from the surviving Hebrew.
    mitigation: The footnote clearly attributes the fuller details to the Greek witness.
