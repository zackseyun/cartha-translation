translation:
  language: en
  text: God also made a covenant with David son of Jesse, from the tribe of Judah. David’s royal inheritance belongs only to a single line of sons, but Aaron’s inheritance—the priesthood—belongs to his descendants.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Hebrew is shorter and compressed; the Greek preserves this fuller contrast between David’s royal line and Aaron’s descendants.
    reason: textual_variant
simplification_decisions:
- pob_phrase: And his covenant was with David son of Jesse
  simplified_phrase: God also made a covenant with David son of Jesse
  preserved_meaning: God established his covenant with David.
  reasoning_layer_used: Hebrew lexical decision and contextual antecedent
  rationale: The active sentence identifies the unclear pronoun by its contextual referent.
- pob_phrase: the inheritance of the king is from son to son alone
  simplified_phrase: David’s royal inheritance belongs only to a single line of sons
  preserved_meaning: The royal inheritance remains within one exclusive Davidic dynastic line.
  reasoning_layer_used: Greek lexical rationale and POB textual-variant footnote
  rationale: This states dynastic exclusivity without implying that every successor must be the previous king’s son.
- pob_phrase: but the inheritance of Aaron is also for his offspring
  simplified_phrase: but Aaron’s inheritance—the priesthood—belongs to his descendants
  preserved_meaning: Aaron’s hereditary priestly inheritance continues among his descendants.
  reasoning_layer_used: Hebrew fragment, Greek parallel, and theological decision
  rationale: The wording identifies the priesthood while preserving the inheritance image.
interpretive_expansions:
- pob_phrase: his covenant
  rendering: God also made a covenant
  claim: God is the one whose covenant was made with David.
  evidence:
  - The POB rationale identifies God as the contextual antecedent of “his.”
  confidence: high
  alternatives_preserved:
  - his covenant was with David
- pob_phrase: the inheritance of Aaron
  rendering: Aaron’s inheritance—the priesthood
  claim: Aaron’s inheritance refers to the hereditary priesthood.
  evidence:
  - The Hebrew fragment names the high priesthood as belonging to Aaron and his offspring forever.
  - The POB rationale says the Greek restates this hereditary priesthood as Aaron’s inheritance.
  confidence: high
  alternatives_preserved:
  - Aaron’s inheritance
translation_notes:
  risk_flags:
  - risk: The royal-priestly contrast depends on the fuller Greek parallel because the surviving Hebrew is compressed.
    mitigation: The footnote explains the textual situation, and the main text follows the audited POB decision.
  - risk: Naming Aaron’s inheritance as the priesthood makes an implicit referent explicit.
    mitigation: The Hebrew fragment and POB rationale directly identify it with hereditary priesthood.
