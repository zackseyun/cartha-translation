translation:
  language: en
  text: He gave him splendor and attended to him with his glory.[a] He put the horns of a wild ox around him[b] and dressed him in garments hung with bells.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek reads: “He established for him an everlasting covenant and gave him the priesthood of the people. He blessed him with adornment and wrapped him in a glorious robe.” The surviving Hebrew differs substantially.'
    reason: alternative_reading
  - marker: b
    text: The difficult Hebrew phrase may instead mean “he gave him the lofty strength of a wild ox.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: put splendor upon him
  simplified_phrase: gave him splendor
  preserved_meaning: Splendor was bestowed on him.
  reasoning_layer_used: Hebrew lexical decision for הוד and נתן עליו
  rationale: The common verb “gave” expresses the bestowal of splendor naturally.
- pob_phrase: ministered to him with his glory
  simplified_phrase: attended to him with his glory
  preserved_meaning: God honored him through an unusual act of attendance involving divine glory.
  reasoning_layer_used: Hebrew lexical decisions for וישרתהו and בכבודו
  rationale: “Attended to him” clarifies the service language while preserving the unusual Hebrew wording.
- pob_phrase: clothed him with bells
  simplified_phrase: dressed him in garments hung with bells
  preserved_meaning: His priestly clothing bore bells.
  reasoning_layer_used: Hebrew lexical decision for וילבישהו פעמונים and the investiture context
  rationale: Naming the garments avoids suggesting that the bells themselves were clothing.
interpretive_expansions:
- pob_phrase: clothed him with bells
  rendering: dressed him in garments hung with bells
  claim: The bells were attached to his priestly garments.
  evidence:
  - The Hebrew verb describes clothing him.
  - The context concerns ceremonial investiture.
  - The POB rationale identifies priestly vestment imagery.
  confidence: high
  alternatives_preserved:
  - clothed him with bells
  - put bells on him
