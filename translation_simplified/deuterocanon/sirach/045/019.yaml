translation:
  language: en
  text: Those associated with Dathan and Abiram, together with Korah’s company, were fierce in their anger.[a] Yahweh saw them and was enraged. In the heat of his anger, he destroyed them.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew wording is compressed; the phrase can also be translated “in the strength of their anger.”
    reason: lexical_alternative
  - marker: b
    text: The Greek parallel adds that they were brought to an end and consumed by God’s flame; the Hebrew is shorter.
    reason: alternative_reading
