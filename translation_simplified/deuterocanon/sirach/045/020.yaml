simplification_decisions:
- pob_phrase: And he added honor to Aaron
  simplified_phrase: He increased Aaron’s honor
  preserved_meaning: Aaron received greater dignity and status.
  reasoning_layer_used: Hebrew lexical decision supported by the Greek parallel
  rationale: “Increased Aaron’s honor” is more natural English while preserving the source verb’s sense of adding or increasing.
- pob_phrase: gave him his inheritance
  simplified_phrase: gave him his inheritance—the priestly share assigned to him
  preserved_meaning: Aaron received the portion appointed to him for his priestly office.
  reasoning_layer_used: POB theological decision on the nature of Aaron’s inheritance
  rationale: The brief explanation prevents readers from assuming that the inheritance must be landed property.
interpretive_expansions:
- pob_phrase: his inheritance
  rendering: his inheritance—the priestly share assigned to him
  claim: The inheritance is Aaron’s divinely assigned priestly portion.
  evidence:
  - The POB theological rationale identifies the immediate sense as an assigned priestly portion.
  - Hebrew נחלה can denote an inheritance or allotted possession.
  - The Greek κληρονομίαν confirms the inheritance or portion sense.
  confidence: high
  alternatives_preserved:
  - The term “inheritance” remains in the text to preserve its covenantal resonance.
  - The wording does not specify land or particular priestly provisions.
