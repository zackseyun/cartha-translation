translation:
  language: en
  text: Moses was beloved by God and men,[a] and he is remembered with blessing.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “men”; the Greek parallel can also mean “people.”
    reason: alternative_reading
  - marker: b
    text: More literally, “his memory is for good.”
    reason: lexical_alternative
  - marker: c
    text: The Greek parallel begins with additional words about a merciful man who found favor with everyone; these words are absent from the Hebrew witness used here.
    reason: textual_variant
simplification_decisions:
- pob_phrase: Beloved by God and men was Moses
  simplified_phrase: Moses was beloved by God and men
  preserved_meaning: Moses received exceptional love and honor from God and men.
  reasoning_layer_used: POB lexical decisions for אהוב and ואנשים
  rationale: Ordinary English word order makes the statement immediately clear while retaining “beloved” and the Hebrew wording “men.”
- pob_phrase: whose memory is for blessing
  simplified_phrase: and he is remembered with blessing
  preserved_meaning: Moses continues to be remembered in a blessed and honorable way.
  reasoning_layer_used: POB lexical decision for זכרו לטובה and Greek consistency check
  rationale: The active expression explains the commemorative Hebrew idiom without reducing it to generic benefit.
