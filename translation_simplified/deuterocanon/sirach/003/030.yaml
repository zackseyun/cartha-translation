  rationale: “Puts out” is more common English while preserving the concrete image.
- pob_phrase: almsgiving
  simplified_phrase: giving to the poor
  preserved_meaning: Acts of charitable mercy toward needy people are in view.
  reasoning_layer_used: The lexical and theological decisions identify צדקה here as concrete charitable giving.
