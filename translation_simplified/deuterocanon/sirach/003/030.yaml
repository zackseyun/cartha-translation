translation:
  language: en
  text: Water puts out a blazing fire; in the same way, giving to the poor[a] makes atonement for sin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “righteousness,” but the Greek parallel supports “giving to the poor” here.
    reason: lexical_alternative
  - marker: b
    text: The Greek has “sins” in the plural; the Hebrew “sin” may refer to sin in general.
    reason: alternative_reading
