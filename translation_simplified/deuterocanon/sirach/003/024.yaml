simplification_decisions:
- pob_phrase: the speculations of the sons of man
  simplified_phrase: People hold many speculative ideas
  preserved_meaning: Human beings form many uncertain notions of their own.
  reasoning_layer_used: POB lexical and theological decisions on עֶשְׁתּוֹנֵי and בְּנֵי אָדָם
  rationale: This recasts the Hebrew idiom in natural English while retaining the warning about human speculation.
- pob_phrase: evil imaginings lead astray
  simplified_phrase: evil imaginings lead them astray
  preserved_meaning: Morally evil products of the mind actively misdirect people.
  reasoning_layer_used: POB lexical decisions on דִמְיוֹנוֹת, רָעוֹת, and מַתְעוֹת
  rationale: The wording keeps both the moral force of “evil” and the image of being led off course.
