translation:
  language: en
  text: A father's righteousness[a] will never be erased. It will be planted in place of sins.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may refer either to righteous care shown toward a father or to the father's own righteousness.
    reason: lexical_alternative
  - marker: b
    text: The Greek reads, “A father's charity will not be forgotten, and it will be built up for you in place of sins.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: will not be wiped away
  simplified_phrase: will never be erased
  preserved_meaning: The righteousness will not be removed from record or memory.
  reasoning_layer_used: Hebrew lexical decision for לֹא תִּמָּחֶה
  rationale: “Erased” makes the record-like image immediately clear.
- pob_phrase: and in place of sins it will be planted
  simplified_phrase: It will be planted in place of sins.
  preserved_meaning: The planting image and the text's strong substitution language both remain.
  reasoning_layer_used: Hebrew lexical decisions for וּתְמוּר and הִיא תְּנַתֵּעַ
  rationale: A separate sentence clarifies the unusual image without explaining away its force.
translation_notes:
  risk_flags:
  - risk: “A father's righteousness” remains open to more than one relationship between the father and the righteousness.
    mitigation: Footnote a preserves the documented Hebrew ambiguity.
  - risk: “In place of sins” could be read as defining a specific doctrine of atonement or merit.
    mitigation: The wording remains unexplained so the verse's theological tension is not resolved.
