translation:
  language: en
  text: Even if a man has trouble understanding things, treat him with patience. Never humiliate him as long as he lives.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek reads, “Do not dishonor him with all your strength,” while the Hebrew reads, “as long as he lives.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: lacks understanding
  simplified_phrase: has trouble understanding things
  preserved_meaning: The man is deficient in understanding or good sense.
  reasoning_layer_used: The Hebrew lexical decision and Greek parallel support “understanding.”
  rationale: The expanded wording is easier to grasp without changing the kind of deficiency described.
- pob_phrase: be patient with him
  simplified_phrase: treat him with patience
  preserved_meaning: He must receive patient forbearance rather than harsh treatment.
  reasoning_layer_used: The POB lexical rationale uses the Greek parallel to clarify the Hebrew idiom.
  rationale: The active wording makes the required conduct direct and natural.
- pob_phrase: do not shame him all the days of his life
  simplified_phrase: Never humiliate him as long as he lives
  preserved_meaning: He must not be subjected to disgrace at any time in his life.
  reasoning_layer_used: The Hebrew primary witness and POB lexical decisions govern both clauses.
  rationale: Common wording preserves the force and lifelong scope of the command.
translation_notes:
  risk_flags:
  - risk: “A man” may sound limited to males rather than representative wisdom instruction.
    mitigation: It is retained because the POB deliberately preserves the Hebrew singular masculine form.
