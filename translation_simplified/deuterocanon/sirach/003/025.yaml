translation:
  language: en
  text: A person with a heavy heart will come to ruin in the end.[a][b] And a person who loves good things will be guided by them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says the heart will “become foul” or “rot,” an image of a disastrous end.
    reason: lexical_alternative
  - marker: b
    text: “Heavy heart” may describe a morally or spiritually disordered inner life, not merely sadness; the Greek parallel reads “hard heart.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: A heavy heart will come to ruin in the end
  simplified_phrase: A person with a heavy heart will come to ruin in the end
  preserved_meaning: The condition of the heart leads the person to a disastrous outcome.
  reasoning_layer_used: Hebrew lexical decisions and generic-subject theology
  rationale: Making the person explicit keeps the image from sounding like an emotion itself is ruined.
- pob_phrase: and one who loves good things will be led by them
  simplified_phrase: And a person who loves good things will be guided by them
  preserved_meaning: The good things a person loves direct that person’s course.
  reasoning_layer_used: POB lexical decision for יִנְהַג בָּהֶם
  rationale: “Guided” is natural English and retains the broad phrase “good things.”
interpretive_expansions:
- pob_phrase: a heavy heart
  rendering: 'Footnote: “Heavy heart” may describe a morally or spiritually disordered inner life, not merely sadness.'
  claim: The image likely concerns the inner person’s moral or spiritual condition rather than ordinary sorrow alone.
  evidence:
  - The Hebrew preserves the concrete image of a heavy heart.
  - The warning of eventual ruin points beyond a passing emotion.
  confidence: moderate
  alternatives_preserved:
  - ordinary sadness
  - a hard heart
  external_witnesses:
  - The Greek parallel reads “a hard heart.”
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “heavy heart” only as sadness.
    mitigation: The footnote gives the likely moral or spiritual sense without presenting it as certain.
  - risk: “Good things” may refer broadly to benefits, pleasures, or good gifts.
    mitigation: The main text keeps the broad wording instead of narrowing the meaning.
