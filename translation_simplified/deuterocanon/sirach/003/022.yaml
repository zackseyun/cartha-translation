translation:
  language: en
  text: Think carefully about what you have been commanded.[a] Do not concern yourself with hidden matters.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may mean “what you have been permitted or authorized to consider”; the Greek reads “what you have been commanded.”
