  preserved_meaning: The hearer is called to give thoughtful attention.
  reasoning_layer_used: POB lexical decision for הִתְבּוֹנֵן
  rationale: The expanded wording expresses the verb's reflective force in familiar English.
- pob_phrase: you have no business with
  simplified_phrase: Do not concern yourself with
  preserved_meaning: Hidden matters are outside the hearer's proper sphere of involvement.
  reasoning_layer_used: POB lexical decision for וְאֵין לְךָ עֵסֶק
  rationale: A direct command avoids the potentially casual modern idiom “no business with.”
- pob_phrase: hidden things
  simplified_phrase: hidden matters
  preserved_meaning: The phrase refers to matters concealed from human inquiry.
  reasoning_layer_used: POB lexical decision for בְּנִסְתָּרוֹת
  rationale: “Matters” makes the abstract plural natural without importing the theological associations of “mysteries.”
