translation:
  language: en
  text: A father’s blessing makes roots firm,[a] but a mother’s curse pulls a plant up by the roots.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel says, “A father’s blessing strengthens his children’s homes, but a mother’s curse uproots their foundations.” The Hebrew uses the images of roots and a plant.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: establishes roots
  simplified_phrase: makes roots firm
  preserved_meaning: The blessing causes the roots to become securely established.
  reasoning_layer_used: Hebrew lexical decision for תְּיַסֵּד and the collective sense of שֹׁרֶשׁ
  rationale: Common wording replaces the abstract verb while keeping the Hebrew root image.
- pob_phrase: uproots a plant
  simplified_phrase: pulls a plant up by the roots
  preserved_meaning: The curse tears out what has been planted.
  reasoning_layer_used: Hebrew lexical decisions for תִּנְתּשׁ and נֶטַע
  rationale: The expanded everyday phrase makes the force of “uproots” immediately clear.
translation_notes:
  risk_flags:
  - risk: Readers may take the agricultural language only literally.
    mitigation: The balanced blessing-and-curse structure signals that the plant imagery describes their lasting effects.
