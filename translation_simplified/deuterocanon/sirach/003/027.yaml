translation:
  language: en
  text: The eye cannot see light without its pupil; a person cannot have wisdom without knowledge.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The surviving Greek text has a different saying here: “A hard heart will be weighed down with pains, and the sinner will add sins upon sins.”'
    reason: textual_variant
simplification_decisions:
- pob_phrase: Without the pupil, light is lacking
  simplified_phrase: The eye cannot see light without its pupil
  preserved_meaning: The pupil is necessary for the eye’s relation to light.
  reasoning_layer_used: Hebrew lexical decisions for אִישׁוֹן and אוֹר
  rationale: The wording identifies the eye and turns the compressed proverb into natural English.
- pob_phrase: without knowledge, wisdom is lacking
  simplified_phrase: a person cannot have wisdom without knowledge
  preserved_meaning: Wisdom is absent when knowledge is absent.
  reasoning_layer_used: Hebrew lexical decisions for דַעַת, חָכְמָה, and חסר
  rationale: The personal subject makes the proverb easier to understand while keeping knowledge and wisdom distinct.
interpretive_expansions:
- pob_phrase: Without the pupil, light is lacking
  rendering: The eye cannot see light without its pupil
  claim: The first line concerns the pupil’s role in sight.
  evidence:
  - The Hebrew word אִישׁוֹן denotes the eye’s pupil in this context.
  - The paired reference to light supplies the domain of sight.
  confidence: high
  alternatives_preserved:
  - The more literal sense is that light is lacking without the pupil.
- pob_phrase: without knowledge, wisdom is lacking
  rendering: a person cannot have wisdom without knowledge
  claim: The proverb applies the lack of knowledge and wisdom to a person.
  evidence:
  - Knowledge and wisdom are human capacities in the proverb’s parallel structure.
  confidence: high
  alternatives_preserved:
  - The Hebrew leaves the human subject implicit.
translation_notes:
  risk_flags:
  - risk: “Cannot see light” makes the visual function more explicit than the Hebrew’s concise “light is lacking.”
    mitigation: The pupil and light together strongly establish sight while preserving the concrete image.
  - risk: The Hebrew and Greek witnesses preserve substantially different sayings.
    mitigation: The Hebrew controls the main text, and the Greek saying remains in a textual-variant footnote.
