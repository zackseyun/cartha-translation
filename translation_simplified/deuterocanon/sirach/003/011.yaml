translation:
  language: en
  text: For a man’s honor is bound up with his father’s honor, and anyone who dishonors his mother[a] increases sin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “curses his mother.” The Hebrew can refer specifically to cursing, but it can also mean treating her with contempt.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek version has a different second line: “A mother in disgrace brings shame on her children.”'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: a man's honor is the honor of his father
  simplified_phrase: a man’s honor is bound up with his father’s honor
  preserved_meaning: A man’s honor and his father’s honor are closely connected.
  reasoning_layer_used: POB lexical decision for כִּבּוּד אָבִיו
  rationale: “Bound up with” makes the terse Hebrew relationship understandable without choosing only derivation or strict identity.
- pob_phrase: one who dishonors his mother
  simplified_phrase: anyone who dishonors his mother
  preserved_meaning: The warning applies proverbially to every person who treats his mother with contempt.
  reasoning_layer_used: POB theological decision for מְקַלֵּל אִמּוֹ
  rationale: “Anyone” is smoother English while retaining the chosen broad sense “dishonors.”
- pob_phrase: multiplies sin
  simplified_phrase: increases sin
  preserved_meaning: Dishonoring one’s mother causes sin to grow.
  reasoning_layer_used: POB lexical decision for וּמַרְבֶּה חֵטְא
  rationale: “Increases” clearly expresses the active growth of sin in common English.
translation_notes:
  risk_flags:
  - risk: “Bound up with” may sound less exact than the Hebrew’s terse equation.
    mitigation: The wording preserves the close identification while avoiding a disputed claim that honor comes only from the father.
  - risk: “Dishonors” is broader than the possible specific meaning “curses.”
    mitigation: The lexical alternative is retained in footnote a.
