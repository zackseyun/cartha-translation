translation:
  language: en
  text: Do not try to uncover matters beyond your capacity, because you have been shown things that are too great for you.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Do not investigate things greater than you.” The Hebrew verb is difficult; the Greek says not to be overly curious.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also mean, “you have seen many things beyond you,” but the Greek supports “you have been shown.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Do not probe into what is beyond you
  simplified_phrase: Do not try to uncover matters beyond your capacity
  preserved_meaning: The warning concerns active inquiry into matters outside a person’s proper scope or capacity.
  reasoning_layer_used: POB lexical decisions and Greek parallel
  rationale: This wording clarifies the difficult verb without reducing the limitation to intellectual understanding alone.
- pob_phrase: for what is too great for you has been shown to you
  simplified_phrase: because you have been shown things that are too great for you
  preserved_meaning: The passive voice presents surpassing matters as disclosed to the hearer.
  reasoning_layer_used: POB theological decision on הָרְאֵיתָ
  rationale: Ordinary clause order makes the reason easier to follow while retaining the chosen passive reading.
