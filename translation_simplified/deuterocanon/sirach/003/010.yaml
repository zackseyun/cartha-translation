translation:
  language: en
  text: Do not seek honor for yourself through your father's disgrace,[a] because his disgrace brings you no honor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Do not seek honor for yourself while your father is in disgrace.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: glorify yourself
  simplified_phrase: seek honor for yourself
  preserved_meaning: The command forbids trying to gain personal honor.
  reasoning_layer_used: The Hebrew reflexive verb and Greek parallel both indicate seeking honor or glory for oneself.
  rationale: “Seek honor” states the reflexive idea in natural modern English.
- pob_phrase: in your father's disgrace
  simplified_phrase: through your father's disgrace
  preserved_meaning: The father's dishonor must not become a means of gaining honor for oneself.
  reasoning_layer_used: The lexical decision allows the Hebrew preposition to mean “in” or instrumentally “through.”
  rationale: “Through” makes the likely instrumental sense immediately understandable.
- pob_phrase: it is no honor to you
  simplified_phrase: his disgrace brings you no honor
  preserved_meaning: A father's disgrace cannot confer honor on his child.
  reasoning_layer_used: The lexical alternatives permit “it brings you no honor,” supported by the Hebrew and Greek.
  rationale: Naming “his disgrace” removes an unclear pronoun without changing the moral point.
translation_notes:
  risk_flags:
  - risk: The Hebrew preposition may describe the setting rather than the means of seeking honor.
    mitigation: The footnote preserves the non-instrumental reading with “while.”
