translation:
  language: en
  text: People will call a man who does good fortunate because of the way he lives.[a] When he stumbles, he will find support.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek first line says, “The one who repays favors remembers what comes afterward.” It differs substantially from the surviving Hebrew, though both speak of finding support when one falls.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: will be called blessed for his ways
  simplified_phrase: People will call ... fortunate because of the way he lives
  preserved_meaning: His good conduct leads others to acclaim him as blessed or fortunate.
  reasoning_layer_used: Hebrew lexical decisions for יקראנו and בדרכיו
  rationale: The active sentence explains the idiom while keeping its public commendation and conduct metaphor.
- pob_phrase: at the time of his stumbling
  simplified_phrase: When he stumbles
  preserved_meaning: He experiences a time of slipping, trouble, or possible downfall.
  reasoning_layer_used: Hebrew מוט with Greek πτώσεως as a consistency check
  rationale: The shorter clause preserves the source image without suggesting final ruin.
- pob_phrase: he will find support
  simplified_phrase: he will find support
  preserved_meaning: He will receive something or someone to lean on in difficulty.
  reasoning_layer_used: Hebrew משען and Greek στήριγμα
  rationale: The existing wording is already natural and preserves both literal and figurative senses.
interpretive_expansions:
- pob_phrase: will be called blessed
  rendering: People will call ... fortunate
  claim: Other people are the implied ones who publicly acclaim the man.
  evidence:
  - The POB rationale describes the Hebrew expression as public acclamation.
  - The passive-like POB wording implies an unstated human agent.
  confidence: moderate
  alternatives_preserved:
  - will be called blessed
  - will be proclaimed fortunate
translation_notes:
  risk_flags:
  - risk: “Fortunate” may be mistaken for mere luck rather than an acclaimed blessed state.
    mitigation: The phrase connects his fortunate standing directly to the good way he lives.
  - risk: “Stumbles” may refer to hardship, failure, or broader downfall.
    mitigation: The broad source image is retained rather than narrowed to one kind of trouble.
