translation:
  language: en
  text: A wise person’s heart understands wise sayings.[a] An ear that listens carefully delights in wisdom.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sayings” may also mean proverbs or parables; the Greek parallel has “parable” in the singular.
    reason: lexical_alternative
  - marker: b
    text: The Greek parallel reads approximately, “the ear of a hearer is the desire of a wise person,” rather than “an ear that listens carefully delights in wisdom.” This translation follows the surviving Hebrew text.
    reason: textual_variant
simplification_decisions:
- pob_phrase: The heart of the wise understands the sayings of the wise
  simplified_phrase: A wise person’s heart understands wise sayings
  preserved_meaning: A wise person inwardly grasps the teaching given by wise people.
  reasoning_layer_used: POB lexical decisions for לֵב, חָכָם, יָבִין, and מִשְׁלֵי
  rationale: The wording makes the generic person explicit while preserving the heart image and broad sense of wise sayings.
- pob_phrase: an attentive ear rejoices in wisdom
  simplified_phrase: An ear that listens carefully delights in wisdom
  preserved_meaning: Careful listening finds joy in wisdom.
  reasoning_layer_used: POB lexical decisions for אֹזֶן, מַקְשֶׁבֶת, לְחָכְמָה, and תִּשְׂמָח
  rationale: The participle becomes a natural English clause while retaining the ear image and joy in wisdom.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “heart” as emotion alone.
    mitigation: The verb “understands” signals the intended faculty of thought while preserving the Hebrew image.
  - risk: “Delights” is less elevated than POB’s “rejoices.”
    mitigation: It retains genuine joy in wisdom while reading naturally in common English.
