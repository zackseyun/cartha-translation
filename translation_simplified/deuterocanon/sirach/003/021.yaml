translation:
  language: en
  text: Do not seek matters beyond your ability, and do not investigate what is hidden from you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel says, “Do not seek what is harder than you, and do not examine what is stronger than you.” It emphasizes matters beyond your ability.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: seek what is too wondrous for you
  simplified_phrase: seek matters beyond your ability
  preserved_meaning: The warning concerns matters beyond a person’s proper reach, not wonders or miracles in general.
  reasoning_layer_used: Hebrew lexical decision supported by the Greek parallel
  rationale: This states the capacity limit clearly without narrowing the command to intellectual understanding.
- pob_phrase: search out what is hidden from you
  simplified_phrase: investigate what is hidden from you
  preserved_meaning: The second command warns against thoroughly examining concealed matters.
  reasoning_layer_used: Hebrew lexical decisions for חקר and כסה
  rationale: “Investigate” expresses deliberate inquiry in familiar modern English.
interpretive_expansions:
- pob_phrase: too wondrous for you
  rendering: matters beyond your ability
  claim: The phrase refers to matters beyond a person’s capacity rather than wonders in general.
  evidence:
  - The Hebrew construction presents these matters as beyond the person’s proper reach.
  - The Greek parallel describes them as harder or stronger than the person.
  - The POB reasoning rejects a blanket ban on inquiry.
  confidence: high
  alternatives_preserved:
  - matters too wondrous for you
  - matters beyond your proper reach
  external_witnesses:
  - Greek parallel in Sirach 3:21
translation_notes:
  risk_flags:
  - risk: The wording “beyond your ability” makes the contextual force more explicit than the Hebrew image alone.
    mitigation: The Hebrew construction, Greek parallel, and POB lexical rationale all support this capacity-based meaning.
