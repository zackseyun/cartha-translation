translation:
  language: en
  text: Whoever treats his father with contempt acts arrogantly.[a] Whoever provokes his mother is cursed by his Creator.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “acts presumptuously”; the Greek parallel says “is a blasphemer.”
    reason: lexical_alternative
  - marker: b
    text: The Greek parallel says “is cursed by the Lord.” The main text follows the adopted reading of the Hebrew, “is cursed by his Creator.”
    reason: alternative_reading
  - marker: c
    text: 'The Hebrew wording can also be understood: “Whoever curses his mother provokes his Creator.”'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: one who despises his father
  simplified_phrase: Whoever treats his father with contempt
  preserved_meaning: He regards and treats his father with scorn.
  reasoning_layer_used: Lexical decision for בּוֹזֶה
  rationale: The fuller phrase makes the offense immediately clear.
- pob_phrase: is insolent
  simplified_phrase: acts arrogantly
  preserved_meaning: Despising his father is arrogant, presumptuous conduct.
  reasoning_layer_used: Lexical and theological decisions for מֵזִיד
  rationale: The action-focused wording is familiar and retains the Hebrew term’s moral force.
- pob_phrase: For ... and ...
  simplified_phrase: Two parallel sentences beginning with “Whoever”
  preserved_meaning: Both forms of dishonoring a parent receive direct condemnation.
  reasoning_layer_used: POB syntax and parental parallelism
  rationale: Two sentences make each warning easier to follow.
translation_notes:
  risk_flags:
