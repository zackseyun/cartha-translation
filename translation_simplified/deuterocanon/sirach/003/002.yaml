translation:
  language: en
  text: Yahweh has given the father a place of honor above the children. He has also firmly established the mother's authority over her children.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “confirmed the mother's rightful claim over her children.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: honored the father above the children
  simplified_phrase: given the father a place of honor above the children
  preserved_meaning: Yahweh gives the father honored standing in relation to the children.
  reasoning_layer_used: Hebrew lexical decision for כִּבֵּד and לִפְנֵי הַבָּנִים
  rationale: The recast clause makes the father's honored position clear while retaining the image of being above the children.
- pob_phrase: and he established
  simplified_phrase: He has also firmly established
  preserved_meaning: Yahweh confirms and makes the mother's standing firm.
  reasoning_layer_used: Hebrew lexical decision for קִיֵּם and Greek parallel ἐστερέωσεν
  rationale: A new sentence reduces complexity, while “firmly” preserves the verb's force of making something secure.
- pob_phrase: the mother's authority over her children
  simplified_phrase: the mother's authority over her children
  preserved_meaning: The mother has a divinely established, rightful standing over her children.
  reasoning_layer_used: Lexical and theological decision for מִשְׁפַּט הָאֵם
  rationale: The key term “authority” is retained because replacing it could weaken the verse's legal and relational force.
translation_notes:
  risk_flags:
  - risk: “Above” could be mistaken as a statement that the father has greater human worth than the children.
    mitigation: “A place of honor” frames the comparison as family standing rather than personal value.
  - risk: “Authority” could be read as unlimited power.
    mitigation: The footnote identifies it as the mother's rightful family claim without expanding its scope.
