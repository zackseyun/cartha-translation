translation:
  language: en
  text: Do not hurry to heal a scoffer’s wound. It has no cure, for they were planted from an evil planting.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew ending is awkward and plural. The Greek reads, “for a plant of wickedness has taken root in him.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the wound of a scoffer
  simplified_phrase: a scoffer’s wound
  preserved_meaning: The scoffer remains pictured as having a wound that needs healing.
  reasoning_layer_used: POB lexical decision for מַכַּת לֵץ
  rationale: The possessive form is more natural while preserving the injury metaphor.
- pob_phrase: there is no healing for it
  simplified_phrase: It has no cure
  preserved_meaning: The wound is presented as incurable.
  reasoning_layer_used: POB lexical decision for אֵין לָהּ רְפוּאָה
  rationale: This states the same inability in direct, common English.
- pob_phrase: from an evil planting
  simplified_phrase: from an evil planting
  preserved_meaning: The difficult ending retains its botanical image of an evil origin.
  reasoning_layer_used: POB lexical decision for מִנֶּטַע רַע and theological decision on the Hebrew-Greek mismatch
  rationale: Keeping “planting” avoids suggesting biological ancestry and preserves the Hebrew-based reading.
translation_notes:
  risk_flags:
  - risk: The abrupt plural “they” has no clear singular antecedent in English.
    mitigation: It is retained to reflect the transmitted Hebrew, and the footnote explains the mismatch.
  - risk: “Evil planting” is unusual English.
    mitigation: The wording preserves the source image without falsely resolving the textual difficulty.
