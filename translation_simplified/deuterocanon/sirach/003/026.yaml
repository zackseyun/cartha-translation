translation:
  language: en
  text: A heavy heart increases its own pain,[a] and anyone who acts recklessly[b] piles sin on top of sin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel reads, “A hard heart will be afflicted in the end” and “A hard heart will be weighed down in the end.”
    reason: alternative_reading
  - marker: b
    text: The Hebrew word is difficult and may also suggest acting wildly, deceiving oneself, or boasting arrogantly.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: multiplies its pains
  simplified_phrase: increases its own pain
  preserved_meaning: A heavy heart causes its suffering to grow.
  reasoning_layer_used: Hebrew lexical decisions for יִרְבּוּ and מַכְאֹבָיו
  rationale: Common wording makes the heart’s relation to the pain immediately clear.
- pob_phrase: one who behaves recklessly
  simplified_phrase: anyone who acts recklessly
  preserved_meaning: The person’s conduct is morally undisciplined without narrowing the difficult Hebrew term.
  reasoning_layer_used: Hebrew lexical decision for וּמִתְהוֹלֵל
  rationale: The active wording is shorter and more natural while retaining the chosen broad sense.
- pob_phrase: adds sin upon sin
  simplified_phrase: piles sin on top of sin
  preserved_meaning: Repeated wrongdoing accumulates one sin after another.
  reasoning_layer_used: Hebrew lexical decisions for מוֹסִיף and עָוֹן עַל עָוֹן
  rationale: The concrete piling image communicates accumulation in ordinary English.
