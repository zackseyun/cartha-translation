translation:
  language: en
  text: Those who love Wisdom love life. Those who seek her will receive favor from the LORD.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel says, “Those who rise early to seek her will be filled with gladness.”
