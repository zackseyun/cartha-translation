simplification_decisions:
- pob_phrase: Those who love her love life
  simplified_phrase: Those who love Wisdom love life
  preserved_meaning: The feminine pronoun refers to wisdom personified as a woman in the surrounding context.
  reasoning_layer_used: POB lexical decision for אֹהֲבֶיהָ and immediate context
  rationale: Naming Wisdom makes the reference clear when the verse is read by itself.
- pob_phrase: will obtain favor from Yahweh
  simplified_phrase: will receive favor from the LORD
  preserved_meaning: Those who seek Wisdom gain the LORD’s favorable regard.
  reasoning_layer_used: POB lexical decisions for יָפִיקוּ, רָצוֹן, and מֵיהֹוָה
  rationale: “Receive” is more familiar than “obtain,” while “the LORD” follows project doctrine.
- pob_phrase: and those who seek her
  simplified_phrase: Those who seek her
  preserved_meaning: The second promise concerns those who pursue Wisdom.
  reasoning_layer_used: Extant Hebrew main reading and independent grounding review
  rationale: A new sentence improves readability without importing the Greek implication of eager or early seeking.
interpretive_expansions:
- pob_phrase: her
  rendering: Wisdom
  claim: The feminine figure loved and sought is Wisdom.
  evidence:
  - The POB lexical rationale identifies the feminine suffix as referring to wisdom in context.
  - The surrounding passage personifies Wisdom as a woman.
  confidence: high
  alternatives_preserved:
  - her
translation_notes:
  risk_flags:
  - risk: Capitalizing “Wisdom” may suggest a formal title more strongly than the Hebrew requires.
    mitigation: The capitalization marks the established personification without identifying Wisdom as a separate divine being.
  - risk: The Greek parallel gives a substantially different second promise.
    mitigation: The main text follows the extant Hebrew, while the Greek wording is preserved in the footnote.
