translation:
  language: en
  text: Wisdom has taught her children, and she testifies in favor of everyone who understands her.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel says, “and she lays hold of those who seek her.” The surviving Hebrew says that she testifies for those who understand her.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: has instructed her children
  simplified_phrase: has taught her children
  preserved_meaning: Personified Wisdom educates those who belong to her.
  reasoning_layer_used: Lexical decision for לִמְּדָה and theological decision on personified Wisdom
  rationale: “Taught” states the same action in more common English while retaining Wisdom’s maternal personification.
- pob_phrase: she bears witness for all
  simplified_phrase: she testifies in favor of everyone
  preserved_meaning: Wisdom gives favorable testimony for all such people.
  reasoning_layer_used: Lexical decisions for וְתָעִיד and לְכָל
  rationale: “Testifies in favor of” preserves the legal image while making the favorable sense of “for” clear.
- pob_phrase: who have understanding in her
  simplified_phrase: who understands her
  preserved_meaning: These people possess discernment concerning and in relation to Wisdom.
  reasoning_layer_used: Lexical decisions for מְבִינִים and בָּהּ
  rationale: The direct verb phrase removes an unnatural English construction without depersonalizing Wisdom.
interpretive_expansions:
- pob_phrase: bears witness for
  rendering: testifies in favor of
  claim: Wisdom’s testimony is favorable rather than neutral or adverse.
  evidence:
  - The POB lexical rationale says “for” best conveys the likely commendatory sense.
  confidence: moderate
  alternatives_preserved:
  - testifies for
translation_notes:
  risk_flags:
  - risk: “Understands her” may sound more direct than the Hebrew relational phrase “have understanding in her.”
    mitigation: The wording keeps Wisdom as the object of discernment and follows a documented lexical alternative.
  - risk: The Greek parallel has a substantially different second clause.
    mitigation: The main text follows the extant Hebrew, and the Greek reading remains in the footnote.
