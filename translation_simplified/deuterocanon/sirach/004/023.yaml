translation:
  language: en
  text: Do not hold back a word in the world. Do not keep your wisdom hidden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel says, “Do not hinder a word in a time of deliverance,” or “salvation.” The Hebrew reads “in the world.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Do not withhold a word
