  preserved_meaning: The command forbids keeping back a word while preserving the source’s concrete expression.
  reasoning_layer_used: Hebrew lexical decisions for אַל תִּמְנַע דִּבֵּר
  rationale: “Hold back” is common English, while “a word” avoids adding a personal or situational message.
- pob_phrase: and do not hide your wisdom
  simplified_phrase: Do not keep your wisdom hidden
  preserved_meaning: The second command forbids concealing the wisdom one possesses.
  reasoning_layer_used: Hebrew lexical decisions for וְאַל תַּצְפִּין אֶת חָכְמָתֶךָ
  rationale: A separate sentence makes the command easier to follow while retaining “wisdom.”
