translation:
  language: en
  text: My son, do not mock a poor person's life,[a] and do not cause pain to a poor person whose soul is deeply distressed.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek reads, “Do not deprive the poor of life,” which may also mean, “Do not deprive the poor of a livelihood.”
    reason: alternative_reading
  - marker: b
    text: Here “soul” can also mean a person’s life, self, or inner being.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the life of the poor
  simplified_phrase: a poor person's life
  preserved_meaning: The object of contempt remains the poor person's life and living condition, not the person's conduct.
  reasoning_layer_used: Hebrew lexical decision, informed by the Greek parallel
  rationale: The possessive phrasing is natural English and avoids suggesting a lifestyle.
- pob_phrase: do not grieve a poor and bitter soul
  simplified_phrase: do not cause pain to a poor person whose soul is deeply distressed
  preserved_meaning: The command forbids adding pain to a poor person already suffering inwardly.
  reasoning_layer_used: Hebrew lexical decisions for וְאַל תַּדְאִיב, נֶפֶשׁ, and וּמַר נָפֶשׁ
  rationale: The clause states the action plainly while retaining the source image of the soul.
interpretive_expansions:
- pob_phrase: bitter soul
  rendering: soul is deeply distressed
  claim: The soul's bitterness describes severe inward distress.
  evidence:
  - The lexical rationale identifies the phrase as deep distress in the poor person's inner life.
  - The command not to cause pain supports an emotional sense in context.
  confidence: high
  alternatives_preserved:
  - bitter in soul
  - embittered in soul
translation_notes:
  risk_flags:
  - risk: “Life” may not by itself convey the Greek-supported sense of livelihood or living conditions.
    mitigation: Footnote a preserves the alternative sense without displacing the Hebrew-centered main text.
