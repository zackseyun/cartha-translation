translation:
  language: en
  text: Those who cling to Wisdom will find honor from Yahweh. They will receive favor together with Yahweh’s blessing.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says, “The one who holds fast to her will inherit glory, and wherever he enters, the Lord will bless.”
