translation:
  language: en
  text: Those who listen to me will judge according to truth. Those who pay close attention to me will live securely in my inner rooms.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel says, “Those who obey her will judge nations, and those who approach her will camp with confidence.” The main text follows the surviving Hebrew, while the Greek helps clarify the difficult final words.
    reason: alternative_reading
  - marker: b
    text: Wisdom speaks as a woman welcoming attentive listeners into the inner rooms of her home.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Whoever listens to me will judge truly
  simplified_phrase: Those who listen to me will judge according to truth
  preserved_meaning: Listening to Wisdom leads a person to judge in line with truth.
  reasoning_layer_used: Hebrew lexical decision for יִשׁפֹּט אֱמֶת
  rationale: “According to truth” makes the adverbial sense clear without importing the Greek reading “nations.”
- pob_phrase: whoever gives ear to me
  simplified_phrase: Those who pay close attention to me
  preserved_meaning: The second line emphasizes attentive, responsive listening.
  reasoning_layer_used: Hebrew lexical decision for וּמַאֲזִין לִי
  rationale: This replaces an old idiom while keeping the stronger emphasis on attentiveness.
- pob_phrase: will dwell securely in my inner chambers
  simplified_phrase: will live securely in my inner rooms
  preserved_meaning: Wisdom offers secure residence within her household space.
  reasoning_layer_used: Hebrew lexical decisions for יִיחַן and בַּחֲדָרַי, clarified by the Greek parallel
  rationale: “Live” and “rooms” are common words that preserve the secure dwelling and domestic images.
translation_notes:
  risk_flags:
  - risk: The Hebrew final phrase is textually awkward, and “securely” is clarified by the Greek parallel.
    mitigation: The alternative-reading footnote identifies the witness difference and the Greek contribution.
  - risk: “Inner rooms” may sound literal without the surrounding personification of Wisdom.
    mitigation: The cultural note explains Wisdom’s household image without turning it into commentary.
