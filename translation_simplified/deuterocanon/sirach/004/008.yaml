translation:
  language: en
  text: Rescue an oppressed person from those who oppress them.[a] When you make a fair judgment, do not grow impatient in your heart.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel reads, “Listen to the poor, and answer them peacefully and gently.” The surviving Hebrew instead speaks of rescuing the oppressed and judging fairly without impatience.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the oppressed from his oppressors
  simplified_phrase: an oppressed person from those who oppress them
  preserved_meaning: The command still calls for active rescue from mistreatment.
  reasoning_layer_used: Hebrew lexical decisions for מוּצָק and מִמְּצִיקָיו
  rationale: The rewrite makes the people and action immediately clear while retaining the oppression language.
- pob_phrase: when judging rightly
  simplified_phrase: When you make a fair judgment
  preserved_meaning: The setting remains the act of reaching an upright judgment.
  reasoning_layer_used: Hebrew lexical decision for בְּמִשְׁפַט יֹשֶׁר
  rationale: The noun phrase is more natural for readers unfamiliar with biblical judicial wording.
- pob_phrase: do not let your spirit grow impatient
  simplified_phrase: do not grow impatient in your heart
  preserved_meaning: The warning remains against inward irritation or weariness that could hinder justice.
  reasoning_layer_used: Hebrew lexical decision for וְאַל תָּקוֹץ רוּחֲךָ
  rationale: “In your heart” preserves the inner-person image in more familiar English.
