translation:
  language: en
  text: Someone cries out, bitter in spirit and suffering deep pain in his soul. His Rock will hear his cry.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel says, “Do not turn your eye away from someone who begs, and do not give anyone a reason to curse you.” The Hebrew instead emphasizes that the suffering person’s Rock will hear his cry.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: One crying out in bitter spirit and in the pain of his soul
  simplified_phrase: Someone cries out, bitter in spirit and suffering deep pain in his soul
  preserved_meaning: The person is crying from profound inward anguish, not merely physical pain.
  reasoning_layer_used: Hebrew lexical decisions for צוֹעֵק, מַר רוּחַ, and בִּכְאֵב נַפְשׁוֹ
  rationale: The fragment is recast as a natural sentence while retaining both spirit and soul imagery.
- pob_phrase: and at the sound of his cry, his Rock will hear
  simplified_phrase: His Rock will hear his cry
  preserved_meaning: God, described by the Hebrew divine title “Rock,” will respond to the sufferer’s outcry.
  reasoning_layer_used: Hebrew lexical decisions for צוּרוֹ and יִשְׁמַע
  rationale: The simpler clause preserves the divine metaphor and the future force of the warning.
translation_notes:
  risk_flags:
  - risk: Readers may not immediately recognize “his Rock” as a title for God.
    mitigation: The title is retained because the Hebrew metaphor is theologically important, and capitalization signals divine reference.
  - risk: The Greek parallel differs substantially from the Hebrew main text.
    mitigation: The Hebrew remains primary, while the Greek wording is preserved in a footnote.
