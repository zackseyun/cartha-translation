translation:
  language: en
  text: Do not hold back a gift from a poor person for whom you are responsible. Do not treat a poor person’s request with contempt or give that person reason to curse you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel reads, “Do not refuse a person in distress who pleads with you, and do not turn your face away from the poor.” It does not include the final warning about a curse.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Do not withhold a gift from your poor man
  simplified_phrase: Do not hold back a gift from a poor person for whom you are responsible
  preserved_meaning: The command forbids keeping aid from a needy person toward whom the hearer has responsibility.
  reasoning_layer_used: Hebrew lexical decisions for אַל תִּמְנַע, מַתָּן, and מִמִּסְכֵּנֶךָ
  rationale: This uses familiar English while preserving the relational force of “your” without claiming material dependence.
- pob_phrase: do not despise the request of the poor
  simplified_phrase: Do not treat a poor person’s request with contempt
  preserved_meaning: The poor person’s appeal must not be regarded as worthless or insignificant.
  reasoning_layer_used: Hebrew lexical decisions for וְלֹא תִבְזֶה and שְׁאֵלוֹת דָּל
  rationale: The wording makes the nature and object of the contempt immediately clear.
- pob_phrase: nor give him occasion to curse you
  simplified_phrase: or give that person reason to curse you
  preserved_meaning: Mistreatment may give the poor person grounds to call down a curse on the offender.
  reasoning_layer_used: Hebrew lexical decisions for וְלֹא תִתֵּן לוֹ מָקוֹם and לְקַלְלֶךָ
  rationale: “Give reason” naturally conveys the Hebrew idiom “give place.”
interpretive_expansions:
- pob_phrase: your poor man
  rendering: a poor person for whom you are responsible
  claim: The possessive presents the needy person in relation to the hearer’s responsibility.
  evidence:
  - The Hebrew includes a second-person possessive suffix meaning “your.”
  - The POB lexical rationale identifies a relationship of responsibility.
  confidence: moderate
  alternatives_preserved:
  - your needy one
  - a poor person under your responsibility
translation_notes:
  risk_flags:
  - risk: “For whom you are responsible” makes the relational implication of “your” explicit.
    mitigation: It follows the POB rationale without narrowing the relationship to material dependence.
  - risk: The Greek parallel lacks the Hebrew text’s final curse clause.
    mitigation: The main text follows the project’s Hebrew-primary policy, while the footnote preserves the Greek witness.
