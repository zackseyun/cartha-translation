translation:
  language: en
  text: Give orphans a father’s care, and give widows the support a husband would.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek has a substantially different reading: “Rescue the wronged from the hand of the wrongdoer, and do not lose courage when you judge.” It likely reflects a different form of the verse.'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Be like a father to orphans
  simplified_phrase: Give orphans a father’s care
  preserved_meaning: The reader should fulfill a fatherlike role toward orphans without literally becoming their father.
  reasoning_layer_used: Hebrew lexical decisions for הֱיֵה, כְאָב, and לִיתוֹמִים
  rationale: This makes the comparison actionable while preserving the full father image.
- pob_phrase: and in place of a husband to widows
  simplified_phrase: and give widows the support a husband would
  preserved_meaning: The reader should provide the support associated with an absent husband without implying marriage.
  reasoning_layer_used: Hebrew lexical decisions for וּתְמוּר, בַּעַל, and לְאַלְמָנוֹת
  rationale: This expresses role-based substitution clearly and avoids suggesting remarriage.
interpretive_expansions:
- pob_phrase: Be like a father to orphans
  rendering: Give orphans a father’s care
  claim: The father comparison calls for fatherlike care toward orphans.
  evidence:
  - The Hebrew comparison כְאָב describes how the addressee should act toward orphans.
  - The POB preserves the simile rather than assigning literal fatherhood.
  confidence: high
  alternatives_preserved:
  - Be like a father to orphans
- pob_phrase: in place of a husband to widows
  rendering: give widows the support a husband would
  claim: The command concerns supplying a husband’s absent supportive role, not marrying the widow.
  evidence:
  - The POB lexical rationale describes relational substitution in a social-protective context.
  - The domestic context identifies בַּעַל as a husband.
  confidence: high
  alternatives_preserved:
  - in place of a husband to widows
translation_notes:
  risk_flags:
  - risk: “Support” may not express every aspect of an absent husband’s role.
    mitigation: The husband comparison remains and keeps the kind of support relationally broad.
  - risk: The Hebrew and Greek preserve materially different forms of this verse.
    mitigation: The high-confidence Hebrew controls the main text, while the Greek form remains in footnote [a].
