translation:
  language: en
  text: When his heart is filled with me,[a] I will return to him and bring him happiness. I will reveal my secrets to him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek has a fuller line in which Wisdom tests him until she trusts him or he entrusts himself to her.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And until his heart is filled with me
  simplified_phrase: When his heart is filled with me
  preserved_meaning: Wisdom waits for the point when the disciple’s heart is filled with her, while the Hebrew image remains intact.
  reasoning_layer_used: Hebrew lexical decision and theological primacy
  rationale: The recast states the temporal endpoint naturally without adding delay or replacing the Hebrew image with trust language.
- pob_phrase: I will return and make him happy
  simplified_phrase: I will return to him and bring him happiness
  preserved_meaning: Wisdom turns favorably toward the disciple and makes him happy or blessed.
  reasoning_layer_used: Lexical decisions for אָשׁוּב and אֲאַשְּׁרֶנּוֹ
  rationale: The wording preserves both Wisdom’s return and its favorable result in clear English.
- pob_phrase: and I will reveal my secrets to him
  simplified_phrase: I will reveal my secrets to him
  preserved_meaning: Wisdom discloses hidden things to the disciple.
  reasoning_layer_used: Lexical decisions for וְגָלִיתִי לוֹ and מִסְתָּרִי
  rationale: A separate sentence makes the disclosure easier to follow without weakening it.
interpretive_expansions:
- pob_phrase: I will return
  rendering: I will return to him
  claim: Wisdom’s return is directed toward the disciple.
  evidence:
  - The surrounding clauses describe Wisdom’s dealings with him.
  - POB reasoning describes Wisdom as turning favorably toward the disciple.
  confidence: high
  alternatives_preserved:
  - I will return
  - I will turn back
translation_notes:
  risk_flags:
  - risk: “When” recasts the Hebrew temporal expression “until” as the endpoint it reaches.
    mitigation: The wording preserves the temporal limit without adding the unsupported emphasis of “at last.”
  - risk: The Greek parallel includes trust and testing language absent from the Hebrew line.
    mitigation: The Hebrew controls the main text, while the fuller Greek form appears only in the footnote.
