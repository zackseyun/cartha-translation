simplification_decisions:
- pob_phrase: Do not sit with an unjust judge
  simplified_phrase: Do not join an unjust judge
  preserved_meaning: The warning is against associating or taking part with an unjust judge.
  reasoning_layer_used: Hebrew lexical rationale for אַל תֵּשֵׁב
  rationale: “Join” clearly conveys the idiom’s association sense without narrowing it to physical seating.
- pob_phrase: with him judgment will be according to his pleasure
  simplified_phrase: judgment with him will be made however he wants
  preserved_meaning: His personal wishes rather than justice control the judicial process.
  reasoning_layer_used: Hebrew lexical decisions for כַאֲשֶׁר כִּרְצוֹנוֹ and תִּשְׁפּוֹט עִמּוֹ
  rationale: The wording keeps generic singular “judgment” while expressing arbitrary rule in natural English.
interpretive_expansions:
