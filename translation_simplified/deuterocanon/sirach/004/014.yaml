translation:
  language: en
  text: Those who serve Wisdom serve the Holy One, and God loves those who love the place where she lives.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek reads, “and the Lord loves those who love her.” The uncertain Hebrew text includes language about Wisdom’s dwelling place.
    reason: alternative_reading
