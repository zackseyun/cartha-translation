- pob_phrase: minister to her
  simplified_phrase: serve Wisdom
  preserved_meaning: Devoted service to personified Wisdom is retained.
  reasoning_layer_used: POB lexical decision and wisdom context
  rationale: “Serve” is clearer than “minister to,” while the sacred character remains explicit in the next clause.
- pob_phrase: minister to the Holy One
  simplified_phrase: serve the Holy One
  preserved_meaning: Serving Wisdom is presented as service to the Holy One.
  reasoning_layer_used: POB lexical and theological decision
  rationale: The repeated verb preserves the source’s parallel structure in common English.
- pob_phrase: love her dwelling
  simplified_phrase: love the place where she lives
  preserved_meaning: The Hebrew image of Wisdom’s dwelling place remains in the main text.
  reasoning_layer_used: POB Hebrew-primary textual decision
  rationale: The concrete phrase explains “dwelling” without replacing the uncertain Hebrew with the smoother Greek reading.
interpretive_expansions:
