translation:
  language: en
  text: Do not drive a person in need to despair, and do not ignore someone who is crushed inside.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel says, “Do not grieve a hungry person, and do not provoke anyone in distress.” The Hebrew is broader and refers to need and inner suffering.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: make a needy soul despair
  simplified_phrase: drive a person in need to despair
  preserved_meaning: Do not worsen a needy person’s distress until it becomes despair.
  reasoning_layer_used: Hebrew lexical decision with Greek consistency check
  rationale: “Person in need” states the Hebrew idea of deprivation in ordinary English.
- pob_phrase: do not ignore a crushed soul
  simplified_phrase: do not ignore someone who is crushed inside
  preserved_meaning: Do not disregard a person who is inwardly beaten down.
  reasoning_layer_used: Hebrew lexical decision
  rationale: “Crushed inside” preserves the crushing image without narrowing “soul” to a distinct spiritual component.
translation_notes:
  risk_flags:
  - risk: “Crushed inside” makes the inward sense explicit rather than retaining the biblical term “soul.”
    mitigation: The Hebrew lexical rationale identifies the phrase as referring broadly to a person’s inner affliction.
