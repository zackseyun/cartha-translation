translation:
  language: en
  text: Do not let shame keep you from turning back from wrongdoing. Do not try to stand against a river’s current.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek reads, “Do not be ashamed to confess your sins, and do not force the current of a river.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Do not be ashamed to turn back from iniquity
  simplified_phrase: Do not let shame keep you from turning back from wrongdoing
  preserved_meaning: Shame must not prevent a person from abandoning sinful conduct.
  reasoning_layer_used: Hebrew lexical decisions and theological decision on שוב
  rationale: “Wrongdoing” makes the moral sense of “iniquity” clear while “turning back” preserves the Hebrew image.
- pob_phrase: do not stand before the current of a river
  simplified_phrase: Do not try to stand against a river’s current
  preserved_meaning: A person should not set himself against an overpowering current.
  reasoning_layer_used: Hebrew lexical decision on שִׁבֹּלֶת with Greek consistency check
  rationale: The recast keeps the river image but makes the danger and opposition natural in English.
interpretive_expansions:
- pob_phrase: Do not be ashamed to turn back
  rendering: Do not let shame keep you from turning back
  claim: The warning concerns shame preventing moral reversal, not merely the feeling of shame.
  evidence:
  - The Hebrew infinitive links shame directly with turning back.
  - The immediate phrase identifies wrongdoing as what must be left.
  confidence: high
  alternatives_preserved:
  - Do not be ashamed to turn back
  - Do not be ashamed to return
- pob_phrase: do not stand before the current of a river
  rendering: Do not try to stand against a river’s current
  claim: Standing before the current depicts resisting or confronting its force.
  evidence:
  - The Hebrew preposition can describe facing something dangerous.
  - The Greek parallel uses a verb of forcing or resisting the river’s flow.
  confidence: moderate
  alternatives_preserved:
  - do not stand before the current of a river
  - do not stand in front of a river’s current
translation_notes:
  risk_flags:
  - risk: “Against” states the confrontational force more directly than the Hebrew preposition alone.
    mitigation: The river image remains intact, and the Greek parallel supports resistance as the intended warning.
  - risk: The Hebrew and Greek differ in the first command.
    mitigation: The main text follows the Hebrew, while the Greek wording is preserved in a footnote.
