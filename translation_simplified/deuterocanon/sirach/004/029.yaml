  preserved_meaning: The reader must persist in the struggle for moral rightness, even when death is at stake.
  reasoning_layer_used: Hebrew lexical decisions and POB revision history
  rationale: “Keep fighting” is common English that preserves the struggle image and its parallel with Yahweh fighting.
