translation:
  language: en
  text: Keep fighting for righteousness, even until death,[a][b] and Yahweh will fight for you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Fight for justice, even until death.” The Hebrew word can mean either “righteousness” or “justice.”
    reason: lexical_alternative
  - marker: b
    text: 'The Greek parallel reads: “Do not be harsh in your speech or sluggish and slack in your works.” The main text follows the Hebrew Cairo Geniza witness.'
    reason: textual_variant
