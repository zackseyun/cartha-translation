translation:
  language: en
  text: My son, act at the right time.[a] Guard yourself from evil, and do not be ashamed in matters concerning your own soul.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The transmitted Hebrew is difficult here; the Greek parallel supports the sense “observe the right time.”
    reason: textual_variant
  - marker: b
    text: “Your own soul” may also mean “yourself” or “your life.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: keep the proper time
  simplified_phrase: act at the right time
  preserved_meaning: The son must respond at the fitting time.
  reasoning_layer_used: Greek parallel and POB lexical decision for עֵת
  rationale: This makes the Greek-supported sense of a fitting time clear in ordinary English.
- pob_phrase: beware of evil
  simplified_phrase: Guard yourself from evil
  preserved_meaning: The son must protect himself from evil.
  reasoning_layer_used: POB lexical decision for וּפְחַד מִרָע and doctrine realignment
  rationale: This retains the source-driven wording protected by the latest revision.
- pob_phrase: do not be ashamed for your own soul
  simplified_phrase: do not be ashamed in matters concerning your own soul
  preserved_meaning: The command concerns one's soul, self, or life without choosing among those senses.
  reasoning_layer_used: POB lexical and theological decisions for נַפְשְׁךָ
  rationale: This is direct English while preserving the broad meaning and theological weight of “soul.”
interpretive_expansions:
- pob_phrase: keep the proper time
  rendering: act at the right time
  claim: Keeping the proper time calls for responding at the fitting opportunity.
  evidence:
  - The POB rationale identifies a fitting or opportune time as the contextual sense.
  - The Greek parallel uses καιρόν for an appropriate time.
  confidence: moderate
  alternatives_preserved:
