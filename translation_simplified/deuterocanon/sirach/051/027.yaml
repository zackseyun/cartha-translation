  preserved_meaning: The hearers are invited to verify his claim personally.
  reasoning_layer_used: Lexical decision for רְאוּ בְעֵינֵיכֶם
  rationale: This common idiom keeps the emphasis on firsthand observation.
- pob_phrase: I was small
  simplified_phrase: I started out small
  preserved_meaning: He describes a humble or limited early state without restricting it to youth or social insignificance.
  reasoning_layer_used: Lexical decision for קָטֹן and grounding review
  rationale: The wording clarifies the contrast while preserving the Hebrew expression’s breadth.
- pob_phrase: yet I stood by it and found it
  simplified_phrase: yet I stayed committed to wisdom and found it
  preserved_meaning: He persevered in attachment to wisdom and attained it.
  reasoning_layer_used: Lexical and theological decisions for וְעָמַדְתִּי בָהּ וּמְצָאתִיהָ
  rationale: “Stayed committed” makes perseverance clear while preserving finding as a distinct image.
