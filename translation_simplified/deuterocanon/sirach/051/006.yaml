translation:
  language: en
  text: My soul came close to death. My life came close to the deepest parts of Sheol.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheol is the Hebrew name for the realm of the dead; the Greek parallel says “Hades below.”
    reason: cultural_note
  - marker: b
    text: The first sentence can be translated more literally, “My soul touched death.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: My soul came near to death
  simplified_phrase: My soul came close to death.
  preserved_meaning: The speaker’s soul nearly reached death without saying that death had already occurred.
  reasoning_layer_used: Hebrew lexical decision supported by the Greek parallel
  rationale: “Came close” is more natural modern English while preserving the proximity expressed by the verb.
- pob_phrase: and my life to the depths of Sheol
  simplified_phrase: My life came close to the deepest parts of Sheol.
  preserved_meaning: The speaker’s life approached the lowest regions of the realm of the dead.
  reasoning_layer_used: Hebrew poetic parallelism and lexical decisions for חַיָּתִי, שְׁאוֹל, and תַּחְתִּיּוֹת
  rationale: A complete second sentence supplies the implied verb and makes the Hebrew intensifier immediately clear.
translation_notes:
  risk_flags:
  - risk: “Sheol” may be unfamiliar to modern readers.
    mitigation: A brief footnote defines it without replacing the source-world concept.
  - risk: “Deepest parts” is slightly fuller than POB’s “depths.”
    mitigation: The wording preserves the Hebrew plural’s force of the lowest regions.
