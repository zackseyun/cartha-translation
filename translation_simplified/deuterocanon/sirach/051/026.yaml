translation:
  language: en
  text: Put your neck under Wisdom’s yoke. Let your soul carry her burden.[a] Wisdom is near to those who seek her, and anyone who commits himself to her will find her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel says, “Let your soul receive instruction,” while the Hebrew says, “carry her burden.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Bring your neck under her yoke
  simplified_phrase: Put your neck under Wisdom’s yoke
  preserved_meaning: The bodily image still calls the reader to submit to Wisdom’s discipline.
  reasoning_layer_used: Lexical decision and personification of Wisdom
  rationale: “Put” is more natural here, and naming Wisdom makes the personified “her” immediately clear.
- pob_phrase: let your soul bear her burden
  simplified_phrase: Let your soul carry her burden
  preserved_meaning: The Hebrew image of the soul bearing Wisdom’s load remains intact.
  reasoning_layer_used: Hebrew lexical decision with Greek comparison
  rationale: “Carry” is common English for bearing a burden without weakening the metaphor.
- pob_phrase: the one who gives himself finds her
  simplified_phrase: anyone who commits himself to her will find her
  preserved_meaning: Finding Wisdom requires personal devotion rather than physical self-sacrifice.
  reasoning_layer_used: Lexical rationale for וְנוֹתֵן נַפְשׁוֹ
  rationale: “Commits himself to her” states the contextual sense clearly for modern readers.
interpretive_expansions:
- pob_phrase: her / She
  rendering: Wisdom / her
  claim: The feminine figure in the verse is personified Wisdom.
  evidence:
  - The immediate context presents Wisdom as a female figure.
  - The POB theological decision requires feminine personification.
  confidence: high
  alternatives_preserved:
  - The pronoun “her” remains in the yoke and burden imagery.
- pob_phrase: gives himself
  rendering: commits himself to her
  claim: Giving oneself means devoted pursuit of Wisdom, not death.
  evidence:
  - The POB lexical rationale identifies self-giving devotion as the contextual sense.
  - The following words describe finding Wisdom.
  confidence: high
  alternatives_preserved:
  - The force of personal self-giving remains in “commits himself.”
translation_notes:
  risk_flags:
  - risk: Naming Wisdom twice is more explicit than the POB’s pronouns.
    mitigation: The identification follows the immediate context and preserves feminine personification.
  - risk: “Commits himself” interprets the literal expression “gives himself.”
    mitigation: The wording retains personal devotion and avoids implying death.
