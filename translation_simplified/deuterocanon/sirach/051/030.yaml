translation:
  language: en
  text: Do your work in righteousness—in a way that is right. Then he will give you your reward at the proper time.[a] Yahweh is blessed forever, and his name is praised from one generation to the next.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in his time”; the wording may refer either to the proper time for the reward or to God’s own time.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Do your work in righteousness
  simplified_phrase: Do your work in righteousness—in a way that is right
  preserved_meaning: The command calls for morally upright action while retaining the key term “righteousness.”
  reasoning_layer_used: Lexical and theological decisions for צְדָקָה
  rationale: The added plain-language phrase explains the theological term without replacing it.
- pob_phrase: and he will give you your reward in its time
  simplified_phrase: Then he will give you your reward at the proper time
  preserved_meaning: God promises the reward when its fitting time comes.
  reasoning_layer_used: Lexical decision and footnote for בְּעִתּוֹ
  rationale: “At the proper time” is clearer, while the footnote preserves the pronoun’s ambiguity.
- pob_phrase: praised is his name from generation to generation
  simplified_phrase: his name is praised from one generation to the next
  preserved_meaning: Yahweh’s name receives enduring praise through successive generations.
  reasoning_layer_used: Lexical decision for לְדֹר וָדֹר
  rationale: Ordinary English word order makes the traditional idiom immediately clear.
interpretive_expansions:
- pob_phrase: in righteousness
  rendering: in righteousness—in a way that is right
  claim: Here righteousness describes the morally right manner in which the work is done.
  evidence:
  - The lexical rationale identifies the phrase as manner and as right conduct.
  - The theological rationale describes the exhortation as morally upright action before God.
  confidence: high
  alternatives_preserved:
  - with righteousness
  - justly
  - in justice
translation_notes:
  risk_flags:
  - risk: “At the proper time” may sound as though the timing belongs only to the reward.
    mitigation: The footnote preserves the possible sense “in his time.”
  - risk: The pronoun “he” may not immediately identify God for every reader.
    mitigation: It follows the POB’s deliberate restraint, and the next sentence explicitly names Yahweh.
