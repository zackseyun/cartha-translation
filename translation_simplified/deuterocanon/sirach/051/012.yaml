translation:
  language: en
  text: For he redeemed me from every evil and rescued me when the day of trouble came.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel says, “For you saved me from destruction and delivered me from an evil time.” The main text follows the Hebrew.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: delivered me
  simplified_phrase: rescued me
  preserved_meaning: God brought the speaker to safety while keeping this act distinct from redemption.
  reasoning_layer_used: POB lexical decision for וַיְמַלְּטֵנִי
  rationale: “Rescued” states the deliverance plainly for a modern reader.
- pob_phrase: in the day of trouble
  simplified_phrase: when the day of trouble came
  preserved_meaning: The Hebrew image of a day marked by distress remains intact.
  reasoning_layer_used: POB lexical decision for בְּיוֹם צָרָה
  rationale: The recast clause makes the Hebrew idiom easier to understand without removing its image.
translation_notes:
  risk_flags:
  - risk: “Every evil” can refer to moral evil, harm, or calamity.
    mitigation: The broad wording is retained so the translation does not narrow the Hebrew.
  - risk: The Greek parallel differs in wording and uses second-person address.
    mitigation: The Hebrew remains primary, and the Greek reading is given in a footnote.
