translation:
  language: en
  text: May my soul rejoice in my old age.[a] May none of you be put to shame over my song.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek reads, “May your soul rejoice in his mercy, and may you not be put to shame in his praise,” rather than the Hebrew’s “my soul,” “my old age,” and “my song.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: May my soul rejoice in my old age
  simplified_phrase: May my soul rejoice in my old age.
  preserved_meaning: The speaker wishes for inward joy during old age.
  reasoning_layer_used: The lexical decisions preserve “my soul,” the wish form, and the idiomatic meaning “old age.”
  rationale: The direct verb “rejoice” avoids adding an unsupported sense of fullness.
- pob_phrase: and may you not be put to shame in my song
  simplified_phrase: May none of you be put to shame over my song.
  preserved_meaning: The speaker wishes that his song will not become an occasion of shame for his hearers.
  reasoning_layer_used: The Hebrew lexical analysis supports a plural audience, passive shame, and “my song.”
  rationale: A separate sentence and “over” make the relationship clear in natural English.
interpretive_expansions:
- pob_phrase: you
  rendering: none of you
  claim: The second wish addresses more than one person.
  evidence:
  - The Hebrew verb is second-person plural.
  - The Greek parallel also uses a second-person plural form.
  confidence: high
  alternatives_preserved:
  - The group addressed is not identified.
  external_witnesses:
  - The Greek parallel confirms the plural address.
translation_notes:
  risk_flags:
  - risk: The Hebrew and Greek differ substantially in person and content.
    mitigation: The main text follows the extant Hebrew, while the footnote preserves the Greek reading.
  - risk: “Over my song” interprets a flexible Hebrew preposition.
    mitigation: It keeps the connection to the song without claiming that the song directly causes shame.
