translation:
  language: en
  text: When I was young, I loved wisdom. I desired her and searched for her. I walked faithfully.[a] O Lord, from my youth I learned wisdom.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “I walked in truth.”
    reason: lexical_alternative
  - marker: b
    text: The Greek reads, “While I was still young, before I went astray, I sought wisdom openly in my prayer.” The main text follows the surviving Hebrew.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: I was young, and I loved wisdom
  simplified_phrase: When I was young, I loved wisdom
  preserved_meaning: The speaker loved wisdom while he was young.
  reasoning_layer_used: Hebrew lexical decisions for נַעַר and וָאוֹהַב
  rationale: A time clause states the relationship naturally without adopting the Greek reading.
- pob_phrase: I desired her and sought her out
  simplified_phrase: I desired her and searched for her
  preserved_meaning: Wisdom remains personified as someone earnestly desired and actively pursued.
  reasoning_layer_used: Hebrew lexical decisions for חָפַצְתִּי and וּבִקַּשְׁתִיהָ
  rationale: “Searched for” makes the intentional pursuit immediately clear.
- pob_phrase: In faithfulness my foot walked
  simplified_phrase: I walked faithfully
  preserved_meaning: The speaker’s conduct was marked by faithfulness.
  reasoning_layer_used: Hebrew lexical decisions for בַּאֲמִתָּהּ and דָּרְכָה רַגְלִי
  rationale: The natural English clause preserves both the walking image and its ethical manner.
translation_notes:
  risk_flags:
  - risk: The singular Hebrew image “my foot walked” is expressed with the ordinary English “I walked.”
    mitigation: The main text retains the walking image and clearly conveys faithful conduct.
  - risk: The surviving Hebrew and Greek differ substantially.
    mitigation: The main text follows the Hebrew-first policy, and footnote b preserves the Greek reading.
