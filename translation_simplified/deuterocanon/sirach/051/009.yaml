translation:
  language: en
  text: I lifted my voice from the earth.[a] From the gates of Sheol,[b] I cried for help.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “from the land.” The Greek parallel says “upon the earth.”
    reason: textual_variant
  - marker: b
    text: Sheol is the Hebrew term for the realm of the dead, also called the underworld.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And I raised my voice from the earth
  simplified_phrase: I lifted my voice from the earth.
  preserved_meaning: The speaker raises his voice while retaining the Hebrew image and the primary reading “from the earth.”
  reasoning_layer_used: Hebrew lexical decisions and textual-variant footnote
  rationale: A separate sentence and the familiar expression “lifted my voice” make the poetic line easier to follow.
- pob_phrase: and from the gates of Sheol I cried out
  simplified_phrase: From the gates of Sheol, I cried for help.
  preserved_meaning: The speaker pleads for aid from the threshold of the realm of the dead.
  reasoning_layer_used: Hebrew lexical and theological decisions
  rationale: The concrete gates image and the term “Sheol” remain, while the verb's plea for aid is stated clearly.
interpretive_expansions:
- pob_phrase: I cried out
  rendering: I cried for help
  claim: The cry is a plea for aid rather than merely a loud sound.
  evidence:
  - The lexical decision says שוע carries the sense of crying out for aid.
  - The Greek parallel uses a verb meaning “implored” or “begged.”
  confidence: high
  alternatives_preserved:
  - I cried out
  - I pleaded
translation_notes:
  risk_flags:
  - risk: “For help” makes the petitionary sense more explicit than the POB main text.
    mitigation: The Hebrew lexical decision and Greek parallel both support this bounded clarification.
  - risk: Modern readers may mistake Sheol for a later, more specific doctrine of the afterlife.
    mitigation: The footnote defines it broadly as the Hebrew realm of the dead.
