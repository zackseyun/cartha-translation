translation:
  language: en
  text: Wine and women lead a person’s heart astray. A recklessly bold soul destroys the person it belongs to.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek reads: “Wine and women will turn away men of understanding, and whoever clings to prostitutes will become more reckless.” The Hebrew differs greatly in the second line.'
