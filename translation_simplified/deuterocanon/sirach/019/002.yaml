- pob_phrase: lead the heart astray
  simplified_phrase: lead a person’s heart astray
  preserved_meaning: Wine and women misdirect a person’s inner thoughts and desires.
  reasoning_layer_used: POB lexical decisions for לֵב and יַפְחִיזוּ
  rationale: Adding “a person’s” clarifies the heart image without weakening the warning or reducing heart to mind alone.
- pob_phrase: destroys its owner
  simplified_phrase: destroys the person it belongs to
  preserved_meaning: The bold soul brings ruin on its own possessor.
  reasoning_layer_used: POB lexical decision for בְעָלֶיהָ
  rationale: The recast wording preserves the ownership image in more natural English.
interpretive_expansions:
