- pob_phrase: Reprove a friend
  simplified_phrase: Ask a friend about what was reported
  preserved_meaning: The friend should first be questioned rather than assumed guilty.
  reasoning_layer_used: POB lexical decision for Ἔλεγξον
  rationale: The context and lexical audit favor investigating the report before correcting the friend.
- pob_phrase: lest perhaps he did not say it
  simplified_phrase: because he may not have said it
  preserved_meaning: The report may be false or mistaken.
  reasoning_layer_used: POB lexical decisions for μή ποτε and οὐκ εἶπεν
  rationale: The direct causal wording expresses the caution naturally in modern English.
- pob_phrase: so that he may not repeat it
  simplified_phrase: so that he does not say it again
  preserved_meaning: If the report is true, the goal is to prevent the same speech from recurring.
  reasoning_layer_used: POB lexical decision for ἵνα μὴ δευτερώσῃ
  rationale: The common phrase “say it again” preserves the speech context and purpose.
