translation:
  language: en
  text: Ask a friend about what was reported[a], because he may not have said it. But if he did, correct him so that he does not say it again.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can mean “question,” “examine,” or “correct”; here the first step is to find out whether the report is true.
    reason: lexical_alternative
