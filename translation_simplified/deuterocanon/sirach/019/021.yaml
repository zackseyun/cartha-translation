  preserved_meaning: The verse identifies a particular kind of precisely planned cunning and directly condemns it as unjust.
  reasoning_layer_used: POB lexical decisions for πανουργία and ἀκριβής and the theological decision on skillful behavior
  rationale: This wording explains “meticulous” while avoiding any suggestion that the verse divides cunning into acceptable and unacceptable forms.
- pob_phrase: there is one who twists things
