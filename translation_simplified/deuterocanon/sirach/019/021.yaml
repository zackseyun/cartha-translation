  preserved_meaning: The distortion is purposeful and aims to make a judgment evident.
  reasoning_layer_used: POB lexical decisions for χάριν τοῦ, ἐκφᾶναι, and κρίμα
  rationale: The vivid purpose clause remains because simplifying it further could narrow the deliberately broad meaning of “judgment.”
