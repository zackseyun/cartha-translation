  preserved_meaning: A person may distort matters rather than deal with them properly.
  reasoning_layer_used: POB lexical decision for διαστρέφων and the applied revision preserving “matters”
  rationale: The generic plural is natural English and keeps the source image of distortion.
- pob_phrase: in order to bring a judgment to light
