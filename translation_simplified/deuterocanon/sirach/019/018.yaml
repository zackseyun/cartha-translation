translation:
  language: en
  text: Knowledge aimed at doing evil is not wisdom.[a] Wherever sinners give advice, there is no sound judgment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Expertise at wickedness is not wisdom.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the knowledge of evil
  simplified_phrase: knowledge aimed at doing evil
  preserved_meaning: Knowledge directed toward evil does not qualify as wisdom.
  reasoning_layer_used: lexical and theological decisions
  rationale: The clearer wording prevents readers from taking this as mere awareness that evil exists.
- pob_phrase: where the counsel of sinners is
  simplified_phrase: wherever sinners give advice
  preserved_meaning: Any setting characterized by sinners’ counsel lacks genuine discernment.
  reasoning_layer_used: lexical decision for βουλή and οὐκ ἔστιν ὅπου
  rationale: “Give advice” expresses “counsel” in common English while retaining the general locative force.
- pob_phrase: there is no understanding
  simplified_phrase: there is no sound judgment
  preserved_meaning: Sinners’ counsel lacks practical moral discernment.
  reasoning_layer_used: lexical decision for φρόνησις
  rationale: “Sound judgment” makes the practical moral sense clearer than the broad word “understanding.”
interpretive_expansions:
- pob_phrase: knowledge of evil
  rendering: knowledge aimed at doing evil
  claim: The knowledge is directed toward evil rather than merely knowledge that evil exists.
  evidence:
  - The lexical rationale says the phrase denotes knowledge directed toward evil.
  - The theological decision rejects morally corrupt cleverness as wisdom.
  confidence: high
  alternatives_preserved:
  - Expertise at wickedness
- pob_phrase: understanding
  rendering: sound judgment
  claim: The understanding in view is practical moral discernment.
  evidence:
  - The lexical rationale identifies φρόνησις as practical moral discernment.
  confidence: high
  alternatives_preserved:
  - understanding
  - prudence
  - discernment
