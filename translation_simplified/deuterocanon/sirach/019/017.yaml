translation:
  language: en
  text: To be wise is to fear the Lord,[a] and wisdom always includes obeying the law.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Fear the Lord” includes awe-filled reverence, not merely being afraid.
