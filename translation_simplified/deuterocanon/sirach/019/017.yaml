simplification_decisions:
- pob_phrase: All wisdom is fear of the Lord
  simplified_phrase: To be wise is to fear the Lord
  preserved_meaning: Wisdom is inseparable from fear of the Lord.
  reasoning_layer_used: The lexical and theological decisions retain the full force of “fear of the Lord.”
  rationale: The infinitive form states the same universal principle in more natural English.
- pob_phrase: in all wisdom there is the practice of the law
  simplified_phrase: wisdom always includes obeying the law
  preserved_meaning: Every form of wisdom involves actively observing the law.
  reasoning_layer_used: The lexical decision explains ποίησις as doing or active observance.
  rationale: “Obeying” makes the required action clearer than the abstract phrase “practice of.”
