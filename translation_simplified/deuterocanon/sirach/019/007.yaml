translation:
  language: en
  text: Do not tell anyone about it, whether friend or enemy. Do not reveal it unless keeping silent would be a sin for you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek is terse and can also be translated, “If it is not a sin for you, do not reveal it.” The main text gives the likely sense that disclosure is allowed only when silence would be sinful.
    reason: alternative_reading
