  text: Correct a friend, because slander often happens. Do not believe every report.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Reprove a friend
  simplified_phrase: Correct a friend
  preserved_meaning: A friend should be directly brought to account without implying a hostile confrontation.
  reasoning_layer_used: The lexical decision lists “correct” as an alternative that retains the force of ἐλέγχω.
  rationale: “Correct” is clearer than “reprove” and less adversarial than “confront.”
- pob_phrase: for often there is slander
  simplified_phrase: because slander often happens
  preserved_meaning: Slander commonly occurs and explains the need for caution.
  reasoning_layer_used: The lexical decisions identify γὰρ as explanatory, πολλάκις as “often,” and διαβολή as “slander.”
  rationale: This states the causal connection in natural modern English.
- pob_phrase: do not believe every word
  simplified_phrase: Do not believe every report
  preserved_meaning: Do not accept every statement about someone as true.
  reasoning_layer_used: The POB footnote and lexical rationale permit “report” for λόγος in this context.
  rationale: “Report” makes the contextual sense of “word” immediately clear.
interpretive_expansions:
- pob_phrase: do not believe every word
  rendering: Do not believe every report
  claim: “Word” refers here to something reported about a person.
  evidence:
