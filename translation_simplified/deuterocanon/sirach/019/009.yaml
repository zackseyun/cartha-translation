    text: The vivid image means that keeping the matter secret will not destroy you.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Have you heard a word?
  simplified_phrase: Have you heard something?
  preserved_meaning: The person has heard a word, matter, or report without defining its kind.
  reasoning_layer_used: The lexical decision keeps λόγον broad and warns against over-specifying it.
  rationale: “Something” avoids the misleading sense of one isolated word while preserving the source's breadth.
- pob_phrase: Let it die with you; take courage
  simplified_phrase: Let it die with you. Take courage
  preserved_meaning: The hearer must not pass the matter on and need not fear keeping it.
  reasoning_layer_used: The lexical rationales preserve both the death metaphor and the reassuring command.
  rationale: Separate sentences make the two commands easier to follow.
