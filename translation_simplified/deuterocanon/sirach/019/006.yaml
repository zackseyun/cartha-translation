  review_summary: The draft usefully avoids the misleading modern impression that the verse forbids saying the same vocabulary word twice. However, “pass on what someone has said” goes beyond the POB’s warranted clarification by adding an unspecified speaker and requiring the sense of relaying information to someone else. “Matter” is understandable modern English, preserves the broad object allowed by λόγον, and leaves the report/disclosure application available in the footnote. “You will lose nothing” is a clear, warranted simplification of the POB’s final clause.
