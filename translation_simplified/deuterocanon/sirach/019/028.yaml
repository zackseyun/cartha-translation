- pob_phrase: is prevented from sinning by lack of strength
  simplified_phrase: is kept from sinning only because he is unable to do it
  preserved_meaning: Circumstances prevent the person from sinning because he lacks the capability, not because he is righteous.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The recast clause makes the cause and moral contrast clear in ordinary English.
- pob_phrase: when he finds an opportunity
  simplified_phrase: when he gets the opportunity
  preserved_meaning: A favorable occasion enables the intended wrongdoing.
  reasoning_layer_used: POB lexical decision for καιρόν
  rationale: “Gets the opportunity” is more natural while retaining the sense of a suitable occasion.
interpretive_expansions:
- pob_phrase: by lack of strength
