translation:
  language: en
  text: No evil[a] will come upon the one who fears the Lord. But during a time of trial[b], the Lord will rescue that person again.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can also mean “harm” or “misfortune.”
    reason: lexical_alternative
  - marker: b
    text: The Greek word can also mean “testing” or “temptation”; here it refers mainly to adversity or testing.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: No evil will confront
  simplified_phrase: No evil will come upon
  preserved_meaning: Evil is pictured as meeting or befalling the God-fearing person.
  reasoning_layer_used: Lexical decision for οὐκ ἀπαντήσει and κακόν
  rationale: “Come upon” keeps the encounter image in more natural English.
- pob_phrase: but in trial
  simplified_phrase: But during a time of trial
  preserved_meaning: The person may still undergo adversity or testing.
  reasoning_layer_used: Lexical decision for πειρασμός
  rationale: The added time phrase makes the contrast easier to follow.
- pob_phrase: he will rescue him again
  simplified_phrase: the Lord will rescue that person again
  preserved_meaning: The Lord is the implied rescuer, and the rescue may be repeated.
  reasoning_layer_used: Theological decision on the implicit subject of ἐξελεῖται
  rationale: Explicit nouns remove unclear pronouns without changing their referents.
translation_notes:
  risk_flags:
  - risk: The first sentence may sound like a promise that trials never occur.
    mitigation: The second sentence explicitly preserves both the reality of trial and the Lord’s rescue.
