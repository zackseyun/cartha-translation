translation:
  language: en
  text: May fiery wrath consume the one who has survived,[a] and may those who wrong your people meet destruction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “the one being saved or preserved.” This difficult Greek phrase may mean an enemy who has escaped destruction so far.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: In fiery wrath let the survivor be consumed
  simplified_phrase: May fiery wrath consume the one who has survived
  preserved_meaning: The prayer asks that the remaining survivor be consumed by destructive, fire-like wrath.
  reasoning_layer_used: Lexical decisions and theological decision on imprecatory force
  rationale: The active clause is easier to follow while retaining the singular referent, fire image, and direct prayer for judgment.
- pob_phrase: those who do injustice to your people
  simplified_phrase: those who wrong your people
  preserved_meaning: These people act unjustly against God's people.
  reasoning_layer_used: Lexical decision for οἱ ἀδικοῦντες
  rationale: “Wrong” communicates unjust treatment in direct, common English.
