  simplified_phrase: For who would trust
  preserved_meaning: The rhetorical question expects that no one would place trust in such a person.
  reasoning_layer_used: Lexical decision for τίς γὰρ πιστεύσει and its listed alternative.
  rationale: “Would trust” makes the proverbial question sound natural in modern English.
- pob_phrase: staggering from city to city
  simplified_phrase: stumbling from city to city
  preserved_meaning: The robber moves precariously and without stability from one city to another.
  reasoning_layer_used: Lexical rationale for σφαλλομένῳ ἐκ πόλεως εἰς πόλιν.
  rationale: “Stumbling” clearly conveys unstable movement without suggesting drunkenness.
- pob_phrase: So it is with a man who has no nest and lodges wherever night finds him
  simplified_phrase: The same is true of a man who has no nest—no secure home—and spends the night wherever darkness overtakes him
  preserved_meaning: The comparison concerns a man without settled shelter who stays wherever evening catches him.
  reasoning_layer_used: Lexical decisions for οὕτως, νοσσιὰν, καταλύοντι, and οὗ ἐὰν ὀψίσῃ.
  rationale: The rewrite explains the nest image and replaces formal lodging language with ordinary English.
