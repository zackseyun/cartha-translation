translation:
  language: en
  text: Give testimony to your creatures that have existed from the beginning,[a] and raise up the prophecies spoken in your name.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “to what you created at the beginning.” The Greek may refer broadly to created things, not only living beings.
    reason: lexical_alternative
  - marker: b
    text: “Raise up” may mean “bring to fulfillment,” but it can also suggest vindicating the prophecies or giving them renewed force.
    reason: alternative_reading
