  reasoning_layer_used: Lexical and theological decisions on κτίσμασιν and τοῖς ἐν ἀρχῇ
  rationale: The relative clause clarifies the likely temporal relationship while preserving the Greek phrase’s breadth.
- pob_phrase: raise up the prophecies
  simplified_phrase: raise up the prophecies
  preserved_meaning: The source image remains open to fulfillment, vindication, or renewed force.
