  reasoning_layer_used: Lexical decision for σφαλλομένῳ
  rationale: The natural phrasing retains the source image of stumbling rather than flattening it to wandering.
- pob_phrase: So it is with a man
  simplified_phrase: The same is true of a man
  preserved_meaning: The unsettled robber is compared with a man who has no fixed home.
  reasoning_layer_used: POB translation and immediate context
  rationale: This states the comparison directly in ordinary English.
- pob_phrase: lodges wherever evening finds him
  simplified_phrase: stays wherever nightfall finds him
  preserved_meaning: He stops wherever darkness overtakes him.
  reasoning_layer_used: Lexical decisions for καταλύοντι and οὗ ἐὰν ὀψίσῃ
