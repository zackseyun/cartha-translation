translation:
  language: en
  text: Who would trust a well-armed robber stumbling from one city to another? The same is true of a man who has no nest[a] and stays wherever nightfall finds him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “nest” is a picture of a settled home or secure resting place.
    reason: lexical_alternative
