translation:
  language: en
  text: Lord, have mercy on the people who bear your name. Have mercy on Israel, whom you made like a firstborn son.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Israel, whom you made your firstborn.” The Greek says, “whom you made like a firstborn.” This alternative reflects the broader biblical theme of Israel as God’s firstborn son; compare Exodus 4:22.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Have mercy on the people, O Lord
  simplified_phrase: Lord, have mercy on the people
  preserved_meaning: This remains a direct, solemn plea to the Lord for compassionate action.
  reasoning_layer_used: POB lexical decisions for ἐλέησον and Κύριε
  rationale: Placing the address first is natural modern English, and “O” is unnecessary.
- pob_phrase: who are called by your name
  simplified_phrase: who bear your name
  preserved_meaning: The people are identified as belonging under the Lord’s name.
  reasoning_layer_used: POB lexical rationale for κεκλημένον ἐπʼ ὀνόματί σου
  rationale: “Bear your name” makes the covenantal designation easier to understand.
- pob_phrase: and on Israel, whom you likened to a firstborn son
  simplified_phrase: Have mercy on Israel, whom you made like a firstborn son
  preserved_meaning: Israel remains included in the plea, and God’s active likening of Israel to a firstborn remains comparative.
  reasoning_layer_used: POB theological decision for ὡμοίωσας and lexical decision for πρωτόγονον
  rationale: A new sentence clarifies the repeated plea, while “made like” preserves the source verb’s active force.
translation_notes:
  risk_flags:
  - risk: “Made like a firstborn son” may be mistaken for the stronger claim that God made Israel his firstborn.
    mitigation: The footnote distinguishes the Greek comparison from the broader biblical interpretation.
