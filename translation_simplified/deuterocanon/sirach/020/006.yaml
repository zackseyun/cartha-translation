translation:
  language: en
  text: Some people remain silent because there is no answer. Others remain silent because they see when the time is right.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek version has a notably different proverb: “A wise person remains silent until the right time, but a babbler and a fool let the right time pass.” The main text follows the surviving Hebrew.'
    reason: textual_variant
