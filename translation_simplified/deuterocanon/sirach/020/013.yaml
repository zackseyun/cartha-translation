translation:
  language: en
  text: A wise man says little about himself.[a] But the gift of fools pours out wisdom.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “A wise man says little for his own benefit.”
    reason: lexical_alternative
  - marker: b
    text: 'The last line may be ironic: fools may pour out many words as though they were wisdom.'
    reason: lexical_alternative
  - marker: c
    text: The Greek reads, “A fool’s gift will not benefit you, for his eyes are many instead of one.” The surviving Hebrew and Greek differ greatly here.
    reason: textual_variant
simplification_decisions:
- pob_phrase: speaks little for himself
  simplified_phrase: says little about himself
  preserved_meaning: The wise man speaks sparingly in relation to himself.
  reasoning_layer_used: Hebrew lexical decisions for בִּמְעַט and נַפְשׁוֹ
  rationale: This natural wording preserves self-reference while the note retains the possible self-interest sense.
- pob_phrase: the goodness of fools pours out wisdom
  simplified_phrase: the gift of fools pours out wisdom
  preserved_meaning: A benefaction associated with fools is pictured as pouring out wisdom.
  reasoning_layer_used: Hebrew lexical decisions for טוֹבָה, יִשְׁפוֹךְ, and חָכְמָה
  rationale: The wording uses the audited concrete sense “gift” and keeps the original pouring image without making fools deliberate teachers.
translation_notes:
  risk_flags:
  - risk: The Hebrew and Greek witnesses preserve substantially different forms of the verse.
    mitigation: The main text follows the surviving Hebrew, while footnote c gives the Greek variant.
  - risk: The final clause may be ironic, but the Hebrew does not make the irony certain.
    mitigation: The main text leaves the tone open, while footnote b presents irony only as a possibility.
