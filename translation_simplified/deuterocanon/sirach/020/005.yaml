simplification_decisions:
- pob_phrase: There is one who keeps silent and is considered wise
  simplified_phrase: Some remain silent and are thought wise
  preserved_meaning: A person’s continued silence can lead others to regard that person as wise.
  reasoning_layer_used: Hebrew lexical decisions for מַחֲרִישׁ and וְנֶחְשָׁב
  rationale: The plural generic form makes the proverb natural without changing its social judgment.
- pob_phrase: there is one who is despised because of much talk
  simplified_phrase: others are despised for talking too much
  preserved_meaning: Excessive speech can cause others to treat a person with contempt.
  reasoning_layer_used: Hebrew lexical decisions for נִמְאָס, בְּרוֹב, and שִׂיחַ
  rationale: “Talking too much” expresses the Hebrew cause in direct everyday English.
