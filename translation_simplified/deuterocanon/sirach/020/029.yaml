translation:
  language: en
  text: Hospitality[a] and gifts[b] blind the eyes of wise people. Like a muzzle on the mouth, they keep people from giving rebukes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “guest-gifts”; the Greek may mean hospitality or gifts connected with guest-friendship.
    reason: lexical_alternative
  - marker: b
    text: These gifts are favors that can corrupt judgment, though the Greek does not explicitly call them bribes.
    reason: lexical_alternative
