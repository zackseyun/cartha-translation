  preserved_meaning: Even people known for wisdom can have their judgment impaired.
  reasoning_layer_used: POB lexical decision for ὀφθαλμοὺς σοφῶν
  rationale: “Wise people” is clearer modern English while retaining the blindness image.
- pob_phrase: and like a muzzle on the mouth they turn away rebukes
  simplified_phrase: Like a muzzle on the mouth, they keep people from giving rebukes.
  preserved_meaning: Hospitality and gifts restrain people from voicing needed correction.
  reasoning_layer_used: POB lexical decisions for φιμός, ἀποτρέπει, and ἐλεγμούς
  rationale: The wording keeps the muzzle image and clearly identifies the restrained speech.
