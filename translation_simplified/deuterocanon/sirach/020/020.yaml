    text: Or “parable,” if the Greek word is understood more broadly than “proverb.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: A proverb will be rejected from the mouth of a fool
  simplified_phrase: People will reject a proverb when a fool speaks it
  preserved_meaning: The proverb is rejected because it comes from a morally and practically foolish speaker.
  reasoning_layer_used: POB lexical decisions for ἀπὸ στόματος, μωροῦ, and ἀποδοκιμασθήσεται
  rationale: The active wording makes the response clear while keeping the fool as the proverb’s unsuitable source.
- pob_phrase: he will certainly not speak it at its proper time
  simplified_phrase: he will certainly not say it at the right time
  preserved_meaning: The emphatic denial says the fool fails to give the proverb on its fitting occasion.
  reasoning_layer_used: POB lexical decisions for οὐ γὰρ μὴ, εἴπῃ αὐτήν, and ἐν καιρῷ αὐτῆς
  rationale: “Right time” is common English and retains the emphatic negation without asserting a wrong-time utterance.
translation_notes:
  risk_flags:
  - risk: Changing the passive clause to active wording supplies the general subject “People.”
    mitigation: The wording leaves the rejecting audience unspecified and preserves the proverb’s rejection.
