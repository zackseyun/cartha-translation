  preserved_meaning: The person lacks grace, charm, or fitting conduct toward others without being reduced to merely ungrateful or impolite.
  reasoning_layer_used: POB lexical decision for ἄχαρις
  rationale: This wording explains the social setting while preserving the adjective’s broader sense.
- pob_phrase: an untimely saying
