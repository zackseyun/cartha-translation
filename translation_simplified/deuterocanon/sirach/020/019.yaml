translation:
  language: en
  text: 'Someone who lacks grace in dealing with others: a remark made at the wrong time.[a] People without proper discipline keep repeating it.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek is brief and leaves the connection between the person and the remark unstated; it may also be rendered, “An unpleasant person is an ill-timed tale.”
    reason: lexical_alternative
