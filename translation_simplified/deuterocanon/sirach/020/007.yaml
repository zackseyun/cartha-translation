translation:
  language: en
  text: A wise man remains silent until it is the right time to speak.[a] But a fool does not recognize the right time.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The ancient Greek version has a substantially different saying: “The one who talks too much will be detested, and the one who acts high-handedly will be hated.”'
    reason: source_note
simplification_decisions:
- pob_phrase: keeps silent until the right time
  simplified_phrase: remains silent until it is the right time to speak
  preserved_meaning: The wise man deliberately waits for the proper occasion before speaking.
  reasoning_layer_used: Hebrew lexical decisions for יַחֲרִישׁ and עַד עֵת
  rationale: This makes the implied speech context clear while preserving deliberate silence and fitting timing.
- pob_phrase: does not observe the right time
  simplified_phrase: does not recognize the right time
  preserved_meaning: The fool fails to discern the fitting occasion.
  reasoning_layer_used: Hebrew lexical decision for לֹא יִשְׁמוֹר עֵת and grounding review
  rationale: “Recognize” is natural English and avoids implying deliberate disregard.
- pob_phrase: but a fool
  simplified_phrase: But a fool
  preserved_meaning: The fool stands in direct contrast to the wise man.
  reasoning_layer_used: Hebrew discourse rationale for adversative וּ
  rationale: A new sentence makes the contrast easier to follow without weakening it.
interpretive_expansions:
- pob_phrase: the right time
  rendering: the right time to speak
  claim: The proper time concerns when to speak after remaining silent.
  evidence:
  - The first clause explicitly describes remaining silent until that time.
  - The two clauses form a contrast about wise and foolish timing.
  confidence: high
  alternatives_preserved:
  - the right occasion
  external_witnesses:
  - The substantially different Greek parallel also concerns excessive speech.
translation_notes:
  risk_flags:
  - risk: “Recognize” emphasizes discernment within the Hebrew’s broader idea of keeping or observing proper timing.
    mitigation: The wording does not claim that the fool knowingly ignores the right time.
  - risk: The Hebrew and Greek forms of this verse differ substantially.
    mitigation: The main text follows the controlling Hebrew, while the Greek wording appears in a footnote.
