translation:
  language: en
  text: Do not call a man blessed[a] before he dies, because a man’s true state becomes clear at the end of his life.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “happy” or “fortunate.”
    reason: lexical_alternative
  - marker: b
    text: 'The Greek reads very differently: “Beware of an evildoer, for he devises evil, lest he put a blemish on you forever.” The Hebrew is followed here.'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Before death, do not call a man blessed
  simplified_phrase: Do not call a man blessed before he dies
  preserved_meaning: Do not make a final favorable judgment about a man while he is still alive.
  reasoning_layer_used: Lexical decision for לִפְנֵי מָוֶת and אַל תְּאַשֶּׁר
  rationale: The clause is reordered into natural English while retaining “blessed” and the warning against judging too early.
- pob_phrase: in his end
  simplified_phrase: at the end of his life
  preserved_meaning: The man’s final outcome at death is in view.
  reasoning_layer_used: Lexical and theological decisions for בְּאַחֲרִיתוֹ
  rationale: The clearer phrase preserves both the temporal endpoint and its evaluative force.
- pob_phrase: a man is made known
  simplified_phrase: a man’s true state becomes clear
  preserved_meaning: His character or condition is revealed by his final outcome.
  reasoning_layer_used: Lexical decision for יִנָּכֵר and final-clause rationale
  rationale: The passive idiom is recast clearly without limiting the revelation to character alone.
