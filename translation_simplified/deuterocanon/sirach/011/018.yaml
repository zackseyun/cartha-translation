translation:
  language: en
  text: Some people become rich by being careful and stingy. This is the reward they receive:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The surviving Cairo Geniza Hebrew has a different saying here: “Wisdom, understanding, and discerning a matter are from the LORD; sin and upright ways are from the LORD.” The main text follows the Greek because the Hebrew line does not match this verse in the known sequence.'
