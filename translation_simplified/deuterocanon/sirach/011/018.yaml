simplification_decisions:
- pob_phrase: There is one who grows rich
  simplified_phrase: Some people become rich
  preserved_meaning: A person acquires wealth.
  reasoning_layer_used: Greek lexical decision for ἔστιν πλουτῶν
  rationale: The plural English form states the general observation naturally without changing its meaning.
- pob_phrase: by care and stinginess
  simplified_phrase: by being careful and stingy
  preserved_meaning: Careful conduct and tightfistedness are the means of gaining wealth.
  reasoning_layer_used: Greek lexical decisions for ἀπὸ προσοχῆς and σφιγγίας
  rationale: Adjectives make the conduct easier to picture while retaining its mixed moral coloring.
- pob_phrase: this is the share of his reward
  simplified_phrase: This is the reward they receive
  preserved_meaning: The wealth is the outcome the person gains from that conduct.
  reasoning_layer_used: Greek lexical decisions for μερὶς and μισθός
  rationale: The direct wording clarifies the allotted-outcome metaphor without implying employment wages.
