translation:
  language: en
  text: Folly and darkness are stored up for those who rebel,[a] and evil stays with those who do evil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek reads very differently: “He says, ‘I have found rest, and now I will enjoy my wealth.’ But he does not know how much time remains. He will leave his possessions to others and die.”'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: are reserved for transgressors
  simplified_phrase: are stored up for those who rebel
  preserved_meaning: Folly and darkness are being kept as consequences for people who willfully rebel.
  reasoning_layer_used: Hebrew lexical decisions for נוֹצְרָה and לְפוֹשְׁעִים
  rationale: The wording makes both the stored consequence and willful rebellion clear in common English.
- pob_phrase: evildoers have evil with them
  simplified_phrase: evil stays with those who do evil
  preserved_meaning: Evil accompanies people who practice evil, whether as wrongdoing or harmful consequence.
  reasoning_layer_used: Hebrew lexical decisions for וּמְרֵעִים, רָעָה, and עִמָּם
  rationale: The active wording is easier to understand while retaining the repeated “evil” and its ambiguity.
translation_notes:
  risk_flags:
