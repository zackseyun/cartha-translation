translation:
  language: en
  text: Remain faithful to your covenant and continue to give it your attention. Keep doing your work as you grow old.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Hebrew witness reads: “The gift of a righteous man will stand for those who fear him, and his favor will prosper forever.” The Hebrew and Greek differ substantially here.'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Stand by your covenant
  simplified_phrase: Remain faithful to your covenant
  preserved_meaning: The command calls for steadfast loyalty to the covenant.
  reasoning_layer_used: Greek lexical decisions for στῆθι and διαθήκῃ
  rationale: “Remain faithful” clearly expresses steadfast continuance without weakening the covenant language.
- pob_phrase: attend to it
  simplified_phrase: continue to give it your attention
  preserved_meaning: The command requires ongoing engagement with the covenant.
  reasoning_layer_used: Greek lexical decision for ὁμίλει
  rationale: This wording preserves the verb’s broad sense without implying exclusive devotion.
- pob_phrase: grow old in your work
  simplified_phrase: Keep doing your work as you grow old
  preserved_meaning: The image of aging conveys lifelong perseverance in one’s work.
  reasoning_layer_used: Greek lexical decisions for παλαιώθητι and ἔργῳ
  rationale: The recast clause sounds natural while retaining both work and growing old.
