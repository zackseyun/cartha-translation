translation:
  language: en
  text: God’s blessing is the portion allotted to the righteous. When the time of his hope comes, it will blossom.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek has a very different form of this verse: “An evil hour makes luxury forgotten, and at a person’s end his works are revealed.”'
    reason: textual_variant
  - marker: b
    text: “It” may refer either to God’s blessing or to the righteous person’s hope.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: is the lot of the righteous
  simplified_phrase: is the portion allotted to the righteous
  preserved_meaning: God’s blessing is the share divinely assigned to righteous people.
  reasoning_layer_used: The lexical decision defines “lot” as an allotted portion and rejects the stronger idea of fixed destiny.
  rationale: The wording explains the unfamiliar “lot” metaphor while preserving the image of allotment.
- pob_phrase: in the time of his hope
  simplified_phrase: when the time of his hope comes
  preserved_meaning: The blossoming occurs at the time connected with the righteous person’s hope.
  reasoning_layer_used: The lexical decision retains the temporal phrase and the representative singular “his.”
  rationale: Recasting the phrase as a time clause makes it easier to read without resolving what the hope denotes.
translation_notes:
  risk_flags:
  - risk: English readers may take “it” only as God’s blessing and miss the possible reference to hope.
    mitigation: Footnote b preserves both antecedents without weakening the preferred reading.
  - risk: The Greek parallel reflects a substantially different textual tradition.
    mitigation: Footnote a reports the divergent Greek while keeping the Hebrew as the main text.
