translation:
  language: en
  text: The Lord’s works are marvelous, and what he does is hidden from human beings.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek text differs substantially: “Many tyrants sat on the ground, but an unexpected person wore a crown.” The Hebrew and Greek appear to preserve different forms of this verse.'
    reason: textual_variant
simplification_decisions:
- pob_phrase: the works of the Lord are wondrous
  simplified_phrase: The Lord’s works are marvelous
  preserved_meaning: The Lord’s works are extraordinary and worthy of wonder.
  reasoning_layer_used: Hebrew lexical decision for פְלָאוֹת and מַעֲשֵׂי
  rationale: “Marvelous” is a common equivalent that keeps the elevated force of “wondrous.”
- pob_phrase: his work
  simplified_phrase: what he does
  preserved_meaning: God’s activity remains beyond full human perception.
  reasoning_layer_used: Hebrew lexical decision for פָּעֳלוֹ
  rationale: The documented alternative “what he does” makes the singular expression natural in modern English.
- pob_phrase: from man
  simplified_phrase: from human beings
  preserved_meaning: The reference is to humanity generally, not only to one male person.
  reasoning_layer_used: Lexical and theological decisions for generic אָדָם
  rationale: “Human beings” clearly communicates the generic human sense for modern readers.
translation_notes:
  risk_flags:
  - risk: The Greek parallel presents a substantially different saying.
    mitigation: A textual-variant footnote preserves the alternate witness without displacing the controlling Hebrew text.
  - risk: “What he does” makes the Hebrew noun phrase more verbal.
    mitigation: The opening phrase “The Lord’s works” retains the verse’s work-and-deed language.
