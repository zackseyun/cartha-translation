translation:
  language: en
  text: Do not be surprised by those who do evil.[a] Run to the Lord and wait for his light.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek version has a substantially different saying: “In good times, bad times are forgotten, and in bad times, good times will not be remembered.”'
    reason: textual_variant
simplification_decisions:
- pob_phrase: Do not be astonished at evildoers
  simplified_phrase: Do not be surprised by those who do evil
  preserved_meaning: Do not be taken aback by people characterized by evil actions.
  reasoning_layer_used: Hebrew lexical decisions for אַל תִּתְמַה בְּעוֹשֵׂי רָע
  rationale: “Surprised” is common English within the documented sense, and “those who do evil” clearly describes the people by their actions.
- pob_phrase: run to the Lord and wait for his light
  simplified_phrase: Run to the Lord and wait for his light
  preserved_meaning: Urgently turn to Israel’s God and wait for his light.
  reasoning_layer_used: Hebrew lexical and theological decisions for תָּרוּץ לַיי וְקַוֵּה לְאוֹרוֹ
  rationale: The separate sentence clarifies the command while preserving both the urgent image of running and the open image of divine light.
translation_notes:
  risk_flags:
  - risk: “His light” may be unclear to readers unfamiliar with biblical imagery.
    mitigation: It remains open because the Hebrew image may suggest divine favor, guidance, or deliverance without choosing only one.
