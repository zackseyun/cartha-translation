translation:
  language: en
  text: Do not say,[a] “I have enough right in front of me. What disaster could happen to me?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek reads, “Do not bring every person into your house, for the deceitful have many ambushes.” This is a substantially different form of the verse.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: I have enough before me
  simplified_phrase: I have enough right in front of me
  preserved_meaning: The speaker claims that the resources presently before him are sufficient.
  reasoning_layer_used: Hebrew lexical decisions for דַּיִּי and לְפָנַי
  rationale: This keeps both the claim of sufficiency and the Hebrew image without broadening it to every need.
- pob_phrase: what disaster will come upon me?
  simplified_phrase: What disaster could happen to me?
  preserved_meaning: The speaker presumptuously dismisses the possibility of future disaster.
  reasoning_layer_used: Hebrew lexical decision for יְהִי עָלָי and latest doctrine realignment
  rationale: The modern rhetorical question preserves the intended denial of possible disaster.
- pob_phrase: many are the ambushes of the deceitful
  simplified_phrase: the deceitful have many ambushes
  preserved_meaning: The Greek alternative warns of many hidden dangers associated with deceitful people.
  reasoning_layer_used: Greek parallel and textual-divergence decision
  rationale: The footnote simplifies the clause without claiming explicitly that the deceitful set the ambushes.
translation_notes:
  risk_flags:
  - risk: The Hebrew and Greek preserve substantially different forms of this verse.
    mitigation: The Hebrew controls the main text, while the Greek form remains in an alternative-reading footnote.
  - risk: “Right in front of me” may sound strictly spatial rather than referring to present resources.
    mitigation: Its connection with “I have enough” conveys resources presently at hand while preserving the Hebrew image.
