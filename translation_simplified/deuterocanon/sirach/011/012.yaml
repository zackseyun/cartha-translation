translation:
  language: en
  text: My son,[a] if you do not run, you will not get there. If you do not seek, you will not find.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek version differs greatly: it describes a weak and poor person whom the Lord looks on with favor and raises from humiliation. This translation follows the Hebrew text.'
    reason: textual_variant
simplification_decisions:
- pob_phrase: you will not attain
  simplified_phrase: you will not get there
  preserved_meaning: Without energetic effort, a person will not reach what is pursued.
  reasoning_layer_used: The lexical rationale supports reaching while preserving the concrete running image.
  rationale: This common expression leaves the destination unstated, as the Hebrew does.
- pob_phrase: and if you do not seek
  simplified_phrase: If you do not seek
  preserved_meaning: The proverb keeps running and seeking as two distinct conditions.
  reasoning_layer_used: The Hebrew parallelism and seek/find pairing guide the sentence division.
  rationale: A new sentence makes the balanced lines easier to follow.
translation_notes:
  risk_flags:
  - risk: “Get there” is idiomatic rather than a direct equivalent of “attain.”
    mitigation: It preserves the run-and-reach image without adding a specific goal.
