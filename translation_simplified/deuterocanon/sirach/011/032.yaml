translation:
  language: en
  text: Do not call a man blessed[a] before you have examined him, because a man will be called blessed in light of his final outcome.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “blessed” can also mean happy or fortunate.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek version has a substantially different saying here: “From a spark of fire a heap of coals will grow, and a sinful man lies in wait for blood.”'
    reason: textual_variant
simplification_decisions:
- pob_phrase: Before you examine a man, do not call him blessed
  simplified_phrase: Do not call a man blessed before you have examined him
  preserved_meaning: A man must be examined before he is pronounced blessed.
  reasoning_layer_used: Hebrew syntax and lexical decision for תַּחְקֹר
  rationale: The reordered clauses give natural English while preserving the command.
- pob_phrase: for
  simplified_phrase: because
  preserved_meaning: The final clause gives the reason for the command.
  reasoning_layer_used: Lexical decision for כִּי
  rationale: “Because” makes the logical connection immediately clear.
- pob_phrase: in his end
  simplified_phrase: in light of his final outcome
  preserved_meaning: The judgment of blessedness rests on how the man's life ultimately turns out.
  reasoning_layer_used: Lexical rationale for בְּאַחֲרִיתוֹ and the repeated forms of אשר
  rationale: This clarifies “end” while retaining the declaration “will be called blessed.”
interpretive_expansions:
- pob_phrase: in his end
  rendering: in light of his final outcome
  claim: A man's ultimate outcome is the basis on which he is called blessed.
  evidence:
  - The Hebrew term can mean either end or outcome.
  - POB identifies final outcome as the wisdom saying's evaluative setting.
  confidence: high
  alternatives_preserved:
  - at his end
  - in his outcome
translation_notes:
  risk_flags:
  - risk: “Final outcome” may include more than the moment of death.
    mitigation: This breadth preserves POB’s documented range of end or outcome.
  - risk: The Greek witness contains a different saying.
    mitigation: The substantial textual divergence is retained in a footnote.
