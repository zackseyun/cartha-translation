translation:
  language: en
  text: Keep many people out of your house.[a] Do not welcome every man into your home, because many are secretly waiting to harm you,[b] and many are deceivers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Hebrew is primary. The Greek has a different form: “Give an outsider lodging, and he will bring you turmoil and estrange you from what is yours.”'
    reason: alternative_reading
  - marker: b
    text: Parts of this verse are reconstructed or uncertain in the surviving Hebrew manuscripts.
    reason: textual_variant
simplification_decisions:
- pob_phrase: Keep many out of your house
  simplified_phrase: Keep many people out of your house
  preserved_meaning: Many people should be denied access to the household.
  reasoning_layer_used: Hebrew lexical decision for מְנַע רַבִּים מִתּוֹךְ בֵּיתֶךָ
  rationale: Adding “people” makes the object immediately clear without changing the command.
- pob_phrase: do not bring every man into your home
  simplified_phrase: Do not welcome every man into your home
  preserved_meaning: The warning opposes indiscriminate hospitality while retaining the masculine generic.
  reasoning_layer_used: POB lexical decision and doctrine realignment for אִישׁ
  rationale: “Welcome” naturally expresses admitting someone as a guest.
- pob_phrase: many lie in wait
  simplified_phrase: many are secretly waiting to harm you
  preserved_meaning: Many people may lurk with harmful intent.
  reasoning_layer_used: POB lexical rationale for אוֹרְבִים
  rationale: The wording explains the image of lying in wait for readers unfamiliar with the idiom.
interpretive_expansions:
- pob_phrase: many lie in wait
  rendering: many are secretly waiting to harm you
  claim: Those lying in wait have concealed harmful intent toward the householder.
  evidence:
  - The POB rationale describes people lurking with harmful intent.
  - The warning about admitting people into the home supplies the threatened person.
  confidence: high
  alternatives_preserved:
  - many lie in wait
  - many are plotters
