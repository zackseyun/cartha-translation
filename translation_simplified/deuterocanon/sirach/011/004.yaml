translation:
  language: en
  text: Do not ridicule someone for wearing shabby clothes.[b] Do not praise yourself when times are hard.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek reads: “Do not boast about your clothing or exalt yourself in a day of glory, for the Lord’s works are wonderful, and what he does among human beings is hidden.”'
    reason: textual_variant
  - marker: b
    text: Or possibly, “Do not ridicule a poor person.” The Hebrew expression may describe a worn-out cloak or tattered garment.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Do not mock a poor man
  simplified_phrase: Do not ridicule someone for wearing shabby clothes
  preserved_meaning: The command forbids contempt based on a person's lowly outward appearance.
  reasoning_layer_used: Hebrew lexical decisions for מַעֲטֶה and אֹבֵד, with the POB alternative retained in a note
  rationale: This restores the audited garment image without hiding the possible poor-person reading.
- pob_phrase: do not boast in bitter days
  simplified_phrase: Do not praise yourself when times are hard
  preserved_meaning: The command still warns against self-exaltation during hardship.
  reasoning_layer_used: POB lexical decisions for תְּקַלֵּס and בִּמְרִירֵי יוֹם
  rationale: This expresses the difficult Hebrew phrase in direct modern English.
interpretive_expansions:
- pob_phrase: in bitter days
  rendering: when times are hard
  claim: The bitter days are periods of hardship.
  evidence:
  - The POB lexical rationale explicitly identifies the phrase with hard times.
  confidence: high
  alternatives_preserved:
  - on a bitter day
  - in days of bitterness
  - in a day of glory
  external_witnesses:
  - The Greek parallel has the divergent reading “in a day of glory.”
translation_notes:
  risk_flags:
