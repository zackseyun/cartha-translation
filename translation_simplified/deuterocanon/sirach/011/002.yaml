  preserved_meaning: Outward appearance is the basis of the praise being forbidden.
  reasoning_layer_used: The lexical decision for בְּתָאֳרוֹ retains the Hebrew’s broad focus on physical appearance.
  rationale: The new wording expresses the same relationship in ordinary English.
- pob_phrase: who is ugly in his looks
  simplified_phrase: because he looks ugly
  preserved_meaning: A man’s unattractive appearance must not become a reason to despise him.
  reasoning_layer_used: The lexical decisions for מְכוֹעָר and בְּמַרְאֵהוּ preserve both ugliness and visible appearance.
  rationale: The recast clause removes awkward repetition while keeping the concrete focus on looks.
