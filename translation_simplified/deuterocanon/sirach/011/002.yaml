translation:
  language: en
  text: Do not praise a man because of how he looks,[a] and do not despise a man because he looks ugly.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “because of his beauty,” but the Hebrew refers more broadly to his appearance.
    reason: lexical_alternative
