translation:
  language: en
  text: Do not argue when there is no real cause,[a] and do not get involved in the quarrel of arrogant people.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “cause” may also mean grief, trouble, or offense.
    reason: lexical_alternative
  - marker: b
    text: The Greek has a very different form of this verse, warning against taking on too many activities and pursuing what cannot be attained.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Do not contend where there is no cause
  simplified_phrase: Do not argue when there is no real cause
  preserved_meaning: A person should not enter a dispute without valid grounds.
  reasoning_layer_used: Hebrew lexical decisions for עַצָּבָה and אַל תִּתְחָר
  rationale: “Argue” and “real cause” state the relational warning in common English.
- pob_phrase: do not rise up in the quarrel
  simplified_phrase: do not get involved in the quarrel
  preserved_meaning: The command warns against entering or participating in the dispute.
  reasoning_layer_used: Hebrew lexical decision for אַל תְּקוֹמֵם
  rationale: “Get involved” clarifies the practical force without implying that the reader chooses a side.
- pob_phrase: the quarrel of the arrogant
  simplified_phrase: the quarrel of arrogant people
  preserved_meaning: The dispute belongs to people characterized by arrogance.
  reasoning_layer_used: Hebrew lexical decisions for רִיב and זֵדִים
  rationale: Adding “people” makes the description clear while preserving whose quarrel it is.
