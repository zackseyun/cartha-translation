translation:
  language: en
  text: My son, stay on the course set for you[b] and keep walking in it. Continue in your work into old age.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek reads, “Do not say, ‘I have all I need. What harm can come to me now?’” The surviving Hebrew differs greatly from the Greek.
    reason: alternative_reading
  - marker: b
    text: The Hebrew is difficult and may refer to your allotted portion, prescribed sphere, or rule of life.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: stand by your appointed lot
  simplified_phrase: stay on the course set for you
  preserved_meaning: Remain committed to the allotted or prescribed sphere of life given to you.
  reasoning_layer_used: Hebrew lexical decision for בְּחֻקֶּךָ
  rationale: “Course set for you” makes the unusual Hebrew idea understandable without forcing a legal meaning.
- pob_phrase: walk in it
  simplified_phrase: keep walking in it
  preserved_meaning: Continue to conduct your life within that course.
  reasoning_layer_used: Hebrew lexical decision for וּבוֹ הִתְהַלֵּךְ
  rationale: “Keep” expresses ongoing conduct while preserving the Hebrew walking image.
- pob_phrase: grow old in your work
  simplified_phrase: Continue in your work into old age
  preserved_meaning: Persevere in your occupation over a long lifetime rather than exhausting yourself.
  reasoning_layer_used: Hebrew lexical decisions for וּבִמְלָאכְתְּךָ הִתְיַשֶּׁן
  rationale: The recast sentence states the intended duration in ordinary English.
