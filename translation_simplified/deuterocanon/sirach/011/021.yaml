translation:
  language: en
  text: Some people grow rich through hardship,[a] and this is the reward they deserve.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “through self-denial,” “through suffering,” or “from hard work.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew wording of this clause is difficult; it probably refers to a reward that is rightly due.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: There is one who grows rich
  simplified_phrase: Some people grow rich
  preserved_meaning: The saying describes a type of person who becomes wealthy.
  reasoning_layer_used: POB lexical decision for יֵשׁ and מִתְעַשּׁר
  rationale: A natural plural generalization makes the wisdom saying easier to read without changing its scope.
- pob_phrase: through affliction
  simplified_phrase: through hardship
  preserved_meaning: The wealth comes through suffering, self-denial, or toil rather than ease.
  reasoning_layer_used: POB lexical rationale and Greek parallel
  rationale: “Hardship” is common English and keeps the Hebrew expression broad.
translation_notes:
  risk_flags:
  - risk: “Hardship” may be read as imposed suffering alone.
    mitigation: Footnote a preserves self-denial, suffering, and hard work as possible senses.
  - risk: The final Hebrew clause is unusually compressed and uncertain.
    mitigation: Footnote b marks the difficulty while the main text retains POB’s chosen sense of deserved recompense.
