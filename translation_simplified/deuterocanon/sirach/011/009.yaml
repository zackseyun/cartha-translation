translation:
  language: en
  text: My son,[a] listen to a matter before you answer it, and do not interrupt while someone else is speaking.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek reads, “Do not quarrel about a matter you have no need of, and do not sit in judgment with sinners.” The surviving Hebrew and Greek differ substantially; the main text follows the Hebrew.
    reason: textual_variant
simplification_decisions:
- pob_phrase: do not answer a matter before you hear it
  simplified_phrase: listen to a matter before you answer it
  preserved_meaning: A person must hear an issue before responding to it.
  reasoning_layer_used: Hebrew lexical decisions for שמע and השיב דבר
  rationale: Reordering the warning makes its sequence natural and clear in English.
- pob_phrase: do not speak in the midst of conversation
  simplified_phrase: do not interrupt while someone else is speaking
  preserved_meaning: One should not speak over speech already in progress.
  reasoning_layer_used: Hebrew lexical decision for בתוך שיחה and its contextual rationale
  rationale: The clearer wording expresses the interpersonal action implied by ongoing speech.
interpretive_expansions:
- pob_phrase: do not speak in the midst of conversation
  rendering: do not interrupt while someone else is speaking
  claim: The command concerns speaking while another person's speech is already in progress.
  evidence:
  - The Hebrew phrase places the prohibited speaking within ongoing speech or conversation.
  - The POB lexical rationale identifies an interpersonal setting.
  confidence: moderate
  alternatives_preserved:
  - do not speak in the middle of conversation
