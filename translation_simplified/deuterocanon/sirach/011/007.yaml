translation:
  language: en
  text: Many people who were raised to high status have been deeply disgraced and brought down together. Even honored people have been placed in someone else’s hands and under their control.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek has a substantially different reading: “Before you examine, do not blame; first understand, and then rebuke.” This translation follows the surviving Hebrew text.'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Many who were exalted
  simplified_phrase: Many people who were raised to high status
  preserved_meaning: They had been elevated to social prominence.
  reasoning_layer_used: Hebrew lexical decision for נִשָּׂאִים
  rationale: The wording makes the social meaning of “exalted” immediately clear.
- pob_phrase: have been greatly disgraced, and brought low together
  simplified_phrase: have been deeply disgraced and brought down together
  preserved_meaning: Their high standing was reversed through severe humiliation and collective or simultaneous downfall.
  reasoning_layer_used: Hebrew lexical decisions for נִקְלוּ, וְהִשְׁפִּלוּ, and יַחַד
  rationale: Common wording preserves both the severity and the reversal of status.
- pob_phrase: given into another’s hand
  simplified_phrase: placed in someone else’s hands and under their control
  preserved_meaning: Even honored people can be handed over to another person’s power.
  reasoning_layer_used: Hebrew idiom decision for נִתְּנוּ בְיָד
  rationale: The rendering keeps the hand image while explaining the control it signifies.
interpretive_expansions:
- pob_phrase: given into another’s hand
  rendering: placed in someone else’s hands and under their control
  claim: The hand idiom refers to being subjected to another person’s power.
  evidence:
  - The POB lexical rationale identifies the phrase as an idiom for power or control.
  - The POB translation already makes the otherwise unstated other party explicit.
  confidence: high
  alternatives_preserved:
  - handed over
  - delivered into another’s hand
translation_notes:
  risk_flags:
  - risk: The Greek parallel contains a different saying rather than a minor wording variant.
    mitigation: The footnote preserves the Greek reading while the main text follows the surviving Hebrew.
  - risk: “Together” may indicate collective or simultaneous action without specifying which.
    mitigation: The wording retains the Hebrew ambiguity rather than choosing one sense.
