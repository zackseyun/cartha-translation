translation:
  language: en
  text: Do not join in his laughter, or you may end up sharing his pain. In the end, you will grind your teeth.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Do not laugh with him
  simplified_phrase: Do not join in his laughter
  preserved_meaning: The warning is against taking part in his amusement, not merely laughing nearby.
  reasoning_layer_used: POB lexical decision for συγγελάσῃς
  rationale: This wording makes the compound verb’s participatory sense clear.
- pob_phrase: lest you share his pain
  simplified_phrase: or you may end up sharing his pain
  preserved_meaning: Present indulgence can lead to suffering together later.
  reasoning_layer_used: POB translation and lexical rationale for συνοδυνηθῇς
  rationale: The recast removes the unfamiliar “lest” while retaining the warning rather than making the result certain.
- pob_phrase: and in the end you will gnash your teeth
  simplified_phrase: In the end, you will grind your teeth.
  preserved_meaning: The eventual outcome is pictured as grinding the teeth in distress.
  reasoning_layer_used: POB lexical decisions for ἐπʼ ἐσχάτῳ and γομφιάσεις
  rationale: A separate sentence and the common verb “grind” make the vivid image easier to understand.
