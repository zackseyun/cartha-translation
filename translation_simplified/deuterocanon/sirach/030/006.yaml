translation:
  language: en
  text: The father left behind a son who would avenge him against his enemies and repay his friends for their kindness.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word translated “avenge” can also mean defend or vindicate; it refers to acting on another person’s behalf to bring justice or vengeance.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Before enemies he left behind an avenger
  simplified_phrase: The father left behind a son who would avenge him against his enemies
  preserved_meaning: The surviving son continues his father’s cause against enemies with the full retaliatory force of “avenger.”
  reasoning_layer_used: Immediate context and POB lexical and theological decisions
  rationale: Naming the father and son makes the relationship clear without softening vengeance into mere defense.
- pob_phrase: for friends one who repays kindness
  simplified_phrase: repay his friends for their kindness
  preserved_meaning: The son returns the kindness shown by the father’s friends.
  reasoning_layer_used: Immediate context and POB lexical decisions
  rationale: The clause is recast in ordinary English while retaining reciprocal repayment.
interpretive_expansions:
- pob_phrase: he left behind an avenger ... one who repays kindness
  rendering: The father left behind a son who would avenge him ... and repay his friends
  claim: The person left behind is the father’s surviving son, who acts on his behalf.
  evidence:
  - Sirach 30:4–6 identifies the two people as a father and his surviving son.
  - The POB rationale says the son continues his father’s cause and returns kindness shown by his friends.
  confidence: high
  alternatives_preserved:
  - The Greek leaves the possessive relationships implicit.
  - The footnote preserves “defend” and “vindicate” as possible nuances.
translation_notes:
  risk_flags:
