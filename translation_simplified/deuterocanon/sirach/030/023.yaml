translation:
  language: en
  text: Do not surrender your soul to grief.[a][b] Do not let your own sin make you stumble.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word is difficult and could mean “judgment,” but the Greek parallel supports “grief” or “sorrow.”
    reason: lexical_alternative
  - marker: b
    text: 'The Greek version adds: “Love your soul and comfort your heart, and put grief far from you; for grief has killed many, and there is no benefit in it.”'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Do not give your soul over to grief
  simplified_phrase: Do not surrender your soul to grief
  preserved_meaning: The reader must not yield the soul to a destructive state of grief.
  reasoning_layer_used: POB lexical decision for אל תתן and לדין
  rationale: “Surrender” expresses the Hebrew idiom more directly in modern English.
- pob_phrase: and do not stumble in your iniquity
  simplified_phrase: Do not let your own sin make you stumble
  preserved_meaning: A person’s wrongdoing can cause moral failure while the stumbling image remains intact.
  reasoning_layer_used: POB lexical decisions for ואל תכשל and בעונך
  rationale: The recast clause replaces opaque wording while preserving sin and stumbling as distinct ideas.
interpretive_expansions:
- pob_phrase: stumble in your iniquity
  rendering: let your own sin make you stumble
  claim: The wrongdoing is presented as what brings about the stumbling.
  evidence:
  - POB lists “through your guilt” and “by your wrongdoing” as contextual alternatives.
  - The POB rationale says עון may denote wrongdoing, guilt, or its consequences.
  confidence: moderate
  alternatives_preserved:
  - stumble in your iniquity
  - stumble through your guilt
