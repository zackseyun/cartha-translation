translation:
  language: en
  text: A glad heart brings a man life, and his rejoicing makes his days longer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Hebrew text of this verse is difficult and differs greatly from the Greek. This translation follows the clear meaning of the Greek.
