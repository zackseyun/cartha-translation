translation:
  language: en
  text: A poor man with life in him is better off than a rich man afflicted in his flesh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel says, “A poor man who is healthy and physically strong is better than a rich man scourged in his body.” The Hebrew is shorter and literally says “alive in himself” and “stricken in his flesh.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Better is a poor man
  simplified_phrase: A poor man ... is better off
  preserved_meaning: The proverb compares the poor man's condition favorably with the rich man's condition.
  reasoning_layer_used: Lexical decision for טוב and the Greek comparative parallel
  rationale: Ordinary English clause order makes the comparison immediately clear.
- pob_phrase: who is alive in himself
  simplified_phrase: with life in him
  preserved_meaning: The poor man possesses life in his own person without expanding the Hebrew to full health.
  reasoning_layer_used: Lexical decisions for וחי and בעצמו
  rationale: The wording keeps the Hebrew's reflexive idea while avoiding an opaque literal idiom.
- pob_phrase: stricken in his flesh
  simplified_phrase: afflicted in his flesh
  preserved_meaning: The rich man suffers a serious bodily affliction, and the concrete image of flesh remains.
  reasoning_layer_used: Lexical and theological decisions for ונגע and בבשרו
  rationale: “Afflicted” is clearer modern English, while “flesh” preserves the source-language image.
translation_notes:
  risk_flags:
  - risk: “With life in him” could be heard as emotional vitality rather than bodily life.
    mitigation: The contrast with affliction in the flesh and the footnote keep the bodily sense visible.
  - risk: The Greek parallel expresses health and strength more fully than the Hebrew.
    mitigation: The main text follows the shorter Hebrew, while the footnote preserves the Greek alternative.
