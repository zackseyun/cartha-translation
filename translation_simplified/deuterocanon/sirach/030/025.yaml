translation:
  language: en
  text: Let your soul rest and bring joy to your heart. Keep anger far away from you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is difficult here, and the ancient Greek has substantially different wording. This translation follows the surviving Hebrew; “bring joy to your heart” is a context-based reading of an uncertain verb.
    reason: textual_variant
simplification_decisions:
- pob_phrase: Give rest to your soul
  simplified_phrase: Let your soul rest
  preserved_meaning: The hearer is urged to ease and restore the inner person.
  reasoning_layer_used: Lexical decision for פוג and theological decision for נפשך
  rationale: The natural imperative keeps “soul” while expressing the calming action plainly.
- pob_phrase: gladden your heart
  simplified_phrase: bring joy to your heart
  preserved_meaning: The hearer should foster positive restoration within.
  reasoning_layer_used: Context-based lexical decision for ופיג and standard rendering of לבך
  rationale: “Bring joy” is more familiar than “gladden” without resolving the difficult verb more narrowly.
- pob_phrase: keep anger far from you
  simplified_phrase: Keep anger far away from you
  preserved_meaning: The command requires actively distancing oneself from anger.
  reasoning_layer_used: Lexical decision for וקצפון הרחק ממך
  rationale: Adding “away” makes the distancing image immediately natural in modern English.
