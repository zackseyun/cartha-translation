translation:
  language: en
  text: Discipline your son and make him bear a heavy yoke. Otherwise, in his foolishness he may swallow you up.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel reads, “Discipline your son and work on him, lest he stumble because of your disgrace.” The Hebrew reads, “lest in his foolishness he consume you.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: make his yoke heavy
  simplified_phrase: make him bear a heavy yoke
  preserved_meaning: The son is placed under demanding restraint and training, pictured as a yoke.
  reasoning_layer_used: Hebrew lexical decisions for והכבד עולו and עולו
  rationale: The active wording identifies who bears the yoke while preserving the Hebrew image.
- pob_phrase: lest
  simplified_phrase: Otherwise
  preserved_meaning: Failure to discipline the son may lead to the warned result.
  reasoning_layer_used: Hebrew lexical decision for פן
  rationale: “Otherwise” expresses the warning relationship in common modern English.
- pob_phrase: he consume you
  simplified_phrase: he may swallow you up
  preserved_meaning: The son may overwhelm and ruin the parent through his foolishness.
  reasoning_layer_used: Hebrew lexical decisions for באולתו and יבלע בך
  rationale: This keeps the son as the agent and preserves the vivid image of swallowing.
translation_notes:
  risk_flags:
  - risk: A heavy yoke could be mistaken for endorsing cruelty rather than demanding discipline.
    mitigation: The command to discipline frames the yoke as corrective restraint and training.
  - risk: The Hebrew and Greek warning clauses differ substantially.
    mitigation: The main text follows the validated Hebrew, while the footnote reports both forms accurately.
