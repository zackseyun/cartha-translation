translation:
  language: en
  text: It is better to die than to live an empty life,[a] and eternal rest is better than pain that never lets up.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel says “a bitter life,” while the Hebrew says “an empty life.”
    reason: alternative_reading
  - marker: b
    text: The Greek parallel speaks of a lasting sickness or affliction; the Hebrew speaks of enduring pain.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Death is better than a life of emptiness
  simplified_phrase: It is better to die than to live an empty life
  preserved_meaning: Death is preferable to continuing such a life.
  reasoning_layer_used: Lexical decisions for למות and מחיי שוא
  rationale: The verbal form makes the comparison easier to grasp while retaining the Hebrew image of emptiness.
- pob_phrase: unrelenting pain
  simplified_phrase: pain that never lets up
  preserved_meaning: The pain is persistent and ongoing.
  reasoning_layer_used: Lexical decision for מכאב נאמן
  rationale: The everyday phrase clearly conveys the documented durative force.
translation_notes:
  risk_flags:
  - risk: The proverb could be mistaken for a general endorsement of death.
    mitigation: The draft preserves the verse’s limited comparison without adding a broader claim.
  - risk: “Empty” may be understood in several ways.
    mitigation: The wording retains the Hebrew ambiguity, and the footnote records the Greek alternative.
