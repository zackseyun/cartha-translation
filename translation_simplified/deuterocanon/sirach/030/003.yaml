  simplified_phrase: A man who trains his son
  preserved_meaning: A father’s ongoing formation of his son is in view.
  reasoning_layer_used: POB lexical decisions for ὁ διδάσκων and τὸν υἱὸν αὐτοῦ
  rationale: “Trains” expresses sustained parental instruction in common English.
- pob_phrase: will provoke the enemy to jealousy
  simplified_phrase: will make the enemy jealous
  preserved_meaning: The son’s formation causes a representative opponent to feel jealousy or envy.
  reasoning_layer_used: POB lexical decisions for παραζηλώσει and τὸν ἐχθρόν
  rationale: The direct construction is clearer while “the enemy” retains the representative singular.
- pob_phrase: in the presence of friends he will rejoice over him
  simplified_phrase: he will rejoice because of his son in front of his friends
  preserved_meaning: The father openly celebrates because of his son while among friends.
  reasoning_layer_used: POB lexical decisions for ἔναντι φίλων, ἐπʼ αὐτῷ, and ἀγαλλιάσεται
  rationale: The wording clearly identifies the son as the cause of joy and preserves its celebratory force.
