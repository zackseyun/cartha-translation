translation:
  language: en
  text: A man who trains his son will make the enemy jealous, and he will rejoice because of his son in front of his friends.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “will make the enemy envious.” The Greek verb can refer to jealousy or envy.
    reason: lexical_alternative
