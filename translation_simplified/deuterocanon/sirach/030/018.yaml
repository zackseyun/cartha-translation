translation:
  language: en
  text: Fine food poured out before someone whose mouth is closed is like an offering placed before an idol.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses a contemptuous word for an idol, possibly meaning “filthy idol” or “dung-idol.”
    reason: lexical_alternative
  - marker: b
    text: The Greek reads “portions of food placed beside a tomb,” a different picture with the same point of futility.
    reason: textual_variant
