  reasoning_layer_used: POB lexical decision for טובה
  rationale: “Fine food” is more immediately understandable while preserving the concrete food sense.
- pob_phrase: before a shut mouth
  simplified_phrase: before someone whose mouth is closed
  preserved_meaning: The food is presented where it cannot be received or eaten.
  reasoning_layer_used: POB lexical rationale for על פה סתום
  rationale: Naming the person makes the image natural in English without deciding whether the person is unable or unwilling to eat.
- pob_phrase: an offering set before an idol
  simplified_phrase: an offering placed before an idol
  preserved_meaning: The cultic comparison portrays the futile presentation of something valuable to an unresponsive recipient.
  reasoning_layer_used: POB lexical and theological decisions for תנופה and גלול
  rationale: “Placed” is clearer than “set,” while “offering” and “idol” retain the audited choices.
