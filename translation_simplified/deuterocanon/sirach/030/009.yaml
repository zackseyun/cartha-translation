translation:
  language: en
  text: Discipline your son so that you are not put to shame. But if you play with him, he will humiliate you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek reads, “Coddle a child, and he will astonish you; play with him, and he will grieve you.” The Hebrew reads, “Discipline your son … he will humiliate you.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: lest you be put to shame
  simplified_phrase: so that you are not put to shame
  preserved_meaning: Discipline is urged to prevent the parent’s public shame.
  reasoning_layer_used: Hebrew lexical decision for לבל תבוש
  rationale: The purpose clause is recast in common English while retaining its social-shame force.
- pob_phrase: ; but if you play with him
  simplified_phrase: . But if you play with him
  preserved_meaning: The warning about playing with the son remains explicitly contrasted with the command to discipline him.
  reasoning_layer_used: Hebrew clause structure and lexical decision for תשחק עמו
  rationale: A new sentence eases reading, while “But” preserves the source-based contrast.
