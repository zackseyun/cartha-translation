translation:
  language: en
  text: Bend his neck while he is young, and break his hips while he is still a small child.[a] Otherwise, he may grow stubborn[b] and bring bitter anguish to your soul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “break his loins,” while the Greek parallel says “crush his sides or ribs.”
    reason: textual_variant
  - marker: b
    text: The Hebrew wording is difficult; the Greek parallel supports the sense “grow hardened.”
    reason: alternative_reading
