simplification_decisions:
- pob_phrase: An unbroken horse turns out stubborn
  simplified_phrase: An untrained horse becomes stubborn
  preserved_meaning: A horse not brought under training develops an obstinate character.
  reasoning_layer_used: POB lexical decisions for ἀδάμαστος, ἀποβαίνει, and σκληρός
  rationale: “Untrained” explains the horse-training image, while “becomes” clearly expresses the result.
- pob_phrase: a son left unchecked
  simplified_phrase: a son left without restraint
  preserved_meaning: A son who is not restrained or disciplined is allowed to develop without needed limits.
  reasoning_layer_used: POB lexical decision for ἀνειμένος and the immediate discipline context
  rationale: This wording clearly conveys absent restraint without claiming he may do absolutely anything.
- pob_phrase: turns out headstrong
  simplified_phrase: becomes headstrong
  preserved_meaning: Lack of restraint produces a forward, self-willed disposition.
  reasoning_layer_used: POB lexical decisions for ἐκβαίνει and προαλής
  rationale: “Becomes” preserves the result and the parallel with the first clause.
