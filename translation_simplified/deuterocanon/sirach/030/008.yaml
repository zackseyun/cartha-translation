translation:
  language: en
  text: An untrained horse becomes stubborn, and a son left without restraint becomes headstrong.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word translated “headstrong” is rare and may also mean “self-willed” or “presumptuous.”
