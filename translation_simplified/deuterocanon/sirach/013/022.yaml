translation:
  language: en
  text: A poor man stumbles. When he speaks, people shout, “Go away! Go away!”[a] But when a discerning man speaks, no one gives him a hearing.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The repeated Hebrew cry is terse and may express dismissal or rebuke.
    reason: lexical_alternative
  - marker: b
    text: Literally, “there is no place for him,” meaning that his words receive no room or acceptance.
    reason: simplification_note
simplification_decisions:
- pob_phrase: A poor man totters
  simplified_phrase: A poor man stumbles
  preserved_meaning: The poor man becomes unsteady or suffers a fall without specifying its kind.
  reasoning_layer_used: POB lexical decision for נָמוֹט
  rationale: “Stumbles” keeps the image of instability in more familiar English.
- pob_phrase: they cry, “Away, away!”
  simplified_phrase: people shout, “Go away! Go away!”
  preserved_meaning: Others respond to him with a repeated hostile dismissal.
  reasoning_layer_used: POB lexical decisions for גָּע גָּע and יִשֶּׂא
  rationale: The explicit subject and common command make the terse Hebrew reaction immediately clear.
- pob_phrase: there is no place for him
  simplified_phrase: no one gives him a hearing
  preserved_meaning: His insightful speech receives no social room or acceptance.
  reasoning_layer_used: POB footnote b and lexical decision for וְאֵין לוֹ מָקוֹם
  rationale: The idiomatic wording states the documented contextual sense while a note preserves the literal image.
interpretive_expansions:
- pob_phrase: there is no place for him
  rendering: no one gives him a hearing
  claim: The lack of a place refers to people refusing to hear or accept his words.
  evidence:
  - POB footnote b explicitly identifies this as the idiomatic meaning.
  - The Greek parallel says that no place was given to him.
  confidence: high
  alternatives_preserved:
  - there is no place for him
  - his words receive no acceptance
translation_notes:
  risk_flags:
  - risk: “Stumbles” could be read as a physical fall only.
    mitigation: The wording does not identify the cause or kind of failure.
  - risk: “Gives him a hearing” makes the social meaning more explicit than the Hebrew image.
    mitigation: Footnote b preserves the literal wording and its broader sense of acceptance.
