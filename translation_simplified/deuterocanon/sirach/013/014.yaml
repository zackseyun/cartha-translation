translation:
  language: en
  text: Every living creature[a] loves its own kind. Likewise, every person loves someone like themselves.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says “all flesh,” referring broadly to living creatures.
    reason: source_note
  - marker: b
    text: Greek reads “his neighbor,” while Hebrew says “someone like him.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: All flesh
  simplified_phrase: Every living creature
  preserved_meaning: The proverb speaks broadly about living beings while retaining the Hebrew image in a note.
  reasoning_layer_used: lexical decision for כָּל הַבָּשָׂר
  rationale: The clearer wording expresses the intended scope without leaving “flesh” unexplained.
- pob_phrase: and every person the one like himself
  simplified_phrase: Likewise, every person loves someone like themselves
  preserved_meaning: People feel affection for those who resemble them.
  reasoning_layer_used: Hebrew primary reading and gender-accurate revision
  rationale: The repeated verb and natural pronoun make the second statement complete in modern English.
interpretive_expansions:
- pob_phrase: and every person the one like himself
  rendering: Likewise, every person loves someone like themselves
  claim: The verb “loves” carries over from the first half of the proverb.
  evidence:
