translation:
  language: en
  text: Wild animals of the wilderness[b] are food for a lion. In the same way, the poor are a pasture for the rich to feed on.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek has a different proverb: “What peace has a hyena with a dog? And what peace has a rich man with a poor man?” Both forms portray hostility between rich and poor.'
    reason: alternative_reading
  - marker: b
    text: The Hebrew may refer more narrowly to “wild donkeys of the wilderness.”
    reason: lexical_alternative
