translation:
  language: en
  text: When a rich man stumbles, a friend helps him back up. But when a poor man stumbles, he is pushed away again and again, from one friend to another.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek version differs substantially: “Lowliness is detestable to the proud, and a poor person is detestable to a rich person.” The surviving Hebrew is followed here.'
    reason: textual_variant
