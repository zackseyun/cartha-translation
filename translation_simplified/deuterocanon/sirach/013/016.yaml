translation:
  language: en
  text: How can a wolf and a lamb be companions? In the same way, how can a wicked man and a righteous man be companions, or a rich man and a man brought low?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression translated “a man brought low” is uncertain and may refer to someone of low or reduced social standing.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek has a different form: “All flesh gathers with its own kind, and a man will cling to one like himself.”'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: What fellowship has a wolf with a lamb?
  simplified_phrase: How can a wolf and a lamb be companions?
  preserved_meaning: The rhetorical question still pictures the impossibility of association between predator and prey.
  reasoning_layer_used: POB lexical decision for מַה יְּחֻבַּר
  rationale: “Be companions” expresses relational association in more familiar English than “has fellowship.”
- pob_phrase: So a wicked man with a righteous man
  simplified_phrase: In the same way, how can a wicked man and a righteous man be companions
  preserved_meaning: The human contrast remains explicitly parallel to the wolf and lamb.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Repeating the question and verb makes the Hebrew proverb’s compressed comparison immediately clear.
- pob_phrase: and likewise a rich man with a man brought low
  simplified_phrase: or a rich man and a man brought low
  preserved_meaning: The contrast remains between a rich man and someone socially lowered without narrowing it to poverty alone.
  reasoning_layer_used: POB lexical decision for אִישׁ נֶאֱצָל
  rationale: The uncertain but broader phrase “brought low” is retained while the clause is fitted into natural English.
translation_notes:
  risk_flags:
  - risk: “Companions” may sound warmer than the broader source idea of association.
    mitigation: The repeated rhetorical question preserves the proverb’s rejection of fellowship between the contrasted figures.
  - risk: The final Hebrew expression is uncertain.
    mitigation: The main text keeps POB’s cautious wording, and footnote a states the uncertainty.
