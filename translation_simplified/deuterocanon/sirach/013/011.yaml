translation:
  language: en
  text: Do not let his easy familiarity make you trust him,[a] and do not believe his many words. With all that talk, he is testing you. Even while he laughs with you, he is probing you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Do not feel free to speak openly with him.”
    reason: lexical_alternative
