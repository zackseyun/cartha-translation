translation:
  language: en
  text: As long as you are useful to him, he will toy with you; two or three times he will flatter you. Then he will look at you as if he is going to pass you by.[a] He will shake his head at you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew here is difficult; the Greek parallel says that he will see you and then leave you.
    reason: textual_variant
simplification_decisions:
- pob_phrase: he will make sport of you
  simplified_phrase: he will toy with you
  preserved_meaning: He treats the person as a plaything with an exploitative and mocking attitude.
  reasoning_layer_used: POB lexical decision for יְהָתֵל בָּךְ
  rationale: “Toy with you” expresses the documented range in familiar modern English.
- pob_phrase: he will look at you as if to pass beyond you
  simplified_phrase: he will look at you as if he is going to pass you by
  preserved_meaning: He sees the person but moves on with dismissive disregard.
  reasoning_layer_used: POB lexical rationale and Greek consistency check
  rationale: The rewrite keeps the Hebrew image while making the difficult clause easier to follow.
- pob_phrase: two or three times he will flatter you
  simplified_phrase: two or three times he will flatter you
  preserved_meaning: The number specifically describes his repeated flattery, not his entire treatment of the person.
  reasoning_layer_used: POB clause structure and lexical decision for פַעֲמַיִם שָׁלֹשׁ
  rationale: The semicolon keeps the numerical phrase clearly attached only to the flattery.
