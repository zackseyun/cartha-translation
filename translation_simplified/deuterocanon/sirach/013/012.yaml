translation:
  language: en
  text: A cruel man will put something in people’s way that makes them stumble, and he will show no mercy.[a] He plots against the lives of many people.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek has substantially different wording but gives the same general picture of merciless harm; this translation follows the surviving Hebrew text.
    reason: textual_variant
simplification_decisions:
- pob_phrase: will give a stumbling block
  simplified_phrase: will put something in people’s way that makes them stumble
  preserved_meaning: The cruel person places a harmful obstacle that causes others to stumble or collapse.
  reasoning_layer_used: Hebrew lexical decision for יִתֵּן כֹּשֶׂל
  rationale: The wording explains the concrete stumbling image in ordinary English.
- pob_phrase: will not spare
  simplified_phrase: will show no mercy
  preserved_meaning: He acts without pity toward those he harms.
  reasoning_layer_used: Hebrew lexical decision for וְלֹא יַחְמוֹל
  rationale: This common expression clearly conveys the stated lack of compassion.
- pob_phrase: against the life of many he plots a plot
  simplified_phrase: He plots against the lives of many people
  preserved_meaning: He schemes to endanger or harm many persons.
  reasoning_layer_used: Hebrew lexical decisions for עַל נֶפֶשׁ רַבִּים and קוֹשֵׂר קָשֶר
  rationale: The natural plural avoids suggesting one shared life, while “plots” retains purposeful scheming.
interpretive_expansions:
- pob_phrase: will give a stumbling block
  rendering: will put something in people’s way that makes them stumble
  claim: The stumbling block is a harmful obstacle imposed on other people.
  evidence:
  - The lexical rationale identifies כֹּשֶׂל as something causing stumbling or collapse.
  - The surrounding clauses describe pitiless harm and hostile plotting.
  confidence: high
  alternatives_preserved:
  - will cause stumbling
  - will trip up
translation_notes:
  risk_flags:
  - risk: The Greek parallel differs substantially in the first half of the verse.
    mitigation: The footnote preserves this textual uncertainty while the main text follows the primary Hebrew witness.
  - risk: Natural English cannot reproduce the repeated Hebrew root in “plots a plot” without sounding wooden.
    mitigation: The strong verb “plots” preserves the force of intentional scheming without adding an unsupported adverb.
