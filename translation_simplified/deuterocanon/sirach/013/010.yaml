translation:
  language: en
  text: Do not come too close, or you may be pushed away.[a] But do not keep too far away, or you may be hated.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The first warning is difficult in the surviving Hebrew; the Greek also supports the sense that coming too close may cause someone to push you away.
    reason: textual_variant
  - marker: b
    text: The Greek says “forgotten” or “neglected” instead of the Hebrew “hated.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Do not draw near
  simplified_phrase: Do not come too close
  preserved_meaning: Do not press so near that the other person rejects you.
  reasoning_layer_used: Hebrew lexical decision and Greek consistency check
  rationale: Common wording makes the warning’s relational balance easier to grasp.
- pob_phrase: lest you be pushed away
  simplified_phrase: or you may be pushed away
  preserved_meaning: Coming too near may lead to rejection and enforced distance.
  reasoning_layer_used: POB lexical decision for תִּתְרַחֵק
  rationale: “Or you may” replaces archaic “lest” while keeping its warning force.
- pob_phrase: do not stay far off, lest you be hated
  simplified_phrase: do not keep too far away, or you may be hated
  preserved_meaning: Excessive distance may provoke hatred.
  reasoning_layer_used: Hebrew lexical decisions for וְאַל תִּתְרַחֵק and תִּשָּׂנֵא
  rationale: The rewrite keeps the strong Hebrew consequence while using natural English.
interpretive_expansions:
- pob_phrase: draw near … stay far off
  rendering: come too close … keep too far away
  claim: The warning concerns either extreme of social distance, not all closeness or distance.
  evidence:
  - The two clauses form a balanced contrast.
  - The POB rationale describes opposite sides of one admonition.
  confidence: high
  alternatives_preserved:
  - come close … stay far off
translation_notes:
  risk_flags:
  - risk: Adding “too” makes the implied balance explicit.
    mitigation: The antithetical clauses and POB rationale strongly support this bounded clarification.
  - risk: “Hated” is stronger than the Greek alternative.
    mitigation: The main text follows the primary surviving Hebrew, while the Greek reading remains in a footnote.
