translation:
  language: en
  text: Touch pitch, and it will stick to your hand.[a] Keep company with a scoffer, and you will learn to live as he does.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel says, “Whoever touches pitch will be defiled, and whoever has fellowship with a proud man will become like him.” The Hebrew reads “a scoffer” and “will learn his way.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Whoever touches pitch will have his hand stick to it
  simplified_phrase: Touch pitch, and it will stick to your hand
  preserved_meaning: Contact with sticky pitch leaves a person affected by it.
  reasoning_layer_used: Hebrew lexical decision for תִּדְבַּק יָדוֹ
  rationale: The direct proverb form is easier to read while preserving the concrete image of pitch sticking to a hand.
- pob_phrase: whoever associates with a scoffer
  simplified_phrase: Keep company with a scoffer
  preserved_meaning: The warning concerns choosing ongoing association with a person who mocks what is right.
  reasoning_layer_used: Hebrew lexical decisions for וְחוֹבֵר and לֵץ
  rationale: “Keep company with” expresses the relational sense in familiar English while retaining “scoffer.”
- pob_phrase: will learn his way
  simplified_phrase: you will learn to live as he does
  preserved_meaning: Association leads a person to imitate the scoffer’s conduct.
  reasoning_layer_used: Hebrew lexical decision for יִלְמַד דַּרְכּוֹ
  rationale: The wording makes the idiom “learn his way” immediately understandable without replacing it with the Greek reading.
interpretive_expansions:
- pob_phrase: will learn his way
  rendering: you will learn to live as he does
  claim: The learned “way” is the scoffer’s pattern of conduct.
  evidence:
  - The Hebrew wording joins “learn” with the scoffer’s “way.”
  - The POB rationale says the phrase conveys moral imitation.
  confidence: high
  alternatives_preserved:
  - will learn his way
  - will learn his ways
  external_witnesses:
  - The Greek parallel expresses the related outcome “will become like him.”
translation_notes:
  risk_flags:
  - risk: “Learn to live as he does” makes the moral-imitation sense more explicit than the Hebrew idiom.
    mitigation: The POB lexical rationale explicitly identifies moral imitation as the idiom’s force.
  - risk: The Hebrew and Greek differ in both the companion’s description and the stated result.
    mitigation: The main text follows the Hebrew, and footnote [a] preserves the Greek alternative.
