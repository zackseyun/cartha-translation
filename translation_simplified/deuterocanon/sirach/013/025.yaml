translation:
  language: en
  text: Wealth is good when no wrongdoing is involved, and arrogant people consider poverty bad.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “according to the mouth of arrogance”; it may refer to the judgment or speech of arrogant people.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek has a different saying: “A person’s heart changes the face, whether for good or for bad.”'
    reason: textual_variant
simplification_decisions:
- pob_phrase: if there is no iniquity
  simplified_phrase: when no wrongdoing is involved
  preserved_meaning: Wealth is called good only when it is not connected with moral wrong.
  reasoning_layer_used: POB lexical decision for עָוֹן
  rationale: “Wrongdoing” gives the moral force in familiar English without limiting it to how wealth was acquired.
- pob_phrase: poverty is bad according to the mouth of arrogance
  simplified_phrase: arrogant people consider poverty bad
  preserved_meaning: The negative judgment about poverty is attributed to the arrogant.
  reasoning_layer_used: POB lexical alternatives for עַל פִּי and זָדוֹן
  rationale: The clause becomes clear while the difficult mouth image and speech alternative remain in a footnote.
interpretive_expansions:
- pob_phrase: according to the mouth of arrogance
  rendering: arrogant people consider
  claim: The abstract “arrogance” refers to arrogant people who judge poverty negatively.
  evidence:
  - The POB footnote allows the sense “in the judgment/speech of the arrogant.”
  - The lexical rationale says arrogance fits the chapter’s social and moral context.
  confidence: moderate
  alternatives_preserved:
  - what arrogant people say
  - according to the mouth of arrogance
translation_notes:
  risk_flags:
  - risk: “Consider” favors judgment over speech in a difficult Hebrew phrase.
    mitigation: Footnote a preserves the literal image and the speech alternative.
  - risk: The Greek parallel contains a substantially different saying.
    mitigation: Footnote b records it while the surviving Hebrew remains primary.
