translation:
  language: en
  text: If you have something to offer,[a] he will speak pleasantly to you. He will strip you of everything, and it will not trouble him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek has a materially different form: “If you are useful, he will work with you; and if you are lacking, he will leave you.”'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: If you have something
  simplified_phrase: If you have something to offer
  preserved_meaning: The person has resources or usefulness that attract the exploiter.
  reasoning_layer_used: lexical decision and immediate context
  rationale: “To offer” makes the broad Hebrew-oriented sense understandable without limiting it to wealth.
- pob_phrase: he will speak kindly with you
  simplified_phrase: he will speak pleasantly to you
  preserved_meaning: He uses appealing words to gain the person’s favor.
  reasoning_layer_used: lexical decision
  rationale: This natural wording preserves the source’s focus on ingratiating speech.
- pob_phrase: he will strip you bare without feeling pain
  simplified_phrase: He will strip you of everything, and it will not trouble him
  preserved_meaning: He will completely exploit the person without distress or remorse.
  reasoning_layer_used: lexical decisions and contextual rationale
  rationale: The wording preserves the stripping image while clarifying the exploiter’s callousness.
interpretive_expansions:
- pob_phrase: If you have something
  rendering: If you have something to offer
  claim: What the person has makes that person useful to the exploiter.
  evidence:
  - The lexical rationale connects the phrase with resources or usefulness.
  - The immediate context concerns exploitation by the rich.
  - The Greek parallel explicitly speaks of being useful.
  confidence: moderate
  alternatives_preserved:
  - If you have means
  - If you are useful
