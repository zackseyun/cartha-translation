  reasoning_layer_used: POB lexical decisions for יְשַׁנֵּא and פָנָיו
  rationale: The wording clarifies that the face itself is not physically transformed.
- pob_phrase: whether for good or for bad
  simplified_phrase: for good or for bad
  preserved_meaning: The outward change may have either a positive or a negative result.
  reasoning_layer_used: POB lexical decision for אִם לְטוֹב וְאִם לְרָע
  rationale: Dropping “whether” makes the line more natural without weakening the contrast.
