translation:
  language: en
  text: If he finds you useful,[a] he will use you. But if you are brought low, he will show you no mercy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek tradition reads: “The rich man does wrong and even blusters; the poor man is wronged and must even beg.”'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: If you are useful to him
  simplified_phrase: If he finds you useful
  preserved_meaning: A powerful person values you for the practical advantage you provide.
  reasoning_layer_used: Hebrew lexical decision for אִם תִּכְשַׁר לוֹ
  rationale: The recast clause sounds natural while retaining the sense of usefulness rather than moral goodness.
- pob_phrase: he will make use of you
  simplified_phrase: he will use you
  preserved_meaning: He treats you as useful for his own purposes, with exploitation implied but not asserted outright.
  reasoning_layer_used: Hebrew lexical decision for יַעֲבֹד בָּךְ
  rationale: The shorter wording directly expresses the same guarded sense.
- pob_phrase: if you bow down, he will not spare you
  simplified_phrase: if you are brought low, he will show you no mercy
  preserved_meaning: When you become weak or reduced in status, he responds without pity or restraint.
  reasoning_layer_used: Hebrew lexical decisions for וְאִם תִּכְרַע and לֹא יַחְמֹל עָלֶיךָ
  rationale: This makes the social warning clear while preserving the downward image and ruthless response.
interpretive_expansions:
- pob_phrase: if you bow down
  rendering: if you are brought low
  claim: The downward movement refers to being weakened or reduced, not merely making a respectful gesture.
  evidence:
  - The lexical rationale identifies reduction, weakness, or humbled status as the likely contextual sense.
  - The surrounding warning concerns a powerful person’s exploitative treatment.
  confidence: moderate
  alternatives_preserved:
  - if you bow down
  - if you fall low
  - if you collapse
translation_notes:
  risk_flags:
