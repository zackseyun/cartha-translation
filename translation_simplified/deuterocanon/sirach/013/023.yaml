translation:
  language: en
  text: When a rich man speaks, everyone goes quiet. They praise his judgment to the clouds.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek has “his word” rather than the Hebrew “his sense” or “his understanding.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: everyone falls silent
  simplified_phrase: everyone goes quiet
  preserved_meaning: Everyone stops speaking when the rich man speaks.
  reasoning_layer_used: The lexical decision and Greek parallel support a reaction of silence.
  rationale: “Goes quiet” is natural common English for becoming silent.
- pob_phrase: they lift up his sense to the clouds
  simplified_phrase: They praise his judgment to the clouds
  preserved_meaning: People extravagantly praise the rich man’s thinking while the cloud image preserves the exaggeration.
  reasoning_layer_used: The lexical rationale identifies figurative praise and retains the Hebrew reading and cloud image.
  rationale: “Praise his judgment” makes the action clear without calling his judgment good.
interpretive_expansions:
- pob_phrase: lift up his sense
  rendering: praise his judgment
  claim: Lifting up refers to praising or extolling the rich man’s judgment.
  evidence:
  - The lexical decision says the verb expresses elevating or extolling in this context.
  - The phrase “to the clouds” depicts extravagant elevation.
  confidence: high
  alternatives_preserved:
  - The wording does not say whether his judgment deserves such praise.
  - The footnote preserves the Greek reading “his word.”
translation_notes:
  risk_flags:
  - risk: “Judgment” is broader than the Hebrew’s “sense” or “understanding.”
    mitigation: The footnote names the Hebrew alternatives, and the main text avoids adding the approving word “good.”
