  preserved_meaning: The warning concerns adopting the manner of people who lack wisdom.
  reasoning_layer_used: Hebrew lexical decisions for וְאַל תִּדְמֶה and בַּחֲסֵירֵי מַדָּע
  rationale: “Behave like” clearly expresses the volitional sense of resembling this group.
