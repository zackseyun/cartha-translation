  simplified_phrase: Be careful. Do not act too boldly
  preserved_meaning: The verse warns against excessive self-assertion without defining it specifically as pride.
  reasoning_layer_used: Hebrew lexical decision for הִשָּׁמֵר and אַל תִּרְהַב מְאֹד
  rationale: Two direct sentences make the warning easier to follow while retaining its force.
- pob_phrase: do not make yourself like those who lack understanding
