translation:
  language: en
  text: Pride detests humility, and the rich detest the poor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek reads, “Wild donkeys are prey for lions in the wilderness; in the same way, the poor are pasture for the rich.” The surviving Hebrew has the wording used in the main text.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Humility is abhorrent to pride
  simplified_phrase: Pride detests humility
  preserved_meaning: Pride strongly rejects humility.
  reasoning_layer_used: Hebrew lexical decision for תּוֹעֲבַת and the POB relational reading
  rationale: The active wording is easier to grasp while preserving the Hebrew’s strong revulsion.
- pob_phrase: the poor are abhorrent to the rich
  simplified_phrase: the rich detest the poor
  preserved_meaning: The rich strongly reject the poor as a social class.
  reasoning_layer_used: POB lexical decisions for עָשִׁיר and אֶבְיוֹן
  rationale: Reversing the clause into active English clarifies who feels contempt without changing its direction.
