translation:
  language: en
  text: What can a clay pot share with a heavy metal cooking pot? When they collide, the clay pot will shatter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The surviving Hebrew has a different saying: “If a rich man does wrong, he acts arrogantly; but if a poor man does wrong, he must plead for mercy.”'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: earthen pot
  simplified_phrase: clay pot
  preserved_meaning: The vessel is made of fragile fired earth.
  reasoning_layer_used: POB lexical decision for the Greek vessel image
  rationale: “Clay pot” is the familiar modern term for an earthen pot.
- pob_phrase: cauldron
  simplified_phrase: heavy metal cooking pot
  preserved_meaning: The other vessel is a strong metal pot used for cooking.
  reasoning_layer_used: POB lexical decision contrasting the cauldron with fragile clay
  rationale: The description explains the unfamiliar vessel and makes the contrast clear.
- pob_phrase: This one strikes, and this one is shattered.
  simplified_phrase: When they collide, the clay pot will shatter.
  preserved_meaning: Impact between the unequal vessels destroys the fragile clay pot.
  reasoning_layer_used: Greek parallel and POB lexical decisions for impact and shattering
  rationale: “Collide” avoids assigning either vessel as the aggressor while keeping the forceful impact.
interpretive_expansions:
- pob_phrase: This one strikes, and this one is shattered.
  rendering: When they collide, the clay pot will shatter.
  claim: The fragile clay vessel is the one destroyed when the vessels collide.
  evidence:
  - The POB reasoning contrasts a fragile earthen vessel with a heavy metal cauldron.
  - The chosen verb “shattered” naturally fits the clay vessel.
  confidence: high
  alternatives_preserved:
  - The Greek does not explicitly identify either vessel as the aggressor.
