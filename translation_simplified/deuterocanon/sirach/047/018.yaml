translation:
  language: en
  text: You were called by the honored name,[a] the name invoked over Israel. You amassed gold as if it were ordinary iron, and made silver as plentiful as lead.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “the name called over Israel,” expressing that the name belongs to, rests over, or lays claim to Israel.
    reason: lexical_alternative
