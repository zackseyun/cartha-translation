  simplified_phrase: the name invoked over Israel
  preserved_meaning: The honored name is the revered name associated with Israel.
  reasoning_layer_used: Lexical and theological decisions
  rationale: Repeating “the name” makes the referent clear without resolving the Hebrew idiom.
- pob_phrase: gold like iron
  simplified_phrase: gold as if it were ordinary iron
  preserved_meaning: Solomon accumulated gold in such abundance that it was treated like a common metal.
  reasoning_layer_used: Lexical decision and source image
  rationale: The wording explains the comparison while retaining iron as the image.
- pob_phrase: multiplied silver like lead
  simplified_phrase: made silver as plentiful as lead
  preserved_meaning: Solomon greatly increased his stores of silver.
  reasoning_layer_used: Lexical decision and Greek parallel
  rationale: The natural English comparison preserves both abundance and the image of lead.
