translation:
  language: en
  text: But God will not abandon mercy,[a] nor let any of his words fall to the ground and fail. He will not cut off the descendants of his chosen one[b] in generations to come, and he will not destroy the family line of the one who loved him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek reads, “The Lord will certainly not abandon his mercy or destroy any of his works,” instead of the Hebrew wording about his words not falling to the ground.
    reason: textual_variant
  - marker: b
    text: The Hebrew form could also mean “his chosen ones,” but the Greek and the context of David’s royal line support the singular.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: nor let any of his words fall to the ground
  simplified_phrase: nor let any of his words fall to the ground and fail
  preserved_meaning: The concrete image remains while its meaning—that God’s word does not fail—is made clear.
  reasoning_layer_used: POB lexical decision for ולא יפיל מדבריו ארצה
  rationale: Adding “and fail” explains the unfamiliar Hebrew image without replacing it.
- pob_phrase: offspring and posterity from his chosen one
  simplified_phrase: the descendants of his chosen one in generations to come
  preserved_meaning: God preserves the chosen one’s continuing line across generations.
  reasoning_layer_used: POB lexical and theological decisions for נין ונכד and לבחיריו
  rationale: The new wording expresses an ongoing lineage in ordinary English while retaining the singular chosen figure.
- pob_phrase: the seed of the one who loved him
  simplified_phrase: the family line of the one who loved him
  preserved_meaning: God will not wipe out the dynasty of the person who loved him.
  reasoning_layer_used: POB lexical decisions for זרע, אובהו, and ישמיד
  rationale: “Family line” communicates the dynastic sense of “seed” more directly to modern readers.
interpretive_expansions:
- pob_phrase: let any of his words fall to the ground
  rendering: let any of his words fall to the ground and fail
  claim: Words falling to the ground means that what God has spoken fails to take effect.
  evidence:
  - The POB lexical rationale explicitly says the idiom conveys that God’s spoken word does not fail.
  confidence: high
  alternatives_preserved:
  - let any of his words fall to the ground
- pob_phrase: offspring and posterity
  rendering: descendants ... in generations to come
  claim: The paired terms describe a lineage continuing through later generations.
  evidence:
  - The POB lexical rationale says the pair denotes continuing lineage across generations.
  - The verse’s immediate context concerns preservation of the Davidic line.
  confidence: high
  alternatives_preserved:
  - offspring and posterity
  - offspring and descendant
translation_notes:
  risk_flags:
  - risk: Explaining the falling-word image could weaken its poetic force.
    mitigation: The image is retained before the explanatory words “and fail.”
  - risk: “Family line” does not preserve the literal agricultural image of “seed.”
    mitigation: It preserves the POB’s identified dynastic meaning and avoids a likely modern misunderstanding.
