simplification_decisions:
- pob_phrase: Nathan arose
  simplified_phrase: Nathan came forward
  preserved_meaning: Nathan emerged onto the scene after the previous figure.
  reasoning_layer_used: The lexical rationale identifies “arose” as an idiom for appearing in succession.
  rationale: “Came forward” makes the contextual sense of the idiom immediately clear.
- pob_phrase: to stand before David
  simplified_phrase: to stand before David
  preserved_meaning: Nathan presented himself in David’s presence.
  reasoning_layer_used: The Hebrew lexical and theological decisions require the main text to retain “before David.”
  rationale: The concrete Hebrew wording is already clear and preserves the posture before David.
translation_notes:
  risk_flags:
  - risk: “Came forward” is less literal than the Hebrew verb “stood.”
    mitigation: It follows the POB rationale that the verb describes Nathan’s emergence onto the scene.
  - risk: The Greek parallel describes prophesying during David’s lifetime rather than standing before him.
    mitigation: The main text follows the extant Hebrew, while the Greek reading remains in a footnote.
