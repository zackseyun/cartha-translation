translation:
  language: en
  text: He gave Jacob a surviving remnant. He gave David’s family a root from David—that is, a family line that continued through Solomon.[a] Then Solomon died and joined his ancestors,[b] leaving behind one of his own descendants.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew uses the image of a “root,” meaning that David’s family line continued through Solomon.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew wording is uncertain here; the Greek parallel supports “with his ancestors.”
    reason: textual_variant
  - marker: c
    text: The rare Hebrew term may also mean “an heir” or “one of his offspring.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: gave a remnant to Jacob
  simplified_phrase: gave Jacob a surviving remnant
  preserved_meaning: God gave Jacob a portion that remained alive or preserved.
  reasoning_layer_used: lexical decision
  rationale: This keeps the stated act of giving while making the sense of “remnant” clearer.
- pob_phrase: to the house of David a root from him
  simplified_phrase: gave David’s family a root from David—that is, a family line that continued through Solomon
  preserved_meaning: The root image represents the continuation of David’s dynasty through Solomon.
  reasoning_layer_used: lexical and theological decisions
  rationale: This preserves the root image and explains it without adding an explicit messianic claim.
- pob_phrase: Solomon lay down with his fathers, and left behind him one of his offspring
  simplified_phrase: Solomon died and joined his ancestors, leaving behind one of his own descendants
  preserved_meaning: Solomon died and left a successor from his family line.
  reasoning_layer_used: lexical decisions and Greek parallel
  rationale: Natural English clarifies the death idiom while keeping the successor broad because the Hebrew term is uncertain.
interpretive_expansions:
- pob_phrase: a root from him
  rendering: a root from David—that is, a family line that continued through Solomon
  claim: The root represents the continuation of David’s dynasty through Solomon.
  evidence:
  - The POB lexical rationale identifies the root as dynastic continuation.
  - The POB theological decision supports this meaning without requiring a messianic claim.
  confidence: high
  alternatives_preserved:
  - a descendant from him
  - a continuing Davidic line
