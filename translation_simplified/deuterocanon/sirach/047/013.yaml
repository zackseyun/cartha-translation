translation:
  language: en
  text: Solomon ruled during peaceful times.[a] God gave him rest from conflict on every side, so that he might build a temple for God's name and prepare a sanctuary forever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Hebrew has only the first sentence, ending with God giving Solomon rest on every side. The Greek also includes the words about building the temple and preparing the sanctuary.
    reason: textual_variant
simplification_decisions:
- pob_phrase: reigned in days of peace
  simplified_phrase: ruled during peaceful times
  preserved_meaning: Solomon's reign took place in a period of peace.
  reasoning_layer_used: Hebrew lexical decisions for מלך and בימי שלוה
  rationale: Common wording replaces the older temporal idiom without changing its sense.
- pob_phrase: God gave him rest on every side
  simplified_phrase: God gave him rest from conflict on every side
  preserved_meaning: God granted Solomon security from surrounding conflict.
  reasoning_layer_used: Hebrew-Greek lexical alignment for מסביב and κατέπαυσεν κυκλόθεν
  rationale: The context of peaceful rule clarifies that this rest is freedom from conflict.
- pob_phrase: build a house for his name
  simplified_phrase: build a temple for God's name
  preserved_meaning: Solomon was to build the sacred house associated with God's name.
  reasoning_layer_used: Greek lexical decision and temple-purpose context
  rationale: Temple identifies the house clearly while retaining the biblical phrase about God's name.
interpretive_expansions:
- pob_phrase: rest on every side
  rendering: rest from conflict on every side
  claim: The rest was security from surrounding conflict, not physical relaxation.
  evidence:
  - The preceding phrase places Solomon's reign in peaceful times.
  - The Hebrew-Greek wording describes rest granted all around him.
  confidence: high
  alternatives_preserved:
  - rest on every side
  - peace on every side
- pob_phrase: a house for his name
  rendering: a temple for God's name
  claim: The house is God's temple.
  evidence:
  - The following Greek phrase calls it a sanctuary.
  - The POB rationale identifies the wording as temple-building language.
  confidence: high
  alternatives_preserved:
  - a house for God's name
  - a temple dedicated to God's name
translation_notes:
  risk_flags:
  - risk: The temple-purpose clause is absent from the surviving Hebrew line.
    mitigation: The text follows the POB decision to include the Greek continuation, and the footnote identifies the shorter Hebrew reading.
  - risk: “Forever” may sound like a claim that the physical building could never be destroyed.
    mitigation: The wording preserves the Greek and POB language without adding a doctrinal explanation.
