translation:
  language: en
  text: You stained your honor and defiled your bed.[a] This brought wrath on your descendants and left you groaning on your own couch.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek reads, “and you profaned your seed,” instead of “and defiled your bed.”
    reason: textual_variant
  - marker: b
    text: Greek ends, “and anguish over your folly,” rather than “and left you groaning on your own couch.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: put a blemish on your honor
  simplified_phrase: stained your honor
  preserved_meaning: Solomon damaged his royal and personal honor through disgraceful conduct.
  reasoning_layer_used: Hebrew lexical decision supported by the Greek parallel
  rationale: “Stained” keeps the concrete image of a blemish in more natural English.
- pob_phrase: profaned your bed
  simplified_phrase: defiled your bed
  preserved_meaning: Solomon morally violated what should have remained holy in his sexual and marital life.
  reasoning_layer_used: Hebrew lexical and theological decisions
  rationale: “Defiled” is clearer than “profaned” while retaining the strong moral-religious force.
- pob_phrase: bringing wrath on your offspring and groaning on your couch
  simplified_phrase: This brought wrath on your descendants and left you groaning on your own couch
  preserved_meaning: His wrongdoing harmed his dynasty and brought him personal anguish.
  reasoning_layer_used: Hebrew syntax and theological decision
  rationale: A new sentence makes the two consequences and their causal link immediately clear.
interpretive_expansions:
- pob_phrase: bringing wrath on your offspring and groaning on your couch
  rendering: This brought wrath on your descendants and left you groaning on your own couch
  claim: The wrath and personal groaning are consequences of Solomon’s misconduct.
  evidence:
  - The Hebrew infinitive marks result or consequence.
  - The repeated bed-and-couch image links the misconduct with Solomon’s anguish.
  confidence: high
  alternatives_preserved:
  - The Greek instead describes anguish over Solomon’s folly.
translation_notes:
  risk_flags:
  - risk: The Greek preserves different wording in both disputed clauses.
    mitigation: Both Greek variants are retained in footnotes while the main text follows the primary Hebrew witness.
  - risk: “Defiled” may sound less explicitly sacred than “profaned.”
    mitigation: It retains the Hebrew’s strong sense of moral pollution without using an opaque term.
