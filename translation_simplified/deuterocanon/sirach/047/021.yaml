translation:
  language: en
  text: The people were divided into two tribes, and a lawless kingdom came from Ephraim.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says that the rule was divided and that a disobedient kingdom began from Ephraim.
    reason: alternative_reading
  - marker: b
    text: “Lawless” may also mean “violent” or “rebellious.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: to divide the people into two tribes
  simplified_phrase: The people were divided into two tribes
  preserved_meaning: The covenant people underwent a political division described as two tribes.
  reasoning_layer_used: Hebrew lexical decisions and Greek consistency check
  rationale: A complete passive sentence makes the result clear without changing who was divided.
- pob_phrase: and from Ephraim a lawless kingdom
  simplified_phrase: and a lawless kingdom came from Ephraim
  preserved_meaning: The condemned kingdom had its origin in Ephraim.
  reasoning_layer_used: Hebrew lexical decisions and Greek parallel
  rationale: Adding “came” supplies the verb English requires while keeping “from” broad.
interpretive_expansions:
- pob_phrase: and from Ephraim a lawless kingdom
  rendering: and a lawless kingdom came from Ephraim
  claim: The phrase describes the kingdom as emerging from Ephraim.
  evidence:
  - Hebrew מן marks origin or source here.
  - The Greek describes the kingdom as beginning from Ephraim.
  confidence: high
  alternatives_preserved:
  - The phrase may also point to Ephraim as the kingdom’s location.
translation_notes:
  risk_flags:
  - risk: “Lawless” may understate the Hebrew word’s possible emphasis on violence.
    mitigation: Footnote b preserves the violent and rebellious alternatives.
  - risk: Supplying “came” makes the verbless Hebrew clause more explicit.
    mitigation: The Greek parallel supports the idea of the kingdom beginning from Ephraim.
