simplification_decisions:
- pob_phrase: He gave Ephraim a stumbling block, to drive them from their land
  simplified_phrase: He gave Ephraim a stumbling block to drive them out of their land
  preserved_meaning: He gave Ephraim a cause of downfall for the purpose of removing them from their land.
  reasoning_layer_used: Hebrew lexical decisions for מכשול, להדיחם, and מאדמתם
  rationale: This keeps the stumbling image and purpose construction while using the clearer phrase “out of their land.”
- pob_phrase: his sin grew very great
  simplified_phrase: His sin became very great
  preserved_meaning: The ruler’s sin increased to a very great degree.
  reasoning_layer_used: Hebrew singular reading and theological decision
  rationale: “Became” is more natural English while retaining the Hebrew singular subject.
- pob_phrase: he sold himself to every evil
  simplified_phrase: he sold himself to every kind of evil
  preserved_meaning: He willingly bound himself to all forms of evil.
  reasoning_layer_used: Lexical and theological decisions for התמכר
  rationale: “Every kind of evil” is idiomatic while preserving the forceful self-sale metaphor.
