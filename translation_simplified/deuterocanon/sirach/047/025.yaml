translation:
  language: en
  text: He gave Ephraim a stumbling block to drive them out of their land. His sin became very great, and he sold himself to every kind of evil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek reads, “Their sins multiplied greatly, and they sought every kind of wickedness until vengeance came upon them.” The Hebrew is shorter and uses a singular subject.
