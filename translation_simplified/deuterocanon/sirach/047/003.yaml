translation:
  language: en
  text: He played with young lions as if they were young goats, and with bears as if they were young livestock from Bashan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bashan was famous for strong, well-fed livestock; the Hebrew refers generally to its young animals.
    reason: cultural_note
  - marker: b
    text: The Greek reads “lambs” instead of the Hebrew expression “young animals from Bashan.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: as with a kid
  simplified_phrase: as if they were young goats
  preserved_meaning: David treated dangerous young lions like small domestic goats.
  reasoning_layer_used: Hebrew lexical decision for גדי and the poetic comparison
  rationale: “Young goats” avoids the easily misunderstood animal term “kid.”
- pob_phrase: as with calves of Bashan
  simplified_phrase: as if they were young livestock from Bashan
  preserved_meaning: The bears are compared to harmless domesticated young animals associated with Bashan.
  reasoning_layer_used: Primary Hebrew reading כבני בשן, its lexical rationale, and the decision favoring Hebrew over Greek
  rationale: “Young livestock” makes the pastoral contrast clear without specifying calves or adopting the Greek’s lambs.
interpretive_expansions:
- pob_phrase: calves of Bashan
  rendering: young livestock from Bashan
  claim: The animals in the comparison are domesticated livestock rather than unspecified young animals.
  evidence:
  - The POB audit explains the Hebrew image as tame young animals from a region known for livestock.
  - The Greek parallel’s “lambs” supports the harmless pastoral sense.
  confidence: high
  alternatives_preserved:
  - calves of Bashan
  - lambs
translation_notes:
  risk_flags:
  - risk: “Young livestock” is broader than the POB wording “calves.”
    mitigation: It follows the audited Hebrew rationale without forcing one species, while the Greek alternative remains footnoted.
