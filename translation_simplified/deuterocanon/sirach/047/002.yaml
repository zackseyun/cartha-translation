translation:
  language: en
  text: Just as the fat portion is set apart from a sacred offering, so David was set apart from the people of Israel.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: As the fat
  simplified_phrase: Just as the fat portion
  preserved_meaning: The concrete image of sacrificial fat remains intact.
  reasoning_layer_used: lexical decision for כחלב
  rationale: “Portion” helps readers understand that the verse refers to part of an offering.
- pob_phrase: so was David from Israel
  simplified_phrase: so David was set apart from the people of Israel
  preserved_meaning: David is distinguished from among Israel without explicitly saying God chose him.
  reasoning_layer_used: lexical and theological decisions for כן דוד מישראל
  rationale: Repeating “set apart” completes the comparison in clear English.
interpretive_expansions:
- pob_phrase: so was David from Israel
  rendering: so David was set apart from the people of Israel
  claim: The comparison presents David as distinguished from among Israel.
  evidence:
  - The Hebrew comparison carries forward the idea expressed by “set apart.”
  - The Greek parallel explicitly uses separative wording for the sons of Israel.
  confidence: high
  alternatives_preserved:
  - David was distinguished from Israel
  - David was set apart from among the sons of Israel
  external_witnesses:
  - The Greek parallel reads “from the sons of Israel.”
translation_notes:
  risk_flags:
  - risk: “Set apart” may be read as explicitly stating divine election.
    mitigation: The wording does not add “chosen by God,” which the verse itself does not state.
