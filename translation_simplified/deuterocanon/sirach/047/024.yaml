translation:
  language: en
  text: Rehoboam was foolish in a way that harmed the people, and he lacked understanding. His policy led the people into revolt.[b] Then Jeroboam son of Nebat arose—may no one remember him! He sinned and caused Israel to sin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Hebrew is compressed and its verse division is uncertain. The Greek includes the fuller clause “and gave Ephraim a way of sin,” but it is not included here because it is not explicit in the surviving Hebrew line.
    reason: textual_variant
  - marker: b
    text: The difficult Hebrew may also mean that Rehoboam “divided the people by his policy.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: A broad folly and lacking understanding was Rehoboam
  simplified_phrase: Rehoboam was foolish in a way that harmed the people, and he lacked understanding
  preserved_meaning: Rehoboam lacked discernment, and his folly had a corporate effect on the people.
  reasoning_layer_used: POB lexical decisions for רחב אולת and חסר בינה
  rationale: This states the supported corporate effect without making Rehoboam the source of folly.
- pob_phrase: caused the people to revolt by his counsel
  simplified_phrase: His policy led the people into revolt
  preserved_meaning: Rehoboam’s governing decision brought about the people’s political defection.
  reasoning_layer_used: POB lexical rationale supported by the Greek parallel
  rationale: “Policy” makes the political sense of “counsel” clear while preserving causation.
- pob_phrase: until one arose—may there be no remembrance of him—Jeroboam son of Nebat
  simplified_phrase: Then Jeroboam son of Nebat arose—may no one remember him!
  preserved_meaning: Jeroboam arose, followed by a forceful wish that his memory perish.
  reasoning_layer_used: Applied revision preserving עד אשר קם and אל יהי לו זכר
  rationale: A new sentence clarifies the transition while retaining the condemning wish.
interpretive_expansions:
- pob_phrase: A broad folly
  rendering: foolish in a way that harmed the people
  claim: Rehoboam’s folly affected the people rather than only describing his private character.
  evidence:
  - The POB lexical decision chooses the corporate sense “a people’s folly.”
  - The Greek parallel connects the folly with the people.
  confidence: moderate
  alternatives_preserved:
  - great folly
  - folly in abundance
translation_notes:
  risk_flags:
  - risk: The compressed Hebrew leaves the exact syntax and the transition between Rehoboam and Jeroboam uncertain.
    mitigation: The text follows the shared Hebrew-Greek core, and footnote a preserves the textual uncertainty.
  - risk: The phrase about revolt may instead mean that Rehoboam divided the people.
    mitigation: Footnote b retains this lexical alternative at the relevant clause.
