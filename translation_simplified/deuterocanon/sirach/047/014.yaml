  - marker: b
    text: The “house” is the temple, dedicated to God's name.
    reason: simplification_note
simplification_decisions:
- pob_phrase: who prepared
  simplified_phrase: He prepared
  preserved_meaning: Solomon is the one who prepared the house.
  reasoning_layer_used: POB lexical rationale and preceding context
  rationale: An independent clause is easier to read than a relative-clause fragment.
- pob_phrase: a house for his name
  simplified_phrase: a house for God's name
  preserved_meaning: The temple is dedicated to God's name without implying that it contains God.
  reasoning_layer_used: POB theological decision on the divine-name idiom
  rationale: Naming God clarifies the pronoun while preserving the important biblical image.
