translation:
  language: en
  text: He prepared a house for God's name[b] and established the sanctuary forever.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek version has a different line here: “How wise you became in your youth, and you were filled like a river with understanding.” The main text follows the surviving Hebrew.'
