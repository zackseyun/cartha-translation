translation:
  language: en
  text: For arrogance trusts in sin, and its source pours out wickedness.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Greek: “For the beginning of pride is sin, and the one who holds fast to it will pour out abomination.”'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the hope of arrogance is sin
  simplified_phrase: arrogance trusts in sin
  preserved_meaning: Sin is what arrogance relies on or looks to for hope.
  reasoning_layer_used: Hebrew lexical decision for מִקְוֵה and theological priority of the Hebrew witness
  rationale: The active wording makes the Hebrew sense of trust clear without adopting the Greek reading “beginning.”
- pob_phrase: its source pours out wickedness
  simplified_phrase: its source pours out wickedness
  preserved_meaning: Arrogance is pictured as having a spring from which wickedness flows.
  reasoning_layer_used: Hebrew lexical decisions for מְקוֹרָהּ, יַבִּיעַ, and זִמָּה
  rationale: The concrete water image remains understandable and preserves the verse’s moral force.
interpretive_expansions:
- pob_phrase: the hope of arrogance is sin
  rendering: arrogance trusts in sin
  claim: The phrase identifies sin as what arrogance trusts in.
  evidence:
  - The lexical rationale allows “that in which one trusts” for מִקְוֵה.
  - The POB gives priority to the surviving Hebrew rather than Greek ἀρχή.
  confidence: high
  alternatives_preserved:
  - The Greek reading “the beginning of pride is sin” remains in the footnote.
translation_notes:
  risk_flags:
  - risk: Turning the noun “hope” into “trusts” makes the relationship more explicit.
    mitigation: The rendering follows the documented lexical sense “that in which one trusts.”
  - risk: The Hebrew and Greek differ materially in both clauses.
    mitigation: The main text follows the Hebrew, while the Greek form is preserved in a footnote.
