translation:
  language: en
  text: A poor man is honored for his insight, while another man is honored for his wealth.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek reads: “But if someone is honored while poor, how much more will he be honored when rich? And if someone has no honor while rich, how much less will he have when poor?” The Hebrew and Greek differ greatly here.'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: There is a poor man who is honored because of his insight
  simplified_phrase: A poor man is honored for his insight
  preserved_meaning: A man who is poor receives social honor because of his discernment.
  reasoning_layer_used: Hebrew lexical decisions for דַּל, נִכְבָּד, בִּגְלַל, and שִׂכְלוֹ
  rationale: The recast removes the stiff existential clause without weakening its definite assertion.
- pob_phrase: and there is one who is honored because of his wealth
  simplified_phrase: while another man is honored for his wealth
  preserved_meaning: A second man receives honor because of his material wealth.
  reasoning_layer_used: Hebrew parallelism and the decision to follow the extant Hebrew
  rationale: “While another man” clearly contrasts the two different bases for honor.
translation_notes:
  risk_flags:
  - risk: Removing “There is” slightly reshapes the Hebrew existential parallelism.
    mitigation: Both cases remain definite statements, and the balanced contrast is preserved with “while another man.”
  - risk: The Greek parallel gives a substantially different saying.
    mitigation: The main text follows the primary Hebrew witness, while the Greek alternative remains in the footnote.
