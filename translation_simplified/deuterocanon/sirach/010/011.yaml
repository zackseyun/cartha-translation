  preserved_meaning: The phrase marks what happens at the time of a man's death.
  reasoning_layer_used: The lexical decision for בְּמוֹת favors a natural temporal clause.
  rationale: A direct clause is easier to understand than the abstract phrase “at a man's death.”
- pob_phrase: his inheritance is
  simplified_phrase: 'this is what he inherits:'
  preserved_meaning: The creatures are portrayed as the dead man's inheritance.
  reasoning_layer_used: The lexical decision for יִנְחַל preserves the inheritance image while allowing natural English syntax.
  rationale: The colon introduces the creature list clearly without weakening the source image.
- pob_phrase: creeping things
  simplified_phrase: crawling creatures
  preserved_meaning: The broad category of small creatures that move along the ground remains intact.
  reasoning_layer_used: The lexical rationale for רֶמֶשׂ permits “creeping creatures” as an equivalent.
