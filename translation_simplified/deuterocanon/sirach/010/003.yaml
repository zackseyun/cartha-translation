translation:
  language: en
  text: A people’s officials are like their judge, and a city’s residents are like the leader at its head.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek parallel has a substantially different form: “An undisciplined king will destroy his people, and a city will be inhabited through the understanding of rulers.” The main text follows the surviving Hebrew.'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: As the judge of a people, so are his officials
  simplified_phrase: A people’s officials are like their judge
  preserved_meaning: The officials resemble the judge who governs the people.
  reasoning_layer_used: Hebrew comparative structure and lexical decisions
  rationale: The direct comparison replaces the proverb’s inverted clause order without changing its point.
- pob_phrase: as the head of a city, so are its inhabitants
  simplified_phrase: a city’s residents are like the leader at its head
  preserved_meaning: The city’s residents resemble the person who leads it.
  reasoning_layer_used: Lexical decision for רֹאשׁ and Hebrew parallelism
  rationale: “Leader at its head” explains the metaphor while retaining the Hebrew image.
- pob_phrase: inhabitants
  simplified_phrase: residents
  preserved_meaning: The people who live in the city are in view.
  reasoning_layer_used: Lexical decision for יוֹשְׁבָיו
  rationale: “Residents” is more common modern English than “inhabitants.”
interpretive_expansions:
- pob_phrase: head of a city
  rendering: leader at its head
  claim: The city’s “head” is its leader, while the wording still preserves the bodily image.
  evidence:
  - The lexical rationale states that רֹאשׁ literally means “head” and metaphorically means “chief.”
  - The governance context pairs the city’s head with the people’s judge.
  confidence: high
  alternatives_preserved:
  - head of a city
  - chief of a city
  - ruler of a city
