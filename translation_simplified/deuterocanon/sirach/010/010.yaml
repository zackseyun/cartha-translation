translation:
  language: en
  text: Even a minor illness makes a physician turn pale.[a] Today someone is king; tomorrow that king falls.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “look yellow,” picturing illness visibly changing the physician’s color.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew “falls” may include downfall or death; the Greek parallel says that he will come to his end.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: A slight illness makes a physician turn pale
  simplified_phrase: Even a minor illness makes a physician turn pale
  preserved_meaning: A small sickness can visibly affect even a medical expert.
  reasoning_layer_used: POB lexical decisions for שֶׁמֶץ, מַחֲלָה, יַצְהִיב, and רוֹפֵא
  rationale: “Minor” is common English, while “turn pale” keeps the visible color-change image.
- pob_phrase: a king today, and tomorrow he falls
  simplified_phrase: Today someone is king; tomorrow that king falls
  preserved_meaning: Royal status can quickly give way to downfall or death.
  reasoning_layer_used: POB lexical and theological decisions for מֶלֶךְ, הַיּוֹם, וּמָחָר, and יִפּוֹל
  rationale: The complete sentence clarifies the contrast without narrowing “falls” to death.
interpretive_expansions:
- pob_phrase: A slight illness
  rendering: Even a minor illness
  claim: “Even” makes explicit the irony that so small an illness affects a physician.
  evidence:
  - The POB rationale says “slight” sharpens the irony of a physician being affected by minor sickness.
  confidence: high
  alternatives_preserved:
  - A minor illness
  - A slight illness
