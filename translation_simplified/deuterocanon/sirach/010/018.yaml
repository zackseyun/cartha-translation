  simplified_phrase: No human being should be arrogant or brazen
  preserved_meaning: Both inward self-exaltation and outward shameless audacity are improper for humans.
  reasoning_layer_used: Hebrew lexical decisions for זָדוֹן, עַזוּת, and לֹא נָאוֶה
  rationale: The direct personal wording is easier to understand while keeping the two distinct vices.
- pob_phrase: much less for one born of a woman
  simplified_phrase: much less a frail mortal born of a woman
  preserved_meaning: The comparison intensifies the rebuke by stressing human frailty and creatureliness.
  reasoning_layer_used: Hebrew lexical rationale for אַף and לִילוּד אִשָּׁה
  rationale: The concrete birth image remains, while its intended force is made clear.
