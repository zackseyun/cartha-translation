translation:
  language: en
  text: It is better to work and have plenty than to act self-important but lack food.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek reads, “My child, glorify your soul in gentleness, and give it honor according to its worth.” The Hebrew and Greek differ substantially here.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Better is one who works and has abundant wealth
  simplified_phrase: It is better to work and have plenty
  preserved_meaning: Productive work joined with material plenty is preferable.
  reasoning_layer_used: POB lexical decisions for טוֹב, עוֹבֵד, and וְיוֹתֵר הוֹן
  rationale: Ordinary sentence order and “have plenty” make the economic contrast clear.
- pob_phrase: one who honors himself
  simplified_phrase: to act self-important
  preserved_meaning: The person exalts himself rather than merely receiving honor.
  reasoning_layer_used: POB lexical decision for מִמִּתְכַּבֵּד
  rationale: “Act self-important” clearly expresses reflexive pride in common English.
- pob_phrase: and lacks food
  simplified_phrase: but lack food
  preserved_meaning: The proud person lacks basic sustenance without implying a total absence of food.
  reasoning_layer_used: POB lexical decisions for וַחֲסַר מַתָּן and grounding review
  rationale: “But lack food” preserves both the degree of lack and the proverb’s sharp contrast.
