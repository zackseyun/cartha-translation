translation:
  language: en
  text: Human offspring are worthy of honor. Those who fear God[b] are worthy of honor. Those who obey the commandment[a] are worthy of honor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek instead ends, “What offspring are dishonorable? Human offspring.”
    reason: textual_variant
  - marker: b
    text: The Greek has “those who fear the Lord” instead of “those who fear God.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: What offspring is honorable? Human offspring.
  simplified_phrase: Human offspring are worthy of honor.
  preserved_meaning: Human offspring are identified as having honor.
  reasoning_layer_used: POB lexical decisions and primary Hebrew text
  rationale: The direct statement is easier to follow while retaining the collective term “offspring.”
- pob_phrase: What offspring is honorable? Those who fear God.
  simplified_phrase: Those who fear God are worthy of honor.
  preserved_meaning: Those who fear God are identified as honorable.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The wording follows the primary Hebrew and states the implied answer directly.
- pob_phrase: What offspring is honorable? Those who keep the commandment.
  simplified_phrase: Those who obey the commandment are worthy of honor.
  preserved_meaning: Those who follow the singular commandment are identified as honorable.
  reasoning_layer_used: POB lexical decision on שׂוֹמֵר מִצְוָה
  rationale: “Obey” explains covenantal “keep,” while the repeated predicate preserves the threefold emphasis.
