translation:
  language: en
  text: An immigrant living among the people, a foreigner, an outsider, or a poor man—their honor is reverent fear of God.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek reads, “It is not right to dishonor a poor intelligent man, and it is not fitting to glorify a sinful man.” The Hebrew and Greek differ substantially here.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: A resident alien
  simplified_phrase: An immigrant living among the people
  preserved_meaning: This is a non-native person settled among another people, not merely a traveler.
  reasoning_layer_used: Hebrew lexical decision for גֵּר
  rationale: The wording replaces a technical legal label with a clear description.
- pob_phrase: a stranger
  simplified_phrase: an outsider
  preserved_meaning: This person stands outside the usual social or kinship circle and remains distinct from the foreigner.
  reasoning_layer_used: Hebrew lexical decision for זָר
  rationale: “Outsider” clearly preserves this separate category in the list.
- pob_phrase: their glory is the fear of God
  simplified_phrase: their honor is reverent fear of God
  preserved_meaning: Reverent awe toward God is what gives these socially low-status people dignity.
  reasoning_layer_used: Hebrew lexical decisions for תִּפְאֶרֶת and יִרְאַת אֱלֹהִים
  rationale: “Honor” is natural English, while “reverent” prevents fear from sounding like mere terror.
interpretive_expansions:
- pob_phrase: resident alien
  rendering: immigrant living among the people
  claim: The immigrant has settled among another people rather than merely passing through.
  evidence:
  - The lexical rationale identifies settled non-native status as the force of גֵּר.
  confidence: high
  alternatives_preserved:
  - resident alien
  - sojourner
- pob_phrase: the fear of God
  rendering: reverent fear of God
  claim: The fear in this wisdom expression includes awe and piety, not merely fright.
  evidence:
  - The lexical rationale identifies יִרְאַת אֱלֹהִים as reverent awe and piety.
  confidence: high
  alternatives_preserved:
  - fear of God
  - reverence for God
