translation:
  language: en
  text: Why should a person who is dust and ashes lift himself up in pride, though his body is lifted up while he is alive?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew ending is difficult. The Greek has, “For while he lives, I cast out his inward parts,” stressing the frailty and mortality of the human body.
    reason: alternative_reading
