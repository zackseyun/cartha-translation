  preserved_meaning: The clause refers to the person's lifetime.
  reasoning_layer_used: POB lexical decision for בְּחַיָּיו
  rationale: Common temporal wording replaces the unnatural phrase “in its life.”
- pob_phrase: its body is lifted up
