translation:
  language: en
  text: A king who lacks self-control will ruin a city, but a city is inhabited when its rulers are wise.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “a city is inhabited through the prudence of its rulers.” The Greek parallel says that a city’s people reflect its leader.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: An undisciplined king
  simplified_phrase: A king who lacks self-control
  preserved_meaning: The king rules without proper restraint.
  reasoning_layer_used: Hebrew lexical decision for פָּרוּעַ
  rationale: This explains “undisciplined” in familiar English without implying specific lawbreaking.
- pob_phrase: a city is inhabited through the wisdom of its rulers
  simplified_phrase: a city is inhabited when its rulers are wise
  preserved_meaning: The city’s inhabited condition is linked to the wisdom of its rulers.
  reasoning_layer_used: Hebrew lexical decisions for נוֹשֶׁבֶת and בְּשֶׂכֶל שָׂרֶיהָ
  rationale: This keeps the passive civic result while expressing the rulers’ wisdom naturally.
