translation:
  language: en
  text: Who can say that a person is in the right if they sin against themselves?[a] And who will honor a person who treats their own life with contempt?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Hebrew differs sharply and is difficult to understand; the main text follows the coherent Greek reading.
    reason: textual_variant
simplification_decisions:
- pob_phrase: Who will justify
  simplified_phrase: Who can say that a person is in the right
  preserved_meaning: The question asks who could pronounce such a person morally right.
  reasoning_layer_used: POB lexical decision for τίς δικαιώσει
  rationale: This states the moral-forensic sense without the technical term “justify.”
- pob_phrase: sins against his own soul
  simplified_phrase: sin against themselves
  preserved_meaning: The sin is directed against the person’s own self.
  reasoning_layer_used: POB lexical decision for εἰς τὴν ψυχὴν αὐτοῦ
  rationale: This uses consistent generic language and expresses the documented idiom plainly.
- pob_phrase: the one who dishonors his own life
  simplified_phrase: a person who treats their own life with contempt
  preserved_meaning: The person treats their own life as lacking honor or worth.
  reasoning_layer_used: POB lexical decisions for ἀτιμάζοντα and τὴν ζωὴν αὐτοῦ
  rationale: This makes the act of dishonoring one’s life immediately understandable.
translation_notes:
  risk_flags:
  - risk: Replacing “justify” may reduce its familiar theological resonance.
    mitigation: “Say that a person is in the right” preserves its documented moral-forensic meaning.
  - risk: The surviving Hebrew gives a sharply different and uncertain reading.
    mitigation: The Greek controls the main text, while the footnote preserves the textual uncertainty.
