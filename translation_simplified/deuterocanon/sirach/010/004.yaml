translation:
  language: en
  text: God holds every man’s power to rule in his hand. He places his splendor before the lawgiver.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel reads, “The authority of the earth is in the Lord’s hand, and at the right time he will raise up the useful one over it.” Its second line differs substantially from the Hebrew-based main text and may reflect a different Hebrew source or a later interpretation.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: In the hand of God is the rule of every man
  simplified_phrase: God holds every man’s power to rule in his hand
  preserved_meaning: Every man’s ruling power remains under God’s control, while the hand image is retained.
  reasoning_layer_used: Hebrew lexical decisions and theological decision on divine sovereignty
  rationale: The natural word order clarifies God’s control without claiming that he directly appoints every ruler.
- pob_phrase: and before the lawgiver he sets his splendor
  simplified_phrase: He places his splendor before the lawgiver
  preserved_meaning: The lawgiver, the act of placing, and the elevated sense of splendor are preserved.
  reasoning_layer_used: Hebrew lexical decisions and doctrine-realignment revision
  rationale: Ordinary clause order and “places” make the line easier to follow without identifying the uncertain pronoun referents.
translation_notes:
  risk_flags:
  - risk: The referents of “he” and “his” in the second sentence remain uncertain.
    mitigation: The wording preserves the Hebrew-based POB ambiguity rather than imposing an unsupported identification.
  - risk: The Greek parallel has a substantially different second line.
    mitigation: The footnote quotes its wording accurately and identifies the major difference.
