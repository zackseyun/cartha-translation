translation:
  language: en
  text: A person's pride begins with defiance,[a] and their heart turns away from their Maker.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel says that pride begins when a person turns away from the Lord; the Hebrew is shorter and simply says “defiance.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: The beginning of a man's pride is defiance
  simplified_phrase: A person's pride begins with defiance
  preserved_meaning: Pride starts in audacious self-assertion, and the statement applies to people generally.
  reasoning_layer_used: POB lexical decisions for תְּחִלַת, אָדָם, and מוּעָז
  rationale: The active wording is easier to read, while “a person” preserves the Hebrew's generic singular sense.
- pob_phrase: his heart turns away from his Maker
  simplified_phrase: their heart turns away from their Maker
  preserved_meaning: The person's inner life moves away from God, the one who made them.
  reasoning_layer_used: POB lexical and theological decisions for וּמֵעֹשֶׂהוּ and יָסוּר לִבּוֹ
  rationale: Singular “their” keeps the saying general without weakening the heart-turning image or the title “Maker.”
translation_notes:
  risk_flags:
  - risk: Modern readers may expect “defiance” to name its object.
    mitigation: The main text retains the Hebrew's terseness, while the second clause and footnote show its Godward direction.
