translation:
  language: en
  text: Do not try to show how wise you are while doing your work, and do not boast when you are in trouble.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The surviving Hebrew text is very different: “A wise servant will be honored, and a foolish servant will not complain.” The last verb may instead mean “grumble” or “make an excuse.”'
    reason: textual_variant
simplification_decisions:
- pob_phrase: Do not act wisely
  simplified_phrase: Do not try to show how wise you are
  preserved_meaning: The command warns against making a display of wisdom, not against truly wise conduct.
  reasoning_layer_used: Greek lexical decision for Μὴ σοφίζου
  rationale: The clearer wording prevents readers from mistaking wisdom itself for the problem.
- pob_phrase: in doing your work
  simplified_phrase: while doing your work
  preserved_meaning: The warning applies to the way a person carries out a task.
  reasoning_layer_used: Greek lexical decision for ποιῆσαι τὸ ἔργον σου
  rationale: “While” expresses the setting in ordinary English.
- pob_phrase: in a time of distress
  simplified_phrase: when you are in trouble
  preserved_meaning: Boasting is forbidden during personal hardship or distress.
  reasoning_layer_used: Greek lexical decision for ἐν καιρῷ στενοχωρίας σου
  rationale: The common phrase communicates the same circumstance more directly.
interpretive_expansions:
- pob_phrase: Do not act wisely
  rendering: Do not try to show how wise you are
  claim: The command concerns self-conscious displays of wisdom or cleverness.
  evidence:
  - The POB lexical rationale identifies self-display or overwise behavior as the force of σοφίζου.
  - The listed alternatives include “Do not show yourself wise” and “Do not play the wise man.”
  confidence: high
  alternatives_preserved:
  - Do not be clever
  - Do not play the wise man
translation_notes:
  risk_flags:
  - risk: The Greek main text and surviving Hebrew witness have substantially different meanings.
    mitigation: The main text follows the documented Greek-primary decision, while the Hebrew is preserved in a textual footnote.
  - risk: Making self-display explicit narrows the surface wording of “act wisely.”
    mitigation: The rendering follows the POB lexical rationale and avoids implying that genuine wisdom is wrong.
