translation:
  language: en
  text: Stolen wealth will not help a sinner escape, and what righteous people long for will never go unfulfilled.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Greek: “The endurance of the godly will certainly not be delayed.” The main text follows the Hebrew.'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: will not escape with plunder
  simplified_phrase: Stolen wealth will not help a sinner escape
  preserved_meaning: Ill-gotten gain cannot secure a sinner’s escape.
  reasoning_layer_used: Hebrew lexical decision for בְּגָזֵל
  rationale: The recasting makes the Hebrew sense of means clear in natural English.
- pob_phrase: the desire of the righteous
  simplified_phrase: what righteous people long for
  preserved_meaning: The righteous have a longing whose outcome is in view.
  reasoning_layer_used: Hebrew lexical decision for תַּאֲוַת צַדִּיק
  rationale: The clause replaces an abstract phrase with direct common wording.
- pob_phrase: will never fail
  simplified_phrase: will never go unfulfilled
  preserved_meaning: The longing of the righteous will not be thwarted or left unrealized.
  reasoning_layer_used: Hebrew lexical and theological decision for וְלֹא יַשְׁבִּית
  rationale: The wording states the intended result more clearly while retaining the promise.
interpretive_expansions:
- pob_phrase: with plunder
  rendering: Stolen wealth will not help
  claim: The plunder is understood as a means that cannot secure escape.
  evidence:
  - The prefixed Hebrew ב can indicate means or attendant circumstance.
  - The POB rationale says ill-gotten gain will not secure escape.
  confidence: high
  alternatives_preserved:
  - with plunder
  - through robbery
  external_witnesses:
  - The Greek parallel likewise refers to plunder or acts of seizure.
- pob_phrase: will never fail
  rendering: will never go unfulfilled
  claim: The righteous person’s longing will not be thwarted or left unrealized.
  evidence:
  - The POB lexical rationale identifies this as the idiomatic Hebrew sense.
  - The theological decision gives priority to the Hebrew wording about longing.
  confidence: high
  alternatives_preserved:
  - will not cease
  - 'Greek: the endurance of the godly will not be delayed'
  external_witnesses:
  - The Greek variant is preserved in the footnote.
