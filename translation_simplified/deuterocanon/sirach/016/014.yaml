translation:
  language: en
  text: Every righteous act has a reward. Each person will receive according to what they have done.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Hebrew has only, “Everyone who does righteousness has a reward”; the second sentence comes from the fuller Greek parallel.
    reason: textual_variant
  - marker: b
    text: The Greek has “almsgiving” or “merciful deed” where the Hebrew has “righteousness.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For every act of righteousness there is a reward
  simplified_phrase: Every righteous act has a reward
  preserved_meaning: Each deed characterized by righteousness receives recompense.
  reasoning_layer_used: Hebrew lexical decisions for הָעֹשֶׁה, צְדָקָה, and שָׂכָר
  rationale: The direct wording is easier to read while retaining the Hebrew-based term “righteous.”
- pob_phrase: each person will find it according to his works
  simplified_phrase: Each person will receive according to what they have done
  preserved_meaning: Each person’s outcome corresponds to their deeds.
  reasoning_layer_used: Greek lexical decision and theological decision to retain the fuller clause
  rationale: Common wording clarifies the idiom without removing the deed-based measure.
interpretive_expansions:
- pob_phrase: will find it
  rendering: will receive
  claim: Finding the reward means receiving the resulting recompense.
  evidence:
  - The POB antecedent of “it” is “a reward.”
  - The Greek clause links the outcome to each person’s works.
  confidence: high
  alternatives_preserved:
  - will find it
  - will find according to their deeds
translation_notes:
  risk_flags:
  - risk: The second sentence is absent from the surviving Hebrew line.
    mitigation: The main text follows the POB decision to include the fuller Greek clause, and footnote a states the difference.
  - risk: “Righteous” may be read broadly and miss the Greek charitable nuance.
    mitigation: Footnote b preserves “almsgiving” and “merciful deed” as Greek alternatives.
