- pob_phrase: desire the appearance of worthless youths
  simplified_phrase: prize worthless young men for their good looks
  preserved_meaning: Do not value morally worthless young men because they are physically attractive.
  reasoning_layer_used: Hebrew lexical decisions for תֹּאַר and נַעֲרֵי שָׁוְא
  rationale: This natural wording keeps the warning focused on outward attractiveness.
- pob_phrase: sons of unrighteousness
  simplified_phrase: sons who are unjust
  preserved_meaning: The sons are characterized by injustice rather than merely committing isolated unjust acts.
  reasoning_layer_used: Hebrew lexical decision for בִּבְנֵי עַוְלָה and grounding review
  rationale: This clarifies the Hebrew idiom while preserving its broad moral characterization.
