translation:
  language: en
  text: Do not prize worthless young men for their good looks, and do not rejoice in sons who are unjust.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek reads, “Do not desire many useless children, and do not rejoice in ungodly sons.” The Hebrew instead refers to the outward appearance of worthless young men.
    reason: textual_variant
