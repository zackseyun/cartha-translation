translation:
  language: en
  text: Who will tell others about a righteous deed?[a] Who will wait for it? For the covenant is far away.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is difficult here; the Greek has “works of righteousness.”
    reason: textual_variant
  - marker: b
    text: The Greek has “covenant,” while the Hebrew appears to have “statute” or “decree.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: declare a work of righteousness
  simplified_phrase: tell others about a righteous deed
  preserved_meaning: Someone speaks of an act that is right.
  reasoning_layer_used: POB lexical decisions for the Hebrew and Greek terms for declaring and righteousness
  rationale: Common wording replaces abstract language while preserving both speaking and righteous action.
- pob_phrase: and who will wait for it?
  simplified_phrase: Who will wait for it?
  preserved_meaning: The question concerns patient waiting or endurance.
  reasoning_layer_used: POB lexical decision combining the Greek sense of waiting with the Hebrew language of hope
  rationale: A separate sentence clarifies the parallel question without identifying the uncertain referent.
- pob_phrase: For the covenant is far off.
  simplified_phrase: For the covenant is far away.
  preserved_meaning: The covenant’s distance explains why waiting is difficult.
  reasoning_layer_used: POB lexical and theological decision favoring the clearer Greek reading
  rationale: “Far away” is natural modern English, while “For” preserves the causal link.
