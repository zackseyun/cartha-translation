translation:
  language: en
  text: Even if they grow in number, do not be glad about them if the fear of the LORD is not with them.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: they become many
  simplified_phrase: they grow in number
  preserved_meaning: They increase numerically.
  reasoning_layer_used: Hebrew lexical decision confirmed by the Greek parallel
  rationale: “Grow in number” expresses increase in natural modern English without adding a biological emphasis.
- pob_phrase: do not delight in them
  simplified_phrase: do not be glad about them
  preserved_meaning: Their number alone should not be a cause for joy.
  reasoning_layer_used: Uncertain Hebrew wording clarified by the Greek parallel
  rationale: “Be glad about” clearly conveys the supported sense of rejoicing while preserving the negative command.
- pob_phrase: the fear of Yahweh
  simplified_phrase: the fear of the LORD
  preserved_meaning: The established biblical wisdom concept and divine name remain intact.
  reasoning_layer_used: POB theological decision and project doctrine for YHWH
  rationale: The traditional phrase protects its theological depth, while “the LORD” follows the project’s divine-name policy.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “fear” as mere terror.
    mitigation: The established wisdom expression is retained because replacing it with “reverence” would narrow its meaning.
