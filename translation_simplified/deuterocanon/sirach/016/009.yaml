translation:
  language: en
  text: He did not spare a people set apart for destruction—a people trampled down in their guilt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel says, “a nation of destruction, those removed in their sins.” The Hebrew uses the image of being trampled down or crushed.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: devoted to destruction
  simplified_phrase: set apart for destruction
  preserved_meaning: The people were placed under a solemn judgment that marked them for destruction.
  reasoning_layer_used: Lexical and theological decisions for חרם
  rationale: “Set apart” makes the judicial force clearer without using the obscure phrase “under the ban.”
- pob_phrase: those trampled down
  simplified_phrase: a people trampled down
  preserved_meaning: The Hebrew judgment image of people being trodden down remains intact.
  reasoning_layer_used: Hebrew lexical decision controlled by the Greek parallel
  rationale: Repeating “a people” makes the apposition easier to follow without weakening the image.
- pob_phrase: in their iniquity
  simplified_phrase: in their guilt
  preserved_meaning: Their corrupt condition and resulting liability remain bound up with the judgment.
  reasoning_layer_used: Lexical decision for עון and preposition ב
  rationale: “Guilt” is more immediately understandable while avoiding an exclusively causal wording.
translation_notes:
  risk_flags:
  - risk: “Set apart” may not convey every covenantal association of חרם.
    mitigation: The phrase retains both solemn designation and destruction, the controlling POB sense.
  - risk: The difficult Hebrew may mean “removed” rather than “trampled down.”
    mitigation: The main text follows the Hebrew image, while the Greek alternative remains in the footnote.
