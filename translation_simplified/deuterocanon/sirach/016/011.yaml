translation:
  language: en
  text: Even if only one person is stiff-necked—stubbornly resistant—it would be astonishing for that person to be cleared.[a] For God has both mercy and anger. He bears with people and forgives them, but he lets his wrath settle on the wicked.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “acquitted” or “allowed to go unpunished.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Even if one person is stiff-necked
  simplified_phrase: Even if only one person is stiff-necked—stubbornly resistant
  preserved_meaning: One person's obstinate resistance is enough to make acquittal astonishing.
  reasoning_layer_used: Hebrew and Greek lexical decision
  rationale: The wording explains the biblical image without replacing it.
- pob_phrase: mercy and anger are with him
  simplified_phrase: God has both mercy and anger
  preserved_meaning: Mercy and anger are both aspects of God's response in this verse.
  reasoning_layer_used: Theological decision and immediate context
  rationale: Naming God removes an unclear pronoun while preserving the deliberate tension.
- pob_phrase: he bears and forgives
  simplified_phrase: He bears with people and forgives them
  preserved_meaning: God patiently bears with human wrongdoing and grants forgiveness.
  reasoning_layer_used: Hebrew lexical rationale
  rationale: Supplying natural objects makes the two divine actions understandable in English.
interpretive_expansions:
- pob_phrase: stiff-necked
  rendering: stiff-necked—stubbornly resistant
  claim: The neck image describes obstinate resistance.
  evidence:
  - The Hebrew and Greek lexical witnesses use the same neck-based image of obstinacy.
  - The POB lexical rationale identifies obstinate resistance as the idiom's sense.
  confidence: high
  alternatives_preserved:
  - stiff-necked
  - stubborn
- pob_phrase: he bears
  rendering: He bears with people
  claim: The verb portrays God as bearing patiently with people in a moral context.
  evidence:
  - The POB lexical rationale says the verb may imply bearing with offense.
  - Its pairing with forgiveness supports a moral rather than physical sense.
  confidence: moderate
  alternatives_preserved:
  - he bears
  - he carries away
