simplification_decisions:
- pob_phrase: If I have sinned, no eye sees me; or if I lie
  simplified_phrase: If I have sinned, no eye sees me. Or if I tell a lie
  preserved_meaning: The speaker gives two alternative examples of wrongdoing believed to be unseen.
  reasoning_layer_used: POB syntax and lexical decisions for אִם חָטָאתִי and אוֹ אִם אֲכַזֵב
  rationale: Two sentences ease reading while “Or” preserves the explicit alternative and “tell a lie” keeps the chosen sense.
- pob_phrase: who knows it in every hiding place?
  simplified_phrase: who will know it in every hiding place?
  preserved_meaning: The rhetorical question covers every place where wrongdoing might be concealed.
  reasoning_layer_used: POB lexical decisions for בְּכָל סֵתֶר and מִי יוֹדֵעַ
  rationale: The wording retains “every hiding place” and uses a natural English rhetorical future.
- pob_phrase: no eye sees me
  simplified_phrase: no eye sees me
  preserved_meaning: The concrete image emphasizes that no observer sees the speaker.
  reasoning_layer_used: POB lexical decision for לֹא תִרְאֵנִי עָיִן
  rationale: The source image is striking but understandable and therefore remains intact.
