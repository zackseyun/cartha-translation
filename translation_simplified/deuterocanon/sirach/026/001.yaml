translation:
  language: en
  text: A man with a good wife is happy, and his days are doubled.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the husband of a good wife
  simplified_phrase: a man with a good wife
  preserved_meaning: The man is her husband, and she is commended as a good wife.
  reasoning_layer_used: The Hebrew marital context and POB lexical decision for בַעֲלָהּ.
  rationale: This recasts the relationship in more natural modern English without suggesting ownership.
- pob_phrase: the number of his days is doubled
  simplified_phrase: his days are doubled
  preserved_meaning: His length or fullness of life is proverbially doubled.
  reasoning_layer_used: The POB lexical rationale for וּמִסְפַּר יָמָיו and כִּפְלַיִם.
  rationale: Removing the formal counting phrase makes the proverb direct while retaining its days-and-doubling image.
translation_notes:
  risk_flags:
  - risk: Readers may take “his days are doubled” as an exact numerical promise.
    mitigation: The proverbial wording is retained because both the Hebrew and Greek express doubling.
