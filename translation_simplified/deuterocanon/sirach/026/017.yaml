  text: In his adorned home, a good wife’s beauty is like the sun rising in the Lord’s heights.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word translated “adorned” can refer both to orderly arrangement and to adornment.
    reason: lexical_alternative
  - marker: b
    text: The Greek can also mean “good woman,” but the household context favors “good wife.”
    reason: lexical_alternative
