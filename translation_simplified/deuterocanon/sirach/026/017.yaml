  preserved_meaning: The wife’s beauty is compared directly with the rising sun.
  reasoning_layer_used: sunrise image and simile structure
  rationale: Reordering the comparison gives it a natural modern English structure without adding that her beauty shines.
- pob_phrase: in the adornment of his house
  simplified_phrase: In his adorned home
  preserved_meaning: The setting remains his household understood in terms of adornment.
  reasoning_layer_used: POB rendering of κόσμος and masculine αὐτοῦ in the supplied Greek
  rationale: The adjective replaces the difficult abstract phrase while the note preserves the word’s range.
- pob_phrase: the beauty of a good wife
