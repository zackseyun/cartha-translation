  preserved_meaning: Two situations cause grief, while the third arouses anger.
  reasoning_layer_used: POB lexical decisions for λελύπηται and θυμός
  rationale: Active wording expresses the same emotions in ordinary English.
- pob_phrase: a warrior brought low by poverty
