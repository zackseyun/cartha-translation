  preserved_meaning: Discerning men are contemptuously treated as worthless things to discard.
  reasoning_layer_used: POB lexical decisions for συνετοί and σκυβαλωθῶσιν
  rationale: “Garbage” makes the refuse image immediately understandable without softening its contempt.
