translation:
  language: en
  text: 'My heart grieves over two things, and a third makes me angry: a warrior brought down by poverty; men with understanding who are treated as if they were garbage; and someone who turns back from righteousness to sin. The Lord will prepare that person for the sword.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “That person” most naturally refers to the one who turns back from righteousness to sin, though the compressed Greek may allow the judgment to sum up the whole saying.
    reason: alternative_reading
