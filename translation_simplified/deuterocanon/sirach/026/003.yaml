translation:
  language: en
  text: A good wife is a good gift. She will be given to someone who fears God.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel says, “She will be given as the portion of those who fear the Lord.” The Hebrew literally says, “into the bosom of one who fears God,” using an image of close, intimate relationship.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: A good wife is a good gift; she will be given
  simplified_phrase: A good wife is a good gift. She will be given
  preserved_meaning: The wife remains a gift that will be given, and the repeated word “good” is retained.
  reasoning_layer_used: POB translation and lexical decisions for מַתָּנָה טוֹבָה and תִּנָּתֵן
  rationale: Two sentences make the proverb easier to follow without changing its ideas.
- pob_phrase: into the bosom of
  simplified_phrase: to
  preserved_meaning: The wife is given into a close personal relationship with the recipient.
  reasoning_layer_used: POB lexical decision for בְּחֵיק and grounding review
  rationale: “To” communicates the idiom without turning its bosom image into an act of hugging.
- pob_phrase: one who fears God
  simplified_phrase: someone who fears God
  preserved_meaning: The recipient remains one God-fearing person without adding explicit male wording.
  reasoning_layer_used: POB lexical and theological decisions for יֵרֵא אֱלֹהִים
  rationale: “Someone” is common modern English and retains the Hebrew divine title.
translation_notes:
  risk_flags:
  - risk: Rendering the Hebrew idiom as “to” removes its concrete bosom image from the main text.
    mitigation: The footnote preserves the literal image and explains its relational force.
