translation:
  language: en
  text: In the same way, his wrath will strip nations of what they possess,[a] and he will turn what they drink into salt water.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Greek: “his wrath will inherit nations.” The Hebrew likely means that his wrath will strip nations of what they possess, which better fits this judgment context.'
    reason: alternative_reading
  - marker: b
    text: Greek has “waters”; the Hebrew more broadly means “what they drink.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: So also
  simplified_phrase: In the same way
  preserved_meaning: The action corresponds to the judgment described just before this verse.
  reasoning_layer_used: POB lexical decision for כן
  rationale: The fuller phrase expresses the comparison in familiar English.
- pob_phrase: will dispossess nations
  simplified_phrase: will strip nations of what they possess
  preserved_meaning: Divine wrath deprives nations of their possessions without specifying land or the means involved.
  reasoning_layer_used: POB lexical and theological decisions for יוריש
  rationale: This explains “dispossess” without narrowing it to territorial expulsion.
- pob_phrase: turn their drink into brine
  simplified_phrase: turn what they drink into salt water
  preserved_meaning: God makes their drink salty rather than leaving it fit as ordinary drink.
  reasoning_layer_used: POB lexical decisions for משקה and למלח
  rationale: Common wording preserves both the broad sense of drink and the salty-liquid image.
translation_notes:
  risk_flags:
  - risk: “Strip nations of what they possess” states the implied object of dispossession.
    mitigation: The wording remains broad and does not specify land, expulsion, or destruction.
  - risk: “Salt water” may sound less severe than “brine.”
    mitigation: It preserves the concrete image of drink being transformed into salty liquid.
