translation:
  language: en
  text: Nations will speak about his wisdom, and the gathered community will publicly praise him.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: will recount his wisdom
  simplified_phrase: will speak about his wisdom
  preserved_meaning: Nations will publicly tell others about the wise man’s wisdom.
  reasoning_layer_used: The lexical decision allows “will tell of” while preserving public testimony.
  rationale: “Speak about” is clear and avoids adding a narrative story.
- pob_phrase: the assembly
  simplified_phrase: the gathered community
  preserved_meaning: The speaker is the assembled Jewish community, not the later Christian church.
  reasoning_layer_used: The lexical and theological decisions define ἐκκλησία as the gathered community in this context.
  rationale: This wording explains “assembly” without suggesting the Christian church.
- pob_phrase: will proclaim his praise
  simplified_phrase: will publicly praise him
  preserved_meaning: The community will openly express praise for the wise man.
  reasoning_layer_used: The lexical rationale gives ἐξαγγελεῖ the force of public announcement and ἔπαινον the sense of praise.
  rationale: The verbal wording is natural English and retains the public force.
interpretive_expansions:
