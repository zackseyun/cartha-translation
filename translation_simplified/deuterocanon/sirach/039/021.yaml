translation:
  language: en
  text: Do not ask,[a] “Why this? Why that?” Everything will show its strength when its time comes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek reads, “For all things were created for their need or use,” rather than, “Everything will show its strength when its time comes.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: One should not say
  simplified_phrase: Do not ask
  preserved_meaning: The general warning against questioning each thing is retained as a direct command.
  reasoning_layer_used: Hebrew idiom and POB lexical decision
  rationale: A direct command is clearer than the impersonal phrase, while “ask” fits the questions that follow.
- pob_phrase: everything will prevail
  simplified_phrase: Everything will show its strength
  preserved_meaning: Each thing becomes strong or effective rather than merely useful.
  reasoning_layer_used: POB lexical decision for יגבר
  rationale: This keeps the Hebrew image of strength while making “prevail” easier to understand.
- pob_phrase: in its time
  simplified_phrase: when its time comes
  preserved_meaning: Each thing has a fitting time in which its force appears.
  reasoning_layer_used: POB lexical rationale for בעתו
  rationale: The clause uses ordinary English without importing the Greek idea of created purpose.
translation_notes:
  risk_flags:
  - risk: The Hebrew and Greek give substantially different reasons for the warning.
    mitigation: The main text follows the extant Hebrew, and the Greek reading remains in the footnote.
  - risk: “Show its strength” may sound more demonstrative than the compact Hebrew verb.
    mitigation: It preserves the POB rationale that each thing displays its force at the proper time.
