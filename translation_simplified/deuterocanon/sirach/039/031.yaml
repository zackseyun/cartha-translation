translation:
  language: en
  text: When he commands, they rejoice. In the order he assigned them, they do not rebel against what he says.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally says “his mouth,” meaning what he says.
    reason: lexical_alternative
  - marker: b
    text: The Greek adds that they are made ready on earth for needs and do not disobey at their appointed times.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: At his command they rejoice
  simplified_phrase: When he commands, they rejoice.
  preserved_meaning: Their joy occurs in response to God's command.
  reasoning_layer_used: POB lexical decision for בצותו
  rationale: A direct verbal clause is easier to understand than the compact prepositional phrase.
- pob_phrase: in their appointed order they do not rebel against his word
  simplified_phrase: In the order he assigned them, they do not rebel against what he says.
  preserved_meaning: Created things follow their God-given order and obey his spoken command.
  reasoning_layer_used: POB lexical and theological decisions for ובחקם and לא ימרו פיו
  rationale: The wording explains who appointed the order without suggesting a physical location.
translation_notes:
  risk_flags:
  - risk: “What he says” may sound less weighty than “his word.”
    mitigation: The verb “rebel” preserves the authority of God's speech.
