translation:
  language: en
  text: Wild animals’ teeth, scorpions, vipers,[a] and a sword that takes vengeance by destroying the wicked—all these were created to serve their purpose. They are kept in reserve until their appointed time.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew names a venomous snake, but the exact species is uncertain; “adders” or “asps” are also possible.
    reason: lexical_alternative
  - marker: b
    text: Or “They are stored away and summoned when their time comes.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: The teeth of wild beasts
  simplified_phrase: Wild animals’ teeth
  preserved_meaning: The dangerous teeth of wild creatures remain part of the list.
  reasoning_layer_used: lexical decision for חית and שן
  rationale: The possessive form is more natural while retaining the concrete image.
- pob_phrase: a sword that takes vengeance to destroy the wicked
  simplified_phrase: a sword that takes vengeance by destroying the wicked
  preserved_meaning: The sword actively carries out vengeance against the wicked through destruction.
  reasoning_layer_used: lexical decisions for חרב נקמות, להחרים, and רשעים
  rationale: “By destroying” makes the relationship between vengeance and destruction immediately clear.
- pob_phrase: kept in store until the time they are appointed
  simplified_phrase: kept in reserve until their appointed time
  preserved_meaning: These forces remain under purposeful restraint until the set time for their use.
  reasoning_layer_used: lexical decisions for באוצר and ולעת יפקדו
  rationale: “Kept in reserve” clearly conveys stored instruments awaiting deployment.
interpretive_expansions:
- pob_phrase: to destroy the wicked
  rendering: by destroying the wicked
  claim: Destroying the wicked is how the sword carries out vengeance.
  evidence:
  - The Hebrew links the sword of vengeance directly with the destruction clause.
  - The Greek parallel likewise joins the avenging sword to the destruction of the wicked.
  confidence: high
  alternatives_preserved:
  - to destroy the wicked
translation_notes:
  risk_flags:
  - risk: “Kept in reserve” softens the literal storehouse image.
    mitigation: The wording preserves the sense of storage, and footnote b retains “stored away.”
  - risk: “Vipers” may suggest a more exact species than the Hebrew establishes.
    mitigation: Footnote a states the zoological uncertainty and preserves alternatives.
