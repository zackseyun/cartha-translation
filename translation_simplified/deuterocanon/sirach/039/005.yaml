translation_notes:
  risk_flags:
  - risk: “Seek the Lord” makes the purpose of the early rising more explicit than the Greek infinitive alone.
    mitigation: The footnote preserves the Greek emphasis on rising early toward the Lord.
  - risk: “Pray about his sins” could sound less urgent than supplication.
    mitigation: “Earnestly” retains the force of the repeated petition verb.
