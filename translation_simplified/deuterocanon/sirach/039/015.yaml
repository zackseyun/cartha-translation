translation:
  language: en
  text: With the harp and other musical instruments, proclaim praise with a shout.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The ancient stringed instrument may have been a lyre rather than a harp.
    reason: lexical_alternative
  - marker: b
    text: The Greek version is much fuller, explicitly calling people to bless the Lord and honor his name; this translation follows the shorter Hebrew text.
    reason: textual_variant
simplification_decisions:
- pob_phrase: With the service of harp and instruments of music
  simplified_phrase: With the harp and other musical instruments
  preserved_meaning: The harp and various instruments provide the musical and liturgical accompaniment.
  reasoning_layer_used: Hebrew lexical decisions and musical context
  rationale: This removes the opaque word “service” without turning the accompaniment into a temporal scene.
- pob_phrase: so you shall speak
  simplified_phrase: proclaim
  preserved_meaning: The worshipers are to give public verbal expression.
  reasoning_layer_used: Hebrew lexical decision for תאמרו
  rationale: “Proclaim” expresses the verbal action clearly in this public worship setting.
- pob_phrase: with a shout of praise
  simplified_phrase: praise with a shout
  preserved_meaning: The speech is a loud, celebratory acclamation of praise.
  reasoning_layer_used: POB chosen rendering for בתרועה
  rationale: The recast keeps praise attached to the shout while producing natural English.
