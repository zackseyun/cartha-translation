translation:
  language: en
  text: When he speaks, the waters pile up like a heap, and at his command there are storehouses of water.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew tersely says “his storehouse”; the Greek has “storehouses of water,” which is followed here.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: At his word
  simplified_phrase: When he speaks
  preserved_meaning: The waters respond when God gives his command.
  reasoning_layer_used: Lexical decision for בדברו and the immediate hymn context
  rationale: This recasts the concise idiom in ordinary English while keeping God implied by the pronoun.
- pob_phrase: at the utterance of his mouth
  simplified_phrase: at his command
  preserved_meaning: God’s spoken command is associated with the storehouses of water.
  reasoning_layer_used: Lexical decision for ובמוצא פיו and its parallel with “at his word”
  rationale: This replaces the formal phrase with clear English without adding a new action.
- pob_phrase: are storehouses of water
  simplified_phrase: there are storehouses of water
  preserved_meaning: The poetic image of water held in divine storehouses remains intact.
  reasoning_layer_used: Lexical decision for אוצרו and the Greek parallel
  rationale: The non-causative wording preserves the text’s ambiguity about whether the command creates or opens the storehouses.
translation_notes:
  risk_flags:
  - risk: “At his command” does not retain the Hebrew’s concrete mouth image.
    mitigation: It preserves the parallel idea of spoken command and avoids the formal wording “utterance of his mouth.”
  - risk: The plural phrase depends on the Greek because the transmitted Hebrew is terse and singular.
    mitigation: The footnote identifies both the Hebrew wording and the Greek basis for the main text.
