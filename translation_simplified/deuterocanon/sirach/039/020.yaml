translation:
  language: en
  text: Throughout all eternity, he sees; nothing is too wondrous or too powerful for him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek reads, “From age to age he looked, and nothing is marvelous before him,” without the Hebrew words “or too powerful.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: From eternity to eternity he looks on
  simplified_phrase: Throughout all eternity, he sees
  preserved_meaning: His attentive sight extends across the full sweep of eternity without adding an object to his seeing.
  reasoning_layer_used: Hebrew temporal idiom, lexical decision for יביט, and grounding review
  rationale: This uses natural English while preserving the source’s objectless statement.
- pob_phrase: nothing is too wondrous
  simplified_phrase: nothing is too wondrous
  preserved_meaning: Nothing extraordinary lies beyond him, without narrowing the idea to understanding alone.
  reasoning_layer_used: Lexical decision for נפלא and grounding review
  rationale: The key word remains because clearer explanatory wording would over-resolve its broad force.
- pob_phrase: too strong for him
  simplified_phrase: too powerful for him
  preserved_meaning: No strength or force exceeds God’s capacity.
  reasoning_layer_used: Hebrew lexical decision for חזק
  rationale: “Powerful” is more natural here and retains the Hebrew predicate absent from the Greek.
translation_notes:
  risk_flags:
  - risk: “Throughout all eternity” presents the Hebrew age-to-age idiom as an unbroken temporal span.
    mitigation: This follows the POB choice “From eternity to eternity” while using more familiar English.
  - risk: “Too powerful” shifts the form of “too strong” slightly.
    mitigation: It preserves the same force comparison and avoids suggesting only physical strength.
