  preserved_meaning: These things benefit people characterized by moral goodness.
  reasoning_layer_used: Hebrew lexical decision informed by the Greek parallel
  rationale: The active wording is natural English while retaining both the beneficial outcome and the Hebrew description of the people.
- pob_phrase: so also for the wicked they are turned to harm
  simplified_phrase: but they turn into harm for the wicked
  preserved_meaning: The same things become harmful in relation to wicked people.
  reasoning_layer_used: Lexical decision for נהפכו and proverb-like contrast
  rationale: The clearer contrast keeps the source image of things turning into harm.
