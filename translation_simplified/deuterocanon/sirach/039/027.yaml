translation:
  language: en
  text: All these things bring good to those who are good, but they turn into harm for the wicked.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel says “the godly,” while the Hebrew says “those who are good.”
    reason: alternative_reading
