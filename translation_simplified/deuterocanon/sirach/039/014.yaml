translation:
  language: en
  text: Together, raise your voices to bless Yahweh. Thank him for everything he has done.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A Greek textual form has a fuller reading: “Send out fragrance like frankincense, blossom like a lily, spread your fragrance, and sing a song of praise.” This differs from the surviving Hebrew line.'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Raise your voices and bless together
  simplified_phrase: Together, raise your voices to bless Yahweh
  preserved_meaning: The community is called to join in spoken blessing while retaining the image of raised voices.
  reasoning_layer_used: Hebrew lexical decisions and immediate worship context
  rationale: The recast clause makes the communal command natural and clearly identifies its implied recipient.
- pob_phrase: give thanks to Yahweh for all his works
  simplified_phrase: Thank him for everything he has done
  preserved_meaning: The worshipers must express gratitude to Yahweh for the whole of his works.
  reasoning_layer_used: Hebrew lexical decisions for והודו and על כל מעשיו
  rationale: The verbal wording is clearer than the biblical expression “all his works.”
interpretive_expansions:
- pob_phrase: bless together
  rendering: Together, raise your voices to bless Yahweh
  claim: Yahweh is the understood recipient of the blessing as well as the stated recipient of thanks.
  evidence:
  - The next clause explicitly directs thanksgiving to Yahweh.
  - The whole line is one communal call to worship.
  confidence: high
  alternatives_preserved:
  - Together, raise your voices in blessing.
translation_notes:
  risk_flags:
  - risk: Naming Yahweh as the object of “bless” makes an implicit relationship explicit.
    mitigation: The immediately following clause names Yahweh and strongly supports this clarification.
  - risk: The Greek parallel could be mistaken for words omitted from the Hebrew-based main text.
    mitigation: The footnote identifies it as a different textual form from the surviving Hebrew line.
