translation:
  language: en
  text: What he desires comes to pass, and nothing can stand in the way of his salvation.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The desire of his will succeeds
  simplified_phrase: What he desires comes to pass
  preserved_meaning: His desired purpose is accomplished.
  reasoning_layer_used: Hebrew lexical decisions for תאות רצונו and יצליח
  rationale: The verbal form expresses the Hebrew idiom naturally and avoids making an abstract desire sound like an actor.
- pob_phrase: there is no hindrance to his salvation
  simplified_phrase: nothing can stand in the way of his salvation
  preserved_meaning: No obstacle can prevent his saving action or outcome.
  reasoning_layer_used: Hebrew lexical decision for מעצור and theological decision for תשועתו
  rationale: The common English expression keeps the source image of something blocking salvation.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “salvation” only in a narrow later doctrinal sense.
    mitigation: The biblical term is retained as POB requires, while the verse itself presents his saving power broadly.
