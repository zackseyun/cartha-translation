translation:
  language: en
  text: The paths of blameless people are made straight, but for strangers those paths lead to ruin.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek reads “for the lawless, they become stumbling blocks,” interpreting “strangers” as people alien to God’s way.
    reason: alternative_reading
  - marker: b
    text: The final Hebrew verb is difficult; “lead to ruin” follows the negative sense supported by the Greek parallel.
    reason: textual_variant
simplification_decisions:
- pob_phrase: The ways of the blameless
  simplified_phrase: The paths of blameless people
  preserved_meaning: The metaphor describes the course of life followed by morally upright people.
  reasoning_layer_used: Hebrew lexical decisions for ארחות and תמים
  rationale: “Paths” keeps the source image, while “blameless people” identifies who is meant.
- pob_phrase: for strangers they become ruinous
  simplified_phrase: for strangers those paths lead to ruin
  preserved_meaning: The same paths result in downfall for outsiders, though the exact Hebrew verb remains uncertain.
  reasoning_layer_used: Hebrew lexical decision for לזרים and Greek-supported handling of יסתוללו
  rationale: The active wording is easier to grasp without replacing Hebrew “strangers” with Greek “lawless.”
translation_notes:
  risk_flags:
  - risk: “Strangers” may be misunderstood as ordinary foreigners.
    mitigation: The footnote notes the Greek moral interpretation without overruling the Hebrew wording.
  - risk: “Lead to ruin” may sound more precise than the difficult final Hebrew verb allows.
    mitigation: The textual footnote states the uncertainty and identifies the Greek support.
