translation:
  language: en
  text: From the beginning, good has been assigned to good people. Likewise, both good and evil are assigned to the wicked.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel says, “Good things were created for good people from the beginning; likewise, evil things for sinners.” The Hebrew says more fully, “for the wicked, good and evil.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Good is allotted to the good from the beginning
  simplified_phrase: From the beginning, good has been assigned to good people
  preserved_meaning: What is good is assigned to morally good people from the outset.
  reasoning_layer_used: Hebrew lexical decisions for טוב, חלק, and מראש
  rationale: The wording clearly conveys an assigned share and its timing.
- pob_phrase: so too, for the wicked, good and evil
  simplified_phrase: Likewise, both good and evil are assigned to the wicked
  preserved_meaning: The Hebrew assigns both good and evil to the wicked.
  reasoning_layer_used: Hebrew primary witness and theological decision over the Greek parallel
  rationale: Supplying the predicate clarifies the compressed clause without reducing it to evil alone.
translation_notes:
  risk_flags:
  - risk: “Assigned” may sound administrative rather than poetic.
    mitigation: It accurately preserves the Hebrew image of an allotted share.
  - risk: Readers may expect only evil to be assigned to the wicked.
    mitigation: The main text follows the fuller Hebrew, while the footnote preserves the Greek alternative.
