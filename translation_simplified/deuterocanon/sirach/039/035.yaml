translation:
  language: en
  text: Now sing joyfully with your whole heart. Bless the name of the Holy One.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel says “and bless the name of the Lord”; the Hebrew witness says “the Holy One.”
