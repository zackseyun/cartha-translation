simplification_decisions:
- pob_phrase: with all your heart sing for joy
  simplified_phrase: sing joyfully with your whole heart
  preserved_meaning: The command calls for wholehearted, audible rejoicing.
  reasoning_layer_used: Hebrew lexical decisions for בכל לב and הרנינו
  rationale: Natural English word order clarifies the command while retaining wholehearted joyful song.
- pob_phrase: and bless the name of the Holy One
  simplified_phrase: Bless the name of the Holy One.
  preserved_meaning: The distinct command to bless God’s name remains intact.
  reasoning_layer_used: Hebrew lexical decisions for וברכו, את שם, and הקדוש
  rationale: A new sentence separates the two commands without weakening the biblical expression.
translation_notes:
  risk_flags:
  - risk: Some readers may understand “bless” only as God giving benefits to people.
    mitigation: The term remains because it preserves the source’s doxological idiom.
  - risk: The Greek parallel uses the divine title “the Lord.”
    mitigation: The Hebrew title controls the text, while the full Greek phrase appears in the footnote.
