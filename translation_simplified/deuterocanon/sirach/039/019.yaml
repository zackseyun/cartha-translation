simplification_decisions:
- pob_phrase: The deeds of all flesh
  simplified_phrase: Everything all flesh does
  preserved_meaning: God has every action of all flesh before him.
  reasoning_layer_used: The lexical decision treats “deeds” as the collective actions of all flesh.
  rationale: The verbal wording is easier to understand while retaining the broad biblical expression “all flesh.”
- pob_phrase: nothing is hidden from before his eyes
  simplified_phrase: Nothing is hidden from his sight
  preserved_meaning: No action or being escapes God's vision.
  reasoning_layer_used: The lexical rationale allows “from his sight” while preserving the Hebrew image of divine seeing.
  rationale: The smoother phrase keeps the force of God's all-seeing gaze without the awkward literal wording.
