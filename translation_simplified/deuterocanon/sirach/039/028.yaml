translation:
  language: en
  text: There are spirits created for judgment.[a] When angry, they move mountains. When wrath comes, they show their power and stir up a storm from the wasteland.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “winds created for punishment.” The Hebrew and Greek words can mean either “spirits” or “winds.”
    reason: lexical_alternative
  - marker: b
    text: The latter part of this verse is marked as uncertain in the Cairo Geniza Hebrew edition, but the Greek text supports including it.
    reason: textual_variant
simplification_decisions:
- pob_phrase: There are spirits created for judgment
  simplified_phrase: There are spirits created for judgment
  preserved_meaning: Such spirits exist and were created to carry out judgment.
  reasoning_layer_used: POB lexical and theological decisions on רוחות and למשפט
  rationale: The existential wording avoids adding an unsupported idea that only some spirits have this purpose.
- pob_phrase: in their anger they move mountains
  simplified_phrase: When angry, they move mountains
  preserved_meaning: Their anger is linked with power great enough to move mountains.
  reasoning_layer_used: POB lexical decisions on ובאפם and הרים יעתיקו
  rationale: A familiar time clause keeps the forceful mountain image in clearer English.
- pob_phrase: at the time of wrath they display their might
  simplified_phrase: When wrath comes, they show their power
  preserved_meaning: Their strength becomes evident when the time of wrath arrives.
  reasoning_layer_used: POB lexical decisions on בעת זעם and גבורתם יראו
  rationale: Common verbs and a shorter clause make the same event easier to understand.
translation_notes:
  risk_flags:
  - risk: Readers may take “spirits” only as personal beings and miss the possible meaning “winds.”
    mitigation: Footnote a preserves the source-language ambiguity.
  - risk: Including the latter portion may conceal uncertainty in the Hebrew witness.
    mitigation: Footnote b identifies the affected portion and notes Greek support.
