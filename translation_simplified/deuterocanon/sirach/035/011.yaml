translation:
  language: en
  text: Have mercy on Jerusalem, your holy city, the established place where you dwell.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “the city of your holiness.” It may also be understood as “the city of your sanctuary.”
    reason: lexical_alternative
