simplification_decisions:
- pob_phrase: the city of your sanctuary
  simplified_phrase: your holy city
  preserved_meaning: Jerusalem is the city set apart to God, while the footnote preserves the holiness and sanctuary senses.
  reasoning_layer_used: Hebrew lexical decision and theological ambiguity
  rationale: “Your holy city” expresses the documented alternative in clear, natural English.
- pob_phrase: the place established for your dwelling
  simplified_phrase: the established place where you dwell
  preserved_meaning: Jerusalem is identified as God’s fixed dwelling place without naming who established it.
  reasoning_layer_used: Hebrew lexical decisions for מכון and שבתך
  rationale: The relative clause is easier to understand and retains both establishment and dwelling.
