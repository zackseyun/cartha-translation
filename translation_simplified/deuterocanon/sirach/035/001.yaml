translation:
  language: en
  text: If they appoint you as their leader, do not lift yourself above them. Be among them as one of them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The supplied Hebrew text reads, “Save us, God of all, and put your fear upon all the nations.” Because it does not match the Greek text for this verse, the translation here follows the Greek.
    reason: textual_variant
simplification_decisions:
- pob_phrase: If they made you a leader
  simplified_phrase: If they appoint you as their leader
  preserved_meaning: Others place the person in a leadership role.
  reasoning_layer_used: The lexical decision says the verb refers to appointment or establishment while retaining the indefinite plural subject.
  rationale: “Appoint” states the kind of making intended more clearly.
- pob_phrase: do not exalt yourself
  simplified_phrase: do not lift yourself above them
  preserved_meaning: A leader must not elevate himself over the people.
  reasoning_layer_used: The lexical decision requires preserving the metaphor and moral force of self-elevation.
  rationale: The wording keeps the upward image while replacing an unfamiliar expression.
- pob_phrase: be among them as one of them
  simplified_phrase: Be among them as one of them
  preserved_meaning: The leader must remain humble and share solidarity with the group.
  reasoning_layer_used: The lexical decision identifies solidarity and humility as the phrase’s force.
  rationale: The existing wording is already clear and preserves the distinct second command.
translation_notes:
  risk_flags:
  - risk: The supplied Hebrew and Greek are entirely different sentences.
    mitigation: The main text follows the documented Greek-primary decision, and the Hebrew wording is disclosed in the footnote.
  - risk: “Lift yourself above them” could be mistaken for a ban on exercising leadership.
    mitigation: The opening clause still identifies the person as their appointed leader, while the command addresses self-elevation.
