translation:
  language: en
  text: So it is with the man who has no nest:[a] he rests wherever evening finds him.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “no home.” The Hebrew says “no nest,” picturing someone with no fixed place to settle.
    reason: lexical_alternative
  - marker: b
