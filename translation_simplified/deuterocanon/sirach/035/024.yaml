translation:
  language: en
  text: Whoever trusts in the law pays attention to the commandments, and whoever trusts in the Lord will not be brought low.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Hebrew line appears mismatched or corrupt here, so this verse follows the coherent Greek reading. “Will not be brought low” may also be translated “will not be diminished” or “will not lack.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: gives heed to the commandments
  simplified_phrase: pays attention to the commandments
  preserved_meaning: Trust in the law leads a person to attend carefully to its commandments without claiming complete obedience.
  reasoning_layer_used: Lexical decision for προσέχει
  rationale: “Pays attention to” expresses attentiveness in common English without strengthening it to “obeys.”
- pob_phrase: will not be diminished
  simplified_phrase: will not be brought low
  preserved_meaning: The person who trusts in the Lord will not be made less or reduced.
  reasoning_layer_used: Lexical decision for οὐκ ἐλαττωθήσεται
  rationale: “Brought low” is clearer than “diminished” while preserving the passive force.
- pob_phrase: And again, if there is healing for the tongue, it is not among human beings.
  simplified_phrase: Whoever trusts in the law … whoever trusts in the Lord
  preserved_meaning: The verse follows the coherent Greek parallel because the surviving Hebrew line does not match this verse.
  reasoning_layer_used: Theological decision on primary-source alignment
  rationale: The documented source decision requires the Greek reading and disclosure of the Hebrew mismatch.
translation_notes:
  risk_flags:
