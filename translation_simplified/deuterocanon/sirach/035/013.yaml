  preserved_meaning: The command keeps its testimonial force and refers to prior deeds without implying a distant past.
  reasoning_layer_used: Hebrew lexical decisions for תן עדות, למראש, and מעשיך
  rationale: “Testify” and “earlier deeds” state the cautious Hebrew-based sense in familiar English.
- pob_phrase: establish the vision swiftly
  simplified_phrase: quickly confirm the vision
  preserved_meaning: The vision is to be made firm without delay.
  reasoning_layer_used: Hebrew lexical decisions for והקם, חזון, and דברק
  rationale: “Confirm” clarifies “establish,” while “quickly” retains the POB’s cautious reading of the obscure Hebrew.
