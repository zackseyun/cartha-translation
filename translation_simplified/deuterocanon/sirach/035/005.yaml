translation:
  language: en
  text: Show a new sign and perform another wonder. Make your hand glorious, and show strength in your arm and your right hand.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek version differs greatly, using images of a gemstone seal on gold ornament and musical harmony at a wine banquet; this translation follows the surviving Hebrew.
    reason: textual_variant
simplification_decisions:
- pob_phrase: Renew a sign and repeat a wonder
  simplified_phrase: Show a new sign and perform another wonder
  preserved_meaning: The prayer asks for a fresh sign and another mighty act.
  reasoning_layer_used: Hebrew lexical decisions for חדש, אות, שנה, and מופת
  rationale: The wording makes both requests natural without adding an unstated recipient.
- pob_phrase: glorify the hand
  simplified_phrase: Make your hand glorious
  preserved_meaning: God is asked to make his hand manifest in majesty.
  reasoning_layer_used: Lexical and theological decisions on האדר and יד
  rationale: This clarifies the command while keeping the hand as the direct object.
- pob_phrase: strengthen the arm and the right hand
  simplified_phrase: show strength in your arm and your right hand
  preserved_meaning: God is asked to manifest power through both bodily images.
  reasoning_layer_used: Lexical decisions and anthropomorphic-language decision
  rationale: The wording avoids implying weakness while preserving the arm and right hand.
interpretive_expansions:
- pob_phrase: strengthen the arm and the right hand
  rendering: show strength in your arm and your right hand
  claim: The request is for divine strength to be displayed, not for God to acquire strength.
  evidence:
  - The lexical rationale lists “show strength in” as an alternative.
  - The surrounding requests concern signs, wonders, and manifested majesty.
  confidence: high
  alternatives_preserved:
  - strengthen your arm and your right hand
translation_notes:
  risk_flags:
  - risk: The Greek parallel reflects substantially different imagery.
    mitigation: The footnote notes the divergence while the text follows the high-confidence Hebrew witness.
  - risk: “Show strength” states manifested power more directly than Hebrew “strengthen.”
    mitigation: The lexical alternative and immediate context support this bounded clarification.
