translation:
  language: en
  text: As long as you live, do not let a son, a wife, a brother, or a friend have authority over you. Do not give your property away to anyone else, or you may regret it and have to ask for it back.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The compressed Greek may instead mean that you will regret it and be left pleading for your property or in need concerning it.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Do not give authority over yourself in your lifetime
  simplified_phrase: As long as you live, do not let ... have authority over you
  preserved_meaning: The warning remains against surrendering personal authority while one is alive.
  reasoning_layer_used: Lexical decisions for μὴ δῷς ἐξουσίαν, ἐπὶ σὲ, and ἐν ζωῇ σου.
  rationale: The recast sentence is natural English without broadening authority over the person into control of the person's whole life.
- pob_phrase: to son or wife, brother or friend
  simplified_phrase: a son, a wife, a brother, or a friend
  preserved_meaning: The same four close relationships remain examples of people who might receive authority.
  reasoning_layer_used: Lexical decision for υἱῷ καὶ γυναικί, ἀδελφῷ καὶ φίλῳ.
  rationale: Repeated articles and conjunctions make the list easier to follow.
- pob_phrase: do not give your property to another
  simplified_phrase: Do not give your property away to anyone else
  preserved_meaning: The command still warns against transferring one's property to another person.
  reasoning_layer_used: Lexical decisions for τὰ χρήματά σου and ἑτέρῳ.
  rationale: “Give away” clearly expresses the transfer that could leave the giver asking for the property back.
translation_notes:
  risk_flags:
  - risk: The final Greek clause may describe pleading for the property or being in need concerning it.
    mitigation: The main text retains POB's chosen meaning, while footnote a preserves the documented ambiguity.
