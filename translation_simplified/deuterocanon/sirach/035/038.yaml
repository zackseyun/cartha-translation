simplification_decisions:
- pob_phrase: Assign him work as is fitting for him
  simplified_phrase: Give him work that is appropriate for him
  preserved_meaning: He is to receive work suited to him.
  reasoning_layer_used: Lexical decisions for εἰς ἔργα κατάστησον and καθὼς πρέπει αὐτῷ
  rationale: Common wording preserves both the command and the concern for fitting work.
- pob_phrase: make his fetters heavy
  simplified_phrase: make his shackles heavy
  preserved_meaning: His physical restraints are to be made burdensome if he disobeys.
  reasoning_layer_used: Lexical decision for βάρυνον τὰς πέδας αὐτοῦ
  rationale: “Shackles” is more familiar while retaining the concrete restraint image and non-comparative force.
- pob_phrase: do not be excessive with any flesh
  simplified_phrase: do not go too far with anyone
  preserved_meaning: Severity toward any person must not exceed proper limits.
  reasoning_layer_used: Lexical and theological decisions for μὴ περισσεύσῃς and ἐν πάσῃ σαρκί
  rationale: The main text states the human sense clearly while the footnote preserves the literal image.
