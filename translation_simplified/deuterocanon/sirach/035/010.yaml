translation:
  language: en
  text: Have mercy on Israel, the people who bear your name[a]—your firstborn, whom you took as your own.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew expression means that the people are identified as belonging to God.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also mean “whom you possessed,” “whom you purchased,” or possibly “whom you created.”
    reason: alternative_reading
  - marker: c
    text: The ancient Greek version has a substantially different line here; this translation follows the surviving Hebrew text.
    reason: textual_variant
simplification_decisions:
- pob_phrase: the people called by your name
  simplified_phrase: the people who bear your name
  preserved_meaning: Israel carries God's name as the people identified with him.
  reasoning_layer_used: lexical and theological decisions on covenantal identity
  rationale: “Bear your name” keeps the name image while making the relationship easier to grasp.
- pob_phrase: on the people ... on Israel
  simplified_phrase: on Israel, the people
  preserved_meaning: The people being named are Israel.
  reasoning_layer_used: Hebrew apposition and POB translation
  rationale: Moving “Israel” forward makes the identification immediate without changing the plea.
- pob_phrase: whom you acquired
  simplified_phrase: whom you took as your own
  preserved_meaning: God acquired Israel as his covenant people without specifying how.
  reasoning_layer_used: lexical decision for קניתה and theological caution
  rationale: The new wording states covenantal possession naturally while the footnote preserves the verb's range.
interpretive_expansions:
- pob_phrase: whom you acquired
  rendering: whom you took as your own
  claim: The acquisition describes God making Israel his own people.
  evidence:
  - The POB lexical rationale identifies a covenantal-historical sense of taking Israel as God's own.
  - The immediate phrase calls Israel God's firstborn.
  confidence: high
  alternatives_preserved:
  - whom you possessed
  - whom you purchased
  - whom you created
translation_notes:
  risk_flags:
  - risk: “Took as your own” may sound more interpretive than the broad Hebrew verb.
    mitigation: Footnote b preserves the documented lexical alternatives.
  - risk: The Greek parallel contains a different line.
    mitigation: Footnote c states that the main text follows the extant Hebrew witness.
