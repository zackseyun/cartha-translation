translation:
  language: en
  text: A crooked heart brings grief, and an experienced man will respond in kind.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew ending is difficult and may also mean, “will repay him accordingly.”
    reason: alternative_reading
  - marker: b
    text: 'The ancient Greek text has a very different line: “Do not trust a road where no one stumbles.”'
    reason: textual_variant
simplification_decisions:
- pob_phrase: A devious heart
  simplified_phrase: A crooked heart
  preserved_meaning: The heart is morally twisted, not merely dishonest.
  reasoning_layer_used: Hebrew lexical decision for עקוב
  rationale: “Crooked” makes the Hebrew moral image easier to grasp while keeping its breadth.
- pob_phrase: a seasoned man
  simplified_phrase: an experienced man
  preserved_meaning: The man has mature judgment gained through experience.
  reasoning_layer_used: Hebrew lexical decision for ותיק
  rationale: “Experienced” is more immediately understandable than “seasoned.”
- pob_phrase: will answer it in kind
  simplified_phrase: will respond in kind
  preserved_meaning: The man gives a corresponding response to the crooked heart or its action.
  reasoning_layer_used: Lexical and theological decisions for ישיבנה בו
  rationale: “Respond” reads naturally while preserving the difficult clause’s reciprocal force.
translation_notes:
  risk_flags:
  - risk: “Respond in kind” may suggest that the experienced man acts just as crookedly.
    mitigation: The alternative-reading footnote signals that the exact nature of his response is uncertain.
  - risk: The surviving Hebrew and ancient Greek differ substantially.
    mitigation: A textual-variant footnote preserves the Greek witness without letting it replace the Hebrew base text.
