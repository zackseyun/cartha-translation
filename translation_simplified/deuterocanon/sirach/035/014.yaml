translation:
  language: en
  text: Give those who wait for you[a] their reward, and let it be shown that your prophets are trustworthy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “those who hope in you.” The Hebrew can mean both waiting and hoping.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek text reads very differently: “Whoever fears the Lord will receive instruction, and those who rise early will find favor.” It probably reflects a different form of the text.'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Give the recompense of those who wait for you
  simplified_phrase: Give those who wait for you their reward
  preserved_meaning: The speaker asks God to reward those who wait for him in trusting expectation.
  reasoning_layer_used: Hebrew lexical decisions for פעלת and קוויך
  rationale: “Their reward” expresses the chosen benefactive sense in natural English.
- pob_phrase: let your prophets be found faithful
  simplified_phrase: let it be shown that your prophets are trustworthy
  preserved_meaning: The petition asks that God's prophets be vindicated as reliable and true.
  reasoning_layer_used: Hebrew lexical decision for יאמנו
  rationale: The revised wording makes the verification sense clear without narrowing it to a courtroom setting.
interpretive_expansions:
- pob_phrase: be found faithful
  rendering: let it be shown that ... are trustworthy
  claim: The prophets' reliability is to become evident or be confirmed.
  evidence:
  - The POB rationale says יאמנו likely expresses verification or vindication of the prophets as trustworthy.
  confidence: high
  alternatives_preserved:
  - be found faithful
  - be confirmed
  - prove true
translation_notes:
  risk_flags:
  - risk: “Reward” may sound like wages earned rather than God's favorable response.
    mitigation: The wording follows the POB lexical decision that the Hebrew denotes what is due or effected for those who wait for God.
  - risk: The surviving Greek presents a substantially different verse.
    mitigation: The main text follows the project’s Hebrew-primary policy, while the Greek reading remains in a footnote.
