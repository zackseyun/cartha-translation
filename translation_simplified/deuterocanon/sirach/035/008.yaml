translation:
  language: en
  text: Bring your words to the main point.[a] Say much with few words. Be like someone who understands, yet remains silent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Hebrew is difficult and may be damaged, so the Greek parallel helps establish the sense of these lines.
    reason: textual_variant
simplification_decisions:
- pob_phrase: Sum up your speech
  simplified_phrase: Bring your words to the main point
  preserved_meaning: The speaker should bring what is said to a concise summary or chief point.
  reasoning_layer_used: Hebrew lexical decisions confirmed by the Greek parallel
  rationale: The concrete idea of bringing speech to its head or main point is expressed in common English.
- pob_phrase: in few words say much
  simplified_phrase: Say much with few words
  preserved_meaning: A wise speaker communicates substantial meaning concisely.
  reasoning_layer_used: Greek idiom and POB lexical footnote
  rationale: The reordered phrase sounds natural while preserving the contrast between much meaning and few words.
- pob_phrase: Be like one who knows and yet keeps silent
  simplified_phrase: Be like someone who understands, yet remains silent
  preserved_meaning: Knowledge should be joined with restraint in speaking.
  reasoning_layer_used: Greek parallel and POB lexical decision
  rationale: Someone and understands are more natural for common readers without weakening the wisdom paradox.
translation_notes:
  risk_flags:
  - risk: The Hebrew text is unstable, especially in the first two clauses.
    mitigation: The wording follows the controlling POB decision based on the coherent Greek parallel and notes the issue.
  - risk: The command to remain silent could be read as praising ignorance or permanent silence.
    mitigation: The contrast with someone who understands preserves the intended union of knowledge and restraint.
