translation:
  language: en
  text: God, stir up your anger and pour out your wrath. Bring the foe low and drive the enemy back.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek version differs sharply, speaking instead of an emerald seal set in gold and of music with pleasant wine. This translation follows the well-attested Hebrew text from the Cairo Geniza manuscripts.
    reason: textual_variant
