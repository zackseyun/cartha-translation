  preserved_meaning: A discerning inner person recognizes what is false as a palate recognizes flavor.
  reasoning_layer_used: POB lexical decisions for לב מבין, בוחן, מטעמי, and כזב
  rationale: Supplying “tests” completes the parallel clause in natural English without weakening the Hebrew image.
