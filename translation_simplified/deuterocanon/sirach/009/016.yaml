translation:
  language: en
  text: Think things over with people who have good judgment, and let the law of the Most High guide everything you say.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The surviving Cairo Geniza Hebrew has a different line: “Do not envy an arrogant man who prospers; remember that until death he will not go unpunished.” Because this Hebrew line may be displaced, the main text follows the Greek.'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Let your thoughts be with the discerning
  simplified_phrase: Think things over with people who have good judgment
  preserved_meaning: One’s thinking and reflection should take place with people of discernment.
  reasoning_layer_used: Greek lexical decision for διαλογισμός and συνετῶν
  rationale: The wording turns an abstract expression into a clear instruction without narrowing discernment to gender.
- pob_phrase: let all your speech be in the law of the Most High
  simplified_phrase: let the law of the Most High guide everything you say
  preserved_meaning: All speech should be shaped by the Most High’s instruction.
  reasoning_layer_used: Greek lexical decision for διήγησις and ἐν νόμῳ Ὑψίστου
  rationale: The active wording explains how speech can be “in” the law while retaining the divine title.
interpretive_expansions:
- pob_phrase: in the law of the Most High
  rendering: let the law of the Most High guide
  claim: The law is presented as the standard that shapes a person’s speech.
  evidence:
  - The POB rationale says the phrase means speech should be shaped by divine instruction.
  - The Greek prepositional phrase connects all speech with the Most High’s law.
  confidence: high
  alternatives_preserved:
  - in the law of the Most High
  - according to the law of the Most High
translation_notes:
  risk_flags:
