translation:
  language: en
  text: Do not give yourself over to a prostitute, or you may end up losing your inheritance.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Inheritance” may mean your estate or hereditary share—what belongs to you and could be lost through sexual folly.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek has a much fuller form: “Turn your eye away from a beautiful woman, and do not study another’s beauty; for many have gone astray because of a woman’s beauty, and from it passion blazes like fire.”'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Do not give yourself to a prostitute
  simplified_phrase: Do not give yourself over to a prostitute
  preserved_meaning: The warning concerns yielding one’s whole self to a prostitute.
  reasoning_layer_used: Hebrew lexical decisions for נתן, נפש, and זונה
  rationale: “Give yourself over” clearly expresses surrender while retaining the Hebrew’s whole-person force.
- pob_phrase: lest you squander your inheritance
  simplified_phrase: or you may end up losing your inheritance
  preserved_meaning: Sexual folly may cause a person’s estate or hereditary portion to be diverted or forfeited.
  reasoning_layer_used: Hebrew lexical decisions for פן, תסב, and נחלה
  rationale: The new wording replaces “lest” and avoids implying only wasteful spending.
interpretive_expansions:
- pob_phrase: lest you squander your inheritance
  rendering: or you may end up losing your inheritance
  claim: The Hebrew warns that the inheritance may be lost or diverted, not merely spent wastefully.
  evidence:
  - The lexical rationale for תסב includes “lose,” “alienate,” and “forfeit.”
  - The rationale for נחלה identifies an estate or hereditary portion.
  confidence: moderate
  alternatives_preserved:
  - divert your inheritance
  - forfeit your inheritance
  - squander your inheritance
translation_notes:
  risk_flags:
  - risk: “Losing” compresses the uncertain Hebrew image of turning or diverting the inheritance.
    mitigation: The footnote and audit preserve the broader possibilities of diversion and forfeiture.
  - risk: The surviving Hebrew and Greek present substantially different forms of the verse.
    mitigation: The Hebrew controls the main text, while the fuller Greek form remains in a footnote.
