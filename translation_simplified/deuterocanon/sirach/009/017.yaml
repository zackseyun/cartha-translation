  preserved_meaning: The command requires deliberate distance from a powerful man capable of killing.
  reasoning_layer_used: Hebrew lexical decisions for רְחַק, אִישׁ, שַׁלִּיט, and הָרַג
  rationale: “Stay well away” expresses the force of deliberate distancing in common English.
- pob_phrase: and do not fear the terrors of death
  simplified_phrase: Do not be afraid of the terrors of death
  preserved_meaning: The warning still forbids fear in the face of death’s intense terrors.
  reasoning_layer_used: Hebrew lexical decision for פַּחֲדֵי מַוֶת
  rationale: A separate sentence and “be afraid” make the command easier to read without weakening it.
