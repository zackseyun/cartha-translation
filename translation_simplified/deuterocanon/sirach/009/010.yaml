translation:
  language: en
  text: 'Do not abandon a longtime friend.[a] A new friend cannot compare with them. A new friend is like new wine: once it has aged, you will drink it with joy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Hebrew supplied for this verse contains a different saying, so this translation follows the Greek text of Sirach 9:10.
    reason: textual_variant
simplification_decisions:
- pob_phrase: an old friend
  simplified_phrase: a longtime friend
  preserved_meaning: The friend is longstanding, not elderly.
  reasoning_layer_used: POB lexical decision for φίλον ἀρχαῖον
  rationale: “Longtime” prevents readers from mistaking “old” as a reference to age.
- pob_phrase: for a new one is not equal to him
  simplified_phrase: A new friend cannot compare with them.
  preserved_meaning: A new friendship does not yet equal a longstanding one.
  reasoning_layer_used: POB lexical decision for οὐκ ἔστιν ἔφισος αὐτῷ
  rationale: The idiom “cannot compare” expresses the same contrast in natural English.
- pob_phrase: when it grows old, you will drink it with gladness
  simplified_phrase: once it has aged, you will drink it with joy
  preserved_meaning: A friendship, like wine, becomes enjoyable through maturity.
  reasoning_layer_used: POB lexical decisions for ἐὰν παλαιωθῇ and μετ’ εὐφροσύνης πίεσαι αὐτόν
  rationale: “Aged” fits wine clearly, while “joy” is more familiar than “gladness.”
