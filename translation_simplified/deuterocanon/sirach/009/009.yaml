translation:
  language: en
  text: Turn your gaze away from a charming woman. Do not keep looking at beauty that is not yours.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek version gives a longer warning: Do not sit with another man’s wife or drink wine with her, or you may be drawn to her and slip into destruction. The Hebrew is shorter and more general.'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Turn your eyes away from a graceful woman
  simplified_phrase: Turn your gaze away from a charming woman
  preserved_meaning: Deliberately look away from a woman whose charm attracts attention.
  reasoning_layer_used: Hebrew idiom and lexical decision for אֵשֶׁת חֵן
  rationale: “Charming” plainly expresses personal attractiveness while keeping it distinct from physical beauty.
- pob_phrase: do not gaze at beauty that is not yours
  simplified_phrase: Do not keep looking at beauty that is not yours
  preserved_meaning: The command forbids sustained looking that crosses a moral boundary.
  reasoning_layer_used: Lexical decisions for תַּבִּיט, יֹפִי, and לֹא לָךְ
  rationale: “Keep looking” makes the sustained force of “gaze” clear in common English.
translation_notes:
  risk_flags:
  - risk: “Beauty that is not yours” may sound possessive toward a person.
    mitigation: The wording preserves the Hebrew moral boundary without narrowing it to another man’s wife.
