  reasoning_layer_used: POB lexical decision on אֵשֶׁת חֵיקֶךָ
  rationale: The direct wording clarifies possession while the footnote preserves the intimacy image.
- pob_phrase: lest
  simplified_phrase: Otherwise, you may
  preserved_meaning: The second sentence warns of a possible undesirable result.
  reasoning_layer_used: POB lexical decision on פֶּן
  rationale: This replaces an uncommon conjunction with a clear warning in modern English.
- pob_phrase: teach against yourself an evil lesson
  simplified_phrase: teach an evil lesson that turns against you
  preserved_meaning: The addressed man remains the teacher, and the evil lesson works to his own harm.
  reasoning_layer_used: POB lexical decisions on תִּלְמַד עָלֶיךָ and רָעָה
  rationale: The recast clause keeps the teaching image and adverse direction in natural English.
