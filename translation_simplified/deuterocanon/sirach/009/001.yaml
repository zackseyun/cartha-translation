translation:
  language: en
  text: Do not be jealous of your wife.[a] Otherwise, you may teach an evil lesson that turns against you.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “the wife in your bosom,” an image of marital intimacy.
    reason: cultural_note
  - marker: b
    text: The Hebrew says “evil,” while the Greek parallel supports the explicit sense “an evil lesson.”
    reason: alternative_reading
