translation:
  language: en
  text: A new friend is like new wine. After the friendship has had time to mature, you may enjoy it as you enjoy aged wine.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Hebrew gives this proverb about friendship and wine, but the Greek has a substantially different warning about walking among snares.
    reason: textual_variant
