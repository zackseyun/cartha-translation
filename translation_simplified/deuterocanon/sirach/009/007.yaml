translation:
  language: en
  text: Do not keep staring at a virgin, or you may be trapped by the penalties connected with her.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is compressed and may mean penalties resulting from involvement with her.
    reason: lexical_alternative
  - marker: b
    text: Greek reads, “Do not look around in the streets of a city, and do not wander in its deserted places.” The surviving Hebrew and Greek texts differ substantially here.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Do not gaze at a virgin
  simplified_phrase: Do not keep staring at a virgin
  preserved_meaning: The warning concerns sustained, attentive looking rather than a brief glance.
  reasoning_layer_used: POB lexical decision for אַל תִּתְבּוֹנֵן
  rationale: “Keep staring” expresses lingering attention in familiar English.
- pob_phrase: lest you be ensnared
  simplified_phrase: or you may be trapped
  preserved_meaning: Such looking can draw the person into harmful consequences like a snare.
  reasoning_layer_used: POB lexical decision and doctrine realignment for תִּוָּקֵש
  rationale: “Trapped” is clearer than “ensnared” while preserving the snare image.
- pob_phrase: the penalties concerning her
  simplified_phrase: the penalties connected with her
  preserved_meaning: The penalties relate to her, though the Hebrew does not specify the exact relationship.
  reasoning_layer_used: POB lexical decision for בַּעֲנָשֶׁיהָ
  rationale: “Connected with” is natural English and retains the Hebrew ambiguity.
translation_notes:
  risk_flags:
  - risk: Readers may assume the penalties fall only on the woman.
    mitigation: The wording and note leave the connection broad and mention consequences of involvement.
  - risk: The Greek witness gives a substantially different warning.
    mitigation: The alternative Greek reading is preserved in a footnote rather than blended into the Hebrew text.
