simplification_decisions:
- pob_phrase: By your strength acquire your friend
  simplified_phrase: Use your ability to gain a friend
  preserved_meaning: Use the capacity available to you to secure friendship.
  reasoning_layer_used: POB lexical decisions for בְּכֹחֲךָ, קְנֵה, and רֵעֶךָ
  rationale: “Ability” expresses capacity without treating strength and ability as separate requirements, while “a friend” is natural English for the relational object.
- pob_phrase: associate yourself with the wise
  simplified_phrase: keep company with the wise
  preserved_meaning: Form relationships with wise people.
  reasoning_layer_used: POB lexical decision for תִּסְתַּיָּד and the Greek parallel
  rationale: “Keep company” preserves the broad relational sense without narrowing it to seeking counsel.
translation_notes:
  risk_flags:
  - risk: The uncommon Hebrew verb may refer more specifically to taking counsel.
    mitigation: The main text retains the POB’s broader reading, and the footnote preserves the Greek alternative.
  - risk: “A friend” generalizes the Hebrew possessive form rendered “your friend” in POB.
    mitigation: The idiomatic wording still presents friendship as something the reader is to gain.
