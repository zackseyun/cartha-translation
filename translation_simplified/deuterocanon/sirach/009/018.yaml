translation:
  language: en
  text: The work of skilled craftsmen will be praised. A ruler of a people shows wisdom in what he says.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The surviving Cairo Geniza Hebrew has a very different saying: “And if you come near, you will not incur guilt, lest he take your life.” The Hebrew and Greek witnesses differ sharply here.'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: In the hand of craftsmen a work will be praised
  simplified_phrase: The work of skilled craftsmen will be praised
  preserved_meaning: The craftsmen’s product receives praise because of their skilled work.
  reasoning_layer_used: Greek lexical decisions for ἐν χειρὶ, τεχνιτῶν, ἔργον, and ἐπαινεθήσεται
  rationale: The agency metaphor is recast as a natural English possessive while retaining the makers, their skill, and the praised product.
- pob_phrase: the ruler of a people is wise in his speech
  simplified_phrase: A ruler of a people shows wisdom in what he says
  preserved_meaning: A ruler’s wisdom is evident in his speech.
  reasoning_layer_used: Greek lexical decisions for ὁ ἡγούμενος, σοφὸς, and ἐν λόγῳ αὐτοῦ
  rationale: The wording makes the connection between wisdom and speech immediately clear without weakening the ruler’s public role.
- pob_phrase: one compound sentence joined by “and”
  simplified_phrase: two short sentences
  preserved_meaning: The two parallel proverbial statements remain distinct and equally prominent.
  reasoning_layer_used: POB syntax and optimal-equivalence philosophy
  rationale: Dividing the parallel lines improves readability without changing their relationship.
translation_notes:
  risk_flags:
  - risk: Recasting “in the hand of” removes the explicit hand image.
    mitigation: The phrase “work of skilled craftsmen” preserves their agency and the concrete setting of skilled making.
  - risk: The surviving Hebrew contains an entirely different saying.
    mitigation: The Greek remains the controlling main text, and the major Hebrew alternative is stated in a footnote.
