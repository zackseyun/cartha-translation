translation:
  language: en
  text: Do not degrade yourself by what you see, or be ruined through involvement with her household.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “after her house.” The connection is uncertain; it may refer to pursuing her household or to ruin caused by involvement with it.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek has a substantially different warning: “Do not scrutinize a virgin, or you may stumble into the penalties or reproaches connected with her.”'
    reason: alternative_reading
