  reasoning_layer_used: Hebrew lexical decisions for לְהִתְנַבֵּל and בְּמַרְאֵה עֵינֵיךָ
  rationale: The wording clearly preserves reflexive degradation and sight as its means or occasion.
- pob_phrase: be appalled after her house
  simplified_phrase: be ruined through involvement with her household
  preserved_meaning: A connection with her household may bring severe devastation.
  reasoning_layer_used: Hebrew lexical alternatives and ambiguity note for וּלְשׁוֹמֵם אֲחַר בֵּיתָהּ
  rationale: “Be ruined” retains the verb’s force while “involvement” avoids settling the uncertain relationship.
