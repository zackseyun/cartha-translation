translation:
  language: en
  text: Do not become closely involved with singing women,[a] or the words from their mouths may burn you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Greek: “Do not give your soul to prostitutes, or you may lose your inheritance.” The Greek states the sexual and moral danger directly, while the Hebrew speaks of singing women whose mouths burn.'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: associate with
  simplified_phrase: become closely involved with
  preserved_meaning: The warning concerns close or intimate association, not merely being nearby.
  reasoning_layer_used: Hebrew lexical decision for תִּדְמוֹךְ
  rationale: The clearer phrase preserves the verb’s social and potentially sexual force.
- pob_phrase: lest
  simplified_phrase: or ... may
  preserved_meaning: Close involvement can lead to the warned-against harm.
  reasoning_layer_used: Hebrew lexical decision for פֶּן
  rationale: The modern consequence clause states the same warning naturally.
- pob_phrase: be burned by their mouths
  simplified_phrase: the words from their mouths may burn you
  preserved_meaning: Their speech can bring ruin, pictured as burning.
  reasoning_layer_used: Hebrew lexical decisions for יִשְׂרְפֻךָ and בְּפִיפִיֹתָם
  rationale: This keeps the burning and mouth images while clarifying that speech is the means.
interpretive_expansions:
- pob_phrase: by their mouths
  rendering: the words from their mouths
  claim: Their speech or singing is the instrument of the threatened harm.
  evidence:
  - The Hebrew mouth expression has an instrumental sense.
  - The POB lexical rationale identifies speech or seductive words.
  confidence: high
  alternatives_preserved:
  - by their mouths
  - by their speech
  - by their lips
translation_notes:
  risk_flags:
  - risk: “Singing women” may sound like a warning against all female singers.
    mitigation: The wording retains the Hebrew image, while “closely involved” and the Greek footnote indicate the specific moral danger.
  - risk: Adding “words” narrows the broader image of mouths.
    mitigation: The text retains “mouths” and presents words as the well-supported means of harm.
