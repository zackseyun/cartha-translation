simplification_decisions:
- pob_phrase: I sought a resting place
  simplified_phrase: I looked for a place to rest
  preserved_meaning: Wisdom searches for a place where she can rest.
  reasoning_layer_used: The lexical decisions treat ἀνάπαυσιν as a concrete place of rest in this context.
  rationale: The familiar wording preserves the concrete image.
- pob_phrase: and in whose inheritance shall I lodge?
  simplified_phrase: In whose inheritance will I find lodging?
  preserved_meaning: Wisdom asks whose allotted domain will provide her lodging.
  reasoning_layer_used: The lexical decisions preserve κληρονομία as “inheritance” and αὐλίζομαι as lodging or camping for the night.
  rationale: The separate question is easier to follow and keeps the lodging image.
translation_notes:
  risk_flags:
  - risk: “Find lodging” is less directly verbal than “lodge.”
    mitigation: The footnote preserves the direct rendering and the overnight-camping sense.
  - risk: Readers may assume the inheritance is already identified as Israel.
    mitigation: The wording leaves its owner unspecified, preserving the POB’s theological tension.
