    text: Aspalathus is an aromatic plant, but its exact identity is uncertain.
    reason: cultural_note
  - marker: b
    text: The Greek literally says “in the tent,” but the incense setting likely points to the sanctuary tent, the tabernacle.
    reason: lexical_alternative
