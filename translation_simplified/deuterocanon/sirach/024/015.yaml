  text: Like cinnamon and the aromatic plant called aspalathus,[a] I gave off the scent of spices. Like fine myrrh, I spread my fragrance, like the incense ingredients galbanum, onycha, and stacte, and like the smoke of frankincense in the tabernacle.[b]
  philosophy: optimal-equivalence
