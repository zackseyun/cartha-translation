  preserved_meaning: Wisdom was created at the primordial beginning, before the temporal order.
  reasoning_layer_used: POB lexical decisions and applied revisions
  rationale: The clearer wording preserves the source’s two linked expressions of primordial time.
- pob_phrase: for all ages
