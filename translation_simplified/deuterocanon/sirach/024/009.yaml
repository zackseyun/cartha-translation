  reasoning_layer_used: POB lexical decision for ἕως αἰῶνος
  rationale: “Through all eternity” states unending duration in natural modern English.
- pob_phrase: I will never cease
  simplified_phrase: I will never cease to exist
  preserved_meaning: Wisdom will never come to an end.
  reasoning_layer_used: POB lexical decision for οὐ μὴ ἐκλίπω
  rationale: Adding “to exist” prevents readers from mistaking “cease” for stopping an activity.
