- pob_phrase: the Creator of all commanded me
  simplified_phrase: the Creator of everything gave me a command
  preserved_meaning: God gives Wisdom a direct command and is Creator of everything.
  reasoning_layer_used: POB lexical decision for ἐνετείλατό and ὁ κτίστης ἁπάντων
  rationale: The active wording is easier to follow while retaining the command’s full force.
- pob_phrase: the one who created me pitched my tent
  simplified_phrase: My Creator pitched my tent
  preserved_meaning: Wisdom is created by God, who establishes her dwelling.
  reasoning_layer_used: POB theological decision on personified Wisdom and creator-creature distinction
  rationale: The shorter sentence removes a dense participial phrase without weakening the distinction between Creator and created Wisdom.
- pob_phrase: Dwell in Jacob
  simplified_phrase: Live among Jacob’s people
  preserved_meaning: Wisdom is commanded to make her home among the covenant people.
  reasoning_layer_used: POB lexical rationale identifying Jacob as a metonym for the covenant people
  rationale: The rendering makes the biblical idiom immediately understandable while the footnote retains its literal form.
