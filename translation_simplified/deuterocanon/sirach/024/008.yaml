translation:
  language: en
  text: Then the Creator of everything gave me a command. My Creator pitched my tent and said, “Live among Jacob’s people,[a] and receive your inheritance in Israel.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “Dwell in Jacob”; Jacob here refers to his people.
    reason: simplification_note
  - marker: b
    text: The wording may also mean “be given your allotted place in Israel.”
    reason: lexical_alternative
