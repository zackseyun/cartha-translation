translation:
  language: en
  text: I took root among a people who had been made glorious, in the Lord’s portion—his inheritance.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek phrase may also mean “in the portion of the Lord’s inheritance” or “in the Lord’s allotted inheritance.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: among a glorified people
  simplified_phrase: among a people who had been made glorious
  preserved_meaning: The people received glory rather than simply possessing an inherent glorious quality.
  reasoning_layer_used: POB lexical and theological decisions on δεδοξασμένῳ
  rationale: The passive clause clearly expresses the participle’s resultative force.
- pob_phrase: in the portion of the Lord, his inheritance
  simplified_phrase: in the Lord’s portion—his inheritance
  preserved_meaning: The Lord’s portion is appositionally identified with his inheritance without settling the compact syntax.
  reasoning_layer_used: POB theological syntax decision and alternative-reading footnote
  rationale: The dash makes the apposition readable while preserving the documented ambiguity.
translation_notes:
  risk_flags:
  - risk: The Greek allows more than one relationship among “portion,” “Lord,” and “inheritance.”
    mitigation: The main text remains appositional, and the footnote preserves the other construals.
