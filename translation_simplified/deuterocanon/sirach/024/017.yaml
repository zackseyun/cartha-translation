  preserved_meaning: Glory and wealth characterize Wisdom’s fruit.
  reasoning_layer_used: POB footnote b and lexical decisions on δόξα and πλοῦτος
  rationale: “Marked by” states the documented idiomatic sense without merging glory and wealth.
