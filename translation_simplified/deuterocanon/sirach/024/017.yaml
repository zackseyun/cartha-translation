  preserved_meaning: Wisdom poetically identifies her blossoms as fruit rather than saying they merely produce it.
  reasoning_layer_used: Greek predicate construction and POB rendering of καρπός
  rationale: The revision retains the source’s compressed identification while using natural English.
- pob_phrase: the fruit of glory and wealth
