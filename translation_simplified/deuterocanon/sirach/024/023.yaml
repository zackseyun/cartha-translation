- pob_phrase: for the assemblies of Jacob
  simplified_phrase: for Jacob’s gathered communities
  preserved_meaning: The law is an inheritance for the assembled communities of Israel named through Jacob.
  reasoning_layer_used: Lexical decisions for συναγωγαῖς and Ἰακώβ
  rationale: “Gathered communities” is clearer than “assemblies” and avoids suggesting later synagogue institutions.
