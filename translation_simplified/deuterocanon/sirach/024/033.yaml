simplification_decisions:
- pob_phrase: and I will leave it for everlasting generations
  simplified_phrase: I will leave it behind for generations without end
  preserved_meaning: The instruction will remain as a legacy for all future generations.
  reasoning_layer_used: lexical decisions for καταλείψω and εἰς γενεὰς αἰώνων
  rationale: This wording makes the legacy and unending duration natural in modern English.
- pob_phrase: Still I will pour out instruction like prophecy, and
  simplified_phrase: Again, I will pour out instruction like prophecy.
  preserved_meaning: The speaker will further spread instruction abundantly in a way compared with prophecy.
  reasoning_layer_used: lexical decisions for ἔτι, ἐκχέω, and ὡς προφητείαν
  rationale: A sentence break clarifies the two actions while preserving the outpouring image and comparison.
