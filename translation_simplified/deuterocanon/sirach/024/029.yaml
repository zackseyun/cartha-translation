translation:
  language: en
  text: For the sea cannot match the abundance of her understanding, nor can the great deep match the abundance of her counsel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “great deep” pictures the immense, primeval waters, not an abstract pit.
    reason: source_note
simplification_decisions:
- pob_phrase: her understanding is more abundant than the sea
  simplified_phrase: the sea cannot match the abundance of her understanding
  preserved_meaning: Wisdom’s understanding surpasses the sea in abundance.
  reasoning_layer_used: Lexical decision for ἐπληθύνθη and the comparative use of ἀπό.
  rationale: The inverse comparison is easier to follow while keeping the sea image and comparative force.
- pob_phrase: her counsel than the great deep
  simplified_phrase: nor can the great deep match the abundance of her counsel
  preserved_meaning: Wisdom’s counsel surpasses even the great deep in abundance.
  reasoning_layer_used: Greek verbal ellipsis and the lexical decisions for βουλή and ἀβύσσου μεγάλης.
  rationale: Supplying the comparison in full removes the English fragment without changing its meaning.
- pob_phrase: her understanding ... her counsel
  simplified_phrase: her understanding ... her counsel
  preserved_meaning: Wisdom remains personified as a female figure with understanding and counsel.
  reasoning_layer_used: Theological decision on the personification of Wisdom.
  rationale: Feminine language and the distinct wisdom terms preserve the passage’s literary theology.
translation_notes:
  risk_flags:
  - risk: The inverse wording introduces the idiom “cannot match,” which is not formally present in Greek.
    mitigation: It expresses only the documented comparative sense that Wisdom surpasses the waters.
  - risk: Readers may take “the great deep” as an abstract abyss.
    mitigation: The footnote identifies its cosmic-water imagery.
