translation:
  language: en
  text: Do not gloat over someone who is dying.[b] Remember, all of us are being gathered in.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Being gathered in” is a traditional Hebrew image for dying; it may also be expressed, “all of us will die.”
    reason: lexical_alternative
  - marker: b
    text: The Greek tradition has a substantially different verse about learning from elders; this translation follows the Hebrew Cairo Geniza text.
    reason: textual_variant
simplification_decisions:
- pob_phrase: Do not boast over one who is dying
  simplified_phrase: Do not gloat over someone who is dying
  preserved_meaning: The command forbids taking triumphant pleasure in another person’s approaching death.
  reasoning_layer_used: Lexical decision for אַל תִּתְהַלֵּל with עַל גֹּוֵעַ
  rationale: “Gloat” clearly conveys hostile rejoicing while keeping the person in the process of dying.
- pob_phrase: remember that all of us are being gathered
  simplified_phrase: Remember, all of us are being gathered in
  preserved_meaning: Everyone shares the same mortality, expressed through the Hebrew gathering image.
  reasoning_layer_used: Theological decision for the death euphemism נֶאֱסָפִים
  rationale: The shorter sentence keeps the solemn metaphor without replacing it with a flat statement about death.
translation_notes:
  risk_flags:
  - risk: Modern readers may not recognize “being gathered in” as an image for death.
    mitigation: Footnote a explains the metaphor while preserving it in the main text.
  - risk: “Gloat” emphasizes hostile rejoicing more directly than the POB wording “boast.”
    mitigation: The lexical rationale explicitly identifies gloating or exulting over another’s death as the contextual sense.
