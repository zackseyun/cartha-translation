translation:
  language: en
  text: Do not enter a legal dispute with a judge,[a] because he will decide as he wishes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek has a different saying here: “Do nothing secret in front of a stranger, for you do not know what it will produce.” The main text follows the surviving Hebrew.'
    reason: textual_variant
