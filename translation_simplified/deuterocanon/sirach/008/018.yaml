  preserved_meaning: The judge will make the decision according to his personal will or preference.
  reasoning_layer_used: POB lexical decisions for כִּרְצוֹנוֹ and יִשְׁפֹּט
  rationale: This natural wording retains the source’s emphasis on the judge’s own will.
