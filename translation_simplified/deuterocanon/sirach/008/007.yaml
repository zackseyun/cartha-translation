translation:
  language: en
  text: Do not shame a man who turns away from wrongdoing. Remember that we are all answerable.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek version reads, “Do not rejoice over the dead. Remember that we all come to our end.” The main text follows the surviving Hebrew.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: turns back from transgression
  simplified_phrase: turns away from wrongdoing
  preserved_meaning: The man changes direction and leaves serious wrongdoing behind.
  reasoning_layer_used: Lexical decisions for שָׁב and מִפֶּשֶׁע
  rationale: This keeps the turning image while replacing formal moral language with common English.
- pob_phrase: we all are liable
  simplified_phrase: we are all answerable
  preserved_meaning: Everyone remains subject to moral accountability or judgment.
  reasoning_layer_used: Lexical and theological decision for חַיָּבִים
  rationale: “Answerable” is clearer than “liable” without narrowing the Hebrew to guilt or death alone.
