translation:
  language: en
  text: Gold has ruined many people,[a] and it leads the hearts of nobles astray.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek has a substantially different reading: “Do not mock an uneducated person, or your ancestors may be dishonored.”'
    reason: alternative_reading
  - marker: b
    text: The Hebrew word translated “nobles” can also mean generous people or princes.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For many has gold ruined
  simplified_phrase: Gold has ruined many people
  preserved_meaning: Gold has brought many people to moral and personal ruin.
  reasoning_layer_used: Hebrew syntax and the lexical decisions for רַבִּים and הִפְחִיז
  rationale: Ordinary English word order makes the warning immediately clear without weakening the difficult verb.
- pob_phrase: it leads astray the heart of nobles
  simplified_phrase: it leads the hearts of nobles astray
  preserved_meaning: Gold misdirects the thought and desire of people of high standing.
  reasoning_layer_used: Lexical decisions for יַשְׂגֶּה, לֵב, and נְדִיבִים
  rationale: The rewrite uses natural English while preserving the moral force and the Hebrew heart image.
translation_notes:
  risk_flags:
  - risk: “Ruined” states the destructive result more strongly than the rare Hebrew verb’s possible senses of making reckless or unsettled.
    mitigation: The POB lexical decision explicitly selects “has ruined” from the parallel warning about being led astray.
  - risk: “Nobles” does not display the Hebrew term’s possible sense of generous people.
    mitigation: The lexical alternative remains in footnote b.
