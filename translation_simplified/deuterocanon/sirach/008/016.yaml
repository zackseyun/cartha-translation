translation:
  language: en
  text: Do not lend money to a man who is stronger than you. If you do lend to him, consider the money gone.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek has a different warning here: do not fight with a hot-tempered man, and do not travel through the wilderness with him; where no one can help, he will strike you down. The surviving Hebrew warns instead about lending to a stronger man.'
    reason: textual_variant
simplification_decisions:
- pob_phrase: Do not lend to a man stronger than you
  simplified_phrase: Do not lend money to a man who is stronger than you
  preserved_meaning: The warning concerns making a loan to a more powerful man.
  reasoning_layer_used: Lexical decisions for תַּלְוֶה and אִישׁ חָזָק מִמְּךָ
  rationale: Adding “money” and using a relative clause makes the financial warning immediately clear.
- pob_phrase: and if you do lend, regard it as lost
  simplified_phrase: If you do lend to him, consider the money gone
  preserved_meaning: The lender should assume that the loan will not be recovered.
  reasoning_layer_used: Lexical decision for כִּמְאַבֵּד
  rationale: “Consider the money gone” expresses the Hebrew comparison in direct common English.
interpretive_expansions:
- pob_phrase: lend ... regard it as lost
  rendering: lend money ... consider the money gone
  claim: The object lent and regarded as gone is money given as a loan.
  evidence:
  - The lexical analysis identifies תַּלְוֶה as extending a financial loan.
  - The following loss clause confirms the financial context.
  confidence: high
  alternatives_preserved:
  - The wording does not specify the amount or form of the loan.
