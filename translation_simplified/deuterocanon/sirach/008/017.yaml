translation:
  language: en
  text: Do not promise to pay someone else’s debt for a person who is more powerful or important than you.[a] But if you have made that promise, treat it as a debt you must pay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Hebrew can also mean “for someone greater than you” or “for someone beyond you.” The Greek reads differently: “Do not seek advice from a fool, for he cannot keep a matter confidential.”'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: pledge yourself
  simplified_phrase: promise to pay someone else’s debt
  preserved_meaning: The person becomes financially responsible as a guarantor for another.
  reasoning_layer_used: POB lexical decision for אַל תַּעֲרֹב
  rationale: The wording explains the unfamiliar legal-financial expression in common English.
- pob_phrase: for one stronger than you
  simplified_phrase: for a person who is more powerful or important than you
  preserved_meaning: The warning concerns guaranteeing the obligation of someone greater in power or standing.
  reasoning_layer_used: POB lexical rationale and grounding review
  rationale: This keeps the comparison with the person rather than narrowing it to the debt’s affordability.
- pob_phrase: act as one who must pay
  simplified_phrase: treat it as a debt you must pay
  preserved_meaning: The guarantor should regard the other person’s debt as a real personal liability.
  reasoning_layer_used: POB lexical decision for כִמְשַׁלֵּם
  rationale: The direct wording preserves the full force of the expected payment.
interpretive_expansions:
- pob_phrase: pledge yourself
