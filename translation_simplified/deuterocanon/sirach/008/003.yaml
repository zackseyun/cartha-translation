translation:
  language: en
  text: Do not argue with a sharp-tongued person. Do not pile more wood on that person’s fire.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Hebrew is difficult and may mean, “Do not plot against a person with no wealth, or he may weigh your price and you may be ruined.” The main text follows the Greek, which gives a clear proverb.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Do not quarrel
  simplified_phrase: Do not argue
  preserved_meaning: The verse warns against entering a heated verbal conflict.
  reasoning_layer_used: POB lexical decision using the Greek parallel
  rationale: “Argue” is more common modern English while preserving the Greek-based warning.
- pob_phrase: with a man who has a sharp tongue
  simplified_phrase: with a sharp-tongued person
  preserved_meaning: The warning concerns someone whose speech is combative or cutting.
  reasoning_layer_used: POB lexical decision for Greek ἀνθρώπου γλωσσώδους
  rationale: The shorter wording keeps the vivid tongue image without limiting the proverb to males.
- pob_phrase: and do not pile wood on his fire
  simplified_phrase: Do not pile more wood on that person’s fire
  preserved_meaning: Do not intensify the person’s anger or the conflict.
  reasoning_layer_used: POB lexical decision preserving the Greek fire metaphor
  rationale: A separate sentence makes the warning easier to follow while retaining the source image.
