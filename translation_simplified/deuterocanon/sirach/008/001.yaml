  preserved_meaning: The warning covers entering a serious dispute or struggle, not merely disagreeing.
  reasoning_layer_used: POB lexical decision for אַל תָּרִיב
  rationale: “Get into a conflict” makes the practical warning immediately clear.
- pob_phrase: lest you fall into his hands
  simplified_phrase: If you do, you may end up in his hands
  preserved_meaning: Conflict with someone powerful may leave you under his power.
  reasoning_layer_used: Hebrew clause and Greek parallel
  rationale: A separate conditional sentence replaces the less familiar word “lest” while retaining the hands image.
translation_notes:
  risk_flags:
