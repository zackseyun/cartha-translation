translation:
  language: en
  text: Do not get into a conflict with a powerful man. If you do, you may end up in his hands.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says more literally, “Why should you be placed in his hand?” The Greek parallel gives the warning expressed in the main text.
    reason: alternative_reading
