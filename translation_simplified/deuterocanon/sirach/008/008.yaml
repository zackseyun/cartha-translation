translation:
  language: en
  text: Do not humiliate an old man. Remember, you too will one day be among the elders.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek tradition has a different saying: “Do not ignore the teaching of the wise. Study their proverbs, for from them you will receive instruction and learn how to serve great men.” The Hebrew instead warns against shaming the aged.'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Do not shame an old man
  simplified_phrase: Do not humiliate an old man
  preserved_meaning: The command forbids causing an old man to experience shame or disgrace.
  reasoning_layer_used: Hebrew lexical decision for אַל תְּבַיֵּשׁ
  rationale: “Humiliate” makes the outward act of causing shame immediately clear.
- pob_phrase: will be numbered among the elders
  simplified_phrase: will one day be among the elders
  preserved_meaning: The reader will eventually join the older generation.
  reasoning_layer_used: Hebrew lexical decision for תִמָּנֶה מִזְּקֵנִים
  rationale: The simpler wording keeps the communal sense while avoiding an opaque passive idiom.
translation_notes:
  risk_flags:
  - risk: “Humiliate” may suggest a more public or intense act than “shame.”
    mitigation: It preserves the causative force and avoids the mistaken sense of merely feeling ashamed.
  - risk: The Greek tradition contains a substantially different verse.
    mitigation: The main text follows the surviving Hebrew, while the alternate tradition remains in a footnote.
