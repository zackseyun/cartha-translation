translation:
  language: en
  text: Do not prosper through a wicked man’s inheritance,[a] or the sparks from his fire may burn you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek text has a different saying here: “Do not take a judge to court, for they will decide in his favor because of his standing.” The Hebrew text warns about a wicked man’s inheritance.'
    reason: textual_variant
simplification_decisions:
- pob_phrase: Do not prosper in the inheritance of a wicked man
  simplified_phrase: Do not prosper through a wicked man’s inheritance
  preserved_meaning: The warning concerns prospering through involvement with a wicked man’s estate or legacy.
  reasoning_layer_used: Hebrew lexical decisions for צלח, בְּ, and נחלה
  rationale: “Through” clarifies the connection without making the inheritance specifically the foundation of success.
- pob_phrase: lest you be burned
  simplified_phrase: or ... may burn you
  preserved_meaning: Such involvement may expose the hearer to destructive consequences.
  reasoning_layer_used: Hebrew lexical decision for פן תבער
  rationale: The direct wording is natural English and preserves the warning as a possible consequence.
- pob_phrase: by the sparks of his fire
  simplified_phrase: the sparks from his fire
  preserved_meaning: The wicked man’s destructive danger can spread and harm the hearer.
  reasoning_layer_used: Hebrew lexical decisions for שביב and אשו
  rationale: The natural preposition keeps the vivid image of sparks spreading from his fire.
translation_notes:
  risk_flags:
  - risk: The Hebrew and Greek witnesses preserve substantially different sayings.
    mitigation: The main text follows the Hebrew under project policy, while the Greek reading is given in a footnote.
