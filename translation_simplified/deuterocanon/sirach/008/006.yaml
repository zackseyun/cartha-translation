translation:
  language: en
  text: Do not make a habit of associating with a foolish man, or he may treat people of noble rank with contempt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek reads: “Do not dishonor a man in his old age, for some of us too are growing old.” The Greek differs substantially from the surviving Hebrew here.'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: become familiar with
  simplified_phrase: make a habit of associating with
  preserved_meaning: The warning concerns regular, habitual association rather than merely knowing someone.
  reasoning_layer_used: Hebrew lexical decision for תְּרַגִּיל
  rationale: This wording makes the habitual sense clear in natural English.
- pob_phrase: lest he show contempt for
  simplified_phrase: or he may treat ... with contempt
  preserved_meaning: The foolish man’s contempt is presented as a possible negative consequence.
  reasoning_layer_used: Hebrew lexical decisions for פֶּן and יָבוּז
  rationale: The recast clause replaces formal wording without weakening the warning.
- pob_phrase: nobles
  simplified_phrase: people of noble rank
  preserved_meaning: The object of contempt is understood as people of elevated social status.
  reasoning_layer_used: Hebrew lexical decision for לִנְדִיבִים
  rationale: The phrase explains the status sense of “nobles” for common readers.
translation_notes:
  risk_flags:
  - risk: The Hebrew term rendered “people of noble rank” can also suggest generous or honorable people.
    mitigation: The main text follows POB’s chosen status sense without claiming it is the only lexical possibility.
  - risk: The surviving Hebrew and Greek preserve substantially different forms of the verse.
    mitigation: The Hebrew controls the main text, and the Greek reading remains visible in the footnote.
