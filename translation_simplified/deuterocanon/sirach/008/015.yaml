translation:
  language: en
  text: Do not give ground to a scoffer, or he may station him before you, lying in ambush.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “station him,” but the person meant is unclear. The Greek gives a broader warning about a dangerous, self-willed man acting against you.
    reason: textual_variant
simplification_decisions:
- pob_phrase: Do not move aside before a scoffer
  simplified_phrase: Do not give ground to a scoffer
  preserved_meaning: Do not yield your position to a contemptuous person.
  reasoning_layer_used: POB lexical decision for אַל תָּזוּחַ
  rationale: “Give ground” naturally preserves both the physical image and the warning against yielding.
- pob_phrase: lest he seat him
  simplified_phrase: or he may station him
  preserved_meaning: The scoffer may place the unclear male referent in a hostile position.
  reasoning_layer_used: POB lexical and theological decisions for לְהוֹשִׁיבוֹ
  rationale: “Station” clarifies hostile placement while “him” preserves the difficult pronoun.
- pob_phrase: as one lying in wait before you
  simplified_phrase: before you, lying in ambush
  preserved_meaning: The person is positioned before the hearer with concealed hostile intent.
  reasoning_layer_used: POB lexical decisions for כְּאוֹרֵב and לְפָנֶיךָ
  rationale: The recast wording keeps the ambush image without adding an explicit attacker.
translation_notes:
  risk_flags:
