translation:
  language: en
  text: A good man will promise to pay his neighbor’s debt if his neighbor cannot. But a man who has lost his sense of shame will abandon the one who guaranteed his debt.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: will stand surety for his neighbor
  simplified_phrase: will promise to pay his neighbor’s debt if his neighbor cannot
  preserved_meaning: The good man accepts financial responsibility as his neighbor’s guarantor.
  reasoning_layer_used: POB lexical decision for ἐγγυήσεται and the chapter’s financial context
  rationale: The legal expression is restated in common language while retaining its financial force.
- pob_phrase: one who has lost shame
  simplified_phrase: a man who has lost his sense of shame
  preserved_meaning: The Greek image presents the man as having forfeited moral restraint.
  reasoning_layer_used: POB lexical and theological decisions for ὁ ἀπολωλεκὼς αἰσχύνην
  rationale: “Sense of shame” makes the image natural while preserving the masculine wording and moral force.
- pob_phrase: will abandon him
  simplified_phrase: will abandon the one who guaranteed his debt
  preserved_meaning: The shameless borrower fails the man who accepted responsibility for his debt.
  reasoning_layer_used: Immediate context in Sirach 29:15 clarifying καταλείψει αὐτόν
  rationale: Naming the guarantor prevents readers from mistaking the abandoned person for the debtor.
interpretive_expansions:
- pob_phrase: will stand surety for his neighbor
  rendering: will promise to pay his neighbor’s debt if his neighbor cannot
  claim: Standing surety here means accepting responsibility to pay another person’s debt upon default.
  evidence:
  - The POB lexical rationale identifies the act as serving as another person’s financial guarantor.
  - The chapter context concerns surety and financial responsibility.
  confidence: high
  alternatives_preserved:
  - will guarantee his neighbor’s debt
  - will become guarantor for his neighbor
- pob_phrase: will abandon him
  rendering: will abandon the one who guaranteed his debt
  claim: The abandoned person is the guarantor, while the shameless man is the debtor who fails him.
  evidence:
  - Sirach 29:15 tells the borrower not to forget his guarantor because the guarantor risked his life for him.
  - The contrast links the good man who gives surety with the man later abandoned.
  confidence: high
  alternatives_preserved:
  - will abandon him
translation_notes:
  risk_flags:
