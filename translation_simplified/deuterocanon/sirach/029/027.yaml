translation:
  language: en
  text: Leave the place of honor,[a] you who are staying here temporarily. My brother is now my guest, and I need the lodging.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek expression is unusual and may also mean “the honored place”; more literally, it says “from before the face of honor.”
    reason: lexical_alternative
  - marker: b
    text: This may also mean “I need space to offer hospitality” or “lodging is needed.”
    reason: lexical_alternative
