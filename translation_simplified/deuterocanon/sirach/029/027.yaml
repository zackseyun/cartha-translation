  simplified_phrase: Leave ... you who are staying here temporarily
  preserved_meaning: The speaker bluntly orders a socially vulnerable temporary resident to depart.
  reasoning_layer_used: POB lexical decision for ἔξελθε and πάροικε
  rationale: The wording replaces the unfamiliar “sojourner” while retaining temporary residence and outsider status.
- pob_phrase: from the place of honor
  simplified_phrase: the place of honor
  preserved_meaning: The person must give up a prominent or honored position.
  reasoning_layer_used: POB lexical decision for ἀπὸ προσώπου δόξης
  rationale: The POB wording is retained because it clearly presents the likely contextual sense.
- pob_phrase: has become my guest
