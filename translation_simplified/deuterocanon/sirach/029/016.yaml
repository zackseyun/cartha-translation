translation:
  language: en
  text: A sinner will wreck the good things that belong to someone who guarantees another person’s debt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “will ruin the property of someone who guarantees another person’s debt.” The Greek may refer broadly to good things, benefits, or possessions.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: will overturn
  simplified_phrase: will wreck
  preserved_meaning: The sinner brings destructive ruin while retaining the force of something being overturned.
  reasoning_layer_used: POB lexical decision for ἀνατρέψει
  rationale: “Wreck” clearly expresses both the forceful image and its implied result.
- pob_phrase: the good things of a guarantor
  simplified_phrase: the good things that belong to someone who guarantees another person’s debt
  preserved_meaning: The wording remains broad enough to include possessions, benefits, and other good things.
  reasoning_layer_used: POB lexical decisions for ἀγαθὰ and ἐγγύου
  rationale: The fuller clause explains the financial role without narrowing “good things” to property alone.
interpretive_expansions:
- pob_phrase: a guarantor
  rendering: someone who guarantees another person’s debt
  claim: The guarantor accepts financial responsibility for another person.
  evidence:
  - The POB lexical rationale identifies a guarantor as one who stands surety for another.
  confidence: high
  alternatives_preserved:
  - surety
  - one who gives security
translation_notes:
  risk_flags:
