- pob_phrase: For the sake of the commandment
  simplified_phrase: Because the commandment calls for it
  preserved_meaning: The commandment is the stated reason for helping the poor.
  reasoning_layer_used: Lexical decision for χάριν ἐντολῆς and theological decision on the unspecified commandment.
  rationale: This states the motive naturally without identifying a particular commandment.
- pob_phrase: help the poor
  simplified_phrase: help people who are poor
  preserved_meaning: The command requires active aid for poor or needy people.
  reasoning_layer_used: Lexical decisions for ἀντιλαβοῦ and πένητος.
  rationale: This avoids a potentially impersonal label while retaining active help.
- pob_phrase: do not send him away empty
  simplified_phrase: do not send them away with nothing
  preserved_meaning: A person seeking aid must not be dismissed without receiving anything.
  reasoning_layer_used: Lexical decision for μὴ ἀποστρέψῃς αὐτὸν κενόν.
  rationale: This makes the concrete image immediately clear in common English.
interpretive_expansions:
