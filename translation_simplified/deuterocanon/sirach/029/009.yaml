translation:
  language: en
  text: Because the commandment[a] calls for it, help people who are poor. Give help that matches their need, and do not send them away with nothing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The text does not identify a specific commandment; it may refer generally to a divine or moral command to care for the poor.
