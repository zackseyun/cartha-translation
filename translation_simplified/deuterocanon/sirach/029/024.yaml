translation:
  language: en
  text: It is a miserable life to move from one house to another. Wherever you stay as an outsider, you cannot speak freely.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: A miserable life is to go from house to house
  simplified_phrase: It is a miserable life to move from one house to another
  preserved_meaning: Continually changing households makes life insecure and miserable.
  reasoning_layer_used: POB lexical decisions for ζωὴ πονηρά and ἐξ οἰκίας εἰς οἰκίαν
  rationale: The rewrite keeps the house-to-house image while stating the movement naturally.
- pob_phrase: where one stays as a stranger
  simplified_phrase: Wherever you stay as an outsider
  preserved_meaning: The person lives in the household without fully belonging there.
  reasoning_layer_used: POB lexical decision for παροικήσει and cultural footnote b
  rationale: “Outsider” conveys temporary residence and lack of social belonging in common English.
- pob_phrase: he will not open his mouth
  simplified_phrase: you cannot speak freely
  preserved_meaning: Outsider status leaves the person without the standing to speak openly.
  reasoning_layer_used: POB lexical decision for οὐκ ἀνοίξει στόμα and its rationale
  rationale: The wording expresses social constraint without claiming a particular inner feeling.
interpretive_expansions:
- pob_phrase: he will not open his mouth
  rendering: you cannot speak freely
  claim: The silence arises from constrained social standing in another person’s household.
  evidence:
  - The immediate context presents the person as moving between households and staying as an outsider.
  - The POB rationale identifies hesitancy or lack of standing as the likely contextual sense.
  confidence: moderate
  alternatives_preserved:
  - The wording does not specify fear, shame, or another subjective cause.
  - Literal silence remains possible within the broader inability to speak freely.
translation_notes:
