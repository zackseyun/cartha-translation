translation:
  language: en
  text: Before he receives the money, he will kiss his neighbor’s hand and speak humbly to get it. But when it is time to repay, he will stall. Instead of returning the money, he will offer only careless excuses and blame the timing.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Until he receives it
  simplified_phrase: Before he receives the money
  preserved_meaning: His flattering behavior continues until he obtains the loan.
  reasoning_layer_used: POB lexical decision for ἕως οὗ λάβῃ and the borrowing context
  rationale: Naming the money makes the pronoun clear without changing the sequence.
- pob_phrase: for his neighbor’s money he will lower his voice
  simplified_phrase: speak humbly to get it
  preserved_meaning: He adopts a submissive tone because he wants his neighbor’s money.
  reasoning_layer_used: POB lexical decisions for ἐπὶ τῶν χρημάτων τοῦ πλησίον and ταπεινώσει φωνήν
  rationale: The idiom and its motive are recast in ordinary English.
- pob_phrase: he will delay, and he will repay with words of indifference
  simplified_phrase: he will stall. Instead of returning the money, he will offer only careless excuses
  preserved_meaning: He postpones repayment and gives dismissive words rather than money.
  reasoning_layer_used: POB lexical decisions and footnote on the ironic use of “repay”
  rationale: Two direct sentences make the stalling and ironic repayment easy to understand.
interpretive_expansions:
- pob_phrase: he will repay with words of indifference
  rendering: Instead of returning the money, he will offer only careless excuses
  claim: The borrower gives dismissive excuses in place of the money owed.
  evidence:
  - The POB footnote identifies “repay” as ironic because he returns excuses instead of money.
  - The lexical rationale describes the words as dismissive excuse-making.
  confidence: high
  alternatives_preserved:
