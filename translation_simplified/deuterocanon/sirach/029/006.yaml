translation:
  language: en
  text: If the lender manages to recover anything, he will barely get back half, and he will treat even that like money he unexpectedly found. If he cannot recover it, he loses his money, and all he gains is an enemy. The borrower will repay him with curses and insults. Instead of honor, he will repay him with dishonor.
  philosophy: optimal-equivalence
