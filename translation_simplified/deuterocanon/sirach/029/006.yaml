  preserved_meaning: The lender suffers financial loss and receives hostility rather than benefit.
  reasoning_layer_used: lexical and theological decisions on ἐκτήσατο αὐτὸν ἐχθρὸν οὐ δωρεάν
  rationale: This natural phrasing preserves the bitter irony without broadening the moral claim.
