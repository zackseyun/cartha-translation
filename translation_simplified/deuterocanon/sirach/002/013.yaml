translation:
  language: en
  text: Woe to the person whose heart does not trust, for that person will not stand firm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says, “Woe to the slack heart, because it does not believe; therefore it will not be sheltered.” The Hebrew says “heart” and “will not stand.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the heart that does not trust
  simplified_phrase: the person whose heart does not trust
  preserved_meaning: The heart remains the center of a person’s will and disposition, and its failure is expressed as the person’s failure.
  reasoning_layer_used: POB lexical decision for לְלֵב
  rationale: This makes the Hebrew use of “heart” immediately understandable without discarding its image.
- pob_phrase: it also will not stand
  simplified_phrase: that person will not stand firm
  preserved_meaning: The one who does not trust will fail to remain firm or endure.
  reasoning_layer_used: POB lexical decision for לֹא יָקוּם
  rationale: “Stand firm” clarifies the contextual force of the literal image “stand.”
interpretive_expansions:
- pob_phrase: the heart
  rendering: the person whose heart
  claim: The heart represents the inner person rather than the physical organ alone.
  evidence:
  - The POB lexical rationale says Hebrew “heart” denotes the inner person, including will and disposition.
  confidence: high
  alternatives_preserved:
  - heart
