translation:
  language: en
  text: You who fear Yahweh, hope for what is good.[a] Hope for joy that lasts forever and for mercy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek reads “good things,” using a plural noun.
    reason: alternative_reading
  - marker: b
    text: The Hebrew word translated “mercy” can also mean “steadfast love” or “kindness.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: hope for good
  simplified_phrase: hope for what is good
  preserved_meaning: The hope remains broad and is directed toward good without limiting it to particular blessings.
  reasoning_layer_used: Hebrew lexical decision, checked against the Greek parallel
  rationale: Adding “what is” makes the phrase natural in modern English while preserving the Hebrew singular sense.
- pob_phrase: and for everlasting joy and mercy
  simplified_phrase: Hope for joy that lasts forever and for mercy
  preserved_meaning: Joy remains unending, and mercy remains a distinct blessing to be hoped for.
  reasoning_layer_used: Hebrew lexical decisions for שִׂמְחַת עוֹלָם and חֶסֶד
  rationale: A second short sentence makes the exhortation easier to follow without merging the two blessings.
