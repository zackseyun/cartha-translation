translation:
  language: en
  text: Hold tightly to him and do not turn away, so that in the end you may be raised to honor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “you may grow great in the end.” The Hebrew can mean becoming great, while the Greek parallel speaks of being increased.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Cling to him
  simplified_phrase: Hold tightly to him
  preserved_meaning: Remain closely and steadfastly attached to God.
  reasoning_layer_used: The lexical decision for הִדָּבֵק and its Greek parallel.
  rationale: “Hold tightly” makes the image of close attachment immediately clear.
- pob_phrase: you may be exalted
  simplified_phrase: you may be raised to honor
  preserved_meaning: The promised outcome is elevation or honor rather than merely material prosperity.
  reasoning_layer_used: The lexical and theological decisions for תִּגְדַּל.
  rationale: “Raised to honor” explains the less familiar sense of “exalted” without implying wealth.
- pob_phrase: in your latter end
  simplified_phrase: in the end
  preserved_meaning: The promise concerns the person’s final or ultimate outcome.
  reasoning_layer_used: The lexical decision for בְּאַחֲרִיתֶךָ.
  rationale: “In the end” is natural English and does not narrowly define the final outcome.
translation_notes:
  risk_flags:
  - risk: “Raised to honor” may sound more specific than the Hebrew idea of becoming great or increased.
    mitigation: The footnote preserves the broader lexical alternative.
  - risk: “In the end” can remain unclear about whether it means life’s end or ultimate outcome.
    mitigation: The wording preserves the source’s documented ambiguity rather than resolving it.
