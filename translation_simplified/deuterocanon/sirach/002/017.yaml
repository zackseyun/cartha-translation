translation:
  language: en
  text: Those who fear Yahweh will make their hearts ready. In his presence, they will humble their spirits.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel says “their souls,” but the Hebrew says “their spirits.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: will prepare their hearts
  simplified_phrase: will make their hearts ready
  preserved_meaning: They ready their inner lives to follow Yahweh faithfully.
  reasoning_layer_used: Hebrew lexical decision for יָכִינוּ לְבָבָם
  rationale: “Make ready” expresses the stated lexical alternative in more familiar English while preserving the heart image.
- pob_phrase: before him
  simplified_phrase: in his presence
  preserved_meaning: Their humility is directed toward Yahweh as they stand before him.
  reasoning_layer_used: Hebrew lexical decision for וּלְפָנָיו
  rationale: “In his presence” makes the relational sense of “before him” immediately clear.
- pob_phrase: and before him they will humble their spirits
  simplified_phrase: In his presence, they will humble their spirits
  preserved_meaning: They lower their spirits humbly before Yahweh without replacing the Hebrew anthropological term.
  reasoning_layer_used: Hebrew lexical decision for יַכְנִיעוּ רוּחָם
  rationale: A new sentence eases the structure while retaining the distinct spirit language.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “fear Yahweh” to mean only terror.
    mitigation: The established biblical phrase is retained because “revere” would soften the source meaning.
  - risk: “Humble their spirits” is less idiomatic than “humble themselves.”
    mitigation: The wording remains because the Hebrew explicitly names their spirits, with the Greek alternative noted.
