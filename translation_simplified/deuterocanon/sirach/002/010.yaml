translation:
  language: en
  text: 'Look back at the people of earlier generations and consider: Has anyone believed in Yahweh and been put to shame? Has anyone trusted him and been abandoned? Has anyone called on him and received no answer?[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Greek: “Has anyone remained in fear of him and been abandoned?” The surviving Hebrew reads “trusted him and been abandoned.”'
    reason: alternative_reading
  - marker: b
    text: 'Greek: “Has anyone called on him and been overlooked?” The Hebrew reads “called on him and received no answer.”'
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Look to the generations of old and see
  simplified_phrase: Look back at the people of earlier generations and consider
  preserved_meaning: The readers are directed to examine the experience of people who lived before them.
  reasoning_layer_used: Lexical rationale for הַבִּיטוּ and לְדוֹרוֹת רִאשׂוֹנִים
  rationale: “Look back” makes the historical direction clear, while “consider” expresses the call to learn from it.
- pob_phrase: who called on him and was not answered?
  simplified_phrase: Has anyone called on him and received no answer?
  preserved_meaning: The question asks whether an appeal to God ever went unanswered.
  reasoning_layer_used: Lexical decision for קָרָא אֵלָיו and וְלֹא נֶעֱנָה
  rationale: The active wording is easier to understand without changing the Hebrew claim.
translation_notes:
  risk_flags:
  - risk: “Look back” may sound less concrete than the Hebrew command to look.
    mitigation: The wording retains the visual image and explicitly points readers toward earlier generations.
  - risk: The Greek differs meaningfully in the second and third questions.
    mitigation: The main text follows the high-confidence Hebrew, and both Greek alternatives remain in footnotes.
