  reasoning_layer_used: POB lexical and theological decisions on אָדָם and בְּיַד
  rationale: “A human being” makes generic “man” immediately clear without changing the contrast.
- pob_phrase: for as his greatness is, so also is his mercy
  simplified_phrase: For his mercy is as great as he is.
  preserved_meaning: Yahweh’s mercy corresponds to his own greatness.
  reasoning_layer_used: POB lexical decision on כְּגָדְלוֹ and חַסְדּוֹ
  rationale: The comparison is recast in ordinary English while retaining its full force.
