translation:
  language: en
  text: Let us fall into Yahweh’s hand[a], not into the hand of a human being. For his mercy[b] is as great as he is.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek reads “hands” in both clauses, while the Hebrew reads the singular “hand,” which is followed here.
    reason: textual_variant
  - marker: b
    text: Or “steadfast love”; the Hebrew word can mean covenant kindness or loyal love, while the Greek reads “mercy.”
    reason: lexical_alternative
