translation:
  language: en
  text: Trust him, and he will hold you up. Make your path through life straight,[a] and place your hope in him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Some translations read this as a promise: “He will make your path straight.” The Hebrew and Greek more likely give a command to the reader.'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: he will uphold you
  simplified_phrase: he will hold you up
  preserved_meaning: God will take hold of and sustain the person who trusts him.
  reasoning_layer_used: POB lexical decision for יַחֲזִיק בְּךָ / ἀντιλήμψεται σου
  rationale: The wording is more familiar while retaining the image of sustaining support.
- pob_phrase: make your ways straight
  simplified_phrase: Make your path through life straight
  preserved_meaning: The reader is commanded to set their course of life in the right direction.
  reasoning_layer_used: POB lexical and theological decisions for יַשֵּׁר אָרְחוֹתֶיךָ / εὐθύνας τὰς ὁδούς σου
  rationale: The life-path metaphor is made immediately understandable without changing the command into a promise.
- pob_phrase: hope in him
  simplified_phrase: place your hope in him
  preserved_meaning: The reader is commanded to rely expectantly on God.
  reasoning_layer_used: POB lexical decision for וְקַוֵּה אֵלָיו / καὶ ἔλπισον ἐπʼ αὐτόν
  rationale: “Place your hope” states the intentional exhortation in natural modern English.
interpretive_expansions:
- pob_phrase: your ways
  rendering: your path through life
  claim: The path refers to a person’s course of life, not a literal road.
  evidence:
  - The POB lexical rationale identifies “ways” as a wisdom metaphor for one’s course of life.
  - The Hebrew and Greek both use common path language in this clause.
  confidence: high
  alternatives_preserved:
  - your ways
  - your paths
translation_notes:
  risk_flags:
  - risk: Changing plural “ways” to singular “path” slightly compresses the source image.
    mitigation: The singular phrase is idiomatic English and still presents the whole course of life as a path.
  - risk: Readers may miss the alternative reading that makes God the subject of the middle clause.
    mitigation: Footnote a preserves that reading while keeping the source-driven imperative in the main text.
