translation:
  language: en
  text: Though he is mortal, he holds on to anger. Who, then, will make atonement for his sins?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Hebrew is difficult and may be corrupt; this translation follows the clear Greek parallel.
    reason: textual_variant
  - marker: b
    text: Or “who will forgive his sins?” The Greek more specifically refers to making atonement.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: He, being flesh, keeps wrath
  simplified_phrase: Though he is mortal, he holds on to anger
  preserved_meaning: A frail human being continues to harbor anger.
  reasoning_layer_used: Greek parallel and lexical and theological decisions for σὰρξ and διατηρεῖ μῆνιν
  rationale: “Mortal” expresses the contextual force of flesh without implying that the body is inferior, while “holds on” preserves continued anger.
- pob_phrase: who then will make atonement for his sins?
  simplified_phrase: Who, then, will make atonement for his sins?
  preserved_meaning: His persistent anger raises the question of atonement for his own sins.
  reasoning_layer_used: Lexical and theological decision for ἐξιλάσεται
  rationale: The theological term remains because “forgive” does not convey the full Greek sense.
interpretive_expansions:
- pob_phrase: being flesh
  rendering: Though he is mortal
  claim: Here “flesh” points to human frailty and mortality.
  evidence:
