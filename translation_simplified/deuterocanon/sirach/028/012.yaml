translation:
  language: en
  text: A coal was in front of him. He blew on it, and it burst into flame.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek reads, “If you blow on a spark, it will catch fire; if you spit on it, it will go out. Both come from your mouth.” The Hebrew is shorter and is followed here.
    reason: alternative_reading
