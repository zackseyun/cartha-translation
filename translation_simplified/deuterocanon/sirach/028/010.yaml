  simplified_phrase: Fuel makes a fire burn
  preserved_meaning: The fuel governs how the fire burns.
  reasoning_layer_used: Lexical decisions for ὕλην and ἐκκαυθήσεται
  rationale: The direct wording preserves the image of fuel feeding fire.
- pob_phrase: according to a man's strength, so will his wrath be
  simplified_phrase: a man’s strength determines the force of his wrath
  preserved_meaning: A man’s capacity corresponds to the scale of his wrath.
  reasoning_layer_used: Lexical decision for ἰσχὺν and theological decision on the generic masculine
  rationale: The comparison becomes natural English while retaining “man” and “wrath.”
- pob_phrase: according to his wealth he will raise up his anger
  simplified_phrase: His wealth makes his anger rise
  preserved_meaning: His material resources intensify his anger.
  reasoning_layer_used: Lexical decisions for πλοῦτον, ἀνυψώσει, and ὀργήν
  rationale: This preserves the rising image and distinguishes anger from wrath.
