translation:
  language: en
  text: Fuel makes a fire burn. In the same way, a man’s strength determines the force of his wrath. His wealth makes his anger rise, and the more intense the conflict, the more it blazes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The final “it” may refer to the anger or more broadly to the conflict. The phrase may also mean, “the more severe the conflict, the more it blazes.”
    reason: lexical_alternative
