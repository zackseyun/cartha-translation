translation:
  language: en
  text: Forgive your neighbor for wronging you. Then, when you pray, your own sins will be released.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek says that your sins will be “loosed.” “Released” preserves this image; “forgiven” is another possible translation.
    reason: lexical_alternative
  - marker: b
    text: The surviving Hebrew text supplied for this verse contains different material, so this translation follows the ancient Greek text.
    reason: textual_variant
simplification_decisions:
- pob_phrase: Forgive your neighbor the wrong he has done
  simplified_phrase: Forgive your neighbor for wronging you
  preserved_meaning: The command remains to forgive a personal offense committed by one’s neighbor.
  reasoning_layer_used: POB lexical decisions for ἄφες, ἀδίκημα, and τῷ πλησίον σου
  rationale: The direct wording is easier to understand while preserving the offender, offense, and command to forgive.
- pob_phrase: and then, when you pray
  simplified_phrase: Then, when you pray
  preserved_meaning: Prayer follows the act of forgiving one’s neighbor.
  reasoning_layer_used: POB lexical decision for δεηθέντος σου
  rationale: A new sentence makes the sequence clear without changing the connection.
- pob_phrase: your sins will be released
  simplified_phrase: your own sins will be released
  preserved_meaning: The person who forgives is promised release from their sins.
  reasoning_layer_used: POB lexical decision for αἱ ἁμαρτίαι σου λυθήσονται
  rationale: “Own” clarifies the contrast while “released” retains the Greek metaphor.
translation_notes:
  risk_flags:
  - risk: Readers may take “released” as vague rather than as an image of forgiveness.
    mitigation: Footnote a explains the Greek image and gives “forgiven” as an alternative.
  - risk: The supplied Hebrew witness does not correspond to this verse’s traditional sense.
    mitigation: Footnote b states that the ancient Greek text is the translation’s primary basis.
