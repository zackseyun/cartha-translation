translation:
  language: en
  text: Keep your final outcome in mind.[a] Stop acting with hostility. Remember decay and death,[b] and keep obeying the commandments.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek literally says “the last things,” which may refer to your death or your ultimate outcome.
    reason: lexical_alternative
  - marker: b
    text: The available Hebrew line contains a different saying, apparently because of a source-location mismatch; this verse follows the Greek.
    reason: textual_variant
simplification_decisions:
- pob_phrase: Remember the end
  simplified_phrase: Keep your final outcome in mind
  preserved_meaning: The reader is told to remain mindful of death or the ultimate result of life.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: “Final outcome” makes the broad sense of “the end” easier to grasp without limiting it to death alone.
- pob_phrase: stop being hostile
  simplified_phrase: Stop acting with hostility
  preserved_meaning: The command calls for an end to ongoing hostile conduct or enmity.
  reasoning_layer_used: POB lexical decision for παῦσαι ἐχθραίνων
  rationale: The active wording clearly presents hostility as conduct that must cease.
- pob_phrase: remain in the commandments
  simplified_phrase: keep obeying the commandments
  preserved_meaning: The reader must persist in faithful adherence to the commandments.
  reasoning_layer_used: POB lexical decisions for ἔμμενε and ἐντολαῖς
  rationale: “Keep obeying” states the intended persistence in natural modern English.
translation_notes:
  risk_flags:
  - risk: “Final outcome” could be read more broadly than personal death.
    mitigation: Footnote a preserves both senses documented by the POB.
  - risk: The supplied Hebrew does not correspond to this Greek-based verse.
    mitigation: Footnote b identifies the source mismatch and the use of the Greek witness.
