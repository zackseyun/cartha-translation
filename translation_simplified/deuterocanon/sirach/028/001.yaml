translation:
  language: en
  text: Whoever takes revenge will face vengeance from the Lord. The Lord will surely hold that person’s sins against them.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Hebrew line has different content, so this verse follows the Greek witness.
    reason: textual_variant
  - marker: b
    text: Or “will keep that person’s sins stored up”; the Greek repeats the verb for emphasis.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The one who takes vengeance
  simplified_phrase: Whoever takes revenge
  preserved_meaning: Anyone who habitually seeks personal revenge is in view.
  reasoning_layer_used: POB lexical decision for ὁ ἐκδικῶν
  rationale: The generic warning is clearer in ordinary English with “whoever.”
- pob_phrase: will find vengeance from the Lord
  simplified_phrase: will face vengeance from the Lord
  preserved_meaning: The person will encounter the Lord’s answering vengeance.
  reasoning_layer_used: POB lexical decisions for παρὰ Κυρίου and εὑρήσει ἐκδίκησιν
  rationale: “Face” expresses the consequence naturally while preserving the repeated vengeance image.
- pob_phrase: he will surely keep his sins in mind
  simplified_phrase: The Lord will surely hold that person’s sins against them
  preserved_meaning: The sins remain charged against the person under the Lord’s judgment.
  reasoning_layer_used: POB rationale for διατηρῶν διατηρήσει
  rationale: The wording makes ongoing retention against the sinner clear rather than suggesting mere recollection.
interpretive_expansions:
- pob_phrase: he will surely keep his sins in mind
  rendering: The Lord will surely hold that person’s sins against them
  claim: The Lord retains the revenge-seeker’s sins against that person.
  evidence:
  - The POB rationale says the sins are retained against the person, not merely remembered mentally.
  - The preceding phrase names the Lord as the source of vengeance.
  - The repeated Greek verb supplies the force represented by “surely.”
  confidence: high
  alternatives_preserved:
  - The subject could remain pronominal as “he.”
  - The action may be rendered “keep the sins stored up.”
