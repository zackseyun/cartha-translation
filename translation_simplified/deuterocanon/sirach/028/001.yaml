  risk_flags:
  - risk: The supplied Hebrew text does not match this verse’s Greek content.
    mitigation: The main text follows the POB’s Greek-based decision, and footnote a states the mismatch.
  - risk: Naming the Lord in the second sentence resolves an implicit Greek subject.
    mitigation: The expansion follows the POB rationale and is documented without adding a new theological claim.
