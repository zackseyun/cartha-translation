translation:
  language: en
  text: It will never gain power over those who honor God,[a] and its flame will not burn them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “seize those devoted to God.” The Greek verb can mean taking hold of someone or gaining mastery over them.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: overpower the godly
  simplified_phrase: gain power over those who honor God
  preserved_meaning: The destructive tongue cannot gain mastery over people devoted to God.
  reasoning_layer_used: POB lexical decisions for κρατήσῃ and εὐσεβῶν
  rationale: This explains “godly” in common language while preserving the verb’s sense of hostile control.
- pob_phrase: they will not be burned in its flame
  simplified_phrase: its flame will not burn them
  preserved_meaning: They will not suffer burning from the destructive force pictured as flame.
  reasoning_layer_used: POB lexical and theological decisions for φλογί, καήσονται, and αὐτῆς
  rationale: The active sentence is easier to read and keeps the vivid flame image.
