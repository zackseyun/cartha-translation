translation:
  language: en
  text: He shows no mercy to another man—someone just like himself. Yet he asks for his own sins to be forgiven?[b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Cairo Geniza Hebrew line does not appear to belong to this verse, so the translation follows the Greek witness.
    reason: textual_variant
  - marker: b
    text: More literally, “Yet does he pray concerning his sins?” The Greek leaves forgiveness implied.
    reason: lexical_alternative
