- pob_phrase: He has no mercy on a man like himself
  simplified_phrase: He shows no mercy to another man—someone just like himself
  preserved_meaning: He withholds mercy from a fellow human being like himself.
  reasoning_layer_used: Greek lexical decision for ἐπʼ ἄνθρωπον ὅμοιον αὐτῷ and οὐκ ἔχει ἔλεος
  rationale: The active wording and brief restatement make the contrast easier to grasp without weakening “mercy” or “like himself.”
- pob_phrase: yet he asks for his own sins to be forgiven?
  simplified_phrase: Yet he asks for his own sins to be forgiven?
  preserved_meaning: The man seeks pardon while refusing mercy to another.
  reasoning_layer_used: Greek lexical decision for δεῖται and its contextual implication
  rationale: A separate sentence makes the rhetorical contradiction immediately clear while preserving the POB wording.
