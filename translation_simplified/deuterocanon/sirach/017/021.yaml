translation:
  language: en
  text: Return to the Lord and leave sins behind. Come before him in prayer,[a] and reduce what causes stumbling.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “pray before his face,” an idiom for approaching God directly in his presence.
    reason: lexical_alternative
  - marker: b
    text: Or “lessen stumbling” or “reduce the stumbling block.” The Greek can refer to an obstacle or cause of stumbling.
    reason: alternative_reading
