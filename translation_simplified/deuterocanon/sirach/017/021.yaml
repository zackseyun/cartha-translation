  preserved_meaning: The reader must turn back to the Lord and decisively separate from sins.
  reasoning_layer_used: POB lexical decisions for Ἐπίστρεφε, ἐπὶ Κύριον, ἀπόλειπε, and ἁμαρτίας
  rationale: The wording is already clear and retains both the relational return and plural “sins.”
- pob_phrase: pray before his face
  simplified_phrase: Come before him in prayer
  preserved_meaning: The person approaches the Lord directly in his presence to petition him.
  reasoning_layer_used: POB lexical and theological decision for κατὰ πρόσωπον
  rationale: The natural English expresses the idiom’s meaning while the footnote preserves its face-language.
- pob_phrase: lessen stumbling
