translation:
  language: en
  text: Who in the realm of the dead[a] will sing praise to the Most High in place of the living who give thanks?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “in Hades,” meaning the realm of the dead; it may also be rendered “in Sheol” or “in the grave.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: in Hades
  simplified_phrase: in the realm of the dead
  preserved_meaning: Hades refers here to the abode of the dead, not specifically to final punishment.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The explanatory phrase is clearer to readers unfamiliar with “Hades.”
- pob_phrase: instead of the living
  simplified_phrase: in place of the living
  preserved_meaning: The dead are contrasted with the living, who can praise and thank God.
  reasoning_layer_used: POB lexical decision for ἀντὶ ζώντων
  rationale: “In place of” expresses the substitution contrast in more natural English.
translation_notes:
  risk_flags:
  - risk: Readers may understand the realm of the dead as a reference to hell or final punishment.
    mitigation: The main text and footnote define Hades neutrally as the realm of the dead.
