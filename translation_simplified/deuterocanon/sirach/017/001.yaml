translation:
  language: en
  text: The Lord created man[a] from the earth and sent him back to it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “man” represents humanity as a whole; it can also be translated “humankind” or “a human being.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: returned him to it again
  simplified_phrase: sent him back to it
  preserved_meaning: The Lord causes man to return to the earth from which he came.
  reasoning_layer_used: Lexical decision for ἀπέστρεψεν and πάλιν
  rationale: “Sent him back” expresses the return in direct, natural English while preserving the motion and the force of “again.”
- pob_phrase: man
  simplified_phrase: man[a]
  preserved_meaning: The singular human represents humanity and retains the likely Adamic resonance.
  reasoning_layer_used: Theological decision on the representative scope of ἄνθρωπον
  rationale: The main text keeps POB’s source-driven choice, while the note prevents readers from taking it as a reference only to males.
