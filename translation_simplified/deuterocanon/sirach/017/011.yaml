translation:
  language: en
  text: He established an everlasting covenant[a] with them and made his judgments[b] known to them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A covenant is a binding relationship established by a solemn promise.
    reason: simplification_note
  - marker: b
    text: Here “judgments” can also mean “ordinances” or “decrees.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: showed them his judgments
  simplified_phrase: made his judgments known to them
  preserved_meaning: He communicated his judgments to them.
  reasoning_layer_used: The lexical decision for ὑπέδειξεν allows “made known” while retaining “judgments” for κρίματα.
  rationale: The recast phrase is clearer in modern English without narrowing what the judgments include.
interpretive_expansions:
- pob_phrase: showed them his judgments
  rendering: made his judgments known to them
  claim: “Showed” means that he communicated his judgments so they could know them.
  evidence:
  - The lexical audit lists “made known” as a possible rendering of ὑπέδειξεν.
  - The parallel covenant context concerns God disclosing his judgments.
  confidence: high
  alternatives_preserved:
  - showed them his judgments
