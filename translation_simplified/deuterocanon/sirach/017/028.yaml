- pob_phrase: From the dead ... praise perishes
  simplified_phrase: A dead person’s praise ... comes to an end
  preserved_meaning: Death ends a person’s ability to offer praise.
  reasoning_layer_used: Lexical decisions for ἀπὸ νεκροῦ and ἀπόλλυται
  rationale: The active wording makes the relationship clear while retaining the grave finality of “perishes.”
- pob_phrase: one who is alive and well
  simplified_phrase: whoever is alive and well
  preserved_meaning: Any living person in sound condition can praise the Lord.
  reasoning_layer_used: Lexical decision for ζῶν καὶ ὑγιὴς
  rationale: “Whoever” makes the generic contrast natural without changing its scope.
