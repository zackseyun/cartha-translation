translation:
  language: en
  text: A dead person’s praise[a] comes to an end, as though that person no longer existed. But whoever is alive and well will praise the Lord.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word translated “praise” can also mean “thanksgiving” or “confession,” but its parallel with “will praise the Lord” favors thankful praise here.
    reason: lexical_alternative
