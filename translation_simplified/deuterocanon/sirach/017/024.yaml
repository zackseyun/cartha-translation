translation:
  language: en
  text: Thanksgiving[a] does not come from a dead person, who is like someone no longer present. But a person who is alive and well will praise the Lord.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “confession”; the Greek word can mean acknowledgment or thankful praise. Here “thanksgiving” fits the contrast with praising the Lord.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: From the dead ... thanksgiving perishes
  simplified_phrase: Thanksgiving does not come from a dead person
  preserved_meaning: The dead are no longer a source of thanksgiving.
  reasoning_layer_used: POB lexical decisions for ἀπὸ νεκροῦ, ἀπόλλυται, and ἐξομολόγησις
  rationale: This states the source relationship in ordinary English without implying that thanksgiving dies at the same moment as the person.
- pob_phrase: as from one who no longer exists
  simplified_phrase: who is like someone no longer present
  preserved_meaning: The dead person is rhetorically compared to someone absent from earthly life.
  reasoning_layer_used: POB theological decision on the rhetorical force of ὡς μηδὲ ὄντος
  rationale: “No longer present” preserves the comparison while reducing the risk of a doctrinal claim about existence after death.
- pob_phrase: but one who is alive and well
  simplified_phrase: But a person who is alive and well
  preserved_meaning: The contrast concerns a living, healthy person who can praise God.
  reasoning_layer_used: POB lexical decisions for ζῶν and ὑγιής
  rationale: Naming the subject as a person makes the contrast immediately clear.
interpretive_expansions:
- pob_phrase: as from one who no longer exists
  rendering: who is like someone no longer present
  claim: The comparison concerns the dead person’s absence from active earthly life, not a denial of all postmortem existence.
  evidence:
  - The POB theological decision identifies the phrase as a rhetorical comparison.
  - The immediate contrast is between thanksgiving from the dead and praise from the living.
  confidence: high
  alternatives_preserved:
  - someone who no longer exists
translation_notes:
  risk_flags:
