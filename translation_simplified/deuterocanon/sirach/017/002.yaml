  simplified_phrase: a limited number of days and an appointed time
  preserved_meaning: Human life has a counted limit and an allotted time.
  reasoning_layer_used: Lexical decisions for ἡμέρας ἀριθμοῦ and καιρόν
  rationale: “Limited” states the finite sense clearly, while “appointed” preserves the idea of an allotted time.
- pob_phrase: and he gave them authority
  simplified_phrase: He also gave them authority
  preserved_meaning: God grants humanity delegated authority rather than mere physical power.
  reasoning_layer_used: Lexical decision for ἐξουσίαν
  rationale: A new sentence improves readability without weakening the source idea of granted authority.
- pob_phrase: over the things on it
  simplified_phrase: over the things on the earth
  preserved_meaning: Humanity receives authority over earthly creatures and things, not absolute ownership of the planet.
  reasoning_layer_used: Lexical and theological decisions for τῶν ἐπ᾿ αὐτῆς
  rationale: Naming the likely referent makes the elliptical phrase understandable, while the note preserves the Greek wording.
