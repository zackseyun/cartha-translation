  preserved_meaning: God actively oversees the host belonging to the heavenly realm.
  reasoning_layer_used: POB lexical decisions for δύναμιν and ὕψους
  rationale: This natural phrase preserves the cosmic sense without introducing an unsupported plural location.
- pob_phrase: all men
