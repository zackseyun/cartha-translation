  preserved_meaning: The moon’s changing phases inspire reverent awe.
  reasoning_layer_used: POB lexical decision for מה נורא and בהשתנותו
  rationale: The finite clause is easier to understand while retaining both change and awe.
- pob_phrase: A vessel of the host on high
  simplified_phrase: A vessel of heaven’s host
  preserved_meaning: The moon is pictured as one object belonging to the heavenly host.
  reasoning_layer_used: POB lexical and theological decisions for כלי צבא and the cosmic context
  rationale: “Heaven’s host” makes the elevated setting clear without resolving the uncertain metaphor.
- pob_phrase: from the expanse of the sky is its shining
  simplified_phrase: it shines from the expanse of the sky
  preserved_meaning: The moon’s radiance comes from the spread-out sky.
  reasoning_layer_used: POB lexical decisions for מרצף רקיע and מזהירתו
  rationale: A direct verb replaces the difficult verbless construction while preserving the sky image.
