translation:
  language: en
  text: Month by month it renews itself. How awe-inspiring it is as it changes![a] A vessel of heaven’s host,[b][c] it shines from the expanse of the sky.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel reads, “Month by month, according to its name, it increases wondrously as it changes.”
    reason: alternative_reading
  - marker: b
    text: The Hebrew in this part of the verse is difficult and textually uncertain, but it generally describes the moon as belonging to the heavenly host and shining from the sky.
    reason: textual_variant
  - marker: c
    text: The unusual Hebrew expression may instead mean “harp of the heights.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: how awe-inspiring it is in its changing
