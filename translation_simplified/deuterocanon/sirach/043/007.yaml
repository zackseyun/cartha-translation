translation:
  language: en
  text: From them come the appointed time and the seasons fixed by decree. The work he desired is in its cycle.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The second sentence is difficult in Hebrew; the Greek instead describes the moon as a light that marks a festival and wanes as its cycle ends.
    reason: alternative_reading
  - marker: b
    text: The Masada scroll reads, “for great is the Lord who made it,” instead of the difficult wording found in the Cairo Geniza manuscripts.
    reason: textual_variant
simplification_decisions:
- pob_phrase: the fixed seasons by statute
  simplified_phrase: the seasons fixed by decree
  preserved_meaning: The seasons belong to an ordered calendar established by authoritative decree.
  reasoning_layer_used: Lexical decision for וזמני חוק
  rationale: The natural word order retains both fixed times and governing authority.
- pob_phrase: and the work he desired is in its cycle
  simplified_phrase: The work he desired is in its cycle.
  preserved_meaning: The creator’s intended work remains connected with its recurring cosmic cycle.
  reasoning_layer_used: Lexical and theological decisions for וחפץ עשיו בתקופתו
  rationale: A separate sentence improves readability while preserving the uncertain relation to the cycle.
