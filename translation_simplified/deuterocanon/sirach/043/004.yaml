translation:
  language: en
  text: The sun is like a blazing furnace, working with intense heat.[a] It scorches the mountains three times over,[b] breathes out fiery vapor, and flashes rays that dim the eyes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew here is difficult and does not fully match the Greek; this translation follows the Hebrew as primary and uses the Greek to clarify uncertain phrases.
    reason: textual_variant
  - marker: b
    text: “Three times over” appears clearly in the Greek witness but is not clearly preserved in the surviving Hebrew.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: in the works of heat
  simplified_phrase: working with intense heat
  preserved_meaning: The furnace image remains active and emphasizes powerful heat.
  reasoning_layer_used: POB lexical decision on מחם מצוק with the Greek parallel
  rationale: This recasts an opaque phrase in ordinary English without hiding the source difficulty.
- pob_phrase: breathing out fiery vapors, and flashing rays
  simplified_phrase: breathes out fiery vapor, and flashes rays
  preserved_meaning: The sun still exhales burning vapor and sends out bright rays as distinct images.
  reasoning_layer_used: POB lexical decisions using the Hebrew and Greek parallel
  rationale: Finite verbs make the actions easier to follow while preserving both images.
- pob_phrase: it dims the eyes
  simplified_phrase: rays that dim the eyes
  preserved_meaning: The sun’s radiance impairs sight without implying complete blindness.
  reasoning_layer_used: POB lexical decision on ומנורה תכוה עין / ἀμαυροῖ ὀφθαλμούς
  rationale: Naming the rays as the immediate cause makes the sentence clearer without strengthening the effect.
translation_notes:
  risk_flags:
  - risk: “Working with intense heat” makes a difficult Hebrew phrase sound smoother than the source warrants.
    mitigation: Footnote a states the textual difficulty and the Greek’s clarifying role.
  - risk: “Three times over” depends on the Greek rather than clearly surviving Hebrew.
    mitigation: Footnote b preserves the witness distinction.
