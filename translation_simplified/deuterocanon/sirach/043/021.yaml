translation:
  language: en
  text: It scorches what grows on the mountains with drought.[b] It scorches the plants in the pastures with flame.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The ancient Greek version instead says, “It consumes mountains, burns up the wilderness, and destroys the green grass like fire.”
    reason: alternative_reading
  - marker: b
    text: The Hebrew word means dryness and may also be translated “with dryness.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the produce of the mountains
  simplified_phrase: what grows on the mountains
  preserved_meaning: The phrase still refers broadly to the vegetation the mountain land produces.
  reasoning_layer_used: POB lexical decision for יבול
  rationale: This removes the agricultural sound of “produce” while keeping its broad sense.
- pob_phrase: and the pasture of plants with flame
  simplified_phrase: It scorches the plants in the pastures with flame
  preserved_meaning: The second line still portrays flame scorching vegetation in grazing land.
  reasoning_layer_used: POB lexical decisions for נוה, צמחים, and בלהבה
  rationale: A complete second sentence makes the poetic parallel clear in ordinary English.
interpretive_expansions:
