translation:
  language: en
  text: The Lord who made the moon is great.[a] By his word, he speeds it along its course.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew from Masada preserves only the first sentence; “the moon” is the heavenly body meant by “it” in this context.
    reason: textual_variant
  - marker: b
    text: The second sentence is difficult in the Cairo Hebrew; the Greek supports this meaning. It may also be translated, “At his command, he directs its course.”
    reason: lexical_alternative
