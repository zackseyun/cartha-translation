translation:
  language: en
  text: The sun’s appearance and heat reveal how awe-inspiring the works of the LORD are.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew wording is compressed. The Greek parallel instead speaks of the sun appearing at its rising and proclaiming, then calls it a marvelous instrument, the work of the Most High.
    reason: alternative_reading
