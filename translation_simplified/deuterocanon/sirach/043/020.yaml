translation:
  language: en
  text: The cold from the north wind returns.[a] Like rot, it freezes its spring. Ice settles over every still body of water,[b] and the reservoir wears it like a breastplate.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says, “like rot, it freezes its spring,” a difficult image; the Greek parallel instead says that ice freezes from water.
    reason: alternative_reading
  - marker: b
    text: The Hebrew wording is uncertain here; the Greek parallel supports the picture of ice settling over gathered water.
    reason: textual_variant
simplification_decisions:
- pob_phrase: The cold of the north wind returns
  simplified_phrase: The cold from the north wind returns
  preserved_meaning: The cold associated with the north wind comes again.
  reasoning_layer_used: POB lexical decisions for צִנַּת, רוּחַ צָפוֹן, and יָשִׁיב
  rationale: “From” clearly identifies the cold, rather than the wind itself, as returning.
- pob_phrase: every standing body of water
  simplified_phrase: every still body of water
  preserved_meaning: The ice covers water gathered in a fixed place.
  reasoning_layer_used: POB lexical decision for מַעֲמַד מַיִם
  rationale: “Still body of water” is more natural while retaining the collected-water sense.
- pob_phrase: the reservoir puts on armor like a breastplate
  simplified_phrase: the reservoir wears it like a breastplate
  preserved_meaning: Ice covers the water like protective armor worn on the chest.
  reasoning_layer_used: POB lexical decisions for וּכְשִׁרְיוֹן and יִלְבַּשׁ מִקְוֶה
  rationale: The recast wording preserves both the clothing metaphor and the breastplate image.
interpretive_expansions:
- pob_phrase: Over every standing body of water it settles
  rendering: Ice settles over every still body of water
  claim: The substance settling over the water is ice.
  evidence:
  - The Greek parallel explicitly describes ice forming from water and settling over gathered water.
  - The immediate context describes freezing caused by the north wind.
  confidence: high
  alternatives_preserved:
  - Footnote b retains the uncertainty of the Hebrew wording.
  external_witnesses:
  - Greek parallel
translation_notes:
  risk_flags:
  - risk: The Hebrew image “like rot” remains obscure to modern readers.
    mitigation: The main text preserves the primary Hebrew reading, while footnote a gives the clearer Greek parallel.
  - risk: Naming ice makes the unclear subject in the POB explicit.
    mitigation: The freezing context and Greek parallel strongly support this clarification, while footnote b preserves the uncertainty.
