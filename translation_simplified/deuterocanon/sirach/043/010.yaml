translation:
  language: en
  text: At his word, the decree remains firm,[a] and they never fail in their watches.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Masada manuscript reads, “At the word of the Lord,” making the divine reference explicit.
    reason: textual_variant
  - marker: b
    text: Or “they never grow weak at their stations”; the Hebrew verb is uncertain, and the Greek supports the sense of not weakening or failing.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the decree stands
  simplified_phrase: the decree remains firm
  preserved_meaning: The authoritative order continues securely in force.
  reasoning_layer_used: POB lexical decisions for יעמד and חק
  rationale: “Remains firm” clearly conveys the decree’s continuing force.
- pob_phrase: they do not fail in their watches
  simplified_phrase: they never fail in their watches
  preserved_meaning: They remain steadfast throughout their watches or stations.
  reasoning_layer_used: POB lexical decisions for ולא ישח and באשמרותם
  rationale: “Never fail” expresses emphatic steadfastness without adding a specific duty.
translation_notes:
  risk_flags:
  - risk: “Watches” may be understood only as periods of guard duty.
    mitigation: Footnote b preserves the broader alternative “stations.”
  - risk: The referent of “his” remains implicit.
    mitigation: Footnote a records the Masada reading that explicitly names the Lord.
