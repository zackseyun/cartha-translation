translation:
  language: en
  text: The Lord inspires overwhelming awe, and his words[a] are marvelous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel reads, “his dominion is wondrous,” or “his rule is marvelous,” instead of the Hebrew “his words are marvelous.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: The Lord is exceedingly awesome
  simplified_phrase: The Lord inspires overwhelming awe
  preserved_meaning: The Lord evokes the intense reverence and fear expressed by the doubled Hebrew intensifier.
  reasoning_layer_used: Hebrew lexical decision for נורא and מאד מאד
  rationale: The recast wording makes the biblical sense of “awesome” clear while preserving its strong intensity.
- pob_phrase: his words are wondrous
  simplified_phrase: his words are marvelous
  preserved_meaning: The Lord’s words are extraordinary and evoke wonder.
  reasoning_layer_used: Hebrew lexical decision for ונפלאות דבריו
  rationale: “Marvelous” is more familiar than “wondrous” without changing the Hebrew-based reading.
translation_notes:
  risk_flags:
  - risk: Modern readers may hear “awe” without the Hebrew word’s element of fear.
    mitigation: “Overwhelming awe” retains gravity without making the Lord sound merely threatening.
  - risk: The Greek parallel refers to the Lord’s dominion rather than his words.
    mitigation: The main text follows the extant Hebrew, while the footnote preserves the significant alternative.
