translation:
  language: en
  text: When you praise the Lord,[a] raise your voice as much as you can, because there is still more.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says, “for he surpasses still,” explicitly stating that the Lord is beyond all praise; the Hebrew simply says, “there is still more.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: As you exalt the Lord
  simplified_phrase: When you praise the Lord
  preserved_meaning: The worshipers honor the Lord as great through praise.
  reasoning_layer_used: Hebrew lexical decision supported by the Greek parallel
  rationale: “Praise” makes the intended worship sense of “exalt” immediately clear.
- pob_phrase: lift up your voice
  simplified_phrase: raise your voice
  preserved_meaning: The concrete image of giving audible praise remains.
  reasoning_layer_used: Hebrew idiom and POB lexical alternatives
  rationale: “Raise your voice” is common English while preserving the source image.
- pob_phrase: for there is still more
  simplified_phrase: because there is still more
  preserved_meaning: Even the fullest praise does not exhaust what may be said of the Lord.
  reasoning_layer_used: Hebrew primacy and POB theological decision
  rationale: “Because” clarifies the connection without resolving the Hebrew’s deliberate brevity.
translation_notes:
  risk_flags:
  - risk: “Praise” is less explicitly vertical than the image in “exalt.”
    mitigation: The Hebrew and Greek reasoning identifies exaltation here as praise, while “raise your voice” preserves the verse’s concrete image.
  - risk: “There is still more” may remain unclear to some readers.
    mitigation: The footnote gives the Greek explanation without replacing the preferred concise Hebrew reading.
