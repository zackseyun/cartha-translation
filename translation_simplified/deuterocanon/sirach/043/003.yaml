translation:
  language: en
  text: When the sun blazes, it makes the world boil. Who can endure its sword-like heat?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew says “its sword”; the Greek parallel says “its burning heat.”
    reason: alternative_reading
  - marker: b
    text: The older Masada copy is fragmentary here, so the wording follows the Cairo Geniza Hebrew, checked against the Greek.
    reason: textual_variant
simplification_decisions:
- pob_phrase: At its shining
  simplified_phrase: When the sun blazes
  preserved_meaning: The sun shines with intense brightness and heat.
  reasoning_layer_used: Hebrew lexical decision for בהצהירו and the immediate solar context
  rationale: “Blazes” naturally combines the Hebrew image of bright shining with its intense-heat context.
- pob_phrase: before its sword who can endure?
  simplified_phrase: Who can endure its sword-like heat?
  preserved_meaning: The sun’s heat strikes with the destructive force of a sword.
  reasoning_layer_used: Hebrew lexical decision for חרבו, controlled by the Greek parallel
  rationale: This keeps the Hebrew sword image while making its reference to the sun’s heat clear.
interpretive_expansions:
- pob_phrase: its
  rendering: the sun
  claim: The pronoun refers to the sun.
  evidence:
  - The surrounding passage describes the sun.
  - The verse speaks of blazing radiance and extreme heat.
  confidence: high
- pob_phrase: its sword
  rendering: its sword-like heat
  claim: The sword pictures the sun’s cutting, destructive heat.
  evidence:
  - The Hebrew preserves the explicit sword metaphor.
  - The Greek parallel renders the same phrase as burning heat.
  confidence: high
  alternatives_preserved:
  - its sword
  external_witnesses:
  - Greek parallel
translation_notes:
  risk_flags:
  - risk: “Sword-like heat” interprets rather than reproduces the Hebrew metaphor literally.
    mitigation: The main text retains the sword image, and footnote a gives the literal Hebrew wording.
