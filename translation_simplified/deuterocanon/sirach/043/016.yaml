translation:
  language: en
  text: At the sound of his thunder, the earth twists and shakes. Fierce winds from the north bring storm and tempest.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel reads, “When he appears, the mountains will shake; at his will the south wind blows.” This differs substantially from the surviving Hebrew.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the earth writhes
  simplified_phrase: the earth twists and shakes
  preserved_meaning: The earth responds with vivid, convulsive motion.
  reasoning_layer_used: The lexical decision for יחיל preserves both bodily imagery and trembling.
  rationale: The paired common verbs make the image immediately understandable without flattening it to mere trembling.
- pob_phrase: the blasts of the north
  simplified_phrase: fierce winds from the north
  preserved_meaning: Violent wind comes from the north.
  reasoning_layer_used: The lexical decisions identify זלעפות as violent blasts and צפון as meteorological north.
  rationale: “Fierce winds” is clearer to modern readers than the less familiar phrase “blasts of the north.”
- pob_phrase: are storm and tempest
  simplified_phrase: bring storm and tempest
  preserved_meaning: The northern winds produce violent storm conditions.
  reasoning_layer_used: The lexical decisions preserve two intensifying terms for severe weather.
  rationale: The active wording states the relationship naturally while retaining both storm images.
translation_notes:
  risk_flags:
  - risk: “Twists and shakes” may suggest two separate actions rather than one convulsive image.
    mitigation: The coordinated verbs jointly convey the documented range of writhing and trembling.
  - risk: The Greek parallel differs substantially from the Hebrew main text.
    mitigation: The footnote preserves the major alternative while the main text follows the project’s Hebrew priority.
