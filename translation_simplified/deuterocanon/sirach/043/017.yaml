- pob_phrase: At the flash
  simplified_phrase: When there is a flash
  preserved_meaning: A flash accompanies the scattering of the snow without specifying that it is lightning.
  reasoning_layer_used: POB lexical decision for ברשף
  rationale: This makes the timing natural in English while preserving the Hebrew word’s broader sense.
- pob_phrase: he shakes out snow
  simplified_phrase: he shakes the snow loose
  preserved_meaning: He causes the snow to scatter while retaining the source image of shaking or waving.
  reasoning_layer_used: POB lexical decision for יניף
  rationale: The wording makes the physical image easy to picture without reducing it to merely sending snow.
- pob_phrase: like locusts it settles where it stays
  simplified_phrase: it settles like a swarm of locusts
  preserved_meaning: The snow comes to rest in a dense pattern compared to locusts.
  reasoning_layer_used: POB lexical decisions for ארבה, שכן, and דירה
  rationale: This removes an awkward location phrase while preserving both the settling action and the locust image.
