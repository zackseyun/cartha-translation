translation:
  language: en
  text: When there is a flash, he shakes the snow loose, and it settles like a swarm of locusts.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This difficult Hebrew line differs sharply from other ancient witnesses. The Greek speaks instead of the sound of his thunder and a storm from the north; another Hebrew text also mentions thunder.
    reason: textual_variant
