  reasoning_layer_used: Hebrew lexical decision for אַל תִּפּוֹל בְּיֹפִי
  rationale: The recast sentence keeps the image of falling while making the cause and object clear.
- pob_phrase: for what she has
  simplified_phrase: because of what she has
  preserved_meaning: The warning concerns desire motivated by a woman's possessions or advantages.
  reasoning_layer_used: Hebrew lexical and theological decisions for וְעַל יֵש לָהּ
  rationale: “Because of” states the motive more directly without narrowing what she has to money alone.
