translation:
  language: en
  text: The fear of the Lord is greater than everything else. Who can be compared with the one who holds firmly to it[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the one who possesses it.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: surpasses everything
  simplified_phrase: is greater than everything else
  preserved_meaning: The fear of the Lord is superior to all things.
  reasoning_layer_used: Lexical decisions for ὑπὲρ πᾶν and ὑπερέβαλεν, with the theological decision on the gnomic present.
  rationale: The direct comparison states the same general truth in common English.
- pob_phrase: to whom will the one who holds fast to it be compared?
  simplified_phrase: Who can be compared with the one who holds firmly to it?
  preserved_meaning: The person who firmly maintains the fear of the Lord is presented as incomparable.
  reasoning_layer_used: Lexical decisions for κρατέω and the future passive τίνι ὁμοιωθήσεται.
  rationale: The recast question is natural English while preserving the passive comparison and rhetorical force.
translation_notes:
  risk_flags:
  - risk: “Is greater” might suggest physical size rather than superiority.
    mitigation: “Than everything else” and the wisdom context signal supreme value.
