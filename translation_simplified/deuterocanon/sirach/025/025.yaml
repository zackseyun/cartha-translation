translation:
  language: en
  text: A bad wife afflicts her husband like leprosy.[a] He should make her leave his home,[b][c] and then he will be healed of that leprosy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The biblical term translated “leprosy” covers serious skin diseases more broadly than modern leprosy.
    reason: cultural_note
  - marker: b
    text: This may imply divorce, but the Hebrew says more concretely that he should make her leave his home.
    reason: alternative_reading
  - marker: c
    text: 'The Greek version differs: “Do not give water an outlet, nor authority to a wicked wife.” This translation follows the surviving Hebrew text.'
    reason: textual_variant
simplification_decisions:
- pob_phrase: A bad wife is leprosy to her husband
  simplified_phrase: A bad wife afflicts her husband like leprosy
  preserved_meaning: The wife is compared to a severe and offensive disease afflicting her husband.
  reasoning_layer_used: Hebrew metaphor and lexical rationale for צָרַעַת
  rationale: The active comparison makes the metaphor immediately clear while retaining leprosy’s force.
- pob_phrase: let him drive her out of his house
  simplified_phrase: He should make her leave his home
  preserved_meaning: He is directed to remove her from the shared household without specifying a legal divorce.
  reasoning_layer_used: Lexical and theological decision on יְגַרְשֶׁנָּה מִבֵּיתוֹ
  rationale: This uses ordinary English while preserving concrete expulsion rather than importing a legal category.
- pob_phrase: and he will be healed of his leprosy
  simplified_phrase: and then he will be healed of that leprosy
  preserved_meaning: Her removal results in his recovery from the metaphorical affliction.
  reasoning_layer_used: Resultative reading of וְיִתְרַפֵּא and rhetorical repetition
  rationale: “Then” clarifies the result while repeating leprosy to preserve the Hebrew symmetry.
