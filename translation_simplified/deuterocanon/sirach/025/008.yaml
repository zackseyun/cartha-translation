simplification_decisions:
- pob_phrase: who has not stumbled with his tongue
  simplified_phrase: whose tongue has not made him stumble
  preserved_meaning: The concrete stumbling image still describes a harmful mistake in speech.
  reasoning_layer_used: Hebrew lexical decision for נִכְשַׁל and בִּלְשׁוֹנוֹ
  rationale: The recast idiom is easier to understand while retaining both the tongue and stumbling.
- pob_phrase: one more contemptible than himself
  simplified_phrase: someone more dishonorable than himself
  preserved_meaning: The person served has a lower standing in honor than the man serving him.
  reasoning_layer_used: Hebrew lexical decision for נִקְלֶה
  rationale: “Dishonorable” expresses the social-honor judgment in more familiar English.
interpretive_expansions:
- pob_phrase: stumbled with his tongue
  rendering: whose tongue has not made him stumble
  claim: The stumbling is a verbal misstep caused by what the man says.
  evidence:
  - The lexical rationale identifies the Hebrew phrase as an idiom for verbal misstep or offense.
  confidence: high
  alternatives_preserved:
  - The wording retains the literal images of the tongue and stumbling.
translation_notes:
  risk_flags:
  - risk: Readers may take “dishonorable” as an absolute moral verdict rather than a social-honor comparison.
    mitigation: The comparative wording “more dishonorable than himself” preserves the Hebrew relation without further defining it.
  - risk: The Hebrew and Greek witnesses differ substantially.
    mitigation: The main text follows the surviving Hebrew, while the Greek reading is preserved in a footnote.
