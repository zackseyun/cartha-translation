translation:
  language: en
  text: All other evil is small beside the evil of a woman. May a sinner’s allotted fate fall on her.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The last sentence may instead mean, “A sinner’s allotted fate will fall on her.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Any evil is small compared with
  simplified_phrase: All other evil is small beside
  preserved_meaning: Every evil is comparatively slight next to the evil named here.
  reasoning_layer_used: Hebrew comparative construction and POB lexical rationale
  rationale: “Beside” states the comparison in shorter, natural English.
- pob_phrase: the lot of a sinner
  simplified_phrase: a sinner’s allotted fate
  preserved_meaning: The phrase refers to the portion or fate assigned to a sinner.
  reasoning_layer_used: POB lexical decision for גוֹרַל
  rationale: “Allotted fate” explains the less familiar biblical sense of “lot” while retaining its assignment image.
- pob_phrase: may ... fall upon her
  simplified_phrase: May ... fall on her
  preserved_meaning: The clause remains a forceful wish rather than a simple prediction.
  reasoning_layer_used: POB theological decision and Greek optative parallel
  rationale: The shorter wording keeps both the falling image and the imprecatory force.
interpretive_expansions:
- pob_phrase: Any evil
  rendering: All other evil
  claim: The opening refers to other evils considered in comparison with the woman’s evil.
  evidence:
  - The Hebrew comparative prefix marks one evil as being measured against another.
  - The POB rationale says all other evil is minor in comparison.
  confidence: high
  alternatives_preserved:
  - Any evil is small compared with the evil of a woman.
translation_notes:
  risk_flags:
  - risk: The verse’s gendered statement is harsh and may be read as a general judgment about all women.
    mitigation: The singular “a woman” is retained because both the Hebrew and POB require it, without adding broader claims.
  - risk: Replacing “lot” with “allotted fate” could reduce the concrete casting-lots metaphor.
    mitigation: “Allotted” preserves the central idea of an assigned portion, while “fall on” retains the source image.
