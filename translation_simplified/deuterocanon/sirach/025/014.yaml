translation:
  language: en
  text: Better to endure any wound[a] than one inflicted by those who hate you, and any vengeance rather than the vengeance of enemies.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “any affliction.” The word may refer broadly to harm or suffering.
    reason: lexical_alternative
  - marker: b
    text: The Greek proverb has no stated verb; it may also mean, “No wound is like the wound of one who hates, and no vengeance is like the vengeance of enemies.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Any wound, but not the wound of those who hate
  simplified_phrase: Better to endure any wound than one inflicted by those who hate you
  preserved_meaning: Any ordinary injury is preferable to harm caused by active hatred.
  reasoning_layer_used: POB theological decision on the elliptical comparative proverb
  rationale: The implied comparison is stated directly so modern readers can understand the proverb.
- pob_phrase: any vengeance, but not the vengeance of enemies
  simplified_phrase: any vengeance rather than the vengeance of enemies
  preserved_meaning: An enemy’s retaliation is presented as especially grievous.
  reasoning_layer_used: POB lexical decision for ἐκδίκησιν and theological decision on comparison
  rationale: “Vengeance” and “enemies” remain while “rather than” makes the comparison clear.
interpretive_expansions:
- pob_phrase: Any wound ... but not
  rendering: Better to endure any wound than
  claim: The verbless saying expresses an implied preference between harms.
  evidence:
  - The POB theological decision identifies the construction as an elliptical comparative proverb.
  - The repeated Greek pattern πᾶσαν ... καὶ μὴ supports the comparative sense.
  confidence: high
  alternatives_preserved:
  - The saying may instead be read as an exclamation that no comparable wound or vengeance exists.
translation_notes:
  risk_flags:
