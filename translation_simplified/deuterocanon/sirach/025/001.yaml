  preserved_meaning: The beauty is displayed before God and human beings generally.
  reasoning_layer_used: POB lexical and theological decisions for ἔναντι, Κυρίου, and ἀνθρώπων
  rationale: “In the sight of” clarifies presence, and “people” prevents “men” from being misread as males only.
