  preserved_meaning: The concrete image of rising or standing visibly in beauty remains.
  reasoning_layer_used: POB lexical decisions for ἀνέστην and ὡραία
  rationale: “Stood forth in beauty” makes the image understandable while retaining both standing and beauty.
- pob_phrase: before the Lord and men
