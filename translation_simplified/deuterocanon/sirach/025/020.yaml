translation:
  language: en
  text: Walking up a sandy slope is hard for an old man.[a] In the same way, a sharp-tongued wife[b] is hard on a gentle man.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word is difficult here; the Greek parallel supports “sandy.”
    reason: textual_variant
  - marker: b
    text: Or “a talkative wife”; the expression describes a wife known for troublesome speech.
    reason: lexical_alternative
  - marker: c
    text: Or “a quiet man.”
    reason: lexical_alternative
