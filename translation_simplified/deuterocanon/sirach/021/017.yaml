translation:
  language: en
  text: In the assembly, people will seek out a wise man to hear the words from his mouth. They will reflect on his words in their hearts.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The mouth of a wise man will be sought
  simplified_phrase: people will seek out a wise man to hear the words from his mouth
  preserved_meaning: The community values the wise man's speech and actively wants to hear it.
  reasoning_layer_used: POB lexical decisions for στόμα, φρονίμου, and ζητηθήσεται
  rationale: The wording clarifies the Greek idiom while retaining the concrete image of words coming from his mouth.
- pob_phrase: they will ponder his words
  simplified_phrase: They will reflect on his words
  preserved_meaning: The hearers give his words thoughtful inward consideration.
  reasoning_layer_used: POB lexical decision for διανοηθήσεται
  rationale: “Reflect on” expresses sustained consideration in more familiar English than “ponder.”
- pob_phrase: in the assembly
  simplified_phrase: In the assembly
  preserved_meaning: The setting is the gathered community rather than the later institution called the church.
  reasoning_layer_used: POB theological decision for ἐκκλησία
  rationale: “Assembly” is retained because it is already clear and avoids later ecclesiastical associations.
