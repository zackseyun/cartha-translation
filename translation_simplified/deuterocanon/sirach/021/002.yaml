  simplified_phrase: Run from sin
  preserved_meaning: The command urgently tells the reader to escape from sin.
  reasoning_layer_used: Greek lexical decision for φεῦγε
  rationale: “Run from” expresses the force of “flee” in immediate, common English.
- pob_phrase: as from the face of a snake
  simplified_phrase: as you would from a snake in front of you
  preserved_meaning: Sin is pictured as a dangerous snake encountered at close range.
  reasoning_layer_used: Greek idiom and POB lexical rationale
  rationale: “In front of you” makes the snake’s face or presence natural in English without weakening the image.
- pob_phrase: for if you come near it
  simplified_phrase: If you go near it
  preserved_meaning: Approaching sin exposes a person to its harm.
  reasoning_layer_used: Greek lexical decision for προσέρχομαι
  rationale: A separate short sentence makes the warning easier to follow.
