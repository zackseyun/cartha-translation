  text: A man shows his lack of discipline when he listens at someone else’s door[a]. But a sensible man will be weighed down by such disgrace.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “listens at a door” and implies listening to a private conversation.
    reason: lexical_alternative
