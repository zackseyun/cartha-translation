  text: A fool’s explanation is like a burden blocking the road. But gracious words come from the lips of a sensible person.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “favor is found in the words of a sensible person.” The Greek word can mean grace, favor, or graciousness.
    reason: lexical_alternative
