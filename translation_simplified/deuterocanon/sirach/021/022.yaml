translation:
  language: en
  text: A fool quickly enters a house, but a man of plans humbles himself before great people.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew may also mean “before many people” rather than “before great people.”
    reason: lexical_alternative
  - marker: b
    text: 'The Greek has a notably different second line: “but a very experienced man will be ashamed before a face or presence.”'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: A fool’s foot hurries to a house
  simplified_phrase: A fool quickly enters a house
  preserved_meaning: The fool hastily goes into a house.
  reasoning_layer_used: Hebrew lexical decisions for רֶגֶל, מִהֲרָה, and אֶל בָּיִת
  rationale: The direct action is clearer in English, while “quickly” preserves the fool’s impulsive haste.
- pob_phrase: a man of schemes
  simplified_phrase: a man of plans
  preserved_meaning: The man is characterized by deliberate planning without fixing its moral character.
  reasoning_layer_used: Hebrew lexical decision for מְזִימוֹת
  rationale: “Plans” avoids the exclusively sinister tone that “schemes” can suggest today.
- pob_phrase: bows low before the great
  simplified_phrase: humbles himself before great people
  preserved_meaning: He voluntarily lowers himself in deference, while the people’s exact status remains somewhat open.
  reasoning_layer_used: Hebrew lexical decisions for יַכְנִיעַ and לָרַבִּים
  rationale: The wording explains the act and identifies “the great” as people without narrowing them to the powerful.
interpretive_expansions:
- pob_phrase: before the great
  rendering: before great people
  claim: “The great” refers to people, probably those of elevated social standing.
  evidence:
  - The POB rationale identifies a likely social nuance but notes that the Hebrew may instead mean “many.”
  confidence: moderate
  alternatives_preserved:
  - before many people
translation_notes:
  risk_flags:
  - risk: Removing the concrete image of the fool’s foot reduces the proverb’s source imagery.
    mitigation: The plain action is prioritized for immediate understanding, while haste and entry into the house remain explicit.
  - risk: The Hebrew and Greek differ substantially in the second line.
    mitigation: The main text follows the Hebrew, and the Greek reading is preserved in a footnote.
