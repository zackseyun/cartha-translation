translation:
  language: en
  text: A fool peeks through the doorway into a house. But a courteous person[a] stands outside and speaks.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “honor to a man,” while the Greek describes a trained or educated man; here it means someone who behaves properly.
    reason: alternative_reading
  - marker: b
    text: The Greek ends with “stands outside,” but the Hebrew followed here adds “and speaks.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: peers into a house from the doorway
  simplified_phrase: peeks through the doorway into a house
  preserved_meaning: The fool intrusively looks into a home from its entrance.
  reasoning_layer_used: Hebrew lexical decision supported by the Greek parallel
  rationale: “Peeks through the doorway” clearly conveys the improper action while preserving the doorway image.
- pob_phrase: an honorable man
  simplified_phrase: a courteous person
  preserved_meaning: Proper conduct marks a socially respectable person.
  reasoning_layer_used: Hebrew lexical rationale and Greek consistency check
  rationale: “Courteous person” makes the intended proper behavior clearer than the abstract word “honorable.”
- pob_phrase: will stand outside and speak
  simplified_phrase: stands outside and speaks
  preserved_meaning: The courteous person stands outside rather than intruding and speaks from there.
  reasoning_layer_used: Primary Hebrew witness and POB lexical decision
  rationale: The present tense reads naturally as a proverb while retaining both source actions.
translation_notes:
  risk_flags:
  - risk: “Courteous” may sound narrower than the Hebrew language of honor.
    mitigation: The footnote preserves the Hebrew expression and its broader sense of proper conduct.
  - risk: “Peeks” can sound lighter than the social offense implied by the contrast.
    mitigation: The contrast with standing outside preserves the action’s intrusive force.
