translation:
  language: en
  text: A useless worker is no help with the work. A useless guard is no help to someone who brings forth evil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek has a completely different line: “And in all these matters, pray to the Most High to guide your way in truth.”'
    reason: textual_variant
simplification_decisions:
- pob_phrase: A vain laborer for his work
  simplified_phrase: A useless worker is no help with the work
  preserved_meaning: The worker’s effort is futile or worthless for the work at hand.
  reasoning_layer_used: Hebrew lexical decisions for פועל, שוא, and מלאכתו
  rationale: “Useless” and “no help” express the practical futility of “vain” in common English.
- pob_phrase: a vain guard for one who brings forth evil
  simplified_phrase: A useless guard is no help to someone who brings forth evil
  preserved_meaning: The guard is futile in relation to the person bringing out evil.
  reasoning_layer_used: Hebrew lexical decisions for שומר, שוא, and מוציא רע
  rationale: The wording clarifies “vain guard” without resolving the uncertain nature of the evil.
translation_notes:
  risk_flags:
  - risk: The difficult Hebrew leaves the exact relationship between the guard and the person bringing forth evil uncertain.
    mitigation: The draft retains “someone who brings forth evil” and avoids specifying whether the guard protects, watches, or restrains that person.
  - risk: The surviving Greek preserves a substantially different verse.
    mitigation: The alternate Greek line is given in a textual-variant footnote.
