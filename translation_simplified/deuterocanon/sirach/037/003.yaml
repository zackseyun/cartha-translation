translation:
  language: en
  text: Alas, evil thought! Why were you created to fill the whole world with deceit?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel says, “Where did you come rolling in from, to cover the dry land with deceit?” It supports “thought” but reads “cover” instead of the Hebrew “fill.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Alas for an evil thought
  simplified_phrase: Alas, evil thought!
  preserved_meaning: The verse laments and directly addresses a personified evil thought.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Direct address makes the personification immediately clear without weakening the lament.
- pob_phrase: the face of the world
  simplified_phrase: the whole world
  preserved_meaning: Deceit fills the world across its full extent.
  reasoning_layer_used: POB lexical decision for פני תבל
  rationale: The common phrase “whole world” clearly conveys the scope of the Hebrew image.
interpretive_expansions:
- pob_phrase: the face of the world
  rendering: the whole world
  claim: The phrase refers to deceit extending throughout the world.
