translation:
  language: en
  text: For not everything helps everyone, and not everyone enjoys everything.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Hebrew text is difficult and differs greatly from the Greek. It reads literally, “There is a wise man who is wise for his people; the fruit of his knowledge is in their bodies.” This translation follows the Greek here.
    reason: textual_variant
