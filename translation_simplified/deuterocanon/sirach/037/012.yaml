translation:
  language: en
  text: Do not ask your father-in-law for advice.[a] Do not share a secret with a jealous person.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek text differs greatly here. It speaks instead of spending time with a godly man who keeps the commandments; this translation follows the surviving Hebrew.
    reason: textual_variant
