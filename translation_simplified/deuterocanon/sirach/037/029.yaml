translation:
  language: en
  text: A man’s life lasts for a limited number of days, but the people of Israel live on for more days than can be counted.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also read “and,” though the two parts of the verse imply a contrast.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: A man's life is a numbered span of days
  simplified_phrase: A man’s life lasts for a limited number of days
  preserved_meaning: An individual human life is finite and countable in days.
  reasoning_layer_used: lexical decision for מִסְפַּר יָמִים
  rationale: The rewrite states the finite lifespan plainly while retaining the concrete image of counted days.
- pob_phrase: the life of the people of Israel is days without number
  simplified_phrase: the people of Israel live on for more days than can be counted
  preserved_meaning: Israel continues as a people beyond any individual lifespan.
  reasoning_layer_used: theological decision on Israel’s collective endurance
  rationale: The active wording makes the collective continuity natural without turning it into an explicit doctrine of endless existence.
interpretive_expansions:
- pob_phrase: a numbered span of days
  rendering: a limited number of days
  claim: The numbered days describe a finite lifespan.
