translation:
  language: en
  text: A friend fights with a stranger over something good.[a] He takes up a shield against cities.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Something good” may also mean a benefit or advantage.
    reason: lexical_alternative
  - marker: b
    text: The Greek reads, “A companion suffers with a friend for the sake of his stomach, and in the face of war he will take up a shield.” The Hebrew differs notably and is followed in the main text.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: fights with a stranger over a good thing
  simplified_phrase: fights with a stranger over something good
  preserved_meaning: The friend enters a conflict involving a stranger over some good, benefit, or advantage.
  reasoning_layer_used: Hebrew lexical decisions for נלחם עם זר and טוב
  rationale: Keeping “with” preserves whether the stranger is an opponent or is involved in another way.
- pob_phrase: and against cities he will take up a shield
  simplified_phrase: He takes up a shield against cities
  preserved_meaning: The friend arms himself with a shield in confrontation with cities.
  reasoning_layer_used: Hebrew lexical decisions for נגד ערים and יחזיק צנה
  rationale: A separate sentence and ordinary word order make the martial image easier to follow.
translation_notes:
  risk_flags:
  - risk: The Hebrew reference to “cities” is difficult, while the Greek reads “war.”
    mitigation: The main text follows the Hebrew, and the footnote preserves the significant Greek alternative.
  - risk: “With a stranger” remains ambiguous about the stranger’s role in the conflict.
    mitigation: The ambiguity is retained because the Hebrew permits associative or adversative senses.
