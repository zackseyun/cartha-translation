translation:
  language: en
  text: A wise man may help many people with his wisdom, yet be worthless to himself.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word translated “worthless” is difficult; it may also suggest being defiled or tainted.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek tradition has a different saying here: “A man’s life is a limited number of days, but the days of Israel are beyond number.”'
    reason: textual_variant
