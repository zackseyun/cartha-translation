translation:
  language: en
  text: Does grief not reach all the way to death when a companion as close as your own soul turns into an enemy?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “a companion like your own soul”; the Greek parallel says “a companion and friend.” Both describe a deeply intimate friendship.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Is there not grief that reaches to death
  simplified_phrase: Does grief not reach all the way to death
  preserved_meaning: The rhetorical question expects agreement and keeps the image of grief extending to death.
  reasoning_layer_used: Hebrew lexical decisions confirmed by the Greek parallel
  rationale: The active wording is easier to follow while preserving the question and deathward image.
- pob_phrase: a companion as your own soul
  simplified_phrase: a companion as close as your own soul
  preserved_meaning: The companion is bound to the person by exceptionally deep intimacy.
  reasoning_layer_used: Hebrew idiom and POB footnote
  rationale: Adding “close” makes the relationship clear without removing the source image.
translation_notes:
  risk_flags:
  - risk: “Reaches all the way to death” may be read as either deadly grief or grief as intense as death.
    mitigation: The wording preserves the source’s extent image without choosing between these related nuances.
