translation:
  language: en
  text: He will tell you that the way you are going is good. Then he will stand across from you and watch your downfall.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is brief and uncertain; “downfall” may instead mean “misfortune” or “poverty.” The Greek has a fuller warning about unreliable advisers.
    reason: alternative_reading
