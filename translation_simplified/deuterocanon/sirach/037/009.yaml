translation:
  language: en
  text: Be on your guard when someone advises you. First find out what that person needs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean “what interests or motivates that person.” The Greek parallel instead says, “He will stand opposite to see what will happen to you.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Guard yourself from a counselor
  simplified_phrase: Be on your guard when someone advises you
  preserved_meaning: Remain cautious toward a person who gives counsel.
  reasoning_layer_used: Hebrew lexical decision for מיועץ and שמור נפשך
  rationale: The verbal wording makes the advisory role immediately clear while keeping the warning’s force.
- pob_phrase: and know beforehand
  simplified_phrase: First find out
  preserved_meaning: Discern the counselor’s situation before relying on the advice.
  reasoning_layer_used: Hebrew lexical decision for ודע לפנים
  rationale: “First find out” expresses prior investigation in ordinary modern English.
- pob_phrase: what his need is
  simplified_phrase: what that person needs
  preserved_meaning: Identify the counselor’s need while leaving the broader sense of personal interest open.
  reasoning_layer_used: Hebrew lexical decision for מה צרכו and POB footnote
  rationale: The gender-neutral wording is natural, and the footnote preserves the Hebrew term’s wider range.
translation_notes:
  risk_flags:
  - risk: Readers may understand “needs” only as material necessity.
    mitigation: The footnote preserves the possible sense of personal interest or motivation.
  - risk: The Greek parallel develops the warning differently from the Hebrew base text.
    mitigation: The main text follows the controlling Hebrew, while the footnote records the Greek wording.
