translation:
  language: en
  text: But someone whose heart is like yours[a] will also be affected if you stumble.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “heart” means the inner person, including one’s disposition and intentions.
    reason: simplification_note
  - marker: b
    text: 'The Hebrew is terse: literally, “if you stumble, it will reach him.” It may refer broadly to your failure or trouble affecting him.'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: But with one whose heart is like your heart
  simplified_phrase: But someone whose heart is like yours
  preserved_meaning: The person shares the reader’s inner disposition and intentions.
  reasoning_layer_used: POB lexical and theological decisions on לבבו כלבבך
  rationale: The sentence now begins naturally while retaining the biblical image of the heart.
- pob_phrase: if you stumble, he will be affected also
  simplified_phrase: will also be affected if you stumble
  preserved_meaning: The other person is affected by the reader’s moral or practical faltering.
  reasoning_layer_used: POB lexical decision and footnote on אם תכשל and יגיע אליו
  rationale: Reordering the clause improves readability without narrowing what kind of stumbling is meant.
