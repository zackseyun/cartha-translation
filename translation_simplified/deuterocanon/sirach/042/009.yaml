translation:
  language: en
  text: A daughter is a hidden source of worry for her father,[a] and worry about her keeps him awake. While she is young, he fears that she may pass her prime; while she is still a virgin, he fears that she may never marry.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “hidden falsehood,” an uncertain phrase; the Greek parallel has “hidden sleeplessness,” suggesting concealed worry.
    reason: alternative_reading
  - marker: b
    text: The Hebrew phrase rendered “pass her prime” is uncertain; the Greek supports the sense of passing beyond youth or marriageable age.
    reason: textual_variant
simplification_decisions:
- pob_phrase: a hidden cause of deceit to her father
  simplified_phrase: a hidden source of worry for her father
  preserved_meaning: A daughter can become a concealed cause of paternal distress.
  reasoning_layer_used: difficult Hebrew phrase, Greek parallel, POB footnote, and immediate context
  rationale: The clearer wording avoids implying a direct accusation while the note preserves the uncertain Hebrew.
- pob_phrase: anxiety over her drives away his sleep
  simplified_phrase: worry about her keeps him awake
  preserved_meaning: His continuing concern about his daughter deprives him of sleep.
  reasoning_layer_used: lexical decisions for דאגה and תפריע שנתו
  rationale: Common wording makes the sleep-loss image immediately clear.
- pob_phrase: in her youth ... and in her virginity, lest she not be married
  simplified_phrase: While she is young ... while she is still a virgin, he fears that she may never marry
  preserved_meaning: The father fears age-related and marital outcomes during her youth and virgin status.
  reasoning_layer_used: lexical decisions for בנעוריה, ובתוליה, and פן לא תנשא
  rationale: Natural clauses retain both cultural categories and their distinct fears.
interpretive_expansions:
- pob_phrase: lest she pass her prime ... lest she not be married
  rendering: he fears that she may pass her prime ... he fears that she may never marry
  claim: The repeated clauses identify the father's specific fears.
  evidence:
  - The preceding clause identifies worry as the cause of his lost sleep.
  - Hebrew פן introduces a feared possibility in each clause.
  - The Greek parallel also presents both outcomes as concerns.
  confidence: high
  alternatives_preserved:
  - The uncertain sense of “pass her prime” remains in the footnote.
  - The final clause still concerns her remaining unmarried.
translation_notes:
  risk_flags:
  - risk: “Hidden source of worry” interprets a difficult Hebrew phrase through the Greek and context.
    mitigation: Footnote a gives the Hebrew wording and identifies the Greek-supported reading.
  - risk: “Pass her prime” is uncertain and reflects an ancient marriage-age concern.
    mitigation: Footnote b states the uncertainty and the Greek evidence without resolving it fully.
