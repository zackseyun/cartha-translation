translation:
  language: en
  text: He lives and stands firm forever.[a] His goodness moves from one thing to another.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Hebrew is brief and somewhat uncertain here. The Greek has a different, fuller text: “Nothing was added or diminished, and he needed no counselor. How desirable are all his works, and like a spark they are to behold.”'
    reason: textual_variant
  - marker: b
    text: The Hebrew may also mean, “His goodness passes over each thing”; the exact relationship between the things is uncertain.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: stands forever
  simplified_phrase: stands firm forever
  preserved_meaning: God remains permanently established while the image of standing is retained.
  reasoning_layer_used: Lexical decisions for ועומד and לעד
  rationale: “Firm” makes the standing image convey enduring stability at once.
- pob_phrase: his goodness passes from one thing to another
  simplified_phrase: His goodness moves from one thing to another
  preserved_meaning: God’s goodness proceeds among things in a moving or successive way.
  reasoning_layer_used: Lexical decisions for זה על זה, חלף, and טובו
  rationale: “Moves” is natural English and preserves the Hebrew movement metaphor without resolving its uncertainty.
interpretive_expansions:
- pob_phrase: stands forever
  rendering: stands firm forever
  claim: Standing describes enduring stability, not merely physical posture.
  evidence:
  - The lexical rationale says the standing image communicates permanence in context.
  - The word “forever” establishes the duration of that stability.
  confidence: high
  alternatives_preserved:
  - stands forever
  - endures forever
  - remains forever
translation_notes:
  risk_flags:
  - risk: The compressed Hebrew phrase about goodness allows more than one relationship among the things.
    mitigation: The main text remains broad, and footnote b preserves a major alternative.
  - risk: The Greek preserves a substantially different and fuller form of the verse.
    mitigation: The Hebrew remains primary, while footnote a gives the full Greek parallel.
