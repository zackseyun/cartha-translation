translation:
  language: en
  text: The sun rises and shines on everything visible.[a][b] The Lord’s glory is over all his works.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew can also mean “everything revealed”; the Greek reads more like, “giving light, it looks upon everything.”
    reason: alternative_reading
  - marker: b
    text: An older Hebrew manuscript from Masada appears to have different wording here.
    reason: textual_variant
simplification_decisions:
- pob_phrase: everything revealed
  simplified_phrase: everything visible
  preserved_meaning: The sun shines on all that is manifest or able to be seen.
  reasoning_layer_used: POB lexical decision for נגלתה
  rationale: “Visible” communicates the documented Hebrew sense more naturally in modern English.
- pob_phrase: The sun rises and shines on everything revealed, and the glory
  simplified_phrase: The sun rises and shines on everything visible. The Lord’s glory
  preserved_meaning: The two poetic statements remain distinct and parallel.
  reasoning_layer_used: POB translation and optimal-equivalence philosophy
  rationale: Dividing the line into two sentences makes its parallel structure easier to follow.
translation_notes:
  risk_flags:
  - risk: “Visible” may sound less passive than the Hebrew “revealed.”
    mitigation: Footnote a preserves the more literal wording and the Greek alternative.
  - risk: The first line differs among ancient witnesses.
    mitigation: Footnote b alerts readers without displacing the primary Hebrew text.
