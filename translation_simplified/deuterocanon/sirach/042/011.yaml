translation:
  language: en
  text: 'Keep a close watch on your virgin daughter. Otherwise, she may bring you disgrace: you may become the subject of city gossip and the people’s curses, and she may expose you to shame before the public assembly at the city gate.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The final Hebrew phrase is difficult. It describes a gathering at the city gate, a public place for civic assembly and judgment; the Greek parallel also points to public shame before a crowd.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Keep a strict watch over your virgin daughter
  simplified_phrase: Keep a close watch on your virgin daughter
  preserved_meaning: The command still calls for careful supervision and retains the daughter’s sexual and social status.
  reasoning_layer_used: POB lexical decisions for על בתולתך and החזק משמר
  rationale: “Close watch” expresses the intensified command in familiar English.
- pob_phrase: lest she make you a byword of disgrace
  simplified_phrase: Otherwise, she may bring you disgrace
  preserved_meaning: Her actions may publicly damage the parent’s reputation, as the following consequences explain.
  reasoning_layer_used: POB lexical decision for שם סרה and Greek consistency check
  rationale: This removes the uncommon “byword” while preserving the warning of reputational shame.
- pob_phrase: a gossip of the city and a curse of the people
  simplified_phrase: the subject of city gossip and the people’s curses
  preserved_meaning: The parent becomes an object of communal gossip and denunciation.
  reasoning_layer_used: POB lexical decisions for דבת עיר and וקללת עם
  rationale: Identifying the parent as the subject makes both public-shame images immediately clear.
interpretive_expansions:
- pob_phrase: and seat you in the assembly at the gate
  rendering: and she may expose you to shame before the public assembly at the city gate
  claim: Being placed before the gate gathering signifies public exposure to shame in a civic forum.
  evidence:
  - The POB cultural note identifies the gate as a place of civic assembly and judgment.
  - The Greek parallel points to public shame before a crowd.
  confidence: moderate
  alternatives_preserved:
  - make you sit in the gathering at the gate
  - place you before the crowd at the gate
  external_witnesses:
  - Greek parallel
translation_notes:
  risk_flags:
  - risk: The Hebrew final clause does not explicitly use a word for shame.
    mitigation: The public-shame sense is contextually supported, and the footnote preserves the clause’s difficulty.
  - risk: “Public assembly” could be mistaken for a specifically judicial hearing.
    mitigation: Neither the text nor the note claims that a formal trial occurs.
