translation:
  language: en
  text: I will remember what God has done, and I will tell what I have seen. God’s will is in his word, and his work does what he desires.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The final line is difficult in Hebrew; the Greek reads, “In the words of the Lord are his works.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the works of God
  simplified_phrase: what God has done
  preserved_meaning: God’s deeds and activity remain the subject of remembrance.
  reasoning_layer_used: Lexical decision for מעשי אל
  rationale: A direct verbal expression makes God’s deeds easier to understand.
- pob_phrase: what I have seen I will recount
  simplified_phrase: I will tell what I have seen
  preserved_meaning: The speaker will report what he has witnessed.
  reasoning_layer_used: Lexical decision for וזה חזיתי ואספרה
  rationale: Ordinary clause order conveys the same report in natural English.
- pob_phrase: At the word of God is his will, and his work accomplishes his pleasure
  simplified_phrase: God’s will is in his word, and his work does what he desires
  preserved_meaning: God’s word remains related to his will, while his work fulfills his desire.
  reasoning_layer_used: Theological decision on the difficult final colon
  rationale: The wording preserves the two parallel relationships without claiming that God verbally states his will.
