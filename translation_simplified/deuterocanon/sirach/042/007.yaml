translation:
  language: en
  text: Whenever you hand something over, count it with your own hand. Keep a written record of everything you give and receive.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew opening is compressed and uncertain. The Greek parallel says, “Whatever you hand over, do it by number and weight,” supporting the sense of careful, documented accounting.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: For whatever place you appoint
  simplified_phrase: Whenever you hand something over
  preserved_meaning: The opening concerns something entrusted or transferred under accountable handling.
  reasoning_layer_used: POB lexical rationale, immediate accounting context, and Greek parallel
  rationale: This avoids an unsupported spatial reading while the footnote preserves the Hebrew uncertainty.
- pob_phrase: keep count by your hand
  simplified_phrase: count it with your own hand
  preserved_meaning: The concrete hand image continues to stress personal, careful counting.
  reasoning_layer_used: POB lexical rationale
  rationale: Natural word order makes the instruction clear without weakening the image.
- pob_phrase: every giving and receiving should be in writing
  simplified_phrase: Keep a written record of everything you give and receive
  preserved_meaning: Every outgoing and incoming transaction is to be documented.
  reasoning_layer_used: POB lexical decision and Greek consistency check
  rationale: A direct command expresses the accounting requirement in ordinary English.
interpretive_expansions:
- pob_phrase: For whatever place you appoint
  rendering: Whenever you hand something over
  claim: The compressed opening is presented as an accountable transfer rather than an assignment to a location.
  evidence:
  - The POB rationale says the practical sense concerns something entrusted or assigned.
  - The following clauses require counting and written records.
  - The Greek parallel reads “whatever you hand over.”
  confidence: moderate
  alternatives_preserved:
  - Concerning a place
  - At a place
  - For any deposit or place
  external_witnesses:
  - Greek parallel
translation_notes:
  risk_flags:
  - risk: The compressed Hebrew opening allows more than one syntactic reading.
    mitigation: The footnote states the uncertainty and identifies the Greek basis for the transaction-oriented wording.
  - risk: “With your own hand” may sound limited to manual counting.
    mitigation: The preserved hand image conveys personal accountability, and the next sentence clarifies the broader recordkeeping duty.
