translation:
  language: en
  text: Where there is a bad wife,[a] keeping things securely sealed is wise. Where many people have access, lock things up.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a bad woman”; the household setting favors “wife.”
    reason: alternative_reading
  - marker: b
    text: The surviving Hebrew reads “slack hands” and “open,” but the Greek parallel supports “many hands” and “lock.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: For a bad wife, a seal is good
  simplified_phrase: Where there is a bad wife, keeping things securely sealed is wise
  preserved_meaning: The proverb recommends secure sealing in a household involving a bad wife.
  reasoning_layer_used: Lexical decisions for אשה רעה and חותם חסם, guided by the household context
  rationale: Generic “things” clarifies the elliptical saying without specifying property or ownership.
- pob_phrase: where many hands are
  simplified_phrase: Where many people have access
  preserved_meaning: Access by many people creates a need for security.
  reasoning_layer_used: Greek parallel and the adopted lexical decision for ידים רפות
  rationale: The hand image is expressed as shared access in ordinary modern English.
- pob_phrase: lock it up
  simplified_phrase: lock things up
  preserved_meaning: Items exposed to shared access should be secured.
  reasoning_layer_used: Greek κλεῖσον and the adopted lexical decision for תפתח
  rationale: A generic plural object keeps the source’s ellipsis while making the command natural.
interpretive_expansions:
- pob_phrase: where many hands are
  rendering: Where many people have access
  claim: The many hands represent multiple people able to access what should be secured.
  evidence:
  - The POB rationale identifies shared access as the proverb’s warning.
  - The Greek parallel reads “many hands.”
  confidence: high
  alternatives_preserved:
  - The specific items and type of access remain unstated.
  external_witnesses:
  - 'Greek parallel: χεῖρες πολλαί'
translation_notes:
  risk_flags:
  - risk: “Bad wife” may sound like a claim about women generally.
    mitigation: The wording limits the saying to a wife, while footnote [a] records the lexical alternative.
  - risk: The surviving Hebrew conflicts with the adopted security sense.
    mitigation: Footnote [b] identifies the Hebrew readings and the Greek-supported choices.
