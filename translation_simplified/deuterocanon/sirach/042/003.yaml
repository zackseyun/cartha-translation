translation:
  language: en
  text: about financial accounts involving a tenant,[a] a master, and a guest; and about dividing an inheritance and property.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel has “a partner and travelers” and differs at several other points; this translation follows the surviving Hebrew text.
    reason: alternative_reading
  - marker: b
    text: The final Hebrew word is brief and uncertain; “property” fits the legal and financial context.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the account of a tenant, a master, and a guest
  simplified_phrase: financial accounts involving a tenant, a master, and a guest
  preserved_meaning: The wording keeps all three named persons connected by “and” without defining their exact relationship.
  reasoning_layer_used: The lexical decisions identify חשבון as financial accounting and retain tenant, master, and guest from the Hebrew.
  rationale: “Financial accounts involving” makes the commercial sense clear while avoiding an unsupported relationship.
- pob_phrase: the division of an inheritance and property
  simplified_phrase: dividing an inheritance and property
  preserved_meaning: The legal act of distributing inherited goods and property remains distinct from the accounting matters.
  reasoning_layer_used: The lexical decisions define מחלקות as dividing or allotting and נחלה as inheritance.
  rationale: The verb “dividing” is more direct than the abstract noun “division.”
interpretive_expansions:
- pob_phrase: account
  rendering: financial accounts
  claim: The account is a financial reckoning rather than a narrative report.
  evidence:
  - The lexical rationale places חשבון in a commercial and legal setting.
  - The surrounding topics concern tenancy, inheritance, and property.
  confidence: high
  alternatives_preserved:
  - reckoning
  - calculation
