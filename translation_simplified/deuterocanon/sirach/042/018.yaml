translation:
  language: en
  text: He searches the deep and the human heart.[b] Everything in them lies open to his understanding.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew pictures everything as lying bare before him; the Greek instead speaks of every scheme or cunning act.
    reason: alternative_reading
  - marker: b
    text: The Masada Hebrew manuscript has only the shorter opening about searching the deep and the heart.
    reason: textual_variant
simplification_decisions:
- pob_phrase: He searches out the deep and the heart
  simplified_phrase: He searches the deep and the human heart
  preserved_meaning: He thoroughly examines both the cosmic deep and a person's inner life.
  reasoning_layer_used: POB lexical decisions for תהום, לב, and חקר
  rationale: Adding “human” makes the biblical sense of “heart” immediately clear without replacing the term.
- pob_phrase: he understands all their secrets
  simplified_phrase: Everything in them lies open to his understanding
  preserved_meaning: Nothing within the deep or the heart escapes his complete understanding.
  reasoning_layer_used: Hebrew lexical decision for מערומיהם and יתבונן
  rationale: The new wording restores the Hebrew image of exposure while expressing discernment in natural English.
- pob_phrase: one coordinated sentence
  simplified_phrase: two short sentences
  preserved_meaning: The searching and complete understanding remain distinct but connected claims.
  reasoning_layer_used: SPOB readability guidance
  rationale: Dividing the dense line makes both claims easier to grasp.
interpretive_expansions:
- pob_phrase: the heart
  rendering: the human heart
  claim: “Heart” refers to the human inner person rather than the physical organ.
  evidence:
  - The POB lexical rationale says לב includes thought and intention.
  - The contrast with “the deep” points to an inward human realm.
  confidence: high
  alternatives_preserved:
  - the heart
  - the inner self
  - the mind
  external_witnesses:
  - The Greek parallel uses καρδίαν, “heart.”
- pob_phrase: all their secrets
  rendering: Everything in them lies open to his understanding
  claim: What seems hidden is fully exposed to his discerning knowledge.
  evidence:
  - The Hebrew מערומיהם evokes nakedness or what is laid bare.
  - The POB rationale interprets the phrase as all that is exposed before him.
  confidence: moderate
  alternatives_preserved:
  - all their secrets
  - all their nakednesses
  - their schemes or cunning acts
  external_witnesses:
  - The Greek parallel reflects the alternative sense “schemes” or “cunning acts.”
translation_notes:
  risk_flags:
  - risk: “Lies open” may sound less literal than the Hebrew image of nakedness.
    mitigation: The wording preserves the image of complete exposure, and footnote a explains it.
  - risk: The Greek tradition differs from the primary Hebrew reading.
    mitigation: Footnote a preserves the Greek alternative without allowing it to control the main text.
