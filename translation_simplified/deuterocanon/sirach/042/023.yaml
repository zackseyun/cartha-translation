translation:
  language: en
  text: All these live and last forever. Whatever the need, they all obey.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The surviving Cairo Geniza Hebrew has a different line: “Who can ever see enough of the pure splendor of the highest heaven?” Older evidence from Masada and the Greek supports the main text; the Hebrew line was probably moved here from the nearby context.'
    reason: textual_variant
  - marker: b
    text: “Whatever the need” may also mean “for every purpose” or “for every use.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: live and endure forever
  simplified_phrase: live and last forever
  preserved_meaning: Creation continues in life and existence without end.
  reasoning_layer_used: The lexical decision identifies ongoing vitality and continued persistence.
  rationale: “Last” expresses continued existence more plainly than “endure.”
- pob_phrase: in every need, all obey
  simplified_phrase: Whatever the need, they all obey
  preserved_meaning: All these created things respond obediently in every need or use.
  reasoning_layer_used: The lexical decision preserves the broad need, use, or purpose sense of the Greek phrase.
  rationale: The recast clause makes the relationship between need and obedience immediately clear.
- pob_phrase: All these live and endure forever; in every need, all obey.
  simplified_phrase: All these live and last forever. Whatever the need, they all obey.
  preserved_meaning: 'The two claims remain distinct: creation lasts forever and obeys in every need.'
  reasoning_layer_used: The POB main text and theological decision control both claims.
  rationale: Two short sentences replace the semicolon structure without merging the ideas.
translation_notes:
  risk_flags:
  - risk: The main text follows the Greek and Masada-supported sense rather than the printed Cairo Geniza Hebrew line.
    mitigation: Footnote a states the textual difference and preserves the alternate Hebrew wording.
  - risk: “Whatever the need” may sound narrower than the possible sense “for every purpose.”
    mitigation: Footnote b preserves the broader lexical alternatives.
