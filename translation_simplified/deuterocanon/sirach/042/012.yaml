translation:
  language: en
  text: Do not display your beauty to any man.[a] Do not sit with women in the house.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says, “Do not give beauty or appearance to any man.” The Greek parallel can also be understood as, “Do not look upon every person or man in beauty.”
    reason: alternative_reading
  - marker: b
    text: The final Hebrew verb is uncertain; the Greek supports “do not sit or keep company among women.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: Do not display your beauty to any man
  simplified_phrase: Do not display your beauty to any man
  preserved_meaning: The warning remains about making one’s beauty visible to a man without implying a staged performance.
  reasoning_layer_used: Hebrew lexical decision checked against the Greek parallel
  rationale: Keeping “to any man” avoids the unsupported purpose nuance introduced by “for any man.”
- pob_phrase: do not sit among women in the house
  simplified_phrase: Do not sit with women in the house
  preserved_meaning: The concrete warning against sitting in the company of women remains intact.
  reasoning_layer_used: Uncertain Hebrew verb clarified by the Greek parallel
  rationale: “Sit with” expresses social company more naturally than “sit among.”
- pob_phrase: and do not
  simplified_phrase: Do not
  preserved_meaning: Both prohibitions retain their full force.
  reasoning_layer_used: SPOB sentence-division rule
  rationale: Two short sentences make the separate commands easier to follow.
