  - marker: a
    text: The Greek reads “about accuracy of scales and weights.” The difficult Hebrew appears to refer instead to dishonest weighing.
    reason: alternative_reading
  - marker: b
    text: The Hebrew names an ephah, an ancient measure for dry goods, and a stone used as a weight.
    reason: cultural_note
  - marker: c
    text: The Greek differs substantially here, reading “about acquiring much and little” or “about large and small quantities.”
    reason: textual_variant
