translation:
  language: en
  text: While she is still a virgin,[a] the fear is that she may be seduced; while living in her husband’s home, that she may go astray. While living in her father’s home, the fear is that she may become pregnant; and in her husband’s home, that she may be unable to have children.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek reads “be defiled” rather than “be seduced,” making the sexual sense explicit.
    reason: alternative_reading
  - marker: b
    text: The Hebrew could more literally mean “be restrained,” but the Greek supports “be unable to have children.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: In her virginity
  simplified_phrase: While she is still a virgin
  preserved_meaning: Her unmarried state of virginity remains explicit.
  reasoning_layer_used: Hebrew lexical decision supported by the Greek parallel
  rationale: The time clause is more natural in common English than the abstract phrase.
- pob_phrase: in her husband’s house / in her father’s house
  simplified_phrase: while living in her husband’s home / while living in her father’s home
  preserved_meaning: The verse still distinguishes her premarital and married households.
  reasoning_layer_used: Hebrew household phrases and POB lexical decisions
  rationale: “While living” clarifies that “house” refers to her household setting.
- pob_phrase: lest she be barren
  simplified_phrase: that she may be unable to have children
  preserved_meaning: The warning concerns reproductive inability within marriage.
  reasoning_layer_used: Hebrew lexical rationale confirmed by Greek στειρώσῃ
  rationale: The plain description is easier to understand than “barren.”
interpretive_expansions:
- pob_phrase: lest
  rendering: the fear is that
  claim: The repeated warnings express feared possibilities rather than predictions.
  evidence:
  - The Hebrew particle פן introduces an undesirable possibility.
  - POB consistently renders the clauses with “lest.”
  confidence: high
  alternatives_preserved:
  - lest
  - for fear that
translation_notes:
  risk_flags:
  - risk: “Go astray” may be read broadly rather than specifically as marital unfaithfulness.
    mitigation: The wording preserves POB’s deliberate moral and sexual ambiguity instead of narrowing it to adultery.
  - risk: “Unable to have children” states the contextually likely sense of an uncertain Hebrew expression.
    mitigation: The footnote preserves the more literal Hebrew option and notes the Greek support.
