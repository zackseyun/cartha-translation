  text: Hezekiah strengthened his city’s defenses and channeled water into it. He cut through rock with iron tools[a] and dammed up a reservoir in the mountains.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew has a difficult reference to bronze or copper; the Greek reads “with iron,” which is followed here.
    reason: textual_variant
  - marker: b
