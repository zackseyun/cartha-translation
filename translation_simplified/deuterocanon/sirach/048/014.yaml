translation:
  language: en
  text: While he lived, he did wonders. Even in death, his works were marvelous.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “in his death”; the Greek parallel says “at his end.” Both express the contrast between his wonders while alive and the marvelous works associated with him in death.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: In his life
  simplified_phrase: While he lived
  preserved_meaning: This refers to the period of Elisha’s life.
  reasoning_layer_used: Hebrew lexical decision for בחייו
  rationale: The time clause is clearer in ordinary English.
- pob_phrase: and in his death
  simplified_phrase: Even in death
  preserved_meaning: Marvelous works remained associated with Elisha in connection with his death.
  reasoning_layer_used: Hebrew lexical decision for ובמותו, confirmed by the Greek parallel and immediate context
  rationale: This preserves the striking life-and-death contrast without confining the works to the moment he died.
- pob_phrase: In his life he did wonders, and in his death his works were marvelous.
  simplified_phrase: While he lived, he did wonders. Even in death, his works were marvelous.
  preserved_meaning: The parallel contrast between Elisha’s life and death remains intact.
  reasoning_layer_used: POB translation and parallel structure
  rationale: Two short sentences make the contrast easy to follow.
