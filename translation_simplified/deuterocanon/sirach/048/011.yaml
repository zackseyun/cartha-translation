translation:
  language: en
  text: How happy is anyone who saw you and died![a] How happy you are, because you will surely live!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek reads: “Happy are those who saw you and those adorned with love, for we too shall live.” The Hebrew instead says, “How happy you are, because you will surely live!”'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Happy is the one who saw you and died
  simplified_phrase: How happy is anyone who saw you and died!
  preserved_meaning: The line remains a beatitude about a person who saw Elijah and died.
  reasoning_layer_used: Hebrew lexical decisions for אשרי, ראך, and ומת
  rationale: The exclamation makes the Hebrew beatitude sound natural without treating death as a contrast.
- pob_phrase: and happy are you, for you will surely live
  simplified_phrase: How happy you are, because you will surely live!
  preserved_meaning: Elijah is directly called happy on the grounds that he will certainly live.
  reasoning_layer_used: Hebrew lexical decisions for ואשריך, כי, and חיה תחיה
  rationale: “Because” states the explanatory link clearly while “surely” retains the Hebrew emphasis.
translation_notes:
  risk_flags:
  - risk: Modern readers may hear “happy” as a passing emotion rather than an enviable, blessed state.
    mitigation: The repeated exclamatory form preserves the force of the Hebrew beatitude.
  - risk: The Greek parallel differs substantially in the second half of the verse.
    mitigation: The main text follows the extant Hebrew, and the Greek reading remains in the footnote.
