translation:
  language: en
  text: During his lifetime, he was not afraid of anyone, and no mortal could control his spirit. No word was beyond him.[a] Even as he lay in death, his body prophesied.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew word can mean either “word” or “matter.”
    reason: lexical_alternative
  - marker: b
    text: This line follows the Greek parallel; the surviving Hebrew is difficult and may contain a textual problem.
    reason: textual_variant
simplification_decisions:
- pob_phrase: In his days he did not tremble before anyone
  simplified_phrase: During his lifetime, he was not afraid of anyone
  preserved_meaning: He was never intimidated by another person.
  reasoning_layer_used: POB lexical decision on מימיו and לא זע מכל
  rationale: The rewrite expresses the Hebrew idioms in direct modern English.
- pob_phrase: no flesh mastered his spirit
  simplified_phrase: no mortal could control his spirit
  preserved_meaning: No human being gained dominion over his spirit.
  reasoning_layer_used: POB lexical decision on כל בשר and משל ברוחו
  rationale: “Mortal” makes the human meaning of “flesh” clear while retaining its gravity.
- pob_phrase: No word was too wondrous for him
  simplified_phrase: No word was beyond him
  preserved_meaning: No extraordinary word or matter exceeded his capacity.
  reasoning_layer_used: POB lexical decision on כל דבר לא נפלא ממנו
  rationale: “Beyond him” communicates the difficult phrase clearly without defining how it was wondrous.
