translation:
  language: en
  text: A powerful spirit enabled him to see the end.[a] He also comforted Zion’s mourners.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Greek: “With a great spirit, he saw the last things.” The Hebrew reads “By a spirit of might, he saw the end.”'
    reason: alternative_reading
  - marker: b
    text: This may also mean “those mourning in Zion,” as in the Greek.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: By a spirit of might
  simplified_phrase: A powerful spirit enabled him
  preserved_meaning: His prophetic sight came through a spirit characterized by power.
  reasoning_layer_used: Hebrew lexical and theological decisions
  rationale: The active wording makes the Hebrew’s instrumental sense easier to understand.
- pob_phrase: he saw the end, and he comforted
  simplified_phrase: he saw the end. He also comforted
  preserved_meaning: He both perceived the end prophetically and brought comfort to mourners.
  reasoning_layer_used: POB syntax and lexical decisions
  rationale: Two short sentences clarify the distinct actions without merging them.
- pob_phrase: the mourners of Zion
  simplified_phrase: Zion’s mourners
  preserved_meaning: The mourners remain closely associated with Zion.
