simplification_decisions:
- pob_phrase: called to God Most High
  simplified_phrase: called on God Most High in prayer
  preserved_meaning: They appealed to God, who bears the divine title Most High.
  reasoning_layer_used: Hebrew lexical decision supported by the Greek parallel
  rationale: “Called on” clearly expresses an appeal to God while retaining his title.
- pob_phrase: spread out their hands to him
  simplified_phrase: held out their hands toward him
  preserved_meaning: They extended their hands toward God as a gesture of prayer.
  reasoning_layer_used: Hebrew lexical decisions for ויפרשו, כפים, and אליו
  rationale: “Held out” makes the physical prayer gesture natural in modern English.
interpretive_expansions:
- pob_phrase: called to
  rendering: called on ... in prayer
  claim: Their calling was an appeal to God in prayer.
  evidence:
