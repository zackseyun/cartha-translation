translation:
  language: en
  text: who raised a dead man to life, bringing him back from death and from Sheol, the realm of the dead, by the will of the LORD.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel says “by the word of the Most High,” while the Hebrew reads “by the will of the LORD.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: raised up a corpse from death
  simplified_phrase: raised a dead man to life, bringing him back from death
  preserved_meaning: Elijah restored one man who had died to life.
  reasoning_layer_used: Hebrew lexical decisions and immediate context
  rationale: This replaces the abrupt word “corpse” while retaining the image of raising the dead.
- pob_phrase: from Sheol
  simplified_phrase: from Sheol, the realm of the dead
  preserved_meaning: The man was brought back from the biblical realm of death.
  reasoning_layer_used: Hebrew lexical decision confirmed by the Greek parallel
  rationale: The biblical term remains, with a brief explanation for unfamiliar readers.
- pob_phrase: by the will of Yahweh
  simplified_phrase: by the will of the LORD
  preserved_meaning: The miracle occurred through the LORD’s will rather than Elijah’s independent power.
  reasoning_layer_used: Hebrew primary witness and divine-name policy
  rationale: This follows the audited Hebrew reading and the project’s standard form of the divine name.
interpretive_expansions:
- pob_phrase: raised up
  rendering: raised a dead man to life
  claim: The raising means that the dead man was restored to life.
  evidence:
  - The lexical rationale identifies the act as bringing the dead back to life.
  - The object is a singular person who had died.
  confidence: high
  alternatives_preserved:
  - The wording does not specify later resurrection theology.
  external_witnesses:
  - The Greek parallel uses language of raising a dead person.
- pob_phrase: Sheol
  rendering: Sheol, the realm of the dead
  claim: Sheol refers here to the realm associated with the dead.
  evidence:
  - The Hebrew lexical rationale identifies an underworld or death-realm sense.
  - The Greek parallel uses Hades as its corresponding term.
  confidence: high
  alternatives_preserved:
  - The term is not reduced to the physical grave.
  - The Hebrew name Sheol remains in the text.
  external_witnesses:
  - The Greek parallel supports the death-realm sense.
translation_notes:
  risk_flags:
