    mitigation: The draft follows the lexical rationale because it preserves the singular dead person without an unnecessarily physical tone.
  - risk: Explaining Sheol as the realm of the dead may sound more definite than the term’s full biblical range.
    mitigation: The draft retains “Sheol” and uses the explanation only as a contextual gloss.
