translation:
  language: en
  text: In his time, Sennacherib advanced and sent Rabshakeh.[a] Sennacherib stretched out his hand to attack Zion, and in his pride he blasphemed.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rabshakeh is an Assyrian title.
    reason: cultural_note
  - marker: b
    text: The Greek parallel says, “he boasted in his arrogance.” The main text follows the surviving Hebrew, which speaks of blasphemy.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: In his days Sennacherib came up
  simplified_phrase: In his time, Sennacherib advanced
  preserved_meaning: Sennacherib made a military advance during that period.
  reasoning_layer_used: Lexical rationale for עלה and narrative context
  rationale: “Advanced” makes the military sense of “came up” immediately clear.
- pob_phrase: he stretched out his hand against Zion
  simplified_phrase: Sennacherib stretched out his hand to attack Zion
  preserved_meaning: Sennacherib remains the actor, and the hostile hand image against Zion is preserved.
  reasoning_layer_used: Lexical rationale for ויט ידו and על ציון
  rationale: Naming Sennacherib prevents pronoun confusion, while “to attack” clarifies the gesture’s hostility.
- pob_phrase: blasphemed in his pride
  simplified_phrase: in his pride he blasphemed
  preserved_meaning: His arrogant, impious speech remains the controlling Hebrew-based reading.
  reasoning_layer_used: Lexical and theological decisions for ויגדף and בגאונו
  rationale: Natural clause order improves readability while preserving the theological force.
