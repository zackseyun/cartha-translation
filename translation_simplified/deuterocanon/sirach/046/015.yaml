translation:
  language: en
  text: Because his speech was trustworthy,[a] people sought him out as a seer.[b] By what he said, people recognized him as a faithful shepherd.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Because of the faith of his speech”; the Hebrew more naturally means that his speech was reliable.
    reason: lexical_alternative
  - marker: b
    text: The Greek reads “prophet” instead of the Hebrew “seer.”
    reason: alternative_reading
  - marker: c
    text: The Hebrew is compressed; it may mean that his words showed that he was a faithful shepherd.
    reason: textual_variant
