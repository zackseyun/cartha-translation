translation:
  language: en
  text: He called to God Most High for help when his enemies closed in on him from every side. God Most High answered him with hailstones and stones of ice.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says, “The great Lord heard him/them in stones of hail, with mighty power.” It describes the storm more expansively.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: called on God Most High
  simplified_phrase: called to God Most High for help
  preserved_meaning: He appealed to God Most High in his distress.
  reasoning_layer_used: Lexical decision for קרא אל
  rationale: “For help” makes the prayer sense of the Hebrew idiom clear.
- pob_phrase: his enemies pressed him from all around
  simplified_phrase: his enemies closed in on him from every side
  preserved_meaning: Surrounding enemies put him under hostile pressure.
  reasoning_layer_used: Hebrew clause clarified by the Greek parallel
  rationale: “Closed in” naturally conveys both encirclement and danger.
- pob_phrase: hailstones and ice-stones
  simplified_phrase: hailstones and stones of ice
  preserved_meaning: God answered through two distinct storm images involving hail and ice.
  reasoning_layer_used: Lexical decisions for באבני ברד and ואלגביש
  rationale: The wording clarifies the rare second image without merging it with hail.
interpretive_expansions:
- pob_phrase: called on
  rendering: called to ... for help
  claim: His call was an appeal to God for aid.
  evidence:
  - The Hebrew idiom קרא אל commonly expresses calling upon someone for help.
  - The Greek ἐπεκαλέσατο supports the sense of invocation.
  confidence: high
  alternatives_preserved:
  - called on
  - invoked
translation_notes:
  risk_flags:
  - risk: “Stones of ice” may sound unusual to modern readers.
    mitigation: The concrete wording preserves the Hebrew’s second storm term as distinct from ordinary hail.
