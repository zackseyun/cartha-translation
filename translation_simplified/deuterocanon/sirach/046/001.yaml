translation:
  language: en
  text: Joshua son of Nun was a mighty warrior and Moses’ assistant in prophecy.[a] In his time, he was appointed to be a great salvation[b] for his chosen ones.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew wording is compact and unclear; the Greek reads “Moses’ successor in prophecy.”
    reason: alternative_reading
  - marker: b
    text: “Great salvation” can also mean “great deliverance” or “great victory,” especially in this military setting.
    reason: lexical_alternative
  - marker: c
    text: “His chosen ones” most likely means God’s chosen people, but the wording does not identify “his” explicitly.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Moses’ attendant in prophecy
  simplified_phrase: Moses’ assistant in prophecy
  preserved_meaning: Joshua served Moses in an official role connected with prophecy.
  reasoning_layer_used: Lexical decision for משרת משה and theological decision on בנבואה
  rationale: “Assistant” is common English, while “in prophecy” preserves the Hebrew phrase’s uncertainty.
- pob_phrase: he was appointed in his days
  simplified_phrase: In his time, he was appointed
  preserved_meaning: Joshua was appointed for this role during his lifetime.
  reasoning_layer_used: Lexical decisions for אשר נוצר and להיות בימיו, with the POB main-text choice
  rationale: The reordered wording is natural and avoids suggesting that Joshua was physically formed then.
- pob_phrase: to be a great salvation for
  simplified_phrase: to be a great salvation for
  preserved_meaning: Joshua himself is presented as a great saving deliverance for the chosen ones.
  reasoning_layer_used: Lexical and theological decisions for תשועה גדולה
  rationale: Keeping the predicate avoids adding an unsupported claim that Joshua brought salvation.
translation_notes:
  risk_flags:
  - risk: “Assistant in prophecy” remains unusual because the Hebrew relationship is not fully clear.
    mitigation: Footnote a preserves the Greek succession reading without placing it in the main text.
  - risk: Readers may assume that “his chosen ones” certainly refers to God’s people.
    mitigation: Footnote c gives the likely referent while preserving the pronoun’s ambiguity.
