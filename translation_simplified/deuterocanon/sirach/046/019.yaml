translation:
  language: en
  text: Until the end of his life, Yahweh found him faithful. He said, “Have I taken a ransom[1] and hidden it? From whom have I taken anything?” No one brought a charge against him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: The Hebrew word translated “ransom” may mean “bribe” here, while the Greek witness refers more broadly to money.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Even up to the time of his end
  simplified_phrase: Until the end of his life
  preserved_meaning: Samuel remained faithful through the final period of his life.
  reasoning_layer_used: Hebrew lexical decision
  rationale: This gives the Hebrew time expression in ordinary English without adopting the Greek expansion.
- pob_phrase: I have taken a ransom and hidden it—from whom have I taken anything?
  simplified_phrase: Have I taken a ransom and hidden it? From whom have I taken anything?
  preserved_meaning: Samuel denies both concealing a payment and taking anything from anyone.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Two questions preserve the distinct ideas and the broad force of “anything.”
- pob_phrase: no man answered against him
  simplified_phrase: No one brought a charge against him
  preserved_meaning: No person accused Samuel in response to his denial.
  reasoning_layer_used: Hebrew lexical rationale and Greek parallel
  rationale: The forensic wording clearly expresses the supported sense in natural English.
interpretive_expansions:
- pob_phrase: no man answered against him
  rendering: No one brought a charge against him
  claim: The response against Samuel refers to making an accusation or charge.
  evidence:
  - The POB lexical rationale says the Hebrew construction can indicate accusing or testifying against someone.
  - The Greek parallel explicitly says that no person brought a charge against him.
  confidence: high
  alternatives_preserved:
  - No one answered against him
  - No one accused him
  external_witnesses:
  - Greek parallel in Sirach 46:19
translation_notes:
  risk_flags:
  - risk: “Ransom” may sound legitimate although “bribe” is contextually possible.
    mitigation: The footnote preserves “bribe” and the Greek witness’s broader reference to money.
  - risk: Turning the terse first clause into a question interprets it as a rhetorical denial.
    mitigation: The separate questions retain the payment, concealment, and broader challenge without merging them.
