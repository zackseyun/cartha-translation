translation:
  language: en
  text: He brought destruction crashing down on an enemy nation. As they fled, he wiped them all out. He did this so that every nation would know their ban—their devoted destruction under divine judgment. For Yahweh watches over their battle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek version differs notably, speaking of war against a nation, the destruction of those who resisted, and a battle fought before the Lord.
    reason: alternative_reading
