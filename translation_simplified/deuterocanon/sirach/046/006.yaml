  preserved_meaning: Destruction is pictured as being cast forcefully upon a hostile people.
  reasoning_layer_used: lexical decision for השליך and גוי אויב
  rationale: The new wording keeps the violent casting image in more natural English.
- pob_phrase: and as they fled he wiped them all out, so that
  simplified_phrase: As they fled, he wiped them all out. He did this so that
  preserved_meaning: Their total destruction during flight serves the stated purpose that follows.
  reasoning_layer_used: lexical decisions for ובנוסם, האביד כולם, and למען דעת
  rationale: Two sentences make the action and its purpose easier to follow.
- pob_phrase: their ban
  simplified_phrase: their ban—their devoted destruction under divine judgment
  preserved_meaning: The enemy nation is placed under the covenant-war ban of destruction.
  reasoning_layer_used: lexical and theological decisions for חרם
  rationale: The key term remains while its otherwise opaque meaning is explained.
