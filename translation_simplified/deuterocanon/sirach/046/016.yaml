translation:
  language: en
  text: He also called on God when enemies surrounded him and pressed in from every side.[a] When he offered a milk-fed lamb,[b] Yahweh thundered from heaven.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Hebrew wording is difficult; the Greek parallel supports the sense that enemies surrounded and pressed him.
    reason: textual_variant
  - marker: b
    text: Or “a suckling lamb.”
    reason: lexical_alternative
