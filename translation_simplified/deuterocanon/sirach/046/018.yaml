translation:
  language: en
  text: As he lay resting on his bed, he testified before the LORD and the LORD’s anointed one.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew for “anointed one” comes from the same root as “Messiah” and may refer to the LORD’s anointed ruler in Samuel’s day.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek text differs greatly: it says that he “crushed the leaders of Tyre and all the rulers of the Philistines.”'
    reason: textual_variant
simplification_decisions:
- pob_phrase: And at the time of his resting on his bed
  simplified_phrase: As he lay resting on his bed
  preserved_meaning: Samuel is pictured resting on his bed, probably near the end of his life.
  reasoning_layer_used: Hebrew lexical decisions for נוחו and על משכבו
  rationale: The recast temporal clause is natural English without making “deathbed” explicit.
- pob_phrase: Yahweh and his anointed one
  simplified_phrase: the LORD and the LORD’s anointed one
  preserved_meaning: The title refers to the ruler anointed by the LORD without naming him or imposing later messianic meaning.
  reasoning_layer_used: Lexical and theological decisions for יהוה and משיחו
  rationale: Repeating “the LORD” makes the pronoun clear and follows the project’s divine-name policy.
translation_notes:
  risk_flags:
  - risk: “Testified before” may not convey the possible sense of calling the LORD and his anointed one as witnesses.
    mitigation: The wording follows the adjudicated POB revision while avoiding a stronger unresolved interpretation.
  - risk: The Hebrew and Greek witnesses preserve substantially different content here.
    mitigation: Footnote b gives the Greek reading rather than silently harmonizing it.
