simplification_decisions:
- pob_phrase: all the offspring of Jacob
  simplified_phrase: everyone descended from Jacob
  preserved_meaning: The phrase still refers collectively to all Jacob’s descendants.
  reasoning_layer_used: lexical decision and Hebrew-primary theological decision
  rationale: This uses familiar family language while retaining Jacob rather than adopting the Greek reading “Israel.”
- pob_phrase: to fully follow Yahweh
  simplified_phrase: to follow Yahweh fully
  preserved_meaning: Following Yahweh involves complete directed allegiance.
  reasoning_layer_used: lexical decision, theological decision, and Greek cross-check
  rationale: Natural English word order keeps both the following image and the force of “fully.”
