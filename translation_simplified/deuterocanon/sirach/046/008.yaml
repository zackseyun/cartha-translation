translation:
  language: en
  text: So these two also were spared from among six hundred thousand foot soldiers,[a] so that they could be brought into the land that was their inheritance—a land flowing with milk and honey.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew phrase is difficult and may mean that the two were kept alive through the years or into old age; the Greek simply says that the two were saved.
    reason: textual_variant
  - marker: b
    text: The words about entering the inherited land appear in the Greek parallel but not in the shorter surviving Hebrew text.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Therefore those two also were spared
  simplified_phrase: So these two also were spared
  preserved_meaning: Their survival follows from what the preceding verse describes.
  reasoning_layer_used: POB lexical decisions for לכן and גם הם
  rationale: “So” states the causal link in direct modern English while retaining the two-person reference.
- pob_phrase: out of six hundred thousand foot soldiers
  simplified_phrase: from among six hundred thousand foot soldiers
  preserved_meaning: The two were spared from the much larger body of men on foot.
  reasoning_layer_used: POB lexical decision for משש מאות אלף רגלי
  rationale: “From among” makes the relationship between the survivors and the larger group immediately clear.
- pob_phrase: to bring them into an inheritance
  simplified_phrase: so that they could be brought into the land that was their inheritance
  preserved_meaning: The two survivors themselves entered the land assigned to them as an inheritance.
  reasoning_layer_used: Greek parallel and POB theological decision
  rationale: The passive wording preserves the Greek object while explaining the opaque inheritance phrase.
interpretive_expansions:
- pob_phrase: into an inheritance
  rendering: into the land that was their inheritance
  claim: The inheritance is the promised land into which the two survivors were brought.
  evidence:
  - The Greek continues with “into a land flowing with milk and honey.”
  - The POB rationale identifies the inheritance as covenant land.
  confidence: high
  alternatives_preserved:
  - into an inheritance
  - into their inheritance
