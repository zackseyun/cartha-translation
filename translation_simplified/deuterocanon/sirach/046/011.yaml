translation:
  language: en
  text: May the memory of the judges be a blessing—each one by name, everyone whose heart was not led astray[a] and who did not turn away from God.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “did not lift up the heart,” while the Greek clarifies the sense as the heart not going astray.
    reason: lexical_alternative
  - marker: b
    text: The Greek reads “the Lord,” while the Hebrew reads “God.”
    reason: alternative_reading
simplification_decisions:
