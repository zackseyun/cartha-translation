  preserved_meaning: The judges are commemorated individually rather than only as a group.
  reasoning_layer_used: Lexical decision for איש בשמו
  rationale: “Each one by name” expresses the individual focus in natural English.
- pob_phrase: everyone whose heart was not led astray
  simplified_phrase: everyone whose heart was not led astray
  preserved_meaning: The honored judges remained faithful in heart.
  reasoning_layer_used: Theological decision informed by the Greek parallel
  rationale: The POB wording clearly preserves the Greek-supported sense of covenant unfaithfulness.
- pob_phrase: may their memory be for blessing
  simplified_phrase: May the memory of the judges be a blessing
  preserved_meaning: The judges’ remembrance is invoked as blessed and blessing-bearing.
  reasoning_layer_used: Lexical decision for יהי זכרם לברכה
  rationale: The recast blessing forms a complete sentence without adding a second petition.
