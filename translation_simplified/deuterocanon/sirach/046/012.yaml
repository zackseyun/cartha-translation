translation:
  language: en
  text: May their bones blossom like a lily,[a] and may their name live on through their sons.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel adds “from their place” after “blossom.”
    reason: alternative_reading
  - marker: b
    text: The Hebrew may also be translated, “may their name be renewed in their sons.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: may their name be renewed in their sons
  simplified_phrase: may their name live on through their sons
  preserved_meaning: Their honored name continues in the next generation of sons.
  reasoning_layer_used: Lexical decision for תחליף and לבניהם
  rationale: “Live on through” makes the Hebrew idea of renewal by succession clear in ordinary English.
- pob_phrase: their bones blossom like a lily
  simplified_phrase: their bones blossom like a lily
  preserved_meaning: The concrete image links their resting bones with new flowering and lasting honor.
  reasoning_layer_used: Lexical decisions for עצמותם, תפרחנה, and כשושנה
  rationale: The striking image is already concise and must not be reduced to the abstract word “flourish.”
interpretive_expansions:
- pob_phrase: their name be renewed in their sons
  rendering: their name live on through their sons
  claim: Their name continues through succeeding sons rather than being merely replaced.
  evidence:
  - The Hebrew verb תחליף can express renewal or succession.
  - The memorial context concerns the continuation of an honored name.
  - The Greek parallel also points to continuation in honored sons.
  confidence: high
  alternatives_preserved:
  - their name be renewed in their sons
  - their name be passed on through their sons
translation_notes:
  risk_flags:
