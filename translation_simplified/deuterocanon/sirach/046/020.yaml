translation:
  language: en
  text: In the sight of everyone alive—and even after he died, people sought him out.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek gives a fuller account: after Samuel died, he prophesied, revealed the king’s end, and spoke from the earth in prophecy to remove the people’s lawlessness. This likely explains why the Hebrew says people sought him out after death.'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: every living thing
  simplified_phrase: everyone alive
  preserved_meaning: The phrase broadly refers to all living people who could witness Samuel’s stature.
  reasoning_layer_used: lexical decision for כל חי
  rationale: This avoids suggesting animals while preserving the intended human scope.
- pob_phrase: he was sought out
  simplified_phrase: people sought him out
  preserved_meaning: Others sought Samuel for inquiry even after his death.
  reasoning_layer_used: lexical decision for נדרש and Greek parallel
  rationale: The active wording is easier to read without identifying who sought him or importing Greek details.
- pob_phrase: after his death
  simplified_phrase: after he died
  preserved_meaning: The seeking occurred following Samuel’s death.
  reasoning_layer_used: lexical decision for אחרי מותו
  rationale: The verbal form is more direct and natural in common English.
translation_notes:
  risk_flags:
  - risk: The Hebrew phrase translated “sought him out” may more specifically mean “consulted him.”
    mitigation: The main text keeps the broader wording, while the footnote preserves the Greek clarification.
