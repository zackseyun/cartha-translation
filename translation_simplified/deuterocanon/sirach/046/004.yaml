translation:
  language: en
  text: Did he not, by his hand, make the sun stand still,[a] so that one day lasted as long as two days?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This recalls the victory when the sun stood still; see Joshua 10:12–14.
    reason: cross_reference
