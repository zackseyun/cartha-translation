  preserved_meaning: The beneficial result comes through people generally, not males only.
  reasoning_layer_used: The lexical note for מבני אדם establishes a generic human reference, while the POB text supports “through.”
  rationale: “Human beings” makes the generic meaning explicit in modern English.
