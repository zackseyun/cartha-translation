translation:
  language: en
  text: Honor the doctor for the care you need from him, because God has given him a share.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek reads, “Honor the physician for his services, for the Lord also created him.” The Hebrew says more literally, “with him also is a share from God.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the physician
  simplified_phrase: the doctor
  preserved_meaning: The person who provides medical care and healing.
  reasoning_layer_used: POB lexical decision for רופא
  rationale: “Doctor” is the ordinary modern term for the same role.
- pob_phrase: according to your need of him
  simplified_phrase: for the care you need from him
  preserved_meaning: Honor is due in view of the doctor’s needed service.
  reasoning_layer_used: POB lexical decision for לפני צרכו
  rationale: This wording makes the practical need for medical care immediately clear.
- pob_phrase: for God has also given him a portion
  simplified_phrase: because God has given him a share
  preserved_meaning: The doctor has a share assigned by God, though its object remains unstated.
  reasoning_layer_used: POB lexical and theological decisions for חלק אל
  rationale: “Share” preserves the Hebrew image without resolving its ambiguity.
translation_notes:
  risk_flags:
  - risk: Modern readers may find the unspecified “share” somewhat unclear.
    mitigation: The wording preserves the Hebrew ambiguity, and the footnote gives both the literal Hebrew and the distinct Greek reading.
