  text: So too, the potter sits at his task and uses his feet to turn the wheel. He is always anxious about his work, and all his work is numbered.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also be rendered “all his work is counted.”
