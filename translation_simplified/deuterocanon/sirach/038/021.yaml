translation:
  language: en
  text: Do not keep dwelling on him, because he will not return.[a] This will not help him, and it will harm you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew more literally says, “because he has no hope,” while the Greek parallel says, “because there is no return.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Do not keep remembering him
  simplified_phrase: Do not keep dwelling on him
  preserved_meaning: The command warns against remaining fixated on the dead, not against every memory of him.
  reasoning_layer_used: POB lexical decision and mourning context
  rationale: “Keep dwelling on” makes the intended ongoing fixation clearer in common English.
- pob_phrase: for there is no return
  simplified_phrase: because he will not return
  preserved_meaning: The dead person will not come back.
  reasoning_layer_used: POB theological decision supported by the Greek parallel
  rationale: The personal wording states the same contextual meaning more directly.
- pob_phrase: you will not help him, and you will harm yourself
  simplified_phrase: This will not help him, and it will harm you
  preserved_meaning: Continued fixation benefits neither the dead person nor the mourner.
  reasoning_layer_used: POB lexical decisions supported by the Greek parallel
  rationale: “This” links both results plainly to the behavior just prohibited.
interpretive_expansions:
- pob_phrase: there is no return
  rendering: he will not return
  claim: The one who died will not come back.
  evidence:
  - The funerary context identifies the person under discussion as dead.
  - The Greek parallel explicitly says that there is no return.
  - The POB theological decision gives this as the controlling contextual sense.
  confidence: high
  alternatives_preserved:
  - because he has no hope
  - because there is no hope for him
translation_notes:
  risk_flags:
  - risk: “Keep dwelling on him” might still be heard as forbidding all remembrance.
    mitigation: The word “keep” signals continued fixation, matching the POB lexical rationale.
  - risk: The main text follows the Greek-supported sense rather than the Hebrew word’s usual sense of “hope.”
    mitigation: The literal Hebrew alternative is preserved in the footnote.
