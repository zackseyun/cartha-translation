translation:
  language: en
  text: A scribe gains wisdom when he has free time, and anyone whose work leaves him less busy will become wise.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Hebrew is difficult and does not closely match the Greek. This translation follows the clearer Greek wording about a scribe gaining wisdom through free time.
    reason: textual_variant
