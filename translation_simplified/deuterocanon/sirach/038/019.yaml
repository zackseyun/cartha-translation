translation:
  language: en
  text: Do not keep your heart fixed on him any longer. Release your hold on his memory,[a] and remember the end.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew wording is difficult; it means moving beyond grief, not erasing all memory of him.
    reason: lexical_alternative
  - marker: b
    text: “The end” may mean his end, your own end, or mortality more generally.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Do not set your heart on him any longer
  simplified_phrase: Do not keep your heart fixed on him any longer
  preserved_meaning: The mourner must stop remaining emotionally fixed on the dead while the Hebrew heart-image remains.
  reasoning_layer_used: Hebrew idiom and POB lexical decision
  rationale: “Keep your heart fixed” makes the continuing emotional attachment clear in natural English.
- pob_phrase: let his memory go
  simplified_phrase: Release your hold on his memory
  preserved_meaning: The command concerns loosening grief's hold rather than completely forgetting the dead.
  reasoning_layer_used: POB lexical rationale and Greek consistency check
  rationale: The revised wording clarifies release without turning the command into forced forgetting.
interpretive_expansions:
- pob_phrase: let his memory go
  rendering: Release your hold on his memory
  claim: The mourner is to loosen an inward attachment to the memory rather than erase it.
  evidence:
  - The POB lexical rationale explicitly distinguishes release from absolute erasure.
  - The mourning context concerns prolonged grief.
  - The Greek parallel supports moving beyond grief.
  confidence: moderate
  alternatives_preserved:
  - dismiss his memory
  - release his remembrance
  - forget him
  external_witnesses:
  - Greek parallel
translation_notes:
  risk_flags:
  - risk: The Hebrew verb behind “release” is difficult, and the source record has minor-mismatch status.
    mitigation: A footnote marks the uncertainty and avoids the harsher sense “forget him.”
  - risk: “The end” has no explicit referent in Hebrew.
    mitigation: The main text keeps the phrase broad, and the footnote lists the principal possibilities.
