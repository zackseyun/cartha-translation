translation:
  language: en
  text: But they keep the established order of the age going,[a] and their prayer is bound up with their skilled work.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may refer to the enduring structure of society or, more broadly, the established order of the world.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: sustain the order of the age
  simplified_phrase: keep the established order of the age going
  preserved_meaning: Artisans continually support and stabilize the enduring order in which people live.
  reasoning_layer_used: Lexical decisions for κτίσμα, αἰῶνος, and στηρίσουσιν
  rationale: The active wording clearly conveys their continuing support without narrowing what “the age” means.
- pob_phrase: their prayer is in the work of their craft
  simplified_phrase: their prayer is bound up with their skilled work
  preserved_meaning: Their prayer is closely connected with the labor of their craft.
  reasoning_layer_used: Lexical and theological decisions for δέησις, ἐν ἐργασίᾳ, and τέχνης
  rationale: This removes the opaque phrase “is in” while preserving the close link between prayer and work.
translation_notes:
  risk_flags:
  - risk: “Established order” may sound limited to government or social hierarchy.
    mitigation: The footnote preserves the broader possibilities of enduring society and the world's order.
  - risk: “Bound up with” may imply that work expresses prayer rather than merely accompanying it.
    mitigation: The wording links prayer and work without saying that work replaces spoken prayer.
