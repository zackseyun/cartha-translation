  simplified_phrase: for the person who has died
  preserved_meaning: The tears are shed because a person has died.
  reasoning_layer_used: POB lexical decision for על המת
  rationale: This replaces an impersonal expression with clear, natural English.
- pob_phrase: be bitter
  simplified_phrase: grieve bitterly
  preserved_meaning: The mourner is to enter deeply into bitter grief.
  reasoning_layer_used: POB lexical decision for התמרר and immediate context
  rationale: Naming grief clarifies the kind of bitterness without weakening it.
- pob_phrase: the lament
  simplified_phrase: the lament
  preserved_meaning: The verse calls for beginning a formal expression of mourning.
  reasoning_layer_used: POB lexical decision for קינה and Greek parallel
  rationale: Retaining “lament” avoids implying that the mourning must be sung.
interpretive_expansions:
