translation:
  language: en
  text: My son, shed tears for the person who has died. Grieve bitterly, and begin the lament.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The final Hebrew verb is difficult to understand. The Greek parallel supports “begin the lament.”
    reason: textual_variant
