translation:
  language: en
  text: My son, mourn bitterly, and carry the funeral lament through to the end. Mourn for him in the way that is fitting for him. Shed tears for a day or two so that others will not criticize you.[a] Then let yourself be comforted because of your grief.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew wording is uncertain; the Greek suggests avoiding criticism for neglecting proper mourning.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew may also mean “because of affliction” or “because of iniquity”; the Greek supports “because of grief.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: make the mourning bitter and complete the lament
  simplified_phrase: mourn bitterly, and carry the funeral lament through to the end
  preserved_meaning: The bitter image conveys vigorous mourning, and the funeral lament must be fully carried out.
  reasoning_layer_used: Hebrew lexical decisions for המר, והתם, and מספד
  rationale: The natural commands preserve both the intensity and completion of the lament.
- pob_phrase: perform his mourning as is fitting for him
  simplified_phrase: Mourn for him in the way that is fitting for him
  preserved_meaning: The deceased should receive the mourning properly due to him.
  reasoning_layer_used: Hebrew lexical decisions for אבלו and כיוצא בו, confirmed by the Greek parallel
  rationale: The direct wording removes the awkward expression “perform his mourning.”
- pob_phrase: then be comforted because of grief
  simplified_phrase: Then let yourself be comforted because of your grief
  preserved_meaning: After active mourning, the mourner should turn toward consolation because of sorrow.
  reasoning_layer_used: Hebrew lexical decisions for הנחם and בעבור עון, with Greek clarification
  rationale: The wording makes the reflexive command natural while retaining the causal relation.
interpretive_expansions:
- pob_phrase: because of slander
  rendering: so that others will not criticize you
  claim: The brief public weeping is intended to prevent criticism for neglecting proper mourning.
  evidence:
  - The POB footnote identifies avoidance of social criticism as the likely sense.
  - The Greek parallel reads “for the sake of slander/reproach.”
  confidence: moderate
  alternatives_preserved:
  - because of slander
  - because of reproach
