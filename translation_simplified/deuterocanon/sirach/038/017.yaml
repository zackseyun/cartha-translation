    mitigation: Footnote a preserves the uncertainty while the text follows the POB’s likely social sense.
  - risk: The final Hebrew word may denote affliction or iniquity rather than grief.
    mitigation: Footnote b records the alternatives while retaining the POB’s Greek-supported reading.
