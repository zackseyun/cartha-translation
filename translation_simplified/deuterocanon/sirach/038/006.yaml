  - The POB lexical decision includes “to be glorified” as an alternative.
  confidence: moderate
  alternatives_preserved:
  - People glorying in God
  - People boasting or exulting in God's might
  external_witnesses:
  - 'Greek parallel: ἐνδοξάζεσθαι'
- pob_phrase: his might
  rendering: his mighty works
  claim: God's might is understood as power displayed in his works.
  evidence:
  - The Greek parallel reads “his wondrous things.”
  - The POB theological decision identifies God as the pronoun's referent.
  confidence: high
  alternatives_preserved:
  - God's might understood as abstract power
  external_witnesses:
  - 'Greek parallel: ἐν τοῖς θαυμασίοις αὐτοῦ'
