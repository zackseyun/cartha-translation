translation:
  language: en
  text: He gave people understanding so that he might be glorified through his mighty works.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew phrase can also mean “to glory” or “to boast in his might.” The Greek says that God may be glorified through his wondrous works.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: gave man understanding
  simplified_phrase: gave people understanding
  preserved_meaning: God gave understanding to humanity in general.
  reasoning_layer_used: POB lexical decision and Greek parallel
  rationale: “People” clearly expresses the collective human sense without suggesting only males.
- pob_phrase: to glory in his might
  simplified_phrase: so that he might be glorified through his mighty works
  preserved_meaning: The understanding God gives is connected with his receiving glory through his displayed power.
  reasoning_layer_used: POB lexical and theological decisions, Greek parallel, and grounding review
  rationale: The passive wording avoids fixing people as the actors while the note preserves the Hebrew alternatives.
interpretive_expansions:
- pob_phrase: to glory
  rendering: he might be glorified
  claim: The clause may present God as the one receiving glory rather than people as the explicit actors.
  evidence:
