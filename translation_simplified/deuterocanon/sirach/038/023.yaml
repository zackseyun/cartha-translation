translation:
  language: en
  text: The wisdom of a scribe makes wisdom grow. Whoever is free from the demands of work[a] will become wise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “lacking occupation or business.” The Greek parallel supports the sense of having rest or leisure rather than being unemployed.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: A scribe’s wisdom increases wisdom
  simplified_phrase: The wisdom of a scribe makes wisdom grow
  preserved_meaning: A scribe’s wisdom causes wisdom to increase.
  reasoning_layer_used: Hebrew lexical decision for תרבה
  rationale: “Makes wisdom grow” expresses the causative idea in more familiar English.
- pob_phrase: one free from busyness
  simplified_phrase: whoever is free from the demands of work
  preserved_meaning: Freedom from pressing occupations allows time for gaining wisdom.
  reasoning_layer_used: Hebrew idiom, Greek parallel, and immediate context
  rationale: The new wording avoids vague “busyness” without suggesting unemployment.
- pob_phrase: and one ... will become wise
  simplified_phrase: Whoever ... will become wise
  preserved_meaning: A person with such freedom will attain wisdom.
  reasoning_layer_used: Hebrew lexical decision for יתחכם
  rationale: A separate sentence makes the contrast easier to follow while retaining the promise.
interpretive_expansions:
- pob_phrase: free from busyness
  rendering: free from the demands of work
  claim: The busyness in view is the pressure of occupation or practical labor.
  evidence:
  - The Hebrew עסק can mean occupation, business, or work.
  - The surrounding context contrasts trades with a scribe’s study.
  - The Greek parallel emphasizes rest or leisure.
  confidence: high
  alternatives_preserved:
  - lacking occupation or business
  - having rest or leisure
translation_notes:
  risk_flags:
  - risk: Modern readers may understand the verse as devaluing all work.
    mitigation: “Demands of work” limits the statement to work pressures that leave little room for study.
