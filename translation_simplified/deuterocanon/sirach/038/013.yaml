translation:
  language: en
  text: For there are times when a physician’s hands can bring a good outcome,[a] because he too will earnestly plead with God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek reads “their hands”; the Hebrew has the singular “his hands.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: there is a time when success is in his hands
  simplified_phrase: there are times when a physician’s hands can bring a good outcome
  preserved_meaning: At times, a physician’s practical skill can help produce a successful result.
  reasoning_layer_used: Hebrew idiom, lexical rationale, and theological decision
  rationale: This keeps the image of the hands while making the physician’s contingent agency clear.
- pob_phrase: will make supplication to God
  simplified_phrase: will earnestly plead with God
  preserved_meaning: The physician turns to God in earnest prayer.
  reasoning_layer_used: Lexical rationale and theological decision
  rationale: “Earnestly plead” is common English that preserves the force of supplication.
interpretive_expansions:
- pob_phrase: his hands
  rendering: a physician’s hands
  claim: The singular pronoun refers to a physician in the surrounding context.
  evidence:
  - The lexical rationale identifies the physician as the agent.
  - The theological decision describes the physician’s real but dependent medical success.
  confidence: high
  alternatives_preserved:
  - The Greek plural “their hands” is preserved in the footnote.
translation_notes:
  risk_flags:
  - risk: “Because” may suggest that prayer guarantees medical success.
    mitigation: “There are times” and “can” preserve the limited, contingent claim.
