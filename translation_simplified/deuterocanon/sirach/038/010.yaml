    text: The surviving Hebrew is difficult here; the Greek parallel supports the sense of setting one’s actions right.
    reason: textual_variant
  - marker: b
    text: Or “every transgression”; the Hebrew can refer especially to rebellious offenses.
    reason: lexical_alternative
