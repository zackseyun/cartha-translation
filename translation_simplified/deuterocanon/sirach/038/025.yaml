translation:
  language: en
  text: How can someone who guides a plow become wise,[a] when he drives an ox and keeps his mind on the cattle?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The opening Hebrew is difficult; the Greek parallel more explicitly describes someone holding a plow and driving oxen.
    reason: alternative_reading
  - marker: b
    text: Or “talks about the cattle”; the Hebrew may refer either to his thoughts and concerns or to his speech.
    reason: lexical_alternative
