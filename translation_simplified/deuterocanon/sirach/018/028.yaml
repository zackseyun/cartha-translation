translation:
  language: en
  text: Every man with good judgment has come to recognize wisdom,[a] and he will praise the one who found her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Every prudent person has recognized wisdom and will praise the one who found it.” The Greek uses a masculine singular expression for the discerning person and refers to wisdom as “her.”
    reason: lexical_alternative
