translation:
  language: en
  text: He saw and understood that their end would be terrible.[a] So he increased his atonement for them.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “End” may also be rendered “destruction” or “ruin.”
    reason: lexical_alternative
  - marker: b
    text: Atonement here concerns the removal of offense or guilt.
    reason: simplification_note
simplification_decisions:
- pob_phrase: saw and recognized
  simplified_phrase: saw and understood
  preserved_meaning: He moved from seeing their condition to fully grasping it.
  reasoning_layer_used: Lexical decision for ἐπέγνω.
  rationale: “Understood” expresses the progression in familiar English.
- pob_phrase: their destruction was evil
  simplified_phrase: their end would be terrible
  preserved_meaning: Their coming outcome would be grievous and disastrous.
  reasoning_layer_used: Lexical rationales for καταστροφή and πονηρά.
  rationale: This avoids awkwardly equating destruction with fate while stating the contextual sense clearly.
- pob_phrase: therefore he multiplied his atonement for them
  simplified_phrase: So he increased his atonement for them
  preserved_meaning: Because of their terrible end, he made his atonement more abundant for them.
  reasoning_layer_used: Lexical and theological decisions for ἐπλήθυνεν and ἐξιλασμός.
  rationale: “Increased” is natural English, while “atonement” retains the theological force.
interpretive_expansions:
- pob_phrase: their destruction was evil
  rendering: their end would be terrible
  claim: “Evil” describes the grievous and disastrous quality of their outcome.
  evidence:
  - The lexical rationale says πονηρά describes the human outcome rather than moral character alone.
  - The rationale for καταστροφή permits “end” as the contextual sense.
  confidence: high
  alternatives_preserved:
  - their destruction was evil
  - their ruin was grievous
translation_notes:
  risk_flags:
  - risk: “End” is less forceful than “destruction.”
    mitigation: The footnote preserves “destruction” and “ruin” as lexical alternatives.
  - risk: “For them” is implicit rather than directly expressed in the Greek.
    mitigation: It remains because the latest POB revision identifies it as the intended idiomatic object.
