translation:
  language: en
  text: Examine yourself before judgment comes. Then, when the time of visitation comes, you will find atonement.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Time of visitation” can mean a time of inspection, reckoning, or divine intervention. “Atonement” means the removal of guilt and restoration of favor; it may also be translated “expiation” or “propitiation.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Before judgment, examine yourself
  simplified_phrase: Examine yourself before judgment comes
  preserved_meaning: Self-examination must take place before judgment.
  reasoning_layer_used: POB lexical decisions for πρὸ κρίσεως and ἐξέταζε σεαυτόν
  rationale: Leading with the command and adding “comes” makes the timing natural and clear.
- pob_phrase: in the hour of visitation
  simplified_phrase: when the time of visitation comes
  preserved_meaning: A decisive time of inspection, reckoning, or divine intervention will come.
  reasoning_layer_used: POB lexical and theological decisions for ἐν ὥρᾳ ἐπισκοπῆς
  rationale: “Time” is clearer than “hour,” while “visitation” preserves the documented ambiguity.
