translation:
  language: en
  text: A person's mercy reaches their neighbor, but the Lord's mercy reaches all flesh—all creaturely life. He rebukes, disciplines, and teaches, and like a shepherd he brings his flock back.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: A man's mercy is for his neighbor
  simplified_phrase: A person's mercy reaches their neighbor
  preserved_meaning: Ordinary human mercy is directed toward another person.
  reasoning_layer_used: POB lexical decisions for ἀνθρώπου, ἔλεος, and πλησίον
  rationale: The generic “person” and active verb express the contrast naturally without changing its scope.
- pob_phrase: the Lord's mercy is for all flesh
  simplified_phrase: the Lord's mercy reaches all flesh—all creaturely life
  preserved_meaning: The Lord's mercy extends broadly across creaturely life.
  reasoning_layer_used: POB lexical and theological decisions on πᾶσαν σάρκα
  rationale: The wording preserves the biblical image while explaining it for readers unfamiliar with the idiom.
- pob_phrase: turns back his flock like a shepherd
  simplified_phrase: like a shepherd he brings his flock back
  preserved_meaning: The Lord restores his flock as a shepherd recovers those who have strayed.
  reasoning_layer_used: POB lexical decisions for ἐπιστρέφων, ποιμήν, and ποίμνιον
  rationale: “Brings his flock back” keeps the return image and clearly reserves the flock for the final pastoral action.
interpretive_expansions:
- pob_phrase: all flesh
  rendering: all flesh—all creaturely life
  claim: The phrase broadly concerns creaturely life, not the Pauline idea of sinful human nature.
  evidence:
  - The POB lexical decision identifies σάρξ here as a broad creaturely term.
  - The POB theological decision preserves its expansive scope.
  confidence: high
  alternatives_preserved:
  - all humanity
  - every living being
translation_notes:
  risk_flags:
  - risk: “All creaturely life” could be taken as definitively including every animal.
    mitigation: Retaining “all flesh” keeps the source idiom and leaves its documented boundary open.
