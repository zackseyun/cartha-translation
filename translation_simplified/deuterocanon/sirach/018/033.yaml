translation:
  language: en
  text: Do not gorge yourself or get drunk when your purse is empty.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The last Hebrew word is difficult; the Greek parallel supports the meaning “in your purse.”
    reason: textual_variant
  - marker: b
    text: The Greek reads, “Do not become poor by feasting on borrowed money when you have nothing in your purse.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: be a glutton and a drunkard
  simplified_phrase: gorge yourself or get drunk
  preserved_meaning: The warning still condemns excessive eating and drinking as paired vices.
  reasoning_layer_used: Hebrew lexical decisions for זוֹלֵל and וְסוֹבֵא
  rationale: Direct actions are easier to understand than labels while retaining the moral force.
- pob_phrase: when there is nothing in your purse
  simplified_phrase: when your purse is empty
  preserved_meaning: The warning applies when the person has no available money.
  reasoning_layer_used: Greek-supported economic reading of the difficult final Hebrew word
  rationale: The familiar image of an empty purse states the same lack more naturally.
