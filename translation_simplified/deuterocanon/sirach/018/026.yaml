- pob_phrase: From morning until evening the time changes
  simplified_phrase: From morning to evening, the times change
  preserved_meaning: Time and circumstances can shift within a single day.
  reasoning_layer_used: POB lexical decisions for ἀπὸ πρωΐθεν ἕως ἑσπέρας and καιρός
  rationale: The plural wording is more natural English while the note preserves the Greek word’s breadth.
- pob_phrase: all things are swift
  simplified_phrase: everything is swift
  preserved_meaning: The broad claim of swiftness remains without limiting it to rapid change.
  reasoning_layer_used: POB lexical and theological decisions for πάντα ἐστὶν ταχινὰ
  rationale: “Everything” is clearer than “all things,” while “swift” avoids adding an unstated verb of change.
- pob_phrase: before the Lord
