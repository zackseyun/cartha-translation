translation:
  language: en
  text: From morning to evening, the times change,[a] and everything is swift in the Lord’s sight.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can also mean “the season” or “the circumstances.”
    reason: lexical_alternative
  - marker: b
