  review_summary: The draft is clearer in presenting desires as something that can direct a person’s actions, and it does not impose a narrow doctrinal category such as sexual lust. However, “wherever” unnecessarily intensifies the first command, and “keep your cravings under control” changes the second from self-restraint away from cravings to regulation of cravings. The recommended wording retains the warranted directional clarification while preserving the Greek command’s separation-focused self-restraint.
