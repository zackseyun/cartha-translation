translation:
  language: en
  text: Remember times of famine when times are plentiful, and poverty and need during days of wealth.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the time of famine in the time of plenty
  simplified_phrase: times of famine when times are plentiful
  preserved_meaning: The wording keeps the contrast between seasons of famine and abundance without making the plenty personal.
  reasoning_layer_used: The lexical decisions for καιρός, λιμός, and πλησμονή identify broad times of famine and material abundance.
  rationale: The recast clause uses natural English while preserving the temporal and economic contrast.
- pob_phrase: and poverty and need in the days of wealth
  simplified_phrase: and poverty and need during days of wealth
  preserved_meaning: Poverty and need remain distinct conditions set against periods of wealth.
  reasoning_layer_used: The lexical and theological decisions require both terms and the concrete contrast with wealth.
  rationale: Using “during” clarifies when these conditions should be remembered without repeating the command.
translation_notes:
  risk_flags:
  - risk: The plural “times” generalizes the singular Greek references to recurring kinds of circumstance.
    mitigation: It preserves the source’s time-or-season sense and avoids narrowing abundance to the reader’s possessions.
