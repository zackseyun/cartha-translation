translation:
  language: en
  text: Do not delight in even a little pleasure,[a] for it ends in poverty.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean “a mere scrap of pleasure”; the Greek parallel instead refers to much luxury.
    reason: lexical_alternative
  - marker: b
    text: The final Hebrew clause is uncertain, but the Greek parallel also warns about the financial cost of indulgence.
    reason: textual_variant
