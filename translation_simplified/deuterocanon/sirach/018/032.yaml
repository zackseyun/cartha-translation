  rationale: “Even a little” expresses the Hebrew sense of smallness in more natural English.
- pob_phrase: for its end is poverty
  simplified_phrase: for it ends in poverty
  preserved_meaning: Pursuing the pleasure has poverty as its outcome.
  reasoning_layer_used: POB lexical decisions for פִּי and רֵישׁוֹ, checked against the Greek parallel
  rationale: The active wording makes the outcome clear without hiding the clause’s uncertainty.
