    mitigation: The immediate context and feminine suffixes strongly identify Wisdom as the referent.
  - risk: The Hebrew and Greek differ in the discovery clause.
    mitigation: The main text follows the extant Hebrew, while footnote [a] preserves the Greek alternative.
