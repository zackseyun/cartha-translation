translation:
  language: en
  text: He will make your heart understand,[a] and what you have longed for will make you wise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel says, “He himself will strengthen your heart, and the desire for wisdom will be granted to you.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: give understanding to your heart
  simplified_phrase: make your heart understand
  preserved_meaning: He personally causes the inner faculty of thought and will to understand.
  reasoning_layer_used: Hebrew lexical decision for יָבִין and לִבֶּךָ
  rationale: The active wording is easier to grasp while preserving the causative verb and the heart image.
- pob_phrase: what you have desired
  simplified_phrase: what you have longed for
  preserved_meaning: The desired thing remains unnamed and is not narrowed to one interpretation.
  reasoning_layer_used: Hebrew lexical decision for אִוִּיתָה
  rationale: “Longed for” expresses desire in natural English without resolving the open reference.
translation_notes:
  risk_flags:
  - risk: Modern readers may hear “heart” as emotion alone.
    mitigation: The verb “understand” signals that the heart includes thought and discernment.
  - risk: The Hebrew line leaves the antecedent of “he” less explicit.
    mitigation: The main text follows POB’s Lord-referent decision, supported by the Greek parallel.
