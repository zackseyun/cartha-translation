simplification_decisions:
- pob_phrase: Keep away from your enemies
  simplified_phrase: Stay away from your enemies
  preserved_meaning: Deliberately keep your distance from people who oppose you.
  reasoning_layer_used: Hebrew lexical decision for הִבָּדֵל, supported by the Greek parallel
  rationale: “Stay away” gives the command in direct, everyday English.
- pob_phrase: be on guard against your friends
  simplified_phrase: stay alert even around your friends
  preserved_meaning: Remain cautious even in the company of people considered friends.
  reasoning_layer_used: Hebrew and Greek relational-term decision plus the lexical decision for הֵשָּׁמֵר
  rationale: The wording keeps the warning vivid without implying that every friend is an enemy.
interpretive_expansions:
- pob_phrase: against your friends
  rendering: even around your friends
  claim: The warning applies even within friendly relationships, not only toward obvious enemies.
  evidence:
  - The proverb contrasts enemies with friends.
  - The lexical rationale says “even with” brings out the warning force.
  - Hebrew “those who love you” supports a close relational setting.
  confidence: high
  alternatives_preserved:
  - those who love you
  - your loved ones
  external_witnesses:
  - 'Greek parallel: “friends”'
translation_notes:
  risk_flags:
  - risk: “Around” is less formally aligned with the Hebrew preposition than “against.”
    mitigation: “Stay alert” preserves the command to guard oneself, while “even” preserves the proverb’s contrast.
