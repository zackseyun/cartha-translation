translation:
  language: en
  text: A faithful friend is a precious bundle that preserves life.[a] Whoever fears the Lord will find such a friend.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “a bundle of life”; the Greek parallel says “a remedy of life.”
    reason: source_note
  - marker: b
    text: The Hebrew wording is difficult here; the Greek parallel reads, “Those who fear the Lord will find him.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: a bundle of life
  simplified_phrase: a precious bundle that preserves life
  preserved_meaning: The concrete bundle image still presents faithful friendship as precious and life-sustaining.
  reasoning_layer_used: Hebrew lexical decision, checked against the Greek parallel
  rationale: The wording explains the unfamiliar image without replacing it with the Greek image of medicine.
- pob_phrase: and one who fears the Lord
  simplified_phrase: Whoever fears the Lord
  preserved_meaning: The statement remains a general wisdom principle about fearing the Lord.
  reasoning_layer_used: Hebrew participle and POB theological decision
  rationale: A new sentence and “whoever” make the general statement easier to follow.
- pob_phrase: will attain him
  simplified_phrase: will find such a friend
  preserved_meaning: The Lord-fearing person will find the faithful friend described in the first sentence.
  reasoning_layer_used: POB lexical decision and Greek parallel
  rationale: “Find such a friend” makes the intended singular referent clear in natural English.
interpretive_expansions:
- pob_phrase: a bundle of life
  rendering: a precious bundle that preserves life
  claim: The image presents a faithful friend as precious and life-preserving.
  evidence:
  - The POB lexical rationale says the Hebrew image evokes something precious, preserved, and life-sustaining.
  - The Greek parallel’s “remedy of life” supports a life-giving sense.
  confidence: high
  alternatives_preserved:
  - a bundle of life
  - a remedy of life
- pob_phrase: him
  rendering: such a friend
  claim: The singular object refers to the faithful friend in the first sentence.
  evidence:
  - The POB lexical rationale identifies the faithful friend as the contextual singular referent.
  - The Greek parallel has a singular object meaning “him.”
  confidence: high
  alternatives_preserved:
  - him
