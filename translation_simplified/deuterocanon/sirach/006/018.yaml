translation:
  language: en
  text: My son, accept instruction while you are young, and as your hair turns gray, you will gain wisdom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “choose instruction,” while the Hebrew says “receive instruction.” Both describe embracing teaching from youth.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: from your youth receive instruction
  simplified_phrase: accept instruction while you are young
  preserved_meaning: The son is urged to embrace formative teaching early in life.
  reasoning_layer_used: Hebrew lexical decisions for קַח, לֶקַח, and מִנְּעוּרֶיךָ
  rationale: Natural English clause order makes the command clear without changing its force.
- pob_phrase: until gray hair you will attain wisdom
  simplified_phrase: as your hair turns gray, you will gain wisdom
  preserved_meaning: Wisdom is attained through a lifelong course extending into old age.
  reasoning_layer_used: Hebrew lexical decisions for וְעַד שֵׂיבָה, תַּשִּׂיג, and חָכְמָה
  rationale: This keeps the gray-hair image while avoiding the sense that old age is a deadline.
translation_notes:
  risk_flags:
  - risk: “As your hair turns gray” may be heard as referring only to the onset of old age.
    mitigation: The movement from youth to gray hair preserves the source’s lifelong span.
