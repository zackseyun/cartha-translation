- pob_phrase: wear her like garments of honor
  simplified_phrase: wear her—Wisdom—like robes of honor
  preserved_meaning: Wisdom is pictured as dignified clothing worn by the reader.
  reasoning_layer_used: Hebrew lexical decision and theological decision on personified Wisdom
  rationale: “Robes” clarifies the dignified clothing image, while “like” preserves the comparison.
- pob_phrase: crown yourself with her like a crown of splendor
  simplified_phrase: place her on your head like a splendid crown
  preserved_meaning: Wisdom is pictured as a crown that brings splendor.
  reasoning_layer_used: Hebrew lexical decisions for עטר and תפארת, with Greek support for the reflexive action
  rationale: The concrete action makes “crown yourself” immediately understandable without losing the crown image.
interpretive_expansions:
