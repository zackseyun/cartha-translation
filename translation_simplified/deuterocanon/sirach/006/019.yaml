    mitigation: The main text follows the surviving Hebrew, and the Greek reading remains in a footnote.
  - risk: “Soon” does not reproduce the Hebrew’s literal word “tomorrow.”
    mitigation: The footnote preserves the literal wording and notes the Greek support for a near-time sense.
