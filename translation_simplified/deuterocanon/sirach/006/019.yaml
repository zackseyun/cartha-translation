translation:
  language: en
  text: Come to her like a farmer who plows and reaps.[a] Wait for her plentiful harvest. Serving her will require only a little work, and soon[b] you will eat her fruit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek reads “plows and sows” instead of “plows and reaps.”
    reason: textual_variant
  - marker: b
    text: The Hebrew literally says “tomorrow,” used here in the sense of “soon”; the Greek also says “quickly.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Draw near to her
  simplified_phrase: Come to her
  preserved_meaning: The command to approach personified Wisdom remains direct.
  reasoning_layer_used: Lexical decision for קְרַב אֵלֶיהָ and the feminine-personification decision
  rationale: “Come to” is more familiar than “draw near to” while preserving the command and feminine pronoun.
- pob_phrase: wait for her abundant produce
  simplified_phrase: Wait for her plentiful harvest
  preserved_meaning: The reader must expect Wisdom’s abundant yield as a farmer awaits a crop.
  reasoning_layer_used: Lexical decisions for וְקַוֵּה and לְרֹב תְּבוּאָתָהּ
  rationale: “Plentiful harvest” makes the farming image immediately clear without reducing its abundance.
- pob_phrase: in her service you will labor only a little
  simplified_phrase: Serving her will require only a little work
  preserved_meaning: Devotion to Wisdom involves comparatively little effort before its reward comes.
  reasoning_layer_used: Lexical decisions for בַעֲבֹדָתָהּ and מְעַט תַּעֲבוֹד
  rationale: The recast sentence replaces formal wording with ordinary English while retaining service, work, and the promised small effort.
