translation:
  language: en
  text: It will eat up your leaves[a] and uproot your fruit.[b] It will leave you like a dry tree.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is difficult here; the Greek parallel supports “your leaves.”
    reason: textual_variant
  - marker: b
    text: Or “destroy your fruit”; the Hebrew verb is uncertain, and the Greek has this broader sense.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: It will consume your leaves
  simplified_phrase: It will eat up your leaves
  preserved_meaning: The destructive action against the tree’s leaves remains vivid.
  reasoning_layer_used: The lexical decision identifies the verb’s literal sense as “eat/consume.”
  rationale: “Eat up” is more familiar than “consume” while retaining the image of destruction.
- pob_phrase: and uproot your fruit, and leave you
  simplified_phrase: and uproot your fruit. It will leave you
  preserved_meaning: The fruit is ruined before the person is left desolate.
  reasoning_layer_used: The POB translation and lexical decisions preserve the progression from leaves to fruit to the whole tree.
  rationale: Dividing the sentence makes the sequence easier to follow without merging its images.
