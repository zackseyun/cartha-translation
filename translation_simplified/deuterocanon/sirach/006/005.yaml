translation:
  language: en
  text: A mouth that speaks sweetly gains friends,[a] and gracious lips offer friendly greetings.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew wording is difficult and may mean “increases those who love him”; the Greek parallel reads “multiplies his friends.”
    reason: alternative_reading
  - marker: b
    text: Or “gracious speech multiplies friendly greetings.” The Hebrew speaks of asking about peace or well-being, while the Greek emphasizes pleasant greetings.
    reason: lexical_alternative
