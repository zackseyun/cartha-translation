translation:
  language: en
  text: Wisdom is hard for a fool, and a person without understanding will not stay with it.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: It is difficult for a fool
  simplified_phrase: Wisdom is hard for a fool
  preserved_meaning: Wisdom is difficult for a morally and intellectually dull person.
  reasoning_layer_used: Hebrew lexical decision and immediate context
  rationale: “Hard” naturally conveys the source image of something rough or difficult to negotiate.
- pob_phrase: one lacking sense
  simplified_phrase: a person without understanding
  preserved_meaning: The Hebrew idiom describes someone who lacks sound judgment or understanding.
  reasoning_layer_used: Hebrew idiom and theological decision
  rationale: This avoids the misleading literal phrase “lacking heart” while remaining non-gendered.
- pob_phrase: will not endure it
  simplified_phrase: will not stay with it
  preserved_meaning: Such a person will not persist in wisdom.
  reasoning_layer_used: Hebrew verb clarified by the Greek parallel
  rationale: “Stay with it” clearly expresses continued perseverance rather than physical endurance.
