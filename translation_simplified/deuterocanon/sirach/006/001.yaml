translation:
  language: en
  text: Do not become an enemy when you should be a friend, because an evil name will inherit shame and disgrace. The same is true of a sinful person who speaks deceptively.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Hebrew lacks the opening warning and ends with the obscure phrase “a possessor of two”; the Greek includes the warning and understands the ending as “double-tongued.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: Do not become an enemy instead of a friend
  simplified_phrase: Do not become an enemy when you should be a friend
  preserved_meaning: The warning contrasts acting as an enemy with being a friend without assuming a former friendship.
  reasoning_layer_used: Greek lexical decision and doctrine realignment
  rationale: This states the contrast naturally without implying that an existing friendship was abandoned.
- pob_phrase: so it is with
  simplified_phrase: The same is true of
  preserved_meaning: The sinful person shares the shame and disgrace associated with an evil name.
  reasoning_layer_used: POB syntax and shared Hebrew-Greek warning
  rationale: A new sentence makes the comparison easier to follow.
- pob_phrase: a sinful man of double tongue
  simplified_phrase: a sinful person who speaks deceptively
  preserved_meaning: The person is sinful and uses duplicitous speech.
  reasoning_layer_used: Hebrew-Greek lexical decision
  rationale: The plain wording communicates the Greek explanation of the obscure Hebrew expression.
interpretive_expansions:
- pob_phrase: of double tongue
  rendering: who speaks deceptively
  claim: The expression describes duplicity in speech.
  evidence:
  - The Greek δίγλωσσος explicitly interprets the obscure Hebrew ending as double-tongued.
  - The POB lexical rationale identifies double-speaking as the likely sense.
  confidence: high
  alternatives_preserved:
  - double-tongued
  - a possessor of two
translation_notes:
  risk_flags:
  - risk: The Hebrew and Greek witnesses differ substantially.
    mitigation: The main text retains the POB composite reading, while the footnote identifies the difference.
  - risk: Rendering the tongue image by its sense removes the metaphor from the main text.
    mitigation: The footnote preserves “double-tongued” and ties the rendering to the Greek witness.
