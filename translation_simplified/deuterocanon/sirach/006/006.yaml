translation:
  language: en
  text: Let many people be at peace with you, but share your private counsel with only one person in a thousand.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek has “your counselors” or “your advisers,” while the Hebrew more personally describes someone trusted with your secret or intimate counsel.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Let those at peace with you be many
  simplified_phrase: Let many people be at peace with you
  preserved_meaning: Many people may live in peace or friendship with you.
  reasoning_layer_used: Hebrew lexical decision and Greek parallel
  rationale: The reordered clause uses ordinary English while retaining the source’s peace-based relationship.
- pob_phrase: your confidant one out of a thousand
  simplified_phrase: share your private counsel with only one person in a thousand
  preserved_meaning: Only a very rare person should be admitted to confidential, intimate counsel.
  reasoning_layer_used: Hebrew lexical and theological decisions
  rationale: This wording explains “confidant” without reducing intimate counsel to secrets alone.
interpretive_expansions:
- pob_phrase: your confidant
  rendering: share your private counsel with
  claim: A confidant is someone admitted to confidential and intimate counsel.
  evidence:
  - The Hebrew expression refers to a person who possesses one’s secret or counsel.
  - The Greek parallel preserves the related counselor or adviser dimension.
  confidence: high
  alternatives_preserved:
  - your counselor
  - your adviser
  external_witnesses:
  - The Greek parallel reads “your counselors.”
translation_notes:
  risk_flags:
  - risk: “Private counsel” may sound more formal than ordinary conversation.
    mitigation: It preserves both the Hebrew confidentiality nuance and the Greek counsel dimension.
