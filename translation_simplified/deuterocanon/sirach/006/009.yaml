translation:
  language: en
  text: Someone who is your friend may turn against you and become your enemy. He will make public the quarrel that brings you shame.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “he will expose the quarrel of your disgrace.” The Hebrew wording is brief and may describe the quarrel itself as shameful or as bringing shame.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: There is a friend who turns into an enemy
  simplified_phrase: Someone who is your friend may turn against you and become your enemy
  preserved_meaning: A friendship can reverse into hostility.
  reasoning_layer_used: POB lexical decisions for יֵשׁ אוֹהֵב and נֶהְפָּךְ לְשׂוֹנֵא
  rationale: The recast sentence makes the reversal of relationship clear in ordinary English.
- pob_phrase: he will expose
  simplified_phrase: He will make public
  preserved_meaning: The former friend reveals what had not been openly known.
  reasoning_layer_used: POB lexical decision for יַחְשֹׂף
  rationale: “Make public” clearly expresses the hostile disclosure meant by “expose.”
- pob_phrase: the quarrel that brings your disgrace
  simplified_phrase: the quarrel that brings you shame
  preserved_meaning: The disclosed conflict becomes a source of shame for the person addressed.
  reasoning_layer_used: POB lexical decisions for רִיב and חֶרְפָּתְךָ
  rationale: “Brings you shame” is more natural than the abstract phrase “brings your disgrace.”
interpretive_expansions:
- pob_phrase: he will expose
  rendering: He will make public
  claim: The enemy reveals the quarrel openly to others.
  evidence:
  - The POB rationale says the former friend makes the shameful dispute public.
  - Hebrew יַחְשֹׂף and Greek ἀποκαλύψει both support disclosure.
  confidence: high
  alternatives_preserved:
  - expose
  - reveal
  external_witnesses:
  - Greek parallel
translation_notes:
  risk_flags:
  - risk: The terse Hebrew construct may mean either a shameful quarrel or a quarrel that causes shame.
    mitigation: The main text retains POB’s causal reading, while the footnote preserves the ambiguity.
