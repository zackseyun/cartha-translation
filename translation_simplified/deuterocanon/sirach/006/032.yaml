translation:
  language: en
  text: My son, if you want wisdom, you will become wise.[a] If you commit yourself to it, you will become shrewd.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says, “If you are willing, child, you will be instructed,” emphasizing instruction rather than becoming wise.
    reason: alternative_reading
  - marker: b
    text: Here “shrewd” means prudent and resourceful, not deceitful.
    reason: lexical_alternative
