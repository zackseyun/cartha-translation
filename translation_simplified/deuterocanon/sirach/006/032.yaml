  preserved_meaning: The Hebrew idiom expresses deliberate attention and commitment.
  reasoning_layer_used: POB cultural note and lexical rationale
  rationale: The clearer English preserves the idiom’s force without requiring explanation.
- pob_phrase: you will become shrewd
  simplified_phrase: you will become shrewd
  preserved_meaning: The result is sharp, practical intelligence in a positive wisdom context.
  reasoning_layer_used: Hebrew lexical decision checked against the Greek parallel
  rationale: The key term is retained because softer wording would lose its sharper edge.
