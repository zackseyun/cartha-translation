translation:
  language: en
  text: When things go well for you, he is just like you. But when trouble comes, he distances himself from you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek reads, “and he will speak boldly to your servants.” The main text follows the available Hebrew, which reads, “he distances himself from you.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: In your prosperity
  simplified_phrase: When things go well for you
  preserved_meaning: The friend identifies with you during favorable circumstances, not only material wealth.
  reasoning_layer_used: Hebrew lexical decision for בְּטוֹבָתְךָ
  rationale: The plain temporal clause expresses the broad sense of good circumstances more naturally.
- pob_phrase: but in your adversity
  simplified_phrase: But when trouble comes
  preserved_meaning: The contrast turns from favorable circumstances to hardship or misfortune.
  reasoning_layer_used: Hebrew lexical decision and poetic contrast for וּבְרָעָתְךָ
  rationale: “Trouble” is more familiar than “adversity” while keeping the broad contrast.
- pob_phrase: he will separate himself from you
  simplified_phrase: he distances himself from you
  preserved_meaning: He deliberately withdraws from the relationship.
  reasoning_layer_used: Hebrew reflexive form יִתְנַדֶּה מִמֶּךָּ
  rationale: “Distances himself” clearly preserves the reflexive image of deliberate separation.
