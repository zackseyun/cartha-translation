translation:
  language: en
  text: The LORD hates evil and all that is detestable. He will not let it happen to those who revere him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel reads, “and it is not acceptable to those who fear him,” instead of the Hebrew wording followed here.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: evil and abomination
  simplified_phrase: evil and all that is detestable
  preserved_meaning: God strongly rejects what is morally evil and abhorrent.
  reasoning_layer_used: Hebrew lexical decisions for רָעָה and תוֹעֵבָה
  rationale: This replaces the difficult term “abomination” while preserving its strong moral force.
- pob_phrase: and he will not permit it
  simplified_phrase: He will not let it happen
  preserved_meaning: The Hebrew presents God as not allowing the evil just named to occur to his people.
  reasoning_layer_used: Hebrew primary-witness decision for וְלֹא יְאַנֶּנָּה
  rationale: A new sentence and common verb make the Hebrew-based reading easier to follow.
- pob_phrase: those who fear him
  simplified_phrase: those who revere him
  preserved_meaning: The phrase describes people who honor God with covenantal reverence, not mere terror.
  reasoning_layer_used: Lexical rationale for לִירֵאָיו
  rationale: “Revere” communicates respectful fear more clearly to modern readers.
translation_notes:
  risk_flags:
  - risk: “Let it happen” could be misunderstood as a promise that reverent people never suffer harm.
    mitigation: The preceding words identify “it” as moral evil and detestable conduct, not calamity in general.
  - risk: The Hebrew and Greek differ substantially in the second sentence.
    mitigation: The main text follows the extant Hebrew, while the Greek reading is preserved in a footnote.
