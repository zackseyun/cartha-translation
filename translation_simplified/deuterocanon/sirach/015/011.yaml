translation:
  language: en
  text: Do not say, “My wrongdoing comes from God,” because God has not done what he hates.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel reads, “Do not say, ‘Through the Lord I fell away,’ for you will not do what he hated.” It differs slightly from the surviving Hebrew.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: My transgression is from God
  simplified_phrase: My wrongdoing comes from God
  preserved_meaning: The speaker must not claim that God is the source of a serious moral offense.
  reasoning_layer_used: Hebrew lexical decision and theological decision on source attribution
  rationale: “Wrongdoing” is more familiar than “transgression,” while “comes from” keeps the Hebrew emphasis on origin.
- pob_phrase: for he has not done what he hates
  simplified_phrase: because God has not done what he hates
  preserved_meaning: God does not commit the evil he condemns.
  reasoning_layer_used: Hebrew syntax and POB lexical rationale
  rationale: “Because” states the connection plainly, and naming God makes the pronoun clear.
interpretive_expansions:
- pob_phrase: he
  rendering: God
  claim: God is the implied subject of both “has not done” and “hates.”
  evidence:
  - God is the named subject in the preceding clause.
  - The POB lexical rationale identifies God as the implied subject.
  confidence: high
  alternatives_preserved:
  - he
translation_notes:
  risk_flags:
