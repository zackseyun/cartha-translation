translation:
  language: en
  text: He will find happiness and joy. He will receive, as his inheritance, a name that lasts forever.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew wording is compressed; it may also be translated, “He will inherit a name that lasts forever.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: gladness and joy
