  preserved_meaning: The paired words still express two closely related forms of joyful delight.
  reasoning_layer_used: POB lexical decisions for שָׂשׂוֹן and שִׂמְחָה
  rationale: “Happiness” is more immediately familiar than “gladness” while keeping the poetic pairing.
- pob_phrase: an everlasting name will be his inheritance
  simplified_phrase: He will receive, as his inheritance, a name that lasts forever
  preserved_meaning: The person receives enduring renown as an inheritance.
  reasoning_layer_used: POB lexical and theological decisions for שֵׂם עוֹלָם and תּוֹרִישֶׁנּוּ
  rationale: The active sentence and ordinary time phrase make the compressed clause easier to understand.
translation_notes:
  risk_flags:
