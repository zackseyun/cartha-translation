    mitigation: The source image is retained because replacing it with “reputation” would over-interpret the metaphor.
  - risk: The active wording may seem to settle the compressed Hebrew syntax.
    mitigation: The footnote preserves the main alternate construction while keeping the shared inheritance meaning.
