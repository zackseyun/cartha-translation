translation:
  language: en
  text: God’s eyes see what a man does,[a][b] and God knows every one of his deeds.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “what a person does.” The Hebrew uses the masculine singular “man” in a general sense.
    reason: lexical_alternative
  - marker: b
    text: The Greek reads, “His eyes are on those who fear him,” instead of the first clause.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: The eyes of God see his works
  simplified_phrase: God’s eyes see what a man does
  preserved_meaning: God sees the human actions in view while the concrete image of his eyes remains.
  reasoning_layer_used: Hebrew lexical decisions and anthropomorphic-language decision
  rationale: The rewrite makes the unclear pronoun explicit without flattening the Hebrew image.
- pob_phrase: and he knows every deed of a man
  simplified_phrase: and God knows every one of his deeds
  preserved_meaning: God has complete awareness of each deed done by the man.
  reasoning_layer_used: POB translation and lexical decisions
  rationale: Repeating “God” and linking the deeds to the man makes the sentence easier to follow.
translation_notes:
  risk_flags:
  - risk: “A man” may be misunderstood as excluding women.
    mitigation: The footnote preserves the generic alternative while retaining the POB’s source-driven masculine wording.
  - risk: The Hebrew and Greek differ in the first clause.
    mitigation: The main text follows the controlling Hebrew witness, and the Greek reading remains in a footnote.
