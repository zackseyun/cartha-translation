translation:
  language: en
  text: If you desire to obey, you will keep the commandment.[a] Acting faithfully is a matter of your willing choice.[b] If you trust in him, you too will live.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew has “commandment” in the singular; the Greek parallel has “commandments” in the plural.
    reason: textual_variant
  - marker: b
