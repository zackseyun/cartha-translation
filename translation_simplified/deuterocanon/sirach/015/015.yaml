- pob_phrase: If you desire
  simplified_phrase: If you desire to obey
  preserved_meaning: The condition concerns a person's willing response to the commandment.
  reasoning_layer_used: Lexical decision and immediate context
  rationale: Adding “to obey” makes the implied object of desire clear without turning willingness into mere ability.
- pob_phrase: you will keep the commandment
  simplified_phrase: you will keep the commandment
  preserved_meaning: The Hebrew singular and the call to obedience remain intact.
  reasoning_layer_used: Hebrew lexical decision and textual-variant note
  rationale: The biblical term remains understandable, while the footnote preserves the Greek plural.
- pob_phrase: to act faithfully is a matter of your good pleasure
  simplified_phrase: Acting faithfully is a matter of your willing choice
  preserved_meaning: Faithful action is connected with the person's willing disposition.
  reasoning_layer_used: Theological decision using the difficult Hebrew clause and Greek parallel
  rationale: “Willing choice” explains the archaic sense of “good pleasure” without asserting autonomous free will.
