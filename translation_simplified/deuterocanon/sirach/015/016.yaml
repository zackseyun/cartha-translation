translation:
  language: en
  text: Fire and water are before you. Reach out your hand to whichever one you want.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Fire and water are set before you
  simplified_phrase: Fire and water are before you
  preserved_meaning: The two concrete opposites remain presented as available choices.
  reasoning_layer_used: Lexical decisions for מוּצָק, לְפָנֶיךָ, and אֵשׁ וָמָיִם
  rationale: Removing the passive wording makes the sentence more direct while the context still presents both options.
- pob_phrase: whichever you choose, stretch out your hand to it
  simplified_phrase: Reach out your hand to whichever one you want
  preserved_meaning: The hearer extends a hand toward the desired option without adding a separate command to choose.
  reasoning_layer_used: Lexical decisions for בַּאֲשֶׁר תַּחְפֹּץ and שְׁלַח יָדֶיךָ, with the theological decision on human moral agency
  rationale: The reordered sentence is natural English and preserves the source’s link between desire and reaching.
translation_notes:
  risk_flags:
  - risk: “Are before you” is less explicit than “are set before you” about the options being presented.
    mitigation: The command to reach toward either one makes their availability clear.
