  preserved_meaning: Praise is morally out of place when spoken by the wicked man, and the bodily image is retained.
  reasoning_layer_used: Hebrew lexical decisions for לֹא נָאֲתָה and בְּפִי
  rationale: “On the lips” is a natural English image for spoken praise without suggesting ownership.
- pob_phrase: it has not been allotted to him from God
  simplified_phrase: God has not allotted it to him
  preserved_meaning: God is the source who has not apportioned praise to the wicked man.
  reasoning_layer_used: Hebrew lexical decision for נֶחְלְקָה לּוֹ מֵאֵל and Hebrew-primary theological decision
  rationale: The active sentence makes the allotment image easier to understand while preserving its source-driven meaning.
