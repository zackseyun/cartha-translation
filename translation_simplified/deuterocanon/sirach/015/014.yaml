translation:
  language: en
  text: From the beginning, God created man.[a] He placed him under the power of his own impulse and gave him over to his own inclination.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Man” can also mean “humankind” here.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew wording is difficult; the Greek says, “He left him in the hand of his own counsel,” likewise emphasizing human self-direction.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: God, from the beginning, created man
  simplified_phrase: From the beginning, God created man.
  preserved_meaning: God is the creator, and the temporal phrase means “from the beginning.”
  reasoning_layer_used: POB lexical decisions for מִבְּרֵאשִׁית and בָּרָא
  rationale: Moving the time phrase first and using a separate sentence makes the statement easier to follow.
- pob_phrase: placed him in the hand of his own violence
  simplified_phrase: placed him under the power of his own impulse
  preserved_meaning: Man is placed under the power of his own inner drive.
  reasoning_layer_used: POB lexical decisions for בְּיַד and חוֹתְפוֹ, with the doctrine-realignment revision
  rationale: “Under the power of” clearly expresses the hand idiom, while “impulse” preserves the controlling choice for the uncertain Hebrew.
- pob_phrase: he gave him over to the hand of his own inclination
  simplified_phrase: gave him over to his own inclination
  preserved_meaning: God entrusted man to the direction of his own disposition without asserting absolute autonomy.
  reasoning_layer_used: POB theological decision on human moral agency
  rationale: Removing the repeated hand idiom makes the line natural without weakening “gave him over.”
