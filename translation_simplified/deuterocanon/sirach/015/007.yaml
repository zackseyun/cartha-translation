translation:
  language: en
  text: People who live by falsehood[a] will not gain Wisdom,[b] and arrogant people will not see her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “people of falsehood”; the Greek parallel has “senseless people.”
    reason: alternative_reading
  - marker: b
    text: The Hebrew verb is difficult in this context; the Greek parallel supports “gain” or “grasp” rather than “guide.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Men of falsehood
  simplified_phrase: People who live by falsehood
  preserved_meaning: These people are characterized by falsehood, emptiness, or deceit.
  reasoning_layer_used: Hebrew lexical decision for מְתֵי שָׁוְא
  rationale: This replaces an unfamiliar Hebrew-style label with natural English while retaining its moral force.
- pob_phrase: will not attain her
  simplified_phrase: will not gain Wisdom
  preserved_meaning: Such people cannot reach or come into possession of Wisdom.
  reasoning_layer_used: Hebrew lexical decision informed by the Greek parallel
  rationale: “Gain” is clearer than “attain” and avoids the misleading sense “guide.”
- pob_phrase: men of insolence
  simplified_phrase: arrogant people
  preserved_meaning: The phrase describes people marked by proud and presumptuous rebellion.
  reasoning_layer_used: Hebrew lexical decision for אַנְשֵׁי זָדוֹן
  rationale: “Arrogant” expresses the moral quality in familiar modern English.
interpretive_expansions:
- pob_phrase: her
  rendering: Wisdom
  claim: The feminine pronoun refers to Wisdom.
  evidence:
  - The POB lexical rationale identifies Wisdom as the verb’s object.
  - The surrounding context concerns Wisdom.
  confidence: high
  alternatives_preserved:
  - her
translation_notes:
  risk_flags:
  - risk: “Gain” may sound more possessive than the broader sense “reach” or “grasp.”
    mitigation: The footnote preserves the lexical range and the POB rationale.
  - risk: “People who live by falsehood” presents the Hebrew label as an established moral character.
    mitigation: This retains the POB’s focus on falsehood rather than adopting the Greek “senseless people.”
