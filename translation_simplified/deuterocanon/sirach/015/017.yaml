translation:
  language: en
  text: Life and death are set before human beings.[a] Whichever one a person desires will be given to him.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “For human beings are life and death”; the Hebrew preposition can be read that way, but the Greek parallel supports the sense “set before human beings.”
