- pob_phrase: Before human beings are life and death
  simplified_phrase: Life and death are set before human beings
  preserved_meaning: Both alternatives are presented to humanity.
  reasoning_layer_used: Hebrew lexical rationale and Greek parallel
  rationale: Ordinary clause order and “set before” make the presentation image clear.
- pob_phrase: whichever he chooses
  simplified_phrase: Whichever one a person desires
  preserved_meaning: An individual wills one of the two alternatives.
  reasoning_layer_used: Lexical decision and doctrine realignment
  rationale: “A person” clarifies the generic singular, while “desires” preserves the audited volitional nuance.
interpretive_expansions:
