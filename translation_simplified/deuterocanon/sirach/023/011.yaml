translation:
  language: en
  text: A man who repeatedly swears oaths will become full of lawlessness, and the whip will not leave his house.[a] If he does wrong, his sin remains on him. If he ignores that wrong, he sins twice over. If he swears an empty oath,[b] he will not be cleared, because troubles will fill his house.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The whip may picture a scourge of punishment rather than a literal whip.
    reason: lexical_alternative
  - marker: b
    text: An “empty oath” may mean a vain or false oath; the Greek does not settle the exact sense.
    reason: lexical_alternative
  - marker: c
    text: The Greek term likely refers to imposed troubles, penalties, or calamities.
    reason: textual_variant
simplification_decisions:
- pob_phrase: who swears many oaths
  simplified_phrase: who repeatedly swears oaths
  preserved_meaning: The man is characterized by frequent oath-taking.
  reasoning_layer_used: POB lexical decision for πολύορκος
  rationale: “Repeatedly” states the habitual sense in natural English.
- pob_phrase: If he stumbles, his sin is upon him
  simplified_phrase: If he does wrong, his sin remains on him
  preserved_meaning: A moral fault leaves the offender personally liable for his sin.
  reasoning_layer_used: POB lexical decisions for πλημμελήσῃ and ἁμαρτία αὐτοῦ ἐπʼ αὐτῷ
  rationale: The wording makes the moral sense and personal liability immediately clear.
- pob_phrase: he will not be justified
  simplified_phrase: he will not be cleared
  preserved_meaning: He will not receive judicial or moral vindication.
  reasoning_layer_used: POB theological decision on δικαιωθήσεται
  rationale: “Cleared” preserves the judicial force without suggesting a later technical doctrine.
