translation:
  language: en
  text: Do not let bodily appetite or sexual indulgence control me.[a] Do not hand me over to a shameless self.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek term can also mean “sexual relations,” but the surrounding prayer gives it a negative moral force.
    reason: lexical_alternative
  - marker: b
    text: Or “a shameless soul.” Here “soul” means one’s inner self.
    reason: lexical_alternative
