translation:
  language: en
  text: Do not let your mouth get into the habit of making oaths, and do not make a habit of using the Holy One’s name.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “invoking the Holy One by name” or “using the holy name.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Do not accustom your mouth to an oath
  simplified_phrase: Do not let your mouth get into the habit of making oaths
  preserved_meaning: The warning targets habitual oath-taking and retains the image of the mouth.
  reasoning_layer_used: Lexical decisions for ὅρκῳ, ἐθίζω, and στόμα
  rationale: Common wording clarifies the practice without making every oath forbidden.
- pob_phrase: do not become accustomed to invoking the Holy One by name
  simplified_phrase: do not make a habit of using the Holy One’s name
  preserved_meaning: The warning concerns habitual use of God’s name while preserving the title “Holy One.”
  reasoning_layer_used: Lexical and theological decisions for ὀνομασίᾳ τοῦ ἁγίου and συνεθίζω
  rationale: “Using” avoids narrowing the warning to prayer while keeping the documented ambiguity in the footnote.
translation_notes:
  risk_flags:
  - risk: “Using the Holy One’s name” may sound broader than the Greek naming or invocation language.
    mitigation: The habitual wording limits the prohibition, and the footnote preserves the narrower possibilities.
