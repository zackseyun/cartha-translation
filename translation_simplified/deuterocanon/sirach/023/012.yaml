  simplified_phrase: There is a kind of speech wrapped in death
  preserved_meaning: A particular form of speech is pictured as enveloped in death.
  reasoning_layer_used: Lexical decisions for λέξις and ἀντιπεριβεβλημένη θανάτῳ
  rationale: “Kind of speech” clarifies the spoken sense of “word” while preserving the vivid death image.
- pob_phrase: in the inheritance of Jacob
  simplified_phrase: among Jacob’s people
  preserved_meaning: The phrase identifies the covenant community associated with Jacob or Israel without defining its wider scope.
  reasoning_layer_used: Theological decision on the identity of Jacob’s inheritance
  rationale: “Among Jacob’s people” makes the communal sense clear without making the people Jacob’s possession.
- pob_phrase: all these things will depart from the godly
  simplified_phrase: All such sinful speech will stay away from those who honor God
  preserved_meaning: The sinful speech under discussion is absent from reverent, faithful people.
  reasoning_layer_used: Lexical decisions for ταῦτα πάντα, ἀποστήσεται, and εὐσεβῶν
  rationale: The wording identifies the contextual subject and replaces formal terms with natural English.
