translation:
  language: en
  text: A servant who is constantly examined will not escape bruises. In the same way, someone who keeps swearing oaths and invoking the Name[a] will never be cleansed from sin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The Name” likely means the divine name, repeatedly invoked in oaths or irreverent speech.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a slave being constantly examined
  simplified_phrase: a slave who is constantly examined
  preserved_meaning: The slave remains under persistent scrutiny, without limiting that scrutiny to questioning.
  reasoning_layer_used: Lexical decisions for οἰκέτης and ἐξεταζόμενος ἐνδελεχῶς
  rationale: A relative clause is easier to follow while preserving the broad sense of repeated examination.
- pob_phrase: will not be spared bruises
  simplified_phrase: will not escape bruises
  preserved_meaning: The slave does not come away without bruises or welts from punishment.
  reasoning_layer_used: Lexical decision for ἀπὸ μώλωπος οὐκ ἐλαττωθήσεται
  rationale: “Will not escape” expresses the Greek idiom naturally and retains the physical image.
- pob_phrase: one who swears and names the Name continually
  simplified_phrase: someone who keeps swearing oaths and invoking the Name
  preserved_meaning: The warning concerns habitual oath-taking and repeated invocation of the divine name.
  reasoning_layer_used: Lexical and theological decisions for ὁ ὀμνύων, καὶ ὀνομάζων, and διὰ παντός
  rationale: This wording makes the repeated oath-related speech clearer without identifying the Name more explicitly than the POB.
interpretive_expansions:
- pob_phrase: names the Name continually
  rendering: keeps ... invoking the Name
  claim: The repeated naming is presented as invocation in oath-related or irreverent speech.
  evidence:
  - The immediate context joins naming with habitual swearing.
  - The POB lexical and theological decisions identify invocation of the divine name as the likely sense.
  confidence: moderate
  alternatives_preserved:
  - General naming or irreverent utterance not limited to a formal oath
translation_notes:
  risk_flags:
  - risk: “Invoking the Name” may still be unfamiliar to some readers.
    mitigation: The footnote explains that it likely refers to repeatedly uttering the divine name in oaths or irreverent speech.
  - risk: Modern readers may mistake examination for a neutral inspection.
    mitigation: The retained bruises image preserves the punitive force of the comparison.
