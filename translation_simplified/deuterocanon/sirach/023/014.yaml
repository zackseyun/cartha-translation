translation:
  language: en
  text: Remember your father and your mother when you sit among powerful men.[b] Otherwise, you may be forgotten in their presence,[a] and the way you usually behave may make you foolish. You may come to wish you had never been born and curse the day you were born.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “you may forget yourself in their presence,” meaning that you may lose proper restraint; the Greek can be understood either way.
    reason: alternative_reading
  - marker: b
    text: The Greek refers specifically to socially powerful or high-ranking men.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: for you sit in the midst of great men
  simplified_phrase: when you sit among powerful men
  preserved_meaning: The command applies in the setting of high-ranking men without making that setting an explicit cause.
  reasoning_layer_used: source syntax and lexical and theological decisions on ἀνὰ μέσον and μεγιστάνων
  rationale: “When” presents the social setting clearly, while “powerful men” explains their status and retains the masculine reference.
- pob_phrase: lest you be forgotten before them
  simplified_phrase: Otherwise, you may be forgotten in their presence
  preserved_meaning: The main reading warns that these men may forget or overlook the person.
  reasoning_layer_used: lexical and theological decision on ἐπιλαθῇ ἐνώπιον αὐτῶν
  rationale: The warning is recast in ordinary English without resolving the documented ambiguity.
- pob_phrase: by your habit become foolish
  simplified_phrase: the way you usually behave may make you foolish
  preserved_meaning: Customary behavior can lead to a foolish and shameful outcome.
  reasoning_layer_used: lexical decisions on ἐθισμός and μωραίνω
  rationale: The abstract phrase “by your habit” becomes a clear description of repeated behavior.
translation_notes:
  risk_flags:
