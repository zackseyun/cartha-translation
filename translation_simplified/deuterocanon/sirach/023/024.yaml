translation:
  language: en
  text: She will be brought out before the gathered community, and her children will come under official investigation.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may imply that her children will face judicial punishment, not merely investigation.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: before the assembly
  simplified_phrase: before the gathered community
  preserved_meaning: She is publicly exposed before the assembled community.
  reasoning_layer_used: lexical decision for ἐκκλησία and its public communal setting
  rationale: “Gathered community” avoids the later technical sense of “church” while clarifying who is assembled.
- pob_phrase: there will be an inspection concerning her children
  simplified_phrase: her children will come under official investigation
  preserved_meaning: Her children become the object of a formal inquiry with possible judicial force.
  reasoning_layer_used: lexical and theological decisions for ἐπί and ἐπισκοπή
  rationale: The active English expression is easier to understand without making punishment certain.
translation_notes:
  risk_flags:
