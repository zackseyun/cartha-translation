translation:
  language: en
  text: To a promiscuous man, any bread tastes sweet.[a] He will not stop until he comes to his end.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The bread image suggests an appetite that accepts whatever is available.
    reason: simplification_note
  - marker: b
    text: Or, “until he dies.” “Comes to his end” may also suggest final ruin.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: every bread is sweet
  simplified_phrase: any bread tastes sweet
  preserved_meaning: The concrete bread image still portrays indiscriminate appetite.
  reasoning_layer_used: Lexical and theological decisions on πᾶς ἄρτος and ἡδύς
  rationale: Natural English preserves both the sensory image and its moral irony.
- pob_phrase: he will not stop until he comes to his end
  simplified_phrase: He will not stop until he comes to his end.
  preserved_meaning: His conduct continues relentlessly to death or final ruin.
  reasoning_layer_used: Lexical and theological decision on τελευτήσῃ
  rationale: A separate sentence improves readability while retaining the deliberate ambiguity.
