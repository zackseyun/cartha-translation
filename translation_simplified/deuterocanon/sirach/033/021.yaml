translation:
  language: en
  text: While you are still alive and have breath in you, do not hand yourself over to anyone else’s control.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “to any flesh,” meaning to any human being. It can also be translated “do not hand yourself over to anyone” or “do not submit yourself to any person.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: As long as you are still alive and breath is in you
  simplified_phrase: While you are still alive and have breath in you
  preserved_meaning: The command applies throughout the rest of the person’s life, while breath remains.
  reasoning_layer_used: Lexical decisions for ἕως ἔτι ζῇς and πνοή
  rationale: The shorter wording keeps both continued life and the concrete image of breath.
- pob_phrase: do not give yourself over to any flesh
  simplified_phrase: do not hand yourself over to anyone else’s control
  preserved_meaning: A person must not willingly place himself or herself under another human being’s power.
  reasoning_layer_used: Lexical decision for μὴ ἀλλάξῃς σεαυτόν and theological decision for σάρξ
  rationale: This makes the human referent and transfer of control clear while preserving the self-handing-over image.
interpretive_expansions:
- pob_phrase: give yourself over
  rendering: hand yourself over to anyone else’s control
  claim: Giving oneself over means yielding one’s person to another human being’s power.
  evidence:
  - The POB lexical rationale describes yielding or transferring oneself into another’s control.
  - The reflexive σεαυτόν shows that the warning concerns one’s own person.
  confidence: high
  alternatives_preserved:
  - do not hand yourself over to anyone
  - do not submit yourself to any person
  - do not give yourself over to any flesh
