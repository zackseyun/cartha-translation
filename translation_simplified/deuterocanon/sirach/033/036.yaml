translation:
  language: en
  text: Do not ask every man for advice. Instead, keep only one counselor out of a thousand.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “One out of a thousand” is a figure of speech urging you to be extremely selective when choosing a counselor.
