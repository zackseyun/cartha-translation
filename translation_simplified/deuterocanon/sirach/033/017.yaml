translation:
  language: en
  text: Lord, have mercy on the people who bear your name—your own people. Have mercy on Israel, whom you made like a firstborn son.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Firstborn son” describes Israel’s special status before God.
    reason: cultural_note
  - marker: b
    text: The difficult Greek may instead mean, “Make Israel like a firstborn son.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Have mercy on the people, O Lord
  simplified_phrase: Lord, have mercy on the people
  preserved_meaning: The verse remains a solemn, direct plea for God’s compassionate action.
  reasoning_layer_used: Lexical decision for ἐλέησον and Κύριε
  rationale: Ordinary English places the person addressed before the request.
- pob_phrase: who are called by your name
  simplified_phrase: who bear your name—your own people
  preserved_meaning: The people are identified as belonging to God while the name image remains.
  reasoning_layer_used: POB cultural note and lexical rationale for κεκλημένον ἐπ᾽ ὀνόματί σου
  rationale: The brief explanation makes the biblical idiom understandable on first reading.
- pob_phrase: and on Israel, whom you made equal to a firstborn son
  simplified_phrase: Have mercy on Israel, whom you made like a firstborn son
  preserved_meaning: Israel is presented as receiving a firstborn son’s status before God.
  reasoning_layer_used: Latest doctrine realignment, lexical decision for ὁμοίωσον, and theological decision
  rationale: A new sentence clarifies the repeated object while “made like” follows the controlling adjudication.
interpretive_expansions:
