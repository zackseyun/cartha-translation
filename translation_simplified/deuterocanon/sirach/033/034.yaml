translation:
  language: en
  text: Guard yourself against a wrongdoer. He plans evil and may bring lasting disgrace on you.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Be on guard against a wrongdoer
  simplified_phrase: Guard yourself against a wrongdoer
  preserved_meaning: The reader is warned to remain cautious toward a person who does harm.
  reasoning_layer_used: POB lexical decisions for πρόσεχε and ἀπὸ κακούργου
  rationale: The direct command is easier to read while retaining the warning force and the broad term “wrongdoer.”
- pob_phrase: for he devises evil
  simplified_phrase: He plans evil
  preserved_meaning: The wrongdoer intentionally thinks out harmful or wicked actions.
  reasoning_layer_used: POB lexical decisions for πονηρὰ and τεκταίνεται
  rationale: “Plans” expresses deliberate contrivance in more familiar English than “devises.”
- pob_phrase: lest he ever bring disgrace upon you
  simplified_phrase: and may bring lasting disgrace on you
  preserved_meaning: His schemes could cause the reader enduring dishonor or reproach.
  reasoning_layer_used: POB lexical decisions for μή ποτε, μῶμον, εἰς τὸν αἰῶνα, and δῷ σοι
  rationale: The wording replaces “lest” and the awkward use of “ever” while preserving a possible and enduring consequence.
interpretive_expansions:
- pob_phrase: lest he ever bring disgrace upon you
  rendering: may bring lasting disgrace on you
  claim: The disgrace is a possible result and may endure.
  evidence:
  - The POB rationale says μή ποτε introduces a warning about a possible consequence.
  - The POB rationale says εἰς τὸν αἰῶνα stresses the enduring nature of the reproach.
  confidence: high
  alternatives_preserved:
  - bring disgrace upon you forever
  - ever bring disgrace upon you
translation_notes:
  risk_flags:
  - risk: “Lasting” may sound weaker than the literal alternative “forever.”
    mitigation: It follows the POB decision to preserve enduring force without asserting metaphysical perpetuity.
