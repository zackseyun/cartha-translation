translation:
  language: en
  text: Good is the opposite of evil, and life is the opposite of death. In the same way, a sinner is the opposite of a godly man.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also be translated more generally as “the godly,” though the form here is singular and masculine.
    reason: lexical_alternative
