translation:
  language: en
  text: Excel in everything you do. Do not stain your honor.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: In all your works be preeminent
  simplified_phrase: Excel in everything you do
  preserved_meaning: The command calls for conduct that rises above the ordinary in every activity.
  reasoning_layer_used: The lexical decisions allow “everything you do” and “excel” as natural equivalents.
  rationale: The direct command is clearer than the formal phrase “be preeminent.”
- pob_phrase: do not give a blemish to your honor
  simplified_phrase: Do not stain your honor
  preserved_meaning: The warning retains the concrete image of damage to one’s social honor.
  reasoning_layer_used: The lexical and theological decisions identify “blemish” as an image of reproach and δόξα as honor.
  rationale: Using “stain” as a verb makes the image natural in modern English.
translation_notes:
  risk_flags:
  - risk: “Stain” may sound slightly stronger than “blemish.”
    mitigation: Keeping “honor” limits the image to the ethical and social setting preserved by POB.
