translation:
  language: en
  text: There is a friend who turns hostile and exposes a quarrel, bringing you disgrace.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean that the friend exposes the quarrel as a reproach against you.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: there is a friend who changes into enmity
  simplified_phrase: There is a friend who turns hostile
  preserved_meaning: A friend can change into a state of hostility.
  reasoning_layer_used: Lexical decisions for μεταβαλλόμενος and εἰς ἔχθραν
  rationale: “Turns hostile” naturally preserves the change of state without assigning the friend to a fixed category.
- pob_phrase: he will expose a quarrel to your disgrace
  simplified_phrase: exposes a quarrel, bringing you disgrace
  preserved_meaning: The hostile friend reveals a dispute in a way that dishonors you.
  reasoning_layer_used: Lexical decisions for μάχην, ὀνειδισμοῦ, and ἀποκαλύψει
  rationale: The recast clause retains an indefinite quarrel and clearly expresses the resulting disgrace.
translation_notes:
  risk_flags:
  - risk: The compact Greek may describe the quarrel itself as a reproach rather than emphasize the disgrace it causes.
    mitigation: The footnote preserves this alternate relationship.
