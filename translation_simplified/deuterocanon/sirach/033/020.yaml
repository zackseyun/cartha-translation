  simplified_phrase: your son, wife, brother, or friend
  preserved_meaning: The warning names the same four close relationships.
  reasoning_layer_used: POB lexical decisions
  rationale: Adding “your” and using a natural English list makes the relationships immediately clear.
- pob_phrase: do not give authority over yourself during your lifetime
  simplified_phrase: Do not give ... control over you as long as you live
  preserved_meaning: One should not hand governing power over oneself to even a close relation while alive.
  reasoning_layer_used: POB lexical decisions for ἐξουσία and ἐν ζωῇ σου
  rationale: “Control over you” and “as long as you live” express the same warning in common English.
- pob_phrase: do not give your possessions to another
  simplified_phrase: Do not give your property to anyone else
  preserved_meaning: The warning concerns transferring one’s assets broadly, not merely cash.
  reasoning_layer_used: POB lexical decision for τὰ χρήματά σου and latest revision pass
  rationale: “Property” keeps the broad collective sense, while “anyone else” is more natural than “another.”
