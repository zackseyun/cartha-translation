translation:
  language: en
  text: He rests for only a moment, but the rest brings no relief. Then the terrors in his heart shake him, like someone fleeing from a pursuer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is difficult here; the Greek similarly pictures someone escaping from war.
    reason: textual_variant
