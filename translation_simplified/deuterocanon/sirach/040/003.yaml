simplification_decisions:
- pob_phrase: one seated on a lofty throne
  simplified_phrase: the person sitting on a high throne
  preserved_meaning: The person occupies a royal or exalted position.
  reasoning_layer_used: Hebrew lexical decisions for מיושב, כסא, and לגבה
  rationale: “Sitting” and “high” express the Hebrew image in more familiar English while “throne” preserves its royal force.
- pob_phrase: one returning to dust and ashes
  simplified_phrase: the person returning to dust and ashes
  preserved_meaning: Every person faces mortality, frailty, and humiliation.
  reasoning_layer_used: Hebrew lexical decision for לשוב and עפר ואפר
  rationale: The biblical image remains intact, while “person” makes the implied human subject immediately clear.
- pob_phrase: from ... to ...
  simplified_phrase: from ... to ...
  preserved_meaning: The two phrases mark opposite ends of the human social and mortal range.
  reasoning_layer_used: Hebrew syntax and theological decision on the merism
  rationale: Keeping the range construction avoids making עד sound temporal.
translation_notes:
  risk_flags:
  - risk: “High” may convey physical height more readily than social exaltation.
    mitigation: “Throne” retains the royal-status contrast, and the footnote records the Greek emphasis on glory.
