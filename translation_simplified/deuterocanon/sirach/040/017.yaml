translation:
  language: en
  text: Kindness will never be shaken.[a][b] Righteousness will stand firm forever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel says, “Grace is like a garden full of blessings, and giving to the poor lasts forever.” The Hebrew reads “kindness” and “righteousness.”
    reason: alternative_reading
  - marker: b
    text: A fragment from Masada has a different Hebrew reading here, but too little survives to determine the full wording confidently.
    reason: textual_variant
simplification_decisions:
- pob_phrase: Kindness will never be shaken
  simplified_phrase: Kindness will never be shaken.
  preserved_meaning: Kindness remains stable and cannot be dislodged.
  reasoning_layer_used: Hebrew lexical decision for לעולם לא ימוט
  rationale: This plain wording preserves the Hebrew image of lasting stability without suggesting refusal to yield.
- pob_phrase: and righteousness will stand forever
  simplified_phrase: Righteousness will stand firm forever.
  preserved_meaning: Righteousness remains permanently established.
  reasoning_layer_used: Hebrew lexical and theological decisions for צדקה and לעד תכון
  rationale: A separate sentence and “firm” make the parallel image of stability easy to grasp.
translation_notes:
