translation:
  language: en
  text: Force follows force, like an ever-flowing stream; from a mighty channel comes a crashing roar.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Hebrew is difficult, and the incomplete Masada fragment does not settle the wording.
    reason: textual_variant
  - marker: b
    text: 'The Greek has a markedly different form: “The wealth of the unjust will dry up like a river and resound like great thunder in rain.”'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: From force to force
  simplified_phrase: Force follows force
  preserved_meaning: The repeated surge of force remains without choosing wealth or army as the Hebrew sense.
  reasoning_layer_used: POB lexical decision for מחיל אל חיל
  rationale: A finite clause makes the elliptical phrase easier to understand.
- pob_phrase: like a perennial wadi
  simplified_phrase: like an ever-flowing stream
  preserved_meaning: The image remains flowing water marked by enduring strength.
  reasoning_layer_used: POB lexical decision for נחל איתן
  rationale: This avoids the unfamiliar term “wadi” without adding a desert setting or absolute claim.
- pob_phrase: with a crash of sounds
  simplified_phrase: comes a crashing roar
  preserved_meaning: The violent sound remains without being narrowed to literal thunder.
  reasoning_layer_used: POB lexical decision for בחזיז קולות
  rationale: “Crashing roar” gives the rare phrase clear and natural auditory force.
interpretive_expansions:
- pob_phrase: and from a mighty channel, with a crash of sounds
  rendering: from a mighty channel comes a crashing roar
  claim: The crashing sound is presented as coming from the mighty channel.
  evidence:
  - The POB preserves both “from a mighty channel” and the following crashing sound.
  - The added verb completes the difficult Hebrew relation with minimal change.
  confidence: moderate
  alternatives_preserved:
  - and from a mighty channel, with a crash of sounds
  - from a mighty streambed, with a crash of sounds
translation_notes:
  risk_flags:
  - risk: The verb “comes” makes an elliptical Hebrew relation more explicit.
    mitigation: The rendering keeps the POB preposition “from” and does not add movement through the channel.
  - risk: The Greek parallel reflects a substantially different text about unjust wealth.
    mitigation: Its reading remains in a footnote rather than being blended into the Hebrew-based text.
