translation:
  language: en
  text: Grace and beauty please the eye,[a] but the green plants growing in a field are better than both.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew can also mean, “Beauty and appearance please the eye”; the Greek parallel supports “grace and beauty.”
    reason: lexical_alternative
