translation:
  language: en
  text: Yet envy, anxiety, fear, and the dread of death stir up much conflict.[a] When a person lies down on his bed to rest, sleep at night changes his misery.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is compressed and uncertain; the Greek parallel also mentions anger and strife.
    reason: alternative_reading
  - marker: b
    text: The Hebrew may also mean “changes his distress” or “alters his trouble”; it refers to suffering, not moral evil.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: bring contention in abundance
  simplified_phrase: stir up much conflict
  preserved_meaning: These inner torments produce abundant agitation or strife.
  reasoning_layer_used: Hebrew lexical decision informed by the Greek parallel
  rationale: “Much conflict” clearly preserves the quantity sense of the difficult Hebrew clause.
- pob_phrase: at the time of his rest upon his bed
  simplified_phrase: When a person lies down on his bed to rest
  preserved_meaning: The suffering continues into the time set aside for rest.
  reasoning_layer_used: Hebrew temporal and location phrases
  rationale: An ordinary English clause retains both the time of rest and the bed setting.
- pob_phrase: the sleep of night changes his misery
  simplified_phrase: sleep at night changes his misery
  preserved_meaning: Nighttime sleep alters the sufferer’s afflicted condition.
  reasoning_layer_used: Hebrew lexical decision with Greek consistency check
  rationale: Natural word order preserves the source claim without specifying how the misery changes.
translation_notes:
  risk_flags:
  - risk: “Conflict” may suggest outward strife more than inner agitation.
    mitigation: The footnote preserves the clause’s uncertainty and the Greek parallel’s fuller list.
  - risk: The unusual claim that sleep changes misery remains compressed.
    mitigation: The footnote gives the supported alternatives “distress” and “trouble.”
