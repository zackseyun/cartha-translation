translation:
  language: en
  text: Anxiety stays with every living being,[a] and wealth drives sleep away.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek reads, “with all flesh, from human to animal, and upon sinners seven times more than these.” This fuller wording is absent from the surviving Hebrew line used here.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: with all flesh their anxiety is with them
  simplified_phrase: Anxiety stays with every living being
  preserved_meaning: Anxiety accompanies living creatures in embodied existence.
  reasoning_layer_used: Hebrew lexical decision supported by the Greek parallel
  rationale: This states the collective meaning of “all flesh” in clear modern English while keeping anxiety as a companion.
- pob_phrase: their wealth drives away their sleep
  simplified_phrase: wealth drives sleep away
  preserved_meaning: Wealth can itself cause unrest and prevent sleep.
  reasoning_layer_used: Hebrew lexical decision and grounding review
  rationale: The generic wording preserves the vivid image without implying that animals possess wealth.
translation_notes:
  risk_flags:
  - risk: The two clauses may appear to give wealth the same universal scope as anxiety.
    mitigation: Removing the possessive avoids assigning wealth to every living being while preserving the Hebrew proverb’s force.
