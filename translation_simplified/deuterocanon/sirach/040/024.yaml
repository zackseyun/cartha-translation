translation:
  language: en
  text: A brother and a companion support you when trouble comes, but righteousness[a] does even more to rescue you than either one.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel reads, “almsgiving or mercy will rescue more than both.” The surviving Hebrew reads “righteousness.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: are for a time of trouble
  simplified_phrase: support you when trouble comes
  preserved_meaning: A brother and companion provide practical help in a crisis.
  reasoning_layer_used: Lexical rationale for לעת צרה and שותף
  rationale: The direct wording makes their supportive role clear in natural English.
- pob_phrase: righteousness delivers more than both
  simplified_phrase: righteousness does even more to rescue you than either one
  preserved_meaning: Righteousness surpasses both human relationships in its power to deliver.
  reasoning_layer_used: Hebrew lexical decisions for צדק, מצלת, and ומשניהם
  rationale: The rewrite clarifies the comparison while retaining righteousness and the rescue image.
interpretive_expansions:
- pob_phrase: A brother and a companion are for a time of trouble
  rendering: A brother and a companion support you when trouble comes
  claim: The two people are presented as sources of help during a crisis.
  evidence:
