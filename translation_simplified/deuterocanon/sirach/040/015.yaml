translation:
  language: en
  text: What violence produces will not escape punishment, for the godless have their root on a sharp, jagged rock.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek parallel says, “The offspring of the ungodly will not multiply branches, and unclean roots are on a sharply cut rock.”
    reason: alternative_reading
  - marker: b
    text: The difficult Hebrew phrase pictures a tooth of rock—a sharp rocky projection.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The offspring of violence
  simplified_phrase: What violence produces
  preserved_meaning: Violence gives rise to consequences or descendants that share its corrupt character.
  reasoning_layer_used: Hebrew lexical decision for נוצר מחמס
  rationale: This wording makes the growth image clear without limiting “offspring” to literal children.
- pob_phrase: will not go unpunished
  simplified_phrase: will not escape punishment
  preserved_meaning: What comes from violence remains subject to judgment.
  reasoning_layer_used: Hebrew idiom לא ינקה
  rationale: The active wording states the same judicial force in familiar English.
- pob_phrase: the root of the godless is on a jagged crag
  simplified_phrase: the godless have their root on a sharp, jagged rock
  preserved_meaning: The Hebrew portrays the godless as corrupt growth rooted on a sharp rock formation.
  reasoning_layer_used: Hebrew lexical decisions for שרש, חנף, and על שן תלע
  rationale: The recast sentence keeps both the root metaphor and the vivid rocky setting.
