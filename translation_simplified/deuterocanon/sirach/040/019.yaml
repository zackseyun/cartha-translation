translation:
  language: en
  text: Children and founding a city make a person’s name last,[a][b] but a blameless wife is better than either.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The uncertain Hebrew reads approximately, “from both of them comes wisdom,” while the Greek supports “a blameless wife.”
    reason: alternative_reading
  - marker: b
    text: The older Masada scroll is too fragmentary here to settle the wording.
    reason: textual_variant
simplification_decisions:
- pob_phrase: the building of a city
  simplified_phrase: founding a city
  preserved_meaning: Establishing a city can secure lasting honor.
  reasoning_layer_used: POB lexical decision on ועיר יעמידו שם, supported by the Greek parallel
  rationale: “Founding” states the civic achievement more naturally than the abstract phrase “the building of.”
- pob_phrase: establish a name
  simplified_phrase: make a person’s name last
  preserved_meaning: The achievement gives someone an enduring reputation.
  reasoning_layer_used: POB lexical decision on שם
  rationale: The wording preserves the biblical image of a name while making its lasting force clear.
- pob_phrase: better than both
  simplified_phrase: better than either
  preserved_meaning: A blameless wife is valued above each of the two achievements.
  reasoning_layer_used: POB lexical decision on ומשניהם and Greek ὑπὲρ ἀμφότερα
  rationale: “Either” is the natural English comparison after two items.
interpretive_expansions:
- pob_phrase: establish a name
  rendering: make a person’s name last
  claim: The “name” refers to an enduring reputation rather than merely a personal label.
  evidence:
  - The POB lexical rationale identifies “name” as reputation or lasting renown.
  - The civic and family achievements fit a wisdom saying about one’s legacy.
  confidence: high
  alternatives_preserved:
  - establish a name
  - bring lasting renown
translation_notes:
  risk_flags:
  - risk: The final Hebrew phrase differs from the Greek-supported main reading.
    mitigation: The main text retains the POB decision, and footnote a preserves the Hebrew alternative.
  - risk: “Blameless” could be mistaken for absolute sinlessness.
    mitigation: The term is retained from POB as a description of upright character, not perfection.
