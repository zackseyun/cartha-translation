translation:
  language: en
  text: Every gift[b] and every injustice will be wiped away, but faith[a] will stand firm forever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “faithfulness will stand firm forever.” The Greek word can mean either faith or faithfulness.
    reason: alternative_reading
  - marker: b
