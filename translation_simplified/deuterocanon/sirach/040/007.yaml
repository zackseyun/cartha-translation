translation:
  language: en
  text: Again he prepares for battle. But when he wakes up, there is nothing to fear, and he finds rest.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The surviving Hebrew is followed here; the Greek differs: “At the time of his deliverance he awoke, amazed that there was no fear.”'
