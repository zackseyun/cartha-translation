  reasoning_layer_used: Hebrew syntax and POB range reading
  rationale: The recast wording makes the clothing relationship immediately clear.
- pob_phrase: even to one wrapped
  simplified_phrase: to the person wrapped
  preserved_meaning: The phrase marks the other end of the social or material range.
  reasoning_layer_used: POB lexical decision for ועד and עוטה
  rationale: Removing “even” gives natural English while retaining the full range.
- pob_phrase: a garment of skin
  simplified_phrase: a garment made of animal skin
  preserved_meaning: The person wears a garment made from skin without specifying leather or rawhide.
  reasoning_layer_used: POB lexical rationale for שמלת עור
  rationale: Adding “animal” prevents readers from mistaking “skin” for human skin.
