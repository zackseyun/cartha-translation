translation:
  language: en
  text: A man who looks to another man’s table for food does not have a life worth calling life.[a] Eating another man’s delicacies defiles his appetite. But a man who knows inner restraint will be on his guard.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Another man’s table” means depending on someone else for food, not eating with a foreigner.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew is obscure; the Greek parallel describes a knowledgeable and educated man who guards himself.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: watches another’s table
  simplified_phrase: looks to another man’s table for food
  preserved_meaning: The table image remains while the implied dependence on another person’s provisions becomes clear.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: The added words explain the image without suggesting foreign ethnicity.
- pob_phrase: his life is not to be counted as life
  simplified_phrase: does not have a life worth calling life
  preserved_meaning: The repeated word “life” still presents such dependence as an intolerable way to live.
  reasoning_layer_used: POB lexical decision for אין חייו למנות חיים
  rationale: The recast idiom is natural English but keeps the original emphasis.
- pob_phrase: he defiles his appetite with another man’s delicacies
  simplified_phrase: Eating another man’s delicacies defiles his appetite
  preserved_meaning: Eating choice food supplied by another person degrades the dependent eater.
  reasoning_layer_used: POB lexical decisions for מעוג לנפש מטעמו and נפש
  rationale: The simpler sentence preserves the selected terms “defiles,” “appetite,” and “delicacies.”
interpretive_expansions:
- pob_phrase: watches another’s table
  rendering: looks to another man’s table for food
  claim: The man looks to another person’s table because he depends on that person for food.
  evidence:
  - The POB rationale says the context implies dependence on someone else’s provisions.
  - The Hebrew and Greek preserve the image of a table belonging to another.
  confidence: high
  alternatives_preserved:
  - watches another’s table
  - looks to another’s table
translation_notes:
  risk_flags:
  - risk: “Knows inner restraint” gives a readable interpretation of an obscure Hebrew phrase.
    mitigation: Footnote b preserves the uncertainty and reports the Greek parallel’s interpretation.
  - risk: “Defiles his appetite” may be mistaken for ritual impurity.
    mitigation: The food context and POB rationale indicate personal degradation through dependence on another’s delicacies.
