translation:
  language: en
  text: Hard toil is the lot of all human beings—the children of man. They bear a heavy burden from the day they leave their mother’s womb until the day they return to the earth, the mother of all.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Hebrew is shorter; the Greek parallel supplies the wording from birth until burial.
    reason: textual_variant
simplification_decisions:
- pob_phrase: Great toil is allotted
  simplified_phrase: Hard toil is the lot
  preserved_meaning: Wearisome labor is assigned as the common human condition.
  reasoning_layer_used: Hebrew lexical decision for עסק גדול and חלק אל
  rationale: “Is the lot” expresses an assigned portion in more familiar English without naming God as the subject.
- pob_phrase: and a heavy burden upon the children of man
  simplified_phrase: They bear a heavy burden
  preserved_meaning: Human life involves carrying a weighty burden.
  reasoning_layer_used: Hebrew-Greek lexical comparison for ועל כבד
  rationale: The active wording supplies the compressed clause naturally while retaining the burden image.
- pob_phrase: from the day they come forth from their mother’s womb until the day they return to the mother of all
  simplified_phrase: from the day they leave their mother’s womb until the day they return to the earth, the mother of all
  preserved_meaning: The burden extends through the whole span of life, from birth to burial.
  reasoning_layer_used: Greek continuation and POB cultural note
  rationale: “Leave” is plainer than “come forth,” while naming the earth makes the closing image immediately understandable.
interpretive_expansions:
- pob_phrase: the children of man
  rendering: all human beings—the children of man
  claim: The phrase refers collectively to humanity while retaining its Adamic expression.
  evidence:
