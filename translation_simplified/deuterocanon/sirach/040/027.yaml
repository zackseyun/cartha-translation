translation:
  language: en
  text: The fear of God is like a garden full of blessing.[a] It protects a person better than any glory can.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew literally says “like Eden of blessing,” using the image of Eden as a blessed garden.
    reason: lexical_alternative
  - marker: b
    text: The final Hebrew clause is difficult; the Greek also supports the image of protective covering.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: like a garden of blessing
  simplified_phrase: like a garden full of blessing
  preserved_meaning: The fear of God is compared to the blessed garden of Eden.
  reasoning_layer_used: Hebrew lexical decision confirmed by the Greek parallel
  rationale: “Full of blessing” makes the compressed garden image easier to understand.
- pob_phrase: and it shelters more than any glory
  simplified_phrase: It protects a person better than any glory can
  preserved_meaning: The fear of God actively protects someone more than glory does.
  reasoning_layer_used: Hebrew covering image and Greek consistency check
  rationale: The active wording identifies a general recipient while preserving the protective comparison.
interpretive_expansions:
- pob_phrase: it shelters
  rendering: It protects a person
  claim: A person is the general recipient of the protection.
  evidence:
  - The lexical rationale identifies protective covering as the sense.
  - The Greek parallel has a singular personal object.
  confidence: moderate
  alternatives_preserved:
  - it shelters one
  - it covered him
translation_notes:
  risk_flags:
  - risk: Readers may understand “fear of God” as terror alone.
    mitigation: The biblical term is retained because it includes reverential awe but is stronger than “reverence.”
  - risk: The final Hebrew clause has uncertain concise syntax.
    mitigation: The text uses a general recipient and retains the protective sense supported by the Greek parallel.
