translation:
  language: en
  text: Wealth and strength lift the heart,[a] yet the fear of God is greater than both. The fear of God leaves nothing lacking, and no other support is needed alongside it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lift the heart” may suggest confidence or pride; the Hebrew image does not decide between them.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the fear of God is beyond both
  simplified_phrase: the fear of God is greater than both
  preserved_meaning: Fear of God surpasses both wealth and strength.
  reasoning_layer_used: POB lexical decision for ומשניהם
  rationale: “Greater than both” states the comparison in more familiar English.
- pob_phrase: In the fear of God there is no lack
  simplified_phrase: The fear of God leaves nothing lacking
  preserved_meaning: Fear of God is not deficient or insufficient.
  reasoning_layer_used: POB lexical decision for מחסור
  rationale: The active wording is easier to understand while retaining the claim of sufficiency.
- pob_phrase: there is no need to seek support along with it
  simplified_phrase: no other support is needed alongside it
  preserved_meaning: Fear of God does not require an added source of support.
  reasoning_layer_used: POB lexical rationale for ואין לבקש עמה משען
  rationale: The shorter clause clearly expresses that no added support is required.
interpretive_expansions:
- pob_phrase: support along with it
  rendering: other support ... alongside it
  claim: The support in view is additional to the fear of God.
  evidence:
