translation:
  language: en
  text: Who can explore the full height of heaven, the full width of the earth, and the full depth of the abyss?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek parallel adds “and wisdom”: “Who can explore the full height of heaven, the full width of the earth, the abyss, and wisdom?”'
