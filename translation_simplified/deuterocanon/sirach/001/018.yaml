simplification_decisions:
- pob_phrase: The fear of Yahweh
  simplified_phrase: Fear of the LORD
  preserved_meaning: The biblical expression retains awe, reverence, and proper dread toward God.
  reasoning_layer_used: lexical and theological decisions
  rationale: The divine-name policy requires “the LORD,” while “fear” preserves the expression’s full force.
- pob_phrase: and she satisfies
  simplified_phrase: She fills people
  preserved_meaning: Personified wisdom abundantly supplies those who receive her.
  reasoning_layer_used: lexical decision and doctrine realignment
  rationale: A new sentence and an explicit human object make the clause natural while preserving feminine personification.
- pob_phrase: with the abundance of her produce
  simplified_phrase: with the abundant produce she yields
  preserved_meaning: Wisdom’s benefits are pictured as a plentiful agricultural yield.
  reasoning_layer_used: lexical and theological decisions
  rationale: The active wording clarifies the agricultural image while retaining its abundance.
translation_notes:
  risk_flags:
  - risk: Readers may understand “fear” as mere terror.
    mitigation: It remains because the source expression includes dread as well as awe and reverence.
  - risk: The surviving Hebrew and Greek forms differ substantially.
    mitigation: The Hebrew controls the main text, while the footnote preserves the Greek form and its ambiguity.
