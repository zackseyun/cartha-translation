translation:
  language: en
  text: Desire wisdom and obey the commandments. Then the Lord will give her to you.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Hebrew line supplied for this verse does not match Sirach 1:25, so this translation follows the Greek text.
    reason: textual_variant
  - marker: b
    text: The opening may also mean, “If you desire wisdom, obey the commandments, and the Lord will give her to you.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: keep the commandments
  simplified_phrase: obey the commandments
  preserved_meaning: The reader must live in obedience to the commandments.
  reasoning_layer_used: POB lexical decisions for διατήρησον and ἐντολάς
  rationale: “Obey” makes the intended sense of “keep” immediately clear.
- pob_phrase: the Lord will supply her to you
  simplified_phrase: the Lord will give her to you
  preserved_meaning: The Lord directly bestows personified wisdom on the obedient seeker.
  reasoning_layer_used: POB lexical and theological decisions for χορηγήσει, σοι, and αὐτήν
  rationale: “Give her to you” clearly preserves both direct bestowal and the recipient.
- pob_phrase: Desire wisdom, keep the commandments, and
  simplified_phrase: Desire wisdom and obey the commandments. Then
  preserved_meaning: The commands are followed by the promise that the Lord will give wisdom.
  reasoning_layer_used: Greek clause sequence and POB optimal-equivalence philosophy
  rationale: Two sentences make the command-and-result structure easier to follow.
interpretive_expansions:
- pob_phrase: and the Lord will supply her to you
  rendering: Then the Lord will give her to you
  claim: The final clause presents the Lord’s gift of wisdom as the result that follows the commands.
  evidence:
  - The Greek conjunction links the commands with the promise in sequence.
  - The POB presents the exhortations before the Lord’s promised provision.
  confidence: high
  alternatives_preserved:
  - The opening participle may be read conditionally, as noted in footnote b.
translation_notes:
  risk_flags:
  - risk: “Then” states the command-and-result relationship more explicitly than the Greek conjunction alone.
    mitigation: The wording clarifies the clause sequence without suggesting a time interval.
  - risk: Referring to wisdom as “her” may surprise modern readers.
    mitigation: The pronoun preserves the source’s feminine personification and the POB theological decision.
