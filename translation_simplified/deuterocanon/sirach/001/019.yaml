translation:
  language: en
  text: Wisdom is a strong staff to lean on and a support—praise and everlasting honor for everyone who follows her.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek reads, “The root of wisdom is to fear the Lord, and her branches are long life.” The surviving Hebrew text differs substantially.
    reason: textual_variant
simplification_decisions:
- pob_phrase: She is a staff of strength and a support
  simplified_phrase: Wisdom is a strong staff to lean on and a support
  preserved_meaning: Wisdom is pictured as a staff that provides strength and support.
  reasoning_layer_used: Hebrew lexical decisions for מַטּהֵ עֹז and מַשְׁעֵנָה
  rationale: Naming wisdom clarifies the pronoun, while “to lean on” explains the staff image without adding “firm.”
- pob_phrase: praise and everlasting honor to everyone
  simplified_phrase: praise and everlasting honor for everyone
  preserved_meaning: The compressed wording associates wisdom with praise and enduring honor for her followers without specifying that she gives them.
  reasoning_layer_used: Hebrew nominal construction and lexical decisions for תְּהִלָּה and כְבוֹד עוֹלָם
  rationale: The dash keeps the poetic list readable while preserving its ambiguous relationship to wisdom.
- pob_phrase: everyone who walks after her
  simplified_phrase: everyone who follows her
  preserved_meaning: The phrase describes everyone who follows personified wisdom.
  reasoning_layer_used: Hebrew idiom and personification decision
  rationale: “Follows her” gives the idiom’s natural meaning while retaining wisdom’s feminine personification.
translation_notes:
  risk_flags:
  - risk: The Hebrew and Greek preserve substantially different forms of this verse.
    mitigation: The Hebrew controls the main text, and the Greek form appears in the textual footnote.
  - risk: The poetic list leaves the exact relationship between wisdom, praise, and honor unstated.
    mitigation: The rendering avoids adding a verb such as “gives” and preserves the compressed construction.
