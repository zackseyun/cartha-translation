translation:
  language: en
  text: Wisdom reaches its fullness when people fear the Lord. Wisdom makes them drunk from its fruits.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A surviving Hebrew line here differs greatly: “With truthful people she has been established from of old, and with their offspring his loyalty is faithful.” Because that line is bracketed and uncertain in this location, the Greek reading is followed in the main text.'
    reason: textual_variant
