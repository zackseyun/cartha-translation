translation:
  language: en
  text: The fear of the Lord[a] is honor and joy, gladness and a crown of rejoicing.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “fear” means humble, obedient regard for the Lord, including reverence and awe.
    reason: simplification_note
  - marker: b
    text: The Greek piles up similar words to create a rich picture of honor and joy.
    reason: source_note
simplification_decisions:
- pob_phrase: glory
  simplified_phrase: honor
  preserved_meaning: The fear of the Lord is a source and mark of exalted honor.
  reasoning_layer_used: POB lexical decision for δόξα
  rationale: “Honor” expresses the contextual sense more directly for common readers.
- pob_phrase: exultation
  simplified_phrase: joy
  preserved_meaning: The fear of the Lord is associated with positive, celebratory joy.
  reasoning_layer_used: POB lexical decision for καύχημα and POB footnote
  rationale: “Joy” makes the positive sense immediate without adding a cause or recipient.
- pob_phrase: is glory and exultation, and gladness and a crown of rejoicing
  simplified_phrase: is honor and joy, gladness and a crown of rejoicing
  preserved_meaning: The fear of the Lord itself is described through four images of honor and joy.
  reasoning_layer_used: Greek coordinated nominal predicates and independent grounding review
  rationale: Keeping “is” preserves the verse’s poetic assertions rather than turning them into results or actions.
