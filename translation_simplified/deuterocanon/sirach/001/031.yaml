- pob_phrase: do not be false in the fear of Yahweh
  simplified_phrase: do not pretend that you fear Yahweh
  preserved_meaning: The warning concerns hypocrisy in one’s reverence for Yahweh, not merely spoken lies.
  reasoning_layer_used: POB lexical decisions for אַל תְּכַזֵּב and בְּיִרְאַת יְהֹוָה
  rationale: The direct wording makes religious falseness clear in common English.
- pob_phrase: and do not draw near to him with a divided heart
  simplified_phrase: Do not draw near to him with a divided heart.
  preserved_meaning: The command retains both approaching God and the Hebrew image of inward division.
  reasoning_layer_used: POB lexical decisions for וְאַל תִּקְרַב אֵלָיו and בְּלֵב וָלֵב
  rationale: A separate sentence is easier to follow while preserving the relational image.
