translation:
  language: en
  text: My son,[a] do not pretend that you fear Yahweh. Do not draw near to him with a divided heart.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Hebrew has this saying. The Greek version instead reads, “Whoever repays acts of kindness remembers what comes afterward, and in a time of falling, he will find support.”
    reason: textual_variant
  - marker: b
    text: The Hebrew literally says “with heart and heart,” an image of inner division or duplicity.
    reason: lexical_alternative
