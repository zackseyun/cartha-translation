translation:
  language: en
  text: This happened on the tenth day of Sivan, when he received the sacred objects that had been carried away from the Lord’s temple so that he could return them to the land of Judah. They were silver objects that King Zedekiah of Judah, son of Josiah, had made.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sivan is a month in the Jewish calendar.
    reason: cultural_note
simplification_decisions:
- pob_phrase: the vessels of the house of the Lord that had been carried out from the temple
  simplified_phrase: the sacred objects that had been carried away from the Lord’s temple
  preserved_meaning: These were temple objects that had previously been removed.
  reasoning_layer_used: The lexical decisions identify the vessels as worship objects and the Lord’s house as the temple.
  rationale: “Sacred objects” avoids the modern sense of ships while preserving their temple setting.
- pob_phrase: to return them to the land of Judah
  simplified_phrase: so that he could return them to the land of Judah
  preserved_meaning: He received the objects for the purpose of taking them back to Judah.
  reasoning_layer_used: The lexical decision says the infinitive expresses purpose.
  rationale: A purpose clause makes the connection between receiving and returning clear.
- pob_phrase: on the tenth of Sivan—silver vessels that Zedekiah son of Josiah, king of Judah, had made—
  simplified_phrase: This happened on the tenth day of Sivan ... They were silver objects that King Zedekiah of Judah, son of Josiah, had made.
  preserved_meaning: The date applies to the broader event, while the material, maker, ancestry, and title remain intact.
  reasoning_layer_used: The date formula and lexical decisions for material and prior making govern these details.
  rationale: Separate sentences clarify the details without limiting the date to the act of receiving alone.
