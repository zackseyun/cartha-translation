translation:
  language: en
  text: We did not ask for the Lord’s favor[a] so that each person would turn away from the thoughts of their evil heart.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “the face of the Lord,” an expression for seeking his favor or mercy.
    reason: lexical_alternative
  - marker: b
    text: “Thoughts” may also mean intentions or plans.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: entreat the favor of the Lord
  simplified_phrase: ask for the Lord’s favor
  preserved_meaning: They failed to appeal to the Lord for mercy and favorable attention.
  reasoning_layer_used: POB lexical and theological decisions on ἐδεήθημεν and “the face of the Lord”
  rationale: “Ask for” uses familiar English while retaining the appeal for the Lord’s favor.
- pob_phrase: that each one might turn
  simplified_phrase: so that each person would turn away
  preserved_meaning: The appeal was intended to lead each individual to turn from sin.
  reasoning_layer_used: POB lexical decisions on τοῦ ἀποστρέψαι and ἕκαστον
  rationale: The purpose clause is recast naturally, while “each person” keeps the distributive force.
- pob_phrase: the thoughts of their evil heart
  simplified_phrase: the thoughts of their evil heart
  preserved_meaning: The evil heart is portrayed as the source of thoughts and intentions from which they must turn.
  reasoning_layer_used: POB lexical and theological decisions on νοημάτων, καρδίας, and τῆς πονηρᾶς
  rationale: Keeping this image prevents the adjective “evil” from shifting from the heart to the thoughts.
translation_notes:
  risk_flags:
  - risk: “Thoughts” may be understood too narrowly to include intentions or plans.
    mitigation: Footnote b preserves the documented lexical range.
  - risk: “Ask for” is less intense than “entreat.”
    mitigation: The request for the Lord’s favor still conveys an appeal for mercy.
