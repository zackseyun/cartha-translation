translation:
  language: en
  text: 'We did not listen to your voice[a] when you told us to serve the king of Babylon. You fulfilled the words you had spoken through your servants the prophets: the bones of our kings and our ancestors would be taken from the places where they were buried.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Listen to your voice” also implies obeying what God said.
    reason: lexical_alternative
  - marker: b
    text: The Greek says “from their place,” referring here to the place where the bones were buried.
    reason: cultural_note
simplification_decisions:
- pob_phrase: did not listen to your voice to serve the king of Babylon
  simplified_phrase: did not listen to your voice when you told us to serve the king of Babylon
  preserved_meaning: The people refused to heed God's command to submit to Babylon's king.
  reasoning_layer_used: Lexical and theological decisions on hearing and service
  rationale: The new clause order makes the command clear while preserving the biblical image of listening to God's voice.
- pob_phrase: by the hands of your servants the prophets
  simplified_phrase: through your servants the prophets
  preserved_meaning: God delivered his words by means of the prophets who served him.
  reasoning_layer_used: Lexical decision on the Greek agency idiom
  rationale: “Through” expresses prophetic mediation without the opaque hand idiom.
- pob_phrase: the bones of our fathers would be brought out from their place
  simplified_phrase: the bones of our ancestors would be taken from the places where they were buried
  preserved_meaning: The ancestors' bones would be removed from their burial locations.
  reasoning_layer_used: Lexical decisions and POB cultural footnote
  rationale: “Ancestors” is clearer than “fathers,” and the burial setting makes the threatened desecration understandable.
interpretive_expansions:
- pob_phrase: from their place
  rendering: from the places where they were buried
  claim: The unspecified place is the burial location of the bones.
  evidence:
