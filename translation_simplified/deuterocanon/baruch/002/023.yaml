translation:
  language: en
  text: I will silence the sounds of gladness and rejoicing in the cities of Judah and outside Jerusalem.[a] I will also silence the voices of the bridegroom and the bride. The whole land will become impossible to travel through because of its inhabitants.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “outside Jerusalem”; some translations use “in the streets of Jerusalem” based on similar prophetic passages.
    reason: alternative_reading
  - marker: b
    text: The difficult Greek may instead mean that the land will be impossible to travel through because it has no inhabitants.
    reason: lexical_alternative
