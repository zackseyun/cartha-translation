simplification_decisions:
- pob_phrase: by the hand of your servant Moses
  simplified_phrase: through your servant Moses
  preserved_meaning: God spoke by means of Moses, his commissioned servant.
  reasoning_layer_used: POB lexical and theological decisions on ἐν χειρὶ and παιδός σου
  rationale: “Through” gives the ordinary meaning of the biblical agency idiom.
- pob_phrase: on the day when you commanded him
  simplified_phrase: when you commanded him
  preserved_meaning: God spoke through Moses at the time he commanded him to write the law.
  reasoning_layer_used: POB lexical decision on ἐν ἡμέρᾳ
  rationale: “When” expresses the same temporal relationship more naturally.
- pob_phrase: before the sons of Israel
  simplified_phrase: in the presence of the sons of Israel
  preserved_meaning: Moses was to write the law before the sons of Israel.
  reasoning_layer_used: POB lexical decision on ἐναντίον
  rationale: “In the presence of” prevents readers from taking “before” as a time reference.
