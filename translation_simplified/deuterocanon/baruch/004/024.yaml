  simplified_phrase: Zion’s neighbors now see that you have been taken captive
  preserved_meaning: Surrounding peoples witness Zion’s people in the concrete state of captivity.
  reasoning_layer_used: POB lexical decision for οἱ πάροικοι Σειὼν and αἰχμαλωσίαν
  rationale: The active wording makes “captivity” immediately understandable without weakening its force.
- pob_phrase: the salvation from your God that will come upon you
  simplified_phrase: the salvation that comes from your God. It will come upon you
