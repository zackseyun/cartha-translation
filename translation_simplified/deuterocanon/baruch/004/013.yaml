translation:
  language: en
  text: They did not know his righteous decrees. They did not live as God's commandments direct. They did not set foot on the paths of God's training in his righteousness.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “training” includes both instruction and correction.
    reason: lexical_alternative
  - marker: b
    text: Or “justice” instead of “righteousness.”
    reason: alternative_reading
