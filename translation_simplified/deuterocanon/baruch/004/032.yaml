  review_summary: The draft is clearer and rightly keeps the strong slavery sense warranted by the exile context. However, its active wording (“cities that enslaved”) adds a specific causal agency not expressed by the Greek dative construction or by the POB’s audited rendering. “Cities where your children were enslaved” is equally clear, preserves the contextual force of bondage, and avoids deciding who performed the enslavement. “She who took in your sons” is an acceptable accessible rendering of the personified city’s receiving of the sons.
