simplification_decisions:
- pob_phrase: Wretched are the cities to which your children were enslaved
  simplified_phrase: How wretched are the cities where your children were enslaved!
  preserved_meaning: The cities are lamented or denounced as places of the children’s bondage without identifying who enslaved them.
  reasoning_layer_used: Greek dative construction and lexical-theological decisions on δουλεύω
  rationale: “Where” is natural English and preserves both the strong slavery sense and the source’s ambiguity about agency.
- pob_phrase: wretched is she who received your sons
  simplified_phrase: How wretched is she who took in your sons!
  preserved_meaning: The singular city remains personified as a woman who received Zion’s sons.
  reasoning_layer_used: Lexical decision on ἡ δεξαμένη
  rationale: “Took in” is clearer than “received” while retaining the personification.
translation_notes:
  risk_flags:
  - risk: “Took in” can sound hospitable in modern English.
    mitigation: The surrounding language of enslavement and wretchedness keeps the hostile exile context clear.
