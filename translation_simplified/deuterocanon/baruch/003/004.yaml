  text: Lord Almighty, God of Israel, please hear the prayer of those of Israel who have died and of the sons who sinned before you. These sons did not listen to your voice, the voice of their God, and the evils have clung to us.[a]
  philosophy: optimal-equivalence
  footnotes:
