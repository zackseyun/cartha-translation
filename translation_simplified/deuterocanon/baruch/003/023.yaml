  text: The sons of Hagar, who seek understanding on earth; the merchants of Merran[a] and Teman; the storytellers[b]; and the seekers of understanding—none of them knew the way of wisdom or remembered her paths.
  philosophy: optimal-equivalence
  footnotes:
