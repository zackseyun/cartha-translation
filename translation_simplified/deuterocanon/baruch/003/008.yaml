translation:
  language: en
  text: Look at us today. We are living in exile, where you scattered us. We suffer public shame, live under a curse, and are obligated to pay what is due.[a] This has happened because of all the wrongs our ancestors committed when they turned away from the Lord our God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may mean paying a penalty or bearing a debt. The Greek refers broadly to an obligation incurred under judgment.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Behold, today we are in our exile
  simplified_phrase: Look at us today. We are living in exile
  preserved_meaning: The speaker emphatically draws attention to the people's present exile.
  reasoning_layer_used: Lexical decisions for ἰδοὺ and ἀποικίᾳ
  rationale: A direct appeal and two short clauses preserve the force in natural English.
- pob_phrase: for reproach and for a curse
  simplified_phrase: We suffer public shame, live under a curse
  preserved_meaning: The exiles endure public disgrace and remain under a curse as distinct conditions.
  reasoning_layer_used: Lexical decisions for ὀνειδισμός and ἀρά
  rationale: This expresses reproach as one form of public shame without adding a separate act of insult.
- pob_phrase: for payment
  simplified_phrase: are obligated to pay what is due
  preserved_meaning: They bear an incurred obligation that may involve either debt or penalty under judgment.
  reasoning_layer_used: Lexical and theological decisions for ὄφλησις
  rationale: The wording keeps the payment image while the footnote preserves the term's wider range.
interpretive_expansions:
- pob_phrase: according to all the wrongdoings of our fathers
  rendering: This has happened because of all the wrongs our ancestors committed
  claim: Their present condition results from and corresponds to their ancestors' wrongdoing.
  evidence:
