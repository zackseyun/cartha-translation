translation:
  language: en
  text: But God, who knows everything, knows Wisdom.[a] Through his understanding, he found her out. He prepared the earth for all time and filled it with four-footed animals.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wisdom is spoken of as “her” because this passage presents wisdom as a woman, not because Wisdom is a separate deity.
    reason: cultural_note
simplification_decisions:
- pob_phrase: he who knows all things knows her
  simplified_phrase: God, who knows everything, knows Wisdom
  preserved_meaning: God has complete knowledge and knows the personified Wisdom.
  reasoning_layer_used: lexical rationale, immediate context, and theological decision
  rationale: Naming God and Wisdom makes both references clear while retaining the personification.
- pob_phrase: by his understanding
  simplified_phrase: Through his understanding
  preserved_meaning: God found Wisdom out by means of his own understanding.
  reasoning_layer_used: lexical decision
  rationale: “Through” expresses the instrumental sense in natural English.
- pob_phrase: for everlasting time
  simplified_phrase: for all time
  preserved_meaning: God’s preparation of the earth has enduring duration.
  reasoning_layer_used: lexical alternatives and grounding review
  rationale: This keeps the duration attached to God’s preparing without claiming that the earth itself will endure forever.
interpretive_expansions:
- pob_phrase: he who knows all things knows her
  rendering: God, who knows everything, knows Wisdom
  claim: The unnamed knower is God, and “her” refers to personified Wisdom.
  evidence:
