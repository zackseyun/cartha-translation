translation:
  language: en
  text: Because of this, you have put your fear in our hearts[a], so that we may call on your name. We will praise you while we are in exile, because we have rejected from our hearts all the wrongdoing of our fathers, who sinned before you.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “fear of you.” “Your fear” includes fear directed toward God and should not be reduced to mere reverence.
    reason: lexical_alternative
  - marker: b
    text: Or “sinned against you” or “sinned in your sight.”
    reason: lexical_alternative
