translation:
  language: en
  text: Jerusalem, take off your garment of mourning and suffering. Put on the splendor of the glory that comes from God, and wear it forever.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Take off, O Jerusalem
  simplified_phrase: Jerusalem, take off
  preserved_meaning: Jerusalem remains directly addressed and commanded as a personified city.
  reasoning_layer_used: Theological decision on the personification of Jerusalem
  rationale: Removing “O” makes the direct address natural in modern English.
- pob_phrase: the garment of your mourning and affliction
  simplified_phrase: your garment of mourning and suffering
  preserved_meaning: The clothing image still portrays Jerusalem’s grief and painful condition.
  reasoning_layer_used: Lexical decisions for στολή, πένθος, and κάκωσις
  rationale: “Suffering” is clearer than “affliction” while remaining broad about its cause.
- pob_phrase: put on forever the splendor of the glory from God
  simplified_phrase: Put on the splendor of the glory that comes from God, and wear it forever
  preserved_meaning: Splendor and glory remain distinct, God remains their source, and the new clothing endures permanently.
  reasoning_layer_used: Lexical decisions for εὐπρέπεια, δόξα, παρὰ τοῦ θεοῦ, and εἰς τὸν αἰῶνα
  rationale: The added wearing clause makes the permanence attach clearly to Jerusalem’s new adornment.
interpretive_expansions:
- pob_phrase: put on forever
  rendering: put on ... and wear it forever
  claim: Jerusalem’s God-given adornment is to remain permanently, rather than the act of dressing being endlessly repeated.
  evidence:
  - The POB rationale defines εἰς τὸν αἰῶνα as enduring permanence.
  - The clothing metaphor naturally allows the lasting state to be expressed as wearing the garment.
  confidence: high
  alternatives_preserved:
  - put on forever
  - put on ... for eternity
