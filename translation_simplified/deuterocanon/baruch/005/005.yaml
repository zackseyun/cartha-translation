translation:
  language: en
  text: Rise, Jerusalem! Stand on a high place and look east. See your children gathered from where the sun sets to where it rises, at the word of the Holy One.[a] They are rejoicing in the remembrance of God.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “by the word of the Holy One.”
    reason: lexical_alternative
  - marker: b
    text: Or “rejoicing because God remembered them” or “rejoicing as they remember God.” The Greek may refer either to God remembering them or to their remembering God.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Rise up, Jerusalem, and stand on the height
  simplified_phrase: Rise, Jerusalem! Stand on a high place
  preserved_meaning: Jerusalem is summoned to take an elevated position without specifying a mountain.
  reasoning_layer_used: Lexical decisions for ἀνάστηθι and στῆθι ἐπὶ τοῦ ὑψηλοῦ
  rationale: Two direct sentences make the summons clear while preserving the elevated viewpoint.
- pob_phrase: look toward the east
  simplified_phrase: look east
  preserved_meaning: Jerusalem is directed toward the east.
  reasoning_layer_used: Lexical decision for πρὸς ἀνατολάς
  rationale: The shorter direction is natural English and keeps the same orientation.
- pob_phrase: from the setting of the sun to its rising
  simplified_phrase: from where the sun sets to where it rises
  preserved_meaning: The children have been gathered across the full sweep from west to east.
  reasoning_layer_used: Lexical decisions for συνηγμένα and ἀπὸ ἡλίου δυσμῶν ἕως ἀνατολῶν
  rationale: The wording keeps both the passive gathered state and the source-language sun image.
translation_notes:
  risk_flags:
