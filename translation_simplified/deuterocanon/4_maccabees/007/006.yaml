translation:
  language: en
  text: O priest, you are worthy of the priesthood! You did not defile your sacred teeth. You did not involve your stomach—where godliness and purity had found room—in eating what defiles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in defiling eating.” The Greek refers to taking part in eating food that brings ritual or moral defilement.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: O priest, worthy of the priesthood
  simplified_phrase: O priest, you are worthy of the priesthood!
  preserved_meaning: The priest is directly and emphatically praised as worthy of his sacred office.
  reasoning_layer_used: POB lexical decision for Ὦ ἄξιε τῆς ἱερωσύνης ἱερεῦ
  rationale: A present-tense exclamation makes the direct praise clear without imposing a past-time meaning.
- pob_phrase: nor did you make your stomach—which had room for godliness and purity—a partner in
  simplified_phrase: You did not involve your stomach—where godliness and purity had found room—in
  preserved_meaning: His stomach did not participate in defiling consumption and remained associated with godliness and purity.
  reasoning_layer_used: POB lexical decisions for χωρήσασαν γαστέρα and ἐκοινώνησας
  rationale: The active wording removes the awkward partnership construction while preserving participation and the image of room within the stomach.
- pob_phrase: defiling food
  simplified_phrase: eating what defiles
  preserved_meaning: He refused to participate in eating that would bring ritual or moral defilement.
  reasoning_layer_used: POB lexical decision and footnote for μιεροφαγίᾳ
  rationale: This wording makes the act of eating explicit without assigning the compound’s full force only to the food.
