- pob_phrase: No city under siege ever held out against many and varied siege engines as that most holy man ...
  simplified_phrase: No city under siege ever held out against many kinds of siege engines as that most holy man did.
  preserved_meaning: The man’s endurance is compared to a city resisting a military siege.
  reasoning_layer_used: POB lexical decisions for city, siege engines, and held out against
  rationale: The added verb “did” completes the comparison, while “many kinds” states the same idea plainly.
- pob_phrase: while his sacred soul was being burned by tortures and the wheel
  simplified_phrase: Even while tortures and the wheel burned his sacred soul
  preserved_meaning: His suffering is pictured as fire attacking his sacred soul.
  reasoning_layer_used: POB lexical decisions for sacred soul, tortures, the wheel, and was being burned
  rationale: The active clause is easier to follow without weakening the burning image.
- pob_phrase: stirred up those besieging him through the reason that defends godliness
  simplified_phrase: he unsettled those laying siege to him by means of reason, which defends godliness
  preserved_meaning: His reason-enabled resistance affected his persecutors while actively defending godliness.
  reasoning_layer_used: POB lexical rationale and theological decisions for reason and godliness
  rationale: “Unsettled” clarifies the intended effect, and “by means of” makes reason’s role explicit.
