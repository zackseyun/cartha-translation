translation:
  language: en
  text: No city under siege ever held out against many kinds of siege engines as that most holy man did. Even while tortures and the wheel[a] burned his sacred soul, he unsettled those laying siege to him by means of reason, which defends godliness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may refer to racks or, more generally, instruments of torture; the exact device is uncertain.
    reason: lexical_alternative
