translation:
  language: en
  text: If an old man regarded tortures, even to the point of death, as insignificant because of his devotion to God,[a] then surely reason guided by devotion to God rules over the passions—the powerful desires and emotions within us.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “for the sake of his devotion to God.”
    reason: lexical_alternative
