- pob_phrase: came forward of my own accord
  simplified_phrase: chose to step forward
  preserved_meaning: The speaker voluntarily presented himself to the tyrant.
  reasoning_layer_used: Lexical decisions for αὐτὸς, ἀπʼ ἐμαυτοῦ, and παρῆλθον
  rationale: This wording states the speaker’s personal initiative in direct modern English.
- pob_phrase: so that, after killing me also, you might incur punishment
  simplified_phrase: so that, by killing me too, you would incur punishment
  preserved_meaning: The speaker came forward for the stated purpose that his death would add to the tyrant’s punishment.
  reasoning_layer_used: Lexical decisions for ὅπως, κἀμέ, κατακτείνας, and ὀφλήσῃς
  rationale: The revision preserves both the purpose relation and the force of incurring punishment.
- pob_phrase: for still more acts of wrongdoing
