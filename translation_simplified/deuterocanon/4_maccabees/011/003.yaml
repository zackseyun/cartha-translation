  preserved_meaning: Killing the speaker would add to the tyrant’s existing offenses.
  reasoning_layer_used: Lexical decision for περὶ πλειόνων ἀδικημάτων
  rationale: The shorter phrase retains the cumulative sense of additional wrongdoing.
