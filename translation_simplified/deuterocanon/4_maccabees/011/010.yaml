  text: They tied him to the wheel on his knees and secured his legs with iron shackles. Then they bent him at the waist over the wheel’s wedge.[a] His whole body was bent backward around the wheel like a scorpion as he was being dismembered.
  philosophy: optimal-equivalence
  footnotes:
