translation:
  language: en
  text: Then he became deeply agitated and ordered that other Hebrews of the same age be brought in. If they ate pork, he was to release them. But if they objected to eating it, he was to torture them even more harshly.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “more bitterly,” meaning with even greater harshness or severity.
    reason: lexical_alternative
