translation:
  language: en
  text: Why has this stubborn urge to fight become so deeply rooted in us? Why does this deadly endurance appeal to us? We could live undisturbed if fear of the tortures that lead to death made us obey the king.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The opening Greek is difficult, but the apparent sense is that they could live undisturbed by yielding to the king out of fear of deadly torture.
    reason: textual_variant
simplification_decisions:
- pob_phrase: such contentiousness been instilled in us
  simplified_phrase: this stubborn urge to fight become so deeply rooted in us
  preserved_meaning: The speaker condemns their inwardly fixed and defiant resolve.
  reasoning_layer_used: Lexical and theological decisions on φιλονεικία and the king's hostile rhetoric.
  rationale: The concrete wording makes the hostile charge understandable without recasting it as noble courage.
- pob_phrase: deadly endurance please us
  simplified_phrase: this deadly endurance appeal to us
  preserved_meaning: Their steadfastness is portrayed as attractive even though it is associated with death.
  reasoning_layer_used: Lexical decision on θανατηφόρος καρτερία and ἀρέσκει.
  rationale: “Appeal to us” is more natural modern English while retaining the negative description “deadly endurance.”
- pob_phrase: it is possible to live in tranquility by obeying the king
  simplified_phrase: We could live undisturbed ... obey the king
  preserved_meaning: Compliance with the king is presented as the available path to a quiet life.
  reasoning_layer_used: Lexical decisions on παρόν, ἀταραξία, and πεισθέντας.
  rationale: The direct conditional sentence replaces abstract phrasing with a clear contrast.
