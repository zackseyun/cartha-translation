translation:
  language: en
  text: of this sweet world. Let us not rush toward the suffering we cannot avoid,[a] nor boast about our own torture on the rack.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek is compressed and may also mean “Let us not compel what is inevitable” or “Let us not do violence to necessity.”
    reason: lexical_alternative
  - marker: b
    text: A rack was an instrument used for torture; the Greek literally says “our own rack.”
    reason: cultural_note
