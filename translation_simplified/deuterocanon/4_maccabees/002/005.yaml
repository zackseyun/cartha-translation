simplification_decisions:
- pob_phrase: For the law says, then
  simplified_phrase: So the law says
  preserved_meaning: The law’s command supports the preceding argument.
  reasoning_layer_used: The lexical decision for γοῦν identifies an inferential or confirmatory link.
  rationale: “So” expresses the connection more naturally than the heavier phrase “For ... then.”
- pob_phrase: You shall not desire
  simplified_phrase: Do not desire
  preserved_meaning: The command forbids setting one’s desire on what belongs to another.
  reasoning_layer_used: The lexical and theological decisions prefer “desire” while retaining “covet” as an alternative.
  rationale: A direct command is clearer modern English without weakening the prohibition.
- pob_phrase: nor anything that belongs to your neighbor
  simplified_phrase: or anything else that belongs to your neighbor
  preserved_meaning: The prohibition extends beyond the neighbor’s wife to every other possession.
  reasoning_layer_used: The lexical decision reads οὐδὲ ὅσα as a comprehensive expression.
  rationale: “Anything else” makes the full scope and relationship between the clauses immediately clear.
translation_notes:
  risk_flags:
  - risk: “Desire” can sound broader than the Greek prohibition against strongly desiring what belongs to another.
    mitigation: The object clauses limit the desire, and the footnote preserves the traditional “covet.”
