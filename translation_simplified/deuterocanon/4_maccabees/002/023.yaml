translation:
  language: en
  text: He gave him a law for living as a citizen. By living according to that law, he would rule a kingdom marked by self-control, justice, goodness, and courage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kingdom” may also mean “kingship” or “royal rule.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: according to which, by conducting himself as a citizen
  simplified_phrase: for living as a citizen. By living according to that law
  preserved_meaning: The ruler conducts his civic life under the law he received, and on that basis he rules.
  reasoning_layer_used: POB lexical and theological decisions on πολιτευόμενος
  rationale: The split sentence keeps both the citizen image and the law’s direct connection to his rule.
- pob_phrase: he would rule a kingdom that was self-controlled and just and good and courageous
  simplified_phrase: he would rule a kingdom marked by self-control, justice, goodness, and courage
  preserved_meaning: The kingdom or royal rule displays the same four moral and political virtues.
  reasoning_layer_used: POB lexical decisions for βασιλείαν and the four adjectives
  rationale: Familiar virtue nouns make the description easier to follow without merging the four qualities.
- pob_phrase: And to him he gave
  simplified_phrase: He gave him
  preserved_meaning: The giver provides the previously mentioned person with a law.
  reasoning_layer_used: POB translation and lexical decision for τούτῳ
  rationale: Ordinary English word order avoids adding an unsupported sense of “also.”
