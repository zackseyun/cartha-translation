simplification_decisions:
- pob_phrase: what is surprising if
  simplified_phrase: why should it be surprising if
  preserved_meaning: The verse remains a rhetorical question about why this result would be remarkable.
  reasoning_layer_used: Lexical decision for τί θαυμαστόν
  rationale: This question form is more natural in common English.
- pob_phrase: the desires of the soul are nullified
  simplified_phrase: the soul’s desires lose their power
  preserved_meaning: The desires become ineffective rather than being erased or condemned.
  reasoning_layer_used: Lexical decisions for ἐπιθυμίαι, ψυχῆς, and ἀκυροῦνται
  rationale: The active wording clearly expresses loss of effective force while retaining “soul.”
- pob_phrase: participation in beauty
  simplified_phrase: sharing in beauty
  preserved_meaning: The phrase still describes participation in beauty without identifying the participant.
  reasoning_layer_used: Lexical decisions for κάλλος and μετουσία and the POB footnote
  rationale: “Sharing” makes the abstract noun easier to understand while preserving its philosophical meaning.
