translation:
  language: en
  text: Moses was angry with Dathan and Abiron.[a] Yet he did not act against them out of anger. Instead, he used reason to restrain his anger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek form of this name is “Abiron”; it is traditionally known as “Abiram.”
