translation:
  language: en
  text: Why, then, did our all-wise father Jacob blame Simeon, Levi, and those with them for slaughtering the people of Shechem as a whole? He did not blame them without reason,[a] for he said, “Cursed be their anger.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek is compressed and may instead mean that they carried out the massacre without being guided by reason.
    reason: lexical_alternative
  - marker: b
    text: This quotation echoes Genesis 49:7.
    reason: cross_reference
