translation:
  language: en
  text: Therefore, by living under the law, even people who love money force themselves to act against their own inclinations. They lend to those in need without charging interest, and when the seventh year arrives,[a] they cancel the debt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The law provided for debts to be released in the seventh year.
    reason: cultural_note
  - marker: b
    text: Or “they accept the loss on the loan”; the Greek may emphasize the financial loss involved in canceling the debt.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: even if someone is money-loving
  simplified_phrase: even people who love money
  preserved_meaning: The source image of loving money remains explicit.
  reasoning_layer_used: POB lexical decision for φιλάργυρός
  rationale: A natural plural construction avoids the awkward adjective “money-loving.”
- pob_phrase: by living under the law he compels his own way of life
  simplified_phrase: by living under the law, even people who love money force themselves to act against their own inclinations
  preserved_meaning: The law governs their lives and leads them to restrain their money-loving disposition.
  reasoning_layer_used: POB lexical decisions for τῷ νόμῳ πολιτευόμενος and βιάζεται τὸν ἑαυτοῦ τρόπον
  rationale: This preserves the instrumental force of “by” without implying a new stage or change in lifestyle.
- pob_phrase: lending to those in need without interest, and when the seventh year arrives, canceling the debt
  simplified_phrase: They lend to those in need without charging interest, and when the seventh year arrives, they cancel the debt.
  preserved_meaning: Interest-free lending and seventh-year debt release remain distinct acts.
  reasoning_layer_used: POB lexical and theological decisions on sabbatical debt release
  rationale: Finite verbs and a new sentence make both legal actions easy to follow.
