simplification_decisions:
- pob_phrase: reason is seen to prevail
  simplified_phrase: it is clear that reason overcomes
  preserved_meaning: Reason’s actual dominance over the passions is evident.
  reasoning_layer_used: Lexical and theological decisions for φαίνεται, κρατεῖν, and λογισμός
  rationale: The direct wording preserves both demonstrated victory and “reason” as the book’s key term.
- pob_phrase: the more violent passions
  simplified_phrase: the fiercer passions
  preserved_meaning: These emotions exert unusually strong force.
  reasoning_layer_used: Lexical decision for διὰ τῶν βιαιοτέρων ... παθῶν
  rationale: “Fiercer” is natural English and retains the image of forceful passions.
- pob_phrase: love of power, empty glory
  simplified_phrase: the desire for power, the pursuit of empty glory
  preserved_meaning: The vices involve craving rule and seeking glory that has no substance.
  reasoning_layer_used: Lexical and theological decisions for φιλαρχίας and κενοδοξίας
  rationale: The action phrases clarify both vices while keeping the image of empty glory.
translation_notes:
  risk_flags:
  - risk: “Overcomes” may sound more decisive than POB’s “prevail.”
    mitigation: The lexical rationale includes mastery and control while φαίνεται marks the dominance as evident.
  - risk: Modern readers may understand “envy” too narrowly.
    mitigation: The footnote preserves the broader sense of malicious ill will or the evil eye.
