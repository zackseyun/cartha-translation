  preserved_meaning: Attachment to friends does not prevent their evil from being morally challenged.
  reasoning_layer_used: POB rendering and lexical range of ἐξελέγχων
  rationale: “Rebuking” is common English and preserves reproof without implying a specific confrontation scene.
