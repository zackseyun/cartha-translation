simplification_decisions:
- pob_phrase: masters love for children
  simplified_phrase: controls a person’s love for their children
  preserved_meaning: Reasoned self-control has mastery over a person’s natural affection for their children.
  reasoning_layer_used: Lexical decision for κυριεύει and the POB footnote on parental affection
  rationale: The wording states the relationship naturally while preserving the strong sense of control.
- pob_phrase: punishing them for their wickedness
  simplified_phrase: punishing the children for their wickedness
  preserved_meaning: The children are punished because of their wrongdoing.
  reasoning_layer_used: Lexical decisions for κολάζων and διὰ κακίαν αὐτῶν
  rationale: Repeating “the children” removes pronoun ambiguity without weakening the punishment.
- pob_phrase: reproving them for their evil
