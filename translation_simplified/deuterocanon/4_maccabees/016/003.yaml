translation:
  language: en
  text: The lions around Daniel were savage, and the blazing furnace burned with its fiercest fire against Mishael. Yet neither was as fierce as the fire that love for her children kindled within this mother as she watched her seven sons being tortured.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “as her love for her children made her burn more fiercely.” The Greek uses fire imagery for her inner anguish.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the lions around Daniel were not so savage, nor the blazing furnace with its fiercest fire against Mishael
  simplified_phrase: The lions around Daniel were savage, and the blazing furnace burned with its fiercest fire against Mishael. Yet neither was as fierce
  preserved_meaning: Daniel’s lions and the hostile furnace fire against Mishael are compared with the mother’s more intense inner anguish.
  reasoning_layer_used: POB lexical decisions and source rhetoric
  rationale: Two shorter sentences clarify the comparison while preserving the fire’s relation to Mishael.
- pob_phrase: that mother’s own nature was inflamed by love for her children
  simplified_phrase: the fire that love for her children kindled within this mother
  preserved_meaning: Her natural love for her children set her inner being ablaze with anguish.
  reasoning_layer_used: POB theological decision on metaphorical fire imagery
  rationale: This keeps both the inward fire image and love as its cause in clear English.
- pob_phrase: when she saw her seven sons being tortured
  simplified_phrase: as she watched her seven sons being tortured
  preserved_meaning: Her anguish arose as she witnessed the continuing torture of all seven sons.
  reasoning_layer_used: POB lexical decisions for ὁρῶσα and βασανιζομένους
  rationale: “Watched” naturally presents the event unfolding without weakening “tortured.”
translation_notes:
  risk_flags:
  - risk: “Fire kindled within” could be mistaken for a physical event.
    mitigation: The reference to maternal love and the footnote mark it as inner anguish.
