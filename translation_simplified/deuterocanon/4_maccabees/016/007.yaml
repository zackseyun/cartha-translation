translation:
  language: en
  text: Oh, my seven pregnancies—all for nothing! My seven ten-month terms[a]—useless! All my nursing—fruitless! All my feeding them with milk—misery!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ten-month terms” reflects the ancient way of counting a normal pregnancy.
    reason: cultural_note
simplification_decisions:
- pob_phrase: O seven futile pregnancies
  simplified_phrase: Oh, my seven pregnancies—all for nothing!
  preserved_meaning: The mother grieves that bearing her seven sons has ended without the earthly outcome she hoped for.
  reasoning_layer_used: Lexical decision for μάταιοι and the maternal lament context.
  rationale: “All for nothing” expresses the emotional force of “futile” in common English.
- pob_phrase: seven useless ten-month terms
  simplified_phrase: My seven ten-month terms—useless!
  preserved_meaning: The ancient ten-month description of seven pregnancies remains intact.
  reasoning_layer_used: Theological decision on the ancient gestational idiom δεκάμηνοι.
  rationale: The unusual ancient expression is retained and briefly explained in a note.
- pob_phrase: miserable suckling
  simplified_phrase: All my feeding them with milk—misery!
  preserved_meaning: The concrete image of nourishing the children with milk and the mother's anguish are both preserved.
  reasoning_layer_used: Lexical decisions for γαλακτοτροφίαι and ταλαίπωροι.
  rationale: The wording replaces the less familiar “suckling” without removing its milk-feeding image.
