translation:
  language: en
  text: Oh, my children! Some of you are unmarried, and others are married but have no children.[a] I will never see your children. I will not be called grandmother or be counted blessed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek likely means “childless” or “without offspring.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: O my children—some unmarried, and others married but childless—
  simplified_phrase: Oh, my children! Some of you are unmarried, and others are married but have no children.
  preserved_meaning: Her children include both unmarried and married but childless members.
  reasoning_layer_used: POB lexical decisions for ἄγαμοι, γαμήσαντες, and ἄνοιντοι
  rationale: Shorter clauses and “have no children” make the lament immediately clear.
- pob_phrase: I will not see your children
  simplified_phrase: I will never see your children.
  preserved_meaning: She grieves that she will have no grandchildren through them.
  reasoning_layer_used: POB lexical decision for οὐκ ὄψομαι ὑμῶν τέκνα
  rationale: “Never” naturally conveys the final future loss expressed in context.
- pob_phrase: nor will I be counted blessed when I am called grandmother
  simplified_phrase: I will not be called grandmother or be counted blessed.
  preserved_meaning: She will lose both grandmotherhood and the honor socially associated with it.
  reasoning_layer_used: POB lexical decision and review finding for κληθεῖσα μακαρισθήσομαι
  rationale: The passive wording preserves social recognition without assigning both actions to one agent.
translation_notes:
  risk_flags:
  - risk: “Or” presents the two linked losses as parallel outcomes rather than an explicit temporal relation.
    mitigation: It retains both passive outcomes while avoiding the misleading single-agent construction.
