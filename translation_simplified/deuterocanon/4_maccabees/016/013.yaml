translation:
  language: en
  text: But her mind was as firm as an unbreakable stone. She was sending the whole number of her sons onward toward immortality.[a] So she pleaded with them all the more, urging them toward death for the sake of godliness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek image is unusual and may instead mean “echoing back the number of her sons into immortality.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: having a mind like adamant
  simplified_phrase: her mind was as firm as an unbreakable stone
  preserved_meaning: Her inner firmness is pictured as extremely hard and impossible to break.
  reasoning_layer_used: POB lexical decision for ἀδάμαντινον and νοῦν
  rationale: This keeps the concrete hardness image while explaining the unfamiliar word “adamant.”
- pob_phrase: sending the number of her sons on to immortality
  simplified_phrase: sending the whole number of her sons onward toward immortality
  preserved_meaning: She directs her sons as a complete group toward immortality without defining how they attain it.
  reasoning_layer_used: POB lexical and theological decisions for ἀντικτυποῦσα and εἰς ἀθανασίαν
  rationale: “Onward toward” clarifies movement while the footnote preserves the metaphor’s uncertainty.
- pob_phrase: she was all the more urging them toward death for the sake of godliness, pleading with them
  simplified_phrase: So she pleaded with them all the more, urging them toward death for the sake of godliness
  preserved_meaning: She urgently entreats her sons to endure death out of faithful devotion to God.
  reasoning_layer_used: POB lexical and theological decisions for μᾶλλον, προετρέπετο, ἱκετεύουσα, and εὐσέβεια
  rationale: The reordered clauses state her emotional appeal in natural English without weakening either action.
