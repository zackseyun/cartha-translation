translation:
  language: en
  text: She did not try to persuade even one of them to turn back and avoid death. Nor did she grieve as they were dying.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: try to turn any of them away so that they might not die
  simplified_phrase: try to persuade even one of them to turn back and avoid death
  preserved_meaning: She made no attempt to dissuade any of them from the course that would lead to death.
  reasoning_layer_used: POB lexical decisions for ἀπέτρεπεν, αὐτῶν τινα, and ἵνα μὴ ἀποθάνωσιν
  rationale: The wording makes the attempted persuasion and purpose clear while preserving the distributive force of “any.”
- pob_phrase: nor did she grieve as they were dying
  simplified_phrase: Nor did she grieve as they were dying
  preserved_meaning: She did not give way to sorrow while their deaths were taking place.
  reasoning_layer_used: POB lexical decisions for ἐλυπήθη and ὡς ἀποθνῃσκόντων
  rationale: The original wording is already clear and preserves both substantial sorrow and the ongoing circumstance.
