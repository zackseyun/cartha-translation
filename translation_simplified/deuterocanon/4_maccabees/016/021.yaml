  preserved_meaning: Daniel is still identified by his righteous character.
  reasoning_layer_used: Lexical and theological decisions for ὁ δίκαιος
  rationale: The appositive form is natural English and retains the moral-religious description.
- pob_phrase: a furnace of fire
  simplified_phrase: a blazing furnace
  preserved_meaning: The concrete furnace image and the destructive force of its fire remain clear.
  reasoning_layer_used: Lexical decision for εἰς κάμινον πυρὸς
  rationale: This idiomatic wording communicates the Greek image immediately.
- pob_phrase: and they endured because of God
  simplified_phrase: and they endured because of God
  preserved_meaning: The three men remained steadfast, with God as the reason for their endurance.
  reasoning_layer_used: Lexical decisions for ὑπέμειναν and διὰ τὸν θεόν
  rationale: Keeping the coordinated clause directly links their endurance to the furnace ordeal without adding an object.
