translation:
  language: en
  text: At that time, virtue presided over the contest for those being tested through endurance. The victory was found in freedom from decay and in life that lasts for a long time.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “eternal life.” The Greek says “life of long duration,” while “freedom from decay” may suggest everlasting life.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: virtue was then presiding over the contest
  simplified_phrase: At that time, virtue presided over the contest
  preserved_meaning: Virtue remains personified as the official overseeing an athletic contest.
  reasoning_layer_used: Lexical decisions for ἀθλοθέτει and ἀρετή
  rationale: The direct sentence structure keeps the contest image clear.
- pob_phrase: for those being tested through endurance
  simplified_phrase: for those being tested through endurance
  preserved_meaning: The sufferers remain the passive recipients of testing, with endurance expressing how they undergo it.
  reasoning_layer_used: Lexical decisions for δοκιμάζουσι and διʼ ὑπομονῆς
  rationale: Retaining the passive wording avoids shifting attention from their ordeal to an added active response.
- pob_phrase: the victory was in incorruptibility, in long-lasting life
  simplified_phrase: The victory was found in freedom from decay and in life that lasts for a long time
  preserved_meaning: The two descriptions of victory remain distinct without making the life unambiguously eternal.
  reasoning_layer_used: Lexical and theological decisions for ἀφθαρσίᾳ and ζωῇ πολυχρονίῳ
  rationale: Common wording explains incorruptibility while preserving both coordinated descriptions.
translation_notes:
  risk_flags:
  - risk: “Freedom from decay” may imply fully eternal life.
    mitigation: The main text retains “lasts for a long time,” and the footnote presents eternal life only as an alternative.
