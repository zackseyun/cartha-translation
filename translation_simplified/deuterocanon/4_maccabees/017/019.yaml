translation:
  language: en
  text: So these men too, who were made holy through God[a], have been honored not only with this honor but also because, through them, our nation was not overcome by its enemies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “by God”; the Greek can express God’s agency.
