simplification_decisions:
- pob_phrase: And so these men also, having been made holy through God
  simplified_phrase: So these men too, who were made holy through God
  preserved_meaning: The men share in the preceding honor and received their holy status through God.
  reasoning_layer_used: Lexical and theological decisions on ἁγιασθέντες and διὰ θεοῦ
  rationale: The relative clause removes the awkward participle while “too” retains the additive link.
- pob_phrase: have been honored not only with this honor, but also because
  simplified_phrase: have been honored not only with this honor but also because
  preserved_meaning: Their honor includes both the honor already mentioned and the nation’s deliverance through them.
  reasoning_layer_used: Lexical decisions on τετίμηνται, ταύτῃ τῇ τιμῇ, and τῷ διʼ αὐτοὺς
  rationale: Keeping one paired construction makes the two related grounds of honor clear.
- pob_phrase: our nation did not let the enemies prevail
  simplified_phrase: our nation was not overcome by its enemies
  preserved_meaning: Through the martyrs, the enemies failed to overpower the Jewish nation.
  reasoning_layer_used: Lexical rationale for μὴ ἐπικρατῆσαι
  rationale: The passive wording states the outcome without implying that the nation could grant permission.
