  text: It was as if their lives had become a ransom for the nation’s sin.[a] Through the blood of these devout people and their death as an atoning sacrifice,[b] God’s providential care preserved Israel, even though the nation had already suffered mistreatment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a substitute life for the nation’s sin” or “a life given in exchange.”
    reason: lexical_alternative
  - marker: b
    text: The Greek can also be rendered “propitiatory”; its more literal sense in some contexts is “mercy seat.”
    reason: lexical_alternative
