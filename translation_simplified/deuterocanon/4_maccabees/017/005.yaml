translation:
  language: en
  text: The moon among the stars in the sky is not as majestic as you are. You led[a] your seven sons—equal to the stars—toward godliness. You stand honored before God, and you have been firmly established in heaven with them.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word translated “led” can also mean “enlightened” or “led into the light,” echoing the moon-and-stars image.
    reason: lexical_alternative
  - marker: b
    text: The final phrase can also be translated more literally, “established in the sky with them,” but the context points to heavenly honor with her sons.
    reason: alternative_reading
