  preserved_meaning: They directed their continuing attention toward God.
  reasoning_layer_used: Lexical decision on εἰς θεὸν ἀφορῶντες
  rationale: The concrete gaze image expresses sustained focus in familiar English.
- pob_phrase: enduring torments even to death
