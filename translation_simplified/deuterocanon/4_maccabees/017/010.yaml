translation:
  language: en
  text: They too vindicated the nation before God.[a] They kept their eyes fixed on God and endured torture, even to death.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “won justice for the nation,” or “avenged the nation.” Here “vindicated” does not mean that they took violent revenge.
    reason: lexical_alternative
