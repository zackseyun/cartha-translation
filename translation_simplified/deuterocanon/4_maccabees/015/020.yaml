translation:
  language: en
  text: 'She saw her children’s flesh cut off and piled on their flesh, their severed hands piled on their hands, their heads struck off and piled on their heads, and their corpses falling on one another. She saw a mass grave of her children[a].


    [a] The rare Greek verb for the treatment of the heads describes violent cutting at the head or neck; “beheaded” or “heads mutilated” are also possible. The Greek for “mass grave” can also mean “a common grave” or “the burial place of many.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Greek verb describes a violent cutting at the head or neck; “beheaded” or “heads mutilated” are also possible.
    reason: lexical_alternative
  - marker: b
    text: The Greek can also mean “a common grave” or “the burial place of many.”
    reason: lexical_alternative
