translation:
  language: en
  text: O sacred natural bond[a] of family love—parents’ love for their children, children’s tender love for their parents, the care of raising children, and the powerful feelings of mothers that cannot be overcome!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “sacred nature”; the Greek may refer either to nature itself or to the natural bond expressed in family love.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: O sacred nature
  simplified_phrase: O sacred natural bond of family love
  preserved_meaning: The verse praises the sacred natural order expressed in family affection.
  reasoning_layer_used: Lexical decision for φύσις and theological decision on the rhetorical exclamation
  rationale: This makes the family sense clear while the footnote preserves the broader alternative “nature.”
- pob_phrase: the affections of parents, and filial love toward parents
  simplified_phrase: parents’ love for their children, children’s tender love for their parents
  preserved_meaning: The verse praises both parental affection and children’s tender affection for parents.
  reasoning_layer_used: Lexical decisions for φίλτρα γονέων and γονεύσιν φιλοστόργε
  rationale: The rewrite replaces “filial” and makes both family relationships easy to follow.
- pob_phrase: nurture, and the unconquerable passions of mothers
  simplified_phrase: the care of raising children, and the powerful feelings of mothers that cannot be overcome
  preserved_meaning: Child-rearing care and mothers’ intense, unconquerable emotions are both praised.
  reasoning_layer_used: Lexical decisions for τροφεῖα and μητέρων ἀδάμαστα πάθη
  rationale: Concrete wording identifies children directly and avoids the misleading modern sense of “passions.”
interpretive_expansions:
