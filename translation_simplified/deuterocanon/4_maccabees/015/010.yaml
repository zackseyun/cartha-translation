  simplified_phrase: righteous and self-controlled. They were brave and noble in character, and they loved their brothers
  preserved_meaning: The full list of moral and familial virtues remains distinct.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The long virtue list is divided into natural clauses without weakening its ethical and religious force.
- pob_phrase: noble-minded
  simplified_phrase: noble in character
  preserved_meaning: Their greatness of soul is expressed as elevated moral character.
  reasoning_layer_used: POB lexical decision for μεγαλόψυχοι
  rationale: The clearer phrase preserves the approved sense while avoiding an uncommon expression.
- pob_phrase: even while keeping the law's requirements to the point of death
  simplified_phrase: even as they kept the law’s requirements to the point of death
  preserved_meaning: They obeyed their mother without abandoning the law, even when fidelity meant death.
  reasoning_layer_used: POB lexical decisions for τὰ νόμιμα, φυλάσσοντας, and μέχρι θανάτου
  rationale: Ordinary clause order makes the simultaneous obedience and deadly fidelity easier to follow.
