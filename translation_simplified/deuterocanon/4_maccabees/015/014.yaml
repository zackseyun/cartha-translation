translation:
  language: en
  text: As the mother watched her sons being tortured[a] and burned one by one, her piety—her faithful devotion to God—kept her from wavering.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may refer more specifically to being tortured on a rack.
