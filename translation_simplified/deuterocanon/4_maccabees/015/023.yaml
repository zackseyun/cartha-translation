translation:
  language: en
  text: But even in the midst of those very sufferings, devout reason gave courage to her heart and struggled to make her set aside her temporary love for her children.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “transient maternal affection.” Here “temporary” can also mean “for the present time.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: strengthening her inward affections
  simplified_phrase: gave courage to her heart
  preserved_meaning: Devout reason fortified her deepest feelings and made them courageous.
  reasoning_layer_used: Lexical decisions for σπλάγχνα and ἀνδρειώσας
  rationale: This familiar expression preserves the bodily image while clearly conveying inner courage.
- pob_phrase: strained to disregard
  simplified_phrase: struggled to make her set aside
  preserved_meaning: Devout reason exerted force against her maternal impulse rather than erasing it.
  reasoning_layer_used: Lexical decisions for ἐτέτεινεν and παροδεῖν
  rationale: The wording makes both the intense effort and deliberate restraint clear.
- pob_phrase: her temporary love for her children
  simplified_phrase: her temporary love for her children
  preserved_meaning: Her maternal affection is described as temporary without being condemned as evil or unreal.
  reasoning_layer_used: Lexical and theological decisions for πρόσκαιρον φιλοτεκνίαν
  rationale: Retaining “temporary” avoids narrowing the phrase to one possible temporal contrast.
translation_notes:
  risk_flags:
  - risk: “Gave courage to her heart” replaces the more literal phrase “strengthening her inward affections.”
    mitigation: It retains the bodily image and the sense of fortifying deep emotion.
  - risk: Modern readers may misunderstand “temporary love” as weak or insincere love.
    mitigation: The footnote gives the lexical alternatives without adding an unstated eternal-life contrast.
