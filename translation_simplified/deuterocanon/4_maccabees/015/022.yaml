translation:
  language: en
  text: How severely, then, and how many times was the mother tormented[a] while her sons were being tortured with wheels and burning instruments?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek uses related words for the mother’s torment and her sons’ torture, but names the instruments only in connection with the sons.
    reason: source_note
simplification_decisions:
- pob_phrase: How greatly and how many times
  simplified_phrase: How severely, then, and how many times
  preserved_meaning: The question stresses both the intensity and repeated nature of her suffering.
  reasoning_layer_used: Lexical decisions for πηλίκοις and πόσαις
  rationale: “How severely” states the degree of suffering more directly in common English.
- pob_phrase: was the mother tortured with torments
  simplified_phrase: was the mother tormented
  preserved_meaning: The mother endured intense torment without specifying that the same instruments were used on her.
  reasoning_layer_used: Lexical decision for ἐβασανίζετο and theological decision on the mother’s suffering
  rationale: “Was tormented” preserves the repeated torture language while avoiding awkward cognate wording.
- pob_phrase: cauteries
  simplified_phrase: burning instruments
  preserved_meaning: The sons were tortured with instruments used to burn the body.
  reasoning_layer_used: Lexical decision for καυτηρίοις
  rationale: “Burning instruments” is clear without narrowing the term to branding irons.
translation_notes:
  risk_flags:
  - risk: “Tormented” does not reproduce the Greek cognate repetition exactly.
    mitigation: The footnote identifies the related Greek words and preserves their rhetorical connection.
  - risk: Readers might assume the named instruments were also used on the mother.
    mitigation: The clause structure and footnote attach the instruments only to the sons.
