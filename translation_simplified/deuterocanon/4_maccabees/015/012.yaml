translation:
  language: en
  text: But the mother urged her sons to face death for the sake of godliness—each son separately, and all of them together.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Godliness here means faithful reverence toward God; the mother spoke both to each son separately and to the whole group.
    reason: lexical_alternative
