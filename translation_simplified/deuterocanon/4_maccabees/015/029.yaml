  text: O mother of the nation[a], you avenged the law and defended godliness. You won the prize in the struggle involving your deep love as a mother.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “mother of the people”; the Greek can refer to a nation, people, or ethnic group.
