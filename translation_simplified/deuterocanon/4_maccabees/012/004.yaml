translation:
  language: en
  text: '“You have seen what happened to your brothers because of their madness: they refused to obey, so they were tortured[a] and died. If you also refuse to obey,[b] you too will suffer terrible torture and die before your time.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word may refer more specifically to being stretched on a rack.
    reason: cultural_note
  - marker: b
    text: Or “refuse to be persuaded”; in this setting, it means refusing to comply.
    reason: lexical_alternative
