  preserved_meaning: The brothers’ deaths are presented as the consequence of conduct the hostile speaker calls madness.
  reasoning_layer_used: POB lexical and theological decisions on τὸ τέλος and ἀπονοίας
  rationale: The rewrite explains “outcome” while retaining the speaker’s condemnatory word “madness.”
- pob_phrase: because of disobedience
  simplified_phrase: they refused to obey
  preserved_meaning: The brothers would not comply with the tyrant’s demand.
  reasoning_layer_used: POB lexical decision on ἀπείθειαν
  rationale: The abstract noun becomes a direct action without changing the cause of their punishment.
- pob_phrase: after being miserably tortured
  simplified_phrase: suffer terrible torture and die
  preserved_meaning: Severe torture precedes the threatened premature death.
  reasoning_layer_used: POB lexical decisions on ταλαί and βασανισθείς
  rationale: Natural English preserves both the intensity and sequence of the threat.
