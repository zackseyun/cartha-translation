translation:
  language: en
  text: You are a man, yet you are utterly beastly. Did you feel no shame about cutting out the tongues of people who share the same sufferings[a] and are made from the same elements[b], and then torturing this man after mutilating him in that way?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “those who share the same experiences” or “those subject to the same passions.”
    reason: lexical_alternative
  - marker: b
    text: “Elements” refers to the material components shared by all human beings.
    reason: cultural_note
simplification_decisions:
- pob_phrase: though you are a man, most beastly one
  simplified_phrase: You are a man, yet you are utterly beastly.
  preserved_meaning: The speaker condemns a human ruler for behaving with extreme, beastlike cruelty.
  reasoning_layer_used: Theological decision on the human-versus-beast contrast
  rationale: A short contrast preserves the beast image and superlative force without adding a universal comparison.
- pob_phrase: those who share the same sufferings and have come from the same elements
  simplified_phrase: people who share the same sufferings and are made from the same elements
  preserved_meaning: The victims share suffering and the same material human constitution.
  reasoning_layer_used: Lexical decisions for ὁμοιοπαθεῖς and στοιχεῖα
  rationale: The wording keeps the documented ambiguity while making the shared origin easier to understand.
- pob_phrase: and after mutilating him in this way, to torture him
  simplified_phrase: and then torturing this man after mutilating him in that way
  preserved_meaning: The ruler tortured the individual after cutting out his tongue.
  reasoning_layer_used: Lexical decisions for καταικίζω and βασανίζω
  rationale: Ordinary English clause order clarifies the sequence without weakening the violence.
