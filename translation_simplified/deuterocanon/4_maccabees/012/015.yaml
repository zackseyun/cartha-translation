translation:
  language: en
  text: But you will wail in misery because you put the champions of virtue to death without cause.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek honors them as champions or contestants in a struggle for virtue.
    reason: lexical_alternative
  - marker: b
    text: “Without cause” means with no valid reason or justification.
    reason: simplification_note
simplification_decisions:
- pob_phrase: will wail miserably
  simplified_phrase: will wail in misery
  preserved_meaning: The tyrant will loudly lament in deep misery.
  reasoning_layer_used: Lexical decisions for κακῶς and οἰμώξεις
  rationale: This natural phrase keeps the verb’s specific sense of loud lament.
- pob_phrase: for putting to death, without cause
  simplified_phrase: because you put ... to death without cause
  preserved_meaning: His misery results from killing the victims with no valid cause.
  reasoning_layer_used: Lexical decisions for ἀναίτιως and ἀποκτεῖναι
  rationale: The causal clause is clearer while preserving the openness of “without cause.”
- pob_phrase: the champions of virtue
  simplified_phrase: the champions of virtue
  preserved_meaning: The victims are honored as contenders in a moral struggle.
  reasoning_layer_used: Lexical and theological decisions for ἀγωνιστάς and ἀρετή
  rationale: Retaining the phrase preserves both the contest image and the moral framework.
translation_notes:
  risk_flags:
  - risk: “Champions” may not immediately suggest contestants in a struggle.
    mitigation: Footnote a explains the Greek contest image.
  - risk: “Without cause” may sound like a lack of motive rather than justification.
    mitigation: Footnote b clarifies that there was no valid reason for the killing.
