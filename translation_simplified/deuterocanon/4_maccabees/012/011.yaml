translation:
  language: en
  text: “You unholy man!” she said. “Of all wicked men, you are the most ungodly tyrant! God gave you good things and made you king. Yet you felt no shame about killing his servants and torturing those who devote themselves to godliness?”
  philosophy: optimal-equivalence
