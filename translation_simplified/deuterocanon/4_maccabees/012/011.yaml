- pob_phrase: most ungodly tyrant of all wicked men
  simplified_phrase: Of all wicked men, you are the most ungodly tyrant!
  preserved_meaning: The accusation still piles up terms of strong moral and religious condemnation.
  reasoning_layer_used: POB lexical decision for πάντων τῶν πονηρῶν ἀσεβέστατε τύραννε
  rationale: The reordered sentence makes the superlative insult easier to grasp without weakening it.
- pob_phrase: after receiving good things and kingship from God
  simplified_phrase: God gave you good things and made you king
  preserved_meaning: His benefits and royal authority came from God before he abused them.
  reasoning_layer_used: POB lexical decisions for παρὰ τοῦ θεοῦ λαβὼν, τὰ ἀγαθὰ, and τὴν βασιλείαν
  rationale: Two direct verbs replace the dense participial phrase and clarify that kingship means royal office.
- pob_phrase: the practitioners of godliness
  simplified_phrase: those who devote themselves to godliness
  preserved_meaning: The victims are people committed to the active practice of devotion to God.
  reasoning_layer_used: POB lexical and theological decisions for τοὺς τῆς εὐσεβείας ἀσκητάς
  rationale: The wording explains an unfamiliar expression while retaining the key term “godliness.”
