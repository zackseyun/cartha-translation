translation:
  language: en
  text: While he continued making these appeals, he sent for the boy’s mother. He pitied her because so many of her sons had been taken from her, and he hoped to persuade her to make her only son still alive give in so that his life would be spared.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also mean “for his salvation,” but here it most naturally refers to being rescued from death.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: while urging these things
  simplified_phrase: while he continued making these appeals
  preserved_meaning: He was still earnestly pressing his case.
  reasoning_layer_used: Lexical decision for παρακαλῶν
  rationale: “Making these appeals” states the verbal action naturally without weakening its earnest force.
- pob_phrase: after she had been deprived of so many sons
  simplified_phrase: because so many of her sons had been taken from her
  preserved_meaning: The mother had suffered the forced loss of many sons.
  reasoning_layer_used: Lexical decision for στερηθεῖσαν
  rationale: The rewrite keeps the passive force while replacing a dense construction with common English.
- pob_phrase: make the one remaining compliant
  simplified_phrase: make her only son still alive give in
  preserved_meaning: The king wanted her to make the surviving son yield under pressure.
  reasoning_layer_used: Lexical decisions for εὐπειθῆ ποιῆσαι and τὸν περιλειπόμενον
  rationale: “Give in” clearly conveys coerced compliance, while “only son still alive” identifies the remaining son.
