simplification_decisions:
- pob_phrase: What are you waiting for, O tyrant?
  simplified_phrase: Why do you hesitate, tyrant?
  preserved_meaning: The speaker directly challenges the oppressive ruler for delaying or hesitating.
  reasoning_layer_used: POB lexical decision for Τί μέλλεις and ὦ τύραννε
  rationale: This follows the controlling lexical choice while removing the archaic direct-address marker “O.”
- pob_phrase: For we are ready to die rather than transgress
  simplified_phrase: We are ready to die rather than break
  preserved_meaning: They prefer death to violating the commands.
  reasoning_layer_used: POB lexical decisions for ἑτοῖμοι, ἀποθνήσκειν, ἢ, and παραβαίνειν
  rationale: “Break” states the same ethical violation in common English, and dropping “For” makes the reply more direct.
- pob_phrase: the commandments of our fathers
