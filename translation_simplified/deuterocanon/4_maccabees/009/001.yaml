  preserved_meaning: The commandments are inherited through their Jewish fathers.
  reasoning_layer_used: POB lexical and theological decisions for τὰς πατρίους ἡμῶν ἐντολάς
  rationale: “Handed down” makes the ancestral relationship clear while retaining the source’s masculine language.
