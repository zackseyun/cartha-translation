translation:
  language: en
  text: The fire had already burned the framework of his bones on every side.[a] Even so, this noble and courageous young man, who was like Abraham, did not groan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “melted the framework of his bones on every side.” The Greek vividly describes his whole bony frame being affected by the heat.
    reason: lexical_alternative
