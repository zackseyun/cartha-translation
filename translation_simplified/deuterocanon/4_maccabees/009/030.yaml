translation:
  language: en
  text: Do you not realize, you most savage of all tyrants, that you are now being tortured more than I am? You can see that our endurance for the sake of godliness is defeating the proud reasoning[a] behind your tyranny.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the arrogant mindset.” “Reasoning” preserves the book’s emphasis on reason and thought.
    reason: lexical_alternative
