- pob_phrase: if we did not make use of obedience to the law
  simplified_phrase: if we did not let obedience to the law
  preserved_meaning: Obedience to the law must actively direct their conduct.
  reasoning_layer_used: POB lexical decisions for χρησαίμεθα and τῇ τοῦ νόμου εὐπειθείᾳ
  rationale: This replaces an abstract idiom with a direct conditional statement.
- pob_phrase: as our counselor and judgment
  simplified_phrase: counsel and guide us
  preserved_meaning: Obedience serves as both moral counsel and practical discernment.
  reasoning_layer_used: POB lexical decisions for συμβούλῳ and γνώσει
  rationale: The two verbs clearly express the paired guiding roles without inventing a separate faculty of judgment.
- pob_phrase: For we would rightly bring shame on our ancestors if
  simplified_phrase: For if ... we would rightly bring shame on our ancestors
  preserved_meaning: Failure to obey would deservedly dishonor their ancestors.
  reasoning_layer_used: POB lexical and theological decisions for αἰσχυνόμεθα and εἰκότως
  rationale: Normal English conditional order retains the causative shame reading and its moral force.
