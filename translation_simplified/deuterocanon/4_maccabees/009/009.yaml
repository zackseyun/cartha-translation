simplification_decisions:
- pob_phrase: because of our sacred murder
  simplified_phrase: because of your sacrilegious murder of us
  preserved_meaning: The offense is a murder with a holy-profane dimension, committed against the speakers.
  reasoning_layer_used: POB lexical decision for μιεροφονίαν and grounding review
  rationale: This clarifies responsibility without adding a completed-action tense.
- pob_phrase: you will, by divine justice, endure
  simplified_phrase: divine justice will make you endure
  preserved_meaning: The torment comes as divine judicial retribution.
  reasoning_layer_used: POB lexical decision for θείας δίκης
  rationale: The active clause is natural English and retains divine justice as the cause.
- pob_phrase: a sufficient eternal torment by fire
  simplified_phrase: the full measure of eternal torment by fire
  preserved_meaning: The offender will bear the severe, unending fire-based punishment in full.
  reasoning_layer_used: POB lexical and theological decisions for αὐτάρκη καρτερήσεις, αἰώνιον βάσανον, and διὰ πυρός
  rationale: “Full measure” clearly conveys the intensifying force expressed awkwardly by “sufficient.”
translation_notes:
  risk_flags:
  - risk: “Sacrilegious murder” may foreground the crime’s profane character more than the victims’ holiness.
    mitigation: The footnote preserves the alternative emphasis on the victims as people devoted to God.
