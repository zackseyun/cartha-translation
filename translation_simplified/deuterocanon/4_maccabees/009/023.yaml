translation:
  language: en
  text: “Follow my example, brothers,” he said as he lay on the torture rack. “I have not abandoned the struggle, so do not desert the ranks. Do not renounce our brotherhood of courage on my account. Wage the holy and noble campaign for godliness—that is, faithful devotion to God.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Imitate me, brothers, he said, on the rack
  simplified_phrase: “Follow my example, brothers,” he said as he lay on the torture rack
  preserved_meaning: The suffering brother calls his literal brothers to emulate him while he is being tortured on the rack.
  reasoning_layer_used: Lexical decisions for Μιμήσασθέ, στρεβλὰς, and ἀδελφοί
  rationale: Natural speech order improves clarity while preserving the concrete rack image and male family address.
- pob_phrase: do not desert by abandoning the struggle when I have not left it
  simplified_phrase: I have not abandoned the struggle, so do not desert the ranks
  preserved_meaning: His steadfastness is their example, and they must not abandon the struggle like military deserters.
  reasoning_layer_used: Lexical decisions for ἀγών and λειποτακτήσητε
  rationale: Two direct clauses clarify the connection while retaining the struggle and military images.
- pob_phrase: Wage the holy and noble campaign for godliness
  simplified_phrase: Wage the holy and noble campaign for godliness—that is, faithful devotion to God
  preserved_meaning: They must continue a sacred and honorable struggle of steadfast fidelity to God.
  reasoning_layer_used: Lexical and theological decisions for στρατεία, ἱεράν, εὐγενῆ, and εὐσέβεια
  rationale: The campaign image and key term remain, with a concise contextual explanation.
