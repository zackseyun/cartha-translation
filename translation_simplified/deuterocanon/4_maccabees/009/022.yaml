simplification_decisions:
- pob_phrase: as though being transformed in the fire
  simplified_phrase: as though he were being transformed in the fire
  preserved_meaning: The fire remains the setting of a comparison, not a claim of literal transformation.
  reasoning_layer_used: POB lexical decisions for ὥσπερ and ἐν πυρί
  rationale: A finite clause is easier to follow than the participial construction.
- pob_phrase: into incorruptibility
  simplified_phrase: into an imperishable state
  preserved_meaning: He is pictured as moving toward a state not subject to decay.
  reasoning_layer_used: POB lexical and theological decisions for ἀφθαρσία
  rationale: Common wording preserves the broad idea without limiting it to immortality.
- pob_phrase: he nobly endured these
  simplified_phrase: he nobly endured these . . .
  preserved_meaning: His endurance is characterized as noble while the object remains incomplete.
  reasoning_layer_used: POB lexical decisions for ὑπέμεινεν and εὐγενῶς, plus the textual note
  rationale: Retaining “nobly” avoids adding the more specific idea of courage.
