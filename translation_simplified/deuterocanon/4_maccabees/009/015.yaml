translation:
  language: en
  text: You utterly filthy tyrant! You are an enemy of heaven’s justice[a], and you are cruel at heart. You are torturing me like this, not because I murdered anyone or dishonored God, but because I am defending God’s law.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “heaven’s judgment.” The Greek can mean justice broadly or judicial punishment.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Most defiled tyrant
  simplified_phrase: You utterly filthy tyrant!
  preserved_meaning: The insult condemns the tyrant as morally and religiously polluted to the highest degree.
  reasoning_layer_used: The lexical decision for μιερώτατε preserves both pollution and superlative force.
  rationale: “Utterly filthy” conveys the severe insult in idiomatic modern English.
- pob_phrase: savage-minded man
  simplified_phrase: you are cruel at heart
  preserved_meaning: The tyrant has a harsh and cruel inner character.
  reasoning_layer_used: The lexical decision for ὠμόφρον emphasizes a cruel disposition.
  rationale: “Cruel at heart” makes the judgment about his character immediately clear.
- pob_phrase: acted impiously ... the divine law
  simplified_phrase: dishonored God ... God’s law
  preserved_meaning: The speaker denies religious wrongdoing and says he suffers for defending the law that comes from God.
  reasoning_layer_used: The lexical decisions for ἀσεβήσαντα and θείου νόμου preserve their religious force.
  rationale: The wording explains both religious ideas in familiar English.
translation_notes:
  risk_flags:
  - risk: “Filthy” can suggest physical dirt rather than moral-religious pollution.
    mitigation: “Utterly” and the surrounding denunciation signal the intended severe moral insult.
  - risk: “Dishonored God” may be narrower than every form of impious conduct.
    mitigation: It retains the essential sense of wrongdoing directed against God.
