  preserved_meaning: Openly accepting this conclusion is the right response.
  reasoning_layer_used: Lexical decision for δίκαιόν and ὁμολογεῖν
  rationale: The direct wording is easier while retaining both moral approval and acknowledgment.
- pob_phrase: reason is sovereign
  simplified_phrase: reason has ruling power
  preserved_meaning: Reason possesses governing mastery.
  reasoning_layer_used: Lexical and theological decisions for κράτος and λογισμός
  rationale: This replaces the abstract title “sovereign” without weakening reason’s ruling strength.
- pob_phrase: prevails over outward pains
  simplified_phrase: overcomes even pains that come from outside us
  preserved_meaning: Reason gains mastery over externally arising pain.
  reasoning_layer_used: Lexical decisions for ὅπου γε καὶ, ἔξωθεν ἀλγηδόνων, and ἐπικρατεῖ
  rationale: The recast phrase makes the source of the pains clear and preserves the emphatic “even.”
