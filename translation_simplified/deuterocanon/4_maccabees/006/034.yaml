translation:
  language: en
  text: We are right to recognize that reason has ruling power, because it overcomes even pains that come from outside us.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This likely includes bodily suffering, but the Greek more broadly says pains that come from outside.
    reason: lexical_alternative
