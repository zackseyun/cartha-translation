  preserved_meaning: The opponent is relationally alienated from God, and this remains linked to his warfare.
  reasoning_layer_used: Lexical and theological decisions for ἀλλότριος ὢν θεοῦ
  rationale: “Estranged” clearly expresses relational alienation without suggesting ethnic foreignness.
- pob_phrase: those who are reverent toward God
  simplified_phrase: people who show reverence to God
  preserved_meaning: The people actively direct their reverence toward God.
  reasoning_layer_used: Lexical decisions for τοὺς εὐσεβοῦντας εἰς τὸν θεόν
  rationale: This wording keeps God as the object of their active reverence without limiting it to worship rituals.
