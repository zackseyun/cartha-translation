translation:
  language: en
  text: But I chose to step forward so that, by killing me too, you may make yourself liable to punishment from heavenly justice for even more wrongs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the justice of heaven” or “heavenly judgment.” The Greek points to justice associated with heaven without explicitly naming God.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I myself came forward of my own accord
  simplified_phrase: I chose to step forward
  preserved_meaning: The speaker voluntarily presented himself to be killed.
  reasoning_layer_used: Lexical decisions for παρῆλθον and ἀπʼ ἐμαυτοῦ
  rationale: This wording expresses voluntary self-presentation in direct modern English.
- pob_phrase: you may incur punishment
  simplified_phrase: you may make yourself liable to punishment
  preserved_meaning: Killing the speaker brings judicial liability for punishment without asserting that punishment has already occurred.
  reasoning_layer_used: Lexical decision for ὀφλήσῃς
  rationale: “Make yourself liable” clearly conveys the verb’s legal sense while preserving “may.”
- pob_phrase: for still more acts of wrongdoing
  simplified_phrase: for even more wrongs
  preserved_meaning: This killing adds another offense to the ruler’s accumulating wrongdoing.
  reasoning_layer_used: Lexical decision for περὶ πλειόνων ἀδικημάτων
  rationale: “Even more wrongs” is concise and keeps the accumulation directly tied to the punishment.
translation_notes:
  risk_flags:
  - risk: “Heavenly justice” may sound abstract to modern readers.
    mitigation: The wording preserves POB’s theological restraint, and the footnote supplies bounded alternatives.
