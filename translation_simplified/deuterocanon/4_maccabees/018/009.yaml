translation:
  language: en
  text: 'After these sons had grown up, their father died. He was blessed: he knew what it was to have good children, but he never suffered through the season of being left without them.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “the season of childlessness”; in this story, it means the time after his sons’ deaths.
    reason: source_note
