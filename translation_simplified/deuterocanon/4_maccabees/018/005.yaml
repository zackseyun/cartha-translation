translation:
  language: en
  text: The tyrant Antiochus has been punished here on earth, and he is also being punished eternally.[a] He was completely unable to force the people of Jerusalem to adopt foreign ways or abandon the customs of their ancestral nation,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek uses “eternal” without stating exactly what is eternal; it may also be translated, “is punished with eternal things” or “with everlasting punishments.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: has been punished also on earth
  simplified_phrase: has been punished here on earth
  preserved_meaning: Antiochus has already received earthly punishment.
  reasoning_layer_used: lexical decision for τετιμώρηται
  rationale: “Here on earth” expresses the contrast in natural English.
- pob_phrase: was utterly unable to compel
  simplified_phrase: was completely unable to force
  preserved_meaning: Antiochus had no power at all to make them comply.
  reasoning_layer_used: lexical decisions for οὐδὲν οὐδαμῶς ἴσχυσεν and ἀναγκάσαι
  rationale: Common words retain both the emphatic negation and the coercion.
- pob_phrase: the customs of their fathers' nation
  simplified_phrase: the customs of their ancestral nation
  preserved_meaning: The customs belong to the people and way of life inherited from their fathers.
  reasoning_layer_used: lexical decisions for τῶν πατρίων ἐθνῶν and ἐκδιαιτηθῆναι
  rationale: “Ancestral nation” keeps both inherited custom and national identity without the awkward possessive.
