translation:
  language: en
  text: Our ancestors had deep peace because they maintained good order under law, and they prospered. As a result, even Seleucus Nicanor, the king of Asia, set aside money for their sacred service and approved their civic order.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Good order under law may include faithfulness to Jewish law, but the Greek expression is broader than that alone.
    reason: lexical_alternative
  - marker: b
    text: Or “approved their constitution.”
    reason: lexical_alternative
