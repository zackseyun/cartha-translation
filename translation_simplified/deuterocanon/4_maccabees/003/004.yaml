translation:
  language: en
  text: Reason cannot cut out even one of your evil tendencies. But reason can come to your aid and help you not bend to that tendency.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: cannot cut off any one of your evil tendencies
  simplified_phrase: cannot cut out even one of your evil tendencies
  preserved_meaning: Reason cannot eradicate a single corrupt inclination.
  reasoning_layer_used: Lexical decision for τις ὑμῶν and ἐκκόψαι
  rationale: “Even one” preserves the distributive force, while “cut out” keeps the cutting image.
- pob_phrase: it is able to join in helping you
  simplified_phrase: reason can come to your aid and help you
  preserved_meaning: Reason provides real assistance without removing the tendency itself.
  reasoning_layer_used: Lexical decision for λογισμός and συμμαχῆσαι
  rationale: The new wording makes the subject clear and preserves the sense of an ally coming to help.
- pob_phrase: not to bend to that evil tendency
  simplified_phrase: not bend to that tendency
  preserved_meaning: A person can resist yielding to the same evil inclination already mentioned.
  reasoning_layer_used: Lexical and theological decisions for μὴ καμφθῆναι and τῇ κακοηθείᾳ
  rationale: The wording keeps the bending image and the contrast between resisting evil and eradicating it.
translation_notes:
  risk_flags:
  - risk: “Cut out” may suggest surgery more strongly than the Greek requires.
    mitigation: It retains the source’s vivid removal metaphor without claiming that reason succeeds in removing vice.
  - risk: “Come to your aid” may sound less explicitly martial than the allied-help verb.
    mitigation: It preserves supportive assistance while avoiding an unnecessarily militarized English expression.
