translation:
  language: en
  text: For while David was attacking the foreigners[a] all day, he killed many of them along with the soldiers of his own people.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Philistines.” The Greek says “the foreigners,” a term often used for the Philistines without giving their proper ethnic name.
    reason: lexical_alternative
  - marker: b
    text: The Greek literally says “the soldiers of the nation.”
    reason: lexical_alternative
