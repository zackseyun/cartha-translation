translation:
  language: en
  text: These words distressed Onias the high priest. He was also concerned that King Seleucus might someday think Apollonius had been killed through a human plot rather than through divine justice. So Onias said a prayer concerning Apollonius.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek leaves open whether Onias prayed for Apollonius or about the matter involving him.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: although otherwise being careful lest King Seleucus might ever think
  simplified_phrase: He was also concerned that King Seleucus might someday think
  preserved_meaning: Onias feared that the king could later misunderstand the cause of Apollonius's death.
  reasoning_layer_used: POB lexical decision for εὐλαβηθεὶς and μὴ ποτε νομίσειεν
  rationale: The dense caution clause becomes a direct statement of concern without losing its future possibility.
- pob_phrase: had been done away with by human plotting and not by divine justice
  simplified_phrase: had been killed through a human plot rather than through divine justice
  preserved_meaning: Apollonius's death could be attributed either to a hostile human scheme or to divine justice.
  reasoning_layer_used: POB lexical decisions for ἐπιβουλή, θείας δίκης, and ἀναιρέω
  rationale: The documented alternative “killed” makes the euphemism immediately understandable while retaining the theological contrast.
- pob_phrase: offered some prayer concerning him
  simplified_phrase: said a prayer concerning Apollonius
  preserved_meaning: Onias prayed in relation to Apollonius without specifying the prayer's exact purpose.
  reasoning_layer_used: POB theological decision for περὶ αὐτοῦ
  rationale: Naming Apollonius clarifies the pronoun while the wording and footnote preserve the source ambiguity.
