  text: For at that time he was fighting a war against Ptolemy in Egypt. He also heard that a report[a] of his death had spread and that the people of Jerusalem were rejoicing greatly. So he quickly marched against them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
