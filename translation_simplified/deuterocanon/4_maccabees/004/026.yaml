translation:
  language: en
  text: So, because the people kept treating his decrees with contempt, he personally used torture to force every single member of the nation to renounce Judaism after tasting defiling foods.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Defiling foods” means foods regarded as ritually polluted or unclean.
    reason: lexical_alternative
  - marker: b
    text: The word translated “renounce” can also mean to deny or reject something under oath.
    reason: lexical_alternative
