translation:
  language: en
  text: He removed Onias from his position as high priest and appointed Onias’s brother Jason in his place. Jason had promised to give the king 3,660 talents[a] each year if the king gave Jason the office.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A talent was an ancient unit used to reckon large sums of money; no modern equivalent is given here.
    reason: cultural_note
simplification_decisions:
- pob_phrase: deposed Onias from the high priesthood
  simplified_phrase: removed Onias from his position as high priest
  preserved_meaning: Onias was formally stripped of the high priestly office.
  reasoning_layer_used: Lexical decision for καταλύσας and its genitive construction.
  rationale: The rewrite explains the formal removal in familiar language.
- pob_phrase: appointed Jason, his brother, as high priest
  simplified_phrase: appointed Onias’s brother Jason in his place
  preserved_meaning: Jason, Onias’s brother, replaced him as high priest.
  reasoning_layer_used: Lexical decision for κατέστησεν ἀρχιερέα and immediate syntax.
  rationale: Repeating Onias’s name makes the relationship and succession clear.
- pob_phrase: after he promised to give, if he would grant him the office, three thousand six hundred sixty talents per year
  simplified_phrase: Jason had promised to give the king 3,660 talents each year if the king gave Jason the office
  preserved_meaning: Jason promised the stated annual sum on condition that he receive the office, without calling it a bribe.
  reasoning_layer_used: Lexical and theological decisions for ὑποσχόμενον δώσειν and εἰ ἐπιτρέψειεν αὐτῷ τὴν ἀρχήν.
  rationale: The reordered clauses identify each participant while retaining the source’s neutral verb “give.”
interpretive_expansions:
- pob_phrase: promised to give ... if he would grant him the office
  rendering: promised to give the king ... if the king gave Jason the office
  claim: The unnamed official who receives the promise and grants the office is the king.
  evidence:
  - The immediate context identifies the acting official as the king.
  - The verse presents the same official as able to grant Jason the office.
  confidence: high
