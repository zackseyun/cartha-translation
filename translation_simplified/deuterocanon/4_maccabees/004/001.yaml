translation:
  language: en
  text: A man named Simon opposed Onias. Onias was a noble and good man who had once held the office of high priest for life. Simon slandered him in every way, but he could not harm him in matters concerning the nation.[a] He then left as an exile,[b] intending to betray his homeland.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek phrase may also mean “with respect to the nation” or, less likely here, “on behalf of the nation.”
    reason: lexical_alternative
  - marker: b
    text: The Greek may describe Simon either as an exile or as a fugitive fleeing the country.
    reason: lexical_alternative
