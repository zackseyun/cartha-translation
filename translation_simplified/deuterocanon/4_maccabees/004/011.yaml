translation:
  language: en
  text: Apollonius collapsed, half-dead, onto the lifeless courtyard of the sanctuary. Stretching out his hands toward heaven, he tearfully begged the Hebrews to pray for him, so that they might appease the heavenly host.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “heavenly host” could mean the heavenly army or, more indirectly, God; the Greek does not identify the referent precisely.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: having fallen half-dead upon
  simplified_phrase: collapsed, half-dead, onto
  preserved_meaning: Apollonius fell and was nearly dead before making his plea.
  reasoning_layer_used: Greek lexical decisions for καταπεσών and ἡμιθανής
  rationale: A finite verb clarifies the sequence while retaining the vivid phrase “half-dead.”
- pob_phrase: the lifeless court of the sanctuary
  simplified_phrase: the lifeless courtyard of the sanctuary
  preserved_meaning: He fell within the sanctuary precinct, whose inanimate setting contrasts with his dying condition.
  reasoning_layer_used: Lexical rationale for ἄψυχον and τοῦ ἱεροῦ περίβολον
  rationale: “Courtyard” is immediately understandable, while “lifeless” preserves the source image.
- pob_phrase: stretched out his hands to heaven and with tears begged
  simplified_phrase: Stretching out his hands toward heaven, he tearfully begged
  preserved_meaning: His upward gesture and tears express desperate supplication.
  reasoning_layer_used: Lexical decisions for τὰς χεῖρας ἐκτείνων and παρεκάλει
  rationale: Idiomatic clause order clearly preserves the upward gesture and emotional force.
translation_notes:
  risk_flags:
  - risk: “Lifeless courtyard” is intentionally unusual in English.
    mitigation: It remains because the source contrasts the inanimate precinct with the half-dead man.
  - risk: Readers may assume that “heavenly host” means only angels.
    mitigation: The footnote preserves the POB’s uncertainty about the referent.
