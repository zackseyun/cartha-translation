translation:
  language: en
  text: with the cursed Simon and a formidable military force.[a] He came forward and said that he had come under the king’s orders to take the private funds of the treasury.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally describes the force as “very heavy,” suggesting an oppressive or intimidating military presence; it may also imply a very large army.
    reason: lexical_alternative
  - marker: b
    text: These were likely private or deposited funds within the treasury, not necessarily all the money in it.
    reason: cultural_note
