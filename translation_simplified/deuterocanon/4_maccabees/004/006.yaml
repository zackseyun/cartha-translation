  preserved_meaning: Simon remains strongly condemned as under a curse or worthy of one.
  reasoning_layer_used: POB lexical decision for καταράτου
  rationale: “Cursed” is an approved alternative and is more familiar to common readers.
- pob_phrase: a very heavy force
  simplified_phrase: a formidable military force
  preserved_meaning: The force remains oppressive, intimidating, and militarily powerful.
  reasoning_layer_used: POB lexical decision and footnote for βαρυτάτου στρατοῦ
  rationale: “Formidable” conveys the metaphorical force of “heavy,” while the footnote preserves the source image.
- pob_phrase: he said that he had come by the king’s commands, in order to take
  simplified_phrase: he said that he had come under the king’s orders to take
  preserved_meaning: He claimed royal authorization for his stated purpose.
  reasoning_layer_used: POB lexical decisions for ταῖς τοῦ βασιλέως ἐντολαῖς and ὅπως
  rationale: “Under the king’s orders” and the direct purpose clause are clearer ordinary English.
