- pob_phrase: his decrees were being despised by the people
  simplified_phrase: the people kept treating his decrees with contempt
  preserved_meaning: The people continually showed strong contempt for the ruler’s authoritative commands.
  reasoning_layer_used: Greek aspect and POB lexical decision for κατεφρονεῖτο
  rationale: The active wording is easier to follow while preserving ongoing contempt.
- pob_phrase: forcing each one of the nation, by tortures
  simplified_phrase: used torture to force every member of the Jewish nation
  preserved_meaning: Physical torment was used against individual members of the Jewish people.
  reasoning_layer_used: POB lexical decisions for διὰ βασάνων and ἕνα ἕκαστον τοῦ ἔθνους
  rationale: The recast removes awkward clause order without weakening the torture or individual targeting.
- pob_phrase: after tasting defiling foods, to renounce Judaism
  simplified_phrase: to renounce Judaism after they had tasted defiling foods
  preserved_meaning: The tasting preceded the forced renunciation, while only renunciation remains the direct object of forcing.
  reasoning_layer_used: POB lexical decisions for ἀπογευομένους and ἐξόμνυσθαι
  rationale: The ordinary clause preserves the sequence without claiming that the verb “force” directly governs tasting.
