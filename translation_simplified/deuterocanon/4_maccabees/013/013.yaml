translation:
  language: en
  text: Isaac endured because of his devotion to God. The brothers looked at one another. Cheerful and full of courage, they said together, “Let us dedicate ourselves wholeheartedly to God, who gave us our lives.[a] Let us use our bodies to stand guard over the law.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word may mean “lives” or “souls”; here it most likely refers to the lives God gave them.
    reason: lexical_alternative
