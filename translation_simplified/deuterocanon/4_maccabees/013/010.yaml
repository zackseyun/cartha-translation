simplification_decisions:
- pob_phrase: be cowardly
  simplified_phrase: act like cowards
  preserved_meaning: The exhortation still condemns a failure of courage.
  reasoning_layer_used: The lexical decision for δειλανδρήσωμεν preserves the verb’s strong moral force.
  rationale: The active wording is clearer and more natural.
- pob_phrase: demonstrating our piety
  simplified_phrase: showing our devotion to God
  preserved_meaning: Their reverence for God must be made visible through faithful conduct.
  reasoning_layer_used: The lexical and theological decisions define εὐσέβεια as God-directed devotion expressed in conduct.
  rationale: This makes two formal terms understandable without reducing piety to outward display.
- pob_phrase: in demonstrating
  simplified_phrase: in showing
  preserved_meaning: Cowardice is rejected specifically in the sphere of demonstrating devotion.
  reasoning_layer_used: The lexical decision for πρὸς marks relation or respect rather than time.
  rationale: Using “in” avoids the potentially temporal sense of “as.”
interpretive_expansions:
