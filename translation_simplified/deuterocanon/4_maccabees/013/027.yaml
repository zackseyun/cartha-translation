translation:
  language: en
  text: In the same way, nature, custom, and virtuous character all drew them together in brotherly affection. Even so, because of their piety, those who remained endured as they watched their brothers being tortured to death—a sight that stirred compassion.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: although nature and custom and the dispositions of virtue were drawing together for them the affections of brotherhood
  simplified_phrase: nature, custom, and virtuous character all drew them together in brotherly affection
  preserved_meaning: Natural ties, custom, and virtue strengthened the brothers’ affection for one another.
  reasoning_layer_used: POB lexical decisions for συναξόντων, ἠθῶν, and φίλτρα
  rationale: The clause is recast in ordinary English while retaining all three causes and the emotional force of brotherhood.
- pob_phrase: those who were left behind endured
  simplified_phrase: those who remained endured
  preserved_meaning: The brothers not yet executed continued to bear the emotional strain.
  reasoning_layer_used: POB lexical decision for οἱ ὑπολελειμμένοι and ἀνέσχοντο
  rationale: “Those who remained” is concise and avoids implying that they ultimately survived.
- pob_phrase: their brothers, being tortured to death, objects of pity
  simplified_phrase: their brothers being tortured to death—a sight that stirred compassion
  preserved_meaning: The brothers’ fatal torture evoked pity in those watching.
  reasoning_layer_used: POB lexical decisions for κατοικτιζομένους and μέχρι θανάτου βασανιζομένους
  rationale: The compressed participles become a natural English clause without weakening the torture or the pity it aroused.
interpretive_expansions:
- pob_phrase: objects of pity
  rendering: a sight that stirred compassion
  claim: The tortured brothers evoked compassion in those who watched them.
  evidence:
  - The POB rationale says κατοικτιζομένους preserves the passive sense that the brothers elicited compassion.
  - The immediate clause identifies the remaining brothers as watching the torture.
  confidence: high
  alternatives_preserved:
  - objects of pity
  - to be pitied
translation_notes:
  risk_flags:
