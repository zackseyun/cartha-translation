    mitigation: The wording follows the POB rationale for κατοικτιζομένους without identifying any response beyond pity.
  - risk: “Virtuous character” simplifies the more analytical phrase “dispositions of virtue.”
    mitigation: It retains virtue as the source of the brothers’ settled moral character.
