  preserved_meaning: Reason shaped by reverence for God possesses ruling authority over disordered drives.
  reasoning_layer_used: POB lexical and theological decisions for αὐτόδεσπότος, τῶν παθῶν, and ὁ εὐσεβὴς λογισμός
