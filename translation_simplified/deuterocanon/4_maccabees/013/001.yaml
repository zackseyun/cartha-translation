translation:
  language: en
  text: The seven brothers treated even suffering up to death as beneath their concern. Therefore, people on every side acknowledge that godly reason[a] has sovereign power over the passions.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Godly reason” means reason shaped by reverence toward God; it may also be translated “pious reason” or “devout reason.”
    reason: lexical_alternative
  - marker: b
    text: Here “passions” means disordered drives or impulses, not feelings in general.
    reason: cultural_note
