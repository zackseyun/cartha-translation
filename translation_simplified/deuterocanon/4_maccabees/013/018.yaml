translation:
  language: en
  text: “Jacob will welcome you, and all the honored fathers of Israel will praise you.” Each time one of the brothers was dragged away, the brothers who remained would say, “Brother, do not disgrace us or betray the witness of those who died before us.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also mean “do not prove false to those who died before us.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: all the fathers
  simplified_phrase: all the honored fathers of Israel
  preserved_meaning: The phrase refers to Israel’s revered patriarchal ancestors.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The added wording makes the ancestral sense clear while retaining “fathers.”
- pob_phrase: as each one of their brothers was being taken away
  simplified_phrase: Each time one of the brothers was dragged away
  preserved_meaning: The coercive removal happened to the brothers one after another.
  reasoning_layer_used: POB lexical decision and doctrine realignment
  rationale: “Each time” clarifies repetition, while “dragged away” preserves the forceful image.
- pob_phrase: those who remained were saying
  simplified_phrase: the brothers who remained would say
  preserved_meaning: The brothers still present repeatedly addressed each brother being removed.
  reasoning_layer_used: POB lexical decision and immediate context
  rationale: Naming the brothers removes an unclear pronoun and “would say” expresses repeated speech.
interpretive_expansions:
- pob_phrase: nor prove false to those who died before us
  rendering: or betray the witness of those who died before us
  claim: The warning is not to betray the testimony established by the earlier martyrs.
  evidence:
  - The POB lexical rationale identifies failure of the earlier martyrs’ example or testimony as the contextual sense.
  - The POB footnote explicitly offers “do not betray the witness of the brothers who have already died.”
  confidence: high
  alternatives_preserved:
  - do not prove false to those who died before us
