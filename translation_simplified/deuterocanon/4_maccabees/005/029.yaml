translation:
  language: en
  text: nor will I ignore the sacred oaths the fathers made about obeying the law.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the ancestors.” The Greek uses masculine ancestral language.
    reason: lexical_alternative
  - marker: b
    text: Here “the law” means the Jewish ancestral law, or the Law.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: disregard
  simplified_phrase: ignore
  preserved_meaning: The speaker refuses to neglect or treat the oaths as having no force.
  reasoning_layer_used: POB lexical decision for οὐ παρήσω
  rationale: “Ignore” is common English and preserves the documented sense of neglecting the oaths.
- pob_phrase: the sacred oaths of the fathers
  simplified_phrase: the sacred oaths the fathers made
  preserved_meaning: The male ancestors made solemn religious commitments.
  reasoning_layer_used: POB lexical and theological decisions for ἱεροὺς, προγόνων, and ὅρκους
  rationale: Adding “made” clearly identifies the fathers as those who swore the oaths.
- pob_phrase: to keep the law
  simplified_phrase: about obeying the law
  preserved_meaning: Obedience to the Jewish ancestral law is the content of the oaths.
  reasoning_layer_used: POB lexical rationale for περὶ τοῦ φυλάξαι τὸν νόμον and grounding review
  rationale: “About” prevents the phrase from sounding like the purpose of ignoring the oaths.
