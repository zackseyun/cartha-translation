translation:
  language: en
  text: Law, my trainer, I will not betray you.[a] Beloved self-control, I will put you fully into practice.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “deny you” or “prove false to you.”
    reason: lexical_alternative
  - marker: b
    text: Literally, “I will not spare you,” meaning that he will not hold back from exercising self-control.
    reason: simplification_note
simplification_decisions:
- pob_phrase: O law-trained discipline
  simplified_phrase: Law, my trainer
  preserved_meaning: The personified law is directly addressed as the speaker’s moral trainer.
  reasoning_layer_used: Greek vocative forms and POB personification decision
  rationale: This keeps the trainer image without adding an instrumental relation not expressed in the Greek.
- pob_phrase: I will not deny you
  simplified_phrase: I will not betray you
  preserved_meaning: The speaker pledges that he will not be false to the personified law.
  reasoning_layer_used: POB lexical decision for ψεύσομαί
  rationale: “Betray” clearly conveys violated loyalty and is a documented lexical alternative.
- pob_phrase: nor will I spare you, beloved self-control
  simplified_phrase: Beloved self-control, I will put you fully into practice
  preserved_meaning: The speaker will exercise the cherished virtue of self-control without holding back.
  reasoning_layer_used: POB lexical decisions for φείσομαί, φίλη, and ἐγκράτεια
  rationale: The natural English wording explains the difficult idiom while retaining direct address to the virtue.
interpretive_expansions:
- pob_phrase: nor will I spare you
  rendering: I will put you fully into practice
  claim: The speaker means that he will exercise self-control without holding back.
  evidence:
  - The POB rationale explains the idiom as not holding back from exercising self-control under torture.
  confidence: high
  alternatives_preserved:
  - I will not spare you
  - I will not hold back from exercising self-control
translation_notes:
  risk_flags:
  - risk: “Betray” may sound stronger than the POB main wording “deny.”
    mitigation: The POB lists “betray” as a supported alternative, while the footnote preserves the other senses.
  - risk: “Put you fully into practice” explains rather than reproduces the compact image “spare you.”
    mitigation: The POB rationale supports this meaning, and the footnote preserves the literal image.
