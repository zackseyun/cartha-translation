translation:
  language: en
  text: But you are acting like a tyrant. You are forcing us not only to break the law but also to eat, so that you may mock us still more by forcing us into this utterly hateful defilement through eating.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek uses a rare word that combines eating with ritual or moral defilement.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: But tyrannically you are
  simplified_phrase: But you are acting like a tyrant.
  preserved_meaning: The speaker condemns the ruler's oppressive, despotic conduct.
  reasoning_layer_used: The lexical decision for τυραννικόν permits a natural expression of tyranny.
  rationale: A direct sentence replaces the awkward adverb without weakening the accusation.
- pob_phrase: compelling us
  simplified_phrase: forcing us
  preserved_meaning: The ruler is coercing them against their will.
  reasoning_layer_used: The lexical decision for ἀναγκάζεις identifies compulsion as the core sense.
  rationale: “Forcing” is more familiar modern English than “compelling.”
- pob_phrase: mock us with this most hateful defilement by food
  simplified_phrase: mock us still more by forcing us into this utterly hateful defilement through eating
  preserved_meaning: The coerced eating would defile them and become a further means of humiliating them.
  reasoning_layer_used: The decisions for ὅπως, ἔτι, ἐγγελάσῃς, and μιεροφαγίᾳ preserve purpose, added mockery, and defilement through eating.
  rationale: The clearer clause presents the defiling act as the tyrant's intended means of further mockery.
interpretive_expansions:
- pob_phrase: mock us with this most hateful defilement by food
  rendering: mock us still more by forcing us into this utterly hateful defilement through eating
  claim: The forced, defiling eating is the means of the ruler's intended further humiliation.
  evidence:
  - ὅπως marks the ruler's purpose.
  - The dative phrase connects the mockery with the food-defilement.
  - The immediate context describes coercion to eat.
  confidence: high
  alternatives_preserved:
  - mock us with this defilement
  - mock us by making us suffer this defilement
translation_notes:
  risk_flags:
  - risk: Readers may take “the law” as civil law rather than Jewish law.
    mitigation: The text retains POB's deliberate wording without adding “God's.”
  - risk: No simple phrase fully reproduces the rare compound for defiling eating.
    mitigation: The text keeps both ideas, and the footnote explains their combination.
