translation:
  language: en
  text: After many had been seized, one man—the first from this flock[a]—was a Hebrew named Eleazar. He was a priest by birth, learned in the Law, and advanced in years. Because of his age, many in the tyrant’s circle knew him. He opened his mouth to speak.
  philosophy: optimal-equivalence
