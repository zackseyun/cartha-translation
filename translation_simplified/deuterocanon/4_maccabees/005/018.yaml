translation:
  language: en
  text: You assume that our law is not truly divine, though we believe it is. But even if you were right, you would still have no right to take away the honor[a] we have as people devoted to God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “our reputation.” The Greek refers to honorable standing based on reverence for God.
    reason: lexical_alternative
