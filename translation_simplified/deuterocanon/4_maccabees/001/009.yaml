translation:
  language: en
  text: They all disregarded even pain that went as far as death.[a] By doing this, they showed that reason rules over the passions.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek pictures them as looking down on the pain, treating it as powerless to rule them.
    reason: source_note
  - marker: b
    text: Here “passions” means powerful emotions and impulses—the things this book says reason rules over.
    reason: simplification_note
simplification_decisions:
- pob_phrase: For all these
  simplified_phrase: They all
  preserved_meaning: Every person just mentioned is included.
  reasoning_layer_used: Lexical decisions for ἅπαντες and οὗτοι
  rationale: A direct pronoun avoids the stiff demonstrative while retaining the full group.
- pob_phrase: having disregarded the pain even unto death
  simplified_phrase: disregarded even pain that went as far as death
  preserved_meaning: They treated the most extreme suffering, extending to death, as unable to master them.
  reasoning_layer_used: Lexical decisions for πόνον, ἕως θανάτου, and ὑπεριδόντες
  rationale: The finite verb and modern phrase replace an awkward participle and archaic “unto.”
- pob_phrase: demonstrated that reason rules over the passions
  simplified_phrase: By doing this, they showed that reason rules over the passions
  preserved_meaning: Their endurance served as evidence that disciplined reason masters irrational drives.
  reasoning_layer_used: Lexical and theological decisions for ἐπεδείξαντο, λογισμός, and πάθη
  rationale: Two sentences make the evidential relationship clear without weakening the claim.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “passions” as romantic feelings alone.
    mitigation: The footnote gives the broader philosophical sense without adding a command.
  - risk: “Disregarded” does not itself preserve the Greek image of looking down on pain.
    mitigation: The source note retains the image and explains its force.
