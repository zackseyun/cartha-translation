translation:
  language: en
  text: Therefore, just as pleasure and pain are two plant-like growths of the body and soul, many passions[a] are their offshoots.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “emotions” or “inner impulses.”
    reason: lexical_alternative
