  preserved_meaning: Pleasure and pain are pictured as organic growths belonging to the body and soul.
  reasoning_layer_used: Lexical decisions for φυτῶν and τοῦ σώματος καὶ τῆς ψυχῆς
  rationale: “Plant-like” makes the botanical image clear without claiming that body and soul are its causal source.
- pob_phrase: many passions are offshoots of these
  simplified_phrase: many passions are their offshoots
  preserved_meaning: Many passions derive from pleasure and pain within the continuing plant image.
  reasoning_layer_used: Lexical decisions for τούτων, τῶν παθῶν, and παραφυάδες
  rationale: The pronoun makes the relationship concise while retaining the image of offshoots.
