translation:
  language: en
  text: But I can speak about this too, right now.[a] First I will introduce the subject, as I usually do. Then I will turn to the discussion about them,[b] while giving glory to the all-wise God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean, “I am permitted to speak about this right now.”
    reason: lexical_alternative
  - marker: b
    text: “Them” may refer to the people who will be discussed, though it could mean “these matters.”
    reason: alternative_reading
