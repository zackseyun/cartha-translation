  preserved_meaning: The speakers want these prohibited foods, including every kind forbidden by the law.
  reasoning_layer_used: Lexical decisions for ἐπιθυμοῦντες, the animal categories, and παντοίων βρωμάτων
  rationale: “Want to eat” clarifies the appetite while the added comprehensive phrase preserves the source’s full breadth.
- pob_phrase: we abstain
