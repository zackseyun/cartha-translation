  preserved_meaning: The speakers refrain from consuming the forbidden foods.
  reasoning_layer_used: Lexical decision for ἀπέχομεθα and the immediate dietary context
  rationale: The direct wording makes the specific act of abstaining clear.
- pob_phrase: because of the mastery of reason
  simplified_phrase: because reason rules our desires
  preserved_meaning: Disciplined rational judgment controls bodily appetite under the law.
  reasoning_layer_used: Theological decision for λόγισμος and POB footnote rationale
  rationale: The active clause preserves the ruling image without using an abstract expression.
