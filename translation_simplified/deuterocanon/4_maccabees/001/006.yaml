translation:
  language: en
  text: Reason does not rule over all our passions. It rules over the passions that oppose justice,[a] courage, self-control, and prudence. It does not destroy those passions, but keeps us from giving in to them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “righteousness.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: one's own passions
  simplified_phrase: all our passions
  preserved_meaning: Reason’s rule is limited rather than extending to passions without distinction.
  reasoning_layer_used: Greek source and POB lexical decision for παθῶν
  rationale: The contrast is recast in ordinary English while retaining “passions” as the controlling ethical term.
- pob_phrase: those things opposed to justice and courage and self-control and prudence
  simplified_phrase: the passions that oppose justice, courage, self-control, and prudence
  preserved_meaning: Reason governs passions that conflict with the four named virtues.
  reasoning_layer_used: POB virtue-list rationale and immediate context
  rationale: Naming the opposed things as passions makes the sentence’s referent clear.
- pob_phrase: not so as to destroy them, but so as not to yield to them
  simplified_phrase: It does not destroy those passions, but keeps us from giving in to them
  preserved_meaning: Mastery means resisting passions, not eliminating them.
  reasoning_layer_used: POB lexical decisions for καταλῦσαι and μὴ εἴξαι
  rationale: The abstract purpose clauses become a direct contrast in natural English.
interpretive_expansions:
- pob_phrase: those things opposed to
  rendering: the passions that oppose
  claim: The opposing things are the passions under discussion.
  evidence:
  - The immediate clause contrasts these with “passions.”
  - The POB lexical rationale identifies them as impulses or factors contrary to virtue.
  confidence: high
  alternatives_preserved:
  - things that oppose the virtues
- pob_phrase: so as not to yield to them
  rendering: keeps us from giving in to them
  claim: Reason’s rule enables people to resist the opposing passions.
  evidence:
  - The Greek contrast defines mastery as not yielding rather than destroying.
  - The POB rationale glosses the phrase as “not to give way to them.”
  confidence: high
  alternatives_preserved:
  - does not yield to them
translation_notes:
  risk_flags:
  - risk: “All our passions” makes the limiting force of the opening contrast more explicit than the POB wording.
    mitigation: The following sentence limits reason’s rule to passions opposed to the four virtues.
  - risk: “Keeps us from” supplies the human object implicit in the statement about yielding.
    mitigation: The wording preserves reason as the governing power and people as those who resist the passions.
