translation:
  language: en
  text: Those men became even more worthy of admiration. Everyone admired their courage and endurance—even the people who tortured them. By their endurance, they conquered the tyrant and caused the downfall of the tyranny directed against their nation. Through them, their homeland was purified.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Purified” may include cleansing in a moral or religious sense, as well as the nation’s restoration.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: became even more admirable
  simplified_phrase: became even more worthy of admiration
  preserved_meaning: Their actions increased the honor others gave them.
  reasoning_layer_used: Lexical decision for θαυμαστότεροι
  rationale: The clearer phrase preserves moral esteem and the comparative force.
- pob_phrase: not only to all people ... but also to those who tortured them
  simplified_phrase: Everyone admired ... even the people who tortured them
  preserved_meaning: Their courage and endurance won admiration even from their torturers.
  reasoning_layer_used: Greek clause structure and lexical decision for αἰκισαμένων
  rationale: A direct sentence makes the surprising contrast immediately clear.
- pob_phrase: they became the cause of the overthrow of the tyranny against the nation, having conquered the tyrant by endurance
  simplified_phrase: By their endurance, they conquered the tyrant and caused the downfall of the tyranny directed against their nation
  preserved_meaning: Their steadfast suffering defeated the tyrant and brought down the hostile tyranny aimed at the nation.
  reasoning_layer_used: Lexical decisions for ὑπομονῇ, αἴτιοι κατέστησαν, καταλυθῆναι, and νικήσαντες
  rationale: The recast keeps endurance as the means, the sufferers as the cause, and the tyranny’s hostile direction.
translation_notes:
  risk_flags:
  - risk: “Purified” could be understood as only ritual cleansing or only political liberation.
    mitigation: The main text retains the ambiguity, and the footnote notes its moral, religious, and restorative range.
