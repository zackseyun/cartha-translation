translation:
  language: en
  text: Then someone might ask, “If reason rules over the passions, why does it not also master forgetfulness and ignorance?” But anyone who tries to make this argument is being ridiculous.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “But it is ridiculous to try to say this.” The Greek may either describe the objectors as ridiculous or express this impersonally.
    reason: alternative_reading
