  language: en
  text: In each case, reason that works in every way[a] tames the raw materials from which character and passions are formed. It does this by thoroughly cleansing them, pruning them, entwining them, raising them up, and reshaping them in every way.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Greek word describes reason as capable of every kind of work or effect.
    reason: lexical_alternative
