  reasoning_layer_used: POB lexical decision for ἐπεὶ
  rationale: The shorter wording keeps both the connective and rhetorical force.
- pob_phrase: when we are moved toward the forbidden foods
  simplified_phrase: when we feel drawn to forbidden foods
  preserved_meaning: An inward impulse attracts people toward prohibited food.
  reasoning_layer_used: POB lexical decision for κινούμενοι and τὰς ἀπειρημένας τροφάς
  rationale: “Feel drawn” expresses the inward movement in natural English.
- pob_phrase: reason is able to prevail over desires
  simplified_phrase: reason can overcome our desires
  preserved_meaning: The rational faculty can govern desires rather than submit to them.
  reasoning_layer_used: POB lexical and theological decisions for λογισμός and ἐπικρατεῖν
  rationale: “Can overcome” clearly states reason’s power while retaining the key term “reason.”
