translation:
  language: en
  text: Why, then, when we feel drawn to forbidden foods, do we turn away from the pleasure they offer? Is it not because reason can overcome our desires?[a] I think so.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “appetites”; here the word can refer especially to bodily cravings.
    reason: lexical_alternative
