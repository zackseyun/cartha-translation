translation:
  language: en
  text: Just as hands and feet move together under the soul’s direction, so those holy young men accepted death together for the sake of godliness,[a] as if godliness were an immortal soul guiding them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “piety.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: move in harmony with the directions of the soul
  simplified_phrase: move together under the soul’s direction
  preserved_meaning: The body’s parts act in unity under the soul’s guidance.
  reasoning_layer_used: Lexical decisions for συμφώνως and ἀφηγήμασιν
  rationale: The wording makes the body-and-soul comparison natural while retaining coordinated movement and guidance.
- pob_phrase: those holy youths
  simplified_phrase: those holy young men
  preserved_meaning: The group consists of consecrated or morally holy young males.
  reasoning_layer_used: Lexical decision for ἱεροὶ μειρᾶκες
  rationale: “Young men” is more immediately clear than “youths” without weakening “holy.”
- pob_phrase: as if by the immortal soul of godliness
  simplified_phrase: as if godliness were an immortal soul guiding them
  preserved_meaning: Godliness is figuratively pictured as the soul directing the young men.
  reasoning_layer_used: Theological decision on personification of εὐσέβεια
  rationale: The recast clause explains the image while “as if” keeps it figurative.
interpretive_expansions:
- pob_phrase: were in harmony with death for its sake
  rendering: accepted death together for the sake of godliness
  claim: Their accord involved a shared, willing acceptance of death on behalf of godliness.
  evidence:
  - The lexical decision lists “consented to” as an alternative for συνεφώνησαν.
  - The POB note says the repeated harmony language highlights their unified resolve.
  - The phrase ὑπὲρ αὐτῆς identifies godliness as the cause for which they died.
  confidence: high
  alternatives_preserved:
  - were in accord with death
  - consented to death
translation_notes:
  risk_flags:
  - risk: “Accepted death” makes the youths’ willing resolve more explicit than the POB wording.
    mitigation: The lexical alternatives and POB cross-reference directly support consent and unified resolve.
  - risk: Recasting the personification could be mistaken for a literal claim about godliness having a soul.
    mitigation: The phrase “as if” clearly marks the image as a comparison.
