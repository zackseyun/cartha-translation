translation:
  language: en
  text: Even bees, during the season when they make honeycomb, defend themselves against anyone who comes near. They strike those who approach their brood with their stingers as if with iron, and they defend their brood to the death.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: For even bees, around the time of making honeycomb
  simplified_phrase: Even bees, during the season when they make honeycomb
  preserved_meaning: The defense occurs during the broader season of wax and comb production.
  reasoning_layer_used: POB lexical decision for περὶ τὸν τῆς κηρογονίας καιρόν
  rationale: “During the season” is clear without narrowing the phrase to a momentary activity.
- pob_phrase: defend themselves against those who approach
  simplified_phrase: defend themselves against anyone who comes near
  preserved_meaning: The bees resist people who draw near without assuming that they are attackers.
  reasoning_layer_used: POB lexical decisions for ἐπαμύνονται and τοὺς προσιόντας
  rationale: The simpler wording preserves both defensive action and the neutral description of approach.
- pob_phrase: as with iron, strike with their stinger those who come near their brood, and defend them to the death
  simplified_phrase: They strike those who approach their brood with their stingers as if with iron, and they defend their brood to the death.
  preserved_meaning: The bees themselves use their stingers with iron-like force to protect their offspring even to death.
  reasoning_layer_used: POB lexical decisions for καθάπερ σιδήρῳ, κέντρον, νοσσιά, and ἐπαμύνονται ἕως θανάτου
  rationale: The recast sentence keeps the bees as agents, the stingers as instruments, and the offspring-protection image.
translation_notes:
  risk_flags:
  - risk: “Brood” may sound zoologically unusual when applied to bees.
    mitigation: It is retained because the Greek deliberately presents the bees as protecting offspring.
