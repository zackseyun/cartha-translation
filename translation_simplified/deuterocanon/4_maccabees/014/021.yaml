translation:
  language: en
  text: O reason, you are a tyrant ruling strong emotions and desires![a] A mother longs for godliness—faithful devotion to God—even more than she longs for her children.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek phrase “of children” may describe either reason or the emotions and desires. In either reading, reason rules the passions.
    reason: lexical_alternative
