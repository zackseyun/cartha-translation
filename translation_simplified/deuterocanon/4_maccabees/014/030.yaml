translation:
  language: en
  text: Even so, her love for her children pulled at her in many ways, drawing her toward compassion. Yet none of the many kinds of torture could turn her reason aside.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Her reason” may also mean “her resolve” or “her rational judgment”; throughout this book, the term refers to reason ruling emotion.
    reason: lexical_alternative
