translation:
  language: en
  text: For the more vulnerable mothers are in spirit, and the more children they have borne, the more they love their children.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: weak in spirit
  simplified_phrase: vulnerable ... in spirit
  preserved_meaning: Mothers are described as vulnerable or tender in their inner disposition, not merely as physically weak.
  reasoning_layer_used: POB lexical decision for ἀσθενέψυχοι
  rationale: This keeps the spirit image while clarifying its contextual sense.
- pob_phrase: more prolific
  simplified_phrase: the more children they have borne
  preserved_meaning: The comparison concerns mothers who have borne many children.
  reasoning_layer_used: POB lexical decision for πολυγονώτεραι and grounding review
  rationale: This replaces an uncommon term without broadening childbearing into other ways of becoming a mother.
- pob_phrase: the more ... the more
  simplified_phrase: the more ... and the more ... the more
  preserved_meaning: Greater inner vulnerability and greater childbearing are correlated with greater love for their children.
  reasoning_layer_used: POB lexical decisions for ὅσῳ ... τοσούτῳ and μᾶλλον
  rationale: The repeated comparison clearly connects both qualities with the stated result.
translation_notes:
  risk_flags:
  - risk: “Vulnerable” is somewhat broader than the Greek image of weakness in soul or spirit.
    mitigation: Keeping “in spirit” preserves the source-language domain and excludes merely physical weakness.
