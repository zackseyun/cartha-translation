  simplified_phrase: had two choices before her
  preserved_meaning: The mother faced two alternatives.
  reasoning_layer_used: POB lexical decision for δυεῖν προκειμένων
  rationale: “Choices before her” keeps the source image while making the decision clear.
- pob_phrase: godliness
  simplified_phrase: to remain faithful to God
  preserved_meaning: The choice concerns faithful devotion to God.
  reasoning_layer_used: POB theological decision for εὐσέβεια
  rationale: This states the term’s Godward meaning without relying on opaque religious language.
- pob_phrase: the temporary safety of her seven sons according to the tyrant’s promise
  simplified_phrase: to secure temporary safety for her seven sons through the tyrant’s promise
  preserved_meaning: The alternative was the sons’ short-term physical preservation based on the tyrant’s offer.
  reasoning_layer_used: POB lexical and theological decisions for σωτηρίας προσκαίρου and κατὰ τὴν τοῦ τυράννου ὑπόσχεσιν
  rationale: The wording clearly makes safety the promised outcome and avoids suggesting that the sons themselves were promised.
interpretive_expansions:
- pob_phrase: godliness
  rendering: to remain faithful to God
  claim: Godliness here means continued fidelity to God and his law.
  evidence:
  - The POB theological rationale defines εὐσέβεια as fidelity to God and his law.
  - The martyrdom context contrasts devotion to God with immediate physical safety.
  confidence: high
