translation:
  language: en
  text: How can I describe parents’ deep affection for their children? It is a fervor that stamps into each child’s small form a marvelous likeness to the parents, both in inner life and outward appearance.[a] This is especially true because fathers cause mothers to feel even greater tenderness toward their children.
  philosophy: optimal-equivalence
  footnotes:
