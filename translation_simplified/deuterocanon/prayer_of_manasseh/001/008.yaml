translation:
  language: en
  text: So, Lord, God of righteous people, you did not appoint repentance[a] for righteous people—Abraham, Isaac, and Jacob—who did not sin against you. But you appointed it for me—the sinner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “set repentance before.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Lord, God of the righteous
  simplified_phrase: Lord, God of righteous people
  preserved_meaning: God is identified as the God of those who are righteous.
  reasoning_layer_used: POB lexical decision for δικαίων
  rationale: “Righteous people” makes the group reference immediately clear.
- pob_phrase: for the righteous—for Abraham and Isaac and Jacob
  simplified_phrase: for righteous people—Abraham, Isaac, and Jacob
  preserved_meaning: The patriarchs are explicitly identified as righteous, maintaining the contrast with the sinner.
  reasoning_layer_used: Greek sequence and POB appositional rationale
  rationale: The category and names are both retained in a simpler apposition.
- pob_phrase: but you appointed repentance for me, the sinner
  simplified_phrase: But you appointed it for me—the sinner.
  preserved_meaning: God’s action toward the sinful speaker contrasts sharply with his action toward the patriarchs.
  reasoning_layer_used: POB lexical decisions for ἀλλ᾽ and τῷ ἁμαρτωλῷ
  rationale: A new sentence and pronoun make the contrast easier to follow.
translation_notes:
  risk_flags:
  - risk: “Appoint repentance” is unfamiliar in modern English.
    mitigation: The footnote supplies the source-supported alternative “set repentance before.”
  - risk: The claim that the patriarchs did not sin may appear to conflict with other biblical passages.
    mitigation: The unqualified wording is retained because the source and POB reject harmonizing additions.
