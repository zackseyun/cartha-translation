translation:
  language: en
  text: and the mercy of your promise has no measure and can never be fully explored.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean “your promised mercy” or “the mercy shown in your promise.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: is immeasurable
  simplified_phrase: has no measure
  preserved_meaning: God’s mercy cannot be measured.
  reasoning_layer_used: The lexical decision for ἀμέτρητόν preserves its quantitative force.
  rationale: “Has no measure” expresses the same image in familiar English.
- pob_phrase: unsearchable
  simplified_phrase: can never be fully explored
  preserved_meaning: God’s mercy cannot be completely searched out or investigated.
  reasoning_layer_used: The lexical rationale for ἀνεξιχνίαστον identifies what cannot be tracked out or fully investigated.
  rationale: “Explored” keeps the source image while avoiding an uncommon biblical term.
translation_notes:
  risk_flags:
  - risk: “Explored” may suggest physical territory to some readers.
    mitigation: “Fully” and the abstract subject preserve the sense of exhaustive investigation.
  - risk: “The mercy of your promise” remains open to several related meanings.
    mitigation: The footnote retains both documented alternatives without choosing one.
