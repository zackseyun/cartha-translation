translation:
  language: en
  text: Before you, all things shudder and tremble because of your powerful presence. For the majesty of your glory cannot be endured, and the wrath of your threat against sinners cannot be borne.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: before whom all things shudder and tremble at the presence of your power
  simplified_phrase: Before you, all things shudder and tremble because of your powerful presence.
  preserved_meaning: All creation reacts with visceral fear before God because of his immediate power.
  reasoning_layer_used: Lexical decisions for ὃν, πάντα, φρίσσει, τρέμει, ἀπὸ προσώπου, and δύναμις.
  rationale: The direct wording preserves both the cosmic scope and God's power manifested in his presence.
- pob_phrase: the majesty of your glory is unendurable
  simplified_phrase: the majesty of your glory cannot be endured
  preserved_meaning: God's glorious majesty cannot be endured or withstood.
  reasoning_layer_used: Lexical decisions for ἄστεκτος, μεγαλοπρεπία, and δόξα.
  rationale: The verbal form is common English while remaining impersonal and comprehensive.
- pob_phrase: the wrath of your threat against sinners is unbearable
  simplified_phrase: the wrath of your threat against sinners cannot be borne
  preserved_meaning: The wrath expressed in God's threat against sinners cannot be sustained.
  reasoning_layer_used: Lexical and theological decisions for ἀνυπόστατος, ὀργή, ἀπειλή, and ἐπὶ ἁμαρτωλούς.
  rationale: The revision improves readability without softening the personal and judicial language.
translation_notes:
  risk_flags:
  - risk: “Powerful presence” combines the closely linked ideas of God's presence and power.
    mitigation: It preserves the source image of presence while expressing the documented causal force naturally.
