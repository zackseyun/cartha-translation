translation:
  language: en
  text: Lord, I have sinned. I have sinned, and I myself know the wrongs I have done by breaking your law.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “my lawless deeds”; also translated “my iniquities.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I have sinned, Lord, I have sinned
  simplified_phrase: Lord, I have sinned. I have sinned
  preserved_meaning: The confession remains in the present perfect, and its solemn repetition is retained.
  reasoning_layer_used: POB lexical decision for ἡμάρτηκα and κύριε
  rationale: Moving the direct address first and dividing the line makes the prayer easier to follow.
- pob_phrase: my lawless deeds
  simplified_phrase: the wrongs I have done by breaking your law
  preserved_meaning: The speaker confesses concrete violations of God's law, not merely generic mistakes.
  reasoning_layer_used: POB lexical and theological decisions for ἀνομία
  rationale: The clause explains the unfamiliar idea of lawlessness in direct modern English.
interpretive_expansions:
- pob_phrase: my lawless deeds
  rendering: the wrongs I have done by breaking your law
  claim: The confessed wrongs are violations of the Lord's law.
  evidence:
  - The POB lexical rationale defines ἀνομία as violation of law.
  - The POB footnote identifies the law as God's law.
  - The prayer directly addresses the Lord.
  confidence: high
  alternatives_preserved:
