translation:
  language: en
  text: For I have sinned beyond counting—more than the grains of sand in the sea. My lawless deeds have multiplied, Lord; they have multiplied. My unrighteous acts are so many that I am not worthy to look up[a] and see the height of heaven.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “gaze intently.” The Greek can describe a fixed, intent look.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: beyond the number of the sand of the sea
  simplified_phrase: beyond counting—more than the grains of sand in the sea
  preserved_meaning: His sins are more numerous than the sea’s countless grains of sand.
  reasoning_layer_used: Lexical decision for ὑπὲρ ἀριθμὸν and ψάμμου θαλάσσης
  rationale: The rewrite explains the comparison while preserving the biblical sand image.
- pob_phrase: My lawless deeds have multiplied, Lord; my lawless deeds have multiplied
  simplified_phrase: My lawless deeds have multiplied, Lord; they have multiplied
  preserved_meaning: The repeated confession stresses how numerous his violations of God’s law have become.
  reasoning_layer_used: Lexical decision for ἀνομίαι and ἐπλήθυναν
  rationale: The pronoun removes cumbersome repetition without weakening its rhetorical force.
- pob_phrase: because of the multitude of my unrighteous acts
  simplified_phrase: My unrighteous acts are so many that
  preserved_meaning: The great number of his unrighteous acts causes his sense of unworthiness.
  reasoning_layer_used: Lexical decision for ἀπὸ τοῦ πλήθους and theological distinction of moral terms
  rationale: The result clause states the same causal relationship in ordinary English.
translation_notes:
  risk_flags:
  - risk: “Look up” may understate the Greek verb’s possible sense of staring intently.
    mitigation: A lexical footnote preserves the stronger alternative.
  - risk: “Lawless deeds” and “unrighteous acts” may sound similar to modern readers.
    mitigation: Both terms remain distinct to preserve the two different Greek moral terms.
