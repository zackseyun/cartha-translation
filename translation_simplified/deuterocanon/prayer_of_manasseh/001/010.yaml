    text: The “detestable things” were likely connected with idol worship.
    reason: cultural_note
simplification_decisions:
- pob_phrase: I am bent down with many iron bonds
  simplified_phrase: Heavy iron chains bend me down
  preserved_meaning: Iron restraints force the speaker into a bowed position.
  reasoning_layer_used: POB lexical decisions for κατακαμπτόμενος and πολλῷ δεσμῷ σιδηρῷ
  rationale: The active sentence and familiar word “chains” make the physical image immediate.
- pob_phrase: setting up abominations
  simplified_phrase: I set up detestable things
  preserved_meaning: The speaker established objects or practices that were abhorrent before God.
  reasoning_layer_used: POB lexical decision and cultural footnote for βδελύγματα
  rationale: “Detestable things” is clearer than “abominations” without making the likely idolatrous reference certain.
- pob_phrase: multiplying offenses
  simplified_phrase: committed more and more offenses
  preserved_meaning: The speaker repeatedly increased his wrongdoing against God.
  reasoning_layer_used: POB lexical decision for πληθύνας προσοχθίσματα
  rationale: The verbal wording expresses repeated wrongdoing in ordinary English.
