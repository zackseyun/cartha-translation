translation:
  language: en
  text: Heavy iron chains bend me down. I cannot lift my head, and I have no relief, because I provoked your wrath and did what is evil before you. I set up detestable things and committed more and more offenses.[a]
  philosophy: optimal-equivalence
  footnotes:
