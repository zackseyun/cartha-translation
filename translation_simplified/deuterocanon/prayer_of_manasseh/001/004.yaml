translation:
  language: en
  text: who closed off the abyss and sealed it with your fearsome and glorious name.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “awe-inspiring and glorious name.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: shut up the abyss
  simplified_phrase: closed off the abyss
  preserved_meaning: God restrained the abyss while the cosmic image remains intact.
  reasoning_layer_used: POB lexical decision for ὁ κλείσας and τὴν ἄβυσσον
  rationale: “Closed off” clearly conveys confinement in modern English without flattening the abyss to a generic depth.
- pob_phrase: fearful and glorious name
  simplified_phrase: fearsome and glorious name
  preserved_meaning: God’s name inspires solemn fear and possesses glory.
  reasoning_layer_used: POB lexical and theological decisions for φοβερῷ and ἐνδόξῳ
  rationale: “Fearsome” avoids the modern misunderstanding that God’s name is itself afraid.
translation_notes:
  risk_flags:
  - risk: “Fearsome” may suggest terror more strongly than reverent awe.
    mitigation: The footnote preserves “awe-inspiring” as an important lexical alternative.
