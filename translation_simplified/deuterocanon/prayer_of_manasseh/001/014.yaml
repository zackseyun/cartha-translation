simplification_decisions:
- pob_phrase: and in me you will show your kindness
  simplified_phrase: You will show your kindness in me.
  preserved_meaning: God's kindness will be displayed in the speaker's own case.
  reasoning_layer_used: POB theological decision on ἐν ἐμοί and applied lexical revision
  rationale: Ordinary English word order and a separate sentence make the statement easier to grasp while retaining “in me.”
- pob_phrase: for you will save me, though I am unworthy
  simplified_phrase: Though I am unworthy, you will save me
  preserved_meaning: God saves the speaker despite his unworthiness.
  reasoning_layer_used: POB lexical decision on ἀνάξιον ὄντα and σώσεις
  rationale: Placing the contrast first makes the relationship clear without weakening the claim of salvation.
- pob_phrase: according to your abundant mercy
  simplified_phrase: in keeping with your abundant mercy
  preserved_meaning: God's great mercy is the standard and measure of his saving action.
  reasoning_layer_used: POB lexical decision on κατὰ τὸ πολὺ ἔλεός σου
  rationale: “In keeping with” expresses the same relationship in more natural common English.
