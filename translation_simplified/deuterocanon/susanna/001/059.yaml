translation:
  language: en
  text: Then Daniel said to him, “You too have lied—but your lie has brought judgment on your own head. The angel of God stands ready with the sword to split you in two and destroy you.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word translated “you” at the end is plural, so this final threat includes both elders.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: You also have lied rightly against your own head
  simplified_phrase: You too have lied—but your lie has brought judgment on your own head
  preserved_meaning: The elder’s lie has recoiled on him and brought judgment upon himself.
  reasoning_layer_used: Lexical decisions for Ὀρθῶς and εἰς τὴν σεαυτοῦ κεφαλήν
  rationale: The rewrite makes the irony clear while preserving the concrete image of judgment on his head.
- pob_phrase: stands by, holding the sword
  simplified_phrase: stands ready with the sword
  preserved_meaning: The angel is present and prepared to carry out judgment with a sword.
  reasoning_layer_used: Lexical decisions for μένει and τὴν ῥομφαίαν ἔχων
  rationale: “Stands ready” expresses readiness for imminent action in natural English.
- pob_phrase: so that he may destroy you
  simplified_phrase: and destroy you
  preserved_meaning: The threatened splitting will result in complete destruction.
  reasoning_layer_used: Lexical decision for ἐξολεθρεύσῃ and theological decision on ὑμᾶς
  rationale: The shorter wording is clearer, while the footnote preserves the plural scope.
