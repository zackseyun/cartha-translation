translation:
  language: en
  text: But the lawless men went back. They made threats among themselves and secretly lay in wait to put her to death. They came to the city assembly rather than staying away.[a] All the sons of Israel who were there gathered together.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek clause is difficult; it most likely means that the men were present at the city assembly rather than absent.
    reason: textual_variant
  - marker: b
    text: 'Or, “the Israelites.” Greek: “the sons of Israel.”'
    reason: lexical_alternative
