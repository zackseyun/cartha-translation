translation:
  language: en
  text: In the past,[a] you gave unjust rulings. You condemned the innocent but released the guilty, even though the Lord says,[b] “You must not put an innocent and righteous person to death.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “judging unjust judgments”; the Greek repeats the same root for emphasis.
    reason: lexical_alternative
  - marker: b
    text: This command echoes Exodus 23:7 in the Greek tradition.
    reason: cross_reference
simplification_decisions:
- pob_phrase: formerly, while you were rendering unjust judgments
  simplified_phrase: In the past, you gave unjust rulings
  preserved_meaning: The elder had previously issued decisions that were legally and morally wrong.
  reasoning_layer_used: POB lexical decisions for πρότερον, κρίνων κρίσεις, and ἀδίκους
  rationale: A direct sentence replaces the dense participial construction while the footnote preserves the Greek repetition.
- pob_phrase: condemning the innocent, but releasing the guilty
  simplified_phrase: You condemned the innocent but released the guilty
  preserved_meaning: The elder punished guiltless people while letting culpable people go free.
  reasoning_layer_used: POB lexical decisions for ἀθῴους, κατακρίνων, ἀπολύων, and αἰτίους
  rationale: Finite verbs make the judicial contrast immediate without overstating release as formal acquittal.
- pob_phrase: though the Lord says, ‘You shall not put to death the innocent and righteous.’
  simplified_phrase: even though the Lord says, “You must not put an innocent and righteous person to death.”
  preserved_meaning: The elder acted against the Lord’s command forbidding wrongful execution.
  reasoning_layer_used: POB theological decision on κύριος and the concessive force of λέγοντος τοῦ κυρίου
  rationale: Modern command wording clarifies the law while preserving both innocent and righteous as distinct descriptions.
