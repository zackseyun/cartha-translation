translation:
  language: en
  text: Look, she was walking around as usual. One of the elders had already arrived. Then, look, the other came. He questioned the other elder:[a] “Why did you go out so early without taking me with you?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek shifts abruptly between “one” elder and “the other.” This wording preserves that abrupt sequence rather than smoothing it away.
    reason: source_note
simplification_decisions:
- pob_phrase: she was walking about as usual
  simplified_phrase: she was walking around as usual
  preserved_meaning: She was moving around the area as part of her regular practice.
  reasoning_layer_used: Lexical decisions for περιεπάτει and κατὰ τὸ εἰωθὸς.
  rationale: “Walking around” expresses the ongoing movement in common English.
- pob_phrase: one of the elders had come, and behold, the other arrived
  simplified_phrase: One of the elders had already arrived. Then, look, the other came.
  preserved_meaning: The first elder was present before the second arrived, and both notice markers remain vivid.
  reasoning_layer_used: Lexical decisions for ἐλληλύθει, παρεγένετο, and ἰδοὺ.
  rationale: Short sentences and “already” make the sequence immediately clear.
- pob_phrase: Why did you go out so early without taking me along?
  simplified_phrase: Why did you go out so early without taking me with you?
  preserved_meaning: The elder asks why the other went out early without bringing him as a companion.
  reasoning_layer_used: Lexical decisions for ὄρθρου and παραλαβὼν με.
  rationale: “With you” is natural speech while “go out” preserves the specific action.
