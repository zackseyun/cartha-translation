  text: All the people quickly came back. The elders said to Daniel, “Come, sit in the middle of our gathering and tell us, because God has given you honored authority.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “senior standing,” “eldership,” or “preeminence.” It refers to recognized authority, not literal age.
