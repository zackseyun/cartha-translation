  language: en
  text: 'In that year, two elders from among the people were appointed as judges. They were the men the Master[a] had spoken about: “Lawlessness came out of Babylon. It came from elders serving as judges, who seemed to govern the people.”[b]'
  philosophy: optimal-equivalence
  footnotes:
