translation:
  language: en
  text: These men saw a beautiful woman walking in her husband’s garden one evening. Her name was Susanna. She was the daughter of Hilkiah and the wife of Joakim, one of their fellow Israelites—a brother among their own people.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek wording is difficult and literally uses “brother”; here it refers to a fellow Israelite, not necessarily a biological brother.
    reason: alternative_reading
