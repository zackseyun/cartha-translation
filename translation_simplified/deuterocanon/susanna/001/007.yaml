  rationale: The shorter phrase expresses the same description in natural English.
- pob_phrase: a wife of one of their brothers from the sons of Israel
  simplified_phrase: the wife of Joakim, one of their fellow Israelites—a brother among their own people
  preserved_meaning: Susanna was married to a man within the elders’ Israelite covenant community.
  reasoning_layer_used: theological decision on the difficult kinship phrase
  rationale: This keeps the brother image while preventing a mistaken biological reading.
- pob_phrase: whose name was Susanna, daughter of Hilkiah, wife of Joakim, walking in her husband's garden in the evening
  simplified_phrase: walking in her husband’s garden one evening. Her name was Susanna. She was the daughter of Hilkiah and the wife of Joakim
  preserved_meaning: The time, action, name, parentage, and marriage remain distinct.
  reasoning_layer_used: POB syntax and lexical decisions
  rationale: Three short sentences replace the dense chain of descriptive clauses.
