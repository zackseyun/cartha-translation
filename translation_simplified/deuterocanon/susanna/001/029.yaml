translation:
  language: en
  text: The next day, the people gathered with Joakim, Susanna’s husband. The two elders came with their minds full of a lawless plan against Susanna—a plan to put her to death. In front of the people, they said, “Send for Susanna, the daughter of Hilkiah and the wife of Joakim.”
  philosophy: optimal-equivalence
