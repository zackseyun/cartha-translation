translation:
  language: en
  text: Joakim was extremely wealthy. He had a garden next to his house, and the Jews[a] regularly came to him because they respected him more than anyone else among them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Judeans,” if the term refers to people from Judea rather than to the Jewish community.
    reason: alternative_reading
