translation:
  language: en
  text: He could not gain the upper hand over Onias. So he went to Apollonius son of Thrasaeas[a], who was then governor[b] of Coele-Syria and Phoenicia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also be read as “Apollonius Thrasaeas,” but it most likely identifies Thrasaeas as his father.
    reason: lexical_alternative
  - marker: b
    text: The Greek title may also mean “general,” but here it refers to the official governing these regions.
    reason: lexical_alternative
