translation:
  language: en
  text: But Heliodorus offered a sacrifice to God and made very great vows[a] to the God who had saved his life. After saying farewell to Onias[b], he returned to the king.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also mean “offered very great prayers,” but “vows” fits the sacrifice in this scene better.
    reason: lexical_alternative
  - marker: b
    text: The Greek verb can also mean “received” or “welcomed,” but the context favors saying farewell.
    reason: lexical_alternative
  - marker: c
    text: The Greek verb has a military flavor, suggesting marching back or breaking camp.
    reason: cultural_note
