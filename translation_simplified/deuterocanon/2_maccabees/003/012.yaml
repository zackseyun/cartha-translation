- pob_phrase: to wrong those who had trusted
  simplified_phrase: to wrong the people who had trusted
  preserved_meaning: The people had placed settled confidence in the sanctuary and must not be treated unjustly.
  reasoning_layer_used: Greek lexical decisions for ἀδικήσαί and τοὺς πεπιστευκότας
  rationale: Adding “the people” makes the participial phrase immediately clear without changing its force.
- pob_phrase: the majesty and inviolability of the temple
  simplified_phrase: the majesty and protected status of the temple
  preserved_meaning: The temple possessed revered dignity and recognized protection from seizure or violation.
  reasoning_layer_used: Lexical and theological decisions for σεμνότητι and ἀσυλίᾳ
  rationale: “Protected status” communicates the legal-sacred sense more clearly than the uncommon word “inviolability.”
- pob_phrase: throughout the whole world
  simplified_phrase: throughout the world
  preserved_meaning: The temple was honored universally in the verse’s expansive rhetoric.
  reasoning_layer_used: Lexical decision for κατὰ τὸν σύμπαντα κόσμον
  rationale: Removing redundant “whole” gives natural English while retaining the universal scope.
