translation:
  language: en
  text: He also said that it was utterly impossible to wrong the people who had trusted in the holiness of that place and in the majesty and protected status of the temple, which was honored throughout the world.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The temple’s “protected status” may specifically include its right to serve as a place of asylum.
    reason: lexical_alternative
