translation:
  language: en
  text: He reported that the treasury in Jerusalem was filled with vast sums of money. The separate funds there were beyond counting.[a] They were not part of the account for sacrifices, and it was possible for them to come under the king’s control.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the amount of the deposits was beyond counting”; the Greek may refer to various sums entrusted to the treasury.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: was full of immense sums of money
  simplified_phrase: was filled with vast sums of money
  preserved_meaning: The treasury contained an extraordinarily large amount of money.
  reasoning_layer_used: Lexical decision for χρημάτων ἀμυθήτων.
  rationale: “Vast sums” expresses the scale in more familiar English.
- pob_phrase: the quantity of the separate funds was beyond counting
  simplified_phrase: The separate funds there were beyond counting
  preserved_meaning: The treasury held many distinct sums or categories of money that could not be counted.
  reasoning_layer_used: Lexical decisions for τὸ πλῆθος τῶν διαφόρων and ἀναρίθμητον.
  rationale: The shorter sentence removes the abstract phrase “quantity of” while retaining distinct funds and their numberless scale.
- pob_phrase: they were not connected with the account of the sacrifices
  simplified_phrase: They were not part of the account for sacrifices
  preserved_meaning: The funds were distinct from ordinary sacrificial accounting or expenditure.
  reasoning_layer_used: Lexical and theological decisions for μὴ προσήκειν αὐτὰ πρὸς τὸν τῶν θυσιῶν λόγον.
  rationale: “Not part of” states the administrative distinction clearly without claiming the funds were wholly secular.
translation_notes:
  risk_flags:
  - risk: “Separate funds” may be understood as formally divided accounts rather than various entrusted sums.
    mitigation: The footnote preserves the deposit-based lexical alternative.
  - risk: “Come under the king’s control” could be mistaken for a claim that seizure was legitimate.
    mitigation: The wording retains “it was possible” and makes no judgment about legal or sacred status.
