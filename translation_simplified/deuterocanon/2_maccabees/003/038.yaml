translation:
  language: en
  text: If you have an enemy, or anyone plotting against your interests, send him to that place. He will come back to you flogged—if he survives at all—because there truly is some power of God at that place.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: one plotting against your affairs
  simplified_phrase: anyone plotting against your interests
  preserved_meaning: The person is scheming against matters that concern or benefit you.
  reasoning_layer_used: POB lexical decision for πραγμάτων ἐπίβουλον
  rationale: “Interests” expresses the broad personal sense more naturally than “affairs.”
- pob_phrase: you will receive him back flogged—if indeed he even survives
  simplified_phrase: He will come back to you flogged—if he survives at all
  preserved_meaning: The person may return after a severe beating, though survival itself is uncertain.
  reasoning_layer_used: POB lexical decisions for μεμαστιγωμένον, προσδέξῃ, and ἐάνπερ καὶ διασωθῇ
  rationale: Two direct clauses preserve the grim force while making the return easier to follow.
- pob_phrase: some power of God about the place
  simplified_phrase: some power of God at that place
  preserved_meaning: A real but deliberately undefined manifestation of divine power is connected with the location.
  reasoning_layer_used: POB lexical and theological decisions for θεοῦ δύναμιν and περὶ τὸν τόπον
  rationale: “At that place” gives the spatial sense in ordinary English without defining the power more precisely.
translation_notes:
  risk_flags:
  - risk: “At that place” is less spatially unusual than the Greek phrase rendered “about the place.”
    mitigation: It retains the approved spatial meaning without implying a more specific form of divine presence.
  - risk: Readers may take “some power of God” as uncertainty about whether the power is real.
    mitigation: “Truly” preserves the text’s insistence that the power is real while “some” keeps its identity undefined.
