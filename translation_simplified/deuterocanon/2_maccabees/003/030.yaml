translation:
  language: en
  text: The people kept blessing the Lord as he brought glory to his own temple. Only a short time before, the temple had been full of fear and turmoil. But when the Almighty Lord appeared,[a] it was filled with joy and gladness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “manifested himself”; the Greek term refers to a divine appearance.
    reason: lexical_alternative
