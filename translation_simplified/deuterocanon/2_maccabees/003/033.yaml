translation:
  language: en
  text: While the high priest was carrying out the rite of atonement, the same young men appeared to Heliodorus again, wearing the same clothes. They stood there and said, “Give great thanks to Onias the high priest. Because of him, the Lord has graciously granted you life.”
  philosophy: optimal-equivalence
