  simplified_phrase: was carrying out the rite of atonement
  preserved_meaning: The high priest was performing an atoning religious act.
  reasoning_layer_used: Lexical and theological decisions on ἱλασμός
  rationale: This keeps “atonement” while clarifying that it was an enacted ritual.
- pob_phrase: clothed in the same garments
  simplified_phrase: wearing the same clothes
  preserved_meaning: They wore the clothing seen in their earlier appearance.
  reasoning_layer_used: Lexical decision on ἐσθής and visual continuity
  rationale: This expresses the same visual image in ordinary modern English.
- pob_phrase: Give many thanks
  simplified_phrase: Give great thanks
  preserved_meaning: Heliodorus must show abundant gratitude to Onias.
  reasoning_layer_used: Lexical decision on Πολλὰ ... χάριτας ἔχε
  rationale: “Great” preserves the emphasis on the extent of gratitude without adding emotional sincerity.
