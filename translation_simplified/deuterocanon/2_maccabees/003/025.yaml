translation:
  language: en
  text: For a horse appeared before them. It had a fearsome rider and was decorated with magnificent horse gear.[a] Rushing headlong, the horse struck Heliodorus with its front hoofs. The rider appeared to be wearing golden armor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may refer more specifically to a splendid saddlecloth or more broadly to ornamental gear for the horse.
    reason: lexical_alternative
