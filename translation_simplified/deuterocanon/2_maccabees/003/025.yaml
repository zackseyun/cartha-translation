  preserved_meaning: A horse became visible before them, carrying a rider who inspired fear.
  reasoning_layer_used: Lexical decisions for ὤφθη and φοβερὸν ἔχων τὸν ἐπιβάτην
  rationale: Two short sentences make the sudden appearance and the rider's character easier to grasp.
