simplification_decisions:
- pob_phrase: immediately set out on the journey
  simplified_phrase: set out at once
  preserved_meaning: Heliodorus began the journey without delay.
  reasoning_layer_used: The lexical decision for εὐθέως and the travel idiom.
  rationale: The shorter phrase states the same action in ordinary English.
- pob_phrase: outwardly as though to inspect
  simplified_phrase: He appeared to be going to inspect
  preserved_meaning: Inspection was the apparent purpose of his journey.
  reasoning_layer_used: The lexical decisions for τῇ μὲν ἐμφάσει and ὡς ... ἐφοδεῦσαι.
  rationale: This keeps the appearance-reality contrast without implying more deceit than the Greek states.
- pob_phrase: but in reality to carry out the king’s purpose
  simplified_phrase: But in reality, he was going to carry out the king’s purpose
  preserved_meaning: His actual mission was to fulfill the king’s intention.
  reasoning_layer_used: The lexical decisions for τῷ πράγματι δέ and τὴν ... πρόθεσιν ἐπιτελεῖν.
  rationale: A separate sentence makes his true mission easier to follow while retaining the chosen terms.
translation_notes:
  risk_flags:
