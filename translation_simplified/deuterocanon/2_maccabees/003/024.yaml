translation:
  language: en
  text: But when he and his guards had arrived at the treasury, the Sovereign of spirits and of all authority made a powerful manifestation. Everyone who had dared to enter was overwhelmed by God’s power and became weak and afraid.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may mean “had dared to gather there,” but the context favors entering the treasury area.
    reason: alternative_reading
