translation:
  language: en
  text: Some of the money also belonged to Hyrcanus son of Tobias, a man of very high rank. But the ungodly Simon had not misrepresented matters to that extent. In all, there were four hundred talents of silver and two hundred talents of gold.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A talent was a large ancient unit of weight used to measure precious metals. In Greek, “talents” is stated with the silver and understood with the gold.
    reason: cultural_note
