translation:
  language: en
  text: For Antiochus and his friends came to the place as if he intended to marry the goddess.[a] He wanted to get a large sum of money as a dowry.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “to live with her” or “to wed her.” Here Antiochus appears to be pretending that he will marry the goddess.
    reason: lexical_alternative
