translation:
  language: en
  text: After many years had passed, when it seemed good to God, the king of Persia sent Nehemiah. Nehemiah then sent the descendants of the priests who had hidden the fire to recover it.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says more concisely that Nehemiah sent them “for the fire”; the context indicates that they were to recover the hidden fire.
    reason: lexical_alternative
