translation:
  language: en
  text: While Demetrius was king, in the one hundred sixty-ninth year, we Jews wrote to you during the great distress and acute crisis that came upon us in those years, after Jason and those with him revolted from the holy land and the kingdom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The expression may also mean that they defected or turned away from the faith; it has both political and religious overtones.
    reason: alternative_reading
