translation:
  language: en
  text: We are about to celebrate the cleansing of the temple on the twenty-fifth day of the month of Chasleu. For that reason, we thought it necessary to explain this clearly to you, so that you too may celebrate the festival of booths and of the fire[a], recalling the time when Nehemiah offered sacrifices after building both the temple and the altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek simply says “and of the fire”; it may mean “and the fire festival.”
    reason: lexical_alternative
