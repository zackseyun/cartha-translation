  preserved_meaning: A large fire began burning without naming what ignited it.
  reasoning_layer_used: POB lexical decisions for ἀνήφθη and πυρὰ μεγάλη
  rationale: “Was lit” is more familiar while retaining the passive sense.
- pob_phrase: so that everyone marveled
