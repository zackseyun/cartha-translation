translation:
  language: en
  text: They opened the hidden door of the smoke chamber.[a] Then they threw stones and struck the leader down.[b] They cut him into pieces and threw the heads to the people outside.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Greek term may mean “furnace room” or “place of smoke or incense”; its precise meaning is uncertain.
    reason: lexical_alternative
  - marker: b
    text: The Greek verb evokes a thunderbolt or lightning strike, but here it may describe a violent blow rather than literal lightning.
    reason: lexical_alternative
