  rationale: A complete sentence makes the sequence easier to follow while retaining the rare room term and its uncertainty.
- pob_phrase: they threw stones and struck down the leader
  simplified_phrase: Then they threw stones and struck the leader down.
  preserved_meaning: The attackers used stones in the violent attack that brought down the leader.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Then” clearly marks the sequence without claiming that literal lightning struck him.
