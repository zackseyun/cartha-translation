translation:
  language: en
  text: So he came to a miserable end. He was confined with Aretas,[a] the ruler of the Arabs, while fleeing from city to city and being pursued by everyone. Everyone hated him as an apostate who had abandoned the laws and loathed him as the executioner of his homeland and fellow citizens. He was driven out into Egypt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may mean that he was confined with Aretas or held under Aretas's control; it does not clearly specify the relationship.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: he met the end of a miserable ruin
  simplified_phrase: he came to a miserable end
  preserved_meaning: His disastrous and pitiable ruin reached its final outcome.
  reasoning_layer_used: Lexical decisions for πέρας ... ἔτυχεν and κακῆς καταστροφῆς
  rationale: This natural English states plainly that his ruin ended in misery.
- pob_phrase: pursued by all
  simplified_phrase: pursued by everyone
  preserved_meaning: People everywhere were chasing him.
  reasoning_layer_used: Lexical decision for διωκόμενος ὑπὸ πάντων
  rationale: “Everyone” is common English and retains the broad scope.
- pob_phrase: abhorred as the executioner of his homeland and fellow citizens
  simplified_phrase: everyone ... loathed him as the executioner of his homeland and fellow citizens
  preserved_meaning: People regarded him with revulsion because of his deadly violence against his own country and people.
  reasoning_layer_used: Lexical decisions for βδελυσσόμενος and δήμιος
  rationale: The active clause identifies the people’s response while preserving the brutal executioner image.
interpretive_expansions:
- pob_phrase: an apostate from the laws
  rendering: an apostate who had abandoned the laws
  claim: “Apostate” describes someone who had repudiated allegiance to the laws.
  evidence:
