translation:
  language: en
  text: He also left officials behind to mistreat the nation. In Jerusalem, he left Philip, who was Phrygian by birth but more barbarous[a] in character than the ruler who appointed him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “barbarous” condemns Philip as cruel and brutal; it does not merely describe his foreign origin.
    reason: cultural_note
simplification_decisions:
- pob_phrase: left overseers
  simplified_phrase: left officials behind
  preserved_meaning: He left people with delegated authority in place.
  reasoning_layer_used: The lexical decisions allow “officials” and identify the verb as leaving someone behind or in place.
  rationale: “Officials” is clearer than “overseers,” while “behind” preserves the source verb’s force.
- pob_phrase: in Jerusalem, Philip
  simplified_phrase: In Jerusalem, he left Philip
  preserved_meaning: Philip was the official left in charge at Jerusalem.
  reasoning_layer_used: The source syntax and lexical rationale identify Philip as one of those left behind.
  rationale: Adding the verb makes the compressed Greek-style construction a complete English sentence.
- pob_phrase: the one who appointed him
  simplified_phrase: the ruler who appointed him
  preserved_meaning: Philip is compared with the ruler who installed him.
  reasoning_layer_used: The POB footnote and lexical rationale explicitly identify the appointer as the ruler.
  rationale: Naming the person as the ruler removes an unclear pronoun reference.
translation_notes:
  risk_flags:
  - risk: “Barbarous” can sound like an ethnic label in modern English.
    mitigation: The footnote clarifies that it expresses the author’s moral judgment about Philip’s cruelty.
