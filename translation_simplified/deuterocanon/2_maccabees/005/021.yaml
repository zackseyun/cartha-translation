translation:
  language: en
  text: So Antiochus carried off 1,800 talents from the temple and hurried to Antioch. In his arrogance, with his heart lifted high, he imagined he could make land fit for sailing and the sea fit for walking.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This deliberately impossible picture shows that Antiochus thought he could reverse the natural order.
    reason: cultural_note
