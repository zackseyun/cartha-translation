translation:
  language: en
  text: A false rumor spread that Antiochus had died.[a] Jason, with at least a thousand men, suddenly attacked the city. Those on the city wall were driven back, and as the city was already being captured, Menelaus fled into the citadel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek uses a gentle expression for death, literally saying that Antiochus had “changed life.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a false rumor arose
  simplified_phrase: A false rumor spread
  preserved_meaning: False news about Antiochus began circulating.
  reasoning_layer_used: POB lexical decision for λαλιάς ψευδοῦς
  rationale: “Spread” describes circulating news more naturally than “arose.”
- pob_phrase: had passed from life
  simplified_phrase: had died
  preserved_meaning: The rumor claimed that Antiochus was dead.
  reasoning_layer_used: POB lexical decision and footnote for μετηλλαχότος τὸν βίον
  rationale: The direct wording is immediately clear, while the footnote preserves the Greek euphemism.
- pob_phrase: Jason, taking no fewer than a thousand men, launched a sudden attack against the city
  simplified_phrase: Jason, with at least a thousand men, suddenly attacked the city
  preserved_meaning: Jason brought a force of one thousand men or more in a sudden assault.
  reasoning_layer_used: POB lexical decisions for παραλαβών, οὐκ ἐλάττους τῶν χιλίων, and ἐφνιδίως
  rationale: “With” avoids implying that Jason recruited the men at that moment while keeping the force and surprise clear.
