translation:
  language: en
  text: But Jason went on slaughtering his own fellow citizens without mercy. He failed to see that success against one’s own kin is the greatest disaster. He imagined that he was putting up monuments to victory over enemies, rather than over his own countrymen.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: kept carrying out merciless slaughter of his own fellow citizens
  simplified_phrase: went on slaughtering his own fellow citizens without mercy
  preserved_meaning: Jason repeatedly and brutally killed people of his own city.
  reasoning_layer_used: Lexical decisions for σφαγὰς, ἀφειδῶς, and τῆς πόλεως τῶν ἰδίων.
  rationale: The active wording is easier to follow while retaining the force of “slaughter” and his civic bond to the victims.
- pob_phrase: not understanding that success against kinsmen is the greatest disaster
  simplified_phrase: He failed to see that success against one’s own kin is the greatest disaster.
  preserved_meaning: Apparent victory over one’s own people is actually ruinous.
  reasoning_layer_used: Theological decision on the moral reversal between success and disaster.
  rationale: A separate sentence makes the narrator’s judgment clear without weakening the explicit superlative.
- pob_phrase: winning trophies over enemies and not over his own countrymen
  simplified_phrase: putting up monuments to victory over enemies, rather than over his own countrymen
  preserved_meaning: Jason treated violence against his own nation as a military triumph over foreign foes.
  reasoning_layer_used: Lexical decisions for τρόπαια καταβάλλεσθαι, πολεμίων, and ὁμοεθνῶν.
  rationale: “Monuments to victory” explains the ancient trophy image while preserving it.
