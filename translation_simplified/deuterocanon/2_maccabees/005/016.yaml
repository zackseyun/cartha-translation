translation:
  language: en
  text: With his defiled hands, he took the sacred temple vessels. With those unholy hands, he dragged away the gifts that many kings had dedicated to add to the temple’s greatness, glory, and honor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the things that many kings had set up,” probably as gifts dedicated in the temple.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: with his polluted hands taking the sacred vessels
  simplified_phrase: With his defiled hands, he took the sacred temple vessels.
  preserved_meaning: His ritually defiling act violated objects reserved as sacred.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Defiled” and “sacred” keep the cultic contrast while a direct sentence clarifies the action.
- pob_phrase: with profane hands dragging away
  simplified_phrase: With those unholy hands, he dragged away
  preserved_meaning: His hands were unfit for holy things, and the removal was forceful and degrading.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Unholy” makes the sacred-profane contrast immediately understandable without weakening “dragged away.”
- pob_phrase: for the increase and glory and honor of the place
  simplified_phrase: to add to the temple’s greatness, glory, and honor
  preserved_meaning: The royal gifts were intended to enhance the sanctuary’s splendor and honor.
  reasoning_layer_used: lexical decision and cultural note
  rationale: The purpose clause is recast naturally, and “temple” explains the reverential expression “the place.”
