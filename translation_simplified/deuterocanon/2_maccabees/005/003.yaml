translation:
  language: en
  text: Swords were brandished, cavalry squadrons lined up for battle, and both sides attacked and counterattacked.[a] Shields moved, masses of spears[b] appeared, missiles flew, golden decorations gleamed, and all kinds of armor could be seen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “made raids against each other”; the Greek can refer to rushing attacks or raids.
    reason: lexical_alternative
  - marker: b
    text: The Greek term here is difficult and may refer more generally to masses of pole weapons or similar battle gear.
    reason: textual_variant
