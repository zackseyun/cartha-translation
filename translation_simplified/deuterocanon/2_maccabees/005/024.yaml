translation:
  language: en
  text: But he sent Apollonius, the chief defiler, with an army of twenty-two thousand. He ordered Apollonius to slaughter everyone in the prime of life and to sell[a] the women and younger people.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In this wartime context, this likely means to sell them into slavery, though the Greek simply says “sell.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the chief polluter
  simplified_phrase: the chief defiler
  preserved_meaning: Apollonius is given a strongly insulting description as a leader who causes defilement.
  reasoning_layer_used: POB lexical decision for μυσάρχην
  rationale: “Chief defiler” preserves the source image while sounding more natural to common readers.
- pob_phrase: commanding him to slaughter
  simplified_phrase: He ordered Apollonius to slaughter
  preserved_meaning: Apollonius received the command to carry out violent mass killing.
  reasoning_layer_used: POB lexical decisions for προστάξας and κατασφάξαι
  rationale: A new sentence and an explicit name make the command easier to follow without weakening its brutality.
- pob_phrase: the younger ones
  simplified_phrase: younger people
  preserved_meaning: The group remains broadly younger persons without narrowing it to children or youths.
  reasoning_layer_used: POB lexical decision for τοὺς νεωτέρους
  rationale: “Younger people” is clear modern English and preserves the Greek comparative sense.
translation_notes:
  risk_flags:
  - risk: “Chief defiler” may be read as a formal office title.
    mitigation: The wording retains POB’s pejorative force without inventing a neutral military rank.
  - risk: Modern readers may miss that selling wartime captives probably meant enslavement.
    mitigation: The footnote states the likely implication while keeping the main text within the Greek wording.
