translation:
  language: en
  text: But Judas, also called Maccabeus, withdrew after his group had been reduced to about ten people.[a] He and those with him lived in the mountains like wild animals. They kept eating plants so that they would not share in the defilement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek is compressed and approximate; it may be rendered more literally, “having become about the tenth.”
    reason: lexical_alternative
