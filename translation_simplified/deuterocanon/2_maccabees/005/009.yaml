translation:
  language: en
  text: The man who had driven many people from their homeland went to the Spartans.[a] He expected to receive protection because of the kinship,[b] but he perished in a foreign land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Greek: “Lacedaemonians,” another name for the Spartans.'
    reason: lexical_alternative
  - marker: b
    text: This likely refers to the traditional kinship claimed between the Jews and Spartans; compare 1 Maccabees 12:6–23.
    reason: cross_reference
simplification_decisions:
- pob_phrase: He who had made many exiles from their homeland
  simplified_phrase: The man who had driven many people from their homeland
  preserved_meaning: He caused many people to live as exiles away from their native land.
  reasoning_layer_used: Lexical decisions for ἀποξενώσας and τῆς πατρίδος
  rationale: “Driven many people from” states the forced removal more directly than “made many exiles.”
- pob_phrase: having gone up to the Lacedaemonians
  simplified_phrase: went to the Spartans
  preserved_meaning: He traveled to the people known as the Lacedaemonians or Spartans.
  reasoning_layer_used: POB revision and lexical alternative for Λακεδαιμονίους
  rationale: “Spartans” is the familiar modern name, while the literal ethnic name remains in a note.
- pob_phrase: as though he would obtain protection
  simplified_phrase: He expected to receive protection
  preserved_meaning: He went there believing that protection would be available to him.
  reasoning_layer_used: Lexical decision for τευξόμενος σκέπης
  rationale: A direct sentence makes his expectation clear without adding a promised outcome.
