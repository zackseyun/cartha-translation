translation:
  language: en
  text: Antiochus became proud in his own thinking. He did not understand that the Master[a] had been angered for only a little while because of the sins of the people living in the city. That was why the sacred place was overlooked.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Master” translates a Greek divine title distinct from “Lord.”
    reason: lexical_alternative
  - marker: b
    text: Or “disregarded”; this likely refers to the sanctuary being temporarily exposed to desecration.
    reason: alternative_reading
