  text: But when these men fell down before Nikanor to plead with him,[a] he became confused. He took it badly that he should set aside the agreement already made, though the man had done nothing wrong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek portrays them falling before Nikanor, possibly at his feet, as an act of appeal.
    reason: lexical_alternative
