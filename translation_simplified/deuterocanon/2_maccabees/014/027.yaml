translation:
  language: en
  text: But the king became enraged. The slanders of that utterly wicked man stirred him up, so he wrote to Nikanor. He said he was deeply displeased with the treaty and ordered Nikanor to send Maccabeus to Antioch as a prisoner at once.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: and, provoked by the slanders of that utterly wicked man, wrote to Nikanor
  simplified_phrase: The slanders of that utterly wicked man stirred him up, so he wrote to Nikanor.
  preserved_meaning: The man's malicious charges provoked the king and led him to write.
  reasoning_layer_used: Lexical decisions for διαβολαῖς and ἐρεθισθείς
  rationale: A separate sentence makes the cause and result easier to follow while retaining the strong moral judgment.
- pob_phrase: saying that he took the treaty very badly
  simplified_phrase: He said he was deeply displeased with the treaty
  preserved_meaning: The king expressed strong displeasure about the formal agreement.
  reasoning_layer_used: Lexical decision for φάσκων βαρέως φέρειν and συνθηκῶν
  rationale: The idiom is replaced with direct, natural English without weakening its emotional force.
- pob_phrase: ordering him to send Maccabeus to Antioch as a prisoner at once
  simplified_phrase: ordered Nikanor to send Maccabeus to Antioch as a prisoner at once
  preserved_meaning: The king commanded Nikanor to transfer Maccabeus in custody without delay.
  reasoning_layer_used: Lexical decisions for δέσμιον, ἐξαποστέλλειν, and ταχέως
  rationale: Naming Nikanor removes an unclear pronoun while preserving custody and urgency.
