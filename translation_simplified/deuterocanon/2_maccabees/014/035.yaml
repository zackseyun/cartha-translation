translation:
  language: en
  text: Lord, you need nothing from anyone. Yet you were pleased to have a temple arise among us[a] as your dwelling place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in us.” The temple context favors the communal sense, “among us.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: though needing nothing from anyone
  simplified_phrase: you need nothing from anyone. Yet
  preserved_meaning: God is self-sufficient but still chose to dwell among his people.
  reasoning_layer_used: POB theological decision on divine self-sufficiency
  rationale: Two sentences make the contrast clear without weakening it.
- pob_phrase: a temple of your dwelling to come into being
  simplified_phrase: to have a temple arise ... as your dwelling place
  preserved_meaning: The temple came into existence as the place of God's residing presence.
  reasoning_layer_used: POB lexical decisions for γενέσθαι and τῆς σῆς σκηνώσεως
  rationale: “Arise” avoids specifying construction while “dwelling place” explains the difficult genitive.
- pob_phrase: among us
  simplified_phrase: among us
  preserved_meaning: The temple stood in the midst of God's people rather than describing only inward experience.
  reasoning_layer_used: POB lexical and theological decisions for ἐν ἡμῖν
  rationale: The preferred communal reading remains in the text and the ambiguity remains in a footnote.
