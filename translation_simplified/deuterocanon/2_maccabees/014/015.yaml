translation:
  language: en
  text: When they heard that Nikanor was advancing and that the Gentiles were attacking, they threw dust on themselves and pleaded with the one who had established his people forever and who always comes to the aid of his own people—his allotted portion—with evident help.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “With evident help” may also mean “openly” or suggest a manifest divine appearance. “His allotted portion” means the people who belong to him as his inheritance.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Nikanor’s advance and the attack of the Gentiles
  simplified_phrase: Nikanor was advancing and the Gentiles were attacking
  preserved_meaning: The two distinct hostile actions remain separate.
  reasoning_layer_used: POB lexical decisions for ἔφοδον and ἐπίθεσιν
  rationale: Verbal clauses make the military danger easier to grasp.
- pob_phrase: they sprinkled dust upon themselves and implored
  simplified_phrase: they threw dust on themselves and pleaded
  preserved_meaning: They performed a distress gesture and urgently appealed to God.
  reasoning_layer_used: POB lexical decisions for καταπασάμενοι γῆν and ἐλιτάνευσαν
  rationale: Common verbs replace formal ritual and petition language.
- pob_phrase: always comes to the aid of his own portion with manifestation
  simplified_phrase: always comes to the aid of his own people—his allotted portion—with evident help
  preserved_meaning: God characteristically gives manifest help to the people who belong to him.
  reasoning_layer_used: POB lexical and theological decisions for μετʼ ἐπιφανείας and μερίδος
  rationale: The wording clarifies the covenant image without limiting manifestation to visibility alone.
interpretive_expansions:
- pob_phrase: his own portion
  rendering: his own people—his allotted portion
  claim: The portion is God’s people viewed as his allotted possession or inheritance.
  evidence:
  - The POB lexical rationale identifies covenantal overtones for God’s people as his possession.
  confidence: high
  alternatives_preserved:
  - his own inheritance
  - his own portion
- pob_phrase: with manifestation
  rendering: with evident help
  claim: God’s aid is manifest or evident rather than hidden.
  evidence:
  - The POB theological rationale describes aid accompanied by evident divine action.
  confidence: moderate
  alternatives_preserved:
  - openly
  - with manifest divine appearance
translation_notes:
  risk_flags:
  - risk: “With evident help” may not fully express the possibility of a divine appearance.
    mitigation: The footnote preserves that live interpretive possibility.
  - risk: “Threw dust on themselves” does not explain the ancient gesture.
    mitigation: Their pleading provides enough context to signal distress and supplication.
