translation:
  language: en
  text: Previously, when a case about keeping separate was being tried[a], he had faced an accusation concerning Judaism.[b] With complete devotion, he had risked both body and soul for Judaism.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek is compressed and may mean “when a case concerning separation or non-association was being tried.”
    reason: lexical_alternative
  - marker: b
    text: Here “Judaism” includes Jewish ancestral identity and practice, not merely religious belief.
    reason: cultural_note
