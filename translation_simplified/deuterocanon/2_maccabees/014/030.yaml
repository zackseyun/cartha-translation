translation:
  language: en
  text: But Maccabaeus noticed that Nicanor was acting more harshly toward him than usual. Realizing that this harshness was not for the best,[a] he gathered many of his men and kept himself hidden from Nicanor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may refer either to Nicanor’s motives or to the course he was taking.
    reason: lexical_alternative
