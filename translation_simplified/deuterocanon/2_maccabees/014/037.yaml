translation:
  language: en
  text: Razis was one of the community leaders in Jerusalem. Someone reported him to Nicanor.[a] He was devoted to his city and greatly respected. Because of his goodwill, people called him “the father of the Jews.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may imply that someone denounced Razis to Nicanor.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: A certain Razis, one of the elders from Jerusalem
  simplified_phrase: Razis was one of the community leaders in Jerusalem
  preserved_meaning: Razis held a recognized leadership role in the Jerusalem community.
  reasoning_layer_used: lexical decision for πρεσβυτέρων
  rationale: “Community leaders” makes the elders’ public role clear without treating them as merely old men.
- pob_phrase: was reported to Nicanor
  simplified_phrase: Someone reported him to Nicanor
  preserved_meaning: An unnamed person conveyed information about Razis to Nicanor.
  reasoning_layer_used: lexical decision for ἐμηνύθη
  rationale: The active sentence is easier to read while the footnote preserves the possible hostile sense.
- pob_phrase: a man devoted to his city and very highly regarded
  simplified_phrase: He was devoted to his city and greatly respected
  preserved_meaning: Razis cared deeply for his civic community and had an excellent reputation.
  reasoning_layer_used: lexical decisions for φιλοπολίτης and σφόδρα καλῶς ἀκούων
  rationale: Two direct descriptions replace the dense appositional clause without weakening its praise.
