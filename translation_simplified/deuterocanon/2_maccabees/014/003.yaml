translation:
  language: en
  text: But there was a man named Alcimus,[a] who had earlier become high priest. During the time of religious separation, he had willingly made himself unclean. He realized that there was no way for him to be safe and that he could no longer approach the holy altar,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “during the time of apostasy.” The Greek speaks literally of a time of “separation” or “non-mixing,” apparently referring to a period of religious impurity and estrangement.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a certain Alcimus, who had formerly become high priest
  simplified_phrase: there was a man named Alcimus, who had earlier become high priest
  preserved_meaning: Alcimus had previously attained the office of high priest.
  reasoning_layer_used: POB lexical decision for προγεγονὼς ἀρχιερεύς
  rationale: The rewrite uses ordinary narrative English while retaining the prior change of status.
- pob_phrase: had willingly defiled himself
  simplified_phrase: had willingly made himself unclean
  preserved_meaning: Alcimus intentionally incurred moral and ritual impurity that continued to affect him.
  reasoning_layer_used: POB lexical decision for ἑκουσίως and μεμολυσμένος
  rationale: “Made himself unclean” is clearer than “defiled himself” and still conveys intentional impurity.
- pob_phrase: in no way was there safety for him, nor any longer access to the holy altar
  simplified_phrase: there was no way for him to be safe and ... he could no longer approach the holy altar
  preserved_meaning: Alcimus saw no possible means of securing safety or approaching the altar again.
  reasoning_layer_used: POB lexical decisions for καθʼ ὁντιναοῦν τρόπον, σωτηρία, and πρόσοδος
  rationale: The two losses are recast as direct verbal clauses without merging them.
