  text: Nicanor realized that Judas’s boldness had outmaneuvered him. He went to the great and holy temple,[a] where the priests were offering the regular sacrifices. He ordered the priests to hand Judas over.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “the greatest and holy temple”; the superlative may be an exalted way of saying “the great and holy temple.”
    reason: lexical_alternative
