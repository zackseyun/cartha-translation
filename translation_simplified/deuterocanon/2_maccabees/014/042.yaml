simplification_decisions:
- pob_phrase: to fall into the hands of those criminals
  simplified_phrase: fall under the power of those criminals
  preserved_meaning: He would come under the criminals’ hostile control, however that happened.
  reasoning_layer_used: POB lexical decision for ὑποχείριος γενέσθαι
  rationale: This clear wording preserves hostile control without narrowing it to capture.
- pob_phrase: be outrageously treated
  simplified_phrase: suffer outrageous abuse
  preserved_meaning: He faced severe, humiliating mistreatment, not merely verbal insult.
  reasoning_layer_used: POB lexical decision and footnote for ὑβρισθῆναι
  rationale: “Abuse” is natural English, while “outrageous” retains the intensified force.
- pob_phrase: in a way unworthy of his own nobility
  simplified_phrase: unworthy of his own nobility
  preserved_meaning: The abuse would violate the honor of his noble status or character.
  reasoning_layer_used: POB lexical decisions for εὐγενείας and ἀναξίως
  rationale: The shorter form keeps both the possessive emphasis and the link between “nobly” and “nobility.”
translation_notes:
  risk_flags:
  - risk: “Fall under the power” makes the hostile-control sense explicit rather than preserving the source idiom.
    mitigation: The POB lexical rationale identifies becoming subject to another’s power as the idiom’s meaning.
  - risk: “Nobility” may suggest social rank more strongly than noble character.
    mitigation: The surrounding words “die nobly” and “unworthy” preserve the moral-honor sense as well.
