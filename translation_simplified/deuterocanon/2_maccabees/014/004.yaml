translation:
  language: en
  text: In the 151st year, he came to King Demetrius. He brought the king a gold crown, a palm branch, and the customary offerings of green branches from the temple.[a] He took no further action that day.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “the customary gifts, namely foliage from the temple.”
    reason: lexical_alternative
  - marker: b
    text: Literally, “he kept quiet”; this probably means that he did not yet press his accusations or stir up trouble.
    reason: lexical_alternative
