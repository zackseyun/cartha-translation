  text: But Alcimus saw the goodwill between Nicanor and Judas and learned about the agreements they had made. He went to Demetrius and accused Nicanor of working against the interests of the state. He said that Nicanor had appointed Judas—the man plotting against Demetrius’s kingdom—as successor.
