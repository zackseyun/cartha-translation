  text: He replied, “Among the Jews, those called Hasideans[a] are led by Judas Maccabaeus. They keep feeding war and stirring up rebellion, not allowing—”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This could also be translated “the so-called Hasideans,” with a more dismissive tone.
    reason: lexical_alternative
