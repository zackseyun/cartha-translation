translation:
  language: en
  text: He stretched out his right hand toward the temple and swore, “If you do not hand Judas over to me as a prisoner, I will turn this sanctuary of God into an open field. I will tear down the altar and build a magnificent temple to Dionysus here.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Stretching out his right hand toward the temple, he swore this
  simplified_phrase: He stretched out his right hand toward the temple and swore
  preserved_meaning: His physical oath gesture remains directly connected with his sworn threat.
  reasoning_layer_used: POB lexical decisions for προτείνας, τὴν δεξιὰν, and ὤμοσεν
  rationale: The participial opening becomes a direct clause in ordinary English.
- pob_phrase: make this sanctuary of God a plain
  simplified_phrase: turn this sanctuary of God into an open field
  preserved_meaning: He threatens to reduce God's sacred building to bare open ground.
  reasoning_layer_used: POB footnote and lexical decision for εἰς πεδίον ποιήσω
  rationale: “Open field” preserves the destruction image while avoiding the unclear noun “plain.”
- pob_phrase: raise up here a splendid temple to Dionysus
  simplified_phrase: build a magnificent temple to Dionysus here
  preserved_meaning: He threatens to construct an impressive pagan temple on this site.
  reasoning_layer_used: POB lexical decisions for ἱερόν, ἐπιφανές, and ἀναστήσω
  rationale: “Build” states the construction naturally, while “magnificent” retains the boastful force.
