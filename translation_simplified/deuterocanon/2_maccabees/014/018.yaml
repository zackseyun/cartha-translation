  text: Yet Nicanor heard that Judas and his men were brave and fought courageously for their homeland. After hearing this, he was reluctant to settle the conflict through bloodshed.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “decide the issue by blood” or “carry out judgment through bloodshed.”
    reason: lexical_alternative
