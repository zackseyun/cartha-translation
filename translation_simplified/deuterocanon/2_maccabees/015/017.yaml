translation:
  language: en
  text: Judas’s very noble words encouraged them. His words could stir them to virtue[a] and fill the young men’s hearts with manly courage. So they resolved not merely to go out on a military campaign, but to advance bravely, enter the battle with complete courage, and settle the matter. For the city, the sacred things, and the temple were also in danger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can also mean “excellence” or, in this military setting, “valor.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: having been encouraged by the very noble words of Judas, which were able to stir them on to virtue
  simplified_phrase: Judas’s very noble words encouraged them. His words could stir them to virtue
  preserved_meaning: Judas’s very noble speech strengthened them and urged them toward worthy action.
  reasoning_layer_used: POB lexical decisions for Παρακληθέντες, πάνυ καλοῖς, and ἀρετή
  rationale: Two direct sentences replace the long participial clause while retaining its force and intensifier.
- pob_phrase: to make the souls of young men manly
  simplified_phrase: fill the young men’s hearts with manly courage
  preserved_meaning: The speech gave the young men inward courage while retaining the Greek masculine imagery.
  reasoning_layer_used: POB theological decision on gendered martial language
  rationale: “Hearts” expresses the inner-person image naturally, while “manly courage” preserves the male-coded rhetoric.
- pob_phrase: not merely to make a campaign, but to press on bravely and, engaging with all courage, settle the matter
  simplified_phrase: not merely to go out on a military campaign, but to advance bravely, enter the battle with complete courage, and settle the matter
  preserved_meaning: They intended not simply to campaign but to fight courageously for a decisive outcome.
  reasoning_layer_used: POB lexical and theological decisions on μὴ στρατεύεσθαι and the following contrast
  rationale: Explicit military wording prevents readers from mistaking the negative phrase for a refusal to fight.
translation_notes:
  risk_flags:
