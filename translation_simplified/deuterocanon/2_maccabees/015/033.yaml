translation:
  language: en
  text: He cut out the tongue of the ungodly Nikanor. Then he said he would throw it to the birds piece by piece. He also said he would hang up the wages[a] of Nikanor’s folly across from the temple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the penalty he deserved for his folly.” The word translated “wages” means what someone receives in return for what they have done.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And after cutting out the tongue of the ungodly Nikanor
  simplified_phrase: He cut out the tongue of the ungodly Nikanor.
  preserved_meaning: The tongue was physically removed before the announced actions.
  reasoning_layer_used: Lexical decisions for γλῶσσαν and ἐκτεμών
  rationale: A separate sentence makes the sequence clear without weakening the violent physical image.
- pob_phrase: he said he would throw it piece by piece to the birds
  simplified_phrase: Then he said he would throw it to the birds piece by piece.
  preserved_meaning: He intended to give the removed tongue to birds in portions.
  reasoning_layer_used: Lexical decisions for ἔφη, μετὰ μέρος, and τοῖς ὄρνεσιν
  rationale: Ordinary clause order makes the intended action easier to follow.
- pob_phrase: and hang up the wages of his folly opposite the temple
  simplified_phrase: He also said he would hang up the wages of Nikanor’s folly across from the temple.
  preserved_meaning: He intended to display publicly the punitive return for Nikanor’s foolish deeds.
  reasoning_layer_used: Lexical decisions for τὰ ἐπίχειρα, τῆς ἀνοίας, κατέναντι, and κρεμιάσαι
  rationale: Repeating the subject and name removes ambiguity while retaining the audited “wages” metaphor.
