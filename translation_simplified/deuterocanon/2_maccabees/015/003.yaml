translation:
  language: en
  text: But that three-times-cursed man asked, “Is there a sovereign in heaven who commanded that the Sabbath day be kept?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Is the Sovereign in heaven—the one who commanded that the Sabbath day be kept?” The Greek can refer either to a sovereign in heaven or, more definitely, to Israel’s God.
    reason: alternative_reading
