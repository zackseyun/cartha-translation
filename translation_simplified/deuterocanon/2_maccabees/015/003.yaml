  simplified_phrase: three-times-cursed
  preserved_meaning: The wording retains both the threefold image and the forceful denunciation.
  reasoning_layer_used: Lexical decision for τρισαλιτήριος
  rationale: The expanded form is immediately understandable without weakening the insult.
- pob_phrase: asked whether there is in heaven
  simplified_phrase: asked, “Is there ... in heaven”
  preserved_meaning: The man poses the same hostile question about heavenly authority.
  reasoning_layer_used: Lexical decision for ἐπηρώτησεν and Greek clause structure
  rationale: Direct speech makes the question easier to follow.
- pob_phrase: commanded the keeping of the sabbath day
  simplified_phrase: commanded that the Sabbath day be kept
  preserved_meaning: The sovereign authoritatively required observance of the weekly Sabbath.
  reasoning_layer_used: Lexical decisions for προστατάξας, ἄγειν, and τὴν τῶν σαββάτων ἡμέραν
  rationale: A finite clause replaces the dense noun phrase while preserving command and observance.
