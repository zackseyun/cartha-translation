translation:
  language: en
  text: The thirteenth day of the twelfth month was to be observed as a special day. The month is called Adar in the Syrian language.[a] This date was one day before Mordecai’s day.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in the common language” or “in the local language”; the Greek expression is unusual and uncertain.
    reason: lexical_alternative
  - marker: b
    text: Mordecai’s day probably refers to the observance of Purim.
    reason: cross_reference
