translation:
  language: en
  text: He hung Nikanor’s severed head[a] from the citadel[b] for everyone to see. It was a clear sign of the Lord’s help.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Nikanor’s head”; the Greek can mean the front part or head, and the preceding account says that Nikanor was beheaded.
    reason: lexical_alternative
  - marker: b
    text: Or “fortress height”; the Greek refers to a fortified high place.
    reason: lexical_alternative
