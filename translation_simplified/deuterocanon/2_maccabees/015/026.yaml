  preserved_meaning: They entered combat with the opposing force.
  reasoning_layer_used: POB lexical decisions for συνῆψαν and τοῖς πολεμίοις
  rationale: This keeps the military force while making the adversarial relationship immediately clear.
- pob_phrase: with invocation and prayers
