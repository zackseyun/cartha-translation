translation:
  language: en
  text: But Judas and those with him went into battle against their enemies, calling on God and praying.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek does not name God in this clause, but the religious context indicates that they were calling on him.
    reason: simplification_note
  - marker: b
    text: The word translated “praying” can also mean “making vows.”
    reason: lexical_alternative
