translation:
  language: en
  text: When Maccabeus saw the large enemy force, its many kinds of weapons, and the fierce beasts[a] placed in strategic positions, he raised his hands toward heaven and called on the Lord who works wonders. He knew that weapons do not secure victory. Instead, the Lord grants victory to those who are worthy whenever he judges it right.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In this context, the beasts were probably war elephants, though the Greek says only “beasts.”
    reason: cultural_note
simplification_decisions:
- pob_phrase: the presence of the crowds
  simplified_phrase: the large enemy force
  preserved_meaning: Maccabeus saw the intimidating mass of opposing troops.
  reasoning_layer_used: lexical decisions and battlefield context
  rationale: This replaces an opaque phrase with its clear military sense.
- pob_phrase: the varied array of weapons, and the savagery of the beasts positioned advantageously
  simplified_phrase: its many kinds of weapons, and the fierce beasts placed in strategic positions
  preserved_meaning: The enemy had diverse weapons and dangerous animals deployed advantageously.
  reasoning_layer_used: lexical decisions
  rationale: Common military wording preserves both the beasts’ fierceness and tactical placement.
- pob_phrase: whenever it is judged right by him, he grants it
  simplified_phrase: the Lord grants victory ... whenever he judges it right
  preserved_meaning: Victory depends on the Lord’s sovereign judgment and gift.
  reasoning_layer_used: theological decision on divine agency
  rationale: The active wording makes the divine agent clear without changing his discretion.
interpretive_expansions:
- pob_phrase: the presence of the crowds
  rendering: the large enemy force
  claim: The assembled crowds are the opposing military force.
  evidence:
  - The immediate context describes their weapons, tactical deployment, and coming battle.
  - The POB lexical rationale says the phrase implies a massed opposing host.
  confidence: high
  alternatives_preserved:
  - the crowds
  - the multitudes
  - the forces
translation_notes:
  risk_flags:
  - risk: “Those who are worthy” could be read as teaching that victory is mechanically earned.
    mitigation: The wording keeps worthiness undefined and places the decision entirely with the Lord.
  - risk: “Weapons do not secure victory” could be taken as denying any role for human means.
    mitigation: The following sentence preserves the verse’s focus on the Lord’s decisive authority.
