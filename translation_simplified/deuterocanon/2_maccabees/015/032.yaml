translation:
  language: en
  text: After he displayed for all to see the head of the accursed Nikanor[a] and the hand of that blasphemer—the hand Nikanor had stretched out against the holy house of the Almighty, the temple, and had boasted about so arrogantly—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also mean “defiled” or “polluted”; it strongly condemns Nikanor for his sacrilege.
    reason: lexical_alternative
