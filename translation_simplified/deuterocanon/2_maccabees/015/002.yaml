translation:
  language: en
  text: But the Jews who had been forced to go with him said,[a] “Do not destroy them with such savage brutality. Instead, show respect for the day that the One who watches over all has specially honored as holy.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Do not kill them with such savage brutality.” The Greek verb can mean either kill or destroy.
    reason: lexical_alternative
