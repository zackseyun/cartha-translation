- pob_phrase: But he himself, after meeting with the elders, decided
  simplified_phrase: After meeting privately with the elders, he decided
  preserved_meaning: He made the decision after a private consultation with the elders.
  reasoning_layer_used: lexical decisions for καθʼ ἑαυτόν and σὺν τοῖς πρεσβυτέροις γενόμενος
  rationale: The reordered clause uses natural English while preserving the private consultation.
- pob_phrase: before the king’s army could invade Judea and gain control of the city
  simplified_phrase: before the king’s army could invade Judea and take control of the city
  preserved_meaning: They intended to act before the royal army occupied Judea’s city.
  reasoning_layer_used: lexical decisions for πρὶν εἰσβαλεῖν and γενέσθαι τῆς πόλεως ἐγκρατεῖς
  rationale: “Take control” is more direct than “gain control” without changing the military sense.
- pob_phrase: to go out and decide the matter with the help of God
  simplified_phrase: they should go out with God’s help and settle the matter
  preserved_meaning: The group planned to confront and resolve the crisis while depending on God.
  reasoning_layer_used: lexical and theological decisions for ἐξελόντας κρῖναι and τῇ τοῦ θεοῦ βοηθείᾳ
  rationale: The shorter order clearly preserves both collective action and dependence on God.
