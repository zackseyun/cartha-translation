translation:
  language: en
  text: Lysias came before the official court and presented the best defense he could.[a] He persuaded them, calmed them, and won their goodwill. Then he marched back to Antioch. This is how the king’s attack and withdrawal unfolded.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean that he presented an adequate defense or the best defense the circumstances allowed.
    reason: lexical_alternative
