translation:
  language: en
  text: He gave his men the battle cry[a], “God’s Victory.” Then, during the night, he and his finest armed young men attacked the royal court. He struck down about two thousand men in the camp and killed the leading elephant along with its rider.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek term can also mean a military watchword or signal.
    reason: lexical_alternative
  - marker: b
    text: The rider was probably in a tower or seat mounted on the elephant’s back.
    reason: cultural_note
