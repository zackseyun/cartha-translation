translation:
  language: en
  text: But the King of kings made Antiochus angry with the villain. Lysias told Antiochus that this man was responsible for the evils and for everything. So Antiochus ordered him to be taken to Beroea and put to death according to the custom there.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: stirred up Antiochus’s anger against the wretch
  simplified_phrase: made Antiochus angry with the villain
  preserved_meaning: God caused Antiochus’s hostile anger to rise against a man strongly condemned by the narrator.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The direct wording clarifies the cause while “villain” retains strong moral condemnation.
- pob_phrase: when Lysias pointed him out as being responsible
  simplified_phrase: Lysias told Antiochus that this man was responsible
  preserved_meaning: Lysias identified the condemned man to Antiochus as the one to blame.
  reasoning_layer_used: POB lexical decision for ὑποδείξαντος and narrative context
  rationale: A direct reporting clause is easier to follow than the participial construction.
- pob_phrase: he ordered them to put him to death, taking him to Beroea, as is the custom in that place
  simplified_phrase: Antiochus ordered him to be taken to Beroea and put to death according to the custom there
  preserved_meaning: Antiochus commanded that the man be brought to Beroea and executed under local practice.
  reasoning_layer_used: POB lexical decisions and cultural note
  rationale: Naming Antiochus removes unclear pronouns and presents the sequence in ordinary English.
interpretive_expansions:
- pob_phrase: when Lysias pointed him out
  rendering: Lysias told Antiochus
  claim: Lysias presented the accusation to Antiochus.
  evidence:
  - Antiochus responds to the accusation by issuing the execution order.
  - The POB identifies the setting as judicial.
  confidence: high
  alternatives_preserved:
