simplification_decisions:
- pob_phrase: be deprived of the law and fatherland and holy temple
  simplified_phrase: be robbed of the Law, their ancestral homeland, and the holy temple
  preserved_meaning: They faced being forcibly stripped of their covenantal law, ancestral country, and sacred temple.
  reasoning_layer_used: POB lexical decisions for στερεῖσθαι, νόμου, πατρίδος, and ἱεροῦ ἁγίου
  rationale: “Robbed of” makes the force of the loss clear, while “ancestral homeland” conveys the familial-national sense of “fatherland.”
- pob_phrase: who had just now recovered a little
  simplified_phrase: who had recovered only a little and only recently
  preserved_meaning: The people's relief was both limited and recent.
  reasoning_layer_used: POB lexical decision for ἄρτι βραχέως ἀνεψυγμένα
  rationale: The reordered phrase states the two limits naturally without weakening either one.
- pob_phrase: to become subject to the reviling nations
  simplified_phrase: fall under the power of the reviling nations
  preserved_meaning: The people were in danger of coming under those nations’ control.
  reasoning_layer_used: POB lexical decisions for ὑποχειρίους γενέσθαι and δυσφήμοις ἔθνεσιν
  rationale: “Fall under the power” expresses subjugation more directly while retaining the verbal-abusive description.
