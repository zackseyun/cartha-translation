translation:
  language: en
  text: '[They were] about to be robbed of the Law, their ancestral homeland, and the holy temple. [He urged them] not to let the people, who had recovered only a little and only recently, fall under the power of the reviling nations.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “nations that spoke abusively or profanely.”
