translation:
  language: en
  text: Judas entrusted the outcome to the Lord of the world[a]. He urged the men with him to fight bravely, even to death, to defend the laws, the temple, the city, their homeland, and their commonwealth—their shared civic order[b]. Then he encamped near Modein.
