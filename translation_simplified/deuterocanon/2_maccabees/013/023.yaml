translation:
  language: en
  text: He attacked Judas and his men, but was defeated. In desperation, he took action against Philip in Antioch, who had been left in charge of the government.[a] Thrown into confusion, he appealed to the Jews, yielded, and swore to accept all the fair terms.[b] He was reconciled, offered a sacrifice, honored the sanctuary and the place, and showed kindness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek is compressed here, so the exact nature of his action against Philip is uncertain.
    reason: source_note
  - marker: b
    text: Or “swore to do everything that was just.”
    reason: lexical_alternative
