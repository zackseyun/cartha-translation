translation:
  language: en
  text: He let Menelaus go, even though Menelaus was responsible for all the evil. But he sentenced those wretched men to death. If they had presented their case even before the Scythians,[a] they would have been found innocent and set free.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Scythians were stereotyped as harsh; the point is that even they would have judged these men innocent.
    reason: cultural_note
