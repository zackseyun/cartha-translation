  simplified_phrase: the hostility grew so severe
  preserved_meaning: The conflict escalated to an extreme point.
  reasoning_layer_used: Lexical decision for ἐπὶ τοσοῦτον προβαινούσης
  rationale: This states the escalation naturally while preserving its severity.
- pob_phrase: one of those approved by Simon
  simplified_phrase: someone Simon had approved
  preserved_meaning: The unidentified person belonged to Simon’s vetted circle.
  reasoning_layer_used: Lexical decisions for διὰ τινος and τῶν ὑπὸ τοῦ Σίμωνος δεδοκιμασμένων
