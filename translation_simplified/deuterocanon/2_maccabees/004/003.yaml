translation:
  language: en
  text: But the hostility grew so severe that even murders were being committed through someone Simon had approved.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “committed by someone Simon had approved.” The Greek does not identify the person and emphasizes that he was one of those Simon had approved.
    reason: lexical_alternative
