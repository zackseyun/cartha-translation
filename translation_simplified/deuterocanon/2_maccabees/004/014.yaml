translation:
  language: en
  text: As a result, the priests were no longer eager to carry out their duties at the altar. They treated the temple with contempt and neglected the sacrifices. When the call came for the discus throw, they rushed to take part in the unlawful provision at the wrestling school.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek expression is difficult. It may refer to an unlawful provision, financial support, an allowance, or sponsorship connected with the athletic activities.
    reason: lexical_alternative
