  preserved_meaning: The crowd recognized Lysimachus’s violent action without specifying when it began.
  reasoning_layer_used: POB lexical decisions for συνειδότες and ἐπίθεσιν
  rationale: The possessive form is natural English and avoids adding an unsupported time frame.
- pob_phrase: some snatched up stones, others thick pieces of wood, and some, grabbing handfuls of the ashes lying nearby
  simplified_phrase: some quickly grabbed stones, others thick pieces of wood, and still others handfuls of ashes from nearby
  preserved_meaning: Different people urgently seized stones, heavy wood, and nearby ashes by the handful.
  reasoning_layer_used: POB lexical decisions for συναρπάσαντες, ξύλων πάχη, σποδοῦ, and δραξόμενοι
