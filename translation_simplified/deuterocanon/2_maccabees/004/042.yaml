translation:
  language: en
  text: But when they became aware of Lysimachus’s attack, some quickly grabbed stones, others thick pieces of wood, and still others handfuls of ashes from nearby. They hurled all these things together at the people around Lysimachus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “those around Lysimachus,” probably meaning the men or supporters with him.
    reason: lexical_alternative
