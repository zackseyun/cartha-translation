translation:
  language: en
  text: After Apollonius son of Menestheus had been sent to Egypt for the celebrations marking the beginning of King Philometor’s reign, Antiochus learned that he himself had become cut off from his own political affairs.[a] So he made plans to protect himself. After arriving at Joppa, he continued to Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek is compressed and may mean more broadly that Antiochus was at a political disadvantage in matters concerning him.
    reason: lexical_alternative
