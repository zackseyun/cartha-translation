translation:
  language: en
  text: But Simon, mentioned earlier, had informed others about the temple funds and betrayed the homeland. He kept slandering Onias, claiming that Onias had incited Heliodorus and caused the troubles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “caused the evils.” The Greek can refer broadly to harmful events, not only to moral evil.
    reason: lexical_alternative
