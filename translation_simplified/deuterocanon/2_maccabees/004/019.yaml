  text: Jason, that vile man, sent Antiochians from Jerusalem as official representatives.[a] They carried three hundred silver coins[b] for a sacrifice to Heracles. But the men carrying the money asked that it not be used for sacrifice.
  philosophy: optimal-equivalence
  footnotes:
