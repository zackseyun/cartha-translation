translation:
  language: en
  text: Besides this, he promised to have another fifty talents[c] officially entered in addition to the hundred, if he was given official permission to set up a Greek civic and athletic training center and a program for enrolling young men under his own administration,[b] and to enroll the people of Jerusalem as Antiochenes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may mean registering Jerusalem’s people as citizens of Antioch, but their exact legal status is uncertain.
    reason: alternative_reading
  - marker: b
    text: The Greek calls the training center a “gymnasium”; it and the youth program were institutions of Greek civic culture.
    reason: cultural_note
  - marker: c
    text: A talent was a large ancient unit used to reckon money.
    reason: cultural_note
simplification_decisions:
