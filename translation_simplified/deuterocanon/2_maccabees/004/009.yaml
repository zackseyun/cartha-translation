  simplified_phrase: to have another fifty talents officially entered in addition to the hundred
  preserved_meaning: The additional sum was entered as an administrative financial commitment.
  reasoning_layer_used: POB lexical decision for διαγράφειν
  rationale: “Officially entered” makes the bureaucratic sense clearer without changing it to immediate payment.
- pob_phrase: if he were granted authority to establish for himself
  simplified_phrase: if he was given official permission to set up ... under his own administration
  preserved_meaning: Jason sought royal authorization to organize the institutions himself.
  reasoning_layer_used: POB lexical decisions for ἐπιχορηγηθῇ, ἐξουσίας, and αὐτῷ συστήσασθαι
  rationale: The revision replaces formal phrasing with ordinary political and administrative language.
- pob_phrase: a gymnasium and an enrollment of young men
  simplified_phrase: a Greek civic and athletic training center and a program for enrolling young men
  preserved_meaning: The two related Greek institutions remain distinct and involve organized youth training.
  reasoning_layer_used: POB lexical rationale and cultural footnote
  rationale: The historical institution is explained directly while its Greek name remains in a note.
