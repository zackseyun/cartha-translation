translation:
  language: en
  text: They were outraged and deeply grieved by the man's unjust murder. When the king returned from Cilicia, the Jews living in the city appealed to him. The Greeks also joined them, sharing their hatred of the wicked deed.[a]
  philosophy: optimal-equivalence
  footnotes:
