  text: So Ptolemy took the king aside and moved him to an area lined with columns, as though to help him recover.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek can also mean “refresh him” or “give him relief.”
    reason: lexical_alternative
  - marker: b
    text: Greek leaves the person Ptolemy took aside unstated; the context indicates that it was the king.
    reason: alternative_reading
