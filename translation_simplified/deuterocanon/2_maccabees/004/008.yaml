translation:
  language: en
  text: Jason, the brother of Onias, undermined the office of high priest. He did this by promising the king, in a formal petition,[a] 360 talents of silver, plus another 80 talents from a different source of income.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean that Jason made this promise during a personal audience with the king.
    reason: lexical_alternative
  - marker: b
    text: A talent was a large unit of weight and, in monetary contexts, a way of stating a large amount of value.
    reason: cultural_note
simplification_decisions:
- pob_phrase: the high priesthood
  simplified_phrase: the office of high priest
  preserved_meaning: This refers to the sacred office, not merely to priestly work.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The clearer phrase retains both the office and the moral force of Jason's attack on it.
- pob_phrase: undermined the high priesthood, promising the king
  simplified_phrase: undermined the office of high priest. He did this by promising the king
  preserved_meaning: Jason's promised payment was the means by which he undermined the office.
  reasoning_layer_used: POB lexical decision for ὑπενόθευσεν and ἐπαγγειλάμενος
  rationale: Two sentences make the action and its means easier to follow.
- pob_phrase: eighty talents from some other revenue
  simplified_phrase: another 80 talents from a different source of income
  preserved_meaning: The additional amount was to come from a separate revenue stream.
  reasoning_layer_used: POB lexical decision for προσόδου τινὸς ἄλλης
  rationale: Common financial wording replaces the less familiar term “revenue.”
translation_notes:
  risk_flags:
  - risk: Readers may assume that “petition” is the only possible meaning of the Greek term.
    mitigation: Footnote a preserves the possible meaning of a personal audience with the king.
  - risk: Readers may misunderstand a talent as a coin or assume both amounts were explicitly silver.
    mitigation: Footnote b defines the unit without assigning a metal to the additional revenue.
