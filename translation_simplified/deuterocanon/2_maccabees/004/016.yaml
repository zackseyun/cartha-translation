  simplified_phrase: severe trouble closed in around them
  preserved_meaning: Their distress was severe and pictured as enclosing them.
  reasoning_layer_used: Lexical decisions for περιεῖχεν and χαλεπὴ περίστασις.
  rationale: Common wording preserves the image of trouble surrounding them.
- pob_phrase: whose ways they envied and whom they wanted to imitate
  simplified_phrase: whose way of life they envied—the people they wanted to become like
  preserved_meaning: They coveted the people's lifestyle and wanted to become like the people themselves.
  reasoning_layer_used: Lexical decisions for ἐζήλουν, τὰς ἀγωγάς, and ἐξομοιοῦσθαι.
  rationale: The recast clarifies both ideas without merging their distinct objects.
- pob_phrase: became their enemies and punishers
  simplified_phrase: became their enemies and the ones who punished them
  preserved_meaning: Those they admired became hostile agents of punishment.
  reasoning_layer_used: Lexical decisions for πολεμίους, τιμωρητάς, and ἔσχον, with the theological decision on ironic retribution.
  rationale: The wording avoids the uncommon noun “punishers” while retaining the ironic consequence.
