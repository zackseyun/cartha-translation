translation:
  language: en
  text: Because of this[a], severe trouble closed in around them. The very people whose way of life they envied—the people they wanted to become like—became their enemies and the ones who punished them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Because of those people”; the Greek can point to the people just mentioned as the cause of the trouble.
    reason: lexical_alternative
