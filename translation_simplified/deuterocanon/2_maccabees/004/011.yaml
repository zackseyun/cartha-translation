translation:
  language: en
  text: He set aside the favorable royal provisions established for the Jews through John, the father of Eupolemus—the one who had carried out an official mission to the Romans concerning friendship and alliance. While he was abolishing the Jews’ lawful civic order[a], he introduced customs that violated the law.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This refers broadly to the Jews’ established civic constitution, institutions, or public order.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the royal provisions laid down for the Jews through John
  simplified_phrase: the favorable royal provisions established for the Jews through John
  preserved_meaning: The king had established beneficial measures for the Jews through John.
  reasoning_layer_used: Greek lexical decisions for τὰ κείμενα and φιλάνθρωπα βασιλικά
  rationale: “Established” clarifies “laid down,” and “favorable” preserves the measures’ benevolent force.
- pob_phrase: the one who had carried out the embassy to the Romans
  simplified_phrase: the one who had carried out an official mission to the Romans
  preserved_meaning: The unnamed person undertook a formal diplomatic mission to Rome.
  reasoning_layer_used: Greek lexical decision for πρεσβείαν
  rationale: “Official mission” makes the diplomatic sense of “embassy” immediately clear.
- pob_phrase: while abolishing the lawful institutions, he introduced unlawful customs
  simplified_phrase: While he was abolishing the Jews’ lawful civic order, he introduced customs that violated the law
  preserved_meaning: He brought in prohibited customs as he dismantled the lawful Jewish public order.
  reasoning_layer_used: Lexical and theological decisions for πολιτείας, καταλύων, and παρανόμους ἔθισμους
  rationale: “Civic order” preserves the broad public sense, while “while” retains the concurrent contrast.
