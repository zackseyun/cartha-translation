translation:
  language: en
  text: Burning with anger, he immediately stripped off Andronikos’s purple robe and tore off his other clothes. He then led Andronikos through the whole city to the very place where he had committed his godless crime against Onias. There he struck down and killed the murderer.[a] In this way, the Lord gave him the punishment he deserved.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek calls him a blood-guilty killer and uses a vivid verb that may suggest killing with a spear.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: inflamed with anger
  simplified_phrase: Burning with anger
  preserved_meaning: His intense anger is still pictured as fire.
  reasoning_layer_used: Lexical decision for πυρωθεὶς τοῖς θυμοῖς
  rationale: The common phrase keeps the source-language fire image.
- pob_phrase: where he had committed his impiety against Onias
  simplified_phrase: where he had committed his godless crime against Onias
  preserved_meaning: His act against Onias was both criminal and offensive to God.
  reasoning_layer_used: Lexical decision for ἠσέβησεν
  rationale: “Godless crime” makes the religious and moral force immediately clear.
- pob_phrase: there he dispatched the murderer
  simplified_phrase: There he struck down and killed the murderer
  preserved_meaning: Andronikos was violently executed at that location.
  reasoning_layer_used: Lexical decision for ἀπεκόντισεν and revision rationale
  rationale: The wording states the outcome clearly while retaining the verb’s vivid force.
translation_notes:
