translation:
  language: en
  text: So Menelaus spoke to Andronicus in private and urged him to arrange Onias’s death by treachery.[a] Andronicus went to Onias and deceived him into trusting him. He swore oaths and gave Onias his right hand as a pledge. Although Andronicus was under suspicion, he persuaded Onias to leave his protected place of refuge. Then he immediately shut Onias away,[b] showing no respect for justice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek wording is difficult, but the context indicates that Menelaus urged Andronicus to arrange Onias’s death.
    reason: textual_variant
  - marker: b
    text: The context may mean that Andronicus murdered Onias or had him put to death, though the Greek verb is less explicit.
    reason: alternative_reading
