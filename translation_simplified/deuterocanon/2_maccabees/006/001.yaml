translation:
  language: en
  text: Not long afterward, the king sent an elderly Athenian to force the Jews to abandon the laws of their fathers[a] and stop living by the laws of God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, the laws handed down by their forefathers.
    reason: simplification_note
simplification_decisions:
- pob_phrase: after not much time
  simplified_phrase: Not long afterward
  preserved_meaning: Only a short time passed before the king acted.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: The smoother English alternative keeps the Greek expression's temporal brevity.
- pob_phrase: to compel the Jews to depart from
  simplified_phrase: to force the Jews to abandon
  preserved_meaning: The king's agent was sent to coerce the Jews into leaving their inherited laws.
  reasoning_layer_used: POB lexical decisions for ἀναγκάζειν and μεταβαίνειν ἀπό
  rationale: Common verbs make both the coercion and the demanded rejection immediately clear.
- pob_phrase: and not to live by the laws of God
  simplified_phrase: and stop living by the laws of God
  preserved_meaning: The Jews were being forced to cease ordering their lives according to God's laws.
  reasoning_layer_used: POB theological decision for πολιτεύεσθαι
  rationale: “Stop living by” naturally expresses the required change in conduct without narrowing it to politics.
translation_notes:
  risk_flags:
  - risk: “The laws of their fathers” may be mistaken for rules made by their immediate fathers.
    mitigation: The footnote explains that the phrase refers to laws inherited from their forefathers.
