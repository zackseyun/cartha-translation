- pob_phrase: after spitting it out
  simplified_phrase: he spat it out
  preserved_meaning: Eleazar expelled the forbidden food from his mouth.
  reasoning_layer_used: Lexical decision for προπτύσας and immediate narrative context.
  rationale: A direct sentence makes the physical action immediately clear.
- pob_phrase: he came forward in the manner required for those who choose to resist
  simplified_phrase: he came forward, as is required of those who choose to stand firm and resist
  preserved_meaning: He willingly faced the ordeal with the steadfast resistance the situation required.
  reasoning_layer_used: Lexical decisions for καθʼ ὃν ἔδει τρόπον, προσέρχεσθαι, ὑπομένω, and ἀμύνασθαι.
  rationale: The direct construction preserves both steadfast endurance and active resistance.
- pob_phrase: even for the sake of one’s attachment to life
  simplified_phrase: despite their natural desire to stay alive
  preserved_meaning: The strong human attachment to continued life did not justify an unlawful act.
  reasoning_layer_used: Lexical rationale for διὰ τὴν πρὸς ζῆν φιλοστοργίαν.
  rationale: Common wording retains the emotional attachment and desire for continued life.
