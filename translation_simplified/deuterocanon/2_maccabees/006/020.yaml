translation:
  language: en
  text: But he spat it out. Then he came forward, as is required of those who choose to stand firm and resist tasting what is unlawful, despite their natural desire to stay alive.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult Greek phrase may also mean “those who endure while resisting.”
    reason: lexical_alternative
