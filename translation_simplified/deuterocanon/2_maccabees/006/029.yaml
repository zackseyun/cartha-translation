translation:
  language: en
  text: The men escorting him had treated him kindly only a short time before. But because of what he had just said, they turned against him, thinking that his words were madness.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “folly,” “senselessness,” or “desperation.” This was the escorts’ judgment, not necessarily the narrator’s.
    reason: lexical_alternative
