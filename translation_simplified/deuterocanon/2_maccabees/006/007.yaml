  simplified_phrase: they were harshly forced to attend
  preserved_meaning: They were repeatedly compelled to go, and the coercion was grievous.
  reasoning_layer_used: Lexical decisions for ἤγον and μετὰ πικρᾶς ἀνάγκης
  rationale: “Harshly forced” clearly retains both the coercion and its bitter severity.
- pob_phrase: the king’s monthly birthday observance
  simplified_phrase: Every month ... the king’s birthday observance
  preserved_meaning: The royal birthday rite occurred monthly.
  reasoning_layer_used: Lexical decision for κατὰ μῆνα and γενέθλιον ἡμέραν
  rationale: Placing the schedule first makes the unusual monthly recurrence easy to understand.
- pob_phrase: to join the procession in honor of Dionysus
  simplified_phrase: march in a procession honoring Dionysus
  preserved_meaning: They had to participate in a religious procession dedicated to Dionysus.
  reasoning_layer_used: Lexical decisions for πομπεύειν and τῷ Διονύσῳ
  rationale: The concrete verb “march” clearly depicts their participation and its religious purpose.
