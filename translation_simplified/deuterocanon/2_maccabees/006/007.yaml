translation:
  language: en
  text: Every month, they were harshly forced to attend the king’s birthday observance and made to eat the sacrificial meal.[a] When a festival of Dionysus was held, they were forced to wear ivy wreaths[b] and march in a procession honoring Dionysus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “to eat the sacrificial entrails or portions,” as part of the pagan rite.
    reason: lexical_alternative
  - marker: b
    text: Ivy wreaths were associated with the worship of Dionysus.
    reason: cultural_note
