translation:
  language: en
  text: But as he was close to death under the blows, he groaned and said, “The Lord, who has holy knowledge, knows that I could have escaped death. Yet as I am whipped, I endure cruel pain in my body; but in my soul I gladly suffer these things because I fear him.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “because I revere him.” The Greek word for “fear” can include reverent fear toward God.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: as he was about to die under the blows
  simplified_phrase: as he was close to death under the blows
  preserved_meaning: He was nearing death amid the beating without specifying the blows as its direct cause.
  reasoning_layer_used: Lexical decisions for μέλλων ... τελευτᾷν and ταῖς πληγαῖς
  rationale: “Close to death” is immediate and natural while “under the blows” preserves the POB’s caution.
- pob_phrase: though I could have been released from death
  simplified_phrase: I could have escaped death
  preserved_meaning: He had the opportunity to avoid death.
  reasoning_layer_used: Lexical decision and POB footnote for δυνάμενος ἀπολυθῆναι τοῦ θανάτου
  rationale: “Escaped death” expresses the same idea in ordinary English.
- pob_phrase: while being scourged
  simplified_phrase: as I am whipped
  preserved_meaning: He was enduring bodily pain during a severe beating.
  reasoning_layer_used: Lexical decision for μαστιγούμενος
  rationale: “Whipped” is more familiar than “scourged” while retaining the action.
translation_notes:
