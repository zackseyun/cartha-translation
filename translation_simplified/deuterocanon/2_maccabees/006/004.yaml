translation:
  language: en
  text: The Gentiles filled the sanctuary with immoral excess and wild partying. They shamelessly caroused with prostitutes, approached women in the sacred areas,[a] and even brought inside things that should not have been there.
  philosophy: optimal-equivalence
  footnotes:
