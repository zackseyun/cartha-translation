translation:
  language: en
  text: The men assigned to oversee the unlawful meal had known him for many years and felt compassion for him. They took him aside and urged him to bring meat that was lawful for him to eat and that he had prepared himself. Then he could pretend he was eating the meats from the sacrifice that the king had ordered him to eat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: These meats came from pagan sacrificial offerings.
    reason: cultural_note
simplification_decisions:
- pob_phrase: those who had been appointed over the unlawful meal
  simplified_phrase: The men assigned to oversee the unlawful meal
  preserved_meaning: They had been officially placed in charge of the forbidden meal.
  reasoning_layer_used: Lexical and theological decisions on οἱ ... τεταγμένοι and πρὸς τὰ παράνομα.
  rationale: “Assigned to oversee” states their role naturally while retaining the distinct image of the unlawful meal.
- pob_phrase: because of their long-standing acquaintance with the man
  simplified_phrase: had known him for many years and felt compassion for him
  preserved_meaning: Their long acquaintance with him moved them to pity.
  reasoning_layer_used: Lexical decision and POB footnote on σπλαγχνισμοῦ and long acquaintance.
  rationale: The wording clearly expresses both their long relationship and the compassion present in the Greek.
- pob_phrase: meat that it was proper for him to use, prepared by himself
  simplified_phrase: meat that was lawful for him to eat and that he had prepared himself
  preserved_meaning: He could bring acceptable meat prepared under his own control.
  reasoning_layer_used: Lexical decisions on καθῆκον, χρᾶσθαι, and διʼ αὐτοῦ παρασκευασθέντα.
  rationale: “Lawful” avoids implying royal permission, while the food context supports “eat.”
