- pob_phrase: while disciplining with calamity
  simplified_phrase: Even when he uses disaster to discipline us
  preserved_meaning: God uses severe suffering as corrective discipline rather than as abandonment.
  reasoning_layer_used: The lexical and theological decisions identify the calamity as the means of divine corrective discipline.
  rationale: The active clause makes the relationship between the disaster and the discipline immediately clear.
- pob_phrase: he does not abandon his own people
  simplified_phrase: he does not abandon his own people
  preserved_meaning: God does not desert the people who belong especially to him.
  reasoning_layer_used: The lexical decision retains both the covenantal sense of “abandon” and the possessive emphasis of “his own.”
