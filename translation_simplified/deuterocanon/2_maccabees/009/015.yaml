translation:
  language: en
  text: He had decided that the Jews were not even worthy of burial. He planned to throw them out with their infants, leaving them to be eaten by birds and wild animals. But now he would make all the Jews equal to the Athenians.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This likely means that he would give the Jews the same civic privileges or legal standing as the Athenians.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: whom he had determined not even to count worthy of burial
  simplified_phrase: He had decided that the Jews were not even worthy of burial.
  preserved_meaning: Antiochus had made a settled judgment that the Jews did not deserve burial.
  reasoning_layer_used: Lexical decision for διέγνωκε and μηδὲ ταφῆς ἀξιῶσαι
  rationale: A direct sentence makes both his prior resolve and his contempt immediately clear.
- pob_phrase: to cast out with their infants for the birds to devour and for the wild beasts
  simplified_phrase: He planned to throw them out with their infants, leaving them to be eaten by birds and wild animals.
  preserved_meaning: He intended to deny them burial and expose them and their infants as food for birds and beasts.
  reasoning_layer_used: Lexical decisions for οἰωνοβρώτους, σὺν τοῖς νηπίοις, ἐκρίψαι, and θηρίοις
  rationale: The recast clause preserves the violent exposure image in ordinary English.
- pob_phrase: he would make them all equal to the Athenians
  simplified_phrase: But now he would make all the Jews equal to the Athenians.
  preserved_meaning: He reversed course and proposed to raise every Jew to equality with the Athenians.
  reasoning_layer_used: Lexical and theological decision for πάντας αὐτοὺς ἴσους Ἀθηναίοις ποιήσειν
  rationale: The wording keeps the deliberate civic comparison without defining its exact legal form.
