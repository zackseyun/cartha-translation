translation:
  language: en
  text: But the all-seeing Lord, the God of Israel, struck him with an unseen blow for which there was no cure.[a] As soon as he finished speaking, unrelenting pain seized his inner organs, along with bitter torments deep inside.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean an incurable, invisible plague or stroke.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: an incurable and unseen blow
  simplified_phrase: an unseen blow for which there was no cure
  preserved_meaning: God's judgment remains an unseen strike that cannot be cured.
  reasoning_layer_used: POB lexical decisions for ἀνιάτῳ, ἀοράτῳ, and πληγῇ
  rationale: The wording explains “incurable” naturally while preserving the image of a blow.
- pob_phrase: just as he finished speaking
  simplified_phrase: as soon as he finished speaking
  preserved_meaning: The affliction began immediately when his speech ended.
  reasoning_layer_used: POB lexical decisions for ἄρτι and καταλήξαντος τὸν λόγον
  rationale: “As soon as” makes the immediate timing clearer in ordinary English.
- pob_phrase: an unrelenting pain in his bowels seized him, with bitter torments in his inner parts
  simplified_phrase: unrelenting pain seized his inner organs, along with bitter torments deep inside
  preserved_meaning: Severe pain and multiple torments suddenly overtook him within his body.
  reasoning_layer_used: POB lexical decisions for ἔλαβεν αὐτόν, ἀνήκεστος, σπλάγχνα, and βάσανοι
  rationale: “Inner organs” avoids narrowing the anatomy, while the plural “torments” preserves the distinct sufferings.
translation_notes:
  risk_flags:
  - risk: “Blow” may suggest only a visible physical strike.
    mitigation: The main text calls it unseen, and the footnote preserves the plague or stroke senses.
  - risk: “Inner organs” is less visceral than “bowels” or “entrails.”
    mitigation: It retains the bodily location in clear modern English, reinforced by “deep inside.”
