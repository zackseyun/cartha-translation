translation:
  language: en
  text: For Antiochus had entered the city called Persepolis. He tried to rob the temple and seize control of the city. But when the crowds took up weapons, the attack was turned back. Defeated by the local people, Antiochus retreated in disgrace.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the so-called Persepolis
  simplified_phrase: the city called Persepolis
  preserved_meaning: Persepolis is identified by name without suggesting doubt.
  reasoning_layer_used: POB lexical decision for τὴν λεγομένην Περσέπολιν
  rationale: This listed alternative is clearer in common English.
- pob_phrase: when the crowds rushed to arms, they turned him back
  simplified_phrase: when the crowds took up weapons, the attack was turned back
  preserved_meaning: The people resorted to armed defense, and the attempted assault failed.
  reasoning_layer_used: Greek syntax, POB lexical decisions, and grounding review
  rationale: The passive wording preserves the military reversal without overidentifying its grammatical subject.
- pob_phrase: put to flight by the local inhabitants, made a shameful retreat
  simplified_phrase: Defeated by the local people, Antiochus retreated in disgrace
  preserved_meaning: The people of the place routed Antiochus, and his withdrawal was humiliating.
  reasoning_layer_used: POB lexical decisions for τροπωθέντα, τῶν ἐγχωρίων, and αἰσχύμονα τὴν ἀναζυγὴν
  rationale: Natural English retains both his defeat and the shame of his retreat.
translation_notes:
  risk_flags:
  - risk: “The attack was turned back” supplies “the attack” for an unstated plural subject in the difficult Greek clause.
    mitigation: This keeps the reversal clear while avoiding the stronger claim that the crowds directly drove Antiochus back.
