translation:
  language: en
  text: But he did not give up his arrogance. Instead, he became even prouder. Breathing fire in his rage against the Jews, he ordered the journey to be hurried.[a] As his chariot sped along, he fell from it. The hard fall wrenched all his limbs out of joint.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can refer to pressing on with a journey or a march.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: in no way ceased from his arrogance; rather, he was filled even more with pride
  simplified_phrase: did not give up his arrogance. Instead, he became even prouder
  preserved_meaning: He remained arrogant and grew still prouder.
  reasoning_layer_used: Lexical and theological decisions on the two pride terms
  rationale: Two short sentences preserve both distinct terms and the escalation.
- pob_phrase: ordering the journey to be hastened
  simplified_phrase: ordered the journey to be hurried
  preserved_meaning: He commanded that the journey proceed faster.
  reasoning_layer_used: Lexical decision for κελεύων ἐποξύνειν τὴν πορίαν
  rationale: The simpler passive wording avoids naming recipients absent from the Greek.
- pob_phrase: the chariot as it was rushing along, and in the hard fall all the limbs of his body were wrenched out of joint
  simplified_phrase: As his chariot sped along, he fell from it. The hard fall wrenched all his limbs out of joint.
  preserved_meaning: He fell from the fast-moving chariot and every limb was violently injured.
  reasoning_layer_used: Lexical decisions for ῥοίζῳ, δυσχερεῖ πτώματι, and ἀποσφύζειν
  rationale: Splitting the event and result clarifies the sequence without weakening the injury.
