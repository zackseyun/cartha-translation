translation:
  language: en
  text: Moreover, I have considered the nearby rulers and the rulers along the kingdom’s borders. They are watching for opportunities and waiting to see what will happen. So I have appointed my son Antiochus as king. When I repeatedly traveled to the upper provinces,[a] I placed him in the care of most of you and recommended him to most of you. I have also written to him what follows.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “upper satrapies,” a Persian term for administrative regions, probably the inland or eastern provinces.
    reason: cultural_note
