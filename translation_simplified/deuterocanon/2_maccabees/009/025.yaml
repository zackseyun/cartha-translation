- pob_phrase: considering the rulers nearby and those bordering the kingdom, who are watching for opportunities and awaiting what will happen
  simplified_phrase: I have considered the nearby rulers and the rulers along the kingdom’s borders. They are watching for opportunities and waiting to see what will happen.
  preserved_meaning: The king weighs the threat posed by two overlapping descriptions of surrounding rulers.
  reasoning_layer_used: POB lexical decisions for κατανοῶν and the geopolitical descriptions
  rationale: Two sentences clarify the rationale while retaining the political identity of both groups.
- pob_phrase: when I repeatedly went up to the upper satrapies
  simplified_phrase: When I repeatedly traveled to the upper provinces
  preserved_meaning: He made repeated journeys to regions historically called the upper satrapies.
  reasoning_layer_used: POB lexical decision and cultural note for ἀνατρέχων and σατραπίας
  rationale: The main text uses familiar wording while the footnote preserves the historical term.
- pob_phrase: I often entrusted and commended to most of you
  simplified_phrase: I placed him in the care of most of you and recommended him to most of you
  preserved_meaning: He both committed his son to their care and presented him with approval to the same limited audience.
  reasoning_layer_used: POB lexical decisions for παρεκατετίθεμην and συνίστων
  rationale: Plain verbal phrases preserve both distinct actions and the scope of “most of you.”
