simplification_decisions:
- pob_phrase: But Philip, his companion, was carrying the body; and
  simplified_phrase: Philip, his companion, was carrying the body.
  preserved_meaning: Philip was in the process of carrying the dead king’s body.
  reasoning_layer_used: The lexical decisions for παρεκομίζετο and τὸ σῶμα preserve the ongoing action and the neutral word “body.”
  rationale: A sentence break makes the sequence easier to follow while retaining the natural verb “carrying.”
- pob_phrase: because he feared Antiochus’s son, he went over
  simplified_phrase: because Philip feared Antiochus’s son, he went over
  preserved_meaning: Fear of Antiochus’s son caused Philip to relocate to Egypt.
  reasoning_layer_used: The lexical decisions for εὐλαβηθεὶς and διεκομίσθη preserve both Philip’s motive and the transfer nuance.
  rationale: Repeating Philip removes pronoun confusion, while “went over” retains the political relocation sense.
translation_notes:
  risk_flags:
  - risk: “Went over” does not display the passive form of διεκομίσθη.
    mitigation: Footnote b preserves the more literal passive alternative.
  - risk: “Companion” may conceal a closer court or foster relationship.
    mitigation: Footnote a preserves that possibility without presenting it as certain.
