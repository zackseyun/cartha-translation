translation:
  language: en
  text: But he was furious. He planned to take out on the Jews his resentment against those who had driven him away. So he ordered his chariot driver to keep driving without stopping and hurry on with the journey. All the while, judgment from heaven went with him. In his arrogance he had said, “When I arrive, I will turn Jerusalem into a burial place for Jews.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a mass grave for Jews.” The Greek word means a burial place for many dead people.
    reason: lexical_alternative
