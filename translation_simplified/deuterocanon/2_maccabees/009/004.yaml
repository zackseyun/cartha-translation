  preserved_meaning: Antiochus intended to redirect toward the Jews his hostile resentment over being driven away.
  reasoning_layer_used: POB lexical decisions for ἐπαρθεὶς τῷ θυμῷ, ᾤετο, κακία, and ἐναπερείσασθαι
