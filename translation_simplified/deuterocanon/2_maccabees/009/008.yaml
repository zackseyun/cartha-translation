translation:
  language: en
  text: But this man had been so arrogant that he thought he stood above other men. He believed he could command even the waves of the sea and weigh the heights of the mountains on a scale. Yet he was brought down to the ground and carried on a stretcher. In this way, the power of God was made plain to everyone.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek text irregularly repeats “the faith” before “the power.” This is probably a copying error, so the main text follows the clear sense, “the power of God.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: in his arrogance over men
  simplified_phrase: had been so arrogant that he thought he stood above other men
  preserved_meaning: He exalted himself above other human beings.
  reasoning_layer_used: POB lexical and theological decisions on ὑπὲρ ἀνθρώπων
  rationale: This states the superior sense of “over” clearly while retaining “men” without adding “all.”
- pob_phrase: carried in a litter
  simplified_phrase: carried on a stretcher
  preserved_meaning: Others transported him on a conveyance for an infirm person.
  reasoning_layer_used: POB lexical decision on ἐν φορίᾳ παρεκομίζετο
  rationale: “Stretcher” replaces the unfamiliar “litter” with a clear modern equivalent.
- pob_phrase: plainly showing to all the power of God
  simplified_phrase: In this way, the power of God was made plain to everyone
  preserved_meaning: His humbled condition publicly displayed God’s power.
  reasoning_layer_used: POB lexical and theological decisions on φανερὰν, πᾶσιν, and the unstable πίστιν sequence
  rationale: A separate sentence makes the public result clear without forcing “faith” into the unstable text.
interpretive_expansions:
- pob_phrase: in his arrogance over men
  rendering: he thought he stood above other men
  claim: His arrogance involved exalting himself above humanity.
  evidence:
  - The POB rationale says ὑπὲρ expresses self-exaltation above human beings.
  - His boasts portray a claim to power beyond ordinary humanity.
  confidence: high
  alternatives_preserved:
  - because of his pride over humanity
  - through his arrogance toward men
