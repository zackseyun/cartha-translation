  reasoning_layer_used: POB lexical decision for οὕτω and immediate context
  rationale: Adding “acting” clarifies the backward reference without naming a new action.
- pob_phrase: God, the all-powerful overseer
  simplified_phrase: God, the all-powerful one who watches
  preserved_meaning: God has unrestricted power and observes what happens, so his judgment cannot be evaded.
  reasoning_layer_used: POB lexical and theological decisions for παντοκράτορος ἐπόπτου θεοῦ
  rationale: This avoids the institutional sound of “overseer” without adding a universal object to “watches.”
