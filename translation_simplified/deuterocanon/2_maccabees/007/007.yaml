translation:
  language: en
  text: After the first brother had died in this way, they brought forward the second brother to mock and abuse him. They tore the skin from his head, hair and all, and asked, “Will you eat[a] before your body is punished limb by limb?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: They meant eating food forbidden by their ancestral law.
    reason: cross_reference
