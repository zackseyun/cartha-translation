  text: The Lord God is watching. He truly is moved with compassion for us,[a] just as Moses made clear in the song that bears open witness:[b] “He will be moved with compassion for his servants.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “is comforted,” but the context favors compassion or relenting.
    reason: lexical_alternative
