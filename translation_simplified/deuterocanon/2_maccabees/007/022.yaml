translation:
  language: en
  text: I do not know how you appeared in my womb. I did not give you spirit[a] and life, nor did I arrange how each of you was formed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “breath.” The Greek word can mean “spirit,” “breath,” or “wind”; here it refers to what gives life.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I do not know how you appeared in my womb
  simplified_phrase: I do not know how you appeared in my womb.
  preserved_meaning: The mother says that how her children came to be within her is mysterious to her.
  reasoning_layer_used: Lexical decision for ἐφάνητε and its source-language image
  rationale: The concrete image remains because it conveys the mother's wonder about their origin.
- pob_phrase: nor was it I who granted you spirit and life
  simplified_phrase: I did not give you spirit and life
  preserved_meaning: The mother denies being the ultimate giver of their spirit and life while keeping the two ideas distinct.
  reasoning_layer_used: Lexical and theological decisions for πνεῦμα, ζωή, and maternal causation
  rationale: The direct clause is easier to read while preserving the emphatic denial.
- pob_phrase: it was not I who arranged the formation of each of you
  simplified_phrase: nor did I arrange how each of you was formed
  preserved_meaning: The mother denies ultimate authorship of the ordered bodily formation of each child.
  reasoning_layer_used: Lexical decisions for στοιχείωσις and διερρύθμισα, with the theological limit on maternal denial
  rationale: This wording keeps both arranging and formation without suggesting that she denied ordinary motherhood.
translation_notes:
  risk_flags:
  - risk: “Spirit” may be understood too narrowly as separate from embodied life.
    mitigation: The footnote preserves “breath” and explains its life-giving sense.
  - risk: The direct denials could be mistaken for denying any maternal role.
    mitigation: Keeping “arrange how each of you was formed” focuses the denial on ultimate ordering rather than ordinary motherhood.
