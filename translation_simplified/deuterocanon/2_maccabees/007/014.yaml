translation:
  language: en
  text: 'As he was about to die, he said, “It is better to be killed by people and to wait for the hope God gives us: God will raise us again. But you will have no resurrection to life.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may mean that the persecutor will not share in the blessed resurrection to life, not necessarily that he will never be raised at all.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: when dying at the hands of men
  simplified_phrase: to be killed by people
  preserved_meaning: The martyr is being put to death through human agency.
  reasoning_layer_used: Lexical decision for μεταλλάσσοντας ἀπὸ ἀνθρώπων and the martyrdom context
  rationale: The direct wording is clearer than the idiom “at the hands of men.”
- pob_phrase: to await the hopes given by God—that one will be raised again by him
  simplified_phrase: 'to wait for the hope God gives us: God will raise us again'
  preserved_meaning: The martyrs expect God himself to raise them from death.
  reasoning_layer_used: Lexical decisions for προσδοκᾷν ἐλπίδας and πάλιν ἀναστήσεσθαι ὑπʼ αὐτοῦ
  rationale: Two direct clauses clarify the God-given hope and God’s agency.
- pob_phrase: But for you there will be no resurrection to life
  simplified_phrase: But you will have no resurrection to life
  preserved_meaning: The persecutor is denied resurrection that leads to life without ruling out every possible resurrection.
  reasoning_layer_used: Theological decision preserving ἀνάστασις εἰς ζωὴν
  rationale: The key theological phrase remains intact in a more direct sentence.
