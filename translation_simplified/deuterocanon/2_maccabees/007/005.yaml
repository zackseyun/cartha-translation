translation:
  language: en
  text: 'When the tortured brother was no longer useful to the others,[a] the king ordered that he be taken to the fire while still breathing and fried in the pan. As the pan gave off a great deal of vapor,[b] the brothers and their mother encouraged one another to die nobly. They said:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may mean that he was no longer useful for further torture or as an example to the others.
    reason: simplification_note
  - marker: b
    text: Or “steam” or “smoke”; the Greek word can refer broadly to vapor or fumes.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: when he had become useless to the others
  simplified_phrase: when the tortured brother was no longer useful to the others
  preserved_meaning: The torturers regarded the brother in a brutally dehumanizing way, but the precise reason he was no longer useful remains open.
  reasoning_layer_used: POB lexical rationale and grounding review
  rationale: Identifying him as the tortured brother improves clarity without choosing between the documented contextual possibilities.
- pob_phrase: he ordered him to be brought to the fire while still breathing and to be fried in the pan
  simplified_phrase: the king ordered that he be taken to the fire while still breathing and fried in the pan
  preserved_meaning: The victim was alive when the king ordered both his removal to the fire and his torture in the pan.
  reasoning_layer_used: POB lexical decisions and doctrine realignment revision
  rationale: The clearer clause order preserves the command, the two actions, and the fact that he was still alive.
- pob_phrase: when the vapor from the pan had spread considerably
  simplified_phrase: as the pan gave off a great deal of vapor
  preserved_meaning: The pan was abundantly emitting vapor while the family encouraged one another.
  reasoning_layer_used: POB lexical rationale and grounding review
  rationale: The active, contemporaneous wording makes the scene easy to follow without implying that the emission had ended.
interpretive_expansions:
- pob_phrase: he ordered
  rendering: the king ordered
  claim: The unnamed subject is the king who commands the torture in the surrounding narrative.
  evidence:
  - The immediate narrative identifies the ruler directing the brothers’ torture.
  confidence: high
translation_notes:
  risk_flags:
  - risk: “No longer useful to the others” remains intentionally terse and may not reveal how the torturers considered him useful.
    mitigation: Footnote a preserves the two contextual possibilities documented in the POB rationale.
  - risk: Naming the subject as “the king” is more explicit than this verse’s Greek pronoun.
    mitigation: The immediate narrative clearly supplies the king as the one issuing the order.
