  reasoning_layer_used: Lexical decisions for διεγείρασα, τὸν θῆλυν λογισμόν, and ἄρσενι θυμῷ, together with the theological decision on gendered rhetoric.
  rationale: “Roused” expresses the source image more clearly than the unfamiliar phrase “stirred her reasoning.”
