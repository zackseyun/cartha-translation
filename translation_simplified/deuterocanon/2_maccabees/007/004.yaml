translation:
  language: en
  text: As soon as the pans were red-hot, he ordered his men to cut out the tongue of the brother who had spoken for the others. Then they were to scalp him[a] and cut off his extremities[b] while his remaining brothers and his mother watched.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Greek word may mean removing his scalp or, more generally, stripping skin from around his head.
    reason: lexical_alternative
  - marker: b
    text: The Greek describes severe mutilation by cutting off extremities, but does not specify the exact body parts.
    reason: lexical_alternative
