    mitigation: “I also pray” explicitly keeps the second petition within the same appeal to God.
  - risk: “Life” narrows the broader possible sense of τύχην as fate or lot.
    mitigation: The footnote preserves the lexical alternatives while the martyrdom context supports the main wording.
