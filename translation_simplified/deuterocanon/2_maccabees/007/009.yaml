translation:
  language: en
  text: With his last breath, he said, “You accursed wretch, you are releasing us from this present life. But the King of the world will raise us up—we who have died for his laws—to live again forever.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “to an eternal resurrection to life.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And as he was at his last breath
  simplified_phrase: With his last breath
  preserved_meaning: He spoke at the point of death.
  reasoning_layer_used: POB lexical decision for Ἐν ἐσχάτῃ ... πνοῇ
  rationale: The shorter form keeps the vivid image of his final breath.
- pob_phrase: will raise us up, who have died for his laws
  simplified_phrase: will raise us up—we who have died for his laws
  preserved_meaning: God will raise those who have died because of their faithfulness to his laws.
  reasoning_layer_used: POB lexical and theological decisions on ἀποθανόντας and ὑπέρ
  rationale: The recast clause is easier to follow and preserves death as completed before resurrection.
- pob_phrase: into an everlasting renewal of life
  simplified_phrase: to live again forever
  preserved_meaning: Their restored life after death will never end.
  reasoning_layer_used: POB lexical decision for εἰς αἰώνιον ἀναβίωσιν ζωῆς
  rationale: Common wording expresses both return to life and its everlasting duration.
translation_notes:
  risk_flags:
  - risk: “Release” may sound positive rather than ironic.
    mitigation: The contrast with the King who raises the dead shows the tyrant’s limited power.
  - risk: “To live again forever” compresses a rare Greek expression.
    mitigation: The main text retains raising and renewed life, while the footnote gives the formal alternative.
