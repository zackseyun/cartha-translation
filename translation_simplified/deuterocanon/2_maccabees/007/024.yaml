translation:
  language: en
  text: But Antiochus thought the youngest was treating him with contempt, and he noticed the reproach in the young man’s tone. While the young man was still alive, Antiochus did more than urge him with words. He also swore that if the young man turned away from the traditions handed down by his ancestors, he would make him rich and someone others would envy. He would treat him as a friend[a] and entrust him with official duties.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Friend” may refer to a favored associate or official in the royal court.
    reason: cultural_note
simplification_decisions:
- pob_phrase: thinking that he was being despised and taking note of the reproachful tone
  simplified_phrase: thought the youngest was treating him with contempt, and he noticed the reproach in the young man’s tone
  preserved_meaning: Antiochus perceived the young man’s speech as contemptuous and reproaching.
  reasoning_layer_used: POB lexical decisions for καταφρονεῖσθαι, ὑφορώμενος, and φωνήν
  rationale: The wording names the perceived agent while keeping the judgment as Antiochus’s own view.
- pob_phrase: while the youngest was still alive, not only urged him with words, but also assured him with oaths
  simplified_phrase: While the young man was still alive, Antiochus did more than urge him with words. He also swore
  preserved_meaning: During the young man’s survival, Antiochus added solemn sworn promises to his verbal pressure.
  reasoning_layer_used: POB lexical decisions for the genitive absolute and διʼ ὅρκων ἐπίστου
  rationale: Short sentences preserve the temporal relationship and clarify the escalation to sworn promises.
- pob_phrase: make him rich and make him blessed ... entrust him with offices
  simplified_phrase: make him rich and someone others would envy ... entrust him with official duties
  preserved_meaning: Antiochus promised wealth, enviable worldly status, and an official position of responsibility.
  reasoning_layer_used: POB lexical and theological decisions for μακαριστόν and χρείας
  rationale: The wording avoids religious overtones and explains the courtly meaning of “offices.”
