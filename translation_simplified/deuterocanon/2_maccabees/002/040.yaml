translation:
  language: en
  text: The same things were also recounted in the records and memoirs about Nehemiah. These writings also told how he established a library and collected the books about the kings and prophets, the writings of David, and letters from kings about gifts dedicated to God.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: were also related in the records and in the memoirs concerning Nehemiah
  simplified_phrase: were also recounted in the records and memoirs about Nehemiah
  preserved_meaning: The information appeared in two kinds of writings pertaining to Nehemiah.
  reasoning_layer_used: POB lexical decisions for Ἐξηγοῦντο, ἀναγραφαῖς, ὑπομνηματισμοῖς, and τοῖς κατὰ τὸν Νεεμίαν
  rationale: “Recounted” and “about” express the documentary sense in more familiar English without implying Nehemiah wrote them.
- pob_phrase: and how, in founding a library, he gathered together
  simplified_phrase: These writings also told how he established a library and collected
  preserved_meaning: Nehemiah set up a library by bringing the listed writings together.
  reasoning_layer_used: POB lexical decisions for καταβαλλόμενος, βιβλιοθήκην, and ἐπισυνήγαγεν
  rationale: A new sentence and direct verbs make the action easier to follow while retaining the founding and collecting ideas.
- pob_phrase: letters of kings concerning votive offerings
  simplified_phrase: letters from kings about gifts dedicated to God
  preserved_meaning: The royal letters concerned offerings or objects set apart for God.
  reasoning_layer_used: POB lexical and theological decisions for ἐπιστολὰς βασιλέων and περὶ ἀναθεμάτων
  rationale: The wording explains the unfamiliar ritual term and avoids the misleading sense of “anathemas.”
