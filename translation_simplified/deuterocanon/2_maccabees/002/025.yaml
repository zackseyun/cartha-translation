translation:
  language: en
  text: After the king enclosed it,[a] he tested the matter and made it a sanctuary.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean that he fenced it in or fortified it for protection.
    reason: lexical_alternative
  - marker: b
    text: “Sanctuary” here means a sacred place or temple area, not necessarily the Jerusalem temple.
    reason: simplification_note
