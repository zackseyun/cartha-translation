  rationale: A finite clause makes the ritual action easier to understand.
- pob_phrase: the dedication of the altar
  simplified_phrase: how the altar was dedicated
  preserved_meaning: The altar was formally dedicated, with rededication remaining a contextual alternative.
  reasoning_layer_used: The ἐγκαινισμόν decision prefers “dedication” while preserving “rededication” in a footnote.
