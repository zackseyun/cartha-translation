translation:
  language: en
  text: '2 Maccabees 1:20


    But when this became known, the Persian king was told what had happened: water had appeared where the priests who had been taken away had hidden the fire. Nehemiah and those with him purified the sacrifices with water from there.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The priests had been removed from their place, probably into exile.
    reason: lexical_alternative
  - marker: b
    text: The Greek may mean that they purified the sacrifices either with the water itself or with water drawn from it as its source.
    reason: lexical_alternative
