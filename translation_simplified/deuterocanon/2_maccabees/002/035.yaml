translation:
  language: en
  text: Then the Lord will reveal these things. The glory of the Lord and the cloud[a] will appear, just as it was shown in Moses’ time and as Solomon also asked, so that the place might be made especially holy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The cloud probably refers to the familiar sign of the Lord’s presence associated with Moses and the sanctuary.
    reason: cross_reference
simplification_decisions:
- pob_phrase: as it was shown in the case of Moses
  simplified_phrase: just as it was shown in Moses’ time
  preserved_meaning: The future appearance is compared with the earlier manifestation associated with Moses.
  reasoning_layer_used: The lexical decision treats the phrase as a comparison with the Mosaic precedent.
  rationale: “In Moses’ time” expresses the historical comparison in ordinary English while retaining the singular wording.
- pob_phrase: as Solomon also asked
  simplified_phrase: as Solomon also asked
  preserved_meaning: Solomon made a request connected with the place being made holy.
  reasoning_layer_used: The lexical rationale identifies a petition concerning the temple’s sanctification without requiring “prayed.”
  rationale: Keeping the phrase without an added object avoids forcing it to refer backward to the whole manifestation.
- pob_phrase: that the place might be greatly sanctified
  simplified_phrase: so that the place might be made especially holy
  preserved_meaning: The place would be made holy to an exceptional degree.
  reasoning_layer_used: The lexical decisions define sanctification as being made holy and preserve the adverb’s intensity.
  rationale: The wording explains “sanctified” in common English while retaining the emphasis of “greatly.”
translation_notes:
  risk_flags:
  - risk: The singular “it” has an open antecedent and may sound less smooth after “the glory” and “the cloud.”
    mitigation: The singular is retained to avoid claiming explicitly that both were jointly shown in Moses’ time.
