  review_summary: The direct verbs and “all of them” are warranted by the participle and by the immediate antecedent “all his people”; they improve readability without adding doctrine. Revision is needed because the draft retains the least accessible technical term in its main text despite a clear, source-supported alternative. “Holiness” is a viable lexical sense for ἁγιασμός and communicates the relevant category without deciding between a process-oriented doctrine of sanctification and other possible nuances. The revised punctuation also keeps the listed gifts coordinated rather than presenting them as merely accompanying the inheritance.
