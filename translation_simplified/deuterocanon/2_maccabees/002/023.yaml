translation:
  language: en
  text: When this happened, a flame was lit. But when the light from the altar shone out, it was consumed.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may suggest that the light shone back or in response. It does not state what was consumed; it may refer to the flame or to the material being burned.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: a flame was kindled
  simplified_phrase: a flame was lit
  preserved_meaning: A single flame came to be burning.
  reasoning_layer_used: Lexical decision for ἀνήφθη
  rationale: “Was lit” expresses the passive action in familiar English.
- pob_phrase: when the light from the altar shone forth
  simplified_phrase: when the light from the altar shone out
  preserved_meaning: Light visibly came from the altar, with a possible responsive nuance retained in the footnote.
  reasoning_layer_used: Latest revision and lexical decision for ἀντιλάμψαντος φωτός
  rationale: “Shone out” is natural English while the note preserves the possible sense of shining back.
- pob_phrase: it was consumed
  simplified_phrase: it was consumed
  preserved_meaning: The main text leaves the consumed thing unstated, as the Greek does.
  reasoning_layer_used: Theological decision on the final passive verb
  rationale: Keeping “it” avoids resolving the documented ambiguity.
translation_notes:
  risk_flags:
  - risk: The pronoun “it” may leave readers unsure what was consumed.
    mitigation: The footnote gives the flame as the likely referent while preserving the material as an alternative.
  - risk: “Shone out” does not itself express every possible responsive nuance of the Greek verb.
    mitigation: The footnote notes that the light may have shone back or in response.
