translation:
  language: en
  text: Moses prayed to the Lord, and fire came down from heaven and consumed what was connected with the sacrifice.[a] In the same way, Solomon prayed to the Lord, and fire came down and consumed the offerings that were burned completely.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek expression is broad and may refer to the offerings or other materials connected with the sacrifice.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Just as Moses prayed ... so also Solomon prayed
  simplified_phrase: Moses prayed ... In the same way, Solomon prayed
  preserved_meaning: The explicit parallel between Moses and Solomon remains clear.
  reasoning_layer_used: Lexical decision for οὕτως ... καὶ and the verse's parallel structure
  rationale: Two shorter clauses make the comparison easier to follow.
- pob_phrase: the things of the sacrifice
  simplified_phrase: what was connected with the sacrifice
  preserved_meaning: The phrase remains broad without implying that every associated item was included.
  reasoning_layer_used: POB lexical decision and footnote for τὰ τῆς θυσίας
  rationale: This removes wooden wording while preserving the uncertain scope.
- pob_phrase: whole burnt offerings
  simplified_phrase: offerings that were burned completely
  preserved_meaning: These are offerings defined by being wholly burned, not merely intended for burning.
  reasoning_layer_used: POB lexical and theological decisions for ὁλοκαυτώματα
  rationale: The plain wording preserves the ritual category and complete burning.
translation_notes:
  risk_flags:
  - risk: “What was connected with the sacrifice” may suggest associated materials rather than the offerings themselves.
    mitigation: The footnote preserves both possibilities without choosing between them.
