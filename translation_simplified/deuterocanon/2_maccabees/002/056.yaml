translation:
  language: en
  text: When a new house is being built, the architect must carefully plan its entire foundation. But the person who decorates[a] and paints it must carefully examine what is suitable for its adornment. I think the same is true in our case.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “furnishes”; the Greek can refer to fitting out or preparing the house, not only decorating it.
    reason: lexical_alternative
