translation:
  language: en
  text: Appearances from heaven also came to those who fought bravely and zealously for Judaism.[a] As a result, though they were few, they plundered the whole country and drove off the barbarian hordes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “Judaism” means the Jewish religion and way of life they were defending against foreign pressure.
    reason: cultural_note
  - marker: b
    text: “Barbarian hordes” preserves the source text’s own label for the large foreign forces; it can also be translated “foreign multitudes.”
    reason: lexical_alternative
