  preserved_meaning: Visible manifestations came from a heavenly source.
  reasoning_layer_used: POB lexical decisions for ἐπιφανείας and τὰς ἐξ οὐρανοῦ γενομένας
  rationale: The direct clause removes the tangled modifier while retaining both appearance and heavenly origin.
- pob_phrase: those who fought bravely with zeal
  simplified_phrase: those who fought bravely and zealously
  preserved_meaning: They showed both military courage and earnest commitment.
  reasoning_layer_used: POB lexical decisions for ἀνδραγαθήσασιν and φιλοτίμως
  rationale: The paired adverbs express the two distinct source ideas in natural English.
- pob_phrase: so that, though they were few
  simplified_phrase: As a result, though they were few
  preserved_meaning: Their surprising military success followed the heavenly appearances despite their small number.
  reasoning_layer_used: POB lexical decision for ὡς and ὀλίγους ὄντας
  rationale: A new sentence makes the result and concession immediately clear.
