translation:
  language: en
  text: When the leader arrived with his troops, they seemed impossible to defeat.[a] But because the priests who served Nanaia had deceived them, the leader and his troops were cut down in Nanaia’s temple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “impossible to resist”; the Greek phrase describing the troops is difficult.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the force around him
  simplified_phrase: his troops
  preserved_meaning: The leader was accompanied by a military force.
  reasoning_layer_used: Lexical decision for ἡ περὶ αὐτὸν ... δύναμις.
  rationale: “His troops” gives the military sense in ordinary English.
- pob_phrase: which seemed invincible
  simplified_phrase: they seemed impossible to defeat
  preserved_meaning: The troops appeared impossible to withstand, without claiming they truly were.
  reasoning_layer_used: Lexical decision for ἀνυπόστατος δοκοῦσα εἶναι.
  rationale: The wording preserves both the appearance qualifier and the difficult military sense.
- pob_phrase: because the priests attending Nanaia had used deceit
  simplified_phrase: because the priests who served Nanaia had deceived them
  preserved_meaning: The priests associated with Nanaia used deception that led to the slaughter.
  reasoning_layer_used: Lexical decisions for παραλογισμῷ χρησαμένων and τῶν περὶ τὴν Ναναίαν ἱερέων.
  rationale: The clearer clause identifies the deception while leaving the killing passive.
translation_notes:
  risk_flags:
