- pob_phrase: For as Antiochus and his friends were accompanying her to the place
  simplified_phrase: Antiochus and his friends were traveling with her to the place.
  preserved_meaning: Antiochus and his associates were going together with the woman toward the place.
  reasoning_layer_used: POB lexical decision for συνοικῶν and αὐτῇ
  rationale: “Traveling with” makes the narrative movement clear while retaining the uncertain feminine pronoun.
- pob_phrase: they were bringing him there to gain control of the money
  simplified_phrase: They were bringing him there to gain control of the money
  preserved_meaning: Their purpose was to obtain authority over the money, not merely to handle it.
  reasoning_layer_used: POB lexical decisions for παρῆγεν and κύριον τὸ λαβεῖν
  rationale: The wording keeps the distinct male object and the stronger sense of gaining control.
- pob_phrase: under the pretext of inspection
