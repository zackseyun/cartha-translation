translation:
  language: en
  text: We are about to celebrate the cleansing of the temple on the twenty-fifth day of Chislev. For this reason, we thought it necessary to explain this clearly to you, so that you too may celebrate the Festival of Booths[a] and the observance connected with the fire[b], when Nehemiah, who built the temple and the altar,[c] offered sacrifices.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Festival of Booths is traditionally called the Feast of Tabernacles.
    reason: lexical_alternative
  - marker: b
    text: The Greek says simply “and of the fire,” referring to the observance connected with the fire account that follows.
    reason: cultural_note
  - marker: c
    text: The Greek says “built”; the historical setting may suggest “rebuilt.”
    reason: lexical_alternative
