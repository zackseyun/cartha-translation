translation:
  language: en
  text: But those inside trusted in their strong walls and their food supplies. They treated Judas and his men even more arrogantly, insulting them, even blaspheming, and saying things that should not be said.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: trusting in the strength of the walls and in the supply of provisions
  simplified_phrase: trusted in their strong walls and their food supplies
  preserved_meaning: The defenders relied confidently on their fortifications and food supply.
  reasoning_layer_used: POB lexical decisions for πεποιθότες, ἐρυμνότης, and παράθεσις
  rationale: Concrete everyday wording preserves their settled confidence during the siege.
- pob_phrase: treated Judas and his men more arrogantly
  simplified_phrase: treated Judas and his men even more arrogantly
  preserved_meaning: Their conduct toward Judas's forces showed heightened insolence.
  reasoning_layer_used: POB lexical decision for ἀναυθαγέστερον ἐχρῶντο
  rationale: The word “even” clearly conveys the comparative force in natural English.
- pob_phrase: reviling them, and even blaspheming and speaking what is not lawful
  simplified_phrase: insulting them, even blaspheming, and saying things that should not be said
  preserved_meaning: Their speech escalated from insults to blasphemy and morally or religiously improper words.
  reasoning_layer_used: POB lexical and theological decisions for λοιδοροῦντες, βλασφημοῦντες, and θέμις
  rationale: The wording keeps all three charges, marks the escalation, and avoids narrowing the last phrase to a legal ban.
