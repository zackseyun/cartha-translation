translation:
  language: en
  text: But when Judas’s company first appeared, dread fell on the enemy. Fear also seized them at the appearance of the One who watches over all things.[a] They fled in panic and scattered in every direction. As a result, their own men often injured them and ran them through with the points of their swords.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “when the One who sees all things revealed his presence.” The Greek repeats the appearance-language used earlier in the verse.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: dread came upon the enemies—fear also coming upon them
  simplified_phrase: dread fell on the enemy. Fear also seized them
  preserved_meaning: The enemy experiences both dread and fear as distinct but closely related reactions.
  reasoning_layer_used: POB lexical decisions for δέος and φόβος
  rationale: Two short clauses preserve both Greek fear terms while removing the difficult parenthetical structure.
- pob_phrase: they rushed into flight, each man being driven a different way
  simplified_phrase: They fled in panic and scattered in every direction
  preserved_meaning: Their retreat is sudden, fearful, and chaotically dispersed.
  reasoning_layer_used: POB lexical decisions for εἰς φυγὴν ὥρμησαν and ἄλλος ἀλλαχῇ φερόμενος
  rationale: Natural military English retains the headlong flight and scattering without the awkward passive construction.
- pob_phrase: so that they were often injured by their own men and run through by the points of their swords
  simplified_phrase: As a result, their own men often injured them and ran them through with the points of their swords
  preserved_meaning: Their chaotic flight leads to injuries and fatal-looking sword thrusts from their own side.
  reasoning_layer_used: POB lexical decisions for βλάπτεσθαι, ἀναπείρεσθαι, and ταῖς τῶν ξιφῶν ἀκμαῖς
  rationale: An active sentence clarifies who harms whom while preserving the vivid sword-point image.
