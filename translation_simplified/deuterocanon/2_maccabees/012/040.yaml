translation:
  language: en
  text: But under the tunic of every dead soldier, they found sacred objects connected with the idols from Jamnia.[a] The law forbids Jews to have such objects. It then became clear to everyone that this was why these men had fallen in battle.
  philosophy: optimal-equivalence
  footnotes:
