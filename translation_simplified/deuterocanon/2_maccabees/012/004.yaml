translation:
  language: en
  text: After the city made its formal public decision, these men accepted it. They appeared to want peace and to have no suspicious intentions.[a] Then they took the others away and drowned them—at least two hundred people in all.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “to have nothing suspicious about them”; the Greek may refer either to their intentions or to their appearance of innocence.
    reason: lexical_alternative
