translation:
  language: en
  text: But the people of Joppa committed a terrible, ungodly act. They invited the Jews who lived among them to board boats they had provided, together with their wives and children. They acted as if they had no hostility toward them at all.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: such a great act of impiety
  simplified_phrase: a terrible, ungodly act
  preserved_meaning: The deed remains extremely serious and religiously offensive without making God its direct object.
  reasoning_layer_used: lexical and theological decisions for τηλικοῦτο and δυσσέβημα
  rationale: “Terrible” conveys the magnitude, while “ungodly” preserves the religious judgment in familiar language.
- pob_phrase: to embark ... in the boats provided by them
  simplified_phrase: to board boats they had provided
  preserved_meaning: The Jews were invited onto watercraft made available by the people of Joppa.
  reasoning_layer_used: lexical decisions for ἐμβῆναι and τὰ παρακατασταθέντα ὑπʼ αὐτῶν σκάφη
  rationale: “Board” and active clause order make the action immediately clear.
- pob_phrase: as though there were no hostility toward them at all
  simplified_phrase: They acted as if they had no hostility toward them at all.
  preserved_meaning: The invitation falsely presented the people of Joppa as having no hostile intent.
  reasoning_layer_used: lexical rationale for ὡς μηδεμίας ἐνεστώσης πρὸς αὐτοὺς δυσμενείας
  rationale: A separate sentence clarifies the deceptive pretense while retaining the emphatic “at all.”
