translation:
  language: en
  text: After they captured the city by the will of God, they slaughtered people beyond counting, so that the nearby lake, about 370 meters (400 yards) across,[a] appeared to have blood streaming into or through it until it seemed full.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says the lake was two stadia wide.
    reason: cultural_note
  - marker: b
    text: Or “appeared to be filled with blood.” The Greek image may describe blood flowing into or through the lake until it seemed full.
    reason: lexical_alternative
