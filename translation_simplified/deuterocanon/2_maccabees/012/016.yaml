  review_summary: 'The draft is substantially clearer than the POB: ''captured'' appropriately clarifies the military setting, ''slaughtered people beyond counting'' naturally communicates the vast killing, and the modern measurement is well supported by the POB note. The attribution ''by the will of God'' remains limited grammatically to the capture and does not add a doctrinal conclusion. Revision is needed because ''the lake ... appeared to be overflowing'' risks changing the source image from blood streaming/running down in relation to the lake into a claim that the lake itself was overflowing. The replacement keeps the vividness and uncertainty while making the image understandable.'
