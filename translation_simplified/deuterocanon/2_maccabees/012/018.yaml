- pob_phrase: for he had then withdrawn from the places without accomplishing anything
  simplified_phrase: By then he had withdrawn from them without accomplishing anything
  preserved_meaning: Timotheus had left those locations after achieving nothing.
  reasoning_layer_used: POB lexical decisions for ἄπρακτον and ἐκλελυκότα
  rationale: A new sentence and a pronoun clarify the sequence while retaining the plural locations.
- pob_phrase: a garrison
  simplified_phrase: a guard force
  preserved_meaning: Timotheus left an armed detachment behind to hold a position.
  reasoning_layer_used: POB lexical decision for φρουράν
  rationale: “Guard force” conveys the military sense without requiring readers to know “garrison.”
- pob_phrase: in a certain place, and a very strong one at that
  simplified_phrase: a very strong guard force at one location
  preserved_meaning: The strong military force was left at an unspecified location.
  reasoning_layer_used: POB lexical decisions for ἐν τινι τόπῳ and μάλιστα ὀχυράν
  rationale: The recast wording is direct while keeping the location indefinite and the force very strong.
