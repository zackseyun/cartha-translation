translation:
  language: en
  text: But they did not catch Timotheus in those places. By then he had withdrawn from them without accomplishing anything, though he had left a very strong guard force at one location.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek most directly describes the guard force as very strong, but may also suggest that its location was strongly fortified.
    reason: lexical_alternative
