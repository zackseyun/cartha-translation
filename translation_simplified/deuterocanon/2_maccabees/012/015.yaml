translation:
  language: en
  text: But Judas and those with him called on the great Sovereign of the world. He had brought down Jericho in Joshua’s time without battering rams or siege engines. Then they fiercely attacked the wall.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: those around Judas, having called on
  simplified_phrase: Judas and those with him called on
  preserved_meaning: Judas’s party appealed to God before attacking.
  reasoning_layer_used: POB lexical decision for οἱ περὶ τὸν Ἰούδαν and ἐπικαλεσάμενοι
  rationale: The idiom is recast as a direct clause without limiting the group to soldiers.
- pob_phrase: the one who, in the time of Joshua, brought down Jericho
  simplified_phrase: He had brought down Jericho in Joshua’s time
  preserved_meaning: The God they invoked is the one who caused Jericho’s fall in Joshua’s day.
  reasoning_layer_used: POB theological decision identifying Ἰησοῦ as Joshua
  rationale: A separate sentence makes the historical allusion easier to follow.
- pob_phrase: without rams or siege engines—assaulted the wall fiercely
  simplified_phrase: without battering rams or siege engines. Then they fiercely attacked the wall.
  preserved_meaning: God needed no human siege equipment, while Judas’s group attacked the wall forcefully.
  reasoning_layer_used: POB lexical decisions for κριοί, μηχαναί ὀργανικαί, ἐνέσεισαν, and θηριωδῶς
  rationale: “Battering rams” clarifies the weapon, and “attacked” states the contextual action plainly.
translation_notes:
