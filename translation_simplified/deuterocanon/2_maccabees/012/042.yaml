translation:
  language: en
  text: They turned to earnest prayer, asking that the sin that had been committed be completely blotted out. But the noble Judas urged the people to keep themselves free from sin, because they had seen with their own eyes what had happened because of the sin of those who had fallen.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: they turned to supplication
  simplified_phrase: They turned to earnest prayer
  preserved_meaning: They responded by making a serious petition in prayer.
  reasoning_layer_used: POB lexical decision for εἰς ἱκεσίαν ἐτράπησαν
  rationale: “Earnest prayer” expresses the petitionary force of “supplication” in common English.
- pob_phrase: urged the multitude
  simplified_phrase: urged the people
  preserved_meaning: Judas exhorted the assembled group.
  reasoning_layer_used: POB lexical decision for παρεκάλεσε τὸ πλῆθος
  rationale: “The people” is more natural than “the multitude” while retaining the collective sense.
- pob_phrase: since they had seen before their eyes the things that had happened
  simplified_phrase: because they had seen with their own eyes what had happened
  preserved_meaning: Their direct experience supplied the reason for Judas’s warning.
  reasoning_layer_used: POB lexical decisions for ὑπʼ ὄψιν ἑωρακότας and τὰ γεγονότα
  rationale: The wording preserves both the eyewitness image and its causal link to the exhortation.
translation_notes:
  risk_flags:
  - risk: “Those who had fallen” could be read as moral failure rather than death in battle.
    mitigation: The phrase is retained because POB uses the military image to identify those who died.
