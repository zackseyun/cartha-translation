translation:
  language: en
  text: After a fierce battle, Judas and those with him succeeded because God helped them. The nomads had been weakened, so they asked Judas to give them his right hand as a pledge of peace or alliance. They promised to provide pasture and to help Judas’s people in the future.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek wording at the end is compressed; it indicates a promise of grazing support and future help.
    reason: textual_variant
