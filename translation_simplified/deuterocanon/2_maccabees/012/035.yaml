  text: Dositheus, one of Bacenor’s men, was a strong horseman. He seized Gorgias by the cloak and dragged him away, intending to capture the accursed man alive. But one of the Thracian horsemen charged at Dositheus and cut off his shoulder.[a] Gorgias then escaped to Marisa.
