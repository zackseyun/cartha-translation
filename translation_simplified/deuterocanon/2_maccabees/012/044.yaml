translation:
  language: en
  text: If he had not expected those who had fallen to rise again, then praying for the dead would have been unnecessary and foolish.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Those who had fallen” refers to those who had died in battle; the Greek literally says “those who had fallen.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: if he were not expecting
  simplified_phrase: if he had not expected
  preserved_meaning: The sentence presents a contrary condition about his expectation of resurrection.
  reasoning_layer_used: Greek conditional context and POB theological rationale
  rationale: The past-perfect form makes the conditional logic natural in modern English.
- pob_phrase: those who had fallen
  simplified_phrase: those who had fallen
  preserved_meaning: The military image remains while referring to those who died in battle.
  reasoning_layer_used: POB lexical decision for προπεπτωκότας and grounding review
  rationale: Retaining the full phrase is clearer than the label “the fallen,” and the footnote supplies the context.
- pob_phrase: it would be excessive and foolish to pray
  simplified_phrase: then praying ... would have been unnecessary and foolish
  preserved_meaning: Without resurrection in view, such prayer would be beyond what was needed and foolish.
  reasoning_layer_used: POB lexical decisions for περισσὸν and ληρῶδες
  rationale: “Unnecessary” states the intended sense more plainly than “excessive.”
translation_notes:
  risk_flags:
  - risk: “Those who had fallen” may not by itself identify the battle dead.
