translation:
  language: en
  text: He began the battle cry in his fathers’ language,[a] accompanied by hymns. He took Gorgias and his men by surprise, shook them, and put them to flight.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in the ancestral language”; the Greek may stress either the language itself or the cry’s ancestral character.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Beginning the battle cry in the language of his fathers, with hymns
  simplified_phrase: He began the battle cry in his fathers’ language, accompanied by hymns.
  preserved_meaning: The cry remains both military and religious, and it is delivered in the ancestral language.
  reasoning_layer_used: Lexical and theological decisions on the battle cry, ancestral language, and hymns.
  rationale: A complete sentence and “accompanied by” make the relationship between the cry and hymns immediately clear.
- pob_phrase: those around Gorgias
  simplified_phrase: Gorgias and his men
  preserved_meaning: The phrase refers to Gorgias and the forces with him.
  reasoning_layer_used: Lexical decision for τοῖς περὶ τὸν Γοργίαν.
  rationale: The clearer military expression avoids the misleading picture of people merely standing nearby.
- pob_phrase: he shook ... and put them to flight
  simplified_phrase: shook them, and put them to flight
  preserved_meaning: The vivid shaking image and the resulting military rout are both retained.
  reasoning_layer_used: Lexical decisions for ἐνσείσας and τροπὴν ἐποιήσατο.
  rationale: Keeping both actions preserves the source image without replacing it with a vague summary.
