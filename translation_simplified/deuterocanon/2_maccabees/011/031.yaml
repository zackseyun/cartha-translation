translation:
  language: en
  text: The Jews may use their own provisions[a] and follow their own laws, just as they did before. None of them will be harassed in any way over anything done in ignorance.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may refer to expenses, provisions, or customary food and other practical arrangements.
    reason: lexical_alternative
  - marker: b
    text: This broad phrase may refer to unintentional acts or matters not fully known; it does not identify a specific kind of offense.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: make use of their own provisions and laws
  simplified_phrase: use their own provisions and follow their own laws
  preserved_meaning: The Jews are permitted to resume both their practical arrangements and their law observance.
  reasoning_layer_used: POB lexical decisions for χρῆσθαι, δαπανήμασιν, and νόμοις
  rationale: Using separate natural verbs makes the two objects clear without weakening the legal-religious force of “laws.”
- pob_phrase: just as before
  simplified_phrase: just as they did before
  preserved_meaning: The permission restores the Jews’ earlier practice.
  reasoning_layer_used: POB lexical decision for καθὰ καὶ τὸ πρότερον
  rationale: Adding the subject and verb turns the compressed comparison into ordinary English.
- pob_phrase: concerning the things done in ignorance
  simplified_phrase: over anything done in ignorance
  preserved_meaning: They are protected from harassment regarding acts committed without full knowledge.
  reasoning_layer_used: POB theological decision on περὶ τῶν ἠγνοημένων
  rationale: The clearer phrasing retains the deliberately broad and unspecified scope of the clause.
translation_notes:
  risk_flags:
