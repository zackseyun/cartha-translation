translation:
  language: en
  text: They moved forward, arranged and ready for battle, with the ally from heaven before them, because the Lord had shown them mercy.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: advanced in battle formation
  simplified_phrase: moved forward, arranged and ready for battle
  preserved_meaning: They advanced while equipped and arrayed for combat.
  reasoning_layer_used: The lexical decision for ἐν διασκευῇ includes both military readiness and arrangement.
  rationale: The expanded wording makes the military image clear without using the less familiar phrase “battle formation.”
- pob_phrase: having the ally from heaven before them
  simplified_phrase: with the ally from heaven before them
  preserved_meaning: A heavenly ally was present ahead of them as they advanced.
  reasoning_layer_used: The lexical and theological decisions retain “ally” and leave its identity unspecified.
  rationale: The simpler clause preserves both the military force of “ally” and the text’s theological openness.
translation_notes:
  risk_flags:
  - risk: “Arranged and ready for battle” may sound slightly broader than the compressed Greek phrase.
    mitigation: Both ideas are supported by the POB lexical rationale for being equipped or arrayed for combat.
  - risk: Readers may want the ally from heaven identified more precisely.
    mitigation: The wording intentionally preserves the Greek text’s ambiguity between angelic help and God’s direct aid.
