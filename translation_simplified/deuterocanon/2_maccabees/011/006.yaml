translation:
  language: en
  text: When Maccabeus’s group learned that he was laying siege to the strongholds, they and the crowds begged the Lord with grief and tears to send a good angel for Israel’s salvation.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “to deliver Israel.” Here “salvation” includes rescue from the military threat.
    reason: lexical_alternative
