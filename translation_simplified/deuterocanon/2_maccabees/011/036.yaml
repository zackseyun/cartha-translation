  text: But for any matters that he has decided should be presented to the king, send someone immediately to look into them, so that we may settle them[a] as is proper for us. We are going on to Antioch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “handle them.” The Greek idiom may refer broadly to arranging or dealing with the matters appropriately.
