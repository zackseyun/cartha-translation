- pob_phrase: Maccabeus himself, taking up arms first
  simplified_phrase: Maccabeus himself was the first to take up arms
  preserved_meaning: Maccabeus personally took the lead in arming himself.
  reasoning_layer_used: Lexical decisions for αὐτός and πρῶτος
  rationale: The finite clause makes his leading initiative immediately clear.
- pob_phrase: urged the others, risking danger along with him, to come to the aid
