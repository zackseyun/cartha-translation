simplification_decisions:
- pob_phrase: since we also choose that this nation should be free from disturbance
  simplified_phrase: because we want this nation to be free from unrest
  preserved_meaning: The rulers prefer a policy that keeps the Jewish nation free from civil disorder.
  reasoning_layer_used: Lexical decisions for αἱρούμενοι and ἐκτὸς ταραχῆς
  rationale: The causal link and political sense are expressed in ordinary English.
- pob_phrase: we decide that the temple should be restored to them
  simplified_phrase: we have decided that the temple should be restored to them
  preserved_meaning: The government announces a policy of restoring the temple to the Jewish people without naming the restoring agents.
  reasoning_layer_used: Lexical decisions for κρίνομεν, τὸ ἱερὸν, and ἀποκατασταθῆναι
  rationale: The passive wording preserves the source while the tense reads naturally in an announcement.
- pob_phrase: they should live according to the customs of their ancestors
  simplified_phrase: they may live as a community according to the customs of their ancestors
  preserved_meaning: The concession permits Jewish communal life to follow inherited customs without granting political independence.
  reasoning_layer_used: Theological decision on the scope of πολιτεύεσθαι
  rationale: The wording clearly conveys permission concerning communal life rather than self-government.
