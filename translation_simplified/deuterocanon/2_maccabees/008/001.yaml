translation:
  language: en
  text: But Judas, also called Maccabeus, and his companions secretly made their way into the villages. They called their relatives to join them and welcomed those who had continued to follow Judaism.[a] In this way they gathered about six thousand people.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “Judaism” means the Jewish faith and way of life, in contrast to pressure to adopt Greek customs.
    reason: lexical_alternative
