translation:
  language: en
  text: They also took the money from the people who had come to buy them. Then they chased them for a considerable distance[a] before turning back from the region as they were being hemmed in.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “for a long while”; the Greek can refer to either distance or time.
    reason: lexical_alternative
  - marker: b
    text: The Greek does not specify what was hemming them in; time, terrain, or other circumstances may have constrained them.
    reason: lexical_alternative
