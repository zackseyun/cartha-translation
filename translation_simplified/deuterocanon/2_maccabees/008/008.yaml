- pob_phrase: But when Philip saw that the man was gradually making progress and advancing all the more often in successes
  simplified_phrase: Philip saw that the man was gradually making progress and succeeding more and more often
  preserved_meaning: Philip noticed the man’s steady progress and increasingly frequent successes.
  reasoning_layer_used: POB lexical decisions for κατὰ μικρόν, πυκνότερον, and ἐν ταῖς εὐημερίαις
  rationale: The rewrite removes the awkward success phrase while retaining gradual progress and increasing frequency.
- pob_phrase: he wrote to Ptolemy ... to come to the aid
  simplified_phrase: So he wrote to Ptolemy ... and asked him to come to the aid
  preserved_meaning: Philip’s observation prompted him to request Ptolemy’s direct assistance.
  reasoning_layer_used: POB lexical decisions for Συνιδών and ἐπιβοηθεῖν
  rationale: Two sentences make the cause and request easier to follow without weakening the call for aid.
- pob_phrase: the king’s cause
  simplified_phrase: the king’s cause
  preserved_meaning: Ptolemy was to support the king’s broader political and military interests.
  reasoning_layer_used: POB lexical decision for τοῖς τοῦ βασιλέως πράγματι
  rationale: The phrase is retained because narrower wording could reduce the king’s cause to one military action.
