translation:
  language: en
  text: Philip saw that the man[a] was gradually making progress and succeeding more and more often. So he wrote to Ptolemy, the governor of Coele-Syria and Phoenicia, and asked him to come to the aid of the king’s cause.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The man was Judas Maccabeus, who is being discussed in the surrounding passage.
    reason: cross_reference
