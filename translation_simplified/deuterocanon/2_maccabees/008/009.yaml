translation:
  language: en
  text: But he quickly chose Nicanor son of Patroclus, one of his chief Friends,[a] and sent him, placing at least twenty thousand troops drawn from peoples of every kind under his command.[b] His mission was to wipe out the entire Jewish people. They also appointed Gorgias to serve alongside Nicanor. Gorgias was a military man with extensive experience in war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Friends” was likely a court title for high-ranking royal associates, not merely personal friends.
    reason: cultural_note
  - marker: b
    text: The unusual Greek wording may refer to ethnically mixed forces or to peoples of every sort.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: selected Nicanor ... and sent him, having assigned to him no fewer than twenty thousand
  simplified_phrase: chose Nicanor ... and sent him, placing at least twenty thousand troops ... under his command
  preserved_meaning: Nicanor was chosen and given authority over a force numbering twenty thousand or more.
  reasoning_layer_used: Lexical decisions for προχειρισάμενος, ὑποτάξας, and οὐκ ἐλάττους τῶν δισμυρίων
  rationale: The recast removes the awkward participle while explicitly preserving Nicanor’s command.
- pob_phrase: to wipe out the whole Jewish people
  simplified_phrase: His mission was to wipe out the entire Jewish people.
  preserved_meaning: The assignment aimed at exterminating the Jews as a people.
  reasoning_layer_used: Lexical and theological decisions for ἐξᾶραι and γένος
  rationale: A separate sentence states the intended extermination clearly without using the misleading term “race.”
- pob_phrase: They also appointed with him Gorgias, a military man experienced in matters of war
  simplified_phrase: They also appointed Gorgias to serve alongside Nicanor. Gorgias was a military man with extensive experience in war.
  preserved_meaning: Gorgias was assigned as Nicanor’s military associate and had substantial wartime experience.
  reasoning_layer_used: Lexical decisions for συνέστησαν, στρατηγόν, and πεῖραν
  rationale: Two direct sentences clarify Gorgias’s relationship to Nicanor and his military competence.
interpretive_expansions:
- pob_phrase: twenty thousand from the nations of every tribe
  rendering: twenty thousand troops drawn from peoples of every kind
  claim: The twenty thousand were military forces placed under Nicanor’s command.
  evidence:
  - The POB rationale for ὑποτάξας identifies troops or peoples placed under Nicanor’s command.
  - The extermination mission and Gorgias’s military role establish a military setting.
  confidence: high
  alternatives_preserved:
  - The footnote retains the possibility of ethnically mixed forces.
  - The footnote retains the broader sense of peoples of every sort.
translation_notes:
  risk_flags:
  - risk: Capitalized “Friends” may initially seem to mean personal companions.
    mitigation: Footnote a identifies it as a likely royal court title.
  - risk: “Peoples of every kind” cannot fully reproduce the unusual Greek expression.
    mitigation: Footnote b preserves both leading senses documented by the POB.
