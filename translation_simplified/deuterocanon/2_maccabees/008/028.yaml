  rationale: The wording explains military spoils in common English while preserving that only a portion was given.
- pob_phrase: those who had been oppressed
  simplified_phrase: people who had suffered mistreatment
  preserved_meaning: The recipients had experienced harsh treatment, injury, or hardship.
  reasoning_layer_used: Lexical decision for τοῖς ἠκισμένοις
