translation:
  language: en
  text: Maccabeus gathered those who were with him, about six thousand in all. He urged them not to be terrified by the enemy[a] or afraid of the great number of nations that had unjustly come against them. Instead, they were to fight bravely.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek normally means “prisoners” or “captives,” but the wording is difficult here. The context points to hostile forces, so the text says “enemy.”
    reason: lexical_alternative
