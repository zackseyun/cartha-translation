translation:
  language: en
  text: So he immediately sent word to the coastal cities, inviting people to buy Jewish bodies.[a] He offered ninety bodies for one talent.[b] But he did not expect the punishment from the Almighty that was about to overtake him.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “bodies,” treating the Jewish captives as goods for sale; they were likely to be sold as slaves.
    reason: lexical_alternative
  - marker: b
    text: A talent was an ancient unit of weight used to measure money.
    reason: cultural_note
  - marker: c
    text: Or “the justice from the Almighty that was about to overtake him.”
    reason: alternative_reading
