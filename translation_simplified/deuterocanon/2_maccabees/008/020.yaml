translation:
  language: en
  text: This is what happened in the battle in Babylonia against the Galatians:[a] Eight thousand came when the crisis arose, along with four thousand Macedonians. When the Macedonians could find no way forward, the six thousand destroyed 120,000 because help came to them from heaven. They also gained a great advantage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Gauls.” The Greek term may refer to the Anatolian Galatians or more broadly to their Celtic identity.
    reason: alternative_reading
