  language: en
  text: 'The man who had promised to pay tribute to the Romans with the proceeds from capturing the people of Jerusalem kept declaring that the Jews had a defender who fought for them.[a] He said that this was why they could not be harmed: they obeyed the laws that had been commanded to them.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The defender is not named here, but the context points to God as the one fighting for the Jews.
    reason: alternative_reading
