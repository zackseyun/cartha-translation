translation:
  language: en
  text: He said, “They have put their trust in weapons and courage. But we have put our trust in Almighty God. With a single nod,[a] he can bring down both those advancing against us and the whole world.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “with one gesture” or “with a single sign”; the image emphasizes how effortlessly God can act.
