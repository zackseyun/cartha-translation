translation:
  language: en
  text: After they crushed the forces led by Timothy and Bacchides, they killed more than twenty thousand of them. They also took firm control of very high fortresses. Then they divided the large amount of goods they had captured, giving themselves the same share as the oppressed, orphans, widows, and even the elderly.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “giving the oppressed, orphans, widows, and even the elderly equal shares with them.” The Greek pronoun can be understood either way.
    reason: alternative_reading
