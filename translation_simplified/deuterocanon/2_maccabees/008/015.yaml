translation:
  language: en
  text: He would do this not because they deserved it, but because of the covenants he had made with their ancestors and because his majestic and magnificent name had been called over them, marking them as his people.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: and not because of them
  simplified_phrase: not because they deserved it
  preserved_meaning: God's action was not grounded in the people's own merit.
  reasoning_layer_used: theological decision and lexical rationale
  rationale: The clearer wording preserves the negated basis without adding a broader doctrine of merit.
- pob_phrase: the covenants made with their fathers
  simplified_phrase: the covenants he had made with their ancestors
  preserved_meaning: God acts because of his covenant commitments to earlier generations.
  reasoning_layer_used: POB lexical decision
  rationale: “Ancestors” communicates the historical sense of “fathers” in common English.
- pob_phrase: the invocation of his majestic and magnificent name over them
  simplified_phrase: his majestic and magnificent name had been called over them, marking them as his people
  preserved_meaning: God's name was publicly associated with the people in covenantal language.
  reasoning_layer_used: lexical rationale and cultural note
  rationale: The active verbal wording explains the unfamiliar noun “invocation” while retaining the image of the name called over them.
interpretive_expansions:
- pob_phrase: not because of them
  rendering: not because they deserved it
  claim: The phrase denies that the people themselves provided the basis for God's favorable action.
  evidence:
  - The POB theological decision explicitly contrasts their merit with the two stated grounds.
  confidence: high
  alternatives_preserved:
  - not for their sake
  - not because of them
- pob_phrase: invocation of his majestic and magnificent name over them
  rendering: his majestic and magnificent name had been called over them, marking them as his people
  claim: Having God's name called over them identifies them as his people.
  evidence:
  - The POB cultural note identifies this as an idiom for God's name being called over his people.
  - The lexical rationale describes the wording as covenantal language.
  confidence: high
  alternatives_preserved:
  - his name had been invoked over them
  - his name had been called over them
translation_notes:
  risk_flags:
  - risk: “Deserved it” makes the implied issue of merit explicit.
    mitigation: The wording is limited to the stated basis for this action and follows the POB theological rationale.
  - risk: “Marking them as his people” explains rather than literally reproduces the idiom.
    mitigation: The name-called-over image remains in the main text before the explanation.
