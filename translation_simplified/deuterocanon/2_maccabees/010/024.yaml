simplification_decisions:
- pob_phrase: having heard that
  simplified_phrase: They had heard that
  preserved_meaning: The hearing happened before the surrounding action.
  reasoning_layer_used: Lexical decision for ἀκηκοότες
  rationale: A complete clause is easier to follow than an opening participle.
- pob_phrase: did not approve of their father's change to Greek ways
  simplified_phrase: did not accept their father's change to Greek ways
  preserved_meaning: The Jews opposed the cultural and religious shift toward Greek practices.
  reasoning_layer_used: Lexical and theological decisions for μὴ συνεὐδοκοῦντας and εἰς τὰ Ἑλληνικά
  rationale: “Did not accept” states their opposition plainly while retaining the completed change.
- pob_phrase: requesting that their own laws be permitted to them
  simplified_phrase: asked to be allowed to follow their own lawful customs
  preserved_meaning: They sought permission to continue their Jewish observances, which had both legal and customary force.
  reasoning_layer_used: Lexical and theological decisions for ἀξιοῦν and τὰ νόμιμα
  rationale: This wording makes the request natural without separating the customs from a supposedly distinct law.
