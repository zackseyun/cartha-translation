simplification_decisions:
- pob_phrase: As before, being in battle array
  simplified_phrase: They formed their battle lines as before
  preserved_meaning: They took up a military formation like they had on an earlier occasion.
  reasoning_layer_used: POB lexical decisions for τὸ πρόηγον and ἐν διασκευῇ
  rationale: The active clause replaces an awkward participle while retaining the earlier-campaign comparison and military setting.
- pob_phrase: having the ally from heaven
  simplified_phrase: The ally from heaven was with them
  preserved_meaning: They had heavenly aid described through a military image.
  reasoning_layer_used: POB lexical and theological decisions for σύμμαχον
  rationale: The new sentence is easier to read but does not identify the ally more precisely than the Greek does.
- pob_phrase: because the Lord had shown them mercy
  simplified_phrase: because the Lord had shown them mercy
  preserved_meaning: The Lord’s mercy explains why heavenly aid was with them.
  reasoning_layer_used: POB lexical decision for ἐλεήσαντος and τοῦ κυρίου
  rationale: The clear causal wording is retained because it already reads naturally.
translation_notes:
  risk_flags:
