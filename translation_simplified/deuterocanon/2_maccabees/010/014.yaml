  preserved_meaning: The parties would reach a settlement based on what was just in the negotiations.
  reasoning_layer_used: POB lexical decisions for συλλύεσθαι and ἐπὶ πᾶσι τοῖς δικαίοις
  rationale: This makes the diplomatic action clear while the footnote preserves the uncertain reconciliation sense.
- pob_phrase: and that he would also persuade the king
  simplified_phrase: He also said that he would persuade the king
  preserved_meaning: His persuasion included a statement or promise that he would also persuade the king.
  reasoning_layer_used: POB lexical decision for διότι καὶ τὸν βασιλέα πείσει and grounding review
  rationale: A separate sentence avoids presenting the promise as the definite means of persuasion.
- pob_phrase: compelling him to become their friend
  simplified_phrase: indeed, force him—to become their friend
  preserved_meaning: He would strongly pressure the king to become politically favorable toward them.
  reasoning_layer_used: POB lexical decisions for ἀναγκάζων γενέσθαι and φίλον αὐτοῖς
  rationale: “Force” states the strong pressure plainly, while “friend” preserves the source image.
