translation:
  language: en
  text: Just as a crow is between heaven and earth,[a] so it is with these gods. When fire enters a house[b] containing gods made of wood or covered with gold or silver, their priests will run away and escape. But the gods themselves will burn up like the beams in the middle of the building.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek comparison is abrupt; it pictures the idols as helpless as an exposed crow when disaster comes.
    reason: cultural_note
  - marker: b
    text: Or “a temple.”
    reason: lexical_alternative
