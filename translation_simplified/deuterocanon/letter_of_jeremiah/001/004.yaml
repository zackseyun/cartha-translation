  preserved_meaning: The warning follows from what was said before and calls for urgent caution.
  reasoning_layer_used: Lexical decisions for οὖν and εὐλαβήθητε
  rationale: “So” expresses the logical link in natural modern English while retaining the urgent command.
- pob_phrase: lest you too, having become like the foreigners, become like them
  simplified_phrase: Do not become like the foreigners—do not become like them—
  preserved_meaning: The hearers are emphatically warned against becoming like the foreign peoples.
  reasoning_layer_used: Lexical decision for μὴ καὶ ὑμεῖς and repeated ἀφομοιόω; theological decision preserving contextual breadth
