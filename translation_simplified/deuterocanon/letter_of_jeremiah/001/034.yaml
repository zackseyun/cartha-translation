translation:
  language: en
  text: In the same way, these idols cannot possibly give anyone wealth or bronze.[a] If someone makes a vow to them but does not pay what was promised, the idols will never seek that payment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “copper”; the metal may refer to money or other valuables made from it.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Likewise, they are certainly not able to give either wealth or bronze
  simplified_phrase: In the same way, these idols cannot possibly give anyone wealth or bronze
  preserved_meaning: The idols are completely unable to provide material wealth or valuable metal.
  reasoning_layer_used: Lexical decisions and theological context
  rationale: “Cannot possibly” expresses the Greek’s strong negation in natural English.
- pob_phrase: if someone makes a vow to them and does not pay it back
  simplified_phrase: If someone makes a vow to them but does not pay what was promised
  preserved_meaning: The worshiper fails to provide what the vow obligated him or her to give.
  reasoning_layer_used: Lexical decision for ἀποδῷ
  rationale: The wording explains what paying a vow means while retaining the concrete idea of payment.
- pob_phrase: they will certainly not seek it
  simplified_phrase: the idols will never seek that payment
  preserved_meaning: The idols do not pursue fulfillment of the unpaid vow.
  reasoning_layer_used: Lexical decision for ἐπιζητήσωσιν and doctrine realignment
  rationale: “Seek” is retained, while “that payment” makes its object clear.
