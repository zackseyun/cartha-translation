translation:
  language: en
  text: Their priests take back[a] the sacrifices and use them for themselves. In the same way, the women among them preserve some of the food[b] but share none of it with the poor or the helpless.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “receive back”; the priests reclaim or receive the offerings for their own use.
    reason: lexical_alternative
  - marker: b
    text: The food was probably preserved by salting or curing it.
    reason: cultural_note
