- pob_phrase: their priests, taking back their sacrifices, make use of them
  simplified_phrase: Their priests take back the sacrifices and use them for themselves
  preserved_meaning: The priests reclaim the offerings for their own use without adding an explicit charge of misuse.
  reasoning_layer_used: Lexical and theological decisions for ἀποδιδόμενοι and καταχρῶνται.
  rationale: The participial clause becomes a direct sentence while the context still carries the criticism.
- pob_phrase: likewise their women
  simplified_phrase: In the same way, the women among them
  preserved_meaning: The women belong to the group under discussion without defining their relationship more narrowly.
  reasoning_layer_used: POB base text and documented ambiguity.
  rationale: This wording is more natural but does not assume that they are the priests’ wives.
- pob_phrase: give none to the poor or the helpless
  simplified_phrase: share none of it with the poor or the helpless
  preserved_meaning: They withhold every portion from people who are poor or lack strength and ability.
  reasoning_layer_used: Lexical decisions for μεταδῶσιν, πτωχῷ, and ἀδυνάτῳ.
  rationale: “Share” clearly expresses giving someone a portion of what they have.
