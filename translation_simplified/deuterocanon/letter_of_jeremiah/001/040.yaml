translation:
  language: en
  text: Even the Chaldeans themselves treat these idols with contempt. Whenever they see someone who cannot speak, they bring that person before Bel[a] and ask Bel to make the person speak—as if Bel were able to notice.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bel was a Babylonian name or title associated with the god Marduk.
    reason: cultural_note
  - marker: b
    text: Or, “understand” or “take notice.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Moreover, even the Chaldeans themselves dishonor them
  simplified_phrase: Even the Chaldeans themselves treat these idols with contempt
  preserved_meaning: The idols’ own worshipers subject them to dishonoring treatment.
  reasoning_layer_used: Lexical decisions and theological decision on practical exposure of the idols’ helplessness
  rationale: The wording names the idols and uses the clearer lexical alternative without weakening the accusation.
- pob_phrase: whenever they see a mute person unable to speak
  simplified_phrase: Whenever they see someone who cannot speak
  preserved_meaning: The person is unable to speak.
  reasoning_layer_used: Lexical decision for ἐνεὸν and its explanatory participle
  rationale: This removes repetition while preserving the person’s condition.
- pob_phrase: ask that he make him speak, as though he were able to perceive
  simplified_phrase: ask Bel to make the person speak—as if Bel were able to notice
  preserved_meaning: They ask Bel to restore speech even though the idol cannot perceive or respond.
  reasoning_layer_used: Lexical decisions for ἐξιοῦσιν φωνῆσαι and αἰσθέσθαι
  rationale: Repeating the names of the participants removes unclear pronouns while retaining the irony.
