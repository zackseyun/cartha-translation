translation:
  language: en
  text: They cannot decide even their own case[a] or rescue anyone who has been wronged, because they have no power.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “They cannot decide judgment for themselves or deliver from injustice.” The compact Greek may refer to injustice, a case involving injustice, or the person who was wronged.
