  rationale: “Decide” makes the legal action immediately clear while retaining the idea of a case.
- pob_phrase: rescue one who is wronged
  simplified_phrase: rescue anyone who has been wronged
  preserved_meaning: The idols cannot deliver a person suffering injustice.
  reasoning_layer_used: Lexical decision for ἀδίκημα
  rationale: The fuller clause uses ordinary English without resolving the Greek ambiguity beyond the POB choice.
- pob_phrase: because they are powerless
