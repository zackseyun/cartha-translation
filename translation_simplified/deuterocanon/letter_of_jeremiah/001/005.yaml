translation:
  language: en
  text: When you see people gathered in front of them and behind them, bowing down to them,[a] say silently, “Master, you are the one who must be worshiped.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “worshiping them”; the word describes bowing down as an act of worship.
    reason: lexical_alternative
