  preserved_meaning: The gods are wooden objects with precious metal only on their surface.
  reasoning_layer_used: POB lexical decision for περιάργυροι καὶ περίχρυσοι
  rationale: “Covered with” plainly communicates their crafted outer coating.
- pob_phrase: will certainly not save themselves from thieves or robbers
