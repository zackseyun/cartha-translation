translation:
  language: en
  text: So a king who shows his courage is better than the false gods. A useful household object that its owner can use is better than the false gods. A door that protects the things inside the house is better than the false gods. A wooden pillar in a palace is better than the false gods.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: a king who displays his own courage
  simplified_phrase: a king who shows his courage
  preserved_meaning: The king visibly demonstrates his own bravery.
  reasoning_layer_used: Lexical decision for ἐπιδεικνύμενον τὴν ἑαυτοῦ ἀνδρείαν
  rationale: “Shows his courage” expresses the same action in common English.
- pob_phrase: a useful vessel in a house, which its owner will use
  simplified_phrase: a useful household object that its owner can use
  preserved_meaning: An ordinary object has practical value because its owner can use it.
  reasoning_layer_used: Lexical decisions for σκεῖος, χρήσιμον, and ἐφʼ ᾧ χρήσεται ὁ κεκτημένος
  rationale: “Household object” avoids the opaque modern sense of “vessel” while keeping the term broad.
- pob_phrase: or the false gods ... or the false gods ... better than the false gods
  simplified_phrase: Each sentence ends with “better than the false gods.”
  preserved_meaning: The repeated contrast emphasizes that useful people and objects surpass the false gods.
  reasoning_layer_used: Theological decision on the repeated rhetorical comparison
  rationale: Separate sentences preserve the Greek repetition without tangled coordination.
translation_notes:
  risk_flags:
  - risk: “Household object” is less concrete than the traditional word “vessel.”
    mitigation: The broad wording preserves the lexical range of an object, implement, or container.
