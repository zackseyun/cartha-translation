translation:
  language: en
  text: In the same way, their gods are made of wood and covered with gold and silver. They are like a scarecrow in a garden that every bird perches on, or like a dead body thrown away in the dark.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Greek word translated “scarecrow” may instead mean a post or watch-figure set up in a garden.
    reason: lexical_alternative
