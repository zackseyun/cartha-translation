  preserved_meaning: He refuses religious honor to human-made cult images.
  reasoning_layer_used: Lexical decisions for σέβομαι, εἴδωλα, and χειροποίητα
  rationale: “Honor” is more familiar than “revere,” and “human hands” makes the Creator-idol contrast clear.
- pob_phrase: but the living God
  simplified_phrase: Instead, I honor the living God
  preserved_meaning: His refusal to honor idols is contrasted with his honor for the true, living God.
