simplification_decisions:
- pob_phrase: And the king said to Daniel
  simplified_phrase: The king told Daniel
  preserved_meaning: The king addresses Daniel directly.
  reasoning_layer_used: The lexical decision identifies Daniel as the indirect object of the king’s speech.
  rationale: “Told Daniel” gives the same narrative transition in more natural English.
- pob_phrase: You cannot say that this is not a living god; and bow down to him.
  simplified_phrase: You cannot claim that this is not a living god. Bow down to him.
  preserved_meaning: The king challenges Daniel’s denial and commands him to bow before Bel.
  reasoning_layer_used: The lexical and theological decisions preserve lowercase “living god” and the concrete act of bowing.
  rationale: Two sentences make the challenge and command immediately clear without adding a causal link.
