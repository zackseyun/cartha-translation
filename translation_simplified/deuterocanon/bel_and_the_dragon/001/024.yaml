translation:
  language: en
  text: The king told Daniel, “You cannot claim that this is not a living god. Bow down to him.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Worship him.” The Greek verb can mean bowing down in homage or worshiping, especially when directed toward a deity.
