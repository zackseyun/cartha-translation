- pob_phrase: And Daniel took pitch and fat and hair, and boiled them together and made cakes
  simplified_phrase: Daniel took tar-like pitch, fat, and hair. He boiled them together, shaped the mixture into cakes
  preserved_meaning: Daniel combined the three ingredients by boiling them and formed the mixture into cakes.
  reasoning_layer_used: POB lexical decisions for πίσσαν, ἥψησεν ἐπὶ τὸ αὐτό, and μάζας
  rationale: Short sentences and an explicit mixture make the preparation sequence easy to follow.
- pob_phrase: and when the dragon had eaten them, it burst apart
  simplified_phrase: After the dragon ate them, it burst apart
  preserved_meaning: The dragon violently ruptured after eating the cakes.
  reasoning_layer_used: POB lexical decisions for φαγὼν and διερράγη
  rationale: A direct time clause preserves the sequence in ordinary English.
- pob_phrase: See your objects of worship
