translation:
  language: en
  text: Daniel took tar-like pitch, fat, and hair. He boiled them together, shaped the mixture into cakes, and put them into the dragon’s mouth. After the dragon ate them, it burst apart. Then Daniel said, “Look at your objects of worship!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “your sacred things” or “the things you revere”; the Greek refers to objects held in reverence or worship.
    reason: lexical_alternative
