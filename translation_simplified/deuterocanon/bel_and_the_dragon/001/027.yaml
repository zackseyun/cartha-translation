  preserved_meaning: Daniel points to what the people revered, allowing the scene itself to expose its falsehood.
  reasoning_layer_used: POB theological decision for τὰ σεβάσματα ὑμῶν
  rationale: “Look” is natural here while “objects of worship” avoids the sharper interpretive term “idols.”
