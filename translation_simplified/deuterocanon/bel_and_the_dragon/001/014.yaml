translation:
  language: en
  text: They consumed all of it. After those men left, the king placed the food before Bel. Daniel commanded his young servants to bring ashes, and they scattered them throughout the whole temple in the presence of the king alone.[a] Then they went out, shut the door, sealed it with the king’s signet ring, and left.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek emphasizes the king alone, though Daniel’s servants carried out the scattering.
    reason: source_note
