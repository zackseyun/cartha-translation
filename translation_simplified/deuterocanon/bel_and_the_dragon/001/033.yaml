  text: Habakkuk the prophet was in Judea.[a] He had cooked a stew and crumbled bread into a bowl. He was going to the field to take the food to the harvesters.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Judah.” The Greek word can refer to either Judea or Judah.
    reason: lexical_alternative
