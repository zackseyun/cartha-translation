  preserved_meaning: They were immediately eaten while the king was present.
  reasoning_layer_used: Lexical decisions for κατεβρώθησαν, παραχρῆμα, and ἐνώπιον αὐτοῦ
  rationale: Naming the king clarifies the referent without claiming that he actively watched.
