  preserved_meaning: Daniel was drawn upward from the pit.
  reasoning_layer_used: Lexical decision for ἀνέσπασεν and immediate context
  rationale: Naming Daniel clarifies the pronoun while preserving the upward movement.
- pob_phrase: those responsible for his destruction
  simplified_phrase: the people who had tried to destroy Daniel
  preserved_meaning: Those punished were responsible for seeking Daniel’s ruin.
  reasoning_layer_used: Lexical decisions for αἰτίους and ἀπώλεια
  rationale: The active wording makes their guilt clear without implying that Daniel was destroyed.
- pob_phrase: and they were devoured at once before him
