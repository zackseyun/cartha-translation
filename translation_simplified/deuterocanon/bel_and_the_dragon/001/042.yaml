translation:
  language: en
  text: “Daniel, there is no one else besides you!”[a] Then he pulled Daniel up. He threw the people who had tried to destroy Daniel into the pit,[b] and they were devoured at once in the king’s presence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek begins abruptly and may continue the speech from the previous verse; some translations add words such as “the king said.”
    reason: textual_variant
  - marker: b
    text: The Greek literally says “pit”; in this context, it is the lions’ den.
    reason: lexical_alternative
