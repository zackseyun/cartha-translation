translation:
  language: en
  text: Through careful planning and the sword, they took control of the whole region, even though it was very far away. Kings came against them from distant parts of the earth, but they crushed those kings and dealt them a devastating blow. Those who remained pay them tribute every year.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Those who remained” may refer to the remaining rulers or peoples; tribute was a payment imposed by a ruling power.
    reason: cultural_note
simplification_decisions:
- pob_phrase: by their counsel and by the sword
  simplified_phrase: Through careful planning and the sword
  preserved_meaning: Roman success came through deliberate strategy and military power.
  reasoning_layer_used: POB lexical decisions for βουλή and ῥομφαία
  rationale: “Careful planning” clarifies “counsel” while retaining the sword image.
- pob_phrase: the kings who came against them from the end of the earth
  simplified_phrase: Kings came against them from distant parts of the earth
  preserved_meaning: Hostile kings came against Rome from extremely distant places.
  reasoning_layer_used: POB lexical decisions and footnote a
  rationale: The recast clause clarifies the distance without narrowing the action to an explicit attack.
- pob_phrase: struck them with a great blow
  simplified_phrase: dealt them a devastating blow
  preserved_meaning: The Romans inflicted a severe and decisive defeat.
  reasoning_layer_used: POB lexical decision for ἐπάταξαν ἐν αὐτοῖς πληγὴν μεγάλην
  rationale: The familiar expression preserves the forceful blow metaphor.
translation_notes:
  risk_flags:
  - risk: “Those who remained” has an uncertain referent.
    mitigation: The broad wording is retained, and the footnote preserves rulers or peoples as possibilities.
