translation:
  language: en
  text: Each year they entrust one man with authority to govern them and exercise control over all their land. Everyone listens to him,[a] and there is no envy or jealousy among them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “obeys him.” The Greek literally says “listens to the one,” but in this governing context it can imply obedience.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: entrust one man to rule over them each year
  simplified_phrase: Each year they entrust one man with authority to govern them
  preserved_meaning: One man receives delegated governing authority for a yearly term.
  reasoning_layer_used: Lexical decisions for πιστεύουσιν, ἑνὶ ἀνθρώπῳ, ἄρχειν, and κατ’ ἐνιαυτόν
  rationale: The recast sentence makes the annual appointment easier to follow while retaining delegated authority and the explicitly male singular.
- pob_phrase: to exercise lordship over all their land
  simplified_phrase: exercise control over all their land
  preserved_meaning: The man holds strong governing power throughout their territory.
  reasoning_layer_used: Lexical decisions for κυριεύειν and πάσης τῆς γῆς αὐτῶν
  rationale: “Exercise control” communicates the force of lordship in ordinary political English without reducing it to generic leadership.
- pob_phrase: all listen to the one
  simplified_phrase: Everyone listens to him
  preserved_meaning: All heed the one governing man, with obedience possible in context.
  reasoning_layer_used: Lexical decision for ἀκούουσιν τοῦ ἑνός and POB footnote
  rationale: The natural pronoun removes awkward wording while the footnote preserves the possible stronger sense “obeys.”
translation_notes:
  risk_flags:
  - risk: Modern readers may take “listens” as mere hearing rather than compliance.
    mitigation: The footnote preserves “obeys him” as the contextual lexical alternative.
