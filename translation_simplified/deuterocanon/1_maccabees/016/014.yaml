translation:
  language: en
  text: Simon was making the rounds through the cities of the country and overseeing their affairs. He went down to Jericho with his sons Mattathias and Judas. This was in the one hundred seventy-seventh year, during the eleventh month, called Shebat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek form of the month’s name is “Sabat”; “Shebat” is the standard English form.
    reason: lexical_alternative
