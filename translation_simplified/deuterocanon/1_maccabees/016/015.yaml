translation:
  language: en
  text: The son of Abubus welcomed them into the fortress called Dok, which he had built. But his welcome was deceitful. He served them a lavish banquet[a] and had men hidden there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “he prepared a great drinking feast for them.” The Greek wording especially emphasizes drinking.
    reason: lexical_alternative
