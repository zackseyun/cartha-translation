- pob_phrase: welcomed them into the stronghold called Dok with deceit, which he had built
  simplified_phrase: welcomed them into the fortress called Dok, which he had built. But his welcome was deceitful.
  preserved_meaning: He received them hospitably at his fortified place while acting deceptively.
  reasoning_layer_used: POB lexical decisions for ὑπεδέξατο, ὀχύρωματιν, μετὰ δόλου, and ὃ ᾠκοδόμησεν
  rationale: Splitting the sentence makes the false welcome and prior construction of Dok immediately clear.
- pob_phrase: he gave them a great banquet
  simplified_phrase: He served them a lavish banquet
  preserved_meaning: He provided an abundant feast as part of the deceptive hospitality.
  reasoning_layer_used: POB lexical decision for ἐποίησεν αὐτοῖς πότον μέγαν
  rationale: “Served” and “lavish” express the hospitality and abundance in natural modern English.
- pob_phrase: he had men hidden there
  simplified_phrase: had men hidden there
  preserved_meaning: He deliberately arranged for men to remain concealed at Dok.
  reasoning_layer_used: POB lexical decision for ἐνέκρυψεν ἐκεῖ ἄνδρας
  rationale: The direct wording already clearly conveys the deliberate concealment.
