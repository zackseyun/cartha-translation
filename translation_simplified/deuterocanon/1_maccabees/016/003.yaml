  preserved_meaning: They have attained sufficient age and maturity through merciful favor.
  reasoning_layer_used: POB lexical decision for ἐν τῷ ἐλέει and ἱκανοί ἐστε ἐν τοῖς ἔτεσιν
  rationale: The wording makes their attained maturity natural in English without naming the giver of mercy.
