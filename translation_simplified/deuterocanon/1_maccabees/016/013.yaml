translation:
  language: en
  text: His heart rose in pride.[a] He intended to seize control of the country. Using deceit, he plotted against Simon and his sons to remove them.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “his heart was lifted up”; the expression means that he became proud.
    reason: lexical_alternative
  - marker: b
    text: “Remove them” may mean to do away with them and, in this context, likely implies killing them.
    reason: lexical_alternative
