translation:
  language: en
  text: Simon replied, “We have not taken anyone else’s land or seized anything belonging to others. We hold only our ancestral inheritance, which our enemies unjustly took over in the past.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “arbitrarily” or “without due process.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And Simon answered and said to him
  simplified_phrase: Simon replied
  preserved_meaning: Simon directly answers the man speaking to him.
  reasoning_layer_used: POB translation and ordinary English discourse
  rationale: The shorter wording removes a repetitive speech formula without changing the action.
- pob_phrase: neither taken foreign land nor seized what belongs to others
  simplified_phrase: not taken anyone else’s land or seized anything belonging to others
  preserved_meaning: Simon denies taking land or other holdings that rightfully belong to other people.
  reasoning_layer_used: Lexical decisions for ἀλλοτρίαν, ἀλλοτρίων, and κεκρατήκαμεν
  rationale: “Anyone else’s land” makes the ownership sense immediately clear.
- pob_phrase: but only the inheritance of our fathers, which at one time was unjustly taken over by our enemies
  simplified_phrase: We hold only our ancestral inheritance, which our enemies unjustly took over in the past
  preserved_meaning: Simon claims only ancestral property that enemies had previously taken without justice.
  reasoning_layer_used: Lexical and theological decisions for κληρονομίας, ἀκρίτως, and the ancestral claim
  rationale: “Our ancestral inheritance” preserves the patrimonial claim without implying personal receipt from their fathers.
translation_notes:
  risk_flags:
  - risk: “In the past” is broader than the indefinite phrase “at one time.”
    mitigation: It still indicates an unspecified earlier time without adding a date or duration.
