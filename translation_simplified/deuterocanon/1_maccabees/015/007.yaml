  reasoning_layer_used: POB lexical decision for ἐλεύθερα and the political context
  rationale: The future wording states the royal concession more naturally without narrowing what “free” includes.
- pob_phrase: the strongholds that you have built, which you hold
  simplified_phrase: the fortresses you have built and control
  preserved_meaning: The fortified places he built and possesses remain under his authority.
  reasoning_layer_used: POB lexical decisions for ὀχυρώματα and ὧν κρατεῖς
  rationale: “Fortresses” and “control” make the military and political sense immediately clear.
- pob_phrase: shall remain yours
