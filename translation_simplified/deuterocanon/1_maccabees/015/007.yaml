translation:
  language: en
  text: But Jerusalem and the holy places[a] will be free. All the weapons you have made will remain yours, along with the fortresses you have built and control.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “the sanctuary” or “the holy things.”
    reason: lexical_alternative
