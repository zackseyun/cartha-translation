translation:
  language: en
  text: He formed a ring around the city, while the ships closed in from the sea. He kept pressing hard against the city from both land and sea, and he did not let anyone leave or enter.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: encircled the city
  simplified_phrase: formed a ring around the city
  preserved_meaning: The forces surrounded the city in a circle.
  reasoning_layer_used: The lexical decision for ἐκύκλωσεν preserves the concrete circular military image.
  rationale: This wording explains “encircled” while retaining its circular image.
- pob_phrase: pressed the city from the land and from the sea
  simplified_phrase: kept pressing hard against the city from both land and sea
  preserved_meaning: The city faced strong, continuing pressure from both directions.
  reasoning_layer_used: The lexical rationale for συνέθλιβεν requires strong force and ongoing action.
  rationale: “Kept pressing hard” clearly preserves both the verb’s force and its duration.
- pob_phrase: allowed no one to go out or to come in
  simplified_phrase: did not let anyone leave or enter
  preserved_meaning: The blockade stopped all movement out of and into the city.
  reasoning_layer_used: The lexical decision treats the movement pair as conveying a total blockade.
  rationale: “Leave or enter” expresses the same contrast in natural modern English.
