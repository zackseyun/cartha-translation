translation:
  language: en
  text: 'He sent Athenobius, one of his Friends,[a] to speak with him. He sent this message: “You are holding Joppa, Gazara,[b] and the citadel in Jerusalem.[c] These cities belong to my kingdom.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Friends” was probably an official title for members of the royal court.
    reason: cultural_note
  - marker: b
    text: Gazara is the Greek form of the place-name commonly known as Gezer.
    reason: cross_reference
  - marker: c
    text: Or “the Acra in Jerusalem,” the name of Jerusalem’s Seleucid fortress.
    reason: lexical_alternative
