translation:
  language: en
  text: Because some men who are like a plague have seized control of our ancestral kingdom,[a] I intend to claim the kingdom for myself and restore it to its former state. So I have recruited many troops[b] and made warships ready.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “some plagues”; this is an insulting image for destructive people.
    reason: lexical_alternative
  - marker: b
    text: The troops may have included foreign or hired soldiers.
    reason: lexical_alternative
  - marker: c
    text: The Greek may mean that he prepared, equipped, or built the warships.
    reason: lexical_alternative
