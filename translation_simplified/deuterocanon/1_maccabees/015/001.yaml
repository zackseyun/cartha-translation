translation:
  language: en
  text: Antiochus, the son of King Demetrius, sent letters from the islands in the sea to Simon, priest and ethnarch[a] of the Jews[b], and to the whole nation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: An ethnarch was the official ruler or leader of a people or nation.
    reason: cultural_note
  - marker: b
    text: Or “Judeans”; the Greek word can refer to the Jewish people or to the people of Judea, depending on the context.
    reason: lexical_alternative
