translation:
  language: en
  text: If you refuse, pay 500 talents of silver[a] in exchange for them. Also pay another 500 talents for the destruction you caused and for the cities’ taxes.[b] If you refuse, they will come and wage war against you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A talent was an ancient unit used to weigh large amounts of precious metal.
    reason: cultural_note
  - marker: b
    text: Or “the tribute from the cities.”
    reason: lexical_alternative
