translation:
  language: en
  text: But King Antiochus again set up camp to attack Dora.[a] He kept sending his forces against the city and building siege engines. He trapped Tryphon inside, so that Tryphon could neither enter nor leave.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek phrase most likely means “again” in this military setting, though it may also mean “on the second day.”
    reason: alternative_reading
