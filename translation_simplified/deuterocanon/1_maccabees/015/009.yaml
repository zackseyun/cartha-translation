translation:
  language: en
  text: Once we have established our kingdom, we will give great honor[a] to you, your nation, and the sanctuary.[b] This will make your honor known throughout the earth.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek repeatedly uses related words for “glory” and “glorify”; here they refer to public honor in a royal and political setting.
    reason: lexical_alternative
  - marker: b
    text: “The sanctuary” may also be translated “the temple,” including its sacred grounds.
    reason: lexical_alternative
  - marker: c
    text: “Throughout the earth” may also mean “throughout the land” or “throughout the world.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And when we establish our kingdom
  simplified_phrase: Once we have established our kingdom
  preserved_meaning: The promised action depends on the future establishment of the kingdom.
  reasoning_layer_used: Lexical decision for καταστήσωμεν and its future contingency.
  rationale: “Once” expresses the future condition in natural English.
- pob_phrase: we will honor you and your nation and the sanctuary with great honor
  simplified_phrase: we will give great honor to you, your nation, and the sanctuary
  preserved_meaning: The king promises distinguished public honor to all three recipients.
  reasoning_layer_used: Lexical decisions for δοξάζω, ἔθνος, ἱερόν, and δόξῃ μεγάλῃ.
  rationale: The recast avoids awkward repetition while retaining the political sense of honor.
- pob_phrase: so that your honor may become evident in all the earth
  simplified_phrase: This will make your honor known throughout the earth
  preserved_meaning: The promised honoring will result in their public reputation becoming widely recognized.
  reasoning_layer_used: Lexical decisions for φανερὰν γενέσθαι, τὴν δόξαν ὑμῶν, and ἐν πάσῃ τῇ γῇ.
  rationale: “This will make” clearly preserves the result connection without presenting mere sequence.
translation_notes:
  risk_flags:
  - risk: “Known” is less visual than the Greek expression “become evident.”
    mitigation: It naturally conveys publicly visible reputation in this diplomatic context.
  - risk: “Earth” leaves the geographic scope broad.
    mitigation: The footnote preserves the possible senses “land” and “world.”
