translation:
  language: en
  text: Today he will be lifted high,[a] but he will be nowhere to be found, because he has returned to his dust, and his plans have come to nothing.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lifted high” may mean raised to a position of status or prominence.
    reason: lexical_alternative
  - marker: b
    text: The Greek can also refer to his thought or reasoning.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: will be exalted
  simplified_phrase: will be lifted high
  preserved_meaning: The person is raised in status while the Greek image of upward movement remains.
  reasoning_layer_used: Lexical decision for ἐπαρθήσεται and latest revision pass
  rationale: This is clearer than “exalted” while preserving the source image.
- pob_phrase: he will surely not be found
  simplified_phrase: he will be nowhere to be found
  preserved_meaning: The emphatic denial says that he will be completely absent.
  reasoning_layer_used: Lexical decision for οὐ μὴ εὑρεθῇ
  rationale: This common idiom naturally conveys the clause’s strong negation.
- pob_phrase: his plans have perished
  simplified_phrase: his plans have come to nothing
  preserved_meaning: His plans cease at death without implying that his soul is destroyed.
  reasoning_layer_used: Lexical and theological decisions for διαλογισμός and ἀπώλετο
  rationale: This plainly expresses their final end without adding a doctrinal claim.
translation_notes:
  risk_flags:
  - risk: “Lifted high” could be mistaken for physical elevation.
    mitigation: The footnote gives raised status or prominence as the likely sense.
  - risk: “Plans” narrows the broader Greek idea of thought or reasoning.
    mitigation: The footnote preserves those lexical alternatives.
