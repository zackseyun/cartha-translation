translation:
  language: en
  text: Her glorious vessels[a] were forcibly carried away. Her infants were killed in her streets, and her young men were killed by the enemy’s sword.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Vessels” means objects or implements; the Greek does not identify them more precisely.
    reason: simplification_note
  - marker: b
    text: “Her” refers to the city pictured as a woman in the surrounding passage, likely Jerusalem or Zion.
    reason: cross_reference
simplification_decisions:
- pob_phrase: The vessels of her glory
  simplified_phrase: Her glorious vessels
  preserved_meaning: The vessels were associated with the city’s glory without being identified more narrowly.
  reasoning_layer_used: Lexical decisions for σκεύη and δόξης
  rationale: The adjective gives the relationship naturally without claiming that the vessels were themselves her glory.
- pob_phrase: were carried away captive
  simplified_phrase: were forcibly carried away
  preserved_meaning: The objects were removed by force as captured goods.
  reasoning_layer_used: Lexical decision for αἰχμάλωτα ἀπήχθη
  rationale: This preserves forcible removal without adding a separate act of seizure.
- pob_phrase: her young men by the enemy’s sword
  simplified_phrase: her young men were killed by the enemy’s sword
  preserved_meaning: The enemy killed the city’s young men with the sword.
  reasoning_layer_used: Greek parallel-clause structure and lexical decisions for νεανίσκοι, ῥομφαίᾳ, and ἐχθροῦ
  rationale: Supplying the implied verb makes the parallel clause clear in modern English.
