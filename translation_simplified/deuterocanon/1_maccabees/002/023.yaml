translation:
  language: en
  text: As soon as he finished speaking, a Jewish man stepped forward where everyone could see him to offer a sacrifice on the altar in Modein, as the king had commanded.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Jewish man” may also be translated “Jew” or “Judean man”; Jewish identity is most likely meant here.
    reason: lexical_alternative
