translation:
  language: en
  text: He said, “Alas! Why was I born to see my people and the holy city ruined, and to sit there helplessly while the city was handed over to the power of enemies and the sanctuary to the power of foreigners?”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the ruin of my people and the ruin of the holy city
  simplified_phrase: my people and the holy city ruined
  preserved_meaning: Both the people and the holy city have suffered devastating ruin.
  reasoning_layer_used: POB lexical decisions on τὰ συντρίμματα and τὸ σύντριμμα
  rationale: The verb form states the same devastation in more direct English while preserving the parallel objects.
- pob_phrase: to sit there while it was given
  simplified_phrase: to sit there helplessly while the city was handed over
  preserved_meaning: He remains there as a powerless witness while the city is surrendered to others.
  reasoning_layer_used: POB lexical rationale for καθίσαι ἐκεῖ and ἐν τῷ δοθῆναι αὐτήν
  rationale: The wording clarifies the city's identity and the helpless passivity conveyed by the concrete image.
- pob_phrase: into the hand of enemies ... into the hand of foreigners
  simplified_phrase: to the power of enemies ... to the power of foreigners
  preserved_meaning: The city and sanctuary have come under hostile control.
  reasoning_layer_used: POB footnote b and lexical decisions on the biblical hand idiom
  rationale: Replacing the opaque idiom with its stated meaning makes the transfer of control immediately clear.
interpretive_expansions:
- pob_phrase: to sit there
  rendering: to sit there helplessly
  claim: His sitting expresses powerless, grief-stricken inaction rather than ordinary rest.
  evidence:
