translation:
  language: en
  text: On the Sabbath, their attackers rose up and attacked them. The people under attack died, along with their wives and children—about a thousand people in all—and their livestock also died.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “up to a thousand people.” The Greek may indicate an approximate upper limit rather than an exact count.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: rose up against them in battle on the Sabbath
  simplified_phrase: On the Sabbath, their attackers rose up and attacked them
  preserved_meaning: A hostile force rose against the people and attacked them on the Sabbath.
  reasoning_layer_used: Lexical decisions for ἀνέστησαν ἐπʼ αὐτούς, ἐν τῷ πολέμῳ, and τοῖς σάββασιν
  rationale: Naming the attackers clarifies the opposing groups while preserving the image of rising up.
- pob_phrase: they died—they and their wives and their children and their livestock
  simplified_phrase: The people under attack died, along with their wives and children ... and their livestock also died
  preserved_meaning: The attacked community and its domesticated animals died.
  reasoning_layer_used: Immediate narrative context and lexical decisions for ἀπέθανον and τὰ κτήνη
  rationale: Identifying the victims prevents the repeated pronoun from making the attackers appear to have died.
- pob_phrase: about a thousand persons
  simplified_phrase: about a thousand people in all
  preserved_meaning: The approximate total of human deaths was one thousand.
  reasoning_layer_used: Lexical decision for ἕως χιλίων ψυχῶν ἀνθρώπων
  rationale: “People in all” clearly separates the human count from the livestock.
