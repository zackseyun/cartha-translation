translation:
  language: en
  text: Mattathias answered in a loud voice, “Even if all the nations in the king’s realm[a] listen to him[b], each person turning away from the worship of his ancestors and choosing to follow the king’s commandments,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek uses an unusual phrase that literally reads, “the house of the kingdom of the king.”
    reason: source_note
  - marker: b
    text: Or “obey him.” The Greek says “listen to him,” though obedience is implied here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: in the kingdom of the king
  simplified_phrase: in the king’s realm
  preserved_meaning: All the peoples under the king’s rule are in view.
  reasoning_layer_used: POB lexical decision and footnote
  rationale: “The king’s realm” expresses the awkward royal-domain phrase in natural English.
- pob_phrase: each one turning away from the worship of his fathers
  simplified_phrase: each person turning away from the worship of his ancestors
  preserved_meaning: Every person in view abandons inherited religious worship.
  reasoning_layer_used: POB wording and lexical decisions for ἀποστῆναι and λατρείας πατέρων αὐτοῦ
  rationale: “Each person” preserves the distributive emphasis while “ancestors” clearly conveys inherited worship.
- pob_phrase: have chosen his commandments
  simplified_phrase: choosing to follow the king’s commandments
  preserved_meaning: Each person accepts the king’s authoritative commands as the chosen course.
  reasoning_layer_used: POB lexical decisions for ᾑρετίσαντο and ἐντολαῖς αὐτοῦ
  rationale: “Choosing to follow” states the relationship between choosing and the commandments naturally.
