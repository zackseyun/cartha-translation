translation:
  language: en
  text: When Mattathias saw this, zeal filled him. He trembled deep inside,[a] and he gave vent to his anger in accordance with the judgment.[b] He ran forward and slaughtered the man on the altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “his kidneys trembled,” a Hebrew-style image for deep inner emotion.
    reason: cultural_note
  - marker: b
    text: This may also mean “as the judgment required” or “in accordance with the ordinance.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: was zealous
  simplified_phrase: zeal filled him
  preserved_meaning: Mattathias experienced zealous indignation, not jealousy.
  reasoning_layer_used: Lexical decision for ἐζήλωσεν and the theological zeal motif.
  rationale: This natural wording retains the important language of zeal.
- pob_phrase: his inward parts trembled
  simplified_phrase: he trembled deep inside
  preserved_meaning: His deepest emotions were violently stirred, and the trembling image remains.
  reasoning_layer_used: Lexical decision for οἱ νεφροὶ αὐτοῦ and its cultural note.
  rationale: The main text reads naturally while the note preserves the literal body image.
- pob_phrase: he brought up wrath according to the judgment, and running up he slaughtered him
  simplified_phrase: he gave vent to his anger in accordance with the judgment. He ran forward and slaughtered the man
  preserved_meaning: He actively expressed his wrath and swiftly killed the man under an unresolved judicial frame.
  reasoning_layer_used: Lexical decisions for ἀνήνεγκεν θυμόν, κατὰ τὸ κρίμα, δραμὼν, and ἔσφαξεν.
  rationale: The revision restores active expressed wrath and separates it clearly from the following action.
