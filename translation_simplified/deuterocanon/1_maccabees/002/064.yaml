translation:
  language: en
  text: You, children, be strong and act like men[a] as you follow your law, because you will be glorified in it.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Act like men” preserves the Greek masculine image and means “be courageous.”
    reason: lexical_alternative
  - marker: b
    text: Or “you will be honored” or “you will gain glory”; the text does not say who gives this glory.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And you, children
  simplified_phrase: You, children
  preserved_meaning: The speaker directly addresses the children.
  reasoning_layer_used: POB lexical decision for τέκνα
  rationale: Dropping “And” makes the address more natural without narrowing “children” to sons.
- pob_phrase: be strong and act like men in your law
  simplified_phrase: be strong and act like men as you follow your law
  preserved_meaning: They must show strength and manly courage while remaining committed to their ancestral law.
  reasoning_layer_used: POB lexical and theological decisions for ἰσχύετε, ἀνδρίζεσθε, and ἐν τῷ νόμῳ ὑμῶν
  rationale: “As you follow” explains the law as their sphere of faithful action while retaining the masculine image.
- pob_phrase: because in it you will be glorified
  simplified_phrase: because you will be glorified in it
  preserved_meaning: Their future glorification is connected with the law, while its agent and exact mode remain unstated.
  reasoning_layer_used: POB theological decision for δοξασθήσεσθε and source repetition of ἐν
  rationale: The reordered clause reads naturally while preserving the broad relation expressed by “in it.”
interpretive_expansions:
- pob_phrase: in your law
  rendering: as you follow your law
  claim: Strength and courage are to be shown through faithful commitment to their law.
  evidence:
  - The POB rationale identifies the law as the sphere in which they show strength and courage.
  - The possessive “your” points to the ancestral law belonging to their people.
  confidence: high
  alternatives_preserved:
  - in your law
  - for your law
translation_notes:
  risk_flags:
  - risk: “Act like men” may be misunderstood as saying courage belongs only to males.
    mitigation: The footnote explains that it preserves a Greek masculine image whose idiomatic sense is courage.
  - risk: “In it” leaves the law’s relation to future glory less explicit.
    mitigation: This necessary ambiguity preserves the Greek wording and avoids making the law a definite means of glory.
