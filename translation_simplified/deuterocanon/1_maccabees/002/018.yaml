translation:
  language: en
  text: “So step forward before anyone else and obey the king’s command. All the nations have done this, along with the rulers of Judah and those who remain in Jerusalem. Then you and your family will be among the king’s Friends,[a] and you and your sons will be honored with silver, gold, and many gifts.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Friends” was probably an official title for favored advisers and companions in the royal court.
    reason: cultural_note
simplification_decisions:
- pob_phrase: come forward first and carry out the king’s command
  simplified_phrase: step forward before anyone else and obey the king’s command
  preserved_meaning: Mattathias is urged to act publicly as the first example of obedience.
  reasoning_layer_used: Lexical decisions for πρόσελθε, πρῶτος, and ποίησον τὸ πρόσταγμα
  rationale: The rewrite makes the public pressure and required obedience immediately clear.
- pob_phrase: as all the nations have done, and the rulers of Judah, and those left in Jerusalem
  simplified_phrase: All the nations have done this, along with the rulers of Judah and those who remain in Jerusalem.
  preserved_meaning: The appeal claims broad compliance by other nations and Jewish leaders and residents.
  reasoning_layer_used: Lexical decisions for τὰ ἔθνη, οἱ ἄρχοντες Ἰούδα, and οἱ καταλειφθέντες ἐν Ἰερουσαλήμ
  rationale: A separate sentence removes the crowded clause while retaining each group.
- pob_phrase: you and your house
  simplified_phrase: you and your family
  preserved_meaning: The promised royal status extends to Mattathias and his household.
  reasoning_layer_used: POB translation and immediate context
  rationale: “Family” communicates the household sense more naturally to common readers.
