  text: At that time, he killed the king’s representative,[a] who was forcing him to sacrifice,[b] and he tore down the altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “the king’s man,” meaning someone who represented the king.
    reason: lexical_alternative
  - marker: b
    text: The Greek does not state whom he was forcing; the immediate context points to the man who had come forward, though the wider setting involves coercion of the people.
    reason: source_note
