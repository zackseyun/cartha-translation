  preserved_meaning: The man belonged to or acted for the king.
  reasoning_layer_used: POB lexical decision and footnote
  rationale: “Representative” makes his royal role clear without assigning a specific office.
- pob_phrase: who was compelling them to sacrifice
  simplified_phrase: who was forcing him to sacrifice
  preserved_meaning: The royal representative was coercing someone to perform a sacrifice.
  reasoning_layer_used: Greek source, immediate narrative context, and POB theological alternatives
  rationale: “Forcing” is common English, while “him” follows the immediate singular scene and the note preserves the unstated object.
- pob_phrase: and he tore down the altar
