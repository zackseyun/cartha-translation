translation:
  language: en
  text: 'From among them came a sinful root[a]: Antiochus Epiphanes. He was the son of King Antiochus and had been held as a hostage in Rome. He became king in year 147 of the kingdom of the Greeks.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “a sinful root”; it can also be rendered “a wicked root.”
    reason: lexical_alternative
  - marker: b
    text: This date follows the Seleucid-era system, called here “the kingdom of the Greeks.”
    reason: cultural_note
simplification_decisions:
- pob_phrase: And from them came forth a sinful root, Antiochus Epiphanes
  simplified_phrase: 'From among them came a sinful root: Antiochus Epiphanes'
  preserved_meaning: Antiochus emerged from the previously named line and is introduced through a morally charged plant image.
  reasoning_layer_used: The lexical and theological decisions require both emergence from the line and the root metaphor.
  rationale: “Came” preserves emergence while the colon clearly identifies the sinful root as Antiochus.
- pob_phrase: son of King Antiochus, who had been a hostage in Rome
  simplified_phrase: He was the son of King Antiochus and had been held as a hostage in Rome.
  preserved_meaning: Antiochus was the king’s son and had lived in Rome as a political hostage.
  reasoning_layer_used: The lexical decision identifies ὅμηρα as a political hostage.
  rationale: A separate sentence makes the two historical facts easier to follow.
- pob_phrase: in the one hundred forty-seventh year of the kingdom of the Greeks
  simplified_phrase: in year 147 of the kingdom of the Greeks
  preserved_meaning: His accession is dated by the era associated with Greek rule.
  reasoning_layer_used: The dating rationale preserves the Greek political frame and era reckoning.
  rationale: Numerals and a shorter dating formula make the date easier to read.
