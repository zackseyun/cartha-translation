translation:
  language: en
  text: He advanced to the ends of the earth and took plunder from a great many nations. The earth became quiet before him. He became very great, and his heart was lifted up.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “he became proud.” The Greek literally says, “his heart was lifted up.”
