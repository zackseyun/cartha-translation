simplification_decisions:
- pob_phrase: passed on to the ends of the earth
  simplified_phrase: advanced to the ends of the earth
  preserved_meaning: He continued his conquest to the farthest reaches of the world.
  reasoning_layer_used: POB lexical decisions for διῆλθεν and ἕως ἄκρων τῆς γῆς
  rationale: “Advanced” makes the military movement clear while preserving the expansive image.
- pob_phrase: from a multitude of nations
  simplified_phrase: from a great many nations
  preserved_meaning: He took war spoils from numerous nations.
  reasoning_layer_used: POB lexical decisions for ἔλαβεν σκῦλα and πλήθους ἐθνῶν
  rationale: “A great many” expresses the large number in ordinary English.
- pob_phrase: the earth was quiet before him, and he was exalted
  simplified_phrase: the earth became quiet before him. He became very great
  preserved_meaning: The world was subdued before him, and his greatness increased.
  reasoning_layer_used: POB lexical decisions for ἡσύχασεν and ὑψώθη
  rationale: The wording conveys subdued calm and broad elevation without implying appointment to an office.
translation_notes:
