translation:
  language: en
  text: Wherever a person was found with a book of the covenant,[a] or if anyone sided with the law,[b] the king’s order was to put that person to death.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, a covenant document or a book of the Jewish law.
    reason: lexical_alternative
  - marker: b
    text: Here “the law” refers to the Jewish law; siding with it means supporting or aligning with it.
    reason: lexical_alternative
