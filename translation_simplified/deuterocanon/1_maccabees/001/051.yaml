translation:
  language: en
  text: He sent these commands in writing to his whole kingdom.[a] He appointed officials to supervise all the people, and he ordered every city in Judah to offer sacrifices.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also be translated “to his kingdom”; “whole” makes clear the broad scope implied by the context.
    reason: lexical_alternative
