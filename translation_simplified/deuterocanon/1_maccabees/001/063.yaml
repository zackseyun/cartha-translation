translation:
  language: en
  text: They chose to die rather than make themselves unclean by eating the forbidden foods or dishonor the holy covenant[a] by treating it as common. And they died.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a holy covenant.” The context points to Israel’s covenant with God.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: so that they might not be defiled by the foods
  simplified_phrase: rather than make themselves unclean by eating the forbidden foods
  preserved_meaning: Eating the prohibited foods would bring covenantal ritual and moral defilement.
  reasoning_layer_used: POB lexical and theological decisions on μιανθῶσιν τοῖς βρώμασιν
  rationale: The wording explains how the foods would defile them without reducing defilement to physical dirt.
- pob_phrase: might not profane the holy covenant
  simplified_phrase: dishonor the holy covenant by treating it as common
  preserved_meaning: They refused to treat the sacred covenant as ordinary or unholy.
  reasoning_layer_used: POB lexical decision on βεβηλώσωσιν and theological decision on διαθήκην ἁγίαν
  rationale: The phrase makes the sacred-versus-common contrast in “profane” clear to modern readers.
- pob_phrase: and they died
  simplified_phrase: And they died.
  preserved_meaning: The verse directly states their death without specifying its cause.
  reasoning_layer_used: POB lexical decision on ἀπέθανον
  rationale: A separate short sentence preserves the stark ending and avoids adding that they were executed.
interpretive_expansions:
- pob_phrase: defiled by the foods
  rendering: make themselves unclean by eating the forbidden foods
  claim: The defilement would result from eating foods prohibited by covenantal law.
  evidence:
