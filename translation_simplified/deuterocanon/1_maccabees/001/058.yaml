  preserved_meaning: Their coercive power was the means by which they repeatedly acted.
  reasoning_layer_used: POB lexical decisions for ἐν ἰσχύϊ αὐτῶν and ἐποίουν οὕτω
  rationale: The active wording is easier to follow, while “month after month” preserves the ongoing action.
- pob_phrase: to Israel, to those who were found
  simplified_phrase: to the Israelites who were found
  preserved_meaning: The actions affected members of Israel who were found, without specifying who found them.
  reasoning_layer_used: POB lexical decisions for τῷ Ἰσραήλ and τοῖς εὑρισκομένοις
  rationale: This removes the awkward apposition while preserving the participle’s passive sense.
- pob_phrase: month after month
  simplified_phrase: Month after month
  preserved_meaning: The actions recurred each month.
  reasoning_layer_used: POB lexical decision for ἐν παντὶ μηνὶ καὶ μηνὶ
  rationale: Moving the phrase to the front makes the repeated pattern immediately clear.
