translation:
  language: en
  text: Alexander the Macedonian, son of Philip, came from the land of Kittim.[a] After he struck down[b] Darius, king of the Persians and Medes, Alexander took his place as king. Alexander had already ruled over Greece.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kittim is a traditional biblical place-name that may refer to Cyprus or, more broadly, to western lands.
    reason: cultural_note
  - marker: b
    text: Or “defeated.” The Greek expression literally means “struck down.”
    reason: lexical_alternative
