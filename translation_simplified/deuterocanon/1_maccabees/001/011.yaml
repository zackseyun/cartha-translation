translation:
  language: en
  text: In those days, some lawless men emerged from within Israel and persuaded many others. They said, “Let us go and make a covenant with the nations around us, because ever since we separated ourselves from them,[a] many troubles have found us.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “ever since we were separated from them.”
    reason: lexical_alternative
