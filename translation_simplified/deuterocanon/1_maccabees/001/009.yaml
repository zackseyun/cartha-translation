- pob_phrase: put on crowns after his death
  simplified_phrase: After he died, they all put on royal crowns
  preserved_meaning: After Alexander’s death, all his successors visibly took the insignia of kingship.
  reasoning_layer_used: POB lexical decisions for διαδήματα and μετὰ τὸ ἀποθανεῖν αὐτόν
  rationale: The new order is easier to follow, and “royal” clarifies what kind of crowns they wore.
- pob_phrase: and their sons after them for many years
  simplified_phrase: Their sons did the same after them for many years
  preserved_meaning: Their sons continued the royal succession for many years.
  reasoning_layer_used: POB lexical decisions for ὀπίσω αὐτῶν and ἔτη πολλά
  rationale: A separate sentence makes the sons’ repeated action explicit and keeps the dynastic sequence clear.
- pob_phrase: they multiplied evils in the land
  simplified_phrase: They brought more evil into the land
  preserved_meaning: They actively increased harmful evil in the land without narrowing it to wickedness or calamity alone.
  reasoning_layer_used: POB lexical and theological decisions for ἐπλήθυναν and κακὰ
  rationale: “Brought more evil” expresses active increase naturally while the footnote preserves the word’s broad range.
