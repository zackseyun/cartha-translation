  preserved_meaning: Antiochus advanced with hostile intent while retaining both Israel and Jerusalem as named targets.
  reasoning_layer_used: POB lexical decisions for ἀνέβη and ἐπὶ Ἰσραὴλ καὶ Ἱεροσόλυμα
  rationale: “Marched against” makes the military movement clear without awkward directional wording.
- pob_phrase: with a great multitude
  simplified_phrase: with a vast, powerful force
  preserved_meaning: A very large body accompanied Antiochus with the strength suggested by the Greek image of heaviness.
