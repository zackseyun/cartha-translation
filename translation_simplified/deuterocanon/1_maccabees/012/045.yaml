translation:
  language: en
  text: “Now send them home, but choose a few men for yourself to stay with you. Come with me to Ptolemais. I will hand the city over to you, together with the other strongholds, the large military forces, and everyone in charge of affairs.[a] Then I will turn back and leave.[b] This is why I came.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be translated “all the officials”; the Greek refers to people placed in charge of necessary business.
    reason: lexical_alternative
  - marker: b
    text: The Greek gives this sequence without saying where the speaker will turn back or go.
    reason: lexical_alternative
simplification_decisions:
