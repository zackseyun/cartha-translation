  simplified_phrase: choose a few men for yourself to stay with you
  preserved_meaning: He is to select a small group for his own company.
  reasoning_layer_used: POB lexical decisions for ἐπίλεξαι and ἄνδρας ὀλίγους
  rationale: The infinitive makes the purpose easier to grasp while retaining the middle-voice nuance.
- pob_phrase: the rest of the strongholds and the large forces
  simplified_phrase: the other strongholds, the large military forces
  preserved_meaning: Control of the remaining fortified places and numerous troops is promised.
  reasoning_layer_used: POB lexical decisions for ὀχυρώματα and δυνάμεις
  rationale: “Military” prevents readers from mistaking the forces for nonmilitary power.
- pob_phrase: I will depart after turning back
