translation:
  language: en
  text: Tryphon wanted to rule over Asia,[a] claim the crown for himself, and attack King Antiochus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Asia” here means the Hellenistic kingdom in view, not the modern continent.
    reason: cultural_note
  - marker: b
    text: Literally, “stretch out his hands against King Antiochus”; the exact form of hostile action is not specified.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: sought to rule over Asia
  simplified_phrase: wanted to rule over Asia
  preserved_meaning: Tryphon intended to gain rule without implying that he succeeded.
  reasoning_layer_used: The lexical decision for ἐζήτησεν identifies an intention or aim.
  rationale: “Wanted” states the political ambition in common English.
- pob_phrase: to put on the crown
  simplified_phrase: claim the crown for himself
  preserved_meaning: Tryphon intended to assume kingship personally.
  reasoning_layer_used: The lexical decision for περιθέσθαι τὸ διάδημα explains the crown as a sign of assuming kingship.
  rationale: “Claim the crown” makes the political meaning of the image immediately clear.
- pob_phrase: to lay hands on Antiochus the king
  simplified_phrase: attack King Antiochus
  preserved_meaning: Tryphon intended hostile action against Antiochus while the exact means remains unspecified.
  reasoning_layer_used: The lexical decision for ἐκτεῖναι χεῖρας allows “to attack” and keeps the action broadly hostile.
  rationale: “Attack” avoids the modern ambiguity of “lay hands on.”
translation_notes:
  risk_flags:
  - risk: “Attack” does not retain the Greek hand image in the main text.
    mitigation: Footnote b gives the literal image and notes that the precise hostile action is unspecified.
