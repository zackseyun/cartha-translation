  simplified_phrase: He had heard that they planned
  preserved_meaning: The report explains why he took action, and the plan is not presented as completed.
  reasoning_layer_used: POB lexical decisions for ἤκουσεν and βούλονται
  rationale: The past perfect and a new sentence make the sequence and cause easier to follow.
- pob_phrase: those on Demetrius’s side
  simplified_phrase: Demetrius’s supporters
  preserved_meaning: The recipients were people aligned with Demetrius, without specifying that they were soldiers.
  reasoning_layer_used: POB lexical decision for τοῖς παρὰ Δημητρίου
  rationale: “Supporters” expresses political allegiance in shorter, familiar English.
- pob_phrase: stationed a garrison there
  simplified_phrase: stationed troops there
  preserved_meaning: He placed a military force at the stronghold to defend it.
  reasoning_layer_used: POB lexical decisions for ἔθετο and φρουράν
  rationale: “Troops” makes the military force immediately clear to readers unfamiliar with “garrison.”
