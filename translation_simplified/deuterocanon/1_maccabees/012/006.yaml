translation:
  language: en
  text: Jonathan, the nation’s high priest, the council of elders, the priests, and the rest of the Jewish people[a] send greetings to our Spartan brothers.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Judean people”; the term can identify the people of Judea in ethnic, political, and religious terms.
    reason: lexical_alternative
  - marker: b
    text: “Brothers” is diplomatic language expressing claimed kinship, not necessarily literal family ties.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Jonathan the high priest of the nation
  simplified_phrase: Jonathan, the nation’s high priest
  preserved_meaning: Jonathan holds the established high-priestly office for the Jewish national body.
  reasoning_layer_used: Lexical decisions for ἀρχιερεὺς and τοῦ ἔθνους
  rationale: The possessive form keeps the national connection in natural English.
- pob_phrase: the rest of the people of the Jews
  simplified_phrase: the rest of the Jewish people
  preserved_meaning: The remaining Jewish civic body is distinguished from the leaders and priests already named.
  reasoning_layer_used: Lexical decisions for ὁ λοιπὸς δῆμος and τῶν Ἰουδαίων
  rationale: This removes the awkward construction without adding universal scope.
- pob_phrase: to their Spartan brothers, greetings
  simplified_phrase: send greetings to our Spartan brothers
  preserved_meaning: The Jewish senders formally greet the Spartans using diplomatic kinship language.
  reasoning_layer_used: Lexical and theological decisions for χαίρειν and τοῖς ἀδελφοῖς
  rationale: Direct letter wording clarifies the greeting while retaining “brothers.”
translation_notes:
  risk_flags:
  - risk: “Our” adopts the letter writers’ direct perspective instead of POB’s third-person “their.”
    mitigation: This naturalizes the letter formula without changing the claimed relationship.
  - risk: “Jewish people” may sound mainly religious to some modern readers.
    mitigation: The “Judean” footnote preserves the term’s ethnic and political range.
