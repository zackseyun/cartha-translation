translation:
  language: en
  text: So we continually remember you at all times. We do this during the festivals and on the other appointed days,[a] when we offer sacrifices and pray. It is right and fitting to remember brothers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Appointed days” means other days set apart for religious observance.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Therefore we continually remember you at all times, at the festivals and on the other appointed days
  simplified_phrase: So we continually remember you at all times. We do this during the festivals and on the other appointed days
  preserved_meaning: Their remembrance is persistent and occurs on recognized religious observance days.
  reasoning_layer_used: POB lexical decisions for ἀδιαλείπτως, ἑορταῖς, and καθηκούσαις ἡμέραις
  rationale: Two sentences make the schedule easier to follow without weakening its regularity.
- pob_phrase: when we offer sacrifices and in our prayers
  simplified_phrase: when we offer sacrifices and pray
  preserved_meaning: They remember the recipients during both sacrificial offerings and prayer.
  reasoning_layer_used: POB lexical decisions for ἐφʼ ὧν, προσφέρομεν θυσίων, and προσευχαῖς
  rationale: Parallel verbs clearly express both acts and preserve the temporal link.
- pob_phrase: as it is right and fitting to remember brothers
  simplified_phrase: It is right and fitting to remember brothers
  preserved_meaning: Remembering their covenantal brothers is both right and appropriate.
  reasoning_layer_used: POB theological decision on ἀδελφῶν and lexical decision for ὡς δέον ἐστὶν καὶ πρέπον
  rationale: A separate sentence clarifies the conclusion while retaining the masculine kinship term.
translation_notes:
  risk_flags:
  - risk: “At all times” could sound like literally nonstop activity.
    mitigation: “Continually” and the named observance days indicate persistent, repeated remembrance.
