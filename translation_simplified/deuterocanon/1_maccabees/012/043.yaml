translation:
  language: en
  text: He welcomed Jonathan with honor, introduced him to all his friends,[a] and gave him gifts. He also ordered his friends and military forces to obey Jonathan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “friends” may mean members of a ruler’s court, not only personal companions.
    reason: cultural_note
