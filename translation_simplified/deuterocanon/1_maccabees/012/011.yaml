translation:
  language: en
  text: So we keep remembering you at all times—at the festivals and on the other appointed days,[a] when we offer sacrifices, and in our prayers. It is right and fitting to remember you as brothers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the other customary days” or “the other proper days.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: at all times we continually remember you
  simplified_phrase: we keep remembering you at all times
  preserved_meaning: Their remembrance is persistent and regular.
  reasoning_layer_used: Lexical decision for ἀδιαλείπτως
  rationale: “Keep remembering” preserves the emphasis without the awkward phrase “at all times continually.”
- pob_phrase: at the festivals and on the other appointed days, when we offer sacrifices and in our prayers
  simplified_phrase: at the festivals and on the other appointed days, when we offer sacrifices, and in our prayers
  preserved_meaning: The appointed observances are linked with sacrifices, while prayer remains a separate setting for remembrance.
  reasoning_layer_used: Source syntax and lexical decisions for ἐφʼ ὧν and προσευχαῖς
  rationale: The punctuation and parallel wording keep sacrifices tied to the named days without confining prayer to them.
- pob_phrase: as it is right and fitting to remember brothers
  simplified_phrase: It is right and fitting to remember you as brothers.
  preserved_meaning: The writers regard the people they address as brothers and say they ought to remember them.
  reasoning_layer_used: Theological decision for ἀδελφῶν and immediate context
  rationale: A separate sentence identifies who the brothers are while retaining the masculine familial term.
interpretive_expansions:
- pob_phrase: remember brothers
  rendering: remember you as brothers
  claim: The addressed people are the brothers whom the writers say they should remember.
  evidence:
  - The sentence first says “we remember you” and then gives the duty to remember brothers.
  - The POB rationale describes “brothers” as diplomatic and familial language between allied peoples.
  confidence: high
  alternatives_preserved:
  - remember brothers
translation_notes:
  risk_flags:
