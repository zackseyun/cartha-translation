translation:
  language: en
  text: Crush this military camp before us today. Then let those who remain know that he has spoken wickedly against the things sacred to you.[a] Judge him as his wickedness deserves.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “against your sanctuary.” The Greek may refer broadly to things sacred to God, including the sanctuary.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: this camp
  simplified_phrase: this military camp
  preserved_meaning: The target is an enemy encampment or force in a military setting.
  reasoning_layer_used: Lexical decision for παρεμβολή and immediate context
  rationale: Adding “military” prevents readers from picturing an ordinary civilian camp.
- pob_phrase: the rest
  simplified_phrase: those who remain
  preserved_meaning: The phrase broadly identifies people left afterward without specifying survivors.
  reasoning_layer_used: Lexical decision for οἱ ἐπίλοιποι
  rationale: This is clearer while preserving the Greek phrase’s open reference.
- pob_phrase: judge him according to his wickedness
  simplified_phrase: Judge him as his wickedness deserves
  preserved_meaning: The prayer asks God to judge the individual in keeping with his evil.
  reasoning_layer_used: Lexical decisions for κρῖνον and κακία
  rationale: The recasting expresses the judicial sense in natural modern English.
translation_notes:
  risk_flags:
  - risk: “The things sacred to you” may still be understood specifically as the sanctuary.
    mitigation: The footnote preserves both the sanctuary reading and the broader plural sense.
  - risk: The singular “he” has no named antecedent within this verse.
    mitigation: It is retained because the Greek shifts from the camp to one culpable speaker.
