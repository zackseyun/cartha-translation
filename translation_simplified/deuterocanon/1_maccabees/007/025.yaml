  simplified_phrase: how strong Judas and his followers had become
  preserved_meaning: Judas and his associates had gained substantial strength.
  reasoning_layer_used: Lexical decision for ἐνίσχυσεν and οἱ μετ’ αὐτοῦ.
  rationale: “Followers” clearly identifies the group with Judas while preserving their relationship to him.
- pob_phrase: he was not able to withstand them
  simplified_phrase: he could not stand against them
  preserved_meaning: Alcimus recognized that he could not successfully oppose Judas's group.
  reasoning_layer_used: Theological decision and immediate narrative context.
  rationale: The common expression keeps the force of resistance without the formal word “withstand.”
- pob_phrase: he returned to the king and brought wicked charges against them
