translation:
  language: en
  text: But when Alcimus saw how strong Judas and his followers had become, he realized that he could not stand against them. So he went back to the king and made malicious accusations against them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The printed Greek manuscripts literally say, “he realized that he could stand against them.” The context strongly supports “could not stand against them,” as translated here.
    reason: textual_variant
