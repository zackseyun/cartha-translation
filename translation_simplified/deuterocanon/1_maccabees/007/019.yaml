translation:
  language: en
  text: Bacchides left Jerusalem and set up camp at Bethzaith. He sent men to seize many who had deserted to join him, along with some of the people. Then he slaughtered them at the great pit.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word translated “slaughtered” literally means “sacrificed,” but here it describes violent killing, not a religious offering.
    reason: lexical_alternative
  - marker: b
    text: The phrase may also mean “into the great pit,” and the place may have been a well or cistern.
    reason: lexical_alternative
