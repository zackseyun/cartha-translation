translation:
  language: en
  text: In year 151, Demetrius son of Seleucus left Rome. With only a few men, he went up to a city by the sea and reigned there.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “became king there.” The Greek may refer to the beginning of his reign.
    reason: alternative_reading
