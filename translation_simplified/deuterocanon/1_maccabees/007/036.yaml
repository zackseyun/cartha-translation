- pob_phrase: And he went out in anger
  simplified_phrase: He then left in anger
  preserved_meaning: He departed while angry.
  reasoning_layer_used: The lexical decision for μετὰ θυμοῦ and the narrative sequence.
  rationale: “Left” is natural here, and “then” clearly marks the next action.
- pob_phrase: Then the priests entered
  simplified_phrase: The priests went in
  preserved_meaning: The priests entered the temple setting.
  reasoning_layer_used: The source verb εἰσῆλθον and immediate temple context.
  rationale: “Went in” is plain English without adding an unstated destination.
- pob_phrase: and they wept and said
  simplified_phrase: They wept and said
  preserved_meaning: The priests performed both actions without specifying their exact temporal relationship.
  reasoning_layer_used: The coordinated source verbs ἔκλαυσαν καὶ εἶπαν and the grounding review.
  rationale: Keeping coordinated verbs avoids implying that they spoke while weeping.
