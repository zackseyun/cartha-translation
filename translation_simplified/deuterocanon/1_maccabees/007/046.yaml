translation:
  language: en
  text: They came out from all the villages of Judea on every side and outflanked the enemy.[a] The enemy turned back against them,[b] but they were all killed by the sword. Not one of them survived.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word translated “outflanked” may more generally mean “surrounded” or “gained the advantage over.”
    reason: alternative_reading
  - marker: b
    text: The Greek uses compressed pronouns here and does not explicitly name the two groups.
    reason: source_note
simplification_decisions:
- pob_phrase: came out from all the villages of Judea all around
  simplified_phrase: came out from all the villages of Judea on every side
  preserved_meaning: People emerged from villages around the battle area in an encircling movement.
  reasoning_layer_used: Lexical decisions for κωμῶν and κυκλόθεν
  rationale: “On every side” makes the tactical setting easier to picture.
- pob_phrase: these turned back against them
  simplified_phrase: The enemy turned back against them
  preserved_meaning: The outflanked group reversed direction in relation to the opposing group without specifying whether this was retreat or engagement.
  reasoning_layer_used: Lexical decisions for ἀνέστρεφον and οὗτοι πρὸς τούτους
  rationale: Naming the enemy clarifies the pronouns while “turned back” preserves the action’s ambiguity.
- pob_phrase: they all fell by the sword, and not even one of them was left
  simplified_phrase: they were all killed by the sword. Not one of them survived
  preserved_meaning: The entire opposing force died by violence, with no survivor.
  reasoning_layer_used: Lexical decisions for ἔπεσαν πάντες ῥομφαίᾳ and οὐδὲ εἷς
  rationale: Two direct sentences explain the idiom while retaining the sword image and totality.
