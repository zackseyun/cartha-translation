translation:
  language: en
  text: So now, send a man you trust. Have him go and see all the destruction he has brought on us and on the king’s land. Then have him punish them and everyone helping them.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: send a man whom you trust
  simplified_phrase: send a man you trust
  preserved_meaning: The king is to choose a man in whom he personally has confidence.
  reasoning_layer_used: POB lexical decision for ἄνδρα ᾧ πιστεύεις
  rationale: Removing “whom” makes the clause more natural without changing who is trusted.
- pob_phrase: let him go and see all the destruction that he has done to us and to the king’s land
  simplified_phrase: Have him go and see all the destruction he has brought on us and on the king’s land.
  preserved_meaning: The trusted man must witness the full devastation inflicted on the speakers and royal territory.
  reasoning_layer_used: POB lexical decisions for πορευθεὶς ἰδέτω, τὴν ἐξολέθρευσιν ἅπασαν, ἣν ἐποίησεν, and τῇ χώρᾳ τοῦ βασιλέως
  rationale: “Brought on” expresses harmful causation more clearly than “done to” while retaining the full extent of the destruction.
- pob_phrase: and let him punish them and all who are helping them
  simplified_phrase: Then have him punish them and everyone helping them.
  preserved_meaning: The command extends punishment both to the stated group and to all who assist them.
  reasoning_layer_used: POB lexical decisions for κολάσατο and τοὺς ἐπιβοηθοῦντας αὐτοῖς
  rationale: A separate sentence and “then” clarify the sequence without narrowing the kind of assistance involved.
