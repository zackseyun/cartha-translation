- pob_phrase: that he might be sheltered there
  simplified_phrase: seeking shelter there
  preserved_meaning: Alexander fled to Arabia for refuge and protection.
  reasoning_layer_used: The lexical decision identifies the Greek construction as expressing purpose and shelter or protection.
  rationale: The active wording expresses his purpose naturally without limiting shelter to concealment.
- pob_phrase: but King Ptolemy was exalted
  simplified_phrase: But King Ptolemy was elevated
  preserved_meaning: Ptolemy was raised in status without specifying only honor, power, or success.
  reasoning_layer_used: The lexical and theological decisions preserve the passive upward image and its open political-honorific range.
