translation:
  language: en
  text: The king of Egypt gathered many troops—like the sand by the seashore—and many ships. He tried to take control[a] of Alexander’s kingdom through deceit and add it to his own kingdom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “seize” or “gain mastery over.” The Greek can mean overpowering or taking control.
    reason: lexical_alternative
