  preserved_meaning: He attempted to bring Alexander’s kingdom under his power.
  reasoning_layer_used: POB lexical decisions for ἐζήτησεν and κατακρατῆσαι
  rationale: “Tried to take control” is more natural modern English while retaining the sense of an attempted takeover.
- pob_phrase: by deceit
