translation:
  language: en
  text: Therefore, we have confirmed Judea’s borders and the three districts of Aphairema, Lydda, and Ramathaim. These districts were added to Judea from Samaria, together with everything belonging to them.[a] All this is for those who offer sacrifices in Jerusalem. This arrangement replaces the royal taxes that the king used to collect from them each year from the land’s crops and the produce of its trees.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Everything belonging to them” may include associated villages, lands, or other dependencies.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the three districts—Aphairema, Lydda, and Ramathaim—which were added to Judea from Samaria
  simplified_phrase: the three districts of Aphairema, Lydda, and Ramathaim. These districts were added to Judea from Samaria
  preserved_meaning: The decree confirms the named districts, while their addition from Samaria remains a separate description.
  reasoning_layer_used: source grammar, lexical decisions, and grounding review
  rationale: Splitting the clause clarifies the transfer without making it the object of confirmation.
- pob_phrase: and all that belongs with them, for all who offer sacrifice in Jerusalem
  simplified_phrase: together with everything belonging to them. All this is for those who offer sacrifices in Jerusalem
  preserved_meaning: The grant broadly includes associated dependencies and benefits those sacrificing in Jerusalem.
  reasoning_layer_used: lexical decisions and POB footnote b
  rationale: Two sentences clarify the grant’s scope and beneficiaries without narrowing either.
- pob_phrase: instead of the royal taxes that the king formerly received from them each year from the produce of the land and the fruit trees
  simplified_phrase: This arrangement replaces the royal taxes that the king used to collect from them each year from the land’s crops and the produce of its trees
  preserved_meaning: The arrangement replaces annual royal collections drawn from agricultural and tree produce.
  reasoning_layer_used: lexical decisions for taxes, customary collection, and produce
  rationale: Active wording makes the fiscal provision clear while retaining the source’s “from” relationship.
translation_notes:
  risk_flags:
  - risk: “Everything belonging to them” remains deliberately broad.
    mitigation: The footnote gives possible referents without choosing among them.
  - risk: The exact legal mechanism by which the arrangement replaces the taxes is unspecified.
    mitigation: “Replaces” preserves the general fiscal relationship without calling it a specific exemption.
