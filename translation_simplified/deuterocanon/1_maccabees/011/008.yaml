translation:
  language: en
  text: But King Ptolemy brought the coastal cities under his control, all the way to Seleucia-by-the-Sea. He was also making evil plans against Alexander.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “was making evil plans concerning Alexander.” The Greek says “concerning Alexander,” while the context implies hostility.
    reason: lexical_alternative
