translation:
  language: en
  text: 'He sent official representatives to King Demetrius with this message: “Come, let us make a covenant[a] with each other. I will give you my daughter, who is now Alexander’s wife,[b] and you will rule as king over your father’s kingdom.”'
  philosophy: optimal-equivalence
  footnotes:
