    text: Gennesar is the Greek form of the place-name often known as Gennesaret.
    reason: alternative_reading
  - marker: b
    text: The Greek literally says they “rose early in the morning for the plain of Nasor,” with the movement toward the plain implied.
    reason: lexical_alternative
