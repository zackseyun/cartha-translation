translation:
  language: en
  text: Ptolemy entered Antioch and put on the crown of Asia. He placed two crowns[a] on his head—the crown of Asia and the crown of Egypt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can also be translated “diadem,” a royal headband or crown.
    reason: lexical_alternative
simplification_decisions:
