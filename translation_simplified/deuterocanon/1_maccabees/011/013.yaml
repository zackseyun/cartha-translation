  simplified_phrase: Ptolemy entered Antioch and put on the crown of Asia. He placed two crowns on his head
  preserved_meaning: Ptolemy physically donned royal insignia after entering Antioch.
  reasoning_layer_used: Lexical decisions for εἰσῆλθεν and περιέθετο, with the theological decision to preserve the concrete royal act.
  rationale: Splitting the long sentence makes the sequence easier to follow without turning the act into an explicit claim of rule.
- pob_phrase: that of Asia and Egypt
  simplified_phrase: the crown of Asia and the crown of Egypt
  preserved_meaning: The two crowns represented Asia and Egypt respectively.
  reasoning_layer_used: Lexical decision for δύο διαδήματα and the source’s repeated royal term.
  rationale: Repeating “the crown” removes the unclear pronoun while preserving both distinct royal symbols.
