  preserved_meaning: His realm was politically and militarily calm in relation to his rule.
  reasoning_layer_used: Lexical decisions for ἡσύχασεν, ἡ γῆ, and ἐνώπιον αὐτοῦ
  rationale: This makes the political setting clear without claiming complete peace.
- pob_phrase: dismissed all his forces, each to his own place
  simplified_phrase: sent all his troops back to their own places
  preserved_meaning: He released all the troops from service and sent each person or contingent away.
  reasoning_layer_used: Lexical decisions for ἀπέλυσεν, δυνάμεις, and ἕκαστον εἰς τὸν ἴδιον τόπον
  rationale: This states the military action plainly while leaving each destination broad.
- pob_phrase: all the forces from his fathers
  simplified_phrase: all the long-established troops from his forefathers’ reigns
  preserved_meaning: All the traditional dynastic troops, contrasted with the retained foreign troops, turned hostile.
  reasoning_layer_used: Lexical rationale and POB cultural note for πᾶσαι αἱ δυνάμεις αἱ ἀπὸ τῶν πατέρων
  rationale: This explains the compressed ancestral phrase while retaining its explicit totality.
