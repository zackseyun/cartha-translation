translation:
  language: en
  text: King Demetrius saw that the country was calm under his rule and that nothing was resisting him. So he sent all his troops back to their own places, except the foreign troops he had recruited from the islands of the nations.[a] Then all the long-established troops from his forefathers’ reigns became hostile to him.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The foreign troops may have been hired soldiers serving as mercenaries.
    reason: lexical_alternative
  - marker: b
    text: This likely refers to the traditional troops inherited from the reigns of Demetrius’s forefathers.
    reason: cultural_note
