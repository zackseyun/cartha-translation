translation:
  language: en
  text: From there he went to Gaza, but the men of Gaza refused to let him enter. He surrounded the city with his camp,[a] set its outlying areas on fire,[b] and plundered those areas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “he besieged the city.” The Greek describes him setting up camp around it.
    reason: lexical_alternative
  - marker: b
    text: The Greek expression is difficult and may mean the areas, suburbs, or districts around Gaza.
    reason: lexical_alternative
