  preserved_meaning: They were marked by moral and legal rebellion, not merely criminal status.
  reasoning_layer_used: POB lexical decision for ἄνδρες παράνομοι
  rationale: The expanded wording makes the judgment clear in common English.
- pob_phrase: reported to him
  simplified_phrase: told him
  preserved_meaning: They brought information to the king as an authority.
  reasoning_layer_used: POB lexical decision for ἀπήγγειλαν
  rationale: “Told him” is simpler, while the setting still shows that this was a report.
- pob_phrase: was besieging the citadel
