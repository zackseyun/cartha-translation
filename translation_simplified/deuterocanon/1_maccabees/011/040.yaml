translation:
  language: en
  text: Trypho stayed close to Imalkue, hoping that Imalkue would hand Antiochus over to him so that Antiochus could reign in place of his father. They told Antiochus everything Demetrius had done and how Demetrius’s own forces had turned against him. Antiochus stayed there for many days.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: he stayed close to him, so that he might hand him over to him
  simplified_phrase: Trypho stayed close to Imalkue, hoping that Imalkue would hand Antiochus over to him
  preserved_meaning: Trypho remained near Imalkue with the aim of receiving Antiochus from him.
  reasoning_layer_used: Immediate context and POB lexical decisions for προσήδρευσεν and παραδοῖ
  rationale: Contextual names resolve the repeated pronouns while preserving the political action and purpose.
- pob_phrase: the hostility with which his forces were hostile to him
  simplified_phrase: how Demetrius’s own forces had turned against him
  preserved_meaning: Demetrius’s military forces were actively opposing him.
  reasoning_layer_used: POB lexical decision and footnote for ἔχθραν and its cognate verb
  rationale: “Turned against him” expresses active hostility in clear, natural English.
- pob_phrase: he remained there many days
  simplified_phrase: Antiochus stayed there for many days
  preserved_meaning: Antiochus continued in that place for an extended period.
  reasoning_layer_used: Immediate context and POB lexical decision for ἔμεινεν ἐκεῖ ἡμέρας πολλάς
  rationale: Naming Antiochus identifies the subject, and “stayed” naturally preserves the full time statement.
interpretive_expansions:
- pob_phrase: he stayed close to him, so that he might hand him over to him, so that he might reign in place of his father
  rendering: Trypho stayed close to Imalkue, hoping that Imalkue would hand Antiochus over to him so that Antiochus could reign in place of his father
  claim: The immediate context identifies the three participants as Trypho, Imalkue, and Antiochus.
  evidence:
  - The preceding context names Trypho as the one seeking Alexander’s young son from Imalkue.
  - The succession clause identifies Antiochus as the son who would reign in his father’s place.
  confidence: high
  alternatives_preserved:
  - The purpose wording does not specify whether Imalkue agreed to hand Antiochus over.
- pob_phrase: they reported to him ... and he remained there many days
  rendering: They told Antiochus ... Antiochus stayed there for many days
  claim: Antiochus receives the report and is the one who stays there.
  evidence:
  - The immediate narrative context makes Antiochus the continuing subject after he is handed over.
  confidence: moderate
  alternatives_preserved:
  - The Greek itself uses pronouns rather than repeating Antiochus’s name.
translation_notes:
  risk_flags:
  - risk: Replacing Greek pronouns with names depends on the immediate narrative context.
    mitigation: The names follow the reviewed contextual identifications and do not add new actions or motives.
  - risk: “Hoping” presents the purpose clause as Trypho’s aim rather than a guaranteed result.
    mitigation: This preserves the intended outcome without implying that Imalkue had already agreed.
