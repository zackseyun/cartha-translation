translation:
  language: en
  text: The king fled into the court area.[a] The men of the city took control of the routes through the city[b] and began to fight.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “courtyard”; the Greek can refer to the court area of a royal complex.
    reason: lexical_alternative
  - marker: b
    text: The Greek may refer to passages, access routes, approaches, or entrances.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: fled into the court
  simplified_phrase: fled into the court area
  preserved_meaning: The king urgently withdrew into a physical court or courtyard.
  reasoning_layer_used: The lexical decision for αὐλή and its documented alternative.
  rationale: “Court area” avoids suggesting a royal council or law court.
- pob_phrase: seized the passages of the city
  simplified_phrase: took control of the routes through the city
  preserved_meaning: The city's men gained military control of ways through or into the city.
  reasoning_layer_used: The lexical decisions for κατελάβοντο and τὰς διόδους τῆς πόλεως, together with the grounding review.
  rationale: This clearly expresses control while preserving the term’s broad route and access sense.
translation_notes:
