translation:
  language: en
  text: The men from Gaza asked Jonathan to agree on terms. He gave them pledges of good faith. Then he took the sons of their rulers as hostages and sent them to Jerusalem.[a] Jonathan traveled through the region as far as Damascus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: One Greek witness adds the isolated word “Asalim” after “Jerusalem.” It may be a corrupted reading or a stray place-name.
    reason: textual_variant
