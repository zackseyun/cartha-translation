translation:
  language: en
  text: When he heard the news, he became angry. The moment he heard it, he broke camp and went to Ptolemais. He wrote to Jonathan, telling him to stop the siege and come to Ptolemais as quickly as possible for a conference with him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek wording about the meeting is awkward, but it appears to summon Jonathan to a conference with him.
    reason: textual_variant
