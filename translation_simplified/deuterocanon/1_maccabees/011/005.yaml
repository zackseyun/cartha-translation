translation:
  language: en
  text: They told the king what Jonathan had done because they wanted to accuse him.[a] But the king said nothing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “blame him” or “bring shame on him.” The Greek can refer to censure or disparagement, not only a formal accusation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: reported to the king what Jonathan had done
  simplified_phrase: told the king what Jonathan had done
  preserved_meaning: They informed the king about Jonathan’s actions.
  reasoning_layer_used: The lexical decision allows “told” while preserving the court setting and narrative report.
  rationale: “Told” is more familiar than “reported” and does not imply less than the context requires.
- pob_phrase: in order to accuse him
  simplified_phrase: because they wanted to accuse him
  preserved_meaning: Their purpose was to make a hostile charge against Jonathan.
  reasoning_layer_used: The lexical rationale identifies hostile denunciation before a ruler as the controlling sense.
  rationale: The purpose is expressed in direct, natural English without changing its force.
- pob_phrase: but the king kept silent
  simplified_phrase: But the king said nothing
  preserved_meaning: The king gave no response to their accusation.
  reasoning_layer_used: The lexical rationale explains the verb as the king’s deliberate non-response.
  rationale: A separate sentence makes the contrast clear, while “said nothing” states the action plainly.
translation_notes:
  risk_flags:
  - risk: “Accuse” may sound exclusively like a formal legal charge.
    mitigation: The footnote preserves the broader senses of blame, censure, and disparagement.
