translation:
  language: en
  text: For victory in war does not depend on a great force. Strength comes from heaven.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: is not in a multitude of strength
  simplified_phrase: does not depend on a great force
  preserved_meaning: Victory is not based on a large amount of human military power.
  reasoning_layer_used: The lexical decisions for πλήθει and δυνάμεως preserve both magnitude and force.
  rationale: This states the basis of victory clearly without adding an action such as gathering troops.
- pob_phrase: strength is from heaven
  simplified_phrase: Strength comes from heaven
  preserved_meaning: The strength that brings victory has a divine source, expressed reverentially as heaven.
  reasoning_layer_used: The theological decision retains the Greek circumlocution instead of replacing heaven with God.
  rationale: “Comes from” is natural English and keeps heaven as the stated source.
translation_notes:
  risk_flags:
  - risk: “A great force” may be heard mainly as a large army rather than human power more broadly.
    mitigation: The war context supports the military sense, while the next sentence retains the broader word “Strength.”
