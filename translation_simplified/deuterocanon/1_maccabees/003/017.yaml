translation:
  language: en
  text: But when they saw the camp advancing toward Judas,[a] they said to him, “How can so few of us fight such a huge force? We are exhausted, and we have had nothing to eat today.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “advancing against Judas.” The Greek says the camp was moving toward an encounter; the military setting shows that the encounter was hostile.
    reason: lexical_alternative
