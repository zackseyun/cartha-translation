translation:
  language: en
  text: Judas said, “Fasten your belts for battle. Show yourselves to be strong men,[a] and be ready in the morning to fight against these nations. They have assembled against us to destroy us and our sacred things.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “become mighty sons,” an expression meaning valiant or strong men.
    reason: lexical_alternative
  - marker: b
    text: The Greek has “our holy things,” which may include the sanctuary, its sacred objects, and holy precincts.
    reason: alternative_reading
