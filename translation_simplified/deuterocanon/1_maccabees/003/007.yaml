simplification_decisions:
- pob_phrase: he embittered many kings
  simplified_phrase: he made many kings bitter
  preserved_meaning: His effect on the kings is still pictured as making them bitter.
  reasoning_layer_used: Lexical decision for ἐπίκρανεν
  rationale: This natural wording preserves the Greek metaphor without using the less familiar verb “embittered.”
- pob_phrase: he made Jacob glad by his deeds
  simplified_phrase: his deeds brought joy to Jacob—the people of Israel
  preserved_meaning: His actions caused the covenant people named Jacob to rejoice.
  reasoning_layer_used: Lexical and theological decisions for ηὔφρανεν and τὸν Ἰακώβ
  rationale: The wording keeps “Jacob” while clearly explaining its collective sense.
- pob_phrase: his remembrance is for blessing forever
  simplified_phrase: He will be remembered with blessing forever
  preserved_meaning: His remembrance will always be associated with blessing.
  reasoning_layer_used: Lexical and theological decisions for μνημόσυνον, εἰς εὐλογίαν, and ἕως τοῦ αἰῶνος
  rationale: The sentence makes the blessing formula clear without implying that his memory actively benefits others.
