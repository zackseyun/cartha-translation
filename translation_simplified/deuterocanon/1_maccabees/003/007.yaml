translation:
  language: en
  text: He made many kings bitter, and his deeds brought joy to Jacob—the people of Israel. He will be remembered with blessing forever.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “his remembrance is for blessing forever”; this may also mean, “his memory is blessed forever.”
