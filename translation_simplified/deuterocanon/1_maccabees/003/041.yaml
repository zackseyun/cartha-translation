  simplified_phrase: The merchants of the region heard the report about them
  preserved_meaning: Local merchants heard of the opposing forces.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: This replaces the opaque Greek idiom with a contextual alternative already documented by POB.
- pob_phrase: they took very much silver and gold, and servants, and came into the camp
