translation:
  language: en
  text: The merchants of the region heard the report about them. They brought a great deal of silver and gold and brought servants with them. They came to the camp to take the sons of Israel as servants.[a] Forces from Syria and foreign lands also joined them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “servants” means people held as human property; it may also be translated “slaves.”
    reason: lexical_alternative
