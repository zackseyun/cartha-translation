translation:
  language: en
  text: Jerusalem stood empty, like a wilderness. No one from her own people was coming in or going out.[a] The sanctuary was being trampled underfoot. Sons of foreigners were in the citadel,[b] which had become lodging for the nations. Delight was taken away from Jacob, and the flute and harp fell silent.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “her offspring,” probably meaning Jerusalem’s own people or inhabitants.
    reason: lexical_alternative
  - marker: b
    text: Or “Acra,” the fortified citadel in Jerusalem.
    reason: alternative_reading
  - marker: c
    text: The instrument translated “harp” may also be called a lyre.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Jerusalem was uninhabited like a wilderness
  simplified_phrase: Jerusalem stood empty, like a wilderness
  preserved_meaning: Jerusalem had no inhabitants and resembled deserted land.
  reasoning_layer_used: Lexical decisions for ἀοίκητος and ὡς ἔρημος
  rationale: “Stood empty” is natural English while preserving the wilderness image.
- pob_phrase: there was no one entering or going out from her offspring
  simplified_phrase: No one from her own people was coming in or going out
  preserved_meaning: Jerusalem’s normal population movement had ceased.
  reasoning_layer_used: Lexical and theological decisions for γενημάτων
  rationale: “Her own people” avoids limiting the phrase to birthplace while the note preserves the unusual Greek.
- pob_phrase: the sanctuary was being trampled down ... flute and harp ceased
  simplified_phrase: The sanctuary was being trampled underfoot ... the flute and harp fell silent
  preserved_meaning: The sanctuary was physically dishonored, and music had ceased.
  reasoning_layer_used: Lexical decisions for καταπατούμενον, αὐλὸς, and κινύρα
  rationale: The wording clearly preserves both the trampling image and the end of music.
