simplification_decisions:
- pob_phrase: a force
  simplified_phrase: a military force
  preserved_meaning: The force is armed troops, not abstract power.
  reasoning_layer_used: Lexical decision for δύναμις and the military context.
  rationale: Adding “military” prevents a likely modern misunderstanding.
- pob_phrase: the remnant of Jerusalem
  simplified_phrase: what remained of Jerusalem
  preserved_meaning: The phrase broadly includes what was left of Jerusalem without limiting it to survivors.
  reasoning_layer_used: Lexical and theological decisions for κατάλιμμα.
  rationale: The clearer wording preserves the deliberately broad scope.
- pob_phrase: take away its memory
  simplified_phrase: erase its memory
  preserved_meaning: The attackers intended to eliminate remembrance of it.
  reasoning_layer_used: Lexical decision for ἆραι τὸ μνημόσυνον αὐτοῦ.
  rationale: “Erase” expresses the hostile image naturally while retaining its force.
translation_notes:
  risk_flags:
  - risk: The singular “its” may refer to Jerusalem or to the collective remnant just mentioned.
    mitigation: The pronoun remains unresolved, matching the POB’s grammatical judgment.
  - risk: “The place” leaves the location deliberately broad.
    mitigation: This wording follows the Greek article and avoids specifying the land or another location.
