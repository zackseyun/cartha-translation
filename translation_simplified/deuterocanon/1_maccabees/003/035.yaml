translation:
  language: en
  text: to send a military force against them, crush and remove Israel’s strength and what remained of Jerusalem, and erase its memory from the place.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “remove its memorial” or “blot out its remembrance.”
