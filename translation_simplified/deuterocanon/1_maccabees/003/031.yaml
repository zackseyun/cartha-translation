simplification_decisions:
- pob_phrase: And he was greatly troubled in his soul
  simplified_phrase: He was deeply troubled.
  preserved_meaning: He experienced severe inner distress.
  reasoning_layer_used: POB lexical decisions for ἠπορεῖτο, τῇ ψυχῇ αὐτοῦ, and σφόδρα
  rationale: The idiomatic wording conveys the whole-person distress without narrowing it to one faculty.
- pob_phrase: to collect the taxes of the regions
  simplified_phrase: to collect taxes from the regions
  preserved_meaning: He intended to obtain taxes associated with the regions without stating that they belonged to Persia.
  reasoning_layer_used: POB lexical decisions for λαβεῖν τοὺς φόρους and τῶν χωρῶν
  rationale: “From the regions” is natural English and avoids adding an unsupported possessive link.
- pob_phrase: to gather much silver
  simplified_phrase: gather a great deal of silver
  preserved_meaning: He planned to accumulate substantial monetary wealth represented by silver.
