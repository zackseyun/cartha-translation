translation:
  language: en
  text: Seron, commander of the Syrian army, heard that Judas had gathered a band and an assembly of faithful people with him, including people marching out to war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Faithful” can also mean “loyal,” referring to loyalty to Judas’s cause as well as faithfulness to the covenant community.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the commander of the army of Syria
  simplified_phrase: commander of the Syrian army
  preserved_meaning: Seron led Syria’s armed force.
  reasoning_layer_used: POB lexical decision for ὁ ἄρχων τῆς δυνάμεως Συρίας
  rationale: The shorter wording expresses the same military role in natural English.
- pob_phrase: a company and an assembly of the faithful
  simplified_phrase: a band and an assembly of faithful people
  preserved_meaning: Judas gathered both a martial group and an assembly without importing the later institutional sense of “church.”
  reasoning_layer_used: POB lexical and theological decisions for ἄθροισμα, ἐκκλησίαν, and πιστῶν
  rationale: “Band” suits the military setting, while “assembly” preserves the distinct communal idea.
- pob_phrase: with him, and of those going out to war
  simplified_phrase: with him, including people marching out to war
  preserved_meaning: The gathered assembly included people setting out for battle, without defining whether they were a separate group.
  reasoning_layer_used: POB lexical decision and revision history for μεθʼ αὐτοῦ and ἐκπορευομένων εἰς πόλεμον
  rationale: “Including” makes the compressed relationship readable without forcing a strict division between the descriptions.
