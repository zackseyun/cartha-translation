translation:
  language: en
  text: He saw that the silver in the treasuries had run out. The country was bringing in little tax money because of the division and the blow he had brought on the land,[a] involving the removal of established customs that had been followed since former times.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “because of the dissension and the calamity he had inflicted on the land.”
    reason: lexical_alternative
  - marker: b
    text: The “established customs” may refer to laws or ancestral customs.
    reason: lexical_alternative
