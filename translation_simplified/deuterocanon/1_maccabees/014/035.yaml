translation:
  language: en
  text: The people saw Simon’s faithfulness[a] and his plan to bring honor to his nation. So they appointed him their leader and high priest. They did this because of all he had done, because he had consistently upheld righteousness[b] and faithfulness for his nation, and because he had worked in every way to raise his people’s standing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can also be translated “faith.” In this context, it may emphasize Simon’s proven loyalty and reliability.
    reason: lexical_alternative
  - marker: b
    text: Or “justice”; the Greek word can refer to upright or fair conduct in public life.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the glory that he had purposed to bring about for his nation
  simplified_phrase: his plan to bring honor to his nation
  preserved_meaning: Simon deliberately intended to increase his nation’s honor or renown.
  reasoning_layer_used: Lexical decisions for δόξα and ἐβουλεύσατο ποιῆσαι
  rationale: The rewrite uses common wording while retaining deliberate purpose and public honor.
- pob_phrase: the righteousness and the faithfulness that he had maintained for his nation
  simplified_phrase: he had consistently upheld righteousness and faithfulness for his nation
  preserved_meaning: Simon continually maintained upright and faithful conduct for his national community.
  reasoning_layer_used: Lexical rationale for συνετήρησεν and theological decisions for πίστις and δικαιοσύνη
  rationale: “Consistently upheld” preserves continuing, nation-directed conduct rather than reducing it to static traits.
- pob_phrase: had sought in every way to exalt his people
  simplified_phrase: had worked in every way to raise his people’s standing
  preserved_meaning: Simon used every means to elevate his people’s public status.
  reasoning_layer_used: Lexical decisions for ἐζήτησεν παντὶ τρόπῳ and ὑψῶσαι
  rationale: The public-status sense of the image is expressed in natural modern English.
