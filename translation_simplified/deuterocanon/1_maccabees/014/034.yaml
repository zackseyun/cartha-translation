  text: He fortified Joppa on the coast and Gazara,[a] in the borderlands of Azotus. Enemies had lived in Gazara before, but he settled Jews there. He also supplied everything needed for restoration.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gazara may also be called Gezer; the Greek text reads “Gazara.”
    reason: lexical_alternative
  - marker: b
    text: The Greek may refer to restoring these places or reestablishing the Jewish communities settled there.
    reason: alternative_reading
