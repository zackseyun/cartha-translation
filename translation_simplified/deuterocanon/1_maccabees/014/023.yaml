translation:
  language: en
  text: The Spartan people decided to receive the men with honor. They also placed a copy of the men’s message in the official public records, so that the Spartans would have a record to remember them by. They also prepared a written copy of all this for Simon the high priest.
  philosophy: optimal-equivalence
