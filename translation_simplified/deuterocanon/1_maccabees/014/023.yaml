- pob_phrase: it pleased the people
  simplified_phrase: The Spartan people decided
  preserved_meaning: The civic body formally approved the action.
  reasoning_layer_used: POB lexical decision and lexical-alternative footnote
  rationale: “Decided” states the public-decision sense directly, while “Spartan” identifies the people named in the Greek.
- pob_phrase: a copy of their words in the public records of the people
  simplified_phrase: a copy of the men’s message in the official public records
  preserved_meaning: Their communication was copied into the civic archives.
  reasoning_layer_used: POB lexical decisions and cultural note
  rationale: “Message” and “official public records” make the documentary setting clear without technical language.
- pob_phrase: they wrote a copy of these things to Simon
  simplified_phrase: They also prepared a written copy of all this for Simon
  preserved_meaning: A further copy was produced for Simon as the recipient.
  reasoning_layer_used: POB lexical rationale
  rationale: This uses the POB-approved indirect-object sense “for Simon” in natural English.
interpretive_expansions:
- pob_phrase: so that the people of the Spartans might have a memorial of them
  rendering: so that the Spartans would have a record to remember them by
  claim: The archived copy served both as a record and as an enduring remembrance.
