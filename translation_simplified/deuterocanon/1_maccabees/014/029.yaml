translation:
  language: en
  text: Because wars had often broken out in the land, Simon son of Mattathias, from the family of Joarib, and his brothers willingly put themselves in danger. They stood against those who opposed their nation so that their sanctuary[a] and the law could remain standing. In this way they brought great honor to their nation.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “their holy place” or “their holy things.”
    reason: lexical_alternative
  - marker: b
    text: The Greek says literally, “they glorified their nation with great glory.”
    reason: simplification_note
simplification_decisions:
- pob_phrase: wars had often arisen
  simplified_phrase: wars had often broken out
  preserved_meaning: Wars repeatedly began in the land.
  reasoning_layer_used: Lexical decision for ἐγενήθησαν πόλεμοι
  rationale: “Broken out” is the usual plain-English expression for wars beginning.
- pob_phrase: one of the sons of Joarib
  simplified_phrase: from the family of Joarib
  preserved_meaning: Simon belonged to Joarib’s ancestral line.
  reasoning_layer_used: Applied revision on the genealogical phrase
  rationale: “From the family of” clearly expresses the genealogy without implying an immediate son.
- pob_phrase: glorified their nation with great glory
  simplified_phrase: brought great honor to their nation
  preserved_meaning: Their actions greatly increased the nation’s honor.
  reasoning_layer_used: Lexical alternative for δόξῃ μεγάλῃ ἐδόξασαν
  rationale: The smoother wording preserves the emphatic praise, while the footnote retains the Greek image.
