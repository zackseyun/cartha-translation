translation:
  language: en
  text: The Jews and the priests also approved Simon as their leader and high priest forever—until a trustworthy prophet should arise.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a faithful prophet” or “a true prophet.”
