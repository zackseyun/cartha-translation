simplification_decisions:
- pob_phrase: were pleased that Simon should be
  simplified_phrase: approved Simon as
  preserved_meaning: The Jews and priests formally favored Simon’s appointment.
  reasoning_layer_used: Lexical decision for εὐδόκησαν
  rationale: “Approved Simon as” states the formal decision more directly in common English.
- pob_phrase: their leader and high priest
  simplified_phrase: their leader and high priest
  preserved_meaning: Simon held both a governing role and the recognized priestly office.
  reasoning_layer_used: Lexical decisions for ἡγούμενον and ἀρχιερέα
  rationale: These clear titles preserve the two distinct offices.
- pob_phrase: forever, until a trustworthy prophet should arise
  simplified_phrase: forever—until a trustworthy prophet should arise
  preserved_meaning: The enduring grant remains explicitly qualified by the arrival of a prophet whose legitimacy can be trusted.
  reasoning_layer_used: Theological decision on εἰς τὸν αἰῶνα and the ἕως clause
  rationale: The dash makes the qualification easy to follow without resolving the text’s tension.
