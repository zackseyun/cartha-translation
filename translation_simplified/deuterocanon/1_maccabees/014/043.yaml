translation:
  language: en
  text: He was to oversee sacred affairs,[a] and everyone was to obey him. Every official document in the land was to be issued in his name, and he was to wear purple and gold.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek expression is broad and may also be translated “the holy things” or “the sanctuary.”
    reason: lexical_alternative
