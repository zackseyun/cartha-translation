  simplified_phrase: oversee sacred affairs
  preserved_meaning: Simon was given broad responsibility for holy and temple-related matters.
  reasoning_layer_used: lexical and theological decisions on μέλῃ περὶ and τῶν ἁγίων
  rationale: “Oversee sacred affairs” clearly expresses official responsibility without narrowing the phrase to the sanctuary.
- pob_phrase: should be obeyed by all
  simplified_phrase: everyone was to obey him
  preserved_meaning: All people were required to heed Simon’s authority.
  reasoning_layer_used: lexical decision on ἀκούηται
  rationale: The active wording is easier to read while preserving the command’s full force.
- pob_phrase: all documents in the country should be written in his name
  simplified_phrase: Every official document in the land was to be issued in his name
  preserved_meaning: Governmental writings were to carry Simon’s authorization.
  reasoning_layer_used: lexical decisions and cultural note on συγγραφαὶ and ἐπὶ τῷ ὀνόματι αὐτοῦ
  rationale: “Issued” makes the administrative act clearer than the literal “written.”
