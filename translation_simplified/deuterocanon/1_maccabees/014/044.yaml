translation:
  language: en
  text: No one, whether one of the people or one of the priests, may overturn any of these decisions or oppose what Simon says. No one may call an assembly in the country without his approval,[a] or wear purple clothing or a gold clasp.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “organize a faction in the country without him.”
    reason: lexical_alternative
  - marker: b
    text: Purple clothing and a gold clasp were signs of rank or official honor.
    reason: cultural_note
simplification_decisions:
- pob_phrase: it is not permitted for anyone of the people or of the priests
  simplified_phrase: No one, whether one of the people or one of the priests, may
  preserved_meaning: The formal prohibition applies to both the general population and the priests.
  reasoning_layer_used: POB lexical decision for οὐκ ἔξεστιν
  rationale: A direct prohibition is easier to read than the impersonal legal construction.
- pob_phrase: set aside any of these things
  simplified_phrase: overturn any of these decisions
  preserved_meaning: No one may invalidate the resolutions stated earlier.
  reasoning_layer_used: POB lexical decisions for ἀθετῆσαί and τούτων
  rationale: “Decisions” identifies the civic provisions, while “overturn” preserves their legal force.
- pob_phrase: to convene an assembly in the country without him
  simplified_phrase: call an assembly in the country without his approval
  preserved_meaning: Public gatherings require Simon’s authorization.
  reasoning_layer_used: POB lexical rationale and theological decision on civic authority
  rationale: Common wording makes the authorization requirement clear without implying rebellion.
interpretive_expansions:
- pob_phrase: what is said by him ... without him
  rendering: what Simon says ... without his approval
  claim: The pronoun refers to Simon, whose authority is established by the decree.
  evidence:
