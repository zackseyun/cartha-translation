translation:
  language: en
  text: They decided it was best to tear down the altar, so that it would not bring disgrace on them because the nations[a] had defiled it. So they tore down the altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Gentiles.” Here “the nations” means the non-Jewish peoples who had defiled the altar.
    reason: lexical_alternative
