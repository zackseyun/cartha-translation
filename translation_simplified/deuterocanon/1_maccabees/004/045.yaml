  rationale: The active wording expresses their deliberation in direct modern English.
- pob_phrase: to tear it down
  simplified_phrase: to tear down the altar
  preserved_meaning: They planned to dismantle the defiled altar physically.
  reasoning_layer_used: POB lexical decisions for καθελεῖν and αὐτό
  rationale: Naming the altar removes an unclear pronoun without changing its referent.
- pob_phrase: lest it become a reproach to them
