translation:
  language: en
  text: He chose priests without blemish who were devoted to the law.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “blameless priests who were zealous for the law.” The Greek may refer both to freedom from defect and to wholehearted commitment.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: blameless priests
  simplified_phrase: priests without blemish
  preserved_meaning: The priests were free from defect or blame and fit for priestly service.
  reasoning_layer_used: The lexical decision for ἀμώμους preserves both freedom from defect and moral fitness.
  rationale: “Without blemish” keeps the concrete priestly qualification in the main text.
- pob_phrase: devoted to the law
  simplified_phrase: who were devoted to the law
  preserved_meaning: The priests were actively committed to the ancestral Jewish law.
  reasoning_layer_used: The lexical and theological decisions identify positive commitment to the known covenantal law.
  rationale: The relative clause connects the qualification to the priests in natural English.
translation_notes:
  risk_flags:
  - risk: “Without blemish” may be heard only as physical fitness rather than also freedom from blame.
    mitigation: The footnote preserves “blameless” and explains that both senses may be present.
