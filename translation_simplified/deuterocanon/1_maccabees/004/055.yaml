translation:
  language: en
  text: All the people fell facedown. They worshiped and praised toward heaven—the one who had given them success.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “toward heaven.” This may describe the direction of their worship and praise while also referring indirectly to God in heaven.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: fell on their faces
  simplified_phrase: fell facedown
  preserved_meaning: The people prostrated themselves in worship.
  reasoning_layer_used: POB lexical decision for ἔπεσον ... ἐπὶ πρόσωπον
  rationale: “Fell facedown” expresses the same physical act in natural English.
- pob_phrase: worshiped and blessed
  simplified_phrase: worshiped and praised
  preserved_meaning: They honored the one in heaven through both worship and spoken praise.
  reasoning_layer_used: POB lexical decisions for προσεκύνησαν and ηὐλόγησαν
  rationale: “Praised” clearly conveys what blessing God means here.
- pob_phrase: the one who had prospered them
  simplified_phrase: the one who had given them success
  preserved_meaning: They honored the one responsible for their success without naming God directly.
  reasoning_layer_used: POB lexical and theological decisions for τὸν εὐοδώσαντα αὐτούς
  rationale: The documented alternative avoids the uncommon phrase “prospered them” while preserving the indirect designation.
translation_notes:
  risk_flags:
