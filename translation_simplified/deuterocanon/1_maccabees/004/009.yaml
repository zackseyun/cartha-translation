translation:
  language: en
  text: 'Remember this: our fathers[a] were saved in the Red Sea[b] when Pharaoh came after them in force.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Our fathers” means Israel’s forefathers.
    reason: simplification_note
  - marker: b
    text: Or “at the Red Sea”; some use “Reed Sea” to reflect the Hebrew background of the Exodus account.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Remember how our fathers were saved
  simplified_phrase: 'Remember this: our fathers were saved'
  preserved_meaning: The command calls the hearers to recall Israel’s earlier rescue.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The new sentence opening is easier to follow while retaining “remember,” “our fathers,” and “saved.”
- pob_phrase: Pharaoh pursued them with force
  simplified_phrase: Pharaoh came after them in force
  preserved_meaning: Pharaoh powerfully pursued Israel without specifying more than the Greek does.
  reasoning_layer_used: POB lexical decision for ἐδίωξεν and ἐν δυνάμει
  rationale: The common expression “came after them in force” keeps the military pressure without requiring the formal verb “pursued.”
translation_notes:
  risk_flags:
  - risk: Modern readers may take “our fathers” to mean immediate parents.
    mitigation: Footnote a identifies them as Israel’s forefathers while preserving the source’s masculine wording.
