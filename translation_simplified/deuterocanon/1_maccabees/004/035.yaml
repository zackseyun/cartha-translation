translation:
  language: en
  text: When Lysias saw that his army had been routed, he also saw how courageous Judas’s men had become. They were ready either to live or to die nobly. So Lysias went to Antioch and recruited foreign troops.[a] He planned to increase the size of his army and then return to Judea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “recruited mercenaries.” The Greek emphasizes that the troops were foreigners, but does not clearly say whether they were paid soldiers.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the rout that had happened to his own force
  simplified_phrase: his army had been routed
  preserved_meaning: Lysias’s military force had suffered a decisive battlefield rout.
  reasoning_layer_used: Lexical decisions for τροπή and σύνταξις
  rationale: The direct wording is easier to understand while preserving the severe military defeat.
- pob_phrase: the boldness that had arisen in Judas’s men, and how they were ready either to live or to die nobly
  simplified_phrase: how courageous Judas’s men had become. They were ready either to live or to die nobly.
  preserved_meaning: Judas’s forces had gained courage and were prepared for either outcome with honor.
  reasoning_layer_used: Lexical decisions for θάρσος and ἕτοιμοι εἶεν
  rationale: Two sentences clarify the referent while preserving the balanced alternatives and honor-laden wording.
- pob_phrase: intending, after becoming stronger in number, to come again into Judea
  simplified_phrase: He planned to increase the size of his army and then return to Judea.
  preserved_meaning: Lysias intended to enlarge his forces before another campaign in Judea.
  reasoning_layer_used: Lexical decisions for πλεοναστὸν and παραγίνεσθαι
  rationale: Ordinary English makes the military subject and sequence clear.
interpretive_expansions:
- pob_phrase: after becoming stronger in number
  rendering: increase the size of his army
  claim: The numerical increase concerns Lysias’s military force.
  evidence:
  - The preceding clause says that Lysias recruited foreign troops.
  - The POB lexical rationale identifies an implied military sense.
  confidence: high
  alternatives_preserved:
  - become more numerous
  - increase his forces
translation_notes:
  risk_flags:
  - risk: “Die nobly” may sound like a broad moral judgment to some readers.
    mitigation: It is retained because the Greek carries an honor-laden sense of dying bravely.
