translation:
  language: en
  text: 'When he saw how strong the army camp was, he prayed: “Blessed are you, Savior of Israel. By the hand of your slave David,[a] you crushed the mighty one’s attack. You handed the foreigners’ camp over to Jonathan son of Saul and the man who carried his armor.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “your servant David.” The Greek word can mean either “slave” or “servant”; here it emphasizes that David belonged wholly to God.
    reason: lexical_alternative
  - marker: b
    text: This prayer recalls David’s victory over Goliath and Jonathan’s attack with the man who carried his armor, though the Greek does not name Goliath or the Philistines here.
    reason: cross_reference
simplification_decisions:
- pob_phrase: And when he saw that the camp was strong, he prayed and said
  simplified_phrase: When he saw how strong the army camp was, he prayed
  preserved_meaning: He recognized the opposing military force as strong and responded with prayer.
  reasoning_layer_used: Lexical decision for παρεμβολή and immediate military context
  rationale: “Army camp” makes the military setting clear, while the shorter introduction avoids redundant wording.
- pob_phrase: who crushed the assault of the mighty one by the hand of your slave David
  simplified_phrase: By the hand of your slave David, you crushed the mighty one’s attack
  preserved_meaning: God decisively defeated the mighty attacker through David, who belonged to him.
  reasoning_layer_used: Lexical and theological decisions for συντρίψας, ὅρμημα, ἐν χειρί, and δοῦλος
  rationale: A direct sentence clarifies who acted while preserving the hand image and the chosen term “slave.”
- pob_phrase: gave the camp of the foreigners into the hands of Jonathan son of Saul and of the one who carried his armor
  simplified_phrase: handed the foreigners’ camp over to Jonathan son of Saul and the man who carried his armor
  preserved_meaning: God delivered the foreign military camp to Jonathan and his armor carrier.
  reasoning_layer_used: Lexical decisions for ἀλλοφύλων and αἰρόντος τὰ σκεύη αὐτοῦ
  rationale: “Handed over” expresses defeat naturally, and “the man” makes the participant easier to identify.
