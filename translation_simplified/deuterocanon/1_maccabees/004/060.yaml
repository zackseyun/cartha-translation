translation:
  language: en
  text: At that time they fortified Mount Zion by building high walls all around it and strong towers. They did this to keep the nations[a] from coming and trampling it as they had done before.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Gentiles.” The Greek term can mean “the nations” or “the Gentiles.”
