translation:
  language: en
  text: Make them cowardly. Melt away the boldness that comes from their strength. Let them be shaken by their crushing downfall.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Let them be shaken at their destruction.” The phrase may refer more generally to their ruin rather than to a concrete crushing.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Give them cowardice
  simplified_phrase: Make them cowardly
  preserved_meaning: The prayer directly asks God to cause the enemies to become cowardly.
  reasoning_layer_used: Lexical decision for δειλίαν and theological decision on imprecatory prayer
  rationale: This states the petition naturally without adding the unsupported image of filling.
- pob_phrase: melt the boldness of their strength
  simplified_phrase: Melt away the boldness that comes from their strength
  preserved_meaning: God is asked to dissolve the enemies’ confidence associated with their military strength.
  reasoning_layer_used: Lexical decisions for τῆξον, θράσος, and ἰσχύος
  rationale: The wording clarifies the relationship while preserving the vivid image of boldness melting.
- pob_phrase: let them be shaken by their own crushing
  simplified_phrase: Let them be shaken by their crushing downfall
  preserved_meaning: Their crushing or ruin is to destabilize them.
  reasoning_layer_used: Lexical decisions for σαλευθήτωσαν, συντριβῇ, and αὐτῶν
  rationale: “Crushing downfall” preserves the violent image while making the result understandable.
interpretive_expansions:
- pob_phrase: the boldness of their strength
  rendering: the boldness that comes from their strength
  claim: Their strength is presented as the basis of their bold confidence.
  evidence:
  - The Greek genitive directly links “boldness” and “strength.”
  - The POB rationale identifies this as the enemy’s aggressive confidence.
  confidence: moderate
  alternatives_preserved:
  - the boldness of their strength
translation_notes:
  risk_flags:
