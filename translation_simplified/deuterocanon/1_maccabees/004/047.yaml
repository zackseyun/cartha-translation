translation:
  language: en
  text: They took whole stones,[a] as the Law required. Then they built a new altar like the former one.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “whole” or “complete” stones; in light of the Law, this may mean unhewn stones.
    reason: lexical_alternative
  - marker: b
    text: This may also be translated “as before” or “according to the former pattern.”
    reason: alternative_reading
