simplification_decisions:
- pob_phrase: And it happened that when Alexander the king heard these words
  simplified_phrase: When King Alexander heard this message
  preserved_meaning: Alexander received the reported words before acting.
  reasoning_layer_used: POB lexical decisions for ἐγένετο ὡς and τοὺς λόγους τούτους
  rationale: The shorter opening keeps the narrative transition and naturally presents the words as a message.
- pob_phrase: he continued to honor Jonathan
  simplified_phrase: he gave Jonathan further honor
  preserved_meaning: Alexander added to the honor already shown to Jonathan.
  reasoning_layer_used: POB lexical decision for προσέθετο δοξάσαι and revision history
  rationale: “Further honor” clearly preserves the idiom’s additive force.
- pob_phrase: a clasp
  simplified_phrase: a decorative clasp
  preserved_meaning: The gift was an ornamental fastener without specifying its exact form.
  reasoning_layer_used: POB lexical decision and footnote for πόρπην
