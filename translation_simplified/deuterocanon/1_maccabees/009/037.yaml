  simplified_phrase: After this, Jonathan and his brother Simon were told
  preserved_meaning: The report came to Jonathan and to Simon, who was Jonathan’s brother, after what had just occurred.
  reasoning_layer_used: POB lexical decisions for the temporal transition, passive report, and family relationship
  rationale: The active English construction is easier to follow without adding a messenger.
- pob_phrase: were holding a great wedding
  simplified_phrase: were holding a grand wedding
  preserved_meaning: The sons of Jambri were celebrating a large and important wedding.
  reasoning_layer_used: POB lexical decision for ποιοῦσιν γάμον μέγαν
  rationale: “Grand wedding” expresses the scale naturally without adding an explicit feast.
- pob_phrase: the daughter of one of the great nobles of Canaan, with a large escort
