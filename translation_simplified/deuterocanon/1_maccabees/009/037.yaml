translation:
  language: en
  text: After this, Jonathan and his brother Simon were told that the sons of Jambri were holding a grand wedding. They were bringing the bride from Nadabath with a large escort.[a] She was the daughter of one of the great nobles of Canaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in a grand procession.” The Greek may refer either to those escorting the bride or to the festive procession itself.
    reason: lexical_alternative
