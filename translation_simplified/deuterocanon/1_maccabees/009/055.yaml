translation:
  language: en
  text: At that time Alcimus was struck down, and his activities were hindered. His mouth was blocked, and he was paralyzed. He could no longer say anything or give orders about his household.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “his affairs”; the Greek word for “house” can also mean a household establishment.
    reason: lexical_alternative
