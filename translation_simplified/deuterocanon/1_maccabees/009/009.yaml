translation:
  language: en
  text: But they turned away from him[a] and said, “We cannot possibly do this. Instead, let us save our own lives for now.[b] Let us come back with our brothers and fight them. But there are only a few of us.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean that they rejected his advice, not merely that they physically turned away.
    reason: lexical_alternative
  - marker: b
    text: The Greek literally says “souls,” but here it means their lives in danger.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: We certainly cannot do it
  simplified_phrase: We cannot possibly do this
  preserved_meaning: Their refusal remains emphatic.
  reasoning_layer_used: Lexical decision for Οὐ μὴ δυνώμεθα
  rationale: “Cannot possibly” expresses strong refusal in natural modern English.
- pob_phrase: Instead, let us save our own lives for now
  simplified_phrase: Instead, let us save our own lives for now
  preserved_meaning: They propose immediate survival as the alternative to fighting now.
  reasoning_layer_used: Lexical and theological decisions for ψυχὰς and τὸ νῦν
  rationale: Keeping “Instead” and “let us” preserves both the contrast and the proposal.
- pob_phrase: but we are few
  simplified_phrase: But there are only a few of us
  preserved_meaning: Their small number stands in contrast to the proposed battle.
  reasoning_layer_used: Chosen lexical rendering and doctrine realignment
  rationale: The recast clause uses ordinary English while retaining the adversative force.
translation_notes:
  risk_flags:
  - risk: “Turned away” may be understood only as physical movement.
    mitigation: Footnote a preserves the possible sense of rejecting his advice.
