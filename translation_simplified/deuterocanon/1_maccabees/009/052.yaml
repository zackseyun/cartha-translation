translation:
  language: en
  text: They strengthened the defenses of the city, Beth-zur, Gazara[b], and the citadel[a]. They stationed troops in each place and stored food supplies there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Acra,” a historical name for the fortified stronghold in Jerusalem.
    reason: lexical_alternative
  - marker: b
    text: Gazara is the Greek form of the name; the site is often identified with Gezer.
    reason: cross_reference
simplification_decisions:
- pob_phrase: fortified
  simplified_phrase: strengthened the defenses of
  preserved_meaning: They made these places more secure through military defenses.
  reasoning_layer_used: The lexical decision for ὠχύρωσαν allows “strengthened” while preserving the defensive sense.
  rationale: This wording makes the military action immediately clear.
- pob_phrase: stationed forces in them
  simplified_phrase: stationed troops in each place
  preserved_meaning: Military personnel were deployed at every named location.
  reasoning_layer_used: The lexical decision for δυνάμεις permits “troops,” and the plural context points to the named places.
  rationale: “Troops” and “each place” make the action and locations easier to follow.
- pob_phrase: supplies of food
  simplified_phrase: stored food supplies there
  preserved_meaning: Food provisions were stored at the fortified locations.
  reasoning_layer_used: The lexical rationale for παραθέσεις βρωμάτων describes food laid up or deposited.
  rationale: This removes the unclear pronoun while retaining the idea of stored provisions.
translation_notes:
  risk_flags:
  - risk: “The citadel” may refer specifically to Jerusalem’s Seleucid stronghold, the Acra.
    mitigation: Footnote a preserves that historical identification without forcing it into the main text.
