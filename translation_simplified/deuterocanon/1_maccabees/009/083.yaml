translation:
  language: en
  text: to Azotus,[a] and they went into Beth-dagon, the temple of their idol, seeking safety.[b] Then Jonathan set fire to Azotus and the surrounding cities.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Azotus is the Greek name for Ashdod.
    reason: lexical_alternative
  - marker: b
    text: The Greek literally says “their idol,” but it likely means the sanctuary at Beth-dagon, not only the statue.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: they entered Beth-dagon, their idol temple
  simplified_phrase: they went into Beth-dagon, the temple of their idol
  preserved_meaning: They entered the pagan sanctuary called Beth-dagon.
  reasoning_layer_used: POB lexical decisions for εἰσῆλθον and τὸ εἴδωλον αὐτῶν
  rationale: Ordinary motion language retains both the sanctuary sense and the idol image.
- pob_phrase: to be saved
  simplified_phrase: seeking safety
  preserved_meaning: They sought physical protection during their flight.
  reasoning_layer_used: POB theological decision for σωθῆναι
  rationale: This avoids suggesting spiritual salvation in a military retreat.
- pob_phrase: And Jonathan burned Azotus and the cities around it
  simplified_phrase: Then Jonathan set fire to Azotus and the surrounding cities
  preserved_meaning: Jonathan next caused Azotus and nearby cities to burn without claiming their total destruction.
  reasoning_layer_used: POB lexical decisions for ἐνεπύρισεν and τὰς πόλεις τὰς κύκλῳ
  rationale: “Then” marks sequence without adding contrast, while “set fire to” avoids overstating the damage.
interpretive_expansions:
