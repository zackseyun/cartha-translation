translation:
  language: en
  text: So he gave up coming with a large military force. He secretly sent letters to all his allies in Judea so they could seize Jonathan and those with him. But they could not do it,[a] because Jonathan and his companions learned of their plan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “he could not do it,” referring to the principal plotter rather than the conspirators collectively.
    reason: lexical_alternative
