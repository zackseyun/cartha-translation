  preserved_meaning: Judas strongly refuses to flee from the enemy.
  reasoning_layer_used: POB lexical decisions for Μή μοι γένοιτο and φυγεῖν ἀπʼ αὐτῶν
  rationale: The direct wording replaces an older idiom while preserving Judas’s forceful refusal.
