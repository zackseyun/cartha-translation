translation:
  language: en
  text: In the 153rd year, during the second month, Alcimus ordered the wall of the sanctuary’s inner court to be torn down. He tore down the works of the prophets[a] and began the demolition.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “the works of the prophets.” It may mean structures or repairs associated with the prophets, but the text does not explain what they were.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: in the one hundred and fifty-third year, in the second month
  simplified_phrase: In the 153rd year, during the second month
  preserved_meaning: The Seleucid-era year and month remain unchanged.
  reasoning_layer_used: Lexical decisions for the two date expressions
  rationale: Numerals and “during” make the date easier to read without modernizing it.
- pob_phrase: the wall of the inner court of the sanctuary
  simplified_phrase: the wall of the sanctuary’s inner court
  preserved_meaning: The wall still belongs to the inner court within the sacred temple area.
  reasoning_layer_used: Temple-topography theological decision
  rationale: The possessive form untangles the dense chain of phrases while retaining “sanctuary” and “inner court.”
- pob_phrase: and began to tear it down
  simplified_phrase: and began the demolition
  preserved_meaning: Alcimus began the act of tearing down without identifying the object more precisely than the Greek does.
  reasoning_layer_used: Lexical decision for ἐνήρξατο τοῦ καθαιρεῖν
  rationale: The noun phrase avoids a vague pronoun while preserving the demolition image and the source’s unspecified object.
translation_notes:
  risk_flags:
  - risk: “The works of the prophets” may be unclear to modern readers.
    mitigation: The literal phrase remains in the text, and the footnote explains the uncertainty without choosing a speculative referent.
  - risk: “Began the demolition” leaves the object unstated.
    mitigation: This preserves the Greek clause’s ambiguity rather than confidently identifying what Alcimus then began to destroy.
