  preserved_meaning: The two actions still portray a persistent, active pursuit.
  reasoning_layer_used: POB lexical decisions for ἐξεζήτουν and ἐξηραύνων
  rationale: “Tracking them down” makes the intensified search clear in ordinary English.
- pob_phrase: they were bringing them to Bacchides
  simplified_phrase: Again and again, they brought them to Bacchides
  preserved_meaning: The repeated action conveyed by the imperfect tense remains explicit.
  reasoning_layer_used: POB lexical decision for ἦγον
  rationale: A repeated-time phrase is clearer than the awkward progressive construction.
- pob_phrase: he took vengeance on them and mocked them
