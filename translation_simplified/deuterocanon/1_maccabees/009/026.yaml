translation:
  language: en
  text: They kept searching for Judas’s friends[a] and tracking them down. Again and again, they brought them to Bacchides, who took vengeance on them[b] and mocked them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Friends” may also mean Judas’s supporters or allies.
    reason: lexical_alternative
  - marker: b
    text: The expression may also be translated “punished them” or “exacted justice from them.”
    reason: lexical_alternative
