translation:
  language: en
  text: Judas changed course and went into Azotus, in the land of foreigners.[a] He tore down their altars. They burned the carved images of their gods,[b] and Judas took the spoils from the cities. Then he returned to Judea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may refer more specifically to the land of the Philistines, but the Greek says “the land of foreigners.”
    reason: alternative_reading
  - marker: b
    text: The Greek shifts here from “he” to “they,” probably referring to Judas and his forces.
    reason: textual_variant
simplification_decisions:
- pob_phrase: turned aside into Azotus
  simplified_phrase: changed course and went into Azotus
  preserved_meaning: Judas departed from his previous route and entered Azotus.
  reasoning_layer_used: Lexical decision for ἐξέκλινεν
  rationale: The wording makes the change of direction clear without assigning Judas a motive.
- pob_phrase: burned the carved images of their gods with fire
  simplified_phrase: burned the carved images of their gods
  preserved_meaning: The images were destroyed by burning.
  reasoning_layer_used: Lexical decisions for γλυπτά and κατέκαυσαν
  rationale: “With fire” is already contained in the common meaning of “burned,” while “carved images” preserves the material detail.
- pob_phrase: plundered the spoil of the cities
  simplified_phrase: took the spoils from the cities
  preserved_meaning: Judas seized goods from the cities as the spoils of conflict.
  reasoning_layer_used: Lexical decisions for ἐσκύλευσεν and τὰ σκῦλα
  rationale: The simpler clause avoids the difficult repetition of “plundered” and “spoil.”
translation_notes:
  risk_flags:
