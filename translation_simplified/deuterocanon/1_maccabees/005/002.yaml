simplification_decisions:
- pob_phrase: the offspring of Jacob who were among them
  simplified_phrase: the descendants of Jacob who lived among them
  preserved_meaning: The targets were Jewish people identified by descent from Jacob and residing among their enemies.
  reasoning_layer_used: lexical and theological decisions on τὸ γένος Ἰακώβ and the participial phrase
  rationale: “Descendants” and “lived among” express lineage and residence in familiar English.
- pob_phrase: And they were plotting ... and they began
  simplified_phrase: They plotted ... Then they began
  preserved_meaning: The hostile plan preceded its active execution.
  reasoning_layer_used: lexical decision on ἐβουλεύοντο and clause sequence
  rationale: Two sentences make the movement from planning to action easier to follow.
- pob_phrase: kill and wipe out those among the people
  simplified_phrase: killing and wiping out members of the people
  preserved_meaning: They began killing members of Jacob’s people with the aim of eradication.
  reasoning_layer_used: lexical decisions on ἐν τῷ λαῷ and ἐξαίρειν
  rationale: “Members of the people” makes the likely partitive sense natural while retaining both violent verbs.
