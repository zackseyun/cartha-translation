  reasoning_layer_used: POB lexical decision for ἐξῆλθεν
  rationale: “Set out” is natural narrative English without adding military detail.
- pob_phrase: its daughter towns
  simplified_phrase: the smaller towns under its control
  preserved_meaning: Hebron had smaller dependent settlements associated with it.
  reasoning_layer_used: POB lexical decision and cultural note for τὰς θυγατέρας αὐτῆς
  rationale: The wording explains the ancient geographical idiom directly.
- pob_phrase: he burned its towers all around
