simplification_decisions:
- pob_phrase: saying
  simplified_phrase: They said
  preserved_meaning: The speakers introduce their report.
  reasoning_layer_used: source syntax and readability
  rationale: The participle becomes a natural English reporting clause.
- pob_phrase: A gathering has been assembled
  simplified_phrase: A force has been assembled
  preserved_meaning: A group has been brought together for hostile action.
  reasoning_layer_used: POB lexical alternatives and military context
  rationale: “Force” is clearer than “gathering” without specifying an army.
- pob_phrase: from Ptolemais and Tyre and Sidon
  simplified_phrase: from Ptolemais, Tyre, Sidon
  preserved_meaning: The same three places are named as sources of the force.
  reasoning_layer_used: English list syntax
  rationale: Commas make the place list easier to read without changing it.
translation_notes:
  risk_flags:
  - risk: “Force” may sound more military than the Greek’s implied collective subject.
    mitigation: The hostile context supports it, and it avoids the more specific word “army.”
  - risk: The shift from “them” to “us” may appear inconsistent.
    mitigation: It remains because both the Greek and POB deliberately preserve that shift.
