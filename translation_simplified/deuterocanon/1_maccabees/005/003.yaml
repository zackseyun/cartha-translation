translation:
  language: en
  text: Judas fought the sons of Esau[a] in the Akrabattene region[b] of Judea because they were hemming Israel in. He dealt them a severe blow, subdued them, and took their plunder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the descendants of Esau”; they were likely the Edomites. The Greek says “the sons of Esau.”
    reason: lexical_alternative
  - marker: b
    text: Akrabattene was a region in Judea; the compressed Greek may also mean “in Judea, at Akrabattene.”
    reason: cultural_note
