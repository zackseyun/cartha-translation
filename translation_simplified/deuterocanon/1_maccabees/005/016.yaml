translation:
  language: en
  text: When Judas and the people heard this report[a], a large public assembly came together to discuss what they should do for their brothers[b], who were in distress and under attack by those nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek literally says “these words”; it can also mean “this report” or “these things.”
    reason: lexical_alternative
  - marker: b
    text: “Brothers” here means fellow members of the Jewish people.
    reason: cultural_note
simplification_decisions:
- pob_phrase: heard these words
  simplified_phrase: heard this report
  preserved_meaning: Judas and the people heard the message that had been brought to them.
  reasoning_layer_used: Lexical decision for τοὺς λόγους τούτους and footnote a
  rationale: “This report” makes the communicated message immediately clear while the footnote preserves the literal wording.
- pob_phrase: a great assembly gathered
  simplified_phrase: a large public assembly came together
  preserved_meaning: A substantial formal gathering convened without implying a Christian church.
  reasoning_layer_used: Lexical and theological decisions for ἐκκλησία μεγάλη
  rationale: “Large public assembly” clearly conveys the size and civic character of the gathering.
- pob_phrase: to consider what they should do
  simplified_phrase: to discuss what they should do
  preserved_meaning: The assembly met to deliberate about a practical response.
  reasoning_layer_used: Lexical decisions for βουλεύσασθαι and τί ποιήσωσιν
  rationale: “Discuss” is common English for collective deliberation and does not imply that a decision was already reached.
interpretive_expansions:
