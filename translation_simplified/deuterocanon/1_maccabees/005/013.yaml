translation:
  language: en
  text: All our brothers in the region of Tob have been killed. Their wives and children have been taken captive, and their possessions have been seized. About one thousand men have also been killed there.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek place-name is uncertain; it may mean “in Tob” or “among the Toubians.”
    reason: lexical_alternative
  - marker: b
    text: Greek literally says that about one thousand men were “destroyed.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And all our brothers who are in the region of Tob have been killed
  simplified_phrase: All our brothers in the region of Tob have been killed.
  preserved_meaning: Those described by the kinship term were violently killed in Tob’s territory.
  reasoning_layer_used: POB lexical decisions for ἀδελφοί, τοῖς Τουβίου, and τεθανάτωνται
  rationale: A direct sentence retains “brothers,” the locative sense, and violent death without implying residence.
- pob_phrase: they have taken their wives and children captive, along with their possessions
  simplified_phrase: Their wives and children have been taken captive, and their possessions have been seized.
  preserved_meaning: The attackers captured the families and took their movable property.
  reasoning_layer_used: POB lexical decisions for αἰχμαλωτίκασι and ὑποσκευήν
  rationale: Separate clauses clearly distinguish taking people captive from seizing property.
- pob_phrase: have destroyed about one thousand men there
  simplified_phrase: About one thousand men have also been killed there.
  preserved_meaning: Approximately one thousand men died through hostile action at that place.
  reasoning_layer_used: POB lexical decision and footnote for ἀπώλεσαν
  rationale: “Killed” states the natural wartime sense while the footnote preserves the Greek destruction image.
