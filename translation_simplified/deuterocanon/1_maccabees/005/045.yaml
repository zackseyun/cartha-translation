translation:
  language: en
  text: Judas gathered all the Israelites in Gilead, great and small, along with their wives, children, and baggage. It was a very large group going to the land of Judah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a very large camp.” The Greek word here can mean a camp, but in this context it includes the families and baggage traveling together.
    reason: lexical_alternative
