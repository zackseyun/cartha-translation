  reasoning_layer_used: POB lexical decision for πάντα Ἰσραὴλ τοὺς ἐν τῇ Γαλααδίτιδι
  rationale: The concrete plural is clearer than the collective phrase “all Israel.”
- pob_phrase: from the least to the greatest
