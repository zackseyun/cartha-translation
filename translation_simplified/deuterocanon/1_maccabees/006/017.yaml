  preserved_meaning: Lysias formally placed Antiochus in the royal office.
  reasoning_layer_used: Lexical decisions for κατέστησεν and βασιλεύειν
  rationale: “Made king” expresses formal accession more plainly than “installed ... to reign.”
- pob_phrase: in his place
  simplified_phrase: in his father’s place
  preserved_meaning: Antiochus succeeded his deceased father as king.
  reasoning_layer_used: Lexical decision for ἀντʼ αὐτοῦ and immediate context
  rationale: Naming the family relationship prevents unclear pronoun reference.
- pob_phrase: whom he had reared from youth
  simplified_phrase: Lysias had raised Antiochus from youth
  preserved_meaning: Lysias had personally brought up Antiochus while he was young.
  reasoning_layer_used: Lexical decisions for ἐξέθρεψεν and νεώτερον
  rationale: A separate sentence with named participants is easier to follow.
