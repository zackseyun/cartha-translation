translation:
  language: en
  text: Judas left the citadel[a] and set up camp at Beth-zachariah, across from the king’s camp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Acra,” the fortified citadel in Jerusalem.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: moved away from the citadel
  simplified_phrase: left the citadel
  preserved_meaning: Judas departed from the fortified stronghold without implying that he retreated.
  reasoning_layer_used: The lexical decision for ἀπῆρεν allows “departed” while warning against implying retreat.
  rationale: “Left” is direct common English and does not add a motive.
- pob_phrase: encamped at Beth-zachariah
  simplified_phrase: set up camp at Beth-zachariah
  preserved_meaning: Judas established a military camp at that location.
  reasoning_layer_used: The lexical decision for παρενέβαλεν identifies the action as making camp.
  rationale: “Set up camp” is clearer to modern readers than “encamped.”
- pob_phrase: opposite the king’s camp
  simplified_phrase: across from the king’s camp
  preserved_meaning: Judas’s camp faced the king’s camp from the opposing position.
  reasoning_layer_used: The lexical decision for ἀπέναντι permits “across from” as a spatial equivalent.
  rationale: “Across from” expresses the location in familiar English.
translation_notes:
  risk_flags:
  - risk: “Left” could be mistaken for a military retreat.
    mitigation: The wording states only departure and adds no language of defeat or withdrawal.
