translation:
  language: en
  text: He slipped beneath the elephant and struck it from below,[a] killing it. The elephant collapsed on top of him, and he died there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “stabbed it underneath.” The Greek describes an attack from below but does not clearly specify how it was delivered.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: slipped in under the elephant
  simplified_phrase: slipped beneath the elephant
  preserved_meaning: He deliberately moved into the confined space under the elephant.
  reasoning_layer_used: Lexical decision for εἰσέδυσεν and the spatial phrase ὑπὸ τὸν ἐλέφαντα.
  rationale: The shorter wording keeps the vivid tactical movement while reading more naturally.
- pob_phrase: struck it from beneath, and killed it
  simplified_phrase: struck it from below, killing it
  preserved_meaning: His attack from underneath killed the elephant.
  reasoning_layer_used: Lexical decisions for ὑπέθηκεν αὐτῷ and ἀνεῖλεν αὐτόν.
  rationale: The participial form makes the result clear without merging the attack and death.
- pob_phrase: it fell to the ground on top of him
  simplified_phrase: The elephant collapsed on top of him
  preserved_meaning: The elephant fell over him in the fatal collapse.
  reasoning_layer_used: Lexical decision for ἔπεσεν ἐπὶ τὴν γῆν ἐπάνω αὐτοῦ.
  rationale: Naming the elephant removes pronoun ambiguity, while “collapsed” conveys its fall to the ground.
translation_notes:
  risk_flags:
  - risk: “Collapsed” is less formally explicit about falling to the ground.
    mitigation: “On top of him” preserves the concrete direction and fatal result of the fall.
