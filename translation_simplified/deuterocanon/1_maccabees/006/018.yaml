translation:
  language: en
  text: He named his son Eupator. The people from the citadel kept Israel surrounded around the sanctuary.[a] They continually plotted harm and served as a source of support for the nations.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “around the holy precincts”; the Greek expression may refer to the wider sanctuary area.
    reason: lexical_alternative
  - marker: b
    text: Or “the Gentiles.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: He named him Eupator
  simplified_phrase: He named his son Eupator
  preserved_meaning: The father gave the name Eupator to the son introduced in the preceding verse.
  reasoning_layer_used: Immediate context in 1 Maccabees 6:17 and the POB lexical decision for ἐκάλεσεν τὸ ὄνομα αὐτοῦ
  rationale: Naming the son makes the backward reference clear without changing who received the name.
- pob_phrase: were hemming Israel in around the sanctuary
  simplified_phrase: kept Israel surrounded around the sanctuary
  preserved_meaning: They persistently enclosed Israel near the sanctuary precincts.
  reasoning_layer_used: POB lexical decisions for συγκλείοντες and κύκλῳ τῶν ἁγίων
  rationale: The direct wording preserves both continued confinement and its location.
- pob_phrase: seeking evil continually and serving as a support to the nations
  simplified_phrase: continually plotted harm and served as a source of support for the nations
  preserved_meaning: They persistently intended harm and functioned as backing for the foreign nations.
  reasoning_layer_used: POB lexical and theological decisions for ζητοῦντες κακὰ, διʼ ὅλου, and στήριγμα τοῖς ἔθνεσιν
  rationale: Common wording clarifies their hostility while preserving support as an ongoing function rather than a single act.
