translation:
  language: en
  text: At first, Lysias advanced with a strong force, but they drove him back. They became stronger by using the weapons they had taken from the camps they had destroyed.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean, “They prevailed with the weapons they had taken from the camps they had cut down.” The final phrase may picture either the camps being destroyed or their troops being cut down.
    reason: lexical_alternative
