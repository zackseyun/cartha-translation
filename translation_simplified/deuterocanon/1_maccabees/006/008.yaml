  rationale: Removing the formal transition and using “news” makes the narrative flow natural.
- pob_phrase: he fell upon his bed
  simplified_phrase: He collapsed onto his bed
  preserved_meaning: His emotional shock leads to a physical collapse on his bed.
  reasoning_layer_used: The lexical decision recognizes an emotional collapse and lists “collapsed onto” as a valid alternative.
  rationale: “Collapsed” clearly conveys the force of “fell” in this sequence.
- pob_phrase: because it had not happened for him as he had planned
  simplified_phrase: because things had not turned out as he had planned
  preserved_meaning: The king grieves because events did not follow his plans.
  reasoning_layer_used: The lexical decisions permit “turned out for him” while retaining “planned” for his intended outcome.
  rationale: The idiomatic wording replaces an awkward impersonal construction without changing its meaning.
