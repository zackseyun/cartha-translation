translation:
  language: en
  text: They divided the beasts—that is, the elephants—among the army units.[a] Beside each elephant,[b] they stationed 1,000 soldiers wearing chain mail and bronze helmets. They also assigned 500 picked horsemen to each elephant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek phrase is difficult and may also mean “into the divisions” or “into the companies.”
    reason: lexical_alternative
  - marker: b
    text: The Greek may also mean “for each elephant” or “at each elephant.”
    reason: lexical_alternative
