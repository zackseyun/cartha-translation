  preserved_meaning: The killing continued against people on both sides during his charge.
  reasoning_layer_used: POB lexical decisions for ἐθανάτου and δεξιὰ καὶ εὐώνυμα
  rationale: Adding “those on his” supplies the natural English object while preserving the ongoing action.
- pob_phrase: they were split apart before him on both sides
  simplified_phrase: the ranks split apart before him on both sides
  preserved_meaning: The military ranks opened in both directions as he advanced.
