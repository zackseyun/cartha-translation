translation:
  language: en
  text: Simon built up Judea’s stronghold. He surrounded it with high towers, massive walls, towers, gates, and locking bars.[a] He also stored food supplies in the strongholds.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek lists towers twice among the defenses.
    reason: source_note
simplification_decisions:
- pob_phrase: the stronghold of Judea
  simplified_phrase: Judea’s stronghold
  preserved_meaning: A single fortified place associated with Judea remains in view.
  reasoning_layer_used: POB lexical decision for τὸ ὀχύρωμα τῆς Ἰουδαίας
  rationale: The possessive form is easier to read without changing the relationship.
- pob_phrase: great walls and towers and gates and bars
  simplified_phrase: massive walls, towers, gates, and locking bars
  preserved_meaning: The full list of defensive structures, including the repeated towers, is retained.
  reasoning_layer_used: POB lexical decisions for fortification terms
  rationale: “Massive” and “locking bars” make the military function clear in common English.
- pob_phrase: he placed provisions in the strongholds
  simplified_phrase: He also stored food supplies in the strongholds
  preserved_meaning: Simon stocked multiple fortified places with food for their needs.
  reasoning_layer_used: POB lexical decisions for ἔθετο βρώματα and ἐν τοῖς ὀχυρώμασιν
  rationale: “Stored food supplies” states the concrete action more naturally than “placed provisions.”
translation_notes:
  risk_flags:
  - risk: The repeated mention of towers may sound redundant.
    mitigation: It is retained because the Greek repeats the term, with a short footnote explaining this.
  - risk: The shift from one stronghold to several may seem inconsistent.
    mitigation: Both numbers are preserved because the Greek changes from singular to plural.
