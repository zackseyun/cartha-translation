  review_summary: The draft usefully simplifies “my father’s house” to “my father’s family” and naturally conveys the emphatic pronoun with “You know very well.” Its footnote responsibly retains the live scope of “the holy things.” However, separating the final items into “You also know the wars and hardships” loses the contextual link between those wars/hardships and the family whose deeds and suffering Simon is recalling. Repeating “what” and supplying “we have endured” makes that implied connection clear without narrowing the reference or adding doctrine.
