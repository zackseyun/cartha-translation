translation:
  language: en
  text: Simon reached an agreement with them and did not fight them. He drove them out of the city and cleansed the houses that contained idols. Then he entered the city, singing hymns and speaking blessings.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Because these houses contained idols, this cleansing likely had a religious meaning as well as a physical one.
    reason: cultural_note
