translation:
  language: en
  text: Afterward, Tryphon came intending to enter the city and wipe it out. He surrounded the road to Adora.[a] Simon and his army marched opposite him wherever he went.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may mean that he blocked the road to Adora as part of a military maneuver.
    reason: lexical_alternative
  - marker: b
    text: The Greek may also mean that Simon’s army marched alongside him or advanced opposite him.
    reason: lexical_alternative
