  preserved_meaning: The events occurred after those just described.
  reasoning_layer_used: POB lexical decision for μετὰ ταῦτα
  rationale: The shorter transition expresses the same narrative sequence in natural English.
- pob_phrase: came to enter the city
  simplified_phrase: came intending to enter the city
  preserved_meaning: Tryphon came for the purpose of entering the city.
  reasoning_layer_used: POB lexical rationale for τοῦ ἐμβατεῦσαι
  rationale: The revised wording makes the purpose clause natural without strengthening “enter” to “invade.”
- pob_phrase: Simon and his camp marched opposite him to every place where he went
  simplified_phrase: Simon and his army marched opposite him wherever he went
  preserved_meaning: Simon’s military force repeatedly moved in relation to Tryphon wherever Tryphon went.
  reasoning_layer_used: POB lexical decisions for ἡ παρεμβολὴ αὐτοῦ, ἀντιπαρῆγεν αὐτῷ, and εἰς πάντα τόπον οὗ ἐπορεύετο
  rationale: “Army” clarifies the military sense, while “wherever” preserves the explicit link to Tryphon’s destinations.
