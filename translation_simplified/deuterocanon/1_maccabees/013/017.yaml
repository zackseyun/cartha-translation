simplification_decisions:
- pob_phrase: recognized that they were speaking deceitfully to him
  simplified_phrase: realized that they were deceiving him
  preserved_meaning: Simon discerned that their speech to him was deliberately deceptive.
  reasoning_layer_used: The lexical decisions for ἔγνω and δόλῳ establish discernment and actual deceitful speech.
  rationale: The rewrite states the deception plainly without reducing it to an attempted trick.
- pob_phrase: yet he sent
  simplified_phrase: Even so, he sent
  preserved_meaning: Simon sent the payment and the boys despite knowing about the deception.
  reasoning_layer_used: The POB translation preserves the contrast between his knowledge and his action.
  rationale: A new sentence makes the contrast immediately clear.
- pob_phrase: lest he stir up great hostility
  simplified_phrase: so that he would not stir up great hostility
  preserved_meaning: Simon acted to prevent widespread hostility from arising.
  reasoning_layer_used: The lexical rationale treats μή ποτε as preventative purpose or feared result.
  rationale: The familiar purpose clause replaces the less common word “lest.”
