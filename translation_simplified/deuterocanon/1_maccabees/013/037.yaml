translation:
  language: en
  text: 'To the elders and the Jewish nation: Greetings.


    We have received the gold crown and the palm branch you sent. We are ready to establish full peace with you and to write to the responsible officials about granting you exemptions.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek does not specify what obligations these exemptions covered; they were probably administrative or financial.
    reason: cultural_note
simplification_decisions:
- pob_phrase: And to the elders and the nation of the Jews, greetings.
  simplified_phrase: 'To the elders and the Jewish nation: Greetings.'
  preserved_meaning: The letter formally addresses the recognized leaders and the Jewish people as a nation.
  reasoning_layer_used: POB lexical decisions for πρεσβυτέροις, ἔθνει Ἰουδαίων, and χαίρειν
  rationale: The reordered opening reads naturally in English while retaining its diplomatic tone.
- pob_phrase: to make great peace with you
  simplified_phrase: to establish full peace with you
  preserved_meaning: The offer concerns an emphatic and substantial peace rather than a limited agreement.
  reasoning_layer_used: POB lexical decision for ποιεῖν ὑμῖν εἰρήνην μεγάλην
  rationale: “Full peace” conveys the source idiom’s emphasis in natural English.
- pob_phrase: to write to the officials in charge to grant you remissions
  simplified_phrase: to write to the responsible officials about granting you exemptions
  preserved_meaning: The sender will write to the appropriate administrators concerning release from certain obligations.
  reasoning_layer_used: Source γράφειν and POB lexical decisions for τοῖς ἐπὶ τῶν χρειῶν and ἀφεῖναι ὑμῖν ἀφέματα
  rationale: This keeps the concrete act of writing while replacing opaque “remissions” with clearer wording.
translation_notes:
  risk_flags:
  - risk: “Full peace” interprets the unusual phrase “great peace” rather than preserving its form.
    mitigation: It retains the documented emphasis without reducing the offer to ordinary peace.
  - risk: Readers may assume the exemptions were specifically tax exemptions.
    mitigation: The footnote states that their exact administrative or financial scope is unspecified.
