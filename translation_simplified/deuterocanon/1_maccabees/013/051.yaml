translation:
  language: en
  text: On the twenty-third day of the second month in year 171,[a] he entered the fortress with praise and palm branches. Harps,[b] cymbals, and other stringed instruments accompanied hymns and songs, because a great enemy had been crushed out of Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Year 171 is dated according to the Seleucid calendar.
    reason: cultural_note
  - marker: b
    text: The ancient instrument may have been a lyre; the exact modern equivalent is uncertain.
    reason: lexical_alternative
