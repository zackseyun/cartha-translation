translation:
  language: en
  text: But the people in Jerusalem’s citadel[a] were kept from going out into the surrounding countryside and from buying and selling. They suffered severe hunger, and many died from famine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Acra,” the name of the Seleucid stronghold in Jerusalem.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: those in the citadel at Jerusalem
  simplified_phrase: the people in Jerusalem’s citadel
  preserved_meaning: The verse refers to the occupants of Jerusalem’s fortified stronghold.
  reasoning_layer_used: POB lexical decision for ἄκρας and its footnote
  rationale: The possessive form is natural English, while the footnote preserves the place-name alternative.
- pob_phrase: were prevented from going out into the country and from buying and selling
  simplified_phrase: were kept from going out into the surrounding countryside and from buying and selling
  preserved_meaning: An outside constraint continually stopped both travel and ordinary market activity.
  reasoning_layer_used: POB lexical decisions for ἐκωλύοντο, χώρα, and the paired market verbs
  rationale: Plain wording clarifies the region outside Jerusalem while retaining both coordinated restrictions.
- pob_phrase: they became very hungry, and many of them perished from famine
  simplified_phrase: They suffered severe hunger, and many died from famine
  preserved_meaning: Their hunger was extreme, and famine caused an unspecified large number to die.
  reasoning_layer_used: POB lexical decisions for ἐπείνασαν σφόδρα, ἀπώλοντο, ἱκανοὶ, and λιμός
  rationale: The wording states the suffering and causal deaths directly without weakening their severity.
translation_notes:
  risk_flags:
