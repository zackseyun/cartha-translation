- pob_phrase: Ask and learn who I am and who the rest are who are helping us
  simplified_phrase: Ask and find out who I am and who the others helping us are
  preserved_meaning: The hearer is challenged to seek information about the speaker and his allies.
  reasoning_layer_used: POB lexical decisions for ἐρώτησον, μάθε, and οἱ λοιποί
  rationale: “Find out” and “the others helping us” express the sequence and active assistance in natural English.
- pob_phrase: they say
  simplified_phrase: People say
  preserved_meaning: An indefinite group reports the speaker’s formidable reputation.
  reasoning_layer_used: POB lexical decision for λέγουσιν
  rationale: “People say” makes the indefinite plural subject clear without identifying a specific group.
- pob_phrase: You have no footing to stand against us, because your fathers were routed twice
  simplified_phrase: You cannot stand your ground against us, because your fathers were defeated and forced to flee twice
  preserved_meaning: The opponents cannot hold their position, as shown by their fathers’ two military routs.
  reasoning_layer_used: POB lexical decisions for στάσις ποδὸς, κατὰ πρόσωπον ἡμῶν, δὶς, and ἐτροπώθησαν
  rationale: The familiar battle idiom preserves the standing image, while “defeated and forced to flee” explains the force of “routed.”
