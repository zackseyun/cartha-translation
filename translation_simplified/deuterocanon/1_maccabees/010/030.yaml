translation:
  language: en
  text: I also give up my right to collect one-third of the crops grown from seed and half of the fruit from the trees. From this day forward, these shares are not to be collected from the land of Judah and from the three districts added to it from Samaria and Galilee. This exemption will last for all time.
  philosophy: optimal-equivalence
