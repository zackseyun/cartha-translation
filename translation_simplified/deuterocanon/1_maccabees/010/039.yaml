translation:
  language: en
  text: I have given Ptolemais and its surrounding territory as a gift to the holy ones in Jerusalem, to pay the primary expenses of the holy place.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The final Greek clause is difficult; it may instead mean “to pay the necessary expenses of the holy ones.”
    reason: alternative_reading
  - marker: b
    text: “Holy ones” refers to the sacred community or personnel connected with Jerusalem and its temple.
    reason: simplification_note
