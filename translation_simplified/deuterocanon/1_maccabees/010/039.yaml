  simplified_phrase: its surrounding territory
  preserved_meaning: The grant includes the district attached to Ptolemais.
  reasoning_layer_used: lexical decision for τὴν προσκυροῦσαν αὐτῇ
  rationale: “Surrounding territory” states the geographical relationship in ordinary English.
- pob_phrase: for the expenses that come first
  simplified_phrase: to pay the primary expenses
  preserved_meaning: The gift supports expenses regarded as prior, principal, or designated.
  reasoning_layer_used: lexical decision for εἰς τὴν προκαθήκουσαν δαπάνην
  rationale: The purpose clause is recast naturally without claiming more precision than the unusual Greek allows.
- pob_phrase: the holy ones in Jerusalem
  simplified_phrase: the holy ones in Jerusalem
  preserved_meaning: The recipients are the sacred community or personnel associated with Jerusalem.
  reasoning_layer_used: doctrine realignment and lexical decision for τοῖς ἁγίοις
  rationale: The phrase is retained because the audited revision requires persons here rather than the sanctuary.
