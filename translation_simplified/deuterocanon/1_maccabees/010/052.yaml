translation:
  language: en
  text: After I returned to my kingdom, took my seat on my fathers’ throne,[a] took control of the government, crushed Demetrius, and gained control of our land,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “my ancestors’ throne.” “My fathers’ throne” is a royal expression about his family line.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: sat on the throne of my fathers
  simplified_phrase: took my seat on my fathers’ throne
  preserved_meaning: He claims the throne inherited through his royal family line.
  reasoning_layer_used: Lexical and theological decisions on the dynastic phrase
  rationale: The active wording is natural while retaining “fathers” and the succession claim.
- pob_phrase: took control of the rule
  simplified_phrase: took control of the government
  preserved_meaning: He gained mastery over the governing authority.
  reasoning_layer_used: Lexical decision for ἐκράτησα τῆς ἀρχῆς
  rationale: “Government” makes the political sense of “rule” clear without implying illegitimate seizure.
- pob_phrase: crushed Demetrius and gained control of our land
  simplified_phrase: crushed Demetrius, and gained control of our land
  preserved_meaning: He forcefully defeated Demetrius and then mastered the territory.
  reasoning_layer_used: Lexical decisions for συνέτριψα and ἐπεκράτησα
  rationale: The wording keeps the forceful defeat and resulting territorial control distinct.
translation_notes:
  risk_flags:
  - risk: “Government” may suggest a modern political institution.
    mitigation: In this royal context, it plainly refers to governing authority rather than a modern system.
