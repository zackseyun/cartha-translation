translation:
  language: en
  text: The king had him sit beside him. Then he told his officials, “Go with him to the center of the city and publicly proclaim, ‘No one may bring any complaint[a] against him about anything or trouble him for any reason.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “make any petition against him,” probably in an official or legal sense.
    reason: lexical_alternative
