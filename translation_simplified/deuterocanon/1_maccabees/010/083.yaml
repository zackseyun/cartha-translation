translation:
  language: en
  text: The cavalry was scattered across the plain. They fled to Azotus and went into Beth-dagon, their idol temple,[a] to find safety.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “Beth-dagon, their idol”; the context indicates the sanctuary connected with their idol.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And the cavalry was scattered in the plain
  simplified_phrase: The cavalry was scattered across the plain.
  preserved_meaning: The mounted troops were dispersed over the open level ground.
  reasoning_layer_used: Greek lexical decisions for ἡ ἵππος, ἐσκορπίσθη, and ἐν τῷ πεδίῳ
  rationale: A separate sentence and “across” make the battlefield movement easier to picture.
- pob_phrase: entered Beth-dagon, their idol temple
  simplified_phrase: went into Beth-dagon, their idol temple
  preserved_meaning: The fleeing troops entered the sanctuary associated with their idol.
  reasoning_layer_used: Lexical and theological decisions for Βηθδαγών and τὸ εἴδωλον αὐτῶν
  rationale: “Went into” is common English while “idol temple” preserves the source’s negative judgment.
- pob_phrase: to save themselves
  simplified_phrase: to find safety
  preserved_meaning: They entered the temple seeking protection from danger.
  reasoning_layer_used: Lexical decision for τοῦ σωθῆναι
  rationale: “To find safety” states the practical purpose naturally without promising that they were rescued.
