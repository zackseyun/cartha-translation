translation:
  language: en
  text: All festivals, Sabbaths, new-moon observances, and other appointed days—including the three days before a festival and the three days after it—are to be tax-free days for every Jew throughout my kingdom. On those days they are also to be granted release from civic obligations.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Release” may also mean “remission” or “pardon”; here it probably refers to relief from civic obligations.
    reason: lexical_alternative
