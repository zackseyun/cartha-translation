translation:
  language: en
  text: “Today we have appointed you high priest of your nation. You will also be called the king’s Friend.”[a] They sent him a purple robe and a gold crown.[b] “You are to take our side and maintain friendly relations with us.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “friend of the king.” This was likely an official royal title.
    reason: lexical_alternative
  - marker: b
    text: The Greek shifts here from the king’s words, “we have appointed,” to the narrator’s words, “they sent.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: And now today we have appointed you high priest of your nation, and to be called the king’s Friend
  simplified_phrase: Today we have appointed you high priest of your nation. You will also be called the king’s Friend.
  preserved_meaning: The completed appointment makes him national high priest and gives him an official court title.
  reasoning_layer_used: POB lexical decisions for καθεστάκαμεν, ἀρχιερέα, τοῦ ἔθνους σου, and φίλον βασιλέως
  rationale: Two direct sentences clarify the decree while retaining the perfect sense of “have appointed.”
- pob_phrase: and they sent him a purple robe and a crown of gold
  simplified_phrase: They sent him a purple robe and a gold crown.
  preserved_meaning: The royal gifts remain a purple garment and a crown made of gold.
  reasoning_layer_used: POB lexical decisions for πορφύραν and στέφανον χρυσοῦν
  rationale: “Gold crown” is natural English and preserves the royal investiture image.
- pob_phrase: and to take our side and maintain friendship with us
  simplified_phrase: You are to take our side and maintain friendly relations with us.
  preserved_meaning: He is expected both to support the king’s interests and to continue diplomatic loyalty.
  reasoning_layer_used: POB lexical decisions for φρονεῖν τὰ ἡμῶν and συντηρεῖν φιλίαν πρὸς ἡμᾶς
  rationale: The direct instruction clearly preserves both political expectations.
interpretive_expansions:
- pob_phrase: maintain friendship with us
  rendering: maintain friendly relations with us
  claim: The friendship is a continuing political relationship, not merely personal affection.
  evidence:
  - The POB lexical rationale identifies continuing diplomatic loyalty in this phrase.
  confidence: high
  alternatives_preserved:
  - maintain friendship with us
