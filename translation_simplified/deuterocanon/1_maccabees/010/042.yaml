translation:
  language: en
  text: In addition, the five thousand shekels of silver that they used to take each year from the sanctuary’s revenues, as in former years, are also canceled. That money belongs to the priests who serve there.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also refer to the sanctuary’s annual account or annual reckoning.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the five thousand shekels of silver that they used to take from the revenues ... from the sanctuary account each year
  simplified_phrase: the five thousand shekels of silver that they used to take each year from the sanctuary’s revenues
  preserved_meaning: The money was customarily taken each year in connection with sanctuary finances.
  reasoning_layer_used: POB lexical decisions for ἐλάμβανον, χρεῖαι, λόγος, and κατ’ ἐνιαυτόν
  rationale: The reordered clause is easier to follow without calling the collection a charge.
- pob_phrase: these also are remitted
  simplified_phrase: are also canceled
  preserved_meaning: The financial collection is no longer required.
  reasoning_layer_used: POB lexical decision for ἀφίεται
  rationale: Canceled gives the fiscal sense of remitted in common English.
- pob_phrase: because they belong to the priests who minister
  simplified_phrase: That money belongs to the priests who serve there
  preserved_meaning: The funds rightfully belong to priests performing sanctuary service.
  reasoning_layer_used: POB lexical decisions for ἀνήκειν and λειτουργέω
  rationale: A separate sentence makes the reason clear while preserving priestly service.
