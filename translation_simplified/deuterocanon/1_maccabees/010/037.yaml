translation:
  language: en
  text: Some of them will be assigned to the king’s major fortresses. Some of them who are trustworthy will be appointed to take care of the kingdom’s needs.[a] Their supervisors and rulers must also come from among them. They must live by their own laws, just as the king commanded in the land of Judah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean “manage the affairs or business of the kingdom.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: appointed in the king’s great strongholds
  simplified_phrase: assigned to the king’s major fortresses
  preserved_meaning: Some will receive posts at the king’s important fortified military sites.
  reasoning_layer_used: POB lexical decisions for κατασταθήσεται, ὀχυρώμασιν, and τοῖς μεγάλοις
  rationale: The wording makes the administrative and military setting clear.
- pob_phrase: from among them some shall be appointed over the needs of the kingdom, being trustworthy
  simplified_phrase: Some of them who are trustworthy will be appointed to take care of the kingdom’s needs
  preserved_meaning: Trustworthy members of the group will receive responsibility for royal administrative needs.
  reasoning_layer_used: POB lexical and theological decisions for ἐπὶ χρειῶν and πίστις, with the grounding review
  rationale: Repeating “some of them” avoids making the two sets distinct while clearly linking trustworthiness to service.
- pob_phrase: let those over them and the rulers be from among them, and let them live by their own laws
  simplified_phrase: Their supervisors and rulers must also come from among them. They must live by their own laws
  preserved_meaning: Their authorities will come from their group, and they will conduct life according to their laws.
  reasoning_layer_used: POB lexical decisions for οἱ ἐπʼ αὐτῶν, οἱ ἄρχοντες, and πορευέσθωσαν
  rationale: Two direct sentences preserve both provisions without over-explaining their referents.
