translation:
  language: en
  text: I set free, without any payment, every Jewish person who was taken captive from the land of Judah and brought anywhere in my kingdom. Everyone must also cancel the taxes on these people and their livestock.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may refer specifically to taxes on livestock, or more broadly to taxes and related property dues.
    reason: lexical_alternative
