  text: Each year I will also give fifteen thousand shekels of silver. The payment will come from the king’s account and be drawn from the areas that belong to him.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A shekel was an ancient unit of weight used for silver and money.
    reason: cultural_note
  - marker: b
    text: “The king’s account” may also mean the king’s revenue or treasury; the funds came from places under his authority.
    reason: lexical_alternative
