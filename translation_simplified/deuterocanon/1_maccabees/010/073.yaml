translation:
  language: en
  text: Now you will not be able to stand against the cavalry and such a large force on the open plain. There are no rocks there, not even pebbles, and nowhere to escape.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: withstand the cavalry and so great a force
  simplified_phrase: stand against the cavalry and such a large force
  preserved_meaning: The speaker predicts that the hearer cannot resist the mounted troops and the larger military force.
  reasoning_layer_used: POB lexical decisions for ὑποστῆναι, τὴν ἵππον, and δύναμιν τοσαύτην
  rationale: “Stand against” is more familiar than “withstand” while keeping the active military resistance.
- pob_phrase: in the plain
  simplified_phrase: on the open plain
  preserved_meaning: The confrontation will occur on level, exposed ground.
  reasoning_layer_used: POB lexical decision for ἐν τῷ πεδίῳ and its terrain contrast
  rationale: “Open” makes the kind of terrain immediately clear without changing the setting.
- pob_phrase: where there is neither stone nor pebble nor a place to flee
  simplified_phrase: There are no rocks there, not even pebbles, and nowhere to escape.
  preserved_meaning: The terrain provides neither large nor small stones and offers no escape route.
  reasoning_layer_used: POB lexical decisions for λίθος, κόχλας, and τόπος τοῦ φυγεῖν
  rationale: A separate sentence and “not even” make the escalating list easier to follow.
