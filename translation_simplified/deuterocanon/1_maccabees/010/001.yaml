translation:
  language: en
  text: In the 160th year, Alexander son of Antiochus Epiphanes advanced to Ptolemais and took control of the city. The people of Ptolemais received him, and he became king there.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “he reigned there.”
    reason: alternative_reading
