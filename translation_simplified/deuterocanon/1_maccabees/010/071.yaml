translation:
  language: en
  text: So if you are confident in your forces, come down and meet us on the plain.[a] The strength of the cities is on my side.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also mean “confront us” or “engage us” there.
    reason: lexical_alternative
  - marker: b
    text: This may mean the combined military forces supplied by the cities.
    reason: lexical_alternative
