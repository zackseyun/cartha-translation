translation:
  language: en
  text: In the fourth year that Ptolemy and Cleopatra ruled, Dositheus and his son Ptolemy brought the following letter about the Purim festival.[a] Dositheus said that he was a priest and a Levite. They said that the letter existed and had been translated by Lysimachus son of Ptolemy,[b] one of the people in Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek calls this festival the “Phrouraia,” its designation for the Jewish festival of Purim.
    reason: lexical_alternative
  - marker: b
    text: Or “They said that the letter was available and had been translated by Lysimachus son of Ptolemy.” The terse Greek may stress the letter’s availability rather than its authenticity.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: In the fourth year of the reign of Ptolemy and Cleopatra
  simplified_phrase: In the fourth year that Ptolemy and Cleopatra ruled
  preserved_meaning: The event is dated to the fourth year of their rule.
  reasoning_layer_used: Lexical decision for Βασιλεύοντος
  rationale: The verbal form is easier to understand than the formal phrase “of the reign of.”
- pob_phrase: Dositheus, who said that he was a priest and a Levite, and Ptolemy his son
  simplified_phrase: Dositheus and his son Ptolemy ... Dositheus said that he was a priest and a Levite
  preserved_meaning: Dositheus identified himself as both a priest and a Levite, and Ptolemy was his son.
  reasoning_layer_used: Lexical and theological decisions for ὃς ἔφη εἶναι and ἱερεὺς καὶ Λευείτης
  rationale: Two sentences untangle the names while retaining neutral reporting and both titles.
- pob_phrase: one of those in Jerusalem
  simplified_phrase: one of the people in Jerusalem
  preserved_meaning: Lysimachus belonged to the group located in Jerusalem.
  reasoning_layer_used: Lexical decision for τῶν ἐν Ἰερουσαλήμ
  rationale: Naming the implied people makes the Greek construction natural in English.
