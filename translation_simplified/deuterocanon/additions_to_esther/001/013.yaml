  reasoning_layer_used: POB lexical decisions for ἠκρόασεν, λογισμούς, μερίμνας, and ἐξηραύνησεν
  rationale: The rewrite turns abstract investigative wording into direct actions while keeping both listening and inquiry.
- pob_phrase: preparing to lay hands on King Artaxerxes
