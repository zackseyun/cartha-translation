translation:
  language: en
  text: He paid close attention to their plans and carefully found out what they intended to do. He learned that they were preparing to take hostile action against King Artaxerxes.[a] Then he told the king about them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “to lay hands on” the king; it may mean to seize or attack him.
    reason: lexical_alternative
