    mitigation: The vivid source image is retained because the POB explicitly rejects flattening it into explanatory prose.
  - risk: “Light dawned” supplies a verb that the compressed POB wording leaves implicit.
    mitigation: The verb makes the paired image readable while preserving light and sunrise as distinct elements.
