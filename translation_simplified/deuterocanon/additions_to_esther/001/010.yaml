simplification_decisions:
- pob_phrase: Light and the sun rose
  simplified_phrase: Light dawned, and the sun rose
  preserved_meaning: The opening keeps both light and sunrise as vivid, paired images.
  reasoning_layer_used: Lexical decision for φῶς and theological decision to preserve symbolic imagery
  rationale: Adding “dawned” gives the first image a natural English verb without reducing it to a time reference.
- pob_phrase: the lowly were exalted
  simplified_phrase: The lowly were lifted up
  preserved_meaning: People of low status undergo a dramatic reversal and are raised high.
  reasoning_layer_used: Lexical decision for οἱ ταπεινοὶ and ὑψώθησαν
  rationale: “Lifted up” is clearer than “exalted” and preserves the source image of elevation.
- pob_phrase: devoured the glorious
  simplified_phrase: devoured those who were honored
  preserved_meaning: The lowly completely overcome people who possess honor or renown.
  reasoning_layer_used: Lexical decisions for κατέφαγον and τοὺς ἐνδόξους
  rationale: The wording clarifies who “the glorious” are while retaining the forceful image “devoured.”
translation_notes:
  risk_flags:
