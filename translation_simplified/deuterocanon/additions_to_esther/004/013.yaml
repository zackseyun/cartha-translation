translation:
  language: en
  text: And he said to him, “When I saw you, my lord,[a] you looked like an angel of God. My heart was deeply troubled and afraid because of your glory.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “lord” is a respectful title for the king, not a title for God.
    reason: source_note
simplification_decisions:
- pob_phrase: I saw you, lord, like an angel of God
  simplified_phrase: When I saw you, my lord, you looked like an angel of God
  preserved_meaning: The speaker compares the king’s appearance to an angel without identifying him as one.
  reasoning_layer_used: POB lexical decisions for κύριε, ὡς, and ἄγγελον θεοῦ
  rationale: The recast makes the comparison natural while preserving it as a simile.
- pob_phrase: my heart was troubled with fear because of your glory
  simplified_phrase: My heart was deeply troubled and afraid because of your glory
  preserved_meaning: The king’s visible majesty caused inward agitation and fear.
  reasoning_layer_used: POB lexical decisions for ἐταράχθη, ἡ καρδία μου, ἀπὸ φόβου, and τῆς δόξης σου
  rationale: The wording keeps the heart image and clearly presents glory as the cause of the fearful agitation.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “lord” as a divine title.
    mitigation: Lowercase wording and the footnote identify it as an honorific for the king.
  - risk: “Deeply” slightly intensifies the stated inward agitation.
    mitigation: It conveys the force of the troubled heart without adding a separate emotion.
