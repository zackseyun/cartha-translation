  text: '...covered all over with gold and costly jewels.[a] He was terrifying. Then he raised his face, blazing with splendor at the height of his anger, and looked at the queen. The queen fell, and her color changed as she grew faint. She bent down over the head of the delicate attendant walking in front of her.'
