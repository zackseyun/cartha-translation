  - your lot
translation_notes:
  risk_flags:
  - risk: “Claimed as your own” states the relational sense more directly than the allotment image itself.
    mitigation: The footnote preserves the literal image and its inheritance sense.
  - risk: “Silence” is less forceful than the literal verb “destroy.”
    mitigation: The footnote retains the full image of destroying the praising mouth.
