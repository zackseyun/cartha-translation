translation:
  language: en
  text: Hear my urgent prayer. Have mercy on your people, whom you have claimed as your own.[a] Turn our mourning into gladness, so that we may live and sing praise to your name, O Lord. Do not silence those who praise you.[b] All Israel cried out with all their strength, because death was right before their eyes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “your lot,” an image for the people who belong to God as his allotted portion or inheritance.
    reason: lexical_alternative
  - marker: b
    text: The Greek literally asks God not to “destroy the mouth” of those who praise him, an image of silencing his worshipers.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Hear my petition
  simplified_phrase: Hear my urgent prayer
  preserved_meaning: The speaker asks God to hear a specific, urgent request.
  reasoning_layer_used: POB lexical decision for δέησις
  rationale: “Urgent prayer” is more familiar than “petition” while retaining its focused force.
- pob_phrase: be merciful to your allotted people
  simplified_phrase: Have mercy on your people, whom you have claimed as your own
  preserved_meaning: Israel is addressed as the people who belong to God as his allotted portion.
  reasoning_layer_used: POB lexical and theological decisions for ἱλάσθητι and τῷ κλήρῳ σου
  rationale: The relational meaning is clear in the text, while the footnote preserves the allotment image.
- pob_phrase: do not destroy the mouth of those who praise you
  simplified_phrase: Do not silence those who praise you
  preserved_meaning: The prayer asks God not to erase the praise offered by his worshipers.
  reasoning_layer_used: POB lexical rationale and footnote for μὴ ἀφανίσῃς στόμα αἰνούντων σου
  rationale: The established sense is stated directly, and the concrete mouth image remains in a footnote.
