translation:
  language: en
  text: He said, “Lord, Lord, you are King over every power.[a] Everything is under your authority. No one can stand against you when you choose to save Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “King of all dominions.” The Greek includes every kind of power or rule, not only earthly kingdoms.
    reason: lexical_alternative
