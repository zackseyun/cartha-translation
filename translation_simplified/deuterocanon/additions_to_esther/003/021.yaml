translation:
  language: en
  text: Lord, do not hand your scepter over to those who do not exist.[a] Do not let them gloat when we are brought down. Instead, turn their own plan back against them, and make an example of the one who launched this attack on us.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “to those who are nothing.” The Greek literally says “to those who do not exist.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: do not let them gloat over our downfall
  simplified_phrase: Do not let them gloat when we are brought down
  preserved_meaning: The enemies must not celebrate the community’s ruin.
  reasoning_layer_used: Lexical decision for πτῶσις and immediate context
  rationale: The clause now states the event directly instead of using the abstract word “downfall.”
- pob_phrase: turn their plan against them
  simplified_phrase: turn their own plan back against them
  preserved_meaning: Their hostile scheme is to recoil upon its makers.
  reasoning_layer_used: Lexical decision for στρέψον τὴν βουλὴν αὐτῶν ἐπʼ αὐτούς
  rationale: “Own” and “back” make the reversal easier to grasp without changing its direction.
- pob_phrase: the one who began this attack against us
  simplified_phrase: the one who launched this attack on us
  preserved_meaning: The prayer singles out the person who initiated the aggression.
  reasoning_layer_used: Lexical decisions for τὸν ἀρξάμενον and ἐφʼ ἡμᾶς
  rationale: “Launched” expresses initiating an attack in direct modern English.
translation_notes:
  risk_flags:
  - risk: “Those who do not exist” may sound like a literal denial that the enemies are real.
    mitigation: The footnote preserves the alternative “those who are nothing” without resolving the Greek’s theological tension.
