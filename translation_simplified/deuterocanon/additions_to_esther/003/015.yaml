translation:
  language: en
  text: 'From birth, I had heard this in my family’s tribe: “You, Lord, took Israel from among all the nations, and you took our fathers from among all their ancestors, as an everlasting inheritance. You did for them everything you had said.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “You fulfilled for them what you said.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I had heard from my birth, in the tribe of my ancestral family
  simplified_phrase: From birth, I had heard this in my family’s tribe
  preserved_meaning: The speaker received this tradition from birth within the tribe connected to the speaker’s family lineage.
  reasoning_layer_used: POB lexical decisions for ἐγὼ ἤκουον, ἐκ γενετῆς μου, and ἐν φυλῇ πατριάς μου
  rationale: The wording avoids ongoing hearing and expresses the tribe-family relationship naturally.
- pob_phrase: that you, Lord, took Israel ... and our fathers
  simplified_phrase: You, Lord, took Israel ... and you took our fathers
  preserved_meaning: The Lord selected both Israel and the fathers from larger groups.
  reasoning_layer_used: POB lexical decisions for ἔλαβες and the two ἐκ phrases
  rationale: Repeating “you took” makes the parallel actions easier to follow.
- pob_phrase: and you did for them what you spoke
  simplified_phrase: You did for them everything you had said
  preserved_meaning: The Lord carried out all that he had spoken for the fathers.
  reasoning_layer_used: POB lexical decision for ἐποίησας αὐτοῖς ὅσα ἐλάλησας
  rationale: A separate sentence and ordinary phrasing clarify the result without changing speech into an explicit promise.
interpretive_expansions:
- pob_phrase: what you spoke
  rendering: everything you had said
  claim: The expression refers collectively to all that the Lord had spoken.
  evidence:
  - The Greek ὅσα denotes the full set of things spoken.
  - The POB lists “all that you promised” as a possible rendering.
  confidence: high
  alternatives_preserved:
  - You fulfilled for them what you said.
translation_notes:
  risk_flags:
  - risk: “As an everlasting inheritance” leaves its precise grammatical referent open.
    mitigation: The wording preserves the POB’s covenantal ambiguity without defining who is the inheritance.
