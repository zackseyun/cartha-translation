  text: She took off her splendid clothes and put on clothes of distress and mourning. Instead of fine perfumes, she piled ashes and dung on her head. She greatly humbled her body. Where she had once adorned herself for joyful occasions, her hair was now twisted.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek phrase is difficult; it may describe her hair as twisted, tangled, or disheveled in mourning.
    reason: alternative_reading
