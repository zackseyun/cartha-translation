simplification_decisions:
- pob_phrase: Esther the queen
  simplified_phrase: Queen Esther
  preserved_meaning: Esther is identified by her royal title.
  reasoning_layer_used: POB translation and ordinary English title order
  rationale: English normally places the royal title before the name.
- pob_phrase: seized by a struggle of death
  simplified_phrase: gripped by a mortal struggle
  preserved_meaning: Esther is overtaken by intense struggle bound up with impending death.
  reasoning_layer_used: POB lexical decisions for ἀγών, θανάτου, and κατειλημμένη
  rationale: “Gripped” keeps the vivid force, while “mortal struggle” avoids portraying death as her opponent.
interpretive_expansions:
- pob_phrase: fled to the Lord
  rendering: fled to the Lord for refuge
  claim: Esther turned to the Lord as her refuge rather than physically fleeing toward him.
