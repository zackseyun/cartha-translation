translation:
  language: en
  text: Queen Esther fled to the Lord for refuge, gripped by a mortal struggle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “gripped by an agony of death.” The Greek links her intense struggle with impending death.
