  preserved_meaning: The concrete act of homage remains distinct from the possible sense of worship, and God remains the addressee.
  reasoning_layer_used: POB theological decision on προσκυνέω and lexical decision on κύριος
  rationale: The separate sentence is clearer, while “my Lord” reflects the prayer's divine address.
