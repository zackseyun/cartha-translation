translation:
  language: en
  text: Therefore, we have recognized that this nation alone stands against everyone. Through its laws, it introduces a foreign way of life. It is hostile to our affairs and commits the worst evils, so that the kingdom does not remain stable.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: These words are hostile accusations made in the royal letter; they portray the nation’s customs as alien to the empire.
    reason: cultural_note
simplification_decisions:
- pob_phrase: having recognized that this nation alone stands in opposition to every man
  simplified_phrase: we have recognized that this nation alone stands against everyone
  preserved_meaning: The royal speaker singles out this nation as opposed to every person.
  reasoning_layer_used: Lexical decisions for διειληφότες, μονώτατον, and παντὶ ἀνθρώπῳ
  rationale: The explicit subject and generic “everyone” make the accusation immediately clear.
- pob_phrase: introducing a foreign way of life in its laws
  simplified_phrase: Through its laws, it introduces a foreign way of life
  preserved_meaning: The accusation links the nation’s laws with customs portrayed as alien.
  reasoning_layer_used: Lexical rationale and cultural footnote for διαγωγὴν νόμων ξενίζουσαν παραλλάσσον
  rationale: A direct clause untangles the compressed legal and cultural wording.
- pob_phrase: being ill-disposed toward our affairs, accomplishing the worst evils, so that the kingdom does not attain stability
  simplified_phrase: It is hostile to our affairs and commits the worst evils, so that the kingdom does not remain stable
  preserved_meaning: The letter alleges hostility, grave wrongdoing, and resulting political instability.
  reasoning_layer_used: Lexical decisions for δυσονοοῦν, συντελοῦν, and εὐστάθεια
  rationale: Common verbs preserve the accusation while “so that” avoids overstating direct causation.
