translation:
  language: en
  text: I asked my advisers how this matter could be completed. Haman showed us the way.[a] He stood out among us for his good judgment. He had proved that his goodwill did not change and that his loyalty remained firm, and he held the kingdom’s second-highest position of honor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “Haman pointed it out to us” or “Haman made it known to us.”
    reason: lexical_alternative
