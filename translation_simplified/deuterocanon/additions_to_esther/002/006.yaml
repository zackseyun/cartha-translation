translation:
  language: en
  text: Therefore, we have instructed the officials writing to you in documents prepared by Haman.[a] Haman had been appointed to oversee state affairs and was honored as our “second father.”[b] They are to destroy every one of them, including women and children—root and branch—by the swords of their enemies. They must show no pity and spare no one. This is to happen on the fourteenth day of Adar, the twelfth month, of this year.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may refer to officials drafting the documents or dictating their wording.
    reason: lexical_alternative
  - marker: b
    text: “Second father” was an honorific court expression for Haman’s high position.
    reason: cultural_note
simplification_decisions:
- pob_phrase: those writing to you in the documents written by Haman
  simplified_phrase: the officials writing to you in documents prepared by Haman
  preserved_meaning: The king directs the people responsible for communicating Haman’s official documents.
  reasoning_layer_used: POB lexical decision and footnote on τοῖς ὑπαγρευομένοις ὑμῖν
  rationale: “Officials” clarifies the administrative setting while the footnote preserves uncertainty about drafting or dictation.
- pob_phrase: who was appointed over affairs and was our second father
  simplified_phrase: Haman had been appointed to oversee state affairs and was honored as our “second father”
  preserved_meaning: Haman held high administrative office and bore an unusual court honorific.
  reasoning_layer_used: POB lexical decisions for τοῦ τεταγμένου ἐπὶ τῶν πραγμάτων and δευτέρου πατρὸς ἡμῶν
  rationale: A separate sentence clarifies Haman’s roles without removing the father metaphor.
- pob_phrase: without any pity or sparing
  simplified_phrase: They must show no pity and spare no one
  preserved_meaning: The decree forbids both compassion and any exception from killing.
  reasoning_layer_used: POB lexical and theological decisions on violence language
  rationale: The direct command is easier to understand and does not soften the decree.
