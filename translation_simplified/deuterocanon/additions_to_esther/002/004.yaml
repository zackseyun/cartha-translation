translation:
  language: en
  text: Among all the peoples throughout the inhabited world, a certain hostile people is mixed in among them. Its laws[a] are opposed to those of every nation, and it continually disregards the decrees of kings[b], so that the blameless shared government under our direction may not be maintained.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “customs”; the Greek word can refer to either laws or customary practices.
    reason: lexical_alternative
  - marker: b
    text: The Greek is compressed here; this likely means neglecting or disregarding royal commands.
    reason: lexical_alternative
  - marker: c
    text: “Shared government” may also be translated “joint rule” or “common government.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: among all the tribes throughout the inhabited world
  simplified_phrase: Among all the peoples throughout the inhabited world
  preserved_meaning: The people are portrayed as dispersed among ethnic groups across the empire.
  reasoning_layer_used: POB lexical decision for φυλαῖς
  rationale: “Peoples” conveys the broad ethnic sense more clearly than “tribes” here.
- pob_phrase: there is mixed in a certain hostile people
  simplified_phrase: a certain hostile people is mixed in among them
  preserved_meaning: The letter depicts this people as intermingled with others and as hostile.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The new sentence order clarifies the relationship while retaining the accusation’s hostile tone.
- pob_phrase: the blameless joint-rule directed by us may not be maintained
  simplified_phrase: the blameless shared government under our direction may not be maintained
  preserved_meaning: The speaker claims that the people seek or serve to prevent faultless imperial administration from continuing.
  reasoning_layer_used: POB lexical decision for συναρχίαν and purpose/result decision for πρὸς τὸ μὴ κατατίθεσθαι
  rationale: “Shared government under our direction” clarifies the political claim, while “may not” preserves its purpose-or-result framing.
translation_notes:
  risk_flags:
  - risk: Modern readers may mistake the hostile charge for the narrator’s judgment.
    mitigation: The wording preserves the royal letter’s rhetoric without endorsing or neutralizing it.
  - risk: “Laws” may be read too narrowly because the Greek can also mean customs.
    mitigation: Footnote a preserves the broader lexical alternative.
