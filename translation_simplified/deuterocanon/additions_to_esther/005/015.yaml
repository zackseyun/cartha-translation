translation:
  language: en
  text: But we find that the Jews are not criminals. Instead, they live by the most righteous laws,[b] even though that man, cursed three times over,[a] handed them over to be destroyed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek uses an unusually strong insult; it may also be translated “the thrice-cursed one.”
    reason: lexical_alternative
  - marker: b
    text: Or “are governed by the most righteous laws.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the Jews, who have been handed over to destruction by that thrice-accursed man, are not criminals
  simplified_phrase: the Jews are not criminals ... even though that man, cursed three times over, handed them over to be destroyed
  preserved_meaning: The Jews are innocent despite being surrendered to a lethal fate by a fiercely denounced man.
  reasoning_layer_used: POB syntax and lexical decisions for παραδεδομένους, εἰς ἀφανισμόν, and τρισαλιτήριος
  rationale: Reordering and two sentences make the conclusion clear while preserving the surrender, destruction, and threefold curse image.
- pob_phrase: are not criminals, but are governed by most righteous laws
  simplified_phrase: are not criminals. Instead, they live by the most righteous laws
  preserved_meaning: Their law-abiding communal life directly contradicts the accusation that they are criminals.
  reasoning_layer_used: POB lexical alternatives for πολιτευομένους and theological decision for δικαιοτάτοις νόμοις
  rationale: “Instead” preserves the direct contrast, while “live by” clearly expresses active conduct according to the laws.
