translation:
  language: en
  text: But consider whether you can recognize how many lawless[a] deeds have been carried out through rulers whose unworthy use of power is like a pestilence. To find out, examine what is right before you rather than relying mainly on the earlier histories we handed down.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “impious”; the word condemns conduct that violates what is holy or right.
    reason: lexical_alternative
