- pob_phrase: the very man who had brought about these things
  simplified_phrase: that very man who had caused these things
  preserved_meaning: The man emphatically identified was responsible for making these events happen.
  reasoning_layer_used: POB lexical decision for αὐτὸν τὸν ταῦτα ἐξεργασάμενον
  rationale: “Caused” states the harmful agency more directly than “brought about.”
- pob_phrase: since God, who rules over all, swiftly repaid him with the punishment he deserved
  simplified_phrase: God, who rules over all, quickly gave ... the punishment he deserved
  preserved_meaning: God actively and promptly imposed deserved punishment.
  reasoning_layer_used: POB theological decision on divine action in judgment
  rationale: Reordering the clause makes God’s agency clear without weakening the judgment.
- pob_phrase: with his whole household
  simplified_phrase: along with everyone in his household
  preserved_meaning: The execution included his entire household, not only his immediate family.
  reasoning_layer_used: POB lexical decision for σὺν τῇ πανοικίᾳ
  rationale: “Everyone in his household” makes the full scope immediately understandable.
