translation:
  language: en
  text: 'because God, who rules over all, quickly gave that very man who had caused these things the punishment he deserved: he was crucified at the gate of Susa along with everyone in his household.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “was impaled” or “was hanged on a stake.” The Greek can refer to execution on a stake or cross; the exact Persian method may have differed from later Roman crucifixion.
    reason: lexical_alternative
