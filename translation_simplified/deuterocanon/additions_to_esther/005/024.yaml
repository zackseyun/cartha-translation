translation:
  language: en
  text: But if any entire city or region does not carry out these orders, it will be consumed in wrath by spear and fire. It will become impossible for people to enter, and it will become most hateful even to wild animals and birds for all time.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: every city or region as a whole that does not act according to these orders
  simplified_phrase: if any entire city or region does not carry out these orders
  preserved_meaning: The decree threatens every whole city or region that fails to obey.
  reasoning_layer_used: POB lexical decisions for πᾶσα ... τὸ σύνολον, κατὰ ταῦτα, and μὴ ποιήσῃ
  rationale: The conditional wording and “carry out” make the legal command easier to follow.
- pob_phrase: will be consumed with spear and fire in wrath
  simplified_phrase: will be consumed in wrath by spear and fire
  preserved_meaning: The punishment is wrathful destruction through armed violence and fire.
  reasoning_layer_used: POB lexical and theological decisions for δόρατι καὶ πυρὶ and καταναλωθήσεται μετʼ ὀργῆς
  rationale: This keeps both the consuming image and the source-specific word “spear.”
- pob_phrase: it will be made not only impassable to men, but also most hateful to wild animals and birds
  simplified_phrase: It will become impossible for people to enter, and it will become most hateful even to wild animals and birds
  preserved_meaning: The place will be inaccessible to human beings and supremely hateful even to animals and birds.
  reasoning_layer_used: POB lexical decisions for ἄβατος, ἀνθρώποις, and ἔχθιστος κατασταθήσεται
  rationale: The wording explains “impassable,” clarifies the generic human reference, and retains the superlative force.
