simplification_decisions:
- pob_phrase: And varied was the petition
  simplified_phrase: The petition ... took many forms
  preserved_meaning: The gathered people’s collective petition included appeals of different kinds.
  reasoning_layer_used: POB lexical decision for ποικίλη and δέησις
  rationale: The new clause uses natural word order while retaining both variety and the formal petition.
- pob_phrase: those who had gathered for this
