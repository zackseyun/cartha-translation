  preserved_meaning: They had gathered with this end in view, though who gathered them remains unstated.
  reasoning_layer_used: POB lexical decision for συλλεγέντων and εἰς τοῦτο
  rationale: Adding “purpose” makes the concise Greek expression immediately clear without specifying the purpose further.
- pob_phrase: concerning those who were being lawlessly handed over by him
  simplified_phrase: It concerned the people he was lawlessly handing over
  preserved_meaning: Their petition focused on people whom the previously mentioned man was wrongfully delivering into others’ hands.
