translation:
  language: en
  text: As the battle grew fierce and the situation increasingly favored Antiochus, Arsinoe went again and again among the troops. With pity and tears, her hair let down, she earnestly urged the soldiers to act bravely to help themselves, their children, and their wives. She promised each man two minas of gold if they won.[a]
