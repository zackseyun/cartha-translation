translation:
  language: en
  text: They had been trained to secure support. They loathed anyone who withdrew from their group and regarded such people as enemies of the nation. They excluded them from ordinary social contact and from useful participation in community life.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The exact nuance of “useful participation” is uncertain; the phrase broadly concerns a beneficial role in communal life.
    reason: lexical_alternative
