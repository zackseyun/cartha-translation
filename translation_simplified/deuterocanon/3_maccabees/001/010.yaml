translation:
  language: en
  text: He marveled at how well ordered the sanctuary was.[a] Afterward, he considered making plans to enter the temple itself.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “sanctuary” means the whole sacred complex, while “temple” means the temple building itself.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: when he had marveled also at the good order of the sanctuary
  simplified_phrase: He marveled at how well ordered the sanctuary was.
  preserved_meaning: His wonder follows from the sanctuary’s orderly arrangement.
  reasoning_layer_used: Lexical decisions for θαυμάσας and εὐταξίαν
  rationale: The direct clause is easier to read while retaining both wonder and positive order.
- pob_phrase: he considered making plans to enter
  simplified_phrase: Afterward, he considered making plans to enter
  preserved_meaning: He deliberated about planning an entry rather than firmly deciding to enter.
  reasoning_layer_used: Lexical decisions for ἐνεθυμήθη and βουλεύσασθαι
  rationale: “Afterward” clearly preserves the sequence marked by the Greek participle.
- pob_phrase: the temple
  simplified_phrase: the temple itself
  preserved_meaning: He intended to enter the temple proper, not merely the surrounding sacred complex.
  reasoning_layer_used: Theological decision distinguishing ἱερόν from ναός
  rationale: “Itself” makes the sacred-space distinction clearer in ordinary English.
