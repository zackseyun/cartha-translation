translation:
  language: en
  text: Philopator learned from those who had returned that Antiochus was seizing regions under Philopator’s rule. He gave orders to all his infantry and cavalry, took his sister Arsinoe with him, and went as far as the region near Raphia. Those with Antiochus[a] had already camped there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek expression may mean Antiochus and his forces or simply those associated with him.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: having learned from those who had returned of the seizure by Antiochus
  simplified_phrase: learned from those who had returned that Antiochus was seizing
  preserved_meaning: Returning people informed Philopator about Antiochus’s ongoing seizure of territory.
  reasoning_layer_used: Greek syntax and lexical decisions for μαθών and γινομένην ... ἀφαίρεσιν
  rationale: A direct clause replaces the dense participial wording while retaining the ongoing action.
- pob_phrase: gave orders to all his infantry and cavalry forces
  simplified_phrase: gave orders to all his infantry and cavalry
  preserved_meaning: Philopator commanded all his foot soldiers and mounted troops.
  reasoning_layer_used: Lexical decision for ταῖς πάσαις δυνάμεσιν πεζικαῖς καὶ ἱππικαῖς
  rationale: The familiar military terms already imply forces.
- pob_phrase: set out as far as the region of Raphia, where those with Antiochus had encamped
  simplified_phrase: went as far as the region near Raphia. Those with Antiochus had already camped there.
  preserved_meaning: Philopator reached the area near Raphia after Antiochus’s group had established camp there.
  reasoning_layer_used: Lexical decisions for ἐξώρμησεν, μέχρι τῶν κατὰ Ῥαφίαν τόπων, and οἱ περὶ Ἀντίοχον
  rationale: Two sentences clarify the movement’s extent, nearby location, and prior encampment.
interpretive_expansions:
- pob_phrase: the regions under his rule
  rendering: regions under Philopator’s rule
  claim: Philopator, not Antiochus, ruled the territories being seized.
  evidence:
  - The lexical rationale identifies Philopator as the ruler of the territories.
  - Antiochus is presented as taking those territories away.
  confidence: high
translation_notes:
  risk_flags:
  - risk: “Those with Antiochus” may or may not include Antiochus himself.
    mitigation: The footnote preserves both possible senses of the Greek idiom.
