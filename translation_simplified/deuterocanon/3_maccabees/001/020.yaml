translation:
  language: en
  text: The mothers and nurses[a] also left the newborn children behind, some at home and others in the streets. They did not turn aside but kept gathering at the supremely exalted sanctuary.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “wet nurses,” women who nursed infants.
    reason: lexical_alternative
  - marker: b
    text: Or “all-supreme sanctuary”; the Greek uses an intensified superlative.
    reason: lexical_alternative
