translation:
  language: en
  text: But once he had gained the upper hand over the plot,[a] he decided to go to the nearby cities and encourage the people there.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “mastered the scheme” or “suppressed the plot.”
    reason: lexical_alternative
  - marker: b
    text: “Encourage” may also be translated “exhort” or “appeal to.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: after gaining control of the plot
  simplified_phrase: once he had gained the upper hand over the plot
  preserved_meaning: He overcame a hostile plan before deciding what to do next.
  reasoning_layer_used: Lexical decisions for κατακρατήσας and ἐπιβουλῆς
  rationale: The idiom avoids suggesting that he took charge of carrying out the plot.
- pob_phrase: the neighboring cities
  simplified_phrase: the nearby cities
  preserved_meaning: The cities were geographically close.
  reasoning_layer_used: Lexical decision for τὰς πλησίον πόλεις
  rationale: “Nearby” is more immediate common English than “neighboring.”
- pob_phrase: encourage them
  simplified_phrase: encourage the people there
  preserved_meaning: He intended to address those represented by the cities.
  reasoning_layer_used: Lexical decision for παρακαλέσαι
  rationale: Naming the implied people prevents readers from thinking he encouraged the physical cities.
interpretive_expansions:
- pob_phrase: encourage them
  rendering: encourage the people there
  claim: The cities stand for the people in them who would receive his encouragement.
  evidence:
  - The POB rationale says the object is implied by “the cities.”
  - People, rather than physical cities, can receive encouragement.
  confidence: high
  alternatives_preserved:
  - encourage them
  - exhort the people there
  - appeal to the people there
translation_notes:
  risk_flags:
  - risk: “Gained the upper hand” does not specify whether he mastered or suppressed the plot.
    mitigation: Footnote a preserves both documented possibilities.
  - risk: “Encourage” may sound milder than political or military exhortation.
    mitigation: Footnote b preserves “exhort” and “appeal to” as alternatives.
