- pob_phrase: nor exult in the arrogance of their tongue
  simplified_phrase: or celebrate with arrogant speech
  preserved_meaning: They are not to rejoice exuberantly through proud, insolent speech.
  reasoning_layer_used: The lexical decision for ἀγαλλιάσωνται and the POB cultural note explain the tongue idiom.
  rationale: “Celebrate” avoids implying victory, and “arrogant speech” states the idiom clearly.
