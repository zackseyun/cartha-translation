- pob_phrase: might not boast in their wrath
  simplified_phrase: would not boast in their rage
  preserved_meaning: The purpose is to prevent the lawless from boasting in intense anger.
  reasoning_layer_used: The lexical decision for θυμός and the doctrine-realignment revision favor “rage.”
