translation:
  language: en
  text: For it seemed that not only the people but even the walls and all the ground were echoing. At that moment, everything was being exchanged for death instead of the desecration of the place.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The place” means the sacred precinct, probably the temple area, though the Greek simply says “the place.”
