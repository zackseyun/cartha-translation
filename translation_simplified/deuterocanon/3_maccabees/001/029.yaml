simplification_decisions:
- pob_phrase: not only the people, but even the walls and the whole ground, were resounding
  simplified_phrase: not only the people but even the walls and all the ground were echoing
  preserved_meaning: The people's outcry seemed to reverberate through the entire physical setting.
  reasoning_layer_used: POB lexical decisions for ἠχεῖν, τὰ τείχη, and τὸ πᾶν ἔδαφος
  rationale: “Echoing” clearly preserves the image of sound reverberating from the people, walls, and ground.
- pob_phrase: since then all things were being changed to death
  simplified_phrase: At that moment, everything was being exchanged for death
  preserved_meaning: The broad and unusual metaphor presents everything as being exchanged for death.
  reasoning_layer_used: POB lexical decision for τότε θάνατον ἀλλασσομένων
  rationale: “Being exchanged” preserves the source's vivid metaphor without implying an active trader.
- pob_phrase: instead of the profanation of the place
  simplified_phrase: instead of the desecration of the place
  preserved_meaning: Death is directly contrasted with the desecration of the place.
  reasoning_layer_used: POB lexical and theological decisions for ἀντὶ τῆς τοῦ τόπου βεβηλώσεως
  rationale: “Desecration” is clearer than “profanation,” while “the place” avoids adding a more specific noun.
