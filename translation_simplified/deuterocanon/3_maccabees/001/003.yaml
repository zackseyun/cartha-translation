translation:
  language: en
  text: Dositheus, known as the son of Drimylus, was a Jew by birth. But later he changed how he practiced his religion and turned away from the beliefs of his ancestors. He placed a man of no distinction[a] in the tent in his place. That man ended up suffering the punishment meant for Dositheus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “an unknown man.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the one called son of Drimylus
  simplified_phrase: known as the son of Drimylus
  preserved_meaning: Dositheus is identified by a patronymic or family designation.
  reasoning_layer_used: POB lexical decision on Δωσίθεος ὁ Δριμύλου λεγόμενος
  rationale: “Known as” expresses the identification naturally without deciding whether it was strictly patronymic.
- pob_phrase: later having changed his customs and become estranged from the ancestral beliefs
  simplified_phrase: later he changed how he practiced his religion and turned away from the beliefs of his ancestors
  preserved_meaning: He abandoned both inherited Jewish practice and inherited convictions.
  reasoning_layer_used: POB lexical and theological decisions on apostasy
  rationale: The rewrite separates practice from belief in ordinary English while retaining the verse’s moral force.
- pob_phrase: and it happened that this man received that one's punishment
  simplified_phrase: That man ended up suffering the punishment meant for Dositheus
  preserved_meaning: The substitute incurred the punishment intended for Dositheus.
  reasoning_layer_used: POB lexical decision on κομίσασθαι and ἐκείνου κόλασιν
  rationale: Naming Dositheus removes unclear pronouns and makes the grim outcome immediately understandable.
