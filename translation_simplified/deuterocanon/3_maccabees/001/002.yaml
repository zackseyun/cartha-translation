translation:
  language: en
  text: But a man named Theodotus made plans to carry out the plot. He took the best Ptolemaic weapons assigned to him and was taken at night to Ptolemy’s tent. His aim was to kill Ptolemy himself[a] and so bring the war to an end.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “to kill Ptolemy alone” or “to kill Ptolemy single-handedly.” The Greek may emphasize that Theodotus intended to do the killing himself.
    reason: lexical_alternative
