translation:
  language: en
  text: 'But he did not want his hostility to make everyone hate him, so he issued this written order: “But if any of them choose to associate with those initiated in the rites,[a] he will grant them citizenship equal to that of the Alexandrians.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “initiated in the mysteries.” The Greek uses language for initiation into religious rites.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: so that he might not become hateful to everyone by being hostile
  simplified_phrase: he did not want his hostility to make everyone hate him
  preserved_meaning: His hostile conduct could cause everyone to hate him.
  reasoning_layer_used: POB lexical decision for ἐχθόμενος ... ἐχθαίνηται
  rationale: The cause-and-effect wording is clearer while preserving the link between hostility and hate.
- pob_phrase: choose to conduct themselves among those initiated in the rites
  simplified_phrase: choose to associate with those initiated in the rites
  preserved_meaning: They deliberately choose social and religious association with people initiated into the rites.
  reasoning_layer_used: POB lexical and theological decisions for προαιρῶνται, ἀναστρέφεσθαι, and the initiation language
  rationale: “Associate with” avoids suggesting mere residence while retaining the social-religious context.
- pob_phrase: he makes these equal citizens with the Alexandrians
  simplified_phrase: he will grant them citizenship equal to that of the Alexandrians
  preserved_meaning: They receive civic status equal to that of Alexandrian citizens.
  reasoning_layer_used: POB lexical decision for ἰσοπολίτας Ἀλεξανδρεῦσι ποιεῖ
  rationale: This wording clearly states equal civic status rather than narrowing the decree to citizenship rights.
translation_notes:
  risk_flags:
  - risk: “Associate with” may not express the full sense of adopting the initiates’ way of life.
    mitigation: The deliberate choice and explicit initiation language retain the social-religious force without over-resolving the verb.
