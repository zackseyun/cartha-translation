  text: Then those who had formerly been disgraced and were near Hades—or rather[a], had already stepped onto it—in place of a bitter and hard-to-drink fate, prepared a saving drinking-bout, divided up as dining-couches, full of joy[c][b], the place prepared for them for downfall and a grave.
