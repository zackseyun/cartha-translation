translation:
  language: en
  text: Then the king called the official in charge of revenue to the city. He ordered him to provide the Jews with wine and everything else needed for a seven-day feast. The king decided that they should celebrate their deliverance[a] with great joy in the very place where they had expected to be destroyed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “salvation.” Here the Greek term refers to their rescue from destruction.
    reason: lexical_alternative
