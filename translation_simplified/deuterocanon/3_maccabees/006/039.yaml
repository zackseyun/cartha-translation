  preserved_meaning: The phrase still connects this rescue with the preceding circumstances.
  reasoning_layer_used: POB lexical decisions for ἐν αἷς and καὶ
  rationale: “Events” makes the backward reference clearer without specifying its details.
- pob_phrase: after gloriously revealing his mercy, the Sovereign of all rescued them
  simplified_phrase: after the Sovereign of all gloriously revealed his mercy, he rescued them
  preserved_meaning: The revelation of God's mercy remains subordinate and prior to the rescue.
  reasoning_layer_used: POB lexical decisions for ἐπιφάνας, μεγαλοδόξως, ἔλεος, and ἐρρύσατο
  rationale: A finite clause clarifies the action while preserving its temporal relationship to the rescue.
- pob_phrase: without stumbling
  simplified_phrase: without any of them falling
  preserved_meaning: The source image of being kept from falling remains intact.
  reasoning_layer_used: POB lexical decision and footnote for ἀπταίστους
  rationale: Personal wording makes the image easier to understand.
