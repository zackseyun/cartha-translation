translation:
  language: en
  text: In these events too, after the Sovereign of all gloriously revealed his mercy, he rescued them all together without any of them falling.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The image of not falling likely means that they were rescued unharmed.
    reason: lexical_alternative
  - marker: b
    text: “All together” may also mean “with one accord.”
    reason: lexical_alternative
