translation:
  language: en
  text: Father, you destroyed Pharaoh—the former ruler of this land of Egypt—and his proud army as the sea swallowed them. He had risen up in lawless arrogance, speaking boastfully and committing more and more reckless acts.[a] Yet you made the light of your mercy shine on the people of Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The difficult Greek phrase may also mean “multiplying acts of insolence.”
    reason: lexical_alternative
