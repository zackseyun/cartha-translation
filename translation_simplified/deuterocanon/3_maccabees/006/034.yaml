translation:
  language: en
  text: Those same people had earlier looked on them as doomed to destruction and to be devoured by birds.[a] They had gladly registered them. But now they groaned deeply and wrapped themselves in shame, and their fire-breathing boldness was forcefully quenched.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek wording is difficult here, but the clause clearly describes their earlier expectation that the Jews would be destroyed and left for birds to devour.
    reason: textual_variant
simplification_decisions:
- pob_phrase: those who had previously been reckoning them for destruction and to be devoured by birds
  simplified_phrase: Those same people had earlier looked on them as doomed to destruction and to be devoured by birds
  preserved_meaning: They had regarded the Jews as destined for destruction and exposure to birds.
  reasoning_layer_used: POB textual note and lexical decisions for ἐξεσθιέμενοι, εἰς ὄλεθρον, and οἰωνόβρωτους
  rationale: The rewrite makes the hostile expectation natural without claiming more than the difficult Greek supports.
- pob_phrase: and had registered them with joy
  simplified_phrase: They had gladly registered them.
  preserved_meaning: They took pleasure in officially listing the Jews.
  reasoning_layer_used: POB lexical decisions for ἀπογραφάμενοι and μετὰ χαρᾶς
  rationale: A separate sentence clarifies both the official action and their willing delight in it.
- pob_phrase: clothing themselves with shame, and their fire-breathing boldness was vigorously quenched
  simplified_phrase: wrapped themselves in shame, and their fire-breathing boldness was forcefully quenched
  preserved_meaning: Shame covered them like clothing, and their fierce arrogance was strongly suppressed like a flame.
  reasoning_layer_used: POB lexical decisions for αἰσχύνην…περιβαλόμενοι, πυρόπνουν τόλμαν, and ἀκμαίως ἐσβεσμένοι
  rationale: The wording preserves both the clothing metaphor and the linked fire-and-quenching image in clearer English.
