translation:
  language: en
  text: Who has so lawlessly surrounded these people with cruelties—people who, from the beginning, have shown us greater goodwill in every way than any other nation[a] and have repeatedly proved themselves while facing the worst dangers among men?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “have differed from every other nation in every way”; here the Greek likely means that they surpassed them in goodwill.
    reason: lexical_alternative
  - marker: b
    text: The Greek phrase is difficult and may mean the gravest dangers encountered in human affairs or dangers that people suffer.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: those who from the beginning have surpassed all nations in goodwill toward us in every respect
  simplified_phrase: these people, who, from the beginning, have shown us greater goodwill in every way than any other nation
  preserved_meaning: Their goodwill toward the speaker's people exceeded that of every other nation.
  reasoning_layer_used: POB lexical decisions for τοὺς ἐξ ἀρχῆς, εὐνοίᾳ πρὸς ἡμᾶς, and κατὰ πάντα διαφέροντας πάντων ἐθνῶν
  rationale: The comparison is recast in ordinary English without weakening its scope or force.
- pob_phrase: who have repeatedly shown themselves to face
  simplified_phrase: have repeatedly proved themselves while facing
  preserved_meaning: Their conduct became evident again and again amid extreme danger.
  reasoning_layer_used: POB lexical decisions for ἐπιδειγμένους and πλεονάκις
  rationale: The awkward reflexive construction becomes natural English while retaining repeated demonstration.
- pob_phrase: has so lawlessly surrounded with cruelties
  simplified_phrase: has so lawlessly surrounded these people with cruelties
  preserved_meaning: Someone wickedly hemmed these people in with cruel abuse and outrage.
  reasoning_layer_used: POB lexical decisions for οὕτως ἀθέσμως and περιέβαλεν αἰκίαις
  rationale: The direct main verb preserves both the moral-legal force and the vivid encirclement image.
