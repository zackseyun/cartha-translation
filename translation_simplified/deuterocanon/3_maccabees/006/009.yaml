  confidence: high
  alternatives_preserved:
  - being mistreated
  - being outrageously abused
translation_notes:
  risk_flags:
  - risk: “The people of Israel” may make the genealogical force of γένος less explicit.
    mitigation: The corporate expression still identifies the holy ones with ethnic Israel rather than a generalized religious group.
  - risk: The denunciation could be misread as applying to all non-Israelite peoples.
    mitigation: Footnote [b] limits it to the peoples abusing Israel in this setting.
