translation:
  language: en
  text: And now, you who hate arrogant abuse, who are rich in mercy, and who judge all—quickly show yourself[a] to the holy ones of the people of Israel. They are suffering humiliating abuse from detestable, lawless nations.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “appear”; the prayer asks God to make his saving intervention visible.
    reason: lexical_alternative
  - marker: b
    text: Here “nations” means the non-Israelite peoples abusing them.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: hater of insolence, rich in mercy, judge of all
  simplified_phrase: you who hate arrogant abuse, who are rich in mercy, and who judge all
  preserved_meaning: The three titles describe God’s opposition to arrogant abuse, abundant mercy, and universal judgment.
  reasoning_layer_used: POB lexical decisions for μισόβρι, πολυέλεε, and τῶν ὅλων δίκαστα
  rationale: Parallel clauses clarify the titles while “all” retains the broad scope of judgment.
- pob_phrase: quickly appear
  simplified_phrase: quickly show yourself
  preserved_meaning: The prayer urgently asks God to become visibly present in saving action.
  reasoning_layer_used: POB footnote and lexical decision for ἐπιφάνηθι
  rationale: “Show yourself” makes the requested visible intervention clear.
- pob_phrase: the holy ones of Israel’s race
  simplified_phrase: the holy ones of the people of Israel
  preserved_meaning: The phrase identifies God’s consecrated people as the corporate people of Israel.
  reasoning_layer_used: POB lexical and theological decisions for τοῖς ἁγίοις and γένος
  rationale: “The people of Israel” preserves people-group identity without making individual descent the sole emphasis.
interpretive_expansions:
- pob_phrase: quickly appear
  rendering: quickly show yourself
  claim: The request is for God to intervene in a visible way.
  evidence:
