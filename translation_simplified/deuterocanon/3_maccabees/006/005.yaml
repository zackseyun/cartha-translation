translation:
  language: en
  text: You, Master,[a] shattered Sennacherib, the oppressive king of Assyria.[b] His countless forces had made him arrogant. By the spear, he had already brought the whole land under his control. He proudly rose against your holy city and spoke harsh words with boasting and insolence. As you shattered him, you made your might clearly known to many nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek title here is “Master,” not the more common “Lord.”
    reason: lexical_alternative
  - marker: b
    text: Or “harsh,” “terrible,” or “mighty king”; the Greek word can describe someone as oppressive or grievous.
    reason: lexical_alternative
