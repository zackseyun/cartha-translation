translation:
  language: en
  text: Let all nations see that you are with us, Lord, and that you have not turned your face away from us. You said, “Even when they were in the land of their enemies, I did not disregard them.”[a] So fulfill what you said, Lord.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This echoes God’s covenant promise not to reject his people even in the land of their enemies.
    reason: cross_reference
simplification_decisions:
- pob_phrase: Let it be shown to all the nations
  simplified_phrase: Let all nations see
  preserved_meaning: The prayer asks God to make his presence with his people evident to every nation.
  reasoning_layer_used: POB lexical decision for δειχθήτω and πᾶσιν ἔθνεσιν
  rationale: The active English form expresses the passive petition more naturally.
- pob_phrase: Not even when they were in the land of their enemies did I disregard them
  simplified_phrase: Even when they were in the land of their enemies, I did not disregard them
  preserved_meaning: God did not ignore or cast off his people while they were among their enemies.
  reasoning_layer_used: POB lexical and theological decisions for ὑπεριδον and the direct quotation
  rationale: Reordering the negative makes the quotation easier to understand without weakening it.
- pob_phrase: but just as you said ... so accomplish it
  simplified_phrase: You said ... So fulfill what you said
  preserved_meaning: The prayer appeals to God to bring his own prior words to fulfillment.
  reasoning_layer_used: POB lexical decisions for καθὼς εἶπας and ἐπίτελεσον
  rationale: Two short sentences clarify the appeal and its requested fulfillment.
interpretive_expansions:
- pob_phrase: accomplish it
  rendering: fulfill what you said
  claim: The object to be fulfilled is the divine statement just quoted.
  evidence:
