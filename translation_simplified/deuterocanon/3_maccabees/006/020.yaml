translation:
  language: en
  text: Even the king’s body began to shudder, and forgetfulness[a] overcame his grim boldness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “forgetfulness,” but it may mean that sudden confusion caused him to lose his resolve.
