  preserved_meaning: The king experienced a visible, physical reaction of trembling dread.
  reasoning_layer_used: Lexical decisions for ὑπόφρικον and σῶμα
  rationale: The active wording is more natural while retaining the bodily image of shuddering.
- pob_phrase: his heavy-hearted boldness
