translation:
  language: en
  text: Set them free! Free them from these unjust restraints. Send them home[a] in peace, and set aside the orders already given.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “send them back to their own places.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Release, release the unjust bonds
  simplified_phrase: Set them free! Free them from these unjust restraints.
  preserved_meaning: The repeated command emphatically demands release from wrongful restraint.
  reasoning_layer_used: POB lexical decisions for λύσατε, ἐκλύσατε, ἄδικα, and δεσμά
  rationale: Two short commands preserve the Greek repetition while making “bonds” immediately clear.
- pob_phrase: send them away to their own homes in peace
  simplified_phrase: Send them home in peace
  preserved_meaning: Those released must be allowed to return peacefully to their households or places.
  reasoning_layer_used: POB lexical decisions for εἰς τὰ ἴδια, μετʼ εἰρήνης, and ἐξαποστείλατε
  rationale: The shorter wording states the same action naturally, while the footnote preserves the broader alternative.
- pob_phrase: setting aside what has been ordered
  simplified_phrase: set aside the orders already given
  preserved_meaning: The previously issued commands are to be abandoned.
  reasoning_layer_used: POB lexical decisions for τὰ προστεταγμένα and παραιτησάμενοι
  rationale: Naming the prior commands as “orders already given” removes the abstract passive wording.
translation_notes:
  risk_flags:
  - risk: “Restraints” may sound more physical than the source’s broad image of bonds.
    mitigation: The adjective “unjust” retains the legal and moral dimension of the restraint.
