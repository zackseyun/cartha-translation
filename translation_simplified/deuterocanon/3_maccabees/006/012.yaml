translation:
  language: en
  text: But you have all might and dominion. O Unceasing One, O Eternal One, look upon us now and have mercy. Lawless men are using arrogant violence to take our lives senselessly, as if we were plotters.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The final phrase may instead describe the lawless men as acting like plotters.
    reason: lexical_alternative
