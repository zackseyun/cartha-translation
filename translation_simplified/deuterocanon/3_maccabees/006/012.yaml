  preserved_meaning: The prayer addresses God with two distinct divine epithets before urgently asking him to see and show mercy.
  reasoning_layer_used: POB theological decision on the two divine vocatives
  rationale: Repeated “O” makes both titles clearly direct addresses in natural English.
- pob_phrase: through the insolent violence of lawless men are being irrationally removed from life
  simplified_phrase: Lawless men are using arrogant violence to take our lives senselessly
  preserved_meaning: Lawless persecutors are subjecting the speakers to unreasonable, abusive violence that will kill them.
  reasoning_layer_used: POB lexical decisions and contextual death sense
  rationale: The active wording is easier to follow while retaining the agents, violence, senselessness, and loss-of-life image.
