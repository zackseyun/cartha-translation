  simplified_phrase: you have all might and dominion
  preserved_meaning: God possesses both complete strength and ruling authority.
  reasoning_layer_used: POB lexical decisions for ἀλκήν and δυναστείαν
  rationale: The simpler verb keeps the distinction between might and dominion.
- pob_phrase: unceasing One, eternal One, look now; have mercy on us
