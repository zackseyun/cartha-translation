translation:
  language: en
  text: When their song of bitter mourning ended, they began the traditional song of their ancestors. They praised God, the Savior of Israel, who works wonders. They cast aside every cry of grief and wailing, and formed groups for dancing[a] as a sign of peaceful joy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean that they organized choruses, but the setting favors festive dancing.
    reason: lexical_alternative
