translation:
  language: en
  text: Do not let empty-minded people praise empty things[a] over the destruction of those you love. Do not let them say, “Not even their God rescued them.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Empty things” may also mean “vain things” or “idols”; the Greek does not specify idols.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Let not the empty-headed bless the empty things
  simplified_phrase: Do not let empty-minded people praise empty things
  preserved_meaning: God is asked to prevent vain thinkers from praising what is empty or worthless.
  reasoning_layer_used: POB lexical decisions for μὴ ... εὐλογησάτωσαν, τοῖς ματαίοις, and οἱ ματαιόφρονες
  rationale: Natural modern wording preserves the deliberate wordplay about emptiness.
- pob_phrase: over the destruction of those beloved by you
  simplified_phrase: over the destruction of those you love
  preserved_meaning: The people's destruction is the occasion or object of the opponents' praise.
  reasoning_layer_used: POB lexical decisions for ἐπὶ τῇ ... ἀπωλείᾳ and τῶν ἠγαπημένων σου
  rationale: This keeps the destruction uncompleted in framing and preserves its relation to the praise.
- pob_phrase: saying, “Not even their God rescued them.”
  simplified_phrase: Do not let them say, “Not even their God rescued them.”
  preserved_meaning: The opponents would claim that God failed to save his people.
  reasoning_layer_used: POB lexical decision for Οὐδὲ ὁ θεὸς αὐτῶν ἐρύσατο αὐτούς
  rationale: A separate sentence makes the feared taunt easier to follow.
