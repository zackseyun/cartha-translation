translation:
  language: en
  text: You have gone beyond what is proper for kings and have been crueler than tyrants. Now you are even trying to take away my power and my life[a]—from me, the one who has done you good—while secretly plotting things that harm the kingdom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “my power and my spirit” or “my power and my breath.” The Greek word can mean spirit, breath, or life.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: exceeded kings and surpassed tyrants in cruelty
  simplified_phrase: gone beyond what is proper for kings and have been crueler than tyrants
  preserved_meaning: Their conduct exceeds proper kingship and even the cruelty of tyrants.
  reasoning_layer_used: Lexical decisions for Παραβεβασιλεύετε and ὑπερβεβήκατε ὠμότητι
  rationale: The wording states both comparisons clearly without adding an unsupported intensifier.
- pob_phrase: remove me myself, your benefactor, from power and from life
  simplified_phrase: take away my power and my life—from me, the one who has done you good
  preserved_meaning: They are trying to depose and kill the very person who benefited them.
  reasoning_layer_used: Lexical and theological decisions for εὐεργέτης, ἀρχή, πνεῦμα, and μεθιστάναι
  rationale: The rewrite explains “benefactor” and clearly preserves the emphatic paired threats.
- pob_phrase: secretly plotting what is not advantageous to the kingdom
  simplified_phrase: while secretly plotting things that harm the kingdom
  preserved_meaning: Their covert schemes oppose the kingdom’s interests.
  reasoning_layer_used: Lexical decisions for λάθρα μηχανώμενοι and τὰ μὴ συμφέροντα τῇ βασιλείᾳ
  rationale: The direct present wording is clearer and avoids making the harm sound conditional.
interpretive_expansions:
- pob_phrase: exceeded kings
  rendering: gone beyond what is proper for kings
  claim: The charge concerns conduct beyond the proper limits of kingship.
  evidence:
