simplification_decisions:
- pob_phrase: rose up
  simplified_phrase: rose up against them
  preserved_meaning: They sprang into action in resistance to their opponents.
  reasoning_layer_used: The lexical decision for ἀντέστησαν and its documented alternative.
  rationale: Adding “against them” makes the verb’s oppositional force clear while the footnote preserves its ambiguity.
- pob_phrase: filled the force of their adversaries with confusion and cowardice
  simplified_phrase: threw the opposing force into confusion and made them lose courage
  preserved_meaning: The opposing troops became confused and lost their courage.
  reasoning_layer_used: The lexical decisions for δύναμιν, ὑπεναντίων, and ἐπλήρωσαν ταραχῆς καὶ δειλίας.
  rationale: The active wording expresses the same two effects in natural modern English.
- pob_phrase: bound them with immovable fetters
  simplified_phrase: bound them in shackles that held them fast
  preserved_meaning: They were restrained by fixed, inescapable bonds.
  reasoning_layer_used: The lexical decisions for ἀκινήτοις and πέδαις.
  rationale: “Shackles” clarifies the restraint, while “held them fast” preserves its immovable force.
