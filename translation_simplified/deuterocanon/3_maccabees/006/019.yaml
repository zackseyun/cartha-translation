translation:
  language: en
  text: They rose up against them.[a] They threw the opposing force into confusion and made them lose courage, and they bound them in shackles that held them fast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “They took a stand against them.”
