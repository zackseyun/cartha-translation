translation:
  language: en
  text: But if the way we live here in exile has become entangled in ungodliness, first rescue us from the hand of our enemies. Then put us to death in whatever way you choose, Master.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Sovereign”; the Greek title emphasizes absolute authority.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: our way of life in the place of our exile has been caught up in ungodliness
  simplified_phrase: the way we live here in exile has become entangled in ungodliness
  preserved_meaning: Their conduct while living away from their homeland has become involved in religious wrongdoing.
  reasoning_layer_used: POB lexical decisions for βίος, ἀποικία, ἐνέσχηκται, and ἀσέβεια
  rationale: The rewrite makes the ethical conduct and exilic setting easier to grasp while retaining the state of involvement in ungodliness.
- pob_phrase: then, after rescuing us from the hand of our enemies
  simplified_phrase: first rescue us from the hand of our enemies. Then
  preserved_meaning: They ask God to deliver them from enemy power before ending their lives.
  reasoning_layer_used: POB lexical decision for ῥυσάμενος and the source clause sequence
  rationale: Two sentences make the required order of events immediately clear and preserve the biblical hand image.
- pob_phrase: destroy us by whatever death you choose
  simplified_phrase: put us to death in whatever way you choose
  preserved_meaning: They ask God to end their lives by the manner of death he decides.
  reasoning_layer_used: POB lexical decisions for ᾧ προαιρῇ and ἀπόλεσον ἡμᾶς μόρῳ
  rationale: The direct wording clarifies that destruction here means death without weakening the plea.
