translation:
  language: en
  text: Then God, great in glory, almighty, and true, revealed his holy face[a] and opened the gates of heaven. Two glorious angels came down through the gates. They were terrifying to look at, and everyone could see them except the Jews.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “made his holy presence known”; the Greek literally says “revealed his holy face.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the greatly glorious, almighty, and true God
  simplified_phrase: God, great in glory, almighty, and true
  preserved_meaning: God is described as possessing great glory, being almighty, and being true.
  reasoning_layer_used: POB lexical decisions for μεγαλοδόξος, παντοκράτωρ, and ἀληθινὸς θεός
  rationale: The reordered wording keeps all three titles while sounding natural in common English.
- pob_phrase: from which two glorious angels of fearful appearance came down
  simplified_phrase: Two glorious angels came down through the gates. They were terrifying to look at
  preserved_meaning: Two splendid heavenly angels descended through the opened gates with a fear-inspiring appearance.
  reasoning_layer_used: POB lexical decisions for δεδοξασμένοι and φοβεροειδεῖς
  rationale: Two short sentences clarify the movement and express the angels’ frightening appearance directly.
- pob_phrase: visible to everyone except the Jews
  simplified_phrase: everyone could see them except the Jews
  preserved_meaning: All those present apart from the Jews perceived the angels.
  reasoning_layer_used: POB theological decision on the visibility clause
  rationale: The active wording is easier to understand and does not explain or soften the exclusion.
