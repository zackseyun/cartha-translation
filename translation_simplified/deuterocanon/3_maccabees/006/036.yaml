  language: en
  text: 'They established a rule for their whole community, to be kept for generations to come: the days mentioned earlier were to be observed with rejoicing, not for the sake of drinking and overeating, but because God[a] had delivered them.'
  philosophy: optimal-equivalence
  footnotes:
