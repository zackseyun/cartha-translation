translation:
  language: en
  text: He publicly proposed spreading words meant to disgrace the Jewish nation. Then he set up a stone monument[a] on the tower by the court[b] and carved an inscription into it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek refers to a standing stone monument made to bear an inscription.
    reason: simplification_note
  - marker: b
    text: “Court” may mean a palace court or another enclosed courtyard; the Greek does not specify.
    reason: cultural_note
simplification_decisions:
- pob_phrase: to spread reproach against the nation
  simplified_phrase: spreading words meant to disgrace the Jewish nation
  preserved_meaning: The plan involved publicly circulating dishonoring words against the Jewish people as a group.
  reasoning_layer_used: POB lexical decisions for διαδοῦναι, ψόγον, and ἔθνους
  rationale: This replaces abstract “reproach” with clear language while retaining its public and hostile force.
- pob_phrase: having set up a stele
  simplified_phrase: Then he set up a stone monument
  preserved_meaning: He erected a standing monument suitable for an inscription before engraving it.
  reasoning_layer_used: POB lexical decision and footnote for στήλην, with the participial sequence of ἀναστήσας
  rationale: The technical term “stele” becomes a familiar description, and “Then” makes the sequence easy to follow.
- pob_phrase: he engraved an inscription
  simplified_phrase: he carved an inscription into it
  preserved_meaning: He cut written words into the erected monument.
  reasoning_layer_used: POB lexical decisions for ἐκόλαψεν and γραφήν
  rationale: “Carved … into it” clearly states the physical action and its object.
