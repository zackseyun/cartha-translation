translation:
  language: en
  text: 'Because I love the house of Israel, I have made this promise: If a turning away comes upon us[a], distress overtakes us, and we come to our place and pray, I will hear our prayer.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Turning away” may also be translated “apostasy,” but the Greek does not specify the exact kind of defection here.
    reason: lexical_alternative
  - marker: b
    text: The Greek is difficult here. This translation keeps the first-person promise, “I will hear,” rather than changing it to indirect speech.
    reason: textual_variant
