translation:
  language: en
  text: The people of Sodom acted arrogantly and became notorious for their evil deeds.[a] You burned them up with fire and sulfur, making them an example for those who came afterward.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek wording is difficult; more literally, they “became conspicuous through their evils.”
    reason: lexical_alternative
