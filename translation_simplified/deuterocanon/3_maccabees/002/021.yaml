translation:
  language: en
  text: There, God, who watches over all—the holy Forefather[a] among the holy ones[b]—heard the lawful plea. He scourged the man who was swollen with arrogance and reckless boldness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The unusual Greek title may also be translated “sovereign ancestor” or “ancestor.”
    reason: lexical_alternative
  - marker: b
    text: Or, possibly, “the holy one in the holy places.”
    reason: alternative_reading
