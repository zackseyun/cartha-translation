translation:
  language: en
  text: Those who registered were also to be branded on the body with fire, using the ivy-leaf emblem of Dionysus.[a] They were then to be enrolled with reduced official standing.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This brand identified them with the cult of Dionysus.
    reason: cultural_note
  - marker: b
    text: The Greek is uncertain and may mean that they were given restricted civic status or curtailed legal standing.
    reason: alternative_reading
