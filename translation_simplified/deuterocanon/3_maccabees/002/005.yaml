  preserved_meaning: Pharaoh had enslaved Israel, who belonged to God as his holy people.
  reasoning_layer_used: POB lexical decision for καταδουλωσάμενον and λαόν σου τὸν ἅγιον Ἰσραήλ
  rationale: A separate sentence makes Pharaoh’s prior action and Israel’s covenant identity easier to follow.
- pob_phrase: varied and many punishments
