  preserved_meaning: The punishments were both numerous and varied.
  reasoning_layer_used: POB lexical decisions for ποικίλαις καὶ πολλαῖς and τιμωρίαις
  rationale: Common wording preserves both source adjectives without sounding formal.
- pob_phrase: by these you made known your great might
