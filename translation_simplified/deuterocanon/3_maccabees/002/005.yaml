translation:
  language: en
  text: You made your power known against the bold Pharaoh.[a] He had enslaved Israel, your holy people. You tested him with many different punishments,[b] and through them you made your great might known.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “arrogant Pharaoh”; the word describes boldness with a negative sense of audacity or insolence.
    reason: lexical_alternative
  - marker: b
    text: The wording suggests that God put Pharaoh to the test through successive punishments.
    reason: lexical_alternative
