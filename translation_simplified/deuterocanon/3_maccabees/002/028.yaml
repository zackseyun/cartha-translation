translation:
  language: en
  text: No one who refuses to offer sacrifice may enter their sanctuaries.[a] All Jews must be registered[b] and reduced to slave status. Anyone who objects must be seized by force and put to death.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also refer more broadly to their sacred rites or holy things.
    reason: lexical_alternative
  - marker: b
    text: This registration may have been for government control or taxation.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Let no one who does not sacrifice enter
  simplified_phrase: No one who refuses to offer sacrifice may enter
  preserved_meaning: Those who do not participate in sacrifice are denied access.
  reasoning_layer_used: POB lexical decisions for τῶν μὴ θυόντων and the decree context
  rationale: The direct prohibition is clearer while retaining the decree’s coercive force.
- pob_phrase: be subjected to registration and slave status
  simplified_phrase: must be registered and reduced to slave status
  preserved_meaning: The decree imposes both state enrollment and a degrading slave-like legal status.
  reasoning_layer_used: POB lexical and theological decisions for λαογραφίαν and οἰκετικὴν διάθεσιν
  rationale: Two direct verbs clarify the distinct imposed conditions without softening either one.
- pob_phrase: let those who object be taken by force and put to death
  simplified_phrase: Anyone who objects must be seized by force and put to death
  preserved_meaning: Resistance leads to forcible arrest and execution.
  reasoning_layer_used: POB lexical decisions for ἀντιλέγοντας, βίᾳ φερομένους, and τοῦ ζῇν μεταστῆσαι
  rationale: The shorter sentence makes the violent penalty immediately understandable.
