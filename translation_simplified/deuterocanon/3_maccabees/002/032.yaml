translation:
  language: en
  text: Most of them, however, found courage and showed a noble spirit. They refused to abandon their faithful devotion to God by trading away their possessions to stay alive. Instead, they boldly believed they were worthy to escape the official registration lists.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: These were official enrollment records, apparently used to identify Jews for the king’s oppressive measures.
    reason: cultural_note
