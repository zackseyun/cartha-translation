translation:
  language: en
  text: 'But to avoid appearing hateful to everyone, he added this in writing: “If any of them choose to live among those initiated into the rites,[a] they will receive the same citizenship rights as the Alexandrians.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “initiated into the mysteries.” The Greek refers to initiation into religious rites.
    reason: lexical_alternative
