translation:
  language: en
  text: Lord, Lord, you are King of the heavens and Master of all creation. You are holy among the holy ones,[a] the only Ruler, the Almighty. Pay attention to us! We are suffering under the oppression of an unholy and profane man,[b] swollen with arrogance and strength.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “holy in the holy ones.” The Greek expression is brief and can be understood either way.
    reason: lexical_alternative
  - marker: b
    text: The Greek does not explicitly say “man,” but its singular wording describes one hostile person.
    reason: source_note
