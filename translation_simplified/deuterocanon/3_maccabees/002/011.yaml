translation:
  language: en
  text: For even when our fathers suffered again and again, you helped them when they were brought low and rescued them from great calamities.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Our fathers” means our forefathers or ancestors; the Greek word is masculine.
    reason: simplification_note
  - marker: b
    text: The Greek can also be translated “great evils”; here it refers to severe troubles or disasters.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: were often afflicted
  simplified_phrase: suffered again and again
  preserved_meaning: Their suffering happened repeatedly without specifying its form.
  reasoning_layer_used: Lexical decisions for πλεονάκις and θλιβέντων
  rationale: This expresses repeated suffering in familiar English.
- pob_phrase: in their humiliation
  simplified_phrase: when they were brought low
  preserved_meaning: Their suffering placed them in a humiliated or abased condition.
  reasoning_layer_used: Lexical decision for ταπείνωσις
  rationale: This preserves the image of being brought low without an abstract expression.
- pob_phrase: from great evils
  simplified_phrase: from great calamities
  preserved_meaning: God rescued them from severe harmful circumstances, not merely from moral evil.
  reasoning_layer_used: Lexical and theological decisions for κακῶν
  rationale: This uses a documented alternative that clearly conveys disastrous circumstances.
translation_notes:
  risk_flags:
  - risk: “Our fathers” could be understood as immediate male parents.
    mitigation: Footnote a identifies them as the community’s forefathers or ancestors.
  - risk: “Calamities” is less formally close to the Greek term rendered “evils.”
    mitigation: Footnote b preserves the closer wording and explains the contextual sense.
