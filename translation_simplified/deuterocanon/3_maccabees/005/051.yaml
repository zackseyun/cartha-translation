translation:
  language: en
  text: They cried out very loudly. They begged the Sovereign of all to show them mercy in a visible way,[a] because they were already at the gates of Hades.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “have mercy on them with a visible manifestation.”
    reason: lexical_alternative
  - marker: b
    text: Hades is the realm of the dead; its gates picture how close they were to death.
    reason: cultural_note
simplification_decisions:
- pob_phrase: They cried out very loudly, imploring
  simplified_phrase: They cried out very loudly. They begged
  preserved_meaning: Their loud cry was an urgent plea.
  reasoning_layer_used: POB lexical decisions for ἀνεβόησαν, φωνῇ μεγάλῃ σφόδρα, and ἱκετεύοντες
  rationale: Two short sentences and the common word “begged” make the urgent appeal easier to follow.
- pob_phrase: to have mercy and visibly come to their aid
  simplified_phrase: to show them mercy in a visible way
  preserved_meaning: They asked for mercy that would be openly manifested.
  reasoning_layer_used: POB lexical decision and footnote for οἰκτείραι μετὰ ἐπιφανείας
  rationale: This keeps visible manifestation tied to mercy without adding a separate rescue action.
- pob_phrase: since they already stood
  simplified_phrase: because they were already
  preserved_meaning: Their imminent danger explains their plea.
  reasoning_layer_used: POB lexical decisions for ἤδη and καθεστῶτας
  rationale: The simpler clause states their situation in ordinary English.
translation_notes:
  risk_flags:
  - risk: Readers may understand “in a visible way” as physical sight alone.
    mitigation: The footnote preserves the broader sense of an open manifestation.
  - risk: Some readers may mistake Hades for a later doctrinal description of hell.
    mitigation: The footnote identifies it as the realm of the dead while retaining the source term and gate image.
