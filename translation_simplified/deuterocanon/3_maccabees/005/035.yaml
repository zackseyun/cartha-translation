translation:
  language: en
  text: When the Jews heard the king’s message, they continued to praise the God who had clearly revealed himself—the Lord, the King of those who rule[a]—because they had received this help from him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This can also be expressed more idiomatically as “the King of kings.” The Greek literally says “the King of those who rule.”
    reason: lexical_alternative
