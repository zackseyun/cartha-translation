translation:
  language: en
  text: After the Jews survived the appointed time of danger, they once again pleaded urgently with their holy God. They asked him, in his magnificent generosity, to show the proud nations the might of his hand.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nations” may also mean “Gentiles” here.
    reason: lexical_alternative
