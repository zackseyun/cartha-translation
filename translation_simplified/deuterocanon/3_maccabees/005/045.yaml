translation:
  language: en
  text: But the man in charge of the elephants brought[a] the beasts almost to a frenzy, just as he had said he would. He gave them highly fragrant drinks—wine mixed with frankincense—and fitted them with equipment that made them look terrifying.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word describing what he did to the elephants is difficult; “brought” gives the probable meaning in this context.
    reason: textual_variant
