translation:
  language: en
  text: But as the conversation dragged on, the king called Hermon before him. With a bitter threat, he demanded to know why the Jews had been spared—why they were still alive past the appointed day.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can more literally read, “had been preserved or healed, having lived through the remaining day,” but its wording is difficult.
    reason: lexical_alternative
