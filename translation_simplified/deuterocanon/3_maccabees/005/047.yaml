translation:
  language: en
  text: But he was full of fierce anger and had a godless purpose. He charged out with the beasts in full force. With a heart untouched by pity[a], he wanted to see with his own eyes the painful and miserable destruction of those who had been singled out.
  philosophy: optimal-equivalence
