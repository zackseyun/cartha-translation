  review_summary: The draft is meaningfully clearer than POB in its handling of the heart image and the idiom about seeing personally. “With a heart untouched by pity” is warranted by the lexical rationale, the immediate scene, and the retained literal footnote. “With his own eyes” likewise preserves the direct-personal emphasis. Revision is needed because “purpose that defied God” narrows and intensifies impiety into a particular act of defiance and adds a causal claim. “Godless purpose” communicates the religious force of δυσσεβής plainly without that extra specification. Restoring “painful” avoids strengthening the degree of suffering beyond the POB-supported rendering.
