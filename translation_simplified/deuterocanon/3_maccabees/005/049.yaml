translation:
  language: en
  text: They believed that this was the final turning point of their lives and the end of their most miserable waiting.[a] They gave themselves to pity and mourning. They repeatedly kissed and embraced their relatives, throwing their arms around their necks—parents embracing children and mothers embracing young daughters.[b] Others held newborn babies to their breasts as the babies drank what they believed would be their last milk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also mean “their most miserable expectation” or “suspense.”
    reason: lexical_alternative
  - marker: b
    text: Or “young women”; the family pairings favor “young daughters.”
    reason: lexical_alternative
