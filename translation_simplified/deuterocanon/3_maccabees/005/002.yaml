translation:
  language: en
  text: He ordered that, by the next day, all five hundred elephants be given large amounts of frankincense and plenty of undiluted wine. Once the abundant drink had made them savage, they were to be brought in to destroy the Jews.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “to meet the doom of the Jews,” meaning their intended destruction.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: by the coming day
  simplified_phrase: by the next day
  preserved_meaning: The order was to be carried out by the approaching day.
  reasoning_layer_used: Lexical decision for ὑπὸ τὴν ἐρχομένην ἡμέραν
  rationale: “Next day” expresses the time naturally.
- pob_phrase: all the elephants—five hundred in number—be given drink with generous draughts of frankincense and much unmixed wine
  simplified_phrase: all five hundred elephants be given large amounts of frankincense and plenty of undiluted wine
  preserved_meaning: Every elephant was to receive plentiful frankincense and wine that had not been diluted.
  reasoning_layer_used: Lexical decisions for δράκεσι, λιβανωτοῦ, οἴνῳ πλείονι ἀκράτῳ, and the elephant count
  rationale: This removes the dense parenthesis and avoids the misleading medical sense of “doses.”
- pob_phrase: once made savage by the abundant supply of drink, they be brought in for the destruction of the Jews
  simplified_phrase: Once the abundant drink had made them savage, they were to be brought in to destroy the Jews
  preserved_meaning: The drink was intended to make the elephants fierce so they could be used to kill the Jews.
  reasoning_layer_used: Lexical and theological decisions for ἀγριωθέντας and τοῦ μόρου
  rationale: Two direct clauses clarify the planned cause and lethal purpose.
