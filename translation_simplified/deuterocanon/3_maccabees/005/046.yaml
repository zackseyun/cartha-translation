translation:
  language: en
  text: Around dawn, crowds too large to count had already packed the city’s hippodrome. He entered the palace court[a] and pressed the king to move ahead with the matter before him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “palace courtyard”; the Greek word can refer to the court area of a royal residence.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the city was already filled with innumerable crowds at the hippodrome
  simplified_phrase: crowds too large to count had already packed the city’s hippodrome
  preserved_meaning: An immense crowd had filled the hippodrome by dawn.
  reasoning_layer_used: The lexical decisions describe the crowds as beyond counting and the hippodrome as crammed.
  rationale: The active wording makes the scene easier to picture while retaining its hyperbolic force.
- pob_phrase: entered the court
  simplified_phrase: entered the palace court
  preserved_meaning: He entered the royal court area where he could approach the king.
  reasoning_layer_used: The lexical decision allows the court area of a royal residence while preserving the courtyard alternative.
  rationale: Adding “palace” prevents readers from mistaking this for a law court.
- pob_phrase: urged the king on concerning the matter at hand
  simplified_phrase: pressed the king to move ahead with the matter before him
  preserved_meaning: He strongly urged the king toward action on the current business.
  reasoning_layer_used: The lexical decisions give “urge” or “press” for the verb and identify the idiom as the present business.
  rationale: The recast wording states the idiom in direct, ordinary English without specifying the king’s motive.
translation_notes:
  risk_flags:
  - risk: “Palace court” may be heard as the royal officials rather than a place.
    mitigation: The footnote preserves the concrete “palace courtyard” alternative.
  - risk: Recasting the city as the owner of the hippodrome slightly compresses the original spatial construction.
    mitigation: The wording retains both the city setting and the packed hippodrome as the crowd’s location.
