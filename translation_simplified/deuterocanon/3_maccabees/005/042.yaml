translation:
  language: en
  text: 'Therefore the king—a tyrant like Phalaris in every way[a]—was filled with senselessness. He treated as worthless the changes within himself as he turned his attention to the Jews. He firmly made an oath that could never be fulfilled: without delay, he would send these men to Hades[b], with their knees and feet cruelly mangled by beasts.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Phalaris was a notorious tyrant known for extreme cruelty; the text compares the king to him.
    reason: cultural_note
  - marker: b
    text: Hades means the realm of the dead, not necessarily what later readers call hell.
    reason: lexical_alternative
