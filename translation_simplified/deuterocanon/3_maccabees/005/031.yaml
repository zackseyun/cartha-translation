  text: All the parents who were there, along with their children,[a] have prepared this lavish feast for the wild beasts in place of the Jews. Yet the Jews are beyond reproach and have proved completely and steadfastly faithful to me and my ancestors.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek expression is awkward and may refer broadly to the children or descendants who were there with the parents.
    reason: lexical_alternative
  - marker: b
    text: “Faithful” here may also be rendered “loyal”; it refers to proven fidelity rather than specifically to religious faith.
    reason: lexical_alternative
