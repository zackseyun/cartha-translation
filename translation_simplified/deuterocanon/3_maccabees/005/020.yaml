translation:
  language: en
  text: His savagery was worse than that of Phalaris.[a] He said that they should be thankful they were allowed to sleep that day. Then he commanded, “Keep them alive until tomorrow, and prepare the elephants as before to destroy the ‘lawless’ Jews.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Phalaris was remembered in Greek tradition as a notoriously cruel ruler.
    reason: cultural_note
  - marker: b
    text: “Lawless” is the persecutor’s hostile insult for the Jews, not the narrator’s judgment.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Having a savagery worse than Phalaris
  simplified_phrase: His savagery was worse than that of Phalaris
  preserved_meaning: The comparison presents the king’s brutality as exceeding that of a notorious cruel ruler.
  reasoning_layer_used: lexical decision and cultural note
  rationale: A complete sentence removes the difficult opening participle while retaining “savagery” and the historical comparison.
- pob_phrase: once they had been kept alive until the coming day
  simplified_phrase: Keep them alive until tomorrow
  preserved_meaning: The victims were to remain alive until the next day’s planned execution.
  reasoning_layer_used: lexical decision for συντηρηθέντας and ὑποτέλλουσαν ἡμέραν
  rationale: The direct command and “tomorrow” express the same timing in ordinary English.
- pob_phrase: prepare the elephants in the same way
  simplified_phrase: prepare the elephants as before
  preserved_meaning: The elephants were to be prepared according to the previously described procedure.
  reasoning_layer_used: lexical decision for κατὰ τὸ ὅμοιον
  rationale: “As before” states the backward reference more naturally.
