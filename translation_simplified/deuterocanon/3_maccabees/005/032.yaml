translation:
  language: en
  text: Yet if it were not for your attachment to the gathered crowd and for the need, you would have lost your life rather than these things.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may refer more generally to an attachment to the gathering or crowd; the exact nuance depends on the context.
