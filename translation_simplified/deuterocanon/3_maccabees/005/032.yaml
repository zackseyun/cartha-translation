- pob_phrase: your affection because of the gathering together
  simplified_phrase: your attachment to the gathered crowd
  preserved_meaning: The attachment concerns people gathered or massed together without specifying a particular crowd.
  reasoning_layer_used: POB lexical decision for στοργή and συστροφή
  rationale: This wording clarifies the relationship while leaving the exact kind of gathering open.
- pob_phrase: and the necessity
  simplified_phrase: and for the need
  preserved_meaning: Need or necessity is a second reason the person's life was spared.
  reasoning_layer_used: POB lexical decision for χρεία
  rationale: “The need” is natural English and does not add an unstated frame of reference.
- pob_phrase: you would have been deprived of life instead of these things
  simplified_phrase: you would have lost your life rather than these things
  preserved_meaning: Life, rather than the unspecified things, would have been taken away.
  reasoning_layer_used: POB lexical decisions for τὸ ζῆν, ἀντὶ τούτων, and ἐστερήθης
  rationale: “Lost your life” states the severe outcome plainly while preserving the contrast.
