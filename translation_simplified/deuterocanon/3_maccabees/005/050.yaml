  reasoning_layer_used: POB lexical decision for οὐ μὴν δὲ ἀλλὰ καὶ and συνιδόντες
  rationale: A short transition and direct verb are clearer than the clustered connective and participial clause.
- pob_phrase: the help from heaven that had come to them before
  simplified_phrase: the help they had received from heaven before
  preserved_meaning: They understood their earlier assistance as help originating from heaven.
  reasoning_layer_used: POB lexical and theological decisions for ἀντιλήψεις and ἐξ οὐρανοῦ
  rationale: “Received” naturally expresses experienced help without naming God more explicitly than the source does.
- pob_phrase: they all together threw themselves down face-first
  simplified_phrase: All together, they threw themselves face down
  preserved_meaning: The people acted in unity and forcefully prostrated themselves.
  reasoning_layer_used: POB lexical decisions for ὁμοθυμαδόν, πρηνεῖς, and ῥίψαντες ἑαυτούς
  rationale: Ordinary English word order preserves both the united action and the physical image.
