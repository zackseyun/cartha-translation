translation:
  language: en
  text: That evening, the attendants went out and tied the hands of the suffering people. They also arranged additional security to keep them under guard through the night. They thought they would together bring the Jewish people[a] to complete destruction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek collective term may also be translated “race” or “nation”; here it refers to the Jewish people as a whole.
    reason: lexical_alternative
