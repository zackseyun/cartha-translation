translation:
  language: en
  text: But after he accepted it, he was shocked by the lawless outcome.[a] Completely at a loss, he kept asking whether the decree had really been carried out for him urgently.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “lawless result” or, less likely here, “lawless departure.”
    reason: lexical_alternative
