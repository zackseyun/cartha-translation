translation:
  language: en
  text: But if he marched against Judea, he would quickly destroy it with fire and spear, leaving it level with the ground. He would burn their sanctuary—a place where we are not allowed to set foot—and permanently stop those who perform sacrifices there.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: should campaign against Judea
  simplified_phrase: marched against Judea
  preserved_meaning: He is contemplating military action against Judea.
  reasoning_layer_used: Lexical decision for ἐπιστρατεύσαντα
  rationale: “Marched against” expresses a military campaign in common English.
- pob_phrase: make it level with fire and spear
  simplified_phrase: destroy it with fire and spear, leaving it level with the ground
  preserved_meaning: Judea would be devastated and reduced to a flat ruin by burning and armed violence.
  reasoning_layer_used: Lexical decisions for ἰσόπεδον and πυρὶ καὶ δόρατι
  rationale: The rewrite explains “level” while retaining the paired image of fire and spear.
- pob_phrase: put a stop forever to those who perform sacrifice there
  simplified_phrase: permanently stop those who perform sacrifices there
  preserved_meaning: Sacrificial service at the sanctuary would be ended for all time.
  reasoning_layer_used: Lexical decisions for συντελούντων and εἰς τὸν ἅπαντα χρόνον
  rationale: “Permanently” states the finality more naturally without weakening it.
interpretive_expansions:
- pob_phrase: their sanctuary—untrodden by us
  rendering: their sanctuary—a place where we are not allowed to set foot
  claim: The speaker and those with him are outsiders barred from entering the Jewish sanctuary.
  evidence:
  - The Greek ἄβατον means a place not to be entered or trodden.
  - The first-person plural ἡμῖν preserves the speaker’s outsider perspective.
  - The POB theological decision identifies the sanctuary as inaccessible to non-Jews like the speaker.
  confidence: high
  alternatives_preserved:
  - their sanctuary, forbidden to us
  - their sanctuary, inaccessible to us
translation_notes:
  risk_flags:
  - risk: “Destroy it” could obscure the specific image of Judea being flattened.
    mitigation: The following words explicitly retain “leaving it level with the ground.”
  - risk: “Not allowed to set foot” interprets “untrodden” as restricted entry rather than mere inaccessibility.
    mitigation: The wording preserves the tread image and follows the POB theological decision.
