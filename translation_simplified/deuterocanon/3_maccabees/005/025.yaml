translation:
  language: en
  text: But throughout that unbroken time, the Jews were united in soul. They stretched out their hands to heaven and sang mournful songs. Through many tears, they pleaded with the greatest God to help them again without delay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek unusually combines an unbroken span of time with the Jews’ inward unity.
    reason: lexical_alternative
