translation:
  language: en
  text: While these matters were being put in order, a hostile rumor against the Jewish nation spread among people who shared a desire to mistreat them. This gave their hostile intentions an occasion for action,[a] as if they were being prevented from following their own customary laws.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “An occasion” may also mean “a pretext” or “an opportunity.”
    reason: lexical_alternative
  - marker: b
    text: Or “ancestral laws” or “established customs.”
    reason: lexical_alternative
