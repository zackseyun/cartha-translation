simplification_decisions:
- pob_phrase: accepted our presence in word, in deed they were false
  simplified_phrase: said they accepted our presence, they acted falsely
  preserved_meaning: Their conduct contradicted their stated acceptance of the king's presence.
  reasoning_layer_used: POB lexical decisions for λόγῳ μὲν ... τῷ δὲ πράγματι and νόθως
  rationale: The contrast between their words and actions preserves the Greek antithesis and its force.
- pob_phrase: we eagerly desired to enter into their temple
  simplified_phrase: we were eager to enter their temple
  preserved_meaning: The speaker claims an eager intention to go inside the Jews' temple without asserting an attempt.
  reasoning_layer_used: POB lexical and theological decisions for προθυμηθέντων ἡμῶν and εἰσελθεῖν εἰς τὸν ναὸν αὐτῶν
  rationale: “Were eager” expresses strong desire in natural English without implying an effort to gain entry.
- pob_phrase: the most splendid and finest offerings
  simplified_phrase: the most magnificent and beautiful offerings
  preserved_meaning: The intended gifts were exceptionally impressive temple dedications.
  reasoning_layer_used: POB lexical decision for τοῖς ἐκπρεπέσιν καὶ καλλίστοις ἀναθήμασιν
  rationale: Clear adjectives retain both emphatic descriptions while the footnote briefly identifies the gifts.
translation_notes:
  risk_flags:
