translation:
  language: en
  text: 'His present success had puffed him up with pride. He failed to recognize the power of the greatest God[a] and assumed that he could keep following the same plan forever. So he wrote this letter against them:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the Most High God.” The Greek literally says “the greatest God.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: puffed up by his present prosperity
  simplified_phrase: His present success had puffed him up with pride
  preserved_meaning: His favorable circumstances made him swollen with pride.
  reasoning_layer_used: POB lexical decisions for εὐημερίᾳ and γεγαυρωμένος
  rationale: The rewrite names pride directly while preserving the source image of being puffed up.
- pob_phrase: not perceiving the power of the greatest God
  simplified_phrase: He failed to recognize the power of the greatest God
  preserved_meaning: He did not grasp God's ruling might.
  reasoning_layer_used: POB lexical and theological decisions for οὐ καθορῶν, κράτος, and τοῦ μεγίστου θεοῦ
  rationale: “Failed to recognize” is clearer than “not perceiving,” while the source-driven divine title remains unchanged.
- pob_phrase: supposing that he would continue forever in the same purpose
  simplified_phrase: assumed that he could keep following the same plan forever
  preserved_meaning: He mistakenly expected his policy to continue indefinitely.
  reasoning_layer_used: POB lexical decisions for ὑπολαμβάνων, διηνεκῶς, and βουλή
  rationale: The ordinary wording makes his mistaken expectation and continuing policy easier to follow.
