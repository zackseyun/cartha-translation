  preserved_meaning: Large amounts of temple income were officially allotted before the journey continued.
  reasoning_layer_used: Lexical decisions for ἀπονείμαντες and προσόδους πλείστας
  rationale: “Very large revenues” keeps the fiscal meaning in more natural English.
