translation:
  language: en
  text: After assigning very large revenues to the temples in the cities, we continued on to Jerusalem to honor the temple of people who have never been winnowed clean[a] and who never stop their foolishness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word behind “never been winnowed clean” is rare and difficult; it may be a hostile image for people considered unrefined or uncleansed, though some interpret it more positively.
    reason: lexical_alternative
