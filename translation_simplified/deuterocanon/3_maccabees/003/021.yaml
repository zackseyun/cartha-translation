translation:
  language: en
  text: In all this, we made it clear to all their own people that we held no grudge against them. Because of the alliance, and because we had sincerely entrusted them with countless responsibilities from the beginning, we decided to raise their status. We considered them worthy of Alexandrian citizenship and appointed them to share in matters connected with the sanctuary.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says broadly, “the things of the sanctuary,” perhaps meaning sacred privileges or responsibilities connected with the temple.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: made known to all their own countrymen our lack of resentment
  simplified_phrase: made it clear to all their own people that we held no grudge against them
  preserved_meaning: The rulers openly declared that they did not hold past wrongs against this people.
  reasoning_layer_used: Lexical decisions for ἀμνησικακίαν and ὁμοφύλους
  rationale: The direct clause replaces abstract wording while preserving the image of refusing to hold a grudge.
- pob_phrase: the countless affairs entrusted to them from the beginning with sincerity
  simplified_phrase: we had sincerely entrusted them with countless responsibilities from the beginning
  preserved_meaning: Countless matters had long been committed to them in sincere trust.
  reasoning_layer_used: Lexical decisions for τὰ πεπιστευμένα and μετὰ ἁπλότητος
  rationale: The active clause makes the longstanding trust easier to follow.
- pob_phrase: transform their status and deem them worthy of Alexandrian citizenship, and to appoint them as sharers in the things of the sanctuary
  simplified_phrase: raise their status. We considered them worthy of Alexandrian citizenship and appointed them to share in matters connected with the sanctuary
  preserved_meaning: They were to receive higher civic standing and undefined participation in sanctuary-related matters.
  reasoning_layer_used: Lexical and theological decisions on civic and sanctuary privileges
  rationale: Shorter sentences clarify the actions without narrowing the sanctuary role.
translation_notes:
