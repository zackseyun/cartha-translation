translation:
  language: en
  text: But anyone who gives refuge to any Jew—whether an old person, an infant, or even a nursing baby—will be tortured in the most horrifying way and beaten to death, together with everyone in that person’s household.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek describes a brutal execution by beating; it may also be rendered “cudgelled to death” or “tortured on the wheel.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: shelters any of the Jews
  simplified_phrase: gives refuge to any Jew
  preserved_meaning: The person protects or conceals a Jew by providing shelter.
  reasoning_layer_used: lexical decision for σκεπάσῃ
  rationale: “Gives refuge” makes the legal threat clear without limiting the action to hiding.
- pob_phrase: from old man to infant, even to those at the breast
  simplified_phrase: whether an old person, an infant, or even a nursing baby
  preserved_meaning: The decree covers the full age range and specifically includes babies still being nursed.
  reasoning_layer_used: lexical decisions for γεραιοῦ, νηπίου, and ὑπομαστιγίων
  rationale: The natural list keeps “infant” distinct from the vivid reference to a nursing baby.
- pob_phrase: will be beaten to death with the most hateful tortures, together with his whole household
  simplified_phrase: will be tortured in the most horrifying way and beaten to death, together with everyone in that person’s household
  preserved_meaning: The person and the entire domestic household face an especially odious execution by beating.
  reasoning_layer_used: lexical decisions for ἐχθίσταις βασάνοις, ὑποτυμπανισθήσεται, and πανοικίᾳ
  rationale: The wording presents the torture as the character of the fatal beating and keeps household broader than relatives.
translation_notes:
  risk_flags:
  - risk: The coordinated verbs could still be read as separate punishments.
    mitigation: “In the most horrifying way” makes the torture describe the manner of the fatal beating.
  - risk: The exact ancient execution procedure is uncertain.
    mitigation: The main text gives the secure core meaning, and the footnote retains technical alternatives.
