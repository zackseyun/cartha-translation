translation:
  language: en
  text: They have not only rejected the honored system of civic government.[a] They also detest the few among them who sincerely favor us—both in what they say and in their silence. At every opportunity, driven by an utterly godless pretext, they rush to ruin our affairs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This refers to the valued civic system or constitution, not merely to individual citizenship.
    reason: simplification_note
