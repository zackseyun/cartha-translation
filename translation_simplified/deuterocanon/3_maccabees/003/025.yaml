translation:
  language: en
  text: We have ordered that, as soon as this letter arrives, everyone enrolled must be sent to us at once, together with their wives and children. They must be abused and robbed of their possessions, bound in iron chains, and completely confined. They are to be sent to a disgraceful, hopeless pit fit for enemies.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “pit” may be literal or may picture a place of destruction and disgrace.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: with abuse and plundering
  simplified_phrase: abused and robbed of their possessions
  preserved_meaning: The victims suffer both humiliating mistreatment and the loss of their possessions.
  reasoning_layer_used: POB lexical decision for ὕβρις and σκυλμοί
  rationale: The wording clearly distinguishes personal abuse from plundering.
- pob_phrase: in iron bonds, shut in on every side
  simplified_phrase: bound in iron chains, and completely confined
  preserved_meaning: They are restrained with iron and enclosed on every side.
  reasoning_layer_used: POB lexical decisions for δεσμοῖς σιδηροῖς and πάντοθεν κατακεκλεισμένους
  rationale: Common wording preserves both iron restraint and total confinement.
- pob_phrase: for an incurable and disgraceful pit fit for enemies
  simplified_phrase: to a disgraceful, hopeless pit fit for enemies
  preserved_meaning: The pit remains an irremediable and shameful destination deemed suitable for enemies.
  reasoning_layer_used: POB lexical decision and revision history for ἀνήκεστον and βόθρον
  rationale: “Hopeless” preserves the severe force without claiming that escape or recovery is impossible.
