translation:
  language: en
  text: Therefore, the evidence has fully convinced us that these people are hostile to us in every way. We are taking precautions because we fear that, if sudden unrest breaks out later, these ungodly people might be behind us as traitors and barbarous enemies.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “savage enemies.” “Barbarous” is the speaker’s insulting label, not necessarily a precise ethnic description.
    reason: lexical_alternative
