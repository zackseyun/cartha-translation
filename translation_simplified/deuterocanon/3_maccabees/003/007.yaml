translation:
  language: en
  text: But they kept spreading rumors about how these people differed in their acts of homage and in the foods they ate.[a] They claimed that these people would not adopt the same way of life as the king or his forces. Instead, they were hostile and strongly opposed to the affairs of state. In this way, they burdened them with intense public fear and suspicion.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Acts of homage” may also mean “worship”; the Greek can refer to religious or courtly acts of reverence.
    reason: lexical_alternative
  - marker: b
    text: Literally, “they attached to them no ordinary fear.”
    reason: simplification_note
simplification_decisions:
- pob_phrase: kept spreading talk about the disagreement
  simplified_phrase: kept spreading rumors about how these people differed
  preserved_meaning: The hostile talk was ongoing and focused on the people’s distinct practices.
  reasoning_layer_used: Lexical decisions for ἐθρύλουν and διάστασιν
  rationale: “Spreading rumors” expresses the repeated and slanderous character of the reports.
- pob_phrase: would not become of one way with either the king or his forces
  simplified_phrase: would not adopt the same way of life as the king or his forces
  preserved_meaning: They were accused of refusing conformity in conduct, not merely disagreeing in opinion.
  reasoning_layer_used: Lexical decision for ὁμοτρόπως ... γίνεσθαι and doctrine realignment
  rationale: “Adopt the same way of life” makes the conformity charge clear while retaining its breadth.
- pob_phrase: they attached to them no ordinary fear
  simplified_phrase: they burdened them with intense public fear and suspicion
  preserved_meaning: The accusers caused the people to be regarded as a serious public threat.
  reasoning_layer_used: Lexical decision for περιήψαντο and POB footnote b
  rationale: “Burdened” preserves the fastening image while explaining the idiom’s public effect.
