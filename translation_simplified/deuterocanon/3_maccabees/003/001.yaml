translation:
  language: en
  text: When the impious man received word of this,[a] he became furious. He was angry not only with those in Alexandria but acted even more harshly against those in the countryside. He ordered everyone to be gathered quickly in one place, intending to kill them in the cruelest way.
  philosophy: optimal-equivalence
  footnotes:
