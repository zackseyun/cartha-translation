  simplified_phrase: was constantly filled with great joy and held banquets
  preserved_meaning: The king's intense, ongoing joy accompanied repeated royal feasts.
  reasoning_layer_used: Lexical decisions for Μεγάλως, διηνεκῶς, and συμπόσια
  rationale: Ordinary verbs replace the dense participial structure without weakening its force.
- pob_phrase: with a mind far removed from the truth and with a profane mouth
  simplified_phrase: His mind was far from the truth, and profane words came from his mouth
  preserved_meaning: The king's thinking was false and his speech irreverent.
  reasoning_layer_used: Lexical decisions for φρήν and βέβηλος
  rationale: A separate sentence clarifies the two descriptions while preserving the mouth image.
- pob_phrase: praising deaf things that were unable to speak or help them, but speaking improper things against God
  simplified_phrase: He praised these deaf things, which could not speak to their worshipers or help them. But he spoke improper things against God
  preserved_meaning: The powerless idols receive praise while the true God receives hostile, unfitting speech.
  reasoning_layer_used: Lexical and theological decisions on κωφά, ἀρήγειν, and εἰς τὸν θεόν
  rationale: Two sentences make the sharp theological contrast easier to follow.
