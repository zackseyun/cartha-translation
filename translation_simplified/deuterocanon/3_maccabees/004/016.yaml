translation:
  language: en
  text: The king was constantly filled with great joy and held banquets before all the idols.[b] His mind was far from the truth, and profane words came from his mouth. He praised these deaf things, which could not speak to their worshipers or help them. But he spoke improper things against God.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The words “God” are bracketed in the source edition because of uncertainty in the Greek text; the sentence still describes the king speaking improperly against God.
    reason: textual_variant
  - marker: b
    text: Or “held banquets in honor of all the idols.”
    reason: lexical_alternative
