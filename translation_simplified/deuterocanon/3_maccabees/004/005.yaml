  simplified_phrase: with a full head of gray hair ... Age had weakened his feet and bent him over
  preserved_meaning: The visible signs and bodily frailty of old age remain vivid.
  reasoning_layer_used: POB lexical decisions for πλήρης πολιᾶς, πεπυκασμένος, and ἐπικύφων
  rationale: Two direct clauses replace a dense chain of modifiers while preserving the physical picture.
- pob_phrase: driven by the violent force of being thrown down
  simplified_phrase: driven on with violent force
  preserved_meaning: The old man was subjected to harsh and violent compulsion.
  reasoning_layer_used: POB lexical decision and footnote for ἀνατροπῆς ὁρμῇ βιαίας
  rationale: The main text avoids over-specifying the difficult phrase, while the footnote preserves its possible physical imagery.
- pob_phrase: making use of a swift march without any regard for all dignity
  simplified_phrase: made to move at a rapid pace, with no respect at all for his dignity
  preserved_meaning: A frail old man was forced to hurry in utter disregard for his honorable dignity.
  reasoning_layer_used: POB lexical decisions for πρὸς ὀξειαν καταχρώμενος πορείαν and ἁπάσης αἰδοῦς ἄνευ
  rationale: Natural passive wording makes the imposed speed and total disrespect immediately clear.
