translation:
  language: en
  text: An old man with a full head of gray hair was being led along. Age had weakened his feet and bent him over, yet he was driven on with violent force and made to move at a rapid pace,[a] with no respect at all for his dignity.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek is compressed and difficult; it may picture him stumbling or being thrown down as he was forced onward.
    reason: lexical_alternative
