translation:
  language: en
  text: The young women had only just entered the bridal chamber to begin married life. But instead of rejoicing, they mourned. Their perfume-drenched hair was smeared with dust. They were led away with their heads uncovered, in public humiliation. Together they sang a mourning song instead of wedding songs, as though abuse by foreigners had torn them apart.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: had just entered the bridal chamber for the sharing of life in marriage
  simplified_phrase: had only just entered the bridal chamber to begin married life
  preserved_meaning: They had recently entered marriage and begun sharing life together.
  reasoning_layer_used: POB lexical decisions for ἄρτι, πρὸς βίου κοινωνίαν, and γαμικὸν ... παστόν
  rationale: The rewrite states the transition into married life directly while retaining the bridal-chamber image.
- pob_phrase: taking up lamentation instead of joy
  simplified_phrase: But instead of rejoicing, they mourned
  preserved_meaning: Their expected wedding joy was replaced by grief.
  reasoning_layer_used: POB lexical decision for ἀντὶ τέρψεως μεταλαβοῦσαι γόους
  rationale: A short contrast in common language makes the reversal immediately clear.
- pob_phrase: with one accord raised a dirge instead of wedding songs
  simplified_phrase: Together they sang a mourning song instead of wedding songs
  preserved_meaning: The women joined in a song of grief that replaced their wedding songs.
  reasoning_layer_used: POB lexical decisions for θρῆνον, ὑμεναίων, and ὁμοθυμαδόν
  rationale: Mourning song avoids implying an actual funeral while preserving the contrast with wedding songs.
