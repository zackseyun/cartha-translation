translation:
  language: en
  text: After they were brought down to the place called Schedia and the voyage was completed, as the king had decreed, he ordered them to camp at the horse-racing stadium outside the city. This exposed area was especially well suited for making a public example of them. Everyone traveling down into the city or being sent from there into the countryside could see them. They were to have no contact with the king’s troops and were not even considered worthy of a fenced enclosure.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The final words may refer more broadly to a proper enclosed lodging or protective compound.
    reason: lexical_alternative
