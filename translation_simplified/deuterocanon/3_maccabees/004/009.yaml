translation:
  language: en
  text: They were brought down, driven like beasts and forced along in iron chains. Some had their necks fastened to the ships’ yokes[a], while others had their feet held fast in unbreakable shackles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
