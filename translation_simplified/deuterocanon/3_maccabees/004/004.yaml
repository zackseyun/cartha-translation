  reasoning_layer_used: POB lexical decisions for μετὰ πικρίας ἀνοίκτου ψυχῆς, ὁμοθυμαδόν, and ἐξαπεστέλλοντο
  rationale: The active wording identifies the agents and makes the coercion clear.
- pob_phrase: seeing the common pity before their eyes
