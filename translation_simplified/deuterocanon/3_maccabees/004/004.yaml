translation:
  language: en
  text: The generals in every city acted together to drive them out with bitter, merciless cruelty. Beyond these outrageous punishments, even some of their enemies were moved by ordinary human compassion. They reflected on the uncertain ruin facing the deportees and wept over their wretched deportation.
  philosophy: optimal-equivalence
