translation:
  language: en
  text: Close-set planks were also placed overhead to shut out light from every direction. In this way, they would be transported for the entire voyage under conditions meant for dangerous plotters.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “conspirators”; the Greek may refer more generally to dangerous men.
    reason: lexical_alternative
