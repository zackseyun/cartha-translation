translation:
  language: en
  text: Was there any district, city, place where people lived[a], or street that was not filled with mourning[b] and cries of grief over them?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek uses an unusual adjective here; it appears to mean any place where people lived.
    reason: textual_variant
  - marker: b
    text: The word for mourning can include the public custom of beating one’s breast in grief.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: or indeed what inhabited place at all
  simplified_phrase: place where people lived
  preserved_meaning: The question includes every inhabited locality without defining it as a particular kind of community.
  reasoning_layer_used: POB lexical decision and textual note for οἰκτιστὸς τόπος
  rationale: This wording makes the likely sense clear while the footnote preserves the textual uncertainty.
- pob_phrase: What district, or city ... or what streets, were not filled
  simplified_phrase: Was there any district, city ... or street that was not filled
  preserved_meaning: The rhetorical question says that grief reached every kind of populated place.
  reasoning_layer_used: Greek rhetorical syntax and POB revision context
  rationale: The recast avoids awkward number agreement and makes the universal scope immediately clear.
- pob_phrase: mourning and lamentation
  simplified_phrase: mourning and cries of grief
  preserved_meaning: The wording retains both public grieving and its audible expression.
  reasoning_layer_used: POB lexical decisions for κοπετοῦ and γόων
  rationale: “Cries of grief” is clearer than “lamentation” without merging the two source ideas.
