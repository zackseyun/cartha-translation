translation:
  language: en
  text: The whole nation was to be registered, name by name.[a] This was not for the brief period of assigned labor announced earlier. Instead, they were to be tortured with the cruelties that had been ordered and utterly destroyed in a single day.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Name by name” means that each person was to be registered individually.
    reason: simplification_note
  - marker: b
    text: The Greek wording about the earlier purpose is difficult; it probably refers to short-term labor announced as a pretext for the actual plan of destruction.
    reason: cultural_note
