  simplified_phrase: was to be registered, name by name
  preserved_meaning: The entire people were subject to individual official registration.
  reasoning_layer_used: Lexical decisions for ἀπογραφῆναι and ἐξ ὀνόματος
  rationale: The distributive wording makes the individual registration clear at first reading.
- pob_phrase: the previously indicated brief service according to their work
  simplified_phrase: the brief period of assigned labor announced earlier
  preserved_meaning: Registration was presented as serving a previously announced short-term labor purpose.
  reasoning_layer_used: POB footnote b and lexical decisions for the difficult labor phrase
  rationale: The recasting replaces an opaque phrase while retaining labor, brevity, and prior announcement.
- pob_phrase: by being tortured with the ordered cruelties, to be utterly destroyed in the course of a single day
  simplified_phrase: they were to be tortured with the cruelties that had been ordered and utterly destroyed in a single day
  preserved_meaning: Officially commanded torture was intended to end in complete destruction within one day.
  reasoning_layer_used: Lexical decisions for στρεβλούμεντας, παρηγγελμέναις αἰκίαις, and the final temporal phrase
  rationale: Two coordinated verbs clarify the sequence without weakening the brutality or totality.
