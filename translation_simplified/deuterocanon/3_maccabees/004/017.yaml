translation:
  language: en
  text: But after the time already mentioned had passed, the scribes reported to the king that it was no longer possible to register the Jews[a] because there were too many to count.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “conduct a census of the Jews.” The Greek term can refer to registration, enrollment, or a census.
    reason: lexical_alternative
