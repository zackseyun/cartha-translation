translation:
  language: en
  text: All of them recovered everything that belonged to them from the official record.[a] Anyone holding any of their property returned it in extreme fear, because the great God had fully accomplished mighty deeds to deliver them.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “the inventory” or “the official registration.”
    reason: lexical_alternative
  - marker: b
    text: Or “for their salvation.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: recovered all their own property from the registration
  simplified_phrase: recovered everything that belonged to them from the official record
  preserved_meaning: They received back all their property from an administrative record or inventory.
  reasoning_layer_used: POB lexical decision for ἐξ ἀπογραφῆς
  rationale: “Official record” clarifies the administrative sense without adding how the record functioned.
- pob_phrase: those who had anything gave it back to them
  simplified_phrase: Anyone holding any of their property returned it
  preserved_meaning: Every person possessing some of their property restored it to them.
  reasoning_layer_used: POB lexical decisions for τοὺς ἔχοντάς τι and ἀποδοῦναι αὐτοῖς
  rationale: The rewrite clearly identifies the property and states its return directly.
- pob_phrase: mighty deeds for their deliverance
  simplified_phrase: mighty deeds to deliver them
  preserved_meaning: God acted powerfully to rescue the people from their historical danger.
  reasoning_layer_used: POB theological decision for σωτηρία
  rationale: The verbal form is easier to understand while preserving concrete divine deliverance.
