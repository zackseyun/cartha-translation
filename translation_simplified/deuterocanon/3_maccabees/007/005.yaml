translation:
  language: en
  text: These men led them down in chains and abused them, treating them like servants—or rather, like conspirators. Without giving them any hearing or investigation, they tried to kill them, clothing themselves in a cruelty more savage than Scythian custom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Scythian custom was used as a byword for extreme cruelty.
    reason: cultural_note
