  reasoning_layer_used: POB lexical decisions for καταγαγόντες, δεσμίους, and μετὰ σκυλμῶν
  rationale: Finite verbs clarify the sequence while retaining the direction, chains, and abuse.
- pob_phrase: attempted to destroy them without any hearing or examination
