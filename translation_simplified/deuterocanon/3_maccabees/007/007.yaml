translation:
  language: en
  text: He has always fought beside us, like a father fighting for his sons.[a] They also have steadfast goodwill toward us and our ancestors—the goodwill of a friend. Taking all this into account, we have rightly released them completely from every possible charge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “has always stood with us as an ally, like a father supporting his sons.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Considering that he has always fought alongside us like a father for his sons
  simplified_phrase: He has always fought beside us, like a father fighting for his sons.
  preserved_meaning: His continual military or allied support is compared to a father's support for his sons.
  reasoning_layer_used: POB lexical decisions for διὰ παντός, συμμαχοῦντα, and the father-son comparison
  rationale: A direct sentence keeps both the martial image and the family comparison.
- pob_phrase: reckoning the firm goodwill they have toward us and our forefathers as that of a friend
  simplified_phrase: They also have steadfast goodwill toward us and our ancestors—the goodwill of a friend.
  preserved_meaning: They maintain firm goodwill toward both generations, characterized as a friend's goodwill.
  reasoning_layer_used: POB lexical decisions for βεβαίαν εὔνοιαν, τοῦ φίλου, ἔχουσιν, and προγόνους
  rationale: The wording preserves an ongoing disposition and the source's singular comparison.
- pob_phrase: we have rightly released them in every way from any charge whatever
  simplified_phrase: we have rightly released them completely from every possible charge
  preserved_meaning: The release is just, completed, and comprehensive against any ground of accusation.
  reasoning_layer_used: POB lexical decision and footnote for ἀπολελύκαμεν and the emphatic closing phrase
  rationale: “Completely” and “every possible charge” clearly convey the emphatic legal formula.
