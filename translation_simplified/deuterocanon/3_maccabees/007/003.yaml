translation:
  language: en
  text: Some of our friends acted out of malice and kept close to us. They persuaded us to have the Jews under our rule gathered into groups[a] and then punished with unusual penalties on the charge that they had revolted.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may mean “groups,” “organized bodies,” or “associations”; its precise meaning here is uncertain.
    reason: lexical_alternative
