- pob_phrase: being more constantly at our side out of malice
  simplified_phrase: acted out of malice and kept close to us
  preserved_meaning: Their malicious motive and continuing access to the king are both retained.
  reasoning_layer_used: Lexical decisions for κατὰ κακοήθειαν and πυκνότερον ἡμῖν παρακείμενοι.
  rationale: Two direct verbs replace the difficult participial phrase.
- pob_phrase: after being gathered together in groups, should be punished with unusual penalties
  simplified_phrase: have ... gathered into groups and then punished with unusual penalties
  preserved_meaning: The Jews are gathered collectively before being subjected to extraordinary punishment.
  reasoning_layer_used: Lexical decisions for συναθροίσαντας, τὰ συστήματα, and ξενιζούσαις τιμωρίαις.
  rationale: Ordinary clause order makes the sequence clear without overstating the kind of groups.
- pob_phrase: as rebels
  simplified_phrase: on the charge that they had revolted
  preserved_meaning: Political revolt remains the alleged basis for punishment rather than a confirmed fact or religious apostasy.
  reasoning_layer_used: Theological decision on ἀποστάντων and the grounding review’s treatment of the qualifying construction.
  rationale: Charge language preserves the hostile allegation without presenting it as the narrator’s conclusion.
