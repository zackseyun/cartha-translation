translation:
  language: en
  text: They also recorded these events on a stone pillar[a] and established a place of prayer where the banquet had taken place. Then they left unharmed and free, overflowing with joy. Under the king’s command, they were brought safely back by land, across the sea, and along rivers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean that they publicly dedicated these words on a pillar.
    reason: lexical_alternative
