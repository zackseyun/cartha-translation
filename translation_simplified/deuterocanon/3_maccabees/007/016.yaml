translation:
  language: en
  text: But they had remained faithful to God even when facing death. After receiving complete deliverance,[a] they left the city, adorned with all kinds of wonderfully fragrant flowers. They rejoiced and shouted as they thanked God with songs of praise and richly sung hymns. He is the holy Savior of Israel,[b] the God of their fathers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “complete salvation”; here the word especially refers to rescue from destruction.
    reason: lexical_alternative
  - marker: b
    text: Or “the holy deliverer of Israel.”
    reason: lexical_alternative
