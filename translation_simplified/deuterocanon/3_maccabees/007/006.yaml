  preserved_meaning: The threats became more severe because of the preceding events and came before the sparing.
  reasoning_layer_used: Source syntax and lexical decisions for ἐπὶ τούτοις and διαπειλησάμενοι
  rationale: The finite clause keeps both the cause and the prior-action sequence clear.
