  preserved_meaning: The royal speaker claims a general policy of restrained treatment.
  reasoning_layer_used: Lexical decision for ἐπιείκειαν and royal-administrative context
  rationale: “Leniency” is common English and more precise here than personal “mercy.”
- pob_phrase: scarcely granted them their lives
  simplified_phrase: we only just spared their lives
  preserved_meaning: Their lives were spared reluctantly or by a narrow concession.
  reasoning_layer_used: Lexical decisions for μόγις and τὸ ζῆν αὐτοῖς χαρισάμενοι
  rationale: The idiom states the life-or-death outcome and narrow concession directly.
