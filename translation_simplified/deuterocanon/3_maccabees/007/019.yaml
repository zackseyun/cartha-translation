    text: The Greek can also mean suitable praises or confessions; the festive context supports “thanksgivings.”
    reason: lexical_alternative
  - marker: b
    text: This means living as resident foreigners or temporary dwellers, not necessarily living in formal exile.
    reason: cultural_note
