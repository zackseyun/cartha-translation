translation:
  language: en
  text: Each one returned to his former place.[a] They had gained authority among their enemies, with glory and fear,[b] and no one had disturbed any of their possessions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The compressed Greek could also mean “to what had formerly been theirs” or “to their previous position.”
    reason: lexical_alternative
  - marker: b
    text: The Greek leaves open whether this fear was inspired in others or accompanied their restored status.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: each one to his former place
  simplified_phrase: Each one returned to his former place
  preserved_meaning: Each person went back to the place or position held before.
  reasoning_layer_used: POB lexical decision and contextual rationale
  rationale: Adding “returned” completes the compressed movement naturally without resolving what “former place” denotes.
- pob_phrase: having obtained authority among their enemies
  simplified_phrase: They had gained authority among their enemies
  preserved_meaning: They now possessed authority in relation to their enemies.
  reasoning_layer_used: POB lexical decision and doctrine-realignment revision
  rationale: A finite clause is easier to follow while retaining the relational “among” rather than changing it to “over.”
- pob_phrase: their whole body of possessions having been shaken by none
  simplified_phrase: no one had disturbed any of their possessions
  preserved_meaning: The totality of their property remained untouched and undisturbed.
  reasoning_layer_used: POB lexical decisions and footnote b
  rationale: The natural negative clause preserves both the total scope and the image of possessions left undisturbed.
