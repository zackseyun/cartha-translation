translation:
  language: en
  text: Sinners will flee from the holy ones[a] like people driven away by war.[b] But the holy ones will chase sinners and catch them. Those who make a practice of lawlessness will not escape the Lord’s judgment. They will be captured like people caught by experienced enemies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the godly.”
    reason: lexical_alternative
  - marker: b
    text: The compressed Greek may also mean “as though pursued by war.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: as those pursued by war
  simplified_phrase: like people driven away by war
  preserved_meaning: The vivid image of war forcing people to flee remains intact.
  reasoning_layer_used: POB footnote b and lexical decision for ὡς διωκόμενοι πολέμου
  rationale: The permitted dynamic reading is clearer, while the footnote preserves the phrase’s ambiguity.
- pob_phrase: will pursue sinners and overtake them
  simplified_phrase: will chase sinners and catch them
  preserved_meaning: The pursuit and its successful result remain distinct actions.
  reasoning_layer_used: POB lexical decisions for καταδιώξονται and καταλήψονται
  rationale: Common verbs make both stages of the action immediately clear.
- pob_phrase: those who practice lawlessness
  simplified_phrase: Those who make a practice of lawlessness
  preserved_meaning: Lawlessness remains characteristic, continuing conduct.
  reasoning_layer_used: POB lexical decision for οἱ ποιοῦντες ἀνομίαν
  rationale: The natural English phrase clarifies ongoing behavior while retaining the concept of lawlessness.
interpretive_expansions:
- pob_phrase: they will flee ... but they will pursue sinners
  rendering: Sinners will flee ... But the holy ones will chase sinners
  claim: The fleeing group is the sinners, while the pursuing group is the holy ones.
  evidence:
  - The contrast sets those fleeing from the holy ones against sinners being pursued.
  - The final clause identifies the lawless as the people who are captured.
  confidence: moderate
  alternatives_preserved:
  - The Greek leaves the plural subjects implicit.
