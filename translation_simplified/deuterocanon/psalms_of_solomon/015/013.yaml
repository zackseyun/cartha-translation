translation:
  language: en
  text: For sins will leave the houses of sinners in ruins. On the day when the Lord judges, sinners will perish forever.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: will lay waste the houses of sinners
  simplified_phrase: will leave the houses of sinners in ruins
  preserved_meaning: Sins will severely ruin the sinners’ houses and make them desolate.
  reasoning_layer_used: The lexical decisions retain literal “houses” and the destructive force of ἐξερημώσουσιν.
  rationale: The new wording makes the image immediately clear without weakening its severity.
- pob_phrase: on the day of the Lord’s judgment
  simplified_phrase: On the day when the Lord judges
  preserved_meaning: The sinners perish when the Lord carries out judgment.
  reasoning_layer_used: The lexical rationale permits natural English while keeping the Lord as the one whose judgment occurs.
  rationale: Changing the noun phrase into a clause is easier to understand on first reading.
- pob_phrase: and sinners will perish on the day of the Lord’s judgment forever
  simplified_phrase: On the day when the Lord judges, sinners will perish forever
  preserved_meaning: Their perishing occurs on the judgment day and has enduring finality.
  reasoning_layer_used: The theological decision and revision pass attach “forever” to “will perish.”
  rationale: Reordering removes awkwardness while keeping “forever” beside the verb it modifies.
translation_notes:
  risk_flags:
