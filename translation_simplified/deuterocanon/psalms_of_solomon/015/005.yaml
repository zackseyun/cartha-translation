translation:
  language: en
  text: 'A new psalm, sung with joy from the heart;

    fruit from the lips, with the tongue as a well-tuned instrument[a];

    the lips’ firstfruits, offered from a holy and righteous heart.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “with an instrument fitted to the tongue”; the Greek expression is compact and difficult.
    reason: lexical_alternative
  - marker: b
    text: “Firstfruits” were the first portion presented as an offering; the poem pictures words from the lips as an offering.
    reason: cultural_note
simplification_decisions:
- pob_phrase: a new psalm with song, in the joy of the heart
  simplified_phrase: A new psalm, sung with joy from the heart
  preserved_meaning: The new psalm is voiced as a song arising from inward joy.
  reasoning_layer_used: POB lexical decisions for ψαλμὸν καινόν, ᾠδῆς, and ἐν εὐφροσύνῃ καρδίας
  rationale: Turning the noun “song” into “sung” produces natural English without merging the psalm and its singing.
- pob_phrase: the fruit of lips with the well-tuned instrument of the tongue
  simplified_phrase: fruit from the lips, with the tongue as a well-tuned instrument
  preserved_meaning: Speech is pictured as fruit, and the tongue as a tuned musical instrument.
  reasoning_layer_used: POB lexical decision and documented alternative for ἐν ὀργάνῳ ἤρμοσμένῳ γλώσσης
  rationale: The recast states the poetic comparison directly while retaining both source images.
- pob_phrase: the firstfruits of lips from a holy and righteous heart
  simplified_phrase: the lips’ firstfruits, offered from a holy and righteous heart
  preserved_meaning: Words arising from a morally holy heart are pictured as a firstfruits offering.
  reasoning_layer_used: POB lexical decisions for ἀπαρχὴν χειλέων and ἀπὸ καρδίας ὁσίας καὶ δικαίας
  rationale: The added verb “offered” clarifies the retained firstfruits image without reducing it to ordinary speech.
