translation:
  language: en
  text: God’s sign[a] is on the righteous for their salvation. Famine, the sword, and death[b] stay far away from them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “mark.”
    reason: lexical_alternative
  - marker: b
    text: Here “death” may refer more specifically to a deadly plague.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: For the sign of God is upon the righteous for salvation
  simplified_phrase: God’s sign is on the righteous for their salvation
  preserved_meaning: God’s sign is upon the righteous in relation to their salvation without making the sign itself the active cause.
  reasoning_layer_used: POB lexical decisions for σημεῖον and εἰς σωτηρίαν, corrected by the grounding review
  rationale: The revision keeps the goal-oriented phrase while avoiding an unsupported causal claim.
- pob_phrase: are far from the righteous
  simplified_phrase: stay far away from them
  preserved_meaning: The listed calamities remain distant from the righteous.
  reasoning_layer_used: POB lexical decision for μακράν
  rationale: The pronoun avoids repetition, and “stay far away” states the separation naturally.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “death” only as ordinary mortality rather than a judgment-list calamity.
    mitigation: Footnote [b] preserves the possible sense of deadly plague without overriding the POB wording.
  - risk: “Sign” may sound abstract and obscure the possible image of a mark.
    mitigation: Footnote [a] preserves “mark” as the documented lexical alternative.
