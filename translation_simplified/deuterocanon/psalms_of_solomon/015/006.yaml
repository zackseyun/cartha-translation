translation:
  language: en
  text: Whoever does these things will never be shaken by evil. A blazing fire and the wrath of the unrighteous will not touch them.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The one who does these things
  simplified_phrase: Whoever does these things
  preserved_meaning: The promise applies generally to anyone who practices the righteous actions just described.
  reasoning_layer_used: POB lexical decision for ὁ ποιῶν
  rationale: “Whoever” states the generic subject naturally in modern English.
- pob_phrase: a flame of fire
  simplified_phrase: A blazing fire
  preserved_meaning: The vivid image of dangerous fire remains intact.
  reasoning_layer_used: POB lexical decision for φλογὸς πυρός
  rationale: “Blazing fire” makes the Greek image immediately understandable without weakening it.
- pob_phrase: will not touch him
  simplified_phrase: will not touch them
  preserved_meaning: The fire and wrath will not reach the righteous person.
  reasoning_layer_used: POB lexical decision for οὐχ ἅψεται αὐτοῦ
  rationale: Singular “them” naturally refers back to the generic “whoever.”
translation_notes:
  risk_flags:
  - risk: “Blazing fire” is more idiomatic than the formally vivid phrase “flame of fire.”
    mitigation: The rendering preserves both the fire image and its threatening intensity.
  - risk: The Greek genitive could be argued to mean wrath directed against the unrighteous.
    mitigation: The main text follows the controlling POB reading, “the wrath of the unrighteous.”
