- pob_phrase: But those who fear the Lord will be shown mercy in it
  simplified_phrase: On that day, those who fear the Lord will receive mercy
  preserved_meaning: God grants mercy to those characterized by fearing the Lord at the time in view.
  reasoning_layer_used: Lexical and theological decisions on ἐλεηθήσονται and ἐν αὐτῇ
  rationale: The direct time phrase and active English order make the sentence easier to follow while keeping mercy as something received.
- pob_phrase: and they will live by the mercy of their God
  simplified_phrase: They will live by their God’s mercy
  preserved_meaning: Their life depends on the sustaining mercy of their God.
  reasoning_layer_used: Lexical decision on ἐν τῇ ἐλεημοσύνῃ
  rationale: The shorter possessive form removes stiffness without weakening divine mercy as the means of life.
