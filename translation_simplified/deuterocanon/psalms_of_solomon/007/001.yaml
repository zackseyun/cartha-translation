translation:
  language: en
  text: Do not leave us,[a] O God, or those who hate us for no reason may attack us.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek verb pictures someone moving a tent or camp away, suggesting that God withdraws his presence.
    reason: source_note
  - marker: b
    text: Or “or those who hate us may attack us for no reason.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Do not depart from us
  simplified_phrase: Do not leave us
  preserved_meaning: The prayer asks God not to withdraw from his people.
  reasoning_layer_used: POB lexical decision for ἀποσκηνώσῃς and its revision history
  rationale: “Leave us” is more immediate common English, while the footnote preserves the tent image.
- pob_phrase: lest
  simplified_phrase: or ... may
  preserved_meaning: God’s withdrawal is linked to the feared possibility of an enemy attack.
  reasoning_layer_used: POB lexical decision for ἵνα μὴ
  rationale: The recast expresses the feared result without the less familiar word “lest.”
- pob_phrase: those who hate us without cause
  simplified_phrase: those who hate us for no reason
  preserved_meaning: Their hostility toward the community has no just basis.
  reasoning_layer_used: POB lexical decision for δωρεάν
  rationale: “For no reason” states “without cause” in more familiar language.
translation_notes:
