simplification_decisions:
- pob_phrase: send death, you will command it concerning us
  simplified_phrase: send death, you will give him orders about us
  preserved_meaning: Death is personified as acting under God's authority.
  reasoning_layer_used: POB lexical decisions for θάνατον, ἐντελῇ, and αὐτῷ
  rationale: “Give him orders about us” uses ordinary English while preserving the command and personification.
- pob_phrase: for you are merciful
  simplified_phrase: because you are merciful
  preserved_meaning: God's mercy is the stated reason for confidence that the people will not be ended.
  reasoning_layer_used: Greek causal connector and POB clause relationship
  rationale: “Because” makes the causal link explicit in modern English.
- pob_phrase: you will not be angry so as to bring us to an end
  simplified_phrase: you will not be so angry that you completely destroy us
  preserved_meaning: God's anger will not result in the people's total destruction.
  reasoning_layer_used: POB lexical decisions for ὀργισθήσῃ and τοῦ συντελέσαι ἡμᾶς
  rationale: The result clause is recast directly while retaining the force of complete destruction.
