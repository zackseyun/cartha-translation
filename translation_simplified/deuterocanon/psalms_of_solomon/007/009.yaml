translation:
  language: en
  text: When the time comes for you to help, you will guide us so that you may show mercy to the house of Jacob, with the day you promised them in view.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The final Greek verb form is difficult; it may literally read “I promised them,” but the context supports “you promised them.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: at the time of your help
  simplified_phrase: when the time comes for you to help
  preserved_meaning: God’s guidance comes at the particular time of his help.
  reasoning_layer_used: Lexical decisions for ἐν καιρῷ and ἀντιλήψεως
  rationale: The time phrase becomes a natural English clause without narrowing “help” to deliverance.
- pob_phrase: to show mercy to the house of Jacob
  simplified_phrase: so that you may show mercy to the house of Jacob
  preserved_meaning: Showing mercy to Jacob’s covenant community remains the purpose of God’s guidance.
  reasoning_layer_used: Lexical and theological decisions for τοῦ ἐλεῆσαι and τὸν οἶκον Ἰακώβ
  rationale: “So that” makes the Greek purpose relationship clear while retaining the covenantal title.
- pob_phrase: for the day that you promised them
  simplified_phrase: with the day you promised them in view
  preserved_meaning: God’s promised day remains the forward-looking horizon of the action.
  reasoning_layer_used: Lexical decision for εἰς ἡμέραν and textual decision for ἐπηγγείλω αὐτοῖς
  rationale: The wording conveys forward direction without claiming that the mercy occurs precisely on that day.
interpretive_expansions:
- pob_phrase: for the day
  rendering: with the day ... in view
  claim: The promised day is the future horizon toward which the action points.
  evidence:
  - The POB rationale says εἰς likely points forward to an appointed day in view.
  - The POB avoids the more specific wording “on the day.”
  confidence: moderate
  alternatives_preserved:
  - for the day
  - toward the day
