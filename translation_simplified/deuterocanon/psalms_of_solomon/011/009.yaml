translation:
  language: en
  text: May the Lord carry out what he has said about Israel and Jerusalem. May the Lord raise Israel up[a] in the name of his glory. May the Lord’s mercy remain with Israel forever and ever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Raise Israel up” may also mean “restore Israel” or “establish Israel again.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: do what he has spoken concerning
  simplified_phrase: carry out what he has said about
  preserved_meaning: The Lord is asked to carry out what he spoke regarding Israel and Jerusalem.
  reasoning_layer_used: POB lexical decisions for ποιήσαι and ἐλάλησεν ἐπί
  rationale: “Carry out” clearly keeps what the Lord said as the object of his action.
- pob_phrase: may the Lord raise up Israel
  simplified_phrase: May the Lord raise Israel up
  preserved_meaning: The raising image remains open to restoration, vindication, or reestablishment.
  reasoning_layer_used: POB lexical and theological decisions for ἀναστήσαι
  rationale: Natural English word order improves readability without narrowing the image.
- pob_phrase: The Lord’s mercy be upon Israel forever and ever
  simplified_phrase: May the Lord’s mercy remain with Israel forever and ever
  preserved_meaning: The prayer asks for the Lord’s mercy toward Israel to continue without end.
  reasoning_layer_used: POB lexical decision and latest revision for ἔλεος and εἰς τὸν αἰῶνα καὶ ἔτι
  rationale: The explicit wish and common verb clarify the enduring benediction.
translation_notes:
  risk_flags:
  - risk: “In the name of his glory” remains compressed and may sound unusual.
    mitigation: It is retained because POB preserves both “name” and “glory” without defining their relation more narrowly.
  - risk: Readers may take “raise Israel up” in only one sense.
    mitigation: The footnote preserves restoration and reestablishment as possibilities without removing the source image.
