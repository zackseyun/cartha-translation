translation:
  language: en
  text: Jerusalem, stand on a high place and look! The Lord has gathered your children together from east and west.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Stand, O Jerusalem, on high
  simplified_phrase: Jerusalem, stand on a high place
  preserved_meaning: Jerusalem is commanded to take an elevated position from which she can look out.
  reasoning_layer_used: The lexical decision and adjudicated revision identify a concrete elevated vantage point.
  rationale: “A high place” avoids the heavenly sense that modern readers may hear in “on high.”
- pob_phrase: and see
  simplified_phrase: and look!
  preserved_meaning: Jerusalem is urgently commanded to observe her returning people.
  reasoning_layer_used: The Greek imperative and the lexical rationale support a direct command to look.
  rationale: A separate exclamation makes the command immediate and natural in English.
- pob_phrase: your children gathered from east and west by the Lord
  simplified_phrase: The Lord has gathered your children together from east and west.
  preserved_meaning: The Lord brings Jerusalem’s people from widely separated regions into one company.
  reasoning_layer_used: The lexical decisions preserve divine agency, broad geographic scope, and the unified gathering.
  rationale: An active sentence clearly names the Lord as the one who gathers them.
translation_notes:
  risk_flags:
  - risk: “Together” may emphasize unity more than the latest POB wording does.
    mitigation: It preserves the documented force of εἰς ἅπαξ without implying suddenness.
