simplification_decisions:
- pob_phrase: Put on, Jerusalem, the garments of your glory
  simplified_phrase: Jerusalem, put on your glorious garments
  preserved_meaning: Jerusalem is commanded to clothe herself in garments displaying her glory.
  reasoning_layer_used: POB lexical decisions for ἔνδυσαι, ἱμάτια, and δόξης
  rationale: Natural word order and an adjective make the poetic image easier to grasp.
- pob_phrase: make ready your sacred robe
  simplified_phrase: Prepare your sacred robe
  preserved_meaning: Jerusalem must ready a dignified garment associated with consecration.
  reasoning_layer_used: POB lexical and theological decisions for στολήν and τοῦ ἁγιάσματός σου
  rationale: “Prepare” is direct, while “sacred robe” preserves the chosen reading.
- pob_phrase: garments of your glory; make ready
  simplified_phrase: glorious garments. Prepare
  preserved_meaning: The two commands remain distinct parts of Jerusalem’s investiture imagery.
  reasoning_layer_used: POB syntax and source parallel imperatives
  rationale: Two sentences make the parallel commands easier to follow.
