translation:
  language: en
  text: The hills fled from them as they approached.[a] The forests gave them shade along the way.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “as they arrived.” The Greek expression is compact and can describe their approach or arrival.
