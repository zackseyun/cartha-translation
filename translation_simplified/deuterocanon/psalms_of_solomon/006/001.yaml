simplification_decisions:
- pob_phrase: Blessed is the man whose heart is ready
  simplified_phrase: A man is blessed if his heart is ready
  preserved_meaning: The man's inner disposition is prepared to call on the Lord.
  reasoning_layer_used: POB lexical decisions for “Blessed,” “man,” “heart,” and “ready”
  rationale: The beatitude is recast in ordinary English while keeping the heart itself as the subject of readiness.
- pob_phrase: to call on the name of the Lord
  simplified_phrase: to call on the name of the Lord
  preserved_meaning: He is ready to invoke or appeal to the Lord by name.
  reasoning_layer_used: POB lexical decisions for “call on,” “the name,” and “the Lord”
  rationale: The biblical phrase is retained because paraphrasing it could narrow its meaning.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “man” to exclude women.
    mitigation: The footnote explains that the masculine singular is representative and may be translated “person.”
