simplification_decisions:
- pob_phrase: at the crossing of rivers
  simplified_phrase: while crossing rivers
  preserved_meaning: He remains steady during the dangerous passage through rivers.
  reasoning_layer_used: The lexical decision for διάβασις identifies a crossing or passage.
  rationale: The verbal form makes the action easier to picture.
- pob_phrase: the tossing of seas
  simplified_phrase: surging seas
  preserved_meaning: The seas are violently agitated and threatening.
  reasoning_layer_used: The lexical decision for σάλος allows “surge” and conveys heaving motion.
  rationale: “Surging seas” preserves the image in natural English.
- pob_phrase: will not be terrified
  simplified_phrase: will not be terrified
  preserved_meaning: The dangers will not throw him into intense fear.
  reasoning_layer_used: The applied revision preserves the stronger force of πτοηθήσεται.
  rationale: “Terrified” retains an intensity that “afraid” could weaken.
