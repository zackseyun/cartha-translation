translation:
  language: en
  text: He is among the first to act against him, as if he were zealous.[a] Yet he himself is guilty of many kinds of sinful deeds and acts of self-indulgence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “At first his hand is against him,” if the Greek refers to timing rather than his being among the first to act.
    reason: alternative_reading
