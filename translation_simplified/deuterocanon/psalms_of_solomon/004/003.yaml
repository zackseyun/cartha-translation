- pob_phrase: guilty in a variety of sinful deeds, in acts of self-indulgence
  simplified_phrase: guilty of many kinds of sinful deeds and acts of self-indulgence
  preserved_meaning: He is culpable for varied sinful conduct, including undisciplined excess.
  reasoning_layer_used: Applied lexical revision and POB decision for ἀκρασίαις
  rationale: “Many kinds” and the coordinated list express the compressed Greek naturally.
