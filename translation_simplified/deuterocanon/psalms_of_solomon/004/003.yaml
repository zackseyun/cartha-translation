  preserved_meaning: He quickly joins those acting against another person.
  reasoning_layer_used: POB lexical decisions for χείρ, ἐν πρώτοις, and ἐπʼ αὐτόν
  rationale: The wording gives the hand idiom its natural sense without inventing a physical gesture.
- pob_phrase: as if in zeal
