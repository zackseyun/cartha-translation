translation:
  language: en
  text: This lawlessness filled him. He fixed his eyes on another household[a], planning to destroy it with relentless words.[b] Yet with all these things, his soul was still not satisfied—like Hades, the realm of the dead, which never has enough.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “another house”; the Greek may refer to a building or to a family and its home.
    reason: lexical_alternative
  - marker: b
    text: This difficult phrase may also mean “with unhesitating words” or “with words spoken without delay.”
    reason: alternative_reading
