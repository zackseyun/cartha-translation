translation:
  language: en
  text: He did not stop until he succeeded in scattering them as though they had been orphaned. Because of lawless desire, he made a household desolate.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The unusual phrase may also mean “as in bereavement” or “as among the fatherless.”
    reason: lexical_alternative
  - marker: b
    text: Literally “house”; in this context it likely includes the household.
    reason: cultural_note
simplification_decisions:
- pob_phrase: as in orphanhood
  simplified_phrase: as though they had been orphaned
  preserved_meaning: The scattering leaves them in the shattered and unprotected condition pictured by orphanhood.
  reasoning_layer_used: POB lexical decision for ὡς ἐν ὀρφανίᾳ
  rationale: The ordinary clause preserves the vivid image without resolving its documented ambiguity.
- pob_phrase: he made a house desolate
  simplified_phrase: he made a household desolate
  preserved_meaning: He actively devastated a home and the family connected with it.
  reasoning_layer_used: POB lexical decision and cultural note for ἠρήμωσεν οἶκον
  rationale: “Household” clarifies the likely social scope while “made desolate” retains direct causation.
- pob_phrase: and he made a house desolate because of lawless desire
  simplified_phrase: Because of lawless desire, he made a household desolate
  preserved_meaning: Lawless desire caused the desolation described in the second statement.
  reasoning_layer_used: POB rendering of ἕνεκεν ἐπιθυμίας παρανόμου
  rationale: Putting the cause first creates a clear sentence without changing the relationship.
interpretive_expansions:
- pob_phrase: a house
  rendering: a household
  claim: The house likely includes the family living in it, not only the building.
  evidence:
  - The surrounding context concerns the destruction of families.
  - The POB cultural note identifies “household” as the likely broader sense.
  confidence: moderate
  alternatives_preserved:
  - house
translation_notes:
  risk_flags:
  - risk: The orphanhood phrase may refer more broadly to bereavement or the fatherless.
    mitigation: The text retains the orphan image, and footnote a preserves both alternatives.
  - risk: “Household” could obscure the concrete source word “house.”
    mitigation: Footnote b supplies the literal word and presents the broader sense as likely.
