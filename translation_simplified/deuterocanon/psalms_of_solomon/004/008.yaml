translation:
  language: en
  text: May God expose the deeds of the person who seeks to please people rather than God.[a] May those deeds be ridiculed and mocked.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The traditional term is “man-pleaser,” meaning someone whose conduct is shaped by seeking human approval.
    reason: simplification_note
simplification_decisions:
- pob_phrase: the man-pleaser
  simplified_phrase: the person who seeks to please people rather than God
  preserved_meaning: The person is characterized by seeking human approval instead of God's approval.
  reasoning_layer_used: POB lexical decision and immediate context in verse 9
  rationale: This wording explains the ethical category while presenting it as a settled orientation rather than an occasional effort.
- pob_phrase: his deeds with ridicule and derision
  simplified_phrase: May those deeds be ridiculed and mocked
  preserved_meaning: The deeds become objects of contemptuous mockery.
  reasoning_layer_used: POB lexical decisions for καταγέλωτι and μυκτηρισμῷ
  rationale: The paired verbs clearly preserve both explicit expressions of mockery.
- pob_phrase: May God expose the deeds
  simplified_phrase: May God expose the deeds
  preserved_meaning: The line asks God to uncover wrongdoing rather than predicting that he will do so.
  reasoning_layer_used: POB lexical decision for ἀνακαλύψαι ὁ θεὸς
  rationale: The wording is already clear and preserves the prayerful appeal.
interpretive_expansions:
- pob_phrase: the man-pleaser
  rendering: the person who seeks to please people rather than God
  claim: The person's pursuit of human approval is ethically opposed to pleasing God.
  evidence:
  - The POB lexical rationale identifies pleasing human beings rather than God as the contextual sense.
  - The nearby wording in verse 9 supports this contrast.
  confidence: high
  alternatives_preserved:
