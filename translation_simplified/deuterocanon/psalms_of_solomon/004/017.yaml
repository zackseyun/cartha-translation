translation:
  language: en
  text: May his life be full of pain, poverty, and desperate need,[a] O Lord. May he sleep in grief and wake in distress.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The same Greek word appears in both places and can mean severe need, helplessness, or distress.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: be in pains and poverty and want
  simplified_phrase: be full of pain, poverty, and desperate need
  preserved_meaning: His whole life is to be marked by suffering, poverty, and severe lack.
  reasoning_layer_used: POB lexical decisions for ὀδύναις, πενίᾳ, ἀπορίᾳ, and ζωή
  rationale: The rewrite replaces the archaic noun “want” while preserving the three distinct hardships.
- pob_phrase: his sleep in griefs, and his waking in distresses
  simplified_phrase: May he sleep in grief and wake in distress
  preserved_meaning: Sorrow and hardship are to remain with him both asleep and awake.
  reasoning_layer_used: POB lexical decisions and the optative revision
  rationale: Two direct verbal clauses make the contrast between sleeping and waking immediately clear.
- pob_phrase: May his life be ... O Lord
  simplified_phrase: May his life be ... O Lord. May he ...
  preserved_meaning: The verse remains a prayer of imprecation addressed directly to the Lord.
  reasoning_layer_used: Applied grammar revision preserving the implied optative or jussive
  rationale: Repeating “May” prevents the second sentence from sounding like a factual description.
