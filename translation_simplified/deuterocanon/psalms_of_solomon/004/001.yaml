translation:
  language: en
  text: Why do you, who have no respect for what is holy, sit in a holy council when your heart has gone far away from the Lord and provokes the God of Israel with proverbs?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Proverbs” may here mean taunts, pointed sayings, or riddling speech.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: profane one
  simplified_phrase: you, who have no respect for what is holy
  preserved_meaning: The person is condemned as morally irreverent, in sharp contrast with the holy council.
  reasoning_layer_used: POB lexical decision for βέβηλε
  rationale: The descriptive wording explains “profane” without weakening the rebuke.
- pob_phrase: while your heart has gone far away from the Lord, provoking
  simplified_phrase: when your heart has gone far away from the Lord and provokes
  preserved_meaning: The heart remains estranged from the Lord and is the agent that provokes God.
  reasoning_layer_used: POB syntax and lexical decisions for ἡ καρδία σου μακρὰν ἀφέστηκεν and παροργίζων
  rationale: A coordinated finite verb keeps the unified question and makes the heart’s role clear.
- pob_phrase: with proverbs
  simplified_phrase: with proverbs
  preserved_meaning: The sayings provoke Israel’s God, while their exact character remains uncertain.
  reasoning_layer_used: POB lexical decision for ἐν παροιμίαις
  rationale: The main text retains the source-driven term, and the footnote gives its possible nuances.
translation_notes:
  risk_flags:
