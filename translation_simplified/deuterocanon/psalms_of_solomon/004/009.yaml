translation:
  language: en
  text: May the devout affirm that their God’s judgment is just when sinners are taken away from the presence of the righteous man—even the sinner who speaks to please a man, but does so only with deceit.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek shifts awkwardly from plural “sinners” to a singular description, probably portraying a typical sinner.
    reason: alternative_reading
  - marker: b
    text: Because the Greek is syntactically awkward, the final description may instead mean “the sinner who says what pleases a man, only with deceit.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: vindicate the judgment of their God
  simplified_phrase: affirm that their God’s judgment is just
  preserved_meaning: The devout acknowledge the justice of God’s judgment.
  reasoning_layer_used: Lexical decisions for δικαιώσαισαν and κρίμα
  rationale: This states the forensic sense directly without the less familiar word “vindicate.”
- pob_phrase: removed from before the righteous man
  simplified_phrase: taken away from the presence of the righteous man
  preserved_meaning: Sinners are removed from where the representative righteous man stands.
  reasoning_layer_used: Lexical decision for ἀπὸ προσώπου δικαίου
  rationale: “From the presence of” explains the spatial idiom while retaining the singular righteous man.
- pob_phrase: the one speaking what pleases a man, only with deceit
  simplified_phrase: the sinner who speaks to please a man, but does so only with deceit
  preserved_meaning: The sinner directs his speech toward pleasing a person while speaking deceitfully.
  reasoning_layer_used: Lexical decisions for ἀνθρώπῳ ἀρέσκον and λαλοῦντα μόνον μετὰ δόλου, with the grounding review
  rationale: Finite verbs clarify the awkward description while keeping pleasing speech and deceit together.
