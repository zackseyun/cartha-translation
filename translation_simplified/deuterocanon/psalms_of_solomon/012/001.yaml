translation:
  language: en
  text: Lord, rescue my soul[b] from a lawless, wicked man—and from a lawless, whispering tongue[a] that speaks lies and deceitful words.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Whispering tongue” may also be understood as “slandering tongue.”
    reason: lexical_alternative
  - marker: b
    text: “My soul” can also mean “my life” or simply “me.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: deliver my soul
  simplified_phrase: rescue my soul
  preserved_meaning: God is asked to bring the speaker out of danger while the biblical term “soul” is retained.
  reasoning_layer_used: Lexical decisions for ῥῦσαι and τὴν ψυχήν μου
  rationale: “Rescue” states the requested action more directly in common English.
- pob_phrase: a lawless and wicked man
  simplified_phrase: a lawless, wicked man
  preserved_meaning: The man is both opposed to God’s law and morally corrupt.
  reasoning_layer_used: Lexical decision for ἀνδρὸς παρανόμου καὶ πονηροῦ
  rationale: Removing the repeated conjunction makes the paired description more natural without merging its meanings.
- pob_phrase: speaking falsehood and deceit
  simplified_phrase: that speaks lies and deceitful words
  preserved_meaning: The tongue produces both false and deceptive speech.
  reasoning_layer_used: Lexical decision for λαλούσης ψευδῆ καὶ δόλια
  rationale: The relative clause and concrete wording are easier to understand than the abstract participial phrase.
translation_notes:
  risk_flags:
  - risk: “Lawless tongue” remains an unusual poetic expression in English.
    mitigation: The concrete tongue image is retained because the source applies “lawless” directly to it.
  - risk: “Whispering” may be mistaken for merely quiet speech.
    mitigation: Footnote a preserves the malicious sense of slander or backbiting.
