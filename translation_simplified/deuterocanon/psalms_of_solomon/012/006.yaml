translation:
  language: en
  text: May the Lord protect the quiet-hearted person who hates unjust people. May the Lord guide the man who makes peace in the home.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “house” or “household.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a quiet soul
  simplified_phrase: the quiet-hearted person
  preserved_meaning: This keeps the sense of a calm, settled inner person.
  reasoning_layer_used: POB lexical decisions for ψυχή and ἡσύχιος
  rationale: “Quiet-hearted person” clearly expresses settled character without making the soul sound like a separate object.
- pob_phrase: that hates the unjust
  simplified_phrase: who hates unjust people
  preserved_meaning: The person hates people characterized by injustice, not merely injustice in the abstract.
  reasoning_layer_used: POB lexical decision for μισοῦσαν ἀδίκους
  rationale: “Unjust people” is more immediately understandable than the substantival phrase “the unjust.”
- pob_phrase: who makes peace in the house
  simplified_phrase: who makes peace in the home
  preserved_meaning: The man actively makes peace within a domestic or household setting.
  reasoning_layer_used: POB lexical decisions for ποιοῦντα εἰρήνην and ἐν οἴκῳ
  rationale: The wording keeps peacemaking located within the home, while the footnote preserves the source term’s range.
translation_notes:
  risk_flags:
  - risk: “Quiet-hearted” could be misunderstood as timid or withdrawn.
    mitigation: The phrase represents the POB’s calm and settled inner character, not fearfulness.
  - risk: “Home” may sound narrower than the possible household sense.
    mitigation: The footnote preserves both “house” and “household.”
