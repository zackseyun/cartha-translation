translation:
  language: en
  text: May the sinners perish from the Lord’s presence once and for all.[a] May those who are devoted to the Lord inherit what the Lord has promised.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or simply “once”; the Greek may refer either to one occurrence or to finality.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and may the devout of the Lord
  simplified_phrase: May those who are devoted to the Lord
  preserved_meaning: The prayer concerns people marked by faithful devotion to the Lord.
  reasoning_layer_used: POB lexical decision for ὅσιοι
  rationale: The rewrite replaces the abstract label “the devout” with a clear description.
- pob_phrase: inherit the promises
  simplified_phrase: inherit what the Lord has promised
  preserved_meaning: They receive the promised good as a covenant inheritance.
  reasoning_layer_used: POB lexical decisions for κληρονομήσαισαν and ἐπαγγελίας
  rationale: The clause states the same inheritance image in more natural English.
- pob_phrase: May ... and may
  simplified_phrase: May ... . May ... .
  preserved_meaning: Both optatives remain distinct wishes or prayers.
  reasoning_layer_used: Greek clause structure and POB optative rationale
  rationale: Two sentences make the contrasting petitions easier to follow.
interpretive_expansions:
- pob_phrase: the promises
  rendering: what the Lord has promised
  claim: The promises are understood as promises made by the Lord.
  evidence:
  - The phrase “of the Lord” identifies the covenant setting.
  - The POB rationale describes them as recognized divine promises.
  confidence: high
  alternatives_preserved:
