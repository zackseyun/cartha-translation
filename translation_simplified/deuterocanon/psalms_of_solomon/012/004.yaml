translation:
  language: en
  text: May God throw the houses of lawless people into wartime turmoil through secret, malicious whispers.[a] May he keep the lips of the lawless far from innocent people in time of distress.[b] May the bones of those who spread such whispers be scattered far from those who fear the Lord.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “houses” and “whispering lips.” “Houses” may also include households or family establishments, and the whispers imply secret, malicious speech.
    reason: lexical_alternative
  - marker: b
    text: The Greek phrase “in distress” may describe either the innocent people or the lawless people.
    reason: alternative_reading
