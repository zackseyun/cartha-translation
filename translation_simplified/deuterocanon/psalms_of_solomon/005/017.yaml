simplification_decisions:
- pob_phrase: Your mercy is over all the earth
  simplified_phrase: your mercy reaches across the whole earth
  preserved_meaning: The Lord’s mercy extends over the entire earth.
  reasoning_layer_used: The lexical decisions for ἐπὶ πᾶσαν τὴν γῆν and the implied copula support wording that expresses extension.
  rationale: “Reaches across” states the worldwide scope in clear, natural English.
- pob_phrase: O Lord
  simplified_phrase: Lord
  preserved_meaning: The verse directly addresses the Lord.
  reasoning_layer_used: The κύριε decision permits direct address without the interjection “O.”
  rationale: Dropping “O” makes the address natural in modern English while retaining its gravity.
- pob_phrase: in kindness
  simplified_phrase: with kindness
  preserved_meaning: Kindness qualifies the Lord’s mercy without specifying a distinct action.
  reasoning_layer_used: The χρηστότητι decision identifies the closing phrase as kindness or goodness.
  rationale: “With kindness” is accessible and preserves the compact relationship in the Greek.
