  preserved_meaning: Their discipline is connected with conduct done unknowingly.
  reasoning_layer_used: POB lexical rationale and documented ambiguity
  rationale: The wording makes the connection readable while the footnote preserves the less explicit alternative.
- pob_phrase: is not like the destruction of the sinner
