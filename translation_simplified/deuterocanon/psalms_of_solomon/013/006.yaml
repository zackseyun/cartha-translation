translation:
  language: en
  text: For the discipline righteous people receive when they act in ignorance is not the same as the destruction of a sinner.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “discipline for what is done in ignorance.”
    reason: lexical_alternative
  - marker: b
    text: Some manuscripts read “sinners” instead of “righteous people.”
    reason: textual_variant
