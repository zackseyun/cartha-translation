translation:
  language: en
  text: The Lord will spare his faithful people. By disciplining them,[a] he will wipe away their offenses. For the righteous will live forever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Discipline can include correction, training, or chastening.
    reason: simplification_note
simplification_decisions:
- pob_phrase: his faithful ones
  simplified_phrase: his faithful people
  preserved_meaning: The Lord spares the covenant community that remains faithful to him.
  reasoning_layer_used: Applied revision and book-specific lexical guidance for ὁσίων
  rationale: “Faithful people” expresses this group label in natural modern English.
- pob_phrase: he will wipe away their trespasses by discipline
  simplified_phrase: By disciplining them, he will wipe away their offenses
  preserved_meaning: The Lord uses discipline to remove their moral wrongs rather than destroying them.
  reasoning_layer_used: Lexical decisions for παραπτώματα, ἐξαλείψει, and ἐν παιδείᾳ, with the theological decision on mercy and discipline
  rationale: The active wording identifies those disciplined while retaining discipline as the means of removal.
- pob_phrase: the life of the righteous is forever
  simplified_phrase: the righteous will live forever
  preserved_meaning: The righteous have enduring, unending life.
  reasoning_layer_used: Lexical decisions for δικαίων and εἰς τὸν αἰῶνα
  rationale: The verbal form states the same promise more directly.
interpretive_expansions:
- pob_phrase: by discipline
  rendering: By disciplining them
  claim: The Lord disciplines his faithful people as the means of wiping away their offenses.
  evidence:
  - The clause links their offenses with discipline as the means of removal.
  - The POB theological decision reads divine sparing as including discipline.
  confidence: high
  alternatives_preserved:
  - Discipline may also describe the context in which their offenses are removed.
  - Discipline can include chastening as well as corrective training.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand discipline as either training alone or punishment alone.
    mitigation: The footnote preserves correction, training, and chastening without choosing only one nuance.
