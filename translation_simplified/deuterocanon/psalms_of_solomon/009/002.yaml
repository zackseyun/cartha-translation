  rationale: “Driven out” makes the forced removal clear while retaining “inheritance” as a key biblical concept.
- pob_phrase: the dispersion of Israel is among every nation
  simplified_phrase: Israel is scattered among every nation
  preserved_meaning: Israel exists in a state of scattering throughout the nations.
