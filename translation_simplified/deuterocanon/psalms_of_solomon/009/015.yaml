translation:
  language: en
  text: You will bless righteous people. You do not call them to account for the sins they committed, and you show your goodness to those who sin and repent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “feel remorse”; the word can include regret as well as repentance.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the righteous
  simplified_phrase: righteous people
  preserved_meaning: People characterized by righteousness receive the promised blessing.
  reasoning_layer_used: lexical decision for δικαίους
  rationale: The wording makes the substantival adjective immediately clear without weakening its moral force.
- pob_phrase: for the things in which they sinned
  simplified_phrase: for the sins they committed
  preserved_meaning: God does not require them to answer for their past wrongdoing.
  reasoning_layer_used: lexical decision for περὶ ὧν ἥμαρτοσαν
  rationale: The natural English phrase preserves the reference to specific past sins.
- pob_phrase: your goodness is toward
  simplified_phrase: you show your goodness to
  preserved_meaning: God’s goodness is actively directed toward repentant sinners.
  reasoning_layer_used: lexical decision for χρηστότης and immediate syntax
  rationale: The active wording clearly expresses the relational force of God’s goodness.
interpretive_expansions:
- pob_phrase: those who sin in repentance
  rendering: those who sin and repent
  claim: Repentance describes the people who have sinned rather than the manner in which they sin.
  evidence:
  - The POB revision history identifies and rejects the unintended sense of sinning while repenting.
  - The lexical rationale says μεταμέλεια denotes regret leading to repentance or a change of mind.
  confidence: high
  alternatives_preserved:
  - those who sin and feel remorse
  - those who sin with regret
translation_notes:
  risk_flags:
  - risk: Readers may overlook the shift from future blessing to God’s present, ongoing practice.
    mitigation: The draft preserves “will bless” but keeps “do not call” in the present tense.
  - risk: “Repent” may understate the possible nuance of remorse or regret.
    mitigation: The footnote preserves that lexical alternative.
