translation:
  language: en
  text: So that you may be shown to be right[a], O God, in your righteousness[b] amid our acts of rebellion.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “vindicated.”
    reason: lexical_alternative
  - marker: b
    text: Or “in your justice.”
    reason: lexical_alternative
  - marker: c
    text: The final phrase may also mean “concerning our acts of rebellion.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: you may be vindicated
  simplified_phrase: you may be shown to be right
  preserved_meaning: God does not become righteous but is demonstrated or acknowledged to be right.
  reasoning_layer_used: lexical and theological decisions on δικαιωθῇς
  rationale: The clearer phrase states the intended sense of “vindicated” without changing the claim.
- pob_phrase: our lawless deeds
  simplified_phrase: our acts of rebellion
  preserved_meaning: The wrongdoing is defiance of God’s law, not merely a mistake.
  reasoning_layer_used: lexical decision on ἀνομία
  rationale: “Acts of rebellion” expresses the strong moral force in familiar English.
translation_notes:
  risk_flags:
  - risk: “Amid” may suggest only circumstances, while the Greek may indicate reference to the people’s rebellion.
    mitigation: Footnote c preserves the important “concerning” alternative.
  - risk: “Shown to be right” could be heard as if God needed another authority’s approval.
    mitigation: The wording describes God’s righteousness being demonstrated, and footnote a retains “vindicated.”
