translation:
  language: en
  text: You made a covenant with our fathers about us, and we will hope in you when our soul turns back.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “when we repent”; the Greek pictures our soul turning back or returning.
