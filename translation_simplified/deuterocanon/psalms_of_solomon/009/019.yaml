simplification_decisions:
- pob_phrase: In a covenant you appointed to our fathers
  simplified_phrase: You made a covenant with our fathers
  preserved_meaning: God established a covenant with Israel’s fathers.
  reasoning_layer_used: lexical decisions and doctrine realignment
  rationale: This uses natural English while retaining the biblical term “covenant” and the explicit “fathers.”
- pob_phrase: concerning us
  simplified_phrase: about us
  preserved_meaning: The covenant concerned the speakers and their community.
  reasoning_layer_used: lexical decision for περὶ ἡμῶν
  rationale: “About us” is the common-English equivalent without adding the implication “for us.”
- pob_phrase: in the turning back of our soul
  simplified_phrase: when our soul turns back
  preserved_meaning: Their renewed hope accompanies the soul’s return, with likely penitential force.
  reasoning_layer_used: theological decision and doctrine realignment
  rationale: The verbal clause is easier to understand while preserving the return image and its ambiguity.
translation_notes:
  risk_flags:
  - risk: Modern readers may find the singular collective phrase “our soul” unusual.
    mitigation: It is retained because the Greek presents the community as having one collective soul.
  - risk: “Turns back” may not immediately communicate repentance.
    mitigation: The footnote gives the penitential alternative without resolving the main text’s ambiguity.
