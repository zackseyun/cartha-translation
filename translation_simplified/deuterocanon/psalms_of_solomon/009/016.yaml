  preserved_meaning: God is asked to see his people and respond compassionately.
  reasoning_layer_used: source text and POB translation
  rationale: Supplying the implied object makes the appeal natural and clear in English.
- pob_phrase: because we are yours
  simplified_phrase: for we belong to you
  preserved_meaning: The people appeal to their relationship with God.
  reasoning_layer_used: POB translation
  rationale: “Belong to you” clearly expresses the possessive relationship.
- pob_phrase: do not withdraw your mercy from us, lest they attack us
  simplified_phrase: Do not take your mercy away from us; otherwise, they may attack us
  preserved_meaning: The speaker asks God to keep showing mercy because an attack is feared.
