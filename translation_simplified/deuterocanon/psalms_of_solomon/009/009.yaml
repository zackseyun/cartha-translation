translation:
  language: en
  text: Whoever does what is right[a] stores up life for himself with the Lord. And whoever does what is wrong is responsible for his soul in destruction.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “does righteousness”; this may also include doing justice.
    reason: lexical_alternative
  - marker: b
    text: “Soul” may also mean “life” or “self”; the final phrase may also mean that the person is responsible for his soul’s destruction or for himself in ruin.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: The one who does righteousness
  simplified_phrase: Whoever does what is right
  preserved_meaning: A person’s righteous action is in view without implying a settled habit.
  reasoning_layer_used: POB lexical decisions for ὁ ποιῶν and δικαιοσύνην
  rationale: Common wording makes the moral action clear while the footnote retains “righteousness” and “justice.”
- pob_phrase: the one who does unrighteousness
  simplified_phrase: whoever does what is wrong
  preserved_meaning: The second action remains the direct moral opposite of doing what is right.
  reasoning_layer_used: POB lexical decision for ἀδικίαν
  rationale: The wording clarifies the contrast without narrowing it to social injustice.
- pob_phrase: is himself responsible for his soul in destruction
  simplified_phrase: is responsible for his soul in destruction
  preserved_meaning: The wrongdoer remains answerable for his own soul in relation to destruction.
  reasoning_layer_used: POB theological decision on moral consequence and agency
  rationale: Removing the awkward reflexive produces natural English without adding a broader claim of personal agency.
translation_notes:
  risk_flags:
  - risk: “What is right” may sound less theological than “righteousness.”
    mitigation: The footnote preserves the source term and its justice nuance.
  - risk: The final clause allows more than one relation between the soul and destruction.
    mitigation: The main text remains broad, and the footnote records the principal alternatives.
