translation:
  language: en
  text: Our souls have the choice and power to do what is right or wrong with our hands.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Our deeds are within the choice and power of our soul
  simplified_phrase: Our souls have the choice and power
  preserved_meaning: Our inner selves have the capacity to choose and control our moral actions.
  reasoning_layer_used: POB theological decision on human moral agency
  rationale: The active wording clearly keeps our deeds under the soul’s moral agency rather than treating the soul as merely a location.
- pob_phrase: to do righteousness and unrighteousness
  simplified_phrase: to do what is right or wrong
  preserved_meaning: Human beings can perform either righteous or unrighteous actions.
  reasoning_layer_used: POB lexical decisions for δικαιοσύνη and ἀδικία
  rationale: Common moral terms make the contrast immediately understandable without weakening it.
- pob_phrase: with the works of our hands
  simplified_phrase: with our hands
  preserved_meaning: Inner moral choices are carried out through concrete human actions.
  reasoning_layer_used: POB lexical decision for ἔργοις χειρῶν ἡμῶν
  rationale: The shorter phrase avoids circular wording while preserving the concrete image of hands acting.
translation_notes:
  risk_flags:
  - risk: The plural “souls” makes the collective Greek singular distributive in English.
