translation:
  language: en
  text: Their wealth spread across the whole land,[a] and their glory[b] reached earth’s farthest limits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “across the whole earth.” The Greek word can mean either “land” or “earth.”
    reason: lexical_alternative
  - marker: b
    text: “Glory” may also mean their honor or renown.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: was spread throughout all the land
  simplified_phrase: spread across the whole land
  preserved_meaning: Their wealth became widespread throughout the territory.
  reasoning_layer_used: Lexical decision for διεδόθη and theological decision on γῆ
  rationale: The active-sounding English is more natural while preserving the Greek passive sense of wide distribution.
- pob_phrase: to the end of the earth
  simplified_phrase: earth’s farthest limits
  preserved_meaning: Their glory extended as far as the world’s most distant places.
  reasoning_layer_used: Lexical decision for ἕως ἐσχάτου τῆς γῆς
  rationale: This keeps the source image of extreme worldwide reach in clearer modern English.
- pob_phrase: their glory
  simplified_phrase: their glory
  preserved_meaning: The wording allows honor, reputation, or splendor without choosing only one.
  reasoning_layer_used: Lexical decision for δόξα
  rationale: The key biblical term remains because a narrower replacement would erase its documented range.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “glory” only as visible splendor.
    mitigation: The footnote preserves the possible senses of honor and renown.
  - risk: Using “land” first and “earth” second may seem inconsistent.
    mitigation: The distinction preserves POB’s source-driven poetic movement from regional to worldwide extent.
