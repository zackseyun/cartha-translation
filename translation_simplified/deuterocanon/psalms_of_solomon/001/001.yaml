translation:
  language: en
  text: I cried out to the Lord when suffering pushed me to the limit,[a] and to God when sinners attacked me.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “to the end” and may mean that the suffering was complete, extreme, or continual.
    reason: lexical_alternative
  - marker: b
    text: The difficult Greek verb may instead mean that sinners “came upon me” or took some other hostile action.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: when I was afflicted to the end
  simplified_phrase: when suffering pushed me to the limit
  preserved_meaning: The speaker endured affliction that reached an extreme or prolonged limit.
  reasoning_layer_used: POB lexical decision for ἐν τῷ θλίβεσθαί με and εἰς τέλος
  rationale: The natural English image keeps both the passive suffering and the force of “to the end.”
- pob_phrase: to God when sinners attacked
  simplified_phrase: and to God when sinners attacked me
  preserved_meaning: The cry was directed to God during hostile action by sinners against the speaker.
  reasoning_layer_used: POB lexical decision for ἐν τῷ ἐπιδέσθαι and ἁμαρτωλούς
  rationale: Adding “and” and “me” makes the parallel relationship and target clear without changing the probable sense.
- pob_phrase: to the Lord ... to God
  simplified_phrase: to the Lord ... and to God
  preserved_meaning: Both divine titles remain in the verse’s parallel address.
  reasoning_layer_used: POB theological decision on the double divine address
  rationale: The added conjunction clarifies the sentence while preserving both titles.
