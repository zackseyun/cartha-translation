simplification_decisions:
- pob_phrase: grumbling and faintheartedness
  simplified_phrase: grumbling or losing heart
  preserved_meaning: The prayer rejects both resentful complaint and loss of courage.
  reasoning_layer_used: POB lexical decisions for γογγυσμόν and ὀλιγοψυχίαν
  rationale: “Losing heart” expresses the psychological force more naturally than “faintheartedness.”
- pob_phrase: in affliction
  simplified_phrase: in my distress
  preserved_meaning: The speaker asks for help while under painful pressure.
  reasoning_layer_used: POB lexical decision for ἐν θλίψει
  rationale: “Distress” is common English while retaining the sense of affliction.
- pob_phrase: Keep ... far from me
  simplified_phrase: keep me far from
  preserved_meaning: The spatial image asks God to make these responses distant from the speaker.
  reasoning_layer_used: POB lexical decision for μάκρυνον ἀπʼ ἐμοῦ
  rationale: Reversing the construction makes it natural without losing the distance image.
