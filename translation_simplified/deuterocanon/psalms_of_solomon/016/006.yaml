translation:
  language: en
  text: O God, do not take away your mercy from me or the memory of you from my heart until I die.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Do not withdraw your mercy from me
  simplified_phrase: do not take away your mercy from me
  preserved_meaning: The speaker asks God not to remove his mercy.
  reasoning_layer_used: The lexical decision for ἀποστήσῃς lists “take away” as a valid alternative.
  rationale: “Take away” is more familiar than “withdraw” while retaining the same request.
- pob_phrase: the remembrance of you
  simplified_phrase: the memory of you
  preserved_meaning: The speaker asks that awareness and devotion toward God remain in his heart.
  reasoning_layer_used: The lexical decision for μνήμην περὶ σοῦ permits “the memory of you.”
  rationale: “Memory” is common modern English and keeps remembrance directed toward God.
- pob_phrase: until death
  simplified_phrase: until I die
  preserved_meaning: The prayer extends through the speaker’s remaining lifetime.
  reasoning_layer_used: The lexical rationale identifies ἕως θανάτου as a straightforward temporal phrase.
  rationale: The personal clause states the same endpoint more naturally.
translation_notes:
  risk_flags:
  - risk: “Memory” could be heard as mental recall alone.
    mitigation: Keeping the biblical image “from my heart” preserves the wider sense of inner devotion.
