simplification_decisions:
- pob_phrase: When my soul was departing from the Lord
  simplified_phrase: When my soul was moving away from the Lord
  preserved_meaning: The speaker’s soul was becoming separated from the Lord.
  reasoning_layer_used: POB lexical and theological decisions on ἀπὸ Κυρίου
  rationale: “Moving away” states relational separation clearly without adding gradualness or lack of intent.
- pob_phrase: I almost slipped in the descent of sleep
  simplified_phrase: I nearly slipped under sleep’s downward pull
  preserved_meaning: The speaker nearly slipped while sleep exerted a downward, sinking force.
  reasoning_layer_used: POB lexical decisions on ὠλίσθησα and ἐν καταφορᾷ ὕπνου
  rationale: This keeps slipping and sleep’s descent distinct while making the image natural in English.
