translation:
  language: en
  text: When my soul was moving away from the Lord, I nearly slipped under sleep’s downward pull.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The opening may also be read, “When my soul gathered itself,” or, “When my soul was apart from the Lord.”
