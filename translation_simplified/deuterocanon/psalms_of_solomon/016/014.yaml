translation:
  language: en
  text: If a person is corrected through the ruin he suffers,[a] your testing comes in his body and in poverty.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek of this clause is difficult; it could also mean, “If a life is corrected under the power of its ruin.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: If a person is rebuked by means of his ruin
  simplified_phrase: If a person is corrected through the ruin he suffers
  preserved_meaning: The person’s ruin serves as the means of corrective rebuke.
  reasoning_layer_used: POB lexical decisions and doctrine-realignment revision
  rationale: “Corrected through” expresses the instrumental and corrective sense in natural English.
- pob_phrase: your testing is in his flesh and in poverty
  simplified_phrase: your testing comes in his body and in poverty
  preserved_meaning: The testing occurs bodily and amid material poverty without specifying that it consists of suffering.
  reasoning_layer_used: POB lexical decisions for δοκιμασία, σάρξ, and πενίᾳς
  rationale: “Comes in his body” keeps the bodily reference while avoiding an unsupported active claim.
interpretive_expansions:
- pob_phrase: his ruin
  rendering: the ruin he suffers
  claim: The ruin is something the person undergoes.
  evidence:
  - The possessive “his ruin” links the ruin to the person.
  - The POB makes ruin the means by which the person is rebuked.
  confidence: moderate
  alternatives_preserved:
  - his ruin
  - the power of his ruin
