translation:
  language: en
  text: But make my soul firm with favor and gladness. When you strengthen my soul, what has been given will be enough for me.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: establish my soul
  simplified_phrase: make my soul firm
  preserved_meaning: The prayer asks for the inner person to be made stable and secure.
  reasoning_layer_used: The lexical decision for στήρισον identifies its stabilizing sense and distinguishes it from the next verb.
  rationale: “Make firm” expresses the concrete sense more clearly than “establish.”
- pob_phrase: when you strengthen my soul, what has been given will be enough for me
  simplified_phrase: When you strengthen my soul, what has been given will be enough for me
  preserved_meaning: God’s strengthening makes the unspecified provision sufficient for the speaker.
  reasoning_layer_used: The lexical decisions preserve the temporal clause, the future sense of sufficiency, and the openness of τὸ δοθέν.
  rationale: A separate sentence makes the relationship between strengthening and sufficiency easier to follow.
translation_notes:
  risk_flags:
  - risk: “Make firm” could sound physical rather than inward.
    mitigation: Retaining “my soul” clearly locates the request in the inner person.
