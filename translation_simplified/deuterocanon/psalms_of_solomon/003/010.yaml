- pob_phrase: every devout man
  simplified_phrase: every man who is devoted to him
  preserved_meaning: The wording keeps the explicitly masculine and distributive sense while expressing personal godliness plainly.
  reasoning_layer_used: POB lexical decisions for πᾶν ἄνδρα and ὅσιον
  rationale: The adjective “devout” becomes a natural descriptive clause without neutralizing “man.”
- pob_phrase: and his house
  simplified_phrase: and he cleanses that man’s house as well
  preserved_meaning: The Lord’s cleansing extends to both the man and his house.
  reasoning_layer_used: Applied revision preserving the οἶκος lexical chain in verses 7–10
  rationale: Repeating the verb clarifies its scope while retaining the important word “house.”
