simplification_decisions:
- pob_phrase: is attentive
  simplified_phrase: stays alert
  preserved_meaning: The righteous man remains watchful and attentive.
  reasoning_layer_used: Lexical decision for προσέχων
  rationale: “Stays alert” expresses the ongoing watchful posture in common English.
- pob_phrase: will vindicate the Lord / will declare the Lord just
  simplified_phrase: will affirm that the Lord is just
  preserved_meaning: He acknowledges and upholds the Lord’s justice rather than making God righteous.
  reasoning_layer_used: Lexical and theological decisions for δικαιώσει
  rationale: “Affirm that the Lord is just” preserves the justice theme without the opacity of “vindicate.”
- pob_phrase: he falls, and he looks to see
  simplified_phrase: When he falls, he looks to see
  preserved_meaning: Falling characteristically leads the righteous man to look toward God’s action.
  reasoning_layer_used: Applied grammatical revision on the gnomic aorist
  rationale: The recast makes the relationship between the actions clear while retaining both ideas.
