translation:
  language: en
  text: Your kindness comes to Israel like a generous gift. You keep your eyes on them, and none of them will lack what they need.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “there will be no lack among them.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Your kindness is upon Israel like a rich gift
  simplified_phrase: Your kindness comes to Israel like a generous gift
  preserved_meaning: God’s active kindness reaches Israel as a valuable and abundant gift.
  reasoning_layer_used: Applied revisions and the corrected lexical reading of δόματος
  rationale: “Comes to” and “generous” express the comparison in clear modern English without reviving the rejected roof image.
- pob_phrase: your eyes look upon them
  simplified_phrase: You keep your eyes on them
  preserved_meaning: God looks attentively at the people of Israel.
  reasoning_layer_used: POB lexical decision for ἐπιβλέποντες
  rationale: The natural English idiom keeps the source’s visual image and attentive force.
- pob_phrase: none of them will be lacking
  simplified_phrase: none of them will lack what they need
  preserved_meaning: No member of Israel will be in want under God’s care.
  reasoning_layer_used: POB theological decision on the final clause
  rationale: Naming what is lacked makes the provision sense immediately understandable.
interpretive_expansions:
- pob_phrase: none of them will be lacking
  rendering: none of them will lack what they need
  claim: The lack concerns needed provision rather than personal deficiency.
  evidence:
  - The POB lexical rationale explains the clause as none among Israel being in want.
  - The POB theological rationale connects the clause with provision under God’s care.
  confidence: high
  alternatives_preserved:
  - there will be no lack among them
translation_notes:
