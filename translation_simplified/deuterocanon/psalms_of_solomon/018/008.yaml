simplification_decisions:
- pob_phrase: under the rod of discipline
  simplified_phrase: under the correcting rod
  preserved_meaning: The rod remains a concrete image of corrective discipline.
  reasoning_layer_used: Lexical decisions for ῥάβδον and παιδείας
  rationale: This wording explains the rod’s purpose without removing the image.
- pob_phrase: in wisdom of spirit
  simplified_phrase: with spiritual wisdom
  preserved_meaning: The phrase still presents wisdom characterized by spirit without requiring a reference to the Holy Spirit.
  reasoning_layer_used: Lexical and theological decisions for πνεύματος
  rationale: The adjective makes the difficult Greek construction natural in modern English.
- pob_phrase: in wisdom of spirit and righteousness and strength
  simplified_phrase: with spiritual wisdom, righteousness, and strength
  preserved_meaning: The three qualities remain distinct and parallel.
  reasoning_layer_used: Latest revision pass and lexical decisions
  rationale: A simple list is easier to follow than the compressed genitive sequence.
