simplification_decisions:
- pob_phrase: in works of righteousness
  simplified_phrase: to do what is right
  preserved_meaning: The men are guided into concrete actions that are morally right.
  reasoning_layer_used: POB lexical and theological decisions on δικαιοσύνη
  rationale: This states the ethical action plainly while keeping righteousness as the controlling sense.
- pob_phrase: in the fear of God
  simplified_phrase: with reverent fear of God
  preserved_meaning: Their conduct is shaped by awe-filled regard for God, not mere fright.
  reasoning_layer_used: POB lexical rationale for φόβῳ θεοῦ
  rationale: “Reverent” clarifies the biblical idiom without removing the force of fear.
- pob_phrase: to set them all before the Lord
  simplified_phrase: to place them all before the Lord
  preserved_meaning: They are placed or established in relation to the Lord and in his presence.
  reasoning_layer_used: POB lexical decisions on καταστῆσαι and ἐνώπιον Κυρίου
  rationale: “Place” is natural English and avoids adding the directional movement implied by “bring.”
interpretive_expansions:
- pob_phrase: in the fear of God
  rendering: with reverent fear of God
  claim: The fear described includes reverent awe toward God.
  evidence:
  - The POB rationale preserves this as a biblical idiom rather than mere emotion.
  - The immediate clause presents this fear as shaping righteous conduct.
  confidence: high
  alternatives_preserved:
  - in the fear of God
  - with the fear of God
