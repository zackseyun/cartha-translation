translation:
  language: en
  text: You turn your ears to a poor man who pleads in hope. Your judgments extend over the whole earth and are carried out with mercy.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Your ears heed the plea
  simplified_phrase: You turn your ears to ... who pleads
  preserved_meaning: God gives responsive attention while the image of ears remains.
  reasoning_layer_used: Greek source and lexical decision for ἐπακούει
  rationale: This avoids the awkward phrase “ears heed” without reducing the verb to mere hearing.
- pob_phrase: the plea of the poor in hope
  simplified_phrase: a poor man who pleads in hope
  preserved_meaning: The poor person remains a singular man whose urgent request is made with trusting expectation.
  reasoning_layer_used: Lexical decisions for δέησιν, πτωχοῦ, and ἐν ἐλπίδι
  rationale: A direct clause makes the relationship clear while restoring the source-driven singular masculine form.
- pob_phrase: your judgments are over all the earth with mercy
  simplified_phrase: Your judgments extend over the whole earth and are carried out with mercy
  preserved_meaning: God’s many judicial acts reach everywhere and remain joined with mercy.
  reasoning_layer_used: Lexical decisions for κρίματα, ἐπὶ πᾶσαν τὴν γῆν, and μετὰ ἐλέους
  rationale: The revision preserves the plural “judgments” while clarifying their worldwide scope and merciful manner.
translation_notes:
  risk_flags:
