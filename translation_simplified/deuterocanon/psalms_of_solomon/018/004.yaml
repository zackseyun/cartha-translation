  preserved_meaning: The Israelites are named as sons, maintaining the link to the singular son image.
  reasoning_layer_used: POB lexical decision for υἱοὺς Ἰσραήλ
  rationale: The phrase is retained because replacing “sons” would weaken the verse’s deliberate echo.
- pob_phrase: Your discipline is upon us as upon a firstborn, an only son
  simplified_phrase: You discipline us as you would a firstborn—an only son
