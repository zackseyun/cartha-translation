translation:
  language: en
  text: God’s holy things were being looted,[a] as if no heir existed to rescue and reclaim them.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Holy things” may also mean “sacred things” or, less likely here, “the sanctuary.”
    reason: lexical_alternative
  - marker: b
    text: Or “redeem them”; the Greek word carries the sense of deliverance and reclamation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: were being plundered
  simplified_phrase: were being looted
  preserved_meaning: God’s holy things were undergoing continued forcible seizure.
  reasoning_layer_used: Lexical decision for διηρπάζοντο
  rationale: “Looted” is more immediate common English while retaining the ongoing despoiling.
- pob_phrase: as though there were no heir
  simplified_phrase: as if no heir existed
  preserved_meaning: The plunderers acted as if such an heir did not exist.
  reasoning_layer_used: Lexical decision for ὡς μὴ ὄντος and κληρονόμου
  rationale: The recast clause is easier to follow while preserving the shocking comparison and the term “heir.”
- pob_phrase: to redeem them
  simplified_phrase: to rescue and reclaim them
  preserved_meaning: The heir would deliver God’s holy things and recover them.
  reasoning_layer_used: Lexical decision for λυτρουμένου
  rationale: The paired wording explains the redemptive force without reducing it to rescue alone.
interpretive_expansions:
- pob_phrase: to redeem them
  rendering: to rescue and reclaim them
  claim: Redemption here includes both deliverance and recovery of what was taken.
  evidence:
  - The lexical rationale says λυτρόομαι carries a deliverance or ransom sense.
  - The POB rationale specifically notes the idea of reclaiming by deliverance.
  confidence: high
  alternatives_preserved:
  - redeem them
  - redeeming them
translation_notes:
  risk_flags:
  - risk: “Holy things” remains broad and could refer to sacred objects or the sanctuary.
    mitigation: The footnote preserves the documented alternatives without forcing one.
  - risk: “Rescue and reclaim” may sound like two separate actions rather than one redemptive act.
    mitigation: The footnote retains “redeem” as the compact lexical alternative.
