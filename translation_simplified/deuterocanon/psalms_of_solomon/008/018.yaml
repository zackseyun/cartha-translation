translation:
  language: en
  text: The rulers of the land[a] came to meet him with joy. They said, “Your journey is blessed.[b] Come! Enter in peace.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The land” may also mean “the earth,” but the local political sense fits the context better.
    reason: lexical_alternative
  - marker: b
    text: This may also mean “Your journey is welcome” or “Your journey is favorable.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: met him with joy
  simplified_phrase: came to meet him with joy
  preserved_meaning: The rulers joyfully approached to receive him.
  reasoning_layer_used: The lexical decision notes that the verb can mean going out to meet someone.
  rationale: The fuller phrase makes the welcoming action immediately clear.
- pob_phrase: Blessed is your way
  simplified_phrase: Your journey is blessed
  preserved_meaning: The rulers pronounce his course favored while welcoming him.
  reasoning_layer_used: The lexical decisions allow “journey” for ὁδός while the final POB retains “blessed.”
  rationale: Ordinary word order and “journey” make the statement easier to understand.
- pob_phrase: Come, enter with peace
  simplified_phrase: Come! Enter in peace.
  preserved_meaning: The rulers invite him to enter under peaceful welcome.
  reasoning_layer_used: The lexical decisions preserve both the invitation and the command to enter in peace.
  rationale: Two short sentences keep both imperatives without awkward repetition.
