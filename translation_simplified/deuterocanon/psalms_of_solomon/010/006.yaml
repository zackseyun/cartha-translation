translation:
  language: en
  text: Our Lord is righteous and holy in the judgments he makes forever. Israel will joyfully praise the name of the Lord.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Righteous and holy is our Lord
  simplified_phrase: Our Lord is righteous and holy
  preserved_meaning: The Lord possesses the distinct qualities of righteousness and holiness.
  reasoning_layer_used: POB theological decision and applied revision
  rationale: Subject-first order improves clarity while preserving both divine qualities.
- pob_phrase: in his judgments forever
  simplified_phrase: in the judgments he makes forever
  preserved_meaning: The Lord is righteous and holy in his judicial acts, with “forever” kept beside those acts.
  reasoning_layer_used: POB lexical decisions for κρίμασιν and εἰς τὸν αἰῶνα
  rationale: The verbal clause clarifies “judgments” without relocating “forever.”
- pob_phrase: will praise the name of the Lord with gladness
  simplified_phrase: will joyfully praise the name of the Lord
  preserved_meaning: Israel will praise the Lord’s reverential and covenantally significant name with joy.
  reasoning_layer_used: POB lexical decisions for αἰνέσει, τῷ ὀνόματι Κυρίου, and ἐν εὐφροσύνῃ
  rationale: The adverb expresses the joyful manner directly while retaining “the name of the Lord.”
translation_notes:
