translation:
  language: en
  text: For he has made the paths of righteous people straight. Even while disciplining them, he will not make their paths crooked.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the ways of the righteous
  simplified_phrase: the paths of righteous people
  preserved_meaning: The righteous are pictured as walking moral paths.
  reasoning_layer_used: POB lexical decisions for ὁδοὺς and δικαίων
  rationale: “Paths” keeps the concrete image, while “righteous people” is clearer to new readers.
- pob_phrase: he will not pervert them
  simplified_phrase: he will not make their paths crooked
  preserved_meaning: God does not distort the paths that he has made straight.
  reasoning_layer_used: POB lexical rationale, theological decision, and applied revision
  rationale: “Make crooked” expresses the straight-versus-crooked contrast in natural English.
- pob_phrase: in discipline
  simplified_phrase: Even while disciplining them
  preserved_meaning: God does not distort righteous paths during corrective training.
  reasoning_layer_used: POB lexical and theological decisions for ἐν παιδείᾳ
  rationale: The clause is recast to show plainly that discipline is the setting of God’s action.
interpretive_expansions:
- pob_phrase: in discipline
  rendering: Even while disciplining them
  claim: The discipline is God’s corrective treatment of the righteous people.
  evidence:
