simplification_decisions:
- pob_phrase: the pious
  simplified_phrase: the faithful
  preserved_meaning: The term identifies people marked by piety and covenant loyalty.
  reasoning_layer_used: POB lexical decision for ὅσιοι and applied revision
  rationale: The attested alternative is clearer to modern readers while preserving the group’s covenant faithfulness.
- pob_phrase: in the assembly of the people
  simplified_phrase: when the people gather
  preserved_meaning: The thanksgiving takes place publicly among the gathered community.
  reasoning_layer_used: POB lexical decision for ἐκκλησίᾳ λαοῦ
  rationale: The clause form helps readers picture the public gathering.
- pob_phrase: in the gladness of Israel
  simplified_phrase: amid Israel’s joy
  preserved_meaning: God’s mercy is situated within Israel’s communal gladness.
  reasoning_layer_used: POB lexical rationale for ἐν εὐφροσύνῃ Ἰσραήλ and grounding review
  rationale: “Amid” avoids imposing strict simultaneity while expressing the joyful setting naturally.
interpretive_expansions:
- pob_phrase: in the gladness of Israel
  rendering: amid Israel’s joy
  claim: Israel’s communal joy forms the setting of God’s mercy toward the poor.
  evidence:
  - The Greek phrase links gladness directly with Israel.
  - The POB rationale describes a scene of communal joy.
  confidence: high
  alternatives_preserved:
