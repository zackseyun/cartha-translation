translation_notes:
  risk_flags:
  - risk: “Sincerely” may sound narrower than the full moral-religious nuance of “in truth.”
    mitigation: It preserves genuine love without expanding the phrase into a broader doctrinal claim.
  - risk: “Following” may make the commandments and law sound more closely merged than the Greek clauses do.
    mitigation: The conjunction keeps them as distinct expressions while preserving their close relationship.
