translation:
  language: en
  text: The Lord is faithful to those who sincerely love him, who endure his discipline,[a] and who live uprightly by following his commandments and the law he commanded us so that we may live.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: His “discipline” includes instruction, training, and correction.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: love him in truth
  simplified_phrase: sincerely love him
  preserved_meaning: Their love is genuine and morally true, not merely claimed.
  reasoning_layer_used: POB lexical decision for ἐν ἀληθείᾳ
  rationale: This wording makes genuine love immediately understandable while preserving its moral force.
- pob_phrase: walk in the righteousness of his commandments
  simplified_phrase: live uprightly by following his commandments
  preserved_meaning: Their conduct is righteous because it conforms to God's commands.
  reasoning_layer_used: POB lexical decisions for πορευομένοις, δικαιοσύνῃ, and προσταγμάτων
  rationale: The wording states the conduct metaphor plainly while retaining uprightness and obedience.
- pob_phrase: in the law that he commanded us for our life
  simplified_phrase: and the law he commanded us so that we may live
  preserved_meaning: The law remains distinct from the commandments and is intended for the community's life.
  reasoning_layer_used: POB lexical decisions for νόμῳ and εἰς ζωὴν ἡμῶν, plus grounding review
  rationale: The clause preserves both expressions without adding that God commanded the people “to follow” the law.
interpretive_expansions:
- pob_phrase: for our life
  rendering: so that we may live
  claim: The law is presented as serving the community's life.
  evidence:
