translation:
  language: en
  text: They did not remember God. They forgot that he always knows how people live and that he knows the secrets of the heart even before they come to be.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek pictures these secrets as the heart’s inner rooms—what is hidden within.
    reason: lexical_alternative
  - marker: b
    text: Or “before they arise” or “before they happen”; the Greek wording is broad.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And they did not remember God, that
  simplified_phrase: They did not remember God. They forgot that
  preserved_meaning: Their failure to remember God includes forgetting the truth about his knowledge.
  reasoning_layer_used: POB syntax and lexical decision for ἐμνήσθησαν
  rationale: Two sentences make the relationship clear without weakening the moral force of “remember.”
- pob_phrase: the ways of men are known before him continually
  simplified_phrase: he always knows how people live
  preserved_meaning: God constantly knows every person’s conduct.
  reasoning_layer_used: POB lexical decisions for ὁδοί, γνωσταί, ἐνώπιον αὐτοῦ, and διὰ παντός
  rationale: The rewrite states the biblical moral sense of “ways” in ordinary English.
- pob_phrase: the secrets of the heart before they come to be
  simplified_phrase: the secrets of the heart even before they come to be
  preserved_meaning: God knows hidden inner realities before they arise, without narrowing what those realities are.
  reasoning_layer_used: POB applied revision and theological decision on divine foreknowledge
  rationale: “Even” highlights the clause’s force while its broad wording and ambiguity remain intact.
