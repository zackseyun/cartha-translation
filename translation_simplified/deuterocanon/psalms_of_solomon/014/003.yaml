translation:
  language: en
  text: Their planting is rooted forever. As long as heaven endures, they will not come to an end,[a] because Israel is the portion and inheritance that belongs to God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare verb may also mean “they will not be cut off.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: they will not fail
  simplified_phrase: they will not come to an end
  preserved_meaning: They will continue to exist rather than collapse or cease.
  reasoning_layer_used: Lexical decision and adjudicated revision
  rationale: “Come to an end” avoids the misleading modern sense of personal failure.
- pob_phrase: all the days of heaven
  simplified_phrase: as long as heaven endures
  preserved_meaning: Their stability lasts throughout the full span of the present heavenly order.
  reasoning_layer_used: Lexical rationale and cultural footnote
  rationale: The wording explains the elevated idiom while preserving heaven as the measure of duration.
- pob_phrase: the portion and inheritance of God
  simplified_phrase: the portion and inheritance that belongs to God
  preserved_meaning: Israel is identified as God's allotted covenant possession.
  reasoning_layer_used: Theological decision on corporate covenant identity
  rationale: The added clause makes the possessive relationship clear without expanding the doctrine.
interpretive_expansions:
- pob_phrase: all the days of heaven
  rendering: as long as heaven endures
  claim: The phrase describes the full duration of the present heavenly order.
  evidence:
  - The POB cultural note explicitly gives this temporal sense.
  - The lexical rationale says the idiom expresses the full span of the present order.
  confidence: high
  alternatives_preserved:
  - all the days of heaven
  - all the days under heaven
translation_notes:
  risk_flags:
  - risk: The rare verb can mean either coming to an end or being cut off.
    mitigation: The main text follows the enduring-stability sense, while the footnote preserves the lexical alternative.
  - risk: “Their planting” remains unusual in modern English.
    mitigation: It is retained to preserve the agricultural image and avoid deciding whether it means the people or their settled estate.
