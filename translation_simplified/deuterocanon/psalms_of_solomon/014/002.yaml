  preserved_meaning: These are people marked by holiness and devotion to the Lord.
  reasoning_layer_used: POB lexical decision for ὅσιοι and Κυρίου
  rationale: The possessive form is more natural English while retaining the chosen term “holy ones.”
- pob_phrase: the paradise of the Lord, the trees of life, are his holy ones
  simplified_phrase: They are his paradise; they are the trees of life.
  preserved_meaning: The holy ones are poetically identified with both the Lord’s paradise and the plural trees of life.
  reasoning_layer_used: POB theological decision on the identificational metaphor
  rationale: Two short clauses clarify the metaphor without turning it into possession or location.
