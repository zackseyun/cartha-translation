translation:
  language: en
  text: Therefore, their inheritance is the realm of the dead,[a] darkness, and destruction. They will not be found on the day when mercy is shown to the righteous.[b] But the Lord’s holy people will inherit life with joy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word is Hades, the realm of the dead; it does not necessarily mean “hell” in its later, fuller sense.
    reason: cultural_note
  - marker: b
    text: Or, “on the day when the righteous show mercy.” The Greek can be understood more than one way.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Hades
  simplified_phrase: the realm of the dead
  preserved_meaning: The destination remains the underworld of the dead without importing the fuller meaning of hell.
  reasoning_layer_used: POB lexical and theological decisions on ᾅδης
  rationale: The familiar explanation replaces an opaque transliteration in the main text.
- pob_phrase: the holy ones of the Lord
  simplified_phrase: the Lord’s holy people
  preserved_meaning: The group remains people marked by holiness and belonging to the Lord.
  reasoning_layer_used: POB lexical decision and latest revision for ὅσιοι
  rationale: The possessive form and collective noun sound more natural in common English.
- pob_phrase: in gladness
  simplified_phrase: with joy
  preserved_meaning: They receive their inherited life in a state of rejoicing.
  reasoning_layer_used: POB lexical decision for ἐν εὐφροσύνῃ
  rationale: “With joy” is clearer everyday English while retaining the elevated tone.
interpretive_expansions:
- pob_phrase: in the day of mercy for the righteous
  rendering: on the day when mercy is shown to the righteous
  claim: The righteous are the recipients of mercy on that day.
  evidence:
  - The POB theological decision selects the righteous as beneficiaries of mercy.
  - The contrast with the Lord’s holy people inheriting life supports this reading.
  confidence: moderate
  alternatives_preserved:
  - on the day when the righteous show mercy
translation_notes:
  risk_flags:
