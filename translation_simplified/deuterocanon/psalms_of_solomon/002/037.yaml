translation:
  language: en
  text: Bless God, all you who revere the Lord with understanding. For the Lord’s mercy rests on those who fear him, along with judgment.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean “with justice.” The Greek does not fully explain how mercy and judgment are related.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: you who fear the Lord with understanding
  simplified_phrase: all you who revere the Lord with understanding
  preserved_meaning: The command directly addresses people whose reverence for the Lord is informed and knowing.
  reasoning_layer_used: Lexical decisions for οἱ φοβούμενοι and ἐν ἐπιστήμῃ
  rationale: “Revere” clarifies the biblical sense of fear while “with understanding” preserves its informed character.
- pob_phrase: the mercy of the Lord is upon those who fear him
  simplified_phrase: the Lord’s mercy rests on those who fear him
  preserved_meaning: The Lord extends mercy to those who fear him.
  reasoning_layer_used: Lexical decision for ἔλεος
  rationale: “Rests on” expresses the image of mercy being upon them in natural English.
- pob_phrase: with judgment
  simplified_phrase: along with judgment
  preserved_meaning: The Lord’s mercy remains juxtaposed with judgment without defining their exact relation.
  reasoning_layer_used: Theological decision on μετὰ κρίματος
  rationale: “Along with” makes the compressed connection readable without resolving its ambiguity.
translation_notes:
  risk_flags:
  - risk: “Along with judgment” may suggest a closer connection than the compressed Greek explicitly defines.
    mitigation: The footnote preserves “justice” and states that the precise relation remains unclear.
