translation:
  language: en
  text: As they themselves used to do, they put their sinful deeds on public display in broad daylight. The daughters of Jerusalem were profane according to your judgment.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “were defiled according to your judgment.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Just as they themselves used to do
  simplified_phrase: As they themselves used to do
  preserved_meaning: Their conduct was repeated in the past, and the emphatic “themselves” remains.
  reasoning_layer_used: Applied grammar revision on αὐτοί and the imperfect ἐποίουν
  rationale: This keeps the habitual sense without implying a deliberately formed habit.
- pob_phrase: displayed their iniquities before the sun
  simplified_phrase: put their sinful deeds on public display in broad daylight
  preserved_meaning: They openly exhibited concrete acts of serious wrongdoing.
  reasoning_layer_used: Lexical decisions for παρεδειγμάτισαν, ἀδικίας, and ἀπέναντι τοῦ ἡλίου
  rationale: Common wording preserves both public exposure and the daylight image.
- pob_phrase: were profane according to your judgment
  simplified_phrase: were profane according to your judgment
  preserved_meaning: Their profane condition remains linked to God's judgment without specifying the exact relation.
  reasoning_layer_used: Lexical decisions for βέβηλοι and κατὰ τὸ κρίμα σου
  rationale: Retaining “profane” avoids asserting that they had previously been holy.
interpretive_expansions:
- pob_phrase: iniquities before the sun
  rendering: sinful deeds on public display in broad daylight
  claim: Their concrete wrong acts were openly exposed or exhibited.
  evidence:
  - The lexical audit identifies ἀδικίας as concrete wrongdoing and παρεδειγμάτισαν as public exhibition.
  - The phrase “before the sun” is audited as openly and publicly, naturally expressed as “in broad daylight.”
  confidence: high
