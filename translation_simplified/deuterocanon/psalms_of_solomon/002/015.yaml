translation:
  language: en
  text: Because they themselves defiled what was pure[a] through their filthy, immoral mixing[b], my belly and my innermost parts ache over these things.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “what was holy.”
    reason: lexical_alternative
  - marker: b
    text: The Greek literally says “mixing,” probably with a sexual or otherwise morally corrupt sense here.
    reason: cultural_note
simplification_decisions:
- pob_phrase: in the filth of illicit mingling
  simplified_phrase: through their filthy, immoral mixing
  preserved_meaning: The wording keeps both the image of mixing and its morally defiling force.
  reasoning_layer_used: POB lexical decision for ἀναμίξεως and the source-grounded correction of ῥύπῳ to “filth”
  rationale: Common words make the phrase understandable without erasing its source image.
- pob_phrase: My belly and my inward parts ache
  simplified_phrase: my belly and my innermost parts ache
  preserved_meaning: The bodily imagery and intense inner pain remain distinct and explicit.
  reasoning_layer_used: POB lexical decisions for κοιλία, σπλάγχνα, and πονῶ
  rationale: “Innermost parts” is clearer today while retaining the visceral image.
- pob_phrase: Because ... My belly
  simplified_phrase: Because ... my belly
  preserved_meaning: Their defilement remains the stated cause of the speaker’s pain.
  reasoning_layer_used: POB lexical decisions for ἀνθ’ ὧν and ἐπὶ τούτοις
  rationale: Joining the clauses removes a sentence fragment and makes the causal link immediate.
translation_notes:
  risk_flags:
