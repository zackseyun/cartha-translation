translation:
  language: en
  text: They made the sons of Jerusalem objects of ridicule, treating them like prostitutes within the city.[a] Anyone passing by would enter in broad daylight. They mocked Jerusalem’s sons through their lawless deeds.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may be read more literally as “instead of prostitutes,” but the context points to a comparison in humiliation.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: a mockery
  simplified_phrase: objects of ridicule
  preserved_meaning: The sons became the targets of contempt and public humiliation.
  reasoning_layer_used: Lexical decision for εἰς ἐμπαιγμόν
  rationale: The plural wording makes the result clear while preserving the shame-focused sense.
- pob_phrase: like prostitutes within her
  simplified_phrase: treating them like prostitutes within the city
  preserved_meaning: Jerusalem’s sons suffered humiliation comparable to that associated with prostitutes.
  reasoning_layer_used: Lexical decision for ἀντὶ πορνῶν
  rationale: The recast clause clarifies the comparison, and “the city” identifies Jerusalem without an unclear pronoun.
- pob_phrase: they mocked them with their lawless deeds
  simplified_phrase: They mocked Jerusalem’s sons through their lawless deeds
  preserved_meaning: Their wicked conduct was the means of mocking the sons.
  reasoning_layer_used: Lexical decisions for ἐνέπαιζον and ταῖς ἀνομίαις αὐτῶν
  rationale: Naming Jerusalem’s sons removes an unclear pronoun while retaining both the mockery and its means.
