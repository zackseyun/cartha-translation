translation:
  language: en
  text: 'I saw it. Then I pleaded before the Lord: “Enough, Lord![a] Do not let your hand continue to weigh heavily on Israel through the nations’ attack.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “Be satisfied, Lord” or “Let this be enough, Lord.”
    reason: lexical_alternative
  - marker: b
    text: This may also be translated “through the nations’ invasion” or “by bringing the nations against Israel.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And I saw, and I entreated the face of the Lord and said
  simplified_phrase: I saw it. Then I pleaded before the Lord
  preserved_meaning: The speaker sees what happened and earnestly appeals in the Lord’s presence.
  reasoning_layer_used: POB lexical decision for ἐδεήθην τοῦ προσώπου Κυρίου
  rationale: This removes an opaque Semitic expression while retaining the earnest prayer before God.
- pob_phrase: Enough, Lord, of your hand weighing heavily on Israel
  simplified_phrase: Enough, Lord! Do not let your hand continue to weigh heavily on Israel
  preserved_meaning: The speaker urgently asks the Lord to end the judgment pressing upon Israel.
  reasoning_layer_used: POB lexical decisions for Ἱκάνωσον and the heavy-hand image
  rationale: The request is made explicit while the biblical image of God’s heavy hand remains.
- pob_phrase: by the attack of the nations
  simplified_phrase: through the nations’ attack
  preserved_meaning: The nations’ assault is the means through which Israel experiences the pressure.
  reasoning_layer_used: POB lexical decision and doctrine-realignment revision for ἐν ἐπαγωγῇ ἐθνῶν
  rationale: “Through” clearly preserves the instrumental force favored in the audit.
interpretive_expansions:
- pob_phrase: Enough, Lord
  rendering: Do not let your hand continue
  claim: The plea asks for the present affliction to cease.
  evidence:
  - The POB rationale says the imperative urgently requests that the affliction not continue.
  - The following heavy-hand clause identifies the affliction in view.
  confidence: high
  alternatives_preserved:
  - Be satisfied, Lord.
  - Let this be enough, Lord.
translation_notes:
  risk_flags:
