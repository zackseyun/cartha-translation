    mitigation: The main wording follows the POB rationale, while the footnote preserves the more literal alternatives.
  - risk: Replacing “the face of the Lord” removes the visible source-language idiom.
    mitigation: “Before the Lord” preserves its relational sense of pleading in God’s presence.
