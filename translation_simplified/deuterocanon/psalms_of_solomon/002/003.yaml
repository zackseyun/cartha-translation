translation:
  language: en
  text: because the sons of Jerusalem[a] made the Lord’s holy things unclean. By their lawless acts, they treated God’s offerings as if they were not holy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “children of Jerusalem.” The Greek explicitly says “sons.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: defiled the holy things of the Lord
  simplified_phrase: made the Lord’s holy things unclean
  preserved_meaning: Their actions defiled things set apart to the Lord.
  reasoning_layer_used: POB lexical decisions for ἐμίαναν and τὰ ἅγια Κυρίου
  rationale: This explains sacred defilement while preserving the ideas of holiness and uncleanness.
- pob_phrase: profaned the offerings of God
  simplified_phrase: treated God’s offerings as if they were not holy
  preserved_meaning: They treated sacred offerings as common rather than holy.
  reasoning_layer_used: POB lexical decisions for ἐβεβήλωσαν and τὰ δῶρα τοῦ θεοῦ
  rationale: This states the force of “profaned” in ordinary English without resolving the genitive.
- pob_phrase: with their lawless acts
  simplified_phrase: By their lawless acts
  preserved_meaning: Their concrete violations of God’s law were the means of profaning the offerings.
  reasoning_layer_used: POB lexical decision for ἐν ἀνομίαις
  rationale: Fronting the phrase makes the means of profanation immediately clear.
translation_notes:
  risk_flags:
  - risk: “Made unclean” could suggest ordinary dirt rather than sacred defilement.
    mitigation: “The Lord’s holy things” keeps the statement in a sacred setting.
  - risk: “God’s offerings” leaves the Greek genitive broad.
    mitigation: This preserves the POB ambiguity rather than asserting that the offerings were given to God.
