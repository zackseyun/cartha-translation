translation:
  language: en
  text: because he[a] treated him with contempt and dishonor. He did not consider that he himself was only a man, nor did he consider what the outcome would be.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek leaves the people referred to by “he” and “him” unnamed; the context must determine who they are.
    reason: source_note
  - marker: b
    text: Or “what would come afterward.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: despised him with dishonor
  simplified_phrase: treated him with contempt and dishonor
  preserved_meaning: He regarded the other person as nothing and subjected him to disgrace.
  reasoning_layer_used: POB lexical decisions for ἐξουδένωσεν and ἐν ἀτιμίᾳ
  rationale: The wording preserves both contempt and disgrace in natural English.
- pob_phrase: he did not consider that he was a man
  simplified_phrase: He did not consider that he himself was only a man
  preserved_meaning: The same subject failed to reckon with his own humanity and limitations.
  reasoning_layer_used: POB wording and lexical rationale for ἄνθρωπος
  rationale: The reflexive wording clarifies the clause without changing its grammatical subject.
- pob_phrase: afterward he did not consider
  simplified_phrase: nor did he consider what the outcome would be
  preserved_meaning: He failed to think about the later result or consequence.
  reasoning_layer_used: POB lexical decision for τὸ ὕστερον
  rationale: The complete clause expresses the audited sense of “the outcome” clearly.
interpretive_expansions:
- pob_phrase: that he was a man
  rendering: that he himself was only a man
  claim: The subject failed to account for his own human frailty and limitations.
  evidence:
