translation:
  language: en
  text: O God, with an upright heart I will declare that you are righteous.[a] Your judgments reveal your righteousness.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I will justify you” or “I will vindicate you.”
    reason: lexical_alternative
  - marker: b
    text: Or “justice.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I will declare you righteous
  simplified_phrase: I will declare that you are righteous
  preserved_meaning: The speaker openly acknowledges God's righteousness rather than making God righteous.
  reasoning_layer_used: Lexical decision for δικαιώσω
  rationale: Adding “that” makes the intended sense immediately clear while retaining the forensic force.
- pob_phrase: for in your judgments is your righteousness
  simplified_phrase: Your judgments reveal your righteousness
  preserved_meaning: God's righteous character is displayed in his acts of judgment.
  reasoning_layer_used: Lexical decisions for κρίμασιν and δικαιοσύνη
  rationale: The direct clause replaces an unnatural English construction without merging judgment and righteousness.
interpretive_expansions:
- pob_phrase: in your judgments is your righteousness
  rendering: Your judgments reveal your righteousness
  claim: God's judgments display his righteous character.
  evidence:
  - The lexical rationale says God's moral rectitude is displayed in his judgments.
  - The immediate clause directly connects God's judgments with his righteousness.
  confidence: high
  alternatives_preserved:
  - Your judgments show your justice.
translation_notes:
  risk_flags:
  - risk: “Declare that you are righteous” could sound as though the speaker has authority to judge God.
    mitigation: The wording presents the statement as acknowledgment, and the footnote preserves the lexical alternatives.
