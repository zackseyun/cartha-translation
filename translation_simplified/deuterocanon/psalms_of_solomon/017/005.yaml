  preserved_meaning: God selected David for kingship over Israel.
  reasoning_layer_used: Lexical decisions for ᾑρέτισω and βασιλέα ἐπʼ Ἰσραήλ
  rationale: The infinitive construction is more natural English while preserving David’s divine selection and rule.
- pob_phrase: concerning his offspring forever, that his kingdom would not fail before you
  simplified_phrase: that his descendants would continue forever and that his kingdom would never come to an end before you
  preserved_meaning: The oath concerns both David’s enduring family line and the kingdom’s continuation in God’s presence.
  reasoning_layer_used: Lexical decisions for σπέρμα, εἰς τὸν αἰῶνα, ἐκλείπειν, and βασίλειον, with the Davidic-promise decision
  rationale: Two coordinated clauses clarify the related lineage and kingdom ideas without making the descendants the means of the kingdom’s endurance.
