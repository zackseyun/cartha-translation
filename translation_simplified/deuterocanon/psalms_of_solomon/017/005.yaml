translation:
  language: en
  text: Lord, you chose David to be king over Israel. You swore to him that his descendants would continue forever and that his kingdom would never come to an end before you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “his dynasty would never cease before you.”
