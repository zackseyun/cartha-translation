simplification_decisions:
- pob_phrase: in his days among them
  simplified_phrase: In his time ... among the people
  preserved_meaning: The absence of injustice belongs to the king’s future era and to the community under him.
  reasoning_layer_used: Lexical decisions and contextual tense revision
  rationale: This makes the time and communal setting clear without defining the phrase as a technical term for his reign.
- pob_phrase: because all are holy
  simplified_phrase: because they are all holy
  preserved_meaning: The people’s holiness is explicitly given as the reason there will be no injustice among them.
  reasoning_layer_used: Greek syntax and grounding review
  rationale: The causal link is retained while the pronoun connects naturally to the people.
- pob_phrase: and their king is the Lord Messiah
  simplified_phrase: Their king is the Lord Messiah.
  preserved_meaning: Their king bears both titles while the relationship between the titles remains unresolved.
  reasoning_layer_used: Theological decision and doctrine realignment
  rationale: A new sentence improves readability while preserving the POB title sequence and present tense.
