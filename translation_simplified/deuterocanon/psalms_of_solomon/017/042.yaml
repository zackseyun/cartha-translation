  reasoning_layer_used: source context and ordinary English usage
  rationale: The time expression is recast in natural English without changing its scope.
- pob_phrase: in his God
  simplified_phrase: as he relies on his God
  preserved_meaning: He depends on God rather than being located in God.
  reasoning_layer_used: POB lexical decision for ἐπὶ θεῷ αὐτοῦ
  rationale: The documented sense of dependence is stated directly.
- pob_phrase: wise in the counsel of understanding
