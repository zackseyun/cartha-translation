simplification_decisions:
- pob_phrase: have peoples of the nations serve him
  simplified_phrase: have peoples from the nations serve him
  preserved_meaning: Peoples belonging to various nations will be in service to him.
  reasoning_layer_used: POB lexical decisions and latest revision
  rationale: “From the nations” expresses the relationship naturally without reducing the peoples to a single group.
- pob_phrase: under his yoke
  simplified_phrase: under his yoke
  preserved_meaning: Their service involves submission to his authority.
  reasoning_layer_used: POB lexical decision for ζυγόν
  rationale: The concrete yoke image remains because it conveys subjection.
- pob_phrase: in a place conspicuous to all the earth
  simplified_phrase: in a place renowned throughout the whole earth
  preserved_meaning: He will glorify the Lord in a place of worldwide prominence.
  reasoning_layer_used: POB lexical alternative and rationale for ἐπισήμῳ
  rationale: “Renowned” communicates public prominence without implying literal visibility.
translation_notes:
  risk_flags:
