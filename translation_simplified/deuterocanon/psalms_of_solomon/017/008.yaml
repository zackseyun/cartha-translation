translation:
  language: en
  text: They arrogantly took over David’s throne and left it in ruins.[a] But you, God, will bring them down and remove their descendants from the earth.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may more literally mean “in the arrogance of change or replacement,” but it probably refers to wrongfully taking royal power.
    reason: lexical_alternative
  - marker: b
    text: Or “from the land.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: laid waste the throne of David in arrogant usurpation
