  preserved_meaning: They wrongfully replaced Davidic rule and devastated the throne.
  reasoning_layer_used: POB lexical decisions for ἠρήμωσαν and ἐν ὑπερηφανίᾳ ἀλλάγματος
  rationale: The rewrite explains both the proud seizure of power and the resulting ruin in common English.
- pob_phrase: will cast them down
  simplified_phrase: will bring them down
  preserved_meaning: God will decisively overthrow and humble them.
  reasoning_layer_used: POB lexical decision for καταβαλεῖς and latest revision pass
  rationale: “Bring them down” keeps the force of the image while sounding more natural.
- pob_phrase: their offspring
