simplification_decisions:
- pob_phrase: did not glorify your honored name
  simplified_phrase: did not give glory to your honored name
  preserved_meaning: They failed to give God’s name the glory due to it.
  reasoning_layer_used: POB lexical decision for οὐκ ἐδόξασαν
  rationale: “Give glory to” explains “glorify” in familiar English without reducing it to mere respect.
- pob_phrase: in splendor
  simplified_phrase: with great splendor
  preserved_meaning: They established their kingdom with visible magnificence and pomp.
  reasoning_layer_used: POB lexical decision for ἐν δόξῃ
  rationale: The added adjective makes the manner of their royal display immediately clear.
- pob_phrase: in place of their own exaltation
  simplified_phrase: in place of their own exalted position
  preserved_meaning: The wording retains the image of their height or elevated status and the substitutional force of the phrase.
  reasoning_layer_used: Greek ἀντί phrase and POB lexical rationale for ὕψος
  rationale: “Exalted position” expresses elevated status more clearly than the abstract word “exaltation.”
