translation:
  language: en
  text: The enemy acted as an outsider, in pride, and his heart was far from our God.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The wording may describe the enemy as a foreign outsider or as someone alienated from God.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: acted in estrangement
  simplified_phrase: acted as an outsider
  preserved_meaning: The enemy acted as one who did not belong, whether as a foreigner or as someone alienated.
  reasoning_layer_used: POB lexical alternatives and revision history
  rationale: “Outsider” clearly expresses otherness while the footnote preserves the documented ambiguity.
- pob_phrase: in pride
  simplified_phrase: in pride
  preserved_meaning: The enemy acted with arrogant self-exaltation.
  reasoning_layer_used: POB lexical decision for ὑπερηφανίᾳ
  rationale: Retaining the phrase avoids adding an unsupported claim about the degree of his pride.
- pob_phrase: his heart was estranged from our God
  simplified_phrase: his heart was far from our God
  preserved_meaning: The enemy’s inner person was alienated from God.
  reasoning_layer_used: POB lexical decisions for καρδία and ἀλλοτρία
  rationale: The familiar expression makes the relational separation clear in ordinary English.
translation_notes:
  risk_flags:
  - risk: “Outsider” could be understood only as foreign status or only as relational alienation.
    mitigation: The footnote preserves both senses documented in the POB record.
  - risk: “Far from” could suggest physical distance.
    mitigation: Its connection with the heart indicates relational rather than physical distance.
