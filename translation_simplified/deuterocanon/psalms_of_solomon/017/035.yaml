translation:
  language: en
  text: and to see the glory of the Lord—the glory God gave her. He himself will be a righteous king over them, taught by God.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the glory of the Lord with which God glorified her
  simplified_phrase: the glory of the Lord—the glory God gave her
  preserved_meaning: God bestowed the Lord’s visible honor and splendor on the personified city.
  reasoning_layer_used: POB lexical decisions for δόξαν, ἐδόξασεν, and αὐτήν
  rationale: Repeating “glory” preserves the Greek wordplay while “gave her” makes the action immediately clear.
- pob_phrase: he himself will be a righteous king over them, taught by God
  simplified_phrase: He himself will be a righteous king over them, taught by God.
  preserved_meaning: The coming king will rule them righteously and will receive teaching from God.
  reasoning_layer_used: POB theological decision and applied revision
  rationale: A separate sentence clarifies the supplied future verb and keeps “over them” attached to the king’s rule.
interpretive_expansions:
- pob_phrase: God glorified her
  rendering: God gave her glory
  claim: God bestowed glory on the feminine referent rather than merely praising her.
  evidence:
  - The lexical rationale says ἐδόξασεν means God bestowed glory on her.
  - The surrounding context identifies the feminine referent as personified Jerusalem.
  confidence: high
  alternatives_preserved:
  - honored her
translation_notes:
  risk_flags:
  - risk: The pronoun “her” may be unclear if this verse is read without its surrounding context.
    mitigation: It is retained because the POB requires the feminine reference to personified Jerusalem.
  - risk: Replacing “glorified” with “gave” weakens the exact Greek cognate wordplay.
    mitigation: The repeated noun “glory” preserves the wordplay in clearer English.
