translation:
  language: en
  text: God did not show them mercy. He tracked down their descendants and did not leave a single one.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: did not have mercy on them
  simplified_phrase: did not show them mercy
  preserved_meaning: God withheld mercy from them in judgment.
  reasoning_layer_used: applied revision and lexical decision for ἐλέησεν
  rationale: “Show mercy” is more natural English while preserving the distinct concept of mercy rather than replacing it with “spare.”
- pob_phrase: searched out their offspring
  simplified_phrase: tracked down their descendants
  preserved_meaning: God thoroughly pursued their posterity.
  reasoning_layer_used: lexical decisions for ἐξερεύνησεν and σπέρμα
  rationale: “Tracked down” clearly conveys punitive pursuit, and “descendants” makes the family reference immediately clear.
- pob_phrase: did not leave one of them
  simplified_phrase: did not leave a single one
  preserved_meaning: Not one member of the group remained.
  reasoning_layer_used: lexical decision for οὐκ ἀφῆκεν αὐτῶν ἕνα
  rationale: “A single one” expresses the Greek phrase’s totality in ordinary English.
translation_notes:
  risk_flags:
  - risk: “Tracked down” emphasizes punitive pursuit more strongly than the broader verb “searched out.”
    mitigation: The lexical rationale explicitly supports this contextual sense, and no further action is added.
  - risk: “Did not leave a single one” may be understood as complete destruction though the action is not explicitly named.
    mitigation: The wording preserves POB’s deliberate idiom without adding “alive” or specifying how they were removed.
