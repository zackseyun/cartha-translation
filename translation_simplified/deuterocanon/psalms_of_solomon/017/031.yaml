translation:
  language: en
  text: No non-native resident or foreigner will live among them any longer. He will judge peoples and nations with the wisdom of his righteous character. Selah.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Righteous character” may also be expressed as “justice” in this setting of judgment.
    reason: lexical_alternative
  - marker: b
    text: “Selah” probably marks a musical or worship pause, but its exact meaning is uncertain.
    reason: cultural_note
simplification_decisions:
- pob_phrase: no sojourner or foreigner shall sojourn among them
  simplified_phrase: No non-native resident or foreigner will live among them
  preserved_meaning: The first person lives among the people without native status, while the second is foreign by origin.
  reasoning_layer_used: lexical decisions for πάροικος, ἀλλογενής, and παροικήσει
  rationale: This replaces the unfamiliar repeated word “sojourn” while keeping the two outsider categories distinct.
- pob_phrase: shall ... any longer
  simplified_phrase: will ... any longer
  preserved_meaning: Such residence will no longer continue.
  reasoning_layer_used: POB translation and Greek future verb
  rationale: Modern “will” states the same future outcome more naturally.
- pob_phrase: in the wisdom of his righteousness
  simplified_phrase: with the wisdom of his righteous character
  preserved_meaning: His judgments arise from both wisdom and his broad moral righteousness.
  reasoning_layer_used: theological decision for δικαιοσύνη in the royal-judicial context
  rationale: The wording explains the difficult phrase without narrowing righteousness to legal procedure alone.
interpretive_expansions:
- pob_phrase: his righteousness
  rendering: his righteous character
  claim: Righteousness describes the ruler’s broader moral character behind his judgments.
  evidence:
  - The POB theological rationale explicitly preserves the broader moral character of the ruler.
  - The immediate context presents him judging peoples and nations.
  confidence: high
  alternatives_preserved:
  - his justice
translation_notes:
  risk_flags:
  - risk: “Non-native resident” is less poetic than “sojourner.”
    mitigation: It clearly preserves residence without full native status for common readers.
  - risk: “Righteous character” makes the moral sense more explicit than the compact Greek phrase.
    mitigation: The justice alternative remains in a footnote, and the POB theological rationale supports the expansion.
