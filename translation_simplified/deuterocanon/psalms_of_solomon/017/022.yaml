simplification_decisions:
- pob_phrase: The king was in lawlessness
  simplified_phrase: The king lived without regard for the law
  preserved_meaning: The king's conduct was characterized by disregard for law and rightful order.
  reasoning_layer_used: POB lexical decision for παρανομίᾳ
  rationale: This replaces the abstract term “lawlessness” with a direct description of the same moral-legal condition.
- pob_phrase: the judge in disobedience
  simplified_phrase: The judge refused to obey
  preserved_meaning: The judge rejected rightful authority or the divine standard.
  reasoning_layer_used: POB lexical decision for ἀπειθείᾳ
  rationale: The verbal wording makes “disobedience” immediately understandable while retaining “rebellion” in a note.
- pob_phrase: and the people in sin
  simplified_phrase: and the people lived in sin
  preserved_meaning: Sin characterized the people as a whole.
  reasoning_layer_used: POB lexical decisions for ἐν, λαὸς, and ἁμαρτίᾳ
  rationale: Supplying “lived” gives natural English while preserving the condition expressed by repeated Greek ἐν.
interpretive_expansions:
- pob_phrase: was in lawlessness
  rendering: lived without regard for the law
  claim: The king's lawlessness was an ongoing pattern of conduct.
  evidence:
  - The POB rationale defines παρανομίᾳ as disregard for law or covenantal order.
  - The repeated ἐν presents lawlessness as the king's sphere or condition.
  confidence: high
  alternatives_preserved:
  - was in lawlessness
translation_notes:
  risk_flags:
