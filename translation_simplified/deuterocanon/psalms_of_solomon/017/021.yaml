translation:
  language: en
  text: The everlasting springs from the depths, from the high mountains, were held back,[a] because no one among them lived righteously and did justice. From their ruler down to the least of the people, all were involved in every kind of sin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Everlasting” may also mean “ancient.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: from the lofty mountains
  simplified_phrase: from the high mountains
  preserved_meaning: The springs originate in elevated mountains.
  reasoning_layer_used: Lexical decision for ὀρέων ὑψηλῶν
  rationale: “High” is more familiar than “lofty” and preserves the separate source image.
- pob_phrase: doing righteousness and justice
  simplified_phrase: lived righteously and did justice
  preserved_meaning: No one practiced either righteous conduct or justice.
  reasoning_layer_used: Lexical and theological decisions for δικαιοσύνη and κρίμα
  rationale: This is natural English while keeping the ethical and judicial ideas distinct.
- pob_phrase: from their ruler to the least of the people
  simplified_phrase: From their ruler down to the least of the people
  preserved_meaning: Sin extended through every level of society.
  reasoning_layer_used: Lexical decisions for ἄρχοντος and ἐλαχίστου
  rationale: “Down to” clearly marks the social range without changing its scope.
translation_notes:
  risk_flags:
  - risk: “Everlasting” could suggest philosophical eternity rather than age-long endurance.
    mitigation: The footnote preserves “ancient” as the documented lexical alternative.
