simplification_decisions:
- pob_phrase: a holy people, whom he will lead
  simplified_phrase: a holy people and lead them
  preserved_meaning: He gathers the people and then leads the same people.
  reasoning_layer_used: Greek syntax and POB lexical decisions
  rationale: Two coordinated verbs are easier to follow than the relative clause.
- pob_phrase: the people sanctified by the Lord his God
  simplified_phrase: the people whom the Lord his God has made holy
  preserved_meaning: God acted upon the people and brought them into a holy state.
  reasoning_layer_used: POB lexical decision for ἡγιασμένου
  rationale: “Made holy” expresses the perfect passive sense more clearly than “sanctified.”
translation_notes:
