simplification_decisions:
- pob_phrase: will not allow unrighteousness to remain among them any longer
  simplified_phrase: will no longer let unrighteousness remain among them
  preserved_meaning: He will bring an end to unrighteousness continuing within the community.
  reasoning_layer_used: Lexical decisions for ἀφήσει, ἔτι, μεῖναι, and ἐν αὐτῶν
  rationale: The reordered clause uses ordinary English while preserving refusal, cessation, and the communal setting.
- pob_phrase: will dwell with them
  simplified_phrase: will live with them
  preserved_meaning: Such a person will not have settled residence in the restored community.
  reasoning_layer_used: Lexical decision for κατοικήσει and theological decision on communal exclusion
  rationale: “Live” makes settled residence immediately clear without weakening the exclusion.
interpretive_expansions:
- pob_phrase: who knows wickedness
  rendering: familiar with wickedness
  claim: Knowing wickedness means having a settled familiarity with evil, not merely being aware that evil exists.
  evidence:
  - The POB lexical rationale explicitly identifies familiarity with evil as the participle’s force.
  - The communal purification context excludes people characterized by wickedness.
  confidence: high
  alternatives_preserved:
  - who knows wickedness
  - who is acquainted with wickedness
translation_notes:
  risk_flags:
  - risk: “Familiar with wickedness” could be mistaken for mere knowledge about evil.
    mitigation: The exclusion from living in the community signals morally compromising familiarity, as the POB rationale specifies.
