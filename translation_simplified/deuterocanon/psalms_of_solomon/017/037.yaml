translation:
  language: en
  text: For he will not put his hope in horses, riders, or bows. He will not build up gold or silver for himself to wage war. Nor will he look to great numbers for hope when the day of battle comes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “gather hopes with many” and likely means relying on large numbers or a large force.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: horse and rider and bow
  simplified_phrase: horses, riders, or bows
  preserved_meaning: The concrete list of military resources remains intact.
  reasoning_layer_used: Lexical decisions for ἵππον, ἀναβάτην, and τόξον
  rationale: English plurals and “or” make the negated list natural without weakening its military imagery.
- pob_phrase: multiply gold or silver for himself for war
  simplified_phrase: build up gold or silver for himself to wage war
  preserved_meaning: He will not accumulate precious metals as personal resources for warfare.
  reasoning_layer_used: Lexical decision for πληθυνεῖ αὐτῷ and χρυσίον οὐδὲ ἀργύριον
  rationale: “Build up” clearly expresses accumulating resources while retaining gold, silver, and personal advantage.
- pob_phrase: gather hopes from many for the day of battle
  simplified_phrase: look to great numbers for hope when the day of battle comes
  preserved_meaning: He will not rely on numerical strength in battle.
  reasoning_layer_used: Lexical decisions for πολλοῖς, συνάξει ἐλπίδας, and ἡμέραν πολέμου
  rationale: The new wording states the likely military sense while the footnote preserves the compressed Greek expression.
