translation:
  language: en
  text: His words are refined by fire beyond even the finest gold. In the assemblies, he will judge the people—the tribes of those who have been made holy.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Judge” may also mean “distinguish” or “separate.”
    reason: alternative_reading
  - marker: b
    text: The Greek phrase translated “the tribes of those who have been made holy” is compressed and may also be understood as “the tribes of the holy one” or “the consecrated one.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: refined beyond the finest precious gold
  simplified_phrase: refined by fire beyond even the finest gold
  preserved_meaning: His words surpass the purest and most valuable gold.
  reasoning_layer_used: Lexical decision for πεπυρωμένα and the intensified gold comparison
  rationale: The wording restores the furnace image while expressing the comparison naturally.
- pob_phrase: in the assemblies he will judge the people
  simplified_phrase: In the assemblies, he will judge the people
  preserved_meaning: He exercises judgment over the gathered people.
  reasoning_layer_used: Lexical decisions for συναγωγαῖς and διακρινεῖ
  rationale: The sentence order is modernized without resolving the verb beyond POB’s chosen judicial sense.
- pob_phrase: the tribes of the sanctified
  simplified_phrase: the tribes of those who have been made holy
  preserved_meaning: The tribes belong to the collectively sanctified people.
  reasoning_layer_used: Applied revision and lexical decision for ἡγιασμένου
  rationale: The clearer phrase avoids implying that “the sanctified” is one individual.
