translation:
  language: en
  text: The Lord himself is their king.[a] The mighty one puts his hope in God.[b] The Lord will have mercy on all the nations who are before him with reverent fear.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some ancient witnesses read “his king,” emphasizing that the Davidic ruler is under the Lord’s authority.
    reason: textual_variant
  - marker: b
    text: The Greek wording of this clause is uncertain, but it connects the mighty one’s hope with God.
    reason: textual_variant
simplification_decisions:
- pob_phrase: the hope of the mighty one in God
  simplified_phrase: The mighty one puts his hope in God
  preserved_meaning: The mighty one’s hope is directed toward God.
  reasoning_layer_used: lexical decisions and documented textual difficulty
  rationale: A direct sentence makes the difficult clause readable while preserving its hope-language and orientation toward God.
- pob_phrase: and he will have mercy
  simplified_phrase: The Lord will have mercy
  preserved_meaning: The Lord, the ultimate king named earlier, is the one who shows mercy.
  reasoning_layer_used: POB syntax and theological decision on the Lord’s kingship
  rationale: Repeating “the Lord” prevents the new sentence from wrongly assigning the mercy to the mighty one.
- pob_phrase: before him in fear
  simplified_phrase: who are before him with reverent fear
  preserved_meaning: The nations are in his presence with fear that includes awe.
  reasoning_layer_used: lexical decision and POB lexical alternative
  rationale: This wording keeps the spatial relation and the force of fear without adding an action of coming.
