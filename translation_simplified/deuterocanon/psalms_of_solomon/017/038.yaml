translation_notes:
  risk_flags:
  - risk: The uncertain Greek hope-clause is expressed as a complete English statement.
    mitigation: Footnote b preserves the textual uncertainty and limits the claim to hope directed toward God.
  - risk: Repeating “the Lord” replaces the POB pronoun with an explicit referent.
    mitigation: The clarification follows the POB syntax and prevents the mighty one from becoming the unintended subject.
