  preserved_meaning: The enemies are associated with impurity and disregard for what is sacred.
  reasoning_layer_used: POB lexical decisions on ἀκαθαρσίας and βεβήλων
  rationale: This keeps the impurity image, explains “profane,” and avoids making the enemies explicit causal agents.
- pob_phrase: forever and ever
