translation:
  language: en
  text: I am Raphael, one of the seven holy angels who present the prayers of God’s holy people[a]. We also enter the presence of the Holy One’s glory.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the saints.” The Greek says “the holy ones.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the holy ones
  simplified_phrase: God’s holy people
  preserved_meaning: The phrase refers to people set apart as holy to God, not only to later canonized saints.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: This wording makes the intended human referent clear while the footnote preserves the Greek expression.
- pob_phrase: and enter before the glory of the Holy One
  simplified_phrase: We also enter the presence of the Holy One’s glory
  preserved_meaning: The angels enter the divine presence while the source image of glory and the title Holy One remain explicit.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: A separate sentence and ordinary word order make the heavenly-court image easier to understand.
interpretive_expansions:
- pob_phrase: the holy ones
  rendering: God’s holy people
  claim: The holy ones are God’s people whose prayers the angels present.
  evidence:
