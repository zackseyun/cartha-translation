translation:
  language: en
  text: Do not hold back from openly acknowledging God.[a] A king’s secret should be kept hidden, but God’s deeds should be made known in a way that gives him glory.[b] Do what is good, and evil will not find you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “confess to him,” “give thanks to him,” or “praise him openly.”
    reason: lexical_alternative
  - marker: b
    text: Or “made known honorably” or “with due honor.”
    reason: lexical_alternative
