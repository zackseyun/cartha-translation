translation:
  language: en
  text: He called the two of them aside and said, “Bless God and thank him. Honor him as great, and give thanks to him before all who live for what he has done with you.[a] It is good to bless God and exalt his name. Speak with honor about God’s works. And do not be reluctant—”[b]
  philosophy: optimal-equivalence
  footnotes:
