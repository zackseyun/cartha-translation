translation:
  language: en
  text: Prayer, together with fasting, giving to people in need, and righteous living, is good. A little with righteousness is better than much with unrighteousness.[a] It is better to give to people in need than to store up gold.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “justice” and “injustice” for “righteousness” and “unrighteousness.”
    reason: lexical_alternative
