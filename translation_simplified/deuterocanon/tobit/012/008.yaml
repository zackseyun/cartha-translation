- pob_phrase: Prayer with fasting, almsgiving, and righteousness
  simplified_phrase: Prayer, together with fasting, giving to people in need, and righteous living
  preserved_meaning: Prayer remains associated with fasting, aid for the needy, and moral-religious right conduct.
  reasoning_layer_used: Lexical decisions for μετὰ, ἐλεημοσύνη, and δικαιοσύνη
  rationale: The wording explains almsgiving and righteousness while leaving the practices coordinated with prayer.
- pob_phrase: a little with righteousness is better than much with unrighteousness
  simplified_phrase: A little with righteousness is better than much with unrighteousness
  preserved_meaning: A small amount joined with righteousness is preferable to abundance joined with unrighteousness.
  reasoning_layer_used: Lexical and theological decisions for τὸ ὀλίγον, πολὺ, δικαιοσύνη, and ἀδικία
  rationale: The open proverb is retained without specifying possessions or turning its nouns into actions.
- pob_phrase: to do almsgiving rather than to store up gold
  simplified_phrase: to give to people in need than to store up gold
  preserved_meaning: Giving material help to needy people is preferable to accumulating gold.
  reasoning_layer_used: Lexical decisions for ποιῆσαι ἐλεημοσύνην, θησαυρίσαι, and χρυσίον
  rationale: The common wording explains almsgiving while preserving the concrete image of stored gold.
