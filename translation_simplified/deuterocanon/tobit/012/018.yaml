translation:
  language: en
  text: I did not come on my own initiative, but because your God willed it.[a] So bless him forever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “not by my own favor” or “not by my own grace.” Raphael means that he did not come independently or merely to show personal kindness; he came by God’s will.
    reason: lexical_alternative
