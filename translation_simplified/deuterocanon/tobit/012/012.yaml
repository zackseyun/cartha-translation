translation:
  language: en
  text: Now, when you and your bride Sarah[a] were praying, I brought your prayer as a memorial before the Holy One.[b] And when you were burying the dead, I was there with you as well.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “your wife Sarah”; the Greek word can mean “bride” or “young wife.”
    reason: lexical_alternative
  - marker: b
    text: “The Holy One” refers to God; “memorial” may carry the sense of a remembrance or a memorial offering presented before him.
    reason: lexical_alternative
