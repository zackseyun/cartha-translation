simplification_decisions:
- pob_phrase: I will certainly not hide any word from you
  simplified_phrase: I certainly will not keep anything from you
  preserved_meaning: Raphael emphatically promises to withhold nothing from them.
  reasoning_layer_used: Lexical decisions for οὐ μὴ κρύψω, ἀφʼ ὑμῶν, and πᾶν ῥῆμα
  rationale: The rewrite uses ordinary English while keeping the strong negation and future assurance.
- pob_phrase: I have indeed said
  simplified_phrase: As I have said
  preserved_meaning: Raphael introduces a maxim he has already stated.
  reasoning_layer_used: Lexical decision for εἴρηκα δὴ
  rationale: The smoother transition preserves the perfect tense without awkward emphasis.
- pob_phrase: It is good to hide a king’s secret, but to reveal the works of God gloriously
  simplified_phrase: It is good to keep a king’s secret, but to reveal God’s works in a glorious way
  preserved_meaning: Royal secrets may rightly be concealed, while God’s deeds should be made known fittingly and gloriously.
  reasoning_layer_used: Lexical and theological decisions for μυστήριον, ἔργα, ἀνακαλύπτειν, and ἐνδόξως
  rationale: The wording keeps the proverbial contrast and avoids giving “secret” a later theological sense.
