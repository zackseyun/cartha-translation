translation:
  language: en
  text: When you got up without hesitation and left your meal to go wrap the dead man's body,[a] I noticed the good you were doing, and I was with you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “prepare the dead man's body for burial.” The Greek can refer to wrapping or otherwise arranging a body.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: did not hesitate to rise
  simplified_phrase: got up without hesitation
  preserved_meaning: Tobit promptly left his meal rather than holding back.
  reasoning_layer_used: Lexical decisions for οὐκ ὤκνησας and ἀναστῆναι
  rationale: Ordinary English word order makes the prompt action immediately clear.
- pob_phrase: wrap the dead man
  simplified_phrase: wrap the dead man's body
  preserved_meaning: Tobit handled the dead man in preparation for burial without making burial itself explicit.
  reasoning_layer_used: Lexical decision for περιστείλῃς τὸν νεκρόν
  rationale: Adding “body” avoids the unnatural impression of wrapping the person as though alive.
- pob_phrase: your doing good did not escape me
  simplified_phrase: I noticed the good you were doing
  preserved_meaning: Raphael observed Tobit's righteous action.
  reasoning_layer_used: Lexical decision for οὐκ ἔλαθές με ἀγαθοποιῶν and theological decision on Raphael's observation
  rationale: A direct active sentence replaces an opaque negative idiom without broadening Raphael's knowledge.
translation_notes:
  risk_flags:
  - risk: “Noticed” removes the source idiom's negative form.
    mitigation: It preserves the immediate narrative claim that Tobit's good action did not go unnoticed.
