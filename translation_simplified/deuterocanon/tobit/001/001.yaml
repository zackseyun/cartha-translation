translation:
  language: en
  text: This book contains the words of Tobit. Tobit was the son of Tobiel, who was the son of Ananiel, who was the son of Aduel, who was the son of Gabael.[a] Tobit came from the family line of Asiel and belonged to the tribe of Naphtali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek form of this name is difficult; some witnesses have forms closer to “Gabiel” or “Bagabael.”
    reason: alternative_reading
