translation:
  language: en
  text: He was taken captive from Thisbe in the time of Enemessaros, king of Assyria. Thisbe is to the right of Kydios in the region of Naphtali, in Galilee, above Asher.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The place names and directions are uncertain. Kydios may be known by another name, and the exact directions meant by “to the right of” and “above Asher” are unclear.
    reason: cultural_note
