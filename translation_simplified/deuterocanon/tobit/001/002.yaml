- pob_phrase: who was taken captive in the days of Enemessaros king of the Assyrians, from Thisbe
  simplified_phrase: He was taken captive from Thisbe in the time of Enemessaros, king of Assyria.
  preserved_meaning: He was forcibly carried away from Thisbe during Enemessaros’s rule.
  reasoning_layer_used: POB translation and lexical decisions for ᾐχμαλωτεύθη, ἐν ἡμέραις, and ἐκ Θίσβης
  rationale: A complete sentence and ordinary time expression clarify the event without separating Thisbe from the captivity.
- pob_phrase: which is to the south of Kedesh of Naphtali in Galilee
  simplified_phrase: Thisbe is to the right of Kydios in the region of Naphtali, in Galilee
  preserved_meaning: Thisbe is located relative to the uncertain site Kydios within the territory of Naphtali in Galilee.
  reasoning_layer_used: POB lexical decisions for ἐκ δεξιῶν, Κυδίως, τῆς Νεφθαλεὶμ, and ἐν τῇ Γαλειλαίᾳ
  rationale: The revision restores the source-driven name and directional ambiguity while explaining the regional relation clearly.
- pob_phrase: above Asher
  simplified_phrase: above Asher
  preserved_meaning: The source’s spatial expression and uncertain geographic direction remain intact.
  reasoning_layer_used: POB lexical decision for ὑπεράνω Ἀσήρ
  rationale: Keeping the image avoids imposing an unsupported compass direction.
