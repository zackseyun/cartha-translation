translation:
  language: en
  text: All the tribes that had turned away from God were regularly offering sacrifices to Baal the Heifer.[a] Even my own ancestral house, the house of Naphtali, joined them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Baal the Calf.” The Greek refers to a young cow, probably a bovine image used in northern Israel’s worship.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: that had apostatized
  simplified_phrase: that had turned away from God
  preserved_meaning: The tribes had abandoned faithful worship in a religious act of defection.
  reasoning_layer_used: lexical and theological decisions on συναποστᾶσαι
  rationale: This expresses the covenantal defection in common English without reducing it to political rebellion.
- pob_phrase: were sacrificing
  simplified_phrase: were regularly offering sacrifices
  preserved_meaning: The sacrifices were customary or ongoing in the past.
  reasoning_layer_used: lexical decision on ἔθυον
  rationale: “Regularly” makes the Greek imperfect aspect easier to recognize.
- pob_phrase: including the house of my father, Naphtali
  simplified_phrase: Even my own ancestral house, the house of Naphtali, joined them
  preserved_meaning: Tobit’s own family line participated with the other tribes.
  reasoning_layer_used: POB syntax rationale and alternative-reading footnote
  rationale: A separate sentence clarifies the compressed Greek while retaining Tobit’s emphasis on his ancestry.
interpretive_expansions:
- pob_phrase: had apostatized
  rendering: had turned away from God
  claim: The defection was specifically a departure from faithful worship of God.
  evidence:
  - The next clause describes sacrifices offered to Baal.
  - The POB theological decision identifies the defection as covenantal and religious.
  confidence: high
  alternatives_preserved:
  - religious defection
  - apostasy
