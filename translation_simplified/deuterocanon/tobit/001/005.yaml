    mitigation: The footnote preserves “calf” and explains the probable bovine-image association.
  - risk: The compressed Greek relationship between “my father” and “Naphtali” remains uncertain.
    mitigation: “Ancestral house” preserves the POB’s family-line reading without identifying Naphtali as Tobit’s immediate father.
