translation:
  language: en
  text: Ahiacharus spoke on my behalf, and I came to Nineveh. He was my cousin and served as the royal wine steward. He also kept the signet ring used as the royal seal, managed official affairs, and kept the accounts. Sacherdonos appointed him second in rank.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek expression here is awkward and literally says “son of the second.” It probably means that Ahiacharus ranked next after the ruler.
    reason: textual_variant
