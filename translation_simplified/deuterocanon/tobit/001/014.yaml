  text: I used to travel to Media.[a] At Rages in Media, I deposited[b] a large amount of silver—ten talents[c]—with Gabael, Gabri’s brother.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “I traveled to Media.” The Greek may describe either customary travel or a single journey.
    reason: lexical_alternative
  - marker: b
    text: Or “entrusted”; Gabael was given the silver for safekeeping.
    reason: lexical_alternative
  - marker: c
    text: A talent was a large ancient unit of weight and value.
    reason: cultural_note
