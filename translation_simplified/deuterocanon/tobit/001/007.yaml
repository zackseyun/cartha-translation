translation:
  language: en
  text: I used to give the priests—the sons of Aaron—the offerings from my produce that were meant for the altar. I used to give one tenth to the sons of Levi, who served in Jerusalem. Each year, I sold the second tenth[a], went to Jerusalem, and spent the money there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “One tenth” and “the second tenth” are also called “the tithe” and “the second tithe.” The verb translated “sold” may include converting the second tenth into money.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And I would give them to the priests, the sons of Aaron, for the altar, from the produce
  simplified_phrase: I used to give the priests—the sons of Aaron—the offerings from my produce that were meant for the altar
  preserved_meaning: Tobit repeatedly gave produce-based offerings for altar use to the Aaronic priests.
  reasoning_layer_used: POB lexical decisions and immediate context
  rationale: This names the implied offerings and untangles the compressed relationships.
- pob_phrase: I would give the tenth to the sons of Levi who minister in Jerusalem
  simplified_phrase: I used to give one tenth to the sons of Levi, who served in Jerusalem
  preserved_meaning: Tobit habitually gave a tenth to the Levites serving in Jerusalem.
  reasoning_layer_used: POB lexical decisions for ἐδίδουν and θεραπεύω
  rationale: “Used to give” preserves repeated action, while “served” makes the religious role clearer.
- pob_phrase: I would sell the second tenth and go and spend it in Jerusalem each year
  simplified_phrase: Each year, I sold the second tenth, went to Jerusalem, and spent the money there
  preserved_meaning: His annual custom was to sell the second tenth and spend its proceeds in Jerusalem.
  reasoning_layer_used: POB theological decision and lexical rationale for ἀπεπρατιζόμην
  rationale: Placing “Each year” first clearly marks the whole sequence as a repeated custom.
interpretive_expansions:
- pob_phrase: spend it
  rendering: spent the money there
  claim: What Tobit spent was the money received from selling the second tenth.
  evidence:
  - The preceding verb says that he sold the second tenth.
  - The POB rationale identifies what was spent as the proceeds of sale.
  confidence: high
  alternatives_preserved:
  - The footnote preserves the possible sense of converting the second tenth into money.
