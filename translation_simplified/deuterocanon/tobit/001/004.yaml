  preserved_meaning: Tobit recalls his youth while living in Israel as his homeland.
  reasoning_layer_used: POB lexical decisions for χώρα and νεωτέρου μου ὄντος
  rationale: The recast opening removes repetitive clauses while retaining the time and place.
- pob_phrase: which had been chosen from all the tribes of Israel for all the tribes to sacrifice there
  simplified_phrase: This house had been chosen from all the tribes of Israel as the place where every tribe was to offer sacrifices
  preserved_meaning: The house of Jerusalem was the chosen center for the sacrificial worship of every Israelite tribe.
  reasoning_layer_used: POB theological decision and footnote on the house of Jerusalem
  rationale: A new sentence clarifies the purpose while keeping the house as the antecedent.
- pob_phrase: was consecrated and built
