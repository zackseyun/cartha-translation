translation:
  language: en
  text: When I was still young and living in my homeland, the land of Israel, the whole tribe of my father Naphtali turned away from worship at the house of Jerusalem.[a] This house had been chosen from all the tribes of Israel as the place where every tribe was to offer sacrifices. The temple, the dwelling place of the Most High, was set apart as holy and built for every generation.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek distinguishes the “house of Jerusalem,” meaning the Jerusalem sanctuary broadly, from the temple mentioned later.
    reason: lexical_alternative
  - marker: b
    text: The surviving Greek ends abruptly with “for all”; “for every generation” follows the likely sense supported by the longer Tobit tradition.
    reason: textual_variant
