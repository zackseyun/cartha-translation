translation:
  language: en
  text: When we were captured and taken to Nineveh, all my brothers and other relatives ate the food of the Gentiles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “the breads of the Gentiles,” an expression referring to their food provisions.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: were taken captive to Nineveh
  simplified_phrase: were captured and taken to Nineveh
  preserved_meaning: They were forcibly carried away to Nineveh.
  reasoning_layer_used: The lexical decision for ᾐχμαλωτίσθημεν preserves the forced nature of the captivity.
  rationale: The two verbs make the forced capture and destination immediately clear.
- pob_phrase: all my brothers and those of my kindred
  simplified_phrase: all my brothers and other relatives
  preserved_meaning: Tobit refers both to his brothers and to his wider family group.
  reasoning_layer_used: The lexical decisions distinguish ἀδελφοί from the broader kin-group denoted by γένος.
  rationale: “Other relatives” is clearer modern English than “those of my kindred.”
- pob_phrase: ate from the bread of the Gentiles
  simplified_phrase: ate the food of the Gentiles
  preserved_meaning: They ate food associated with non-Israelites.
  reasoning_layer_used: The lexical and theological decisions identify “bread” as a food-provisions idiom and retain “Gentiles.”
  rationale: The main text explains the idiom, while the footnote preserves its concrete bread image.
translation_notes:
  risk_flags:
  - risk: Rendering “bread” as “food” could hide the Greek image.
    mitigation: The anchored footnote gives the literal image and explains the idiom.
  - risk: Readers may assume the food is explicitly called unclean.
    mitigation: The wording retains “Gentiles” but does not add the unstated word “unclean.”
