translation:
  language: en
  text: When Enemessar died, his son Achreil[a] became king in his place. The roads under the new king’s control became unsafe,[b] and I could no longer travel to Media.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek witness used here names them Enemessar and Achreil; other traditions of Tobit have different spellings and sometimes different names.
    reason: textual_variant
  - marker: b
    text: The Greek verb is difficult; the travel context suggests that the routes became disorderly or unsafe.
    reason: lexical_alternative
