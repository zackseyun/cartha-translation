translation:
  language: en
  text: But I was the only one who regularly went to Jerusalem for the festivals, as the everlasting command written for all Israel required. I brought the first offerings from the harvest, the tithes from the produce, and the first portion of wool from shearing livestock.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Greek word probably means the first portion of wool from shearing livestock; it may refer more generally to the first portion of pastoral produce.
    reason: lexical_alternative
