translation:
  language: en
  text: I used to give the third portion to those who had a right to receive it, as Deborah, my father’s mother, had commanded me, because I had lost my father and was left fatherless.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the third
  simplified_phrase: the third portion
  preserved_meaning: This was the third share of Tobit’s goods or produce.
  reasoning_layer_used: POB lexical decision for τὴν τρίτην and its footnote
  rationale: Supplying “portion” makes the implied noun clear.
- pob_phrase: I would give to those to whom it was due
  simplified_phrase: I used to give ... to those who had a right to receive it
  preserved_meaning: Tobit repeatedly gave the share to its rightful recipients.
  reasoning_layer_used: POB lexical decisions for ἐδίδουν and οἷς καθήκει
  rationale: The wording makes both the repeated practice and rightful receipt immediately clear.
- pob_phrase: I was left an orphan by my father
  simplified_phrase: I had lost my father and was left fatherless
  preserved_meaning: Tobit lacked his father and was therefore under Deborah’s direction.
  reasoning_layer_used: POB lexical decisions and footnote c
  rationale: This removes an unnatural English construction without claiming that Tobit had lost both parents.
interpretive_expansions:
- pob_phrase: ὀρφανὸς κατελείφθην ὑπὸ τοῦ πατρός μου
  rendering: I had lost my father and was left fatherless
  claim: The orphan language refers specifically to the loss of Tobit’s father.
  evidence:
  - The Greek explicitly adds “by my father.”
  - POB footnote c explains the sense as effectively “fatherless.”
  confidence: high
  alternatives_preserved:
  - I was left an orphan by my father
  - I was orphaned through the loss of my father
translation_notes:
  risk_flags:
  - risk: “Had a right to receive it” may sound more legally precise than the Greek’s broader sense of what was fitting or due.
    mitigation: The wording follows POB’s controlling choice, “to whom it was due,” without naming a specific legal entitlement.
