translation:
  language: en
  text: But someone in Nineveh went to the king and reported that I was burying them, and I went into hiding. When I realized that people were searching for me to put me to death, I left because I was afraid.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: one of the men in Nineveh went and informed the king about me
  simplified_phrase: someone in Nineveh went to the king and reported
  preserved_meaning: A person in Nineveh gave the king information about Tobit.
  reasoning_layer_used: POB lexical decisions for εἷς τῶν ἐν Νινευὴ and ὑπέδειξε
  rationale: “Someone” and “reported” express the accusation in natural modern English.
- pob_phrase: and I hid myself
  simplified_phrase: and I went into hiding
  preserved_meaning: Tobit concealed himself after the report, without explicitly making the report its cause.
  reasoning_layer_used: POB lexical decision for ἐκρύβην and grounding review
  rationale: “Went into hiding” is clear, while “and” preserves the source’s unmarked sequence.
- pob_phrase: I was being sought to be put to death; I withdrew in fear
  simplified_phrase: people were searching for me to put me to death, I left because I was afraid
  preserved_meaning: Tobit departed fearfully after realizing that unspecified people sought his execution.
  reasoning_layer_used: POB lexical and theological decisions for ζητοῦμαι ἀποθανεῖν, φοβηθεὶς, and ἀνεχώρησα
  rationale: Active wording is easier to follow, and “left” avoids overstating the withdrawal as flight.
