translation:
  language: en
  text: Before fifty days had passed, two of his sons killed him and fled to the mountains of Ararat. His son Sacherdonos[a] became king in his place. He appointed Achiacharos[b], the son of Anael, who was my brother’s son, to oversee all the royal accounts and the entire administration.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sacherdonos is the Greek form of the Assyrian royal name commonly known in English as Esarhaddon.
    reason: lexical_alternative
  - marker: b
    text: Achiacharos is the Greek form of the name often rendered Ahikar.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And Sacherdonos his son reigned in his place
  simplified_phrase: His son Sacherdonos became king in his place
  preserved_meaning: Sacherdonos succeeded the dead king as ruler.
  reasoning_layer_used: POB lexical decision for ἐβασίλευσεν ... ἀντʼ αὐτοῦ
  rationale: “Became king” states the accession more plainly than “reigned.”
- pob_phrase: the son of Anael, my brother's son
  simplified_phrase: the son of Anael, who was my brother’s son
  preserved_meaning: Anael, not Achiacharos, was the narrator’s brother’s son.
  reasoning_layer_used: Applied revision clarifying the Greek genealogy
  rationale: The added relative clause prevents readers from attaching the relationship to Achiacharos.
- pob_phrase: over all the accounts of his kingdom and over the whole administration
  simplified_phrase: to oversee all the royal accounts and the entire administration
  preserved_meaning: Achiacharos received authority over both the kingdom’s accounting and its broader administration.
  reasoning_layer_used: POB lexical decisions for ἐκλογιστεία and διοίκησιν
  rationale: The active wording makes his official responsibility immediately clear.
