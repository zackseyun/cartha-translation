translation:
  language: en
  text: Whenever King Sennacherib killed people as he came fleeing from Judea,[a] I secretly buried their bodies. In his anger he killed many people. The king searched for their bodies, but they were not found.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek Swete reads “Achreil the king,” a form understood in this context to mean Sennacherib.
    reason: textual_variant
simplification_decisions:
- pob_phrase: And if Sennacherib the king killed any
  simplified_phrase: Whenever King Sennacherib killed people
  preserved_meaning: The clause describes Tobit’s practice when the king killed victims.
  reasoning_layer_used: Lexical decision for καὶ εἴ τινα and the following plural αὐτούς
  rationale: “Whenever” clearly presents the general circumstance, while the plural keeps the later reference to multiple victims.
- pob_phrase: I buried them secretly; for in his anger he killed many
  simplified_phrase: I secretly buried their bodies. In his anger he killed many people.
  preserved_meaning: Tobit secretly buried the victims, and the angry king killed many people.
  reasoning_layer_used: Lexical decisions for ἔθαψα αὐτοὺς κλέπτων and ἐν τῷ θυμῷ αὐτοῦ
  rationale: Two sentences make the sequence clear without losing the secrecy or the king’s anger.
- pob_phrase: the bodies were sought by the king, but they were not found
  simplified_phrase: The king searched for their bodies, but they were not found.
  preserved_meaning: The king looked for the victims’ bodies but failed to find them.
  reasoning_layer_used: Lexical decisions for ἐξητήθη and οὐχ εὑρέθη
  rationale: The active wording is more direct, while the ending preserves the failed search.
interpretive_expansions:
- pob_phrase: And if ... any
  rendering: Whenever ... killed people
  claim: The conditional introduces a repeated general circumstance in Tobit’s practice.
  evidence:
