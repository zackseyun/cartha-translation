translation:
  language: en
  text: I, Tobit, followed the paths of truth and righteousness throughout my life. I did many acts of mercy[a] for my Israelite brothers and for my people who went with me to Nineveh in Assyria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may refer specifically to giving help to the poor, but it can also include other acts of mercy.
    reason: lexical_alternative
