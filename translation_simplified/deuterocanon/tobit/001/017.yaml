  text: I gave my bread to hungry people and clothing to people who had no clothing. Whenever I saw one of my kin dead and thrown behind the wall of Nineveh,[a] I buried him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “outside the wall of Nineveh.” The Greek says “behind the wall,” perhaps referring to bodies thrown outside the city.
    reason: lexical_alternative
