translation:
  language: en
  text: Oh, how blessed are those who love you! They will rejoice over your peace. Blessed are all who grieved over your suffering.[a] They will rejoice because of you when they see you in all your glory. My soul will rejoice forever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can also mean “scourgings,” “plagues,” or “chastisements”; it pictures suffering as painful blows.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Oh, blessed are those who love you
  simplified_phrase: Oh, how blessed are those who love you!
  preserved_meaning: The emphatic blessing honors those who continually love the one addressed.
  reasoning_layer_used: Lexical decision for μακάριοι and the exclamatory force of ὦ.
  rationale: The exclamation makes the opening emphasis immediately clear.
- pob_phrase: all who were grieved over your afflictions
  simplified_phrase: all who grieved over your suffering
  preserved_meaning: These people felt grief because of the painful afflictions experienced by the one addressed.
  reasoning_layer_used: Lexical decisions for λυπέω and μάστιξ, with the lexical footnote.
  rationale: This is natural English, while the note preserves the image of painful blows.
- pob_phrase: they will rejoice over you when they see all your glory
  simplified_phrase: They will rejoice because of you when they see you in all your glory.
  preserved_meaning: Seeing the full glory of the one addressed will give them reason to rejoice.
  reasoning_layer_used: Lexical decisions for ἐπί, θεασάμενοι, and πᾶσαν τὴν δόξαν σου.
  rationale: The new sentence states the relationship between seeing and rejoicing in ordinary English.
