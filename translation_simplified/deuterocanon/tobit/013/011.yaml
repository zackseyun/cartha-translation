translation:
  language: en
  text: Many nations will come from far away to honor the name of the Lord God. They will carry gifts in their hands—gifts for the King of heaven. Generation after generation will bring you rejoicing.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “you” is Jerusalem, addressed as a person in this hymn.
    reason: simplification_note
simplification_decisions:
- pob_phrase: carrying gifts in their hands, gifts for the King of heaven
  simplified_phrase: They will carry gifts in their hands—gifts for the King of heaven.
  preserved_meaning: The nations visibly bring offerings intended for the King of heaven.
  reasoning_layer_used: Lexical decisions for δῶρα and the accompanying participle
  rationale: A new sentence clarifies the action while preserving the repeated “gifts” and concrete image.
- pob_phrase: generations of generations
  simplified_phrase: Generation after generation
  preserved_meaning: Successive generations continue the action over time.
  reasoning_layer_used: Documented lexical alternative for γενεαὶ γενεῶν
  rationale: The idiomatic phrase preserves the intensified sense without an opaque construction.
- pob_phrase: will give you exultation
  simplified_phrase: will bring you rejoicing
  preserved_meaning: Future generations will give the addressed city cause for joyful celebration.
  reasoning_layer_used: Lexical alternative and pronoun rationale for δώσουσίν σοι ἀγαλλίαμα
  rationale: The rendering expresses the Greek construction in natural modern English.
