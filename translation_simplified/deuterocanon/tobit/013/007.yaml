translation:
  language: en
  text: I lift up my God in praise. My soul rejoices in the King of heaven,[a] and it will rejoice greatly in his greatness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek has no verb in this clause; it may instead mean, “My soul is for the King of heaven.”
