  review_summary: The draft usefully simplifies the devotion formula and makes the Semitic “do truth” idiom understandable. “Live by what is true in his sight” is warranted by the POB note and the immediate call to whole-life turning, while the alternative footnote preserves the faithful-action sense. Revision is needed because “King through all ages” no longer clearly identifies God as the King over/all ages and weakens “exalt.” The recommended wording restores that title and force in clear English; it also makes the “what he will do” clause more direct without imposing a speculative manner of action.
