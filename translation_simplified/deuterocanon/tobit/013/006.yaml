translation:
  language: en
  text: If you turn to him with all your heart and soul and live by what is true in his sight[a], then he will turn to you. He will certainly not hide his face from you. See what he will do for you, and thank him with your whole being[b]. Bless the Lord of righteousness[c], and exalt the King of all ages.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “act faithfully in his sight.”
    reason: lexical_alternative
  - marker: b
    text: The Greek literally says “with your whole body,” expressing complete, embodied thanksgiving.
    reason: source_note
  - marker: c
    text: Or “the Lord of justice.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: with all your heart and with all your soul
  simplified_phrase: with all your heart and soul
  preserved_meaning: The traditional formula still expresses total devotion.
  reasoning_layer_used: POB lexical decision on the total-devotion formula
  rationale: Removing the repeated words makes the line flow naturally without weakening its scope.
- pob_phrase: See what he will do with you
  simplified_phrase: See what he will do for you
  preserved_meaning: Readers are called to recognize God's restoring action in relation to them.
  reasoning_layer_used: Source clause and immediate reciprocal context
  rationale: The wording is natural English and avoids narrowing the command to how God acts.
- pob_phrase: the King of the ages
  simplified_phrase: the King of all ages
  preserved_meaning: The title presents God as sovereign over every age.
  reasoning_layer_used: POB lexical decision on τὸν βασιλέα τῶν αἰώνων
  rationale: Adding “all” makes the time-spanning royal title immediately clear while preserving the plural image.
interpretive_expansions:
- pob_phrase: to do what is true before him
  rendering: live by what is true in his sight
  claim: The phrase describes a truthful way of life before God, not merely isolated true actions.
  evidence:
  - The POB footnote identifies the phrase as a Semitic expression for living truthfully or faithfully before God.
  - The call to turn with one's whole heart and soul gives the phrase whole-life scope.
  confidence: high
  alternatives_preserved:
  - act faithfully in his sight
translation_notes:
  risk_flags:
  - risk: “For you” gives the open phrase “with you” a favorable sense.
    mitigation: The reciprocal promise of God's return strongly supports a beneficial response without specifying its form.
