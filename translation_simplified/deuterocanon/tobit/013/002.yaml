translation:
  language: en
  text: For he causes suffering, yet he also shows mercy. He brings people down to Hades[a] and brings them up again. No one can escape his hand.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hades means the realm of the dead; it may also be understood here as the grave.
    reason: lexical_alternative
  - marker: b
    text: His “hand” is an image of his power and control.
    reason: simplification_note
simplification_decisions:
- pob_phrase: he afflicts and shows mercy
  simplified_phrase: he causes suffering, yet he also shows mercy
  preserved_meaning: God both inflicts severe suffering or discipline and acts with compassion.
  reasoning_layer_used: lexical decision for μαστιγοῖ and ἐλεᾷ
  rationale: The wording explains “afflicts” in common English while preserving the contrast with mercy.
- pob_phrase: he brings down to Hades and brings up
  simplified_phrase: He brings people down to Hades and brings them up again.
  preserved_meaning: God has sovereign power to bring people into the realm of death and to bring them out.
  reasoning_layer_used: lexical and theological decisions for κατάγει, ᾅδης, and ἀνάγει
  rationale: The revision clarifies the implied object while retaining the paired downward and upward images.
- pob_phrase: there is no one who will escape his hand
  simplified_phrase: No one can escape his hand.
  preserved_meaning: Escape from God's power and control is impossible.
  reasoning_layer_used: lexical decisions for οὐκ ἔστιν ὃς ἐκφεύξεται and τὴν χεῖρα αὐτοῦ
  rationale: The shorter idiom states the same impossibility and keeps the biblical image of God's hand.
interpretive_expansions:
- pob_phrase: brings down to Hades and brings up
  rendering: brings people down to Hades and brings them up again
  claim: People are the implied recipients of God's action, and the upward movement reverses the downward movement.
  evidence:
  - The paired transitive verbs imply recipients even though the Greek leaves them unstated.
  - The theological rationale identifies God's sovereignty over human life and death.
  confidence: high
  alternatives_preserved:
  - Deliverance from mortal danger
  - Restoration from the realm of the dead
  - Resurrection
translation_notes:
  risk_flags:
  - risk: “Brings them up again” could be read as an explicit promise of resurrection.
    mitigation: The wording retains POB's broad motion image, and the audit preserves deliverance and resurrection as alternatives.
  - risk: Modern readers may take “his hand” only literally.
    mitigation: A brief footnote explains the image without removing it from the text.
