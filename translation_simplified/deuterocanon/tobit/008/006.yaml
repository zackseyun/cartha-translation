translation:
  language: en
  text: You made Adam and gave him Eve to be his wife, his helper and support. From the two of them came the whole human race. You said, “It is not good for the man to be alone.[a] Let us make him a helper like himself.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This recalls Genesis 2:18.
    reason: cross_reference
