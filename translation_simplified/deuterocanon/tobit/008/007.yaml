translation:
  language: en
  text: And now, Lord, I am not marrying this sister of mine[a] because of sexual immorality, but sincerely. Command that you show mercy to me and that she and I may grow old together.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sister” is kinship language for a close female relative who could lawfully become his wife.
    reason: cultural_note
  - marker: b
    text: Or, “Command that I may receive mercy and that she and I may grow old together.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I am not taking this my sister
  simplified_phrase: I am not marrying this sister of mine
  preserved_meaning: He is taking a close female relative as his lawful wife while the source’s kinship term remains visible.
  reasoning_layer_used: Lexical and theological decisions on λαμβάνω and ἀδελφήν.
  rationale: “Marrying” clarifies the action, while “sister” preserves the narrative’s kinship language.
- pob_phrase: because of sexual immorality, but in truth
  simplified_phrase: because of sexual immorality, but sincerely
  preserved_meaning: He denies an illicit sexual motive and affirms that his purpose is genuine and upright.
  reasoning_layer_used: Lexical decisions on πορνείαν and ἐπʼ ἀληθείας.
  rationale: This keeps the broad moral category and expresses the contrast in natural English.
- pob_phrase: Command that I may find mercy
  simplified_phrase: Command that you show mercy to me
  preserved_meaning: He asks God to order that divine mercy be shown to him.
  reasoning_layer_used: POB footnote and lexical decisions on ἐπίταξον and ἐλεῆσαί.
  rationale: The wording retains the force of “command” while making God’s requested action clear.
interpretive_expansions:
- pob_phrase: I am not taking this my sister
  rendering: I am not marrying this sister of mine
  claim: In this context, “taking” refers to taking his female relative as his wife.
  evidence:
  - The POB lexical rationale says λαμβάνω can imply taking as wife in a marriage context.
  - The verse is Tobias’s marriage prayer.
  confidence: high
  alternatives_preserved:
  - taking this sister of mine
  - marrying my kinswoman
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “sister” to mean a direct sibling.
    mitigation: The footnote explains the book’s broader kinship usage without removing the source image.
  - risk: The Greek construction may petition mercy for both Tobias and Sarah rather than Tobias alone.
    mitigation: The main text follows the explicit POB construction, while the verse still asks that they share a long life.
