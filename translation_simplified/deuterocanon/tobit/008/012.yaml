translation:
  language: en
  text: Raguel said to his wife Edna,[b] “Send one of the servant girls. Let them find out whether he is alive.[a] If he is dead, we will bury him so that no one finds out.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “them,” even though only one servant girl has just been mentioned.
    reason: textual_variant
  - marker: b
    text: The supplied Greek and POB name Edna as the speaker, but the immediate context identifies Raguel as speaking to his wife Edna.
    reason: source_note
simplification_decisions:
- pob_phrase: Send one of the servant girls, and let them see
  simplified_phrase: Send one of the servant girls. Let them find out
  preserved_meaning: A servant is sent to determine whether the man is alive, while the Greek plural remains visible.
  reasoning_layer_used: POB lexical decision for ἰδέτωσαν and source syntax
  rationale: Two short sentences clarify the command without smoothing away the plural wording.
- pob_phrase: but if not, so that we may bury him
  simplified_phrase: If he is dead, we will bury him
  preserved_meaning: They intend to bury him if he is no longer alive.
  reasoning_layer_used: Immediate context and POB lexical decision for ἵνα θάψωμεν αὐτόν
  rationale: The direct condition and future intention are clearer than the elliptical purpose clause.
- pob_phrase: and no one may know
  simplified_phrase: so that no one finds out
  preserved_meaning: Their intended burial is to be kept secret.
  reasoning_layer_used: POB lexical decision for μηδεὶς γνῷ
  rationale: The purpose wording clearly links secrecy to their burial plan.
