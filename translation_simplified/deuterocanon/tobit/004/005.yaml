translation:
  language: en
  text: Child, always remember the Lord our God. Do not choose to break his commandments. Practice righteousness[a] throughout your life—keep doing what is right. Do not follow paths of wrongdoing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This can also be translated, “Practice justice ... do not follow paths of injustice.” The Greek terms can carry both personal-moral and social-ethical force.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: All the days, child, remember the Lord our God
  simplified_phrase: Child, always remember the Lord our God
  preserved_meaning: The child must continually keep the Lord in mind.
  reasoning_layer_used: Lexical decision for μνημόνευε and the repeated time expression
  rationale: “Always” expresses the ongoing command in natural English.
- pob_phrase: Do not desire to transgress his commandments
  simplified_phrase: Do not choose to break his commandments
  preserved_meaning: The warning concerns willing disobedience, not merely an accidental failure.
  reasoning_layer_used: Lexical decision for μὴ θελήσῃς παραβῆναι
  rationale: “Choose to break” preserves both volition and violation in common wording.
- pob_phrase: do not walk in the ways of unrighteousness
  simplified_phrase: Do not follow paths of wrongdoing
  preserved_meaning: The path image and warning against an unrighteous way of life remain intact.
  reasoning_layer_used: Lexical decisions for μὴ πορευθῇς and ταῖς ὁδοῖς τῆς ἀδικίας
  rationale: “Follow paths” keeps the conduct metaphor while clarifying its moral sense.
interpretive_expansions:
- pob_phrase: Practice righteousness
  rendering: Practice righteousness ... keep doing what is right
  claim: Righteousness here describes a continuing pattern of right conduct.
  evidence:
  - The lexical rationale identifies habitual ethical action in the Greek idiom.
  - The command extends throughout the person’s life.
  confidence: high
  alternatives_preserved:
  - practice justice
translation_notes:
  risk_flags:
  - risk: “Doing what is right” alone could narrow righteousness to personal morality.
    mitigation: The text retains “righteousness,” and the footnote preserves the possible social dimension of justice.
