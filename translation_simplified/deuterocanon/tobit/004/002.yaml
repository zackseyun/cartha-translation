translation:
  language: en
  text: He said to himself, “I have asked to die. So why not call my son Tobiah and give him instructions before I die?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Another tradition adds that Tobit wanted to tell Tobiah about the money he had left with Gabael.
    reason: alternative_reading
