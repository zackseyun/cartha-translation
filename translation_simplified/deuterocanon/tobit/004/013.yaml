translation:
  language: en
  text: And now, child, love your brothers. Do not become proud in your heart or think you are above your brothers and the sons and daughters of your people when taking a wife from among them.[a] Pride brings ruin and great disorder. Idleness brings decline and severe need, for idleness is the mother of famine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The compressed Greek may instead mean, “Do not be haughty toward your brothers and the sons and daughters of your people when taking a wife from among them.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: do not become proud in your heart over
  simplified_phrase: do not become proud in your heart or think you are above
  preserved_meaning: The warning concerns inward pride that exalts oneself over others.
  reasoning_layer_used: Lexical decisions for ὑπερηφάνευε, τῇ καρδίᾳ σου, and ἀπό.
  rationale: The added clause plainly explains what being proud “over” others means.
- pob_phrase: so as to take a wife for yourself from among them
  simplified_phrase: when taking a wife from among them
  preserved_meaning: The marriage choice remains linked to pride toward one’s own people without imposing a broader doctrine.
  reasoning_layer_used: Theological decision and alternative-reading footnote.
  rationale: The main text reads naturally while the footnote preserves the supported syntactic alternative.
- pob_phrase: in idleness there is decline and great want
  simplified_phrase: Idleness brings decline and severe need
  preserved_meaning: Unproductive inactivity results in diminishing circumstances and serious deprivation.
  reasoning_layer_used: Lexical decisions for ἀχρειότης, ἐλάττωσις, and ἔνδεια μεγάλη.
  rationale: A direct cause-and-result sentence makes the wisdom saying easier to grasp.
interpretive_expansions:
- pob_phrase: proud in your heart over
  rendering: proud in your heart or think you are above
  claim: The pride involves regarding oneself as superior to one’s kin and people.
  evidence:
  - The lexical rationale explains ἀπό as elevation over others in this context.
  - The theological decision links pride toward one’s kin with choosing a wife.
  confidence: high
  alternatives_preserved:
  - be haughty toward
translation_notes:
  risk_flags:
  - risk: The compressed marriage clause allows more than one relation to the warning against pride.
    mitigation: The footnote preserves the audit-supported alternative without introducing reluctance to marry.
  - risk: “Idleness” is more specific than the possible sense “uselessness.”
    mitigation: The POB lexical rationale favors unproductive inactivity because the context mentions need and famine.
