simplification_decisions:
- pob_phrase: And do not be afraid, child, because we have become poor
  simplified_phrase: Child, do not be afraid because we have become poor.
  preserved_meaning: The affectionate command directly addresses fear caused by the family’s new poverty.
  reasoning_layer_used: Lexical decisions for παιδίον, μὴ φοβοῦ, and ἐπτωχεύσαμεν, with the POB’s causal syntax.
  rationale: Placing the address first improves flow while retaining the explicit reason introduced by “because.”
- pob_phrase: do what is pleasing before him
  simplified_phrase: do what pleases him
  preserved_meaning: The child must act in ways God approves.
  reasoning_layer_used: Lexical decisions for ποιήσῃς τὸ ἀρεστὸν and ἐνώπιον αὐτοῦ.
  rationale: The direct clause communicates divine approval without the less familiar wording “before him.”
translation_notes:
  risk_flags:
  - risk: “You have much” could be mistaken for a guarantee of material prosperity.
    mitigation: The broad wording and footnote preserve the ambiguity without promising material wealth.
  - risk: “Fear God” may sound like mere terror to modern readers.
    mitigation: The phrase remains because it preserves the source’s established theological weight of reverent fear.
