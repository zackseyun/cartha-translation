translation:
  language: en
  text: Do not do to anyone what you hate.[a] Do not drink wine until you are drunk. Do not let drunkenness accompany you as you go.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Do not do to anyone what is hateful to you.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And what you hate, do to no one.
  simplified_phrase: Do not do to anyone what you hate.
  preserved_meaning: The universal negative form of the reciprocity principle remains intact.
  reasoning_layer_used: POB lexical and theological decisions on ὃ μισεῖς, μηδενὶ, and ποίησης
  rationale: Ordinary English clause order makes the maxim immediately clear.
- pob_phrase: Do not drink wine to drunkenness
  simplified_phrase: Do not drink wine until you are drunk.
  preserved_meaning: The prohibition concerns drinking wine to the point of intoxication.
  reasoning_layer_used: POB lexical decision on εἰς μέθην
  rationale: The result expressed by “to drunkenness” is clearer as “until you are drunk.”
- pob_phrase: do not let drunkenness go with you on your way
  simplified_phrase: Do not let drunkenness accompany you as you go.
  preserved_meaning: Drunkenness remains personified as something that travels with a person.
  reasoning_layer_used: POB lexical decisions on μὴ πορευθήτω μετὰ σοῦ μέθη and ἐν τῇ ὁδῷ σου
  rationale: The revision keeps the journey image while using smoother English.
translation_notes:
  risk_flags:
  - risk: “As you go” may be heard only as physical travel rather than one’s broader course of life.
    mitigation: Its open wording preserves both the travel image and the possible life-journey sense.
