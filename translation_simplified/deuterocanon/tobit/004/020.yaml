translation:
  language: en
  text: Now I am telling you[a] about ten talents of silver[b] that I left for safekeeping with Gabael, son of Gabrias, in Rages, in the region of Media.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “I am showing you” or “I am making this known to you.”
    reason: lexical_alternative
  - marker: b
    text: A talent was an ancient unit of weight used to measure precious metals.
    reason: cultural_note
simplification_decisions:
- pob_phrase: I am showing you
  simplified_phrase: I am telling you about
  preserved_meaning: Tobit is drawing attention to the existence of the silver, not necessarily displaying it.
  reasoning_layer_used: POB lexical decision for ἐπιδεικνύω
  rationale: This expresses the contextual sense naturally while the footnote preserves the verb’s range.
- pob_phrase: the ten talents of silver
  simplified_phrase: ten talents of silver
  preserved_meaning: The exact ancient measure and the metal are retained.
  reasoning_layer_used: POB lexical decision for τὰ δέκα τάλαντα τοῦ ἀργυρίου
  rationale: The footnote explains the unfamiliar measure without adding an evaluation to the text.
- pob_phrase: I deposited with
  simplified_phrase: I left for safekeeping with
  preserved_meaning: Tobit placed the silver in Gabael’s care as a deposit.
  reasoning_layer_used: POB lexical rationale for παρεθέμην
  rationale: This plainly explains what depositing the silver involved.
translation_notes:
  risk_flags:
