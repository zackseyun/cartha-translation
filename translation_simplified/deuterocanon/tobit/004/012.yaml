translation:
  language: en
  text: Guard yourself, child, from all sexual immorality. First, marry a woman from your own ancestral line. Do not marry a foreign woman—one who is outside your father’s tribe—because we are sons of the prophets.[a] Remember our ancestors from long ago—Noah, Abraham, Isaac, and Jacob. They all married within their own kin group.[b] They were blessed in their children,[c] and their descendants will inherit the land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “we are descendants of the prophets.” The Greek literally says “sons of the prophets.”
    reason: alternative_reading
  - marker: b
    text: The Greek literally says they took wives “from among their brothers,” meaning from among their close relatives or clan.
    reason: lexical_alternative
  - marker: c
    text: This may also mean they were blessed through their children or with children.
    reason: lexical_alternative
