  reasoning_layer_used: POB lexical decision for Ἐν τῇ ἡμέρᾳ ἐκείνῃ
  rationale: Removing “On” makes the opening more direct without changing the time reference.
- pob_phrase: the silver
  simplified_phrase: the silver money
  preserved_meaning: The funds consisted of silver, whether coined or weighed.
  reasoning_layer_used: POB lexical decision and footnote for ἀργύριον
  rationale: “Silver money” keeps the Greek image while immediately explaining its financial sense.
- pob_phrase: that he had deposited with Gabael
  simplified_phrase: he had left in Gabael’s care
  preserved_meaning: Tobit had entrusted the funds to Gabael for safekeeping.
  reasoning_layer_used: POB lexical decision for ὃ παρέθετο
  rationale: The new wording expresses the personal deposit arrangement in familiar English.
