translation:
  language: en
  text: If you live truthfully, what you do will go well. Things will also go well for everyone who does what is right.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “practices justice.” The Greek word can refer broadly to righteous or just conduct.
    reason: lexical_alternative
