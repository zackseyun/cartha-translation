  preserved_meaning: Truthful conduct leads to a favorable outcome in one’s undertakings.
  reasoning_layer_used: POB lexical decisions and footnote b
  rationale: This replaces formal wording without limiting success to material wealth.
- pob_phrase: all who practice righteousness
