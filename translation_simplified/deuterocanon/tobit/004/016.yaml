translation:
  language: en
  text: Give some of your bread to the hungry and some of your clothing to those without enough clothing. Whatever you have beyond what you need, use it to help the poor. When you give, do not begrudge it.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “do not let your eye be envious”; this image describes resenting what you give.
    reason: simplification_note
simplification_decisions:
- pob_phrase: Give from your bread to the hungry, and from your clothing to the naked
  simplified_phrase: Give some of your bread to the hungry and some of your clothing to those without enough clothing
  preserved_meaning: Share your own food and clothing with people who lack these necessities.
  reasoning_layer_used: Lexical decisions for ἄρτος, ἱμάτια, and γυμνός
  rationale: The wording makes the recipients’ need explicit without deciding whether they are fully naked or poorly clothed.
- pob_phrase: Whatever may abound to you, do as almsgiving
  simplified_phrase: Whatever you have beyond what you need, use it to help the poor
  preserved_meaning: Use surplus possessions as concrete aid for poor people.
  reasoning_layer_used: Lexical and theological decisions for περισσεύω and ἐλεημοσύνη
  rationale: This replaces difficult almsgiving language while retaining its specific charitable purpose.
- pob_phrase: do not let your eye be envious when you do almsgiving
  simplified_phrase: When you give, do not begrudge it
  preserved_meaning: Do not resent giving aid to people in need.
  reasoning_layer_used: Lexical explanation of the eye-idiom and its POB footnote
  rationale: The main text states the idiom’s natural English sense, while the footnote preserves its vivid source image.
interpretive_expansions:
- pob_phrase: Whatever may abound to you
  rendering: Whatever you have beyond what you need
  claim: The abundance refers to surplus beyond immediate need.
  evidence:
  - The POB lexical rationale explicitly identifies the phrase as what one has beyond immediate need.
  confidence: high
  alternatives_preserved:
  - Whatever you have in abundance
  - Whatever is left over for you
- pob_phrase: do as almsgiving
  rendering: use it to help the poor
  claim: The command concerns concrete aid directed to poor people.
  evidence:
  - The theological rationale defines ἐλεημοσύνη here as charitable giving to the poor.
  - The surrounding commands identify hungry and inadequately clothed people as recipients.
  confidence: high
  alternatives_preserved:
  - give alms
  - use it for charitable giving
translation_notes:
  risk_flags:
  - risk: “Beyond what you need” may seem more precisely defined than the Greek idea of abundance.
    mitigation: The wording follows the POB lexical rationale without specifying how need is measured.
  - risk: Rendering the eye-idiom directly could hide the source image.
    mitigation: The footnote retains the literal image and explains its force.
