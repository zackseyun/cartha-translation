translation:
  language: en
  text: Take a servant and two camels along with you. Go to Gabael in Rages, in the region of Media. Bring the money back to me, and bring Gabael with you to the wedding.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “wedding feast.” The Greek word can refer to the marriage or its celebration.
    reason: lexical_alternative
