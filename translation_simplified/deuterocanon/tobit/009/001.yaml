  reasoning_layer_used: Greek source and lexical decision for ἐκάλεσεν
  rationale: Removing “to him” avoids repetition while keeping Raphael as the direct object of “called.”
- pob_phrase: Azariah, brother
  simplified_phrase: Azariah, my brother
  preserved_meaning: Tobiah warmly addresses Raphael by his assumed name without asserting biological kinship.
  reasoning_layer_used: Lexical decisions for Ἀζαρία and ἀδελφέ
  rationale: The possessive makes the direct address natural while preserving the source’s brother language.
