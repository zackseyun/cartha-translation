  simplified_phrase: He went inside and told his father
  preserved_meaning: He entered and reported his discovery to his father.
  reasoning_layer_used: POB lexical decision for εἰσελθὼν and immediate context
  rationale: The rewrite gives the action in ordinary English without changing its sequence.
- pob_phrase: someone who will travel with me
  simplified_phrase: someone to travel with me
  preserved_meaning: He has found a companion for the journey.
  reasoning_layer_used: POB lexical decision for ὃς συμπορεύσεταί μοι
  rationale: The shorter infinitive construction expresses the same purpose naturally.
- pob_phrase: so that I may learn what tribe he is from
  simplified_phrase: so I can find out which tribe he belongs to
  preserved_meaning: The father wants to determine the man’s Israelite tribal identity.
  reasoning_layer_used: POB lexical and theological decisions for ἐπιγνῶ and φυλή
  rationale: Common wording clarifies the purpose while retaining the specific ancestral category of tribe.
