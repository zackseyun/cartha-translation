translation:
  language: en
  text: He went inside and told his father, “Look, I have found someone to travel with me.” His father said, “Call him to me, so I can find out which tribe he belongs to[a] and whether he is trustworthy to go with you.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This refers to his ancestral tribe within Israel.
    reason: cultural_note
