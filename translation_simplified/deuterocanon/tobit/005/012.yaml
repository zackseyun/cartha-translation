translation:
  language: en
  text: He said to Tobit, “What are you looking for—information about my tribe and family ancestry, or a man you can hire to travel with your son?” Tobit answered, “I want to know, brother.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Brother” is a courteous form of address here; the Greek reply is literally, “I want, brother,” with “to know” understood from the question.
    reason: source_note
