translation:
  language: en
  text: He said to him, “May you travel in good health, brother.[a] Please do not be angry that I asked about your tribe and family. I have now learned that you are indeed my brother, from a good and noble family line. I knew Ananias and Jathan, the sons of Shemaiah the great. We used to travel together to Jerusalem to worship, bringing the firstborn animals and one-tenth portions of the crops. They did not join our brothers in their error.[b] Brother, you come from a good root.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek wish may also be translated “May you arrive safely” or “Go in health.”
    reason: lexical_alternative
  - marker: b
    text: “Our brothers” means their fellow Israelites, not only male siblings.
    reason: lexical_alternative
