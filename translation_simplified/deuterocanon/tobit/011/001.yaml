translation:
  language: en
  text: After these events, Tobiah continued his journey. He blessed God for making his journey successful, and he kept blessing Raguel and Raguel’s wife, Edna. Tobiah continued on until they came near Nineveh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek is awkward here. It may instead mean “until he came near Nineveh.”
    reason: textual_variant
