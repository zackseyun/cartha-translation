  reasoning_layer_used: Source payload, lexical decisions for ἔγχρισον and χολή, and immediate narrative context
  rationale: “Put” clearly expresses the act of applying the medicinal substance.
- pob_phrase: when it stings, he will rub them
  simplified_phrase: When it stings, he will rub his eyes
  preserved_meaning: The gall causes a sharp sensation that leads him to rub his eyes.
  reasoning_layer_used: Lexical decisions for δηχθεὶς and διατρίψει
  rationale: Naming the eyes removes the unclear pronoun while retaining the vivid sting.
- pob_phrase: the white films will come away, and he will see you
