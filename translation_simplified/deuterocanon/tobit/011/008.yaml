translation:
  language: en
  text: Put the fish’s gall[a] on his eyes. When it stings, he will rub his eyes, and the white films[b] will come away. Then he will see you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “bile”; it is used here as a medicine.
    reason: lexical_alternative
  - marker: b
    text: This means whitish films, spots, or patches on the eyes, not necessarily cataracts in the modern medical sense.
    reason: lexical_alternative
