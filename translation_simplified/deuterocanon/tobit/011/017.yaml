  preserved_meaning: Tobit publicly expressed gratitude for God's mercy while the people denoted by “them” were present.
  reasoning_layer_used: Lexical and theological decisions on ἐξωμολογεῖτο
  rationale: The reordered clause is easier to follow without expanding “them” to everyone.
- pob_phrase: when Tobit came near to Sarah his daughter-in-law
