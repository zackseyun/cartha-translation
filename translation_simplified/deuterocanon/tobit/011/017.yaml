translation:
  language: en
  text: In front of them, Tobit gave thanks because God had shown them mercy. When he approached Sarah, his daughter-in-law, he blessed her, saying, “May you come in good health, daughter. Blessed is God, who has brought you to us, and your father and your mother.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek ends abruptly with “and your father and your mother.” It may imply that they too are blessed, but no verb is stated.
    reason: alternative_reading
