  preserved_meaning: Tobit blessed Sarah as he came near her, and she was his daughter-in-law.
  reasoning_layer_used: Lexical decisions on καὶ ὡς ἤγγισεν and νύμφη
  rationale: “When he approached” uses ordinary English while preserving the timing and relationship.
- pob_phrase: he blessed her, saying
