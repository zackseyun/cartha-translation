translation:
  language: en
  text: Raphael said to Tobiah, “Brother, do you not remember the condition your father was in when you left him?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says more briefly, “Do you not know, brother, how you left your father?” It does not explicitly mention his blindness.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Do you not know, brother
  simplified_phrase: Brother, do you not remember
  preserved_meaning: Raphael warmly prompts Tobiah to recall something he already knows.
  reasoning_layer_used: POB lexical decision for Οὐ γινώσκεις and ἀδελφέ
  rationale: “Remember” makes the contextual sense of the question clearer while retaining “brother.”
- pob_phrase: how you left your father
  simplified_phrase: the condition your father was in when you left him
  preserved_meaning: The question concerns the father’s condition at Tobiah’s departure without naming that condition.
  reasoning_layer_used: POB lexical decision for πῶς and theological decision on the shorter Greek reading
  rationale: The recasting explains the implied sense of “how” but does not import the parallel tradition’s explicit reference to blindness.
interpretive_expansions:
- pob_phrase: how you left your father
  rendering: the condition your father was in when you left him
  claim: The Greek question points to the father’s condition rather than merely the manner of Tobiah’s departure.
  evidence:
  - The POB lexical rationale says πῶς can refer to manner or condition.
  - The surrounding narrative and Semitic parallel identify the father’s condition as the implied concern.
  confidence: high
  alternatives_preserved:
  - how you left your father
  - how it was when you left your father
  external_witnesses:
  - Neubauer’s 1878 indirect Hebrew back-translation makes the father’s blindness explicit.
translation_notes:
  risk_flags:
  - risk: “Remember” is more specific than the Greek verb’s basic sense “know.”
    mitigation: The footnote preserves the more literal wording, and the POB lexical audit recognizes “remember” as contextually possible.
  - risk: “The condition” may lead readers to infer the father’s blindness.
    mitigation: The text leaves the condition unnamed, following the Greek rather than the fuller parallel tradition.
