translation:
  language: en
  text: Tobit went out to Nineveh’s city gate to meet his daughter-in-law.[a] As he went, he rejoiced and blessed God. The people who saw him walking were amazed because he could see.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek term can mean “bride” or “daughter-in-law”; here it refers to Sarah, the wife of Tobit’s son.
    reason: lexical_alternative
  - marker: b
    text: The Greek uses the name form “Tōbeias,” but the context identifies this man as the elder Tobit, whose sight had been restored.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: at the gate of Nineveh
  simplified_phrase: to Nineveh’s city gate
  preserved_meaning: The meeting takes place at the gate of Nineveh.
  reasoning_layer_used: Lexical decision for πρὸς τῇ πύλῃ Νινευή
  rationale: “City gate” identifies the location clearly for modern readers.
- pob_phrase: rejoicing and blessing God
  simplified_phrase: As he went, he rejoiced and blessed God.
  preserved_meaning: Tobit rejoices and blesses God while going to meet his daughter-in-law.
  reasoning_layer_used: Lexical decisions for χαίρων and εὐλογῶν τὸν θεόν
  rationale: The time clause preserves the participles’ connection to Tobit’s movement.
- pob_phrase: those who saw him walking were amazed
  simplified_phrase: The people who saw him walking were amazed
  preserved_meaning: Onlookers are amazed when they see Tobit walking and able to see.
  reasoning_layer_used: Lexical decisions for θεωροῦντες, πορευόμενον, and ἐθαύμαζον
  rationale: The relative clause avoids implying that they deliberately watched him.
translation_notes:
  risk_flags:
  - risk: The Greek name form could be mistaken for Tobias the son.
    mitigation: The text follows the narrative identification of the healed father, and footnote b records the issue.
  - risk: “Daughter-in-law” resolves a Greek term that can also mean “bride.”
    mitigation: The family context identifies Sarah as Tobit’s daughter-in-law, while footnote a preserves the alternative.
