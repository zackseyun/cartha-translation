translation:
  language: en
  text: 'Then he said to his daughter, “Honor your parents-in-law, for they are now your parents too. May I hear good reports about you.” Then he kissed her.


    Edna said to Tobiah, “My dear brother, may the Lord of heaven bring you back safe and well.[a] May he let me see children born to you and to my daughter Sarah, so that I may rejoice before the Lord. I now place my daughter in your care, entrusted to you like a deposit.[b] Do not cause her sorrow.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “restore you” more broadly.
    reason: lexical_alternative
  - marker: b
    text: The Greek uses the image of a deposit entrusted to someone for safekeeping.
    reason: simplification_note
simplification_decisions:
- pob_phrase: may the Lord of heaven restore you
  simplified_phrase: may the Lord of heaven bring you back safe and well
  preserved_meaning: The blessing asks God to restore Tobiah, likely including his safe return and well-being.
  reasoning_layer_used: POB lexical decision and travel context
  rationale: The main text gives the likely contextual sense, while the footnote preserves the broader meaning.
- pob_phrase: may he grant me to see children from you and from Sarah my daughter
  simplified_phrase: May he let me see children born to you and to my daughter Sarah
  preserved_meaning: Edna hopes to see children whose parents are Tobiah and Sarah.
  reasoning_layer_used: POB lexical rationale for bilateral parentage
  rationale: Natural birth language clearly expresses that the children come from both parents.
- pob_phrase: I entrust my daughter to you as a deposit; do not grieve her
  simplified_phrase: I now place my daughter in your care, entrusted to you like a deposit. Do not cause her sorrow.
  preserved_meaning: Edna solemnly commits Sarah to Tobiah’s care and commands him not to distress her.
  reasoning_layer_used: POB lexical decisions for παρατίθεμαί, παρακαταθήκῃ, and λυπέω
  rationale: The wording clarifies the custody image without adding a value judgment and makes the command natural.
interpretive_expansions:
- pob_phrase: restore you
  rendering: bring you back safe and well
  claim: In this departure scene, restoration likely includes safe return and continued well-being.
  evidence:
