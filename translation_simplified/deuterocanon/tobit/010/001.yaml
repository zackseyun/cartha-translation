translation:
  language: en
  text: Each day, his father Tobit counted the passing days. When the expected time for the journey had passed and they still had not returned,
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And Tobit his father counted each day
  simplified_phrase: Each day, his father Tobit counted the passing days
  preserved_meaning: Tobit kept track of the days as he waited.
  reasoning_layer_used: POB lexical decisions for ἐλογίζετο and ἑκάστης ἡμέρας
  rationale: The rewrite makes the object of “counted” clear while preserving the concrete sense of tracking time.
- pob_phrase: the days of the journey were completed
  simplified_phrase: the expected time for the journey had passed
  preserved_meaning: The normal amount of travel time had elapsed.
  reasoning_layer_used: POB lexical rationale for αἱ ἡμέραι τῆς πορείας and ἐπληρώθησαν
  rationale: This states the time reference in ordinary English without suggesting theological fulfillment.
- pob_phrase: they were not coming back
  simplified_phrase: they still had not returned
  preserved_meaning: Tobit continued waiting after their expected arrival time.
  reasoning_layer_used: POB lexical decision for οὐκ ἤρχοντο and footnote a
  rationale: “Still” preserves the imperfect sense of an arrival that remained overdue.
