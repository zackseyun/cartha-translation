translation:
  language: en
  text: Afterward, Tobiah continued on his journey. He blessed God for giving him success on the journey, and he continued to bless Raguel and Raguel’s wife, Edna. He traveled on until they came near Nineveh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek wording is awkward, but the apparent sense is that the travelers came near Nineveh.
    reason: textual_variant
