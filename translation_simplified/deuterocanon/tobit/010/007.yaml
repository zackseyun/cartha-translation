  simplified_phrase: Don’t give me false hope
  preserved_meaning: Anna rejects reassurance without accusing him of deliberate deceit.
  reasoning_layer_used: POB lexical decision for μὴ πλάνα με
  rationale: The contextual wording makes her distressed response immediately clear.
- pob_phrase: the road by which he had departed
  simplified_phrase: the road he had taken
  preserved_meaning: She repeatedly returns to the route Tobias used when he left.
  reasoning_layer_used: POB lexical rationale for εἰς τὴν ὁδὸν ἔξω οἵας ἀπῆλθεν
  rationale: The simpler clause preserves the route image without formal syntax.
- pob_phrase: until the fourteen days of the wedding feast were completed, which Raguel had sworn that he should spend there
  simplified_phrase: until the fourteen-day wedding feast ended—the time Raguel had sworn Tobias would stay there
  preserved_meaning: Raguel had bound Tobias to remain through the full celebration period.
  reasoning_layer_used: POB lexical decisions for συνετελέσθησαν and ἃς ὤμοσεν Ῥαγουὴλ
  rationale: The recast sentence identifies Tobias clearly and removes the compressed construction.
