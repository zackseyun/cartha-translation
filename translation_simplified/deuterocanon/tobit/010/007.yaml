translation:
  language: en
  text: She told him, “Be quiet. Don’t give me false hope. My child is gone.[a]” Every day she went out to the road he had taken. During the day she ate no bread, and at night she never stopped mourning for her son Tobias. This continued until the fourteen-day wedding feast ended—the time Raguel had sworn Tobias would stay there.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may mean “is lost” or “has died.” This is her fearful conclusion, not the narrator’s report.
    reason: lexical_alternative
