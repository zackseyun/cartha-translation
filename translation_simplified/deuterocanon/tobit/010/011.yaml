translation:
  language: en
  text: Then Raguel got up. He gave him his wife Sarah and half of everything he owned—servants,[a] livestock, and silver. Raguel blessed them and sent them on their way, saying, “Children, may the God of heaven prosper you before I die.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “slaves”; the Greek literally says “bodies” in this list of property.
    reason: lexical_alternative
  - marker: b
    text: Or “The God of heaven will prosper you”; the Greek future form can also express a blessing.
    reason: alternative_reading
