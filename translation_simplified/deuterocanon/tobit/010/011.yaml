  rationale: “Got up” expresses the narrative action in everyday English.
- pob_phrase: half of his possessions
  simplified_phrase: half of everything he owned
  preserved_meaning: Raguel gave half of his property.
  reasoning_layer_used: POB lexical decision for τὰ ἥμισυ τῶν ὑπαρχόντων
  rationale: The new wording makes the extent of the gift immediately clear.
- pob_phrase: after blessing them he sent them away
  simplified_phrase: Raguel blessed them and sent them on their way
