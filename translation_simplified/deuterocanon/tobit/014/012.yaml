translation:
  language: en
  text: After Hanna died, he[a] buried her with his father. Then Tobias left with his wife and sons. They went to Raguel, his father-in-law, in Ecbatana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek does not name who buried Hanna; the next sentence explicitly names Tobias.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And when Hanna died
  simplified_phrase: After Hanna died
  preserved_meaning: Hanna’s death occurred before her burial and Tobias’s departure.
  reasoning_layer_used: POB lexical decision for ἀπέθανεν and narrative sequence
  rationale: “After” states the sequence more directly in natural English.
- pob_phrase: Then Tobias went away with his wife and his sons to Ecbatana, to Raguel his father-in-law.
  simplified_phrase: Then Tobias left with his wife and sons. They went to Raguel, his father-in-law, in Ecbatana.
  preserved_meaning: Tobias departed with his wife and sons for Ecbatana to Raguel.
  reasoning_layer_used: POB lexical decisions for ἀπῆλθεν, υἱῶν, Ἐκβάτανα, and πρὸς Ῥαγουὴλ
  rationale: Two short sentences clarify the travelers, destination, and family relationship.
