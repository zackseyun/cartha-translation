translation:
  language: en
  text: God will again have mercy on them and bring them back to the land. They will rebuild the house, but it will not be like the former one. It will remain that way until the appointed times of the age are complete.[a] After that, they will return from captivity[b] and rebuild Jerusalem with honor. God’s house within her[c] will be built with glory, just as the prophets said about her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This phrase points to God’s future appointed times but does not specify a particular end-times sequence.
    reason: lexical_alternative
  - marker: b
    text: The Greek says “captivities,” possibly referring to more than one place or period of exile.
    reason: source_note
  - marker: c
    text: Jerusalem is pictured as a woman here, so the verse refers to the city as “her.”
    reason: cultural_note
simplification_decisions:
- pob_phrase: they will build the house, though not like the former one
  simplified_phrase: They will rebuild the house, but it will not be like the former one.
  preserved_meaning: The restored house of God will differ from the earlier one.
  reasoning_layer_used: POB lexical and theological decisions on “the house” and the comparison
  rationale: “Rebuild” makes the restoration context clear while retaining the biblical image of the house.
- pob_phrase: until the times of the age are fulfilled
  simplified_phrase: It will remain that way until the appointed times of the age are complete.
  preserved_meaning: The house’s lesser or different condition lasts until God’s undefined future times reach completion.
  reasoning_layer_used: POB lexical rationale and theological decision on the temporal phrase
  rationale: The wording clarifies the sentence while keeping “the age” and its deliberate eschatological openness.
- pob_phrase: return from the captivities and build Jerusalem honorably
  simplified_phrase: return from captivity and rebuild Jerusalem with honor
  preserved_meaning: The people will return from exile and restore Jerusalem in an honorable way.
  reasoning_layer_used: POB lexical decisions on captivities and honorably
  rationale: Natural English replaces the awkward plural and adverb, while a footnote preserves the Greek plurality.
