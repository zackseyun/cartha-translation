translation:
  language: en
  text: 'Go to Media, my child. I am convinced that Jonah the prophet’s words about Nineveh will come true: the city will be overthrown. But Media will have peace for a time.[a] Our Israelite brothers will be scattered from the good land. Jerusalem will be left desolate, and God’s temple there will be burned down. The temple will remain desolate for a time.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may mean that Media will have more peace than other places, not complete peace.
    reason: lexical_alternative
