translation:
  language: en
  text: He grew old as an honored man. He buried his wife’s parents with honor.[a] He inherited their property and the property of his father, Tobit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “gloriously” or “splendidly”; here it means that he gave them an honorable burial.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: grew old honorably
  simplified_phrase: grew old as an honored man
  preserved_meaning: He advanced into old age with honor and esteem.
  reasoning_layer_used: Lexical decisions for ἐγήρασεν and ἐντίμως
  rationale: The recast phrase makes the social sense of “honorably” immediately clear.
- pob_phrase: his parents-in-law
  simplified_phrase: his wife’s parents
  preserved_meaning: He buried both of his wife’s parents.
  reasoning_layer_used: Lexical decision for τοὺς πενθεροὺς αὐτοῦ
  rationale: The explicit family relationship is easier for a common reader to picture.
- pob_phrase: their property and that of Tobit his father
  simplified_phrase: their property and the property of his father, Tobit
  preserved_meaning: He inherited both estates, including the one belonging to his father Tobit.
  reasoning_layer_used: Lexical decisions for οὐσία and the appended paternal estate
  rationale: Repeating “property” removes an elliptical construction and clarifies Tobit’s identity.
