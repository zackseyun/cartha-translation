- pob_phrase: he heard of the destruction of Nineveh
  simplified_phrase: he heard that Nineveh had been destroyed
  preserved_meaning: He learned before his death that Nineveh had suffered destruction.
  reasoning_layer_used: Lexical decisions for ἤκουσεν and ἀπωλίαν
  rationale: A direct clause is clearer than the abstract phrase “heard of the destruction.”
- pob_phrase: which Nebuchadnezzar and Ahasuerus had taken captive
  simplified_phrase: Nebuchadnezzar and Ahasuerus had taken its people captive
  preserved_meaning: The named rulers subjected Nineveh’s people to captivity.
  reasoning_layer_used: Lexical rationale for ᾐχμαλώτισεν and theological decision on the named rulers
  rationale: Naming the people makes the captivity image natural while retaining both rulers.
- pob_phrase: before dying, he rejoiced over Nineveh
  simplified_phrase: He rejoiced over Nineveh before he died
  preserved_meaning: His rejoicing over Nineveh occurred before his death.
  reasoning_layer_used: Lexical decision for the temporal construction and ἐχάρη
  rationale: The direct verbal phrase avoids an awkward repetition of “before his death.”
