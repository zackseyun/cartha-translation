translation:
  language: en
  text: Every nation will bless the Lord.[a] His people will thank God, and the Lord will raise his people to a place of honor. Everyone who sincerely loves the Lord God and lives righteously will rejoice as they show mercy to our brothers.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “will praise the Lord.”
    reason: lexical_alternative
  - marker: b
    text: “Our brothers” may refer more broadly to fellow members of one’s family or community.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: all the nations
  simplified_phrase: every nation
  preserved_meaning: The universal scope remains unchanged.
  reasoning_layer_used: lexical decision for πάντα τὰ ἔθνη
  rationale: The singular collective form is more direct in modern English.
- pob_phrase: will give thanks to God
  simplified_phrase: will thank God
  preserved_meaning: God’s people respond to him with thanksgiving.
  reasoning_layer_used: lexical decision for ἐξομολογήσεται
  rationale: The simpler verb expresses the same worship response.
- pob_phrase: showing mercy to our brothers
  simplified_phrase: as they show mercy to our brothers
  preserved_meaning: Those who rejoice also act mercifully toward their brothers.
  reasoning_layer_used: lexical decision for ποιοῦντες ἔλεος and source syntax
  rationale: A finite clause makes the participial phrase easier to follow.
interpretive_expansions:
- pob_phrase: the Lord will exalt his people
  rendering: the Lord will raise his people to a place of honor
  claim: Exalting combines an upward image with the granting of honor.
  evidence:
  - The lexical rationale identifies both the upward metaphor and the honorific sense.
  confidence: high
  alternatives_preserved:
  - the Lord will exalt his people
- pob_phrase: love the Lord God in truth and righteousness
  rendering: sincerely loves the Lord God and lives righteously
  claim: Truth characterizes sincere love, while righteousness includes upright conduct.
  evidence:
  - The lexical rationale says the phrase describes the manner or sphere of loving God.
  - The theological rationale identifies righteousness as uprightness in devotion and conduct.
  confidence: high
  alternatives_preserved:
  - in truth and righteousness
  - in truth and justice
