translation:
  language: en
  text: Bury me properly, and bury your mother with me too. Do not stay in Nineveh any longer. Child, see what Nadab[a] did to Ahikar, the man who had raised him. Nadab brought Ahikar from the light into the darkness, repaying his care with all this harm. Ahikar was saved, but Nadab was paid back for what he had done and went down into the darkness. Manasseh did acts of mercy[b] and was saved from the deadly snare Nadab had set for him. But Nadab fell into that trap and perished.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek form of this name is “Adam,” but it refers to the treacherous courtier Nadab, not the first man Adam.
    reason: alternative_reading
  - marker: b
    text: Or “gave help to the poor”; the Greek term often refers specifically to charitable giving in Tobit.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and your mother with me
  simplified_phrase: and bury your mother with me too
  preserved_meaning: His mother is also to be buried together with Tobit, without specifying the arrangement.
  reasoning_layer_used: Source syntax and burial context
  rationale: Repeating “bury” clarifies the command while “with me” avoids adding a side-by-side arrangement.
- pob_phrase: who had reared him
  simplified_phrase: the man who had raised him
  preserved_meaning: Ahikar cared for Nadab throughout his upbringing.
  reasoning_layer_used: POB lexical decision for τῷ θρέψαντι αὐτόν
  rationale: “Raised” is more familiar than “reared” and naming the relationship clarifies the participants.
- pob_phrase: received the repayment
  simplified_phrase: was paid back for what he had done
  preserved_meaning: Nadab received just recompense for his treachery.
  reasoning_layer_used: POB lexical decision for the repeated ἀνταποδ- wordgroup
  rationale: The repeated language of repayment remains clear and natural in English.
interpretive_expansions:
- pob_phrase: how he brought him from the light into the darkness, and all that he repaid him
  rendering: Nadab brought Ahikar from the light into the darkness, repaying his care with all this harm.
  claim: Nadab answered Ahikar’s care with comprehensive treachery and harm.
  evidence:
  - Ahikar had raised Nadab.
  - The movement from light into darkness portrays the damaging result.
  - The POB revision preserves the comprehensive force of “all that.”
  confidence: high
  alternatives_preserved:
  - The darkness image remains open to death, disgrace, or danger.
translation_notes:
  risk_flags:
  - risk: Readers may interpret “saved” as eternal salvation.
    mitigation: The deadly snare and trap language keeps the immediate sense focused on rescue from mortal danger.
  - risk: The darkness image can carry several related meanings.
    mitigation: The image is retained without limiting it to death, disgrace, or danger.
