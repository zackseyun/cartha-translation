translation:
  language: en
  text: “Now, children, see what giving to the poor accomplishes and how righteousness rescues.[a]” As he was saying these things, he died in bed. He was 158 years old. Then his son Tobias buried him with honor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “how justice rescues.” The Greek word can mean either righteousness or justice here.
    reason: lexical_alternative
  - marker: b
    text: The Greek uses a singular verb, indicating that one person buried him; the context identifies him as Tobias.
    reason: textual_variant
