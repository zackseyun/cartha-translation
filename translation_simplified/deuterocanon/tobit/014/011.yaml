  simplified_phrase: giving to the poor
  preserved_meaning: The phrase still refers to concrete help given to needy people.
  reasoning_layer_used: POB lexical decision for ἐλεημοσύνη
  rationale: It explains an unfamiliar religious term in common English.
- pob_phrase: his life came to an end on the bed
  simplified_phrase: he died in bed
  preserved_meaning: It states his death without defining what happens to the soul.
  reasoning_layer_used: POB theological decision on the death idiom
  rationale: Direct wording makes the Greek death idiom immediately clear.
- pob_phrase: he buried him honorably
  simplified_phrase: his son Tobias buried him with honor
  preserved_meaning: One person gives Tobit an honorable burial, as the singular Greek verb indicates.
  reasoning_layer_used: POB lexical rationale and immediate narrative context
  rationale: Naming the implicit subject prevents the sentence from sounding as though Tobit buried himself.
