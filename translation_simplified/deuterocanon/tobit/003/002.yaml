translation:
  language: en
  text: Lord, you are righteous. All that you do and every way you act are marked by mercy and truth.[a] You always judge in a way that is true and righteous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “mercy and faithfulness.” Here “truth” can also carry the sense of faithfulness.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: all your works and all your ways
  simplified_phrase: All that you do and every way you act
  preserved_meaning: Both God's deeds and his manner of acting are included.
  reasoning_layer_used: POB lexical decisions for ἔργα and ὁδοί
  rationale: The biblical idiom “ways” is restated as God's manner of acting.
- pob_phrase: are mercy and truth
  simplified_phrase: are marked by mercy and truth
  preserved_meaning: Mercy and truth characterize all God's actions.
  reasoning_layer_used: POB lexical and theological decisions for ἐλεημοσύναι and ἀλήθεια
  rationale: “Are marked by” makes the Greek predication natural without narrowing mercy or truth.
- pob_phrase: you judge true and righteous judgment forever
  simplified_phrase: You always judge in a way that is true and righteous
  preserved_meaning: God's judging is perpetually both true and righteous.
  reasoning_layer_used: POB lexical decisions for κρίσιν, κρίνεις, and εἰς τὸν αἰῶνα
  rationale: The repeated noun and verb are recast as a direct description of how God always judges.
translation_notes:
  risk_flags:
  - risk: Modern readers may hear “truth” only as factual accuracy and miss its possible nuance of faithfulness.
    mitigation: The footnote preserves “faithfulness” as an alternative nuance.
