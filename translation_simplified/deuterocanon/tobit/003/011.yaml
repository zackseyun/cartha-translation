translation:
  language: en
  text: By the window she prayed, “Lord my God, you are blessed. Your holy and honored name is blessed forever. May all your works bless you forever.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “May all your works praise you forever.” The Greek uses the same word group translated “blessed” earlier in the prayer.
    reason: lexical_alternative
