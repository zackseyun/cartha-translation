translation:
  language: en
  text: Remember me and turn your attention to me. Do not punish me for my sins, for the wrongs I did without realizing they were wrong, or for the sins of my ancestors, which they committed before you.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The final clause most naturally refers to the ancestors’ sins, though it may refer more broadly to all the sins mentioned.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: look upon me
  simplified_phrase: turn your attention to me
  preserved_meaning: The prayer asks God to take notice of Tobit.
  reasoning_layer_used: POB lexical decision for ἐπίβλεψον ἐπʼ ἐμέ
  rationale: This expresses the plea for divine attention in ordinary modern English.
- pob_phrase: my errors done in ignorance
  simplified_phrase: the wrongs I did without realizing they were wrong
  preserved_meaning: These were genuine wrongs committed without full awareness.
  reasoning_layer_used: POB lexical decision for ἀγνοήμασίν μου
  rationale: The wording explains ignorance clearly without weakening the acts into mere mistakes.
- pob_phrase: those of my fathers
  simplified_phrase: the sins of my ancestors
  preserved_meaning: Tobit asks not to be punished for ancestral sins.
  reasoning_layer_used: POB lexical and theological decisions for τῶν πατέρων μου
  rationale: “Ancestors” makes the intended family reference immediately clear.
