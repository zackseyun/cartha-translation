translation:
  language: en
  text: And now, your many judgments are true as you deal with me concerning my sins and the sins of my fathers.[a] This is because we did not obey your commandments; we did not live faithfully and truthfully before you.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “true” also affirms that God’s judgments are right.
    reason: lexical_alternative
  - marker: b
    text: The Greek literally says, “we did not walk in truth before you,” an image for living faithfully and truthfully in God’s sight.
    reason: source_note
simplification_decisions:
- pob_phrase: your judgments are many and true in dealing with me concerning
  simplified_phrase: your many judgments are true as you deal with me concerning
  preserved_meaning: God’s numerous judicial dealings with Tobit are true and concern the confessed sins.
  reasoning_layer_used: POB lexical decisions for κρίσεις, ἀληθιναί, ἐξ ἐμοῦ ποιῆσαι, and περί
  rationale: The reordered clause reads naturally while retaining the deliberately broad word “concerning.”
- pob_phrase: because we did not keep your commandments
  simplified_phrase: This is because we did not obey your commandments
  preserved_meaning: Their failure to follow God’s covenant commands explains the preceding confession.
  reasoning_layer_used: Source causal clause and POB lexical decision for ἐντολάς
  rationale: “Obey” gives the ordinary sense of keeping a command without weakening “commandments.”
- pob_phrase: we did not walk in truth before you
  simplified_phrase: we did not live faithfully and truthfully before you
  preserved_meaning: They did not conduct their lives with faithfulness and truthfulness in God’s sight.
  reasoning_layer_used: POB lexical decisions for ἐπορεύθημεν ἐν ἀληθείᾳ and ἐνώπιόν σου
  rationale: The main text explains the biblical idiom directly, while the note preserves its walking image.
interpretive_expansions:
- pob_phrase: we did not walk in truth before you
  rendering: we did not live faithfully and truthfully before you
  claim: Walking in truth describes faithful and truthful conduct before God.
  evidence:
  - The POB lexical rationale says the idiom refers to conduct and allows both faithfulness and truthfulness.
  - The POB footnote explicitly defines the phrase as living faithfully and truthfully before God.
  confidence: high
  alternatives_preserved:
  - The footnote retains the literal image “walk in truth.”
