translation:
  language: en
  text: I have done nothing to stain my name or my father’s name in the land where I am held captive. I am my father’s only child. He has no other child to be his heir, no near brother,[a] and no son for whom I might reserve myself as a wife. I have already lost seven.[b] Why should I go on living? But if it does not seem good to you to put me to death, then command that you look on me and have mercy on me, so that I will no longer hear reproach.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “near brother,” probably meaning a close male relative; the whole kinship and marriage clause is difficult.
    reason: lexical_alternative
  - marker: b
    text: In the story, the seven are Sarah’s husbands, though this verse says only “seven.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: have not defiled my name, nor the name of my father
  simplified_phrase: have done nothing to stain my name or my father’s name
  preserved_meaning: Sarah denies bringing moral stain or shame on herself and her family.
  reasoning_layer_used: lexical decisions for ἐμόλυνα and ὄνομα
  rationale: “Stain” preserves the source image while making the honor idiom clear.
- pob_phrase: he has no child who will inherit him
  simplified_phrase: He has no other child to be his heir
  preserved_meaning: Her father has no other offspring who can inherit and continue his line.
  reasoning_layer_used: lexical decisions for παιδίον and κληρονομήσει αὐτόν
  rationale: “Be his heir” states the same heirship in natural English.
- pob_phrase: Already seven have perished from me
  simplified_phrase: I have already lost seven
  preserved_meaning: Sarah has suffered the loss of seven people whose identity remains implicit in the verse.
  reasoning_layer_used: lexical decision for ἀπώλοντό μοι ἑπτά and theological decision on the unstated referent
  rationale: “Lost seven” is clear English without adding “husbands” to the verse.
translation_notes:
  risk_flags:
  - risk: The kinship and marriage clause is textually and syntactically uncertain.
    mitigation: The main text preserves the near-brother wording, while footnote [a] marks its likely broader sense and uncertainty.
  - risk: The main text does not identify the seven.
    mitigation: Footnote [b] supplies the narrative referent without making it explicit in the verse.
