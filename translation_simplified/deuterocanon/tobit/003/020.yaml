  preserved_meaning: The speaker is directly drawing attention to the money.
  reasoning_layer_used: POB lexical decision for ἐπιδεικνύω
  rationale: This uses the documented sense “make known” rather than suggesting that the silver is physically present.
- pob_phrase: I deposited with Gabael
