translation:
  language: en
  text: Now I am telling you about the ten talents of silver that I left for safekeeping with Gabael son of Gabrias in Rages, in Media.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A talent was an ancient unit used to measure large amounts of precious metal.
    reason: cultural_note
