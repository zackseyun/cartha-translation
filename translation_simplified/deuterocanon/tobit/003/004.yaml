  simplified_phrase: You gave us over to be plundered, taken captive, and to die.
  preserved_meaning: God handed the people over to plunder, captivity, and death as judgment.
  reasoning_layer_used: lexical and theological decisions
  rationale: Concrete wording clarifies the three calamities while retaining God's agency and the broad meaning of death.
- pob_phrase: a proverb of reproach
  simplified_phrase: a proverb of disgrace—a people held up to public shame
  preserved_meaning: The scattered people became a proverbial example of insult and disgrace.
  reasoning_layer_used: lexical and theological decisions
  rationale: The wording preserves the proverb image while explaining its unfamiliar shame language.
- pob_phrase: among all the nations where we have been scattered
  simplified_phrase: Among all the nations where we have been scattered
  preserved_meaning: Their scattering among foreign nations continues to shape their present condition.
  reasoning_layer_used: lexical decision and latest revision
  rationale: Moving the setting forward makes the sentence easier to follow without changing its scope.
