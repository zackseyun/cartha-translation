translation:
  language: en
  text: 'The great Raphael was sent to heal them both: to remove the white films from Tobit’s eyes, to give Sarah daughter of Raguel to Tobiah son of Tobit as his wife, and to bind Asmodeus, the evil demon, because Tobiah had the legal right to inherit her as his wife.[a] At that same time, Tobit returned home, and Sarah came down from her upper room.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More idiomatically, “Tobiah had the right to marry her.” The Greek uses “inherit her” within the story’s legal and family framework.
    reason: lexical_alternative
