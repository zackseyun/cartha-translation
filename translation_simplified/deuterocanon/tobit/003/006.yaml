translation:
  language: en
  text: Now do with me whatever pleases you. Command that my spirit be taken up, so that I may be released and become dust.[a] It is better for me to die than to live, because I have heard lying insults, and deep grief fills me. Command that I be released now from this distress into the everlasting place.[b] Do not turn your face away from me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “become earth,” an expression for death rendered here as “become dust.”
    reason: lexical_alternative
  - marker: b
    text: “The everlasting place” is a general expression for the place of the dead; the Greek does not name a more specific destination.
    reason: cultural_note
simplification_decisions:
- pob_phrase: deal with me according to what is pleasing to you
  simplified_phrase: do with me whatever pleases you
  preserved_meaning: Tobit submits himself to what God wills.
  reasoning_layer_used: Lexical decision for κατὰ τὸ ἀρεστόν σου
  rationale: The simpler wording keeps the prayer directed toward God's pleasure and will.
- pob_phrase: false reproaches
  simplified_phrase: lying insults
  preserved_meaning: The hurtful words spoken against Tobit are false.
  reasoning_layer_used: Lexical decision for ὀνειδισμοὺς ψευδεῖς
  rationale: Common words replace the formal term without weakening either the insult or its falsehood.
- pob_phrase: there is great grief within me
  simplified_phrase: deep grief fills me
  preserved_meaning: Tobit experiences intense inward sorrow.
  reasoning_layer_used: Lexical decision for λύπη ἐστὶν πολλὴ ἐν ἐμοί
  rationale: The active English sentence clearly conveys both the grief's intensity and its inward force.
