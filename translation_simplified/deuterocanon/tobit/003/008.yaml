translation:
  language: en
  text: because she had been given in marriage to seven husbands, and Asmodeus, the evil demon, killed each of them before any could come together with her as husbands do with their wives.[a] They said to her, “Don’t you realize that you are choking your husbands? You have already had seven, and not one of them has done you any good.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, before they had marital relations with her.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: had been given to seven husbands
  simplified_phrase: had been given in marriage to seven husbands
  preserved_meaning: She had entered seven successive marriages through being given to each husband.
  reasoning_layer_used: Lexical decision for δεδομένη and the marital context of ἀνδράσιν.
  rationale: Adding “in marriage” prevents “given” from sounding like ownership or a gift.
- pob_phrase: before they could be with her as with wives
  simplified_phrase: before any could come together with her as husbands do with their wives
  preserved_meaning: The demon killed each husband before the marriage was sexually consummated.
  reasoning_layer_used: Theological decision preserving the Greek conjugal euphemism and plural relationship marker.
  rationale: The new wording is natural English while retaining the source’s modest marital image.
- pob_phrase: you have not benefited from even one of them
  simplified_phrase: not one of them has done you any good
  preserved_meaning: The taunt claims that none of her seven marriages brought her any benefit.
  reasoning_layer_used: Lexical decision for ὠνάσθης.
  rationale: The common idiom conveys benefit more directly without softening the insult.
translation_notes:
  risk_flags:
  - risk: “Done you any good” may sound broader than material or practical benefit.
    mitigation: The wording retains the POB’s deliberately general sense of benefit within the servants’ cruel taunt.
