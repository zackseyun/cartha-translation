translation:
  language: en
  text: When she heard this, she was so overwhelmed with grief that she wanted to hang herself. But she said, “I am my father’s only child. If I kill myself, I will bring disgrace on him. I will make him go down to Hades[a] in his old age, full of sorrow.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the realm of the dead” or “the grave.” The Greek reads “Hades.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: When she heard these things, she was deeply grieved, so that she wanted to hang herself
  simplified_phrase: When she heard this, she was so overwhelmed with grief that she wanted to hang herself
  preserved_meaning: What she heard caused such intense grief that she contemplated hanging herself.
  reasoning_layer_used: Lexical decisions for ταῦτα ἀκούσασα, ἐλυπήθη σφόδρα, and ὥστε ἀπάγξασθαι
  rationale: The recast sentence states the emotional result in clear modern English without implying that she acted.
- pob_phrase: it will be a disgrace to him
  simplified_phrase: I will bring disgrace on him
  preserved_meaning: Her action would publicly shame her father.
  reasoning_layer_used: Lexical decision for ὄνειδος αὐτῷ ἔσται
  rationale: The active wording makes the personal consequence easier to follow.
- pob_phrase: I will bring his old age down with sorrow to Hades
  simplified_phrase: I will make him go down to Hades in his old age, full of sorrow
  preserved_meaning: She fears causing her elderly father to descend sorrowfully to the realm of the dead.
  reasoning_layer_used: Lexical decisions for τὸ γῆρας αὐτοῦ κατάξω, μετʼ ὀδύνης, and εἰς ᾅδου
  rationale: The wording explains the metonymy while preserving old age, sorrow, and downward movement to Hades.
interpretive_expansions:
- pob_phrase: If I do this
  rendering: If I kill myself
  claim: “This” refers to the contemplated act of hanging herself.
  evidence:
  - The immediately preceding clause says that she wanted to hang herself.
  - Her following words explain why she rejects that action.
  confidence: high
translation_notes:
  risk_flags:
  - risk: “Make him go down” makes the father explicit where Greek literally refers to bringing down “his old age.”
    mitigation: The rendering retains his old age, sorrow, descent, and Hades rather than flattening the image.
  - risk: Some readers may mistake Hades for hell.
    mitigation: The footnote gives “the realm of the dead” and “the grave” as lexical alternatives.
