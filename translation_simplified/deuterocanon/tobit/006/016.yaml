translation:
  language: en
  text: But the angel said to him, “Don’t you remember what your father commanded you about marrying a woman from your own family line? Now listen to me, brother. She will be your wife. Pay no attention to the demon, because tonight she will be given to you as your wife.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the words that your father commanded you
  simplified_phrase: what your father commanded you
  preserved_meaning: Tobias is reminded of his father’s authoritative instruction.
  reasoning_layer_used: Lexical decisions for λόγων and ἐνετείλατό
  rationale: The command itself is the remembered content, so “what” removes an awkward phrase without weakening its authority.
- pob_phrase: taking a wife from your own kin
  simplified_phrase: marrying a woman from your own family line
  preserved_meaning: He was commanded to marry within his kinship group.
  reasoning_layer_used: Lexical decision for ἐκ τοῦ γένους σου and theological decision on kinship obligation
  rationale: “Marrying” is clearer than the older marriage idiom, while “family line” preserves the broader kinship sense.
- pob_phrase: And now listen to me, brother, because she will be your wife
  simplified_phrase: Now listen to me, brother. She will be your wife.
  preserved_meaning: The angel warmly urges Tobias to heed the assurance that she will become his wife.
  reasoning_layer_used: Lexical decisions for ἄκουσόν μου, ἀδελφέ, and σοὶ ἔσται εἰς γυναῖκα
  rationale: Two short sentences make the reassurance easier to follow while retaining “brother” and the marital claim.
translation_notes:
  risk_flags:
  - risk: “Family line” could be mistaken for immediate family rather than the wider kinship group.
    mitigation: The phrase follows POB’s approved alternative and avoids specifying tribe or ethnicity.
  - risk: “Marrying” is less source-near than the repeated idiom “taking a wife.”
    mitigation: The arranged-marriage framework remains explicit in “she will be given to you as your wife.”
