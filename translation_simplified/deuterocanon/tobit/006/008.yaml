translation:
  language: en
  text: He said to him, “If a demon or an evil spirit troubles a man or a woman, burn the heart and liver in front of that person so that they give off smoke. Then the person will no longer be troubled.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The heart and the liver—if a demon or an evil spirit troubles anyone
  simplified_phrase: If a demon or an evil spirit troubles a man or a woman, burn the heart and liver
  preserved_meaning: The remedy uses the fish’s literal heart and liver when either kind of spirit troubles someone.
  reasoning_layer_used: Lexical decisions for καρδία, ἧπαρ, δαιμόνιον, and πνεῦμα πονηρόν
  rationale: Reordering the clause makes the condition and instruction immediately clear while keeping the two organs and two spirit terms distinct.
- pob_phrase: burn these as smoke before a man or a woman
  simplified_phrase: burn the heart and liver in front of that person so that they give off smoke
  preserved_meaning: The organs are burned in the troubled person’s presence to produce smoke.
  reasoning_layer_used: Lexical decisions for καπνίσαι and ἐνώπιον
  rationale: The new wording explains the unfamiliar expression “burn as smoke” in ordinary English.
- pob_phrase: and he or she will no longer be troubled
  simplified_phrase: Then the person will no longer be troubled
  preserved_meaning: The troubling is stated to end after the prescribed action.
  reasoning_layer_used: Lexical decision for οὐ μηκέτι ὀχληθῇ and gender-expression decision
  rationale: Using “the person” avoids an awkward pronoun pair after explicitly retaining “a man or a woman.”
