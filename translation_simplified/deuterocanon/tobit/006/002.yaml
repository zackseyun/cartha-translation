translation:
  language: en
  text: They traveled on, and by evening they reached the Tigris River.[a] They camped there for the night.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The shorter Greek text says they reached the Tigris by evening and camped there; a longer textual tradition begins expanding the fish episode at this point.
    reason: textual_variant
simplification_decisions:
- pob_phrase: As they were traveling on the road
  simplified_phrase: They traveled on
  preserved_meaning: Their journey was still in progress.
  reasoning_layer_used: Greek lexical decision for πορευόμενοι and τὴν ὁδόν
  rationale: The shorter wording expresses continued travel without the redundant phrase “on the road.”
- pob_phrase: they came by evening to the Tigris River
  simplified_phrase: by evening they reached the Tigris River
  preserved_meaning: They arrived at the river by evening.
  reasoning_layer_used: Greek lexical decisions for ἦλθον ἑσπέρας and ἐπὶ τὸν Τίγριν ποταμόν
  rationale: “Reached” states the arrival naturally while keeping the time and destination unchanged.
- pob_phrase: and they camped there
  simplified_phrase: They camped there for the night
  preserved_meaning: They stopped and took overnight lodging at the river.
  reasoning_layer_used: Greek lexical decision for ηὐλίζοντο
  rationale: A separate sentence makes the sequence easier to follow and clarifies the overnight sense of the verb.
