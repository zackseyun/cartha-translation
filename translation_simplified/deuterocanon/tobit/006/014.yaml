translation:
  language: en
  text: Then the young man said to the angel, “Brother Azariah, I have heard that this girl has been given in marriage to seven men. But each man was prevented from completing the marriage in the bridal chamber.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says they were “prevented” or “kept away.” The wider story explains that they died before completing the marriage.
    reason: alternative_reading
