  preserved_meaning: Tobias addresses Azariah warmly as “brother.”
  reasoning_layer_used: 'pob_lexical_decisions: ἀδελφέ'
  rationale: Natural English places the title before the name.
- pob_phrase: the girl has been given to seven men
  simplified_phrase: this girl has been given in marriage to seven men
  preserved_meaning: The seven men were successive marriage partners.
  reasoning_layer_used: 'pob_lexical_decisions: δεδόσθαι and ἑπτὰ ἀνδράσιν'
  rationale: Adding “in marriage” makes the contextual sense of “given” immediately clear.
- pob_phrase: all of them were hindered in the bridal chamber
  simplified_phrase: each man was prevented from completing the marriage in the bridal chamber
  preserved_meaning: None of the seven men was able to consummate the marriage.
  reasoning_layer_used: pob footnote b and theological decision on ἀποκωλῦσαι
  rationale: The wording explains what they were prevented from doing without directly saying they were killed.
