  simplified_phrase: I am my father’s only child
  preserved_meaning: Tobias is the sole remaining child his father has.
  reasoning_layer_used: POB lexical decision for μόνος and the following statement that they have no other son
  rationale: “Only child” makes the family relationship clear without limiting the phrase to “only son.”
- pob_phrase: just as the former ones did
  simplified_phrase: just as the men before me did
  preserved_meaning: Tobias fears sharing the fate of Sarah’s earlier husbands or suitors.
  reasoning_layer_used: POB lexical rationale and footnote
  rationale: The wording identifies the people while the footnote preserves uncertainty about their exact status.
- pob_phrase: bring down the life of my father and my mother in grief because of me to their grave
  simplified_phrase: bring my father and mother down to their graves in grief over me
  preserved_meaning: Tobias fears that his death would cause his parents to die in sorrow while retaining the descent-to-the-grave image.
  reasoning_layer_used: POB idiom rationale and cultural note
  rationale: Removing the awkward reference to their “life” clarifies the sentence while preserving the grave image.
