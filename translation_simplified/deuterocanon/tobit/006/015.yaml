translation:
  language: en
  text: Now I am my father’s only child. I am afraid that if I go in to her, I will die just as the men before me did.[a] A demon loves her possessively and harms no one except the men who approach her.[b] I am afraid I may die and bring my father and mother down to their graves in grief over me. They have no other son to bury them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The men before Tobias were Sarah’s previous husbands or suitors.
    reason: lexical_alternative
  - marker: b
    text: “Approach her” refers broadly to men who come to Sarah, especially in connection with marriage.
    reason: simplification_note
