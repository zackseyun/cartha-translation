  text: Now listen to me. I will speak to her father, and when we return from Rages, we will arrange the marriage. I know that Raguel will certainly not give her to another man, because that would violate the law of Moses and make him liable to the death penalty. You have the first claim to receive the inheritance, ahead of any other man.
