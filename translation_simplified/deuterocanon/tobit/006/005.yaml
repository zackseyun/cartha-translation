translation:
  language: en
  text: The angel told him, “Cut the fish open. Remove its heart, liver, and gall,[a] then store them safely.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gall can also be translated “bile.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And the angel said to him
  simplified_phrase: The angel told him
  preserved_meaning: The angel remains the speaker and gives the instruction to him.
  reasoning_layer_used: Theological decision identifying ὁ ἄγγελος as an angelic being.
  rationale: “Told him” introduces a command more directly in modern English.
- pob_phrase: Cut open the fish
  simplified_phrase: Cut the fish open
  preserved_meaning: He is commanded to open the fish by cutting it.
  reasoning_layer_used: Lexical decision for Ἀνάτεμε τὸν ἰχθύν.
  rationale: The reordered phrase sounds more natural without weakening the concrete action.
- pob_phrase: after taking the heart and the liver and the gall, put them away safely
  simplified_phrase: Remove its heart, liver, and gall, then store them safely
  preserved_meaning: The organs are first taken from the fish and then kept securely for later use.
  reasoning_layer_used: Lexical decisions for λαβών, the three organs, θὲς, and ἀσφαλῶς.
  rationale: Two direct commands make the required sequence clear on first reading.
