translation:
  language: en
  text: Then the demon will smell it and flee, never to return. But when you approach Sarah as her husband, both of you must rise and cry out to the merciful God. He will save you and have mercy on you. Do not be afraid. She had been prepared for you from eternity.[a] You will save her from the demon, and she will go with you. I expect that you will have children together.” When Tobias heard this, he kissed her, and his soul clung deeply to her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “from long ago.” The Greek can refer to remote antiquity as well as an eternal horizon.
    reason: alternative_reading
