translation:
  language: en
  text: But she said, “It was a gift, given to me in addition to my wages.” I did not believe her. I told her to return it to its owners, and I felt ashamed in front of her. Then she replied, “Where are your merciful deeds and your righteous deeds? Look—everything about you is plain to see.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: It was given to me as a gift in addition to my wages.
  simplified_phrase: It was a gift, given to me in addition to my wages.
  preserved_meaning: She says the item was an extra gift rather than stolen property or ordinary pay.
  reasoning_layer_used: POB lexical decision for ἐπὶ τῷ μισθῷ
  rationale: The shorter wording keeps the claim that the gift came on top of her wages.
- pob_phrase: I told her to give it back to its owners; and I was embarrassed before her.
  simplified_phrase: I told her to return it to its owners, and I felt ashamed in front of her.
  preserved_meaning: He demanded that the disputed property be restored and then experienced shame before her.
  reasoning_layer_used: POB lexical decisions for ἀποδιδόναι, τοῖς κυρίοις, and ἠρυθρίων
  rationale: Natural English clarifies both the return of property and the relational shame.
- pob_phrase: Behold, everything about you is known.
  simplified_phrase: Look—everything about you is plain to see.
  preserved_meaning: Anna sharply says that Tobit’s true condition or conduct is evident without specifying to whom.
  reasoning_layer_used: POB theological decision on the force of Anna’s rebuke
  rationale: The rendering makes the idiom understandable while preserving its unresolved scope.
translation_notes:
  risk_flags:
  - risk: “Plain to see” may suggest public visibility more strongly than the compressed Greek.
    mitigation: The text does not name observers or define exactly what has become evident.
  - risk: “Merciful deeds” may sound broader than almsgiving alone.
    mitigation: This follows the POB choice to preserve the term’s broader ethical force in this rebuke.
