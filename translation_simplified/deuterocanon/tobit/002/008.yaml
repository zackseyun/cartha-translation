translation:
  language: en
  text: The neighbors kept mocking him.[a] They said, “He is not afraid anymore of being put to death for this. He ran away, yet look—he is back to burying the dead!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Other textual traditions differ greatly here. A later Hebrew back-translation has Hannah say that Tobit’s kindness and righteousness did not help him in his distress and disgrace, rather than describing the neighbors mocking him.
    reason: textual_variant
simplification_decisions:
- pob_phrase: And the neighbors were mocking
  simplified_phrase: The neighbors kept mocking him.
  preserved_meaning: The neighbors repeatedly ridiculed Tobit.
  reasoning_layer_used: Greek lexical decision for the imperfect ἐνέγελων
  rationale: “Kept mocking” makes the continuing derision clear in a short sentence.
- pob_phrase: over this matter
  simplified_phrase: for this
  preserved_meaning: Tobit faced death because of the action under discussion.
  reasoning_layer_used: Greek lexical decision for περὶ τοῦ πράγματος τούτου
  rationale: “For this” expresses the same causal link in more natural speech.
- pob_phrase: and look, he is burying the dead again
  simplified_phrase: yet look—he is back to burying the dead!
  preserved_meaning: The neighbors scornfully point out that Tobit has resumed burying the dead.
  reasoning_layer_used: Lexical decisions for καὶ ἰδοὺ, πάλιν, and θάπτει τοὺς νεκρούς
  rationale: “Back to” clearly conveys renewed action while “look” preserves the taunt’s immediacy.
