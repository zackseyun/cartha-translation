translation:
  language: en
  text: He came and said, “Father, one of our own people[a] has been strangled, and his body was thrown down in the marketplace.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “one of our kin.” The Greek expression can mean a family member, someone from the same kin-group, or one of the same people.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: has been strangled and thrown down in the marketplace
  simplified_phrase: has been strangled, and his body was thrown down in the marketplace
  preserved_meaning: The person was killed by strangling, and the body was violently discarded in that public place.
  reasoning_layer_used: Greek lexical decisions for ἐστραγγαλωμένος, ἔρριπται, and ἐν τῇ ἀγορᾷ
  rationale: Naming the body clarifies the sequence while retaining the violent-disposal image and the marketplace as its location.
interpretive_expansions:
- pob_phrase: thrown down
  rendering: his body was thrown down
  claim: The dead person’s body is what was thrown down in the marketplace.
  evidence:
  - The preceding perfect passive reports that the person has been strangled.
  - The passive of ῥίπτω then describes the person’s resulting disposal there.
  confidence: high
  alternatives_preserved:
  - thrown down
  - lies cast out
