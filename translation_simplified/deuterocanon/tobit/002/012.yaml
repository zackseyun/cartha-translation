  rationale: “Regularly” expresses the imperfect verb’s habitual force in natural English.
- pob_phrase: to the owners
  simplified_phrase: to the people who owned it
  preserved_meaning: The recipients were the human owners for whom she worked.
  reasoning_layer_used: The lexical and theological decisions for τοῖς κυρίοις.
  rationale: This wording avoids suggesting a divine title or that the people owned her.
