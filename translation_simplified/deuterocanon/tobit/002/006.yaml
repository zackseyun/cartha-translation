simplification_decisions:
- pob_phrase: And I remembered the prophecy of Amos, as he said
  simplified_phrase: Then I remembered the prophecy of Amos, who said
  preserved_meaning: Tobit recalls and directly quotes Amos’s prophecy.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The revised introduction makes the narrative sequence and speaker clear.
- pob_phrase: Your festivals will be turned into mourning
  simplified_phrase: Your festivals will become times of mourning
  preserved_meaning: Communal religious celebrations will be transformed into public grief.
  reasoning_layer_used: POB lexical decisions for Στραφήσονται, ἑορταὶ, and πένθος
  rationale: “Times of mourning” expresses the reversal naturally while retaining its public character.
- pob_phrase: all your rejoicing into lamentation
  simplified_phrase: all your rejoicing will become lament
  preserved_meaning: Every occasion and expression of joy will be transformed into formal mourning.
  reasoning_layer_used: POB lexical decisions for εὐφροσύναι and θρῆνον
  rationale: Retaining “rejoicing” preserves its broad scope, while “lament” is clearer than “lamentation.”
translation_notes:
  risk_flags:
  - risk: “Will become” makes the passive transformation less explicit than “will be turned.”
    mitigation: The repeated reversal still presents a future change announced by the prophecy.
