translation:
  language: en
  text: 'Then I remembered the prophecy of Amos,[a] who said: “Your festivals will become times of mourning, and all your rejoicing will become lament.” Then I wept.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This quotation echoes Amos 8:10 in the Septuagint tradition.
