translation:
  language: en
  text: I saw that there was plenty of food. So I said to my son, “Go find one of our brothers[a] who is in need and remembers the Lord. Bring him here to eat with us. I will wait here until you return.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Our brothers” means fellow members of Tobit’s people, not only literal siblings.
    reason: cultural_note
  - marker: b
    text: The closing words are awkward in the Greek manuscripts; the likely sense is that Tobit stays behind and waits for his son.
    reason: textual_variant
simplification_decisions:
- pob_phrase: And I saw much food
  simplified_phrase: I saw that there was plenty of food
  preserved_meaning: Tobit sees a large amount of prepared food.
  reasoning_layer_used: POB lexical decision for ὄψα πολλά
  rationale: “Plenty of food” expresses the amount naturally without specifying particular dishes.
- pob_phrase: bring whichever one of our brothers you may find in need
  simplified_phrase: find one of our brothers who is in need ... Bring him here
  preserved_meaning: The son must find and bring a needy man from their community.
  reasoning_layer_used: POB lexical and theological decisions for ἀδελφῶν and ἐνδεής
  rationale: Two direct sentences make the command easier to follow while retaining “brothers” and its communal sense.
- pob_phrase: behold, I am waiting for you
  simplified_phrase: I will wait here until you return
  preserved_meaning: Tobit remains behind while his son goes and waits for him to come back.
  reasoning_layer_used: POB textual-variant note and lexical rationale for ἰδοὺ μένω σε
  rationale: The awkward closing is restated as ordinary English without hiding the manuscript difficulty.
interpretive_expansions:
- pob_phrase: bring
  rendering: Bring him here to eat with us
  claim: The needy man is being brought to share the meal.
  evidence:
  - The immediate setting is the abundance of prepared food.
  - The POB lexical rationale says Tobit sends his son to bring a needy fellow Israelite to the meal.
  confidence: high
  alternatives_preserved:
  - Bring him here
- pob_phrase: I am waiting for you
  rendering: I will wait here until you return
  claim: Tobit stays behind and waits for his son to come back.
  evidence:
  - The POB textual note gives this as the contextual sense.
  - The Semitic parallel supports the son going out while his father remains behind.
  confidence: high
  alternatives_preserved:
  - I am waiting for you
translation_notes:
  risk_flags:
  - risk: “Brothers” may be mistaken for Tobit’s biological siblings.
    mitigation: Footnote [a] explains its broader community meaning.
  - risk: The simplified closing may appear more certain than the awkward Greek warrants.
    mitigation: Footnote [b] identifies the manuscript difficulty and frames the wording as the likely sense.
