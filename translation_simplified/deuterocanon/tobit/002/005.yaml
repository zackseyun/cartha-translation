translation:
  language: en
  text: After I returned, I washed myself.[a] Then I ate my meal in sorrow.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This washing likely followed contact with a dead body, but the Greek does not explicitly call it ritual purification.
    reason: cultural_note
  - marker: b
    text: The Greek literally says “my bread,” a common way to refer to one’s food or meal.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And when I returned
  simplified_phrase: After I returned
  preserved_meaning: The return happened before the washing and eating.
  reasoning_layer_used: Lexical decision for ἐπιστρέψας
  rationale: “After” makes the narrative sequence immediately clear.
- pob_phrase: I washed myself and ate
  simplified_phrase: I washed myself. Then I ate
  preserved_meaning: Tobit washed before eating.
  reasoning_layer_used: Greek clause sequence and POB syntax
  rationale: Two short sentences make the order easier to follow.
- pob_phrase: my bread
  simplified_phrase: my meal
  preserved_meaning: Tobit ate his food while sorrowful.
  reasoning_layer_used: Lexical decision for τὸν ἄρτον μου
  rationale: “Meal” conveys the ordinary contextual sense while a note preserves the bread image.
