translation:
  language: en
  text: When I came back down to my house, I was reunited with my wife Anna and my son Tobiah. On Pentecost—the holy feast celebrated after seven weeks—a fine meal was prepared for me. I reclined at the table to eat.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: People in the ancient world often reclined on couches while eating.
    reason: cultural_note
  - marker: b
    text: A fuller parallel tradition adds that Tobiah was sent to invite a poor relative to the meal, but that material is not in the shorter Greek text translated here.
    reason: textual_variant
simplification_decisions:
- pob_phrase: When I had come down to my house
  simplified_phrase: When I came back down to my house
  preserved_meaning: Tobit returned home while retaining the Greek image of downward movement.
  reasoning_layer_used: lexical decision for κατῆλθον
  rationale: “Came back down” is easier to follow than the past-perfect wording.
- pob_phrase: Anna my wife and Tobiah my son were restored to me
  simplified_phrase: I was reunited with my wife Anna and my son Tobiah
  preserved_meaning: Anna and Tobiah were returned to Tobit after a separation.
  reasoning_layer_used: lexical rationale and narrative context for ἀπεδόθη μοι
  rationale: The active wording states the family reunion naturally without implying that they were possessions.
- pob_phrase: the feast of Pentecost, which is the holy feast of seven weeks
  simplified_phrase: Pentecost—the holy feast celebrated after seven weeks
  preserved_meaning: Pentecost is identified by its Jewish seven-week festival setting.
  reasoning_layer_used: theological decision for πεντηκοστῇ ἑορτῇ and ἁγία ἑπτὰ ἑβδομάδων
  rationale: The shorter apposition keeps both the Greek festival name and its built-in explanation.
interpretive_expansions:
- pob_phrase: I reclined to eat
  rendering: I reclined at the table to eat
  claim: The reclining took place in the setting of the meal table.
  evidence:
  - The immediate context is a prepared meal.
  - The lexical rationale identifies reclining as the ancient dining custom.
  confidence: high
  alternatives_preserved:
  - I reclined to eat
translation_notes:
  risk_flags:
  - risk: Modern readers may associate Pentecost only with the later Christian observance.
    mitigation: The main text retains the Greek name but immediately explains its seven-week Jewish festival setting.
  - risk: Reclining to eat may still seem unfamiliar.
    mitigation: A brief cultural footnote explains the ancient dining custom.
