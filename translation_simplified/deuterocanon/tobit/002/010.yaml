translation:
  language: en
  text: I did not know that sparrows were in the wall.[a] While my eyes were open, the sparrows dropped warm dung into them, and white films formed on my eyes.[b] I went to doctors, but they did not help me. Achiacharus provided for me until I went to Elymais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “small birds,” though “sparrows” is most likely.
    reason: lexical_alternative
  - marker: b
    text: The “white films” were opaque areas, perhaps like cataracts, but the text does not give a precise diagnosis.
    reason: lexical_alternative
