translation:
  language: en
  text: Raguel said, “Take her as your wife from now on, according to the ruling. You are her brother,[a] and she is yours. May the merciful God grant you both the very best.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “brother” means a close male relative who could marry her under family custom, not a literal brother.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Take her from now on according to the judgment
  simplified_phrase: Take her as your wife from now on, according to the ruling
  preserved_meaning: Raguel authorizes Tobias to receive Sarah in marriage under a formal decision.
  reasoning_layer_used: Lexical decisions for Κομίζου and κατὰ τὴν κρίσιν
  rationale: This makes the marriage context clear while preserving the ruling’s formal force.
- pob_phrase: You are her brother, and she is yours
  simplified_phrase: You are her brother, and she is yours
  preserved_meaning: The source kinship term and declaration of the marriage remain intact.
  reasoning_layer_used: Theological decision on kinship language
  rationale: The text retains “brother,” while the footnote prevents a literal-sibling reading.
- pob_phrase: may the merciful God prosper what is best for you
  simplified_phrase: May the merciful God grant you both the very best
  preserved_meaning: Raguel asks God to give Tobias and Sarah the best things or outcome.
  reasoning_layer_used: Lexical decisions for εὐοδώσει and τὰ κάλλιστα and the blessing-formula decision
  rationale: This natural blessing preserves the focus on what is best without expanding it to everything.
interpretive_expansions:
