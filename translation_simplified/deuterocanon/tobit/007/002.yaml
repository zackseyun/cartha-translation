translation:
  language: en
  text: Edna said to his wife,[a] “That young man, Tobit, looks so much like my nephew!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says, “Edna said to his wife.” Another ancient-language tradition has Raguel speaking to his wife, Edna, and the context supports that possibility.
    reason: textual_variant
  - marker: b
    text: The Greek word translated “nephew” may also mean “cousin” or another close male relative.
    reason: lexical_alternative
