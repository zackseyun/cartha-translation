translation:
  language: en
  text: He called for his daughter Sarah. Taking her by the hand, he gave her to Tobiah to be his wife. He said, “According to the law of Moses, take her[a] with you and bring her to your father.” Then he blessed them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “receive her.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And he called Sarah his daughter
  simplified_phrase: He called for his daughter Sarah.
  preserved_meaning: He summoned Sarah, who was his daughter.
  reasoning_layer_used: POB lexical decision for ἐκάλεσεν
  rationale: “Called for” expresses the action naturally and avoids implying that he named her.
- pob_phrase: he gave her to Tobiah as a wife
  simplified_phrase: he gave her to Tobiah to be his wife
  preserved_meaning: The gesture formally gives Sarah to Tobiah in marriage.
  reasoning_layer_used: POB lexical decision for παρέδωκεν αὐτὴν Τωβείᾳ γυναῖκα
  rationale: “To be his wife” makes the marriage relationship immediately clear.
- pob_phrase: See, according to the law of Moses, take her and bring her to your father
  simplified_phrase: According to the law of Moses, take her with you and bring her to your father
  preserved_meaning: The marriage is grounded in Mosaic law, and Tobiah is told to receive Sarah and bring her to his father.
  reasoning_layer_used: POB lexical and theological decisions for Ἰδοὺ, κομίζου, and κατὰ τὸν νόμον Μωυσέως
  rationale: The wording removes an awkward attention marker while retaining the named legal basis and both commands.
