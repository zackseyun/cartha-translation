translation:
  language: en
  text: He said to him,[a] “He is the son of a noble and good man.” When he heard that Tobit had lost his sight,[b] he was saddened and wept.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek leaves the family relationship unstated; “son” is supplied from the context.
    reason: lexical_alternative
  - marker: b
    text: Literally, “had lost his eyes.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: had lost his eyes
  simplified_phrase: had lost his sight
  preserved_meaning: Tobit had become blind.
  reasoning_layer_used: POB lexical alternative and immediate narrative context
  rationale: The idiomatic wording prevents readers from mistaking blindness for physical removal of the eyes.
- pob_phrase: he was grieved and wept
  simplified_phrase: he was saddened and wept
  preserved_meaning: He felt sorrow and responded by weeping.
  reasoning_layer_used: POB lexical decisions for ἐλυπήθη and ἔκλαυσεν
  rationale: “Saddened” is common English, and keeping “wept” preserves the distinct second response.
