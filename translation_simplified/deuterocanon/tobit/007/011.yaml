translation:
  language: en
  text: '“I gave my child to seven men. Whenever one of them went to her as her husband, he died that night. Still, for now, take heart.”


    But Tobiah said, “I will not taste any food here until you settle and complete the marriage agreement with me.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek wording is difficult; the apparent sense is that Tobiah will not eat until the marriage arrangement is formally settled.
    reason: textual_variant
