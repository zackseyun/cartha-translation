translation:
  language: en
  text: On the twelfth day of the first month, we set out from Thera and made our way to Jerusalem.[a] The mighty hand of our Lord was with us. He rescued us from every enemy we encountered along the way, and we arrived in Jerusalem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek names this place as Thera; the Hebrew parallel in Ezra 8:31 calls it the river Ahava.
    reason: alternative_reading
  - marker: b
    text: The Greek wording is irregular; the Hebrew parallel supports both “along the way” and the first-person wording “we arrived.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: after setting out from the place Thera
  simplified_phrase: we set out from Thera
  preserved_meaning: The travelers began their journey from the Greek-named departure point.
  reasoning_layer_used: POB lexical decision for ἀναζεύξαντες and τοῦ τόπου Θερὰ
  rationale: The direct clause is easier to read than the opening participial phrase.
- pob_phrase: by the mighty hand of our Lord that was upon us
  simplified_phrase: The mighty hand of our Lord was with us
  preserved_meaning: The Lord’s powerful favor protected and guided the travelers.
  reasoning_layer_used: POB lexical and theological decisions for κραταιὰ χείρ and κύριος
  rationale: A separate sentence keeps the biblical hand image while clarifying that God helped them.
- pob_phrase: they came to Jerusalem … and we came to Jerusalem
  simplified_phrase: made our way to Jerusalem … and we arrived in Jerusalem
  preserved_meaning: Jerusalem was their destination and their journey ended there.
  reasoning_layer_used: POB revision and lexical decision for καὶ ἤλθον εἰς Ἰερουσαλήμ
  rationale: The wording preserves both journey and arrival without repeating the same phrase.
interpretive_expansions:
- pob_phrase: from every enemy from the outset
  rendering: from every enemy we encountered along the way
  claim: The enemies threatened the travelers during their journey.
  evidence:
  - The POB lexical decision identifies hostile encounters on the journey.
  - The Hebrew parallel mentions an enemy and an ambush on the road.
  confidence: moderate
  alternatives_preserved:
  - The literal sense “from the approach/entrance” remains acknowledged in the audit.
  external_witnesses:
  - Ezra 8:31 in the Hebrew parallel
translation_notes:
  risk_flags:
  - risk: The Greek departure name conflicts with the Hebrew parallel’s river Ahava.
    mitigation: Thera remains in the text because Greek is primary, while the alternate name is footnoted.
  - risk: The Greek shifts from “us” to “they” in the final arrival clause.
    mitigation: The first-person narrative is retained, and the irregularity is noted in a footnote.
