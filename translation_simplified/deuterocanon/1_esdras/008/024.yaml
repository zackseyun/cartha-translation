translation:
  language: en
  text: Everyone who violates both the law of your God and the king’s law must be diligently punished.[a][b] The punishment may be death, another penalty, a monetary fine, or confiscation of property.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may instead emphasize strict punishment.
    reason: lexical_alternative
  - marker: b
    text: The Greek text here differs greatly from the supplied Hebrew-Aramaic parallel, so this translation follows the Greek.
    reason: textual_variant
  - marker: c
    text: The Greek may instead refer to banishment, though confiscation best fits this list of legal penalties.
    reason: alternative_reading
