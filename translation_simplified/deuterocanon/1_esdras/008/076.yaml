translation:
  language: en
  text: and to reveal a lamp for us in the house of our Lord[a] and give us food during our slavery. Even while we were enslaved, we were not abandoned.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “house of our Lord” is the temple; “lamp” may also be translated “light.”
    reason: cultural_note
simplification_decisions:
- pob_phrase: to reveal a lamp for us
  simplified_phrase: to reveal a lamp for us
  preserved_meaning: The concrete image of a lamp being unveiled remains intact.
  reasoning_layer_used: Lexical decisions for ἀνακαλύψαι and φωστῆρα
  rationale: “Reveal” is ordinary English that preserves the unveiling image without suggesting physical placement.
- pob_phrase: in the time of our slavery
  simplified_phrase: during our slavery
  preserved_meaning: The people’s severe condition of subjection under foreign rule remains explicit.
  reasoning_layer_used: Theological decision on the δουλεία word group
  rationale: “During” states the time relationship more naturally while retaining “slavery.”
- pob_phrase: and while we were enslaved, we were not forsaken
  simplified_phrase: Even while we were enslaved, we were not abandoned
  preserved_meaning: God did not leave the people despite their continuing enslavement.
  reasoning_layer_used: Lexical decisions for δουλεύειν and ἐγκατελείφθημεν
  rationale: “Even” clarifies the contrast, and “abandoned” is clearer modern English than “forsaken.”
translation_notes:
  risk_flags:
  - risk: The lamp may be read as only a literal temple object.
    mitigation: The text retains the source image without narrowing its broader force.
  - risk: “Abandoned” carries less traditional covenantal resonance than “forsaken.”
    mitigation: It preserves the same core meaning in clearer modern English.
