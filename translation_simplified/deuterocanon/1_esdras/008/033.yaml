translation:
  language: en
  text: Esias son of Gotholias, from the family of Lam, was accompanied by seventy men.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The parallel passage in Ezra 8:3 has different names and says “three hundred males.” This translation follows the Greek text of 1 Esdras, which has these names and the number seventy.
    reason: textual_variant
