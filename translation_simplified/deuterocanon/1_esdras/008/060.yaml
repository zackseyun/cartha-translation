translation:
  language: en
  text: After the priests and the Levites received the silver, gold, and temple objects, they brought them to Jerusalem and into the Lord’s temple.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew parallel says, “to bring them to Jerusalem, to the house of our God.” The Greek of 1 Esdras says, “brought them … into the temple of the Lord.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the priests and the Levites who had received
  simplified_phrase: After the priests and the Levites received
  preserved_meaning: The two groups received the entrusted items before transporting them.
  reasoning_layer_used: Greek participle and POB lexical rationale
  rationale: An “after” clause makes the sequence clear in ordinary English.
- pob_phrase: the vessels
  simplified_phrase: the temple objects
  preserved_meaning: The items are objects associated with temple service, not ordinary household vessels.
  reasoning_layer_used: POB lexical rationale and temple context
  rationale: “Temple objects” avoids the misleading modern sense of ships or generic containers.
- pob_phrase: brought them to Jerusalem, into the temple of the Lord
  simplified_phrase: brought them to Jerusalem and into the Lord’s temple
  preserved_meaning: Their destination was Jerusalem and, more specifically, the Lord’s temple.
  reasoning_layer_used: POB destination decision and theological title decision
  rationale: The coordinated wording clarifies the movement while retaining both destinations.
interpretive_expansions:
- pob_phrase: the vessels
  rendering: the temple objects
  claim: The vessels were objects intended for temple use.
  evidence:
  - The immediate destination is the Lord’s temple.
  - The POB lexical rationale identifies sacred objects or containers in a temple context.
  confidence: high
  alternatives_preserved:
  - vessels
  - utensils
  - articles
translation_notes:
  risk_flags:
  - risk: “Temple objects” is broader than objects that were specifically containers.
    mitigation: The wording preserves the broad range stated in the POB lexical rationale.
  - risk: The Greek and Hebrew parallel differ in their destination wording and divine title.
    mitigation: The main text follows the POB’s Greek-controlled reading, and the footnote preserves the Hebrew alternative.
