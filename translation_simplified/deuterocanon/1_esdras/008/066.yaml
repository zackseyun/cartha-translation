  text: The rulers, priests, and Levites have not kept themselves separate from the foreign peoples of the land—the Canaanites, Hittites, Perizzites, Jebusites, Moabites, Egyptians, and Edomites—and their unclean practices.[a]
  philosophy: optimal-equivalence
