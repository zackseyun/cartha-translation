translation:
  language: en
  text: saying, “The land you are entering as your inheritance is defiled by the foreigners’ defilement.[a] They have filled it with their uncleanness.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the peoples of the land”; the Greek specifically calls them foreigners.
    reason: alternative_reading
  - marker: b
    text: “Uncleanness” can refer to ritual impurity, moral corruption, or both here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the land into which you are entering to inherit
  simplified_phrase: the land you are entering as your inheritance
  preserved_meaning: The people are entering land they will receive as a covenantal inheritance.
  reasoning_layer_used: lexical decision for κληρονομῆσαι
  rationale: The recasting uses natural English while retaining the important inheritance language.
- pob_phrase: a land defiled by the defilement of the foreigners of the land
  simplified_phrase: is defiled by the foreigners’ defilement
  preserved_meaning: The foreigners’ defilement, not merely their identity or presence, is the stated cause.
  reasoning_layer_used: lexical and theological decisions for μεμολυσμένη, μολυσμῷ, and ἀλλογενῶν
  rationale: The possessive shortens the phrase while preserving its emphatic repetition and causal focus.
translation_notes:
  risk_flags:
  - risk: The repeated words “defiled” and “defilement” may sound unusual in modern English.
    mitigation: The repetition is retained because it carries the Greek emphasis and identifies the precise cause.
