translation:
  language: en
  text: For our sins have piled up above our heads, and the wrongs we have done in ignorance[a] have risen to heaven.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek uses a different word from “sins”; it can also mean errors or sins committed unknowingly.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: our sins have multiplied beyond our heads
  simplified_phrase: our sins have piled up above our heads
  preserved_meaning: The sins are pictured as increasing until they overwhelm the people.
  reasoning_layer_used: Lexical decisions for ἐπλεόνασαν and ὑπὲρ τὰς κεφαλὰς ἡμῶν
  rationale: “Piled up” makes the growing quantity and vertical image immediately clear.
- pob_phrase: our offenses
  simplified_phrase: the wrongs we have done in ignorance
  preserved_meaning: The second term describes culpable wrongdoing associated with ignorance and remains distinct from “sins.”
  reasoning_layer_used: Lexical decision for ἄγνοιαι and the theological distinction between the two terms
  rationale: This wording is more natural than “ignorances” while preserving the Greek distinction.
interpretive_expansions:
- pob_phrase: our offenses
  rendering: the wrongs we have done in ignorance
  claim: The offenses are explicitly identified as wrongdoing arising from ignorance.
  evidence:
  - The lexical rationale says ἄγνοιαι can denote wrongdoing done in ignorance.
  - The theological decision requires this term to remain distinct from “sins.”
  confidence: high
  alternatives_preserved:
  - errors
  - sins committed unknowingly
  - offenses
translation_notes:
  risk_flags:
  - risk: “In ignorance” could be mistaken for a denial of responsibility.
    mitigation: Calling them “wrongs” preserves their morally blameworthy character.
