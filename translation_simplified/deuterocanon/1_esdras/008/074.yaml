translation:
  language: en
  text: Because of our sins and the sins of our fathers, we were handed over to foreign kings, together with our brothers, our kings, and our priests. We were handed over to death by the sword, captivity, and plundering that brought disgrace. This has continued to the present day.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “kings of the earth” and can also mean “kings of the land.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: we were handed over, together with our brothers, our kings, and our priests, to the kings of the earth
  simplified_phrase: we were handed over to foreign kings, together with our brothers, our kings, and our priests
  preserved_meaning: Every listed group was handed over to the same foreign rulers.
  reasoning_layer_used: Greek coordination and POB lexical rationale
  rationale: The reordered clause is easier to follow while keeping the shared passive action intact.
- pob_phrase: to the sword and captivity and plundering with shame
  simplified_phrase: to death by the sword, captivity, and plundering that brought disgrace
  preserved_meaning: The judgment involved violent death, imprisonment, and humiliating pillage.
  reasoning_layer_used: POB lexical decisions
  rationale: The wording explains the sword idiom and keeps disgrace attached to the plundering.
- pob_phrase: to this present day
  simplified_phrase: This has continued to the present day
  preserved_meaning: The consequences remained in effect in the speaker’s time.
  reasoning_layer_used: POB lexical rationale
  rationale: A separate sentence states the continuing condition clearly.
interpretive_expansions:
- pob_phrase: the kings of the earth
  rendering: foreign kings
  claim: The phrase refers to foreign earthly rulers who gained power over the people.
  evidence:
  - The POB rationale says the exile context favors foreign earthly rulers.
  - The plural “kings” supports a broader reference than one local king.
  confidence: high
  alternatives_preserved:
  - kings of the earth
  - kings of the land
- pob_phrase: to the sword
  rendering: death by the sword
  claim: The sword represents violent death through warfare or execution.
  evidence:
  - The POB lexical rationale identifies this as a judgment idiom for violent death.
  confidence: high
  alternatives_preserved:
  - to the sword
translation_notes:
  risk_flags:
