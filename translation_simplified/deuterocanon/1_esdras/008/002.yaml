translation:
  language: en
  text: His family line went back through Saddoulouk,[a] Acheitob,[b] Amartheios, Ozeias, Bokka, Abeisai, Phinees, and Eleazar, to Aaron, the first priest.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek gives this longer family line; the shorter Hebrew parallel reads, “son of Shallum, son of Zadok, son of Ahitub.”
    reason: alternative_reading
  - marker: b
    text: 'Several Greek names have more familiar Hebrew forms: Acheitob is Ahitub, Ozeias is Uzzi, Bokka is Bukki, Abeisai is Abishua, and Phinees is Phinehas.'
    reason: lexical_alternative
  - marker: c
    text: This could mean “the first high priest,” but the Greek word itself means “priest.”
    reason: lexical_alternative
