  preserved_meaning: The names remain an ordered line of descent ending with Aaron.
  reasoning_layer_used: Greek genealogy and POB lexical decision for repeated genitives
  rationale: A single ancestry clause replaces a long series of repeated phrases without collapsing the genealogy.
- pob_phrase: the first priest
  simplified_phrase: the first priest
  preserved_meaning: Aaron is identified as first, while the Greek title remains priest rather than high priest.
  reasoning_layer_used: POB lexical and theological decisions on τοῦ πρώτου ἱερέως
  rationale: The key source-driven title is retained because “high priest” would be more interpretive.
