translation:
  language: en
  text: Ten men from among their brothers also joined them. I weighed out to them[a] the silver and gold, along with the holy vessels belonging to the temple of our Lord. The king, his advisers, the nobles, and all Israel had donated these things.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek reads “I set before them,” while the Hebrew parallel reads “I weighed out to them,” which fits the valuables listed here.
    reason: textual_variant
simplification_decisions:
- pob_phrase: And with them, from among their brothers, ten men.
  simplified_phrase: Ten men from among their brothers also joined them.
  preserved_meaning: Ten additional men from their brothers accompanied the group.
  reasoning_layer_used: POB lexical decision on μετʼ αὐτῶν ... ἄνδρας δέκα
  rationale: The abrupt Greek wording becomes a complete English sentence without identifying the brothers more narrowly.
- pob_phrase: the holy vessels of the house of our Lord
  simplified_phrase: the holy vessels belonging to the temple of our Lord
  preserved_meaning: The sacred implements belonged to the Lord’s temple.
  reasoning_layer_used: POB lexical and theological decisions on τὰ ἱερὰ σκεύη and κυρίου ἡμῶν
  rationale: “Temple” makes the meaning of “house” clear while retaining “holy vessels” and “our Lord.”
- pob_phrase: which the king and his counselors and the nobles and all Israel had given as a gift
  simplified_phrase: The king, his advisers, the nobles, and all Israel had donated these things.
  preserved_meaning: All the named groups had previously given the valuables as gifts.
  reasoning_layer_used: POB lexical decision on οὕτως ἐδωρήσατο and οἱ σύμβουλοι
  rationale: A separate sentence and the common word “donated” make the prior gift easier to follow.
