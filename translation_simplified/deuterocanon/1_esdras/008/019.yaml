translation:
  language: en
  text: I, King Artaxerxes, have ordered the treasury officials of Syria and Phoenicia to carefully give Ezra whatever he requests, up to one hundred talents of silver.[a] Ezra is the priest and reader of the law of God Most High.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A talent was an ancient unit of weight used for precious metals.
    reason: cultural_note
simplification_decisions:
- pob_phrase: the treasurers of Syria and Phoenicia
  simplified_phrase: the treasury officials of Syria and Phoenicia
  preserved_meaning: They are officials responsible for treasury funds.
  reasoning_layer_used: POB lexical decision for γαζοφύλαξι
  rationale: “Treasury officials” makes their public role immediately clear.
- pob_phrase: whatever Ezra the priest and reader of the law of God Most High may send for
  simplified_phrase: give Ezra whatever he requests ... Ezra is the priest and reader of the law of God Most High
  preserved_meaning: Ezra may request supplies in his recognized religious role.
  reasoning_layer_used: POB lexical decisions for ἀποστείλῃ and ἀναγνώστης
  rationale: Dividing the sentence improves clarity while preserving Ezra’s Greek title “reader.”
- pob_phrase: up to one hundred talents of silver
  simplified_phrase: up to one hundred talents of silver
  preserved_meaning: The royal authorization has a fixed upper limit of one hundred talents.
  reasoning_layer_used: POB lexical decision for ἕως ἀργυρίου τάλαντων ἑκατόν
  rationale: The exact ancient measure remains in the text while the footnote explains it.
interpretive_expansions:
- pob_phrase: may send for
  rendering: requests
  claim: In this supply order, sending for something means requesting it.
  evidence:
  - The POB lexical rationale identifies a requisition or request by dispatch.
  - The treasury officials are ordered to provide what Ezra sends for.
  confidence: high
  alternatives_preserved:
  - may send for
translation_notes:
  risk_flags:
  - risk: “Requests” makes the contextual sense of the Greek verb “send” explicit.
    mitigation: The POB footnote and lexical rationale support this supply-request meaning.
