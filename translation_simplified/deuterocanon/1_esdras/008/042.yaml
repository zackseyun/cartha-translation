translation:
  language: en
  text: After I gathered them at the river known as the River,[a] we camped there for three days, and I inspected them.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “the river called the River,” probably using “River” as a place-name.
    reason: lexical_alternative
  - marker: b
    text: The Greek shifts from “we camped” to “I inspected”; it does not say “we inspected.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: after gathering them to the river called the River
  simplified_phrase: After I gathered them at the river known as the River
  preserved_meaning: Ezra assembled the people at a river whose designation was “River.”
  reasoning_layer_used: Greek lexical decisions for συναγαγών and ἐπὶ τὸν λεγόμενον Ποταμόν
  rationale: The rewrite supplies the implied subject and presents the unusual place designation in natural English.
- pob_phrase: we camped there for three days, and I examined them
  simplified_phrase: we camped there for three days, and I inspected them
  preserved_meaning: The group camped while Ezra personally reviewed those assembled, without specifying when during that period he did so.
  reasoning_layer_used: Lexical decision for κατέμαθον and theological decision on the person shift
  rationale: The wording preserves the coordination and the source’s shift from “we” to “I.”
translation_notes:
  risk_flags:
  - risk: Readers may mistake “the River” for accidental repetition rather than a place designation.
    mitigation: The wording “known as” and the footnote indicate its likely place-name force without removing uncertainty.
