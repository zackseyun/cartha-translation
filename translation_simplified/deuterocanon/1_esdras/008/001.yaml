  reasoning_layer_used: POB lexical decision for μεταγενέστερος τούτων ἐστίν
  rationale: “Events” makes the chronological transition clearer than “things.”
- pob_phrase: in the reign of Artaxerxes king of the Persians
  simplified_phrase: while Artaxerxes was king of the Persians
  preserved_meaning: These events occurred during Artaxerxes’ rule over the Persians.
  reasoning_layer_used: POB lexical decisions for βασιλεύοντος Ἀρταξέρξου and τοῦ βασιλέως Περσῶν
  rationale: The wording is natural English and retains the Greek plural “Persians.”
- pob_phrase: Ezra son of Azariah, son of Zechariah, son of Chelkiah, son of Shallum, came up
