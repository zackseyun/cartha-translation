  preserved_meaning: Ezra’s upward journey and his complete recorded ancestry remain distinct.
  reasoning_layer_used: POB lexical decision for προσέβη and proper-name decisions
  rationale: Two sentences make the action and genealogy easier to follow without adding a destination.
