translation:
  language: en
  text: After these events, while Artaxerxes was king of the Persians,[a] Ezra came up. He was the son of Azariah, son of Zechariah, son of Chelkiah, son of Shallum.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “king of the Persians”; the Hebrew parallel in Ezra 7:1 says “king of Persia.”
    reason: alternative_reading
  - marker: b
    text: The Greek name “Chelkiah” corresponds to “Hilkiah” in the Hebrew parallel.
    reason: lexical_alternative
