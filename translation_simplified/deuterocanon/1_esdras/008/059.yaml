translation:
  language: en
  text: Stay awake and guard these things until you hand them over to the leaders among the priests and Levites and to the heads of Israel’s ancestral households, in the rooms of the house of our Lord in Jerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “house of our Lord” is the temple complex.
    reason: cultural_note
simplification_decisions:
- pob_phrase: the chiefs of the priests and the Levites
  simplified_phrase: the leaders among the priests and Levites
  preserved_meaning: The recipients are leaders of the priestly and Levitical groups.
  reasoning_layer_used: Lexical decision for φυλάρχοις
  rationale: “Leaders among” is clearer modern English without suggesting tribal chiefs.
- pob_phrase: the heads of the fathers’ houses of Israel
  simplified_phrase: the heads of Israel’s ancestral households
  preserved_meaning: These are leaders of Israel’s formal kinship groups.
  reasoning_layer_used: Lexical and theological decisions for πατριῶν
  rationale: “Ancestral households” makes the kinship structure understandable without reducing it to generic families.
- pob_phrase: in the chambers of the house of our Lord
  simplified_phrase: in the rooms of the house of our Lord
  preserved_meaning: The handover occurs in rooms within the Lord’s temple complex.
  reasoning_layer_used: Lexical decision for παστοφορίοις and temple terminology decision
  rationale: “Rooms” is common English, while “house of our Lord” preserves the Greek wording.
interpretive_expansions:
