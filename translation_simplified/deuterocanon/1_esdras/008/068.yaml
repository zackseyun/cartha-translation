translation:
  language: en
  text: The moment I heard this, I tore my clothes and the holy robe.[a] I pulled out hair from my head and beard, then sat down, stunned and overwhelmed with grief.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “sacred garment”; the Greek does not specifically say that it was a priestly robe.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: as soon as I heard these things
  simplified_phrase: The moment I heard this
  preserved_meaning: His distressed response began immediately after he heard the report.
  reasoning_layer_used: Lexical decision for ἅμα τῷ ἀκοῦσαί με
  rationale: “The moment” expresses the same immediate sequence in direct modern English.
- pob_phrase: I tore my garments and the holy robe
  simplified_phrase: I tore my clothes and the holy robe
  preserved_meaning: He tore both his ordinary garments and the sacred robe as an act of grief.
  reasoning_layer_used: Lexical and theological decisions for τὰ ἱμάτια and τὴν ἱερὰν ἐσθῆτα
  rationale: “Clothes” is familiar, while “holy robe” preserves the distinction without assuming a priestly office.
- pob_phrase: I sat down stunned and deeply grieved
  simplified_phrase: then sat down, stunned and overwhelmed with grief
  preserved_meaning: He sat in a state of mental shock and intense sorrow.
  reasoning_layer_used: Lexical decisions for σύννους and περίλυπος
  rationale: The wording clearly communicates both shock and profound grief.
translation_notes:
  risk_flags:
  - risk: Readers may assume that the holy robe was specifically a priestly robe.
    mitigation: The footnote preserves the broader sense and warns against greater specificity.
