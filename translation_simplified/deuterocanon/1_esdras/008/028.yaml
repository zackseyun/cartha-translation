translation:
  language: en
  text: The following are the leaders, grouped by their ancestral clans and divisions,[a] who traveled up with me from Babylon during the reign of King Artaxerxes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “divisions”; the Hebrew parallel refers instead to genealogical enrollment or lineage.
    reason: alternative_reading
