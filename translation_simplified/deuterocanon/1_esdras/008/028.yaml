- pob_phrase: these are the leaders according to their fathers’ houses and their divisions
  simplified_phrase: The following are the leaders, grouped by their ancestral clans and divisions
  preserved_meaning: The verse introduces leaders identified according to lineage-based groups and their divisions.
  reasoning_layer_used: POB lexical decisions and Greek primary witness
  rationale: “Ancestral clans” makes the lineage grouping clear while “divisions” preserves the Greek witness.
- pob_phrase: who went up with me from Babylon
  simplified_phrase: who traveled up with me from Babylon
  preserved_meaning: The leaders accompanied the speaker on the upward journey from Babylon.
  reasoning_layer_used: POB lexical decision for οἱ ἀναβάντες
  rationale: Adding “traveled” clarifies the idiom while keeping its upward-journey image.
- pob_phrase: in the reign of Artaxerxes the king
