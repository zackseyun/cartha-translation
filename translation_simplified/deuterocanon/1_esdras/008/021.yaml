translation:
  language: en
  text: Carry this out according to God’s law for God Most High,[a] so that wrath may not come upon the realm of the king and his sons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew parallel in Ezra 7:23 differs substantially and lists provisions for temple service; this translation follows the shorter Greek text.
    reason: textual_variant
simplification_decisions:
- pob_phrase: Let it be done according to the law of God
  simplified_phrase: Carry this out according to God’s law
  preserved_meaning: The command requires the prescribed action to conform to God’s binding law.
  reasoning_layer_used: Greek imperative and POB lexical decisions for ἐπιτελεσθήτω and νόμον
  rationale: The direct command is easier to understand while preserving the requirement to perform the prescribed action.
- pob_phrase: the kingdom of the king and his sons
  simplified_phrase: the realm of the king and his sons
  preserved_meaning: The threatened wrath concerns the one royal realm associated with both the king and his sons.
  reasoning_layer_used: Greek genitive construction and POB lexical alternative for βασιλείαν
  rationale: “Realm” avoids awkward repetition while keeping the king and his sons linked to one domain.
translation_notes:
  risk_flags:
  - risk: Readers may understand “wrath” as explicitly identified as God’s wrath.
    mitigation: The text retains the unqualified word “wrath,” preserving the source’s restraint.
