translation:
  language: en
  text: He rose after fasting. His clothes and holy robe[b] were torn. Then he knelt, stretched out his hands to the Lord, and said:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek verb is plural in form (literally, “they were saying”), but the context introduces Ezra’s prayer.
    reason: textual_variant
  - marker: b
    text: Or “sacred garment.” The Greek does not explicitly call it a priestly robe.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And rising from the fasting
  simplified_phrase: He rose after fasting.
  preserved_meaning: Ezra moves from fasting to prayer.
  reasoning_layer_used: Greek source and lexical decision for ἐξεγερθείς ἐκ τῆς νηστείας
  rationale: A direct sentence replaces the difficult participial opening without implying more than a transition.
- pob_phrase: with his garments and the holy robe torn
  simplified_phrase: His clothes and holy robe were torn.
  preserved_meaning: Both his ordinary clothing and distinct sacred robe were torn.
  reasoning_layer_used: Lexical and theological decisions for τὰ ἱμάτια and τὴν ἱερὰν ἐσθῆτα
  rationale: “Clothes” is common English, while “holy robe” retains the sacred distinction without calling it priestly.
- pob_phrase: he bent his knees and stretched out his hands to the Lord
  simplified_phrase: Then he knelt, stretched out his hands to the Lord
  preserved_meaning: Ezra takes both bodily postures of prayer before the Lord.
  reasoning_layer_used: Lexical decisions for κάμψας τὰ γόνατα, ἐκτείνας τὰς χεῖρας, and κύριος
  rationale: “Knelt” clearly expresses bent knees while retaining the separate image of outstretched hands.
translation_notes:
  risk_flags:
  - risk: “After fasting” could suggest that the entire fast had ended.
    mitigation: The wording marks sequence without stating the fasting’s duration.
  - risk: The Greek speech verb is plural although the context points to Ezra.
    mitigation: The footnote identifies the plural form and explains the contextual rendering.
