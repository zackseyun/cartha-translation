translation:
  language: en
  text: Carry out whatever you and your brothers wish to do with the silver and gold, following the will of your God.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ezra 7:18 is more specific: it speaks of doing what seems best with the silver and gold that remains. The Greek of 1 Esdras gives broader wording.'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And whatever you and your brothers wish to do with the silver and gold, carry it out
  simplified_phrase: Carry out whatever you and your brothers wish to do with the silver and gold
  preserved_meaning: Ezra is commanded to carry out what he and his brothers wish to do with the designated funds.
  reasoning_layer_used: Greek clause structure and lexical decisions for πάντα ὅσα ἂν βούλῃ and ἐπιτέλει
  rationale: Moving the command first makes the sentence easier to follow without turning the wish-clause into permission.
- pob_phrase: according to the will of your God
  simplified_phrase: following the will of your God
  preserved_meaning: God's will governs how they carry out their plans for the funds.
  reasoning_layer_used: Lexical and theological decision for κατὰ τὸ θέλημα τοῦ θεοῦ σου
  rationale: “Following” expresses the governing norm in familiar English without adding a contrast.
translation_notes:
  risk_flags:
  - risk: The broad wording could be mistaken for unrestricted personal use.
    mitigation: The text keeps God's will as the governing norm and refers to the specific silver and gold.
  - risk: Ezra 7:18 gives a narrower parallel involving the remaining funds.
    mitigation: The footnote preserves that difference without overriding the Greek base text.
