translation:
  language: en
  text: Ever since the time of our fathers,[a] we have continued in great sin right up to today.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Fathers” here means the generations of ancestors who came before them.
    reason: simplification_note
simplification_decisions:
- pob_phrase: From the times of our fathers
  simplified_phrase: Ever since the time of our fathers
  preserved_meaning: The sinful condition began in the ancestors’ time and continued afterward.
  reasoning_layer_used: Lexical decisions for ἀπὸ, χρόνοι, and πατέρων, plus the gendered-language theological decision.
  rationale: “Ever since” clearly expresses the starting point while retaining “fathers.”
- pob_phrase: we have been in great sin until this day
  simplified_phrase: we have continued in great sin right up to today
  preserved_meaning: Their serious state of sin has lasted into the speaker’s present.
  reasoning_layer_used: Lexical decisions for ἐσμεν, ἐν μεγάλῃ ἁμαρτίᾳ, and ἕως τῆς ἡμέρας ταύτης.
  rationale: “Continued” and “right up to today” make the ongoing state clear in ordinary English.
translation_notes:
  risk_flags:
  - risk: “Continued” could be heard as repeated sinful acts rather than an ongoing condition.
    mitigation: Keeping “in great sin” preserves the Greek image of being in a serious state of sin.
