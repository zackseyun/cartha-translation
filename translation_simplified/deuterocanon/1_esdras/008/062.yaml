translation:
  language: en
  text: There, on the third day, the silver and gold were weighed out and handed over in the house of the Lord. They were given to Marmothi son of Ourias the priest, and Eleazar son of Phinehas was with him. The Levites Josabees son of Jesous and Moeth son of Sabannus were also with them. Everything was counted and weighed, and the full weight was recorded immediately.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek names differ from those in the Hebrew parallel, which uses forms such as Meremoth son of Uriah. This translation follows the Greek text of 1 Esdras.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And when the third day came there
  simplified_phrase: There, on the third day
  preserved_meaning: The transfer took place there when the third day arrived.
  reasoning_layer_used: Lexical decisions for γενομένης ... ἡμέρας τρίτης and αὐτόθι
  rationale: The reordered phrase preserves both timing and location in natural English.
- pob_phrase: and with him was Eleazar ... and with them were ... the Levites
  simplified_phrase: Eleazar ... was with him. The Levites ... were also with them.
  preserved_meaning: Eleazar and the two named Levites accompanied the recipients during the transfer.
  reasoning_layer_used: Lexical decisions for μετʼ αὐτοῦ and ἦσαν μετʼ αὐτῶν
  rationale: Separate sentences make the accompanying groups easier to follow.
- pob_phrase: by number and by weight, all of it; and the whole weight was recorded at that very time
  simplified_phrase: Everything was counted and weighed, and the full weight was recorded immediately
  preserved_meaning: All the valuables were fully accounted for and their weight was promptly documented.
  reasoning_layer_used: Lexical decisions for πρὸς ἀριθμὸν καὶ ὁλκὴν πάντα and αὐτῇ τῇ ὥρᾳ
  rationale: Direct wording clearly preserves completeness, weighing, counting, and immediate recording.
