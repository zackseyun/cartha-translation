translation:
  language: en
  text: I appointed twelve men who were leaders among the priests. I also appointed Eserebias[a] and Asoamias[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eserebias likely corresponds to Sherebiah in the Hebrew parallel.
    reason: alternative_reading
  - marker: b
    text: Asoamias likely corresponds to Hashabiah in the Hebrew parallel.
    reason: alternative_reading
  - marker: c
    text: The Greek is shorter here than Ezra 8:24 in the Hebrew, which adds more names and describes weighing the silver, gold, and vessels.
    reason: cross_reference
simplification_decisions:
- pob_phrase: I set apart
  simplified_phrase: I appointed
  preserved_meaning: The men were formally chosen from a group for a particular responsibility.
  reasoning_layer_used: The lexical decision for ἐχώρισα includes an appointing nuance.
  rationale: “Appointed” makes the formal selection clear in common English.
- pob_phrase: from the leaders of the priests
  simplified_phrase: who were leaders among the priests
  preserved_meaning: The twelve men belonged to the leadership of the priestly group.
  reasoning_layer_used: The lexical decisions identify φυλάρχων as leaders and treat τῶν ἱερέων as qualifying them.
  rationale: The relative clause states the group relationship more naturally.
- pob_phrase: and Eserebias and Asoamias
  simplified_phrase: I also appointed Eserebias and Asoamias
  preserved_meaning: Eserebias and Asoamias were set apart along with the twelve men.
  reasoning_layer_used: The Greek conjunction and repeated names remain controlling.
  rationale: A second sentence removes the crowded coordination without merging the names into the twelve.
translation_notes:
  risk_flags:
  - risk: “Appointed” foregrounds the formal role more than the separating image in “set apart.”
    mitigation: The source verb and POB rationale explicitly include formal appointment within its meaning.
