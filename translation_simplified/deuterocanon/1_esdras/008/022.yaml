translation:
  language: en
  text: You are also formally told that no tax or other burden may be imposed on any priest, Levite, temple singer, gatekeeper, temple servant, or other worker at this temple. No one has authority to place such a burden on them.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And it is also declared to you that
  simplified_phrase: You are also formally told that
  preserved_meaning: The statement remains an official notice addressed to the decree's recipients.
  reasoning_layer_used: POB lexical decision for λέγεται and the royal-decree context
  rationale: The active wording is easier to follow while “formally” preserves the administrative force.
- pob_phrase: any of the priests, Levites, temple singers, gatekeepers, temple servants, or workers of this temple
  simplified_phrase: any priest, Levite, temple singer, gatekeeper, temple servant, or other worker at this temple
  preserved_meaning: Every listed class of temple personnel remains protected.
  reasoning_layer_used: POB lexical decisions for the personnel terms
  rationale: Singular class labels and “other worker” make the list more natural without narrowing its scope.
- pob_phrase: and that no one is to have authority to impose it on them
  simplified_phrase: No one has authority to place such a burden on them.
  preserved_meaning: No person has legal power to impose the prohibited obligation.
  reasoning_layer_used: POB lexical decision for μηδένα ἔχειν ἐξουσίαν ἐπιβαλεῖν τούτοις
  rationale: A separate sentence makes the legal prohibition immediately clear.
translation_notes:
  risk_flags:
  - risk: “Other burden” may be read more broadly than a fiscal or administrative levy.
    mitigation: Keeping it beside “tax” preserves the decree's economic and administrative context.
