translation:
  language: en
  text: From the family of Zathoes came Eiechonias son of Jethel,[a] with 200 men. From the family of Adin came Obeth son of Jonathan,[b] with 250 men.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek has the family name Zathoes; the approximate Hebrew parallel uses a different form.
    reason: alternative_reading
  - marker: b
    text: The Greek form behind Obeth is uncertain; Uben or Oben is also possible.
    reason: lexical_alternative
