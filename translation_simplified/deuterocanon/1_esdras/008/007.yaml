translation:
  language: en
  text: Apsaras had extensive knowledge.[a] As he taught all Israel the statutes and judgments, he left out nothing from the Lord’s law and commandments.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek text calls him “Apsaras”; the parallel Hebrew context corresponds to Ezra.
    reason: alternative_reading
  - marker: b
    text: The Greek is compressed here; this translation follows the likely sense that he taught these legal matters to all Israel.
    reason: source_note
simplification_decisions:
- pob_phrase: had great learning
  simplified_phrase: had extensive knowledge
  preserved_meaning: Apsaras possessed substantial learned understanding.
  reasoning_layer_used: Lexical decision for πολλὴν ἐπιστήμην περιεῖχεν.
  rationale: “Extensive knowledge” is clearer modern English than “great learning.”
- pob_phrase: so as to leave out nothing ... teaching all Israel
  simplified_phrase: As he taught all Israel ... he left out nothing
  preserved_meaning: His instruction omitted none of the Lord’s legal teaching.
  reasoning_layer_used: Theological decision on the compressed Greek syntax.
  rationale: The recast sentence makes the warranted teaching relationship easy to follow.
- pob_phrase: the law of the Lord and ... the commandments ... the statutes and the judgments
  simplified_phrase: the statutes and judgments ... the Lord’s law and commandments
  preserved_meaning: The distinct legal terms remain coordinated without imposing a hierarchy among them.
  reasoning_layer_used: Lexical decisions for νόμος, ἐντολαί, δικαιώματα, and κρίματα.
  rationale: The wording keeps “and” and avoids treating statutes and judgments as a subset.
interpretive_expansions:
- pob_phrase: all Israel, statutes and judgments
  rendering: As he taught all Israel the statutes and judgments
  claim: The final legal terms describe what Apsaras taught all Israel.
  evidence:
  - The POB theological decision adopts the legal-instruction sense implied by the context and vocabulary.
  - The POB text explicitly supplies “teaching” to resolve the compressed Greek.
  confidence: moderate
  alternatives_preserved:
