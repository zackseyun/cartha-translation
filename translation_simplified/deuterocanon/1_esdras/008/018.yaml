  reasoning_layer_used: POB lexical decisions for τὰ λοιπὰ, ὅσα ἂν ὑποπίπτῃ σοι, and εἰς τὴν χρείαν
  rationale: The conditional wording expresses the same open-ended possibility in direct English.
- pob_phrase: the house of your God
  simplified_phrase: the temple of your God
  preserved_meaning: The need concerns the institution and complex devoted to the worship of God.
  reasoning_layer_used: Greek ἱερόν, POB lexical alternatives, and the administrative context
  rationale: “Temple” prevents readers from mistaking the expression for an ordinary residence.
- pob_phrase: you shall give
