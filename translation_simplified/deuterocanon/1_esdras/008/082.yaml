translation:
  language: en
  text: Do not take their daughters as wives for your sons. Do not seek peace with them for all time.[a] Do this so that, once you have grown strong, you may eat the good things of the land and inherit it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Do not seek their peace or prosperity for all time.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: take their daughters for your sons
  simplified_phrase: take their daughters as wives for your sons
  preserved_meaning: The command forbids arranging marriages between their daughters and the readers’ sons.
  reasoning_layer_used: lexical decision and marriage context
  rationale: Adding “as wives” makes the implied marriage setting clear.
- pob_phrase: so that, having become strong
  simplified_phrase: Do this so that, once you have grown strong
  preserved_meaning: Becoming strong precedes the stated purpose or result of enjoying and inheriting the land.
  reasoning_layer_used: Greek participial sequence and grounding review
  rationale: The new clause is natural English while preserving the participle’s prior relationship to what follows.
- pob_phrase: you may eat the good things of the land and inherit it
  simplified_phrase: you may eat the good things of the land and inherit it
  preserved_meaning: The concrete image of eating the land’s good things and its inheritance language both remain.
  reasoning_layer_used: lexical decisions
  rationale: Keeping both source images avoids reducing them to general prosperity.
interpretive_expansions:
- pob_phrase: take their daughters for your sons
  rendering: take their daughters as wives for your sons
  claim: The taking described here is taking in marriage.
  evidence:
  - The POB lexical rationale identifies this as a marriage context.
  - The daughters-for-sons construction implies marriage.
  confidence: high
  alternatives_preserved:
  - take their daughters for your sons
translation_notes:
  risk_flags:
  - risk: “Seek peace” may sound narrower than the underlying idiom.
    mitigation: The footnote preserves the supported sense of seeking their peace or prosperity.
  - risk: “Once” may be heard as only temporal.
    mitigation: “Do this so that” preserves the purpose or result relationship while keeping growth in strength prior to eating and inheriting.
