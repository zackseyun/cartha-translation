translation:
  language: en
  text: Ezra, appoint judges and other court officials in keeping with the wisdom of your God. They are to judge everyone throughout Syria and Phoenicia[a] who knows the law of your God. You must teach those who do not know it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek text names Syria and Phoenicia; the Hebrew parallel in Ezra uses different provincial wording.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: according to the wisdom of your God
  simplified_phrase: in keeping with the wisdom of your God
  preserved_meaning: Ezra must make the appointments according to divine wisdom.
  reasoning_layer_used: POB translation and applied revision
  rationale: The new wording clarifies how God's wisdom guides the appointments.
- pob_phrase: judges and magistrates
  simplified_phrase: judges and other court officials
  preserved_meaning: Ezra must appoint two related kinds of judicial officers.
  reasoning_layer_used: Lexical decisions for κριτὰς and δικαστάς
  rationale: Court officials explains the unfamiliar term magistrates without merging the two roles.
- pob_phrase: so that they may judge ...; and you shall teach
  simplified_phrase: They are to judge ... You must teach
  preserved_meaning: The decree commands both the officials to judge and Ezra to teach.
  reasoning_layer_used: Lexical decisions for ὅπως δικάζωσιν and διδάξεις
  rationale: Two direct sentences make the distinct duties and their binding force easier to follow.
translation_notes:
  risk_flags:
  - risk: Other court officials is broader than the specific historical title magistrates.
    mitigation: The wording retains a distinct judicial role while avoiding an opaque term.
  - risk: The Greek geography differs from the Hebrew parallel.
    mitigation: The main text follows the controlling Greek source and notes the difference.
