simplification_decisions:
- pob_phrase: And concerning
  simplified_phrase: As for
  preserved_meaning: The phrase introduces the sacred vessels as the topic under discussion.
  reasoning_layer_used: The lexical decision for κατὰ identifies a topic in an administrative letter.
  rationale: “As for” is a natural way to introduce the subject in modern English.
- pob_phrase: holy vessels
  simplified_phrase: sacred vessels
  preserved_meaning: The items are consecrated implements rather than ordinary containers.
  reasoning_layer_used: The lexical decision for ἱερὰ σκεύη preserves both their sacred status and their identity as vessels.
  rationale: “Sacred” makes their religious use clearer while retaining the source image of vessels.
- pob_phrase: that are being given for the use of
  simplified_phrase: being given for use in
  preserved_meaning: The vessels are presently being handed over for practical service in the temple.
  reasoning_layer_used: The lexical decisions for τὰ διδόμενα and εἰς τὴν χρείαν support present transfer and practical use.
  rationale: The shorter construction removes passive clutter without losing the ongoing transfer or intended use.
