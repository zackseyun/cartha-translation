translation:
  language: en
  text: Then I told them, “You are holy to the Lord, and so are these temple objects. The silver and gold are a freewill offering to the Lord,[a] the God of our fathers.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “a vow offering”; the Hebrew parallel has “a freewill offering.”
    reason: lexical_alternative
