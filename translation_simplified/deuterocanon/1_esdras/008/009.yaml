translation:
  language: en
  text: King Artaxerxes sends greetings to Ezra, the priest and reader of the Lord’s law.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “reader of the Lord’s law”; the Hebrew parallel in Ezra 7:12 says “scribe of the law of the God of heaven.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: King Artaxerxes to Ezra ... greetings
  simplified_phrase: King Artaxerxes sends greetings to Ezra
  preserved_meaning: This is the opening address and greeting of a royal letter.
  reasoning_layer_used: The lexical rationale identifies “greetings” as a standard letter-opening formula.
  rationale: Adding “sends” turns the compressed ancient letter formula into natural modern English.
- pob_phrase: reader of the law of the Lord
  simplified_phrase: reader of the Lord’s law
  preserved_meaning: Ezra is identified as a reader of the divine law.
  reasoning_layer_used: The Greek lexical and theological decisions require “reader” rather than “scribe.”
  rationale: The possessive form is easier to read while retaining the Greek-based title.
translation_notes:
  risk_flags:
  - risk: Modern readers may expect Ezra to be called a scribe.
    mitigation: The footnote preserves the Hebrew parallel while keeping the Greek reading primary.
