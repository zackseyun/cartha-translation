translation:
  language: en
  text: Look, here we are before you with our sins against your law.[a] Because of these sins, we can no longer stand before you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can refer to their lawless acts or to the guilt those acts brought.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: we are before you in our lawless deeds
  simplified_phrase: here we are before you with our sins against your law
  preserved_meaning: They come into God's presence burdened by their violations of his law.
  reasoning_layer_used: POB lexical and theological decisions on ἀνομίαι
  rationale: The rewrite makes the moral and legal sense clear without using the difficult phrase “in our lawless deeds.”
- pob_phrase: for it is no longer possible to stand before you because of these things
  simplified_phrase: Because of these sins, we can no longer stand before you
  preserved_meaning: Their confessed sins make them unable to stand in God's presence.
  reasoning_layer_used: Greek causal clause and POB decision on στῆναι
  rationale: The direct sentence keeps both the cause and the solemn image of standing before God.
interpretive_expansions:
- pob_phrase: lawless deeds
  rendering: sins against your law
  claim: The deeds violate God's law rather than merely human law.
  evidence:
  - The confession is addressed directly to God.
  - The POB rationale identifies covenant violation and transgression of God's commands.
  confidence: high
  alternatives_preserved:
  - lawless acts
  - guilt from those acts
translation_notes:
  risk_flags:
  - risk: “Stand before you” may be read only as physical posture.
    mitigation: It is retained because the Greek and POB preserve a solemn judicial image of remaining in God's presence.
