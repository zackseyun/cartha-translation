translation:
  language: en
  text: 'From the descendants of Pharez: Zechariah,[a] along with 150 men listed in the family record.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew parallel has “Parosh” instead of “Pharez”; the main text follows the Greek of 1 Esdras.
    reason: alternative_reading
  - marker: b
