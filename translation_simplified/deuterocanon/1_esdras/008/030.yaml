    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Of the sons of Pharez
  simplified_phrase: From the descendants of Pharez
  preserved_meaning: The men belonged to the ancestral line of Pharez.
  reasoning_layer_used: POB base text and census context
  rationale: “Descendants” makes the family-line sense of “sons” clear.
- pob_phrase: and with him
  simplified_phrase: along with
  preserved_meaning: The 150 men accompanied or were grouped with Zechariah.
  reasoning_layer_used: POB lexical decision for μετʼ αὐτοῦ
  rationale: “Along with” expresses accompaniment in natural list wording.
- pob_phrase: according to the record
  simplified_phrase: listed in the family record
  preserved_meaning: The men were counted on a written genealogical register.
  reasoning_layer_used: POB lexical rationale and MT parallel
  rationale: The active wording explains how the record relates to the men.
interpretive_expansions:
- pob_phrase: according to the record
