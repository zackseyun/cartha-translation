  - marker: c
    text: The Hebrew parallel says eighteen rather than ten.
    reason: textual_variant
simplification_decisions:
- pob_phrase: from the sons of Mooli
  simplified_phrase: from the family line of Mooli
  preserved_meaning: Asebebias belonged to Mooli’s line of descent.
  reasoning_layer_used: POB lexical decision for τῶν υἱῶν Μοολὶ
  rationale: “Family line” makes the genealogical expression immediately clear.
- pob_phrase: a man of understanding ...—Asebebias
