  preserved_meaning: Asebebias is identified as the knowledgeable man.
  reasoning_layer_used: POB lexical decision for ἐπιστήμονα
  rationale: Naming him first removes the difficult delayed identification.
- pob_phrase: and his sons and brothers, ten
  simplified_phrase: with his sons and brothers—ten in all
  preserved_meaning: Asebebias’s sons and brothers formed a group totaling ten.
  reasoning_layer_used: POB lexical decisions for τοὺς υἱοὺς καὶ τοὺς ἀδελφούς and δέκα
  rationale: “Ten in all” expresses a total without implying selection from a larger group.
