translation:
  language: en
  text: There I called for a time of fasting for the young men in the presence of our Lord.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can literally mean “I prayed” or “I vowed” a fast; “called for” follows the sense of the Hebrew parallel, “I proclaimed a fast.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: proclaimed a fast before our Lord for the young men
  simplified_phrase: called for a time of fasting for the young men in the presence of our Lord
  preserved_meaning: The speaker publicly initiates fasting for the young men as an act done before the Lord.
  reasoning_layer_used: POB lexical decisions and Greek-Hebrew divergence ruling
  rationale: “Called for a time of fasting” explains the formal phrase “proclaimed a fast” while retaining the POB reading of the disputed verb.
translation_notes:
  risk_flags:
