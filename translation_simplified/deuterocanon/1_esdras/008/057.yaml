translation:
  language: en
  text: 'After weighing it all, he handed over to them: 650 talents[c] of silver, silver vessels worth 100 talents, 100 talents of gold, twenty gold bowls[b], and ten vessels made of fine, gleaming bronze.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek inventory differs notably from the Hebrew parallel in Ezra 8:27, which lists two bronze vessels and gives a value for the gold bowls; this translation follows the Greek text of 1 Esdras.
    reason: textual_variant
  - marker: b
    text: The rare Greek term may instead mean “gold objects,” though the Hebrew parallel supports “bowls” or “basins.”
    reason: lexical_alternative
  - marker: c
    text: A talent was a large ancient unit of weight.
    reason: cultural_note
simplification_decisions:
