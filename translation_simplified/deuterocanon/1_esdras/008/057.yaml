  rationale: Ordinary clause order makes the sequence immediately clear.
- pob_phrase: six hundred fifty talents of silver, and silver vessels worth a hundred talents, and a hundred talents of gold
  simplified_phrase: 650 talents of silver, silver vessels worth 100 talents, 100 talents of gold
  preserved_meaning: The quantities and distinction between weight and value remain unchanged.
  reasoning_layer_used: POB inventory and lexical decisions
  rationale: Numerals and a colon make the long inventory easier to scan.
- pob_phrase: ten vessels of fine gleaming bronze
  simplified_phrase: ten vessels made of fine, gleaming bronze
  preserved_meaning: The vessels are bronze, and the metal is both high-quality and shining.
  reasoning_layer_used: POB lexical decision for χαλκᾶ ... ἀπὸ χαλκοῦ χρηστοῦ στίλβοντα
  rationale: “Made of” states the material relationship in natural English.
