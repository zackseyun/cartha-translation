  preserved_meaning: Ezra mourned a violation of God’s law.
  reasoning_layer_used: POB lexical decision for ἀνομίᾳ
  rationale: The phrase explains the biblical sense of “lawlessness” directly.
- pob_phrase: I sat grieved
