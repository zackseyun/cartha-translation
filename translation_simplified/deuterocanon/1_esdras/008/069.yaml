translation:
  language: en
  text: Everyone who had ever been moved by the word of the Lord, the God of Israel,[a] gathered around me as I mourned this breaking of God’s law. Deeply grieved, I sat there until the evening sacrifice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also be read, “the word of the Lord of Israel.”
