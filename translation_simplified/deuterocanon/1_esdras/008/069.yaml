  simplified_phrase: everyone who had ever been moved by the word
  preserved_meaning: The people had responded inwardly to the Lord’s word.
  reasoning_layer_used: POB lexical decision for ἐπεκινοῦντο
  rationale: “Moved” expresses the inward response in more familiar English.
- pob_phrase: mourning over the lawlessness
