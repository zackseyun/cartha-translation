translation:
  language: en
  text: The priests and Levites took their places, properly dressed and organized into divisions,[a] to carry out the work of the Lord God of Israel as the book of Moses instructed. The gatekeepers took their places at each gate.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “by tribes,” probably referring here to organized groups for service.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: stood arrayed by divisions
  simplified_phrase: took their places, properly dressed and organized into divisions
  preserved_meaning: The priests and Levites were formally dressed, arranged in groups, and ready for service.
  reasoning_layer_used: Lexical decisions for ἔστησαν, ἐστολισμένοι, and κατὰ φυλάς
  rationale: This clearly preserves their placement, formal dress, and ordered grouping as distinct ideas.
- pob_phrase: for the works of the Lord God of Israel
  simplified_phrase: to carry out the work of the Lord God of Israel
  preserved_meaning: They were responsible for work done in service to the Lord God of Israel.
  reasoning_layer_used: Lexical decision for ἐπὶ τῶν ἔργων and Greek source context
  rationale: The active wording makes their responsibility clear without narrowing the work further.
- pob_phrase: in accordance with the book of Moses
  simplified_phrase: as the book of Moses instructed
  preserved_meaning: Their service arrangement followed authoritative written Mosaic instruction.
  reasoning_layer_used: Lexical decision for ἀκολούθως τῇ Μωσέως βίβλῳ
  rationale: This expresses the phrase’s normative force in ordinary English.
translation_notes:
  risk_flags:
  - risk: “Properly dressed” may suggest prescribed clothing more specifically than the Greek states.
    mitigation: The wording avoids naming priestly vestments while preserving the audited sense of formal readiness.
  - risk: “Divisions” does not retain the Greek’s literal wording “by tribes.”
    mitigation: The footnote preserves the lexical alternative and its likely service context.
