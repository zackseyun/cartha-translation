translation:
  language: en
  text: They sacrificed the Passover offering for all the returned exiles—the “sons of the captivity”—for their brothers who were priests, and for themselves.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: sacrificed the Passover
  simplified_phrase: sacrificed the Passover offering
  preserved_meaning: The Passover is presented as a sacrifice without specifying that it was a lamb.
  reasoning_layer_used: POB lexical decision for τὸ πάσχα and footnote b
  rationale: Adding “offering” makes the sacrificial sense clear to readers unfamiliar with this usage.
- pob_phrase: all the sons of the captivity
  simplified_phrase: all the returned exiles—the “sons of the captivity”
  preserved_meaning: The phrase identifies the returned exilic community while retaining the Greek corporate image.
  reasoning_layer_used: POB lexical and theological decisions for πᾶσιν τοῖς υἱοῖς τῆς αἰχμαλωσίας
  rationale: The explanation gives the idiom's meaning while preserving its masculine familial wording.
- pob_phrase: their brothers the priests
  simplified_phrase: their brothers who were priests
  preserved_meaning: The priests are identified as fellow members of the community and called brothers.
  reasoning_layer_used: POB lexical decisions for ἀδελφοῖς and ἱερεῦσιν
  rationale: The relative clause makes the relationship between “brothers” and “priests” immediately clear.
interpretive_expansions:
- pob_phrase: the Passover
  rendering: the Passover offering
  claim: Here “the Passover” refers to the sacrificial offering or observance.
  evidence:
