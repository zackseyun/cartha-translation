  - The POB lexical rationale identifies the sacrificial sense as active.
  confidence: high
  alternatives_preserved:
  - The wording does not specify a lamb.
  - The phrase still retains the link to the Passover observance.
- pob_phrase: sons of the captivity
  rendering: returned exiles—the “sons of the captivity”
  claim: The expression refers corporately to the returned exilic community.
  evidence:
  - The POB footnote identifies this as a corporate expression for the returned exiles.
  - The POB lexical rationale recognizes its technical social sense.
  confidence: high
  alternatives_preserved:
  - The literal corporate expression remains in the text.
  - The masculine familial image is not replaced outright.
