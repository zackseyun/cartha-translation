  rationale: “Israelites” is the POB-approved modern equivalent of the traditional expression.
- pob_phrase: the rest from the captivity who had been brought back
  simplified_phrase: the rest of the people who had been brought back from exile
  preserved_meaning: The remaining members of the restored community had come back from exile.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Exile” makes the historical meaning of “captivity” clear while retaining the passive restoration wording.
- pob_phrase: did according to what is in the book of Moses
