translation:
  language: en
  text: They celebrated the Feast of Unleavened Bread for seven days, rejoicing in the Lord’s presence.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: kept the Feast
  simplified_phrase: celebrated the Feast
  preserved_meaning: They observed the named religious festival.
  reasoning_layer_used: The lexical decision identifies “celebrated” as a valid festival-context rendering of ἤγαγον.
  rationale: “Celebrated” is clearer to readers unfamiliar with the biblical expression “kept a feast.”
- pob_phrase: before the Lord
  simplified_phrase: in the Lord’s presence
  preserved_meaning: Their joyful celebration took place consciously before God.
  reasoning_layer_used: The lexical rationale says ἔναντι conveys presence before God, while the theological decision retains “the Lord.”
  rationale: The new wording makes the spatial image understandable without weakening it.
translation_notes:
  risk_flags:
  - risk: “Celebrated” may sound less like formal religious observance than “kept.”
    mitigation: The full festival title and seven-day duration preserve the sense of an established observance.
