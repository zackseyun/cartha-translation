  preserved_meaning: The group belongs to Israel and had come back from captivity or exile.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The relative clause clarifies their return while retaining the corporate title “sons of Israel.”
- pob_phrase: kept the Passover
  simplified_phrase: celebrated the Passover
  preserved_meaning: They observed the Passover festival.
  reasoning_layer_used: POB lexical decision for ἤγαγον
  rationale: “Celebrated” expresses the festival idiom in familiar modern English.
- pob_phrase: had purified themselves together
  simplified_phrase: had purified themselves together for the ceremony
  preserved_meaning: The priests and Levites jointly completed ritual purification in preparation for Passover.
  reasoning_layer_used: POB theological decision and cultural note on cultic purification
  rationale: “For the ceremony” identifies the purification as ritual preparation without asserting an unstated requirement.
