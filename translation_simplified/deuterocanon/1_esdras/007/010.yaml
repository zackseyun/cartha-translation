translation:
  language: en
  text: The sons of Israel[a] who had returned from captivity celebrated the Passover on the fourteenth day of the first month, when the priests and Levites had purified themselves together for the ceremony.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sons of Israel” is the traditional corporate name for the people descended from Israel.
    reason: source_note
