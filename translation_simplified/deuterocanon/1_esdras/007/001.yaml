translation:
  language: en
  text: Then Sisinnes, governor of Coele-Syria[a] and Phoenicia, and Sathrabuzanes, together with their associates,[b] obeyed the orders King Darius had given,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Coele-Syria was the formal name of a region; it does not mean simply “hollow Syria.”
    reason: cultural_note
  - marker: b
    text: The Greek may also mean “the associates,” without specifying whose they were.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and Sathrabuzanes and their associates
  simplified_phrase: and Sathrabuzanes, together with their associates
  preserved_meaning: Sathrabuzanes and the associated officials acted with Sisinnes.
  reasoning_layer_used: POB lexical decision for οἱ συνέταιροι
  rationale: “Together with” makes the grouping easier to follow without changing who is included.
- pob_phrase: following what had been commanded by King Darius
  simplified_phrase: obeyed the orders King Darius had given
  preserved_meaning: They acted in accordance with Darius’s commands.
  reasoning_layer_used: POB lexical decisions for κατακολουθήσαντες and τοῖς ... προσταγεῖσιν
  rationale: The direct wording replaces an awkward passive construction while preserving obedience to the king’s orders.
