translation:
  language: en
  text: Who authorized you to build this house,[a] finish its roof, and complete all the other work? Who are the builders doing this work?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “house” is the temple.
    reason: cultural_note
simplification_decisions:
- pob_phrase: By whose authorization are you building
  simplified_phrase: Who authorized you to build
  preserved_meaning: The question asks who officially approved the work.
  reasoning_layer_used: Lexical decision for συντάξαντος and doctrine realignment
  rationale: The active question is easier to follow while retaining official authorization.
- pob_phrase: completing this roof and all the rest
  simplified_phrase: finish its roof, and complete all the other work
  preserved_meaning: The workers are finishing the roof and every remaining part of the project.
  reasoning_layer_used: Lexical decisions for στέγην, τἄλλα πάντα, and ἐπιτελεῖτε
  rationale: The revised wording makes the construction tasks explicit in natural English.
- pob_phrase: the builders carrying out these things
  simplified_phrase: the builders doing this work
  preserved_meaning: The officials also ask for the identity of those executing the project.
  reasoning_layer_used: Lexical decisions for οἰκοδόμοι and τελοῦντες
  rationale: “Doing this work” avoids an abstract phrase without weakening the inquiry.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “house” to mean an ordinary home.
    mitigation: A brief footnote identifies the house as the temple while preserving the source term.
