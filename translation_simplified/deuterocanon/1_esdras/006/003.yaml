translation:
  language: en
  text: Sisinnes, the governor of Syria and Phoenicia, was there with them at that time. Sathrabuzanes and his associates were there too. Then he said to them,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “he,” most naturally referring to Sisinnes as the leading official.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: At that time Sisinnes, the governor of Syria and Phoenicia, was present with them
  simplified_phrase: Sisinnes, the governor of Syria and Phoenicia, was there with them at that time.
  preserved_meaning: Sisinnes was present with the group at that point, without implying that he had just arrived.
  reasoning_layer_used: POB lexical decisions for ἐν αὐτῷ τῷ χρόνῳ, παρῆν, and πρὸς αὐτούς
  rationale: “Was there with them” expresses presence in ordinary English without adding motion.
- pob_phrase: along with Sathrabuzanes and his associates
  simplified_phrase: Sathrabuzanes and his associates were there too.
  preserved_meaning: Sathrabuzanes and his associates were also present with the addressed group.
  reasoning_layer_used: POB translation and lexical decisions for Σαθραβουζάνης and οἱ συνέταιροι
  rationale: A separate sentence clarifies their shared presence without making them specifically present with Sisinnes.
- pob_phrase: and he said to them
  simplified_phrase: Then he said to them
  preserved_meaning: One official, most naturally Sisinnes, begins speaking to the group.
  reasoning_layer_used: POB lexical decision and footnote for καὶ εἶπεν αὐτοῖς
  rationale: “Then” makes the narrative sequence natural while retaining the singular speaker.
translation_notes:
  risk_flags:
  - risk: The singular “he” could seem to refer to Sathrabuzanes because his name is nearer.
    mitigation: The footnote identifies Sisinnes as the most natural speaker without presenting that identification as certain.
  - risk: The source does not explicitly supply the possessive in “his associates.”
    mitigation: The wording follows the controlling POB text and does not broaden it to “their associates.”
