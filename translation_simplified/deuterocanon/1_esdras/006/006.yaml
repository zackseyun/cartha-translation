translation:
  language: en
  text: So they kept building until a report about them was sent to Darius and an answer came back.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “and an answer was given.” The Greek can refer to being addressed or receiving an official response; here it likely refers to an official answer after the report to Darius.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: they were not hindered from building
  simplified_phrase: they kept building
  preserved_meaning: Their construction work continued without being stopped.
  reasoning_layer_used: The lexical decisions for οὐκ ἐκωλύθησαν and τῆς οἰκοδομῆς.
  rationale: This states the practical result clearly without implying that anyone granted permission.
- pob_phrase: word about them should be sent to Darius
  simplified_phrase: a report about them was sent to Darius
  preserved_meaning: An official communication concerning the builders went to Darius.
  reasoning_layer_used: The lexical decision for ὑποσημανθῆναι and the administrative context.
  rationale: “Report” makes the official nature of the communication clear.
- pob_phrase: a reply should be returned
  simplified_phrase: an answer came back
  preserved_meaning: An official response followed the report without specifying who issued or received it.
  reasoning_layer_used: The lexical decision for προσφωνηθῆναι and its documented ambiguity.
  rationale: The active English idiom is clear while avoiding an unsupported personal agent.
translation_notes:
  risk_flags:
  - risk: “An answer came back” follows the contextual sense rather than the verb’s more literal addressing sense.
    mitigation: The footnote preserves the lexical alternative and identifies the contextual basis.
