translation:
  language: en
  text: He was ordered to bring back all these temple objects and put them in the temple in Jerusalem. The Lord’s temple was also to be built on its site.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also be translated “carry back all these vessels” and “build the Lord’s temple in its place.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: was commanded
  simplified_phrase: was ordered
  preserved_meaning: He received an official command.
  reasoning_layer_used: The lexical decision for ἐπετάγη identifies a formal decree.
  rationale: “Was ordered” is direct modern English for an official command.
- pob_phrase: all these vessels
  simplified_phrase: all these temple objects
  preserved_meaning: The objects were implements belonging in the temple.
  reasoning_layer_used: The lexical decision for σκεύη identifies temple implements.
  rationale: “Temple objects” avoids the likely modern misunderstanding of containers or ships.
- pob_phrase: and that the temple of the Lord should be built on its site
  simplified_phrase: The Lord’s temple was also to be built on its site
  preserved_meaning: The decree required construction of the Lord’s temple at its proper location.
  reasoning_layer_used: The lexical and theological decisions retain the passive construction, location, and title “Lord.”
  rationale: A separate sentence makes the second requirement easier to follow.
interpretive_expansions:
- pob_phrase: vessels
  rendering: temple objects
  claim: The vessels are objects used in or belonging to the temple.
  evidence:
  - The immediate context says they are to be put in the Jerusalem temple.
  - The POB lexical rationale identifies σκεύη as temple implements.
  confidence: high
  alternatives_preserved:
  - vessels
  - temple implements
translation_notes:
  risk_flags:
  - risk: “Temple objects” is broader than the traditional term “vessels.”
    mitigation: The footnote preserves “vessels,” and the context still identifies their temple function.
  - risk: The Greek permits slightly different wording for the return and location phrases.
    mitigation: The footnote preserves the documented alternatives without changing the main POB reading.
