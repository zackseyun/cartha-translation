translation:
  language: en
  text: Nebuchadnezzar had taken the holy gold and silver vessels out of the temple in Jerusalem and placed them in his own temple. Then King Cyrus brought them out again from the temple in Babylon and handed them over to Zerubbabel and Sanabassar the governor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek name is Sanabassar; this is likely the man called Sheshbazzar in Ezra.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the holy vessels, the gold and the silver ones
  simplified_phrase: the holy gold and silver vessels
  preserved_meaning: The objects remain sacred vessels made of gold and silver.
  reasoning_layer_used: Lexical decisions for ἱερὰ σκεύη and τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ
  rationale: Combining the repeated wording gives natural English without weakening their sacred status.
- pob_phrase: the house in Jerusalem
  simplified_phrase: the temple in Jerusalem
  preserved_meaning: The house is clearly identified as Jerusalem’s sanctuary.
  reasoning_layer_used: Lexical and theological decisions for οἴκου τοῦ ἐν Ἰερουσαλήμ
  rationale: “Temple” prevents readers from mistaking the sanctuary for an ordinary home.
- pob_phrase: deposited in his own temple—Cyrus the king again brought them out
  simplified_phrase: placed them in his own temple. Then King Cyrus brought them out again
  preserved_meaning: Nebuchadnezzar put the vessels in his temple, and Cyrus later reversed that action.
  reasoning_layer_used: Lexical decisions for ἀπηρείσατο, ἐξήνεγκεν, and πάλιν
  rationale: Two direct sentences make the sequence and reversal easier to follow.
interpretive_expansions:
- pob_phrase: the house in Jerusalem
  rendering: the temple in Jerusalem
  claim: The Jerusalem house is the sanctuary from which the holy vessels were taken.
  evidence:
  - The POB audit states that οἶκος refers to the Jerusalem temple in this context.
  - The holy vessels and the contrasting Babylonian temple confirm the sanctuary setting.
  confidence: high
translation_notes:
  risk_flags:
  - risk: Using “temple” for both buildings no longer displays the Greek distinction between οἶκος and ναός.
    mitigation: The contextual meaning is clearer, while the source distinction remains recorded in the audit.
  - risk: Identifying Sanabassar with Sheshbazzar is probable but not certain.
    mitigation: The main text keeps the Greek name, and the footnote marks the identification as likely.
