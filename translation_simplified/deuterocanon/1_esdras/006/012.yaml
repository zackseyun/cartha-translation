translation:
  language: en
  text: But they replied to us, “We are the Lord’s servants.[a] He created heaven and earth.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “children.” The Greek word can mean either “servants” or “children,” but the context points to serving the Lord.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: answered us, saying
  simplified_phrase: replied to us
  preserved_meaning: They gave a direct response to the officials.
  reasoning_layer_used: Lexical decision for ἀπεκρίθησαν and ἡμῖν
  rationale: “Replied to us” removes the unnecessary speech formula while keeping the response and its recipients.
- pob_phrase: the Lord, who created heaven and earth
  simplified_phrase: the Lord’s servants. He created heaven and earth
  preserved_meaning: The speakers serve the Lord, identified as the creator of the whole created order.
  reasoning_layer_used: Lexical and theological decisions for παῖδες, κύριος, and κτίζω
  rationale: Two short sentences make the identification easier to follow without weakening the title or creation claim.
