translation:
  language: en
  text: He also ordered Sisinnes, governor of Syria and Phoenicia; Sathrabuzanes and their associates; and the appointed governors in Syria and Phoenicia to stay away from the place and leave Zerubbabel—the servant of the Lord and governor of Judea—and the Jewish elders alone.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “allow Zerubbabel, the servant of the Lord and governor of Judea, and the Jewish elders to proceed.” The Greek describes official noninterference.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: He also ordered Sisinnes ... and the appointed governors ... to keep away
  simplified_phrase: He also ordered Sisinnes ...; Sathrabuzanes ...; and the appointed governors ... to stay away
  preserved_meaning: Every named official received the same authoritative directive not to interfere at the place.
  reasoning_layer_used: Greek syntax and POB lexical decisions for προσετάξεν, ἐπιμεληθῆναι, and ἀπέχεσθαι
  rationale: Semicolons organize the long recipient list while the direct verb clearly governs the command.
- pob_phrase: the elders of the Jews
  simplified_phrase: the Jewish elders
  preserved_meaning: The recognized leaders of the Jewish community are meant.
  reasoning_layer_used: POB lexical decision for πρεσβυτέρους
  rationale: The shorter form is natural English and retains the established title “elders.”
- pob_phrase: Zerubbabel, the servant of the Lord and governor of Judea
  simplified_phrase: Zerubbabel—the servant of the Lord and governor of Judea—
  preserved_meaning: Zerubbabel’s honorific relationship to the Lord and his governing office both remain explicit.
  reasoning_layer_used: POB theological and lexical decisions for παῖδα Κυρίου and ὕπαρχον
  rationale: Dashes make both titles easy to recognize without weakening their force.
translation_notes:
  risk_flags:
  - risk: “Leave ... alone” may sound passive rather than permitting the work to continue.
    mitigation: The footnote preserves the alternative “allow ... to proceed” and explains the sense of official noninterference.
