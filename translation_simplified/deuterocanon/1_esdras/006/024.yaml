translation:
  language: en
  text: Let them offer sacrifices in a fire that is kept burning continually. What is being built must be sixty cubits[a] high and sixty cubits wide, with three layers of polished stone and one layer of new local timber. The cost must be paid from King Cyrus’s royal resources.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A cubit was an ancient unit based on the length of the forearm; its exact length varied.
    reason: cultural_note
simplification_decisions:
- pob_phrase: with continual fire
  simplified_phrase: in a fire that is kept burning continually
  preserved_meaning: The sacrifices are offered with an ongoing fire.
  reasoning_layer_used: POB translation and Greek source image
  rationale: The rewrite explains “continual” while retaining the concrete image of fire.
- pob_phrase: whose height is sixty cubits and width sixty cubits
  simplified_phrase: What is being built must be sixty cubits high and sixty cubits wide
  preserved_meaning: The stated construction has equal height and width without naming its unclear antecedent.
  reasoning_layer_used: POB wording and immediate construction context
  rationale: The neutral wording clarifies the sentence without identifying the structure more precisely than the POB does.
- pob_phrase: three courses of polished stone and one course of new local timber; and let the expense be given from the house of Cyrus the king
  simplified_phrase: three layers of polished stone and one layer of new local timber. The cost must be paid from King Cyrus’s royal resources
  preserved_meaning: The construction uses the specified materials and is funded from Cyrus’s royal means.
  reasoning_layer_used: POB translation and grounding review
  rationale: Common wording replaces technical terms without narrowing the funding source to a specific treasury.
interpretive_expansions:
- pob_phrase: whose height is sixty cubits and width sixty cubits, with three courses
  rendering: What is being built must be sixty cubits high and sixty cubits wide, with three layers
  claim: The dimensions describe a construction rather than the continual fire.
  evidence:
  - The following phrase specifies layers of stone and timber.
  - The POB links the dimensions directly to construction materials.
  confidence: high
  alternatives_preserved:
  - The structure itself is not specifically identified.
- pob_phrase: from the house of Cyrus the king
  rendering: from King Cyrus’s royal resources
  claim: Cyrus’s house refers here to royal means used to cover the cost.
  evidence:
  - The clause directly concerns payment of the construction cost.
  confidence: moderate
  alternatives_preserved:
  - King Cyrus’s household resources
  - A royal treasury
translation_notes:
  risk_flags:
  - risk: The Greek and POB leave the antecedent of the dimensions unclear.
    mitigation: The text says “what is being built” rather than identifying a temple or altar.
  - risk: “Royal resources” makes the financial sense of Cyrus’s “house” explicit.
    mitigation: This broad wording avoids specifying either a treasury or household funds.
