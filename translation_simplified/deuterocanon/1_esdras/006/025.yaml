translation:
  language: en
  text: The holy gold and silver items from the Lord’s temple—the ones Nebuchadnezzar removed from the temple in Jerusalem and took to Babylon—must be returned to the temple in Jerusalem and put back in their former place.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek calls these items “holy vessels” and the temple “the house of the Lord.”
    reason: simplification_note
simplification_decisions:
- pob_phrase: the holy vessels of the house of the Lord, both the gold and the silver ones
  simplified_phrase: the holy gold and silver items from the Lord’s temple
  preserved_meaning: These are sacred temple objects made of gold and silver.
  reasoning_layer_used: POB lexical decisions for ἱερὰ σκεύη, οἴκου Κυρίου, and τά τε χρυσᾶ καὶ ἀργυρᾶ
  rationale: “Items” and “temple” make the ritual wording immediately understandable while the footnote preserves the source images.
- pob_phrase: carried out from the house in Jerusalem and took to Babylon
  simplified_phrase: removed from the temple in Jerusalem and took to Babylon
  preserved_meaning: Nebuchadnezzar transferred the sacred items from Jerusalem to Babylon.
  reasoning_layer_used: POB lexical decisions for ἐξήνεγκεν and ἀπήνεγκεν εἰς Βαβυλῶνα
  rationale: “Removed” naturally conveys taking the items out without losing the direction of the action.
- pob_phrase: are to be restored to the house in Jerusalem where they were placed, so that they may be set there
  simplified_phrase: must be returned to the temple in Jerusalem and put back in their former place
  preserved_meaning: The decree requires the items to be restored to their proper location in the Jerusalem temple.
  reasoning_layer_used: POB lexical decisions for ἀποκατασταθῆναι, οὗ ἦν κείμενα, and ὅπως τεθῇ ἐκεῖ
  rationale: “Put back in their former place” compresses the repeated placement clauses while preserving restoration.
