translation:
  language: en
  text: If it is confirmed that the house of the Lord in Jerusalem was built with King Cyrus’s approval, and if our lord the king considers it appropriate, let him send us word about these matters.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: if it is found
  simplified_phrase: if it is confirmed
  preserved_meaning: An official inquiry determines whether Cyrus authorized the work.
  reasoning_layer_used: POB lexical decision and administrative context
  rationale: “Confirmed” makes the result of the official inquiry clearer.
- pob_phrase: the building of the house of the Lord in Jerusalem was done
  simplified_phrase: the house of the Lord in Jerusalem was built
  preserved_meaning: The construction project for the Lord’s sanctuary took place.
  reasoning_layer_used: POB lexical decision and contextual footnote
  rationale: The active construction wording is more direct while retaining the supplied word “house.”
- pob_phrase: if it seems good to our lord the king
  simplified_phrase: if our lord the king considers it appropriate
  preserved_meaning: The request remains subject to the king’s favorable judgment.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: This wording clarifies the deferential royal expression and keeps “lord” as a human honorific.
translation_notes:
  risk_flags:
  - risk: Readers may confuse the king’s title “lord” with the divine title “Lord.”
    mitigation: Capitalization distinguishes the royal honorific from the title for God.
