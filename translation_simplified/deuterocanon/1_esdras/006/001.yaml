translation:
  language: en
  text: In the second year of Darius’s reign, the prophets Haggai and Zechariah son of Iddo spoke God’s message to the Jews living in Judea and Jerusalem. They spoke in the name of the Lord, the God of Israel, over the people.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The source phrase translated “over the people” is compressed and could also mean “concerning them” or “to them.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: In the second year of the reign of Darius
  simplified_phrase: In the second year of Darius’s reign
  preserved_meaning: The event occurred during the second year of Darius’s rule.
  reasoning_layer_used: POB lexical decision for βασιλεία
  rationale: The possessive form is shorter and more natural while retaining “reign.”
- pob_phrase: Haggai and Zechariah son of Iddo, the prophets, prophesied
  simplified_phrase: the prophets Haggai and Zechariah son of Iddo spoke God’s message
  preserved_meaning: Both men acted as prophets, and Iddo is identified as Zechariah’s father.
  reasoning_layer_used: POB lexical decisions for ἐπροφήτευσεν and the patronymic
  rationale: This explains prophetic speech while preserving their title and Zechariah’s family identification.
- pob_phrase: to the Jews who were in Judea and Jerusalem in the name of the Lord God of Israel, over them
  simplified_phrase: to the Jews living in Judea and Jerusalem. They spoke in the name of the Lord, the God of Israel, over the people
  preserved_meaning: The prophets addressed the local Jews by the Lord’s authority, and the disputed closing relation remains “over” them.
  reasoning_layer_used: POB lexical and theological decisions for both uses of ἐπί and the divine title
  rationale: Two sentences clarify the audience and authorization without resolving the compressed closing phrase.
interpretive_expansions:
- pob_phrase: prophesied
  rendering: spoke God’s message
  claim: The prophets delivered a message from God rather than merely predicting future events.
  evidence:
  - The POB lexical rationale identifies the verb as the standard term for prophetic activity.
  - The phrase “in the name of the Lord” presents their speech as divinely authorized.
  confidence: high
  alternatives_preserved:
  - prophesied
  - spoke as prophets
translation_notes:
  risk_flags:
  - risk: “Over the people” remains unusual and may suggest authority as the only meaning.
    mitigation: The footnote preserves “concerning them” and “to them” as viable alternatives.
