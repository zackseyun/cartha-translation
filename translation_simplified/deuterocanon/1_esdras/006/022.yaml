translation:
  language: en
  text: Then King Darius ordered the archives in Babylon to be searched. At Ecbatana, the fortress in the land of Media, a place was found where the following had been recorded:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “a place was found.” This may mean a location in the archives where the written record was kept.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: ordered a search to be made in the archives kept in Babylon
  simplified_phrase: ordered the archives in Babylon to be searched
  preserved_meaning: Darius issued an authoritative order for an official search of Babylon’s archives.
  reasoning_layer_used: Lexical decisions for προσέταξεν, ἐπισκέψασθαι, and βιβλιοφυλακίοις
  rationale: The direct wording is easier to follow while preserving the royal command and archival search.
- pob_phrase: and in Ecbatana, the fortress in the land of Media
  simplified_phrase: At Ecbatana, the fortress in the land of Media
  preserved_meaning: The discovery occurred at the fortified administrative center of Ecbatana in Media.
  reasoning_layer_used: Lexical decisions for Ἐκβατάνοις, τῇ βάρει, and ἐν Μηδείᾳ χώρᾳ
  rationale: A new sentence clearly marks the change of location without weakening the fortress description.
- pob_phrase: a place was found in which these things had been recorded
  simplified_phrase: a place was found where the following had been recorded
  preserved_meaning: A location associated with the official written record was found, without specifying that it was a scroll.
  reasoning_layer_used: Lexical decisions for τόπος, ὑπομνημάτιστο, and τάδε
  rationale: “The following” naturally introduces the record while retaining the Greek’s uncertain reference to a place.
translation_notes:
  risk_flags:
  - risk: The phrase “a place was found” remains unusual in English and may not clearly identify what was discovered.
    mitigation: The footnote explains that it may refer to a location in the archives where the record was kept.
