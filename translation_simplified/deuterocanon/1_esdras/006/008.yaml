translation:
  language: en
  text: 'Let our lord the king know everything that follows: When we came to the land of Judea and the city of Jerusalem, we found the elders of the Jewish exile community there. They were building a great new house for the Lord.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “house for the Lord” is the temple.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Let everything be known to our lord the king
  simplified_phrase: Let our lord the king know everything that follows
  preserved_meaning: The formal report tells the king the full matter while retaining his courtly title.
  reasoning_layer_used: POB lexical decision for πάντα γνωστὰ ἔστω and theological decision for κύριος
  rationale: The active wording is easier to understand than the formal passive expression.
- pob_phrase: the elders of the captivity of the Jews
  simplified_phrase: the elders of the Jewish exile community
  preserved_meaning: These are leaders of the Jewish community shaped by exile and return.
  reasoning_layer_used: POB lexical rationale and footnote a
  rationale: The revised phrase makes the compressed Greek relationship clear in ordinary English.
- pob_phrase: in Jerusalem, the city, building a great new house for the Lord
  simplified_phrase: there. They were building a great new house for the Lord
  preserved_meaning: The elders were in Jerusalem and were constructing a great new house dedicated to God.
  reasoning_layer_used: POB lexical decisions for Jerusalem, οἰκοδομοῦντας οἶκον, and μέγαν καινόν
  rationale: Two sentences remove repetition and untangle the long clause without weakening the building image.
interpretive_expansions:
- pob_phrase: the elders of the captivity of the Jews
  rendering: the elders of the Jewish exile community
  claim: The elders led the Jewish exile or returnee community.
  evidence:
  - The POB lexical rationale identifies them as leaders of the returned or exilic Jewish community.
  - POB footnote a explains the compressed Greek in the same way.
  confidence: high
  alternatives_preserved:
