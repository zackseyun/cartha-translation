translation:
  language: en
  text: Funds from the tax revenue of Coele-Syria and Phoenicia[a] must be carefully provided to these men for sacrifices to the Lord—bulls, rams, and lambs. Zerubbabel the governor is named in connection with this provision.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Coele-Syria was the conventional Greek name of the region; the name literally means “Hollow Syria.”
    reason: cultural_note
  - marker: b
    text: The compressed Greek connects Zerubbabel the governor with this provision; he may receive or administer it, or his title may simply identify him within the decree.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: from the tribute of Coele-Syria and Phoenicia
  simplified_phrase: from the tax revenue of Coele-Syria and Phoenicia
  preserved_meaning: The funds come from official provincial tax income.
  reasoning_layer_used: lexical decision for φορολογίας
  rationale: “Tax revenue” makes the source of the funds clearer than “tribute.”
- pob_phrase: support is to be given carefully
  simplified_phrase: Funds ... must be carefully provided
  preserved_meaning: The decree requires conscientious provision of official financial support.
  reasoning_layer_used: lexical decisions for ἐπιμελῶς and σύνταξιν δίδοσθαι
  rationale: This wording states the financial requirement in ordinary English.
- pob_phrase: to Zerubbabel the governor
  simplified_phrase: Zerubbabel the governor is named in connection with this provision
  preserved_meaning: Zerubbabel and his title remain connected to the provision without fixing his precise role.
  reasoning_layer_used: POB footnote c and lexical decision for Ζοροβάβελ ἐπάρχῳ
  rationale: The neutral wording preserves the Greek ambiguity identified in the audit.
