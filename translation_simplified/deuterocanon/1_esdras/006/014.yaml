translation:
  language: en
  text: Our ancestors provoked the Lord of Israel, the heavenly One,[a] and sinned against him. Because of this, he handed them into the hands of Nebuchadnezzar, king of Babylon and king of the Chaldeans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the God of heaven.” The Greek says “the heavenly One,” while related Ezra tradition often uses the fuller title.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: our fathers
  simplified_phrase: our ancestors
  preserved_meaning: The phrase refers to the community’s forefathers.
  reasoning_layer_used: POB lexical alternatives
  rationale: “Ancestors” is immediately clear to modern readers without changing the family-history sense.
- pob_phrase: And because our fathers, having provoked him, sinned against ... he gave them
  simplified_phrase: Our ancestors provoked ... and sinned against him. Because of this, he handed them
  preserved_meaning: Their rebellion against the Lord caused their defeat and exile.
  reasoning_layer_used: Greek syntax and POB causal rationale
  rationale: Two sentences make the cause-and-result relationship easier to follow.
- pob_phrase: king of Babylon, king of the Chaldeans
  simplified_phrase: king of Babylon and king of the Chaldeans
  preserved_meaning: Both royal titles identify Nebuchadnezzar and retain the source repetition.
  reasoning_layer_used: POB lexical decision
  rationale: Adding “and” makes the repeated titles read naturally without dropping either one.
translation_notes:
  risk_flags:
  - risk: “The heavenly One” may sound unfamiliar as a divine title.
    mitigation: The main text preserves the Greek-based POB choice, and the footnote gives the traditional alternative.
  - risk: Splitting the sentence may make provoking and sinning seem more coordinate than the Greek participle does.
    mitigation: The wording keeps both actions and explicitly preserves their causal link to God’s judgment.
