translation:
  language: en
  text: They used costly cut stones and placed timber in the buildings. They carried out the work diligently,[a] and the work prospered in their hands. They completed it with full splendor and care.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “quickly”; the Greek can emphasize urgency as well as earnest care.
    reason: lexical_alternative
