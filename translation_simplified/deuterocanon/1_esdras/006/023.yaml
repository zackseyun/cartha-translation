translation:
  language: en
  text: In the first year of Cyrus’s reign, King Cyrus ordered that the Lord’s temple in Jerusalem be built, where sacrifices are continually offered by fire.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “where they sacrifice with continual fire.” The Greek may describe this as a place of ongoing offerings by fire.
    reason: lexical_alternative
