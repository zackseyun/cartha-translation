translation:
  language: en
  text: The elders of the Jews received favor from the Lord when they came to oversee the people in captivity.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The compressed Greek may also mean “when they were appointed to oversee the exiles.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: found favor from the Lord
  simplified_phrase: received favor from the Lord
  preserved_meaning: The elders experienced approval and help that came from the Lord.
  reasoning_layer_used: Lexical decision for ἔσχον χάριν and παρὰ τοῦ κυρίου
  rationale: “Received favor” states the source relationship more naturally in modern English.
- pob_phrase: having come to oversee
  simplified_phrase: when they came to oversee
  preserved_meaning: The elders entered a role of supervision without implying mere physical arrival.
  reasoning_layer_used: POB chosen rendering and doctrine realignment
  rationale: A finite time clause makes the compressed participial wording easier to follow.
- pob_phrase: the captivity
  simplified_phrase: the people in captivity
  preserved_meaning: The elders oversaw the community affected by exile or captivity.
  reasoning_layer_used: Lexical rationale and POB alternative-reading footnote
  rationale: Naming the people prevents the unnatural idea that an abstract condition was supervised.
interpretive_expansions:
- pob_phrase: the captivity
  rendering: the people in captivity
  claim: The object of the elders’ oversight is understood as the captive or exiled community.
  evidence:
  - The POB lexical note gives “exiles” as a possible sense.
  - The POB footnote describes oversight of the returned community.
  confidence: moderate
  alternatives_preserved:
  - the captivity
  - the exiles
  - the returned community
translation_notes:
  risk_flags:
  - risk: The Greek clause is compressed and may indicate appointment rather than coming to take oversight.
    mitigation: The footnote preserves the appointment reading without replacing the POB’s controlling wording.
