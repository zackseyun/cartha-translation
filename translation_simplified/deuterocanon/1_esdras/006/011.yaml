  simplified_phrase: so we could inform you and write to you the names
  preserved_meaning: The questioning was meant to inform the recipient through a written report of the leaders’ names.
  reasoning_layer_used: Lexical decisions for ἕνεκεν τοῦ γνωρίσαι σοι and γράψαι σοι
  rationale: The purpose clause is recast in ordinary English while retaining the specific writing action.
- pob_phrase: the men who were leading them
  simplified_phrase: the men serving as leaders
  preserved_meaning: The men held a leadership role, while the difficult participle remains qualified by a footnote.
  reasoning_layer_used: Lexical decision and POB footnote for τοὺς ἀφηγουμένους
  rationale: This removes an unclear pronoun while retaining the controlling leadership sense.
- pob_phrase: the list of names of those who were at their head
  simplified_phrase: the official list of names of those who headed the work
  preserved_meaning: They requested a register naming the people placed over the work as leaders.
  reasoning_layer_used: Lexical decisions for ὀνοματογραφίαν and τῶν προκαθηγουμένων, with the cultural note
  rationale: The wording keeps “list of names” explicit and turns the opaque head idiom into natural English.
