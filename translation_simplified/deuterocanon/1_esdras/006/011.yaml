translation:
  language: en
  text: So we questioned them so we could inform you and write to you the names of the men serving as leaders.[a] We also asked them for the official list of names of those who headed the work.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may refer either to the men leading the work or to those formally giving the account.
    reason: lexical_alternative
  - marker: b
    text: This was a written register naming the leaders who oversaw the work.
    reason: cultural_note
