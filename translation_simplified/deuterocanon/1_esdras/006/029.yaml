translation:
  language: en
  text: Likewise, year after year, wheat, salt, wine, and oil must be supplied continually. They are to be used each day as the priests in Jerusalem direct, without dispute.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “without fail.” The Greek may stress either no objection or certain compliance.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: continually year by year
  simplified_phrase: year after year ... supplied continually
  preserved_meaning: The supplies must be regularly available through each successive year.
  reasoning_layer_used: POB lexical decisions for ἐνδελεχῶς and κατ’ ἐνιαυτόν
  rationale: The new order makes the recurring obligation easier to follow.
- pob_phrase: as the priests in Jerusalem may direct, are to be used up day by day
  simplified_phrase: They are to be used each day as the priests in Jerusalem direct
  preserved_meaning: The priests determine the daily use of the supplies.
  reasoning_layer_used: POB lexical decisions for ὑπαγορεύσωσιν, ἀναλίσκεσθαι, and καθ’ ἡμέραν
  rationale: A separate sentence replaces the dense passive clause while retaining priestly direction and daily use.
interpretive_expansions:
- pob_phrase: wheat and salt and wine and oil continually
  rendering: wheat, salt, wine, and oil must be supplied continually
  claim: The listed items are an ongoing supply obligation, not merely a description of their use.
