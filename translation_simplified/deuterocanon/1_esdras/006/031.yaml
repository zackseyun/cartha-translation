translation:
  language: en
  text: Also order that if anyone violates any part of this written decree and makes it invalid, a beam must be taken from his own property, and he must be hanged on it.[a] All his possessions will become royal property.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “he must be be impaled on it” or “suspended on it.” The Greek says “hanged,” but the ancient punishment may have involved impalement or public suspension on a wooden beam.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: issue an order
  simplified_phrase: order
  preserved_meaning: This remains an official command.
  reasoning_layer_used: Lexical decision for προστάξαι
  rationale: The shorter verb clearly expresses the same governmental action.
- pob_phrase: transgresses any part of what has been written and nullifies it
  simplified_phrase: violates any part of this written decree and makes it invalid
  preserved_meaning: The offender both breaks a written provision and deprives it of legal force.
  reasoning_layer_used: Lexical decisions for παραβῶσίν, τι τῶν γεγραμμένων, and ἀκυρώσωσιν
  rationale: Common legal wording preserves the two distinct offenses.
- pob_phrase: a beam shall be taken from his own property and he shall be hanged on it, and his possessions shall become royal property
  simplified_phrase: a beam must be taken from his own property, and he must be hanged on it. All his possessions will become royal property
  preserved_meaning: The beam comes from the offender’s property, he is executed on it, and all his assets pass to the royal domain.
  reasoning_layer_used: Lexical and theological decisions for ξύλον, κρεμασθῆναι, and βασιλικά
  rationale: Two sentences make the penalties easier to follow without imposing a temporal sequence.
