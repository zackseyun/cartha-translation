translation:
  language: en
  text: Then Zerubbabel son of Salathiel and Jeshua[a] son of Josedek got up and began building the Lord’s house—the temple in Jerusalem. The Lord’s prophets were with them and helped them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jeshua is the postexilic high priest, not Jesus of Nazareth.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: stood up and began to build
  simplified_phrase: got up and began building
  preserved_meaning: They rose and took action to begin the work.
  reasoning_layer_used: Lexical decisions for στάς and ἤρξαντο οἰκοδομεῖν
  rationale: “Got up” naturally preserves both the rising image and the move to action.
- pob_phrase: the house of the Lord in Jerusalem
  simplified_phrase: the Lord’s house—the temple in Jerusalem
  preserved_meaning: They began constructing the sacred house belonging to the Lord in Jerusalem.
  reasoning_layer_used: Lexical decision for τὸν οἶκον τοῦ κυρίου and its location phrase
  rationale: “Temple” explains the referent while “house” preserves the source image.
- pob_phrase: while the prophets of the Lord were with them, helping them
  simplified_phrase: The Lord’s prophets were with them and helped them
  preserved_meaning: The prophets accompanied the builders and gave them support.
  reasoning_layer_used: Lexical decisions for συνόντων and βοηθούντων αὐτοῖς
  rationale: A separate sentence clearly preserves both the prophets’ presence and their help.
interpretive_expansions:
- pob_phrase: the house of the Lord
  rendering: the Lord’s house—the temple
  claim: The Lord’s house here is the Jerusalem temple.
  evidence:
  - The phrase identifies the sacred house as being in Jerusalem.
  - POB lists “the temple of the Lord” as a valid contextual alternative.
  confidence: high
  alternatives_preserved:
  - the Lord’s house
translation_notes:
  risk_flags:
  - risk: “Temple” states the referent more explicitly than the Greek word “house.”
    mitigation: The main text retains the concrete “house” image before the clarifier.
