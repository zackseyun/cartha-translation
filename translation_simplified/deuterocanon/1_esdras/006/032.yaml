translation:
  language: en
  text: Therefore, may the Lord[a], whose name is called upon there, destroy any king or nation that raises a hand to interfere with or harm that house of the Lord—the temple in Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “whose name is called there.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: whose name has been invoked there
  simplified_phrase: whose name is called upon there
  preserved_meaning: God’s name is invoked and associated with that place.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Called upon” expresses the temple setting in more familiar English while retaining the alternate reading.
- pob_phrase: every king and nation that stretches out its hand to hinder or to harm
  simplified_phrase: any king or nation that raises a hand to interfere with or harm
  preserved_meaning: The curse concerns every ruler or people who takes hostile action against the temple.
  reasoning_layer_used: POB lexical decisions
  rationale: This keeps the hand image while making the hostile action immediately clear.
- pob_phrase: that house of the Lord there in Jerusalem
  simplified_phrase: that house of the Lord—the temple in Jerusalem
  preserved_meaning: The Lord’s house is the Jerusalem temple.
  reasoning_layer_used: POB lexical decision and immediate context
  rationale: The added apposition explains the biblical temple idiom without replacing it.
interpretive_expansions:
- pob_phrase: that house of the Lord there in Jerusalem
  rendering: that house of the Lord—the temple in Jerusalem
  claim: The house of the Lord refers to the Jerusalem temple.
  evidence:
  - The POB lexical rationale says that “temple” is conceptually implied.
  - The verse explicitly locates the house in Jerusalem.
  confidence: high
  alternatives_preserved:
  - that house of the Lord in Jerusalem
translation_notes:
  risk_flags:
  - risk: “Raises a hand” varies slightly from the source image of stretching out a hand.
    mitigation: The wording retains the bodily image and its established sense of hostile action.
  - risk: “Called upon” may emphasize invocation more than simple association with the place.
    mitigation: The footnote preserves the more literal alternative allowed by the Greek.
