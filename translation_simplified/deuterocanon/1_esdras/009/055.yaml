translation:
  language: en
  text: For they were also instructed about the words they had been taught,[a] and they were gathered together.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The unusual Greek verb may more literally suggest being “imbued” or “inspired,” while the Hebrew parallel emphasizes gaining understanding.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: instructed in the words that they had been taught
  simplified_phrase: instructed about the words they had been taught
  preserved_meaning: They received instruction concerning words previously taught to them.
  reasoning_layer_used: POB lexical decisions for ἐνεφυσιώθησαν and οἷς ἐδιδάχθησαν
  rationale: “About” makes the relationship between the instruction and its subject clearer without merging the two source ideas.
- pob_phrase: they were assembled
  simplified_phrase: they were gathered together
  preserved_meaning: The people were gathered, with the agent left unstated.
  reasoning_layer_used: POB lexical decision for ἐπισυνήχθησαν and the primary Greek passive
  rationale: This is natural common English and avoids implying that someone forcibly brought them.
