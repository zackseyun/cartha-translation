translation:
  language: en
  text: This is a holy day for the Lord.[a] Everyone was weeping as they heard the law.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The parallel in Nehemiah 8 says “our Lord” and continues with instructions to eat, drink, share food, and not grieve; the Greek text of 1 Esdras is shorter.
    reason: cross_reference
simplification_decisions:
- pob_phrase: This day is holy to the Lord
  simplified_phrase: This is a holy day for the Lord
  preserved_meaning: The day is set apart as holy in relation to the Lord.
  reasoning_layer_used: The lexical decisions allow “for the Lord” while retaining “holy” and the divine title.
  rationale: The recast sentence uses natural modern word order without changing the religious meaning.
- pob_phrase: all were weeping
  simplified_phrase: Everyone was weeping
  preserved_meaning: The whole group was engaged in ongoing weeping.
  reasoning_layer_used: The lexical decisions permit “everyone” and preserve the imperfect verb’s ongoing action.
  rationale: “Everyone” makes the unnamed collective immediately clear in English.
- pob_phrase: when they heard the law
  simplified_phrase: as they heard the law
  preserved_meaning: Their weeping occurred while they heard the law.
  reasoning_layer_used: The lexical decision lists “as they heard” as a valid temporal rendering.
  rationale: “As” connects the hearing and ongoing weeping smoothly.
