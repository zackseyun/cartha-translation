translation:
  language: en
  text: Ezra stood up and said to them, “You have broken the law by marrying women from other peoples. By doing this, you have added to Israel’s sin.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Ezra rose
  simplified_phrase: Ezra stood up
  preserved_meaning: Ezra rose to address the people.
  reasoning_layer_used: Lexical decision for ἀναστὰς
  rationale: “Stood up” expresses the narrative action in familiar English.
- pob_phrase: acted lawlessly
  simplified_phrase: broken the law
  preserved_meaning: Their conduct violated the law rather than being merely improper.
  reasoning_layer_used: Lexical decision for ἠνομήσατε
  rationale: “Broken the law” makes the law-oriented accusation immediately clear.
- pob_phrase: have married foreign women, adding sin to Israel
  simplified_phrase: by marrying women from other peoples. By doing this, you have added to Israel’s sin
  preserved_meaning: Their marriages to women from other peoples increased Israel’s corporate sin.
  reasoning_layer_used: Lexical and theological decisions for συνῳκίσατε, γυναιξὶν ἀλλογενέσιν, and τῷ Ἰσραήλ
  rationale: The contextual marital sense is stated directly, and two sentences clarify the effect on Israel.
interpretive_expansions:
- pob_phrase: have married foreign women
  rendering: by marrying women from other peoples
  claim: The lawbreaking consisted in entering marital unions with women belonging to other peoples.
  evidence:
  - The POB text renders the action as “have married foreign women.”
  - The lexical rationale says the verb refers here to entering marital unions.
  - The Ezra context concerns intermarriage.
  confidence: high
  alternatives_preserved:
  - have lived with foreign women
  - have taken foreign women as wives
translation_notes:
  risk_flags:
  - risk: The phrase may sound like a universal condemnation of marriage across all ethnic groups.
    mitigation: The wording keeps Ezra’s specific law-bound accusation without adding a broader rule.
