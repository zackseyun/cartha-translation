translation:
  language: en
  text: When the law was read,[a] everyone stood upright. Then Azarias[b] praised the Most High God, the Lord of hosts,[c] the Almighty.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “when the law was opened” or “unrolled for reading.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew parallel has Azariah.
    reason: alternative_reading
  - marker: c
    text: Greek has Sabaoth, a traditional divine title; “Lord of hosts” is the traditional English rendering.
    reason: source_note
