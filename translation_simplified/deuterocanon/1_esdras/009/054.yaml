translation:
  language: en
  text: They all left to eat, drink, and celebrate. They sent servings of food to those who had nothing,[a] and they rejoiced greatly.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “to those who had no food prepared.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: went away to eat and drink and rejoice
  simplified_phrase: left to eat, drink, and celebrate
  preserved_meaning: They dispersed from the gathering to enjoy a joyful meal.
  reasoning_layer_used: Greek lexical decisions for ᾤχοντο and εὐφραίνεσθαι
  rationale: The shorter wording uses ordinary English while retaining both departure and celebration.
- pob_phrase: send portions
  simplified_phrase: sent servings of food
  preserved_meaning: They distributed shares of the feast to others.
  reasoning_layer_used: Greek lexical decision informed by the Hebrew parallel
  rationale: “Servings of food” makes the festive portions immediately clear.
- pob_phrase: and to rejoice greatly
  simplified_phrase: and they rejoiced greatly
  preserved_meaning: Their joy was intense and is stated separately from the earlier celebration.
  reasoning_layer_used: Greek lexical decision for εὐφρανθῆναι μεγάλως and applied revision
  rationale: A finite clause reads naturally while preserving the repeated emphasis on joy.
interpretive_expansions:
- pob_phrase: portions
  rendering: servings of food
  claim: The portions were shares of food from the feast.
  evidence:
  - The POB lexical rationale identifies these as food portions in context.
  - The Hebrew parallel explicitly refers to sending food shares.
  confidence: high
  alternatives_preserved:
  - portions
  - shares
translation_notes:
  risk_flags:
  - risk: “Those who had nothing” may suggest total poverty rather than lacking feast provisions.
    mitigation: The footnote preserves the narrower contextual alternative.
  - risk: The two references to joy may sound repetitive in modern English.
    mitigation: Both are retained because the Greek states the festive joy twice for emphasis.
