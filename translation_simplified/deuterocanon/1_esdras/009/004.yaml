translation:
  language: en
  text: Anyone who does not appear within two or three days, as the elders in charge have ruled, will have their livestock devoted.[a] That person will also be excluded from the community of the exiles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may mean that their livestock will be forfeited or confiscated; the Greek describes it as “devoted.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: according to the judgment of the presiding elders
  simplified_phrase: as the elders in charge have ruled
  preserved_meaning: The elders issued an authoritative ruling governing the summons.
  reasoning_layer_used: Lexical decisions for κρῖμα and προκαθημένων πρεσβυτέρων
  rationale: This uses ordinary legal English without weakening the elders’ authority.
- pob_phrase: their livestock will be devoted
  simplified_phrase: will have their livestock devoted
  preserved_meaning: Their animals come under the stated legal-religious penalty, while its likely confiscatory effect remains qualified.
  reasoning_layer_used: Lexical and theological decisions for ἀνιερωθήσονται and τὰ κτήνη αὐτῶν
  rationale: The main text retains “devoted,” and the footnote explains the possible practical effect.
- pob_phrase: excluded from the assembly of the captivity
  simplified_phrase: excluded from the community of the exiles
  preserved_meaning: The offender is cut off from membership in the exile community.
  reasoning_layer_used: Lexical decision for ἀπὸ τοῦ πλήθους τῆς αἰχμαλωσίας
  rationale: This makes the social penalty clear in natural English.
translation_notes:
  risk_flags:
  - risk: “Devoted” may remain unfamiliar or unclear to modern readers.
    mitigation: The footnote explains that it may imply forfeiture or confiscation without making that effect certain.
  - risk: The Greek specifies livestock, though the parallel tradition may suggest property more broadly.
    mitigation: The main text follows the Greek and limits the penalty to livestock.
