translation:
  language: en
  text: 'From the family of Phaisour[a]: Elionais, Asseias, Ismaēlos, Nathanaēlos, Okaēlēdos[b], and Salthas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek name is Phaisour; the approximate Hebrew parallel has Pashhur.
    reason: alternative_reading
  - marker: b
    text: Okaēlēdos follows the Greek text; the approximate Hebrew parallel may reflect a different name, sometimes identified as Jozabad.
    reason: textual_variant
simplification_decisions:
- pob_phrase: from the sons of Phaisour
  simplified_phrase: from the family of Phaisour
  preserved_meaning: The named men belong to Phaisour’s family line.
  reasoning_layer_used: The lexical rationale identifies this as a genealogical list formula marking members selected from a family group.
  rationale: “From the family of” expresses the list relationship more naturally in modern English.
translation_notes:
  risk_flags:
  - risk: Using “family” could sound broader than the Greek expression “sons of.”
    mitigation: The list context and lexical rationale support family-line membership rather than requiring immediate biological sons.
