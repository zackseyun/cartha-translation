translation:
  language: en
  text: The descendants of Baanei[a] were Jeremias, Momdios, Maeros, Jouna, Mamdai, Pedias, Anos, Carabasion, Enaseibos, Mamntanaimos, Eliaseis, Bannous, Edialeis, Someis, Selemias, and Nathanias. The descendants of Exora were Seseis, Ezreil, Azaelos, Samatos, Zambrei, and Phosepos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The names follow the Greek text of 1 Esdras and are not changed to more familiar Hebrew forms; the parallel list in Ezra does not have exactly the same names in the same forms.
    reason: source_note
