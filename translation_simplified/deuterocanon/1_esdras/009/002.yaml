translation:
  language: en
  text: He stayed there overnight. He ate no bread and drank no water, mourning the people’s grave violations of God’s law.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew parallel in Ezra 10 identifies the offense as marrying foreign wives, while the Greek here speaks more generally.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: lodging there
  simplified_phrase: stayed there overnight
  preserved_meaning: He remained temporarily in that place for the night.
  reasoning_layer_used: Greek lexical decision for αὐλίζομαι
  rationale: The clearer phrase states the overnight sense directly without implying a permanent residence.
- pob_phrase: tasted no bread
  simplified_phrase: ate no bread
  preserved_meaning: He abstained from bread as part of a complete fast.
  reasoning_layer_used: Greek lexical decision for γεύομαι and the fasting context
  rationale: “Ate no bread” expresses the fasting idiom naturally while preserving the concrete image.
- pob_phrase: the great lawless deeds of the multitude
  simplified_phrase: the people’s grave violations of God’s law
  preserved_meaning: The community had committed serious acts contrary to divine law.
  reasoning_layer_used: Lexical and theological decisions for ἀνομία, τῶν μεγάλων, and πλῆθος
  rationale: This wording makes the moral and covenantal force clear in common English.
interpretive_expansions:
- pob_phrase: lawless deeds
  rendering: violations of God’s law
  claim: The law being violated is God’s law within the verse’s covenantal setting.
  evidence:
  - The POB rationale defines ἀνομία as conduct contrary to God’s law.
  - The penitential context concerns the community’s covenant violations.
  confidence: high
  alternatives_preserved:
  - lawless deeds
  - transgressions
translation_notes:
  risk_flags:
  - risk: Naming God makes the implied source of the law explicit.
    mitigation: The clarification follows the POB theological rationale and does not specify the offense beyond the Greek.
  - risk: “Ate” gives the fasting sense rather than the literal verb “tasted.”
    mitigation: The concrete word “bread” remains, and the POB lexical record lists “ate no” as a valid alternative.
