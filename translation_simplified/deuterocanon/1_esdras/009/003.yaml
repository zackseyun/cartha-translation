translation:
  language: en
  text: A public announcement was made throughout Judea and Jerusalem, calling everyone who had returned from exile[a] to gather in Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “all those from the captivity”; this may also be translated “all the exiles” or “all the returned exiles.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a proclamation was made
  simplified_phrase: a public announcement was made
  preserved_meaning: A message was publicly announced rather than issued as a formal decree.
  reasoning_layer_used: POB lexical decision for ἐγένετο κήρυγμα
  rationale: “Public announcement” is more familiar than “proclamation” while preserving its public character.
- pob_phrase: throughout all Judea and Jerusalem
  simplified_phrase: throughout Judea and Jerusalem
  preserved_meaning: The announcement circulated across the region and the city.
  reasoning_layer_used: POB lexical decision for ἐν ὅλῃ τῇ Ἰουδαίᾳ καὶ Ἰερουσαλήμ
  rationale: Removing “all” avoids awkward redundancy without reducing the announcement’s reach.
- pob_phrase: to all those from the captivity, to assemble
  simplified_phrase: calling everyone who had returned from exile to gather
  preserved_meaning: Everyone identified with the exile was summoned to meet in Jerusalem.
  reasoning_layer_used: POB lexical decisions for πᾶσι τοῖς ἐκ τῆς αἰχμαλωσίας and συναχθῆναι
  rationale: The wording clearly identifies the returned exiles and expresses the summons in ordinary English.
interpretive_expansions:
