  text: Ezra, the priest and reader of the Law, stood on a wooden platform that had been built.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek calls Ezra “the priest and reader of the Law” and says the wooden platform had been built. The Hebrew parallel in Nehemiah 8:4 calls him “the scribe” and says the structure was made for the occasion.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: that had been constructed
  simplified_phrase: that had been built
  preserved_meaning: The platform was completed before Ezra stood on it.
  reasoning_layer_used: Greek participle and POB lexical decision
  rationale: “Built” is more common than “constructed” and does not add a purpose absent from the Greek.
