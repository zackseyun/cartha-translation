translation:
  language: en
  text: But there are many people,[a] and it is the rainy season. We cannot remain outside in this weather, and this work cannot be finished in one day.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek includes an unclear clause here; this translation follows the verse’s clear overall sense, supported by the parallel in Ezra 10:13.
    reason: textual_variant
