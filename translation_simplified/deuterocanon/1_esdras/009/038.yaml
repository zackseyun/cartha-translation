simplification_decisions:
- pob_phrase: all the multitude
  simplified_phrase: the whole crowd
  preserved_meaning: Everyone in the large gathered group is included.
  reasoning_layer_used: The lexical decision for πᾶν τὸ πλῆθος preserves both totality and the sense of a large public gathering.
  rationale: “Whole crowd” is more familiar than “all the multitude.”
- pob_phrase: with one accord
  simplified_phrase: with one purpose
  preserved_meaning: The people acted in unity rather than merely standing together.
  reasoning_layer_used: The lexical decision for ὁμοθυμαδόν identifies united action or shared purpose.
  rationale: “With one purpose” states the intended unity in common English.
- pob_phrase: in the open square of the eastern gate of the temple
  simplified_phrase: in the open square by the eastern gate of the temple
  preserved_meaning: The crowd gathered in a broad public space beside the temple’s eastern gate.
  reasoning_layer_used: The lexical decisions and POB footnote identify ἐπὶ τὸ εὐρύχωρον as a broad open area associated with the gate.
  rationale: “By the eastern gate” makes the location relationship natural and clear.
translation_notes:
  risk_flags:
  - risk: “With one purpose” may suggest a more specific goal than the Greek states.
    mitigation: The wording remains broad and follows POB’s documented sense of united action or shared purpose.
