translation:
  language: en
  text: The whole crowd gathered with one purpose in the open square by the eastern gate of the temple.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also be translated “in the broad open place by the eastern gate of the temple.”
