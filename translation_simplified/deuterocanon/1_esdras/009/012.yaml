  preserved_meaning: Each affected man from the people's communities must appear according to the schedule.
  reasoning_layer_used: POB lexical decisions for κατοικιῶν, γυναῖκας ἀλλογενεῖς, and λαβόντες χρόνου
  rationale: Singular wording and “towns” make the instruction easier to follow without changing its scope.
