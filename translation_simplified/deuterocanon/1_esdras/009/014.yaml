translation:
  language: en
  text: Jonathan son of Azael and Hezekiah son of Thocanus agreed to this plan. Mosollamus, Levi, and Sabbataeus helped them make the decision.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Greek verb may mean that these men acted as assessors or gave supporting judgment.
    reason: lexical_alternative
  - marker: b
    text: The Greek names and wording differ from the approximate Hebrew parallel in Ezra 10; there Mosollamus and Sabbataeus have forms such as Meshullam and Shabbethai.
    reason: textual_variant
