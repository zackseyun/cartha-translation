translation:
  language: en
  text: Ezra the priest selected men for this work. They were heads of their fathers’ households, and each man was officially named. They met on the first day[a] of the tenth month to investigate the matter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “on the new moon of the tenth month,” meaning the first day of the month.
    reason: lexical_alternative
