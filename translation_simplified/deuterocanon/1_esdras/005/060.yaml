translation:
  language: en
  text: Elders from the priests, the Levites, and the heads of their ancestral families came forward. They had seen the former temple. As this temple was being built, they cried out loudly and wept deeply.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek calls the earlier temple “the former house” and contrasts it with “this one.”
    reason: cultural_note
simplification_decisions:
- pob_phrase: from the priests, the Levites, and the heads of their ancestral houses came the elders
  simplified_phrase: Elders from the priests, the Levites, and the heads of their ancestral families came forward.
  preserved_meaning: The elders came in connection with the listed lineage-based groups, without implying an unspecified subset.
  reasoning_layer_used: Greek source syntax and lexical decisions for προκαθημένων and κατὰ τὰς πατριὰς αὐτῶν
  rationale: The wording retains the source and POB action of coming while removing the unsupported word “some.”
- pob_phrase: who had seen the former house
  simplified_phrase: They had seen the former temple.
  preserved_meaning: The elders had personally seen the earlier sanctuary.
  reasoning_layer_used: lexical decisions for ἑωρακότες and τὸν πρὸ τοῦ οἶκον
  rationale: “Temple” identifies the sanctuary immediately, while the footnote preserves the Greek house image.
- pob_phrase: at the building of this one they cried out with a loud cry and great weeping
  simplified_phrase: As this temple was being built, they cried out loudly and wept deeply.
  preserved_meaning: During the new temple’s construction, they responded with both a forceful outcry and intense weeping.
  reasoning_layer_used: lexical decisions for πρὸς τὴν τούτου οἰκοδομήν and μετὰ κραυγῆς καὶ κλαυθμοῦ μεγάλου
  rationale: A temporal clause and separate direct verbs make both reactions clear in natural English.
translation_notes:
  risk_flags:
  - risk: “Came forward” may suggest public emergence more specifically than the bare verb “came.”
    mitigation: It avoids implying travel while preserving the source and POB movement verb.
  - risk: Replacing “house” with “temple” could hide the sanctuary image.
    mitigation: The footnote retains the literal contrast between “the former house” and “this one.”
