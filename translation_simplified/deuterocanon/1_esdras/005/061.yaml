  confidence: high
  alternatives_preserved:
  - with trumpets
  - with the sound of trumpets
  external_witnesses:
  - Ezra 3:10 Hebrew parallel
- pob_phrase: with the voice
  rendering: expressed in loud voices
  claim: The joy had an audible and forceful vocal expression.
