translation:
  language: en
  text: Many people used trumpets, and there was great joy expressed in loud voices.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: many with trumpets
  simplified_phrase: Many people used trumpets
  preserved_meaning: A large number of participants used trumpets in the celebration.
  reasoning_layer_used: POB lexical decisions and Greek instrumental syntax
  rationale: “People” supplies the omitted noun, while “used” clearly conveys instrumental accompaniment.
- pob_phrase: great joy with the voice
  simplified_phrase: there was great joy expressed in loud voices
  preserved_meaning: The great joy was audibly expressed without assigning it to the trumpet players.
  reasoning_layer_used: POB lexical rationale and fragmentary Greek syntax
  rationale: The impersonal clause preserves the coordinated elements while making the audible celebration clear.
interpretive_expansions:
- pob_phrase: with trumpets
  rendering: used trumpets
  claim: The trumpets were being sounded as part of the celebration.
  evidence:
