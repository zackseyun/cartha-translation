  preserved_meaning: They arrived before the activity begun in the second month of the second year.
  reasoning_layer_used: POB lexical decisions for the time phrases and παραγενόμενοι
  rationale: Reordering the time phrases makes the sequence easier to follow.
- pob_phrase: began, along with their brothers, the priests, the Levites
  simplified_phrase: began the work together with their brothers, the priests, the Levites
  preserved_meaning: All the named groups participated together in beginning the undertaking.
  reasoning_layer_used: POB lexical and theological decisions for ἤρξαντο, ἀδελφοί, and οἱ ἱερεῖς οἱ Λευεῖται
  rationale: “Together with” preserves equal participation without implying that others joined later.
- pob_phrase: all who had come from the captivity to Jerusalem
  simplified_phrase: everyone who had returned to Jerusalem from captivity
  preserved_meaning: The whole group came back to Jerusalem from captivity.
  reasoning_layer_used: POB lexical alternative and footnote b
  rationale: “Returned from captivity” is natural English and retains the captivity image.
