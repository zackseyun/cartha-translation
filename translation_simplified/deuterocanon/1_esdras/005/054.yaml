translation:
  language: en
  text: In the second month of the second year, after they arrived at the house of God in Jerusalem,[a] Zerubbabel son of Shealtiel and Jeshua son of Jozadak began the work together with their brothers, the priests, the Levites, and everyone who had returned to Jerusalem from captivity.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “house of God” refers to the temple or sanctuary of God. The Greek word can also include the wider sacred complex.
    reason: lexical_alternative
