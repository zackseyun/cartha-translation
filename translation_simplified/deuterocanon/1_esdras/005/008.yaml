translation:
  language: en
  text: Those who had come with their leaders—Zerubbabel, Jeshua, Nehemiah, Zareiah, Resaiah, Enenius, Mordecai, Beelsarus, Aspharasus, Boroelius, Roimus, and Baanah—returned to Jerusalem and the rest of Judea.[a] Each went to his own city.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some names differ from those in the related lists in Ezra and Nehemiah; here they follow the Greek text of 1 Esdras.
    reason: alternative_reading
