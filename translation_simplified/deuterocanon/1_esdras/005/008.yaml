  preserved_meaning: The same returning group went back to Jerusalem and elsewhere in Judea.
  reasoning_layer_used: Greek syntax and POB lexical decisions
  rationale: Reordering the clauses makes the subject and action immediately clear.
- pob_phrase: each to his own city
  simplified_phrase: Each went to his own city.
  preserved_meaning: Every person returned to his particular home city.
