translation:
  language: en
  text: The priests included 872 descendants of Jeddus, son of Jeshua, among the descendants of Sanabeis, and 252 descendants of Emerus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Emerus may be the priestly family called Emmer elsewhere; the Greek form is retained here.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: 'The priests:'
  simplified_phrase: The priests included
  preserved_meaning: This introduces the priestly group within the census list.
  reasoning_layer_used: POB lexical decision for οἱ ἱερεῖς
  rationale: A complete clause makes the list easier to follow.
- pob_phrase: the sons of Jeddus ... the sons of Sanabeis ... the sons of Emerus
  simplified_phrase: descendants of Jeddus ... descendants of Sanabeis ... descendants of Emerus
  preserved_meaning: These names identify genealogical groups, not necessarily immediate sons.
  reasoning_layer_used: POB lexical decisions for the census use of υἱοί
  rationale: “Descendants” clearly expresses the genealogical sense in modern English.
- pob_phrase: eight hundred seventy-two ... two hundred fifty-two
  simplified_phrase: 872 ... 252
  preserved_meaning: The census totals remain unchanged.
  reasoning_layer_used: POB lexical decisions for the cardinal numbers
  rationale: Numerals make census figures easier to scan.
interpretive_expansions:
