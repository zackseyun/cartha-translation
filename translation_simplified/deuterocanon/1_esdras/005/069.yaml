translation:
  language: en
  text: But the peoples living in the land pressed in on those in Judea[a] and besieged them. They kept obstructing the rebuilding of God’s house, the temple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek phrase is difficult and may also mean that they attached themselves to or settled among those in Judea; the context shows hostile involvement.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the nations of the land
  simplified_phrase: the peoples living in the land
  preserved_meaning: The surrounding ethnic groups inhabiting the land remain the subject.
  reasoning_layer_used: Lexical decision for τὰ ... ἔθνη τῆς γῆς.
  rationale: This wording is clearer than the formal phrase “nations of the land.”
- pob_phrase: joining themselves to those in Judea and besieging them
  simplified_phrase: pressed in on those in Judea and besieged them
  preserved_meaning: The difficult relational action retains its hostile pressure while remaining distinct from the siege.
  reasoning_layer_used: Lexical decision and footnote for ἐπικοιμώμενα and πολιορκοῦντες.
  rationale: “Pressed in on” avoids implying that both participles describe the same encircling action.
- pob_phrase: hindered the building of the house
  simplified_phrase: kept obstructing the rebuilding of God’s house, the temple
  preserved_meaning: Their sustained interference targeted the temple-rebuilding work.
  reasoning_layer_used: Lexical and theological decisions for εἶργον and the implicit object of οἰκοδομεῖν.
  rationale: The wording makes the ongoing obstruction and the identity of the house clear.
interpretive_expansions:
- pob_phrase: the building of the house
  rendering: the rebuilding of God’s house, the temple
  claim: The obstructed work was the rebuilding of the temple.
  evidence:
