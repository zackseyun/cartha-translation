translation:
  language: en
  text: He was called by that name.[a] Some of these men were looked for in the official family register, but no record of them was found. So they were not allowed to serve as priests.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “He was named after him.” The Greek does not make the immediate referent fully clear.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: he was called by his name
  simplified_phrase: He was called by that name
  preserved_meaning: The clause describes identification by a name without specifying its unclear referent.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: “That name” is more natural English while the footnote preserves the ambiguity.
- pob_phrase: the genealogical record in the enrollment
  simplified_phrase: the official family register
  preserved_meaning: The document was an administrative record used to verify ancestry.
  reasoning_layer_used: POB lexical decisions and cultural note b
  rationale: “Official family register” explains the unfamiliar administrative wording.
- pob_phrase: were excluded from serving as priests
  simplified_phrase: were not allowed to serve as priests
  preserved_meaning: Lack of genealogical proof disqualified them from priestly service.
  reasoning_layer_used: POB theological decision
  rationale: The simpler wording keeps the exclusion procedural rather than doctrinally absolute.
interpretive_expansions:
- pob_phrase: the genealogical record in the enrollment
  rendering: the official family register
  claim: The enrollment was an administrative register used to establish family ancestry.
  evidence:
