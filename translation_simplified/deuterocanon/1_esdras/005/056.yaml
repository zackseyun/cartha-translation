translation:
  language: en
  text: They appointed Levites who were at least twenty years old to oversee the Lord’s work. Jeshua stood ready with his sons and brothers, along with Kadmiel[a] his brother, the sons of Jeshua son of Henadad[b], and the sons of Judah son of Eliadun, together with their sons and brothers. All these Levites worked together with one purpose as supervisors, directing and advancing the work on the Lord’s house. The builders built the Lord’s temple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek reads Damadiel; the parallel Ezra tradition identifies him as Kadmiel.
    reason: alternative_reading
  - marker: b
    text: The Greek form Hemadabun likely represents the name Henadad found in the parallel Hebrew tradition.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: from twenty years old and upward
  simplified_phrase: who were at least twenty years old
  preserved_meaning: Twenty was the minimum age for this service.
  reasoning_layer_used: POB lexical decision for ἀπὸ εἰκοσαετοῦς
  rationale: The modern age-threshold wording states the same qualification more directly.
- pob_phrase: Jeshua stood with his sons and brothers
  simplified_phrase: Jeshua stood ready with his sons and brothers
  preserved_meaning: Jeshua and his relatives presented themselves for the assigned task.
  reasoning_layer_used: POB lexical rationale for ἔστη Ἰησοῦς
  rationale: “Stood ready” preserves the physical image while clarifying its contextual force.
- pob_phrase: united as supervisors of the work, carrying on the works in the house of the Lord
  simplified_phrase: worked together with one purpose as supervisors, directing and advancing the work on the Lord’s house
  preserved_meaning: The Levites acted in unity to oversee and move the temple work forward.
  reasoning_layer_used: POB decisions for ὁμοθυμαδόν, ἐργοδιῶκται, and ποιοῦντες εἰς τὰ ἔργα
  rationale: The recast sentence keeps unity, supervision, and active progress as distinct ideas.
interpretive_expansions:
- pob_phrase: Jeshua stood
  rendering: Jeshua stood ready
  claim: His standing signaled readiness to undertake the assigned responsibility.
  evidence:
  - The POB rationale says the named leaders presented themselves for the task.
  confidence: high
  alternatives_preserved:
  - Jeshua stood
  - Jeshua took his stand
