translation:
  language: en
  text: Jeshua son of Josedec[a] stepped forward with his brothers, who were priests, and with Zerubbabel son of Salathiel[b] and his brothers. Together they prepared the altar of the God of Israel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek name can also be rendered “Joshua” or “Jesus”; “Jeshua” fits this postexilic priestly context.
    reason: lexical_alternative
  - marker: b
    text: The Greek name is “Salathiel”; its Hebrew form is often rendered “Shealtiel.”
    reason: lexical_alternative
  - marker: c
    text: Here “brothers” may include male relatives or associates within the priestly and family groups.
    reason: source_note
simplification_decisions:
- pob_phrase: arose, with
  simplified_phrase: stepped forward with
  preserved_meaning: Jeshua began the leaders’ decisive action together with the others.
  reasoning_layer_used: Lexical decision for καταστάς
  rationale: “Stepped forward” expresses the narrative movement more naturally than “arose.”
- pob_phrase: his brothers the priests
  simplified_phrase: his brothers, who were priests
  preserved_meaning: The phrase identifies Jeshua’s brothers as priests.
  reasoning_layer_used: Lexical and theological decisions for ἀδελφοί and οἱ ἱερεῖς
  rationale: A relative clause makes the relationship between the two phrases immediately clear.
- pob_phrase: and they prepared
  simplified_phrase: Together they prepared
  preserved_meaning: All the named groups participated in preparing the altar.
  reasoning_layer_used: Source syntax and lexical decision for ἡτοίμασαν
  rationale: Beginning the new sentence with “Together” clarifies the plural subject without changing the action.
translation_notes:
  risk_flags:
  - risk: “Brothers” may be understood only as biological siblings.
    mitigation: A footnote preserves the documented possibility of male relatives or associates.
  - risk: “Stepped forward” is less formally literal than “arose.”
    mitigation: It retains the source image of decisive movement while avoiding archaic phrasing.
