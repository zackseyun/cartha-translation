  simplified_phrase: the enemies of the people of Judah and Benjamin
  preserved_meaning: The opponents belonged to neither Judah nor Benjamin but were enemies of their people.
  reasoning_layer_used: POB lexical decision for τῆς φυλῆς Ἰούδα καὶ Βενιαμείν
  rationale: “People” avoids the awkward singular “tribe” while preserving the paired names and the POB-approved sense.
- pob_phrase: what the sound of the trumpets was
  simplified_phrase: what the trumpet sound was
  preserved_meaning: They came to discover the nature or cause of the sound made by the trumpets.
  reasoning_layer_used: POB lexical decision for τίς ἡ φωνὴ τῶν σαλπίγγων
  rationale: The compact phrase is natural English and keeps the concrete sound of ceremonial trumpets.
