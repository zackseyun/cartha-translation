translation:
  language: en
  text: 'These are the people from Judea[a] who came up from captivity in exile. Nebuchadnezzar king of Babylon had deported them to Babylon:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew parallel in Ezra 2:1 says “the people of the province” rather than “the people from Judea.” This translation follows the Greek text of 1 Esdras.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the ones from Judea
  simplified_phrase: the people from Judea
  preserved_meaning: The listed group came from Judea.
  reasoning_layer_used: Greek lexical decision for οἱ ἐκ τῆς Ἰουδαίας
  rationale: “The people” is more natural than the substantival phrase “the ones.”
- pob_phrase: from the captivity of the exile
  simplified_phrase: from captivity in exile
  preserved_meaning: They had lived as captives away from their homeland.
  reasoning_layer_used: Greek lexical decision for ἐκ τῆς αἰχμαλωσίας τῆς παροικίας
  rationale: The revised relationship between the nouns is clearer while retaining both captivity and exile.
- pob_phrase: whom Nebuchadnezzar king of Babylon had carried away to Babylon
  simplified_phrase: Nebuchadnezzar king of Babylon had deported them to Babylon
  preserved_meaning: The Babylonian king forcibly removed this group to Babylon.
  reasoning_layer_used: Greek lexical decision for οὓς μετῴκισεν
  rationale: A new sentence and the direct verb “deported” make the forced removal immediately clear.
translation_notes:
  risk_flags:
  - risk: “Came up” may sound unusual to readers unfamiliar with the biblical ascent idiom.
    mitigation: It is retained to preserve the Greek image, while the exile context clarifies the movement.
