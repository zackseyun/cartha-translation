translation:
  language: en
  text: The people's weeping drowned out the trumpets, so they could not hear them.[a] The crowd blew the trumpets so loudly that the sound carried far away.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The parallel in Ezra 3:11 emphasizes the people's great shout of praise to the LORD; 1 Esdras gives more attention to the trumpets and weeping.
    reason: cross_reference
simplification_decisions:
- pob_phrase: the people could not hear the trumpets because of the weeping of the people
  simplified_phrase: The people's weeping drowned out the trumpets, so they could not hear them
  preserved_meaning: The people's audible weeping prevented them from hearing the trumpets.
  reasoning_layer_used: Lexical decisions for μὴ ἀκούειν and διὰ τὸν κλαυθμόν
  rationale: The active image “drowned out” expresses the auditory result in natural English.
- pob_phrase: the crowd was sounding them loudly
  simplified_phrase: The crowd blew the trumpets so loudly
  preserved_meaning: The crowd produced a very loud sound with the trumpets.
  reasoning_layer_used: Lexical decision for ἦν ὁ σαλπίζων μεγάλως
  rationale: “Blew the trumpets” turns the compressed participle into an ordinary expression.
- pob_phrase: so that it was heard from far away
  simplified_phrase: that the sound carried far away
  preserved_meaning: The loud trumpet sound could be heard at a great distance.
  reasoning_layer_used: Lexical decisions for μακρόθεν and ἀκούεσθαι
  rationale: The recast clause identifies the sound and avoids an unclear impersonal passive.
translation_notes:
  risk_flags:
  - risk: The Ezra parallel emphasizes a great shout of praise rather than this expanded scene of trumpets and weeping.
    mitigation: Footnote a notes the difference while keeping the Greek of 1 Esdras primary.
