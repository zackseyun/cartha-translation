translation:
  language: en
  text: When the seventh month began, the sons of Israel[a] were each in their own place. They gathered with one purpose in the open area at the first gate on the east.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, the Israelites; the Greek uses the familial expression “sons of Israel.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: When the seventh month had come
  simplified_phrase: When the seventh month began
  preserved_meaning: The seventh month had started.
  reasoning_layer_used: Lexical rationale for Ἐνστάντος
  rationale: “Began” states the onset of the month more directly.
- pob_phrase: with one accord
  simplified_phrase: with one purpose
  preserved_meaning: The people were united in purpose, not merely present together.
  reasoning_layer_used: Lexical rationale for ὁμοθυμαδόν
  rationale: “With one purpose” expresses shared intent in common English.
- pob_phrase: in the open area of the first gate on the east
  simplified_phrase: in the open area at the first gate on the east
  preserved_meaning: They assembled in a spacious place associated with the eastward first gate.
  reasoning_layer_used: Lexical decisions for εὐρύχωρον, πυλών, and ἀνατολή
  rationale: “At” makes the location natural without claiming a more exact architectural layout.
