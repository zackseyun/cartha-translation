translation:
  language: en
  text: From the new-moon day at the start of the first month, everyone who had made a vow to God began offering sacrifices to God, even though God’s temple had not yet been built.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “and God’s temple had not yet been built.” Here “even though” expresses the likely contrast in context.
    reason: lexical_alternative
  - marker: b
    text: The parallel passage in Ezra speaks instead about the Feast of Booths and the required daily burnt offerings; this translation follows the distinct Greek wording of 1 Esdras.
    reason: cross_reference
simplification_decisions:
- pob_phrase: all who had vowed a vow to God
  simplified_phrase: everyone who had made a vow to God
  preserved_meaning: The whole group had committed themselves to God by vows.
  reasoning_layer_used: POB lexical decision for εὔξαντο εὐχήν
  rationale: “Made a vow” clearly expresses the cognate Greek phrase without its unnatural repetition.
- pob_phrase: from the new moon of the first month
  simplified_phrase: from the new-moon day at the start of the first month
  preserved_meaning: Their sacrifices began on the calendrical new moon that opened the first month.
  reasoning_layer_used: POB lexical decision for ἀπὸ τῆς νουμηνίας
  rationale: Adding “day at the start” explains the ancient calendar reference while retaining the new-moon setting.
- pob_phrase: though the temple of God had not yet been built
  simplified_phrase: even though God’s temple had not yet been built
  preserved_meaning: Sacrificial worship began before the temple was built.
  reasoning_layer_used: POB theological decision on the concessive force of καί
  rationale: “Even though” makes the narrative contrast immediately clear.
