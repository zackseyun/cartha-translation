translation:
  language: en
  text: 'These were the priests descended from Phinehas and Aaron: Jeshua[a], son of Jozadak, son of Seraiah; and Joakim, son of Zerubbabel, son of Shealtiel.[b] Joakim came from the house of David, in the family line of Perez.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The name Jeshua may also be written Joshua; Greek uses the same name form later rendered Jesus in other contexts.
    reason: lexical_alternative
  - marker: b
    text: In genealogies, “son of” may mean “descendant of,” so the list may skip generations.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The priests, the sons of Phinehas, the sons of Aaron
  simplified_phrase: These were the priests descended from Phinehas and Aaron
  preserved_meaning: The priests belonged to the priestly line traced through Phinehas and Aaron.
  reasoning_layer_used: Lexical decision on υἱοί and the theological decision on genealogical wording
  rationale: “Descended from” makes the genealogical sense clear without claiming they were immediate sons.
- pob_phrase: Jeshua son of Jozadak son of Seraiah, and Joakim son of Zerubbabel son of Shealtiel
  simplified_phrase: Jeshua, son of Jozadak, son of Seraiah; and Joakim, son of Zerubbabel, son of Shealtiel
  preserved_meaning: Both genealogical chains remain distinct and complete.
  reasoning_layer_used: Lexical decisions on the article-plus-genitive genealogy chains
  rationale: Added punctuation separates the two family lines while retaining each repeated “son of.”
- pob_phrase: from the house of David, from the family line of Perez
  simplified_phrase: Joakim came from the house of David, in the family line of Perez
  preserved_meaning: Joakim is identified with David’s dynasty and Perez’s lineage.
  reasoning_layer_used: Lexical decisions on οἶκος and γενεά
  rationale: A new sentence makes the dynastic description easier to follow without weakening either lineage term.
