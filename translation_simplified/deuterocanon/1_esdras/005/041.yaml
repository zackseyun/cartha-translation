translation:
  language: en
  text: All the Israelites listed here who were twelve years old or older numbered 42,360, not counting their male and female servants.[a] Their servants numbered 7,337. There were also 245 male and female singers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek terms may also be translated “male and female slaves.” Here they refer to household dependents counted separately.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: All these were Israelites, from twelve years old and upward
  simplified_phrase: All the Israelites listed here who were twelve years old or older numbered
  preserved_meaning: The total refers to the previously listed Israelites who met the census age threshold.
  reasoning_layer_used: POB lexical decisions for Οἱ δὲ πάντες, ἦσαν Ἰσραήλ, and ἀπὸ δωδεκαετοῦς
  rationale: The sentence is recast as ordinary census language while preserving identity, reference, and age.
- pob_phrase: apart from male and female servants
  simplified_phrase: not counting their male and female servants
  preserved_meaning: The servants are excluded from the Israelite total and counted separately.
  reasoning_layer_used: POB lexical and theological decisions for παῖδες and παιδίσκαι
  rationale: “Not counting” makes the numerical relationship immediately clear.
- pob_phrase: the singers and songstresses were two hundred forty-five
  simplified_phrase: There were also 245 male and female singers
  preserved_meaning: The Greek distinguishes the singers by sex and gives their combined total.
  reasoning_layer_used: POB lexical decision for ψάλται καὶ ψαλτῳδοί
  rationale: “Male and female singers” avoids the uncommon word “songstresses” without merging the two groups.
translation_notes:
  risk_flags:
  - risk: “Servants” may understate the dependents’ possible enslaved status.
    mitigation: The footnote preserves “male and female slaves” as a viable lexical alternative.
