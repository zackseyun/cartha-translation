simplification_decisions:
- pob_phrase: they cried out with hymns
  simplified_phrase: they raised their voices in hymns
  preserved_meaning: They praised God publicly and audibly through hymns.
  reasoning_layer_used: Lexical decision for ἐφώνησαν and δι’ ὕμνων
  rationale: This keeps the force of calling out while sounding natural in a worship setting.
- pob_phrase: his goodness and his glory
  simplified_phrase: his goodness and glory
  preserved_meaning: Both the Lord’s goodness and his glory remain distinct objects of praise.
  reasoning_layer_used: Lexical decisions for χρηστότης and δόξα
  rationale: Removing the repeated possessive makes the line smoother without merging the two qualities.
