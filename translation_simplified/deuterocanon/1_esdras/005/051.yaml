translation:
  language: en
  text: After these, they presented the regular offerings[a] and the sacrifices for Sabbaths, new moon observances, and all the feasts set apart for worship.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “continual offerings”; the term can mean offerings made continuously or at set recurring times.
    reason: lexical_alternative
