- pob_phrase: And after these
  simplified_phrase: After these, they presented
  preserved_meaning: The prescribed offerings followed the acts described previously.
  reasoning_layer_used: POB lexical decision and theological rationale
  rationale: A supplied verb turns the Greek’s compressed list into a clear English sentence.
- pob_phrase: new moons
  simplified_phrase: new moon observances
  preserved_meaning: The sacrifices belonged to the monthly new-moon worship schedule.
  reasoning_layer_used: POB lexical rationale
  rationale: “Observances” prevents readers from mistaking the phrase for only a lunar phase.
- pob_phrase: all the consecrated feasts
  simplified_phrase: all the feasts set apart for worship
  preserved_meaning: These feasts were sacred occasions reserved for worship.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The wording explains the cultic sense of “consecrated” in common English.
