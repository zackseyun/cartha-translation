translation:
  language: en
  text: There were 139 descendants of Tobeis. The temple slaves[a] included descendants of Esau, Taseipha, Tabaoth, Keras, Soua, Phalaiou, and Labana.[b]
  philosophy: optimal-equivalence
  footnotes:
