translation:
  language: en
  text: Then Jeshua[a] son of Jozadak rose to take action.[b] His brothers, who were priests, joined him, along with Zerubbabel son of Shealtiel and his brothers. Together they prepared the altar of the God of Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jeshua is the postexilic priestly figure, not Jesus of Nazareth; the name may also be written Joshua.
    reason: cross_reference
  - marker: b
    text: Or “stood up”; the Greek expression begins a decisive action.
    reason: lexical_alternative
