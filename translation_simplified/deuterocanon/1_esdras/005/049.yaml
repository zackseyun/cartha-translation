translation:
  language: en
  text: People from the other nations of the land joined them.[a] The community was strengthened at the altar, which was in its proper place. All the nations in the land were hostile to them and prevailed against them. At the appointed time, they offered sacrifices and whole burnt offerings to the Lord, both morning and evening. Whole burnt offerings were completely burned in the fire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “gathered themselves to them.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: they gathered themselves to them from the other nations of the land
  simplified_phrase: People from the other nations of the land joined them
  preserved_meaning: Members of other nations attached themselves to the community.
  reasoning_layer_used: POB lexical decision and footnote a
  rationale: “Joined them” expresses the reflexive sense naturally without adding a number such as “some.”
- pob_phrase: they were strengthened at the altar in its place
  simplified_phrase: The community was strengthened at the altar, which was in its proper place
  preserved_meaning: The community’s position at the properly located altar was made firm.
  reasoning_layer_used: POB lexical decisions for κατωρθώθησαν and the altar phrase
  rationale: The rewrite clarifies the pronoun and explains that the altar occupied its proper location.
- pob_phrase: whole burnt offerings to the Lord
  simplified_phrase: whole burnt offerings to the Lord ... Whole burnt offerings were completely burned in the fire
  preserved_meaning: These offerings were wholly consumed by fire and presented to the Lord.
  reasoning_layer_used: POB lexical decision for ὁλοκαυτώματα
  rationale: The ritual term is retained and then explained in common language.
interpretive_expansions:
- pob_phrase: they were strengthened
  rendering: The community was strengthened
  claim: The strengthened group is the returned worshiping community.
  evidence:
  - The action centers on the community serving at the altar.
  - POB describes their position at the altar as being made firm.
  confidence: moderate
  alternatives_preserved:
  - The pronoun could remain unresolved as “they.”
- pob_phrase: they were in hostility toward them
  rendering: All the nations in the land were hostile to them
  claim: The hostility belongs to the opposing nations and is directed toward the community.
  evidence:
  - The POB theological rationale identifies hostile surrounding peoples.
  - The following clause says the nations prevailed against the community.
  confidence: moderate
  alternatives_preserved:
  - The Greek pronouns can remain formally ambiguous.
translation_notes:
