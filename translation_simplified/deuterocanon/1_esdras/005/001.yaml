  text: Afterward, leaders of the ancestral families in each tribe were chosen to make the journey up. Their wives, sons, daughters, male and female servants,[a] and livestock went with them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek terms may mean household slaves or servants; “male and female servants” reflects both forms without deciding their legal status.
