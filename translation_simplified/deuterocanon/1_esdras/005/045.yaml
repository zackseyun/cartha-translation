translation:
  language: en
  text: The priests, Levites, and some of the people settled in Jerusalem and the surrounding region. The temple singers, gatekeepers, and all Israel settled in their villages.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek for “some of the people” is literally “those from his people” and likely means non-priestly members of the community.
    reason: lexical_alternative
