translation:
  language: en
  text: Among the priests, these families claimed the right to serve as priests, but no record confirming their priestly ancestry could be found:[a] the descendants of Obbeia, Akbos, and Iaddous. Iaddous had married Augia, one of the daughters of Phaexeldai.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek simply says they “were not found,” probably meaning that their genealogical record or priestly registration was not found.
    reason: lexical_alternative
  - marker: b
    text: These names follow the Greek text of 1 Esdras; the names differ in the approximate Hebrew parallel.
    reason: textual_variant
simplification_decisions:
- pob_phrase: those who claimed the priesthood
  simplified_phrase: these families claimed the right to serve as priests
  preserved_meaning: They asserted a claim to priestly status rather than merely performing priestly duties.
  reasoning_layer_used: lexical decision for οἱ ἐμποιούμενοι ἱερωσύνης
  rationale: The clearer wording expresses the asserted priestly claim in ordinary English.
- pob_phrase: the sons of Obbeia, the sons of Akbos, the sons of Iaddous
  simplified_phrase: the descendants of Obbeia, Akbos, and Iaddous
  preserved_meaning: The names identify three genealogical family groups.
  reasoning_layer_used: proper-name and genealogical lexical decisions
  rationale: “Descendants” avoids suggesting that every listed person was an immediate son.
- pob_phrase: who had taken Augia as a wife from the daughters of Phaexeldai
  simplified_phrase: Iaddous had married Augia, one of the daughters of Phaexeldai
  preserved_meaning: Iaddous married Augia, who belonged to Phaexeldai’s family.
  reasoning_layer_used: lexical decisions for λαβόντος ... γυναῖκα and τῶν θυγατέρων
  rationale: The marriage idiom and family relationship are stated in natural English.
interpretive_expansions:
- pob_phrase: but were not found
  rendering: but no record confirming their priestly ancestry could be found
  claim: What was missing was evidence confirming their genealogical qualification for the priesthood.
  evidence:
  - The POB footnote identifies a genealogical record or priestly registration as the likely implied object.
  - The lexical rationale says the context concerns genealogical qualification.
  - The Ezra parallel supports the registration-based sense.
  confidence: moderate
  alternatives_preserved:
  - The footnote retains the Greek’s less explicit wording, “were not found.”
translation_notes:
  risk_flags:
