translation:
  language: en
  text: The priests took their places, dressed for the ceremony, with musicians and trumpets.[a] The Levites, the sons of Asaph, had the cymbals. They praised and blessed the Lord, following David king of Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “with musical instruments and trumpets.”
    reason: lexical_alternative
  - marker: b
    text: This may mean that they followed David’s instructions or his manner of worship.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: stood arrayed
  simplified_phrase: took their places, dressed for the ceremony
  preserved_meaning: The priests assumed their formal positions in ceremonial clothing.
  reasoning_layer_used: Lexical decisions for ἔστησαν and ἐστολισμένοι
  rationale: The wording clearly preserves both their ceremonial position and formal dress.
- pob_phrase: the Levites, the sons of Asaph
  simplified_phrase: The Levites, the sons of Asaph
  preserved_meaning: These Levites belonged to Asaph’s family line or guild.
  reasoning_layer_used: Lexical decision for Λευεῖται υἱοὶ Ἀσὰφ
  rationale: Retaining “sons of Asaph” avoids narrowing the identification to biological descent.
- pob_phrase: according to David king of Israel
  simplified_phrase: following David king of Israel
  preserved_meaning: Their worship conformed to Davidic instruction, precedent, or manner.
  reasoning_layer_used: Theological decision on κατὰ Δαυεὶδ βασιλέα τοῦ Ἰσραήλ
  rationale: “Following” is clear while the footnote preserves the exact kind of conformity as open.
interpretive_expansions:
- pob_phrase: arrayed
  rendering: dressed for the ceremony
  claim: The priests wore clothing appropriate for ceremonial service.
  evidence:
  - The lexical rationale identifies ceremonial dress without specifying priestly vestments.
  - The temple-worship setting supports the ceremonial sense.
  confidence: high
  alternatives_preserved:
  - formally dressed
  - robed
translation_notes:
  risk_flags:
  - risk: “Sons of Asaph” may be read only as biological descent.
    mitigation: The audit preserves both the family-line and guild senses.
  - risk: “Following David” does not specify whether David gave instructions or established a manner of worship.
    mitigation: Footnote b explicitly preserves both possibilities.
