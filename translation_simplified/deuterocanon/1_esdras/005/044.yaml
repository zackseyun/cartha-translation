translation:
  language: en
  text: They also gave to the holy treasury for the work 1,000 minas of gold,[a] 5,000 minas of silver, and 100 priestly garments.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A mina was an ancient unit of weight and value. “Holy treasury” may also be translated “temple treasury.”
    reason: cultural_note
simplification_decisions:
- pob_phrase: and to give
  simplified_phrase: They also gave
  preserved_meaning: The returnees gave these resources as part of the preceding account.
  reasoning_layer_used: POB lexical rationale and immediate syntax
  rationale: A complete active sentence is easier to understand than the continuing infinitive.
- pob_phrase: the holy treasury for the works
  simplified_phrase: the holy treasury for the work
  preserved_meaning: The treasury and gifts supported the restoration work without limiting it to construction alone.
  reasoning_layer_used: POB lexical decision for τῶν ἔργων and grounding review
  rationale: The singular phrase reads naturally while preserving the deliberately broad scope.
- pob_phrase: one thousand minas of gold, and five thousand minas of silver
  simplified_phrase: 1,000 minas of gold, 5,000 minas of silver
  preserved_meaning: The named ancient unit, quantities, and materials remain unchanged.
  reasoning_layer_used: POB lexical decisions and cultural note for μνᾶ
  rationale: Numerals make the inventory easy to scan while the note explains the unfamiliar unit.
translation_notes:
  risk_flags:
