translation:
  language: en
  text: They paid the stonecutters and carpenters with silver. They also gave food, drink, and other provisions[a] to the people of Sidon and Tyre so they could bring cedar logs from Lebanon and float them on rafts to the harbor at Joppa. This was done according to the written decree given to them by Cyrus, king of the Persians.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word translated “other provisions” is difficult here; the Hebrew parallel in Ezra 3:7 specifies oil.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: gave silver to the stonecutters and carpenters
  simplified_phrase: paid the stonecutters and carpenters with silver
  preserved_meaning: The workers received silver as payment.
  reasoning_layer_used: Lexical decision for ἀργύριον and its payment context
  rationale: This states the transaction naturally while retaining silver rather than replacing it with money.
- pob_phrase: the Sidonians and Tyrians
  simplified_phrase: the people of Sidon and Tyre
  preserved_meaning: The supplies went to people from the two named cities.
  reasoning_layer_used: POB wording and immediate context
  rationale: City-based wording is easier for readers unfamiliar with these regional names.
- pob_phrase: transporting them by rafts to the harbor of Joppa
  simplified_phrase: float them on rafts to the harbor at Joppa
  preserved_meaning: The cedar logs were moved by raft to Joppa’s harbor.
  reasoning_layer_used: Lexical decision for διαφέρειν σχεδίαις and Ἰόππης λιμένα
  rationale: The active verb makes the transport method easier to picture without weakening the raft image.
