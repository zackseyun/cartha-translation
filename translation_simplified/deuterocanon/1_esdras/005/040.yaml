translation:
  language: en
  text: Nehemiah and Atharias told them, “You must not eat any of the sacred food reserved for priests until a priest comes wearing the Manifestation and the Truth.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Manifestation and the Truth are traditionally identified as the priestly objects called the Urim and the Thummim, which were used to seek a definitive decision.
    reason: cultural_note
simplification_decisions:
- pob_phrase: not to partake of the holy things
  simplified_phrase: You must not eat any of the sacred food reserved for priests
  preserved_meaning: They were forbidden to share in the sacred priestly provisions.
  reasoning_layer_used: Lexical decision and cultural footnote on τῶν ἁγίων
  rationale: The concrete wording explains the ritual restriction in ordinary English.
- pob_phrase: until a priest should arise
  simplified_phrase: until a priest comes
  preserved_meaning: The restriction remains until a future priest is available to resolve the matter.
  reasoning_layer_used: Lexical decision on ἕως ἀναστῇ
  rationale: “Comes” expresses the future event naturally without implying resurrection.
- pob_phrase: clothed with the Manifestation and the Truth
  simplified_phrase: wearing the Manifestation and the Truth
  preserved_meaning: The priest bears the paired sacred objects named semantically by the Greek text.
  reasoning_layer_used: Lexical and theological decisions on ἐνδεδυμένος, δήλωσις, and ἀλήθεια
  rationale: “Wearing” clarifies the clothing image while retaining the Greek-based names.
interpretive_expansions:
- pob_phrase: the holy things
  rendering: the sacred food reserved for priests
  claim: The holy things here are sacred priestly provisions rather than holiness in the abstract.
  evidence:
  - The POB lexical rationale identifies sacred priestly provisions as the likely referent.
  - The POB cultural note says they were not to eat from the sacred priestly provisions.
  - The Hebrew parallel likewise concerns exclusion from priestly sacred food.
  confidence: high
  alternatives_preserved:
  - sacred things more broadly
  - holy offerings
  external_witnesses:
  - Hebrew parallel in Nehemiah 7:65
translation_notes:
  risk_flags:
  - risk: “Sacred food” narrows the Greek phrase “the holy things.”
    mitigation: The immediate priestly context and POB audit strongly support this meaning.
  - risk: “Manifestation and the Truth” may be unfamiliar to readers.
    mitigation: The footnote identifies the traditional Urim and Thummim connection without replacing the Greek-based rendering.
