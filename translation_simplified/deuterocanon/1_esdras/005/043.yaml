translation:
  language: en
  text: Some of the family heads arrived at God’s temple in Jerusalem. They pledged[a] to raise God’s house again on its site, as much as they were able.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “vowed,” suggesting a formal religious promise.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: heads of families
  simplified_phrase: family heads
  preserved_meaning: These were leaders of lineage-based family groups.
  reasoning_layer_used: lexical decision for ἡγουμένων and πατριάς
  rationale: The shorter phrase is natural English and preserves their family leadership role.
- pob_phrase: when they arrived at the temple of God in Jerusalem, pledged
  simplified_phrase: arrived at God’s temple in Jerusalem. They pledged
  preserved_meaning: Their commitment followed their arrival at the Jerusalem temple.
  reasoning_layer_used: source syntax and POB translation
  rationale: Two sentences make the sequence easier to follow without changing it.
- pob_phrase: according to their ability
  simplified_phrase: as much as they were able
  preserved_meaning: Their commitment matched their available means and capacity.
  reasoning_layer_used: lexical decision for κατὰ τὴν αὐτῶν δύναμιν
  rationale: This common wording retains the phrase’s broad scope.
interpretive_expansions:
- pob_phrase: raise up the house on its site
  rendering: raise God’s house again on its site
  claim: The house is God’s temple, and raising it on its site means restoring it there.
  evidence:
  - The preceding phrase identifies God’s temple in Jerusalem.
  - The POB lexical rationale says rebuilding is implied while retaining the raising image.
  confidence: high
  alternatives_preserved:
  - rebuild God’s house on its site
translation_notes:
  risk_flags:
