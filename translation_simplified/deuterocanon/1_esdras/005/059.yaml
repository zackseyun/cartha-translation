translation:
  language: en
  text: All the people blew trumpets and gave a great shout. They praised the Lord because the house of the Lord was being raised up.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This can also mean “because the house of the Lord was being rebuilt.” The Greek image is broad enough to refer to its being erected or restored.
    reason: lexical_alternative
