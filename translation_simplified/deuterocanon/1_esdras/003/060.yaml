translation:
  language: en
  text: All the earth calls out to Truth,[a] and heaven blesses her. Everything shakes and trembles, and nothing unjust is with her.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may mean that the earth acclaims Truth or appeals to her.
    reason: lexical_alternative
  - marker: b
    text: The Greek reads “with him” or “with it,” although Truth is described as feminine earlier in the verse.
    reason: textual_variant
simplification_decisions:
- pob_phrase: calls on truth
  simplified_phrase: calls out to Truth
  preserved_meaning: The earth addresses personified Truth, either acclaiming or appealing to her.
  reasoning_layer_used: POB lexical and theological decisions on καλεῖ and personified ἀλήθεια
  rationale: “Calls out to” is clear modern English, while the footnote preserves the verb’s ambiguity.
- pob_phrase: all works
  simplified_phrase: Everything
  preserved_meaning: The reaction extends broadly to all that exists or is done.
  reasoning_layer_used: POB lexical decision on πάντα τὰ ἔργα
  rationale: “Everything” conveys the broad cosmic scope without the opaque phrase “all works.”
- pob_phrase: with her there is nothing unjust
  simplified_phrase: nothing unjust is with her
  preserved_meaning: Nothing characterized by injustice is associated with personified Truth.
  reasoning_layer_used: POB lexical and theological decisions on μετʼ αὐτοῦ and ἄδικον οὐδέν
  rationale: The reordered clause is natural English and adds no unsupported spatial image.
translation_notes:
  risk_flags:
  - risk: “Everything” may obscure the Greek noun meaning “works.”
    mitigation: The wording preserves its broad contextual sense without narrowing it to created things or deeds alone.
  - risk: Using “her” resolves a grammatical mismatch in the transmitted Greek.
    mitigation: The main text follows the POB personification decision, and footnote b records the mismatch.
