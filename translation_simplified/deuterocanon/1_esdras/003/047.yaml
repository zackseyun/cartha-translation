translation:
  language: en
  text: He watches for the lion[a] and walks through darkness. Whenever he steals, snatches something by force, or breaks into a house, he brings what he stole to the woman he loves.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “looks at the lion.” The Greek may mean attentive observation, but the context suggests purposeful watching.
    reason: lexical_alternative
