- pob_phrase: walks in darkness
  simplified_phrase: walks through darkness
  preserved_meaning: He moves about under cover of darkness.
  reasoning_layer_used: POB lexical decision for ἐν σκότει βαδίζει
  rationale: The wording remains vivid while sounding more natural in the sequence.
- pob_phrase: breaks in
  simplified_phrase: breaks into a house
  preserved_meaning: He enters a house to steal by stealth.
  reasoning_layer_used: POB lexical decision and footnote for κλωποδυτήσῃ
  rationale: Naming the house makes the specific kind of theft immediately clear.
- pob_phrase: his beloved
  simplified_phrase: the woman he loves
  preserved_meaning: The recipient is a woman to whom he is romantically attached.
  reasoning_layer_used: POB lexical decision for τῇ ἐρωμένῃ
  rationale: The approved alternative is clearer to readers unfamiliar with “beloved” as a noun.
