translation:
  language: en
  text: She shows no favoritism and does not rank one person above another. She does what is right, completely apart from everything unjust and evil.[a] Everyone approves of what she does.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean that she remains separate from all unjust and evil people.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: with her there is no partiality or distinction
  simplified_phrase: She shows no favoritism and does not rank one person above another
  preserved_meaning: Personified Wisdom or Truth treats people without favoritism or unequal distinction.
  reasoning_layer_used: Lexical decisions and theological decision on feminine personification
  rationale: The active wording explains the ethical meaning while retaining the feminine personification.
- pob_phrase: she does what is righteous apart from all that is unjust and evil
  simplified_phrase: She does what is right, completely apart from everything unjust and evil
  preserved_meaning: Her right action is separated from every form of injustice and evil.
  reasoning_layer_used: Lexical decision for τὰ δίκαια and doctrine-realigned revision for ἀπό
  rationale: Common wording replaces “righteous” while preserving the source image of separation.
- pob_phrase: all approve of her works
  simplified_phrase: Everyone approves of what she does
  preserved_meaning: All commend her actions.
  reasoning_layer_used: Lexical decisions for εὐδοκοῦσι and τοῖς ἔργοις αὐτῆς
  rationale: “What she does” is more immediate than the formal phrase “her works.”
