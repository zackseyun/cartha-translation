translation:
  language: en
  text: “Let each of us speak one statement that will prevail. King Darius will give great gifts and great honors for victory to whoever’s statement is shown to be wiser than the other’s.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: speak one word that will prevail
  simplified_phrase: speak one statement that will prevail
  preserved_meaning: Each person is to offer a saying or argument intended to prevail in the contest.
  reasoning_layer_used: POB lexical decisions for λόγον and ὑπερισχύσει
  rationale: “Statement” clarifies what “word” means here while retaining the image of prevailing.
- pob_phrase: Darius the king will give him
  simplified_phrase: King Darius will give
  preserved_meaning: Darius is the king who will reward the person whose statement wins.
  reasoning_layer_used: POB lexical decision for δώσει αὐτῷ and English syntax
  rationale: Reordering the title and naming the recipient later makes the sentence easier to follow.
- pob_phrase: great victory honors
  simplified_phrase: great honors for victory
  preserved_meaning: The victor receives public honors distinct from the material gifts.
  reasoning_layer_used: POB lexical decision and footnote for ἐπινίκια
  rationale: The reordered phrase explains the unfamiliar expression without merging honors with gifts.
