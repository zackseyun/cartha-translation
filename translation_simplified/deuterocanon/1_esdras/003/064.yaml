translation:
  language: en
  text: Truth never judges unjustly.[a] She is the strength, the kingdom, the authority, and the majesty of all the ages.[b] Blessed is the God of truth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Truth is personified as a woman here; the pronoun may also be translated “it.”
    reason: lexical_alternative
  - marker: b
    text: “Of all the ages” may be expressed more idiomatically as “forever and ever.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: in her judgment there is nothing unjust
  simplified_phrase: Truth never judges unjustly
  preserved_meaning: Truth’s exercise of judgment contains no injustice.
  reasoning_layer_used: Lexical decisions for κρίσις and ἄδικον, with the theological decision to retain personification
  rationale: The verbal form states the same juridical image in direct, natural English.
- pob_phrase: And this is the strength and the kingdom and the authority and the majesty
  simplified_phrase: She is the strength, the kingdom, the authority, and the majesty
  preserved_meaning: Personified Truth is identified with the full sequence of strength, royal dominion, rightful authority, and majesty.
  reasoning_layer_used: Lexical decisions for ἰσχύς, βασίλειον, ἐξουσία, and μεγαλειότης
  rationale: Replacing the vague “this” with “she” makes the sentence easier to follow while retaining each distinct term.
