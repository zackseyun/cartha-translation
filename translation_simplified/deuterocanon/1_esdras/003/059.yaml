  preserved_meaning: Truth has greatness and surpasses everything in strength.
  reasoning_layer_used: Lexical decisions on ἀλήθεια, ἰσχυροτέρα, and παρὰ πάντα
  rationale: A repeated subject and verb make the two claims easier to follow.
