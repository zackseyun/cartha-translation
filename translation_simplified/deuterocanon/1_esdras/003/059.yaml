simplification_decisions:
- pob_phrase: Is not the one who does these things great?
  simplified_phrase: Isn’t the one who does these things great?
  preserved_meaning: The rhetorical question still expects the answer yes without naming the person.
  reasoning_layer_used: Lexical and theological decisions on οὐχὶ and the implicit referent
  rationale: The contraction gives the question natural modern wording while keeping its force and ambiguity.
- pob_phrase: And truth is great, and stronger than everything
