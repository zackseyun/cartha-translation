translation:
  language: en
  text: Wine is unjust. The king is unjust. Women are unjust. All the sons of men[a] are unjust, and so is everything they do—all things of this kind. There is no truth in them, and they will perish in their injustice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The sons of men” is a Greek expression for humankind that retains the source’s image of human beings as sons.
    reason: cultural_note
