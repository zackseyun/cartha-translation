  preserved_meaning: The king’s armed forces obey him.
  reasoning_layer_used: POB lexical decision for δυνάμεις
  rationale: “Military” prevents readers from taking “forces” as abstract powers.
- pob_phrase: Besides this
  simplified_phrase: In addition
  preserved_meaning: The sentence adds another point to the argument.
  reasoning_layer_used: POB lexical decision for πρὸς δὲ τούτοις
  rationale: “In addition” expresses the additive link in familiar English.
- pob_phrase: reclines and eats and drinks and sleeps
  simplified_phrase: lies back, eats, drinks, and sleeps
  preserved_meaning: The king performs four coordinated actions, including reclining or lying back.
  reasoning_layer_used: POB lexical decisions and footnote b
