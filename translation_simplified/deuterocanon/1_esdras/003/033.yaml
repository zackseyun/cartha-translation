translation:
  language: en
  text: All his people and military forces obey him. In addition, he himself lies back, eats, drinks, and sleeps.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “rests” or “lies down,” though the eating and drinking may suggest reclining for a meal.
