translation:
  language: en
  text: Men, how could the king fail to prevail, since he is so obeyed?[a] Then he stopped speaking.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “since people listen to him so closely.” The Greek can refer to being listened to as well as obeyed.
    reason: lexical_alternative
