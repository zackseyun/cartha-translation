translation:
  language: en
  text: And they said, “When the king gets up, they will give him the document. The king and the three nobles of Persia will judge whose argument is wiser.[a] The victory will go to that person, as it is written.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “whose statement is wiser”; the Greek literally says, “whose word is wiser.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: When the king rises
  simplified_phrase: When the king gets up
  preserved_meaning: The king arises, likely from sleep or from his couch.
  reasoning_layer_used: Lexical decision for ἐγερθῇ
  rationale: “Gets up” gives the ordinary contextual sense without specifying where he was resting.
- pob_phrase: the writing
  simplified_phrase: the document
  preserved_meaning: The contestants’ written material is presented to the king.
  reasoning_layer_used: Lexical decision for τὸ γράμμα
  rationale: “Document” is clearer than the abstract phrase “the writing” and does not imply a private letter.
- pob_phrase: to him the victory will be given
  simplified_phrase: The victory will go to that person
  preserved_meaning: The contestant judged wisest will receive the winning outcome.
  reasoning_layer_used: Lexical decision for τὸ νῖκος and source syntax
  rationale: The active English phrasing preserves the victory image while removing awkward clause order.
interpretive_expansions:
- pob_phrase: whose word is wiser
  rendering: whose argument is wiser
  claim: In this contest, λόγος refers to each contestant’s argument or line of reasoning.
