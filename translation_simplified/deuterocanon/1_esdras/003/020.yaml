  preserved_meaning: It makes the inner person rich while preserving the economic image.
  reasoning_layer_used: POB lexical decisions for πάσας καρδίας and ποιεῖ πλουσίας
  rationale: This keeps the broad heart metaphor without reducing it to a feeling.
- pob_phrase: remembers neither king nor satrap
