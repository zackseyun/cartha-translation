  preserved_meaning: It causes people to speak in monetary terms.
  reasoning_layer_used: POB footnote and lexical decisions for πάντα, διὰ ταλάντων, and λαλεῖν
  rationale: The approved dynamic alternative replaces an opaque ancient monetary expression.
translation_notes:
  risk_flags:
  - risk: “Rich at heart” may be mistaken for emotional kindness rather than richness of the inner person.
    mitigation: The phrase retains both the heart metaphor and the surrounding economic image.
  - risk: Greek πάντα is formally neuter and can be read as “everything.”
    mitigation: The text follows the controlling POB choice “everyone” because people are the practical speakers.
