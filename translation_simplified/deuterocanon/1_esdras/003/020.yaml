  preserved_meaning: It disregards both the king and a Persian provincial official.
  reasoning_layer_used: POB lexical decisions for οὐ μέμνηται and σατράπην
  rationale: The contextual sense of disregard and the official’s role are stated plainly.
- pob_phrase: makes everything speak in terms of talents
