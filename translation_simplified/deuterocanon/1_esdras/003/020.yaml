translation:
  language: en
  text: It makes everyone rich at heart. It pays no attention to either a king or a Persian governor,[a] and it makes everyone talk about money.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek title is “satrap,” a provincial governor in the Persian Empire.
    reason: cultural_note
