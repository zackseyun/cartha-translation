translation:
  language: en
  text: Those who do not serve in the army or fight, but farm the land, also bring tribute to the king after they plant their seed and gather the harvest. They compel one another to bring the king his taxes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “compel one another,” probably referring to mutual pressure to ensure the taxes are paid.
    reason: lexical_alternative
