  preserved_meaning: The farmers deliver tribute after the cycle of sowing and harvesting.
  reasoning_layer_used: POB lexical decisions and latest revision pass
  rationale: The rewrite keeps the habitual sequence while replacing less familiar farming terms.
- pob_phrase: they bring tribute to the king; and ... they bring the taxes to the king
  simplified_phrase: bring tribute to the king ... bring the king his taxes
  preserved_meaning: The first royal payment remains tribute, while the second is explicitly taxes.
  reasoning_layer_used: POB theological decision on fiscal language
  rationale: The wording preserves the audited distinction without repeating the same sentence pattern.
- pob_phrase: by compelling one another
  simplified_phrase: They compel one another
  preserved_meaning: The people exert coercive pressure on each other regarding payment.
  reasoning_layer_used: POB lexical decision and footnote b
  rationale: A separate sentence makes the difficult reciprocal action easier to follow.
