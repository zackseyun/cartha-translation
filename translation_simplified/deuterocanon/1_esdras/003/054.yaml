  reasoning_layer_used: POB lexical decision for πρὸς τούτοις
  rationale: This keeps the cumulative force in natural English.
- pob_phrase: if she becomes angry with him
  simplified_phrase: if she gets angry with him
  preserved_meaning: She becomes angry or bitter toward the king.
  reasoning_layer_used: POB lexical decision for πικρανθῇ ἐπʼ αὐτόν
  rationale: “Gets angry” states the same response in ordinary modern wording.
- pob_phrase: so that she may be reconciled to him
  simplified_phrase: so that she may make peace with him
  preserved_meaning: His flattery aims to restore friendly relations with her.
  reasoning_layer_used: POB lexical decision for ὅπως διαλλαγῇ αὐτῷ and grounding review
  rationale: “May make peace” clearly expresses reconciliation while retaining purpose and contingency.
