translation:
  language: en
  text: With the woman,[a] he gives up his life.[b] He no longer thinks of his father, his mother, or his homeland.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Woman” could also mean “wife.”
    reason: lexical_alternative
  - marker: b
    text: The Greek may also mean that he abandons himself or gives up his very self.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and with the woman he gives up his life
  simplified_phrase: With the woman, he gives up his life.
  preserved_meaning: The man gives up his life in association with the woman.
  reasoning_layer_used: POB lexical decisions for μετά, ἀφίησι, and ψυχή
  rationale: Keeping “with” preserves association without narrowing it to a temporal circumstance.
- pob_phrase: remembers neither father nor mother nor homeland
  simplified_phrase: He no longer thinks of his father, his mother, or his homeland.
  preserved_meaning: He ceases to keep even his closest family and native land in mind.
  reasoning_layer_used: POB lexical decisions for μέμνηται and χώραν
  rationale: A separate sentence and ordinary negative phrasing make the three-part statement easier to follow.
