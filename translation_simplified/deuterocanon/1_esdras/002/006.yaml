translation:
  language: en
  text: So wherever any of them live, the local people must help each person with gold, silver, gifts, horses, and livestock.[a] They must also give other items as vowed offerings for the Lord’s house—the temple in Jerusalem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek includes “horses and livestock”; the Hebrew parallel in Ezra differs, referring to property and cattle.
    reason: alternative_reading
  - marker: b
    text: The Greek word may mean “temple” or “sanctuary”; “the Lord’s house” reflects the Jerusalem setting and the Hebrew parallel.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Therefore, as many as live in the various places
  simplified_phrase: So wherever any of them live
  preserved_meaning: The instruction applies throughout the different places where these people live.
  reasoning_layer_used: lexical decision for ὅσοι οὖν and κατὰ τοὺς τόπους οἰκοῦσιν
  rationale: The distributive phrase is recast in ordinary English without losing its broad scope.
- pob_phrase: let the men in his place help him
  simplified_phrase: the local people must help each person
  preserved_meaning: Residents must support the individual living among them.
  reasoning_layer_used: lexical decisions for βοηθείτωσαν αὐτῷ and οἱ ἐν τῷ τόπῳ αὐτοῦ
  rationale: “Local people” is clearer than the Semitic-sounding “men in his place.”
- pob_phrase: along with the other things added as vowed offerings
  simplified_phrase: They must also give other items as vowed offerings
  preserved_meaning: Additional contributions associated with vows are required beyond the listed aid.
  reasoning_layer_used: lexical decisions for σὺν τοῖς ἄλλοις and τοῖς κατʼ εὐχὰς προστεθειμένοις
  rationale: A second sentence makes the added category of offerings easier to follow.
