translation:
  language: en
  text: Then the family leaders of the tribes of Judah and Benjamin, together with the priests, the Levites, and everyone whose spirit the Lord had stirred, rose to go up to Jerusalem and build the Lord’s house—his temple—there.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew parallel in Ezra 1:5 says “God had stirred” rather than “the Lord had stirred.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the heads of the ancestral houses
  simplified_phrase: the family leaders
  preserved_meaning: These were leaders of extended family groups.
  reasoning_layer_used: POB lexical decision for οἱ ἀρχίφυλοι τῶν πατριῶν
  rationale: “Family leaders” makes the social role clear without the opaque phrase “ancestral houses.”
- pob_phrase: arose to go up to build
  simplified_phrase: rose to go up to Jerusalem and build
  preserved_meaning: They took action to travel to Jerusalem for the purpose of building.
  reasoning_layer_used: POB lexical decisions for καταστήσαντες, ἀναβῆναι, and οἰκοδομῆσαι
  rationale: The reordered purposes follow normal English while preserving “rose,” “go up,” and “build.”
- pob_phrase: the house of the Lord that is in Jerusalem
  simplified_phrase: the Lord’s house—his temple—there
  preserved_meaning: The building belongs to the Lord and is located in Jerusalem.
  reasoning_layer_used: POB lexical decisions for οἶκον and τῷ κυρίῳ τὸν ἐν Ἱερουσαλήμ
  rationale: The wording retains the house image and immediately explains that it means the temple.
interpretive_expansions:
- pob_phrase: the house of the Lord
  rendering: the Lord’s house—his temple
  claim: The Lord’s house here is the temple in Jerusalem.
  evidence:
  - The POB lexical rationale identifies the definite sacred building as the temple.
  - The immediate clause locates this house in Jerusalem.
  confidence: high
  alternatives_preserved:
  - the Lord’s house
