translation:
  language: en
  text: Jerusalem’s people were causing rebellions and waging wars within the city. Powerful and harsh kings also ruled in Jerusalem, forcing Coele-Syria and Phoenicia to pay tribute.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The parallel in Ezra 4:20 describes Jerusalem as rebellious; the Greek text of 1 Esdras adds wars and tribute from Coele-Syria and Phoenicia.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: its people were carrying out rebellions and wars within it
  simplified_phrase: Jerusalem’s people were causing rebellions and waging wars within the city
  preserved_meaning: The people actively produced rebellions and engaged in wars inside Jerusalem.
  reasoning_layer_used: Greek source and lexical decisions for ἀποστάσεις, πολέμους, and συντελοῦντες
  rationale: The rewrite names Jerusalem directly and uses natural verbs for rebellions and wars.
- pob_phrase: strong and harsh kings were in Jerusalem, ruling
  simplified_phrase: Powerful and harsh kings also ruled in Jerusalem
  preserved_meaning: The kings exercised power from Jerusalem and were both mighty and severe.
  reasoning_layer_used: Lexical decisions for ἰσχυροὶ καὶ σκληροὶ and κυριεύοντες
  rationale: The shorter clause preserves both descriptions and the kings’ rule.
- pob_phrase: exacting tribute from Coele-Syria and Phoenicia
  simplified_phrase: forcing Coele-Syria and Phoenicia to pay tribute
  preserved_meaning: The kings imposed tribute on both regions.
  reasoning_layer_used: Lexical decision for φορολογοῦντες and retained Greek geography
  rationale: The active wording explains imperial tribute without replacing the regional names.
