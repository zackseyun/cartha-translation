translation:
  language: en
  text: 'So now we inform you, lord king: If this city is built and its walls are put up, you will no longer have a route[a] into Coele-Syria and Phoenicia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “access” or “way through”; the warning may also imply the loss of the king’s reach into these regions.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Now therefore we make known to you
  simplified_phrase: So now we inform you
  preserved_meaning: The writers formally report the warning to the king.
  reasoning_layer_used: The lexical decision treats the verb as introducing a formal report.
  rationale: “Inform” states the administrative action in familiar modern English.
- pob_phrase: its walls are raised up
  simplified_phrase: its walls are put up
  preserved_meaning: The city’s fortifications are constructed and standing.
  reasoning_layer_used: The lexical decision preserves the wall-building image without specifying rebuilding.
  rationale: “Put up” is clearer while retaining the image of constructing the walls.
- pob_phrase: there will no longer be for you passage into
  simplified_phrase: you will no longer have a route into
  preserved_meaning: The king will lose practical passage or access into the named regions.
  reasoning_layer_used: The lexical decision identifies passage as practical access and possibly imperial reach.
  rationale: The direct clause and “route” make the consequence immediately understandable.
translation_notes:
  risk_flags:
  - risk: “Route” may sound limited to physical travel rather than broader imperial access.
    mitigation: The footnote preserves “access” and the possible implication of lost royal reach.
