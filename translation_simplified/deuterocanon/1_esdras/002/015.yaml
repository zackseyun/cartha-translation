simplification_decisions:
- pob_phrase: In the time of Artaxerxes king of the Persians
  simplified_phrase: During the time of Artaxerxes, king of the Persians
  preserved_meaning: The event occurred during the period when Artaxerxes was Persia’s king.
  reasoning_layer_used: POB lexical decision for χρόνοις and τοῦ Περσῶν βασιλέως
  rationale: “During” makes the time setting immediately clear without narrowing it to his reign.
- pob_phrase: Belemus and Mithradates and Tabelius and Rathymus and Beeltethmus and Samellius the scribe, and the rest who were associated with them
  simplified_phrase: Belemus, Mithradates, Tabelius, Rathymus, Beeltethmus, Samellius the scribe, and their associates
  preserved_meaning: The same named men, including Samellius as scribe, acted with an aligned group.
  reasoning_layer_used: POB proper-name and συντασσόμενοι lexical decisions
  rationale: A standard English list and “their associates” remove repetition while keeping every participant.
- pob_phrase: living in Samaria and the other places, wrote the following letter against the inhabitants of Judea and Jerusalem
  simplified_phrase: were living in Samaria and other places. They wrote the following letter against the people living in Judea and Jerusalem
  preserved_meaning: The group lived in Samaria and elsewhere and sent a hostile letter concerning Judea and Jerusalem’s residents.
  reasoning_layer_used: POB lexical decisions for οἰκοῦντες, κατέγραψεν, κατά, and ὑπογεγραμμένην
  rationale: Two sentences clarify who lived where and who wrote the letter without weakening its adversarial force.
