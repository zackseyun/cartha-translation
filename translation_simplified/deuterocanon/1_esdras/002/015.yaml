  text: During the time of Artaxerxes, king of the Persians, Belemus, Mithradates, Tabelius, Rathymus, Beeltethmus, Samellius the scribe, and their associates were living in Samaria and other places. They wrote the following letter against the people living in Judea and Jerusalem:[a]
