translation:
  language: en
  text: 'Now, my lord the king, you should know this: The Judeans[a] who traveled up from you to us have arrived in Jerusalem and are now living in that rebellious and wicked city. They are repairing its marketplaces[b] and walls, and they are laying the foundation of a temple.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Jews.” The term may refer specifically to people from Judea or more broadly to Jews.
    reason: lexical_alternative
  - marker: b
    text: The Greek may also mean “public squares”; some parallel traditions refer more generally to rebuilding the city.
    reason: alternative_reading
  - marker: c
    text: The compressed Greek phrase may mean that they are beginning or undertaking the rebuilding of the temple.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And now let it be known to my lord the king that
  simplified_phrase: 'Now, my lord the king, you should know this:'
  preserved_meaning: The writers formally notify the king while addressing him with courtly respect.
  reasoning_layer_used: POB lexical and theological decisions for γνωστὸν ἔστω and τῷ κυρίῳ βασιλεῖ
  rationale: Direct wording makes the formal notice easier to follow without treating “lord” as a divine title.
- pob_phrase: who came up from you to us
  simplified_phrase: who traveled up from you to us
  preserved_meaning: The Judeans journeyed upward from the king’s location or presence toward the writers.
  reasoning_layer_used: POB lexical decision for ἀναβάντες παρ’ ὑμῶν πρὸς ἡμᾶς and grounding review
  rationale: “Traveled” clarifies movement while the pronouns remain unexpanded and ambiguous.
- pob_phrase: have come to Jerusalem and are living in that rebellious and wicked city
  simplified_phrase: have arrived in Jerusalem and are now living in that rebellious and wicked city
  preserved_meaning: They reached Jerusalem and continue living in the city accused of political rebellion and wickedness.
  reasoning_layer_used: POB lexical decisions for ἀποστάτιν, πονηράν, and οἰκοῦσιν
  rationale: Separate natural verbs distinguish their arrival from their continuing residence.
translation_notes:
  risk_flags:
  - risk: “A temple” may sound like an unspecified sanctuary although the context points to Jerusalem’s temple project.
    mitigation: The text retains POB’s source-driven wording, while footnote c identifies the contextual rebuilding sense.
  - risk: “Marketplaces” is more specific than parallel traditions that describe streets or broader city rebuilding.
    mitigation: The text follows the controlling Greek, while footnote b preserves the broader alternative.
