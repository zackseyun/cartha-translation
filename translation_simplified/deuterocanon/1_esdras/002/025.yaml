translation:
  language: en
  text: When what King Artaxerxes had written was read, Rathymus, Samellius the scribe,[a] and those who sided with them hurried to Jerusalem with horsemen and a crowd drawn up for battle.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew parallel calls Rathymus and Samellius by the names Rehum and Shimshai.
    reason: alternative_reading
  - marker: b
    text: The compressed Greek may mean they went with cavalry and a large group arranged in battle order.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: those aligned with them
  simplified_phrase: those who sided with them
  preserved_meaning: The people were affiliated with Rathymus and Samellius.
  reasoning_layer_used: POB lexical decision for οἱ τούτοις συντασσόμενοι
  rationale: The verbal phrase is easier for common readers than the abstract word “aligned.”
- pob_phrase: hurried up to Jerusalem
  simplified_phrase: hurried to Jerusalem
  preserved_meaning: They traveled urgently toward Jerusalem.
  reasoning_layer_used: POB lexical decisions for ἀναζεύξαντες and κατὰ σπουδήν
  rationale: Removing “up” avoids an unfamiliar biblical travel idiom while keeping the urgency.
- pob_phrase: a battle formation of a crowd
  simplified_phrase: a crowd drawn up for battle
  preserved_meaning: A large group accompanied them in an organized, militarized formation.
  reasoning_layer_used: POB lexical decision and revision history for ὄχλου παρατάξεως
  rationale: The rewrite preserves both the crowd and battle-array ideas in natural English.
translation_notes:
  risk_flags:
  - risk: “Crowd drawn up for battle” may suggest a more definite military force than the compressed Greek establishes.
    mitigation: Footnote b preserves the uncertainty and gives the cavalry-and-battle-order alternative.
