translation:
  language: en
  text: King Cyrus brought out the sacred objects that belonged to the Lord. Nebuchadnezzar had taken them from Jerusalem and placed them in the temple of his god.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also mean “his idol shrine” or “his idol-house”; the Hebrew parallel says “the house of his god.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the holy vessels of the Lord
  simplified_phrase: the sacred objects that belonged to the Lord
  preserved_meaning: The objects were set apart as holy and belonged to Israel’s God.
  reasoning_layer_used: POB lexical decisions for τὰ ἅγια σκεύη and τοῦ κυρίου
  rationale: “Sacred objects” is clearer than “holy vessels” without specifying their exact form.
- pob_phrase: which Nebuchadnezzar had carried away from Jerusalem
  simplified_phrase: Nebuchadnezzar had taken them from Jerusalem
  preserved_meaning: Nebuchadnezzar removed the sacred objects from Jerusalem through conquest.
  reasoning_layer_used: POB lexical decision for μετήγαγεν and narrative context
  rationale: A separate sentence and “taken” make the forced removal easier to follow.
- pob_phrase: deposited in the house of his god
  simplified_phrase: placed them in the temple of his god
  preserved_meaning: Nebuchadnezzar formally put the objects in his deity’s sanctuary.
  reasoning_layer_used: POB lexical and theological decisions for ἀπηρείσατο and ἐν τῷ εἰδώλιῳ αὐτοῦ
  rationale: “Placed” and “temple” clearly express the action and cultic location.
