translation:
  language: en
  text: They began interfering with the people doing the work, and construction of the temple in Jerusalem stopped until the second year of the reign of Darius, king of the Persians.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: to hinder those who were building
  simplified_phrase: interfering with the people doing the work
  preserved_meaning: They actively opposed the people engaged in building without implying immediate total prevention.
  reasoning_layer_used: Lexical decisions for κωλύειν and τοὺς οἰκοδομοῦντας
  rationale: The simpler wording keeps both the active interference and the builders' ongoing work.
- pob_phrase: the building of the temple in Jerusalem was stopped
  simplified_phrase: construction of the temple in Jerusalem stopped
  preserved_meaning: The temple-building project came to a halt.
  reasoning_layer_used: Lexical decisions for ἤργει and ἡ οἰκοδομή
  rationale: “Construction” clearly refers to the work itself, and the active wording is easier to read.
translation_notes:
  risk_flags:
  - risk: “Interfering” may sound weaker than sustained obstruction.
    mitigation: The following clause states clearly that the construction stopped.
