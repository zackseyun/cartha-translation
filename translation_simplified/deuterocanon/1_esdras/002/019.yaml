translation:
  language: en
  text: You will find in the official records what has been written about these matters. You will learn that this city was rebellious and caused trouble for kings and cities. The Jews there were rebels who had set up blockades since ancient times.[a] That is why the city was laid waste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may refer more broadly to organizing sieges.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: you will find in the records what has been written about these things
  simplified_phrase: You will find in the official records what has been written about these matters
  preserved_meaning: Existing administrative records contain evidence about these matters.
  reasoning_layer_used: Lexical decision for ὑπομνηματισμοῖς and the administrative context.
  rationale: “Official” clarifies the kind of records without turning the statement into a command.
- pob_phrase: that city was rebellious, troubling kings and cities
  simplified_phrase: this city was rebellious and caused trouble for kings and cities
  preserved_meaning: The city is accused of political rebellion and disruption.
  reasoning_layer_used: Lexical and theological decisions for ἀποστάτις and ὀχλοῦσα.
  rationale: Two direct verbs make the political accusation easier to follow.
- pob_phrase: had established blockades from of old
  simplified_phrase: had set up blockades since ancient times
  preserved_meaning: The rebels had organized hostile siege measures over a long period.
  reasoning_layer_used: Lexical decisions for πολιορκίας, συνεσταμένοι, and ἔτι ἐξ αἰῶνος.
  rationale: Common wording preserves both the hostile image and its ancient duration.
interpretive_expansions:
