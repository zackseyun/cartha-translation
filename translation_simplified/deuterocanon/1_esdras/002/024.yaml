translation:
  language: en
  text: So now I have ordered that those men be stopped from building the city.[a] See to it that nothing else is done beyond what I have ordered,[b] and do not let the evil affair go any further and harm the kings.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The context suggests rebuilding, but the Greek simply says building.
    reason: lexical_alternative
  - marker: b
    text: The Greek may also mean “that nothing be done contrary to what I have ordered.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and that care be taken
  simplified_phrase: See to it
  preserved_meaning: The recipients must actively ensure that the royal command is followed.
  reasoning_layer_used: POB lexical decision for προνοηθῆναι
  rationale: The direct instruction expresses the official precaution in ordinary English.
- pob_phrase: that nothing further be done beyond this
  simplified_phrase: that nothing else is done beyond what I have ordered
  preserved_meaning: No action may go beyond the king’s command, while the contrary-to sense remains footnoted.
  reasoning_layer_used: POB lexical decision and footnote for παρὰ ταῦτα
  rationale: Naming the order makes the otherwise unclear reference understandable.
- pob_phrase: the evil matter may not advance any more to the harm of kings
  simplified_phrase: do not let the evil affair go any further and harm the kings
  preserved_meaning: The harmful affair must not continue until it injures royal authority.
  reasoning_layer_used: POB lexical decisions for τὰ τῆς κακίας, προβῇ ἐπὶ πλεῖον, and ἐνοχλῆσαι
  rationale: The active wording preserves both the advancing problem and its harm to kings.
interpretive_expansions:
- pob_phrase: beyond this
  rendering: beyond what I have ordered
  claim: The pronoun refers to the king’s order in the surrounding sentence.
  evidence:
  - The immediate clause reports the king’s order to stop the builders.
  - The POB rationale identifies the referent as the king’s order.
  confidence: high
  alternatives_preserved:
  - contrary to what I have ordered
translation_notes:
  risk_flags:
  - risk: “See to it” makes the passive administrative instruction directly address the recipients.
    mitigation: The official-letter context clearly presents the command for the recipients to enforce.
  - risk: “Harm the kings” may sound more direct than a phrase describing harm to royal authority.
    mitigation: It retains the POB’s chosen force while avoiding the weaker alternative “trouble.”
