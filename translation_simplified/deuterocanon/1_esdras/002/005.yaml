translation:
  language: en
  text: Therefore, if any of you belongs to his people, may his Lord be with him. Let them go up to Jerusalem in Judea and build the house of the Lord of Israel—the Lord who dwells in Jerusalem.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek shifts from singular (“any of you” and “him”) to plural (“them”); this unusual shift is preserved.
    reason: textual_variant
  - marker: b
    text: The Hebrew parallel differs here, calling for material support and a freewill offering for God’s house in Jerusalem.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: if any of you is from his people
  simplified_phrase: if any of you belongs to his people
  preserved_meaning: The person is a member of the Lord’s people rather than merely coming from a place.
  reasoning_layer_used: lexical decision for ἐκ τοῦ ἔθνους αὐτοῦ
  rationale: “Belongs to” expresses people-group membership more naturally in modern English.
- pob_phrase: and let him go up ... and build
  simplified_phrase: Let them go up ... and build
  preserved_meaning: The command retains the Greek shift from a singular person to a plural verb.
  reasoning_layer_used: source text and audited number-shift rationale
  rationale: A new sentence makes the difficult shift easier to read without silently correcting it.
- pob_phrase: the house of the Lord of Israel—he is the Lord who dwells in Jerusalem
  simplified_phrase: the house of the Lord of Israel—the Lord who dwells in Jerusalem
  preserved_meaning: The house belongs to Israel’s Lord, who is identified as dwelling in Jerusalem.
  reasoning_layer_used: lexical and theological decisions against harmonization
  rationale: Removing the pronoun tightens the identification while retaining the Greek wording and dwelling image.
translation_notes:
  risk_flags:
  - risk: The singular-to-plural shift may sound grammatically irregular to modern readers.
    mitigation: The translation preserves the source form and explains the shift in footnote a.
