translation:
  language: en
  text: 'The king then wrote a reply. It was addressed to Rathymus, who kept a record of reported matters[b]; Beeltethmus; Samellius the scribe; and their other associates living in Samaria, Syria, and Phoenicia[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek names these three regions, while the parallel account in Ezra differs in names and wording.
    reason: textual_variant
  - marker: b
    text: The Greek administrative expression may also refer to a chancellor.
    reason: lexical_alternative
