  yaml_path: translation/deuterocanon/1_esdras/002/021.yaml
  text: 'Then the king wrote back to Rathymus[a], the recorder of the complaints, and to Beeltethmus, and to Samellius the scribe, and to the rest of their associates who lived in Samaria and Syria and Phoenicia[b], as follows:'
  footnotes:
  - marker: a
    text: The Greek text names the recipients as living in Samaria and Syria and Phoenicia; the parallel Aramaic tradition in Ezra differs in names and wording. This translation follows the Greek witness of 1 Esdras while using the parallel as a control.
    reason: textual_variant
  - marker: b
    text: Or 'the chancellor' for 'the recorder of what was reported'; the Greek expression is administrative and somewhat idiomatic.
    reason: lexical_alternative
