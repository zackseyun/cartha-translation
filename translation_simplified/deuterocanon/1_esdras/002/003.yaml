translation:
  language: en
  text: 'King Cyrus of the Persians says: “The Lord of Israel,[a] the Most High Lord, has appointed me king over the world.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew parallel in Ezra 1:2 says “the LORD, the God of heaven” instead of “the Lord of Israel, the Most High Lord.” The wording here follows the Greek text of 1 Esdras.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Thus says Cyrus king of the Persians
  simplified_phrase: King Cyrus of the Persians says
  preserved_meaning: The formal proclamation begins by identifying Cyrus as ruler of the Persians.
  reasoning_layer_used: POB lexical decision for Τάδε λέγει and ὁ βασιλεὺς Περσῶν Κῦρος
  rationale: Ordinary English word order makes the speaker immediately clear.
- pob_phrase: has appointed me king of the world
  simplified_phrase: has appointed me king over the world
  preserved_meaning: The Lord installed Cyrus as king with an expansive worldwide claim.
  reasoning_layer_used: POB lexical decisions for ἀνέδειξεν and τῆς οἰκουμένης
  rationale: “King over” states royal authority more naturally than “king of” in modern English.
translation_notes:
  risk_flags:
  - risk: “King over the world” may sound like a precise claim of universal political control.
    mitigation: The wording retains the Greek proclamation’s intentionally expansive claim without adding further explanation.
