translation:
  language: en
  text: I read the letter you sent me. So I ordered an investigation. It found that this city has stood against kings since ancient times.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “has opposed kings.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Therefore I gave orders to investigate
  simplified_phrase: So I ordered an investigation
  preserved_meaning: The king formally ordered an official inquiry.
  reasoning_layer_used: Lexical decision for ἐπέταξα and ἐπισκέψασθαι
  rationale: The shorter wording keeps the administrative force in natural English.
- pob_phrase: it was found that
  simplified_phrase: It found that
  preserved_meaning: The reported conclusion came from the ordered investigation.
  reasoning_layer_used: Immediate context and lexical decision for εὑρέθη
  rationale: Naming the investigation as the subject makes the passive report easier to follow.
- pob_phrase: has from ancient times set itself in opposition to kings
  simplified_phrase: has stood against kings since ancient times
  preserved_meaning: The city has a long history of taking an adversarial stand against royal authority.
  reasoning_layer_used: Lexical decisions for ἐξ αἰῶνος and ἀντιπαρατάσσουσα
  rationale: This keeps both the standing-against image and the longstanding historical sense.
translation_notes:
  risk_flags:
  - risk: “Stood against” may be read less strongly than open rebellion.
    mitigation: The wording preserves the Greek image without overstating it, and the footnote gives the compact alternative “has opposed.”
