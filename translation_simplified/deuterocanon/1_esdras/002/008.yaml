translation:
  language: en
  text: The people living around them helped them in every way. They gave silver and gold, horses,[a] and livestock, and they offered many prayers.[b] All this support came from people who were moved to help.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew parallel in Ezra 1:6 has “goods” or “property” rather than “horses,” but 1 Esdras follows the Greek here.
    reason: alternative_reading
  - marker: b
    text: The Greek reads “prayers,” possibly “vows”; the Hebrew parallel has “choice gifts” or “precious things.”
    reason: textual_variant
  - marker: c
    text: Greek literally says their “mind had been stirred”; the Hebrew parallel uses “spirit.”
    reason: lexical_alternative
