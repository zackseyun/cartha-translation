translation:
  language: en
  text: 'To King Artaxerxes, our lord, from your servants: Rathymus,[a] who oversees records;[b] Samellius, the scribe; the other members of their council; and those in Coele-Syria and Phoenicia.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rathymus and Samellius correspond approximately to Rehum and Shimshai in the Hebrew parallel.
    reason: alternative_reading
  - marker: b
    text: The Greek title is uncertain and may refer more broadly to an official who handled matters brought forward.
    reason: lexical_alternative
  - marker: c
    text: Coele-Syria is the historical regional name used in the Greek text.
    reason: cultural_note
simplification_decisions:
- pob_phrase: 'To King Artaxerxes our lord: your servants'
  simplified_phrase: To King Artaxerxes, our lord, from your servants
  preserved_meaning: The letter respectfully identifies the king as recipient and the named group as his subordinate senders.
  reasoning_layer_used: POB lexical decision on the epistolary address and royal court title
  rationale: Adding “from” makes the letter heading immediately clear in modern English.
- pob_phrase: Rathymus, the one over records
  simplified_phrase: Rathymus, who oversees records
  preserved_meaning: Rathymus holds an administrative role connected with records or matters presented for action.
  reasoning_layer_used: POB lexical decision and uncertainty note for ὁ τὰ προσπίπτοντα
  rationale: The verb phrase is clearer while the footnote preserves the title’s uncertainty.
- pob_phrase: the rest of their council
  simplified_phrase: the other members of their council
  preserved_meaning: The remaining people who belong to their deliberative council are included.
  reasoning_layer_used: POB lexical decision for οἱ ἐπίλοιποι τῆς βουλῆς αὐτῶν
  rationale: Naming the members avoids the awkward impression that a council itself is being divided.
