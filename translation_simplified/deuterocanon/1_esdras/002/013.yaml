translation:
  language: en
  text: All the gold and silver items used in the temple were brought—5,469 in all.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “were brought up,” perhaps referring to their return to Jerusalem.
    reason: lexical_alternative
  - marker: b
    text: The inventory and numbers in Ezra 1:9–10 differ; this verse follows the Greek text of 1 Esdras.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: all the vessels
  simplified_phrase: all the ... items used in the temple
  preserved_meaning: The objects are the temple articles being transported.
  reasoning_layer_used: Lexical decision for τὰ ... πάντα σκεύη and the temple-treasury context
  rationale: “Items used in the temple” makes the older sense of “vessels” immediately clear.
- pob_phrase: were brought up
  simplified_phrase: were brought
  preserved_meaning: The objects were transported without specifying a destination more firmly than the Greek does.
  reasoning_layer_used: Lexical alternatives and POB footnote a
  rationale: The simpler verb avoids an unclear English idiom while the footnote preserves the Greek image.
- pob_phrase: five thousand four hundred and sixty-nine in all
  simplified_phrase: 5,469 in all
  preserved_meaning: The Greek total remains unchanged.
  reasoning_layer_used: Lexical decision for the cardinal total
  rationale: Digits make a large inventory total easier to read.
