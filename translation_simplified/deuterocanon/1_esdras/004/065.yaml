  preserved_meaning: The speaker reminds the king of his vowed commitment.
  reasoning_layer_used: POB lexical and theological decisions on εὐχή and ηὐξάμην
  rationale: Removing “that” makes the clause more natural without weakening the vow.
- pob_phrase: on the day when you received your kingdom
  simplified_phrase: on the day you became king
  preserved_meaning: The vow was made when the king assumed royal rule.
  reasoning_layer_used: POB lexical rationale for παρέλαβες and τὸ βασίλειόν σου
