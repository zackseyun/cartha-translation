translation:
  language: en
  text: Then he said to the king, “Remember the vow[a] I made to rebuild Jerusalem on the day you became king.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the prayer I prayed.” The Greek can refer either to a vow or to a prayer, but the context favors a vowed commitment.
    reason: lexical_alternative
