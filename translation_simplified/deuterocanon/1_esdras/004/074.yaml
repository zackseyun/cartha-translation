translation:
  language: en
  text: 'They were also to offer burnt offerings on the altar every day, as commanded: seventeen sacrificial items,[a] plus an additional ten talents by weight each year.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek does not state what the number seventeen counts, but it probably refers to items offered in sacrifice.
    reason: alternative_reading
  - marker: b
    text: A talent was a large unit of weight, but the text does not say what material was measured.
    reason: cultural_note
simplification_decisions:
- pob_phrase: and on the altar to offer burnt offerings daily
  simplified_phrase: They were also to offer burnt offerings on the altar every day
  preserved_meaning: The required sacrifices were offered regularly on the altar.
  reasoning_layer_used: POB lexical decisions for θυσιαστήριον, ὁλοκαυτώματα, καρποῦσθαι, and καθ’ ἡμέραν
  rationale: A complete clause and “every day” make the action easier to follow.
- pob_phrase: as they have been commanded
  simplified_phrase: as commanded
  preserved_meaning: The offerings fulfilled an existing command.
  reasoning_layer_used: POB lexical decision for καθὰ ἔχουσιν ἐντολήν
  rationale: The shorter passive phrase keeps the standing obligation.
- pob_phrase: another ten talents yearly
  simplified_phrase: plus an additional ten talents by weight each year
  preserved_meaning: Ten more talents were required annually.
  reasoning_layer_used: POB lexical decisions and cultural footnote for ἄλλα τάλαντα δέκα and κατ’ ἐνιαυτόν
  rationale: “Plus” clarifies addition, while “by weight” explains the historical measure.
interpretive_expansions:
