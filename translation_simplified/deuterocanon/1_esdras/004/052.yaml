translation:
  language: en
  text: They must also offer burnt offerings on the altar every day, as commanded—seventeen offerings, and another ten talents each year.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek text is compressed and difficult here, especially the wording about the seventeen offerings and the ten talents each year; this translation gives its probable main sense without claiming certainty about every detail.
    reason: textual_variant
  - marker: b
    text: A talent was a large unit of weight and value, but the text does not specify here what the talents consisted of.
    reason: cultural_note
