translation:
  language: en
  text: All the temple vessels taken from Jerusalem must also be sent back there. Cyrus had set them apart when he vowed to destroy Babylon[a] and to send them back to Jerusalem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may mean “prayed” instead of “vowed,” and literally says “cut off Babylon.”
    reason: lexical_alternative
  - marker: b
    text: The Greek says “send there”; “back to Jerusalem” is clear from the context.
    reason: simplification_note
