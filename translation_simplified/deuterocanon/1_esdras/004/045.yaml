simplification_decisions:
- pob_phrase: and you vowed to rebuild
  simplified_phrase: You also vowed to rebuild
  preserved_meaning: The vow concerned restoring the destroyed temple.
  reasoning_layer_used: The lexical decisions identify the action as a pledged undertaking and the building as restoration.
  rationale: “Also” expresses the continuing connection more naturally than beginning with “and.”
- pob_phrase: when Judea was laid waste by the Chaldeans
  simplified_phrase: when the Chaldeans devastated Judea
  preserved_meaning: The Chaldeans brought severe destruction on Judea.
  reasoning_layer_used: The lexical decision defines the passive verb as devastation or desolation.
  rationale: The active wording is easier to follow while retaining the force and named agents.
