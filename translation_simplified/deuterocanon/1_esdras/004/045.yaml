translation:
  language: en
  text: You also vowed to rebuild the temple that the Judeans burned when the Chaldeans devastated Judea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says, “the Judeans burned.” This difficult reading differs from the familiar account that the Chaldeans, or Babylonians, burned the temple.
