translation:
  language: en
  text: Besides this, the king stared at her with his mouth open. If she laughs at him,[a] he laughs too. But if she is offended with him, he flatters her so that she may make peace with him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “laughs with him.” The Greek can mean either.
    reason: lexical_alternative
