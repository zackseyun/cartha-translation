translation:
  language: en
  text: He also wrote to all the Jews who were going up from the kingdom to Judea about freedom. No official,[a] satrap, district ruler, or steward was to come against them at their doors.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek is difficult here and may instead refer to “every authority” or “every powerful person.”
    reason: lexical_alternative
  - marker: b
    text: Coming against them at their doors likely means intruding on them or pressing claims against them at home.
    reason: lexical_alternative
