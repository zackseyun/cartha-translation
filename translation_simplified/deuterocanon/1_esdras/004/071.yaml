translation:
  language: en
  text: He also wrote to all the Jews traveling up from the kingdom to Judea about their freedom.[a] He ordered that no official—whether a provincial ruler, governor, or administrator—was to come against them at their homes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Freedom” may refer here to a legal exemption or privilege granted to them.
    reason: lexical_alternative
  - marker: b
    text: The Greek literally says that officials should not “come against their doors”; the exact kind of interference is not specified.
    reason: lexical_alternative
