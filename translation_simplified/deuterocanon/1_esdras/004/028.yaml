  rationale: Dropping “And” and using a contraction make the question more natural without changing its force.
- pob_phrase: Is not the king great in his authority?
  simplified_phrase: Isn't the king great in his authority?
  preserved_meaning: The king is great because of his ruling authority.
  reasoning_layer_used: POB lexical decisions for μέγας and ἐξουσία
  rationale: The contraction gives the rhetorical question ordinary modern English form.
- pob_phrase: Do not all the lands fear to touch him?
  simplified_phrase: Don't all the lands fear to touch him?
  preserved_meaning: All territories fear making physical contact with the king.
  reasoning_layer_used: POB lexical decisions for χῶραι, εὐλαβοῦνται, and ἅπτομαι
  rationale: The wording retains both the collective lands and the concrete image of touching.
