translation:
  language: en
  text: He sent back all the temple vessels that Cyrus had set aside to be taken from Babylon.[a] He also ordered that all Cyrus’s directions be carried out and that the vessels be sent to Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may mean set apart, separated, or removed; here the vessels were selected to be returned from Babylon.
    reason: lexical_alternative
