translation:
  language: en
  text: They said, “When the king gets up, they will give him the written document. The king and the three Persian nobles will decide whose argument is wiser. That person will be given the victory, as it is written.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: When the king rises, they will give him the writing
  simplified_phrase: When the king gets up, they will give him the written document
  preserved_meaning: The king receives the written material when he gets up.
  reasoning_layer_used: The lexical decisions allow “gets up” and identify the writing as a document for royal review.
  rationale: This wording is natural without claiming that the people who deliver the document wrote it.
- pob_phrase: whoever the king and the three nobles of Persia judge that his argument is wiser
  simplified_phrase: The king and the three Persian nobles will decide whose argument is wiser
  preserved_meaning: The king and three high-ranking Persians evaluate which contestant has the wiser argument.
  reasoning_layer_used: The lexical decisions support “decide,” “nobles,” and the rhetorical sense of “argument.”
  rationale: The recast clause uses ordinary English while preserving the comparative “wiser.”
- pob_phrase: to him the victory will be given
  simplified_phrase: That person will be given the victory
  preserved_meaning: The person judged to have the wiser argument receives the official victory.
  reasoning_layer_used: The lexical decision identifies νῖκος as the awarded victory in the contest.
  rationale: The clear pronoun reference preserves the formal awarding of victory.
translation_notes:
  risk_flags:
  - risk: “Written document” selects one of the possible senses of the broader expression “the writing.”
    mitigation: The POB lexical rationale explicitly allows “document” in this setting.
  - risk: “As it is written” does not specify where the award terms are written.
    mitigation: The wording preserves the source’s deliberate lack of a more precise referent.
