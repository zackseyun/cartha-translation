simplification_decisions:
- pob_phrase: Blessed are you, who have given me wisdom
  simplified_phrase: Blessed are you, for you have given me wisdom
  preserved_meaning: God is blessed in response to his gift of wisdom.
  reasoning_layer_used: POB translation and lexical decisions for εὐλογητός and ἔδωκάς
  rationale: Using “for” makes the reason for the blessing clear.
- pob_phrase: and to you I give thanks
  simplified_phrase: I thank you
  preserved_meaning: The speaker directly gives God worshipful thanks.
  reasoning_layer_used: POB theological decision for ὁμολογῶ
  rationale: The shorter wording is natural English and avoids suggesting confession of sin.
- pob_phrase: Master of the fathers
  simplified_phrase: Master of the ancestors
  preserved_meaning: God is addressed as the absolute Master of the ancestral fathers.
  reasoning_layer_used: POB lexical and theological decisions for δέσποτα τῶν πατέρων
  rationale: “Ancestors” makes “fathers” understandable while “Master” preserves the distinct divine title.
translation_notes:
  risk_flags:
  - risk: “Ancestors” is clearer than the more source-formal “fathers” but is less verbally tied to the Greek image.
    mitigation: It preserves the ancestral reference without adding the unstated possessive “our.”
