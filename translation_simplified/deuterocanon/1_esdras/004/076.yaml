translation:
  language: en
  text: He also wrote down the supplies and the priestly robe to be used in their service.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek is compressed and may also be translated, “the provision and the priestly garment, indicating how they are to serve in it.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: wrote out the provision
  simplified_phrase: wrote down the supplies
  preserved_meaning: He formally recorded the material support for temple service.
  reasoning_layer_used: POB lexical decisions for ἔγραψεν and χορηγίαν
  rationale: Common wording keeps the administrative act and the broad sense of material provision.
- pob_phrase: the priestly robe—specifying in what they are to minister in it
  simplified_phrase: the priestly robe to be used in their service
  preserved_meaning: The written record connected the priestly robe with their temple service without specifying exactly how.
  reasoning_layer_used: POB lexical decisions for ἱερατικὴν στολήν, ἐν τίνι, λατρεύσουσιν, and ἐν αὐτῇ
  rationale: This untangles the clause while the footnote preserves its compressed relationship.
interpretive_expansions:
- pob_phrase: in what they are to minister in it
  rendering: to be used in their service
  claim: The priestly robe was connected with the performance of their temple service.
  evidence:
  - The POB identifies the robe as the most natural antecedent of the feminine pronoun.
  - The temple context gives λατρεύσουσιν the sense of priestly service.
  confidence: moderate
  alternatives_preserved:
  - The wording may indicate more broadly how they were to serve in the robe.
translation_notes:
  risk_flags:
  - risk: “To be used” makes the robe-service relationship somewhat more explicit than the compressed Greek.
    mitigation: The footnote preserves a closer rendering and notes the compression.
