translation:
  language: en
  text: You also made a vow to rebuild the temple. The Judeans burned it when the Chaldeans devastated Judea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “the Judeans.” Other historical accounts may lead readers to expect “the Chaldeans” or “the Babylonians.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: you vowed to rebuild
  simplified_phrase: you made a vow to rebuild
  preserved_meaning: The king made a solemn pledge to restore the burned temple.
  reasoning_layer_used: Lexical decisions for εὔξω and οἰκοδομῆσαι.
  rationale: The expanded wording makes the solemn pledge clear while preserving the idea of rebuilding.
- pob_phrase: the temple which the Judeans burned when Judea was laid waste by the Chaldeans
  simplified_phrase: The Judeans burned it when the Chaldeans devastated Judea.
  preserved_meaning: The Judeans remain the stated agents of the burning, and the Chaldeans remain the agents of Judea’s devastation.
  reasoning_layer_used: The historical-attribution decision and lexical choices for ἐνεπύρισαν, ἐρημώθη, and Χαλδαίων.
  rationale: A separate sentence and active wording clarify both actions without adding a sequence or resolving the tension.
translation_notes:
  risk_flags:
  - risk: Readers may think “the Judeans” is a mistaken attribution.
    mitigation: The footnote identifies it as the Greek wording and notes the historically expected alternatives.
