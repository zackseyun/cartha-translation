translation:
  language: en
  text: Then each man wrote down his own statement. They sealed the statements and put them under King Darius’s pillow.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “headrest.” The Greek word can refer to a pillow or headrest.
