simplification_decisions:
- pob_phrase: after each had written his own statement
  simplified_phrase: each man wrote down his own statement
  preserved_meaning: Every participant first committed his own statement to writing.
  reasoning_layer_used: The lexical decisions for γράψαντες, ἕκαστος, and λόγος preserve the sequence, individual action, and written contention.
  rationale: A separate sentence makes the prior action clear without the heavy participial structure.
- pob_phrase: they sealed them and placed them
  simplified_phrase: They sealed the statements and put them
  preserved_meaning: The written submissions were sealed and then deposited.
  reasoning_layer_used: The lexical decisions identify the implied object as the written statements and allow “put” for ἔθηκαν.
  rationale: Repeating “statements” removes an unclear pronoun, while “put” uses common English.
- pob_phrase: under the pillow of Darius the king
  simplified_phrase: under King Darius’s pillow
  preserved_meaning: The sealed statements were put beneath the king’s pillow or headrest.
  reasoning_layer_used: The lexical rationale prefers “pillow” and preserves “headrest” as an alternative.
  rationale: The possessive form is more natural in modern English.
