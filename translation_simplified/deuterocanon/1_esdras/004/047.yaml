translation:
  language: en
  text: Then King Darius stood up and kissed him. He wrote letters on his behalf to officials who managed resources, regional governors, generals, and provincial governors called satraps. The letters instructed them to escort him[a] and everyone traveling with him up to Jerusalem to build the city.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean that they were to send him on his way with supplies and other support.
    reason: lexical_alternative
  - marker: b
    text: The Greek says “build,” though some translations say “rebuild” because Jerusalem was being restored.
    reason: lexical_alternative
