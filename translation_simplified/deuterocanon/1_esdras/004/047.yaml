- pob_phrase: stewards and regional governors and generals and satraps
  simplified_phrase: officials who managed resources, regional governors, generals, and provincial governors called satraps
  preserved_meaning: The four groups remain distinct, and the specific Persian title “satraps” is retained.
  reasoning_layer_used: POB lexical decisions for οἰκονόμους and σατράπας
  rationale: The wording explains unfamiliar offices without adding an unstated royal connection.
- pob_phrase: that they should escort him
  simplified_phrase: The letters instructed them to escort him
  preserved_meaning: Darius directed the officials to assist the man’s journey.
  reasoning_layer_used: POB translation and lexical rationale for προπέμπω
  rationale: A separate sentence makes the letters’ purpose clear.
- pob_phrase: all those with him who were going up to build Jerusalem
