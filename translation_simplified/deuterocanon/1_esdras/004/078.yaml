translation:
  language: en
  text: He also wrote that everyone who guarded the city should receive assigned portions[a] and wages.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “shares” or “portions assigned by lot.”
    reason: lexical_alternative
  - marker: b
