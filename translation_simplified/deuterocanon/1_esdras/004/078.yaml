    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And to all who guarded the city
  simplified_phrase: He also wrote that everyone who guarded the city
  preserved_meaning: The written instruction concerned all the city guards.
  reasoning_layer_used: Greek syntax and the POB lexical decisions for φρουροῦσι and πόλιν.
  rationale: The sentence is reordered into natural English while keeping every guard in view.
- pob_phrase: allotments
  simplified_phrase: assigned portions
  preserved_meaning: The guards were to receive allocated shares, possibly assigned by lot.
  reasoning_layer_used: POB lexical decision and footnote for κλήρους.
  rationale: “Assigned portions” explains the uncommon sense of “allotments” without narrowing it to land.
- pob_phrase: should be given to them
  simplified_phrase: should receive
  preserved_meaning: The written directive ordered that the guards be given the benefits.
  reasoning_layer_used: POB syntactic decision for ἔγραψε δοῦναι.
  rationale: Making the guards the subject removes a cumbersome passive clause without changing the directive.
translation_notes:
  risk_flags:
  - risk: “Assigned portions” may make the possible use of lots less visible.
    mitigation: Footnote a preserves that lexical possibility.
  - risk: “Wages” may be read as money only, though ὀψώνια can include provisions.
    mitigation: Footnote b preserves “pay” and “rations” as alternatives.
