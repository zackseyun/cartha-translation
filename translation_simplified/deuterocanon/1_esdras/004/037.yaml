translation:
  language: en
  text: Wine is unjust; the king is unjust; women are unjust. All the sons of men[a] are unjust, and everything they do is unjust. The same is true of all such things. There is no truth in them, and they will perish in their injustice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek phrase “sons of men” is a masculine expression for all humanity.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and all the sons of men and all their works are unjust
  simplified_phrase: All the sons of men are unjust, and everything they do is unjust
  preserved_meaning: Both humanity and human deeds are declared unjust.
  reasoning_layer_used: POB lexical and theological decisions on “sons of men,” “works,” and repeated “unjust”
  rationale: The clause is divided and “works” is expressed as ordinary human actions.
- pob_phrase: —all such things
  simplified_phrase: The same is true of all such things.
  preserved_meaning: The judgment of injustice extends to everything of the kind just listed.
  reasoning_layer_used: POB lexical decision for πάντα τὰ τοιαῦτα
  rationale: A complete sentence makes the phrase’s summarizing role easier to follow.
- pob_phrase: And there is no truth in them, and in their injustice they will perish.
  simplified_phrase: There is no truth in them, and they will perish in their injustice.
  preserved_meaning: They lack truth and will perish in their injustice without specifying an external destroyer.
  reasoning_layer_used: POB lexical decisions for ἀλήθεια and ἀπολοῦνται
  rationale: Natural clause order improves readability while retaining the moral connection and future result.
translation_notes:
