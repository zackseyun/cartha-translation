translation:
  language: en
  text: He also gave written orders that the Levites receive support until the house—the temple—was finished and Jerusalem was built.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Jerusalem was rebuilt.” The Greek says “built,” though the context concerns restoration.
    reason: lexical_alternative
  - marker: b
    text: The Greek wording for this time limit is awkward, but its clear sense is that the support continued until this work was finished.
    reason: textual_variant
