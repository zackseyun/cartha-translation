- pob_phrase: he wrote that support should be given
  simplified_phrase: gave written orders that ... receive support
  preserved_meaning: A formal written directive required ongoing provision for the Levites.
  reasoning_layer_used: lexical decisions for ἔγραψεν, δοῦναι, and χορηγία
  rationale: The active wording makes the official directive easier to follow without naming an unstated recipient.
- pob_phrase: until the day when
  simplified_phrase: until
  preserved_meaning: The completion of the work marks the endpoint of the support.
  reasoning_layer_used: lexical decision for ἕως τῆς ἡμέρας
  rationale: The shorter time expression is natural English and keeps the same endpoint.
- pob_phrase: would be completed
  simplified_phrase: was finished
  preserved_meaning: The support was to continue through the future completion of the house.
  reasoning_layer_used: lexical decision for ᾖ ἐπιτελεσθῇ
  rationale: “Was finished” states the prospective endpoint plainly in the sentence’s past-time frame.
