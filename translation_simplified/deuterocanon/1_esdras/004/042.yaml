translation:
  language: en
  text: Then the king said to him, “Ask for anything else you want beyond what has already been written down,[a] and we will give it to you, because you have been judged wiser. You will sit beside me and be called my kinsman.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This likely means rewards that had already been promised in writing.
    reason: lexical_alternative
  - marker: b
    text: Being called the king’s “kinsman” gave him royal favor and high status; it does not necessarily mean he was a blood relative.
    reason: cultural_note
