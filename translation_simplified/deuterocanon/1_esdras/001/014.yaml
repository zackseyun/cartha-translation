translation:
  language: en
  text: The temple singers, the sons of Asaph, took their assigned places according to David’s arrangements. Asaph, Zechariah, and Eddinous had a role connected with the king.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The compressed Greek may mean that they were appointed by the king or were otherwise affiliated with him.
    reason: alternative_reading
