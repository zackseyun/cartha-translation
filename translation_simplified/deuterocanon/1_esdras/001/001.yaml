translation:
  language: en
  text: Josiah celebrated the Passover in Jerusalem for his Lord.[a] On the fourteenth day of the first month, they slaughtered the Passover lamb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Greek: “his Lord”; the Hebrew parallel in 2 Chronicles 35:1 reads “the LORD.”'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: kept the Passover
  simplified_phrase: celebrated the Passover
  preserved_meaning: Josiah observed the Passover festival.
  reasoning_layer_used: Lexical decision for ἤγαγεν in its festival context
  rationale: “Celebrated” makes the act of observing the festival immediately clear.
- pob_phrase: to the Lord his God
  simplified_phrase: for his Lord
  preserved_meaning: The Passover was observed for Josiah’s Lord, preserving the Greek possessive.
  reasoning_layer_used: Greek source and theological decision for κυρίῳ αὐτοῦ
  rationale: This restores the source-driven possessive in natural English without importing the Hebrew divine name.
- pob_phrase: and they slaughtered the Passover on the fourteenth day of the first month
  simplified_phrase: On the fourteenth day of the first month, they slaughtered the Passover lamb.
  preserved_meaning: They killed the Passover sacrificial victim on the specified date.
  reasoning_layer_used: Lexical decisions for ἔθυσαν and the second τὸ πάσχα
  rationale: The new sentence and explicit “lamb” clarify both the action and its object.
interpretive_expansions:
- pob_phrase: the Passover
  rendering: the Passover lamb
  claim: The second occurrence refers to the sacrificial victim rather than the festival as a whole.
  evidence:
  - The verb ἔθυσαν denotes sacrificial killing.
  - The POB lexical decision identifies the second occurrence as the Passover lamb.
  confidence: high
  alternatives_preserved:
  - the Passover sacrifice
