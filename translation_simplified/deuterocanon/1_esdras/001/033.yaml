translation:
  language: en
  text: He ruled over Israel and Jerusalem for three months. Then the king of Egypt removed him from power in Jerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek verb can also mean “restored” or “appointed,” but the story here indicates that the king removed him from power.
    reason: alternative_reading
