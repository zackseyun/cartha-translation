translation:
  language: en
  text: The priests kept offering the sacrificial fat on the altar until evening. The Levites made preparations for themselves and for their brothers—the priests descended from Aaron.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Brothers” here refers to fellow members of Israel, not necessarily biological siblings.
    reason: cultural_note
