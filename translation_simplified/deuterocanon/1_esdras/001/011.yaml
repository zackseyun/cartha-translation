translation:
  language: en
  text: They roasted the Passover over a fire in the proper way. They boiled the sacrifices in bronze pots and kettles, with a pleasing aroma.[b] Then they brought them to all the people.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More specifically, this may mean all the non-priestly people, as distinct from the priests and Levites.
    reason: lexical_alternative
  - marker: b
    text: The Greek refers to a pleasant fragrance, perhaps evoking the aroma of an offering.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: with fire, as was proper
  simplified_phrase: over a fire in the proper way
  preserved_meaning: The Passover was roasted by fire according to the appropriate ritual practice.
  reasoning_layer_used: Lexical decisions for ἐν πυρί and ὡς καθήκει
  rationale: This wording is easy to picture without defining the norm as strictly legal, customary, or ritual.
- pob_phrase: with a pleasing aroma
  simplified_phrase: with a pleasing aroma
  preserved_meaning: The preparation was accompanied by a pleasant fragrance with possible sacrificial resonance.
  reasoning_layer_used: Lexical decision for μετʼ εὐωδίας and grounding review
  rationale: The wording preserves the sensory image without specifying what produced the fragrance.
- pob_phrase: and brought them to all the people
  simplified_phrase: Then they brought them to all the people
  preserved_meaning: The prepared sacrifices were brought to the people, possibly the non-priestly populace.
  reasoning_layer_used: Lexical and theological decisions for ἀπήνεγκαν and πᾶσι τοῖς ἐκ τοῦ λαοῦ
  rationale: A separate sentence clarifies the sequence while the footnote preserves the possible social distinction.
translation_notes:
  risk_flags:
  - risk: “The Passover” may refer to the victim or the meal.
    mitigation: The main text retains POB’s wording so the source ambiguity remains open.
  - risk: “Pleasing aroma” could be read as explicitly declaring divine acceptance or identifying its source.
    mitigation: The main text keeps the phrase unattached, and the footnote presents sacrificial resonance only as possible.
