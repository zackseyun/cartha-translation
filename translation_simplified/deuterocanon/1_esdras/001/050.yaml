translation:
  language: en
  text: The invaders killed the people’s young men with the sword all around the holy temple. They showed no mercy to anyone—young men or virgins, old men or younger people.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: These men killed their young men
  simplified_phrase: The invaders killed the people’s young men
  preserved_meaning: The attackers killed young men belonging to the people under attack.
  reasoning_layer_used: POB lexical decisions and immediate context
  rationale: Explicit nouns prevent the two uses of “their” from sounding as if the invaders killed their own men.
- pob_phrase: they showed no mercy to young man or virgin, old man or youth
  simplified_phrase: They showed no mercy to anyone—young men or virgins, old men or younger people.
  preserved_meaning: The killers spared no category of person listed, regardless of sex or age.
  reasoning_layer_used: Greek distributive list and POB lexical decisions
  rationale: The lead-in “anyone” makes the distributive force natural while retaining every category.
- pob_phrase: with the sword around the holy temple
  simplified_phrase: with the sword all around the holy temple
  preserved_meaning: The slaughter took place by the sword throughout the area surrounding the temple.
  reasoning_layer_used: POB lexical decision for περικύκλῳ
  rationale: “All around” clearly conveys the surrounding area without weakening the violent image of the sword.
