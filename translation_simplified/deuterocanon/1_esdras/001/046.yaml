translation:
  language: en
  text: Even though he had sworn loyalty to King Nebuchadnezzar by the name of the Lord, he broke his oath and rebelled.[a] He stubbornly hardened his neck and heart and violated the laws of the Lord God of Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rebellion likely means revolt against Nebuchadnezzar, though the Greek does not explicitly say against whom he rebelled.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: though he had sworn by the name of the Lord to King Nebuchadnezzar
  simplified_phrase: Even though he had sworn loyalty to King Nebuchadnezzar by the name of the Lord
  preserved_meaning: The solemn oath pledged loyalty to Nebuchadnezzar and makes his betrayal more serious.
  reasoning_layer_used: POB lexical decisions, footnote a, and grounding review
  rationale: “Even though” preserves the contrast, while “loyalty” makes the oath's purpose clear.
- pob_phrase: stiffening his neck and his heart
  simplified_phrase: He stubbornly hardened his neck and heart
  preserved_meaning: The body image portrays deliberate outward and inward obstinacy.
  reasoning_layer_used: POB lexical decisions for σκληρύνας, τράχηλον, and καρδία
  rationale: “Stubbornly” explains the image while “neck and heart” preserves it.
- pob_phrase: transgressed the laws
  simplified_phrase: violated the laws
  preserved_meaning: He defied the established requirements of the Lord God of Israel.
  reasoning_layer_used: POB lexical decisions for παρέβη and νόμιμα
  rationale: “Violated” is common English with serious legal and moral force.
interpretive_expansions:
- pob_phrase: had sworn ... to King Nebuchadnezzar
  rendering: had sworn loyalty to King Nebuchadnezzar
  claim: The oath concerned loyalty to the Babylonian king.
  evidence:
  - POB footnote a identifies an oath of loyalty in relation to the king.
  - The lexical rationale says the historical setting supports this sense.
  confidence: high
  alternatives_preserved:
  - had sworn to King Nebuchadnezzar
  - was put under oath by King Nebuchadnezzar
translation_notes:
  risk_flags:
  - risk: “Rebelled” could be understood as religious rather than political rebellion.
    mitigation: The footnote gives the likely political referent without adding an unstated object to the text.
