translation:
  language: en
  text: The events concerning him were also recorded long ago. Those records tell about people who sinned and acted more wickedly against the Lord than any other nation or kingdom. They grieved him greatly.[a] And the Lord’s words rose up against Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word translated “greatly” is difficult here and may reflect a minor problem in the transmitted text.
    reason: textual_variant
