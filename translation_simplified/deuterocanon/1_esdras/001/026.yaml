translation:
  language: en
  text: Josiah did not turn back to his chariot. Instead, he tried to fight the king of Egypt and paid no attention to the words of Jeremiah the prophet, which came from the mouth of the Lord.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may mean that Josiah refused to withdraw to his chariot.
    reason: lexical_alternative
