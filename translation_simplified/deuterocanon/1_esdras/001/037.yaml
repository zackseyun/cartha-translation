translation:
  language: en
  text: Jehoiakim was twenty-five years old when he became king over Judea and Jerusalem.[a] He did what was evil in the Lord’s sight.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Judah and Jerusalem.” The Greek says “Judea,” while the Hebrew parallel tradition commonly says “Judah.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: became king of Judea and Jerusalem
  simplified_phrase: became king over Judea and Jerusalem
  preserved_meaning: Jehoiakim began to rule Judea and Jerusalem at age twenty-five.
  reasoning_layer_used: The lexical decision allows “over,” while the Greek remains the controlling source for “Judea.”
  rationale: “King over” states the ruling relationship more naturally in modern English.
- pob_phrase: did what was evil before the Lord
  simplified_phrase: did what was evil in the Lord’s sight
  preserved_meaning: His conduct was morally evil as judged by the Lord.
  reasoning_layer_used: The lexical decision identifies “in the sight of” as an equivalent for the Greek phrase.
  rationale: This wording makes the biblical image of conduct under the Lord’s observation immediately clear.
translation_notes:
  risk_flags:
  - risk: Readers may expect the familiar name “Judah” rather than the Greek-based “Judea.”
    mitigation: The main text follows the Greek, and the footnote preserves “Judah” as the Hebrew-tradition alternative.
