translation:
  language: en
  text: They were servants to him and his sons until the Persians began to rule. In this way, the Lord’s word spoken through Jeremiah was fulfilled.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: they were servants to him and to his sons
  simplified_phrase: They were servants to him and his sons
  preserved_meaning: They remained in a dependent condition under the ruler and his descendants.
  reasoning_layer_used: POB lexical decision for παῖδες and grounding review
  rationale: Keeping “were servants” preserves their status under imperial subjugation rather than suggesting ordinary voluntary service.
- pob_phrase: until the Persians came to reign
  simplified_phrase: until the Persians began to rule
  preserved_meaning: Their condition continued until Persian rule began.
  reasoning_layer_used: POB lexical decision for μέχρι οὗ βασιλεῦσαι Πέρσας
  rationale: “Began to rule” makes the change of imperial power clear in common English.
- pob_phrase: to fulfill the word of the Lord by the mouth of Jeremiah
  simplified_phrase: In this way, the Lord’s word spoken through Jeremiah was fulfilled
  preserved_meaning: These events fulfilled the Lord’s prophetic message delivered through Jeremiah.
  reasoning_layer_used: POB lexical and theological decisions for εἰς ἀναπλήρωσιν, ῥῆμα, κύριος, and ἐν στόματι Ἰερεμίου
  rationale: A separate sentence clarifies fulfillment while preserving the Lord as source and Jeremiah as messenger.
translation_notes:
  risk_flags:
  - risk: “Servants” does not specify the precise legal degree of their subjugation.
    mitigation: This retains the POB’s source-driven choice without over-specifying them as slaves.
