translation:
  language: en
  text: He said to the Levites, Israel’s holy servants, “Set them apart for the Lord[a] at the place of the Lord’s holy ark, in the house built by King Solomon, son of David.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says, “Set them apart for the Lord,” but it is unclear whom “them” refers to. The Hebrew parallel instead says, “Put the holy ark in the house built by Solomon son of David, king of Israel.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Sanctify them for the Lord
  simplified_phrase: Set them apart for the Lord
  preserved_meaning: The command concerns dedicating an unclear group to the Lord for sacred service.
  reasoning_layer_used: POB lexical decisions on ἁγιάσατε, αὐτούς, and τῷ κυρίῳ
  rationale: “Set apart” explains the sacred sense of “sanctify,” while “them” preserves the Greek ambiguity.
- pob_phrase: the holy servants of Israel
  simplified_phrase: Israel’s holy servants
  preserved_meaning: The Levites are identified as Israelites devoted to sacred service.
  reasoning_layer_used: POB lexical decision on ἱεροδούλοις
  rationale: The possessive form is easier to follow without narrowing their role to temple service.
- pob_phrase: in the house that Solomon son of David the king built
  simplified_phrase: in the house built by King Solomon, son of David
  preserved_meaning: The house is the one built by Solomon, who was David’s son and king.
  reasoning_layer_used: POB lexical decisions on οἴκῳ and the relative clause
  rationale: The shorter clause retains “house,” Solomon’s title, and his descent from David.
translation_notes:
  risk_flags:
  - risk: The referent of “them” is unclear in the Greek.
    mitigation: The main text preserves the pronoun, and the footnote explains both the uncertainty and the Hebrew alternative.
  - risk: “At the place of the Lord’s holy ark” remains spatially difficult.
    mitigation: The wording stays anchored in the Greek rather than replacing it with the clearer Hebrew parallel.
