translation:
  language: en
  text: Nebuchadnezzar took some of the Lord’s sacred objects used in worship,[a] carried them away, and put them in his temple in Babylon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may be read more literally, “from the Lord’s sacred vessels,” though it probably means that he took some rather than all.
    reason: lexical_alternative
