translation:
  language: en
  text: But they mocked God’s messengers.[a] When the Lord spoke, they ridiculed his prophets. Finally, because of their ungodly deeds, he became angry with his nation and commanded the kings of the Chaldeans[b] to march against them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “his angels”; the context more likely refers to God’s human messengers, especially because they are paired with his prophets.
    reason: lexical_alternative
  - marker: b
    text: The Greek says “kings of the Chaldeans” in the plural; the Hebrew parallel in 2 Chronicles 36 emphasizes the king of Babylon, Nebuchadnezzar.
    reason: textual_variant
simplification_decisions:
- pob_phrase: they were making sport of his prophets
  simplified_phrase: they ridiculed his prophets
  preserved_meaning: They treated God’s prophets with scorn and mockery.
  reasoning_layer_used: lexical decision for ἐκπαίζοντες
  rationale: “Ridiculed” expresses the same derision in familiar modern English.
- pob_phrase: until, in his anger against his nation because of their ungodly deeds
  simplified_phrase: Finally, because of their ungodly deeds, he became angry with his nation
  preserved_meaning: Their impious acts led to God’s anger and judgment.
  reasoning_layer_used: lexical decisions for θυμῶντα and δυσσεβήματα
  rationale: Direct clause order and a new sentence make the cause and result easier to follow.
- pob_phrase: come up against them
  simplified_phrase: march against them
  preserved_meaning: The Chaldean kings were ordered to advance against the nation as an invading force.
  reasoning_layer_used: lexical decision for προστάξαι ἀναβιβάσαι
  rationale: “March against” clearly conveys the military advance.
interpretive_expansions:
- pob_phrase: his messengers
  rendering: God’s messengers
  claim: The possessive refers to God.
  evidence:
  - The messengers are paired with the Lord’s prophets in the immediate context.
  confidence: high
  alternatives_preserved:
  - his messengers
  - his angels
- pob_phrase: come up against them
  rendering: march against them
  claim: The command concerns a military advance against the nation.
  evidence:
  - The advancing parties are Chaldean kings acting as agents of judgment.
  confidence: high
  alternatives_preserved:
  - come up against them
translation_notes:
  risk_flags:
  - risk: “When” leaves open whether the Lord spoke on one occasion or more than once.
    mitigation: This preserves the Greek temporal expression without adding a habitual sense.
  - risk: Readers familiar with 2 Chronicles may expect one Babylonian king rather than several Chaldean kings.
    mitigation: The text retains the primary Greek plural, and the footnote identifies the Hebrew parallel.
