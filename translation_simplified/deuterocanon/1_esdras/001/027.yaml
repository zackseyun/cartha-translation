translation:
  language: en
  text: But he prepared himself for war against him, and on the plain of Megiddo the commanders came down against King Josiah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew parallel in 2 Chronicles 35:22 says that he disguised himself to fight against him, but the Greek says that he prepared himself for war.
    reason: alternative_reading
