translation:
  language: en
  text: He appointed Zedekiah as king over Judea[a] and Jerusalem. Zedekiah was twenty-one years old, and he ruled for eleven years.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek text has “Judea,” while the Hebrew parallel tradition commonly has “Judah.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: appointed Zedekiah king of Judea and Jerusalem
  simplified_phrase: appointed Zedekiah as king over Judea and Jerusalem
  preserved_meaning: Zedekiah was formally installed to govern Judea and Jerusalem as king.
  reasoning_layer_used: POB lexical decisions for ἀνέδειξεν and τῆς Ἰουδαίας καὶ Ἰερουσαλήμ
  rationale: Adding “as” and using “over” makes the appointment and governing relationship natural in modern English.
- pob_phrase: he reigned eleven years
  simplified_phrase: he ruled for eleven years
  preserved_meaning: His reign lasted eleven years.
  reasoning_layer_used: POB lexical decision for βασιλεύει and ἔτη ἕνδεκα
  rationale: “Ruled for” is more familiar than “reigned” while the title “king” preserves the royal sense.
translation_notes:
  risk_flags:
  - risk: “Ruled” is broader than the specifically royal verb “reigned.”
    mitigation: The preceding phrase explicitly identifies Zedekiah as king.
