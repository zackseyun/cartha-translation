translation:
  language: en
  text: Iechonias, Samaias, Nathanael his brother, Sabias, Ochielos, and Joram were commanders over thousands. They gave the Levites 1,000 sheep and 700 calves for the Passover.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The parallel account in 2 Chronicles 35:9 has different officials and numbers. This translation follows the Greek text of 1 Esdras.
    reason: textual_variant
