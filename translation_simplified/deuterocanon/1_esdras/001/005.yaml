translation:
  language: en
  text: Follow the written instructions of David king of Israel and the grand arrangement of his son Solomon.[a] Levites, take your places in the sanctuary according to your ancestral service divisions, in front of your brothers, the sons of Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “according to the greatness, majesty, or magnificence of Solomon his son.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: according to the writing of David king of Israel
  simplified_phrase: Follow the written instructions of David king of Israel
  preserved_meaning: David’s written directive governs what the Levites are to do.
  reasoning_layer_used: The lexical decision treats “writing” as a written directive, not Scripture in the later technical sense.
  rationale: A direct command states the practical force in ordinary English.
- pob_phrase: standing in the sanctuary according to your ancestral division
  simplified_phrase: Levites, take your places in the sanctuary according to your ancestral service divisions
  preserved_meaning: The Levites are to stand in sacred temple space in their lineage-based service groups.
  reasoning_layer_used: The lexical and theological decisions preserve the sanctuary and the ancestral organization clarified by the Hebrew parallel.
  rationale: The imperative-like participle and compressed organization language are recast clearly.
- pob_phrase: before your brothers, the sons of Israel
  simplified_phrase: in front of your brothers, the sons of Israel
  preserved_meaning: The Levites stand in the presence of their fellow Israelites while the familial title remains intact.
  reasoning_layer_used: The lexical and theological decisions preserve both the spatial relation and the gendered covenantal expression.
  rationale: “In front of” makes the likely spatial sense immediately clear.
interpretive_expansions:
- pob_phrase: according to the greatness of Solomon his son
  rendering: the grand arrangement of his son Solomon
  claim: In this setting, Solomon’s greatness likely refers to the grandeur or authoritative scale of his arrangement.
  evidence:
  - The POB footnote identifies Solomon’s arrangement as the likely contextual referent.
  - The immediate context concerns the ordered placement of Levites.
  confidence: moderate
  alternatives_preserved:
  - according to the greatness of Solomon his son
  - according to the majesty of Solomon his son
  - according to the magnificence of Solomon his son
translation_notes:
  risk_flags:
  - risk: “Grand arrangement” interprets a noun that can directly mean greatness, majesty, or magnificence.
    mitigation: The footnote preserves the principal lexical alternatives.
  - risk: “Take your places” gives the Greek participle imperative force.
    mitigation: The wording follows the POB rationale that the participle likely functions as an instruction here.
