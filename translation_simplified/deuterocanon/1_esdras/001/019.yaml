translation:
  language: en
  text: No king of Israel had ever celebrated a Passover like the one celebrated by Josias,[a] the priests, the Levites, the Judeans,[b] and all the Israelites living in Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Josias is the Greek form of the name Josiah.
    reason: cross_reference
  - marker: b
    text: The Judeans were the people of Judah or Judea; the term may also be translated “the Jews.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: all the kings of Israel had not kept such a Passover as
  simplified_phrase: No king of Israel had ever celebrated a Passover like
  preserved_meaning: The broad historical claim and comparison remain unchanged.
  reasoning_layer_used: Greek syntax and the lexical decision for ἤγαγον πάσχα
  rationale: The universal negative is recast naturally, and “celebrated” clearly expresses observing the Passover.
- pob_phrase: Josias kept, and the priests and the Levites and the Judeans and all Israel
  simplified_phrase: the one celebrated by Josias, the priests, the Levites, the Judeans, and all the Israelites
  preserved_meaning: Every named group remains a participant in the Passover.
  reasoning_layer_used: Source coordination and the decision to preserve πᾶς Ἰσραήλ broadly
  rationale: A single passive construction makes the coordinated participants easy to follow.
- pob_phrase: who were found dwelling in Jerusalem
  simplified_phrase: living in Jerusalem
  preserved_meaning: The Israelites in view were present there as residents or inhabitants.
  reasoning_layer_used: Lexical rationale for οἱ εὑρεθέντες and the locative phrase
  rationale: The shorter wording gives the contextual sense without the awkward literal idiom.
translation_notes:
