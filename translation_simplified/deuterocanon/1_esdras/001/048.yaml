translation:
  language: en
  text: The King of their ancestors—the God of their ancestors—sent his angel[a] to visit their people and call them back. He did this because he had compassion on them and on his dwelling place.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “messenger”; the Greek word can mean either an angel or a messenger.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek unusually gives both titles: “the King of their ancestors” and “the God of their ancestors.”'
    reason: textual_variant
simplification_decisions:
- pob_phrase: the King of their fathers, the God of their fathers
  simplified_phrase: the King of their ancestors—the God of their ancestors
  preserved_meaning: Both unusual ancestral titles for God remain distinct and in apposition.
  reasoning_layer_used: POB lexical and theological decisions on the double designation
  rationale: “Ancestors” conveys the biblical sense of “fathers” clearly in modern English.
- pob_phrase: sent by his angel to visit their people and to call them back
  simplified_phrase: sent his angel to visit their people and call them back
  preserved_meaning: God sends his angel both to intervene among the people and to summon them back.
  reasoning_layer_used: POB lexical decisions for ἀπέστειλεν, ἐπισκέψασθαι, ἄγγελος, and μετακαλέσαι
  rationale: Direct clause order improves readability while “visit” preserves the active intervention sense.
- pob_phrase: because he had compassion on them and on his dwelling place
  simplified_phrase: He did this because he had compassion on them and on his dwelling place.
  preserved_meaning: Compassion for both the people and the sacred dwelling motivates God’s action.
  reasoning_layer_used: POB lexical decisions for φείδομαι and σκῆνωμα
  rationale: A separate sentence makes the reason for God’s action easier to follow.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “visit” as only a social call.
    mitigation: The paired action “call them back” and the compassion clause indicate purposeful divine intervention.
  - risk: The unusual double title may sound repetitive.
    mitigation: The dash marks the titles as appositional, and the footnote explains the Greek wording.
