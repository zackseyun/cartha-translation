translation:
  language: en
  text: The king said to his servants[a], “Get me out of the fighting. I am very weak.” His servants immediately took him away from the battle line.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “attendants.” Here the Greek refers to the king’s personal servants, not children.
    reason: lexical_alternative
