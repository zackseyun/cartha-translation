translation:
  language: en
  text: The leaders among the people and among the priests also acted in many ungodly and lawless ways. They committed more acts of impurity than all the nations, and they defiled the Lord’s sanctuary,[a] which had been set apart as holy in Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word may refer to the sanctuary or to the temple complex more broadly.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the leaders of the people and of the priests
  simplified_phrase: the leaders among the people and among the priests
  preserved_meaning: Both lay and priestly leadership were involved.
  reasoning_layer_used: POB lexical rationale for τοῦ λαοῦ καὶ τῶν ἱερέων
  rationale: Repeated “among” clearly identifies leaders from both groups.
- pob_phrase: committed much impiety and lawlessness
  simplified_phrase: acted in many ungodly and lawless ways
  preserved_meaning: Their conduct violated both reverence for God and law.
  reasoning_layer_used: POB lexical decisions for ἠσέβησαν and ἠνόμησαν
  rationale: Common adjectives replace abstract nouns while keeping both charges distinct.
- pob_phrase: beyond all the uncleannesses of all the nations
  simplified_phrase: They committed more acts of impurity than all the nations
  preserved_meaning: Their ritual and moral impurity surpassed that of all the nations.
  reasoning_layer_used: POB lexical and theological decisions for ὑπέρ and ἀκαθαρσίαι
  rationale: The wording preserves impurity as the comparison’s category and avoids an unclear pronoun.
translation_notes:
  risk_flags:
  - risk: The broad comparison with all the nations does not specify particular offenses.
    mitigation: The wording preserves the Greek idea of surpassing without narrowing its scope.
  - risk: “Sanctuary” may sound narrower than Greek ἱερόν.
    mitigation: The footnote preserves the possible broader sense of the temple complex.
