translation:
  language: en
  text: Sacrifice the Passover in proper order.[a] Prepare the sacrifices for your brothers,[b] and observe the Passover according to the Lord’s command given to Moses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “according to rank”; this refers to an arranged order or grouping.
    reason: lexical_alternative
  - marker: b
    text: “Brothers” means fellow members of the people, not only male siblings.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: In order, sacrifice the Passover
  simplified_phrase: Sacrifice the Passover in proper order
  preserved_meaning: The sacrifice must be carried out in an orderly arrangement.
  reasoning_layer_used: POB lexical decision for ἐν τάξει and the Hebrew parallel
  rationale: Moving the phrase after the verb makes its connection to the command immediately clear.
- pob_phrase: keep the Passover
  simplified_phrase: observe the Passover
  preserved_meaning: They must carry out the formal Passover observance.
  reasoning_layer_used: POB lexical decision for ποιήσατε τὸ πάσχα
  rationale: “Observe” is familiar modern wording for carrying out a religious practice.
- pob_phrase: the command of the Lord that was given to Moses
  simplified_phrase: the Lord’s command given to Moses
  preserved_meaning: The Passover must follow the Lord’s authoritative command received by Moses.
  reasoning_layer_used: POB lexical decisions for πρόσταγμα, κύριος, and τὸ δοθὲν τῷ Μωυσῇ
  rationale: The shorter passive phrase remains natural without naming the unstated agent of “given.”
translation_notes:
  risk_flags:
  - risk: The first “Passover” may refer specifically to the sacrificial victim, while the second refers to the observance.
    mitigation: The distinct verbs “sacrifice” and “observe” preserve this difference without narrowing the noun.
