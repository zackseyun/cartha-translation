simplification_decisions:
- pob_phrase: made Joakim his brother king
  simplified_phrase: appointed Joakim, Joachaz’s brother, as king
  preserved_meaning: The Egyptian king caused Joakim to assume the office of king, and Joakim was Joachaz’s brother.
  reasoning_layer_used: The lexical decision for ἀνέδειξεν permits “appointed,” while the immediate narrative identifies the brother as Joachaz.
  rationale: This wording clearly states the official action and prevents the wrong kinship attachment.
interpretive_expansions:
