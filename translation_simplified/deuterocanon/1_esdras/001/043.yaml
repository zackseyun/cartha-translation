translation:
  language: en
  text: A year later, Nebuchadnezzar sent men to take him away to Babylon, along with the Lord’s holy temple objects.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And after a year
  simplified_phrase: A year later
  preserved_meaning: One year passed before the next event.
  reasoning_layer_used: POB lexical decision for μετ᾽ ἐνιαυτόν
  rationale: The approved alternative gives the same time sequence in smoother narrative English.
- pob_phrase: sent and brought him away to Babylon
  simplified_phrase: sent men to take him away to Babylon
  preserved_meaning: Nebuchadnezzar caused the man to be removed to Babylon by people he sent.
  reasoning_layer_used: POB lexical decisions for ἀποστείλας and μετήγαγεν
  rationale: This recasts the Greek sequence into natural English without weakening the force of removal.
- pob_phrase: the holy vessels of the Lord
  simplified_phrase: the Lord’s holy temple objects
  preserved_meaning: The sacred implements belonging to the Lord were taken with him.
  reasoning_layer_used: POB lexical decisions for τοῖς ἱεροῖς σκεύεσιν and τοῦ κυρίου
  rationale: Temple objects explains the ritual sense of vessels while retaining holiness and divine ownership.
interpretive_expansions:
- pob_phrase: sent
  rendering: sent men
  claim: Nebuchadnezzar acted through people he dispatched.
  evidence:
  - The Greek participle ἀποστείλας describes sending before the removal.
  - The POB rationale notes “sent men and” as an allowed alternative.
  confidence: high
- pob_phrase: holy vessels
  rendering: holy temple objects
  claim: The vessels were sacred objects associated with the temple.
  evidence:
  - The POB lexical rationale identifies σκεύη as vessels or implements.
  - The POB lists “temple vessels” as contextually true.
  confidence: high
translation_notes:
  risk_flags:
  - risk: “Sent men” makes the implicit agents explicit.
    mitigation: The POB lexical audit expressly recognizes this rendering, and the action requires dispatched agents.
  - risk: “Temple objects” is broader than the literal word “vessels.”
    mitigation: The wording preserves their sacred status and follows the POB’s contextually supported temple sense.
