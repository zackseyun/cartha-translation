translation:
  language: en
  text: These gifts came from the king’s property, as promised, and were given to the people, the priests, and the Levites. Helkias, Zechariah, and Esyelos[a], the officials in charge of the sanctuary, gave the priests 2,600 sheep[b] and 300 calves for the Passover.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew parallel in 2 Chronicles 35:8 uses related Hebrew forms, commonly rendered “Hilkiah” and “Jehiel,” but the Greek text here reads “Helkias” and “Esyelos.”
    reason: alternative_reading
  - marker: b
    text: The Hebrew parallel specifies sheep, lambs, and young goats, while the Greek text here uses the broader word “sheep.”
    reason: lexical_alternative
