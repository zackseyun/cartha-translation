  reasoning_layer_used: POB lexical decision for μετʼ αὐτὸν
  rationale: “Then” states the sequence naturally in modern English.
- pob_phrase: bound him with bronze chains
  simplified_phrase: put the king in bronze chains
  preserved_meaning: Nebuchadnezzar restrained the preceding king with bronze bonds.
  reasoning_layer_used: POB lexical decisions for ἔδησεν and ἐν χαλκεῖς δεσμοῖς
  rationale: The wording is direct, and “the king” clarifies the pronoun.
- pob_phrase: carried him away to Babylon
