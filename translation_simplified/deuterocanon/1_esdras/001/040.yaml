translation:
  language: en
  text: The recorded accounts about him,[a] including his moral impurity and his irreverence toward God, are written in the royal chronicles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the things reported about him.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: concerning him
  simplified_phrase: about him
  preserved_meaning: The accounts concern the same king.
  reasoning_layer_used: POB translation and lexical decision for ἱστορηθέντα
  rationale: “About him” states the relationship in ordinary English.
- pob_phrase: uncleanness and impiety
  simplified_phrase: moral impurity and his irreverence toward God
  preserved_meaning: The two distinct moral-religious charges remain separate.
  reasoning_layer_used: POB lexical and theological decisions for ἀκαθαρσίας and δυσσεβείας
  rationale: The wording clarifies both charges without reducing them to general wickedness.
- pob_phrase: the book of the chronicles of the kings
  simplified_phrase: the royal chronicles
  preserved_meaning: The information remains written in the kings’ official historical record.
  reasoning_layer_used: POB lexical decision for βίβλῳ τῶν χρόνων τῶν βασιλέων
  rationale: “Royal chronicles” expresses the archival formula concisely.
interpretive_expansions:
- pob_phrase: uncleanness
  rendering: moral impurity
  claim: The uncleanness here is a condemnatory moral-religious characterization, not merely physical dirtiness.
  evidence:
  - The POB rationale identifies moral-religious force and rejects limiting the term to ritual impurity.
  confidence: high
  alternatives_preserved:
  - impurity
  - defilement
- pob_phrase: impiety
  rendering: irreverence toward God
  claim: The charge concerns a lack of proper reverence toward God.
  evidence:
  - The POB lexical rationale defines the term as irreverence or lack of piety toward God.
  confidence: high
  alternatives_preserved:
  - ungodliness
  - impiety
translation_notes:
  risk_flags:
  - risk: “Royal chronicles” compresses the fuller archival title.
    mitigation: The phrase retains both the royal setting and the documentary character.
  - risk: “Recorded accounts” may sound more documentary than the possible sense “things reported.”
    mitigation: The footnote preserves the lexical alternative.
