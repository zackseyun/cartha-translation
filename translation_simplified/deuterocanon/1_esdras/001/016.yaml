translation:
  language: en
  text: That day, everything involved in the Lord’s sacrifice was completed. The Passover was offered, and the sacrifices were brought onto the Lord’s altar, as King Josias commanded.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Josias is the Greek form of the name called Josiah in the Hebrew parallel.
    reason: alternative_reading
