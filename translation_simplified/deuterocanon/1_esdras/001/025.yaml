translation:
  language: en
  text: “The Lord God sent me against you, did he not? My war is at the Euphrates River.[a] The Lord is with me now; the Lord is with me, urging me forward. Stand aside, and do not oppose the Lord.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “on the Euphrates” or “by the Euphrates.” The phrase identifies the location of the campaign.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Was I not sent against you by the Lord God?
  simplified_phrase: The Lord God sent me against you, did he not?
  preserved_meaning: Neco asks a rhetorical question claiming that the Lord God commissioned him against Josiah.
  reasoning_layer_used: POB lexical decisions for οὐχὶ, πρὸς σὲ, and ἐξαπέσταλμαι
  rationale: The tag question makes the expected positive answer easy to recognize.
- pob_phrase: For my war is on the Euphrates
  simplified_phrase: My war is at the Euphrates River.
  preserved_meaning: Neco identifies the Euphrates as the location of his campaign.
  reasoning_layer_used: POB lexical rationale and geographic footnote
  rationale: “At” is a supported alternative, while “River” clarifies the geographic name.
- pob_phrase: and now the Lord is with me, and the Lord is with me, urging me on
  simplified_phrase: The Lord is with me now; the Lord is with me, urging me forward.
  preserved_meaning: Neco repeats his claim that the Lord supports him and is pressing his campaign forward.
  reasoning_layer_used: POB lexical and theological decisions for μετʼ ἐμοῦ, ἐπισπεύδων, and κύριος
  rationale: A semicolon makes the repeated divine-support claim clear without removing its emphasis.
translation_notes:
  risk_flags:
  - risk: The claim that the Lord commissioned Neco remains the speaker’s claim rather than a resolved theological judgment.
    mitigation: The wording preserves Neco’s claim without adding an endorsement or identifying another deity.
  - risk: “At” selects one of several supported ways to locate the campaign.
    mitigation: The footnote preserves “on” and “by” as lexical alternatives.
