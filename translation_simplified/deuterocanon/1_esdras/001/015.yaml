translation:
  language: en
  text: The gatekeepers were stationed at every gate. None of them could leave their appointed duty, because their fellow Levites had made the necessary preparations for them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek literally says, “the Levites had prepared for themselves.” The context likely means that the Levites prepared what the gatekeepers needed so they could remain at their posts.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And the gatekeepers were at each gate
  simplified_phrase: The gatekeepers were stationed at every gate
  preserved_meaning: Gatekeepers were serving at their respective temple gates.
  reasoning_layer_used: POB lexical decisions for θυρωροὶ and ἐφʼ ἑκάστου πυλῶνος
  rationale: “Were stationed” makes their assigned service clear in natural English.
- pob_phrase: no one could leave his own appointed duty
  simplified_phrase: None of them could leave their appointed duty
  preserved_meaning: Each gatekeeper had to remain at his assigned service.
  reasoning_layer_used: POB lexical decision for παραβῆναι and ἐφημερία
  rationale: The plural wording is smoother while retaining the force of an official duty that could not be abandoned.
- pob_phrase: their brothers the Levites had prepared for them
  simplified_phrase: their fellow Levites had made the necessary preparations for them
  preserved_meaning: Other members of their Levitical group prepared what the gatekeepers needed.
  reasoning_layer_used: POB lexical and theological decisions on ἀδελφοὶ and ἡτοίμασαν ἑαυτοῖς
  rationale: “Fellow Levites” naturally conveys the corporate relationship, and “necessary preparations” clarifies the practical action.
interpretive_expansions:
- pob_phrase: had prepared for them
  rendering: had made the necessary preparations for them
  claim: The Levites prepared what was needed so the gatekeepers could remain on duty.
  evidence:
  - The sentence links the Levites’ preparation with the gatekeepers’ inability to leave.
  - The POB theological decision adopts this contextual sense.
  confidence: moderate
  alternatives_preserved:
  - The Levites prepared for themselves.
translation_notes:
  risk_flags:
  - risk: The Greek reflexive pronoun can literally mean that the Levites prepared for themselves.
    mitigation: The main text follows the POB contextual reading while the footnote preserves the literal alternative.
