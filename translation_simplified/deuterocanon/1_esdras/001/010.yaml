translation:
  language: en
  text: After all this was done, the priests and Levites took their places in proper order before the people. Holding the unleavened bread, they were grouped by tribe and by the family divisions of their fathers.[a] They offered it to the Lord as written in the book of Moses.[b] They did all this in the morning.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “by their ancestral households” or “by their fathers’ houses.”
    reason: lexical_alternative
  - marker: b
    text: The Greek differs notably here from the parallel account in 2 Chronicles 35:10, which describes Levite leaders providing Passover animals. This translation follows the Greek text of 1 Esdras.
    reason: textual_variant
simplification_decisions:
- pob_phrase: when these things had taken place
  simplified_phrase: After all this was done
  preserved_meaning: The arrangements described earlier were completed before this action began.
  reasoning_layer_used: POB translation and immediate context
  rationale: The shorter wording expresses the same sequence in ordinary English.
- pob_phrase: stood in proper order ... according to the tribes and according to the family divisions of the fathers
  simplified_phrase: took their places in proper order ... grouped by tribe and by the family divisions of their fathers
  preserved_meaning: The priests and Levites stood in an organized ceremonial arrangement based on tribal and paternal family groups.
  reasoning_layer_used: POB lexical decisions for εὐπρεπῶς, φυλάς, μεριδαρχίας, and τῶν πατέρων
  rationale: The rewrite makes the organization clear while retaining the source’s paternal household language.
- pob_phrase: to offer to the Lord according to what is written in the book of Moses; and so they did in the morning
  simplified_phrase: They offered it to the Lord as written in the book of Moses. They did all this in the morning.
  preserved_meaning: Their offering followed written Mosaic authority and took place in the morning.
  reasoning_layer_used: POB lexical decisions for προσενεγκεῖν and τὸ πρωϊνόν
  rationale: Two direct sentences clarify the action, its authority, and its time without calling it a technical morning offering.
