translation:
  language: en
  text: He did what was evil in the Lord’s sight. He felt no shame because of the words Jeremiah the prophet spoke—words that came from the mouth of the Lord.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew parallel says that he did not humble himself, but the Greek here says that he felt no shame or embarrassment.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: did what was evil before the Lord
  simplified_phrase: did what was evil in the Lord’s sight
  preserved_meaning: His conduct was evil as judged by the Lord.
  reasoning_layer_used: Lexical decision for ἐνώπιον Κυρίου
  rationale: “In the Lord’s sight” makes the judicial sense of “before” immediately clear.
- pob_phrase: he was not ashamed at the words spoken
  simplified_phrase: He felt no shame because of the words
  preserved_meaning: The prophetic warning did not move him to shame.
  reasoning_layer_used: Lexical and theological decisions for οὐκ ἐνετράπη ἀπό
  rationale: The active wording is more natural while retaining the Greek emphasis on lack of shame.
- pob_phrase: the words spoken by Jeremiah the prophet from the mouth of the Lord
  simplified_phrase: the words Jeremiah the prophet spoke—words that came from the mouth of the Lord
  preserved_meaning: Jeremiah delivered words directly originating from the Lord.
  reasoning_layer_used: Lexical decisions for the agent phrase and prophetic formula
  rationale: The clause is recast to clarify who spoke while preserving the vivid image of the Lord’s mouth.
translation_notes:
  risk_flags:
  - risk: “Felt no shame” may sound limited to inward emotion rather than a failed response to warning.
    mitigation: The causal phrase and retained prophetic context show that the Lord’s words should have moved him to shame.
  - risk: The Hebrew parallel describes failure to humble himself rather than lack of shame.
    mitigation: The main text follows the primary Greek witness, and the footnote preserves the Hebrew alternative.
