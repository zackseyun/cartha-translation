translation:
  language: en
  text: You will not have to carry the ark on your shoulders. Now serve the Lord your God and serve his people Israel. Prepare yourselves by your ancestral family groups and service divisions.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek has “tribes,” but the Hebrew parallel indicates organized service divisions.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: it
  simplified_phrase: the ark
  preserved_meaning: The object they no longer need to carry is the ark.
  reasoning_layer_used: POB footnote and lexical decision on αὐτήν
  rationale: Naming the implied object prevents confusion without changing the instruction.
- pob_phrase: minister to his people Israel
  simplified_phrase: serve his people Israel
  preserved_meaning: Their service to Israel remains distinct from their sacred service to God.
  reasoning_layer_used: POB lexical and theological decisions on θεραπεύετε
  rationale: “Serve” is familiar English and avoids suggesting a broader caregiving role.
- pob_phrase: by your fathers' houses and your divisions
  simplified_phrase: by your ancestral family groups and service divisions
  preserved_meaning: They must prepare according to inherited family units and organized service groups.
  reasoning_layer_used: POB lexical decisions and MT parallel
  rationale: The wording explains both ancient organizational terms while keeping them distinct.
interpretive_expansions:
- pob_phrase: it
  rendering: the ark
  claim: The implied object is the ark.
  evidence:
  - The POB footnote identifies the ark from the surrounding context.
  confidence: high
- pob_phrase: your divisions
  rendering: service divisions
  claim: The divisions are organized groups for service rather than ethnic tribes.
  evidence:
  - The POB reasoning uses the Hebrew parallel to identify an organizational sense.
  - The immediate context concerns preparation for Levitical service.
  confidence: moderate
  alternatives_preserved:
  - tribes
translation_notes:
  risk_flags:
  - risk: Repeating “serve” may obscure that the Greek uses two different verbs.
    mitigation: The different objects preserve the contrast, and the wording avoids adding an unsupported pastoral nuance.
  - risk: The Greek can be read as “tribes” rather than “service divisions.”
    mitigation: The footnote preserves that alternative while the main text follows POB’s chosen reading.
