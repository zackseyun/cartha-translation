translation:
  language: en
  text: He[a] bound Jehoiakim’s nobles. Then he seized Zarius, his brother[b], and brought him up from Egypt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says only “he.” The surrounding account indicates that this was the king of Egypt, not Jehoiakim.
    reason: alternative_reading
  - marker: b
    text: The Greek says “his brother,” but the compressed wording does not clearly identify whose brother Zarius was.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: And he bound Jehoiakim’s nobles
  simplified_phrase: He bound Jehoiakim’s nobles.
  preserved_meaning: The unnamed ruler physically restrained Jehoiakim’s leading men.
  reasoning_layer_used: Greek lexical decision and theological decision on the compressed subject
  rationale: A separate sentence clarifies the action while retaining the concrete image and unnamed subject.
- pob_phrase: and after seizing Zarius his brother, he brought him up from Egypt
  simplified_phrase: Then he seized Zarius, his brother, and brought him up from Egypt.
  preserved_meaning: The ruler seized Zarius before bringing him upward from Egypt.
  reasoning_layer_used: Greek participial sequence and directional lexical decision
  rationale: “Then” gives the sequence in ordinary English while preserving the upward-movement language.
translation_notes:
  risk_flags:
  - risk: Readers could mistake Jehoiakim for the actor identified as “he.”
    mitigation: Footnote a identifies the likely Egyptian subject without expanding the compressed main text.
  - risk: Readers could assume Zarius was the Egyptian king’s brother.
    mitigation: Footnote b explicitly preserves the Greek wording’s unclear antecedent.
