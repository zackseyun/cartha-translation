translation:
  language: en
  text: May all who do evil to your slaves[a] be put to shame. May they be disgraced in all their power[b], and may their strength be broken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “your servants.” “Slaves” emphasizes that they belong wholly to God.
    reason: alternative_reading
  - marker: b
    text: Literally, “from all their dominion.” The Greek may also be understood as “despite all their dominion.”
    reason: lexical_alternative
simplification_decisions:
