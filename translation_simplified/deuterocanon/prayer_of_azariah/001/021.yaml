  simplified_phrase: May all who do evil to your slaves be put to shame
  preserved_meaning: The prayer asks that those who act wickedly toward God's people suffer public shame.
  reasoning_layer_used: Lexical decisions for ἐντραπείησαν, οἱ ἐνδεικνύμενοι, κακά, and τοῖς δούλοις σου
  rationale: “May” clearly marks a prayer, and “do evil” expresses hostile action in ordinary English.
- pob_phrase: let them be disgraced from all their dominion
  simplified_phrase: May they be disgraced in all their power
  preserved_meaning: Their ruling power is the sphere in which their disgrace is complete.
  reasoning_layer_used: Lexical decision and POB footnote for ἀπὸ πάσης τῆς δυναστείας
  rationale: “In all their power” uses a documented reading while the footnote preserves the Greek wording and remaining ambiguity.
- pob_phrase: let their strength be broken
