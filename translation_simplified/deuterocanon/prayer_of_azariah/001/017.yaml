translation:
  language: en
  text: May our sacrifice today stand before you like whole burnt offerings of rams and bulls, and like tens of thousands of fat lambs. May it make atonement in your presence,[a] for those who have put their trust in you will not be put to shame. May it be brought to completion before you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek phrase is unusual and can literally mean “behind you”; here it means “before you” or “in your presence.” Some also translate the preceding request, “May it be accepted before you.”
    reason: lexical_alternative
