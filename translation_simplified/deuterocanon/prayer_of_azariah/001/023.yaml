translation:
  language: en
  text: The king’s attendants who had thrown them in kept the furnace burning by feeding it with flammable petroleum-like fuel,[a] tar-like pitch, fibrous fuel, and brushwood.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek term is often translated “naphtha” or “bitumen.”
    reason: lexical_alternative
  - marker: b
    text: The brushwood may have been cut vine branches.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: did not stop feeding the furnace ... keeping it burning
  simplified_phrase: kept the furnace burning by feeding it
  preserved_meaning: The attendants continually added fuel so the furnace remained burning.
  reasoning_layer_used: POB lexical decisions for οὐ διέλειπον and καίοντες τὴν κάμινον
  rationale: The recast sentence clearly states both the repeated fueling and its result.
- pob_phrase: naphtha and pitch
  simplified_phrase: flammable petroleum-like fuel and tar-like pitch
  preserved_meaning: The attendants used two distinct combustible substances.
  reasoning_layer_used: POB lexical decisions and footnote for ἀφθάλτῳ and πίσσῃ
  rationale: The descriptions explain unfamiliar fuels without merging them.
- pob_phrase: tow and brushwood
  simplified_phrase: fibrous fuel and brushwood
  preserved_meaning: The fuel also included combustible fibers and cut woody material.
  reasoning_layer_used: POB lexical decisions for στιππύῳ and κληματίδα
  rationale: “Fibrous fuel” explains “tow” without implying that it was used to start the fire.
translation_notes:
