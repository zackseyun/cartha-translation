simplification_decisions:
- pob_phrase: stood and prayed thus
  simplified_phrase: stood up and prayed as follows
  preserved_meaning: Azariah stands and introduces the prayer that follows.
  reasoning_layer_used: Lexical decisions for στὰς, προσηύξατο, and οὕτως
  rationale: “As follows” clearly introduces the coming words without adding that he merely began to pray.
- pob_phrase: opening his mouth he gave thanks to the Lord together with his companions
  simplified_phrase: He opened his mouth and, together with his companions, confessed to the Lord
  preserved_meaning: The solemn speech image, shared participation, and contextually supported confession to God remain distinct.
  reasoning_layer_used: Lexical and theological decisions for ἀνοίξας τὸ στόμα, ἐξωμολογεῖτο, and ἅμα τοῖς συνεταίροις
  rationale: A separate sentence and ordinary clause order make the action easier to follow.
- pob_phrase: while the furnace was being intensely heated by the Chaldeans
  simplified_phrase: Meanwhile, the Chaldeans were making the furnace burn fiercely
  preserved_meaning: The Chaldeans continue actively heating the furnace to an extreme degree.
  reasoning_layer_used: Lexical decisions for ὑποκαιομένης, ὑπὸ τῶν Χαλδαίων, and σφόδρα
  rationale: The active construction plainly identifies who was heating the furnace.
translation_notes:
  risk_flags:
