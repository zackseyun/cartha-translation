translation:
  language: en
  text: 'Then Azariah stood up and prayed as follows. He opened his mouth and, together with his companions, confessed[a] to the Lord in the middle of the fire. Meanwhile, the Chaldeans were making the furnace burn fiercely. Then they said:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “gave thanks” or “praised.”
