translation:
  language: en
  text: Heavens, bless the Lord! Sing praise to him and honor him greatly forever.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: O heavens
  simplified_phrase: Heavens
  preserved_meaning: The heavens are directly addressed as participants in the hymn.
  reasoning_layer_used: Lexical decision for οὐρανοί
  rationale: Dropping “O” makes the direct address natural today while retaining its poetic force.
- pob_phrase: highly exalt him
  simplified_phrase: honor him greatly
  preserved_meaning: The heavens are commanded to give God intensified exaltation and praise.
  reasoning_layer_used: Lexical decision for ὑπερυψοῦτε and grounding review
  rationale: This wording makes the act of worship clear and avoids suggesting that God is physically lifted.
translation_notes:
  risk_flags:
  - risk: “Honor” is less directly tied to the traditional term “exalt.”
    mitigation: “Greatly” preserves the verb’s intensified force, while the surrounding commands establish its worship setting.
