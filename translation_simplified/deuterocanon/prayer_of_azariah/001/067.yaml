  preserved_meaning: The worshipers are commanded both to sing praise and to express thanks.
  reasoning_layer_used: POB lexical decisions on ὑμνεῖτε and ἐξομολογεῖσθε
  rationale: Adding the clear pronoun objects produces natural English without merging the two commands.
- pob_phrase: for his mercy is forever, even forever and ever
