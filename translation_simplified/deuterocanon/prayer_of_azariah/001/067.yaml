- pob_phrase: Bless the Lord, all you who fear the Lord, the God of gods
  simplified_phrase: All you who fear the Lord, bless him—the God of gods.
  preserved_meaning: Those devoted to the Lord are commanded to bless him as supreme over all gods.
  reasoning_layer_used: POB lexical and theological decisions on σεβόμενοι and θεὸν τῶν θεῶν
  rationale: Reordering the address and command makes the sentence easier to follow while retaining both biblical titles.
- pob_phrase: sing praise and give thanks
