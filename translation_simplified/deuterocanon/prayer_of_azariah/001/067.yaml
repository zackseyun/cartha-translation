  preserved_meaning: The Lord’s mercy continues eternally with climactic emphasis.
  reasoning_layer_used: POB lexical decisions on ἔλεος and the doubled eternal idiom
  rationale: “Lasts” states the enduring sense plainly while preserving the repeated forever refrain.
