translation:
  language: en
  text: All you who fear the Lord[a], bless him—the God of gods. Sing praise to him and give him thanks, because his mercy lasts forever[b], forever and ever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “fear” means to revere and worship the Lord.
    reason: lexical_alternative
  - marker: b
    text: Or “his steadfast love endures forever.”
    reason: lexical_alternative
