simplification_decisions:
- pob_phrase: And you have executed true judgments in all that you have brought upon us
  simplified_phrase: You carried out true judgments in everything you brought on us
  preserved_meaning: God imposed judgments that were true, including what came upon the speakers.
  reasoning_layer_used: Lexical decisions for κρίματα, ἐποίησας, and ἐπάγω
  rationale: “Carried out” and “brought on” express the judicial action in more familiar English.
- pob_phrase: Jerusalem, the city of our fathers
  simplified_phrase: Jerusalem, your holy city, the city of our ancestors
  preserved_meaning: Jerusalem is both God's holy city and the ancestral city of the speakers.
  reasoning_layer_used: Lexical decisions for πόλιν σου τὴν ἁγίαν and τὴν τῶν πατέρων ἡμῶν Ἰερουσαλήμ
  rationale: “Ancestors” communicates the historical family relationship more clearly than “fathers.”
- pob_phrase: for in truth and judgment you have done all these things because of our sins
  simplified_phrase: You did all these things in truth and judgment because of our sins
  preserved_meaning: God acted according to truth and judgment in response to the people's sins.
  reasoning_layer_used: Lexical and theological decisions preserving repeated judicial language
  rationale: A new sentence removes the formal connector while keeping the confession and its cause clear.
