translation:
  language: en
  text: Hananiah, Azariah, and Mishael, bless the Lord. Sing his praise and exalt him greatly forever. He has delivered us from Hades,[a] saved us from the hand of death, rescued us from within the blazing flame, and redeemed us from the fire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “from the grave.” The Greek says “from Hades,” the realm of the dead.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Bless the Lord, Hananiah, Azariah, and Mishael
  simplified_phrase: Hananiah, Azariah, and Mishael, bless the Lord
  preserved_meaning: The three named men are commanded to bless the Lord.
  reasoning_layer_used: Greek syntax and lexical decision for εὐλογεῖτε
  rationale: Moving the names first makes the people being addressed immediately clear.
- pob_phrase: sing praise to him and highly exalt him forever
  simplified_phrase: Sing his praise and exalt him greatly forever
  preserved_meaning: They must praise the Lord in song and exalt him with intensified force forever.
  reasoning_layer_used: Lexical decisions for ὑμνεῖτε, ὑπερυψοῦτε, and εἰς τοὺς αἰῶνας
  rationale: The rewrite keeps the musical praise, strong exaltation, and endless duration in natural English.
- pob_phrase: rescued us from the midst of the burning flame
  simplified_phrase: rescued us from within the blazing flame
  preserved_meaning: God rescued them while they were surrounded by the flame itself.
  reasoning_layer_used: Lexical rationale for ἐκ μέσου καιομένης φλογός
  rationale: “From within” states their location plainly while preserving the image of rescue out of the flame.
translation_notes:
  risk_flags:
  - risk: Modern readers may associate Hades only with a place of punishment.
    mitigation: The footnote identifies it more broadly as the realm of the dead and preserves “the grave” as an alternative.
  - risk: “Redeemed” may sound more theological than the immediate physical rescue.
    mitigation: The term is retained because the POB audit identifies redemptive overtones in λυτρόω while the fire context keeps the concrete sense clear.
