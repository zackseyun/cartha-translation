  text: He became very angry. Then he summoned all the rulers of Moab, the generals of Ammon, and all the provincial governors[a] of the coastal region.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek term is “satraps,” officials who governed provinces in a Persian-style administration.
    reason: cultural_note
