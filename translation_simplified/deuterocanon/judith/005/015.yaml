translation:
  language: en
  text: They settled in Amorite territory. By their strength, they destroyed all the people of Heshbon. Then they crossed the Jordan and took possession of the entire hill country.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also be translated “inherited the entire hill country,” but here it describes taking possession of the territory.
    reason: lexical_alternative
