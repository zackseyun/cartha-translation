  text: They left the worship practices of their ancestors and worshiped the God of heaven, the God they had come to know.[a] They were driven away from their gods,[b] and fled to Mesopotamia, where they lived as foreigners for a long time.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the God they had recognized.” The Greek can refer to decisive recognition as well as coming to know someone.
    reason: lexical_alternative
  - marker: b
    text: The Greek is compressed here; their expulsion was connected with the gods they had formerly worshiped.
    reason: alternative_reading
