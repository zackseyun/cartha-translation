translation:
  language: en
  text: But when they turned away from the way of life God had set for them, they were utterly destroyed on a vast scale in many wars. They were taken captive to a land that was not their own. The temple of their God was leveled to the ground, and their enemies seized their cities.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the path that he had appointed for them
  simplified_phrase: the way of life God had set for them
  preserved_meaning: They abandoned the course of conduct God had prescribed for them.
  reasoning_layer_used: POB lexical decisions for ἀπέστησαν, ὁδοῦ, and διέθετο
  rationale: This clarifies the figurative path and its divine source while preserving the image of a way.
- pob_phrase: were utterly destroyed in many wars, to a very great extent
  simplified_phrase: were utterly destroyed on a vast scale in many wars
  preserved_meaning: The wars brought intensive destruction of exceptionally great extent.
  reasoning_layer_used: POB lexical decisions for ἐξωλεθρεύθησαν and ἐπὶ πολὺ σφόδρα
  rationale: This retains “utterly destroyed” and expresses the separate intensifier in natural English.
- pob_phrase: the temple of their God was laid level with the ground, and their cities were seized by their adversaries
  simplified_phrase: The temple of their God was leveled to the ground, and their enemies seized their cities
  preserved_meaning: The temple was demolished to ground level, and hostile forces took the cities.
  reasoning_layer_used: POB lexical decisions for ἐγενήθη εἰς ἔδαφος, ἐκρατήθησαν, and ὑπεναντίων
  rationale: The recast sentence keeps the demolition image and identifies the adversaries in ordinary English.
interpretive_expansions:
- pob_phrase: the path that he had appointed for them
  rendering: the way of life God had set for them
  claim: The path means a God-given course of conduct, and “he” refers to God.
  evidence:
  - The POB lexical rationale identifies ὁδοῦ as a figurative course of life or conduct.
  - The POB reasoning identifies this way as appointed by God.
  confidence: high
  alternatives_preserved:
  - path
  - way
translation_notes:
  risk_flags:
  - risk: “On a vast scale” may be understood as extent rather than severity.
    mitigation: “Utterly destroyed” independently preserves the intensive force of the destruction verb.
  - risk: The active clause “their enemies seized” makes the hostile agents more direct than the Greek passive.
    mitigation: The source names the adversaries, and the wording does not add divine agency.
