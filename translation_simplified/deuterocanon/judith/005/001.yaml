translation:
  language: en
  text: Holofernes, commander-in-chief of Assyria’s forces, was told that the Israelites had prepared for war. They had blocked the roads through the hill country, fortified every high mountain peak, and set up obstacles on the plains.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The obstacles may have been traps or barricades; the Greek does not specify their exact form.
    reason: lexical_alternative
