translation:
  language: en
  text: “Now then, lord and master, if there is wrongdoing[a] among these people and they are sinning against their God, and if we confirm that this stumbling block is among them, then we will march up and wage war against them.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word may also mean an error or an unwitting sin.
    reason: lexical_alternative
