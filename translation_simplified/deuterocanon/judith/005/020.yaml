  preserved_meaning: The emphatic double address to Holofernes remains distinct from a divine title.
  reasoning_layer_used: lexical and theological decisions
  rationale: Natural English word order preserves both titles without suggesting that Holofernes is God.
- pob_phrase: if we ascertain that this stumbling block is among them
  simplified_phrase: if we confirm that this stumbling block is among them
  preserved_meaning: They must determine that the cause of downfall is present among the people.
  reasoning_layer_used: lexical decision for ἐπισκεψόμεθα and σκάνδαλον
  rationale: “Confirm” is clearer than “ascertain,” while “stumbling block” preserves the source image.
- pob_phrase: we will go up and make war against them
  simplified_phrase: we will march up and wage war against them
  preserved_meaning: They will advance in organized military action against the people.
  reasoning_layer_used: lexical decisions for ἀναβησόμεθα and ἐκπολεμήσομεν
  rationale: The wording makes the military setting clear while retaining the upward movement.
