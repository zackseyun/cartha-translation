translation:
  language: en
  text: But if their nation is not acting lawlessly, pass them by, my lord.[a] Otherwise, their Lord and their God may defend them, and we will be disgraced before the whole world.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek literally says “let the lord pass by”; here “my lord” is a respectful address to Holofernes, not a reference to God.
    reason: lexical_alternative
