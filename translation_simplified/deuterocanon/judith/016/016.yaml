translation:
  language: en
  text: Every sacrifice offered as a pleasing aroma is a small thing. All the fat for an offering completely burned for you is worth very little. But whoever fears the Lord is great forever.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “is always great”; the Greek can express either continual duration or enduring permanence.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: every sacrifice for a pleasing aroma
  simplified_phrase: every sacrifice offered as a pleasing aroma
  preserved_meaning: The sacrifice is presented as an acceptable, pleasing aroma.
  reasoning_layer_used: Lexical decision for εἰς ὀσμὴν εὐωδίας
  rationale: Adding “offered” makes the sacrificial expression natural without assigning this clause an explicit recipient.
- pob_phrase: all fat for your whole burnt offering
  simplified_phrase: all the fat for an offering completely burned for you
  preserved_meaning: The sacrificial fat is for an offering wholly consumed by fire for God.
  reasoning_layer_used: Lexical decisions for στέαρ, ὁλοκαύτωμα, and σοι
  rationale: This explains the ritual term while preserving both the fat’s relation to the offering and God as recipient.
- pob_phrase: the one who fears the Lord is great forever
  simplified_phrase: whoever fears the Lord is great forever
  preserved_meaning: Anyone who fears the Lord has enduring greatness in contrast to the offerings.
  reasoning_layer_used: Lexical and theological decisions on the God-fearer and sacrificial contrast
  rationale: “Whoever” expresses the general truth naturally without weakening the contrast.
interpretive_expansions:
- pob_phrase: your whole burnt offering
  rendering: an offering completely burned for you
  claim: A whole burnt offering is entirely consumed by fire and presented to God.
  evidence:
  - The lexical rationale says ὁλοκαύτωμα denotes an offering wholly consumed by fire.
  - The dative σοι addresses God as the recipient in this clause.
  confidence: high
  alternatives_preserved:
  - whole burnt offering
  - burnt offering
translation_notes:
  risk_flags:
  - risk: “Worth very little” could sound like a rejection of sacrifice itself.
    mitigation: The comparative wording does not call sacrifice worthless and retains the contrast with the God-fearer.
  - risk: “Forever” may overstate διὰ παντός if it means continual time.
    mitigation: The footnote preserves “always” as the documented alternative.
