translation:
  language: en
  text: Their mighty one was not brought down by young men. Sons of Titans did not strike him down, and tall giants did not attack him. Instead, Judith, the daughter of Merari, made him powerless[a] with the beauty of her face.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “paralyzed him”; the Greek can mean making someone powerless or disabled, literally or figuratively.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: did not fall by the hands of young men
  simplified_phrase: was not brought down by young men
  preserved_meaning: Young men were not the ones who defeated him.
  reasoning_layer_used: POB lexical decision for νεανίσκων and immediate context
  rationale: The passive wording states the same contrast in more natural English.
- pob_phrase: nor did sons of Titans strike him, nor did tall giants set upon him
  simplified_phrase: Sons of Titans did not strike him down, and tall giants did not attack him
  preserved_meaning: Even mythic or superhuman opponents did not overcome him.
  reasoning_layer_used: POB lexical and theological decisions on mythic language
  rationale: The revision keeps both vivid images while replacing the opaque idiom “set upon.”
- pob_phrase: disabled him with the beauty of her face
  simplified_phrase: made him powerless with the beauty of her face
  preserved_meaning: Judith’s beauty rendered him helpless without asserting medical paralysis.
  reasoning_layer_used: POB lexical and theological decisions for παρέλυσεν
  rationale: “Made him powerless” is clearer than the potentially medical-sounding “disabled him.”
