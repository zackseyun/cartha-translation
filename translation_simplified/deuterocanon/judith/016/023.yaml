translation:
  language: en
  text: Judith continued to prosper greatly. She lived in her husband’s house until she was 105 years old, and she set her female servant free.[a] Then she died in Bethulia, and they buried her in the burial cave of her husband, Manasseh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek describes a female attendant whose being set free implies that she had been in servile dependence.
    reason: lexical_alternative
