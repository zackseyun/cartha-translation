  preserved_meaning: Judith remained in her husband’s house and reached the age of 105.
  reasoning_layer_used: POB lexical decision for ἔτη ἑκατὸν πέντε
  rationale: The rewrite removes the misleading impression that she spent 105 years in the house.
- pob_phrase: her maidservant
