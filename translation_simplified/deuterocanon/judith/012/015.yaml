translation:
  language: en
  text: After undressing,[a] Judith dressed herself and put on all her feminine adornments. Her female servant spread on the ground across from Holofernes the fleeces Bagoas had given Judith for daily use. Judith would lie back on them while eating.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The unusual Greek expression may instead mean “after changing clothes.”
    reason: lexical_alternative
  - marker: b
    text: People in that culture commonly reclined while eating.
    reason: cultural_note
