translation:
  language: en
  text: Holofernes ordered the bodyguards not to stop her. She stayed in the camp for three days. At night she went out to the valley of Bethulia and washed herself[a] at the spring near the camp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek verb means washing or bathing here, not Christian baptism.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: not to hinder her
  simplified_phrase: not to stop her
  preserved_meaning: The guards were ordered not to interfere with Judith’s movements.
  reasoning_layer_used: POB lexical decision for μὴ διακωλύειν
  rationale: “Stop” is more immediate common English while retaining the force of noninterference.
- pob_phrase: So she remained in the camp for three days, and went out at night
  simplified_phrase: She stayed in the camp for three days. At night she went out
  preserved_meaning: Judith spent three days in the camp and went out during the night.
  reasoning_layer_used: POB lexical decisions for παρέμεινεν, ἡμέρας τρεῖς, and κατὰ νύκτα
  rationale: Two short sentences make the sequence easier to follow without claiming she went out every night.
- pob_phrase: at the spring of water by the camp
  simplified_phrase: at the spring near the camp
  preserved_meaning: She washed at a natural water source located by the camp.
  reasoning_layer_used: POB lexical decision for ἐπὶ τῆς πηγῆς τοῦ ὕδατος
  rationale: “Spring” already identifies a water source, and “near” clearly expresses its location.
