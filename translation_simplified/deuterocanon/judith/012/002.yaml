  reasoning_layer_used: Lexical decision for ἐξ αὐτῶν and immediate context
  rationale: Naming the food clarifies the pronoun without changing its reference.
- pob_phrase: lest it become a stumbling block
  simplified_phrase: so that it will not become a stumbling block
  preserved_meaning: Judith intends to avoid a moral or religious cause of offense or downfall without specifying who might stumble.
  reasoning_layer_used: Lexical and theological decisions for σκάνδαλον
  rationale: The purpose clause is made more familiar while preserving the image and its open scope.
- pob_phrase: from the things that have accompanied me
  simplified_phrase: from the provisions I brought with me
  preserved_meaning: Judith will be supplied from the provisions that accompanied her.
  reasoning_layer_used: Lexical decisions for ἐκ τῶν ἠκολουθηκότων μοι and χορηγηθήσεται
  rationale: The wording identifies the accompanying things as provisions in natural English.
