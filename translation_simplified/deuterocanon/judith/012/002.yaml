translation:
  language: en
  text: Judith said, “I will not eat any of that food, so that it will not become a stumbling block.[a] Instead, I will be provided for from the provisions I brought with me.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek expression can also mean an offense or a cause of downfall.
    reason: lexical_alternative
