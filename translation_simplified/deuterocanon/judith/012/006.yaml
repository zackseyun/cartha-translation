translation:
  language: en
  text: 'Near dawn, she got up and sent this message to Holofernes: “May my lord give orders to allow your servant[a] to go outside and pray.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “your slave.” The Greek term can mean either a female servant or a female slave; here it is a deferential way of referring to herself.
    reason: lexical_alternative
