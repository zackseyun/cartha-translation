translation:
  language: en
  text: When Judith entered, she reclined at the banquet table.[a] Holofernes’ heart was overwhelmed by her, and his soul was shaken. He strongly desired to have sexual relations with her. Ever since the day he saw her, he had been looking for a chance to deceive her.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: At banquets, people commonly ate while lying back at the table.
    reason: cultural_note
  - marker: b
    text: The Greek can also mean “trick her” and, in this context, may include seducing her.
    reason: lexical_alternative
