translation:
  language: en
  text: Bagoas left Holofernes, went to Judith, and said, “Beautiful young woman, do not hesitate to come to my lord. There you can receive honor in his presence, drink wine and celebrate with us, and today become like one of the Assyrian women who attend Nebuchadnezzar’s court.”
  philosophy: optimal-equivalence
