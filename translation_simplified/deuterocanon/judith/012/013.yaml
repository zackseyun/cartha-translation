  simplified_phrase: left Holofernes, went to Judith
  preserved_meaning: Bagoas leaves Holofernes and then approaches Judith.
  reasoning_layer_used: POB lexical decisions and narrative context
  rationale: The simpler motion verbs preserve the sequence without suggesting sexual meaning.
- pob_phrase: to be honored before him, and to drink wine with us in gladness
  simplified_phrase: receive honor in his presence, drink wine and celebrate with us
  preserved_meaning: Judith is invited to receive public honor and join their festive wine drinking.
  reasoning_layer_used: POB lexical decisions
  rationale: Active, familiar wording makes the courtly invitation and wine-related gladness immediately clear.
- pob_phrase: to become on this day like one of the daughters of the Assyrians who stand in the house of Nebuchadnezzar
  simplified_phrase: today become like one of the Assyrian women who attend Nebuchadnezzar’s court
  preserved_meaning: Judith is invited to take a place like the Assyrian women attached to Nebuchadnezzar’s royal court.
  reasoning_layer_used: POB lexical rationale and applied revision
  rationale: The ethnic expression and court-attendant role are retained in natural modern English.
