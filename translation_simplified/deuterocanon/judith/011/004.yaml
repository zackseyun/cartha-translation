translation:
  language: en
  text: Have courage. You will survive tonight and remain alive afterward. No one will mistreat you. Instead, you will be treated well, just like the servants[a] of my lord King Nebuchadnezzar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word may also mean “slaves” in some contexts.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Take courage; you will live through this night and beyond.
  simplified_phrase: Have courage. You will survive tonight and remain alive afterward.
  preserved_meaning: She is assured of both immediate survival and continued life.
  reasoning_layer_used: POB lexical decisions for θάρσει and ζήσῃ καὶ εἰς τὸ λοιπόν
  rationale: Two direct sentences make the reassurance and its time span immediately clear.
- pob_phrase: there is no one who will wrong you
  simplified_phrase: No one will mistreat you.
  preserved_meaning: No person will act unjustly toward her.
  reasoning_layer_used: POB lexical decision for ἀδικήσει
  rationale: “Mistreat” expresses personal wrongdoing in ordinary modern English without limiting it to physical harm.
- pob_phrase: rather, he will treat you well, as is done for the servants
  simplified_phrase: Instead, you will be treated well, just like the servants
  preserved_meaning: She will receive the customary good treatment given to the king’s servants.
  reasoning_layer_used: POB lexical and theological decisions for εὖ σε ποιήσει, καθὰ γίνεται, and τοῖς δούλοις
  rationale: The passive wording avoids an awkward generic “he” while retaining the contrast and royal custom.
translation_notes:
  risk_flags:
