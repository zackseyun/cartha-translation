translation:
  language: en
  text: Therefore, master and lord,[a] do not ignore what he said. Keep it in your heart, because it is true. No punishment comes upon our people, and the sword does not defeat them, unless they sin against their God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “sovereign lord”; the Greek uses two titles of authority.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: master lord
  simplified_phrase: master and lord
  preserved_meaning: Both titles of authority remain in the address to Holofernes.
  reasoning_layer_used: POB lexical and theological decisions on the double vocative
  rationale: Adding “and” makes the double title natural without treating it as a divine title.
- pob_phrase: do not disregard his word, but lay it up in your heart
  simplified_phrase: do not ignore what he said. Keep it in your heart
  preserved_meaning: Holofernes is told to receive and remember the message inwardly.
  reasoning_layer_used: POB lexical decisions for παρέρχομαι and the heart image
  rationale: The rewrite uses common speech while retaining the heart metaphor.
- pob_phrase: our people are not avenged, nor does the sword prevail against them
  simplified_phrase: No punishment comes upon our people, and the sword does not defeat them
  preserved_meaning: Judgment and military defeat do not come upon the people apart from their sin.
  reasoning_layer_used: POB lexical rationale and footnote c
  rationale: The wording clarifies the punitive sense and makes the military image immediately understandable.
interpretive_expansions:
- pob_phrase: our people are not avenged
  rendering: No punishment comes upon our people
  claim: The clause concerns punitive judgment against the people rather than vengeance performed on their behalf.
  evidence:
  - The POB lexical decision gives “is punished” as the contextual sense of ἐκδικάται.
  - POB footnote c describes the clause as punishment coming against the people.
  confidence: high
  alternatives_preserved:
  - our people are not avenged
translation_notes:
  risk_flags:
  - risk: “No punishment” may sound broader than the immediate military setting.
    mitigation: The parallel reference to the sword keeps military defeat central.
  - risk: The double title remains somewhat unusual in English.
    mitigation: The conjunction improves readability, and the footnote gives the smoother alternative “sovereign lord.”
