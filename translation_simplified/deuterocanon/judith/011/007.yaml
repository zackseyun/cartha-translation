translation:
  language: en
  text: King Nebuchadnezzar of all the earth lives, and his dominion lives! He sent you to bring success to every living being. People will serve him because of you. Even the wild animals, the cattle, and the birds of the sky will live under your power for Nebuchadnezzar and his whole house.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The compressed Greek may also mean, “will live for Nebuchadnezzar and his whole house by your power.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: he who sent you for the success of every living soul
  simplified_phrase: He sent you to bring success to every living being.
  preserved_meaning: Nebuchadnezzar sent Holofernes to secure a successful outcome for living beings.
  reasoning_layer_used: lexical decisions for κατόρθωσιν and πάσης ψυχῆς
  rationale: The wording avoids suggesting an immaterial soul while keeping the chosen sense of success.
- pob_phrase: For not only will men serve him because of you
  simplified_phrase: People will serve him because of you.
  preserved_meaning: Human beings will serve Nebuchadnezzar because of Holofernes.
  reasoning_layer_used: lexical decisions for ἄνθρωποι, δουλεύσουσιν, and διὰ σέ
  rationale: “People” states the human-animal contrast naturally without changing the causal phrase.
- pob_phrase: but also the wild animals and the cattle and the birds of the sky will live under your strength
  simplified_phrase: Even the wild animals, the cattle, and the birds of the sky will live under your power
  preserved_meaning: The courtly claim extends Holofernes’ life-sustaining power hyperbolically to animals.
  reasoning_layer_used: lexical decisions and theological decision on royal hyperbole
  rationale: “Power” is clearer than “strength” in this construction while preserving dependence and the animal images.
translation_notes:
  risk_flags:
