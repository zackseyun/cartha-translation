  text: For King Nebuchadnezzar[a], of all the earth, lives, and his dominion lives—he who sent you for the success of every living soul. For not only will men serve him because of you[c][b], but also the wild animals and the cattle and the birds of the sky will live under your strength for Nebuchadnezzar and all his house.
  footnotes:
  - marker: a
