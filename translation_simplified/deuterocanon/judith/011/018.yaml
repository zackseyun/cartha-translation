translation:
  language: en
  text: When I come, I will open the way for you.[a] Then you will march out with your full force, and no one among them will stand against you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also mean, “I will open beforehand for you”; “the way” is implied by the context.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And when I come, I will open the way before you
  simplified_phrase: When I come, I will open the way for you
  preserved_meaning: Judith promises to prepare Holofernes’ advance after she comes.
  reasoning_layer_used: POB lexical decisions for ἐλθοῦσα and προανοίσω
  rationale: The rewrite removes the awkward opening conjunction while retaining the implied way and sequence.
- pob_phrase: you will go out with all your force
  simplified_phrase: Then you will march out with your full force
  preserved_meaning: He will advance with the whole power under his command.
  reasoning_layer_used: POB lexical decisions for ἐξελεύσῃ and δύναμις
  rationale: “March out” makes the military setting clear, while “full force” keeps both troop and power overtones.
- pob_phrase: there is none among them who will stand against you
  simplified_phrase: no one among them will stand against you
  preserved_meaning: Not one person from the opposing group will resist him.
  reasoning_layer_used: POB lexical decisions for ἀντιστήσεταί and ἐξ αὐτῶν
  rationale: The direct wording is easier to read and preserves the concrete image of standing against someone.
