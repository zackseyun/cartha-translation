translation:
  language: en
  text: Judith said to him, “Accept what your servant[a] has to say. Let your maidservant speak in your presence. I will not tell my lord[b] a lie tonight.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “servant.” The Greek term can mean a female servant or slave; “slave” preserves Judith’s strongly humble language.
    reason: lexical_alternative
  - marker: b
    text: Or “my master.” Here “lord” refers to the human superior Holofernes, not to God.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Receive the words of your slave
  simplified_phrase: Accept what your slave has to say
  preserved_meaning: Judith asks him to accept her spoken words while humbly calling herself his slave.
  reasoning_layer_used: Lexical decisions for Δέξαι, τὰ ῥήματα, and δούλη.
  rationale: The natural phrasing preserves acceptance rather than reducing the request to hearing.
- pob_phrase: let your maidservant speak before you
  simplified_phrase: Let your maidservant speak in your presence
  preserved_meaning: Judith humbly asks permission to speak directly before him.
  reasoning_layer_used: Lexical and theological decisions for παιδίσκη and κατὰ πρόσωπόν σου.
  rationale: “In your presence” clearly expresses the idiom while retaining the second self-designation.
- pob_phrase: this night
  simplified_phrase: tonight
  preserved_meaning: Judith promises not to lie to him during that night.
  reasoning_layer_used: Lexical decision for ἐν τῇ νυκτὶ ταύτῃ.
  rationale: “Tonight” is the ordinary modern equivalent of “this night.”
translation_notes:
  risk_flags:
  - risk: The paired terms “slave” and “maidservant” may seem inconsistent to modern readers.
    mitigation: They preserve two distinct Greek self-designations, and the first footnote explains the stronger term.
  - risk: “My lord” could be mistaken for a divine title.
    mitigation: The second footnote identifies Holofernes as the human superior addressed.
