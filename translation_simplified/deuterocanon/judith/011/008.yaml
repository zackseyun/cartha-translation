translation:
  language: en
  text: We have heard about your wisdom and your cunning mind. It has been reported throughout the earth[a] that, in the whole kingdom, you alone are good, powerful in knowledge, and remarkable in military campaigns.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “throughout the land”; the Greek can refer either to the land or more broadly to the earth.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the cunning of your soul
  simplified_phrase: your cunning mind
  preserved_meaning: The phrase describes the inner faculty behind clever planning while retaining its possibly crafty edge.
  reasoning_layer_used: Lexical decisions for πανουργεύματα and ψυχή.
  rationale: “Cunning mind” avoids making “soul” sound like a technical spiritual term here.
- pob_phrase: in all the kingdom
  simplified_phrase: in the whole kingdom
  preserved_meaning: The praise concerns the entirety of his realm rather than every kingdom.
  reasoning_layer_used: Lexical decision for ἐν πάσῃ βασιλείᾳ.
  rationale: “Whole kingdom” makes the intended scope clear.
- pob_phrase: marvelous in the armies of war
  simplified_phrase: remarkable in military campaigns
  preserved_meaning: He is praised as extraordinary in the sphere of organized warfare.
  reasoning_layer_used: Lexical alternatives for θαυμαστός and ἐν στρατεύμασιν πολέμου.
  rationale: This natural wording preserves the military setting without suggesting he is merely accompanied by armies.
translation_notes:
  risk_flags:
  - risk: “Cunning” may sound entirely negative to some readers.
    mitigation: It remains because the Greek permits cleverness with a potentially crafty edge.
  - risk: “Military campaigns” compresses the Greek image of armies prepared for war.
    mitigation: It preserves the audited military sense while avoiding the misleading phrase “with armies in battle.”
