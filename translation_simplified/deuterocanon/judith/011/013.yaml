translation:
  language: en
  text: They have decided to eat the first offerings from the grain harvest and the one-tenth offerings of wine and oil. These had been kept aside and set apart as holy for the priests who stand in Jerusalem before our God, in his presence. Yet no one among the people is permitted[a] even to touch them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “is allowed” or “is considered fit.”
    reason: lexical_alternative
