translation_notes:
  risk_flags:
  - risk: “I knew these things beforehand” could still be read as supernatural foreknowledge.
    mitigation: The wording avoids the technical term while preserving Judith’s deliberately framed claim of advance knowledge.
  - risk: Dropping the literal words “with its tongue” could weaken the Greek image.
    mitigation: “So much as growl” preserves its emphatic force, and the footnote records the literal wording.
