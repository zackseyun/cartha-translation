translation:
  language: en
  text: I will lead you through Judea until you stand facing Jerusalem. I will place your chariot in the middle of the city, and you will drive its people like sheep without a shepherd. Not even a dog will so much as growl at you.[a] I knew these things beforehand, I was informed of them, and I was sent to tell you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says that no dog will “growl with its tongue,” an image of complete lack of resistance.
    reason: cultural_note
simplification_decisions:
- pob_phrase: through the midst of Judea until you come opposite Jerusalem
  simplified_phrase: through Judea until you stand facing Jerusalem
  preserved_meaning: Judith promises to guide him across Judea to a position before Jerusalem, not necessarily into it.
  reasoning_layer_used: Lexical decisions for διὰ μέσου and ἀπέναντι
  rationale: “Facing Jerusalem” expresses the spatial relation more naturally than “opposite Jerusalem.”
- pob_phrase: I will set your chariot in her midst
  simplified_phrase: I will place your chariot in the middle of the city
  preserved_meaning: The chariot will be stationed within Jerusalem.
  reasoning_layer_used: Lexical decisions for δίφρος and ἐν μέσῳ αὐτῆς
  rationale: The city is named directly so the feminine pronoun does not confuse modern readers.
- pob_phrase: these things were spoken to me according to my foreknowledge, and they were reported to me
  simplified_phrase: I knew these things beforehand, I was informed of them
  preserved_meaning: Judith claims prior knowledge and information conveyed to her without making a technical theological claim.
  reasoning_layer_used: Lexical and theological decisions for πρόγνωσις and ἀπηγγέλη
  rationale: Plain clauses replace abstract wording while keeping prior knowledge distinct from received information.
interpretive_expansions:
- pob_phrase: you will drive them
  rendering: you will drive its people
  claim: The object refers to the people associated with Jerusalem.
  evidence:
