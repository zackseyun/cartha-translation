  preserved_meaning: Fear is pictured as something experienced inwardly in the heart.
  reasoning_layer_used: POB lexical decision for μὴ φοβηθῇς τῇ καρδίᾳ σου
  rationale: This natural English wording keeps the source’s heart image.
- pob_phrase: I have harmed no man
