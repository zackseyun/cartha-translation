translation:
  language: en
  text: Holofernes said to her, “Take courage, woman. Do not let your heart be afraid. I have never harmed anyone who has chosen to serve King Nebuchadnezzar, ruler of all the earth.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ruler of all the earth” expresses Holofernes’s sweeping imperial claim; the narrator is not affirming that it is true.
    reason: cultural_note
