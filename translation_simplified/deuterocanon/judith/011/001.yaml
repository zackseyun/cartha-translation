  preserved_meaning: Holofernes claims that he harms no person who submits to the king.
  reasoning_layer_used: POB lexical decisions for ἐκάκωσα and generic ἄνθρωπον
  rationale: “Anyone” makes the generic reference clear without narrowing the kind of harm.
- pob_phrase: King Nebuchadnezzar of all the earth
