translation:
  language: en
  text: Holofernes said to her, “God did well to send you ahead of the people. He did this so that power might be in our hands. But those who have treated my lord with contempt face destruction.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “my lord” refers to Holofernes’s human ruler, not to God.
    reason: simplification_note
simplification_decisions:
- pob_phrase: God has done well to send you ahead of the people, so that power might be in our hands
  simplified_phrase: God did well to send you ahead of the people. He did this so that power might be in our hands.
  preserved_meaning: God’s sending of Judith ahead served the purpose of putting power in Holofernes’s side’s hands.
  reasoning_layer_used: POB lexical decisions for Εὖ ἐποίησεν, ἀποστεῖλας, τοῦ γενήθηναι, and ἐν χερσὶν ἡμῶν
  rationale: Two sentences make the purpose relationship easier to follow while retaining the image of power being in their hands.
- pob_phrase: destruction is for those who have treated my lord with contempt
  simplified_phrase: those who have treated my lord with contempt face destruction
  preserved_meaning: Those who dishonor Holofernes’s human ruler are threatened with ruin.
  reasoning_layer_used: POB lexical and theological decisions for φαυλίσασι, τὸν κύριόν μου, and ἀπώλεια
  rationale: The direct English construction preserves both the active contempt and the threatened destruction.
