translation:
  language: en
  text: For I, your servant,[a] fear God and serve the God of heaven night and day. Now, my lord, I will stay with you. At night I will go out into the valley[b] and pray to God. He will tell me when they have committed their sin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can also mean “slave,” but Judith is speaking of herself humbly here.
    reason: lexical_alternative
  - marker: b
    text: The Greek word may also refer to a ravine or gorge.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: your servant is God-fearing
  simplified_phrase: I, your servant, fear God
  preserved_meaning: Judith speaks deferentially of herself and explicitly says that she reveres God.
  reasoning_layer_used: Lexical and theological decisions for δούλη and θεοσεβής
  rationale: First-person wording is easier to follow while preserving both servant language and fear of God.
- pob_phrase: I will remain with you
  simplified_phrase: I will stay with you
  preserved_meaning: Judith says she will continue in Holofernes’s company.
  reasoning_layer_used: Lexical decision for μενῶ παρὰ σοί
  rationale: “Stay” is more common than “remain” and expresses the same promise.
- pob_phrase: your servant will go out by night into the valley, and I will pray to God
  simplified_phrase: At night I will go out into the valley and pray to God
  preserved_meaning: Judith plans to go into the valley at night and pray there.
  reasoning_layer_used: Lexical decisions for ἐξελεύσεται, κατὰ νύκτα, φάραγγα, and προσεύξομαι
  rationale: Direct syntax keeps the time, movement, place, and prayer clear.
