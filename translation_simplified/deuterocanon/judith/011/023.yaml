translation:
  language: en
  text: “You are charming in appearance, and you speak well. If you carry out what you have said, your god will be my god.[a] You will live in King Nabuchodonosor’s royal household and become famous throughout the whole earth.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “your God will be my God.” Greek does not determine capitalization; lowercase reflects the pagan speaker’s perspective.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: good in your words
  simplified_phrase: you speak well
  preserved_meaning: The speaker praises the quality of Judith’s speech.
  reasoning_layer_used: lexical decision for λόγοις and immediate context
  rationale: The natural English phrase preserves the compliment without the awkward literal wording.
- pob_phrase: if you do as you have spoken
  simplified_phrase: if you carry out what you have said
  preserved_meaning: Judith must act according to her earlier statement.
  reasoning_layer_used: lexical decision for ἐὰν ποιήσῃς καθὰ ἐλάλησας
  rationale: The rewrite makes the link between her words and actions immediately clear.
- pob_phrase: you will dwell in the house of King Nabuchodonosor, and you will be renowned
  simplified_phrase: you will live in King Nabuchodonosor’s royal household and become famous
  preserved_meaning: She is promised a place in the king’s house and widespread renown.
  reasoning_layer_used: lexical decisions for καθιῇ, οἶκος, and ὀνομαστή
  rationale: Common wording clarifies royal residence and replaces the less familiar term “renowned.”
interpretive_expansions:
- pob_phrase: the house of King Nabuchodonosor
  rendering: King Nabuchodonosor’s royal household
  claim: The king’s “house” refers to residence or position within his royal establishment.
  evidence:
  - The οἶκος lexical rationale allows “household” or “court” in a royal context.
  - The καθιῇ rationale identifies settled residence or position within the household.
  confidence: high
  alternatives_preserved:
