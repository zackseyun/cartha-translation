translation:
  language: en
  text: And now, so that my lord may not be driven out and unable to succeed, death will fall upon them. Sin has overtaken them, and they provoke their God whenever they commit an outrage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
