  simplified_phrase: Judith left with her female servant
  preserved_meaning: Judith departed with her female household attendant.
  reasoning_layer_used: POB lexical decisions for ἐξῆλθεν and παιδίσκη
  rationale: This removes repetition and clearly identifies the attendant’s role.
- pob_phrase: and the men of the city kept watching her until she went down the mountain, until she passed through the valley
