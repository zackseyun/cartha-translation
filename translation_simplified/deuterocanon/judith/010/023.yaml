translation:
  language: en
  text: When Judith came into his presence, his attendants were there. They were all amazed by the beauty of her face. She fell facedown and bowed before him,[a] and they raised her up.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “paid homage to him.” The Greek can also mean “worship,” but here it describes reverence shown to a human ruler.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: came before him and his attendants
  simplified_phrase: came into his presence, his attendants were there
  preserved_meaning: Judith appeared before the ruler while his court attendants were present.
  reasoning_layer_used: Lexical decisions for κατὰ πρόσωπον αὐτοῦ and θεραπόντων
  rationale: Separate clauses prevent the attendants from sounding as though they accompanied Judith.
- pob_phrase: they all marveled at the beauty of her face
  simplified_phrase: They were all amazed by the beauty of her face
  preserved_meaning: Everyone present reacted with astonished admiration to Judith’s facial beauty.
  reasoning_layer_used: Lexical decisions for ἐθαύμασαν, κάλλει, and τοῦ προσώπου
  rationale: “Were amazed” is more familiar than “marveled” while retaining the same reaction.
- pob_phrase: falling on her face, she bowed down to him, and they raised her up
  simplified_phrase: She fell facedown and bowed before him, and they raised her up
  preserved_meaning: Judith physically prostrated herself in deference, and those present then raised her.
  reasoning_layer_used: Lexical and theological decisions for πεσοῦσα ἐπὶ πρόσωπον, προσεκύνησεν, and ἤγειραν αὐτήν
  rationale: Direct clauses preserve both the physical posture and its courtly meaning.
