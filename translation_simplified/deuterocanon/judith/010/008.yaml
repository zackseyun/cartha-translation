- pob_phrase: bring your undertakings to completion
  simplified_phrase: bring your plans to a successful end
  preserved_meaning: They pray that God will enable Judith to complete her intended course of action successfully.
  reasoning_layer_used: POB lexical decisions for τελειῶσαι and τὰ ἐπιτηδεύματά σου
  rationale: “Plans” and “successful end” convey the intended action and its completion in familiar English.
- pob_phrase: for the boasting of the sons of Israel
  simplified_phrase: so that the sons of Israel will have reason to boast
  preserved_meaning: Judith’s completed plans will give Israel a public ground for boasting or exultation.
  reasoning_layer_used: POB lexical and theological decisions for εἰς καύχημα
  rationale: The purpose clause makes the unusual noun phrase clear while preserving the force of boasting.
- pob_phrase: the exaltation of Jerusalem
  simplified_phrase: Jerusalem will be raised high in honor
  preserved_meaning: Jerusalem will be lifted up in public honor.
  reasoning_layer_used: POB lexical and theological decisions for ὕψωμα
  rationale: The wording explains the honor while retaining the source image of being raised high.
