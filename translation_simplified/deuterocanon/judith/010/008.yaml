translation:
  language: en
  text: They said to her, “May the God of our fathers grant you favor and bring your plans to a successful end, so that the sons of Israel will have reason to boast and Jerusalem will be raised high in honor.” Then she bowed down before God.
  philosophy: optimal-equivalence
