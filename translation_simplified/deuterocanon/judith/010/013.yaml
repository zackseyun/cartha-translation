translation:
  language: en
  text: “I am on my way to appear before Holofernes, the commander-in-chief of your forces, to tell him words of truth. I will show him the route he will take to conquer all the hill country. Not one of his men—not a single body with life’s breath—will be lost.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek vividly says that “not one flesh nor a breath of life” will be missing.
    reason: lexical_alternative
