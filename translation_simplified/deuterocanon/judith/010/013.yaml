- pob_phrase: coming into the presence of Holofernes
  simplified_phrase: on my way to appear before Holofernes
  preserved_meaning: Judith is approaching Holofernes in order to enter his presence.
  reasoning_layer_used: Lexical decisions for κἀγὼ ἔρχομαι and εἰς τὸ πρόσωπον.
  rationale: The wording makes both her immediate approach and intended appearance clear.
- pob_phrase: show before him the way by which he will go and gain mastery over
  simplified_phrase: show him the route he will take to conquer
  preserved_meaning: Judith promises to reveal the route by which Holofernes can gain military control.
  reasoning_layer_used: Lexical decisions for δείξω ὁδὸν, πορεύσεται, and κυριεύσει.
  rationale: The single clause clearly connects the route with the promised conquest.
- pob_phrase: not one flesh of his men, nor a breath of life, will be lacking
  simplified_phrase: Not one of his men—not a single body with life’s breath—will be lost
  preserved_meaning: She claims that every one of Holofernes’s men will remain bodily alive.
  reasoning_layer_used: Lexical and theological decisions for σὰρξ, πνεῦμα ζωῆς, and οὐ διαφωνήσει.
  rationale: The wording states the military assurance naturally while retaining both bodily images.
