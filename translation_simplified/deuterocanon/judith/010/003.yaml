translation:
  language: en
  text: She took off the sackcloth she had been wearing and the clothes that marked her widowhood. She washed herself with water, rubbed herself with rich perfumed ointment, arranged her hair, and put on a headband.[a] Then she dressed in the festive clothes she used to wear while her husband Manasseh was alive.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also mean a turban or headdress.
    reason: lexical_alternative
