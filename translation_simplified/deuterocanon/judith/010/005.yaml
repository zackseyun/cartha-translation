translation:
  language: en
  text: Judith gave her attendant a wineskin of wine and a small jar of oil. She filled a travel bag with barley meal, pressed fig cakes, and clean bread.[a] Then she wrapped up all her containers and loaded them onto her attendant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may mean bread prepared according to purity requirements; it can also be translated “pure bread.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: her maid
  simplified_phrase: her attendant
  preserved_meaning: The woman was Judith’s female helper without specifying bonded status.
  reasoning_layer_used: POB lexical decision for ἅβρᾳ
  rationale: “Attendant” avoids the modern household-cleaner sense of “maid.”
- pob_phrase: a flask of oil ... a bag
  simplified_phrase: a small jar of oil ... a travel bag
  preserved_meaning: Judith prepared portable containers of food and oil for the journey.
  reasoning_layer_used: POB lexical decisions for καψάκην and πῆραν
  rationale: The clearer wording identifies the jar as small and the bag as travel gear.
- pob_phrase: cakes of pressed figs ... all her vessels
  simplified_phrase: pressed fig cakes ... all her containers
  preserved_meaning: The provisions included compressed fig cakes, and Judith wrapped the containers.
  reasoning_layer_used: POB lexical decisions for παλάθης and τὰ ἄγγη αὐτῆς
  rationale: Common word order and “containers” make the items immediately understandable.
interpretive_expansions:
- pob_phrase: placed them on her
  rendering: loaded them onto her attendant
  claim: The final pronoun refers to Judith’s attendant, who carried the packed provisions.
  evidence:
  - The POB lexical rationale identifies the attendant as the pronoun’s most natural referent.
  - The immediate context says Judith had just given the provisions to her attendant.
  confidence: high
  alternatives_preserved:
  - The Greek does not specify whether the load was placed on her back or shoulders.
translation_notes:
  risk_flags:
