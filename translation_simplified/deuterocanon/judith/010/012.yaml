translation:
  language: en
  text: They seized her and asked, “What people do you belong to? Where have you come from, and where are you going?” She answered, “I am a Hebrew woman. I am fleeing from them because they are about to be handed over to you to be devoured.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Who are you
  simplified_phrase: What people do you belong to?
  preserved_meaning: The question asks about Judith’s ethnic or political allegiance.
  reasoning_layer_used: POB lexical decision and footnote for Τίνων εἶ
  rationale: This wording avoids suggesting personal ownership while preserving the question’s documented scope.
- pob_phrase: I am a daughter of the Hebrews
  simplified_phrase: I am a Hebrew woman.
  preserved_meaning: Judith identifies herself as a woman belonging to the Hebrew people.
  reasoning_layer_used: POB lexical and theological decisions for Θυγάτηρ εἰμὶ τῶν Ἑβραίων
  rationale: The clear ethnic identification preserves both her people and her gender.
- pob_phrase: I am fleeing from before them, because they are about to be given over to you for consumption
  simplified_phrase: I am fleeing from them because they are about to be handed over to you to be devoured.
  preserved_meaning: Judith claims to be escaping before the Hebrews are surrendered for destruction, pictured vividly as devouring.
  reasoning_layer_used: POB lexical decisions for ἀπὸ προσώπου αὐτῶν, μέλλουσιν δόσθαι, and εἰς κατάβρωμα
  rationale: Natural syntax preserves the imminent passive surrender and the source’s devouring image.
translation_notes:
  risk_flags:
  - risk: “What people” foregrounds ethnicity though the Greek may also include political allegiance.
    mitigation: The broad phrase “belong to” leaves room for both related senses.
  - risk: “Devoured” may initially sound like literal eating.
    mitigation: The military setting and “handed over” preserve its clear image of conquest and destruction.
