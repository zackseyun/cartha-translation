translation:
  language: en
  text: They set up camp between Gaibai and the city of the Scythians.[a] He stayed there for a full month to gather the full complement of his forces.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This place may also be called Scythopolis; the Greek literally says “the city of the Scythians.”
    reason: alternative_reading
  - marker: b
    text: The Greek may refer to the complete number, equipment, or full readiness of his forces.
    reason: lexical_alternative
