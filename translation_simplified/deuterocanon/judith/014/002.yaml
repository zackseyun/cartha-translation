translation:
  language: en
  text: When dawn breaks and the sun rises over the earth, each of you must take up your weapons. Every strong man must go outside the city. Appoint a leader over them and make it look as if you are going down to the plain against the advance guard[a] of the sons of Asshur.[b] But do not actually go down.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek term may also mean “outpost” or “forward watch.”
    reason: lexical_alternative
  - marker: b
    text: “Sons of Asshur” refers to the Assyrians.
    reason: cultural_note
