- pob_phrase: And it shall be, when dawn breaks and the sun rises upon the earth
  simplified_phrase: When dawn breaks and the sun rises over the earth
  preserved_meaning: The action is to begin at sunrise.
  reasoning_layer_used: POB lexical decision for the two morning expressions
  rationale: The shorter opening keeps the dawn and sunrise imagery without the formal lead-in.
- pob_phrase: each of you shall take up your weapons of war, and every mighty man shall go out beyond the city
  simplified_phrase: each of you must take up your weapons. Every strong man must go outside the city
  preserved_meaning: Each man is ordered to arm himself, and the militarily capable men are to leave the city.
  reasoning_layer_used: POB lexical and theological decisions for military equipment and the masculine designation
  rationale: Two direct sentences make the commands clear while retaining the source’s male military reference.
- pob_phrase: as though going down to the plain against the advance guard ... but you shall not go down
  simplified_phrase: make it look as if you are going down to the plain against the advance guard ... But do not actually go down
  preserved_meaning: They are to pretend to advance toward the Assyrian force without descending to it.
  reasoning_layer_used: POB lexical rationale that ὡς signals a feigned movement
  rationale: The wording directly communicates Judith’s military deception and keeps the contrast between appearance and action.
