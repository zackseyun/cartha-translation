translation:
  language: en
  text: But when the commanders of the Assyrian army heard what had been said, they tore their tunics.[a] They were deeply troubled in their souls,[b] and very loud cries and shouting broke out in the middle of the camp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tearing one’s clothing was a customary expression of grief, shock, or distress.
    reason: cultural_note
  - marker: b
    text: Or “deeply troubled in their spirits.” The Greek literally uses the singular “their soul” as a collective expression.
    reason: lexical_alternative
