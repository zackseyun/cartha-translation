translation:
  language: en
  text: “Now tell me what you have done during this time.” Then Judith reported to him, among the people, everything she had done from the day she went out up to the time she was speaking to them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “before the people”; the Greek may describe either her place among them or her public report before them.
    reason: lexical_alternative
