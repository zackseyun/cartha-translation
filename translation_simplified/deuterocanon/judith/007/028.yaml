translation:
  language: en
  text: We call heaven and earth, our God, and the Lord of our ancestors to testify against you. He punishes us for our sins and for the sins of our ancestors. May he not act today according to what you have said.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: We call heaven and earth and our God and the Lord of our fathers to witness against you
  simplified_phrase: We call heaven and earth, our God, and the Lord of our ancestors to testify against you
  preserved_meaning: The speakers formally invoke cosmic and divine witnesses against their hearers.
  reasoning_layer_used: POB lexical decisions for μαρτυρόμεθα, ὑμῖν, and κύριος
  rationale: “Testify against you” makes the formal witness language clear while retaining the divine title “Lord.”
- pob_phrase: who avenges us according to our sins and according to the sins of our fathers
  simplified_phrase: He punishes us for our sins and for the sins of our ancestors
  preserved_meaning: God brings judgment on the people because of their sins and those of earlier generations.
  reasoning_layer_used: POB footnote b and theological decision on ἐκδικεῖ
  rationale: “Punishes us for” avoids suggesting that God avenges the people by acting in their favor.
- pob_phrase: that he may not act according to these words today
  simplified_phrase: May he not act today according to what you have said
  preserved_meaning: The speakers appeal for God not to act that day in keeping with the hearers’ preceding words.
  reasoning_layer_used: POB lexical rationale for κατὰ τὰ ῥήματα ταῦτα and independent grounding review
  rationale: The independent appeal preserves the uncertain clause relationship without imposing an explicit purpose link.
interpretive_expansions:
- pob_phrase: avenges us according to our sins
  rendering: punishes us for our sins
  claim: The vengeance language describes punitive divine repayment for sin, not vindication in the people’s favor.
  evidence:
  - POB footnote b explicitly offers “punishes us for our sins.”
  - The theological decision identifies punitive recompense as prominent.
  confidence: high
  alternatives_preserved:
  - avenges us according to our sins
  - exacts justice on us according to our sins
- pob_phrase: according to these words
  rendering: according to what you have said
  claim: “These words” refers to the statements the hearers have just made.
  evidence:
  - The POB lexical rationale identifies the phrase as the statements just spoken.
  confidence: high
  alternatives_preserved:
  - according to these words
  - as these words say
translation_notes:
  risk_flags:
  - risk: The coordinated titles could sound as though “our God” and “the Lord” are separate figures.
    mitigation: The singular “he” preserves the source’s unified divine reference.
  - risk: “May he not act” presents the final clause as an appeal rather than a clearly marked purpose clause.
    mitigation: This avoids hardening the disputed clause relationship while preserving its negative force.
