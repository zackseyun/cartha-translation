translation:
  language: en
  text: The descendants of Esau and Ammon went up into the hill country and camped across from Dothaim. They sent some of their men south and east, across from Egrebel, which was near Chous and beside the seasonal streambed called Mochmour. The rest of the Assyrian army camped on the plain and covered the whole face of the land. Their tents and baggage were gathered in vast numbers, and the troops were extremely numerous.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: went up and camped in the hill country opposite Dothaim
  simplified_phrase: went up into the hill country and camped across from Dothaim
  preserved_meaning: The force ascended into the uplands and camped facing Dothaim.
  reasoning_layer_used: POB lexical decisions for ἀνέβησαν, ἐν τῷ ὄρει, and ἀπέναντι
  rationale: Ordinary spatial wording preserves both the ascent and the camp's position.
- pob_phrase: the wadi Mochmour
  simplified_phrase: the seasonal streambed called Mochmour
  preserved_meaning: Mochmour is a seasonal torrent-bed rather than a permanent brook.
  reasoning_layer_used: POB lexical decision and cultural note for χειμάρρου
  rationale: The unfamiliar geographic term is explained directly in the text.
- pob_phrase: their tents and their baggage were encamped in a very great multitude
  simplified_phrase: Their tents and baggage were gathered in vast numbers
  preserved_meaning: The tents and camp gear formed an immense concentration.
  reasoning_layer_used: POB lexical decisions for ἀποσκευαί, κατεστρατοπέδευσαν, and ἐν ὄχλῳ πολλῷ
  rationale: The wording removes awkward personification while retaining the emphasis on multitude.
interpretive_expansions:
- pob_phrase: the sons of Esau and the sons of Ammon
  rendering: The descendants of Esau and Ammon
  claim: “Sons” identifies the peoples descended from Esau and Ammon, not merely their immediate children.
  evidence:
  - The groups act as military peoples in the campaign setting.
  confidence: high
  alternatives_preserved:
  - the sons of Esau and the sons of Ammon
translation_notes:
  risk_flags:
  - risk: “Descendants” makes the collective ethnic sense more explicit than the source wording.
    mitigation: The literal alternative “sons” remains documented, and the military context supports the clarification.
  - risk: “Gathered” is supplied to make the tents and baggage natural grammatical subjects.
    mitigation: “In vast numbers” retains the source's emphasis on their immense concentration.
