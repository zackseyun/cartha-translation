translation:
  language: en
  text: The next day Holofernes gave orders to his whole army and to all the people who had joined his alliance. They were to break camp and head for Bethulia, seize control of the hill-country passes ahead of time, and wage war against the sons of Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, the Israelites; the Greek uses the traditional family name “sons of Israel.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: ordered all his army and all his people who had come for his alliance
  simplified_phrase: gave orders to his whole army and to all the people who had joined his alliance
  preserved_meaning: Holofernes commanded both his army and the wider allied forces supporting him.
  reasoning_layer_used: POB lexical decision for παρήγγειλεν, στρατεία, λαός, and συμμαχία
  rationale: The rewrite uses ordinary military English while preserving the wider group and the alliance relationship.
- pob_phrase: to break camp for Bethulia
  simplified_phrase: to break camp and head for Bethulia
  preserved_meaning: The forces were to leave camp and move toward Bethulia.
  reasoning_layer_used: POB lexical decisions for ἀναζευγνύειν and ἐπὶ Βαιτυλουὰ
  rationale: Adding “head for” makes the movement implied by breaking camp immediately clear.
- pob_phrase: to seize the passes of the hill country in advance
  simplified_phrase: seize control of the hill-country passes ahead of time
  preserved_meaning: They were to take preemptive military control of the elevated access routes.
  reasoning_layer_used: POB lexical decisions for ἀναβάσεις and προκαταλαμβάνεσθαι
  rationale: The wording explains both the strategic routes and the anticipatory force in common English.
