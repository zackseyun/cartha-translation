translation:
  language: en
  text: When the Israelites saw how vast the enemy army was, they became deeply troubled. Each one said to the person next to him, “Now these men will lick up[a] the whole surface of the land. Not even the high mountains, the ravines, or the hills will be able to bear their weight.”
  philosophy: optimal-equivalence
  footnotes:
