  reasoning_layer_used: Lexical decisions for ἀνάμεινον and παρεμβολῆς, with the POB spatial wording
  rationale: “Stay near” gives the order in ordinary English without implying he must be inside the camp.
- pob_phrase: securing every man from your force
  simplified_phrase: Keep every man in your force secure
