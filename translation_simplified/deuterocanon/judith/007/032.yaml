  preserved_meaning: He directed the women and children to go to their homes.
  reasoning_layer_used: POB lexical decision for ἀπέστειλεν and applied revision
  rationale: “Home” gives the same destination in ordinary English.
- pob_phrase: they were in great humiliation in the city
  simplified_phrase: The people in the city were deeply humiliated
  preserved_meaning: The people of the city were in a severe state of abasement.
  reasoning_layer_used: POB lexical decisions for ταπείνωσις and πολλῇ
  rationale: The recast sentence clearly identifies the people while retaining humiliation as the main sense.
