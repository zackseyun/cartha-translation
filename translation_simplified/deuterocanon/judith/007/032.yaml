translation:
  language: en
  text: Then he broke up the gathering and sent the people to their camp. They went to the walls and towers of their city,[a] and he sent the women and children home. The people in the city were deeply humiliated.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek verb is singular, but the context indicates that the dispersed people went to the walls and towers.
    reason: textual_variant
  - marker: b
    text: Or “were in great distress”; the Greek describes people who have been brought very low through humiliation, affliction, or misery.
    reason: lexical_alternative
