translation:
  language: en
  text: It is better for them to take us as plunder. We will be made slaves, but our lives will be spared. We will not watch with our own eyes as our little children die and our wives and children breathe out their lives.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: For it is better for us to become plunder for them
  simplified_phrase: It is better for them to take us as plunder
  preserved_meaning: Capture by the conquerors is preferable to dying under the siege.
  reasoning_layer_used: POB lexical decision for γενηθῆναι ... εἰς διαρπαγήν
  rationale: The active wording makes the seizure clear while retaining the stark image of people as plunder.
- pob_phrase: for we will become slaves, and our lives will be spared
  simplified_phrase: We will be made slaves, but our lives will be spared
  preserved_meaning: Surrender will bring forced slavery yet preserve their lives.
  reasoning_layer_used: POB lexical and theological decisions for δούλους and ζήσεται ἡ ψυχὴ ἡμῶν
  rationale: “Made slaves” emphasizes coercion, and “but” clarifies the contrast with survival.
- pob_phrase: we will not see with our own eyes the death of our little children
  simplified_phrase: We will not watch with our own eyes as our little children die
  preserved_meaning: They hope to avoid personally witnessing their young children’s deaths.
  reasoning_layer_used: POB lexical decisions for ὀψόμεθα, νήπια, and ἐν ὀφθαλμοῖς ἡμῶν
  rationale: The recast clause is natural English and preserves the vivid eyewitness emphasis.
