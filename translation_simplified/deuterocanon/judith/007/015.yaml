translation:
  language: en
  text: You will repay them with disaster,[a] because they rebelled and did not come out to meet you in peace.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “repay them an evil repayment,” an emphatic expression for giving them the harmful return their actions deserve.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: repay them with an evil recompense
  simplified_phrase: repay them with disaster
  preserved_meaning: God is asked to give them a harmful return for their actions.
  reasoning_layer_used: The lexical audit preserves both harmfulness and responsive requital without requiring a formal judicial penalty.
  rationale: “Disaster” communicates a grave harmful outcome while “repay” retains the force of requital.
- pob_phrase: did not meet you in peace
  simplified_phrase: did not come out to meet you in peace
  preserved_meaning: They refused to approach the addressee peacefully.
  reasoning_layer_used: The lexical alternative for οὐκ ἀπήντησαν gives the fuller sense “did not go out to meet.”
  rationale: “Come out to meet” clearly pictures their refused peaceful approach.
translation_notes:
  risk_flags:
  - risk: “Disaster” presents “evil” as harmful calamity rather than moral evil.
    mitigation: The context concerns adverse requital, and the footnote preserves the literal wording and its breadth.
