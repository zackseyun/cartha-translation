  simplified_phrase: so that not even one man can leave the city
  preserved_meaning: The siege is intended to prevent every man from leaving.
  reasoning_layer_used: POB lexical decision for τοῦ μὴ ἐξελθεῖν ἐκ τῆς πόλεως ἄνδρα ἕνα
  rationale: “Not even one man” keeps the emphatic masculine singular while using natural syntax.
- pob_phrase: they will be laid low in the streets of their dwellings
  simplified_phrase: they will fall and lie in the streets where they live
