translation:
  language: en
  text: We will set up camp against them and stand guard, so that not even one man can leave the city. They, their wives, and their children will waste away in the famine. Before the sword reaches them, they will fall and lie in the streets where they live.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “will be strewn in the public squares where they live.” The Greek can refer to streets or squares and to being thrown down or spread out.
    reason: lexical_alternative
