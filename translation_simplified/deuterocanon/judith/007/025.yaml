translation:
  language: en
  text: Now no one can help us. Instead, God has sold us into their hands, and we will be brought down before them amid thirst and terrible ruin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Amid thirst and terrible ruin” may also mean that thirst and ruin will bring them down.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And now there is no one to help us; rather
  simplified_phrase: Now no one can help us. Instead
  preserved_meaning: The speakers believe no helper remains and contrast this with God's action.
  reasoning_layer_used: POB translation and βοηθός lexical decision
  rationale: Two short sentences make the contrast clear.
- pob_phrase: God has delivered us into their hands
  simplified_phrase: God has sold us into their hands
  preserved_meaning: God has given the people over to enemy power through the source text's commercial metaphor.
  reasoning_layer_used: πέπρακεν lexical decision and divine-agency theological decision
  rationale: “Sold” preserves the controlling Greek image while “into their hands” signals enemy power.
- pob_phrase: to be laid low before them in thirst and great destruction
  simplified_phrase: and we will be brought down before them amid thirst and terrible ruin
  preserved_meaning: Being handed over leads to humiliating defeat under conditions of thirst and severe ruin without specifying purpose over result.
  reasoning_layer_used: καταστρωθῆναι, ἐναντίον αὐτῶν, ἐν δίψει, and ἀπωλείᾳ μεγάλῃ lexical decisions
  rationale: The ordinary clause preserves defeat, humiliation, and the infinitive's result-purpose range.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “sold” as a literal commercial transaction.
    mitigation: The phrase “into their hands” signals being handed over to enemy power.
  - risk: “Amid” presents thirst and ruin chiefly as circumstances.
    mitigation: The footnote preserves the possible sense that they cause the downfall.
