translation:
  language: en
  text: and everyone in Samaria and its cities; everyone beyond the Jordan as far as Jerusalem; and everyone in Batane, Chelous, Kadesh, by the river of Egypt,[a] Taphnas,[b] Rameses, and throughout the land of Goshen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This boundary is also called the “wadi of Egypt” or the “brook of Egypt.” The Greek says “river of Egypt.”
    reason: lexical_alternative
  - marker: b
    text: Taphnas is the Greek form of the place-name more commonly called Tahpanhes in English.
    reason: lexical_alternative
