  text: He laid its foundation about 90 feet (27 meters) deep. He raised its gates about 105 feet (32 meters) high and made them about 60 feet (18 meters) wide.[a] They were built for his force of mighty men to march out and for his foot soldiers to form ranks.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek measurements are sixty, seventy, and forty cubits; the modern equivalents are approximate.
    reason: cultural_note
  - marker: b
    text: The final clause may also mean “for the sorties of the army of his mighty men and the ranks of his infantry”; the Greek is compressed military language.
    reason: lexical_alternative
