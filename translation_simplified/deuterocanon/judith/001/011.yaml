translation:
  language: en
  text: All the people throughout the land showed contempt for the message[a] of Nebuchodonosor, king of the Assyrians. They refused to join him in the war because they were not afraid of him. They saw him as only an ordinary man like themselves. So they sent his messengers back empty-handed and in disgrace.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “command”; the word can refer broadly to what Nebuchodonosor communicated or demanded.
    reason: lexical_alternative
