translation:
  language: en
  text: Nebuchadnezzar became furious with that whole region. He swore by his throne and kingdom that he would surely avenge himself on the territories of Cilicia, Damascus, and Syria. He would kill their people with the sword, together with everyone living in Moab, the Ammonites, everyone in Idumea, and everyone in Egypt, as far as the borders of the two seas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The two seas” probably marks the full extent of this region by the seas at its boundaries.
    reason: cultural_note
simplification_decisions:
- pob_phrase: became very angry with all this land
  simplified_phrase: became furious with that whole region
  preserved_meaning: Nebuchadnezzar’s intense anger was directed at the entire area in view.
  reasoning_layer_used: POB lexical decisions for ἐθυμώθη and σφόδρα
  rationale: “Furious” expresses the intensified anger directly, while “region” clarifies the geographic sense of “land.”
- pob_phrase: put them to the sword—along with all who lived
  simplified_phrase: kill their people with the sword, together with everyone living
  preserved_meaning: He vowed to kill the people of the named territories and the other listed populations by the sword.
  reasoning_layer_used: POB lexical decision for ἀνελεῖν τῇ ῥομφαίᾳ and grounding review
  rationale: The wording preserves the sword image while preventing territories from sounding like the victims.
- pob_phrase: until one came to the borders of the two seas
  simplified_phrase: as far as the borders of the two seas
  preserved_meaning: The threat extends to the far boundary marked by the two seas without naming who reaches it.
  reasoning_layer_used: POB lexical decision for ἕως τοῦ ἐλθεῖν
  rationale: The extent phrase is natural English and preserves the source’s unstated subject.
interpretive_expansions:
- pob_phrase: put them to the sword
  rendering: kill their people with the sword
  claim: The victims are people in the territories rather than the territories themselves.
  evidence:
  - The POB rationale defines the idiom as violent slaughter.
  - The following objects are explicitly populations and inhabitants.
  confidence: high
  alternatives_preserved:
  - The compressed reference to the first territories remains represented by “their people.”
translation_notes:
  risk_flags:
  - risk: “Their people” makes the human victims in the first three territories explicit.
    mitigation: This prevents a category error and follows the human objects named in the rest of the clause.
  - risk: “As far as” recasts an infinitival clause as a phrase of extent.
    mitigation: It preserves the territorial limit without asserting a military advance or naming an actor.
