  text: And Nebuchadnezzar became very angry with all this land[a], and he swore by his throne and his kingdom that he would surely avenge himself on all the territories of Cilicia and Damascus and Syria, and put them to the sword—along with all who lived in Moab and the Ammonites and all Idumea and all those in Egypt[b]—until one came to the borders of the two seas.
