translation:
  language: en
  text: All the people were filled with amazement. They bowed down and worshiped God. Then, united as one, they said, “Blessed are you, our God! Today you have brought the enemies of your people to nothing.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can mean making the enemies count for nothing or bringing them to ruin.
    reason: lexical_alternative
