translation:
  language: en
  text: She stepped forward, showed them the head from the bag, and said, “Look! This is the head of Holofernes, commander-in-chief of Asshur’s army. And here is the canopy that hung over him as he lay drunk. The Lord struck him down by the hand of a woman.”
