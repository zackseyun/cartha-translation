- pob_phrase: And coming forward
  simplified_phrase: She stepped forward
  preserved_meaning: Judith moved forward before displaying the head.
  reasoning_layer_used: POB text and Greek source clause
  rationale: The finite verb is clearer than the opening participle.
- pob_phrase: the commander-in-chief of the army of Asshur
  simplified_phrase: commander-in-chief of Asshur’s army
  preserved_meaning: Holofernes held supreme command over Asshur’s military force.
  reasoning_layer_used: POB controlling translation
  rationale: The possessive form shortens the title without changing his rank or allegiance.
- pob_phrase: the canopy under which he was lying in his drunkenness
  simplified_phrase: the canopy that hung over him as he lay drunk
  preserved_meaning: The canopy covered Holofernes while he lay incapacitated by drink.
  reasoning_layer_used: POB text and source-language image
  rationale: The concrete position of the canopy is retained in ordinary English.
