  risk_flags:
  - risk: Modern readers may not recognize Asshur.
    mitigation: The name is retained because it is POB’s source-driven choice, while the possessive wording makes its link to the army clear.
  - risk: The phrase “by the hand of a woman” may sound less natural than a paraphrase.
    mitigation: It is retained to preserve the source-language image and the emphasis on the woman as the Lord’s agent.
