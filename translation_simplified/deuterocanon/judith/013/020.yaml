translation:
  language: en
  text: May God use what you have done to raise you to honor forever and visit you with good things, because you did not spare your life on account of the humiliation of our people, but went out to stand against our downfall, walking a straight path before our God. Then all the people said, “Amen, amen.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “May it be, may it be” or “So be it, so be it.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: make these things for you into everlasting exaltation
  simplified_phrase: use what you have done to raise you to honor forever
  preserved_meaning: God is asked to turn Judith’s deeds into lasting honor while retaining the image of being raised.
  reasoning_layer_used: Lexical decision for ποιήσαι ... εἰς ὕψος αἰώνιον.
  rationale: The natural wording preserves both enduring honor and the height image.
- pob_phrase: on account of the humiliation of our people, but went out against our fallen condition
  simplified_phrase: on account of the humiliation of our people, but went out to stand against our downfall
  preserved_meaning: Judith risked her life because of her people’s humiliation and acted against their collapse.
  reasoning_layer_used: Lexical decisions for ταπείνωσις and ἐπεξῆλθες πτώματι ἡμῶν.
  rationale: The rewrite preserves the causal link and the difficult phrase’s adversarial force.
- pob_phrase: having walked straight before our God
  simplified_phrase: walking a straight path before our God
  preserved_meaning: Judith followed a morally right course in God’s sight.
  reasoning_layer_used: Lexical decision for ἐπʼ εὐθεῖαν πορευθεῖσα.
  rationale: Adding “path” makes the walking image clear without replacing it.
translation_notes:
  risk_flags:
  - risk: “Stand against our downfall” personifies the difficult Greek construction slightly.
    mitigation: It preserves POB’s adversarial sense without specifying an unsupported object.
  - risk: “What you have done” compresses the plural “these things.”
    mitigation: It still refers collectively to Judith’s deeds rather than to only one act.
