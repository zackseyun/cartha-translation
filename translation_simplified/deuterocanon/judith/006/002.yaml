  reasoning_layer_used: POB lexical decision for μισθωτοὶ and the grounding review’s ambiguity finding
  rationale: “Hired men” is clearer than “hirelings” without identifying them more precisely than the source does.
- pob_phrase: that you have prophesied among us as you did today, and said that one should not make war
  simplified_phrase: that you have prophesied to us as you did today? You said that no one should wage war
  preserved_meaning: Achior is rebuked for prophesying that war should not be waged against Israel.
  reasoning_layer_used: POB lexical decisions for ἐπροφήτευσας and μὴ πολεμῆσαι
  rationale: Two sentences clarify the accusation while retaining the source’s prophetic language.
- pob_phrase: the house of Israel
