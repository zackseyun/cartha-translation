  preserved_meaning: The phrase refers collectively to Israel without making the ancestral wording more specific.
  reasoning_layer_used: POB footnote and lexical alternatives for τὸ γένος Ἰσραήλ
  rationale: “The people of Israel” is natural English and avoids resolving the audit trail’s differing formulations.
