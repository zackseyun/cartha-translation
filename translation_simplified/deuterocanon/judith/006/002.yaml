translation:
  language: en
  text: “Who are you, Achior—and you hired men of Ephraim among all the Moabites[a]—that you have prophesied to us as you did today? You said that no one should wage war against the people of Israel, because their God will defend them. What god is there except Nebuchadnezzar?[b] He himself will send his force and destroy them from the face of the earth, and their God will not rescue them.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hired men of Ephraim” is contemptuous and may also be translated “hirelings of Ephraim” or “mercenaries of Ephraim.”
    reason: lexical_alternative
  - marker: b
    text: This is the speaker’s arrogant boast, not the narrator’s claim about God.
    reason: cultural_note
