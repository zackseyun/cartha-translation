translation:
  language: en
  text: “We will burn them up in their own land. Their borderlands will be drenched with their blood,[a] and their plains will be filled with their dead. Not even a trace of their footsteps will stand before us; instead, they will utterly perish,” says King Nebuchadnezzar, lord of all the earth. For he has declared, “My spoken words will not come to nothing.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, the Greek pictures their borders as becoming drunk with their blood.
    reason: lexical_alternative
