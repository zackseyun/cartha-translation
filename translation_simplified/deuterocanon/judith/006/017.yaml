  rationale: Naming Achior prevents confusion with Holofernes, while “among” states the setting naturally.
- pob_phrase: whatever boastful things Holofernes had spoken against the house of Israel
  simplified_phrase: every boastful word Holofernes had spoken against the house of Israel
