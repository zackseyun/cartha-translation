  preserved_meaning: Achior is contemptuously identified as one who serves for wages and is affiliated with Ammon.
  reasoning_layer_used: POB lexical decisions for μισθωτέ and τοῦ Ἀμμών
  rationale: “Hired man” explains wage service, while “of Ammon” avoids implying that Ammon directly employs him.
- pob_phrase: who spoke these words in the day of your injustice
