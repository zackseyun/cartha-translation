  preserved_meaning: The speaker accuses Achior of offensive or disloyal conduct connected with his earlier words.
  reasoning_layer_used: POB lexical and theological decisions for ἐν ἡμέρᾳ ἀδικίας σου
  rationale: The audit-supported alternative makes the temporal accusation understandable while the footnote preserves the literal ambiguity.
- pob_phrase: shall no longer see my face from this day until I take vengeance
  simplified_phrase: From today on, you will no longer see my face until I take vengeance
  preserved_meaning: Achior is denied the speaker’s presence until the speaker carries out punitive vengeance.
  reasoning_layer_used: POB lexical decisions for οὐκ ὄψῃ ἔτι τὸ πρόσωπόν μου, ἀπὸ τῆς ἡμέρας ταύτης, and ἕως οὗ ἐκδικήσω
  rationale: Modern time and tense wording clarify the threat without weakening the face idiom or vengeance.
