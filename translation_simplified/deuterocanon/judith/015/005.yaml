translation:
  language: en
  text: When the Israelites heard the news, they acted together, attacked the enemy, and kept striking them down as far as Choba. People from Jerusalem and from all the hill country also came because they had been told what had happened in the enemy camp. The people in Gilead and Galilee outflanked the enemy[a] and slaughtered them in great numbers. They pursued them beyond Damascus and its surrounding territory.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The military term may also mean that they got beyond the enemy or cut them off during the pursuit.
    reason: lexical_alternative
