translation:
  language: en
  text: Uzziah sent messengers to Bethomesthaim, Choba, and Chola, and throughout the territory of Israel. They were to report what had happened and tell everyone to rush out together[a] against the enemies for their destruction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “be poured out,” picturing people streaming out in great numbers to attack.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: sent men ... to report
  simplified_phrase: sent messengers ... They were to report
  preserved_meaning: Uzziah dispatched people whose task was to announce the completed events.
  reasoning_layer_used: Lexical decision for τοὺς ἀπαγγέλλοντας
  rationale: “Messengers” states their role directly, and a new sentence makes their assignment easier to follow.
- pob_phrase: and to all the territory of Israel
  simplified_phrase: and throughout the territory of Israel
  preserved_meaning: The message was sent across the whole extent of Israelite territory.
  reasoning_layer_used: Lexical decision for πᾶν ὅριον Ἰσραήλ
  rationale: “Throughout” naturally conveys distribution across the entire region rather than only its borders.
- pob_phrase: that all should rush out against the enemies for their destruction
  simplified_phrase: tell everyone to rush out together against the enemies for their destruction
  preserved_meaning: Everyone was summoned to go out in force and attack the enemies with the purpose of destroying them.
  reasoning_layer_used: Lexical and theological decisions for ἐκχυθῶσιν and ἀναίρεσις
  rationale: “Tell everyone” clarifies the message, while “together” and the footnote preserve the sense of a mass military movement.
interpretive_expansions:
- pob_phrase: that all should rush out
  rendering: tell everyone to rush out together
  claim: The clause gives the content of the messengers’ call to the people and implies collective action.
  evidence:
  - The clause follows the purpose of sending people to report.
  - The lexical rationale identifies an en masse military movement.
  confidence: high
  alternatives_preserved:
  - that everyone should rush out
  - that everyone should stream out
translation_notes:
  risk_flags:
  - risk: “Throughout” could be read as excluding the named places from the broader territory.
    mitigation: The wording retains each destination and separately states the full territorial scope.
  - risk: “For their destruction” is less conversational than “to destroy them.”
    mitigation: It is retained because the controlling POB theological decision explicitly preserves the purpose phrase.
