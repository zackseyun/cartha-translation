translation:
  language: en
  text: Joakim the high priest and the council of the sons of Israel[a], who lived in Jerusalem, came to see the good things the Lord had done for Israel. They also came to see Judith and speak to her in peace.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, the Israelites; “sons of Israel” is their traditional covenant name.
    reason: lexical_alternative
  - marker: b
    text: The Greek literally says “speak peace with her” and may include the sense of offering peaceful congratulations.
    reason: lexical_alternative
