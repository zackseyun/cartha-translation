translation:
  language: en
  text: Terror and fear fell upon them. Not one man remained standing before another any longer. Instead, they scattered in all directions and fled together along every road of the plain and the hill country.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also mean “all at once”; here it describes the troops fleeing as a group, not acting in harmonious unity.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: no man remained standing before his neighbor any longer
  simplified_phrase: Not one man remained standing before another any longer
  preserved_meaning: No man continued to remain in place before the person near him.
  reasoning_layer_used: POB lexical decisions for οὐκ ἦν ἄνθρωπος μένων and κατὰ πρόσωπον τοῦ πλησίον
  rationale: “Before another” preserves the source relation without implying that the men stood alongside companions.
- pob_phrase: scattering in all directions
  simplified_phrase: they scattered in all directions
  preserved_meaning: The terrified troops broke apart and spread in every direction.
  reasoning_layer_used: POB lexical decision for ἐκχυθέντες
  rationale: “Scattered” states the contextual military-panic sense in natural modern English.
- pob_phrase: they fled along every road of the plain and of the hill country
  simplified_phrase: they fled together along every road of the plain and the hill country
  preserved_meaning: They fled collectively by every available route in both regions.
  reasoning_layer_used: POB lexical decisions for ὁμοθυμαδόν, ἐπὶ πᾶσαν ὁδὸν, and the geographic terms
  rationale: “Together” retains the collective force while ordinary phrasing clarifies their routes of escape.
translation_notes:
  risk_flags:
  - risk: “Together” could be mistaken for harmonious unity rather than collective panic.
    mitigation: The footnote explains the contextual sense and preserves “all at once” as an alternative.
