translation:
  language: en
  text: All the women of Israel rushed together to see her. They blessed her and formed a dancing group for her. She took festive staffs in her hands and gave them to the women who were with her.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek calls these staffs “thyrsi,” which were carried in festive processions.
    reason: cultural_note
