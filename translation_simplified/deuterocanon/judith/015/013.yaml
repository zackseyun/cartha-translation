  text: They gave Judith Holofernes’ tent, all the silverware, couches, furnishings,[a] and equipment. She put them on her mule, hitched her wagons, and piled them onto the wagons.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word is rare and uncertain; it may refer more specifically to hangings or other items belonging to the tent.
    reason: lexical_alternative
  - marker: b
    text: The Greek wording is compressed. The final words probably mean that Judith piled the goods onto the wagons.
    reason: lexical_alternative
