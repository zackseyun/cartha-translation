translation:
  language: en
  text: 'Judith continued proclaiming this confession throughout all Israel,[a] and all the people responded with this praise. Then Judith said:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “confession” means a public acknowledgment of God; “thanksgiving” or “praise” is also possible.
