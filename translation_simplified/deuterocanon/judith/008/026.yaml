translation:
  language: en
  text: Remember what he did with Abraham, how he tested Isaac,[a] and what happened to Jacob in Syrian Mesopotamia while Jacob was tending the sheep of Laban, his mother’s brother.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “tried Isaac.” Here “tested” means putting someone to the proof, not enticing someone to do evil.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and how he tested Isaac, and what happened to Jacob
  simplified_phrase: how he tested Isaac, and what happened to Jacob
  preserved_meaning: The three remembered events remain distinct, and the divine action toward Isaac remains a proving test.
  reasoning_layer_used: POB lexical and theological decisions on ἐπείρασεν
  rationale: Removing the repeated conjunction makes the list flow naturally without weakening its meaning.
- pob_phrase: in Mesopotamia of Syria
  simplified_phrase: in Syrian Mesopotamia
  preserved_meaning: The same Greek geographical expression is retained in a more natural English form.
  reasoning_layer_used: POB lexical decision on ἐν Μεσοποταμίᾳ τῆς Συρίας
  rationale: The POB already identifies “Syrian Mesopotamia” as an accurate alternative.
- pob_phrase: while he was shepherding the sheep of Laban
  simplified_phrase: while Jacob was tending the sheep of Laban
  preserved_meaning: Jacob’s ongoing work caring for Laban’s sheep remains explicit.
  reasoning_layer_used: POB lexical decisions on ποιμαίνοντι and τὰ πρόβατα
  rationale: “Tending the sheep” is common English, and repeating Jacob prevents pronoun confusion.
translation_notes:
  risk_flags:
  - risk: The pronoun “he” referring to the one who dealt with Abraham and tested Isaac may be unclear by itself.
    mitigation: It is retained to honor the POB decision not to make the Greek’s implicit subject more explicit than necessary.
  - risk: Modern readers may mistake divine testing for temptation to evil.
    mitigation: The footnote states the intended proving sense while preserving the main-text term “tested.”
