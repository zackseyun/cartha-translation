translation:
  language: en
  text: For he has not tested us by fire as he tested them to examine their hearts, and he has not taken vengeance on us. Instead, the Lord scourges those who come near to him in order to correct them.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: For he did not test us by fire, as he did them, to examine their hearts
  simplified_phrase: For he has not tested us by fire as he tested them to examine their hearts
  preserved_meaning: Their fiery ordeal examined their inner selves, but God has not subjected us to the same test.
  reasoning_layer_used: POB lexical decisions for ἐπύρωσεν, εἰς ἔτασμόν, and καρδίας
  rationale: The recast clause makes the comparison clear while retaining the fire image and its testing purpose.
- pob_phrase: Rather, the Lord scourges
  simplified_phrase: Instead, the Lord scourges
  preserved_meaning: The Lord's severe action is corrective rather than vengeful.
  reasoning_layer_used: POB theological decision on μαστιγοῖ and corrective purpose
  rationale: “Instead” is more common than “rather,” while “scourges” preserves the metaphor's severity.
- pob_phrase: those who draw near to him for admonition
  simplified_phrase: those who come near to him in order to correct them
  preserved_meaning: The Lord gives painful correction to those who approach him.
  reasoning_layer_used: POB lexical decisions for τοὺς ἐγγίζοντας αὐτῷ and νουθέτησιν
  rationale: Common wording replaces the biblical idiom and abstract noun without losing religious nearness or corrective intent.
