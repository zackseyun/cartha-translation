translation:
  language: en
  text: You cannot discover what is deep in a man's heart,[a] or grasp the reasoning in his mind. How, then, could you search out God, who made all these things? How could you know his mind or understand his thought? Brothers,[b] do not, by any means, provoke the Lord our God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “what is deep in a human heart.” The Greek masculine singular represents human beings generally.
    reason: lexical_alternative
  - marker: b
    text: Or “brothers and sisters.” The Greek says “brothers” and may be addressing the whole group.
    reason: lexical_alternative
