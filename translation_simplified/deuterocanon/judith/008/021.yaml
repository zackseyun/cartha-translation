translation:
  language: en
  text: For if we are captured like this, all Judea will be brought low, our sacred things will be plundered, and he will demand an accounting for their desecration from our blood.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek does not name who “he” is; the context most likely points to God. The phrase “from our blood” is difficult and may mean that we will pay with our lives for this desecration.
    reason: alternative_reading
