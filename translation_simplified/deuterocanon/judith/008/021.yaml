- pob_phrase: all Judea will be brought low
  simplified_phrase: all Judea will be brought low
  preserved_meaning: The whole region will be left defeated and helpless.
  reasoning_layer_used: POB lexical decision for καθήσεται
  rationale: This keeps the contextual force of the Greek image in clear English.
- pob_phrase: our holy things
  simplified_phrase: our sacred things
  preserved_meaning: The plural broadly includes holy objects and places.
  reasoning_layer_used: POB lexical decision for τὰ ἅγια ἡμῶν
  rationale: “Sacred things” is clearer without narrowing the phrase to one sanctuary.
- pob_phrase: he will require their profanation
  simplified_phrase: he will demand an accounting for their desecration
  preserved_meaning: An unnamed singular subject will call them to account for violating what is sacred.
  reasoning_layer_used: POB lexical and theological decisions for ζητήσει and βεβήλωσις
  rationale: This states the judicial sense of “require” and explains “profanation” plainly.
