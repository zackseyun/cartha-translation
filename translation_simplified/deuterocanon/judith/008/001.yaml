  text: At that time, Judith heard about this. Her father was Merari, son of Ox, son of Joseph, son of Oziel, son of Elkiah, son of Eliou, son of Chelkias, son of Eliab, son of Nathanael, son of Salamiel, son of Sarasadai, son of Israel.[a]
