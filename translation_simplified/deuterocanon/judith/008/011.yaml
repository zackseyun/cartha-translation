translation:
  language: en
  text: 'They came to her, and she said, “Listen to me, rulers of the people living in Bethulia. What you said against the people today was not right. You made this oath between God and yourselves: you said you would hand over the city to our enemies if the Lord did not turn back to help you within those days.”'
