- pob_phrase: rulers of those who dwell in Bethulia
  simplified_phrase: rulers of the people living in Bethulia
  preserved_meaning: They govern the people who live in Bethulia.
  reasoning_layer_used: Lexical decisions for ἄρχοντες and κατοικούντων
  rationale: This preserves governing authority and residence in natural English.
- pob_phrase: your word that you spoke against the people on this day is not right
  simplified_phrase: What you said against the people today was not right
  preserved_meaning: Judith condemns their harmful declaration as wrong.
  reasoning_layer_used: Lexical decisions for οὐκ εὐθύς and ἐναντίον τοῦ λαοῦ
  rationale: The recast removes repetition while retaining the moral judgment and adversative force.
- pob_phrase: you have set up the oath that you spoke between God and yourselves
  simplified_phrase: You made this oath between God and yourselves
  preserved_meaning: They formally established an oath involving themselves and God.
  reasoning_layer_used: Lexical decision for ἐστήσατε τὸν ὅρκον and doctrine realignment
  rationale: “Made this oath” expresses formal establishment idiomatically without reducing it to merely swearing.
