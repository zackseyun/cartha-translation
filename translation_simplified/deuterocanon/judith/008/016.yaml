translation:
  language: en
  text: But do not treat the plans of the Lord our God as a pledge that binds him to your terms. God is not a man who can be threatened or a human being who can be persuaded.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: hold the plans of the Lord our God as security
  simplified_phrase: treat the plans of the Lord our God as a pledge that binds him to your terms
  preserved_meaning: The pledge image remains while its warning against placing God under human conditions becomes understandable.
  reasoning_layer_used: Lexical decision for ἐνεχυράζετε and its contextual rationale
  rationale: The rewrite explains the unfamiliar security image without replacing it with a looser metaphor.
- pob_phrase: nor like a son of man
  simplified_phrase: or a human being
  preserved_meaning: The phrase still contrasts God with an ordinary human rather than using a messianic title.
  reasoning_layer_used: Lexical decision and cultural note for υἱὸς ἀνθρώπου
  rationale: The idiom is stated directly because “son of man” is likely to mislead modern readers.
- pob_phrase: to be threatened ... to be persuaded
  simplified_phrase: who can be threatened ... who can be persuaded
  preserved_meaning: Both distinct ways of trying to pressure or sway God remain in parallel.
  reasoning_layer_used: Lexical and theological decisions for ἀπειληθῆναι and διαπεισθῆναι
  rationale: Ordinary relative clauses make the contrast easier to follow without merging its two ideas.
interpretive_expansions:
- pob_phrase: hold the plans of the Lord our God as security
  rendering: treat the plans of the Lord our God as a pledge that binds him to your terms
  claim: The pledge treats God's plans as subject to humanly imposed conditions.
  evidence:
  - The lexical rationale says Judith warns against placing God's purposes under human conditions or deadlines.
  - The following contrast denies that God can be pressured or swayed like a human.
  confidence: high
  alternatives_preserved:
