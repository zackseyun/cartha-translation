translation:
  language: en
  text: The slaughter of our brothers, our land being taken captive, and our inheritance being devastated will come back on our own heads.[a] This will happen among the nations where we will serve as slaves. We will become a stumbling block and a disgrace in the eyes of those who own us.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek verb is singular but has no stated subject; it may also mean, “he will bring these things back on our heads,” likely referring to God.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the captivity of the land, and the desolation of our inheritance
  simplified_phrase: our land being taken captive, and our inheritance being devastated
  preserved_meaning: The land is captured, while the inherited homeland is laid waste.
  reasoning_layer_used: POB lexical decisions for αἰχμαλωσία, γῆ, ἐρήμωσις, and κληρονομία
  rationale: Concrete verbal clauses replace dense abstract nouns while keeping the two source ideas distinct.
- pob_phrase: among the nations where we will serve as slaves there
  simplified_phrase: This will happen among the nations where we will serve as slaves.
  preserved_meaning: The consequences occur under forced service among foreign nations.
  reasoning_layer_used: POB lexical decision for δουλεύω and source syntax
  rationale: A new sentence removes the repeated location word without weakening the slavery language.
- pob_phrase: a stumbling block and a reproach before those who possess us
  simplified_phrase: a stumbling block and a disgrace in the eyes of those who own us
  preserved_meaning: The captives become an offense and a public object of scorn before their owners.
  reasoning_layer_used: POB lexical decisions for πρόσκομμα, ὄνειδος, and κτάομαι
  rationale: The metaphor remains, while “in the eyes of” preserves the captors’ viewpoint.
