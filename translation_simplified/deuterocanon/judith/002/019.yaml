translation:
  language: en
  text: He himself set out with his entire army to march ahead of King Nebuchadnezzar. With his chariots, horsemen, and chosen foot soldiers, he was to cover the whole face of the land as he advanced westward.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the whole face of the earth.” The Greek word can mean either “land” or “earth”; “land” fits this westward advance through various territories.
    reason: lexical_alternative
