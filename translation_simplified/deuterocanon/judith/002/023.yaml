- pob_phrase: And he cut down Phud and Lud, and he plundered
  simplified_phrase: He cut down Phud and Lud. He also plundered
  preserved_meaning: The wording keeps both violent defeat and the taking of war booty as distinct actions.
  reasoning_layer_used: POB lexical decisions for διέκοψεν and ἐπρονόμευσεν
  rationale: Two sentences make the military actions easier to follow without weakening them.
- pob_phrase: all the sons of Rasses and the sons of Ishmael
  simplified_phrase: all the people of Rasses and the descendants of Ishmael
  preserved_meaning: Both expressions still identify ethnic groups through their named ancestry or affiliation.
  reasoning_layer_used: POB lexical alternatives for υἱοὺς πάντας Ῥασσεῖς and υἱοὺς Ἰσμαήλ
  rationale: Common group language replaces the awkward repeated phrase “sons of.”
- pob_phrase: who were opposite the wilderness
  simplified_phrase: who were across from the wilderness
  preserved_meaning: The spatial relationship remains imprecise, as in the Greek.
  reasoning_layer_used: POB lexical decision and location footnote for κατὰ πρόσωπον τῆς ἐρήμου
  rationale: “Across from” expresses the same spatial idea in more natural English.
