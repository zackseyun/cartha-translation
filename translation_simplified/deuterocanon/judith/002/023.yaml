translation:
  language: en
  text: He cut down Phud and Lud.[a] He also plundered all the people of Rasses and the descendants of Ishmael who were across from the wilderness, toward the south of the Chaldeans.[b]
  philosophy: optimal-equivalence
  footnotes:
