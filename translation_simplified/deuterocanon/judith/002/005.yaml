translation:
  language: en
  text: 'This is what the great king, the lord of all the earth, says: “Look! Leave my presence and take with you men who rely on their strength—120,000 foot soldiers—and a force of horses with riders, 120,000 in number.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “twelve myriads”; a myriad is ten thousand.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Thus says the great king
  simplified_phrase: This is what the great king says
  preserved_meaning: The words introduce a formal royal proclamation.
  reasoning_layer_used: Lexical decision for Τάδε λέγει
  rationale: The common English formula remains solemn without sounding archaic.
- pob_phrase: you shall go out from my presence
  simplified_phrase: Leave my presence
  preserved_meaning: The king commands his officer to depart on his mission.
  reasoning_layer_used: Lexical decision for ἐξελεύσῃ ἐκ τοῦ προσώπου μου
  rationale: A direct command is clearer than the formal future construction.
- pob_phrase: men confident in their strength
  simplified_phrase: men who rely on their strength
  preserved_meaning: The men trust in their military power rather than merely possessing strength.
  reasoning_layer_used: Lexical rationale for ἄνδρας πεποιθότας ἐν ἰσχύι αὐτῶν
  rationale: The rewrite makes their reliance on strength immediately understandable.
translation_notes:
  risk_flags:
  - risk: The title “lord of all the earth” could be mistaken for a divine title.
    mitigation: Lowercase “lord” marks this as the human king’s boast.
  - risk: The final number could be read as counting only the horses.
    mitigation: “A force of horses with riders” keeps the number attached to the mounted force as a whole.
