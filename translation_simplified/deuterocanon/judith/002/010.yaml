simplification_decisions:
- pob_phrase: after going out, shall seize all their territory in advance for me
  simplified_phrase: Go out and seize all their territory in advance for me
  preserved_meaning: The commander must depart and then forcibly take their whole region beforehand for the king.
  reasoning_layer_used: Greek lexical decisions for ἐξελθὼν, προκαταλήμψῃ, and πᾶν ὅριον αὐτῶν
  rationale: Two direct commands make the sequence natural while retaining the military force, advance action, and beneficiary.
- pob_phrase: they will surrender themselves to you
  simplified_phrase: They will surrender to you
  preserved_meaning: The conquered peoples will yield themselves to the commander.
  reasoning_layer_used: Greek lexical decision for ἐκδώσουσίν σοι ἑαυτούς
  rationale: In natural English, “surrender” already conveys giving oneself up.
- pob_phrase: you shall keep them for me until the day of their punishment
  simplified_phrase: Hold them for me until the day of their punishment
  preserved_meaning: The subdued peoples must be retained for the king until their later punishment.
  reasoning_layer_used: Greek lexical decisions for διατηρήσεις and εἰς ἡμέραν ἐλεγμοῦ αὐτῶν
  rationale: “Hold them” clearly expresses retaining conquered people without specifying a form of custody.
