translation:
  language: en
  text: He crossed the Euphrates River and traveled through Mesopotamia. He tore down[a] every high city along the Abrona torrent[b], until he reached the sea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “broke through.” The Greek literally means “dug through” and here may describe breaching or destroying cities during a military campaign.
    reason: lexical_alternative
  - marker: b
    text: Abrona is a place-name in the Greek, but its exact location is uncertain.
    reason: cultural_note
