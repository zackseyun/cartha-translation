translation:
  language: en
  text: Joakim the high priest, and all who stood before the Lord—the priests and those serving the Lord—wore sackcloth tied around their waists. They were offering the regular whole burnt offering,[a] along with the people’s vows and voluntary gifts.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “continual whole burnt offering.”
    reason: lexical_alternative
  - marker: b
    text: The Greek may mean “prayers,” but in this setting it more likely refers to vows or vowed offerings.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: all who stood before the Lord—the priests and those ministering to the Lord
  simplified_phrase: all who stood before the Lord—the priests and those serving the Lord
  preserved_meaning: Those present before the Lord are identified as priests and others engaged in sacred service.
  reasoning_layer_used: lexical decisions for παρεστηκότες and λειτουργοῦντες
  rationale: “Serving” is familiar English and avoids adding a temple role not explicit in the source.
- pob_phrase: with sackcloth girded around their waists
  simplified_phrase: wore sackcloth tied around their waists
  preserved_meaning: They had bound sackcloth around their bodies as penitential clothing.
  reasoning_layer_used: lexical decision for σάκκους περιεζωσμένοι
  rationale: “Tied” preserves the physical image of girding in ordinary English.
- pob_phrase: the prayers, and the freewill gifts of the people
  simplified_phrase: the people’s vows and voluntary gifts
  preserved_meaning: The people supplied cultic vows and gifts given willingly.
  reasoning_layer_used: theological decision for εὐχαί and lexical decision for ἑκούσια δόματα
  rationale: This follows the controlling reading “vows” and makes “freewill gifts” immediately clear.
translation_notes:
  risk_flags:
  - risk: The Greek word rendered “vows” can also mean “prayers.”
    mitigation: The main text follows the audited cultic reading, while footnote b preserves the alternative.
  - risk: “Those serving the Lord” may not convey the full priestly-service nuance of the Greek verb.
    mitigation: Its placement beside “the priests” and “before the Lord” keeps the sacred-service context clear.
