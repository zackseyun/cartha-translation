- pob_phrase: had been consecrated from the defilement
  rendering: had been restored from defilement and made holy again
  claim: Consecration restored what had been defiled to a holy state.
  evidence:
  - The theological rationale identifies restoration from profanation to holiness.
  - The perfect passive describes a completed state of dedication.
  confidence: high
  alternatives_preserved:
  - had been consecrated after the desecration
  - had been purified after the desecration
