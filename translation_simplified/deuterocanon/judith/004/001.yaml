translation:
  language: en
  text: The sons of Israel[a] who lived in Judea heard everything Holofernes had done to the nations. He was the commander-in-chief serving under Nebuchadnezzar, king of the Assyrians. They also heard how he had plundered all the nations’ sanctuaries[b] and handed them over to destruction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Israelites” or “the children of Israel.” The Greek literally says “the sons of Israel.”
    reason: lexical_alternative
  - marker: b
    text: Or “holy things” or “temples.” The Greek may refer to sacred places or sacred things.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Holofernes, the commander-in-chief of King Nebuchadnezzar of the Assyrians
  simplified_phrase: He was the commander-in-chief serving under Nebuchadnezzar, king of the Assyrians.
  preserved_meaning: Holofernes held the highest military command in service to the Assyrian king Nebuchadnezzar.
  reasoning_layer_used: Lexical decision for ἀρχιστράτηγος and grounding review
  rationale: A separate sentence eases the syntax, while “serving under” makes the chain of command unmistakable.
- pob_phrase: and how he had plundered all their sanctuaries
  simplified_phrase: They also heard how he had plundered all the nations’ sanctuaries
  preserved_meaning: The Judean sons of Israel learned that Holofernes had plundered the nations’ sacred places or things.
  reasoning_layer_used: Lexical and theological decisions for τὰ ἱερὰ αὐτῶν
  rationale: Repeating the hearers and naming the nations removes unclear pronoun references.
- pob_phrase: given them over to destruction
  simplified_phrase: handed them over to destruction
  preserved_meaning: Holofernes consigned the sanctuaries to ruin while retaining the source image of handing them over.
  reasoning_layer_used: Lexical decision for ἔδωκεν αὐτὰ εἰς ἀφανισμόν
  rationale: “Handed” is common English and preserves the source phrase’s force.
