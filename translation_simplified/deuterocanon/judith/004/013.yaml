translation:
  language: en
  text: They covered the altar with sackcloth. Then they all cried out urgently to the God of Israel. They pleaded with him not to hand over their little children to be seized, their women to be taken as war booty, the cities that were their inheritance to be destroyed, and the holy things to be defiled and disgraced—something the nations would gloat over.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: they cried out to the God of Israel together with fervor
  simplified_phrase: they all cried out urgently to the God of Israel
  preserved_meaning: Their prayer was united, intense, and spoken as a strong cry.
  reasoning_layer_used: POB lexical decision for ἐβόησαν, ὁμοθυμαδόν, and ἐκτενῶς
  rationale: Common adverbs express the united and fervent force more naturally.
- pob_phrase: their women to spoil
  simplified_phrase: their women to be taken as war booty
  preserved_meaning: The women faced being seized as spoils of war.
  reasoning_layer_used: POB lexical decision and footnote for προνομή
  rationale: War booty makes the otherwise opaque meaning of spoil immediately clear.
- pob_phrase: the cities of their inheritance to destruction, and the holy things to defilement and reproach
  simplified_phrase: the cities that were their inheritance to be destroyed, and the holy things to be defiled and disgraced
  preserved_meaning: They feared the destruction of their inherited cities and both the desecration and dishonor of sacred things.
  reasoning_layer_used: POB lexical and theological decisions for κληρονομία and τὰ ἅγια
  rationale: Verbal clauses improve readability while the additive wording preserves the coordinated harms.
interpretive_expansions:
- pob_phrase: their women to spoil
  rendering: their women to be taken as war booty
  claim: Spoil refers to people seized as booty in war.
  evidence:
  - The POB lexical decision identifies προνομή as booty or spoil taken in war.
  - The POB footnote offers “their women as booty.”
  confidence: high
  alternatives_preserved:
  - their women to spoil
translation_notes:
  risk_flags:
  - risk: “Women” could also mean “wives” in the Greek.
    mitigation: The main text retains POB’s broader “women” without narrowing the reference.
  - risk: The final gloating clause may be read as applying only to the holy things or more broadly to the preceding harms.
    mitigation: Its placement preserves the closest link to the holy things without fully excluding the broader connection.
