simplification_decisions:
- pob_phrase: Look upon their arrogance
  simplified_phrase: Take notice of their arrogance
  preserved_meaning: Judith asks God not merely to look but to attend to their overbearing pride.
  reasoning_layer_used: lexical decision for βλέψον and ὑπερηφανίαν
  rationale: “Take notice” makes the force of the prayerful appeal clear in common English.
- pob_phrase: send your wrath upon their heads
  simplified_phrase: Send your wrath upon their heads
  preserved_meaning: God’s punitive anger is pictured as falling upon the arrogant people themselves.
  reasoning_layer_used: lexical decisions for ὀργήν and εἰς κεφαλὰς αὐτῶν
  rationale: The wording remains clear while preserving the judgment image and the theological force of “wrath.”
- pob_phrase: give power to what I have planned by the hand of me, a widow
  simplified_phrase: Give power to what I have planned through my hand—the hand of a widow
  preserved_meaning: Judith asks God to empower her intended action through her own agency while emphasizing her widowhood.
  reasoning_layer_used: theological decision on κράτος and ἐν χειρί μου τῆς χήρας
  rationale: “Through my hand” removes wooden syntax without losing the concrete hand image or Judith’s emphatic self-identification.
