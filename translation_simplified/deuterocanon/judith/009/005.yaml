translation:
  language: en
  text: For you made what came before those things. You also planned those things themselves, what came afterward, what exists now, and what is still to come.[a] What you planned came to be.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “considered” or “purposed” instead of “planned.”
    reason: lexical_alternative
