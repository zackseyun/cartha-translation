translation:
  language: en
  text: Your name is Lord. By your power, shatter their strength; in your wrath, break down their might. They planned to treat your sacred things[a] as common and to defile the tabernacle, your sacred dwelling where your glorious name rests. They also planned to strike down the horn of your altar[b] with the sword.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sacred things” may include both holy objects and holy places.
    reason: lexical_alternative
  - marker: b
    text: The altar’s horns were raised projections at its corners.
    reason: cultural_note
  - marker: c
    text: The Greek literally says “with iron,” meaning an iron weapon here.
    reason: lexical_alternative
