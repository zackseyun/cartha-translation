translation:
  language: en
  text: 'And she said, “Lord, God of my father Simeon, you placed a sword in his hand to take vengeance on the foreigners who sexually violated the virgin: they loosened her womb, defiling her; bared her thigh, shaming her; and profaned her womb, disgracing her.[a] Yet you said, ‘It shall not be so,’ but they did it.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The three images describe the virgin’s sexual violation, shame, and defilement without reducing them to a single expression.
    reason: simplification_note
