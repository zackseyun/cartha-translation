translation:
  language: en
  text: For your power does not come from great numbers, and your rule does not depend on powerful people. Instead, you are God of the lowly, helper of people of lesser standing, supporter of the weak, shelter for those given up for lost,[a] and savior of those without hope.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “those in despair”; the Greek can refer to people given up for lost or to the desperate.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: your power is not in a multitude
  simplified_phrase: your power does not come from great numbers
  preserved_meaning: God's power is not based on a large number of people.
  reasoning_layer_used: Lexical decision for πλήθει and contextual syntax
  rationale: “Great numbers” makes the concrete meaning of “multitude” immediately clear.
- pob_phrase: nor is your dominion among the strong
  simplified_phrase: your rule does not depend on powerful people
  preserved_meaning: God's ruling authority does not rest on those who possess strength or power.
  reasoning_layer_used: Lexical decisions for δυναστεία and ἐν ἰσχύουσιν
  rationale: “Rule” and “powerful people” replace elevated wording while preserving political authority and human strength.
- pob_phrase: helper of the lesser ... shelter of the forsaken
  simplified_phrase: helper of people of lesser standing ... shelter for those given up for lost
  preserved_meaning: God aids people with lower status and shelters those others regard as lost.
  reasoning_layer_used: Lexical decisions for ἐλαττόνων, ἀπεγνωσμένων, and σκεπαστής
  rationale: The clearer phrases preserve both social vulnerability and the shelter image.
interpretive_expansions:
- pob_phrase: your power is not in a multitude, nor is your dominion among the strong
  rendering: your power does not come from great numbers, and your rule does not depend on powerful people
  claim: The clauses deny that God's power and rule rely on human numbers or powerful people.
  evidence:
  - The paired Greek constructions locate neither God's power in a multitude nor his dominion among the strong.
  - POB's lexical rationale connects κράτος with exercised power and δυναστεία with ruling authority.
  confidence: high
  alternatives_preserved:
  - God's power is not found in a multitude.
  - God's dominion is not among the strong.
