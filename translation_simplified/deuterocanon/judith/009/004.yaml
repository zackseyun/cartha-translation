translation:
  language: en
  text: You gave their wives to be taken as plunder and their daughters to be taken captive. You gave all the goods seized in war to be divided among the sons you loved. They burned with your own zeal, detested the pollution connected with their blood,[a] and called on you for help. O God, my God, hear me, a widow.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also be rendered “their blood-pollution”; it leaves the exact connection between the blood and the ritual or moral pollution unclear.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: all their spoils for division among the sons beloved by you
  simplified_phrase: all the goods seized in war to be divided among the sons you loved
  preserved_meaning: War booty was distributed among the divinely favored sons.
  reasoning_layer_used: Lexical decisions for σκῦλα and διαίρεσιν, with the theological decision to retain “sons”
  rationale: The wording explains military “spoils” and replaces the passive phrase without removing divine favor or the gendered term.
- pob_phrase: were zealous with your zeal
  simplified_phrase: burned with your own zeal
  preserved_meaning: The sons intensely shared in God's zeal.
  reasoning_layer_used: Lexical and theological decision for ἐζήλωσαν τὸν ζῆλόν σου
  rationale: The vivid verb makes the emphatic shared zeal understandable without reducing it to general devotion.
- pob_phrase: the defilement of their blood
  simplified_phrase: the pollution connected with their blood
  preserved_meaning: They recoiled from ritual or moral impurity involving blood, while its exact relation remains uncertain.
  reasoning_layer_used: Lexical decision for μίασμα αἵματος αὐτῶν and POB footnote
  rationale: “Connected with” avoids implying a single resolution of the ambiguous Greek genitive.
translation_notes:
  risk_flags:
  - risk: “Connected with their blood” remains somewhat general because the Greek relationship is ambiguous.
    mitigation: The footnote states the ritual-moral domain and explicitly preserves the uncertainty.
  - risk: “Burned” introduces an English metaphor to clarify the cognate zeal expression.
    mitigation: “Your own zeal” retains the source emphasis that their zeal participates in God's zeal.
