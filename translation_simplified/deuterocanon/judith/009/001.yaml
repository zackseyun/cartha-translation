simplification_decisions:
- pob_phrase: fell on her face
  simplified_phrase: fell facedown
  preserved_meaning: Judith physically lowered herself with her face to the ground in grief, humility, and prayer.
  reasoning_layer_used: POB lexical decision for ἔπεσεν ἐπὶ πρόσωπον
  rationale: “Fell facedown” keeps the concrete image in more natural modern English.
- pob_phrase: uncovered the sackcloth she had been wearing
  simplified_phrase: exposed the sackcloth she was wearing
  preserved_meaning: Judith made her already-worn sackcloth visible rather than removing it.
  reasoning_layer_used: POB lexical decision for ἐγύμνωσεν ὃν ἐνεδεδύκει σάκκον
  rationale: “Exposed” clearly communicates that she revealed the sackcloth.
- pob_phrase: cried out with a loud voice
  simplified_phrase: cried out loudly
  preserved_meaning: Judith prayed to the Lord with an urgent, audible cry.
  reasoning_layer_used: POB lexical decision for ἐβόησεν φωνῇ μεγάλῃ
  rationale: The adverb removes a repetitive English expression without weakening its force.
translation_notes:
  risk_flags:
  - risk: “Exposed” could be mistaken for removing the sackcloth.
    mitigation: The words “she was wearing” make clear that the sackcloth remained on her.
  - risk: “House of God” may be less immediately recognizable than “temple.”
    mitigation: The wording is retained because POB deliberately preserves the Greek expression for the Jerusalem sanctuary.
