simplification_decisions:
- pob_phrase: Strike slave against ruler with the deceit of my lips
  simplified_phrase: With the deceitful words of my lips, strike a slave against a ruler
  preserved_meaning: God is directly asked to strike, using Judith’s deceptive speech, without assigning the blow to the slave.
  reasoning_layer_used: Lexical decisions for πάταξον, δοῦλον, and ἐκ χειλέων ἀπάτης μου
  rationale: Moving the means phrase first clarifies its role while preserving the difficult relation between slave and ruler.
- pob_phrase: and ruler against his attendant
  simplified_phrase: and a ruler against his attendant
  preserved_meaning: The same divine command also sets a ruler against his personal subordinate.
  reasoning_layer_used: Lexical decisions for ἄρχοντα and θεράποντι
  rationale: Adding the English article improves readability while keeping “attendant” distinct from “slave.”
- pob_phrase: shatter their arrogance by the hand of a woman
  simplified_phrase: Shatter their arrogance by the hand of a woman
  preserved_meaning: God is asked to destroy the enemies’ proud exaltation through female agency.
  reasoning_layer_used: Lexical decision for τὸ ἀνάστεμα and theological decision on gendered agency
  rationale: A separate sentence preserves both the forceful image and the woman’s explicit agency.
