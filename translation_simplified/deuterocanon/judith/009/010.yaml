translation:
  language: en
  text: With the deceitful words of my lips, strike a servant against a ruler, and a ruler against his attendant. Shatter their arrogance[a] by the hand of a woman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “their uprising” or “their insolence”; the rare Greek word may refer either to proud exaltation or to rising up.
