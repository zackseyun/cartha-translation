translation:
  language: en
  text: For they went even farther astray along paths of error.[a] They regarded as gods even the dishonored creatures among their enemies’ animals. They were deceived like foolish infants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “were led even farther astray.” The Greek may describe either their wandering or their being misled.
    reason: lexical_alternative
