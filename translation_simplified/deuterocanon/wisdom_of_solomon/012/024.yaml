  preserved_meaning: The passive deception and rebuking comparison with infants remain intact.
  reasoning_layer_used: Lexical decisions for ψευσθέντες and νηπίων δίκην ἀφρόνων
  rationale: A separate finite sentence removes the awkward participle while preserving the simile.
