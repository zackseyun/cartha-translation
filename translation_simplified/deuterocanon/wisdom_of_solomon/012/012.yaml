translation:
  language: en
  text: For who will say to you, “What have you done?” Who will oppose your judgment? Who will bring a charge against you for destroying the nations? Who will come before you as an avenger against unrighteous men?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek expression is difficult and may mean, “Who will come forward to oppose you as an avenger against unjust people?”
    reason: lexical_alternative
