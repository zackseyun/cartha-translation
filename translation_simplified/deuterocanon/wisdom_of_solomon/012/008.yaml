translation:
  language: en
  text: Even so, you spared them because they were human. You sent hornets ahead of your army to destroy them little by little.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The hornets recall other passages where God sends stinging insects ahead of Israel against hostile peoples; see Exodus 23:28; Deuteronomy 7:20; Joshua 24:12.
    reason: cross_reference
  - marker: b
    text: The Greek word translated “army” can also mean “camp”; either way, the military image remains.
    reason: lexical_alternative
