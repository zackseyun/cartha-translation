translation:
  language: en
  text: For from the beginning, they were a cursed seed—a whole line of people under a curse.[a] Without fearing anyone, you gave them no pardon for the sins they committed.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “seed,” meaning offspring or a line of people.
    reason: lexical_alternative
  - marker: b
    text: Or, “Without deferring to anyone, you gave them no immunity for the sins they committed.”
    reason: alternative_reading
