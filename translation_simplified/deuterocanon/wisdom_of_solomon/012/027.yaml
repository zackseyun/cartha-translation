translation:
  language: en
  text: They suffered and became angry because of the very things they believed were gods. But while they were being punished by those same things, they saw and recognized that the one they had once refused to know was the true God.[a] So the final outcome of condemnation came upon them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “they truly came to know the God whom they had once refused to know.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: in the very things by which they themselves suffered and were indignant
  simplified_phrase: They suffered and became angry because of the very things
  preserved_meaning: Their suffering and anger were tied to the same objects later used to punish them.
  reasoning_layer_used: Lexical decisions for ἐφʼ οἷς, πάσχοντες, and ἠγανάκτουν
  rationale: The dense opening clause becomes a direct sentence while keeping its emotional force and rhetorical link.
- pob_phrase: those things they thought were gods—by these, while being punished
  simplified_phrase: the very things they believed were gods ... while they were being punished by those same things
  preserved_meaning: The objects they wrongly regarded as gods became the means of their punishment.
  reasoning_layer_used: Lexical decisions for ἐδόκουν θεούς and ἐν αὐτοῖς κολαζόμενοι
  rationale: Repeating “those same things” makes the verse’s irony easy to follow.
- pob_phrase: the final end of condemnation came upon them
  simplified_phrase: the final outcome of condemnation came upon them
  preserved_meaning: Condemnation reached its climactic endpoint and overtook them.
  reasoning_layer_used: Lexical decisions for τὸ τέρμα τῆς καταδίκης and ἐπʼ αὐτοὺς ἐπῆλθεν
  rationale: “Final outcome” removes redundancy without narrowing condemnation to punishment alone.
translation_notes:
  risk_flags:
  - risk: The Greek may mean either “the true God” or “truly came to know God.”
    mitigation: The main text keeps POB’s preferred reading, and the footnote preserves the alternative.
  - risk: Saying they were punished “by” those things may sound as if the supposed gods acted independently.
    mitigation: The wording follows POB’s instrumental reading without granting those objects real divinity.
