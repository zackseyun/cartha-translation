simplification_decisions:
- pob_phrase: when your perfect power is disbelieved
  simplified_phrase: when people doubt that your power is complete
  preserved_meaning: Doubt about the fullness of God's power becomes the occasion for him to display his strength.
  reasoning_layer_used: lexical and theological decisions
  rationale: The active wording is easier to understand while preserving the POB's chosen reading and its ambiguity in a footnote.
- pob_phrase: among those who know it
  simplified_phrase: of those who know your power
  preserved_meaning: The people in view know God's power.
  reasoning_layer_used: lexical decision for ἐν τοῖς εἰδόσι
  rationale: Naming “your power” makes the implicit object immediately clear.
- pob_phrase: boldness
  simplified_phrase: arrogance
  preserved_meaning: The boldness is blameworthy audacity rather than commendable courage.
  reasoning_layer_used: lexical decision for θράσος
  rationale: “Arrogance” directly communicates the negative sense established by the context.
