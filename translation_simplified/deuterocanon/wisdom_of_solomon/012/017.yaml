translation:
  language: en
  text: For you show your strength when people doubt that your power is complete,[a] and you expose the arrogance of those who know your power.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “when people distrust you concerning the fullness of your power.”
