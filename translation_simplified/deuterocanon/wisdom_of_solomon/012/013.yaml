translation:
  language: en
  text: For no god exists besides you, the one who cares for all. You do not have to prove to another god that you did not judge unjustly.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “so that you should show that you did not judge unjustly.”
    reason: simplification_note
simplification_decisions:
- pob_phrase: there is no god besides you who cares for all
  simplified_phrase: no god exists besides you, the one who cares for all
  preserved_meaning: God alone is deity, and his care extends to all.
  reasoning_layer_used: Lexical and theological decisions on θεός, πλὴν σοῦ, and πάντων.
  rationale: The recast wording clearly separates God's unique deity from his universal care.
- pob_phrase: so that you should show
  simplified_phrase: You do not have to prove to another god
  preserved_meaning: No other god can require God to demonstrate that his judgment was not unjust.
  reasoning_layer_used: Source syntax, immediate logic, and the POB purpose-result connection.
  rationale: Naming “another god” makes the contextual implication clear without broadening it to every possible observer.
- pob_phrase: you did not judge unjustly
  simplified_phrase: you did not judge unjustly
  preserved_meaning: The source denies injustice rather than replacing that denial with a positive formulation.
  reasoning_layer_used: Lexical and theological decision on οὐκ ἀδίκως.
  rationale: The deliberate negative wording retains the Greek rhetorical force.
interpretive_expansions:
- pob_phrase: so that you should show
  rendering: You do not have to prove to another god
  claim: Because no other god exists, God need not demonstrate his justice to another god.
  evidence:
  - The preceding clause explicitly denies that any god exists besides the one addressed.
  - The following clause concerns demonstrating that God's judgment was not unjust.
  - The POB connects God's uniqueness with the showing of his justice.
  confidence: moderate
  alternatives_preserved:
  - The footnote preserves the direct purpose wording, “so that you should show.”
translation_notes:
  risk_flags:
  - risk: “You do not have to prove” makes an implied consequence more explicit than the Greek form.
    mitigation: The footnote preserves the POB's direct purpose-result construction.
  - risk: “Another god” supplies an unstated object for “prove.”
    mitigation: The object is restricted to the divine comparison in the immediately preceding clause.
