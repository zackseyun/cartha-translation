translation:
  language: en
  text: To care about Wisdom’s instruction is to love her. To love her is to keep her laws. Paying careful attention to her laws brings assurance of freedom from decay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be translated “immortality” or “imperishability”; the Greek speaks literally of freedom from corruption or decay.
    reason: lexical_alternative
