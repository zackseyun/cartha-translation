translation:
  language: en
  text: For she goes about looking for those who are worthy of her. She graciously appears to them along their paths and meets them in all their plans.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “in every thought” or “in every intention.”
