    mitigation: “How it came to be” and “its origin” preserve the POB ambiguity without defining the manner of wisdom’s origin.
  - risk: “Mysteries” may sound less immediately clear than “secrets.”
    mitigation: The term is retained because the POB reasoning protects its greater biblical weight.
