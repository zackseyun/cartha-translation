translation:
  language: en
  text: The Lord gave you authority to govern, and the Most High gave you power to rule. He will examine what you do and thoroughly investigate your plans.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: authority was given to you by the Lord
  simplified_phrase: The Lord gave you authority to govern
  preserved_meaning: The rulers’ governing authority comes from the Lord.
  reasoning_layer_used: Lexical decision for κράτησις and παρὰ τοῦ κυρίου
  rationale: The active sentence is easier to read while preserving God as the source of political authority.
- pob_phrase: sovereignty by the Most High
  simplified_phrase: the Most High gave you power to rule
  preserved_meaning: The rulers’ sovereign power comes from the Most High.
  reasoning_layer_used: Lexical and theological decisions for δυναστεία and Ὕψιστος
  rationale: “Power to rule” makes the political meaning of “sovereignty” immediately clear.
- pob_phrase: examine your works and investigate your plans
  simplified_phrase: examine what you do and thoroughly investigate your plans
  preserved_meaning: God will judge both the rulers’ actions and their deliberate plans.
  reasoning_layer_used: Lexical decisions for ἐξετάσει, διεραυνήσει, and βουλάς
  rationale: Common wording replaces “works,” while “thoroughly” preserves the intensified searching verb.
interpretive_expansions:
