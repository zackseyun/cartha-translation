translation:
  language: en
  text: because, although you were officials serving under his rule, you did not judge rightly, obey the law, or live according to God’s purpose.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: ministers of his kingdom
  simplified_phrase: officials serving under his rule
  preserved_meaning: The rulers exercise public authority as subordinates under God’s kingship.
  reasoning_layer_used: lexical and theological decisions
  rationale: This avoids the clerical sense of “ministers” while retaining both official authority and subordinate service.
- pob_phrase: keep the law
  simplified_phrase: obey the law
  preserved_meaning: They failed to follow the governing moral and legal standard.
  reasoning_layer_used: lexical decision
  rationale: “Obey” gives the ordinary modern meaning of keeping a law.
- pob_phrase: walk according to the counsel of God
  simplified_phrase: live according to God’s purpose
  preserved_meaning: Their conduct did not conform to God’s deliberate purpose.
  reasoning_layer_used: lexical decisions and grounding review
  rationale: This expresses the ethical sense of “walk” naturally and uses an audited meaning of “counsel.”
translation_notes:
  risk_flags:
  - risk: “Purpose” may convey less deliberation than “counsel.”
    mitigation: The wording follows an approved lexical alternative and preserves God’s purpose as the standard for their conduct.
