translation:
  language: en
  text: But then he takes a discarded scrap—a crooked, knot-filled piece of wood that is good for nothing. Yet he carefully carves it in his idle time. Using his skill in his leisure time, he shapes it to look like a man,
  philosophy: optimal-equivalence
