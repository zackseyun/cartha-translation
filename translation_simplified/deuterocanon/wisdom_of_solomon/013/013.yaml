  reasoning_layer_used: POB lexical decisions for ἀπόβλημα and εἰς οὐδὲν εὔχρηστον
  rationale: “Discarded scrap” clearly identifies the refuse as leftover wood.
- pob_phrase: a crooked piece of wood and full of knots
