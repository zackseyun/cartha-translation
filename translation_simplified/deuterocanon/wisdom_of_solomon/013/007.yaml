translation:
  language: en
  text: For as they move among his works, they study them closely. They are persuaded by what they see, because the visible things are beautiful.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the visible things are good.” The Greek word can mean either “beautiful” or “good”; “beautiful” fits the emphasis on sight here.
    reason: lexical_alternative
