translation:
  language: en
  text: When he seeks life, he considers a dead thing worthy to provide it. When he needs help, he begs one with no experience at all. And for a journey,[a] he turns to one that cannot even use its own foot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean that it cannot even use its base or pedestal; either way, the idol cannot move itself.
    reason: lexical_alternative
