  preserved_meaning: Wisdom is pictured as flowing from God’s glory and as wholly pure.
  reasoning_layer_used: POB lexical decisions on ἀπόρροια and εἰλικρινής
  rationale: “Outflow” preserves the source image in more familiar language than “emanation.”
- pob_phrase: nothing defiled enters into her
