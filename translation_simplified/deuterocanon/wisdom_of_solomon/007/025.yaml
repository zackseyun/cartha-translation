  preserved_meaning: No moral or ritual contamination gains access to personified Wisdom.
  reasoning_layer_used: POB lexical decision on παρεμπίπτει and theological decision on feminine personification
  rationale: The shorter wording states the exclusion naturally while retaining “her.”
