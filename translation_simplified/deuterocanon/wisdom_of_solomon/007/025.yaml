translation:
  language: en
  text: She is a breath[a] from the power of God, a pure outflow from the glory of the Almighty. Therefore, nothing defiled can enter her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “vapor” or “exhalation,” something rising from its source.
    reason: lexical_alternative
