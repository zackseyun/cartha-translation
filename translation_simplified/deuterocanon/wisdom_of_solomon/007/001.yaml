simplification_decisions:
- pob_phrase: For I also am a mortal man, equal to all
  simplified_phrase: I too am mortal, equal to everyone else
  preserved_meaning: The speaker shares the mortality and common human status of all people.
  reasoning_layer_used: Lexical decisions for θνητός and ἴσος ἅπασιν
  rationale: The shorter wording keeps both mortality and equality in natural English.
- pob_phrase: a descendant of the earth-born first-formed man
  simplified_phrase: a descendant of the first man formed from the earth
  preserved_meaning: The speaker descends from humanity’s first formed ancestor, who came from the earth.
  reasoning_layer_used: Lexical and theological decisions for γηγενοῦς and πρωτοπλάστου
  rationale: The concrete earth image remains while the difficult compound description becomes clear.
- pob_phrase: in my mother’s womb I was molded into flesh
  simplified_phrase: in my mother’s womb I was shaped into flesh
  preserved_meaning: The speaker’s flesh was formed before birth.
  reasoning_layer_used: Lexical decisions for ἐγλύφην and σάρξ
  rationale: “Shaped” is more familiar than “molded” while preserving passive formation and literal flesh.
