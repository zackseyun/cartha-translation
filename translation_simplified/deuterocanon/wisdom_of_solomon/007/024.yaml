translation:
  language: en
  text: Wisdom can move more readily than anything that moves.[a] Because she is pure, she passes through and penetrates everything.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Wisdom is more active than all motion.” The Greek emphasizes her surpassing ability to move.
    reason: lexical_alternative
  - marker: b
    text: The Greek speaks of wisdom as feminine, so the verse uses “she.”
    reason: cultural_note
