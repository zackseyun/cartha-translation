translation:
  language: en
  text: For wisdom, who skillfully crafts all things, taught me. Within her is a spirit that is intelligent, holy, unique,[a] many-sided, subtle, quick-moving, clear, undefiled, distinct, unharmed,[b] loving what is good, keen, unhindered, and active in doing good.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “only-begotten” or “one of a kind.” Here “unique” best fits the context.
    reason: lexical_alternative
  - marker: b
    text: The Greek may also mean “harmless,” describing one who causes no harm.
    reason: lexical_alternative
