  preserved_meaning: The wicked man caused the flood judgment, which was overtaking the earth.
  reasoning_layer_used: Lexical decision for δι' ὃν and immediate literary context.
  rationale: Two short sentences clarify the cause and setting without changing their relationship.
- pob_phrase: wisdom again saved it
