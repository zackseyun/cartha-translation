  preserved_meaning: Wisdom brought the earth safely through the flood by preserving life upon it.
  reasoning_layer_used: Lexical rationale for διέσωσεν and its object γῆν.
  rationale: The wording makes the intended sense of saving the earth understandable without implying rescue of the planet itself.
- pob_phrase: steering the righteous man by means of a humble piece of wood
  simplified_phrase: steering Noah, the righteous man, by means of a humble piece of wood—the ark
  preserved_meaning: Personified wisdom piloted Noah through the flood using the lowly material means of the ark.
  reasoning_layer_used: Lexical decisions for κυβερνήσασα, τὸν δίκαιον, and δι' εὐτελοῦς ξύλου.
  rationale: Naming Noah and the ark explains the allusion while retaining the nautical action and humble-wood image.
