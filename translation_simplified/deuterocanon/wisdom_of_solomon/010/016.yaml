translation:
  language: en
  text: She entered the soul of a servant of the Lord.[a] She stood against terrifying kings with wonders and signs.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: From the context, this servant of the Lord is understood to be Moses.
    reason: cross_reference
  - marker: b
    text: Or “by wonders and signs.” The Greek may describe either the means she used or what accompanied her action.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: entered into the soul
  simplified_phrase: entered the soul
  preserved_meaning: Wisdom is pictured as entering the servant’s soul.
  reasoning_layer_used: POB lexical decisions for εἰσῆλθεν and ψυχήν
  rationale: Removing “into” makes the image more natural in modern English without weakening it.
- pob_phrase: and stood against
  simplified_phrase: She stood against
  preserved_meaning: Wisdom actively resisted the kings.
  reasoning_layer_used: POB lexical decision for ἀντέστη and theological decision on Wisdom’s gender
  rationale: A new sentence clarifies the action while retaining the vivid image and feminine subject.
- pob_phrase: fearsome kings
  simplified_phrase: terrifying kings
  preserved_meaning: The kings caused others to fear them.
  reasoning_layer_used: POB lexical decision for φοβεροῖς
  rationale: “Terrifying” immediately shows that these kings inspired fear.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “soul” too narrowly as emotion or psychology.
    mitigation: The term remains because the POB audit gives it broader anthropological and theological force.
  - risk: “With wonders and signs” may be read as either means or accompanying circumstance.
    mitigation: Its placement avoids strongly favoring either sense, and footnote b states the ambiguity.
