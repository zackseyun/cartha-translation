  simplified_phrase: 'Its wickedness still has these witnesses:'
  preserved_meaning: The ruined features that follow continue to testify to the wickedness previously described.
  reasoning_layer_used: POB syntax and lexical decision for μαρτύριον
  rationale: The colon clearly introduces the list while preserving the image of witnesses.
- pob_phrase: a smoking wasteland
  simplified_phrase: a wasteland that continues to smoke
  preserved_meaning: The devastated land remains visibly smoking.
  reasoning_layer_used: POB lexical decisions for καπνιζομένη and χέρσος
  rationale: A finite clause makes the continuing image natural in common English.
- pob_phrase: a pillar of salt standing as a memorial of an unbelieving soul
  simplified_phrase: a pillar of salt that still stands as a memorial of a soul that did not believe
  preserved_meaning: The standing salt pillar memorializes an unnamed person marked by unbelief or faithlessness.
  reasoning_layer_used: POB lexical and theological decisions for ἀπιστούσης ψυχῆς and στήλη ἁλός
  rationale: The revision clarifies the clause without implying honor or deliberate refusal.
