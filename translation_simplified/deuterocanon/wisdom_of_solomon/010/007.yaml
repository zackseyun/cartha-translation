translation:
  language: en
  text: 'Its wickedness still has these witnesses: a wasteland that continues to smoke, plants whose fruit never ripens, and a pillar of salt that still stands as a memorial of a soul that did not believe.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The pillar of salt alludes to Lot’s wife in Genesis 19:26, though she is not named here.
    reason: cross_reference
  - marker: b
    text: Or “a faithless soul.”
    reason: lexical_alternative
