translation:
  language: en
  text: She protected him from his enemies and kept him safe from those waiting to ambush him. She awarded him a hard struggle,[a] so that he would learn that godliness[b] is stronger than everything.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek uses the language of both a contest and the awarding of a prize; it may also mean “a mighty contest” or “the prize in a hard struggle.”
    reason: lexical_alternative
  - marker: b
    text: Or “piety”; this means reverent devotion to God shown in the way a person lives.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: from those lying in ambush she kept him safe
  simplified_phrase: kept him safe from those waiting to ambush him
  preserved_meaning: Wisdom protects him from people preparing a hidden attack.
  reasoning_layer_used: The lexical decision preserves the concrete ambush image.
  rationale: Ordinary clause order and an active verb make the danger immediately clear.
- pob_phrase: she awarded him a strong contest
  simplified_phrase: She awarded him a hard struggle
  preserved_meaning: Wisdom assigns a difficult conflict using contest-and-prize imagery.
  reasoning_layer_used: The adjudicated lexical and theological decisions favor “hard struggle” without reducing it to victory.
  rationale: “Hard struggle” is clearer than “strong contest,” while “awarded” retains the deliberate tension of the image.
- pob_phrase: so that he might know
  simplified_phrase: so that he would learn
  preserved_meaning: The struggle serves the purpose of teaching him godliness’s superior strength.
  reasoning_layer_used: The lexical alternatives explicitly permit “that he might learn.”
  rationale: “Would learn” naturally expresses knowledge gained through experience.
