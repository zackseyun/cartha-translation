translation:
  language: en
  text: She led the righteous man along straight paths as he fled his brother’s anger. She showed him God’s kingdom and taught him about holy things.[a] She made his hard work successful and increased the fruits of his labor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “taught him about holy ones.” The Greek can refer to sacred things or to holy persons or beings.
    reason: alternative_reading
  - marker: b
    text: Here the wording refers to what his labor produced, rather than to increased hardship.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: guided the righteous man, a fugitive from his brother’s anger, in straight paths
  simplified_phrase: led the righteous man along straight paths as he fled his brother’s anger
  preserved_meaning: Wisdom directed the righteous man while he fled because of his brother’s anger.
  reasoning_layer_used: POB lexical decisions on φυγάδα and ὡδήγησεν ἐν τρίβοις εὐθείαις
  rationale: The recast sentence is easier to follow and retains both the flight and the straight-path image.
- pob_phrase: gave him knowledge of holy things
  simplified_phrase: taught him about holy things
  preserved_meaning: Wisdom enabled him to know sacred realities without excluding the alternate sense “holy ones.”
  reasoning_layer_used: POB lexical and theological decisions on γνῶσιν ἁγίων
  rationale: The common wording communicates gained knowledge while the footnote preserves the ambiguity.
- pob_phrase: prospered him in his labors, and increased the fruits of his toil
  simplified_phrase: made his hard work successful and increased the fruits of his labor
  preserved_meaning: Wisdom granted success and greater results from his difficult work.
  reasoning_layer_used: POB lexical and theological decisions on εὐπόρησεν and πόνους
  rationale: Direct English replaces the uncommon construction without losing the productive outcome of his labor.
