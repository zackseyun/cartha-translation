  preserved_meaning: Personified Wisdom accompanied him into imprisonment and did not leave him there.
  reasoning_layer_used: Lexical decisions for συγκατέβη, λάκκος, δεσμοί, and ἀφίημι
  rationale: The reordered sentence makes the imprisonment clear while preserving the pit image and Wisdom’s faithful presence.
