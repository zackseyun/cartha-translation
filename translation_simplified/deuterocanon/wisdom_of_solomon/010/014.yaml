translation:
  language: en
  text: She went down into the pit[a] with him and did not abandon him while he was in chains. She remained with him until she brought him the scepter of a kingdom and authority over those who had ruled him. She proved that those who had slandered him were false, and she gave him everlasting glory.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “pit,” which may refer to a dungeon, prison pit, or cistern.
    reason: lexical_alternative
