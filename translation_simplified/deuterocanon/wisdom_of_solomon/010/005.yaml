translation:
  language: en
  text: She also found the righteous man when nations, united in an evil purpose, were thrown into confusion. She kept him blameless before God and kept him steadfast despite his tender feelings for his child.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In context, “the righteous man” likely refers to Abraham, but the Greek does not name him.
    reason: cross_reference
