translation:
  language: en
  text: For God did not make death,[a] and he takes no pleasure in the destruction of living beings.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “did not create death.” The Greek verb can mean either “make” or “create”; “make” is used here because it does not add further claims about creation.
    reason: lexical_alternative
