translation:
  language: en
  text: For a holy spirit that brings discipline will flee from deceit. It will rise up and move away from senseless thoughts, and it will be exposed when unrighteousness comes against it.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also be translated “the Holy Spirit that brings discipline.”
    reason: alternative_reading
  - marker: b
    text: “Be exposed” may also mean “be reproved” or “be convicted.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a holy spirit of discipline
  simplified_phrase: a holy spirit that brings discipline
  preserved_meaning: The spirit is holy and provides morally formative correction.
  reasoning_layer_used: lexical and theological decisions
  rationale: The verbal form explains the spirit’s disciplining role without making the phrase a fixed divine title.
- pob_phrase: will rise up away from senseless thoughts
  simplified_phrase: will rise up and move away from senseless thoughts
  preserved_meaning: The spirit actively rises and separates itself from thinking that lacks understanding.
  reasoning_layer_used: lexical decision and doctrine realignment
  rationale: The added verb makes the upward-and-away image natural in modern English.
- pob_phrase: when unrighteousness comes upon it
  simplified_phrase: when unrighteousness comes against it
  preserved_meaning: Unrighteousness moves toward the holy spirit and exposes their incompatibility.
  reasoning_layer_used: lexical and theological decisions
  rationale: “Comes against” preserves the directed force of arrival more clearly than “comes near.”
interpretive_expansions:
- pob_phrase: a holy spirit of discipline
  rendering: a holy spirit that brings discipline
  claim: The spirit provides discipline rather than merely possessing it.
