translation:
  language: en
  text: Do not pursue death through your mistaken way of life. Do not bring destruction on yourselves by what your own hands do.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: court death by the error of your life
  simplified_phrase: pursue death through your mistaken way of life
  preserved_meaning: A wrongly directed way of life actively leads toward death.
  reasoning_layer_used: POB lexical and theological decisions for ζηλοῦτε and ἐν πλάνῃ
  rationale: “Pursue” keeps the force of seeking or inviting death, while “mistaken way of life” makes the source of danger clear.
- pob_phrase: draw destruction upon yourselves
  simplified_phrase: bring destruction on yourselves
  preserved_meaning: Their own conduct causes ruin to come upon them.
  reasoning_layer_used: POB middle-voice decision for ἐπισπᾶσθε
  rationale: The simpler wording retains the verb’s reflexive force.
- pob_phrase: by the works of your hands
  simplified_phrase: by what your own hands do
  preserved_meaning: Destruction comes through their deeds, expressed with the concrete image of their hands.
  reasoning_layer_used: POB lexical decision and cultural note for ἔργοις χειρῶν ὑμῶν
  rationale: This recasts the idiom in natural English without removing its hand imagery.
translation_notes:
  risk_flags:
  - risk: “What your own hands do” may be understood only as literal manual work.
    mitigation: The phrase remains broad enough to denote deeds while preserving the source image and possible resonance with things people make.
