  simplified_phrase: You who judge the earth, love righteousness
  preserved_meaning: Earthly judges are commanded to love righteousness.
  reasoning_layer_used: POB lexical and theological decisions on δικαιοσύνη and οἱ κρίνοντες τὴν γῆν
  rationale: Reordering the address makes the command easier to follow without narrowing judges to rulers.
- pob_phrase: think about the Lord with goodness
  simplified_phrase: Let goodness shape how you think about the Lord
  preserved_meaning: Thought about the Lord must arise from a good and upright disposition.
  reasoning_layer_used: POB lexical decision on ἐν ἀγαθότητι
  rationale: The active wording makes the relationship between goodness and thought clear in natural English.
- pob_phrase: with singleness of heart
  simplified_phrase: with an undivided heart
  preserved_meaning: The Lord is to be sought with sincere, wholehearted devotion.
  reasoning_layer_used: POB lexical decision on ἐν ἁπλότητι καρδίας
  rationale: “Undivided” explains the biblical heart image more directly than “singleness.”
