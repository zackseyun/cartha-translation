translation:
  language: en
  text: You who judge the earth[b], love righteousness[a]. Let goodness shape how you think about the Lord, and seek him with an undivided heart.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “justice.” The Greek word includes both moral uprightness and justice.
    reason: lexical_alternative
  - marker: b
    text: Or “you rulers of the earth.” The Greek literally says “you who judge the earth.”
    reason: lexical_alternative
simplification_decisions:
