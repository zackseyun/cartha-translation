translation:
  language: en
  text: For God's jealous ear hears everything,[a] and no muttered complaint can be hidden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also mean “God's zealous ear,” but “jealous” emphasizes his vigilant intolerance of wrongdoing, not sinful envy.
    reason: lexical_alternative
