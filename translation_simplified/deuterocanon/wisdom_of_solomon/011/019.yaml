  preserved_meaning: The foul smoke keeps the agricultural image of matter tossed in the air during winnowing.
  reasoning_layer_used: lexical decision and theological decision on vivid imagery
  rationale: The chaff comparison makes the unfamiliar winnowing image immediately clear.
- pob_phrase: whose harm was able not only to crush them together
  simplified_phrase: The harm from these things could crush them
  preserved_meaning: The smoke and sparks could inflict devastating physical harm without forcing a collective sense for the compound verb.
  reasoning_layer_used: lexical decisions for βλάβη and συνεκτρῖψαι
  rationale: The direct clause removes awkward syntax and avoids the unwarranted exhaustive claim in “crush them all.”
- pob_phrase: but even their frightening appearance to destroy them
  simplified_phrase: and even their frightening appearance could destroy them
  preserved_meaning: The escalation from damaging force to a terrifying and destructive appearance remains intact.
  reasoning_layer_used: lexical decisions for ἡ ὄψις ἐκφοβήσασα and διολέσαι
  rationale: A complete clause clarifies the escalation without adding that appearance acts independently of all harm.
