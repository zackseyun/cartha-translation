translation:
  language: en
  text: To you, the whole world is like a speck on a set of scales.[a] It is like a drop of morning dew falling to the ground.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “the slightest movement of the scales” or “a tiny weight on the scales.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the whole world before you
  simplified_phrase: To you, the whole world
  preserved_meaning: The entire world is portrayed as extremely small in relation to God.
  reasoning_layer_used: The lexical decision for ἐναντίον σου preserves both God's presence and the comparison.
  rationale: The new order uses natural English while keeping God as the point of comparison.
- pob_phrase: a speck on the scales
  simplified_phrase: a speck on a set of scales
  preserved_meaning: The weighing image shows something extremely slight.
  reasoning_layer_used: The lexical decisions for ῥοπὴ and πλαστίγγων control the image.
  rationale: Adding “a set of” helps readers picture a weighing balance rather than a numbered rating.
- pob_phrase: and like a drop of morning dew that falls upon the earth
  simplified_phrase: It is like a drop of morning dew falling to the ground.
  preserved_meaning: The world is compared to one tiny, transient drop descending onto the earth.
  reasoning_layer_used: The lexical decisions for ῥανίς, δρόσου ὄρθρινή, and κατελθοῦσα ἐπὶ γῆν preserve the full second image.
  rationale: A separate sentence and common wording make the image easier to grasp.
