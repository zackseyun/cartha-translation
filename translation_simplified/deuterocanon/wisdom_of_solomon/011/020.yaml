  text: Even apart from all this, a single breath[a] could have made them fall. Justice[b] could have pursued them, and the breath of your power could have scattered them like chaff. But you arranged everything by measure, number, and weight.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a single wind” or “one spirit”; the Greek word can mean breath, wind, or spirit.
