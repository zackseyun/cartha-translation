translation:
  language: en
  text: But they went astray through the foolish reasoning of their unrighteousness and worshiped unreasoning creatures that crawl and worthless beasts. In return for this, you sent many unreasoning animals upon them as punishment.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the foolish reasonings of their unrighteousness, by which, having been led astray
  simplified_phrase: they went astray through the foolish reasoning of their unrighteousness
  preserved_meaning: Their morally corrupt reasoning was the means by which they went astray, without defining the genitive as a causal sequence.
  reasoning_layer_used: lexical and theological decisions for λογισμῶν, ἀδικίας, ἐν οἷς, and πλανηθέντες
  rationale: The dense clause becomes direct English while keeping the relationship between reasoning and unrighteousness neutral.
- pob_phrase: irrational creeping things ... irrational animals
  simplified_phrase: unreasoning creatures that crawl ... unreasoning animals
  preserved_meaning: Both groups lack reason, preserving the ironic repetition linking their worship with their punishment.
  reasoning_layer_used: theological decision on repeated ἄλογος language
  rationale: “Unreasoning” and “creatures that crawl” are clearer while retaining the repeated source-language image.
- pob_phrase: in return for ... you sent upon them a multitude ... for punishment
  simplified_phrase: In return for this, you sent many ... upon them as punishment
  preserved_meaning: God sent numerous animals upon them as judicial recompense for the idolatry just described.
  reasoning_layer_used: lexical decisions for ἀντί, πλῆθος, ἐπαπέστειλας, and ἐκδίκησιν
  rationale: “For this” makes the punitive correspondence explicit after the sentence is divided.
