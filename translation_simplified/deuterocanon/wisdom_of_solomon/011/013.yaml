translation:
  language: en
  text: For when the Egyptians heard that the Israelites were being helped through the punishments they themselves suffered, they recognized the Lord.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “they became aware of the Lord.” This does not necessarily mean that they fully believed in him.
    reason: lexical_alternative
