- pob_phrase: those very people were being benefited
  simplified_phrase: the Israelites were being helped
  preserved_meaning: The Israelites received good while the Egyptians were being punished.
  reasoning_layer_used: POB lexical and theological decisions on εὐεργετουμένους and αὐτούς
  rationale: “Being helped” states the passive benefit in ordinary English while naming the intended group.
- pob_phrase: through their own punishments
  simplified_phrase: through the punishments they themselves suffered
  preserved_meaning: The Egyptians’ punishments became the means by which the Israelites received help.
  reasoning_layer_used: POB lexical decision on διὰ τῶν ἰδίων κολάσεων
  rationale: The rewrite makes the ironic contrast and the owner of the punishments easy to follow.
