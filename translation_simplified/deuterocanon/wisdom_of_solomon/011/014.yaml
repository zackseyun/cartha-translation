translation:
  language: en
  text: For they had mocked and rejected the one who long ago was abandoned and cast out as a baby.[a] But when those events reached their final outcome, they were astonished,[b] after suffering thirst unlike that of the righteous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This refers to Moses, who was abandoned as a baby and cast out.
    reason: cross_reference
  - marker: b
    text: Or “when those events came to an end”; the Greek may emphasize either their conclusion or their final result.
    reason: lexical_alternative
