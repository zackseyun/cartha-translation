translation:
  language: en
  text: For you love everything that exists. You do not detest anything you have made. If you had hated something, you would not have formed it.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: all things that exist
  simplified_phrase: everything that exists
  preserved_meaning: God's love extends to the full breadth of existing things.
  reasoning_layer_used: lexical decision for τὰ ὄντα πάντα
  rationale: “Everything” states the same broad scope in more natural common English.
- pob_phrase: and you detest none of the things you made
  simplified_phrase: You do not detest anything you have made.
  preserved_meaning: God does not loathe anything he created.
  reasoning_layer_used: lexical decisions for βδελύσσῃ and ἐποίησας
  rationale: A separate direct sentence makes the strong negative claim easier to follow.
- pob_phrase: you would not have fashioned it
  simplified_phrase: you would not have formed it
  preserved_meaning: God would not have deliberately brought into form something he hated.
  reasoning_layer_used: lexical decision for κατεσκεύασας
  rationale: “Formed” is clearer than “fashioned” while retaining a distinction from “made.”
translation_notes:
  risk_flags:
  - risk: The statement could be read as saying God approves every present condition of creation.
    mitigation: The wording stays with God's love for what exists and does not add claims about every condition or action.
