translation:
  language: en
  text: Send her out from the holy heavens, and send her from the throne of your glory, so that she may be with me and labor alongside me, and I may know what pleases you.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: so that, being present with me, she may labor with me, and I may know
  simplified_phrase: so that she may be with me and labor alongside me, and I may know
  preserved_meaning: Wisdom’s presence and shared labor, together with the speaker’s knowing, are purposes of the sending.
  reasoning_layer_used: Greek purpose structure and lexical decisions for συνπαροῦσά, κοπιάσῃ, and γνῶ.
  rationale: Finite verbs clarify the coordinated results while keeping them under “so that.”
- pob_phrase: what is pleasing to you
  simplified_phrase: what pleases you
  preserved_meaning: The speaker seeks to know what God finds pleasing.
  reasoning_layer_used: POB rendering of τί εὐάρεστόν ἐστιν παρὰ σοί.
  rationale: The active wording is more natural without changing the relation.
- pob_phrase: Send her out from the holy heavens, and send her from the throne of your glory
  simplified_phrase: Send her out from the holy heavens, and send her from the throne of your glory
  preserved_meaning: Wisdom is sent from God’s holy heavenly realm and glorious throne.
  reasoning_layer_used: Lexical decisions for ἐξαπόστειλον, ἐξ ἁγίων οὐρανῶν, and ἀπὸ θρόνου δόξης σου.
  rationale: The parallel requests retain the directional force and heavenly imagery.
translation_notes:
  risk_flags:
  - risk: Feminine pronouns may surprise readers who understand wisdom only as an abstraction.
    mitigation: They remain because the Greek deliberately personifies Wisdom as feminine.
