translation:
  language: en
  text: He gives no thought to the fact that he will soon grow weary or that his life is short. Instead, he competes with goldsmiths and silversmiths, copies the work of bronze craftsmen, and takes pride in shaping counterfeit objects.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “false things” or “base imitations.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Yet his concern is not that he is about to grow weary
  simplified_phrase: He gives no thought to the fact that he will soon grow weary
  preserved_meaning: The craftsman disregards his approaching exhaustion and human frailty.
  reasoning_layer_used: Lexical decision for φροντίς and μέλλει κάμνειν
  rationale: The recast clause states the contrast in ordinary English without adding emotional anxiety.
- pob_phrase: imitates bronze-workers
  simplified_phrase: copies the work of bronze craftsmen
  preserved_meaning: He imitates the craft practiced by workers in bronze.
  reasoning_layer_used: Lexical decisions for χαλκοπλάστας and μιμεῖται
  rationale: Naming their work avoids suggesting that he mimics the workers personally.
- pob_phrase: considers it a glory that he molds counterfeit things
  simplified_phrase: takes pride in shaping counterfeit objects
  preserved_meaning: He boasts in making objects condemned as false imitations.
  reasoning_layer_used: Lexical and theological decisions for δόξαν ἡγεῖται, πλάσσει, and κίβδηλα
  rationale: The wording makes the ironic pride clear while retaining the judgment expressed by “counterfeit.”
