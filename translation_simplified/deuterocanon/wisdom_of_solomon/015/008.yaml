translation:
  language: en
  text: He labors wickedly, molding a useless god from the same clay. Yet he himself came from the earth only a short time ago, and soon he will return to the earth from which he was taken, when the debt of his soul is demanded from him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “when the debt of his life is demanded from him.” The Greek word can mean either “soul” or “life.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: with wicked toil he molds a futile god
  simplified_phrase: He labors wickedly, molding a useless god
  preserved_meaning: The idol-maker’s hard work is morally corrupt, and the god he makes is empty and ineffective.
  reasoning_layer_used: Lexical decisions for κακόμοχθος, θεὸν μάταιον, and πλάσσει.
  rationale: The recast clause uses common words while retaining the judgment, labor, and clay-shaping image.
- pob_phrase: he who a little before had come from the earth
  simplified_phrase: Yet he himself came from the earth only a short time ago
  preserved_meaning: The craftsman is a recently created mortal whose own origin is the earth.
  reasoning_layer_used: Lexical decisions for ὃς, πρὸ μικροῦ, and ἐκ γῆς γενηθεὶς.
  rationale: A separate sentence makes the contrast between the maker and his handmade god immediately clear.
- pob_phrase: after a short time goes back to the earth from which he was taken
  simplified_phrase: soon he will return to the earth from which he was taken
  preserved_meaning: The craftsman will shortly die and return to the earth that was his source.
  reasoning_layer_used: Lexical decisions for μετʼ ὀλίγον πορεύεται and ἐξ ἧς ἐλήμφθη.
  rationale: “Soon he will return” expresses the same movement in direct modern English.
