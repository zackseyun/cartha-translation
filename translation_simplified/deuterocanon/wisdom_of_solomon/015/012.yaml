translation:
  language: en
  text: But he thinks human life is a game and that the way we live is a festival for making money. He says, “People must get resources from any source—even from evil.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “People must profit wherever they can, even through wrongdoing”; the last phrase may also mean “even from bad circumstances.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: considered our life to be a game
  simplified_phrase: thinks human life is a game
  preserved_meaning: He regards life as something for amusement rather than taking it seriously.
  reasoning_layer_used: Lexical decisions for ἐλογίσατο, παίγνιον, and ζωήν
  rationale: This natural wording keeps his evaluative judgment and the game image.
- pob_phrase: our way of life a profitable festival
  simplified_phrase: the way we live is a festival for making money
  preserved_meaning: He views the conduct of life as a festive opportunity for material gain.
  reasoning_layer_used: Lexical decisions for βίον, πανηγυρισμόν, and ἐπικερδῆ
  rationale: The rewrite preserves the life/way-of-life distinction and clearly states the festival’s profit motive.
- pob_phrase: one must get resources from wherever one can
  simplified_phrase: People must get resources from any source
  preserved_meaning: The speaker claims that resources should be acquired without regard to their source.
  reasoning_layer_used: Lexical decisions for δεῖν, ὅθεν δὴ κἂν, and πορίζειν
  rationale: Common generic wording keeps the acquisitive force without adding a limitation based on need.
translation_notes:
  risk_flags:
  - risk: “Festival for making money” states the commercial force more directly than “profitable festival.”
    mitigation: The lexical rationale for ἐπικερδῆ supports an explicit profit motive while the festival image remains.
  - risk: “From evil” may refer to wrongdoing or, more weakly, bad circumstances.
    mitigation: The main text follows the POB moral reading, and the footnote preserves both alternatives.
