translation:
  language: en
  text: A potter works hard, pressing soft earth and shaping each vessel for our use. From the same clay he makes vessels enslaved to clean uses[a] and vessels for the opposite kind of use. He makes them all in the same way, and he decides how each one will be used.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek pictures these vessels as “slaves” assigned to clean uses.
    reason: lexical_alternative
