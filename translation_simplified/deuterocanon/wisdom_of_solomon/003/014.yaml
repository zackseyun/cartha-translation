translation:
  language: en
  text: And the eunuch who has not committed a lawless act with his hand or formed evil thoughts against the Lord will be given the chosen grace of faith[a] and a more delightful inheritance in the Lord’s temple.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “a choice gift of faith,” “the chosen grace of faithfulness,” or “the choicest grace of trust.”
    reason: lexical_alternative
  - marker: b
    text: The Greek may also mean “a more pleasing portion” or “a more desirable allotted share.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: worked lawlessness with his hand
  simplified_phrase: committed a lawless act with his hand
  preserved_meaning: He has not personally carried out an act that violates God’s law.
  reasoning_layer_used: Lexical decisions for ἐργάζομαι, ἀνόμημα, and ἐν χειρί
  rationale: This is natural English while retaining the hand image and moral-legal force.
- pob_phrase: nor conceived evil things against the Lord
  simplified_phrase: or formed evil thoughts against the Lord
  preserved_meaning: He has not inwardly developed evil directed against the Lord.
  reasoning_layer_used: Lexical decisions for μηδὲ ἐνθυμηθεὶς and κατὰ τοῦ κυρίου πονηρά
  rationale: This clearly distinguishes inward thought from outward action.
- pob_phrase: in the temple of the Lord
  simplified_phrase: in the Lord’s temple
  preserved_meaning: The promised inheritance is located in the Lord’s temple.
  reasoning_layer_used: Lexical decision for ἐν ναῷ Κυρίου
  rationale: The possessive form is more natural while preserving both key terms.
translation_notes:
  risk_flags:
  - risk: “The chosen grace of faith” remains compact and allows several nuances.
    mitigation: Footnote a preserves the documented alternatives without resolving the ambiguity.
  - risk: Some readers may understand “eunuch” only as a court title.
    mitigation: The concrete term is retained because the Greek specifically denotes a eunuch.
