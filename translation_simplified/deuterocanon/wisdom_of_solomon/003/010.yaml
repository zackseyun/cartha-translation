translation:
  language: en
  text: But the ungodly will be punished in a way that matches their own reasoning,[a] because they disregarded the righteous man[b] and turned away from the Lord.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “what they thought” or, in this context, “what they plotted.”
    reason: lexical_alternative
  - marker: b
    text: Or “the righteous one,” the representative righteous person in the book’s argument.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: will have punishment according to what they reasoned
  simplified_phrase: will be punished in a way that matches their own reasoning
  preserved_meaning: Their punishment corresponds to their own prior reasoning or designs.
  reasoning_layer_used: Lexical decisions for καθʼ ἃ ἐλογίσαντο and ἕξουσιν ἐπιτιμίαν
  rationale: The natural passive wording clearly expresses the correspondence without narrowing their reasoning to plotting.
- pob_phrase: having neglected the righteous man
  simplified_phrase: because they disregarded the righteous man
  preserved_meaning: Their unconcern for the representative righteous figure is presented as a ground for punishment.
  reasoning_layer_used: Lexical and theological decisions for ἀμελήσαντες and τοῦ δικαίου
  rationale: The finite clause removes the difficult participle while retaining the singular personal referent.
- pob_phrase: having departed from the Lord
  simplified_phrase: turned away from the Lord
  preserved_meaning: They withdrew from God rather than merely changing location.
  reasoning_layer_used: Lexical and theological decisions for τοῦ κυρίου ἀποστάντες
  rationale: “Turned away” expresses spiritual withdrawal in ordinary English while preserving “Lord.”
interpretive_expansions:
- pob_phrase: having neglected the righteous man and having departed from the Lord
  rendering: because they disregarded the righteous man and turned away from the Lord
  claim: The participial actions give the grounds for the ungodly people’s punishment.
  evidence:
  - The participles follow the punishment statement and identify the ungodly by the actions leading to judgment.
  - The immediate argument contrasts the persecuted righteous man with the ungodly who reject him and the Lord.
  confidence: moderate
  alternatives_preserved:
  - while they disregarded the righteous man and turned away from the Lord
translation_notes:
  risk_flags:
