translation:
  language: en
  text: 'The flames did the opposite of what flames normally do: they did not wither the flesh of the perishable creatures walking among them. Nor did they melt the crystal-like ambrosial food,[a] though it could easily melt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ambrosial” describes food associated with immortality; here it poetically refers to the miraculous manna-like food.
    reason: simplification_note
