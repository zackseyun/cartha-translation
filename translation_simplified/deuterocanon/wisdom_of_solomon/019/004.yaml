translation:
  language: en
  text: For the necessity they deserved[a] dragged them to this outcome. It cast forgetfulness over them, so they no longer remembered what had already happened. In this way, they would complete in advance the punishment that their torments had left unfinished.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a fitting necessity”; the phrase combines what they deserved with a force they could not escape.
    reason: lexical_alternative
