translation:
  language: en
  text: Punishments came upon the sinners with the force of thunderbolts, along with evidence from what had already happened.[a] They deserved to suffer for their own wicked acts, because they made a practice of a more severe hatred of strangers.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek is compressed and may also mean that evidence from the earlier events was displayed through the force of the thunderbolts.
    reason: lexical_alternative
  - marker: b
    text: “Hatred of strangers” means active hostility toward foreigners or guests, not merely a failure to welcome them.
    reason: lexical_alternative
