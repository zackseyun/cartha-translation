translation:
  language: en
  text: The whole creation was formed anew from above,[a] each part in its own kind. It obeyed your own commands so that your children might be kept safe from harm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean “was reshaped anew from the beginning.”
    reason: lexical_alternative
