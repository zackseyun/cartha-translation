  preserved_meaning: The created order was refashioned according to its distinct kinds without claiming that those kinds remained unchanged.
  reasoning_layer_used: POB lexical decision for ἐν ἰδίῳ γένει and grounding review
  rationale: “Each part” makes the phrase apply naturally to creation while avoiding the unsupported idea of continuity.
- pob_phrase: serving your own commands
