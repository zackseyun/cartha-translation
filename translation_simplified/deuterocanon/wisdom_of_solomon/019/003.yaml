translation:
  language: en
  text: While they still held the signs of mourning in their hands and cried out in grief at the graves of the dead,[a] they took up another foolish plan. They had pleaded with these people and driven them out, but now they chased them as if they were runaways.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally speaks of having “mourning in their hands,” picturing people still occupied with mourning rites or signs of grief.
    reason: cultural_note
