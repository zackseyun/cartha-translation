  preserved_meaning: The Egyptians reversed their action or attitude concerning Israel’s departure.
  reasoning_layer_used: Lexical and theological decisions on the narrative subject and ἐπιστρέψαντες.
  rationale: Naming both groups clarifies the narrative, while “reversed course” preserves the image of reversal.
- pob_phrase: had sent them on with urgency
  simplified_phrase: had urgently sent them on their way
  preserved_meaning: The Egyptians sent Israel away with haste and earnest pressure.
  reasoning_layer_used: Lexical decisions for μετὰ σπουδῆς and προπέμψαντες.
  rationale: The natural word order retains both urgency and forward movement.
- pob_phrase: they would pursue them, having changed their minds
