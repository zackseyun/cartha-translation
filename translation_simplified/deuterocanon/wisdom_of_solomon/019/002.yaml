translation:
  language: en
  text: because, after the Egyptians themselves had reversed course about letting the Israelites go and had urgently sent them on their way, they changed their minds and pursued them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The opening phrase may also mean that they had returned from letting the Israelites depart or had reversed their decision to let them go; “changed their minds” may also be translated “regretted it.”
    reason: lexical_alternative
