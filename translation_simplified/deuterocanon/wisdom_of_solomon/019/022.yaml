  preserved_meaning: God did not disregard or fail to care for his people.
  reasoning_layer_used: Lexical decision for οὐχ ὑπερεῖδες and POB footnote a
  rationale: The documented alternative “neglect” makes the intended divine care immediately clear.
- pob_phrase: standing by them at every time and place
