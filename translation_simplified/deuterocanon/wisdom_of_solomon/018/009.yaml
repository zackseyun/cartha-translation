translation:
  language: en
  text: The holy descendants of good men were secretly offering sacrifices. United, they established the divine law that the holy ones would share equally in the same good things and the same dangers. Meanwhile, their fathers were already singing hymns of praise in advance.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the holy children of good men
  simplified_phrase: the holy descendants of good men
  preserved_meaning: Faithful members of the Passover generation are identified by their worthy family line, not by their age.
  reasoning_layer_used: POB lexical decision for παῖδες ἀγαθῶν and theological decision on the Passover subjects
  rationale: “Descendants” prevents readers from mistaking them for young children while preserving the genealogical sense.
- pob_phrase: and in unity they established the divine law
  simplified_phrase: United, they established the divine law
  preserved_meaning: The group acted with one mind to set in place a solemn arrangement grounded in God.
  reasoning_layer_used: POB lexical decisions for ἐν ὁμονοίᾳ, διέθεντο, and τὸν τῆς θειότητος νόμον
  rationale: The shorter opening expresses their unity naturally without weakening “established.”
- pob_phrase: were already singing beforehand hymns of praise
  simplified_phrase: were already singing hymns of praise in advance
  preserved_meaning: Their fathers were singing praise ahead of the coming event.
  reasoning_layer_used: POB lexical decision for προαναμελπόντων αἴνους and the grounding review
  rationale: “In advance” preserves the anticipatory force without the awkward repetition of “already” and “beforehand.”
interpretive_expansions:
- pob_phrase: children of good men
  rendering: descendants of good men
  claim: The word describes genealogical descent rather than childhood in this Passover setting.
  evidence:
  - The POB lexical rationale identifies the good men as worthy forefathers or parents.
  - The POB theological rationale identifies the group as faithful Israelites or Jews at Passover.
  confidence: high
  alternatives_preserved:
