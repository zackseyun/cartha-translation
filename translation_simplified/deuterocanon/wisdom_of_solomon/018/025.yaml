translation:
  language: en
  text: The destroyer[a] backed away from this man and feared these things.[b] The experience of wrath alone was enough.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the destroying angel.” The Greek says simply “the destroyer.”
    reason: alternative_reading
  - marker: b
    text: “These things” likely means the priestly signs described in the previous verse, but the Greek does not identify them directly.
    reason: cross_reference
  - marker: c
    text: The Greek may also mean the trial, testing, or proof of wrath.
    reason: lexical_alternative
