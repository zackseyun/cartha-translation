translation:
  language: en
  text: Our fathers[a] were told ahead of time about that night,[b] so that they would know for certain which oaths they had trusted and would take courage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “our ancestors.” The Greek literally says “our fathers.”
    reason: lexical_alternative
  - marker: b
    text: Or “Our fathers knew about that night beforehand.” In context, the night was likely disclosed to them in advance.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: That night was made known beforehand to our fathers
  simplified_phrase: Our fathers were told ahead of time about that night
  preserved_meaning: Israel’s forefathers received advance knowledge of the night.
  reasoning_layer_used: Lexical decisions for προεγνώσθη and πατράσιν ἡμῶν
  rationale: The active recasting makes the disclosure clear without naming who told them.
- pob_phrase: so that, knowing with certainty the oaths in which they had trusted
  simplified_phrase: so that they would know for certain which oaths they had trusted
  preserved_meaning: The disclosure was intended to give them certain knowledge concerning the oaths they trusted.
  reasoning_layer_used: Lexical decisions for ἵνα, ἀσφαλῶς εἰδότες, and οἷς ἐπίστευσαν ὅρκοις
  rationale: The purpose wording and verbal clause clarify that certainty describes their knowing.
- pob_phrase: they might be encouraged
  simplified_phrase: would take courage
  preserved_meaning: Their assured knowledge was intended to strengthen their courage.
  reasoning_layer_used: Lexical decision and doctrine-realignment revision for ἐπευθυμήσωσιν
  rationale: “Take courage” directly preserves the approved contextual force.
translation_notes:
  risk_flags:
