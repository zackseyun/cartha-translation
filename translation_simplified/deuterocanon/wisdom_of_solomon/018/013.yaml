  preserved_meaning: Egyptian occult practices contributed to their unbelief.
  reasoning_layer_used: Lexical decision and POB footnote
  rationale: “Magic arts” is more immediately understandable while the note preserves the occult sense.
- pob_phrase: at the destruction of the firstborn
