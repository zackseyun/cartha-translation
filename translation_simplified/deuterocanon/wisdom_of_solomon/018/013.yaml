translation:
  language: en
  text: Though they had refused to believe everything they had seen because of their magic arts,[a] when the firstborn were destroyed, they acknowledged that this people was God's son.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek refers here to the occult practices of Egypt, traditionally called sorcery.
    reason: lexical_alternative
  - marker: b
    text: “This people” means Israel as a whole, described as God's one son.
    reason: cross_reference
