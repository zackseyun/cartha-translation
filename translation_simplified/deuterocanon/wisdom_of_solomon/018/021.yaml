translation:
  language: en
  text: 'For a blameless man rushed forward to fight at the front. He carried the weapon he used in his service: prayer and atonement made with incense. He stood against the wrath and brought the disaster to an end, showing that he is your servant.'
  philosophy: optimal-equivalence
