  preserved_meaning: The man acted urgently while the military image of frontline combat remains.
  reasoning_layer_used: Lexical decisions for σπεύσας and προεμάχησεν
  rationale: The shorter wording makes the urgent action immediate without weakening the battle metaphor.
- pob_phrase: bringing the weapon of his own service—prayer and atonement by incense
  simplified_phrase: 'He carried the weapon he used in his service: prayer and atonement made with incense.'
  preserved_meaning: Prayer and incense-based atonement remain the weapon associated with his service.
  reasoning_layer_used: Lexical and theological decisions for λειτουργίας, ὅπλον, and ἐξιλασμός
  rationale: A separate sentence and direct explanation make the dense ritual image easier to follow.
- pob_phrase: put an end to the disaster
  simplified_phrase: brought the disaster to an end
  preserved_meaning: His intervention stopped the calamity.
  reasoning_layer_used: Lexical decision for πέρας ἐπέθηκε τῇ συμφορᾷ
  rationale: The revised phrase is more natural in modern narrative English.
