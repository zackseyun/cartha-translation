translation:
  language: en
  text: They had decided to kill the infants of your holy people. But one child was exposed and rescued.[a] Then, as a rebuke, you took away their many children and destroyed them all together in raging water.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The one child likely refers to Moses, who was exposed and then rescued (Exodus 2:3–10).
    reason: cross_reference
  - marker: b
    text: The Greek can also mean “mighty water” or “overwhelming water” and refers to the sea that destroyed them.
    reason: lexical_alternative
