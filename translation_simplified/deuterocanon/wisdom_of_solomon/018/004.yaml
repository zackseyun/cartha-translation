translation:
  language: en
  text: Those men deserved to have light taken away from them and to be imprisoned in darkness, because they had kept your sons confined. Through your sons, the imperishable light of the law was about to be given to the age.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “to the world” or “for all time.” The Greek expression can refer either to the world or to enduring time.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: were worthy to be deprived of light
  simplified_phrase: deserved to have light taken away from them
  preserved_meaning: Their darkness was a deserved punishment, not merely a fitting condition.
  reasoning_layer_used: Lexical decision for ἄξιοι and στερηθῆναι φωτός
  rationale: The active English wording makes the judgment clear while preserving its punitive force.
- pob_phrase: they who had kept your sons shut in
  simplified_phrase: because they had kept your sons confined
  preserved_meaning: The men were judged for imprisoning God's sons, Israel.
  reasoning_layer_used: Lexical and theological decisions for οἱ κατακλείστους φυλάξαντες and τοὺς υἱούς σου
  rationale: A direct reason clause is easier to follow and keeps both the confinement and “sons.”
- pob_phrase: through whom the imperishable light of the law was about to be given
  simplified_phrase: Through your sons, the imperishable light of the law was about to be given
  preserved_meaning: God would give the law's enduring light through Israel.
  reasoning_layer_used: Lexical and theological decisions for διʼ ὧν and τὸ ἄφθαρτον νόμου φῶς
  rationale: Repeating “your sons” removes pronoun confusion without weakening Israel's mediating role.
