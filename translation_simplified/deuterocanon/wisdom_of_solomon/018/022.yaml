translation:
  language: en
  text: He did not overcome the outbreak by physical strength or the power of weapons. Instead, with a word he brought the punisher[a] under control, reminding him of the oaths made to the fathers[b] and of the covenants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the one who was punishing.” The Greek does not say whether this is God, an angelic destroyer, or the force of judgment pictured as a person.
    reason: alternative_reading
  - marker: b
    text: Or “the sworn promises made to the fathers.” This recalls God’s covenant promises to the patriarchs.
    reason: lexical_alternative
