  preserved_meaning: The bird passes through the air but leaves no lasting sign there.
  reasoning_layer_used: The lexical decisions for διωδεύθη and σημεῖον ἐπιβάσεως identify passage through air and its absent mark.
  rationale: The impersonal clause is recast in ordinary English while retaining the repeated absence of evidence.
