  preserved_meaning: The bird leaves no demonstrable mark of its route.
  reasoning_layer_used: The lexical decision for τεκμήριον πορείας allows “trace of its journey.”
  rationale: “Trace” expresses the image more directly for common readers.
- pob_phrase: whipped by the stroke of its pinions and split by force with the whirring of moving wings
  simplified_phrase: Its beating wings whip the light air and force it apart with a whirring sound
  preserved_meaning: The wings strike, divide, and audibly disturb the air.
  reasoning_layer_used: The lexical decisions preserve the forceful whipping, splitting, and whirring images.
  rationale: The passive construction becomes a direct description without weakening the imagery.
- pob_phrase: the light air ... was traversed, and after that no sign of its passage was found in it
