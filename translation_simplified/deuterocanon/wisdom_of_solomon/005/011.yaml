translation:
  language: en
  text: or like a bird flying through the air. No trace of its path can be found. Its beating wings whip the light air[a] and force it apart with a whirring sound. But after the bird has passed, no sign of its flight remains in the air.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “light wind” or “subtle breeze.”
    reason: lexical_alternative
