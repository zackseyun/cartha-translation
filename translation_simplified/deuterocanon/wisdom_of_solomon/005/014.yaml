translation:
  language: en
  text: The hope of the ungodly is like feather down blown by the wind. It is like thin frost swept away by a storm and like smoke scattered by the wind. It passes by like the memory of a guest who stayed for only one day.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “the memory of a traveler who stayed only one day.”
    reason: lexical_alternative
