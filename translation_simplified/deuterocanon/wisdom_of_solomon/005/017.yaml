simplification_decisions:
- pob_phrase: take his zeal as full armor
  simplified_phrase: take up his zeal as full armor
  preserved_meaning: God’s intense zeal serves metaphorically as his complete armor.
  reasoning_layer_used: Lexical and theological decisions on λήμψεται, πανοπλίαν, and ζῆλος.
  rationale: “Take up” makes the act of equipping himself clearer while retaining the warrior image.
- pob_phrase: arm creation for defense against enemies
  simplified_phrase: equip creation as a weapon to defend against enemies
  preserved_meaning: God enlists the created world as the means of defense against enemies.
  reasoning_layer_used: Lexical decisions on ὁπλοποιήσει, κτίσις, and ἄμυνα.
  rationale: The clearer wording explains how creation is armed without weakening the military image.
interpretive_expansions:
