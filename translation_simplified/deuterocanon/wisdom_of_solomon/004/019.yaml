translation:
  language: en
  text: After this, they will end as dishonored corpses, forever held in contempt among the dead. For he[a] will hurl them down, headfirst and unable to speak. He will shake them loose from their foundations. They will be completely ruined and suffer pain, and the memory of them will disappear.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek leaves the subject unstated; in context, “he” refers to God as the one who judges them.
    reason: alternative_reading
