translation:
  language: en
  text: When she is present, they follow her example. When she is gone, they long for her. She marches in triumph through the ages,[a] wearing a victor’s wreath because she has won the contest with its undefiled prizes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “forever.” The Greek expression points to honor that endures through the ages.
    reason: lexical_alternative
