  simplified_phrase: they follow her example
  preserved_meaning: People pattern their conduct after personified virtue.
  reasoning_layer_used: Lexical decision for μιμοῦνται and theological decision on the feminine referent
  rationale: The fuller phrase makes imitation clear while preserving virtue as “her.”
- pob_phrase: and they long for her when she has gone
  simplified_phrase: When she is gone, they long for her.
  preserved_meaning: Her completed departure contrasts with her presence.
  reasoning_layer_used: Lexical decisions for ποθοῦσιν and ἀπελθοῦσαν
  rationale: A separate sentence makes the contrast easier to follow without weakening their longing.
- pob_phrase: through the age she marches in triumph, wearing a victor’s wreath, having won the contest of the undefiled prizes
  simplified_phrase: She marches in triumph through the ages, wearing a victor’s wreath because she has won the contest with its undefiled prizes
  preserved_meaning: Her lasting triumph follows victory in a contest linked with morally pure prizes.
  reasoning_layer_used: Lexical decisions for ἐν τῷ αἰῶνι, στεφανηφοροῦσα, πομπεύει, ἀμιάντων, ἄθλων, ἀγῶνα, and νικήσασα
  rationale: The wording clarifies the enduring span and victory sequence while keeping the contest, wreath, and undefiled prizes distinct.
