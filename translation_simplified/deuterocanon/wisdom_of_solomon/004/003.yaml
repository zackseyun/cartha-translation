translation:
  language: en
  text: But the many children of the ungodly will be of no use. From bastard shoots,[a] they will not put down deep roots, nor will they establish a firm foundation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek uses a harsh word within this plant metaphor; it may also be rendered “illegitimate offshoots” or “spurious grafts.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the many offspring of the ungodly
  simplified_phrase: the many children of the ungodly
  preserved_meaning: The ungodly have many descendants.
  reasoning_layer_used: Lexical decisions for πολύγονον ... πλῆθος and ἀσεβῶν.
  rationale: “Children” is more immediate than “offspring,” while “ungodly” keeps the Godward moral sense.
- pob_phrase: from bastard shoots they will not give a root into depth
  simplified_phrase: From bastard shoots, they will not put down deep roots
  preserved_meaning: The severe plant metaphor and its source relationship remain, while the growth never becomes deeply rooted.
  reasoning_layer_used: Lexical decisions for ἐκ νόθων μοσχευμάτων and οὐ δώσει ῥίζαν εἰς βάθος, plus POB footnote b.
  rationale: The idiomatic root clause preserves both “from” and the horticultural image.
- pob_phrase: nor will they set a firm foundation
  simplified_phrase: nor will they establish a firm foundation
  preserved_meaning: They will not actively secure lasting stability.
  reasoning_layer_used: Lexical decision for οὐδὲ ἀσφαλῆ βάσιν ἐδράσει.
  rationale: “Establish” clearly preserves the second active predicate rather than reducing it to possession.
translation_notes:
  risk_flags:
  - risk: “Bastard” may be heard only as a modern insult rather than as severe language within a plant metaphor.
    mitigation: “Shoots” retains the horticultural image, and the footnote explains the wording and alternatives.
