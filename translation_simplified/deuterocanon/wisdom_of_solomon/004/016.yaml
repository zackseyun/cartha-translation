translation:
  language: en
  text: But even after death, the righteous person will condemn the ungodly who are still alive. A young life completed so soon will condemn the many years of old age enjoyed by an unrighteous person.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the righteous one, though dead
  simplified_phrase: even after death, the righteous person
  preserved_meaning: The righteous person condemns the ungodly despite having died.
  reasoning_layer_used: POB lexical and theological decisions on καμών
  rationale: This states the contrast in familiar English while keeping death as the setting.
- pob_phrase: the living ungodly
  simplified_phrase: the ungodly who are still alive
  preserved_meaning: Ungodly people remain alive in contrast to the righteous person who died.
  reasoning_layer_used: POB lexical decision on τοὺς ζῶντας ἀσεβεῖς
  rationale: “Still alive” makes the life-and-death contrast immediately clear.
- pob_phrase: youth brought to completion quickly will condemn the many-year old age of the unrighteous
  simplified_phrase: A young life completed so soon will condemn the many years of old age enjoyed by an unrighteous person
  preserved_meaning: A life completed in youth stands in judgment over an unrighteous person's extended old age.
  reasoning_layer_used: POB lexical decisions on νεότης, τελεσθεῖσα, ταχέως, πολυετές, γῆρας, and ἀδίκου
  rationale: The recasting keeps “many years” tied specifically to the unrighteous person's old age.
interpretive_expansions:
- pob_phrase: youth brought to completion quickly
  rendering: A young life completed so soon
  claim: The youth refers to a person's life ending while that person is young.
  evidence:
  - Wisdom 4 concerns the righteous person's early death.
  - The POB rationale describes a life completed in fewer years.
  confidence: high
  alternatives_preserved:
  - youth brought to completion quickly
  - youth made perfect quickly
translation_notes:
  risk_flags:
  - risk: “A young life” makes the personal reference more explicit than the abstract Greek noun “youth.”
    mitigation: The immediate context and POB rationale identify the youth as the righteous person's completed life.
  - risk: “Enjoyed” may suggest pleasure rather than simply possessing an extended old age.
    mitigation: Here it uses the common sense of having a benefit denied to the righteous person who died young.
