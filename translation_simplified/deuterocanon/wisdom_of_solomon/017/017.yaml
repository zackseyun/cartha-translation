  preserved_meaning: The person remained under an oppressive constraint that could not be avoided.
  reasoning_layer_used: POB lexical decision for τὴν δυσάλυκτον ... ἀνάγκην
  rationale: “Compulsion” is clearer than “necessity” here and avoids inventing an external force.
- pob_phrase: someone ... he
