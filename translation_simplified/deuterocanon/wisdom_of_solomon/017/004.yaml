translation:
  language: en
  text: Not even the inner room that enclosed them could keep them free from fear. Troubling sounds rang all around them, and gloomy apparitions[a] with unsmiling faces appeared.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: That is, ghostly or uncanny forms; the text does not say whether they were beings or visions.
    reason: lexical_alternative
