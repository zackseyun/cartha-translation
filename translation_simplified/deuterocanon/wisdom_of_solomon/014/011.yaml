  text: Therefore judgment will also come upon the nations’ idols.[a] This is because, within God’s creation, these idols became detestable. They made people stumble spiritually and became a trap for the feet of fools.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: More literally, “there will also be a visitation upon the idols of the nations”; here the visitation brings judgment.
    reason: lexical_alternative
