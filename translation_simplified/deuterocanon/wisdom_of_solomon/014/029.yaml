translation:
  language: en
  text: They trust in lifeless idols.[a] So after they swear wickedly, they do not expect any harm to come to them.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “empty idols” or “worthless idols”; the Greek stresses that they have no real power or substance.
    reason: lexical_alternative
  - marker: b
    text: The harm may include being wronged or punished for their wicked oath-taking.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: For because they trusted in lifeless idols
  simplified_phrase: They trust in lifeless idols. So
  preserved_meaning: Their settled trust in powerless idols explains their lack of fear.
  reasoning_layer_used: Lexical decision for πεποιθότες and theological consequence rationale
  rationale: Two short sentences replace the awkward double connector while keeping the causal link.
- pob_phrase: after swearing wickedly
  simplified_phrase: after they swear wickedly
  preserved_meaning: Their oath-taking is morally evil without narrowing it only to false swearing.
  reasoning_layer_used: Lexical decisions for κακῶς and ὀμόσαντες
  rationale: A finite clause is easier to read than the compressed participial wording.
- pob_phrase: they do not expect to be harmed
  simplified_phrase: they do not expect any harm to come to them
  preserved_meaning: They anticipate no adverse consequence, whether harm, wrong, or punishment.
  reasoning_layer_used: Lexical decision for ἀδικηθῆναι and theological ambiguity ruling
  rationale: The active English expression is clearer while retaining the Greek term’s breadth.
translation_notes:
  risk_flags:
