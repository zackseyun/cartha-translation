translation:
  language: en
  text: A child was taken from his father suddenly, before the expected time, and grief wore the father down. The father made an image of his child, who was dead at the time, but later he honored him as a god. He also passed on secret religious observances and rites to those under his authority.
  philosophy: optimal-equivalence
