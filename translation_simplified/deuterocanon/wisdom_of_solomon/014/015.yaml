- pob_phrase: worn down by untimely grief for the child quickly taken away
  simplified_phrase: A child was taken from his father suddenly, before the expected time, and grief wore the father down
  preserved_meaning: The child's premature loss caused grief that exhausted the father.
  reasoning_layer_used: POB lexical decisions and lexical-alternative footnote
  rationale: The clause is reordered to present the loss and its effect in a natural sequence.
- pob_phrase: made an image of the one then dead, and now honored him as a god
  simplified_phrase: made an image of his child, who was dead at the time, but later he honored him as a god
  preserved_meaning: The child was then a dead human but afterward received divine honor.
  reasoning_layer_used: POB lexical and theological decisions plus grounding review
  rationale: The wording restores the pointed contrast between the child's death and his later treatment as a god.
- pob_phrase: handed down mysteries and rites to those under his authority
  simplified_phrase: passed on secret religious observances and rites to those under his authority
  preserved_meaning: The father transmitted cultic practices to people subject to him.
  reasoning_layer_used: POB lexical decisions and cultural footnote
  rationale: The unfamiliar term “mysteries” is expressed by its documented cultic meaning.
