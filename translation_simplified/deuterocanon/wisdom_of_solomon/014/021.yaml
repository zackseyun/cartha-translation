translation:
  language: en
  text: This practice became an ambush threatening human life, because people enslaved by disaster or tyranny gave stones and wood the name that belongs to God alone.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the name that must not be shared”; this may refer to God’s name or divine honor, which must not be given to idols.
