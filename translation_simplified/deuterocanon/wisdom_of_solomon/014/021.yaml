  rationale: “Threatening human life” makes the hostile direction of the metaphor immediately clear.
- pob_phrase: men, enslaved by calamity or by tyranny
  simplified_phrase: people enslaved by disaster or tyranny
  preserved_meaning: Adverse circumstances or oppressive rule held people in coercive bondage.
  reasoning_layer_used: Lexical decisions for συμφορᾷ, τυραννίδι, and δουλεύσαντες
  rationale: “Disaster” is more familiar than “calamity,” while “enslaved” preserves the force of bondage.
- pob_phrase: bestowed the incommunicable name on stones and wood
  simplified_phrase: gave stones and wood the name that belongs to God alone
  preserved_meaning: People wrongly attributed God’s exclusive name to material idols.
  reasoning_layer_used: Lexical and theological decisions for τὸ ἀκοινώνητον ὄνομα and περιέθεσαν
  rationale: The wording explains the formal term “incommunicable” without weakening divine exclusivity.
