  preserved_meaning: As a further wrong, they misname severe evils as peace.
  reasoning_layer_used: POB lexical and theological decisions on τὰ τοσαῦτα κακὰ and εἰρήνην
  rationale: “Terrible” conveys severity, while “such” avoids adding totality and “peace” preserves the irony.
