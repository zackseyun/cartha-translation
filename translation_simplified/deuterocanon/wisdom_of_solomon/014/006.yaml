translation:
  language: en
  text: For at the beginning, when the proud giants were being destroyed, the hope of the world found refuge on a raft.[a] Steered by your hand, it left for the age to come[b] a seed from which generations would arise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “raft,” an unusual choice rather than the normal word for a ship or ark.
    reason: lexical_alternative
  - marker: b
    text: “Age to come” refers to the continuing future age and keeps the Greek distinction from “world” earlier in the verse.
    reason: simplification_note
