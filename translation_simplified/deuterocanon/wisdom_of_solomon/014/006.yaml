- pob_phrase: the hope of the world, taking refuge on a raft
  simplified_phrase: the hope of the world found refuge on a raft
  preserved_meaning: The personified hope reaches safety on the raft without identifying it only as Noah or only as abstract hope.
  reasoning_layer_used: POB theological decision on the referent of “the hope of the world”
  rationale: A direct verb makes the action easier to follow while preserving the documented ambiguity.
- pob_phrase: left to the age to come a seed of generation
  simplified_phrase: left for the age to come a seed from which generations would arise
  preserved_meaning: The preserved seed enables humanity to continue into future time.
  reasoning_layer_used: POB lexical decisions for αἰών and σπέρμα γενέσεως
  rationale: The wording explains the compressed phrase while keeping both the seed image and the future age.
- pob_phrase: steered by your hand
  simplified_phrase: Steered by your hand
  preserved_meaning: God’s hand pilots the raft through the flood.
  reasoning_layer_used: POB lexical decision for τῇ σῇ κυβερνηθείσῃ χειρί
  rationale: Moving the phrase to the start of the sentence clarifies divine guidance without weakening the nautical image.
