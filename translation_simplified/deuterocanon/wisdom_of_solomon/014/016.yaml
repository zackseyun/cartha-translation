simplification_decisions:
- pob_phrase: that ungodly custom grew strong
  simplified_phrase: that ungodly practice became firmly established
  preserved_meaning: The condemned practice gradually gained strength and permanence.
  reasoning_layer_used: The lexical decision for κρατυνθὲν preserves gradual strengthening over time.
  rationale: “Became firmly established” clearly describes a practice taking lasting hold.
- pob_phrase: was kept as a law
  simplified_phrase: was treated as law
  preserved_meaning: People observed the practice as though it had legal force.
  reasoning_layer_used: The lexical rationale explains ὡς νόμος as treatment as if the custom were law.
  rationale: “Treated as law” naturally conveys that the practice carried legal force.
- pob_phrase: by the commands of tyrants the carved images were worshiped
  simplified_phrase: Then tyrants ordered people to worship carved images
  preserved_meaning: Tyrants used commands to impose worship of manufactured images.
  reasoning_layer_used: The lexical and theological decisions retain “tyrants,” worship, and the carved nature of the images.
  rationale: The active sentence makes the coercion easier to understand.
interpretive_expansions:
- pob_phrase: by the commands of tyrants the carved images were worshiped
  rendering: Then tyrants ordered people to worship carved images
  claim: People are the implied worshipers subject to the tyrants’ commands.
  evidence:
