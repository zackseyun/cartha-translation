translation:
  language: en
  text: But the thing made by human hands[a] is under a curse, along with its maker. For the maker worked on it, yet this perishable object was called god.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The context points to an idol, but the Greek says more broadly “the thing made by hands.”
    reason: lexical_alternative
  - marker: b
    text: Or “was called a god.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: is accursed, both it and the one who made it
  simplified_phrase: is under a curse, along with its maker
  preserved_meaning: The curse rests on both the manufactured object and its maker.
  reasoning_layer_used: lexical decision for ἐπικατάρατον
  rationale: “Under a curse” expresses the judicial-religious force in familiar English.
- pob_phrase: because the one made it
  simplified_phrase: For the maker worked on it
  preserved_meaning: The maker’s work helps explain why the stated curse applies.
  reasoning_layer_used: source conjunction ὅτι and lexical decision for ἠργάζετο
  rationale: “For” restores the causal link while “worked on it” preserves the crafting process.
- pob_phrase: but the perishable thing was called god
  simplified_phrase: yet this perishable object was called god
  preserved_meaning: A destructible object wrongly received the designation of deity.
  reasoning_layer_used: lexical and theological decisions for φθαρτόν and θεὸς ὠνομάσθη
  rationale: “Yet” clarifies the contrast while retaining POB’s deliberate “called god.”
interpretive_expansions:
- pob_phrase: made by hands
  rendering: made by human hands
  claim: The hands belong to the human maker rather than indicating divine agency.
  evidence:
  - The verse directly contrasts the object with its maker.
  - The lexical rationale identifies the expression as handmade.
  confidence: high
  alternatives_preserved:
