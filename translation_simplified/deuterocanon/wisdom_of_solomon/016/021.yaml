translation:
  language: en
  text: For the substance[a] of the food you gave showed how sweetly you cared for your children. It responded to the desire of whoever received it, changing itself to suit whatever each person wished.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “your nature.” The Greek can mean “substance,” “nature,” or “underlying reality”; here it refers primarily to the makeup of the miraculous food.
    reason: lexical_alternative
