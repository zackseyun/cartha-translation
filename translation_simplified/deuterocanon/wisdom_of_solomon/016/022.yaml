translation:
  language: en
  text: But the snow and ice withstood the fire without melting. This happened so that they would know that the fire blazing in the hail and flashing through the rainstorms was destroying the enemies’ crops.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “the fruits of the enemies,” meaning their crops or produce.
    reason: lexical_alternative
