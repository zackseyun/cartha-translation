translation:
  language: en
  text: For you have authority over life and death. You bring people down to the gates of Hades[a], and you bring them up.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hades is the realm of the dead; this may also be translated “the gates of the grave” or “the gates of the underworld.”
    reason: lexical_alternative
  - marker: b
    text: Or “lead them up” or “raise them up.” The Greek says “bring up,” matching “bring down” without specifying resurrection.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: For you have authority over life and death, and you bring down
  simplified_phrase: For you have authority over life and death. You bring people down
  preserved_meaning: God sovereignly rules over life and death and can bring the living into the realm of the dead.
  reasoning_layer_used: POB lexical decisions for ἐξουσίαν and κατάγεις
  rationale: The sentence break clarifies the two related claims while retaining authority and downward movement.
- pob_phrase: bring down to the gates of Hades and bring up
  simplified_phrase: bring people down to the gates of Hades, and you bring them up
  preserved_meaning: God can bring people down toward the realm of the dead and can also bring them upward.
  reasoning_layer_used: POB lexical and theological decisions for πύλας ᾅδου and ἀνάγεις
  rationale: Supplying the implied object makes the paired movements natural in English without defining the upward act more narrowly.
interpretive_expansions:
- pob_phrase: you bring down ... and bring up
  rendering: You bring people down ... and you bring them up.
  claim: People are the implied objects of both movements.
  evidence:
  - The two Greek verbs are used transitively with an unstated object.
  - The contrast with life and death identifies those under God's authority as the implied objects.
  confidence: high
  alternatives_preserved:
  - lead them up
  - raise them up
translation_notes:
  risk_flags:
  - risk: “Bring them up” may be read as a technical statement about resurrection.
    mitigation: The footnote preserves the broader Greek wording and warns against narrowing the sense.
  - risk: Modern readers may mistake Hades for the later mythological character or for hell.
    mitigation: The footnote defines Hades here as the realm of the dead.
