  preserved_meaning: The ungodly willfully refused to know God.
  reasoning_layer_used: Lexical and theological decisions for ἀρνούμενοι, εἰδέναι, and ἀσεβεῖς
  rationale: The reordered clause is natural English while retaining “to know” and the theological force of “ungodly.”
- pob_phrase: the ungodly were scourged by the strength of your arm
  simplified_phrase: the strength of your arm scourged them
  preserved_meaning: God’s power severely punished them under the image of scourging.
  reasoning_layer_used: Lexical and theological decisions for ἐν ἰσχύι βραχίονός σου and ἐμαστιγώθησαν
  rationale: Active syntax shortens the sentence without weakening the arm or scourging images.
- pob_phrase: pursued by strange rains and hail and relentless storms, and consumed by fire
  simplified_phrase: Strange rains, hail, and relentless storms pursued them, and fire consumed them
  preserved_meaning: Extraordinary weather and fire acted as unstoppable agents of judgment.
  reasoning_layer_used: Lexical decisions for ξένοις ὑετοῖς, διωκόμενοι, ἀπαραιτήτοις, and πυρὶ καταναλισκόμενοι
  rationale: A separate active sentence makes each judgment clear while preserving the pursuit image.
