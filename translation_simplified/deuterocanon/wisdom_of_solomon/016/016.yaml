translation:
  language: en
  text: Because the ungodly refused to know you, the strength of your arm scourged them. Strange rains[a], hail, and relentless storms[b] pursued them, and fire consumed them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Strange rains” means extraordinary weather sent in judgment; it may also be translated “unusual rains.”
    reason: lexical_alternative
  - marker: b
    text: “Relentless storms” may also be translated “inescapable storms”; they could not be turned aside.
    reason: lexical_alternative
