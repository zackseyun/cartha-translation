  preserved_meaning: The people are identified by their oppressive conduct, not merely labeled as tyrants.
  reasoning_layer_used: lexical decision for τυραννοῦσιν
  rationale: Common wording retains the Greek form’s verbal force without adding an unsupported intensifier.
- pob_phrase: unavoidable want should come upon
  simplified_phrase: had to suffer an inescapable lack of necessities
  preserved_meaning: Severe deprivation that could not be averted had to overtake the oppressors.
  reasoning_layer_used: lexical decisions for ἔδει, ἀπαραίτητον, ἔνδειαν, and ἐπελθεῖν
  rationale: This replaces archaic “want” and awkward clause order without limiting the deprivation to hunger.
- pob_phrase: but to these only that it should be shown
  simplified_phrase: But God’s people only had to be shown
  preserved_meaning: God’s people were shown their enemies’ punishment rather than suffering that judgment directly.
  reasoning_layer_used: theological decision on differential judgment and lexical decision for δειχθῆναι
  rationale: “Had to be shown” preserves necessity and passive reception without implying that they personally needed a demonstration.
