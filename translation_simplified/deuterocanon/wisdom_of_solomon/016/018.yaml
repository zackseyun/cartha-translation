translation:
  language: en
  text: At one point, the flame was held back so that it would not burn up the creatures sent against the ungodly. This was so that the ungodly, when they saw this,[a] might understand that God’s judgment was driving them onward.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “saw the creatures sent against them.”
    reason: lexical_alternative
  - marker: b
    text: Or “was pursuing them.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: at one time the flame was subdued
  simplified_phrase: At one point, the flame was held back
  preserved_meaning: The flame was restrained without being extinguished.
  reasoning_layer_used: Lexical decision for ἡμεροῦτο and applied revisions
  rationale: “Held back” describes controlled fire in familiar English.
- pob_phrase: the creatures sent against the ungodly
  simplified_phrase: the creatures sent against the ungodly
  preserved_meaning: The creatures were sent with hostile force against ungodly people.
  reasoning_layer_used: Lexical decisions for ζῷα and ἀσεβεῖς
  rationale: Keeping “sent against” preserves hostility without specifying an attack.
- pob_phrase: might know that they were being driven on by the judgment of God
  simplified_phrase: might understand that God’s judgment was driving them onward
  preserved_meaning: The ungodly were meant to recognize that divine judgment was pressing them on.
  reasoning_layer_used: Lexical decision for ἐλαύνονται and theological decision on divine judgment
  rationale: The active sentence is easier to follow while preserving the purpose clause and judicial action.
