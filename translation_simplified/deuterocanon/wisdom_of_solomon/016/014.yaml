translation:
  language: en
  text: A man can kill through his own wickedness. But once a spirit has gone out, he cannot bring it back or free a soul that has been taken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This can also be translated, “once the breath has gone out, he cannot bring it back or free a life that has been taken away.” The Greek words can refer to “spirit” or “breath” and to “soul” or “life” in this context.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: But a man kills by his own wickedness
  simplified_phrase: A man can kill through his own wickedness.
  preserved_meaning: Human wickedness can cause death, but human power cannot reverse it.
  reasoning_layer_used: Lexical rationale and surrounding-context contrast
  rationale: A separate sentence makes the contrast in human ability easier to follow.
- pob_phrase: nor does he release a soul that has been taken
  simplified_phrase: or free a soul that has been taken
  preserved_meaning: A human cannot free a soul from death after it has been taken.
  reasoning_layer_used: Lexical and theological decisions for ἀναλύω and ψυχή
  rationale: “Free” is common English that preserves the image of release.
interpretive_expansions:
- pob_phrase: a man kills
  rendering: A man can kill
  claim: The statement describes the reach of human ability in contrast with the inability to reverse death.
  evidence:
  - The following clauses state what the man cannot do after death.
  - The POB rationale identifies this contrast between killing and restoring life.
  confidence: high
  alternatives_preserved:
  - A man kills
translation_notes:
  risk_flags:
