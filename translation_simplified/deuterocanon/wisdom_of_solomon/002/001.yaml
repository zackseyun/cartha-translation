translation:
  language: en
  text: They reasoned wrongly and said to one another, “Our life is short and full of sorrow. When a man's life ends, there is no remedy, and no one has ever been known to return from Hades.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “no one has ever been known to be released from Hades.” Hades is the realm of the dead.
    reason: lexical_alternative
