  preserved_meaning: They failed to grasp the hidden realities belonging to him.
  reasoning_layer_used: Lexical decision for ἔγνωσαν and μυστήρια
  rationale: “Understand” makes the intended lack of comprehension clearer while retaining “mysteries.”
- pob_phrase: did not hope for the reward of holiness
  simplified_phrase: did not hope that holiness would be rewarded
  preserved_meaning: They had no expectation of a reward connected with holiness.
  reasoning_layer_used: Lexical decisions for μισθὸν, ἤλπισαν, and ὁσιότητος
  rationale: The passive clause expresses the compressed reward relationship in ordinary English.
- pob_phrase: did not consider blameless souls worthy of honor
  simplified_phrase: did not regard blameless souls as worthy of honor
  preserved_meaning: They denied that morally blameless souls deserved honor.
  reasoning_layer_used: Lexical decisions for ἔκριναν, γέρας, ψυχῶν, and ἀμώμων
  rationale: “Regard as” states the evaluative judgment naturally while preserving “souls” and “honor.”
