translation:
  language: en
  text: He considers us counterfeit—as if we were not genuine. He stays away from our ways as if they were unclean and defiling. He calls the final outcome of the righteous blessed, and boasts that God is his father.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: We were considered by him to be counterfeit
  simplified_phrase: He considers us counterfeit—as if we were not genuine
  preserved_meaning: The righteous man judges the wicked to be morally false, pictured as counterfeit material.
  reasoning_layer_used: POB lexical decision for κίβδηλον and ἐλογίσθημεν
  rationale: The active wording is easier to follow, while the clarifying phrase preserves the counterfeit image.
- pob_phrase: he keeps away from our ways as from uncleannesses
  simplified_phrase: He stays away from our ways as if they were unclean and defiling
  preserved_meaning: He deliberately separates himself from their conduct as from things that cause impurity.
  reasoning_layer_used: POB lexical decisions for ἀπέχεται, ὁδῶν, and ἀκαθαρσιῶν
  rationale: This replaces the awkward plural “uncleannesses” while retaining the biblical way-of-life and defilement images.
- pob_phrase: he calls the end of the righteous blessed
  simplified_phrase: He calls the final outcome of the righteous blessed
  preserved_meaning: He declares the righteous person’s final state to be blessed.
  reasoning_layer_used: POB lexical decisions for μακαρίζει and ἔσχατα
  rationale: “Final outcome” makes the intended sense of “end” immediately clear without resolving it more narrowly.
