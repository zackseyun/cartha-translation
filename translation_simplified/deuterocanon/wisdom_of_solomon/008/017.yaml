translation:
  language: en
  text: I thought deeply about all this and reflected in my heart that immortality is found in kinship with wisdom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “immortality comes through a close bond with wisdom.” The Greek links immortality closely with wisdom but does not clearly state that one causes the other.
