translation:
  language: en
  text: If anyone loves righteousness,[a] her labors are virtues. She teaches self-control, practical wisdom, righteousness, and courage.[b] Nothing is more useful for people in life than these virtues.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “justice”; the Greek word can mean either moral righteousness or justice.
    reason: lexical_alternative
  - marker: b
    text: The words “her labors” and “she teaches” preserve the verse’s feminine personification of righteousness.
    reason: cultural_note
