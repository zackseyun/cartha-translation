  preserved_meaning: Righteousness remains personified, and her labors are directly identified as virtues.
  reasoning_layer_used: Lexical decision for οἱ πόνοι ταύτης and theological decision on feminine personification
  rationale: Two sentences make the thought easier to follow without weakening the direct equation.
- pob_phrase: prudence
  simplified_phrase: practical wisdom
  preserved_meaning: The virtue is wisdom used in sound judgment and action.
  reasoning_layer_used: Lexical decision for φρόνησις
  rationale: “Practical wisdom” is more immediately understandable than “prudence.”
- pob_phrase: than which nothing is more useful for human beings in life
  simplified_phrase: Nothing is more useful for people in life than these virtues
  preserved_meaning: The four listed virtues are supremely useful to people in life.
  reasoning_layer_used: Applied revision and lexical decisions for χρησιμώτερον, ἐν βίῳ, and ἀνθρώποις
  rationale: The direct sentence avoids an awkward relative construction while preserving the comparison.
