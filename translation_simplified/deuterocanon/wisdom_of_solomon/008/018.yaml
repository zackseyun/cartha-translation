translation:
  language: en
  text: Her friendship brings good delight. The labor of her hands brings wealth that never runs out. Companionship with her brings practical wisdom, and sharing her words brings honor.[a] So I went about looking for a way to take her to myself.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Honor” may also mean “a good reputation.”
    reason: lexical_alternative
  - marker: b
    text: “Take her to myself” may also be translated “acquire her for myself”; the wording does not necessarily imply marriage.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: in the labors of her hands, unfailing wealth
  simplified_phrase: The labor of her hands brings wealth that never runs out.
  preserved_meaning: Wisdom’s productive activity yields inexhaustible wealth.
  reasoning_layer_used: Lexical decisions for πόνοις χειρῶν αὐτῆς and πλοῦτος ἀνεκλιπής.
  rationale: The rewrite keeps the image of her hands while explaining “unfailing” in common English.
- pob_phrase: in companionship with her, prudence
  simplified_phrase: Companionship with her brings practical wisdom
  preserved_meaning: Association with personified Wisdom brings sound practical judgment.
  reasoning_layer_used: Lexical decisions for συγγυμνασίᾳ, ὁμιλίας, and φρόνησις.
  rationale: “Practical wisdom” clearly expresses the ethical and intellectual sense of “prudence.”
- pob_phrase: I went about seeking how I might take her to myself
  simplified_phrase: So I went about looking for a way to take her to myself.
  preserved_meaning: The speaker actively sought to make personified Wisdom his own.
  reasoning_layer_used: Lexical decision for περιῆλθον ζητῶν and theological decision on personified Wisdom.
  rationale: “Went about looking” retains active pursuit without implying an exhaustive search.
