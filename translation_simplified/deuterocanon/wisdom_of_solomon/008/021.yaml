translation:
  language: en
  text: 'I knew that I could not have self-control unless God gave it to me. Knowing who gave this gift[a] was itself a mark of insight. So I appealed to the Lord and earnestly begged him. With all my heart I said:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “grace” or “favor.” Here the Greek word refers to self-control as something God gives.
    reason: lexical_alternative
