  text: Through her, I will have immortality[a][b], and I will leave behind an everlasting memory for those who come after me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Her” refers to Wisdom, pictured here as a woman; this may also be translated “by her” or “with her.”
