translation:
  language: en
  text: 'The others had an even stronger desire to rule because they were more honorable [text missing] than those who had rebelled against them earlier. They would not humble themselves. They believed they had come from themselves, had no beginning, and were the first to give birth to others. The two orders went to war, each fighting for control because of what they were like. They became flooded with powers and natures marked by mutual conflict, the desire to rule, and similar traits. An empty desire for glory drove them to seek control, though none of them possessed or recognized the exalted thought.


    The forces of this exalted thought were prepared with the <names> of the pre-existent <ones>, whose representations they are. Those belonging to this order lived in harmony with one another. Yet they fought against the order of the likeness, and the order of the likeness furiously made war against the likenesses. [The text is damaged here: ... their] own [against] one another, many [...] necessity placed them [...] so that they could prevail [...] he did not cease [...] Their envy, fury, violence, lust, and ignorance took effect, producing many different kinds of matter and powers, all mixed together. Meanwhile, the Word, who had caused them to be born, waited inwardly for a revelation of the [hope] that would come to him from above.


    As the Word roused himself, he received hope and expectation for the Exalted One. He separated himself completely from those of the shadow because they fought against him and refused to humble themselves before him at all. But he found rest among those who belonged to memory. From those who came into being through memory, the Word invisibly produced, in keeping with their nature, the one who ascended on high, remembering the one who had been deficient, until light shone on him from above, giving him life, begotten by the thought of brotherly love among the pre-existent Fullnesses.'
