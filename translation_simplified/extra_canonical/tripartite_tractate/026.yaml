translation:
  language: en
  text: 'The Election shares the Savior’s nature and belongs to his body. It is like a bridal chamber because it is united with him. Above all, Christ came for its sake. The Calling, by contrast, is appointed for those who celebrate in the bridal chamber and rejoice over the union of bridegroom and bride. The Calling will receive a place in the aeon of the images,[a] where the Word has not yet united with the Fullness. This is why the Human of the Church rejoiced and was glad, and why he hopes for her. He consists of spirit, soul, and body, corresponding to the one who designed the plan of salvation.


    Within the Human was a human who formed a unity. He was the Totality and included them all. He possessed what came from the [Father] and what the various places could receive. He also possessed the limbs mentioned earlier. When redemption was proclaimed, the Perfect Human immediately learned how to return to his unity—the place where he began. He joyfully returned to the place from which he had come.


    His limbs, however, needed a place where they could be taught. Places had been prepared to teach them through images and original patterns that served like a mirror. This instruction continues until all the limbs of the Church’s body <are joined> in the same place and receive restoration together. Then the entire body will be revealed, <…> bringing restoration to the Fullness.[b]


    This restoration has a shared harmony and unity from the beginning—the harmony that belongs to the Father—until all the Totalities bear a face like his. The final restoration <will occur> after the Totality is revealed in the Son. The Son is redemption: the path to the incomprehensible Father and the way back to what existed before. It will also occur after the Totalities reveal themselves properly in him. He is the path to the one who cannot be grasped, described, seen, or understood. In this way redemption is attained.


    This redemption will free us not only from the control of those <of> the left, but also from the power of those on the right. We believed that we were their servants and sons, and no one escapes them without soon being captured again. But redemption is more than escape. It is also an ascent <through> the levels of the Fullness, reaching those who received names and understood them according to the capacity of each aeon. It is an entrance into silence, where there is no need for speech, knowledge, thought, or enlightenment. There everything is light and shines without needing to be enlightened.


    Angels and humans both need redemption. So do the image, the Fullnesses that belong to the aeons, and the wonderfully radiant powers. Even the Son himself—the model for the redemption of the Totality—[needed] redemption. He became human, subjecting himself to all that was necessary for us in the flesh—his Church. He was the first to attain redemption through the Word that descended upon him. Then all the others received redemption from him by embracing him as their own. Those who received the one who had already received redemption naturally received what was in him.


    Among humans in the flesh, redemption began to be given when his firstborn, his beloved, the Son in the flesh, and the heavenly angels were considered worthy to share fellowship with him on earth. This is why he is called “the angelic redemption of the Father.” He comforts those who grieved as they sought knowledge of the Totality, because he was the first to receive this gift, before anyone else.'
