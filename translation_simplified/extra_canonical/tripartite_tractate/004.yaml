translation:
  language: en
  text: '[. . .] The Church shares the qualities and attributes of the Father and the Son, as I said from the beginning. It exists through the birth of countless aeons.[a] Sharing the same qualities and attributes as the Church, these aeons also bring forth others beyond number. Together they form the Church’s unity—with one another, with those who have come from them, and with the Son, for whose glory they exist.


    No mind can conceive of them, even the one who is the perfection of that place. No words can describe them, for they cannot be spoken of, named, or grasped. Only they can name and understand themselves, because they are not rooted in these places. Those who belong to that place are beyond speech and number. Their order is both their way of being and their measure. They are the gladness and joy of the One who was never begotten, who has no name and cannot be named, grasped, seen, or conceived. This is the fullness of fatherhood: his riches give birth.


    [. . .] of the aeons lived eternally in thought, for the Father was both a thought and a dwelling place for them. Once their generations had been established, the One who rules over all desired to take hold of what was lacking in the [. . .] and bring it forth. So he brought forth those who were within him. Yet because of what he is, he remains like a spring that loses none of its water, however abundantly it flows.


    While they lived in the Father’s thought—in the hidden Depth—the Depth knew them, but they could not know the Depth in which they lived. They could not even know themselves or anything else. They were with the Father, but they did not yet exist for themselves. They existed only as a seed exists, like an unborn child. As with a word, he begot them, while they remained in the form of seed. Those whom he was going to bring forth had not yet received existence from him.


    The Father was the first to think of them. He planted a thought like seed so that they would exist not only for him but also for themselves. In this way they could exist within his thought in a form connected with thought and knowledge, while also having an existence of their own. He generously gave them their first form so that they could know what existed for their sake. He also enabled them to know the Father, who exists for their sake. Through a voice, he gave them the name “Father” and declared that everything that exists does so by that name, which also belongs to them. They came into being through the exaltation within the name, though they did not recognize it.


    An unborn child has what it needs within itself, though it cannot yet see the one who planted it. In the same way, their one task was to seek the Father. They knew that he existed and continually desired to discover what exists.


    The perfect Father is good. He did not keep them shut away within himself, leaving them forever as thoughts in his mind. Instead, he allowed them to receive an existence of their own. In the same way, he gave them the ability to know what truly exists: the One who knows himself eternally. [. . .] receive form [and know] that He Who Is exists. They are like people born into this world who come into the light and are then able to see those who gave them birth.'
