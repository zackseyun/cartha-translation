translation:
  language: en
  text: '[a] When we speak about the highest realities, we should begin with the Father. He is the root of the Totality, and from him we received the gift of speaking about him. He existed before anything else came into being.


    The Father is one, as the number one is first, because he comes before all and exists alone in himself. Yet he is not merely a solitary being. If he were, how could he be a father? Wherever there is a father, the word “son” follows. The one who alone is the Father is like the root of a tree that has branches and fruit.


    In the strictest sense, he is Father because no one compares with him and he never changes. In this same sense, he is one and is God. No one is God in relation to him, for he has no father. He is unbegotten: no one gave him birth, and no one created him. Anyone else who is a father or creator also has a father and creator. Such a being may be father and creator to those who come from him or are made by him. But he is not Father and God in the strictest sense, because [...] someone begot and created him. Therefore, only the one whom no one begot is Father and God in the strictest sense. He begot and created all the Totalities.


    He has no beginning and no end. This means more than simply that his life will never end. Because he was never begotten, he cannot die. He remains eternally what he is and never changes in his being, his identity, or his greatness. He can never be separated from what makes him who he is. No one can force him to carry out an intention he has never willed. No one brought the Father into existence, so he does not change. No one can separate him from his being, his identity, or his greatness. For this reason, no one can comprehend him.


    No one can give him a different form, bring him low, alter him, or make him less. In the fullness of truth, he never changes or varies; unchangeableness is like clothing around him. He is not merely called “Without Beginning” and “Without End.” He was not born, and he will not die. Just as his existence has no beginning or end, so his greatness is beyond anyone’s reach. His wisdom cannot be comprehended, his power cannot be fathomed, and his sweetness cannot be known.


    Only he is truly good: the unbegotten Father, the completely perfect one. He is full of his offspring, every virtue, and everything of value. More than this, there is no spite in him. Everyone who possesses anything owes it to him, because he gives it. Though no one can reach him, he never grows tired of giving. He is rich in gifts and remains at rest while freely pouring out his favors.


    His kind of being, his form, and his greatness are such that no one has existed with him from the beginning. There is no place where he lives, no place from which he comes, and no place into which he enters. He has no original model to copy in his work. Nothing he does is difficult for him. He does not need existing matter to make what he creates, nor does he use some substance within himself to beget what he begets. No coworker helps him with his work. It is ignorance to make any such claim. Instead, we should declare that he is good, faultless, perfect, [...] and complete, because he is the Totality.


    No name that can be imagined or spoken, seen or understood, truly applies to him—even the most majestic, glorious, and reverent name. Yet people may speak such names to give him glory and honor, as far as they are able. But the mind cannot grasp his inner existence, being, or form. Words cannot express him, eyes cannot see him, and no one can comprehend him. His greatness cannot be searched out, his depth cannot be grasped, his height has no limit, and his extent has no boundary.


    This is the nature of the unbegotten one: unlike a limited being, he does not stretch out or attach himself to anything. Yet he has a nature without a face or form that the senses can perceive. This is why he cannot be comprehended.'
