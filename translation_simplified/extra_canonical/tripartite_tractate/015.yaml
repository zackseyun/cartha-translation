translation:
  language: en
  text: 'And <he> invisibly planted a word within him that was meant to become knowledge. He gave him the power to withdraw and to drive away those who disobey him. In this way, he revealed himself to him.


    But he showed those who came into being for his sake a form they could not comprehend. As a result, they became hostile toward one another. <He> suddenly appeared among them like lightning and vanished like a flash. He ended their entanglement with one another [] by suddenly revealing himself. They were not ready for it; they had not expected it and did not understand it.


    They were terrified and fell down, for they could not endure the light that struck them. The one who appeared overpowered both orders. The beings of memory <have been> called the Little One. In the same way, they had only a dim idea of the Exalted One, who existed before them, and they had planted within themselves a feeling of wonder at the Exalted One who was to be revealed. So they received his revelation and bowed down before him. They became witnesses persuaded of <him>, acknowledging that the light which had appeared was stronger than those who opposed them.


    But those of the likeness became terribly afraid because, from the beginning, they could not bear even to hear that such a vision could exist. So they plunged into the pit of ignorance called “the Outer Darkness,” “Chaos,” “Death,” and “the Abyss.” He placed them below the order of the beings of memory, because that order was clearly stronger than they were. They were considered worthy to rule over the indescribable darkness because they owned it and it was their assigned portion. He also granted that they too would be of use in the plan of salvation that was yet to unfold, [] even though they did not know it.


    There is a [great] difference among these revelations: the revelation given to the one who came into being, the one given to the one who was deficient, and the one given to those who came into being because of him. He revealed himself within the one who came into being because he is with him. He shares his suffering, gradually gives him rest, helps him grow, lifts him up, and gives himself to him for him to enjoy in a vision. But to those who fell outside, he appeared suddenly, like a flash. Then he quickly withdrew and did not allow them to keep looking at him.'
