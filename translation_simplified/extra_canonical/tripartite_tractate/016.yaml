translation:
  language: en
  text: 'When the deficient Word received light, his Fullness came into being. He escaped from those who had troubled him at first and freed himself from them. He cast off that proud thought. Those who had first disobeyed him bowed down and humbled themselves before him. Then he joined with the Repose.


    He rejoiced when his brothers came to visit him. He glorified and praised those who had helped him. He gave thanks for his escape from those who had rebelled against him. He also esteemed and honored the Greatness and those who had resolved to reveal themselves to him.


    He brought forth living images of the living figures. These images are pleasing and good. They come from living beings and resemble them in beauty, but they are not equal to them in truth. This is because they did not come from a union between the one who produced them […] and the one who revealed himself to him. Even so, he acts with wisdom and knowledge, completely mingling the Word with himself. Therefore, those brought forth from him are great, just as He Who Is is truly great.


    After marveling at the beauty of those who had appeared to him, he expressed gratitude for their visit. The Word accomplished this work with the help of those who aided him. He did so because those who had come into being through him were firmly established, so that they could receive something good. He remembered to pray for the plan that would save all those he had produced—a plan made firm so that they too might be established.


    Therefore, those he deliberately produced are on chariots, like those who came into being and appeared. They can travel through every region below, so that each one may receive the place suited to his nature.


    This is destructive for those of the likeness, but beneficial for those of the memory. It reveals those who come from the decision of the aeons—a decision marked by unity and mercy. Yet they are only seeds and have not reached full existence.


    The one who appeared was a face of the Father and of the harmony. He was a garment of all graces and food for those whom the Word produced while praying, glorifying, and praising. This is the one he glorified and praised […]. He looked upon those for whom he pleaded, so that he could perfect them by means of the images he had produced.


    The Word strengthened their help for one another and their hope in the promise. They possess joy, a wealth of repose, and pure delights. As he bestowed perfection, with vision as the goal, he brought into being those whom he had remembered at first, when they were not yet with him. He remains in hope and faith in the perfect Father, as do the Totalities. It is revealed to him before he joins with it. In this way, those who have come into being will not perish when they look upon the light, for they cannot bear its great and lofty stature.'
