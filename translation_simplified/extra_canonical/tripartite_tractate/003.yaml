  english_witness: 'It was not only the Son who existed from the beginning, but the Church also existed from the beginning. Whoever thinks the realization that the Son is an only son contradicts this proposition, owing to the enigmatic nature of the subject, it is not the case. As [] the Father is a unity, and has revealed himself as Father for none but himself, the Son was also discovered as a brother to none but himself, owing to the fact that he is unbegotten and without a beginning. The Father wonders at himself [as] Father, and he gives [himself glory] and honor and [love]. He also, moreover, conceives of himself as Son, congruent with the attributes of beginninglessness and endlessness. In this way is the matter confirmed.


    His countless and limitless offspring are inseparable. Those who exist have originated from the Son and the Father like kisses of those who kiss each other with a good and insatiable thought, the embrace being one, though comprising many kisses. The meaning is that the Church comprises many individuals who existed before the aeons, which, strictly speaking, is called “the aeons of the aeons.” This is the character of the imperishable holy spirits, on whom the Son reposes, because this is his nature, like the Father who also reposes [] on the Son.'
