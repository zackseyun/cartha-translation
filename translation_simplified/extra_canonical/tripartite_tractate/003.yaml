translation:
  language: en
  text: 'The Son was not the only one who existed from the beginning; the Church also existed from the beginning. Because this is a mystery, someone may think that calling the Son the “only Son” contradicts this claim. But it does not.


    The Father is one and has revealed himself as Father only to himself. In the same way, the Son was known as a brother only to himself, because he was not begotten and had no beginning. The Father marvels at himself as Father and gives himself glory, honor, and love. He also understands himself as Son, without beginning or end. This confirms the claim.


    His offspring are countless, without limit, and inseparable. All who exist came from the Son and the Father like kisses exchanged by two who embrace with a good and inexhaustible thought. The embrace is one, though it contains many kisses. This means that the Church is made up of many individuals who existed before the aeons. This is, strictly speaking, called “the aeons of the aeons.” Such is the nature of the holy spirits who cannot perish. The Son rests on them because this belongs to his nature, just as the Father rests on the Son.[a]'
  philosophy: optimal-equivalence
  footnotes:
