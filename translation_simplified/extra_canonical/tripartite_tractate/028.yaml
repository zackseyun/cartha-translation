translation:
  language: en
  text: 'Concerning true baptism: the Totalities[a] descend into it and come into being within it. There is no other baptism. This baptism is redemption in God the Father, the Son, and the Holy Spirit. It takes place when someone professes faith in those names—which are the one name of the gospel—and believes that what they have been told is real.


    For those who believe that the Father, Son, and Holy Spirit truly exist, this means receiving them invisibly. They testify with firm faith and understand them with firm hope. On this basis, what a person has believed in may become theirs as a return. The Father may become one with that person—the Father and God in whom the person has professed faith, who has granted that they should become one with him in knowledge.


    This baptism is called “the garment that those who wear it never take off,” because those who have received redemption put it on. It is also called “the confirmation of the unfailing truth.” It cannot be moved or shaken. It firmly holds those who have received restoration, while they also hold firmly to it.


    It is called “silence” because it is quiet and unmoving. It is called “the bridal chamber” because those whom he has known, and who have known him, live in harmony and cannot be separated. It is also called “the light that never sets and has no flame.” This does not mean that it gives no light. Rather, those who put it on—and those whom it clothes—are transformed into light. It is also called “eternal life,” that is, life untouched by death.


    Whatever names it is given, including names missing from this text,[b] they correspond to all the beautiful things it contains in a way that is simple, pleasant, inseparable, intricate, perfect, and unshakable. What name can it have except “the Totality”? Even if it were given countless names, those names would only point toward it. In truth, it is beyond all words, all voices, and all thoughts. It is beyond everything, and even beyond all silence.


    So it is … with those who are what it is. This is what it truly is. Its face cannot be described or grasped. Yet those who possess knowledge glorify it through what they have grasped.'
