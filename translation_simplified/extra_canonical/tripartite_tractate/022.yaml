translation:
  language: en
  text: 'When the two orders—the right and the left—are joined by the thought that stands between them and gives them a shared plan of salvation, both act with the same passion. Those on the right imitate those on the left, and those on the left imitate those on the right. Sometimes the evil order foolishly begins to do evil, and the wise order copies it. Appearing in male form, the wise order also does evil, as though it too were an evil power. At other times, the wise order begins to do good, and the foolish order tries to imitate its good deeds.


    These kinds of actions shape what comes into being, so that similar and dissimilar things come to resemble each other. Those without instruction therefore cannot discover the cause of all that exists, and they have offered many explanations. Some say that everything owes its existence to providence, because they see order and pattern in the movement of creation. Others say that existence comes from something alien, because they see diversity and the evil caused by the powers’ lawlessness. Others, absorbed in this question, say that things happen because of fate. Still others say that nature or chance is the cause. But most people who have understood only the visible elements know nothing beyond them.


    The Greek sages and the non-Greek peoples reached only as far as the powers that came into being through imagination and empty thought, along with the powers that arose from conflict and rebellion. So when they spoke about what they considered wisdom, a false image deceived them. They thought they had reached the truth, but they had reached error instead. Their error concerned more than minor names. The powers themselves held them back by persuading them that they had understood the Totality.


    As a result, the order turned against itself because of the proud hostility of an offspring of the higher ruler, who existed before him. This is why everyone disagreed about everything: philosophy, forms of medicine, kinds of public speaking, forms of music, and systems of logic. All became matters of opinion and theory. Endless talk prevailed, and they fell into confusion because they could not explain the powers that had given them their theories.


    As for the teachings that arose among the Hebrew nation, their writings came from material people, whose example the Greeks copied. As they tried to express what they had conceived, the powers of the right … inspired them to reason through words and representations of themselves.[a] In this way they began their journey toward the truth, using the varied powers mixed within them.


    Afterward they reached the order of the unmixed powers, before reaching the one formed in the likeness of the Father. He is not invisible by nature. Rather, wisdom conceals him in order to preserve the form of the one who is truly invisible. Therefore, many angels have been unable to see him.


    Among the Hebrew people mentioned earlier were the righteous and the prophets. They did not think or speak from imagination, deceptive images, or obscure speculation. Instead, each spoke accurately through the power at work within him, paying close attention to what he saw and heard. They spoke in harmony and agreement, just as the powers working within them were harmonious, because those powers preserved their unity with one another. Above all, the righteous and the prophets praised the one who was higher and greater than they were. He existed and was appointed because they needed him.


    The spiritual Word produced this among them as among people who need the Exalted One. It gave them hope and eager expectation, in keeping with the thought that is the seed of salvation and with the illuminating word that preserves memory. His offspring and emanations are the righteous and the prophets already mentioned. They preserve the praise of their ancestors and their testimony about what is great. They came into being with hopeful expectation and careful attention. The seed of prayer and searching was planted in them, as it is planted in the many who seek strength. It reveals itself and moves them to love the Exalted One and to proclaim that these things belong to the One and Only.


    Something unique was at work in them when they spoke. Yet their visions and words differed because those who gave them these visions and words were diverse. Therefore, people who paid attention to their words did not reject any of them. Instead, they accepted the Scriptures but interpreted them in different ways. This produced the different groups that still exist among the Jews. Some say that the God who spoke in the ancient Scriptures is one. Others say that he is many. Some say that God is simple and is by nature a single mind. Others say that his actions are connected with the origins of good and evil. Some say that he himself created everything that came into being, while others say that he created through angels. This variety of ideas reflects the many forms and the rich variety found in Scripture, which gave rise to their teachers of the Law.'
