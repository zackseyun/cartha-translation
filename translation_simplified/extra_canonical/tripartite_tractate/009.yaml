translation:
  language: en
  text: 'The whole order of the aeons[a] is filled with love and longing to discover the Father fully and completely. This shared desire is their unrestricted unity. The Father reveals himself eternally, yet he did not want them to know him automatically. Instead, he allows them to grasp him by searching for him, while keeping his original essence—which no search can uncover—to himself.


    The Father gave the aeons these basic desires because they are stages on the path to him, like lessons in a school that trains them how to live. He gave them:


    faith in him and prayer to the one they cannot see;


    strong hope in the one they cannot grasp;


    fruitful love directed toward what it cannot see;


    a worthy understanding of the eternal mind;


    the blessing of abundance and freedom;


    and understanding that longs to glorify the Father for his thought.[b]


    By his will, the exalted Father is known through the Spirit that breathes within the Totalities.[c] The Spirit gives the aeons the idea of searching for the unknown one. It is like a pleasant aroma that makes someone look for its source, except that the Father’s aroma surpasses natural aromas. His sweetness gives the aeons pleasure beyond words. It produces in them the desire to join with him, who wants them to know him together in unity, and to help one another through the Spirit planted within them.


    Though a great weight presses down on them, they are renewed in a way that cannot be described. They cannot be separated from that in which they have been placed, though they cannot grasp it. They do not speak, but remain silent about the Father’s glory and about the one who is able to speak. Even so, they will receive a form from him.


    Though words cannot describe him, he revealed [himself].[d] They possess him, hidden within a thought. Therefore the aeons remain silent about how the Father exists—his form, essence, and greatness. Yet through his Spirit they are worthy to know that he cannot be named or understood. Through his Spirit—the trace of their seeking him—he gives them the ability to grasp him and speak about him.


    Each aeon is a name—that is, each one is a quality and power of the Father. He exists in many names, which are joined together and are in harmony with one another. The rich abundance of language makes it possible to speak about him. In the same way, the Father is one name because of his unity, yet he has countless qualities and names.'
