translation:
  language: en
  text: 'One of the aeons[a] decided to try to grasp what cannot be grasped and to honor it—especially the Father''s nature, which cannot be put into words. This aeon is a Word who came from unity, and so he is one. Yet he did not come from the united Totalities, nor directly from the Father who brought forth the Totality. He was among those who had received wisdom. Their thought already existed within them, and through it they brought forth whatever they willed. Since he was a fruit of wisdom, he had an inborn wisdom that led him to examine the hidden foundation. He also shared in the free will given to the Totalities. Therefore, he did what he desired, and no one held him back.


    The Word''s intention was good. As soon as he came into being, he hurried to glorify the Father. But he wanted to do the impossible: to produce a perfect being from a union in which he had no share and without having been commanded to do so. This aeon was the last and least of those brought forth through mutual help. Before he had produced anything to glorify the Father''s will in harmony with the Totalities, his abundant love moved him to go toward what surrounds perfect glory. Yet the Word had not come into being against the Father''s will, so he did not act entirely apart from it.


    The Father, however, had brought him forth for those whom the Father knew were fit to produce. Then the Father and the Totalities withdrew from him so that the boundary set by the Father would be established. What cannot be grasped is reached not by trying to seize it, but by the Father''s will. This also happened so that what had come into being would become part of a plan of salvation. That plan had to unfold so that the Fullness would be revealed. Therefore, we should not simply condemn what the Word did. Instead, we may say that his action became a cause of the plan of salvation that was destined to unfold.


    The Word brought forth from himself something perfect and single. He was content with this because he desired the Father''s glory. But the beings he wanted to take firm hold of came forth only as shadows, images, and likenesses. He could not look into the light. Instead, he looked into the depths and began to doubt. This produced a separation that deeply troubled him. He withdrew because of his doubt and division, because he had forgotten and did not know himself or what truly exists.


    His self-exaltation and his belief that he could grasp the ungraspable hardened and took root within him. These weaknesses remained while he was beside himself with doubt. He could not reach the Father''s glories, whose greatness cannot be copied, because he was unable to grasp them.


    The single aeon whom he had produced by himself hurried upward to what belonged to him. This relative of his in the Fullness abandoned the part that had come into being in deficiency, together with the beings it had produced as mere imagined forms, because they did not truly belong to him. After bringing himself forth in perfection, the Word became weak, like a female nature separated from its male partner. From the deficient part came things born from his thought and pride. But the perfect part left the deficient part and rose to those who belonged to him. He remained in the Fullness as a reminder that he had been saved from his pride.


    The one who hurried upward and the one who drew him upward were not barren. They produced fruit in the Fullness, and in doing so they displaced what had arisen in deficiency.


    The things born from proud thought resemble the beings of the Fullness. They are only likenesses, images, shadows, and illusions. They have neither reason nor light and belong to empty thought, for nothing real produced them. Their end will match their beginning: what never truly existed will return to nonexistence. Yet they consider themselves greater, stronger, and more honorable than the names whose shadows they are. They are like a beautiful reflection, for an image receives its beauty from the face it reflects.


    They believed they existed by themselves and had no source, because they could see nothing that existed before them. So they lived in defiance and rebellion. They refused to humble themselves before the one for whose sake they had come into being. Each wanted to command and rule the others in a struggle for glory, even though the glory they possessed contained the cause of the ordered world that was to come. Because they were likenesses of the beings above, they proudly sought power. Each acted according to the greatness of the name whose shadow he was, and each thought himself better than his companions.


    Their thoughts also bore fruit. Just as the thoughts of the beings whose shadows they were became sons, so the things these beings imagined became their offspring. Thus they produced a great multitude: fighters, warriors, troublemakers, disobedient rebels, lovers of power, and every other kind of being like them.


    The Word had caused this multitude to come into being, and he became more and more confused and astonished. Instead of perfection, he saw deficiency. Instead of unity, he saw division. Instead of strength, he saw weakness. Instead of rest, he saw turmoil. He could neither make them stop loving turmoil nor destroy that turmoil. He was completely powerless because his Totality and his perfection had left him.


    The beings that came into existence did not understand themselves. They knew neither the Fullnesses[b] from which they came nor the reason they existed. While the Word remained in this unstable state, he could no longer produce anything like the emanations that live in the Fullness—the glories that honor the Father. Instead, he produced small and weak beings, restricted by the same weaknesses that confined him.


    The likeness that remained alone in this condition had caused things to exist that had not caused their own existence. The one in this deficient state continued producing deficient beings until he judged and condemned the irrational beings he had made. He fought against them until those who resisted his sentence were destroyed, as wrath pursued them.'
