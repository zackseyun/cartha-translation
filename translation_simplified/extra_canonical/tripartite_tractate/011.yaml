  - marker: a
    text: “Aeons” is the tractate's technical term for beings belonging to the divine order.
    reason: cultural_note
  - marker: b
    text: “Fullness” and “Fullnesses” are technical terms for the perfect divine realm and its realities.
    reason: cultural_note
