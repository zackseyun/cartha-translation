translation:
  language: en
  text: 'Because of the prayer he offered and the change of heart that resulted from it, it is fitting that some would perish, others would benefit, and still others would be set apart.[a] First, he prepared punishment for the disobedient. He used power from the one who had appeared and from whom he received authority over everything, so that he would be separate from him. He is the one below, and he remains separate from the Exalted One until he prepares the plan of salvation outwardly for everything and assigns each one its proper place.


    The Word first established himself as he brought order and beauty to the Totalities. He became the foundation, cause, and ruler of everything that came into being. Like the Father, who was the cause of this establishment, he was the first to exist after him. He made images of the things that existed beforehand, giving thanks and glory as he made them.


    Then he prepared and beautified a place for those he had produced in glory. It is called “Paradise,” “Delight,” “Joy Full of Nourishment,” and “Joy of the Pre-existent Ones.” It preserves the image of every good thing that dwells in the Fullness.


    Then he prepared and beautified the kingdom as a city filled with every pleasant thing: love among brothers and sisters and abundant generosity, together with holy spirits and the mighty powers that rule over them. The Word produced these powers and firmly established them.


    Next was the place of the Church that gathers together here. It bears the form of the Church that dwells in the aeons, for the Father’s glory.


    After this, he prepared the place for faith and for obedience that comes from hope. The Word received these when the light appeared.


    Next he prepared the place for the desire to pray and plead for help. After this came forgiveness and the message about the one who was going to appear.


    Every spiritual place exists by means of a spiritual power. These spiritual places differ from the beings of memory because their power is founded in an image—an image that separates the Fullness from the Word. By contrast, the power that works through prophecy about the future guides the beings of memory, who came into being for the sake of what existed beforehand. This keeps them from mixing with the things that come into being through a vision of what remains with him.'
