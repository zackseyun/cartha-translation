translation:
  language: en
  text: 'This is the one who was given to them to satisfy and nourish them, to bring them joy, and to give them abundant enlightenment. He does this by working with them, sharing his knowledge, and joining himself with them. He is rightly called the Son because he is the Totalities. They know who he is and know that he clothes them. He is the Son whose existence they understand and whom they were seeking.


    He also exists as Father. They cannot speak about him or grasp him. He is the first one who came into being. No one can grasp or understand him. Can anyone even approach the Exalted One—the one who, strictly speaking, is pre-existent? Yet every name people think of or speak about him is used to honor him. Each name only points toward him, according to each person''s ability to glorify him.


    The one who arose from him came when he extended himself to beget and to produce knowledge for the Totalities. In the damaged text, the words “every name without falsehood” remain, but the rest of the statement is missing. Strictly speaking, he alone is the first one, the human from the Father, the one I call:


    form without form,

    body without body,

    the invisible face,

    the word that cannot be spoken,

    the mind that cannot be grasped,

    the fountain flowing from him,

    the root of those who were planted,

    and the god of all who exist;


    the light of those he enlightens,

    the love of those he loves,

    the care of those he guides,

    the wisdom of those he makes wise,

    the power of those he empowers,

    the assembly of those he gathers to himself,

    the revelation of what people seek,

    the eye of those who see,

    the breath of those who breathe,

    the life of those who live,

    and the unity of those joined with the Totalities.


    All these exist in the one, and he clothes himself completely with them. Yet he is never called by only one name. In this unique way, they are equally the one and the Totalities. He cannot be separated like a body or divided by the names given to him, as though one name made him one thing and another name made him something else. He does not change in the damaged portion of the text, nor does he turn into the names he conceives of, becoming one thing now and something different later. Instead, he remains completely himself to the end. At once and forever, he is all the Totalities without exception, for he contains them all.


    He revealed the Father to the Totalities. Indeed, he is the Totalities, because he is his own knowledge of himself and every quality and power is in him. He himself is the eye through which he knows. He sees himself fully within himself, and he possesses a Son and a form.


    His powers and qualities are therefore countless and beyond anything heard of, because of the way he begets them. Those born through his words are countless and inseparable, as are his teachings and his Totalities. He knows them because they are what he himself is. They all exist within the one name, and they all speak through it. He brings them forth so that they may discover that each has its own qualities while all exist in unity.'
