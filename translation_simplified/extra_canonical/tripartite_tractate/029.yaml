translation:
  language: en
  text: 'There is much more we could rightly say about the Election. But we must say more about the Calling—the name given to those on the right—because we should not neglect them. We spoke about them at length before, as though that were enough. Why, then, did we discuss them only in part?


    I said that all who came from the Word arose in one of several ways: from judgment against the evil ones; from the fury that fights them; from turning away from them and returning to the exalted ones; from the prayers and remembrance of those who existed beforehand; or from hope and faith that salvation could be gained through good works. All these have been judged worthy. They came from good inclinations, and a thought from He Who Is was the cause of their birth.


    I also said that before the Word willingly joined himself to them in an unseen way, the Exalted One gave them the thought already mentioned. They [responded] to it, and this thought became the cause of their existence. When they were saved, they did not proudly exalt themselves as though nothing had existed before them. Instead, they acknowledged that their existence had a source, and they desired to know the one who existed before them.


    I also said that when the light was revealed like a flash of lightning, they bowed down before it. They testified that it had appeared for their salvation.


    Those who came from the Word are not the only ones who will receive what is good. Those whom they produced according to good inclinations will also enjoy rest because the gift is so abundant. Even those born from the desire to rule, who carry within themselves the seed of that desire, will receive the reward for good deeds if they cooperate with those of good inclination. They must deliberately abandon their empty love of glory that quickly fades and obey the commandment of the Lord [...] of glory. Then, instead of a small and passing honor, they will inherit the eternal kingdom.


    We needed to return to what we said earlier. But to present a coherent argument, we must now connect the causes, the results, and the <evidence>. We must consider whether those on the right—whether unmixed or mixed—can receive the gift of salvation and rest. Therefore, we must make a convincing case based on the character of their faith.


    When we confess the kingdom in Christ, every distinction of form, inequality, and change comes to an end. At the end there will again be unity, just as there was unity at the beginning: a place with neither male nor female, slave nor free, circumcised nor uncircumcised, angel nor human. Instead, Christ is all and in all. How can someone who did not exist in the beginning now be found in existence? And what is the condition of someone who was not a slave, since he will receive a place together with [...] someone who is free? They will see directly for themselves. They will no longer have to believe that these things are so merely because they heard a brief word spoken.


    This is because restoring what once existed brings unity. Some may be exalted according to the plan of salvation. They may be appointed over the causes of existing things, set many powers of nature in motion, and delight in them. Yet whether they are angels or humans, they will reach the kingdom, firm assurance, and salvation.


    Here are the reasons. Those who appeared in flesh believed without wavering that he is the Son of the unknown God—the God who has always been beyond description and whom no one could see. They renounced the gods before whom they had bowed and the rulers in heaven and on earth. Even before <he> was taken up, while he was still a child, they testified that he was already preaching. When he lay dead in the tomb, the angels believed he was alive and even [received] life [...] from the one who had died.


    They had performed many sacred rites and wonders in pagan temples, but now they redirected their devotion to another—to Christ. Confessing Christ gave them the power to make this change as they hurried toward him. They had received their former pagan preparation only so that they might later reject it for the sake of the one who was not <honored> in this lower realm, the world. By rejecting the pagan gods, they [gained] Christ. They recognized that he came from the exalted realm, the place of divine rule from which they had come with him. The names they had applied to the beings they worshiped, honored, and served were only borrowed names. Now they transferred those names to the one to whom they truly belong.


    Only after he was taken up did they recognize that he was their Lord, with no lord above him. They handed their kingdoms over to him, rose from their thrones, and surrendered their crowns. He revealed himself to them for the reasons already discussed: to heal them and turn them toward the good thought concerning [...] companion and the angels [...], and because of the abundance of good they had done for it.


    They were then assigned tasks that benefit the elect. These included carrying their iniquity to heaven for an eternal trial under a judgment that cannot be denied or mistaken. They continue acting for the elect until everyone enters earthly life and then departs from it, while their bodies [remain] on earth. They serve all their [...], sharing in their sufferings, persecutions, and dangers—the hardships that fell on the saints more heavily than on others.


    As for the servants of the evil <one>, because evil deserves destruction <...>, firmly because of the [shared life] above all the worlds, which is their good thought and fellowship.


    The Church will remember them as true friends and faithful servants after she receives redemption from the one who [gives them] their reward. This reward includes the joy that fills the bridal chamber and the [...] that lives in her house [...], that lives in thought [...], and what is owed to [...] Christ, who lives with her, together with the expectant waiting for the Father of the Totality. The Church will provide them with angels to guide and serve them.


    The eternal realms will remember with pleasure the thoughts of serving the Church, and they will reward them for all their reflections. A spiritual outflow will come from these realms. Just as Christ [fulfilled] his will, producing the exalted and magnificent things of the Church and giving them to her, so this outflow will become a thought for these servants and provide eternal homes for them. When they reject the downward pull of what is lacking, the power of the Fullness will carry them upward through abundant generosity and the sweetness of the eternal realm that existed beforehand.[a]'
