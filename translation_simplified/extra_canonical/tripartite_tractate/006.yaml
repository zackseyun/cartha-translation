translation:
  language: en
  text: '<...> Just as the wondrous acts of the silences are eternal generations and offspring of the mind, so the qualities of the Word are spiritual outflowings. Because they belong to speech, [] both the wondrous acts and the qualities are the seeds and thoughts of his offspring. They are living, eternal roots that appear as offspring arising from themselves. They exist as minds and spiritual offspring for the Father’s glory.


    Because they are spirits and minds, they do not need sound or spoken words. Nor do they need to perform an action to bring about what they want. Instead, those who come from [the Father] follow the pattern of his own existence and bring forth whatever they wish. And he has child<ren>: the one they think of and speak of, toward whom they move, in whom they continue to exist, and to whom they sing hymns to glorify him. This is their power to bring forth offspring. Their power resembles that of those from whom they came and agrees with their shared help, since they help one another as the unbegotten ones do.


    The Father, because of his exalted place above the Totalities[a], is unknown and cannot be grasped. His greatness is so immense that, if it were revealed suddenly and all at once, it would destroy all the lofty beings among the aeons who came from him. Therefore, he held back his strength and his limitless resources, which make up his [] being. He remained beyond words and names, exalted above every mind and everything that can be said.


    Yet he is the one who stretched himself out, and what he stretched out became a foundation, a place, and a dwelling for the universe. One of his names is “the One by Whom,” because he is the Father of All. Through his work on behalf of existing beings, he planted within them the thought of searching for him. The wealth of their [. . .] is that they understand that he exists and inquire into what was existent.'
  philosophy: optimal-equivalence
