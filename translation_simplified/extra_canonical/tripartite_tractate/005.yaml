translation:
  language: en
  text: 'The Father brought forth the All like a small child, like a drop from a spring, like a blossom from [a vine], like [a flower], and like a <planting> [. . .]. It still needed [nourishment], growth, and perfection. He held it back for a time. From the very beginning, the Father had conceived the All, possessed it, and beheld it. Yet he kept it hidden from the first beings who came from him. He did this not out of envy, but because the aeons could not receive perfection too soon. Otherwise, they might raise themselves to the glory that belongs only to the Father and imagine that they possessed everything from themselves. He had willed that they should come into being, and he also willed that they should become perfect beings. So, at the time he chose, he gave them a perfect understanding of his generosity toward them.


    The Father raised up one to be a light for the beings who came from him. They receive their name from this one: the full, complete, and perfect Son. The Father brought him forth, mingled with what came from him, [] [. . .] sharing in the glory [. . .] the Totality, corresponding to [. . .]. By means of this, each one is [able] to receive it for [himself], though none had such greatness before being received by it. They share only partly in the Son’s own way of being, form, and greatness. [They] can see him and speak about what [they] know of him because they clothe themselves with one another and are able to grasp [him]. His own way of being, however, is beyond comparison, so that the Father could receive honor from each one and reveal himself despite his incomparability. Though he remains hidden and unseen, they marvel at him in their minds. His supreme greatness is revealed when they speak of him, behold him, and sing his praise because of the abundance of his sweetness.'
