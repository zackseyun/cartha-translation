translation:
  language: en
  text: 'He did not reveal all his different qualities to the Totalities at once. Nor did he show those who came from him what it means that he is equal to himself.


    All who came from him are the aeons of the aeons.[a] They are outpourings and offspring of his power to bring forth life. Because they share that power, they too bring forth offspring for the Father''s glory. The Father is the cause who established them. As we said before, he creates the aeons to be roots, springs, and fathers. They glorify him because he possesses knowledge and wisdom. The Totalities know that they came from the knowledge and wisdom of the one who is the Totality.


    If each member of the Totality had glorified the Father only according to its own ability, their praise would have produced no more than a pale reflection of the Father, who is the Totality. Instead, as they sang his glory, the power of his unity—the unity from which they came—brought them together. They mingled and became one with one another. Then the whole assembly of the Fullness offered the Father glory worthy of him. Their praise formed one image with many parts: it honored the one Father, and they drew near to the one who is himself the Totalities.


    This was the aeons'' praise to the one who produced the Totalities as firstfruits among the immortals and as an eternal one. They had come from the living aeons, perfect and full because of the one who is perfect and full. Through their shared fellowship, the full and perfect state of those who offered perfect glory remained intact, like the perfect Father. When he is glorified, he also hears the praise that glorifies him, revealing that they too are what he is.


    They received a second honor when the Father returned something to them. They then recognized the gift that enabled them to bear fruit with one another for the Father. Just as they had been brought forth gloriously for him, so they showed themselves perfect when they glorified him.


    They became fathers of a third act of glorification. This praise matched the freedom and power brought forth with them, which enabled them to glorify both together and individually, by their own will. The first and second acts of glorification were both perfect and full. They revealed the perfect and full Father, along with the perfect things that came from glorifying the perfect one.


    But the fruit of the third glorification includes the will of every aeon and each of the Father''s qualities and powers. This fruit is full and perfect because the aeons give the Father the glory they desire and are able to give, both in agreement with one another and as individuals. This is what he loves and what he exercises his power over, for in this way the Father is glorified. Therefore, they are minds of minds and words of words, elders of elders and ranks of ranks, each exalted above another.


    Each one who gives glory has its own place, honor, dwelling, and rest, corresponding to the glory it offers. All who glorify the Father continue bringing forth offspring eternally, helping one another to do so. Their outpourings are infinite and beyond measure. The Father has no envy at all toward those who came from him, even when they bring forth something equal or similar to him. For he exists within the Totalities, bringing forth life and revealing himself.


    He makes whomever he wishes a father, and he truly is that one''s Father. He makes whomever he wishes a god, and he truly is that one''s God. He makes them the Totalities, and he is their Totality. Properly speaking, all great names belong there. The angels who came into being in the world with the rulers[b] share these names, even though they bear no likeness to the eternal beings.'
