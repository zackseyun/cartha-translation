translation:
  language: en
  text: 'The beings of memory who are outside are humble. They preserve the representation of the Fullness, especially because they share the honored names given to them. Conversion brings humility toward the beings of memory. This humility is also the law of judgment, expressed through condemnation and anger.


    This humility is also a power. It separates those who fall beneath these beings and sends them far away. It keeps them [] from spreading over the beings of memory and conversion. This power includes fear, confusion, forgetfulness, bewilderment, ignorance, and things produced by imagination, just as a likeness is produced. These lowly things are even given exalted names. Knowledge <is lacking among those> produced from them through pride, the desire to control, disobedience, and falsehood.


    He gave each of them a name, because each of the two orders has its identity in a name. Those who belong to memory and representation are called “Those of the Right,” “Soulish,” “the Fiery Ones,” and “Those of the Middle.” Those who belong to proud thought and likeness are called “Those of the Left,” “Material,” “the Dark Ones,” and “the Last Ones.”


    After the Word established the three groups in their proper order—the images, the representations, and the likenesses—he kept the realm of the images pure from all who fought against it, because it is a place of joy. But he revealed to the beings of memory the thought he had stripped from himself. He wanted to bring them into a material union and give them an ordered system and a dwelling place. This would awaken in them a desire to weaken evil’s attraction. They could then stop delighting too much in the glory around them, which kept them in exile. Instead, they could recognize the weakness from which they suffered. [] Then they could develop love and continually search for the one who could heal their weakness.


    To give them form, he placed the word of beauty over those who belong to the likeness. He also placed the law of judgment over them, along with the powers that the roots had produced [in] their desire to control. The Word was pleased with these powers because they were useful in the plan of salvation, so he [chose] them to rule over them. In this way, the order could be protected from those who would drag it down into evil—through the help of the beautiful word, the threat of the [law], or the influence of the desire to control.


    The Word knows that both orders share this desire to control. He kindly granted their desire, as he did for everyone else, and gave each one a suitable rank of authority. Each would rule over a place and a task, yielding to those of higher rank while directing the work of the lower realms. Each exercised authority according to its own way of being. Therefore, among the angels [] and archangels, some lead and others serve under them. They hold different kinds of authority and perform many kinds of work.


    Each ruler, or archon, together with his race and privileges, enjoys whatever his assigned portion grants him. Each took his post according to the way he had appeared and was entrusted with a role in the plan of salvation. None is without kingship over them, from one end of the heavens to the end of the [earth], throughout every region of the [earth], and among those beneath the earth. There are kings and lords, as well as those who carry out commands. Some oversee punishment, and others oversee justice. Some give rest and healing, others teach, and still others keep watch.'
