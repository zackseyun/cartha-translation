translation:
  language: en
  text: 'This is the full nature of their coming into being. It was caused by what [Christ] bore when he shone on them [with] a [light] he revealed [. . .] like his [. . .] which will be [. . .] like his [. . .] The only difference among those who were


    (5 lines missing)


    [. . .] those who exist [. . .] through [. . .] as [I said] earlier. But those who belong to the material realm will be abandoned until the end, to be destroyed, because they will not give their [names], should they return once more to what [will not be]. Like they were [. . .] they were not [. . .] but they were useful during the time they lived among them, though in the beginning they were not [. . .] Then [. . .] to act differently through the control they possessed in the preparation, [to] resist them.


    Although I keep using these words, [I have not grasped] the thoughts. Some elders [. . .] him greatness.


    (5 or 6 lines missing)


    [. . .] every [. . .] angel [. . .] words and [the sound of] a trumpet, announcing the great and complete restoration from the radiant east, in the bridal [chamber], which is the love of God the [Father], in accord with the power which [. . .] of the greatness [. . .] the sweetness of the [. . .] his, because he reveals himself to the greatnesses [. . .] his goodness [. . .] the praise, the kingdom, and the [glory] through [Jesus Christ], the Lord, the Savior, the Redeemer of all those embraced by the one filled with loving mercy, through [his] Holy Spirit, from now through every generation, forever and ever. Amen.'
