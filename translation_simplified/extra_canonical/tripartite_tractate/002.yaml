translation:
  language: en
  text: 'If he cannot be comprehended, then he cannot be known. No thought can grasp him. Nothing can see him, no words can express him, and no hand can touch him. Only he knows himself as he [text missing] is. Only he knows his own form, greatness, and measure as they truly are. He alone can think of himself, see himself, name himself, and understand himself. His own mind, eye, mouth, and form are equivalent to his own being. So he is what he thinks, sees, says, and understands. He remains inconceivable, inexpressible, ungraspable, and unchanging. Yet what he thinks, sees, says, and considers is sustenance, joyful, true, pleasing, and restful. He surpasses every kind of wisdom. He is above every mind and beyond all glory, beauty, sweetness, greatness, depth, and height.


    Although he is unknowable by nature and has all these great qualities, he can give knowledge of himself if he chooses to do so from the riches of his sweetness. His will itself is the power to do this. Yet this great one holds himself back in silence, though he causes the Totalities[a] to come forth into their eternal existence.


    [Text missing.] Properly speaking, he begets himself in a way no words can express. He alone is self-begotten, for he is conceived from himself and knows himself as he is. From his infinite greatness, unsearchable wisdom, immeasurable power, and sweetness beyond taste, he brings forth whatever is worthy of his respect, glory, honor, and praise. He brings himself forth through generation and receives glory, praise, honor, and love. He glorifies and praises himself, giving himself honor and love. In this way he has a Son who exists within him, with silence concerning him. The Son is inexpressible within the inexpressible one, invisible within the invisible one, ungraspable within the ungraspable one, and incomprehensible within the incomprehensible one.


    In this way the Son exists forever in the Father. As we explained earlier, the Father knows himself within himself in an unbegotten way. He begot himself through thought: thought about himself, the perception [text missing] of himself, the [text missing] of his eternal nature. Properly speaking, however, this is silence, wisdom, and gift—if those are the right names for it. Properly speaking, the Father exists, with no [one else] before him and no other unbegotten one apart from him. In the same way, [the Son] exists, with no one before him and no other son ever after him. Therefore, he is the Firstborn and only Son. He is the Firstborn because no one exists before him, and he is the only Son because no one will come after him. He also has his fruit, which cannot be known because of its surpassing greatness. Yet from the riches of his sweetness, he wanted his fruit to become known. He revealed power that cannot be explained and mingled it with the great wealth of his generosity.'
