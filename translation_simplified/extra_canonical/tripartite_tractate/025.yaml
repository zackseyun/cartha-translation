translation:
  language: en
  text: 'Humanity came to be divided into three kinds by nature: spiritual, soulish, and material. These correspond to the Word’s three different inclinations, which produced the three kinds. Each kind is known by its fruit. At first, however, no one knew who belonged to which kind. This became clear only when the Savior came, shone his light on the saints, and revealed which kind each person belonged to.


    The spiritual kind is like light from light and spirit from spirit. When its head appeared, it immediately rushed toward the kind where it belonged. In an instant, it grew a body for its head and gained knowledge through the revelation.


    The soulish kind, however, is like light from fire. It hesitated to recognize the one who appeared to it and was even more hesitant to go to him in faith. A voice instructed it, and it was content because it remained close to the hope of the promise. It received a pledge that gave it assurance of what was to come.


    The material kind, however, is entirely alien. It is like darkness that rejects the shining light, because the light’s appearance destroys it. Because it did not welcome the Lord’s coming, it is uncontrolled and full of hatred for the Lord’s revelation.


    The spiritual kind will receive complete salvation in every way. The material kind will be completely destroyed, as an enemy is destroyed. The soulish kind stands between them, both in its origin and in its nature. It is divided, inclined toward both good and evil. Its appointed outcome is uncertain. The damaged text at this point also speaks of its complete escape from what is good.[a]


    The Word produced some beings according to the pattern that already existed in his thought. When he remembered the Exalted One and prayed for salvation, they were saved immediately.[c] The saving thought and what it produced brought them complete salvation. The same applies to those whom they later produced, whether angels or humans. They acknowledge that someone higher than themselves exists; they pray to him and seek him. Therefore, they too will receive the same salvation as those first produced, because they come from the good inclination. They were given the task of announcing that the Savior would come and, after he came, that he had been revealed. When he appointed these angels and humans to this service, they truly received the nature of their being.


    Others came from a thought driven by the desire to rule. They were produced through the blow struck by the Word’s opponents. Because they are mixed, their final outcome is uncertain. Those who reject the desire to rule, recognizing that their authority was granted only for limited times, will glorify the Lord of glory and give up their anger. Their humility will be rewarded with life without end.


    Others are proud because they crave status and love glory that quickly passes away. They forget that their authority was entrusted to them only for limited times. Therefore, they do not confess that the Son of God is Lord of all and Savior. They do not give up their anger or stop imitating the evil ones. Along with all who have gone astray and wandered away, they will be punished for their ignorance and foolish desires.


    Still more evil are those who acted wickedly against the Lord, as the powers on the left did when they even put him to death. They said to themselves, “If we kill the one proclaimed king over all that exists, we will become masters of it all.”[b] The humans and angels who pursued this plan do not belong to the good inclination of those on the right; they come from the mixture. They chose glory for themselves, though such glory and desire soon pass away. By contrast, humility is the way to eternal rest and the salvation of those on the right.


    When these humans and angels praise the Lord, seek what pleases the Church, and join her in singing the hymn of the humble as fully as they can, they will also share in her suffering and anguish. Like all who seek the Church’s good, they will receive a share in her hope.


    The path of those belonging to the left leads to destruction. They not only rejected the Lord and plotted evil against him, but also directed their hatred, envy, and jealousy against the Church. This is why those who have troubled the Church and stirred up trials against her are condemned.'
