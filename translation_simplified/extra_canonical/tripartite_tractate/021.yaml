translation:
  language: en
  text: 'Matter, whose shape keeps changing, causes the blindness that rules through the powers […] within them, all of it […], as they produce together and are destroyed. The thought placed between those of the [right] and those of the left has the power to imitate. Every being the first ones wish to make is like the shadow cast by a body. This is the root of visible creatures.


    The whole arrangement of images, representations, and likenesses came into being for those who need to be educated, instructed, and formed. These things serve as a mirror, so that what begins small can grow step by step. This is why humanity was created last: everything made for human beings was prepared and provided first.


    Humanity was created in the same way as everything else. The spiritual Word worked invisibly, bringing humanity to completion through the Demiurge and his angelic servants. Presumption and its rulers also took part in shaping humanity. Human beings are like a shadow made from the earth, resembling those cut off from the Totalities. They were made by all these powers—those of the right and those of the left. Each order gave the human a form, just as the Totality itself had been formed.


    The [form] produced by the Word was deficient, as though afflicted by weakness. He led it into [forgetfulness], ignorance, [deficiency], and every other weakness. The Word gave only the first form through the Demiurge, who acted in ignorance. This was so that the human would learn that something higher exists and that he needs it. This is what the prophet called “the living Spirit,” “the breath of the exalted ages,” and “the invisible.” It is the living soul that gave life to the body, which at first had no life. Here, to be without life is to be in ignorance.


    Therefore, we should understand that the first human''s soul came from the spiritual Word, although the Creator thought that he himself had made it. What was breathed into the human passed through the Creator as breath passes through a mouth.


    The Creator also sent souls down from his own substance, for he too has the power to reproduce, since he was produced as a representation of the Father. Those of the left also produced their own kind of human, because they too possess a likeness of being.


    Spiritual substance is one unified reality and one representation, though its weakness takes [many] forms. The substance of souls has a twofold condition: it knows and praises the Exalted One, yet it also leans toward evil because presumption draws it that way. Material substance is different and appears in several forms. Its weakness prevailed through several kinds of inclination.


    Thus, the first human is a varied formation and a creation made from different elements. He is a storehouse for what comes from both the left and the right. He is also a spiritual Word whose concerns are divided between the two substances from which he receives his being.


    This is why it is said that a paradise was planted for him, where he could eat food from three kinds of trees. It is a garden belonging to three orders, and it gives delight. The noble and chosen substance within the human was higher than the creation, and it was an injury to them. So they gave him a command and warned that a terrible danger—death—would come upon him. He was allowed to taste and enjoy only the bad trees. He was forbidden to eat from the other tree, the tree of duality, and even more strictly from the tree of life. They did this to keep him from receiving honor equal to theirs and to prevent [him …] them.


    The evil power called “the serpent,” cleverer than all the other evil powers, led the human astray. It did this through the plan of those connected with memory and desire. It caused him to disobey the command so that he would die. Then he was driven from that place and all its delights.


    This expulsion was their punishment: he was driven away from the delights belonging to those of likeness and those of representation. Yet it was actually an act of providence. Through it, human beings would learn that pleasures last only a short time, unlike the eternal place of rest. The Spirit had ordained this in advance. The plan was for the human to experience the great evil called death—complete ignorance of the Totality—and to taste all the evils that come from it. Then, after suffering passions, anxieties, and everything they produce, he would receive the greatest good: eternal life, complete knowledge of the Totalities, and the obtaining of every good thing.


    Because the first human disobeyed, death became king. It used to kill every human being as long as its dominion remained in force. Death received this kingdom because of the plan of salvation already described, in accordance with the Father''s will.'
