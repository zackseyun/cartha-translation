- pob_phrase: the projection of a shadow that follows a body
  simplified_phrase: the shadow cast by a body
  preserved_meaning: Visible creatures are derivative shadows rather than independent realities.
  reasoning_layer_used: POB text and source witness
  rationale: The rewrite keeps the shadow image in ordinary English.
- pob_phrase: the substance of the soulish ones, its condition is dualistic
  simplified_phrase: The substance of souls has a twofold condition
  preserved_meaning: This category both knows the Exalted One and inclines toward evil.
  reasoning_layer_used: Immediate POB context
  rationale: The following contrast explains the twofold condition without the technical word “soulish.”
- pob_phrase: death reigned
  simplified_phrase: death became king
  preserved_meaning: Death is personified as a ruling power with temporary dominion.
  reasoning_layer_used: POB text and concluding context
  rationale: The king image makes the force of death's reign immediately clear.
interpretive_expansions:
- pob_phrase: what is without life is ignorance
  rendering: Here, to be without life is to be in ignorance.
  claim: The passage uses lifelessness as a description of ignorance.
  evidence:
  - The POB directly equates being without life with ignorance.
  - The context connects deficiency, forgetfulness, and ignorance.
  confidence: high
  alternatives_preserved:
  - The wording does not deny bodily lifelessness outside this explanation.
- pob_phrase: death, which is thorough ignorance of the Totality
  rendering: the great evil called death—complete ignorance of the Totality
  claim: Here death includes complete ignorance of the Totality.
  evidence:
  - The POB explicitly defines death with this phrase.
  - The conclusion also portrays death as a power that kills.
  confidence: high
  alternatives_preserved:
  - Death remains a ruling power that kills.
  - The rendering does not reduce death to ignorance alone.
