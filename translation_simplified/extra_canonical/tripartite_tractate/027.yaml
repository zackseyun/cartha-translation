translation:
  language: en
  text: 'The Father knew him beforehand. Before anything else existed, he was already in the Father’s thoughts. There the Father also possessed those for whose sake he revealed him. The Father placed deficiency upon what lasts only through passing ages, so that his Fullness would be glorified. Because he was unknown, he showed his kindness by [giving knowledge of himself].


    In this way, knowledge of him was gained as a sign of his goodness and as a revelation of his abundant sweetness. This is the second glory. Thus he has also been revealed as the cause of ignorance, even though he produces knowledge. His wisdom is hidden and beyond our grasp. In it he keeps this knowledge until the end, when the Totalities have exhausted themselves in their search for God the Father. No one has discovered the Father by their own wisdom or power.


    He graciously grants them knowledge of the great gift of the excellent thought, with unending thanksgiving to him. His purpose cannot be shaken. In keeping with it, he eternally reveals himself to those whom his will has judged worthy to know the Father. The Father cannot be known by his very nature. Yet in his foreknowledge he planned for them to receive knowledge and every good thing that comes with it, together with tasting ignorance and its pains.


    In this way, they would taste evil things and be trained through them [. . .] for a time, so that they could [enjoy good things] forever. They expose themselves and are continually rejected and slandered by their enemies. Yet they regard this as an adornment and a wonderful sign of exalted realities. This showed that those who did not know the Father were responsible for their own ignorance. By contrast, his power made it possible for them to know him.


    This knowledge is rightly called “the knowledge of every possible thought” and “the treasure.” To describe it more fully, it reveals those who were known from the beginning. It is also the path toward union and toward the Pre-existent One. Therefore, those who grow in greatness are the ones who have given up the greatness assigned to them in the plan of salvation according to the divine will. In this way, the end could become like the beginning.'
