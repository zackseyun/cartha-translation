translation:
  language: en
  text: 'The aeons of the Father of the Totalities experienced a fall. Yet it was only as though the fall were their own experience, for the Father had planned it with care, generosity, and great kindness. [] […] the Totality, in order to teach them about [the deficiency] through the one [from whom alone they] all received the power to remove deficiencies.


    His own [order came] into being from <him> who hastened on high, from what came forth from him, and from complete perfection. The one who hastened on high became an intercessor for the deficient one. The emanation of the aeons joined him; it had come into being in harmony with the things that exist. When he prayed to the aeons, they were united. So they gladly and eagerly agreed together to help the deficient one. They gathered and pleaded with the Father, whose intention is generous, asking that help would come from the Father above for his glory. The deficient one could become perfect only by the will of the Fullness of the Father. He had drawn it toward himself, revealing it and bestowing <it> on the deficient one.


    Their glad willingness brought them into harmony. From that harmony they produced the fruit—an offspring of the harmony and a unity possessed by the Totalities—which revealed the face of the Father. The aeons fixed their thoughts on the Father as they glorified him and prayed for help for their brother. They asked the Father to join with them. In this way, they eagerly and joyfully produced the fruit. Then he revealed the expression of the agreement arising from their mutual union: his beloved Son. []


    The Son, in whom the Totalities are well pleased, clothed them with himself like a garment. He made the deficient one perfect and strengthened the perfect ones. Strictly speaking, he is called “Savior,” “Redeemer,” “the Well-Pleasing One,” “the Beloved,” “the Paraclete,” “the Christ,” and “the Light for the Appointed Ones.” He corresponds to those who produced him because he became the names of the places granted to him. Yet what other name can be given to him except “the Son”? As we said before, this is because he is the knowledge of the Father, whom he desired that they know.


    The aeons brought forth both the face of the Father whom they glorify, as we wrote earlier, and their own face. The aeons who glorify him brought forth <his> appearance and their own face. They were formed as his army, like the army of a king. The beings that came from the thought possess a powerful unity and a harmony in which they are blended together. They were brought forth in a complex form so that the one receiving help could see those for whom he had interceded. He also sees the one who bestowed the help on him.


    The fruit of the agreement with him, mentioned earlier, is under the power of the Totalities. The Father was able to place the Totalities within him: those who existed before, those who exist now, and those who will exist. [] He revealed those whom the Father had placed within him, without giving them away but entrusting them to him. With the authority granted to him from the beginning and the power needed for the work, he carried out the universal plan of salvation. In this way, he began to carry out his revelation.


    The one in whom the Father and the Totalities dwell <was> created before the one who cannot see. He taught that sightless one about those who sought to receive sight through the radiance of the perfect light. First, he made him perfect in joy beyond words. He made him perfect for his own sake, as a perfect one, and also gave him what was fitting for each individual. This is the nature of the first joy.'
