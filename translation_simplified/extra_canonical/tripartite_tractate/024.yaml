translation:
  language: en
  text: 'Because he was moved by mercy, our Savior became like those for whom he appeared. Through an instinctive passion, they had become flesh and soul. Flesh and soul continually rule them, leading them to destruction and death. But those who came into being [...] invisibly, he taught invisibly about himself.


    He took upon himself not only the death of those he intended to save, but also the lowly condition into which they had fallen when they were born with body and soul. He chose to be born as a child with body and soul. Though he was exalted above the fallen ones who possessed the light, he shared all their other conditions. Yet he chose to be conceived without sin, impurity, or corruption. He was born into physical life while still dwelling in life. This happened because it had been determined that both he and they would become body and soul because of passion and a shifting inclination from the Word, after the Word stirred himself in self-conversion.


    According to the plan of salvation, the Savior took upon himself the results of the things already mentioned. These had come from the Word’s illuminating vision and firm thought after he stirred himself in self-conversion. In this way, those who, like the Savior, took on body and soul also received a firm foundation, stability, and wisdom. It had been decided beforehand that they would come together when the Savior came, and his coming had also been decided beforehand. They came only after the Savior had made his decision. Thus, in their coming forth in flesh, they far surpassed those produced from deficiency [...]. They too came forth in bodily form, as the Savior did, through the revelation of their union with him.


    These people are of one substance—the spiritual substance. Yet the plan of salvation assigns different roles to different groups. Some arise from passion and division and need healing. Others come from the prayer that heals the sick, and they are appointed to care for the fallen. These are the apostles and the preachers of the message. They are the Savior’s students and the teachers of those who need instruction.


    Why, then, do they share the same passions as those produced from passion? According to the plan of salvation, they were produced in one body with the Savior, who did not share those passions. The Savior was the image of one undivided being—the Totality in bodily form. He therefore preserved the pattern of inseparability, from which freedom from passion comes. But the others are images of each one who was revealed. That is why they accept separation from their pattern. They took on form for the planting beneath heaven, which also [...] shares in the evil ruling the places they have entered. The will held the Totality captive under sin so that, by an act of will, he could show mercy to the Totality and save them. The one who is unique was chosen to give life; everyone else needs salvation.


    For this reason, he was the first among them to receive the grace to give the gifts proclaimed by those he considered worthy to preach to others. The seed of the promise of Jesus Christ was planted, and we have served its revelation and union. This promise made teaching possible, including a return to what they had been in the beginning. They have within them a drop that draws them back toward that beginning. They call this “redemption”: release from captivity and the gaining of freedom.


    This captivity is the enslavement of those held by ignorance. Freedom, by contrast, is knowing the truth that existed before ignorance and endures forever, without beginning or end. This truth is good, a cure for everything, and release from the nature that enslaves. That nature caused suffering among those produced by a lowly thought of emptiness. It is the nature of the evil inclination [...], working through the thought that degrades them into a lust for control.


    From the wealth of grace that looked upon the children, they received the treasure of freedom. Freedom overthrows passion and destroys the things it had earlier cast away when the Word separated them from himself. He destined those things for destruction until the plan of salvation reaches its end. Yet he allowed them to continue existing because they too served a purpose in what had been determined beforehand.'
