translation:
  language: en
  text: 'He appointed one archon[a] over all the other archons, and no one gives this archon orders. He is lord over them all. He is the face that the Word brought forth through his thought to represent the Father of the Totalities. So he is adorned with every name that reflects the Father, because he possesses every quality and glorious attribute. He is called “Father,” “God,” “Demiurge,”[b] “King,” “Judge,” “Place,” “Abode,” and “Law.” The Word uses him as a hand to arrange the work in the realms below and as a mouth to speak what must be prophesied. He spoke and established order. When he saw that his works were great, good, and wonderful, he rejoiced in them. He thought that he himself had conceived, spoken, and done these things. He did not know that the movement within him came from the Spirit, who moved him according to a predetermined purpose so that he would do whatever he wished.


    He spoke about the things that came into being through him, and they came into being as images of the spiritual realms mentioned earlier. But he did more than perform his work. He had been appointed as the father of his plan of salvation, so he brought forth things not only through himself and the seeds, but also through the chosen Spirit who will descend through him to the realms below. Nor does he merely speak his own spiritual words. In a hidden way, he speaks through the Spirit, who cries out and gives birth to things beyond the Spirit’s own nature. Because he is God and Father by nature and bears all the other titles of honor, he assumed that these titles belonged to him by his own nature.


    He established a place of rest for those who obey him, and punishments for those who disobey. Paradise and a kingdom are with him, while everything else dwells in the realm that existed before him. These are more valuable than their copies because they are connected to the thought. This relationship is something like that of a shadow and a garment, for he cannot see things as they truly are.


    He appointed workers and servants to assist him in what he did and said. Wherever he worked, he left behind his face and beautiful name, bringing forth and declaring whatever he contemplated. From his own being, he established visible images of the light and of the invisible spiritual realms. In this way he adorned every place. Each place reflected the image of the one who had established it, and so they were made firm. The paradises, kingdoms, places of rest, promises, and great numbers of servants who carry out his will are themselves ruling lords. Yet they remain beneath the lord who appointed them.


    After listening to him in this way, he placed the lights that form the source of the system over the ordered realms below. The invisible Spirit moved him to govern through his own servant, whom he also used as his hand, mouth, and face. He established order, threats, and fear. In this way, those who acted in ignorance could remain in the place assigned to them, for the archons above them held them there as if by chains.


    The whole realm of matter is divided into three groups. First, the spiritual Word produced powers from imagination and pride and placed them highest in spiritual rank. These powers then produced other powers through their desire to rule. He placed these in the middle rank. Because they desired control, they could rule the order beneath them and enforce their commands by force. Other powers arose from envy, jealousy, and every similar impulse. He placed them in the rank of slaves to control the outermost regions and command everything that exists and comes into being. From them come beings that bring sudden, deadly illnesses and are eager to reproduce, though they were nothing in the place from which they came and to which they will return. Therefore, he appointed ruling powers over them. These powers work on matter without ceasing, so that the offspring of existing beings may also continue to exist without ceasing. This is their glory.'
