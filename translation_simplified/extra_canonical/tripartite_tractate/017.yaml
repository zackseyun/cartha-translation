translation:
  language: en
  text: 'The Word had regained his stability and had begun to rule those who came into being through him. His restored thought was called “Aeon” and “Place” for all whom he had produced according to the decision. It was even called the “Assembly of Salvation,” because he healed himself from the scattering of his many thoughts and returned to a single thought. It was also called “Storehouse” because of the rest he gained and kept for himself alone.


    It was called “Bride” because of the joy of the one who gave himself to him, hoping that their union would bear fruit—the one who appeared to him. It was called “Kingdom” because he became firm and rejoiced in ruling those who had fought against him. It was also called the “Joy of the Lord” because of the gladness with which he clothed himself. The light remains with him and rewards him for the good things that belong to him, including the thoughts of freedom.


    The aeon mentioned earlier is above the two groups that fight each other. It is not allied with those who exercise control, nor does it belong to the frailty and weakness associated with memory and likeness. The aeon in which the Word placed himself was filled with joy. It had the form of matter, yet it also shared the nature of the cause that had been revealed. For it was an image of those who live in the Fullness, who came into being from the rich delight of He Who Is.


    The Word rejoiced when he saw the face of the one who revealed himself. With delight, expectation, and the promise of what he had asked for, he received the Son’s name, essence, power, and form. This was the one he loved and delighted in, the one for whom loving prayers had been offered.


    This aeon was light. It desired to be firmly established, was willing to learn, and had an eye with which to see. It received these qualities from the exalted ones. It also became wisdom for the Word’s thought in opposition to those placed lower in the plan of salvation. It became a word with which to speak and brought other such things to perfection.


    Those who took form with him according to the image of the Fullness had as their parents the ones who revealed themselves. Each was a copy of one of those figures. They were male forms and did not arise from the weakness called female. Instead, they came from the one who had already escaped that weakness. They are called “Church” because they form a harmonious likeness of the gathered assembly of those who have appeared.


    What came into being in the image of the light is also perfect, because it is an image of the one existing light, which is the Totalities. Though it is lower than the light whose image it bears, it remains inseparable from that light, for it is a face of the inseparable light.


    Those who came into being in the image of each aeon are, in their essence, what we described earlier. But they are unequal in their power at work, because that power is present differently in each one. In their union with one another they are equal, yet each aeon keeps its own distinctive qualities. For this reason they have passions, and passion is a weakness. They were not produced from the unity of the Fullness. Instead, they came forth prematurely from one who had not yet received that unity from the Father, or from union with the Father’s Totality and will.


    Even so, this served the future plan of salvation. They were allowed to pass through the lower regions because those regions could not receive them all arriving suddenly, but only one at a time. Their arrival is necessary, because through them everything will be brought to completion.


    In summary, the Word received a vision of everything: what existed in the past, what exists now, and what will exist. He received this vision because the plan for the salvation of everything had been entrusted to him. Some things have already come into being according to their intended purpose. But he has kept within himself the seeds of things that do not yet exist, because of the promise concerning what he had conceived—the promise that these seeds would come to be.


    The Word also produced his offspring, which was the revelation of what he had conceived. Yet for a time the promised seeds were kept from coming into being. They had been appointed for a mission when the Savior comes with his companions, those who are first in the knowledge and glory of the Father.'
