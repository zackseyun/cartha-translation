translation:
  language: en
  text: 'The Totalities came forth from the one who exists. They did not come into being by being separated from one another, as though the one who gave birth to them had cast them away. Instead, their birth was like an extension. The Father extends himself toward those he loves, so that those who came from him might also become him.


    The present age is one whole, yet it is divided into units of time. These are divided into years, then seasons, months, days, hours, and minutes. In the same way,[1] the age of truth is both one and many. It is honored with both lesser and greater names, according to what each one can grasp. It is like a spring that remains what it is even as it flows outward and expands into streams, lakes, canals, and branches. It is also like a root spreading beneath trees and branching out with their fruit. Or it is like a human body, which is one inseparable body even though it has many branching limbs—primary and secondary, great and small.


    The aeons[2] brought themselves forth willingly, in harmony with the third fruit and through the understanding he gave them for thought. They do not seek to offer glory along with the words of [praise] that the separate Fullnesses brought forth together. Nor do they seek to give glory with the whole Totality, or with any individual aeon who has reached a higher place or state than his own, unless he obtains [what] was desired from the one with the more exalted name and higher place.


    [1] They receive one another in the higher place. The one who wished to rise higher then brings himself forth, so to speak—together with the other one and with what he is. He is renewed together with the one who came to him from his brother. He looks upon him and appeals to him about the matter.


    For this to happen, the one who wished to give glory says only this to him about it. Speech has been given a limit in the Fullness. Therefore, they remain silent about the Father because he cannot be comprehended, though they are still allowed to speak about their desire to grasp him.'
