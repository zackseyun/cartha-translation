translation:
  language: en
  text: 'The prophets did not speak on their own initiative. Each one spoke about what he had seen and heard concerning the message about the Savior. The heart of their message was that the Savior would come.


    Sometimes the prophets speak as though he has not yet been born. At other times, it is as though the Savior speaks through them, saying that he will come and show favor to those who did not know him. So the prophets did not all speak in the same way. Each was given power to speak about him and about the place he had seen. Each therefore thought that the Savior would be born in that place and come from there. Yet none of them knew where he would come from or who would beget him. They were considered worthy to say only that he would be born and would suffer. His existence before birth—his eternal existence without being begotten and without being able to suffer—never entered their thoughts.[a]


    This is the inspired message they delivered about the flesh in which he would appear. His birth was said to be like their births, yet above all it came from the spiritual Word, the cause of everything that has come into being. The one from whom the Savior received his flesh truly fathered him in the form of a seed. This happened when the light was revealed, in keeping with the promised word of his revelation. He was indeed in the state of “a seed of what was,” though he was begotten last.[b]


    But the one whom the Father appointed to reveal salvation through him, who is the fulfillment of the promise, was given everything necessary when he descended into life. His Father is one—the only one who is truly a father to him. This one is unseen and unknowable and cannot be grasped by nature. He alone is God, and by his will and gift he has granted that he could be seen, known, and grasped.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The manuscript is damaged after “without being able to suffer.” It preserves the fragment “<…> not from the Word, who came into being in flesh, […]”, but its connection to the sentence is uncertain.
