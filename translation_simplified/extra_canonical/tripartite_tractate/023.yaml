  english_witness: 'The prophets, though, spoke nothing of their own will, but each of them (spoke) of the things he saw and heard concerning the proclamation of the Savior. What he proclaimed, and the central theme of their proclamation, was what each said concerning the coming of the Savior, which is that it would arrive. At times, the prophets speak about it as if he is yet to be born, whereas at other times it is as if the Savior speaks in their mouths, saying that the Savior will arrive and bestow favor on those who did not know him. Accordingly, not all of them said everything in the same way, but by the power given to speak about him and about the place he saw, each one thought that it is from that place that the Savior would be born, and that he would come from that place. Not one of them, accordingly, knew from where he would come, or who would beget him. This alone is what they were worthy to speak, that he would be born and would suffer. With regard to his pre-existence and his
    eternal existence as unbegotten, impassible <…> not from the Word, who came into being in flesh, [] it never dawned on their thought.


    And this is the message they were inspired to deliver concerning his flesh which would appear. It is said that it was a birth like all of theirs, but that above all else it was from the spiritual Word, the cause of the things that have come into being. He from whom the Savior received his flesh did indeed beget him in the form of a seed, at the revelation of the light, agreeing with the promised word of his revelation, <being> indeed the state of <a> seed of <what was>, although begotten last. However, the one whom the Father ordained to manifest salvation through him, who is the fulfillment of the promise, when he descended into life, he was given every means necessary for his descent. His Father is one, the only one who is truly a father to him, the unseen, unknowable, in nature ungraspable, who alone is God, who by his will and his gift has granted that he could be seen, known, and grasped.'
