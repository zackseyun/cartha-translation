  previous_text: 'The prophets did not speak on their own initiative. Each spoke about what he had seen and heard concerning the message about the Savior. What the Savior proclaimed—and the main subject of the prophets’ message—was his coming and the certainty that it would happen.


    Sometimes the prophets speak as though he has yet to be born. At other times, it is as though the Savior is speaking through them, saying that he will come and show favor to those who did not know him. Therefore, the prophets did not all speak in the same way. Each was given power to speak about him and about the place he had seen. So each thought the Savior would be born in that place and come from there. Yet none of them knew where he would come from or who would father him. They were permitted to say only that he would be born and would suffer. His existence before birth—his eternal existence, without being begotten and without being able to suffer—never entered their thoughts. Here the damaged text also contains the fragment, “<…> not from the Word, who came into being in flesh, […].”[a]


    This, then, is the inspired message they delivered about the flesh in which he would appear. His birth was said to be like their births, yet above all it came from the spiritual Word, the cause of everything that has come into being. The one from whom the Savior received his flesh truly fathered him in the form of a seed. This happened when the light was revealed, in keeping with the promised word of his revelation. He was indeed in the state of “a seed of what was,” though he was begotten last.[b]


    The Father appointed him to reveal salvation, and he is the fulfillment of the promise. When he descended into life, he was given everything necessary for his descent. He has one Father, the only one who is truly his Father. This Father is unseen and unknowable, and by nature cannot be grasped. He alone is God. Yet by his own will and gift, he has made it possible for himself to be seen, known, and grasped.'
