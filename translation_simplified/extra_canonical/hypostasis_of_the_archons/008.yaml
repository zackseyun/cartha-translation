translation:
  language: en
  text: 'The archons went out to meet Norea, planning to trick her. Their leader said, “Your mother Eve came to us.” But Norea faced them and said, “You are the rulers of darkness. You are cursed! You did not know my mother. The woman you knew was your own female counterpart. I am not your child; I come from the world above.”


    The arrogant ruler turned in his might, and his face became like a blazing [inferno]. He acted arrogantly toward her and [said], “You must serve us sexually, as your mother Eve did, because [. . .] has been placed under my authority.”


    But Norea, by the power of [God], turned and cried out loudly to the Holy One, the God of All: “Rescue me from these unjust rulers! Save me from their hands right now!”


    An angel came down from heaven and said to her, “Why are you calling on God? Why are you acting so boldly toward the holy Spirit?”


    Norea asked, “Who are you?”


    Meanwhile, the unjust rulers had withdrawn from her.'
