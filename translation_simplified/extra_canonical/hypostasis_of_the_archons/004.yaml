translation:
  language: en
  text: 'The archons took Adam and put him in the garden to cultivate and protect it. They commanded him, “You may eat from [all] the trees in the garden. But you must not eat from the tree of the knowledge of good and evil. Do not [touch] it, for on the day you eat from it, you will certainly die.”


    They [said this to him], but they did not understand [what they were saying]. Yet they spoke this way according to the Father’s will, so that Adam would indeed eat and would <not> view them as a thoroughly material person would.


    The archons plotted together. “Come,” they said, “let us put Adam into a deep sleep.” So Adam fell asleep. This deep sleep was ignorance. They opened his side like a living woman. Then they closed his side with flesh, and Adam became merely soulish.¹


    The spiritual woman came to him and said, “Rise, Adam.”


    When he saw her, he said, “You have given me life. You will be called the Mother of the Living, because she is my mother. She is the healer, the woman, the one who gave birth.”


    The authorities approached Adam. When they saw his female counterpart speaking with him, they became sexually aroused and desired her. They said to one another, “Come, let us sow our semen in her,” and they pursued her. But she laughed at them because they were foolish and blind. As they seized her, she became a tree and placed a shadowy image of herself before them. They defiled that image in a vile way, profaning the seal of her voice. In this way, they brought judgment on themselves through the form they had fashioned in their own image.[¹]'
