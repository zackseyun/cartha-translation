translation:
  language: en
  text: 'The archons made a plan. They said, “Come, let us make a human from the soil of the earth.”


    They formed their creature as a completely earthly being.


    The archons have bodies that are both female [and male][a], and their faces are like the faces of animals. They took [soil] from the earth and shaped [their human] to resemble their own bodies and [the image] of God that had appeared [to them] on the water.


    They said, “[Come], let us seize the image by means of the form we have shaped. [Then] the image may look at its male counterpart [and fall in love with it], and we may grasp it in the form we have shaped.” But the archons were powerless and did not understand God’s power.


    He blew into the man’s face. The man received a soul, but he lay on the ground for several days. The archons were powerless and could not make him stand up. They kept blowing like storm winds, trying to seize the image that had appeared to them on the waters. But they did not understand its power.


    All these things happened by the will of the Father of the All.


    Afterward, the Spirit looked at the man who had a soul but still lay on the ground. The Spirit came from the Adamic Land, descended, and made its home within him. Then the man became a living soul. The Spirit named him Adam because he was found moving on the ground.


    A voice came from what cannot be destroyed to help Adam. The archons gathered every land animal and every bird of the sky. They brought them to Adam to see what he would call them, so that he could name every bird and every animal.'
