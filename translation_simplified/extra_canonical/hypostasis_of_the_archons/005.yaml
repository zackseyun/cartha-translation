translation:
  language: en
  text: 'Then the female spiritual nature came in the form of the serpent, the teacher. Through the serpent she taught Adam and Eve, saying, “What did Samael [say to] you? Did he say, ‘You may eat from every tree in the garden, but you must not eat from [the tree] of the knowledge of good and evil’?”


    [] The fleshly woman answered, “He did not merely say, ‘Do not eat from it.’ He also said, ‘Do not even touch it, because on the day you eat from it, you will certainly die.’”


    The serpent, the teacher, said, “You certainly will not die. He told you this because he was jealous. Instead, your eyes will be opened, and you will become like gods, knowing good and evil.” Then the female nature that had been teaching through the serpent left it behind as something earthly.


    The fleshly woman took fruit from the tree and ate it. She also gave some to her husband, and he ate. In this way, they both ate, though they had only souls and lacked the spiritual nature. Their lack of knowledge exposed their defect. They realized that they had been stripped of what was spiritual, so they joined fig leaves together and fastened them around their naked loins.


    The ruler of the archons came, unaware of what had happened, and said, “Adam, where are you?”


    Adam answered, “I heard your voice and was afraid because I was naked, so I hid.”


    The archon said, “You hid because you ate from the one tree I forbade you to eat from. You ate from it!”


    Adam answered, “The woman you gave me [handed] me the fruit, and I ate it.”


    Then the proud [archon] cursed the woman.


    The woman said, “The serpent deceived me, so I ate.”


    [The archons turned] toward the serpent and cursed its shadow, [causing it] to grow weak.


    They did not know that it had the same form they themselves had fashioned. From that time, the serpent remained under the authorities’ curse [] until the Perfect Man came.


    Then they turned to their Adam and drove him and his wife out of the garden. They had no blessing, because they too were under the curse.


    They forced humanity into deep confusion and a life of hard work. They did this so that the people they had made would be occupied with worldly concerns and have no time to be concerned with the holy Spirit.'
