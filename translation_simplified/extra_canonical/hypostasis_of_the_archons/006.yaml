translation:
  language: en
  text: 'Next, Eve gave birth to their son Cain, who farmed the land. Then Adam had sexual relations with his wife. She became pregnant again and gave birth to Abel, who became a shepherd. Cain brought crops from his field, while Abel brought an offering from among his lambs. God looked favorably on Abel’s offering, but he did not accept Cain’s offerings.


    Cain, who was characterized by the flesh, pursued his brother Abel.


    God asked Cain, “Where is your brother Abel?”


    Cain answered, “Am I responsible for watching over my brother?”


    God said, “Listen! Your brother’s blood is crying out to me. You have sinned with your mouth. Your sin will come back upon you. Whoever kills Cain will unleash seven acts of revenge, and you will live moaning and trembling on the earth.”


    Adam again had sexual relations with Eve, his female counterpart. She became pregnant and bore [Seth] to Adam. She said, “Through God, I have given birth to [another] man to take [Abel’s] place.”


    Eve became pregnant again and gave birth to [Norea]. Eve said, “He has begotten a virgin for me to help many generations of humanity.” She is the virgin whom the ruling forces did not defile.


    Humanity then began to increase in number and advance.'
