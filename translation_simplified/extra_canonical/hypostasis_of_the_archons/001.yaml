translation:
  language: en
  text: 'About the Authorities and What They Were Made From


    Through the spirit of the Father of truth, the great apostle spoke about the authorities of darkness. He told us, “Our battle is not against flesh and blood,[a] but against the authorities that rule the world[b] and the spirits of evil.” I have sent you this writing because you asked what the authorities were made from.'
  philosophy: optimal-equivalence
  footnotes:
