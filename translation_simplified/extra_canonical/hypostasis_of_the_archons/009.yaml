  preserved_meaning: Eleleth will deliver the hearer from the lawless powers’ control.
  reasoning_layer_used: POB translation and English witness
  rationale: The rewrite removes an opaque control idiom while retaining the threat and rescue.
- pob_phrase: My mouth is truly unable to describe
  simplified_phrase: I truly cannot put into words
  preserved_meaning: The speaker declares that the angel’s power and face exceed verbal description.
  reasoning_layer_used: POB translation
  rationale: A common English idiom conveys the same inability without the awkward reference to the mouth.
- pob_phrase: your dwelling is in indestructibility
  simplified_phrase: your home is in what cannot be destroyed
  preserved_meaning: The hearer belongs in an imperishable sphere beyond the chaotic authorities.
  reasoning_layer_used: POB translation and English witness
  rationale: The abstract phrase becomes understandable while preserving its contrast with destruction.
