translation:
  language: en
  text: 'The angel said, “I am Eleleth, the great angel Wisdom, who stands before the holy Spirit. I was sent to speak with you and rescue you from the lawless ones. I will also teach you about your root.”


    I cannot describe that angel’s power. He looked like fine gold, and his clothing was as white as snow. I truly cannot put into words his power or the appearance of his face.


    The great angel Eleleth said to me, “I am Wisdom, one of the Four Lights who stand before the great unseen Spirit. Do you really think these archons have any power over you? Not one of them will be able to overcome the root of truth. For he has appeared in the last days because of the root of truth, and these ruling powers will be confined. They will not be able to defile you or that generation, because your home is in what cannot be destroyed. There the virgin Spirit lives, superior to the powers of chaos and their world.”'
  philosophy: optimal-equivalence
