translation:
  language: en
  text: 'The rulers made plans together. They said, “Come, let us bring a flood with our own hands and destroy all people and animals.”


    When the ruler of the forces learned of their plan, he said to Noah, “Build an ark for yourself from wood that will not rot. Hide inside it with your children, the animals, and the birds of the sky, both small and large. Set the ark on Mount Sir.”


    Then Orea came to Noah and wanted to enter the ark. When he would not let her in, she blew on the ark, and fire consumed it. So Noah built another ark.'
