translation:
  language: en
  text: 'I asked, “My Lord, was I also made from the same matter as the authorities?”


    He answered, “You and your descendants come from the Father, who has existed from the beginning.


    “The souls come from above, from light that cannot be destroyed. The authorities cannot come near them, because the spirit of truth lives within them. Everyone who knows this path of truth will be immortal among mortal people.


    “But that seed is not yet known. It will become known after three ages. Then it will free them from slavery to the authorities’ error.”


    I asked, “My Lord, how much longer will it be before this happens?”


    He answered, “It will happen when the True Man, in a substance that can be shaped, reveals the truth[a] that the Father has sent.


    “Then he will teach them about everything and anoint them with the oil of eternal life. This oil was given to him by the generation that has no king.


    “Then they will be freed from their blind way of thinking. They will trample death underfoot—the death that comes from the authorities—and rise to the infinite light where this seed lives.


    “Then the authorities will give up their times. Their angels will weep over their destruction, and their demons will mourn their death.


    “Then all the sons of light will truly know the truth. They will know their own root, the Father of the All, and the holy Spirit. Together they will proclaim, ‘The Father’s truth is just. The Son reigns over the All.’ And everyone will proclaim, ‘Forever and ever: holy, holy, holy! Amen.’”


    The Substance of the Archons'
