  reasoning_layer_used: POB base text
  rationale: “Rulers” and “captivated” communicate the roles and attraction more directly.
- pob_phrase: what is merely soulish is unable to hold onto what is spiritual
  simplified_phrase: What belongs only to the soul cannot take hold of what is spiritual
  preserved_meaning: A lower, soul-level reality cannot grasp a higher spiritual reality.
  reasoning_layer_used: POB contrast between below and above
  rationale: The clause explains the technical adjective without erasing the soul-spirit distinction.
