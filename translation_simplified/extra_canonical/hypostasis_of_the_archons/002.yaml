translation:
  language: en
  text: 'Their leader is blind. Because of his power, ignorance, and pride, he declared with authority, “I am God; there is no other except me.”


    By saying this, he sinned against the All. His boast rose to Indestructibility,[a] and a voice answered from there: “You are mistaken, Samael.” The name Samael means “blind god,” for his thoughts were blind. He poured out his power—the blasphemy he had spoken—and followed it down into Chaos and to his mother, the Abyss, at the prompting of Pistis Sophia. She established each of his offspring according to its power and in the likeness of the exalted, eternal aeons.[b] For the things that can be seen came from what cannot be seen.


    Indestructibility looked down into the region of the waters. Her likeness appeared there as a reflection, and the rulers of darkness became captivated by her. But they were too weak to take hold of the image they saw on the waters. What belongs only to the soul cannot take hold of what is spiritual. The rulers came from below, but the likeness of Indestructibility came from above.


    Therefore, Indestructibility looked down into that region so that, by the Father’s will, she could unite them all with the light.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The English witness indicates an unresolved gap in the source after this phrase.
    reason: source_note
  - marker: b
    text: “Aeons” are eternal realities or beings in the spiritual realm described by this work.
    reason: cultural_note
