translation:
  language: en
  text: 'I said, “My Lord, teach me about [the power of] these rulers. How did they come to exist? What kind of substance and matter are they made from? Who created them and gave them their strength?”


    The great angel Eleleth, who is Wisdom, said to me:


    “Indestructibility lives within the limitless aeons.[a] Sophia, also called Pistis, wanted to create something on her own, apart from her companion. What she produced came from above.


    “A veil separates the upper world from the aeons below. A shadow appeared beneath the veil. The shadow became matter and fell into a separate place.


    “What Sophia had produced developed into a material being like an aborted fetus. It was formed from the shadow and became a proud beast resembling a lion. It was both male and female, as I said before, because it had come from matter.


    “He opened his eyes and saw a vast, limitless expanse of matter. He became proud and said, ‘I am God, and nothing exists apart from me.’


    “By saying this, he sinned against the All. A voice came from above the place of supreme rule and said, ‘You are mistaken, Samael’—a name meaning ‘blind god.’


    “He answered, ‘If anything else exists before me, show it to me.’


    “Sophia immediately reached out her finger and put light into matter. She followed the light down to the place of chaos. Then she returned above to her own light, and darkness once again [fell upon] matter.


    “This ruler,[b] who was both male and female, made a vast realm for himself—an endless expanse.


    “[Missing text.] He decided to create offspring for himself. He created seven, and they were both male and female like their parent.


    “He said to his offspring, ‘I am God of the All.’


    “Zoe, the daughter of Pistis Sophia, cried out to him, ‘You are mistaken, Sakla!’ His other name is Yaldabaoth. Zoe breathed into his face. Her breath became an angel of fire for her, and that angel bound Yaldabaoth and threw him down into Tartaros, beneath the abyss.”'
