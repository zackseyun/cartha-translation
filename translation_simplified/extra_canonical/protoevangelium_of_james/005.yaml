translation:
  language: en
  text: '(1) The next day, Joachim brought his offerings. He thought, “If the Lord God has accepted me again, the plate the priest wears will show me.” As the priest approached the Lord’s altar, Joachim carefully watched the plate. He saw no sign of sin on it. Then Joachim said, “Now I know that the Lord God has accepted me again and taken away all my sins.” He left the Lord’s Temple, now declared right with God, and returned home.


    (2) After about six months had passed, Anna gave birth in the seventh month. She asked her midwife, “What is the child?”


    The midwife answered, “A girl!”


    Anna said, “Today my soul is greatly honored!” Then she laid the child down.


    After the time following childbirth had passed, Anna cleansed herself from the bleeding. She nursed the child and named her Mary.'
