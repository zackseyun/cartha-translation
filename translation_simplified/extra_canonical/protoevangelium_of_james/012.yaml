translation:
  language: en
  text: '(1) Mary finished the purple and scarlet work and brought it to the priest. He received it, blessed her, and said, “Mary, the Lord God has made your name great. People throughout every generation on earth will call you blessed.”


    (2) Mary rejoiced and went to visit her cousin Elizabeth. She knocked at the door. When Elizabeth heard her, she dropped the scarlet work and hurried to the door. She opened it, blessed Mary, and said, “Why has the mother of my Lord come to me? Look! The child within me leaped and blessed you!”


    But Mary had forgotten the mysteries that the angel Gabriel had told her. She gazed toward heaven and said, “Lord, who am I, that all the women on earth will call me blessed?”


    (3) Mary stayed with Elizabeth for three months. Her womb grew larger day by day, and she became afraid. She returned home and kept herself hidden from the people of Israel. She was sixteen years old when these mysteries happened to her.'
