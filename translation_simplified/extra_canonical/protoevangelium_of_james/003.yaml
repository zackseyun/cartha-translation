translation:
  language: en
  text: '(1) Anna gazed up toward heaven and saw a nest of sparrows in the laurel tree. She mourned and said to herself:


    “How terrible this is for me! Who gave birth to me? What womb carried me? I was born as a curse before the people of Israel. They despised and mocked me, and they drove me away from the Temple of the Lord my God.


    (2) “How terrible this is for me! What can I compare myself to? I am not like the birds in the sky, for even they have offspring before you, Lord.


    “How terrible this is for me! What can I compare myself to? I am not like the animals, for even they have offspring before you, Lord.


    “How terrible this is for me! What can I compare myself to? I am not like the wild animals of the earth, for even they have offspring before you, Lord.


    (3) “How terrible this is for me! What can I compare myself to? I am not like these waters, for even these waters are calm and yet churn, and their fish bless you, Lord.


    “How terrible this is for me! What can I compare myself to? I am not like this earth, for the earth gives its fruit at the proper time and blesses you, Lord.”'
  philosophy: optimal-equivalence
