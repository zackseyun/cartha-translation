translation:
  language: en
  text: '(1) Annas the scribe came to Joseph and asked, “Why didn’t you join our traveling party?”


    Joseph answered, “I was tired from the journey, so I rested on the first day after I returned.”


    Then Annas turned and saw that Mary was pregnant.


    (2) He hurried to the priest and said, “Joseph, the man you approved, has committed a terrible wrong.”


    The priest asked, “What has he done?”


    Annas answered, “Joseph has defiled the virgin he took from the Lord’s Temple. He has secretly taken her in marriage without telling the people of Israel.”


    The priest asked, “Has Joseph really done this?”


    Annas the scribe replied, “Send officers, and you will find that the virgin is pregnant.”


    The officers went and found her just as he had said. Then they brought Mary and Joseph before the court.


    (3) The chief priest said to her, “Mary, why have you done this? Why have you brought shame on yourself and forgotten the Lord your God? You were raised in the Holy of Holies. An angel fed you. You heard the angel’s hymns and danced before the angel. Why have you done this?”


    Mary wept bitterly and said, “As surely as the Lord God lives, I am pure before God. I have never had sexual relations with a man!”


    (4) Then the priest asked Joseph, “What have you done?”


    Joseph answered, “As surely as the Lord my God lives, and by the witness of God’s truth, I am innocent concerning her.”


    The priest said, “Do not give false testimony. Tell the truth. You secretly took her in marriage without telling the people of Israel. You did not bow your head beneath the mighty hand that should bless your children.”


    Joseph remained silent.'
