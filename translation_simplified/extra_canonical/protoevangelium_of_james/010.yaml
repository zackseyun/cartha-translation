translation:
  language: en
  text: '(1) The priests met together and said, “Let us make a veil for the Temple of the Lord.”


    The priest said, “Bring me the pure young women who are virgins from the tribe of David.” The officers went out to search for them and found seven. Then the priest remembered that the young Mary also belonged to the tribe of David and was pure before God. So the officers brought her as well.


    (2) The officers brought all the young women into the Temple of the Lord. The priest said, “Draw lots to decide who will spin each of these materials: the gold, the white, the linen, the silk, the violet, the scarlet, and the true purple.”


    Mary was chosen by lot to spin the true purple and the scarlet, so she took those materials home. At that time Zechariah could no longer speak, and Samuel served in his place until Zechariah could speak again. Mary began spinning the scarlet material.'
