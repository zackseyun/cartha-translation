translation:
  language: en
  text: '(1) The child grew stronger each day. When she was six months old, her mother placed her on the ground to see whether she could stand. The child walked seven steps and came to her mother’s breast. Her mother picked her up and said, “As surely as the Lord my God lives, you will not walk on this ground again until I take you into the Lord’s Temple.”


    Her mother made a sacred place in her bedroom. She allowed nothing unholy or impure to enter it. She invited pure Hebrew girls to come and play with the child.


    (2) When the child was one year old, Joachim held a great feast. He invited the chief priests, the other priests, the scribes, the elders, and all the people of Israel. Joachim brought the child to the priests, and they blessed her: “God of our ancestors, bless this child. Give her a name that people will speak throughout every generation.”


    All the people answered, “May it be so. Amen!”


    Then they brought her to the chief priests, who blessed her: “Most High God, look with favor on this child. Give her the greatest blessing, one that no other blessing can surpass.”


    (3) Her mother carried her to the sacred place in her bedroom and nursed her. Then Anna sang this song to the Lord God:


    “I will sing a holy song to the Lord my God,

    for God has come to help me

    and has taken away my enemies’ scorn.


    “The Lord God has given me

    the fruit of God’s justice,

    one yet many before God.[a]


    “Who will tell Reubel’s people

    that Anna is nursing a child?

    Listen, listen, twelve tribes of Israel:

    Anna is nursing a child!”


    Anna rested in the sacred place in her bedroom. Then she went out and served the guests. When the meal was over, they left rejoicing and praising the God of Israel.'
