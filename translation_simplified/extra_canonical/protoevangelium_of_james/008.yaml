translation:
  language: en
  text: 'Her parents left, amazed that the child had not turned back. They praised and glorified the Lord God. Mary stayed in the Temple of the Lord, where she was cared for like a dove and received food from an angel''s hand.


    When Mary turned twelve, the priests met together. They said, “Mary has now been in the Temple of the Lord for twelve years. What should we do with her so that she does not make the sanctuary of the Lord our God unclean?”


    They told the chief priest, “You stand at the Lord''s altar. Go in and pray about her. If the Lord God reveals what to do, we will do it.”


    The chief priest took the robe with twelve bells into the Most Holy Place and prayed about Mary. And look! An angel of the Lord stood near him and said, “Zechariah, Zechariah, go out and gather the widowers from among the people. Each man must bring a staff. The man whom the Lord God identifies by a sign will become her husband.”


    Messengers went throughout the whole region of Judea and sounded the trumpet of the Lord. And look! All the men hurried in.'
