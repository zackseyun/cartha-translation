translation:
  language: en
  text: '(1) Look! Joseph was getting ready to leave for Judea when a great uproar began in Bethlehem of Judea. Magi[a] arrived and asked, “Where is the king of the Jews? We saw his star in the East, and we have come to worship him.”


    (2) When Herod heard this, he became deeply troubled. He sent officers to bring the Magi to him. He also called for the chief priests and questioned them in his palace: “What do the Scriptures say about the Christ? Where will he be born?”


    They answered, “In Bethlehem of Judea. That is what is written.” Then Herod let the chief priests go.


    He asked the Magi, “What sign did you see that showed you a king had been born?”


    They answered, “We saw a huge star shining among the other stars. Its light was so bright that the other stars could no longer be seen. Then we knew that a king had been born for Israel, so we came to worship him.”


    Herod told them, “Go and search for him. If you find him, come back and tell me, so that I too may go and worship him.”


    (3) The Magi left, and look! The star they had seen in the East guided them to the cave and stopped above its top. There they saw the child with his mother Mary. The Magi opened their bags and brought out gifts: gold, frankincense, and myrrh.[b]


    Then an angel warned them not to go into Judea, so they returned to their own country by a different road.'
