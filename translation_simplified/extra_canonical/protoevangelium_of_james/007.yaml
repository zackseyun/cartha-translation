translation:
  language: en
  text: '(1) Anna cared for her child as the months passed. When Mary was two years old, Joachim said, “Let us take her to the Temple of the Lord. Then we will fulfill our promise, and the Lord will not be angry with us or reject our gift.”


    But Anna said, “Let us wait until she is three years old. Otherwise, she may long for her father or mother.”


    Joachim agreed, “Let us wait.”


    (2) When the child turned three, Joachim said, “Call together the pure young women of the Hebrews. Have them carry lighted lamps so that the child will not turn back or lose her desire to go to the Temple of the Lord.” They did this until they went up to the Temple of the Lord.


    The priest welcomed Mary and kissed her. He said, “The Lord God has made your name great among all generations. Through you, the Lord will reveal how he will rescue the people of Israel in the last days.”


    (3) The priest seated her on the third step of the altar, and the Lord God poured out his grace on her. She danced, and all the people of Israel loved her.'
