translation:
  language: en
  text: '(1) Anna, his wife, was grieving deeply for two reasons. She said, “I grieve because I am a widow and have no child.”


    (2) As the great day of the Lord drew near, her servant Juthine said, “How long will you keep yourself in sorrow? Look, the great day of the Lord is near. It is not right for you to grieve. Take this headband that the supervisor at my workplace gave me. I should not wear it because I am your servant, and it bears a royal emblem.”


    (3) Anna said, “Go away! I will not wear it. The Lord God has brought me very low. Perhaps some deceiver gave it to you, and now you want me to share in your sin.”


    Juthine replied, “Why should I speak a curse against you, since you have not listened to me? The Lord God has made you unable to bear children, so that you will have no child among the people of Israel.”


    (4) Anna was deeply grieved. She took off her mourning clothes, washed her head, and put on her wedding clothes. At about three in the afternoon, she went down to her garden for a walk. She saw a laurel tree and sat beneath it. After resting, she prayed to the Lord: “God of my ancestors, bless me and hear my prayer. You blessed our mother Sarah and gave her a son, Isaac. Please bless me in the same way.”'
