- pob_phrase: just as you blessed our mother Sarah and gave her a son, Isaac
  rendering: You blessed our mother Sarah and gave her a son, Isaac. Please bless me in the same way.
  claim: Anna asks God to bless her with a child as he blessed Sarah.
