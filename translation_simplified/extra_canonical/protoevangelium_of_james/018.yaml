translation:
  language: en
  text: '(1) He found a cave there and took her inside. He left his sons with her, then went to find a Hebrew midwife in the area around Bethlehem.


    (2) I, Joseph, was walking, yet somehow not moving. I looked up at the heavens and saw that everything had stopped. Even the birds in the sky hung motionless, and I stared in amazement.


    I looked down and saw a bowl on the ground, with workers resting beside it. Their hands were in the bowl. They seemed to chew, but did not complete the motion. They seemed to pick up food and bring it to their mouths, but every movement had stopped. All their faces were turned upward.


    I saw sheep being driven along, but they stood still. A shepherd had raised his hand to strike them, but his hand remained suspended in the air. I looked at the rushing river and saw young goats with their mouths in the water, but they were not drinking.


    Then suddenly, everything began moving again.'
