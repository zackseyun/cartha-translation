translation:
  language: en
  text: '(1) Joseph was deeply afraid. He said nothing about Mary while he thought about what to do. He said to himself, “If I hide her sin, I will be opposing the law of the Lord. But if I expose her before the people of Israel, I am afraid that what is within her may be angelic. Then I would be handing innocent blood over to a death sentence. What should I do with her? I will send her away quietly.”


    Night came upon him. (2) Then an angel of the Lord appeared to him in a dream and said, “Do not be afraid of this child, for the one within her is from the Holy Spirit. She will give birth to a son, and you will name him Jesus, because he will save his people from their sins.”


    Joseph awoke and praised the God of Israel, who had been gracious to him. Then Joseph protected Mary.'
