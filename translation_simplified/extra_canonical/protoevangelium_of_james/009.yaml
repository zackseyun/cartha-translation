translation:
  language: en
  text: '(1) Joseph put down his axe and went to join the others. After everyone had gathered, they brought their staffs to the priest. The priest took the staffs into the Temple and prayed. When he finished, he came out and returned each staff. None of them showed any sign. Joseph received his staff last. Suddenly, a dove came out of it and flew onto his head. The priest told him, “You have been chosen to take the virgin of the Lord into your care.”


    (2) But Joseph objected. “I already have sons, and I am an old man, while she is young. I will not let the people of Israel make me a laughingstock.”


    The priest replied, “Joseph, fear the Lord your God. Remember what God did to Dathan, Abiron, and Kore. Because they rebelled, the earth opened and swallowed them all. Now fear God, Joseph, so that these things will not happen in your own household.”


    (3) Joseph was afraid, so he took Mary into his care. He said to her, “Mary, I have taken you from the Temple of the Lord and brought you to my home. I must go away to build houses, but I will return to you. The Lord will protect you.”'
