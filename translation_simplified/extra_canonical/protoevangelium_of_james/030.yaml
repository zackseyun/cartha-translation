translation:
  language: en
  text: '(1) Look! Joseph was getting ready to leave for Judea when a great uproar began in Bethlehem of Judea. Magi[1] arrived and asked, “Where is the king of the Jews? We saw his star in the East and have come to worship him.”


    (2) When Herod heard this, he was troubled. He sent officers and summoned the magi, and they told him about the star.


    (3) Look! They saw stars in the East. The stars guided the magi until they came to the cave, and the star stood over the child’s head. When the magi saw the child with his mother Mary, they brought out gifts from their bags: gold, frankincense, and myrrh.


    After the angel warned them, they returned to their own country by a different route.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: “Magi” is a traditional term for these visitors from the East; this account does not specify their precise role.
    reason: cultural_note
