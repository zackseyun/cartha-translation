translation:
  language: en
  text: '(1) The midwife went in and helped the woman into position. Then Salome examined her condition. Salome cried out, “I have put the living God to the test—and look! My hand is burning and falling away from me!”


    (2) She prayed to the Lord, and the midwife was healed that same hour.


    (3) Then an angel of the Lord appeared before Salome and said, “The Lord God has heard your prayer. Go and touch the child, and you will receive salvation.”


    (4) Salome touched the child and was healed. She worshiped and left the cave. Then she heard the voice of an angel of the Lord say, “Salome, Salome, tell people about the wonderful things you have seen until the child comes into Jerusalem.”'
