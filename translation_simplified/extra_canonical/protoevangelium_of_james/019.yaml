translation:
  language: en
  text: '(1) Look! A woman was coming down the mountain. She asked me, “Where are you going, sir?”


    I answered, “I am looking for a Hebrew midwife.”


    She asked, “Are you an Israelite?”


    “Yes,” I said.


    Then she asked, “Who is giving birth in the cave?”


    “My betrothed,” I answered.


    “She is not your wife?” she asked.


    I said, “Mary was raised in the Lord’s Temple. She was chosen by lot to become my wife. Yet she is not my wife, but she has conceived by the Holy Spirit.”


    The midwife asked, “Is that really true?”


    Joseph replied, “Come and see.” So the midwife went with him.


    (2) They stood before the cave, and a shining cloud covered it. The midwife said, “Today my heart is lifted up, because my own eyes have seen something wonderful. Salvation has been born to Israel!”


    At once the cloud moved away from the cave. A brilliant light filled the cave, and they could not bear to look at it. After a little while, the light faded, and an infant appeared. He went to his mother Mary and began nursing.


    The midwife cried out, “What a great day this is for me! I have seen this new miracle!”


    (3) The midwife left the cave and met Salome.


    She told her, “Salome, Salome, I must tell you about this new sight. A virgin has given birth—something against the natural order!”


    Salome replied, “As surely as the Lord my God lives, I will not believe that a virgin has given birth unless I examine her myself.”'
