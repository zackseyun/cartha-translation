translation:
  language: en
  text: '(1) Mary took the pitcher and went to fill it with water. Suddenly, a voice said to her, “Rejoice, blessed one! The Lord is with you. You are blessed among women.”


    Mary looked to the right and left, trying to find where the voice was coming from. Terrified, she went into her house. She set down the pitcher, picked up the purple material, sat on her throne, and spun the material.


    (2) Suddenly, an angel of the Lord stood before her and said, “Do not be afraid, Mary. You have found favor with the Lord of All. You will conceive from God’s word.”


    When Mary heard this, she wondered, “Will I conceive from the Lord, the living God, and give birth in the same way as other women?”


    (3) The angel of the Lord answered, “Not in that way, Mary. The power of God will overshadow you. Therefore, the holy one born from you will be called the Son of the Most High. You will name him Jesus, because he will save his people from their sins.”


    Mary said, “I am the Lord’s servant. May it happen to me just as you have said.”'
