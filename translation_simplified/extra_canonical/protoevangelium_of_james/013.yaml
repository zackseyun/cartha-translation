translation:
  language: en
  text: '(1) Mary was in the sixth month of her pregnancy. Then Joseph returned from his building work. When he entered the house and saw that she was pregnant, he struck his own face in grief. He threw himself to the ground in sackcloth and wept bitterly.


    He said, “How can I face the Lord God? What prayer can I offer for this young woman? I received her from the Temple of the Lord God as a virgin, but I failed to protect her. Who set this trap for me? Who did this evil thing in my house? Who defiled this virgin? Am I reliving the story of Adam? While Adam was praising God at the hour of prayer, the serpent came and found Eve alone. It deceived her, and now this has happened to me!”


    (2) Joseph rose from the sackcloth, called Mary, and said, “God cared for you. Why have you done this? You have forgotten the Lord your God. Why have you brought shame on yourself? You were fed in the Temple’s Most Holy Place and received food from an angel’s hand!”


    (3) Mary wept bitterly and said, “I am pure. I have never had sexual relations with a man!”


    Joseph asked her, “Then where did what is in your womb come from?”


    She answered, “As surely as the Lord my God lives, I do not know where it came from!”'
