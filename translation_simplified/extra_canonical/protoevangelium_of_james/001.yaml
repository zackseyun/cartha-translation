translation:
  language: en
  text: '(1) The records of the twelve tribes of Israel tell that Joachim was a very rich man. He doubled the offerings he gave to the Lord. He said to himself, “One offering comes from my surplus and is for all the people. The other is for the Lord God, for my forgiveness and atonement.”


    (2) The great day of the Lord was drawing near, and the people of Israel were bringing their offerings. But Reubel came forward and said to Joachim, “You should not be the first to present your offerings, because you have had no child in Israel.”


    (3) Joachim was deeply grieved. He searched the records of the twelve tribes[a] to find out whether he was the only man in Israel who had no child. He found that all the righteous people of Israel had raised children. Then he remembered that the Lord God had given the patriarch Abraham a son, Isaac, late in Abraham’s life.


    (4) Joachim was deeply grieved. He did not go to his wife, but went into the wilderness and pitched his tent there. He fasted for forty days and forty nights, saying to himself, “I will not go back for food or drink until the Lord my God takes notice of me. Prayer will be my food and drink.”'
