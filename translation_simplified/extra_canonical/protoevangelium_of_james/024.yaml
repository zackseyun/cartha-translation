translation:
  language: en
  text: '(1) At the customary time for greeting, the priests came. But Zechariah did not come out to meet them and bless them as usual. They waited for him so that they could receive his blessing and praise the Most High God.


    (2) When he did not come, they all became afraid. One priest found the courage to enter the sanctuary. There he saw clotted blood beside the Lord’s altar. A voice was saying, “Zechariah has been murdered. His blood will not be wiped away until the one who avenges him comes!”


    The priest was terrified when he heard this. He went back and told the other priests what he had seen and heard.


    (3) Then they found the courage to enter and see what had happened. The Temple panels cried out, and the priests tore their clothes from top to bottom as a sign of grief. They did not find Zechariah’s body, but they found that his blood had turned to stone. Frightened, they went out and told all the people that Zechariah had been murdered. When all the tribes of the people heard the news, they mourned for him and wept for three days and three nights.


    (4) After three days, the priests met to decide who should take Zechariah’s place. They cast lots, and Simeon was chosen. The Holy Spirit had revealed to him that he would not die before he saw the Christ in human flesh.'
