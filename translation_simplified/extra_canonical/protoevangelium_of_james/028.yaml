translation:
  language: en
  text: '(1) Joseph found the midwife coming down from the mountain and brought her with him. He told her, “Mary is my betrothed. She conceived by the Holy Spirit and was raised in the Lord’s Temple.”


    The midwife went with Joseph. (2) When they stood in front of the cave, a dark cloud covered it. The midwife said, “Today my soul is lifted up, because my own eyes have seen a wonder. Salvation has been born to Israel!”


    At once the cloud drew away from the cave, and a brilliant light appeared inside it. The light was more than their eyes could bear. After a little while, it faded, and they could see an infant. He went to his mother Mary and began to nurse.


    The midwife cried out, “What a great day this is! I have seen a new miracle!”


    (3) The midwife left the cave and met Salome. She said, “Salome, Salome, I must tell you about a new sight. A virgin has given birth, contrary to the ordinary course of nature!”


    Salome replied, “As surely as the Lord my God lives, I will not believe that a virgin has given birth unless I insert my finger and examine her condition.”'
