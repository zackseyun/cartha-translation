translation:
  language: en
  text: '(1) An angel of the Lord stood near Anna and said, “Anna, Anna, the Lord has heard your prayer. You will become pregnant and give birth, and people throughout the world will speak about your child.”


    Anna said, “As surely as the Lord God lives, whether my child is a boy or a girl, I will give the child to the Lord my God. The child will serve him for as long as he or she lives.”


    (2) Then two angels came to Anna and said, “Your husband Joachim is coming with his flocks!” An angel of the Lord had gone to Joachim and said, “Joachim, Joachim, the Lord God has heard your prayer. Go down from here. Your wife Anna has become pregnant.”


    (3) Joachim immediately went down and called his shepherds. He told them, “Bring me ten lambs that have no defect; the ten lambs will be for the Lord God. Also bring twelve young calves for the priests and elders, and one hundred male goats for all the people.”


    (4) Joachim arrived with his flocks while Anna was standing at the gate. When she saw him coming, she ran to him at once and threw her arms around his neck. She said, “Now I know that the Lord God has greatly blessed me! The widow is no longer a widow, and the woman who had no child has become pregnant.”


    Joachim spent that first day resting at home.'
