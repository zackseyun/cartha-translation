translation:
  language: en
  text: '(1) Then King Augustus issued an order to count and register the people in Bethlehem of Judea.


    Joseph said, “I will register my sons. But what should I do about this child? How should I register her? As my wife? I am ashamed to do that. As my daughter? The people of Israel know she is not my daughter. This is the Lord’s day, so I will do whatever the Lord wants.”


    (2) Joseph saddled the donkey and helped Mary sit on it. His son led the donkey, and Samuel followed.


    As they approached the third mile of their journey, Joseph turned and saw that Mary was sad. He thought, “Probably the child inside her is troubling her.”


    When Joseph looked back again, he saw her laughing. He asked her, “Mary, what is happening? At one moment I see you laughing, and at another you look sad.”


    She answered, “It is because I see two groups of people before my eyes. One is weeping and mourning, while the other is rejoicing and celebrating.”


    (3) When they reached the middle of their journey, Mary said, “Joseph, help me down from the donkey. The child inside me is pressing to be born.”


    Joseph helped her down and said, “Where can I take you so you can give birth in shelter? This place is a wilderness.”'
