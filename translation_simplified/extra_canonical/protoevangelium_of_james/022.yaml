translation:
  language: en
  text: '(1) When Herod realized that the magi had deceived him, he became furious. He sent out his killers with orders to kill every infant two years old or younger.


    (2) When Mary heard that infants were being killed, she was afraid. She took her child, wrapped him in cloths, and laid him in a feeding trough for cows.


    (3) When Elizabeth heard that people were searching for John, she took him into the hills and looked for somewhere to hide. But she found no hiding place. Unable to climb any higher, Elizabeth groaned and cried out, “Mountain of God, shelter a mother and her child!” At once, the mountain split open and took her inside. A light shone through the mountain for her. An angel of the Lord was with them, guarding them.'
