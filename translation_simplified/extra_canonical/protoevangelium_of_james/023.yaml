translation:
  language: en
  text: '(1) Herod searched for John. He sent officers to Zechariah to ask, “Where are you hiding your son?”


    Zechariah answered, “I serve God and remain in God’s Temple. How would I know where my son is?”


    (2) The officers returned and told Herod everything. Herod became angry and said, “His son is going to be king over Israel!”


    He sent the officers back to Zechariah with this message: “Tell me the truth. Where is your son? Remember, your life is in my hands.”


    The officers returned and reported Zechariah’s answer to Herod.


    (3) Zechariah said, “If you shed my blood, I will die as a witness for God. The Lord will receive my spirit, because you will be shedding innocent blood at the entrance to the Lord’s Temple.”


    Around daybreak, Zechariah was murdered. The people of Israel did not know that he had been murdered.'
