translation:
  language: en
  text: '(1) The midwife went in and said, “Mary, get ready, because you are about to face a serious examination.”


    Then Salome examined Mary. She cried out, “How terrible! This has happened because of my lawlessness and unbelief. I tested the living God—and look! My hand is burning and wasting away!”


    (2) She fell to her knees before the Lord and said, “God of my ancestors, remember me. I am descended from Abraham, Isaac, and Jacob. Do not make me an example before the people of Israel. Instead, let me return to helping the poor. You know, Lord, that I have healed people in your name and received my wages from you.”


    (3) Just then, an angel of the Lord appeared to her and said, “Salome, Salome, the Lord of All has heard your prayer. Reach out your hand to the child and pick him up. Then you will receive salvation and joy.”


    (4) Salome gladly went to the child and picked him up. She said, “I worship him, because a great king has been born to Israel.” Salome was healed at once, and she left the cave justified.[a]


    Then a voice said, “Salome, Salome, do not tell anyone about the wonderful things you have seen until the child comes into Jerusalem.”'
