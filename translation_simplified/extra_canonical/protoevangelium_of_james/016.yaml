translation:
  language: en
  text: '(1) The priest said, “Return the virgin you took from the Lord’s Temple.”


    Joseph wept.


    Then the chief priest said, “I will give you the water of the Lord’s rebuke to drink. It will reveal your sin to you.”


    (2) The priest gave the water to Joseph and sent him into the wilderness. Joseph returned unharmed.


    Then the priest gave the water to Mary and sent her into the wilderness. She also returned unharmed.


    All the people were amazed that their sin had not been revealed.


    (3) The priest said, “Since the Lord God has not revealed your sin, I will not condemn you either.” Then he released them.


    Joseph took Mary home, rejoicing and praising the God of Israel.'
