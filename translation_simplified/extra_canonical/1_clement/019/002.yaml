translation:
  language: en
  text: Since we have been considered worthy of many great and glorious things, let us press on toward the goal of peace that has been passed down to us from the beginning. Let us keep our eyes fixed on the Father and Creator of the whole world, and hold firmly to his magnificent, incomparable gifts and benefits of peace.
