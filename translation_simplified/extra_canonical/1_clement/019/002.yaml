simplification_decisions:
- pob_phrase: have been deemed worthy of
  simplified_phrase: have been considered worthy of
  preserved_meaning: They were judged worthy to receive these things, not credited with performing great deeds.
  reasoning_layer_used: applied revision
  rationale: “Considered worthy” is common English while preserving the revised passive sense.
- pob_phrase: the goal of peace that has been handed down to us
  simplified_phrase: the goal of peace that has been passed down to us
  preserved_meaning: The inherited item remains the goal of peace rather than peace by itself.
  reasoning_layer_used: POB base text and grounding review
  rationale: The relative clause preserves the grammatical referent while “passed down” sounds natural.
- pob_phrase: fix our gaze on ... and cling to
  simplified_phrase: keep our eyes fixed on ... and hold firmly to
  preserved_meaning: Both images retain sustained attention and steadfast attachment.
  reasoning_layer_used: POB base text
  rationale: Familiar phrases clarify both exhortations without merging them.
