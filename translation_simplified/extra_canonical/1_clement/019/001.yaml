  yaml_path: translation/extra_canonical/1_clement/019/001.yaml
  text: Therefore, the humility and submissiveness of so many and such great people, so well attested, through obedience has made not only us better, but also the generations before us—those who received his oracles in holiness and truth.
translation:
  language: en
  text: Therefore, the well-attested humility and willingness to submit shown by so many great people—clearly demonstrated by their obedience—has made both us and earlier generations better. Those earlier generations received his revealed words in holiness and truth.
  philosophy: optimal-equivalence
