translation:
  language: en
  text: So, after receiving their instructions, they became fully assured through the resurrection of our Lord Jesus Messiah and were strengthened in their trust in God’s word. With full assurance from the Holy Spirit, they went out and announced the good news that God’s kingdom was about to come.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Their announcement can also be stated directly: “God’s kingdom is about to come.”'
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Therefore, after receiving instructions and being fully assured through the resurrection of our Lord Jesus Messiah, and being confirmed in the word of God
  simplified_phrase: So, after receiving their instructions, they became fully assured through the resurrection of our Lord Jesus Messiah and were strengthened in their trust in God’s word.
  preserved_meaning: Their instructions, assurance through Jesus’ resurrection, and confirmation in God’s word remain distinct.
  reasoning_layer_used: POB translation, Greek source, and applied revisions
  rationale: The dense opening is recast in ordinary clause order without making God’s word a direct agent.
- pob_phrase: they went out with the full assurance of the Holy Spirit
  simplified_phrase: With full assurance from the Holy Spirit, they went out
  preserved_meaning: Their mission is accompanied by full assurance associated with the Holy Spirit.
  reasoning_layer_used: POB translation and independent grounding review
  rationale: The wording stays clear without specifying that the Spirit directly gave the assurance.
- pob_phrase: proclaiming the good news that the kingdom of God was about to come
  simplified_phrase: announced the good news that God’s kingdom was about to come
  preserved_meaning: Their proclamation concerns the approaching kingdom of God.
  reasoning_layer_used: POB translation and grammar revision
  rationale: Plain wording retains the audited past-tense backshift.
