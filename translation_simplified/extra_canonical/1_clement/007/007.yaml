translation:
  language: en
  text: Jonah announced to the people of Nineveh that destruction was coming. But they repented of their sins and pleaded with God. In this way they made atonement to him and were saved, even though they were strangers to God.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Jonah proclaimed destruction to the Ninevites
  simplified_phrase: Jonah announced to the people of Nineveh that destruction was coming
  preserved_meaning: Jonah publicly warned Nineveh of impending destruction.
  reasoning_layer_used: source syntax and POB translation
  rationale: The recast sentence makes the warning natural in modern English without specifying details the source leaves unstated.
- pob_phrase: having repented of their sins, made atonement to God by their supplication
  simplified_phrase: they repented of their sins and pleaded with God. In this way they made atonement to him
  preserved_meaning: Their repentance and earnest appeal to God resulted in atonement directed toward God.
  reasoning_layer_used: POB revision history and Greek direct-object construction
  rationale: The wording explains “supplication” while retaining the audited choice “made atonement to God.”
- pob_phrase: received salvation
  simplified_phrase: were saved
  preserved_meaning: They were delivered from the announced destruction.
  reasoning_layer_used: immediate context and POB translation
  rationale: The active biblical expression is replaced with its common direct equivalent.
translation_notes:
  risk_flags:
