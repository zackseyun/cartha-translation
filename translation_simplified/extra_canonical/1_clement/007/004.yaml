simplification_decisions:
- pob_phrase: fix our gaze on
  simplified_phrase: look intently at
  preserved_meaning: The call to give focused attention remains strong and direct.
  reasoning_layer_used: source_payload
  rationale: This uses common English while preserving the force of the Greek image.
- pob_phrase: because, having been poured out for our salvation
  simplified_phrase: His blood was poured out to save us
  preserved_meaning: Messiah's poured-out blood is presented as being for human salvation.
  reasoning_layer_used: pob_translation
  rationale: A separate active sentence removes the difficult participial structure without changing the claim.
- pob_phrase: it brought the grace of repentance to the whole world
  simplified_phrase: bringing the whole world the grace to repent
  preserved_meaning: The benefit of Messiah's blood extends worldwide and makes repentance available by grace.
  reasoning_layer_used: pob_translation
  rationale: The abstract phrase is recast as a clear verbal expression while retaining grace, repentance, and worldwide scope.
interpretive_expansions:
- pob_phrase: the grace of repentance
  rendering: the grace to repent
  claim: Grace enables or grants the opportunity for repentance rather than merely describing repentance.
