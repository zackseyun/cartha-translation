translation:
  language: en
  text: Brothers, sacrifices—whether for the continual offering, for prayers, or for sin and transgression—are not offered just anywhere, but only in Jerusalem. Even there, they are offered only at the altar in front of the sanctuary. Beforehand, the high priest and the ministers mentioned earlier inspect the offering for any defect.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: are not offered everywhere, brothers, but only in Jerusalem
  simplified_phrase: Brothers, sacrifices ... are not offered just anywhere, but only in Jerusalem
  preserved_meaning: The sacrifices may be offered only in Jerusalem.
  reasoning_layer_used: POB translation
  rationale: The address is moved forward and the restriction is expressed in natural English.
- pob_phrase: even there they are not offered in every place, but before the sanctuary, at the altar
  simplified_phrase: Even there, they are offered only at the altar in front of the sanctuary
  preserved_meaning: Within Jerusalem, the authorized location is the altar before the sanctuary.
  reasoning_layer_used: POB translation
  rationale: The repeated negative wording becomes a direct location restriction.
- pob_phrase: after the offering has been inspected for blemishes by the high priest and the ministers already mentioned
  simplified_phrase: Beforehand, the high priest and the ministers mentioned earlier inspect the offering for any defect
  preserved_meaning: The designated leaders must examine the offering for disqualifying blemishes before it is offered.
  reasoning_layer_used: POB translation
  rationale: The passive clause is recast actively while keeping the inspectors and sequence.
