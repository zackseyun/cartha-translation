translation:
  language: en
  text: So let us draw near to him with inward holiness. Let us raise pure, unstained hands to him and love our gentle and compassionate Father, who has made us a chosen people belonging to himself.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “a chosen portion for himself,” picturing the community as the share God chose as his own.
    reason: source_note
simplification_decisions:
- pob_phrase: come near to him in holiness of soul
  simplified_phrase: draw near to him with inward holiness
  preserved_meaning: We are to approach God with holiness throughout our inner life.
  reasoning_layer_used: POB translation and Greek source payload
  rationale: “Inward holiness” avoids narrowing the soul to emotion while using clear English.
- pob_phrase: lifting pure and undefiled hands to him
  simplified_phrase: raise pure, unstained hands to him
  preserved_meaning: The bodily image of raising morally pure hands toward God remains intact.
  reasoning_layer_used: POB translation and applied revision
  rationale: The active wording and familiar adjective clarify the image without weakening it.
- pob_phrase: who has made us a chosen portion for himself
  simplified_phrase: who has made us a chosen people belonging to himself
  preserved_meaning: God chose the community to belong especially to him.
  reasoning_layer_used: POB translation, Greek source payload, and grounding review
  rationale: The main text clarifies the communal meaning, while the footnote preserves the portion image.
interpretive_expansions:
- pob_phrase: holiness of soul
  rendering: inward holiness
  claim: The holiness concerns the community’s inner moral and spiritual life.
  evidence:
  - The POB locates holiness in the soul rather than merely in outward actions.
  confidence: high
  alternatives_preserved:
  - holiness of soul
- pob_phrase: a chosen portion for himself
  rendering: a chosen people belonging to himself
  claim: The chosen portion is the community God selected to belong to him.
  evidence:
  - The pronoun “us” identifies the portion as a community.
  - “For himself” expresses belonging to God.
  confidence: high
  alternatives_preserved:
  - a chosen portion for himself
  - his own chosen share
translation_notes:
  risk_flags:
  - risk: “Chosen people” does not itself retain the source’s portion image.
    mitigation: The footnote explicitly preserves the image of the community as God’s chosen share.
  - risk: “Inward holiness” is less concrete than the source term “soul.”
    mitigation: It preserves the whole inner moral-spiritual scope without suggesting emotion alone.
