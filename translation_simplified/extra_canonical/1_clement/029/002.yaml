translation:
  language: en
  text: 'For Scripture says:


    “When the Most High divided up the nations,

    when he scattered Adam’s descendants,

    he set the boundaries of the nations

    according to the number of the angels of God.


    And Jacob, his people, became the Lord’s own portion;

    Israel was the measuring line of his inheritance.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: For thus it is written
  simplified_phrase: For Scripture says
  preserved_meaning: The following words are introduced as a written scriptural quotation.
  reasoning_layer_used: POB translation and quotation context
  rationale: This replaces a formal quotation formula with direct common English.
- pob_phrase: the sons of Adam
  simplified_phrase: Adam’s descendants
  preserved_meaning: The phrase refers collectively to the human family descended from Adam.
  reasoning_layer_used: POB source wording and immediate poetic context
  rationale: “Descendants” makes the ancient family idiom immediately clear.
- pob_phrase: his people Jacob became the Lord’s portion
  simplified_phrase: Jacob, his people, became the Lord’s own portion
  preserved_meaning: Jacob, identified as Israel and the Lord’s people, is the share belonging to the Lord.
  reasoning_layer_used: POB translation and latest revision
  rationale: The reordered phrase clarifies the identification while preserving the inheritance image and coordination.
translation_notes:
  risk_flags:
