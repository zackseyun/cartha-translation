simplification_decisions:
- pob_phrase: He who commanded not to lie
  simplified_phrase: The one who commanded, “Do not lie,”
  preserved_meaning: God issued a command against lying without specifying its recipients.
  reasoning_layer_used: source text and applied revision
  rationale: A direct command is clearer while avoiding the unsupported object “us.”
- pob_phrase: will much more not lie himself
  simplified_phrase: will surely not lie himself
  preserved_meaning: The emphatic argument is that God certainly will not do what he forbids.
  reasoning_layer_used: Greek source and POB wording
  rationale: “Surely” expresses the force of the awkward comparative phrase in natural English.
- pob_phrase: except to lie
  simplified_phrase: except lying
  preserved_meaning: Lying is the sole stated exception to what is possible for God.
  reasoning_layer_used: POB controlling translation
  rationale: The gerund completes the sentence more naturally without weakening its claim.
