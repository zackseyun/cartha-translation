translation:
  language: en
  text: For Scripture says, “Blessed are those whose lawless acts are forgiven and whose sins are covered. Blessed is the one whose sin the Lord will never count against them, and whose mouth speaks no deceit.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The first sentence may also be translated, “whose lawless acts were forgiven and whose sins were covered.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: For it is written
  simplified_phrase: For Scripture says
  preserved_meaning: The words that follow are introduced as an authoritative written quotation.
  reasoning_layer_used: POB translation and quotation context
  rationale: This makes the formula immediately clear without changing its force.
- pob_phrase: whose lawless deeds
  simplified_phrase: whose lawless acts
  preserved_meaning: The acts violate what is right and lawful before God.
  reasoning_layer_used: POB lexical wording
  rationale: “Acts” is more common than “deeds” while retaining the idea of lawlessness.
- pob_phrase: whose sin the Lord will certainly not reckon
  simplified_phrase: whose sin the Lord will never count against them
  preserved_meaning: The Lord decisively refuses to charge the person's sin to their account.
  reasoning_layer_used: POB translation and Greek emphatic negation
  rationale: The common idiom “count against” preserves both the accounting image and the certainty.
