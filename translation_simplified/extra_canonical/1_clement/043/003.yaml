  rationale: Common wording preserves the active factional force of the Greek participle.
- pob_phrase: staffs, each inscribed according to the name of its tribe
  simplified_phrase: staffs, each marked with the name of its tribe
  preserved_meaning: Every staff carried the name identifying its tribe.
  reasoning_layer_used: POB translation and Greek source
  rationale: “Marked” clearly conveys the identifying inscription.
- pob_phrase: sealed them with the rings of the tribal leaders
  simplified_phrase: sealed them with the tribal leaders’ signet rings
  preserved_meaning: The leaders’ rings were used to seal the bundled staffs.
  reasoning_layer_used: POB translation and immediate context
  rationale: “Signet rings” makes the sealing function clear.
