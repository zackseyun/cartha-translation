translation:
  language: en
  text: When jealousy arose over the priesthood, the tribes formed rival factions and fought over which tribe would be honored with the glorious name. So he told the leaders of the twelve tribes to bring him staffs, each marked with the name of its tribe. He took the staffs, tied them together, and sealed them with the tribal leaders’ signet rings. Then he placed them on God’s table in the Tent of Witness.
