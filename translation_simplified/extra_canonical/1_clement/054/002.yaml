translation:
  language: en
  text: Let him say, “If there is faction, conflict, and division because of me, I will step aside and go wherever you want me to go. I will do whatever the community directs me to do. Only let Messiah’s flock live in peace with the appointed elders.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: If because of me there is faction and strife and divisions
  simplified_phrase: If there is faction, conflict, and division because of me
  preserved_meaning: The speaker accepts responsibility if he is the cause of discord in the community.
  reasoning_layer_used: POB translation and Greek source payload
  rationale: The causal statement is reordered into natural English without making causation more certain.
- pob_phrase: I withdraw, I depart wherever you wish
  simplified_phrase: I will step aside and go wherever you want me to go
  preserved_meaning: The speaker is willing both to give up his place and to leave for a destination chosen by others.
  reasoning_layer_used: Greek source payload and POB clause structure
  rationale: The two distinct actions remain clear without stiff repetition.
- pob_phrase: what is commanded by the multitude
  simplified_phrase: whatever the community directs me to do
  preserved_meaning: The speaker agrees to follow the collective body’s direction without defining its exact scope.
  reasoning_layer_used: POB controlling meaning and grounding review
  rationale: “Community” is clearer than “multitude,” while omitting “whole” avoids implying every member.
translation_notes:
  risk_flags:
  - risk: “Community” clarifies “the multitude” as a collective body but does not identify its precise membership.
    mitigation: The wording avoids “whole” and leaves the body’s exact scope open.
