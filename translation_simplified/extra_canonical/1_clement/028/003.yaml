translation:
  language: en
  text: “Where could I go? Where could I hide from your face? If I go up to heaven, you are there. If I travel to the farthest reaches of the earth, your right hand is there. If I lie down in the depths, your Spirit is there.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Where shall I go, and where shall I hide from your face?
  simplified_phrase: Where could I go? Where could I hide from your face?
  preserved_meaning: The speaker cannot escape God's presence.
  reasoning_layer_used: POB translation and sentence-level context
  rationale: Two direct questions make the rhetorical force easier to follow.
- pob_phrase: if I depart to the farthest parts of the earth
  simplified_phrase: If I travel to the farthest reaches of the earth
  preserved_meaning: Even going to earth's remotest places cannot escape God.
  reasoning_layer_used: POB translation
  rationale: “Travel” and “farthest reaches” express the movement and distance in natural English.
- pob_phrase: there is your right hand; if I lie down in the depths, there is your Spirit
  simplified_phrase: your right hand is there. If I lie down in the depths, your Spirit is there.
  preserved_meaning: God's right hand and Spirit remain present even in the remotest depths.
  reasoning_layer_used: POB translation and applied revision
  rationale: Short sentences clarify the repeated pattern while retaining “lie down” and both source images.
translation_notes:
  risk_flags:
  - risk: “Your face” may sound literal to some readers.
    mitigation: The image is retained because it conveys God's personal presence and is clarified by the surrounding locations.
  - risk: “Your right hand” remains a figurative biblical image.
    mitigation: Its placement beside “you are there” and “your Spirit is there” makes its connection with God's presence clear.
