source:
  edition: Funk 1901 (normalized OCR)
  text: Πάντων οὖν βλεπομένων καὶ ἀκουομένων, φοβηθῶμεν αὐτὸν καὶ ἀπολίπωμεν φαύλων ἔργων μιαρὰς ἐπιθυμίας, ἵνα τῷ ἐλέει αὐτοῦ σκεπασθῶμεν ἀπὸ τῶν μελλόντων κριμάτων.
  language: Greek
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/1_clement/028/001.yaml
  text: Therefore, since all things are seen and heard, let us fear him and leave behind the foul desires for wicked deeds, so that by his mercy we may be sheltered from the judgments that are about to come.
  footnotes:
  - marker: a
    text: Or 'the foul desires that belong to wicked deeds'.
    reason: previous_rendering
translation:
  language: en
  text: Because everything is seen and heard, let us fear him and turn away from the corrupt desires connected with evil deeds, so that by his mercy we may be sheltered from the judgments that are coming.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Therefore, since all things are seen and heard
  simplified_phrase: Because everything is seen and heard
  preserved_meaning: The exhortation rests on the fact that nothing escapes observation.
  reasoning_layer_used: POB translation and Greek clause structure
  rationale: The causal link is stated directly while leaving the observer unstated as in POB.
- pob_phrase: leave behind the foul desires for wicked deeds
  simplified_phrase: turn away from the corrupt desires connected with evil deeds
  preserved_meaning: Believers must abandon morally defiling desires associated with evil actions without limiting the association to one grammatical reading.
  reasoning_layer_used: POB translation, retained footnote alternative, and grounding review
  rationale: “Connected with” preserves both the preferred objective sense and the documented broader association.
- pob_phrase: the judgments that are about to come
  simplified_phrase: the judgments that are coming
  preserved_meaning: Future judgments are approaching.
  reasoning_layer_used: POB translation
  rationale: The shorter wording expresses the same future sense in natural English.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “fear him” as terror alone.
    mitigation: The key biblical term is retained, and the reference to his mercy provides context.
  - risk: “Connected with evil deeds” is less specific than the preferred objective-genitive reading.
    mitigation: This wording preserves the live alternative documented in the POB footnote.
