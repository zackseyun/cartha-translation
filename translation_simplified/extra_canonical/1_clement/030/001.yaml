    mitigation: The wording remains broad because the record does not establish a more specific kind of corrupt involvement.
  - risk: “Violent disturbances” makes the disorderly force more explicit than POB’s “seditions.”
    mitigation: The review supports this neutral wording as tumultuous public disorder without implying a target of rebellion.
