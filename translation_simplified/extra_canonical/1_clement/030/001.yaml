translation:
  language: en
  text: Therefore, since we are part of a holy people, let us do everything that holiness requires. We must stay far away from acts of slander, foul and unclean entanglements, drunkenness and violent disturbances, detestable desires, loathsome adultery, and detestable pride.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: since we are a holy portion
  simplified_phrase: since we are part of a holy people
  preserved_meaning: Believers together form a distinct holy portion.
  reasoning_layer_used: POB base text and Greek image
  rationale: This preserves the part-whole image while making it immediately understandable.
- pob_phrase: let us do all the things that belong to sanctification
  simplified_phrase: let us do everything that holiness requires
  preserved_meaning: They are urged to practice conduct consistent with holiness.
  reasoning_layer_used: POB base text
  rationale: The abstract wording becomes a direct call to holy conduct.
- pob_phrase: fleeing slanders ... drunkenness and seditions
  simplified_phrase: stay far away from acts of slander ... drunkenness and violent disturbances
  preserved_meaning: They must actively avoid harmful speech, drunkenness, and disruptive public disorder.
  reasoning_layer_used: POB revision rationale and independent grounding review
  rationale: Common wording preserves active avoidance and avoids narrowing public disorder to revolt against authority.
translation_notes:
  risk_flags:
