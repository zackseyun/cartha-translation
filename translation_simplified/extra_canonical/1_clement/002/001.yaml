translation:
  language: en
  text: All of you were humble and never boasted. You chose to submit to others rather than demand that they submit to you, and you found more joy in giving than in receiving. You were content with what the Messiah provided. You listened closely to his words and took them deeply to heart, and you kept his sufferings before your eyes.
  philosophy: optimal-equivalence
