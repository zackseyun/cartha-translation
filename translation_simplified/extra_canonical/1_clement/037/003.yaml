  text: οὐ πάντες εἰσὶν ἔπαρχοι οὐδὲ χιλίαρχοι οὐδὲ ἑκατόνταρχοι οὐδὲ πεντηκόνταρχοι οὐδὲ τὸ καϑεξῆς, ἀλλ’ ἕκαστος ἐν τῷ ἰδίῳ τάγματι τὰ ἐπιτασσόμενα ὑπὸ τοῦ βασιλέως καὶ τῶν ἡγουμένων ἐπιτελεῖ.
  language: Greek
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/1_clement/037/003.yaml
  text: Not all are prefects[a], nor tribunes, nor centurions, nor commanders of fifty, nor so on in order; but each, in his own rank, carries out the orders given by the king and by the leaders.
  footnotes:
  - marker: a
    text: Or 'nor so on'.
    reason: previous_rendering
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T11:34:35Z'
    unchanged: false
    changes_summary: Revised the final term from 'commanders' to 'leaders' for ἡγουμένων, which is broader and avoids repeating military terminology not explicit in the Greek. Adjusted 'the rest in order' to 'so on in order' to more directly reflect τὸ καθεξῆς, though still idiomatic.
translation:
  language: en
  text: Not everyone is a high-ranking officer,[a] a commander of a thousand, a commander of a hundred, or a commander of fifty, and so on down the ranks. Instead, each person serves in his own rank and carries out the orders given by the king and the leaders.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The traditional titles are “prefect,” “tribune,” and “centurion.”
    reason: simplification_note
simplification_decisions:
- pob_phrase: prefects, nor tribunes, nor centurions
  simplified_phrase: a high-ranking officer, a commander of a thousand, a commander of a hundred
  preserved_meaning: The text lists successively lower levels of military authority.
  reasoning_layer_used: Greek source and POB rank titles
  rationale: Descriptive titles make the military hierarchy understandable without removing its distinct ranks.
- pob_phrase: nor so on in order
  simplified_phrase: and so on down the ranks
  preserved_meaning: The list continues through the ordered military hierarchy.
  reasoning_layer_used: applied revision rationale for τὸ καθεξῆς
  rationale: “Down the ranks” naturally expresses the sequence intended by the Greek phrase.
- pob_phrase: each, in his own rank, carries out the orders
  simplified_phrase: each person serves in his own rank and carries out the orders
  preserved_meaning: Every person fulfills the duties assigned at his particular level.
  reasoning_layer_used: POB controlling translation
  rationale: Adding “serves” clarifies the relationship between a person’s rank and assigned orders.
interpretive_expansions:
- pob_phrase: tribunes, nor centurions
  rendering: a commander of a thousand, a commander of a hundred
  claim: The conventional titles refer here to successive military command levels.
  evidence:
