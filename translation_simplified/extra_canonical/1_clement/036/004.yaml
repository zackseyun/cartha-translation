  preserved_meaning: The line keeps the direct image of a father giving birth to a son without defining what “today” refers to.
  reasoning_layer_used: Greek source, POB translation, and grounding review
  rationale: “Given you birth” explains “begotten” while preserving its birth image and avoiding an added status claim.
- pob_phrase: the ends of the earth as your possession
  simplified_phrase: the farthest parts of the earth as your possession
  preserved_meaning: The Son’s possession extends to the earth’s remotest reaches.
