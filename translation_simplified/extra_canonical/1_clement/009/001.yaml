base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/1_clement/009/001.yaml
  text: Therefore let us obey his majestic and glorious purpose, and, becoming suppliants for his mercy and kindness, let us fall before him and turn to his compassions, leaving behind fruitless toil, as well as strife and the jealousy that leads to death.
