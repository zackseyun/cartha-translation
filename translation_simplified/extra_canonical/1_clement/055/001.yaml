base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/1_clement/055/001.yaml
  text: 'And so, to bring forward examples even from the nations: many kings and rulers, when some pestilential crisis had arisen, being instructed by oracles, handed themselves over to death so that through their own blood they might rescue their citizens. Many departed from their own cities so that they might no longer be torn by faction.'
translation:
  language: en
  text: Let us also give examples from other nations. When a deadly plague struck, many kings and rulers were told by oracles to give themselves up to die. They did this so that, by shedding their own blood, they might save their citizens. Many people left their own cities so that civil conflict would not arise.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: to bring forward examples even from the nations
  simplified_phrase: Let us also give examples from other nations
  preserved_meaning: The writer introduces comparable examples from peoples outside his own community.
  reasoning_layer_used: POB translation and immediate context
  rationale: The direct wording keeps the transition and the reference to other nations.
- pob_phrase: when some pestilential crisis had arisen, being instructed by oracles, handed themselves over to death
  simplified_phrase: When a deadly plague struck, many kings and rulers were told by oracles to give themselves up to die
  preserved_meaning: During a plague, rulers followed oracular instructions by voluntarily facing death.
  reasoning_layer_used: POB translation and Greek source sequence
  rationale: Familiar words and ordinary clause order preserve their deliberate self-sacrifice.
- pob_phrase: so that through their own blood they might rescue their citizens
  simplified_phrase: so that, by shedding their own blood, they might save their citizens
  preserved_meaning: Their deaths were intended to deliver their citizens through the sacrifice of their own lives.
  reasoning_layer_used: POB translation and Greek blood image
  rationale: The wording clarifies the action while retaining the source's blood image.
