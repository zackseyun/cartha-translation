translation:
  language: en
  text: Esther too had complete faith. She put her life in danger to rescue the people of all twelve tribes of Israel, who were about to perish. By fasting and humbling herself, she pleaded with the all-seeing Master, the God of all ages. He saw the humility in her soul and rescued the people for whom she had faced danger.
