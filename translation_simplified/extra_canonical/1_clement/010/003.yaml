translation:
  language: en
  text: “Leave your land, your relatives, and your father’s household. Go to the land I will show you. I will make you a great nation. I will bless you, make your name great, and you will be blessed. I will bless those who bless you, and I will curse those who curse you. In you, all the tribes of the earth will be blessed.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Depart from your land and from your kindred and from your father’s house
  simplified_phrase: Leave your land, your relatives, and your father’s household
  preserved_meaning: Abraham must leave his homeland, extended family, and paternal household.
  reasoning_layer_used: source text and applied lexical revision
  rationale: “Leave” clearly expresses Clement’s command to depart without reverting to the LXX wording “go out.”
- pob_phrase: magnify your name
  simplified_phrase: make your name great
  preserved_meaning: God promises to give Abraham a great name and standing.
  reasoning_layer_used: POB translation and immediate context
  rationale: The promise of greatness is retained in familiar English.
- pob_phrase: long coordinated sentence
  simplified_phrase: six short sentences
  preserved_meaning: The command and divine promises remain distinct and in their original order.
  reasoning_layer_used: POB clause structure
  rationale: Shorter sentences make the sequence easier to follow without merging its ideas.
translation_notes:
  risk_flags:
  - risk: Modern readers may find “In you” less immediately explicit than “Through you.”
    mitigation: The wording preserves the POB’s documented ambiguity rather than selecting an uncertain instrumental sense.
