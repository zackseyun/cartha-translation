translation:
  language: en
  text: Again, after Abraham and Lot had parted ways, God said to Abraham, “Raise your eyes and look out from where you are—north, south, east, and toward the sea. I will give all the land you can see to you and your descendants forever.”
  philosophy: optimal-equivalence
