  reasoning_layer_used: source review and applied revisions
  rationale: “Parted ways” is natural English and avoids implying that an outside force separated them.
- pob_phrase: Lift up your eyes and look from the place where you now are
  simplified_phrase: Raise your eyes and look out from where you are
  preserved_meaning: God commands Abraham to look across the land from his present location.
  reasoning_layer_used: POB translation and source wording
  rationale: The wording keeps the visual command in natural modern English.
- pob_phrase: your seed
