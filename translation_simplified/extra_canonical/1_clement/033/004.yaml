translation:
  language: en
  text: Above all, with his holy and pure hands, he formed humankind—the finest and exceedingly great work, made according to his own mind—as the imprint of his own image.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the most excellent and truly great being in understanding.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: with his holy and undefiled hands
  simplified_phrase: with his holy and pure hands
  preserved_meaning: God’s hands are pictured as sacred and free from defilement.
  reasoning_layer_used: POB text and source image
  rationale: “Pure” makes “undefiled” easier to understand while retaining the hands image.
- pob_phrase: he formed man
  simplified_phrase: he formed humankind
  preserved_meaning: God formed the human race as his creation.
  reasoning_layer_used: POB text and Greek ἄνθρωπον
  rationale: “Humankind” clearly refers to humanity without changing the focus.
- pob_phrase: the most excellent and exceedingly great work according to his mind
  simplified_phrase: the finest and exceedingly great work, made according to his own mind
  preserved_meaning: Humankind is presented as God’s supreme work, formed in accordance with God’s mind.
  reasoning_layer_used: POB text, applied revisions, and latest revision pass
  rationale: The added verb makes the relation to God’s design clear without changing it to “of his mind.”
translation_notes:
  risk_flags:
  - risk: “According to his own mind” may still sound abstract to some readers.
    mitigation: “Made according to” clearly presents God’s mind as the pattern or design for the work.
  - risk: The Greek syntax may instead describe humankind as exceptionally great in understanding.
    mitigation: The alternative is retained in footnote [a] rather than resolved beyond the POB evidence.
