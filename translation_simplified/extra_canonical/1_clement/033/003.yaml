translation:
  language: en
  text: By his immeasurably great power, God established the heavens[a]. With understanding beyond our grasp, he set them in order. He separated the earth from the waters surrounding it and set it firmly on the secure foundation of his own purpose. By his command, he brought into being the living creatures that move across the earth. He prepared the sea and the creatures living in it, and by his own power he enclosed it.
