simplification_decisions:
- pob_phrase: For behold
  simplified_phrase: Indeed
  preserved_meaning: The opening emphasizes the statement that follows.
  reasoning_layer_used: POB base text and discourse context
  rationale: “Indeed” conveys the emphasis without the archaic “behold.”
- pob_phrase: in lawless deeds
  simplified_phrase: amid lawless acts
  preserved_meaning: His conception is described as occurring in circumstances marked by violations of God's law.
  reasoning_layer_used: POB base text
  rationale: “Amid lawless acts” expresses the same setting in natural English.
- pob_phrase: my mother bore me
  simplified_phrase: my mother carried me in her womb
  preserved_meaning: The second line refers to conception or pregnancy rather than specifically to childbirth.
  reasoning_layer_used: source-grounded revision and independent grounding review
  rationale: This wording preserves the pregnancy sense while avoiding the unwarranted claim that the verb means giving birth.
interpretive_expansions:
