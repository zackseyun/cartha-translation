translation:
  language: en
  text: 'What should we say about David? God gave him this testimony: “I found David son of Jesse, a man whose heart desires what my heart desires. In my everlasting mercy, I anointed him to be king.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: David, who has received testimony
  simplified_phrase: David? God gave him this testimony
  preserved_meaning: David received favorable testimony from God.
  reasoning_layer_used: applied revision
  rationale: The active wording removes an awkward passive while preserving the adjudicated sense of received testimony.
- pob_phrase: a man according to my heart
  simplified_phrase: a man whose heart desires what my heart desires
  preserved_meaning: David's inner desires accord with God's heart.
  reasoning_layer_used: source text and POB translation
  rationale: The wording explains the idiom while retaining its heart image.
- pob_phrase: I anointed him
  simplified_phrase: I anointed him to be king
  preserved_meaning: God anointed David for kingship.
  reasoning_layer_used: immediate Davidic context
  rationale: Naming the royal purpose makes the biblical action understandable without replacing the term “anointed.”
interpretive_expansions:
- pob_phrase: according to my heart
  rendering: whose heart desires what my heart desires
  claim: The phrase describes David's heart as aligned with God's desires.
  evidence:
  - The Greek phrase links David directly with God's heart.
  - The POB preserves this relationship as “according to my heart.”
  confidence: moderate
  alternatives_preserved:
  - after my own heart
  - according to my heart
- pob_phrase: I anointed him
  rendering: I anointed him to be king
  claim: David's anointing is his appointment to kingship.
  evidence:
  - The named person is David son of Jesse.
  - David's defining anointing in the biblical narrative is royal.
  confidence: high
  alternatives_preserved:
  - I anointed him
translation_notes:
  risk_flags:
  - risk: The heart idiom may include approval more broadly than shared desires.
    mitigation: The rendering keeps the mutual heart image rather than reducing it to moral perfection.
  - risk: “To be king” is implicit rather than stated in this sentence.
    mitigation: It is limited to the well-established purpose of David's anointing.
