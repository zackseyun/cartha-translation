  reasoning_layer_used: POB base text and Greek source
  rationale: The active recipient-first wording is easier to follow, while “every kind of” conveys the scope of “all.”
- pob_phrase: what is written was fulfilled
  simplified_phrase: what Scripture says came true
  preserved_meaning: The readers’ experience fulfilled the quoted scriptural words.
  reasoning_layer_used: POB base text and immediate quotation
  rationale: This replaces a formal biblical idiom with clear common English.
interpretive_expansions:
- pob_phrase: the beloved one kicked
  rendering: the beloved one kicked in rebellion
  claim: The kicking image describes stubborn rebellion rather than relaxation or an ordinary physical action.
  evidence:
