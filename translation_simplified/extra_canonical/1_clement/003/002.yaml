    changes_summary: Replaced the awkward phrase “dim-sighted” with the more natural “shortsighted” while preserving meaning and all other wording. No lexical or semantic changes beyond this refinement; maintained “Messiah” per policy.
translation:
  language: en
  text: This led to jealousy and envy, conflict and division, persecution and disorder, war and captivity. 3 So people without honor rose up against those held in honor, those without glory against the glorious, fools against the wise, and the young against their elders. 4 As a result, righteousness and peace have gone far away. Each person stopped fearing God and could no longer see clearly in their faith in him. They did not follow the ways required by his commandments or live in a way worthy of the Messiah. Instead, each followed the desires of their evil heart and embraced unjust and ungodly jealousy. Through this jealousy, death also entered the world.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: strife and faction
  simplified_phrase: conflict and division
  preserved_meaning: Hostility produced both open conflict and divided groups.
  reasoning_layer_used: POB controlling text and immediate context
  rationale: Common terms convey the same social breakdown more directly.
- pob_phrase: the dishonored rose up against the honored, the inglorious against the glorious
  simplified_phrase: people without honor rose up against those held in honor, those without glory against the glorious
  preserved_meaning: People lacking honor or glory opposed those who possessed them.
  reasoning_layer_used: POB antithetical structure
  rationale: Expanded the substantival adjectives while retaining both parallel contrasts.
- pob_phrase: became shortsighted in faith in him, neither walking in the lawful ways of his commandments
  simplified_phrase: could no longer see clearly in their faith in him. They did not follow the ways required by his commandments
  preserved_meaning: Their spiritual perception weakened, and they ceased obeying God's commands.
  reasoning_layer_used: POB revision rationale and clause-level meaning
  rationale: The visual image remains, while the dense participial construction becomes two clear sentences.
translation_notes:
  risk_flags:
  - risk: “Could no longer see clearly” may sound stronger than “became shortsighted.”
    mitigation: The wording preserves impaired spiritual sight without claiming total loss of faith.
  - risk: “Ways required” makes the legal force of “lawful ways” more direct.
    mitigation: It ties the requirement explicitly to God's commandments rather than to civil law.
