  rationale: The clearer wording preserves both the contrast and the force of rising against others.
- pob_phrase: the inglorious against the glorious
  simplified_phrase: those without a good reputation against those who were respected
  preserved_meaning: People lacking recognized esteem opposed people who possessed it.
  reasoning_layer_used: POB translation, Greek contrast, and grounding review
  rationale: Reputation and respect convey public esteem without narrowing the contrast to social rank.
- pob_phrase: the foolish against the prudent, the young against the elders
  simplified_phrase: fools against the wise, and younger people against older people
  preserved_meaning: The passage contrasts poor judgment with wisdom and youth with greater age.
  reasoning_layer_used: POB translation and grounding review
  rationale: Common wording makes both contrasts clear without implying an institutional role or personal relationship.
