source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁρᾶτε, ἀγαπητοί, μὴ αἱ εὐεργεσίαι αὐτοῦ αἱ πολλαὶ γένωνται εἰς κρίμα πᾶσιν ἡμῖν, ἐὰν μὴ ἀξίως αὐτοῦ πολιτευόμενοι τὰ καλὰ καὶ εὐάρεστα ἐνώπιον αὐτοῦ ποιῶμεν μεθ’ ὁμονοίας.
  language: Greek
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/1_clement/021/001.yaml
  text: See to it, beloved, that his many benefits do not become a judgment against us all, if we do not conduct ourselves worthily of him and do what is good and pleasing before him in concord.
  footnotes:
  - marker: a
    text: Or 'good gifts do not become a judgment against us all, if we do not live in a manner worthy of him, and with one accord do what is good and pleasing before him.'.
    reason: previous_rendering
translation:
  language: en
  text: Be careful, dear friends. His many benefits may become a judgment against us all if we do not live in a way worthy of him and, in harmony with one another,[a] do what is good and pleasing to him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in concord”; the word emphasizes unity rather than faction.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: See to it, beloved
  simplified_phrase: Be careful, dear friends
  preserved_meaning: The writer warmly warns the whole community to pay close attention.
  reasoning_layer_used: POB translation and immediate exhortational context
  rationale: This turns a formal command and address into a direct, dignified warning.
- pob_phrase: conduct ourselves worthily of him
  simplified_phrase: live in a way worthy of him
  preserved_meaning: Their whole manner of life must honor the one who gave the benefits.
  reasoning_layer_used: Applied lexical revision for πολιτευόμενοι
  rationale: This expresses a worthy pattern of life in familiar language.
- pob_phrase: good and pleasing before him
  simplified_phrase: good and pleasing to him
  preserved_meaning: They must do what God regards as good and acceptable.
  reasoning_layer_used: POB controlling translation
  rationale: This replaces a formal spatial idiom with its clear relational meaning.
interpretive_expansions:
- pob_phrase: in concord
  rendering: in harmony with one another
  claim: The required concord is unity among members of the community.
  evidence:
  - The Greek ὁμόνοια denotes concord among people.
  - The applied revision identifies concord as the opposite of Corinthian faction.
  confidence: high
  alternatives_preserved:
  - in concord
translation_notes:
  risk_flags:
  - risk: “Harmony” may soften the letter’s civic anti-faction vocabulary.
    mitigation: The footnote retains “concord” and explains the contrast with faction.
