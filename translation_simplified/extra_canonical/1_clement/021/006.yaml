translation:
  language: en
  text: Let us show reverence for the Lord Jesus Christ, whose blood was given for us. Let us respect those who go before us,[a] honor the elders, and train the young in the discipline of fearing God. Let us guide our wives toward what is good.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The phrase may refer to those who lead or otherwise go before the community; it does not specify formal leaders.
    reason: lexical_alternative
