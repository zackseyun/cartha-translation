  yaml_path: translation/extra_canonical/1_clement/058/001.yaml
  text: Let us therefore submit ourselves to his all-holy and glorious name, fleeing the threats previously spoken through wisdom against the disobedient, so that we may dwell, trusting in the most holy name of his majesty.
