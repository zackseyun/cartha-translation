translation:
  language: en
  text: Therefore, let us submit ourselves to his completely holy and glorious name, avoiding the threats that wisdom has already spoken against those who disobey, so that we may dwell trusting in the most holy name of his majesty.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: his all-holy and glorious name
  simplified_phrase: his completely holy and glorious name
  preserved_meaning: God’s name is wholly holy and glorious.
  reasoning_layer_used: POB base text and Greek source payload
  rationale: “Completely holy” expresses the uncommon term “all-holy” in ordinary English.
- pob_phrase: fleeing the threats previously spoken through wisdom against the disobedient
  simplified_phrase: avoiding the threats that wisdom has already spoken against those who disobey
  preserved_meaning: The readers must heed wisdom’s threats by turning away from the disobedient course they warn against.
  reasoning_layer_used: POB base text, Greek source payload, and grounding review
  rationale: “Avoiding” clarifies the response intended by the image of fleeing without specifying the threatened consequences.
- pob_phrase: so that we may dwell, trusting in the most holy name of his majesty
  simplified_phrase: so that we may dwell trusting in the most holy name of his majesty
  preserved_meaning: Their dwelling is accompanied by active trust in God’s most holy name.
  reasoning_layer_used: POB applied lexical revision
  rationale: This keeps dwelling distinct from trusting and does not add security as a second meaning.
translation_notes:
  risk_flags:
  - risk: “Name” may sound like a mere label to modern readers.
    mitigation: It is retained because this repeated biblical concept is central to both the source and POB.
