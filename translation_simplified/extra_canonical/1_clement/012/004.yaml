translation:
  language: en
  text: But when the king’s representatives approached her, they said, “The men who came to you to spy on our land—bring them out, because the king has ordered it.” She answered, “The men you are looking for did come to me, but they left at once and are now on the road.” She pointed the king’s representatives in another direction.
