  simplified_phrase: the king’s representatives approached her
  preserved_meaning: People acting for the king came up to her to deliver his command.
  reasoning_layer_used: source wording, applied revision, and narrative context
  rationale: This expresses their arrival and representative role without the awkward image of standing nearby.
- pob_phrase: for the king so orders
  simplified_phrase: because the king has ordered it
  preserved_meaning: Their demand carried the king’s authority.
  reasoning_layer_used: POB translation
  rationale: The direct modern wording preserves the force of the royal command.
- pob_phrase: while she pointed them in another direction
  simplified_phrase: She pointed the king’s representatives in another direction
  preserved_meaning: She deliberately directed the king’s representatives away from the men they sought.
  reasoning_layer_used: POB translation and immediate narrative context
  rationale: A separate sentence identifies the pronoun clearly without emphasizing the gesture’s timing.
