  name: English
  variant: simplified modern common English
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ δώσω τοὺς πονηροὺς ἀντὶ τῆς ταφῆς αὐτοῦ καὶ τοὺς πλουσίους ἀντὶ τοῦ θανάτου αὐτοῦ· ὅτι ἀνομίαν οὐκ ἐποίησεν, οὐδὲ εὑρέθη δόλος ἐν τῷ στόματι αὐτοῦ. καὶ κύριος βούλεται καθαρίσαι αὐτὸν τῆς πληγῆς.
  language: Greek
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/1_clement/016/010.yaml
  text: 'And I will give the wicked in place of his burial,

    and the rich in place of his death;

    because he committed no lawlessness,

    nor was deceit found in his mouth.

    And the Lord wills to cleanse him from the affliction.'
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T11:33:51Z'
    unchanged: false
    changes_summary: Revised 'did no lawless deed' to 'committed no lawlessness' for closer lexical correspondence to ἀνομίαν ἐποίησεν, and changed 'from the blow' to 'from the affliction' as a more natural and suitably broad rendering of τῆς πληγῆς.
translation:
  language: en
  text: '“I will give the wicked in place of his burial,

    and the rich in place of his death.


    He did nothing wrong,

    and no deceit was found in his mouth.


    The Lord intends to cleanse him from the affliction.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: because he committed no lawlessness
  simplified_phrase: He did nothing wrong
  preserved_meaning: He committed no wrongdoing.
  reasoning_layer_used: POB revision and source wording
  rationale: This states the broad moral claim naturally without suggesting only a technical legal offense.
- pob_phrase: the Lord wills
  simplified_phrase: The Lord intends
  preserved_meaning: The Lord purposes to bring about this cleansing.
  reasoning_layer_used: POB translation and grounding review
  rationale: “Intends” preserves the purposive force of the Lord’s will rather than suggesting a mere wish.
translation_notes:
  risk_flags:
  - risk: The relationships between the wicked and burial, and between the rich and death, remain difficult to interpret.
    mitigation: The unusual wording is retained because the POB does not resolve its ambiguity.
  - risk: “Affliction” may include a wound or blow as well as broader distress.
    mitigation: The POB’s broad audited rendering is retained instead of narrowing the image.
