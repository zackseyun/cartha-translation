translation:
  language: en
  text: 'The Lord Jesus Messiah, the scepter of God’s majesty, did not come with an arrogant show of pride, though he had the power to do so. Instead, he came in humility, just as the Holy Spirit said about him:


    “Lord, who has believed our report?

    To whom has the Lord’s arm been revealed?


    We made our proclamation before him.[a]

    He was like a child,

    like a root in thirsty ground.


    He had no impressive form or glory.

    When we saw him,

    he had no beauty or attractive appearance.

    Instead, his appearance was dishonored,

    falling short of ordinary human appearance.


    He was a man of suffering and toil,

    who knew how to bear weakness.

    Because his face was turned away,

    he was dishonored and was not esteemed.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek does not state what was announced; it reads literally, “We announced before him.”
    reason: source_note
simplification_decisions:
- pob_phrase: did not come in the pomp of arrogance or pride
  simplified_phrase: did not come with an arrogant show of pride
  preserved_meaning: Jesus rejected a proud, self-important display despite having the power to make one.
  reasoning_layer_used: POB translation and Greek source
  rationale: The natural wording preserves the contrast between arrogant display and humility.
- pob_phrase: We announced before him
  simplified_phrase: We made our proclamation before him
  preserved_meaning: The speakers proclaimed something before him without the Greek identifying a direct object.
  reasoning_layer_used: applied missing-nuance revision and Greek source
  rationale: The noun “proclamation” completes the English sentence without inserting “him” as an unsupported object.
- pob_phrase: a man being in affliction and toil
  simplified_phrase: a man of suffering and toil
  preserved_meaning: He experienced suffering and exhausting hardship.
  reasoning_layer_used: applied lexical revision on πληγή
  rationale: “Suffering” follows the audit and avoids the misleading modern sense of “plague.”
interpretive_expansions:
- pob_phrase: though being able
  rendering: though he had the power to do so
  claim: Jesus could have come with an impressive display but chose humility.
  evidence:
  - The concessive participle expresses ability despite his humble manner.
  - The immediate contrast is between arrogant display and humility.
  confidence: high
  alternatives_preserved:
  - though he was able
- pob_phrase: like a child, like a root in thirsty ground
  rendering: He was like a child, like a root in thirsty ground
  claim: The two images describe the person spoken about rather than the act of proclamation.
  evidence:
  - The surrounding quotation consistently describes him.
  - The similes introduce the description of his unimpressive appearance.
  confidence: high
  alternatives_preserved:
  - like a child, like a root in thirsty ground
translation_notes:
  risk_flags:
  - risk: “Before him” leaves the pronoun’s referent unstated, as in the POB and Greek.
    mitigation: The footnote preserves the source wording without forcing an unsupported direct object.
  - risk: “Because his face was turned away” can be understood in more than one way.
    mitigation: The text retains the POB wording and does not identify who turned away.
