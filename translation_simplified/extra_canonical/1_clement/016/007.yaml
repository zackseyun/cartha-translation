translation:
  language: en
  text: 'The Lord handed him over for our sins.


    Because he was afflicted,

    he did not open his mouth.


    He was led like a sheep to be slaughtered.

    Like a lamb silent before its shearer,

    he did not open his mouth.


    In his humiliation, his judgment was taken away.'
