  preserved_meaning: The Lord delivered him up in connection with our sins.
  reasoning_layer_used: POB translation and source payload
  rationale: “Handed him over” expresses the same action in natural modern English.
- pob_phrase: because of being afflicted
  simplified_phrase: Because he was afflicted
  preserved_meaning: His silence is stated in relation to his affliction without changing that relation.
  reasoning_layer_used: POB translation and independent grounding review
  rationale: A finite clause removes the awkward wording without adding wrongful treatment or concession.
- pob_phrase: Like a sheep he was led to slaughter
  simplified_phrase: He was led like a sheep to be slaughtered
  preserved_meaning: The image of a sheep being led to slaughter remains intact.
  reasoning_layer_used: POB translation and source image
  rationale: Ordinary English word order makes the image immediately clear.
