translation:
  language: en
  text: The Lord wills to remove the anguish from his soul, to show him light, and to shape him with understanding. He wills to vindicate the righteous one who serves many well. He himself will bear their sins.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: remove the anguish of his soul
  simplified_phrase: remove the anguish from his soul
  preserved_meaning: The Lord removes the suffering afflicting his soul.
  reasoning_layer_used: POB translation and latest revision pass
  rationale: “From his soul” makes the removal relationship immediately clear.
- pob_phrase: to form him with understanding
  simplified_phrase: to shape him with understanding
  preserved_meaning: The forming image and the broad connection with understanding remain intact.
  reasoning_layer_used: source image and grounding review
  rationale: “Shape” is familiar English, while “with” preserves the means-or-sphere ambiguity.
- pob_phrase: to justify the righteous one who serves many well
  simplified_phrase: to vindicate the righteous one who serves many well
  preserved_meaning: The Lord confirms the righteous standing of the servant who serves many well.
  reasoning_layer_used: POB translation, latest revision pass, and applied revision
  rationale: “Vindicate” clarifies the judicial sense without repeating “righteous.”
translation_notes:
  risk_flags:
  - risk: “With understanding” can indicate either the means or the sphere of shaping.
    mitigation: The wording preserves both possibilities rather than selecting one.
  - risk: The pronouns “him,” “he,” and “their” require the surrounding passage for identification.
    mitigation: They remain unresolved because the verse itself does not identify them.
