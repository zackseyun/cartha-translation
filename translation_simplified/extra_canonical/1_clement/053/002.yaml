translation:
  language: en
  text: For Moses went up the mountain and stayed there for forty days and forty nights, fasting and humbling himself. Then God said to him, “Moses, Moses, hurry down from here! Your people, whom you brought out of Egypt, have broken the law. They have quickly left the path I commanded them to follow, and they have made cast-metal images for themselves.”
