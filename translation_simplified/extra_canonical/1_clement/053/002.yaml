  preserved_meaning: Moses remained on the mountain for forty days and nights while fasting and deliberately humbling himself.
  reasoning_layer_used: POB translation and source payload
  rationale: The rewrite replaces an abstract phrase with ordinary actions without weakening Moses’s self-humiliation.
- pob_phrase: have acted lawlessly
  simplified_phrase: have broken the law
  preserved_meaning: The people violated what God required of them.
  reasoning_layer_used: POB controlling meaning
  rationale: This states the same wrongdoing in direct, common English.
