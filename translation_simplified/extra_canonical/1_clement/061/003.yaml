translation:
  language: en
  text: You alone can do these things and even greater good things among us. We thank you through Jesus Christ, the high priest and guardian of our souls. Through him, may glory and majesty be yours now, from one generation to the next, and forever and ever. Amen.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: To you, who alone are able to do these and greater good things among us, we give thanks
  simplified_phrase: You alone can do these things and even greater good things among us. We thank you
  preserved_meaning: God alone can accomplish these and greater good things among the community, and the community thanks him.
  reasoning_layer_used: POB grammar revision and latest revision pass
  rationale: Two direct sentences clarify the prayer while retaining the source-driven phrase “among us” and the broad sense of “good things.”
- pob_phrase: through the high priest and guardian of our souls, Jesus Christ
  simplified_phrase: through Jesus Christ, the high priest and guardian of our souls
  preserved_meaning: The thanksgiving is offered through Jesus Christ in his roles as high priest and guardian.
  reasoning_layer_used: POB text and applied lexical revision
  rationale: Putting the name first makes the titles easier to follow while preserving “Jesus Christ” and both roles.
- pob_phrase: both now and from generation to generation and unto the ages of ages
  simplified_phrase: now, from one generation to the next, and forever and ever
  preserved_meaning: Glory and majesty are ascribed to God now, throughout every generation, and eternally.
  reasoning_layer_used: POB text and Greek source image
  rationale: Familiar English preserves the widening span from the present through generations into eternity.
translation_notes:
  risk_flags:
  - risk: “Forever and ever” does not reproduce the literal image “ages of ages.”
    mitigation: The familiar phrase preserves the source expression’s emphatic sense of unending time.
  - risk: Breaking the opening into two sentences reduces some of the Greek doxology’s continuous flow.
    mitigation: The shorter structure improves first-read clarity without separating the prayer’s meaning.
