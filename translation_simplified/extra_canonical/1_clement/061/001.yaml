source:
  edition: Funk 1901 (normalized OCR)
  text: Σύ, δέσποτα, ἔδωκας τὴν ἐξουσίαν τῆς βασιλείας αὐτοῖς διὰ τοῦ μεγαλοπρεποῦς καὶ ἀνεκδιηγήτου κράτους σου, εἰς τὸ γινώσκοντας ἡμᾶς τὴν ὑπὸ σοῦ αὐτοῖς δεδομένην δόξαν καὶ τιμὴν ὑποτάσσεσθαι αὐτοῖς, μηδὲν ἐναντιουμένους τῷ θελήματί σου· οἷς δός, κύριε, ὑγίειαν, εἰρήνην, ὁμόνοιαν, εὐστάθειαν, εἰς τὸ διέπειν αὐτοὺς τὴν ὑπὸ σοῦ δεδομένην αὐτοῖς ἡγεμονίαν ἀπροσκόπως.
  language: Greek
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/1_clement/061/001.yaml
  text: You, Master, gave them the authority of rule through your magnificent and indescribable might, so that, knowing the glory and honor given to them by you, we might submit ourselves to them, opposing your will in nothing. Grant to them, Lord, health, peace, concord, and stability, so that they may administer without offense the leadership you have given them.
translation:
  language: en
  text: Master, by your majestic power—too great for words—you gave those who rule their authority. You did this so that we would recognize the glory and honor you gave them, submit to them, and never oppose your will. Lord, give them health, peace, unity, and stability, so that they may carry out the leadership you have given them without causing offense.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: through your magnificent and indescribable might
  simplified_phrase: by your majestic power—too great for words
  preserved_meaning: God's power is glorious and beyond full description.
  reasoning_layer_used: POB translation and Greek source image
  rationale: The concrete limit of human speech is stated in familiar English.
- pob_phrase: knowing the glory and honor given to them by you, we might submit ourselves to them
  simplified_phrase: we would recognize the glory and honor you gave them, submit to them
  preserved_meaning: Recognizing God-given honor leads to submission to rulers.
  reasoning_layer_used: POB syntax and source purpose clause
  rationale: The dense participial structure becomes coordinated English without merging its ideas.
- pob_phrase: concord
  simplified_phrase: unity
  preserved_meaning: The rulers are to have harmony rather than conflict.
  reasoning_layer_used: POB lexical meaning
  rationale: Unity communicates the same idea more naturally to modern readers.
interpretive_expansions:
- pob_phrase: them
  rendering: those who rule
  claim: The recipients of authority are governing officials.
  evidence:
