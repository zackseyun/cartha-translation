  text: σὺ γάρ, δέσποτα, ἐπουράνιε βασιλεῦ τῶν αἰώνων, δίδως τοῖς υἱοῖς τῶν ἀνθρώπων δόξαν καὶ τιμὴν καὶ ἐξουσίαν τῶν ἐπὶ τῆς γῆς ὑπαρχόντων· σὺ, κύριε, διεύθυνον τὴν βουλὴν αὐτῶν κατὰ τὸ καλὸν καὶ εὐάρεστον ἐνώπιον σου, ὅπως διέποντες ἐν εἰρήνῃ καὶ πραΰτητι εὐσεβῶς τὴν ὑπὸ σοῦ αὐτοῖς δεδομένην ἐξουσίαν θεοῦ σου τυγχάνωσιν.
  language: Greek
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/1_clement/061/002.yaml
  text: For you[a], Master, heavenly King of the ages, give glory and honor and authority to the sons of men over those who are on the earth. You, Lord, direct their counsel according to what is good and pleasing before you, so that, governing in peace and gentleness, and with godliness, the authority you have given them, they may obtain your favor.
  footnotes:
  - marker: a
    text: Or 'You, Lord, direct their counsel'.
    reason: previous_rendering
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T11:35:54Z'
    unchanged: false
    changes_summary: 'Adjusted word order and phrasing for accuracy and natural English: rendered τῶν ἐπὶ τῆς γῆς ὑπαρχόντων as ''over those who are on the earth'' rather than ''over the things on earth''; changed ''administering'' to ''governing''; added ''and with godliness'' for εὐσεβῶς; and smoothed the sentence while preserving the original sense.'
translation:
  language: en
  text: For you, Master, heavenly King through all ages, give rulers among human beings glory, honor, and authority over those on earth. Lord, guide their decisions toward what is good and pleasing to you, so that, as they use the authority you have given them to govern with peace, gentleness, and reverence for you, they may receive your favor.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: sons of men
  simplified_phrase: rulers among human beings
  preserved_meaning: The people receiving authority are human rulers, not divine beings.
  reasoning_layer_used: Immediate context and POB governing clause
  rationale: The contextual identification makes the recipients clear while preserving their humanity.
- pob_phrase: direct their counsel according to what is good and pleasing before you
  simplified_phrase: guide their decisions toward what is good and pleasing to you
  preserved_meaning: The prayer asks God to guide rulers toward choices he approves.
  reasoning_layer_used: Grammar revision and POB translation
  rationale: This wording makes the imperative petition and the sense of counsel clear.
- pob_phrase: governing in peace and gentleness, and with godliness, the authority you have given them
  simplified_phrase: use the authority you have given them to govern with peace, gentleness, and reverence for you
  preserved_meaning: Rulers should exercise God-given authority peacefully, gently, and reverently.
  reasoning_layer_used: Latest revision pass and Greek source clause
  rationale: The dense participial structure is recast without separating governing from receiving God's favor.
interpretive_expansions:
- pob_phrase: sons of men
  rendering: rulers among human beings
  claim: The human recipients of authority are the earthly rulers for whom this prayer intercedes.
  evidence:
  - The immediate context is a prayer for earthly rulers and governors.
  - The clause describes these people as governing with authority God has given them.
  confidence: high
  alternatives_preserved:
  - human rulers
  - governing authorities among humanity
- pob_phrase: with godliness
  rendering: with reverence for you
  claim: Their governing should be marked by reverent devotion to God.
  evidence:
  - The prayer directly addresses God and describes conduct pleasing to him.
  - The POB renders εὐσεβῶς as “with godliness.”
  confidence: high
  alternatives_preserved:
  - in a godly way
  - with devotion to you
translation_notes:
  risk_flags:
  - risk: “Rulers among human beings” makes the contextual identity of “sons of men” explicit.
    mitigation: The governing clause and immediate context directly support this bounded clarification.
  - risk: “Those on earth” may refer broadly to persons or earthly realities under authority.
    mitigation: The wording avoids adding “who live” and retains the POB’s broad expression.
