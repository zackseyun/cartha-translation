translation:
  language: en
  text: For he said, “How terrible it will be for that man! It would have been better for him never to have been born than to cause one of my chosen ones to fall into sin. It would have been better for him to have a millstone hung around him and be drowned in the sea than to lead one of my chosen ones astray.”
