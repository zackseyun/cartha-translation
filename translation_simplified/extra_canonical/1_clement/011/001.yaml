source:
  edition: Funk 1901 (normalized OCR)
  text: Διὰ φιλοξενίαν καὶ εὐσέβειαν Λὼτ ἐσώθη ἐκ Σοδόμων, τῆς περιχώρου πάσης κριθείσης διὰ πυρὸς καὶ θείου, πρόδηλον ποιήσας ὁ δεσπότης, ὅτι τοὺς ἐλπίζοντας ἐπʼ αὐτὸν οὐκ ἐγκαταλείπει, τοὺς δὲ ἑτεροκλινεῖς ὑπάρχοντας εἰς κόλασιν καὶ αἰκισμὸν τίθησιν.
  language: Greek
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/1_clement/011/001.yaml
  text: Because of hospitality and godliness, Lot was saved from Sodom, when the whole surrounding region was judged by fire and sulfur. In this the Master made it plain that he does not abandon those who hope in him, but appoints those who turn aside to punishment and torment.
translation:
  language: en
  text: Because Lot welcomed strangers and honored God, he was rescued from Sodom when the entire surrounding region was judged with fire and sulfur. By this, the Master clearly showed that he does not abandon those who put their hope in him, but assigns those who turn away to punishment and torment.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Because of hospitality and godliness
  simplified_phrase: Because Lot welcomed strangers and honored God
  preserved_meaning: Lot's hospitality and devotion to God are presented as the reason for his rescue.
  reasoning_layer_used: POB text and Greek source payload
  rationale: The abstract virtues become clear actions without weakening the stated cause.
- pob_phrase: In this the Master made it plain
  simplified_phrase: By this, the Master clearly showed
  preserved_meaning: Lot's rescue and the region's judgment reveal how the Master deals with people.
  reasoning_layer_used: POB text and immediate context
  rationale: Natural modern syntax keeps the event as the demonstration.
- pob_phrase: appoints those who turn aside to punishment and torment
  simplified_phrase: assigns those who turn away to punishment and torment
  preserved_meaning: The Master places those who depart from the right way under punitive suffering.
  reasoning_layer_used: POB text, Greek source payload, and grounding review
  rationale: “Assigns” preserves the placement sense without implying delivery to another power.
