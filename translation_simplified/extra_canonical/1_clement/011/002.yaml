    changes_summary: Revised 'not in concord' to 'not in agreement' for more natural formal English, and adjusted 'for this reason she was set as a sign' to 'she was made a sign for this reason' to better reflect the Greek word order and idiom.
translation:
  language: en
  text: 'For when his wife went out with him, she thought differently and was not in agreement. Because of this, she was made a sign: she became a pillar of salt that remains to this day. This was so that everyone might know that those who are inwardly divided and those who doubt God’s power become a judgment and a warning to every generation.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: being of a different mind and not in agreement
  simplified_phrase: she thought differently and was not in agreement
  preserved_meaning: Her different outlook and lack of agreement remain distinct.
  reasoning_layer_used: POB text and revision history
  rationale: A direct sentence replaces the difficult participial construction.
- pob_phrase: she was made a sign for this reason
  simplified_phrase: Because of this, she was made a sign
  preserved_meaning: Her dissent remains explicitly connected to her becoming a sign.
  reasoning_layer_used: Applied revision restoring εἰς τοῦτο
  rationale: The causal link is expressed in natural English without the repeated opening “For.”
- pob_phrase: the double-minded
  simplified_phrase: those who are inwardly divided
  preserved_meaning: The broad idea of inner division or vacillation remains without specifying its object.
  reasoning_layer_used: POB text and independent grounding review
  rationale: The wording explains the biblical idiom without narrowing it to divided loyalty.
translation_notes:
  risk_flags:
  - risk: “Become a judgment” remains a compressed and potentially ambiguous expression.
    mitigation: The main text preserves the POB wording rather than choosing between undergoing judgment and becoming an example of judgment.
