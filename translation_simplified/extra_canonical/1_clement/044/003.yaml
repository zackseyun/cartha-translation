    changes_summary: 'Changed ''without arrogance'' to ''unpretentiously'' for a more natural rendering of ἀβαναύσως, and adjusted the final clause to more closely reflect the Greek word order: ''we consider not to be justly removed.'''
translation:
  language: en
  text: Therefore, these people were appointed either by them or later by other respected men, with the whole church’s approval. They served the Messiah’s flock blamelessly, with humility, quietly, and without self-importance. For a long time, everyone has spoken well of them. We believe it is unjust to remove such people from the ministry.
  philosophy: optimal-equivalence
