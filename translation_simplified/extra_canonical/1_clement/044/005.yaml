translation:
  language: en
  text: Blessed are the elders who have gone on ahead. Their departure from this life came at the right time and was complete. They do not fear that anyone will remove them from the place given to them.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the elders who went on before
  simplified_phrase: the elders who have gone on ahead
  preserved_meaning: The elders preceded others in death, while the journey image remains intact.
  reasoning_layer_used: source text and POB translation
  rationale: “Gone on ahead” is natural English and retains the image of traveling before others.
- pob_phrase: who had a timely and complete departure
  simplified_phrase: Their departure from this life came at the right time and was complete.
  preserved_meaning: Their departure had both proper timing and completeness.
  reasoning_layer_used: source text, POB translation, and grounding review
  rationale: A separate sentence and “at the right time” make the two qualities easier to follow.
- pob_phrase: lest someone remove them from the place given to them
  simplified_phrase: that anyone will remove them from the place given to them
  preserved_meaning: The elders need not fear being displaced from the place they received.
  reasoning_layer_used: POB translation, applied lexical revision, and grounding review
  rationale: This keeps the elders as the object of removal and preserves the audited word “given.”
