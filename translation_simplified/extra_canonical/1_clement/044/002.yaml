translation:
  language: en
  text: 'That is why, after receiving full knowledge of what was to come, they appointed the men already mentioned. Later, they made an additional provision: if those men fell asleep in death, other men who had been tested and approved could succeed them in their ministry.'
  philosophy: optimal-equivalence
