base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/1_clement/006/001.yaml
  text: To these men, who had conducted themselves in holiness, there was gathered a great multitude of the elect, who, having suffered many outrages and tortures because of jealousy, became a most beautiful example among us.
  footnotes:
  - marker: a
    text: Or 'having suffered through jealousy many outrages and tortures'.
    reason: previous_rendering
translation:
  language: en
  text: These men had lived holy lives. A great crowd of chosen people joined them. Because of jealousy, this crowd endured many abuses and tortures and became an exceptionally fine example among us.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: To these men, who had conducted themselves in holiness, there was gathered
  simplified_phrase: These men had lived holy lives. A great crowd ... joined them.
  preserved_meaning: The men lived in holiness, and the crowd was gathered with them.
  reasoning_layer_used: POB text and Greek clause structure
  rationale: Two direct sentences clarify who lived holy lives and who joined them.
- pob_phrase: a great multitude of the elect
  simplified_phrase: a great crowd of chosen people
  preserved_meaning: A large group identified as chosen joined the men.
  reasoning_layer_used: POB lexical wording
  rationale: Common words replace “multitude” and “the elect” while retaining the idea of being chosen.
- pob_phrase: became a most beautiful example among us
  simplified_phrase: became an exceptionally fine example among us
  preserved_meaning: They became an outstanding and admirable example within the community.
  reasoning_layer_used: POB figurative and superlative force; grounding review
  rationale: “Exceptionally fine” preserves strong praise without implying they were the one uniquely finest example.
translation_notes:
  risk_flags:
  - risk: “Chosen people” may sound like a broader theological title.
    mitigation: The wording retains POB’s idea of “the elect” without defining a doctrine of election.
