  text: ὁ ἰσχυρὸς ἐπιμελείσϑω τὸν ἀσϑενῆ, ὁ δὲ ἀσϑενὴς ἐντρεπέσϑω τὸν ἰσχυρόν· ὁ πλούσιος ἐπιχορηγείτω τῷ πτωχῷ, ὁ δὲ πτωχὸς εὐχαριστείτω τῷ ϑεῷ, ὅτι ἔδωκεν αὐτῷ, ᾧ οὐ ἀναπληρωθῇ αὐτοῦ τὸ ὑστέρημα· ὁ σοφὸς ἐνδεικνύσθω τὴν σοφίαν αὐτοῦ μὴ ἐν λόγοις, ἀλλʼ ἐν ἔργοις ἀγαθοῖς· ὁ ταπεινοφρονῶν μὴ ἑαυτῷ μαρτυρείτω, ἀλλʼ ἔατω ὑφʼ ἑτέρου ἑαυτὸν μαρτυρεῖσθαι· ὁ ἁγνὸς ἐν τῇ σαρκὶ μὴ ἀλαζονευέσθω, γινώσκων, ὅτι ἕτερός ἐστιν ὁ ἐπιχορηγῶν αὐτῷ τὴν ἐγκράτειαν.
  language: Greek
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/1_clement/038/002.yaml
  text: Let the strong care for the weak[a], and let the weak respect the strong. Let the rich provide for the poor, and let the poor give thanks to God, because he has given him one through whom his need may be supplied. Let the wise show his wisdom not in words, but in good works. Let the humble-minded not testify concerning himself, but let him allow himself to be testified to by another. Let the one who is pure in the flesh not boast[b], knowing that it is another who supplies him with self-control.
  footnotes:
  - marker: a
    text: Or 'but let him allow himself to be borne witness to by another'.
    reason: previous_rendering
  - marker: b
    text: Or 'supplies him self-control'.
    reason: previous_rendering
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T11:34:38Z'
    unchanged: false
    changes_summary: 'Refined several phrases for lexical accuracy and natural English: changed ''take care of'' to ''care for''; ''supply the poor'' to ''provide for the poor''; clarified the δύσκολη clause as ''he has given him one through whom his need may be supplied''; and adjusted ''bear witness to himself'' to ''testify concerning himself ... be testified to by another'' to reflect the Greek more closely.'
translation:
  language: en
  text: Those who are strong should care for those who are weak, and the weak should respect the strong. The rich should provide for the poor. The poor should thank God for giving them someone who can meet their needs. Those who are wise should show their wisdom by good deeds, not merely by words. Those who are humble should not commend themselves, but should let someone else testify about them. Those who keep their bodies pure should not boast, because they know that someone else gives them self-control.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: because he has given him one through whom his need may be supplied
  simplified_phrase: for giving them someone who can meet their needs
  preserved_meaning: God provides a person through whom the poor receive what they need.
  reasoning_layer_used: POB translation and latest revision rationale
  rationale: The nested pronouns and passive wording become a direct, natural statement.
- pob_phrase: Let the wise show his wisdom not in words, but in good works
  simplified_phrase: Those who are wise should show their wisdom by good deeds, not merely by words
  preserved_meaning: Wisdom must be demonstrated in good actions rather than only expressed in speech.
  reasoning_layer_used: POB translation and Greek clause contrast
  rationale: Ordinary wording preserves the contrast between words and deeds.
- pob_phrase: Let the humble-minded not testify concerning himself, but let him allow himself to be testified to by another
  simplified_phrase: Those who are humble should not commend themselves, but should let someone else testify about them
  preserved_meaning: Humble people leave their commendation to the testimony of others.
  reasoning_layer_used: POB translation and applied awkward-English revision
  rationale: The first clause clarifies self-praise while the second retains the witness image.
translation_notes:
  risk_flags:
  - risk: “Keep their bodies pure” interprets the biblical image “pure in the flesh” in more natural English.
    mitigation: It preserves bodily purity without narrowing the phrase exclusively to sexual conduct.
  - risk: Modern readers may assume that “someone else” directly names God.
    mitigation: The wording retains the source’s unnamed giver rather than resolving the ambiguity.
