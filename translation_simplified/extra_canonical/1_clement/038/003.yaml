translation:
  language: en
  text: So then, brothers, let us think carefully about what we were made from. Let us consider what we were like and who we were when we came into the world. The one who formed and created us brought us out of the grave and darkness into his own world. Before we were born, he had already prepared his benefits for us.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Benefits” means the favors or help provided by a benefactor.
    reason: cultural_note
