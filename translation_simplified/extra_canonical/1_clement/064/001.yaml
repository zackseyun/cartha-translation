base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/1_clement/064/001.yaml
  text: Finally, may the all-seeing God and Master of spirits and Lord of all flesh, who chose the Lord Jesus Messiah and us through him to be a people for his own possession, grant to every soul that has been called by his magnificent and holy name faith, fear, peace, endurance and longsuffering, self-control, purity, and sound judgment, so as to be pleasing to his name through our high priest and protector Jesus Messiah, through whom be glory and majesty to him, might and honor, both now and through all the ages of ages. Amen.
translation:
  language: en
  text: Finally, God sees everything. He is the Master of spirits and the Lord of all humanity.[a] He chose the Lord Jesus Messiah, and through him he chose us to be a people who belong especially to him. May God give everyone who has been called by his magnificent and holy name faith, fear of him, peace, endurance, patience, self-control, purity, and good judgment. May they live in a way that pleases God through Jesus Messiah, our high priest and protector. Through Jesus Messiah, may glory, majesty, power, and honor belong to God, now and forever and ever. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “Lord of all flesh.”
    reason: source_note
