translation:
  language: en
  text: 'You foolish people, compare yourselves to a tree. Look at a grapevine: first it sheds its leaves, then a shoot grows, then a leaf, and then a flower. After that come the unripe grape and then the full cluster. You can see that the tree’s fruit ripens in a short time.'
