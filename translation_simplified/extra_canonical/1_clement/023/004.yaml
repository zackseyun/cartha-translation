  rationale: “People” is more natural modern English than the substantival “ones.”
- pob_phrase: take a vine
  simplified_phrase: Look at a grapevine
  preserved_meaning: The reader is still directed to use the vine as the example.
  reasoning_layer_used: Immediate context and POB main text
