  preserved_meaning: People should admit their moral wrongdoing.
  reasoning_layer_used: applied awkward-English revision
  rationale: “Sins” is common English that retains the religious and moral force of “transgressions.”
- pob_phrase: whose judgment became evident
  simplified_phrase: their judgment became clear
  preserved_meaning: The rebels’ judgment was plainly revealed without specifying its direction.
  reasoning_layer_used: latest revision pass and grounding review
  rationale: A new clause removes the unclear relative construction while preserving the source’s scope.
translation_notes:
