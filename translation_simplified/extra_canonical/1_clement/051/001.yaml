id: 1CLEM.51.1
reference: 1 Clement 51:1
language:
  code: en
  name: English
  variant: simplified modern common English
source:
  edition: Funk 1901 (normalized OCR)
  text: Ὅσα οὖν παρεπέσαμεν καὶ ἐποιήσαμεν διά τινος τῶν τοῦ ἀντικειμένου, ἀξιώσωμεν ἀφεθῆναι ἡμῖν· καὶ ἐκεῖνοι δέ, οἵτινες ἀρχηγοὶ στάσεως καὶ διχοστασίας ἐγενήθησαν, ὀφείλουσιν τὸ κοινὸν ₂₀ τῆς ἐλπίδος σκοπεῖν.
  language: Greek
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/1_clement/051/001.yaml
  text: Therefore, whatever things we have done wrong and committed through any schemes of the adversary, let us ask that they be forgiven us. And those, too, who became leaders of revolt and division ought to consider the common hope.
  footnotes:
  - marker: a
    text: Or 'And those who became leaders of revolt and division ought to consider the common good of our hope.'.
    reason: previous_rendering
translation:
  language: en
  text: Therefore, let us ask to be forgiven for every wrong we have done and committed through the adversary’s schemes. Those who led the revolt and division should also consider the hope we all share.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the common good of our hope.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: whatever things we have done wrong and committed
  simplified_phrase: every wrong we have done and committed
  preserved_meaning: The wording retains both POB expressions for committing wrongdoing without implying passive involvement.
  reasoning_layer_used: POB base text and grounding review
  rationale: This removes the unsupported idea of falling into wrongdoing while keeping the paired expressions.
- pob_phrase: let us ask that they be forgiven us
  simplified_phrase: let us ask to be forgiven
  preserved_meaning: The community is urged to seek forgiveness without naming who grants it.
  reasoning_layer_used: POB base text
  rationale: The shorter wording is natural English and preserves the unstated giver of forgiveness.
- pob_phrase: the common hope
  simplified_phrase: the hope we all share
  preserved_meaning: The hope belongs in common to the whole community.
  reasoning_layer_used: Applied lexical revision and POB footnote
  rationale: The main text clarifies the preferred idiom while the footnote retains the recorded alternative.
translation_notes:
  risk_flags:
  - risk: “Ask to be forgiven” does not identify who grants forgiveness.
    mitigation: The POB also leaves the giver unstated, so the draft does not add one.
  - risk: “The hope we all share” selects the preferred reading over a recorded alternative.
    mitigation: The alternative “the common good of our hope” is retained in footnote [a].
