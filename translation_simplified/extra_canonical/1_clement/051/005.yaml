  preserved_meaning: The leaders, chariots, and riders remain distinct parts of the Egyptian force.
  reasoning_layer_used: POB translation, Greek source payload, and grounding review
  rationale: A direct list avoids wrongly making the chariots and riders a subset of the leaders.
- pob_phrase: were sunk into the Red Sea and perished
  simplified_phrase: sank in the Red Sea and died
  preserved_meaning: They went down in the sea and lost their lives.
  reasoning_layer_used: POB translation and Greek source payload
  rationale: Common verbs replace formal wording while preserving the fatal outcome.
- pob_phrase: for no other cause than this
  simplified_phrase: This happened for one reason alone
  preserved_meaning: Their hardened hearts are presented as the sole cause of their destruction.
  reasoning_layer_used: POB translation and Greek causal construction
  rationale: A new sentence makes the emphatic cause easier to follow.
