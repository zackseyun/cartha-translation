translation:
  language: en
  text: 'Pharaoh, his army, all the leaders of Egypt, the chariots, and those who rode in them sank in the Red Sea and died. This happened for one reason alone: after God’s signs and wonders were performed in Egypt through Moses, God’s servant, their foolish hearts were hardened.'
