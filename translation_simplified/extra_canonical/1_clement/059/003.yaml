  text: ἐλπίζειν ἐπὶ τὸ ἀρχέγονον πάσης κτίσεως ὄνομά σου, ἀνοίξας τοὺς ὀφθαλμοὺς τῆς καρδίας ἡμῶν εἰς τὸ γινώσκειν σε τὸν μόνον ὕψιστον ἐν ὑψίστοις, ἅγιον ἐν ἁγίοις ἀναπαυόμενον· τὸν ταπεινοῦντα ὕβριν ὑπερηφάνων, τὸν διαλύοντα λογισμοὺς ἐθνῶν, τὸν ποιοῦντα ταπεινοὺς εἰς ὕψος καὶ τοὺς ὑψηλοὺς ταπεινοῦντα, τὸν πλουτίζοντα καὶ πτωχίζοντα, τὸν ἀποκτείνοντα καὶ ζῳοποιοῦντα καὶ ζῆν ποιοῦντα, μόνον εὐεργέτην πνευμάτων καὶ θεὸν πάσης σαρκός· τὸν ἐπιβλέποντα ἐν τοῖς ἀβύσσοις, τὸν ἐπόπτην ἀνθρωπίνων ἔργων, τὸν τῶν κινδυνευόντων βοηθόν, τὸν τῶν ἀπηλπισμένων σωτῆρα, τὸν παντὸς πνεύματος κτίστην καὶ ἐπίσκοπον· τὸν πληθύνοντα ἔθνη ἐπὶ γῆς καὶ ἐκ πάντων ἐκλεγόμενον τοὺς ἀγαπῶντάς σε διὰ Ἰησοῦ Χριστοῦ τοῦ ἠγαπημένου παιδός σου, δι’ οὗ ἡμᾶς ἐπαίδευσας, ἥγιασας, ἐτίμησας.
  language: Greek
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/1_clement/059/003.yaml
  text: to hope in your name[a], the source of all creation, having opened the eyes of our heart so that we might know you, the only Most High among the highest, the Holy One resting among the holy ones; the one who humbles the insolence of the proud, who frustrates the plans of the nations, who exalts the humble and humbles the exalted, who makes rich and makes poor, who kills and gives life, the only benefactor of spirits and God of all flesh; who looks into the depths, the overseer of human deeds, the helper of those in danger, the savior of those without hope, the creator and overseer of every spirit; who multiplies nations on the earth and from among them all chooses those who love you through Jesus Messiah, your beloved servant, through whom you instructed us, sanctified us[b], and honored us.
  footnotes:
  - marker: a
    text: Or 'your name, the source from which all creation first came'.
    reason: previous_rendering
  - marker: b
    text: Or 'holy, resting among the holy'.
    reason: previous_rendering
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T11:35:21Z'
    unchanged: false
    changes_summary: 'Refined several renderings for accuracy and register: ''primal source'' to ''source''; ''only Highest'' to ''only Most High''; ''breaks up the designs'' to ''frustrates the plans''; ''raises the lowly to high places and humbles the lofty'' to ''exalts the humble and humbles the exalted''; removed the redundant ''and causes to live''; ''upon the earth'' to ''on the earth''; ''Messiah'' to ''Christ'' for consistency with the Greek; ''child'' to ''servant'' for παιδός; and ''trained'' to ''instructed'' for ἐπαίδευσας. [Regression fix applied: Messiah restored (revision_pass had changed Χριστός → Christ against DOCTRINE.md policy)]'
translation:
  language: en
  text: to put our hope in your name, the source of all creation. You opened the eyes of our hearts so that we could know you. You alone are the Most High among the highest, the Holy One who rests among the holy ones. You humble the proud in their arrogance and frustrate the plans of nations. You lift up the humble and bring down the exalted. You make people rich or poor; you kill and give life. You alone do good to spirits, and you are God of all who live in flesh. You look into the depths and watch over everything people do. You help those in danger and save those without hope. You created every spirit and watch over them all. You increase the nations on earth, and from all of them you choose those who love you through Jesus Messiah, your beloved servant. Through him you instructed us, made us holy, and honored us.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: having opened the eyes of our heart so that we might know you
  simplified_phrase: You opened the eyes of our hearts so that we could know you.
  preserved_meaning: God enables his people to perceive and know him inwardly.
  reasoning_layer_used: POB translation and source image
  rationale: A direct sentence preserves the image of opened inner eyes while clarifying the grammar.
- pob_phrase: the one who humbles the insolence of the proud ... who exalts the humble and humbles the exalted
  simplified_phrase: You humble the proud in their arrogance ... You lift up the humble and bring down the exalted.
  preserved_meaning: God opposes pride and reverses high and low status.
  reasoning_layer_used: POB translation and applied revision
  rationale: Direct verbs and shorter sentences clarify both reversals without combining them.
- pob_phrase: the only benefactor of spirits and God of all flesh; who looks into the depths, the overseer of human deeds
  simplified_phrase: You alone do good to spirits, and you are God of all who live in flesh. You look into the depths and watch over everything people do.
  preserved_meaning: God uniquely benefits spirits, rules embodied life, sees the depths, and oversees human actions.
  reasoning_layer_used: POB translation, Greek source imagery, and grounding review
  rationale: Common verbs replace formal titles while preserving spirits without adding “every” and retaining the images of flesh and depths.
interpretive_expansions:
- pob_phrase: God of all flesh
  rendering: God of all who live in flesh
  claim: “Flesh” refers here to embodied living beings rather than merely bodily material.
  evidence:
  - The surrounding clauses present God as creator and overseer of living spirits and human deeds.
  confidence: high
  alternatives_preserved:
  - God of all flesh
translation_notes:
  risk_flags:
  - risk: “The holy ones” may refer to heavenly beings or holy people.
    mitigation: The wording remains unresolved because the POB does not identify the group.
  - risk: Dividing the prayer into sentences may hide that its opening infinitive continues the preceding context.
    mitigation: The lowercase opening “to put” preserves the grammatical connection.
