translation:
  language: en
  text: Master, we ask you to help and protect us. Rescue those among us who are suffering. Have mercy on those who have been brought low. Raise up those who have fallen. Show yourself to those in need. Heal the weak, and bring back those among your people who have wandered away. Feed the hungry. Set free our prisoners. Restore the sick to health, and give courage to those who have lost heart. Let every nation know that you alone are God, that Jesus Messiah is your servant, and that we are your people—the sheep of your pasture.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: have mercy on the lowly
  simplified_phrase: Have mercy on those who have been brought low
  preserved_meaning: The prayer includes people in a low or humbled condition without specifying its cause.
  reasoning_layer_used: POB translation and grounding review
  rationale: This avoids narrowing the phrase to oppression while making “lowly” easier to understand.
- pob_phrase: redeem our prisoners
  simplified_phrase: Set free our prisoners
  preserved_meaning: God is asked to release imprisoned members of the community.
  reasoning_layer_used: POB translation, source context, and grounding review
  rationale: The direct request communicates the action more clearly than the potentially opaque verb “redeem.”
- pob_phrase: raise up the sick, encourage the fainthearted
  simplified_phrase: Restore the sick to health, and give courage to those who have lost heart
  preserved_meaning: God is asked both to restore the ill and to strengthen discouraged people.
  reasoning_layer_used: POB translation and immediate petition list
  rationale: The wording explains both petitions in ordinary English while keeping them distinct.
interpretive_expansions:
- pob_phrase: raise up the sick
  rendering: Restore the sick to health
  claim: Raising up the sick means restoring them from illness.
  evidence:
  - The phrase appears among requests to heal and aid vulnerable people.
  - The grounding review identifies restoration from illness as the contextual sense.
  confidence: high
  alternatives_preserved:
  - raise up the sick
translation_notes:
  risk_flags:
  - risk: “Show yourself” states the sense of divine appearing more idiomatically than POB’s “appear.”
    mitigation: It preserves the request that God make his presence evident to those in need.
  - risk: “Set free” makes the practical result of “redeem” explicit.
    mitigation: The prisoner context bounds the wording to release rather than erasing the petition’s force.
