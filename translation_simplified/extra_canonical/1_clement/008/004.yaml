translation:
  language: en
  text: 'And elsewhere he says:


    “Wash yourselves and become clean. Remove your wicked deeds from before my eyes and from your souls. Stop doing evil. Learn to do good. Seek justice. Rescue those who are being wronged. Defend the orphan’s cause, and secure justice for the widow.


    “Come now, and let us reason together,” says the Lord. “Even if your sins are crimson, I will make them white as snow. If they are scarlet, I will make them white as wool. If you are willing and listen to me, you will eat the good things of the land. But if you refuse and do not listen, the sword will devour you. The mouth of the Lord has spoken.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: cease from your wickednesses
  simplified_phrase: Stop doing evil
  preserved_meaning: They must abandon their repeated evil conduct.
  reasoning_layer_used: POB translation and immediate command sequence
  rationale: The direct command replaces an unnatural abstract plural without weakening its force.
- pob_phrase: rescue the one being wronged, judge for the orphan, and give justice to the widow
  simplified_phrase: Rescue those who are being wronged. Defend the orphan’s cause, and secure justice for the widow.
  preserved_meaning: God commands active protection and justice for vulnerable people.
  reasoning_layer_used: POB translation and source command structure
  rationale: Common legal language clarifies each distinct command while preserving all three.
- pob_phrase: if you are not willing and do not listen to me
  simplified_phrase: if you refuse and do not listen
  preserved_meaning: Judgment follows deliberate unwillingness and disobedience.
  reasoning_layer_used: POB translation
  rationale: “Refuse” expresses unwillingness in concise, natural English.
