translation:
  language: en
  text: “People of Israel, repent of your lawlessness. I said to the children of my people, ‘If your sins extend from earth to heaven, if they are redder than scarlet and blacker than the coarse cloth worn in mourning, and if you turn to me with all your heart and say, “Father,” I will listen to you as I would to a holy people.’”
