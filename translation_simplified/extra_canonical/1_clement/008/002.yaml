  simplified_phrase: spoke about repentance and swore an oath
  preserved_meaning: The Master solemnly confirms his teaching about repentance with an oath.
  reasoning_layer_used: source text and POB translation
  rationale: The verbal wording is clearer while preserving the oath’s force.
- pob_phrase: For as I live
  simplified_phrase: As surely as I live
  preserved_meaning: The Lord swears by his own life.
  reasoning_layer_used: source text and immediate quotation
  rationale: The common English oath formula preserves the solemn expression.
- pob_phrase: I do not desire the death of the sinner so much as his repentance
  simplified_phrase: I do not desire the sinner’s death, but rather that he repent
  preserved_meaning: The Lord prefers the sinner’s repentance to the sinner’s death.
  reasoning_layer_used: POB controlling rendering
  rationale: The clause makes the contrast direct while retaining repentance.
