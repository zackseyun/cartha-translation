translation:
  language: en
  text: 'The Master of all things also spoke about repentance and swore an oath: “As surely as I live,” says the Lord, “I do not desire the sinner’s death, but rather that he repent.” He then added this good judgment:'
  philosophy: optimal-equivalence
simplification_decisions:
