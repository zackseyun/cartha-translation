source:
  edition: Funk 1901 (normalized OCR)
  text: Διὰ τὰς αἰφνιδίους καὶ ἐπαλλήλους γενομένας ἡμῖν συμφορὰς καὶ περιστάσεις, ἀδελφοί, βράδιον νομίζομεν ἐπιστροφὴν πεποιῆσθαι περὶ τῶν ἐπιζητουμένων παρʼ ὑμῖν πραγμάτων, ἀγαπητοί, τῆς τε ἀλλοτρίας καὶ ξένης τοῖς ἐκλεκτοῖς τοῦ θεοῦ, μιαρᾶς καὶ ἀνοσίου στάσεως, ἣν ὀλίγα πρόσωπα προπετῆ καὶ αὐθάδη ὑπέρχοντα εἰς τοσοῦτον ἀπονοίας ἐξέκαυσαν, ὥστε τὸ σεμνὸν καὶ περιβόητον καὶ πᾶσιν ἀνθρώποις ἀξιαγάπητον ὄνομα ὑμῶν μεγάλως βλασφημηθῆναι.
  language: Greek
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/1_clement/001/001.yaml
  text: Because of the sudden and repeated misfortunes and crises that have happened to us, brothers, we consider that we have been somewhat slow in turning our attention to the matters disputed among you, beloved—namely, the alien and strange uprising, defiled and unholy, foreign to the chosen of God, which a few rash and self-willed persons have kindled to such a pitch of madness that your dignified and widely spoken-of name, worthy of love among all people, has been greatly blasphemed.
  footnotes:
  - marker: a
    text: Or 'the matters being sought from us among you'.
    reason: previous_rendering
translation:
  language: en
  text: Dear brothers, sudden and repeated troubles have come upon us. Because of them, we believe we have been somewhat slow to turn our attention to the matters being disputed among you. Dear friends, this rebellion is corrupt and unholy. It is utterly foreign to God’s chosen people. A few reckless and self-willed people have set it ablaze and driven it to such madness that the honored name you bear—a name widely known and loved by all—has been severely slandered.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Because of the sudden and repeated misfortunes and crises that have happened to us
  simplified_phrase: sudden and repeated troubles have come upon us
  preserved_meaning: Repeated unexpected hardships delayed the writers’ response.
  reasoning_layer_used: POB base text
  rationale: The shorter wording preserves both the suddenness and recurrence of the hardships.
- pob_phrase: the alien and strange uprising, defiled and unholy, foreign to the chosen of God
  simplified_phrase: this rebellion is corrupt and unholy. It is utterly foreign to God’s chosen people
  preserved_meaning: The conflict is morally impure and incompatible with God’s people.
  reasoning_layer_used: source payload and POB base text
  rationale: Separate sentences clarify the moral judgment without weakening it.
- pob_phrase: which a few rash and self-willed persons have kindled to such a pitch of madness
  simplified_phrase: A few reckless and self-willed people have set it ablaze and driven it to such madness
  preserved_meaning: A small group deliberately inflamed the rebellion to an extreme degree.
  reasoning_layer_used: Greek source image preserved through POB
  rationale: The fire image remains while the clause becomes natural modern English.
translation_notes:
  risk_flags:
  - risk: “Matters being disputed among you” could be mistaken for matters requested from the writers.
    mitigation: The main text retains the source-grounded revision and does not insert “from us.”
  - risk: “Slandered” may convey less explicitly religious force than “blasphemed.”
    mitigation: It clearly communicates hostile speech against their honored name without implying that the name itself is divine.
