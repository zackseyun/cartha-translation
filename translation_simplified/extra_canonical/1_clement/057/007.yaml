source:
  edition: Funk 1901 (normalized OCR)
  text: ἀνθ' ὧν γὰρ ἠδίκουν νηπίους φονευθήσονται, καὶ ἐξέτασμος ἀσεβεῖς ὀλεῖ· ὁ δὲ ἐμοῦ ἀκούων κατασκηνώσει ἐπ' ἐλπίδι πεποιθὼς καὶ ἡσυχάσει ἀφόβως ἀπὸ παντὸς κακοῦ.
  language: Greek
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/1_clement/057/007.yaml
  text: For because they were wronging the innocent[a], they will be slain, and inquiry will destroy the ungodly; but the one who hears me will dwell, trusting in hope, and will be at rest without fear from every evil.
  footnotes:
  - marker: a
    text: Or 'the innocent'.
    reason: previous_rendering
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T11:35:17Z'
    unchanged: false
    changes_summary: Changed 'the simple' to 'the innocent' for νηπίους, which here refers to vulnerable/innocent ones rather than merely simple-minded people. Changed 'examination' to 'inquiry' for more natural formal English with ἐξέτασμος. Removed the closing quotation mark not warranted by the source presentation.
translation:
  language: en
  text: Because they treated the innocent unjustly, they will be killed. Inquiry will destroy the ungodly. But whoever listens to me will dwell securely, trusting in hope, and will rest without fear of any evil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The innocent” may also be translated “the simple,” meaning inexperienced or naive people.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For because they were wronging the innocent
  simplified_phrase: Because they treated the innocent unjustly
  preserved_meaning: Their punishment follows their unjust treatment of innocent people.
  reasoning_layer_used: latest revision pass
  rationale: This removes the awkward double connector while retaining the stated cause.
- pob_phrase: the one who hears me
  simplified_phrase: whoever listens to me
  preserved_meaning: The promise applies to the person who heeds the speaker.
  reasoning_layer_used: source text and POB translation
  rationale: “Whoever listens” is natural English without adding a stronger claim of obedience.
- pob_phrase: will dwell, trusting in hope, and will be at rest
  simplified_phrase: will dwell securely, trusting in hope, and will rest
  preserved_meaning: The hearer will live with confident hope and freedom from fear.
  reasoning_layer_used: POB translation and immediate clause context
  rationale: The wording keeps the dwelling image while making the promised safety easier to follow.
translation_notes:
  risk_flags:
  - risk: The record contains conflicting judgments on whether νηπίους means “the innocent” or “the simple.”
    mitigation: The main text follows the latest POB revision, while the footnote preserves the documented alternative.
  - risk: “Inquiry” remains somewhat abstract in modern English.
    mitigation: It is retained because the POB deliberately chose it for ἐξέτασμος and supplies no firmer contextual expansion.
