translation:
  language: en
  text: Learn to submit. Stop speaking with arrogant, proud defiance. It is better for you to be considered unimportant but respected within Christ’s flock[a] than to seem more important than others and be cast out from Christ’s hope.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “counted as belonging within Christ’s flock.”
    reason: lexical_alternative
