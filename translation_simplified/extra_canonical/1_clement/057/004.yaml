    unchanged: true
    changes_summary: No changes needed.
translation:
  language: en
  text: Because I called and you did not listen, and I kept speaking to you but you paid no attention, you rejected my counsel and would not accept my correction. Therefore, I too will laugh at your ruin. I will rejoice when destruction comes upon you, when sudden turmoil overtakes you, when your downfall comes like a storm, or when suffering and siege come upon you.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I stretched out words
  simplified_phrase: I kept speaking to you
  preserved_meaning: The speaker persistently addressed them, but they continued to ignore him.
  reasoning_layer_used: Greek source, POB wording, and grounding review
  rationale: This conveys a sustained appeal without implying one unusually long speech.
- pob_phrase: made my counsels void
  simplified_phrase: rejected my counsel
  preserved_meaning: They treated the speaker's guidance as having no authority or value.
  reasoning_layer_used: Controlling POB meaning in immediate context
  rationale: This states the practical force of the opaque expression in common English.
- pob_phrase: disobeyed my reproofs
  simplified_phrase: would not accept my correction
  preserved_meaning: They deliberately resisted the correction directed at them.
  reasoning_layer_used: Controlling POB wording and parallel clauses
  rationale: The wording clearly communicates their refusal of correction.
translation_notes:
  risk_flags:
  - risk: “Kept speaking” makes the source image of stretching out words less visible.
    mitigation: It preserves the image's contextual force as persistent address without narrowing it to lengthy discourse.
  - risk: The speaker's laughter and rejoicing at ruin may sound unusually severe.
    mitigation: The direct language remains because both the POB and Greek source preserve this force.
