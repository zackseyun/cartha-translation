translation:
  language: en
  text: Righteous people were persecuted by the lawless. They were put in prison by those who had no respect for what is holy. Lawbreakers stoned them, and vile, unjust people killed them out of unbearable jealousy.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The righteous
  simplified_phrase: Righteous people
  preserved_meaning: The victims are identified as people who lived rightly.
  reasoning_layer_used: POB base text
  rationale: Adding “people” makes the description immediately clear without weakening its moral force.
- pob_phrase: they were imprisoned, but by the unholy
  simplified_phrase: They were put in prison by those who had no respect for what is holy
  preserved_meaning: Their captors are portrayed as irreverent toward what is sacred.
  reasoning_layer_used: POB base text and Greek source
  rationale: The abstract label “the unholy” is unpacked in natural modern English.
- pob_phrase: they were stoned by transgressors
  simplified_phrase: Lawbreakers stoned them
  preserved_meaning: Those who stoned the righteous were active violators of the law.
  reasoning_layer_used: applied lexical revision
  rationale: “Lawbreakers” clearly preserves the audited correction from the misleading “outlawed.”
translation_notes:
  risk_flags:
  - risk: “Those who had no respect for what is holy” explains rather than formally reproduces “the unholy.”
    mitigation: The wording retains the source contrast between righteous victims and irreverent captors.
  - risk: Breaking the parallel clauses into separate sentences may soften their rhetorical rhythm.
    mitigation: Repeated subjects and active labels preserve the accumulating contrast and force.
