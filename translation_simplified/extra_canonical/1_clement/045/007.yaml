    changes_summary: Changed 'shut up' to 'cast down' for better lexical fit with κατείρχθησαν, and added 'the' before 'champion and defender' for more natural formal English. Kept the rest substantially unchanged.
translation:
  language: en
  text: Or were Hananiah, Azariah, and Mishael thrown into a blazing furnace by people who practiced the magnificent and glorious worship of the Most High? Certainly not! Then who did this? Hateful people, full of every kind of evil, became so furious that they cruelly mistreated those who served God with holy and blameless intentions. They did not know that the Most High is the champion and defender of those who worship his name of perfect goodness with a pure conscience. To him be glory forever and ever. Amen.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: cast down into a furnace of fire
  simplified_phrase: thrown into a blazing furnace
  preserved_meaning: The three men were forcibly put into the fiery furnace.
  reasoning_layer_used: POB translation, recorded alternative, and grounding review
  rationale: “Thrown into” clearly preserves the POB's forceful movement into the furnace.
- pob_phrase: practiced the magnificent and glorious religion of the Most High
  simplified_phrase: practiced the magnificent and glorious worship of the Most High
  preserved_meaning: The question concerns people devoted to worshiping the Most High.
  reasoning_layer_used: immediate context and grounding review
  rationale: “Worship” avoids the modern sense of religion as merely an abstract system.
- pob_phrase: were stirred up to such a pitch of wrath that they subjected to abuse
  simplified_phrase: became so furious that they cruelly mistreated
  preserved_meaning: Their extreme anger drove them to abuse God's servants.
  reasoning_layer_used: POB translation and immediate context
  rationale: The direct wording makes both their intense anger and abusive conduct clear.
translation_notes:
  risk_flags:
  - risk: The audit trail conflicts over whether the Greek verb describes confinement or movement into the furnace.
    mitigation: The main text follows the controlling POB and its recorded alternative by using “thrown into.”
  - risk: “Name of perfect goodness” is less formally close to “all-virtuous name.”
    mitigation: It preserves the claim that God's name embodies complete moral excellence in common English.
