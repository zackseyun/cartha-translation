  reasoning_layer_used: POB translation and revision history
  rationale: The rewrite expresses the ordered timing and service in ordinary English.
- pob_phrase: without fail provide their breasts for the life of men
  simplified_phrase: never fail to offer their breasts to sustain human life
  preserved_meaning: The springs reliably nourish human life while retaining the maternal image.
  reasoning_layer_used: POB revision rationale and Greek source image
  rationale: The wording clarifies the purpose of the springs without removing the breast metaphor.
- pob_phrase: hold their gatherings
  simplified_phrase: gather together
  preserved_meaning: The smallest creatures assemble peacefully and harmoniously.
  reasoning_layer_used: POB translation and grammatical revision
  rationale: The simpler verb keeps the coordinated example without adding emphasis such as “even.”
