source:
  edition: Funk 1901 (normalized OCR)
  text: τὸ χύτος τῆς ἀπείρου θαλάσσης κατὰ τὴν δημιουργίαν αὐτοῦ συσταθὲν εἰς τὰς συναγωγὰς οὐ παρεκβαίνει τὰ περιτεθειμένα αὐτῇ χείλη, ἀλλὰ καθὼς διετάξεν αὐτῇ, οὕτως ποιεῖ.
  language: Greek
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/1_clement/020/006.yaml
  text: The mass of the boundless sea[a], gathered together according to his creation into its basins, does not pass beyond the bounds set around it, but as he commanded it, so it does.
  footnotes:
  - marker: a
    text: Or 'The basin'.
    reason: previous_rendering
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T11:34:06Z'
    unchanged: false
    changes_summary: Revised 'by his workmanship' to 'according to his creation' for closer lexical alignment with δημιουργία; changed 'reservoirs' to 'basins' for συναγωγαί; changed 'barriers' to 'bounds' for a more natural rendering of the set limits; and changed 'ordered' to 'commanded' for διετάξεν.
translation:
  language: en
  text: The immense waters of the sea were gathered into their basins according to his created order. They do not go beyond the limits he set for them, but do as he commanded.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The mass of the boundless sea
  simplified_phrase: The immense waters of the sea
  preserved_meaning: This still refers to the vast volume of seawater, not its basin.
  reasoning_layer_used: applied revision and Greek source review
  rationale: “Immense waters” makes the physical mass of the sea clear in natural English.
- pob_phrase: gathered together according to his creation into its basins
  simplified_phrase: were gathered into their basins according to his created order
  preserved_meaning: The waters were gathered into basins in conformity with God's ordering of creation.
  reasoning_layer_used: POB base, latest revision pass, and grounding review
  rationale: “Created order” preserves the governing force of “according to” without the weak sense of merely being part of creation.
- pob_phrase: does not pass beyond the bounds set around it, but as he commanded it, so it does
  simplified_phrase: They do not go beyond the limits he set for them, but do as he commanded
  preserved_meaning: The sea remains within its divinely appointed limits and obeys God's command.
  reasoning_layer_used: POB base translation
  rationale: Two direct clauses preserve the fixed-limit image while removing the formal construction.
translation_notes:
  risk_flags:
  - risk: The singular sea mass becomes the plural “waters.”
    mitigation: The plural naturally refers to the same collective volume of seawater.
  - risk: “Created order” makes the ordering sense of “creation” more explicit.
    mitigation: The review and following command clause support this bounded clarification.
