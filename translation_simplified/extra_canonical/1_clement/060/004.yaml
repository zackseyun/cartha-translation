translation:
  language: en
  text: Give harmony and peace to us and to everyone who lives on earth, just as you gave them to our ancestors when they called on you in holiness, faith, and truth. May we live in obedience to your almighty and perfectly good name and to our earthly rulers and leaders.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The grammar most likely refers to those now praying; another reading connects this obedience with their ancestors.
    reason: alternative_reading
