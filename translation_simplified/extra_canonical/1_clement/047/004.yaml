  preserved_meaning: Their earlier act of partiality was sinful, but less so than their present division.
  reasoning_layer_used: POB translation, immediate context, and grounding review
  rationale: This keeps the comparison focused on the earlier conduct rather than their personal status.
- pob_phrase: you inclined yourselves toward
  simplified_phrase: you sided with
  preserved_meaning: They gave their allegiance to particular leaders.
  reasoning_layer_used: POB translation and applied grammar revision
  rationale: The repeated wording preserves the link between their partiality and their alignment.
- pob_phrase: a man approved by them
  simplified_phrase: a man they had approved
  preserved_meaning: The apostles had recognized the man's proven standing.
  reasoning_layer_used: POB translation and applied lexical revision
  rationale: The active clause is clearer while retaining the result of testing expressed by “approved.”
translation_notes:
