translation:
  language: en
  text: The report has reached not only us but also those who are estranged from us. Because of your foolishness, even the Lord’s name is being insulted, and you are putting yourselves in danger.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: those who are estranged from us
  simplified_phrase: those who are estranged from us
  preserved_meaning: The wording identifies people separated from or differing with the believers without defining their identity or motives.
  reasoning_layer_used: POB text, preserved alternative, and grounding review
  rationale: Retaining the broad phrase avoids recasting them as definite outsiders or active opponents.
- pob_phrase: even blasphemies are brought upon the name of the Lord
  simplified_phrase: even the Lord’s name is being insulted
  preserved_meaning: The recipients’ foolishness results in dishonor directed at the Lord’s name, while the speaker remains unstated.
  reasoning_layer_used: source Greek, missing-nuance revision, and grounding review
  rationale: This natural passive wording keeps the emphatic “even” without naming an agent.
- pob_phrase: bring danger upon yourselves
  simplified_phrase: are putting yourselves in danger
  preserved_meaning: Their own conduct exposes them to danger.
  reasoning_layer_used: latest revision pass
  rationale: The common expression clearly preserves their responsibility for the danger.
translation_notes:
  risk_flags:
  - risk: “Insulted” is less technical than “blasphemies” and may sound somewhat less severe.
    mitigation: The wording clearly preserves dishonor directed at the Lord’s name while remaining accessible.
  - risk: “Estranged” may include either alienation or difference of mind.
    mitigation: The broad wording intentionally preserves the documented ambiguity rather than defining the group.
