    unchanged: false
    changes_summary: 'Replaced the colon with a semicolon for smoother formal English; changed ''Messiah'' to ''Christ'' for consistency with the Greek name-title order; rendered ψυχή as ''life'' rather than ''soul'' in this sacrificial context for more natural and contextually fitting English. [Regression fix applied: Messiah restored (revision_pass had changed Χριστός → Christ against DOCTRINE.md policy)]'
translation:
  language: en
  text: The Master welcomed us with love. Because of his love for us, Jesus Messiah our Lord gave his blood for us, as God willed—his flesh for our flesh and his life for our lives.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “his soul for our souls.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: In love the Master received us
  simplified_phrase: The Master welcomed us with love
  preserved_meaning: The Master accepted us in an act marked by love.
  reasoning_layer_used: POB base text and Greek source
  rationale: “Welcomed” expresses the relational sense of “received” in natural English.
- pob_phrase: because of the love that he had toward us
  simplified_phrase: Because of his love for us
  preserved_meaning: His love for us was the reason for his self-giving.
  reasoning_layer_used: POB base text
  rationale: The shorter wording removes an awkward relative clause without changing its cause.
- pob_phrase: by the will of God
  simplified_phrase: as God willed
  preserved_meaning: Jesus’ sacrifice took place according to God’s will.
  reasoning_layer_used: Greek source and POB base text
  rationale: The active wording is clearer while preserving God’s governing will.
translation_notes:
  risk_flags:
  - risk: “Life” may obscure the Greek symmetry between flesh and soul.
    mitigation: The footnote preserves “soul for our souls” as the documented lexical alternative.
  - risk: Breaking the sentence could weaken the link between welcome and sacrificial love.
    mitigation: The second sentence repeats love and immediately explains its self-giving expression.
