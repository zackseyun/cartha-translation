translation:
  language: en
  text: Love binds us to God. Love covers a great many sins. It bears everything and remains patient through everything. There is nothing crude or proud in love. Love causes no division and does not stir up rival groups. Love does everything in harmony. In love, all God's chosen people were made complete. Without love, nothing is pleasing to God.
