translation:
  language: en
  text: 'And again he says:


    “I saw an ungodly man raised very high, towering like the cedars of Lebanon. But when I passed by, look—he was gone. I searched for his place but could not find it. Hold on to innocence and pay attention to uprightness, because there is a remnant for a person of peace.”'
