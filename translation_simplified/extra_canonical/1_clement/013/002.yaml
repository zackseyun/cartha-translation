translation:
  language: en
  text: 'For this is what he said: “Show mercy, and mercy will be shown to you. Forgive, and you will be forgiven. As you treat others, so you will be treated. Give, and you will receive. Judge, and you will be judged. Show kindness, and you will be treated kindly. Whatever measure you use will be used to measure you.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: For thus he said
  simplified_phrase: For this is what he said
  preserved_meaning: The words that follow are introduced as his saying and as support for the preceding context.
  reasoning_layer_used: POB translation and immediate syntax
  rationale: The rewrite replaces an unnatural English formula while retaining the connecting “For.”
- pob_phrase: As you do, so it will be done to you
  simplified_phrase: As you treat others, so you will be treated
  preserved_meaning: A person’s conduct toward people will be answered in the same way.
  reasoning_layer_used: Source parallelism and immediate context
  rationale: The wording makes the otherwise vague reciprocal action understandable.
- pob_phrase: With the measure by which you measure, it will be measured to you
  simplified_phrase: Whatever measure you use will be used to measure you
  preserved_meaning: The same standard a person applies will be applied to that person.
  reasoning_layer_used: POB concrete measure image
  rationale: The sentence is shortened without removing the source-language image of measuring.
interpretive_expansions:
- pob_phrase: As you do
  rendering: As you treat others
  claim: The doing refers to how the hearers act toward other people.
  evidence:
  - The surrounding commands concern mercy, forgiveness, giving, judgment, and kindness in reciprocal relationships.
  confidence: high
  alternatives_preserved:
  - The wording does not identify who repays the treatment.
