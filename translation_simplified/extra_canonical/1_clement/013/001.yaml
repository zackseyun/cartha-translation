base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/1_clement/013/001.yaml
  text: 'Let us therefore be humble, brothers, laying aside all arrogance and conceit and foolishness and fits of anger, and let us do what is written—for the Holy Spirit says: “Let not the wise man boast in his wisdom, nor the strong in his strength, nor the rich in his riches, but let the one who boasts boast in the Lord, to seek him and to do judgment and righteousness”—especially remembering the words of the Lord Jesus, which he spoke while teaching gentleness and patience.'
  footnotes:
  - marker: a
    text: Or '“Let not the wise man boast in his wisdom, nor the strong in his strength, nor the rich in his riches, but let the one who boasts boast in the Lord,” to seek him and to do judgment and righteousness—'.
    reason: previous_rendering
translation:
  language: en
  text: 'So then, brothers, let us humble ourselves. Let us put away all arrogance, conceit, foolishness, and angry outbursts, and let us obey what is written. For the Holy Spirit says: “The wise must not boast about their wisdom, the strong about their strength, or the rich about their riches. Instead, anyone who boasts should boast in the Lord—seeking him and doing what is just and right.”[a] Let us especially remember the words the Lord Jesus spoke when he taught gentleness and patience.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or the quotation may end after “boast in the Lord,” with “seeking him and doing what is just and right” attached to Clement’s surrounding exhortation.
    reason: alternative_reading
