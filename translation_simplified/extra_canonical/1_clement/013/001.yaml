  preserved_meaning: The community must choose humility and reject four harmful attitudes and behaviors.
  reasoning_layer_used: POB translation and Greek source payload
  rationale: Two direct sentences make the exhortation and its four rejected behaviors easy to follow.
- pob_phrase: let us do what is written
