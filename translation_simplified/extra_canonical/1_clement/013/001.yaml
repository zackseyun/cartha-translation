  preserved_meaning: Clement calls his readers to put the written command into practice.
  reasoning_layer_used: POB translation and immediate context
  rationale: “Obey” clearly expresses acting according to what Scripture says.
- pob_phrase: to seek him and to do judgment and righteousness
  simplified_phrase: seeking him and doing what is just and right
  preserved_meaning: The wording preserves both seeking the Lord and practicing justice and righteousness.
  reasoning_layer_used: POB translation, applied revision, and alternate punctuation footnote
  rationale: Plain adjectives clarify the abstract nouns while the footnote retains the possible alternate attachment.
translation_notes:
  risk_flags:
  - risk: The main text places “seeking him” and “doing what is just and right” inside the Holy Spirit’s quotation.
    mitigation: Footnote [a] preserves the documented alternative quotation boundary.
  - risk: “Doing what is just and right” does not retain the biblical nouns “judgment and righteousness.”
    mitigation: The rendering keeps their two distinct moral qualities in clear everyday English.
