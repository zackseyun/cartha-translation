    changes_summary: Changed 'an adulterer' to 'adulterers' to reflect the generic singular μοιχοῦ in natural English, and revised 'Seated' to 'Sitting' and 'the son of your mother' to 'your mother's son' for more natural formal English while preserving the source sense.
translation:
  language: en
  text: But you hated correction and threw my words behind you. If you saw a thief, you joined him, and you took your place among adulterers. Your mouth overflowed with evil, and your tongue wove deceit. You sat slandering your brother and putting a stumbling block in the way of your own mother’s son.
