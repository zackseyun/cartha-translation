translation:
  language: en
  text: 'But how will this happen, dear friends? It will happen if we faithfully keep our minds firmly focused on God, seek what pleases him and has his approval, do what is fitting for his blameless will, and follow the way of truth. We must rid ourselves of every kind of unrighteousness and wickedness: greed, conflict, malice, deceit, secret gossip, slander, hatred of God, pride, arrogance, the pursuit of empty glory, and failure to welcome others.'
  philosophy: optimal-equivalence
