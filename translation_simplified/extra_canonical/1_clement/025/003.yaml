  text: But as its flesh decays, a worm comes into being. It feeds on the moisture of the dead creature and grows wings. When it has grown strong, it lifts the nest containing the bones of the creature that came before it. Carrying them, it travels from Arabia to Egypt, to the city called Heliopolis.
