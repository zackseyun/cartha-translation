translation:
  language: en
  text: 'For all the priests and Levites who serve at God’s altar come from him. The Lord Jesus also came from him in his human ancestry. Kings, rulers, and leaders came from him through Judah. His other scepters[a] also possess great honor, just as God promised: “Your descendants will be like the stars of heaven.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “scepters,” an image of authority that may refer to the other tribal lines descended from him.
    reason: cultural_note
