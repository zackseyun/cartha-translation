    unchanged: false
    changes_summary: Adjusted 'through ourselves' to 'by ourselves' for more natural rendering of δι’ ἑαυτῶν; changed 'accomplished' to 'done' for simpler, more natural English; changed 'justified' to 'has justified' to better reflect the Greek perfective sense in context.
translation:
  language: en
  text: So we too were called by his will in Christ Jesus. We are not made right with God by ourselves—not by our own wisdom, understanding, godliness, or works we have done with holy hearts. Instead, we are made right with God through faith. Through faith, Almighty God has made right with himself all who have been from the beginning. To him be glory forever and ever. Amen.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: having been called through his will in Christ Jesus
  simplified_phrase: were called by his will in Christ Jesus
  preserved_meaning: Our calling comes by God's will and is grounded in Christ Jesus.
  reasoning_layer_used: POB translation and approved lexical revision
  rationale: The finite clause removes an awkward participle while retaining the approved title “Christ Jesus.”
- pob_phrase: are not justified by ourselves, nor by our own wisdom or understanding or godliness or works
  simplified_phrase: are not made right with God by ourselves—not by our own wisdom, understanding, godliness, or works
  preserved_meaning: Neither personal qualities nor good works are the basis on which God justifies us.
  reasoning_layer_used: POB controlling text and Greek clause structure
  rationale: The rewrite explains “justified” in common English while preserving each part of Clement's contrast.
- pob_phrase: works that we have done in holiness of heart
  simplified_phrase: works we have done with holy hearts
  preserved_meaning: The works were done from inward holiness.
  reasoning_layer_used: POB controlling text
  rationale: The abstract phrase becomes natural English without removing its inward moral sense.
interpretive_expansions:
- pob_phrase: justified
  rendering: made right with God
  claim: Justification here refers to God making people right with himself.
  evidence:
  - Almighty God is explicitly the one who justifies.
  - The contrast with human wisdom, godliness, and works concerns the basis of divine acceptance.
  confidence: high
  alternatives_preserved:
  - justified
  - declared right by God
translation_notes:
  risk_flags:
  - risk: “Made right with God” is broader than the technical term “justified.”
    mitigation: The text keeps God as the actor and faith rather than human qualities or works as the means.
  - risk: “All who have been from the beginning” remains compressed and may be read universally.
    mitigation: The wording preserves the POB's ambiguity and keeps the clause within the argument about justification through faith.
