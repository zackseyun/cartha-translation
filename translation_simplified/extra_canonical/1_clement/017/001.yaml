translation:
  language: en
  text: Let us follow the example of those who traveled about wearing goatskins and sheepskins and announced that Christ[a] was coming. We mean the prophets Elijah, Elisha, and Ezekiel, as well as others who were commended.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the Messiah.”
    reason: lexical_alternative
  - marker: b
    text: Or “who received favorable testimony.”
    reason: lexical_alternative
