    unchanged: false
    changes_summary: Changed 'by their plagues' to 'through their plagues' for closer correspondence to repeated διὰ; changed 'an oracle' to 'a divine message' for more natural rendering of χρηματισμός; changed 'But I am' to 'For I am' to better reflect δέ in context.
translation:
  language: en
  text: Moses was called faithful in all God’s household. Through Moses’ service, God brought judgment on Egypt with plagues and torments. Yet even though Moses received great honor, he did not become arrogant. When God gave him a message at the bush, Moses said, “Who am I that you should send me? My voice is weak, and I speak with difficulty.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Moses was called faithful in all his house
  simplified_phrase: Moses was called faithful in all God’s household
  preserved_meaning: Moses was faithful throughout the household where he served God.
  reasoning_layer_used: Numbers 12:7 allusion and immediate context
  rationale: Naming God prevents readers from mistaking the household for Moses’ family.
- pob_phrase: through his service God judged Egypt through their plagues and torments
  simplified_phrase: Through Moses’ service, God brought judgment on Egypt with plagues and torments
  preserved_meaning: God used Moses’ service and the plagues to judge Egypt.
  reasoning_layer_used: POB text and latest revision pass
  rationale: Repeating Moses’ name clarifies the servant while preserving God as judge.
- pob_phrase: I am weak-voiced and slow of tongue
  simplified_phrase: My voice is weak, and I speak with difficulty
  preserved_meaning: Moses describes both his weak voice and his difficulty speaking.
  reasoning_layer_used: POB text and Greek source image
  rationale: Ordinary English preserves the two distinct descriptions of his speech.
interpretive_expansions:
- pob_phrase: in all his house
  rendering: in all God’s household
  claim: The household is God’s rather than Moses’ family.
  evidence:
  - The wording echoes Numbers 12:7, where Moses is faithful in God’s house.
  - The immediate context describes Moses’ commission and service to God.
  confidence: high
- pob_phrase: when a divine message was given to him at the bush
  rendering: When God gave him a message at the bush
  claim: God is the giver of the divine message.
  evidence:
  - The message commissions Moses, who addresses its sender as “you.”
  confidence: high
translation_notes:
  risk_flags:
  - risk: “God’s household” makes the allusive antecedent explicit rather than retaining the Greek pronoun.
    mitigation: Numbers 12:7 and the divine-service context strongly support this clarification.
