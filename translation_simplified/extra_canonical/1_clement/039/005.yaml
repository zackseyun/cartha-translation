translation:
  language: en
  text: Even the heavens are not pure in his sight. How much less are people who live in houses of clay and are themselves made from that same clay! He struck them like a moth. From morning until evening they are no more. Because they could not help themselves, they perished.
  philosophy: optimal-equivalence
