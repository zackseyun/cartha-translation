  text: 3. “So you will write two little booklets, and you will send one to Clement and one to Grapte. Then Clement will send it to the cities outside, for this has been entrusted to him; but Grapte will admonish the widows and the orphans. But you will read it aloud in this city with the elders who preside over the church.”
translation:
  language: en
  text: 3. “Write two small booklets. Send one to Clement and the other to Grapte. Clement will send it to the cities beyond this one, because he has been given this responsibility. Grapte will admonish the widows and orphans. But you are to read it aloud in this city with the elders who lead the church.”
