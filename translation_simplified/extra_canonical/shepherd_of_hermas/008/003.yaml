simplification_decisions:
- pob_phrase: So you will write two little booklets, and you will send one to Clement and one to Grapte
  simplified_phrase: Write two small booklets. Send one to Clement and the other to Grapte.
  preserved_meaning: Hermas must prepare two small writings and send them to the two named recipients.
  reasoning_layer_used: POB text and source context
  rationale: Direct commands and shorter sentences make the instructions easier to follow.
- pob_phrase: for this has been entrusted to him
  simplified_phrase: because he has been given this responsibility
  preserved_meaning: Clement is responsible for sending the writing beyond the city.
  reasoning_layer_used: POB text and cross-check agreement
  rationale: Common wording clearly expresses Clement’s entrusted duty.
- pob_phrase: the elders who preside over the church
  simplified_phrase: the elders who lead the church
  preserved_meaning: The elders hold a leading role in the church.
  reasoning_layer_used: POB text
  rationale: “Lead” expresses the function of “preside” in ordinary English.
translation_notes:
  risk_flags:
  - risk: The referent of “it” in the local reading instruction is not fully explicit.
    mitigation: The pronoun is retained rather than asserting that Hermas has a separate third copy.
  - risk: “Admonish” is less common modern English but carries more corrective force than “instruct.”
    mitigation: The term is retained to preserve the POB meaning without weakening Grapte’s assignment.
