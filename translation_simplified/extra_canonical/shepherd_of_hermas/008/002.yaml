  text: 2. Afterward I saw a vision in my house. The old woman came and asked me whether I had already given the book to the elders. I denied having given it. “You have done well,” she says; “for I have words to add. When, therefore, I complete all the words, through you they will be made known to all the elect.
translation:
  language: en
  text: 2. Later, while I was at home, I saw another vision. The old woman came and asked whether I had given the book to the elders yet. I told her I had not. She said, “You did well, because I still have words to add. When I have finished giving you all the words, you will make them known to all God’s chosen people.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Afterward I saw a vision in my house.
  simplified_phrase: Later, while I was at home, I saw another vision.
  preserved_meaning: The narrator later received a vision at home.
  reasoning_layer_used: POB text and immediate narrative context
  rationale: “At home” is more natural than “in my house,” and “another” marks the continuing series of visions.
- pob_phrase: I denied having given it.
  simplified_phrase: I told her I had not.
  preserved_meaning: He answered that he had not given the book to the elders.
  reasoning_layer_used: POB text
  rationale: The direct response avoids the potentially misleading modern sense of “denied.”
- pob_phrase: through you they will be made known to all the elect
  simplified_phrase: you will make them known to all God’s chosen people
  preserved_meaning: He will communicate the completed words to the whole community described as the elect.
  reasoning_layer_used: POB text
  rationale: “God’s chosen people” clearly expresses the biblical sense of “the elect.”
interpretive_expansions:
- pob_phrase: all the elect
  rendering: all God’s chosen people
  claim: The elect are people chosen by God.
  evidence:
  - The established biblical sense of “the elect” implies God as the one who chooses.
  confidence: high
  alternatives_preserved:
  - all the elect
  - all the chosen
translation_notes:
  risk_flags:
  - risk: “Another vision” makes the sequence explicit beyond the bare word “vision.”
    mitigation: The work’s Vision 2 setting and “Later” strongly establish that this vision follows earlier visions.
