  text: 'And it was revealed to me, brothers, while I was asleep, by a very handsome young man who said to me: “The old woman, from whom you received the little book—who do you think she is?” I said, “The Sibyl.” “You are mistaken,” he says; “she is not.” “Then who is she?” I say. “The Church,” he says. I said to him, “Why then is she old?” “Because,” he says, “she was created first of all; for this reason she is old, and for her sake the world was formed.”'
translation:
  language: en
  text: 'Brothers, while I was asleep, I received a revelation. A very handsome young man asked me, “Who do you think the old woman is—the one who gave you the little book?”


    “The Sibyl,” I answered.


    “You are mistaken,” he said. “She is not the Sibyl.”


    “Then who is she?” I asked.


    “The Church,” he replied.


    “Why, then, is she old?” I asked.


    “Because she was created before everything else,” he said. “That is why she is old, and the world was formed for her sake.”'
  philosophy: optimal-equivalence
