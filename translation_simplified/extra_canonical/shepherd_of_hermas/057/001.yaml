  text: I say to him, "Lord, explain this to me further." He says, "What are you seeking?" I say, "Then, Lord, are those who indulge themselves and are deceived tormented for the same length of time as the time of the deception? For the time of deception is one hour, but the hour of torment has the force of thirty days. Therefore, if someone indulges himself for one day and is deceived, and is tormented for one day, the day of torment amounts to a whole year. So then, for as many days as a person indulges himself, for that many years he is tormented." "You see then," he says, "that the time of indulgence and deception is very short, but the time of punishment and torment is long."
translation:
  language: en
  text: 'I said to him, “Lord, explain this more fully to me.”


    He asked, “What do you want to know?”


    I said, “Then, Lord, are those who give themselves over to pleasure and are deceived tormented for the same amount of time as their deception? The time of deception is one hour, but one hour of torment counts as thirty days. So if someone gives himself over to pleasure for one day, is deceived, and is tormented for one day, that one day of torment counts as a whole year. Therefore, for every day a person gives himself over to pleasure, that person is tormented for a year.”


    He said, “You see, then, that the time of pleasure and deception is very short, but the time of punishment and torment is long.”'
  philosophy: optimal-equivalence
