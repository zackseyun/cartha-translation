- pob_phrase: What are you seeking?
  simplified_phrase: What do you want to know?
  preserved_meaning: He asks what further explanation the speaker wants.
  reasoning_layer_used: Immediate dialogue context
  rationale: The plain question naturally expresses a request for understanding.
- pob_phrase: those who indulge themselves
  simplified_phrase: those who give themselves over to pleasure
  preserved_meaning: They yield themselves to self-indulgent pleasure rather than merely enjoying ordinary pleasure.
  reasoning_layer_used: POB controlling translation and grounding review
  rationale: This wording preserves the negative, deliberate force without suggesting that all enjoyment is wrong.
- pob_phrase: the day of torment amounts to a whole year
  simplified_phrase: that one day of torment counts as a whole year
  preserved_meaning: The passage equates one day of torment with a full year in its calculation.
  reasoning_layer_used: POB numerical explanation
  rationale: “Counts as” makes the unusual proportion easier to follow.
