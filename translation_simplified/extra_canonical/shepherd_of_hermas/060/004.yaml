  yaml_path: translation/extra_canonical/shepherd_of_hermas/060/004.yaml
  text: The angel who had given the rods to the people again demanded them back from them; and as they had received them, so too they were called to him, and each one returned the rods. The angel of the Lord took them and examined them.
translation:
  language: en
  text: The angel who had given the people the rods required them to return them. The people were called to him in the same way they had received the rods, and each person returned a rod. Then the angel of the Lord took the rods and examined them.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: again demanded them back from them
  simplified_phrase: required them to return them
  preserved_meaning: The angel required the people to give back the rods he had given them.
  reasoning_layer_used: POB translation and independent grounding review
  rationale: This removes repetition without weakening the demand into a request.
- pob_phrase: as they had received them, so too they were called to him
  simplified_phrase: were called to him in the same way they had received the rods
  preserved_meaning: Their summons corresponded in some way to how they had received the rods.
  reasoning_layer_used: POB source-driven clause relationship and ambiguity audit
  rationale: This clarifies the correspondence without limiting it to a strict sequence.
- pob_phrase: each one returned the rods
  simplified_phrase: each person returned a rod
  preserved_meaning: Every person gave back the rod entrusted to that person.
  reasoning_layer_used: Immediate narrative context
  rationale: The distributive singular avoids implying that each person held several rods.
translation_notes:
  risk_flags:
  - risk: “In the same way” leaves the exact nature of the correspondence unspecified.
    mitigation: This preserves the POB's broader wording rather than imposing a strict order.
