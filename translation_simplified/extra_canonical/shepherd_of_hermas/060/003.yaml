  text: After all had received the rods, the angel laid aside the sickle, and that tree was sound, just as I had seen it before. I marveled within myself, saying, How is the tree sound, with so many branches cut off? The shepherd says to me, Do not marvel that the tree remained sound though so many branches were cut off. But wait until you see everything, and it will be shown to you what it is.
translation:
  language: en
  text: 'After everyone had received a rod, the angel put down the sickle. The tree was still healthy, just as it had been when I first saw it. I wondered, “How can the tree still be healthy after so many branches have been cut off?”


    The shepherd said to me, “Do not be amazed that the tree remained healthy even though so many branches were cut off. Wait until you have seen everything. Then you will be shown what all this means.”'
