  text: And an angel of the Lord—exceedingly glorious and very tall—was standing beside the willow, holding a great sickle, and he was cutting off branches from the willow and handing them to the people who were being sheltered by the willow; and he kept giving them little rods, about a cubit long.
translation:
  language: en
  text: A very tall and exceptionally glorious angel of the Lord stood beside the willow tree, holding a large sickle. He cut branches from the willow and handed them to the people who were taking shelter under it. He kept giving them small rods about half a meter long.[a]
  philosophy: optimal-equivalence
