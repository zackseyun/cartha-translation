  yaml_path: translation/extra_canonical/shepherd_of_hermas/060/005.yaml
  text: From some he received the rods dry and eaten as if by a moth; the angel ordered those who had handed in such rods to stand apart. Others handed in dry rods, but they had not been eaten by a moth; these too he ordered to stand apart. Others handed in rods half-dry; and these stood apart. Others handed in their rods half-dry and having splits; and these stood apart. Others handed in their rods green and having splits; and these stood apart. Others handed in their rods half dry and half green; and these stood apart. Others presented their rods with two parts of the rod green and the third part dry; and these stood apart. Others handed in two parts dry and the third part green; and these stood apart. Others handed in their rods almost entirely green, but a very little of their rods was dry—at the very tip; and they had splits in them; and these stood apart.
translation:
  language: en
  text: 'Some people handed in rods that were dry and looked as though moths had eaten them. The angel told these people to stand apart. He also told each of the following groups to stand apart: those whose rods were dry but not moth-eaten; half dry; half dry and split; green and split; half dry and half green; two-thirds green and one-third dry; two-thirds dry and one-third green; and almost entirely green, with only the very tip dry, but also split.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: From some he received the rods dry and eaten as if by a moth
  simplified_phrase: Some people handed in rods that were dry and looked as though moths had eaten them
  preserved_meaning: The rods were dry and appeared moth-eaten without asserting that moths caused the damage.
  reasoning_layer_used: POB translation and source image
  rationale: The active wording is easier to follow while preserving the comparison to moth damage.
- pob_phrase: Others handed in ... and these stood apart
  simplified_phrase: He also told each of the following groups to stand apart
  preserved_meaning: The angel instructed every separately listed group to stand apart.
  reasoning_layer_used: POB action and paragraph structure
  rationale: One framing clause reduces repetition without changing the angel's order into a physical act.
- pob_phrase: two parts ... and the third part
  simplified_phrase: two-thirds ... and one-third
  preserved_meaning: The proportions of green and dry portions remain unchanged.
  reasoning_layer_used: POB quantitative description
  rationale: Modern fractions express the same proportions more directly.
translation_notes:
  risk_flags:
  - risk: Compressing the repeated actions could make the groups seem less distinct.
    mitigation: Each rod condition remains a separate item governed by the angel's instruction.
