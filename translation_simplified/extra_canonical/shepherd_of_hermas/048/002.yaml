translation_notes:
  risk_flags:
  - risk: “Confession” may suggest only admitting sin, though its precise sense here is not explained in the POB record.
    mitigation: The term is retained rather than narrowed, and the uncertain wording is noted.
  - risk: Naming the needy person resolves a grammatically possible pronoun ambiguity.
    mitigation: The immediate context supports the needy person as the one whose life is sustained.
