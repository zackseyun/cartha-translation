  text: '‘How so, sir?’ I say. ‘Make it known to me.’ ‘Listen,’ he says: ‘The rich man has much money, but toward the Lord he is poor, being distracted about his wealth, and he has very little confession and intercession toward the Lord; and what he has is small and feeble, and has no power to go up above. When, therefore, the rich man goes to the needy and supplies him with what is necessary, believing that what he does for the needy he will be able to find as his reward from God—for the needy is rich in intercession [and in confession], and his intercession has great power with God—the rich man supplies the needy with everything without hesitation. And the needy, being supplied by the rich, intercedes for him, giving thanks to God on behalf of the one who gives to him. And that one is still more eager concerning the needy, so that he may be unceasing in his life; for he knows that the intercession of the needy is acceptable and rich before God. Therefore both complete the work: the needy
    performs the intercession in which he is rich, [which he received from the Lord;] this he renders to the Lord for the one who supplies him. And likewise the rich man without hesitation provides to the needy the wealth which he received from the Lord. And this is a great work and acceptable with God, because he understood concerning his wealth and worked for the needy out of the gifts of the Lord and fulfilled the Lord’s ministry rightly. Therefore, among people the elm seems not to bear fruit; and they do not know nor understand that, if there should be a drought, the elm, having water, nourishes the vine, and the vine, having unceasing water, gives double fruit, both for itself and for the elm. In the same way also the needy, interceding with the Lord on behalf of the rich...'
translation:
  language: en
  text: '“How is that so, sir?” I ask. “Explain it to me.”


    “Listen,” he says. “A rich man has plenty of money, but he is poor in what concerns the Lord. His wealth distracts him, so he offers very little confession before God or prayer for others. What he does offer is weak and has no power to rise to God.


    “But when the rich man helps a needy person and provides what he needs, he believes that God will reward him for it. The needy person is rich in prayer for others and in confession before God,[a] and his prayer has great power with God. So the rich man provides everything the needy person requires, without hesitation. In return, the needy person prays for him and thanks God for the one who helped him. Then the rich man becomes even more eager to care for the needy person, so that the needy person can continue living, because he knows that the needy person’s prayer is rich and acceptable before God.


    “In this way, together they complete the work. The needy person offers the prayer in which he is rich—something he received from the Lord—and presents it to the Lord for the person who supports him. Likewise, the rich man freely shares with the needy person the wealth he received from the Lord. This is a great work that pleases God, because the rich man understood how he should use his wealth. He used the Lord’s gifts to help the needy and faithfully carried out the Lord’s service.


    “To people, the elm appears to bear no fruit. But they do not know or understand that during a drought, when the elm has water, it nourishes the vine. Because the vine has a constant supply of water, it produces twice the fruit—fruit for itself and for the elm. In the same way, when needy people pray to the Lord for the rich...”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The POB marks “and in confession” here and “which he received from the Lord” later as textually uncertain.
    reason: textual_variant
simplification_decisions:
- pob_phrase: toward the Lord he is poor, being distracted about his wealth
  simplified_phrase: he is poor in what concerns the Lord. His wealth distracts him
  preserved_meaning: Material abundance can coexist with poverty toward God because wealth diverts his attention.
  reasoning_layer_used: POB translation and immediate context
  rationale: Two direct sentences clarify the contrast and its cause.
- pob_phrase: both complete the work
  simplified_phrase: together they complete the work
  preserved_meaning: The rich and needy bring one shared work to completion through complementary acts.
  reasoning_layer_used: POB translation and following explanation
  rationale: This keeps the force of completion while making their cooperation clear.
- pob_phrase: the elm, having water, nourishes the vine
  simplified_phrase: when the elm has water, it nourishes the vine
  preserved_meaning: The apparently fruitless elm sustains the fruitful vine during drought.
  reasoning_layer_used: POB source image and immediate analogy
  rationale: The image is clear without adding a mechanism for obtaining water.
