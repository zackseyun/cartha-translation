  text: For to this end the Master has made you rich, that you might carry out these ministries for him; it is far better to buy such fields [and estates] and houses, which you will find in your city when you arrive in it. This luxury is good and cheerful, having no grief nor fear, but having joy. So do not practice the luxury of the nations; for it is unprofitable for you, the slaves of God. Rather practice your own luxury, in which you are able to rejoice. For all luxury of this kind is profitable. But the luxury of the nations is bitter and harsh. This parable, then, is set before the slaves of God, for the poor and the rich.
translation:
  language: en
  text: 'The Master made you rich for this purpose: to carry out these services for him. It is far better to buy fields, estates, and houses like these. You will find them in your city when you arrive there. This kind of luxury is good and joyful. It brings no sorrow or fear, but joy.


    So do not practice the luxury of the nations. It does no good for you, who are God’s servants. Instead, practice your own kind of luxury, in which you can rejoice. Every luxury of this kind is beneficial. But the luxury of the nations is bitter and harsh.


    This parable, then, is for all God’s servants, both poor and rich.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: to this end the Master has made you rich, that you might carry out these ministries for him
  simplified_phrase: 'The Master made you rich for this purpose: to carry out these services for him.'
  preserved_meaning: The Master gave wealth so it could be used in service to him.
  reasoning_layer_used: POB translation and immediate context
  rationale: “Services” makes the purpose clear without the vagueness of “doing these things.”
- pob_phrase: it is far better to buy such fields [and estates] and houses, which you will find in your city when you arrive in it
  simplified_phrase: It is far better to buy fields, estates, and houses like these. You will find them in your city when you arrive there.
  preserved_meaning: The preferable purchases are pictured as property awaiting readers in their city.
  reasoning_layer_used: POB translation and bracketed wording
  rationale: Two sentences clarify the image while leaving the identity of the city unresolved.
- pob_phrase: Rather practice your own luxury, in which you are able to rejoice. For all luxury of this kind is profitable.
  simplified_phrase: Instead, practice your own kind of luxury, in which you can rejoice. Every luxury of this kind is beneficial.
  preserved_meaning: God’s people should choose the kind of luxury that brings joy and benefit.
  reasoning_layer_used: POB paragraph-level contrast
  rationale: The wording preserves two contrasting kinds of luxury without limiting the positive kind to present possessions.
translation_notes:
  risk_flags:
  - risk: “Your city” may suggest a heavenly destination, but the POB does not identify it explicitly.
    mitigation: The city image is retained without calling it the readers’ own city or explaining its identity.
  - risk: “God’s slaves” is difficult modern wording but expresses strong belonging and obligation.
    mitigation: The source-driven image is retained rather than weakened to “servants.”
