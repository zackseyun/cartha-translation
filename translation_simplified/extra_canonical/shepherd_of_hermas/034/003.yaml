  text: 3. But fear the works of the devil, for they are evil. So, by fearing the Lord, you will fear the works of the devil, and you will not do them, but will keep away from them.
translation:
  language: en
  text: 3. But fear the devil’s works, because they are evil. When you fear the Lord, you will also fear the devil’s works. You will not do them but will stay far away from them.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: fear the works of the devil, for they are evil
  simplified_phrase: fear the devil’s works, because they are evil
  preserved_meaning: The devil’s works themselves are evil and are the object of fear.
  reasoning_layer_used: POB translation and grounding review
  rationale: The wording is natural while retaining the object of fear identified by the review.
- pob_phrase: So, by fearing the Lord
  simplified_phrase: When you fear the Lord
  preserved_meaning: Fear of the Lord leads to fear of the devil’s works.
  reasoning_layer_used: POB translation and immediate context
  rationale: The recast states the relationship clearly without narrowing it to a hypothetical condition.
- pob_phrase: will keep away from them
  simplified_phrase: will stay far away from them
  preserved_meaning: The reader will actively avoid the devil’s works.
  reasoning_layer_used: POB translation
  rationale: Common wording preserves the force of deliberate separation.
translation_notes:
  risk_flags:
