  yaml_path: translation/extra_canonical/shepherd_of_hermas/034/001.yaml
  text: 1. “Fear,” he says, “the Lord, and keep his commandments. By keeping the commandments of God you will be powerful in every deed, and your conduct will be incomparable. For in fearing the Lord you will do everything well. This is the fear that you must have—and you will be saved.
translation:
  language: en
  text: 1. He says, “Fear the Lord and obey his commandments. When you obey God’s commandments, you will have strength in everything you do, and no one will surpass the way you live. If you fear the Lord, you will do everything well. This is the kind of fear you must have, and you will be saved.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: keep his commandments
  simplified_phrase: obey his commandments
  preserved_meaning: God’s commands are to be faithfully followed.
  reasoning_layer_used: POB main text
  rationale: “Obey” states the intended action more directly in common English.
- pob_phrase: you will be powerful in every deed
  simplified_phrase: you will have strength in everything you do
  preserved_meaning: Obedience gives the person power or strength for action.
  reasoning_layer_used: POB main text and source-driven controlling meaning
  rationale: The rewrite replaces an unnatural expression while retaining its promise of strength.
- pob_phrase: your conduct will be incomparable
  simplified_phrase: no one will surpass the way you live
  preserved_meaning: The person’s manner of life will be unsurpassed.
  reasoning_layer_used: POB main text
  rationale: The comparison is recast as a clear verbal statement.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “fear” only as terror.
    mitigation: The biblical command “fear the Lord” is retained because the POB gives no basis for narrowing it to reverence alone.
  - risk: “No one will surpass” may sound more explicitly comparative than “incomparable.”
    mitigation: It preserves the POB’s claim that such conduct is beyond comparison.
