  yaml_path: translation/extra_canonical/shepherd_of_hermas/034/004.yaml
  text: '4. Therefore there are two fears: if you wish to do what is evil, fear the Lord and you will not do it; and if, on the other hand, you wish to do what is good, fear the Lord and you will do it. Thus the fear of the Lord is strong and great and glorious. So fear the Lord, and you will live to him; and all who fear him, among those who keep his commandments, will live to God.'
translation:
  language: en
  text: 4. So fear works in two ways. If you want to do evil, fear the Lord, and you will not do it. If you want to do good, fear the Lord, and you will do it. Therefore, the fear of the Lord is powerful, great, and glorious. Fear the Lord, and you will live for him. Everyone who fears him and keeps his commandments will live for God.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: there are two fears
  simplified_phrase: fear works in two ways
  preserved_meaning: Fear of the Lord both restrains evil and leads to good.
  reasoning_layer_used: POB text and immediate contrast
  rationale: This avoids implying two different objects of fear while preserving the two effects described.
- pob_phrase: if, on the other hand, you wish to do what is good
  simplified_phrase: If you want to do good
  preserved_meaning: The second case contrasts choosing good with choosing evil.
  reasoning_layer_used: POB text
  rationale: The shorter clause states the same contrast in ordinary English.
- pob_phrase: you will live to him
  simplified_phrase: you will live for him
  preserved_meaning: The person's life is directed toward God.
  reasoning_layer_used: POB text
  rationale: “Live for him” clearly expresses the relational direction of the difficult phrase.
translation_notes:
  risk_flags:
  - risk: “Fear works in two ways” interprets “two fears” as two effects of fearing the Lord.
    mitigation: The following parallel clauses explicitly identify both effects.
  - risk: “Live for him” may sound more purpose-oriented than the unusual phrase “live to him.”
    mitigation: The wording retains the central idea of a life directed toward God.
