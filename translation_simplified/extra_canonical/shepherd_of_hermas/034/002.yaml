  text: 2. But do not fear the devil; for by fearing the Lord you will gain mastery over the devil, because there is no power in him. In one in whom there is no power, there is no fear; but in one in whom there is glorious power, there is also fear. For everyone who has power has fear, but the one who has no power is despised by all.
translation:
  language: en
  text: 2. But do not fear the devil. If you fear the Lord, you will overcome the devil, because the devil has no power. Someone with no power is not to be feared, but someone with glorious power is to be feared. Anyone who has power is feared, while everyone despises one who has none.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: by fearing the Lord you will gain mastery over the devil
  simplified_phrase: If you fear the Lord, you will overcome the devil
  preserved_meaning: Reverence for the Lord enables a person to prevail over the devil.
  reasoning_layer_used: POB translation and immediate argument
  rationale: “Overcome” expresses gaining mastery in familiar English.
- pob_phrase: In one in whom there is no power, there is no fear
  simplified_phrase: Someone with no power is not to be feared
  preserved_meaning: A powerless being gives no valid reason for fear.
  reasoning_layer_used: POB translation and parallel contrast
  rationale: The direct wording preserves the contrast while removing an awkward construction.
- pob_phrase: the one who has no power is despised by all
  simplified_phrase: everyone despises one who has none
  preserved_meaning: The powerless one is universally treated with contempt in this contrast.
  reasoning_layer_used: POB translation
  rationale: The repetition is shortened while retaining the force of “by all.”
interpretive_expansions:
- pob_phrase: in one in whom there is glorious power, there is also fear
  rendering: someone with glorious power is to be feared
  claim: Fear describes the response inspired by the powerful one, not fear felt by that person.
  evidence:
  - The clause contrasts with the powerless one who is not to be feared.
  - The paragraph commands fear of the Lord rather than fear of the devil.
  confidence: high
translation_notes:
  risk_flags:
  - risk: “The devil has no power” may sound like an unrestricted doctrinal claim.
    mitigation: The wording follows the controlling POB and remains within its contrast with the Lord’s glorious power.
