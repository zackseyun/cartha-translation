  text: 3. I say to him, “Sir, if they did such things as to embitter the glorious angel, what did I do?” “Otherwise,” he says, “they cannot be afflicted unless you, the head of the whole household, are afflicted; for when you are afflicted, of necessity they also will be afflicted, but if you stand firm, they cannot have any affliction.”
translation:
  language: en
  text: 3. I asked him, “Sir, if they did things that made the glorious angel bitter, what did I do?” He answered, “They cannot suffer unless you also suffer, because you are the head of the whole household. When you suffer, they must suffer too. But if you remain steadfast, they cannot suffer.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I say to him
  simplified_phrase: I asked him
  preserved_meaning: The speaker addresses the other person with a question.
  reasoning_layer_used: POB context and ordinary English discourse
  rationale: The quotation is a question, so “asked” is natural and accurate.
- pob_phrase: for when you are afflicted, of necessity they also will be afflicted
  simplified_phrase: When you suffer, they must suffer too
  preserved_meaning: The household members necessarily share his affliction.
  reasoning_layer_used: POB translation and immediate context
  rationale: The shorter sentence clearly preserves both shared suffering and necessity.
- pob_phrase: if you stand firm, they cannot have any affliction
  simplified_phrase: if you remain steadfast, they cannot suffer
  preserved_meaning: His steadfast endurance prevents the others from suffering.
  reasoning_layer_used: POB translation and immediate contrast
  rationale: “Remain steadfast” keeps the force of standing firm in clear English.
translation_notes:
  risk_flags:
  - risk: “Made the glorious angel bitter” may sound unusual in modern English.
    mitigation: The wording remains because it preserves POB’s image without adding a direction or specifying another emotion.
