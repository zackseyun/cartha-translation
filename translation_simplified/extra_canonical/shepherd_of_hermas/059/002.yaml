  text: 1. After a few days I saw him in the same field where I had also seen the shepherds, and he says to me, “What are you seeking?” “I am here, sir,” I say, “that you may command the shepherd, the punisher, to go out from my house, because he afflicts me greatly.” He says, “It is necessary for you to be afflicted; for thus the glorious angel has commanded concerning you, for he wants you to be tested.” “For what, sir,” I say, “have I done that was so evil, that I should be handed over to this angel?”
translation:
  language: en
  text: '1. A few days later, I saw him again in the same field where I had seen the shepherds. He asked me, “What are you looking for?”


    I answered, “Sir, I have come so that you may order the shepherd who punishes me to leave my house, because he is causing me great suffering.”


    He said, “You must suffer this way. The glorious angel has given this command concerning you because he wants you to be tested.”


    I asked, “Sir, what terrible thing have I done to be handed over to this angel?”'
  philosophy: optimal-equivalence
