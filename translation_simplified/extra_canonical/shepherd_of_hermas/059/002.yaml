- pob_phrase: After a few days I saw him in the same field where I had also seen the shepherds
  simplified_phrase: A few days later, I saw him again in the same field where I had seen the shepherds
  preserved_meaning: The encounter occurs shortly afterward at the previously mentioned field.
  reasoning_layer_used: POB base text and immediate narrative context
  rationale: Natural time and repetition wording makes the opening easier to follow.
- pob_phrase: command the shepherd, the punisher, to go out from my house
  simplified_phrase: order the shepherd who punishes me to leave my house
  preserved_meaning: Hermas asks for the punishing shepherd to be removed from his home.
  reasoning_layer_used: POB base text
  rationale: The appositional title and literal motion phrase are recast in ordinary English.
- pob_phrase: It is necessary for you to be afflicted
  simplified_phrase: You must suffer this way
  preserved_meaning: The suffering is presented as necessary under the angel’s command.
  reasoning_layer_used: POB base text and following causal clause
  rationale: The direct wording preserves both necessity and affliction without sounding academic.
