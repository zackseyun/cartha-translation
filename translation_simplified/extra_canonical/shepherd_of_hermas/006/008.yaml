  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/008.yaml
  text: For the Lord swore by his Son that those who denied their Lord are cut off from their life—those who are now about to deny him in the coming days; but to those who denied before, because of his great compassion, he became merciful.”
translation:
  language: en
  text: 'For the Lord made a solemn oath by his Son: “Those who are now about to deny their Lord in the coming days are cut off from their life.” But because his compassion is so great, he showed mercy to those who denied him before.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the Lord swore by his Son that
  simplified_phrase: the Lord made a solemn oath by his Son
  preserved_meaning: The Lord guarantees the declaration by invoking his Son in an oath.
  reasoning_layer_used: POB translation and source payload
  rationale: “Made a solemn oath” clearly conveys the gravity of “swore.”
- pob_phrase: are cut off from their life
  simplified_phrase: are cut off from their life
  preserved_meaning: Those nearing denial are excluded from life without defining whether that life is physical or eternal.
  reasoning_layer_used: POB controlling wording and independent grounding review
  rationale: Retaining the present tense and cutting-off image preserves the source-driven force and ambiguity.
- pob_phrase: to those who denied before ... he became merciful
  simplified_phrase: he showed mercy to those who denied him before
  preserved_meaning: Those whose denial occurred earlier received mercy from the Lord.
  reasoning_layer_used: POB translation
  rationale: The active expression is natural English and keeps the contrast with those now nearing denial.
translation_notes:
  risk_flags:
  - risk: “Their life” may remain unclear to modern readers.
    mitigation: It is retained because POB does not resolve the kind of life intended.
