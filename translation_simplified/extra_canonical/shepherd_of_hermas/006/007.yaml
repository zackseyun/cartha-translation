  text: Persevere, then, you who work righteousness, and do not be double‑minded, so that your passing may be with the holy angels. Blessed are you who endure the great tribulation that is coming, and who will not deny their life.
translation:
  language: en
  text: So persevere, you who do what is right. Do not be double-minded, so that when you leave this life, you may be with the holy angels. Blessed are you who endure the great suffering that is coming and who will not deny their life.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: you who work righteousness
  simplified_phrase: you who do what is right
  preserved_meaning: They actively practice righteous conduct.
  reasoning_layer_used: POB main text
  rationale: Common wording makes the moral action immediately clear.
- pob_phrase: so that your passing may be with the holy angels
  simplified_phrase: so that when you leave this life, you may be with the holy angels
  preserved_meaning: Their departure from earthly life may lead to being with the holy angels.
  reasoning_layer_used: POB main text and grounding review
  rationale: The sentence states the implied life transition without specifying its manner or timing.
- pob_phrase: the great tribulation that is coming
  simplified_phrase: the great suffering that is coming
  preserved_meaning: A severe future ordeal is approaching.
  reasoning_layer_used: POB main text
  rationale: Suffering clearly conveys the force of the less familiar word tribulation.
interpretive_expansions:
- pob_phrase: so that your passing may be with the holy angels
  rendering: so that when you leave this life, you may be with the holy angels
  claim: Passing refers to departure from this earthly life.
  evidence:
  - The POB connects the person’s passing with being among the holy angels.
  confidence: moderate
  alternatives_preserved:
  - The wording does not specify the manner or timing of the departure.
translation_notes:
  risk_flags:
  - risk: “Double-minded” may be unfamiliar and can refer broadly to inner division or instability.
    mitigation: The term is retained because the record does not support narrowing it to divided loyalty.
  - risk: “Deny their life” remains open to more than one interpretation.
    mitigation: The POB wording is retained rather than introducing a martyrdom or self-sacrifice meaning.
