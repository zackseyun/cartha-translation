  text: But make these words known to all your children and to your wife, who is to be your sister; for she too does not refrain from her tongue, by which she acts wickedly. But when she hears these words, she will refrain, and she will obtain mercy.
translation:
  language: en
  text: Tell these words to all your children and to your wife, who is to be like a sister to you. She too does not control her tongue and uses it to do wrong. But when she hears these words, she will control her tongue and receive mercy.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: make these words known to all your children and to your wife
  simplified_phrase: Tell these words to all your children and to your wife
  preserved_meaning: Hermas must communicate the message to all his children and his wife.
  reasoning_layer_used: POB translation and immediate context
  rationale: The direct verb “tell” expresses the command in ordinary English.
- pob_phrase: who is to be your sister
  simplified_phrase: who is to be like a sister to you
  preserved_meaning: His wife is to relate to him as a sister, though the practical implications remain unspecified.
  reasoning_layer_used: POB source-driven wording and grounding review
  rationale: The comparison avoids implying that she literally becomes his sister or that this status begins now.
- pob_phrase: does not refrain from her tongue, by which she acts wickedly
  simplified_phrase: does not control her tongue and uses it to do wrong
  preserved_meaning: Her wrongdoing involves uncontrolled speech.
  reasoning_layer_used: POB translation and source-language image
  rationale: This preserves the tongue image while clearly connecting it with wrongful speech.
translation_notes:
  risk_flags:
