  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/002.yaml
  text: “Your offspring, Hermas, have rejected God and blasphemed the Lord, and they have betrayed their parents in great wickedness, and they were heard as betrayers of parents; and though they betrayed them, they gained no advantage, but they added still to their sins licentious acts and mixtures of wickedness, and thus their lawless deeds were filled up.
translation:
  language: en
  text: “Your children, Hermas, have rejected God and blasphemed the Lord. In their great wickedness, they betrayed their parents and became known as betrayers of their own parents. Their betrayal gained them nothing. Instead, they added unrestrained behavior and mixtures of wickedness to their sins. In this way, their lawless deeds reached their full measure.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Your offspring
  simplified_phrase: Your children
  preserved_meaning: Hermas’s descendants are identified as his family members.
  reasoning_layer_used: POB base text and immediate context
  rationale: “Children” is the natural common-English term in this family setting.
- pob_phrase: they were heard as betrayers of parents
  simplified_phrase: became known as betrayers of their own parents
  preserved_meaning: They acquired a recognized reputation for betraying their parents.
  reasoning_layer_used: POB base text and cross-check review
  rationale: The wording clarifies the awkward passive without adding a legal or social setting.
- pob_phrase: licentious acts and mixtures of wickedness, and thus their lawless deeds were filled up
  simplified_phrase: unrestrained behavior and mixtures of wickedness ... their lawless deeds reached their full measure
  preserved_meaning: They added both licentious conduct and compounded wickedness until their wrongdoing was complete.
  reasoning_layer_used: POB base text, source-language images preserved by POB, and grounding review
  rationale: The revision clarifies “licentious” while retaining the distinct mixture and full-measure images.
translation_notes:
  risk_flags:
  - risk: “Unrestrained behavior” may not state a specifically sexual sense sometimes associated with “licentious acts.”
    mitigation: It preserves the core idea of uncontrolled conduct without asserting a narrower meaning absent from the supplied audit.
  - risk: “Became known” interprets the obscure phrase “were heard” as reputation.
    mitigation: The wording follows the approved contextual reading without specifying how or where they became known.
