  text: '"For this reason then," I say, "sir, I inquire of you carefully about everything: first, because I am a sinner; then, because I do not know by doing what works I shall live, for my sins are many and manifold."'
translation:
  language: en
  text: “That is why, sir,” I say, “I ask you so carefully about everything. First, because I am a sinner. Second, because I do not know what deeds I should do in order to live, since my sins are many and varied.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: For this reason then
  simplified_phrase: That is why
  preserved_meaning: His careful questioning follows from the preceding reason.
  reasoning_layer_used: POB translation and immediate discourse
  rationale: The common phrase keeps the same backward-looking connection.
- pob_phrase: first, because I am a sinner; then, because I do not know
  simplified_phrase: First, because I am a sinner. Second, because I do not know
  preserved_meaning: He gives two distinct reasons for asking careful questions.
  reasoning_layer_used: POB clause structure
  rationale: Two short sentences make the paired reasons easy to follow.
- pob_phrase: by doing what works I shall live
  simplified_phrase: what deeds I should do in order to live
  preserved_meaning: He asks which actions may lead to life without defining the kind of life meant.
  reasoning_layer_used: POB source-driven meaning and grounding review
  rationale: “Deeds” preserves the explicit works element while using natural English word order.
translation_notes:
  risk_flags:
  - risk: “To live” may be understood as merely surviving rather than life in a moral or spiritual sense.
    mitigation: The wording preserves POB’s open-ended meaning rather than adding an unsupported explanation.
