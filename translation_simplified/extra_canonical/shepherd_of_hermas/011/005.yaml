  text: 'I asked her, "Why has the tower been built upon the waters, lady?" She says, "I told you before also, and you inquire diligently; therefore, by inquiring, you find the truth. Why, then, the tower has been built upon the waters—listen: because your life was saved through water and will be saved. And the tower has been founded by the word of the almighty and glorious Name, and is held fast by the unseen power of the Master."'
translation:
  language: en
  text: 'I asked her, “Lady, why was the tower built on the waters?”


    She answered, “I told you before, and you keep asking carefully. By asking questions, you find the truth. So listen to why the tower was built on the waters: your life was saved through water and will be saved. The tower was founded by the word of the almighty and glorious Name, and the Master’s unseen power holds it firmly in place.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: you inquire diligently; therefore, by inquiring, you find the truth
  simplified_phrase: you keep asking carefully. By asking questions, you find the truth
  preserved_meaning: Persistent, careful inquiry leads to discovering the truth.
  reasoning_layer_used: POB translation and immediate discourse
  rationale: The participial repetition becomes two direct sentences while retaining the cause-and-result relationship.
- pob_phrase: Why, then, the tower has been built upon the waters—listen
  simplified_phrase: So listen to why the tower was built on the waters
  preserved_meaning: She calls for attention before explaining why water supports the tower.
  reasoning_layer_used: POB translation and source image
  rationale: Ordinary English word order clarifies the transition without weakening the water image.
- pob_phrase: is held fast by the unseen power of the Master
  simplified_phrase: the Master’s unseen power holds it firmly in place
  preserved_meaning: The Master’s invisible power keeps the tower secure.
  reasoning_layer_used: POB translation
  rationale: An active clause makes the same sustaining action easier to understand.
translation_notes:
  risk_flags:
  - risk: Readers may assume a specific doctrine from “saved through water.”
    mitigation: The wording preserves POB’s statement without adding a doctrinal explanation.
  - risk: The capitalized “Name” may be unfamiliar to new readers.
    mitigation: It remains because replacing this weighty title could obscure a key theological concept.
