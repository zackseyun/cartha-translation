  yaml_path: translation/extra_canonical/shepherd_of_hermas/011/003.yaml
  text: '"The tower that you see being built, I am the Church, the one shown to you both now and before. Whatever, therefore, you wish to ask about the tower, I will reveal to you, so that you may rejoice with the saints."'
translation:
  language: en
  text: “The tower you see being built is the Church. I am the Church who appeared to you now and before. So ask whatever you want to know about the tower. I will explain it to you, so that you may rejoice with the saints.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The tower that you see being built, I am the Church, the one shown to you both now and before.
  simplified_phrase: The tower you see being built is the Church. I am the Church who appeared to you now and before.
  preserved_meaning: The tower is directly identified as the Church, while the Church herself appeared now and previously.
  reasoning_layer_used: POB translation and grounding review
  rationale: Two sentences keep the tower identification distinct from the earlier and present appearances.
- pob_phrase: Whatever, therefore, you wish to ask about the tower
  simplified_phrase: So ask whatever you want to know about the tower.
  preserved_meaning: The speaker invites questions about the tower.
  reasoning_layer_used: POB translation
  rationale: The direct invitation replaces the dense clause with ordinary English.
- pob_phrase: I will reveal to you
  simplified_phrase: I will explain it to you
  preserved_meaning: The speaker promises to make the tower’s meaning known.
  reasoning_layer_used: POB translation and immediate context
  rationale: “Explain” clearly conveys disclosure in this question-and-answer setting.
translation_notes:
  risk_flags:
  - risk: Repeating “the Church” is less compact than the POB sentence.
    mitigation: The repetition prevents the tower image from being wrongly treated as the form of both appearances.
