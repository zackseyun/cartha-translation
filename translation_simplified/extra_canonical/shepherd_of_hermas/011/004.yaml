  text: I say to her, "Lady, since once for all you considered me worthy for everything to be revealed to me, reveal it." She says to me, "Whatever can be revealed to you will be revealed. Only let your heart be toward God, and do not be double-minded in whatever you see."
translation:
  language: en
  text: 'I said to her, “Lady, since you have already considered me worthy to receive all these revelations, please reveal everything to me.”


    She replied, “Everything that can be revealed to you will be revealed. Just keep your heart turned toward God, and do not let your mind be divided about anything you see.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: since once for all you considered me worthy for everything to be revealed to me
  simplified_phrase: since you have already considered me worthy to receive all these revelations
  preserved_meaning: She had already deemed Hermas worthy to receive the full revelation.
  reasoning_layer_used: POB translation and immediate context
  rationale: The recast removes the tangled passive structure while retaining the completed judgment and its purpose.
- pob_phrase: Only let your heart be toward God
  simplified_phrase: Just keep your heart turned toward God
  preserved_meaning: Hermas must remain inwardly directed toward God.
  reasoning_layer_used: POB source-driven imagery
  rationale: “Turned toward” clarifies the direction while preserving the heart image.
- pob_phrase: do not be double-minded in whatever you see
  simplified_phrase: do not let your mind be divided about anything you see
  preserved_meaning: Hermas must not be inwardly divided in response to anything he sees.
  reasoning_layer_used: POB translation and independent grounding review
  rationale: This explains double-mindedness without narrowing it specifically to doubt.
translation_notes:
  risk_flags:
  - risk: “Divided” may still require readers to infer wavering or inner conflict.
    mitigation: The wording preserves the broad divided-mind image rather than specifying doubt.
