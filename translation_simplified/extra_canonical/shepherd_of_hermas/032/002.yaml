  text: But if a quick temper comes on, at once the holy spirit—being tender—is cramped, not having a clean place, and it seeks to withdraw from that place; for it is choked by the evil spirit, not having room to minister to the Lord as it desires, being defiled by the quick temper. For in long-suffering the Lord dwells, but in quick temper the devil. Therefore, when both spirits dwell together in one, it is unprofitable and harmful to that person in whom they dwell.
translation:
  language: en
  text: But when a quick temper flares up, the tender holy spirit is immediately crowded. It no longer has a clean place to stay, so it tries to leave. The evil spirit chokes it, leaving it no room to serve the Lord as it desires, because the quick temper has made it unclean. The Lord dwells in patient endurance, but the devil dwells in a quick temper. So when both spirits live together in one person, they bring that person no benefit, but only harm.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: if a quick temper comes on
  simplified_phrase: when a quick temper flares up
  preserved_meaning: Sudden anger arises and begins to control the person.
  reasoning_layer_used: POB base text and immediate context
  rationale: “Flares up” expresses the sudden force of the quick temper in natural English.
- pob_phrase: being tender—is cramped, not having a clean place
  simplified_phrase: the tender holy spirit is immediately crowded. It no longer has a clean place to stay
  preserved_meaning: The holy spirit is tender and is deprived of clean inner space by anger.
  reasoning_layer_used: POB base text and source-language image as represented there
  rationale: Two short sentences clarify the thought while preserving the spatial image.
- pob_phrase: in long-suffering the Lord dwells
  simplified_phrase: The Lord dwells in patient endurance
  preserved_meaning: The Lord is present where steadfast patience governs.
  reasoning_layer_used: POB base text
  rationale: “Patient endurance” communicates the biblical force of long-suffering without archaic wording.
translation_notes:
  risk_flags:
  - risk: Readers may take the spirits’ being crowded and choked as a literal physical process.
    mitigation: The bodily images are retained because they carry the passage’s force, while the surrounding language identifies their moral setting.
  - risk: Saying the holy spirit is made unclean may sound theologically unusual.
    mitigation: The wording remains because the POB explicitly preserves this claim rather than smoothing it doctrinally.
