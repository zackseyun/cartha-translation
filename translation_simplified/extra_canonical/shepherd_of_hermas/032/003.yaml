  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/003.yaml
  text: 'For if, after taking a little wormwood, you pour it into a jar of honey, does not all the honey perish? So much honey is ruined by the smallest amount of wormwood: it destroys the sweetness of the honey, and it no longer has the same usefulness with its master, because it has been embittered and has lost its use. But if the wormwood is not cast into the honey, the honey is found sweet and becomes serviceable to its master.'
translation:
  language: en
  text: Suppose you pour even a little wormwood into a jar of honey. Does it not spoil all the honey? The smallest amount of wormwood ruins so much honey. It destroys the honey’s sweetness and makes it bitter, so it is no longer useful to its owner. But if no wormwood is put into the honey, the honey remains sweet and useful to its owner.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: For if, after taking a little wormwood, you pour it into a jar of honey
  simplified_phrase: Suppose you pour even a little wormwood into a jar of honey
  preserved_meaning: A very small amount of wormwood is introduced into a whole jar of honey.
  reasoning_layer_used: POB translation and immediate illustration
  rationale: The conditional setup is recast as a natural modern example without changing the image.
- pob_phrase: it no longer has the same usefulness with its master
  simplified_phrase: it is no longer useful to its owner
  preserved_meaning: The spoiled honey can no longer serve the person to whom it belongs.
  reasoning_layer_used: POB translation
  rationale: “Owner” clearly expresses the relationship intended by the awkward phrase “with its master.”
- pob_phrase: the honey is found sweet and becomes serviceable to its master
  simplified_phrase: the honey remains sweet and useful to its owner
  preserved_meaning: Honey untouched by wormwood keeps its sweetness and usefulness.
  reasoning_layer_used: POB translation and paragraph contrast
  rationale: The passive wording is simplified while preserving the contrast between spoiled and unspoiled honey.
translation_notes:
  risk_flags:
  - risk: Modern readers may not know that wormwood is intensely bitter.
    mitigation: The following sentence explicitly states that it destroys sweetness and makes the honey bitter.
