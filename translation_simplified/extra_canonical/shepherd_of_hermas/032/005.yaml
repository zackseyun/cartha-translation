  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/005.yaml
  text: Quick temper, for its part, is first foolish—flighty and senseless. Then from senselessness comes bitterness; from bitterness, anger; from anger, wrath; and from wrath, rage. Then rage—composed of so many evils—becomes a great and incurable sin.
translation:
  language: en
  text: A quick temper begins as foolishness—reckless and without good sense. This lack of sense leads to bitterness; bitterness leads to anger; anger leads to wrath; and wrath leads to rage. Rage, built from so many evils, then becomes a great sin that cannot be cured.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: is first foolish—flighty and senseless
  simplified_phrase: begins as foolishness—reckless and without good sense
  preserved_meaning: Quick temper begins in unstable, irrational foolishness.
  reasoning_layer_used: POB translation
  rationale: Common wording keeps all three qualities clear.
- pob_phrase: Then from senselessness comes bitterness; from bitterness, anger; from anger, wrath; and from wrath, rage.
  simplified_phrase: This lack of sense leads to bitterness; bitterness leads to anger; anger leads to wrath; and wrath leads to rage.
  preserved_meaning: Each evil develops into the next in the stated sequence.
  reasoning_layer_used: POB translation
  rationale: Repeated “leads to” makes the progression easy to follow.
- pob_phrase: rage—composed of so many evils—becomes a great and incurable sin
  simplified_phrase: Rage, built from so many evils, then becomes a great sin that cannot be cured
  preserved_meaning: Rage accumulates many evils and becomes a grave sin presented as beyond cure.
  reasoning_layer_used: POB translation and grounding review
  rationale: The revision preserves both the cumulative image and the absolute force of “incurable.”
translation_notes:
  risk_flags:
  - risk: “Cannot be cured” may be mistaken for a general doctrine that such sin cannot be forgiven.
    mitigation: The wording retains the passage’s moral-medical image without adding a claim about forgiveness.
