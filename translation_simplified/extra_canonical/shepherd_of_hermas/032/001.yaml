  text: “Be long-suffering,” he says, “and sensible, and you will gain mastery over all wicked deeds and do every work of righteousness. For if you are long-suffering, the holy spirit that dwells in you will be pure, not being darkened by another evil spirit; rather, dwelling in a wide space it will exult and rejoice with the vessel in which it dwells, and it will minister to God with much cheerfulness, having prosperity within itself.
translation:
  language: en
  text: “Be patient,” he says, “and use good judgment. Then you will overcome every wicked deed and do every righteous work. For if you are patient, the holy spirit living in you will be pure and will not be darkened by another evil spirit. Instead, it will live in a spacious place. It will celebrate and rejoice with the person in whom it lives, and it will serve God very gladly, enjoying well-being within itself.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Be long-suffering ... and sensible
  simplified_phrase: Be patient ... and use good judgment
  preserved_meaning: The distinct commands to endure patiently and exercise sound judgment are preserved.
  reasoning_layer_used: POB main text
  rationale: Common wording makes both qualities immediately understandable without merging them.
- pob_phrase: dwelling in a wide space it will exult and rejoice with the vessel in which it dwells
  simplified_phrase: it will live in a spacious place. It will celebrate and rejoice with the person in whom it lives
  preserved_meaning: The spacious-dwelling image and the human recipient as the spirit's dwelling place remain distinct.
  reasoning_layer_used: POB main text, source imagery, and grounding review
  rationale: The clause is divided for clarity while avoiding an overly specific reference to the body.
- pob_phrase: having prosperity within itself
  simplified_phrase: enjoying well-being within itself
  preserved_meaning: The spirit experiences a favorable inward condition rather than material prosperity.
  reasoning_layer_used: POB main text and grounding review
  rationale: Well-being conveys the broad positive state without adding the narrower idea of peace.
interpretive_expansions:
- pob_phrase: the vessel in which it dwells
  rendering: the person in whom it lives
  claim: The vessel refers to the human recipient in whom the spirit dwells without specifying only the physical body.
  evidence:
  - The immediate context says that the holy spirit dwells within the hearer.
  - POB's vessel image identifies the recipient as the spirit's dwelling place.
  confidence: high
  alternatives_preserved:
  - the human person as a whole
  - the person's body
translation_notes:
  risk_flags:
  - risk: Replacing “vessel” with “person” makes the metaphor less visible.
    mitigation: The indwelling language remains, while the broader reference is preserved rather than narrowed to the body.
  - risk: “Spacious place” may sound physically literal to a modern reader.
    mitigation: Its contrast with being darkened by an evil spirit preserves the image's positive spiritual force.
