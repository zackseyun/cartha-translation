  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/007.yaml
  text: Therefore keep away from quick temper—that most wicked spirit—but clothe yourself with long-suffering, and stand against quick temper and bitterness, and you will be found with the dignity that is beloved by the Lord. See to it, then, that you never neglect this command; for if you gain mastery over this command, you will also be able to keep the other commands that I am about to give you. Be strong in them and be empowered[—], and let all be empowered who wish to walk in them.”
translation:
  language: en
  text: So keep away from quick temper—that most wicked spirit. Instead, clothe yourself with patience, and resist quick temper and bitterness. Then you will be found to have the worthy character the Lord loves. Make sure you never neglect this command. If you master it, you will also be able to keep the other commands I am about to give you. Be strong in following them, and be given power to do so. May everyone who wants to live by them also be given power.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: clothe yourself with long-suffering
  simplified_phrase: clothe yourself with patience
  preserved_meaning: The clothing image and the call to enduring restraint remain intact.
  reasoning_layer_used: POB translation and source image
  rationale: “Patience” communicates the virtue more readily while retaining the concrete image.
- pob_phrase: you will be found with the dignity that is beloved by the Lord
  simplified_phrase: you will be found to have the worthy character the Lord loves
  preserved_meaning: The Lord approves the person's honorable moral quality.
  reasoning_layer_used: POB controlling meaning
  rationale: “Worthy character” makes the abstract sense of dignity clear in natural English.
- pob_phrase: walk in them
  simplified_phrase: live by them
  preserved_meaning: People are to order their lives according to the commands.
  reasoning_layer_used: POB idiom in immediate context
  rationale: The common expression states the force of the biblical walking metaphor plainly.
translation_notes:
  risk_flags:
  - risk: The phrase “most wicked spirit” may describe either a disposition or a personal spirit.
    mitigation: The wording is retained without resolving the documented grammatical ambiguity.
  - risk: The source of the power in the final appeal is not explicitly named.
    mitigation: The passive phrase “be given power” preserves that lack of specification.
