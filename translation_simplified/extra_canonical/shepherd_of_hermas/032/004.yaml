  text: You see, then, that long-suffering is sweeter than honey and is serviceable to the Lord, and he dwells in it; but quick temper is bitter and useless. If, therefore, quick temper is mixed with long-suffering, long-suffering is defiled and is no longer useful to God. Long-suffering at all times has nothing bitter within itself, remaining always gentle and quiet. This long-suffering, then, dwells with those who have the faith complete.
translation:
  language: en
  text: So you see that patient endurance is sweeter than honey. It is useful to the Lord, and he dwells in it. But a quick temper is bitter and useless. When a quick temper is mixed with patient endurance, it makes that endurance impure, so it is no longer useful to God. At all times, patient endurance has no bitterness in it. It always remains gentle and quiet, and it dwells with those whose faith is complete.
  philosophy: optimal-equivalence
