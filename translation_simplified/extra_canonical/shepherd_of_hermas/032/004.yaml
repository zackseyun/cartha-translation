  simplified_phrase: patient endurance
  preserved_meaning: It preserves steadfast patience under provocation or hardship.
  reasoning_layer_used: POB base text and immediate contrast
  rationale: The common phrase clarifies the virtue without weakening its sustained character.
- pob_phrase: quick temper
  simplified_phrase: a quick temper
  preserved_meaning: It retains the image of anger that rises quickly and corrupts patience.
  reasoning_layer_used: POB base text and repeated contrast
  rationale: The familiar wording preserves the contrast in natural English.
- pob_phrase: long-suffering is defiled
  simplified_phrase: it makes that endurance impure
  preserved_meaning: Quick temper contaminates the patient endurance that is useful to God.
  reasoning_layer_used: POB base text and immediate consequence
  rationale: The active wording identifies the cause while preserving the impurity image.
translation_notes:
