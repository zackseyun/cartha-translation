  yaml_path: translation/extra_canonical/shepherd_of_hermas/019/001.yaml
  text: “Listen,” he says, “about the three forms you are inquiring about. In the first vision, why did she appear to you as an old woman and seated on a chair? Because your spirit is old and already withered and has no strength because of your weaknesses and your double‑mindedness. For just as the aged, no longer having hope of being renewed, expect nothing else but their sleep, so also you, having been weakened by the affairs of life, have handed yourselves over to negligence, and you did not cast your anxieties upon the Lord; instead your mind has been shattered, and you have grown old in your sorrows.”
translation:
  language: en
  text: “Listen,” he says, “and I will explain the three forms you asked about. Why did she appear in the first vision as an old woman sitting in a chair? Because your spirit had grown old and withered. Your weaknesses and divided mind had left it without strength. Old people who no longer hope to be renewed expect nothing but sleep. In the same way, the affairs of life have weakened you all. You have given yourselves over to neglect and have not cast your anxieties upon the Lord. Instead, your minds have been shattered, and you have grown old in your sorrows.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: about the three forms you are inquiring about
  simplified_phrase: I will explain the three forms you asked about
  preserved_meaning: The speaker answers the inquiry about the woman's three appearances.
  reasoning_layer_used: POB translation and immediate context
  rationale: The active wording makes the purpose of the speech immediately clear.
- pob_phrase: because of your weaknesses and your double-mindedness
  simplified_phrase: Your weaknesses and divided mind had left it without strength
  preserved_meaning: Weakness and inner dividedness have drained the spirit's strength.
  reasoning_layer_used: POB wording and clause logic
  rationale: “Divided mind” remains broad enough to include wavering, instability, and a divided disposition.
- pob_phrase: having been weakened by the affairs of life, have handed yourselves over to negligence
  simplified_phrase: the affairs of life have weakened you all. You have given yourselves over to neglect
  preserved_meaning: Life's concerns weakened them, and they responded by surrendering to neglect.
  reasoning_layer_used: POB syntax and causal sequence
  rationale: Two direct sentences distinguish the pressures they suffered from their negligent response.
translation_notes:
  risk_flags:
  - risk: “Sleep” may imply death, but the passage does not explicitly resolve the image.
    mitigation: The text retains “sleep” instead of imposing one interpretation.
  - risk: The passage shifts from singular “your spirit” to a plural address.
    mitigation: “You all” preserves the number shift rather than smoothing it away.
