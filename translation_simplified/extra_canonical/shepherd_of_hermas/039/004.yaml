  simplified_phrase: you will live for God
  preserved_meaning: Life is directed toward God and devoted to him.
  reasoning_layer_used: POB translation and immediate context
  rationale: “For God” expresses this direction naturally in modern English.
- pob_phrase: all will live to God, as many as
