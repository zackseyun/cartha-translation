  text: Cleanse yourself, then, from this evil sorrow, and you will live to God; and all will live to God, as many as cast off sorrow from themselves and clothe themselves with all cheerfulness.
translation:
  language: en
  text: So cleanse yourself from this evil sorrow, and you will live for God. Everyone who throws off sorrow and clothes themselves in full cheerfulness will also live for God.
