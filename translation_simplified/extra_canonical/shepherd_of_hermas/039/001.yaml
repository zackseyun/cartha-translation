base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/shepherd_of_hermas/039/001.yaml
  text: Clothe yourself, then, with cheerfulness, which always has favor with God and is acceptable to him, and delight in it. For every cheerful man does good, thinks good things, and despises sorrow.
translation:
  language: en
  text: So put on cheerfulness. It always pleases God and has his favor. Take delight in it. A cheerful person does what is good, thinks about good things, and rejects sorrow.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Clothe yourself, then, with cheerfulness
  simplified_phrase: So put on cheerfulness
  preserved_meaning: Cheerfulness is pictured as something a person deliberately puts on like clothing.
  reasoning_layer_used: POB base text and source-language image
  rationale: The shorter wording keeps the clothing image while making the command immediate.
- pob_phrase: which always has favor with God and is acceptable to him
  simplified_phrase: It always pleases God and has his favor
  preserved_meaning: God consistently approves of cheerfulness and regards it favorably.
  reasoning_layer_used: POB base text
  rationale: Reordering the two ideas avoids a dense relative clause without merging them.
- pob_phrase: despises sorrow
  simplified_phrase: rejects sorrow
  preserved_meaning: A cheerful person refuses to give sorrow a ruling place.
  reasoning_layer_used: POB base text
  rationale: “Rejects” conveys active resistance more naturally than “despises” in modern English.
translation_notes:
  risk_flags:
  - risk: “Rejects sorrow” might sound like a denial that grief is real.
    mitigation: The wording preserves POB’s contrast with cheerfulness without claiming that sorrow is never experienced.
