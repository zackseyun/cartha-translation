  yaml_path: translation/extra_canonical/shepherd_of_hermas/039/002.yaml
  text: 'But the sorrowful man always acts wickedly: first, he acts wickedly because he grieves the Holy Spirit that was given to the human being as cheerful; second, by grieving the Holy Spirit he works lawlessness, neither praying nor confessing to the Lord. For the prayer of a sorrowful man never has power to ascend to the altar of God.'
translation:
  language: en
  text: 'But a sorrowful person is always doing wrong. First, he does wrong by grieving the joyful Holy Spirit who was given to human beings. Second, when he grieves the Holy Spirit, he commits lawlessness: he neither prays nor confesses to the Lord. The prayer of a sorrowful person never has the power to rise to God’s altar.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the sorrowful man always acts wickedly
  simplified_phrase: a sorrowful person is always doing wrong
  preserved_meaning: Sorrow is connected with repeated wrongdoing in the author’s warning.
  reasoning_layer_used: POB translation
  rationale: Common wording preserves the statement’s moral force.
- pob_phrase: the Holy Spirit that was given to the human being as cheerful
  simplified_phrase: the joyful Holy Spirit who was given to human beings
  preserved_meaning: The Spirit is joyful and is given to human beings person by person.
  reasoning_layer_used: POB translation and grounding review
  rationale: The reordered clause is clearer while retaining the individual human focus.
- pob_phrase: he works lawlessness, neither praying nor confessing to the Lord
  simplified_phrase: 'he commits lawlessness: he neither prays nor confesses to the Lord'
  preserved_meaning: His lawlessness is expressed in his failure to pray and confess.
  reasoning_layer_used: POB translation
  rationale: The colon makes the relationship between the clauses easy to follow.
translation_notes:
  risk_flags:
