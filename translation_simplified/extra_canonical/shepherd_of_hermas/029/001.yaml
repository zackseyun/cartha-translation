  text: “I am commanding you,” he says, “to guard chastity, and do not let a thought about another man’s wife, or about any fornication, or about any such evil likenesses, rise up upon your heart. For in doing this you commit a great sin. But if you remember your own wife always, you will never transgress.
translation:
  language: en
  text: He says, “I command you to remain sexually pure. Do not let thoughts about another man’s wife, about any sexual immorality, or about similar evil images arise in your heart. If you do, you commit a serious sin. But if you always keep your own wife in mind, you will never sin in this way.”
