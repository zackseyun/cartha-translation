  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/005.yaml
  text: “Not only,” he says, “is it adultery if someone defiles his flesh, but whoever makes images as the nations do is committing adultery. Therefore, even in such works, if someone persists and does not repent, keep away from him and do not live together with him; otherwise you too are a sharer in his sin. For this reason it was commanded you to remain by yourselves, whether man or woman, for in cases like these there can be repentance.
translation:
  language: en
  text: '“Adultery,” he says, “is not only a matter of defiling one’s own body. Anyone who makes images as pagan peoples do is also committing adultery. So if someone continues to do such things and does not repent, stay away from that person and do not live with them. Otherwise, you too will share in their sin. This is why a man or woman who separates was commanded to remain unmarried: repentance is still possible in such cases.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Not only ... is it adultery if someone defiles his flesh
  simplified_phrase: Adultery ... is not only a matter of defiling one’s own body
  preserved_meaning: Bodily defilement is one form of adultery, but the passage applies the term more broadly.
  reasoning_layer_used: POB base text
  rationale: The recast sentence keeps the contrast while using natural modern English.
- pob_phrase: whoever makes images as the nations do
  simplified_phrase: Anyone who makes images as pagan peoples do
  preserved_meaning: Making images in the manner associated with the nations is also called adultery.
  reasoning_layer_used: POB base text and historical idiom
  rationale: “Pagan peoples” clarifies the older sense of “the nations” without narrowing “images.”
- pob_phrase: remain by yourselves, whether man or woman
  simplified_phrase: a man or woman who separates was commanded to remain unmarried
  preserved_meaning: After separating from an unrepentant spouse, either a man or woman must not remarry while repentance remains possible.
  reasoning_layer_used: POB base text, immediate context, and surrounding marital instruction
  rationale: “Remain unmarried” states the contextual marital command and avoids suggesting general isolation.
interpretive_expansions:
- pob_phrase: remain by yourselves, whether man or woman
  rendering: a man or woman who separates was commanded to remain unmarried
  claim: The command concerns not remarrying after separation rather than merely living alone.
  evidence:
  - The immediate command concerns not living with an unrepentant partner.
  - The reason given is that the offending partner may still repent.
  - The surrounding section explains the separated spouse’s state as remaining unmarried.
  confidence: high
  alternatives_preserved:
  - The separation may end if repentance permits restoration.
translation_notes:
  risk_flags:
  - risk: “Images” may be understood as referring to every kind of visual art.
    mitigation: The wording preserves the POB’s association with pagan practice without adding an unsupported restriction.
  - risk: “Remain unmarried” makes the surrounding marital context explicit beyond the wording of this isolated segment.
    mitigation: The immediate rationale and surrounding instruction support this clarification while preserving possible repentance and restoration.
