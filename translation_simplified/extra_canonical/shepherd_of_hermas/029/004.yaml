  text: “As long as he is ignorant,” he says, “he does not sin; but if the husband comes to know her sin, and the wife does not repent but persists in her fornication, and the husband lives together with her, he becomes guilty of her sin and a sharer in her adultery. "What then, sir," I say, "should the husband do, if the wife persists in this passion?" "Let him divorce her," he says, "and let the husband remain by himself; but if, after divorcing his wife, he marries another, he himself also commits adultery." "If then, sir," I say, "after the wife is divorced, she repents and wishes to return to her own husband, will she not be received?" "Indeed," he says, "if the husband does not receive her, he sins and brings a great sin upon himself; rather, the one who has sinned and is repenting must be received—but not repeatedly—for to the slaves of God repentance is one. Because of repentance, then, the man ought not to marry. This rule is laid upon both woman and man.
translation:
  language: en
  text: '“As long as the husband does not know,” he says, “he does not sin. But if he learns of his wife’s sin, and she refuses to repent and continues in sexual immorality, then, if he continues living with her, he becomes guilty of her sin and shares in her adultery.”


    “What should the husband do, then, sir,” I ask, “if his wife continues in this sinful behavior?”


    “He should divorce her,” he says, “and remain unmarried. If he divorces his wife and marries another woman, he also commits adultery.”


    “But sir,” I ask, “suppose the divorced wife repents and wants to return to her husband. Should he not take her back?”


    “He certainly should,” he says. “If her husband refuses to take her back, he sins and brings a serious sin upon himself. A person who has sinned and is repenting must be received—but not repeatedly, for God’s servants have one repentance. Therefore, because she may repent, the husband must not marry another woman. This rule applies equally to women and men.”'
  philosophy: optimal-equivalence
