  text: I say to him, “Sir, allow me to ask you a few things.” “Speak,” he says. “Sir,” I say, “if someone has a wife who is faithful in the Lord, and he finds her in some adultery, does the husband sin by living together with her?”
translation:
  language: en
  text: 'I said to him, “Sir, may I ask you a few questions?”


    “Go ahead,” he replied.


    I asked, “Suppose a man has a wife who believes in the Lord, but he discovers that she has committed adultery. Does he sin if he continues living with her?”'
