  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/002.yaml
  text: '“For if this thought rises up upon your heart, you will transgress—and if other such evil things [do], you commit sin. For this thought is a great sin for a slave of God; and if anyone carries out this evil deed, he brings death upon himself. Look to yourself, then: keep away from this thought; for where modesty dwells, there lawlessness ought not to rise up upon the heart of a righteous man.”'
translation:
  language: en
  text: “If this thought arises in your heart, you will transgress. If other evil thoughts like it arise, you also sin. Such a thought is a great sin for a slave of God, and anyone who carries out this evil deed brings death on himself. So watch yourself and stay away from this thought. Where moral purity dwells, lawlessness should not arise in the heart of a righteous man.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: if other such evil things [do]
  simplified_phrase: If other evil thoughts like it arise
  preserved_meaning: Other evil thoughts of the same kind also lead to sin.
  reasoning_layer_used: Immediate syntax and context
  rationale: The repeated reference to thought identifies what arises.
- pob_phrase: 'Look to yourself, then: keep away from this thought'
  simplified_phrase: So watch yourself and stay away from this thought
  preserved_meaning: The reader must remain vigilant and reject the evil thought.
  reasoning_layer_used: POB main-text meaning
  rationale: The direct warning is recast in ordinary modern English.
- pob_phrase: where modesty dwells
  simplified_phrase: Where moral purity dwells
  preserved_meaning: The righteous person's inner life should be marked by honorable moral restraint.
  reasoning_layer_used: Immediate moral context
  rationale: Moral purity avoids reading modesty as mere shyness.
interpretive_expansions:
- pob_phrase: other such evil things [do]
  rendering: other evil thoughts like it arise
  claim: The parallel evil things are thoughts that arise in the heart.
  evidence:
  - The preceding clause names a thought arising in the heart.
  - The next sentence again calls the subject a thought.
  confidence: high
  alternatives_preserved:
  - other similar evil things
- pob_phrase: modesty
  rendering: moral purity
  claim: Modesty here describes a moral quality rather than social timidity.
  evidence:
  - It is contrasted with lawlessness in the righteous person's heart.
  confidence: moderate
  alternatives_preserved:
  - modesty
  - honorable conduct
translation_notes:
  risk_flags:
  - risk: “Moral purity” is somewhat more specific than POB's “modesty.”
    mitigation: The contrast with lawlessness grounds the moral sense while preserving the dwelling image.
