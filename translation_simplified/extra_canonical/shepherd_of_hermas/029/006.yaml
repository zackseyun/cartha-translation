  text: “I therefore,” he says, “do not give an occasion for this practice to be carried through in this way, but so that the one who has sinned may no longer sin. But with regard to his former sin, there is One who is able to give healing—for he is the One who has authority over all.”
translation:
  language: en
  text: “So,” he says, “I do not give this opportunity so that the practice can keep happening in this way, but so that the person who has sinned may stop sinning. As for that person’s earlier sin, there is One who can bring healing, because he has authority over everything.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: do not give an occasion for this practice to be carried through in this way
  simplified_phrase: do not give this opportunity so that the practice can keep happening in this way
  preserved_meaning: The speaker refuses to provide an opportunity for the practice to continue in the same manner.
  reasoning_layer_used: POB translation and independent grounding review
  rationale: The wording keeps the opportunity framework without implying permission for the practice.
- pob_phrase: so that the one who has sinned may no longer sin
  simplified_phrase: so that the person who has sinned may stop sinning
  preserved_meaning: The intended result is that the sinner cease sinning, without guaranteeing the outcome.
  reasoning_layer_used: POB translation and independent grounding review
  rationale: “May stop” preserves the purpose sense while using natural English.
- pob_phrase: with regard to his former sin, there is One who is able to give healing
  simplified_phrase: As for that person’s earlier sin, there is One who can bring healing
  preserved_meaning: The uniquely authoritative One is able to provide healing for the person’s past sin.
  reasoning_layer_used: POB translation
  rationale: The abstract construction is made direct while retaining the healing image.
translation_notes:
  risk_flags:
  - risk: “This opportunity” depends on the preceding context to identify what is being provided.
    mitigation: The wording preserves the POB’s own unspecified occasion rather than adding an authorization.
