  text: 5. Again we went on a little, and he shows me a great shepherd, savage in appearance, wearing a white goatskin, and he had a bag on his shoulders, and a very hard staff with knots, and a great whip. He had a very harsh look, so that I was afraid of him—such was his look.
translation:
  language: en
  text: 5. We walked on a little farther. Then he showed me a large shepherd who looked savage. He wore a white goatskin and carried a bag over his shoulder. He also had a very hard, knotted staff and a large whip. His expression was so harsh that I was afraid of him.
