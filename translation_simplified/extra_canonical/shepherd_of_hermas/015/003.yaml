  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/003.yaml
  text: And those others that fall near the waters yet are not able to roll into the water—do you want to know who they are? These are the ones who have heard the word and want to be baptized into the name of the Lord; then, when the purity of the truth comes to their remembrance, they repent and go back again after their evil desires.
translation:
  language: en
  text: “Do you want to know who the others are—the ones who fall near the water but cannot roll into it? They are those who hear the word and want to be baptized in the name of the Lord. But then they remember how pure the truth is. They change their minds and return to their evil desires.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: those others that fall near the waters yet are not able to roll into the water
  simplified_phrase: the others—the ones who fall near the water but cannot roll into it
  preserved_meaning: The image of falling near the water without entering it remains intact.
  reasoning_layer_used: POB translation and immediate literary image
  rationale: The reordered question reads naturally while preserving the concrete image.
- pob_phrase: when the purity of the truth comes to their remembrance
  simplified_phrase: then they remember how pure the truth is
  preserved_meaning: They recall the purity associated with the truth without turning it into an explicit moral command.
  reasoning_layer_used: POB translation and grounding review
  rationale: The wording clarifies the abstract syntax while preserving the phrase’s ambiguity.
- pob_phrase: they repent and go back again after their evil desires
  simplified_phrase: They change their minds and return to their evil desires
  preserved_meaning: They reverse their intention to be baptized and resume pursuing evil desires.
  reasoning_layer_used: POB translation and narrative direction
  rationale: “Change their minds” makes the reversal toward evil clear without implying repentance from evil.
translation_notes:
  risk_flags:
  - risk: “How pure the truth is” may emphasize purity as a quality belonging to the truth.
    mitigation: It remains close to the POB and does not specify whether the purity belongs to, is revealed by, or is associated with the truth.
  - risk: “Change their minds” may sound weaker than the POB’s “repent.”
    mitigation: The following return to evil desires clearly identifies this as a harmful reversal rather than repentance from sin.
