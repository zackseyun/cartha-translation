  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/005.yaml
  text: Rather, they will fit in another place, much smaller; and this will be when they have been tormented and have completed the days of their sins. And for this reason they will be transferred, because they have shared in the word of the righteous one. And then it will happen that they are transferred from their torments, if the evil deeds they have done come up into their heart. But if they do not come up into their heart, they are not saved because of their hardness of heart.”
translation:
  language: en
  text: “No, they will fit in another place, one that is much smaller. This will happen after they have suffered torment and completed the days of their sins. They will be moved there because they shared in the word of the righteous one. Then they will be released from their torments if the evil deeds they have done come to mind. But if those deeds do not come to mind, they will not be saved, because their hearts are hard.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Rather, they will fit in another place, much smaller
  simplified_phrase: No, they will fit in another place, one that is much smaller
  preserved_meaning: They belong in a different and significantly smaller place.
  reasoning_layer_used: POB translation and immediate discourse
  rationale: The correction and comparison are recast in natural English without changing their force.
- pob_phrase: it will happen that they are transferred from their torments
  simplified_phrase: Then they will be released from their torments
  preserved_meaning: They will leave their torment when the stated condition is fulfilled.
  reasoning_layer_used: POB translation and conditional context
  rationale: The awkward passive transfer is clarified as release while retaining the conditional future result.
- pob_phrase: if they do not come up into their heart
  simplified_phrase: if those deeds do not come to mind
  preserved_meaning: Salvation does not follow if their evil deeds never enter their inward awareness.
  reasoning_layer_used: POB heart image and immediate contrast
  rationale: Repeating “those deeds” makes the reference clear while preserving the inward condition.
interpretive_expansions:
- pob_phrase: if the evil deeds they have done come up into their heart
  rendering: if the evil deeds they have done come to mind
  claim: The heart image describes the deeds entering their inward awareness.
  evidence:
  - The deeds are pictured as coming up within the heart.
  - The following contrast connects their failure with hardness of heart.
  confidence: moderate
  alternatives_preserved:
  - The expression may include remembering the deeds.
  - The expression may suggest a moral response without explicitly stating repentance.
translation_notes:
  risk_flags:
  - risk: “Come to mind” emphasizes awareness more than the source’s broader heart image.
    mitigation: The following statement about hard hearts preserves the moral dimension without making repentance explicit.
