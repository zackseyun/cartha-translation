  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/001.yaml
  text: 'As for the other stones that you saw thrown far from the tower and falling into the road and rolling from the road into the pathless places: these are those who have believed, but because of their double‑mindedness they abandon their true road. Thinking, then, that they are able to find a better road, they go astray and suffer misery as they walk in the pathless places.'
translation:
  language: en
  text: The other stones you saw were thrown far from the tower. They landed on the road, then rolled off it into places with no paths. These stones stand for people who believed but were divided in their hearts, so they left the true road. They thought they could find a better road, but instead they lost their way and suffered misery as they wandered where there were no paths.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: As for the other stones that you saw thrown far from the tower and falling into the road and rolling from the road into the pathless places
  simplified_phrase: The other stones you saw were thrown far from the tower. They landed on the road, then rolled off it into places with no paths.
  preserved_meaning: The stones move from the tower to the road and then into trackless ground.
  reasoning_layer_used: POB text and source imagery
  rationale: Short sentences clarify the sequence while preserving the image.
- pob_phrase: because of their double-mindedness they abandon their true road
  simplified_phrase: were divided in their hearts, so they left the true road
  preserved_meaning: Their inner wavering causes them to leave the right course.
  reasoning_layer_used: POB controlling meaning
  rationale: Common wording explains double-mindedness while retaining its moral force.
- pob_phrase: they go astray and suffer misery as they walk in the pathless places
  simplified_phrase: they lost their way and suffered misery as they wandered where there were no paths
  preserved_meaning: Their search ends in confusion and explicitly severe suffering.
  reasoning_layer_used: POB text, grounding review, and extended road image
  rationale: Natural wording preserves both the pathless image and the full force of their misery.
translation_notes:
  risk_flags:
  - risk: “Divided in their hearts” may sound more emotional than “double-mindedness.”
    mitigation: The cause-and-effect context preserves the sense of unstable judgment and choice.
