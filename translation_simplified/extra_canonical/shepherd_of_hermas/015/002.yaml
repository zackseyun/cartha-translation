  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/002.yaml
  text: But those that fall into the fire and are burned—these are the ones who have finally turned away from the living God, and it no longer came up into their heart to repent because of the desires of their lewdness and the evils they have done.
translation:
  language: en
  text: But those who fall into the fire and are burned are those who have finally turned away from the living God. Because of their sexually immoral desires and the evil they have done, they no longer think of repenting.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: these are the ones who have finally turned away from the living God
  simplified_phrase: are those who have finally turned away from the living God
  preserved_meaning: Their turning away from the living God is decisive and final in the stated sequence.
  reasoning_layer_used: POB controlling translation
  rationale: Retaining “finally” preserves the temporal and decisive force without implying total or irreversible apostasy.
- pob_phrase: it no longer came up into their heart to repent
  simplified_phrase: they no longer think of repenting
  preserved_meaning: They no longer consider turning back from their wrongdoing.
  reasoning_layer_used: POB controlling translation and source-language image
  rationale: The ordinary English wording conveys the meaning of the heart image without adding emphasis.
- pob_phrase: the desires of their lewdness
  simplified_phrase: their sexually immoral desires
  preserved_meaning: Their corrupt sexual desires hinder repentance.
  reasoning_layer_used: POB controlling translation
  rationale: “Sexually immoral” states the sense of the dated word “lewdness” clearly and gravely.
translation_notes:
  risk_flags:
  - risk: Replacing the heart image with “think of” reduces its figurative form.
    mitigation: 'The wording preserves its contextual meaning: repentance no longer arises in their inward consideration.'
