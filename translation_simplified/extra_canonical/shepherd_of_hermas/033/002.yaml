  text: For the crooked path has no tracks, but pathless places and many stumbling blocks; and it is rough and thorny. Therefore it is harmful. But hear also the works of the other way. First of all, if there should come upon you a quick temper or bitterness, know that he is in you. Then come desire for many activities, and extravagance in many foods and drinks, and many drunken sprees, and various luxuries, and things that are not fitting; and desire for women, and greed, and arrogance, and boastfulness, and whatever things are akin and similar to these. Therefore, whenever these things rise up in your heart, know that the angel of wickedness is with you.
translation:
  language: en
  text: 'The crooked path has no clear tracks. It runs through trackless places and has many obstacles that make people stumble. It is rough and full of thorns, so it brings harm.


    Now hear what the other way produces. First, if sudden anger or bitterness comes over you, know that the angel of wickedness is in you. Then come the desire to take on many activities, lavish eating and drinking, drunken parties, various luxuries and other improper things, lust for women, greed, arrogance, and boasting, along with everything else like them. Whenever these things arise in your heart, know that the angel of wickedness is with you.'
  philosophy: optimal-equivalence
