  text: 'So when you recognize his works, withdraw from him and put no trust in him, because his works are wicked and harmful to God’s slaves. You therefore have the activities of both angels; understand them, and trust the angel of righteousness. But withdraw from the angel of wickedness, because his teaching is wicked in every deed. For if someone is a faithful man, and the thought of this angel rises up in his heart, that man or woman must commit some sin. But if again some man or woman is very wicked, and the works of the angel of righteousness rise up in his or her heart, that person must of necessity do something good. You see then,” he says, “that it is good to follow the angel of righteousness, and to renounce the angel of wickedness. As to faith, this commandment makes it clear: that you should trust the works of the angel of righteousness, and, having done them, live to God. But believe that the works of the angel of wickedness are grievous; so by not doing them, you will live
    to God.”'
translation:
  language: en
  text: '“So when you recognize the angel of wickedness by what he does, turn away from him and do not trust him. His deeds are evil and harmful to God’s servants. Now you know how both angels act. Understand this, and trust the angel of righteousness. But turn away from the angel of wickedness, because his teaching is wicked in everything it leads people to do.


    “Even if someone is faithful, when a thought from this angel enters that person’s heart, whether the person is a man or a woman, that person will inevitably commit some sin. On the other hand, even if someone is very wicked, when the works of the angel of righteousness arise in that person’s heart, that person will inevitably do something good.


    “You see, then,” he says, “that it is good to follow the angel of righteousness and reject the angel of wickedness. This commandment makes clear what you should believe: trust the works of the angel of righteousness. Do them, and you will live for God. But believe that the works of the angel of wickedness are grievous. Refuse to do them, and you will live for God.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: when you recognize his works, withdraw from him and put no trust in him
  simplified_phrase: when you recognize the angel of wickedness by what he does, turn away from him and do not trust him
  preserved_meaning: The reader must identify the wicked angel through his deeds and reject his influence.
  reasoning_layer_used: POB translation and immediate context
  rationale: Naming the angel clarifies the pronoun without changing its referent.
- pob_phrase: You therefore have the activities of both angels
  simplified_phrase: Now you know how both angels act
  preserved_meaning: The teaching has described the characteristic actions of both angels.
  reasoning_layer_used: POB translation
  rationale: The concrete wording replaces an awkward abstract expression.
- pob_phrase: having done them, live to God
  simplified_phrase: Do them, and you will live for God
  preserved_meaning: Practicing righteous deeds leads to a life directed toward God.
  reasoning_layer_used: POB translation and optimal-equivalence philosophy
  rationale: The ordinary expression communicates the difficult phrase’s practical direction.
interpretive_expansions:
- pob_phrase: his teaching is wicked in every deed
  rendering: his teaching is wicked in everything it leads people to do
  claim: The wickedness of the angel’s teaching appears in the deeds it produces.
  evidence:
  - The context identifies each angel by the works arising from his influence.
  - POB directly connects the teaching with every deed.
  confidence: moderate
  alternatives_preserved:
  - his teaching is wicked in every deed
translation_notes:
  risk_flags:
  - risk: “Inevitably” may sound as though people have no moral responsibility.
    mitigation: It preserves POB’s necessity language while the commands retain human responsibility.
  - risk: “Live for God” is less literal than “live to God.”
    mitigation: It preserves the sense of a life directed toward God.
