  yaml_path: translation/extra_canonical/shepherd_of_hermas/041/001.yaml
  text: 'He says to me: “Remove from yourself every evil desire, but clothe yourself with the desire that is good and dignified; for when you are clothed with this desire, you will hate the evil desire and you will bridle it as you wish.'
translation:
  language: en
  text: He says to me, “Rid yourself of every evil desire. Instead, clothe yourself with desire for what is good and honorable. When you are clothed with this good desire, you will hate evil desire and rein it in whenever you choose.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Remove from yourself every evil desire
  simplified_phrase: Rid yourself of every evil desire
  preserved_meaning: The command calls for rejecting every evil desire.
  reasoning_layer_used: POB translation
  rationale: “Rid yourself of” expresses the same command in natural modern English.
- pob_phrase: clothe yourself with the desire that is good and dignified
  simplified_phrase: clothe yourself with desire for what is good and honorable
  preserved_meaning: The clothing image and the contrast between evil and honorable desire remain intact.
  reasoning_layer_used: POB translation and source image
  rationale: The wording clarifies the kind of desire while retaining the concrete clothing image.
- pob_phrase: you will bridle it as you wish
  simplified_phrase: rein it in whenever you choose
  preserved_meaning: Good desire enables the hearer to restrain evil desire deliberately.
  reasoning_layer_used: POB translation and source image
  rationale: “Rein it in” preserves the animal-control image in a familiar English expression.
translation_notes:
  risk_flags:
  - risk: “Desire for what is good and honorable” may sound object-focused rather than like a personified good desire.
    mitigation: The following phrase “this good desire” preserves the POB’s presentation of desire as an active opposing force.
