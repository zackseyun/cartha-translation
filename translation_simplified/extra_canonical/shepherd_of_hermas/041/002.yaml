  text: '2. “For evil desire is wild and is hard to tame; for it is fearsome, and by its savagery it greatly consumes people—especially if a slave of God falls into it and is not sensible, he is grievously consumed by it. It consumes such people: those who do not have the garment of good desire, but are entangled with this age. These, therefore, it hands over to death.”'
translation:
  language: en
  text: 2. “Evil desire is wild and hard to tame. It is terrifying, and its savagery devours people. This is especially true when a servant of God falls into its grip and does not act wisely; then it devours him terribly. It devours those who do not have the garment of good desire but are trapped by this age. So it hands them over to death.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: for evil desire is wild and is hard to tame; for it is fearsome
  simplified_phrase: Evil desire is wild and hard to tame. It is terrifying
  preserved_meaning: Evil desire remains a fearsome wild force that resists control.
  reasoning_layer_used: POB translation and source imagery
  rationale: Short sentences clarify the opening without weakening its force.
- pob_phrase: especially if a slave of God falls into it and is not sensible
  simplified_phrase: This is especially true when a slave of God falls into its grip and does not act wisely
  preserved_meaning: A servant of God faces special danger when caught by evil desire and failing to respond wisely.
  reasoning_layer_used: POB translation and immediate context
  rationale: “Falls into its grip” makes the danger clear while preserving the capture image.
- pob_phrase: are entangled with this age
  simplified_phrase: are trapped by this age
  preserved_meaning: They are bound to the corrupt conditions and desires of the present age.
  reasoning_layer_used: POB translation and discourse context
  rationale: “Trapped” expresses entanglement in direct modern English.
translation_notes:
  risk_flags:
  - risk: “Devours” may initially sound physically literal.
    mitigation: The sustained personification of evil desire signals a metaphorical meaning.
  - risk: “This age” may be unfamiliar biblical language.
    mitigation: It preserves the broad POB concept rather than narrowing it to society or the world.
