  text: 3. “What deeds of evil desire,” I say, “hand people over to death, sir? Make them known to me, so that I may keep away from them.” “Listen,” [he says,] “by what deeds evil desire puts the slaves of God to death.”
translation:
  language: en
  text: 3. I asked, “Sir, what evil actions caused by wrong desires bring people to death? Tell me what they are, so I can stay away from them.” He replied, “Listen, and I will tell you by what actions wrong desires bring God’s servants to death.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: What deeds of evil desire
  simplified_phrase: what evil actions caused by wrong desires
  preserved_meaning: Evil desire produces actions that bring deadly consequences.
  reasoning_layer_used: POB translation and immediate context
  rationale: This clearly distinguishes wrong desires from the actions they produce.
- pob_phrase: Make them known to me
  simplified_phrase: Tell me what they are
  preserved_meaning: The speaker asks to be informed about these actions.
  reasoning_layer_used: POB translation
  rationale: The direct request is natural in common English.
- pob_phrase: by what deeds evil desire puts the slaves of God to death
  simplified_phrase: by what actions wrong desires bring God’s servants to death
  preserved_meaning: Wrong desires actively bring death through particular actions among those who serve God.
  reasoning_layer_used: POB translation and source-driven relationship language
  rationale: The wording retains both the means of death and the servants’ relationship to God.
interpretive_expansions:
- pob_phrase: deeds of evil desire
  rendering: evil actions caused by wrong desires
  claim: The actions arise from wrong desires rather than being identical with those desires.
  evidence:
  - The POB distinguishes “deeds” from “evil desire.”
  - The reply says evil desire acts “by” these deeds.
  confidence: high
  alternatives_preserved:
  - actions produced by evil desire
translation_notes:
  risk_flags:
