  text: So I took it, and withdrawing to a certain place in the field, I copied it all letter by letter, for I could not make out the syllables. And when I had finished the letters of the book, suddenly the little book was snatched from my hand; but by whom I did not see.
translation:
  language: en
  text: So I took the little book and went away to a place in the field. There I copied the whole book one letter at a time, because I could not recognize the syllables. When I finished copying it, the little book was suddenly snatched from my hand, but I did not see who took it.
