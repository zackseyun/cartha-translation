  text: Answering, he says to me, “If you set before yourself that they can be kept, you will keep them easily, and they will not be hard. But if it has already arisen in your heart that they cannot be kept by a human being, you will not keep them.
translation:
  language: en
  text: He answered me, “If you decide that these commands can be obeyed, you will obey them easily, and they will not be difficult. But if you have already come to believe in your heart that no human being can obey them, you will not obey them.”
