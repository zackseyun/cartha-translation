  text: '“Listen, then,” he says, “foolish one, how sorrow wears down the Holy Spirit and then again saves. Whenever the double‑minded person undertakes some action and fails in it because of his double‑mindedness, this sorrow enters into the person and grieves the Holy Spirit and wears it down. Then again, when quick temper clings to a person concerning some matter, and he becomes exceedingly embittered, again sorrow enters into the heart of the person who became quick‑tempered, and he is grieved over the deed that he did and repents, because he did what is evil. This sorrow, then, seems to bring salvation, because after doing what is evil he repented. Therefore both things grieve the Spirit: double‑mindedness, because it did not attain its purpose; and quick temper grieves the Spirit, because it did what is evil. Both, then, are grievous to the Holy Spirit—double‑mindedness and quick temper. Remove, therefore, sorrow from yourself, and do not afflict the Holy Spirit that dwells in you,
    lest it appeal to God and depart from you. For the Spirit of God that was given to this flesh does not endure sorrow or distress.”'
translation:
  language: en
  text: '“Listen, then, foolish one,” he says, “and learn how sorrow wears down the Holy Spirit, yet can also save. When a person with a divided mind tries to do something but fails because of that divided mind, sorrow enters the person, grieves the Holy Spirit, and wears the Spirit down. Again, when someone loses his temper over some matter and becomes deeply bitter, sorrow enters his heart. He is grieved by what he has done and repents because he did evil. This sorrow seems to lead to salvation, since he repented after doing evil.


    “So both a divided mind and a quick temper grieve the Spirit. A divided mind grieves the Spirit because it fails to achieve its purpose; a quick temper grieves the Spirit because it does evil. Both are grievous to the Holy Spirit. Therefore, remove sorrow from yourself. Do not afflict the Holy Spirit who lives in you, or the Spirit may appeal to God and leave you. For the Spirit of God, who was given to dwell in this human body, cannot endure sorrow or distress.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Whenever the double-minded person undertakes some action and fails in it because of his double-mindedness
  simplified_phrase: When a person with a divided mind tries to do something but fails because of that divided mind
  preserved_meaning: The person's divided-mindedness causes the attempted action to fail.
  reasoning_layer_used: POB main text and grounding review
  rationale: “Divided mind” is clear while leaving open whether the condition involves wavering, indecision, or instability.
- pob_phrase: when quick temper clings to a person concerning some matter, and he becomes exceedingly embittered
  simplified_phrase: when someone loses his temper over some matter and becomes deeply bitter
  preserved_meaning: Sudden anger takes hold and develops into intense bitterness.
  reasoning_layer_used: POB main text
  rationale: The natural English recasting retains both quick anger and deep bitterness.
- pob_phrase: the Spirit of God that was given to this flesh
  simplified_phrase: the Spirit of God, who was given to dwell in this human body
  preserved_meaning: God's Spirit was given to inhabit human flesh.
  reasoning_layer_used: POB main text and immediate indwelling context
  rationale: “Human body” clarifies “flesh,” while “dwell” preserves the image of the Spirit living within it.
translation_notes:
  risk_flags:
  - risk: The passage says sorrow can save but also says it afflicts the Spirit.
    mitigation: The draft preserves this tension and keeps “seems to lead to salvation” for sorrow followed by repentance.
  - risk: “Appeal to God and leave you” leaves its mechanism and sequence uncertain.
    mitigation: The draft retains the POB meaning without adding an unsupported explanation.
