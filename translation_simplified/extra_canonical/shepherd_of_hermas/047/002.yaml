  text: Therefore, believe God—you who, on account of your sins, have despaired of your life, and are adding sins and weighing down your life—that if you turn back to the Lord with your whole heart and work righteousness for the remaining days of your life, and serve him rightly according to his will, he will bring healing to your former sins, and you will have power to gain mastery over the works of the devil. And do not at all fear the devil’s threat; for he is powerless, like the sinews of a dead man.
translation:
  language: en
  text: Therefore, trust God. You have given up hope for your life because of your sins, yet you keep adding more sins and making your life’s burden heavier. But if you return to the Lord with all your heart, do what is right for the rest of your life, and serve him faithfully according to his will, he will bring healing for your past sins. He will also give you power to overcome the works of the devil. Do not fear the devil’s threats at all, because he is as powerless as the tendons in a dead body.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: believe God—you who, on account of your sins, have despaired of your life
  simplified_phrase: trust God. You have given up hope for your life because of your sins
  preserved_meaning: Those despairing because of sin are called to rely on God.
  reasoning_layer_used: POB translation and immediate context
  rationale: Short sentences clarify the direct appeal without changing its force.
- pob_phrase: work righteousness for the remaining days of your life, and serve him rightly according to his will
  simplified_phrase: do what is right for the rest of your life, and serve him faithfully according to his will
  preserved_meaning: A wholehearted return includes righteous conduct and obedient service throughout one’s remaining life.
  reasoning_layer_used: POB translation
  rationale: Common verbs replace abstract phrasing while keeping both actions distinct.
- pob_phrase: he is powerless, like the sinews of a dead man
  simplified_phrase: he is as powerless as the tendons in a dead body
  preserved_meaning: The vivid bodily image emphasizes that the devil’s threats have no power over one who returns to God.
  reasoning_layer_used: POB translation and source-language image
  rationale: “Tendons” and “dead body” make the original comparison understandable while preserving it.
translation_notes:
  risk_flags:
  - risk: “Healing for your past sins” may sound unusual in modern English.
    mitigation: The wording remains because POB deliberately presents forgiveness or restoration through the image of healing.
  - risk: The dead-body comparison may feel stark to some readers.
    mitigation: Its force is retained because it is the source image used to portray complete powerlessness.
