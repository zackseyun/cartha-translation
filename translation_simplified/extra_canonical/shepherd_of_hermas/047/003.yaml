  text: Listen to me, then, and fear the One who is able to do all things, to save and to destroy; and keep these commandments, and you will live to God.
translation:
  language: en
  text: So listen to me. Fear the One who has power to do everything—to save and to destroy. Obey these commands, and you will live for God.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Listen to me, then, and fear the One
  simplified_phrase: So listen to me. Fear the One
  preserved_meaning: The speaker calls for attention and reverence toward God.
  reasoning_layer_used: POB translation and immediate syntax
  rationale: Dividing the linked commands makes each one clear without weakening either.
- pob_phrase: who is able to do all things, to save and to destroy
  simplified_phrase: who has power to do everything—to save and to destroy
  preserved_meaning: God has unlimited power, including power to save and destroy.
  reasoning_layer_used: POB source-driven wording
  rationale: “Has power” expresses ability in direct modern English while retaining both outcomes.
- pob_phrase: keep these commandments, and you will live to God
  simplified_phrase: Obey these commands, and you will live for God
  preserved_meaning: Obedience to the given commands leads to a life directed toward God.
  reasoning_layer_used: POB translation and clause relationship
  rationale: “Obey” and “live for God” make the command and its result understandable to modern readers.
