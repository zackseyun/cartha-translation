  text: '"These are the holy angels of God, the first-created, to whom the Lord entrusted all his creation, to increase and to build and to rule over all creation. By these, therefore, the building of the tower will be brought to completion."'
translation:
  language: en
  text: “These are God’s holy angels, the first beings he created. The Lord entrusted all creation to them, to make it grow, build it up, and rule over it. Therefore, through them, the building of the tower will be completed.”
  philosophy: optimal-equivalence
