  text: Answering me, she says, "It is not because you are more worthy than all that it is revealed to you; for there are others before you and better than you, to whom it was fitting that these visions should be revealed. But in order that the name of God might be glorified, it has been revealed to you and will be revealed, for the sake of the double-minded—those who reason within their hearts whether these things are so or not. Tell them that all these things are true, and nothing is outside the truth; rather, all are strong and sure and well-founded."
translation:
  language: en
  text: She answered me, “These visions are not being shown to you because you are more worthy than everyone else. Others came before you who are better than you, and it would have been fitting for these visions to be shown to them. But they have been shown to you and will continue to be shown so that God’s name may be glorified. They are also for those who cannot make up their minds and wonder in their hearts whether these things are true. Tell them that all these things are true. Nothing in them departs from the truth. They are firm, certain, and built on a solid foundation.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: It is not because you are more worthy than all that it is revealed to you
  simplified_phrase: These visions are not being shown to you because you are more worthy than everyone else
  preserved_meaning: The visions were not given because the recipient surpassed everyone else in worthiness.
  reasoning_layer_used: POB translation and immediate context
  rationale: Naming the visions makes the reference clear in natural English.
- pob_phrase: for the sake of the double-minded—those who reason within their hearts whether these things are so or not
  simplified_phrase: They are also for those who cannot make up their minds and wonder in their hearts whether these things are true
  preserved_meaning: The visions address inwardly uncertain people who question whether they are true.
  reasoning_layer_used: POB explanatory gloss
  rationale: The wording expresses the POB’s explanation of double-mindedness in common English.
- pob_phrase: all are strong and sure and well-founded
  simplified_phrase: They are firm, certain, and built on a solid foundation
  preserved_meaning: All the revealed matters are reliable, secure, and firmly grounded.
  reasoning_layer_used: POB source-image rendering
  rationale: The foundation image and threefold assurance remain clear and distinct.
translation_notes:
  risk_flags:
  - risk: “Cannot make up their minds” may sound less morally charged than “double-minded.”
    mitigation: The inward questioning keeps the specific uncertainty defined by the POB.
  - risk: “It would have been fitting” could be mistaken for an assertion of merit.
    mitigation: The wording avoids saying that the earlier people deserved or were entitled to the visions.
