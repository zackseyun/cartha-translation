  yaml_path: translation/extra_canonical/shepherd_of_hermas/012/004.yaml
  text: '"They too are holy angels of God; but these six are superior to them. The building of the tower, then, will be brought to completion, and all together will rejoice around the tower and will glorify God, because the building of the tower has been completed."'
translation:
  language: en
  text: “They also are God’s holy angels, but these six have a higher rank. Then the tower will be finished, and all will rejoice around it and praise God because its construction is complete.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: these six are superior to them
  simplified_phrase: these six have a higher rank
  preserved_meaning: The six angels hold a superior position among the holy angels.
  reasoning_layer_used: POB translation and immediate context
  rationale: “Higher rank” makes the comparison clear without implying greater holiness.
- pob_phrase: The building of the tower, then, will be brought to completion
  simplified_phrase: Then the tower will be finished
  preserved_meaning: The tower’s construction will reach completion.
  reasoning_layer_used: POB translation
  rationale: The shorter wording removes a heavy passive construction while preserving future completion.
- pob_phrase: all together will rejoice around the tower and will glorify God
  simplified_phrase: all will rejoice around it and praise God
  preserved_meaning: The whole group in view will rejoice around the tower and give glory to God.
  reasoning_layer_used: POB translation and independent grounding review
  rationale: This keeps the contextual scope of “all” and adds no separate act of gathering.
