  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/006.yaml
  text: He says, “Every deed is an indulgence to a person, whatever he does with pleasure. For even the hot‑tempered man, by giving his own passion its fill, indulges himself; and the adulterer and the drunkard and the slanderer and the liar and the greedy person and the defrauder and the one doing things like these gives his own disease its fill; he therefore indulges himself in his act. All these indulgences are harmful to the slaves of God. Therefore, because of these deceptions, those who are punished and tormented suffer.
translation:
  language: en
  text: He says, “Every act that a person takes pleasure in is a form of self-indulgence. A hot-tempered person indulges himself by letting his anger have all it wants. In the same way, adulterers, drunkards, slanderers, liars, greedy people, cheats, and all who do similar things feed their own disease and indulge themselves through what they do. All such indulgence harms God’s servants. Therefore, those who are punished and tormented suffer because of these deceptions.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Every deed is an indulgence to a person, whatever he does with pleasure
  simplified_phrase: Every act that a person takes pleasure in is a form of self-indulgence
  preserved_meaning: Pleasure taken in an act can make that act an instance of indulging oneself.
  reasoning_layer_used: POB translation and immediate explanation
  rationale: The rewrite states the governing idea directly in common English.
- pob_phrase: by giving his own passion its fill
  simplified_phrase: by letting his anger have all it wants
  preserved_meaning: The hot-tempered person gratifies his angry passion without restraint.
  reasoning_layer_used: POB translation and immediate context
  rationale: This identifies the passion as anger while preserving the image of satisfying its appetite.
- pob_phrase: the defrauder and the one doing things like these gives his own disease its fill
  simplified_phrase: cheats, and all who do similar things feed their own disease
  preserved_meaning: Wrongdoers nourish the corrupt condition expressed in their actions.
  reasoning_layer_used: POB translation and source-language image as represented by POB
  rationale: Familiar labels improve clarity while retaining the disease-and-feeding metaphor.
translation_notes:
  risk_flags:
  - risk: “Every act” may sound as though all pleasure is inherently sinful.
    mitigation: The examples frame the statement around pleasure that gratifies destructive passions and wrongdoing.
  - risk: “Feed their own disease” may initially sound like physical illness.
    mitigation: The list of moral actions makes the metaphorical sense clear while preserving the POB image.
