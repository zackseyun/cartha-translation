  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/004.yaml
  text: “So, being tormented and punished the whole year, he remembers the indulgence and the deception, and he knows that because of them he suffers evil things. Every person who indulges himself and is deceived is tormented in this way, because, though having life, they have handed themselves over to death.”
translation:
  language: en
  text: So, while he is tormented and punished for a whole year, he remembers his self-indulgence and the deception. He realizes that he suffers these evils because of them. Everyone who indulges himself and is deceived is tormented in this way. Although they have life, they have given themselves over to death.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: being tormented and punished the whole year
  simplified_phrase: while he is tormented and punished for a whole year
  preserved_meaning: His remembering occurs in connection with the year-long punishment, not necessarily after it.
  reasoning_layer_used: POB translation and independent grounding review
  rationale: “While” avoids imposing a completed sequence that the POB does not require.
- pob_phrase: he remembers the indulgence and the deception
  simplified_phrase: he remembers his self-indulgence and the deception
  preserved_meaning: He recalls both his indulgent conduct and the deception connected with it.
  reasoning_layer_used: POB wording and immediate context
  rationale: The wording identifies the indulgence as his own while keeping indulgence and deception distinct.
- pob_phrase: because, though having life, they have handed themselves over to death
  simplified_phrase: Although they have life, they have given themselves over to death
  preserved_meaning: Living people have voluntarily placed themselves under death's power.
  reasoning_layer_used: POB theological image
  rationale: The life-and-death contrast remains intact in natural English.
translation_notes:
  risk_flags:
  - risk: “Self-indulgence” remains broad because this segment does not identify a particular vice.
    mitigation: The text preserves the POB's general expression without adding unsupported specifics.
