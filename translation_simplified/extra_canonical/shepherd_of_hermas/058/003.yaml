  preserved_meaning: The person yields to self-indulgent desires.
  reasoning_layer_used: POB translation and immediate context
  rationale: Common wording clarifies the action without weakening its moral force.
- pob_phrase: has clothed himself with much foolishness
  simplified_phrase: covers himself with great foolishness
  preserved_meaning: Foolishness surrounds the person like clothing through his own conduct.
  reasoning_layer_used: POB source-driven image
  rationale: The clothing image remains in more familiar English.
- pob_phrase: punishment and torment have great memory
  simplified_phrase: punishment and torment have a long memory
  preserved_meaning: Punishment and torment persist far longer than the brief indulgence.
  reasoning_layer_used: POB translation and paragraph contrast
  rationale: The personification is preserved in natural modern English.
