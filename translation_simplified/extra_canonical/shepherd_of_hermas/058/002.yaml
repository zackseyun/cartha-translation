  text: He answered me and says, “Your foolishness is persistent, and you are unwilling to cleanse your heart and to serve God. Watch out lest the time be fulfilled, and you be found foolish. Listen then,” he says, “as you desire, so that you may understand these things.
translation:
  language: en
  text: He answered me, “Your foolishness continues. You refuse to purify your heart and serve God. Be careful, or time may run out and you may be found foolish. If you want to understand these things, listen.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Your foolishness is persistent
  simplified_phrase: Your foolishness continues
  preserved_meaning: His foolishness remains ongoing despite correction.
  reasoning_layer_used: POB text and immediate context
  rationale: The simpler verb directly expresses the same continuing condition.
- pob_phrase: Watch out lest the time be fulfilled
  simplified_phrase: Be careful, or time may run out
  preserved_meaning: He is warned that the available time may come to an end.
  reasoning_layer_used: POB text and source-language time image
  rationale: “Run out” makes the warning clear while preserving time reaching its limit.
- pob_phrase: Listen then, as you desire, so that you may understand these things
  simplified_phrase: If you want to understand these things, listen
  preserved_meaning: Understanding depends on his willingness to listen.
  reasoning_layer_used: POB wording and grounding review
  rationale: The conditional wording preserves the appeal without asserting his desire as settled fact.
translation_notes:
  risk_flags:
  - risk: “Time may run out” may suggest a fixed deadline more strongly than the POB wording.
    mitigation: The word “may” keeps this as a warning rather than a definite prediction.
