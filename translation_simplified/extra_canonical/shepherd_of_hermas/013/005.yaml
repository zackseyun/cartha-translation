  yaml_path: translation/extra_canonical/shepherd_of_hermas/013/005.yaml
  text: '“And those whom they were casting away and throwing aside—who are they?” “These are people who have sinned and want to repent. For this reason they were not flung far away outside the tower, because they will be useful for the building, if they repent. Therefore those who are going to repent—if they repent—will be strong in the faith, if they repent now, while the tower is being built. But if the building is completed, they no longer have a place, but will be cast out. But they have only this: to lie beside the tower.”'
translation:
  language: en
  text: '“And who are the ones they were rejecting and tossing aside?”


    “They are people who have sinned and want to repent. They were not thrown far away from the tower, because if they repent, they can still be used in its construction. Those who are going to repent will be strong in the faith if they repent now, while the tower is still being built. Once it is finished, there will be no place for them, and they will be cast out. The only thing left for them is to lie beside the tower.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: those whom they were casting away and throwing aside
  simplified_phrase: the ones they were rejecting and tossing aside
  preserved_meaning: They are judged unsuitable and moved aside from the building work.
  reasoning_layer_used: POB translation and immediate tower imagery
  rationale: Ordinary wording retains both rejection and physical removal.
- pob_phrase: they will be useful for the building
  simplified_phrase: they can still be used in its construction
  preserved_meaning: If they repent, they can still be included in building the tower.
  reasoning_layer_used: POB translation and paragraph context
  rationale: The wording clarifies their possible use without explaining away the tower image.
- pob_phrase: 'But they have only this: to lie beside the tower'
  simplified_phrase: The only thing left for them is to lie beside the tower
  preserved_meaning: Their remaining condition is limited to lying outside beside the tower.
  reasoning_layer_used: POB translation and contrast with having a place
  rationale: This states the restricted outcome without presenting it as an advantage.
interpretive_expansions:
- pob_phrase: they will be useful for the building, if they repent
  rendering: if they repent, they can still be used in its construction
  claim: Repentance leaves open the possibility of their inclusion in the tower.
  evidence:
  - The POB directly links repentance with usefulness for the building.
  - Their nearness to the unfinished tower contrasts with being cast out after its completion.
  confidence: high
  alternatives_preserved:
  - The tower remains an image rather than being assigned one explicit referent.
translation_notes:
  risk_flags:
  - risk: Smoothing the repeated repentance clauses could weaken their rhetorical insistence.
    mitigation: The draft repeats the condition and keeps its direct link to timely repentance and strength in faith.
