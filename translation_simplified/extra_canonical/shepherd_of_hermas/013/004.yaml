  text: “And the ones being brought and set into the building—who are they?” “They are new in the faith and faithful. But they are being admonished by the angels to do good, because evil was found in them.”
translation:
  language: en
  text: '“Who are the people being brought in and placed in the building?”


    “They are new to the faith and are faithful. But the angels are warning them to do what is good, because evil has been found in them.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the ones being brought and set into the building
  simplified_phrase: the people being brought in and placed in the building
  preserved_meaning: The people are brought into the building and assigned a place in it.
  reasoning_layer_used: POB translation and source image
  rationale: The wording is made natural while preserving both passive actions and the building image.
- pob_phrase: new in the faith and faithful
  simplified_phrase: new to the faith and are faithful
  preserved_meaning: They are recent believers who are also faithful.
  reasoning_layer_used: POB translation
  rationale: The idiom is modernized without merging the two descriptions.
- pob_phrase: being admonished by the angels to do good
  simplified_phrase: the angels are warning them to do what is good
  preserved_meaning: The angels correctively urge them toward good conduct.
  reasoning_layer_used: POB translation and immediate causal context
  rationale: The active sentence is easier to follow and keeps the corrective force supported by the evil found in them.
translation_notes:
  risk_flags:
  - risk: “Warning” may sound stronger than some senses of “admonishing.”
    mitigation: The following statement that evil was found in them supports a corrective warning rather than neutral instruction.
