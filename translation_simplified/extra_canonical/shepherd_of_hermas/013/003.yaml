  text: “I want to know who the other stones are that are being carried from the dry land, lady.” She said, “Those that go into the building without being hewn—the Lord approved these, because they walked in the uprightness of the Lord and kept his commandments.”
translation:
  language: en
  text: “Lady, I want to know who the other stones are—the ones being brought from the dry land.” She answered, “They are the stones that go into the building without being cut to shape. The Lord approved them because they lived according to his upright standard and obeyed his commandments.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the other stones are that are being carried from the dry land
  simplified_phrase: the other stones are—the ones being brought from the dry land
  preserved_meaning: The stones retain their symbolic identity and movement from the dry land.
  reasoning_layer_used: POB text and immediate discourse
  rationale: The dash separates the description from the main question for easier reading.
- pob_phrase: go into the building without being hewn
  simplified_phrase: go into the building without being cut to shape
  preserved_meaning: The stones enter the building without first being shaped by cutting.
  reasoning_layer_used: POB source-driven image and grounding review
  rationale: The wording explains “hewn” while preserving the stones’ movement and the stoneworking image.
- pob_phrase: walked in the uprightness of the Lord and kept his commandments
  simplified_phrase: lived according to his upright standard and obeyed his commandments
  preserved_meaning: Their conduct conformed to the Lord’s singular standard of uprightness and his commands.
  reasoning_layer_used: POB text and grounding review
  rationale: The conduct metaphor is made clear without recasting uprightness as plural ways.
translation_notes:
  risk_flags:
  - risk: Rendering “walked” as “lived” makes the path metaphor less visible.
    mitigation: The wording clearly preserves its intended sense of ongoing conduct.
