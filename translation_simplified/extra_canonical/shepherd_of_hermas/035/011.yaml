  text: “Do these seem to you to be good?” “What, Lord, is better than these?” I say. “Go, then,” he says, “walk in them and do not exercise self‑control from them, and you will live to God.
translation:
  language: en
  text: '“Do these things seem good to you?”


    “What could be better than these, Lord?” I replied.


    “Then make them your way of life,” he said. “Do not hold yourself back from doing them, and you will live for God.”'
