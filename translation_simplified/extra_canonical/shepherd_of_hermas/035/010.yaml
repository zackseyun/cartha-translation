base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/010.yaml
  text: '“Next, hear what follows these: to serve widows; to visit orphans and those in want; to redeem the slaves of God from distresses; to be hospitable (for in hospitality one sometimes finds an opportunity for doing good); to oppose no one; to be quiet; to become lower than all people; to honor the elderly; to practice righteousness; to preserve the brotherhood; to endure insult; to be long‑suffering; to have no resentment; to encourage those who are weary in soul; not to cast off those who have stumbled away from the faith, but to turn them back and make them cheerful; to admonish those who sin; not to oppress debtors and the needy; and if there is anything like these.'
translation:
  language: en
  text: '“Next, hear what else you should do: care for widows; visit orphans and people in need; rescue God’s servants from their troubles; welcome strangers, because hospitality sometimes gives you an opportunity to do good; oppose no one; live quietly; take the lowest place among everyone; honor the elderly; do what is right; protect the community of believers; endure insults; be patient with others; hold no grudges; encourage those who are weary in spirit; do not reject those who have stumbled away from the faith, but bring them back and restore their joy; warn those who sin; do not take advantage of debtors or the needy; and do anything else like these things.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: to redeem the slaves of God from distresses
  simplified_phrase: rescue God’s servants from their troubles
  preserved_meaning: Believers are to help free fellow servants of God from severe hardship.
  reasoning_layer_used: POB translation and immediate list context
  rationale: “Rescue” preserves the act of deliverance without the modern implication of buying enslaved people.
- pob_phrase: to become lower than all people
  simplified_phrase: take the lowest place among everyone
  preserved_meaning: The command calls for deliberate humility toward everyone.
  reasoning_layer_used: POB source-driven image
  rationale: The wording keeps the image of low position while making the command natural in English.
- pob_phrase: to preserve the brotherhood
  simplified_phrase: protect the community of believers
  preserved_meaning: Believers should safeguard their shared community and bonds.
  reasoning_layer_used: POB translation and discourse context
  rationale: The phrase identifies the religious community rather than suggesting only male siblings.
interpretive_expansions:
- pob_phrase: to make them cheerful
  rendering: restore their joy
  claim: Those brought back to faith should also be helped out of discouragement.
  evidence:
  - The command follows bringing back people who have stumbled away from the faith.
  - POB explicitly joins their return with making them cheerful.
  confidence: high
  alternatives_preserved:
  - make them cheerful
  - encourage them
translation_notes:
  risk_flags:
  - risk: “Rescue” may understate the transactional overtones sometimes carried by “redeem.”
    mitigation: The wording retains the central liberation image and does not specify a method absent from POB.
  - risk: “Protect the community” could be heard as institutional defense.
    mitigation: Its place among relational duties directs the phrase toward preserving fellowship among believers.
