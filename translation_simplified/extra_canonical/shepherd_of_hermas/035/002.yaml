  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/002.yaml
  text: '“Make it known to me, Lord,” I say, “with respect to what things one must exercise self‑control, and with respect to what things one must not.” “Listen,” he says: “Exercise self‑control with regard to what is evil and do not do it; but do not exercise self‑control with regard to what is good—rather, do it. For if you exercise self‑control so as not to do the good, you commit a great sin; but if you exercise self‑control so as not to do what is evil, you accomplish great righteousness. Therefore exercise self‑control from every wickedness, doing the good.”'
translation:
  language: en
  text: '“Lord,” I said, “tell me what I should hold myself back from and what I should not.”


    He said, “Listen. Hold yourself back from evil, and do not do it. But do not hold yourself back from doing good. Instead, do what is good. If you keep yourself from doing good, you commit a great sin. But if you keep yourself from doing evil, you practice great righteousness. So hold yourself back from every kind of wickedness, and do what is good.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: with respect to what things one must exercise self-control
  simplified_phrase: what I should hold myself back from
  preserved_meaning: The speaker asks which actions require restraint.
  reasoning_layer_used: POB translation and immediate context
  rationale: The concrete phrase “hold myself back” makes the intended kind of self-control immediately clear.
- pob_phrase: do not exercise self-control with regard to what is good—rather, do it
  simplified_phrase: do not hold yourself back from doing good. Instead, do what is good
  preserved_meaning: Restraint must never become an excuse for failing to do good.
  reasoning_layer_used: POB translation and clause contrast
  rationale: Two short sentences preserve the contrast while removing the difficult paradoxical wording.
- pob_phrase: you accomplish great righteousness
  simplified_phrase: you practice great righteousness
  preserved_meaning: Refraining from evil is an act of great righteousness.
  reasoning_layer_used: POB translation
  rationale: “Practice” is natural English while retaining the important biblical term “righteousness.”
translation_notes:
  risk_flags:
  - risk: Replacing “exercise self-control” with “hold yourself back” may sound narrower than the source concept.
    mitigation: The repeated contrast between evil and good clearly defines restraint as the intended sense here.
