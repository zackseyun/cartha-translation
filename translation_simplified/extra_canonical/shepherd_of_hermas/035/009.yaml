  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/009.yaml
  text: '“First of all: faith, fear of the Lord, love, concord, words of righteousness, truth, endurance—there is nothing better than these in the life of human beings. If someone keeps these and does not exercise self‑control from them, he becomes blessed in his life.'
translation:
  language: en
  text: “First of all come faith, fear of the Lord, love, harmony, righteous speech, truth, and endurance. Nothing in human life is better than these. Anyone who holds to them and does not hold back from practicing them will be blessed in life.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: concord, words of righteousness
  simplified_phrase: harmony, righteous speech
  preserved_meaning: The list still commends unity with others and speech characterized by what is right.
  reasoning_layer_used: POB text and immediate list context
  rationale: Common terms replace less familiar and more abstract wording.
- pob_phrase: there is nothing better than these in the life of human beings
  simplified_phrase: Nothing in human life is better than these
  preserved_meaning: These virtues are presented as unsurpassed in human life.
  reasoning_layer_used: POB controlling meaning
  rationale: The sentence is shortened without weakening its absolute comparison.
- pob_phrase: keeps these and does not exercise self-control from them
  simplified_phrase: holds to them and does not hold back from practicing them
  preserved_meaning: A person must retain these virtues and not refrain from putting them into practice.
  reasoning_layer_used: POB wording and clause contrast
  rationale: The awkward negative expression is recast as a clear command not to refrain.
interpretive_expansions:
- pob_phrase: does not exercise self-control from them
  rendering: does not hold back from practicing them
  claim: The clause concerns not refraining from these virtues rather than lacking self-control generally.
  evidence:
  - The phrase “from them” links the restraint specifically to the listed virtues.
  - The positive condition “keeps these” supports continued practice.
  confidence: moderate
  alternatives_preserved:
  - does not refrain from them
  - does not restrain himself from them
translation_notes:
  risk_flags:
