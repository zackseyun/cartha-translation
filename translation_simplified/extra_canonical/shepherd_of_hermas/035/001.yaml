  text: “I said to you,” he says, “that the things created by God are twofold; for self‑control is twofold as well. For with regard to some things one must exercise self‑control, and with regard to others one must not.
translation:
  language: en
  text: 'He says, “I told you that the things God created fall into two groups. In the same way, self-control has two sides: there are some things you must avoid, and others you must not avoid.”'
  philosophy: optimal-equivalence
