  text: “Do these not seem to you to be evil?” “Very evil,” I say, “for the slaves of God.” “From all these the one who serves God must exercise self‑control. Exercise self‑control, then, from all these, that you may live to God and be enrolled with those who exercise self‑control from them. These, then, are the things from which you must exercise self‑control.
translation:
  language: en
  text: '“Do these things not seem evil to you?”


    “Very evil for God’s servants,” I said.


    “Anyone who serves God must keep away from all these things. So keep away from them, so that you may live for God and be counted among those who do the same. These are the things you must avoid.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the slaves of God
  simplified_phrase: God’s servants
  preserved_meaning: They belong to God and serve him.
  reasoning_layer_used: POB translation and immediate context
  rationale: “Servants” communicates the role naturally while preserving their submission to God.
- pob_phrase: exercise self-control ... from all these
  simplified_phrase: keep away from all these things
  preserved_meaning: A person serving God must abstain from the listed evils.
  reasoning_layer_used: POB translation and discourse context
  rationale: The repeated construction means refraining from the evils just named.
- pob_phrase: be enrolled with those who exercise self-control from them
  simplified_phrase: be counted among those who do the same
  preserved_meaning: The obedient person will be included among those who abstain from these evils.
  reasoning_layer_used: POB translation
  rationale: “Counted among” makes the enrollment image understandable without changing its force.
translation_notes:
  risk_flags:
  - risk: “Keep away” may sound less inwardly disciplined than “exercise self-control.”
    mitigation: The wording retains the required abstinence and repeats it as a direct command.
