  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/005.yaml
  text: '“Are there still,” I say, “Lord, evil works?” “Indeed, there are many,” he says, “from which the slave of God must exercise self‑control: theft, falsehood, defrauding, false testimony, greed, evil desire, deceit, vainglory, boastfulness, and whatever things are like these.”'
translation:
  language: en
  text: '“Lord,” I ask, “are there other evil things people do?” He answers, “Yes, many. A servant of God must keep away from them: stealing, lying, cheating, giving false testimony, greed, evil desires, deception, seeking praise for oneself, boasting, and anything else like these.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Are there still ... evil works?
  simplified_phrase: are there other evil things people do?
  preserved_meaning: The speaker asks whether more kinds of evil conduct remain to be named.
  reasoning_layer_used: POB text and immediate list context
  rationale: “Other evil things people do” makes the question natural and concrete.
- pob_phrase: the slave of God must exercise self-control
  simplified_phrase: A servant of God must keep away from them
  preserved_meaning: Those who belong to God must restrain themselves from these wrong actions and attitudes.
  reasoning_layer_used: POB controlling meaning and source-language image
  rationale: “Servant” preserves belonging and duty without the distracting modern associations of “slave.”
- pob_phrase: vainglory
  simplified_phrase: seeking praise for oneself
  preserved_meaning: The vice is a self-centered desire for recognition or glory.
  reasoning_layer_used: POB vice-list context
  rationale: The plain phrase explains an unfamiliar term while keeping it distinct from boasting.
translation_notes:
  risk_flags:
  - risk: “Servant” softens the force of POB’s “slave.”
    mitigation: The wording retains the central idea of belonging to God and being obligated to obey.
