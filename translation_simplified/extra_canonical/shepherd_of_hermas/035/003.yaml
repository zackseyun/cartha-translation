  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/003.yaml
  text: '“What kinds, Lord,” I say, “are the wickednesses from which we must exercise self‑control?” “Listen,” he says: “From adultery and fornication, from lawless drunkenness, from wicked luxury, from many foods and the extravagance of wealth and boasting and haughtiness and arrogance, and from lying and slander and hypocrisy, resentment, and every blasphemy.'
translation:
  language: en
  text: '“What kinds of wickedness, Lord,” I ask, “must we keep ourselves from?” He answers, “Listen: Keep away from adultery and sexual immorality, lawless drunkenness, evil self-indulgence, indulgence in many kinds of food, extravagant use of wealth, boasting, haughtiness, arrogance, lying, slander, hypocrisy, resentment, and every kind of blasphemy.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: from which we must exercise self-control
  simplified_phrase: must we keep ourselves from
  preserved_meaning: The command requires actively avoiding these forms of wickedness.
  reasoning_layer_used: POB translation and immediate sentence context
  rationale: The common expression states the required restraint without the awkward construction.
- pob_phrase: fornication
  simplified_phrase: sexual immorality
  preserved_meaning: The phrase retains the POB category of wrongful sexual conduct alongside adultery.
  reasoning_layer_used: POB lexical choice
  rationale: The modern phrase is clearer than the now uncommon term.
- pob_phrase: wicked luxury, from many foods and the extravagance of wealth
  simplified_phrase: evil self-indulgence, indulgence in many kinds of food, extravagant use of wealth
  preserved_meaning: The list still condemns corrupt luxury, excess involving food, and lavish wealth.
  reasoning_layer_used: POB translation and list structure
  rationale: The recasting clarifies three distinct kinds of excess without merging them.
translation_notes:
  risk_flags:
  - risk: “Sexual immorality” may be heard as broader than the traditional English term “fornication.”
    mitigation: It remains paired with adultery and is presented as the clear modern equivalent of the POB category.
  - risk: The exact form of excess meant by “many foods” remains uncertain.
    mitigation: The wording preserves both indulgence and the reference to many kinds of food without reducing it to overeating alone.
