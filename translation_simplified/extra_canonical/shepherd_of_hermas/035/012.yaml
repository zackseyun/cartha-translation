  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/012.yaml
  text: “Therefore keep this commandment. If you do the good and do not exercise self‑control from it, you will live to God—and all who act in this way will live to God. And again, if you do not do the evil and exercise self‑control from it, you will live to God; and all will live to God—whoever keeps these commandments and walks in them.”
translation:
  language: en
  text: 'Therefore, keep this commandment: Do what is good, and do not hold back from doing it. Then you will live to God, and so will everyone who acts this way. Do not do what is evil, but keep yourself from it. Then you will live to God. Everyone who keeps these commandments and follows them will live to God.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: do the good and do not exercise self-control from it
  simplified_phrase: Do what is good, and do not hold back from doing it
  preserved_meaning: The reader must actively do good rather than restrain the impulse to do it.
  reasoning_layer_used: POB main text and immediate contrast
  rationale: This makes the unusual positive use of self-control clear while preserving both commands.
- pob_phrase: do not do the evil and exercise self-control from it
  simplified_phrase: Do not do what is evil, but keep yourself from it
  preserved_meaning: The reader must avoid evil and restrain oneself from it.
  reasoning_layer_used: POB main text and parallel clause structure
  rationale: Common wording preserves both refusing evil and practicing restraint against it.
- pob_phrase: walks in them
  simplified_phrase: follows them
  preserved_meaning: The commandments must guide a person's continuing way of life.
  reasoning_layer_used: POB main text in context
  rationale: “Follows them” clearly expresses living according to the commandments.
translation_notes:
  risk_flags:
  - risk: “Live to God” is less familiar than “live for God” in modern English.
    mitigation: The POB formula is retained because “for God” could narrow the meaning to service on God's behalf.
