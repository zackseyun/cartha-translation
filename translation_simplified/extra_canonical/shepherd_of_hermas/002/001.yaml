  text: After she had spoken these words, the heavens were shut, and I was wholly trembling and grieving. And I said within myself, “If this sin is charged against me, how will I be able to be saved? Or how shall I make atonement to God for my completed sins? Or with what words shall I ask the Lord, that he may be propitious to me?”
translation:
  language: en
  text: After she said this, the heavens closed. I shook all over and was filled with grief. I thought, “If this sin is held against me, how can I be saved? How can I make atonement to God for all the sins I have committed? What can I say to ask the Lord to show me mercy?”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I was wholly trembling and grieving
  simplified_phrase: I shook all over and was filled with grief
  preserved_meaning: His whole person is overcome by trembling and sorrow.
  reasoning_layer_used: POB translation and immediate context
  rationale: The concrete wording makes both his physical trembling and deep grief clear.
- pob_phrase: my completed sins
  simplified_phrase: all the sins I have committed
  preserved_meaning: He refers to sins he has already committed.
  reasoning_layer_used: POB translation and grounding review
  rationale: The natural wording clarifies the time reference without changing the atonement question.
- pob_phrase: with what words shall I ask the Lord, that he may be propitious to me?
  simplified_phrase: What can I say to ask the Lord to show me mercy?
  preserved_meaning: He seeks words with which to plead for the Lord’s favorable mercy.
  reasoning_layer_used: POB translation and grounding review
  rationale: “Show me mercy” expresses “be propitious to me” in clear common English.
translation_notes:
  risk_flags:
  - risk: “Make atonement” may be unfamiliar to some readers.
    mitigation: It is retained because a broader phrase such as “make amends” could imply personal compensation and weaken the POB meaning.
