  text: Therefore those who lie reject the Lord and become defrauders of the Lord, not handing back to him the deposit that they received. For they received from him a spirit without falsehood. If they return it false, they have defiled the command of the Lord and have become defrauders.
translation:
  language: en
  text: So those who lie reject the Lord and cheat him, because they do not return what he entrusted to them as he gave it. They received from him a spirit free from falsehood. If they return that spirit corrupted by lies, they have defiled the Lord’s command and become cheats.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: become defrauders of the Lord
  simplified_phrase: cheat him
  preserved_meaning: Those who lie wrongfully withhold from the Lord what belongs to him.
  reasoning_layer_used: POB translation
  rationale: The common verb “cheat” clearly conveys the force of “defrauders.”
- pob_phrase: not handing back to him the deposit that they received
  simplified_phrase: do not return what he entrusted to them as he gave it
  preserved_meaning: The Lord gave them something in trust that they must return unspoiled.
  reasoning_layer_used: POB translation and source image
  rationale: This keeps the image of an entrusted deposit while avoiding opaque financial language.
- pob_phrase: If they return it false
  simplified_phrase: If they return that spirit corrupted by lies
  preserved_meaning: Lying spoils the originally falsehood-free spirit they received from the Lord.
  reasoning_layer_used: immediate POB context
  rationale: The recast sentence identifies the pronoun and makes the contrast with a falsehood-free spirit explicit.
interpretive_expansions:
- pob_phrase: return it false
  rendering: return that spirit corrupted by lies
  claim: Their lying corrupts the spirit that was given without falsehood.
  evidence:
  - The preceding sentence identifies the received deposit as a spirit without falsehood.
  - The paragraph directly connects lying with returning the entrusted spirit in a false condition.
  confidence: high
  alternatives_preserved:
  - return that spirit made false
translation_notes:
  risk_flags:
  - risk: “Cheat” may sound less formal than “defraud.”
    mitigation: The surrounding language about an entrusted deposit preserves the serious moral and theological charge.
