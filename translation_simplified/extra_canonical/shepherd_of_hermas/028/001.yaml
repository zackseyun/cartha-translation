  text: 'Again he says to me: “Love truth, and let all truth go forth from your mouth, so that the spirit which God has caused to dwell in this flesh may be found true before all people, and thus the Lord who dwells in you will be glorified; for the Lord is true in every word, and there is no falsehood with him.'
translation:
  language: en
  text: Again he said to me, “Love the truth, and always speak what is true, so that the spirit God has made to live in your body may be found truthful before everyone. In this way, the Lord who lives in you will be glorified. For the Lord is true in everything he says, and there is no falsehood in him.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: let all truth go forth from your mouth
  simplified_phrase: always speak what is true
  preserved_meaning: Every spoken word should be truthful.
  reasoning_layer_used: POB translation and immediate context
  rationale: The direct command clarifies the bodily idiom without weakening its force.
- pob_phrase: the spirit which God has caused to dwell in this flesh
  simplified_phrase: the spirit God has made to live in your body
  preserved_meaning: God has placed the spirit within the person’s bodily life.
  reasoning_layer_used: POB source-driven wording
  rationale: “Body” makes “flesh” clear while preserving the spirit-body distinction.
- pob_phrase: and thus the Lord who dwells in you will be glorified
  simplified_phrase: In this way, the Lord who lives in you will be glorified
  preserved_meaning: Truthful speech results in glory being given to the indwelling Lord.
  reasoning_layer_used: POB translation and independent grounding review
  rationale: The explicit connector preserves the result relationship, while “glorified” retains the specific glory language.
translation_notes:
  risk_flags:
  - risk: “Body” is less vivid than the source image of “flesh.”
    mitigation: It preserves the bodily sense and avoids suggesting sinful desire.
