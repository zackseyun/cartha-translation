  text: So when I heard these things, I wept greatly. But seeing me weeping, he says, ‘Why are you weeping?’ ‘Because, sir,’ I say, ‘I do not know whether I can be saved.’ ‘Why?’ he says. ‘For,’ I say, ‘sir, never yet in my life have I spoken a true word, but I have always lived deceitfully with everyone, and I made my lie appear true before all people; and no one ever contradicted me, but my word was believed. How then,’ I say, ‘sir, can I live, having done these things?’
translation:
  language: en
  text: 'When I heard this, I wept deeply. He saw me and asked, “Why are you weeping?”


    “Because, sir,” I answered, “I do not know whether I can be saved.”


    “Why not?” he asked.


    “Because, sir, I have never spoken a true word in my whole life. I have always deceived everyone. I made all my lies seem true, and no one ever challenged me; everyone believed what I said. After doing all this, sir, how can I live?”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I wept greatly
  simplified_phrase: I wept deeply
  preserved_meaning: He responded with intense sorrow.
  reasoning_layer_used: POB base text and immediate narrative context
  rationale: This expresses intense grief without adding a beginning or a particular kind of sorrow.
- pob_phrase: I have always lived deceitfully with everyone
  simplified_phrase: I have always deceived everyone
  preserved_meaning: His whole way of dealing with others was marked by deceit.
  reasoning_layer_used: POB base text
  rationale: The direct verb makes the confession easier to understand.
- pob_phrase: no one ever contradicted me, but my word was believed
  simplified_phrase: no one ever challenged me; everyone believed what I said
  preserved_meaning: His false claims went unopposed and were accepted as true.
  reasoning_layer_used: POB base text and clause contrast
  rationale: The recast wording keeps both parts of the contrast clear.
translation_notes:
  risk_flags:
  - risk: “How can I live?” may concern eternal life or salvation rather than merely continuing to exist.
    mitigation: The preceding question about salvation preserves the context without resolving the expression.
