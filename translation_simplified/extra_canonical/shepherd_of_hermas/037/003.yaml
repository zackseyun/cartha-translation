  simplified_phrase: You foolish man!
  preserved_meaning: The speaker sharply rebukes the man for failing to understand.
  reasoning_layer_used: POB translation and immediate context
  rationale: “Foolish” gives the rebuke in direct, common English.
- pob_phrase: do you not perceive
  simplified_phrase: Do you not understand
  preserved_meaning: The speaker challenges the man’s failure to grasp the point.
  reasoning_layer_used: POB translation
  rationale: “Understand” is clearer than the formal “perceive.”
- pob_phrase: destroys a person and wears away the Holy Spirit
