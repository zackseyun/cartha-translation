  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/005.yaml
  text: “Listen,” he says. “Those who have never inquired about the truth nor sought concerning the divine, but have only believed, and are mixed up with business affairs and wealth and pagan friendships and many other affairs of this age—so all who devote themselves to these do not understand the parables of the divine; for they are darkened by these pursuits and are corrupted and become barren. Just as good vineyards, when they are neglected, become barren from thorns and various weeds, so also the people who have believed and fall into these many pursuits just mentioned are led astray from their understanding, and they understand nothing at all about righteousness. And even when they hear about the divine and the truth, their mind is occupied with their business, and they understand nothing at all.
translation:
  language: en
  text: '“Listen,” he says. “Some people have never investigated the truth or tried to learn about the things of God. They have simply believed, while becoming entangled in business, wealth, friendships with pagans, and many other concerns of this age. Those who give themselves to such things do not understand the parables about the things of God. These pursuits darken and corrupt them until they bear no fruit.


    “Good vineyards become unfruitful when they are neglected and overgrown with thorns and all kinds of weeds. In the same way, believers who become caught up in the concerns I have mentioned are led astray from understanding. They understand nothing about righteousness. Even when they hear about the things of God and the truth, their minds remain occupied with business, so they understand nothing at all.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: have never inquired about the truth nor sought concerning the divine
  simplified_phrase: have never investigated the truth or tried to learn about the things of God
  preserved_meaning: They have not seriously pursued truth or knowledge of divine matters.
  reasoning_layer_used: POB translation and immediate context
  rationale: “Things of God” makes the abstract phrase “the divine” clear without limiting it to one doctrine.
- pob_phrase: are mixed up with business affairs and wealth and pagan friendships and many other affairs of this age
  simplified_phrase: becoming entangled in business, wealth, friendships with pagans, and many other concerns of this age
  preserved_meaning: Their attention is ensnared by worldly commitments and associations.
  reasoning_layer_used: POB wording and repeated pursuit motif
  rationale: “Entangled” naturally conveys distracting involvement without changing the listed concerns.
- pob_phrase: are darkened by these pursuits and are corrupted and become barren
  simplified_phrase: These pursuits darken and corrupt them until they bear no fruit
  preserved_meaning: The pursuits damage them and leave their faith unproductive.
  reasoning_layer_used: POB vineyard comparison
  rationale: “Bear no fruit” preserves the barrenness image and connects it to the vineyard comparison.
translation_notes:
  risk_flags:
  - risk: “Things of God” is more personal wording than the repeated POB phrase “the divine.”
    mitigation: The phrase remains broad and does not introduce a specific doctrine.
  - risk: “Bear no fruit” expresses barrenness through an agricultural image rather than the POB adjective.
    mitigation: The following vineyard comparison directly supports and preserves that image.
