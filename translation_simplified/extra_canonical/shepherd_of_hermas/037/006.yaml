base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/006.yaml
  text: “But those who have the fear of God and inquire about the divine and the truth and have their heart toward the Lord quickly understand and comprehend everything spoken to them, because they have the fear of the Lord within themselves; for where the Lord dwells, there also is abundant understanding. Therefore cling to the Lord, and you will understand and comprehend all things.”
translation:
  language: en
  text: But those who fear God, seek what is divine and what is true, and set their hearts on the Lord quickly understand everything they are told. They understand because the fear of the Lord is within them. Wherever the Lord lives, there is abundant understanding. So hold firmly to the Lord, and you will understand all things.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: inquire about the divine and the truth
  simplified_phrase: seek what is divine and what is true
  preserved_meaning: They actively pursue both divine things and truth without merging them.
  reasoning_layer_used: POB base text and grounding review
  rationale: The wording replaces abstract inquiry while keeping both objects distinct.
- pob_phrase: have their heart toward the Lord
  simplified_phrase: set their hearts on the Lord
  preserved_meaning: Their inner loyalty and attention are directed toward the Lord.
  reasoning_layer_used: POB base text and source-language image
  rationale: This keeps the heart image in natural modern English.
- pob_phrase: cling to the Lord
  simplified_phrase: hold firmly to the Lord
  preserved_meaning: They must remain closely and steadfastly attached to the Lord.
  reasoning_layer_used: POB base text
  rationale: The familiar wording preserves the force of clinging.
translation_notes:
  risk_flags:
  - risk: “What is divine” remains somewhat abstract for common readers.
    mitigation: It is retained because narrowing it further would go beyond the available reasoning.
