  yaml_path: translation/extra_canonical/shepherd_of_hermas/020/002.yaml
  text: “When an old man, having already given up hope for himself because of his weakness and his poverty, expects nothing else but the last day of his life; then, all at once, an inheritance is left to him. On hearing of it he is stirred up, and, becoming overjoyed, he puts on strength; he no longer lies down, but stands; his spirit—already corrupted by his former deeds—is renewed; and he no longer sits, but takes courage. So also you, when you heard the revelation that the Lord revealed to you.
translation:
  language: en
  text: “Picture an old man who has lost all hope because he is weak and poor. He expects nothing but the final day of his life. Then suddenly he learns that an inheritance has been left to him. The news stirs him, and joy fills him. He is clothed with strength. He no longer lies down, but stands up. His spirit, which his former deeds had already corrupted, is renewed. He no longer sits still, but takes courage. The same thing happened to you when you heard the revelation the Lord gave you.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: When an old man, having already given up hope for himself because of his weakness and his poverty, expects nothing else but the last day of his life
  simplified_phrase: Picture an old man who has lost all hope because he is weak and poor. He expects nothing but the final day of his life.
  preserved_meaning: Weakness and poverty have left the man without hope, expecting only death.
  reasoning_layer_used: POB main text and immediate comparison
  rationale: Two direct sentences replace the dense opening clause while retaining its causes and force.
- pob_phrase: On hearing of it he is stirred up, and, becoming overjoyed, he puts on strength
  simplified_phrase: The news stirs him, and joy fills him. He is clothed with strength.
  preserved_meaning: News of the inheritance fills him with joy and restores his vigor.
  reasoning_layer_used: POB source-driven imagery
  rationale: The sequence is clarified while the clothing image for strength is preserved without adding “new.”
- pob_phrase: So also you, when you heard the revelation that the Lord revealed to you
  simplified_phrase: The same thing happened to you when you heard the revelation the Lord gave you.
  preserved_meaning: The Lord’s revelation affected the addressee as the inheritance affected the old man.
  reasoning_layer_used: POB main text and analogy structure
  rationale: The compressed comparison becomes a complete English sentence without changing its point.
interpretive_expansions:
- pob_phrase: So also you, when you heard the revelation that the Lord revealed to you
  rendering: The same thing happened to you when you heard the revelation the Lord gave you.
  claim: The addressee experienced the renewal illustrated by the old man.
  evidence:
  - The words “So also you” directly apply the preceding comparison to the addressee.
  - The immediate context describes the old man’s revival after hearing good news.
  confidence: high
  alternatives_preserved:
  - The comparison may encompass the whole preceding sequence rather than one specific effect.
translation_notes:
  risk_flags:
  - risk: “The same thing happened to you” states the comparison’s implied result explicitly.
    mitigation: The immediate analogy supplies the result, and the wording does not define it more narrowly.
