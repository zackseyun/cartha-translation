  yaml_path: translation/extra_canonical/shepherd_of_hermas/020/003.yaml
  text: “For he had compassion on you and renewed your spirits, and you put away your softness; strength came to you and you were strengthened in faith; and when the Lord saw your strengthening, he rejoiced. For this reason he made known to you the building of the tower, and he will make other things known, if, with a whole heart, you are at peace among yourselves.”
translation:
  language: en
  text: For he had compassion on you and renewed your spirits. You cast aside your weakness, and strength came to you. You grew strong in faith, and when the Lord saw this, he rejoiced. That is why he showed you the tower being built. He will also reveal other things to you if you live at peace with one another wholeheartedly.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: you put away your softness
  simplified_phrase: You cast aside your weakness
  preserved_meaning: They abandoned the lack of resolve that had left them spiritually weak.
  reasoning_layer_used: POB text and immediate context
  rationale: “Weakness” makes the moral and spiritual sense of “softness” clear without sounding physical or childish.
- pob_phrase: strength came to you and you were strengthened in faith
  simplified_phrase: strength came to you. You grew strong in faith
  preserved_meaning: They received strength and became firmer in faith.
  reasoning_layer_used: POB clause structure
  rationale: Two short clauses preserve both the coming of strength and its effect on their faith.
- pob_phrase: the building of the tower
  simplified_phrase: the tower being built
  preserved_meaning: The Lord revealed the ongoing construction of the tower.
  reasoning_layer_used: POB source-driven image
  rationale: The active wording is easier to picture while retaining the tower-building image.
translation_notes:
  risk_flags:
  - risk: “Weakness” may cover a broader range than POB’s “softness.”
    mitigation: The surrounding references to strength and stronger faith keep the intended contrast clear.
  - risk: “Live at peace” states the condition more naturally than “are at peace.”
    mitigation: “With one another wholeheartedly” preserves both the communal and whole-heart requirements.
