  text: But in the second vision you saw her standing, with a countenance younger and more cheerful than before, though her flesh and her hair were older. “Listen,” she says, “to this parable also.
translation:
  language: en
  text: But in the second vision, you saw her standing there. Her face looked younger and happier than before, even though her body and hair looked older. She said, “Listen to this parable too.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: with a countenance younger and more cheerful than before
  simplified_phrase: Her face looked younger and happier than before
  preserved_meaning: Her facial appearance was younger and more cheerful than in the earlier vision.
  reasoning_layer_used: POB translation and immediate narrative context
  rationale: “Face looked” expresses the visual comparison more naturally than “with a countenance.”
- pob_phrase: though her flesh and her hair were older
  simplified_phrase: even though her body and hair looked older
  preserved_meaning: Her bodily appearance and hair still showed greater age despite her younger face.
  reasoning_layer_used: POB translation and source contrast
  rationale: “Body” makes the older sense of “flesh” clear while preserving the contrast in appearance.
- pob_phrase: “Listen,” she says, “to this parable also.”
  simplified_phrase: She said, “Listen to this parable too.”
  preserved_meaning: The woman directs him to hear an additional parable.
  reasoning_layer_used: POB translation and English discourse style
  rationale: Ordinary quotation order and “too” make the sentence easier to follow.
translation_notes:
  risk_flags:
  - risk: “Body” is broader than the POB word “flesh.”
    mitigation: The wording keeps hair separate and limits the statement to how she looked.
