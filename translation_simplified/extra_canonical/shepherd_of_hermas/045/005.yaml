  yaml_path: translation/extra_canonical/shepherd_of_hermas/045/005.yaml
  text: '"So also the devil comes upon all the slaves of God, testing them. Therefore, as many as are full in faith have strongly resisted him, and he withdraws from them, having no place where he may enter. He comes then to the empty ones; and having a place, he enters into them, and he does in them what he wishes, and they become enslaved to him."'
translation:
  language: en
  text: “In the same way, the devil comes against all God’s servants and tests them. Therefore, all who are full of faith have firmly resisted him. He withdraws from them, with no way to enter them. Then he comes to those who are empty. Finding a way in, he enters them and does whatever he wants in them. They become his servants.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the slaves of God
  simplified_phrase: God’s servants
  preserved_meaning: They belong to God and serve him.
  reasoning_layer_used: POB base text and immediate contrast
  rationale: “Servants” avoids distracting modern associations while the final sentence preserves the slavery contrast.
- pob_phrase: as many as are full in faith have strongly resisted him
  simplified_phrase: all who are full of faith have firmly resisted him
  preserved_meaning: Their fullness of faith is joined to strong, completed resistance.
  reasoning_layer_used: POB base text and grounding review
  rationale: Natural word order preserves both the fullness image and the completed aspect.
- pob_phrase: having no place where he may enter
  simplified_phrase: with no way to enter them
  preserved_meaning: The devil has no opening through which to enter them.
  reasoning_layer_used: POB base text and grounding review
  rationale: The spatial image remains clear without making it explicitly the cause of his withdrawal.
translation_notes:
  risk_flags:
  - risk: “Servants” softens the ownership force of the first slavery term.
    mitigation: The ending retains “They become his slaves” to preserve the passage’s stark contrast.
