  yaml_path: translation/extra_canonical/shepherd_of_hermas/045/002.yaml
  text: '"A person," I say, "Lord, is eager to keep the commandments of God, and there is no one who does not ask from the Lord to be strengthened in his commandments and to be subject to them; but the devil is harsh and tyrannizes them."'
translation:
  language: en
  text: I said, “Lord, people are eager to obey God’s commandments. Everyone asks the Lord to strengthen them so they can keep his commandments and submit to them. But the devil is cruel and rules over them like a tyrant.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: A person ... is eager to keep the commandments of God
  simplified_phrase: people are eager to obey God’s commandments
  preserved_meaning: People desire to do what God commands.
  reasoning_layer_used: POB translation
  rationale: The plural naturally expresses a person in general, and “obey” clarifies what keeping commandments means.
- pob_phrase: there is no one who does not ask from the Lord to be strengthened in his commandments and to be subject to them
  simplified_phrase: Everyone asks the Lord to strengthen them so they can keep his commandments and submit to them
  preserved_meaning: All such people ask for strength to keep the commandments and willingly place themselves under their authority.
  reasoning_layer_used: POB translation and grounding review
  rationale: The double negative becomes direct English while keeping strength and submission as distinct ideas.
- pob_phrase: the devil is harsh and tyrannizes them
  simplified_phrase: the devil is cruel and rules over them like a tyrant
  preserved_meaning: The devil exercises harsh, oppressive power over people.
  reasoning_layer_used: POB translation
  rationale: The wording explains “tyrannizes” while preserving the forceful image of a tyrant.
translation_notes:
  risk_flags:
  - risk: Changing singular “a person” to plural “people” may soften the individual framing.
    mitigation: The following universal statement supports generic plural wording without changing the scope.
