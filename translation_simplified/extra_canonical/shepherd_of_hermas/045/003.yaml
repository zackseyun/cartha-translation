  yaml_path: translation/extra_canonical/shepherd_of_hermas/045/003.yaml
  text: '"He is not able," he says, "to tyrannize the slaves of God—those who hope in him with their whole heart. The devil can wrestle against them, but he cannot overcome them. If, therefore, you resist him, defeated he will flee from you, disgraced. But those who are empty," he says, "are afraid of the devil as though he had power.'
translation:
  language: en
  text: “The devil cannot rule cruelly over God’s servants who hope in God with all their heart,” he says. “The devil can fight against them, but he cannot defeat them. So resist him, and he will flee from you in defeat and disgrace. But those who are empty inside,” he says, “are afraid of the devil as if he had power.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: tyrannize the slaves of God
  simplified_phrase: rule cruelly over God’s servants
  preserved_meaning: The devil cannot exercise oppressive mastery over those who belong to God.
  reasoning_layer_used: POB base text and source image
  rationale: “Rule cruelly” explains “tyrannize,” while “servants” preserves their belonging to God.
- pob_phrase: can wrestle against them
  simplified_phrase: can fight against them
  preserved_meaning: The devil can actively oppose God’s servants without conquering them.
  reasoning_layer_used: POB base text and immediate contrast
  rationale: “Fight” clearly preserves the struggle and its contrast with defeat.
- pob_phrase: defeated he will flee from you, disgraced
  simplified_phrase: he will flee from you in defeat and disgrace
  preserved_meaning: Resistance causes the devil to retreat as one defeated and shamed.
  reasoning_layer_used: POB syntax and imagery
  rationale: Natural English word order keeps both defeat and disgrace clear.
interpretive_expansions:
- pob_phrase: those who hope in him with their whole heart
  rendering: who hope in God with all their heart
  claim: The pronoun refers to God rather than the devil.
  evidence:
  - They are called God’s servants, and the passage contrasts their trust with fear of the devil.
  confidence: high
