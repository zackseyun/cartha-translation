  yaml_path: translation/extra_canonical/shepherd_of_hermas/045/004.yaml
  text: '"When a man fills very many clay jars with good wine, and among those jars a few are empty, he comes to the jars and does not inspect the full ones—for he knows they are full—but he inspects the empty ones, fearing lest they have turned sour; for empty jars quickly turn sour, and the pleasure of the wine is lost.'
translation:
  language: en
  text: “Suppose a man fills a great many clay jars with good wine, and a few of the jars are empty. When he comes to check the jars, he does not inspect the full ones, because he knows they are full. Instead, he inspects the empty ones, fearing that they may have turned sour. Empty jars quickly turn sour, and then the wine loses its pleasant taste.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: When a man fills very many clay jars with good wine, and among those jars a few are empty
  simplified_phrase: Suppose a man fills a great many clay jars with good wine, and a few of the jars are empty
  preserved_meaning: The illustration contrasts many wine-filled jars with a few jars that are empty, without saying the man deliberately left them empty.
  reasoning_layer_used: POB text and immediate illustration
  rationale: “Suppose” introduces the example naturally, while “are empty” reports only the jars’ condition.
- pob_phrase: he comes to the jars and does not inspect the full ones—for he knows they are full—but he inspects the empty ones
  simplified_phrase: When he comes to check the jars, he does not inspect the full ones, because he knows they are full. Instead, he inspects the empty ones
  preserved_meaning: The man inspects the empty jars rather than those he knows are full.
  reasoning_layer_used: POB clause structure and stated rationale
  rationale: Shorter sentences make the contrast and its reason easier to follow.
- pob_phrase: the pleasure of the wine is lost
  simplified_phrase: the wine loses its pleasant taste
  preserved_meaning: Souring ruins the wine’s enjoyable quality.
  reasoning_layer_used: POB source-driven sensory image
  rationale: “Pleasant taste” states the sensory result in common English.
