  text: So when I wanted to sit on the right side, she did not permit me, but motioned to me with her hand that I should sit on the left side. So as I reasoned and was grieved that she had not allowed me to sit on the right side, she says to me, “Are you grieved, Hermas? The place on the right side belongs to others—those who have already pleased God and suffered for the sake of the Name; but you lack many things to sit with them. But as you remain in your simplicity, remain, and you will sit with them, as will all who do their works and endure what they also endured.”
translation:
  language: en
  text: 'When I tried to sit on her right, she would not let me. Instead, she motioned with her hand for me to sit on her left. I wondered why she had not let me sit on her right, and I became upset.


    She said to me, “Why are you upset, Hermas? The place on the right is for others—for those who have already pleased God and suffered for the sake of the Name. You still lack much before you can sit with them. But continue to live in simplicity, as you do now, and you will sit with them. The same is true of everyone who does the works they did and endures what they endured.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: as I reasoned and was grieved
  simplified_phrase: I wondered why ... and I became upset
  preserved_meaning: Hermas reflects on the refusal and feels distressed by it.
  reasoning_layer_used: POB translation and immediate narrative context
  rationale: The wording expresses his thought and emotion in ordinary English.
- pob_phrase: you lack many things to sit with them
  simplified_phrase: You still lack much before you can sit with them
  preserved_meaning: Hermas is not yet ready to share their honored place.
  reasoning_layer_used: POB translation
  rationale: This removes an unnatural construction without specifying what he lacks.
- pob_phrase: as you remain in your simplicity, remain
  simplified_phrase: continue to live in simplicity, as you do now
  preserved_meaning: Hermas must persevere in his present simplicity.
  reasoning_layer_used: POB translation and source-driven repetition
  rationale: The command to persevere is expressed naturally while retaining the key term.
translation_notes:
  risk_flags:
  - risk: “Simplicity” may carry a richer moral sense than the modern word suggests.
    mitigation: The key term is retained rather than narrowed to innocence or sincerity.
  - risk: “The Name” may be unclear to readers unfamiliar with early Christian usage.
    mitigation: The capitalized title is preserved because the record does not identify its referent more explicitly.
