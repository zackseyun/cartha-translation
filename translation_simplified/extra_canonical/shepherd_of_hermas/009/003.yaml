  text: I asked her, saying, “Lady, to what place in the field?” “Wherever you wish,” she says. I chose a good, secluded spot. But before I spoke to her and named the place, she says to me, “I will come there where you wish.”
translation:
  language: en
  text: 'I asked her, “Lady, where in the field should we meet?”


    “Wherever you choose,” she replied.


    I chose a pleasant, secluded spot. But before I could tell her where it was, she said, “I will meet you wherever you choose.”'
