  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/006.yaml
  text: And she came with six young men—whom I had seen also before—and she stood by me and listened while I was praying and confessing my sins to the Lord. And touching me she says, “Hermas, stop asking everything about your sins; ask also about righteousness, so that you may receive some share of it for your household.”
translation:
  language: en
  text: She came with the six young men I had seen before. She stood beside me and listened as I prayed and confessed my sins to the Lord. Then she touched me and said, “Hermas, stop asking so much about your sins. Ask about righteousness too, so that you can obtain some share of it for your household.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: whom I had seen also before
  simplified_phrase: I had seen before
  preserved_meaning: Hermas recognized the same six young men from an earlier encounter.
  reasoning_layer_used: POB base text and narrative context
  rationale: The simpler clause removes awkward word order without changing who had been seen.
- pob_phrase: listened while I was praying and confessing my sins
  simplified_phrase: listened as I prayed and confessed my sins
  preserved_meaning: She heard Hermas address the Lord in prayer and confess his sins.
  reasoning_layer_used: POB base text
  rationale: Finite verbs make the action easier to follow while preserving both prayer and confession.
- pob_phrase: stop asking everything about your sins; ask also about righteousness
  simplified_phrase: stop asking so much about your sins. Ask about righteousness too
  preserved_meaning: Hermas must not focus all his requests on sin but must also seek righteousness.
  reasoning_layer_used: POB base text and discourse contrast
  rationale: The contrast is stated in natural English without merging sins and righteousness into one idea.
translation_notes:
  risk_flags:
  - risk: “So much” may sound like a judgment about quantity rather than an all-consuming focus on sins.
    mitigation: The following command to ask about righteousness too preserves the POB contrast.
