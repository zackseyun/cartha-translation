  text: So I went, brothers, into the field, and I counted the hours, and I came to the place where I had directed her to come; and I see an ivory couch set there, and upon the couch there lay a linen pillow, and on top a spread-out towel of fine linen.
translation:
  language: en
  text: So, brothers, I went into the field. I kept track of the hours and arrived at the place where I had told her to meet me. There I saw an ivory couch. A linen cushion lay on it, and above it was a piece of fine linen spread out.
  philosophy: optimal-equivalence
