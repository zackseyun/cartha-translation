  text: While she was speaking with me, two men appeared, lifted her by the elbows, and went away to where the chair also was, toward the east. She went away cheerful, and as she was going she said to me, "Take courage, Hermas."
translation:
  language: en
  text: While she was talking with me, two men appeared. They lifted her by the elbows and took her east, to where the chair was. She was cheerful as she left, and on her way she said to me, “Take courage, Hermas.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: While she was speaking with me
  simplified_phrase: While she was talking with me
  preserved_meaning: She was still conversing with Hermas when the men appeared.
  reasoning_layer_used: POB translation and immediate narrative context
  rationale: “Talking” is more natural in modern narrative English than “speaking with.”
- pob_phrase: went away to where the chair also was, toward the east
  simplified_phrase: took her east, to where the chair was
  preserved_meaning: The men moved her to the eastern place where the chair was located.
  reasoning_layer_used: POB translation and source clause sequence
  rationale: The destination and eastward direction are stated directly without the awkward “also was” construction.
- pob_phrase: She went away cheerful, and as she was going
  simplified_phrase: She was cheerful as she left, and on her way
  preserved_meaning: She departed cheerfully and spoke during her departure.
  reasoning_layer_used: POB translation and cross-check high agreement
  rationale: The repeated departure wording is recast as smooth, ordinary English.
translation_notes:
  risk_flags:
  - risk: “Took her” may suggest more control than the POB’s second “went away.”
    mitigation: The preceding statement that they lifted her by the elbows keeps the physical movement explicit without adding a motive.
