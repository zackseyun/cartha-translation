  simplified_phrase: The black part represents this world
  preserved_meaning: The black portion symbolizes the present world.
  reasoning_layer_used: POB translation and immediate symbolic context
  rationale: “Represents” clearly signals the vision’s symbolism.
- pob_phrase: those who remain and are burned by it
  simplified_phrase: Those who remain and are burned by the fire
  preserved_meaning: Those who remain through the burning will be purified.
  reasoning_layer_used: POB translation and gold-refining image
  rationale: Naming the fire clarifies the pronoun without adding a posture of perseverance.
- pob_phrase: gold casts off its dross
  simplified_phrase: gold sheds its impurities
  preserved_meaning: Refining removes what is impure from gold.
  reasoning_layer_used: POB source image
  rationale: “Impurities” explains “dross” while preserving the refining image.
