  yaml_path: translation/extra_canonical/shepherd_of_hermas/024/004.yaml
  text: '"You, therefore, do not cease speaking in the ears of the holy ones. You also have the pattern of the great tribulation that is coming; but if you are willing, it will be nothing. Remember the things written beforehand."'
translation:
  language: en
  text: “So do not stop speaking to the holy people. You also have a picture of the great suffering that is coming. But if you are willing, it will be nothing for you. Remember what was written before.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: do not cease speaking in the ears of the holy ones
  simplified_phrase: do not stop speaking to the holy people
  preserved_meaning: The command to keep addressing the holy community remains direct and ongoing.
  reasoning_layer_used: POB translation and immediate syntax
  rationale: Natural English removes the opaque ear idiom without weakening the command.
- pob_phrase: the pattern of the great tribulation that is coming
  simplified_phrase: a picture of the great suffering that is coming
  preserved_meaning: The hearer has a representation of severe suffering still to come.
  reasoning_layer_used: POB source-driven wording and grounding review
  rationale: “Picture” preserves the representative image, while “suffering” clarifies tribulation without adding a time period.
- pob_phrase: the things written beforehand
  simplified_phrase: what was written before
  preserved_meaning: The hearer must remember prior written instruction.
  reasoning_layer_used: POB translation and discourse context
  rationale: The ordinary wording preserves the reference to earlier writing.
translation_notes:
  risk_flags:
  - risk: “If you are willing” does not specify what willing response is required.
    mitigation: The wording preserves the POB ambiguity rather than adding an unsupported action.
  - risk: “It will be nothing for you” remains broad and somewhat unusual.
    mitigation: This smoother wording avoids narrowing the assurance to one result such as freedom from harm.
