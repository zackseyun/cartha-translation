  text: She laughed and says to me, "Evil desire has risen up into your heart. Or does it not seem to you to be a wicked thing for a righteous man if evil desire rises into his heart? It is indeed a sin—and a great one, she says. For a righteous man plans what is righteous. Therefore, in planning what is righteous, his glory is established in the heavens, and he has the Lord readily reconciled in every matter of his. But those who plan evil in their hearts bring upon themselves death and captivity—especially those who secure this present age for themselves, who exult in their wealth, and who do not hold fast to the good things that are coming.
translation:
  language: en
  text: She laughed and said to me, “An evil desire has risen in your heart. Do you not think it is wicked for an evil desire to rise in the heart of a righteous person? It is indeed a sin—and a serious one,” she said. “A righteous person plans to do what is right. By doing so, that person’s honor is made secure in heaven, and the Lord is ready to be reconciled with that person in every matter. But those who plan evil in their hearts bring death and captivity on themselves. This is especially true of those who seek security in this present age, boast in their wealth, and do not hold firmly to the good things that are coming.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: For a righteous man plans what is righteous.
  simplified_phrase: A righteous person plans to do what is right.
  preserved_meaning: A righteous person directs his or her intentions toward righteous action.
  reasoning_layer_used: POB translation
  rationale: The rewrite replaces a repetitive abstract expression with direct modern wording.
- pob_phrase: his glory is established in the heavens
  simplified_phrase: that person’s honor is made secure in heaven
  preserved_meaning: The righteous person’s heavenly honor is firmly established.
  reasoning_layer_used: POB translation
  rationale: “Made secure” clearly expresses establishment without weakening its heavenly setting.
- pob_phrase: those who secure this present age for themselves, who exult in their wealth
  simplified_phrase: those who seek security in this present age, boast in their wealth
  preserved_meaning: They rely on the present age and take pride in material wealth.
  reasoning_layer_used: POB translation and immediate context
  rationale: The wording makes the attachment to present wealth understandable while retaining both ideas.
translation_notes:
  risk_flags:
  - risk: “Seek security” may narrow the unusual phrase “secure this present age for themselves.”
    mitigation: The wording remains tied to the present age and is immediately qualified by boasting in wealth.
  - risk: “Ready to be reconciled” remains less idiomatic than a paraphrase such as “ready to forgive.”
    mitigation: The wording preserves POB’s reconciliation concept without reducing it to one possible implication.
