  edition: POB
  yaml_path: translation/extra_canonical/shepherd_of_hermas/001/003.yaml
  text: '"Their souls will repent—those who have no hope, but have despaired of themselves and of their life. But you—pray to God, and he will heal your sins, and those of your whole household, and of all the holy ones."'
translation:
  language: en
  text: “Those who have no hope and have given up on themselves and their lives will repent. But as for you, pray to God. He will heal your sins, the sins of your whole household, and the sins of all the holy ones.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Their souls will repent—those who have no hope
  simplified_phrase: Those who have no hope ... will repent
  preserved_meaning: The hopeless people themselves will turn in repentance.
  reasoning_layer_used: POB translation and immediate syntax
  rationale: The natural subject-first order removes the awkward interruption without changing who repents.
- pob_phrase: have despaired of themselves and of their life
  simplified_phrase: have given up on themselves and their lives
  preserved_meaning: They have lost hope concerning both themselves and their lives.
  reasoning_layer_used: POB controlling meaning
  rationale: Common wording replaces the formal expression while keeping both objects of despair.
- pob_phrase: But you—pray to God
  simplified_phrase: But as for you, pray to God
  preserved_meaning: The speaker contrasts the hearer’s duty with the hopeless people just mentioned.
  reasoning_layer_used: POB discourse structure
  rationale: The explicit transition expresses the contrast naturally in modern English.
translation_notes:
  risk_flags:
  - risk: “Heal your sins” is unusual English and may sound less direct than “forgive your sins.”
    mitigation: The wording is retained to preserve POB’s source-driven healing image rather than replacing it with a different theological term.
