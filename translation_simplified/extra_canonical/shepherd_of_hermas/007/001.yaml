  yaml_path: translation/extra_canonical/shepherd_of_hermas/007/001.yaml
  text: But you, Hermas, no longer bear a grudge against your children, nor allow your sister to continue, so that they may be cleansed from their former sins. For they will be disciplined with righteous discipline, if you do not bear a grudge against them. Bearing a grudge produces death. But you, Hermas, have had great personal tribulations because of the transgressions of your household, because you did not care for them, but neglected them and became entangled in your wicked business dealings.
translation:
  language: en
  text: 'But you, Hermas, must no longer hold a grudge against your children. Do not let your sister go on as she has been, so that they may be cleansed from their former sins. They will receive just discipline if you do not hold a grudge against them. Holding a grudge leads to death.


    Hermas, you have suffered great personal troubles because of the sins of your household. You did not care for them but neglected them, and you became caught up in your wicked business dealings.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: nor allow your sister to continue
  simplified_phrase: Do not let your sister go on as she has been
  preserved_meaning: Hermas must stop his sister from continuing her previous conduct, though that conduct remains unspecified.
  reasoning_layer_used: POB text and documented ambiguity
  rationale: The wording completes the thought without inventing the conduct involved.
- pob_phrase: they will be disciplined with righteous discipline
  simplified_phrase: They will receive just discipline
  preserved_meaning: Their correction will be morally right and deserved.
  reasoning_layer_used: POB controlling meaning
  rationale: This removes awkward repetition while retaining both discipline and its justice.
- pob_phrase: became entangled in your wicked business dealings
  simplified_phrase: became caught up in your wicked business dealings
  preserved_meaning: Hermas became deeply involved in morally wrong commercial activity.
  reasoning_layer_used: POB controlling meaning
  rationale: The common idiom preserves the image of constraining involvement.
interpretive_expansions:
- pob_phrase: allow your sister to continue
  rendering: let your sister go on as she has been
  claim: The continuation concerns her existing course of conduct.
  evidence:
  - The POB implies prior conduct but does not identify it.
  confidence: moderate
  alternatives_preserved:
  - The nature of her conduct remains unstated.
  - The wording does not define her relationship to the children.
translation_notes:
  risk_flags:
  - risk: “Leads to death” is slightly less directly causative than “produces death.”
    mitigation: The sentence still presents death as the grave outcome of holding a grudge.
  - risk: The antecedent of “they” may include both the children and the sister.
    mitigation: The plural pronoun is retained without narrowing its reference.
