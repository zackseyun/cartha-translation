  yaml_path: translation/extra_canonical/shepherd_of_hermas/007/002.yaml
  text: But what saves you is that you did not depart from the living God, and your simplicity and great self-control. These have saved you, if you continue in them, and they save all who do such things and who walk in innocence and simplicity. These prevail over all wickedness and remain unto eternal life.
translation:
  language: en
  text: But you are saved because you did not turn away from the living God, and because of your simplicity and great self-control. These qualities save you if you continue to live by them. They save everyone who does these things and walks in innocence and simplicity. They overcome all wickedness and endure into eternal life.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: what saves you is that you did not depart from the living God
  simplified_phrase: you are saved because you did not turn away from the living God
  preserved_meaning: Not abandoning the living God is presented as a continuing reason for salvation.
  reasoning_layer_used: POB translation and independent grounding review
  rationale: Present-tense wording preserves the passage’s ongoing, conditional force.
- pob_phrase: These have saved you, if you continue in them
  simplified_phrase: These qualities save you if you continue to live by them
  preserved_meaning: Simplicity and self-control save only as the person continues in them.
  reasoning_layer_used: POB translation and immediate context
  rationale: Naming the qualities and saying “live by them” makes the condition easy to follow.
- pob_phrase: These prevail over all wickedness and remain unto eternal life
  simplified_phrase: They overcome all wickedness and endure into eternal life
  preserved_meaning: These qualities defeat wickedness and continue toward eternal life.
  reasoning_layer_used: POB translation and preserved source-language imagery
  rationale: Common verbs retain the images of victory and endurance.
translation_notes:
  risk_flags:
  - risk: Readers may mistake “simplicity” for lack of intelligence.
    mitigation: Its pairing with innocence and self-control signals an ethical quality.
