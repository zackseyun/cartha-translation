  yaml_path: translation/extra_canonical/shepherd_of_hermas/007/004.yaml
  text: 'And you shall say to Maximus: Behold, tribulation is coming, if it seems good to you to deny again. The Lord is near to those who turn to him, as it is written in Eldad and Modat, who prophesied to the people in the wilderness.'
translation:
  language: en
  text: 'Say to Maximus: “Be warned: suffering is coming if you choose to deny again. The Lord is near to those who turn to him. This is written in Eldad and Modat, who prophesied to the people in the wilderness.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And you shall say to Maximus
  simplified_phrase: Say to Maximus
  preserved_meaning: The speaker commands that this message be delivered directly to Maximus.
  reasoning_layer_used: POB translation and immediate syntax
  rationale: The direct command is clearer without the formal future construction.
- pob_phrase: Behold, tribulation is coming
  simplified_phrase: 'Be warned: suffering is coming'
  preserved_meaning: Maximus faces an urgent warning of approaching affliction.
  reasoning_layer_used: POB translation and discourse context
  rationale: “Be warned” preserves the force of “Behold,” while “suffering” makes “tribulation” immediately understandable.
- pob_phrase: if it seems good to you to deny again
  simplified_phrase: if you choose to deny again
  preserved_meaning: The coming suffering is linked to Maximus choosing to deny again.
  reasoning_layer_used: POB translation and clause relationship
  rationale: The rewrite expresses the same deliberate choice in ordinary English.
translation_notes:
  risk_flags:
  - risk: “Suffering” may sound broader than the more intense “tribulation.”
    mitigation: The warning formula and the statement that it is coming retain the seriousness of the threat.
