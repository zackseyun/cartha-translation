  text: 5. So then, having been crowned against it, come to the desire for righteousness, and, handing over to it the victory you received, serve it as it wills. If you serve the good desire and submit to it, you will be able to master the evil desire and to subject it as you wish.
translation:
  language: en
  text: 5. So, after defeating the evil desire and receiving the victor’s crown, turn to the desire for righteousness. Give it the victory you have won, and serve it as it directs you. If you serve this good desire and submit to it, you will be able to master the evil desire and keep it under your control.
