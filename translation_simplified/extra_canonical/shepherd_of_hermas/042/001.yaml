  yaml_path: translation/extra_canonical/shepherd_of_hermas/042/001.yaml
  text: Foremost of all is desire for another’s wife or husband, and for the luxury of wealth, and for many vain foods and drunken drinks, and for many other foolish indulgences; for every indulgence is foolish and empty for the slaves of God.
translation:
  language: en
  text: Foremost among these desires are wanting someone else’s spouse, craving the luxury that wealth brings, wanting many unnecessary foods and intoxicating drinks, and pursuing many other foolish pleasures. Every such pleasure is foolish and empty for God’s servants.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: desire for another’s wife or husband
  simplified_phrase: wanting someone else’s spouse
  preserved_meaning: It retains desire for another person’s wife or husband.
  reasoning_layer_used: POB translation
  rationale: “Spouse” expresses both wife and husband in familiar language.
- pob_phrase: the luxury of wealth
  simplified_phrase: the luxury that wealth brings
  preserved_meaning: It preserves the attraction of luxury associated with wealth.
  reasoning_layer_used: POB translation
  rationale: The added clause makes the relationship between wealth and luxury clear.
- pob_phrase: many vain foods and drunken drinks
  simplified_phrase: many unnecessary foods and intoxicating drinks
  preserved_meaning: It keeps the foods’ emptiness distinct from the drinks’ intoxicating character.
  reasoning_layer_used: POB translation and grounding review
  rationale: The wording avoids recasting the phrase as excessive consumption.
interpretive_expansions:
- pob_phrase: vain foods
  rendering: unnecessary foods
  claim: The foods are portrayed as empty or needless indulgences, not merely as excessive quantities.
  evidence:
  - The POB separately describes the foods as “vain” and as “many.”
  confidence: moderate
  alternatives_preserved:
  - empty foods
  - frivolous foods
translation_notes:
  risk_flags:
  - risk: “Unnecessary” gives a specific plain-language sense to the broad word “vain.”
    mitigation: The final sentence retains the POB’s wider judgment that every such pleasure is foolish and empty.
  - risk: “Spouse” compresses the explicit pair “wife or husband.”
    mitigation: The inclusive term preserves both members of the pair.
