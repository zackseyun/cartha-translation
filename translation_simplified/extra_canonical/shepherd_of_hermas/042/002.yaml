  text: 2. These, then, are evil desires, putting the slaves of God to death. For this evil desire is the devil’s daughter. Therefore one must abstain from evil desires, so that, by abstaining, you may live to God.
translation:
  language: en
  text: 2. These are evil desires that kill God’s servants. Evil desire is the devil’s daughter. So you must stay away from evil desires. By doing so, you may live for God.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: putting the slaves of God to death
  simplified_phrase: that kill God’s servants
  preserved_meaning: Evil desires actively kill those who belong to God.
  reasoning_layer_used: POB translation and independent grounding review
  rationale: “Kill” preserves the force of the lethal action, while “servants” is natural modern English.
- pob_phrase: one must abstain from evil desires
  simplified_phrase: you must stay away from evil desires
  preserved_meaning: The reader is required to avoid and reject evil desires.
  reasoning_layer_used: POB translation
  rationale: The direct command replaces formal impersonal wording without weakening its force.
- pob_phrase: so that, by abstaining, you may live to God
  simplified_phrase: By doing so, you may live for God
  preserved_meaning: Avoiding evil desires enables a life directed toward God.
  reasoning_layer_used: POB translation and clause logic
  rationale: The shorter sentence clarifies the purpose without needlessly repeating the command.
translation_notes:
  risk_flags:
  - risk: “Live for God” may sound more purpose-oriented than the unusual phrase “live to God.”
    mitigation: The rendering keeps God as the direction and goal of the person’s life.
  - risk: The metaphor “the devil’s daughter” may surprise modern readers.
    mitigation: It is retained because it presents evil desire as arising from and sharing the devil’s character.
