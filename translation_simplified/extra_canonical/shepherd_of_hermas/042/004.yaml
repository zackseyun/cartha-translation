  text: 4. But you—put on the desire for righteousness, and, having armed yourself with the fear of the Lord, resist them. For the fear of God dwells in the good desire. If the evil desire sees you armed with the fear of God and resisting it, it will flee far away from you, and it will no longer appear to you, being afraid of your weapons.
translation:
  language: en
  text: 4. But you must clothe yourself with the desire to do what is right. Arm yourself with fear of the Lord, and resist evil desires. For fear of God lives within the good desire. When an evil desire sees that you are armed with fear of God and are resisting it, it will run far away. It will no longer show itself to you, because it is afraid of your weapons.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: put on the desire for righteousness
  simplified_phrase: clothe yourself with the desire to do what is right
  preserved_meaning: The clothing image and the active pursuit of righteousness are both retained.
  reasoning_layer_used: POB text and source-image guardrail
  rationale: The wording explains righteousness while preserving the command to put it on like clothing.
- pob_phrase: having armed yourself with the fear of the Lord, resist them
  simplified_phrase: Arm yourself with fear of the Lord, and resist evil desires
  preserved_meaning: Fear of the Lord remains defensive equipment used to oppose evil desires.
  reasoning_layer_used: Immediate POB context
  rationale: Naming evil desires makes the plural object clear without weakening the battle image.
- pob_phrase: it will no longer appear to you, being afraid of your weapons
  simplified_phrase: It will no longer show itself to you, because it is afraid of your weapons
  preserved_meaning: Evil desire withdraws because it fears the believer's spiritual defenses.
  reasoning_layer_used: POB clause relationship
  rationale: A direct cause clause replaces the awkward participial construction.
interpretive_expansions:
- pob_phrase: resist them
  rendering: resist evil desires
  claim: The object of resistance is the evil desires discussed in the passage.
  evidence:
  - The next sentence refers to “the evil desire” as the opposing force.
  confidence: high
