  text: “As to former ignorances,” he says, “God alone is able to give healing concerning them; for all authority is his. But now guard yourself, and the Lord, the Almighty—being full of compassion—will give healing for former ignorances, if from now on you do not defile your flesh or the spirit; for both are shared and cannot be defiled apart from one another. Therefore keep both pure, and you will live to God.”
translation:
  language: en
  text: “As for your past ignorance,” he said, “God alone can heal you of it, because all authority belongs to him. But from now on, guard yourself. The Lord Almighty is full of compassion, and he will heal you of your past ignorance if you no longer defile your body or your spirit. They belong together, so you cannot defile one without defiling the other. Therefore, keep both pure, and you will live for God.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: give healing concerning them
  simplified_phrase: heal you of it
  preserved_meaning: God alone can remedy the person’s past ignorance.
  reasoning_layer_used: POB translation and healing image
  rationale: The active wording is natural English while retaining the image of healing.
- pob_phrase: your flesh or the spirit
  simplified_phrase: your body or your spirit
  preserved_meaning: Both the physical and spiritual aspects of the person must remain pure.
  reasoning_layer_used: immediate POB context
  rationale: “Body” makes the bodily sense of “flesh” clear without merging it with spirit.
- pob_phrase: both are shared and cannot be defiled apart from one another
  simplified_phrase: They belong together, so you cannot defile one without defiling the other
  preserved_meaning: Body and spirit are joined, and defilement of either affects both.
  reasoning_layer_used: POB clause logic
  rationale: The recast sentence states the same connection in ordinary English.
translation_notes:
  risk_flags:
  - risk: “Ignorance” may include wrongs committed without knowledge, not merely lack of information.
    mitigation: The main text retains POB’s broader term rather than narrowing it to sins.
  - risk: “Live for God” may sound mainly like a moral purpose rather than POB’s compressed “live to God.”
    mitigation: The wording remains close to POB while using an intelligible English expression.
