  text: “But if, Sir,” I say, “there has been some former ignorance before these words were heard, how will the man who has defiled his flesh be saved?”
translation:
  language: en
  text: “But, sir,” I asked, “what if someone was ignorant before hearing these words? If that person has defiled their body, how can they be saved?”
  philosophy: optimal-equivalence
