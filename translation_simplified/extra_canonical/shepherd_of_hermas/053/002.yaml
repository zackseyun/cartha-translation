  yaml_path: translation/extra_canonical/shepherd_of_hermas/053/002.yaml
  text: '“Listen now,” he says: “Keep this flesh of yours pure and undefiled, so that the spirit that dwells in it may bear witness to it, and your flesh may be justified. Watch lest it ever rise up in your heart that this flesh of yours is perishable, and you misuse it in some defilement. For if you defile your flesh, you will also defile the Holy Spirit; and if you defile the flesh, you will not live.”'
translation:
  language: en
  text: He says, “Listen now. Keep your body pure and undefiled, so that the spirit living in it may testify for your body, and your body may be shown to be right. Never let yourself think, ‘My body will perish anyway,’ and use that as an excuse to defile it. If you defile your body, you will also defile the Holy Spirit. And if you defile your body, you will not live.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: this flesh of yours
  simplified_phrase: your body
  preserved_meaning: The person’s physical body remains the object of the commands and warnings.
  reasoning_layer_used: POB translation and immediate context
  rationale: “Body” gives the contextual sense of “flesh” in familiar modern English.
- pob_phrase: the spirit that dwells in it may bear witness to it, and your flesh may be justified
  simplified_phrase: the spirit living in it may testify for your body, and your body may be shown to be right
  preserved_meaning: The spirit may testify on the body’s behalf, with the result that the body may be justified.
  reasoning_layer_used: POB wording and grounding review
  rationale: This keeps the testimony unspecified and preserves the contingent force of both clauses.
- pob_phrase: Watch lest it ever rise up in your heart that this flesh of yours is perishable, and you misuse it in some defilement
  simplified_phrase: Never let yourself think, ‘My body will perish anyway,’ and use that as an excuse to defile it
  preserved_meaning: The body’s mortality must not be treated as permission for impure conduct.
  reasoning_layer_used: POB syntax and immediate argument
  rationale: Direct-thought wording makes the warning and its logic clear.
interpretive_expansions:
- pob_phrase: and you misuse it in some defilement
  rendering: and use that as an excuse to defile it
  claim: The thought of bodily perishability becomes the grounds for defiling the body.
  evidence:
  - The warning directly joins the thought that the body is perishable with its misuse in defilement.
  confidence: high
  alternatives_preserved:
  - The clause may describe consequence rather than a consciously stated excuse.
translation_notes:
  risk_flags:
  - risk: Rendering “flesh” as “body” may soften the repeated source-language image.
    mitigation: The physical focus and every warning about defiling the body remain explicit.
  - risk: The relation between the indwelling spirit and the Holy Spirit is not explained in the POB record.
    mitigation: The draft preserves the differing capitalization without identifying them further.
