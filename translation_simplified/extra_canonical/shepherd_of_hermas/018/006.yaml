  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/006.yaml
  text: 'About these things I was very much distressed, wanting to know this revelation. And I see the aged woman in a vision of the night, saying to me: “Every inquiry has need of humility; therefore fast, and you will receive what you ask from the Lord.” So I fasted one day, and on that very night a young man appeared to me and said to me: “Since you are asking for revelations in prayer, watch lest by asking for many things you harm your flesh. These revelations are sufficient for you. Are you able to see revelations more powerful than those you have seen?”'
translation:
  language: en
  text: 'I was deeply troubled about these things because I wanted to understand the revelation. Then, in a vision at night, I saw the elderly woman. She said to me, “Anyone who seeks an answer must be humble. So fast, and the Lord will give you what you ask for.”


    I fasted for one day. That very night, a young man appeared to me and said, “Since you are asking for revelations in prayer, be careful. If you ask for too many things, you may harm your body. The revelations you have received are enough for you. Are you able to see revelations more powerful than those you have already seen?”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: wanting to know this revelation
  simplified_phrase: because I wanted to understand the revelation
  preserved_meaning: He is distressed because he wants to grasp the revelation’s meaning.
  reasoning_layer_used: POB translation and immediate context
  rationale: “Understand” gives the contextual sense of “know” in natural English.
- pob_phrase: Every inquiry has need of humility
  simplified_phrase: Anyone who seeks an answer must be humble
  preserved_meaning: Seeking an answer requires humility.
  reasoning_layer_used: POB translation and discourse context
  rationale: The abstract statement becomes a clear personal principle without losing its force.
- pob_phrase: watch lest by asking for many things you harm your flesh
  simplified_phrase: be careful. If you ask for too many things, you may harm your body
  preserved_meaning: Asking for too many things may cause bodily harm.
  reasoning_layer_used: POB translation and source-language image
  rationale: “Be careful” states the warning naturally, while “body” preserves the concrete bodily sense of “flesh.”
translation_notes:
  risk_flags:
  - risk: “Seeking an answer” presents “inquiry” as a request for understanding.
    mitigation: The surrounding request for revelation and promised response from the Lord support this wording.
  - risk: The final question may imply endurance, but explicitly says “see.”
    mitigation: The text retains “see” so the contextual implication does not replace the source image or ambiguity.
