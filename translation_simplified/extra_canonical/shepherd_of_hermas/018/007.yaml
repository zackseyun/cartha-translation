  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/007.yaml
  text: 'And answering him I said, “Lord, this only I ask—that concerning the three forms of the aged woman the revelation may become complete.” He answered me and said: “How long will you be senseless? Rather, your double-mindednesses make you senseless, and your heart is not toward the Lord.”'
translation:
  language: en
  text: 'I replied, “Lord, I ask only one thing: please finish explaining the three forms in which the old woman appeared.”


    He answered, “How long will you remain without understanding? Your divided heart keeps you from understanding, and your heart is not set on the Lord.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: concerning the three forms of the aged woman the revelation may become complete
  simplified_phrase: please finish explaining the three forms in which the old woman appeared
  preserved_meaning: The speaker asks for a complete explanation of the woman’s three forms.
  reasoning_layer_used: POB translation and immediate visionary context
  rationale: The indirect request becomes a natural direct request while keeping its full subject.
- pob_phrase: How long will you be senseless?
  simplified_phrase: How long will you remain without understanding?
  preserved_meaning: The rebuke concerns an ongoing failure to understand.
  reasoning_layer_used: POB translation
  rationale: “Without understanding” states the rebuke clearly without the misleading modern sense of “senseless.”
- pob_phrase: your double-mindednesses make you senseless, and your heart is not toward the Lord
  simplified_phrase: Your divided heart keeps you from understanding, and your heart is not set on the Lord
  preserved_meaning: A wavering inner disposition causes the failure to understand and shows that the person is not directed toward the Lord.
  reasoning_layer_used: POB translation, immediate parallel, and grounding review
  rationale: “Divided heart” preserves the broad moral and spiritual force rather than narrowing it to thoughts.
