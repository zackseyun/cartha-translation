  text: Be made holy from all wickedness and from all crookedness. But you do not want to depart from your wickedness. Now then, listen to me and be at peace among yourselves, and look after one another and support one another; and do not alone partake of God’s creatures in an overflow of abundance, but share also with those who are in want. For some, from their many foods, bring weakness upon the flesh and ruin their flesh; but the flesh of those who do not have food is ruined because they do not have enough nourishment, and their body is destroyed. This lack of moderation then is harmful to you who have and do not share with those who lack. Look to the judgment that is coming. Therefore, you who are well-off, seek out the hungry while the tower is not yet finished; for after the tower has been finished you will want to do good, and you will not have a place. So watch, you who pride yourselves in your wealth, lest those in need should groan, and their groaning go up to the Lord, and you
    be shut out together with your useless goods outside the door of the tower.
translation:
  language: en
  text: 'Become holy, free from all wickedness and crooked behavior. But you do not want to leave your wicked ways. So listen to me now. Live in peace with one another. Care for each other and support each other. Do not keep enjoying the good things God created all by yourselves when you have far more than enough. Share them with people in need.


    Some people weaken and ruin their bodies by eating too much. But those who have no food waste away because they lack nourishment, and their bodies are destroyed. So this lack of self-control harms you who have plenty but do not share with those who lack. Remember the judgment that is coming.


    Therefore, those of you who are well-off must seek out the hungry before the tower is finished. Once it is finished, you will want to do good, but you will have no place. So be careful, you who take pride in your wealth. Do not let the needy groan because of you, so that their groaning rises to the Lord and you are shut outside the door of the tower with your useless possessions.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Be made holy from all wickedness and from all crookedness
  simplified_phrase: Become holy, free from all wickedness and crooked behavior
  preserved_meaning: The command calls for holiness free from evil and morally crooked conduct.
  reasoning_layer_used: POB translation and grounding review
  rationale: “Crooked behavior” remains broad rather than narrowing the term to dishonesty.
- pob_phrase: do not alone partake of God’s creatures in an overflow of abundance
  simplified_phrase: Do not keep enjoying the good things God created all by yourselves when you have far more than enough
  preserved_meaning: God’s created goods must not be selfishly consumed amid abundance.
  reasoning_layer_used: POB translation and immediate food context
  rationale: The rewrite preserves God as creator while making the warning about selfish abundance clear.
- pob_phrase: you will want to do good, and you will not have a place
  simplified_phrase: you will want to do good, but you will have no place
  preserved_meaning: After the tower is finished, the wealthy will lack a place in a sense the passage leaves open.
  reasoning_layer_used: POB translation and grounding review
  rationale: The spatial wording preserves its possible connection to both opportunity and the tower.
interpretive_expansions:
- pob_phrase: from their many foods, bring weakness upon the flesh and ruin their flesh
  rendering: weaken and ruin their bodies by eating too much
  claim: The bodily harm results from excessive eating rather than merely possessing many foods.
  evidence:
  - The sentence contrasts abundant food with having no food.
  - The following sentence calls the conduct a lack of moderation.
  confidence: high
