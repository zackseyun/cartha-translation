translation_notes:
  risk_flags:
  - risk: “Body” is broader than the concrete term “flesh.”
    mitigation: The wording keeps the contrast focused on her visible physical appearance.
  - risk: The precise endpoint of “to the end” is unstated.
    mitigation: The text retains “to the end” without identifying a particular endpoint.
