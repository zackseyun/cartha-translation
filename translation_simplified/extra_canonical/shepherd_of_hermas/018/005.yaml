  text: She appeared to me, brothers, in the first vision—the one last year—very aged and sitting on a chair. And in the second vision her appearance was younger, but her flesh and her hair were older, and as she stood she spoke to me; and she was more cheerful than before. And in the third vision she was wholly younger and most distinguished in beauty, only her hair was older; and she was cheerful to the end and was seated on a cushioned seat.
translation:
  language: en
  text: Brothers, in the first vision, which I had last year, she appeared to me as a very old woman sitting on a chair. In the second vision, she looked younger, though her body and hair still looked old. She stood as she spoke to me and was more cheerful than before. In the third vision, she looked young all over and was exceptionally beautiful; only her hair still looked old. She remained cheerful to the end and sat on a cushioned seat.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: in the first vision—the one last year—very aged
  simplified_phrase: in the first vision, which I had last year, she appeared to me as a very old woman
  preserved_meaning: The first vision occurred the previous year, and the woman appeared very old.
  reasoning_layer_used: POB translation and immediate narrative context
  rationale: The broken clause becomes a complete sentence while preserving its timing and description.
- pob_phrase: her flesh and her hair were older
  simplified_phrase: her body and hair still looked old
  preserved_meaning: Her bodily appearance and hair remained old despite her younger overall appearance.
  reasoning_layer_used: POB translation and contrast within the sentence
  rationale: “Body” expresses the visible contrast more naturally than the potentially misleading “flesh.”
- pob_phrase: wholly younger and most distinguished in beauty
  simplified_phrase: looked young all over and was exceptionally beautiful
  preserved_meaning: Her appearance was pervasively younger and strikingly beautiful, apart from her old-looking hair.
  reasoning_layer_used: POB translation, immediate contrast, and grounding review
  rationale: “Young all over” preserves the extensive renewal without turning the comparative description into an absolute claim.
interpretive_expansions:
- pob_phrase: she was cheerful to the end
  rendering: She remained cheerful to the end
  claim: Her cheerful state continued through the unspecified endpoint.
  evidence:
  - The phrase “to the end” indicates that her cheerfulness continued.
  confidence: high
  alternatives_preserved:
