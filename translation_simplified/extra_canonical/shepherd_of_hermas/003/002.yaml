  yaml_path: translation/extra_canonical/shepherd_of_hermas/003/002.yaml
  text: But the Lord’s abundant compassion has had mercy on you and your household, and he will strengthen you and establish you in his glory. Only do not be slothful, but take heart and strengthen your household. For, as the blacksmith hammering his work masters the thing he intends, so also the righteous word spoken daily prevails over every wickedness. Do not, therefore, cease admonishing your children; for I know that if they repent with their whole heart, they will be written in the books of life with the holy ones.
translation:
  language: en
  text: But the Lord, in his great compassion, has shown mercy to you and your household. He will make you strong and keep you firm in his glory. Do not be idle. Take courage and strengthen your household. Just as a blacksmith controls and shapes his work by striking it with a hammer, so the righteous word, spoken every day, overcomes every kind of wickedness. Therefore, never stop warning and instructing your children. I know that if they repent with all their heart, they will be written in the books of life among the holy ones.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the Lord’s abundant compassion has had mercy on you
  simplified_phrase: the Lord, in his great compassion, has shown mercy to you
  preserved_meaning: The Lord’s great compassion is the source of his mercy.
  reasoning_layer_used: POB translation
  rationale: The rewrite avoids repetitive wording while retaining both compassion and mercy.
- pob_phrase: do not be slothful, but take heart
  simplified_phrase: Do not be idle. Take courage
  preserved_meaning: The hearer must reject inaction and respond courageously.
  reasoning_layer_used: POB translation
  rationale: Common words and short sentences make both commands clear.
- pob_phrase: as the blacksmith hammering his work masters the thing he intends
  simplified_phrase: Just as a blacksmith controls and shapes his work by striking it with a hammer
  preserved_meaning: Repeated hammering gives the blacksmith mastery over the work being formed.
  reasoning_layer_used: source-language image preserved through POB
  rationale: The concrete image remains while its action is expressed in natural English.
translation_notes:
  risk_flags:
  - risk: “Keep you firm in his glory” remains a dense religious expression.
    mitigation: It preserves the POB promise without defining glory more narrowly than the record allows.
  - risk: “Warning and instructing” divides the broad idea of admonishing into two actions.
    mitigation: Together they preserve its warning, urging, and teaching force without limiting it to correction.
