  yaml_path: translation/extra_canonical/shepherd_of_hermas/003/004.yaml
  text: “Behold, the God of hosts, who by his invisible and mighty power and by his great understanding created the world, and by his glorious counsel adorned his creation with beauty, and by his mighty word fixed the heaven and founded the earth upon the waters, and by his own wisdom and providence created his holy church, which also he blessed—behold, he is moving the heavens and the mountains and the hills and the seas, and all things become level for his elect, in order that he may give to them the promise which he promised with much glory and joy, if they keep the statutes of God which they received with great faith.”
translation:
  language: en
  text: '“Look! God, Lord of the heavenly armies, created the world by his unseen, mighty power and his great understanding. By his glorious plan he made his creation beautiful. By his powerful word he set the heavens in place and founded the earth upon the waters. By his own wisdom and care he created his holy church and blessed it.


    “Look! He is moving the heavens, mountains, hills, and seas. Everything becomes level for his chosen ones, so that he may give them the promise he made with great glory and joy—if they obey God’s commands, which they received with great faith.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the God of hosts
  simplified_phrase: God, Lord of the heavenly armies
  preserved_meaning: God rules the heavenly hosts.
  reasoning_layer_used: POB title and grounding review
  rationale: The expanded title makes the traditional word “hosts” understandable.
- pob_phrase: by his glorious counsel adorned his creation with beauty
  simplified_phrase: By his glorious plan he made his creation beautiful.
  preserved_meaning: God purposefully gave beauty to what he created.
  reasoning_layer_used: POB translation
  rationale: A direct sentence replaces the formal language without changing the claim.
- pob_phrase: if they keep the statutes of God
  simplified_phrase: if they obey God’s commands
  preserved_meaning: Receiving the promise is linked to obedience to God’s requirements.
  reasoning_layer_used: POB translation
  rationale: The common wording clearly expresses what it means to keep statutes.
interpretive_expansions:
- pob_phrase: the God of hosts
  rendering: God, Lord of the heavenly armies
  claim: The title presents God as ruler of the heavenly hosts.
  evidence:
  - The POB retains the traditional divine title “God of hosts.”
  - The grounding review identifies heavenly armies as the title’s understandable sense.
  confidence: high
  alternatives_preserved:
  - God of hosts
translation_notes:
  risk_flags:
  - risk: “Heavenly armies” makes one sense of “hosts” explicit.
    mitigation: “Lord” preserves God’s rule, while the audit records the traditional title.
  - risk: Breaking the proclamation into short sentences may reduce its cumulative force.
    mitigation: The repeated “Look!” and parallel clauses preserve its solemn emphasis.
