  text: But it is not for this that God is angry with you, but so that you may turn back your household, which has sinned against the Lord and against us, their parents. Yet, being fond of your children, you did not admonish your household, but you let it be grievously ruined; for this the Lord is angry with you. But he will heal all the past evils in your household; for because of their sins and lawless deeds you yourself were ruined by worldly affairs.
translation:
  language: en
  text: But God is not angry with you because of this. He is angry so that you will lead your household to turn back, for they have sinned against the Lord and against us, their parents. You were too indulgent with your children. You did not correct your household but allowed it to fall into terrible ruin. This is why the Lord is angry with you. Yet he will heal all the past evil in your household. Their sins and lawless deeds caused you yourself to be ruined through worldly affairs.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: so that you may turn back your household
  simplified_phrase: so that you will lead your household to turn back
  preserved_meaning: God's anger is meant to move Hermas to guide his household toward repentance.
  reasoning_layer_used: POB translation and immediate context
  rationale: The recast wording makes the household's turning understandable without changing the purpose stated in POB.
- pob_phrase: being fond of your children, you did not admonish your household
  simplified_phrase: You were too indulgent with your children. You did not correct your household
  preserved_meaning: His affection led him to neglect needed correction.
  reasoning_layer_used: POB translation and clause relationship
  rationale: Two direct sentences clarify that misplaced leniency resulted in failed discipline.
- pob_phrase: you let it be grievously ruined
  simplified_phrase: allowed it to fall into terrible ruin
  preserved_meaning: His neglect permitted severe damage within the household.
  reasoning_layer_used: POB source-driven image
  rationale: The concrete ruin image is retained in natural modern English.
interpretive_expansions:
- pob_phrase: being fond of your children
  rendering: You were too indulgent with your children
  claim: His affection became excessive leniency that kept him from correcting them.
  evidence:
  - POB directly connects fondness with his failure to admonish the household.
  confidence: high
  alternatives_preserved:
  - You were very fond of your children
