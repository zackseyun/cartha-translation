  text: I went on a little, brothers, and behold, I see dust rising as if to the sky, and I began to say within myself, “Perhaps cattle are coming and stirring up dust?” For it was about a stadion away from me.
translation:
  language: en
  text: I went a little farther, brothers, and I saw dust rising high into the sky. I thought, “Perhaps cattle are coming and stirring up the dust.” The dust was about 200 yards away from me.
