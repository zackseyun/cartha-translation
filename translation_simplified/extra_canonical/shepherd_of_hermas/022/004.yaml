  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/004.yaml
  text: 'And while I was glorifying and giving thanks to him, something like the sound of a voice answered me: “Do not be double-minded, Hermas.” I began to reason within myself and say, “What do I have to be double-minded about, being so firmly established by the Lord and having seen glorious things?”'
translation:
  language: en
  text: 'As I was praising him and thanking him, I heard what sounded like a voice answer me: “Do not waver between two minds, Hermas.” I thought to myself, “What could I be wavering about? The Lord has made me firm, and I have seen glorious things.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: while I was glorifying and giving thanks to him
  simplified_phrase: As I was praising him and thanking him
  preserved_meaning: Hermas continues to honor and thank the Lord.
  reasoning_layer_used: POB translation and immediate context
  rationale: “Praising” expresses “glorifying” in more familiar English.
- pob_phrase: something like the sound of a voice answered me
  simplified_phrase: I heard what sounded like a voice answer me
  preserved_meaning: Hermas hears a voice-like response without claiming more certainty than the POB gives.
  reasoning_layer_used: POB wording and documented ambiguity
  rationale: The sentence is recast naturally while preserving the comparison “what sounded like.”
- pob_phrase: being so firmly established by the Lord
  simplified_phrase: The Lord has made me firm
  preserved_meaning: Hermas believes the Lord has given him stability and confidence.
  reasoning_layer_used: POB source-driven rendering
  rationale: The passive participial phrase becomes a direct sentence without changing its cause.
translation_notes:
  risk_flags:
  - risk: “Double-minded” may be unclear to a modern reader, while “waver” alone can lose the image of divided thought.
    mitigation: The rendering “waver between two minds” preserves the image and clarifies its force.
