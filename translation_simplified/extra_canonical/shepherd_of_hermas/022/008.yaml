  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/008.yaml
  text: So then, brothers, having put on the faith of the Lord and having remembered the mighty deeds that he had taught me, I took courage and gave myself over to the beast. Now the beast was coming with such a roar that it could destroy a city.
translation:
  language: en
  text: So then, brothers, I clothed myself in the faith of the Lord and remembered the mighty deeds he had taught me about. This gave me courage, and I gave myself up to the beast. It was coming with a roar powerful enough to destroy a city.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: having put on the faith of the Lord
  simplified_phrase: I clothed myself in the faith of the Lord
  preserved_meaning: Faith remains pictured as clothing worn for protection and readiness.
  reasoning_layer_used: POB text and source-language image
  rationale: The clothing image is retained while the participle becomes a direct action.
- pob_phrase: having remembered the mighty deeds that he had taught me
  simplified_phrase: remembered the mighty deeds he had taught me about
  preserved_meaning: The Lord's teaching concerned his mighty deeds.
  reasoning_layer_used: POB controlling meaning and immediate syntax
  rationale: Adding “about” makes the relationship between the teaching and the deeds natural in English.
- pob_phrase: I took courage and gave myself over to the beast
  simplified_phrase: This gave me courage, and I gave myself up to the beast
  preserved_meaning: Remembering gave him courage to surrender himself to the beast.
  reasoning_layer_used: POB controlling meaning and independent grounding review
  rationale: The revision keeps the active self-surrender that the earlier draft weakened.
translation_notes:
  risk_flags:
  - risk: “Gave myself up” may suggest defeat or capture to some readers.
    mitigation: The preceding statement that he gained courage preserves the sense of deliberate self-surrender.
