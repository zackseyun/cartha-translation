  text: 8. Many other stones lay around the tower, and they were not using them for the building—for some of them were scabby, others had cracks, others were mutilated, others were white and round, not fitting for the building.
translation:
  language: en
  text: 8. Many other stones lay around the tower, but the builders did not use them. Some had rough, scabby surfaces. Some were cracked, and others were badly damaged. Still others were white and round and did not fit the building.
  philosophy: optimal-equivalence
