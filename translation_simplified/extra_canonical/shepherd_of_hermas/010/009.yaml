  text: 9. And I saw other stones being thrown far from the tower and coming into the road, and not remaining in the road but rolling into the wasteland; others falling into fire and being burned; others falling near waters and not being able to roll into the water, though they wanted to roll and come into the water.
translation:
  language: en
  text: 9. I also saw other stones thrown far from the tower and coming onto the road. But they did not stay on the road; they rolled into the wasteland. Some fell into fire and were burned. Others fell near waters but could not roll into the water, though they wanted to reach it.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: being thrown far from the tower and coming into the road
  simplified_phrase: thrown far from the tower and coming onto the road
  preserved_meaning: The stones are cast far from the tower and move onto the road.
  reasoning_layer_used: POB translation and grounding review
  rationale: “Coming onto” clearly describes movement without adding an impact or settling.
- pob_phrase: not remaining in the road but rolling into the wasteland
  simplified_phrase: But they did not stay on the road; they rolled into the wasteland.
  preserved_meaning: The stones leave the road and roll into the wasteland.
  reasoning_layer_used: POB translation
  rationale: Two direct clauses preserve the contrast in natural English.
- pob_phrase: though they wanted to roll and come into the water
  simplified_phrase: though they wanted to reach it
  preserved_meaning: The stones want to enter the water but cannot.
  reasoning_layer_used: POB translation and cross-check summary
  rationale: The shorter wording preserves their frustrated desire to enter the water.
