  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/002.yaml
  text: 2. “But you are eager to sit on the right with them; yet your shortcomings are many. Still, you will be cleansed from your shortcomings, and all who are not double-minded will be cleansed from all their sins up to this day.”
translation:
  language: en
  text: 2. “You are eager to sit on the right side with them, but you have many failings. Even so, you will be cleansed of your failings. Everyone who is not divided within themselves will also be cleansed of all their sins up to this day.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: sit on the right with them
  simplified_phrase: sit on the right side with them
  preserved_meaning: The speaker describes the desired place beside those already seated on the right.
  reasoning_layer_used: POB translation and immediate context
  rationale: Adding “side” makes the spatial expression natural without changing it.
- pob_phrase: your shortcomings are many
  simplified_phrase: you have many failings
  preserved_meaning: The person still has many moral faults.
  reasoning_layer_used: POB translation
  rationale: The direct clause is easier to understand than the abstract construction.
- pob_phrase: all who are not double-minded
  simplified_phrase: everyone who is not divided within themselves
  preserved_meaning: Cleansing is promised to those who are not inwardly divided or wavering.
  reasoning_layer_used: POB translation and source-language image preserved by POB
  rationale: The wording explains the image while leaving the kind of inner division broad.
translation_notes:
  risk_flags:
  - risk: “Divided within themselves” may be less familiar than “double-minded.”
    mitigation: It preserves the inner-division image without narrowing it to doubt or disloyalty alone.
