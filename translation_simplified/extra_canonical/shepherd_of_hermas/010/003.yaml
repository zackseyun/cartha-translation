  simplified_phrase: When she finished speaking
  preserved_meaning: Her departure followed the end of her speech.
  reasoning_layer_used: POB translation and immediate narrative context
  rationale: The simpler clause presents the same sequence in natural English.
- pob_phrase: she wanted to depart
  simplified_phrase: she was about to leave
  preserved_meaning: She intended to leave at that moment.
  reasoning_layer_used: POB translation
  rationale: This clearly expresses her impending departure.
- pob_phrase: asked her by the Lord
  simplified_phrase: begged her in the Lord’s name
  preserved_meaning: He urgently entreated her while solemnly invoking the Lord.
  reasoning_layer_used: POB wording, immediate action, and grounding review
  rationale: This keeps her as the person addressed and the Lord as the basis of the plea.
