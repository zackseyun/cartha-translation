- pob_phrase: What ... did they endure?
  simplified_phrase: What did they suffer?
  preserved_meaning: The speaker asks what hardships these people experienced.
  reasoning_layer_used: POB translation and immediate dialogue
  rationale: The common verb “suffer” makes the question direct without changing its meaning.
- pob_phrase: scourges, imprisonments, great afflictions
  simplified_phrase: beatings with whips, imprisonment, terrible suffering
  preserved_meaning: They underwent physical punishment, confinement, and severe distress.
  reasoning_layer_used: POB wording and source list structure
  rationale: Concrete modern wording keeps the three hardships distinct and understandable.
- pob_phrase: the right-hand parts of the sanctuary belong to them
  simplified_phrase: the places on the right side of the sanctuary belong to them
  preserved_meaning: Those who suffer because of the Name are assigned the sanctuary’s right side.
  reasoning_layer_used: POB translation and paragraph contrast
  rationale: “Places on the right side” clarifies the spatial image without interpreting it away.
