  text: '1. “What,” I said, “did they endure?” She says, “Listen: scourges, imprisonments, great afflictions, crosses, wild beasts—for the sake of the Name. For this reason the right-hand parts of the sanctuary belong to them, and to whoever suffers because of the Name; but the left-hand parts belong to the rest. Yet for both, those sitting on the right and those on the left, the gifts are the same and the promises the same—only those on the right sit there and have some glory.”'
translation:
  language: en
  text: '1. “What did they suffer?” I asked.


    She replied, “Listen: beatings with whips, imprisonment, terrible suffering, crosses, and wild beasts—all because of the Name. That is why the places on the right side of the sanctuary belong to them, and to everyone who suffers because of the Name. The places on the left belong to the others. But both groups—those sitting on the right and those on the left—receive the same gifts and the same promises. The only difference is that those on the right sit there and have some glory.”'
  philosophy: optimal-equivalence
