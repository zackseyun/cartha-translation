  text: 5. The tower was being built in a square by the six young men who had come with her; and myriads of other men were bringing stones, some from the deep and others from the land, and were handing them to the six young men. They would take them and build.
translation:
  language: en
  text: 5. The six young men who had come with her were building the square-shaped tower. Countless other men brought stones—some from the deep and others from the land—and handed them to the six young men. The young men took the stones and used them to build the tower.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The tower was being built in a square by the six young men
  simplified_phrase: The six young men ... were building the square-shaped tower
  preserved_meaning: The six young men were constructing a tower with a square shape.
  reasoning_layer_used: POB base text and source payload
  rationale: The active sentence makes the builders and the tower's shape immediately clear.
- pob_phrase: myriads of other men
  simplified_phrase: Countless other men
  preserved_meaning: A vast number of other men were helping.
  reasoning_layer_used: POB base text
  rationale: “Countless” conveys the immense number in familiar English.
- pob_phrase: They would take them and build
  simplified_phrase: The young men took the stones and used them to build the tower
  preserved_meaning: The six young men received the stones and used them in the tower.
  reasoning_layer_used: Immediate narrative context
  rationale: Explicit nouns remove unclear pronoun references without adding new action.
