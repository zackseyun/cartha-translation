  text: 4. And again she took hold of my hand, raised me up, and seated me on the bench on the left; and she herself sat on the right. And, lifting up a certain bright rod, she says to me, “Do you see a great thing?” I say to her, “Lady, I see nothing.” She says to me, “[You,] look—do you not see opposite you a great tower being built upon the waters with square, shining stones?”
translation:
  language: en
  text: '4. Once again she took my hand, helped me to my feet, and seated me on the left side of the bench. She sat on the right. Then she raised a bright rod and asked me, “Do you see something great?”


    “No, Lady,” I answered. “I see nothing.”


    “Look!” she said. “Do you not see a great tower in front of you? It is being built on the waters with square, shining stones.”'
