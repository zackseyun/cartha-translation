  text: “All who transgressed the law which they received from him,” he says, “he left under my authority for repentance; but those who have already been pleasing to the law and have kept it, he has under his own authority.”
translation:
  language: en
  text: He says, “He placed under my authority all who broke the law they received from him, so that they could repent. But he keeps under his own authority those who have already lived in a way pleasing to the law and have kept it.”
