  text: “Listen,” he says. “This great tree that covers plains and mountains and the whole earth is the law of God given to the whole world. And this law is the Son of God, proclaimed to the ends of the earth; and the peoples under the shade are those who heard the proclamation and believed in him.
translation:
  language: en
  text: “Listen,” he said. “This great tree, whose shade covers the plains, the mountains, and the whole earth, is God’s law, given to the whole world. This law is the Son of God, who has been proclaimed to the ends of the earth. The peoples under the tree’s shade are those who heard the message and believed in him.”
