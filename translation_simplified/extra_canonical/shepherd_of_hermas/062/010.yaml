base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/010.yaml
  text: “And those who handed in green rods just as they received them are dignified and righteous and have walked with a very pure heart, and have guarded the commandments of the Lord. The rest you will learn when I examine these rods that have been planted and watered.”
translation:
  language: en
  text: “Those who returned their rods as green as when they received them are honorable and righteous. They have lived with very pure hearts and have kept the Lord’s commandments. You will learn about the others when I examine the rods that were planted and watered.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: handed in green rods just as they received them
  simplified_phrase: returned their rods as green as when they received them
  preserved_meaning: The rods remained green from the time they were received until they were returned.
  reasoning_layer_used: POB text and immediate narrative image
  rationale: The comparison is recast in natural English without weakening the image of unchanged green rods.
- pob_phrase: are dignified and righteous
  simplified_phrase: are honorable and righteous
  preserved_meaning: These people are worthy of respect and morally upright.
  reasoning_layer_used: POB lexical wording
  rationale: “Honorable” expresses personal dignity more clearly for common readers.
- pob_phrase: have walked with a very pure heart, and have guarded the commandments of the Lord
  simplified_phrase: have lived with very pure hearts and have kept the Lord’s commandments
  preserved_meaning: Their lives were inwardly pure and obedient to the Lord’s commands.
  reasoning_layer_used: POB text and biblical idiom
  rationale: Common English replaces the opaque idioms while keeping purity and obedience distinct.
translation_notes:
  risk_flags:
  - risk: Changing “walked” to “lived” reduces the visible biblical journey metaphor.
    mitigation: The rendering preserves its established ethical sense while keeping the separate rod imagery intact.
