  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/009.yaml
  text: “But the others, who themselves also handed in their rods green and having side-shoots, yet without fruit—these are those who were hard-pressed for the law, but did not suffer, nor did they deny their law.
translation:
  language: en
  text: “The others returned their rods green, with side shoots but no fruit. They are those who came under pressure because of the law, but did not actually suffer or deny their law.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: who themselves also handed in their rods green and having side-shoots, yet without fruit
  simplified_phrase: returned their rods green, with side shoots but no fruit
  preserved_meaning: The rods remained green and grew side shoots, but produced no fruit.
  reasoning_layer_used: POB translation and immediate symbolic context
  rationale: The clause is reordered into natural English while retaining every part of the rod image.
- pob_phrase: these are those who were hard-pressed for the law
  simplified_phrase: They are those who came under pressure because of the law
  preserved_meaning: These people faced pressure connected with adherence to the law.
  reasoning_layer_used: POB source-driven wording
  rationale: “Came under pressure” expresses “hard-pressed” in common English without specifying an unstated form of persecution.
- pob_phrase: but did not suffer, nor did they deny their law
  simplified_phrase: but did not actually suffer or deny their law
  preserved_meaning: Despite the pressure, they neither underwent the stated suffering nor renounced their law.
  reasoning_layer_used: POB translation and preserved ambiguity
  rationale: The wording keeps suffering and denial distinct without explaining the unspecified kind of suffering.
translation_notes:
  risk_flags:
  - risk: “Came under pressure” and “did not actually suffer” may seem tense in English.
    mitigation: The contrast is retained because the POB distinguishes pressure from suffering without defining either more precisely.
