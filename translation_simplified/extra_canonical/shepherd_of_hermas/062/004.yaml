- pob_phrase: the rods of each person; for the rods are the law
  simplified_phrase: The rods you see belong to different people, and they stand for the law
  preserved_meaning: Each rod is linked to a person and symbolizes the law.
  reasoning_layer_used: POB translation and immediate metaphor
  rationale: The wording explains the symbolic relationship without removing the rod image.
- pob_phrase: many rods made worthless
  simplified_phrase: many of the rods have become useless
  preserved_meaning: Many rods are no longer fit for their intended purpose.
  reasoning_layer_used: POB lexical wording
  rationale: “Become useless” expresses “made worthless” in ordinary English without adding a cause.
- pob_phrase: have not kept the law
  simplified_phrase: have not obeyed the law
  preserved_meaning: These people failed to live according to the law.
  reasoning_layer_used: POB translation
  rationale: “Obeyed” makes the practical sense of “kept” immediately clear.
