  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/004.yaml
  text: “You see the rods of each person; for the rods are the law. You see, then, many rods made worthless; and you will recognize all those who have not kept the law, and you will see the dwelling of each one.”
translation:
  language: en
  text: “The rods you see belong to different people, and they stand for the law. You see that many of the rods have become useless. In this way, you will recognize all who have not obeyed the law, and you will see each person’s dwelling place.”
  philosophy: optimal-equivalence
