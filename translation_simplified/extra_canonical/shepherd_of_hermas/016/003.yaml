  text: Hear their functions. The first of them, the one clasping her hands, is called Faith; through her the chosen of God are saved. And the second, the one girded about and acting bravely, is called Self-control; she is the daughter of Faith. Whoever, then, follows her becomes blessed in his life, because he will refrain from all evil works, believing that if he refrains from every evil desire he will inherit eternal life.”
translation:
  language: en
  text: Hear what each of them does. The first, the one with her hands clasped, is called Faith. Through her, God’s chosen people are saved. The second, whose clothing is belted around her and who acts courageously, is called Self-Control. She is the daughter of Faith. Anyone who follows her will be blessed in life, because that person will avoid every evil deed, believing that if they refuse to give in to every evil desire, they will inherit eternal life.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Hear their functions.
  simplified_phrase: Hear what each of them does.
  preserved_meaning: The hearer is told to learn the role of each figure.
  reasoning_layer_used: POB translation and discourse-marker revision
  rationale: The wording makes “functions” clear without restoring the removed discourse marker.
- pob_phrase: the one girded about and acting bravely
  simplified_phrase: whose clothing is belted around her and who acts courageously
  preserved_meaning: Her belted appearance and courageous conduct remain distinct details.
  reasoning_layer_used: POB source-image rendering
  rationale: The unfamiliar girding image is explained rather than removed.
- pob_phrase: Whoever, then, follows her becomes blessed in his life
  simplified_phrase: Anyone who follows her will be blessed in life
  preserved_meaning: Following Self-Control leads to blessedness in one’s life.
  reasoning_layer_used: POB translation and grounding review
  rationale: The direct wording avoids implying favorable life circumstances.
interpretive_expansions:
- pob_phrase: refrains from every evil desire
  rendering: refuse to give in to every evil desire
  claim: Refraining means exercising restraint rather than eliminating the desires themselves.
  evidence:
  - The POB links refraining from evil desire with the personified virtue Self-Control.
  - The grounding review distinguishes self-restraint from repudiating or eliminating desire.
  confidence: high
  alternatives_preserved:
  - refrains from every evil desire
translation_notes:
  risk_flags:
  - risk: “Refuse to give in” makes the restraint implied by “refrains” more explicit.
    mitigation: It preserves self-control toward evil desires without suggesting that the desires never arise.
