  text: '“I wanted,” I said, “to know, lady, what power each of them has.” “Hear,” she says, “the powers they have. Their powers are held together by one another, and they follow one another, just as they were born: from Faith is born Self-control, from Self-control Simplicity, from Simplicity Innocence, from Innocence Dignity, from Dignity Knowledge, and from Knowledge Love. So, then, the works of these are pure and dignified and divine. Whoever, then, serves these and proves able to hold fast to their works will have his dwelling in the tower with the holy ones of God.”'
translation:
  language: en
  text: '“I want to know, lady,” I said, “what power each of them has.”


    “Listen,” she said, “and I will tell you. Their powers are joined together, and each one follows the one before it in the order of their birth: Self-control is born from Faith; Simplicity from Self-control; Innocence from Simplicity; Dignity from Innocence; Knowledge from Dignity; and Love from Knowledge. The works that come from these virtues are pure, honorable, and divine. Whoever serves these virtues and succeeds in holding firmly to their works will live in the tower with God’s holy ones.”'
  philosophy: optimal-equivalence
