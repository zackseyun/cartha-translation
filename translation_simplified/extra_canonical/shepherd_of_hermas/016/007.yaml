  text: But it was not revealed to you alone, but so that you may make them known to all. After three days—for first you must understand, and I first command you, Hermas, the words I am about to say to you—speak them all into the ears of the holy ones, so that, after hearing them and doing them, they may be cleansed from their evils, and you also with them.”
translation:
  language: en
  text: '“These things were not revealed to you alone, but so that you could make them known to everyone. Three days from now—after you have first understood the words I am about to tell you—carry out this first command I give you, Hermas: repeat every word to the holy ones. Then, when they hear these words and put them into practice, they may be cleansed from their evils, and you may be cleansed with them.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: But it was not revealed to you alone, but so that you may make them known to all
  simplified_phrase: These things were not revealed to you alone, but so that you could make them known to everyone
  preserved_meaning: The revelation was entrusted to Hermas for the benefit of everyone, not only himself.
  reasoning_layer_used: POB translation and immediate context
  rationale: The plural “these things” clearly connects the revelation with what Hermas must announce.
- pob_phrase: After three days—for first you must understand, and I first command you, Hermas, the words I am about to say to you
  simplified_phrase: Three days from now—after you have first understood the words I am about to tell you—carry out this first command I give you, Hermas
  preserved_meaning: Hermas must first understand the coming words and then act on the command after three days.
  reasoning_layer_used: POB syntax and source-driven sequence
  rationale: The dense parenthetical wording is recast as a clear sequence without changing its timing.
- pob_phrase: speak them all into the ears of the holy ones, so that, after hearing them and doing them
  simplified_phrase: repeat every word to the holy ones. Then, when they hear these words and put them into practice
  preserved_meaning: Hermas must communicate everything so the holy ones can hear and act on it.
  reasoning_layer_used: POB idiom and clause structure
  rationale: The ear image is expressed through direct hearing, while “doing” becomes the natural phrase “put them into practice.”
