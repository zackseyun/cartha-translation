  yaml_path: translation/extra_canonical/shepherd_of_hermas/023/002.yaml
  text: I knew that I would escape it, if your heart becomes pure and without blemish, and if for the remaining days of your life you serve the Lord blamelessly. Cast your cares upon the Lord, and he himself will direct them.
translation:
  language: en
  text: I knew that I would escape it if your heart becomes pure and spotless, and if you serve the Lord without blame for the rest of your life. Cast your worries on the Lord, and he himself will guide them.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: without blemish
  simplified_phrase: spotless
  preserved_meaning: The heart must be morally clean and free from fault.
  reasoning_layer_used: POB translation
  rationale: “Spotless” states the same moral image in familiar English.
- pob_phrase: for the remaining days of your life you serve the Lord blamelessly
  simplified_phrase: you serve the Lord without blame for the rest of your life
  preserved_meaning: Service to the Lord must remain above reproach throughout the person's remaining life.
  reasoning_layer_used: POB translation and grounding review
  rationale: This simplifies the duration while retaining the explicit standard of blameless conduct.
- pob_phrase: Cast your cares upon the Lord, and he himself will direct them
  simplified_phrase: Cast your worries on the Lord, and he himself will guide them
  preserved_meaning: The person entrusts troubling concerns to the Lord, who personally directs them.
  reasoning_layer_used: POB translation and source-language image
  rationale: The wording keeps the casting image without implying that every concern will be resolved.
translation_notes:
  risk_flags:
  - risk: “Guide them” leaves the exact way the Lord directs the worries unspecified.
    mitigation: This preserves the POB's open wording rather than promising that every problem will be fixed.
