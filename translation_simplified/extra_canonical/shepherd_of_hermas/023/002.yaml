  review_summary: The lifetime-duration simplification and “spotless” are clear and adequately preserve the POB sense. Revision is needed because the past-tense conditional alters the force of the statement, “faithfully” weakens the explicit blamelessness requirement, and “set them right” overstates the promise by changing direction of the cares into their resolution. The replacement retains the passage's moral condition and its assurance without adding that every concern will be repaired.
