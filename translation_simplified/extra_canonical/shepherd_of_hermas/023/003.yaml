  yaml_path: translation/extra_canonical/shepherd_of_hermas/023/003.yaml
  text: Believe in the Lord, you double-minded, because he is able to do all things and turns his anger away from you, but sends plagues upon you who are double-minded. Woe to those who have heard these words and disobeyed; it would have been better for them not to have been born.
translation:
  language: en
  text: Trust in the Lord, you who waver. He can do anything, and he turns his anger away from you, but he sends plagues on you who waver. How terrible for those who heard these words and refused to obey! It would have been better for them never to have been born.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Believe in the Lord, you double-minded
  simplified_phrase: Trust in the Lord, you who waver
  preserved_meaning: The hearers must rely on the Lord rather than remain uncertain in their response to him.
  reasoning_layer_used: POB translation and immediate context
  rationale: “Waver” clearly expresses instability without narrowing it to divided loyalty.
- pob_phrase: he is able to do all things
  simplified_phrase: He can do anything
  preserved_meaning: The Lord is able to do all things.
  reasoning_layer_used: POB translation
  rationale: The shorter wording makes the same claim in ordinary English.
- pob_phrase: Woe to those who have heard these words and disobeyed
  simplified_phrase: How terrible for those who heard these words and refused to obey!
  preserved_meaning: Severe judgment awaits those who hear the message but reject it.
  reasoning_layer_used: POB translation
  rationale: The warning conveyed by “woe” is stated directly without weakening its force.
translation_notes:
  risk_flags:
  - risk: “Waver” may be read broadly rather than specifically as wavering in trust.
    mitigation: The command “Trust in the Lord” immediately identifies the context.
