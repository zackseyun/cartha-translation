  text: After the beast had passed by me and I had gone forward about thirty feet, behold, a virgin meets me, adorned as if coming out of a bridal chamber, all in white and with white sandals, veiled up to her forehead; her covering was with a turban, and her hair was white.
translation:
  language: en
  text: After the beast had passed me, I walked on for about thirty feet. Then I met a virgin. She was dressed as though she had come out of a bridal chamber. She wore all white, including white sandals. Her veil reached to her forehead, her head covering was a turban, and her hair was white.
