  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/001.yaml
  text: 'He says to me: Remove double-mindedness from yourself, and do not at all be double-minded when asking anything from God, saying within yourself, “How am I able to ask from the Lord and receive, I who have sinned so much against him?”'
translation:
  language: en
  text: He says to me, “Stop being divided within yourself. When you ask God for anything, do not waver at all, thinking, ‘How can I ask the Lord and receive anything, when I have sinned so much against him?’”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Remove double-mindedness from yourself
  simplified_phrase: Stop being divided within yourself
  preserved_meaning: The speaker commands him to reject an inwardly divided state.
  reasoning_layer_used: POB translation and immediate context
  rationale: The concrete idea of inner division is preserved in common English.
- pob_phrase: do not at all be double-minded when asking anything from God
  simplified_phrase: When you ask God for anything, do not waver at all
  preserved_meaning: He must not hesitate in doubt when making requests to God.
  reasoning_layer_used: POB translation and quoted inner question
  rationale: “Do not waver” clearly expresses the repeated warning in the setting of prayer.
- pob_phrase: saying within yourself
  simplified_phrase: thinking
  preserved_meaning: The following question is spoken inwardly rather than aloud.
  reasoning_layer_used: POB translation
  rationale: “Thinking” states the same inner action more naturally.
translation_notes:
  risk_flags:
  - risk: “Double-mindedness” can include more than momentary uncertainty.
    mitigation: The wording retains both inner division and wavering rather than reducing the idea to simple confusion.
