  review_summary: Revision is needed. The draft improves the unusual expression “serve faith,” but “divided thinking” is too readily understood as merely intellectual disagreement and therefore weakens the morally and spiritually wavering sense of double-mindedness. The proposed replacement states that sense plainly without importing doctrine. “Holds to these things” also better preserves the active, comprehensive force of the final clause than merely “thinks this way.”
