  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/012.yaml
  text: Therefore serve faith, which has power, and keep away from double-mindedness, which has no power, and you will live to God—and all who think these things will live to God.”
translation:
  language: en
  text: Therefore, be devoted to faith, which is powerful. Stay away from a divided and wavering mind, which is powerless. Then you will live for God, and everyone who holds to these things will also live for God.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: serve faith
  simplified_phrase: be devoted to faith
  preserved_meaning: Faith calls for loyal commitment expressed in how a person lives.
  reasoning_layer_used: POB translation and immediate contrast
  rationale: “Be devoted to” clearly conveys active allegiance without the obscurity of “serve faith.”
- pob_phrase: keep away from double-mindedness
  simplified_phrase: Stay away from a divided and wavering mind
  preserved_meaning: The reader must reject the unstable disposition opposed to faith.
  reasoning_layer_used: POB translation, immediate contrast, and grounding review
  rationale: “Divided and wavering mind” prevents the phrase from sounding like mere intellectual disagreement.
- pob_phrase: all who think these things will live to God
  simplified_phrase: everyone who holds to these things will also live for God
  preserved_meaning: The promise includes all who embrace and follow the preceding exhortations.
  reasoning_layer_used: POB translation, sentence logic, and grounding review
  rationale: “Holds to” preserves committed adherence rather than suggesting a mere opinion.
translation_notes:
  risk_flags:
  - risk: “Be devoted to faith” states the active force of the unusual image “serve faith” without retaining its exact wording.
    mitigation: The rendering preserves loyal commitment and keeps faith as the object of devotion.
