  text: So do not cease asking for the request of your soul, and you will receive it. But if you grow weary and become double-minded while asking, blame yourself and not the one who gives to you.
translation:
  language: en
  text: So keep asking for what your soul desires, and you will receive it. But if you become discouraged and start wavering as you ask, blame yourself, not the one who gives to you.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: do not cease asking
  simplified_phrase: keep asking
  preserved_meaning: The command calls for persistent asking.
  reasoning_layer_used: POB translation
  rationale: The positive wording gives the same command in natural English.
- pob_phrase: the request of your soul
  simplified_phrase: what your soul desires
  preserved_meaning: The request expresses the person's inner desire.
  reasoning_layer_used: POB translation
  rationale: This makes the abstract phrase clear while retaining its reference to the soul.
- pob_phrase: grow weary and become double-minded while asking
  simplified_phrase: become discouraged and start wavering as you ask
  preserved_meaning: The warning keeps discouragement distinct from inward instability in asking.
  reasoning_layer_used: POB translation and independent grounding review
  rationale: “Start wavering” preserves the broad sense of divided resolve without narrowing it to doubt.
