  text: Therefore despise double-mindedness and master it in every matter, having put on the strong and mighty faith. For faith promises all things and accomplishes all things, but double-mindedness, because it does not trust, fails in all the works that it does.
translation:
  language: en
  text: So reject a divided and doubting mind, and overcome it in every situation. Put on strong and mighty faith. Faith promises all things and accomplishes them, but a divided mind does not trust and therefore fails in everything it tries to do.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: despise double-mindedness and master it in every matter
  simplified_phrase: reject a divided and doubting mind, and overcome it in every situation
  preserved_meaning: The reader must decisively oppose inner wavering in every circumstance.
  reasoning_layer_used: POB translation and immediate contrast with trusting faith
  rationale: Common verbs and a brief explanation replace abstract, potentially opaque wording.
- pob_phrase: having put on the strong and mighty faith
  simplified_phrase: Put on strong and mighty faith
  preserved_meaning: Faith is pictured as something deliberately put on and relied upon for strength.
  reasoning_layer_used: POB source-driven imagery
  rationale: A direct command clarifies the syntax while preserving the clothing image.
- pob_phrase: fails in all the works that it does
  simplified_phrase: fails in everything it tries to do
  preserved_meaning: A divided mind cannot bring its undertakings to completion.
  reasoning_layer_used: POB translation and clause-level sense
  rationale: Natural English replaces the awkward personification of doing works.
interpretive_expansions:
- pob_phrase: double-mindedness
  rendering: a divided and doubting mind
  claim: The division described is wavering distrust rather than mere complex thinking.
  evidence:
  - The following clause explains that double-mindedness does not trust.
  - The passage directly contrasts it with faith.
  confidence: high
  alternatives_preserved:
  - double-mindedness
  - a divided mind
