  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/005.yaml
  text: But if you waver in your heart, you will by no means receive anything of your petitions. For those who doubt with respect to God—these are the double-minded—and they do not at all obtain their petitions.
translation:
  language: en
  text: But if you waver in your heart, you will receive nothing you ask for. Those who doubt God are divided in their hearts, and they do not receive what they ask for.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: you will by no means receive anything of your petitions
  simplified_phrase: you will receive nothing you ask for
  preserved_meaning: A wavering person will not receive any requested thing.
  reasoning_layer_used: POB translation and immediate context
  rationale: The direct wording replaces the formal term “petitions” while keeping the absolute negative.
- pob_phrase: those who doubt with respect to God
  simplified_phrase: those who doubt God
  preserved_meaning: Their doubt concerns God.
  reasoning_layer_used: POB translation
  rationale: The shorter construction expresses the same object of doubt in ordinary English.
- pob_phrase: these are the double-minded
  simplified_phrase: are divided in their hearts
  preserved_meaning: Their inner commitment is split rather than settled.
  reasoning_layer_used: POB translation and source-language image
  rationale: This keeps the image of inward division without relying on the less familiar term “double-minded.”
translation_notes:
  risk_flags:
  - risk: “Divided in their hearts” may suggest conflicted feelings more broadly than “double-minded.”
    mitigation: The surrounding references to wavering and doubting God keep the division focused on trust.
