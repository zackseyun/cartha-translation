  text: Therefore cleanse your heart from all the vanities of this age and from the words previously spoken to you, and ask from the Lord; and you will receive everything, and you will lack nothing in any of your petitions, if you ask from the Lord without doubting.
translation:
  language: en
  text: So cleanse your heart of all the empty concerns of this present age and of the words spoken to you earlier. Then ask the Lord. If you ask him without doubting, you will receive everything you request and lack nothing in any of your requests.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the vanities of this age
  simplified_phrase: the empty concerns of this present age
  preserved_meaning: The heart must be cleared of the hollow concerns belonging to the present age.
  reasoning_layer_used: POB text and immediate context
  rationale: “Empty concerns” explains “vanities” while retaining its negative force.
- pob_phrase: from the words previously spoken to you
  simplified_phrase: of the words spoken to you earlier
  preserved_meaning: The command refers specifically to earlier words addressed to the hearer.
  reasoning_layer_used: POB text and grounding review
  rationale: The revision removes awkward wording without broadening the referent.
- pob_phrase: you will lack nothing in any of your petitions
  simplified_phrase: you will receive everything you request and lack nothing in any of your requests
  preserved_meaning: Nothing requested from the Lord will be lacking when the stated condition is met.
  reasoning_layer_used: POB text and clause structure
  rationale: The common word “requests” replaces the abstract term “petitions.”
translation_notes:
  risk_flags:
  - risk: “Everything you request” may sound like an unconditional promise.
    mitigation: The text retains the explicit condition of asking the Lord without doubting.
