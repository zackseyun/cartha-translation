  text: “You see then,” he says, “that faith is from above, from the Lord, and it has great power; but double-mindedness is an earthly spirit from the devil, having no power.
translation:
  language: en
  text: “So you see,” he says, “faith comes from above—from the Lord—and has great power. But being of two minds is an earthly spirit from the devil and has no power.”
  philosophy: optimal-equivalence
simplification_decisions:
