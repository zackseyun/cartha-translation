  simplified_phrase: faith comes from above—from the Lord
  preserved_meaning: Faith originates above, from the Lord.
  reasoning_layer_used: POB translation and source context
  rationale: The active wording is more natural while preserving both statements of origin.
- pob_phrase: double-mindedness
  simplified_phrase: being of two minds
  preserved_meaning: A person is inwardly divided, wavering rather than firmly trusting.
  reasoning_layer_used: POB wording and independent grounding review
  rationale: This common expression preserves the term’s breadth without narrowing it to divided loyalty.
- pob_phrase: an earthly spirit from the devil, having no power
  simplified_phrase: an earthly spirit from the devil and has no power
  preserved_meaning: This spirit is earthly, comes from the devil, and is powerless.
  reasoning_layer_used: POB clause structure and high-agreement cross-check
  rationale: A direct finite clause removes the awkward participle while retaining every claim.
