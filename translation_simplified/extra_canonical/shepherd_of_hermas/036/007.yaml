  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/007.yaml
  text: Cleanse, then, your heart from double-mindedness, and put on faith, because it is strong, and believe God, that all your requests which you ask you will receive. And if ever, after asking some request from the Lord, you receive it more slowly, do not be double-minded because you did not quickly receive the request of your soul; for surely it is because of some testing or some transgression, which you do not know, that you receive your request more slowly.
translation:
  language: en
  text: 'So cleanse your heart of doubt and divided thinking. Clothe yourself with faith, for faith is strong. Believe God: you will receive everything you ask him for. If you ask the Lord for something and it is slow in coming, do not waver in doubt just because you did not receive it quickly. The delay surely comes from some test or from some sin you do not know about.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: double-mindedness
  simplified_phrase: doubt and divided thinking
  preserved_meaning: The person is inwardly divided and uncertain about trusting God.
  reasoning_layer_used: POB text and immediate context
  rationale: The later reference to delayed requests shows that wavering doubt is in view.
- pob_phrase: put on faith
  simplified_phrase: Clothe yourself with faith
  preserved_meaning: Faith is pictured as something deliberately put on like clothing.
  reasoning_layer_used: POB source-language image
  rationale: This keeps the concrete image while making the idiom immediately clear.
- pob_phrase: some transgression, which you do not know
  simplified_phrase: some sin you do not know about
  preserved_meaning: An unrecognized offense may account for the delay.
  reasoning_layer_used: POB lexical meaning
  rationale: Sin is the clearest common-English equivalent here.
translation_notes:
  risk_flags:
  - risk: The promise of receiving everything requested may sound unconditional to modern readers.
    mitigation: The wording preserves POB's broad claim without adding qualifications not present in the record.
  - risk: Rendering double-mindedness as doubt could lose its image of inner division.
    mitigation: The paired wording “doubt and divided thinking” preserves both ideas.
