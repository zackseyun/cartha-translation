  text: Do not reason about these things, but turn to the Lord with your whole heart, and ask from him without doubting; and you will come to know his great compassion, because he will certainly not abandon you, but will fulfill the request of your soul.
translation:
  language: en
  text: Do not keep debating these things in your mind. Instead, turn to the Lord with your whole heart and ask him without doubting. Then you will know how great his compassion is, because he will certainly not abandon you. He will grant what your soul asks of him.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Do not reason about these things
  simplified_phrase: Do not keep debating these things in your mind
  preserved_meaning: The command rejects inner argument that prevents wholehearted, trusting prayer.
  reasoning_layer_used: POB translation and immediate contrast
  rationale: The rewrite makes the mental activity clear without reducing it to ordinary thought.
- pob_phrase: you will come to know his great compassion
  simplified_phrase: you will know how great his compassion is
  preserved_meaning: The person will experience and recognize the greatness of the Lord's compassion.
  reasoning_layer_used: POB translation
  rationale: The direct clause is easier to read while retaining both knowledge and greatness.
- pob_phrase: will fulfill the request of your soul
  simplified_phrase: will grant what your soul asks of him
  preserved_meaning: The Lord will answer the person's heartfelt request.
  reasoning_layer_used: POB translation
  rationale: The verb and clause are recast in ordinary English while the soul remains explicit.
translation_notes:
  risk_flags:
  - risk: “Debating these things in your mind” may sound narrower than every possible sense of “reason.”
    mitigation: The wording follows the contrast with wholehearted, undoubting prayer and avoids condemning thought itself.
