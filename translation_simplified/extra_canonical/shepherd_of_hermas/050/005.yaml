  text: He says to me, "I tell you, this is not fasting, the kind you suppose you are fasting to the Lord. Listen to a parable. A vineyard, not having weeds, will give more fruit, not being choked by the weeds. So the slave took up [his tool], dug the vineyard, and pulled up all the weeds that were in the vineyard. And that vineyard became very comely and thriving, having no weeds to choke it.
translation:
  language: en
  text: He said to me, “I tell you, this is not the kind of fasting you think you are doing for the Lord. Listen to this parable. A vineyard without weeds produces more fruit because weeds do not choke it. So the slave took his tool, dug the vineyard, and pulled up all the weeds in it. With no weeds to choke it, the vineyard became beautiful and flourished.”
  philosophy: optimal-equivalence
