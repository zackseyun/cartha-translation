  yaml_path: translation/extra_canonical/shepherd_of_hermas/050/006.yaml
  text: '"After a time the master of the slave [and of the field] came and went into the vineyard. And seeing the vineyard well fenced, and even dug, and [all] the weeds pulled out, he rejoiced greatly over his slave on account of his deed. Summoning again his friends and his son, the master announced to them the deed the slave had done with his portions which he had received; and they approved all the more that the slave should become co-heir with his son."'
translation:
  language: en
  text: After some time, the servant’s master[a] came into the vineyard. He saw that it had a good fence, that the ground had even been dug up, and that all the weeds had been pulled out. He was very pleased with his servant because of what he had done. So he again called together his friends and his son and told them what the servant had done with the portions he had received. They agreed even more strongly that the servant should share the inheritance with his son.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: POB includes the additional words “and of the field” in brackets, so the master may also be identified as the field’s owner.
    reason: source_note
simplification_decisions:
- pob_phrase: the master of the slave [and of the field] came and went into the vineyard
  simplified_phrase: the slave’s master[a] came into the vineyard
  preserved_meaning: The master comes into the vineyard, while the bracketed identification as owner of the field remains qualified in a note.
  reasoning_layer_used: POB base text and bracketed source wording
  rationale: This removes the unsupported idea that he returned and preserves the uncertain bracketed wording.
- pob_phrase: he rejoiced greatly over his slave on account of his deed
  simplified_phrase: He was very pleased with his slave because of what he had done
  preserved_meaning: The master responds to the slave’s work with strong pleasure and approval.
  reasoning_layer_used: POB base text
  rationale: The causal relationship is stated in ordinary English without weakening the master’s response.
- pob_phrase: the slave should become co-heir with his son
  simplified_phrase: the slave should share the inheritance with his son
  preserved_meaning: The slave is to become a fellow heir alongside the son.
  reasoning_layer_used: POB base text
  rationale: The legal term “co-heir” is expressed through the familiar idea of sharing an inheritance.
