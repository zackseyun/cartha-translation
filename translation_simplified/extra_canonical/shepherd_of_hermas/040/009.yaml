  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/009.yaml
  text: 9. Therefore, when the man who has the divine spirit comes into a gathering of righteous men who have faith in the divine Spirit, and an intercession is made to God by the gathering of those men, then the angel of the prophetic spirit who is assigned to him fills the man; and being filled with the holy Spirit he speaks to the multitude as the Lord wills.
translation:
  language: en
  text: 9. So when a man who has the divine spirit comes to a meeting of righteous believers in the divine Spirit, and they make an appeal to God, the angel of the prophetic spirit assigned to him fills him. Filled with the holy Spirit, the man speaks to everyone there as the Lord wills.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: comes into a gathering of righteous men who have faith in the divine Spirit
  simplified_phrase: comes to a meeting of righteous believers in the divine Spirit
  preserved_meaning: The man joins an assembled community whose members are righteous and trust in the divine Spirit.
  reasoning_layer_used: POB text and immediate context
  rationale: “Meeting” and “believers” express the gathering and its shared faith in natural English.
- pob_phrase: an intercession is made to God by the gathering of those men
  simplified_phrase: they make an appeal to God
  preserved_meaning: The assembled believers direct a shared petition to God.
  reasoning_layer_used: POB text and grounding review
  rationale: “Make an appeal” preserves the petitionary force of intercession without formal passive wording.
- pob_phrase: speaks to the multitude as the Lord wills
  simplified_phrase: speaks to everyone there as the Lord wills
  preserved_meaning: His message to the assembled people is governed by the Lord’s will.
  reasoning_layer_used: POB text
  rationale: “Everyone there” clearly identifies the multitude as the assembled people.
