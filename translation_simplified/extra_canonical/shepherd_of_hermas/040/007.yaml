  text: 7. “How then,” I say, “sir, will a person know which of them is a prophet and which is a false prophet?” “Listen,” he says, “about both prophets; and in the way I am about to tell you, so you shall test the prophet and the false prophet. Test the man who has the divine spirit by his life.
translation:
  language: en
  text: '7. I asked, “Sir, how can someone tell which person is a true prophet and which is a false prophet?”


    He answered, “Listen, and I will tell you about both kinds of prophets. This is how you must test whether a prophet is true or false: examine how the man who claims to have the divine spirit lives.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: will a person know which of them is a prophet and which is a false prophet?
  simplified_phrase: how can someone tell which person is a true prophet and which is a false prophet?
  preserved_meaning: The question asks how to distinguish a genuine prophet from a false one.
  reasoning_layer_used: POB translation and immediate contrast
  rationale: Adding “true” makes the contrast with “false prophet” clear in ordinary English.
- pob_phrase: Listen ... about both prophets
  simplified_phrase: Listen, and I will tell you about both kinds of prophets.
  preserved_meaning: The speaker is about to explain both the genuine and false kinds.
  reasoning_layer_used: POB translation and immediate context
  rationale: “Both kinds” avoids suggesting that only two individual prophets are in view.
- pob_phrase: Test the man who has the divine spirit by his life.
  simplified_phrase: examine how the man who claims to have the divine spirit lives.
  preserved_meaning: A prophet’s conduct is the test used to evaluate his claim to divine inspiration.
  reasoning_layer_used: POB translation and paragraph logic
  rationale: The wording clarifies that his life means his manner of living and that the claim is being tested.
interpretive_expansions:
- pob_phrase: Test the man who has the divine spirit by his life.
  rendering: examine how the man who claims to have the divine spirit lives.
  claim: The instruction evaluates a man’s claim to possess the divine spirit rather than assuming it is genuine.
  evidence:
  - The passage asks how to distinguish a prophet from a false prophet.
  - The command to test him makes the status of his claim the issue.
  confidence: high
  alternatives_preserved:
  - the man who has the divine spirit
translation_notes:
  risk_flags:
  - risk: “Claims to have” is more explicit than POB’s wording.
    mitigation: The surrounding question about true and false prophets requires that the man’s claimed status be tested.
