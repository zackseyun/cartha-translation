  text: 12. First, that man who seems to have a spirit exalts himself and wants to have the first seat; and immediately he is presumptuous and shameless and talkative, and lives among many luxuries and many other deceits, and he receives payment for his prophecy; and if he does not receive it, he does not prophesy. Can a divine spirit receive payment and prophesy? A prophet of God cannot do this; rather, the spirit of such prophets is earthly.
translation:
  language: en
  text: 12. First, consider the man who appears to have a prophetic spirit. He makes himself important and wants the place of honor. He quickly becomes arrogant, shameless, and talkative. He lives in great luxury and practices many other forms of deception. He receives payment for his prophecy, and if he is not paid, he will not prophesy. Can a divine spirit accept payment to prophesy? A prophet of God cannot act this way. The spirit behind such prophets is earthly, not divine.
  philosophy: optimal-equivalence
