  text: 1. He showed me men sitting on a bench, and another man sitting on a chair. And he says to me, “Do you see the ones sitting on the bench?” “I see, sir,” I say. “These,” he says, “are faithful; and the one sitting on the chair is a false prophet who destroys the understanding of the slaves of God—of the double‑minded, not of the faithful.
translation:
  language: en
  text: '1. He showed me several men sitting on a bench and another man sitting on a chair. He asked me, “Do you see the men on the bench?”


    “Yes, sir,” I answered.


    “They are faithful,” he said. “But the man on the chair is a false prophet. He ruins the understanding of God’s servants—not the faithful ones, but those who are divided within themselves.”'
  philosophy: optimal-equivalence
