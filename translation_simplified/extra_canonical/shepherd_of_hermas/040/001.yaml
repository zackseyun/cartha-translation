  preserved_meaning: The speaker directs a question to the narrator.
  reasoning_layer_used: POB translation and immediate dialogue
  rationale: Ordinary English introduces the quoted question directly.
- pob_phrase: the slaves of God
  simplified_phrase: God’s servants
  preserved_meaning: They belong to God and serve him.
  reasoning_layer_used: POB translation
  rationale: “Servants” avoids distracting modern associations while the possessive preserves belonging.
- pob_phrase: the double-minded
  simplified_phrase: those who are divided within themselves
  preserved_meaning: They are inwardly divided or unstable, unlike the faithful.
  reasoning_layer_used: POB translation and immediate contrast
  rationale: This explains the unfamiliar expression without limiting it to competing loyalties.
