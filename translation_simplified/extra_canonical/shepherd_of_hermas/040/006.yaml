  review_summary: The draft usefully replaces the passive construction and makes the final condition natural for modern readers. “Shallow” is an acceptable contextual rendering of “light” here, especially because “earthly” and “has no power” remain in place. However, “to satisfy their desires” attributes a purpose that the POB wording does not explicitly state. Revising it to “speaks in line with what they desire” preserves the intended conformity without importing motive.
