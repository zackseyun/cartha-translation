  text: 6. But the spirit that is consulted and speaks according to the desires of men is earthly and light, having no power; and it does not speak at all unless it is consulted.
translation:
  language: en
  text: 6. But the spirit people consult speaks in line with what they desire. It is earthly and shallow, and it has no power. It does not speak unless someone consults it.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the spirit that is consulted
  simplified_phrase: the spirit people consult
  preserved_meaning: People seek out this spirit to hear it speak.
  reasoning_layer_used: POB translation
  rationale: The passive wording becomes a direct, natural clause.
- pob_phrase: speaks according to the desires of men
  simplified_phrase: speaks in line with what they desire
  preserved_meaning: Its speech conforms to human desires without asserting why it does so.
  reasoning_layer_used: POB translation and grounding review
  rationale: This preserves correspondence without adding a motive to satisfy people.
- pob_phrase: earthly and light, having no power
  simplified_phrase: earthly and shallow, and it has no power
  preserved_meaning: The spirit is earthly, lacks depth, and has no power.
  reasoning_layer_used: POB translation and grounding review
  rationale: “Shallow” conveys the negative figurative sense of “light” without suggesting physical weight.
translation_notes:
  risk_flags:
  - risk: “Shallow” interprets the figurative sense of POB’s “light.”
    mitigation: The wording retains “earthly” and separately states that the spirit has no power.
