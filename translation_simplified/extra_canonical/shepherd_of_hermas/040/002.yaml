  text: 2. These, then, the double‑minded, come to him as to a magician and ask him what will happen to them; and that false prophet, having in himself no power of a divine spirit, speaks with them according to their questions [and according to the desires of their wickedness], and fills their souls as they desire.
translation:
  language: en
  text: 2. So these people, divided in their loyalties, come to him like they would to a magician who could tell their future. They ask what will happen to them. But this false prophet has no power from a divine spirit. He shapes his answers to fit their questions [and their wicked desires], filling their souls with the answers they want.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the double-minded
  simplified_phrase: people, divided in their loyalties
  preserved_meaning: They lack a settled and faithful commitment.
  reasoning_layer_used: POB main text
  rationale: This explains their divided inner stance while preserving its moral force.
- pob_phrase: come to him as to a magician and ask him what will happen to them
  simplified_phrase: come to him like they would to a magician who could tell their future
  preserved_meaning: They approach the false prophet as someone able to reveal their future.
  reasoning_layer_used: POB main text and immediate context
  rationale: This makes their purpose clear without weakening the comparison.
- pob_phrase: speaks with them according to their questions ... and fills their souls as they desire
  simplified_phrase: shapes his answers to fit their questions ... filling their souls with the answers they want
  preserved_meaning: The false prophet caters his message to his hearers' questions and desires.
  reasoning_layer_used: POB main text
  rationale: This clarifies the dense construction while retaining the image of filling their souls.
