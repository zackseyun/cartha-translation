  text: 13. Then, he does not come near a gathering of righteous men at all, but avoids them. He clings to the double‑minded and the empty, and he prophesies to them in a corner, and deceives them by speaking everything according to their desires, emptily; for he also answers the empty. For an empty vessel, placed together with empty ones, is not broken, but they agree with one another.
translation:
  language: en
  text: 13. He never goes near a gathering of people who do what is right; instead, he avoids them. He attaches himself to people who waver and are empty inside. He speaks prophecies to them privately and deceives them by telling them whatever they want to hear, speaking empty words. For he also answers empty people. An empty jar placed among other empty jars does not break; they suit one another.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: a gathering of righteous men
  simplified_phrase: a gathering of people who do what is right
  preserved_meaning: He avoids the community of righteous people.
  reasoning_layer_used: POB translation and immediate contrast
  rationale: The wording explains righteousness as conduct while preserving the group in view.
- pob_phrase: He clings to the double-minded and the empty
  simplified_phrase: He attaches himself to people who waver and are empty inside
  preserved_meaning: He deliberately aligns himself with unstable, inwardly empty people.
  reasoning_layer_used: POB imagery and immediate context
  rationale: “Attaches himself” retains the force of clinging while the descriptions clarify both traits.
- pob_phrase: he prophesies to them in a corner, and deceives them by speaking everything according to their desires, emptily
  simplified_phrase: He speaks prophecies to them privately and deceives them by telling them whatever they want to hear, speaking empty words
  preserved_meaning: His private prophecies are empty, deceptive, and tailored to his hearers’ desires.
  reasoning_layer_used: POB translation and clause logic
  rationale: The revision clarifies the setting and deception without making the audience the cause of his empty speech.
interpretive_expansions:
- pob_phrase: the empty
  rendering: people who ... are empty inside
  claim: Their emptiness describes their inward character rather than a physical condition.
  evidence:
  - The passage contrasts them with righteous people.
  - The empty-jar comparison presents emptiness metaphorically.
  confidence: high
  alternatives_preserved:
  - spiritually empty people
  - empty people
translation_notes:
  risk_flags:
  - risk: The empty-jar image may remain unusual to modern readers.
    mitigation: The repeated references to empty people and empty words keep the comparison connected to the prophet and his hearers.
