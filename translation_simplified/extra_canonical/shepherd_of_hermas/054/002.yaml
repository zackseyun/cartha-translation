  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/002.yaml
  text: 'As I was saying these things within myself, I suddenly see him seated beside me and saying this: “Why are you double-minded about the commandments that I commanded you? They are good. Do not be double-minded at all, but clothe yourself with the faith of the Lord, and you will walk in them; for I will strengthen you in them.'
translation:
  language: en
  text: While I was thinking about these things, I suddenly saw him sitting beside me. He said, “Why are you wavering about the commandments I gave you? They are good. Do not waver at all. Instead, clothe yourself with faith in the Lord, and you will follow them, for I will give you strength to do so.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: As I was saying these things within myself
  simplified_phrase: While I was thinking about these things
  preserved_meaning: He was speaking inwardly rather than aloud.
  reasoning_layer_used: POB text and immediate narrative context
  rationale: “Thinking” naturally conveys inward speech in this setting.
- pob_phrase: Why are you double-minded ... Do not be double-minded at all
  simplified_phrase: Why are you wavering ... Do not waver at all
  preserved_meaning: He is warned against divided or hesitant resolve concerning obedience.
  reasoning_layer_used: POB repetition and independent grounding review
  rationale: “Wavering” retains the broader force of double-mindedness without limiting it to intellectual doubt.
- pob_phrase: you will walk in them; for I will strengthen you in them
  simplified_phrase: you will follow them, for I will give you strength to do so
  preserved_meaning: Faith in the Lord enables continued obedience to the commandments.
  reasoning_layer_used: POB clause relationship and immediate context
  rationale: The wording clearly expresses the walking image’s contextual sense of obedient living.
translation_notes:
  risk_flags:
  - risk: Replacing “double-minded” may weaken its image of divided inner resolve.
    mitigation: The repeated word “wavering” preserves hesitant resolve rather than mere intellectual doubt.
  - risk: Rendering “walk in them” as “follow them” removes the source-language image.
    mitigation: The clearer wording preserves its contextual meaning of continued obedience.
