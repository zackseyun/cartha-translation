  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/006.yaml
  text: He was pasturing very many sheep, and the sheep were as if luxuriating and being very extravagant, and they were cheerful, skipping here and there. And the shepherd himself was very cheerful over his flock; and the very appearance of the shepherd was exceedingly cheerful, and he ran around among the sheep.
translation:
  language: en
  text: He was tending a very large flock of sheep. The sheep seemed to be living luxuriously and extravagantly. They were happy and leaped here and there. The shepherd was delighted with his flock. He looked extremely happy, and he ran about among the sheep.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: pasturing very many sheep
  simplified_phrase: tending a very large flock of sheep
  preserved_meaning: He was caring for a great number of sheep.
  reasoning_layer_used: POB base text
  rationale: This ordinary pastoral expression is clearer and more natural.
- pob_phrase: as if luxuriating and being very extravagant
  simplified_phrase: seemed to be living luxuriously and extravagantly
  preserved_meaning: The sheep appeared to enjoy luxury and lavish excess.
  reasoning_layer_used: POB base text and source image
  rationale: The wording preserves both parts of the image without specifying a form of excess.
- pob_phrase: the very appearance of the shepherd was exceedingly cheerful
  simplified_phrase: He looked extremely happy
  preserved_meaning: His outward appearance showed intense happiness.
  reasoning_layer_used: POB base text
  rationale: The direct sentence removes abstraction while retaining the visible emotion.
