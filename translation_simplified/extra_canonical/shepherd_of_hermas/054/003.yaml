  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/003.yaml
  text: “These commandments are beneficial for those who are about to repent; for if they do not walk in them, their repentance is in vain.
translation:
  language: en
  text: These commandments help those who are ready to repent. But if they do not live by them, their repentance is useless.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: are beneficial for
  simplified_phrase: help
  preserved_meaning: The commandments benefit people who intend to repent.
  reasoning_layer_used: POB translation
  rationale: The common verb “help” states the same benefit more directly.
- pob_phrase: those who are about to repent
  simplified_phrase: those who are ready to repent
  preserved_meaning: The statement concerns people who intend to turn away from wrongdoing.
  reasoning_layer_used: POB translation and immediate context
  rationale: “Ready to repent” expresses intended repentance without implying only immediate timing.
- pob_phrase: walk in them
  simplified_phrase: live by them
  preserved_meaning: True repentance requires conduct shaped by the commandments.
  reasoning_layer_used: POB translation
  rationale: “Live by them” makes the biblical walking image understandable as daily conduct.
translation_notes:
  risk_flags:
  - risk: Replacing “walk in them” removes the explicit walking image.
    mitigation: “Live by them” preserves its practical force as ongoing conduct.
