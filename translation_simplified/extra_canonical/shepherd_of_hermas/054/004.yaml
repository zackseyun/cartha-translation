  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/004.yaml
  text: “You, therefore, who are repenting, cast off the evils of this age that wear you down; and having put on every virtue of righteousness, you will be able to keep these commandments and no longer add to your sins. If, therefore, you add nothing further, you will depart from your former sins. Walk, therefore, in these my commandments, and you will live to God. These things [all] have been spoken to you by me.”
translation:
  language: en
  text: So, you who are turning away from your sins, throw off the evils of this age that wear you down. Clothe yourselves with every righteous virtue. Then you will be able to obey these commandments and stop adding to your sins. If you add no more sins, you will leave your former sins behind. Walk in these commandments of mine—follow them—and you will live as people devoted to God. I have told you these things.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: who are repenting
  simplified_phrase: who are turning away from your sins
  preserved_meaning: Repentance means rejecting one's sinful course.
  reasoning_layer_used: POB translation and immediate context
  rationale: This explains repentance in ordinary English without weakening its moral force.
- pob_phrase: having put on every virtue of righteousness
  simplified_phrase: Clothe yourselves with every righteous virtue
  preserved_meaning: The command retains both the clothing image and the call to practice every righteous virtue.
  reasoning_layer_used: POB translation imagery
  rationale: A direct command is clearer than the dense participial construction.
- pob_phrase: you will live to God
  simplified_phrase: you will live as people devoted to God
  preserved_meaning: Obedient life is directed toward God and marked by allegiance to him.
  reasoning_layer_used: POB translation and grounding review
  rationale: The fuller wording avoids reducing the phrase to purpose or service alone.
interpretive_expansions:
- pob_phrase: Walk, therefore, in these my commandments
  rendering: Walk in these commandments of mine—follow them
  claim: Walking in the commandments means continuing to obey them in one's life.
  evidence:
  - The immediate context repeatedly calls for keeping the commandments.
  confidence: high
  alternatives_preserved:
  - The walking image remains in the text.
translation_notes:
  risk_flags:
  - risk: The bracketed word “all” has uncertain textual status in POB.
    mitigation: The draft omits “all” rather than presenting it as certain.
  - risk: “Devoted to God” makes the direction of “live to God” more explicit.
    mitigation: The wording preserves allegiance and God-directed life without adding a doctrinal claim.
