  text: And after he had spoken these things with me, he says to me, “Let us go into the country, and I will show you the shepherds of the sheep.” “Let us go, sir,” I say. And we came to a certain plain, and he shows me a shepherd, a young man, clothed in a composite garment, saffron in color.
translation:
  language: en
  text: 'After he had finished speaking with me, he said, “Let us go out into the countryside, and I will show you the shepherds who tend the sheep.”


    “Let us go, sir,” I replied.


    We came to a plain, where he showed me a young shepherd. The young man was wearing a saffron-colored garment with a varied design.'
