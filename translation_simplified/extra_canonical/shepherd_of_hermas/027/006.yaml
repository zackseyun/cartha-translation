  text: Therefore the one who gives is innocent; for just as he received from the Lord the ministry to carry out, he carried it out simply, making no distinction as to whom he should give or not give. Thus this ministry, having been carried out simply, became glorious before God. Therefore the one who thus ministers simply to God will live.
translation:
  language: en
  text: So the person who gives is innocent. The Lord gave him the work of giving, and he carried it out without favoring some people over others or deciding who should receive help. Because he carried out this service so impartially, it became glorious before God. Therefore, anyone who serves God in this impartial way will live.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: received from the Lord the ministry to carry out
  simplified_phrase: The Lord gave him the work of giving
  preserved_meaning: The work is a ministry received from the Lord and carried out by the giver.
  reasoning_layer_used: POB text and immediate context
  rationale: This identifies the ministry as giving in direct, common English.
- pob_phrase: making no distinction as to whom he should give or not give
  simplified_phrase: without favoring some people over others or deciding who should receive help
  preserved_meaning: The giver must not discriminate among possible recipients.
  reasoning_layer_used: POB text and independent grounding review
  rationale: This makes the practical meaning of giving simply explicit without reducing it to sincerity.
- pob_phrase: the one who thus ministers simply to God
  simplified_phrase: anyone who serves God in this impartial way
  preserved_meaning: The promise applies to one who serves God without discrimination in giving.
  reasoning_layer_used: POB repeated wording and independent grounding review
  rationale: The conclusion now points back to the impartial manner defined in the preceding sentence.
interpretive_expansions:
