  text: But clothe yourself with dignity, in which there is no evil stumbling block, but all things are smooth and cheerful. Do what is good, and from your labors, which God gives you, give simply to all who are in need, not hesitating as to whom you should give or to whom you should not give. Give to all, for God wants all to be given from his own gifts.
translation:
  language: en
  text: Let dignity be your clothing. In it there is no evil obstacle; instead, everything is smooth and joyful. Do what is good. From what you receive through the work God gives you, give freely to everyone in need. Do not try to decide who should receive your help and who should not. Give to everyone, because God wants his own gifts shared with all.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: clothe yourself with dignity
  simplified_phrase: Let dignity be your clothing
  preserved_meaning: Dignity remains a quality the reader must put on like clothing.
  reasoning_layer_used: POB main text and source-language image
  rationale: The recast preserves the clothing image in natural English.
- pob_phrase: in which there is no evil stumbling block, but all things are smooth and cheerful
  simplified_phrase: In it there is no evil obstacle; instead, everything is smooth and joyful
  preserved_meaning: Dignity contains no evil obstacle and is marked by smoothness and joy.
  reasoning_layer_used: POB main text and independent grounding review
  rationale: This keeps the contrast without adding whose way might be obstructed.
- pob_phrase: not hesitating as to whom you should give or to whom you should not give
  simplified_phrase: Do not try to decide who should receive your help and who should not
  preserved_meaning: The giver must not sort needy people into those who will and will not receive help.
  reasoning_layer_used: POB main text and independent grounding review
  rationale: The command now covers choosing between recipients rather than only debating internally.
