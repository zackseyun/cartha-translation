  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/005.yaml
  text: Therefore those who receive will render an account to God why they received and for what; for those who receive while afflicted will not be judged, but those who receive in hypocrisy will pay the penalty.
translation:
  language: en
  text: Therefore, those who accept help will have to answer to God for why they accepted it and what purpose they had for it. Those who accept help because they are in distress will not be judged, but those who accept it under false pretenses will be punished.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: will render an account to God
  simplified_phrase: will have to answer to God
  preserved_meaning: Recipients remain accountable to God for accepting help.
  reasoning_layer_used: POB translation and immediate contrast
  rationale: This common expression preserves the force of divine accountability.
- pob_phrase: why they received and for what
  simplified_phrase: why they accepted it and what purpose they had for it
  preserved_meaning: Recipients must account for both their reason and purpose in receiving.
  reasoning_layer_used: POB clause structure and grounding review
  rationale: The broader wording avoids limiting their purpose to personal need.
- pob_phrase: receive in hypocrisy
  simplified_phrase: accept it under false pretenses
  preserved_meaning: The warning concerns dishonest receiving rather than genuine distress.
  reasoning_layer_used: POB moral contrast
  rationale: This makes the deception clear without inventing a specific scheme.
interpretive_expansions:
- pob_phrase: those who receive
  rendering: those who accept help
  claim: What they receive is assistance intended for people in distress.
  evidence:
  - The verse contrasts distressed recipients with hypocritical recipients.
  confidence: high
  alternatives_preserved:
  - those who receive assistance
  - those who receive charity
translation_notes:
  risk_flags:
  - risk: “Under false pretenses” emphasizes deception within the broader idea of hypocrisy.
    mitigation: The contrast with genuine distress supports dishonest receiving as the intended sense.
