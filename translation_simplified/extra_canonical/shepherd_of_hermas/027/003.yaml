  text: Slander is evil; it is an unsettled demon, never at peace, but always dwelling amid divisions. So keep away from it, and you will always have prosperity with all.
translation:
  language: en
  text: Slander is evil. It is a restless demon, never at peace and always living where people are divided. Stay away from it, and things will go well between you and everyone.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: an unsettled demon
  simplified_phrase: a restless demon
  preserved_meaning: Slander is pictured as a demonic force that cannot remain at peace.
  reasoning_layer_used: POB main text and source-language image
  rationale: “Restless” makes the demon’s unsettled character immediately clear while preserving the image.
- pob_phrase: always dwelling amid divisions
  simplified_phrase: always living where people are divided
  preserved_meaning: Slander thrives in situations of conflict and division.
  reasoning_layer_used: POB main text and immediate context
  rationale: The concrete wording explains “amid divisions” without weakening its force.
- pob_phrase: you will always have prosperity with all
  simplified_phrase: things will go well between you and everyone
  preserved_meaning: Avoiding slander leads to good relations with other people.
  reasoning_layer_used: POB main text and contrast with divisions
  rationale: This avoids the modern financial sense of “prosperity” and preserves the relational meaning.
translation_notes:
  risk_flags:
  - risk: “Things will go well” may sound broader than interpersonal well-being.
    mitigation: “Between you and everyone” confines the promise to relationships, matching the contrast with division.
