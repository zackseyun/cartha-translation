  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/002.yaml
  text: First of all, slander no one, and do not listen with pleasure to someone who slanders; otherwise you too, the hearer, will be guilty of the slanderer’s sin if you believe the slander you hear. For by believing it, you yourself also will have something against your brother. Thus you will be guilty of the slanderer’s sin.
translation:
  language: en
  text: First of all, do not speak evil about anyone, and do not enjoy listening to someone who does. If you believe the slander you hear, you share in the slanderer’s sin. By believing it, you will also hold something against your brother. In this way, you become guilty of the slanderer’s sin.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: slander no one
  simplified_phrase: do not speak evil about anyone
  preserved_meaning: The command broadly forbids harmful speech against another person without limiting it to false claims.
  reasoning_layer_used: POB translation and grounding review
  rationale: The clearer phrase preserves the broad force of “slander.”
- pob_phrase: do not listen with pleasure to someone who slanders
  simplified_phrase: do not enjoy listening to someone who does
  preserved_meaning: The hearer must not take pleasure in another person’s harmful speech.
  reasoning_layer_used: POB translation
  rationale: The recast wording is natural while keeping speaking and listening distinct.
- pob_phrase: you yourself also will have something against your brother
  simplified_phrase: you will also hold something against your brother
  preserved_meaning: Believing slander leads the hearer to adopt a hostile judgment against a fellow believer.
  reasoning_layer_used: POB translation and causal flow
  rationale: The familiar expression clarifies the relational consequence without adding when it begins.
translation_notes:
  risk_flags:
  - risk: “Speak evil about” may be heard as covering all negative speech, even when truthful and necessary.
    mitigation: The following sentences retain “slander,” which keeps the command tied to harmful accusatory speech.
