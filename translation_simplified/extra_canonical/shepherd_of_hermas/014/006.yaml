  text: 6. And I answered her, “Lady, when then will they become fit for the building?” She said, “When their wealth that ensnares them has been cut away, then they will be useful to God. For just as a round stone, unless it is cut and casts off something from itself, cannot become square, so also those who are rich in this age, unless their wealth is cut away, cannot become useful to the Lord.
translation:
  language: en
  text: 6. I asked her, “Lady, when will they be ready to be used in the building?” She answered, “They will be useful to God when the wealth that traps them has been cut away. A round stone cannot be made square unless it is cut and some of it is removed. In the same way, the rich people of this age cannot be useful to the Lord unless their wealth is cut away.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: when then will they become fit for the building?
  simplified_phrase: when will they be ready to be used in the building?
  preserved_meaning: The question asks when these people will be suitable as stones in the building.
  reasoning_layer_used: POB text and immediate stone-building context
  rationale: The new wording makes their intended use clear without explaining away the image.
- pob_phrase: their wealth that ensnares them
  simplified_phrase: the wealth that traps them
  preserved_meaning: Their wealth holds them back from being useful to God.
  reasoning_layer_used: POB source-driven wording
  rationale: “Traps” expresses the force of “ensnares” in common English.
- pob_phrase: unless it is cut and casts off something from itself
  simplified_phrase: unless it is cut and some of it is removed
  preserved_meaning: Part of the round stone must be cut away so it can become square.
  reasoning_layer_used: POB text and controlling comparison
  rationale: The passive wording states the physical action naturally while preserving the cutting image.
translation_notes:
  risk_flags:
  - risk: Readers may take “wealth is cut away” as a complete explanation of how the rich are changed.
    mitigation: The draft preserves the POB’s concrete image without adding an unsupported interpretation.
