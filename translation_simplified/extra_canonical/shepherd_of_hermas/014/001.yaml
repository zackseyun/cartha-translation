  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/001.yaml
  text: “Do you want to know about those who are being cut down and thrown far from the tower? These are the sons of lawlessness; they believed in hypocrisy, and no wickedness departed from them. For this reason they have no salvation, because they are not fit for the building on account of their wicked deeds. Therefore they were cut down and thrown far away because of the anger of the Lord, because they provoked him.
translation:
  language: en
  text: “Do you want to know about those who are being cut down and thrown far away from the tower? They are people characterized by lawlessness. They trusted in hypocrisy, and wickedness never left them. For this reason they have no salvation, because their wicked deeds make them unfit to be included in the tower being built. Therefore, they were cut down and thrown far away because they provoked the Lord to anger.”
  philosophy: optimal-equivalence
