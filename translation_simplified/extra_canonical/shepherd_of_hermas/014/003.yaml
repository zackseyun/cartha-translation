  text: 3. “And those that have cracks—who are they? These are the ones who harbor things against one another in their hearts and are not at peace among themselves, but have a face of peace; yet when they depart from one another, their evils remain in their hearts. These, then, are the cracks that the stones have.
translation:
  language: en
  text: 3. “Who are the stones with cracks? They are people who harbor resentment against one another in their hearts and are not at peace with each other. They appear peaceful, but when they part, the evil in their hearts remains. These are the cracks in the stones.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: those that have cracks
  simplified_phrase: the stones with cracks
  preserved_meaning: The people are pictured as cracked stones.
  reasoning_layer_used: POB text and immediate image
  rationale: Naming the stones makes the controlling metaphor clear.
- pob_phrase: harbor things against one another in their hearts
  simplified_phrase: harbor resentment against one another in their hearts
  preserved_meaning: They continue to hold inward hostility toward each other.
  reasoning_layer_used: POB text and immediate context
  rationale: Resentment clarifies the hostility without reducing it to a passing feeling.
- pob_phrase: have a face of peace
  simplified_phrase: appear peaceful
  preserved_meaning: Their outward peace conceals inward evil.
  reasoning_layer_used: POB contrast within the sentence
  rationale: The common wording preserves the contrast between appearance and heart.
