  text: '7. “Learn first from yourself: when you were rich, you were useless; but now you are useful and beneficial for life. Become useful to God; for you yourself also are used from the same stones.”'
translation:
  language: en
  text: 7. “First, learn from your own experience. When you were rich, you were useless. But now you are useful in ways that benefit life. Make yourself useful to God, because you too are being put to use with these same stones.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The wording links the hearer with the stones but does not clearly state the exact relationship.
    reason: source_note
simplification_decisions:
- pob_phrase: Learn first from yourself
  simplified_phrase: First, learn from your own experience
  preserved_meaning: The hearer is to recognize the lesson by reflecting on his own changed condition.
  reasoning_layer_used: POB translation and immediate contrast
  rationale: The reflexive expression is recast in natural English without changing its point.
- pob_phrase: useful and beneficial for life
  simplified_phrase: useful in ways that benefit life
  preserved_meaning: His present usefulness benefits life, without specifying who receives that benefit.
  reasoning_layer_used: POB translation and grounding review
  rationale: This clarifies the abstract phrase without claiming that he brings life to others.
- pob_phrase: you yourself also are used from the same stones
  simplified_phrase: you too are being put to use with these same stones
  preserved_meaning: The hearer is connected with the same stone image and is also put to use.
  reasoning_layer_used: POB translation, source-language image, and grounding review
  rationale: The stone image remains while the difficult relationship is left open.
translation_notes:
  risk_flags:
  - risk: “Benefit life” remains broad because the POB does not identify a particular recipient or kind of benefit.
    mitigation: The draft avoids adding “others” or saying that the hearer brings life.
  - risk: The exact relationship between the hearer and the stones is grammatically uncertain.
    mitigation: The main text uses the broad link “with,” and the footnote preserves the uncertainty.
