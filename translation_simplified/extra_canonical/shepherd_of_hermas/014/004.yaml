  text: 4. “And the mutilated ones—these are those who have believed and have the greater part in righteousness, but have certain parts of lawlessness. For this reason they are mutilated and not whole.
translation:
  language: en
  text: 4. “The ones with pieces missing represent people who have believed and are righteous in most respects, but still have some lawlessness remaining. That is why they are incomplete rather than whole.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the mutilated ones
  simplified_phrase: the ones with pieces missing
  preserved_meaning: They are visibly incomplete because parts are lacking.
  reasoning_layer_used: POB translation and immediate symbolic contrast
  rationale: This keeps the image of lost parts without the distracting modern sense of bodily violence.
- pob_phrase: these are those who
  simplified_phrase: represent people who
  preserved_meaning: The pictured figures symbolize a particular group of believers.
  reasoning_layer_used: POB translation and paragraph form
  rationale: “Represent” makes the symbolic identification clear in natural English.
- pob_phrase: have the greater part in righteousness, but have certain parts of lawlessness
  simplified_phrase: are righteous in most respects, but still have some lawlessness remaining
  preserved_meaning: Righteousness predominates, yet lawlessness remains present in part.
  reasoning_layer_used: POB controlling meaning
  rationale: The rewrite states the contrast directly while preserving both righteousness and remaining lawlessness.
translation_notes:
  risk_flags:
  - risk: “Pieces missing” may sound less severe than “mutilated.”
    mitigation: The concluding contrast between incomplete and whole preserves the force of damaged integrity.
