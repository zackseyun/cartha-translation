  text: 5. “And the white and round ones that do not fit into the building—who are they, Lady?” She answered me, saying, “How long will you be foolish and without understanding, asking about everything and understanding nothing? These are those who have faith, but also have the wealth of this age. When affliction comes, because of their wealth and their business dealings they deny their Lord.”
translation:
  language: en
  text: 5. I asked, “Lady, who are the white, round stones that do not fit into the building?” She replied, “How long will you remain foolish and fail to understand? You ask about everything, yet understand nothing. These stones are people who have faith but are also rich in this world. When suffering comes, they deny their Lord because of their wealth and business dealings.”
