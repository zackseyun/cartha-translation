  text: He says, “I told you just now that you are crafty and headstrong, asking for the interpretations of the parables. But since you are so persistent, I will interpret for you the parable of the field and the rest. He entrusted them to the angels to keep them; and he himself cleansed their sins, having labored much and endured many toils—for no one can dig without toil or labor.
translation:
  language: en
  text: He says, “I just told you that you are crafty and stubborn because you keep asking what the parables mean. But since you will not give up, I will explain the parable of the field and the rest. He entrusted them to the angels for safekeeping. He himself cleansed their sins, working hard and enduring many hardships—for no one can dig without hard work.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: headstrong, asking for the interpretations of the parables
  simplified_phrase: stubborn because you keep asking what the parables mean
  preserved_meaning: His persistent requests for explanations are criticized as stubbornness.
  reasoning_layer_used: POB translation and immediate context
  rationale: The wording clearly connects his stubbornness with his repeated requests.
- pob_phrase: He entrusted them to the angels to keep them
  simplified_phrase: He entrusted them to the angels for safekeeping
  preserved_meaning: The angels were charged with guarding those entrusted to them.
  reasoning_layer_used: POB translation
  rationale: “For safekeeping” expresses the purpose naturally while leaving the pronoun unresolved.
- pob_phrase: having labored much and endured many toils—for no one can dig without toil or labor
  simplified_phrase: working hard and enduring many hardships—for no one can dig without hard work
  preserved_meaning: Cleansing their sins required strenuous effort, pictured as digging.
  reasoning_layer_used: POB translation and source-language image
  rationale: The rewrite reduces repetition without imposing a sequence or removing the digging image.
