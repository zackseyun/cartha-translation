  text: Therefore, having cleansed the sins of the people, he showed them the paths of life, giving them the law that he received from his Father. “You see,” he says, “that he himself is Lord of the people, having received all authority from his Father. And as for the Lord’s taking his Son and the glorious angels as counselors concerning the inheritance of the slave—listen.
translation:
  language: en
  text: Therefore, after cleansing the people from their sins, he showed them the paths that lead to life. He also gave them the law he had received from his Father. “You see,” he says, “that he himself is Lord of the people, for he has received all authority from his Father. Now listen as I tell how the Lord consulted his Son and the glorious angels about the slave’s inheritance.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: having cleansed the sins of the people
  simplified_phrase: after cleansing the people from their sins
  preserved_meaning: He removed the people’s sins before showing them the paths of life.
  reasoning_layer_used: POB base text and immediate clause sequence
  rationale: The participial clause becomes a natural time sequence without changing the order of events.
- pob_phrase: giving them the law that he received from his Father
  simplified_phrase: He also gave them the law he had received from his Father.
  preserved_meaning: The law given to the people came from his Father.
  reasoning_layer_used: POB base text
  rationale: A separate sentence makes the action and the law’s source easier to follow.
- pob_phrase: the Lord’s taking his Son and the glorious angels as counselors concerning the inheritance of the slave
  simplified_phrase: how the Lord consulted his Son and the glorious angels about the slave’s inheritance
  preserved_meaning: The Lord took counsel with his Son and the glorious angels regarding the slave’s inheritance.
  reasoning_layer_used: POB source-driven wording and grounding review
  rationale: “Consulted” clearly preserves deliberation without implying that the Lord appointed new advisers.
