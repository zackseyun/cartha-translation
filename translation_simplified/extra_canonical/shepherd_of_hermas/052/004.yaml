  yaml_path: translation/extra_canonical/shepherd_of_hermas/052/004.yaml
  text: Therefore he took the Son and the glorious angels as counselors, in order that this flesh also, having served the Spirit blamelessly, might have some place of dwelling, and might not seem to have lost the reward of its service. For every flesh that is found undefiled and unstained, in which the Holy Spirit has dwelt, will receive a reward. You have the interpretation of this parable also.”
translation:
  language: en
  text: Therefore, he consulted the Son and the glorious angels. He did this so that this flesh, which had served the Spirit without fault, would also have a place to live and would not seem to have lost the reward for its service. Every flesh that is found pure and unstained, and in which the Holy Spirit has lived, will receive a reward. “Now you also have the meaning of this parable.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: took the Son and the glorious angels as counselors
  simplified_phrase: consulted the Son and the glorious angels
  preserved_meaning: He sought counsel from the Son and the glorious angels.
  reasoning_layer_used: POB translation and high-agreement cross-check
  rationale: The common verb “consulted” clearly expresses taking others as counselors.
- pob_phrase: having served the Spirit blamelessly, might have some place of dwelling
  simplified_phrase: which had served the Spirit without fault, would also have a place to live
  preserved_meaning: The flesh served the Spirit blamelessly and was to receive a dwelling place.
  reasoning_layer_used: POB translation and source clause structure
  rationale: The participial construction becomes a direct relative clause while keeping service and dwelling distinct.
- pob_phrase: You have the interpretation of this parable also
  simplified_phrase: Now you also have the meaning of this parable
  preserved_meaning: The speaker has finished explaining what the parable means.
  reasoning_layer_used: POB discourse context
  rationale: “Meaning” is more natural for common readers than “interpretation” here.
translation_notes:
  risk_flags:
  - risk: Modern readers may mistake “flesh” for sinful desire.
    mitigation: The term is retained because the passage contrasts flesh with the Spirit and says that flesh receives a reward.
  - risk: “A place to live” may sound more concrete than “place of dwelling.”
    mitigation: The wording preserves the dwelling image without defining its location or nature.
