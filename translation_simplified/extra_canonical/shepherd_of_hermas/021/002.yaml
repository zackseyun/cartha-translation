  yaml_path: translation/extra_canonical/shepherd_of_hermas/021/002.yaml
  text: For just as when some good message comes to someone who is grieving, he immediately forgets his former sorrows and welcomes nothing else except the message that he heard, and from then on he is strengthened for what is good, and his spirit is renewed because of the joy that he received, so also you have received a renewal of your spirits by seeing these good things.
translation:
  language: en
  text: Suppose a grieving person receives good news. He quickly forgets his earlier sorrows and welcomes only the message he has heard. From then on, he is strengthened for what is good, and the joy he received renews his spirit. In the same way, seeing these good things has renewed your spirits.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: For just as when some good message comes to someone who is grieving
  simplified_phrase: Suppose a grieving person receives good news.
  preserved_meaning: The comparison begins with a grieving person receiving an encouraging message.
  reasoning_layer_used: POB translation and immediate comparison
  rationale: The long opening clause becomes a direct, natural setup.
- pob_phrase: welcomes nothing else except the message that he heard
  simplified_phrase: welcomes only the message he has heard
  preserved_meaning: The grieving person exclusively welcomes the good message.
  reasoning_layer_used: POB translation and grounding review
  rationale: This preserves the image of welcome rather than changing it to mental preoccupation.
- pob_phrase: his spirit is renewed because of the joy that he received
  simplified_phrase: the joy he received renews his spirit
  preserved_meaning: The received joy is the cause of his inner renewal.
  reasoning_layer_used: POB translation and clause relationships
  rationale: The causal relationship is recast in a shorter active sentence.
translation_notes:
  risk_flags:
  - risk: “Strengthened for what is good” remains somewhat broad in English.
    mitigation: The wording preserves POB’s scope without narrowing it to moral action.
