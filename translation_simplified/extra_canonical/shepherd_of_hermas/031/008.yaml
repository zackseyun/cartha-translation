  text: “He does not sin,” he says; “but if someone remains by himself, he obtains for himself greater honor and great glory with the Lord; but if he also marries, he does not sin. Therefore keep purity and dignity, and you will live to God. These things that I speak to you and am about to speak, keep from now on, from the day you were entrusted to me, and I will dwell in your house. And for your former trespasses there will be forgiveness, if you keep my commandments; and there will also be forgiveness for all, if they keep these commandments of mine and walk in this purity.”
translation:
  language: en
  text: '“He does not sin,” he said. “But if a man remains unmarried, he gains greater honor and great glory with the Lord. If he marries, however, he does not sin. So remain pure and honorable, and you will live for God.


    “From now on, keep everything I tell you, including what I am about to tell you. Do this from the day you were placed in my care, and I will live in your house. Your past sins will be forgiven if you obey my commands. Everyone else will also be forgiven if they obey these commands of mine and live in this purity.”'
  philosophy: optimal-equivalence
