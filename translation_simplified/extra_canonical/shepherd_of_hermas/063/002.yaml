- pob_phrase: Seeing me girded and ready to serve him
  simplified_phrase: When he saw that I had fastened up my clothing and was ready to serve him
  preserved_meaning: The narrator had prepared his clothing for active service and stood ready to help.
  reasoning_layer_used: POB text and source-language image
  rationale: The wording explains the unfamiliar image of being girded without removing it.
- pob_phrase: by rank, just as each gave the rods
  simplified_phrase: rank by rank, in the same order in which each man handed over his rod
  preserved_meaning: The men were to be called in their established groups and original order.
  reasoning_layer_used: POB syntax and immediate context
  rationale: The command is divided and its distributive sense is made clear.
- pob_phrase: And I went out to the field and called them all; and they all stood in their ranks
  simplified_phrase: I went out to the field and called them all, and they stood in their ranks
  preserved_meaning: The narrator obeyed, and every man took his proper ranked position.
  reasoning_layer_used: POB narrative sequence
  rationale: Repeated conjunctions are streamlined while the sequence and result remain intact.
