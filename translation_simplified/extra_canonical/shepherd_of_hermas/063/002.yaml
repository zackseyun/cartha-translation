  text: 2. Seeing me girded and ready to serve him, he says, “Call the men whose rods have been planted, by rank, just as each gave the rods.” And I went out to the field and called them all; and they all stood in their ranks.
translation:
  language: en
  text: 2. When he saw that I had fastened up my clothing and was ready to serve him, he said, “Call the men whose rods were planted. Call them rank by rank, in the same order in which each man handed over his rod.” I went out to the field and called them all, and they stood in their ranks.
