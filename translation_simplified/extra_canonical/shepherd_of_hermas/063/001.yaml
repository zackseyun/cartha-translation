  text: And after a few days we came to the place, and the Shepherd sat down in the place of the angel, and I stood beside him. And he says to me, “Gird yourself with a raw-linen garment, and serve me.” So I girded myself with a clean raw-linen garment made from sackcloth.
translation:
  language: en
  text: A few days later, we came back to that place. The Shepherd sat down in the angel’s place, and I stood beside him. He said to me, “Put on a garment of unfinished linen and serve me.” So I put on a clean garment of unfinished linen made from sackcloth.
