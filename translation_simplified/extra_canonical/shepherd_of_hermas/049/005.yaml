  text: 1. He showed me many trees that had no leaves, but they seemed to me to be dry; for they were all alike. And he says to me, “Do you see these trees?” “I see,” I say, “sir, that they are alike and dry.” Answering, he says to me, “These trees that you see are those who dwell in this age.”
translation:
  language: en
  text: '1. He showed me many trees without leaves. They all looked alike, and they seemed dried up. He asked me, “Do you see these trees?”


    “Yes, sir,” I answered. “They all look alike and dried up.”


    He said, “The trees you see represent the people who live in this present age.”'
