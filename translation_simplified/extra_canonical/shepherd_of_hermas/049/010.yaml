  text: 2. “These trees that are sprouting,” he says, “are the righteous, who are about to dwell in the age to come; for the age to come is summer for the righteous, but winter for sinners. Therefore when the mercy of the Lord shines forth, then those serving God will be made manifest, and all will be made manifest.”
translation:
  language: en
  text: 2. He says, “These budding trees are the righteous, who will live in the age to come. That coming age will be like summer for the righteous but like winter for sinners. So when the Lord’s mercy shines out, those who serve God will be clearly seen, and everyone will be revealed.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: These trees that are sprouting
  simplified_phrase: These budding trees
  preserved_meaning: The trees remain a concrete image of new growth.
  reasoning_layer_used: POB text and immediate simile
  rationale: “Budding” expresses sprouting in concise, natural English.
- pob_phrase: are about to dwell in the age to come
  simplified_phrase: will live in the age to come
  preserved_meaning: The righteous are destined to inhabit the coming age.
  reasoning_layer_used: POB controlling translation
  rationale: “Will live” states future residence in ordinary English.
- pob_phrase: those serving God will be made manifest, and all will be made manifest
  simplified_phrase: those who serve God will be clearly seen, and everyone will be revealed
  preserved_meaning: The Lord’s mercy will openly reveal God’s servants and everyone else without specifying what is disclosed.
  reasoning_layer_used: POB text and grounding review
  rationale: The broad final disclosure remains broad while the repeated passive wording becomes natural English.
translation_notes:
  risk_flags:
  - risk: “Everyone” understands the broad term “all” as referring to people rather than all things.
    mitigation: The surrounding contrast concerns righteous people and sinners, while no content of the disclosure is added.
