translation:
  language: en
  text: 3. “In summer, the fruit of every tree becomes visible and is recognized for what it is. In the same way, the fruits of the righteous will become visible, and all will be known. [Those who are least] will flourish in that age.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The POB places “those who are least” in brackets, marking uncertainty in this wording.
    reason: source_note
simplification_decisions:
- pob_phrase: For just as in summer the fruits of each tree become visible and are recognized for what they are
  simplified_phrase: In summer, the fruit of every tree becomes visible and is recognized for what it is
  preserved_meaning: Summer makes each tree’s fruit visible and recognizable.
  reasoning_layer_used: POB controlling text
  rationale: The shorter wording preserves fruit, rather than trees, as what is recognized.
- pob_phrase: so also the fruits of the righteous will be visible
  simplified_phrase: In the same way, the fruits of the righteous will become visible
  preserved_meaning: The fruits of the righteous will be openly seen as the tree fruits are.
  reasoning_layer_used: POB controlling text and immediate comparison
  rationale: A new sentence makes the comparison easier to follow without explaining the image away.
- pob_phrase: '[those who are least] being flourishing in that age'
  simplified_phrase: '[Those who are least] will flourish in that age'
  preserved_meaning: The uncertain wording says that those who are least will flourish in that age.
  reasoning_layer_used: POB bracketed wording
  rationale: The participle becomes a direct clause while the brackets preserve uncertainty.
