  text: 2. “Why then, sir, are they as if dry and alike?” I say. “Because,” he says, “neither the righteous nor the sinners are visible in this age, but they are alike; for this age is winter for the righteous, and they are not visible while dwelling among sinners.”
translation:
  language: en
  text: 2. I asked, “Then why, sir, do they all look alike, as though they were dried up?” He answered, “Because in this present age, you cannot tell who is righteous and who is sinful; they all look alike. This age is like winter for the righteous. While they live among sinners, they cannot be recognized.”
  philosophy: optimal-equivalence
