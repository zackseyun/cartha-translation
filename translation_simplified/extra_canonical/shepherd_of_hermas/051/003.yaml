  text: '"If, then, you complete the fast in this way as I commanded you, your sacrifice will be acceptable before God, and this fast will be recorded; and the service performed in this way is good and cheerful and acceptable to the Lord.'
translation:
  language: en
  text: “So, if you carry out the fast as I commanded you, God will accept your sacrifice, and your fast will be recorded. Service offered in this way is good, joyful, and pleasing to the Lord.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: complete the fast in this way as I commanded you
  simplified_phrase: carry out the fast as I commanded you
  preserved_meaning: The person must observe the fast according to the given command.
  reasoning_layer_used: POB translation and immediate context
  rationale: The simpler wording preserves both the action and the required manner.
- pob_phrase: your sacrifice will be acceptable before God
  simplified_phrase: God will accept your sacrifice
  preserved_meaning: God regards the sacrifice favorably.
  reasoning_layer_used: POB translation
  rationale: The active sentence states the same meaning more directly.
- pob_phrase: the service performed in this way is good and cheerful and acceptable to the Lord
  simplified_phrase: Service offered in this way is good, joyful, and pleasing to the Lord
  preserved_meaning: Such service has a joyful character and receives the Lord’s approval.
  reasoning_layer_used: POB translation
  rationale: Common wording and a shorter sentence clarify the three qualities without merging them.
translation_notes:
  risk_flags:
  - risk: “Recorded” may suggest a literal written register.
    mitigation: The wording is retained because it preserves the POB’s definite accounting image without explaining it beyond the evidence.
