  reasoning_layer_used: POB translation and immediate context
  rationale: The rewrite replaces an unnatural clause with ordinary English while preserving its full scope.
- pob_phrase: the commands of prudence
  simplified_phrase: these commands of wisdom
  preserved_meaning: The commands are characterized by wise judgment.
  reasoning_layer_used: POB wording and immediate context
  rationale: “Wisdom” conveys the intended sense of “prudence” more naturally for modern readers.
- pob_phrase: The one who has received ... will fill his own soul
