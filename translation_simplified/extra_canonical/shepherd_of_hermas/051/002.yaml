  text: He says, "I will explain everything to you, and whatever I speak with you I will show you. The one who has received the commands of prudence will fill his own soul and will pray to the Lord on your behalf.
translation:
  language: en
  text: He says, “I will explain everything to you and make clear everything I tell you. Anyone who has received these commands of wisdom will fill their own soul and pray to the Lord for you.”
