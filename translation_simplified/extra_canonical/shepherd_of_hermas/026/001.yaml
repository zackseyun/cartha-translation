  yaml_path: translation/extra_canonical/shepherd_of_hermas/026/001.yaml
  text: First of all, believe that God is one—the one who created and ordered all things, and made all things out of nonexistence into being, and who contains all things, while he alone is uncontainable. Therefore believe him and fear him; and having feared, exercise self-control. Keep these things, and you will cast off all wickedness from yourself and put on every virtue of righteousness, and you will live to God, if you keep this command.
translation:
  language: en
  text: First, believe that there is one God. He created and ordered everything. He brought all things into existence from nothing. He holds all things, but nothing can hold him. So believe in him and fear him. Let that fear lead you to practice self-control. Keep these instructions, and you will throw off all wickedness and clothe yourself with every righteous virtue. You will live for God if you keep this command.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: made all things out of nonexistence into being
  simplified_phrase: brought all things into existence from nothing
  preserved_meaning: God created everything where nothing had existed before.
  reasoning_layer_used: POB main text
  rationale: The rewrite states the same creation claim in ordinary English.
- pob_phrase: contains all things, while he alone is uncontainable
  simplified_phrase: holds all things, but nothing can hold him
  preserved_meaning: God encompasses everything and cannot himself be encompassed.
  reasoning_layer_used: POB main text and source-image guardrail
  rationale: The concrete contrast remains without the abstract word “uncontainable.”
- pob_phrase: cast off all wickedness from yourself and put on every virtue of righteousness
  simplified_phrase: throw off all wickedness and clothe yourself with every righteous virtue
  preserved_meaning: The reader must reject all wickedness and take on every kind of righteous character.
  reasoning_layer_used: POB main text and source-image guardrail
  rationale: The clothing image remains while the sentence becomes natural English.
interpretive_expansions:
- pob_phrase: having feared, exercise self-control
  rendering: Let that fear lead you to practice self-control
  claim: Fear of God is presented as the basis for practicing self-control.
  evidence:
  - The POB clause directly links fearing God with the following exercise of self-control.
  confidence: high
  alternatives_preserved:
  - After fearing him, practice self-control.
translation_notes:
  risk_flags:
  - risk: “Instructions” identifies “these things” as the preceding commands.
    mitigation: The immediate imperative context and closing phrase “this command” support that referent.
  - risk: “Live for God” may sound more purpose-oriented than the unusual phrase “live to God.”
    mitigation: The wording keeps God as the defining direction of life while avoiding opaque English.
