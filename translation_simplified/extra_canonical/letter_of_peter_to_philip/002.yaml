translation:
  language: en
  text: 'Peter gathered the others, and they went to the mountain called Olivet, the Mount of Olives. In the past, they used to gather there with the blessed Christ while he lived in the body.


    When the apostles had gathered, they knelt and prayed:


    “Father, Father, Father of the light,

    the ones who cannot be destroyed belong to you.

    Hear us,

    just as you have been pleased with your holy Son, Jesus Christ,

    because for our sake he became a light in the darkness.

    Truly, hear us.”


    Then they prayed again:


    “Son of life, Son of immortality,

    you who live in the light,

    Son, Christ of immortality,

    our Redeemer,

    give us strength,

    because they are hunting us down to kill us.”'
  philosophy: optimal-equivalence
