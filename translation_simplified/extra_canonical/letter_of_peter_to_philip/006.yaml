translation:
  language: en
  text: '“As for your imprisonment, it has happened because you belong to me. When you rid yourselves of what can be destroyed, you will become lights among mortals.


    “You must battle the powers because, unlike you, they have no rest and do not want you to be saved.”


    The apostles worshiped again and said, “Lord, teach us how to fight the archons,[a] since they are stronger than we are.”


    A voice called to them from the appearance: “You must fight them because the archons fight against the Inner Person. This is how you must fight:


    “Gather together and teach the world about salvation and its promise. Clothe yourselves with my Father’s power, and bring your request before him. The Father will help you, just as he helped you when he sent me. [Fear] not. [I will always be with you], as I told you before when I lived in a body.”


    Then lightning flashed and thunder sounded from heaven. The one who had appeared to them there was taken up into heaven.'
