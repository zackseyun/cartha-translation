translation:
  language: en
  text: 'The apostles praised and thanked the Lord, and then they returned to Jerusalem.


    As they came down the mountain and traveled toward Jerusalem, they talked about the light that had appeared. Then a dispute about the Lord began. They said, “If our Lord suffered, how much more will we suffer?”


    Peter answered, “He suffered for our sake, and we too will have to suffer because we are small.”


    Then a voice spoke to them: “I have told you many times that you will have to suffer. You will be dragged into synagogues and brought before governors, and this will bring you suffering. But whoever will not suffer also [will not … my] Father […], so that he may […].”


    Yet the apostles were filled with joy. They went up to Jerusalem and entered the temple. There they taught salvation in the name of the Lord Jesus Christ, and they healed a great many people.


    Then Peter said to his disciples, “When our Lord Jesus lived in a human body, he told us everything, because he himself had come down. My brothers, listen carefully to me.”


    Peter was filled with a holy Spirit and said:


    “Our light, Jesus, came down.

    He was crucified.

    He wore a crown of thorns

    and was clothed in a purple robe.

    He was hung on a tree,

    laid in a tomb,

    and rose from among the dead.


    “My brothers, suffering like this does not belong to Jesus. We are the ones who have suffered because of the Mother’s trespass. That is why, while he was among us, he told us everything through symbols. The Lord Jesus, Son of the Father’s limitless glory, is the source of our life.


    “My brothers, let us not listen to these godless people or walk in […].”'
