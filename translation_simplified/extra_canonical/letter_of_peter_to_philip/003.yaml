translation:
  language: en
  text: 'Then a bright light appeared, and the mountain shone when the one who had appeared came into view. A voice called out to them:


    “Listen to my words and let me speak to you.


    Why are you looking for me?


    I am Jesus Christ, and I am always with you.”


    The apostles answered:


    “Lord, we want to understand the deficiency of the aeons and their fullness.[a] We also want to understand how we are held back in this place where we live.


    How did we come here?


    How will we leave?


    [The manuscript has a gap here.]


    How do we receive authority to speak openly and boldly?


    Why do the powers fight against us?”


    Then a voice called out from the light:


    “You yourselves testify that I have told you all these things. But because of your unfaithfulness, I will tell them to you again.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Aeons” is a technical term that may refer to spiritual ages, realms, or beings; the text speaks of their deficiency and fullness.
    reason: cultural_note
