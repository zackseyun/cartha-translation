  preserved_meaning: The apostles ask how their present dwelling restrains them.
  reasoning_layer_used: POB text, English witness, and grounding review
  rationale: The revision explains “dwelling-place” while retaining the question “how” and the broader image of restraint.
- pob_phrase: authority for boldness of speech
