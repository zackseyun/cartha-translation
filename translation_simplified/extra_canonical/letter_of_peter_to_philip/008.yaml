translation:
  language: en
  text: '“Peter and the other apostles then saw [him]. They were filled with a holy Spirit, and each of them healed people. They left to proclaim the Lord Jesus. They gathered together, greeted one another, and said, ‘Amen.’”


    “The apostles then separated to preach four messages, and they went with the power of Jesus, in peace.”


    “Instead, this proud one gave them power, and they worshiped and praised him.”


    “The proud one became arrogant because the powers praised him, and he became an opponent. They wanted to replace one image with another and one form with another.”


    “I spoke to the one who belongs to me, and that one listened to me—that is, you are the one [...]. You are the one who has listened today. I gave you authority to receive your father’s inheritance, and I took what belongs to me. The aeons were completed by means of their [salvation ...]—that is, a reduction.”


    “Son, teach us how to fight against the archons—the ruling powers—since they are here below.”


    “This is how you must fight, because the archons are fighting against the Inner Man.”


    “Gather together and teach the world about salvation. Clothe yourselves with my Father’s power and make your request known to him. The Father will help you, just as he helped you when he sent me.”


    “If our [Lord] died, how much more will we also have to die?”'
