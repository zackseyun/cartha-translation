  text: '“Now, about the fullness: I myself was sent down into the body for the sake of this lost seed. I descended into their mortal mold—their bodily form. But they did not recognize me because they thought I was a mortal person. I spoke with the one who belongs to me, and he listened to me, just as you have listened today. I gave him authority to enter the inheritance of his fatherhood, and I took [him] [] [. . .] filled [. . .] through his salvation. He had been deficiency, but he became fullness.[a]'
