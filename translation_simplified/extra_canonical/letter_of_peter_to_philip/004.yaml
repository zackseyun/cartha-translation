translation:
  language: en
  text: '“Now, concerning the deficiency of the aeons, this is how it happened: The Mother acted in defiance and without understanding, outside the order of the Greatness of the Father. She wanted to establish aeons. When she spoke, the tyrannical one followed. But when she abandoned a piece, he seized it, and it became the deficiency. This is the deficiency of the aeons.


    “The tyrannical one took that piece and planted it. He placed powers and authorities over it and confined it within the mortal aeons. Every cosmic power rejoiced that they had been created. Yet they did not know the Father, who existed before they did, because they were strangers to him. Instead, the tyrannical one was given power, and they worshiped and praised him.


    “The praise of these powers made the tyrannical one arrogant. He became an opponent and wanted to replace one image with another and one form with another. He assigned the powers under his authority the task of shaping mortal bodies. These bodies came into being from a mismatch in the likeness that had been made.”'
  philosophy: optimal-equivalence
