  previous_text: '“Now I will explain the deficiency among the realms called aeons. This is how it happened: The Mother acted in defiance and without understanding, outside the order of the Greatness of the Father. She wanted to establish aeons of her own. When she spoke, the tyrannical one followed. But when she left a piece behind, he seized it, and it became the deficiency. This is the deficiency of the aeons.


