translation:
  language: en
  text: '[] The Letter of Peter to Philip.


    Peter, an apostle of Jesus Christ, to Philip, our dear brother and fellow apostle, and to the brothers with you. Greetings.


    Brother, I want you to know that our Lord, the Savior of the whole world, instructed us to meet together so that we could teach and preach about the salvation promised to us by [] our Lord Jesus Christ.


    But you separated yourself from us and did not want to meet with us to learn how we could work together to proclaim the message.


    So, brother, are you willing to come as our God, Jesus, instructed?


    After Philip received and read the letter, he gladly went to Peter.'
