translation:
  language: en
  text: 'When the archons—the ruling powers—realized that Adam and Eve had disobeyed their commands, they entered Paradise. They approached Adam and Eve with an earthquake and terrible threats, wanting to see what had resulted from the help the two had received. Adam and Eve trembled violently and hid under the trees of Paradise. The archons did not know where they were, so they called, “Adam, where are you?”


    Adam answered, “Here I am. I hid because I was afraid of you and ashamed.”


    Not understanding what had happened, they asked him, “Who told you that you were clothed in shame? Have you eaten from that tree?”


    Adam replied, “The woman you gave me gave me its fruit, and I ate it.”


    Then they asked the woman, “What have you done?”


    She answered, “The teacher urged me to do it, and I ate.”


    The archons then approached the teacher. Because of him, their eyes became clouded, and they could do nothing against him. Powerless to harm him, they cursed him instead.


    Afterward, they approached the woman and cursed her and her descendants. Then they cursed Adam. Because of him, they also cursed the land and its crops. They cursed everything they had created. They have no blessing to give, for good cannot come from evil.


    From that day on, the ruling authorities truly understood that something was more powerful than they were.


    They knew only that their commands had not been obeyed. Because of the deathless man, terrible jealousy entered the world.


    When the archons realized that their Adam had gained a different kind of knowledge, they decided to test him. They gathered all the tame animals, the wild animals of the earth, and the birds of heaven. They brought them before Adam to find out what he would call them. When Adam saw them, he gave names to the creatures they had made.


    The archons became troubled because Adam came through every test successfully. They gathered to make plans against him. They said, “Look at Adam! He has become like one of us because he knows the difference between light and darkness. Perhaps he will now be deceived, as he was with the tree of knowledge. But he may also go to the tree of life, eat its fruit, become deathless, and become lord. Then he will hate and despise us and all our glory. He will condemn us and our universe. Come, let us drive him out of Paradise and send him down to the earth from which he was taken. Then he will no longer be able to know anything beyond what we ourselves can know.”


    So they drove Adam and his wife out of Paradise. Yet even this was not enough for them. They were still afraid.


    They went into Paradise and surrounded the tree of life with huge, terrifying beings—fiery living creatures called Cherubin. Among them they placed a flaming sword that turned constantly and fearfully, so that no earthly being could ever enter that place.


    Because the archons were jealous of Adam, they wanted to shorten their lifespans. But they could not fully do this because fate had been fixed from the beginning. Each one had been given a lifespan of 1,000 years, corresponding to the paths of the shining heavenly bodies. Even so, each of these evildoers took away ten years, reducing the full lifespan to 930 years. Those years pass in suffering, weakness, and harmful turmoil. This is how life has been from that day until the end of the age.'
