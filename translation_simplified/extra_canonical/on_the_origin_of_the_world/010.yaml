translation:
  language: en
  text: 'The Primal Parent saw the light glowing beautifully. He was amazed and felt deeply ashamed. As the light came forth, a wondrous human figure appeared within it. Only the Primal Parent and Pronoia, who lived with him, saw the figure. Yet its light became visible to all the beings of heaven, and they were all disturbed by it.


    When Pronoia saw this messenger, she fell in love with him. But he hated her because she lived in darkness. She wanted to embrace him, but she could not. Unable to put an end to her love, she poured out her light on the earth. From that day on, the messenger was called “Adam of Light,” meaning “the radiant man of blood.” The earth was spread out above him—the holy Adaman, meaning “the Holy Land of the Adamantine.”


    From that day on, every ruling power has honored the blood of the virgin. The earth was purified because of the blood of the virgin. The water was also purified through the likeness of Pistis Sophia, who had appeared to the Primal Parent in the waters. So it is rightly said, “[It appeared] through the waters.”[a] Because it gives life to everything, [...] the holy water purifies everything.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The words “It appeared” are supplied to complete the fragmentary statement.
    reason: textual_variant
  - marker: b
    text: The source witness marks a gap before the words “the holy water.”
    reason: source_note
