  preserved_meaning: The light reveals an extraordinary form resembling a human.
  reasoning_layer_used: POB text and English witness
  rationale: “Human figure” expresses the visible likeness in ordinary English.
- pob_phrase: all the hosts of heaven
  simplified_phrase: all the beings of heaven
  preserved_meaning: The light becomes visible to the assembled heavenly inhabitants.
  reasoning_layer_used: POB text and immediate context
  rationale: “Beings of heaven” avoids the misleading military sense of “hosts.”
- pob_phrase: every authority
  simplified_phrase: every ruling power
  preserved_meaning: All figures who exercise authority honor the virgin’s blood.
  reasoning_layer_used: POB text and English witness
  rationale: “Ruling power” makes the governing sense concrete without identifying the powers further.
