translation:
  language: en
  text: 'She first became pregnant with Abel by the first ruler. She had her other children by the seven authorities and their angels. All this happened according to what the Primal Parent had planned beforehand. The purpose was for the Primal Mother to carry every seed within her, mixed and joined with the destiny of the universe and its structures. Justice had prepared a plan concerning Eve: the forms shaped by the authorities would become places that held the light, and through these forms the light would condemn them.


    The Primal Adam comes from the Light. He is filled with spirit and appeared on the first day. The second Adam is filled with soul. He appeared on the sixth day, called “Aphrodite.” The third Adam is a being made from the earth—that is, the man of the Law. He appeared on the eighth day, called “Sun-Day,” after the lowly Rest-Day. The descendants of the earthly Adam multiplied and filled the earth. From within themselves, they developed every kind of skill possessed by the Adam filled with soul. Yet they all lived in ignorance.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the first archon
  simplified_phrase: the first ruler
  preserved_meaning: The figure remains the foremost ruling power in the account.
  reasoning_layer_used: English witness and POB text
  rationale: “Ruler” gives the ordinary meaning of the unfamiliar title “archon.”
- pob_phrase: the shaped forms of the authorities would become places enclosing the light
  simplified_phrase: the forms shaped by the authorities would become places that held the light
  preserved_meaning: The authorities’ forms remain unspecified while retaining the image of enclosing light.
  reasoning_layer_used: POB wording and grounding review
  rationale: This wording clarifies the clause without identifying the forms as bodies.
- pob_phrase: they produced all kinds of technological skills possessed by the Adam filled with soul
  simplified_phrase: they developed every kind of skill possessed by the Adam filled with soul
  preserved_meaning: The descendants develop the full range of skills associated with the soul-filled Adam.
  reasoning_layer_used: English witness, POB text, and grounding review
  rationale: “Every kind of skill” avoids a narrow modern sense of technology while keeping the stated relationship.
