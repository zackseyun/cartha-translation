translation:
  language: en
  text: 'When Sabaoth, son of Yaldabaoth, heard Pistis speak, he sang praises to her. At her command, he rejected his father [and mother] []. He praised Pistis because she had taught them about the deathless man and his light. Then Pistis Sophia pointed her finger and poured some of her own light onto Sabaoth, as a denunciation of his father. Once Sabaoth was filled with this light, he received great authority over all the forces of Chaos. From that day on, he has been called “Lord of Hosts.”


    Sabaoth despised his father, the Darkness, and his mother, the Abyss. He hated his sister, the thought of the Primal Parent, who had moved back and forth over the waters. The rulers of Chaos became jealous because of the light he had received. In their turmoil, they began a great war in the seven heavens.


    When Pistis Sophia saw the war, she sent seven archangels from her light to Sabaoth. They carried him up to the seventh heaven and stood before him as his attendants. She also sent him three more archangels. She established a kingdom for him above everyone else, so that he could live above the twelve gods of Chaos.


    Sabaoth received a place of rest as a reward for turning away from his former ways. Pistis also gave him her daughter Zoe and granted him great authority. Zoe was to teach him about everything in the eighth heaven. Because Sabaoth now had authority, the first thing he did was build himself a palace. It is immense and magnificent—seven times larger than all the palaces in the seven heavens. In front of [] his palace, he made an immense throne standing on a four-faced chariot called “Cherubin.”


    At each of its four corners, the Cherubin has eight shapes. These include the forms of lions, calves, humans, and eagles, making sixty-four forms in all. Seven archangels stand before it. Sabaoth [4] is the eighth, and he holds authority. Together, all the forms total seventy-two. The seventy-two gods also received their forms from this chariot so that they could rule over the seventy-two languages of the nations. At the throne, Sabaoth also created serpent-like angels called “Seraphin.” They praise him continually.'
