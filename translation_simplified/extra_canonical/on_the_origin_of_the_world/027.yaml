translation:
  language: en
  text: 'Before the age reaches its end, the whole region will shake with loud thunder. Then the rulers called archons will grieve in [fear of] their approaching [missing text] death. The angels will mourn for their humanity. The demons will weep over the time allotted to them, and their humanity will moan and scream as death approaches.


    Then the age will begin, and they will be thrown into turmoil. Their kings will become drunk on the fiery sword and wage war against one another. Bloodshed will make the earth drunk, and the wars will throw the seas into turmoil. The sun will grow dark, and the moon will hide its light. The stars will stop moving along their courses. A loud blast of thunder will come from a great army above every army of Chaos, where the woman''s sky-vault is located.


    After producing the first creation, she will put aside the wise fire of reason and clothe herself in senseless rage.


    Then she will pursue the gods of Chaos, whom she created together with the Primal Parent, and hurl them into the Abyss. They will be destroyed because of their evil. They will become like volcanoes and devour one another until the power of the Primal Parent destroys them.


    After he destroys them, he will turn against himself and destroy himself until he no longer exists. Their heavens will collapse upon one another, and fire will consume their armies. Their aeons—ages or realms—will also be overthrown. His heaven will plunge down and split in two. His [stars …] will fall to the earth, and [the earth will not be able] to bear them. They will fall into the Abyss, and the Abyss itself will be overthrown.


    The light will [conquer] the darkness and destroy it. It will become like [missing text] something that never existed. The source of darkness will disappear, and deficiency will be uprooted and cast down into the darkness. The light will rise back to its source. Then the glory of the one who was never begotten will appear and fill every aeon—every age or realm. This will happen when those called “perfect” reveal and fulfill the prophecies and the writings of kings.


    But those who have not become perfect in the Father who was never begotten will receive glory in their own aeons—ages or realms—and in the kingdoms of the deathless beings. Yet they will never enter the age where no king rules, because each person must return to the place from which that person came. Each person''s deeds and knowledge will reveal that person''s own nature.'
