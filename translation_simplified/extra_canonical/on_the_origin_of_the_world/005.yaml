translation:
  language: en
  text: 'When the heavens, their heavenly beings, and all their rulers had taken their places, the Primal Parent became proud. Every company of angels worshiped him, and all the gods and their angels praised and worshiped him. Delighted by this, he kept boasting to them, “I need no one.”


    He said, “I am God, and nothing exists apart from me.” By saying this, he committed an offense against all the immortal beings who spoke, and they accused him because of it.


    When Pistis saw the wickedness of the chief ruler, she became furious. Though she could not be seen, she said, “You are wrong, Samael”—a name meaning “Blind God.” “An immortal man of light existed before you, and he will appear among the forms you have shaped. He will trample you with contempt, as a clay pot is trampled underfoot. You and all who belong to you will plunge down to your mother, the Abyss. For when all your works are finished, the whole deficiency exposed by the truth will be abolished. It will cease to exist, as though it had never existed.”


    After saying this, Pistis showed an image of her greatness in the waters. Then she returned upward into her light.'
