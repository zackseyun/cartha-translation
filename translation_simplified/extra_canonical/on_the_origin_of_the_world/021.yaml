translation:
  language: en
  text: 'Next, let me tell you what happened. The rulers had seen the man and the woman who lived with him wander astray without realizing it, like animals. This made the rulers extremely happy.


    But then they learned that the deathless man would not ignore them. They became troubled, because now they would have to fear the woman who had changed herself into a tree. They said, “Perhaps this is the true human being—the one who covered us with a mist and taught us that the defiled woman resembles him. If so, we will be defeated.”


    Then all seven rulers plotted together. They nervously approached Adam and Eve and said to Adam, “You may eat fruit from any tree created for you in Paradise. But you must control yourself and not eat from the tree of knowledge. If you eat from it, you will die.” After causing deep anxiety within them, the rulers withdrew to their authorities.


    Then the cleverest of all creatures approached. This creature was called “Beast.” When he saw the likeness of their mother Eve, he asked her, “What did God say to you? Did he say, ‘Do not eat from the tree of knowledge’?”


    She answered, “He not only said, ‘Do not eat from it,’ but also, ‘Do not touch it, or you will die.’”


    Beast said to her, “Do not be afraid. With death you will not die. He knows that when you eat from it,[a] your ability to reason will become clear and alert. You will become like gods, knowing the difference between evil and good humans. In fact, he told you this because he was jealous and wanted to keep you from eating from it.”


    Eve now trusted the teacher’s words. She looked at the tree and saw that it was beautiful, satisfying, and desirable. So she took some of its fruit and ate it. She also gave some to her husband, and he ate it.


    Then their minds were opened, for the light of knowledge shone on them when they ate. They covered themselves in embarrassment and realized that without knowledge they were naked. When they came to their senses, they recognized their nakedness and fell in love with each other. Then they saw that those who had shaped them had the forms of beasts, and they hated them. They had become sharply aware.'
