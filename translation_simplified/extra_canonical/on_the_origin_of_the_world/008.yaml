translation:
  language: en
  text: 'This is what happened. The Primal Parent of Chaos saw his son Sabaoth living in glory. He realized that Sabaoth was greater than every other authority of Chaos, so he became envious and furious. From his own death he fathered Death. Death was appointed over the sixth heaven, the place from which Sabaoth had been raised. In this way, the number of the authorities of Chaos reached six.


    Death was both male and female. He mixed with his own nature and fathered seven children who were also both male and female.


    Their male names were:


    Jealousy,

    Fury,

    Tears,

    Moaning,

    Suffering,

    Weeping,

    and Bitter Lamentation.


    Their female names were:


    Fury,

    Pain,

    Lust,

    Moaning,

    Curse,

    Bitterness,

    and Argumentativeness.


    They had sex with one another, and each produced seven children. Altogether, they produced forty-nine demons who were both male and female.


    You will find their names and the effects they have in the Book of Solomon.


    In front of them, Zoe, who lived with Sabaoth, created seven good forces who were both male and female. Their male names were the Non-Jealous One, the Blessed One, the Joyful One, the True One, the Non-Envying One, the Beloved One, and the Faithful One. Their female names were Peace, Gladness, Joyfulness, Blessedness, Truth, Love, and Pistis. Many good and pure spirits come from these powers.


    You will find their influence and their works in the Book of the Structures of the Fate of Heaven Beneath the Twelve.'
