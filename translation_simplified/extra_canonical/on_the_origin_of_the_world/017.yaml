translation:
  language: en
  text: 'Then the Primal Parent told those who lived with him what he thought about the man. Each of them poured his sperm into the center—the navel—of the earth.


    From that day on, the seven rulers[b] worked together to form the man and his body. They made his body resemble their own, but his appearance resembled the man who had appeared to them. They shaped him one part at a time. Their leader formed his brain and nervous system.


    Afterward, he looked like the one who had existed before him. He became [...] a man with a soul,[a] and he was named Adam, meaning “Father,” after the one who had existed before him. When Adam was complete, he was abandoned like a lifeless container. Though he had taken shape, he was like a miscarried fetus, with no spirit inside him.


    The chief ruler remembered what Pistis had said. He feared that the true man might enter the body he had shaped and become its master. So he left that body for forty days. It had no soul, and he withdrew and abandoned it.


    On the fortieth day, Sophia Zoe sent her breath into Adam, who had no soul. Adam began to move on the ground, but he could not stand upright.


    Then the seven rulers came and saw him, and they were deeply disturbed. They went up to Adam and seized him. Then he spoke to the breath inside him:[c] “Who are you? Where did you come from?”


    The breath answered, “I came from the power of the man to destroy your work.” When they heard this, they praised him because he had relieved them of their fear and distress.


    They called that day “Rest,” because they had rested from their work. When they saw that Adam could stand upright, they rejoiced. They took him and placed him in Paradise, and then they retreated to their heavens.'
