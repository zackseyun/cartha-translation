translation:
  language: en
  text: 'After the natural forms of the deathless beings had fully developed out of infinity, a likeness named Sophia came forth from Pistis. By an act of her will, she became a created being like the first light. At once, her will took on the likeness of heaven. It was vast beyond understanding and stood between the deathless beings and the beings that came into existence later, resembling [a]. She acted as a veil separating humanity from the beings above.


    The realm of Truth has no shadow outside it, because infinite light fills it everywhere. Its exterior, however, is a shadow called “Darkness.” From this shadow came a host that ruled over the darkness. Later hosts called the shadow “Infinite Chaos.” From it every kind of divine being rose up [b], together with the whole region. Thus the shadow came after the first [c] created being. It appeared within the Abyss and came from the Pistis already mentioned.


    The shadow then realized that something stronger than itself existed, and it became envious. By its own will it became pregnant and immediately gave birth to jealousy. From that day on, the law of jealousy could be seen at work among all the heavenly realms and their worlds. This jealousy was found to be an aborted fetus with no spirit in it. It came into being as a shadow within a vast body of water. The bile produced by the shadow was then cast into one region of Chaos.


    From that day on, this body of water could be seen. What sank into it gushed away but remained visible within Chaos. It was like what happens when a woman gives birth and the substances gathered in her body flow out. In the same way, matter came from the shadow and was driven away from it, but it did not leave Chaos.


    The Appearance of Yaldabaoth


    Matter remained in one region of Chaos. After this happened, Pistis came and appeared above the matter of Chaos. That matter had been expelled like an aborted fetus. No spirit lived in it, for it was nothing but endless darkness and bottomless water.


    When Pistis saw what had resulted from her defect, she became distressed. Her distress took the form of a terrifying created being that rushed toward her in Chaos. She turned toward it and blew into its face in the Abyss, which lies beneath [d] all the heavens. Pistis Sophia then willed that this spiritless being should be given a form and should rule over matter and all her hosts. Then, for the first time, an archon—a ruler who was both male and female—rose from the waters. It looked like a lion, possessed great authority within itself, and did not know where it had come from.


    Pistis Sophia watched the ruler moving through the deep waters and said, “Child, come over here.” This is the meaning of yalda-baoth. From that day on, spoken language came into being and spread to the gods, angels, and human beings. The gods, angels, and human beings brought to completion what had come into being through speech.


    The ruler Yaltabaoth did not know about the power of Pistis. He did not see her face. Instead, he saw in the water the likeness that spoke to him. Because of that voice, he called himself “Yaldabaoth.” But the perfect ones call him “Ariael” because he looked like a lion.


    After he gained authority over matter, Pistis Sophia withdrew upward into her light.'
