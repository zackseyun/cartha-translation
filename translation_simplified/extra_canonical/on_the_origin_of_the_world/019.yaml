translation:
  language: en
  text: 'Then the authorities were told, “The figure you shaped has come alive and stood up.” This deeply disturbed them, so they sent seven archangels to find out what had happened.


    They came to Adam and saw Eve speaking with him. They said to one another, “What kind of being is this radiant woman? She resembles the likeness that appeared to us in the light. Come, let us seize her and cast our seed into her. Once we have defiled her, she will not be able to rise into her light, and her children will be under our control. But we must not tell Adam, because he is not one of us. Instead, let us put him into a deep sleep. While he sleeps, we will teach him that she came from his rib. Then his wife will obey him, and he will rule over her.”


    But Eve was a power, and she laughed at their plan. She clouded their eyes with mist and secretly left her likeness beside Adam.


    Eve entered the tree of knowledge and stayed there. They chased her, but she showed them that she had entered the tree and become a tree. The blind beings were terrified and fled.


    When they recovered from their daze, they returned to Adam. They saw the woman’s likeness[a] beside him and thought it was Eve herself. Deeply agitated, they acted without restraint. They seized the likeness and cast their seed upon her.


    They acted wickedly, defiling her by natural and obscene means. First they defiled the seal of her voice, which had asked them, “What existed before you?” By doing this, they intended to defile those who, at the end of the age, would declare aloud that they had been born from the true man. But the authorities had gone astray. They did not realize that they had defiled their own body, for it was only the likeness that they and their angels had defiled in every way.'
