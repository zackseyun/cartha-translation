translation:
  language: en
  text: 'When Sophia Zoe saw the rulers of darkness cursing her companions, she was furious. She left the first heaven with full power, chased the rulers, drove them out of [their] heavens, and threw them into the world of sin. There they would live on earth as wicked demons.


    [She sent out a bird], [] called the “phoenix,” a living creature with a soul. In their world it would spend its thousand years in Paradise. It kills itself and returns to life. In this way it bears witness to the judgment decreed against the rulers because they mistreated Adam and his descendants, even to the end of the age.


    There are three kinds of human beings, together with their descendants, until the end of the world: those endowed with spirit, those endowed with soul, and those who are earthly. In the same way, there are three phoenixes <inside> Paradise. The first never dies, and the second lives for a thousand years. Sacred Scripture says that the third is consumed. There are also three baptisms: the first is spiritual, the second is with fire, and the third is with water.


    Just as the phoenix symbolizes the angels, the water hydri in Egypt symbolizes those who enter the baptism of a true human being.


    The two bulls in Egypt also have a symbolic meaning: they represent the sun and the moon. This is a symbol of Sabaoth, because Sophia gained the universe from the day she formed the sun and moon and sealed her heaven, until the age ends.


    The worm born from the phoenix also symbolizes a human being. Sacred Scripture says of him, “The just person will blossom like a phoenix.” The phoenix first appears alive, then dies and rises again. It therefore symbolizes what will happen at the end of the age.


    These powerful symbols appeared only in Egypt and nowhere else. They show [] that Egypt resembles the Paradise of God.'
