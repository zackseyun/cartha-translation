translation:
  language: en
  text: 'The primal Psyche loved Eros, who lived with her. She poured her blood over him and over the earth. From that blood, the first rose grew out of the earth. It came from the thorn bush as a source of gladness for the light that would appear from within the bush.


    After this, many kinds of lovely, sweet-smelling flowers grew from the earth. They came from the virgin daughters of Pronoia. When the daughters fell in love with Eros, they poured their blood over him and over the earth.


    Next, every kind of plant grew from the earth. Each plant carried within it the seed of the authorities and their angels.


    Then the authorities made many kinds of animals from the waters, including reptiles and birds. These animals carried within them the seed of the authorities and their angels.


    But before any of this happened, the one who had appeared on the first day[a] stayed on earth for about two days. Then he left the lower Pronoia in heaven and rose toward his light. At once, darkness covered the entire cosmos.'
