translation:
  language: en
  text: 'Next, Justice created Paradise. It was beautiful. It lay in the Land of Delight, east among the stones and beyond the paths of the moon and the sun. [11] Desire lives there among the beautiful trees whose fruit satisfies.


    By God’s will, the tree of eternal life appeared on the north side of Paradise. It was there so that, at the end of the age, the souls of the saints who emerge from their lowly formed shapes could become immortal. The tree of life shines like the sun, and its branches are beautiful. Its leaves are like cypress leaves, and its fruit is like a cluster of white grapes. It reaches as high as heaven.


    Beside it stands the tree of knowledge, which possesses God’s power. Its splendor is like the full moon, and its branches are beautiful. Its leaves are like fig leaves, and its fruit is like a fine, satisfying date. This tree also stands on the north side of Paradise. It can rouse souls from the demon-related stupor, so that they may approach the tree of life and eat its fruit. In this way they can reject the authorities and their angels.


    Holy Scripture describes what this tree does: [12] “You are the tree of knowledge in Paradise. The first man ate from you, and you opened his mind. He loved his female companion and rejected the other, alien likenesses—even despising them.”


    After this, the olive tree sprouted. It was to make holy the kings and high priests of righteousness who would appear in the last days. The olive tree came from the light of the first Adam to provide the oil for their anointing.'
