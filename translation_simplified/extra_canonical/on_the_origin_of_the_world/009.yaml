translation:
  language: en
  text: 'After the Primal Parent saw the likeness of Pistis in the waters, he was filled with sorrow. Then he heard her voice. It sounded like the first voice that had called to him from the waters. He groaned when he realized that she was the one who had named him, and he was ashamed of his sin.


    He then learned that a deathless man of light had existed before him. This deeply troubled him, because he had already declared to all the gods and their angels, “I am the one who is God. Nothing exists apart from me.” He had feared that they would discover someone had existed before him and accuse him.


    Yet he had no good judgment. He laughed at the thought that anyone might accuse him and acted recklessly. He said, “If [] something existed before me, let it come forward so that we may see its light.” At once—look!—light came out from the eighth heaven above and passed through all the heavens of the earth.'
