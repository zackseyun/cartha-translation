  rationale: The sequence is made natural without turning authority into merely the means of carrying out her desire.
- pob_phrase: to determine signs of time
  simplified_phrase: to serve as signs for times
  preserved_meaning: The heavenly bodies function as indicators of divisions and periods of time.
  reasoning_layer_used: POB translation and immediate list
  rationale: This wording clearly retains both their sign function and their relation to time.
- pob_phrase: six aeons and their adornments, six in number
  simplified_phrase: six aeons and their adornments, which were also six in number
  preserved_meaning: The adornments are numbered as six without assigning one set to each aeon.
  reasoning_layer_used: POB translation and independent grounding review
  rationale: The wording preserves the stated number without resolving the distribution.
