translation:
  language: en
  text: 'When Sophia, who lived in the lower heaven, desired this, she received authority from Pistis. She made the great shining bodies and all the stars. She placed them in the sky to shine on the earth and to serve as signs for times, seasons, years, months, days, nights, minutes, and so on. In this way, the whole sky was adorned.


    Adam of Light wanted to enter his own light, that is, the eighth heaven. But he could not enter because poverty had become mixed with his light. So he made a vast aeon[a] for himself. Within it he made six aeons and their adornments, which were also six in number. These were seven times greater than the heavens of Chaos and their adornments.


    All these aeons and their adornments exist in the infinite region between the eighth heaven and the Chaos below it. They are counted as part of the universe that belongs to poverty.


    If you want to learn how they are arranged, you will find it written in the Seventh World of the Prophet Hieralias.'
