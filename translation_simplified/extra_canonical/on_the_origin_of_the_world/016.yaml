  rationale: The natural verb “served” preserves the striking self-midwife image.
- pob_phrase: the souls that were to enter the shaped forms of the authorities
  simplified_phrase: the souls that would enter the authorities’ shaped forms
  preserved_meaning: The souls would enter shaped forms associated with or belonging to the authorities.
  reasoning_layer_used: POB wording and grounding review
  rationale: The possessive clarifies the sentence without claiming that the authorities shaped the forms.
- pob_phrase: until the consummation of the age
  simplified_phrase: until the end of the age
  preserved_meaning: Their confinement continues until the age reaches its conclusion.
  reasoning_layer_used: POB translation
  rationale: “End” gives the temporal sense of the formal word “consummation.”
