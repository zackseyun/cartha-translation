translation:
  language: en
  text: 'Eve is the first virgin. She gave birth to her first child without a husband and served as her own midwife. Because of this, she is said to have declared:


    I am part of my mother,

    and I am the mother.

    I am the wife;

    I am the virgin.

    I am pregnant;

    I am the midwife.

    I ease the pains of childbirth.


    My husband gave birth to me,

    and I am his mother.

    He is my father and my lord.

    He is my strength.

    Whatever he wishes, he speaks with reason.


    I am on the way to becoming,

    although I have already given birth to a man as a lord.


    By the will of Sabaoth and his Christ, these things were revealed to the souls that would enter the authorities’ shaped forms. Concerning these souls, the holy voice said, “Multiply and flourish. Rule over every created being.” In keeping with their destinies, the Primal Parent took them captive. In this way, they were locked inside the prisons of those shaped forms <. . .> until the end of the age.'
  philosophy: optimal-equivalence
