translation:
  language: en
  text: 'Seven beings who were both male and female appeared in Chaos. Each had a masculine name and a feminine name:


    Pronoia, Sambathas—which means “week”;


    his son Yao—whose feminine name is Rulership;


    Sabaoth—whose feminine name is Divinity;


    Adonaios—whose feminine name is Kingship;


    Elaios—whose feminine name is Jealousy;


    Oraios—whose feminine name is Wealth;


    and Astaphaios—whose feminine name is Sophia.[a]


    These are the seven powers of the seven heavens of Chaos. They came into being as both male and female, matching the deathless order that existed before them. This was in accordance with Pistis’s desire: that a likeness of what had existed from the beginning would rule until the end.


    You can learn about the power of these names and of the male beings in the book The Archangelic Nature of the Prophet Moses. You can learn about the power of the female names in the First Book of Noraia.


    Yaldabaoth, the Primal Parent, had great authority. By speaking, he created a heaven for each of his offspring. He made these heavens good places to live. In each one he created magnificent glories, sevenfold in excellence: thrones, palaces, temples, chariots, and virginal spirits, extending as far as an unseen one, together with their glories. Each offspring had these things in its own heaven, along with mighty hosts of gods, lords, angels, and archangels—countless thousands upon thousands—to serve there.


    You can find a precise account of these events in the First Narration of Oraia.


    The heavens were completed from this heaven up to the sixth heaven, which belongs to Sophia.


    Then the troublemaker who lived beneath them all attacked this heaven and its earth. The six heavens shook violently, because the hosts of Chaos knew who had attacked the heaven below them. When Pistis learned of the rupture he had caused, she sent out her spirit, bound him, and threw him down into Tartaros.[b]


    From that day on, the heaven and its earth have been firmly established through Sophia, the daughter of Yaldabaoth, who lives beneath them all.'
