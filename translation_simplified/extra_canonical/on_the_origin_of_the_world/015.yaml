translation:
  language: en
  text: 'Before Adam of Light withdrew into Chaos, the authorities saw him. They mocked the Primal Parent because he had lied to them, saying, “I am God, and no one existed before me.”


    When they came near, they asked him, “Is this not the god who ruined our work?”


    He answered, “Yes. If you want to stop him from ruining our work, come, let us make a man from the earth to serve us. We will make him in the image of our body and in the likeness […] of this being. Then, when he sees his own likeness, he will fall in love with it and will no longer ruin our work. Instead, throughout this entire age, we will make servants for ourselves from those born of the light.”


    All this happened according to the forethought of Pistis. The man would appear in his likeness and condemn the authorities because of the form they had shaped. That form became a place that enclosed the light.


    The authorities then gained the knowledge they needed to create the man. But Sophia Zoe, who lives with Sabaoth, had already foreseen what they would do. She mocked their plan because they were blind. In their ignorance, they acted against their own interests by creating him. They did not understand what they were about to do.


    Sophia acted before they did and made her own man first. He would teach the form they had shaped to hate them and thus escape from them.


    This is how the teacher came into being. Sophia let a drop of light descend, and it flowed onto the water. At once, a human who was both male and female appeared. She first shaped the drop into a female body. Then, using that body, she shaped it in the likeness of the mother who had appeared earlier. She completed it in twelve months.


    Thus a human who was both male and female came into being. The Greeks call such a being Hermaphrodites. The Hebrews call this being’s mother Eve of Zoe, meaning “the female teacher of life.” Her child is the created being who is lord. Later, the authorities […] called this being “the Beast,” so that it might lead astray the created beings associated with its shaping. “The Beast” means “the Teacher,” because this being proved to be the cleverest of all beings.'
