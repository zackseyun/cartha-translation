translation:
  language: en
  text: 'After the day of rest, Sophia sent her daughter Zoe, also called Eve, to teach Adam. Adam had no soul, and she was to raise him to his feet, so that the children he would father could become vessels of light.


    When[a] Eve saw her male companion lying face down, she felt compassion for him and said, “Adam, live! Stand up on the earth!”


    What she said happened at once. Adam stood up and quickly opened his eyes. When he saw her, he said, “You will be called ‘Mother of the Living,’ because you are the one who gave me life.”'
