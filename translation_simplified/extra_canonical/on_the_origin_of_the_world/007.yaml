translation:
  language: en
  text: 'After this, he created a gathering of angels—countless thousands upon thousands. It resembled the gathering in the eighth heaven. He also created a firstborn named “Israel,” which means “the Man Who Sees God,” and another being named “Jesus Christ.” This being resembles the savior who lives above in the eighth heaven and sits at his right hand on a holy throne. At his left hand, the Virgin of the holy Spirit sits on a throne and glorifies him. Seven virgins stand before her, holding thirty harps, lyres, and [trumpets].[a] They too glorify him. All the armies of angels glorify and praise him.


    He sits on a throne of light within a great cloud that covers him.[b] No one else lived with him inside the cloud except Sophia, the daughter of Pistis.[b] She taught him about all the beings in the eighth heaven. In this way, he could create beings like them, and his rule could continue until the heavens of Chaos and all their hosts reached their end.


    Pistis Sophia then separated him from the darkness and called him to her right side. She placed the Primal Parent at her left side. From that day on, the right side has been called “justice,” and the left side has been called “evil.” Because of this, all of them received an aeon[c] within the assembly of justice, while evil stands over every created being.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The manuscript has a gap before the word “trumpets”; brackets show that the word’s supplied status is uncertain.
    reason: source_note
  - marker: b
    text: The words translated “within a” and “the daughter of” are supplied where the manuscript is incomplete.
    reason: textual_variant
  - marker: c
    text: “Aeon” can refer to an age or to a divine realm.
    reason: lexical_alternative
