  rationale: A sentence break and common wording clarify the comparison.
- pob_phrase: so that he could create likenesses of them and his reign could last until the consummation
  simplified_phrase: In this way, he could create beings like them, and his rule could continue until ... reached their end
  preserved_meaning: Sophia’s teaching enables imitation of the heavenly beings and the continuation of his rule.
  reasoning_layer_used: POB text and source payload
  rationale: The dense purpose clause is divided, and “consummation” becomes “reached their end.”
- pob_phrase: angelic hosts
  simplified_phrase: armies of angels
  preserved_meaning: The angels are depicted as organized heavenly multitudes.
  reasoning_layer_used: POB text and English witness
  rationale: Familiar wording preserves the military image.
