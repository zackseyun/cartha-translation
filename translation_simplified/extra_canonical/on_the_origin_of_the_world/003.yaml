translation:
  language: en
  text: 'When the archon[a] saw how large he was, he saw no one but himself. He could see nothing beyond the water and darkness, so he imagined that he was the only one who existed. His [. . .] was completed through spoken words. This [] appeared as a spirit moving back and forth over the waters.


    When the spirit appeared, the archon separated the watery substance, and the dry substance was set apart in another place. From matter he made a home for himself and called it “Heaven.” He also made a footstool from matter and called it “Earth.”


    Then the archon had a thought that matched his nature. By speaking, he created a being who was both male and female. The archon opened his mouth and cooed to this being. When the being opened his eyes, he looked at his father and made the sound “eee!” His father named him “Eee-a-o.”


    Then the archon created a second son and cooed to him. When this son opened his eyes, he made the sound “eh!” to his father. His father named him “Eloai.”


    Then the archon created a third son and cooed to him. When this son opened his eyes, he made the sound “asss!” to his father. His father named him “Astaphaios.”


    These three are the sons of their father.'
