translation:
  language: en
  text: 'The Logos, supreme over all, was sent for one purpose: to proclaim what is unknown. He said, “Nothing hidden will remain unrevealed, and what is unknown will become known.” They too were sent[b] to reveal what was hidden, including the seven authorities of Chaos and their ungodliness. In this way, they were sentenced to death.


    When all the perfect ones appeared in the forms made by the rulers called archons[a], they revealed truth beyond compare. They put all the wisdom of the gods to shame. Their fate proved to be disgrace, and their whole company withered away. Their rule dissolved. Their forethought came to nothing, and so did their glory.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Archons” is retained as the traditional term for these ruling powers.
    reason: source_note
  - marker: b
    text: The POB and its English witness do not clearly identify who “they” are.
    reason: source_note
