translation:
  language: en
  text: 'Now we will consider our world, so that we can accurately finish describing how it is structured and governed. Then it will become clear how faithfulness to the unseen aeon* was found and revealed from creation until the end of the age.


    So I now turn to the main themes concerning the deathless man. I will discuss the beings who belong to him and show how they came to be here.


    Many humans had come into existence, descended from [the Adam who] [] had been made from matter.† Once the world was fully populated, the ruling powers were its masters. They kept it enslaved through ignorance. Why? The deathless Father knows that a deficiency in truth arose among the aeons and their universe. He wanted to bring the powers of destruction to nothing by means of the creatures they had shaped. So he sent your likenesses down into the world of destruction—that is, the blessed little spirits of innocence. Knowledge is not foreign to them, because all knowledge dwells in one angel who appeared to them. He does not lack power before the Father, even for <him> to give them knowledge.† When they appear in the world of destruction, they immediately reveal the structure of what cannot be destroyed. In this way they condemn the ruling powers and their armies.


    When the blessed beings appeared in forms shaped by the ruling powers, the powers envied them. Out of envy, they joined their seed with the seed of the blessed beings, hoping to defile them. But they could not.


    Then the blessed beings appeared in radiant forms and in several different ways. They came from different aeons and revealed their knowledge to the church made visible through forms shaped in the world of destruction. She was found to contain every kind of seed because the seed of the ruling powers had been joined with her.


    Then the Savior made all of them [(as) one].† Their spirits are clearly superior: they are blessed [] and chosen in various ways.† There are also other beings who have no king and are superior to all who came before them.


    Therefore, there are four groups. Three belong to the kings of the eighth heaven. But the fourth group has no king; it is perfect and highest of all. Its members will enter their Father’s Holy Place. There they will receive rest and peace, eternal glory beyond words, and endless joy.


    Moreover, because they are deathless, they are kings within the realm of death. They will condemn the gods of Chaos and their armies.[*][†]'
