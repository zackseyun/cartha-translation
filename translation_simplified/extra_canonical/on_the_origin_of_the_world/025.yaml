  previous_text: 'Now we will consider our world, so that we can finish describing accurately how it is structured and ruled. Then it will become clear how faithfulness to the unseen eternal realm was found and revealed from creation to the end of the age.


    So I now turn to the main teachings about the deathless man. I will discuss the beings who belong to him and explain how they came to be here.


    A great many humans came into existence as descendants of [the Adam who] [...] had been made from matter. Once the world was fully populated, the ruling powers became its masters and kept it enslaved through ignorance. Why did this happen? The deathless Father knows that truth became incomplete among the heavenly realms and their universe. He wanted to bring the powers of destruction to nothing by means of the creatures they themselves had formed. So he sent your likenesses into the world of destruction—the blessed little spirits of innocence. Knowledge is not foreign to them, because all knowledge dwells in one angel who appeared to them. This angel has power before the Father to give them knowledge. When these spirits appear in the world of destruction, they immediately reveal the order of the realm that cannot be destroyed. By doing so, they condemn the ruling powers and their armies.


    The blessed beings appeared in bodies formed by the ruling powers, who became jealous of them. Because of this jealousy, the powers mixed their seed with that of the blessed beings, hoping to defile them. But they could not.


    Later, the blessed beings appeared radiantly and in several different ways. They came from different heavenly realms and revealed their knowledge to the visible community that appeared through bodies formed in the world of destruction. She was found to contain every kind of seed, because the seed of the ruling powers had been joined with her.


    Then the Savior made them all [(as) one]. Their spirits are clearly superior: they are blessed [...] and chosen in various ways. There are also other beings who have no king and are superior to all who came before them.


    There are therefore four groups. Three belong to the kings of the eighth heaven. But the fourth has no king; it is perfect and highest of all. Its members will enter their Father’s Holy Place. There they will receive rest and peace, eternal glory beyond words, and endless joy.


    Moreover, because they are deathless, they are kings within the realm of death. They will condemn the gods of Chaos and their armies.'
