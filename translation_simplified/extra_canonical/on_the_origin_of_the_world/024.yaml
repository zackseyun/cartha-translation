translation:
  language: en
  text: 'Let us return to the rulers we discussed earlier, so that we can explain them.


    After the seven rulers had been thrown down from their heavens to the earth, they made many demonic angels to serve them. These angels led humanity into many kinds of error. They taught people magic, the use of potions, idol worship, bloodshed, altars, temples, sacrifices, and drink offerings to all the demons of the earth. They worked together with fate, which came into being through an agreement between the gods of injustice and justice. In this way, after the world came into being, it went astray and remained in constant confusion, because all on earth worshiped demons from the creation of the world until the end of the age—both righteous angels and unrighteous humans.


    So the world existed in confusion, ignorance, and a dazed state. Everyone had gone astray until the true man appeared.


    This is enough about the subject.'
