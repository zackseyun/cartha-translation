translation:
  language: en
  text: 'Eros came from that first blood as a being who was both male and female. His male part is Himireris, fire that comes from light. His female part lives with him. She is a soul made of blood and comes from the substance of Pronoia. Eros is exceedingly beautiful and more captivating than every other being created in Chaos.


    When all the gods and their angels saw Eros, they fell in love with him. He revealed himself within each of them and set them ablaze. Many lamps can be lit from one lamp. The same light is in them all, but the first lamp loses none of its light. In the same way, Eros spread himself through every created being in Chaos without being diminished. Eros appeared at the center of light and darkness, and his sexual union was completed at the center of the angels and humanity. In the same way, the first pleasure blossomed from the earth. After Earth came Woman; after Woman, marriage; after marriage, birth; and after birth, decline.


    After Eros, the grapevine sprouted from the blood spilled on the earth. For this reason, those who drink from it develop a desire for sexual union.


    After the grapevine, fig and pomegranate trees sprouted from the earth. All the other kinds of trees also appeared, bearing seed from the […] seed of the authorities and their angels.'
