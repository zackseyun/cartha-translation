translation:
  language: en
  text: '[] Everyone—cosmic gods and humans alike—says that nothing existed before Chaos. But I will prove that they are all wrong, because they do not know where Chaos came from or what its root is. Here is the proof:


    Concerning Chaos, [] everyone is eager to call it a kind of darkness. In fact, Chaos came from a shadow called “Darkness.” That shadow came from a created entity that had existed from the beginning. This entity clearly existed before Chaos, and Chaos came into being afterward.


    So let us examine the facts. We will also consider the first created entity, from which Chaos was propelled. In this way, the truth will be clearly established.'
  philosophy: optimal-equivalence
