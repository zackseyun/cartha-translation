translation:
  language: en
  text: 'Thomas replied, “What can we say after hearing these things? What can we say to the blind? What should we teach these pitiful mortals? They say, ‘We came here to do good, not to curse.’ Yet they also say, ‘If we had not been born in bodies of flesh, we would never have known sin.’”


    The Savior said, “Truly, do not think of such people as human, but as animals. Just as animals devour one another, these people devour one another. Despite what they say, the opposite is true. Through what they love—the sweet fire—they have lost the kingdom. They have become servants of death and rush to do things that lead to decay. They follow the lust of their ancestors.


    “They will be thrown into the abyss and suffer the torment that comes from the bitter evil of their nature. They will be whipped and forced to run backward into a place where they cannot see. They will be torn from their limbs. They will not endure it bravely, but will fall into despair.


    “They rejoice because—here the manuscript is damaged and mentions madness and irrationality. They pursue this irrationality without recognizing their madness, for they believe they are wise. More text about their body is missing. Their minds are turned toward themselves, and their thoughts are consumed with what they do. But the fire will scorch them.”


    Thomas replied, “Lord, what will the person cast down to them do? I am deeply concerned for them, because many attack them.”


    The Savior answered, “What do you think?”


    Judas, who is called Thomas, said, “Lord, it is right for you to speak and for me to listen.”


    The Savior replied, “Pay attention to what I am about to tell you, and believe what is true. Both what sows and what is sown will vanish in fire—in fire and water. They will cover themselves in dark graves. After a long time, they will show themselves to be the fruit of evil trees. They will be condemned and killed in the mouths of animals and humans, driven onward by rain, wind, air, and the light shining from above.”


    Thomas replied, “You have certainly convinced us, Lord. We know this in our hearts, and it is clear that it is true. Your word is enough. Yet the world finds these words ridiculous and hateful because people misunderstand them. How can we go and preach them when the world does not respect us?”


    The Savior replied, “Truly I tell you, whoever hears your message and rejects it—whoever mocks it or laughs at these things—will be handed over to the ruler above, the king who rules every power. That ruler will whirl the person around and throw him out of heaven, down into the abyss. He will be imprisoned in a narrow, gloomy place. He will not be able to turn or move because of the immense depth of Tartaros and the crushing, unrelenting bitterness of Hades.


    “The manuscript is badly damaged here. It speaks of people being pursued and handed over to the angel Tartarouchos, with fire chasing them. It also describes fiery whips spraying showers of sparks into the pursued person’s face.


    “If he runs west, he will meet the fire.


    “If he runs south, he will meet it there too.


    “If he turns north, the danger of boiling fire will meet him again.


    “He will not find a road east by which he can escape and be saved.


    “He did not find that way during the time when he lived in the body, so he will not find it on the day of judgment.”'
