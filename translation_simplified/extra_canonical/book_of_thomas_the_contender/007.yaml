translation:
  language: en
  text: '“Blessed are you who recognize ahead of time what may make you stumble and who flee from strange things.


    Blessed are you when people insult you and treat you with contempt because their Lord shows them love.


    Blessed are you who weep and are persecuted by people who have no hope, because you will be set free from every kind of captivity.


    “Stay alert and pray, so that you may escape life in the flesh and leave behind the bitter captivity of this life. When you pray, you will find rest, because you have left suffering and shame behind. When you leave behind physical suffering and bodily cravings, the Good One will give you rest. You will reign with the King, united with him from now on and forever. Amen.”


    The Book of Thomas

    The Contender

    Written to the Mature


    My brothers, remember me too

    in your prayers.


    Peace be with the saints

    and with those of the spirit.'
