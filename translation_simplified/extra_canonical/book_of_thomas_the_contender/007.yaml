  simplified_phrase: recognize ahead of time what may make you stumble
  preserved_meaning: They discern dangers before those dangers cause them to fall.
  reasoning_layer_used: POB text and English witness
  rationale: The revision clarifies foresight while preserving the image of stumbling.
- pob_phrase: insulted and disrespected
  simplified_phrase: insult you and treat you with contempt
  preserved_meaning: Others subject them to verbal abuse and dishonor.
  reasoning_layer_used: POB text
  rationale: The active wording makes the mistreatment immediate and natural in English.
- pob_phrase: depart from bodily sufferings and appetites
  simplified_phrase: leave behind physical suffering and bodily cravings
  preserved_meaning: They pass beyond bodily pain and desires.
  reasoning_layer_used: POB text and English witness
  rationale: Common terms replace the abstract wording without collapsing suffering and desire into one idea.
