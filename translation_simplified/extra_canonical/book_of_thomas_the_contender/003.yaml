translation:
  language: en
  text: 'Thomas said to the Lord, “Please answer my questions before you ascend. Once I hear from you about what is hidden, I will be able to speak about it openly. I know that it is difficult to live out the truth in front of others.”


    The Savior answered, “If even visible things are hidden from you, how can you learn about invisible things? If it is hard for you to do the works of truth that can be seen in this world, how will you do the works that belong to the invisible heights and the Fullness? How can you be called ‘workers’? In these matters you are still students. You have not yet reached complete maturity.”


    Thomas said to the Savior, “Explain to us what you mean by the invisible things that are hidden from us.”


    The Savior said, “[All] bodies . . . animals are born . . . it is plain like . . . also this, those who are above . . . visible things, but [they are] visible . . . in their own root, and their fruit nourishes them.[a] But these visible bodies remain alive by eating animals like themselves, and so the bodies change. Whatever changes will decay and die. It then loses every hope of life because it is an animal body. Just as animal bodies die, these bodily forms will also die. They come from sexual intercourse, just as animals do, do they not? If something comes from intercourse, how can it produce anything different from the animals? Therefore, you will remain infants until you become mature.”


    Thomas replied, “Lord, those who speak about invisible things that are hard to understand are like people shooting arrows at a target at night. They shoot toward the target as other archers do, but they cannot see it. When the light appears and covers the darkness, everyone’s work will become visible. O Lord, our light, give us light.”


    Jesus said, “Light is light by its very nature.”


    Thomas asked, “Lord, why does the visible light that shines for people rise and set?”


    The Savior answered, “Blessed Thomas, this visible light shines for you, not so that you will remain here, but so that you can leave. When all the chosen ones have left the animal state behind, this light will return upward to its own essence. It will welcome the light, because it is a good servant.”'
