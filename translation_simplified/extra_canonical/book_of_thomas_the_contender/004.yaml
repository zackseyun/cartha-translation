translation:
  language: en
  text: 'Then the Savior continued: “O unfathomable love of the light! O bitter fire burning in human bodies and marrow! Day and night it blazes within them. It scorches their limbs, intoxicates their minds, and drives their souls mad. The text is damaged here. The surviving fragments mention both men and women, night, and movements made secretly and openly. Missing words appear to concern men acting on women and women on men. Therefore it is said, ‘Everyone who seeks the truth through true wisdom will grow wings and fly. They will escape the lust that scorches human spirits, and they will fly away from every evil spirit they see.’”


    Thomas replied, “Lord, this is exactly what I am asking you about, because I understand that, as you say, you are the one who helps us.”


    The Savior answered, “This is why we must speak to you: this teaching is for the mature. If you want to become mature, you will do these things. If you do not, your name will be ‘Ignorant One.’ An intelligent person cannot live with a fool, because an intelligent person is mature in every kind of wisdom. The wise are nourished by the truth and ‘will be like a tree growing beside a winding stream’ (Psalm 1:3).


    “But fools treat good and evil as if they were the same. Though some have wings, they still run after visible things that are far from the truth. This happens because the fire guiding them creates an illusion of truth. It shines on them with beauty that will perish, shuts them inside a pleasant darkness, and charms them with sweet-smelling pleasure.


    “It blinds them with a lust that cannot be quenched and scorches their souls. It becomes like a stake driven into their hearts that they can never pull out. It drives them wherever it wishes, like a bit in an animal’s mouth. Lust for visible things takes them captive with bitter chains. Those things quickly decay, change, and go astray. Lust binds every one of their limbs, always dragging them downward. When they are killed, all the creatures of this perishable realm consume them.”


    Thomas replied, “It is clear, just as it has been said, ‘Many are … those who do not know … soul.’” The saying is incomplete because the text is damaged.


    The Savior answered, “Blessed is the wise person who sought the truth and found it, then rested in it forever without fearing those who tried to disturb him.”


    Thomas replied, “Lord, is it good for us to rest among the things that belong to us?”


    The Savior said, “Yes, it is helpful and good for you. The visible things among human beings will vanish, because their bodily vessel will vanish. When it has been reduced to nothing, it will be among visible things—among things that can be seen. Then the fire they see will cause them pain because of their former love for the faith. They will be gathered back to what is visible.


    “Moreover, those who can see among invisible things but do not possess the greatest love will perish because they are absorbed in this life and scorched by the fire. After only a little while, everything visible will vanish. Then shapeless shadows will emerge. They will remain forever among the graves and corpses, suffering while their souls decay.”'
