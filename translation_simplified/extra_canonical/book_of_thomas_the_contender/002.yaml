translation:
  language: en
  text: 'The Savior said, “Brother Thomas, listen to me while you still have time in this world. I will reveal what you have been wondering about.


    “People have said that you are my twin and true friend. So examine yourself. Discover who you are, what your present state is, and what you will become. Since you will be called ‘my brother,’ you should not remain ignorant of yourself. Yet I know that you have understood yourself, because you have already recognized that I am true knowledge. Even though you do not understand, you agree with me, and you have already gained knowledge. So you will be called ‘the one who knows himself.’ Whoever does not know himself knows nothing. But whoever knows himself has also gained deep knowledge about everything. Therefore, my brother Thomas, you have seen what is hidden from humanity—what people stumble over in their ignorance of themselves.”'
  philosophy: optimal-equivalence
