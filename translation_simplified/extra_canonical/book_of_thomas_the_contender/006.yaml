translation:
  language: en
  text: 'The Savior continued:


    “Woe to you who are godless and without hope, for you expect something that will never happen! Woe to you who put your hope in the flesh—in a prison destined to perish! How long will you keep forgetting? How long will you suppose that what cannot perish must also perish? Your hope rests on this world, and this life is your god. You are destroying yourselves!


    “Woe to you because of the fire burning within you, for it cannot be put out! Woe to you because of the wheel spinning in your minds! Woe to you who are held by the burning within you! It will consume your bodies where all can see and tear apart your souls where no one can see. It will prepare you to join your companions. Woe to you prisoners, chained in caves!


    “You mock and grin with senseless laughter! You do not know that you are condemned. You do not consider your condition, and [you] have failed to understand that you live in darkness and [death]! Instead, you are drunk with fire and [filled] with bitterness. The [burning within] you has driven your mind mad. The venom and attacks of your enemies taste sweet to you! Darkness seemed like light to you because you traded your freedom for slavery. You darkened your hearts, gave your minds over to foolishness, and filled your thoughts with the fiery smoke within you! Your light [was hidden] by the cloud [of …], and as for the clothes covering you, you […]. [You] were captured by an empty [hope]. Whom did [you] believe? Do you [not understand that] all of [you] live among those who […] you as though [you …].


    “[…] You plunged yourselves into the waters of darkness! You followed your own desires! Woe to you who live in error and ignore the light of the sun, which judges the world and looks down upon it, and which will surround all things to enslave its enemies. You also fail to notice the moon, which looks down by night and day and sees the bodies of those you have slaughtered!


    “Woe to you who love being close to women and unclean sexual relations with them! Woe to you who are held by the powers of your bodies, for they will torment you! Woe to you who are held by the powers of evil demons! Woe to you who entice your own bodies with fire!


    “Who will send you a shower of cool dew to put out the cloud of fire that surrounds and burns you? Who will make the sun shine on you to drive away the darkness within you and conceal the darkness and impure water? The sun and moon, along with the air, wind, earth, and water, will give you a sweet fragrance. If the sun does not shine on these bodies, they will wither and die like weeds and grass. But if the sun shines on the weeds, they spread and choke the grapevine. If the grapevine instead spreads, grows, and shades all the weeds and bushes beside it, it alone will possess the ground where it grows. It will rule every place covered by its shade. When it matures, it will control the whole land and produce an abundant crop for its master. This will please him even more because he will be spared the hard work of uprooting those plants. The grapevine itself will get rid of them by choking them. They will die and become like the soil.”


    Jesus continued:


    “Woe to you because you did not accept the teaching, and those who […] will labor in preaching […]. And [you] are running into […] will drive [them] down […] by day you kill them […] so that they could rise from death.”'
