translation:
  language: en
  text: 'The rulers wanted to deceive humanity because they saw that human beings were related to those who are truly good. They took the names of the good and gave them to those who are not good. In this way, they deceived humanity by these names and bound people to those who are not good. Then they supposedly do people a favor: they take them away from those who are not good and place them among those who are good. The rulers knew what they were doing. They wanted to take free people and enslave them forever.


    There are powers that exist […] humanity, not wanting them to be [saved], so that they may be […] because if humanity [were saved], sacrifices would [not] happen […] and animals offered up to the powers. Those who received the offerings were animals. The animals were offered while alive, but when they were offered, they died. A human being was offered to God dead, and he lived.


    Before Christ came, there was no bread in the world. In the same way, Paradise, where Adam lived, had many trees to feed the animals but no wheat to feed humanity. Human beings ate as animals did. But when Christ, the perfect human, came, he brought bread from heaven so that humanity could eat food proper for human beings.


    The rulers thought they were acting by their own power and choice. But through them, the Holy Spirit was secretly accomplishing everything it wanted. Truth has existed from the beginning and is sown everywhere. Many see it being sown, but few see it being reaped.'
