translation:
  language: en
  text: 'Jesus took them all by stealth, because he did not appear as he was. Instead, he appeared in ways they were able to see. To the great he appeared great, and to the small he appeared small. To angels he appeared as an angel, and to human beings as a human being. In this way, his Word hid itself from everyone. Some saw him but thought they were seeing themselves.


    But when he appeared in glory to his disciples on the mountain, he was not small. He became great, and he also made the disciples great so that they could see him as great.


    That day, in the Eucharist, he said, “You who have united the perfect light with the Holy Spirit, also unite the angels with us, with the images!”


    Do not despise the lamb, because without him no one can see the door. No one can approach the king naked.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: he appeared as [they'd] be able to see him
  simplified_phrase: he appeared in ways they were able to see
  preserved_meaning: Jesus appeared according to the observers’ capacity to see him.
  reasoning_layer_used: POB text and immediate parallel clauses
  rationale: The wording is natural while the following contrasts still define the different ways he appeared.
- pob_phrase: Some did see him, thinking they were seeing themselves
  simplified_phrase: Some saw him but thought they were seeing themselves
  preserved_meaning: Some perceived Jesus while mistaking the sight for themselves.
  reasoning_layer_used: POB text and English witness
  rationale: The contrast is stated directly without explaining the passage’s intentional mystery.
- pob_phrase: without him it's impossible to see the door
  simplified_phrase: without him no one can see the door
  preserved_meaning: The lamb is necessary for anyone to see the door.
  reasoning_layer_used: POB text
  rationale: The personal construction expresses the same impossibility in common English.
