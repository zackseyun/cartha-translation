translation:
  language: en
  text: 'Names assigned within this world can be deeply misleading. They turn the heart away from what is right toward what is wrong. When someone hears “God,” that person does not think of what is right, but of what is wrong. The same is true of “the Father,” “the Son,” “the Holy Spirit,” “the life,” “the light,” “the resurrection,” “the church,” and all the other names. People think not of [what is right], but of what is [wrong], [unless] they have learned what is right.


    The [names heard] exist in this world […] [and deceive. If they existed] in the eternal age, they would not be used as names in this world or placed among worldly things. They come to an end in the eternal age.[a]


    One name is never spoken in this world: the name the Father gave to the Son. This name stands above everything else. It is the Father’s name, for the Son could not have become a father unless he had received the Father’s name. Those who have this name know it but do not speak it. Those who do not have it do not know it.


    But Truth brought names into the world for us, because without these names we cannot learn Truth. There is only one Truth, yet it is many things for us. Through these many things, it teaches us this one thing in love.'
