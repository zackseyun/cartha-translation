translation:
  language: en
  text: 'A Hebrew makes another Hebrew. A person made in this way is called a “proselyte,” or convert. But a proselyte does not make another proselyte. They are like […] and they make others […] For them, it is enough simply to come into being.


    A slave seeks only freedom, not the master’s property. But a son is more than a son: he claims his father’s inheritance as his own. Those who inherit the dead are themselves dead, and what they inherit is dead. Those who inherit the living are themselves alive, and they inherit both the living and the dead. The dead cannot inherit anything. After all, how can the dead inherit? If the dead inherit the living, they will not die. Instead, they will become even more alive!


    A Gentile does not die, because that person has never lived and so cannot die. Whoever has believed in the Truth is alive and therefore at risk of dying. They have been alive since the day Christ came. The world is created, the cities are gentrified,[a] and the dead are carried out.


    When we were Hebrews, we had no father—only our mother. But when we became Christians, we received both a father and a mother.'
  philosophy: optimal-equivalence
