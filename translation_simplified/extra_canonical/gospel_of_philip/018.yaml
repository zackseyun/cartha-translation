translation:
  language: en
  text: 'Everyone who [enters] the chamber will light their [lamp]. It is like marriages that […] take place at night: the fire […] at night and then goes out.[a] But the mysteries of this marriage are fulfilled in daylight. That day and its light never set.


    Anyone who becomes a child of the bridal chamber will receive the light. Those who do not receive it while they are here will not be able to receive it in the other place. Whoever receives that light will not be seen or bound, and no one will be able to trouble such a person, even while they live in this world. When they leave the world, they have already received the Truth in the images. For them, the world has become the eternal ages, because the eternal age is their fullness. This is how it is: it is revealed to them alone. It is not hidden in darkness and night, but is hidden in perfect daylight and holy light.


    The Gospel According to Philip'
