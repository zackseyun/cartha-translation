translation:
  language: en
  text: 'Those who plant seed in winter harvest it in summer. Winter stands for this world, and summer for the age to come. So let us plant in this world, so that we may harvest in summer. That is why it is not right for us to pray in winter. Summer comes after winter. But if someone tries to harvest in winter, they will not gather a crop. They will only uproot the plants, because this kind will not produce fruit […] it does not merely come out […] but in the other Sabbath […] it bears no fruit.


    Christ came to purchase some, save others, and set still others free. He purchased those who were strangers, made them his own, and set them apart as a pledge, as he wished. He did not begin to lay down his life only when he appeared. Ever since the world came into being, he laid down his life when he wished. Then he came first to reclaim it, because it had been given as a pledge. Robbers had captured it and held it under their power, but he saved it. He also set free both those who are good in the world and those who are bad.


    Light and darkness, right and left, are brothers to each other and cannot be separated. Therefore, those who are good are not truly good, those who are bad are not truly bad, life is not truly life, and death is not truly death. Each will therefore be dissolved back into its original source. But those who have been raised above the world cannot be dissolved; they are eternal.'
  philosophy: optimal-equivalence
