interpretive_expansions:
- pob_phrase: Truth is like ignorance.
  rendering: 'Truth is like ignorance in this respect: when hidden, it remains within itself.'
  claim: The comparison concerns the hidden state of both truth and ignorance, not their moral character.
  evidence:
  - The next clause explains the comparison by describing truth while hidden.
  - The paragraph immediately contrasts truth’s power and freedom with ignorance and error.
  confidence: high
  alternatives_preserved:
  - The broader comparison remains open beyond the stated point of resemblance.
- pob_phrase: what exists from [ignorance] did not exist, nor [does it exist], nor will they come into being
  rendering: what comes from [ignorance] never truly existed, [does not exist], and will not come into being
  claim: The passage denies enduring or genuine reality to what arises from ignorance.
  evidence:
  - The sequence denies past, present, and future existence.
  - The following line contrasts this with completion when the whole truth is revealed.
  confidence: moderate
  alternatives_preserved:
  - A stricter reading may treat the statement as an unqualified denial of existence.
