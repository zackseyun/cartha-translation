translation:
  language: en
  text: 'When Abraham […] to see what he was going to see, he circumcised the flesh of the foreskin. By this he told us that the flesh must be destroyed.


    [Most things] in the world can remain alive as long as their [inner parts are hidden. If those parts are exposed], they die. The human body shows this clearly. A person lives [as long as] the inner organs remain hidden. If they are exposed and come out, the person dies. A tree is the same. While its root is hidden, the tree blossoms and grows. If the root is exposed, the tree dries up.


    So it is with everything born in the world, whether visible or hidden. As long as the root of evil remains hidden, it is strong. But when it is recognized, it begins to dissolve, and when it is exposed, it dies. Therefore the Word says, “The axe is already lying at the root of the trees.” The axe will not merely cut the tree, because a cut tree can blossom again. Instead, it digs into the ground until it pulls up the root.


    Jesus pulled out the whole root, but others removed only part of it. Each of us, then, must dig down to the root of the evil within us and pull it out completely. It will be uprooted if we recognize it. But if we fail to recognize it, it takes root and bears fruit within us. It becomes our master and forces us to serve it. It takes us captive, so that we do what we do [not] want to do and do [not] do what we want to do. [It is] powerful because we have not recognized it. It remains active as long as [it exists].


    [Ignorance] is the mother of [all evil]. Ignorance leads to [death, because] what comes from [ignorance] never truly existed, [does not exist], and will not come into being. […] They will be made complete when the whole truth is revealed.


    Truth is like ignorance in this respect: when hidden, it remains within itself. But when truth is revealed and recognized, it is honored because it is stronger than ignorance and error. Truth brings freedom. The Word says, “If you know the truth, the truth will make you free.” Ignorance is slavery; knowledge is freedom. If we know the truth, we will find its fruit within us. If we unite with the truth, it will receive our fullness.


    For now, we have only what has been revealed about creation. We say, “The strong are honored, while the hidden are weak and despised.” But with the truth, what has been revealed is weak and despised, while what remains hidden is strong and honored. Even so, the mysteries of the truth are revealed through symbols and images.


    The chamber remains hidden; it is the Holy within the Holy. At first, the veil hid the way God governed creation. But when the veil is torn and the inside is revealed, this house will be abandoned [like] a desert—or rather, it will be [destroyed]. All divinity will flee [from] these places. It will not enter the Holies [of the] Holies, because it cannot unite with the pure [light] and the [flawless] fullness. [Instead,] it will come under the wings and outstretched arms of the cross. This ark will [save them] when the floodwaters rise over them.


    Those who belong to the priesthood will be able to go behind the veil with the high priest. The veil was not torn only at the top, for then it would have opened only for those above. Nor was it torn only at the bottom, for then it would have been revealed only to those below. It was torn from top to bottom. Those above opened the way below for us, so that we may enter the secret of the truth.


    This secret is truly honored and strong, yet we will enter it through symbols that are despised and appear weak. These symbols are humbled before the perfect glory. One glory surpasses another, and one power surpasses another. In this way, the perfect reality was opened to us along with the secrets of the truth. The Holies of the Holies were revealed, and the chamber invited us to enter.


    As long as evil remains hidden, it is inactive, but it has not been removed from among the Holy Spirit’s offspring. They remain servants of evil. But when evil is exposed, the perfect light will pour out on everyone, and all who are in that light will [receive the anointing]. Then servants will be set free, and captives will be redeemed. “[Every] plant [that] my Father in heaven [did not] plant [will be] uprooted.” Those who are separated will be united […] and filled.'
