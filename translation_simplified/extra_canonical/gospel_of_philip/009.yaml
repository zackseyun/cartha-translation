translation:
  language: en
  text: 'The heavenly human has more children than the earthly human. Adam has many children, even though they die. How many more children, then, does the perfect human have—children who do not die but are continually being born?


    A father begets a son, but a son cannot beget sons. Someone who has been born cannot beget sons; the son begets brothers instead. Everyone born in this world is born physically, while the others in […] are begotten by him […] out there to the human […] in the […] heavenly place […] it from the mouth […]. The Word came from there. They would receive nourishment from the mouth and become perfect. The perfect are conceived and born through a kiss. That is why we also kiss one another, receiving conception from the grace within one another.


    Three women always traveled with the Lord: his mother Mary, her sister, and Magdalene, who is called his companion. For Mary is his sister, his mother, and his partner.


    “Father” and “Son” are each a single name. “Holy Spirit” is a double name, because they are everywhere. They are in heaven and below; they are hidden and revealed. The Holy Spirit is revealed below and hidden in heaven.


    The evil powers serve the holy ones. The Holy Spirit has blinded these powers, so they think they are serving an ordinary human when they are actually working for the holy ones. One day, therefore, a disciple asked the Lord about a worldly matter. He replied, “Ask your Mother, and she will give you something from someone else.”


    The apostles said to the disciples, “May all our offering receive salt.” They called […] “salt.” Without it, the offering is not acceptable. But Wisdom has no children. Because of this, she is called […], this of salt, the place they will […] in their own way. The Holy Spirit […] […] many children.


    Everything that belongs to the father also belongs to the son. But while the son is still a child, he is not entrusted with what is his. When he grows into a man, his father gives him everything that belongs to him.


    Those who were born through the Spirit and then go astray also go astray through it. Because of this, through this one Spirit, it blazes—that is, the fire—and it is extinguished.


    Echamoth and Echmoth are not the same. Echamoth is simply Wisdom. Echmoth is the Wisdom of Death, which knows death. This is called “the little Wisdom.”'
