translation:
  language: en
  text: 'Those who say that the Lord first died and then rose are wrong. He first rose, and then he died. Anyone who does not first receive resurrection will not die. As surely as God lives, that person would die!


    No one hides a great treasure inside something else of great value. Yet people often put countless thousands into something worth only a penny. So it is with the soul: something precious came to exist in a despised body.


    Some people fear that they will rise naked. So they want to rise wearing flesh. They do not understand that those who wear flesh are naked. But those who … strip themselves naked are not naked.[a] “Flesh and blood will not inherit God’s kingdom.” What, then, will not inherit it? What we now wear. And what will inherit it? Jesus’ flesh and blood. That is why he said, “Whoever does not eat my flesh and drink my blood has no life within.” What is his flesh? The Word. And his blood is the Holy Spirit. Whoever has received these has food, drink, and clothing.


    For my part, I also disagree with those who say, “It will not rise.” Both sides are wrong. You who say, “The flesh will not rise,” tell me what will rise, so that we may honor your answer. You say, “The spirit within the flesh, and another light within the flesh.” But even these words are spoken through flesh, because you cannot say anything apart from flesh. We must rise in this flesh, since everything exists within it. In this world, people are greater than the clothes they wear. In the kingdom of heaven, the clothes are greater than those who wear them.


    Everything is purified by water and fire: visible things by what is visible, and hidden things by what is hidden. Some hidden things are concealed by visible things. There is water within water, and fire within chrism, the sacred anointing oil.'
