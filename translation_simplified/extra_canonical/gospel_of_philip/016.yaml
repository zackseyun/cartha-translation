  english_witness: 'The world is farmed through four things. They gather into barns through water, earth, wind, and light. And in the same way, God farms through four things too: through faith, hope, love, and knowledge. Our earth is the faith in which we''re rooted. [And] the [water] is the hope through which [we''re] nourished. The wind is the love through which we grow. And the light [is] the knowledge through which we [ripen]. Grace exists in [four kinds. It''s] earthly, it''s [heavenly, …] the heaven of the heaven […] through [….] Blessed is the one who hasn''t […] a soul. This one is Jesus Christ. He went all over the place and didn''t burden anyone. So, blessed is someone like this; they''re a perfect person, because the Word tells us about how hard it is to keep up. How will we be able to achieve such a great thing? How will he give rest to everyone? First and foremost, it''s not right to cause anyone grief – whether great or small, or faithless or faithful – and then give rest to
    those who are (already) at rest among those who are well off. There are some who benefit from giving rest to the one who''s well off. Whoever does good can''t give rest to them because they can''t just do whatever they want; they can''t cause grief because they can''t cause distress, but sometimes the one who''s well off causes them grief. They''re not like that, but it''s their (own) evil that causes them grief. Whoever has the nature (of the perfect person) gives joy to the one who''s good, but some grieve terribly at this.


    A householder acquired everything, whether child or slave or cattle or dog or pig or wheat [or] barley or straw or hay or […] or meat and acorn. [But they''re] wise and understand what to feed each [one]. To the children they served bread […] but [… the] slaves they served […], and to the cattle [they threw barley] and straw and hay. To [the] dogs they threw bones [and] to [the pigs] they threw acorns and slops. That''s what it''s like with the disciple of God. If they''re wise, they understand what it means to be a disciple. The bodily forms won''t deceive them, but they''ll look at the condition of the soul of each one and speak with them. There are many animals in the world that are made in human form. They (the disciple) recognizes them. To the pigs they''ll throw acorns, but to the cattle they''ll throw barley with straw and hay. To the dogs they''ll throw bones, to the slaves they''ll give the appetizer, and to the children they''ll give the perfect (food).


    There''s the Son of Humanity, and there''s the son of the Son of Humanity. The Lord is the Son of Humanity, and the son of the Son of Humanity is the one who creates through the Son of Humanity. The Son of Humanity received from God the ability to create. He (also) has the ability to beget. The one who received the ability to create is a creature; the one who received the ability to beget is begotten. The one who creates can''t beget; the one who begets can create. They say, "The one who creates, begets." But what they beget is a creature. [So] their begotten aren''t their children, but they''re […]. The one who creates works [publicly], and are themselves [revealed]. The one who begets, begets [secretly], and they''re hidden […] the image. [Again], the one who [creates, creates] publicly, but the one who begets, [begets] children secretly.


    No [one will be able to] know [when the husband] and the wife are intimate with each other, except they themselves, because the marriage of the world is a mystery for those who have married. If the defiled marriage is hidden, how much more is the undefiled marriage a true mystery! It''s not fleshly, but pure. It isn''t of desire, but of the will. It isn''t of the darkness or the night, but it''s of the day and the light. If a marriage is stripped naked, it becomes pornography – not only if the bride receives the seed of another man, but even if she leaves the chamber and is seen, she commits adultery. Let her reveal herself to her father, her mother, the best man, and the groom''s children. They''re allowed to enter the bridal chamber every day. But let the others yearn just to hear her voice and enjoy her perfume, and, like dogs, let them eat the crumbs that fall from the table. Grooms and brides belong to the bridal chamber. No one will be able to see the groom and the bride unless
    [they become] such.'
