translation:
  language: en
  text: 'Four things make the world fruitful. Crops are gathered into barns by means of water, earth, wind, and light. In the same way, God makes people fruitful through four things: faith, hope, love, and knowledge. Faith is our earth, where we take root. [Hope] is the [water] that nourishes us. Love is the wind by which we grow. Knowledge is the light by which we [ripen]. Grace exists in [four forms. One is] earthly, one is [heavenly, …] the heaven above heaven […] through […].


    Blessed is the one who does not have […] a soul. This one is Jesus Christ. He went everywhere without becoming a burden to anyone. So anyone like him is blessed and is a perfect person. The Word tells us how difficult it is to live this way. How can we attain something so great? How can such a person give rest to everyone?


    Above all, it is wrong to cause anyone grief—great or small, faithless or faithful—and then offer rest only to those who are already at ease among the well-off. Some people benefit by giving rest to someone who is well-off. But a person who does good cannot give them rest, because that person cannot simply do whatever they want. Such a person cannot cause grief, because they cannot cause distress. Yet sometimes the well-off person causes them grief. The good person is not the cause; the well-off person’s own evil causes the grief. Whoever has the nature of the perfect person brings joy to a good person, though some are deeply grieved by this.


    A master of a household had all kinds of possessions: children, servants, cattle, dogs, pigs, wheat, barley, straw, hay, […], meat, and acorns. Being wise, the master knew what food to give each one. The children were served bread […], while […] the servants were served […]. The cattle were given barley, straw, and hay. The dogs were given bones, and the pigs acorns and scraps.


    So it is with a disciple of God. A wise disciple understands what discipleship requires. Outward appearances will not deceive such disciples. They will see the condition of each person’s soul and speak to that person accordingly. There are many animals in the world made in human form, and the disciple recognizes them. The disciple gives acorns to the pigs; barley, straw, and hay to the cattle; bones to the dogs; a first course to the servants; and perfect food to the children.


    There is the Son of Humanity, and there is the son of the Son of Humanity. The Lord is the Son of Humanity. The son of the Son of Humanity is the one who creates through the Son of Humanity. The Son of Humanity received from God the power to create, and he also has the power to beget. The one who received the power to create is a created being. The one who received the power to beget was begotten. The one who creates cannot beget, but the one who begets can create.


    People say, “The one who creates also begets.” But what such a person begets is actually something created. [So] those begotten by them are not their children, but they are […]. The one who creates works [openly] and is [revealed]. The one who begets does so [in secret] and remains hidden […] the image. [Again], the one who [creates, creates] openly, but the one who begets [begets] children in secret.


    No [one can] know [when a husband] and wife are intimate except the two of them, because worldly marriage is a mystery known to those who are married. If even a defiled marriage is hidden, how much more is an undefiled marriage a true mystery! It is not fleshly but pure. It does not arise from desire but from the will. It does not belong to darkness or night, but to day and light.


    If a marriage is exposed to public view, it becomes pornography. This happens not only if the bride receives another man’s seed. Even if she leaves the bridal chamber and allows herself to be seen, she commits adultery. Let her reveal herself only to her father, her mother, the best man, and the groom’s children. They are permitted to enter the bridal chamber every day. But let everyone else long merely to hear her voice and enjoy her fragrance. Like dogs, let them eat the crumbs that fall from the table. Grooms and brides belong in the bridal chamber. No one can see the groom and bride unless [they become] like them.'
