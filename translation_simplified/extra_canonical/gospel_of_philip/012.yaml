translation:
  language: en
  text: '[The] mystery of marriage [is] great, because [without] it the world would [not exist]; because [the] structure of [the world …], but the structure [… the marriage]. Consider the [intimate …] that is defiled, because it has […] power. Its image exists in a [defilement].


    Impure spirits take male and female [forms]. The male spirits are intimate with souls living in female forms. The female spirits join themselves to those in male forms through disobedience. No one can escape their bonds without receiving both a male and a female power—the groom and the bride—in the image of the bridal chamber.


    When foolish female spirits see a man sitting alone, they rush at him, toy with him, and defile him. In the same way, when foolish male spirits see a beautiful woman sitting alone, they seduce and coerce her because they want to defile her. But when they see a husband and wife sitting together, the female spirits cannot enter the husband, and the male spirits cannot enter the wife. So it is when the image is united with the angel: no one will dare to enter the [male] or the female.'
  philosophy: optimal-equivalence
