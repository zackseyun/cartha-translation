  english_witness: 'There are animals that submit to humans, like the calf, the donkey, and others of this kind. Others are not submissive, and live alone in the wilderness. Humanity ploughs the field with the submissive animals, and consequently nourishes itself and the animals, whether submissive or not. That''s what it''s like with the perfect human: they plough with the submissive powers, preparing for everyone that will exist. So because of this the whole place stands, whether the good or the evil, and the right and the left. The Holy Spirit shepherds everyone and rules all the powers – those that are submissive, those that [aren''t], and those that are alone – because truly it […] confines them [so that …] want to, they won''t be able to [leave].


    [The one who''s been] formed [is beautiful, but] you''d find his children being noble forms. If he weren''t formed but begotten, you''d find that his seed was noble. But now he was formed, and he begot. What nobility is this? First there was adultery, and then murder; and he (Cain) was begotten in adultery, because he was the son of the serpent. Because of this he became a murderer like his father too, and he killed his brother (Abel). Every partnership between those who are dissimilar is adultery.'
