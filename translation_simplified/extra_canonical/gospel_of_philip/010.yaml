translation:
  language: en
  text: 'Some animals obey humans, such as calves, donkeys, and others like them. Other animals do not obey humans but live alone in the wilderness. People use the obedient animals to plow their fields. In this way, they produce food for themselves and for the animals, whether they obey or not.


    The perfect human is like this. Such a person works with the powers that obey, making provision for everyone who will come into being. Because of this, the whole place continues to stand—with good and evil, right and left. The Holy Spirit cares for everyone like a shepherd and rules over all the powers: those that obey, those that [do not], and those that are alone. For the Spirit truly […] holds them in, so that even if they […] want to, they cannot [leave].


    [The one who has been] formed [is beautiful, but] you would find that his children have noble forms. If he had not been formed but had been begotten, you would find that his offspring were noble. But as it is, he was formed and then fathered children. What is noble about that?


    First came adultery, and then murder. He (Cain) was begotten in adultery because he was the serpent’s son. So he too became a murderer like his father and killed his brother (Abel). Every union between those who are unlike is adultery.'
  philosophy: optimal-equivalence
