translation:
  language: en
  text: 'Whoever leaves the world behind can no longer be bound, because they have lived in the world. They are shown to have risen above desire for […] and above fear. They rule over […]; they are greater than envy. If […] come, the powers bind and choke [them]. How can [they] escape the [great powers …]? How can they […]? Some [say], “We are faithful,” so that […] [an impure spirit] and a demon. But if they had the Holy Spirit, no impure spirit would cling to them. Do not fear the flesh, and do not love it. If you fear it, it will rule you. If you love it, it will swallow and choke you.


    A person is either in this world, in the resurrection, or in the places between them. May I never be found there! This world has both good and evil. Yet its good things are not truly good, and its evil things are not truly evil. But beyond this world there is something truly evil, called “the middle.” It is death. While we are in this world, we should obtain the resurrection for ourselves. Then, when the flesh is stripped from us, we will be found in the place of rest and will not have to pass through the middle, where many lose their way.


    It is good to leave the world behind before sinning. Some people neither want to do this nor are able to. Others would gain nothing even if they wanted to, because they did not act. Their wanting makes them sinners. Yet even if they do not want it, justice will still remain hidden from them. It is not the will, and it is not the act.


    In a vision, an apostle saw people shut inside a burning house. They were bound with burning […], thrown […] of the burning […] them in […]. They were told [… able] to be saved […], but they did not want to be. So they received […] punishment, called “the [outer] darkness,” because it […].


    The soul and the spirit came into being from water and fire. The offspring of the bridal chamber came from water, fire, and light. The fire is the chrism[a], and the light is the fire. I am not speaking of fire without form. I mean the other fire, whose form is white—bright and beautiful, and able to give beauty.


    Truth did not enter the world naked. It came clothed in types and images, for the world will not receive truth in any other way. There is rebirth, and there is an image of rebirth. It is truly necessary to be born again through the image. What are the resurrection and its image? It must rise through the image. What are the bridal chamber and its image? Through the image, people must enter the truth, which is restoration. Those who receive the name of the Father, the Son, and the Holy Spirit must not only acquire them; they too have been acquired for you. If someone does not acquire them, the name will also be taken away. They are received in the chrism of the […] of the power of the cross. The apostles called this “[the] right and the left,” because this person is no longer a [Christian], but a Christ.


    The Lord [did] everything as a mystery: baptism, chrism, Eucharist[b], redemption, and a bridal chamber […]. He [said], “I came to make [what is below] like [what is above, and what is outside] like [what is inside, and to unite] them in the place.” […] here through [types …]. Those who say, “[…] there is one above […,” are wrong, because] what is revealed is […] what is called “below,” while what is hidden is above it, because it is good. They speak of “the inside, the outside, and what is outside the outside.” So the Lord called destruction “the outer darkness.” Nothing lies outside it.


    He said, “My Father who is hidden.” He also said, “Enter your private room, shut the door behind you, and pray to your Father who is hidden.” This means the one who is within them all. The one within them all is the fullness. Beyond that, there is nothing further within. This is what is called “that which is above them.”


    Before Christ came, some left a place they could no longer enter, and they went to a place they could no longer leave. Then Christ came. He brought out those who had entered, and he brought in those who had gone out.'
