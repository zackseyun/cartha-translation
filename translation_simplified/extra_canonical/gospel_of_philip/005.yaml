  review_summary: 'The draft improves ordinary phrasing in several places, especially “mistaken and do not understand” and the conditional explanation about another father. However, it makes three unsupported moves in a text whose audit explicitly remains provisional: it changes the conception-by wording into causation, removes marked uncertainty in the apostolic phrase, and silently supplies an object in a fragmentary saying. The replacement retains the warranted simplification while preserving POB’s wording and textual uncertainty at those points.'
