translation:
  language: en
  text: 'Some people say, “Mary conceived by the Holy Spirit.” They are mistaken and do not understand what they are saying. When has a woman ever conceived by a woman? “Mary is the virgin whom no power defiled” is the great testimony of those Hebrews who became (the first) apostles and (the) apostolic (successors). The virgin whom no power defiled […] the powers defiled themselves.


    The Lord [would not] have said, “My [Father who is in] heaven,” unless [he] had another father. Otherwise, he would simply have said, [“My Father.”] The Lord said to the [disciples, “…] [from] every [house] and bring into the Father’s house. But do not steal anything from the Father’s house or carry it away.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: They are wrong; they do not know what they are saying.
  simplified_phrase: They are mistaken and do not understand what they are saying.
  preserved_meaning: The speaker rejects the claim and says its advocates lack understanding.
  reasoning_layer_used: POB translation
  rationale: Natural wording preserves both the correction and the charge of ignorance.
- pob_phrase: Instead, he would simply have said, [“My Father.”]
  simplified_phrase: Otherwise, he would simply have said, [“My Father.”]
  preserved_meaning: The alternative wording follows from the argument about another father.
  reasoning_layer_used: POB translation
  rationale: “Otherwise” makes the logical connection clear in ordinary English.
- pob_phrase: but do not steal anything from the Father’s house or carry it away
  simplified_phrase: But do not steal anything from the Father’s house or carry it away.
  preserved_meaning: The two prohibitions against taking from the Father’s house remain distinct.
  reasoning_layer_used: POB translation and fragmentary English witness
  rationale: A new sentence clarifies the command without supplying the missing object before it.
