  previous_text: 'Some people say, “Mary conceived by the Holy Spirit.” They are mistaken and do not understand what they are saying. When has a woman ever made another woman conceive? The Hebrews who became the first apostles and their successors gave this great testimony: “Mary is the virgin whom no power defiled.” The virgin whom no power defiled […] the powers defiled themselves.


