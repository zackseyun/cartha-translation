translation:
  language: en
  text: '“Jesus” is a hidden name, while “Christ” is a revealed name. For this reason, the name “Jesus” is not translated; he is simply called “Jesus.” But “Christ” is translated into each language: in Syriac it is “Messiah,” and in Greek it is “Christ.” “The Nazarene” reveals what is hidden. Everything is contained within Christ—human beings, angels, mysteries, and the Father.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: So “Jesus” is not translated, but he is called by his name “Jesus.”
  simplified_phrase: For this reason, the name “Jesus” is not translated; he is simply called “Jesus.”
  preserved_meaning: The personal name Jesus remains unchanged rather than being translated.
  reasoning_layer_used: POB translation and English witness
  rationale: The revised sentence makes the contrast between an untranslated name and a translated title easier to follow.
- pob_phrase: and all the others have it according to their own language
  simplified_phrase: “Christ” is translated into each language
  preserved_meaning: Other languages use their own equivalent of the title Christ.
  reasoning_layer_used: Immediate context in the POB translation
  rationale: The vague reference to “all the others” is recast as a direct statement about languages.
- pob_phrase: Christ has everything within himself, whether human or angel or mystery, and the Father
  simplified_phrase: Everything is contained within Christ—human beings, angels, mysteries, and the Father.
  preserved_meaning: Christ encompasses all the listed human, angelic, mysterious, and divine realities.
  reasoning_layer_used: POB translation and English witness
  rationale: A direct list replaces the difficult “whether” construction without weakening its sweeping claim.
interpretive_expansions:
- pob_phrase: all the others have it according to their own language
  rendering: “Christ” is translated into each language
  claim: The phrase refers to language communities using their own translation of the title.
  evidence:
  - The preceding clauses give the title in Syriac and Greek.
  - The POB says that others have it according to their own language.
  confidence: high
  alternatives_preserved:
  - Other peoples call him by the title in their own language.
