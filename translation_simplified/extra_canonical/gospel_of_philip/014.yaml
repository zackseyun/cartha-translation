translation:
  language: en
  text: 'When Eve was [within] Adam, death did not exist. Death came into being when she separated from him. If he [enters] again and receives it as his own, there will be no death.


    “[My] God, my God, why, Lord, [have] you abandoned me?” He said this on the cross because he was divided there. […] that he was born through that which […] from God. The […] from the dead […] exists, but […] he is perfect […] of flesh. But this […] is true flesh […] is not true, [but …] an image of what is true.


    A bridal chamber is not for animals, servants, or the impure. It is for free people and virgins.


    We are born again through the Holy Spirit, and through Christ we are born by two things. We are anointed through the Spirit. When we were born, we were united.


    Without light, no one can see themselves in water or in a mirror. Yet without water or a mirror, you cannot see yourself in the light. Therefore, it is necessary to be baptized in both light and water. The light is the chrism.[a]


    There were three offering chambers in Jerusalem. The chamber opening west was called “the Holy.” The one opening south was called “the Holy of the Holy.” The third opened east and was called “the Holy of Holies.” Only the high priest entered it. Baptism is “the Holy” chamber. [Redemption] is “the Holy of the Holy.” The “[Holy] of Holies” is the bridal chamber. [Baptism] includes resurrection [with] redemption, and redemption is in the bridal chamber. But the bridal chamber is better than […] You will not find its […] those who pray […] Jerusalem. […] Jerusalem who [… Jerusalem], being seen […] those called “[the Holies] of Holies” [… the] torn veil […] bridal chamber except the image [… which] [is above. So] its veil was torn from top to bottom, because some from below needed to rise above.


    The powers cannot see those who have clothed themselves with the perfect light, nor can they bind them. A person puts on that light in the mystery of union.


    If the woman had not been separated from the man, she would not have died with him. Their separation was the beginning of death. Christ therefore came to repair the separation that had existed from the beginning by uniting the two again. By uniting them, he will give life to those who died because of that separation. A wife now unites with her husband in the bridal chamber, and those united there will never again be separated. Eve separated from Adam because she did not unite with him in the bridal chamber.


    Adam’s soul came into being through a breath, and the spirit was its partner. What was given to him was his mother. His soul was [taken], and [life]—Eve—was given to him in its place. When he was united […] words better than the powers, and they envied him […] spiritual partner […] hidden […] that is, the […] themselves […] bridal chamber so that […] Jesus appeared [… at] the Jordan, the [fullness of the kingdom] of heaven. He who [was born] before everything was born again. He [who was anointed] first was anointed again. He who was redeemed was redeemed again.


    If we must speak about a mystery, the Father of all united with the virgin who came down, and fire gave him light that day. He revealed the great bridal chamber, and so his body came into being that day. He came out of the bridal chamber like someone born from bridegroom and bride. In this way Jesus established everything within himself. Each disciple must also enter his rest through these things.


    Adam came into being from two virgins: the Spirit and the untouched earth. In the same way, Christ was born from a virgin to repair the fall that happened in the beginning.


    Two trees grow in Paradise. One produces [animals], and the other produces humans. Adam [ate] from the tree that produced animals. [He] became an animal and produced [animals]. That is why Adam’s children worship [animals]. The tree […] is fruit […] this they […] ate the […] fruit of the […] produce humans […] of the human […] God makes the human, [… humans] make [God]. This is what happens in the world: people make gods and then worship what they made. It would be better for the gods to worship humans!


    The truth is that human work comes from human power; therefore, humans are called “the powers.” Their works are their children, who come into being through rest. Their power is present in their works, but rest is revealed in their children. You will find that this also applies to the image. This is the person in the image: people accomplish their work through power, but they produce their children through rest.


    In this world, servants work for free people. In the kingdom of heaven, free people will serve servants. The children of the bridal chamber will serve the children of [marriage. The] children of the bridal chamber have one name: “Rest.” Because they are together, they do not need to take form, [for they have] contemplation […] they are many […] with those who are in the […] the glories of the […] not […] them […] go down into the [water …] they will redeem themselves […] that is, those who have […] in his name, because he said, “[In this way] we will fulfill all righteousness.”'
