translation:
  language: en
  text: 'God is like a dyer. Good dyes are called “true” because their color lasts as long as the cloth they color. So it is with those whom God colors. His dyes never die, so his colors make them immortal. But God baptizes in water.


    No one can see the things that truly exist without becoming like them. This is not how things work in this world: people see the sun without becoming a sun, and they see heaven, earth, and everything else without becoming those things. But you have seen things from that other realm and have become like them. You saw the Spirit and became spirit. You saw Christ and became Christ. You saw [the Father, and you] will become father. Here you see everything but do not [see yourself]. There you see yourself, because you will [become] what you see.


    Faith receives; love gives. [No one can receive] without faith, and no one can give without love. Therefore, we believe so that we may receive, and we give so that we may love. Anyone who gives without love gains nothing from giving. Whoever has not received the Lord is still a Hebrew.


    The apostles who came before us called him “Jesus the Nazarene Messiah,” that is, “Jesus the Nazarene Christ.” His last name is “Christ,” his first is “Jesus,” and the name in the middle is “the Nazarene.” “Messiah” has two meanings: “Christ” and “the measured.” In Hebrew, “Jesus” means “the redemption,” and “Nazara” means “the truth.” Therefore, “the Nazarene” means “the truth.” “Christ” is the one who was measured, while “the Nazarene” and “Jesus” are the ones who were measured.


    A pearl does not lose its value when it is thrown into mud, nor does it gain value when it is rubbed with fragrant oil. It is always valuable to its owner. The same is true of God’s children: wherever they may be, they remain valuable to their Father.


    If you say, “I am a Jew,” no one will react. If you say, “I am a Roman,” no one will be disturbed. If you say, “I am a Greek,” “a foreigner,” “a slave,” or [“a free person,”] no one will be troubled. But [if] you [say], “I am a Christian,” the […] will tremble. If only [… someone of] this kind, someone [who …] will not be able to endure [hearing] this name.


    God is one who consumes humans. For this reason, the human is [sacrificed] to him. Before the human was sacrificed, animals were sacrificed, because those who received those sacrifices were not gods.


    Glass and clay containers are both made with fire. If a glass container breaks, it can be made again, because it was formed by means of breath. But if a clay container breaks, it is destroyed, because it was formed without breath.


    A donkey walking in circles to turn a millstone traveled a hundred miles. When it was set free, it found itself in the same place. Many people travel but never arrive anywhere. When evening came, they had seen no city or village, nothing made by human hands or found in nature, and no spiritual power or angel. Those miserable people had worked for nothing.


    The Eucharist is Jesus. In Syriac he is called “Pharisatha,” meaning “the one spread out,” because Jesus came to crucify the world.


    The Lord entered Levi’s dye workshop. He took seventy-two colors and threw them into the dye vat. When he took them out, they were all white. He said, “This is how the Son of Humanity has come [as] a dyer.”


    Wisdom, who is called “the barren woman,” is the Mother [of the angels] and [the] companion of the [… Mary] Magdalene. [… He loved her] more than the disciples, and [… he] often kissed her on her […]. The rest of […] said to him, “Why do you love her more than all of us?” The Savior answered them, “Why do I not love you as I love her? When a blind person and a sighted person are both in the dark, there is no difference between them. When the light comes, the sighted person will see it, but the blind person will remain in darkness.”


    The Lord said, “Blessed is the one who exists before coming into existence, because those who exist existed before and will continue to exist.”


    Human superiority cannot be seen; it lies in what is hidden. This is why humans rule over animals that are stronger and greater in both visible and hidden ways. Human care enables the animals to survive. But when they are separated from humans, they kill, bite, and eat one another because they cannot find food. Now, however, they have food because humans have cultivated the ground.


    Suppose someone goes down into the baptismal water and comes back up without receiving anything, yet says, “I am a Christian.” That person has borrowed the name at interest. But if someone receives the Holy Spirit, the name is a gift. A gift is not taken back, but a name borrowed at interest must be given back. This is what happens when someone comes into being through a mystery.'
