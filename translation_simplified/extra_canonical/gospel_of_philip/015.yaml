translation:
  language: en
  text: 'Those who say, “First we will die, and then we will rise,” are wrong. They must first receive resurrection while they are still alive. Otherwise, they will receive nothing when they die. The same applies when people say, “Baptism is a great thing,” for those who receive it will live.


    … Jesus came from that place and brought food from there. He gave it to those who wanted it, so that they would not die.


    … The cup of prayer contains wine and water. It represents the blood over which they give thanks. It is filled with the Holy Spirit and belongs to the fully perfected person. …


    In this world, male and female unite in a relationship marked by power and weakness. In the (eternal) age, union is different, though we use the same names for it. Yet there are other names higher than every name that is named. They are greater than what is strong, because wherever force exists, there are those who are even more powerful. These are not two different things; both are one. …


    Everyone who has everything must surely come to know themselves fully. Some who do not know themselves will not be able to enjoy what they have, but those who come to understand themselves will enjoy those things.


    They will not be able to bind the perfected person. They will not even be able to see that person, because if they could see them, they would bind them. …


    The holy man—the priest—is holy throughout, even in his body. If he receives bread, he will make it holy. The same is true of a cup or anything else that he takes and purifies. Why, then, would he not also purify the body?


    … Spiritual love is fragrant wine. Everyone who anoints themselves with it enjoys it. …


    A person held as a slave against their will can still become free. But someone whose master graciously freed them, and who then sold themselves back into slavery, can no longer become free.'
