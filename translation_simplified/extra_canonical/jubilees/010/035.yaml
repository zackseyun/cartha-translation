translation:
  language: en
  text: That land was called Canaan. Japheth and his sons traveled toward the sea and settled in the land assigned to them. Madai saw the land by the sea, but he did not like it. He asked Elam, Asshur, and Arpachshad for a share of land, and he settled there.[35]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '35'
    text: The Ethiopic wording about Madai’s wife’s brother is awkward. It may connect Arpachshad in particular with Madai’s wife; Elam, Asshur, and Arpachshad are understood here as the people from whom Madai requested land.
    reason: source_note
