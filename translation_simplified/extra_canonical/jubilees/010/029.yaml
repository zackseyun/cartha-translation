translation:
  language: en
  text: Canaan saw that the land of Lebanon, as far as the brook of Egypt, was very good. He did not go to the land west of the sea that had been assigned to him as his inheritance. Instead, he settled in the land of Lebanon, between the border of the Jordan and the border of the sea.
