  text: Noah lived 950 years. During his life on earth, he lived longer than all other people except Enoch,[a] because his righteousness was complete. Enoch was appointed as a witness for the generations of the world, recounting the deeds of one generation after another until the day of judgment.
  philosophy: optimal-equivalence
