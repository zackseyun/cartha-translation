translation:
  language: en
  text: You know what your Watchers—the fathers of these spirits—did in my days. Now imprison the spirits that are still alive. Keep them securely in the place of judgment, and do not let them corrupt the children of your servant, O my God. These spirits are evil and were created to destroy.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: how your Watchers, the fathers of these spirits, acted in my days
  simplified_phrase: what your Watchers—the fathers of these spirits—did in my days
  preserved_meaning: The Watchers are identified as the fathers of the spirits, and their past conduct remains in view.
  reasoning_layer_used: POB text and source-driven identification
  rationale: Common wording and dashes make the action and explanatory title easier to follow.
- pob_phrase: As for these spirits that are living, imprison them and hold them fast in the place of judgment
  simplified_phrase: Now imprison the spirits that are still alive. Keep them securely in the place of judgment
  preserved_meaning: The living spirits are to be confined securely at the place appointed for judgment.
  reasoning_layer_used: POB text and optimal-equivalence philosophy
  rationale: Two direct sentences replace the dense command while preserving both imprisonment and secure restraint.
- pob_phrase: do not let them bring corruption upon the sons of your servant
  simplified_phrase: do not let them corrupt the children of your servant
  preserved_meaning: God is asked to prevent the spirits from bringing ruin or corruption upon his servant's descendants.
  reasoning_layer_used: POB text and applied vocative revision
  rationale: The verb “corrupt” and common “children” express the same threat more naturally while retaining “O my God” as direct address.
translation_notes:
  risk_flags:
  - risk: “Children” may be read as immediate offspring rather than the broader descendants implied by “sons.”
    mitigation: The phrase remains relationally broad in context and avoids the modern male-only sense of “sons.”
  - risk: “Still alive” may suggest ordinary biological life.
    mitigation: Keeping “spirits” as the subject preserves the text's supernatural frame.
