translation:
  language: en
  text: His father Ham and his brothers Cush and Mizraim said to him, “You have settled in a land that is not yours and was not assigned to you by lot. Do not do this. If you do, you and your sons will fall in that land and be cursed because of your rebellion. You settled there in rebellion, and in rebellion your sons will fall. You will be uprooted forever.”
