translation:
  language: en
  text: 'The Lord went down, and we went down with him, to see the city and tower the people had built. He confused their languages, so they could no longer understand one another. Then they stopped building the city and tower. That is why the whole land of Shinar was called Babel: there the Lord confused the languages of all people. From there they were scattered to their cities, each according to their language and nation.'
