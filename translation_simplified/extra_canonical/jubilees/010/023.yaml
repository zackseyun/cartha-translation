  rationale: The common term “people” conveys the referent without the unfamiliar idiom.
- pob_phrase: they no longer heard one another’s speech
  simplified_phrase: they could no longer understand one another
  preserved_meaning: Their confused languages prevented mutual communication.
  reasoning_layer_used: POB translation and narrative consequence
  rationale: The clearer wording states the communication failure that caused the building to stop.
- pob_phrase: and they ceased building
  simplified_phrase: Then they stopped building
  preserved_meaning: The language confusion brought construction to an end.
  reasoning_layer_used: POB clause sequence
  rationale: A short sentence with “then” makes the sequence easy to follow.
