translation:
  language: en
  text: And the Lord our God said to us,[a] “Look! They are one people, and this is only the beginning of what they will do. Now nothing they plan will be beyond their reach. Come, let us go down and confuse their languages so that they cannot understand one another’s speech. They will be scattered among different cities and nations, and they will no longer share one purpose until the day of judgment.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This wording echoes the account of Babel, but Jubilees presents it as part of the angels’ first-person revelation, not merely as a quotation from Genesis.
    reason: cross_reference
