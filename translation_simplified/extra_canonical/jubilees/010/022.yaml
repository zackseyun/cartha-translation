  simplified_phrase: nothing they plan will be beyond their reach
  preserved_meaning: Their united action will allow them to carry out whatever they plan.
  reasoning_layer_used: POB translation and immediate context
  rationale: The rewrite makes the result of their unity clear without changing its force.
- pob_phrase: confuse their tongues
  simplified_phrase: confuse their languages
  preserved_meaning: God will disrupt their shared language.
  reasoning_layer_used: POB translation
  rationale: “Languages” gives the intended sense of the biblical image in common English.
- pob_phrase: one purpose will no longer remain with them
  simplified_phrase: they will no longer share one purpose
  preserved_meaning: Their common purpose will cease after they are scattered.
  reasoning_layer_used: POB translation and clause context
  rationale: The active wording states the same idea more naturally.
