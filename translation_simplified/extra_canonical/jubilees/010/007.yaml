  text: Do not let them rule over the spirits of the living, for only you know their judgment. From now on and forever, do not let them have power over the descendants of the righteous.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: for you alone know their judgment
  simplified_phrase: for only you know their judgment
  preserved_meaning: The one addressed uniquely knows the spirits’ judgment without defining its precise nature.
  reasoning_layer_used: POB translation and grounding review
  rationale: Natural word order preserves the POB ambiguity and avoids adding the idea of desert.
- pob_phrase: the sons of the righteous
  simplified_phrase: the descendants of the righteous
  preserved_meaning: The descendants of righteous people are protected from the spirits’ power.
  reasoning_layer_used: POB source-driven rendering and grounding review
  rationale: Descendants avoids implying only males or young children.
- pob_phrase: from now and forevermore
  simplified_phrase: From now on and forever
  preserved_meaning: The prohibition begins immediately and continues without end.
  reasoning_layer_used: POB temporal wording
  rationale: The shorter expression states the same duration in common English.
