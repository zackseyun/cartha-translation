translation:
  language: en
  text: Then Mastema, the chief of the spirits, came and said, “Lord Creator, let some of them stay with me. Let them obey me and do everything I command. If some of them are not left to me, I will not be able to exercise my authority over humanity according to my will. These spirits bring corruption and lead people astray before my judgment, because human wickedness is great.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: let some of them remain before me
  simplified_phrase: let some of them stay with me
  preserved_meaning: Mastema asks to retain some spirits under his direction.
  reasoning_layer_used: POB translation and immediate context
  rationale: “Stay with me” states the relationship naturally without changing the request.
- pob_phrase: let them listen to my voice and do all that I tell them
  simplified_phrase: Let them obey me and do everything I command.
  preserved_meaning: The spirits must heed Mastema and follow all his orders.
  reasoning_layer_used: POB translation
  rationale: “Obey me” clearly conveys both listening and acting as commanded.
- pob_phrase: exercise the authority of my will over the sons of men
  simplified_phrase: exercise my authority over humanity according to my will
  preserved_meaning: Mastema claims authority over human beings that he exercises according to his will.
  reasoning_layer_used: POB translation and independent grounding review
  rationale: The wording preserves humanity as the object of authority while making the clause easier to follow.
interpretive_expansions:
- pob_phrase: these are for corruption and for leading astray
  rendering: These spirits bring corruption and lead people astray
  claim: The plural “these” refers to the spirits and describes their corrupting and misleading role.
  evidence:
  - The preceding plural pronouns refer to the spirits.
  - POB associates them with corruption and leading astray.
  confidence: high
translation_notes:
  risk_flags:
