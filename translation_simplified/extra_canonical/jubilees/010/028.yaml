  preserved_meaning: The fragment describes Canaan’s territory rather than the starting point of Ham’s journey.
  reasoning_layer_used: POB segmentation footnote and grounding review
  rationale: The implied context is supplied to prevent readers from attaching the fragment to Ham.
- pob_phrase: the land that was apportioned to him
