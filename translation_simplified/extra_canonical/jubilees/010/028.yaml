translation:
  language: en
  text: Canaan settled in territory extending from the land of Shinar.[28] Ham and his sons went into the land allotted to Ham, which he acquired.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '28'
    text: The description of Canaan’s territory is compressed and difficult. The phrase belongs to the account of Canaan’s settlement, not to Ham’s journey.
    reason: simplification_note
  - marker: a
    text: Or “which he had seized for himself.”
    reason: lexical_alternative
