    unchanged: false
    changes_summary: Clarified the measure phrase to 'one third of one cubit' for natural English and corrected 'twelve stades' to 'thirteen stades' to reflect the source numeral.
translation:
  language: en
  text: They spent forty-three years building it. It was 204 cubits wide, and each brick was one-third of a cubit high. Its height was 5,433 cubits and two palms, and twelve stades.[21]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '21'
    text: A cubit was based on forearm length, a palm on handbreadth, and a stade was a longer ancient unit. The Ethiopic measurements may be corrupt, so the exact dimensions—and how the final figure relates to the others—remain uncertain.
    reason: textual_variant
