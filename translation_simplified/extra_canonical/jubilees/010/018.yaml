  preserved_meaning: The date falls in year one of the jubilee’s second calendrical week.
  reasoning_layer_used: source chronology and immediate context
  rationale: The wording explains that “week” here measures years, not days.
- pob_phrase: Peleg took for himself a wife whose name was Lomna ... and she bore him a son
  simplified_phrase: Peleg married Lomna ... she bore him a son
  preserved_meaning: Peleg married Lomna, who later gave birth to his son.
  reasoning_layer_used: POB base text
  rationale: Common marriage language and two sentences make the sequence easier to follow.
- pob_phrase: through the counsel of wickedness to build for themselves
