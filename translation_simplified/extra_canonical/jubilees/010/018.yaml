translation:
  language: en
  text: In the thirty-third jubilee period,[a] during the first year of its second seven-year cycle, Peleg married Lomna, daughter of Shinar. In the fourth year of that cycle, she bore him a son. Peleg named him Reu because he said, “Look, people have become evil through their wicked plan to build themselves a city and a tower in the land of Shinar.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A jubilee period consists of seven seven-year cycles, or forty-nine years.
    reason: cultural_note
