translation:
  language: en
  text: Your grace toward me has been great, and you have shown great mercy in my life. May your grace increase toward my sons. Do not let wicked spirits rule over them, so that they do not wipe my sons from the earth.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: great is your mercy toward my life
  simplified_phrase: you have shown great mercy in my life
  preserved_meaning: God's great mercy concerns the speaker's life without specifying its particular form.
  reasoning_layer_used: POB translation and grounding review
  rationale: “In my life” is natural English while leaving the precise sense of the mercy open.
- pob_phrase: let your grace be magnified over my sons
  simplified_phrase: May your grace increase toward my sons
  preserved_meaning: The speaker asks for God's grace to become great toward his sons without comparing it to prior grace.
  reasoning_layer_used: applied lexical revision
  rationale: “Increase” clearly conveys magnification while avoiding an unsupported “even greater” comparison.
- pob_phrase: lest they destroy them from the earth
  simplified_phrase: so that they do not wipe my sons from the earth
  preserved_meaning: The sons' destruction is the feared result that the request seeks to prevent.
  reasoning_layer_used: POB translation and grounding review
  rationale: The purpose clause preserves the force of “lest,” while naming the sons removes pronoun ambiguity.
translation_notes:
  risk_flags:
  - risk: “In my life” may be heard as mercy experienced throughout life rather than mercy concerning life.
    mitigation: The wording intentionally preserves the POB's unresolved range instead of limiting the mercy to preservation.
  - risk: “Increase” is less directly tied to the repeated word “great” than “be magnified.”
    mitigation: It preserves the audited sense of becoming great in clearer common English.
