translation:
  language: en
  text: He offered it to make atonement for sin, for himself and for his descendants. As a sacrifice of well-being, he also offered seven rams, seven young goats, seven sheep, and seven male goats, together with the accompanying grain offerings and drink offerings. He burned all their fat on the altar as a choice offering to the Lord, with an aroma pleasing to him.
