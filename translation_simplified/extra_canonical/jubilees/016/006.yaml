    changes_summary: Replaced 'worked uncleanness' with 'did uncleanness' for more natural formal English while preserving the source sense; replaced 'have done according to' with 'have acted according to' for smoother style and consistency with the verbal idea.
translation:
  language: en
  text: They defiled themselves and used their bodies for sexual immorality. They also committed impure acts on the earth. Therefore, the Lord will judge the places where they have practiced the same uncleanness as Sodom, just as he judged Sodom.
  philosophy: optimal-equivalence
