  rationale: This replaces an old term while preserving the bodily force of “in their flesh.”
- pob_phrase: did uncleanness on the earth
  simplified_phrase: committed impure acts on the earth
  preserved_meaning: They actively practiced moral impurity on earth.
  reasoning_layer_used: POB translation and applied revision
  rationale: “Impure acts” expresses the action naturally without weakening “uncleanness.”
- pob_phrase: the places where they have acted according to the uncleanness of Sodom
