translation:
  language: en
  text: This law will last forever, for every generation, and they must observe it year after year. It will never come to an end, because it is established forever for Israel. They must celebrate it, live in temporary shelters, wear crowns on their heads, and take leafy branches and willows.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “willows from the brook.”
    reason: lexical_alternative
