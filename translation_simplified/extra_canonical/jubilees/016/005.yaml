  simplified_phrase: brought judgment on
  preserved_meaning: The Lord actively judged the named cities and region.
  reasoning_layer_used: POB translation and revision rationale
  rationale: The common expression keeps judgment directed against those places.
- pob_phrase: he burned them with fire and sulfur
  simplified_phrase: He burned those places with fire and sulfur
  preserved_meaning: The named cities and region were consumed by divine fire and sulfur.
  reasoning_layer_used: POB text and source payload
  rationale: “Those places” clarifies the pronoun without weakening the destruction image.
- pob_phrase: destroyed them to this day
  simplified_phrase: they remain destroyed to this day
  preserved_meaning: Their destruction continued to be evident in the narrator’s time.
  reasoning_layer_used: POB controlling text
  rationale: The wording expresses continuing destruction in natural English.
