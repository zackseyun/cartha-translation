translation:
  language: en
  text: She conceived a son. During that month, the Lord brought judgment on Sodom, Gomorrah, Admah,[a] and the whole region of the Jordan. He burned those places with fire and sulfur, and they remain destroyed to this day, just as I have now told you about all their deeds—that they were utterly wicked and sinful.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The source may instead read “Dom”; the place name is uncertain.
    reason: textual_variant
