translation:
  language: en
  text: At this feast, he became the first person on earth to celebrate the Feast of Booths.[a] On each of those seven days, he offered to the Lord on the altar two oxen, two rams, seven sheep, and one male goat as a sin offering.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Booths were temporary shelters.
