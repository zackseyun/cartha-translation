    text: Or 'And Isaac would become a holy seed'.
    reason: previous_rendering
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T14:50:11Z'
    unchanged: false
    changes_summary: Replaced vague 'that one' with 'Isaac' to reflect the explicit subject in the source. Kept the rest substantially unchanged as accurate and formal.
translation:
  language: en
  text: Only Isaac would become a holy line. He would not be counted among the nations, for he would be the Most High’s allotted portion. All Isaac’s descendants had been assigned to God so that, from among all peoples, they would become the Lord’s own people and a kingdom.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Isaac alone would become a holy seed
  simplified_phrase: Only Isaac would become a holy line
  preserved_meaning: Isaac uniquely represents the holy family line rather than Abraham’s other children.
  reasoning_layer_used: POB text and source-driven exclusivity revision
  rationale: “Only” preserves the exclusive force, while “line” makes collective “seed” clear without adding definiteness.
- pob_phrase: he would become the portion of the Most High
  simplified_phrase: he would be the Most High’s allotted portion
  preserved_meaning: Isaac is uniquely allotted to the Most High.
  reasoning_layer_used: POB text and allotment image
  rationale: The wording removes the unclear pronoun while directly preserving the allotment image.
- pob_phrase: all his seed had fallen to the lot of God, that it should become for the Lord a people for possession out of all peoples
  simplified_phrase: All Isaac’s descendants had been assigned to God so that, from among all peoples, they would become the Lord’s own people
  preserved_meaning: Isaac’s descendants were allotted to God as his possessed people from among all peoples.
  reasoning_layer_used: POB text and immediate context
  rationale: “Descendants” and “the Lord’s own people” express the collective line and divine possession in natural English.
translation_notes:
  risk_flags:
  - risk: “Holy line” explains collective “seed” but does not retain the seed metaphor.
    mitigation: It preserves the verse’s movement from Isaac to all his descendants without implying a uniquely titled “the holy seed.”
  - risk: The shift from singular Isaac to plural descendants could blur the collective movement.
    mitigation: The text explicitly names Isaac’s descendants before changing to the plural pronoun.
