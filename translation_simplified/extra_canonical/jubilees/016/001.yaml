    text: Or 'And we announced to Abraham that Sarah had conceived,'.
    reason: previous_rendering
  - marker: b
    text: Or 'and had seen Isaac, and that in Isaac a name and seed would be named for him.'.
    reason: previous_rendering
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T14:50:09Z'
    unchanged: false
    changes_summary: Moved 'in the seventh month' to modify the return to Sarah rather than Sarah's conception, for better alignment with the source order and sense. Otherwise retained the draft's wording.
translation:
  language: en
  text: 'Sarah conceived a son. In the seventh month, we returned to her and found that she was pregnant. We blessed Abraham and told him everything that had been commanded concerning him: he would not die until he had fathered six sons and seen them all. Through Isaac, Abraham’s name and family line would continue.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: we returned to Sarah in the seventh month and found that she had conceived before us
  simplified_phrase: In the seventh month, we returned to her and found that she was pregnant
  preserved_meaning: The seventh month marks the return, when Sarah was found to have conceived.
  reasoning_layer_used: source order and applied revision
  rationale: The clause uses natural English while keeping the timing attached to the return.
- pob_phrase: he would not die until he had begotten six sons and would see them before he died
  simplified_phrase: he would not die until he had fathered six sons and seen them all
  preserved_meaning: Abraham would live long enough to father all six sons and see them.
  reasoning_layer_used: source review and POB revision
  rationale: “Fathered” replaces “begotten,” while “them all” preserves the corrected object.
- pob_phrase: in Isaac a name and seed would be called for him
  simplified_phrase: Through Isaac, Abraham’s name and family line would continue
  preserved_meaning: Isaac would carry forward both Abraham’s name and his line of descendants.
  reasoning_layer_used: POB rendering and immediate context
  rationale: The biblical idiom is made plain without merging its two distinct elements.
interpretive_expansions:
- pob_phrase: She ... him
  rendering: Sarah ... Abraham
  claim: The female and male pronouns refer to Sarah and Abraham.
  evidence:
  - Sarah is named in the return clause, and Isaac is identified as the line continuing for the man who is blessed.
  confidence: high
- pob_phrase: a name and seed would be called for him
  rendering: Abraham’s name and family line would continue
  claim: The calling of name and seed means that Abraham’s name and line of descent continue through Isaac.
  evidence:
  - The clause connects Isaac with both the man’s name and his seed.
  confidence: moderate
  alternatives_preserved:
  - A more literal rendering is “a name and offspring would be called for him through Isaac.”
translation_notes:
  risk_flags:
  - risk: The unclear phrase “before us” is not represented separately in the simplified text.
    mitigation: The text preserves the clear point that the visitors found Sarah pregnant when they returned.
  - risk: “Would continue” explains the final idiom more directly than the POB wording.
    mitigation: The text retains both Abraham’s name and his family line and ties them to Isaac.
