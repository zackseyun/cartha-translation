translation:
  language: en
  text: We blessed him and told him everything that had been determined about him. He would not die until he had fathered six more sons and had seen them.[a] But it was through Isaac that his descendants would be identified by his name.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “had seen Isaac’s sons.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: everything that had been decreed concerning him
  simplified_phrase: everything that had been determined about him
  preserved_meaning: The events concerning him had already been decided.
  reasoning_layer_used: POB controlling text
  rationale: Common wording replaces the formal construction without weakening its force.
- pob_phrase: begotten six more sons and seen them before he died
  simplified_phrase: fathered six more sons and had seen them
  preserved_meaning: He would live long enough to father and see six additional sons, while the footnote retains the inherited alternative.
  reasoning_layer_used: POB text, footnote, and applied source-grounded revision
  rationale: “Fathered” is clearer than “begotten,” and the alternative antecedent remains documented.
- pob_phrase: in Isaac his name and seed would be called
  simplified_phrase: through Isaac his descendants would be identified by his name
  preserved_meaning: The descendants bearing Abraham’s recognized name would be reckoned through Isaac.
  reasoning_layer_used: POB controlling text and grounding review
  rationale: The wording preserves identification through Isaac rather than suggesting mere family continuation.
interpretive_expansions:
- pob_phrase: in Isaac his name and seed would be called
  rendering: through Isaac his descendants would be identified by his name
  claim: The clause identifies Isaac as the line through whom Abraham’s named descendants are reckoned.
  evidence:
  - The POB links Abraham’s name and seed specifically with Isaac.
  - The contrast follows the promise of six additional sons.
  confidence: moderate
  alternatives_preserved:
  - his descendants would be named through Isaac
  - his offspring would be reckoned through Isaac
translation_notes:
  risk_flags:
  - risk: The pronoun “them” naturally points to the six additional sons, but the POB preserves another interpretation.
    mitigation: Footnote [a] retains “Isaac’s sons” as an alternative.
  - risk: “Identified by his name” explains the compact expression “would be called.”
    mitigation: The wording retains both naming and descent through Isaac without reducing the clause to mere continuation.
