    mitigation: The wording preserves the cross-verse connection rather than inventing an antecedent.
  - risk: Replacing “seed” with “descendants” reduces the concrete reproductive image.
    mitigation: The genealogical scope is retained, while “uproot” preserves the verse's forceful image.
