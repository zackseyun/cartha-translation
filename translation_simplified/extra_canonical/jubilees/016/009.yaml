    changes_summary: 'Changed ''written'' to ''decreed'' for better lexical fit with the paired verb, shifted ''he should'' to ''they should'' to match the plural agents implied by the verbs, and revised the final clause to a more natural passive rendering: ''that no seed of his should be left on the earth.'''
translation:
  language: en
  text: 'This was the case from the days of Adam until that time, because a man had sexual relations with his daughters. The heavenly tablets contained this command and decree concerning all his descendants: God would remove them and uproot them. Their judgment would be carried out like the judgment of Sodom, and on the day of condemnation God would leave none of his descendants on the earth.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: a man lay with his daughters
  simplified_phrase: a man had sexual relations with his daughters
  preserved_meaning: The wording clearly states the prohibited sexual act without changing its meaning.
  reasoning_layer_used: POB main text
  rationale: The common expression avoids the potentially misleading sense of merely lying beside someone.
- pob_phrase: concerning all his seed
  simplified_phrase: concerning all his descendants
  preserved_meaning: The decree applies to the man's entire line of offspring.
  reasoning_layer_used: POB main text
  rationale: Descendants gives modern readers the intended genealogical sense of seed.
- pob_phrase: that he should remove them and uproot them
  simplified_phrase: God would remove them and uproot them
  preserved_meaning: God will eliminate the descendants while the force of the uprooting image remains.
  reasoning_layer_used: applied revision and source review
  rationale: The singular verbs refer to God, and retaining uproot preserves the source image.
interpretive_expansions:
- pob_phrase: he should remove them ... he should leave no seed of his
  rendering: God would remove them ... God would leave none of his descendants
  claim: The singular agent of both actions is God.
  evidence:
  - The source review identifies the Ge'ez verbs as third-person masculine singular referring to God.
  - The final applied revision restores singular active agency.
  confidence: high
  alternatives_preserved:
  - An earlier rendering treated the agents as plural.
translation_notes:
  risk_flags:
