    text: Or 'And Esau said to them, "I sold'.
    reason: previous_rendering
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T14:52:11Z'
    unchanged: false
    changes_summary: Removed redundant 'firstborn birthright' to 'birthright'; supplied the explicit subject 'Jacob' in the second sentence for clarity and completeness; adjusted 'that he might' to 'so that he might'; kept the formal sense of subordination in 'set me under his hand'; and restored the final clause about the father making them swear not to seek evil against one another, which was omitted from the draft.
translation:
  language: en
  text: “Jacob is younger, yet your father gave him the birthright and rejected you.” Esau answered them, “That is because I sold my birthright to Jacob for a small bowl of lentil stew. Later, my father sent me to hunt and bring back game for him to eat, so that he could bless me. But Jacob used deception. He brought my father food and drink, and my father blessed him instead. He placed me under Jacob’s authority. Now our father has made both Jacob and me swear that neither of us will try to harm the other.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: to Jacob your father gave the birthright, and you he abandoned
  simplified_phrase: your father gave him the birthright and rejected you
  preserved_meaning: The father favored Jacob with the birthright while casting Esau aside.
  reasoning_layer_used: applied revision and POB base text
  rationale: Natural clause order makes the contrast immediately clear.
- pob_phrase: Jacob came by craftiness
  simplified_phrase: Jacob used deception
  preserved_meaning: Jacob obtained the blessing through deceptive action.
  reasoning_layer_used: POB base text and narrative context
  rationale: The direct wording preserves the negative force of craftiness.
- pob_phrase: set me under his hand
  simplified_phrase: placed me under Jacob’s authority
  preserved_meaning: The blessing made Esau subordinate to Jacob.
  reasoning_layer_used: latest revision rationale
  rationale: The plain wording explains the source image’s formal sense of subordination.
interpretive_expansions:
- pob_phrase: my father blessed him
  rendering: my father blessed him instead
  claim: Jacob received the blessing Esau had expected to receive.
  evidence:
  - The preceding purpose clause says Esau hunted so that his father could bless him.
  - The POB says Jacob brought the meal and was blessed.
  confidence: high
- pob_phrase: we will not seek evil, each against his brother
  rendering: neither of us will try to harm the other
  claim: Seeking evil means intending or attempting harm against one another.
  evidence:
  - The reciprocal phrase limits the evil to action directed by each brother against the other.
  confidence: high
