translation:
  language: en
  text: 'During all this, Jacob did not know that Esau and his men were coming to kill him. Jacob was still mourning the death of his wife Leah when they approached the tower with four thousand warriors and handpicked fighters.[a] They sent respected men ahead to tell him, “Look, your brother is coming to fight you. He has four hundred men with swords at their sides, carrying shields and weapons of war.” These men loved Jacob more than Esau, and they told him that Jacob was more gracious and merciful than Esau.


    Jacob became alarmed as they drew near the tower. He shut its gates, stood on the defensive wall, and called out to his brother Esau, “What fine comfort you have brought me while I mourn my wife’s death! Is this how you keep the oath you swore to your father and mother? Even before they have died, you have broken it again. You stood condemned from the moment you swore that oath to your father.”


    Esau answered him, “There is no righteous oath among human beings or the beasts of the earth. Whatever they swear, they still plot evil against one another so that each can kill his enemy and foe. You have always hated me and my children, so there can be no brotherly bond between us.


    “Listen to what I tell you. If a wild boar can change its skin and its bristles can become soft like wool, or if horns like those of a deer or sheep can grow on its head, then I will treat you as a brother. If breasts separated from their mother can return and nurse again, then I will be reconciled to you as a brother. If wolves make peace with lambs and stop devouring and oppressing them, and if their hearts become kind toward them, then my heart will be at peace with you. If a lion becomes an ox’s friend, is harnessed beside it under one yoke, plows with it, and lives at peace with it, then I will make peace with you. When a raven becomes white like the raza-bird,[b] then I will know that I love you and will make peace with you. May you and your sons be destroyed! May you never have peace!”


    Jacob saw that Esau’s heart was set on evil against him and that Esau intended with all his being to kill him. Esau came raging like a wild boar that charges the spear piercing and killing it yet refuses to turn back. So Jacob ordered his own people and his servants to attack Esau and everyone with him.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ge’ez first says “four thousand,” but the warning that follows says “four hundred”; the difference is preserved.
    reason: textual_variant
  - marker: b
    text: “Raza-bird” represents an uncertain Ge’ez bird name, apparently referring to a notably white bird.
    reason: lexical_alternative
