translation:
  language: en
  text: One thousand chosen men hired from Moab and the Ammonites came to them. One thousand chosen men fit for war came from Philistia. One thousand chosen men trained for battle came from Edom and the Horites. Strong men fit for war also came from the Kittim.
  philosophy: optimal-equivalence
