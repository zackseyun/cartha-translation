translation:
  language: en
  text: 'Then Judah said to his father Jacob, “Father, draw your bow and shoot your arrows. Strike down the enemy and kill our adversary. Be strong, because we will not kill your brother. He is our relative, so we will show him honor.”


    Jacob drew his bow and shot an arrow. It struck his brother Esau in the right side of his chest and killed him. Jacob shot another arrow. It struck Adoran the Aramean in the left side of his chest, drove him backward, and killed him.


    Then Jacob’s sons and their slaves came out from all four sides of the tower. Judah went out first from the south side, together with Naphtali, Gad, and fifty slaves. They killed everyone they encountered, and no one escaped.


    Levi, Dan, and Asher went out from the east side with fifty men. They killed the warriors of Moab and Ammon.


    Reuben, Issachar, and Zebulun went out from the north side with fifty men. They killed the fighters from Philistia.


    Simeon, Benjamin, and Enoch son of Reuben went out from the west side with fifty men. They killed four hundred strong and battle-hardened men from Edom and the Horites. Six hundred fled, and four of Esau’s sons fled with them. They left their father dead where he had fallen on the hill in Adurim.


    Jacob’s sons pursued them as far as Mount Seir. But Jacob buried his brother on the hill in Adurim. Then Jacob returned home, where they comforted him.'
  philosophy: optimal-equivalence
