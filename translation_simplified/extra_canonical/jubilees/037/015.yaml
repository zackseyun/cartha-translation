  preserved_meaning: The arrow strikes Adoran, forces him backward, and kills him.
  reasoning_layer_used: POB source-driven action sequence
  rationale: Ordinary wording clarifies the sequence without weakening the arrow’s physical force.
- pob_phrase: they killed of Edom and of the Horites four hundred strong and warlike men
  simplified_phrase: They killed four hundred strong and battle-hardened men from Edom and the Horites.
  preserved_meaning: Four hundred capable warriors from the Edomite and Horite forces are killed.
  reasoning_layer_used: POB syntax and participant structure
  rationale: Reordered syntax makes the number, description, and group identity immediately clear.
