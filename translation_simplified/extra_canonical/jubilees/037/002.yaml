  rationale: The added apposition explains the biblical term without reducing it to inheritance alone.
- pob_phrase: they were exceedingly angry. And they contended with their father
  simplified_phrase: They became extremely angry and argued with their father
  preserved_meaning: Their intense anger led them to challenge their father.
  reasoning_layer_used: POB translation
  rationale: Common verbs replace formal wording while keeping the force and sequence.
- pob_phrase: while you are the elder, and leave you aside
  simplified_phrase: you are older? Why did he pass you over?
  preserved_meaning: Esau was older than Jacob, yet Isaac denied him the firstborn rights.
  reasoning_layer_used: applied mistranslation revision
  rationale: Two direct questions make the contrast and exclusion easier to follow.
