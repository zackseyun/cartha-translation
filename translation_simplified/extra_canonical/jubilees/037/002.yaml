translation:
  language: en
  text: 'Isaac had given Jacob, his younger son, the rights of the firstborn son. They became extremely angry and argued with their father: “Why did Isaac give the birthright to Jacob, even though Jacob is younger and you are older? Why did he pass you over?”'
  philosophy: optimal-equivalence
