    changes_summary: Changed 'the Egyptian' to 'an Egyptian' for more natural English while preserving the sense of the source.
translation:
  language: en
  text: After Joseph was taken away, Jacob’s sons married. Reuben’s wife was named Ada. Simeon’s wife was Adiba, a Canaanite. Levi’s wife was Melka, a woman from Aram and a descendant of Terah’s sons. Judah’s wife was Bethasu’el, a Canaanite. Issachar’s wife was Hezaqa, and Zebulun’s wife was Ni’aman. Dan’s wife was Egla. Naphtali’s wife was Rasu’a, from Mesopotamia. Gad’s wife was Maka, and Asher’s wife was Ijona. Joseph’s wife was Asenath, an Egyptian. Benjamin’s wife was Iyasaka.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the sons of Jacob took wives
  simplified_phrase: Jacob’s sons married
  preserved_meaning: The sons entered into marriage with the women subsequently named.
  reasoning_layer_used: POB translation
  rationale: Common English expresses taking wives as marrying.
- pob_phrase: The name of Reuben’s wife was Ada, and the name of Simeon’s wife was Adiba
  simplified_phrase: Reuben’s wife was named Ada. Simeon’s wife was Adiba
  preserved_meaning: Each wife remains associated with the same son and name.
  reasoning_layer_used: POB translation
  rationale: Short sentences make the long list easier to follow.
- pob_phrase: from the daughters of Aram, from the seed of the sons of Terah
  simplified_phrase: a woman from Aram and a descendant of Terah’s sons
  preserved_meaning: Melka is connected with Aram and descended from Terah’s sons.
  reasoning_layer_used: POB translation and independent grounding review
  rationale: This avoids implying that Melka was Aram’s literal daughter while retaining both relationships.
