  text: Shechem[11], and he found them in the land of Dothan. And they dealt treacherously with him and made a plan against him to kill him; but changing their minds, they sold him to Ishmaelite merchants, and they brought him down to Egypt and sold him to Potiphar, an officer of Pharaoh, the chief of the guards, priest of the city of Heliopolis.
  footnotes:
  - marker: '11'
    text: The title rendered 'chief of the cooks' is difficult and has been rendered differently by interpreters. The translation follows the immediate Ethiopic sense rather than the more familiar Genesis wording.
    reason: lexical_alternative
  - marker: a
    text: Or 'hated him'.
    reason: previous_rendering
  - marker: b
    text: Or 'the chief of the cooks'.
    reason: previous_rendering
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T14:52:00Z'
    unchanged: false
    changes_summary: Changed 'dealt treacherously with him' to 'hated him' for better lexical accuracy with the source verb, while retaining the rest of the verse unchanged.
translation:
  language: en
  text: He came to Shechem and then found them in the land of Dothan. They acted deceitfully toward him and planned to kill him. But they changed their minds and sold him to Ishmaelite merchants. The merchants took him down to Egypt and sold him to Potiphar, an official of Pharaoh who was commander of the guards[a] and priest of the city of Heliopolis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ethiopic title is difficult. It is sometimes translated “chief of the cooks,” but here it is rendered “commander of the guards.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: dealt treacherously with him and made a plan against him to kill him
  simplified_phrase: acted deceitfully toward him and planned to kill him
  preserved_meaning: They betrayed Joseph through deceit and formed a plan to murder him.
  reasoning_layer_used: applied revision and source review
  rationale: “Acted deceitfully” makes the source-driven sense of treachery easier to understand without reducing it to hatred.
- pob_phrase: but changing their minds, they sold him to Ishmaelite merchants
  simplified_phrase: But they changed their minds and sold him to Ishmaelite merchants.
  preserved_meaning: They abandoned their plan to kill Joseph and instead sold him.
  reasoning_layer_used: POB translation
  rationale: A separate sentence makes the change of plan and resulting sale immediately clear.
- pob_phrase: an officer of Pharaoh, the chief of the guards, priest of the city of Heliopolis
  simplified_phrase: an official of Pharaoh who was commander of the guards and priest of the city of Heliopolis
  preserved_meaning: Potiphar served Pharaoh as guard commander and also held a priestly office in Heliopolis.
  reasoning_layer_used: applied mistranslation correction
  rationale: “Commander” is natural English while preserving the reviewed title “chief of the guards.”
translation_notes:
  risk_flags:
  - risk: The supplied POB begins with the fragment “Shechem,” apparently continuing the previous context.
    mitigation: “He came to Shechem” supplies only the minimal verb needed for a readable standalone sentence.
  - risk: Potiphar’s Ethiopic title has been translated in more than one way.
    mitigation: The main text follows the reviewed reading “commander of the guards,” while the footnote preserves the alternative.
