base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/jubilees/034/018.yaml
  text: Therefore it was ordained for the sons of Israel that they should afflict themselves on the tenth of the seventh month[a], on the day when the news about Joseph reached Jacob his father, and that they should make atonement for themselves on it with a young goat on the tenth of the seventh month, once each year, because of their sins; for they had grieved the affection of their father for Joseph his son.
  footnotes:
  - marker: a
    text: The chapter links the annual self-affliction on the tenth of the seventh month with Joseph's bloodied garment and Jacob's mourning, functioning as an etiology for the observance of the Day of Atonement (Yom Kippur).
    reason: cross_reference
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T14:52:00Z'
    unchanged: false
    changes_summary: Removed 'had died' because the source says only that news about Joseph reached Jacob, not specifically news of his death. Changed 'compassion' to 'affection' for a more natural rendering of the father's feeling toward his son.
translation:
  language: en
  text: Therefore the Israelites were commanded to deny themselves on the tenth day of the seventh month—the day when news about Joseph reached his father Jacob. On that day each year, they were to make atonement for their sins with a young goat, because they had caused their father grief over Joseph, his son.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This chapter presents the observance on this date as an origin explanation for the Day of Atonement, in connection with Joseph’s bloodied garment and Jacob’s mourning.
    reason: cross_reference
simplification_decisions:
- pob_phrase: it was ordained for the sons of Israel
  simplified_phrase: the Israelites were commanded
  preserved_meaning: The observance was established as a binding command for Israel.
  reasoning_layer_used: POB translation
  rationale: Common wording replaces the formal passive phrase without weakening its authority.
- pob_phrase: afflict themselves
  simplified_phrase: deny themselves
  preserved_meaning: They were to practice solemn ritual self-denial.
  reasoning_layer_used: POB text and ritual context
  rationale: This communicates prescribed self-denial without suggesting physical injury or merely an inward attitude.
- pob_phrase: make atonement for themselves on it with a young goat
  simplified_phrase: on that day each year, they were to make atonement for their sins with a young goat
  preserved_meaning: A young goat was the stated means in the annual atonement rite for their sins.
  reasoning_layer_used: POB lexical decision and immediate context
  rationale: The reordered clause is easier to follow and does not specify how the goat was handled.
translation_notes:
  risk_flags:
  - risk: “Deny themselves” may not convey every practice included in ritual self-affliction.
    mitigation: The annual atonement setting preserves its solemn ritual sense.
  - risk: The nature of the news about Joseph could be over-specified.
    mitigation: The text retains “news about Joseph” without claiming that Jacob heard Joseph had died.
