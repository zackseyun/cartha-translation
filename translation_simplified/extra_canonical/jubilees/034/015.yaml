translation:
  language: en
  text: That same day, Bilhah heard that Joseph had died. While she was mourning for him, she died in Qafratef.[15] Dinah, Jacob’s daughter, also died after Joseph’s death.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '15'
    text: The pronunciation of the place name “Qafratef” is uncertain, and the name may have been corrupted as the Ethiopic text was copied.
    reason: textual_variant
