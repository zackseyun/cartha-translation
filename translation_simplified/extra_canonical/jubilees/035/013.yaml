    changes_summary: Adjusted 'very evil' to 'more evil' to reflect the comparative sense of አብዝኀ, and changed the final phrase from 'around him' to 'in him' for lexical accuracy and consistency with the earlier clause.
translation:
  language: en
  text: Isaac said to her, “I too know how Jacob treats us. I see that he honors us with all his heart. At first I loved Esau more than Jacob because Esau was born first. But now I love Jacob more than Esau, because Esau has made his deeds very evil. There is no righteousness in him. All his ways are unjust and violent; there is no righteousness at all in or around him.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Jacob’s conduct toward us
  simplified_phrase: how Jacob treats us
  preserved_meaning: Isaac knows Jacob’s pattern of behavior toward his parents.
  reasoning_layer_used: POB translation and immediate context
  rationale: The ordinary verb “treats” makes the relational meaning clear.
- pob_phrase: I loved Esau before Jacob from the time he was born first
  simplified_phrase: At first I loved Esau more than Jacob because Esau was born first
  preserved_meaning: Isaac’s earlier preference for Esau was connected to Esau’s status as firstborn.
  reasoning_layer_used: POB translation and source clause order
  rationale: The reordered sentence directly connects Isaac’s earlier preference with Esau’s birth order.
- pob_phrase: all his ways are injustice and violence, and there is no righteousness around him
  simplified_phrase: All his ways are unjust and violent; there is no righteousness at all in or around him
  preserved_meaning: Esau’s entire way of life is marked by injustice and violence, with righteousness wholly absent.
  reasoning_layer_used: POB translation, source wording, and grounding review
  rationale: The wording keeps the image of his “ways” and “around him” while preventing a merely spatial reading.
interpretive_expansions:
- pob_phrase: because he has made his deeds very evil
  rendering: because Esau has made his deeds very evil
  claim: The pronoun refers to Esau.
  evidence:
