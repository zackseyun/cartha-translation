  simplified_phrase: do what is right and live uprightly
  preserved_meaning: The two related ideas of righteous action and upright conduct remain distinct.
  reasoning_layer_used: POB translation and applied revision
  rationale: Concrete verbal wording makes both moral duties easier to understand.
- pob_phrase: bring upon you all that Yahweh said he would do
  simplified_phrase: bring about for you everything he said he would do
  preserved_meaning: Yahweh may fulfill for the sons all that he declared concerning Abraham.
  reasoning_layer_used: POB controlling text
  rationale: The revised wording removes an awkward idiom without changing the stated outcome.
- pob_phrase: his seed
  simplified_phrase: his descendants
  preserved_meaning: Abraham's offspring as a continuing family line are in view.
  reasoning_layer_used: POB controlling text
  rationale: Descendants gives the ordinary modern meaning of the biblical family-line term.
