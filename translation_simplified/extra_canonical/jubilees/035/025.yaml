translation:
  language: en
  text: In the sixth year of this week,[a] Isaac called his two sons, Esau and Jacob, and they came to him. He said, “My sons, I am about to follow the path of my ancestors. I am going to the eternal home where they are.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “that week.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: I am going on the way of my fathers
  simplified_phrase: I am about to follow the path of my ancestors
  preserved_meaning: Isaac describes his approaching death as traveling the same path as those before him.
  reasoning_layer_used: POB text and source-driven chronological context
  rationale: The concrete path image is retained while “ancestors” makes the familial meaning clear.
- pob_phrase: to the eternal house where my fathers are
  simplified_phrase: I am going to the eternal home where they are
  preserved_meaning: Isaac expects to join his ancestors in their lasting dwelling after death.
  reasoning_layer_used: POB text
  rationale: “Home” is more natural than “house” here without weakening the eternal dwelling image.
translation_notes:
  risk_flags:
  - risk: Modern readers may not recognize the journey language as a reference to approaching death.
    mitigation: The parallel statement about joining his ancestors in the eternal home preserves the intended sense.
