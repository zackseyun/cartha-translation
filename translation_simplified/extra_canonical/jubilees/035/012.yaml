  simplified_phrase: He resents you
  preserved_meaning: He feels hostility toward the person addressed because Jacob was blessed.
  reasoning_layer_used: POB translation
  rationale: The common verb “resents” makes the relational sense of “bitter against” immediately clear.
- pob_phrase: he has not deprived us of anything
  simplified_phrase: he has never withheld anything from us
  preserved_meaning: Jacob has consistently provided without denying them anything.
  reasoning_layer_used: POB translation and applied revision
  rationale: “Withheld” expresses the same idea in more natural modern English.
- pob_phrase: he dwells with us continually in the house while honoring us
  simplified_phrase: He always lives in our household and treats us with honor
  preserved_meaning: Jacob remains in their shared household and continually honors them.
  reasoning_layer_used: POB translation
  rationale: The rewrite replaces formal phrasing with ordinary household language while retaining both residence and honor.
