translation:
  language: en
  text: He and his children have followed their wives into uncleanness and error. Yet you ask me to make him swear that he will not kill his brother Jacob. Even if he swears, he will not keep his oath. He will do nothing but evil. If he wants to kill his brother Jacob, he will be handed over to Jacob. He will not escape Jacob’s hand, because he will fall into his hand.
