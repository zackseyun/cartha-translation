simplification_decisions:
- pob_phrase: And love one another, my sons, among yourselves
  simplified_phrase: My sons, love one another.
  preserved_meaning: The father directly commands his sons to love one another.
  reasoning_layer_used: POB base text
  rationale: The direct address comes first, while the reciprocal command makes “among yourselves” unnecessary.
- pob_phrase: each loving his brother as a man loves his own life
  simplified_phrase: Each of you should love his brother as he loves his own life
  preserved_meaning: Each son must love his brother as he loves his own life.
  reasoning_layer_used: POB base text
  rationale: The participial phrase becomes a direct command while preserving the comparison.
- pob_phrase: and let a man seek—
  simplified_phrase: and each person should seek—
  preserved_meaning: The person is the subject who must seek, while the object follows in verse 29.
  reasoning_layer_used: source-grounded applied revision
  rationale: “Each person” clearly expresses the generic subject and retains the unfinished clause.
