translation:
  language: en
  text: 'Then she called Jacob into Esau’s presence and instructed him to act in keeping with what she had said to Esau. Jacob said, “I will do as you wish. Trust me: neither I nor my children will do any harm to Esau. I will not be first in anything except in love.”'
