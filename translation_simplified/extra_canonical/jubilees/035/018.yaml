translation:
  language: en
  text: None of you should seek to harm his brother. Instead, love one another, so that you may prosper, my sons, and be honored throughout the land. Then no enemy will celebrate your downfall, and you will be a blessing and a mercy in the sight of all who love you.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: neither will seek evil against his brother, but only love
  simplified_phrase: None of you should seek to harm his brother. Instead, love one another
  preserved_meaning: Each brother must reject harmful intent and actively love the others.
  reasoning_layer_used: POB translation and immediate contrast
  rationale: The wording addresses the whole group and separates the two commands clearly.
- pob_phrase: be honored in the midst of the land
  simplified_phrase: be honored throughout the land
  preserved_meaning: They will receive public honor across the land.
  reasoning_layer_used: POB translation
  rationale: “Throughout” communicates the broad public setting more naturally.
- pob_phrase: no enemy may rejoice over you
  simplified_phrase: no enemy will celebrate your downfall
  preserved_meaning: Their enemies will have no occasion to rejoice when harm comes upon them.
  reasoning_layer_used: POB translation and contextual idiom
  rationale: The wording makes the hostile sense of rejoicing over them clear.
interpretive_expansions:
- pob_phrase: no enemy may rejoice over you
  rendering: no enemy will celebrate your downfall
  claim: The enemy's rejoicing would be prompted by the sons' defeat or misfortune.
  evidence:
