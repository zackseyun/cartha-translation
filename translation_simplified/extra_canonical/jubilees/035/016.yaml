translation:
  language: en
  text: “And you, do not worry about Jacob. Jacob’s guardian is great, mighty, and honored, and is praised more than Esau’s guardian.” Then Rebekah sent for Esau. When he came to her, she said, “My son, I have one request for you. Promise me that you will do it, my son.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: do not fear for Jacob
  simplified_phrase: do not worry about Jacob
  preserved_meaning: The hearer should not be concerned for Jacob’s welfare.
  reasoning_layer_used: POB translation and grounding review
  rationale: “Do not worry” expresses the intended concern naturally without adding a specific danger.
- pob_phrase: honored, and more praised than Esau’s guardian
  simplified_phrase: honored, and is praised more than Esau’s guardian
  preserved_meaning: Jacob’s guardian is honored and praised more than Esau’s guardian.
  reasoning_layer_used: applied source-grounded revision
  rationale: The passive comparison is idiomatic while preserving the corrected meaning “praised,” not “powerful.”
- pob_phrase: I ask one request from you; say that you will do it
  simplified_phrase: I have one request for you. Promise me that you will do it
  preserved_meaning: Rebekah asks Esau to commit himself to fulfilling her request.
  reasoning_layer_used: POB translation and immediate context
  rationale: Two direct sentences clearly express both the request and the assurance she seeks.
interpretive_expansions:
- pob_phrase: say that you will do it
  rendering: Promise me that you will do it
  claim: Rebekah asks Esau for a commitment, not merely a spoken prediction.
  evidence:
  - The immediate context presents her words as a request for Esau’s assurance.
  confidence: high
  alternatives_preserved:
  - Tell me that you will do it
translation_notes:
  risk_flags:
  - risk: “Guardian” may refer to more than one kind of protector.
    mitigation: The ambiguous term is retained without identifying the guardian.
  - risk: “Promise” makes the requested commitment more explicit than the POB wording.
    mitigation: The immediate context supports this sense, while the audit records the more literal alternative.
