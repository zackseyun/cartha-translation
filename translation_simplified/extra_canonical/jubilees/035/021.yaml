translation:
  language: en
  text: I personally ask you to speak seriously to Jacob about me and my children.[a] I know that he will certainly rule over us, because when my father blessed him, he raised Jacob above me and put me below him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “to admonish Jacob on my behalf and on behalf of my children.”
    reason: lexical_alternative
