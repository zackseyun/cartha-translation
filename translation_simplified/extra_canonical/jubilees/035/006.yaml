translation:
  language: en
  text: 'She said to him, “My son, throughout my life I have never seen you do anything crooked, but only what is right. Still, I must tell you the truth: I will die this year and will not live beyond it. In a dream I saw the day of my death and learned that I would not live past the age of 155.”'
