translation:
  language: en
  text: Do not eat meat with its blood still in it. Make sure no one eats blood in your presence. Cover the blood with earth, for I was commanded to testify about this to you, your children, and all flesh.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: do not be like one who eats with the blood
  simplified_phrase: Do not eat meat with its blood still in it
  preserved_meaning: The prohibition remains against eating an animal's flesh together with its blood.
  reasoning_layer_used: POB text and immediate context
  rationale: The direct command removes the awkward comparison and makes the implied meat explicit.
- pob_phrase: be careful that they do not eat blood before you
  simplified_phrase: Make sure no one eats blood in your presence
  preserved_meaning: The hearer must prevent blood from being eaten in his presence.
  reasoning_layer_used: POB text
  rationale: This recasts the unclear pronoun and idiom in ordinary English.
- pob_phrase: I have been commanded to testify to you and to your children together with all flesh
  simplified_phrase: I was commanded to testify about this to you, your children, and all flesh
  preserved_meaning: The formal testimony extends to the hearers, their children, and the ambiguously broad group called all flesh.
  reasoning_layer_used: POB text and independent grounding review
  rationale: The wording clarifies what the testimony concerns without weakening its formal force or resolving all flesh.
interpretive_expansions:
- pob_phrase: Cover the blood
  rendering: Cover the blood with earth
  claim: The blood is to be covered using earth.
  evidence:
  - The applied source review connects this command with covering blood with earth in Leviticus 17:13.
  - The source-grounded revision protects “cover” against the earlier rendering “pour out.”
  confidence: high
  alternatives_preserved:
  - Cover the blood
translation_notes:
  risk_flags:
  - risk: “All flesh” remains unfamiliar and may refer broadly to humanity or to living creatures.
    mitigation: The phrase is retained so the translation does not settle an ambiguity left open by the POB.
