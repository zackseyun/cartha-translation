    changes_summary: 'Replaced the unrelated draft with a translation that matches the Ge''ez source: Noah instructing his descendants in the twenty-eighth jubilee to practice righteousness, cover their nakedness, bless their Creator, honor father and mother, love one another, and guard themselves from fornication.'
translation:
  language: en
  text: These are Noah’s sons. In the twenty-eighth jubilee, during its seventh week, Noah began teaching his grandchildren the laws and commands, along with everything he knew about what is just. He solemnly instructed his sons to do what is right, cover their nakedness, bless their Creator, honor their father and mother, love one another as brothers, and guard themselves against sexual wrongdoing.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The opening may instead be read, “But Noah’s sons, in the twenty-eighth jubilee, while Noah was teaching his grandchildren the laws and commands, along with everything he knew about what is just, and was solemnly instructing his sons.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: command the ordinances and the commandments to the children of his sons
  simplified_phrase: teaching his grandchildren the laws and commands
  preserved_meaning: Noah passed authoritative instruction on to his sons’ children.
  reasoning_layer_used: POB text and grammar revision
  rationale: Common family and legal wording replaces the dense formal construction.
- pob_phrase: he testified to his sons
  simplified_phrase: He solemnly instructed his sons
  preserved_meaning: Noah gave his sons serious, authoritative moral instruction.
  reasoning_layer_used: POB text and source review
  rationale: This conveys solemn testimony without implying a courtroom setting.
- pob_phrase: guard their souls from fornication
  simplified_phrase: guard themselves against sexual wrongdoing
  preserved_meaning: They must protect themselves from prohibited sexual conduct.
  reasoning_layer_used: POB text and independent grounding review
  rationale: This keeps the protective force while avoiding both an archaic term and an overly broad category.
interpretive_expansions:
- pob_phrase: all that he knew of justice
  rendering: everything he knew about what is just
  claim: Justice here refers to morally right conduct rather than only a legal system.
  evidence:
  - The phrase introduces commands about righteous conduct.
  - The POB connects justice with doing righteousness.
  confidence: high
  alternatives_preserved:
  - everything he knew of justice
translation_notes:
  risk_flags:
  - risk: The source review notes uncertainty between “began” and “while.”
    mitigation: The main text follows the POB, and the complete alternate construction appears in the footnote.
  - risk: “Sexual wrongdoing” is less lexically specific than “fornication.”
    mitigation: It preserves the sexual domain and protective command without broadening it to all forms of immorality.
