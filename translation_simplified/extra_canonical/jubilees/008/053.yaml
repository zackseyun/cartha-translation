translation:
  language: en
  text: For this is what Enoch, your grandfather, commanded his son Methuselah. Methuselah commanded his son Lamech, and Lamech commanded me to follow everything his ancestors had commanded him.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Enoch, your father's father
  simplified_phrase: Enoch, your grandfather
  preserved_meaning: Enoch is the father of the addressee's father.
  reasoning_layer_used: POB text and immediate genealogy
  rationale: The common kinship term states the same relationship directly.
- pob_phrase: Methuselah commanded Lamech his son
  simplified_phrase: Methuselah commanded his son Lamech
  preserved_meaning: Methuselah gave commands to Lamech without specifying that they were identical to Enoch's.
  reasoning_layer_used: POB clause sequence and grounding review
  rationale: Natural English word order improves clarity without adding content.
- pob_phrase: Lamech commanded me all the things that his fathers commanded him
  simplified_phrase: Lamech commanded me to follow everything his ancestors had commanded him
  preserved_meaning: Lamech directed the speaker to obey the full body of commands he had received from earlier generations.
  reasoning_layer_used: POB text and repeated command language
  rationale: The wording makes the object of “commanded” natural while retaining its directive force.
interpretive_expansions:
- pob_phrase: Lamech commanded me all the things
  rendering: Lamech commanded me to follow everything
  claim: The speaker was directed to obey the commands Lamech had received.
  evidence:
  - The repeated verb “commanded” gives the transmission directive force.
  confidence: high
  alternatives_preserved:
  - Lamech instructed me in everything
translation_notes:
  risk_flags:
  - risk: “To follow” makes the implied response to the commands explicit.
    mitigation: It preserves the directive force of “commanded” without identifying each generation's commands as identical.
