translation:
  language: en
  text: 'Because of the blood they shed on the earth, He destroyed everything. I survived, along with you, my children, and all who entered the ark with us. Now I see what you are doing: you are not living in righteousness. You have begun to follow the path of corruption. Each of you is separating from your neighbor. You are jealous of one another and are not united.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I and you, my children, and all who entered with us into the ark were left
  simplified_phrase: I survived, along with you, my children, and all who entered the ark with us
  preserved_meaning: Noah, his children, and all their companions in the ark remained alive after the destruction.
  reasoning_layer_used: POB text and immediate flood context
  rationale: “Survived” clearly expresses what “were left” means here without limiting who entered the ark.
- pob_phrase: behold, I see before me your deeds
  simplified_phrase: Now I see what you are doing
  preserved_meaning: Noah observes and confronts his children’s present conduct.
  reasoning_layer_used: POB text and independent grounding review
  rationale: This removes the opaque idiom while keeping Noah’s observation rather than adding a command.
- pob_phrase: you are not walking in righteousness, for you have begun to walk in the path of corruption
  simplified_phrase: you are not living in righteousness. You have begun to follow the path of corruption
  preserved_meaning: Their present conduct is unrighteous and has begun to follow a corrupt course.
  reasoning_layer_used: POB text, tense revision, and singular-path lexical revision
  rationale: The wording clarifies conduct while preserving present action and the singular path image.
