base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/jubilees/008/019.yaml
  text: '"...the LORD in the dwelling of Shem." And he knew and he knew that the Garden of Eden is the holy of holies and the dwelling of the LORD, and Mount Sinai is in the midst of the wilderness, and Mount Zion is in the midst of the navel of the earth; these three were created as holy places facing one another.'
  footnotes:
  - marker: a
    text: Or 'The LORD dwelt in the dwelling of Shem,'.
    reason: previous_rendering
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T14:49:52Z'
    unchanged: false
    changes_summary: 'Replaced the draft, which reflected a different verse, with a translation matching the Ge''ez text: the LORD dwelling in Shem''s dwelling, recognition of Eden as the holy of holies and the LORD''s dwelling, Sinai in the midst of the wilderness, Zion in the midst of the earth, and the concluding statement about these three holy places.'
translation:
  language: en
  text: “...may the LORD dwell where Shem lives.” He knew that the Garden of Eden is the Most Holy Place, where the LORD dwells. Mount Sinai is in the middle of the wilderness, and Mount Zion is at the earth’s navel—its center. These three were created as holy places facing one another.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: “...the LORD in the dwelling of Shem.”
  simplified_phrase: “...may the LORD dwell where Shem lives.”
  preserved_meaning: The fragment continues Noah’s blessing from the previous verse rather than stating a past event.
  reasoning_layer_used: applied revision and source syntax
  rationale: The supplied review identifies this as the completion of the preceding wish, “may he dwell.”
- pob_phrase: the holy of holies and the dwelling of the LORD
  simplified_phrase: the Most Holy Place, where the LORD dwells
  preserved_meaning: Eden is uniquely sacred and is identified as the LORD’s dwelling place.
  reasoning_layer_used: POB main text
  rationale: The familiar title and a direct clause make both ideas easier to follow.
- pob_phrase: in the midst of the navel of the earth
  simplified_phrase: at the earth’s navel—its center
  preserved_meaning: Zion is pictured as occupying the earth’s central point.
  reasoning_layer_used: source image and POB main text
  rationale: The wording keeps the bodily image while immediately explaining it.
interpretive_expansions:
- pob_phrase: the navel of the earth
  rendering: the earth’s navel—its center
  claim: The navel image presents Zion as the earth’s center.
  evidence:
  - The POB locates Zion in the midst of the earth’s navel.
  - The source review summarizes the phrase as Zion being in the midst of the earth.
  confidence: high
  alternatives_preserved:
  - the earth’s navel
translation_notes:
  risk_flags:
  - risk: Supplying “may” and “dwell” goes beyond the verbless fragment in this verse.
    mitigation: The ellipsis and the documented continuation from verse 18 preserve its grammatical dependence.
  - risk: “Its center” explains a metaphor that may carry more symbolism than location alone.
    mitigation: The original image “navel” remains in the main text.
