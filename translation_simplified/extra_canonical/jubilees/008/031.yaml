translation:
  language: en
  text: Noah began teaching his grandsons the ordinances and commands, along with all the judgments he knew. He solemnly urged his sons to do what is right, to cover the shame of their bodies, to bless their Creator, to honor their father and mother, and to love their brothers. He also told them to guard their souls from sexual immorality, impurity, and every kind of injustice.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: command his sons' sons with ordinances and commandments and all the judgments that he knew
  simplified_phrase: teaching his grandsons the ordinances and commands, along with all the judgments he knew
  preserved_meaning: Noah instructed his grandsons in distinct kinds of moral requirements, with “all” qualifying the judgments he knew.
  reasoning_layer_used: POB text and independent grounding review
  rationale: The revision avoids implying a complete legal corpus while expressing the family relationship naturally.
- pob_phrase: he testified to his sons that they should do righteousness
  simplified_phrase: He solemnly urged his sons to do what is right
  preserved_meaning: Noah gave his sons a serious call to righteous conduct.
  reasoning_layer_used: POB text and approved clarity review
  rationale: “Solemnly urged” retains the force of his testimony in clear English.
- pob_phrase: cover the shame of their flesh ... guard their souls from fornication and uncleanness and all injustice
  simplified_phrase: cover the shame of their bodies ... guard their souls from sexual immorality, impurity, and every kind of injustice
  preserved_meaning: They were to practice bodily modesty and protect their souls from sexual sin, impurity, and wrongdoing.
  reasoning_layer_used: POB text and independent grounding review
  rationale: The wording preserves the shame image and the distinct moral categories in common English.
translation_notes:
  risk_flags:
  - risk: “The shame of their bodies” remains an unfamiliar expression for some readers.
    mitigation: It preserves the source image and its broader modesty-related moral force rather than reducing it to nudity.
  - risk: “Impurity” may include more than sexual uncleanness.
    mitigation: It remains distinct from “sexual immorality,” preserving its broader possible scope.
