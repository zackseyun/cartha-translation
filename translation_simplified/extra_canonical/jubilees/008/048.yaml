translation:
  language: en
  text: Now, my children, listen to me. Do what is just and right, so that you may take root in righteousness throughout the whole earth and may be honored in the presence of my God, who saved me from the floodwaters.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: do justice and righteousness
  simplified_phrase: Do what is just and right
  preserved_meaning: The children are commanded to practice both justice and righteousness.
  reasoning_layer_used: POB translation and immediate context
  rationale: The abstract nouns become a direct command in common English.
- pob_phrase: so that you may be planted in righteousness over the face of the whole earth
  simplified_phrase: so that you may take root in righteousness throughout the whole earth
  preserved_meaning: The wording retains both the planting image and its reach across the earth without guaranteeing the outcome.
  reasoning_layer_used: POB source-driven imagery and clause relationship
  rationale: “Take root” makes the planting image natural while preserving its spatial breadth.
- pob_phrase: your glory may be lifted up before my God
  simplified_phrase: may be honored in the presence of my God
  preserved_meaning: Their glory or honor may be elevated before God as a purpose or result of righteous conduct.
  reasoning_layer_used: POB translation and clause relationship
  rationale: The idiom is expressed naturally while retaining the purpose-oriented “may.”
