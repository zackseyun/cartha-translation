translation:
  language: en
  text: This sea is called the tongue of the Egyptian Sea. From there it extends north to the mouth of the Great Sea, at the water’s edge. It then runs west to Afra[a] and continues until it comes near the Gihon River, along the north side of its waters.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “toward the west of Afra.”
    reason: lexical_alternative
