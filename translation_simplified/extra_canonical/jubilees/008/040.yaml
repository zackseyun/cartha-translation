  text: All who shed human blood or eat the blood of any flesh will be destroyed from the earth.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: everyone who sheds the blood of man
  simplified_phrase: all who shed human blood
  preserved_meaning: Every person who sheds another person's blood is included.
  reasoning_layer_used: POB text and applied revision
  rationale: “Human blood” replaces the older generic use of “man” without weakening the warning.
- pob_phrase: everyone who eats the blood of any flesh
  simplified_phrase: or eat the blood of any flesh
  preserved_meaning: The warning separately includes everyone who consumes blood from any flesh.
  reasoning_layer_used: POB controlling text and grounding review
  rationale: Keeping “any flesh” preserves the POB's unrestricted scope.
- pob_phrase: all of them will be destroyed from the earth
  simplified_phrase: All who ... will be destroyed from the earth
  preserved_meaning: Both named groups face destruction from the earth.
  reasoning_layer_used: Applied awkward-English revision
  rationale: One plural subject removes the resumptive phrase while retaining its inclusive force.
