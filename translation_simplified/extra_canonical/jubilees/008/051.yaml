    changes_summary: Replaced LORD with Yahweh for consistency with POB policy, and changed servants to slaves to reflect the mandated rendering where applicable.
translation:
  language: en
  text: They must bring an abundant amount of the first portion of the wine and oil as a firstfruits offering to Yahweh’s altar, where Yahweh receives it. The slaves of Yahweh’s house must eat what remains before the altar that receives it.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: bring up in abundance
  simplified_phrase: bring an abundant amount
  preserved_meaning: The offering is to be abundant rather than meager.
  reasoning_layer_used: POB base text
  rationale: This states the required quantity in natural English.
- pob_phrase: the first of the wine and oil as firstfruits
  simplified_phrase: the first portion of the wine and oil as a firstfruits offering
  preserved_meaning: The initial portion of the wine and oil is dedicated as firstfruits.
  reasoning_layer_used: POB base text and grounding review
  rationale: “First portion” is clearer than “first wine and oil,” while “firstfruits” preserves the biblical category.
- pob_phrase: what is left let the slaves of the house of Yahweh eat
  simplified_phrase: The slaves of Yahweh’s house must eat what remains
  preserved_meaning: The remainder is assigned to the slaves attached to Yahweh’s house.
  reasoning_layer_used: POB base text and applied revision
  rationale: Normal English word order improves clarity while retaining the audited term “slaves.”
translation_notes:
  risk_flags:
  - risk: Modern readers may find it unusual that both Yahweh and the altar are said to receive the offering.
    mitigation: Both statements are retained because the POB presents each receiving action.
  - risk: The term “slaves” may sound harsh to modern readers.
    mitigation: It remains because the audited revision explicitly requires this rendering.
