  reasoning_layer_used: POB main translation
  rationale: The common verb “married” states the same relationship directly.
- pob_phrase: Rasu'eja, the daughter of Susan, the daughter of Elam
  simplified_phrase: Rasu'eja was Susan’s daughter, and Susan was Elam’s daughter
  preserved_meaning: The two stated parent-child relationships remain unchanged.
  reasoning_layer_used: source syntax and POB genealogy
  rationale: A separate clause for each generation makes the genealogy easier to follow.
