translation:
  language: en
  text: During the first year of the first seven-year period in the twenty-ninth jubilee,[a] Arpachshad married Rasu'eja. Rasu'eja was Susan’s daughter, and Susan was Elam’s daughter. Rasu'eja bore him a child.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the forty-ninth jubilee.” A jubilee is a forty-nine-year period divided into seven periods of seven years.
    reason: alternative_reading
