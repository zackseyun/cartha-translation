  preserved_meaning: Melka is Madai’s daughter and Japheth’s granddaughter.
  reasoning_layer_used: POB translation
  rationale: The genealogy is restated as a direct family relationship.
- pob_phrase: in the fourth year of it he fathered a son, and he called his name Salah
