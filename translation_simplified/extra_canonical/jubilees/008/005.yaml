translation:
  language: en
  text: He was afraid to tell Noah about it because he feared Noah might be angry with him about it. In the first year of the first seven-year cycle within the fifth jubilee, he married Melka, the daughter of Madai and granddaughter of Japheth. In the fourth year of that cycle, he fathered a son and named him Salah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “In the fourth year she bore him a son.”
    reason: lexical_alternative
