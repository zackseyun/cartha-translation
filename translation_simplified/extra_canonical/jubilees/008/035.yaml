translation:
  language: en
  text: After this, they sinned against the animals and birds, and against every creature that moved or walked on the earth. Much blood was shed on the earth. Every human thought and desire was continually focused on what was worthless and evil.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the beasts and the birds and everything that moves and everything that walks upon the earth
  simplified_phrase: the animals and birds, and against every creature that moved or walked on the earth
  preserved_meaning: Their sin was directed against all kinds of animals and birds.
  reasoning_layer_used: POB main text and high-agreement cross-check
  rationale: This shortens the repeated list while retaining its scope and categories.
- pob_phrase: much blood was shed on the earth
  simplified_phrase: Much blood was shed on the earth
  preserved_meaning: The violence caused extensive bloodshed on the earth.
  reasoning_layer_used: POB main text and grounding review
  rationale: Keeping “on the earth” avoids adding an unsupported claim about geographic extent.
- pob_phrase: every imagination and desire of man imagined vanity and evil continually
  simplified_phrase: Every human thought and desire was continually focused on what was worthless and evil
  preserved_meaning: Human thought and desire remained constantly directed toward vanity and evil.
  reasoning_layer_used: POB main text and optimal-equivalence philosophy
  rationale: The awkward repetition is recast without weakening its continual moral force.
