translation:
  language: en
  text: For the earth cannot be cleansed of the blood spilled on it. Only the blood of the person who spilled it can cleanse the earth, throughout all generations.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: will not be cleansed from the blood that is shed upon it
  simplified_phrase: cannot be cleansed of the blood spilled on it
  preserved_meaning: The earth remains defiled by bloodshed.
  reasoning_layer_used: POB main text
  rationale: Common wording preserves both the cleansing language and the image of blood on the earth.
- pob_phrase: the one who shed it
  simplified_phrase: the person who spilled it
  preserved_meaning: Cleansing requires the blood of the person responsible for the bloodshed.
  reasoning_layer_used: POB main text and applied revisions
  rationale: The clearer wording retains the POB's restrictive link to the responsible person.
- pob_phrase: throughout all its generations
  simplified_phrase: throughout all generations
  preserved_meaning: The principle continues across generations.
  reasoning_layer_used: POB main text
  rationale: Removing the unclear possessive makes the enduring scope understandable without narrowing it.
