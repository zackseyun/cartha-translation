translation:
  language: en
  text: Do not eat blood along with meat. Otherwise, every living creature that sheds blood on the earth will be held accountable for your blood—your life.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: eat blood with the flesh
  simplified_phrase: eat blood along with meat
  preserved_meaning: The command specifically forbids consuming blood together with animal flesh.
  reasoning_layer_used: applied revision and POB main text
  rationale: “Meat” expresses edible flesh in ordinary English while retaining the source-driven reference to blood.
- pob_phrase: your blood, which is your life, be required from the hand of
  simplified_phrase: will be held accountable for your blood—your life
  preserved_meaning: The bloodshedder is answerable for the victim's blood, which represents life.
  reasoning_layer_used: POB main text and source-language image
  rationale: The wording explains the hand idiom as accountability while preserving the blood-life connection.
- pob_phrase: all flesh that sheds blood on the earth
  simplified_phrase: every living creature that sheds blood on the earth
  preserved_meaning: The warning comprehensively includes all fleshly creatures that shed blood.
  reasoning_layer_used: applied revision and POB main text
  rationale: “Every living creature” makes the broad idiom clear without changing its universal scope or specifying whose blood is shed.
interpretive_expansions:
- pob_phrase: be required from the hand of
  rendering: will be held accountable for
  claim: Requiring blood from the bloodshedder's hand conveys answerability for bloodshed.
  evidence:
  - The requirement is placed upon the flesh that sheds blood.
  - The POB links the blood being required with the person's life.
  confidence: high
  alternatives_preserved:
  - your blood will be demanded from
translation_notes:
  risk_flags:
  - risk: “Held accountable” does not reproduce the literal image of blood being required from a hand.
    mitigation: The rendering preserves the image's central force of answerability and retains both blood and life.
  - risk: “Every living creature” interprets the broad idiom “all flesh.”
    mitigation: The universal scope remains explicit, and the wording does not restrict the bloodshedder to humans.
