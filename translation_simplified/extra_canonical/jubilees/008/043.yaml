translation:
  language: en
  text: Whenever you slaughter an animal, livestock, a bird, or anything else that moves on the earth, do not let any of its blood be seen on you.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: in all the days in which you slaughter
  simplified_phrase: Whenever you slaughter
  preserved_meaning: The command applies every time a creature is slaughtered.
  reasoning_layer_used: POB text and revision context
  rationale: The long time clause becomes ordinary English without changing its scope.
- pob_phrase: any beast or cattle or bird or whatever moves upon the earth
  simplified_phrase: an animal, livestock, a bird, or anything else that moves on the earth
  preserved_meaning: The wording retains each stated category without narrowing “beast” to a wild animal.
  reasoning_layer_used: POB source-driven enumeration and grounding review
  rationale: Common category names preserve the full list and correct the unsupported restriction.
- pob_phrase: Let no blood appear upon you from all the blood that there shall be
  simplified_phrase: do not let any of its blood be seen on you
  preserved_meaning: None of the slaughtered creature’s blood is to be visible on the person.
  reasoning_layer_used: POB controlling wording
  rationale: Natural syntax preserves the concrete image of blood appearing on the person.
translation_notes:
  risk_flags:
  - risk: “Be seen on you” may not express every possible nuance of “appear upon you.”
    mitigation: The wording preserves the physical image without adding guilt or ritual status.
