  text: This territory included all of Eden; all the land of the Erythraean Sea; all the eastern land; India; the lands and mountains along the Erythraean Sea; all Bashan; all Lebanon and the islands of Caphtor; all the mountains of Senir and Amana; the mountains of Asshur in the north; all the lands of Elam, Asshur, and Babylon; Susa and Media; all the mountains of Ararat; and the whole region across the sea, beyond the mountains of Asshur toward the north. It was a blessed and spacious land, and everything in it was very good.
