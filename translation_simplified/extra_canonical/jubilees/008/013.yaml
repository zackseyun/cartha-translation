translation:
  language: en
  text: Half of it goes westward through the middle of this river. It continues until it comes near the waters of the abysses, where this river begins. Its waters empty into the Sea Me’at, and the river flows into the Great Sea.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And its half goes toward the west through the midst of this river
