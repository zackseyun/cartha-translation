  preserved_meaning: The wording keeps the source-driven sense of “its half” and its westward course through the river.
  reasoning_layer_used: applied revision on manfaqu
  rationale: The revision requires “half” rather than the less literal “portion.”
- pob_phrase: until it approaches the waters of the abysses, from which this river comes forth
