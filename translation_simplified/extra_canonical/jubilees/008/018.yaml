translation:
  language: en
  text: This land was for Shem and his sons to possess forever, through every generation. Noah rejoiced because this portion had been allotted to Shem and his sons. He remembered everything he had spoken aloud in prophecy, for he had said, “Blessed be the Lord, the God of Shem, and may he dwell…”
