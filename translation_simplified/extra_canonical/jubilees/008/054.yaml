translation:
  language: en
  text: I also command you, my sons, just as Enoch commanded his son in the first jubilees, while he was still alive, in the seventh generation. He gave this command and solemnly instructed his son and his grandsons until the day he died.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: as Enoch commanded his son in the first jubilees while he was still alive, in the seventh generation
  simplified_phrase: just as Enoch commanded his son in the first jubilees, while he was still alive, in the seventh generation
  preserved_meaning: The first jubilees, Enoch's lifetime, and the seventh generation remain associated without defining their exact relationship.
  reasoning_layer_used: POB base text and grounding review
  rationale: The wording retains the technical expression and avoids making the seventh generation explicitly govern the command.
- pob_phrase: testified to his son
  simplified_phrase: solemnly instructed his son
  preserved_meaning: Enoch gave his son a serious and formal charge.
  reasoning_layer_used: POB contextual wording and approved review finding
  rationale: This avoids the modern courtroom sense of “testified” while preserving its solemn force.
- pob_phrase: his sons' sons
  simplified_phrase: his grandsons
  preserved_meaning: The instruction extended to his son's male descendants.
  reasoning_layer_used: POB base text
  rationale: The common kinship term expresses the same relationship more naturally.
