translation:
  language: en
  text: For the first three years, do not harvest the fruit of anything edible. In the fourth year, the fruit will be holy—the firstfruits accepted by the Most High LORD, who created heaven, earth, and everything.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: For three years the fruit of anything that is eaten shall not be gathered
  simplified_phrase: For the first three years, do not harvest the fruit of anything edible
  preserved_meaning: The prohibition covers fruit from everything edible during the initial three-year period.
  reasoning_layer_used: POB translation and applied revision
  rationale: The active command and “harvest” state the agricultural rule naturally without adding a cultivation restriction.
- pob_phrase: but in the fourth year its fruit shall be holy, the firstfruits acceptable before
  simplified_phrase: In the fourth year, the fruit will be holy—the firstfruits accepted by
  preserved_meaning: The fourth-year fruit is consecrated as firstfruits accepted by the Most High LORD.
  reasoning_layer_used: POB translation and grounding review
  rationale: Repeating “the fruit” clarifies the referent, and the dash identifies it as the holy firstfruits.
