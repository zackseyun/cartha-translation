translation:
  language: en
  text: 'After Abraham died, the Philistines filled the wells with earth. Abimelech said to Isaac, “Go away from us, because you have become much more powerful than we are.” So Isaac left. In the first year of the seventh week, he camped in the valley of Gerar.


    Isaac’s servants reopened the water wells that his father Abraham’s servants had dug. The Philistines had filled them in after Abraham died. Isaac’s servants gave the wells the same names that Abraham had given them.


    Then they dug a well in the dry valley and found fresh, flowing water. But the shepherds of Gerar argued with Isaac’s shepherds and said, “The water belongs to us!” So Isaac named the well Contention, because they had contended with us. His servants dug another well, and the shepherds also fought over that one. Isaac named it Hostility.


    Isaac moved on and dug another well. No one argued over it, so he named it Broad Place. He said, “Now the LORD has made room for us, and we will be fruitful in the land.”


    From there Isaac went up to the Well of the Oath. This was in the first year of the first week of the forty-fourth jubilee. At dawn on the first day of the first month, the LORD appeared to him during the night and said, “I am the God of your father Abraham. Do not be afraid, for I am with you. I will bless you and greatly increase your descendants until they are like the sand of the earth. I will do this for the sake of my servant Abraham.”


    Isaac built an altar there, in the place where his father Abraham had first built one. He called on the name of the LORD and offered a sacrifice to the God of his father Abraham. His servants dug a well and found fresh, flowing water.


    Then Isaac’s servants dug another well but found no water. They came and told Isaac. He said, “Today I swore an oath to the Philistines, and now this has happened to us.” He named that place Well of the Oath, because there he swore an oath to Abimelech, Abimelech’s companion Ahuzzath, and Phicol, the commander of his army.


    That day Isaac understood that he had been forced to swear an oath in order to make peace with them. So he cursed the Philistines, saying:


    “May the Philistines be cursed with wrath and indignation among all the nations. May the LORD hand them over to sinful nations—to the Kittim—so that they become objects of reproach, cursing, wrath, and indignation. If any escape the enemy’s sword and the Kittim, may a righteous people uproot them in judgment from under heaven.[a] For throughout their generations they will be enemies who hate my children.


    “On the day of wrathful judgment, none of them will survive or escape. All the descendants of the Philistines are destined to be destroyed, uprooted, and removed from the earth. No remnant or descendants of these Caphtorites will remain on the earth.


    “Even if one of them climbs up to heaven, he will be brought down from there. If he sinks into the earth, he will be dragged out. If he hides among the nations, he will be uprooted from there. If he goes down to the realm of the dead, his judgment will become even greater there, and he will find no peace.


    “If he is taken captive, those seeking his life will kill him on the road. Neither his name nor his descendants will remain anywhere on earth, for he will pass into an eternal curse.”


    This is what is written and decreed about the Philistines on the heavenly tablets: on the day of judgment they will be uprooted from the earth.'
