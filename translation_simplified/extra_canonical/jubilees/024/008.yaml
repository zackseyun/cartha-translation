simplification_decisions:
- pob_phrase: was going to go down to Egypt
  simplified_phrase: intended to travel down to Egypt
  preserved_meaning: Isaac planned the journey to Egypt but did not complete it.
  reasoning_layer_used: Applied revision on the Ge’ez imperfect/jussive verb
  rationale: “Intended to travel” expresses the unrealized journey in natural English.
- pob_phrase: and he went to Gerar, to Abimelech king of the Philistines
  simplified_phrase: Instead, he went to Gerar and came to Abimelech, king of the Philistines
  preserved_meaning: Isaac went to Gerar and approached the Philistine king Abimelech.
  reasoning_layer_used: POB text and independent grounding review
  rationale: The wording clearly preserves both Gerar as the place and Abimelech as the person Isaac approached.
interpretive_expansions:
- pob_phrase: and he went to Gerar
  rendering: Instead, he went to Gerar
  claim: Gerar, rather than Egypt, became Isaac’s actual destination.
  evidence:
  - The source review says Isaac did not go to Egypt but stopped in Gerar.
  - The first verb marks intended or incipient action, while the second reports completed movement.
  confidence: high
  alternatives_preserved:
