translation:
  language: en
  text: '“Swear to me today,” Jacob said. So Esau swore to him. Then Jacob gave his brother Esau bread and stew, and Esau ate until he was full. In this way Esau sold his rights as the firstborn. That is why he was called Edom: Jacob had given him wheat stew in exchange for those rights.'
  philosophy: optimal-equivalence
