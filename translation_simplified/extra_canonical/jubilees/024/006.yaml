  simplified_phrase: “Swear to me today,” Jacob said. So Esau swore to him.
  preserved_meaning: Jacob demanded an oath, and Esau gave it.
  reasoning_layer_used: Immediate narrative context and POB referents
  rationale: Naming the speakers removes unclear pronouns without adding a new event.
- pob_phrase: he ate until he was satisfied
  simplified_phrase: Esau ate until he was full
  preserved_meaning: Esau ate enough food to satisfy his hunger.
  reasoning_layer_used: POB main text
  rationale: “Was full” is the more natural common-English expression.
- pob_phrase: his birthright
  simplified_phrase: his rights as the firstborn
  preserved_meaning: Esau sold the special status and rights belonging to the firstborn son.
  reasoning_layer_used: POB revision and source-driven lexical decision
  rationale: The wording explains an unfamiliar biblical term while retaining the idea of inherited firstborn rights.
