translation:
  language: en
  text: “Through your descendants, all the nations of the earth will be blessed, because your father obeyed me and kept my charge, my commandments, my laws, my statutes, and my covenant. Now listen to me and live in this land.” So he lived in Gerar for twenty-one years. Then Abimelech gave orders concerning him.
