  simplified_phrase: Through your descendants
  preserved_meaning: The promised blessing comes through the father’s offspring.
  reasoning_layer_used: POB revision and immediate context
  rationale: “Descendants” clearly expresses the collective meaning of “seed.”
- pob_phrase: obeyed my voice and kept
  simplified_phrase: obeyed me and kept
  preserved_meaning: The father obeyed God and observed all five named obligations.
  reasoning_layer_used: POB text and source review
  rationale: This removes an unfamiliar idiom without weakening the explicit obedience.
- pob_phrase: dwell in this land
  simplified_phrase: live in this land
  preserved_meaning: God commands him to remain and make his home there.
  reasoning_layer_used: POB base text
  rationale: “Live” states the same command in ordinary modern English.
