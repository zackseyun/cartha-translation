translation:
  language: en
  text: Noah died and was buried on Mount Lubar in the land of Ararat. He lived 950 years—nineteen jubilees, two weeks, and five years.[14] During his life on earth, he surpassed everyone except Enoch because he was perfect in righteousness. Enoch’s task was established as a testimony for the generations of the world, so that he would recount the deeds of every generation until the day of judgment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '14'
    text: Nineteen jubilees, two weeks, and five years equals 950 years. The chapter intentionally gives both the total and the jubilean reckoning.
    reason: cultural_note
