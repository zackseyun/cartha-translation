  text: It extends north to the boundary of Gadir. From there it continues to the coast of the great sea until it comes near the Gihon River. Then it follows the south side of the waters of Gihon to the bank of that river.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “to the great waters, until it approaches the Gihon River; and the Gihon River goes along the middle of this land.”
