translation:
  language: en
  text: Shem received the southern share of land, extending as far as where it approaches the middle of the sea.[1] Madai also received a share of land. He was to possess the land west of his two brothers, as far as the islands and their borders.
  philosophy: optimal-equivalence
  footnotes:
