simplification_decisions:
- pob_phrase: Let a tenth of them remain before him
  simplified_phrase: Let one-tenth of them remain with him
  preserved_meaning: A tenth are allowed to stay in his presence rather than descend for judgment.
  reasoning_layer_used: POB text and cross-reference footnote
  rationale: “One-tenth” and “with him” express the proportion and relationship in common English.
- pob_phrase: let nine parts descend into the place of judgment
  simplified_phrase: let the other nine-tenths go down to the place of judgment
  preserved_meaning: The remaining nine portions are sent down for judgment.
  reasoning_layer_used: POB text
  rationale: The wording makes the contrast with the retained tenth immediately clear.
- pob_phrase: he told one of us that we should teach Noah
  simplified_phrase: he told one of us to teach Noah
  preserved_meaning: The speaker directs one member of the angelic group to instruct Noah.
  reasoning_layer_used: source-grounded applied revision
  rationale: The direct infinitive removes a cumbersome clause without changing who speaks or receives the command.
