translation:
  language: en
  text: He said,[10] “Let one-tenth of them remain with him, and let the other nine-tenths go down to the place of judgment.” Then he told one of us to teach Noah all the remedies concerning them, because—
  philosophy: optimal-equivalence
  footnotes:
