translation:
  language: en
  text: In the first year of the second seven-year period[a] of the thirty-third jubilee, Peleg married Lomna, the daughter of Shinar. In the fourth year of that same period, she gave birth to his son. Peleg named him Reu, because he said, “Look, human beings have become evil because of their wicked plan to build themselves a city and a tower in the land.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The text literally says “week,” referring here to a seven-year period.
    reason: simplification_note
