translation:
  language: en
  text: Then Mastema, the prince of spirits,[9] came and said, “Lord, Creator, leave some of them with me. Let them listen to my voice and do everything I tell them to do. If none are left with me, I will have no power to carry out my will among humanity. They are to corrupt people and lead them astray before my judgment, because human evil is great.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: '9'
    text: The Ethiopic title may also be translated “angel of spirits”; the name Mastema fits the recurring terminology and the demonic context in Jubilees.
    reason: lexical_alternative
