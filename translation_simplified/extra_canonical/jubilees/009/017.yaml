simplification_decisions:
- pob_phrase: Nineteen jubilees, two weeks, and five years—which he lived on earth longer than the children of men ... except for Enoch
  simplified_phrase: He lived on earth for nineteen jubilees, two weeks, and five years—longer than any other human being except Enoch
  preserved_meaning: The stated period is his earthly lifespan, exceeding everyone’s except Enoch’s.
  reasoning_layer_used: POB translation and source-grounded revision
  rationale: The fragment becomes a complete sentence, and the exception is placed beside the comparison it qualifies.
- pob_phrase: because of the righteousness in which he was perfect
  simplified_phrase: because he was perfect in righteousness
  preserved_meaning: His exceptional lifespan is linked to complete righteousness.
  reasoning_layer_used: POB translation
  rationale: The abstract relative clause is recast in direct modern syntax without weakening the claim.
- pob_phrase: Enoch's role was created as a testimony to the generations of the world
  simplified_phrase: Enoch’s role was established as a witness to the generations of the world
  preserved_meaning: Enoch had a specially established role of testimony for successive generations.
  reasoning_layer_used: POB translation and independent grounding review
  rationale: “Established” clarifies the unusual wording without adding the unsupported metaphor of appointment.
