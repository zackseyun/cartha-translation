translation:
  language: en
  text: 'His deed is very evil, because he is detestable before the LORD. Therefore, it is written and decreed on the heavenly tablets: A man must not have sexual relations with his father’s wife. He must not uncover his father’s skirt by taking his wife,[a] for this is unclean. Both must certainly die—the man who has sexual relations with his father’s wife and the woman as well—because they have committed an unclean act on the earth. No such uncleanness must exist before our God among the people he has chosen to be his kingdom.


    It is also written: “Cursed is anyone who has sexual relations with his father’s wife, because he has exposed his father’s shame.” Let all the LORD’s holy ones say, “So be it! So be it!”


    Moses, command the children of Israel to obey this word. This act carries a sentence of death and makes those who commit it unclean. No atonement can ever be made for the man who does this. He must be executed by stoning and removed from among the people of our God. No man in Israel who does this may remain alive even one day, because he is detestable and unclean.


    They must not say, “Reuben was allowed to live and was forgiven after he had sexual relations with his father’s concubine. She also lived, even though she was married and Reuben’s father Jacob was still alive.” At that time, the ordinance, judgment, and law had not yet been fully revealed to everyone. But in your days this law is established for all times and all generations. It never expires, and there is no forgiveness for this act. Both offenders must be removed from among the people; they must be put to death on the day they commit it.


    Moses, write this law down for Israel so that they will obey it. They must not commit such an act or become guilty of a sin that leads to death. The Judge, the LORD our God, shows no partiality and accepts no bribes. Tell them this ordinance so that they will listen, remain on guard, and watch themselves. Then they will not be destroyed or uprooted from the land. Everyone on earth who commits this act is unclean, defiled, polluted, and contaminated before our God.


    There is no greater sin than the sexual impurity people commit on the earth. Israel is a holy people to the LORD their God. They are his inherited people, a priestly people, a people of his kingdom, and a people he has planted. No such uncleanness must be found among this holy people.


    In the third year of that seven-year period,[b] Jacob and all his sons went to live in Abraham’s household, near his father Isaac and his mother Rebekah. These are the names of Jacob’s children: Reuben, his firstborn; Simeon, Levi, Judah, Issachar, and Zebulun, the sons of Leah; Joseph and Benjamin, the sons of Rachel; Dan and Naphtali, the sons of Bilhah; Gad and Asher, the sons of Zilpah; and Dinah, Leah’s only daughter and Jacob’s daughter.


    They went and bowed before Isaac and Rebekah. When Isaac and Rebekah saw them, they blessed Jacob and all his sons. Isaac rejoiced greatly when he saw the sons of his younger son Jacob, and he blessed them.'
