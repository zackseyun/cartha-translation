  text: Isaac had truly seen the sons of his son Jacob.[a] Then Jacob stepped back from Isaac’s immediate presence,[b] fell down, and bowed before him. Isaac blessed them. Jacob stayed there near his father Isaac that night, and they ate and drank.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “had seen them in righteousness.”
    reason: lexical_alternative
  - marker: b
    text: The source literally says that he “went out from between his feet,” an obscure expression that likely means Jacob withdrew from Isaac’s immediate presence. The source uses compressed pronouns, so some assignments of the actions are uncertain.
    reason: source_note
