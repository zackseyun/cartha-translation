translation:
  language: en
  text: Israel’s salvation will be found in you. On the day you sit on the glorious throne of your righteousness,[a] there will be great peace for all the descendants of the sons of the beloved. May everyone who blesses you be blessed. But all who hate you, cause you suffering, or curse you will be uprooted and destroyed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The wording may also be translated, “the throne of the glory of your righteousness.”
    reason: lexical_alternative
