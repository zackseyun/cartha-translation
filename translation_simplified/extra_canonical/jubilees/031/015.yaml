translation:
  language: en
  text: and holiness. May he make them great through every age. They will be rulers, judges, and leaders over all the descendants of Jacob’s sons. They will speak the Lord’s word righteously and judge all his judgments righteously. They will teach Jacob his ways and Israel his paths.[15] The blessing of the Lord will be in their mouths.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '15'
    text: The words translated “his paths to Israel” are difficult; they may refer more strongly to his ordinances or his discipline for Israel.
    reason: lexical_alternative
