translation:
  language: en
  text: Bethel. Jacob remembered the prayer his father had spoken when he blessed Levi and Judah. Jacob rejoiced and blessed the God of his fathers, Abraham and Isaac. He said, “Now I know that I have an everlasting hope before the God of all, and so do my children.” Thus this was ordained concerning both Levi and Judah. It was recorded for them as an everlasting, righteous testimony on the heavenly tablets, just as Isaac had blessed them.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the prayer with which his father had blessed Levi and Judah
  simplified_phrase: the prayer his father had spoken when he blessed Levi and Judah
  preserved_meaning: Isaac's prayer accompanied his blessing of Levi and Judah.
  reasoning_layer_used: POB base text
  rationale: The recast clause uses ordinary English while keeping the prayer tied to the blessing.
- pob_phrase: I have an everlasting hope, and my children also, before the God of all
  simplified_phrase: I have an everlasting hope before the God of all, and so do my children
  preserved_meaning: Jacob and his children share an enduring hope before God.
  reasoning_layer_used: POB base text
  rationale: The reordered sentence clearly applies the same hope to Jacob and his children.
- pob_phrase: it was ordained concerning the two of them
  simplified_phrase: this was ordained concerning both Levi and Judah
  preserved_meaning: The ordinance concerns the two sons without implying that it was given for their benefit.
  reasoning_layer_used: POB base text and immediate context
  rationale: Naming Levi and Judah clarifies the pronoun while retaining the neutral relation expressed by “concerning.”
translation_notes:
  risk_flags:
  - risk: “Bethel” may be a fragment carried over from the preceding context.
    mitigation: It remains a separate sentence rather than being attached to Jacob's remembrance.
  - risk: The singular “it” may refer to either the ordinance or the testimony.
    mitigation: The translation keeps the source-driven singular pronoun without resolving its antecedent.
