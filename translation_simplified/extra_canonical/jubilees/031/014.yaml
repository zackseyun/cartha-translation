    text: Or 'greatness of heart'.
    reason: previous_rendering
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T14:51:36Z'
    unchanged: false
    changes_summary: Changed 'from all flesh' to 'from among all flesh' for clearer sense, 'to serve' to 'to minister' for a more formal sanctuary-related register, and 'your sons' to 'your children' for consistency with the source and the verse's earlier wording.
translation:
  language: en
  text: and your children through every age. May the Lord give you and your descendants great understanding for glory. May he bring you and your descendants near to himself from among all humanity, so that you and your descendants may serve in his sanctuary like the angels who stand in his presence and like the holy ones. As they are, so will your children’s descendants be, for glory and greatness.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: your seed
  simplified_phrase: your descendants
  preserved_meaning: The blessing extends through the family line to future generations.
  reasoning_layer_used: POB wording and applied revision
  rationale: “Descendants” gives the family-line sense of “seed” in common English.
- pob_phrase: from among all flesh
  simplified_phrase: from among all humanity
  preserved_meaning: God brings this family near to himself from among all people.
  reasoning_layer_used: latest revision pass
  rationale: “Humanity” makes the biblical idiom clear without losing its universal scope.
- pob_phrase: angels of the presence
  simplified_phrase: angels who stand in his presence
  preserved_meaning: These angels serve before God in his immediate presence.
  reasoning_layer_used: POB text and immediate sanctuary context
  rationale: The descriptive wording makes the title understandable while preserving its central image.
interpretive_expansions:
- pob_phrase: to minister in his sanctuary
  rendering: so that you and your descendants may serve in his sanctuary
  claim: Both the addressee and the descendants are brought near for sanctuary service.
  evidence:
  - The POB makes “you and your seed” the object of “bring near.”
  - The purpose phrase “to minister” follows with the same people understood.
  confidence: high
  alternatives_preserved:
  - to minister in his sanctuary
translation_notes:
  risk_flags:
  - risk: “For glory” leaves its precise relationship to understanding unstated.
    mitigation: The draft retains the POB wording rather than imposing a causal meaning.
  - risk: The final comparison may include both heavenly status and sanctuary service.
    mitigation: “As they are” remains broad and points back to both groups in the preceding sentence.
