  text: “the foreign gods among you.” Then they gave Jacob the foreign gods, along with the objects they wore in their ears and around their necks, and the idols Rachel had stolen from her brother Laban. Rachel handed them all over to Jacob. He burned them, crushed them, destroyed them, and hid them under the oak tree[2] in the land of Shechem.
