simplification_decisions:
- pob_phrase: And he came to his father Isaac and to his mother Rebekah.
  simplified_phrase: Jacob came to his father Isaac and his mother Rebekah.
  preserved_meaning: Jacob came to both of his parents.
  reasoning_layer_used: Immediate context identifies the unnamed subject as Jacob.
  rationale: Naming Jacob removes an unclear pronoun without changing the referent.
- pob_phrase: from the chamber to the door of the chamber
  simplified_phrase: out of the room to its doorway
  preserved_meaning: Rebekah moved from the chamber to the entrance of that same chamber.
  reasoning_layer_used: The consistency revision requires both occurrences of ማኅፈድ to denote the same place.
  rationale: This natural wording preserves the repeated reference to one place.
- pob_phrase: embrace him, for her spirit had revived
  simplified_phrase: hold him close, because her spirit had revived
  preserved_meaning: Rebekah embraced Jacob because her inner vitality had returned.
  reasoning_layer_used: The POB preserves both the physical embrace and the image of her spirit reviving.
  rationale: The action is clarified while the nonliteral revival image remains intact.
