  language: en
  text: so that they may bless all the descendants of the beloved. Your mother named you Levi, and she truly called you by that name. You will be joined to the Lord and be a companion of all Jacob’s sons. May the Lord’s table belong to you, and may you and your sons eat from it. May your table remain full through every generation.
