translation:
  language: en
  text: He had prayed, and when he came, he might put him on a donkey.[a] But Isaac said to his son Jacob, “I cannot go with you. I am old and cannot endure the journey. Go in peace, my son. Today I am 165 years old, and I can no longer travel. Put your mother on an animal and let her go.”
