simplification_decisions:
- pob_phrase: Behold, Jacob your son has come.
  simplified_phrase: Look, your son Jacob has come.
  preserved_meaning: The speaker announces Jacob’s arrival and calls attention to it.
  reasoning_layer_used: POB translation and source payload
  rationale: “Look” conveys the attention-calling force of “behold” in common English.
- pob_phrase: said to him, “Are these your sons, my son?”
  simplified_phrase: asked Jacob, “My son, are these your sons?”
  preserved_meaning: She affectionately addresses Jacob and asks whether the two are his sons.
  reasoning_layer_used: Immediate narrative context and POB translation
  rationale: Naming Jacob clarifies the pronoun without changing the question.
- pob_phrase: In you shall the seed of Abraham be honored
  simplified_phrase: In you, Abraham’s descendants will be honored
  preserved_meaning: Abraham’s line will be honored in relation to the two sons without specifying how.
  reasoning_layer_used: POB source-driven wording and grounding review
  rationale: “Descendants” explains collective “seed,” while “in you” preserves the relation’s ambiguity.
