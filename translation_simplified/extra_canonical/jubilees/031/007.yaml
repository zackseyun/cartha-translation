translation:
  language: en
  text: She heard someone say, “Look, your son Jacob has come.” She kissed him. When she saw his two sons, she recognized them and asked Jacob, “My son, are these your sons?” Then she embraced and kissed them and blessed them, saying, “In you, Abraham’s descendants will be honored, and you will become a blessing.”
