translation:
  language: en
  text: You shall work for six days. But the seventh day is a Sabbath for the LORD your God. On that day, none of you shall work—not you, your children, your male or female servants, any of your animals, or any foreigner living among you.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Six days you shall do work
  simplified_phrase: You shall work for six days.
  preserved_meaning: Work is permitted and expected during the six days before the Sabbath.
  reasoning_layer_used: POB base text
  rationale: The direct verb “work” replaces the less natural phrase “do work.”
- pob_phrase: You shall do no work on it—you and your children and your male servants and your female servants and all your animals
  simplified_phrase: On that day, none of you shall work—not you, your children, your male or female servants, any of your animals
  preserved_meaning: The Sabbath ban on work applies to the whole household and its animals.
  reasoning_layer_used: POB base text and applied lexical revision
  rationale: The list is recast in natural English while retaining “children” and every named group.
- pob_phrase: the resident foreigner who is with you
  simplified_phrase: any foreigner living among you
  preserved_meaning: Foreign residents within the community must also rest on the Sabbath.
  reasoning_layer_used: POB base text
  rationale: The clearer wording explains residence without using the technical phrase “resident foreigner.”
translation_notes:
  risk_flags:
  - risk: “Male or female servants” may sound less formal than two separate categories.
    mitigation: Both groups remain explicitly included.
