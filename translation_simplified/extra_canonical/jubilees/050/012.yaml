  preserved_meaning: The prohibition applies to every person and to each listed act performed on the Sabbath.
  reasoning_layer_used: POB translation and source clause structure
  rationale: The Sabbath reference is moved forward so readers immediately understand what governs the list.
- pob_phrase: whether in his house or in any place
  simplified_phrase: works at home or anywhere else
  preserved_meaning: Work is included regardless of where it is done.
  reasoning_layer_used: POB syntax and immediate list context
  rationale: The location phrase is attached directly to work to remove an awkward interruption in the list.
- pob_phrase: tills his field ... kindles a fire ... makes war
