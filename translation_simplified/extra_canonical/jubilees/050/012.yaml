translation:
  language: en
  text: Anyone who does any of these things on the Sabbath day—works at home or anywhere else; sets out on a journey; cultivates his field; lights a fire; rides an animal; travels by ship on the sea; strikes or kills anything; slaughters an animal or a bird; catches a wild animal, a bird, or a fish; fasts; or goes to war—
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And every person who does work on it ... on the sabbath day
