translation:
  language: en
  text: The jubilee periods will continue to pass until Israel is cleansed of all guilt from sexual immorality, impurity, defilement, sin, and error. Israel will then live securely throughout the land. There will no longer be any satan or any evil one among them, and from that time on the land will be clean forever.
