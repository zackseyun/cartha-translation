translation:
  language: en
  text: Therefore, I have established for you a system of weeks of years, years, and jubilees. From the time of Adam until today, forty-nine jubilees have passed. One week of years, two years, and another forty years remain for learning the LORD’s commandments. Then they will enter the land of Canaan by crossing the Jordan westward.
  philosophy: optimal-equivalence
