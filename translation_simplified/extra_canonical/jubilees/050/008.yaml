- pob_phrase: does any work on it shall die
  simplified_phrase: does work on this day must die
  preserved_meaning: Doing prohibited work on the day carries the stated death penalty.
  reasoning_layer_used: POB base text
  rationale: The wording identifies the day directly and states the legal consequence naturally.
- pob_phrase: defiles this day, or who lies with a woman
  simplified_phrase: violates the holiness of this day, has sexual relations with a woman
  preserved_meaning: Desecrating the day and having sexual relations remain distinct violations.
  reasoning_layer_used: source payload, POB base text, and grounding review
  rationale: The revision preserves active desecration and replaces the sexual euphemism with clear modern wording.
- pob_phrase: says he will do any matter on it so as to do business concerning any buying or selling
  simplified_phrase: says that he will do something on that day in order to conduct business—to buy or sell
  preserved_meaning: Declaring an intention to undertake commercial activity on that day remains prohibited.
  reasoning_layer_used: POB base text, applied revision, and grounding review
  rationale: The direct wording removes an unclear idiom while retaining both buying and selling.
