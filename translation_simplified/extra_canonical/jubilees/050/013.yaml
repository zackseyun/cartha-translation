translation:
  language: en
  text: And anyone who does any of these things on the Sabbath day must die, so that the children of Israel may obey the commands concerning the Sabbaths of the land.[a] This is written on the tablets that he gave me, so that I could write for you the laws for each appointed time, according to how its days are divided.
  philosophy: optimal-equivalence
  footnotes:
