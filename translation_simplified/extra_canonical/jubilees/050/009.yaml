    changes_summary: Capitalized Sabbath for consistency in register, revised 'a holy day of kingship' to 'a holy kingdom day' to reflect the wording more directly, and rendered the closing phrase more completely as 'throughout their generations, throughout all days.'
translation:
  language: en
  text: Do no work at all on the Sabbath. Eat and drink only what you prepared for yourselves on the sixth day. Rest and keep the Sabbath by ceasing from all work. Bless the LORD your God, who has given all Israel this festival day, this holy day, and this holy day of the kingdom.[a] This day is for all Israel throughout their days and throughout all time.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a holy kingdom day.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: except what you have prepared for yourselves on the sixth day, to eat and to drink
  simplified_phrase: Eat and drink only what you prepared for yourselves on the sixth day.
  preserved_meaning: Sabbath food and drink are limited to what was prepared beforehand on the sixth day.
  reasoning_layer_used: POB text and source clause structure
  rationale: A separate sentence makes the advance-preparation requirement clear.
- pob_phrase: to rest and to keep Sabbath from all work on this day
  simplified_phrase: Rest and keep the Sabbath by ceasing from all work.
  preserved_meaning: Keeping the Sabbath includes resting from every kind of work.
  reasoning_layer_used: POB controlling translation
  rationale: The recast clause clearly connects Sabbath observance with stopping work.
- pob_phrase: this day throughout their days, throughout all days
  simplified_phrase: This day is for all Israel throughout their days and throughout all time.
  preserved_meaning: The day remains appointed for Israel through all their days and indefinitely.
  reasoning_layer_used: applied lexical revision and grounding review
  rationale: The descriptive ending preserves “their days” without adding another act of giving.
translation_notes:
  risk_flags:
