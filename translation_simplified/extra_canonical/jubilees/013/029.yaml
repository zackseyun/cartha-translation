    changes_summary: Changed 'give us' to 'Give me' to match the singular addressee, and adjusted 'not from a thread even to a sandal strap will I take' to the more natural and accurate 'from a thread even to a sandal strap, I will not take.'
translation:
  language: en
  text: '“Give us the people you rescued, but keep the goods for yourself.”


    Abram replied, “I have raised my hands to God Most High and sworn: I will not take anything that belongs to you—not even a thread or a sandal strap—so that you cannot claim, ‘I made Abram rich.’ The only exception is the food the young men have already eaten. And the men who went with me—Aner, Eshcol, and Mamre—may take their share.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the persons whom you rescued
  simplified_phrase: the people you rescued
  preserved_meaning: The speaker asks for the rescued people rather than the recovered property.
  reasoning_layer_used: POB text and source-driven revision
  rationale: “People” is more natural modern English than “persons” here.
- pob_phrase: from a thread even to a sandal strap, I will not take anything that is yours
  simplified_phrase: I will not take anything that belongs to you—not even a thread or a sandal strap
  preserved_meaning: Abram refuses even the smallest item while retaining the concrete source image.
  reasoning_layer_used: POB text
  rationale: The reordered sentence makes the refusal clear without weakening the image.
- pob_phrase: except only what the young men have eaten, and the share of the men who went with me
  simplified_phrase: The only exception is the food the young men have already eaten. And the men who went with me … may take their share.
  preserved_meaning: Abram distinguishes consumed provisions from his allies’ rightful shares.
  reasoning_layer_used: POB text and immediate context
  rationale: Two short sentences clearly separate the consumed food from the allies’ shares.
interpretive_expansions:
- pob_phrase: I have lifted up my hands to God Most High
  rendering: I have raised my hands to God Most High and sworn
  claim: Abram’s raised hands signify a solemn oath before God.
  evidence:
  - The gesture introduces and binds the solemn refusal that follows.
  - The POB places the raised-hands formula immediately before Abram’s vow.
  confidence: high
  alternatives_preserved:
  - I have raised my hands to God Most High.
translation_notes:
  risk_flags:
  - risk: Adding “and sworn” explains the force of the raised-hands gesture.
    mitigation: The physical image remains, and the following vow supports the clarification.
  - risk: “Give us” differs from the familiar wording of Genesis 14:21.
    mitigation: The plural follows the audited Ge'ez source and final source-driven revision.
