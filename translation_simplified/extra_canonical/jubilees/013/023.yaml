  text: And Targal[a], king of nations; and they killed the king of Gomorrah, and the king of Sodom fled, and many fell into the bitumen of the valley of the Sodomites[b] by the Salt Sea. And they took captive Sodom and Admah and Zeboiim, and they took captive Lot also, the son of Abram's brother, and all his possessions, and they went as far as Dan.
  footnotes:
  - marker: a
    text: Ge'ez Targāl, corresponding to Tidal in Genesis 14:1.
    reason: lexical_choice
  - marker: b
    text: Ge'ez ba-qab'a baqalā Sadomāwyān (lit. 'in the oil/bitumen of the valley of the Sodomites'). This corresponds to the 'bitumen pits in the valley of Siddim' in Genesis 14:10. Charles (1902) considered the text corrupt and emended to 'through wounds', but the Ge'ez is comprehensible as a rendering of the Genesis tradition.
    reason: textual_critical
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T14:50:05Z'
    unchanged: false
    changes_summary: Added commas for apposition; revised 'struck' to 'killed' for lexical accuracy; revised 'the Salt Sea valley' to 'the valley of Siddim by the Salt Sea' to reflect the source more fully; revised 'took ... and they took Lot also' wording only minimally for natural English; changed 'the king of Sodom' action to 'drove away' to reflect the distinct verb.
translation:
  language: en
  text: Targal[a] was king of the nations. They killed the king of Gomorrah, but the king of Sodom fled. Many others fell into the tar pits in the valley of the Sodomites[b], near the Salt Sea. They captured Sodom, Admah, and Zeboiim. They also captured Lot, the son of Abram’s brother, and took everything he owned. Then they went as far as Dan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Geʿez name Targal corresponds to Tidal in Genesis 14:1.
    reason: source_note
  - marker: b
    text: The Geʿez says “valley of the Sodomites,” corresponding to the bitumen pits in the valley of Siddim in Genesis 14:10.
    reason: source_note
simplification_decisions:
- pob_phrase: And Targal, king of nations;
  simplified_phrase: Targal was king of the nations.
  preserved_meaning: Targal retains his royal title without leaving a sentence fragment.
  reasoning_layer_used: POB translation and verse-boundary context
  rationale: The appositional fragment was recast as a complete sentence.
- pob_phrase: fell into the bitumen of the valley of the Sodomites by the Salt Sea
  simplified_phrase: fell into the tar pits in the valley of the Sodomites, near the Salt Sea
  preserved_meaning: People fell into the valley’s natural bitumen deposits beside the Salt Sea.
  reasoning_layer_used: POB lexical decision for በቀብአ and footnote b
  rationale: “Tar pits” makes the bitumen hazard immediately understandable while preserving the source image.
- pob_phrase: Lot also, the son of Abram's brother, and all his possessions
  simplified_phrase: Lot, the son of Abram’s brother, and took everything he owned
  preserved_meaning: Lot was captured together with all his property.
  reasoning_layer_used: POB base translation
  rationale: The possessive phrase was expressed as a direct action in common English.
