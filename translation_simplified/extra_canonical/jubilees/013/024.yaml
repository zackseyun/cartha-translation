translation:
  language: en
  text: 'A man who had escaped came and told Abram that his nephew had been captured. Abram armed the servants who had been born in his household . . .[a] The first tithe for the LORD is required from Abram and his descendants.[b] The LORD made this a permanent law: they must give the tithe to the priests who serve before him.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving text shifts abruptly here from Abram’s armed servants to the law about tithes; part of the narrative may be missing or compressed.
    reason: textual_variant
  - marker: b
    text: “First tithe” may also mean “chief tithe” or an initial tithe connected with the first produce; the wording is unusual.
    reason: lexical_alternative
