translation:
  language: en
  text: Rebekah called her son Jacob and said, “Listen, I heard your father Isaac say to your brother Esau, ‘Hunt some game for me. Prepare it as food and bring it to me, so that I may eat and bless you before the LORD before I die.’”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And Rebekah called Jacob her son and said to him
  simplified_phrase: Rebekah called her son Jacob and said
  preserved_meaning: Rebekah summoned Jacob and spoke to him as her son.
  reasoning_layer_used: POB base text
  rationale: Natural English places “her son” before Jacob’s name and does not need “to him.”
- pob_phrase: Look, I heard Isaac your father speaking with Esau your brother
  simplified_phrase: Listen, I heard your father Isaac say to your brother Esau
  preserved_meaning: Rebekah draws Jacob’s attention and reports what Isaac told Esau.
  reasoning_layer_used: POB base text and immediate context
  rationale: The direct wording makes the family relationships and reported speech easier to follow.
- pob_phrase: Hunt game for me and prepare food for me, and bring it to me
  simplified_phrase: Hunt some game for me. Prepare it as food and bring it to me
  preserved_meaning: Esau must hunt an animal, prepare it for eating, and deliver the food to Isaac.
  reasoning_layer_used: applied lexical revision
  rationale: Two sentences clarify the sequence while preserving “hunt” as distinct from “bring.”
