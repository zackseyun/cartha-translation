translation:
  language: en
  text: May nations and peoples bow down before you. May you rule over your brothers, and may your mother’s sons bow down before you. May every blessing God gave to me and to my father Abraham belong to you and your descendants.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally “your seed,” meaning your descendants.
    reason: simplification_note
