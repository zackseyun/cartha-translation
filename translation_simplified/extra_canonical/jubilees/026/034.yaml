translation:
  language: en
  text: Your dwelling will have dew from heaven above.[34] You will live by your sword, and you will serve your brother. But when you rebel and throw the yoke off your neck, you will commit a complete sin unto death.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '34'
    text: This difficult verse differs from Genesis 27:40. The Ge'ez includes the statement about a complete sin unto death, so the text has not been conformed to Genesis.
    reason: textual_variant
