- pob_phrase: shall be your dwelling, and from the dew of heaven above
  simplified_phrase: Your dwelling will have dew from heaven above
  preserved_meaning: The dwelling remains connected with dew from heaven without specifying that the dew falls.
  reasoning_layer_used: POB text, textual-variant note, and grounding review
  rationale: The difficult fragment becomes readable without adding an unsupported action.
- pob_phrase: by your sword you shall live
  simplified_phrase: You will live by your sword
  preserved_meaning: His life remains tied to the force represented by the sword.
  reasoning_layer_used: POB controlling translation
  rationale: Ordinary word order preserves the sword image.
- pob_phrase: remove the yoke from your neck
