  text: And Jacob said to Rebekah his mother[7], “Mother, will I not lack some of all that my father eats and that pleases him? But I am afraid, my mother, that he will recognize my voice and want to touch me. And you know that I am smooth, while Esau my brother is hairy, and I will appear in his eyes like one who mocks him, and I will do a deed that he did not command me, and he will be angry with me, and I will bring on myself a curse and not a blessing.”
  footnotes:
  - marker: '7'
    text: The verse is textually difficult. The Ge'ez seems to say Isaac would recognize or discern what he eats, then shifts to Jacob's fear that Isaac may detect him by his voice and touch. The translation preserves the sense without over-smoothing.
    reason: segmentation_note
  - marker: a
    text: Or 'does not my father recognize everything that he eats and discern it?'.
    reason: previous_rendering
  - marker: b
    text: Or 'that he may not recognize my voice and may not allow me to touch him.'.
    reason: previous_rendering
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T14:50:52Z'
    unchanged: false
    changes_summary: Adjusted 'discerns it' to 'discern it' for agreement, and changed 'may hear my voice' to 'may not recognize my voice' to better reflect the source sense and the following clause.
translation:
  language: en
  text: Jacob said to his mother Rebekah, “Mother, won’t I be missing some of the food my father eats and enjoys?[a] I am afraid he will recognize my voice and want to touch me. You know that my skin is smooth, but my brother Esau is hairy. I will seem to him like someone who is mocking him. I will also be doing something he did not tell me to do. Then he will be angry with me, and I will bring a curse on myself instead of a blessing.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The opening words are textually difficult. Another possible reading is, “Does my father not recognize and examine everything he eats?”
    reason: textual_variant
simplification_decisions:
- pob_phrase: will I not lack some of all that my father eats and that pleases him?
  simplified_phrase: won’t I be missing some of the food my father eats and enjoys?
  preserved_meaning: Jacob asks about lacking some of the food Isaac eats and likes.
  reasoning_layer_used: POB translation and textual-difficulty footnote
  rationale: The wording follows the POB’s main reading without adding a definite explanation of why the food matters.
- pob_phrase: I will appear in his eyes like one who mocks him
  simplified_phrase: I will seem to him like someone who is mocking him
  preserved_meaning: Jacob fears that Isaac will regard him as a mocker.
  reasoning_layer_used: POB translation
  rationale: The natural wording preserves Isaac’s perspective and the force of mockery.
- pob_phrase: I will do a deed that he did not command me
  simplified_phrase: I will also be doing something he did not tell me to do
  preserved_meaning: Jacob separately fears acting without his father’s instruction.
  reasoning_layer_used: POB translation and grounding review
  rationale: A separate sentence prevents this act from being merged with what Isaac may think.
interpretive_expansions:
- pob_phrase: I am smooth
  rendering: my skin is smooth
  claim: Jacob is describing his hairless skin in contrast with Esau’s hairy body.
  evidence:
  - The immediate contrast is that Esau is hairy.
  confidence: high
