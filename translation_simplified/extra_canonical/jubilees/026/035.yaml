  reasoning_layer_used: POB base text
  rationale: “Descendants” makes the collective sense of “seed” clear.
- pob_phrase: because of the blessing with which his father had blessed him
  simplified_phrase: because their father had given Jacob the blessing
  preserved_meaning: Esau hated Jacob because their father bestowed the blessing on Jacob.
  reasoning_layer_used: POB base text and immediate context
  rationale: Naming Jacob removes pronoun ambiguity and avoids repetition.
- pob_phrase: he said in his heart, “Now let the days of mourning for my father come near”
  simplified_phrase: He thought to himself, “Now may the time for mourning for my father come soon”
  preserved_meaning: Esau inwardly wished for the mourning period after his father's death to approach.
