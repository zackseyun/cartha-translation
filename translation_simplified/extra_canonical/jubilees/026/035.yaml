  text: “Your descendants will be uprooted from under heaven.” Esau hated Jacob because their father had given Jacob the blessing. He thought to himself, “Now may the time for mourning for my father come soon. Then I will kill my brother Jacob.”
  philosophy: optimal-equivalence
