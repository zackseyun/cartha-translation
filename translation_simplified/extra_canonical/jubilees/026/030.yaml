  simplified_phrase: cried out loudly in bitter anguish
  preserved_meaning: His cry was intense, loud, and filled with bitter pain.
  reasoning_layer_used: POB translation and source wording
  rationale: Natural English preserves both the force and bitterness of his cry.
- pob_phrase: he has supplanted me these two times
  simplified_phrase: He has cheated me twice
  preserved_meaning: Jacob twice obtained what Esau claimed belonged to him.
  reasoning_layer_used: POB wording, immediate context, and grounding review
  rationale: This keeps the accusation clear without implying that Jacob literally took Esau’s place.
- pob_phrase: my birthright
