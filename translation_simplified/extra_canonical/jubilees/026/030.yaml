translation:
  language: en
  text: 'He cried out loudly in bitter anguish and said to his father, “Father, bless me too!”


    His father answered, “Your brother came by deceit and took away your blessings.”


    He replied, “Now I understand why he is named Jacob. He has cheated me twice. First he took my rights as the firstborn, and now he has taken my blessing.”'
  philosophy: optimal-equivalence
