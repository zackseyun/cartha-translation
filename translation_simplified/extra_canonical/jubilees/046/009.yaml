translation:
  language: en
  text: in the land of Egypt. All his brothers died after he did. In the second year of the second seven-year period within the forty-seventh jubilee, the king of Egypt went out to fight against the king of Canaan. The Israelites brought out the remains of all Jacob’s sons, except Joseph’s remains. They buried them in the field, in the double cave in the mountain.
