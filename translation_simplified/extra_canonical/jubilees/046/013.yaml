    unchanged: false
    changes_summary: Replaced the initial infinitive-like phrase with a finite clause matching the source ('and he oppressed them'); changed 'sons' to 'children' for a more natural collective rendering; removed 'before' and kept 'lest they multiply' closer to the source; repeated 'oppress' for consistency with the same verb; and changed 'go out from our land' to 'go up from our land' to reflect the source wording.
translation:
  language: en
  text: He oppressed them and said to the people of Egypt, “Look! The Israelites outnumber us and are stronger than we are. Come, let us act shrewdly toward them before their numbers grow. Let us oppress them by enslaving them. Otherwise, war may come upon us, and they may join our enemies and leave our land. Their hearts and faces are turned toward the land of Canaan.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the people of the children of Israel are more and stronger than we are
  simplified_phrase: The Israelites outnumber us and are stronger than we are
  preserved_meaning: Israel’s people are more numerous and stronger than the Egyptians.
  reasoning_layer_used: POB translation
  rationale: “Israelites” and “outnumber” state the comparison in natural English.
- pob_phrase: let us oppress them with servitude
  simplified_phrase: Let us oppress them by enslaving them
  preserved_meaning: The Egyptians intend to oppress Israel by reducing the people to servitude.
  reasoning_layer_used: POB translation and grounding review
  rationale: “Enslaving” clearly preserves servitude without adding unsupported hard labor.
- pob_phrase: go out from our land
  simplified_phrase: leave our land
  preserved_meaning: The feared outcome is Israel’s departure from Egypt.
  reasoning_layer_used: applied source-review revision
  rationale: “Leave” is plain English and preserves the reviewed Ge’ez sense “go out.”
translation_notes:
  risk_flags:
  - risk: The image of hearts and faces turned toward Canaan may be unfamiliar.
    mitigation: The concrete image is retained because it conveys both inward desire and outward orientation.
