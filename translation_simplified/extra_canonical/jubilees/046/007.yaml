translation:
  language: en
  text: Egypt and killed him there. He pursued them toward Egypt as far as the entrance to Eromon, but he could not enter. Another new king had risen to rule Egypt, and this king was stronger than he was. So he returned to the land of Canaan. Egypt’s gate was shut, and no one entered or left Egypt.
