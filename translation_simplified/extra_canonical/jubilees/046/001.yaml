  preserved_meaning: Their inward unity appeared in mutual love and practical help.
  reasoning_layer_used: applied revision preserving “in their hearts”
  rationale: The shorter wording retains the heart image and keeps love and help distinct.
- pob_phrase: they increased abundantly and multiplied exceedingly
  simplified_phrase: Their numbers grew more and more
  preserved_meaning: Their population increased to a very great degree.
  reasoning_layer_used: source review identifying repeated multiplication language
  rationale: The repeated common wording preserves the strong emphasis on numerical growth.
