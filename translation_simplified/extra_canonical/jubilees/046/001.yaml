    changes_summary: Refined 'of one accord' to 'united' for naturalness, adjusted the clause to reflect purpose/result more clearly ('so that each loved his brother and a man helped his brother'), and removed 'life' after Joseph since it is not explicit in the source. Also changed 'throughout' to 'during' for smoother formal English.
translation:
  language: en
  text: 'After Jacob died, Israel’s descendants increased in the land of Egypt until they became a numerous people. They were all united in heart: each loved his brother and helped him. Their numbers grew more and more during all of Joseph’s days, for seventy years.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “ten weeks of years,” meaning ten periods of seven years.
    reason: cultural_note
