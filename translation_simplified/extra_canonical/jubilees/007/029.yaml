translation:
  language: en
  text: In the fifth year, set this practice aside as required.[a] Do this with righteousness and integrity. Then you will be righteous, and everything you plant will prosper.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “make the release.” The exact command is uncertain, but it probably refers to setting aside an agricultural practice connected with the preceding firstfruits law.
    reason: alternative_reading
