translation:
  language: en
  text: 'My children, [love] one another. I can see that the demons have begun to sin against you and your children. Now I am afraid that after I die, you will shed human blood on the earth and will yourselves be wiped from its face.


    Everyone who sheds human blood, and everyone who consumes the blood of any living creature, will be destroyed from the earth. No one who eats blood or sheds human blood on the earth will remain. None of his offspring or descendants will survive under heaven. They will go to Sheol. They will descend to the place of judgment and enter the darkness of the deep. All of them will die a violent death.


    Whenever you slaughter a wild animal, livestock, or anything that moves along the ground, do not let its blood be charged against you. Do what is good for your own lives by covering with earth the blood poured out on the ground. Do not eat meat with its blood. Be determined never to eat blood; cover it instead. I was commanded to give this warning to you, your children, and all flesh. Do not eat an animal’s life—its blood—along with its flesh. Then your own lifeblood will not be demanded from any creature that spills it on the earth. The earth cannot be cleansed from blood poured out on it except by the blood of the one who shed it. This is how the earth must be cleansed throughout every generation.


    Now, my children, listen. Practice justice and righteousness so that you may take root in righteousness throughout the earth. Then your honor may rise before my God, who saved me from the floodwaters. Now go, build cities for yourselves, and plant in them every kind of plant and every fruit-bearing tree.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving record combines this long instruction into one verse, though fuller editions may divide it into several verse units.
    reason: source_note
