translation:
  language: en
  text: First he prepared the young goat. He put some of its blood on the sacrificial meat on the altar he had built. Then he offered all the goat’s fat on that altar, where he had made the burnt offering. He also offered the ox, the ram, and the sheep.
  philosophy: optimal-equivalence
