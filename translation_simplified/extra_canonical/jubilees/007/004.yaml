  preserved_meaning: The animal remains a juvenile goat.
  reasoning_layer_used: POB base text and source payload
  rationale: “Young goat” avoids the usual modern meaning of “kid” as a child.
- pob_phrase: the flesh that was on the altar which he had made
  simplified_phrase: the sacrificial meat on the altar he had built
  preserved_meaning: The blood was put on animal flesh already on the constructed altar.
  reasoning_layer_used: Immediate sacrificial context and POB base text
  rationale: This wording makes the ritual setting and the sense of “made” clear.
- pob_phrase: all its fat
  simplified_phrase: all the goat’s fat
  preserved_meaning: He offered all the fat belonging to the young goat.
  reasoning_layer_used: Applied revision and POB base text
  rationale: Naming the goat clarifies the pronoun without changing its referent.
