translation:
  language: en
  text: For the first three years, no one is to harvest the fruit of anything edible. In the fourth year, they are to harvest its fruit and offer its firstfruits before the LORD Most High, who created heaven, earth, and all things. These firstfruits are acceptable to him. They are to offer generous amounts of the first wine and oil as firstfruits on the LORD’s altar, and he receives them. Those who serve in the LORD’s house are to eat what remains before the altar that receives it.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: For three years the fruit of everything that is eaten shall not be gathered
  simplified_phrase: For the first three years, no one is to harvest the fruit of anything edible
  preserved_meaning: The fruit used for food must remain unharvested throughout the three-year period.
  reasoning_layer_used: Applied source-grounded grammatical revision
  rationale: This preserves the revised genitive sense while expressing the passive rule as a clear command.
- pob_phrase: the firstfruits acceptable before the LORD Most High ... shall be offered up
  simplified_phrase: offer its firstfruits before the LORD Most High ... These firstfruits are acceptable to him
  preserved_meaning: The fourth-year firstfruits offered before God are described as acceptable to him.
  reasoning_layer_used: POB translation and independent grounding review
  rationale: The present-tense sentence preserves acceptability as a description rather than a future result.
- pob_phrase: Let them offer in abundance the first wine and oil as firstfruits on the altar of the LORD, who receives it
  simplified_phrase: They are to offer generous amounts of the first wine and oil as firstfruits on the LORD’s altar, and he receives them
  preserved_meaning: Abundant first portions of wine and oil are offered on the LORD’s altar and received by him.
  reasoning_layer_used: POB translation
  rationale: The wording makes abundance and divine reception clear without weakening the ritual command.
translation_notes:
  risk_flags:
  - risk: “Anything edible” could be read more broadly than fruit-bearing food sources.
    mitigation: The phrase retains the POB’s broad source-grounded scope and immediately refers to its fruit.
  - risk: The altar is personified as receiving the remaining offering in the final clause.
    mitigation: The source-language image is retained rather than replaced with an explanatory paraphrase.
