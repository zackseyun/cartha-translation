translation:
  language: en
  text: These are Noah’s sons. During the twenty-eighth jubilee, Noah began instructing his grandsons in the ordinances, commandments, and judgments he knew they must obey. He solemnly urged his sons to do what is right, to cover their nakedness, to bless their Creator, to honor their father and mother, to love their neighbors, and to guard themselves from sexual immorality, impurity, and every kind of injustice.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: his sons' sons
  simplified_phrase: his grandsons
  preserved_meaning: Noah instructed the next generation descended through his sons.
  reasoning_layer_used: POB text and immediate context
  rationale: The common kinship term states the same relationship directly.
- pob_phrase: command the ordinances and the commandments to his sons' sons, and all the judgments that he knew
  simplified_phrase: instructing his grandsons in the ordinances, commandments, and judgments he knew they must obey
  preserved_meaning: Noah passed on the full body of binding requirements known to him.
  reasoning_layer_used: POB text and grounding review
  rationale: The wording is natural while preserving the force of authoritative commands.
- pob_phrase: cover the shame of their flesh
  simplified_phrase: cover their nakedness
  preserved_meaning: They were commanded to cover bodily nakedness regarded as shameful.
  reasoning_layer_used: POB image and grounding review
  rationale: This clarifies the idiom without limiting it to particular body parts.
interpretive_expansions:
- pob_phrase: command the ordinances and the commandments
  rendering: ordinances, commandments, and judgments he knew they must obey
  claim: The instruction concerned binding requirements rather than general teaching.
  evidence:
  - The POB says Noah began to command these requirements.
  - The grounding review warns against weakening their imperative force.
  confidence: high
  alternatives_preserved:
  - instructing them in binding ordinances, commandments, and judgments
translation_notes:
  risk_flags:
