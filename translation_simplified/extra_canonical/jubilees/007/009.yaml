  preserved_meaning: Noah awoke following his use of wine.
  reasoning_layer_used: POB translation
  rationale: The new wording makes the unusual idiom natural without claiming that Noah had fully sobered up.
- pob_phrase: a lowly slave
  simplified_phrase: a slave of low status
  preserved_meaning: Canaan is cursed to occupy a degraded position of servitude.
  reasoning_layer_used: POB footnote and applied revision
  rationale: The wording clarifies social position while preserving the Ethiopic image of lowly servitude.
