translation:
  language: en
  text: When Noah woke up after drinking wine, he learned everything his youngest son had done to him. Then he cursed his son and said, “Canaan is cursed! He will be a servant of low status[a] to his brothers.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ethiopic literally uses a phrase like “slave of lowness” or “slave of servitude,” rather than the familiar wording “servant of servants” in Genesis.
    reason: lexical_alternative
