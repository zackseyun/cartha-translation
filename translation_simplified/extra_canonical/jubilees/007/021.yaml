  language: en
  text: and uncleanness and every kind of lawlessness. These three sins were why the flood came upon the earth. The Watchers committed sexual immorality by pursuing human women, in defiance of the rules laid down for them. They took as wives any women they chose. They were the ones who first introduced uncleanness.
