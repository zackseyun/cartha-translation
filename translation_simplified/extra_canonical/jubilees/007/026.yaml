translation:
  language: en
  text: 'the blood they shed on the earth. He destroyed everything. Only I, you, my children, and everyone who entered the ark with us survived. Look, I see what you are doing: you are not living righteously. You have begun to follow corrupt paths. You are separating from one another, and you will fight against each other instead of remaining united.'
