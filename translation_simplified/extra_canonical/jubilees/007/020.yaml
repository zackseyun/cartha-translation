  text: During the twenty-eighth period of forty-nine years, Noah began teaching his grandchildren all the rules, commands, and judgments he knew. He solemnly instructed his children to do what is right, keep their private parts covered, praise their Creator, honor their fathers and mothers, love their neighbors, and protect themselves from sexual immorality, impurity, and every kind of wrongdoing.
