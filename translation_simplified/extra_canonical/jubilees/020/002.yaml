translation:
  language: en
  text: They were to circumcise their sons according to the covenant made with them.[a] They were not to turn to the right or the left from any path the LORD had commanded. We must keep ourselves from every kind of sexual immorality and impurity, and remove every such act from among us. If any woman among you, or even a daughter, commits sexual immorality, burn her with fire.[b] They must not commit sexual immorality by following what their eyes see and their hearts desire. They must not marry women descended from Canaan, because Canaan’s descendants will be uprooted from the land. He also told them about the judgment of the Watchers.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The wording is compressed in this ancient witness; the reference to circumcising sons is inferred from the Abrahamic covenant.
    reason: lexical_alternative
  - marker: b
    text: The ancient text states this severe command explicitly and in legal terms.
    reason: cultural_note
  - marker: c
    text: The Watchers are rebellious heavenly beings whose punishment is described in the Enochic tradition.
    reason: cross_reference
