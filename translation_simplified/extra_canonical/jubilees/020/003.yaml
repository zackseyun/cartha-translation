translation:
  language: en
  text: 'Sodom was judged for its wickedness—for the sexual immorality, impurity, and corruption among its people. Because of sexual immorality, they died. You too must guard yourselves against all sexual immorality, impurity, and every form of sinful defilement, so that you do not make your name a curse, your whole life a disgrace, and all your sons subject to destruction by the sword. You may become accursed like Sodom, and all who remain of you may become like the people of Gomorrah. I testify to you, my children: love him.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Him” refers forward to the God of heaven in the next verse.
    reason: source_note
