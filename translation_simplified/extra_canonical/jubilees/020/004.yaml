  text: …the God of heaven, and hold firmly to all his commandments. Do not follow their idols or their uncleanness. Do not make gods of cast metal or carve images for yourselves. They are empty and have no spirit in them. They are the work of human hands, and everyone who trusts in them trusts in nothing. Do not serve them or bow down to them. Instead, serve the God…
