translation:
  language: en
  text: In the forty-second jubilee, during the first year of its seventh seven-year period, Abraham called together Ishmael and his twelve sons, Isaac and his two sons, and Keturah’s six sons and their children. He commanded them to follow the way of the LORD and do what is right. Each one was to love his brother and live this way among all peoples. They were to walk together, practicing justice and righteousness on the earth.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ge'ez wording of the final clause is dense; it may also emphasize how each person should act toward the others.
    reason: source_note
simplification_decisions:
- pob_phrase: in the first year of the seventh week
  simplified_phrase: during the first year of its seventh seven-year period
  preserved_meaning: The date remains within the seventh chronological week of the forty-second jubilee.
  reasoning_layer_used: source context and POB chronology
  rationale: “Seven-year period” prevents readers from mistaking this week for seven days.
- pob_phrase: called Ishmael and his twelve sons, and Isaac and his two sons
  simplified_phrase: called together Ishmael and his twelve sons, Isaac and his two sons
  preserved_meaning: Abraham gathered the named descendants, including Isaac’s specified two sons.
  reasoning_layer_used: applied source revision
  rationale: “Called together” states the gathering naturally while retaining the source-confirmed number two.
- pob_phrase: that he should thus be among all people, walking together to practice justice and righteousness
  simplified_phrase: live this way among all peoples. They were to walk together, practicing justice and righteousness
  preserved_meaning: Each person’s public conduct and their shared practice of justice and righteousness are both retained.
  reasoning_layer_used: POB footnote and applied grammar revisions
  rationale: Two sentences clarify the shift from singular responsibility to collective action without removing the walking image.
interpretive_expansions:
- pob_phrase: the seventh week
  rendering: its seventh seven-year period
  claim: In this chronological setting, “week” refers to a period of seven years.
  evidence:
  - The verse dates the event by both jubilee and year within a numbered week.
  - The POB presents the phrase as chronological rather than as an ordinary week of days.
  confidence: high
  alternatives_preserved:
  - the seventh week
  - the seventh week of years
translation_notes:
  risk_flags:
  - risk: The dense final clause allows more than one way to relate individual and collective conduct.
    mitigation: The main text preserves both ideas, and the footnote acknowledges the remaining ambiguity.
