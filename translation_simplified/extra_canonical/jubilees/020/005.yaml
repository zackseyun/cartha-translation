  text: Worship the Most High, and continually bow down before him. Seek his face at all times. Live uprightly and do what is right before him, so that he may guide you, show you mercy, send you rain in the morning and evening,[a] and bless all the work you do on earth and all your grain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Rain in the morning and evening” may mean timely rains for the growing seasons, like the familiar expression “early and late rain.”
    reason: lexical_alternative
