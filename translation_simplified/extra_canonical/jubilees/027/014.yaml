translation:
  language: en
  text: “May he give you and your descendants the blessings of my father Abraham, so that you may inherit the land where you are living as a foreigner, together with all the land God gave to Abraham. Go in peace, my son.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: to you and to your seed after you
  simplified_phrase: you and your descendants
  preserved_meaning: The blessings extend to him and to the generations who come from him.
  reasoning_layer_used: POB base text
  rationale: “Descendants” expresses the family line clearly in modern English.
- pob_phrase: the land of your sojourning
  simplified_phrase: the land where you are living as a foreigner
  preserved_meaning: He currently lives in the land as a foreign resident without yet possessing it.
  reasoning_layer_used: source payload and POB base text
  rationale: This explains “sojourning” while preserving his present foreign-resident status.
- pob_phrase: so that you may inherit the land of your sojourning and all the land
  simplified_phrase: so that you may inherit the land where you are living as a foreigner, together with all the land
  preserved_meaning: The blessings are given with his inheritance of the whole land in view.
  reasoning_layer_used: POB base text and grounding review
  rationale: Keeping “so that” preserves the explicit purpose or result connection.
translation_notes:
  risk_flags:
  - risk: Readers may expect the singular “blessing” from the Genesis parallel.
    mitigation: The text retains plural “blessings” because the Ge'ez form is plural.
