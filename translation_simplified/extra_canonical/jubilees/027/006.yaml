translation:
  language: en
  text: Jacob said to his mother Rebekah, “You know that my father is old and cannot see because his eyes are dim. If I leave him, he will think I have done wrong by leaving him and going away from you.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: has become old and does not see
  simplified_phrase: is old and cannot see
  preserved_meaning: Jacob’s father is elderly and unable to see.
  reasoning_layer_used: POB translation and source clause
  rationale: Common wording states the same condition more directly.
- pob_phrase: it will be evil in his sight
  simplified_phrase: he will think I have done wrong
  preserved_meaning: Jacob expects his father to judge his departure as wrongdoing.
  reasoning_layer_used: POB contextual meaning
  rationale: The idiom describes his father’s moral judgment, not his physical sight.
- pob_phrase: because I have left him and gone away from you
  simplified_phrase: by leaving him and going away from you
  preserved_meaning: The perceived wrong consists of Jacob leaving his father and going away from Rebekah.
  reasoning_layer_used: POB translation and source sequence
  rationale: The causal clause is recast naturally without implying abandonment.
