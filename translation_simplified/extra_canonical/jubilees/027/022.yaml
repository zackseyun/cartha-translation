translation:
  language: en
  text: Jacob left the Well of the Oath and set out for Haran. This was during the first year of the second seven-year period in the forty-fourth jubilee cycle. On the new moon of the first month of that period, he reached Luz in the hill country, also called Bethel. Toward evening, he came to a place. That night he left his route and went to the west side of the road. He slept there because the sun had set.
  philosophy: optimal-equivalence
