translation:
  language: en
  text: Everything happened to the two men just as Joseph had explained it would. Pharaoh returned his chief wine steward[a] to his position, but he had the baker killed. Yet the wine steward forgot about Joseph in prison. Although Joseph had told him what would happen, the steward did not remember to tell Pharaoh what Joseph had said.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally “chief cupbearer,” the official responsible for serving Pharaoh’s wine.
    reason: cultural_note
  - marker: b
    text: The transmitted Ethiopic is awkward here; it apparently means that the steward forgot Joseph and did not report his words to Pharaoh.
    reason: textual_variant
