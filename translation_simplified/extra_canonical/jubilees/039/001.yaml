  preserved_meaning: Jacob’s father had resided in Canaan as a foreigner rather than as in a settled homeland.
  reasoning_layer_used: POB base text and source image
  rationale: This explains “sojourning” while preserving the idea of foreign residence.
- pob_phrase: These are the generations of Jacob
