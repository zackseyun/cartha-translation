translation:
  language: en
  text: Jacob lived in Canaan, the land where his father had lived as a foreigner. This is the history of Jacob’s family. When Joseph was seventeen years old, he was taken down to Egypt. Potiphar, one of Pharaoh’s officers and the chief of Pharaoh’s guards, bought him.
