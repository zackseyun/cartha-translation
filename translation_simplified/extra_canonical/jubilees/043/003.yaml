translation:
  language: en
  text: After they had left, Joseph told the man in charge of his household, “Chase after them and catch them. Say to them, ‘You have repaid my kindness with evil. You stole from me the silver cup my lord drinks from.’ Then bring their youngest brother back to me. Bring him quickly, before I judge the matter.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The final clause is difficult in the source; it appears to demand that the youngest brother be brought back at once for judgment.
    reason: source_note
