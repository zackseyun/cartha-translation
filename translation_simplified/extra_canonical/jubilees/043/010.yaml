  language: en
  text: his slaves. “Look, we are our master’s slaves, and so are our donkeys.” Joseph replied, “May God keep me from doing such a thing![10] Go back to your homes. Only your youngest brother will be my slave, because you have done evil. Did you not know that a man can certainly use his cup to uncover hidden things by divination, as I do?”
