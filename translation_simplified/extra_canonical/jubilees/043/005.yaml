translation:
  language: en
  text: of Canaan. So why would we steal any goods? Here we are with our sacks—search them. If you find the cup in any man’s sack, put that man to death. Then we and our donkeys will also become our lord’s servants.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: How then should we steal any goods?
  simplified_phrase: So why would we steal any goods?
  preserved_meaning: The speakers firmly deny that they would steal property.
  reasoning_layer_used: POB translation and applied revision
  rationale: The natural question keeps “goods,” the source-driven term for property.
- pob_phrase: Look, we and our sacks—search them.
  simplified_phrase: Here we are with our sacks—search them.
  preserved_meaning: They present themselves and their sacks for inspection.
  reasoning_layer_used: POB translation
  rationale: The recast wording makes the invitation to search immediately clear.
- pob_phrase: with whomever you find the cup in the sack of any one man among us, let him be put to death
  simplified_phrase: If you find the cup in any man’s sack, put that man to death.
  preserved_meaning: The man whose sack contains the cup is to receive the proposed punishment.
  reasoning_layer_used: POB translation
  rationale: A direct conditional replaces the dense clause without weakening its force.
