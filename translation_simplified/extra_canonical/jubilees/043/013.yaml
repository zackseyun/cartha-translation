translation:
  language: en
  text: “Let me, your servant, stay here in the boy’s place and serve my lord. Let the young man return with his brothers. I promised your servant, our father, that I would be responsible for him. If I do not bring him back, I will bear the blame before our father for the rest of our lives.”[13]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '13'
    text: The transmitted Ge'ez is compressed and somewhat irregular; this translation preserves the main sense that Judah offers himself in the boy’s place because he is responsible to his father.
    reason: source_note
