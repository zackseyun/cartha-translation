translation:
  language: en
  text: Joseph made a plan to find out what his brothers were thinking—whether they had peaceful intentions toward one another. He told the manager of his household, “Fill all their sacks with grain, and put their money back inside their bags. Then put my silver drinking cup in the youngest brother’s sack.” Then Joseph sent them on their way.
