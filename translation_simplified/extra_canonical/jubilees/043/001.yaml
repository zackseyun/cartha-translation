simplification_decisions:
- pob_phrase: devised a plan by which he might know their thoughts
  simplified_phrase: made a plan to find out what his brothers were thinking
  preserved_meaning: Joseph deliberately formed a plan to discover their thoughts.
  reasoning_layer_used: POB translation and immediate narrative context
  rationale: The direct wording keeps both the plan and its investigative purpose.
- pob_phrase: whether there was a thought of peace among them
  simplified_phrase: whether they had peaceful intentions toward one another
  preserved_meaning: Joseph wanted to learn whether the brothers had peaceable thoughts within their group.
  reasoning_layer_used: POB translation and grounding review
  rationale: This preserves present peaceful intent without adding an ongoing future commitment.
- pob_phrase: the man who was over his house
  simplified_phrase: the manager of his household
  preserved_meaning: Joseph spoke to the servant responsible for managing his household.
  reasoning_layer_used: POB translation and cultural role
  rationale: The historical responsibility is expressed through a familiar modern role.
interpretive_expansions:
- pob_phrase: their thoughts ... among them
  rendering: what his brothers were thinking ... toward one another
  claim: The men Joseph was testing were his brothers, and the peace in question concerned their relationships within the group.
  evidence:
  - The immediate narrative identifies the men with the sacks as Joseph’s brothers.
  - The words “among them” locate the peaceful intent within that group.
  confidence: high
  alternatives_preserved:
