translation:
  language: en
  text: “I will take him as a servant, but the rest of you may return home in peace.” Then they searched through their belongings, starting with the oldest and ending with the youngest. It was found in Benjamin’s sack.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: you may go in peace to your houses
  simplified_phrase: the rest of you may return home in peace
  preserved_meaning: The others are permitted to leave peacefully and go home.
  reasoning_layer_used: POB text and immediate context
  rationale: “Return home” is more natural than “go to your houses,” while “the rest of you” clearly contrasts them with the man kept as a slave.
- pob_phrase: while they were searching in their goods
  simplified_phrase: Then they searched through their belongings
  preserved_meaning: Their possessions were examined in sequence.
  reasoning_layer_used: POB text
  rationale: “Belongings” clearly expresses the older sense of “goods,” and a separate sentence makes the action easier to follow.
interpretive_expansions:
- pob_phrase: you may go in peace to your houses
  rendering: the rest of you may return home in peace
  claim: The permission applies to those other than the man Joseph says he will take as a slave.
  evidence:
  - The preceding clause singles out one man to be taken as a slave.
  - The plural “you” addresses the remaining group.
  confidence: high
