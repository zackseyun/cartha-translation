translation:
  language: en
  text: They must not carry anything from one house to another on this day, because it is holy and blessed above every jubilee day of jubilees.[a] We observed the Sabbath on this day in heaven before any human being was told to observe it on earth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The phrase “holy and blessed above every jubilee day of jubilees” is difficult. It may strongly emphasize that the weekly Sabbath stands above even the highest festival cycles; another possible wording is “above any day of jubilees.”
    reason: alternative_reading
