translation:
  language: en
  text: The waters gathered in one place outside the dome of the sky, and dry land appeared. On that day, God made all the seas, each gathered in its own place; every river; all the places where water gathers in the mountains and throughout the earth; every lake; all the dew on the ground; seed for sowing; every sprouting plant; fruit-bearing trees; forests; and the Garden of Eden in Eden, made for delight. These were the four great kinds of things God made on the third day.[1]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: The source probably groups this long list into four broad kinds, but the exact grouping is uncertain.
    reason: source_note
