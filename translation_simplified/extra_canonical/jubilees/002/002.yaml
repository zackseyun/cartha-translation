translation:
  language: en
  text: For on the first day, he created the heavens above, the earth, the waters, and all the spirits who serve before him:[1] the angels of the presence, the angels of sanctification, the angels of the spirit of fire, the angels of the spirit of clouds, and of darkness, snow, hail, and frost, the angels of voices, thunder, and lightning, and the angels of the spirits of cold, heat, winter, spring, harvest, and summer. He also created all the spirits of his works that are in the heavens, on the earth, in the seas, in the depths, in darkness, in night, in light, in dawn, and in morning, which he prepared in the knowledge of his heart.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: The Ethiopic list is very compressed and may contain some textual corruption, so its sequence is preserved rather than smoothed out.
    reason: source_note
