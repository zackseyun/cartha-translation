    On the sixth day he made every wild animal of the earth, all the livestock, and everything that moves along the ground. After all these, he made humankind. He made them male and female and gave them authority over everything on earth and in the seas: everything that flies, the wild animals, the livestock, everything that moves along the ground, and the whole earth. He gave them authority over all these things. He made four kinds on the sixth day, bringing the total to twenty-two kinds.


    He finished all his work on the sixth day—everything in the heavens, on the earth, in the seas and the depths, in the light and the darkness, and everywhere else. Then he gave us the Sabbath day as a great sign: we are to work for six days and rest from all work on the seventh day.


    He told all the angels of the presence and all the angels of sanctification—these two great kinds—“Let us rest with him in heaven and on earth.”


    Then he said to me, “Look, I will set apart for myself one people from among all peoples. They will keep the Sabbath, and I will make them holy as my own people and bless them. Just as I made the Sabbath day holy, I will make them holy for myself and bless them. They will be my people, and I will be their God.


    “I have chosen the descendants of Jacob from among all whom I have seen. I have recorded Jacob as my firstborn son and made him holy for myself forever. I will teach his descendants about the Sabbath day so that they may rest from all work on it.”


    In this way he made the Sabbath a sign that they should rest with us on the seventh day. On that day they are to eat, drink, and bless the one who created everything. He blessed and made holy for himself a people to be his own possession, chosen from all the nations, so that they might keep the Sabbath together with us. He caused his will to rise before him every day like a pleasing fragrance that he accepts.


    There were twenty-two heads in the human line from Adam to Jacob, and twenty-two kinds of work were made before the seventh day. The one is blessed and holy, and the other is also blessed and holy. Both were appointed for holiness and blessing.[a] It was granted that they should remain blessed and holy for all time, according to the testimony and the first law, just as the seventh day was made holy and blessed.


    He created heaven, earth, and everything else in six days. God made the seventh day holy in relation to all his works. Therefore he commanded that anyone who does any work on that day must die, and anyone who defiles it must surely die.


    Command the children of Israel to keep this day and treat it as holy. They must not do any work on it or defile it, because it is holier than every other day. Anyone who treats it as unholy must surely die, and anyone who does any work on it must surely die forever. Thus the children of Israel must keep this day throughout their generations so that they are not uprooted from the land, for it is a holy and blessed day. Every person who keeps it and rests from all work on it will be holy and blessed for all time, like us.[12]'
