base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/jubilees/002/029.yaml
  text: 'Likewise declare and say to the children of Israel the law of this day: that they are to keep sabbath on it, and that they are not to forsake it in the error of their hearts so as to do any work on it that is not fitting, or to do on it their own pleasure, or to prepare on it anything to be eaten or drunk, or to draw water, or to bring in or take out through their gates any burden that they had not prepared for themselves on the sixth day.'
  footnotes:
  - marker: a
    text: Or 'prepared for themselves in their dwellings on the sixth day.'.
    reason: previous_rendering
  - marker: b
    text: Or 'And declare and say'.
    reason: previous_rendering
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T20:33:55Z'
    unchanged: true
    changes_summary: No changes needed.
translation:
  language: en
  text: 'In the same way, tell the people of Israel the law concerning this day: They must observe it as a Sabbath and must not abandon it by letting their hearts lead them astray. On that day they must not do any work that is improper or do whatever they please. They must not prepare anything to eat or drink, draw water, or carry any load through their gates, whether in or out, unless they had prepared it for themselves on the sixth day.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: An alternate textual tradition reads, “prepared for themselves in their dwellings on the sixth day.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: Likewise declare and say to the children of Israel the law of this day
  simplified_phrase: In the same way, tell the people of Israel the law concerning this day
  preserved_meaning: The command remains linked to the preceding instruction and gives Israel the law for this day.
  reasoning_layer_used: applied lexical revision and POB base text
  rationale: “In the same way” preserves the revised meaning of “likewise” in natural English.
- pob_phrase: any work on it that is not fitting, or to do on it their own pleasure
  simplified_phrase: any work that is improper or do whatever they please
  preserved_meaning: Both improper Sabbath work and pursuing one's own pleasure remain prohibited.
  reasoning_layer_used: POB base text and grounding review
  rationale: “Improper” preserves the broad force of “not fitting” without narrowing it to codified prohibitions.
- pob_phrase: to bring in or take out through their gates any burden that they had not prepared for themselves on the sixth day
  simplified_phrase: carry any load through their gates, whether in or out, unless they had prepared it for themselves on the sixth day
  preserved_meaning: A load may not be carried through the gates in either direction unless it was prepared on the sixth day.
  reasoning_layer_used: POB base text, applied revision, and grounding review
  rationale: The conditional wording makes the restriction clear without restoring the unsupported dwelling phrase.
translation_notes:
  risk_flags:
  - risk: The act of preparing a load remains culturally unclear to modern readers.
    mitigation: The conditional relation is clarified while the source-driven wording and textual alternative are preserved.
