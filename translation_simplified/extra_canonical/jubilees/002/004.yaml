translation:
  language: en
  text: He made seven great works on the first day. On the second day, he made the firmament, a vault between the waters, and divided the waters. Half of the waters rose above it, and half went down beneath it. The firmament stood between them, above the surface of the whole earth. That was the only work he made that day.
