  yaml_path: translation/extra_canonical/jubilees/002/031.yaml
  text: And the Creator of all blessed it[31], but he did not sanctify all peoples and nations to keep sabbath on it; Israel alone—to it alone he granted to eat and drink and keep sabbath on it upon the earth.
  footnotes:
  - marker: '31'
    text: The text states that the Creator blessed the day but did not sanctify all peoples and nations to keep Sabbath on it; Israel alone receives that sanctified earthly observance. This is a theological claim of election in sacred time, not merely an ethnic aside.
    reason: cross_reference
  - marker: a
    text: Or 'he gave to eat and drink'.
    reason: previous_rendering
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T20:33:28Z'
    unchanged: false
    changes_summary: Removed the unnecessary explanatory words 'that they should' for a more direct and natural rendering while preserving the source sense.
translation:
  language: en
  text: 'The Creator of all blessed that day. But he did not set apart every people and nation to observe the Sabbath on it. He granted this only to Israel: to eat, drink, and observe the Sabbath on that day upon the earth.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: blessed it
  simplified_phrase: blessed that day
  preserved_meaning: The Creator blessed the Sabbath day under discussion.
  reasoning_layer_used: POB text and footnote 31
  rationale: Naming “that day” makes the pronoun clear without adding a new claim.
- pob_phrase: did not sanctify all peoples and nations to keep sabbath on it
  simplified_phrase: did not set apart every people and nation to observe the Sabbath on it
  preserved_meaning: Not all peoples were consecrated for Sabbath observance.
  reasoning_layer_used: POB text and footnote 31
  rationale: “Set apart” and “observe” express the sacred distinction in common English.
- pob_phrase: Israel alone—to it alone he granted to eat and drink and keep sabbath on it
  simplified_phrase: 'He granted this only to Israel: to eat, drink, and observe the Sabbath on that day'
  preserved_meaning: Israel alone received the privilege of Sabbath meals and observance.
  reasoning_layer_used: POB revision history and source review
  rationale: The recast sentence clearly attaches the granted privilege to Israel and avoids suggesting that God merely supplied food.
translation_notes:
  risk_flags:
  - risk: “Set apart” may sound less technical than “sanctify.”
    mitigation: The wording retains the sacred distinction and its connection to Sabbath observance.
  - risk: “Granted this” could be read as permission rather than election.
    mitigation: “Only to Israel” preserves the POB claim that Israel uniquely received this sacred observance.
