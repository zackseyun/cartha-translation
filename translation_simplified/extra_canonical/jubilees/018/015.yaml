translation:
  language: en
  text: 'Then he said, “I swear by myself, says the LORD: Because you have done this and have not withheld from me your son—your firstborn, whom you love—I will certainly bless you. I will make your descendants as numerous as the stars in heaven and the sand on the seashore. Your descendants will inherit the cities of their enemies.”'
