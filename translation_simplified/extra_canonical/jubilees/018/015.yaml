- pob_phrase: By myself I have sworn
  simplified_phrase: I swear by myself
  preserved_meaning: The LORD guarantees the promise by swearing on his own authority.
  reasoning_layer_used: POB translation
  rationale: The active present form is clearer while preserving the solemn oath.
- pob_phrase: your son, your firstborn, your beloved one
  simplified_phrase: your son—your firstborn, whom you love
  preserved_meaning: The son is identified as Abraham’s firstborn and beloved son.
  reasoning_layer_used: applied revision
  rationale: The clause clearly shows that all three descriptions refer to the same son.
- pob_phrase: multiplying I will multiply your seed
  simplified_phrase: I will make your descendants as numerous
  preserved_meaning: The LORD promises to increase Abraham’s offspring beyond counting.
  reasoning_layer_used: POB translation and source image
  rationale: Common wording replaces the emphatic idiom while retaining its force and the following comparison.
