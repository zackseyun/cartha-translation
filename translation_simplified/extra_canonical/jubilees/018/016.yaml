translation:
  language: en
  text: “All the nations of the earth will be blessed through your offspring because you obeyed me. You have been faithful to me in everything I told you, and I have shown this to everyone. Go in peace.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: in your seed
  simplified_phrase: through your offspring
  preserved_meaning: The promised blessing comes through Abraham’s line of descent.
  reasoning_layer_used: POB source-driven rendering
  rationale: “Offspring” clearly expresses descent while preserving the possible singular or collective sense.
- pob_phrase: because you have obeyed my voice
  simplified_phrase: because you obeyed me
  preserved_meaning: The blessing follows Abraham’s obedience to God.
  reasoning_layer_used: POB controlling meaning
  rationale: The direct wording communicates the established meaning without the less familiar idiom.
- pob_phrase: I have made known to all that you are faithful to me
  simplified_phrase: You have been faithful to me ... and I have shown this to everyone
  preserved_meaning: God has publicly demonstrated Abraham’s faithfulness.
  reasoning_layer_used: POB text and applied revision
  rationale: Reordering the clauses makes the sentence easier to follow while retaining the scope of “all.”
