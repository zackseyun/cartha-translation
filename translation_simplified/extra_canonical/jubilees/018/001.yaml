  preserved_meaning: The LORD directly addresses Abraham by repeating his name.
  reasoning_layer_used: POB text and source payload
  rationale: “Called to” presents the repeated summons naturally without changing the speaker or action.
- pob_phrase: And he said, “Here I am.” And he said
