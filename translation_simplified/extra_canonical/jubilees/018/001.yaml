translation:
  language: en
  text: 'The LORD called to Abraham, “Abraham! Abraham!”


    Abraham answered, “Here I am.”


    The LORD said, “Take your beloved son Isaac, whom you love, and go to the high land. Offer him up on one of the mountains I will show you.”'
