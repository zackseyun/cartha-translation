translation:
  language: en
  text: Each of you must love your brothers, showing them mercy and treating them rightly. No one must wish evil on his brother, now or ever, for as long as you live. Live this way so that everything you do may prosper and you may not be destroyed.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: love his brothers with mercy and righteousness
  simplified_phrase: love your brothers, showing them mercy and treating them rightly
  preserved_meaning: Love must be expressed through both mercy and right conduct toward one's brothers.
  reasoning_layer_used: POB text and source-supported plural revision
  rationale: The abstract qualities are recast as clear actions while keeping both distinct.
- pob_phrase: desire evil against his brother
  simplified_phrase: wish evil on his brother
  preserved_meaning: No one is to want evil to come upon his brother.
  reasoning_layer_used: POB controlling meaning
  rationale: The familiar expression replaces an awkward literal construction without weakening the prohibition.
- pob_phrase: all the days of your life, so that you may prosper in all your deeds
  simplified_phrase: for as long as you live. Live this way so that everything you do may prosper
  preserved_meaning: The command is lifelong, and obedience is linked to prospering in one's deeds.
  reasoning_layer_used: POB syntax and purpose clause
  rationale: Dividing the long sentence makes the duration and intended outcome easier to follow.
translation_notes:
  risk_flags:
  - risk: Treating them rightly may sound narrower than the full biblical idea of righteousness.
    mitigation: The wording retains right conduct and pairs it with mercy as the POB does.
