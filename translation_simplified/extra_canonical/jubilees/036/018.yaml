translation:
  language: en
  text: There was peace among them. Then they left him, and they rested and slept that day. That same day, Isaac lay down on his bed rejoicing. He fell into the eternal sleep and died at the age of 180. He had completed twenty-five weeks of years plus five years.[18] His two sons buried him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '18'
    text: A “week of years” is seven years, so twenty-five weeks of years plus five years equals 180 years.
    reason: cultural_note
