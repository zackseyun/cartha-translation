  yaml_path: translation/extra_canonical/jubilees/036/010.yaml
  text: And on the day of turmoil and cursing and fury and wrath[10], and with blazing, devouring fire, just as he burned Sodom, so he will burn his land and his city and everything that is his; and he will be blotted out from the book of the discipline of the children of men, and he will not ascend into the book of life, but into that which is appointed for destruction, and he will pass into the eternal curse[10], so that for all days their judgment may be renewed with execration and with cursing and with wrath and with torment and with fury and with plagues and with everlasting disease.
  footnotes:
  - marker: '10'
    text: The clause 'he will be erased from the book of the discipline of the children of men' is textually difficult. The Ge'ez appears to distinguish this record from 'the book of life'; the exact nuance of the first book is uncertain.
    reason: textual_variant
  - marker: '10'
    text: The final sequence piles up near-synonymous curse terms. The translation preserves the accumulation rather than compressing it, because the rhetoric is part of the warning.
    reason: segmentation_note
  - marker: a
    text: Or 'they may denounce him with cursing and with execration'.
    reason: previous_rendering
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T14:52:07Z'
    unchanged: false
    changes_summary: 'Adjusted a few terms for closer lexical correspondence and consistency: changed ''wrath and anger'' to ''fury and wrath'' to better distinguish adjacent terms, ''erased'' to ''blotted out'' for formal register, and repeated ''with'' in the final series for smoother, more literal coordination.'
translation:
  language: en
  text: On the day of turmoil, cursing, fury, and wrath, he will consume this man’s land, city, and everything he owns with blazing, devouring fire, just as he burned Sodom. This man will be erased from the book concerning the discipline of humanity,[a] and he will not be entered in the book of life. Instead, he will go to what is appointed for destruction and will pass under the eternal curse, so that judgment may be renewed against them day after day with denunciation, cursing, wrath, torment, fury, plagues, and everlasting disease.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ge’ez distinguishes this difficult-to-understand record from the book of life, but the first book’s exact meaning is uncertain.
    reason: textual_variant
simplification_decisions:
- pob_phrase: with blazing, devouring fire, just as he burned Sodom, so he will burn his land and his city and everything that is his
  simplified_phrase: he will consume this man’s land, city, and everything he owns with blazing, devouring fire, just as he burned Sodom
  preserved_meaning: The fire destroys the man’s entire domain in a judgment compared with Sodom’s burning.
  reasoning_layer_used: POB text and source imagery
  rationale: The reordered clause reads naturally while preserving the devouring-fire image and Sodom comparison.
- pob_phrase: he will not ascend into the book of life, but into that which is appointed for destruction
  simplified_phrase: he will not be entered in the book of life. Instead, he will go to what is appointed for destruction
  preserved_meaning: He has no place in the book of life and instead faces what is appointed for destruction.
  reasoning_layer_used: POB text and optimal-equivalence philosophy
  rationale: Ordinary English clarifies the contrast without turning the destruction phrase into another record.
- pob_phrase: with execration and with cursing and with wrath and with torment and with fury and with plagues and with everlasting disease
  simplified_phrase: with denunciation, cursing, wrath, torment, fury, plagues, and everlasting disease
  preserved_meaning: The full accumulation of judgment terms intensifies the warning.
  reasoning_layer_used: POB footnote on rhetorical accumulation
  rationale: The familiar word “denunciation” replaces “execration” while every distinct item remains.
translation_notes:
  risk_flags:
  - risk: The exact identity and nuance of the book concerning human discipline remain uncertain.
    mitigation: The main text stays general, and the footnote preserves the textual difficulty.
  - risk: The shift from the singular man to plural “them” is abrupt in the underlying wording.
    mitigation: The rendering preserves the shift without defining the plural group or making the judgment unconditional.
