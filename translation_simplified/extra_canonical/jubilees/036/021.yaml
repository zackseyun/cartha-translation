translation:
  language: en
  text: He divided up the days of his generation.[a] Then Leah, his wife, died in year four of the second seven-year period within the forty-fifth Jubilee cycle.[b] He buried her in the double cave, near his mother Rebekah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “he searched out what concerned the days of his birth.” This clause continues the preceding account.
    reason: lexical_alternative
  - marker: b
    text: A Jubilee cycle consists of seven seven-year periods, totaling forty-nine years.
    reason: cultural_note
  - marker: c
    text: The “double cave” is the ancestral burial cave known in Genesis as Machpelah.
    reason: cross_reference
