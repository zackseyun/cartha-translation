translation:
  language: en
  text: 'But if any of you plots evil against his brother, know this from now on: anyone who plots evil against his brother will fall into his hand.[a] He will be cut off from the land of the living, and his descendants will be wiped out from under heaven.'
  philosophy: optimal-equivalence
  footnotes:
