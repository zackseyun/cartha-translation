    unchanged: false
    changes_summary: Changed 'removal' to 'uprooting' for a more precise and forceful rendering of the judgment from the earth; made a minor stylistic adjustment from 'so that' to 'that' for smoother formal English. Otherwise retained the draft.
translation:
  language: en
  text: The Lord will show great wrath against the people of Israel. They have abandoned his covenant, turned away from his word, provoked him, and spoken blasphemy. They do not obey the requirement of this law. They have made themselves like the nations, destined to be uprooted and destroyed from the earth. No pardon or forgiveness will remain for them for any sin connected with this eternal error.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “for all this eternal error.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: there will be great wrath from the Lord against the children of Israel
  simplified_phrase: The Lord will show great wrath against the people of Israel
  preserved_meaning: The Lord’s severe judgment is directed against Israel.
  reasoning_layer_used: POB translation
  rationale: The active wording and “people” make the sentence natural without weakening the judgment.
- pob_phrase: they do not perform the ordinance of this law
  simplified_phrase: They do not obey the requirement of this law
  preserved_meaning: Israel fails to carry out what this law commands.
  reasoning_layer_used: POB translation
  rationale: “Obey the requirement” expresses the legal sense in common English.
- pob_phrase: there will no longer be for them pardon or forgiveness, that they should be forgiven and pardoned
  simplified_phrase: No pardon or forgiveness will remain for them
  preserved_meaning: The passage emphatically denies any remaining forgiveness for this offense.
  reasoning_layer_used: POB translation
  rationale: The repeated formula is compressed while its emphatic force is retained.
interpretive_expansions:
- pob_phrase: they have made themselves like the nations, for uprooting and destruction from the earth
  rendering: They have made themselves like the nations, destined to be uprooted and destroyed from the earth.
  claim: Uprooting and destruction are the judgment appointed for those who made themselves like the nations.
  evidence:
  - The POB directly joins becoming like the nations with “uprooting and destruction.”
  - The revision audit requires preserving the forceful image “uprooting.”
  confidence: moderate
  alternatives_preserved:
