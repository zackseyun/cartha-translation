translation_notes:
  risk_flags:
  - risk: “Destined” states the judgment relationship more directly than the compressed POB syntax.
    mitigation: It avoids the stronger causal word “therefore” while preserving the appointed judgment.
  - risk: The scope of “eternal error” remains difficult to determine.
    mitigation: “Connected with” avoids assigning duration specifically to the error, and the footnote preserves the recorded alternative.
