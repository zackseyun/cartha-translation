- pob_phrase: a son of eight days you shall circumcise
  simplified_phrase: Every baby boy among you must be circumcised when he is eight days old
  preserved_meaning: Each male infant must be circumcised specifically on the eighth day.
  reasoning_layer_used: POB base text and source syntax
  rationale: The age expression is recast naturally without weakening its exact timing.
- pob_phrase: one born in the house and one bought with your gold [or ‘money’]
