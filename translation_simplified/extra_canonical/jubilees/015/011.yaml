    changes_summary: 'Corrected the Sarah clause for closer lexical accuracy and agreement with the source: changed ''her name shall no longer be called'' to ''you shall no longer call her name,'' and changed the blessing from masculine references (''I will bless him... he shall become a nation... from him'') to feminine references (''I will bless her... she shall become peoples... from her''), reflecting the Geez text.'
translation:
  language: en
  text: 'The Lord said to Abraham, “As for you, you and your descendants after you must keep my covenant. Every male among you must be circumcised by having his foreskin removed. This will be the physical sign of the everlasting law between me and you.


    “Every baby boy among you must be circumcised when he is eight days old. This applies to every male in your household, whether he was born there or was bought with money[a] from foreigners and is not one of your descendants. Every male born in your household or bought with money must be circumcised. In this way my covenant will be marked in your flesh as an everlasting law. Any male who is not circumcised on the eighth day must be cut off from his people, because he has broken my covenant.”


    The Lord also said to Abraham, “As for your wife Sarai, you must no longer call her Sarai. Her name is Sarah. I will bless her and give you a son through her. I will bless him, and he will become a nation. Kings of nations will come from him.”


    Abraham fell facedown and rejoiced. He thought, “Can a son be born to a man who is a hundred years old? Can Sarah give birth when she is ninety?” Then Abraham said to the Lord, “If only Ishmael might live before you!”


    God replied, “Yes. Sarah will bear you a son, and you must name him Isaac. I will establish my covenant with him and with his descendants after him as an everlasting covenant. As for Ishmael, I have heard you. I will bless him, make him fruitful, and give him very many descendants. He will father twelve princes, and I will make him into a great nation. But I will establish my covenant with Isaac, whom Sarah will bear to you at this time next year.”


    When God finished speaking with Abraham, the Lord went up and left him. Abraham did what the Lord had commanded. He took his son Ishmael and every male in his household, both those born there and those bought with money, and circumcised them by removing their foreskins. On that very day Abraham, Ishmael, and all the other males in his household were circumcised. This included those born in his household and those bought from foreigners.


    This law is for every generation forever. Circumcision must not be delayed or performed even one day later than the eighth day, because this is an everlasting law, established and written on the heavenly tablets. Anyone who is not circumcised on the eighth day does not belong to the people of the covenant that the Lord made with Abraham. He belongs to those who face destruction. He has no sign showing that he belongs to the Lord. He is destined for destruction—to be destroyed from the earth and rooted out from it—because he has broken the covenant of the Lord our God.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Geʽez word literally means “gold” and can also mean “money.”
    reason: lexical_alternative
