  rationale: The active wording is more natural while retaining the promise of nations coming from him.
- pob_phrase: your seed after you
  simplified_phrase: your descendants after you
  preserved_meaning: The covenant extends to Abraham's later offspring.
  reasoning_layer_used: POB translation and source payload
  rationale: “Descendants” clearly expresses the familial meaning of “seed” in modern English.
- pob_phrase: as an everlasting ordinance, so that I may be God to you
  simplified_phrase: 'It will be an everlasting covenant: I will be your God'
  preserved_meaning: The covenant is permanent and establishes an enduring relationship with God.
  reasoning_layer_used: POB translation and high-agreement cross-check
  rationale: Two direct clauses make the lasting covenant relationship easier to understand.
