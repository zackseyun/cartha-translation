translation:
  language: en
  text: But he did not hand Israel over to any angel or spirit or entrust Israel to their care. He alone rules Israel. He will guard them and demand them back from the care of his angels, his spirits, and all his authorities.[a] He will guard and bless Israel. They will belong to him, and he will belong to them, from now on and forever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The wording may also mean that he will hold these beings accountable for Israel.
    reason: lexical_alternative
