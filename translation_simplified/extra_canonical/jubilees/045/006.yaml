    changes_summary: Adjusted the clause about Pharaoh to better reflect the sense of what was granted/approved before Pharaoh rather than territory being under Joseph's authority before him; added punctuation for clarity. Kept the rest substantially unchanged.
translation:
  language: en
  text: Joseph gave his father and brothers land to live on in Goshen, in Rameses, and throughout the surrounding territory that he governed under Pharaoh. So Israel and his sons settled in Goshen, the best part of Egypt. Israel was 130 years old when he entered Egypt.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: gave his father and his brothers a possession, so that they might dwell
  simplified_phrase: gave his father and brothers land to live on
  preserved_meaning: Joseph provided his family with land where they could settle.
  reasoning_layer_used: POB base text and immediate context
  rationale: The concrete wording replaces formal terms without changing the grant of a place to live.
- pob_phrase: in Rameses and all its territory
  simplified_phrase: in Rameses, and throughout the surrounding territory
  preserved_meaning: The grant included Rameses and its wider district.
  reasoning_layer_used: POB base text
  rationale: “Surrounding territory” makes the geographic scope easier to understand.
- pob_phrase: which he ruled before Pharaoh
  simplified_phrase: that he governed under Pharaoh
  preserved_meaning: Joseph governed the territory while remaining subject to Pharaoh.
  reasoning_layer_used: source review and applied mistranslation correction
  rationale: This keeps the source-driven sense of Joseph’s rule while clarifying his relation to Pharaoh.
interpretive_expansions:
- pob_phrase: before Pharaoh
  rendering: under Pharaoh
  claim: Joseph exercised delegated authority subordinate to Pharaoh.
  evidence:
  - The audited source review identifies the verb as “rules” or “governs.”
  - The POB clause attributes governance of the territory to Joseph before Pharaoh.
  confidence: moderate
  alternatives_preserved:
