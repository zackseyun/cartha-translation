simplification_decisions:
- pob_phrase: he embraced his father's neck and wept
  simplified_phrase: He embraced his father around the neck and wept
  preserved_meaning: The emotional embrace and weeping remain distinct actions.
  reasoning_layer_used: POB text and source payload
  rationale: Natural English clarifies the physical image without weakening it.
- pob_phrase: Now let me die, since I have seen you
  simplified_phrase: Now I can die, because I have seen you
  preserved_meaning: Israel says he is ready to die after seeing Joseph.
  reasoning_layer_used: POB controlling translation
  rationale: Common English conveys readiness rather than a request for permission.
- pob_phrase: may the LORD ... be blessed—he who has shown mercy and compassion
  simplified_phrase: Blessed be the LORD—the God of Israel, the God of Abraham, and the God of Isaac—who has shown mercy and compassion
  preserved_meaning: Israel blesses the LORD as the one who showed mercy and compassion.
  reasoning_layer_used: POB text, revision history, and grounding review
  rationale: The paired dashes make clear that the final clause describes the LORD, not Isaac.
