translation:
  language: en
  text: …his father Jacob in the land of Goshen. He embraced his father around the neck and wept. Israel said to Joseph, “Now I can die, because I have seen you. Blessed be the LORD—the God of Israel, the God of Abraham, and the God of Isaac—who has shown mercy and compassion.”
