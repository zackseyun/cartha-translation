translation:
  language: en
  text: Then he blessed them and gave Joseph a double share in the land. He died and rested with his ancestors. He was buried in the cave of Machpelah[15], in the land of Canaan, near his forefather Abraham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '15'
    text: “Machpelah” literally means “double cave” and refers to the ancestral burial cave known elsewhere by this name.
    reason: cross_reference
