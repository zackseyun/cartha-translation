translation:
  language: en
  text: He was the first to write a testimony. He gave this testimony to humanity through the generations of the earth. He recorded the weeks of the jubilees,[a] made known the days of the years, and set the months in order.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In Jubilees, “weeks” and “jubilees” are units used to organize periods of years.
    reason: cultural_note
