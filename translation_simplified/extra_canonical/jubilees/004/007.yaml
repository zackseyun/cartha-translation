translation:
  language: en
  text: 'that are done in heaven and on earth, in light and in darkness, and everywhere.


    Adam and his wife mourned Abel for four weeks of years.[1] In the fourth year of the fifth week, they found joy again. Adam came together with his wife again, and she gave birth to a son. He named him Seth, saying, “The Lord has given me another offspring on the earth in place of Abel, because Cain killed him.”


    In the sixth week, Adam had a daughter named Azura. Cain married his sister Awan, and at the end of the fourth jubilee she gave birth to Enoch. In the first year of the first week of the fifth jubilee, houses were built on the earth. Cain built a city and named it Enoch after his son.


    Adam and his wife Eve also had nine more sons. In the fifth week of the fifth jubilee, Seth married his sister Azura. In the fourth year of that week, she gave birth to Enos. He was the first person on earth to call on the name of the Lord.


    In the third week of the seventh jubilee, Enos married his sister Noam. In the third year of the fifth week, she gave birth to a son, whom he named Kenan.


    At the end of the eighth jubilee, Kenan married his sister Mualeleth. In the third year of the first week of the ninth jubilee, she gave birth to a son, whom they named Mahalalel.


    In the second week of the tenth jubilee, Mahalalel married his cousin Dinah. She was the daughter of Barakiel, his father’s brother. In the sixth year of the third week, she gave birth to a son, whom they named Jared. In his days the angels of the Lord came down to the earth. These angels are called the Watchers, and they came to teach human beings,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: In this chapter, “week” refers to Jubilees’s chronological system and often means a period of seven years; “jubilee” is retained as the book’s larger unit of time.
    reason: cultural_note
