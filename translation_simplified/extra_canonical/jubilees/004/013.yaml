translation:
  language: en
  text: During the eleventh jubilee, in its fourth week, Jared married Baraka, the daughter of Rasuyal,[a] who was Jared’s cousin on his father’s side. In the fifth week, during the fourth year of that jubilee, she gave birth to a son, and Jared named him Enoch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some older editions spell this name Rasujal.
    reason: lexical_alternative
