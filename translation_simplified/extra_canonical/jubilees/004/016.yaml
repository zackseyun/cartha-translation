translation:
  language: en
  text: They acted with justice and uprightness on the earth. In the fourth year of the first seven-year week of the tenth jubilee, Jared married Baraka. Baraka was Rasujal’s daughter, and Rasujal was the daughter of Jared’s father’s sister. In the fourth year of the fifth seven-year week, Baraka bore Jared a son.
