translation:
  language: en
  text: During the seventh seven-year period of the twelfth jubilee,[a] he married Edni. She was the daughter of Danel, who was his father’s brother’s daughter. In the sixth year of that period, Edni gave birth to his son, and he named him Methuselah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In this book, a jubilee is a period of forty-nine years, divided into seven periods of seven years.
    reason: cultural_note
