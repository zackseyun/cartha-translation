translation:
  language: en
  text: 'For this reason, it is written on the heavenly tablets: “Anyone who strikes another person with evil intent is cursed.” Let everyone who sees and hears say, “Let it be so.” Anyone who sees it but does not report it will be cursed in the same way.[a]'
