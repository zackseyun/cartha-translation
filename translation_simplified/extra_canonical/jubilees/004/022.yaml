  rationale: Naming Enoch immediately removes an unclear pronoun, while “warned” makes the first testimony understandable.
- pob_phrase: the daughters of men
  simplified_phrase: human women
  preserved_meaning: The Watchers sinned by joining themselves to mortal women.
  reasoning_layer_used: POB lexical wording
  rationale: The common phrase “human women” conveys the contrast without the opaque biblical idiom.
- pob_phrase: had begun to unite themselves, so as to be defiled
  simplified_phrase: had begun joining themselves to these women and had made themselves unclean
  preserved_meaning: Their unions with the women brought defilement upon them.
  reasoning_layer_used: POB text and source-language image
  rationale: The rewrite uses ordinary clause order while retaining both the union and resulting uncleanness.
