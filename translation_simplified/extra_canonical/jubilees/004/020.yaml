  text: During the seventh week of the twelfth jubilee,[a] he married Edni. She was the daughter of Daniel, who was the daughter of his father’s sister. In the sixth year of that week, she bore him a son, and he named him.
  philosophy: optimal-equivalence
  footnotes:
