  reasoning_layer_used: Immediate marriage context and POB alternate rendering
  rationale: The qualifier prevents readers from mistaking this for ordinary incidental touching.
- pob_phrase: take a wife for myself from the daughters of Canaan
  simplified_phrase: marry any of the women of Canaan
  preserved_meaning: Jacob does not intend to choose a Canaanite woman as his wife.
  reasoning_layer_used: POB translation and ordinary marriage idiom
  rationale: Modern marriage wording states the same intention directly.
