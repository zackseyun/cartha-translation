translation:
  language: en
  text: Then Jacob said to his mother Rebekah, “Look, I am now sixty-three years old.[a] I have never had sexual relations with a woman or been physically intimate with one. I have not become engaged, and I do not intend to marry any of the women of Canaan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The original says “a son of nine weeks of years”; nine weeks of years equals sixty-three years.
    reason: cultural_note
