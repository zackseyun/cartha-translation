translation:
  language: en
  text: That is why I have kept careful watch over my spirit,[a] so that I would not sin or become defiled in anything I do throughout my life. My father Abraham gave me many commands concerning shameless conduct and sexual immorality.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean, “so that I would not defile myself or let my ways become corrupt.”
    reason: lexical_alternative
