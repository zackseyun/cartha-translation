translation:
  language: en
  text: 'When I called him.[a] During the seventh week of years, in its first year, on the twelfth day of the first month of this jubilee, a statement was made in heaven about Abraham: he had been faithful in everything he said, he loved the Lord, and he remained faithful through every trial.'
