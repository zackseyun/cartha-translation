translation:
  language: en
  text: 'The Lord called to him, “Abraham! Abraham!”


    Abraham answered, “Here I am.”


    The Lord said, “Take Isaac, your beloved son whom you love. Go to the high country and offer him there as a sacrifice on one of the mountains I will show you.”


    Early in the morning, Abraham saddled his donkey. He took Isaac and two young servants with him. After splitting wood for the offering, he set out. On the third day, he saw the place in the distance. When he came to a well, he told the servants, “Stay here with the donkey. The boy and I will go on. After we worship, we will return to you.”


    Abraham put the wood for the sacrifice on Isaac. He carried the fire and the knife himself. Then the two of them went on together to that place.'
