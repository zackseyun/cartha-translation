translation:
  language: en
  text: He took bread and a skin of water and gave them to Hagar, along with the child, then sent her away.[a] She wandered through the wilderness of Beersheba. When the water ran out, the child became thirsty. He could no longer walk, and he fell.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The wording may instead mean that he put the bread and water on Hagar’s shoulder and gave her the child before sending her away.
    reason: lexical_alternative
