- pob_phrase: put them on Hagar's shoulder, and the child
  simplified_phrase: gave them to Hagar, along with the child
  preserved_meaning: Hagar departed with both the provisions and the child, while the footnote preserves the shoulder reading.
  reasoning_layer_used: POB footnote and independent grounding review
  rationale: This avoids making the disputed construction say that the child was placed on Hagar’s shoulder.
- pob_phrase: the water in the skin was finished
  simplified_phrase: the water ran out
  preserved_meaning: No water remained in the container.
  reasoning_layer_used: POB translation
  rationale: The common idiom states the same event naturally.
- pob_phrase: was unable to walk, and he fell
