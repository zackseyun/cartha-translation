  rationale: This explains the unfamiliar measure without reducing it to a vague short distance.
- pob_phrase: Let me not see the death of my child
  simplified_phrase: I cannot watch my child die
  preserved_meaning: Hagar withdraws because she cannot bear to witness her child’s death.
  reasoning_layer_used: POB base translation and revision rationale
  rationale: Natural English conveys the same anguished refusal without archaic phrasing.
- pob_phrase: Rise, take up the child, and hold him with your hand
