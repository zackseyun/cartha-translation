translation:
  language: en
  text: 'She went about as far away as an arrow can be shot, for she said, “I cannot watch my child die.” Then she sat down and wept.


    An angel of God, one of the holy ones, said to her, “Why are you weeping, Hagar? Get up, lift up the child, and hold him with your hand, for God has heard your voice and has seen the child.”'
  philosophy: optimal-equivalence
