translation:
  language: en
  text: Abram was glad. He told his wife Sarai everything that had happened, and he believed that he would have children, even though she had not borne any. Then Sarai advised her husband Abram, “Sleep with Hagar, my Egyptian servant. Perhaps through her I can provide children for you.” Abram accepted Sarai’s advice and told her, “Do it.” Then she took Hagar,
