  language: en
  text: After that new moon[a], in the fourth year of that seven-year period, the LORD spoke to Abram in a dream on the new moon of the third month. He said, “Do not be afraid, Abram. I am your protector, and your reward will be very great.”
  philosophy: optimal-equivalence
