translation:
  language: en
  text: “Your reward will be very great.” Then he said, “Lord, Lord, what will you give me? I am still childless, and Eliezer of Damascus—the son of Maseq, my maidservant—is heir to my household.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ge'ez is compressed and literally ends “is Damascus,” omitting the name Eliezer and the words “heir to my household”; the fuller wording clarifies the person and role meant.
    reason: source_note
