  reasoning_layer_used: POB translation and independent grounding review
  rationale: This preserves terror as a distinct element while using a natural English expression.
- pob_phrase: your seed will be aliens in a land not theirs
  simplified_phrase: your descendants will live as foreigners in a land that is not theirs
  preserved_meaning: Abram’s future offspring will reside outside their own land.
  reasoning_layer_used: POB controlling text
  rationale: “Descendants” and “foreigners” clearly express the familial and social meaning.
- pob_phrase: they will enslave them and afflict them
