translation:
  language: en
  text: Abram fell into a deep sleep, and a great terror of darkness came over him. Then Abram was told, “Know for certain that your descendants will live as foreigners in a land that is not theirs. The people there will enslave and mistreat them for four hundred years.”
  philosophy: optimal-equivalence
