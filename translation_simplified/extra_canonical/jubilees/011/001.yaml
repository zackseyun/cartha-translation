translation:
  language: en
  text: During the thirty-fifth jubilee,[1] in the first year of its third week, Reu married Ora. She was the daughter of Ur and the granddaughter of Kesed. In the seventh year of that week, she gave birth to a son, and Reu named him Seroh.
