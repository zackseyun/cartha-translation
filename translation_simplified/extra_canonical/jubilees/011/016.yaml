  language: en
  text: for two seven-year periods.[16] In the fifth year of the sixth seven-year period, Abram stayed up alone through the night at the beginning of the seventh month. From evening until dawn, he watched the stars to learn what kind of year it would be for rainfall.
  philosophy: optimal-equivalence
