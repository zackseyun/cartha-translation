translation:
  language: en
  text: In the time of Serug, wars broke out. All people turned to making engraved images, carved figures, and unclean things. Evil spirits helped them and led them astray, so that they sinned and defiled themselves.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: in the days of Serug there arose wars
  simplified_phrase: In the time of Serug, wars broke out
  preserved_meaning: Wars began during Serug's lifetime.
  reasoning_layer_used: POB translation
  rationale: The idiom is recast in ordinary modern English.
- pob_phrase: all the sons of men turned to making
  simplified_phrase: All people turned to making
  preserved_meaning: Human society broadly devoted itself to producing these objects.
  reasoning_layer_used: POB translation
  rationale: “Sons of men” is expressed by its clear inclusive meaning.
- pob_phrase: commit transgression and uncleanness
  simplified_phrase: sinned and defiled themselves
  preserved_meaning: They did wrong and became morally or ritually unclean.
  reasoning_layer_used: POB translation
  rationale: Abstract nouns are changed into direct verbs without merging the two ideas.
translation_notes:
  risk_flags:
