  preserved_meaning: Mastema actively and intensely pursued these events.
  reasoning_layer_used: POB translation and high-agreement cross-check
  rationale: The common expression preserves both his effort and his purpose.
- pob_phrase: those set under his hand
  simplified_phrase: under his command
  preserved_meaning: The other spirits were subordinate to Mastema's authority.
  reasoning_layer_used: POB translation and immediate syntax
  rationale: The idiom is stated directly without changing the relationship.
- pob_phrase: upon the earth
  simplified_phrase: across the earth
  preserved_meaning: The bloodshed took place broadly over the earth.
  reasoning_layer_used: POB translation and immediate context
  rationale: Across expresses the broad scope naturally in modern English.
