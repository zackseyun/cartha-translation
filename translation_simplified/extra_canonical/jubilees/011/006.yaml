translation:
  language: en
  text: “…for those who make them, and the hearts of those who worship them go astray.[a] Do not worship them.” His father replied, “I know that too, my son. But what can I do about a people who have put me under their authority?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ge‘ez wording here is difficult; it may also mean, “…for those who make them, and a straying of heart for those who worship them.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: a straying of heart for those who worship them
  simplified_phrase: the hearts of those who worship them go astray
  preserved_meaning: Worshiping the idols is associated with inwardly going astray.
  reasoning_layer_used: POB footnote and applied grammar revision
  rationale: The verbal form gives natural English while the footnote preserves the difficult alternative.
- pob_phrase: And his father said to him
  simplified_phrase: His father replied
  preserved_meaning: His father answers the warning just given.
  reasoning_layer_used: immediate discourse context
  rationale: “Replied” clearly expresses the conversational connection.
- pob_phrase: who have made me subject to them
  simplified_phrase: who have put me under their authority
  preserved_meaning: The people have placed the father in a subordinate position where he must obey them.
  reasoning_layer_used: source review of the Ge‘ez verb
  rationale: The common phrase preserves subjection without reverting to the rejected sense “caused me to err.”
