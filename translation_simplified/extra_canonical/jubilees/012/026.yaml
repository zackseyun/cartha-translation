translation:
  language: en
  text: I opened his mouth, ears, and lips, and began speaking with him in Hebrew, the language of creation. Then he took his ancestors’ books, which were written in Hebrew. He copied them and began studying them from then on. I explained everything he could not understand, and he studied the books during the six months of the rainy season.
