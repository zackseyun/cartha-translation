translation:
  language: en
  text: “Rescue me from the power of evil spirits that rule the thoughts of the human heart. Do not let them lead me away from following you, my God. Establish me and my descendants forever, so that we may not go astray, now or ever.” And he said,
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Deliver me from the hand of evil spirits
  simplified_phrase: Rescue me from the power of evil spirits
  preserved_meaning: The speaker asks God to free him from the spirits’ controlling power.
  reasoning_layer_used: POB translation and source image
  rationale: “Power” clearly conveys the force of the image “hand” in this context.
- pob_phrase: the thoughts of the heart of man
  simplified_phrase: the thoughts of the human heart
  preserved_meaning: The spirits rule over inward human thought.
  reasoning_layer_used: POB translation
  rationale: The new wording is natural modern English while retaining the heart as the center of thought.
- pob_phrase: my seed
  simplified_phrase: my descendants
  preserved_meaning: The prayer includes the speaker’s future family line.
  reasoning_layer_used: POB translation and applied mistranslation revision
  rationale: “Descendants” makes the collective sense of “seed” clear without adding the rejected phrase “before you.”
translation_notes:
  risk_flags:
  - risk: Replacing “from the hand” with “from the power” reduces the concrete source image.
    mitigation: The wording preserves the image’s contextual force of control in immediately understandable English.
  - risk: The final “go astray” leaves its object implicit.
    mitigation: The translation preserves that ambiguity while the preceding sentence supplies the likely Godward context.
