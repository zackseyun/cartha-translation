  simplified_phrase: your God, and the God of your son, your grandson
  preserved_meaning: God promises the same relationship to the man, his son, and his son's son.
  reasoning_layer_used: POB text and source payload
  rationale: “Grandson” states the family relationship in ordinary English without changing its scope.
- pob_phrase: all your seed
  simplified_phrase: all your descendants
  preserved_meaning: The promise extends to the whole line of his offspring.
  reasoning_layer_used: POB text
  rationale: “Descendants” clearly conveys the human family-line meaning of “seed.”
- pob_phrase: And he said to me
  simplified_phrase: Then he said to me
  preserved_meaning: The unnamed male speaker continues speaking to the narrator.
  reasoning_layer_used: applied revision
  rationale: “Then” gives natural narrative flow while retaining the source-based pronoun.
