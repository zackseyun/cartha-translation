translation:
  language: en
  text: He said, “Should I return to Ur of the Chaldeans? The people there are looking for me because they want me to return to them. But what should I do here? Make the right path clear before me, your servant, so that I may follow it.[a] My God, do not let me follow my own heart into error.” When he had finished speaking and praying, someone was sent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The wording of this petition is difficult in the segmented Ge’ez. This rendering follows the sense preserved in the POB: Abram asks God to make the right path clear before him and keep him from following his own erring heart.'
    reason: source_note
simplification_decisions:
- pob_phrase: who seek my face so that I should return to them
  simplified_phrase: The people there are looking for me because they want me to return to them
  preserved_meaning: The people of Ur are seeking Abram’s presence because they want him back among them.
  reasoning_layer_used: source review and applied revision
  rationale: This expresses the idiom naturally without reviving the rejected claim that they seek his life.
- pob_phrase: Make the right path straight before you in the hand of your servant, that he may do it
  simplified_phrase: Make the right path clear before me, your servant, so that I may follow it
  preserved_meaning: Abram asks God to show him the right course and enable him to follow it.
  reasoning_layer_used: POB segmentation note and preserved-sense summary
  rationale: The resolved pronouns make the difficult petition understandable while the footnote retains its uncertainty.
- pob_phrase: let me not walk in the error of my heart
  simplified_phrase: do not let me follow my own heart into error
  preserved_meaning: Abram asks God not to let his own fallible inner judgment lead him astray.
  reasoning_layer_used: POB translation and footnote
  rationale: This keeps the heart-and-path imagery without narrowing the error to mistaken desires.
interpretive_expansions:
- pob_phrase: Make the right path straight before you in the hand of your servant, that he may do it
  rendering: Make the right path clear before me, your servant, so that I may follow it
  claim: Abram is the servant who asks to see and follow the right path.
  evidence:
  - The POB note identifies the preserved sense as Abram asking God to make the right path straight before him.
  - The following request contrasts God’s path with Abram following his own erring heart.
  confidence: moderate
  alternatives_preserved:
  - The segmented wording may be read more literally with “before you” and “that he may do it.”
translation_notes:
  risk_flags:
  - risk: The segmented Ge’ez leaves the petition’s pronouns and agency uncertain.
    mitigation: The main text follows the POB’s preserved sense, and footnote [a] openly marks the difficulty.
  - risk: The person sent at the end of the verse is not identified.
    mitigation: The translation leaves the person unnamed rather than supplying an identity.
