translation:
  language: en
  text: Two seven-year periods.[a] In the fifth year of the sixth seven-year period, Abram stayed awake through the night at the beginning of the seventh month.[b] From evening until dawn, he watched the stars to learn what the year’s rainfall would be like. He sat there alone, watching, when a thought came into his heart. He said, “All the signs of the stars and their signs...”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “two weeks of years”; Jubilees often counts time in seven-year periods.
    reason: cultural_note
  - marker: b
    text: This may refer more specifically to the rising of the new moon that began the seventh month.
    reason: lexical_alternative
