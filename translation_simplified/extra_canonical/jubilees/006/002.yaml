translation:
  language: en
  text: He put the fat on the altar. Then he took an ox, a ram, a sheep, young goats, salt, a turtledove, and a young pigeon, and offered a burnt offering on the altar. He placed an offering mixed with oil on them, sprinkled wine,[a] and put incense over everything. In this way he made a pleasing fragrance rise, acceptable to the Lord.
