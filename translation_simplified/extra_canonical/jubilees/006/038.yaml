  preserved_meaning: The statement remains a solemn witness that must be passed on.
  reasoning_layer_used: applied doctrine revision
  rationale: Keeping “testimony” preserves the covenantal force identified in the final revision.
- pob_phrase: your children will corrupt it
  simplified_phrase: your descendants will corrupt this calendar
  preserved_meaning: Later generations will distort the prescribed calendar.
  reasoning_layer_used: immediate context
  rationale: The following references to the year's length and sacred dates identify what is corrupted.
- pob_phrase: they will go wrong concerning the new moons and seasons and sabbaths and festivals
  simplified_phrase: they will go wrong in observing the new moons, seasons, Sabbaths, and festivals
  preserved_meaning: Their calendar error will disrupt these appointed times.
  reasoning_layer_used: POB controlling text and immediate context
  rationale: “In observing” makes the practical effect clear without merging the listed occasions.
