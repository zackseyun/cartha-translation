    timestamp: '2026-04-23T14:49:50Z'
    unchanged: false
    changes_summary: Revised 'testify to you/them' to 'make it known to you/them' for better lexical fit and natural English; adjusted word order to 'three hundred and sixty-four days only' for clarity; changed 'as to' to 'concerning'; and rendered the final clause more literally as 'all the blood with all flesh' instead of 'all kinds of blood with all kinds of flesh.'
translation:
  language: en
  text: Therefore, I command you and give you this testimony, so that you may testify to them. After your death, your descendants will corrupt this calendar. They will no longer count the year as exactly 364 days. As a result, they will go wrong in observing the new moons, seasons, Sabbaths, and festivals. They will also eat flesh with its blood still in it.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “they will eat all the blood with all flesh.”
    reason: source_note
