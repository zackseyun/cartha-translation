    unchanged: false
    changes_summary: Adjusted grammar ('command ... to keep'), rendered በዓላቲሁ consistently as 'feasts,' changed 'fall' to 'come' for a more natural and direct rendering of the verb, and replaced 'pass over a day' with 'omit a day' for better lexical accuracy.
translation:
  language: en
  text: 'And you, command the children of Israel to count each year by this reckoning: 364 days. This will make a complete year and keep its days and feasts from falling at the wrong times. Everything will occur on them according to their testimony. They will not leave out a day or disrupt a feast.'
  philosophy: optimal-equivalence
