  simplified_phrase: count each year by this reckoning
  preserved_meaning: Israel must follow the stated method for calculating each year.
  reasoning_layer_used: POB translation and applied revisions
  rationale: “Count each year” expresses the calendrical command in ordinary English.
- pob_phrase: it will not disturb its time from its days or from its feasts
  simplified_phrase: keep its days and feasts from falling at the wrong times
  preserved_meaning: The 364-day year prevents calendar days and feasts from shifting out of place.
  reasoning_layer_used: source grammar review and POB translation
  rationale: The awkward negative construction is recast as its practical calendrical effect.
- pob_phrase: they will not omit a day nor disturb a feast
