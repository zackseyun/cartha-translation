translation:
  language: en
  text: In years to come, they will disrupt the proper order of the calendar. They will treat a day of testimony as a detestable day and an unclean day as a festival. They will confuse every holy day with an unclean one, and every unclean day with a holy one. This will happen because they will be wrong about the months, Sabbaths, festivals, and jubilees.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Therefore years will come upon them when they disturb the order
  simplified_phrase: In years to come, they will disrupt the proper order of the calendar
  preserved_meaning: A future generation will upset the established sacred calendar.
  reasoning_layer_used: Immediate context and POB clause structure
  rationale: The list of months and sacred times makes the kind of order clear.
- pob_phrase: they will make a day of testimony an abominable day
  simplified_phrase: They will treat a day of testimony as a detestable day
  preserved_meaning: They will wrongly degrade the day of testimony rather than elevate an abominable day.
  reasoning_layer_used: Applied source-grounded revision
  rationale: This keeps the audited direction of the contrast while using natural English.
- pob_phrase: they will mix up all the holy days with the unclean, and the unclean day with the holy
  simplified_phrase: They will confuse every holy day with an unclean one, and every unclean day with a holy one
  preserved_meaning: They will reverse and confuse the distinction between holy and unclean days.
  reasoning_layer_used: POB controlling translation
  rationale: The parallel contrast is preserved in a shorter and clearer form.
