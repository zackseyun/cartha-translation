translation:
  language: en
  text: This entire festival was celebrated in heaven from the day of creation until Noah’s time—a period of twenty-six jubilees and five weeks of years. Noah and his sons continued to observe it for seven jubilees and one week of years, until the day Noah died. After his death, his sons corrupted the festival until Abraham’s time, and they ate blood.
  philosophy: optimal-equivalence
