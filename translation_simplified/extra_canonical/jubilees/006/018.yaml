  preserved_meaning: The heavenly celebration lasted from creation through the stated calendrical period ending in Noah’s time.
  reasoning_layer_used: POB translation and source chronology
  rationale: “A period of” makes the time calculation easier to follow without converting its ancient units.
- pob_phrase: Noah and his sons kept it
