    timestamp: '2026-04-23T20:35:14Z'
    unchanged: false
    changes_summary: Adjusted the purpose clause from 'lest your blood of your lives be sought' to the more natural and accurate 'so that your blood for your lives may not be sought,' preserving the source sense while improving English readability.
translation:
  language: en
  text: But you must not eat flesh with its life still in it—that is, its blood. For the life of every creature is in its blood, so that your own lifeblood may not be required. I will hold every person and every living creature accountable for human blood.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: flesh with its life, with its blood
  simplified_phrase: flesh with its life still in it—that is, its blood
  preserved_meaning: The flesh must not be eaten while its lifeblood remains in it.
  reasoning_layer_used: source payload and POB translation
  rationale: The wording clearly preserves the source connection between life and blood.
- pob_phrase: the life of all flesh
  simplified_phrase: the life of every creature
  preserved_meaning: Life is present in the blood of all living flesh.
  reasoning_layer_used: POB controlling meaning
  rationale: “Every creature” states the broad scope in natural English.
- pob_phrase: From the hand of every man, from the hand of every living thing, I will require the blood of man
  simplified_phrase: I will hold every person and every living creature accountable for human blood
  preserved_meaning: God requires an account from any human or creature responsible for shedding human blood.
  reasoning_layer_used: source image, POB translation, and grounding review
  rationale: “Hold accountable” conveys judicial responsibility without suggesting monetary payment.
translation_notes:
  risk_flags:
  - risk: “Lifeblood” may be understood figuratively rather than as blood bound to life.
    mitigation: The preceding sentence explicitly identifies the creature’s life with its blood.
  - risk: “Hold accountable” explains rather than reproduces the image of blood being required from a hand.
    mitigation: It preserves responsibility while avoiding the misleading commercial sense of “payment.”
