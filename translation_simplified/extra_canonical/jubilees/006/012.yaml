  preserved_meaning: The testimony is directed to the hearers and requires continuing observance.
  reasoning_layer_used: POB text and source payload
  rationale: “May always obey” makes the obligation clear without turning it into a prediction.
- pob_phrase: beasts or birds or cattle during all the days of the earth
  simplified_phrase: wild animal, bird, or livestock as long as the earth endures
  preserved_meaning: The blood prohibition covers each listed animal group for the earth’s whole duration.
  reasoning_layer_used: POB text and source payload
  rationale: Modern category names and a natural time expression replace difficult wording.
- pob_phrase: he and his seed shall be rooted out from the earth
  simplified_phrase: he and his descendants will be uprooted from the earth
  preserved_meaning: The offender and his offspring face removal from the earth.
  reasoning_layer_used: POB text and source image
  rationale: “Descendants” clarifies “seed,” while “uprooted” preserves the source image.
