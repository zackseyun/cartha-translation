translation:
  language: en
  text: 'This testimony has been written for you so that you may always obey it: You must never eat the blood of any wild animal, bird, or livestock as long as the earth endures. If anyone eats the blood of a wild animal, livestock, or bird, he and his descendants will be uprooted from the earth.'
  philosophy: optimal-equivalence
