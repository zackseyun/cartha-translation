  rationale: “People of Israel” conveys the collective sense in ordinary modern English.
- pob_phrase: will not find the path of the years
  simplified_phrase: will lose their way in reckoning the years
  preserved_meaning: Israel will fail to follow the proper pattern for arranging the calendar.
  reasoning_layer_used: POB base text, immediate context, and grounding review
  rationale: This preserves the path image while avoiding the narrower idea of merely counting years.
