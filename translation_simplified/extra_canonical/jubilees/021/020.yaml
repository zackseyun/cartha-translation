translation:
  language: en
  text: 'Do not accept a bribe or gift in exchange for human blood. Blood for blood must be repaid before the Lord, the Most High God. This will protect you, keeping you from every evil and saving you from death.


    My son, I see what human beings do. All their sin, evil, and deeds are unclean, detestable, and defiling; there is no righteousness among them. Be careful not to follow their ways or walk their paths. Do not commit a sin that leads to death before the Most High God, so that he does not hide his face from you, hand you over to your enemies,[20] uproot you from the earth and your descendants from under heaven, and wipe out your name and your descendants from the whole earth.


    Turn away from all their deeds and uncleanness. Obey the commands of the Most High God, do his will, and be upright in everything. Then he will bless everything you do. From your descendants he will raise up a plant of righteousness throughout the earth in every generation. My name and yours will never be forgotten under heaven.


    Go in peace, my son. May the Most High God—my God and your God—strengthen you to do his will. May he bless all your descendants and the remnant of your descendants for everlasting generations with every righteous blessing, so that you may become a blessing throughout the earth.” Then he left his presence rejoicing.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: '20'
    text: The transmitted wording is difficult and may mean “your enemies,” though the text may be corrupted.
    reason: textual_variant
