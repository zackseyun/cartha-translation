  preserved_meaning: Abraham summoned Isaac in order to instruct him.
  reasoning_layer_used: POB translation and immediate syntax
  rationale: The rewrite uses ordinary English while retaining both the summons and the instruction.
- pob_phrase: I do not know the day of my death
  simplified_phrase: I do not know the day I will die
  preserved_meaning: Abraham does not know the exact day of his death.
  reasoning_layer_used: POB controlling meaning
  rationale: The verbal form is clearer than the abstract phrase “day of my death.”
- pob_phrase: I am full of my days
  simplified_phrase: I have lived a full lifetime
  preserved_meaning: Abraham regards the span of his life as full or fulfilled.
  reasoning_layer_used: Ge'ez grammar, applied revision, and POB footnote history
  rationale: The main text makes the idiom understandable, while the footnote preserves its image and alternate wording.
