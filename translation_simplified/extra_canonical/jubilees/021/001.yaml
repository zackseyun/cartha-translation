    changes_summary: Removed 'of years' as unnecessary and potentially redundant with 'week' in this context; changed 'are completed' to 'are fulfilled' for a more formal and literal rendering of the final clause.
translation:
  language: en
  text: 'In the sixth year of the seventh week of this jubilee, Abraham called his son Isaac and gave him these instructions: “I have grown old. I do not know the day I will die, and I have lived a full lifetime.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “I am full of my days”; or, “my days are fulfilled.”
    reason: simplification_note
