translation:
  language: en
  text: Do not eat blood at all, because blood is life. Do not consume any blood. Do not accept any gift or payment in a case involving human bloodshed, so that the bloodshed does not go unpunished or escape judgment. Blood that is shed defiles the land, and the land cannot be cleansed from a person’s blood except by the blood of the one who shed it.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: because it is the life
  simplified_phrase: because blood is life
  preserved_meaning: Blood is identified with the life that must not be consumed.
  reasoning_layer_used: POB base text
  rationale: Repeating “blood” makes the reference immediately clear.
- pob_phrase: do not accept a gift concerning any human blood
  simplified_phrase: Do not accept any gift or payment in a case involving human bloodshed
  preserved_meaning: No gift or payment may be accepted in connection with a human bloodshed case.
  reasoning_layer_used: POB base text and immediate context
  rationale: “Gift or payment” preserves the broad wording while making the judicial setting clear.
- pob_phrase: pollutes the earth
  simplified_phrase: defiles the land
  preserved_meaning: Shed human blood makes the land morally and ritually unclean.
  reasoning_layer_used: POB base text and source image
  rationale: “Defiles” preserves the pollution-and-cleansing image in familiar biblical language.
interpretive_expansions:
- pob_phrase: concerning any human blood
  rendering: in a case involving human bloodshed
  claim: The gift or payment is connected with the handling of human bloodshed.
  evidence:
  - The following clause links the gift with impunity and lack of judgment.
  confidence: high
  alternatives_preserved:
  - gift or payment connected with human blood
- pob_phrase: lest it be shed with impunity, without judgment
  rendering: so that the bloodshed does not go unpunished or escape judgment
  claim: The warning concerns bloodshed being allowed to escape punishment and judicial judgment.
  evidence:
  - The POB revision identifies the source sense as blood being shed with impunity and without judgment.
  confidence: high
  alternatives_preserved:
  - bloodshed not being judged
  - bloodshed not going unpunished
translation_notes:
  risk_flags:
  - risk: “In a case” makes the judicial setting more explicit than the POB wording alone.
    mitigation: The immediate warning about impunity and judgment firmly supplies that setting.
  - risk: “Escape judgment” recasts the passive wording as a direct judicial warning.
    mitigation: It preserves both lack of judgment and impunity without making the bloodshed necessarily future.
