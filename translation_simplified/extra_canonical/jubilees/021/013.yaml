translation:
  language: en
  text: Among these woods are ones called arsatna and besem.[a] From these woods, choose only pieces that appear suitable. Place them under the sacrifice on the altar. Do not use wood that is split or dark. Use wood that is hard, clean, unblemished, sound, and freshly grown. Do not use old wood, because its fragrance is gone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The names arsatna and besem are uncertain because the Ethiopic wording is difficult and may be corrupt.
    reason: textual_variant
