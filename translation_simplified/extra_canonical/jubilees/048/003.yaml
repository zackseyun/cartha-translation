  text: On the journey, at the place where you stopped for the night, he met you.[3] Did he not want with all his might to kill you and rescue the Egyptians from your grasp, when he saw that you had been sent to do this and bring judgment on Egypt?
  philosophy: optimal-equivalence
  footnotes:
