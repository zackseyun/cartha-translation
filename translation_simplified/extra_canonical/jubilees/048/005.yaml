    changes_summary: Changed 'sprouted' to 'grew' for more natural formal English, and added 'for them' after 'left' to reflect the source more completely. Otherwise retained the draft.
translation:
  language: en
  text: The LORD carried out great vengeance against them on Israel’s behalf. He struck them with blood, frogs, gnats, and swarms of flies.[a] He afflicted them with painful boils that broke into blisters, and he killed their livestock. He sent hailstones that destroyed everything they had growing. Then locusts ate whatever the hail had left. He struck them with darkness and with the death of every firstborn, both human and animal. The LORD also carried out vengeance against all their gods.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The source calls them “dog-flies.”
    reason: source_note
