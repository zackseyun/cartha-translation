translation:
  language: en
  text: In the sixth year of the third seven-year period in the forty-ninth jubilee,[1] you left and lived in the land of Midian for five seven-year periods and one additional year. Then, in the second year of the second seven-year period in the fiftieth jubilee, you returned to Egypt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: The Ethiopic chronology is compressed and difficult; each “seven-year period” translates a “week of years” in Jubilees’ calendar.
    reason: simplification_note
