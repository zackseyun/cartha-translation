  simplified_phrase: tried to hand you over to Pharaoh
  preserved_meaning: Mastema tried to place Israel under Pharaoh’s power.
  reasoning_layer_used: POB base translation
  rationale: The common idiom makes the transfer of power immediately clear.
- pob_phrase: they stood and acted before you
  simplified_phrase: they confronted you and performed their magic in your presence
  preserved_meaning: The Egyptian magicians opposed the addressee and carried out magical acts before him.
  reasoning_layer_used: POB immediate context and sign-of-enchantment wording
  rationale: The context-specific wording replaces the vague phrase “acted before you.”
- pob_phrase: with all the power of Egypt, with their chariots and with their horses and with all the multitude
  simplified_phrase: with the full power of Egypt—with their chariots, horses, and vast number of people
  preserved_meaning: Egypt pursued Israel with its military strength and great multitude.
  reasoning_layer_used: POB base translation
  rationale: The streamlined list retains both the military force and immense scale.
