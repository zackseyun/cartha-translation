- pob_phrase: from his hand and from the hand of his people
  rendering: from Mastema and his people
  claim: The singular pronoun refers to Mastema, whose control is pictured by the idiom “hand.”
  evidence:
  - Mastema is the named singular adversary who urges the Egyptians to pursue Israel.
  confidence: high
  alternatives_preserved:
  - from his power and the power of his people
