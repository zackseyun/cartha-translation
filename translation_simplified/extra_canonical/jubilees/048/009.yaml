translation:
  language: en
  text: 'Prince Mastema opposed you and tried to hand you over to Pharaoh. He helped the Egyptian magicians, who confronted you and performed their magic in your presence. We allowed them to do evil, but we did not allow them to perform healings. Then the LORD struck them with terrible sores. They could no longer resist, because we kept them from performing even one magical sign.


    Through all these signs and wonders, Prince Mastema was put to shame. But when he grew strong, he urged the Egyptians to pursue you with the full power of Egypt—with their chariots, horses, and vast number of people. I stood between the Egyptians and Israel, and we rescued Israel from Mastema and his people. The LORD brought the Israelites through the middle of the sea on dry land.'
  philosophy: optimal-equivalence
simplification_decisions:
