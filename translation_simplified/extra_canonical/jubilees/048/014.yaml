translation:
  language: en
  text: Everyone he had brought out chased after Israel. The Lord God hurled them into the middle of the sea, down into the deep abyss beneath the Israelites. This was just as the people of Egypt had thrown their children into the river. He took vengeance on a million of them; a thousand mighty men were destroyed, and those who chased Israel died because of envy.
