    changes_summary: Changed 'covenant' to 'ordinance' to reflect ሥርዐቱ more accurately here; adjusted phrasing to 'so that' for consistency; revised 'with violence' to 'violently' for more natural English while preserving the sense.
translation:
  language: en
  text: The LORD used him to avenge Israel. The LORD did all this for Israel in keeping with the ordinance he had established with Abraham. In this way, he took vengeance on those who had enslaved Israel by force, repaying them as they had treated Israel.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Through him he took vengeance for Israel
  simplified_phrase: The LORD used him to avenge Israel
  preserved_meaning: The LORD acted through a male agent to exact vengeance on Israel’s behalf.
  reasoning_layer_used: applied revision and immediate context
  rationale: The active wording clarifies agency while preserving the source-driven “through him.”
- pob_phrase: did everything for Israel, and according to his ordinance
  simplified_phrase: did all this for Israel in keeping with the ordinance
  preserved_meaning: The LORD’s actions for Israel conformed to his established ordinance.
  reasoning_layer_used: POB text and lexical revision
  rationale: “In keeping with” expresses conformity naturally without replacing “ordinance” with “covenant.”
- pob_phrase: just as they had enslaved them by force
  simplified_phrase: repaying them as they had treated Israel
  preserved_meaning: The vengeance corresponded to their forcible enslavement of Israel.
  reasoning_layer_used: source review and applied lexical revision
  rationale: The added clause makes the proportional force of “just as” immediately clear.
interpretive_expansions:
- pob_phrase: he
  rendering: The LORD
  claim: The LORD is the one who acted through the unnamed male agent to avenge Israel.
  evidence:
  - The next clause explicitly names the LORD as the one acting for Israel.
  - The verse presents the actions as one continuous account of divine vengeance.
  confidence: high
  alternatives_preserved:
  - The identity of the male agent referred to as “him” remains unstated.
- pob_phrase: just as they had enslaved them by force
  rendering: repaying them as they had treated Israel
  claim: The vengeance is portrayed as corresponding to the enslavers’ treatment of Israel.
  evidence:
  - The source review identifies በከመ as “just as” rather than “because.”
  - The POB wording directly compares the vengeance with the forced enslavement.
  confidence: high
  alternatives_preserved:
  - The text does not specify that every act of vengeance matched a particular act of enslavement.
translation_notes:
  risk_flags:
