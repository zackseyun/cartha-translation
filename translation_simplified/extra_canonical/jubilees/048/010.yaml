translation:
  language: en
  text: All the people he had led out chased after Israel. Yahweh our God threw them into the middle of the sea, down into its depths beneath the Israelites, just as the Egyptians had thrown the sons of Israel into the river. A million and ten thousand mighty warriors were destroyed because of one nursing infant from among your people whom the Egyptians had thrown into the river.
