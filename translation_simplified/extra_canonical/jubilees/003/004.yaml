  text: And the Lord said to us, “It is not good for the man to be alone; let us make for him a helper like him.” And the Lord our God caused a deep sleep to fall upon him, and he slept; and he took one bone from among his bones for the woman, and that rib was the origin of the woman from among his bones, and he built flesh in its place, and built the woman.
  footnotes:
  - marker: a
    text: Or 'and made from it the woman'.
    reason: previous_rendering
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T20:34:07Z'
    unchanged: false
    changes_summary: Revised 'rib' to 'bone' for closer lexical accuracy to the source, and replaced the awkward/interpretive clause 'that rib was the origin of the woman' with 'made from it the woman' to reflect the source more naturally and completely.
translation:
  language: en
  text: The Lord said to us, “It is not good for the man to be alone. Let us make a helper for him who is like him.” Then the Lord our God put the man into a deep sleep. While the man slept, God took one bone from among his bones. That rib[a] was the beginning of the woman’s creation from his bones. God formed flesh where the bone had been, and he built the woman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The source first calls the part a bone and then identifies it as a rib.
    reason: source_note
simplification_decisions:
- pob_phrase: caused a deep sleep to fall upon him, and he slept
  simplified_phrase: put the man into a deep sleep. While the man slept
  preserved_meaning: God caused the man to sleep deeply before taking the bone.
  reasoning_layer_used: POB translation and source sequence
  rationale: Two direct sentences replace the formal causative wording.
- pob_phrase: that rib was the origin of the woman from among his bones
  simplified_phrase: That rib was the beginning of the woman’s creation from his bones
  preserved_meaning: The rib taken from the man’s bones was the source of the woman’s creation.
  reasoning_layer_used: applied mistranslation revision and Ge’ez source clause
  rationale: “Beginning of the woman’s creation” explains “origin” without deleting the audited clause.
- pob_phrase: he built flesh in its place, and built the woman
  simplified_phrase: God formed flesh where the bone had been, and he built the woman
  preserved_meaning: God replaced the removed bone with flesh and constructed the woman.
  reasoning_layer_used: POB wording and source creation image
  rationale: The location is made explicit while “built the woman” preserves the source image.
