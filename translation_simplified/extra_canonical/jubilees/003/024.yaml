translation:
  language: en
  text: He also said to Adam, “Because you listened to your wife and ate from the tree that I commanded you not to eat from, the ground is cursed because of you. It will grow thorns and thistles for you. You will have to work for your food with sweat running down your face until you return to the ground from which you were taken. For you are earth, and to the earth you will return.”
