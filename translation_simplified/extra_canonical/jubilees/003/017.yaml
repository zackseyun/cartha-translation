translation:
  language: en
  text: He did this for himself and his wife, and he stored what was being kept. After he had been there for exactly seven full years, on the seventeenth day of the second month,[a] the serpent came to the woman and asked her, “Did God command you not to eat from any tree in the garden?”
  philosophy: optimal-equivalence
  footnotes:
