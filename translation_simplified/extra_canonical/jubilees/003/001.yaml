translation:
  language: en
  text: 'During the six days[a] of the second week, at the Lord’s command, we brought to Adam all the wild animals, livestock, and birds, as well as everything that moves on land or in the water. They were brought according to their kinds and forms: the wild animals on the first day, the livestock on the second, the birds on the third, the land creatures on the fourth, and the water creatures on the fifth.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “And on the second day.”
    reason: alternative_reading
