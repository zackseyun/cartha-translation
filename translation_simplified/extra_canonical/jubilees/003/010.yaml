  text: 'Therefore this command was written on the heavenly tablets about a woman who gives birth: If she gives birth to a boy, she will be ritually unclean for seven days, corresponding to the first seven days. For another thirty-three days, she will remain in the period of purification from her bleeding. She must not touch anything holy or enter the sanctuary until she has completed the required days for a male child.'
