translation:
  language: en
  text: We gave him work and taught him how to do everything needed to care for the land. He worked the land while naked, but he did not realize he was naked and felt no shame. He guarded the garden from birds, wild animals, and livestock. He gathered its fruit and ate some, then saved the rest for himself.
