  simplified_phrase: his wife was made from his rib
  preserved_meaning: The woman was made as Adam’s wife from his rib.
  reasoning_layer_used: POB text
  rationale: The recast sentence preserves the rib image while making the relationship clear.
- pob_phrase: in the second week he showed her to him
  simplified_phrase: In the second week she was presented to him
  preserved_meaning: The woman was brought before Adam during the second week.
  reasoning_layer_used: POB text
