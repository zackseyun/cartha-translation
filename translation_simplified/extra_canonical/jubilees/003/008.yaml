translation:
  language: en
  text: In the first week Adam was created, and his wife was made from his rib. In the second week she was presented to him. For this reason, the command required a mother to remain ritually impure for seven days after the birth of a son and for fourteen days after the birth of a daughter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The chapter connects Adam’s and the woman’s delayed entrance into Eden with the later impurity periods after childbirth.
    reason: cross_reference
