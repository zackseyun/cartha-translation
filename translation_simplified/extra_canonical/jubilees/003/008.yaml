- pob_phrase: seven days for a male, and two weeks of days for a female, in impurity
  simplified_phrase: ritually impure for seven days after the birth of a son and for fourteen days after the birth of a daughter
  preserved_meaning: The command sets different postpartum impurity periods according to the child’s sex.
  reasoning_layer_used: POB footnote and applied revision
  rationale: Modern wording explains the ritual setting and converts two weeks into fourteen days.
