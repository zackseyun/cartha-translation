  text: The Lord cursed the serpent and remained angry with it forever. He was also angry with the woman because she listened to the serpent and ate. He said to her, “I will greatly increase your sorrow and pain. You will bear children in sorrow. Your desire will be for your husband, and he will rule over you.”
