  rationale: “Required” and “child” make the fragment understandable without changing the prescribed period.
- pob_phrase: But for a female, two weeks, like the first two weeks, in her uncleanness
  simplified_phrase: For a female child, she must remain unclean for two weeks, like the first two weeks.
  preserved_meaning: The female-child case requires two weeks of uncleanness while retaining the unresolved comparison.
  reasoning_layer_used: POB lexical decision and source-sensitive revision
  rationale: The fragment becomes a complete sentence while preserving “weeks” and the comparison.
- pob_phrase: sixty-six days she shall remain in the blood of her purification
  simplified_phrase: Then she must remain in the blood of her purification for sixty-six days.
  preserved_meaning: The sixty-six-day period remains tied to the source expression about her blood and purification.
