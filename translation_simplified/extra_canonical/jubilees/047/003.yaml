    unchanged: false
    changes_summary: Changed 'kept throwing them in' to 'continued casting them in' for a more formal register while preserving the sense. No other changes needed.
translation:
  language: en
  text: They kept throwing them in for seven months, right up to the day you were born. Your mother hid you for three months, until your presence gave her away. She made a basket for you, sealed it with pitch and asphalt, and set it among the reeds on the riverbank. She put you in it for seven days. Each night your mother came to nurse you, and during the day your sister Miriam guarded you from the birds.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The wording may mean that Miriam guarded him specifically from birds, or more generally from danger near the riverbank.
    reason: source_note
