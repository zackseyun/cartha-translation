translation:
  language: en
  text: Your brother. He became angry and deeply indignant. He said,[12] “Who appointed you to rule over us and judge us? Are you planning to kill me just as you killed the Egyptian yesterday?” This made you afraid, so you fled.
  philosophy: optimal-equivalence
