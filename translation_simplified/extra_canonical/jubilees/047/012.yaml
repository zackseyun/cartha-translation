  reasoning_layer_used: lexical revision
  rationale: “Deeply” conveys the force of the second anger verb without suggesting a mutual quarrel.
- pob_phrase: Who appointed you a ruler and a judge over us?
  simplified_phrase: Who appointed you to rule over us and judge us?
  preserved_meaning: The challenge to his authority as both ruler and judge remains.
  reasoning_layer_used: POB translation
  rationale: The formal titles are recast as familiar actions for easier reading.
- pob_phrase: And you feared and fled because of this matter.
