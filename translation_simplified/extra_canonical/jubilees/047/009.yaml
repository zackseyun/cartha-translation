translation:
  language: en
  text: Payment was made, and she nursed you. Later, when you had grown up, they brought you to Pharaoh’s daughter, and she adopted you as her son. Your father Amram taught you to write. When you had completed three sets of seven years, he brought you into the royal court.
  philosophy: optimal-equivalence
