- pob_phrase: you became her son
  simplified_phrase: she adopted you as her son
  preserved_meaning: Moses entered the recognized relationship of a son to Pharaoh’s daughter.
  reasoning_layer_used: POB translation and immediate narrative context
  rationale: The active wording makes the adoption relationship clear to a modern reader.
- pob_phrase: taught you writing
  simplified_phrase: taught you to write
  preserved_meaning: Amram instructed Moses in writing.
  reasoning_layer_used: POB translation
  rationale: The ordinary verbal expression replaces an awkward abstract phrase.
- pob_phrase: three weeks of years
  simplified_phrase: three sets of seven years
  preserved_meaning: The age is measured as three seven-year periods.
  reasoning_layer_used: POB wording and source-language time expression
  rationale: This explains the unfamiliar measure while retaining its seven-year structure.
interpretive_expansions:
- pob_phrase: you became her son
  rendering: she adopted you as her son
  claim: The sonship describes Pharaoh’s daughter taking Moses as her own son.
  evidence:
