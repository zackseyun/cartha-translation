  text: “Remain a widow until my son Shelah grows up. Then I will give you to him in marriage.” Shelah grew up, but Bedsu’el, Judah’s wife and Shelah’s mother, would not let Shelah marry her. Then Bedsu’el[a] died.
  philosophy: optimal-equivalence
  footnotes:
