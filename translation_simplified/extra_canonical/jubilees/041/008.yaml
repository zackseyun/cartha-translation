translation:
  language: en
  text: In the fifth year of this seven-year period[a], Shua, Judah’s wife, died. In the sixth year, Judah went up to Timnah to shear his sheep. People told Tamar, “Look, your father-in-law is going up to Timnah to shear[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “this week,” meaning a period of seven years. An alternate reading is “the seventh week.”
    reason: alternative_reading
  - marker: b
    text: Or “to shear his sheep.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: of this week
  simplified_phrase: of this seven-year period
  preserved_meaning: The event occurred in the fifth year of the stated week of years.
  reasoning_layer_used: source text, chronological context, and POB footnote
  rationale: This prevents readers from mistaking the period for seven days while preserving the alternate reading in a note.
- pob_phrase: Shua, the wife of Judah
  simplified_phrase: Shua, Judah’s wife
  preserved_meaning: Shua is identified as Judah’s wife.
  reasoning_layer_used: POB base text
  rationale: The possessive form is shorter and more natural in modern English.
- pob_phrase: they told Tamar, saying, “Behold”
  simplified_phrase: People told Tamar, “Look”
  preserved_meaning: Unidentified people report Judah’s journey to Tamar and draw her attention to it.
  reasoning_layer_used: POB base text and optimal-equivalence philosophy
  rationale: This removes a redundant speech formula and replaces an archaic attention word.
