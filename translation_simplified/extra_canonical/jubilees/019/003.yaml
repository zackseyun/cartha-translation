translation:
  language: en
  text: Abraham went to weep for her and bury her. We tested him[1] to see whether he would remain patient, and no violent words came from his mouth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: Later in the chapter, Sarah’s death is understood as the tenth test Abraham faced.
    reason: cross_reference
