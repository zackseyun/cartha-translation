  text: All Esau’s deeds were fierce. Abraham loved Jacob, but Isaac loved Esau. When Abraham saw what Esau did, he knew that his name and family line would be carried on through Jacob. So he called Rebekah and gave her orders concerning Jacob, because he knew that she loved Jacob much more.
