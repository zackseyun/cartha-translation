translation:
  language: en
  text: 'He kissed Jacob and blessed him, saying, “Jacob, my beloved son, whom I love from the depths of my soul, may God above the vault of heaven bless you. May he give you all the blessings he gave to Adam, Enoch, Noah, and Shem. May whatever he has spoken to me, and whatever he said he would give me, rest upon you and your descendants forever—as long as heaven remains above the earth. May the spirits of Mastema never come upon you or your descendants to turn you away from following the LORD, your God, from now on and forever. May the Lord God be a father to you, and may you be his firstborn son—and to the people always.[a] Go in peace, my son.”


    Then Rebekah and Jacob left Abraham together. Rebekah loved Jacob with all her heart and soul, far more than she loved Esau. But Isaac loved Esau far more than he loved Jacob.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The final words of this blessing are grammatically difficult, and their precise connection to the preceding words is uncertain.
    reason: source_note
