translation:
  language: en
  text: Through this trial, Abraham proved faithful and showed patience in his spirit. He said nothing about the promised land, which the LORD had said he would give to him and to his descendants after him. Yet Abraham asked for a place there to bury his dead. Because he proved faithful, he was recorded as a friend of the LORD on the heavenly tablets.
