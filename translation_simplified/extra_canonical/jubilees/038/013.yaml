  text: Jacob sent word to his sons, telling them to make peace. They made peace with those people, but forced them into service and required them to pay tribute to Jacob and his sons for the rest of their lives.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Jacob sent to his sons that they should make peace
  simplified_phrase: Jacob sent word to his sons, telling them to make peace
  preserved_meaning: Jacob directed his sons to establish peace.
  reasoning_layer_used: POB base text
  rationale: The common idiom “sent word” clearly expresses Jacob’s instruction.
- pob_phrase: they imposed upon them a yoke of service
  simplified_phrase: forced them into service
  preserved_meaning: The peace settlement placed the other people under compulsory service.
  reasoning_layer_used: POB base text and source image
  rationale: This preserves the yoke’s coercive force without narrowing the service to a particular kind of labor or rule.
- pob_phrase: so that they should pay tribute to Jacob and his sons all their days
  simplified_phrase: required them to pay tribute to Jacob and his sons for the rest of their lives
  preserved_meaning: They owed continuing tribute to Jacob and his sons throughout life.
  reasoning_layer_used: applied source-grounded revision
  rationale: This retains the audited meaning “pay tribute” and states the duration naturally.
translation_notes:
  risk_flags:
  - risk: Replacing the concrete “yoke” image removes the agricultural metaphor.
    mitigation: “Forced them into service” preserves the image’s central force of compulsory subjection.
