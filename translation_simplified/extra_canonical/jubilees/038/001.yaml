  reasoning_layer_used: POB translation
  rationale: The shorter wording removes repetition without losing either relationship or speaker.
- pob_phrase: Bend your bow, father, and send forth your arrows
  simplified_phrase: Draw your bow, Father, and shoot your arrows
  preserved_meaning: Jacob is told to ready the bow and launch its arrows.
  reasoning_layer_used: applied source review
  rationale: “Draw” and “shoot” clearly preserve the reviewed meanings of the Ge'ez verbs.
- pob_phrase: cast down the enemy and kill the adversary
