    unchanged: false
    changes_summary: Revised 'Bend your bow' to 'Take your bow' for better lexical fit, and 'send out your arrows' to 'put your arrows in the quiver' to reflect the likely sense of preparing arrows rather than shooting them. Kept the rest largely intact, with minor smoothing for natural formal English.
translation:
  language: en
  text: After this, Judah said to his father Jacob, “Draw your bow, Father, and shoot your arrows. Strike down the enemy and kill the one who opposes you. May strength be yours. But we will not kill your brother, because he is your companion and is like you. Let us honor him.”
