  yaml_path: translation/extra_canonical/jubilees/023/022.yaml
  text: And those who have escaped will not turn from their wickedness to the way of righteousness, because all of them will rise up for deceit and wealth, each to seize all that belongs to his neighbor; and they will make a great name for themselves, but not in truth and not in righteousness; and they will profane the holy of holies with their uncleanness and with the corruption of their defilement.
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T14:50:38Z'
    unchanged: false
    changes_summary: Changed 'return from their wickedness into the way of righteousness' to 'turn from their wickedness to the way of righteousness' for more natural English and closer sense.
translation:
  language: en
  text: Those who escape will not leave their wickedness and follow the way of righteousness. Instead, they will all pursue deceit and wealth, each one seeking to seize everything that belongs to his neighbor. They will make a great name for themselves, but not through truth or righteousness. They will profane the Most Holy Place with their uncleanness and with the corruption of their defilement.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: will not turn from their wickedness to the way of righteousness
  simplified_phrase: will not leave their wickedness and follow the way of righteousness
  preserved_meaning: They refuse to abandon evil and adopt righteous conduct.
  reasoning_layer_used: POB translation and applied revision
  rationale: The paired actions make the moral change clear.
- pob_phrase: will rise up for deceit and wealth
  simplified_phrase: will all pursue deceit and wealth
  preserved_meaning: They actively seek dishonest ends and riches.
  reasoning_layer_used: POB source-driven rendering
  rationale: “Pursue” clearly expresses active commitment without the awkward idiom.
- pob_phrase: the holy of holies
  simplified_phrase: the Most Holy Place
  preserved_meaning: They desecrate the place designated as supremely holy.
  reasoning_layer_used: POB translation
  rationale: The familiar title preserves the sacred superlative force.
translation_notes:
  risk_flags:
