translation:
  language: en
  text: 'For blow upon blow, wound upon wound, distress upon distress, bad news upon bad news, and sickness upon sickness. Every kind of evil like these will come together: disease, collapse, frost, hail, snow, fever, chills, stupor, famine, death, the sword, captivity, and every kind of suffering and sickness.'
