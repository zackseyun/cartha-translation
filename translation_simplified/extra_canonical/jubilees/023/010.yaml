translation:
  language: en
  text: The earlier generations lived for nineteen jubilee periods.[a] But after the Flood, human lifespans began to decline from that length. People grew old quickly, and their lives became shorter because of many troubles and because of their evil ways—except Abraham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In Jubilees, a jubilee period is forty-nine years.
    reason: cultural_note
