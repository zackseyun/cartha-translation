- pob_phrase: he rose from his bosom
  simplified_phrase: Jacob got up from where he had been lying close to Abraham
  preserved_meaning: Jacob rose from the close sleeping position he had shared with Abraham.
  reasoning_layer_used: source text, immediate context, and applied mistranslation review
  rationale: This identifies both men and preserves physical closeness without implying an active embrace.
- pob_phrase: Jacob also with them, and a torch was in his hand
  simplified_phrase: Jacob went with them. One of the men carried a torch.
  preserved_meaning: Jacob accompanied Rebekah and Isaac, and one male member of the group held a single torch.
  reasoning_layer_used: source morphology, POB wording, and grounding review
  rationale: This keeps the torch singular without resolving the masculine pronoun to Jacob.
- pob_phrase: when they had gone, they found Abraham lying dead
  simplified_phrase: When they arrived, they found Abraham lying dead.
  preserved_meaning: The group reached Abraham and discovered him dead.
  reasoning_layer_used: POB translation and narrative context
  rationale: “Arrived” states the completed journey in ordinary English.
