translation:
  language: en
  text: Jacob got up from where he had been lying close to Abraham. He ran to his mother Rebekah and told her what had happened. That night Rebekah went and told Isaac. Rebekah and Isaac went together, and Jacob went with them. One of the men carried a torch. When they arrived, they found Abraham lying dead.
