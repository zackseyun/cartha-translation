translation:
  language: en
  text: In that generation, children[a] will rebuke their fathers and elders because of their sin and injustice, because of what they say, and because of the great evils they commit. They will also rebuke them for abandoning the covenant the LORD made with them. By that covenant, they were to obey all his commandments and ordinances and all his law, without turning aside to the right or the left.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “sons.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: reproach their fathers and their elders
  simplified_phrase: rebuke their fathers and elders
  preserved_meaning: The children openly blame and correct the older generation for wrongdoing.
  reasoning_layer_used: POB translation and grounding review
  rationale: “Rebuke” preserves the force of reproach without implying formal condemnation.
- pob_phrase: because of the speech of their mouth
  simplified_phrase: because of what they say
  preserved_meaning: Their speech is one reason the children rebuke them.
  reasoning_layer_used: POB wording and grounding review
  rationale: This natural wording avoids specifying that the phrase itself means “evil words.”
- pob_phrase: that they should keep and do all his commandments and his ordinances and all his law
  simplified_phrase: By that covenant, they were to obey all his commandments and ordinances and all his law
  preserved_meaning: The covenant required obedience to every part of the LORD’s instruction.
  reasoning_layer_used: POB covenant wording and grounding review
  rationale: A separate sentence clarifies the obligation while retaining the three categories and singular “law.”
translation_notes:
  risk_flags:
  - risk: “Obey” compresses the paired verbs “keep and do.”
    mitigation: It clearly preserves the combined requirement to observe and carry out the covenant commands.
