translation:
  language: en
  text: They will quarrel with one another—the young with the old and the old with the young, the poor with the rich, the lowly with the great, and the needy with the ruler—about the law and the covenant. This will happen because they have forgotten the commandments, the covenant, the festivals, the months, the Sabbaths, the Jubilees, and everything that has been appointed.
