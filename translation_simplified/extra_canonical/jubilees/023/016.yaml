translation:
  language: en
  text: Then they will say, “People of former times lived many good years—as many as a thousand. But look at us! When we live a long life, we reach seventy years, or eighty if we are strong. Those years are evil, and there is no peace in the time of this evil generation.”
  philosophy: optimal-equivalence
