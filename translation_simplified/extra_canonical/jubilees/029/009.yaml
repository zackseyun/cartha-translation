translation:
  language: en
  text: “The Heap of Witness,” named after this heap. In earlier times, however, the land of Gilead was called the land of the Rephaim because it belonged to them. The Rephaim were giants born there. They stood about fifteen, thirteen and a half, twelve, or even ten and a half feet tall.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The source lists their heights as ten, nine, eight, and seven cubits; the modern estimates assume a cubit of about eighteen inches.
    reason: cultural_note
  - marker: b
    text: Or, “The Feast of Witness,” named after this feast.
    reason: alternative_reading
