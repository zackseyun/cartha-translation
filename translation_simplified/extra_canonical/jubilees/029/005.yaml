  text: the land of Gilead. Jacob kept his plans hidden from Laban and did not tell him. In the seventh year of the fourth week,[a] Jacob left for Gilead on the twenty-first day of the first month. Laban pursued him and caught up with him on the mountain of Gilead on the thirteenth day of the third month.
