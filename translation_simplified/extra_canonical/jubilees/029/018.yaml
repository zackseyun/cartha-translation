translation:
  language: en
  text: He lived there, away from his son Esau. When Jacob went to Mesopotamia, Esau married Mahalath, the daughter of Ishmael. He gathered all his father’s livestock and took his wives with him. Then he went up to live on Mount Seir, leaving his father Isaac at the Well of the Oath.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Well of the Oath is Beersheba. The underlying wording may also be translated “there.”
    reason: alternative_reading
