translation:
  language: en
  text: Their kingdoms were Karnaim, Ashtaroth, Edrei, Misur, and Beon.[11] The Lord destroyed them because their deeds were evil, for they were extremely lawless. He settled the Amorites, an evil and sinful people, in their place. To this day, no people has completed all their sins, and they no longer exist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '11'
    text: Some place-names in this list of Rephaim territory are difficult to identify because of how the Ethiopic text was transmitted; these spellings follow the source conservatively.
    reason: textual_variant
