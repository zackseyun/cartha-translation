  language: en
  text: Abraham, his father, was on Mount Hebron.[a] From time to time, Jacob sent everything they needed to his father and mother at Mount Hebron. They blessed Jacob with all their heart and soul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
