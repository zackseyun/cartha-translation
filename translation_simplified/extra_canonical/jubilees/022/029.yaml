  preserved_meaning: The Most High rules over all people and created all things.
  reasoning_layer_used: POB base text
  rationale: The wording clarifies the two senses of “all” without changing the titles.
- pob_phrase: as an everlasting possession
  simplified_phrase: as my possession forever
  preserved_meaning: The land was to remain Abraham’s enduring possession.
  reasoning_layer_used: POB base text
  rationale: The abstract phrase is recast in direct, common English.
- pob_phrase: that I might establish a holy seed
  simplified_phrase: so that I might raise up a holy line of descendants
  preserved_meaning: Abraham remains the subject who is to establish consecrated descendants.
  reasoning_layer_used: applied grammar revision
  rationale: The rewrite makes both the family meaning and the shift to Abraham as subject clear.
