translation:
  language: en
  text: He blessed him with all his heart and said, “The Most High God, the God of everyone and Creator of everything, brought me out of Ur of the Chaldeans to give me this land as my possession forever and so that I might raise up a holy line of descendants. May the Most High be blessed forever.”
