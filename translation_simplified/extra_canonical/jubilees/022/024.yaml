    unchanged: false
    changes_summary: Changed 'profane' to 'unclean' for better lexical fit with the source term; changed 'walk into' to 'go to' for more natural formal English; changed 'on the earth' to 'upon the earth' for register consistency; changed 'taken away' to 'removed' to better match the repeated verb and preserve consistency.
translation:
  language: en
  text: All who worship idols and all who are profane[a] have no hope in the land of the living. They will go down to Sheol[b], and they will go to the place of judgment. They will not be remembered on earth. Just as the people of Sodom were removed from the earth, so everyone who worships idols will be removed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “those considered odious.”
    reason: lexical_alternative
  - marker: b
    text: Sheol is retained because the text distinguishes going down to Sheol from going to the place of judgment.
    reason: source_note
