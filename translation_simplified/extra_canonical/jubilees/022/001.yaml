translation:
  language: en
  text: In the second year of the first seven-year period[1] within the forty-fourth jubilee—the year Abraham died—Isaac and Ishmael came from the Well of the Oath. They came to celebrate the Feast of Weeks, the feast of the firstfruits of the harvest, with their father Abraham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: Literally, “the first week”; Jubilees uses seven-year periods to date events. Some earlier renderings read “the forty-second jubilee.”
    reason: source_note
