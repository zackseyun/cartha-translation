  text: And he came near and kissed him. And he said, “Blessed be my son Jacob and all his sons by the Lord Most High, to all the ages. May the Lord give you a righteous seed; and may he sanctify some of your offspring in the midst of all the earth. Let the nations serve you, and let all the nations bow down before your seed.”
  footnotes:
  - marker: a
    text: Or 'from your offspring may he sanctify himself'.
    reason: previous_rendering
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T14:50:27Z'
    unchanged: false
    changes_summary: 'Revised several phrases for closer lexical accuracy and more natural formal English: changed ''to the Lord Most High for all ages'' to ''by the Lord Most High, to all the ages''; changed ''a seed of righteousness'' to ''a righteous seed''; replaced ''may he sanctify some of your offspring'' with ''from your offspring may he sanctify himself'' to reflect the source more fully; and changed ''Nations will desire you'' to ''Let the nations serve you'' to match the verb more accurately.'
translation:
  language: en
  text: He came close and kissed him. Then he said, “May the Lord Most High bless my son Jacob and all his sons forever. May the Lord give you righteous descendants. May he set apart some of your descendants as holy throughout the earth. May the nations serve you, and may all nations bow down before your descendants.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Blessed be my son Jacob and all his sons by the Lord Most High, to all the ages
  simplified_phrase: May the Lord Most High bless my son Jacob and all his sons forever
  preserved_meaning: The blessing comes from the Lord Most High and continues through all ages.
  reasoning_layer_used: POB text and revision rationale
  rationale: The passive blessing and unusual time phrase are recast as a direct, natural prayer.
- pob_phrase: a righteous seed
  simplified_phrase: righteous descendants
  preserved_meaning: Jacob is promised offspring characterized by righteousness.
  reasoning_layer_used: POB text and revision rationale
  rationale: “Descendants” clearly expresses the biblical use of “seed” here.
- pob_phrase: may he sanctify some of your offspring in the midst of all the earth
  simplified_phrase: May he set apart some of your descendants as holy throughout the earth
  preserved_meaning: God will sanctify a portion of Jacob’s offspring across the earth.
  reasoning_layer_used: applied mistranslation correction
  rationale: The wording explains “sanctify” while preserving the active verb and partitive “some.”
interpretive_expansions:
- pob_phrase: sanctify
  rendering: set apart ... as holy
  claim: Sanctifying these descendants means setting them apart as holy.
  evidence:
