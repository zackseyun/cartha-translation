simplification_decisions:
- pob_phrase: strengthen you to do righteousness and his will before him
  simplified_phrase: give you strength to do what is right and what he desires in his presence
  preserved_meaning: God enables Jacob to act rightly and obey God's will before God.
  reasoning_layer_used: POB translation and grounding review
  rationale: Common wording clarifies righteousness and preserves the previously omitted idea of God's presence.
- pob_phrase: your seed
  simplified_phrase: your descendants
  preserved_meaning: The blessing extends to Jacob's future offspring.
  reasoning_layer_used: source payload and POB translation
  rationale: “Descendants” expresses the family-line meaning without the opaque seed idiom.
- pob_phrase: a people of inheritance according to his will all the days
  simplified_phrase: a people who belong to him as his inheritance, according to his will for all time
  preserved_meaning: By God's will, they are permanently his chosen possession and inheritance.
  reasoning_layer_used: POB translation, applied revision, and grounding review
  rationale: The possessive clause explains the relationship while retaining the inheritance image and enduring duration.
interpretive_expansions:
- pob_phrase: a people of inheritance
  rendering: a people who belong to him as his inheritance
  claim: The chosen people belong to God as his inheritance.
  evidence:
  - The POB says they are “for him a people of inheritance.”
  - The applied revision deliberately preserves the inheritance relationship.
  confidence: high
  alternatives_preserved:
