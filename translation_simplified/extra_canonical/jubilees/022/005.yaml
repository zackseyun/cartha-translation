- pob_phrase: made a great feast of rejoicing before Ishmael his brother
  simplified_phrase: held a great, joyful feast in the presence of his brother Ishmael
  preserved_meaning: The feast remains a large celebration held before Ishmael.
  reasoning_layer_used: POB translation and immediate context
  rationale: Ordinary word order and “in the presence of” make the relationship between the feast and Ishmael clear.
- pob_phrase: from the firstfruits of the land
  simplified_phrase: made from the first produce of the land
  preserved_meaning: The cakes come from the land’s earliest harvested produce.
  reasoning_layer_used: POB translation and footnote
  rationale: This explains the agricultural meaning without erasing the first-harvest idea.
- pob_phrase: so that he might bring them to Abraham, his father
  simplified_phrase: to take to Abraham, his father
  preserved_meaning: Jacob is to deliver the cakes to Abraham, who is called his father in the source.
  reasoning_layer_used: applied lexical revision
  rationale: The sentence is shortened while the audited kinship term remains in the text.
translation_notes:
  risk_flags:
  - risk: Modern readers may assume that Abraham was Jacob’s immediate father.
    mitigation: A footnote explains that “father” is an ancestral term here.
  - risk: “Peace offering” may be unfamiliar to readers.
    mitigation: The ritual term is retained because replacing it with a general offering could weaken its specific meaning.
