- pob_phrase: before men
  simplified_phrase: before others
  preserved_meaning: Jacob is called to display strength in the presence of other people.
  reasoning_layer_used: POB translation
  rationale: “Others” avoids using “men” as a generic term for people.
- pob_phrase: all the seed of Seth
  simplified_phrase: all the descendants of Seth
  preserved_meaning: The explicit reference to Seth’s lineage remains intact.
  reasoning_layer_used: POB footnote and source payload
  rationale: “Descendants” clearly expresses the biblical lineage image conveyed by “seed.”
- pob_phrase: will be justified
  simplified_phrase: will be shown to be right
  preserved_meaning: Jacob’s conduct and that of his sons will be recognized as right.
  reasoning_layer_used: POB translation and applied revision
  rationale: The plain phrase communicates justification here without an opaque passive term.
