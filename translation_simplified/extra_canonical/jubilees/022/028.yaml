translation:
  language: en
  text: They both lay down together on one bed. Jacob slept in the arms of his grandfather Abraham. Abraham kissed him seven times. Abraham felt compassion for Jacob, and his heart rejoiced over him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The final clause is difficult; more literally, “his compassion and his heart rejoiced over him.”
    reason: lexical_alternative
