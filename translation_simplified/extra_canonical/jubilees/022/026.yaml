translation:
  language: en
  text: “I have built this house for myself, to place my name on it here on earth.[26] I give it to you and your descendants forever, and it will be called the house of Abraham. I give it to you and your descendants forever because you will build my house and establish my name before God forever. Your descendants and your name will endure through every generation on earth.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: '26'
    text: “House” may mean Abraham’s place of worship, his family line, or both; the phrase “house of Abraham” preserves this ambiguity.
    reason: simplification_note
simplification_decisions:
- pob_phrase: to put my name upon it on the earth
  simplified_phrase: to place my name on it here on earth
  preserved_meaning: The speaker puts his name on the house as the source states.
  reasoning_layer_used: POB text and source image
  rationale: “Place” is natural English and preserves the concrete name-on-house image.
- pob_phrase: your seed
  simplified_phrase: your descendants
  preserved_meaning: The promise extends to Abraham’s continuing family line.
  reasoning_layer_used: POB contextual meaning
  rationale: “Descendants” clearly expresses the genealogical sense of “seed.”
- pob_phrase: will stand throughout all the generations of the earth
  simplified_phrase: will endure through every generation on earth
  preserved_meaning: Abraham’s descendants and name will continue across all earthly generations.
  reasoning_layer_used: POB text and source idiom
  rationale: “Endure” conveys the idiomatic force of “stand” in common English.
