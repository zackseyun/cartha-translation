translation:
  language: en
  text: Because Ham sinned, Canaan went astray. All Canaan’s descendants will be wiped from the earth. On the day of judgment, none of them will remain or escape.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the transgression of Ham
  simplified_phrase: Ham sinned
  preserved_meaning: Ham committed the wrongdoing that led to Canaan’s error.
  reasoning_layer_used: POB translation and source clause
  rationale: The direct verb expresses the same causal wrongdoing in common English.
- pob_phrase: Canaan erred
  simplified_phrase: Canaan went astray
  preserved_meaning: Canaan departed from the right way.
  reasoning_layer_used: POB translation and source wording
  rationale: Went astray is clearer while preserving the moral force of the statement.
- pob_phrase: all his seed will be destroyed from the earth; and there will be no remnant from him, nor anyone who escapes
  simplified_phrase: All Canaan’s descendants will be wiped from the earth. On the day of judgment, none of them will remain or escape.
  preserved_meaning: Canaan’s entire line faces destruction, with neither survivors nor escapees at judgment.
  reasoning_layer_used: POB translation, revision pass, and high-agreement cross-check
  rationale: Descendants clarifies the family image, and shorter sentences make the total judgment easier to follow.
