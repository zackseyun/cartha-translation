translation:
  language: en
  text: Do not ever forsake him or leave him, from now through all the days of eternity. Watch over him and his descendants with open eyes. Keep him safe, bless him, and set him apart for a people who belong to you. Give him all your blessings from now through all the days forever. Renew your covenant with him and his descendants, and renew your mercy toward them, according to all your will, throughout every generation on earth.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: let your eyes be open upon him and upon his seed
  simplified_phrase: Watch over him and his descendants with open eyes
  preserved_meaning: God is asked to remain attentively watchful over him and his descendants.
  reasoning_layer_used: POB text and awkward-English revision rationale
  rationale: This keeps the open-eyes image while clearly expressing watchful care.
- pob_phrase: sanctify him for a people of your inheritance
  simplified_phrase: set him apart for a people who belong to you
  preserved_meaning: He is consecrated in relation to a people who belong to God.
  reasoning_layer_used: POB controlling translation and grounding review
  rationale: This explains sanctification and divine ownership without claiming that the people will come from him.
- pob_phrase: renew your covenant and your mercy with him and with his seed
  simplified_phrase: Renew your covenant with him and his descendants, and renew your mercy toward them
  preserved_meaning: God is asked to renew both his covenant and his mercy in relation to him and his descendants.
  reasoning_layer_used: POB controlling translation
  rationale: The split construction reads naturally while keeping covenant and mercy distinct.
interpretive_expansions:
- pob_phrase: that you may keep him
  rendering: Keep him safe
  claim: Keeping him here includes preserving him under divine care.
  evidence:
