  - preserve him
- pob_phrase: let your eyes be open upon him and upon his seed
  rendering: Watch over him and his descendants with open eyes
  claim: The open-eyes image expresses attentive divine watchfulness.
  evidence:
  - The following purpose clause asks God to keep and bless him.
  - The POB revision rationale identifies watchful care as the English sense.
  confidence: high
  alternatives_preserved:
  - keep your eyes open upon him
  - look upon him and his descendants
translation_notes:
  risk_flags:
  - risk: “Keep him safe” narrows the broad verb “keep.”
    mitigation: The surrounding image of watchful care supports protection, while the audit preserves broader alternatives.
  - risk: “For a people who belong to you” leaves the exact relation between the man and the people open.
    mitigation: This preserves the POB ambiguity rather than asserting that the people come from him.
