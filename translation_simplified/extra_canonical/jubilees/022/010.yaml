translation:
  language: en
  text: My God, may your mercy and peace rest on your servant and on his sons’ descendants. May they be your chosen people, your inheritance from among all the nations on earth, from now on, throughout every generation, forever.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: be upon your servant
  simplified_phrase: rest on your servant
  preserved_meaning: God’s mercy and peace are invoked upon his servant.
  reasoning_layer_used: POB translation
  rationale: “Rest on” expresses the blessing naturally without changing its force.
- pob_phrase: the seed of his sons
  simplified_phrase: his sons’ descendants
  preserved_meaning: The blessing extends to the later generations descended from his sons.
  reasoning_layer_used: POB translation and source payload
  rationale: “Descendants” makes the biblical lineage expression immediately clear.
- pob_phrase: from now and for all the days of the generations of the earth, for all ages
  simplified_phrase: from now on, throughout every generation, forever
  preserved_meaning: Their chosen status is requested for all future generations and ages.
  reasoning_layer_used: POB translation
  rationale: The shorter wording preserves both continuous generations and unending duration.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “inheritance” only as property received after death.
    mitigation: Retaining “your inheritance” preserves the biblical image, while “chosen people” identifies the inheritance as a people.
