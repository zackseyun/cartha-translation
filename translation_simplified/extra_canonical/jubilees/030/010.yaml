translation:
  language: en
  text: Anyone who commits this defilement must die by stoning. This law never expires. There can be no pardon or atonement. The man who has defiled a daughter among all Israel must be rooted out, because he has given some of his seed to Molech and has acted wickedly by committing this defilement.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The reference to Molech is abrupt in the Ethiopic text; it may compare illicit seed with defilement through forbidden worship.
    reason: textual_variant
