translation:
  language: en
  text: Levi’s descendants were chosen for the priesthood and to serve as Levites. They would serve before the LORD, just as we always do.[17] Levi and his sons will be blessed forever because he was zealous to do what was right, carry out justice, and take vengeance on everyone who rose up against Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '17'
    text: The word “we” refers to the angelic speakers in Jubilees’ account of the revelation at Sinai.
    reason: source_note
simplification_decisions:
- pob_phrase: the seed of Levi
  simplified_phrase: Levi’s descendants
  preserved_meaning: The phrase refers to Levi’s family line, not literal seed.
  reasoning_layer_used: POB context and ordinary kinship usage
  rationale: “Descendants” states the family meaning directly.
- pob_phrase: chosen for the priesthood and to be Levites
  simplified_phrase: chosen for the priesthood and to serve as Levites
  preserved_meaning: Levi’s descendants were selected for priestly and Levitical service.
  reasoning_layer_used: applied revision on the Ge‘ez prefix la-
  rationale: “To serve as Levites” avoids suggesting that they were chosen on behalf of Levites.
- pob_phrase: zealous to execute righteousness and judgment and vengeance
  simplified_phrase: zealous to do what was right, carry out justice, and take vengeance
  preserved_meaning: Levi actively pursued righteousness, justice, and vengeance as three distinct ideas.
  reasoning_layer_used: POB controlling translation
  rationale: The verbs make the three abstract nouns understandable without merging them.
translation_notes:
  risk_flags:
  - risk: “Take vengeance” may sound like unrestricted personal retaliation.
    mitigation: 'The wording retains POB’s specific setting: action against those who rose up against Israel.'
