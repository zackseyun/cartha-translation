translation:
  language: en
  text: or if he gives one of his daughters in marriage to a man from any of the nations. For this brings plague upon plague[15] and curse upon curse. Every judgment, plague, and curse will come. If he does this, or if he closes his eyes to those who practice uncleanness, to those who defile the LORD’s sanctuary, and to those who treat his holy name as unholy, all the people will be judged together for all this uncleanness and profanation. God will show no partiality. He will accept nothing from that person’s hand—no fruit, sacrifice, burnt offering, fat portion, or pleasing fragrance. This applies to every man or woman in Israel who defiles his sanctuary.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '15'
    text: This verse is unusually dense and appears to combine several legal and worship-related statements; the translation keeps their sequence without forcing them into a smoother argument.
    reason: simplification_note
