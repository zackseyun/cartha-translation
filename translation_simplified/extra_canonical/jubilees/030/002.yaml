translation:
  language: en
  text: There Shechem saw Dinah, Jacob’s daughter. Shechem was the son of Hamor the Hivite and a ruler of the land. He seized Dinah, had sexual relations with her, and defiled her. She was a young girl.[2]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '2'
    text: The final clause says that Dinah was a young girl; the next verse specifies that she was twelve years old.
    reason: lexical_alternative
