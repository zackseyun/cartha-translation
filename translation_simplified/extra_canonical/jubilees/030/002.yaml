    mitigation: The surrounding words “seized” and “defiled” preserve the passage’s coercive force.
  - risk: Modern readers may hear “defiled her” as assigning Dinah moral blame.
    mitigation: The source-driven term is kept within a sequence that identifies Shechem as the acting offender.
