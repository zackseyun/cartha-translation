translation:
  language: en
  text: 'Therefore I have commanded you: “Give Israel this testimony. See what happened to the people of Shechem and their sons. They were handed over to two of Jacob’s sons, who killed them violently.[16] This was counted to those two sons as righteousness and recorded for them as righteousness.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: '16'
    text: The underlying phrase is difficult; it may mean “with torment,” “with distress,” or, in some textual traditions, “with the sword.” In any case, they were violently struck down.
    reason: lexical_alternative
