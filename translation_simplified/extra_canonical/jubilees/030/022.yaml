translation:
  language: en
  text: They brought everything to their father Jacob. He spoke to them about their destruction of the city,[a] because he was afraid of the people who lived in the land—the Canaanites and the Perizzites. Then terror from Yahweh gripped every city around Shechem. Dread had fallen on them, so they did not set out to pursue Jacob’s sons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “killed the city.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: they brought it all to Jacob their father
  simplified_phrase: They brought everything to their father Jacob
  preserved_meaning: They delivered all of it to Jacob, who was their father.
  reasoning_layer_used: POB base text
  rationale: Natural English places the family relationship before Jacob’s name.
- pob_phrase: those who lived in the land
  simplified_phrase: the people who lived in the land
  preserved_meaning: Jacob feared the local inhabitants, specifically the Canaanites and Perizzites.
  reasoning_layer_used: immediate context
  rationale: Adding “people” makes the referent immediately clear.
- pob_phrase: they did not rise up to pursue
  simplified_phrase: they did not set out to pursue
  preserved_meaning: The surrounding cities took no action to chase Jacob’s sons.
  reasoning_layer_used: POB base text
  rationale: “Set out” expresses the action naturally without weakening it.
interpretive_expansions:
- pob_phrase: the terror of Yahweh was on all the cities
  rendering: terror from Yahweh gripped every city
  claim: Yahweh was the source of the terror that overwhelmed the surrounding cities.
  evidence:
