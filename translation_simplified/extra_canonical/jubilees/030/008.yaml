translation:
  language: en
  text: They must execute her by burning her with fire, because she has brought disgrace on her father’s household. She must be uprooted from Israel. No one who commits sexual immorality or is defiled is to be found in Israel in any generation on earth,[a] because Israel is holy to the LORD. Any man who defiles Israel must certainly die; they must stone him to death.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “throughout all the days of the generations of the earth.”
    reason: source_note
simplification_decisions:
- pob_phrase: defiled the name of her father's house
  simplified_phrase: brought disgrace on her father’s household
  preserved_meaning: Her conduct dishonored her father’s family and its reputation.
  reasoning_layer_used: POB translation and immediate context
  rationale: The wording makes the family-shame idiom clear without weakening it.
- pob_phrase: throughout all the days of the generations of the earth
  simplified_phrase: in any generation on earth
  preserved_meaning: The prohibition applies continually across all earthly generations.
  reasoning_layer_used: applied revision preserving the Ge'ez temporal idiom
  rationale: The main text states the duration naturally, while the footnote retains the source image.
- pob_phrase: they shall stone him with stones
  simplified_phrase: they must stone him to death
  preserved_meaning: The prescribed penalty is execution by stoning.
  reasoning_layer_used: POB translation and preceding death clause
  rationale: The repeated instrument is replaced with the outcome already stated in the verse.
interpretive_expansions:
- pob_phrase: They shall burn her with fire
  rendering: They must execute her by burning her with fire
  claim: The burning is a means of execution, not merely injury or destruction of property.
  evidence:
  - The command concerns the woman herself.
  - The following clause removes her from Israel.
  - The parallel penalty later in the verse explicitly requires death.
  confidence: high
translation_notes:
  risk_flags:
  - risk: “Brought disgrace” may sound less ritually charged than “defiled the name.”
    mitigation: The wording retains public dishonor of the father’s household and keeps “defiled” elsewhere.
  - risk: “In any generation” compresses a characteristic temporal idiom.
    mitigation: The literal wording is preserved in footnote a.
