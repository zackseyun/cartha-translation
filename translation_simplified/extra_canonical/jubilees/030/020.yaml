translation:
  language: en
  text: On the day Jacob’s sons killed Shechem, a record was written for them in heaven. It stated that they had done what was right and upright and had taken vengeance on the sinners. It was written down for blessing.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: a record was written for them in heaven that they had performed
  simplified_phrase: a record was written for them in heaven. It stated that they had done
  preserved_meaning: The heavenly record states what their actions amounted to.
  reasoning_layer_used: POB text and applied source-grounded revision
  rationale: The sentence break clarifies the record’s content while retaining the corrected passive “was written.”
- pob_phrase: performed righteousness and uprightness
  simplified_phrase: done what was right and upright
  preserved_meaning: Their actions were judged to have both righteousness and uprightness.
  reasoning_layer_used: POB controlling meaning
  rationale: The verbal wording is easier to understand while keeping both moral qualities distinct.
- pob_phrase: and it was written down for blessing
  simplified_phrase: It was written down for blessing
  preserved_meaning: The record was written with respect to blessing without defining it as itself a blessing.
  reasoning_layer_used: POB text and independent grounding review
  rationale: A separate sentence improves readability while preserving the open relation to blessing.
