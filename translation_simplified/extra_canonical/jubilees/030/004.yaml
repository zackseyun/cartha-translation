translation:
  language: en
  text: They spoke to the men of Shechem with deceit, betrayed them, and led them astray. Then Simeon and Levi entered Shechem without warning and brought judgment on all its men. They killed every male they found there and left none of them alive. They killed them all while the men were in agony, because they had disgraced their sister Dinah.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: spoke with them deceitfully and dealt treacherously with them and misled them
  simplified_phrase: spoke to the men of Shechem with deceit, betrayed them, and led them astray
  preserved_meaning: The three acts of deception, betrayal, and misleading remain distinct.
  reasoning_layer_used: POB translation and immediate context
  rationale: Common verbs clarify the accusations without combining them.
- pob_phrase: entered Shechem unexpectedly and executed judgment on all the men of Shechem
  simplified_phrase: entered Shechem without warning and brought judgment on all its men
  preserved_meaning: Their surprise entry and punitive judgment against Shechem’s men are retained.
  reasoning_layer_used: POB translation
  rationale: Natural wording preserves both the surprise and judicial force.
- pob_phrase: they killed every male whom they found in it, and they left none in it
  simplified_phrase: They killed every male they found there and left none of them alive
  preserved_meaning: No male they found in Shechem was spared.
  reasoning_layer_used: POB translation and grounding review
  rationale: “None of them” keeps the statement limited to the males in view.
