translation:
  language: en
  text: All the members of Jacob’s family who entered Egypt numbered seventy. His sons and grandsons numbered seventy-five in all.[27]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '27'
    text: 'The numbers are deliberate but not simple: the chapter first says seventy entered Egypt, then counts seventy-five descendants, and later says that five died in Egypt, not counting Joseph and his two sons in that death notice.'
    reason: cross_reference
