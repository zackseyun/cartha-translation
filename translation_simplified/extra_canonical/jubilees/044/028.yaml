    text: The opening words about Bilhah are supplied because the surviving source segment begins partway through the sentence.
    reason: source_note
simplification_decisions:
- pob_phrase: '[And these are the names of the sons of Bilhah, the handmaid] of Rachel, the wife of Jacob'
  simplified_phrase: These are the names of the sons of Bilhah, who was the servant of Rachel, Jacob’s wife.
  preserved_meaning: Bilhah is identified as Rachel’s servant, while Rachel is identified as Jacob’s wife.
  reasoning_layer_used: applied revision and source review
  rationale: The apposition is recast as a relative clause to prevent Bilhah from being mistaken for Jacob’s wife.
- pob_phrase: 'whom she bore to Jacob: Dan and Naphtali'
  simplified_phrase: Bilhah bore Dan and Naphtali to Jacob.
  preserved_meaning: Bilhah, not Rachel, is the mother of Dan and Naphtali.
  reasoning_layer_used: applied mistranslation revision
  rationale: Naming Bilhah directly removes the unclear pronoun without changing the source-driven correction.
- pob_phrase: 'the sons of Dan: Hushim and Samon'
  simplified_phrase: Dan’s sons were Hushim and Samon
  preserved_meaning: Hushim and Samon are identified as Dan’s sons.
  reasoning_layer_used: POB base text
  rationale: The list heading is turned into a complete sentence for smoother reading.
