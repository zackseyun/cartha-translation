translation:
  language: en
  text: 'These are the names of the sons of Bilhah, who was the servant of Rachel, Jacob’s wife.[a] Bilhah bore Dan and Naphtali to Jacob. These are the names of their children who went with them into Egypt: Dan’s sons were Hushim and Samon.'
