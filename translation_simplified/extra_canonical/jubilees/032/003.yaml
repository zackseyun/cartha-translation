- pob_phrase: Levi came up in the portion of the LORD
  simplified_phrase: Levi was counted as the portion belonging to the LORD
  preserved_meaning: The counting designated Levi as the LORD’s portion.
  reasoning_layer_used: applied revision and POB base text
  rationale: The wording makes the result of the count clear without explaining beyond the record.
- pob_phrase: his father clothed him
