translation:
  language: en
  text: During that time, Rachel became pregnant with Benjamin. Jacob counted his sons backward, beginning with Benjamin,[a] and Levi was counted as the portion belonging to the LORD. Then Jacob, his father, clothed him.
  philosophy: optimal-equivalence
  footnotes:
