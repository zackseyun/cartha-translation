  text: The LORD will put it in their mouths so that they may bless all the descendants of the beloved one. Your mother named you Levi. She truly gave you that name so that you would be joined to God and be a companion to all the sons of Jacob. Let his table be yours. You and your sons shall eat there—and for all....[a]
