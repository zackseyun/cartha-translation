translation:
  language: en
  text: from the land of Gilead. Jacob kept his plans hidden from Laban and did not tell him. In the seventh year of the fourth week, Jacob turned toward Gilead on the twenty-first day of the first month. Laban pursued him and caught up with him at the mountain of Gilead in the third month, in the thirteenth year. But the LORD did not let Laban harm Jacob, because the LORD appeared to Laban in a dream that night. Laban then told Jacob about it. On the fifteenth day, Jacob prepared a feast for Laban and everyone who had come with him. There at the mountain, Jacob and Laban swore to each other that neither of them would cross over to the other with evil intent.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Jacob concealed his heart from Laban
  simplified_phrase: Jacob kept his plans hidden from Laban
  preserved_meaning: Jacob secretly withheld his intentions from Laban.
  reasoning_layer_used: POB wording and immediate context
  rationale: The heart image is expressed by its contextual sense of hidden intention.
- pob_phrase: in the fourth week, in the seventh year
  simplified_phrase: In the seventh year of the fourth week
  preserved_meaning: The seventh year remains located within the fourth week.
  reasoning_layer_used: POB chronology
  rationale: Reordering the units makes the unfamiliar dating formula easier to follow.
- pob_phrase: made a feast for Laban and for all who had come with him
  simplified_phrase: prepared a feast for Laban and everyone who had come with him
  preserved_meaning: Jacob provided a feast for Laban and his companions.
  reasoning_layer_used: POB main text
  rationale: Natural English replaces the less familiar expression “made a feast.”
interpretive_expansions:
- pob_phrase: for he appeared to him in a dream at night and Laban told Jacob
  rendering: because the LORD appeared to Laban in a dream that night. Laban then told Jacob about it.
  claim: The LORD appeared to Laban, who afterward told Jacob about the dream.
  evidence:
  - Laban is the nearest fitting antecedent of “him.”
  - The audited source review identifies Laban as the subject who told Jacob.
  confidence: high
translation_notes:
  risk_flags:
  - risk: “Kept his plans hidden” does not retain the literal heart image.
    mitigation: It preserves the contextual force of concealing an inner intention.
  - risk: The sequence from the seventh year to the thirteenth year is chronologically difficult.
    mitigation: Both dates are retained without harmonizing the tension.
