translation:
  language: en
  text: 'Every man or woman in Israel who defiles his sanctuary. Because of this, I commanded you: “Proclaim this testimony throughout Israel. Look at what happened to Shechem and his sons. They were handed over to two of Jacob’s sons, who killed them while they were in agony. This deed was counted as righteousness for Jacob’s sons and was recorded for them as righteousness.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Bear this testimony over Israel
  simplified_phrase: Proclaim this testimony throughout Israel
  preserved_meaning: The testimony must be publicly made known across Israel.
  reasoning_layer_used: applied lexical revision
  rationale: “Proclaim” clarifies the command while retaining the legal and covenantal force of “testimony.”
- pob_phrase: given into the hand of the two sons of Jacob
  simplified_phrase: handed over to two of Jacob’s sons
  preserved_meaning: Shechem and his sons came under the power of Jacob’s two sons.
  reasoning_layer_used: POB translation and source idiom
  rationale: The ordinary English idiom conveys being placed under another’s control.
- pob_phrase: it was reckoned to them as righteousness, and it was written down for them as righteousness
  simplified_phrase: This deed was counted as righteousness for Jacob’s sons and was recorded for them as righteousness
  preserved_meaning: Their deed received and retained a formal judgment of righteousness.
  reasoning_layer_used: POB theological wording
  rationale: The revision identifies the deed and recipients without weakening the repeated declaration of righteousness.
interpretive_expansions:
- pob_phrase: they killed them in agony
  rendering: who killed them while they were in agony
  claim: Shechem and his sons were the ones suffering agony when they were killed.
  evidence:
  - The source review identifies the agony as the victims’ pain associated with the immediate Genesis 34:25 context.
  confidence: high
