translation:
  language: en
  text: And so will your children be throughout every age. May the LORD make you and your descendants great in heart, for his glory. May he bring you and your descendants near to himself from among all humanity, so that they may serve[a] in his sanctuary like the angels who stand in his presence and like the holy ones. Like the angels who stand in his presence and the holy ones, your children’s descendants will be glorious and great.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “so that you may serve.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: your seed
  simplified_phrase: your descendants
  preserved_meaning: The promise extends to the generations descended from the person addressed.
  reasoning_layer_used: POB wording and applied revision
  rationale: “Descendants” states the family-line meaning of “seed” in ordinary English.
- pob_phrase: from all flesh
  simplified_phrase: from among all humanity
  preserved_meaning: The LORD brings this family line near to himself from among humankind.
  reasoning_layer_used: POB translation
  rationale: “All humanity” clarifies the biblical idiom without narrowing its scope.
- pob_phrase: the angels of the presence
  simplified_phrase: the angels who stand in his presence
  preserved_meaning: These angels are distinguished by their place before God.
  reasoning_layer_used: POB translation and source image
  rationale: The wording explains the title while preserving the image of God’s presence.
interpretive_expansions:
- pob_phrase: Like them shall the seed of your children be
  rendering: Like the angels who stand in his presence and the holy ones, your children’s descendants will be
  claim: “Them” refers to both named groups in the preceding sentence.
  evidence:
  - The immediately preceding clause names the angels of the presence and the holy ones as the comparison.
  - The POB retains “like them” as a reference to those groups.
  confidence: high
  alternatives_preserved:
  - The two groups may be distinct even though both form the comparison.
translation_notes:
  risk_flags:
