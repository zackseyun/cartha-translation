translation:
  language: en
  text: 'with joy. Jacob placed his two sons[a], one at his right and the other at his left, and this was counted to him as righteousness.


    That night Jacob told his father everything. He told him how the LORD had shown him great mercy, given him success throughout his journey, and protected him from every evil. Then Isaac praised the God of his father Abraham, who had continued to show mercy and righteousness to the son of his servant Isaac.


    In the morning Jacob told his father Isaac about the prayer he had prayed to the LORD and the vision he had seen. He also told him how he had built an altar and prepared everything needed to offer a sacrifice before the LORD, just as he had prayed. He explained that he had come intending to put Isaac on a donkey for the journey.


    Isaac said to Jacob, “My son, I cannot come with you. I am old and cannot endure the journey. Go in peace, my son, for today I am one hundred sixty-five years old. I can no longer travel. Have your mother ride an animal and take her with you. My son, I know that you came because of me. This is a blessed day, for you have seen me alive, and I too have seen you, my son. May you prosper. Fulfill what you promised in your prayer, and do not delay, for it is being called for. Do it quickly now. May the one who has done all these things bring about everything you prayed for.”


    Then Isaac said to Rebekah, “Go with your son Jacob.” So Rebekah went with her son Jacob, and Deborah went with her. They came to Bethel.


    Jacob remembered the prayer of blessing that his father had prayed over him and over his two sons, Levi and Judah. He rejoiced and praised the God of his ancestors Abraham and Isaac. He said, “Now I know that I and my children have an eternal hope before the God of all. This has been ordained for these two sons, and it will be recorded for them as an everlasting testimony on the heavenly tablets, just as Isaac blessed them.”


    Jacob stayed that night at Bethel. Levi dreamed that he and his descendants had been appointed and ordained to serve forever as priests of the Most High God. When he awoke, he praised the LORD.


    Early in the morning on the fourteenth day of that month, Jacob gave a tenth of everything that had come with him—from people and livestock to gold and every other possession. He took a tenth from everything.


    During that time Rachel became pregnant with Benjamin. Jacob counted his sons, and Levi was chosen as the LORD’s portion. His father dressed him in priestly garments and filled his hands, installing him as priest.


    On the fifteenth day of that month, Jacob brought these animals to the altar as sacrifices: fourteen oxen, eighteen rams, forty-nine sheep, seven lambs, and twenty-one young goats.'
  philosophy: optimal-equivalence
