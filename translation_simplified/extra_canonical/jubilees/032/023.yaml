- pob_phrase: how he had come to carry him on a donkey
  simplified_phrase: he had come intending to put Isaac on a donkey for the journey
  preserved_meaning: Jacob came planning to transport Isaac on a donkey rather than merely arriving on one himself.
  reasoning_layer_used: applied source-based revision concerning the Ge’ez object suffix
  rationale: The wording identifies Isaac as the intended rider without suggesting that Jacob physically carried him.
- pob_phrase: set your mother on a beast and let her go with you
  simplified_phrase: Have your mother ride an animal and take her with you
  preserved_meaning: Isaac tells Jacob to take Rebekah because Isaac cannot travel.
  reasoning_layer_used: applied source-based revision
  rationale: The old transport expression becomes a direct and natural instruction.
- pob_phrase: it will be raised for them as an everlasting testimony in the heavenly tablets
  simplified_phrase: it will be recorded for them as an everlasting testimony on the heavenly tablets
  preserved_meaning: Isaac’s blessing of Levi and Judah stands as permanent heavenly testimony.
  reasoning_layer_used: POB controlling text and source image
  rationale: “Recorded” clarifies the tablet image while preserving its heavenly permanence.
interpretive_expansions:
- pob_phrase: may he who has done everything grant success to the prayer for which you have prayed
  rendering: May the one who has done all these things bring about everything you prayed for
  claim: Isaac asks God to fulfill the requests in Jacob’s prayer.
  evidence:
  - The immediate context concerns Jacob carrying out the prayer he had already prayed.
  - The POB connects divine success directly with that prayer.
  confidence: high
- pob_phrase: filled his hands
  rendering: filled his hands, installing him as priest
  claim: The ritual action marks Levi’s installation into priestly service.
  evidence:
  - The phrase follows Levi’s selection, priestly clothing, and appointment.
  - The concrete ritual image remains in the text.
  confidence: high
  alternatives_preserved:
  - The words “filled his hands” are retained.
