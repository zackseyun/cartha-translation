translation:
  language: en
  text: the daughters of the nations. If he gives one of his daughters to a man from any of the nations, this is plague upon plague and curse upon curse. All this plague and curse will come if he does such a thing. It will also come if he shuts his eyes and ignores those who do what is unclean, defile the LORD’s sanctuary, or profane his holy name. Then all the people together will be judged for all this uncleanness and profanation.
  philosophy: optimal-equivalence
