  preserved_meaning: The man remains the one who gives his daughter, as required by the source’s causative and masculine forms.
  reasoning_layer_used: applied revisions and source review
  rationale: The recast removes awkward English without changing who performs the action.
- pob_phrase: if he closes his eyes to those who do uncleanness
  simplified_phrase: if he shuts his eyes and ignores those who do what is unclean
  preserved_meaning: The image of closing one’s eyes and the sense of knowingly overlooking wrongdoing are both retained.
  reasoning_layer_used: POB text and source image
  rationale: Adding “ignores” makes the idiom immediately understandable while preserving its image.
- pob_phrase: all the people together shall be judged for all the uncleanness and profanation
  simplified_phrase: Then all the people together will be judged for all this uncleanness and profanation
  preserved_meaning: The judgment remains collective and is based on the stated uncleanness and profanation.
  reasoning_layer_used: POB controlling translation
  rationale: A separate sentence clarifies the result without weakening collective accountability.
