translation:
  language: en
  text: He had prayed that he would give a tenth along with their sacrifices and their liquid offerings. After the fire consumed it, he burned frankincense on it in the fire. As an offering for deliverance, he offered two oxen, four rams, four sheep, four male goats, and four one-year-old sheep.
