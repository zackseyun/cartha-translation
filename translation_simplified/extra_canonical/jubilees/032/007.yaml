translation:
  language: en
  text: This is what has been decreed in Israel concerning the defilement of an Israelite virgin:[a] If an Israelite man wants to give his daughter or sister in marriage to a man from any other nation, he must be put to death. They must stone him because he has committed a disgraceful act in Israel. The woman also—[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “concerning an Israelite virgin who has been defiled.”
    reason: lexical_alternative
  - marker: b
    text: The surviving verse breaks off here in the middle of the sentence.
    reason: source_note
