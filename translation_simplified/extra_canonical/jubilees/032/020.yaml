translation:
  language: en
  text: Through you, salvation will come to Israel. On the day you sit on the throne of the glory of your righteousness, great peace will come to everyone descended from the sons of the beloved. Whoever blesses you will be blessed. But all who hate you, make you suffer, or curse you will be destroyed and cut off.
  philosophy: optimal-equivalence
