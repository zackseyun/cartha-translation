- pob_phrase: through you the salvation of Israel will be found
  simplified_phrase: Through you, salvation will come to Israel
  preserved_meaning: Israel receives salvation through the person being addressed.
  reasoning_layer_used: POB controlling translation
  rationale: The passive expression is recast in natural English without changing the means or recipient.
- pob_phrase: all the seed of the sons of the beloved
  simplified_phrase: everyone descended from the sons of the beloved
  preserved_meaning: Peace extends to all descendants of the sons of the beloved.
  reasoning_layer_used: source review and grammar revision
  rationale: “Descended from” explains the ancestry image while lower-case “beloved” avoids claiming an established title.
- pob_phrase: all who hate you and afflict you, and also those who curse you
  simplified_phrase: all who hate you, make you suffer, or curse you
  preserved_meaning: The judgment includes those who hate, afflict, or curse the addressee.
  reasoning_layer_used: POB controlling translation
  rationale: The coordinated groups become a clear list while retaining every hostile action.
