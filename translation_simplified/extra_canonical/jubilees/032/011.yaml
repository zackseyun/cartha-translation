translation:
  language: en
  text: Their kingdoms were Karnaim, Ashtaroth, Edrei, Misur, and Beon. The LORD destroyed them because of their evil deeds, for they were very wicked. Then he settled the Amorites in their place. The Amorites were also evil and sinful. No people today has completed all their sins, and those people no longer exist.
