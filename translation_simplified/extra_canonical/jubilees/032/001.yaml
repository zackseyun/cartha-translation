translation:
  language: en
  text: Judah saw and rejoiced.[a] He praised the God of his ancestors, Abraham and Isaac. He said, “Now I know that my children and I have an eternal hope before the God of all. This has been decreed for both of them, and it will be recorded for them on the heavenly tablets as an everlasting testimony, in keeping with Isaac’s blessing on them.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'An earlier rendering omits “saw”: “Judah rejoiced.”'
    reason: source_note
simplification_decisions:
- pob_phrase: he blessed the God of his fathers, Abraham and Isaac
  simplified_phrase: He praised the God of his ancestors, Abraham and Isaac
  preserved_meaning: Judah honors the God worshiped by Abraham and Isaac.
  reasoning_layer_used: POB base text and ordinary English kinship usage
  rationale: “Praised” and “ancestors” make the action and family relationship immediately clear.
- pob_phrase: I have an eternal hope, and my children also
  simplified_phrase: my children and I have an eternal hope
  preserved_meaning: The enduring hope belongs to both Judah and his descendants.
  reasoning_layer_used: POB base text
  rationale: Combining the two subjects removes an awkward add-on without changing who shares the hope.
- pob_phrase: according to how Isaac blessed them
  simplified_phrase: in keeping with Isaac’s blessing on them
  preserved_meaning: The heavenly record accords with the blessing Isaac gave them.
  reasoning_layer_used: POB base text
  rationale: The noun phrase expresses the same relationship in more natural English.
