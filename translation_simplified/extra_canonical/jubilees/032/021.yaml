translation:
  language: en
  text: 'Then he went up into heaven. That night Jacob had a vision. He saw an angel coming down from heaven with tablets in his hands. The angel gave the tablets to Jacob. Jacob read them and learned everything written there about what would happen to him and his children through all the ages.


    The angel showed him everything on the tablets and said, “Do not build at this place or make it a permanent sanctuary. Do not live here, because this is not the place. Go to the house of Abraham your father, and live with Isaac your father until he dies. You will die peacefully in Egypt, but you will be buried in this land with honor in the tomb of your ancestors, with Abraham and Isaac. Do not be afraid. Everything will happen just as you have seen and read. Write down everything you have seen and read.”


    Jacob asked, “Lord, how will I remember everything I have read and seen?”


    He answered, “I will make you remember it all.”


    Then the angel went up from him. Jacob awoke and remembered everything he had read and seen, and he wrote it all down.


    There Jacob celebrated one additional day. He observed it with all the sacrifices offered in former days. He named the day Addition,[a] because it had been added to the other days, which had already been called a feast. In this way he showed that this was how the feast should be observed. The heavenly tablets also say that this had been revealed to him: he was to observe this day and add it to the feast’s seven days. It was named Addition because it was added to the feast days in keeping with the number of days in the year.


    On the night of the thirteenth day of that month, Deborah, Rebekah’s nurse, died. They buried her below the city, under the oak by the river. They named that place Deborah’s River and called the oak the Oak of the Mourning of Deborah.


    Rebekah returned to her house, to Isaac her father. Jacob sent rams and sheep with her to his father’s house. He said to her, “Let us go to every place, and do not travel with you.”[b]


    Jacob blessed the God of his father Isaac and the God of Abraham, his father’s father. Then he got his wives and children ready, took all his possessions, crossed the river, and arrived.'
  philosophy: optimal-equivalence
