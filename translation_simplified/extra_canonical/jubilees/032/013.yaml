    changes_summary: Removed unnecessary quotation marks, smoothed punctuation, and rendered the second clause more naturally as 'to those who give and to those who take from the daughters of the nations' while preserving the source meaning.
translation:
  language: en
  text: We must not give our daughter in marriage to an uncircumcised man, because that would bring disgrace on us. This is also a disgrace to Israel—both when Israelites give their daughters to people of other nations and when they marry women from those nations—because such a union is unclean.
  philosophy: optimal-equivalence
