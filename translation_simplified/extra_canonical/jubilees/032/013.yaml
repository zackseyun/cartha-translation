  rationale: The standard term states the same physical and covenantal distinction more naturally.
- pob_phrase: to those who give and to those who take from the daughters of the nations
  simplified_phrase: when Israelites give their daughters to people of other nations and when they marry women from those nations
  preserved_meaning: The reproach applies to both directions of marriage between Israel and the nations.
  reasoning_layer_used: POB text and applied revision
  rationale: The participants and marital actions are named directly so the parallel is easy to follow.
- pob_phrase: because it is unclean
