translation:
  language: en
  text: They shall burn her with fire because she has brought disgrace on her father’s household, and she shall be uprooted from Israel. No sexual immorality or impurity shall ever be found in Israel, in any generation, because Israel is holy to the LORD. Anyone who defiles Israel must certainly die; they shall put him to death by stoning.
