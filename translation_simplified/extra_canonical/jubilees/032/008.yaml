  preserved_meaning: Her conduct dishonors her father’s family and its name.
  reasoning_layer_used: POB text and source-supported household-honor image
  rationale: The idiom is expressed in common English without weakening its force.
- pob_phrase: through all the days of the generations of the earth
  simplified_phrase: ever ... in any generation
  preserved_meaning: The command applies throughout every generation on earth.
  reasoning_layer_used: POB temporal scope
  rationale: The long temporal phrase is recast in direct modern English.
- pob_phrase: they shall stone him with stones
  simplified_phrase: they shall put him to death by stoning
  preserved_meaning: Stoning is the required means of carrying out the death sentence.
  reasoning_layer_used: POB judicial wording
  rationale: The natural English wording preserves both the sentence and its method.
