    unchanged: false
    changes_summary: Adjusted 'the one who blesses you' to 'everyone who blesses you' for better agreement with the plural sense; changed 'travel through' to 'be spoken of throughout' to reflect the paired verbs more naturally; changed 'regions' to 'its regions' to account for the possessive in the source; standardized 'Lord' capitalization.
translation:
  language: en
  text: May everyone who blesses you be blessed, and all the people who curse you be cursed. Then he said to Judah, “May the Lord give you strength and power to defeat all who hate you. May you and one of your sons rule over the sons of Jacob. May your name and the name of your sons spread and be spoken throughout the whole earth and regions.[a] Then the nations will be afraid in your presence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “throughout the whole earth and its regions.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: tread down all who hate you
  simplified_phrase: defeat all who hate you
  preserved_meaning: Judah is given power to overcome his enemies.
  reasoning_layer_used: POB text and source image
  rationale: “Defeat” clearly conveys forceful conquest without the opaque idiom.
- pob_phrase: May your name and the name of your sons go forth and be spoken of
  simplified_phrase: May your name and the name of your sons spread and be spoken
  preserved_meaning: Judah and his descendants will become widely known.
  reasoning_layer_used: POB text and applied revision
  rationale: “Spread” makes the movement of their renown clear while retaining speech about them.
- pob_phrase: fear before your face
  simplified_phrase: be afraid in your presence
  preserved_meaning: The nations will fear Judah when they stand before him.
  reasoning_layer_used: POB text and grammatical revision
  rationale: “In your presence” expresses the face-to-face setting in natural English.
translation_notes:
  risk_flags:
  - risk: “Defeat” reduces the physical image in “tread down.”
    mitigation: It preserves the image’s central force of overcoming enemies.
  - risk: The relationship between “earth” and “regions” is grammatically uncertain.
    mitigation: The main text follows the audited POB reading and footnotes the possessive alternative.
