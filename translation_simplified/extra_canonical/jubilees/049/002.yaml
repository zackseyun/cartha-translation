  previous_text: 'The feast began at nightfall on the fifteenth day, when the sun had set. That night marked the beginning of the feast and its joy.


    While you were living in Egypt and eating the Passover meal, all the powers of Mastema were sent out to kill every firstborn in the land of Egypt—from Pharaoh’s firstborn to the firstborn of the captive maidservant working in the mill-house, as well as the firstborn of the cattle. But the LORD gave his people a sign. When the powers saw the blood of a year-old lamb on the doorposts of a house, they were not to enter and kill anyone there. They were to pass over that house so that everyone inside would be saved, because the sign of blood was on its doorposts.


    The powers of the LORD did exactly what the LORD commanded. They passed over all the Israelites, and no plague came upon them to destroy any living being among them—whether livestock, human beings, or even dogs. But the plague in Egypt was very great. There was no Egyptian house without someone dead, and there was mourning and crying everywhere.


    Meanwhile, all Israel remained in their homes, eating the Passover meat and drinking wine. They praised, blessed, and thanked the LORD, the God of their fathers. They were ready to leave the yoke of Egypt and its cruel slavery.


    You also must remember this day throughout your life. Observe it every year, once a year on its proper day, according to all its laws. Do not move it to another day or another month. It is an everlasting law, written and established on the heavenly tablets for all the children of Israel. They must observe it every year on its proper day throughout all their generations. This command will never end, for it is established forever.


    If a man is ritually clean and nearby but does not bring the LORD’s offering at the appointed time, he shall be cut off and shall bear his own sin. The offering must be acceptable before the LORD, and the man must eat and drink before the LORD on the day of the feast.


    Therefore, the children of Israel must come and observe the Passover at its appointed time: on the fourteenth day of the first month, during the period called “between the evenings,” from midday until the first third of the night. Two parts of the day are given to daylight, and a third part belongs to the evening. This is what the LORD commanded you to observe in the middle of the evening.


    The Passover animal must not be slaughtered during daylight, but only at evening. They must eat it that evening, before the first third of the night has passed. After that time, they must burn with fire any meat that remains. They must not eat it raw or boiled in water. They must roast it over fire and eat it with its head, inner parts, and feet. They must not break any of its bones, for no bone of the Passover animal is to be broken among the children of Israel.


    For this reason, the LORD commanded the children of Israel to observe the Passover at its appointed time and not to break any bone of the animal. It is a festival day, a day commanded by God. They must not move it to another day or another month, but must observe it on the proper day of the feast.


    You must command the children of Israel to observe the Passover in its proper season every year, once a year at its appointed time. Then it will be an acceptable memorial before the LORD, and no plague of death or destruction will come upon them in any year when they observe the Passover.'
