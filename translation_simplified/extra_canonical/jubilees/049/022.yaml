    changes_summary: Improved natural English and completeness by adding 'concerning' before 'the feast of unleavened bread' and revising the final phrase from 'seven days of rejoicing' to 'seven days of the feast' to reflect the source more accurately.
translation:
  language: en
  text: 'Moses, command the Israelites to observe the Passover just as you were commanded. Tell them to keep it year after year and day by day. Also tell them about the Festival of Unleavened Bread: they must eat unleavened bread for seven days, celebrate the festival, and bring its offering each day throughout those seven days of rejoicing.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the children of Israel
  simplified_phrase: the Israelites
  preserved_meaning: The descendants and covenant people of Israel remain the people addressed.
  reasoning_layer_used: POB base text and common modern usage
  rationale: “The Israelites” is the natural modern name for the same people.
- pob_phrase: keep the ordinance of the Passover as it was commanded to you
  simplified_phrase: observe the Passover just as you were commanded
  preserved_meaning: Moses must require Israel to follow the commanded Passover practice.
  reasoning_layer_used: POB base text
  rationale: “Observe” clearly expresses commanded religious practice without the opaque term “ordinance.”
- pob_phrase: tell them year by year, and day by day
  simplified_phrase: Tell them to keep it year after year and day by day
  preserved_meaning: The recurring and daily language remains connected to keeping the Passover rather than only to Moses’ teaching.
  reasoning_layer_used: POB syntax and independent grounding review
  rationale: This placement avoids narrowing the phrase so that it modifies instruction alone.
translation_notes:
  risk_flags:
  - risk: The precise scope of “day by day” remains syntactically uncertain.
    mitigation: The wording keeps it connected broadly to Passover observance and does not explain it more narrowly.
  - risk: “Rejoicing” could be read as a general description rather than the source term’s meaning.
    mitigation: The corrected term is retained and tied directly to the festival’s seven days.
