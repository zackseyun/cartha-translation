translation:
  language: en
  text: 'This is what is written and established: they must eat the Passover sacrifice in the LORD’s sanctuary. When the people of Israel enter Canaan, the land they are to possess, and set up the LORD’s tent within the land, among one of their tribes, they must come to the LORD’s tent to celebrate the Passover and slaughter the sacrifice before the LORD. They must do this until the LORD’s sanctuary is built in the land.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Thus it is written and ordained that they should eat it
  simplified_phrase: 'This is what is written and established: they must eat the Passover sacrifice'
  preserved_meaning: The written ordinance requires Israel to eat the Passover sacrifice.
  reasoning_layer_used: POB translation and immediate context
  rationale: The direct wording preserves the legal force and clarifies the pronoun’s referent.
- pob_phrase: the children of Israel
  simplified_phrase: the people of Israel
  preserved_meaning: The phrase refers collectively to Israel.
  reasoning_layer_used: POB translation
  rationale: “People of Israel” expresses the same identity in familiar modern English.
- pob_phrase: in the midst of the land, in one of their tribes
  simplified_phrase: within the land, among one of their tribes
  preserved_meaning: The tent is located somewhere in Israel’s land in relation to one of its tribes.
  reasoning_layer_used: POB translation and independent grounding review
  rationale: “Within” avoids claiming that the tent stood at Canaan’s geographical center.
interpretive_expansions:
- pob_phrase: eat it
  rendering: eat the Passover sacrifice
  claim: The object to be eaten is the Passover sacrifice.
  evidence:
  - The verse later commands Israel to celebrate Passover and slaughter it before the LORD.
  confidence: high
- pob_phrase: in one of their tribes
  rendering: among one of their tribes
  claim: The tent is situated in relation to one Israelite tribe without specifying a precise central location.
  evidence:
  - The phrase locates the tent within Canaan and links its location to one of Israel’s tribes.
  confidence: moderate
  alternatives_preserved:
  - within the territory of one of their tribes
translation_notes:
  risk_flags:
  - risk: “Among one of their tribes” retains some ambiguity about whether the reference is territorial or communal.
    mitigation: The wording preserves POB’s uncertainty rather than imposing a precise territorial claim.
  - risk: “Come to the LORD’s tent” is less spatially literal than “in the midst of the tent.”
    mitigation: It preserves the tent as the required place without suggesting that all participants entered the tent itself.
