translation:
  language: en
  text: '“I will write down for you everything I am revealing to you on this mountain: what is first, what is last, and what is to come. I will record all the divisions of the days, the Law, the Testimony, and the weeks of their jubilees forever—until I come down and live with them through all the ages of eternity.”'
  philosophy: optimal-equivalence
