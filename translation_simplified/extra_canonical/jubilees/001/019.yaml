    unchanged: false
    changes_summary: Capitalized the opening narrative for formal register and added the closing quotation mark and period to complete the sentence. Kept the translation otherwise unchanged.
translation:
  language: en
  text: He prayed, “Lord my God, do not abandon your people, who belong to you, and allow them to go astray by following the error in their hearts. Do not hand them over to enemy nations, for then those nations would rule over them and cause them to sin against you. Lord, lift up your mercy over your people; show them compassion.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: your people and your inheritance
  simplified_phrase: your people, who belong to you
  preserved_meaning: The people belong uniquely to God as his inheritance.
  reasoning_layer_used: POB translation and immediate context
  rationale: This states the relationship directly without the potentially misleading word “claim.”
- pob_phrase: to walk in the error of their hearts
  simplified_phrase: go astray by following the error in their hearts
  preserved_meaning: Their inward error leads them into a wrong course of life.
  reasoning_layer_used: POB translation and source image
  rationale: The wording clarifies the life-course idiom while retaining the heart image.
- pob_phrase: give them into the hand of their enemies, the nations, lest they rule over them
  simplified_phrase: hand them over to enemy nations, for then those nations would rule over them
  preserved_meaning: Foreign rule is the feared result of being surrendered to enemy nations.
  reasoning_layer_used: POB translation and syntax
  rationale: This removes the opaque hand idiom and makes the feared consequence explicit.
interpretive_expansions:
- pob_phrase: your inheritance
  rendering: who belong to you
  claim: The inheritance language marks the people as specially belonging to God.
  evidence:
  - POB places “your inheritance” beside “your people” as a description of the same group.
  - The prayer again calls them “your people” at its close.
  confidence: high
  alternatives_preserved:
  - your inheritance
  - your own possession
- pob_phrase: Let your mercy, Lord, be lifted up over your people
  rendering: Lord, lift up your mercy over your people; show them compassion
  claim: The lifted mercy is a prayer for God to act compassionately toward his people.
  evidence:
  - The direct appeal asks God not to abandon or surrender his people.
  - POB identifies what is lifted over them as God’s mercy.
  confidence: high
  alternatives_preserved:
  - let your mercy rise over your people
