translation:
  language: en
  text: I will cut away the foreskin of their hearts[a] and of their descendants’ hearts. I will create a holy spirit for them and cleanse them, so that from that day on they will never turn away from following me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cutting away the foreskin of the heart is a biblical image of inward circumcision.
    reason: cultural_note
simplification_decisions:
- pob_phrase: cut off the foreskin of their heart and the foreskin of the heart of their seed
  simplified_phrase: cut away the foreskin of their hearts and of their descendants’ hearts
  preserved_meaning: God removes the inward uncircumcision of the people and their descendants.
  reasoning_layer_used: applied revision on theological weight
  rationale: This keeps the biblical heart-circumcision image while replacing “seed” with common English.
- pob_phrase: I will create for them a holy spirit, and I will cleanse them
  simplified_phrase: I will create a holy spirit for them and cleanse them
  preserved_meaning: God gives them a holy spirit and purifies them.
  reasoning_layer_used: POB controlling text
  rationale: The reordered wording is more natural without merging the two divine actions.
- pob_phrase: so that they do not turn away from following me from that day and forever
  simplified_phrase: so that from that day on they will never turn away from following me
  preserved_meaning: Their faithful following begins that day and continues forever.
  reasoning_layer_used: applied revision on missing nuance
  rationale: The simpler time expression retains both permanence and the following metaphor.
translation_notes:
  risk_flags:
  - risk: Modern readers may initially find the foreskin-of-the-heart image difficult.
    mitigation: The main text preserves the source-driven metaphor, and the note identifies it as inward circumcision.
  - risk: Readers may take “holy spirit” as an explicitly resolved title.
    mitigation: Lowercase wording follows the POB and avoids settling an undocumented ambiguity.
