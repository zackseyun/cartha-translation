translation:
  language: en
  text: Many will die. They will be captured and fall into the hands of the enemy because they abandoned my laws and commands. They also abandoned my covenant festivals, my Sabbaths, and the holy things I set apart for myself among them. They abandoned my tabernacle and my sanctuary, which I set apart for myself in the middle of the land so that I might place my name upon it.
  philosophy: optimal-equivalence
