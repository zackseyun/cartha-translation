  text: On the seventh day, he called to Moses from within the cloud. The appearance of Yahweh’s glory was like a blazing fire at the top of the mountain.[a] Moses stayed on the mountain for forty days and forty nights.
  philosophy: optimal-equivalence
  footnotes:
