translation:
  language: en
  text: The Lord taught him about what had happened before and what was still to come. This included the record of how all the days are divided for the law and the testimony. The Lord said, “Pay close attention to everything I tell you on this mountain, and write it in a book. Then their future generations will see that I have not abandoned them, even though they have done all this evil by breaking the ordinance I establish between you and me.”
