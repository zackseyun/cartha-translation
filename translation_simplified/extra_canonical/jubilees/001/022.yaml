translation:
  language: en
  text: They will not listen until they admit their own sin and the sins of their ancestors. After that, they will return to me with complete integrity, with all their heart and all their soul.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: acknowledge their sin
  simplified_phrase: admit their own sin
  preserved_meaning: They must recognize and own their wrongdoing before returning to God.
  reasoning_layer_used: POB base text
  rationale: “Admit” expresses the acknowledgment in direct, common English.
- pob_phrase: the sins of their fathers
  simplified_phrase: the sins of their ancestors
  preserved_meaning: They also acknowledge the sins committed by earlier generations.
  reasoning_layer_used: source payload and POB base text
  rationale: “Ancestors” makes the generational sense of “fathers” clear without limiting it to immediate parents.
- pob_phrase: in all uprightness
  simplified_phrase: with complete integrity
  preserved_meaning: Their return to God will be sincere and morally wholehearted.
  reasoning_layer_used: POB base text and immediate parallel clauses
  rationale: “Complete integrity” states the force of uprightness in familiar English while preserving its moral weight.
interpretive_expansions:
- pob_phrase: their sin
  rendering: their own sin
  claim: The sin acknowledged belongs to the people themselves, in distinction from their ancestors’ sins.
  evidence:
  - The possessive “their” directly assigns the first sin to the people.
  - The following phrase separately names the sins of their fathers.
  confidence: high
