translation:
  language: en
  text: On the sixteenth day of that month, Yahweh said to Moses, “Come up to me on the mountain. I will give you two stone tablets with the law and the commandment I have written, so that you can teach them.” Moses went up the mountain of Yahweh, and Yahweh’s glory remained on Mount Sinai.
