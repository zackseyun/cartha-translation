simplification_decisions:
- pob_phrase: Yahweh spoke to Moses, saying
  simplified_phrase: Yahweh said to Moses
  preserved_meaning: Yahweh directly addressed Moses.
  reasoning_layer_used: POB translation and divine name revision
  rationale: The simpler speech formula preserves the speaker, hearer, and force while retaining Yahweh.
- pob_phrase: two stone tablets of the law and the commandment, which I have written
  simplified_phrase: two stone tablets with the law and the commandment I have written
  preserved_meaning: The tablets bear what Yahweh wrote as the law and commandment.
  reasoning_layer_used: POB controlling text
  rationale: Using “with” makes the tablets’ contents easier to understand without merging the law and commandment.
- pob_phrase: went up onto the mountain of Yahweh, and the glory of Yahweh dwelt on Mount Sinai
  simplified_phrase: went up the mountain of Yahweh, and Yahweh’s glory remained on Mount Sinai
  preserved_meaning: Moses ascended Yahweh’s mountain, where Yahweh’s glory continued to be present.
  reasoning_layer_used: POB controlling text and source image
  rationale: The wording removes awkward repetition while preserving the mountain setting and the abiding glory.
