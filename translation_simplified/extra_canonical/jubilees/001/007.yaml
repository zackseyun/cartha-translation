translation:
  language: en
  text: Then they will know that I have been with them. As for you, write down everything I tell you today. Even before I bring them into the land I swore to give their ancestors—Abraham, Isaac, and Jacob—I know they are rebellious and stiff-necked, stubbornly refusing to obey. I promised their ancestors, “I will give your descendants the land that flows with milk and honey.”[a] There they will eat until they are satisfied.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Flows with milk and honey” pictures a fertile land with abundant food.
    reason: cultural_note
