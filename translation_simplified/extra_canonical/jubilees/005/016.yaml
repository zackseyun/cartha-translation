  yaml_path: translation/extra_canonical/jubilees/005/016.yaml
  text: And he is not one who shows partiality, nor one who accepts a bribe, when he says that he will execute judgment on each. Even if one gave everything that is on the earth, he would not show partiality or accept it, nor would he receive anything from his hand, for he is a righteous judge.
  footnotes:
  - marker: a
    text: Or 'nor would he be swayed from his hand'.
    reason: previous_rendering
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T20:34:14Z'
    unchanged: false
    changes_summary: Revised 'receives gifts' to 'accepts a bribe' for better lexical precision and consistency with the judicial context; changed 'if he says' to 'when he says' for more natural English while preserving the sense.
translation:
  language: en
  text: When he declares that he will judge everyone, he shows no favoritism and accepts no bribe. Even if someone offered him everything on earth, he would not favor that person or accept anything from that person’s hand, because he is a righteous judge.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: execute judgment on each
  simplified_phrase: judge everyone
  preserved_meaning: He will pass judgment on every person.
  reasoning_layer_used: POB translation
  rationale: The simpler verb and object preserve the universal scope of the judgment.
- pob_phrase: Even if one gave everything that is on the earth
  simplified_phrase: Even if someone offered him everything on earth
  preserved_meaning: No amount of wealth could influence the judge.
  reasoning_layer_used: POB translation and judicial context
  rationale: “Offered him” makes the attempted bribery clear without adding a new claim.
- pob_phrase: nor would he receive anything from his hand
  simplified_phrase: or accept anything from that person’s hand
  preserved_meaning: The judge would take nothing offered by the person seeking favor.
  reasoning_layer_used: applied mistranslation revision
  rationale: This keeps the corrected meaning of receiving while preserving the source image of the hand.
translation_notes:
  risk_flags:
  - risk: “Offered him” makes the recipient explicit although POB says only “gave.”
    mitigation: The surrounding references to bribery and receiving from the giver’s hand firmly establish the recipient.
