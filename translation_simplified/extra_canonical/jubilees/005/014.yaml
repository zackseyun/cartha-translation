translation:
  language: en
  text: 'If they do not follow that path, judgment is recorded for every individual creature and every kind of creature. Nothing is excluded: anything in heaven or on earth, in light or in darkness, in the realm of the dead[a], in the deep, or in the place of darkness. The judgments of them all are decreed, written, and engraved.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The source term is “Sheol,” the realm of the dead.
    reason: source_note
