translation:
  language: en
  text: Their fathers were watching. After this, they were bound forever in the depths of the earth, until the day of the great judgment. That judgment is against all who corrupted their conduct and actions in the Lord’s sight.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And their fathers were watching, and after this they were bound
  simplified_phrase: Their fathers were watching. After this, they were bound
  preserved_meaning: The fathers’ watching and the subsequent binding remain distinct events in sequence.
  reasoning_layer_used: POB text and applied revision
  rationale: The sentence break clarifies the sequence while retaining “after this.”
- pob_phrase: for judgment upon all
  simplified_phrase: That judgment is against all
  preserved_meaning: The judgment is directed against the people described in the final clause.
  reasoning_layer_used: Applied grammar revision based on the Ge’ez preposition diba
  rationale: “Against” clearly preserves the judgment’s direction without adding a temporal “then.”
- pob_phrase: who corrupted their ways and their deeds before the Lord
  simplified_phrase: who corrupted their conduct and actions in the Lord’s sight
  preserved_meaning: Both their manner of life and their specific actions were corrupt before the Lord.
  reasoning_layer_used: POB controlling translation
  rationale: “Conduct and actions” makes the two aspects of wrongdoing understandable in common English.
interpretive_expansions:
- pob_phrase: until the day of the great judgment, for judgment upon all
  rendering: until the day of the great judgment. That judgment is against all
  claim: The final clause identifies those against whom the judgment just mentioned is directed.
  evidence:
  - The immediate clause links the great judgment with judgment upon the corrupt.
  confidence: high
  alternatives_preserved:
