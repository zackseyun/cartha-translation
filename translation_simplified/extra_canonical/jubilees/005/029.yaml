    changes_summary: Changed 'on the new moon of the seventh month' to 'at the beginning of the seventh month' for a more direct and natural rendering of the time expression while preserving the sense. Kept the rest unchanged.
translation:
  language: en
  text: In the fourth month, the springs of the great deep were shut, and heaven’s floodgates were held back. At the beginning of the seventh month, all the mouths leading into the depths of the earth opened, and the waters began to flow down into the lower deep.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The sequence is intentionally preserved: the springs are shut, but the earth’s mouths later open so the waters can flow into the lower deep.'
    reason: source_note
simplification_decisions:
- pob_phrase: the fountains of the great deep were closed
  simplified_phrase: the springs of the great deep were shut
  preserved_meaning: The sources of water in the great deep cease releasing water.
  reasoning_layer_used: POB main text and source imagery
  rationale: “Springs” and “shut” express the same action in more familiar English.
- pob_phrase: the floodgates of heaven were restrained
  simplified_phrase: heaven’s floodgates were held back
  preserved_meaning: Water from above is prevented from continuing to pour out.
  reasoning_layer_used: POB main text
  rationale: “Held back” makes the passive action easier to understand without weakening the image.
- pob_phrase: all the mouths of the depths of the earth were opened, and the waters began to descend
  simplified_phrase: all the mouths leading into the depths of the earth opened, and the waters began to flow down
  preserved_meaning: Openings in the earth allow the waters to move downward into the lower deep.
  reasoning_layer_used: POB footnote and revision history
  rationale: The wording clarifies the direction of movement while retaining the source image of mouths.
translation_notes:
  risk_flags:
  - risk: Readers may think that shutting the springs and later opening the earth’s mouths is contradictory.
    mitigation: The footnote preserves and briefly explains the POB’s deliberate cosmological sequence.
