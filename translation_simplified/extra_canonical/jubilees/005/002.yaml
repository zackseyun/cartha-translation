  simplified_phrase: every living creature became corrupt in its way of life
  preserved_meaning: All kinds of embodied creatures became corrupt in how they lived.
  reasoning_layer_used: POB text and source enumeration
  rationale: “Living creature” makes the biblical expression “all flesh” clear without narrowing its scope.
- pob_phrase: their ways and their ordinances
  simplified_phrase: their ways and the order of life they were meant to follow
  preserved_meaning: The creatures violated both their conduct and their proper order.
  reasoning_layer_used: POB text
  rationale: The wording distinguishes conduct from the ordered pattern governing life.
- pob_phrase: every imagination of the thoughts of all the children of men was thus evil all the days
  simplified_phrase: everything human beings imagined and thought was continually evil
  preserved_meaning: Human thought and imagination remained comprehensively evil.
  reasoning_layer_used: POB text
  rationale: The dense biblical phrasing is recast in direct modern English while retaining its total and continual force.
