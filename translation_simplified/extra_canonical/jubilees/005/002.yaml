translation:
  language: en
  text: Lawlessness spread across the earth, and every living creature became corrupt in its way of life—human beings, livestock, wild animals, birds, and everything that moves on the earth. They all corrupted their ways and the order of life they were meant to follow. They began to devour one another. Lawlessness continued to spread across the earth, and everything human beings imagined and thought was continually evil.
  philosophy: optimal-equivalence
