  text: But for all those who corrupted their ways and their plans before the Flood[a], no favor was shown, except to Noah alone; for favor was shown to him on behalf of his sons, whom he saved from the waters of the Flood because of him, since his heart was righteous in all his ways, according to what had been commanded concerning him, and he did not deviate from anything that had been appointed for him.
  footnotes:
  - marker: a
    text: The wording 'before the Flood' is interpretive for a difficult phrase involving 'the waters of the Flood.' The sense is that no one else received favorable regard in that generation except Noah.
    reason: lexical_alternative
    anchor_ref: '5:19'
  - marker: b
    text: Or 'on account of his sons'.
    reason: previous_rendering
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T20:34:17Z'
    unchanged: false
    changes_summary: Replaced 'partiality' with 'favor' for more natural and contextually fitting English while preserving the sense of showing regard; otherwise left the draft unchanged.
translation:
  language: en
  text: All the others had corrupted the way they lived and the plans they made before the Flood.[a] None of them received favor; only Noah did. He received favor for the sake of his sons, who were saved from the floodwaters because of him. Noah was righteous at heart in everything he did. He obeyed what had been commanded for him and did not turn aside from anything appointed for him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Before the Flood” interprets a difficult phrase involving “the waters of the Flood”; the point is that no one else in that generation received favor.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: corrupted their ways and their plans
  simplified_phrase: corrupted the way they lived and the plans they made
  preserved_meaning: Their conduct and intentions had both become corrupt.
  reasoning_layer_used: POB translation
  rationale: This explains “ways” while keeping conduct distinct from plans.
- pob_phrase: no favor was shown, except to Noah alone
  simplified_phrase: None of them received favor; only Noah did
  preserved_meaning: No one else in that corrupt generation received Noah’s favor.
  reasoning_layer_used: POB revision and footnote a
  rationale: The direct contrast is easier to follow and retains “favor.”
- pob_phrase: his heart was righteous in all his ways
  simplified_phrase: Noah was righteous at heart in everything he did
  preserved_meaning: Noah’s inner character and all his conduct were righteous.
  reasoning_layer_used: POB translation and grounding review
  rationale: “At heart” preserves the heart image without awkwardly making the heart perform actions.
