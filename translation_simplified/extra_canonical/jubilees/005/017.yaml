  rationale: “People of Israel” communicates the collective meaning more naturally today.
- pob_phrase: if they turn to him in righteousness
  simplified_phrase: if they turn to him, seeking to do what is right
  preserved_meaning: Their return to him is characterized by righteousness.
  reasoning_layer_used: POB base text
  rationale: The wording explains the difficult phrase without separating repentance from right conduct.
- pob_phrase: all their transgressions
  simplified_phrase: all their wrongdoing
  preserved_meaning: He forgives every offense they have committed.
  reasoning_layer_used: POB base text
  rationale: “Wrongdoing” is common English while remaining distinct from the following word “sins.”
interpretive_expansions:
