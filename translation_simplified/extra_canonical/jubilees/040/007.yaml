translation:
  language: en
  text: He appointed him second in command throughout his kingdom and made him ruler over all Egypt. He had him ride in Pharaoh’s second chariot, dressed him in fine linen, and placed a gold chain around his neck. People went ahead of him proclaiming, “El, El,” and “Abrer.” Pharaoh gave him his signet ring, put him in charge of his whole household, and gave him great honor. He told him, “Only because of my throne will I be greater than you.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: appointed him second in all his kingdom
  simplified_phrase: appointed him second in command throughout his kingdom
  preserved_meaning: He received authority immediately below Pharaoh across the kingdom.
  reasoning_layer_used: POB translation and immediate context
  rationale: “Second in command” states the rank naturally in modern English.
- pob_phrase: gave him his signet ring into his hand
  simplified_phrase: gave him his signet ring
  preserved_meaning: Pharaoh transferred the royal signet to him as part of his appointment.
  reasoning_layer_used: POB translation
  rationale: The physical phrase “into his hand” is unnecessary in natural English.
- pob_phrase: Only with respect to the throne alone will I be greater than you
  simplified_phrase: Only because of my throne will I be greater than you
  preserved_meaning: Pharaoh retained the one rank that remained above him.
  reasoning_layer_used: POB translation and clause contrast
  rationale: The shorter wording preserves the throne-based limit on Joseph’s authority.
