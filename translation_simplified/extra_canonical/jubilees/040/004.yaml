translation:
  language: en
  text: Joseph told Pharaoh that his two dreams had the same meaning. He said, “Seven years of abundant harvests will come throughout Egypt. After this, there will be seven years of famine, a famine worse than any the whole earth has ever known.”
  philosophy: optimal-equivalence
