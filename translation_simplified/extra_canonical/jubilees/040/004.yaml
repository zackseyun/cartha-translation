  simplified_phrase: Joseph told Pharaoh
  preserved_meaning: Joseph addressed Pharaoh and explained the dreams.
  reasoning_layer_used: immediate narrative context and POB translation
  rationale: Naming Joseph removes an unclear pronoun, and “told” is natural modern English.
- pob_phrase: both his dreams were one
  simplified_phrase: his two dreams had the same meaning
  preserved_meaning: The two dreams conveyed one message.
  reasoning_layer_used: POB controlling meaning
  rationale: The wording explains the idiom without treating the dreams as literally identical.
- pob_phrase: Seven years of abundance will come in all the land of Egypt
  simplified_phrase: Seven years of abundant harvests will come throughout Egypt
  preserved_meaning: All Egypt would experience seven years of plentiful food production.
  reasoning_layer_used: source payload and immediate context
  rationale: “Abundant harvests” makes the agricultural sense of abundance clear.
