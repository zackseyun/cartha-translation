translation:
  language: en
  text: “Now let Pharaoh appoint overseers throughout Egypt. Let them store grain in the storehouses of each city throughout the years of abundance. This grain will provide food during the seven years of famine, so the land will not perish because of the famine, for it will be very severe.”
  philosophy: optimal-equivalence
