translation:
  language: en
  text: The king gave Joseph the name Pontifans.[a] He also gave Joseph the daughter of Potiphar as his wife, the daughter of Sawes[b] of Heliopolis, chief of the guards.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Another rendering is “Psonthomphanes,” but “Pontifans” reflects the Ge'ez form of the name.
    reason: source_note
  - marker: b
    text: The Ge'ez tradition reads “Sawes” as a name; some renderings emend it to “a priest.”
    reason: source_note
