translation:
  language: en
  text: 'The next morning, Jesus appeared to his disciples. They asked him, “Master, where did you go, and what did you do after you left us?”


    Jesus answered, “I went to another generation, one that is great and holy.”


    His disciples asked him, “Lord, what great generation is better and holier than we are, yet is not in these realms?”


    When Jesus heard this, he laughed. He said to them, “Why are you wondering in your hearts about the strong and holy generation? Truly I tell you, no one born [of] this realm will see that [generation]. No army of angels from the stars will rule over it, and no mortal-born person will be able to join it. This is because that generation does not come from […] that has become […] the generation of the people among [them] comes from the generation of the great people […] the powerful authorities who […] nor the powers […] those through which you rule.”


    When the disciples heard this, each of them was troubled in spirit. They could not say a word.'
