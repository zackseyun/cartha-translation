translation:
  language: en
  text: 'On another day, Jesus came to the disciples. They said to him, “Master, we saw you in a dream. We had great [dreams last] night.”


    Jesus asked, “Why have you […] hidden yourselves?”


    They [answered, “We saw] a great [house with a great] altar [inside it]. There were twelve people there—we thought they were priests—and a name. A crowd waited at the altar [until] the priests [finished receiving] the offerings. We waited too.”


    [Jesus asked], “What were they like?”


    They answered, “[Some] fast [for] two weeks. Others sacrifice their own children, and others sacrifice their wives while praising and humbling themselves before one another. Some men sleep with other men. Some people murder, while others commit many sins and crimes. [And] the people standing [before] the altar call on your [name]! Through all these sacrifices, they fill the [altar] with offerings.” After saying this, [the disciples] fell silent because they were troubled.


    Jesus said to them, “Why are you troubled? Truly I tell you, all the priests standing before that altar call on my name. And [again] I tell you, the generations of humanity have written my name on this [house] belonging to the generations of the stars. [They] have shamefully planted fruitless trees in my name.”


    Jesus continued, “You are the ones receiving the offerings on the altar you saw. That is the God you serve, and you are the twelve people you saw. The animals being brought for sacrifice are the crowd you lead astray before that altar. [Your minister] will rise and use my name in this way, and [the] generations of the pious will remain loyal to him. After him, one person will bring forward [those who sleep around], another those who murder children, another men who sleep with men, others who fast, and all the rest who practice impurity, crime, and error. Those who say, ‘We are equal to the angels’ are the stars that bring everything to its end.


    “The generations of humanity have been told, ‘Look, God has accepted your sacrifice from the priests’ hands’—that is, the minister of error. The Lord who commands is Lord over everything. On the last day, they will be found guilty.”


    Jesus said [to them], “Stop [sacrificing animals]. You have [offered them] over the altar, over your stars with your angels, where they have already been brought to completion. So let them become […] with you, and let them [become] clear.”


    His disciples [said to him], “Cleanse us from the [sins] we committed because the angels deceived us.”


    Jesus answered, “It is not possible […]. A spring cannot put out a fire burning throughout the whole world. A [city’s] well cannot provide enough water for every generation—only the great, stable one can. One lamp cannot give light to every realm—only the second generation can. And one baker cannot feed all creation under [heaven].”


    [When the disciples heard] this, they said to [him], “Master, help us and save us!”


    Jesus answered, “Stop fighting against me. Each of you has his own star, [and …] of the stars will […] what belongs to it […]. I was not sent to the generation that perishes, but to the strong generation that cannot perish. No enemy and none of the stars have ruled [over] that generation. Truly I tell you, the pillar of fire will soon fall, but that generation will not be shaken by the stars.”'
