translation:
  language: en
  text: 'Jesus said, “Truly I tell [you], this baptism [they received in] my name […] will destroy the whole generation descended from the earthly Adam. Tomorrow they will torture the one who bears me. Truly I tell you, no mortal hand [will fall] upon me. Truly I tell you, Judas, those who offer sacrifices to Saklas […] everything evil. But you will do more than all of them, because you will sacrifice the human being who bears me. Your horn is already raised, your anger is burning, your star has risen, and your heart has [gone astray]. Truly I tell you, your last [… and] the [… the thrones] of the realm have [been defeated]. The kings have grown weak, the generations of angels have grieved, the evil [they sowed …] is destroyed, and the [ruler] is wiped out. Then the [fruit] of the great generation of Adam will be lifted up, because that generation from the realms exists before heaven, earth, and the angels. Look, you have been told everything.


    “Look up and see the cloud with light in it and stars around it. The star leading the way is your star.”


    Judas looked up. He saw the shining cloud and entered it. The people standing on the ground heard a voice from the cloud saying, “[… the] great [generation …] and […].” Then Judas could no longer see Jesus.


    Immediately, a disturbance arose among [the] Jews, greater than […]. Their high priests complained because Jesus had gone into the guest room to pray. Some scribes were watching closely so they could arrest him while he prayed. They were afraid of the people, because everyone regarded him as a prophet.


    They approached Judas and asked, “What are you doing here? Aren’t you Jesus’ disciple?”


    Judas gave them the answer they wanted. Then he accepted some money and handed Jesus over to them.


    The Gospel of Judas'
