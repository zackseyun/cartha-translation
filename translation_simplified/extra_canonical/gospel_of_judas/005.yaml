translation:
  language: en
  text: 'After Jesus [said] these things, he left and [took] Judas Iscariot with him. Jesus told him, “The water on the high mountain comes [from] […]. It did not come to [water … the well] of the tree of [the fruit …] of this realm […] after a time […]. Instead, it came to water God’s paradise and its lasting [fruit]. [It] will not corrupt the [way of life] of that generation, but [it will remain] forever.”


    Judas said to [him], “[Tell] me, what kind of fruit does this generation have?”


    Jesus said, “The souls of every human generation will die. But when these people have completed their time in the kingdom and the spirit leaves them, their bodies will die while their souls live and are taken up.”


    Judas asked, “What will happen to the rest of the human generations?”


    Jesus said, “You cannot sow seed on [rock] and then harvest fruit from it. In the same way, you [cannot sow among] the [defiled] race, together with wisdom that perishes [and] the hand that made mortal human beings, so that their souls may rise to the realms above. [Truly] I tell you, [no ruler], angel, [or] power will be able to see the [places] that [this great] and holy generation [will see].” After saying this, Jesus left.


    Judas said, “Master, you have listened to all the others. Now listen to me too, because I have seen a great vision.”


    When Jesus heard this, he laughed and said, “Why are you so upset, you thirteenth demon? But speak, and I will put up with you.”


    Judas said, “In the vision I saw myself. The twelve disciples were stoning me and chasing [me quickly]. Then I came to the place where [I had followed] you. There I saw [a house], and it was too large for my eyes to [measure]. Great people surrounded it, and its roof was covered with greenery. In the middle of the house was [a crowd …]. Master, take me in to join these people!”


    [Jesus] answered, “Your star has led you astray, Judas. No mortal person is worthy to enter the house you saw, because that place is reserved for the holy. Neither the sun nor the moon nor the day will rule there. Instead, the holy will always stand in that realm with the holy angels. Listen, I have told you the mysteries of the kingdom. I have also taught you about the error of the stars and […] sent [on high] over the twelve realms.”


    Judas asked, “Master, surely my offspring will not rule over the rulers, will they?”


    Jesus answered, “Come, let me [tell] you [about the holy generation. I am not telling you this because you will go there]. You will grieve deeply when you see the kingdom and all its generation.”


    When Judas heard this, he asked, “What good has it done me for you to separate me from that generation?”


    Jesus answered, “You will become the thirteenth. The other generations will curse you, and you will rule over them. In the last days they will […] to you, but you will not rise to the holy generation.”'
