translation:
  language: en
  text: 'This is the secret message about judgment that Jesus spoke with Judas Iscariot over a period of eight days, three days before Jesus celebrated Passover.


    When Jesus appeared on earth, he performed signs and great wonders to save humanity. Some[a] followed the path of righteousness, but others followed the path of wrongdoing. Therefore, the twelve disciples were called. Jesus began teaching them about the mysteries beyond this world and about what would happen at the end. He often did not reveal himself to his disciples, but they would find him among them as a child.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The source witness brackets the verb rendered “followed,” indicating that the wording is uncertain.
    reason: source_note
simplification_decisions:
- pob_phrase: Some [walked] in the way of righteousness, but others walked in their transgression
  simplified_phrase: Some[a] followed the path of righteousness, but others followed the path of wrongdoing
  preserved_meaning: People followed contrasting moral paths of righteousness and wrongdoing.
  reasoning_layer_used: POB translation and bracketed English witness
  rationale: “Followed the path” keeps the journey image while the note preserves uncertainty about the first verb.
- pob_phrase: He started to tell them about the mysteries beyond the world and what would happen at the end
  simplified_phrase: Jesus began teaching them about the mysteries beyond this world and about what would happen at the end
  preserved_meaning: Jesus taught the disciples about realities beyond the world and future events at the end.
  reasoning_layer_used: POB translation and immediate context
  rationale: Naming Jesus and using “teaching” makes the sentence easier to follow.
- pob_phrase: you'd find him in their midst as a child
  simplified_phrase: they would find him among them as a child
  preserved_meaning: The disciples encountered Jesus among them as a child.
  reasoning_layer_used: POB translation and English witness
  rationale: The wording removes the conversational “you’d” without defining how he appeared as a child.
interpretive_expansions:
- pob_phrase: did signs and great wonders for the salvation of humanity
  rendering: performed signs and great wonders to save humanity
  claim: The signs and wonders served humanity’s salvation.
  evidence:
  - The POB directly connects these acts with “the salvation of humanity.”
  confidence: high
