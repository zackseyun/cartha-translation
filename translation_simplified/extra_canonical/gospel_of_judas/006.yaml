translation:
  language: en
  text: 'Jesus said, “Come, and I will teach you about the [mysteries that no] human being [will] see. There is a vast realm without boundaries. No generation of angels has seen its farthest reaches. [Within] it is a [great] invisible Spirit. No [angelic] eye has ever seen this Spirit, no heart has ever understood it, and no one has ever called it by any name.


    “A shining cloud appeared there. The Spirit said, ‘Let an angel come into being to attend me.’ Then a great angel emerged from the cloud: the Self-Begotten, the God of the Light. Because of him, four more angels came into being from another cloud, and they attended the angelic Self-Begotten.


    “The [Self-Begotten] said, ‘Let [a realm] come into being,’ and it came into being [just as he said]. He [created] the first heavenly light to rule over it. Then he said, ‘Let angels come into being to serve [it],’ and countless thousands came into being. He said, ‘Let [a] realm of light come into being,’ and it came into being. He created the second heavenly light to rule over it, together with countless thousands of angels to serve there. In this way he created the rest of the realms of light. He appointed rulers over them and created countless thousands of angels to assist them.


    “Adamas was in the first cloud of light, which no angel among all those called ‘God’ could ever see. [There Adamas fathered Seth after the] image [of …] and in the likeness of [this] angel. He caused the immortal [generation] of Seth to appear before the twelve male-and-female [heavenly lights]. [Then] he caused seventy-two heavenly lights to appear within that immortal generation, according to the Spirit’s will. The seventy-two heavenly lights then caused 360 more to appear within that generation, according to the Spirit’s will, so that there would be five for each one.


    “The twelve realms belonging to the twelve heavenly lights make up their father. Each realm has six heavens, making seventy-two heavens for the seventy-two heavenly lights. Each of these has [five] layers of heaven, making [a total of] 360. [They] were given authority and a [great], countless army of angels to honor and serve them. They were also given pure spirits to honor and [serve] all the realms, the heavens, and their layers.


    “The father, the seventy-two heavenly lights, the Self-Begotten, and his seventy-two realms call this multitude of immortal beings ‘cosmos’—that is, ‘perishable.’ This is where the first human appeared with his immortal powers. In the realm that appeared with his generation were the cloud of knowledge and the angel called [Eleleth …].


    “After this, [Eleleth] said, ‘Let twelve angels come into being [to] rule over Chaos and [Hades].’ Then an [angel] came from the cloud. His face flashed with [fire], and his appearance was [stained] with blood. His name was Nebro, which means ‘Rebel.’ Others call him Yaldabaoth. Another angel, Saklas, also came from the cloud. Nebro created six angels to be assistants, and Saklas did the same. Together they brought forth twelve angels in the heavens, and each received a portion of the heavens.


    “The twelve rulers said to the twelve angels, ‘Let each of you […] and let them […] generation [… five] angels:


    “The first [is Yaoth], called ‘the Good One.’


    “The second is Harmathoth, [the Eye of Fire].


    “The [third] is Galila.


    “The fourth [is] Yobel.


    “The fifth is Adonaios.


    “These are the five who ruled over Hades and held the first place over Chaos.


    “Then Saklas said to his angels, ‘Let us create a human being in the likeness and image.’ They formed Adam and his wife Eve. In the cloud, Eve is called ‘Life.’ By this name all the generations seek him, and each calls her by its own names. Saklas did not [command …] give birth, except […] among the generations […] which this […]. And the [angel] said to him, ‘You and your children will live for only a limited time.’”


    Judas asked Jesus, “[How] long can a person live?”


    Jesus replied, “Why are you surprised that Adam and his generation have limited lifespans in the place where he received his kingdom and his ruler?”


    Judas asked Jesus, “Does the human spirit die?”


    Jesus answered, “This is how it is. God commanded Michael to lend spirits to people so that they could serve. Then the Great One commanded Gabriel to give spirits to the great generation that has no king—giving both spirit and soul. So the [rest] of the souls […] light [… the] Chaos […] seek [the] spirit within you, which you have brought to life in this body from the generations of angels. Then God had knowledge brought to Adam and those with him, so that the kings of Chaos and Hades could not rule over them.”


    [Then] Judas asked Jesus, “So what will those generations do?”


    Jesus answered, “Truly I tell you, the stars bring all these things to completion. When Saklas reaches the end of the time appointed for him, their first star will appear with the generations, and they will complete what has been foretold. Then they will commit sexual immorality in my name, murder their children, and [they will …] evil and […] the realms. They will bring the generations and present them to Saklas. [And] after that, […] will bring the twelve tribes of [Israel] from […]. All the [generations] will serve Saklas and sin in my name. But your star will [rule] over the thirteenth realm.” Then Jesus [laughed].


    [Judas] asked, “Master, why [are you laughing at me]?”


    [Jesus] answered, “I am not laughing [at you, but] at the error of the stars. These six stars wander astray with these five warriors, and all of them will be destroyed along with what they created.”


    Then Judas asked Jesus, “What will happen to those who have been baptized in your name?”'
