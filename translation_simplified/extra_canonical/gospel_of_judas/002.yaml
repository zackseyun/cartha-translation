translation:
  language: en
  text: 'One day Jesus was with his disciples in Judea. He found them sitting together, carrying out their religious devotions. When he [came up to] them as they sat praying over the bread, [he] laughed.


    The disciples asked him, “Master, why are you laughing at [our] prayer? What have we done? [This] is the right thing to do.”


    He answered, “I’m not laughing at you. You are not doing this because you want to. You are doing it so that your God [will be] praised.”


    They said, “Master, you […] are the Son of our God!”


    Jesus said to them, “How do [you] know who I am? Truly, [I] tell you, no generation among your people will know me.”


    When the disciples heard this, they became furious and cursed him in their hearts.


    Jesus saw that they did not understand, so [he said] to them, “Why are you letting your anger trouble you? Has your God within you, together with [his stars], become angry with your souls? If any of you is [strong enough] among humanity to bring forth perfect Humanity, stand up and face me.”


    They all said, “We are strong enough.” But their spirits did not have the courage to stand before [him]—except for Judas Iscariot. Judas was able to stand before him, but he could not look Jesus in the eye, so he turned his face away.


    Judas [said] to him, “I know who you are and where you came from. You came from the immortal realm of Barbelo, and I am not worthy to speak the name of the one who sent you.”


    Jesus knew that Judas was thinking about exalted things. He said to him, “Come away from the others, and I will tell you the mysteries of the kingdom. This does not mean that you will enter it. Instead, you will suffer much grief, because someone else will take your place to complete the twelve [elements] before their God.”


    Judas asked him, “When will you tell me these things? And when will the great day of light dawn for the generation […]?”


    After Judas said this, Jesus left him.†[†]'
