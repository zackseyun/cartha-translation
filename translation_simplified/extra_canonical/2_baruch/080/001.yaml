translation:
  language: en
  text: 'It was known beforehand what was going to happen—what King Nebuchadnezzar of Babylon had set his heart on....[a] But we knew that no command from his mouth would fail or happen differently from what he had appointed beforehand. What had been decided beforehand was openly revealed. It was also revealed to me that angels were at work against the city. They shook and uprooted its walls. They tore down the mighty wall with its strong iron corners. At that time, however, they hid the sacred objects used in the temple so that the enemies would not see them.


    After doing this, they handed over to the enemies the broken wall, the plundered house, the burned temple, and the defeated people who were being led away. This kept the enemies from boasting, “We surrounded even the house of the Most High and brought it down in battle.”


    They also bound your brothers, led them away to Babylon, and made them live there. But we and our descendants remained here, few and small. This is the affliction of the people that I wrote to you about. You surely know how heavily Zion’s humiliation has weighed on you. You knew her better than the rest of the people did, because you served there while we assisted.'
