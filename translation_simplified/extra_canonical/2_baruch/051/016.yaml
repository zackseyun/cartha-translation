translation:
  language: en
  text: They chose this time for themselves, though it cannot pass without anguish. They chose that time for themselves, whose end is full of sorrow and evil. They rejected the world that keeps those who enter it from growing old, and they rejected the time of glory. So they will not receive the honor I told you about before.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: this time that cannot pass away without anguish
  simplified_phrase: this time for themselves, though it cannot pass without anguish
  preserved_meaning: The time they chose inevitably involves suffering.
  reasoning_layer_used: POB base text
  rationale: The concessive clause makes the contrast easier to follow without weakening it.
- pob_phrase: the world that does not age those who come to it
  simplified_phrase: the world that keeps those who enter it from growing old
  preserved_meaning: That world prevents its inhabitants from aging.
  reasoning_layer_used: source-grounded applied revision
  rationale: This natural wording preserves the Syriac verb’s causative meaning.
- pob_phrase: so that they should not come to the honor
  simplified_phrase: So they will not receive the honor
  preserved_meaning: Their rejection results in their failure to attain the promised honor.
  reasoning_layer_used: POB base text and immediate context
  rationale: “Receive” expresses attaining the honor in ordinary English.
translation_notes:
  risk_flags:
  - risk: “So they will not receive” presents the final clause as a result rather than a deliberate purpose.
    mitigation: The wording preserves the consequence of their rejection without implying that exclusion was their conscious goal.
