simplification_decisions:
- pob_phrase: those who have now been vindicated by my law
  simplified_phrase: those whom my law has shown to be in the right
  preserved_meaning: The law establishes that these people are in the right.
  reasoning_layer_used: POB base text and applied source-grounded revision
  rationale: Common wording replaces the difficult term “vindicated” without changing the law’s role.
- pob_phrase: those who had understanding in their life, and those who planted in their heart the root of wisdom
  simplified_phrase: those who understood during their lives and planted the root of wisdom in their hearts
  preserved_meaning: Their understanding and the planted-root image of wisdom remain distinct.
  reasoning_layer_used: POB base text
  rationale: Direct English clarifies the clauses while preserving the source image.
- pob_phrase: the form of their face will be turned into the light of their beauty
  simplified_phrase: Their faces will be changed to shine with the light of their beauty
  preserved_meaning: Their facial appearance is transformed into radiant beauty.
  reasoning_layer_used: POB base text
  rationale: The abstract wording becomes a clear statement while retaining transformation and light.
translation_notes:
  risk_flags:
  - risk: “Through transformations” remains unusual English.
    mitigation: The plural is retained because the POB leaves the transformations open-ended.
  - risk: Splitting the long sentence may weaken the connection between its clauses.
    mitigation: “So that” preserves the purpose or result relationship leading to their receiving the deathless world.
