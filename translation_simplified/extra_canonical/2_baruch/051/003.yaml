translation:
  language: en
  text: But as for the glory of those whom my law has shown to be in the right—those who understood during their lives and planted the root of wisdom in their hearts—their splendor will be made glorious through transformations. Their faces will be changed to shine with the light of their beauty, so that they may receive the world that never dies, which has been promised to them.
