  simplified_phrase: the people they now stand above
  preserved_meaning: One group presently holds a higher position than the other.
  reasoning_layer_used: POB translation and applied revision
  rationale: The revision’s single object clause is retained while the difficult passive wording is made natural.
- pob_phrase: 'then these and those will be changed: the latter ... but the former'
  simplified_phrase: both groups will be changed. Those who have been raised up ... But those who once stood above them
  preserved_meaning: Both groups undergo contrasting changes, with the newly exalted receiving angelic splendor.
  reasoning_layer_used: POB clause structure
  rationale: The pronouns are replaced with their referents so readers can follow the contrast.
- pob_phrase: at the visions and at the sight of the forms
  simplified_phrase: at the visions and the forms they see
  preserved_meaning: Their amazement arises from seeing visions and visible forms.
  reasoning_layer_used: POB source-driven rendering
  rationale: The repeated sight language is compressed without merging the visions and forms.
