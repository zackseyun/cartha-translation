translation:
  language: en
  text: 'But also listen to this message of comfort. I was mourning over Zion, so I asked the Most High for mercy. I said, “Will these troubles remain with us until the end? Will these sufferings keep coming upon us again and again?”


    The Mighty One acted out of his abundant mercy and, in his great grace, he spared. He revealed a message to strengthen me and gave me visions so that I would not be shaken again. He made known to me the mysteries of the times and showed me the ages that are coming.


    Therefore, my brothers, I have written to comfort you in your many troubles. Know that our Maker will exact vengeance from all our enemies for every evil they have done to us. The completion that the Most High has prepared is near. His mercy is coming, and the completion of his judgment is not far away.


    For now we see the nations prosper even while they do evil, but they will be counted as no more than a drop. We see the strength of their power, but it will be regarded as spit. We consider the glory of their greatness, though they do not obey the commandments of the Mighty One but treat them with contempt. We look at the beauty that is seen, though it is shaken by affliction; but they will be sought out like flesh in pain. We consider the security they trust in, though it is shaken before our eyes; but they will be crushed like a wave. We look at the hope they place in their strength as it flourishes through the good things God has given them; but it will be taken away, and mourning will overtake it.'
