  simplified_phrase: human beings die
  preserved_meaning: Human mortality remains the cause of astonishment.
  reasoning_layer_used: lexical decision for ܐܬܡܗܬ
  rationale: Direct wording makes the reference to death clear while preserving astonishment.
- pob_phrase: he has transgressed while understanding
  simplified_phrase: people sin even though they understand
  preserved_meaning: Transgression committed with knowledge brings accountability.
  reasoning_layer_used: theological decision on knowledge and judgment
  rationale: Common wording preserves the contrast between understanding and sin.
- pob_phrase: this world is a struggle and a labor with much trouble
  simplified_phrase: in this world they face struggle, hard work, and much trouble
  preserved_meaning: The righteous endure severe hardship in the present world.
  reasoning_layer_used: theological decision on the present and coming worlds
  rationale: Ordinary sentence structure keeps each element of the present hardship.
