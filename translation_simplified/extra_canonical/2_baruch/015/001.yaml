- pob_phrase: what is coming
  rendering: the coming world
  claim: The phrase points to the future world contrasted with this present world.
  evidence:
  - The theological decision explicitly contrasts the present and coming worlds.
  - The surrounding lines contrast present trouble with future glory.
  confidence: high
  alternatives_preserved:
  - A less specific future age or event.
