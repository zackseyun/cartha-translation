translation:
  language: en
  text: 'The Lord answered me:


    “You are right to be astonished that human beings die. But you are wrong about the evils that come upon sinners.


    You spoke about the righteous being taken away while the wicked prosper. You also said that people do not know my judgment. So listen now, and I will speak to you. Pay attention to my words.


    No one could have understood my judgment without receiving the Law and being taught understanding by me. But now people sin even though they understand. Therefore, they will certainly be punished because they sinned with understanding.


    You said that this world is for the sake of the righteous. The coming world will likewise be for their sake. In this world they face struggle, hard work, and much trouble. But what is to come is a crown of great glory.”'
  philosophy: optimal-equivalence
