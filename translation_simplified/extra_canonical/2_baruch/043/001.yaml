translation:
  language: en
  text: 'But you, Baruch, keep your heart steady and hold firmly to what you have been told. Understand what you have been shown, because you have abundant comfort that will last forever.


    From now on, you will never again see the evils happening now.


    So go and give my people their instructions, but do not stir them up. After these troubles, many days of kindness will come. I will make things known to you and speak to your understanding.'
  philosophy: optimal-equivalence
