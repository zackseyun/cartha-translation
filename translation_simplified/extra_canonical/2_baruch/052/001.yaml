translation:
  language: en
  text: At that time, the earth will certainly return the dead whom it now receives and preserves. It will not change their form. It will restore them as it received them, and it will raise them just as I gave them into its care.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: will then certainly give back the dead
  simplified_phrase: At that time, the earth will certainly return the dead
  preserved_meaning: The earth will return the dead at the appointed future time.
  reasoning_layer_used: POB lexical decision for ܡܦܩܢܗ
  rationale: “Return” naturally preserves the image of the earth giving back those it received.
- pob_phrase: whom it now receives in order to preserve them
  simplified_phrase: whom it now receives and preserves
  preserved_meaning: The earth holds the dead as a repository until resurrection.
  reasoning_layer_used: Applied source revision and purpose-clause rationale
  rationale: The shorter wording keeps the earth’s preserving role explicit.
- pob_phrase: as I delivered them to it
  simplified_phrase: just as I gave them into its care
  preserved_meaning: The divine speaker entrusted the dead to the earth, which will raise them in continuity.
  reasoning_layer_used: POB theological decision on continuity of identity
  rationale: “Gave them into its care” makes the custody image clear without defining resurrection mechanics.
translation_notes:
  risk_flags:
