  rationale: The difficult clause is recast in natural English without weakening its force.
- pob_phrase: the world that does not age those who come to it
  simplified_phrase: the world that does not age those who enter it
  preserved_meaning: The coming world preserves those who enter it from aging.
  reasoning_layer_used: source-grounded applied revision
  rationale: The transitive force of “age” is retained while “enter” makes arrival clearer.
- pob_phrase: so that they might not come to the honor
  simplified_phrase: so that they might not attain the honor
  preserved_meaning: Their rejection keeps the purpose-result construction and the idea of reaching honor.
  reasoning_layer_used: POB base text and independent grounding review
  rationale: “Attain” naturally preserves coming to honor without turning the clause into a flat prediction.
