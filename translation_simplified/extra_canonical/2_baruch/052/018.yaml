translation:
  language: en
  text: They chose this present time for themselves, though it cannot run its course without anguish. They chose that time, whose outcomes are full of groanings and evils. They rejected the world that does not age those who enter it, and they rejected the time of glory, so that they might not attain the honor I told you about before.
