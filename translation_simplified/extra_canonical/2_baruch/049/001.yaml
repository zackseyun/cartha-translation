translation:
  language: en
  text: 'Nevertheless, I will ask you, Mighty One, and seek mercy from the One who made everything: What form will the people living in his days have? How will the splendor[a] of those who come afterward be preserved? Will they have the same form people have now? Will their human likeness remain, and will they be established as living beings? Or will you change what has existed in the world, along with the world itself?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The source wording is uncertain here; “brightness” or “glory” may be intended.
    reason: source_note
simplification_decisions:
- pob_phrase: In what form will those who live in his days live?
  simplified_phrase: What form will the people living in his days have?
  preserved_meaning: Baruch asks about the form of people alive in that coming time.
  reasoning_layer_used: POB lexical decision for “form” and immediate context
  rationale: This removes the repeated wording without deciding what their form will be.
- pob_phrase: Will they then take on this present form
  simplified_phrase: Will they have the same form people have now?
  preserved_meaning: The question compares their future form with present human form.
  reasoning_layer_used: POB theological decision on continuity and transformation
  rationale: This makes the comparison clear while keeping the question unresolved.
- pob_phrase: Or will you perhaps change these things that have been in the world, as also the world itself?
  simplified_phrase: Or will you change what has existed in the world, along with the world itself?
  preserved_meaning: Baruch asks whether both what exists in the world and the world itself will be changed.
  reasoning_layer_used: POB theological decision and independent grounding review
  rationale: The whole clause remains an open question rather than assuming that the world will change.
translation_notes:
  risk_flags:
  - risk: The source term rendered “splendor” may reflect a difficult or corrupt reading.
    mitigation: The footnote preserves the uncertainty and gives the supported alternatives.
  - risk: The questions could be read as affirming either unchanged bodies or total transformation.
    mitigation: All possibilities remain questions, preserving the POB’s unresolved tension.
