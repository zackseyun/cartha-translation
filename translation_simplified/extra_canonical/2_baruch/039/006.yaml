- pob_phrase: all those who are stained with iniquity
  simplified_phrase: Everyone stained by wrongdoing
  preserved_meaning: All people marked or corrupted by wrongful conduct are included.
  reasoning_layer_used: POB base text and source contrast
  rationale: “Wrongdoing” makes “iniquity” accessible while preserving the image of being stained.
- pob_phrase: just as evil beasts flee and creep into the forest
  simplified_phrase: just as evil beasts flee and creep into the forest
  preserved_meaning: The same beasts both flee and creep into the forest.
  reasoning_layer_used: applied Syriac grammar revision
  rationale: Retaining both verbs protects the source-based correction that “creep” is an action, not a separate group of creatures.
