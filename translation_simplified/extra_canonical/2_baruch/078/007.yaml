translation:
  language: en
  text: '7 The one you seek is merciful, and the one in whom you hope is gracious. We will see that he protects and does not abandon.


    8 Have you not seen what happened to Zion? 9 Did you think the place itself had sinned and was therefore laid waste? Did you think the land had acted foolishly and was therefore handed over? 10 Do you not know that because you sinned, what had not sinned was destroyed? Because people acted wickedly, what had done no wrong was handed over.


    11 All the people answered me, “As far as we are able, we tell of the good things the Mighty One has done for us. What we do not remember, he himself knows.[a] 12 But please plead for us before the Most High in heaven. Before you leave us, write to our brothers. Send them instruction and a message of hope. 13 Show them something that still remains with us. For Israel’s shepherds have perished, the lamps that gave us light have gone out, and the springs from which we drank have stopped flowing. 14 We have been left in darkness, in the depths of the forest, and thirsty in the wilderness.”


    15 I answered them, “The shepherds, the lamps, and the springs all came from the law. 16 Even if we leave, the law remains. So study the law and stand firm in wisdom. Then the lamp will not go out, the shepherd will not flee, and the spring will not dry up.[b]


    17 “As you asked, I will write to your brothers in Babylon and send the letter with human messengers. I will also write to the nine and a half tribes and send their letter by a bird.”


    18 On the twenty-first day of the eighth month, I sat alone under the oak in the shade of its branches. No one was with me. 19 I wrote two letters. I sent one to the nine and a half tribes by an eagle, 20 and the other to those in Babylon with human messengers.


    21 I called the eagle and said to it, 22 “The Most High made you fly higher than all other birds. 23 Now do not stop anywhere. Do not enter a nest or settle on any tree until you have crossed the wide waters of the Euphrates and reached the people who live there. Then drop this letter down to them.


    24 “Remember that in the time of the flood, Noah received fruit from an olive tree when the dove returned after he had sent her out from the ark. 25 Ravens also served Elijah by bringing him food, as they had been commanded. 26 During Solomon’s reign, whenever he wanted to send a message or learn about something, he commanded a bird, and it obeyed him.


    27 “So now, do not turn to the right or the left, and do not grow tired. Fly straight there and obey the command of the Mighty One, just as I have told you.”'
