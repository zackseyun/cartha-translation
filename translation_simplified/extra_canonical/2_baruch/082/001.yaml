translation:
  language: en
  text: 'For now, we see the nations enjoying great prosperity while they do evil. Yet they are no more than a drop. We see how powerful they are, but they will be counted as spittle. We see the glory of their greatness, though they refuse to obey the Mighty One’s commands and treat them with contempt. We see their outward beauty, though suffering already shakes it; but they will be searched out like flesh in pain. We think about the security they trust in, though it is being shaken before our eyes; but they will be crushed like a wave. We look for hope only in their strength, though it thrives on the good things God has given them; but that strength will be put away, and people will mourn over it.


    For the Most High is indeed speeding up his times and bringing his hours near. He will judge the oppressors, and announcements of the coming age will go out. Everything hidden about their sins will be exposed, while quiet thoughts of what is right will spring up. Those who now think they can escape will not be able to save themselves. No one can make a pact with famine simply by having plenty of food.


    The humble will not put their hope in prosperity. Their hearts rejoice in what endures. Their hope will grow even stronger because the fearsome end has arrived. They will not fix their attention on the pleasures of this present age. They will know that they are being brought to the end.


    The world’s final completion will reveal the great power of God’s rule. Everything will enter what lies within and return to what was appointed from the beginning. Then it will become clear that human beings did not establish what has now come to pass. It has truly reached its completion.


    Everything that once stood, everything that was made, and everything that arose in conflict and then passed away teaches this: evil does not remain evil forever, and good does not remain good forever. Every state of health turns into sickness, every strength into weakness, every beauty into deformity, and all the bloom of youth into the burdens of old age. All the beauty you saw turns into darkness and decay, while every ruin you caused turns into peace and delight. Every darkness that was given turns into the light of truth. Every error and weakness turns into quiet humility. Every act of vengeance and every outburst of wrath turns into rest and strength. Every voice of those who stay watchful turns into silence born of dust.


    Possessions will no longer lead back to death for those who seek them. Those who seize wages will no longer bring about death before its time, and death—the wage of suffering—will be taken away. There will no longer be occasions for joy that exist merely for pleasure. The changing realm will be turned into conflict brought to its completion, and the voices of sinners will no longer be heard in Sheol.[a]


    So when all these things happen, do you think the earth’s inhabitants will not be called to account for them on one day? If their own disclosures show that they are alive, their guilt itself exposes the falsehood within them. I have written down its full measure because they were born from falsehood before I die. I said that they were putting their trust in evil.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheol is the ancient name for the realm of the dead; the text does not specifically say “hell.”
