translation:
  language: en
  text: 'The great cloud you saw rise from the sea and spread over the earth represents the way the Mighty One ordered the world when he decided to create it. When his word went out from him, the created order took shape—beautiful, small—and was prepared as it should be.[1]


    The first black waters you saw coming down from that cloud represent the sin and transgression first committed by Adam, the first man. When he transgressed, death was aroused before its time. Mourning became known, afflictions were prepared, pains were created, toil was completed, and greatness began to fade.


    As for the last day, which appeared in a form and took on a likeness, you will know that the appointed time will come due. Humanity will be measured, and its strength will be tested.[2]


    Adam had heard from God some of what was to come. He understood that forgiveness had been granted to those who had died, and he had received a command from God. So he considered these things and thought five thoughts. He judged himself guilty, and he also judged the angels guilty.[3] Even at the time of his creation, he saw a vision of fierce living creatures and of the elements with fire.


    In this way, God gathered these things at their proper time, according to the likeness in which they had been created.[3]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: “Beautiful, small” is an unusual description, perhaps portraying the created order in its early state.
    reason: lexical_alternative
  - marker: '2'
    text: The obscure wording about the last day points toward final testing and judgment.
    reason: simplification_note
  - marker: '3'
    text: The five thoughts and the following clauses are compressed and obscure, including Adam’s relation to the angels and what God gathered.
    reason: source_note
