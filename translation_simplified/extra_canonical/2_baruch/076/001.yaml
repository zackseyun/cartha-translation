translation:
  language: en
  text: 'He answered me, “You prayed for me to show you what will happen to you after these things. So I have revealed this vision to you, so that you may see what will happen afterward.


    You will certainly leave this earth, but you will not die. Instead, you will be kept for the appointed times.


    Now go up to the highest point of that mountain. From there you will see the regions of the land, the shape of the inhabited world, the mountain peaks, the depths of the valleys and seas, and how many rivers there are. You will see what you are leaving and where you are going.


    This will happen after forty days. For now, go and teach the people as much as you can, so that they may learn and not die at the last time, but may learn and live at the last time.”[a]'
