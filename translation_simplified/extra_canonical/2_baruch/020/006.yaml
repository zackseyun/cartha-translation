- pob_phrase: Afterward come to this place
  simplified_phrase: After that, come to this place.
  preserved_meaning: The command to return follows what comes before.
  reasoning_layer_used: POB base text
  rationale: A separate sentence makes the sequence and command clear.
- pob_phrase: speak true things with you
  simplified_phrase: tell you what is true
  preserved_meaning: The speaker promises to communicate truth.
  reasoning_layer_used: POB base text
  rationale: Natural English replaces an awkward expression without weakening its claim.
- pob_phrase: instruct you concerning the order of the times
  simplified_phrase: teach you how the coming times will unfold
  preserved_meaning: The speaker will explain the sequence of the approaching times.
  reasoning_layer_used: POB base text and immediate clause context
  rationale: The wording makes the ordered progression understandable while retaining the times.
translation_notes:
  risk_flags:
  - risk: “How the coming times will unfold” is less formally literal than “the order of the times.”
    mitigation: It preserves both the times and their ordered sequence without adding unnamed events.
  - risk: “Will not be late” recasts the image of the times not delaying.
    mitigation: It keeps the active assurance that their coming will not lag rather than implying an outside agent.
