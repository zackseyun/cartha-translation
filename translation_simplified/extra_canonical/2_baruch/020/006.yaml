  text: Afterward come to this place, and I will appear to you there and speak true things with you, and I will instruct you concerning the order of the times, for they are coming and will not delay.
translation:
  language: en
  text: After that, come to this place. I will appear to you there and tell you what is true. I will teach you how the coming times will unfold, for they are on their way and will not be late.
