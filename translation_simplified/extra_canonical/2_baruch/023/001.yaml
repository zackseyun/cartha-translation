- pob_phrase: why are you disturbed over matters of which you are ignorant?
  simplified_phrase: Why are you disturbed by matters you do not understand?
  preserved_meaning: The Lord questions Baruch’s distress about things beyond his knowledge.
  reasoning_layer_used: Lexical decision for ܡܥܝܪ and the POB dialogue context.
  rationale: Common wording preserves the firm rebuke without suggesting panic.
- pob_phrase: then the multitude of those who would be born was numbered
  simplified_phrase: Their total number was then fixed
  preserved_meaning: God appointed a definite total for future humanity.
  reasoning_layer_used: Lexical decision for ܡܢܝܢܐ and its apocalyptic rationale.
  rationale: This conveys a divinely determined total rather than mere counting.
- pob_phrase: Unless, therefore, that number which was appointed beforehand is completed, the creature will not live again.
  simplified_phrase: The creature will not live again until that appointed number is complete.
  preserved_meaning: Renewed life awaits the completion of the predetermined number, while the creature’s referent remains undefined.
  reasoning_layer_used: POB main text, reviewer correction, and the theological decision on divine life-giving agency.
  rationale: The direct time clause improves clarity while retaining the deliberately uncertain singular referent.
