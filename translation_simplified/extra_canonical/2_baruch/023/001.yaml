translation:
  language: en
  text: 'I answered, “No, Lord, my Lord.”


    He replied, “Why are you troubled by what you do not know? Why are you disturbed by matters you do not understand? You have not forgotten the people who are alive now or those who have died. In the same way, I remember those who are yet to be born.


    “When Adam sinned, death was decreed for all who would be born. Their total number was then fixed, and a place was prepared for them—the living to dwell in and the dead to be kept. The creature will not live again until that appointed number is complete. For my Spirit gives life, and Sheol[a] receives the dead.


    “You have also been allowed to hear what will happen after these times. My salvation has truly drawn near. It is not as far away as it was before.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheol is the realm of the dead.
    reason: cultural_note
