translation:
  language: en
  text: who did not pursue the empty things of the dead, but longed for you and did not set their hearts on things that are small and soon pass away,
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: seek the vanity of the dead
  simplified_phrase: pursue the empty things of the dead
  preserved_meaning: They rejected the emptiness or futility associated with the dead, rather than merely refusing to seek the dead themselves.
  reasoning_layer_used: applied revision and source review
  rationale: “Empty things” makes “vanity” understandable while retaining the source noun required by the review.
- pob_phrase: desired you
  simplified_phrase: longed for you
  preserved_meaning: Their desire was directed toward God.
  reasoning_layer_used: POB base text
  rationale: “Longed for” expresses strong desire in natural modern English.
- pob_phrase: did not turn their hearts to what is small and passing
  simplified_phrase: did not set their hearts on things that are small and soon pass away
  preserved_meaning: They did not devote their inner desires to insignificant, temporary things.
  reasoning_layer_used: POB base text
  rationale: The wording clarifies the heart idiom without removing its biblical image.
translation_notes:
  risk_flags:
  - risk: “The empty things of the dead” remains somewhat ambiguous about what belongs to or is associated with the dead.
    mitigation: The wording preserves the POB’s documented ambiguity rather than identifying the things more narrowly.
