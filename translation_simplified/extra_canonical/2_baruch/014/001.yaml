  rationale: This expresses the ordered temporal sense without implying that the word itself means “appointed.”
- pob_phrase: what is to happen after these things
  simplified_phrase: what will happen afterward
  preserved_meaning: Baruch has been shown the events that will follow.
  reasoning_layer_used: POB translation and immediate context
  rationale: The shorter wording keeps the sequence of events in natural English.
- pob_phrase: the retribution which was spoken of by you will come upon the nations
