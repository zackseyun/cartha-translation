translation:
  language: en
  text: After these things, the time for the Messiah’s coming will reach its completion. He will return with glory. Then all who sleep in death, hoping in him, will rise.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And it will happen after these things, when the time of the coming of the Messiah is completed
  simplified_phrase: After these things, the time for the Messiah’s coming will reach its completion.
  preserved_meaning: The Messiah’s coming occurs when its time is complete.
  reasoning_layer_used: POB translation and applied doctrine-realignment revision
  rationale: A direct sentence replaces the long introductory clause while retaining the audited choice “completed.”
- pob_phrase: and he returns with glory, then
  simplified_phrase: He will return with glory. Then
  preserved_meaning: The Messiah returns accompanied by glory before the dead rise.
  reasoning_layer_used: POB translation
  rationale: Dividing the sequence into shorter sentences makes the order clear without changing it.
- pob_phrase: all those who sleep in hope of him will rise
  simplified_phrase: all who sleep in death, hoping in him, will rise
  preserved_meaning: Everyone who died with hope in the Messiah will rise.
  reasoning_layer_used: POB resurrection image and immediate context
  rationale: The wording keeps the sleep image while clarifying that it refers to death.
