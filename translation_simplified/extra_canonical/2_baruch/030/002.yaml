  text: And it will happen at that time that the storehouses will be opened in which the number of the souls of the righteous is kept, and they will come forth. And the multitudes of souls will be seen together in one gathering, of one mind. And the first will rejoice, and the last will not be grieved.
translation:
  language: en
  text: At that time, the storehouses where the number of the righteous souls is kept will be opened, and the souls will come out. The great multitude of souls will be seen gathered together as one, with one mind. The first will rejoice, and the last will not be grieved.
  philosophy: optimal-equivalence
