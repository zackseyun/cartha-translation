translation:
  language: en
  text: 'While I was praying and had just begun this prayer, I became disturbed and began to tremble. I thought about the seed of humankind—the whole human family. So many had passed away, and so few were kept. As I was thinking about this, I heard a voice say to me:


    “Son of man, why are you troubled and alarmed? You were known to me before you were created, and you were promised to me before you came out of your mother’s womb. That is why these future things were shown to you.”


    I answered, “Lord, you have shown me the many periods of time and what happened during them, but you have not shown me how long all this will last. So I ask you to tell me about those who have borne witness for righteousness: What reward is being kept for them?”


    Then I was promised many good things and evil things that are still to come, and I went up the mountain.


    Seven days later, I came to the place where there was a spring. As I sat there, I was taken up on a chariot of a cloud. I was not taken up bodily, and I did not know how it happened. A mystery was shown to me, and I heard a voice say:


    “See and understand how, in this world, the deeds and labors of those who do good and those who do evil are kept.”'
