translation:
  language: en
  text: 'Then he answered me: “You too will be kept safe until that time, when the Mighty One gives the people of the earth a sign in the last days. This will be the sign:[a] bewilderment will seize them, and they will suffer many afflictions. Their suffering will then deepen into great anguish. Their distress will become so overwhelming that they will think, ‘The Mighty One no longer remembers the earth.’ When they have given up hope, the time itself will awaken.”'
