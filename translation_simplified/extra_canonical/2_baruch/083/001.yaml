translation:
  language: en
  text: '… back into the dust from which it was born. Wealth will no longer return, but in its craving it will seek death. Those who seize wages will bring death before its time, while the death that is the wage of sufferings will be taken away. Nothing joyful will remain to give delight. The realm of change will become a completed conflict, and sinners in Sheol will not be heard.


    Since all these things are now happening, do you think they will go unpunished? One day, then, the inhabitants of the earth …[a]


    If I have made these things known to you while I am still alive, it is because those who belong to falsehood bear great guilt. I have set forth its full measure, for from the beginning they were born from falsehood, unto death. I have told you that you must be instructed. So listen, do, and speak.


    “If you break the law, you will be scattered and driven from your land.” Jeremiah also spoke to you while he was among you, when your ancestors had spent forty years in the wilderness. After Joshua died and Moses had been taken from you, your tribes still remained firmly established. Moses warned you beforehand that these things would happen to you. When they did happen, know that they came according to the law.


    Now I also speak to you after all you have seen: do not be led astray by what has happened to you. You will receive from the Mighty One the kingdom that endures and what has been stored up for you. But understand, my children: when the Mighty One’s commandments were given to you, you were not handed over to emptiness. No one goes forth by the spirit before the place of judgment.[b] Instead, turn back and acknowledge his will and his law, the holy people, the assemblies, his sanctuaries, and the beautiful works. Do not go astray …'
