translation:
  language: en
  text: Then I said, “So my hope has come to nothing. Zion was built for nothing. If those who hate us have taken control of her, what will you do for your great name?”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I have hoped in vain
  simplified_phrase: my hope has come to nothing
  preserved_meaning: The speaker believes his hope has failed.
  reasoning_layer_used: POB translation
  rationale: The common expression states the same despair more directly.
- pob_phrase: in vain was Zion built
  simplified_phrase: Zion was built for nothing
  preserved_meaning: Zion’s construction now appears futile to the speaker.
  reasoning_layer_used: POB translation and theological decision
  rationale: A separate sentence clarifies the lament without identifying earthly Zion with the prepared heavenly reality.
- pob_phrase: those who hate us have taken possession of her
  simplified_phrase: those who hate us have taken control of her
  preserved_meaning: Zion’s enemies have gained possession of the city.
  reasoning_layer_used: POB translation and theological decision
  rationale: Taken control is natural English while leaving ultimate divine agency to the surrounding context.
translation_notes:
  risk_flags:
  - risk: The lament may sound like a settled claim that God’s purpose has failed.
    mitigation: The wording keeps the statement inside the speaker’s quoted question rather than presenting it as the narrator’s conclusion.
