translation:
  language: en
  text: Or do you think that even the angels in the Mighty One’s presence feel no grief because Zion was handed over like this? Look—the nations boast inwardly. They gather before their idols and say, “She who trampled others for so long has now been trampled. She who made others submit has now been made to submit.”
