simplification_decisions:
- pob_phrase: Yet after these things
  simplified_phrase: But after this
  preserved_meaning: The events follow what was previously described and stand in contrast to it.
  reasoning_layer_used: POB main text and immediate discourse sequence
  rationale: The shorter phrase preserves both the transition and contrast in natural English.
- pob_phrase: they will be seized by tribulation
  simplified_phrase: suffering will overtake them
  preserved_meaning: Distress will catch and overwhelm them rather than merely be understood by them.
  reasoning_layer_used: applied revision and Syriac source review
  rationale: “Overtake” keeps the force of being caught while “suffering” makes tribulation immediately clear.
- pob_phrase: in the dispersion among the nations, and they will dwell in shame in every place
  simplified_phrase: while they are scattered among the nations. Wherever they live, they will live in shame.
  preserved_meaning: They will suffer as a dispersed people and experience shame in every place they inhabit.
  reasoning_layer_used: POB main text
  rationale: Two direct clauses clarify the setting and preserve the repeated idea of dwelling everywhere in shame.
