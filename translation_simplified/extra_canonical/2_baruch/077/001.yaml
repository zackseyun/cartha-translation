  review_summary: The draft is substantially clearer and its concrete renderings of social range, Zion as the holy place, extinguished lamps, and ceased springs are warranted. Revision is required because v. 3 substitutes an implication for an explicit comparative claim, while vv. 6 and 13 settle acknowledged live uncertainties more decisively than the evidence permits. The replacement restores the comparative gift of the law, retains the difficult possessive in v. 6, and makes the upward request understandable without defining it as prayer directly addressed to God.
