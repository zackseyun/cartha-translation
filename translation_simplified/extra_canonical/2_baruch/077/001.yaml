translation:
  language: en
  text: '1 I, Baruch, left that place and went to the people. I gathered everyone, from the most important to the least important. 2 I said to them, “Listen, children of Israel. See how few of you remain from the twelve tribes of Israel. 3 The Lord gave the law to you and your ancestors more than he gave it to any other nation. 4 But your brothers broke the commandments of the Most High, so he brought upon them the disaster you have seen. 5 If you also fail to do what is right, as your brothers did, 6 the Righteous One will judge his deeds.[b] He is the Mighty One you seek and the Mighty One in whom you place your hope. 7 He watches over you to preserve you, not to abandon you.


    8 “Have you not seen what happened to Zion? 9 Do you think that place sinned and was therefore overthrown? Or that the land did wrong and was therefore handed over? 10 Do you not understand that because of you, things that had not sinned were destroyed? Because of what you did, that which had done no wrong was handed over?”


    11 All the people answered me, “We remember the good things the Mighty One did among you, 12 both those we saw and those we did not see. The Anointed One will come.[a] 13 But now, seek for us an answer from above. Also write to our brothers in Babylon a letter of instruction and a message of hope. 14 Show them what still remains with you. 15 For Israel’s counsels have perished. The lamps that gave light have gone out, and the springs from which we drank have stopped flowing. 16 We have been left in darkness, in a dense forest, and thirsty in the wilderness.”'
