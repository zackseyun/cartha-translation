translation:
  language: en
  text: Then I prayed, “Lord, my Lord, you continually give light to those who are guided by understanding. Your law is life, and your wisdom is what is right. So explain this vision to me. You know that I have lived by your law, and from my earliest days I have never been separated from your wisdom.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: those who are guided in understanding
  simplified_phrase: those who are guided by understanding
  preserved_meaning: Understanding guides how these people live.
  reasoning_layer_used: lexical decision for ܕܒܣܘܟܠܐ ܡܬܕܒܪܝܢ
  rationale: The direct wording keeps both guidance and understanding without an abstract construction.
- pob_phrase: your wisdom is uprightness
  simplified_phrase: your wisdom is what is right
  preserved_meaning: God’s wisdom embodies moral rightness.
  reasoning_layer_used: lexical and theological decisions for ܚܟܡܬܝ ܬܪܝܨܘܬܐ ܗܝ
  rationale: This avoids a difficult abstract noun while preserving the strong identification.
- pob_phrase: my soul has walked in your law; I have not been cut off from your wisdom
  simplified_phrase: I have lived by your law; I have never been separated from your wisdom
  preserved_meaning: Baruch has ordered his life by God’s law and remained closely connected to divine wisdom.
  reasoning_layer_used: POB translation and lexical decision for ܠܐ ܐܬܢܣܝܬ
  rationale: Ordinary relational language preserves lifelong conduct and the force of separation.
