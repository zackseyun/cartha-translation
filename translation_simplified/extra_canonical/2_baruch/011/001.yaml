translation:
  language: en
  text: 'Then I, Baruch, said:


    “I said to you, Babylon, ‘Even if you had prospered while Zion remained in her glory, we would still have grieved deeply because you had been made equal to Zion. But now our grief has no end, and our mourning cannot be measured, because Babylon has prospered while Zion lies desolate.


    “Who can judge these things? To whom can we complain about what has happened to us? Lord, how have you endured it?


    “Our ancestors went to their rest without this grief, and the righteous sleep quietly in the earth. They did not know this distress or hear what has happened to us. If only you had ears, O earth, and a heart, O dust! Then you could go and announce in Sheol[a] to the dead, ‘You are more blessed than we who are alive.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheol is the ancient term for the realm of the dead.
    reason: cultural_note
simplification_decisions:
- pob_phrase: If you had prospered, and Zion had dwelt in her glory
  simplified_phrase: Even if you had prospered while Zion remained in her glory
  preserved_meaning: Babylon’s prosperity would have caused grief even if Zion had remained glorious.
  reasoning_layer_used: lexical decisions and applied mistranslation correction
  rationale: The recast conditional makes the contrast clear without reversing Babylon and Zion.
- pob_phrase: the grief is infinite and the lamentation beyond measure
  simplified_phrase: our grief has no end, and our mourning cannot be measured
  preserved_meaning: Baruch describes limitless grief and immeasurable mourning.
  reasoning_layer_used: POB translation and lament imagery
  rationale: Common verbal phrases preserve the full force of both parallel expressions.
- pob_phrase: Would that you had ears, O earth, and that you had a heart, O dust
  simplified_phrase: If only you had ears, O earth, and a heart, O dust!
  preserved_meaning: Baruch personifies the earth and dust as though they could hear, understand, and carry his message.
  reasoning_layer_used: POB imagery and immediate context
  rationale: The shorter wish keeps the source image and its solemn emotional force.
