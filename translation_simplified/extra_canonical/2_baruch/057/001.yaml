translation:
  language: en
  text: 'You saw a great cloud rise from the sea, move across the land, and cover this earth. Understand this: the cloud represents the world that the Mighty One made when he decided to create.[a] When his word went out, the world began, small and beautiful, and was established as it was meant to be.


    The black waters that you first saw pouring down from the cloud represent the transgression that the first Adam committed. When he sinned, death was stirred up before its proper time. Grief became known, pains were prepared, suffering came into being, toil was brought about, and greatness began to sink.


    As for the last day, which appeared in this form and took on its likeness,[b] know that the time will be examined, humanity’s measure will be taken, and its strength will be tested. Adam had heard from God some of what was to come. He understood the release of the dead that was to be given and what God had commanded him. He considered these things and formed five thoughts. He made himself liable, and he also made the angels liable.


    When Adam was created, he was also shown a vision of bitter life, the elements, and fire. In this way God gathered in Eden, in the likeness of those who were created.'
  philosophy: optimal-equivalence
