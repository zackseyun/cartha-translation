translation:
  language: en
  text: I replied, “After this comes a time divided into twelve parts. Each part has its appointed events. The first begins with upheavals. In the second, powerful people are killed. In the third, many fall. In the fourth, the sword is sent out. The fifth brings famine, and the sixth brings earthquakes. The seventh brings terrors and plagues. In the eighth, spirits attack, along with demons associated with apparitions.[a] In the ninth, fire falls. In the tenth, there is plundering and widespread oppression.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Syriac phrase is difficult; it may also be rendered “attacks by spirits and by demons of apparitions.”
    reason: lexical_alternative
