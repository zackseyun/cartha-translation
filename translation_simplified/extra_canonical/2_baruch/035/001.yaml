translation:
  language: en
  text: 'I, Baruch, went to the holy gate. I sat down humbly, wept, and said:


    “O my eyes, become springs!

    Let my eyelids become a fountain of tears.

    How can I find rest over Zion?

    How can I weep for Jerusalem?[a]

    The people I nourished,

    who once surpassed me in vision,

    now shake with fear.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Syriac text here is uncertain; another possible reading is, “How can I weep for the mourning and find it?”
    reason: textual_variant
simplification_decisions:
- pob_phrase: sat down in humility
  simplified_phrase: sat down humbly
  preserved_meaning: Baruch sits in a lowly posture as he mourns.
  reasoning_layer_used: lexical decision for ܡ̈ܟܝܟܐܝܬ
  rationale: The adverb gives the same posture in more natural English.
- pob_phrase: O my eyes, become springs, and eyelids of water, a fountain of tears
  simplified_phrase: O my eyes, become springs! Let my eyelids become a fountain of tears.
  preserved_meaning: Baruch calls for his eyes and eyelids to pour out abundant tears.
  reasoning_layer_used: lexical decisions for ܡܒܘ̈ܥܐ and ܐܡܘ̈ܬܐ
  rationale: Two direct lines preserve the bodily spring image while clarifying the compressed poetry.
- pob_phrase: have been shaken with trembling
  simplified_phrase: now shake with fear
  preserved_meaning: The people are presently overwhelmed and trembling.
  reasoning_layer_used: source-aligned revision
  rationale: Natural English avoids repetition while retaining their fearful trembling.
