translation:
  language: en
  text: 'After I had said these things, I fell asleep there. During the night I saw a vision.


    I saw a forest planted on a plain. High, rugged mountains surrounded it, and the forest stretched across a vast area. Opposite the forest, a vine sprang up, and beneath it a fountain began to flow peacefully. The fountain reached the forest and rose into powerful waves. The waves flooded the forest, suddenly uprooted most of it, and brought down all the surrounding mountains. The tall forest was laid low, and the mountaintops were brought down. The fountain became so powerful that nothing remained of the great forest except a single cedar.


    The fountain had brought down, destroyed, and uprooted most of the forest. Nothing remained of it, and no one could even recognize where it had stood. Then the vine and the fountain came forward in peace and deep stillness. They stopped not far from the cedar, and the fallen cedar was brought to them.


    Then I saw the vine open its mouth and say to the cedar:


    “Are you not the cedar that remained from the forest of wickedness? Through you, wickedness continued and was practiced through all those years, while no good was done. You kept taking what did not belong to you, but you never showed compassion with what was yours. You brought distant people under your power, and you trapped those who came near you in the snares of your evil. You always raised yourself up as if no one could uproot you.


    “But now your time has rushed upon you, and your hour has come. So you too, cedar, must follow the forest that went before you. Become dust with it, and let your ashes mingle with its ashes. Lie down in grief and rest in torment until your final time comes. Then you will return and suffer even greater torment.”'
  philosophy: optimal-equivalence
