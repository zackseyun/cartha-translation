translation:
  language: en
  text: 'I will call the Sirens from the sea.


    You Liliths, come from the desert,

    and you demons and dragons, come from the forests.


    Wake up! Tie up your garments and prepare to mourn.

    Begin lamenting with me, and mourn with me.'
