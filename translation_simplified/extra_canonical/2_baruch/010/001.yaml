  previous_text: '1 Seven days later, God spoke to me:


    2 “Tell Jeremiah to go with the captive people as far as Babylon.


    3 But you must stay here among Zion’s ruins. When these days have passed, I will show you what will happen in the last days.”


    4 So I told my brother Jeremiah what the Lord had commanded me.


    5 He went with the people. But I, Baruch, returned and sat in front of the temple gates. Then I sang this lament for Zion:


    6 “Blessed is the one who was never born,

    or who was born but has died.


    7 But how terrible it is for us who are still alive!

    We have seen Zion’s suffering

    and what has happened to Jerusalem.


    8 I will call the Sirens from the sea

    and the Liliths from the wilderness.

    Come also, demons and dragons from the forests!

    Wake up and prepare to mourn.

    Join me in grieving and lamenting.


    9 Farmers, do not sow again.

    Earth, why do you still produce crops?

    Keep your nourishing sweetness within you.


    10 Vine, why do you still produce wine?

    No offering from you will again be received in Zion,

    and no firstfruits will again be accepted.


    11 Heavens, hold back your dew.

    Do not open the storehouses of rain.


    12 Sun, hold back your rays of light.

    Moon, put out your abundant light.

    Why should light rise again

    when Zion’s light has gone dark?


    13 Bridegrooms, do not enter the wedding chamber.

    Young women, do not adorn yourselves for marriage.

    Women, do not pray for children.


    14 Instead, let women who cannot bear children rejoice,

    and let those without children be glad.

    But let those who have children grieve.


    15 Why should women give birth in pain

    only to bury their children with groaning?


    16 Why should people have children again?

    Why should human offspring even be spoken of,

    when this mother, Zion, lies in ruins

    and her children have been taken away as captives?


    17 From now on, speak no more about beauty,

    and say nothing more about loveliness …”'
