translation:
  language: en
  text: 'Listen: the great cloud you saw rising from the sea, moving forward, and covering this earth is the world. God’s power made it when he decided to create. When his word went out from his presence, the framework of the world appeared, very small at first. Then it was formed into what it was meant to become.


    The first black waters you saw pouring down from the cloud onto the world are the first sin—the transgression committed by the first Adam. When he sinned, death was set in motion before its appointed time. Mourning became known, sorrows were prepared, pain was created, toil was completed, and greatness began to be brought low.


    As for the last day, which was shown in visible form and took on a likeness, know that time will be examined, the law governing humanity will be measured, and its strength will be tested. Adam had heard from God some of what was going to happen. He thought about the release of the dead that had been given and about what God had commanded him. He continued thinking and formed five thoughts. For he made himself liable, and he also made the angels liable.


    Even when Adam was created, he was shown a vision of fierce beasts and of the elements together with fire. Thus God brought together in Eden, in the likeness of those who were created.'
  philosophy: optimal-equivalence
