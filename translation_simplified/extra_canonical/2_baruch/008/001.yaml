translation:
  language: en
  text: 'I saw him enter the Holy of Holies[a]. From there he took the sanctuary veils, the ephod[b], the altar, the mercy seat, the two tables[c], the priests’ holy garments, the censer, the forty-eight precious stones, and all the other sacred objects from the tabernacle.


    Then he called loudly to the earth: “Earth, earth, earth, hear the word of the mighty God! Receive these things that I entrust to you. Keep them safe until the last days. When you are commanded, return them, so that foreigners cannot boast over them. The time is near when Jerusalem too will be handed over for a while, until it is declared that it will be restored forever.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Holy of Holies was the innermost and most sacred part of the sanctuary.
    reason: cultural_note
  - marker: b
    text: An ephod was a sacred priestly garment.
    reason: cultural_note
  - marker: c
    text: “Two tables” probably refers to the two covenant tablets, though the source wording is uncertain.
    reason: lexical_alternative
