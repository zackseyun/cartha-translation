- pob_phrase: And after these things
  simplified_phrase: After this
  preserved_meaning: The vision continues after the preceding events.
  reasoning_layer_used: POB narrative sequence
  rationale: The shorter phrase gives the same transition in natural English.
- pob_phrase: pull down the supports of its walls and overthrow them
  simplified_phrase: remove the supports of the city’s walls and bring the walls down
  preserved_meaning: The angels must remove the walls’ structural support and demolish them.
  reasoning_layer_used: POB lexical decision and theological decision on heavenly agency
  rationale: This keeps the structural image and clearly distinguishes removing the supports from demolishing the walls.
- pob_phrase: lest the enemies boast and say
  simplified_phrase: so the enemies will not boast
  preserved_meaning: The heavenly action is intended to prevent the enemies from claiming credit.
  reasoning_layer_used: POB theological decision on agency in Jerusalem’s fall
  rationale: The purpose is stated directly without implying that boasting becomes impossible.
