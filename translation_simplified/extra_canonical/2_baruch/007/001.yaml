translation:
  language: en
  text: After this, I heard that angel say to the angels holding the torches, “Now remove the supports of the city’s walls and bring the walls down, so the enemies will not boast, ‘We ourselves tore down Zion’s wall and burned the place of the Mighty God.’ Then stand where I stood before.”
  philosophy: optimal-equivalence
