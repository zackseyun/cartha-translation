translation:
  language: en
  text: 'Now hear what the great cloud is—the cloud you saw rising from the sea and covering this earth. It is the world, which God made by his power when he decided to create. When his word went out from him, the beginning of the world appeared, very small. It was then put in order to become what he intended.


    The first black waters you saw falling from the cloud represent the sin—the transgression committed by the first Adam. When he sinned, death was stirred into action before its proper time. Mourning became known, pains were prepared, anguish came into being, toil reached its full measure, and greatness began to sink.


    As for the last day, which was shown to you in visible form, know that the time will be examined, humanity will be measured, and its strength will be tested. Adam heard from God some of what was going to happen. He reflected on the release of the dead[a] that had been granted and on what God had commanded him. He continued to consider these things and formed five thoughts. He made himself liable, and through him the angels also became liable. When Adam was created, he was shown a vision of bitter life and of the elements with fire. In this way God gathered these things beforehand in the likeness of those who were created.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The exact meaning of “release of the dead” is uncertain; it may refer to resurrection or to mortality and death’s sentence.
    reason: lexical_alternative
