simplification_decisions:
- pob_phrase: And I answered and said
  simplified_phrase: I answered
  preserved_meaning: Baruch responds to what was said.
  reasoning_layer_used: POB narrative wording
  rationale: Natural English does not need both “answered” and “said” here.
- pob_phrase: He who took from the light
  simplified_phrase: Anyone who has received from the light
  preserved_meaning: The statement applies generally to a person who derives light from beyond himself.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Anyone” clarifies the general subject, while “received from” preserves derivative revelation.
- pob_phrase: the many who exist took from Adam’s darkness
  simplified_phrase: many people received from Adam’s darkness
  preserved_meaning: Many people draw their condition from the darkness associated with Adam.
  reasoning_layer_used: POB controlling text and lexical decision
  rationale: The wording is natural while retaining the source-and-derivation image.
