- pob_phrase: called heaven and earth as witnesses against you
  simplified_phrase: called on heaven and earth to testify against you
  preserved_meaning: Moses invokes heaven and earth as witnesses in a case against the people.
  reasoning_layer_used: POB base text
  rationale: The verb “testify” makes the witness image clear in natural English.
- pob_phrase: transgress the law
  simplified_phrase: break the law
  preserved_meaning: The people violate the law rather than merely making a mistake.
  reasoning_layer_used: applied revision and previous-rendering footnote
  rationale: “Break the law” is the ordinary modern equivalent of “transgress the law.”
- pob_phrase: if you keep it, you will be kept
  simplified_phrase: if you obey it, you will be kept safe
  preserved_meaning: Obedience to the law is contrasted with scattering and leads to preservation.
  reasoning_layer_used: POB base text and immediate contrast
  rationale: The wording avoids the confusing repetition of “keep” while preserving both obedience and protection.
interpretive_expansions:
- pob_phrase: you will be kept
  rendering: you will be kept safe
  claim: Being kept means being preserved or protected, in contrast to being scattered.
  evidence:
  - The immediate contrast pairs being scattered with being kept.
  - The POB wording uses a passive form that indicates preservation.
  confidence: high
  alternatives_preserved:
  - you will be preserved
  - you will be protected
