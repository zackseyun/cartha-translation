simplification_decisions:
- pob_phrase: at all times keep asking earnestly, and pray diligently with your whole heart
  simplified_phrase: Always ask earnestly and pray diligently with all your heart
  preserved_meaning: The continual, urgent asking and the diligent, wholehearted prayer remain distinct.
  reasoning_layer_used: POB text and grounding review
  rationale: The direct wording keeps both commands and restores the separate force of “diligently.”
- pob_phrase: may not reckon the multitude of your sins
  simplified_phrase: not to count your many sins against you
  preserved_meaning: The prayer asks God not to hold their numerous sins to their account.
  reasoning_layer_used: POB text
  rationale: Common English replaces the less familiar language of reckoning a multitude.
- pob_phrase: remember the uprightness of your fathers
  simplified_phrase: remember the upright lives of your ancestors
  preserved_meaning: The prayer appeals to the upright conduct of earlier generations.
  reasoning_layer_used: POB text
  rationale: “Ancestors” conveys the broader ancestral sense, while “upright lives” makes the abstract noun concrete.
