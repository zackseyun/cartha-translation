translation:
  language: en
  text: Then I looked up and wept. At that time I said, “I could never stop speaking to you or forget you. But only at the tomb-house where my fathers are buried, cry aloud in your suffering and deep grief, so that you do not forget me while I am before you or afterward. I have told you these things so that you will keep them in mind.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Syriac does not make fully clear exactly what they are to remember.
    reason: source_note
simplification_decisions:
- pob_phrase: Far be it from me that I should be silent toward you
  simplified_phrase: I could never stop speaking to you
  preserved_meaning: The speaker strongly rejects the thought of ceasing to address them.
  reasoning_layer_used: lexical decision and mistranslation revision
  rationale: The direct wording preserves the Syriac idiom’s forceful refusal.
- pob_phrase: the house of the tombs of my fathers
  simplified_phrase: the tomb-house where my fathers are buried
  preserved_meaning: The concrete image of a burial house containing the fathers’ tombs remains.
  reasoning_layer_used: lexical decision
  rationale: The wording explains the setting while retaining the deliberate tomb-house image.
- pob_phrase: in affliction and in the distress of lamentation cry aloud
  simplified_phrase: cry aloud in your suffering and deep grief
  preserved_meaning: The accumulated pain and the forceful command to lament are preserved.
  reasoning_layer_used: lexical decision and doctrine-escalation revision
  rationale: Common pain-language replaces the dense phrasing without weakening the lament.
interpretive_expansions:
- pob_phrase: so that I may not be forgotten before you and afterward
  rendering: so that you do not forget me while I am before you or afterward
  claim: The passive statement is recast as the people’s continuing remembrance of Baruch.
  evidence:
  - The POB connects their lament with Baruch not being forgotten.
  - The phrase “before you” can naturally refer to his presence before them.
  confidence: moderate
  alternatives_preserved:
  - “Before you” may refer more generally to the present time.
translation_notes:
  risk_flags:
  - risk: The compressed phrase “only at the tomb-house” may mark either a location or the limit of accompanying Baruch.
    mitigation: The text does not add a separate command to travel there.
  - risk: The antecedent of the final remembrance phrase is uncertain.
    mitigation: The main text remains general, and the footnote identifies the uncertainty.
