  previous_text: Then I looked up and wept. At that time I said, “I could never stop speaking to you or forget you. But go only as far as the tomb-house where my fathers are buried. There, in your suffering and deep grief, cry aloud, so that I am not forgotten among you, now or afterward. I have told you these things so that you will keep them in mind.”[a]
