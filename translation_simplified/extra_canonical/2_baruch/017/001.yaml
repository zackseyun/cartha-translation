translation:
  language: en
  text: The Lord answered me, “To the Most High, it is not the number of years—many or few—that matters. What good did it do Adam to live for nine hundred and thirty years when he disobeyed the command he had received? All those years did not help him; instead, death came, and the lives of his descendants were shortened. And what did Moses lose by living only one hundred and twenty years? He obeyed the one who formed him, brought the law to the descendants of Jacob, and lit a lamp for the people of Israel.”
  philosophy: optimal-equivalence
