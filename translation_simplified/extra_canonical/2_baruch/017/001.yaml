  simplified_phrase: it is not the number of years—many or few—that matters
  preserved_meaning: The Most High does not value a life by whether it is long or short.
  reasoning_layer_used: Lexical decision on reckoning and theological decision on lifespan
  rationale: This expresses the contrast in ordinary English while retaining its moral force.
- pob_phrase: what did it profit Adam
  simplified_phrase: What good did it do Adam
  preserved_meaning: Adam gained no true benefit from his long life after disobeying the command.
  reasoning_layer_used: Lexical decision for ܡܘܬܪܐ
  rationale: The rhetorical question becomes clear without sounding commercial.
- pob_phrase: was subject to the one who formed him ... kindled a lamp
  simplified_phrase: obeyed the one who formed him ... lit a lamp
  preserved_meaning: Moses faithfully served his Creator and brought revelatory guidance to Israel.
  reasoning_layer_used: Theological decision on Moses as light-bearer
  rationale: The wording clarifies faithful submission while preserving the Creator title and lamp image.
