translation:
  language: en
  text: Some will be brought down by their own people. Then the Most High will reveal the nations he prepared in advance. They will come and wage war against the rulers who remain at that time.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: will be undone by their own
  simplified_phrase: will be brought down by their own people
  preserved_meaning: Some will fall through the action of those belonging to them rather than through an outside enemy.
  reasoning_layer_used: POB base text and immediate syntax
  rationale: “Brought down” expresses defeat or ruin more naturally without narrowing it to a specific fate.
- pob_phrase: the peoples whom he prepared beforehand
  simplified_phrase: the nations he prepared in advance
  preserved_meaning: The Most High had already prepared these groups before revealing them.
  reasoning_layer_used: POB base text and applied source revision
  rationale: “Nations” and “in advance” make the collective and prior preparation clear in common English.
- pob_phrase: they will come and wage war against the rulers who remain at that time
  simplified_phrase: They will come and wage war against the rulers who remain at that time.
  preserved_meaning: Their arrival and their warfare are distinct sequential actions directed against the surviving rulers.
  reasoning_layer_used: applied revision preserving Syriac sequential verbs
  rationale: A new sentence clarifies the sequence while retaining both “come” and “wage war.”
interpretive_expansions:
- pob_phrase: their own
  rendering: their own people
  claim: The implied referent is people belonging to the same group as those brought down.
  evidence:
  - The possessive expression requires an implied human group in English.
  - The POB presents the agents as belonging to those who are undone.
  confidence: moderate
  alternatives_preserved:
  - their own side
  - their own associates
translation_notes:
  risk_flags:
