translation:
  language: en
  text: Many will be handed over to the power of a few. Those who once counted for nothing[a] will rule over the strong. The poor will have more than the rich, and the ungodly will raise themselves above the brave.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “Those who were nothing”; that is, people formerly treated as insignificant.
    reason: simplification_note
simplification_decisions:
- pob_phrase: delivered into the hands of the few
  simplified_phrase: handed over to the power of a few
  preserved_meaning: Many people will be placed under the control of a small number.
  reasoning_layer_used: POB main text
  rationale: The wording explains the image of being put into another person's hands while retaining forced transfer and control.
- pob_phrase: Those who were nothing
  simplified_phrase: Those who once counted for nothing
  preserved_meaning: People formerly considered insignificant will gain authority over the strong.
  reasoning_layer_used: POB footnote and applied lexical revision
  rationale: The idiom is made natural without using the rejected colloquial term “nobodies.”
- pob_phrase: the impious will exalt themselves over the brave
  simplified_phrase: the ungodly will raise themselves above the brave
  preserved_meaning: Those without reverence for God will elevate themselves over courageous people.
  reasoning_layer_used: POB main text
  rationale: Common words replace formal phrasing while preserving the contrast and upward image.
interpretive_expansions:
- pob_phrase: Those who were nothing
  rendering: Those who once counted for nothing
  claim: “Nothing” describes their former social standing rather than their human worth.
  evidence:
