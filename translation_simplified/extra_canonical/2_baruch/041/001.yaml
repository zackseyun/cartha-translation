translation:
  language: en
  text: 'Then I said, “For whom will these things happen, and how many people will experience them? Who will be considered worthy to see that time?[a]


    I will tell you everything I am thinking and ask you about the many people of yours whom I have seen. Some turned away from your covenant and threw off the yoke of your law. But I also saw others abandon their empty ways[b] and flee beneath your wings.


    What will happen to them? How will they be received at that final time? Will their time perhaps be weighed on a balance, and will they be judged according to which way the scales tip?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving text overlaps nearby chapters, so the exact boundary of this question is uncertain, though its meaning is clear.
    reason: textual_variant
  - marker: b
    text: The Syriac wording is uncertain here; an ancient Latin witness supports the sense “their vanity.”
    reason: lexical_alternative
