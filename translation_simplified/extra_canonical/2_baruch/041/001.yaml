  rationale: The natural idiom preserves both the yoke image and the law’s covenantal force.
- pob_phrase: as the balance inclines, so will they be judged
  simplified_phrase: will they be judged according to which way the scales tip
  preserved_meaning: Judgment is pictured as the outcome of weighing on a balance.
  reasoning_layer_used: POB lexical decision for the balance-weighing expression
  rationale: Familiar wording makes the weighing image immediately clear.
