- pob_phrase: when the multitude of his hosts has been struck down by the sword
  simplified_phrase: when the army ... has been killed by the sword
  preserved_meaning: The ruler’s military forces are slain while he survives.
  reasoning_layer_used: POB text and lexical decision on the corporate scope of the hosts
  rationale: “Army” makes the identity of the hosts immediately clear while retaining the sword image.
- pob_phrase: they will bring him up to Mount Zion
  simplified_phrase: taken up to Mount Zion
  preserved_meaning: The bound ruler is brought to Zion for messianic judgment.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The passive wording removes an unclear pronoun without changing the action or destination.
- pob_phrase: will set before him all the wicked deeds of his hosts
  simplified_phrase: confront him with every wicked deed committed by his army
  preserved_meaning: The Messiah brings the collective evil deeds of the ruler’s forces before him.
  reasoning_layer_used: POB lexical decision on deeds, wickedness, and corporate scope
  rationale: “Confront him with” expresses the judicial force of setting the deeds before him.
