translation:
  language: en
  text: When the army of that time’s last ruler has been killed by the sword, the ruler himself will be left alive. He will be bound and taken up to Mount Zion. There my Messiah will declare him guilty of all his wickedness against God and confront him with every wicked deed committed by his army.
