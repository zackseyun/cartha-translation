translation:
  language: en
  text: The next day, the Chaldean forces surrounded the city. That evening, I, Baruch, left the people and went out to stand by the oak. I grieved over Zion and mourned because the people had been taken captive. Then I was filled with a spirit of strength and lifted high above the square of Jerusalem. I saw four angels standing at the four corners of the city. Each angel held a torch.
  philosophy: optimal-equivalence
