translation:
  language: en
  text: 'After I had said these things, I fell asleep there and had a vision in the night. I saw a cloud rising from the great sea. It was full of white and black water, with many colors in the water. At the head of the cloud appeared something like a great flash of lightning. The cloud raced forward with violent force and covered the whole earth.


    Then water began pouring from the cloud onto the earth, but it did not all look the same. I saw black water, then bright water, then black again, and then bright again. This happened up to twelve times, but overall there was more black water than bright water.


    Finally, from the end of the cloud came black water darker than all the water before it. Those waters were mixed together, and wherever they fell, they caused devastation and destruction. Then I saw the lightning that had been at the head of the cloud. It seized the cloud and dragged it down to the earth.


    After this I saw twelve rivers[a] rising from the sea. They surrounded the lightning and submitted to it. They rejoiced over that proclamation and praised it.[b] Then I awoke in fear.'
  philosophy: optimal-equivalence
