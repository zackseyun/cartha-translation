  rationale: The shorter clause states the visual contrast without interpreting the colors.
- pob_phrase: they surrounded that lightning and became subject to it
  simplified_phrase: They surrounded the lightning and submitted to it
  preserved_meaning: The rivers encircled the lightning and came under its authority.
  reasoning_layer_used: POB translation and lexical guardrails
  rationale: “Submitted” expresses subjection in familiar English while preserving authority.
