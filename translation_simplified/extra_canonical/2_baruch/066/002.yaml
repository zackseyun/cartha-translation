  text: He cleared the land of idols. He made the defiled sacred vessels holy again and restored the offerings to the altar. He raised the power of the holy ones. He lifted up the righteous and honored everyone who had wisdom and understanding. He also returned the priests to their duties and drove the sorcerers, diviners, and wizards out of the land.
