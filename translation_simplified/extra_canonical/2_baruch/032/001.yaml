  text: 'But if you make your hearts ready and sow in them the fruits of the law, it will protect you when the Mighty One shakes the whole creation.


    [Soon Zion’s structure will be shaken so that it may be rebuilt. But that rebuilt structure will not remain. After a time it will be uprooted again and lie desolate until the time comes. Then it will be renewed in glory and established forever.][a]


    Therefore, we should not grieve as deeply over the evil that has come now as over the evil still to come.'
