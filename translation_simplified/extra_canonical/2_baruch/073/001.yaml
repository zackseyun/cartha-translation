    ܘܠܫܐܪܗܘܢ ܚܒܝܒ̈ܐ܆ ܘܣܟܠܐ

    ܢܣܟܠܘܢ܆ ܘܠܐ ܬܫܬܘܙܒܘܢ

    ܘܐܝܟܢ ܡܚܫܒܬܐ ܕܒܢܝ

    ܐܢܫܐ܆ ܐܦ ܠܐ ܬܪܥܝܬܐ

    ܕܥܠܡܐ܆ ܘܠܐ ܢܫܬܘܙܒܘܢ 71..

    ܘܫܒܪ̈ܘܗܝ ܕܐܝܠܝܢ ܕܡܣܒܪܝܢ܆

    ܘܬܘܒ ܕܝܢ ܡܕܐ ܕܗ̈ܘܝ

    ܘܐܝܠܝܢ ܕܡܩܕ̈ܡܢ ܐܡܝܪ̈ܢ܆

    ܢ

    ܡܪܝܡܢܐ ܠܗܘܢ ܥܡܡ̈ܐ

    ܕܩܕܡ ܓܠܝܘ. ܘܐܢܬ

    ܘܠܡܘܟܟ ܥܡ ܡܕܒܪܢܐ

    ܕܡܫܬܚܠܦ ܗܢܘܢ. ܘܐܢܬ

    ܕܠܐ ܡ̇ܢ ܕܡܬܩܪܐ ܡܢ

    ܩܕܡ ܒܙܒܢܐ ܢܫܬܘܐ.

    ܘܕܡܬܩܪܐ ܡܢ ܒܬܪ

    ܒܙܒܢܐ ܢܬܟܢ. ܘܐܢܬ

    ܕܡܬܩܪܐ ܡܢ ܫܘܝܐ

    ܒܒܥܘܬܐ ܢܫܬܡܥ. ܘܐܢܬ

    ܕܠܐ ܡ̇ܢ ܕܡܬܩܪܐ ܡܒܪܟ

    ܡܢ ܒܪܢܫܐ ܐܝܬܘܗܝ ܕܡܩܪܒ

    ܬܘܒ ܡܢ ܐܝܬܘܗܝ

    ܕܐܦܘܗܝ ܢܬܚܙܘܢ. ܢܫܬܒܩܘܢ

    ܠܐܝܠܝܢ ܕܥܒܕܝܢ ܡܫܟܢܘܬܐ.

    ܬܬܡܠܐ ܓܝܪ ܟܠ ܐܪܥܐ

    ܠܒܪܘܝܗ̇. ܘܝ ܐܪܥܐ ܕܝܢ

    ܩܕܡܝܬܐ ܬܬܚܙܐ ܥܠ

    ܕܒܪܗ̇. ܐܘ ܠܐ ܒܡܘܬܗ̇

    ܒܗܘ ܙܒܢܐ ܗ̇ܘ ܚܕܐ

    ܕܚܙܝܬ. ܗ̇ܘܘ ܦܘܩܕܢܘܗܝ.

