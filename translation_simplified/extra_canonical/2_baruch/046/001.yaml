    ܘܠܐ ܢܦܠܚ ܐܢܬܘܢ

    ܒܬܘܝܒܘܬܐ ܕܩܕܡܘ

    ܐܡ̇ܪܘܗ̇ ܠܟܘܢ. ܡܠܐ

    ܡܠܬܐ ܕܝܢ ܕܡܬܬܣܝܡ

