simplification_decisions:
- pob_phrase: And again I also showed it
  simplified_phrase: Again, I also showed it
  preserved_meaning: The wording retains both the renewed action and its addition to other revelations.
  reasoning_layer_used: POB base text
  rationale: Dropping only the opening conjunction makes the sentence more natural while preserving “again” and “also.”
- pob_phrase: the pattern of the tabernacle
  simplified_phrase: the design of the tabernacle
  preserved_meaning: Moses was shown the model or plan for the sacred tent.
  reasoning_layer_used: POB base text
  rationale: “Design” expresses the practical sense of “pattern” in common English.
- pob_phrase: all its vessels
  simplified_phrase: all its equipment
  preserved_meaning: The revelation included all the tabernacle’s specified implements.
  reasoning_layer_used: POB base text and grounding review
  rationale: “Equipment” avoids the misleading modern sense of ships without broadening the reference to anything used there.
