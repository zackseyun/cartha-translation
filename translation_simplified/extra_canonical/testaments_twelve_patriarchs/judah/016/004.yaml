translation:
  language: en
  text: Wine also causes people to reveal secrets about God and about human beings. In the same way, I told the Canaanite woman God’s commands and the secrets of my father Jacob, even though God had told me not to reveal them.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the mysteries of God and of men
  simplified_phrase: secrets about God and about human beings
  preserved_meaning: Wine exposes hidden matters concerning both God and humanity.
  reasoning_layer_used: POB translation and immediate context
  rationale: “Secrets” clearly conveys forbidden disclosure, while “human beings” avoids adding a contrast with Judah.
- pob_phrase: just as I too revealed
  simplified_phrase: In the same way, I told
  preserved_meaning: Judah presents his own disclosure as an example of wine’s effect.
  reasoning_layer_used: POB clause relationship and grounding review
  rationale: The direct connector preserves the comparison without overstating it as an event summary.
- pob_phrase: things that God told me not to reveal
  simplified_phrase: even though God had told me not to reveal them
  preserved_meaning: God had forbidden Judah to disclose the commands and secrets.
  reasoning_layer_used: POB translation and source relative clause
  rationale: The contrast plainly connects God’s prohibition with Judah’s disclosure.
