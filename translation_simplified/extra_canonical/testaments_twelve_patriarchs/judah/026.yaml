translation:
  language: en
  text: 'Therefore, my children, obey the Lord’s whole law. It gives hope to everyone who does what is right and follows his ways. Bury me beside my ancestors.


    He then fell asleep in death at a good old age. His sons did everything he had told them to do. They took him to Hebron and buried him there beside his ancestors.


    If you live holy lives by obeying all the Lord’s commandments, you will once again live securely with me, and all Israel will be gathered to the Lord forever.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This promise looks ahead to secure life with Judah and to Israel’s final gathering to the Lord.
    reason: cross_reference
