- pob_phrase: keep his ways in righteousness
  simplified_phrase: does what is right and follows his ways
  preserved_meaning: Hope belongs to those who act rightly while faithfully following the Lord’s ways.
  reasoning_layer_used: POB lexical choice and covenantal theology
  rationale: This makes righteousness concrete without reducing covenant obedience to generic morality.
- pob_phrase: near my fathers / with his fathers
  simplified_phrase: beside my ancestors
  preserved_meaning: Judah asks to be buried in the ancestral burial place and is buried there.
  reasoning_layer_used: Immediate narrative context
  rationale: “Ancestors” clearly expresses the family burial sense of “fathers.”
- pob_phrase: in a good old age
  simplified_phrase: at a good old age
  preserved_meaning: Judah dies at an advanced age under the positive force of the traditional formula.
  reasoning_layer_used: POB lexical rationale and grounding review
  rationale: This natural wording preserves the death formula without judging Judah’s whole life as honorable.
