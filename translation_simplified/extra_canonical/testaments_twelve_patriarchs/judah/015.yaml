translation:
  language: en
  text: 1. A man who commits sexual immorality does not realize that it is ruining him. Even when it brings him disgrace, he feels no shame. 2. Even a king who commits sexual immorality is stripped of his kingship, because he has become enslaved to sexual immorality. That is what happened to me. 3. I gave away my staff, which was the support of my tribe; my belt, which was my strength; and my diadem, which was the glory of my kingdom. 4. Although I changed my mind about what I had done,[a] I ate no meat and drank no wine until my old age. I experienced no joy at all. 5. The angel of God showed me that women rule forever over kings and beggars alike. They take away a king’s glory, a strong man’s strength, and a poor man’s very support.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Although I repented over what I had done.”
    reason: lexical_alternative
  - marker: b
    text: The source text used for this record is incomplete here; this fuller wording reflects the surviving Greek context and should be checked against critical editions.
    reason: textual_variant
