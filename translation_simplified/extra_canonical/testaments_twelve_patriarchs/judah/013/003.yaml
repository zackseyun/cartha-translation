translation:
  language: en
  text: I criticized my brother Reuben about Bilhah, my father’s wife. Then the spirit of jealousy and sexual immorality rose up against me, until I committed sexual immorality with Anan, the Canaanite woman, and with Tamar, my daughter-in-law.
