simplification_decisions:
- pob_phrase: For even if a man is a king and commits sexual immorality
  simplified_phrase: Even a king who commits sexual immorality
  preserved_meaning: Royal status does not protect someone who commits sexual immorality.
  reasoning_layer_used: POB translation and Greek source
  rationale: The conditional wording becomes a direct general warning without changing its force.
- pob_phrase: he is stripped of his kingship, having been enslaved to sexual immorality
  simplified_phrase: he is stripped of his kingship and becomes a slave to that immorality
  preserved_meaning: The offender loses royal standing and comes under the power of sexual immorality.
  reasoning_layer_used: POB translation and Greek source
  rationale: The sentence uses ordinary clause order while preserving both loss and enslavement.
- pob_phrase: as I also suffered
  simplified_phrase: I too became enslaved to sexual immorality
  preserved_meaning: Judah identifies enslavement to sexual immorality as his own experience.
  reasoning_layer_used: POB syntax and independent grounding review
  rationale: Naming the experience prevents readers from thinking Judah claimed that he lost a kingship.
