  simplified_phrase: the spirit that carries the holy Father’s blessing
  preserved_meaning: The poured-out spirit remains closely joined to the Father’s blessing.
  reasoning_layer_used: POB translation and Greek source payload
  rationale: The relative clause clarifies the compact noun sequence without making “spirit” a definite title.
- pob_phrase: you will be for him sons in truth
  simplified_phrase: you will truly be his sons
  preserved_meaning: They will genuinely belong to him as sons.
  reasoning_layer_used: POB translation and applied doctrine-realignment revision
  rationale: Natural English preserves both sonship and the force of “in truth.”
- pob_phrase: you will walk in his commands, first and last
  simplified_phrase: you will follow all his commands, from first to last
  preserved_meaning: They will obey his commands throughout their full range.
  reasoning_layer_used: POB translation and revision preserving “commands”
  rationale: “Follow” makes the walking image understandable while retaining the audited term “commands.”
