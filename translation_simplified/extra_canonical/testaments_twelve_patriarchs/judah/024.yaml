translation:
  language: en
  text: '1. He will pour out upon him the spirit that carries the holy Father’s blessing. Then he himself will pour out a spirit of grace upon you.


    2. You will truly be his sons, and you will follow all his commands, from first to last.


    3. [He is the shoot of the Most High God, a spring that gives life to all flesh.]


    4. Then the scepter of my kingdom will shine. A stem will rise from your root.


    5. From that stem a righteous rod will grow for the nations. He will judge and save all who call upon the Lord.'
  philosophy: optimal-equivalence
