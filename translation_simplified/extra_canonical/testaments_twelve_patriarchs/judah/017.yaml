translation:
  language: en
  text: 'And now, my children, I command you: Do not love money or fix your eyes on the beauty of women. I myself was led astray to Besue, the Canaanite woman, because I desired gold and beauty.


    I know that these two desires will bring my descendants to ruin through sexual immorality. They will corrupt even the wise men among my sons and weaken the kingdom of Judah, which the Lord gave me because I obeyed my father Jacob.'
