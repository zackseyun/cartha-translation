  preserved_meaning: The Lord selected the other person for this role in preference to Judah.
  reasoning_layer_used: POB translation and Greek source
  rationale: “Rather than you” expresses the comparison in natural modern English.
- pob_phrase: to draw near to him
  simplified_phrase: to come near to him
  preserved_meaning: The chosen person is permitted to approach the Lord.
  reasoning_layer_used: POB translation and immediate context
  rationale: “Come near” clearly preserves the act of approaching God.
- pob_phrase: you shall be king of Jacob
  simplified_phrase: you will be king over Jacob
  preserved_meaning: Judah is promised royal authority over Jacob’s people.
  reasoning_layer_used: POB translation
  rationale: “King over” expresses royal rule in ordinary English.
