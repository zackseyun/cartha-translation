    mitigation: The draft preserves POB’s sequence without adding moral labels to either group.
  - risk: Rendering “in you” as “among you” softens the container-like aspect of the sea image.
    mitigation: The opening comparison and stormy-sea imagery keep the community’s figurative identification with the sea explicit.
