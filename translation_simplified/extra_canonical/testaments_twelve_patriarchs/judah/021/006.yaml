simplification_decisions:
- pob_phrase: just as in it the righteous are storm-tossed
  simplified_phrase: As on a stormy sea, the righteous will be tossed about
  preserved_meaning: The righteous remain subject to the sea’s forceful image of danger and upheaval.
  reasoning_layer_used: POB translation and source image
  rationale: The simile avoids picturing people literally inside the sea while preserving its turmoil.
- pob_phrase: so also in you every race of men
  simplified_phrase: In the same way, every kind of person will be among you
  preserved_meaning: People of every sort will be present within the addressed community.
  reasoning_layer_used: POB translation and immediate parallel
  rationale: Natural word order clarifies the comparison and avoids the modern ethnic sense of “race.”
- pob_phrase: seizing what belongs to others
  simplified_phrase: taking what belongs to others
  preserved_meaning: Their wealth comes from wrongfully taking other people’s possessions.
  reasoning_layer_used: POB translation
  rationale: Common wording keeps the accusation clear and direct.
translation_notes:
  risk_flags:
