translation:
  language: en
  text: 'You will be like the sea among them. As on a stormy sea, the righteous will be tossed about: some will be taken captive, while others will grow rich. In the same way, every kind of person will be among you: some will be in danger and taken captive, while others will grow rich by taking what belongs to others.'
