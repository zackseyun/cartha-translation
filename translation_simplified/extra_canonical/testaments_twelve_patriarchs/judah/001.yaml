translation:
  language: en
  text: 'The Testament of Judah, the fourth son of Jacob and Leah


    This is a written copy of what Judah said to his sons before his death.


    2 His sons gathered and came to him. He said:


    3 “Listen to me, my children. I am Judah, your father. I was the fourth son born to my father Jacob. My mother Leah named me Judah, saying, ‘I praise the Lord because he has also given me a fourth son.’


    4 “I was keen in my youth and obeyed my father in everything he told me. 5 I honored my mother and my mother’s sister. 6 When I had grown up, my father blessed me, saying, ‘You will be a king, and you will prosper in everything.’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Prosper” may also mean being guided successfully or having one’s way made prosperous.
    reason: lexical_alternative
