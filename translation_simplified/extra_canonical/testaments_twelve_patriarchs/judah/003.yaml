translation:
  language: en
  text: '1[a] Two Canaanite kings came with a large force to attack our flocks. They were wearing armor. I ran alone toward one of the kings, struck his shins, dragged him down, and killed him.


    2. Taphou, the other king, was on horseback. I killed him too and sent his whole force scattering.


    3. Then I found Achor, a giant of a man, shooting arrows. I leaped up, seized a stone weighing sixty litras[b], and hurled it. The stone struck the horse and killed it.


    4. I fought Achor for two hours and killed him. I split his shield in two and hacked through his feet.


    5. As I was taking off his breastplate, eight of his companions suddenly attacked me.


    6. I wrapped my garment around my arm and used a sling to hurl stones at them. I killed four of them[c], and the rest fled.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek text of this chapter is tangled. Manuscripts vary in the opponents’ names, sometimes using Chora or Nachor, and some repeat or rearrange parts of the battle story.
    reason: textual_variant
  - marker: b
    text: A litra was an ancient unit of weight; the point is that the stone was extraordinarily heavy.
    reason: cultural_note
  - marker: c
    text: 'Some manuscripts include the fuller ending given here: Judah kills four attackers, and the rest flee.'
    reason: textual_variant
