translation:
  language: en
  text: Until the God of righteousness comes to bring peaceful rest to Jacob and all the nations, he will preserve the power of my kingdom forever, because the Lord swore an oath to me that he would never wipe out the kingdom. My children, I am deeply grieved because you will commit sexual sins and practice sorcery in the kingdom, turning to spirit-mediums,[a] omens, and deceiving demons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “ventriloquists”; this refers to people involved in occult practices, not modern entertainers.
    reason: cultural_note
