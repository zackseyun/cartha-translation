translation:
  language: en
  text: 1. Two years after Tamar became a widow, she heard that I was going up to shear the sheep. She dressed in bridal clothing and sat in Enaim, at the gate of the city’s inn.[a] 2. The Amorites had a law requiring a widow to sit there publicly and make herself available for prostitution. 3. I was drunk with wine and did not recognize her. Her beauty and bridal appearance deceived me. 4. I turned aside to her and said, “I will sleep with you.” She asked, “What will you give me?” I gave her my staff, my ring, and the royal diadem of my kingdom as a pledge.[b] Then I slept with her, and she conceived. 5. Still not realizing what I had done, I wanted to kill her. But she secretly sent the pledged items and put me to shame. 6. When I summoned her, I also heard the secret words I had spoken while sleeping with her in my drunkenness.[c] I could not kill her, because it was from the Lord.[d] 7. For I said, “Perhaps she acted deceitfully and got the pledge from someone else.” 8. But I never approached
    her again for the rest of my life, because I had committed this abomination in Israel. 9. Yet the people of the city said that no harlot had been sitting at the gate. She had come from another place and had sat at the gate only briefly. 10. I thought no one knew that I had slept with her. 11. After this, because of the famine, we went to Joseph in Egypt. 12. I was forty-six years old then, and I spent seventy-three years in Egypt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek includes the unusual detail that this was the gate of an inn; it is retained rather than harmonized with Genesis.
    reason: textual_variant
  - marker: b
    text: Unlike Genesis, the Greek here names Judah’s staff, ring, and royal diadem as the pledged items.
    reason: textual_variant
  - marker: c
    text: Or “the words spoken privately”; the Greek is awkward but refers to words Judah spoke in secret while drunk.
    reason: lexical_alternative
  - marker: d
    text: “From the Lord” may refer to divine providence overruling the event, not to the Lord’s approval of the act.
    reason: alternative_reading
