translation:
  language: en
  text: 1. While I was at the waters of Chozeba,[a] the men of Jobel came to fight us. 2. We fought them and drove them away. We also killed their allies from Shilom and left them no way to escape. 3. On the fifth day, the men of Machir attacked us again. We charged at them with a mighty sword,[b] defeated them, and killed them before they could climb the slope. 4. As we approached the city, their women rolled stones down on us from the top of the mountain where the city stood. 5. We hid Simeon and the others behind them. Then we took the high ground and completely destroyed this city too.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Chozeba, Jobel, and Shilom reproduce the Greek place names, but their locations are uncertain.
    reason: cultural_note
  - marker: b
    text: The Greek wording here is grammatically irregular, so this translation gives its apparent tactical sense without changing the source text.
    reason: textual_variant
