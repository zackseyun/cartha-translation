translation:
  language: en
  text: The Lord showed me favor in everything I did, both in the fields and at home.[a] I kept pace with a female deer, caught it, and prepared it as food for my father, and he ate it. I would catch a gazelle while it was running, and I overtook everything in the fields. I killed a lion and snatched a young goat from its mouth. I grabbed a bear by the foot and threw it down a cliff, where it was crushed. I chased down a wild boar, overtook it as I ran, and tore it apart. I caught a wild mare and subdued it. In Hebron, a leopard sprang at the dog. I grabbed the leopard by the tail and flung it against a rock, splitting it in two. I found a wild ox[b] grazing in the land. I seized its horns, shook it round and round, and struck it blind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Greek text is rough in parts of this chapter, especially in the sequence of encounters with animals. This translation follows the sense of the surviving text without smoothing away its abrupt style.
    reason: textual_variant
  - marker: b
    text: Or “wild bull”; the Greek refers to a powerful, untamed bovine.
    reason: lexical_alternative
