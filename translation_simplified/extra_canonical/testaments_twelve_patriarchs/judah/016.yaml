translation:
  language: en
  text: '1. So, my children, guard yourselves and do not cross the proper limit with wine.[a] Wine carries four evil spirits with it: desire, heated passion, reckless living, and the pursuit of shameful gain.[b]


    2. If you drink wine while celebrating, do so with restraint and fear of God. If the fear of God leaves you as you celebrate, drunkenness follows and shamelessness enters.


    3. But if you want to live with self-control, do not touch wine at all, so that you do not sin through arrogant speech, fighting, slander, and disobeying God''s commandments—and perish before your time.


    4. Wine also reveals mysteries of God and of people. That is what I did: I revealed God''s commandments and the mysteries of Jacob, my father, to the Canaanite woman—things God told me not to reveal.


    5. Wine also causes war and turmoil.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek pictures wine as having a boundary or proper measure that must not be crossed.
    reason: lexical_alternative
  - marker: b
    text: “Evil spirits” may describe personified vices or actual spiritual forces; the Greek allows either sense.
    reason: lexical_alternative
