translation:
  language: en
  text: 'After these things, Abraham, Isaac, and Jacob will rise to life. Then my brothers and I will rule in Israel with scepters: Levi first, I second, Joseph third, Benjamin fourth, Simeon fifth, Issachar sixth, followed by all the others in order.'
