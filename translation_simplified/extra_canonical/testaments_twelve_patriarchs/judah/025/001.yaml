  preserved_meaning: The patriarchs will return to life, and Judah and his brothers will exercise authority in Israel with the scepter image retained.
  reasoning_layer_used: POB text and applied revision
  rationale: Splitting the sentence clarifies the sequence, while “rule in Israel with scepters” preserves authority and the source image without adding tribes.
