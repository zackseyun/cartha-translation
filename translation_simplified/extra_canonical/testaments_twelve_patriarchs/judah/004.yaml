translation:
  language: en
  text: '1. After this, a war broke out to the south that was greater than the war at Shechem. My brothers and I formed our battle lines, pursued a thousand men, and killed two hundred of them and four kings.


    2. I climbed onto the wall and killed their king.


    3. In this way we set Hebron free and took all the captives.


    4. The rest fled.


    5. Then my father Jacob killed Belisath, king over all the kings. He was a giant of a man in strength and stood twelve cubits tall.[a]


    6. Terror fell over them, and they stopped making war against us.


    7. So my father did not worry about the wars while I was with my brothers.


    8. He had seen a vision about me: an angel of power went with me in all things, so that no one could lay a hand on me.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Twelve cubits was about eighteen feet, or 5.5 meters.
    reason: cultural_note
