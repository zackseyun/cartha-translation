translation:
  language: en
  text: The Lord will bring divisions among them, turning them against one another. There will be constant wars in Israel. My kingdom will come to an end among foreign peoples, until the salvation of Israel comes.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the deliverance of Israel”; the phrase may also point toward the Messiah without directly naming a person.
    reason: alternative_reading
  - marker: b
    text: Or “my kingdom will be completed among foreign peoples”; the Greek verb can mean either completion or coming to an end.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: bring divisions among them against one another
  simplified_phrase: bring divisions among them, turning them against one another
  preserved_meaning: The Lord causes internal factional divisions marked by mutual hostility.
  reasoning_layer_used: POB lexical decisions for διαιρέσεις and κατ’ ἀλλήλων
  rationale: The added verb makes the hostile effect clear while retaining the source plural.
- pob_phrase: continual wars
  simplified_phrase: constant wars
  preserved_meaning: Wars will persist in Israel.
  reasoning_layer_used: POB lexical decision for πόλεμοι συνεχεῖς
  rationale: “Constant” is common English and retains the conflicts’ continuing force.
- pob_phrase: my kingdom will be brought to an end among foreigners
  simplified_phrase: my kingdom will come to an end among foreign peoples
  preserved_meaning: Judah’s kingdom ends among foreign peoples rather than reaching triumphant fulfillment.
  reasoning_layer_used: POB lexical and theological decisions for συντελεσθήσεται and ἀλλοφύλοις
  rationale: The natural English form avoids implying an unstated agent while preserving termination.
