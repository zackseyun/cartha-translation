- pob_phrase: he went in to her
  simplified_phrase: he slept with her
  preserved_meaning: The sexual union is stated clearly without changing the action.
  reasoning_layer_used: POB text and immediate context
  rationale: The biblical euphemism is replaced with a common, dignified expression.
- pob_phrase: he wasted the seed on the ground
  simplified_phrase: he spilled his semen on the ground
  preserved_meaning: The concrete image of deliberately releasing his seed onto the ground remains intact.
  reasoning_layer_used: Greek source image and POB rendering
  rationale: “Semen” makes the bodily meaning of “seed” immediately clear.
- pob_phrase: give Shelah also to her
  simplified_phrase: give Shelah to her as a husband
  preserved_meaning: Judah intended Shelah to enter the marriage relationship in view.
  reasoning_layer_used: Immediate narrative context and POB wording
  rationale: The added relationship prevents “give” from sounding like a transfer of property.
interpretive_expansions:
- pob_phrase: for she acted wickedly, because she was not from the daughters of Canaan, as she herself was
  rendering: His mother acted wickedly because the woman was not a Canaanite, while she herself was.
  claim: The mother is the wicked actor and a Canaanite, while the other woman is not a Canaanite.
  evidence:
  - The preceding clause explicitly names Shelah’s mother as the one who refused.
  - The contrast “while she herself was” distinguishes the mother from the other woman.
  confidence: moderate
  alternatives_preserved:
  - The women are not named in this clause, following the POB’s caution about the Greek pronouns.
