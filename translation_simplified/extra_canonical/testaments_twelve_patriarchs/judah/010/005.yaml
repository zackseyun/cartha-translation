translation:
  language: en
  text: When I threatened him, he slept with her, but he spilled his semen on the ground, as his mother had told him to do. So he too died in wickedness. I also wanted to give Shelah to her as a husband, but his mother would not allow it. His mother acted wickedly because the woman was not a Canaanite, while she herself was.
