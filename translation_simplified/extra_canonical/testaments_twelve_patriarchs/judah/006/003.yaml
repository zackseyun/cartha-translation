  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/006/003.yaml
  text: But those from Machir attacked us again on the fifth day; and charging at them with a mighty sword[a], we prevailed over them and killed them before they could scale the ascent[b].
  footnotes:
  - marker: a
    text: The verb προσδίδωσι (3rd sg. present) is syntactically anomalous in context — a sudden shift to singular present in a first-person plural aorist narrative. It may be a scribal compression or corruption for a participial phrase meaning 'committing [himself] against them.' The translation renders the apparent sense of the action (an aggressive engagement against the enemy) without emending the text.
    reason: textual_variant
  - marker: b
    text: τὴν ἀνάβασιν is a cognate accusative with ἀναβἆναι — literally 'before ascending the ascent.' The phrase denotes a slope, pass, or fortified approach the enemy was trying to reach or climb. 'Scale the ascent' preserves the directional and tactical sense.
    reason: lexical_note
translation:
  language: en
  text: But on the fifth day, the men from Machir attacked us again. We charged at them with a mighty sword,[a] defeated them, and killed them before they could climb the slope.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek abruptly shifts to a singular present verb here; the wording may have been compressed or corrupted, but the apparent sense is an attack on the enemy.
    reason: textual_variant
  - marker: b
    text: The Greek literally says “ascend the ascent,” referring to a slope, pass, or fortified approach.
    reason: source_note
simplification_decisions:
- pob_phrase: those from Machir
  simplified_phrase: the men from Machir
  preserved_meaning: The attackers came from Machir.
  reasoning_layer_used: source context and POB narrative sense
  rationale: Adding “men” makes the group reference immediately clear without changing its identity.
- pob_phrase: charging at them with a mighty sword, we prevailed over them
  simplified_phrase: We charged at them with a mighty sword, defeated them
  preserved_meaning: Judah’s group aggressively engaged the enemy and gained victory over them.
  reasoning_layer_used: POB textual note and lexical decision for περιγινόμεθα
  rationale: Two direct verbs replace the dense participial military construction while retaining both attack and victory.
- pob_phrase: before they could scale the ascent
  simplified_phrase: before they could climb the slope
  preserved_meaning: The enemy was killed before reaching or climbing the tactical approach.
  reasoning_layer_used: POB lexical decision for ἀναβῆναι τὴν ἀνάβασιν
  rationale: “Climb the slope” expresses the same directional image in common English.
translation_notes:
  risk_flags:
  - risk: The Greek verb behind “charged” is grammatically anomalous and may reflect textual corruption.
    mitigation: Footnote [a] preserves the uncertainty while the main text follows the POB’s apparent sense.
  - risk: “Slope” selects one concrete sense from a range that includes a pass or fortified approach.
    mitigation: Footnote [b] preserves the broader tactical possibilities and the original climbing image.
