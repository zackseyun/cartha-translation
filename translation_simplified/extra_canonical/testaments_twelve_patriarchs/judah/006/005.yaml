  reasoning_layer_used: POB footnotes and lexical decisions for ὑποκρύψας, τὸν τε καὶ Συμεών, and ἐξωπίσθεν
  rationale: A direct sentence and an explicit referent make the flanking maneuver immediately clear.
- pob_phrase: we seized the height
