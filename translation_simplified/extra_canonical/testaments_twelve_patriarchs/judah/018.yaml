translation:
  language: en
  text: '1. The Lord showed me favor because I obeyed my father. 2. I never caused my father Jacob grief, because I did everything he told me to do. 3. My forefather Abraham blessed me to rule in Israel, and Jacob gave me the same blessing. 4. I also know what evil things you will do in the last days.


    5. So, my children, guard yourselves against sexual immorality and the love of money. Listen to your father Judah. 6. These sins turn people away from God’s law. They blind the soul’s judgment, make people arrogant, and keep them from showing mercy to their neighbors. 7. They strip the soul of everything good and trap a person in suffering and exhausting work. They drive away sleep and wear down the body. 8. They keep a person from offering sacrifices to God and make him forget God’s blessing. He does not listen when a prophet speaks, and he resents teaching about godly living. 9. He is a slave to these two opposing passions and cannot obey God, because they have blinded his soul.'
