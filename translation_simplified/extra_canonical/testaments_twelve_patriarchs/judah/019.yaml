  rationale: The POB explicitly permits “idol worship” as a clearer equivalent.
- pob_phrase: the love of money leads to idolatry
  simplified_phrase: the love of money leads to worshiping idols
  preserved_meaning: Love of money is presented as moving a person toward idol worship, not as being strictly identical with it.
