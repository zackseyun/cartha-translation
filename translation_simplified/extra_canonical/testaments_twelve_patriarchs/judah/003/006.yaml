translation:
  language: en
  text: But I wrapped my cloak around my arm and hurled four stones at them. Then, from behind and in front, around the waist of a man seated on a horse, I picked up a massive stone weighing sixty litras[a] and threw it. The stone struck the horse and killed it. I fought King Nahor for about two hours. After shattering his shield, I cut off his feet and thereby killed him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A litra was an ancient unit of weight; sixty litras describes an exceptionally heavy stone.
    reason: cultural_note
