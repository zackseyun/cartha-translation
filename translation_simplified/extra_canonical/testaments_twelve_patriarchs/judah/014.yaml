translation:
  language: en
  text: 'These two things lead a person’s understanding astray. If you drink wine until you are drunk, it throws your mind into turmoil with filthy thoughts and stirs up your body toward the pleasure of sexual immorality. The result is sin without shame.


    This is what happens to a person devoted to wine, my children: whoever gets drunk loses all regard for others. Wine also led me astray. I felt no shame before the whole city. In everyone’s sight, I turned aside to Tamar and committed a great sin. I uncovered the covering of my sons’ uncleanness.[a]


    After drinking wine, I felt no shame about breaking God’s commandment, and I took a Canaanite woman. Anyone who drinks wine needs great understanding, my children. The wisdom needed for drinking is this: drink only while you still have enough sense of shame to restrain yourself.[b] But if you keep drinking past that limit, a spirit of deception[c] enters your mind. It makes a drunk person speak disgracefully, act lawlessly, and feel no shame. He even boasts about his dishonor and thinks it is good.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek image is difficult; it may mean that Judah’s sin exposed his family’s uncleanness or shame.
    reason: lexical_alternative
  - marker: b
    text: The point is that drinking has passed its proper limit once shame and self-restraint are lost.
    reason: cultural_note
  - marker: c
    text: Or “a spirit of error.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: These two things turn away a man’s mind
  simplified_phrase: These two things lead a person’s understanding astray
  preserved_meaning: The two influences divert a person’s moral and intellectual discernment.
  reasoning_layer_used: Lexical decision for διάνοια and the POB controlling text
  rationale: The wording keeps “understanding” without adding an unstated object.
- pob_phrase: it throws your mind into turmoil with filthy thoughts, and heats your body toward pleasure for sexual immorality
  simplified_phrase: it throws your mind into turmoil with filthy thoughts and stirs up your body toward the pleasure of sexual immorality
  preserved_meaning: Drunkenness destabilizes thought and arouses bodily desire toward sexual sin.
  reasoning_layer_used: Lexical decisions for συνταράσσει and εἰς πορνείαν
  rationale: The recast clause is natural while preserving the forceful image of mental turmoil.
- pob_phrase: Such is the wine-drinker
  simplified_phrase: This is what happens to a person devoted to wine
  preserved_meaning: The warning concerns someone habitually characterized by wine.
  reasoning_layer_used: Lexical decision for πάροινος
  rationale: “Devoted to wine” conveys the documented habitual sense more clearly than “wine-drinker.”
interpretive_expansions:
- pob_phrase: I was not ashamed of the commandment of God
  rendering: I felt no shame about breaking God’s commandment
  claim: Judah’s loss of shame led him to disregard and disobey God’s commandment.
  evidence:
  - The commandment is immediately linked to Judah taking a Canaanite woman.
  - The passage repeatedly connects lost shame with sinful action.
  confidence: high
  alternatives_preserved:
  - The wording retains the passage’s repeated shame motif.
- pob_phrase: as long as he still has shame, let him drink
  rendering: drink only while you still have enough sense of shame to restrain yourself
  claim: Retained shame functions as moral self-restraint and marks the limit for drinking.
  evidence:
  - The POB cultural note identifies shame with retained self-restraint.
  - The next sentence links passing the limit with shameless conduct.
  confidence: high
  alternatives_preserved:
  - The wording still permits drinking within the stated boundary.
translation_notes:
  risk_flags:
  - risk: The phrase about uncovering the covering of the sons’ uncleanness remains obscure.
    mitigation: The text preserves the source image, while footnote [a] presents the family-shame interpretation only as a possibility.
  - risk: “A spirit of deception” may denote either a hostile personal power or personified delusion.
    mitigation: The wording retains the POB’s personification without defining its nature, and footnote [c] preserves the lexical alternative.
