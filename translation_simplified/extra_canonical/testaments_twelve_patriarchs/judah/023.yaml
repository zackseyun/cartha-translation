translation:
  language: en
  text: 'My kingdom will continue until the God of righteousness comes[a] to give peace and rest to Jacob and to all the nations. He will preserve the power of my kingdom forever, because the Lord swore an oath to me that he would never erase the kingdom.


    My children, I am deeply grieved because you will practice sexual immorality and sorcery in the kingdom. You will follow “belly-speakers” who claim to speak with spirits,[b] seek omens, and follow demons of deception. You will turn your daughters into musicians and prostitutes, and you will join in the detestable practices of the nations. Because of these things, the Lord will bring famine and plague upon you, along with death, a sword of vengeance, siege, and insults from enemies and friends.[c] Foreigners will bring my kingdom to an end.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “presence,” but the context points to an awaited coming.
    reason: lexical_alternative
  - marker: b
    text: “Belly-speakers,” traditionally rendered “ventriloquists,” were spirit-mediums or necromantic practitioners.
    reason: cultural_note
  - marker: c
    text: Some ancient witnesses differ or contain expanded details in this list of judgments, including the sword of vengeance and siege.
    reason: textual_variant
