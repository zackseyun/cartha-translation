source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐὰν γὰρ πίῃ τις οἶνον εἰς μέθην, ἐν διαλογισμοῖς ῥυπαροῖς συνταράσσει τὸν νοῦν σου, καὶ εἰς πορνείαν ἐκθερμαίνει τὸ σῶμα πρὸς ἡδονήν, καὶ πράσσει τὴν ἁμαρτίαν καὶ οὐκ αἰσχύνεται.
  language: Greek
  note: Greek from Charles XIV.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/018.yaml
  text: For if one drinks wine to drunkenness, it disturbs the mind with filthy thoughts and leads the body on to sexual union; and if the occasion of desire is present, he commits the sin and is not ashamed.
translation:
  language: en
  text: For when someone drinks wine until he is drunk, it disturbs his mind with filthy thoughts and stirs up his body toward illicit sexual relations. If he has an opportunity to act on that desire, he commits that sin without shame.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: drinks wine to drunkenness
  simplified_phrase: drinks wine until he is drunk
  preserved_meaning: The person drinks enough wine to become intoxicated.
  reasoning_layer_used: POB translation and Greek source
  rationale: The ordinary wording states the same degree of drinking more clearly.
- pob_phrase: leads the body on to sexual union
  simplified_phrase: stirs up his body toward illicit sexual relations
  preserved_meaning: Drunkenness arouses the body toward sexual conduct identified as sinful.
  reasoning_layer_used: Greek source and immediate moral context
  rationale: This retains the bodily image without suggesting that all sexual relations are condemned.
- pob_phrase: if the occasion of desire is present, he commits the sin and is not ashamed
  simplified_phrase: If he has an opportunity to act on that desire, he commits that sin without shame
  preserved_meaning: If an occasion arises, the person acts on the desire and feels no shame.
  reasoning_layer_used: POB translation
  rationale: The wording preserves both the condition and the link to the particular sin described.
interpretive_expansions:
- pob_phrase: sexual union
  rendering: illicit sexual relations
  claim: The sexual conduct in view is morally illicit rather than sexual relations in general.
  evidence:
  - The Greek term πορνείαν refers to illicit sexual conduct in this warning.
  - The following clause explicitly calls the act sin.
  confidence: high
  alternatives_preserved:
  - sexual immorality
translation_notes:
  risk_flags:
  - risk: “Illicit sexual relations” is more explicit than the POB phrase “sexual union.”
    mitigation: The Greek term and the description of the act as sin support the clarification.
