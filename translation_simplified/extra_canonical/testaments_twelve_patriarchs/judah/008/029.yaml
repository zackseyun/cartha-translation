  simplified_phrase: rob his soul of everything good
  preserved_meaning: They strip his inner life of all goodness.
  reasoning_layer_used: POB translation and Greek source image
  rationale: “Rob” expresses the force of deprivation in common English.
- pob_phrase: oppress him with toils and troubles
  simplified_phrase: burden him with exhausting work and trouble
  preserved_meaning: They weigh him down through hard labor and suffering.
  reasoning_layer_used: POB translation and Greek source wording
  rationale: The concrete wording makes the oppressive hardship immediately clear.
- pob_phrase: devour his flesh
  simplified_phrase: eat away at his body
  preserved_meaning: The suffering progressively consumes him physically.
  reasoning_layer_used: POB translation and Greek source image
  rationale: This keeps the consuming image without the misleading suggestion of literal eating.
