  text: Τοιοῦτός ἐστιν ὁ πάροινος, τέκνα μου, ὅτι ὁ μεθύων οὐκ αἰδεῖται οὐδένα. 5. *Ἰδοὺ γὰρ κἀμὲ ἐπλάνησεν μὴ αἰσχυνθῆναι τὸ πλῆθος πόλεως ὅτι ἐν ὀφθαλμῶν πάντων ἐξέκλινα πρὸς τὴν Θαμὰρ, καὶ ἐποίησα ἁμαρτίαν μεγάλην, καὶ ἀνεκάλυψα τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου.
  language: Greek
  note: Greek from Charles XIV.4-5 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/019.yaml
  text: Such is the drunkard, my children. For the one who is drunk does not reverence anyone. For behold, it made me also transgress the commandment of God, and I went in to Tamar, not being ashamed of the multitude in the city, and before the eyes of all I uncovered the shame of my sons, since I went in to Tamar.
translation:
  language: en
  text: 'This is what a drunkard is like, my children: a drunk person respects no one. Look at what happened to me. Drunkenness led me to break God’s commandment and have sexual relations with Tamar. I was not ashamed before the crowds in the city. In front of everyone, I exposed the shame of my sons through what I did with Tamar.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Such is the drunkard, my children
  simplified_phrase: This is what a drunkard is like, my children
  preserved_meaning: Judah uses his own conduct to warn his children about drunkenness.
  reasoning_layer_used: POB translation and immediate context
  rationale: The recast opening states the comparison in natural modern English.
- pob_phrase: I went in to Tamar
  simplified_phrase: have sexual relations with Tamar
  preserved_meaning: Judah refers to a sexual encounter with Tamar.
  reasoning_layer_used: POB repetition and contextual idiom
  rationale: The modern wording makes the biblical euphemism immediately understandable.
- pob_phrase: before the eyes of all I uncovered the shame of my sons
  simplified_phrase: In front of everyone, I exposed the shame of my sons
  preserved_meaning: Judah says his public act brought his sons’ shame into view.
  reasoning_layer_used: POB source-driven image
  rationale: The wording clarifies the public setting while retaining the image of exposing shame.
interpretive_expansions:
- pob_phrase: it made me also transgress the commandment of God
  rendering: Drunkenness led me to break God’s commandment
  claim: The pronoun refers to drunkenness as the influence behind Judah’s transgression.
  evidence:
  - The preceding sentences explicitly describe the conduct of a drunk person.
  - Judah presents himself as the example of that warning.
  confidence: high
  alternatives_preserved:
  - Drunkenness influenced rather than excused Judah’s conduct.
translation_notes:
