  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/003.yaml
  text: And Shelah lived, and I did not give Tamar to him as wife. For I said, "Lest he also die like his brothers." For I did not know that the Lord was judging me because of the things I had done at Timnah to my father Jacob and to Joseph.
translation:
  language: en
  text: Shelah remained alive, but I did not give Tamar to him as his wife. I said, “He might die like his brothers did.” I did not realize that the Lord was judging me for what I had done at Timnah against my father Jacob and against Joseph.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And Shelah lived
  simplified_phrase: Shelah remained alive
  preserved_meaning: Shelah was still living despite Judah’s fear that he might die.
  reasoning_layer_used: POB controlling text and immediate narrative contrast
  rationale: “Remained alive” makes the contrast with his dead brothers clear.
- pob_phrase: Lest he also die like his brothers
  simplified_phrase: He might die like his brothers did
  preserved_meaning: Judah withheld Tamar because he feared Shelah would share his brothers’ fate.
  reasoning_layer_used: POB controlling text
  rationale: The direct statement expresses the feared possibility in ordinary English.
- pob_phrase: because of the things I had done at Timnah to my father Jacob and to Joseph
  simplified_phrase: for what I had done at Timnah against my father Jacob and against Joseph
  preserved_meaning: Judah understood his judgment as connected to his wrongdoing involving Jacob and Joseph.
  reasoning_layer_used: POB controlling text
  rationale: “Against” clearly conveys that these deeds were wrongs, not neutral actions.
