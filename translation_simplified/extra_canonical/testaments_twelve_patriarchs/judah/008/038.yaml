source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Οὕτως γὰρ *ὑπερέχει ἡ ἱερατεία τοῦ Θεοῦ τῆς ἐπιγείου βασιλείας, ἐὰν μὴ διὰ ἁμαρτιῶν ἐκπέσῃ ἀπὸ Κυρίου καὶ διὰ τοῦ τῆς ἐπιγείου βασιλείας *κυριευθῇ.
  language: Greek
  note: Greek from Charles XXI.4 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/038.yaml
  text: As heaven is higher than earth, so is the priesthood of God higher than the earthly kingdom—unless it falls away through sin from the Lord and is dominated by the earthly kingdom.
translation:
  language: en
  text: The priesthood of God is higher than the earthly kingdom, just as heaven is higher than earth—unless it turns away from the Lord through sin and is ruled by the earthly kingdom.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: As heaven is higher than earth, so is the priesthood of God higher than the earthly kingdom
  simplified_phrase: The priesthood of God is higher than the earthly kingdom, just as heaven is higher than earth
  preserved_meaning: The priesthood’s superiority is expressed through the heaven-and-earth comparison.
  reasoning_layer_used: POB translation and Greek source image
  rationale: The reordered comparison reads naturally while preserving the source image and definite contrast.
- pob_phrase: unless it falls away through sin from the Lord
  simplified_phrase: unless it turns away from the Lord through sin
  preserved_meaning: Sin can cause the priesthood to abandon its proper relation to the Lord.
  reasoning_layer_used: POB translation and immediate clause context
  rationale: The clearer verb and nearby pronoun retain the priesthood as the subject.
- pob_phrase: and is dominated by the earthly kingdom
  simplified_phrase: and is ruled by the earthly kingdom
  preserved_meaning: The loss of superiority includes the earthly kingdom gaining authority over the priesthood.
  reasoning_layer_used: POB translation controlled by Greek κυριευθῇ
  rationale: The passive wording remains clear and keeps domination joined with falling away.
translation_notes:
  risk_flags:
  - risk: The exception joins falling away through sin with subjection to the earthly kingdom.
    mitigation: The wording preserves both coordinated elements without making the second an automatic result of the first.
