  text: And the angel of God showed me that women rule forever over king and beggar alike. From a king they take away his glory, and from a strong man his strength, and from a beggar even the little support of his poverty.
translation:
  language: en
  text: The angel of God showed me that women rule over kings and beggars alike. They take a king’s glory, a strong man’s strength, and even the little support a beggar has.
  philosophy: optimal-equivalence
