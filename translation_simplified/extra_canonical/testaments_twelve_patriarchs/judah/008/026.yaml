  preserved_meaning: Women exercise power over people at both ends of society.
  reasoning_layer_used: source payload and POB controlling text
  rationale: The shorter wording keeps the social contrast while avoiding the difficult claim “forever,” which is not explicit in the supplied Greek.
- pob_phrase: from a beggar even the little support of his poverty
  simplified_phrase: even the little support a beggar has
  preserved_meaning: They deprive the poor person of even his meager means of support.
  reasoning_layer_used: POB optimal-equivalence rendering
  rationale: The abstract phrase “support of his poverty” becomes ordinary English without erasing the severity of the loss.
