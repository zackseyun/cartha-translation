base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/023.yaml
  text: One who commits sexual immorality does not know when he suffers loss, and he is not ashamed when dishonored. For even if a man is a king and commits sexual immorality, he is stripped of his kingship by becoming a slave to sexual immorality, as I myself also suffered.
translation:
  language: en
  text: A person who commits sexual immorality does not realize the loss he suffers, and he feels no shame when he is disgraced. Even if a man is a king, becoming a servant to sexual immorality strips him of his kingship. I myself also suffered from such slavery.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: One who commits sexual immorality does not know when he suffers loss
  simplified_phrase: A person who commits sexual immorality does not realize the loss he suffers
  preserved_meaning: Sexual immorality leaves a person unaware of the unspecified loss he suffers.
  reasoning_layer_used: POB translation and immediate Greek source
  rationale: The wording is natural while leaving the nature of the loss unspecified.
- pob_phrase: he is stripped of his kingship by becoming a slave to sexual immorality
  simplified_phrase: becoming a slave to sexual immorality strips him of his kingship
  preserved_meaning: Enslavement to sexual immorality is directly connected to the king's loss of rule.
  reasoning_layer_used: POB translation and source images
  rationale: The active construction preserves both the slavery and stripping images and their causal link.
- pob_phrase: as I myself also suffered
  simplified_phrase: I myself also suffered from such slavery
  preserved_meaning: Judah identifies himself with the suffering caused by enslavement to sexual immorality.
  reasoning_layer_used: POB translation and immediate context
  rationale: Repeating the slavery idea makes the comparison clear without implying that Judah lost a kingship.
interpretive_expansions:
- pob_phrase: as I myself also suffered
  rendering: I myself also suffered from such slavery
  claim: Judah's comparison points to enslavement to sexual immorality rather than claiming that he was a king who lost his throne.
  evidence:
