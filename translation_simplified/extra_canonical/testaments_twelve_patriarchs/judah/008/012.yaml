  text: And they said, "There has been no prostitute here, nor any stranger sitting by the gate." And I understood that I had sinned, and I did not make the matter known publicly, because I was ashamed.
translation:
  language: en
  text: They said, “There has been no prostitute here, nor has any woman from elsewhere been sitting by the gate.” Then I realized that I had sinned. But because I was ashamed, I did not speak about it publicly.
