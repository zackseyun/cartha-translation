  preserved_meaning: The practices separate people from the conduct required by God’s law.
  reasoning_layer_used: POB translation and Greek source payload
  rationale: “Lead people away” states the movement plainly while retaining the law-centered warning.
- pob_phrase: blind the inclination of the soul
  simplified_phrase: blind the soul’s judgment
  preserved_meaning: These things impair the soul’s inner capacity to discern and choose.
  reasoning_layer_used: POB translation and immediate clause context
  rationale: “Judgment” makes the difficult inner-faculty expression understandable without removing the blindness image.
- pob_phrase: do not allow one to have compassion on his neighbor
  simplified_phrase: keep people from showing compassion to their neighbors
  preserved_meaning: These things prevent compassionate treatment of other people.
  reasoning_layer_used: POB translation
  rationale: The active wording is natural modern English and preserves both restraint and compassion.
