  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/025.yaml
  text: And indeed I repented of these things; and wine and meat I did not consume until old age, and I saw no joy.
translation:
  language: en
  text: I truly repented of these things. I drank no wine and ate no meat until I was old, and I had no joy.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And indeed I repented of these things
  simplified_phrase: I truly repented of these things
  preserved_meaning: Judah emphasizes that his repentance was genuine.
  reasoning_layer_used: POB translation and Greek source payload
  rationale: “Truly” expresses the emphasis of “indeed” in natural English.
- pob_phrase: wine and meat I did not consume until old age
  simplified_phrase: I drank no wine and ate no meat until I was old
  preserved_meaning: He abstained from both wine and meat up to old age.
  reasoning_layer_used: POB translation and Greek source payload
  rationale: Ordinary verbs and word order make the abstinence immediately clear.
- pob_phrase: I saw no joy
  simplified_phrase: I had no joy
  preserved_meaning: He says that joy was absent from his experience.
  reasoning_layer_used: POB translation and Greek source payload
  rationale: “Had no joy” preserves the broad statement without the opaque sight idiom.
translation_notes:
  risk_flags:
  - risk: “Had no joy” may sound more absolute than a reference to festive enjoyment.
    mitigation: The wording retains POB’s broad meaning without narrowing the unspecified kind of joy.
