  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/030.yaml
  text: And he is hindered from offering sacrifices to God; and he does not remember blessing God; and when he hears a prophet speaking, he is offended and angered.
translation:
  language: en
  text: He is kept from offering sacrifices to God, and he forgets to praise God. When he hears a prophet speak, he becomes offended and angry.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: he is hindered from offering sacrifices to God
  simplified_phrase: He is kept from offering sacrifices to God
  preserved_meaning: An obstruction prevents him from presenting sacrifices to God.
  reasoning_layer_used: POB translation and Greek source
  rationale: “Kept from” expresses the hindrance in natural English.
- pob_phrase: he does not remember blessing God
  simplified_phrase: he forgets to praise God
  preserved_meaning: He fails to remember to honor God with praise.
  reasoning_layer_used: POB translation and immediate context
  rationale: “Praise God” makes the intended sense of blessing God clear.
- pob_phrase: when he hears a prophet speaking, he is offended and angered
  simplified_phrase: When he hears a prophet speak, he becomes offended and angry
  preserved_meaning: Hearing the prophet leads him to react with offense and anger.
  reasoning_layer_used: POB translation
  rationale: The wording preserves both his hearing and his hostile reaction without adding refusal.
translation_notes:
  risk_flags:
