  text: For I gave my staff, that is, the stay of my tribe; and my girdle, that is, my power; and my diadem, that is, the glory of my kingdom.
translation:
  language: en
  text: For I gave my staff, which represented the support of my tribe; my belt, which represented my power; and my crown, which represented the glory of my kingdom.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the stay of my tribe
  simplified_phrase: the support of my tribe
  preserved_meaning: The staff symbolizes what upholds and sustains Judah's tribe.
  reasoning_layer_used: source payload and POB translation
  rationale: “Support” clearly expresses the source image without the archaic noun “stay.”
- pob_phrase: my girdle
  simplified_phrase: my belt
  preserved_meaning: The object remains the symbol of Judah's power.
  reasoning_layer_used: source payload and POB translation
  rationale: “Belt” is the ordinary modern term for the same object.
- pob_phrase: my diadem
  simplified_phrase: my crown
  preserved_meaning: The royal headpiece still represents the glory of Judah's kingdom.
  reasoning_layer_used: source payload and POB translation
  rationale: “Crown” makes the royal image immediately understandable.
interpretive_expansions:
- pob_phrase: that is
  rendering: which represented
  claim: The three objects symbolize the realities named rather than being identical to them.
  evidence:
  - The Greek repeatedly explains each object with τουτέστι, meaning “that is.”
  - The POB pairs each concrete object with a communal or abstract reality.
  confidence: high
  alternatives_preserved:
  - that is
  - meaning
translation_notes:
  risk_flags:
  - risk: “Crown” is broader than the specific royal term “diadem.”
    mitigation: The phrase “glory of my kingdom” preserves the explicitly royal sense.
