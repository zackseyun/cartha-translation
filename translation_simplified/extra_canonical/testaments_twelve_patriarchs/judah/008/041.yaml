id: T12P.JUD.8.41
reference: Testament of Judah 8:41
language:
  code: en
  name: English
  variant: simplified modern common English
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  language: Greek
  note: Project verse 8:41 ('because of him the Lord will choose from you the kingship, and from Levi the priesthood, that the Lord may be for all the nations and the race of Israel') has no direct α-counterpart. The 'kingship from Judah, priesthood from Levi, Lord for all nations' theme is the project's homiletic synthesis of Charles XXII.2-3 ('ἕως τοῦ ἐλθεῖν τὸ σωτήριον τοῦ Ἰσραὴλ') and XXIV.6 ('κρῖναι καὶ σῶσαι πάντας τοὺς ἐπικαλουμένους τὸν Κύριον'), but α has no single verse that says what the project English says here. Source.text left empty per project policy of honesty to the α-witness.
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/041.yaml
  text: For because of him the Lord will choose from you the kingship, and from Levi the priesthood, that the Lord may be for all the nations and the race of Israel.
translation:
  language: en
  text: Because of him, the Lord will choose kings from among you and priests from Levi, so that the Lord may be for all nations and for the people of Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This sentence has no direct counterpart in the surviving Greek text; it summarizes related themes found elsewhere in the Testament of Judah.
    reason: source_note
simplification_decisions:
- pob_phrase: choose from you the kingship
  simplified_phrase: choose kings from among you
  preserved_meaning: The kingship comes from among Judah’s descendants.
  reasoning_layer_used: POB text and independent grounding review
  rationale: The concrete wording preserves both the royal office and its origin among Judah’s descendants.
- pob_phrase: from Levi the priesthood
  simplified_phrase: priests from Levi
  preserved_meaning: The priesthood comes from Levi.
  reasoning_layer_used: POB text and independent grounding review
  rationale: This keeps the parallel with the kings while expressing the office in ordinary English.
- pob_phrase: all the nations and the race of Israel
  simplified_phrase: all nations and the people of Israel
  preserved_meaning: The scope includes both the nations and Israel.
  reasoning_layer_used: POB text
  rationale: “People” avoids the misleading modern associations of “race.”
translation_notes:
  risk_flags:
  - risk: The sentence is a homiletic synthesis with no direct counterpart in the surviving Greek text.
    mitigation: The source footnote clearly identifies its status.
  - risk: The phrase “the Lord may be for” remains semantically open.
    mitigation: The main text retains the POB wording rather than imposing a narrower meaning.
