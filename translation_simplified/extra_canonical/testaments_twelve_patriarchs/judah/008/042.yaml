id: T12P.JUD.8.42
reference: Testament of Judah 8:42
language:
  code: en
  name: English
  variant: simplified modern common English
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ ἔγνωκα ὅσα κακὰ ποιήσετε ἐν [ταῖς ἐσχάταις ἡμέραις].'
  language: Greek
  note: Greek from Charles XVIII.1 (α). The project English's 'I have read in the books of Enoch the righteous' reflects the β-recension reading 'καίγε ἀνέγνων ἐν βίβλοις Ἐνὼχ τοῦ δικαίου' (Charles 1908 raw apparatus, p164 n.1); the α-text here has only 'Καὶ ἔγνωκα' ('And I have come to know'). The 'sons turning away from the Lord and committing every wickedness' is captured in α by 'ὅσα κακὰ ποιήσετε ἐν [ταῖς ἐσχάταις ἡμέραις]' (the bracketed clause is Charles' marked Christian interpolation, preserved per project policy). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/042.yaml
  text: And now I have commanded you these things, because I have read in the books of Enoch the righteous that your sons will turn away from the Lord, and will commit every wickedness and every affliction before the Lord.
translation:
  language: en
  text: 'That is why I have given you these commands: I read in the books of righteous Enoch[a] that your sons will turn away from the Lord. They will do every kind of evil and inflict every kind of suffering in the Lord’s sight.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Another Greek form reads, “And I have come to know,” without mentioning the books of Enoch.
    reason: textual_variant
simplification_decisions:
- pob_phrase: And now I have commanded you these things, because
  simplified_phrase: 'That is why I have given you these commands:'
  preserved_meaning: Judah’s commands are based on what he learned about his descendants’ future conduct.
  reasoning_layer_used: POB translation and discourse structure
  rationale: The causal link is recast in direct, natural English.
- pob_phrase: will commit every wickedness and every affliction
  simplified_phrase: will do every kind of evil and inflict every kind of suffering
  preserved_meaning: The sons will practice evil and cause suffering of every sort.
  reasoning_layer_used: POB controlling meaning
  rationale: Concrete verbs clarify the two distinct kinds of wrongdoing.
- pob_phrase: before the Lord
  simplified_phrase: in the Lord’s sight
  preserved_meaning: Their conduct takes place under the Lord’s awareness and judgment.
  reasoning_layer_used: POB source-language image
  rationale: The familiar English expression preserves the force of acting before God.
interpretive_expansions:
- pob_phrase: commit every affliction
  rendering: inflict every kind of suffering
  claim: The sons cause suffering rather than merely experience it.
  evidence:
  - POB coordinates affliction with wickedness as something the sons commit.
  confidence: moderate
  alternatives_preserved:
  - commit every kind of affliction
translation_notes:
  risk_flags:
  - risk: The POB follows the recension mentioning Enoch, while another Greek form only says, “I have come to know.”
    mitigation: The main text retains the POB choice and the footnote preserves the textual variation.
