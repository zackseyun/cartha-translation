  variant: simplified modern common English
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  language: Greek
  note: Project verse 8:40 ('be not lifted up over Levi, nor against me, but honor in full the Lord in both, and among men draw near to Levi') is a project paraphrase that consolidates the 'do not exalt yourselves' theme of Charles XXI.1 with the 'draw near' (προσεγγίζειν) language of XXI.5, plus an addition ('honor the Lord in both') with no direct α counterpart. The α-text proceeds at XXI.6 to 'Καὶ ἔσῃ ἐν αὐτοῖς ὡς ἡ θάλασσα...' rather than this exhortation. Source.text left empty per project policy of honesty to the α-witness.
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/040.yaml
  text: Therefore be not lifted up over Levi, nor against me, but honor in full the Lord in both, and among men draw near to Levi.
translation:
  language: en
  text: Therefore, do not put yourselves above Levi or oppose me. Give the Lord full honor in both, and among people draw near to Levi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This project verse combines themes from 21:1 and 21:5; the statement about honoring the Lord “in both” has no direct counterpart in the Greek alpha text.
    reason: source_note
simplification_decisions:
- pob_phrase: be not lifted up over Levi
  simplified_phrase: do not put yourselves above Levi
  preserved_meaning: They must not exalt themselves over Levi.
  reasoning_layer_used: POB text and source note on the “do not exalt yourselves” theme
  rationale: The rewrite expresses self-exaltation in ordinary English.
- pob_phrase: nor against me
  simplified_phrase: or oppose me
  preserved_meaning: They must not set themselves against the speaker.
  reasoning_layer_used: POB text
  rationale: “Oppose” states the implied action clearly without adding a motive.
- pob_phrase: among men draw near to Levi
  simplified_phrase: among people draw near to Levi
  preserved_meaning: In their public relations with people, they should draw near to Levi.
  reasoning_layer_used: POB text and source note on the Greek “draw near” language
  rationale: “People” is modern and inclusive while “draw near” preserves the source image.
translation_notes:
  risk_flags:
  - risk: The verse is a project paraphrase rather than a direct rendering of one continuous Greek passage.
    mitigation: The footnote identifies the combined themes and the clause lacking a direct Greek-alpha counterpart.
  - risk: The referents of “both” are not established by a direct Greek counterpart.
    mitigation: The main text preserves the POB’s ambiguity instead of naming the referents.
