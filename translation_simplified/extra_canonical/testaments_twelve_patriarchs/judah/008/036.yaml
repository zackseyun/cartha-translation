  text: Ἐμοὶ γὰρ ἔδωκεν ὁ Θεὸς τὴν βασιλείαν, κἀκείνῳ τὴν ἱερατείαν, καὶ ὑπέταξε τὴν βασιλείαν τῇ ἱερωσύνῃ.
  language: Greek
