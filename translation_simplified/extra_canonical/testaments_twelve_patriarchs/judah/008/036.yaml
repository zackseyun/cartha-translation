base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/036.yaml
  text: For to me the Lord gave the kingship, and to him the priesthood; and he set the kingdom under the priesthood.
translation:
  language: en
  text: The Lord gave me royal rule and gave him the priesthood. He placed the kingdom under the authority of the priesthood.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: gave the kingship
  simplified_phrase: gave me royal rule
  preserved_meaning: The speaker received royal office and rule from the Lord.
  reasoning_layer_used: POB translation and Greek source payload
  rationale: “Royal rule” explains kingship without reducing it to a mere ability.
- pob_phrase: and to him the priesthood
  simplified_phrase: and gave him the priesthood
  preserved_meaning: The other person received the priestly office from the Lord.
  reasoning_layer_used: POB translation and independent grounding review
  rationale: Repeating “gave” clarifies the parallel while retaining the institutional term.
- pob_phrase: set the kingdom under the priesthood
  simplified_phrase: placed the kingdom under the authority of the priesthood
  preserved_meaning: The kingdom was made subordinate to the priesthood.
  reasoning_layer_used: POB translation, Greek source payload, and grounding review
  rationale: “Under the authority” makes the relationship of subordination clear.
interpretive_expansions:
- pob_phrase: set the kingdom under the priesthood
  rendering: placed the kingdom under the authority of the priesthood
  claim: The kingdom is subordinate to priestly authority.
  evidence:
  - The POB explicitly places the kingdom under the priesthood.
  - The Greek verb ὑπέταξε expresses subordination.
  confidence: high
  alternatives_preserved:
  - The text does not explain how the priesthood exercises this authority.
translation_notes:
  risk_flags:
  - risk: “Royal rule” may emphasize the exercise of kingship more than the office itself.
    mitigation: The royal wording and parallel priesthood retain the distinction between the two offices.
