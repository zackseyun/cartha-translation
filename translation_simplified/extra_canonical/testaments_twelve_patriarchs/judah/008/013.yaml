source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: καὶ μεθ’ ἡμέρας τινὰς ἠκούσθη ὅτι Θαμὰρ ἐκπεπόρνευκε καὶ ἐν γαστρὶ ἔχει. Ἀκούσας δὲ ἐγὼ εἶπον· Ἐξαγάγετε αὐτὴν καὶ καυθήτω.
  language: Greek
  note: 'Greek from Charles XII α-replacement passage (Charles 1908 raw apparatus, p156): α omits XII.6-10 of β and substitutes an abbreviated LXX form of Gen 38.20, 24-30. The ''three months'' detail is from the Genesis tradition; α has ''μεθ'' ἡμέρας τινὰς'' (''after some days''). Project ch.8 is a thematic consolidation; sourced from Charles ch.XII α-replacement.'
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/013.yaml
  text: And after three months it was reported to me, "Tamar your daughter-in-law has played the prostitute, and behold, she is with child." And I, being without understanding in the arrogance of my anger, said, "Bring her out, and let her be burned."
translation:
  language: en
  text: Three months later, I was told, “Your daughter-in-law Tamar has acted as a prostitute and is pregnant.” In my pride and anger, I did not understand what had happened. I said, “Bring her out and let her be burned.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: it was reported to me
  simplified_phrase: I was told
  preserved_meaning: Judah received a report about Tamar.
  reasoning_layer_used: POB base text
  rationale: The active wording is more natural and keeps the same event.
- pob_phrase: has played the prostitute, and behold, she is with child
  simplified_phrase: has acted as a prostitute and is pregnant
  preserved_meaning: The report accuses Tamar of sexual immorality and says she has conceived.
  reasoning_layer_used: POB base text and Greek source payload
  rationale: Common modern terms replace biblical idioms without softening the accusation.
- pob_phrase: being without understanding in the arrogance of my anger
  simplified_phrase: In my pride and anger, I did not understand what had happened
  preserved_meaning: Judah admits that proud anger distorted his judgment.
  reasoning_layer_used: POB interpretive wording
  rationale: A direct sentence makes Judah’s self-condemnation easier to follow.
translation_notes:
  risk_flags:
