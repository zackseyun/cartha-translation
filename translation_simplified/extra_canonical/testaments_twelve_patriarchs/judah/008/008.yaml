source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  language: Greek
  note: Project verse 8:8 (the 'I will send you a kid from the flock... will you give me a pledge until you send it?' exchange) has no direct counterpart in the Charles α-text of XII.4, which collapses Tamar's question 'Τί μοι δώσεις;' directly into Judah handing over the pledges. The kid-from-the-flock question is drawn from the broader Genesis 38 tradition that informs the project English; α witnesses no Greek for this specific exchange. Source.text left empty per project policy of honesty to the α-witness.
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/008.yaml
  text: And I said, "I will send you a kid from the flock." And she said, "Will you give me a pledge until you send it?"
translation:
  language: en
  text: Judah said, “I will send you a young goat from the flock.” She replied, “Will you give me something as a guarantee until you send it?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This exchange has no direct counterpart in the surviving Greek text used for this edition. It follows the parallel account in Genesis 38:17.
    reason: source_note
simplification_decisions:
- pob_phrase: And I said
  simplified_phrase: Judah said
  preserved_meaning: Judah is the speaker.
  reasoning_layer_used: POB narrative context
  rationale: Naming Judah makes the speaker immediately clear.
- pob_phrase: a kid from the flock
  simplified_phrase: a young goat from the flock
  preserved_meaning: Judah promises to send a young goat from the flock.
  reasoning_layer_used: POB text and Genesis 38:17 parallel
  rationale: “Young goat” avoids the modern meaning of “kid” as a child.
- pob_phrase: give me a pledge
  simplified_phrase: give me something as a guarantee
  preserved_meaning: She asks for an item to secure Judah’s promise until he sends the goat.
  reasoning_layer_used: POB text and immediate dialogue
  rationale: The wording makes the transactional meaning of “pledge” clear.
