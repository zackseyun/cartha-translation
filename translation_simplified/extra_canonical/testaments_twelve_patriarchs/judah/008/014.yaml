id: T12P.JUD.8.14
reference: Testament of Judah 8:14
language:
  code: en
  name: English
  variant: simplified modern common English
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἡ δὲ ἀπέστειλε πρός με λέγουσα· Τοῦ ἀνθρώπου οὗτινος ταῦτά εἰσιν, ἐγὼ ἐν γαστρὶ ἔχω· ἐπίγνωθι οὖν τίνος ὁ δακτύλιος καὶ ἡ ῥάβδος καὶ τὸ διάδημα.
  language: Greek
  note: Greek from Charles XII α-replacement passage (Charles 1908 raw apparatus, p156). The α-replacement gives the order 'ring, staff, diadem' (δακτύλιος καὶ ἡ ῥάβδος καὶ τὸ διάδημα), rather than the project English's 'staff, girdle, diadem'; the girdle (ζώνη) belongs to β (XII.4) and to Judah's later interpretation in XV.3. Project ch.8 is a thematic consolidation; sourced from Charles ch.XII α-replacement.
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/014.yaml
  text: But as she was being brought out, she sent secretly to me the staff and the girdle and the diadem, saying, "By the man to whom these belong I am with child."
translation:
  language: en
  text: As they were taking her out, she secretly sent me a ring, a staff, and a diadem. She said, “I am pregnant by the man who owns these things.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: as she was being brought out
  simplified_phrase: As they were taking her out
  preserved_meaning: Other people were taking her away.
  reasoning_layer_used: POB base text
  rationale: The active wording is easier to follow while preserving the situation.
- pob_phrase: the staff and the girdle and the diadem
  simplified_phrase: a ring, a staff, and a diadem
  preserved_meaning: She sent three possessions that identified their owner.
  reasoning_layer_used: Greek source payload and independent grounding review
  rationale: The cited Greek names a ring rather than a girdle, so the corrected list follows the source.
- pob_phrase: By the man to whom these belong I am with child
  simplified_phrase: I am pregnant by the man who owns these things
  preserved_meaning: The owner of the objects is the father of her unborn child.
  reasoning_layer_used: POB base text
  rationale: Modern wording and sentence order communicate her claim directly.
translation_notes:
  risk_flags:
  - risk: The corrected list differs from the POB main text, which has a girdle instead of a ring.
    mitigation: The cited Greek source explicitly gives ring, staff, and diadem, with no lexical or theological reason to retain girdle.
  - risk: “Diadem” may be unfamiliar to some readers.
    mitigation: The distinctive identifying object is retained because a broader term could obscure its force.
