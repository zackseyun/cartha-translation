  text: And she, having learned that I was going up, adorned herself in bridal array and sat in the city Enaim by the gate. For it was a law of the Amorites that she who was about to marry should sit for seven days by the gate in fornication.
translation:
  language: en
  text: When she learned that I was going up, she dressed in bridal clothes and sat by the gate of the city of Enaim. The Amorites had a law that a woman about to marry had to sit by the gate for seven days and engage in sexual immorality.
