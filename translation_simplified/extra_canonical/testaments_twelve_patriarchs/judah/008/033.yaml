id: T12P.JUD.8.33
reference: Testament of Judah 8:33
language:
  code: en
  name: English
  variant: simplified modern common English
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ οἶδα ὅτι διὰ τὰ δύο ταῦτα ἔσται τὸ γένος μου *εἰς ἀπώλειαν πορνείας, καὶ καίγε σοφοὺς ἄνδρας τῶν υἱῶν μου ἀλλοιώσουσι, καὶ βασιλείαν Ἰούδα σμικρυνθῆναι ποιήσουσιν, ἣν ἔδωκέ μοι Κύριος ἐν ὑπακοῇ πατρός μου.'
  language: Greek
  note: 'Greek from Charles XVII.2 (α): the warning that the two vices (gold and beauty of women) will ruin Judah''s race. Project''s English at v33 is a parenetic exhortation that paraphrases this material together with the broader Canaanite-marriage warnings of Charles ch.XIV-XVII; closest α-anchor is XVII.2. Project ch.8 is a thematic consolidation; sourced from Charles ch.XVII.'
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/033.yaml
  text: Therefore, if you do not walk in sobriety in truth and in the fear of God, you will perish through every evil deed and every plague, if you take wives from the daughters of Canaan and are joined to their wealth, being led astray by gifts.
translation:
  language: en
  text: Therefore, live with self-control, truthfulness, and fear of God. If you marry women of Canaan, become attached to their wealth, and are led astray by gifts, you will perish through every evil deed and every plague.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: walk in sobriety in truth and in the fear of God
  simplified_phrase: live with self-control, truthfulness, and fear of God
  preserved_meaning: The readers must live with moral restraint, truth, and reverence toward God.
  reasoning_layer_used: POB controlling text
  rationale: The walking idiom is recast as a direct description of how to live.
- pob_phrase: are joined to their wealth
  simplified_phrase: become attached to their wealth
  preserved_meaning: Marriage to Canaanite women also binds the readers to their wealth.
  reasoning_layer_used: POB controlling text and source note
  rationale: The wording clearly expresses economic attachment while keeping it distinct from marriage.
- pob_phrase: you will perish through every evil deed and every plague
  simplified_phrase: you will perish through every evil deed and every plague
  preserved_meaning: The comprehensive warning retains the POB's framing of how the readers will perish.
  reasoning_layer_used: POB controlling text and grounding review
  rationale: Retaining this wording avoids turning evil deeds and plagues into autonomous agents of destruction.
