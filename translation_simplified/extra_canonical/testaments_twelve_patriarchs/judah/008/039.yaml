id: T12P.JUD.8.39
reference: Testament of Judah 8:39
language:
  code: en
  name: English
  variant: simplified modern common English
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ὁ γὰρ ἄγγελος Κυρίου εἶπέ μοι· Αὐτὸν ὑπὲρ σὲ ἐξελέξατο Κύριος προσεγγίζειν αὐτῷ, καὶ ἐσθίειν τὴν τράπεζαν αὐτοῦ, καὶ ἀπαρχὰς αὐτῷ προσφέρειν ἐντρυφημάτων υἱῶν Ἰσραήλ. *Σὺ δὲ ἔσῃ βασιλεὺς Ἰακὼβ.
  language: Greek
  note: Greek from Charles XXI.5 (α). The project English's closing simile 'as a lion' (ὡς λέων) does not appear in α here; α has only 'βασιλεὺς Ἰακὼβ' ('king of Jacob'). The lion image draws on the broader testamentary tradition (cf. apocalyptic 'lion' imagery in ch.XXIV-XXV). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/039.yaml
  text: For the angel of the Lord said to me, "The Lord chose Levi before you, to be near him, and for you to be king with him, as a lion."
translation:
  language: en
  text: For the angel of the Lord told me, “The Lord chose Levi ahead of you to serve near him. You will be king with him, like a lion.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: said to me
  simplified_phrase: told me
  preserved_meaning: The angel directly communicated the message to Judah.
  reasoning_layer_used: POB translation
  rationale: “Told me” expresses the same speech naturally in modern English.
- pob_phrase: chose Levi before you, to be near him
  simplified_phrase: chose Levi ahead of you to serve near him
  preserved_meaning: Levi was given priority for service in the Lord’s presence.
  reasoning_layer_used: POB translation and Greek source context
  rationale: “Ahead of you” clarifies priority, while “serve near him” explains Levi’s appointed role.
- pob_phrase: for you to be king with him, as a lion
  simplified_phrase: You will be king with him, like a lion
  preserved_meaning: Judah receives the royal role and lion comparison without resolving the pronoun’s referent.
  reasoning_layer_used: POB translation
  rationale: A separate future statement is easier to follow and adds no adversative contrast.
interpretive_expansions:
- pob_phrase: to be near him
  rendering: to serve near him
  claim: Levi’s nearness describes an appointed service role, not merely physical proximity.
  evidence:
  - The source context links nearness with eating at the Lord’s table and presenting firstfruits.
  confidence: high
  alternatives_preserved:
  - to be near him
translation_notes:
  risk_flags:
  - risk: The Greek α source ends with “king of Jacob” and lacks both “with him” and the lion image.
    mitigation: The main text follows the controlling POB and preserves its royal wording and lion comparison.
  - risk: The referent of “him” in the royal clause is unclear.
    mitigation: The pronoun remains unresolved rather than being replaced with a specific name.
