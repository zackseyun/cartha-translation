  simplified_phrase: is a slave to two opposing passions
  preserved_meaning: The two conflicting passions hold him in bondage.
  reasoning_layer_used: POB translation and Greek slavery image
  rationale: The wording is more direct while preserving the force of slavery.
- pob_phrase: because they have blinded his soul and he walks in the day as in the night
  simplified_phrase: They have blinded his soul ... Even in daylight, he walks as though it were night.
  preserved_meaning: Spiritual blindness leaves him unable to find his way despite outward light.
  reasoning_layer_used: POB translation and source image
  rationale: Separate sentences make the cause and vivid day-night contrast easier to follow.
translation_notes:
  risk_flags:
