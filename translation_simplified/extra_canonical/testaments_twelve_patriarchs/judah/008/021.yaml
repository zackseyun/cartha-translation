  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/021.yaml
  text: 'And this is the discretion in drinking wine: if a man drinks wine and keeps modesty, and if he does not go astray into shamelessness, he may drink wine.'
translation:
  language: en
  text: 'This is the proper way to drink wine: a man may drink as long as he behaves modestly and does not become shameless.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: this is the discretion in drinking wine
  simplified_phrase: This is the proper way to drink wine
  preserved_meaning: Drinking wine is governed by a moral standard of good judgment.
  reasoning_layer_used: POB controlling translation and Greek source payload
  rationale: “Proper way” expresses the difficult noun “discretion” in ordinary English.
- pob_phrase: if a man drinks wine and keeps modesty
  simplified_phrase: a man may drink as long as he behaves modestly
  preserved_meaning: Permission to drink continues only while modest conduct remains.
  reasoning_layer_used: POB controlling translation and Greek conditional wording
  rationale: The time-bound condition is recast as a direct and natural English limit.
- pob_phrase: if he does not go astray into shamelessness
  simplified_phrase: and does not become shameless
  preserved_meaning: The drinker must not cross from modesty into shameless behavior.
  reasoning_layer_used: POB controlling translation
  rationale: The compressed wording preserves the moral contrast without the opaque phrase “go astray into.”
translation_notes:
