  text: Ἔπεμψα τοῦ λαβεῖν τοὺς ἀρραβῶνας. Καὶ οὐχ εὗρον αὐτήν,
  language: Greek
  note: Greek from Charles XII α-replacement passage (the abbreviated LXX-Gen 38.20-30 form that α substitutes for XII.6-10; preserved in Charles 1908 raw apparatus, p156). Project's English 'asked the people of the place' has no α counterpart and is drawn from the Genesis tradition. Project ch.8 is a thematic consolidation; sourced from Charles ch.XII α-replacement.
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/011.yaml
  text: And after this I sent the kid, but I did not find her. And I asked the people of the place, saying, "Where is the woman who sat at Enaim by the road?"
translation:
  language: en
  text: Afterward, I sent the young goat as payment, but I could not find her. I asked the local people, “Where is the woman who was sitting beside the road at Enaim?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek replacement passage says only, “I sent to get the pledges, but I did not find her.” The fuller wording here follows the Genesis tradition preserved in the POB.
    reason: source_note
simplification_decisions:
- pob_phrase: And after this
  simplified_phrase: Afterward
  preserved_meaning: The action happened after the preceding events.
  reasoning_layer_used: POB translation
  rationale: One common word expresses the sequence naturally.
- pob_phrase: I did not find her
  simplified_phrase: I could not find her
  preserved_meaning: Judah reports that his attempt to locate the woman failed.
  reasoning_layer_used: POB translation and grounding review
  rationale: The revision keeps the first-person report without implying that no one could find her.
- pob_phrase: the people of the place
  simplified_phrase: the local people
  preserved_meaning: Judah questioned people who lived in that area.
  reasoning_layer_used: POB translation
  rationale: “Local people” is the ordinary modern equivalent.
interpretive_expansions:
- pob_phrase: sent the kid
  rendering: sent the young goat as payment
  claim: The young goat was sent to settle what Judah had promised the woman.
  evidence:
  - The POB says Judah sent the kid while searching for the woman.
  - The source note connects the fuller account with the Genesis 38 tradition involving pledged items.
  confidence: high
  alternatives_preserved:
  - sent the young goat
