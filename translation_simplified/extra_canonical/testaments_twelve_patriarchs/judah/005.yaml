translation:
  language: en
  text: 1. The next day we went to Areta, a city that was still mighty and strong and threatened to kill us. 2. Gad and I attacked from the east side of the city, while Reuben and Levi attacked from the west. 3. The defenders on the wall thought we were alone, so they moved out toward us. 4. Meanwhile, my brothers secretly climbed the wall from both sides using stakes.[a] They entered the city without the defenders knowing. 5. We captured the city by the edge of the sword. We burned those who had taken refuge in the towers,[b] and we captured everyone. 6. As we were leaving, men from Thapphoue attacked our captives. We handed the captives over to our sons and fought the attackers all the way to Thapphoue.[c] 7. We killed them too and burned the city with everything in it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some witnesses only say that the brothers entered from both sides; others mention stakes or pegs used to climb the wall.
    reason: textual_variant
  - marker: b
    text: Some witnesses refer to a tower, while others say that people fled for refuge to the wall or towers.
    reason: textual_variant
  - marker: c
    text: Another witness gives the place-name as Bathoue rather than Thapphoue.
    reason: textual_variant
simplification_decisions:
- pob_phrase: threatening us with death
  simplified_phrase: threatened to kill us
  preserved_meaning: Areta posed a direct and deadly threat.
  reasoning_layer_used: POB lexical decision for ἀπειλοῦσαν ἡμῖν θάνατον
  rationale: The direct verb phrase states the same hostile threat in common English.
- pob_phrase: those on the wall, thinking that we were alone, were drawn out toward us
  simplified_phrase: The defenders on the wall thought we were alone, so they moved out toward us
  preserved_meaning: The defenders' mistaken assumption caused their tactical movement away from the wall.
  reasoning_layer_used: POB lexical decisions for νομίσαντες and ἐφελκύσθησαν
  rationale: The cause and movement are made clear without claiming who deliberately lured them.
- pob_phrase: men of Thapphoue fell upon our captives; and after handing them over to our sons, we joined battle with them as far as Thapphoue
  simplified_phrase: men from Thapphoue attacked our captives. We handed the captives over to our sons and fought the attackers all the way to Thapphoue
  preserved_meaning: The captives were secured with the sons before the battle continued to Thapphoue.
  reasoning_layer_used: POB theological decision on verse 6 and lexical decision for συνήψαμεν
  rationale: The clearer wording resolves difficult pronouns while retaining the attack, transfer, battle, and destination.
translation_notes:
  risk_flags:
  - risk: The fuller account of climbing with stakes is textually uncertain.
    mitigation: The main text follows the POB choice while footnote a preserves the shorter reading.
  - risk: Simplifying “were drawn out” could imply voluntary movement rather than tactical enticement.
    mitigation: “Moved out toward us” preserves the direction while avoiding an unsupported agent.
