translation:
  language: en
  text: '1. The next day, we were told that the king of Gaas was coming to attack us with a large force.


    2. So Dan and I posed as Amorites who were their allies, and we entered their city.


    3. Late that night, our brothers arrived. We opened the gates for them, and we destroyed everyone there and everything they had. After taking all their possessions, we tore down the city''s three walls.


    4. Then we approached Thamna, where all their supplies and equipment were stored.


    5. They insulted me, and I became angry. I charged up toward the summit, while they kept hurling stones and shooting arrows at me.


    6. If my brother Dan had not fought beside me—'
