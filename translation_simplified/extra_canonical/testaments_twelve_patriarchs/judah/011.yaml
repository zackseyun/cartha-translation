translation:
  language: en
  text: 1 I knew that the Canaanite people were evil,[a] but my youthful impulses blinded my judgment. 2 When I saw her pouring wine, I was deceived, and I took her,[b] though my father had given no advice about it.[c] 3 While I was away, she arranged for Shelah to marry a woman from Canaan. 4 When I learned what she had done, I cursed her with anguish in my soul. 5 In fact, she died in her wickedness, together with her children.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Canaanite people” refers to an ancient people-group or family line, not a modern biological category.
    reason: simplification_note
  - marker: b
    text: “I took her” likely means that he took her as his wife, but the Greek is abrupt.
    reason: lexical_alternative
  - marker: c
    text: This may also mean that he acted without his father Jacob’s advice or approval.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: the race of the Canaanites was evil
  simplified_phrase: the Canaanite people were evil
  preserved_meaning: The text still makes the same collective moral judgment about the ancient Canaanite kin-group.
  reasoning_layer_used: Lexical and theological decisions on πονηρὸν γένος
  rationale: “People” avoids a misleading modern sense of race without softening the source’s sweeping claim.
- pob_phrase: the impulse of youth blinded my understanding
  simplified_phrase: my youthful impulses blinded my judgment
  preserved_meaning: Judah’s rash youthful desires prevented sound moral understanding.
  reasoning_layer_used: Lexical decisions on διαβούλιον τῆς νεότητος and ἐτύφλωσε τὴν διάνοιάν μου
  rationale: The revision uses ordinary English while keeping the image of blindness.
- pob_phrase: took for Shelah a wife
  simplified_phrase: arranged for Shelah to marry a woman
  preserved_meaning: She obtained or arranged a wife for Shelah.
  reasoning_layer_used: Lexical decision on ἔλαβε τῷ Σηλὼμ γυναῖκα
  rationale: The patriarchal idiom is recast as the action it describes.
