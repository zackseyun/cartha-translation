translation:
  language: en
  text: 'Now, my children, I command you: listen to me, Judah your father. Hold on to my words. Set your minds on doing everything the Lord requires—the things that are right—and on obeying God’s commands.


    I boasted that no beautiful woman had deceived me, even in wartime. I also condemned my brother Reuben over Bilhah, our father’s wife. Because of this, the spirit of jealousy and sexual immorality rose against me like an army, until I sinned with Anan the Canaanite woman[a] and with Tamar, my daughter-in-law.


    I had said to my father-in-law, “I will consult my father, and then I will marry your daughter.” But he would not agree. Instead, he displayed a vast amount of gold in connection with the proposed marriage[b], for he was a king. He adorned his daughter with gold and pearls and had her pour wine for us at the banquet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek witness here names her Anan; some interpreters connect this with Judah’s Canaanite marriage in Genesis 38.
    reason: alternative_reading
  - marker: b
    text: The Greek phrase is difficult; it links the displayed wealth with the daughter or proposed marriage but does not clearly identify it as a dowry.
    reason: lexical_alternative
