  preserved_meaning: Judah commands his children to retain his teaching and fulfill the Lord’s righteous requirements.
  reasoning_layer_used: Lexical decisions for φυλάξασθε and δικαιώματα
  rationale: Two direct sentences and a brief clarification make the exhortation clear while preserving its moral force.
- pob_phrase: the spirit of jealousy and of sexual immorality arrayed themselves against me
  simplified_phrase: the spirit of jealousy and sexual immorality rose against me like an army
  preserved_meaning: Personified vice acts as a hostile force against Judah.
  reasoning_layer_used: Theological decision on personified vice language
  rationale: The army comparison makes the source’s military image immediately understandable.
- pob_phrase: an immeasurable abundance of gold
  simplified_phrase: a vast amount of gold
  preserved_meaning: The king displayed an extraordinarily large quantity of gold.
  reasoning_layer_used: Lexical decision for χρυσοῦ πλῆθος ἄπειρον
  rationale: Common wording preserves the phrase’s hyperbolic scale.
