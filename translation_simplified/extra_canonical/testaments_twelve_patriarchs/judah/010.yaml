translation:
  language: en
  text: After this,[a] my son Er married Tamar, a daughter of Aram from Mesopotamia. Er was wicked, and an angel of the Lord killed him. Then I gave Tamar to my second son, Onan, and the Lord struck him down too. Onan had refused to have sexual relations with her because of his mother’s scheming, for he did not want to have children by Tamar. During the wedding period, I gave Onan to Tamar as a husband. As the brother of her dead husband, he was responsible for continuing his brother’s family line through her.[b] But Onan also acted wickedly. Though he was with her for a year, he would not have sexual relations with her. When I threatened him, he did have relations with her, but he wasted his seed on the ground, as his mother had commanded. So he too died in wickedness. I also wanted to give Shelah to Tamar, but his mother would not allow it. She acted wickedly because Tamar was not one of the daughters of Canaan, as she herself was.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some Greek witnesses differ in small details about the timing and sequence of Er’s death and Onan’s marriage to Tamar.
    reason: textual_variant
  - marker: b
    text: This duty is often called levirate marriage; compare Genesis 38.
    reason: cultural_note
