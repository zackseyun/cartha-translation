translation:
  language: en
  text: '1. Afterward, Abraham, Isaac, and Jacob will rise to life. My brothers and I will lead the tribes of Israel in this order: Levi first, I second, Joseph third, Benjamin fourth, Simeon fifth, Issachar sixth, and then all the others in order.


    2. The Lord blessed Levi, but the angel of the presence blessed me. The powers of glory blessed Simeon; heaven blessed Reuben; the earth blessed Issachar; the sea blessed Zebulun; the mountains blessed Joseph; the tent blessed Benjamin; the lights blessed Dan; delight blessed Naphtali; the sun blessed Gad; and the moon blessed Asher.


    3. You will be the Lord’s people, and you will all speak one language. Belial’s deceptive spirit will no longer be there, because it will be thrown into the fire forever.


    4. Those who died in sorrow will rise in joy. Those who were poor for the Lord’s sake will be made rich, and those who die for the Lord’s sake will awaken to life.


    5. Joseph’s deer will run with great joy, and Israel’s eagles will soar with joy. All peoples will glorify the Lord forever.'
