translation:
  language: en
  text: 'And now, my children, I command you: Love Levi so that you may remain. Do not raise yourselves above him, or you may be completely destroyed. God gave the kingship to me and the priesthood to him. He placed the kingship under the priesthood. He gave me the things on earth, but he gave Levi the things in the heavens. In this way, God’s priesthood stands above earthly kingship—unless, through sin, it falls away from the Lord and comes under the rule of an earthly kingdom.


    The angel of the Lord told me, “The Lord chose Levi above you to draw near to him, eat at his table, and offer him the firstfruits of Israel’s good things.[c] But you will be king over Jacob. Among them you will be like the sea. In the sea, righteous people are tossed by storms. Some are taken captive, while others grow rich. In the same way, people of every kind will be found in you. Some will be in danger and taken captive, while others will grow rich by seizing what belongs to others.


    “The kings will be like sea monsters that swallow people as if they were fish. They will enslave the sons and daughters of free people. They will seize houses, fields, flocks, and wealth. They will unjustly leave the flesh of many people for ravens and ibises to eat.[b] They will advance in evil and be lifted up by greed. And there will be false prophets like storms—”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The surviving Greek text used here breaks off at this point, so the translation also ends here.
    reason: textual_variant
  - marker: b
    text: “Ibises” follows the Greek; together with ravens, they are pictured as birds feeding on the dead.
    reason: lexical_alternative
  - marker: c
    text: Firstfruits were the first portions offered to God; this phrase may refer to choice produce or other rich first offerings brought from Israel.
    reason: cultural_note
