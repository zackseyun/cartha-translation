translation:
  language: en
  text: 'For eighteen years my father lived at peace with his brother Esau. Esau’s sons stayed with us after we returned from Laban in Mesopotamia.


    2 When those eighteen years had passed, Esau, my father’s brother, came against us with a heavy and powerful army.


    3 Jacob shot Esau with his bow and killed him. Esau died on Mount Seir.


    4 We pursued Esau’s sons to their fortified city, but we could not get inside. So we surrounded the city and laid siege to it.


    5 They still had not opened the gates after twenty days. Though they were watching, I brought a ladder to the wall. I held my shield over my head to protect myself from the stones they threw, climbed up, and killed four of their mighty warriors.


    6 Reuben and Gad killed six more. Then they went in one after another.


    7 The people asked us for terms of peace. After consulting our father, we accepted their request.


    8 Until the famine, they gave us five hundred large measures of wheat, five hundred measures of oil, and five hundred measures of wine. Then we went down to Egypt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The wheat was measured in cors, an ancient unit for large quantities of dry goods.
    reason: cultural_note
