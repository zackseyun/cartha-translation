  simplified_phrase: will last forever and never pass away
  preserved_meaning: His kingdom is eternal and will never end.
  reasoning_layer_used: POB translation and applied revision
  rationale: The simpler wording preserves both emphatic statements about the kingdom’s permanence.
- pob_phrase: is brought to completion
  simplified_phrase: is coming to an end
  preserved_meaning: Joseph’s kingdom is reaching its conclusion in contrast to the everlasting kingdom.
  reasoning_layer_used: Greek source, POB contrast, and applied revision
  rationale: The context shows that completion here means reaching an end rather than achieving perfection.
- pob_phrase: a watchman’s hut in an orchard
  simplified_phrase: a watchman’s shelter in an orchard
  preserved_meaning: The seasonal orchard structure remains the concrete image of something temporary.
  reasoning_layer_used: POB translation and Greek image
  rationale: Shelter is more immediately understandable while retaining the watchman and orchard image.
