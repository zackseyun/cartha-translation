  rationale: The verbal form is more direct and natural in common English.
- pob_phrase: execute your vengeance
  simplified_phrase: avenge the wrongs done to you
  preserved_meaning: God will act in justice on behalf of the oppressed people.
  reasoning_layer_used: POB translation and revision rationale for ἐκδίκησιν
  rationale: The rewrite avoids an opaque expression while retaining divine judgment on their behalf.
- pob_phrase: bring you into the promises of your fathers
  simplified_phrase: bring you into the fulfillment of the promises made to your fathers
  preserved_meaning: God will bring the people to experience what their fathers had been promised.
