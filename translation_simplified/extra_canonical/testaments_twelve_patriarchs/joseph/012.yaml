  preserved_meaning: The merchant gave Joseph responsibility for managing his household.
  reasoning_layer_used: POB lexical decision for ἐπίστευσέ μοι τὸν οἶκον αὐτοῦ
  rationale: This states the stewardship sense in ordinary English.
- pob_phrase: God blessed him in my hands, and increased him on my account
  simplified_phrase: God blessed the merchant through me. Because of me, the merchant’s ... increased.
  preserved_meaning: God prospered the merchant through Joseph’s agency and administration.
  reasoning_layer_used: POB lexical decisions for ἐν χειρί μου and ἔργῳ
  rationale: Two direct sentences clarify Joseph’s agency while preserving the image’s force.
- pob_phrase: execute judgment concerning him
  simplified_phrase: make a legal ruling about him
  preserved_meaning: Pentephri’s wife asks for formal action concerning Joseph’s legal status.
  reasoning_layer_used: POB lexical decision for κρίσιν
  rationale: This preserves the judicial force in familiar language.
