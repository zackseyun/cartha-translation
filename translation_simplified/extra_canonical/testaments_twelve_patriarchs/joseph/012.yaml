translation:
  language: en
  text: '11:3 The leader among them said to me, “You are not a slave. Your appearance makes that clear.” But I insisted that I was their slave. 4 When we arrived in Egypt, they argued over me—over who would deceive the merchant and get money for me.[a] 5 They all agreed to leave me in Egypt with the merchant they did business with until they returned with goods. 6 But the Lord caused the merchant to look on me with favor, and he put his household in my care. 7 God blessed the merchant through me. Because of me, the merchant’s gold, silver, and work increased.[b] 8 I stayed with him for three months.


    12:1 At that time Pentephri’s wife[c] came down to Memphis in great splendor, because her eunuchs had told her about me. 2 She said to her husband, “The merchant has grown rich through the work of a certain young Hebrew. They say that this young man was outright stolen from the land of Canaan. 3 So make a legal ruling about him and bring him into our household. Then the God of the Hebrews will bless you, because grace from heaven rests on this young man.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek is difficult here and may preserve a compressed or damaged account of Joseph’s sale.
    reason: textual_variant
  - marker: b
    text: The final Greek term may mean work, produce, or business.
    reason: lexical_alternative
  - marker: c
    text: Pentephri is the Greek form of an Egyptian name associated with Potiphar’s household in Genesis traditions.
    reason: cross_reference
