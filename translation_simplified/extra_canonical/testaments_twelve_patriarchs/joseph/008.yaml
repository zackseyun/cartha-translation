translation:
  language: en
  text: '6. She said to me, “Now I see that you love me. That is enough for me. Just take responsibility for my life and my children, and then I can hope to obtain what I desire.” 7. But she did not know that I had spoken as I did because of my Lord, not because of her. 8. When people fall under the power of lust and become enslaved to it, as she did, they interpret even good words through that passion and make them serve their evil desire.


    1. So, my children, she left me at about noon. I knelt before the Lord and prayed all that day and all that night. Near dawn I rose, weeping and asking him to deliver me from her. 2. At last she seized my clothes with evil intent and tried to drag me by force into sexual intercourse. 3. When I saw that she was in a frenzy and had hold of my tunic, I left it behind and fled naked. 4. She took hold of the tunic and falsely accused me. When her husband came, he put me in a prison in his house. The next day he had me whipped and sent me to Pharaoh’s dungeon. 5. While I was in chains, the Egyptian woman was overcome with grief.'
  philosophy: optimal-equivalence
