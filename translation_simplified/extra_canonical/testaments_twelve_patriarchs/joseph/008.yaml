  reasoning_layer_used: Lexical and theological decisions on desire
  rationale: Common wording preserves the warning that lust controls both the person and perception.
- pob_phrase: it was about the sixth hour
  simplified_phrase: she left me at about noon
  preserved_meaning: The ancient daylight reckoning points to approximately midday.
  reasoning_layer_used: Source context and the rule for historical time expressions
  rationale: Modern time language removes an opaque ancient reference.
- pob_phrase: slandered me; and when her husband came, he cast me into prison in his house, and on the next day, after scourging me
  simplified_phrase: falsely accused me. When her husband came, he put me in a prison in his house. The next day he had me whipped
  preserved_meaning: She made a malicious false charge, and Joseph was confined and physically punished.
  reasoning_layer_used: Lexical decisions and narrative syntax
  rationale: Short sentences and familiar terms make the sequence clear.
