simplification_decisions:
- pob_phrase: came near and asked me, saying
  simplified_phrase: came up to me and asked
  preserved_meaning: They approached Joseph and made a request.
  reasoning_layer_used: POB text and independent grounding review
  rationale: This removes the awkward speech formula without adding emotional intensity.
- pob_phrase: you were bought by us with silver
  simplified_phrase: we bought you with silver
  preserved_meaning: They want Joseph to claim that they paid silver to acquire him.
  reasoning_layer_used: POB text and applied revision
  rationale: The active form is easier to follow while retaining silver as the means of payment.
- pob_phrase: he will release us
  simplified_phrase: he will let us go
  preserved_meaning: They expect the man’s action to result in their freedom.
  reasoning_layer_used: POB text and applied revision
  rationale: The common phrase “let us go” clearly preserves the future release.
translation_notes:
