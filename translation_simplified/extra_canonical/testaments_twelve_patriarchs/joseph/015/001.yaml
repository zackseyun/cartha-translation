translation:
  language: en
  text: She wanted to look at me with sinful desire, but I did not know what was happening. Then he told her, “Egyptians do not take what belongs to someone else before there is proof.” He said this about the merchant. But the boy should remain in custody.
  philosophy: optimal-equivalence
