translation:
  language: en
  text: '1. So if you also live by the Lord’s commandments, God will raise you up in good things forever.


    2. If anyone wants to harm you, respond by doing good and pray for that person. The Lord will rescue you from every evil.


    3. You know from my own life that because of my humility and patient endurance, I married the daughter of the priest of Heliopolis. Along with her, I was given a hundred talents—a vast amount—of gold, and my Lord put them under my authority.


    4. Even so—[a]'
