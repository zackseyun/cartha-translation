translation:
  language: en
  text: 'This man,[a] Pharaoh’s chief cook, trusted me to manage his household. I resisted a shameless woman who kept pressuring me to do wrong with her. But the God of my father rescued me from a burning flame.[b]


    I was put in prison, beaten, and mocked. Yet the Lord caused the jailer to treat me with compassion. The Lord does not abandon those who fear him—not in darkness, chains, suffering, or distress.


    God does not feel shame as people do or become afraid as a human being does. Unlike those born from the earth, he does not grow weak or become terrified. Through all these troubles, he takes the lead[c] and brings comfort in many ways.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek title literally refers to a chief cook, though some understand it as a broader court office.
    reason: lexical_alternative
  - marker: b
    text: The burning flame is probably an image for the consuming danger of sexual temptation.
    reason: lexical_alternative
  - marker: c
    text: The Greek may also mean that God stands over us or stands by us with protective care.
    reason: alternative_reading
