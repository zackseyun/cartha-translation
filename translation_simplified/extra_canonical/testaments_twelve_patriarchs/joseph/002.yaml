  preserved_meaning: No form of severe hardship causes the Lord to abandon those who fear him.
  reasoning_layer_used: POB lexical decisions for δεσμοῖς, θλίψεσιν, and ἀνάγκαις
  rationale: The concrete image of chains remains while the less familiar “afflictions” becomes “suffering.”
