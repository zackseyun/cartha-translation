translation:
  language: en
  text: '4. She wanted to look at me with sinful desire, but I knew nothing about any of this.


    5. I said to her, “It is not the custom among the Egyptians to take another person’s property before proof is given.”


    6. That is what I said about the exchange. But the boy must remain locked up.


    1. Twenty-four days later, the Ishmaelites came. They had heard that my father Jacob was mourning deeply for me. When they arrived, they said to me,


    2. “Why did you say you were a slave? We have learned that you are the son of a great man in the land of Canaan. Your father is still mourning for you in sackcloth and ashes.”


    3. When I heard this, I felt torn apart inside, and my heart melted. I wanted desperately to weep, but I held myself back so that I would not bring shame on my brothers. I told them, “I do not know. I am a slave.”


    4. Then they decided to sell me so that I would not be found in their possession.


    5. They were afraid that my father might come against them and take terrible vengeance on them. They had heard that he was a great man in the sight of God and people.


    6. Then the trader said to them, “Free me from Potiphar’s judgment.”


    7. So they came to me and asked, “Say that we bought you with silver, and Potiphar will release us.”'
