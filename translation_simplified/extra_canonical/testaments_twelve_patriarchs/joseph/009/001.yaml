  text: While I was in chains, the Egyptian woman was gripped by grief. Whenever she came, she listened to me as I thanked the Lord and sang hymns in the prison—the house of darkness. With a cheerful voice, I rejoiced and praised my God, because by a pretext I had been delivered from the Egyptian woman.
