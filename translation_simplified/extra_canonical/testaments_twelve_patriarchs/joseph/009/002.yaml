  simplified_phrase: Agree to satisfy my desire
  preserved_meaning: She asks Joseph to consent to her desire while the proposal remains indirect.
  reasoning_layer_used: POB controlling translation and immediate context
  rationale: Common verbs replace formal wording without making the proposal more explicit.
- pob_phrase: I did not turn even in thought toward her
  simplified_phrase: I did not even think of giving in to her
  preserved_meaning: Joseph refused to yield to her even inwardly.
  reasoning_layer_used: POB controlling translation and immediate context
  rationale: The implicit sense of the turning image is stated in natural English.
- pob_phrase: the one who, as a king in storerooms, lives in luxury with lawlessness
  simplified_phrase: a king who lives in luxury among storerooms and does what is wrong
  preserved_meaning: Royal luxury accompanied by immoral conduct is contrasted with faithful restraint in confinement.
  reasoning_layer_used: POB controlling translation and source imagery
  rationale: The storeroom image remains without specifying its contents, and lawlessness becomes plain English.
