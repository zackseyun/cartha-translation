  rendering: I did not even think of giving in to her
  claim: Turning toward her in thought means considering yielding to her proposal.
  evidence:
  - The preceding proposal supplies the object of Joseph's inward refusal.
  - The POB's phrase “even in thought” locates the refusal in his thinking.
