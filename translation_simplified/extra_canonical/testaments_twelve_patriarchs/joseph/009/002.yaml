translation:
  language: en
  text: 'Many times she sent me this message: “Agree to satisfy my desire, and I will release you from your chains and free you from this darkness.” But I did not even think of giving in to her. For God loves someone who remains faithful and self-controlled in a dark pit more than a king who lives in luxury among storerooms and does what is wrong.'
