translation:
  language: en
  text: '9. When I understood what was happening, I was distressed to the point of death. After she left, I regained my composure. For many days I mourned over her, because I recognized her deceit and delusion.


    10. I spoke to her words from the Most High, hoping that she might turn away from her evil desire.


    11. She often flattered me by speaking as though I were a holy man. In front of her husband, she deceitfully praised my self-control, while hoping to trip me up when we were alone.


    12. She openly praised me as pure in matters of the marriage bed. But in secret she told me, “Do not be afraid of my husband. He is convinced that you are pure. Even if someone tells him about us, he will not believe it.”


    13. Throughout all this, I lay low on the ground and kept begging the God of my fathers[a] to rescue me from her deceit.


    14. When this approach failed, she came to me again, now asking to be taught the word of God.


    15. She said, “If you want me to abandon the idols, I will persuade my husband to turn away from them. Then we will go before your Lord and walk according to the law of your Lord.”[b]


    16. But I told her, “The Lord does not want those who worship him to live in impurity, nor does he delight in adulterers. He delights in those who draw near to him with pure hearts and undefiled lips.”


    17. But she kept arguing with me because she wanted to fulfill her desire.


    18. So I added fasting to prayer, asking the Lord to rescue me from her.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek text is difficult here; “God” may be the shorter reading, but “the God of my fathers” fits the patriarchal setting.
    reason: textual_variant
  - marker: b
    text: “Walk according to the law of your Lord” may be a fuller expansion preserved in part of the Greek tradition.
    reason: textual_variant
