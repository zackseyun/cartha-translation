  text: How many times the Egyptian woman threatened to kill me! Time after time, she handed me over to be punished, but then called me back and threatened me again. Because I refused to sleep with her, she said to me, “If you give yourself to me, you will have authority over me and everyone in my household. You will be like a master over us.”
