translation:
  language: en
  text: '1. So, my children, see how much can be accomplished through endurance and through prayer with fasting.


    2. You too must pursue self-control and purity. Do this with endurance, with prayer and fasting, and with humble hearts. Then the Lord will dwell in you, because he loves self-control.


    3. When the Most High dwells in someone, that person may suffer because of envy, slavery, or slander.[a] Yet because of that person’s self-control, the Lord who dwells in him will not only rescue him from these evils but will also exalt and glorify him, just as he did me.


    4. For every person is revealed in what they do, say, and think.[b]


    5. My brothers knew how much my father loved me, but I did not become proud. Even as a child, I had the fear of God in my heart, because I knew that everything would surely pass away.


    6. I was not puffed up in evil. Instead, I honored my brothers. Because I was afraid of them, I kept silent while I was being sold. I did not tell the Ishmaelites that I was a son of Jacob, a great and mighty man.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “false accusation”; the Greek term can refer to malicious or fabricated charges.
    reason: lexical_alternative
  - marker: b
    text: The Greek is difficult; it appears to mean that a person is manifested in every sphere—deed, word, and thought.
    reason: textual_variant
  - marker: c
    text: Some witnesses differ here, but the sense is that Joseph concealed his family identity while being sold.
    reason: textual_variant
simplification_decisions:
- pob_phrase: if you pursue self-control and purity with endurance, and prayer with fasting, in humility of heart
  simplified_phrase: You too must pursue self-control and purity. Do this with endurance, with prayer and fasting, and with humble hearts.
  preserved_meaning: Both virtues remain joined to endurance, prayer, fasting, and inward humility.
  reasoning_layer_used: POB lexical decisions for σωφροσύνη, ἁγνεία, and ταπείνωσις καρδίας
  rationale: Two sentences make the dense list easier to follow without merging its practices.
- pob_phrase: even if envy should befall someone, or slavery, or slander
  simplified_phrase: that person may suffer because of envy, slavery, or slander
  preserved_meaning: Divine indwelling does not prevent someone from suffering these three evils.
  reasoning_layer_used: POB lexical decisions and divine-indwelling theological decision
  rationale: The recast clause expresses the affliction naturally while retaining every named evil.
- pob_phrase: I was not exalted in my mind
  simplified_phrase: I did not become proud
  preserved_meaning: Joseph did not respond to his father’s favor with inward pride.
  reasoning_layer_used: POB lexical decision for διανοία and immediate narrative context
  rationale: The common expression directly conveys inward self-exaltation.
interpretive_expansions:
- pob_phrase: every person, whether in deed or in word or in thought, comes together
  rendering: every person is revealed in what they do, say, and think
  claim: A person becomes manifest through actions, speech, and thoughts.
  evidence:
  - The POB footnote identifies manifestation in deed, word, and thought as the probable sense.
  - The threefold list covers action, speech, and inward thought.
  confidence: moderate
  alternatives_preserved:
  - The Greek may instead convey coming to prominence.
- pob_phrase: because of fear of them I kept silent
  rendering: Because I was afraid of them, I kept silent
  claim: Joseph’s silence while being sold resulted from fear directed toward the people denoted by “them.”
  evidence:
  - The POB revision preserves the Greek direction of fear as “fear of them.”
  - The immediate context connects this fear with Joseph’s silence during the sale.
  confidence: moderate
  alternatives_preserved:
  - The precise referent of “them” remains uncertain.
translation_notes:
  risk_flags:
  - risk: Verse 4 rests on difficult Greek and cannot be translated with certainty.
    mitigation: The main text follows the POB footnote’s probable sense, while footnote [b] preserves the uncertainty.
  - risk: “The Lord who dwells in him” may invite later doctrinal precision beyond this Jewish testamentary setting.
    mitigation: The wording preserves the POB’s direct indwelling language without defining its mechanism.
