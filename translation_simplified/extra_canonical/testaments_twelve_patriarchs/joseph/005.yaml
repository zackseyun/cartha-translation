translation:
  language: en
  text: 'At another time she said to me, “If you refuse to commit adultery, I will poison my husband and kill him. Then I will take you as my husband.”


    2 When I heard this, I tore my clothes and said to her, “Woman, be ashamed before God! Do not commit this evil and lawless act, or you will be destroyed. And know this: I will tell everyone about your plan.”


    3 She became afraid and begged me not to tell anyone about her plan.


    4 Then she left, but she kept trying to win me over with gifts and every kind of pleasure.'
