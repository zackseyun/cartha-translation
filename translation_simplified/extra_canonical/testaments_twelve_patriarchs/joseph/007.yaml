translation:
  language: en
  text: '7. This will show you that the wickedness of ungodly people cannot overcome those who fear God and live with self-control. Look! I took some of it in front of him and ate it while you watched. After saying this, I tasted it and declared, “The God of my fathers and the angel of Abraham will be with me.” Then I ate.


    8. When she saw this, she fell facedown at my feet and wept. I helped her up and warned her.


    9. She agreed not to do this wicked thing again. Yet her heart was still set on evil, and she kept looking for a way to trap me. She would groan and suddenly collapse, even though she was not sick.


    10. When her husband saw her, he asked, “What has happened to your face?”


    She answered, “My heart is in terrible anguish, and the groaning of my spirit will not release me.”


    He tried to make her well with comforting words.


    11. Then she found an opportunity. While her husband was still outside, she rushed in to me and said, “I am choking! I will throw myself down a cliff if you will not be sexually joined with me.”


    12. I understood that the spirit of Beliar was troubling her. So I prayed to the Lord and said to her,


    13. “Why, miserable woman, are you so distressed and confused that your sins have blinded you? Remember: if you kill yourself, Astho—your husband’s concubine and your rival—will beat your children and erase all memory of you from the earth.”'
