- pob_phrase: with a cheerful voice, rejoicing, I glorified my God
  simplified_phrase: I rejoiced and praised my God with a cheerful voice
  preserved_meaning: Joseph joyfully praised God despite his confinement.
  reasoning_layer_used: POB lexical decision for ἐν ἱλαρᾷ φωνῇ
  rationale: The reordered clause retains his joy, praise, and cheerful voice.
- pob_phrase: the one who, as a king in storerooms, lives in luxury with lawlessness
  simplified_phrase: one who lives like a king among storerooms, indulging in luxury and lawlessness
  preserved_meaning: Privilege and immoral excess are inferior to faithful self-control in hardship.
  reasoning_layer_used: POB lexical rationale and textual-variant note
  rationale: The difficult image remains while the moral contrast becomes easier to follow.
- pob_phrase: especially adorned for my deception
  simplified_phrase: adorned herself especially to deceive me
  preserved_meaning: She deliberately made herself attractive as part of her scheme against Joseph.
  reasoning_layer_used: POB lexical decision for κοσμουμένη πρὸς ἀπάτην μου
  rationale: The abstract wording becomes a clear action and purpose without changing deception to seduction.
