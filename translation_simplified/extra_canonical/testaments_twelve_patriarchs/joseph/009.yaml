translation:
  language: en
  text: '1[a]. Whenever she came, she would secretly listen to me. She heard me thank the Lord and sing hymns in the house of darkness where I was confined. I rejoiced and praised my God with a cheerful voice because a pretext had led to my deliverance from the Egyptian woman. Many times she sent me this message: “Agree to satisfy my desire, and I will release you from your chains and bring you out of the darkness.”


    2[b]. But I never turned toward her, not even in my thoughts. God has greater love for a person who remains faithful and self-controlled in a pit of darkness than for one who lives like a king among storerooms, indulging in luxury and lawlessness.


    3. But if a person lives with self-control, and the Most High knows that honor is fitting for him, he grants him that honor too, as he did for me.


    4. Many times, even though she was ill, she came down to me at an improper hour and listened to me pray. I understood her groanings[c], but I kept silent.


    5. While I was in her house, she would uncover her arms and legs, hoping that I would yield to her sexually. She was very beautiful and adorned herself especially to deceive me. But the Lord protected me from her schemes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “house of darkness” is Joseph’s place of confinement, but the wording preserves the Greek image of darkness.
    reason: cultural_note
  - marker: b
    text: The difficult Greek contrast sets faithful self-control in hardship against lawless luxury and privilege.
    reason: textual_variant
  - marker: c
    text: “Groanings” may refer to grief or to desire-filled sighing.
    reason: lexical_alternative
