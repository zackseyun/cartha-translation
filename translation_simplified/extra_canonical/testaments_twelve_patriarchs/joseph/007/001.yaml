translation:
  language: en
  text: “I am doing this so that you may learn that the wickedness of ungodly people will not defeat those who fear God and live with self-control. Look, I will take some of it and eat it here in front of you.” Then I said, “The God of my fathers and the angel of Abraham will be with me.” Then I ate.
