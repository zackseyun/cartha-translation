translation:
  language: en
  text: '1. Pentephris believed what she had told him. He ordered the slave broker to be brought in and asked him, “What is this I hear about you? Do you steal people from Canaan and resell them as slaves?”


    2. The broker fell at his feet and pleaded, “My lord, please! I do not know what you are talking about.”


    3. Pentephris said to him, “Then where did this Hebrew slave come from?” He answered, “The Ishmaelites left him in my care until they return.”


    4. Pentephris did not believe him. He ordered that the broker be stripped naked and beaten. But the broker kept giving the same answer. So Pentephris said, “Bring in the young man.”


    5. When they brought me in, I bowed before Pentephris. As he said, he ranked third among Pharaoh’s rulers.


    6. Pentephris separated me from the broker and asked, “Are you a slave or a free man?” I answered, “A slave.”


    7. He asked, “Whose slave are you?” I answered, “The Ishmaelites’.”


    8. He asked, “How did you become their slave?” I answered, “They bought me from Canaan.”


    9. He said to me, “You are certainly lying.” He immediately ordered that I also be stripped naked...'
