translation:
  language: en
  text: 'So then, my children, whatever you do, keep the fear of God before your eyes, and honor your brothers. Everyone who obeys the Lord’s law will be loved by him.


    While I was traveling with the Ishmaelites, they kept asking me, “Are you a slave?” I told them, “I am a household slave,”[a] because I did not want to bring shame on my brothers.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may refer to a domestic or homeborn slave.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: in every deed of yours
  simplified_phrase: whatever you do
  preserved_meaning: Godly fear is to guide every action.
  reasoning_layer_used: POB translation and lexical context
  rationale: The common expression states the same comprehensive command more directly.
- pob_phrase: everyone who does the law of the Lord
  simplified_phrase: Everyone who obeys the Lord’s law
  preserved_meaning: The promise concerns those who put the Lord’s law into practice.
  reasoning_layer_used: POB lexical decision for ποιῶν νόμον Κυρίου
  rationale: “Obeys” makes the ethical sense of doing the law immediately clear.
- pob_phrase: so that I might not put my brothers to shame
  simplified_phrase: because I did not want to bring shame on my brothers
  preserved_meaning: Joseph concealed his status to avoid disgracing his brothers.
  reasoning_layer_used: POB theological decision on Joseph’s concealment
  rationale: The purpose clause is recast as Joseph’s plain motivation without changing its object.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “fear of God” to mean only terror.
    mitigation: The traditional covenantal phrase is retained, while the surrounding commands show its moral force.
  - risk: The exact social nuance of “household slave” is uncertain.
    mitigation: A brief footnote preserves the domestic or homeborn alternatives.
