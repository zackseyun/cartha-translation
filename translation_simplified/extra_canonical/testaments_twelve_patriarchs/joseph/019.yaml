translation:
  language: en
  text: 'He gave me greater beauty than any handsome man in Israel. He kept me strong and handsome into old age, for I was like Jacob in every way.


    1 My children, listen now to the dream I saw.


    2 Twelve deer were feeding together in one place. Nine of them were scattered across the whole earth, and then the other three were scattered too. 3 In my dream, the three deer became three lambs. They cried out to the Lord, and he led them to a green place with plenty of water. He brought them out of darkness into light. 4 There they continued crying out to the Lord until the nine deer joined them. Together they became twelve sheep. Before long, they multiplied into many flocks.


    5 After this I saw twelve bulls nursing from one young cow. A sea of milk flowed from her, and the twelve flocks and countless other flocks drank from it. 6 The fourth bull had horns that reached to heaven and became like a wall for the flocks. Then another horn sprang up between those two horns. 7 I also saw a calf circle them twelve times, and it became a complete help to the bulls.


    8 Then I saw that a virgin was born,[a] and from her a lamb was born.[b] Something like a lion rushed out on his left.[c] All the beasts attacked the lamb, but he overcame them. He destroyed them, trampling them down. 9 The angels, people, and the whole earth rejoiced over him. 10 These things will happen at their appointed time, in the last days.


    11 Therefore, my children, keep the Lord’s commandments, and honor Levi and Judah. From their descendants, the salvation of Israel will arise for you. 12 His kingdom will last forever and will never pass away. But my kingdom among you will come to an end. It will vanish like a watchman’s hut after the summer.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some Greek witnesses say more explicitly, “from Judah was born a virgin,” while another reads, “I saw among the horns a certain virgin.”
    reason: textual_variant
  - marker: b
    text: Some witnesses call the lamb “spotless,” and a later-sounding reading adds language resembling “the lamb of God, who takes away the sin of the world.”
    reason: textual_variant
  - marker: c
    text: The wording about the lion is textually difficult; another witness describes the scene differently but still shows beasts attacking the lamb.
    reason: alternative_reading
  - marker: d
    text: A watchman’s hut was a temporary field shelter that stood deserted after the harvest.
    reason: cultural_note
