translation:
  language: en
  text: '1. After a little while, she would withdraw to test my inner purpose.[a] She tempted me ten times, and each test showed that I stood firm. I remained patient through them all, because patience is a powerful remedy.


    2. How many times the Egyptian woman threatened to kill me! How many times did she hand me over for punishment[b] and then call me back? Because I refused to have sexual relations with her, she told me, “You will have authority over me and everyone in my household if you give yourself to me. You will be like a master over us.”


    3. But I remembered my father’s words. I went into my private room, weeping, and prayed to the Lord.


    4. During those seven years I fasted, yet to the Egyptian I looked like someone living in luxury. Those who fast for God’s sake receive grace in their appearance.


    5. Whenever my master was away, I drank no wine. Every third day[c] I took my food and gave it to the poor and the sick.


    6. I rose early to pray to the Lord and wept to him about Memphis,[d] the Egyptian woman, because she never stopped troubling me. She even came to me at night, pretending that she was only visiting.


    7. Because she had no male child, she pretended—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some witnesses include the additional words “and threatened me.”
    reason: textual_variant
  - marker: b
    text: The terse Greek may mean that she handed Joseph over specifically to his Egyptian master for punishment.
    reason: alternative_reading
  - marker: c
    text: The phrase may mean every third day or after a three-day interval.
    reason: lexical_alternative
  - marker: d
    text: This Greek witness names the Egyptian woman Memphis.
    reason: cultural_note
simplification_decisions:
- pob_phrase: the purpose of my soul
  simplified_phrase: my inner purpose
  preserved_meaning: The woman tested Joseph’s settled inward intention.
  reasoning_layer_used: Lexical decision for διαβούλιον and doctrine realignment
  rationale: “Inner purpose” keeps the audited sense of deliberate purpose without the cumbersome soul-language.
- pob_phrase: In ten temptations she proved me approved
  simplified_phrase: She tempted me ten times, and each test showed that I stood firm
  preserved_meaning: Joseph’s repeated testing demonstrated that he passed the moral test.
  reasoning_layer_used: Lexical decision for δοκιμάσαι / δόκιμον
  rationale: The rewrite preserves both testing and proven approval in natural English.
- pob_phrase: receive grace of face
  simplified_phrase: receive grace in their appearance
  preserved_meaning: Fasting for God is said to produce visible grace in a person’s appearance.
  reasoning_layer_used: Lexical and theological decisions for τοῦ προσώπου τὴν χάριν
  rationale: The wording explains the facial image while retaining the text’s theological claim.
interpretive_expansions:
- pob_phrase: come together with her
  rendering: have sexual relations with her
  claim: The woman was demanding sexual intercourse from Joseph.
  evidence:
  - The lexical audit identifies συνελθεῖν as a sexual euphemism.
  - Her demand that Joseph give himself to her confirms the sexual context.
  confidence: high
  alternatives_preserved:
  - sleep with her
  - come together with her
- pob_phrase: rise early to the Lord
  rendering: rose early to pray to the Lord
  claim: Joseph rose early for prayer directed to the Lord.
  evidence:
  - The lexical rationale says Ὤρθριζον conveys early rising for prayer.
  - The surrounding account describes Joseph praying and weeping before the Lord.
  confidence: high
  alternatives_preserved:
  - rose early to the Lord
  - kept early watch before the Lord
