translation:
  language: en
  text: 'Memphis said to her husband, “I hear they are selling the young man.”


    2 She immediately sent a eunuch to the Ishmaelites to arrange for them to sell me to her.


    3 The eunuch did not want to buy me. After finding out what price they wanted, he left and told his mistress that they were asking a high price for the boy.


    4 Then she sent another eunuch with these instructions: “Even if they ask two minas[a], pay it. Do not hold back the gold. Just buy the boy and bring him to me.”


    5 The eunuch came, paid them eighty pieces of gold, and took me. But he told the Egyptian woman, “I paid a hundred.”


    6 I knew what he had done, but I said nothing, so that …[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A mina was an ancient unit of weight and money; its modern value cannot be stated precisely.
    reason: cultural_note
  - marker: b
    text: The supplied POB text ends with this sentence unfinished.
    reason: source_note
simplification_decisions:
- pob_phrase: asking that I be sold to her
  simplified_phrase: to arrange for them to sell me to her
  preserved_meaning: She initiated Joseph’s purchase from the Ishmaelites.
  reasoning_layer_used: Lexical decision for διάπρασιν and theological decision on sale language
  rationale: The active wording is easier to follow while keeping the sale explicit.
- pob_phrase: withdrew after testing them
  simplified_phrase: After finding out what price they wanted, he left
  preserved_meaning: The eunuch sounded out the sellers’ terms before leaving.
  reasoning_layer_used: Lexical decision for πειράσας and immediate context
  rationale: This avoids suggesting a moral test and states the commercial inquiry clearly.
- pob_phrase: Do not spare the gold. Only buy the boy
  simplified_phrase: Do not hold back the gold. Just buy the boy
  preserved_meaning: She ordered him to pay the requested amount and complete the purchase.
  reasoning_layer_used: Lexical decision for μὴ φείσασθε χρυσίου and the preserved slave-sale context
  rationale: Common wording keeps both the force of the command and the concrete reference to gold.
interpretive_expansions:
- pob_phrase: testing them
  rendering: finding out what price they wanted
  claim: The testing was an inquiry into the sellers’ price.
  evidence:
  - The next clause reports that they were asking a high price.
  - The POB lexical rationale identifies an inquiry into the sellers’ terms.
  confidence: high
  alternatives_preserved:
  - sounding them out
- pob_phrase: knowing it
  rendering: knew what he had done
  claim: Joseph knew that the eunuch had falsely reported paying one hundred.
  evidence:
  - The preceding sentence contrasts the actual payment of eighty with the reported payment of one hundred.
  confidence: high
  alternatives_preserved:
  - knew this
  - knew what had happened
