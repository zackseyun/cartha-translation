  simplified_phrase: During my life I faced envy and death
  preserved_meaning: Joseph experienced hostility and mortal danger without being led astray.
  reasoning_layer_used: POB base text and immediate context
  rationale: “Faced” expresses lived experience more naturally than the opaque English phrase “saw envy.”
- pob_phrase: I was gripped by famine, and the Lord himself nourished me
  simplified_phrase: Famine held me in its grip, but the Lord himself fed me
  preserved_meaning: Famine threatened Joseph, while the Lord personally sustained him.
  reasoning_layer_used: POB base text
  rationale: The rewrite keeps the forceful grip image while replacing “nourished” with common English.
- pob_phrase: Amid slanders he spoke in my defense
  simplified_phrase: When people slandered me, he defended me
  preserved_meaning: God acted as Joseph’s defender against false and harmful speech.
  reasoning_layer_used: POB base text
  rationale: The abstract setting becomes a direct action without changing who defended Joseph.
