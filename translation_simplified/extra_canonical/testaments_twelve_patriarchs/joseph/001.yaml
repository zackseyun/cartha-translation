translation:
  language: en
  text: '3. During my life I faced envy and death. Yet I did not go astray; I remained in the Lord’s truth.


    4. My brothers hated me, but the Lord loved me. They wanted to kill me, but the God of my fathers kept me safe. They lowered me into a pit, but the Most High lifted me out.


    5. I was sold as a slave, but the Master of all set me free. I was taken captive, but his mighty hand helped me. Famine held me in its grip, but the Lord himself fed me.


    6. I was alone, but God comforted me. I was weak, but the Lord came to care for me. I was in prison, but the Savior showed me favor. [I was in chains, but he freed me.]


    7. When people slandered me, he defended me. When there was bitter talk about dreams, he rescued me.'
  philosophy: optimal-equivalence
