translation:
  language: en
  text: '1. “I know that after I die, the Egyptians will oppress you. But God will avenge you and bring you into what he promised your ancestors.


    2. But carry my bones up with you. When my bones are brought there, the Lord will be with you in the light, while Beliar will be with the Egyptians in darkness.


    3. Bring Aseneth your mother to the racecourse[a], and bury her near Rachel my mother.[b]


    12.[c] My kingdom among you will reach its completion. It will be like a watchman’s hut in an orchard, which disappears after summer.”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek phrase “to the Hippodrome,” meaning the horse-racing grounds, is textually uncertain.
    reason: textual_variant
  - marker: b
    text: 'Some witnesses instead read: “Bring up Zelpha your mother, and place her near Bilhah by the racecourse, close to Rachel.”'
    reason: alternative_reading
  - marker: c
    text: The supplied witness jumps from verse 3 to verse 12 and may preserve only a compressed or excerpted form of the chapter.
    reason: textual_variant
  - marker: d
    text: The orchard watchman’s hut was a seasonal shelter left behind after harvest; compare Isaiah 1:8.
    reason: cross_reference
simplification_decisions:
- pob_phrase: God will execute your vengeance and bring you into the promises of your fathers
  simplified_phrase: God will avenge you and bring you into what he promised your ancestors
  preserved_meaning: God will actively vindicate Israel and bring them into the promised inheritance.
  reasoning_layer_used: lexical and theological decisions on ἐκδίκησιν and ἐπαγγελίας
  rationale: The verbs make the action clear while preserving divine vengeance and covenant promise.
- pob_phrase: bring Aseneth your mother [to the Hippodrome]
  simplified_phrase: Bring Aseneth your mother to the racecourse[a]
  preserved_meaning: Aseneth is to be taken to the location called the Hippodrome for burial nearby.
  reasoning_layer_used: source text and textual-variant footnote
  rationale: “Racecourse” explains the unfamiliar place term, while the note retains its Greek name and uncertainty.
- pob_phrase: will be brought to completion like a watchman’s hut in an orchard, which does not appear after the summer
  simplified_phrase: will reach its completion. It will be like a watchman’s hut in an orchard, which disappears after summer
  preserved_meaning: Joseph’s kingdom reaches its completion and is compared to a seasonal shelter that vanishes.
  reasoning_layer_used: lexical decisions on ἐπιτελεσθήσεται and ὀπωροφυλάκιον
  rationale: Two sentences clarify the comparison without resolving whether completion means fulfillment or ending.
translation_notes:
  risk_flags:
  - risk: The burial instruction has competing names and locations in the witnesses.
    mitigation: The main text follows the POB’s Aseneth reading and preserves the Zelpha-Bilhah reading in a footnote.
  - risk: The saying about Joseph’s kingdom is obscure and may imply either consummation or termination.
    mitigation: “Reach its completion” preserves both possibilities, and the seasonal image remains intact.
