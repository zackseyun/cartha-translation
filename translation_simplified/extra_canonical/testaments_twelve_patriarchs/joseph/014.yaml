translation:
  language: en
  text: '1. Memphis could see through her windows[a] that I was being beaten, because her house was nearby. She sent him this message: “Your judgment is unjust. You are punishing a kidnapped free man as if he had done wrong.” 2. Even as they beat me, I did not change my statement. So he ordered that I be kept under guard until the boy’s masters came. 3. The woman continued saying to her husband—[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: These may have been open windows or lattices rather than modern glazed windows.
    reason: cultural_note
  - marker: b
    text: The sentence breaks off in the supplied Greek text and continues in the next chapter.
    reason: textual_variant
