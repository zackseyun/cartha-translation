translation:
  language: en
  text: '1 Sons of Zebulun, pay close attention to what your father says.


    2 I am Zebulun, and I became a good gift to my parents. When I was born, my father became very prosperous. His sheep and cattle also increased greatly when he received his share through the patterned rods.[a]


    3 I am not aware that I sinned during my life, except perhaps in my intentions.[b]


    4 I do not remember committing lawlessness, except for the wrong I did in ignorance concerning Joseph: I gave my brothers my word that I would not tell my father what had happened.


    5 But I secretly wept over Joseph for many days. I was afraid of my brothers because they had all agreed to put to death anyone who revealed the secret.


    6 Yet when they wanted to kill Joseph, I pleaded with them through my tears not to commit this sin.


    7 Simeon, Dan, and Gad came against Joseph to kill him. Joseph said to them with tears,


    8 “Have mercy on me, my brothers. Have compassion for the deep feelings of our father Jacob. Do not lay your hands on me and shed innocent blood, for I have not sinned against you.


    9 Even if I have sinned, correct me with discipline, my brothers. But for the sake of your father Jacob, do not use your hands to murder your own brother.”


    10 As Joseph spoke these words in grief, I could not bear his cries. I began to weep. It was as if my liver had been poured out, and everything inside me grew weak.[c]


    11 I wept with Joseph. My heart thundered, the joints of my body trembled, and I had no strength.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The patterned rods refer to Jacob’s breeding of the flocks in Genesis 30.
    reason: cross_reference
  - marker: b
    text: The difficult Greek may refer to inward intention rather than an outward act.
    reason: lexical_alternative
  - marker: c
    text: The poured-out liver is an ancient bodily image of overwhelming grief.
    reason: cultural_note
