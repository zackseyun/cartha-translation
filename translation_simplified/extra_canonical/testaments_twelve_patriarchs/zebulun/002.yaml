- pob_phrase: when with the variegated rods he had his share
  simplified_phrase: when he received his share through the patterned rods
  preserved_meaning: Jacob’s prosperity remains tied to the rods in the Genesis breeding account.
  reasoning_layer_used: lexical decision and cross-reference footnote
  rationale: “Patterned” is more familiar than “variegated” while retaining the rods and the allusion.
- pob_phrase: except for the ignorance that I showed concerning Joseph
  simplified_phrase: except for the wrong I did in ignorance concerning Joseph
  preserved_meaning: Zebulun admits fault concerning Joseph while describing it as ignorance.
  reasoning_layer_used: lexical and theological decisions
  rationale: The recast clause makes his admitted fault clear without treating it as deliberate rebellion.
- pob_phrase: my liver was poured out, and all the substance of my inward parts grew faint
  simplified_phrase: It was as if my liver had been poured out, and everything inside me grew weak
  preserved_meaning: The ancient bodily image conveys Zebulun’s collapse under intense grief.
  reasoning_layer_used: lexical and theological decisions on embodied grief
  rationale: The plain second clause explains the effect while the vivid liver image remains.
