- pob_phrase: my father increased very greatly, and so did the flocks and the herds, when by the speckled rods he gained his portion
  simplified_phrase: my father prospered greatly. His flocks and herds increased when he used speckled rods in gaining his share
  preserved_meaning: Zebulun’s birth coincided with Jacob’s growing prosperity and the livestock gained in connection with the speckled rods.
  reasoning_layer_used: POB text, immediate context, and lexical decision on portion/share
  rationale: The rewrite explains the result while retaining the concrete rods image.
- pob_phrase: the unwitting wrong I did concerning Joseph, in that I gave my brothers my pledge
  simplified_phrase: the wrong I unknowingly did concerning Joseph. I promised my brothers
  preserved_meaning: Zebulun admits an unwitting wrong in promising to conceal what happened to Joseph.
  reasoning_layer_used: POB lexical decision on ignorance and current POB wording
  rationale: Common wording preserves both his lack of knowledge and his promise.
