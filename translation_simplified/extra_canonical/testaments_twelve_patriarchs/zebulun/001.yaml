translation:
  language: en
  text: '1 This is a record of what Zebulun[a] told his sons before he died. He was 114 years old,[b] and Joseph had died two years earlier.


    2 He said to them, “Sons of Zebulun, listen to me. Pay attention to your father’s words.


    3 I, Zebulun, became a good gift to my parents. When I was born, my father prospered greatly. His flocks and herds increased when he used speckled rods in gaining his share.


    4 As far as I know, I did not sin during my life except in my thoughts.


    5 I do not remember committing wrongdoing, except for the wrong I unknowingly did concerning Joseph. I promised my brothers that I would not tell my father what had happened.


    6 But I secretly wept over Joseph for many days. I was afraid of my brothers because they had all agreed to kill anyone who revealed the secret.


    7 Yet when they wanted to kill Joseph, I begged them through my tears not to commit this sin.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some ancient witnesses give a different patriarch’s name in the heading, but the chapter clearly presents Zebulun as the speaker.
    reason: textual_variant
  - marker: b
    text: Ancient witnesses vary on Zebulun’s exact age; 114 follows the Greek witness used here.
    reason: textual_variant
