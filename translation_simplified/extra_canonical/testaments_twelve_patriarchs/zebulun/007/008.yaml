translation:
  language: en
  text: In winter, I would set aside half of it with my brothers. But if you have nothing to give a person in need, share in that person’s suffering with deep compassion. I know what it is like to have nothing to give a person in need. As I walked with him for about 1.3 kilometers (eight-tenths of a mile), I wept. Deep within me, I was moved with compassion for him.
