translation:
  language: en
  text: '1. After they had done this, they all sat down to eat and drink. But I saw Joseph grieving, so I did not eat with them. Instead, I watched over the pit and prayed that help would come to him.


    2. Meanwhile, Reuben stood up and said, “My brothers, let us not kill him. Let us throw him into one of these dry pits that our fathers dug but found no water in.”


    3. The Lord had kept water from springing up in those pits so that Joseph would be preserved.


    4. They did this until they sold him to the Ishmaelites.


    5. My children, I took no share of the money paid for Joseph. But Simeon, Dan, Gad, and their sons took the money and bought sandals for themselves, their wives, and their children.


    6. They said, “We will not use this money for food, because it is the price of our brother’s blood. Instead, we will trample it underfoot. He said he would rule over us, so now we will see what becomes of his dreams.”


    7. Therefore the law of Moses says, “If a man refuses to continue his dead brother’s family by giving him descendants, his sandal shall be removed, and they shall spit in his face.”[a]


    8. In the same way, Joseph’s brothers were unwilling to “raise up the life” of their own brother—they would not preserve his life. So the Lord took away the sandals they wore as they acted against their brother Joseph.[b]


    9. When they came to Egypt, Joseph’s attendants removed their sandals outside the gate. Then they bowed before Joseph as people bowed before Pharaoh the king.


    10. They not only bowed to Joseph. As soon as they fell before him, they were also spat on and publicly shamed by the Egyptians.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This refers to Deuteronomy 25:5–10, where refusing this family duty brought public shame through sandal removal and spitting.
    reason: cross_reference
  - marker: b
    text: The unusual Greek wording, “raise up the life of their brother,” adapts the family-law language of the previous verse as a moral analogy.
    reason: lexical_alternative
  - marker: c
    text: Some understand the spitting as a symbolic extension of the law citation, though the Greek narrative states it directly.
    reason: alternative_reading
