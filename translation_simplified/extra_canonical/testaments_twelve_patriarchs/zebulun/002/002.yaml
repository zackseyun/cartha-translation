    changes_summary: Revised 'prospered greatly' to 'increased greatly' for closer lexical alignment with ηὐξήνθη; added 'so did' for smoother English and clearer coordination; changed 'with the variegated rods he had his share' to 'when he had his portion among the variegated rods' for more natural rendering of ἐν... εἶχον τὸν κλῆρον.
translation:
  language: en
  text: I, Zebulun, became a good gift to my parents, because when I was born, my father became very prosperous, and his sheep and cattle multiplied. This happened when he received his share of the livestock in connection with the striped rods.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This refers to the account of Jacob’s share of the livestock and the striped rods.
    reason: cultural_note
simplification_decisions:
- pob_phrase: my father increased greatly
  simplified_phrase: my father became very prosperous
  preserved_meaning: Zebulun’s birth coincided with a broad increase in his father’s prosperity.
  reasoning_layer_used: POB revision and immediate livestock context
  rationale: “Became very prosperous” clarifies the broad increase without narrowing it to household size.
- pob_phrase: and so did the sheep and the cattle
  simplified_phrase: and his sheep and cattle multiplied
  preserved_meaning: Both kinds of livestock increased greatly.
  reasoning_layer_used: POB coordination and source context
  rationale: “Multiplied” naturally explains how the livestock increased.
- pob_phrase: when he had his portion among the variegated rods
  simplified_phrase: when he received his share of the livestock in connection with the striped rods
  preserved_meaning: Jacob received his allotted livestock in the episode involving the marked rods.
  reasoning_layer_used: POB rendering and Genesis narrative context
  rationale: The wording clarifies the portion while avoiding a claim that the rods caused the result.
interpretive_expansions:
- pob_phrase: his portion
  rendering: his share of the livestock
  claim: The portion refers to Jacob’s allotted livestock.
  evidence:
  - The clause directly follows the increase of the sheep and cattle.
  - The striped-rods episode concerns Jacob’s share of Laban’s livestock.
  confidence: high
  alternatives_preserved:
  - The wording does not specify how the rods related causally to the result.
translation_notes:
  risk_flags:
  - risk: “Became very prosperous” interprets the father’s increase in light of the livestock context.
    mitigation: The broad wording avoids limiting the increase to wealth, household size, or one specific measure.
  - risk: Modern readers may not know the striped-rods episode.
    mitigation: The footnote identifies the episode without asserting a causal mechanism.
