translation:
  language: en
  text: 'You will return to your land and see him in Jerusalem because of his holy name. Healing and compassion will be in his wings. He himself will free all humanity from captivity to Beliar,[a] and every deceitful spirit will be trampled down. He will turn all nations to zeal for him. You will see God in human form, the one whom the Lord will choose. Jerusalem is his name.


    9. Once again, your deceitful actions will make him angry, and you will be cast away from him until the time of completion.


    10. Now, my children, do not grieve because I am dying. Do not collapse in sorrow because my life is ending. I will rise again among you as a ruler among the people of righteousness. I will rejoice among those of my tribe who keep the Lord’s law. But the Lord will bring eternal fire upon the ungodly and destroy them for generations and generations.


    As for me, I am now hurrying to my place of rest, as my fathers did before me. But you must fear the Lord with all your strength every day of your lives.


    After saying this, he fell asleep in death. His sons placed him in a wooden coffin. Later, they carried him up to Hebron and buried him there with his fathers.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beliar is a name for the power of evil.
    reason: cultural_note
