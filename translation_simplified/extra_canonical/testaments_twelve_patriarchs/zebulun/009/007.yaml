translation:
  language: en
  text: After all this, when you remember the Lord, you will return. He will have mercy on you because he is merciful and compassionate. He does not hold people’s wickedness against them, because they are frail flesh and go astray in their evil deeds.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And after these things
  simplified_phrase: After all this
  preserved_meaning: Their return follows the events already described.
  reasoning_layer_used: POB base text and immediate context
  rationale: The shorter phrase gives the same sequence in natural English.
- pob_phrase: you will return
  simplified_phrase: you will return
  preserved_meaning: The wording allows both a reversal of course and a broader restoration.
  reasoning_layer_used: POB base text and grounding review
  rationale: Retaining “return” avoids narrowing the statement to repentance alone.
- pob_phrase: the sons of men, because they are flesh and go astray in their evil deeds
  simplified_phrase: people, because they are frail flesh and go astray in their evil deeds
  preserved_meaning: Human frailty and straying in evil conduct remain the stated grounds for mercy.
  reasoning_layer_used: Greek source image, POB base text, and grounding review
  rationale: The wording clarifies human weakness while preserving both the flesh image and the link to evil deeds.
interpretive_expansions:
- pob_phrase: he does not reckon wickedness to the sons of men
  rendering: He does not hold people’s wickedness against them
  claim: The accounting language means that God does not treat their wickedness as a charge held against them.
  evidence:
  - The Greek accounting verb and dative connect wickedness with the people.
  - The preceding mercy statement supports this non-condemnatory sense.
  confidence: moderate
  alternatives_preserved:
  - He does not reckon wickedness to people.
  - He does not charge people with wickedness.
- pob_phrase: because they are flesh
  rendering: because they are frail flesh
  claim: “Flesh” points here to human frailty.
  evidence:
  - The following statement that people go astray presents flesh as a ground of human weakness.
  - The POB preserves flesh as the reason for compassionate treatment.
  confidence: moderate
  alternatives_preserved:
  - because they are flesh
  - because they are frail human beings
translation_notes:
