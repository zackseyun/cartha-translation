translation:
  language: en
  text: 'So, my children, show mercy and compassion to everyone. Then the Lord will also have compassion on you and show you mercy. In the last days, God will send his compassion upon the earth. Wherever he finds people showing merciful compassion, he will dwell there. The compassion a person shows to his neighbor is the measure of the compassion the Lord shows to him.


    When we went down into Egypt, Joseph did not hold a grudge against us. Follow his example, my children: love one another, and do not hold evil against your brother. This divides unity, tears family bonds apart, troubles the soul, and distorts the face.'
  philosophy: optimal-equivalence
