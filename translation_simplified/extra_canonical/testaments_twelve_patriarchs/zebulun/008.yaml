- pob_phrase: scatters every kinship
  simplified_phrase: tears family bonds apart
  preserved_meaning: Reckoning evil against a brother breaks relationships among relatives.
  reasoning_layer_used: POB text and source imagery
  rationale: The awkward expression becomes idiomatic while preserving the image of broken kinship.
