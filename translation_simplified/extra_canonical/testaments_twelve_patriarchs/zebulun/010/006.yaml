base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/006.yaml
  text: For I will rise again in your midst, as a leader in the midst of the sons of righteousness; and I will rejoice in the midst of my tribe, those who keep the law of the Lord and the commandments of Zebulun their father.
  revision_pass:
    model: gpt-5.4-mini
    timestamp: '2026-05-03T07:42:03Z'
    unchanged: false
    changes_summary: 'Restored the final clause absent from the draft: ‘and the commandments of Zebulun their father.’ Also tightened ‘all who’ to ‘those who’ for smoother formal English while preserving the source meaning.'
translation:
  language: en
  text: For I will rise again among you and serve as a leader among those who live rightly. I will rejoice among the people of my tribe who obey the law of the Lord and the commands of their father Zebulun.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: in your midst
  simplified_phrase: among you
  preserved_meaning: Zebulun will again be present within the community.
  reasoning_layer_used: POB translation and Greek source
  rationale: “Among you” expresses the same relationship in more natural English.
- pob_phrase: as a leader in the midst of the sons of righteousness
  simplified_phrase: serve as a leader among those who live rightly
  preserved_meaning: Zebulun will hold a leading role among people characterized by righteousness.
  reasoning_layer_used: POB translation and immediate context
  rationale: The wording makes the biblical description understandable without losing leadership or righteousness.
- pob_phrase: those who keep the law of the Lord and the commandments of Zebulun their father
  simplified_phrase: who obey the law of the Lord and the commands of their father Zebulun
  preserved_meaning: The tribe is defined by obedience both to the Lord’s law and to Zebulun’s commands.
  reasoning_layer_used: POB revision history and Greek source
  rationale: “Obey” states the sense of “keep,” while retaining the restored final clause.
translation_notes:
  risk_flags:
  - risk: “Rise again” may suggest resurrection or a renewed appearance, and the record does not resolve the nuance.
    mitigation: The POB wording is retained without adding an explanation that would settle the ambiguity.
  - risk: “Those who live rightly” is clearer but less closely preserves the source image “sons of righteousness.”
    mitigation: The rendering retains righteousness as a defining way of life rather than reducing it to general goodness.
