translation:
  language: en
  text: 'They said to Jacob, “Look closely. Is this your son’s tunic?” And they did so. When they sold Joseph, they had taken off his tunic and dressed him in clothing worn by a servant. Simeon took the tunic and refused to hand it over. He wanted to cut Joseph down with his sword because he was angry that he had not killed him. But all of us stood up to him and said, “If you do not give us the tunic, we will tell our father that you alone committed this evil in Israel.” So he gave it to them.


    And now, my children, I command you to protect your neighbor and show compassion to everyone—not only to people, but also to animals. Because I did these things, the Lord blessed me. When all my brothers became sick, I remained well, for the Lord knows each person’s intentions. Therefore, have mercy in your hearts. Whatever someone does to a neighbor, the Lord will treat that person in the same way. My brothers’ sons became sick and were dying because of Joseph, for they had shown no mercy in their hearts. But my sons were kept free from sickness, as you know.


    When I lived in the land of Canaan near the seashore, I used to catch fish[a] for my father Jacob. When many were choking in the sea, I remained unharmed.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “hunted prey,” but the seashore setting points to fishing or catching sea creatures.
    reason: lexical_alternative
  - marker: b
    text: The surviving source excerpt ends here, apparently in the middle of the account.
    reason: textual_variant
