translation:
  language: en
  text: 1 So watch what water does. When waters move toward one place, they carry along stones, wood, soil, and many other things. 2 But when they divide into many streams, the ground swallows them up, and they become easy to disregard. 3 The same will happen to you if you are divided. 4 So do not be split under two heads. Everything the Lord made has one head, two shoulders, two hands, two feet, and all its other body parts. 5 I learned from the writings of my fathers that Israel will be divided. You will follow two kingdoms and commit every kind of detestable act. 6 Your enemies will take you captive, and among the nations you will suffer much weakness and distress. 7 Afterward, when you remember the Lord, you will return to him,[a] and he will have mercy on you. He is merciful and compassionate. He does not count people's wickedness against them, because they are flesh and go astray in their evil deeds.[b] 8 Afterward, the Lord himself will rise for you, the light of righteousness.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some witnesses read, “you will remember the Lord and repent, and he will turn you back.”
    reason: textual_variant
  - marker: b
    text: Some witnesses read, “because they are flesh and the spirits of error lead them astray in all their deeds.”
    reason: textual_variant
  - marker: c
    text: Or “will dawn for you”; the Lord is pictured as rising light.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: pay attention to the waters, and understand
  simplified_phrase: watch what water does
  preserved_meaning: The reader is told to observe water as an example.
  reasoning_layer_used: POB lexical decisions and immediate comparison
  rationale: The shorter command makes the illustration direct without weakening it.
- pob_phrase: do not be split under two heads
  simplified_phrase: do not be split under two heads
  preserved_meaning: The passive warning retains the bodily-political image without assigning the division solely to the audience.
  reasoning_layer_used: POB lexical decision, doctrine realignment, and grounding review
  rationale: Keeping “split” preserves both the passive form and its distinction from “divided.”
- pob_phrase: he does not reckon wickedness against the sons of men
  simplified_phrase: he does not count people's wickedness against them
  preserved_meaning: God is pictured as not charging human wickedness to their account.
  reasoning_layer_used: POB lexical rationale for the accounting metaphor
  rationale: “Count against” expresses the accounting image in common English.
interpretive_expansions:
- pob_phrase: you will return
  rendering: you will return to him
  claim: The return is directed toward the Lord.
  evidence:
  - The return follows immediately after remembering the Lord.
  - The POB lexical rationale identifies a relational return to the Lord.
  confidence: high
  alternatives_preserved:
  - The footnote preserves the reading in which they repent and God turns them back.
translation_notes:
  risk_flags:
  - risk: “Under two heads” may remain unfamiliar to some readers.
    mitigation: The following list of body parts explains the image while preserving its political force.
  - risk: “Light of righteousness” may be mistaken for a narrowly defined title.
    mitigation: The appositional wording preserves the open prophetic image, and the note explains only its rising-light sense.
