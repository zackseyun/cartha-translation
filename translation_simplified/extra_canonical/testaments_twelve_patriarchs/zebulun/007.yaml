translation:
  language: en
  text: '1. Therefore, my children, show mercy and compassion to everyone, so that the Lord may also show mercy and compassion to you. 2. For in the last days, your compassion will spread across the earth. Wherever the Most High finds a compassionate heart, he makes his home there. 3. The Lord has compassion on a person in the same measure that the person has compassion on his neighbors.


    4. When we went down to Egypt, my brother Joseph tested us and learned that I was compassionate. 5. When I sat beside him, I did not hurt him through envy or speak bitterly against him. 6. So, my children, I urge you not to keep malice in your hearts against one another. Love one another in what you say and what you do.


    7. In my father''s presence, I spoke peacefully to Joseph. After I left, Dan told us that the chief eunuch was seeking to kill Joseph because he had become attached to him as a pure and good young man. 8. But I wept for Joseph and prayed that the Lord would rescue him from every evil plan. 9. Later, the Ishmaelites came and took him away. They persuaded him to go with them and sold him to Potiphar in Egypt. 10. Because I had shown compassion to my brother, the Lord did not allow me to face the same test.


    11. When all my brothers were sick and our father was grieving over them, I had compassion on every poor person and every sick person. I gave to everyone with a sincere and undivided heart. 12. If I had nothing to give someone in need, I walked with him for about 0.8 miles (1.3 kilometers), weeping with him and showing him mercy.


    13. Therefore, my children, show mercy and compassion to everyone from a good heart, so that God may also show you compassion and mercy. 14. Anyone who has no compassion for his neighbor provokes the Lord. 15. If he hardens his heart, refuses to have compassion on his neighbor, and does not help the poor, the Lord will judge him.


    16. Throughout my life, I did not follow crooked ways but lived with simplicity of heart. 17. I did not set my heart on silver, gold, or human praise. 18. I was not two-faced. 19. I did not plan evil against my neighbor. 20. I did not corrupt my speech with many-colored words—language that may be crafty or misleading. 21. I treated everyone with simplicity of heart.


    22. Therefore, my children, live in the same way. Then every spirit of Beliar[a] will flee from you, and no deed of wicked people will gain power over you. You will master every wild beast because the God of heaven and earth is with you, and you act toward everyone with simplicity of heart.


    23. After Zebulun said these things, he commanded his sons to carry his body to Hebron and bury it with his fathers. 24. When he fell asleep in death at a good old age, his sons laid him in a coffin. 25. Later, they carried him up to Hebron and buried him with his fathers.'
