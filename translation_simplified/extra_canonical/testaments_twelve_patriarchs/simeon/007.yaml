translation:
  language: en
  text: Now, my children, listen to Levi and Judah. Do not think you are above these two tribes, because the salvation of God will come to us from them. The Lord will raise up a high priest from Levi and a king from Judah, [God and man].[a] He will save [all the nations and][b] the people of Israel.[c] This is why I give you these commands. You must give the same commands to your children, so that they will keep them through every generation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The words “God and man” are uncertain in the Greek witness and may be a later addition.
    reason: textual_variant
  - marker: b
    text: The words “all the nations and” are uncertain in the Greek witness and may be a later addition.
    reason: textual_variant
  - marker: c
    text: The Greek expression refers to Israel as a people united by lineage.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: do not exalt yourselves over these two tribes
  simplified_phrase: do not think you are above these two tribes
  preserved_meaning: The warning still forbids pride toward Levi and Judah.
  reasoning_layer_used: Lexical decision for μὴ ἐπαίρεσθε
  rationale: Common wording makes the comparative self-exaltation immediately clear.
- pob_phrase: the race of Israel
  simplified_phrase: the people of Israel
  preserved_meaning: Israel remains a lineage-based people-group.
  reasoning_layer_used: Lexical decision for τὸ γένος τοῦ Ἰσραήλ
  rationale: “People” avoids the misleading modern sense of “race,” while the note preserves lineage.
- pob_phrase: Therefore I command these things to you, so that you also may command your children
  simplified_phrase: This is why I give you these commands. You must give the same commands to your children
  preserved_meaning: Simeon requires his children to transmit his commands to their descendants.
  reasoning_layer_used: Source syntax and POB translation
  rationale: Two direct sentences replace the dense purpose construction without merging the commands.
