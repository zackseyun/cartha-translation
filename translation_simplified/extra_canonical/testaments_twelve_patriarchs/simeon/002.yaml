translation:
  language: en
  text: '1. Listen to me, my children. I am Simeon, your father, and I will tell you what is in my heart.


    2. I was Jacob’s second son. My mother Leah named me Simeon because the Lord heard her prayer.


    3. I became very strong. I never backed away from any deed or acted out of fear.


    4. My heart was hard. Deep within, I was unyielding and had no compassion.[a]


    5. For the Most High gives people courage in both soul and body.


    6. When I was young, I was deeply jealous of Joseph because my father loved him more than all his other sons.


    7. Deep within, I set myself against Joseph and intended to kill him.[a] The ruler of deceit and the spirit of jealousy blinded my mind. I no longer regarded Joseph as my brother, and I was willing even to harm my father Jacob.


    8. But Joseph’s God, the God of our fathers, sent his angel and rescued him from my hands.


    9. When I went to Shechem to bring ointment for our flocks, and Reuben went to Dothan, where we kept our supplies and stores, my brother Judah sold Joseph to the Ishmaelites.


    10. When Reuben heard what had happened, he was grieved, because he had wanted to bring Joseph safely back to our father.


    11. When I heard, I became furious with Judah because he had allowed Joseph to remain alive.


    12. For five months, I suffered an illness in my liver. The Lord struck me, and my hand withered for seven days.


    13. Then I understood, my children, that this had happened to me because of Joseph. I changed my mind, wept, and prayed to the Lord God to restore my hand. I also prayed that I would turn away from everything that defiles, from envy, and from all foolishness.


    14. I knew that, because I envied my brother Joseph, I had planned something evil before the Lord and against my father Jacob.'
