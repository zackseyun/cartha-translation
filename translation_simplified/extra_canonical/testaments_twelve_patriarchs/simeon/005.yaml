translation:
  language: en
  text: 'Joseph was handsome and pleasing to look at because no evil lived within him. A person’s face reveals the turmoil within the spirit.


    Now, my children, make your hearts good in the Lord’s sight, and walk straight paths in the sight of others. Then you will keep finding favor with the Lord and with people.


    So guard yourselves from sexual immorality. Sexual immorality is the mother of evils. It separates people from God and draws them near to Beliar.


    For I have seen in the writing of Enoch that your sons will become corrupt through sexual immorality, and they will attack the sons of Levi with the sword.


    But they will not be able to stand against Levi, because he will fight the Lord’s war and defeat your entire army.


    They will be few in number, divided between Levi and Judah. No one from among you will become a leader, just as our father prophesied in his blessings.'
  philosophy: optimal-equivalence
