translation:
  language: en
  text: 'When Simeon finished giving commands to his sons, he fell asleep in death with his fathers. He was 120 years old.


    They placed his body in a wooden coffin so that his bones could later be carried up to Hebron. During a war involving the Egyptians, they secretly carried his bones there.[b]


    The Egyptians were keeping Joseph’s bones in the tombs of the kings, intending to bring his bones up.[a] Their enchanters had told them that when Joseph’s bones were taken out of Egypt,[c] darkness and gloom would cover the whole land, and a great plague would strike the Egyptians. The darkness would be so deep that no one could recognize his own brother, even with a lamp.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some ancient witnesses read “the storehouses of the kings” instead of “the tombs of the kings.”
    reason: textual_variant
  - marker: b
    text: The compressed Greek may mean either “during an Egyptian war” or “during war among the Egyptians.”
    reason: alternative_reading
  - marker: c
    text: Compare Genesis 50:25 and Exodus 13:19, where Joseph’s bones are carried out of Egypt.
    reason: cross_reference
simplification_decisions:
- pob_phrase: when Simeon had finished commanding his sons
  simplified_phrase: When Simeon finished giving commands to his sons
  preserved_meaning: Simeon completed his authoritative final instructions to his sons.
  reasoning_layer_used: Lexical decisions for συνετέλεσεν and ἐντελλόμενος
  rationale: The rewrite keeps the commands authoritative while using ordinary English syntax.
- pob_phrase: to bring up his bones to Hebron
  simplified_phrase: so that his bones could later be carried up to Hebron
  preserved_meaning: The coffin prepared Simeon’s remains for transfer to Hebron.
  reasoning_layer_used: Lexical decision for τοῦ ἀναγαγεῖν τὰ ὀστᾶ αὐτοῦ
  rationale: “Later” clarifies the purpose while retaining the directional image.
- pob_phrase: so that even with a lamp each man would not recognize his brother
  simplified_phrase: The darkness would be so deep that no one could recognize his own brother, even with a lamp
  preserved_meaning: The predicted darkness would defeat lamplight and prevent personal recognition.
  reasoning_layer_used: Lexical decisions for μετὰ λύχνου and distributive ἕκαστος
  rationale: The result is stated directly while the lamp and brother images remain.
interpretive_expansions:
- pob_phrase: he fell asleep with his fathers
  rendering: he fell asleep in death with his fathers
  claim: The sleep language is an expression for death, not ordinary sleep.
  evidence:
  - The lexical and theological decisions identify ἐκοιμήθη as a death euphemism.
  - His age and placement in a coffin confirm the death context.
  confidence: high
  alternatives_preserved:
  - fell asleep
  - died
  - was laid to rest
- pob_phrase: when Joseph’s bones went out
  rendering: when Joseph’s bones were taken out of Egypt
  claim: The bones were to depart specifically from Egypt.
  evidence:
  - The Egyptians held the bones and feared the result of their departure.
  - Genesis 50:25 and Exodus 13:19 describe Joseph’s bones leaving Egypt.
  confidence: high
  alternatives_preserved:
  - went out
  - left Egypt
