translation:
  language: en
  text: 'Now, my children, listen to me. Guard yourselves against the spirit of deceit and envy.[a] Envy takes control of a person’s whole mind. It keeps him from eating, drinking, or doing anything good. It constantly drives him to kill the person he envies. Yet the person he envies keeps flourishing, while he himself wastes away.


    So for two years I lived in fear of the Lord and made myself suffer by fasting. I learned that the fear of God sets a person free from envy. If anyone flees to the Lord for safety, the evil spirit runs away from him, and his mind becomes light, no longer weighed down. Then he feels compassion for the person he once envied. He forgives those who love him,[b] and in this way he stops envying.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the spirit of error” or “the spirit of delusion.”
    reason: lexical_alternative
  - marker: b
    text: “Those who love him” may mean those who love the person once envied or those who love the person being freed from envy.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: envy masters a man's whole mind
  simplified_phrase: Envy takes control of a person’s whole mind
  preserved_meaning: Envy dominates the whole faculty of thought and intention.
  reasoning_layer_used: lexical decision for κυριεύει πάσης τῆς διανοίας
  rationale: “Takes control” expresses domination in familiar English.
- pob_phrase: I afflicted my soul with fasting
  simplified_phrase: I made myself suffer by fasting
  preserved_meaning: He practiced severe self-denial through fasting.
  reasoning_layer_used: lexical decisions for ἐκάκωσα τὴν ψυχήν μου and ἐν νηστείᾳ
  rationale: The rewrite makes the ascetic action clear without weakening its severity.
- pob_phrase: flees for refuge to the Lord
  simplified_phrase: flees to the Lord for safety
  preserved_meaning: The person urgently turns to the Lord as a place of refuge.
  reasoning_layer_used: lexical decision for καταφύγῃ
  rationale: “For safety” explains the refuge image in ordinary wording.
interpretive_expansions:
- pob_phrase: his mind becomes light
  rendering: his mind becomes light, no longer weighed down
  claim: The lightness describes relief from envy’s oppressive burden.
  evidence:
  - The lexical decision preserves the contrast between lightness and oppressive weight.
  - The immediate context describes release from envy and a changed moral response.
  confidence: high
