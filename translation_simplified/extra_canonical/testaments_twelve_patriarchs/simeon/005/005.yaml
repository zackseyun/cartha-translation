- pob_phrase: stand against Levi
  simplified_phrase: resist Levi
  preserved_meaning: They will be unable to oppose Levi successfully.
  reasoning_layer_used: POB base translation and Greek source
  rationale: “Resist” expresses the opposition plainly without changing its force.
- pob_phrase: because he will wage the Lord’s war and will defeat
