  preserved_meaning: Levi’s God-directed warfare and victory are the stated reason they cannot resist him.
  reasoning_layer_used: POB base translation and grounding review
  rationale: Keeping “because” preserves the explicit causal connection while removing a repeated auxiliary verb.
- pob_phrase: your whole camp
  simplified_phrase: your entire camp
  preserved_meaning: Levi will defeat all of the opposing camp.
  reasoning_layer_used: POB revision rationale and Greek source
  rationale: “Entire” is natural modern English and preserves both the camp image and its full scope.
