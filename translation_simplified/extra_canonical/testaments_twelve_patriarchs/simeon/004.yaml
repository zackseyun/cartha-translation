translation:
  language: en
  text: '1. My father kept asking what was wrong because he had seen how gloomy I looked. I told him, “My liver is swollen.”[a] 2. I was grieving more than all the others because I was responsible for the sale of Joseph. 3. When we went down to Egypt and Joseph had me bound as a spy, I knew that I deserved what I was suffering, so I was not distressed.


    4. But Joseph was a good man. The Spirit of God was in him, and he was compassionate and merciful. He did not hold a grudge against me but loved me and my brothers. 5. Therefore, my children, guard yourselves against every kind of jealousy and envy. Live with honest and undivided hearts,[b] so that God may place favor, honor, and blessing upon your heads, just as you saw in Joseph. 6. Throughout his life Joseph never reproached us for what we had done. Instead, he loved us as dearly as his own soul, honored us above his own sons, and gave us riches, livestock, and produce.


    7. So, my children, each of you must love his brother with a good heart. Then the spirit of envy will leave you. 8. Envy makes the soul savage and destroys the body. It fills a person’s plans with anger and conflict, drives him toward bloodshed, throws his mind into a frenzy, shakes his soul, and makes his body tremble. 9. Even while he sleeps, envy consumes him by showing him wicked visions. It troubles his soul with evil spirits, makes his body start up in fear, and wakes his mind in turmoil. The envious person then appears to others like an evil and venomous spirit.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “My liver is swollen” is an ancient bodily expression for deep inner distress.
    reason: cultural_note
  - marker: b
    text: This can also be translated “live with simplicity of heart” or “with sincere hearts.”
    reason: lexical_alternative
  - marker: c
    text: The final clause may instead mean that envy itself appears like an evil, venomous spirit.
    reason: alternative_reading
