  simplified_phrase: I have now told you everything, so that I may be cleared of blame for your sin
  preserved_meaning: Simeon’s disclosure clears him of responsibility connected with their sin.
  reasoning_layer_used: POB text and applied doctrine-realignment revision
  rationale: The wording clarifies the deliberately preserved sense of “I may be cleared” without changing its claim.
- pob_phrase: the seed of Canaan
  simplified_phrase: Canaan’s descendants
  preserved_meaning: The judgment concerns the people descended from Canaan.
  reasoning_layer_used: POB text and source image
  rationale: “Descendants” communicates the genealogical meaning of “seed” in ordinary English.
- pob_phrase: all the spirits of deceit will be given over to be trampled down
  simplified_phrase: all deceiving spirits will be handed over to be trampled underfoot
  preserved_meaning: The spirits will be defeated and subjected while the trampling image remains intact.
  reasoning_layer_used: POB text and Greek source image
  rationale: The recast clause is natural English but preserves both surrender and trampling.
