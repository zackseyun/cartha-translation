translation:
  language: en
  text: '1 I have now told you everything, so that I may be cleared of blame for your sin. 2 But if you rid yourselves of envy and all hardness of heart, my bones will blossom like a rose in Israel, and my flesh like a lily in Jacob. My fragrance will be like the fragrance of Lebanon. Holy people descended from me will increase in number forever and ever, and their branches will spread far and wide.


    3 Then Canaan’s descendants will perish, and no remnant of Amalek will remain. All the Cappadocians will perish, and all the Hittites will be completely destroyed. 4 Then the land of Ham will come to ruin, and every people will perish. The whole earth will then be free from turmoil, and everything under heaven will be free from war.


    5 Then a great sign for Israel will be glorified, because the Lord God will appear on earth and come to save Adam in him. 6 Then all deceiving spirits will be handed over to be trampled underfoot, and people will rule over the evil spirits. 7 Then I too will arise full of joy and bless the Most High for his wonders.'
  philosophy: optimal-equivalence
