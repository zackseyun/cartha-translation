translation:
  language: en
  text: '1. When I was forty years old, I saw a vision on the Mount of Olives, east of Jerusalem. In the vision, the sun and moon were standing still.


    2. Then I saw Isaac, my grandfather. He said to us, “Run forward! Let each of you seize them according to his own strength. The sun and moon will belong to whoever takes hold of them.”


    3. We all ran together. Levi seized the sun, and Judah reached the moon first and took hold of it. Then Levi and Judah were lifted up with the sun and moon.


    4. While Levi was like the sun, I saw a young man handing him twelve palm branches. Judah shone brightly like the moon. Beneath their feet were twelve rays.


    5. Then the two of them, Levi and Judah, ran forward and held the sun and moon firmly.[a]


    6. Then I saw a bull on the earth. It had two great horns and eagle’s wings on its back. We tried to seize it, but we could not.


    7. But Joseph came and took hold of the bull. He went up with it to the height.


    8. I saw that I was there. Then a holy writing appeared to us and said, “Assyrians, Medes, Persians…”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This sentence is awkward in the surviving Greek and may repeat the earlier prominence of Levi and Judah.
    reason: textual_variant
  - marker: b
    text: The supplied Greek witness breaks off here, so the sentence remains unfinished.
    reason: textual_variant
