translation:
  language: en
  text: My children, I tell you this because I learned in the writing of Enoch that you too will turn away from the Lord. You will follow all the lawless ways of the nations and commit all the wicked deeds of Sodom.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: These things I say to you, my children
  simplified_phrase: My children, I tell you this
  preserved_meaning: Naphtali directly addresses his children and introduces his warning.
  reasoning_layer_used: POB translation
  rationale: The clause is reordered into natural modern English.
- pob_phrase: you too will depart from the Lord
  simplified_phrase: you too will turn away from the Lord
  preserved_meaning: They will abandon their allegiance to the Lord.
  reasoning_layer_used: POB translation and revision rationale
  rationale: “Turn away” clearly expresses departure without adding the rejected intensifier “surely.”
- pob_phrase: walking in all the lawlessness of the nations and doing all the wickedness of Sodom
  simplified_phrase: You will follow all the lawless ways of the nations and commit all the wicked deeds of Sodom
  preserved_meaning: They will imitate the nations’ lawlessness and Sodom’s wicked conduct.
  reasoning_layer_used: Greek source imagery and POB translation
  rationale: The figurative “walking” becomes clear conduct language while its force remains in “follow.”
translation_notes:
  risk_flags:
