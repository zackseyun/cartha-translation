translation:
  language: en
  text: '1. I was as swift-footed as a deer, so my father Jacob chose me to run every errand. He blessed me by comparing me to a deer.


    2. A potter knows how much a vessel can hold and uses the right amount of clay to make it. In the same way, the Lord forms the body to correspond to the spirit, and he places the spirit within it according to the body’s capacity.


    3. Nothing in this design is lacking—not even by a third of a hair. Every part of creation was made according to weight, measure, and rule.


    4. A potter knows the use of each vessel and how much it can bear. In the same way, the Lord knows the body—how long it will continue in good and when it will enter into evil.


    5. The Lord knows every purpose for which he made a person, because he created every human being in his own image.


    6. A person’s work matches that person’s strength, whether it is in the law of the Lord or in the law of Beliar.[a]


    7. Light is distinct from darkness, and seeing is distinct from hearing. In the same way, one man differs from another, and one woman differs from another. No two faces can be said to be alike in every way.[b]


    8. God made everything good and gave it a proper place. He put the five senses in the head and joined the neck to the head. He added hair for beauty; the heart for understanding; the belly for removing waste; the stomach for grinding food; the windpipe for breathing; the liver for anger; the gall for bitterness; the spleen for laughter; the kidneys for craftiness; the loins for strength; and the lungs for drawing breath. He ordered all the other parts as well.[c]


    9. So, my children, let everything you do be properly ordered toward what is good, with reverence for God. Do nothing disorderly out of contempt or outside its proper time.


    10. If you tell the eye, “Hear,” it cannot hear. If you tell the ear, “See,” it cannot see.


    11. In the same way, you cannot do the works of heaven on earth or the works of earth in heaven.


    12. God made everything beautiful at its proper time. He gave the sun authority over the day, and the moon and stars authority over the night.


    13. Therefore, my children, understand this in your hearts: just as the sun is not the moon, the righteous are not sinners, and sinners are not righteous.


    14. Their conduct, understanding, and purposes are different.


    15. A righteous person has understanding in all things, but a sinner walks in darkness and does not know what he is doing.


    16. Therefore, my children, become wise in God. Understand the proper order of everything and the right time for each thing, so that confusion does not lead you to break the law of the Lord or the law of Beliar.


    17. Instead, choose the law of the Lord. Live simply and with reverence for God, doing what is good in his sight.


    18. If you do these things, my children, you will succeed in all your work and plans, and the Lord will bless you forever.'
