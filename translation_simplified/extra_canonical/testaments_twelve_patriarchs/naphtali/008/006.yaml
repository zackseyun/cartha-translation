translation:
  language: en
  text: But anyone who does not do good will be cursed by angels and people. Because of him, God will be dishonored among the nations. The devil will claim him as his own instrument, every wild animal will rule over him, and the Lord will hate him.
  philosophy: optimal-equivalence
