  preserved_meaning: The devil claims him as belonging to and serving him, while wild animals gain mastery over him.
  reasoning_layer_used: POB translation, Greek source images, and grounding review
  rationale: “Instrument” preserves ownership and agency, while “rule over” clearly conveys continuing dominance.
