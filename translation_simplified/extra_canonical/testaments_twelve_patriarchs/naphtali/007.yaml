- pob_phrase: These things must be fulfilled in their appointed times
  simplified_phrase: These things must be fulfilled at their appointed times
  preserved_meaning: The dreams will necessarily be fulfilled at fitting, providentially ordered times.
  reasoning_layer_used: Lexical and theological decisions on δεῖ, πληρωθῆναι, and καιροί
  rationale: The natural preposition improves readability while retaining necessity, fulfillment, and appointed timing.
- pob_phrase: Alas, my child Joseph
  simplified_phrase: Oh, my son Joseph!
  preserved_meaning: Jacob cries out in grief and affection for Joseph.
  reasoning_layer_used: Lexical decision on Οἴμοι and immediate context
  rationale: The exclamation expresses lament in current English without sounding archaic.
- pob_phrase: I was burning in my inward parts
  simplified_phrase: Deep inside, I burned
  preserved_meaning: Naphtali felt intense, visceral distress and urgency to reveal the truth.
  reasoning_layer_used: Lexical decision and cultural note on ἐκαιόμην τοῖς σπλάγχνοις
  rationale: The rewrite keeps the bodily image of inner burning in a form modern readers readily understand.
