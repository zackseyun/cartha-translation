translation:
  language: en
  text: '1. I told my father about these two dreams. He replied, “These things must be fulfilled at their appointed times, after Israel has endured much suffering.”


    2. Then my father said, “I believe God: Joseph is alive. I continually see that the Lord counts him as still being with us.”


    3. Weeping, he said, “Oh, my son Joseph! You are alive, but I cannot see you, and you cannot see your father Jacob.”


    4. His words made me weep too. Deep inside, I burned to tell him that Joseph had been sold, but I was afraid of my brothers.'
  philosophy: optimal-equivalence
