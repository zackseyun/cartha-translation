translation:
  language: en
  text: Therefore, do not corrupt what you do out of greed, and do not deceive your own souls with empty words. By remaining silent with pure hearts, you will understand how to hold firmly to God’s will and reject Beliar’s will.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beliar is the evil power opposed to God.
    reason: cultural_note
