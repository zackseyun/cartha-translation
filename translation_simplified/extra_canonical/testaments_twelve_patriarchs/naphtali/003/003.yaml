simplification_decisions:
- pob_phrase: having gone astray and having forsaken the Lord
  simplified_phrase: went astray and abandoned the Lord
  preserved_meaning: The nations departed from the Lord in both direction and allegiance.
  reasoning_layer_used: POB translation and Greek source
  rationale: Finite verbs replace the heavy participial structure while keeping the two actions distinct.
- pob_phrase: altered their order
  simplified_phrase: changed their proper order
  preserved_meaning: The nations disrupted the order that rightly belonged to them without defining its precise nature.
  reasoning_layer_used: POB translation and independent grounding review
  rationale: “Proper” preserves the normative force while avoiding the added idea of an order they were instructed to follow.
- pob_phrase: gave heed to wood and stone, to spirits of deceit
  simplified_phrase: turned to idols of wood and stone and to deceiving spirits
  preserved_meaning: They directed their allegiance toward material idols and misleading spirits.
  reasoning_layer_used: Greek source image, POB rendering, and immediate context
  rationale: “Turned to” avoids overstating obedience while preserving the wood-and-stone image and its idolatrous setting.
