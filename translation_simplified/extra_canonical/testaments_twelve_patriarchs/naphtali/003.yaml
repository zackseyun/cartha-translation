translation:
  language: en
  text: '1. So do not let greed corrupt what you do, and do not deceive your own souls with empty words. For if you remain silent with pure hearts, you will understand how to hold firmly to God’s will and reject the will of Beliar.[a]


    2. The sun, moon, and stars do not leave their appointed order. In the same way, do not violate God’s law by living disorderly lives.


    3. The nations went astray and abandoned the Lord. They left their proper order and listened to wood and stone and to deceiving spirits.


    4. But you, my children, must not be like them. Throughout the sky, on the earth, in the sea, and in all created things, recognize the Lord who made everything. Then you will not become like Sodom, which changed the order of its own nature.


    5. In the same way, the Watchers[b] changed the order of their own nature. The Lord cursed them at the time of the flood, and because of them he made the earth desolate and without fruit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beliar is a name for the evil power opposed to God.
    reason: cultural_note
  - marker: b
    text: The Watchers are heavenly beings.
    reason: cultural_note
simplification_decisions:
- pob_phrase: do not be eager in greed to corrupt your deeds
  simplified_phrase: do not let greed corrupt what you do
  preserved_meaning: Greed must not be allowed to ruin a person’s conduct.
  reasoning_layer_used: POB controlling translation and Greek source image
  rationale: The rewrite turns an awkward abstract construction into a direct warning.
- pob_phrase: the firmament
  simplified_phrase: the sky
  preserved_meaning: God is to be recognized throughout the created realm above the earth.
  reasoning_layer_used: POB controlling translation and source context
  rationale: “Sky” communicates the intended realm without an opaque ancient term.
- pob_phrase: must not alter the law of God through the disorder of your deeds
  simplified_phrase: do not violate God’s law by living disorderly lives
  preserved_meaning: Disordered conduct amounts to departing from God’s law.
  reasoning_layer_used: POB controlling translation and immediate comparison
  rationale: The recast expresses the link between conduct and God’s law in ordinary English.
translation_notes:
  risk_flags:
  - risk: “Remain silent” may be mistaken for a universal ban on speaking.
    mitigation: The conditional wording is retained without adding an unsupported explanation.
  - risk: The nature changed by Sodom and the Watchers is not defined here.
    mitigation: The draft preserves the broad wording instead of resolving the ambiguity.
