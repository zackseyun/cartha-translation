translation:
  language: en
  text: 'This is a copy of the testament of Naphtali, Jacob’s eighth son. He prepared it as he approached death, at the age of 130.


    2 On the first day of the seventh month, Naphtali gathered his sons and prepared a feast for them. 3 The next morning, when he awoke, he told them, “I am dying.” But they did not believe him. 4 As he blessed and glorified the Lord, he regained his strength and said, “After yesterday’s feast, my flesh failed and died.”


    5 Then he began to speak: “Listen, my children, sons of Naphtali. Listen to your father’s words. 6 Bilhah gave birth to me because Rachel devised a cunning plan and gave Bilhah to Jacob to take her place. Bilhah conceived and gave birth to me on Rachel’s knees. That is why Rachel named me Naphtali. 7 Rachel loved me deeply because I was born on her knees. When I was still very young, she kissed me and said, ‘May I have a son from my own womb who will be your brother, like you.’ 8 So Joseph was like me in every way, just as Rachel had prayed.”'
  philosophy: optimal-equivalence
