translation:
  language: en
  text: 'Naphtali gave his sons many commands. Then he urged them to carry his bones to Hebron and bury him with his ancestors.


    2. He ate and drank with joy in his heart. Then he covered his face and died.


    3. His sons did everything exactly as their father Naphtali had commanded them.


    [Here begins the Testament of Gad, the ninth son of Jacob and Zilpah.][a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek source ends this chapter by introducing the next testament; this heading is not part of Naphtali’s final words.
    reason: textual_variant
simplification_decisions:
- pob_phrase: after commanding them many such things, he urged them
  simplified_phrase: Naphtali gave his sons many commands. Then he urged them
  preserved_meaning: Naphtali gave binding directions and then made an earnest appeal.
  reasoning_layer_used: POB lexical decisions for ἐντειλάμενος and παρεκάλεσεν
  rationale: Two direct sentences remove the vague comparison while preserving both actions.
- pob_phrase: bury him with his fathers
  simplified_phrase: bury him with his ancestors
  preserved_meaning: His bones were to be buried with his deceased forefathers.
  reasoning_layer_used: POB lexical decision for μετὰ τῶν πατέρων αὐτοῦ
  rationale: “Ancestors” directly communicates the familial burial idiom to modern readers.
- pob_phrase: after eating and drinking with gladness of soul
  simplified_phrase: He ate and drank with joy in his heart
  preserved_meaning: Naphtali ate and drank in a state of inward joy.
  reasoning_layer_used: POB lexical decision for ἐν ἱλαρότητι ψυχῆς
  rationale: The common expression makes his inward gladness immediately understandable.
translation_notes:
  risk_flags:
  - risk: “Ancestors” replaces the concrete idiom “fathers.”
    mitigation: It preserves the documented sense of burial with his forefathers.
  - risk: The closing heading could be mistaken for part of Naphtali’s final words.
    mitigation: Brackets and a textual note identify it as the transition to the next testament.
