translation:
  language: en
  text: 'My children, I tell you these things because I learned from the writing of Enoch[a] that you too will certainly turn away from the Lord. You will follow every kind of lawlessness practiced by the nations and commit all the wickedness of Sodom.


    Then the Lord will take you into captivity, and there you will serve your enemies. Your land will be devastated, and your holy places will be left deserted. You will be scattered to the four corners of the earth. The nations will despise you, and you will become a curse, a people dispersed among them, until the Most High visits the earth.[b]


    He himself will come to save Israel and all the nations—God speaking in the person of a man.[c] After he comes, unrighteousness will again increase on the earth, and all the nations will gather against him. But whoever believes in him will not be condemned in his name.


    My children, you will rise from your tribes together with Levi and Judah, but war will break out among you. The Lord will appear among human beings, and he will save Israel and all the nations.


    Therefore, do not be divided, as though you had two heads.[d] Every division between brothers is evil in the Lord’s sight, for the Lord loves singleness of purpose. My children, if you also live with this undivided purpose and follow his law, no evil spirit will have power over you. Such a spirit knows that the God of heaven is one, and it will not accept a divided mind. Love the Lord throughout your life, and love one another with sincere hearts.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The writing of Enoch” may refer to an Enochic book or tradition; the phrase does not establish its canonical status.
    reason: cultural_note
  - marker: b
    text: Here “visits” may include salvation, judgment, or both.
    reason: lexical_alternative
  - marker: c
    text: This difficult Greek wording may be read as messianic or incarnational, though some consider the line a later textual expansion.
    reason: textual_variant
  - marker: d
    text: The image may refer to inward double-mindedness, division into factions, or both.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: walking in every lawlessness of the nations
  simplified_phrase: follow every kind of lawlessness practiced by the nations
  preserved_meaning: They will imitate the nations’ rebellion against God’s order.
  reasoning_layer_used: Lexical decision for ἀνομία
  rationale: This keeps “lawlessness” while clearly stating whose conduct they follow.
- pob_phrase: you will be as something despised among the nations, a curse and a dispersion
  simplified_phrase: The nations will despise you, and you will become a curse, a people dispersed among them
  preserved_meaning: The people will be scorned and scattered among the nations under judgment.
  reasoning_layer_used: Lexical decision for διασπορά and immediate context
  rationale: The abstract “dispersion” becomes a clear description of a scattered people.
- pob_phrase: do not be divided into two heads
  simplified_phrase: do not be divided, as though you had two heads
  preserved_meaning: The vivid image warns against division without choosing between inward and communal division.
  reasoning_layer_used: Lexical decision and reviewer-preserved ambiguity
  rationale: The neutral wording retains the image and leaves both documented senses open.
translation_notes:
  risk_flags:
  - risk: The wording about God speaking in the person of a man is textually and theologically disputed.
    mitigation: The POB wording remains in the text, and the note preserves the uncertainty.
  - risk: The two-head image may concern inward double-mindedness, factional division, or both.
    mitigation: The main text remains neutral, and the note states both possibilities.
