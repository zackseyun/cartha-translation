  text: 7. Καὶ ὡς⁵³ κεχώρισται ἀνάμεσον *τοῦ φωτὸς καὶ ἀνάμεσον τοῦ σκότους⁵⁴ *δράσεώς τε καὶ ἀκοῆς⁵⁵, οὕτως⁵⁶ κεχώρισται ἀνάμεσον ἀνδρὸς καὶ *ἀνδρός, καὶ ἀνάμεσον γυναικὸς καὶ⁵⁷ γυναικός⁵⁸, καὶ οὐκ ἔστιν εἰπεῖν ὅτι †*ἐν τῷ ἑνὶ τοῖς προσώποις ἡττόμενον ἦν †⁵⁹.
  language: Greek
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/007.yaml
  text: And just as there is a division between light and darkness, and between sight and hearing, so there is also a division between man and man, and between woman and woman; and it is not possible to say that in appearance one is inferior to another.
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T14:57:16Z'
    unchanged: false
    changes_summary: Revised 'seeing' to 'sight' for a more natural rendering of ἀκοῆς/its paired noun, removed 'in all things' and 'the same as another' because they are not supported by the Greek, and rendered the difficult final clause more literally as a statement about appearance and inferiority.
translation:
  language: en
  text: Light differs from darkness, and sight differs from hearing. In the same way, one man differs from another, and one woman differs from another. Yet no one can say that one person’s appearance is inferior to another’s.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: there is a division between light and darkness, and between sight and hearing
  simplified_phrase: Light differs from darkness, and sight differs from hearing
  preserved_meaning: The two pairs are distinct from each other.
  reasoning_layer_used: POB translation and revision pass
  rationale: The direct wording makes the comparison easier to follow without merging the two pairs.
- pob_phrase: there is also a division between man and man, and between woman and woman
  simplified_phrase: one man differs from another, and one woman differs from another
  preserved_meaning: Individual men and women differ from others of the same sex.
  reasoning_layer_used: POB translation
  rationale: Ordinary comparative wording replaces the repetitive abstract phrase.
- pob_phrase: it is not possible to say that in appearance one is inferior to another
  simplified_phrase: Yet no one can say that one person’s appearance is inferior to another’s
  preserved_meaning: Differences between people do not establish inferiority in appearance.
  reasoning_layer_used: POB revision rationale
  rationale: The clause is recast in natural English while retaining appearance and inferiority.
