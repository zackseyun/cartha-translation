translation:
  language: en
  text: 'My mother Bilhah was the daughter of Rotheus. He was the brother of Deborah, Rebecca’s nurse. Bilhah was born on the same day as Rachel.


    Rotheus was a descendant of Abraham and a Chaldean. He honored God and had been born free into a noble family. But he was captured and sold to Laban. Laban gave him his servant Eunan as his wife. She bore a daughter, whom Rotheus named Zelpha after the city where he had been captured. Later Eunan bore Bilhah and said, “My daughter is one who renews.”


    I was as swift-footed as a deer. My father Jacob sent me on every kind of errand, and he blessed me by comparing me to a deer.'
