  rationale: A separate sentence makes the family relationships easier to follow.
- pob_phrase: God-fearing, freeborn and noble
  simplified_phrase: He honored God and had been born free into a noble family.
  preserved_meaning: Rotheus revered God and possessed free and noble birth status.
  reasoning_layer_used: POB lexical choices
  rationale: The religious and social descriptions are recast in familiar modern language.
- pob_phrase: appointed me for every errand; and he indeed blessed me as a deer
