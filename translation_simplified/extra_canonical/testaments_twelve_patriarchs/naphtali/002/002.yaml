  preserved_meaning: The potter supplies clay in proportion to the vessel’s intended capacity.
  reasoning_layer_used: Greek source and POB syntax
  rationale: The proportional relationship is stated in ordinary English.
- pob_phrase: according to the likeness of the spirit, makes the body
  simplified_phrase: makes the body to correspond to the spirit
  preserved_meaning: The Lord forms the body in a relationship of likeness or correspondence to the spirit.
  reasoning_layer_used: POB controlling meaning
  rationale: “Correspond” clarifies the relationship without defining its precise nature.
