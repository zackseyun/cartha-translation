translation:
  language: en
  text: For God made everything good, arranging each part for its purpose. He placed the five senses in the head and joined the neck to the head. He gave hair for beauty, the heart for understanding, the belly for passing waste, the stomach for grinding food, the windpipe for taking in air, the liver for anger, the gall for bitterness, the spleen for laughter, the kidneys for craftiness, the loins for strength, and the lungs for drawing in breath. He did the same with all the other parts.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This list presents the purposes and associations assigned to parts of the body in this work.
    reason: cultural_note
