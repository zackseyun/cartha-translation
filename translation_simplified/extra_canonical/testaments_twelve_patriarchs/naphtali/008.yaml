translation:
  language: en
  text: '1. My children, listen: I have shown you what will happen in the coming times in Israel.


    2. Now command your children to remain united with Levi and Judah. For salvation will arise for Israel through Judah, and Jacob will be blessed in him.


    3. Through Judah’s scepter, God will appear on earth and dwell among human beings.[a] He will save the people of Israel and gather the righteous from among the nations.[b]


    4. Therefore, if you also do what is good, people and angels will bless you. Through you, God will be honored among the nations. The devil will flee from you, wild animals will fear you, the Lord will love you, and the angels will stand by you.


    5. Someone who has raised a child well has good memories of that child. In the same way, a good deed is remembered favorably before God.


    6. But angels and people will curse anyone who does not do what is good. Through that person, God will be dishonored among the nations. The devil will claim that person as a vessel for his own use, every wild animal will rule over him, and the Lord will hate him.


    7. The commandments of the Law are twofold, and carrying them out requires discernment.


    8. There is a time for sexual union with a woman, and there is a time to refrain for the sake of prayer.


    9. Both are from God. But if they do not take place in their proper order, they bring very great sin upon people. The same is true of the other commandments.


    10. Therefore, my children, become wise in God and act with good judgment. Learn the proper order of his commandments and the rules for every matter, so that the Lord may love you.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some witnesses vary or expand the wording about God appearing on earth and dwelling among human beings; this text follows the fuller supplied Greek witness.
    reason: textual_variant
  - marker: b
    text: Judah and his scepter carry royal and salvation imagery that may be read messianically, but the Greek does not require a narrower interpretation.
    reason: cross_reference
