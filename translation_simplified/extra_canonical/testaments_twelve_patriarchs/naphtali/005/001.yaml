translation:
  language: en
  text: When you have been humbled, you will return to the Lord and acknowledge him as your God. Because of his great mercy, he will bring you back to your land. 4 But when they return to the land of their ancestors, they will again forget the Lord and do what is evil. 5 Then the Lord will scatter them across the whole earth, until the Lord’s compassion comes—a man who does what is right and shows mercy to everyone, both far away and near.
