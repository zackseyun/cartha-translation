- pob_phrase: being brought low
  simplified_phrase: have been humbled
  preserved_meaning: They experience a humbled or reduced condition before turning back.
  reasoning_layer_used: Greek source and POB base text
  rationale: This common wording preserves the passive force of the Greek expression.
- pob_phrase: when they go out into the land of their fathers
  simplified_phrase: when they return to the land of their ancestors
  preserved_meaning: They come again to their ancestral homeland.
  reasoning_layer_used: Immediate context and POB base text
  rationale: “Return” clarifies the movement after God brings them back to their land.
- pob_phrase: act impiously
  simplified_phrase: do what is evil
  preserved_meaning: They behave wickedly against the Lord.
  reasoning_layer_used: POB base text and immediate context
  rationale: The plain phrase communicates impious conduct without academic wording.
