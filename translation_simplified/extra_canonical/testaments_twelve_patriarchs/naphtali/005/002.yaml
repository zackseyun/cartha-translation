  reasoning_layer_used: POB translation and source payload
  rationale: Two sentences clearly distinguish the vision from what he saw in it.
- pob_phrase: Isaac, the father of my father
  simplified_phrase: my grandfather Isaac
  preserved_meaning: Isaac is identified as Naphtali’s paternal grandfather.
  reasoning_layer_used: POB kinship wording
  rationale: The familiar kinship term conveys the same family relationship directly.
- pob_phrase: Run up, and let each of you seize according to his strength
  simplified_phrase: Run up, and let each of you take hold as his strength allows
  preserved_meaning: Each person must move upward and grasp in proportion to his strength.
  reasoning_layer_used: POB translation, source payload, and latest revision pass
