translation:
  language: en
  text: In the fortieth year of my life, I had a vision on the Mount of Olives, east of Jerusalem. I saw the sun and the moon standing still. Then my grandfather Isaac said to us, “Run up, and let each of you take hold as his strength allows. Whoever takes hold will have the sun and the moon.”
