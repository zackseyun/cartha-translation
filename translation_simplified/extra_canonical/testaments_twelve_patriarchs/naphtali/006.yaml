translation:
  language: en
  text: 'Seven days later, I had another vision. My father Jacob was standing beside the sea of Amnia,[a] and we were with him. A ship sailed by us with sailors and pilots aboard. On it were written the words, “The Ship of Jacob.”


    Our father said, “Come, let us board our ship.” As soon as we boarded, a violent storm arose with a fierce whirlwind. Our father, who was holding the rudders,[b] became separated from us. The storm drove us across the sea. Water filled the ship, and the waves battered it until it was about to break apart.


    Joseph went away in a small boat. The rest of us became separated on nine planks, though Levi and Judah remained together. We were all scattered to the ends of the earth.[c] Levi put on sackcloth and prayed to the Lord.


    When the storm ended, the ship reached land as though in peace. Then our father came to us, and we all rejoiced together.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The location of the sea of Amnia is uncertain, so its Greek name is preserved.
    reason: cultural_note
  - marker: b
    text: The Greek is difficult and literally refers to “necks,” but the nautical context suggests steering equipment such as rudders.
    reason: textual_variant
  - marker: c
    text: In this dream, “the ends of the earth” may symbolize a widespread scattering.
    reason: cross_reference
