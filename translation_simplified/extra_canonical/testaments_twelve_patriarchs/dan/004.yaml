translation:
  language: en
  text: '1[a]. Anger is blindness. It keeps a person from seeing others as they truly are.


    2. A word first stirs up anger. Then actions strengthen the angry person, and painful losses provoke him further. Anger throws his intentions into confusion and fills his soul with great fury.


    3. Therefore, when someone speaks against you, do not let yourself be moved to anger. If someone praises you as holy, do not become proud. Do not let either pleasure or disgust sway you.


    4. Praise first pleases the ear. Then it sharpens the mind to notice a provocation.[b] Once a person becomes furious, he thinks his anger is justified.


    5. But if you suffer any loss or ruin, children, do not become distressed. This same spirit makes a person want to become angry over what is being lost, so that affliction draws him into anger.


    6. If you suffer loss, whether by your own choice or against your will, do not give in to grief. Grief gives rise to anger together with falsehood.[c]


    7. Anger joined with falsehood is a two-faced evil. Together they trouble the heart. When the soul remains troubled, the Lord departs from it, and Beliar rules over it.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The opening is partly missing in the supplied Greek; this wording follows the surviving sense, “anger is blindness.”
    reason: textual_variant
  - marker: b
    text: The difficult Greek may also mean “to notice what has been stirred up” or “to notice the irritation.”
    reason: alternative_reading
  - marker: c
    text: Falsehood may accompany the anger from the start, or lies may later reinforce anger born from grief.
    reason: alternative_reading
  - marker: d
    text: Beliar is a traditional name for the evil adversary, also called Belial in some English traditions.
    reason: cultural_note
