  reasoning_layer_used: POB main text and source-language image
  rationale: “Stands with” makes the relationship natural while preserving the right-hand image.
- pob_phrase: so that with cruelty and falsehood his works may be accomplished
  simplified_phrase: so that Satan’s work may be carried out through cruelty and lies
  preserved_meaning: Cruelty and deception serve the accomplishment of Satan’s work.
  reasoning_layer_used: POB syntax and immediate antecedent
  rationale: The active agents and means are stated plainly without removing either cruelty or falsehood.
- pob_phrase: with sharp losses it disturbs his mind, and so it stirs up his soul with great wrath
  simplified_phrase: Painful losses disturb his mind, and anger stirs his soul to great wrath
  preserved_meaning: Severe losses unsettle the angry person’s mind and intensify his inner wrath.
  reasoning_layer_used: POB sequential description of anger
  rationale: “Painful losses” clarifies the difficult phrase while retaining both mental disturbance and the soul-and-wrath image.
