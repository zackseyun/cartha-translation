translation:
  language: en
  text: 'This spirit always stands with falsehood at Satan’s right hand, so that Satan’s work may be carried out through cruelty and lies. Understand this about anger: its power is empty. First it provokes a person with words. Then, through actions, it strengthens the angry person. Painful losses disturb his mind, and anger stirs his soul to great wrath.'
