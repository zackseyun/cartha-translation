- pob_phrase: when anyone speaks against you, do not be moved to anger
  simplified_phrase: when someone speaks against you, do not become angry
  preserved_meaning: The hearer must not respond angrily to hostile words.
  reasoning_layer_used: POB translation and grounding review
  rationale: The active wording states the command directly in common English.
- pob_phrase: if anyone praises you as holy men, do not be exalted, either to delight or to disgust
  simplified_phrase: When someone praises you as holy, do not become proud, whether the praise makes you glad or displeased.
  preserved_meaning: Praise must not produce self-exaltation, regardless of the hearer's reaction to it.
  reasoning_layer_used: POB translation and grounding review
  rationale: “Become proud” makes the warning against self-exaltation immediately understandable.
- pob_phrase: first it is pleasing to the hearing ... becoming angry, he thinks that he is justly angry
  simplified_phrase: Praise sounds pleasant at first. Then the mind begins looking for reasons to take offense. Once a person becomes angry, he thinks his anger is justified.
  preserved_meaning: The passage traces a progression from enjoying praise to seeking offense and then excusing anger.
  reasoning_layer_used: POB causal sequence and grounding review
  rationale: Three short sentences clarify the difficult psychological sequence without merging its stages.
