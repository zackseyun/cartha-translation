translation:
  language: en
  text: So, when someone speaks against you, do not become angry. When someone praises you as holy, do not become proud, whether the praise makes you glad or displeased. Praise sounds pleasant at first. Then the mind begins looking for reasons to take offense. Once a person becomes angry, he thinks his anger is justified.
  philosophy: optimal-equivalence
