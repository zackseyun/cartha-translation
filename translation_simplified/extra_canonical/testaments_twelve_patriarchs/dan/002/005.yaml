translation:
  language: en
  text: My children, if you suffer loss or ruin, do not be distressed. This spirit makes a person desire things that do not last, so that losing them brings distress and anger. Whether the loss comes willingly or unwillingly, do not become bitter, because bitterness gives birth to false anger. Anger joined with falsehood is a double evil; together they destroy the heart. When the soul is constantly troubled, the Lord departs from it, and Beliar rules over it.
  philosophy: optimal-equivalence
