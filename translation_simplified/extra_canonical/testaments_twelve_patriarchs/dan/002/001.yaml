  preserved_meaning: Falsehood and anger remain distinct but associated corrupting influences.
  reasoning_layer_used: POB syntax and grounding review
  rationale: Repeating “the spirit” prevents readers from mistaking them for one composite influence.
- pob_phrase: love truth and long-suffering
