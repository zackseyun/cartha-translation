translation:
  language: en
  text: 'And now, my children, I am dying, and I tell you the truth: Unless you guard yourselves from the spirit of falsehood and the spirit of anger, and love truth and patient endurance, you will perish.


    Anger makes a person blind. It does not let him see anyone truthfully. He treats even his father or mother as enemies. He does not recognize his brother, disobeys a prophet of the Lord, disregards a righteous person, and does not acknowledge a friend.


    The spirit of anger surrounds him with nets of deceit and blinds his eyes. Through falsehood it darkens his mind and gives him its own distorted way of seeing. What does it cover his eyes with? Hatred in his heart, so that he envies his brother.'
  philosophy: optimal-equivalence
