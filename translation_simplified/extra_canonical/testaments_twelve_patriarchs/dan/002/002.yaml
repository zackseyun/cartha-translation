    unchanged: false
    changes_summary: Replaced the unrelated draft with the actual source sense; restored the opening address, death notice, truth formula, conditional warning, and the two objects of avoidance ('the spirit of falsehood' and 'anger').
translation:
  language: en
  text: 'Anger is evil, my children, because it disturbs the soul itself. It takes control of an angry person’s body and gains mastery over the soul. Then it empowers the body to commit every kind of lawless act. When the body does these things, the soul excuses them because it can no longer see clearly.


    Therefore, if an angry person is powerful, anger gives him three sources of power: his servants help him; his wealth enables him to persuade others and overcome them unjustly; and his own natural strength enables him to do evil. If the angry person is poor, anger gives him two sources of power, for it always helps him do wrong.'
  philosophy: optimal-equivalence
