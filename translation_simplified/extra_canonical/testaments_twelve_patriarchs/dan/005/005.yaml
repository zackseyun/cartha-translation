translation:
  language: en
  text: Whenever you turn away from the Lord and live in every kind of wickedness, you will commit the detestable practices of the nations. You will give yourselves over to sexual immorality with lawless women, and every kind of evil will be at work among you through wicked spirits.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: depart from the Lord, walking in every wickedness
  simplified_phrase: turn away from the Lord and live in every kind of wickedness
  preserved_meaning: They abandon the Lord and make wickedness their way of life.
  reasoning_layer_used: POB text and source image
  rationale: “Live in” clearly expresses the continuing conduct pictured by “walking.”
- pob_phrase: do the abominations of the nations
  simplified_phrase: commit the detestable practices of the nations
  preserved_meaning: They adopt the nations’ morally abhorrent conduct.
  reasoning_layer_used: POB text and source context
  rationale: “Detestable practices” makes the moral sense of “abominations” clear.
- pob_phrase: prostituting yourselves with lawless women
  simplified_phrase: give yourselves over to sexual immorality with lawless women
  preserved_meaning: They willingly engage in unlawful sexual wrongdoing.
  reasoning_layer_used: POB text and Greek verbal force
  rationale: The wording avoids limiting the image to commercial prostitution while preserving deliberate self-corruption.
translation_notes:
  risk_flags:
  - risk: “Sexual immorality” is broader and less vivid than the prostitution image.
    mitigation: “Give yourselves over” preserves its deliberate, reflexive force.
  - risk: “Wicked spirits” compresses “spirits of wickedness.”
    mitigation: The wording still identifies the spirits as agents through whom every kind of evil works.
