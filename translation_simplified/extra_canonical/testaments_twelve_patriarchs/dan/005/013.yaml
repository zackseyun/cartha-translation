translation:
  language: en
  text: Jerusalem will no longer lie in ruins, and Israel will no longer be carried away into captivity. For the Lord will be there among them [living among humanity], with the Holy One of Israel ruling over them [in humility and poverty. Whoever believes in him will rule among people in truth].
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: endure desolation
  simplified_phrase: lie in ruins
  preserved_meaning: Jerusalem will no longer remain devastated.
  reasoning_layer_used: POB translation and Greek source image
  rationale: The concrete wording makes the city's devastated condition immediately clear.
- pob_phrase: be taken captive
  simplified_phrase: be carried away into captivity
  preserved_meaning: Israel will no longer be forcibly subjected to captivity.
  reasoning_layer_used: POB translation and Greek source
  rationale: The fuller phrase clearly expresses forced removal into captivity.
- pob_phrase: the one who believes in him
  simplified_phrase: whoever believes in him
  preserved_meaning: The statement applies to any person who believes in him.
  reasoning_layer_used: POB translation
  rationale: The modern construction removes formality without broadening the claim.
interpretive_expansions:
- pob_phrase: in her midst ... reigning over her
  rendering: there among them ... ruling over them
  claim: The Lord's presence and the Holy One's rule concern the Jerusalem-and-Israel setting without limiting the second clause to the city alone.
  evidence:
  - Jerusalem and Israel are both named immediately before these clauses.
  - The POB retains a feminine reference whose scope is not explicitly resolved.
  confidence: moderate
  alternatives_preserved:
  - in her midst
  - reigning over her
translation_notes:
  risk_flags:
  - risk: The plural “them” makes the collective setting clearer than the source's feminine singular pronoun.
    mitigation: It avoids restricting the Holy One's rule to either the city or the people alone.
  - risk: Readers may not know why some clauses are bracketed.
    mitigation: The brackets preserve the source edition's distinction without adding an editorial footnote to the passage.
