  preserved_meaning: They must live in obedience to both the Lord’s command and his law.
  reasoning_layer_used: POB text and applied revision
  rationale: Common action verbs make the two commands immediately clear without merging them.
- pob_phrase: Depart from anger
  simplified_phrase: Turn away from anger
  preserved_meaning: They must reject anger rather than continue in it.
  reasoning_layer_used: Greek source and applied revision
  rationale: “Turn away” naturally expresses the source command to separate oneself from anger.
- pob_phrase: hate falsehood
  simplified_phrase: hate lies
  preserved_meaning: They must firmly reject what is false.
  reasoning_layer_used: POB text and Greek source
  rationale: “Lies” is the ordinary English equivalent here and retains the command’s force.
