translation:
  language: en
  text: For I have read in the book of Enoch, the righteous man, and I learned that Satan is your ruler. I also learned that the spirits of wickedness and pride will obey by attending to the sons of Levi in order to make them sin before the Lord.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the book of Enoch the righteous
  simplified_phrase: the book of Enoch, the righteous man
  preserved_meaning: Enoch is identified as righteous.
  reasoning_layer_used: POB translation
  rationale: Adding “man” makes clear that “righteous” describes Enoch.
- pob_phrase: your ruler is Satan
  simplified_phrase: Satan is your ruler
  preserved_meaning: Satan is identified as the ruler over those addressed.
  reasoning_layer_used: POB translation
  rationale: Ordinary English word order states the same claim more directly.
- pob_phrase: will obey in attending the sons of Levi, to make them sin
  simplified_phrase: will obey by attending to the sons of Levi in order to make them sin
  preserved_meaning: The spirits obey through their attendance on Levi’s sons for the purpose of causing sin.
  reasoning_layer_used: applied revision and Greek source pressure
  rationale: This clarifies the construction without narrowing attendance to physical proximity.
