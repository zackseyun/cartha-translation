  preserved_meaning: The verse gives separate promises of rest and rejoicing to the holy and the righteous.
  reasoning_layer_used: POB syntax and source clause structure
  rationale: Two sentences make the parallel promises easier to follow while keeping them distinct.
- pob_phrase: the eternal glory of God
  simplified_phrase: God’s eternal glory
