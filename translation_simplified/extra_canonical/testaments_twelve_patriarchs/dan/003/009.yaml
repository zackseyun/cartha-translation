  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/009.yaml
  text: 'Therefore the one who is angry, if he is strong in body, has acquired threefold power in his anger: one from the help of attendants; a second through wealth, persuading and prevailing unjustly; and a third, having natural strength, by it he does evil.'
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T14:54:33Z'
    unchanged: false
    changes_summary: 'Adjusted wording for closer lexical accuracy and more natural formal English: ''physically strong'' to ''strong in body,'' ''his soul’s power for anger'' to ''the power of anger in his soul,'' ''overpowering'' to ''prevailing,'' and simplified the final clause to reflect the Greek more directly.'
translation:
  language: en
  text: Therefore, when an angry person is physically strong, he has three sources of power in his anger. First, he has help from people who serve him. Second, through his wealth he persuades others and gains the upper hand unjustly. Third, he uses his own natural strength to do evil.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: has acquired threefold power in his anger
  simplified_phrase: has three sources of power in his anger
  preserved_meaning: The angry person has power through three distinct means, rather than receiving that power from anger itself.
  reasoning_layer_used: POB translation and source clause structure
  rationale: The wording clearly introduces the three-part list without making anger the source of power.
- pob_phrase: one from the help of attendants
  simplified_phrase: First, he has help from people who serve him
  preserved_meaning: The first source of power is assistance from those who attend or serve him.
  reasoning_layer_used: POB lexical choice
  rationale: This explains the unfamiliar sense of “attendants” in common English.
- pob_phrase: a third, having natural strength, by it he does evil
  simplified_phrase: Third, he uses his own natural strength to do evil
  preserved_meaning: The third source is his inherent bodily strength, which he employs for evil.
  reasoning_layer_used: POB translation and immediate context
  rationale: The participial clause becomes a direct statement while preserving the strength and its evil use.
