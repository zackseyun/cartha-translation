translation:
  language: en
  text: 'After Dan had said these things, he kissed them warmly and fell into the good sleep of death.


    2 His sons buried him. Later, they carried up his bones to the place where Abraham, Isaac, and Jacob were.


    3 But Dan prophesied to them that they would forget their God. They would become separated from the land they had inherited, from the people of Israel, and from their descendants.'
