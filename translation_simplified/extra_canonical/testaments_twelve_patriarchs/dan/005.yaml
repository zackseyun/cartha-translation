translation:
  language: en
  text: '1 Therefore, my children, obey the Lord’s commandment and keep his law. Turn away from anger and hate falsehood. Then the Lord may live in you, and Beliar may flee from you.


    2 Speak truth to your neighbor. Then you will not fall into wrath or violent unrest. Instead, you will live in peace with the God of peace, and war will certainly not overcome you.


    3 Love the Lord all your life, and love one another sincerely.


    4 I know that in the last days you will turn away from the Lord. You will provoke Levi and take your positions for battle against Judah, but you will not defeat them. An angel of the Lord guides both Levi and Judah, because through them Israel will stand.


    5 Whenever you turn away from the Lord, you will follow every kind of wickedness and practice the detestable sins of the nations. You will prostitute yourselves with lawless women, while spirits of wickedness work every kind of evil among you.


    6 I have read in the book of righteous Enoch,[a] and I learned that Satan is your ruler. I also learned that spirits of wickedness and pride will serve the sons of Levi and lead them to sin before the Lord.


    7 My sons will join themselves to Levi and share in all their sins. But the sons of Judah will be greedy, seizing what belongs to others like lions.


    8 Therefore, you will be carried away into captivity,[b] and there you will suffer all the plagues of Egypt and all the evils of the nations.


    9 But when you return to the Lord, he will show you mercy. He will bring you into his sanctuary and give you peace.


    10 Then the salvation of the Lord will arise for you from the tribe of Judah and of Levi.[c] He himself will wage war against Beliar and grant your ancestors avenging victory.


    11 He will seize back from Beliar those held captive—the souls of the holy ones.[d] He will turn disobedient hearts back to the Lord and give eternal peace to those who call on him.


    12 The holy ones will rest in Eden, and the righteous will rejoice because of the new Jerusalem, which is God’s eternal glory.


    13 Jerusalem will never again be left in ruins, and Israel will never again be taken captive. The Lord will be within Jerusalem, and the Holy One of Israel will reign over her.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek explicitly refers to the book of Enoch, reflecting Enochic traditions known in Second Temple Judaism.
    reason: cross_reference
  - marker: b
    text: Some witnesses add “with them,” explicitly linking the captivity with Levi and Judah.
    reason: textual_variant
  - marker: c
    text: The words “Judah and” vary among manuscripts, though the combined reference to Judah and Levi is well represented.
    reason: textual_variant
  - marker: d
    text: The phrase “the souls of the holy ones” is textually uncertain but identifies those freed from Beliar’s captivity.
    reason: textual_variant
  - marker: e
    text: Some witnesses add phrases about the Lord living with humanity and reigning in humility and poverty, but these are likely later expansions.
    reason: textual_variant
simplification_decisions:
- pob_phrase: you will certainly not fall into wrath and tumults
  simplified_phrase: you will not fall into wrath or violent unrest
  preserved_meaning: The warning still covers fierce anger and public conflict.
  reasoning_layer_used: Lexical decisions for μῆνις and ταραχαί
  rationale: “Violent unrest” makes the social force of “tumults” immediately clear.
- pob_phrase: you will set yourselves in battle array against Judah
  simplified_phrase: you will take your positions for battle against Judah
  preserved_meaning: The explicit military image of preparing for conflict remains intact.
  reasoning_layer_used: Lexical decision for παρατάξεσθε and doctrine realignment
  rationale: Ordinary English preserves the source’s military image.
- pob_phrase: he will take the captivity from Beliar
  simplified_phrase: He will seize back from Beliar those held captive
  preserved_meaning: Beliar loses the persons held under his power.
  reasoning_layer_used: Lexical decision for τὴν αἰχμαλωσίαν λήψεται
  rationale: The following apposition supports expressing the captives directly.
interpretive_expansions:
- pob_phrase: the spirits of wickedness working among you in every evil
  rendering: spirits of wickedness work every kind of evil among you
  claim: The spirits are active supernatural agents in the community’s evil.
  evidence:
  - The Greek participle ἐνεργούντων presents the spirits as working.
  - The theological decision preserves explicit supernatural agency.
  confidence: high
  alternatives_preserved:
  - spirits of wickedness operating in you
  - evil spirits working among you
- pob_phrase: by them Israel will stand
  rendering: through them Israel will stand
  claim: Levi and Judah are the means through whom Israel remains standing.
  evidence:
  - The immediate context names Levi and Judah as those guided by the angel.
  - The POB retains both tribes as integral to the passage.
  confidence: moderate
  alternatives_preserved:
  - by them Israel will stand
translation_notes:
  risk_flags:
  - risk: “The salvation of the Lord” may denote either a saving act or a saving figure.
    mitigation: The broad phrase and following masculine pronoun preserve the ambiguity.
  - risk: Verses 10–13 contain several textually unstable expansions.
    mitigation: The main text follows the POB core, while notes identify major variants.
