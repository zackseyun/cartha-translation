translation:
  language: en
  text: 'And now, my children, I am about to die, and I tell you the truth: Unless you guard yourselves from the spirit of falsehood[a] and anger, and unless you love truth and patient endurance,[b] you will perish.


    Anger is blindness. It keeps a person from seeing anyone truthfully. He treats even his father or mother as enemies. He no longer recognizes his own brother. He disobeys even a prophet of the Lord, disregards a righteous person, and refuses to acknowledge a friend.


    The spirit of anger traps him in nets of deceit. It blinds his eyes, darkens his mind through falsehood, and forces its own distorted way of seeing upon him. What does it use to cover his eyes? Hatred in his heart, which makes him envy his brother.


    Anger is evil, my children, because it disturbs the soul itself. It takes possession of the angry person’s body and gains mastery over his soul. Then it gives the body power to commit every lawless deed. When the body does these things, the soul excuses them because it can no longer see rightly.


    Therefore, when a powerful man is filled with anger, his anger has three sources of power. First, his servants support him. Second, his wealth enables him to persuade others and defeat them unjustly. Third, he uses his own natural strength to do evil. Even when an angry man is poor, anger still has a twofold power over him, for this spirit is always helping him do wrong.


    This spirit always goes with falsehood at Satan’s right hand, so that the works may be carried out through cruelty and falsehood.


    Understand, then, that anger’s power is empty. It begins by provoking a person through words. Then it drives the angry person into action. Severe losses disturb his mind, and in this way it stirs his soul into great wrath.


    So when anyone speaks against you, do not be driven to anger. And when anyone praises you as holy people, do not be carried away by it, whether into delight or disgust. At first, such words sound pleasing. Then the mind begins looking for reasons to feel provoked. Once the person becomes angry, he thinks his anger is justified.


    My children, if you suffer loss or ruin, do not be distressed. This same spirit makes a person desire things that will perish, so that losing them will distress him and make him angry. Whether the loss comes by your choice or against your will, do not be upset, because distress gives birth to false anger.


    Anger joined with falsehood is a double evil. They help each other destroy the heart. When the soul is continually disturbed, the Lord departs from it, and Beliar[c] rules over it.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek term can mean “falsehood” in speech or the broader quality of deceit.
    reason: lexical_alternative
  - marker: b
    text: The underlying term is traditionally rendered “long-suffering” and means patient endurance under provocation.
    reason: simplification_note
  - marker: c
    text: Beliar is a traditional form of Belial in Jewish and early Christian literature.
    reason: cultural_note
