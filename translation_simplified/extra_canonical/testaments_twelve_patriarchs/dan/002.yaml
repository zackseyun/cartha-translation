  reasoning_layer_used: Lexical decisions for πνεῦμα and δίκτυα and the theological decision on moral-spiritual agency
  rationale: The active verb clarifies the net image without reducing the spirit to a mood.
- pob_phrase: if the wrathful man is also poor, he has a twofold power of anger
  simplified_phrase: Even when an angry man is poor, anger still has a twofold power over him
  preserved_meaning: The text retains its unusual claim that anger has twofold power in a poor man without inventing two sources.
  reasoning_layer_used: POB wording and the grounding review’s ambiguity constraint
  rationale: The recast makes the direction of anger’s power clearer while leaving its two aspects unspecified.
