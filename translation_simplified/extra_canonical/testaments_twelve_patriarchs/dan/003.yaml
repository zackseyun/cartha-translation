translation:
  language: en
  text: 'If you abandon truth and patience, you will perish.


    2 Anger is a kind of blindness. It keeps a person from seeing another person’s face as it truly is. 3 Anger treats even a father or mother as an enemy. It no longer knows a brother. It refuses to obey a prophet of the Lord, fails to see a righteous person for who he is, and does not recognize a friend.


    4 The spirit of anger entangles a person in a net of deceit and blinds his eyes. Through falsehood it darkens his mind and replaces reality with a distorted view of his own. 5 What does it use to cover his eyes? Hatred in his heart against his brother, which leads to envy.


    6 Anger is evil, my children, because it throws even the soul into turmoil. 7 It gives the body strength to commit every kind of lawless deed. 8 After the body has done these things, the soul says that they were right, because it can no longer see clearly.


    9 Therefore, if an angry person is physically strong, his anger has three sources of power. First, he has helpers who support him. Second, he has wealth, which he uses to persuade and overpower others unjustly. Third, he has his own physical strength, which he uses to do evil. 10 But if the angry person is weak, the passion of wrath is twofold within him, for anger is always helping him toward wrongdoing.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: does not allow one to see anyone’s face truly
  simplified_phrase: keeps a person from seeing another person’s face as it truly is
  preserved_meaning: Anger prevents right perception while the concrete face image remains.
  reasoning_layer_used: Lexical decision for ὁρᾶν πρόσωπόν τινος ἐν ἀληθείᾳ.
  rationale: The recast idiom is immediately understandable without removing the face image.
- pob_phrase: the soul justifies what has been done
  simplified_phrase: the soul says that they were right
  preserved_meaning: The soul rationalizes evil deeds after they are committed.
  reasoning_layer_used: Lexical decision for δικαιοῖ τὰ πραχθέντα.
  rationale: Common wording preserves the moral judgment without using the technical-sounding word “justifies.”
- pob_phrase: has his soul’s power for anger threefold
  simplified_phrase: his anger has three sources of power
  preserved_meaning: Helpers, wealth, and physical strength each empower the angry person to do wrong.
  reasoning_layer_used: Source list and POB lexical decisions for attendants, wealth, and natural strength.
  rationale: A numbered list clarifies the dense construction while keeping all three sources distinct.
interpretive_expansions:
- pob_phrase: gives him his own vision
  rendering: replaces reality with a distorted view of his own
  claim: Anger substitutes the person’s self-generated, distorted perception for reality.
  evidence:
  - The POB lexical rationale identifies a self-generated perception that replaces reality.
  - The surrounding clauses connect anger with deceit, falsehood, blindness, and a darkened mind.
  confidence: high
  alternatives_preserved:
  - The spirit of anger remains an operative force without being defined as an independent being.
translation_notes:
  risk_flags:
  - risk: “Three sources of power” simplifies a grammatically difficult phrase about threefold power.
    mitigation: The rendering preserves the complete three-part list and its moral function.
  - risk: The text does not explain the two components of the weak person’s “twofold” wrath.
    mitigation: The rendering retains “twofold” without adding growth or inventing its components.
