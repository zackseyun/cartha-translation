translation:
  language: en
  text: '1. When Dan was in the fifth year of his life,[a] he gathered his family and said:


    2. “Sons of Dan, listen to me. Pay close attention to your father’s words.


    3. Throughout my life, I have learned in my own heart that truth joined with doing what is right is good and pleasing to God. But falsehood and anger are evil and lead a person into every kind of wickedness.


    4. So today I confess to you, my children, that in my heart I had decided to kill my brother Joseph, even though he was a good and truthful man.


    5. I was glad when he was sold, because our father loved him more than he loved us.


    6. The spirit of jealousy and arrogance kept telling me, ‘You are also his son.’


    7. One of the spirits of Beliar was also at work in me. It said, ‘Take this sword and kill Joseph. When he is dead, your father will love you.’


    8. The spirit of anger was urging me to destroy Joseph, just as a leopard devours a young goat.[b]


    9. But the God of my fathers[c] did not give Joseph into my hands for me to find him alone, kill him, and commit this lawless deed, lest two tribes be destroyed from Israel.”'
  philosophy: optimal-equivalence
