translation:
  language: en
  text: 'Now, my children, fear the Lord. Guard yourselves against Satan and his spirits. Come near to God and to the angel who intercedes for you. He is a mediator between God and humanity.[a] He will defend the peace of Israel by standing against the enemy’s kingdom.


    That is why the enemy is eager to trip up everyone who calls on the Lord. He knows that when Israel turns back, his kingdom will be brought to an end. The angel of peace himself will strengthen Israel so that Israel does not fall completely into evil.


    But during Israel’s lawless rebellion, the Lord will not leave them. Yet he will pass over to a nation that seeks his will, for no angel will be equal to him.[b] His name will be found everywhere in Israel and among the nations.


    So, my children, keep away from every evil deed. Put away anger and falsehood, and love truth and patience. Pass on to your children what you have heard from your father. [Then the Savior of the nations may receive you, for he is true and patient, gentle and humble. By his deeds he teaches the law of the Lord.][c]


    Therefore, turn away from everything that is wrong and hold firmly to God’s righteousness. Your descendants will be saved forever.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek calls this figure both an “angel” and a “mediator between God and humanity”; his identity is left unresolved.
    reason: lexical_alternative
  - marker: b
    text: The difficult Greek says both that the Lord will not leave Israel and that he will pass over to another nation; this tension is preserved.
    reason: alternative_reading
  - marker: c
    text: This bracketed sentence may be a later addition, but it is included because it appears in the Greek witness used here.
    reason: textual_variant
simplification_decisions:
- pob_phrase: watch yourselves against Satan and his spirits
  simplified_phrase: Guard yourselves against Satan and his spirits
  preserved_meaning: The command still requires active vigilance against Satan and his associated spirits.
  reasoning_layer_used: Lexical decision for προσέχετε ἑαυτοῖς and the revised POB wording.
  rationale: “Guard yourselves” expresses the reflexive warning in direct modern English.
- pob_phrase: for the peace of Israel he will stand against the kingdom of the enemy
  simplified_phrase: He will defend the peace of Israel by standing against the enemy’s kingdom
  preserved_meaning: The angel opposes the enemy’s kingdom for the sake of Israel’s peace.
  reasoning_layer_used: Lexical decision for κατέναντι and its conflict image.
  rationale: The recast clause clarifies the purpose while preserving the image of standing against a kingdom.
- pob_phrase: depart from all unrighteousness and cling to the righteousness of God
  simplified_phrase: turn away from everything that is wrong and hold firmly to God’s righteousness
  preserved_meaning: 'The commands remain distinct: reject wrongdoing and stay attached to God’s righteousness.'
  reasoning_layer_used: Paired lexical decisions for ἀδικίας and κολλήθητε.
  rationale: Common wording replaces abstraction while retaining the force of clinging.
interpretive_expansions:
- pob_phrase: in the time of the lawlessness of Israel
  rendering: during Israel’s lawless rebellion
  claim: Israel’s lawlessness is active moral rebellion rather than mere social disorder.
  evidence:
  - The POB rationale identifies ἀνομία as a weighty moral-apocalyptic term.
  - The context says that Israel must turn back.
  confidence: high
  alternatives_preserved:
  - during Israel’s lawlessness
  - during Israel’s transgression
- pob_phrase: your offspring will be for salvation forever
  rendering: Your descendants will be saved forever
  claim: The unusual blessing describes an enduring saving outcome for the descendants.
  evidence:
  - The POB renders the descendants as being “for salvation” forever.
  - The POB lexical rationale identifies the phrase as an enduring blessing.
  confidence: moderate
  alternatives_preserved:
  - your descendants will be for salvation forever
  - your descendants will have salvation forever
translation_notes:
  risk_flags:
  - risk: “Your descendants will be saved forever” makes the unusual phrase “for salvation” more explicit.
    mitigation: The rendering keeps the descendants as the grammatical focus and states the promised saving outcome without defining its mechanism.
  - risk: Readers may identify the angelic mediator with a later doctrinal figure.
    mitigation: Footnote a leaves the figure’s identity unresolved, as the POB requires.
