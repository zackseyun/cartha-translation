  preserved_meaning: Hostile speech must not provoke anger in the hearer.
  reasoning_layer_used: POB text and revision rationale on κινεῖσθε εἰς ὀργήν
  rationale: The active wording is clearer while preserving the movement into anger.
- pob_phrase: do not be exalted
