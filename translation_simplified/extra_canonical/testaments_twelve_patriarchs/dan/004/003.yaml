  preserved_meaning: Praise for holiness must not produce self-exaltation.
  reasoning_layer_used: POB revision rationale on ἐπαίρεσθε
  rationale: Common wording conveys the audited sense of being puffed up.
- pob_phrase: Be changed neither to delight nor to disgust
  simplified_phrase: Do not let either praise or criticism swing you toward pleasure or disgust
  preserved_meaning: Neither favorable nor hostile speech should drive the hearer into these opposing reactions.
  reasoning_layer_used: source clause order and immediate context
  rationale: Naming the two kinds of speech makes the final contrast understandable without removing either reaction.
