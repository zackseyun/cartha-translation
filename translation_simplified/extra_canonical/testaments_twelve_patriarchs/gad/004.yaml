translation:
  language: en
  text: 'Therefore, my children, guard yourselves against hatred, because it actively does what is lawless even against the Lord himself. Hatred refuses to listen to the Lord’s commands about love for one’s neighbor, and so it sins against God.


    If a brother falls by doing wrong, hatred is quick to tell everyone. It eagerly seeks to have him judged, punished, and put to death. If the person is a servant, hatred brings accusations against him before his master. It delights in every trouble that comes upon him, hoping he might be put to death.


    Hatred joins forces with envy against people who prosper. Whenever it hears or sees that they are succeeding, it wastes away. Love, by contrast, would even bring the dead to life and call back those sentenced to die. But hatred wants to kill the living and will not let even those who have sinned only a little live.


    The spirit of hatred, working through weakness of soul,[a] joins forces with Satan in everything that leads people to death. But the spirit of love, working through patient endurance, joins forces with the law of God to bring people salvation.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Weakness of soul” can also suggest discouragement, faintheartedness, or cowardice.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: it works lawlessness even against the Lord himself
  simplified_phrase: it actively does what is lawless even against the Lord himself
  preserved_meaning: Hatred acts as a moral power characterized by lawlessness against the Lord.
  reasoning_layer_used: Lexical decision for ἀνομίαν ποιεῖ
  rationale: This wording keeps lawlessness abstract while expressing hatred’s active force in common English.
- pob_phrase: hearing of their success and seeing it, it is always weakened
  simplified_phrase: Whenever it hears or sees that they are succeeding, it wastes away
  preserved_meaning: Hatred is inwardly weakened by another person’s success.
  reasoning_layer_used: Lexical decisions for ἐν προκοπῇ and ἀσθενεῖ
  rationale: The recast sentence preserves the wasting image in natural clause order.
- pob_phrase: through longsuffering, works together with the law of God
  simplified_phrase: working through patient endurance, joins forces with the law of God
  preserved_meaning: Love cooperates with God’s law through steadfast patience.
  reasoning_layer_used: Lexical decisions for μακροθυμίᾳ and συνεργεῖ
  rationale: “Patient endurance” clarifies the virtue while “joins forces” retains personified cooperation.
interpretive_expansions:
- pob_phrase: if a brother falls
  rendering: If a brother falls by doing wrong
  claim: The fall refers to moral failure rather than a physical stumble.
  evidence:
  - The following clauses concern reporting, judgment, punishment, and sin.
  confidence: high
  alternatives_preserved:
  - The image of falling remains in the text.
translation_notes:
  risk_flags:
  - risk: Love’s life-giving language could be read as a direct claim that love literally resurrects the dead.
    mitigation: The modal “would” preserves the POB’s hyperbolic moral disposition.
  - risk: “Weakness of soul” cannot carry the full range of ὀλιγοψυχία by itself.
    mitigation: The footnote preserves discouragement, faintheartedness, and cowardice as possible nuances.
