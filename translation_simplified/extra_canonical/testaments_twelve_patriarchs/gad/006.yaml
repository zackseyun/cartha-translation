translation:
  language: en
  text: '1. And now, my children, I urge you: Each of you must love your neighbor and drive hatred out of your hearts. Love one another through what you do, what you say, and your deepest intentions.


    2. When I was with my father, I spoke peacefully to Joseph. But after I left, the spirit of hatred darkened my mind and confused my thinking until I wanted to kill him.


    3. Love one another from the heart. If someone sins against you, speak to that person peacefully[a] and keep all deceit out of your heart. If he admits what he did and changes his mind, forgive him.


    4. But if he denies it, do not quarrel with him. Otherwise, he may swear an oath, and you will sin doubly.


    5. During a quarrel, do not let an outsider hear your private matter.[b] He may come to hate you, become your enemy, and commit a great sin against you. After taking in the poison of hatred from you, he may kill by treachery or trap you in evil schemes.


    6. But if he denies it and is ashamed when confronted, stop pressing the matter; do not correct him any further. He may regret having wronged you, so that he does not wrong you again; being afraid, he makes peace.[c]


    7. Even if he has no shame and continues doing wrong, forgive him from the heart. Leave vengeance to God.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts vary between “speak peace to him” and “speak to him peacefully,” but all emphasize peaceful speech without inward deceit.
    reason: textual_variant
  - marker: b
    text: The wording of verse 5 is difficult, but it warns against exposing a private matter during a quarrel and spreading hatred to an outsider.
    reason: textual_variant
  - marker: c
    text: Some manuscripts differ about the offender’s regret and fear, but shame may lead him to stop the offense and make peace.
    reason: textual_variant
simplification_decisions:
- pob_phrase: in deed and word and with the intention of the soul
  simplified_phrase: through what you do, what you say, and your deepest intentions
  preserved_meaning: Love must shape actions, speech, and inward purpose.
  reasoning_layer_used: lexical decision for διανοίᾳ ψυχῆς
  rationale: The three-part command is retained in ordinary English.
- pob_phrase: speak peace to him, and in your soul hold no deceit
  simplified_phrase: speak to that person peacefully and keep all deceit out of your heart
  preserved_meaning: The response must be peaceful outwardly and free of hidden duplicity inwardly.
  reasoning_layer_used: lexical decisions and verse 3 textual note
  rationale: The formula is clarified without merging speech and inward motive.
- pob_phrase: be still and do not reprove him further
  simplified_phrase: stop pressing the matter; do not correct him any further
  preserved_meaning: The offended person must cease confronting the ashamed offender.
  reasoning_layer_used: lexical decisions for ἡσύχασον and ἐλέγξῃς
  rationale: The practical force is clearer than the potentially opaque “be still.”
interpretive_expansions:
- pob_phrase: having taken in from you the poison
  rendering: After taking in the poison of hatred from you
  claim: The poison is hatred absorbed from the quarrel.
  evidence:
  - The POB textual note identifies “poison” as a metaphor for absorbed hatred.
  - The chapter portrays hatred as an inward force that produces violence.
  confidence: high
  alternatives_preserved:
  - The concrete poison image remains in the text.
