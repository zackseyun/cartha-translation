  text: Hatred is evil. It continually joins itself to lies and speaks against the truth. It exaggerates small matters, presents light as darkness, and calls what is sweet bitter. It teaches people to slander others and stirs up rage and war. It fills the heart with arrogance, every kind of greed, all kinds of evil, and devilish poison.
