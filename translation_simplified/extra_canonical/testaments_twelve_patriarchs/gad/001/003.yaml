translation:
  language: en
  text: So I guarded the flock at night. Whenever a lion, wolf, or any other wild animal attacked the flock, I chased it down. When I caught up with it, I seized its foot with my hand, hurled it about a stone’s throw away, and killed it.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I therefore guarded the flock by night
  simplified_phrase: So I guarded the flock at night.
  preserved_meaning: Gad connects this duty with the preceding account and says he guarded the animals during the night.
  reasoning_layer_used: POB translation and source clause order
  rationale: “So” and “at night” express the same sense in more natural English.
- pob_phrase: came against the flock
  simplified_phrase: attacked the flock
  preserved_meaning: The wild animal approached as a threat to the flock.
  reasoning_layer_used: Greek source context and POB wording
  rationale: “Attacked” makes the hostile movement clear without adding a new event.
- pob_phrase: hurl it about a stone's throw
  simplified_phrase: hurled it about a stone’s throw away
  preserved_meaning: Gad threw the animal roughly the distance a person could throw a stone.
  reasoning_layer_used: POB source-driven distance image
  rationale: The concrete image is retained while “away” makes the distance expression easier to follow.
translation_notes:
