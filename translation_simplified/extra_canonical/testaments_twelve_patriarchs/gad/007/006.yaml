translation:
  language: en
  text: A poor person who is free from envy in every situation and pleases the Lord is richer than everyone else, because the empty pursuits of vain people do not distract him.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the poor man, if being free from envy in all things he is pleasing to the Lord
  simplified_phrase: A poor person who is free from envy in every situation and pleases the Lord
  preserved_meaning: The poor person’s freedom from envy and conduct pleasing to the Lord remain the conditions in view.
  reasoning_layer_used: POB translation and independent grounding review
  rationale: The wording preserves the ethical qualification without turning it into something the person possesses.
- pob_phrase: this one is richer than all
  simplified_phrase: is richer than everyone else
  preserved_meaning: The materially poor person has a greater kind of wealth than others.
  reasoning_layer_used: POB translation
  rationale: The comparison is expressed in natural modern English.
- pob_phrase: he does not have the distraction of vain people
  simplified_phrase: the empty pursuits of vain people do not distract him
  preserved_meaning: He is not diverted by the futile preoccupations associated with vain people.
  reasoning_layer_used: POB translation and source-language image
  rationale: The recast sentence clarifies both what distracts and whose pursuits they are.
translation_notes:
  risk_flags:
  - risk: “In every situation” interprets “in all things” broadly rather than as a list of specific matters.
    mitigation: The wording preserves the comprehensive scope without adding possessions or virtues.
  - risk: “Empty pursuits” makes the nature of the distraction more explicit than the POB wording.
    mitigation: It retains the POB image of vanity or futility and does not treat all other people alike.
