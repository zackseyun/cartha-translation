  text: If he is raised even higher, do not envy him. Remember that everyone will die. Instead, offer songs of praise to the Lord, who provides everyone with what is good and helpful.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: if he is exalted still more
  simplified_phrase: if he is raised even higher
  preserved_meaning: The person advances further, without limiting that advancement to honor, position, or prosperity.
  reasoning_layer_used: POB translation, Greek source, and grounding review
  rationale: “Raised even higher” preserves the broad passive advancement and its ambiguity.
- pob_phrase: remembering that all flesh will die
  simplified_phrase: Remember that everyone will die
  preserved_meaning: Universal human mortality is the reason not to envy another person.
  reasoning_layer_used: POB translation, Greek source image, and grounding review
  rationale: The natural mortality expression conveys the image’s point without suggesting a body-person contrast.
- pob_phrase: offer hymns to the Lord, who provides good and beneficial things to all people
  simplified_phrase: offer songs of praise to the Lord, who provides everyone with what is good and helpful
  preserved_meaning: People should praise the Lord because he provides good things that benefit everyone.
  reasoning_layer_used: POB translation and applied revision
  rationale: Common wording retains praise, divine provision, goodness, benefit, and universal scope.
translation_notes:
  risk_flags:
  - risk: “Raised even higher” may still be understood spatially by itself.
    mitigation: The warning against envy makes advancement the natural contextual sense without narrowing its form.
