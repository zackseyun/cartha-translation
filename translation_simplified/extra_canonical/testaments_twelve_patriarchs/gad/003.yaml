translation:
  language: en
  text: '1[a]. Now listen to a word of truth. Listen so that you may live righteously and obey every law of the Most High. My children, do not let the spirit of hatred lead you astray, for it is evil in everything people do.


    2. Whatever a person full of hatred does is detestable. When someone obeys the law of the Lord, the person who hates does not praise them. When someone fears the Lord and desires what is righteous, the person who hates does not love them.


    3. A person full of hatred finds fault with the truth, envies the one who prospers[b], embraces slander, and loves arrogance. Hatred blinds that person’s soul. It also blinded mine when I looked at Joseph.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “listen to the true word”; the Greek opening can be understood either way.
    reason: lexical_alternative
  - marker: b
    text: “The one who prospers” may also mean “the one who succeeds” or possibly “the one who acts rightly.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: listen in order to practice righteousness and every law of the Most High
  simplified_phrase: Listen so that you may live righteously and obey every law of the Most High
  preserved_meaning: Hearing must lead to upright conduct and obedience to every law of the Most High.
  reasoning_layer_used: Lexical decisions for τοῦ ποιεῖν, δικαιοσύνην, and νόμον ὑψίστου
  rationale: Concrete verbs make the exhortation easier to follow while preserving righteousness and the divine title.
- pob_phrase: whatever the one who hates may do, it is abominable
  simplified_phrase: Whatever a person full of hatred does is detestable
  preserved_meaning: The conduct produced by hatred is condemned as morally repulsive.
  reasoning_layer_used: Lexical decision for βδελυκτόν
  rationale: “Detestable” gives the strong condemnation in familiar modern English.
- pob_phrase: He reproaches the truth ... because hatred blinds his soul, as it did mine when I looked at Joseph
  simplified_phrase: A person full of hatred finds fault with the truth ... Hatred blinds that person’s soul. It also blinded mine when I looked at Joseph.
  preserved_meaning: Hatred corrupts a person’s judgment, as Gad confesses it corrupted his view of Joseph.
  reasoning_layer_used: Lexical decisions for ψέγει and ἐκτυφλοῖ τὴν ψυχήν
  rationale: Explicit subjects and shorter sentences clarify the contrast while retaining the blindness image.
translation_notes:
  risk_flags:
  - risk: “The spirit of hatred” may suggest either a spiritual power or personified hatred.
    mitigation: The wording preserves the POB ambiguity without identifying the spirit as a demon.
  - risk: “Prospers” may narrow a Greek expression that can also mean succeeding or acting rightly.
    mitigation: The footnote retains the documented alternatives while the main text keeps the contextually favored reading.
