translation:
  language: en
  text: '1 So, my children, I confess my sin: many times I wanted to kill him because I hated him with my whole being. 2 His dreams made me hate him even more. I wanted to wipe him from the land of the living, as a calf licks up the green growth in a field. 3 But Judah secretly sold him to the Ishmaelites. 4 In this way, the God of our fathers rescued him from our hands, so that we might not commit a great lawless deed in Israel.


    3 Another textual form reads:[a] Simeon and I sold him to the Ishmaelites for thirty pieces of gold. We hid ten and showed our brothers only twenty. 4 Greed made us fully determined to murder him. 5 But the God of my fathers rescued him from my hands, so that I might not commit a lawless deed in Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek preserves two forms of this account, so both are translated rather than combined into one narrative.
    reason: textual_variant
simplification_decisions:
- pob_phrase: I hated him from my soul
  simplified_phrase: I hated him with my whole being
  preserved_meaning: Gad describes intense hatred involving his entire inner self.
  reasoning_layer_used: Lexical decision for ἐμίσουν ... ἐκ ψυχῆς
  rationale: This preserves the idiom’s full force in natural modern English.
- pob_phrase: because of the dreams I added hatred toward him
  simplified_phrase: His dreams made me hate him even more
  preserved_meaning: Joseph’s dreams increased Gad’s existing hatred.
  reasoning_layer_used: Lexical decisions for ἐνύπνια and προσεθέμην ... τὸ μῖσος
  rationale: The active sentence clearly expresses increased hatred.
- pob_phrase: through greed, we were fully set on his murder
  simplified_phrase: Greed made us fully determined to murder him
  preserved_meaning: Greed brought them to settled murderous intent.
  reasoning_layer_used: Lexical decisions for πλεονεξίᾳ, ἐπληροφορήθημεν, and ἀναιρέσεως
  rationale: The recast sentence makes the cause and murderous resolve clear.
translation_notes:
  risk_flags:
  - risk: Presenting both textual forms in sequence may look like a narrative contradiction.
    mitigation: The label and footnote identify the second passage as another textual form.
  - risk: The phrase “wipe him from the land of the living” could obscure the Greek licking image.
    mitigation: The calf simile retains the concrete image of licking up green growth.
