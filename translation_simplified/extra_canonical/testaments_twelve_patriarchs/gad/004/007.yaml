translation:
  language: en
  text: The spirit of hatred works through loss of courage. In everything, it works together with Satan toward people's death. But the spirit of love works through patient endurance. It works together with God's law toward people's salvation.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: through faintheartedness
  simplified_phrase: works through loss of courage
  preserved_meaning: Hatred operates by means of an inner failure of courage.
  reasoning_layer_used: POB text and Greek source syntax
  rationale: This explains the uncommon term while preserving its role as the means by which hatred works.
- pob_phrase: through longsuffering
  simplified_phrase: works through patient endurance
  preserved_meaning: Love acts by patiently enduring difficulty or injury.
  reasoning_layer_used: POB text and Greek source term
  rationale: Patient endurance expresses the biblical quality in common English.
- pob_phrase: works together with ... for the death/salvation of men
  simplified_phrase: works together with ... toward people's death/salvation
  preserved_meaning: Each spirit cooperates with an opposing power toward death or salvation.
  reasoning_layer_used: POB controlling translation and parallel clause structure
  rationale: The wording preserves cooperation and the opposing outcomes without treating either partner as something joined.
