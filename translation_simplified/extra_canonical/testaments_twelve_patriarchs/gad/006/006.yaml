  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/006.yaml
  text: But if he denies it and is ashamed when reproved, be still; do not reprove him. For the one who denies it repents of having sinned against you, so that he may not do wrong to you again, and being afraid he makes peace.
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T14:54:58Z'
    unchanged: false
    changes_summary: Replaced 'do not keep reproving him' with the more direct 'do not reprove him' to match the Greek without added aspect; changed 'done wrong' to 'sinned' for πλημμελῆσαι; adjusted punctuation for smoother formal English while preserving the final clause about making peace.
translation:
  language: en
  text: But if he denies it and feels ashamed when you correct him, say no more; do not rebuke him. For the one who denies it repents of sinning against you so that he may not wrong you again, and, being afraid, makes peace.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: is ashamed when reproved
  simplified_phrase: feels ashamed when you correct him
  preserved_meaning: He responds with shame when confronted about his wrongdoing.
  reasoning_layer_used: POB translation and revision history
  rationale: The active wording clarifies the interaction without changing the act of reproof.
- pob_phrase: be still; do not reprove him
  simplified_phrase: say no more; do not rebuke him
  preserved_meaning: The hearer must stop speaking and refrain from reproof.
  reasoning_layer_used: Greek source and applied revision
  rationale: “Say no more” explains the command to be still while keeping the separate prohibition.
- pob_phrase: so that he may not do wrong to you again
  simplified_phrase: so that he may not wrong you again
  preserved_meaning: His repentance is directed toward avoiding another offense, not a guarantee that none will occur.
  reasoning_layer_used: POB translation and grounding review
  rationale: The modal “may not” preserves the intended result without turning it into a prediction.
translation_notes:
  risk_flags:
  - risk: The statement that someone who denies the offense also repents may sound contradictory.
    mitigation: The wording preserves this tension because it is explicit in the POB and Greek source.
  - risk: The relationship between fear and making peace is not fully specified.
    mitigation: “Being afraid” preserves their association without asserting direct causation.
