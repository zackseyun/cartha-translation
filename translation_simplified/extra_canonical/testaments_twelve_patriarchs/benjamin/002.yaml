translation:
  language: en
  text: '1 When we went down to Egypt,[a] my brother Joseph recognized me. He said, “They smeared your tunic with blood and said, ‘See whether this is your son’s tunic.’”


    2 Then he told me, “Yes, brother. When the Ishmaelites took me away, one of them stripped off my tunic and gave me a loincloth. After flogging me, he ordered me to run.


    3 “While he was going away to hide my tunic, a lion met him and killed him.[b]


    4 “His companions became afraid, so they sold me to other traders in their group.”[c]


    5 Joseph was not lying when he told me these things. He wanted to hide from me what our brothers had done.


    6 Then he called his brothers to him and said,


    7 “Do not tell my father what you did to me. Instead, tell him this, just as I explained it to Benjamin.


    8 “Keep such thoughts in mind, and do not let the words come…”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some witnesses say more explicitly, “They sent it and said, ‘See whether this is your son’s tunic.’”
    reason: textual_variant
  - marker: b
    text: Other witnesses describe this differently, but all say that a wild beast, usually a lion, killed the man handling Joseph’s tunic.
    reason: textual_variant
  - marker: c
    text: Some manuscripts say they sold Joseph to Ishmaelites rather than to other traders in the group.
    reason: textual_variant
  - marker: d
    text: The Greek text breaks off here, so the sentence remains unfinished.
    reason: textual_variant
simplification_decisions:
- pob_phrase: after flogging me, he told me to run
  simplified_phrase: After flogging me, he ordered me to run
  preserved_meaning: Joseph was beaten and then compelled to run.
  reasoning_layer_used: Lexical decisions for φραγελλώσας and τρέχειν
  rationale: “Ordered” clearly conveys the captor’s coercive command.
- pob_phrase: sold me to others of their company
  simplified_phrase: sold me to other traders in their group
  preserved_meaning: The frightened companions sold Joseph to other members of the associated company.
  reasoning_layer_used: Lexical decision for μέτοχοι and the textual apparatus
  rationale: “Traders in their group” makes the otherwise vague company relationship clear.
- pob_phrase: the deeds of our brothers
  simplified_phrase: what our brothers had done
  preserved_meaning: Joseph intentionally concealed his brothers’ guilty actions from Benjamin.
  reasoning_layer_used: Lexical and theological decisions on the brothers’ deeds and Joseph’s concealment
  rationale: The wording is natural English while retaining the concrete wrongdoing and Joseph’s restraint.
