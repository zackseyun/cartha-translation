translation:
  language: en
  text: '1. So now, my children, you too must love the Lord, the God of heaven and earth. Keep his commandments and follow the example of Joseph, a good and holy man.


    2. Keep your minds focused on what is good, as you know I do. When a person’s mind is set right, that person sees things rightly.


    3. Fear the Lord and love your neighbor. Even if the spirits of Beliar drive you into every kind of evil and distress, they will certainly not rule over you. They did not rule over my brother Joseph. 4. Many people wanted to kill him, but God sheltered him. The spirit of Beliar cannot strike a person who fears God and loves his neighbor, because the fear of God shelters him. 5. Neither human plots nor animals[a] can overpower him, because the Lord helps him through the love he has for his neighbor.


    6. Joseph even begged our father to pray for his brothers. He asked that the Lord not count their sin against them, though they had done evil to him.


    7. Then Jacob cried out, “My good child, you have moved your father Jacob to the depths of his heart!” He embraced Joseph and kept kissing him for two hours. Then he said, 8. “The heavenly prophecy will be fulfilled concerning you.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some witnesses have additional or differing wording about beasts or an “aerial spirit,” showing that the description of hostile powers is textually uncertain.
    reason: textual_variant
  - marker: b
    text: Or “The prophecy from heaven will be fulfilled upon you.” The wording varies slightly among the witnesses.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: imitating the good and holy man Joseph
  simplified_phrase: follow the example of Joseph, a good and holy man
  preserved_meaning: Joseph remains the moral example the children must imitate.
  reasoning_layer_used: lexical decision for μιμούμενοι
  rationale: “Follow the example” makes the command immediately clear.
- pob_phrase: if the spirits of Beliar should drive you into every wickedness of affliction
  simplified_phrase: Even if the spirits of Beliar drive you into every kind of evil and distress
  preserved_meaning: Hostile spirits may drive people toward wickedness and affliction but cannot rule them.
  reasoning_layer_used: lexical decision for ἐκστήσωσι and immediate context
  rationale: The rewrite clarifies the noun chain while retaining the force of “drive.”
- pob_phrase: you have stirred the inward affection of Jacob your father
  simplified_phrase: you have moved your father Jacob to the depths of his heart
  preserved_meaning: Joseph deeply stirs Jacob’s visceral affection.
  reasoning_layer_used: lexical decision for σπλάγχνα
  rationale: The heart image naturally conveys profound inward affection.
translation_notes:
  risk_flags:
  - risk: Verse 5 has unstable wording about animals and hostile powers.
    mitigation: The main POB reading is retained and the uncertainty is noted.
  - risk: “The fear of God shelters him” could be read as merely psychological.
    mitigation: The wording preserves the POB image of God-directed fear as a sheltering power.
