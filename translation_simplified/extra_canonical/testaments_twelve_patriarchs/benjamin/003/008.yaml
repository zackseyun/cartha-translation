  preserved_meaning: His death brings salvation to the nations and Israel and destruction to Beliar and his forces.
  reasoning_layer_used: POB translation and Greek purpose phrases
  rationale: Direct purpose verbs replace abstract nouns while keeping the two outcomes distinct.
