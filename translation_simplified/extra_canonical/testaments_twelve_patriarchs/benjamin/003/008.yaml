  text: “The prophecy from heaven about you will come true [concerning the Lamb of God and Savior of the world]. The blameless one will be handed over by lawless people, and the sinless one will die for ungodly people [in the blood of the covenant, to save the nations and Israel, and to destroy Beliar and his servants].”†[†]
