  preserved_meaning: A prophecy of heavenly origin concerning Benjamin will reach fulfillment.
  reasoning_layer_used: POB translation and Greek source payload
  rationale: Common wording replaces the formal phrases “heavenly prophecy” and “will be fulfilled.”
- pob_phrase: the blameless one will be handed over by lawless men
  simplified_phrase: the blameless one will be handed over by lawless people
  preserved_meaning: An innocent person will be delivered up by people who defy the law.
  reasoning_layer_used: POB translation and immediate clause structure
  rationale: “People” is natural modern English without unnecessarily implying males only.
- pob_phrase: for the salvation of the nations and of Israel, and for the destruction of Beliar and his servants
