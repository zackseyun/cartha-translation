translation:
  language: en
  text: '7. He keeps his mind pure, so that neither people nor God will condemn him. In the same way, Beliar’s works are double and divided; they have no simplicity or single-heartedness.


    Therefore, my children, I tell you: flee from Beliar’s evil,[a] because he gives a sword to those who obey him. This sword is the mother of seven evils. First, the mind conceives through Beliar, and these are its offspring: envy, destruction, suffering, captivity,[b] severe need, turmoil, and desolation.


    Because of this, Cain was handed over to seven acts of vengeance. In one hundred years, the Lord brought one plague after another upon him. In the nine-hundredth year, Cain was made desolate.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This Greek witness uses the name Beliar, also known as Belial.
    reason: lexical_alternative
  - marker: b
    text: The Greek text is uncertain here; “captivity” is supported by parallel forms and fits the sequence of disasters.
    reason: textual_variant
