  simplified_phrase: Beliar’s works are double and divided; they have no simplicity or single-heartedness
  preserved_meaning: Beliar’s evil has a divided character opposed to moral singleness.
  reasoning_layer_used: POB theological decision on simplicity and doubleness
  rationale: The added terms show that “simplicity” means an undivided moral character, not limited intelligence.
- pob_phrase: the sword is the mother of seven evils ... the mind conceives through Beliar, and these are its births
  simplified_phrase: This sword is the mother of seven evils. First, the mind conceives through Beliar, and these are its offspring
  preserved_meaning: The linked mother, conception, and offspring images portray evil as generating further evils.
  reasoning_layer_used: POB lexical decisions for μάχαιρα and συλλαμβάνει
  rationale: The wording clarifies the imagery without assigning the offspring more precisely than the POB does.
- pob_phrase: affliction ... want
  simplified_phrase: suffering ... severe need
  preserved_meaning: The list includes oppressive suffering and serious deprivation.
  reasoning_layer_used: POB lexical alternatives for θλῖψις and ἔνδεια
  rationale: These common expressions preserve the catalogue’s force without archaic wording.
