translation_notes:
  risk_flags:
  - risk: “At the visitation of” remains unusual because the source leaves the visitation’s agency and relationship to the prophet open.
    mitigation: The wording preserves that ambiguity rather than assigning the action to God or the prophet.
  - risk: “Spread-out curtain” may be associated too narrowly with the familiar temple veil.
    mitigation: The footnote preserves the Greek expression’s broader temple-drapery sense.
