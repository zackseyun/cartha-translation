translation:
  language: en
  text: '1. I also tell you what the righteous Enoch foretold: You will commit the sexual immorality of Sodom, and you will be destroyed—but only for a short time. Then you will be made new again, yet the kingdom of the Lord will not be among you.


    2. Even so, the temple of God will stand in the land allotted to you. The last temple will be more glorious than the first. The twelve tribes and all the nations will gather there, until the Most High sends his salvation at the visitation of an only-begotten prophet.[b]


    3. He will enter the first temple. There the Lord will be shamefully abused and lifted up on wood.[c][a]


    4. The temple’s spread-out curtain will be torn,[d] and the Spirit of God will pass over to the nations like fire being poured out.


    5. After he has come up from Hades,[e] he will pass from earth to heaven. I know how lowly he will be on earth and how glorious he will be in heaven.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Verses 3–5 are textually uncertain and may be a later expansion, but they are included because they appear in the supplied Greek text.
    reason: textual_variant
  - marker: b
    text: “Only-begotten prophet” may also be translated “unique prophet.”
    reason: lexical_alternative
  - marker: c
    text: “Lifted up on wood” preserves the Greek image, which may refer to a tree or wooden stake.
    reason: lexical_alternative
  - marker: d
    text: The unusual Greek expression describes spread-out temple drapery, often understood as the temple veil.
    reason: lexical_alternative
  - marker: e
    text: Hades is the realm of the dead, not necessarily the final place of punishment.
    reason: cultural_note
simplification_decisions:
- pob_phrase: you will commit the fornication of Sodom, and you will perish for a little while
  simplified_phrase: You will commit the sexual immorality of Sodom, and you will be destroyed—but only for a short time
  preserved_meaning: The wording retains Sodom’s sexual sin, severe judgment, and the judgment’s limited duration.
  reasoning_layer_used: Lexical decisions for πορνεύσετε / πορνείαν and ἀπολεῖσθε ἕως βραχύ
  rationale: Common wording makes both the offense and the brief duration of judgment immediately clear.
- pob_phrase: there the Lord will be treated with outrage
  simplified_phrase: There the Lord will be shamefully abused
  preserved_meaning: The Lord remains the stated referent and suffers grave, dishonoring mistreatment.
  reasoning_layer_used: Lexical decision for ὑβρισθήσεται and theological decision on the referent
  rationale: The rewrite expresses the shameful mistreatment plainly without changing the unresolved referent.
- pob_phrase: the curtain-spread of the temple will be torn
  simplified_phrase: The temple’s spread-out curtain will be torn
  preserved_meaning: The temple drapery and the source term’s spreading image remain distinct from the ordinary term for a veil.
  reasoning_layer_used: Lexical decision for τὸ ἅπλωμα τοῦ ναοῦ and doctrine realignment
  rationale: Natural word order improves readability while the note explains the unusual image.
