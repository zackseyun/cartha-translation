translation:
  language: en
  text: He will expose Israel’s guilt among the chosen people from the nations, just as he exposed Esau’s guilt among the Midianites, who deceived their brothers. [Through sexual immorality and idol worship, they were alienated from God.][a] Thus they became children with a place among those who fear the Lord.
