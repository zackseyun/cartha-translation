- pob_phrase: convict Israel
  simplified_phrase: expose Israel’s guilt
  preserved_meaning: God shows Israel to be in the wrong rather than merely accusing Israel.
  reasoning_layer_used: POB translation and immediate comparison
  rationale: This expresses the judicial sense of “convict” in common English.
- pob_phrase: fornication and idolatry
  simplified_phrase: sexual immorality and idol worship
  preserved_meaning: The clause names sexual sin and worship directed to idols as distinct offenses.
  reasoning_layer_used: POB lexical wording
  rationale: These familiar terms preserve both offenses without archaic wording.
- pob_phrase: children in the portion of those who fear the Lord
  simplified_phrase: children with a place among those who fear the Lord
  preserved_meaning: They belong within the allotted group of people who reverence the Lord.
  reasoning_layer_used: POB source-driven rendering
  rationale: This clarifies the difficult allotted-portion expression while retaining belonging and group imagery.
