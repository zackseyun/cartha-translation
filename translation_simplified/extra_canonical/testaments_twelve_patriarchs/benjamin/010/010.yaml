  previous_text: He will expose Israel’s guilt among the chosen people from the nations, just as he exposed Esau’s guilt among the Midianites. They deceived their brothers, leading them into sexual immorality and idol worship and separating them from God.[a] Thus they became children with a place among those who fear the Lord.
