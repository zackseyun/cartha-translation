translation:
  language: en
  text: When someone is honored, he does not envy him. When someone becomes rich, he is not jealous. When someone is brave, he praises him. He loves those who practice self-control, shows mercy to the poor, shares the suffering of the weak, and fears God.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: If anyone is glorified
  simplified_phrase: When someone is honored
  preserved_meaning: Another person receives public honor or praise.
  reasoning_layer_used: POB text and Greek source
  rationale: “Honored” expresses the social sense more clearly than “glorified” here.
- pob_phrase: he loves the self-controlled man
  simplified_phrase: He loves those who practice self-control
  preserved_meaning: He values people who govern their conduct wisely.
  reasoning_layer_used: POB text
  rationale: The plural wording avoids the stiff generic phrase “the ... man.”
- pob_phrase: he suffers together with the weak
  simplified_phrase: shares the suffering of the weak
  preserved_meaning: He compassionately enters into the hardship of weak people.
  reasoning_layer_used: POB text and Greek source image
  rationale: The recast phrase is natural English while retaining the image of suffering with others.
translation_notes:
  risk_flags:
