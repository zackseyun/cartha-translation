translation:
  language: en
  text: 'This is a record of the words Benjamin gave to his sons when he was 125 years old. Benjamin was the twelfth son of Jacob.


    After kissing his sons, he said:


    “Just as Abraham had Isaac in his old age, so my father Jacob had me in his old age. Rachel, my mother, died while giving birth to me.[a] She could not nurse me, so Bilhah, her servant, nursed me instead.


    “After Rachel gave birth to Joseph, she was unable to have another child for twelve years. She prayed to the Lord while fasting. Then she conceived and gave birth to me. My father loved Rachel deeply, and he prayed that he would see her bear two sons. That is why I was named Benjamin, which means ‘son of days.’[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek wording is textually difficult here, but the context indicates that Rachel died while giving birth to Benjamin.
    reason: textual_variant
  - marker: b
    text: Genesis more commonly explains the name Benjamin differently, but this Greek testament gives the meaning “son of days.”
    reason: cross_reference
simplification_decisions:
- pob_phrase: The Copy of the Words of Benjamin ... which he set in order for his sons, having lived one hundred and twenty-five years
  simplified_phrase: This is a record of the words Benjamin gave to his sons when he was 125 years old.
  preserved_meaning: The passage records Benjamin’s deliberate words to his sons at the age of 125.
  reasoning_layer_used: The lexical decision treats the words as Benjamin’s formal final charge.
  rationale: The new sentence replaces the dense title and participial structure with direct modern English.
- pob_phrase: Rachel was barren for twelve years after she had borne Joseph
  simplified_phrase: After Rachel gave birth to Joseph, she was unable to have another child for twelve years.
  preserved_meaning: Rachel experienced twelve years of infertility after Joseph’s birth.
  reasoning_layer_used: The lexical decision identifies στείρευσεν as infertility language.
  rationale: The wording explains “barren” without requiring familiarity with biblical vocabulary.
- pob_phrase: my father loved Rachel exceedingly, and he prayed to see two sons from her
  simplified_phrase: My father loved Rachel deeply, and he prayed that he would see her bear two sons.
  preserved_meaning: Jacob’s intense love for Rachel and his prayer for two sons from her remain distinct.
  reasoning_layer_used: The lexical decision preserves the intensity of Σφόδρα ἠγάπα.
  rationale: “Deeply” and “bear two sons” communicate the same ideas in natural English.
