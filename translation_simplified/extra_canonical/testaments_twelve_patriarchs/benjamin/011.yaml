translation:
  language: en
  text: '1 I will no longer be called a wolf that tears apart its prey because of your ravaging.[a] Instead, I will be a worker of the Lord, giving food to those who do good.


    2 In the last times, one who is beloved by the Lord will arise from my descendants. He will hear his voice and do what he wills. He will bring the light of new knowledge to all the nations. He will come to Israel with salvation,[b] snatch away from them like a wolf, and give to the gathering of the nations.


    3 Until the end of the age, he will be present in the assemblies of the nations and among their rulers, like a melody on everyone’s lips.


    4 His work and his words will be recorded in holy books, and he will be God’s chosen one forever.


    5 Through him, he will pass through again as my father Jacob, saying, “He will supply what your tribe lacks.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek text of this chapter is difficult, especially in verse 2, and appears to contain expanded or repeated wording.
    reason: textual_variant
  - marker: b
    text: The Greek may also mean “intervene in Israel with salvation.”
    reason: lexical_alternative
  - marker: c
    text: The opening of verse 5 is obscure and may describe a renewed visit or representation through the future figure.
    reason: textual_variant
