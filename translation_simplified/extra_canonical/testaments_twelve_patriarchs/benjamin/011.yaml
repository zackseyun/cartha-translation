- pob_phrase: enlightening all the nations with new knowledge
  simplified_phrase: bring the light of new knowledge to all the nations
  preserved_meaning: The figure gives new knowledge to every nation through an image of illumination.
  reasoning_layer_used: POB lexical and theological decisions for γνῶσιν καινήν and ἔθνη
  rationale: The recast metaphor retains both light and knowledge in clearer English.
- pob_phrase: like a musical strain in the mouth of all
  simplified_phrase: like a melody on everyone’s lips
  preserved_meaning: The figure is compared to music spoken or sung by everyone.
  reasoning_layer_used: POB lexical decision for μουσικὸν μέλος
  rationale: The familiar expression preserves the poetic comparison.
