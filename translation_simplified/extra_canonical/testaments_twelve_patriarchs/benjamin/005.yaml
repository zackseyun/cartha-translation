translation:
  language: en
  text: '1. So if your minds are set on what is good, even wicked people will live at peace with you. Those who live lawlessly will be ashamed before you and turn back to what is good. Greedy people will not only turn away from their greedy craving, but will also give the goods they greedily held to people in distress.


    2. If you keep doing good, even unclean spirits will flee from you, and wild animals will be afraid of you.


    3. For where there is fear connected with good deeds[a] and light within the mind, darkness flees from that mind.


    4. If anyone violently mistreats a holy man, he changes his mind. The holy man has mercy on those who insult him and remains silent.


    5. If anyone betrays and insults a righteous person, that righteous person prays. Though he may be brought low for a little while, before long he appears far more radiant, just as my brother Joseph did.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This difficult phrase may mean reverence associated with good deeds or fear produced by a life of goodness.
    reason: alternative_reading
  - marker: b
    text: Joseph was brought low for a time but was later honored and vindicated; see Genesis 37; 39–45.
    reason: cross_reference
simplification_decisions:
- pob_phrase: have a good mind
  simplified_phrase: your minds are set on what is good
  preserved_meaning: The phrase describes an inward moral orientation toward goodness.
  reasoning_layer_used: POB lexical decision for διάνοιαν
  rationale: The wording makes the ethical sense of “mind” immediately clear.
- pob_phrase: withdraw from their passion ... the things of greed that they had possessed
  simplified_phrase: turn away from their greedy craving ... the goods they greedily held
  preserved_meaning: Greedy people abandon both their inward drive and the possessions bound up with it.
  reasoning_layer_used: POB lexical decisions for πάθος and τὰ τῆς πλεονεξίας
  rationale: The rewrite distinguishes the craving from the goods without claiming how they were acquired.
- pob_phrase: does violence to a holy man ... those who revile him
  simplified_phrase: violently mistreats a holy man ... those who insult him
  preserved_meaning: The offender seriously abuses the holy man, who answers verbal abuse with mercy and silence.
  reasoning_layer_used: POB lexical decisions and doctrine realignment
  rationale: Common wording preserves the severity of the first act and the verbal nature of the second.
