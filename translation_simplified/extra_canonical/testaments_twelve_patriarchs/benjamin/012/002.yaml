translation:
  language: en
  text: 'His sons obeyed his command. They carried his body to Hebron and buried him there with his ancestors.


    When he had finished speaking, he said, “My children, I command you to take my bones up from Egypt and bury me in Hebron near my ancestors.”


    Benjamin died at the good old age of 125, and they placed his body in a coffin.'
