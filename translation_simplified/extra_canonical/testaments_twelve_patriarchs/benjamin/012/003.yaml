translation:
  language: en
  text: In the ninety-first year after the Israelites left Egypt, they and their brothers secretly carried their fathers’ bones up amid the war in Canaan. They buried them in Hebron beside the feet of their ancestors.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: “Beside the feet of their ancestors” follows the Greek literally; it may mean near the ancestral tombs rather than directly at their feet.
    reason: lexical_alternative
