    unchanged: false
    changes_summary: Revised 'the last ... the first' to 'the latter ... the former' for more natural English in this contrast, and adjusted the gathering clause so both 'the twelve tribes' and 'all the nations' are clearly subjects of 'will be gathered,' matching the Greek more closely.
translation:
  language: en
  text: Yet God’s temple will be in the land assigned to your tribe, and the later temple will be more glorious than the first. There the twelve tribes and all the nations will be gathered until the Most High sends his salvation in the visitation of an only-begotten prophet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “In the visitation” refers to the visitation associated with an only-begotten prophet; the precise relationship is left open by the source.
    reason: source_note
simplification_decisions:
- pob_phrase: in your allotted portion
  simplified_phrase: in the land assigned to your tribe
  preserved_meaning: The temple will be located in Benjamin’s assigned tribal territory.
  reasoning_layer_used: POB base text and immediate testament context
  rationale: This makes the territorial meaning of “portion” clear without changing its reference.
- pob_phrase: the latter will be more glorious than the former
  simplified_phrase: the later temple will be more glorious than the first
  preserved_meaning: A later temple is contrasted with the earlier temple in glory.
  reasoning_layer_used: applied revision and Greek contrast
  rationale: Naming the temple clarifies the comparison while preserving the audited contrast.
- pob_phrase: there the twelve tribes and all the nations will be gathered
  simplified_phrase: There the twelve tribes and all the nations will be gathered
  preserved_meaning: Both Israel’s twelve tribes and all nations are included, while the gathering’s agency remains unstated.
  reasoning_layer_used: latest revision rationale and Greek passive syntax
  rationale: The reordered clause reads naturally while retaining the source’s passive formulation.
translation_notes:
  risk_flags:
  - risk: “In the visitation” remains unfamiliar and its precise relation to the sending of salvation is ambiguous.
    mitigation: The wording preserves the source’s breadth, and the footnote explains the association without making it instrumental.
  - risk: “Only-begotten prophet” may be difficult for modern readers.
    mitigation: The expression is retained because simplifying it could erase a theologically significant source term.
