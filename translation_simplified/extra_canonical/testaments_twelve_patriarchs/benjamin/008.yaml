translation:
  language: en
  text: '1. Therefore, my children, if you too live holy lives and obey the Lord’s commands, you will live safely with me, and all Israel will be gathered to the Lord.


    2. I will no longer be called a ravening wolf because you ravage others. Instead, I will be called a worker of the Lord who gives food to those who do good.


    3. In the latter times, someone beloved by the Lord will arise from the tribe of Judah and Levi.[a] He will fulfill God’s good purpose and bring new understanding to all nations.


    4. Everyone will speak of his presence. The Lord will choose him forever, and through him the knowledge of the Lord will be given across the earth in portions of joy. Through him Israel will receive light.


    5. Then he will enter the first temple. There the Lord will be mistreated, and he will be lifted up on a tree.[b]


    6. The temple veil will be torn, and the Spirit of God will go out to the nations like fire being poured out.


    7. He will rise from Hades, the realm of the dead, and pass from earth into heaven.


    8. I know how humble he will be on earth and how glorious he will be in heaven.


    9. When Joseph was in Egypt, I longed to see what he looked like. Through the prayers of my father Jacob, I saw him while I was awake. I saw a spotless and holy virgin giving birth to a lamb.


    10. Beside the lamb, on its left, stood what looked like a lion. All the beasts rushed against him, but the lamb defeated and destroyed them and trampled them underfoot.


    11. Because of him, the angels, humanity, and the whole land rejoiced.


    12. These things will happen at their appointed times. Therefore, my children, when you see that they have all happened in Israel, know that the Lord’s kingdom is near.


    13. Then flee from every lawless act and from the works of Beliar.[c] Hold firmly to what is good and to the Lord’s law.


    14. Bury me near my ancestors.


    15. When he had finished giving his commands, he said, “I am going to sleep with my ancestors.”


    16. Then he stretched out his feet and died at a fine old age.


    17. Each of his sons did what he had commanded. They placed him in a coffin and kept him in Egypt until the day Israel left the land.


    18. When the Israelites went up from Egypt, they also carried Benjamin’s bones with them. They buried them in Hebron, on the right side of Abraham, Isaac, and Jacob.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The wording links this figure with both Judah and Levi; it is not reduced to either tribe alone.
    reason: source_note
  - marker: b
    text: Or “on a cross”; the Greek says “on a tree,” preserving the image of earlier sacred language. The prophecy in verses 3–8 may be a later Christian expansion, but it is translated as it appears in the Greek witness.
    reason: textual_variant
  - marker: c
    text: “Beliar” is the Greek form used in this testamentary tradition; the name is also known as “Belial.”
    reason: lexical_alternative
