  simplified_phrase: live holy lives and obey the Lord’s commands
  preserved_meaning: Holiness remains covenantal conduct expressed through obedience.
  reasoning_layer_used: Lexical decision for holiness
  rationale: The biblical idiom becomes direct modern English without weakening its ethical force.
- pob_phrase: His presence is in the mouth of all
  simplified_phrase: Everyone will speak of his presence
  preserved_meaning: The figure’s presence becomes the subject of widespread speech.
  reasoning_layer_used: POB base text and immediate context
  rationale: The opaque mouth idiom is recast as natural English.
- pob_phrase: he will ascend from Hades
  simplified_phrase: He will rise from Hades, the realm of the dead
  preserved_meaning: He comes up from the domain of the dead, not necessarily a place of eternal punishment.
  reasoning_layer_used: Lexical decision for ᾅδης
  rationale: The Greek term is retained and briefly explained for new readers.
interpretive_expansions:
- pob_phrase: His presence is in the mouth of all
  rendering: Everyone will speak of his presence
  claim: The phrase describes widespread speech about the coming figure’s presence.
  evidence:
  - The POB phrase connects his presence with everyone’s mouth.
  - The following clauses describe knowledge spreading through him across the earth.
  confidence: moderate
  alternatives_preserved:
  - His presence is spoken of by all.
- pob_phrase: Hades
  rendering: Hades, the realm of the dead
  claim: Hades here names the domain of the dead without specifying eternal punishment.
  evidence:
  - The POB lexical audit identifies Hades as the realm of the dead.
  - The passage describes ascent from Hades toward heaven.
  confidence: high
  alternatives_preserved:
  - Hades
