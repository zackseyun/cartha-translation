translation:
  language: en
  text: '1. After saying this, he stretched out his legs and fell into a good sleep—the sleep of death.[a]


    2. His sons obeyed his command. They carried his body up to Hebron and buried him with his ancestors.


    2. He had lived 125 years.[b] When he finished speaking, he said, “My children, I command you: carry up my bones out of Egypt and bury me in Hebron near my ancestors.”


    2. Benjamin died at the age of 125, having lived to a good old age. They placed him in a coffin.


    3. In the ninety-first year after the Israelites left Egypt, they and their brothers secretly carried up the bones of their fathers during the war in Canaan. They buried them in Hebron beside the feet of their fathers.[c]


    4. Then they returned from Canaan and lived in Egypt until the day they left the land of Egypt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some Greek manuscripts add “and good” after “a good sleep.”
    reason: textual_variant
  - marker: b
    text: The chapter repeats notices about Benjamin’s death, burial, and final command, probably because of its complex transmission history; the repetition is retained here.
    reason: textual_variant
  - marker: c
    text: The Greek literally says “beside the feet of their fathers,” perhaps describing a place near the ancestral tombs rather than directly at their feet.
    reason: lexical_alternative
