  text: Cain suffers for two hundred years, and in the nine-hundredth year he is left desolate. Because of what he did to his brother Abel, he was judged through every kind of evil, while Lamech was judged seventy times seven. Until the end of the age, those who become like Cain through envy and hatred of their brothers will receive the same kind of judgment.
