  review_summary: 'The draft helpfully makes the moral sense of the difficult “double sight/double hearing” image more accessible and is not doctrinally problematic. However, its opening paraphrase changes the construction: the POB denies doubleness in both sight and hearing, while “see one way and hear another” portrays disagreement between the two. The replacement retains the intended moral contrast without making sight and hearing oppose each other. The final phrase is also broadened from the somewhat motive-specific “single-hearted” to “integrity,” which better conveys the stated contrast with singleness.'
