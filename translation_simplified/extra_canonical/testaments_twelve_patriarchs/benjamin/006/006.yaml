simplification_decisions:
- pob_phrase: neither double sight nor double hearing
  simplified_phrase: does not see or hear with a divided mind
  preserved_meaning: Neither sight nor hearing is marked by moral division or duplicity.
  reasoning_layer_used: POB translation, Greek image, and grounding review
  rationale: This preserves doubleness in both faculties without implying conflict between seeing and hearing.
- pob_phrase: cleanses his mind
  simplified_phrase: keeps his mind pure
  preserved_meaning: He maintains moral purity in his thoughts to avoid condemnation.
  reasoning_layer_used: POB translation
  rationale: The common wording retains the moral force of cleansing the mind.
- pob_phrase: the works of Beliar are twofold, and they have no singleness in them
  simplified_phrase: Beliar’s works are divided and deceptive; there is no integrity in them
  preserved_meaning: Beliar’s deeds display duplicity and division rather than integrity.
  reasoning_layer_used: POB translation, source-language contrast, and grounding review
  rationale: This explains the double-versus-single contrast without narrowing singleness to motives alone.
interpretive_expansions:
- pob_phrase: double sight nor double hearing
  rendering: see or hear with a divided mind
  claim: The doubleness is moral division or duplicity affecting each faculty, not impaired senses or disagreement between them.
  evidence:
  - The POB applies “double” separately to both sight and hearing.
  - The verse contrasts doubleness with singleness in Beliar’s works.
  confidence: moderate
  alternatives_preserved:
  - Literal “double sight” and “double hearing” remain represented by divided seeing and hearing.
- pob_phrase: the works of Beliar are twofold
  rendering: Beliar’s works are divided and deceptive
  claim: The twofold character of Beliar’s works involves duplicity rather than mere numerical pairing.
  evidence:
  - The clause contrasts twofold works with the absence of singleness.
  - The verse’s moral context concerns purity and condemnation.
  confidence: moderate
  alternatives_preserved:
  - The broader idea of internal division remains explicit.
