translation:
  language: en
  text: He does not see or hear with a divided mind. In everything he does, says, or sees, he knows that the Lord watches over his soul. So he keeps his mind pure, so that neither people nor God will condemn him. In the same way, Beliar’s works are divided and deceptive; there is no integrity in them.
