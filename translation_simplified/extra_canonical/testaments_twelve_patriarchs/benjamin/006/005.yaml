  text: A good mind is not double-tongued, divided between blessing and cursing, insult and honor, calm and turmoil, hypocrisy and truth, or poverty and wealth.[a] Instead, it has one sincere and pure attitude toward everyone.
  philosophy: optimal-equivalence
