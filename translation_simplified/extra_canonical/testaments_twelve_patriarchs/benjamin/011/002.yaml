translation:
  language: en
  text: In the last days, one whom the Lord loves will arise [from the descendants of Judah and Levi]. With his words he will do what is pleasing. [He will enlighten all nations with new knowledge.] He will be a light of knowledge. He will come to Israel bringing salvation. Like a wolf, he will snatch something from them and give it to the assembly of the nations.
