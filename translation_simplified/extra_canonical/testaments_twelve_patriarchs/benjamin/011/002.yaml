  preserved_meaning: His spoken words will accomplish what is pleasing.
  reasoning_layer_used: Greek source image and POB wording
  rationale: “With his words” clarifies that the mouth image refers to speech.
- pob_phrase: snatching from them like a wolf, and giving to the assembly of the nations
  simplified_phrase: Like a wolf, he will snatch something from them and give it to the assembly of the nations
