- pob_phrase: have a good mind
  simplified_phrase: set your mind on what is good
  preserved_meaning: They are to maintain an inward commitment to goodness.
  reasoning_layer_used: POB translation and Greek source payload
  rationale: The active wording makes the inner moral orientation clear in ordinary English.
- pob_phrase: the profligate
  simplified_phrase: those who live recklessly
  preserved_meaning: The phrase describes people whose way of life is morally undisciplined.
  reasoning_layer_used: latest revision pass
  rationale: The plain description preserves the revised sense without the uncommon term “profligate.”
- pob_phrase: the things of greed that they had
  simplified_phrase: what they had gained through greed
  preserved_meaning: They give distressed people possessions connected with their former greed.
  reasoning_layer_used: POB translation and Greek source payload
  rationale: The recast phrase expresses the difficult possession-and-greed relationship naturally.
interpretive_expansions:
- pob_phrase: their passion
  rendering: their greedy desires
  claim: The passion in view is their drive toward greed.
  evidence:
  - The immediate subject is “those who are greedy.”
  - The following clause again names greed.
  confidence: high
  alternatives_preserved:
  - their passion
  - their craving for more
translation_notes:
