translation:
  language: en
  text: 'A good person’s purpose is not controlled by Beliar’s deceitful spirit.[a] The angel of peace guides his soul. He does not crave things that perish or store up wealth for self-indulgence. He does not live for pleasure or cause his neighbor grief. He does not fill himself with luxury or let his wandering eyes lead him astray. The Lord is his portion—his true treasure.


    A good purpose is not swayed by either the praise or the contempt that comes from people. It has nothing to do with deceit, lies, conflict, or abuse. The Lord lives in the good person and gives light to his soul, and he responds to everyone with joy at all times.


    A good mind does not have two tongues. It does not speak blessing and then cursing, honor and then insult, calm and then turmoil, or truth and then hypocrisy. It does not change its speech according to poverty or wealth. Instead, it has one sincere and pure attitude toward everyone. It does not have double sight or double hearing; it is not double-minded. In everything the good person does, says, or sees, he knows that the Lord is examining his soul. So he keeps his mind clean, so that neither people nor God may condemn him. Beliar’s disposition, however, is double and never single-hearted.


    Therefore, my children, flee from evil-mindedness. Love the good mind that God’s law recognizes, so that you may rest in hope. A person with a good mind does not have a darkened eye.[b] He shows mercy to everyone, even sinners. Even when people plot evil against him, he overcomes evil by doing good, for goodness shields him. He loves a righteous person as he loves his own soul.


    When someone receives honor, he does not envy him. When someone becomes rich, he is not jealous. He praises the courageous and commends the virtuous. He shows mercy to the poor, has compassion for the weak, and sings praise to God. He loves anyone who has the grace of a good spirit[c] as he loves his own soul.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Beliar” is the Greek form of the name many readers know as “Belial.”
    reason: lexical_alternative
  - marker: b
    text: “A darkened eye” may also suggest an evil or envious eye.
    reason: lexical_alternative
  - marker: c
    text: “The grace of a good spirit” may refer to a good disposition, spiritual agency, or a divine gift.
    reason: source_note
simplification_decisions:
- pob_phrase: is not in the hand of the spirit of Beliar’s deceit
  simplified_phrase: is not controlled by Beliar’s deceitful spirit
  preserved_meaning: Beliar’s misleading spiritual power does not govern the good person’s settled purpose.
  reasoning_layer_used: Lexical decisions for διαβούλιον and πλάνης
  rationale: The active wording makes the image of control immediately understandable.
- pob_phrase: does not accept the glory or the dishonor that comes from men
  simplified_phrase: is not swayed by either the praise or the contempt that comes from people
  preserved_meaning: Human approval and rejection do not determine a good purpose.
  reasoning_layer_used: Doctrine-realigned rendering of δόξης ... ἀτιμίας ἀνθρώπων
  rationale: Common terms retain both opposing forms of human judgment.
- pob_phrase: love the good mind, which the law of God knows
  simplified_phrase: Love the good mind that God’s law recognizes
  preserved_meaning: The good inward orientation accords with and is acknowledged by God’s law.
  reasoning_layer_used: POB wording and grounding-review alternatives
  rationale: “Recognizes” clarifies the unusual clause without adding the stronger claim that the law teaches it.
interpretive_expansions:
- pob_phrase: For the Lord is his portion.
  rendering: The Lord is his portion—his true treasure.
  claim: The Lord is the good person’s true possession rather than perishable wealth.
  evidence:
  - The preceding lines contrast the Lord with possessions gathered for pleasure.
  - The lexical rationale describes “portion” as one’s true covenantal lot.
  confidence: high
  alternatives_preserved:
  - portion
  - inheritance
  - share
- pob_phrase: It does not have double sight or hearing.
  rendering: It does not have double sight or double hearing; it is not double-minded.
  claim: The doubled senses portray a divided and duplicitous inward life.
  evidence:
  - The POB footnote identifies the image as duplicity opposed to singleness.
  - The next contrast describes Beliar’s disposition as double and not single-hearted.
  confidence: high
  alternatives_preserved:
  - double sight or hearing
  - duplicity in seeing or hearing
  - twofold perception
translation_notes:
  risk_flags:
  - risk: “True treasure” explains the covenantal image of the Lord as one’s portion.
    mitigation: The source image and the key term “portion” remain in the text.
  - risk: “Not double-minded” interprets the imagery of double sight and hearing.
    mitigation: The original images remain, and the chapter’s explicit double-versus-single contrast supports the gloss.
