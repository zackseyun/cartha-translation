translation:
  language: en
  text: '1. When Joseph was in Egypt, I longed to see what he looked like—the shape and features of his face. Through the prayers of my father Jacob, I saw him in daylight while fully awake, looking exactly as he truly did.


    2. After saying this, he told them, “Understand, my children, that I am dying. 3. So act truthfully toward every neighbor, and keep the Lord’s law and commandments. 4. This is what I leave you as your entire inheritance. Give it also to your children as an everlasting possession, just as Abraham, Isaac, and Jacob did. 5. They passed all these things down to us as an inheritance, saying, ‘Keep God’s commandments until you see Enoch, Seth, Abraham, Isaac, and Jacob raised to life at his right hand, rejoicing.’


    6. Then we too will rise, each with our scepter,[b] and we will worship the King of the heavens. 7. [He appeared on earth in human form and in humility, and everyone on earth who believes in him will rejoice with him.][a]


    8. Everyone will rise—some to glory and others to dishonor. The Lord will judge Israel first for their unrighteousness [because when God came to them in flesh, they did not believe in him]. 9. Then he will judge all the nations [that did not believe in him when he appeared on earth]. 10. Through the chosen ones from among the nations, he will expose Israel’s guilt, just as he exposed Esau’s guilt through the Midianites, who deceived their brothers into sexual immorality and idolatry. So they became estranged from God and became children in the portion of those who fear the Lord.


    11. Therefore, my children, if you live holy lives by keeping the Lord’s commandments, you will once again dwell in me with confidence,[c] and all Israel will be gathered to the Lord.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The bracketed words in verses 7–9 are widely regarded as a later Christian expansion.
    reason: textual_variant
  - marker: b
    text: The Greek phrase behind “with our scepter” is difficult and may picture restored dignity or tribal rule at the resurrection.
    reason: cultural_note
  - marker: c
    text: “With confidence” translates a difficult phrase that literally says “in hope.”
    reason: lexical_alternative
