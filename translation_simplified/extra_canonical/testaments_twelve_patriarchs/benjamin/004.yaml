translation:
  language: en
  text: '1.[a] Consider, then, my children, how the life of a good man turns out. Follow his good example of compassion, so that you too may wear crowns of glory.


    2. A good man does not look at others with a darkened eye.[b] He shows mercy to everyone, even to sinners.


    3. Even when people intend no good for him, he overcomes evil by doing good, while God shelters him. He loves those who wrong him as dearly as he loves his own life.


    4. When someone receives honor, he does not envy him. When someone becomes rich, he is not jealous. When someone shows courage, he praises him. He loves those who are self-controlled, shows mercy to the poor, shares the suffering of the weak, and fears God.


    5. He defends those who have the fear of the Lord and helps those who love God. He warns anyone who rejects the Most High and helps that person turn back. He loves anyone who has the grace of a good spirit as dearly as he loves his own life.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some difficult lines about “the lamb of God” appear before this chapter in the source layer but may be displaced, so they are not included here.
    reason: textual_variant
  - marker: b
    text: A “darkened eye” may mean an evil, envious, or grudging way of looking at others.
    reason: lexical_alternative
  - marker: c
    text: Some witnesses have a shorter wording here, while others include this fuller list of virtues.
    reason: textual_variant
simplification_decisions:
- pob_phrase: See then, my children, the outcome of the good man
  simplified_phrase: Consider, then, my children, how the life of a good man turns out
  preserved_meaning: The children are urged to consider the observable result of a good man's life.
  reasoning_layer_used: Lexical decision for τέλος and its exhortational context
  rationale: The ordinary clause makes “outcome” immediately clear without weakening the command.
- pob_phrase: does not have a darkened eye
  simplified_phrase: does not look at others with a darkened eye
  preserved_meaning: The eye image still suggests freedom from envy or grudging ill will.
  reasoning_layer_used: Theological decision to retain the source-language image
  rationale: The added verb makes the image natural while the note preserves its ambiguity.
- pob_phrase: by admonishing, he turns back the one who rejects the Most High
  simplified_phrase: He warns anyone who rejects the Most High and helps that person turn back
  preserved_meaning: Warning remains the means by which he seeks the person's restoration.
  reasoning_layer_used: Lexical decision for νουθετῶν ἐπιστρέφει
  rationale: Two direct clauses distinguish the warning from its restorative result.
interpretive_expansions:
- pob_phrase: If anyone is glorified
  rendering: When someone receives honor
  claim: The glory here refers to a person receiving social honor.
  evidence:
  - The lexical rationale explicitly identifies social honor as the contextual sense.
  - The virtue list contrasts another person's honor with envy.
  confidence: high
  alternatives_preserved:
  - is glorified
  - is praised
