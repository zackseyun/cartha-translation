translation:
  language: en
  text: 'An angel of God also spoke to me about women and taught me this: women are overcome by the spirit of sexual immorality more than men are. In their hearts they scheme against men. They use the way they adorn themselves to lead minds astray, and with a glance they sow poison. First in thought and then through the act itself, they take captive.'
