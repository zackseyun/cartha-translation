translation:
  language: en
  text: '1. My children, women are evil. Because they have no authority over a man and cannot overpower him, they use their appearance[a] to scheme and draw him to themselves. 2. If they cannot enchant him by their appearance, they overcome him by deceit.


    3. An angel of God told me about them. He taught me that women are overcome by the spirit of sexual immorality more than men are. In their hearts they devise things against men. They use adornment to lead men’s minds astray, and with a glance they sow poison. First they take men captive in thought, and then through the act itself. 4. A woman cannot force a man openly, but she uses a sexually seductive appearance to act craftily against him.


    5. Therefore, my children, flee from sexual immorality. Command your wives and daughters not to decorate their heads or faces in order to deceive the mind. Every woman who uses such things deceitfully is being kept for eternal punishment.


    6. This is also how women charmed the Watchers[b] before the flood. The Watchers kept looking at the women continually, and they came to desire them. They conceived the deed in their minds. They changed themselves into the form of men and appeared to the women while the women were with their husbands. 7. The women also desired their appearance in their minds, and they gave birth to giants[c]. The Watchers appeared to them as though they reached up to heaven.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “outward form”; the term can refer to appearance, figure, or presentation.
    reason: lexical_alternative
  - marker: b
    text: The Watchers are heavenly beings in Jewish traditions about the time before the flood; compare Genesis 6 and 1 Enoch.
    reason: cross_reference
  - marker: c
    text: This account reflects an ancient tradition about the Watchers, their desire, and the birth of giants; their reaching heaven may be a towering exaggeration.
    reason: cultural_note
simplification_decisions:
- pob_phrase: they do not have authority or power over a man
  simplified_phrase: they have no authority over a man and cannot overpower him
  preserved_meaning: Authority and effective power remain distinct ideas.
  reasoning_layer_used: POB lexical decisions and Greek clause structure
  rationale: The abstract nouns become a direct contrast without being merged.
- pob_phrase: by a harlot’s manner she acts craftily against him
  simplified_phrase: she uses a sexually seductive appearance to act craftily against him
  preserved_meaning: The sexualized presentation remains a form of cunning manipulation.
  reasoning_layer_used: POB lexical alternatives for ἐν σχήματι πορνικοῖς and πανουργεύεται
  rationale: This removes the archaic label while retaining the sexual and deceptive force.
- pob_phrase: they conceived the deed in their mind
  simplified_phrase: They conceived the deed in their minds.
  preserved_meaning: Desire develops inwardly into a contemplated act.
  reasoning_layer_used: POB lexical rationale for συνέλαβον τῇ διανοίᾳ τὴν πρᾶξιν
  rationale: The natural English plural preserves the movement from thought toward action.
interpretive_expansions:
- pob_phrase: by adornment they lead their minds astray
  rendering: They use adornment to lead men’s minds astray
  claim: The minds being led astray belong to the men targeted in the surrounding clauses.
  evidence:
  - The preceding clause says the women devise things against men.
  - The following captivity language continues the same seduction sequence.
  confidence: moderate
  alternatives_preserved:
  - The POB’s less explicit “their minds” remains documented here.
- pob_phrase: they ... they ... them ... they in verses 6–7
  rendering: The Watchers kept looking ... The women also desired their appearance
  claim: The context identifies the Watchers as the earlier agents and the women as those who give birth, while the possessive remains unresolved.
  evidence:
  - The Watchers are described as looking, desiring, changing form, and appearing.
  - The women are identified by the statement that they gave birth to giants.
  confidence: moderate
  alternatives_preserved:
  - The referent of “their appearance” remains implicit.
  - The Greek and POB use compressed pronouns in these clauses.
translation_notes:
  risk_flags:
  - risk: The passage makes harsh generalizations about women.
    mitigation: The draft preserves them as Reuben’s warning speech rather than silently restricting or correcting them.
  - risk: Explicit nouns in verses 6–7 may resolve some compressed pronouns more firmly than the Greek does.
    mitigation: Only contextually necessary agents are named, while the ambiguous possessive in verse 7 remains implicit.
