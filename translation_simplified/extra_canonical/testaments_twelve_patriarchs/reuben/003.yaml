translation:
  language: en
  text: 'Besides all these, there is an eighth spirit: the spirit of sleep. It brings on the trance of nature and is an image of death.


    Spirits of error mingle with these spirits. The first is the spirit of sexual immorality, which is rooted in human nature and the senses. The second is the spirit of a belly that is never satisfied. The third is the spirit of fighting, located in the liver and the gall. The fourth is the spirit of self-display and sorcery, which leads a person to meddle excessively in order to appear attractive. The fifth is the spirit of pride, which makes a person boast and think too highly of himself. The sixth is the spirit of falsehood amid ruin and jealousy. It leads a person to shape words and hide his own words from his own family and household. The seventh is the spirit of injustice. It brings theft and greedy acts in order to satisfy the cravings of the heart. Injustice works with the other spirits through taking and giving.


    Over all these comes the spirit of sleep, the eighth spirit of error and fantasy. In this way every young man is ruined: his mind is darkened so that he cannot see the truth. He does not understand God’s law or listen to his fathers’ instruction. This is what happened to me in my youth.


    And now, my children, love the truth, and it will keep you safe. Listen as I, your father Reuben, teach you. Do not fix your attention on a woman’s appearance. Do not keep company with a married woman or pry into the affairs of women.'
