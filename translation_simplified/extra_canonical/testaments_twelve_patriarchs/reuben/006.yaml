translation:
  language: en
  text: '1. Therefore, guard yourselves from sexual immorality, and keep your minds pure. Guard your senses from being drawn toward any woman. 2. Tell the women likewise not to keep close company with men, so that they too may keep their minds pure. 3. Frequent close contact—even if no ungodly act takes place—is still an incurable disease for them. For us, it brings ruinous disgrace from Beliar[a] and an everlasting reproach. 4. Sexual immorality has no understanding or reverence for God in it, and its desire is filled with every kind of jealousy.


    5. So I tell you: you will be jealous of Levi’s sons and will try to raise yourselves above them. But because of this, you will not succeed. 6. God will avenge them, but you will die an evil death. 7. God gave the priesthood to Levi and the kingdom to Judah alongside him. 8. Do not proudly set yourselves against these two, from whom the Lord will bring to completion what is to be spoken.[b]


    9. I solemnly charge you under oath by the God of heaven: each of you must act truthfully and faithfully toward your neighbor, and each must love his brother. 10. Come near to Levi with humble hearts, so that you may receive a blessing from his mouth. 11. He will bless Israel and Judah, because in him the Lord chose to reign before all the people. 12. Bow down before his seed,[c] because for your sake that seed will die in wars both visible and invisible. And among you there will be an everlasting king.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek has “Beliar,” a form of the name also known as “Belial.”
    reason: lexical_alternative
  - marker: b
    text: Verses 7–8 are textually difficult; this translation gives the probable sense that Levi received the priesthood and Judah the kingdom, with a warning not to oppose either line.
    reason: textual_variant
  - marker: c
    text: “Bow down” may mean to pay homage rather than to worship, and “seed” may refer to a descendant or a line of descendants.
    reason: lexical_alternative
