translation:
  language: en
  text: I drank no wine or other intoxicating drink. I ate no meat or desirable bread. I grieved over my sin, for it was so serious that nothing like it had ever happened in Israel.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: wine or strong drink
  simplified_phrase: wine or other intoxicating drink
  preserved_meaning: He abstained from wine and other alcoholic drinks.
  reasoning_layer_used: source payload and POB translation
  rationale: “Intoxicating drink” clearly conveys the older category “strong drink.”
- pob_phrase: no meat entered my mouth, and I ate no bread of desire
  simplified_phrase: I ate no meat or desirable bread
  preserved_meaning: He abstained from both meat and bread characterized as desirable.
  reasoning_layer_used: source payload, POB translation, and grounding review
  rationale: Natural eating language keeps both foods distinct without making desire a passing personal craving.
- pob_phrase: I was mourning over my sin, for it was great, such as had not happened in Israel
  simplified_phrase: I grieved over my sin, for it was so serious that nothing like it had ever happened in Israel
  preserved_meaning: He grieved because his sin was exceptionally serious and unprecedented in Israel.
  reasoning_layer_used: POB translation and immediate context
  rationale: The sentence states the relationship clearly while leaving the final comparison broad.
