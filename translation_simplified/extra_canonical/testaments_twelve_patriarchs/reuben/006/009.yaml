  rationale: “Solemnly charge” clearly conveys the force of the uncommon word “adjure.”
- pob_phrase: do truth toward his neighbor
  simplified_phrase: deal truthfully with your neighbor
  preserved_meaning: Truth must govern each person’s actions toward others.
  reasoning_layer_used: Greek ποιεῖν ἀλήθειαν and applied revision
  rationale: The wording keeps truth as something done while expressing the idiom in natural English.
- pob_phrase: that each of you ... and that each
  simplified_phrase: each of you must ... and
  preserved_meaning: Both commands apply individually to every hearer.
  reasoning_layer_used: POB syntax and Greek distributive wording
  rationale: Combining the repeated wording makes the sentence easier to follow without weakening either command.
translation_notes:
  risk_flags:
