translation:
  language: en
  text: Bow down to his offspring, because his offspring will die for your sake in wars that can be seen and wars that cannot be seen. And an eternal king will be among you.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: it will die
  simplified_phrase: his offspring will die
  preserved_meaning: The wording avoids an impersonal pronoun while leaving open whether the offspring is one descendant or a collective lineage.
  reasoning_layer_used: POB controlling translation, Greek grammatical context, and grounding review
  rationale: Repeating “his offspring” preserves the unresolved number ambiguity better than “they.”
- pob_phrase: visible and invisible wars
  simplified_phrase: wars that can be seen and wars that cannot be seen
  preserved_meaning: The contrast between visible and invisible conflict remains intact and undefined.
  reasoning_layer_used: POB controlling translation
  rationale: The difficult adjectives are recast in ordinary English without explaining the unseen wars.
- pob_phrase: among you there will be an eternal king
  simplified_phrase: an eternal king will be among you
  preserved_meaning: The king is eternal and will be present among those addressed.
  reasoning_layer_used: POB controlling translation and applied revision
  rationale: Natural English word order improves clarity without identifying the king.
translation_notes:
  risk_flags:
  - risk: Repeating “his offspring” may sound slightly formal.
    mitigation: The repetition is retained because it avoids both impersonal “it” and plural-leaning “they.”
  - risk: “Wars that cannot be seen” may be understood specifically as spiritual warfare.
    mitigation: No such label is added because the POB leaves the invisible wars undefined.
