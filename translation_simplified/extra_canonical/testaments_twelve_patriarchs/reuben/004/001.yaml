  text: So, my children, do not focus on the beauty of women or keep thinking about their deeds. Instead, live with sincere hearts and fear the Lord. Work hard at doing good, learning, and caring for your flocks until the Lord gives you a wife whom he himself chooses, so that you will not suffer as I did.
