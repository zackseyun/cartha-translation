translation:
  language: en
  text: Sexual immorality has destroyed many people. If a man commits it, he brings disgrace on himself in the eyes of others and becomes a stumbling block to Beliar—whether he is old, from a noble family, rich, or poor.
  philosophy: optimal-equivalence
