  rationale: The common idiom communicates the social sense without the opaque phrase “sons of men.”
- pob_phrase: whether a man is old, or noble, or rich, or poor
  simplified_phrase: whether he is old, from a noble family, rich, or poor
  preserved_meaning: Age, family status, and wealth do not protect a man from disgrace.
  reasoning_layer_used: POB translation and source list
  rationale: “From a noble family” makes the social meaning of “noble” immediately clear.
- pob_phrase: a stumbling block to Beliar
