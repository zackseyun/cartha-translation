translation:
  language: en
  text: The Egyptian woman did many things to Joseph. She called in magicians and brought him potions. She did this because Joseph kept himself from every evil desire and refused to follow his own soul’s counsel to desire what was wicked.
  philosophy: optimal-equivalence
