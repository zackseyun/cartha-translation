  text: Διὰ τοῦτο⁷³ ὁ θεὸς τῶν πατέρων ὑμῶν⁷⁴ ἐρρύσατο αὐτὸν ἀπὸ παντὸς πονηροῦ⁷⁵ κεκρυμμένου θανάτου.
  language: Greek
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/010.yaml
  text: Therefore the God of your fathers delivered him from every hidden evil death.
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T14:57:31Z'
    unchanged: false
    changes_summary: 'Revised to reflect the Greek more closely: κεκρυμμένου modifies θανάτου, not πονηροῦ, so the phrase is best rendered as ''every evil hidden death'' or more naturally ''every hidden evil death,'' rather than ''every hidden evil and from death.'' Also removed the added second ''from,'' which split one Greek phrase into two objects.'
translation:
  language: en
  text: Therefore, the God of your ancestors rescued him from every evil death that was hidden.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the God of your fathers
  simplified_phrase: the God of your ancestors
  preserved_meaning: God is identified by his relationship to their forefathers.
  reasoning_layer_used: POB translation
  rationale: “Ancestors” clearly expresses the broader family relationship in modern English.
- pob_phrase: delivered him
  simplified_phrase: rescued him
  preserved_meaning: God saved him from death.
  reasoning_layer_used: POB translation
  rationale: “Rescued” gives the same sense in more familiar wording.
- pob_phrase: every hidden evil death
  simplified_phrase: every evil death that was hidden
  preserved_meaning: Death remains the single object and is described as both evil and hidden.
  reasoning_layer_used: applied revision and Greek syntax
  rationale: A relative clause makes the modifiers easier to follow without splitting death from evil.
translation_notes:
  risk_flags:
  - risk: “Evil death” remains unusual in modern English.
    mitigation: It is retained because replacing it with general danger would weaken the source phrase and its focus on death.
