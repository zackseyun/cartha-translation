  text: '*Οἱ γὰρ τοιοῦτοι³⁴ δορκάσι³⁵ καὶ ἐλάφοις³⁶ *εἰσὶν ὅμοιοι³⁷, ὅτι ἐν ἤθει ἀγρίων³⁸ δοκοῦσιν ἀκάθαρτοι εἶναι, *τὸ δὲ πᾶν³⁹ καθαροί εἰσιν³⁹, ὅτι ἐν ζήλῳ Κυρίου⁴⁰ ⌈πορεύονται⌉, ἀπεχόμενοι *ὧν καὶ ὁ Θεὸς διὰ τῶν ἐντολῶν μισῶν ἀπαγορεύει⁴¹, *ἀπείργων τὸ κακὸν τοῦ ἀγαθοῦ⁴².'
  language: Greek
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/005.yaml
  text: 'For such men are like gazelles and deer: though in the manner of wild animals they seem to be unclean, yet in every way they are clean, because they walk in zeal for the Lord, abstaining from what God also hates and forbids through the commandments, keeping evil away from good.'
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T14:55:00Z'
    unchanged: false
    changes_summary: Adjusted 'bearing' to 'manner' for ἤθει, added 'though...yet' for smoother contrast, changed 'keeping away from those things which' to 'abstaining from what' for a more direct rendering of ἀπεχόμενοι ὧν, and revised the final clause to 'keeping evil away from good' for a more natural translation of ἀπείργων τὸ κακὸν τοῦ ἀγαθοῦ.
translation:
  language: en
  text: Such people are like gazelles and deer. Although their way of life, like that of wild animals, may make them seem unclean, they are clean in every way. This is because they follow the Lord with zeal. They avoid what God hates and forbids in his commandments, keeping evil away from what is good.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: though in the manner of wild animals they seem to be unclean
  simplified_phrase: Although their way of life, like that of wild animals, may make them seem unclean
  preserved_meaning: The comparison concerns their apparent manner of life, not morally wild behavior.
  reasoning_layer_used: POB text, applied revision for ἤθει, and grounding review
  rationale: The concessive wording preserves the gap between outward appearance and actual status.
- pob_phrase: because they walk in zeal for the Lord
  simplified_phrase: This is because they follow the Lord with zeal.
  preserved_meaning: They live with earnest devotion to the Lord.
  reasoning_layer_used: POB controlling translation and approved SPOB clarification
  rationale: A separate sentence and “follow” make the life-conduct sense clear.
- pob_phrase: keeping evil away from good
  simplified_phrase: keeping evil away from what is good
  preserved_meaning: They hold evil apart from what is good.
  reasoning_layer_used: POB text and latest revision of the final clause
  rationale: The wording remains direct while clarifying that “good” means what is good.
translation_notes:
  risk_flags:
  - risk: “Clean” and “unclean” may be mistaken for physical cleanliness alone.
    mitigation: The terms remain because the POB does not specify a narrower moral or ritual domain.
