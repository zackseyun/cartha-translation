translation:
  language: en
  text: 'After he said these things, he gave them this command: “Bury me in Hebron.” Then he died—he fell asleep in a good sleep. His sons did what he had commanded. They carried his body to Hebron and buried him with his fathers.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “With his fathers” means with his forefathers.
    reason: cultural_note
