    mitigation: The text avoids explicitly choosing either an emphatic-only or continuative meaning.
  - risk: The exact relationship among human commands, wickedness, and corruption is compressed in the source.
    mitigation: The wording retains the POB sequence without defining a narrower causal relationship.
