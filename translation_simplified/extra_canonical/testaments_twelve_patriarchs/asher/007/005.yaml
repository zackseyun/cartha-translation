simplification_decisions:
- pob_phrase: by disobeying, you will disobey, and by acting ungodly, you will act ungodly
  simplified_phrase: you will surely disobey and act in ungodly ways
  preserved_meaning: The wording strongly warns of both disobedience and ungodly conduct.
  reasoning_layer_used: Greek source wording and controlling POB translation
  rationale: “Surely” preserves the repetition’s emphasis without asserting that it describes duration.
- pob_phrase: paying no attention to the law of God
  simplified_phrase: You will ignore God’s law
  preserved_meaning: They will fail to heed what God commands.
  reasoning_layer_used: Controlling POB translation
  rationale: The direct verb states the same meaning in ordinary English.
- pob_phrase: the commandments of men
  simplified_phrase: human commands
  preserved_meaning: Human commands stand in contrast to God’s law.
  reasoning_layer_used: Immediate contrast in the Greek source and POB translation
  rationale: The modern phrase keeps the contrast without archaic wording.
translation_notes:
  risk_flags:
