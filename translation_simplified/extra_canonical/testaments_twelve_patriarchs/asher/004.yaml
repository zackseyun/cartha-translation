translation:
  language: en
  text: '1 Good people show only one face. People who show two faces may think these good people are sinning, but they are righteous before God.


    2 Many who put an end to wicked people seem to do both good and evil. Yet the action as a whole is good, because they have uprooted and destroyed evil.[a]


    3 Someone may hate both the merciful person and the unjust person, both the adulterer and the person who fasts. This too may appear two-faced, but the action as a whole is good, because that person imitates the Lord. He does not treat what merely seems good as though it belonged with what is truly good.[b]


    4 Another person refuses to enjoy good times with reckless people, so that he will not defile his body or pollute his soul. Even though this may appear two-faced, it is wholly good.


    5 Such people are like gazelles and deer. Their wild appearance may make them seem unclean, but they are completely clean. They live with zeal for the Lord, avoiding what God hates and forbids in his commandments. In this way, they keep evil away from good.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Put an end to” may mean killing or otherwise removing the wicked.
    reason: lexical_alternative
  - marker: b
    text: The wording contrasts goodness that is only apparent with goodness that is genuine.
    reason: lexical_alternative
  - marker: c
    text: The final Greek clause is compressed and may also mean “holding back evil from good.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: being single-faced ... thought by the double-faced
  simplified_phrase: show only one face ... people who show two faces may think these good people are sinning
  preserved_meaning: The face image remains, and the good people are clearly the ones accused of sinning.
  reasoning_layer_used: POB lexical decisions and grounding review
  rationale: The wording preserves the metaphor while removing the pronoun ambiguity.
- pob_phrase: does not wish to see good days with the wasteful
  simplified_phrase: refuses to enjoy good times with reckless people
  preserved_meaning: He avoids pleasurable fellowship with morally undisciplined people.
  reasoning_layer_used: POB lexical decision for ἀσώτων and immediate context
  rationale: The opaque idiom is replaced while its broader moral sense is retained.
- pob_phrase: in the bearing of wild animals they seem to be unclean
  simplified_phrase: Their wild appearance may make them seem unclean
  preserved_meaning: Their outward manner creates a misleading impression of impurity.
  reasoning_layer_used: POB lexical decision and cultural note for ἐν ἤθει ἀγρίων
  rationale: The comparison is stated plainly without removing the animal image.
interpretive_expansions:
- pob_phrase: this too is double-faced
  rendering: This too may appear two-faced
  claim: The action can look morally mixed without necessarily being inwardly hypocritical.
  evidence:
  - The repeated formula says the action as a whole can still be good.
  - The POB theological decision distinguishes outward appearance from inward duplicity.
  confidence: high
  alternatives_preserved:
  - This too is double-faced.
  - This too appears morally mixed.
- pob_phrase: see good days with the wasteful
  rendering: enjoy good times with reckless people
  claim: The person refuses pleasurable fellowship with morally undisciplined companions.
  evidence:
  - The next clause warns that such company could defile body and soul.
  - The POB rationale says ἀσώτων has a broader moral sense than financial waste.
  confidence: moderate
  alternatives_preserved:
  - spend prosperous days with wasteful people
  - share good times with dissolute people
translation_notes:
  risk_flags:
  - risk: Verse 2 may refer specifically to killing the wicked rather than removing them more broadly.
    mitigation: The broad main-text wording is retained, and footnote a preserves the stronger possibility.
  - risk: Verse 3 may sound as though mercy and fasting themselves are condemned.
    mitigation: The difficult pairings remain unresolved, as in the POB, while the apparent-versus-true-good contrast is preserved.
