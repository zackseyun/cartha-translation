translation:
  language: en
  text: But you, my children, do not be double-faced like them, practicing both goodness and wickedness. Hold firmly to goodness alone, because the Lord God rests in goodness, and people long for it. Run away from wickedness and defeat its scheme by your good deeds. Double-faced people do not belong to God. Instead, they serve their own desires so that they may please Beliar.[a]
