  simplified_phrase: has two faces, but taken as a whole, it is evil
  preserved_meaning: Apparently good actions do not make conduct good when its overall character is evil.
  reasoning_layer_used: POB repeated source-image rendering
  rationale: The two-faced image remains while the overall judgment is easier to follow.
- pob_phrase: by the force of his wealth he drags many down
  simplified_phrase: uses the power of his wealth to drag many people down
  preserved_meaning: Wealth is used as coercive power that harms others.
  reasoning_layer_used: POB source-driven wording
  rationale: Ordinary syntax preserves the forceful image of harming others through wealth.
- pob_phrase: the tablets of the commandments
  simplified_phrase: the tablets containing the commandments
  preserved_meaning: God's commandments were recorded on tablets.
  reasoning_layer_used: POB main text and immediate context
  rationale: “Containing” clarifies the relationship without identifying the tablets further.
