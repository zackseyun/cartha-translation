translation:
  language: en
  text: '1 Some people use their words to reject what is good in favor of evil, and they bring the whole matter to a wicked end.


    2 A man may show no compassion to his own servants. His conduct has two faces, but taken as a whole, it is evil.


    3 Another man loves someone who does evil. He even chooses to die in evil because of that person. It is clear that his conduct has two faces, but taken as a whole, it is an evil deed.


    4 Even when love is involved, it becomes wickedness if it hides evil under a good name. The deed ends in evil.


    5 Another person steals, treats others unjustly, plunders them, and acts greedily, yet shows mercy to the poor. This conduct also has two faces, but taken as a whole, it is evil.


    6 Anyone who cheats a neighbor provokes God, swears falsely by the Most High, and has no regard for the Lord, who gave the law—yet still brings relief to the poor.


    7 He stains his soul while making his body bright. He kills many but shows mercy to a few. This conduct also has two faces, but taken as a whole, it is evil.


    8 Another person commits adultery and other sexual sins, yet avoids certain foods. While fasting, he does evil. He uses the power of his wealth to drag many people down, and in his extreme wickedness he even carries out the commandments. His conduct has two faces, but taken as a whole, it is evil.


    9 Such people are like hares: they are half clean, but in truth they are unclean.[a]


    10 For God declared this in the tablets containing the commandments.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The comparison presents hares as partly resembling clean animals while still being ritually unclean.
    reason: cultural_note
