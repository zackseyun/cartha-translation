translation:
  language: en
  text: '1. See, my children: two things are present in everything. One stands opposite the other, and one is hidden beneath the other. Greed is hidden beneath wealth, drunkenness beneath celebration, grief beneath laughter, and debauchery beneath marriage.


    2. Death follows life, dishonor follows glory, night follows day, and darkness follows light. Yet everything is under the day.[a] Righteous things are under life, and unrighteous things are under death. Therefore eternal life also awaits death.[b]


    3. No one can call truth falsehood or call what is righteous unrighteous, because all truth is under the light, just as everything is under God.


    4. I put all these things to the test in my life. I did not stray from the Lord’s truth. I sought out the commandments of the Most High and followed them with all my strength.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The repeated word “under” may indicate a moral or cosmic domain, but its exact meaning is left open.
    reason: cultural_note
  - marker: b
    text: This difficult line preserves the Greek wording; its precise sense is left open.
    reason: textual_variant
