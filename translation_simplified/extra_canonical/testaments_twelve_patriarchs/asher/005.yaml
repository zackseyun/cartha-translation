  rationale: Two short sentences make the contrast easier to grasp without reducing it to vague sides.
- pob_phrase: in wealth, greed; in merriment, drunkenness; in laughter, grief; in marriage, debauchery
  simplified_phrase: Greed is hidden beneath wealth, drunkenness beneath celebration, grief beneath laughter, and debauchery beneath marriage
  preserved_meaning: One condition is asserted to lie concealed beneath another.
  reasoning_layer_used: Source syntax and lexical decisions for κέκρυπται and the contrast list
  rationale: Complete clauses clarify the list while preserving the asserted hidden-beneath image.
- pob_phrase: I tested all these things in my life
  simplified_phrase: I put all these things to the test in my life
  preserved_meaning: Asher says that he tested these teachings through his life experience.
  reasoning_layer_used: Lexical decision for ἐδοκίμασα
  rationale: The natural English idiom conveys experiential testing rather than formal examination.
