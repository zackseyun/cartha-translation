    changes_summary: Changed 'force of his wealth' to 'power of wealth' for a more natural rendering of δυναστείᾳ τοῦ πλούτου; changed 'performs the commandments' to 'keeps the commandments' for more idiomatic rendering of ποιεῖ τὰς ἐντολάς; changed 'the whole of it' to 'it is altogether' for a more natural rendering of τὸ δὲ ὅλον.
translation:
  language: en
  text: Another person commits adultery and practices sexual immorality, yet abstains from food. Even while fasting, he does evil. He uses the power of wealth to drag many people down. In his excessive wickedness, he still keeps the commandments. This is double-faced, but it is evil through and through.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Another commits adultery and practices sexual immorality, and abstains from foods
  simplified_phrase: Another person commits adultery and practices sexual immorality, yet abstains from food
  preserved_meaning: The person combines serious sexual wrongdoing with dietary restraint.
  reasoning_layer_used: POB text and immediate context
  rationale: “Yet” makes the passage’s moral contrast clear without adding selectivity to the fasting.
- pob_phrase: by the power of wealth he drags many down
  simplified_phrase: He uses the power of wealth to drag many people down
  preserved_meaning: His wealth gives him power that he uses to harm others.
  reasoning_layer_used: POB revision rationale
  rationale: The active sentence clarifies wealth’s role while preserving the forceful image of dragging people down.
- pob_phrase: This is double-faced, but it is altogether evil
  simplified_phrase: This is double-faced, but it is evil through and through
  preserved_meaning: The mixed appearance of religious discipline and wrongdoing does not make the conduct partly good.
  reasoning_layer_used: POB text and source image
  rationale: The wording retains the two-faced image and states the total judgment in common English.
translation_notes:
  risk_flags:
  - risk: “In his excessive wickedness” leaves the connection between wickedness and commandment-keeping paradoxical.
    mitigation: This preserves the POB’s ambiguity rather than assigning the man a specific wicked motive.
