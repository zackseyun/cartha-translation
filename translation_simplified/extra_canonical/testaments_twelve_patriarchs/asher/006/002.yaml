translation:
  language: en
  text: Those who live two-faced lives will receive double punishment. They do evil themselves and approve of others who do it. They imitate the spirits of deceit and fight against people.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the double-faced
  simplified_phrase: those who live two-faced lives
  preserved_meaning: They are divided or hypocritical in their conduct, not literally two-faced.
  reasoning_layer_used: POB text and Greek source image
  rationale: This keeps the face image while making its figurative meaning clear.
- pob_phrase: because they both do evil and approve those who do it
  simplified_phrase: They do evil themselves and approve of others who do it.
  preserved_meaning: Their guilt includes committing evil and endorsing others who commit it.
  reasoning_layer_used: POB clause structure and Greek source
  rationale: A separate sentence clearly preserves both grounds for punishment.
- pob_phrase: contending against men
  simplified_phrase: fight against people
  preserved_meaning: They actively oppose human beings.
  reasoning_layer_used: POB wording and immediate Greek syntax
  rationale: The wording uses natural inclusive English without identifying the spirits as co-combatants.
translation_notes:
  risk_flags:
  - risk: “Two-faced lives” may be understood only as ordinary hypocrisy.
    mitigation: Keeping the source image preserves the broader idea of divided conduct.
