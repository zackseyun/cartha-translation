  text: But you, my children, must not live with two faces[a] as they do—one turned toward goodness and the other toward wickedness. Instead, hold firmly to goodness alone, because goodness is where the Lord God rests, and it is what people long for.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek pictures a person whose moral character is divided between goodness and wickedness; it does not mean only social dishonesty.
    reason: lexical_alternative
