  preserved_meaning: The full series of paired moral categories remains distinct.
  reasoning_layer_used: Lexical decisions and theological decision on moral dualism
  rationale: Common wording clarifies the list without weakening its sharp two-way contrast.
- pob_phrase: the two purposes in our breasts, distinguishing them
  simplified_phrase: Within us are two purposes that distinguish between them
  preserved_meaning: The inward purposes distinguish between the ways of good and evil.
  reasoning_layer_used: Lexical decisions for στέρνοις and διακρίνοντα
  rationale: The main text gives the inward sense clearly while the note preserves the bodily image.
- pob_phrase: it drives the end of the action for him into evil, because the treasure of its purpose is filled with an evil spirit
  simplified_phrase: it drives the deed’s outcome toward evil, because the storehouse of its purpose is filled with an evil spirit
  preserved_meaning: An evil inward purpose corrupts the final result of an outwardly good deed.
  reasoning_layer_used: Lexical decisions for εἰς πονηρὸν αὐτῷ ἐλαύνει and θησαυρὸς τοῦ διαβουλίου
  rationale: Natural syntax clarifies the cause while retaining the driving and storehouse images.
