simplification_decisions:
- pob_phrase: simplicity / singleness of eye / sincerity of heart
  simplified_phrase: a simple, undivided heart / one purpose / a sincere heart
  preserved_meaning: The chapter’s central virtue remains a life free from divided motives, calculation, and deceit.
  reasoning_layer_used: POB lexical decision for ἁπλότης and its related nuances
  rationale: The varied plain-language phrases clarify the moral sense without reducing “simplicity” to naivety.
- pob_phrase: walk in guilelessness, not busying yourselves with meddling
  simplified_phrase: live ... without deceit; do not interfere in your neighbor’s affairs
  preserved_meaning: The commands against scheming and intrusive involvement remain distinct.
  reasoning_layer_used: POB lexical decisions for ἀκακία and πολυπραγμονεῖν
  rationale: Common verbs make both ethical commands immediately understandable.
- pob_phrase: my inward parts groaned with him
  simplified_phrase: I felt that person’s pain deep within me
  preserved_meaning: Issachar describes embodied, inward compassion for a suffering person.
  reasoning_layer_used: POB lexical decision for σπλάγχνα
  rationale: The rendering preserves the bodily depth of the image while avoiding an opaque anatomical phrase.
interpretive_expansions:
- pob_phrase: simplicity
  rendering: a simple, undivided heart
  claim: Simplicity here means sincere devotion without divided or calculating motives.
  evidence:
  - The POB lexical rationale defines the virtue as an undivided, uncalculating life.
  - The chapter contrasts simplicity with greed, deceit, envy, and meddling.
  confidence: high
  alternatives_preserved:
  - simplicity
  - single-heartedness
  - sincerity
- pob_phrase: do not divide yourselves into two heads
  rendering: Do not split into two rival groups
  claim: The two-headed-beast image warns Issachar’s descendants against internal division.
  evidence:
  - The command directly contrasts two heads with walking in singleness.
  - The following command calls for one purpose under the Lord’s law.
  confidence: high
  alternatives_preserved:
  - The two-headed-beast image remains in the verse.
translation_notes:
  risk_flags:
  - risk: Clarifying “simplicity” could narrow the chapter’s repeated ethical theme.
    mitigation: The text varies “simple,” “undivided,” and “sincere” while retaining freedom from deceit and greed.
  - risk: The promise of salvation from Levi and Judah could be made explicitly messianic or merely political.
    mitigation: The main text retains POB’s broad “salvation” without identifying its later fulfillment.
