translation:
  language: en
  text: '1. Listen, my children, to your father Issachar. Pay attention to the words of one whom the Lord loves.


    2. I was born as Jacob’s fifth son, as the wages paid for the mandrakes.[a]


    3. My brother Reuben had brought mandrakes from the field. Rachel met him and took them.


    4. Reuben cried out, and my mother Leah came out weeping.


    5. The mandrakes were sweet-smelling fruits that grew in the land of Haran below a streambed.


    6. Rachel said, “I will not give them to you. I will keep them in exchange for children, because the Lord has passed me by, and I have borne no children for Jacob.”


    7. There were two fruits. Leah said to Rachel, “Is it not enough that you have taken my husband? Will you take these from me too?”


    8. Rachel answered, “Then Jacob may sleep with you tonight in exchange for your son’s mandrakes.”


    9. But Leah said, “Jacob is mine, because I am the wife he married in his youth.”


    10. Rachel replied, “Do not boast or praise yourself. He was promised to me before you, and he served our father for fourteen years because of me.


    11. “But Laban tricked me. That night he took me away and kept Jacob from seeing me. If I had been there, this would not have happened to him.”


    12. “Even so, I let you have one night with Jacob in exchange for the mandrakes.”[b]


    13. Jacob slept with Leah that night. She became pregnant and gave birth to me. That is why I was named Issachar, meaning “wages.”


    14. So, my children, I learned that it is good to live with a simple, undivided heart.


    15. I became a farmer for my father and brothers, bringing in each crop in its season.


    16. My father blessed me because he saw that I lived with an undivided heart.


    17. I did not interfere in other people’s affairs or envy my neighbor.


    18. I did not slander anyone or threaten anyone’s life.


    19. My purpose was undivided, and I did everything with a sincere heart.


    20. Therefore, my children, keep God’s law. Learn to live with an undivided heart and without deceit. Do not interfere in your neighbor’s affairs.


    21. Instead, love the Lord and your neighbor, and show compassion to the poor and weak.


    22. Bend your back to the work of farming. Work the land in every kind of agriculture, and give thanks to the Lord.


    23. The Lord will bless you through the first produce of the earth, just as he blessed all the holy people from Abel until now.


    24. Your allotted share is the rich soil and the crops that hard work produces.


    25. Our father Jacob blessed me with the blessings of the earth and its first produce.


    26. The Lord gave Levi and Judah honor among Jacob’s sons.


    27. He gave them the priesthood and the kingdom as their inheritance from him.


    28. So do not exalt yourselves above them. Obey Levi and Judah.


    29. From them the Lord will raise up salvation for Israel.[c]


    30. Now I command you: Do not split into two rival groups, for every two-headed beast is detestable to the Lord.


    31. Instead, live with one purpose. Hold firmly to the Lord’s law and obey your father’s words.


    32. Know this: In the last times, your sons will abandon this simple way of life and cling to greed.


    33. They will leave behind a life without deceit and turn to malice. They will abandon the Lord’s commands and cling to Beliar.[d]


    34. They will give up farming and pursue their own evil desires. Then they will be scattered among the nations and serve their enemies.


    35. Therefore, tell your children these things so that, if they sin, they may quickly return to the Lord.


    36. He is merciful. He will rescue them and bring them back to their land.


    37. Look at me. I am now 126 years old, and I am not aware that I have committed any sin leading to death.


    38. I have had relations with no woman except my wife.


    39. I have not drunk wine and let it lead me astray.


    40. The desire for beautiful things has not deceived me.


    41. Deceit has not arisen in my heart.


    42. No lie has passed my lips.


    43. Whenever a poor or suffering person was in distress, I felt that person’s pain deep within me.


    44. I shared my bread with the poor.


    45. I did not eat alone.


    46. I gave clothes to those who had none.


    47. When I saw someone in need, I wept for him.


    48. My father took great joy in seeing that I lived without deceit.


    49. Now listen to me, my children, and live with simple, undivided hearts.


    50. I know that everyone whose heart is wholly devoted to the Lord will please him.


    51. Such a person does not desire gold, wrong a neighbor, or crave many kinds of food.


    52. He does not long for many different clothes or demand a long life.


    53. He simply waits for God’s will.


    54. The spirits of deceit have no power over him. He does not gaze at women’s beauty and so fill his mind with corrupt desire.


    55. There is no envy in his thoughts. No malicious person darkens his soul, and greed does not trouble his life.


    56. He lives uprightly and sees everything with sincerity. He turns his eyes away from the world’s error,


    57. so that he will not look upon the breaking of any of the Lord’s commands.


    58. Therefore, my children, keep these teachings. Then every spirit of Beliar will flee from you, and the deeds of wicked people will not rule over you.


    59. You will subdue every wild animal because the God of heaven is with you. He gives good things to all who live with simple hearts.


    60. When Issachar had finished giving these commands to his sons, he drew his feet up onto the bed and died at a good old age.


    61. His sons placed him on a burial platform. Later they carried him to Hebron and buried him there with his ancestors.'
