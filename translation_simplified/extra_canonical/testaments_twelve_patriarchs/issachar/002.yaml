translation:
  language: en
  text: '1. Then an angel of the Lord appeared to Jacob and said, “Rachel will bear two children because she despised sexual relations with her husband and chose self-control.”[a]


    2. Leah took the mandrakes and, in exchange for them, hired me for one night.[b] 3. Because of the mandrakes, Jacob went in to Rachel instead of me. 4. But the Lord listened to my prayer, and I became pregnant. 5. I had envied Rachel because she was having children while I had none. 6. The Lord heard me and gave me this child. 7. I had offered the mandrakes to the Lord through the priest of the Most High. Therefore, he gave me Issachar as my wages.


    8. So then, my children, listen to your father Issachar. 9. I was born as wages because of the mandrakes, and I became the payment my father received for being hired. 10. That is why I was named Issachar, which means “hire.”


    11. Now listen to me, my children. Live with an undivided heart, for I have seen that people whose hearts are free from deceit overcome every evil. 12. A man who does not desire gold does not wrong his neighbor. He does not crave rich foods or delight in many kinds of clothing. 13. He does not long for a very long life, but simply waits for God’s will. 14. Deceiving spirits have no power over him. He does not gaze at the beauty of women and let corrupt desire pollute his mind. 15. His thoughts are free from envy. No malicious person darkens his soul, and greed does not burden his life. 16. He lives uprightly and sees everything sincerely. He avoids an excessive desire for worldly wealth so that it will not lead him to break the Lord’s commandments.


    17. Therefore, my children, keep God’s law. Have an undivided heart and live without deceit. Do not interfere in your neighbor’s affairs. 18. Instead, love the Lord and your neighbor, and show compassion to the poor and the weak. 19. Bend your backs to farming. Work at every kind of field labor and give thanks to the Lord. 20. When you offer the first produce of the land to the Lord, he will bless you, just as he blessed all the holy people from Abel until now. 21. No other share has been given to you except the rich soil and the crops you raise through hard work. 22. Our father Jacob blessed me with the blessings of the land and its first produce. 23. The Lord honored Levi and Judah among Jacob’s sons and gave them an inheritance. To me he gave the land and the first produce of its crops.


    24. Therefore, do not pursue fine clothing or luxurious food. 25. Instead, cultivate the land with an undivided heart, and give the Lord the first produce from it. 26. If you do these things, every spirit of Beliar[c] will flee from you, and no wicked deed will rule over you. 27. You and your descendants will eat every good thing the land produces.


    28. But know this: in the last times, your descendants will abandon their undivided devotion and cling to desires that can never be satisfied. 29. They will leave innocence behind and turn toward malice. They will abandon the Lord’s commandments and cling to Beliar. 30. They will stop farming and pursue their own evil schemes. Then they will be scattered among the nations and serve their enemies.


    31. Therefore, tell these things to your children so that, if they sin, they may quickly return to the Lord. 32. For he is merciful. He will rescue them and bring them back to their land.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “spurned marital relations.” The Greek is unusually stark and preserves a tension with the Genesis account.
    reason: lexical_alternative
  - marker: b
    text: This episode draws on Genesis 30:14–18, where mandrakes are exchanged for a night with Jacob.
    reason: cross_reference
  - marker: c
    text: “Beliar” is the Greek form of the name often rendered “Belial.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: walk in simplicity of heart / gain singleness of heart
  simplified_phrase: live with an undivided heart / have an undivided heart
  preserved_meaning: The wording retains wholehearted moral integrity rather than reducing the virtue to mere honesty.
  reasoning_layer_used: POB lexical decision for ἁπλότης / ἁπλοῦς
  rationale: “Undivided heart” makes the central virtue immediately understandable while preserving its ethical depth.
- pob_phrase: not busying yourselves with meddling in the affairs of your neighbor
  simplified_phrase: do not interfere in your neighbor’s affairs
  preserved_meaning: The command still condemns intrusive involvement in another person’s concerns.
  reasoning_layer_used: POB lexical decision for περιεργάζεσθαι
  rationale: The shorter wording expresses the same negative force in natural modern English.
- pob_phrase: the fatness of the earth, whose fruits are raised by toil
  simplified_phrase: the rich soil and the crops you raise through hard work
  preserved_meaning: Issachar’s allotted prosperity remains tied to fertile land and agricultural labor.
  reasoning_layer_used: POB agricultural context and lexical decisions
  rationale: The concrete sense of fertile ground is clearer than the opaque English image “fatness of the earth.”
interpretive_expansions:
- pob_phrase: shunning excess in the desire for worldly gain, so that he may not see the corruption of the commandments of the Lord
  rendering: He avoids an excessive desire for worldly wealth so that it will not lead him to break the Lord’s commandments.
  claim: Excessive desire for wealth is presented as a force that leads a person to violate God’s commands.
  evidence:
  - The immediate clause directly links worldly desire with corruption of the commandments.
  - The surrounding warnings oppose greed to upright and sincere living.
  confidence: moderate
  alternatives_preserved:
  - The wording does not claim that wealth itself is sinful.
  - “Corruption of the commandments” may also suggest witnessing their violation.
- pob_phrase: cling to insatiable desire
  rendering: cling to desires that can never be satisfied
  claim: The desire is insatiable because it continually seeks more without reaching satisfaction.
  evidence:
  - The POB lexical field identifies acquisitive desire and greed.
  - The following verses describe escalating abandonment of innocence and obedience.
  confidence: high
  alternatives_preserved:
  - The object of the desire remains unspecified.
