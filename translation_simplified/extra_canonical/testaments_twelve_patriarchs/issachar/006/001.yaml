translation:
  language: en
  text: 'So understand this, my children: in the last times, your sons will give up a simple, sincere way of life and cling to greed. They will leave innocence behind and turn to deceitful schemes. They will abandon the Lord’s commandments and cling to Beliar.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beliar is the form of the name used here; it is also known as “Belial.”
