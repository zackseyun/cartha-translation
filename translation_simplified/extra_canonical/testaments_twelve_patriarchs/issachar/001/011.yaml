translation:
  language: en
  text: If deceit had not spread across the earth and human wickedness had not grown, you would not be looking at Jacob’s face.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: had guile not multiplied upon the earth
  simplified_phrase: deceit had not spread across the earth
  preserved_meaning: Deception had become widespread in the world.
  reasoning_layer_used: POB text and Greek source
  rationale: “Deceit” and “spread” express the old wording in common English while retaining its scope.
- pob_phrase: the wickedness of men advanced
  simplified_phrase: human wickedness had not grown
  preserved_meaning: Human evil had increased alongside deceit.
  reasoning_layer_used: Greek syntax and POB sentence logic
  rationale: The repeated negative makes the counterfactual relationship clear in natural English.
- pob_phrase: looking on the face of Jacob
  simplified_phrase: looking at Jacob’s face
  preserved_meaning: The addressee is able to see Jacob face to face.
  reasoning_layer_used: POB text
  rationale: The concrete face image is retained in ordinary modern phrasing.
translation_notes:
  risk_flags:
