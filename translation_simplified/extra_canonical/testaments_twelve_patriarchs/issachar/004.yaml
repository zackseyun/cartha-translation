translation:
  language: en
  text: He does not let envy shape his thinking. Malicious envy does not eat away at his soul,[a] and greed does not pull his mind in different directions. Instead, he lives with a simple, undivided soul and sees everything with an upright heart. He does not accept the evil, envious way of seeing that comes from the world’s error,[b] so that he will not see the commandments of the Lord in a distorted way.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The clause “Malicious envy does not eat away at his soul” is an expansion found in the printed Greek witness and is included here.
    reason: textual_variant
  - marker: b
    text: The Greek literally speaks of “evil eyes,” which may suggest the “evil eye,” an envious or hostile way of looking.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: does not envy in his deliberations
  simplified_phrase: does not let envy shape his thinking
  preserved_meaning: Envy does not influence his inward thought and reflection.
  reasoning_layer_used: Lexical decisions for ζηλοῖ and διαβουλίοις
  rationale: The active wording clearly expresses envy’s absence from his inward reasoning.
- pob_phrase: nor is there distraction in greed in his mind
  simplified_phrase: greed does not pull his mind in different directions
  preserved_meaning: Greed does not divide or preoccupy his mind.
  reasoning_layer_used: Lexical decisions for περισπασμός and ἀπληστείᾳ
  rationale: The wording directly preserves the image of attention being pulled apart.
- pob_phrase: not accepting evil eyes from the world’s error
  simplified_phrase: He does not accept the evil, envious way of seeing that comes from the world’s error
  preserved_meaning: He refuses to take in the world’s corrupt and potentially envious mode of perception.
  reasoning_layer_used: Lexical decisions for μὴ ἐπιδεχόμενος, ὀφθαλμοὺς πονηρούς, and πλάνης τοῦ κόσμου
  rationale: This avoids implying that he uses evil eyes while clearly conveying the image’s supported sense.
interpretive_expansions:
- pob_phrase: simplicity of soul
  rendering: a simple, undivided soul
  claim: Moral simplicity includes an inward life not divided between competing aims.
  evidence:
