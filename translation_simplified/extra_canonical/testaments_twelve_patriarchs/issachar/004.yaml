  - The contrast with a mind pulled in different directions supports this clarification.
  confidence: high
  alternatives_preserved:
  - simplicity of soul
  - sincerity of soul
- pob_phrase: evil eyes
  rendering: the evil, envious way of seeing
  claim: The image can describe a corrupt mode of perception marked by envy or hostility.
  evidence:
