  rationale: The wording explains “cultivation” in ordinary English without weakening the agrarian emphasis.
- pob_phrase: no other portion has been given to you except the richness of the earth through the toil of its fruits
  simplified_phrase: No other share has been given to you. Your share is the earth’s rich produce, gained through hard work.
  preserved_meaning: Issachar’s allotted livelihood is the land’s abundance obtained by agricultural toil.
  reasoning_layer_used: Lexical decisions for μερὶς, πιότητος τῆς γῆς, and ἐν πόνοις καρπῶν
  rationale: Two short sentences clarify the compressed inheritance and labor imagery.
