translation:
  language: en
  text: '1 Therefore, my children, keep the law of God. Live with simplicity and innocence, and do not interfere in what your neighbors do. 2 Love the Lord and your neighbor. Show mercy to the poor and the weak.


    3 Bend your backs to farming, and work hard at every task of cultivating the land. Offer gifts to the Lord with thanksgiving. 4 The Lord will bless you through the firstfruits—the first part of the land’s produce—just as he blessed all the holy ones from Abel until now.[a] 5 No other share has been given to you. Your share is the earth’s rich produce, gained through hard work. 6 My father Jacob also blessed me with blessings from the earth and with the firstfruits of its produce.


    7 The Lord honored Levi and Judah among Jacob’s sons and gave each his inheritance: the priesthood to Levi and the kingdom to Judah. 8 Therefore, obey them and live with the same simplicity as your father.


    [But Gad was given the task of destroying the marauding raids that came against Israel.][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The holy ones from Abel until now” probably means the line of accepted worshipers beginning with Abel.
    reason: cross_reference
  - marker: b
    text: The clause about Gad is awkward here and may be a later addition or a displaced line, but it is included because it appears in the Greek witness.
    reason: textual_variant
