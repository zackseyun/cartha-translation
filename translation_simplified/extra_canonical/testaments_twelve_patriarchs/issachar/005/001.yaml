translation:
  language: en
  text: So, my children, obey God’s law. Cultivate a sincere and straightforward character, and live innocently. Do not concern yourselves with what your neighbor does.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: keep the law of God
  simplified_phrase: obey God’s law
  preserved_meaning: They must follow what God commands.
  reasoning_layer_used: POB controlling text
  rationale: “Obey” gives the intended sense of “keep” in common English.
- pob_phrase: acquire simplicity
  simplified_phrase: cultivate a sincere and straightforward character
  preserved_meaning: They must develop moral simplicity as a settled quality of character.
  reasoning_layer_used: Greek source and POB controlling text
  rationale: This avoids implying low intelligence while keeping the virtue broad rather than limiting it to the heart.
- pob_phrase: not concerning yourselves with the deeds of your neighbor
  simplified_phrase: Do not concern yourselves with what your neighbor does
  preserved_meaning: They must not become preoccupied with or intrude into another person’s actions.
  reasoning_layer_used: POB controlling text and revision rationale
  rationale: This preserves the broader prohibition rather than limiting it to active meddling.
interpretive_expansions:
- pob_phrase: simplicity
  rendering: a sincere and straightforward character
  claim: Here simplicity describes an uncomplicated moral character rather than lack of intelligence.
  evidence:
  - The POB presents simplicity as a virtue to acquire.
  - The neighboring command to live innocently places the term in a moral context.
  confidence: moderate
  alternatives_preserved:
  - simplicity
  - singleness of character
