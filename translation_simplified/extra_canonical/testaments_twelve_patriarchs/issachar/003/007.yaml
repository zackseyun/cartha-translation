translation:
  language: en
  text: The Lord multiplied the good things in my hands ten thousand times over. My father Jacob also knew that God was working with my sincere and wholehearted way of life. For, with a sincere heart, I gave the good things the earth produced to all who were poor and suffering.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: multiplied the good things ten thousandfold in my hands
  simplified_phrase: multiplied the good things in my hands ten thousand times over
  preserved_meaning: The Lord increased the good things entrusted to Issachar to an extraordinary degree.
  reasoning_layer_used: POB text and Greek source image
  rationale: This keeps the vivid number and the image of abundance in his hands.
- pob_phrase: God was working together with my simplicity
  simplified_phrase: God was working with my sincere and wholehearted way of life
  preserved_meaning: God's work was connected with Issachar's single-hearted character without making that character a strict cause.
  reasoning_layer_used: POB text, immediate context, and repeated simplicity language
  rationale: This explains simplicity while preserving the source's cooperative connection.
- pob_phrase: provided to all the poor and afflicted from the good things of the earth
  simplified_phrase: gave the good things the earth produced to all who were poor and suffering
  preserved_meaning: Issachar provided the earth's produce to every needy and distressed person.
  reasoning_layer_used: POB text and source context
  rationale: Natural wording clarifies both what he gave and who received it.
interpretive_expansions:
