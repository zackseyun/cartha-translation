translation:
  language: en
  text: 'If my mother Leah had not traded her right to be with her husband for the two apples,[a] she would still have been destined to bear eight sons. Instead, she bore six, and Rachel bore the other two, because through the mandrakes the Lord came to Rachel’s aid and enabled her to have children. He saw that Leah wanted to be with Jacob in order to have children, not merely for pleasure. The next day, she gave Jacob back again. So through the mandrakes the Lord listened to Rachel. Although Rachel had longed for them, she did not eat them. Instead, she dedicated them in the house of the Lord after taking them to the priest.[b]


    When I grew to manhood, my children, I lived with an upright heart. I worked as a farmer for my father and my brothers. My father blessed me because he saw that I lived before him in simplicity. I did not interfere in matters that were not mine. I was not envious or malicious toward my neighbor.[c] I never slandered anyone or found fault with another person’s way of life.


    When I was thirty-five years old, I took a wife. My hard work had drained my strength, and I had not been thinking about sexual pleasure with a woman. Instead, my toil made sleep overcome me.


    My father always rejoiced in my simplicity. I offered every firstborn[d] to the Lord through the priest, and then also to my father. The Lord multiplied my good things ten thousandfold, and my father likewise increased my good things twofold.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “apples,” but the surrounding account identifies them as mandrakes.
    reason: lexical_alternative
  - marker: b
    text: The references to the house of the Lord and the priest may reflect a later cultic framing of the patriarchal story.
    reason: textual_variant
  - marker: c
    text: Or “evil-eyed” or “begrudging toward my neighbor.”
    reason: lexical_alternative
  - marker: d
    text: “Every firstborn” may include the first offspring or first produce.
    reason: lexical_alternative
