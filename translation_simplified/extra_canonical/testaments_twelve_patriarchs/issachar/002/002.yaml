translation:
  language: en
  text: If my mother Leah had not traded the two fruits for sexual relations, she would have borne eight sons. That is why she bore six, and Rachel bore the other two, because the Lord visited Rachel in the matter of the mandrakes.
  philosophy: optimal-equivalence
