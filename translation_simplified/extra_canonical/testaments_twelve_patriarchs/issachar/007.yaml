translation:
  language: en
  text: '1[a]. As you can see, I am one hundred and twenty-six years old, and I am not aware of having committed any sin that leads to death. 2. I have never had sexual relations with any woman except my wife. I did not commit sexual immorality by letting my eyes wander. 3. I did not drink wine for deception or delusion, and I did not covet anything belonging to my neighbor. 4. No deceit entered my heart, and no lie passed my lips. 5. I groaned with everyone who was in pain, and I shared my bread with the poor. I lived in godliness all my days and held firmly to truth. 6. I loved the Lord with all my strength. I also loved every person with all my heart, more than I loved my children.


    7. My children, do these things too. Then every spirit of Beliar[b] will flee from you, and no evil deed done by wicked people will rule over you. You will subdue every wild beast because the God of heaven and earth is with you. He walks with people in wholehearted sincerity.[c]


    8. After saying this, Issachar commanded his sons to carry him up to Hebron and bury him there in the cave with his ancestors. 9. Then he stretched out his feet and fell asleep at a good old age, sound in every limb and still strong. He slept the eternal sleep.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “sin unto death”; this claims no known death-leading sin, not absolute sinlessness.
    reason: lexical_alternative
  - marker: b
    text: “Beliar” is the Greek form of the name sometimes given as “Belial.”
    reason: alternative_reading
  - marker: c
    text: The phrase may describe God accompanying people whose hearts are sincere and undivided.
    reason: alternative_reading
  - marker: d
    text: Other textual forms say that he died at a good old age or omit the description of his bodily strength.
    reason: textual_variant
