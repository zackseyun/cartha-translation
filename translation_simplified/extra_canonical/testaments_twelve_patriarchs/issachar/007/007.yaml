    timestamp: '2026-04-23T14:55:13Z'
    unchanged: false
    changes_summary: Replaced 'no deed' with 'every deed ... will not rule over you' to reflect πᾶσα more completely; changed 'walks with people' to 'goes with people' for closer alignment with συμπορευόμενον while keeping natural formal English.
translation:
  language: en
  text: You too, my children, do these things. Every spirit of Beliar will flee from you, and not one deed of wicked people will gain power over you. You will bring every wild beast under your control, with the God of heaven and earth at your side. He goes with people in simplicity of heart.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: every deed of wicked people will not rule over you
  simplified_phrase: not one deed of wicked people will gain power over you
  preserved_meaning: Every wicked deed is denied power over them.
  reasoning_layer_used: POB revision rationale and Greek πᾶσα
  rationale: The natural English negation preserves the source's distributive force.
- pob_phrase: you will subdue every wild beast
  simplified_phrase: you will bring every wild beast under your control
  preserved_meaning: They will overcome and exercise mastery over every wild beast.
  reasoning_layer_used: POB wording and immediate context
  rationale: The phrase explains “subdue” without weakening its force.
- pob_phrase: having with you the God of heaven and earth
  simplified_phrase: with the God of heaven and earth at your side
  preserved_meaning: God is present with them as they subdue the wild beasts.
  reasoning_layer_used: POB syntax and grounding review
  rationale: This recasts the participle naturally without making its relationship explicitly causal.
translation_notes:
  risk_flags:
  - risk: “At your side” may suggest a spatial image more strongly than the POB wording.
    mitigation: The phrase remains an ordinary expression of accompanying presence and avoids asserting explicit causation.
  - risk: “Simplicity of heart” remains less familiar to modern readers.
    mitigation: It is retained to preserve the live range of sincerity, guilelessness, and undividedness without assigning it too narrowly.
