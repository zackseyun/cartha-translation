  review_summary: The draft appropriately retains the Greek-form names and the text’s direct, genealogically difficult claim that Jochebed was Levi’s daughter; the explanatory notes are transparent and non-harmonizing. Its simplifications of marriage language and the attention marker are warranted. Revision is needed because verse 6 leaves the central reference of “the third generation” unexplained despite the POB audit trail identifying it as Levi’s descendants in relation to him. The recommended wording supplies that relation without resolving the text against other genealogies. “Same day” is preferable to “exactly the same day,” since it conveys the source claim without unnecessary intensification.
