translation:
  language: en
  text: '1. Gersam married, and he fathered Lomne and Semee by his wife.[a] 2. Kaath’s sons were Ambram, Isachar, Chebron, and Ozeel. 3. Merari’s sons were Mooli and Mouses. 4. During the sixty-fourth year of my life, Ambram married my daughter Jochebed.[b] He married her because they were born on the same day. 5. I was eight years old when I entered the land of Canaan, and eighteen when I killed Shechem. At nineteen, I served as priest. I married at twenty-eight and entered Egypt at forty-eight. 6. Look, my children: you are the third generation of my descendants. 7. Joseph died during the one hundred eighteenth year of my life.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The names throughout this chapter follow their Greek forms rather than the spellings familiar from many Bibles.
    reason: source_note
  - marker: b
    text: The Greek text calls Jochebed Levi’s daughter, despite the tension this creates with familiar biblical genealogies.
    reason: alternative_reading
