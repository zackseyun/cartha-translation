translation:
  language: en
  text: 1. So, my children, I have known that when the ages come to their end, you will do what is ungodly against the Lord. You will wickedly lay hands on him, and all the nations will mock you. 2. For Israel, our forefather, is pure and has no part in the ungodliness of the chief priests, who will lay their hands on the savior of the world.[a] 3. Just as the sun is pure before the Lord on the earth, so also you…[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The clause about the savior of the world is bracketed in the Greek witness and may be a later Christian expansion.
    reason: textual_variant
  - marker: b
    text: The provided Greek witness breaks off here, so the unfinished wording is preserved.
    reason: textual_variant
simplification_decisions:
- pob_phrase: at the end of the ages
  simplified_phrase: when the ages come to their end
  preserved_meaning: The statement still points to the final period of the ages.
  reasoning_layer_used: POB translation and source image
  rationale: The recast phrase clarifies the time reference while retaining the image of the ages ending.
- pob_phrase: you will act ungodly against the Lord, laying hands on him in wickedness
  simplified_phrase: you will do what is ungodly against the Lord. You will wickedly lay hands on him
  preserved_meaning: Their ungodly conduct includes hostile physical action against the Lord.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Two sentences clarify the accusation without specifying arrest or violence.
- pob_phrase: among all the nations you will become a mockery
  simplified_phrase: all the nations will mock you
  preserved_meaning: The nations will publicly ridicule them.
  reasoning_layer_used: POB lexical decision for χλευασμός
  rationale: The active wording expresses the same public shame in ordinary English.
interpretive_expansions:
- pob_phrase: our father Israel is pure from the ungodliness of the chief priests
  rendering: Israel, our forefather, is pure and has no part in the ungodliness of the chief priests
  claim: Israel is morally separate from and not implicated in the chief priests’ ungodliness.
  evidence:
  - The POB understands “pure” as moral and religious purity contrasted with ungodliness.
  - The phrase “pure from” indicates separation from the chief priests’ conduct.
  confidence: high
  alternatives_preserved:
  - Israel is pure from their ungodliness.
