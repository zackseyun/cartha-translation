translation:
  language: en
  text: '1 Then the angel opened the gates of heaven for me, and I saw the Holy Most High sitting on a throne.


    2 He said to me, “Levi, I have given you the blessings of the priesthood until I come and live among the people of Israel.”


    3 Then the angel brought me back down to earth. He gave me a weapon and a sword and said, “Take vengeance in Shechem for your sister Dinah. I will be with you, because the Lord sent me.”


    4 At that time I destroyed the sons of Hamor, as it is written on the tablets of the fathers.[a]


    5 I said to him, “Please, Lord, tell me your name so that I may call on you when I am in trouble.”


    6 He said, “I am the angel who intercedes for the family of Israel so that they will not be completely destroyed, for every evil spirit attacks them.”[b]


    7 After this, I awoke and praised the Most High.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tablets of the fathers” may refer to heavenly records in this vision, but the Greek does not explicitly call them heavenly.
    reason: lexical_alternative
  - marker: b
    text: The Greek text of this verse is difficult, and some witnesses expand the wording to clarify the angel’s protective role.
    reason: textual_variant
simplification_decisions:
- pob_phrase: until I come and dwell in the midst of Israel
  simplified_phrase: until I come and live among the people of Israel
  preserved_meaning: The first-person speaker promises to live among Israel.
  reasoning_layer_used: theological decision on the divine speaker
  rationale: Common wording preserves the direct speech without resolving the speaker’s identity.
- pob_phrase: Carry out vengeance in Shechem for Dinah your sister
  simplified_phrase: Take vengeance in Shechem for your sister Dinah
  preserved_meaning: Levi receives a forceful command of retributive vengeance for Dinah.
  reasoning_layer_used: lexical decision for Ποίησον ἐκδίκησιν
  rationale: Natural English word order retains the judicial force of “vengeance.”
- pob_phrase: the angel who intercedes for the race of Israel, so that they may not be struck down utterly
  simplified_phrase: the angel who intercedes for the family of Israel so that they will not be completely destroyed
  preserved_meaning: The angel protectively pleads for Israel against total destruction.
  reasoning_layer_used: lexical and theological decisions on the angelic role
  rationale: “Family” and “completely destroyed” clearly express the collective and protective sense.
translation_notes:
  risk_flags:
  - risk: Verse 2 may be speech from the Most High or from an angel speaking for God.
    mitigation: The text retains the ambiguous pronoun instead of naming the speaker.
  - risk: Verse 6 rests on a difficult text and an expanded reading found in some witnesses.
    mitigation: The footnote states the uncertainty while retaining the audited protective-intercessor reading.
