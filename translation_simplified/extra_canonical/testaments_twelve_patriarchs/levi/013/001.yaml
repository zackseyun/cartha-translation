  rationale: “Live” makes the idiom clear, while “sincerity” preserves its moral force.
- pob_phrase: in accordance with all his law
  simplified_phrase: following his entire law
  preserved_meaning: Their conduct must conform to the whole of God’s law.
  reasoning_layer_used: POB revision rationale and source clause
  rationale: The simpler wording preserves both conformity and the full scope of the law.
