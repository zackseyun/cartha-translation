translation:
  language: en
  text: Gain wisdom by reverently fearing God. Even if people are taken captive, cities and lands are destroyed, and all gold, silver, and possessions are lost, no one can take wisdom away from a wise person. Only spiritual blindness caused by godlessness and the hardening caused by sin can take that wisdom away.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Acquire wisdom in the fear of God
  simplified_phrase: Gain wisdom by reverently fearing God
  preserved_meaning: Wisdom is to be pursued with reverence and fear toward God.
  reasoning_layer_used: POB translation and Greek source
  rationale: The wording turns an abstract phrase into a natural English command while retaining fear of God.
- pob_phrase: if captivity comes
  simplified_phrase: Even if people are taken captive
  preserved_meaning: Wisdom can endure when captivity overtakes people.
  reasoning_layer_used: POB translation and immediate context
  rationale: The passive clause makes the abstract event of captivity immediately understandable.
- pob_phrase: gold and silver and every possession perish
  simplified_phrase: all gold, silver, and possessions are lost
  preserved_meaning: Material wealth and property may all be lost in disaster.
  reasoning_layer_used: POB translation and applied revision
  rationale: Ordinary wording preserves both the list of wealth and the completeness of its loss.
interpretive_expansions:
- pob_phrase: the blindness of ungodliness
  rendering: spiritual blindness caused by godlessness
  claim: The blindness concerns moral and spiritual perception rather than physical sight.
  evidence:
  - Blindness is presented as a threat to wisdom rather than bodily sight.
  - POB directly connects the blindness with ungodliness.
  confidence: high
  alternatives_preserved:
  - blindness caused by ungodliness
  - moral blindness from godlessness
- pob_phrase: the hardening of sin
  rendering: the hardening caused by sin
  claim: Sin is presented as producing or defining a hardening that can take wisdom away.
  evidence:
  - The source pairs hardening with blindness as an inward threat to wisdom.
  - POB directly links the hardening with sin.
  confidence: moderate
  alternatives_preserved:
  - the hardening of sin
  - sinful hardening
