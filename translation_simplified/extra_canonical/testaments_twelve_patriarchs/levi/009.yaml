translation:
  language: en
  text: 'Two days later, Judah and I went with our father Jacob to visit our grandfather Isaac. My grandfather blessed me in keeping with the visions I had seen, but he was unwilling to go with us to Bethel.


    When we arrived at Bethel, my father Jacob had a vision about me: I would serve as their priest. Early the next morning, he presented a tenth of everything to the Lord through me.


    Then we went to Hebron and stayed there. Isaac often called me to him to remind me of the Lord’s law, as the angel had shown me. He taught me the laws of the priesthood: the rules for sacrifices, offerings burned entirely, firstfruits, voluntary offerings, and peace offerings.[a] Every day he continued to instruct me about voluntary offerings. He gave me his full attention and said:


    “Guard yourself against the spirit of sexual immorality. This spirit persists[b] and is going to defile the holy things through your descendants. So choose a wife while you are still young. She must be without blemish and not defiled, and she must not come from foreign nations.


    “Before you approach the holy things, wash. When you offer a sacrifice before the Lord, wash your hands. When you finish the sacrifice, wash again.[c]


    “Make an offering to the Lord from twelve trees that have leaves,[d] as Abraham taught me. Offer sacrifices to the Lord from every clean animal and bird. From all your first produce and wine, offer the first portion as a sacrifice to the Lord God. Season every sacrifice with salt.”'
  philosophy: optimal-equivalence
