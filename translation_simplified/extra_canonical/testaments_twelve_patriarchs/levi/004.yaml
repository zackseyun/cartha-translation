translation:
  language: en
  text: '1. Know this: the Lord will bring judgment on humanity. Rocks will split, the sun will go dark, waters will dry up, and fire will cower. All creation will be shaken, invisible spirits will melt away, and the realm of the dead will be plundered at the suffering of the Most High. Yet people will persist in disobedience and continue in their wrongdoing. Therefore, they will receive a greater punishment.


    2. The Most High has heard your prayer. He will separate you from unrighteousness so that you may become his son, his servant, and one who ministers in his presence.


    3. You will shine the light of knowledge among Jacob''s people. You will be like the sun to all the descendants of Israel.


    4. You and all your descendants will receive a blessing until the Lord visits all the nations with the tender mercies of his son forever.


    5. This is why you have been given counsel and understanding, so that you may teach your sons about this.


    6. Those who bless him will be blessed, but those who curse him will perish.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: execute judgment upon the sons of men
  simplified_phrase: bring judgment on humanity
  preserved_meaning: The Lord will judge human beings.
  reasoning_layer_used: POB translation
  rationale: “Humanity” conveys the full scope without the archaic phrase “sons of men.”
- pob_phrase: Hades is being plundered
  simplified_phrase: the realm of the dead will be plundered
  preserved_meaning: The abode of the dead is pictured as being forcibly stripped.
  reasoning_layer_used: source image and POB translation
  rationale: The wording explains Hades while retaining the forceful image of plundering.
- pob_phrase: all the seed of Israel
  simplified_phrase: all the descendants of Israel
  preserved_meaning: The promise concerns Israel's whole family line.
  reasoning_layer_used: POB translation
  rationale: “Descendants” makes the family-line sense of “seed” immediately clear.
interpretive_expansions:
- pob_phrase: in Jacob
  rendering: among Jacob's people
  claim: Jacob refers to the community descended from Jacob rather than only to the individual.
  evidence:
  - The parallel line addresses all the descendants of Israel.
  - Jacob and Israel name the same patriarch in the paired lines.
  confidence: high
  alternatives_preserved:
  - within Jacob
translation_notes:
  risk_flags:
  - risk: The relationship expressed by “in the tender mercies of his son” remains compact and somewhat ambiguous.
    mitigation: “With” preserves the association without specifying the son as the means of visitation.
  - risk: The referent of “him” in verse 6 is not explicit.
    mitigation: The pronoun remains unresolved rather than naming a specific person.
