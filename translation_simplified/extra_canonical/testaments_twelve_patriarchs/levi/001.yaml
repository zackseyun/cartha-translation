translation:
  language: en
  text: 'This is a record of Levi’s words, which he gave as solemn directions to his sons about everything they would do and what would happen to them until the day of judgment.


    While Levi was still in good health, he called his sons to him. But it was revealed to him that he was about to die. When they had gathered, he said to them:'
