  simplified_phrase: This is a record of Levi’s words
  preserved_meaning: The heading presents the text as a written account of Levi’s words.
  reasoning_layer_used: POB lexical decision for Ἀντίγραφον
  rationale: “Record” makes the documentary heading immediately clear without claiming an exact transcript.
- pob_phrase: which he ordained for his sons
  simplified_phrase: which he gave as solemn directions to his sons
  preserved_meaning: Levi formally prescribed these words for his sons.
  reasoning_layer_used: POB lexical decision for διέθετο
  rationale: The wording explains the formal force of “ordained” in common English.
- pob_phrase: For he was in sound health when he called them to himself
  simplified_phrase: While Levi was still in good health, he called his sons to him
  preserved_meaning: Levi summoned his sons although he was not visibly dying.
  reasoning_layer_used: POB lexical and narrative decisions
  rationale: Naming Levi and his sons removes unclear pronouns and simplifies the clause order.
