translation:
  language: en
  text: '1. And now, my children, I command you: fear the Lord your God with all your heart. Live with an undivided heart, following his entire law.


    2. Teach your children to read, so that they may grow in understanding throughout their lives by continually reading the law of God. 3. Everyone who comes to know the law of the Lord will be honored and will belong wherever they go. 4. They will gain many friends beyond their own family,[a] and many people will want to serve them and hear the law from their lips.


    5. Therefore, my children, practice righteousness on earth, so that you may find it in heaven.[b] 6. Sow what is good in your souls, and you will find good in your life. But if you sow what is evil, you will reap every kind of turmoil and suffering.


    7. Gain wisdom in the fear of God. Captivity may come; cities and lands may be destroyed; gold, silver, and every possession may be lost. Yet no one can take wisdom away from a wise person. Only the blindness of ungodliness and the hardening of sin can rob someone of it. 8. If people keep themselves from these evil deeds, wisdom will shine for them even among enemies. Even in a foreign land, they will have a homeland; among foes, they will be found to be friends.


    9. Everyone who teaches what is good and also does it will share the throne of kings, just as my brother Joseph did.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek phrase is difficult and may mean either friends beyond the family circle or more friends than parental standing alone could provide.
    reason: lexical_alternative
  - marker: b
    text: The Greek leaves unstated what will be found in heaven, probably the righteousness practiced on earth or its heavenly reward.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: walk in simplicity according to all his law
  simplified_phrase: Live with an undivided heart, following his entire law
  preserved_meaning: The command calls for straightforward, single-hearted conduct shaped by the whole law.
  reasoning_layer_used: Lexical decision for ἁπλότης and doctrine-realignment revision
  rationale: This wording keeps the ethical meaning without suggesting a lack of intelligence.
- pob_phrase: teach your children letters
  simplified_phrase: Teach your children to read
  preserved_meaning: Parents are to give their children literacy so they can keep reading God's law.
  reasoning_layer_used: Lexical decision for γράμματα and immediate context
  rationale: Ordinary English states the practical purpose of learning letters.
- pob_phrase: wisdom will become for him splendid even among enemies, and in a foreign land a homeland, and in the midst of foes he will be found a friend
  simplified_phrase: wisdom will shine for them even among enemies. Even in a foreign land, they will have a homeland; among foes, they will be found to be friends
  preserved_meaning: Wisdom remains radiant while the wise person finds belonging and friendship in hostile places.
  reasoning_layer_used: Lexical decisions for λαμπρά and πατρίς plus the grounding review
  rationale: The revision separates the three images without assigning all of them to wisdom.
interpretive_expansions:
- pob_phrase: many friends more than parents
  rendering: many friends beyond their own family
  claim: Learning the law brings relationships beyond the family circle.
  evidence:
  - The POB footnote identifies this as the likely sense of the difficult phrase.
  - The context describes honor and social acceptance wherever the learned person goes.
  confidence: moderate
  alternatives_preserved:
  - More friends than parental standing alone could provide.
- pob_phrase: except the blindness of ungodliness and the hardening of sin
  rendering: Only the blindness of ungodliness and the hardening of sin can rob someone of it
  claim: External loss cannot remove wisdom, but moral corruption can.
  evidence:
  - The POB theological decision treats moral corruption as the effective exception.
  - The passage contrasts destroyed possessions with wisdom's inward security.
  confidence: high
  alternatives_preserved:
  - The vices may be personified as external forces.
  - The clause may be a later explanatory gloss.
