translation:
  language: en
  text: '1 After the Lord has brought vengeance on them, the priesthood will come to an end.


    2 Then the Lord will raise up a new priest. All the Lord’s words will be revealed to him, and for many days he will bring true judgment upon the earth.


    3 His star will rise in heaven like a king. It will shine with the light of knowledge, like the sun by day, and he will be honored throughout the inhabited world.


    4 He will shine over the earth like the sun. He will drive away all darkness from under heaven, and there will be peace throughout the earth.


    5 The heavens will rejoice in his days. The earth will be glad, and the clouds will rejoice. The angels of the Lord’s glorious presence will be glad because of him.[a]


    6 The heavens will open, and holy consecration will come upon him from the glorious temple. A fatherly voice will speak, like the voice of Abraham to Isaac.


    7 The glory of the Most High will be proclaimed over him, and a spirit of understanding and sanctification will rest upon him.[b]


    8 For he will truly give the Lord’s majesty to his sons forever. No one will succeed him, from generation to generation, forever.


    9 During his priesthood, the nations throughout the earth will grow in knowledge and be enlightened by the Lord’s grace.[c] During his priesthood, sin will come to an end, and the lawless will stop doing evil.[d]


    10 He will open the gates of paradise and remove the threatening sword that stands against Adam.[e]


    11 He will give the holy ones food to eat from the tree of life, and the spirit of holiness will be upon them.


    12 He will bind Beliar and give his children authority to trample on evil spirits.


    13 The Lord will rejoice over his children and take pleasure in his beloved ones forever.


    14 Then Abraham, Isaac, and Jacob will rejoice, and I too will be glad. All the holy ones will put on righteousness.'
