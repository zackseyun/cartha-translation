simplification_decisions:
- pob_phrase: will be in pains
  simplified_phrase: will suffer
  preserved_meaning: The fourth person will directly experience pain or distress.
  reasoning_layer_used: Greek source and POB translation
  rationale: The direct verb states the personal suffering naturally without adding a period or setting.
- pob_phrase: will increase upon him to abundance
  simplified_phrase: will increase greatly against him
  preserved_meaning: Lawlessness will grow abundantly in a personal relation to the fourth.
  reasoning_layer_used: Greek source, POB revision, and grounding review
  rationale: This avoids implying that he rules while retaining the personal force and marking the more literal alternative.
- pob_phrase: all Israel will hate each one his neighbor
  simplified_phrase: everyone in Israel will hate their neighbor
  preserved_meaning: Hatred will extend throughout Israel from person to person.
  reasoning_layer_used: Greek source and POB translation
  rationale: Ordinary collective wording preserves both the universal scope and neighbor-against-neighbor hatred.
interpretive_expansions:
