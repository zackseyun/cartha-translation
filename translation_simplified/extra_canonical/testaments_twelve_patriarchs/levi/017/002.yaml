translation:
  language: en
  text: For every jubilee period[a] there will be a priesthood. And in the first jubilee, the first person anointed to serve as priest will be great. He will speak to God as he would speak to a father, and his priesthood will be filled with the Lord. [In his days of joy, he will arise for the salvation of the world.][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A jubilee is a recurring period used here to divide history.
    reason: cultural_note
  - marker: b
    text: The final sentence is bracketed in the source edition.
    reason: source_note
simplification_decisions:
- pob_phrase: in each jubilee
  simplified_phrase: every jubilee period
  preserved_meaning: Each recurring jubilee has a corresponding priesthood.
  reasoning_layer_used: source wording and POB translation
  rationale: Adding “period” helps readers understand jubilee as a division of time.
- pob_phrase: the one first anointed for the priesthood
  simplified_phrase: the first person anointed to serve as priest
  preserved_meaning: This person is the first to receive anointing for priestly service.
  reasoning_layer_used: POB controlling text
  rationale: The active wording makes the person’s appointment easier to follow.
- pob_phrase: he will speak to God as to a father
  simplified_phrase: He will speak to God as he would speak to a father
  preserved_meaning: He addresses God with the relationship and manner associated with a father.
  reasoning_layer_used: Greek source and POB translation
  rationale: The recast comparison removes an unnatural English construction without adding a sonship claim.
translation_notes:
  risk_flags:
  - risk: “Filled with the Lord” remains an unusual expression.
    mitigation: It is retained because clearer paraphrases could overdefine the relationship between the Lord and the priesthood.
  - risk: The source edition brackets the final sentence.
    mitigation: The brackets are preserved and identified in an anchored source note.
