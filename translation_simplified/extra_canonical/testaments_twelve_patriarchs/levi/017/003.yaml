  preserved_meaning: The event occurs within the second named division of time.
  reasoning_layer_used: POB text and source chronology
  rationale: Adding “period” makes the time reference clear without defining its disputed length.
- pob_phrase: will be seized in mourning for a beloved one
  simplified_phrase: will be seized while mourning a loved one
  preserved_meaning: He is seized during grief connected with someone beloved.
  reasoning_layer_used: POB revision rationale and Greek source
  rationale: The new clause uses ordinary English while retaining both the seizure and the mourning.
- pob_phrase: his priesthood will be honored, and he will be glorified by all
  simplified_phrase: His priesthood will be held in honor, and everyone will glorify him
  preserved_meaning: Both his priestly office and he himself receive honor.
  reasoning_layer_used: POB text and Greek parallel clauses
  rationale: The active final clause is easier to read and keeps the two distinct objects of honor.
