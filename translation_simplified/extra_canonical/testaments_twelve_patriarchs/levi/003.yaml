translation:
  language: en
  text: 'Listen now to what you were shown about the heavens. The lowest heaven is dark because it sees all the unrighteous deeds people commit. It holds fire, snow, and ice, prepared for the day God has appointed to judge humanity with justice. All the spirits that bring punishment and vengeance on the lawless are there.


    Above it is the holy place. There are the heavenly armies appointed for the day of judgment. They will carry out vengeance on the spirits of deceit and on Beliar.[a] Above these armies are the holy ones.


    The Great Glory lives in the highest heaven of all, far above all that is holy. In the heaven next to it are the archangels. They serve the Lord and make propitiation for the sins that the righteous commit without knowing it.[b] They offer the Lord a sweet-smelling fragrance, a reasonable offering that uses no blood.[c]


    In the heaven below that are angels who carry answers to the angels who stand in the Lord’s presence. In the next heaven below are thrones and dominions, where hymns are continually offered to God.


    Therefore, when the Lord looks upon us in his holiness, the heavens shake. The earth also moves from its foundations and trembles to its depths. Yet people do not understand these things. They go astray and provoke the Most High to anger.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Beliar” is the Greek form of the name often rendered “Belial.”
    reason: lexical_alternative
  - marker: b
    text: “Make propitiation” may also be translated “make atonement.”
    reason: lexical_alternative
  - marker: c
    text: “Reasonable” may also mean “rational” or, more interpretively, “spiritual.”
    reason: lexical_alternative
