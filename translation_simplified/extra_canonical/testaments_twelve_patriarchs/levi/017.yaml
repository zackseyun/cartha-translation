translation:
  language: en
  text: 'Since you have heard about the seventy weeks,[1] now hear about the priesthood. Each jubilee period will have its own priesthood.


    In the first jubilee, the first person anointed to be a priest will be great. He will speak to God as he would to a father, and his priesthood will be complete with the Lord. [In his days of joy, he will arise for the salvation of the world.][2]


    In the second jubilee, the one anointed will be conceived during the sorrow of someone beloved. His priesthood will be honored, and everyone will give him glory.


    The third priest will be taken in grief. The fourth will suffer pain because more and more unrighteousness will come upon him, and all Israel will hate one another. The fifth will be taken in darkness. The same will be true of the sixth and seventh.


    But in the seventh[3] there will be a defilement[4] that I cannot speak about before people. The people who do these things will know what I mean. Therefore, they will be taken captive and plundered, and their land and possessions will be destroyed.


    In the fifth week, they will return to their devastated land and renew the house of the Lord.[5]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: “Seventy weeks” echoes the prophetic time periods in Daniel and refers back to an earlier explanation.
    reason: cross_reference
  - marker: '2'
    text: This bracketed sentence is uncertain in the surviving textual witness and may be a later addition.
    reason: textual_variant
  - marker: '3'
    text: The text leaves open whether “the seventh” refers to the seventh priest or the seventh jubilee.
    reason: source_note
  - marker: '4'
    text: “Defilement” includes both ritual impurity and moral corruption in this priestly setting.
    reason: lexical_alternative
  - marker: '5'
    text: Renewing “the house of the Lord” may mean restoring or rebuilding the temple.
    reason: lexical_alternative
