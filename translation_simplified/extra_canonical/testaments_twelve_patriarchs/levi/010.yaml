translation:
  language: en
  text: '1 Now, my children, obey what I command you. I have told you everything I heard from my ancestors.


    2 I am not responsible for your rebellion against God and your breaking of his commands. You will do these things when the ages reach their completion [against the Savior of the world, the Messiah].[a] You will lead Israel astray and stir up great calamities from the Lord against him.[b]


    3 You will live without regard for God''s law in Israel. Your wickedness will become more than Jerusalem can bear. The temple veil will be torn apart and will no longer cover your shame.[c]


    4 You will be taken captive and scattered among the nations. There you will be objects of scorn and a curse.


    5 For the house the Lord will choose will be called Jerusalem, as written in the book of righteous Enoch.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The bracketed words appear in the Greek witness used here, but many scholars consider them a later Christian addition.
    reason: textual_variant
  - marker: b
    text: The Greek sentence is difficult, and it is uncertain whom “him” refers to.
    reason: alternative_reading
  - marker: c
    text: The “veil” is the inner hanging in the temple and may also be called a curtain.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: keep what I command you, since I have declared to you all that I heard from my fathers
  simplified_phrase: obey what I command you. I have told you everything I heard from my ancestors
  preserved_meaning: Levi commands obedience to the ancestral teaching he has passed on.
  reasoning_layer_used: POB lexical decisions for φυλάξατε and ἐντέλλομαι
  rationale: Two direct sentences make the command and its basis easier to follow.
- pob_phrase: your ungodliness and transgression
  simplified_phrase: your rebellion against God and your breaking of his commands
  preserved_meaning: The wording retains both the offense against God and the violation of his commands.
  reasoning_layer_used: POB lexical decisions for ἀσεβείας and παράβασις
  rationale: The explicit wording clarifies both distinct but cumulative offenses.
- pob_phrase: stirring up great evils from the Lord against him
  simplified_phrase: stir up great calamities from the Lord against him
  preserved_meaning: Their actions bring severe divine judgments while the pronoun remains unresolved.
  reasoning_layer_used: POB lexical rationale for κακὰ μεγάλα and theological decision on the ambiguous pronoun
  rationale: “Calamities” prevents a moral-evil misunderstanding without resolving the syntax.
interpretive_expansions:
- pob_phrase: your ungodliness and transgression
  rendering: your rebellion against God and your breaking of his commands
  claim: Ungodliness concerns offense against God, while transgression concerns violating his commands.
  evidence:
  - The POB lexical rationale gives ungodliness a religious and covenantal dimension.
  - The POB lexical rationale defines transgression as crossing a known command.
  confidence: high
  alternatives_preserved:
  - ungodliness and transgression
  - godlessness and violation
translation_notes:
  risk_flags:
  - risk: The antecedent of “him” in verse 2 remains unclear.
    mitigation: The pronoun is preserved, and footnote [b] states the ambiguity.
  - risk: The bracketed messianic phrase may be a later addition.
    mitigation: Brackets and footnote [a] preserve both the witness and the textual concern.
