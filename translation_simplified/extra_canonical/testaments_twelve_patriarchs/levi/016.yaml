translation:
  language: en
  text: 'Now I know that for seventy weeks you will go astray.[a] You will treat the priesthood as unholy and make the altars unclean. You will set aside the law. In your wicked distortion of what is right, you will treat the prophets’ words with contempt. You will persecute righteous people and hate those devoted to God. You will detest what truthful people say.


    You will call a man who renews the law by the power of the Most High a deceiver.[b] In the end, you will rush to kill him without recognizing his stature.[c] In your wickedness, you will bring the guilt of his innocent blood upon your own heads.


    But I tell you that because of him, your holy places will be destroyed down to the ground. No ritually clean place will remain for you. Instead, you will be scattered among the nations and become an object of cursing. This will continue until he himself visits you again, shows you compassion, and receives you.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek wording of this sentence is difficult and shows signs of textual disturbance. This translation follows the witness provided, but the sentence may reflect expansion or later interpolation.
    reason: textual_variant
  - marker: b
    text: The Greek wording of this passage is difficult and may be a later expansion; “renews the law” could also mean “makes the law new.”
    reason: textual_variant
  - marker: c
    text: “His stature” may refer to his true worth or his majesty.
    reason: lexical_alternative
  - marker: d
    text: “He himself” may refer either to God or to the man mentioned earlier.
    reason: alternative_reading
