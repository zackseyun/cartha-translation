translation:
  language: en
  text: 'It contains fire, snow, and ice, kept ready for the day God has appointed, when he will judge humanity with justice. All the spirits of punishment are there, ready to take vengeance on the lawless.


    Above it is the holy place. There the armies of heaven are assembled for the day of judgment. They will carry out vengeance against the spirits of deceit and Beliar.[b] Above them are the holy ones. At the very highest level dwells the Great Glory, exalted far above all holiness.


    In the heaven just below are the archangels. They serve the Lord and make propitiation[a] to him for all the sins that righteous people commit without knowing it. They offer the Lord a sweet-smelling fragrance—a reasonable offering made without blood.[c] In the heaven below that are the angels who carry answers to the angels who stand in the Lord’s presence. In the next heaven down are thrones and dominions, where hymns are continually sung to God.


    Therefore, when the Lord looks upon us from the height of his holiness, the heavens shake. The earth moves from its foundations; it trembles and shakes to its deepest parts. Yet human beings do not understand these things. They go astray and provoke the Lord to anger.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “make atonement to the Lord”; the Greek verb can have either sense in worship contexts.
    reason: lexical_alternative
  - marker: b
    text: “Beliar” is the Greek form of the name often rendered “Belial.”
    reason: lexical_alternative
  - marker: c
    text: “A reasonable and bloodless offering” may also mean “a rational and bloodless offering” or, more interpretively, “a spiritual and bloodless offering.”
    reason: lexical_alternative
