translation:
  language: en
  text: '1. When I married Melcha, I was twenty-eight years old. 2. She became pregnant and gave birth to a son. I named him Gersam because we were living as foreigners in that land. 3. I saw that he was not in the highest rank.


    4. Kohath was born when I was thirty-five years old. In a vision toward the sunrise, 5. I saw him standing in the heights, in the middle of the congregation. 6. Therefore I named him Kohath—a name explained as “the beginning of majesty and assembly.”[a]


    7. When I was forty years old, my third son, Merari, was born. His mother had a difficult labor, so I named him Merari, which means “bitterness.” 8. Jochebed was born in Egypt when I was sixty-four years old, because at that time I was highly honored among my brothers.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek explanation of Kohath’s name is textually difficult; this wording follows its surviving sense without trying to reconstruct it.
    reason: textual_variant
  - marker: b
    text: Some details around this verse are uncertain, but the text clearly says that Jochebed was born in Egypt when Levi was sixty-four.
    reason: textual_variant
