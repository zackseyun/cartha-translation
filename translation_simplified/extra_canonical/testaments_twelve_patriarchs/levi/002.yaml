translation:
  language: en
  text: '1. I am Levi. I was born in Haran and came with my father to Shechem.


    2. I was still young, about twenty years old, when Simeon and I carried out vengeance against Hamor for our sister Dinah.


    3. While I was tending sheep in Abelmaul, a spirit of understanding from the Lord came upon me. I saw everyone ruining the way they lived. Sin was being built on a wall, and injustice sat on towers.


    4. I grieved over the human race, and I prayed that the Lord would save me.


    5. Then sleep came over me. I saw a high mountain, and I was on it.


    6. The heavens were opened. An angel of the Lord said to me, “Levi, Levi, enter.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: I, Levi, was born in Haran, and I came with my father to Shechem
  simplified_phrase: I am Levi. I was born in Haran and came with my father to Shechem.
  preserved_meaning: Levi identifies himself and recounts his birth and journey with his father.
  reasoning_layer_used: POB translation and source clause structure
  rationale: Two short sentences make the autobiographical opening easier to follow.
- pob_phrase: I saw all people destroying their way
  simplified_phrase: I saw everyone ruining the way they lived
  preserved_meaning: Levi sees people ruining their own conduct and way of life.
  reasoning_layer_used: POB lexical decision for ἀφανίσαντας τὴν ὁδὸν αὐτῶν
  rationale: The wording explains the biblical image of a person’s “way” while preserving its moral force.
- pob_phrase: I was grieved over the race of the sons of men
  simplified_phrase: I grieved over the human race
  preserved_meaning: Levi grieves over humankind as a whole.
  reasoning_layer_used: POB lexical rationale and cultural note
  rationale: “Human race” gives the solemn Semitic expression its full scope in common English.
translation_notes:
  risk_flags:
  - risk: Readers may take “a spirit of understanding” as an explicit title for the Holy Spirit.
    mitigation: The indefinite wording preserves divine agency without identifying the spirit more specifically than the Greek does.
  - risk: The command “enter” does not say what Levi is to enter.
    mitigation: The object remains unstated because the source and POB preserve this visionary ambiguity.
