translation:
  language: en
  text: During his priesthood, the nations throughout the earth will grow in knowledge, and the Lord’s grace will give them light. [But Israel will dwindle in ignorance and be darkened by grief.][a] During his priesthood, sin will come to an end, and the lawless will stop doing evil. [The righteous will find rest in him.][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The source edition places this sentence in brackets, indicating uncertainty about the wording.
    reason: source_note
  - marker: b
    text: The source edition places this sentence in brackets, indicating uncertainty about the wording.
    reason: source_note
simplification_decisions:
- pob_phrase: the nations will be multiplied in knowledge upon the earth
  simplified_phrase: the nations throughout the earth will grow in knowledge
  preserved_meaning: The nations will experience an increase in knowledge across the earth.
  reasoning_layer_used: POB translation and Greek source
  rationale: This recasts the difficult passive wording without changing what increases.
- pob_phrase: they will be enlightened by the grace of the Lord
  simplified_phrase: the Lord’s grace will give them light
  preserved_meaning: The Lord’s grace is the means by which the nations receive light.
  reasoning_layer_used: POB translation and Greek source
  rationale: The active sentence makes the same agency and light image easier to follow.
- pob_phrase: the lawless will cease from evil
  simplified_phrase: the lawless will stop doing evil
  preserved_meaning: Lawless people will no longer practice evil.
  reasoning_layer_used: applied revision and POB translation
  rationale: Common verbal wording preserves the revision’s intended sense.
translation_notes:
  risk_flags:
  - risk: “Grow in knowledge” could be read as describing growth in the nations themselves rather than an increase in their knowledge.
    mitigation: The phrase keeps knowledge as the explicit sphere of growth, matching the POB’s controlling sense.
  - risk: Readers may mistake bracketed sentences for ordinary punctuation.
    mitigation: Anchored source notes explain that the brackets reflect uncertainty in the source edition.
