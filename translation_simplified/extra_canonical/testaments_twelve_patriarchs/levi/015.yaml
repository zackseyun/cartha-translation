translation:
  language: en
  text: Therefore, the temple the Lord will choose will become desolate in the midst of your defilement, and you will be taken captive among all the nations. They will see you as something detestable. Because of God’s righteous judgment, you will suffer disgrace and everlasting shame. Everyone who hates you will rejoice over your destruction. If not for Abraham, Isaac, and Jacob, our fathers, you would receive no mercy. Not one of your descendants would be left on the earth.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says “seed,” a covenantal term for one’s descendants.
    reason: source_note
simplification_decisions:
- pob_phrase: will become desolate in your uncleanness
  simplified_phrase: will become desolate in the midst of your defilement
  preserved_meaning: The temple is devastated amid the people’s cultic and moral pollution.
  reasoning_layer_used: Lexical decision for ἀκαθαρσία and the revision preserving ἐν
  rationale: “Defilement” is clearer than “uncleanness,” while “in the midst of” avoids making the phrase purely causal.
- pob_phrase: you will be an abomination to them
  simplified_phrase: They will see you as something detestable
  preserved_meaning: The nations will regard the captives with intense loathing.
  reasoning_layer_used: Lexical decision for βδέλυγμα
  rationale: The recast clause clarifies the relational meaning while retaining its strong force.
- pob_phrase: you will receive reproach and everlasting shame from the righteous judgment of God
  simplified_phrase: Because of God’s righteous judgment, you will suffer disgrace and everlasting shame
  preserved_meaning: Their enduring disgrace comes under God’s just judgment.
  reasoning_layer_used: Lexical and theological decisions for ὄνειδος, αἰσχύνην αἰώνιον, and δικαιοκρισίας
  rationale: The new clause order and common wording improve readability without defining the shame beyond the text.
translation_notes:
  risk_flags:
  - risk: “In the midst of your defilement” may suggest setting more strongly than cause.
    mitigation: It preserves the POB revision’s refusal to render ἐν only as “because of.”
  - risk: “Descendants” does not retain the covenantal image of “seed” in the main text.
    mitigation: The footnote preserves the source term and explains its lineage significance.
