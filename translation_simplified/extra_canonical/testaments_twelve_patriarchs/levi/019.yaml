translation:
  language: en
  text: '1. Now, my children, you have heard everything. Choose for yourselves: either light or darkness, either the Lord’s law or the deeds of Beliar.[a]


    2. His sons answered him, “We will walk before the Lord[b] and live according to his law.”


    3. Their father said, “The Lord is a witness, and his angels are witnesses; you are witnesses, and I am a witness—all concerning what you have said.” His sons replied, “Witnesses.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beliar is a proper name also known elsewhere as Belial.
    reason: alternative_reading
  - marker: b
    text: To “walk before the Lord” means to live one’s life in accountable obedience before God.
    reason: cultural_note
