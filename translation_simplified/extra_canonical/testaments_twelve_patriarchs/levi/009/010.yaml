simplification_decisions:
- pob_phrase: take for yourself a wife
  simplified_phrase: marry a woman
  preserved_meaning: The command is to enter marriage and take her as his wife.
  reasoning_layer_used: Greek source and POB translation
  rationale: “Marry a woman” expresses the action in ordinary modern English.
- pob_phrase: one who has no blemish or defilement
  simplified_phrase: a woman who has no blemish or defilement
  preserved_meaning: Both broad descriptions remain distinct without implying a specific defiling event.
  reasoning_layer_used: applied revision and grounding review
  rationale: Retaining both nouns avoids narrowing the unspecified meaning of defilement.
- pob_phrase: not from the stock of foreign nations
  simplified_phrase: not descended from foreign peoples
  preserved_meaning: She is not to come from the lineage of foreign peoples.
  reasoning_layer_used: Greek source and POB controlling text
  rationale: “Descended from” makes the ancestry restriction clear without the opaque phrase “from the stock of.”
translation_notes:
  risk_flags:
  - risk: “Blemish” and “defilement” may cover more than one kind of fault or condition.
    mitigation: Both broad terms are retained without imposing a narrower interpretation.
  - risk: The ancestry restriction may sound unusually broad to modern readers.
    mitigation: The source-driven restriction is preserved without added justification or commentary.
