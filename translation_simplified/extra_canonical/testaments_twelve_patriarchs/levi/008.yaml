translation:
  language: en
  text: '1 There I again saw a vision like the first one, after we had remained there for seventy days. 2 I saw seven men dressed in white. They said to me, “Stand up and put on the priestly robe, the crown of righteousness, the oracle of understanding, the full-length robe of truth, the plate of faith, the turban for your head, and the ephod[a] of prophecy.” 3 Each man was carrying these things. They put them on me and said, “From now on, you and all your descendants are to be priests.”


    4 The first man anointed me with holy oil and gave me a priestly staff. 5 The second washed me with the Lord’s pure water, gave me holy bread and wine to eat and drink, and clothed me in a holy and glorious robe. 6 The third put a linen garment on me, like an ephod. 7 The fourth wrapped a purple-colored sash around me. 8 The fifth gave me a branch from a rich olive tree. 9 The sixth placed a crown on my head. 10 The seventh placed the diadem of priesthood on me and filled my hands with incense, so that I could serve as a priest before the Lord God.


    11 Then they said to me, “Levi, your descendants will be divided into three offices. This will be a sign of the glory of the Lord who is coming. 12 The first group will be great, and no greater one will arise. 13 The second will serve in the priesthood. 14 The third will be called by a new name, because a king will arise from Judah. He will establish a new priesthood, patterned after the nations and intended for all nations. 15 His presence will be beloved, like that of a prophet of the Most High from the descendants of Abraham our father. 16 Therefore, every desirable thing in Israel will belong to you and your descendants. Your descendants will eat every beautiful thing and distribute what is on the Lord’s table. 17 Some of them will be priests, judges, and scribes, and through their words what is holy will be received.”


    18 When I awoke, I understood that this vision was like the first one.'
