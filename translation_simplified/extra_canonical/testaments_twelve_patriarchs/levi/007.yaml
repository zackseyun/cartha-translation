translation:
  language: en
  text: I said to my father Jacob, “In you the Lord will bring the Canaanites to nothing. He will give their land to you and to your seed after you. From this day on, the city called Sychem[a] will be a city of fools. Just as people mock a fool, we mocked its people. They had committed folly in Israel by defiling my sister. Then we took her away[b] and went to Bethel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sychem is the Greek form of the place more commonly called Shechem in English.
    reason: lexical_alternative
  - marker: b
    text: Or “took her up”; this probably means that they removed Dinah from the place before going to Bethel.
    reason: lexical_alternative
