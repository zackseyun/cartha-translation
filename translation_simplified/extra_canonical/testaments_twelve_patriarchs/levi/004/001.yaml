- pob_phrase: the Lord will execute judgment upon the sons of men
  simplified_phrase: the Lord will judge humanity
  preserved_meaning: The Lord will bring judgment on human beings.
  reasoning_layer_used: POB translation and source payload
  rationale: The direct verb “judge” and common noun “humanity” express the same claim more clearly.
- pob_phrase: fire cowers
  simplified_phrase: fire shrinks back in fear
  preserved_meaning: Fire is pictured as recoiling before the event.
  reasoning_layer_used: POB imagery and Greek source wording
  rationale: The wording explains “cowers” while preserving its personified image.
- pob_phrase: Hades is plundered ... persist in their injustices
  simplified_phrase: the realm of the dead is plundered ... continue in their wrongdoing
  preserved_meaning: The world of the dead is stripped, yet disobedient people remain committed to unjust conduct.
  reasoning_layer_used: POB translation and immediate context
  rationale: Common expressions replace an opaque place-name and abstract wording without weakening either idea.
