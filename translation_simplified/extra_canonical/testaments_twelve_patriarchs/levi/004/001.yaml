translation:
  language: en
  text: 'So know this: the Lord will judge humanity. When rocks split, the sun’s light is extinguished, waters dry up, fire shrinks back in fear, all creation is shaken, unseen spirits melt away, and the realm of the dead is plundered at the suffering of the Most High,[a] disobedient people still continue in their wrongdoing. Therefore, they will be judged and punished.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The words “at the suffering of the Most High” are uncertain in the Greek tradition and may be a later addition, but they appear in the supplied Greek text.
    reason: textual_variant
