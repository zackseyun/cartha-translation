translation:
  language: en
  text: '1 As I was on my way to my father, I found a bronze shield. That is why the mountain near Gebal, to the right of Abim, is called Aspis, meaning “Shield.” 2 I kept these words in my heart.


    3 After this, I consulted my father and Reuben. Reuben was to tell the sons of Emmor not to have themselves circumcised, for I burned with zeal because of the abomination they had committed against my sister. 4 I killed Shechem first, and Simeon killed Emmor. 5 Then my brothers came and put the people of that city to the sword.


    6 When my father heard what had happened, he was angry and grieved because the men had accepted circumcision and then been killed. When he gave his blessings, he passed over us.[a] 7 We had sinned by acting against his judgment, though he became weak that day.[b]


    8 Yet I understood their calamity to be a decree from God. They had intended to do to Sarah and Rebekah what they had done to our sister Dinah, but the Lord restrained them.[c] 9 They had pursued our father Abraham when he was a foreigner. They oppressed his flocks as they multiplied and cruelly abused Eblan, a servant born in his household.[d] 10 This was how they treated all foreigners: they seized foreign women by force and drove them away. 11 But the wrath of God came upon them in full.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “he overlooked us when he gave his blessings,” meaning that Jacob did not favor Levi and Simeon.
    reason: lexical_alternative
  - marker: b
    text: The Greek is difficult and may mean that Jacob was weakened, softened, or overcome that day.
    reason: textual_variant
  - marker: c
    text: This difficult Greek sentence appears to say that the men intended to treat Sarah and Rebekah as they had treated Dinah.
    reason: textual_variant
  - marker: d
    text: The name “Eblan” is uncertain, but the person is described as a servant born in Abraham’s household.
    reason: textual_variant
