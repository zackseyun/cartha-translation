  text: '(3) Joseph was there. He was a friend of both Pilate and the Lord. When he saw that they were about to crucify the Lord, he went to Pilate and asked for the Lord’s body for burial. (4) Pilate sent a message to Herod, asking him for the body.


    (5) Herod replied, “Brother Pilate, even if no one had asked for his body, we would have buried him. The Sabbath is about to begin, and the Law says, ‘The sun must not go down on someone who has been killed.’”'
