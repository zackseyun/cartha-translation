translation:
  language: en
  text: '(28) The scribes, Pharisees, and elders met together. They had heard that all the people were complaining, beating their chests, and saying, “If such great signs happened when he died, then look how righteous he was!”


    (29) The elders became afraid. They went to Pilate and pleaded with him, (30) “Give us soldiers to guard his grave for three days. Otherwise, his disciples may come and steal his body. Then the people may think he rose from the dead and may harm us.”


    (31) Pilate gave them the centurion Petronius and soldiers to guard the tomb. The elders and scribes went with them to the grave. (32) A large stone was rolled into place at the entrance to the grave, and everyone there set it firmly in place. (33) They secured it with seven seals, set up a tent there, and stood guard.'
  philosophy: optimal-equivalence
