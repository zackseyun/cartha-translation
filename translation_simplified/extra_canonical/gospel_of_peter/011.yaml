  text: '(43) Then those men decided together to go and report these things to Pilate. (44) While they were still considering this, the heavens were again seen opening, and a certain man descended and entered the tomb. (45) When those with the centurion saw these things, they left the tomb they had been guarding and hurried by night to Pilate. They described everything they had seen, greatly distressed and saying, “Truly he was the Son of God!”


    (46) Pilate replied, “I am innocent of the blood of the Son of God, and this is clear to us.”


    (47) Then all who had come begged him and urged him to command the centurion and the soldiers to say nothing about what they had seen. (48) “It is better for us,” they said, “to be guilty of a great sin before God than to fall into the hands of the Jewish people and be stoned.” (49) So Pilate commanded the centurion and the soldiers to say nothing.'
