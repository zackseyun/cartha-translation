translation:
  language: en
  text: '(43) Then the men agreed to report these things to Pilate. (44) While they were still discussing what to do, they again saw the heavens open. A man came down and entered the tomb. (45) When the centurion and those with him saw this, they left the tomb they had been guarding and hurried through the night to Pilate. Deeply troubled, they told him everything they had seen and said, “He truly was the Son of God!”


    (46) Pilate answered, “I am not responsible for the death of the Son of God, and this is clear to us.”


    (47) Then all those who had come begged Pilate to order the centurion and the soldiers not to tell anyone what they had seen. (48) They said, “It is better for us to commit a great sin before God than to be handed over to the Jewish people and stoned to death.” (49) So Pilate ordered the centurion and the soldiers to say nothing.'
