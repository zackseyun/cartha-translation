translation:
  language: en
  text: '(15) At midday, darkness covered all Judea. They were deeply worried that the sun might set while he was still alive, for it is written to them, “The sun must not set on someone who has been killed.” (16) One of them said, “Give him bile mixed with sour wine to drink.” So they mixed it and gave it to him to drink. (17) In this way they fulfilled everything and piled up guilt upon themselves. (18) Many people walked around carrying lamps because they thought it was night, and some fell down.


    (19) The Lord cried out, “My Power, the Power, you have left me!” After he said this, it was taken up.[a] (20) At that very moment, the curtain in the Jerusalem temple was torn in two.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The account does not make clear what “it” was that was taken up.
    reason: source_note
simplification_decisions:
- pob_phrase: They were troubled and distressed
  simplified_phrase: They were deeply worried
  preserved_meaning: They felt intense concern that sunset might come while he remained alive.
  reasoning_layer_used: POB translation and English witness
  rationale: A common expression conveys the force of the two overlapping emotional terms.
- pob_phrase: piled up sins upon their own heads
  simplified_phrase: piled up guilt upon themselves
  preserved_meaning: Their actions accumulated guilt for which they themselves were responsible.
  reasoning_layer_used: POB translation and grounding review
  rationale: The wording preserves cumulative self-incurred guilt without adding a comparative claim.
- pob_phrase: the veil of the temple in Jerusalem
  simplified_phrase: the curtain in the Jerusalem temple
  preserved_meaning: The temple’s interior hanging was torn in two.
  reasoning_layer_used: POB translation
  rationale: “Curtain” identifies the physical object more clearly for common readers.
