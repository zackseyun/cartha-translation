translation:
  language: en
  text: '(50) At dawn on the Lord’s day, Mary Magdalene, a disciple of the Lord, had not carried out at the Lord’s tomb the customary acts of mourning that women perform for loved ones who have died. She had stayed away because she was afraid of the Jews,[a] who were furious.


    (51) She took her friends with her and went to the tomb where he had been laid. (52) They were afraid that the Jews might see them. They said, “We could not weep and mourn on the day he was crucified. Perhaps we can do so now at his tomb. (53) But who will roll away the large stone at the tomb’s entrance so that we can go in, sit beside him, and do what mourners are expected to do? (54) We are afraid someone may see us. If we cannot go in, let us at least leave at the entrance the things we brought in his memory. Then we will weep and mourn until we return home.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here, “the Jews” means the hostile Jewish people in this narrative, not all Jewish people.
    reason: simplification_note
