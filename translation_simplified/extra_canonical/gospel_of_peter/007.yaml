  preserved_meaning: They recognized that their wrongdoing had brought harmful consequences upon them.
  reasoning_layer_used: POB text and English witness
  rationale: The rewrite states the reflexive consequence in natural English.
- pob_phrase: being wounded in mind
  simplified_phrase: deeply distressed
  preserved_meaning: Their grief caused profound inward anguish rather than bodily injury.
  reasoning_layer_used: immediate context and POB text
  rationale: The surrounding grief, mourning, and weeping establish an inward sense.
- pob_phrase: we were being sought by them as wrongdoers and as wanting to burn the temple
  simplified_phrase: they were hunting us as criminals, accusing us of wanting to burn down the temple
  preserved_meaning: Their opponents pursued them as alleged wrongdoers who intended to burn the temple.
  reasoning_layer_used: POB text and English witness
  rationale: Active wording identifies the pursuers and presents the temple charge as an accusation.
