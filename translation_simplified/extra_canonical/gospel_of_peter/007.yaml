translation:
  language: en
  text: 'Then the Jews, the elders, and the priests realized how much harm they had brought on themselves. They began to mourn and say, “How terrible are our sins! Jerusalem’s judgment and end are near!”


    My companions and I were also filled with grief and deeply distressed. We went into hiding because they were hunting us as criminals, accusing us of wanting to burn down the temple. Besides all this, we fasted as we sat mourning and weeping day and night until the Sabbath.'
