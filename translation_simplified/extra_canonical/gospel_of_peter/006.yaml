translation:
  language: en
  text: '(21) Then they pulled the nails from the Lord’s hands and laid him on the ground. The whole earth shook, and great fear spread.


    (22) Then the sun shone, and it became clear that it was about three in the afternoon.[a] (23) The Jews rejoiced and gave Joseph the Lord’s body for burial, because Joseph had seen all the good the Lord had done. (24) Joseph took the Lord, washed him, wrapped him in linen, and placed him in his own tomb, known as “Joseph’s Garden.”'
