translation:
  language: en
  text: '(55) They went to the tomb and found it open. As they came near, they bent down and looked inside. They saw a young man sitting in the middle of the tomb. He was beautiful and wore a long, shining robe.


    (56) He said to them, “Why have you come? Who are you looking for? Is it not the one who was crucified? He has risen from the dead and gone away. If you do not believe, bend down and look at the place where he was lying. He is not here, because he has risen and returned to where he came from.”


    (57) The women became frightened and ran away.'
