translation:
  language: en
  text: 'He handed the Lord over to the people before the first day of their Festival of Unleavened Bread. (6) They seized the Lord and hurried him along, shoving him and saying, “Let us drag away the Son of God, because we have power over him!”


    (7) They dressed him in purple and seated him on the judge’s seat. They said, “Judge fairly, king of Israel!” (8) One of them brought a crown made of thorns and placed it on the Lord’s head.


    (9) Some of the bystanders spat in his face, while others slapped his cheeks. Still others jabbed him with a reed, and some whipped him. They said, “Let us honor the Son of God with this kind of honor!”'
