translation:
  language: en
  text: '(10) They brought two criminals and crucified the Lord between them. But he remained silent, as though he felt no pain. (11) When they raised the cross, they put this inscription on it: “This is the king of Israel.” (12) They placed his clothes in front of him and divided them among themselves, using lots to decide who would receive them.


    (13) One of the criminals rebuked them: “We are suffering this way because of the wrong we did. But this man became the Savior of humanity. What wrong has he done to you?”


    (14) They became angry with the man who had spoken. They ordered that his legs not be broken, so that he would die under torture.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: two wrongdoers
  simplified_phrase: two criminals
  preserved_meaning: The two men were being punished for wrongdoing.
  reasoning_layer_used: POB text and English witness
  rationale: “Criminals” is the natural modern term for condemned wrongdoers in this setting.
- pob_phrase: they wrote, “This is the king of Israel”
  simplified_phrase: 'they put this inscription on it: “This is the king of Israel”'
  preserved_meaning: The quoted words were displayed on the raised cross.
  reasoning_layer_used: immediate narrative context
  rationale: “Inscription” makes clear that the words were posted on the cross rather than merely written.
- pob_phrase: divided them, and cast lots for them
  simplified_phrase: divided them among themselves, using lots to decide who would receive them
  preserved_meaning: They apportioned his clothes by casting lots.
  reasoning_layer_used: POB text and English witness
  rationale: The wording explains the unfamiliar purpose of casting lots without removing the ancient practice.
interpretive_expansions:
- pob_phrase: They became angry with him.
  rendering: They became angry with the man who had spoken.
  claim: The object of their anger is the criminal who rebuked them.
  evidence:
  - The immediately preceding speaker is one of the criminals.
  - The following order about unbroken legs is intended to prolong his tortured death.
  confidence: high
