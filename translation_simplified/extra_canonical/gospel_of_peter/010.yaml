  text: '(38) When the soldiers saw this, they woke the centurion and the elders, who were also there standing guard. (39) As the soldiers told them what they had seen, they saw three men come out of the tomb. Two were supporting the third, and a cross followed them. (40) The heads of the two men reached up to heaven, but the head of the man they were leading reached beyond the heavens.


    (41) They heard a voice from the heavens ask, “Have you proclaimed to those who sleep?”


    (42) The cross was heard to answer, “Yes!”'
