translation:
  language: en
  text: (34) At dawn on the Sabbath, a crowd came from Jerusalem and the nearby countryside to see the sealed tomb. (35) But during the night, before the Lord’s Day dawned, the soldiers were standing guard in pairs when there was a loud voice in heaven. (36) They saw heaven open. Two men came down from there, shining brilliantly, and approached the tomb. (37) The stone at the entrance rolled partly aside by itself. The tomb was opened, and the two young men went inside.
