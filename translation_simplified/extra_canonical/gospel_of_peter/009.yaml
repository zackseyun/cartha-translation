  rationale: The shorter phrase removes repetition while preserving the time reference.
- pob_phrase: while the soldiers kept watch two by two as guards
  simplified_phrase: the soldiers were standing guard in pairs
  preserved_meaning: The soldiers guarded the tomb in groups of two.
