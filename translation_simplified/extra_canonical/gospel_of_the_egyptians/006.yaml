translation:
  language: en
  text: 'The great Word (Logos), the self-generated God, and Adamas, the indestructible Man, offered praise. They asked for power and eternal strength for the self-generated one, so that the four aeons might be completed.[a] Through these aeons, [missing text] the glory and power of the unseen Father would appear to the holy people of the great Light. They will enter the world, which is the image of night.


    Adamas, the indestructible Man, asked them for a son to come from him. This son would become the father of the unmoving, indestructible race. Through that race, Silence and Voice would appear. Through it, the dead aeon would rise up so that it might dissolve.


    Then the power of the great Light came forth from above: the Manifestation. She gave birth to the four great lights:


    Harmozel,


    Oroiael,


    Davithe,


    Eleleth.


    She also gave birth to the great, indestructible Seth, the son of Adamas, the indestructible Man. In this way, the perfect group of seven, hidden in mysteries, was completed.[b]


    [Missing text.] When she [obtains] the [glory], she becomes eleven groups of eight.[c] The Father nodded his approval, and the entire Fullness of the lights rejoiced.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Aeons” are eternal realms or divine orders; the exact sense here remains uncertain.
    reason: simplification_note
  - marker: b
    text: The witness calls this group a “Hebdomad,” meaning a group of seven.
    reason: simplification_note
  - marker: c
    text: The witness calls these groups “Ogdoads,” meaning groups of eight.
    reason: simplification_note
