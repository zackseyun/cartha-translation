translation:
  language: en
  text: 'Then four hundred heavenly angels came out from the great aeons. The great Aerosiel and the great Selmechel were among them. They were to watch over the great indestructible race, its offspring, and the great people of the great Seth. They would do this from the appointed time of Truth and Justice until the age and its rulers reached their end. The great judges had sentenced those rulers to death.


    Then the four lights sent out the great Seth. This happened by the will of the self-generated one, [text missing], and the entire Fullness, through the gift and good pleasure of the great unseen Spirit, through the five seals, and through the entire Fullness.


    He passed through the three appearances I mentioned earlier: the flood, the fire, and the sentencing of the rulers, powers, and authorities. He did this so that the woman who had strayed would be saved through the reconciling of the world and through baptism by means of a body brought forth by the Word. The great Seth secretly prepared this body for himself through the virgin.


    In this way the holy ones would be born through the holy Spirit by means of unseen, secret signs. This would happen through the reconciling of one world with another; through renouncing the world and the god of the thirteen aeons; and through the assemblies of the holy, indescribable, indestructible ones in the Father''s embrace and great light. This light already existed with his Providence. Through her, it established the sacred baptism that rises above heaven. This baptism came through the indestructible one, [text missing], who was brought forth by the Word—the living one, Jesus, whom the great Seth put on like a garment. Through Jesus, Seth nailed down the powers of the thirteen aeons and confirmed those who are brought forth and taken away.


    He gave them the knowledge of this truth as armor and clothed them with the unconquerable strength of indestructible life. Then the following appeared to them:


    • the great attendant Yesseus Mazareus Yessedekeus, the living water;

    • the great leaders Jacob the Great, Theopemptos, and Isavel;

    • Micheus, Michar, and Mnesinous, who oversee the spring of truth;

    • the one who oversees baptism for the living;

    • those who cleanse;

    • Sesengenpharanges;

    • Micheus and Michar, who oversee the gates to the waters;

    • Seldao and Elainos, who oversee the high mountain;

    • those who receive the great race;

    • the indestructible mighty people of the great Seth;

    • the servants of the four lights: the great Gamaliel, the great Gabriel, the great Samblo, and the great [text missing] Abrasax;

    • Olses, Hupneus, and Heurumaious, who oversee the rising of the sun;

    • the rulers Mixanther and Michanor, who guard the entrance to the rest of eternal life;

    • Akramas and Strempouchos, who watch over the chosen souls;

    • the great power Heli Heli Machar Machar Seth;

    • the great virgin Spirit, who is unseen, unnamable, and beyond speech, and Silence;

    • the great light Harmozel, the dwelling place of the living self-generated one, the God of truth, and the one who accompanies him—the indestructible Man, Adamas;

    • the second, Oroiael, the dwelling place of the great Seth;

    • Jesus, who possesses life and who came and crucified what is in the Law;

    • the third, Davithe, the dwelling place of the sons of the great Seth;

    • the fourth, Eleleth, the dwelling place of the souls of the sons who are at rest;

    • the fifth, Yoel, who is placed over the name of the one who will be appointed to baptize with the sacred baptism that rises above the indestructible heaven.


    From now on, however, [text missing], through the indestructible Man Poimael, through those worthy of prayer, and through the renunciations connected with the five seals at the baptismal spring, they will recognize those appointed to receive them when they are taught about them. Those receivers will also recognize them, and they will never taste death.'
