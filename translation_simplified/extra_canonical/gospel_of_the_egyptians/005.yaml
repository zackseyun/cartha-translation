translation:
  language: en
  text: '[... From] that [place] appeared the cloud of the great Light. It was the living power, the mother of the holy ones who cannot be destroyed—the great power Mirothoe. She gave birth to the one whose name I pronounce three times:


    IEN

    IEN

    EA

    EA

    EA. [10]


    This one is Adamas, the shining light. He comes from the Man, the Primal Man. Through him and for him everything came into being, and without him nothing came into being. The Father, who cannot be known or grasped, came forth and descended from above to put an end to what was lacking.


    Then the great Word[a], the God who brought himself into being, united with Adamas, the Man who cannot be destroyed. A Word of Man came into being, but the Man himself came into being through a spoken word. He offered praise to:


    The great virginal Spirit, unseen and beyond our grasp;

    the male virgin;

    the triple-male child;

    [...] the male [virgin], Youel;

    Esephech, keeper of splendor;

    the child of the child;

    the crown of its glory;

    the great Doxomedon aeon[b];

    the thrones within him;

    the powers around him;

    the glories;

    the indestructible ones;

    their entire Fullness, which I mentioned before;

    and the earth within the air, which receives God.


    There the holy men of the great Light receive an image. They are the men of the Father of the silent, living Silence—the Father and their entire Fullness, as I mentioned before.'
  philosophy: optimal-equivalence
