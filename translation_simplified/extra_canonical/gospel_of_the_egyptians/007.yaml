translation:
  language: en
  text: 'Their companions then came forth to complete the group of eight called the Ogdoad[a] of the self-generated God:


    Grace belonged to the first light, Harmozel;

    Perception to the second light, Oroiael;

    Understanding to the third light, Davithe;

    and Discretion to the fourth light, Eleleth.


    This was the first Ogdoad of the self-generated God. The Father nodded his approval, and the entire Fullness of the Lights was pleased.


    Then the ministers came forth:


    first, the great Gamaliel, minister of the first great light, Harmozel;

    then the great Gabriel, minister of the second great light, Oroiael;

    then the great Samlo, minister of the great light Davithe;

    and the great Abrasax, minister of [the great light] Eleleth.


    Then, according to the Father’s pleasing will, their companions came forth:


    Memory, companion of the first great one, Gamaliel;

    Love, companion of the second, the great Gabriel;

    Peace, companion of the third, the great Samblo;

    and Eternal Life, companion of the fourth, the great Abrasax.


    In this way the five Ogdoads were completed—forty in all, a power beyond explanation.


    Then the great self-generated Logos and the Speech of the Fullness of the four lights offered praise to:


    the great unseen, unnamable, virginal Spirit,

    the male virgin,

    the great Doxomedon aeon,

    the thrones within them,

    the powers surrounding them,

    the glories, authorities, and powers,

    the triple-male child,

    the male virgin Youel,

    Esephech, [] keeper of splendor, [the child] of the child,

    the crown of [its] glory,

    the entire Fullness,

    all the glories dwelling there,

    the infinite Fullnesses,

    and the unnamable aeons.


    They did this so that they might name the Father, the fourth, together with the indestructible race, and might call the Father’s seed the seed of the great Seth.'
