translation:
  language: en
  text: 'Then everything shook, and trembling seized even the indestructible ones. Then the three sons descended from above to those who were unborn and self-begotten, and to those begotten within what was begotten. The Greatness came forth—the entire Greatness of the great Christ.


    He set up countless tens of thousands of glorious thrones within the four aeons[a] that surrounded them. There were also countless tens of thousands of powers, glories, and indestructibilities.[b] They came forth in this way, and the indestructible spiritual community grew within the four lights of the great living one who brought himself into being—the God of truth. He praised, sang, and gave honor unceasingly, with one voice and in complete agreement:


    to the Father,


    the Mother,


    the Son,


    and their entire Fullness,[c] as I said before.


    The five seals possessing the countless multitudes,


    the rulers over the aeons,


    and those who bore the glory of the leaders


    were commanded to reveal themselves to those who were worthy.


    Amen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Aeons” may refer to eternal realms or to personified eternal beings here.
    reason: lexical_alternative
  - marker: b
    text: “Indestructibilities” is an unusual term that may describe beings, qualities, or a distinct class.
    reason: lexical_alternative
  - marker: c
    text: “Fullness” is the term used here for the totality associated with the Father, Mother, and Son.
    reason: cultural_note
