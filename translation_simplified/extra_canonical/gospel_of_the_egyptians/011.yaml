translation:
  language: en
  text: 'She received her completion and her power according to the Father’s will and pleasure. In his pleasure, the Father approved the great, indestructible, unmoving race of the great and mighty people of the great Seth. He intended to sow this race throughout the realms that had come into being and, through her, supply what was lacking. She came down from above into the world as the image of the night.


    After she appeared, she made a petition for the offspring of the ruler of this age and for <the> authorities that came from him. These were the polluted offspring of the god who produces demons and who will be destroyed. She also petitioned for the offspring [] of Adam and the great Seth, which is like the sun.


    Then the great angel Hormos came to prepare the offspring of the great Seth. He did this through the virgins belonging to the polluted sowing of this age, within a sacred vessel brought forth by the Logos through the holy Spirit.


    Then the great Seth came with his offspring, and it was sown throughout the realms that had come into being. The number of these realms matched the numerical value of “Sodom.” Some say that Sodom is Gomorrah, the place where the great Seth pastures. Others say that the great Seth took his planting out of Gomorrah and transplanted it to another place, which he named Sodom.


    This is the race that came forth through Edokla. By speaking, she gave birth to Truth and Justice. This was the beginning of the offspring of eternal life, intended for those who will persevere because they know where they came from. This great, indestructible race has passed through three [] worlds into this world. The flood happened as a pattern of the end of the age, but it will be sent into the world because of this race.


    A great fire will sweep over the earth, but grace will be given to those of the race that came into being through the prophets and the watchers who guard its life. Because of this race, famines and plagues will come. These things will happen on account of the great, indestructible race. Trials will also come because of this race, including deception by false prophets.


    Then the great Seth saw the devil at work: his many disguises, his plots against the indestructible and unmoving race, the persecutions carried out by his powers and angels, and the error through which they acted against themselves.


    Then the great Seth offered praise to:


    the great, unnamable, virginal Spirit;


    the male [] virgin Barbelon;


    the triple-male child, Telmael Telmael Heli Heli Machar Machar Seth;


    the living power, ALĒTHES ALĒTHŌS;


    the male virgin Youel;


    Esephech, keeper of splendor and crown of his glory;


    the great realm of Doxomedon;


    the thrones within him;


    the powers surrounding them;


    and the entire Fullness, which I mentioned earlier.


    He also petitioned for watchers over his offspring.'
