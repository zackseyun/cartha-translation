translation:
  language: en
  text: 'IĒ IEUS ĒŌ OU ĒŌ ŌUA,[a]


    ALĒTHŌS ALĒTHŌS,


    O Yesseus Mazareus Yessedekeus,

    O living water,

    O child of the child,

    O glorious name,


    ALĒTHŌS ALĒTHŌS,


    O eternal Being,


    I I I I

    ĒĒĒĒ

    EEEE

    OOOO

    UUUU

    ŌŌŌŌ

    AAAA{A},


    ALĒTHES ALĒTHŌS,

    ĒI AAAA ŌŌŌŌ,


    O Being who beholds the aeons,[b]


    ALĒTHES ALĒTHŌS,


    AEE

    ĒĒĒ

    I I I I

    UUUUUU

    ŌŌŌŌŌŌŌŌ,


    O you who are eternal beyond measure,


    ALĒTHES ALĒTHŌS,


    IĒA AIŌ within the heart, you who exist,

    UAEI EISAEI EIOEI EIOSEI!


    Your great name dwells within me,

    O self-generated Perfect One.

    You are not outside me;

    I behold you,

    O you whom no one sees.

    For who can grasp you in another language?


    [text missing] Because I have known you,

    I have now merged with the unchangeable one.

    I have put on the armor of light.

    I have become Light,

    because the Mother was in the Place

    for the excellent beauty of grace.


    Therefore, I stretched out my hands when they were folded.

    I have been formed within the circle of the wealth of light

    in my lap,

    which produces the form of the many born from light,

    where no accusation can reach.


    ALĒTHŌS,


    I will proclaim your glory,

    because I have grasped you,


    SOU IĒS IDE AEIŌ AEIE OIS,


    O Aeon, Aeon, O God of Silence!

    I honor you completely.


    You are my place of rest, O Son,


    ĒS ĒS O E,


    formless one among formless ones,

    raising the Man inside whom you will cleanse me

    to enter your life,

    in keeping with your indestructible name.


    Therefore, the incense of life dwells within me.

    I have mixed it with water

    according to the pattern of all the archons,[c]

    so that I may live with you

    in the blessed life of the holy ones,

    you who exist forever. [text missing]


    ALĒTHŌS ALĒTHŌS.'
