translation:
  language: en
  text: 'Then the great Seth, son of Adamas, the indestructible Man, praised:


    • the great Spirit who is unseen, cannot be named, cannot be uttered, and is virgin;

    • the <male virgin>[a];

    • the <triple-male child>;

    • the <male> virgin Youel;

    • Esephech, keeper of splendor;

    • the crown of his glory, the child of the child;

    • after some missing text, the great Doxomedon aeons[b];

    • and the Fullness, which I mentioned earlier.


    Seth also petitioned on behalf of his seed.


    Then Plesithea, the great power of great light, came from that place. She was:


    • the mother of the angels;

    • the mother of lights;

    • the glorious mother;

    • the four-breasted virgin.


    She bore fruit from Gomorrah like a spring, and fruit from Sodom. The fruit of Gomorrah’s spring lived within her.


    She came forth through the great Seth.


    The great Seth rejoiced because the indestructible child had given him this gift. He drew his seed from the four-breasted virgin and placed it with him within the fourth aeon,[b] within Davithe, the third great light.'
  philosophy: optimal-equivalence
