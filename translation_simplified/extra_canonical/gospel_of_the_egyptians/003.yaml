translation:
  language: en
  text: 'Domedon Doxomedon came forward in procession—the supreme aeon, a divine reality above all other aeons. Within him was the throne. With him came the powers [around] him, the glories, and the [imperishable realities].


    The Father of the great Light, who came forth from Silence, is the great aeon Doxomedon. Within him the [triple-]male child rests. The throne of his [glory] was set up [within it—the one] on which his name, which cannot be disclosed, [is inscribed], on the tablet. [...] the one who is the utterance, the [Father of the Light] of All. He came forth from Silence and rests within Silence. His [...] name is in an [unseen] symbol.


    [A] hidden, [unseen] mystery came forward in procession:


    I I I I I I I I I I I I I I I I I I I [I I I]


    Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē [Ē Ē]


    [O] O O O O O O O O O O O O O O O O O O O O O


    U U [U U U] U U U U U U U U U U U U U U U U U


    E E E E E E E E E E E E E E E E E E E E E E


    A A A A A A A [A A A A] A A A A A A A A A A A.


    Ō Ō Ō Ō Ō Ō Ō Ō [Ō Ō Ō] Ō Ō Ō Ō Ō Ō Ō Ō Ō Ō Ō,


    In this way the three powers offered praise to the [great], unseen, unnamable, virginal, and unutterable Spirit, and to [his] male virgin.'
