translation:
  language: en
  text: '[…] The sacred book of the […] great unseen Spirit:


    the Father whose name cannot be spoken,


    who originated] from the heights of [the Fullness;


    the Light of Light from the aeons of Light;


    the Light of the Silence of Providence

    and the Father of Silence;


    the Light of Speech and Truth;


    the Light of the […] indestructible realities;


    the infinite Light;


    the radiance from the aeons of the Light

    of the Father who cannot be revealed or expressed,

    who never ages and cannot be declared;


    the aeon of the aeons;[a]


    self-generated, self-generating, and self-producing;


    the alien;[b]


    the aeon;


    TRUTH, ALĒTHŌS.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Fullness” and “aeon” are retained as technical terms from the provisional POB pending direct Coptic review.
    reason: source_note
  - marker: b
    text: POB reads “the alien”; its precise sense remains uncertain pending direct Coptic review.
    reason: lexical_alternative
