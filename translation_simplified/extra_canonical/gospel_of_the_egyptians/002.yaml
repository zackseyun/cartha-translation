translation:
  language: en
  text: 'Three powers came from him: the Father, the Mother, and the Son. They came from the living Silence, which came from the indestructible Father. These three came from the Silence of the unknown Father. From there came Domedon Doxomedon, [the aeon of] the aeons, and the [Light] of each power. In this way, the Son came forth as the fourth, the Mother [as the fifth, and the Father] as the sixth.


    He was [unnoticed] and had not been announced. [He is the one] who has no designation among all [the powers], the glories, and the [indestructible beings].


    From there came the three powers, […] the three Ogdoads[a] that [the Father brings forth] in Silence, together with Providence, from his lap: the Father, the Mother, and the Son.


    The <first> Ogdoad, because of whom the threefold male child came forth, is:


    Thought,

    the Word (Logos),

    Indestructibility,

    Eternal [Life],

    Will,

    Mind,

    Foreknowledge,

    and the Father who is both male and female.


    The second Ogdoad-power is:


    the Mother,

    the virgin Barbelon,

    Epititioch[…]ai,

    Memeneaimen, [who] watches over heaven,

    Karb[…],

    the power beyond explanation,

    and the Mother who cannot be spoken of.


    [She exists from herself…]. She came forth and agreed with the Father [of] the silent [Silence].


    The third Ogdoad-power is:


    the Son of the [silent Silence],

    the crown of the silent Silence,

    the glory of the Father,

    and the power [of the] […] [Mother].


    [He] brings forth from his lap the seven powers of the great Light. They are the seven voices, and they become complete in speech.


    These are the three [powers], the three Ogdoads that the Father [brought forth] from his lap through his Providence. He brought them forth in that place.'
