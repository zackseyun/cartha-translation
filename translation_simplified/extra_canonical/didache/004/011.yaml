simplification_decisions:
- pob_phrase: you slaves
  simplified_phrase: those of you who are slaves
  preserved_meaning: The instruction directly addresses enslaved members of the community.
  reasoning_layer_used: source text and POB translation
  rationale: The fuller wording sounds natural today while preserving the historical status.
- pob_phrase: shall be subject to
  simplified_phrase: must submit to
  preserved_meaning: They are commanded to place themselves under their masters’ authority.
  reasoning_layer_used: source text and POB translation
  rationale: “Must submit to” states the command in direct, common English.
- pob_phrase: as to a representative of God
  simplified_phrase: as to a representative of God
  preserved_meaning: The singular comparison presents the master as a visible representative of God’s authority.
  reasoning_layer_used: applied lexical revision and grounding review
  rationale: Retaining the singular preserves the POB decision and its lexical alternative.
translation_notes:
  risk_flags:
  - risk: “Representative of God” could imply divine approval of everything a master does.
    mitigation: The comparative “as to” does not declare masters morally infallible.
  - risk: Modern readers may take the command as a general endorsement of slavery.
    mitigation: The direct historical address is preserved without broadening its scope.
