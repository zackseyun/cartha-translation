  yaml_path: translation/extra_canonical/didache/004/008.yaml
  text: You shall not turn away the one in need, but you shall share all things with your brother, and you shall not say they are your own; for if you are sharers in what is immortal, how much more in mortal things?
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T20:32:23Z'
    unchanged: false
    changes_summary: Changed 'turn away from the one in need' to 'turn away the one in need' for closer alignment with ἀποστραφήσῃ taking a direct object. No other changes needed.
translation:
  language: en
  text: Do not turn away anyone in need. Instead, share everything with your brothers and sisters, and do not say, “These things are mine.” For if you share in what is immortal, how much more should you share things that pass away?
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: You shall not turn away the one in need
  simplified_phrase: Do not turn away anyone in need
  preserved_meaning: The command forbids rejecting a needy person.
  reasoning_layer_used: POB translation and applied revision
  rationale: The wording becomes a natural modern command while keeping the needy person as its object.
- pob_phrase: you shall share all things with your brother
  simplified_phrase: share everything with your brothers and sisters
  preserved_meaning: The reader must share comprehensively with fellow members of the community.
  reasoning_layer_used: Source payload, immediate context, and POB translation
  rationale: “Brothers and sisters” clarifies the communal kinship sense for modern readers.
- pob_phrase: how much more in mortal things?
  simplified_phrase: how much more should you share things that pass away?
  preserved_meaning: Sharing temporary things is even more fitting for those who share in what is immortal.
  reasoning_layer_used: Source contrast and immediate context
  rationale: “Things that pass away” makes the immortal-mortal contrast understandable without weakening it.
interpretive_expansions:
- pob_phrase: your brother
  rendering: your brothers and sisters
  claim: The kinship term addresses fellow members of the community rather than only a biological male sibling.
  evidence:
  - The singular kinship term appears in a general community instruction.
  - The command concerns mutual sharing within the addressed community.
  confidence: moderate
  alternatives_preserved:
  - fellow believer
  - fellow community member
- pob_phrase: mortal things
  rendering: things that pass away
  claim: The phrase refers to temporary things in contrast with what is immortal.
  evidence:
  - The Greek contrast directly opposes what is immortal to mortal things.
  - The preceding clauses concern things that can be shared and claimed as one's own.
  confidence: high
  alternatives_preserved:
  - temporary things
  - perishable things
translation_notes:
  risk_flags:
  - risk: “Brothers and sisters” makes the communal scope explicit although the Greek form is grammatically singular and masculine.
    mitigation: The expansion prevents a likely biological-sibling reading while preserving the community kinship image.
  - risk: “Things that pass away” emphasizes transience rather than using the literal adjective “mortal.”
    mitigation: The wording retains the direct contrast with what is immortal and fits the material-sharing context.
