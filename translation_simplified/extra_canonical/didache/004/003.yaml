    timestamp: '2026-04-23T20:31:20Z'
    unchanged: false
    changes_summary: Adjusted 'when reproving transgressions' to 'in reproving transgressions' for a more natural rendering of the infinitive phrase while preserving the sense.
translation:
  language: en
  text: Do not cause division. Instead, make peace between those who are fighting. Judge fairly, and do not favor anyone when correcting wrongdoing.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: You shall not cause division, but you shall reconcile those who are fighting.
  simplified_phrase: Do not cause division. Instead, make peace between those who are fighting.
  preserved_meaning: The reader must avoid splitting the community and actively restore peace between people in conflict.
  reasoning_layer_used: POB text and applied lexical revision
  rationale: This keeps “division” rather than the later institutional sense of “schism” and makes “reconcile” immediately clear.
- pob_phrase: You shall judge justly
  simplified_phrase: Judge fairly
  preserved_meaning: Judgment must be impartial and right.
  reasoning_layer_used: POB text and Greek source
  rationale: “Fairly” expresses the command in common English without weakening its moral force.
- pob_phrase: you shall not show partiality in reproving transgressions
  simplified_phrase: do not favor anyone when correcting wrongdoing
  preserved_meaning: A person’s status or identity must not affect the correction of offenses.
  reasoning_layer_used: POB text and latest revision pass
  rationale: The wording replaces formal terms with natural English while preserving impartial correction of wrongdoing.
translation_notes:
  risk_flags:
  - risk: “Make peace” may sound broader than reconciling specific opponents.
    mitigation: “Between those who are fighting” keeps the action focused on bringing conflicting people together.
  - risk: “Wrongdoing” can refer to acts generally, while “transgressions” stresses offenses.
    mitigation: The phrase “when correcting wrongdoing” preserves the setting of confronting actual offenses.
