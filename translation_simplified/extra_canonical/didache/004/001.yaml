source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, τοῦ λαλούντός σοι τὸν λόγον τοῦ Θεοῦ μνησθήσῃ νυκτὸς καὶ ἡμέρας, τιμήσεις δὲ αὐτὸν ὡς Κύριον· ὅθεν γὰρ ἡ κυριότης λαλεῖται, ἐκεῖ Κύριός ἐστιν.
  language: Greek
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/didache/004/001.yaml
  text: My child, you shall remember night and day the one who speaks to you the word of God, and you shall honor him as the Lord; for where lordship is spoken, there the Lord is.
  footnotes:
  - marker: a
    text: Or 'remember night and day the one who speaks to you the word of God, and you shall honor him'.
    reason: previous_rendering
translation:
  language: en
  text: My child, keep in mind day and night the person who speaks God’s word to you. Honor that person as you honor the Lord, because wherever lordship is spoken of, the Lord is there.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: you shall remember night and day the one who speaks to you the word of God
  simplified_phrase: keep in mind day and night the person who speaks God’s word to you
  preserved_meaning: The reader must continually remember the person who communicates God’s word.
  reasoning_layer_used: POB text and source syntax
  rationale: This keeps the day-and-night image in natural modern English.
- pob_phrase: you shall honor him as the Lord
  simplified_phrase: Honor that person as you honor the Lord
  preserved_meaning: The speaker is to receive honor modeled on the reader’s honor for the Lord.
  reasoning_layer_used: POB controlling translation
  rationale: This clarifies the comparison without identifying the speaker as the Lord.
- pob_phrase: where lordship is spoken
  simplified_phrase: wherever lordship is spoken of
  preserved_meaning: The source’s terse link between spoken lordship and the Lord’s presence remains intact.
  reasoning_layer_used: POB wording and Greek source payload
  rationale: Adding “of” makes the clause natural while preserving its ambiguity.
translation_notes:
  risk_flags:
  - risk: “Lordship” remains an abstract term that some readers may find difficult.
    mitigation: It is retained because replacing it with “the Lord’s authority” would narrow the source’s ambiguity.
