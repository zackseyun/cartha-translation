  preserved_meaning: The instruction applies broadly to money, clothing, and possessions.
  reasoning_layer_used: POB text and lexical revision
  rationale: The revision’s practical sense “money” is retained while the list is recast in natural English.
- pob_phrase: having taken the firstfruit
  simplified_phrase: set aside a first portion
  preserved_meaning: A first part of one’s goods is to be designated for giving.
  reasoning_layer_used: Greek source and POB revision
  rationale: This removes the awkward participle while preserving the firstfruit image through “first portion” and a note.
- pob_phrase: give according to the commandment
  simplified_phrase: give it as the commandment directs
  preserved_meaning: The designated portion must be given in obedience to the commandment.
  reasoning_layer_used: POB text and Greek source
