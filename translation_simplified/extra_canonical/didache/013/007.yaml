translation:
  language: en
  text: From your money[a], clothing, and every other possession, set aside a first portion as you think best, and give it as the commandment directs.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can literally mean “silver,” but here it refers to money.
    reason: lexical_alternative
  - marker: b
    text: “First portion” represents the image of a “firstfruit,” the first part set apart as an offering.
    reason: simplification_note
