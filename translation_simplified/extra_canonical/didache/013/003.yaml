translation:
  language: en
  text: Therefore, give the prophets the first portion of the yield from your winepress and threshing floor, and the first portion from your cattle and sheep, because they are your high priests.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: taking every firstfruit of the produce
  simplified_phrase: give ... the first portion
  preserved_meaning: The prophets are to receive the first share from every listed source.
  reasoning_layer_used: POB translation and Greek source structure
  rationale: This turns the dense participial phrase into a direct command while preserving the scope of the offering.
- pob_phrase: the produce of the winepress and threshing floor
  simplified_phrase: the yield from your winepress and threshing floor
  preserved_meaning: The command includes the first yield from wine and grain production.
  reasoning_layer_used: POB wording and source imagery
  rationale: “Yield” clarifies the produce relationship while retaining the concrete production images.
- pob_phrase: and of cattle and sheep
  simplified_phrase: and the first portion from your cattle and sheep
  preserved_meaning: The animal portion remains broadly associated with the cattle and sheep rather than being limited to derived products.
  reasoning_layer_used: Greek source, POB wording, and grounding review
  rationale: Repeating “first portion” keeps the animal reference clear without specifying milk, wool, offspring, or the animals themselves.
translation_notes:
  risk_flags:
  - risk: “First portion” is less visibly tied to the traditional offering term “firstfruit.”
    mitigation: The wording preserves priority, offering scope, recipients, and the stated high-priestly basis.
