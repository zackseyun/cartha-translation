id: DID.1.5
reference: Didache 1:5
language:
  code: en
  name: English
  variant: simplified modern common English
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Παντὶ τῷ αἰτοῦντί σε δίδου καὶ μὴ ἀπαίτει· πᾶσι γὰρ θέλει δίδοσθαι ὁ πατὴρ ἐκ τῶν ἰδίων χαρισμάτων. Μακάριος ὁ διδοὺς κατὰ τὴν ἐντολήν· ἀθῷος γάρ ἐστιν· οὐαὶ τῷ λαμβάνοντι· εἰ μὲν γὰρ χρείαν ἔχων λαμβάνει τις, ἀθῷος ἔσται· ὁ δὲ μὴ χρείαν ἔχων δώσει δίκην, ἱνατί ἔλαβε καὶ εἰς τί, ἐν συνοχῇ δὲ γενόμενος ἐξετασθήσεται περὶ ὧν ἔπραξε, καὶ οὐκ ἐξελεύσεται ἐκεῖθεν μέχρις οὗ ἀποδῷ τὸν ἔσχατον κοδράντην.
  language: Greek
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/didache/001/005.yaml
  text: Give to everyone who asks you[a], and do not demand it back; for the Father wants his own gifts to be given to all. Blessed is the one who gives according to the commandment, for he is innocent. But woe to the one who receives; for if someone receives while having need, he will be innocent, but the one not having need will pay the penalty for why he received and for what purpose. And having come under confinement, he will be examined concerning the things he did[b], and he will not come out from there until he repays the last quadrans.
  footnotes:
  - marker: a
    text: Or "for the Father's will is that giving be done to all from his own gracious gifts.".
    reason: previous_rendering
  - marker: b
    text: 'Or ''will pay the penalty: why he received, and for what purpose.''.'
    reason: previous_rendering
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T20:30:57Z'
    unchanged: false
    changes_summary: Adjusted 'wishes' to 'wants' for more natural formal English, and revised 'because he has need' to 'while having need' / 'has no need' to 'not having need' to reflect the Greek participial phrasing more closely. Also replaced the period after 'receives' with a semicolon to better reflect the clause flow.
translation:
  language: en
  text: Give to everyone who asks you, and do not demand it back. For the Father wants his own gifts to be given to all. Blessed is the person who gives as the commandment requires, for that person is innocent. But woe to the person who receives! Anyone who receives because they are in need will be innocent. But anyone who receives when they are not in need will be punished for why they received it and for what purpose. When that person is put in custody, they will be questioned about what they did. They will not be released from there until they have paid back the very last small coin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek text names a quadrans, a very small coin.
    reason: cultural_note
simplification_decisions:
- pob_phrase: the one not having need
  simplified_phrase: anyone who receives when they are not in need
  preserved_meaning: A recipient who lacks genuine need is held responsible.
  reasoning_layer_used: POB translation and Greek participial contrast
  rationale: The participle is recast as a natural conditional statement.
- pob_phrase: having come under confinement, he will be examined concerning the things he did
  simplified_phrase: When that person is put in custody, they will be questioned about what they did
  preserved_meaning: The recipient faces confinement and examination of their actions.
  reasoning_layer_used: POB translation and source clause sequence
  rationale: Common legal wording replaces the dense passive construction.
- pob_phrase: until he repays the last quadrans
  simplified_phrase: until they have paid back the very last small coin
  preserved_meaning: Release does not come until the debt is paid in full.
  reasoning_layer_used: POB translation and source monetary image
  rationale: The unfamiliar coin is clarified while preserving payment to the last coin.
translation_notes:
  risk_flags:
  - risk: The confinement may be literal or may portray divine judgment.
    mitigation: The draft preserves the custody image without identifying its setting.
  - risk: Replacing “quadrans” could obscure the ancient cultural detail.
    mitigation: The footnote retains the original coin name.
