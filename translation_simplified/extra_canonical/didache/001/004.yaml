  text: Ἀπέχου τῶν σαρκικῶν καὶ κοσμικῶν ἐπιθυμιῶν. Ἐάν τις σοὶ δῷ ῥάπισμα εἰς τὴν δεξιὰν σιαγόνα, στρέψον αὐτῷ καὶ τὴν ἄλλην, καὶ ἔσῃ τέλειος· ἐὰν ἀγγαρεύσῃ σε τις μίλιον ἕν, ὕπαγε μετʼ αὐτοῦ δύο· ἐὰν ἄρῃ τις τὸ ἱμάτιόν σου, δὸς αὐτῷ καὶ τὸν χιτῶνα· ἐὰν λάβῃ τις ἀπὸ σοῦ τὸ σόν, μὴ ἀπαίτει· οὐδὲ γὰρ δύνασαι.
  language: Greek
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/didache/001/004.yaml
  text: Abstain from fleshly and worldly desires. If anyone gives you a blow on the right cheek[a], turn to him the other also, and you will be perfect. If anyone compels you to go one mile, go with him two. If anyone takes away your cloak, give him your tunic also. If anyone takes from you what is yours, do not demand it back, for you are not able.
  footnotes:
  - marker: a
    text: Or 'If anyone compels you for one mile'.
    reason: previous_rendering
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T20:30:54Z'
    unchanged: true
    changes_summary: No changes needed.
translation:
  language: en
  text: Stay away from the desires of the body and of this world. If anyone strikes you on the right cheek, turn the other cheek to them as well, and you will be perfect. If anyone forces you to go one mile, go with them two miles. If anyone takes your outer garment, give them your tunic too. If anyone takes what belongs to you, do not demand it back, for you cannot.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Abstain from fleshly and worldly desires
  simplified_phrase: Stay away from the desires of the body and of this world
  preserved_meaning: The reader must avoid both bodily and worldly desires.
  reasoning_layer_used: POB main text and Greek source
  rationale: Common wording replaces formal terms without merging the two kinds of desire.
- pob_phrase: gives you a blow on the right cheek
  simplified_phrase: strikes you on the right cheek
  preserved_meaning: The command concerns a physical blow to the cheek.
  reasoning_layer_used: POB main text
  rationale: The direct verb is clearer than the formal expression.
- pob_phrase: cloak ... tunic
  simplified_phrase: outer garment ... tunic
  preserved_meaning: Two distinct garments remain, and the tunic is given in addition to the first.
  reasoning_layer_used: POB main text, Greek source, and grounding review
  rationale: The first garment is clarified while “tunic” avoids implying modern underwear.
translation_notes:
  risk_flags:
  - risk: “Perfect” may suggest absolute flawlessness to a modern reader.
    mitigation: The term remains because POB makes this choice without support for narrowing it.
  - risk: The final words “for you cannot” remain abrupt and open to more than one explanation.
    mitigation: The wording preserves POB’s ambiguity rather than adding an unsupported reason.
