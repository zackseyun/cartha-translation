translation:
  language: en
  text: So choose overseers and deacons for yourselves who are worthy of the Lord—men who are gentle, free from the love of money, truthful, and proven. They too serve you by carrying out the ministry of prophets and teachers.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Appoint, then, for yourselves
  simplified_phrase: So choose ... for yourselves
  preserved_meaning: The community is commanded to select its own leaders.
  reasoning_layer_used: POB translation and Greek source
  rationale: “So choose” naturally conveys both the command and its link to the preceding teaching.
- pob_phrase: men who are gentle, not lovers of money, truthful, and proven
  simplified_phrase: men who are gentle, free from the love of money, truthful, and proven
  preserved_meaning: The officeholders are explicitly men, and all four character requirements remain distinct.
  reasoning_layer_used: POB translation, Greek source, and grounding review
  rationale: “Free from the love of money” makes the negative qualification immediately clear.
- pob_phrase: perform for you the ministry of the prophets and teachers
  simplified_phrase: serve you by carrying out the ministry of prophets and teachers
  preserved_meaning: Overseers and deacons provide the community with the ministry associated with prophets and teachers.
  reasoning_layer_used: POB translation and awkward-English revision
  rationale: This wording explains the service while avoiding any claim that the offices are identical.
translation_notes:
  risk_flags:
  - risk: “Choose” may sound less formal than “appoint.”
    mitigation: The command still directs the community to select people for the named offices.
  - risk: “Ministry of prophets and teachers” may suggest identical offices.
    mitigation: “Carrying out” presents a shared function rather than an identity of titles.
