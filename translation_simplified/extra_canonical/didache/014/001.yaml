  preserved_meaning: Confession must come before breaking bread and giving thanks.
  reasoning_layer_used: source sequence and POB wording
  rationale: A separate sentence clarifies the order, and “sins” is common English for “transgressions.”
- pob_phrase: so that your sacrifice may be pure
  simplified_phrase: so that your sacrifice may be pure
  preserved_meaning: Prior confession is connected to the purity of the community’s sacrifice.
