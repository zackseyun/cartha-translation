translation:
  language: en
  text: They persecute those who do good. They hate the truth and love lies. They do not understand the reward that comes from doing what is right. They do not hold firmly to what is good or to just judgment. They stay alert for evil, not for good. Gentleness and patience are far from them. They love worthless things and pursue repayment. They show no mercy to the poor and feel no sorrow for those who are oppressed. They do not know the one who made them. They murder children and destroy what God has made. They turn away from anyone in need and oppress those who are suffering. They defend the rich but judge the poor unjustly. They are sinful in every way. Children, be delivered from all these things.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: persecutors of the good, hating truth, loving falsehood
  simplified_phrase: They persecute those who do good. They hate the truth and love lies.
  preserved_meaning: The people described attack the good, reject truth, and embrace falsehood.
  reasoning_layer_used: POB base text and Greek clause structure
  rationale: Short direct sentences make the opening charges easy to follow.
- pob_phrase: not clinging to what is good nor to righteous judgment, keeping watch not for what is good but for what is evil
  simplified_phrase: They do not hold firmly to what is good or to just judgment. They stay alert for evil, not for good.
  preserved_meaning: They adhere neither to goodness nor just judgment and direct their vigilance toward evil.
  reasoning_layer_used: POB lexical choices, source parallelism, and source imagery
  rationale: The revision preserves the same act of commitment toward both goodness and just judgment.
- pob_phrase: advocates of the rich, lawless judges of the poor, altogether sinful. Be delivered, children, from all these things.
  simplified_phrase: They defend the rich but judge the poor unjustly. They are sinful in every way. Children, be delivered from all these things.
  preserved_meaning: They favor the rich, deny justice to the poor, and receive a direct command to escape all these evils.
  reasoning_layer_used: POB base text and grounding review of the closing imperative
  rationale: Clear actions replace compressed titles while the final exhortation remains a direct passive command.
