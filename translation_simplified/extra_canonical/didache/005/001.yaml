  preserved_meaning: This way leads to death and is fundamentally evil and curse-filled.
  reasoning_layer_used: POB translation and applied revision
  rationale: The shorter sentences explain the path's outcome while retaining “first of all” and the revised singular “a curse.”
- pob_phrase: hypocrisies, double-heartedness
  simplified_phrase: hypocrisy, double-mindedness
  preserved_meaning: The list distinguishes outward pretense from an inwardly divided mind.
  reasoning_layer_used: POB translation and grounding review
  rationale: “Double-mindedness” remains general and does not assign an unstated object to the division.
- pob_phrase: self-will, foul speech, jealousy, audacity, haughtiness
  simplified_phrase: stubborn self-will, greed, foul speech, jealousy, reckless boldness, pride
  preserved_meaning: The wording retains obstinacy, shameful language, envy, brash conduct, and elevated self-regard.
  reasoning_layer_used: POB translation, Greek source list, and grounding review
  rationale: Clear wording preserves each fault, while “foul speech” avoids narrowing the category to sexual obscenity.
