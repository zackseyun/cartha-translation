translation:
  language: en
  text: But this is the path that leads to death. First of all, it is evil and filled with a curse. It is marked by murder, adultery, lust, sexual immorality, theft, idolatry, sorcery, magic arts, robbery, false testimony, hypocrisy, double-mindedness, deceit, arrogance, malice, stubborn self-will, greed, foul speech, jealousy, reckless boldness, pride, and boastfulness.
  philosophy: optimal-equivalence
