translation:
  language: en
  text: If someone who comes to you is a traveler, help him as much as you can. But if he needs to stay with you, he should not stay longer than two or three days.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: the one who comes
  simplified_phrase: someone who comes to you
  preserved_meaning: The instruction concerns a person arriving among the community.
  reasoning_layer_used: POB base text and immediate context
  rationale: The personal construction is recast in ordinary English without changing its scope.
- pob_phrase: he shall not remain with you except for two or three days, if there is a need
  simplified_phrase: if he needs to stay with you, he should not stay longer than two or three days
  preserved_meaning: Need may warrant lodging, but the stay remains limited to two or three days.
  reasoning_layer_used: applied source-grounded revision and POB footnote
  rationale: This states a maximum rather than requiring a two- or three-day stay or making need a loophole for staying longer.
translation_notes:
  risk_flags:
  - risk: The necessity clause could be mistaken for permission to remain beyond three days.
    mitigation: The wording places the need before the stay and then states the maximum clearly.
