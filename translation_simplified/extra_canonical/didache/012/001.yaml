  rationale: The active command is clearer than the passive construction.
- pob_phrase: after testing him, you will know
  simplified_phrase: Then test them, and you will know
  preserved_meaning: Testing the visitor leads to broad discernment without implying mere personal acquaintance.
  reasoning_layer_used: applied revision and POB footnote
  rationale: Keeping “know” preserves the absolute verb while “them” naturally refers to each visitor.
- pob_phrase: you will have understanding of right and left
  simplified_phrase: you will be able to distinguish right from wrong
  preserved_meaning: The right-and-left contrast expresses the practical discernment needed to evaluate the visitor.
  reasoning_layer_used: source payload, immediate context, and grounding review
  rationale: The explicit contrast prevents modern readers from mistaking the image for spatial orientation.
