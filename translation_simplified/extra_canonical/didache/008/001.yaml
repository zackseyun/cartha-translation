base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/didache/008/001.yaml
  text: But let your fasts not be with the hypocrites, for they fast on the second day of the week and on the fifth; but you, fast on the fourth day and on Preparation.
translation:
  language: en
  text: Do not fast on the same days as the hypocrites. They fast on Mondays and Thursdays, but you should fast on Wednesdays and Fridays.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: let your fasts not be with the hypocrites
  simplified_phrase: Do not fast on the same days as the hypocrites
  preserved_meaning: The readers must distinguish their fasting schedule from that of the hypocrites.
  reasoning_layer_used: source text and immediate contrast
  rationale: The following day lists show that “with” refers to fasting on the same days.
- pob_phrase: the second day of the week and on the fifth ... the fourth day and on Preparation
  simplified_phrase: Mondays and Thursdays ... Wednesdays and Fridays
  preserved_meaning: The four ancient weekday designations are expressed as their modern English equivalents.
  reasoning_layer_used: source text and cultural calendar equivalence
  rationale: Modern weekday names communicate the schedule directly, and “Preparation” was the customary name for Friday.
translation_notes:
  risk_flags:
