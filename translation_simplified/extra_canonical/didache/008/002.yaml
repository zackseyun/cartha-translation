    timestamp: '2026-04-23T20:31:44Z'
    unchanged: false
    changes_summary: Changed the opening from 'Nor pray like the hypocrites' to 'Do not pray like the hypocrites' for natural and accurate English matching the prohibition Μηδὲ προσεύχεσθε. No other changes needed.
translation:
  language: en
  text: 'Do not pray as the hypocrites do. Instead, pray as the Lord commanded in his gospel:


    Our Father in heaven,

    may your name be honored as holy.

    May your kingdom come.

    May your will be done on earth as it is in heaven.

    Give us today the bread we need for today.

    Forgive us our debt,

    as we also forgive those who owe us.

    Do not bring us into testing,

    but rescue us from the evil one.

    For the power and the glory are yours forever.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: but as the Lord commanded in his gospel, pray in this way
  simplified_phrase: Instead, pray as the Lord commanded in his gospel
  preserved_meaning: The prayer follows the Lord’s command and contrasts with hypocritical prayer.
  reasoning_layer_used: POB translation and applied revisions
  rationale: The contrast is divided into two natural English sentences.
- pob_phrase: may your name be made holy
  simplified_phrase: may your name be honored as holy
  preserved_meaning: God’s name is to be treated as holy rather than made holy in essence.
  reasoning_layer_used: POB wording in immediate prayer context
  rationale: The clearer wording prevents readers from thinking God’s name is not already holy.
- pob_phrase: for yours is the power and the glory unto the ages
  simplified_phrase: For the power and the glory are yours forever
  preserved_meaning: Power and glory belong to God without end.
  reasoning_layer_used: POB translation
  rationale: “Forever” expresses the lasting force of the archaic phrase “unto the ages.”
interpretive_expansions:
- pob_phrase: may your name be made holy
  rendering: may your name be honored as holy
  claim: The petition asks that God’s name be treated and acknowledged as holy.
  evidence:
