  simplified_phrase: do not become someone who habitually complains
  preserved_meaning: The warning concerns developing a settled habit of complaining.
  reasoning_layer_used: POB translation and Greek source
  rationale: This wording explains the character label without making every complaint the issue.
- pob_phrase: nor self-willed
  simplified_phrase: Do not stubbornly insist on your own way
  preserved_meaning: The warning rejects a willful refusal to yield.
  reasoning_layer_used: POB translation
  rationale: The ordinary wording makes the force of “self-willed” immediately clear.
- pob_phrase: for from all these blasphemies are born
  simplified_phrase: for all these things give rise to blasphemies
  preserved_meaning: The preceding dispositions can produce multiple acts or expressions of blasphemy.
  reasoning_layer_used: POB translation and Greek source image
  rationale: Natural English preserves both the birth image and the final plural.
translation_notes:
  risk_flags:
