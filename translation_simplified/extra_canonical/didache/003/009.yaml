base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/didache/003/009.yaml
  text: You shall not exalt yourself, nor give your soul boldness. Your soul shall not be joined with the lofty, but you shall associate with the righteous and humble.
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T20:31:19Z'
    unchanged: false
    changes_summary: Replaced the awkward and interpretive phrase 'give bold arrogance to your soul' with the more direct and natural 'give your soul boldness,' which more closely reflects θράσος without adding explanation. Left the rest essentially unchanged.
translation:
  language: en
  text: Do not put yourself above others or become presumptuous. Do not form close ties with people who are lofty—whether they are high in status or think too highly of themselves.[a] Instead, associate with those who do what is right and are humble.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word translated “lofty” can refer either to people of high position or to proud, self-exalting people.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: exalt yourself
  simplified_phrase: put yourself above others
  preserved_meaning: The command forbids raising your own importance or status.
  reasoning_layer_used: POB wording and immediate contrast with humility
  rationale: The concrete wording makes self-exaltation clear without weakening the command.
- pob_phrase: Your soul shall not be joined with the lofty
  simplified_phrase: Do not form close ties with people who are lofty
  preserved_meaning: The reader must not form close attachments to lofty people.
  reasoning_layer_used: Greek joining image and POB's broad term “lofty”
  rationale: “Form close ties” preserves the joining image while retaining the documented ambiguity.
- pob_phrase: associate with the righteous and humble
  simplified_phrase: associate with those who do what is right and are humble
  preserved_meaning: The reader should keep company with righteous and humble people.
  reasoning_layer_used: POB translation and source clause
  rationale: The wording explains “righteous” through conduct without implying shared residence.
interpretive_expansions:
- pob_phrase: give your soul boldness
  rendering: become presumptuous
  claim: The forbidden boldness is self-assertive presumption rather than healthy courage.
  evidence:
  - The prohibition stands beside the command not to exalt oneself.
  confidence: moderate
  alternatives_preserved:
  - become overbold
  - give yourself boldness
- pob_phrase: the lofty
  rendering: whether they are high in status or think too highly of themselves
  claim: The expression leaves open both social elevation and personal pride.
  evidence:
  - POB retains the broad expression “the lofty.”
  - The contrast with humble people supports the pride sense without excluding status.
  confidence: moderate
  alternatives_preserved:
  - people of high position
  - proud, self-exalting people
translation_notes:
  risk_flags:
  - risk: Stating both senses in the main text may sound more explanatory than the compact source expression.
    mitigation: The paired wording preserves rather than resolves the documented ambiguity.
