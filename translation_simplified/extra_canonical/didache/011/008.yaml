source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ πᾶς δὲ ὁ λαλῶν ἐν πνεύματι προφήτης ἐστίν, ἀλλ' ἐὰν ἔχῃ τοὺς τρόπους Κυρίου. Ἀπὸ οὖν τῶν τρόπων γνωσθήσεται ὁ ψευδοπροφήτης καὶ ὁ προφήτης.
  language: Greek
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/didache/011/008.yaml
  text: Yet not everyone speaking in the Spirit is a prophet[a], but only if he has the ways of the Lord. Therefore, from their ways the false prophet and the prophet will be known.
  footnotes:
  - marker: a
    text: Or 'the ways of the Lord. So then, from their ways'.
    reason: previous_rendering
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T20:32:18Z'
    unchanged: false
    changes_summary: Replaced 'conduct' with 'ways' to more closely reflect τρόποι and preserve consistency within the verse; adjusted 'So then' to 'Therefore' for slightly more formal natural English.
translation:
  language: en
  text: Still, not everyone who speaks in the Spirit is a prophet. A person is a prophet only if they follow the Lord’s ways. Therefore, their conduct will show whether they are a false prophet or a true prophet.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: not everyone speaking in the Spirit
  simplified_phrase: not everyone who speaks in the Spirit
  preserved_meaning: Speaking in the Spirit does not by itself prove that someone is a prophet.
  reasoning_layer_used: POB translation and Greek clause structure
  rationale: The relative clause is more natural in common English without weakening the warning.
- pob_phrase: only if he has the ways of the Lord
  simplified_phrase: only if they follow the Lord’s ways
  preserved_meaning: A genuine prophet must live according to the Lord’s pattern.
  reasoning_layer_used: POB wording, lexical review of τρόπος, and grounding review
  rationale: “Follow” keeps the Lord’s ways as the standard without implying perfect likeness to the Lord.
- pob_phrase: from their ways the false prophet and the prophet will be known
  simplified_phrase: their conduct will show whether they are a false prophet or a true prophet
  preserved_meaning: A person’s behavior distinguishes a false prophet from a genuine one.
  reasoning_layer_used: POB conclusion and immediate contrast
  rationale: The passive statement becomes a clear test while preserving conduct as its basis.
translation_notes:
  risk_flags:
  - risk: “Follow the Lord’s ways” may be heard as claiming flawless obedience.
    mitigation: In context, the phrase identifies the governing pattern of life used to distinguish true and false prophets.
