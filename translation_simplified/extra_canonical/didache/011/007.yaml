translation:
  language: en
  text: Do not test or judge any prophet who speaks in the Spirit. Every sin will be forgiven, but this sin will not be forgiven.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: And you shall not test or judge
  simplified_phrase: Do not test or judge
  preserved_meaning: The words remain a direct prohibition against both testing and judging.
  reasoning_layer_used: POB text
  rationale: A direct command is clearer modern English than “you shall not.”
- pob_phrase: any prophet speaking in the Spirit
  simplified_phrase: any prophet who speaks in the Spirit
  preserved_meaning: The ban applies to any prophet speaking in the Spirit without defining how the Spirit relates to the speech.
  reasoning_layer_used: POB text and applied grammar revision
  rationale: The relative clause reads naturally while preserving both the absolute scope and the Greek phrase’s ambiguity.
translation_notes:
  risk_flags:
  - risk: “In the Spirit” may remain unfamiliar to readers.
    mitigation: It is retained because replacing it with “by the Spirit” would narrow the source phrase to agency.
