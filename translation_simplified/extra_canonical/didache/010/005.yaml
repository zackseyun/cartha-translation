base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/didache/010/005.yaml
  text: Remember[a], Lord, your church, to deliver it from every evil and to perfect it in your love; and gather it from the four winds, the one sanctified for your kingdom, which you prepared for it. For yours is the power and the glory forever.
  footnotes:
  - marker: a
    text: Or 'and gather it, the sanctified one,'.
    reason: previous_rendering
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T20:31:54Z'
    unchanged: false
    changes_summary: Smoothed punctuation to reflect the Greek flow, removed the interpretive addition 'church' after 'the sanctified,' and revised the phrase order to preserve that the church is 'the one sanctified' and is gathered from the four winds. Kept 'perfect' and 'deliver' as accurate renderings.
translation:
  language: en
  text: 'Lord, remember your church: rescue it from every evil and bring it to completeness in your love. Gather it from the four winds—from every direction—the church made holy for your kingdom, which you prepared for it. For power and glory are yours forever.'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Remember, Lord, your church, to deliver it
  simplified_phrase: 'Lord, remember your church: rescue it'
  preserved_meaning: The prayer asks the Lord to remember his church by saving it from evil.
  reasoning_layer_used: POB translation and source clause structure
  rationale: The colon and direct request replace the awkward infinitive without changing the prayer.
- pob_phrase: to perfect it in your love
  simplified_phrase: bring it to completeness in your love
  preserved_meaning: The Lord is asked to make the church complete within his love.
  reasoning_layer_used: Latest revision preserving “perfect”
  rationale: This wording expresses completion clearly without suggesting instant flawlessness.
- pob_phrase: the one sanctified for your kingdom
  simplified_phrase: the church made holy for your kingdom
  preserved_meaning: The sanctified one is the church, made holy for God's kingdom.
  reasoning_layer_used: Greek apposition noted in applied revisions
  rationale: Repeating “church” clarifies the referent while the passive avoids specifying the agent.
interpretive_expansions:
- pob_phrase: from the four winds
  rendering: from the four winds—from every direction
  claim: The image describes gathering the scattered church from all directions.
  evidence:
  - The immediate context speaks of gathering the church.
  - The four-winds image indicates the full range of directions.
  confidence: high
  alternatives_preserved:
  - The concrete image “four winds” remains in the text.
translation_notes:
  risk_flags:
  - risk: “The church” is supplied in the appositional phrase rather than repeated in Greek.
    mitigation: The feminine participle refers back to the church, as the revision history explains.
  - risk: “To completeness” is less traditional than “to perfect.”
    mitigation: It preserves completion as the goal while improving clarity.
