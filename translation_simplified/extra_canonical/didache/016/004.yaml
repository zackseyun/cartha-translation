source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: αὐξανούσης γὰρ τῆς ἀνομίας, μισήσουσιν ἀλλήλους καὶ διώξουσι καὶ παραδώσουσι, καὶ τότε φανήσεται ὁ κοσμοπλάνος ὡς υἱὸς Θεοῦ καὶ ποιήσει σημεῖα καὶ τέρατα, καὶ ἡ γῆ παραδοθήσεται εἰς χεῖρας αὐτοῦ, καὶ ποιήσει ἀθέμιτα, ἃ οὐδέποτε γέγονεν ἐξ αἰῶνος.
  language: Greek
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/didache/016/004.yaml
  text: For as lawlessness increases, they will hate one another and persecute and betray one another, and then the world-deceiver will appear as a son of God and will do signs and wonders, and the earth will be delivered into his hands, and he will do unlawful things such as have never happened from the beginning of the age.
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T20:32:38Z'
    unchanged: false
    changes_summary: Corrected typographical errors ('world-deceiverd' to 'world-deceiver,' 'Gode' to 'God'), supplied the implied object in 'betray one another' for completeness and natural English, and revised the final phrase to more closely reflect ἐξ αἰῶνος as 'from the beginning of the age.'
translation:
  language: en
  text: As lawlessness grows, people will hate, persecute, and betray one another. Then the deceiver of the world will appear as a son of God and perform signs and wonders. The earth will be placed in his hands, and he will do forbidden things unlike anything that has happened from the beginning of the age.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: For as lawlessness increases
  simplified_phrase: As lawlessness grows
  preserved_meaning: Increasing rejection of law leads into the described hostility.
  reasoning_layer_used: POB translation and source payload
  rationale: The shorter wording keeps the causal setting while sounding natural.
- pob_phrase: they will hate one another and persecute and betray one another
  simplified_phrase: people will hate, persecute, and betray one another
  preserved_meaning: The same people will direct all three hostile actions against each other.
  reasoning_layer_used: POB revision rationale
  rationale: Naming “people” clarifies the pronoun without changing its broad reference.
- pob_phrase: the earth will be delivered into his hands
  simplified_phrase: The earth will be placed in his hands
  preserved_meaning: The world-deceiver will receive sweeping control over the earth.
  reasoning_layer_used: POB translation and Greek source image
  rationale: “Placed” is clearer than “delivered” while retaining the image of his hands.
translation_notes:
  risk_flags:
  - risk: “A son of God” may be read as affirming the deceiver’s true identity.
    mitigation: The wording preserves POB’s deliberate “appear as” rather than asserting that he is one.
  - risk: “From the beginning of the age” remains less idiomatic than “ever before.”
    mitigation: It is retained because the revision explicitly chose it to reflect the Greek phrase closely.
