    unchanged: false
    changes_summary: Changed 'a spreading out' to 'an opening' for a more natural and likely more accurate rendering of ἐκπετάσεως, while preserving the structure and all source elements.
translation:
  language: en
  text: 'Then signs connected with the truth will appear: first, a sign of an opening in heaven.[a] Next, a sign—the sound of a trumpet. Third, the dead will rise—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may instead describe something spreading or stretching out in heaven.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the signs of the truth will appear
  simplified_phrase: signs connected with the truth will appear
  preserved_meaning: The signs have a real but unspecified relationship to the truth.
  reasoning_layer_used: Greek source, POB translation, and grounding review
  rationale: “Connected with” keeps the genitive open without adding an unspecified claim that the signs prove.
- pob_phrase: then a sign of the sound of a trumpet
  simplified_phrase: Next, a sign—the sound of a trumpet
  preserved_meaning: The trumpet sound is the next sign.
  reasoning_layer_used: applied lexical revision
  rationale: The sequence is made natural while retaining “sound” rather than “voice.”
- pob_phrase: the resurrection of the dead
  simplified_phrase: the dead will rise
  preserved_meaning: The rising of dead people is the third sign.
  reasoning_layer_used: POB translation
  rationale: The abstract noun is recast as a direct verbal statement.
translation_notes:
  risk_flags:
  - risk: “Connected with” is broader than the compact Greek genitive.
    mitigation: The wording deliberately preserves the source’s unspecified relationship between the signs and the truth.
  - risk: “Opening” may obscure the Greek image of spreading or stretching out.
    mitigation: The lexical alternative is preserved in footnote [a].
