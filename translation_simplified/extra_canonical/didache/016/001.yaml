base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/didache/016/001.yaml
  text: Keep watch over your life.a Do not let your lamps be quenched, and do not let your loins be loosened,b but be ready, for you do not know the hour in which our Lord is coming.
translation:
  language: en
  text: Watch carefully over your life. Do not let your lamps go out, and keep your clothes tied up. Be ready, because you do not know the hour when our Lord will come.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Keep watch over your life
  simplified_phrase: Watch carefully over your life
  preserved_meaning: The command to remain vigilant about one’s life is retained without narrowing its scope.
  reasoning_layer_used: POB controlling translation and Greek source
  rationale: This uses natural English while preserving the command to keep watch.
- pob_phrase: Do not let your lamps be quenched
  simplified_phrase: Do not let your lamps go out
  preserved_meaning: The lamps must remain burning as an image of continued readiness.
  reasoning_layer_used: POB controlling translation and Greek source image
  rationale: “Go out” is the ordinary English expression for a lamp ceasing to burn.
- pob_phrase: do not let your loins be loosened
  simplified_phrase: keep your clothes tied up
  preserved_meaning: The concrete image of garments kept secured for action remains intact.
  reasoning_layer_used: Greek cultural image as represented in POB and immediate context
  rationale: This clarifies the ancient readiness image without reducing it to an abstract command.
translation_notes:
  risk_flags:
  - risk: Modern readers may not know why lamps and tied-up clothing portray readiness.
    mitigation: The next sentence explicitly commands readiness and makes the images’ shared point clear.
