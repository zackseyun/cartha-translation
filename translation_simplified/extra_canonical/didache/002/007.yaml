translation:
  language: en
  text: Do not hate anyone. Instead, correct some people, pray for some, and love some more than your own life.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: You shall not hate any person
  simplified_phrase: Do not hate anyone
  preserved_meaning: The command forbids hatred toward every person without exception.
  reasoning_layer_used: POB translation and revision rationale
  rationale: A direct command is clearer, while “anyone” preserves the generic sense of “person.”
- pob_phrase: some you shall reprove
  simplified_phrase: correct some people
  preserved_meaning: Some people should have their wrongdoing confronted rather than ignored.
  reasoning_layer_used: POB translation
  rationale: “Correct” expresses “reprove” in common English without turning it into punishment.
- pob_phrase: for some you shall pray, and some you shall love more than your own life
  simplified_phrase: pray for some, and love some more than your own life
  preserved_meaning: The distinct duties of prayer and costly love remain separate.
  reasoning_layer_used: POB translation and source clause structure
  rationale: The shorter wording removes repeated formal phrasing while preserving both commands and the life-comparison.
translation_notes:
