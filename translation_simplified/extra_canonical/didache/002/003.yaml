translation:
  language: en
  text: Do not wrongfully desire what belongs to your neighbor. Do not make a false oath. Do not give false testimony. Do not speak evil of others. Do not hold a grudge.
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: covet the things of your neighbor
  simplified_phrase: wrongfully desire what belongs to your neighbor
  preserved_meaning: The command forbids illicit desire for another person's possessions.
  reasoning_layer_used: applied lexical revision
  rationale: This explains “covet” in common English while preserving its specifically wrongful force.
- pob_phrase: swear falsely
  simplified_phrase: make a false oath
  preserved_meaning: The command forbids invoking an oath falsely.
  reasoning_layer_used: POB base translation
  rationale: “Make a false oath” distinguishes this command from ordinary lying and from false testimony.
- pob_phrase: bear false witness
  simplified_phrase: give false testimony
  preserved_meaning: The command forbids presenting untrue testimony.
  reasoning_layer_used: POB base translation
  rationale: “Give false testimony” states the same legal and public act in familiar language.
interpretive_expansions:
- pob_phrase: covet
  rendering: wrongfully desire
  claim: The desire prohibited here is illicit rather than desire in general.
  evidence:
  - The applied revision says the Decalogue echo gives ἐπιθυμέω an illicit, acquisitive sense.
  - The object is what belongs to one's neighbor.
  confidence: high
  alternatives_preserved:
