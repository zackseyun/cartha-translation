translation:
  language: en
  text: Jesus said, “This heaven[1] will pass away. The heaven above it will also pass away. The dead are not alive, and the living will not die. When you ate what is dead, you gave it life. What will you do when you come to be in the light?[2] On the day you were one, you became two.[3] What will you do when you become two?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: “Heaven” may also mean “sky,” but “the heaven above it” suggests more than one heavenly level.
    reason: lexical_alternative
  - marker: '2'
    text: The Coptic may imply “What will you do with it?” but whether “it” means the light or the living thing is uncertain.
    reason: lexical_alternative
  - marker: '3'
    text: This may also be understood as “When you become one, you will become two,” though the verb form favors the past wording in the text.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: This heaven will pass away, and the one above it will pass away.
  simplified_phrase: This heaven will pass away. The heaven above it will also pass away.
  preserved_meaning: Both this heaven and the higher one will pass away.
  reasoning_layer_used: POB lexical decision and layered-cosmology footnote
  rationale: Two direct sentences clarify the layered image without reducing “heaven” to “sky.”
- pob_phrase: you made it alive
  simplified_phrase: you gave it life
  preserved_meaning: Eating what is dead caused it to become living.
  reasoning_layer_used: POB causative lexical decision
  rationale: The common expression states the same causative relationship more naturally.
- pob_phrase: When you come to be in the light, what will you do?
  simplified_phrase: What will you do when you come to be in the light?
  preserved_meaning: The question concerns the future time when the hearers come to be in the light.
  reasoning_layer_used: POB prospective and light lexical decisions
  rationale: Ordinary English question order improves readability while retaining the symbolic light and prospective sense.
translation_notes:
  risk_flags:
  - risk: The contrasts between death, life, one, and two remain deliberately obscure.
    mitigation: The draft preserves the images rather than supplying an unsupported interpretation.
  - risk: The past sense of being one and becoming two is grammatically favored but disputed.
    mitigation: A footnote preserves the prospective alternative.
