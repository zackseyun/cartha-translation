base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/gospel_of_thomas/014.yaml
  text: Jesus said to them[1], "If you fast, you will acquire a sin for yourselves; and if you pray, you will be condemned; and if you give alms, you will do evil to your spirits. And if you go into any land and walk in the regions, if they receive you, eat what they set before you, and heal the sick among them. For what goes into your mouth will not defile you, but what comes out of your mouth[3][2], that is what will defile you."
  footnotes:
  - marker: '1'
    text: Lit. 'they will condemn you', a common Coptic idiom for the passive voice.
    reason: register_note
  - marker: '2'
    text: The Coptic verb ϫⲡⲟ can mean 'acquire' or 'beget'.
    reason: lexical_alternative
  - marker: '3'
    text: 'The Coptic uses left-dislocation for emphasis: ''what they will set before you, eat it; the sick among them, heal them.'''
    reason: register_note
  revision_pass:
    model: gpt-5.4-mini
    timestamp: '2026-05-03T07:41:46Z'
    unchanged: true
    changes_summary: No changes needed.
translation:
  language: en
  text: 'Jesus said to them, “If you fast, you will bring sin upon yourselves. If you pray, you will be condemned. If you give to the poor, you will do evil to your spirits.


    “When you enter any land and travel through its regions, if the people welcome you, eat whatever they serve you and heal the sick among them. For what enters your mouth does not defile you. What comes out of your mouth is what defiles you.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: acquire a sin for yourselves
  simplified_phrase: bring sin upon yourselves
  preserved_meaning: Their fasting results in sin for themselves.
  reasoning_layer_used: lexical and theological decisions
  rationale: This uses POB’s approved lexical alternative while keeping the saying’s provocative force.
- pob_phrase: give alms
  simplified_phrase: give to the poor
  preserved_meaning: The saying refers to charitable giving.
  reasoning_layer_used: source context and default simplification rules
  rationale: The concrete wording makes the traditional practice understandable without softening its rejection.
- pob_phrase: eat what they set before you
  simplified_phrase: eat whatever they serve you
  preserved_meaning: Travelers should accept the food their hosts provide.
  reasoning_layer_used: lexical decision for ⲕⲱ ϩⲁ-
  rationale: “Serve” expresses the hospitality idiom in ordinary English.
interpretive_expansions:
- pob_phrase: if they receive you
  rendering: if the people welcome you
  claim: The unnamed receivers are the people of the regions being visited.
  evidence:
  - The immediate context describes entering a land and traveling through its regions.
  - “The sick among them” refers back to the same receiving group.
  confidence: high
  alternatives_preserved:
  - if they receive you
translation_notes:
  risk_flags:
  - risk: “Bring sin upon yourselves” is less concrete than the possible rendering “beget a sin.”
    mitigation: It preserves POB’s chosen sense of acquiring sin and its self-directed consequence.
  - risk: Readers may narrow “what comes out of your mouth” only to spoken words.
    mitigation: The mouth image remains unexpanded because POB does not resolve its full scope.
