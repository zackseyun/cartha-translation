translation:
  language: en
  text: Jesus said, “You notice the splinter in your brother’s[a] eye, but you do not notice the beam in your own eye. When you take the beam out of your own eye, you will see clearly enough to take the splinter out of your brother’s eye.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “brother” may also mean a fellow disciple.
    reason: cultural_note
simplification_decisions:
- pob_phrase: The splinter that is in your brother’s eye, you see it
  simplified_phrase: You notice the splinter in your brother’s eye
  preserved_meaning: The hearer readily perceives another person’s small fault, pictured as a wooden splinter.
  reasoning_layer_used: POB lexical decision and applied grammar revision
  rationale: Natural English clause order replaces the Coptic-style topicalized structure without changing its object.
- pob_phrase: the beam that is in your own eye, you do not see it
  simplified_phrase: you do not notice the beam in your own eye
  preserved_meaning: The hearer overlooks the much larger obstruction in his own eye.
  reasoning_layer_used: POB lexical decision for ⲡⲥⲟⲓ
  rationale: “Beam” is retained because it preserves the structural wood image and sharp size contrast.
- pob_phrase: then you will see clearly to take
  simplified_phrase: you will see clearly enough to take
  preserved_meaning: Removing one’s own obstruction enables clear sight for helping the brother.
  reasoning_layer_used: POB idiom decision for ⲛⲁⲩ ⲉⲃⲟⲗ
  rationale: “Clearly enough” states the practical link in ordinary English while retaining the sight image.
interpretive_expansions:
- pob_phrase: see clearly to take
  rendering: see clearly enough to take
  claim: Clear sight enables the removal of the brother’s splinter.
  evidence:
  - The Coptic final clause links clear sight with taking out the splinter.
  - POxy 1 preserves the same purpose sequence.
  confidence: high
  alternatives_preserved:
  - see clearly to take
  external_witnesses:
  - POxy 1
translation_notes:
  risk_flags:
  - risk: “Notice” may sound less directly visual than “see.”
    mitigation: The surrounding eye, splinter, and beam imagery keeps literal sight prominent.
  - risk: Modern readers may take “brother” as only a biological relative.
    mitigation: A brief footnote preserves the possible fellow-disciple sense without replacing the source term.
