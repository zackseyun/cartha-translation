translation:
  language: en
  text: 'Jesus said, “The Father’s rule is like this: A man wanted to kill a powerful, high-ranking man. At home, he drew his sword and drove it into the wall to find out whether his hand was strong enough.[a] Then he killed that powerful, high-ranking man.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Coptic may also be rendered, “whether his hand could go in,” but in this context it likely refers to whether his hand was strong enough to drive the sword in.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The Father’s kingship
  simplified_phrase: The Father’s rule
  preserved_meaning: The phrase refers to the Father’s exercise of sovereignty, not a territory.
  reasoning_layer_used: POB lexical decision for ⲡⲙⲛⲧⲣⲣⲟ
  rationale: “Rule” expresses the abstract idea more clearly than “kingship.”
- pob_phrase: a magnate
  simplified_phrase: a powerful, high-ranking man
  preserved_meaning: The intended victim is a socially prominent great man.
  reasoning_layer_used: POB lexical decision and footnote for ⲙⲉⲅⲓⲥⲧⲁⲛⲟⲥ
  rationale: The description explains the uncommon word “magnate” in ordinary English.
- pob_phrase: He drew the sword in his house and drove it into the wall
  simplified_phrase: At home, he drew his sword and drove it into the wall
  preserved_meaning: He forcefully thrust the sword into a wall while in his house.
  reasoning_layer_used: POB lexical decisions for ϣⲱⲗⲙ and ϫⲟⲧⲥ ⲛⲡϫⲟ
  rationale: The recast sentence uses natural clause order while retaining the forceful sword image.
translation_notes:
  risk_flags:
  - risk: “Rule” may sound less like a traditional biblical title than “kingship.”
    mitigation: It preserves the POB decision that the term denotes sovereignty rather than territory.
  - risk: The phrase about the hand can also be understood more literally as “could go in.”
    mitigation: The footnote preserves that alternative while the main text follows the adjudicated strength reading.
