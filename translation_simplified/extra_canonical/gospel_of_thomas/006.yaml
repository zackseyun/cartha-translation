  reasoning_layer_used: POB translation and contextual meaning of alms
  rationale: The common phrase explains the unfamiliar term without adding commentary.
- pob_phrase: what shall we observe concerning eating?
  simplified_phrase: What rules should we follow about food?
  preserved_meaning: The disciples ask about dietary observance, not merely what to do while eating.
  reasoning_layer_used: POB lexical decision and applied revision for ϭⲓⲛⲟⲩⲱⲙ
  rationale: This wording makes the dietary focus clear in ordinary English.
- pob_phrase: nothing covered that will remain without being uncovered
  simplified_phrase: nothing covered will remain covered
  preserved_meaning: What is covered will ultimately be uncovered and exposed.
  reasoning_layer_used: POB theological decision favoring the Coptic covered/uncovered image
  rationale: The shorter construction preserves the image and avoids awkward double negation.
