translation:
  language: en
  text: Jesus said,[a] “Anyone who searches will find. For anyone who knocks to go in, it will be opened.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The words “Jesus said” are partly reconstructed because the manuscript is damaged here.
    reason: source_note
  - marker: b
    text: This may also be translated, “they will open it for them.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The one who seeks will find
  simplified_phrase: Anyone who searches will find
  preserved_meaning: The saying makes a general promise about whoever seeks.
  reasoning_layer_used: POB lexical decision for the generic relative construction and ϣⲓⲛⲉ
  rationale: “Anyone who searches” states the general meaning in natural English.
- pob_phrase: the one who knocks to enter
  simplified_phrase: anyone who knocks to go in
  preserved_meaning: The knocking is directed inward for the purpose of entering.
  reasoning_layer_used: POB lexical decision for ⲧⲱϩⲙ with directional ⲉϩⲟⲩⲛ
  rationale: “To go in” makes the inward direction clear without adding a door.
- pob_phrase: it will be opened for him
  simplified_phrase: it will be opened
  preserved_meaning: The unspecified object will be opened for the person who knocks, while the agent remains unstated.
  reasoning_layer_used: POB lexical decision for the impersonal third-person plural functioning passively
  rationale: The straightforward passive avoids a causative meaning while the preceding phrase identifies the beneficiary.
translation_notes:
  risk_flags:
  - risk: The pronoun “it” has no stated noun in the source.
    mitigation: The text keeps the object unspecified rather than adding “door.”
  - risk: Dropping “for them” could obscure who benefits from the opening.
    mitigation: The fronted phrase “For anyone who knocks” clearly identifies the beneficiary.
