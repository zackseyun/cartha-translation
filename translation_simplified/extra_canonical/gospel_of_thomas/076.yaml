translation:
  language: en
  text: 'Jesus said, “The Father’s Reign is like a merchant who had a load of goods and found a pearl. He acted wisely: he sold the goods and bought the one pearl for himself. You too, seek his treasure that never runs out but lasts—the place where no moth comes in to eat it and no worm destroys it.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The Reign of the Father is like a merchant. He had a consignment of goods
  simplified_phrase: The Father’s Reign is like a merchant who had a load of goods
  preserved_meaning: The Father’s royal rule is compared to a merchant with merchandise.
  reasoning_layer_used: POB lexical decisions for ⲡⲙⲛⲧⲣⲣⲟ and ⲫⲟⲣⲧⲓⲟⲛ
  rationale: This keeps “Reign” while replacing the technical “consignment” with a clear commercial phrase.
- pob_phrase: The merchant was prudent
  simplified_phrase: He acted wisely
  preserved_meaning: The merchant showed practical wisdom in making the sale.
  reasoning_layer_used: POB lexical decision for ⲥⲁⲃⲉ
  rationale: The verb phrase expresses prudent action in common English.
- pob_phrase: seek his treasure that does not fail, that endures
  simplified_phrase: seek his treasure that never runs out but lasts
  preserved_meaning: The treasure neither comes to an end nor passes away.
  reasoning_layer_used: POB lexical decisions for ⲱϫⲛ and ⲙⲟⲟⲩⲛ ⲉⲃⲟⲗ
  rationale: The wording preserves both paired ideas in familiar language.
translation_notes:
  risk_flags:
  - risk: “His treasure” has a manuscript spelling issue and an unclear referent.
    mitigation: The draft preserves the POB reading without resolving the ambiguity.
  - risk: The review requests “for yourselves,” but the latest adjudicated revision rejects that reflexive sense.
    mitigation: The draft retains “You too” in accordance with the controlling revision and avoids double translation.
