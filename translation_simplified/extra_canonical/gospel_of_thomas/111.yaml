base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/gospel_of_thomas/111.yaml
  text: Jesus said[a], "The heavens will roll up, and the earth, in your presence, and the one who lives from the living one will not see death." Does not Jesus say, "Whoever finds himself[b], the world is not worthy of him"?
  footnotes:
  - marker: a
    text: The text abruptly shifts into the third person, quoting Jesus as an external authority. This meta-commentary is unique in the Gospel of Thomas and strongly suggests a compiler's gloss or a later redactional layer that has been incorporated into the text.
    reason: textual_variant
    anchor_ref: Does not Jesus say
  - marker: b
    text: Coptic ⲁϩⲉ ⲉⲣⲟϥ ⲟⲩⲁⲁϥ. The word ⲟⲩⲁⲁϥ functions grammatically as a reflexive ('himself'), but given Thomas's theology of the solitary (monachos), it also carries the resonance of 'finds himself alone.'
    reason: lexical_alternative
    anchor_ref: finds himself
  revision_pass:
    model: gpt-5.4-mini
    timestamp: '2026-05-03T07:41:48Z'
    unchanged: true
    changes_summary: No changes needed.
translation:
  language: en
  text: Jesus said, “The heavens and the earth will roll up before you. Whoever receives life from the living one will not see death.” Does not Jesus say,[a] “The world is not worthy of the person who finds himself[b]”?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The text abruptly speaks of Jesus in the third person, perhaps preserving a compiler’s comment or a later addition.
    reason: textual_variant
  - marker: b
    text: The Coptic means “finds himself” but may also suggest “finds himself alone.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the one who lives from the living one
  simplified_phrase: Whoever receives life from the living one
  preserved_meaning: The person’s life comes from the ambiguously identified living one.
  reasoning_layer_used: POB theological decision and source wording
  rationale: This removes awkward English while keeping “living one” lowercase and undefined.
- pob_phrase: Does not Jesus say, “Whoever finds himself, the world is not worthy of him”?
  simplified_phrase: Does not Jesus say, “The world is not worthy of the person who finds himself”?
  preserved_meaning: The rhetorical question expects agreement and directly introduces the following quotation.
  reasoning_layer_used: POB lexical decision for ⲟⲩⲭ ϩⲟⲧⲓ and applied revision
  rationale: The question now clearly points forward to Jesus’ quoted saying.
- pob_phrase: Whoever finds himself, the world is not worthy of him
  simplified_phrase: The world is not worthy of the person who finds himself
  preserved_meaning: The world is unworthy of the one who finds himself.
  reasoning_layer_used: POB lexical decisions for ⲁϩⲉ ⲉⲣⲟϥ ⲟⲩⲁⲁϥ and ⲙ̄ⲡϣⲁ
  rationale: Natural clause order clarifies the sentence without resolving the ambiguity of “himself.”
interpretive_expansions:
- pob_phrase: lives from the living one
  rendering: receives life from the living one
  claim: The living one is presented as the source of the person’s life.
  evidence:
  - The source construction and POB retain the relationship expressed by “from.”
  - The POB theological decision leaves the identity of the living one open.
  confidence: moderate
  alternatives_preserved:
  - lives from the living one
  - draws life from the living one
translation_notes:
  risk_flags:
  - risk: “Receives life” is less literal than “lives from.”
    mitigation: It retains both the life language and its source in the living one.
  - risk: The sudden third-person reference to Jesus may confuse readers.
    mitigation: Footnote a identifies the abrupt shift without removing it.
