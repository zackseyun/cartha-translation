translation:
  language: en
  text: Jesus said, “If flesh came into existence because of spirit, that is a wonder. But if spirit came into existence because of the body, that is the greatest wonder of all. Yet I myself am amazed that this great wealth has made its home in this poverty.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: came into being
  simplified_phrase: came into existence
  preserved_meaning: The wording still describes origination rather than physical birth.
  reasoning_layer_used: POB lexical decision for ϣⲱⲡⲉ
  rationale: “Came into existence” is familiar English that retains the metaphysical sense.
- pob_phrase: a wonder of wonders
  simplified_phrase: the greatest wonder of all
  preserved_meaning: The phrase remains an emphatic superlative rather than a reference to children.
  reasoning_layer_used: POB lexical decision for ⲟⲩϣⲡⲏⲣⲉ ⲛϣⲡⲏⲣⲉ
  rationale: A direct English superlative makes the idiom immediately clear.
- pob_phrase: marvel at how
  simplified_phrase: am amazed that
  preserved_meaning: Jesus still expresses emphatic amazement at wealth dwelling in poverty.
  reasoning_layer_used: POB lexical decisions for ⲁⲛⲟⲕ and ⲣϣⲡⲏⲣⲉ
  rationale: The recast clause sounds natural while preserving the emphasis and amazement.
translation_notes:
  risk_flags:
  - risk: Readers may assume that “flesh” and “body” are interchangeable.
    mitigation: Both terms remain distinct because the source deliberately uses different words.
  - risk: “Wealth” and “poverty” may be understood only in a financial sense.
    mitigation: The source metaphor remains intact without imposing an undocumented explanation.
