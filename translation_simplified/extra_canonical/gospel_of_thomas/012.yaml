translation:
  language: en
  text: 'The disciples said to Jesus, “We know that you will leave us. Who will be great over us?”


    Jesus told them, “Wherever you are, go to James the Just. He is the one for whose sake heaven and earth came into being.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: you will depart from us
  simplified_phrase: you will leave us
  preserved_meaning: Jesus will go away from the disciples.
  reasoning_layer_used: POB lexical decisions for ⲛⲧⲟⲕⲛⲁⲃⲱⲕ and ⲛⲧⲛⲁⲛⲟⲛ
  rationale: “Leave us” expresses the contextual separation in ordinary English.
- pob_phrase: Who will be great over us?
  simplified_phrase: Who will be great over us?
  preserved_meaning: The question retains the source metaphor of superior greatness without defining it as rule or office.
  reasoning_layer_used: POB lexical decision for ⲉⲧⲉⲣⲉⲛⲁⲣⲛⲟϭ ⲉϩⲣⲁⲓ ⲉϫⲛⲁⲛⲟⲛ
  rationale: The existing wording is brief and avoids the unsupported institutional sense of “highest place.”
- pob_phrase: Wherever you are, you are to go to James the Just
  simplified_phrase: Wherever you are, go to James the Just
  preserved_meaning: The command applies wherever the disciples are and directs them to James.
  reasoning_layer_used: POB applied revision and jussive lexical decision
  rationale: A direct command is clearer while preserving the adjudicated reading and its obligation.
translation_notes:
  risk_flags:
  - risk: “Great over us” is an unusual English expression.
    mitigation: It is retained because clearer institutional terms would narrow the source metaphor.
  - risk: The statement about heaven and earth may surprise readers.
    mitigation: It remains direct because it is the source text’s explicit claim.
