translation:
  language: en
  text: The disciples asked Jesus, “Tell us, what is the kingdom of the heavens like?” Jesus answered, “It is like a mustard seed. It is the smallest of all seeds. But when it falls on soil prepared for planting, it produces a great branch and becomes a shelter for the birds of the sky.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The disciples said to Jesus, “Tell us what the kingdom of the heavens is like.”
  simplified_phrase: The disciples asked Jesus, “Tell us, what is the kingdom of the heavens like?”
  preserved_meaning: The disciples ask Jesus to describe what the kingdom resembles.
  reasoning_layer_used: POB lexical decisions for ϫⲱⲛⲧⲟⲥ and ⲉⲛⲓⲙ
  rationale: The direct question makes their request easier to follow.
- pob_phrase: the smallest of all seeds; but when it falls upon worked soil
  simplified_phrase: It is the smallest of all seeds. But when it falls on soil prepared for planting
  preserved_meaning: The tiny seed falls onto cultivated agricultural soil.
  reasoning_layer_used: POB lexical decision and cultural note for ⲣϩⲱⲃ
  rationale: A new sentence clarifies the contrast, while prepared soil explains the farming idiom.
- pob_phrase: it produces a great branch and becomes a shelter
  simplified_phrase: it produces a great branch and becomes a shelter
  preserved_meaning: The seed brings forth a large branch that shelters birds.
  reasoning_layer_used: POB main text and applied revision for ⲧⲁⲣ
  rationale: Produces preserves the source action, and branch retains the revision’s source-specific image.
interpretive_expansions:
- pob_phrase: worked soil
  rendering: soil prepared for planting
  claim: The soil has been cultivated for growing plants.
  evidence:
