  risk_flags:
  - risk: “Great branch” may sound unusual for a mustard plant.
    mitigation: It remains because the applied revision identifies ⲧⲁⲣ as a branch or twig.
  - risk: “The smallest of all seeds” may sound like a universal botanical claim.
    mitigation: The wording is retained as the comparison explicitly stated in the source and POB.
