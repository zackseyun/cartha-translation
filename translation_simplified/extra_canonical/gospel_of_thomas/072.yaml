translation:
  language: en
  text: A man said to him, “Tell my brothers[a] to divide my father’s property among us.” He answered, “Man, who appointed me to be a divider?” Then he turned to his disciples and said, “I am not a divider, am I?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The manuscript’s printed text says “brothers,” but the normalized text has “brother.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: so that they may divide my father's property with me
  simplified_phrase: to divide my father’s property among us
  preserved_meaning: The man asks his brothers to divide the family property with him.
  reasoning_layer_used: Lexical decisions for the purpose clause, “property,” and “with me.”
  rationale: “Among us” expresses the shared division in natural English.
- pob_phrase: who has made me a divider?
  simplified_phrase: who appointed me to be a divider?
  preserved_meaning: He questions who assigned him the role of divider.
  reasoning_layer_used: Lexical decisions for ⲉⲓⲣⲉ and the agent noun ⲛⲣⲉϥⲡⲱϣⲉ.
  rationale: “Appointed” clarifies the role while preserving the repeated noun “divider.”
- pob_phrase: I am not a divider, am I?
  simplified_phrase: I am not a divider, am I?
  preserved_meaning: The present-tense rhetorical question expects a negative answer.
  reasoning_layer_used: Applied revision for ⲙⲏ and the lexical decision for “that I am.”
  rationale: The wording retains both the present role denial and its rhetorical force.
interpretive_expansions:
- pob_phrase: with me
  rendering: among us
  claim: The requested division includes the speaker and his brothers.
  evidence:
  - The petition asks the brothers to divide their father’s property with the speaker.
  - The POB renders the comitative phrase as “with me.”
  confidence: high
  alternatives_preserved:
  - with me
translation_notes:
  risk_flags:
  - risk: “Appointed” may sound more official than the broader source verb.
    mitigation: It is limited to the first reply, where the POB lexical decision explicitly permits this sense.
