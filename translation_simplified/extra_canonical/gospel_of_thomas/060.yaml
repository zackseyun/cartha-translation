base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/gospel_of_thomas/060.yaml
  text: '⟨They saw⟩ a Samaritan carrying a lamb[a], going into Judea. He said to his disciples, "That one around the lamb?"

    They said to him, "So that he may kill it and eat it."

    He said to them, "As long as it is alive, he will not eat it, but if he kills it and it becomes a corpse."

    They said, "Otherwise he will not be able to do it."

    He said to them, "You yourselves, seek a place for yourselves in rest[b][c], so that you will not become a corpse and they eat you."'
  footnotes:
  - marker: a
    text: The manuscript lacks a main verb here, reading literally 'to a Samaritan.' Editors supply 'They saw' (ⲁⲩⲛⲁⲩ) to complete the sense.
    reason: textual_variant
    anchor_ref: ⟨They saw⟩
  - marker: c
    text: The Coptic is elliptical, literally 'That one around the lamb?' The disciples' response ('So that he may kill it...') indicates they understood it as a question about the man's intentions.
    reason: lexical_alternative
    anchor_ref: That one around the lamb?
  - marker: b
    text: The Coptic uses an active third-person plural ('and they eat you'), which functions similarly to an English passive ('and you be eaten') but is more vivid.
    reason: register_note
    anchor_ref: and they eat you
  revision_pass:
    model: gpt-5.4-mini
    timestamp: '2026-05-03T07:41:47Z'
    unchanged: true
    changes_summary: No changes needed.
translation:
  language: en
  text: '[a] They saw a Samaritan carrying a lamb into Judea. Jesus asked his disciples, “What is that man doing with the lamb?”[b]


    They answered, “He has it so that he may kill it and eat it.”


    Jesus said, “He will not eat it while it is alive. He can eat it only after he kills it and it becomes a corpse.”


    They said, “Otherwise, he will not be able to eat it.”


    Jesus told them, “You too must seek a place of rest for yourselves, so that you do not become corpses for others to eat.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The manuscript lacks the main verb; editors supply “They saw” to complete the sentence.
    reason: textual_variant
  - marker: b
    text: The Coptic question is elliptical, literally, “That one around the lamb?”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: That one around the lamb?
  simplified_phrase: What is that man doing with the lamb?
  preserved_meaning: Jesus asks about the Samaritan’s purpose concerning the lamb.
  reasoning_layer_used: POB theological decision and immediate dialogue
  rationale: The disciples’ purpose clause shows that they understood the elliptical words as a question about the man’s intentions.
- pob_phrase: As long as it is alive, he will not eat it, but if he kills it and it becomes a corpse.
  simplified_phrase: He will not eat it while it is alive. He can eat it only after he kills it and it becomes a corpse.
  preserved_meaning: The lamb must be killed and become a corpse before the man can eat it.
  reasoning_layer_used: POB lexical decision and clause logic
  rationale: Two direct sentences clarify the sequence while retaining the repeated corpse image.
- pob_phrase: so that you will not become a corpse and they eat you
  simplified_phrase: so that you do not become corpses for others to eat
  preserved_meaning: The disciples must avoid becoming like the dead lamb that is consumed.
  reasoning_layer_used: POB footnote on the active third-person plural
  rationale: “For others to eat” makes the indefinite agents natural in English without weakening the vivid image.
