base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/gospel_of_thomas/061.yaml
  text: 'Jesus said, "Two will rest on a couch; one will die, one will live."


    Salome said, "Who are you, man? As from one, you have gotten up onto my couch and eaten from my table."


    Jesus said to her, "I am he who exists from the Equal. I was given from the things of my Father."


    [Salome said,] "I am your disciple."


    [Jesus said,] "Because of this I say: whenever one becomes empty, he will be filled with light; but whenever one becomes divided, he will be filled with darkness."'
  footnotes:
  - marker: As from one
    text: Literally 'as from one' (ϩⲱⲥ ⲉⲃⲟⲗ ϩⲛ̄ⲟⲩⲁ). This could mean 'as if from someone [special]' or 'as from the One', reflecting Thomas's theology of unity.
    reason: lexical_alternative
  - marker: the Equal
    text: Coptic ⲡⲉⲧϣⲏϣ, 'that which is equal' or 'the Equal' (from ϣⲓϣ, 'to be equal, level').
    reason: theological_note
  - marker: '[Salome said,] ... [Jesus said,]'
    text: The Coptic text does not include speaker tags for the final two sentences. They are supplied here for clarity.
    reason: textual_variant
  - marker: empty
    text: The manuscript reads ϣⲏϥ (stative of ϣⲱϥ, 'to be empty, desolate'), which creates a wordplay with 'filled' (ⲙⲟⲩϩ). Many scholars emend this to ϣⲏϣ ('equal') to match 'the Equal' (ⲡⲉⲧϣⲏϣ) earlier in the saying and to contrast directly with 'divided' (ⲡⲏϣ).
    reason: textual_variant
  revision_pass:
    model: gpt-5.4-mini
    timestamp: '2026-05-03T07:41:48Z'
    unchanged: false
    changes_summary: Removed the bracketed gloss from Jesus’ opening saying and the stray bracketed/corrupted insertions in the final line, while retaining the established renderings 'couch,' 'gotten up,' 'the Equal,' 'empty,' and 'divided.'
translation:
  language: en
  text: 'Jesus said, “Two people will rest on a couch. One will die, and the other will live.”


    Salome said, “Who are you, man? You seem to come from someone—or perhaps from the One.[a] You took a place on my couch and ate at my table.”


    Jesus said to her, “I am the one whose existence comes from the Equal.[b] I was given from the things that belong to my Father.”


    Salome said,[c] “I am your disciple.”


    Jesus said, “That is why I tell you: when someone becomes empty,[d] that person will be filled with light. But when someone becomes divided, that person will be filled with darkness.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally “as from one.” The phrase may mean “as though from someone special” or “as from the One.”
    reason: lexical_alternative
  - marker: b
    text: The Coptic can mean “that which is equal” or “the Equal”; the title is retained here.
    reason: simplification_note
  - marker: c
    text: The Coptic does not identify the speakers in the final exchange; the names are supplied from the dialogue.
    reason: textual_variant
  - marker: d
    text: The manuscript reads “empty,” creating a wordplay with “filled”; many scholars emend it to “equal.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: Two will rest on a couch; one will die, one will live.
  simplified_phrase: Two people will rest on a couch. One will die, and the other will live.
  preserved_meaning: Two people share the resting place but have opposite outcomes.
  reasoning_layer_used: Applied revision and source syntax
  rationale: Adding “people” and dividing the sentence clarifies the contrast while preserving the future verb.
- pob_phrase: you have gotten up onto my couch and eaten from my table
  simplified_phrase: You took a place on my couch and ate at my table.
  preserved_meaning: Jesus occupied Salome’s dining couch and shared her food.
  reasoning_layer_used: POB lexical decision for ⲧⲉⲗⲟ and its contextual rationale
  rationale: “Took a place” states the dining action naturally without losing the couch image.
- pob_phrase: I am he who exists from the Equal. I was given from the things of my Father.
  simplified_phrase: I am the one whose existence comes from the Equal. I was given from the things that belong to my Father.
  preserved_meaning: Jesus identifies himself by his origin from the Equal and from what belongs to his Father.
  reasoning_layer_used: POB theological decision and applied revision
  rationale: The rewrite retains Jesus’ identity claim, the title “the Equal,” and the plural “things” without adding a selection relationship.
interpretive_expansions:
- pob_phrase: As from one
  rendering: You seem to come from someone—or perhaps from the One.
  claim: The phrase leaves open both an indefinite personal source and the theological title “the One.”
  evidence:
  - The POB footnote explicitly preserves both possible senses.
  - The saying’s language of equality and division keeps the unity reading contextually relevant.
  confidence: moderate
  alternatives_preserved:
  - as though from someone special
  - as from the One
  - as from one
translation_notes:
  risk_flags:
  - risk: The phrase “as from one” remains difficult and genuinely ambiguous.
    mitigation: The main text presents both live senses, and footnote [a] gives the literal wording.
  - risk: The manuscript’s “empty” is sometimes emended to “equal.”
    mitigation: The manuscript reading stays in the text, while footnote [d] records the alternative.
