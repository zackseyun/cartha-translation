base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/gospel_of_thomas/037.yaml
  text: His disciples said, "When[a] will you be revealed[f] to us, and when will we see you?" Jesus said, "When you strip naked without being ashamed,[b] and you take your clothes and put them under your feet like[e] the little children,[c] and trample on them, then[d] you will see the Son of the Living One,[g] and you will not be afraid."
  revision_pass:
    model: doctrine-realignment
    timestamp: '2026-05-18T04:58:28Z'
    unchanged: false
    changes_summary: 'doctrine_realignment: Gospel of Thomas — Saying 37 metadata stamp (2 override) [no-op text]. Text already matches azure_from; stamping doctrine_realignment metadata so the audit no longer flags this verse. Chosen renderings preserved: [''take'', ''the little children''].'
translation:
  language: en
  text: 'His disciples asked him, “When will you be revealed to us? When will we see you?”


    Jesus answered, “When you strip off your clothes without shame, put them under your feet as little children do, and trample on them, then you will see the Son of the Living One, and you will not be afraid.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: His disciples said
  simplified_phrase: His disciples asked him
  preserved_meaning: The disciples address Jesus with two questions.
  reasoning_layer_used: POB text and immediate dialogue
  rationale: Ordinary English introduces direct questions with “asked” rather than “said.”
- pob_phrase: When will you be revealed to us, and when will we see you?
  simplified_phrase: When will you be revealed to us? When will we see you?
  preserved_meaning: Both questions remain distinct, and the passive wording avoids assigning agency beyond the POB.
  reasoning_layer_used: POB text and independent grounding review
  rationale: Two short questions are easier to follow while preserving the audited formulation.
- pob_phrase: When you strip naked without being ashamed, and you take your clothes and put them under your feet like the little children
  simplified_phrase: When you strip off your clothes without shame, put them under your feet as little children do
  preserved_meaning: The image retains undressing without shame and treating the clothes as little children do.
  reasoning_layer_used: POB text and applied revision preserving the clothing and children imagery
  rationale: Natural clause order makes the action clear without interpreting the image.
translation_notes:
  risk_flags:
  - risk: The nakedness and trampling imagery may be understood literally or symbolically.
    mitigation: The text preserves the image without deciding its interpretation.
