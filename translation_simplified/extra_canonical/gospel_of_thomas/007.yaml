translation:
  language: en
  text: 'Jesus said, “This lion is blessed: a person will eat it, so that the lion becomes human. But this person is accursed: the lion will eat them, and the lion will become human.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Blessed is this lion which the human will eat
  simplified_phrase: 'This lion is blessed: a person will eat it'
  preserved_meaning: The particular lion is blessed because a human being will eat it.
  reasoning_layer_used: POB lexical decisions for “blessed,” “this,” and generic prōme
  rationale: The clause is recast in ordinary English while retaining its deictic emphasis and beatitude language.
- pob_phrase: accursed is this human whom the lion will eat
  simplified_phrase: 'this person is accursed: the lion will eat them'
  preserved_meaning: The particular person eaten by the lion is placed under the saying’s negative judgment.
  reasoning_layer_used: POB lexical decisions for bōte and generic prōme
  rationale: “Person” is natural and gender-inclusive, while “accursed” preserves the force and contrast of the source.
- pob_phrase: so that the lion becomes human; ... and the lion will become human
  simplified_phrase: so that the lion becomes human. ... and the lion will become human
  preserved_meaning: The first transformation is expressed as a consequence, while the second remains an independent future result.
  reasoning_layer_used: Applied grammar revision distinguishing the conjunctive from Future I
  rationale: The two different verbal relationships are kept rather than flattened into identical wording.
translation_notes:
  risk_flags:
  - risk: The lion-and-human image remains deliberately enigmatic and may invite competing interpretations.
    mitigation: The draft preserves the image without adding an unsupported explanation.
  - risk: Changing relative clauses into colon-linked statements slightly loosens their grammatical form.
    mitigation: Repeated nouns and matching clause order keep each eater, victim, and result unambiguous.
