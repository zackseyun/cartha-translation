translation:
  language: en
  text: His disciples asked him, “Does circumcision do any good?” He answered, “If it did, their father would bring them into being already circumcised when they came from their mother. But true circumcision in spirit[1] has become completely beneficial.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: “True circumcision” literally reads “the circumcision of truth”; “spirit” may also be understood as “the Spirit.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Does circumcision benefit or not?
  simplified_phrase: Does circumcision do any good?
  preserved_meaning: The disciples ask whether ritual circumcision provides any benefit.
  reasoning_layer_used: Lexical decision for ⲣⲱⲫⲉⲗⲉⲓ as a verb of advantage.
  rationale: The common idiom makes the question immediately clear.
- pob_phrase: their father would beget them circumcised from their mother
  simplified_phrase: their father would bring them into being already circumcised when they came from their mother
  preserved_meaning: The father directly brings them into being, with circumcision pictured as present at birth.
  reasoning_layer_used: Lexical decisions for ϫⲡⲟⲛ, the source phrase, and the contemporaneous-state construction.
  rationale: This avoids archaic “beget” without turning the paternal action into indirect causation.
- pob_phrase: the circumcision of truth in spirit has become entirely profitable
  simplified_phrase: true circumcision in spirit has become completely beneficial
  preserved_meaning: The corrective contrast presents circumcision in spirit as wholly beneficial.
  reasoning_layer_used: Lexical decisions for ⲡⲥⲃⲃⲉ ⲛⲙⲉ, ϩⲛ ⲡⲛⲉⲩⲙⲁ, and the final idiom.
  rationale: The likely adjectival sense is clear while the footnote preserves the literal form and Spirit ambiguity.
interpretive_expansions:
- pob_phrase: them circumcised from their mother
  rendering: already circumcised when they came from their mother
  claim: Their circumcised state is pictured as present at birth.
  evidence:
  - The source construction marks a contemporaneous state.
  - The phrase “from their mother” places that state at birth.
  confidence: high
  alternatives_preserved:
  - born circumcised
  - come from their mother circumcised
translation_notes:
  risk_flags:
  - risk: “Bring them into being” is broader than the direct paternal verb “beget.”
    mitigation: The father remains the direct subject, and the wording avoids suggesting indirect causation.
  - risk: Lowercase “spirit” may be read as excluding the Holy Spirit.
    mitigation: The footnote preserves “the Spirit” as an alternative without resolving the ambiguity.
