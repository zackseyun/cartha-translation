base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/gospel_of_thomas/045.yaml
  text: Jesus said, “They do not pick grapes from thorns, nor do they gather figs[b] from thistles—for they do not give fruit. A good person[a] brings out a good thing from his storehouse; an evil person brings out an evil thing from his storehouse that is in his heart[c], and he speaks evil[d], for from the overflow of the heart he brings out evil.”
  revision_pass:
    model: doctrine-realignment
    timestamp: '2026-05-18T04:58:28Z'
    unchanged: false
    changes_summary: 'doctrine_realignment: Gospel of Thomas — Saying 45 metadata stamp (1 override) [no-op text]. Text already matches azure_from; stamping doctrine_realignment metadata so the audit no longer flags this verse. Chosen renderings preserved: [''that is in his heart''].'
translation:
  language: en
  text: Jesus said, “People do not pick grapes from thornbushes or gather figs from thistles, because neither plant bears that kind of fruit. A good person brings good things out of the storehouse within. An evil person brings evil things out of the storehouse in the heart and speaks evil. For when the heart is full of evil, evil comes out.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: They do not pick grapes from thorns, nor do they gather figs from thistles—for they do not give fruit.
  simplified_phrase: People do not pick grapes from thornbushes or gather figs from thistles, because neither plant bears that kind of fruit.
  preserved_meaning: The kind of plant determines the kind of fruit people can gather from it.
  reasoning_layer_used: POB text and Coptic source payload
  rationale: The rewrite clarifies the implied contrast without weakening the agricultural image.
- pob_phrase: brings out a good thing from his storehouse
  simplified_phrase: brings good things out of the storehouse within
  preserved_meaning: A person's inner reserve produces actions or words matching its character.
  reasoning_layer_used: POB controlling metaphor
  rationale: “Within” locates the storehouse clearly while retaining the source image.
- pob_phrase: from the overflow of the heart he brings out evil
  simplified_phrase: when the heart is full of evil, evil comes out
  preserved_meaning: Evil speech and conduct flow from the evil filling a person's heart.
  reasoning_layer_used: POB wording and immediate parallelism
  rationale: The dense overflow clause becomes a direct cause-and-result statement.
interpretive_expansions:
- pob_phrase: from the overflow of the heart he brings out evil
  rendering: when the heart is full of evil, evil comes out
  claim: The heart's overflowing content is evil in this negative example.
  evidence:
  - The preceding clause places evil in the person's heart.
  - The POB says the person brings out evil from the heart's overflow.
  confidence: high
  alternatives_preserved:
  - evil comes from the overflow of the heart
translation_notes:
  risk_flags:
  - risk: “That kind of fruit” slightly explains the terse claim that thorny plants do not give fruit.
    mitigation: The wording preserves the specific grape-and-fig contrast rather than making a botanical absolute.
