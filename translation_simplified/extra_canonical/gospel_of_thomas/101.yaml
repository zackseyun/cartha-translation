    unchanged: true
    changes_summary: No changes needed.
translation:
  language: en
  text: Anyone who does not hate their father and mother as I do cannot become my disciple.[a] And anyone who does not love their father and mother as I do cannot become my disciple. For my mother …,[c] but my true mother gave me life.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “As I do” can also mean “like me” or “in my manner.”
    reason: lexical_alternative
  - marker: c
    text: The manuscript is damaged here; the missing words may have described the first mother giving something opposed to life.
    reason: textual_variant
simplification_decisions:
- pob_phrase: Whoever does not hate his father and his mother
  simplified_phrase: Anyone who does not hate their father and mother
  preserved_meaning: The requirement concerning hatred of both parents remains unchanged.
  reasoning_layer_used: POB lexical decision for ⲙⲉⲥⲧⲉ
  rationale: Singular “their” removes unnecessary masculine wording without weakening “hate.”
- pob_phrase: and whoever does not love his father and his mother as I do
  simplified_phrase: And anyone who does not love their father and mother as I do
  preserved_meaning: The requirement to love both parents remains distinct and additive.
  reasoning_layer_used: POB lexical decisions and source conjunction
  rationale: “And” preserves the source relationship without imposing an adversative contrast.
- pob_phrase: For my mother [...], but my true [mother] gave me life
  simplified_phrase: For my mother …, but my true mother gave me life
  preserved_meaning: The damaged statement about the biological mother remains connected to the preceding sayings and contrasted with the true mother.
  reasoning_layer_used: POB theological decision and textual-variant note
  rationale: The connective and visible gap preserve the relation and damage without guessing the missing words.
translation_notes:
  risk_flags:
  - risk: Modern readers may assume “hate” is softened language for preference.
    mitigation: The text retains the source-driven word “hate” without qualification.
  - risk: The damaged clause may invite an unsupported reconstruction.
    mitigation: The gap remains visible, and the footnote describes a possibility without selecting it.
