translation:
  language: en
  text: Jesus said, “I have thrown a fire onto the world. Look! I am keeping watch over it until it flares up.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: cast a fire upon the world
  simplified_phrase: thrown a fire onto the world
  preserved_meaning: Jesus has completed the act of casting fire onto the world, with continuing relevance.
  reasoning_layer_used: POB lexical decisions for ⲛⲟⲩϫⲉ and ⲉϫⲛⲡⲕⲟⲥⲙⲟⲥ
  rationale: “Thrown” and “onto” use common English while preserving the forceful casting image and worldwide scope.
- pob_phrase: and look
  simplified_phrase: Look!
  preserved_meaning: Jesus abruptly calls attention to what he is doing now.
  reasoning_layer_used: POB lexical decision for ⲉⲓⲥϩⲏⲏⲧⲉ
  rationale: A separate exclamation preserves the idiom’s terse immediacy.
- pob_phrase: I am guarding it until it blazes
  simplified_phrase: I am keeping watch over it until it flares up
  preserved_meaning: Jesus continues to watch over the fire until it burns with greater intensity.
  reasoning_layer_used: POB lexical decisions for ϩⲁⲣⲉϩ, ϣⲁⲛⲧⲉ, and ϫⲉⲣⲟ
  rationale: The clearer phrases retain the ongoing watch and the vivid flare of the fire.
translation_notes:
  risk_flags:
  - risk: “Thrown a fire” is less idiomatic than “started a fire.”
    mitigation: The wording preserves the source’s forceful throwing image rather than replacing it with ignition.
  - risk: The saying does not explain what the fire represents.
    mitigation: The translation leaves the image open because the POB reasoning does not resolve it.
