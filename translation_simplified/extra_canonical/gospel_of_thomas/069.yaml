translation:
  language: en
  text: Jesus said, “Blessed are those who have suffered persecution in their heart.[1] They are the ones who have truly come to know the Father. Blessed are those who have gone hungry, so that the one who longs will have a full belly.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: “In their heart” may refer either to the persecutors’ hearts or to the inner heart of those persecuted.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: have been persecuted in their heart
  simplified_phrase: have suffered persecution in their heart
  preserved_meaning: They have experienced hostile persecution, while the heart phrase remains unchanged and ambiguous.
  reasoning_layer_used: POB lexical decision and ambiguity footnote
  rationale: The active English expression is easier to read without weakening “persecute” or resolving “their heart.”
- pob_phrase: have truly known the Father
  simplified_phrase: have truly come to know the Father
  preserved_meaning: They have genuinely attained knowledge of the Father.
  reasoning_layer_used: POB lexical decision for ⲥⲟⲟⲩⲛ and ϩⲛⲟⲩⲙⲉ
  rationale: “Come to know” makes the perfective sense natural in modern English.
- pob_phrase: the belly of the one who desires will be filled
  simplified_phrase: the one who longs will have a full belly
  preserved_meaning: The desiring person’s belly will be filled.
  reasoning_layer_used: POB lexical decisions for ⲟⲩⲱϣ, ⲡϩⲏ, and ⲥⲓⲟ
  rationale: The recast clause reads naturally while preserving desire and the concrete belly image.
translation_notes:
  risk_flags:
  - risk: Readers may still find “in their heart” unusual or unclear.
    mitigation: The footnote preserves and explains the source’s two possible attachments.
  - risk: “The one who longs” leaves the object of desire unstated.
    mitigation: This avoids adding an object that the Coptic does not specify.
