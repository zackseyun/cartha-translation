    unchanged: true
    changes_summary: No changes needed.
translation:
  language: en
  text: He said, “Lord, there are many people around the drinking trough, but the well is empty.”[1][2]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: It is unclear whether Jesus is addressing God or a disciple is addressing Jesus; this may continue the previous saying.
    reason: textual_variant
  - marker: '2'
    text: The final words could also mean “but no one is in the well.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: there are many around
  simplified_phrase: there are many people around
  preserved_meaning: Many people are present around the drinking trough.
  reasoning_layer_used: POB translation and independent grounding review
  rationale: Adding “people” clarifies the implied referent without adding an action.
- pob_phrase: there is nothing in the well
  simplified_phrase: the well is empty
  preserved_meaning: The well contains nothing, most naturally no water.
  reasoning_layer_used: POB lexical decision for ⲗⲁⲁⲩ
  rationale: “Empty” expresses the preferred sense naturally while a footnote preserves the alternative.
interpretive_expansions:
- pob_phrase: there are many around
  rendering: there are many people around
  claim: The unspecified “many” refers to people present around the trough.
  evidence:
  - The immediate scene presents the “many” as those positioned around a drinking place.
  confidence: high
- pob_phrase: there is nothing in the well
  rendering: the well is empty
  claim: The well lacks its expected contents, most naturally water.
  evidence:
  - The POB lexical rationale selects “nothing,” understood naturally as no water in a well.
  confidence: moderate
  alternatives_preserved:
  - There is no one in the well.
translation_notes:
  risk_flags:
  - risk: “Empty” may make the no-water sense seem more certain than the Coptic permits.
    mitigation: Footnote [2] retains the grammatically possible “no one” reading.
  - risk: The identities of “he” and “Lord” remain unclear.
    mitigation: The text leaves both identities unspecified, and footnote [1] explains the ambiguity.
