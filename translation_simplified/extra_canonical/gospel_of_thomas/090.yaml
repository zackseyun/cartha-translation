translation:
  language: en
  text: Jesus said, “Come to me, because my yoke is good and my rule is gentle. You will find rest for yourselves.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Come to me; for my yoke is good
  simplified_phrase: Come to me, because my yoke is good
  preserved_meaning: Jesus invites the hearers to come to him and gives the goodness of his yoke as a reason.
  reasoning_layer_used: POB lexical decisions and source clause structure
  rationale: “Because” clearly preserves the causal link in natural modern English.
- pob_phrase: my lordship is gentle
  simplified_phrase: my rule is gentle
  preserved_meaning: Jesus describes his authority as gentle.
  reasoning_layer_used: POB lexical decision for ⲙⲛⲧϫⲟⲉⲓⲥ
  rationale: “Rule” clearly expresses the abstract authority conveyed by “lordship.”
translation_notes:
  risk_flags:
  - risk: “Rule” carries less explicit social nuance than “lordship.”
    mitigation: The possessive wording and “gentle” keep the focus on the character of Jesus’ authority.
