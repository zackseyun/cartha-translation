translation:
  language: en
  text: Jesus said, “Poor people are blessed, because the kingdom of the heavens[a] belongs to you.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Coptic says “heavens” in the plural, a distinctive wording in Thomas.
    reason: source_note
simplification_decisions:
- pob_phrase: Blessed are the poor
  simplified_phrase: Poor people are blessed
  preserved_meaning: Poor people are declared blessed in the traditional beatitude sense.
  reasoning_layer_used: POB lexical decisions for ϩⲉⲛⲙⲁⲕⲁⲣⲓⲟⲥ and generic ⲡϩⲏⲕⲉ
  rationale: Natural clause order clarifies the declaration while retaining “blessed.”
- pob_phrase: for yours is the kingdom of the heavens
  simplified_phrase: because the kingdom of the heavens belongs to you
  preserved_meaning: The kingdom is said to belong to the people Jesus directly addresses.
  reasoning_layer_used: POB lexical decisions for causal ϫⲉ, plural ⲧⲱⲧⲛ, and revised ⲡⲙⲛⲧⲣⲣⲟ
  rationale: Common wording makes the causal link and possession immediately clear.
translation_notes:
  risk_flags:
  - risk: The source shifts from generic “the poor” to directly addressed plural “you.”
    mitigation: “Poor people” and “you” remain grammatically distinct rather than being explicitly identified.
