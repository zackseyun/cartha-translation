translation:
  language: en
  text: Do not give what is holy to the dogs, or they may throw those holy things onto the manure pile.[a] Do not throw pearls to the pigs, or they may do it [...].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The manuscript says “what is holy” but later uses the plural “them”; “those holy things” preserves that shift in clear English.
    reason: source_note
  - marker: b
    text: The manuscript breaks off after words meaning “they do it”; “trample” is possible but is not preserved in the text.
    reason: textual_variant
simplification_decisions:
- pob_phrase: lest they throw them onto the dung-heap
  simplified_phrase: or they may throw those holy things onto the manure pile
  preserved_meaning: The dogs may discard what is holy on a pile of animal waste.
  reasoning_layer_used: POB lexical decisions and applied revision
  rationale: “Or they may” replaces archaic “lest,” while “manure pile” keeps the concrete village image.
- pob_phrase: lest they do it [...]
  simplified_phrase: or they may do it [...]
  preserved_meaning: The surviving warning remains incomplete because the manuscript breaks off.
  reasoning_layer_used: POB applied revision and lacuna footnote
  rationale: The wording keeps the legible verb without guessing the missing action.
interpretive_expansions:
- pob_phrase: throw them
  rendering: throw those holy things
  claim: The plural object refers back to what was given as holy.
  evidence:
  - The transmitted verb has a plural object suffix.
  - The immediate clause supplies no other plausible object.
  confidence: moderate
  alternatives_preserved:
  - The manuscript’s singular-to-plural grammatical shift is noted in the footnote.
translation_notes:
  risk_flags:
  - risk: “Those holy things” makes the plural reference smoother than the manuscript’s grammatical mismatch.
    mitigation: Footnote [a] explicitly records the source’s shift from singular to plural.
  - risk: Readers may assume the missing action was trampling.
    mitigation: Footnote [b] states that “trample” is only a conjecture.
