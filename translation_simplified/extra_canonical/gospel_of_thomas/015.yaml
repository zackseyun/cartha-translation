translation:
  language: en
  text: Jesus said, “When you see the one who was not born from a woman, throw yourselves facedown and worship him. That one is your Father.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: throw yourselves down upon your faces
  simplified_phrase: throw yourselves facedown
  preserved_meaning: The vivid command to lower the whole body with the face to the ground remains intact.
  reasoning_layer_used: lexical decision for ⲡⲱϩⲧ and applied grammatical revision
  rationale: “Facedown” expresses the posture naturally while retaining the command’s stark physical force.
translation_notes:
  risk_flags:
  - risk: Modern readers may find “not born from a woman” mysterious and infer a specific identity not stated here.
    mitigation: The translation preserves Thomas’s wording and does not explain or resolve the identification beyond “your Father.”
