translation:
  language: en
  text: Jesus said, “I will give you[a] something no eye has seen, no ear has heard, and no hand has touched—something that has never risen upon the human heart.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “you” refers to more than one person.
    reason: source_note
  - marker: b
    text: Compare Isaiah 64:4 and 1 Corinthians 2:9, which use related wording.
    reason: cross_reference
simplification_decisions:
- pob_phrase: what eye has not seen, and what ear has not heard, and what hand has not touched
  simplified_phrase: something no eye has seen, no ear has heard, and no hand has touched
  preserved_meaning: The gift is beyond all ordinary sight, hearing, and touch.
  reasoning_layer_used: POB lexical decisions and parallel Coptic clauses
  rationale: Adding “something” makes the shared object clear while preserving all three sensory images.
- pob_phrase: and it has not arisen upon the human heart
  simplified_phrase: something that has never risen upon the human heart
  preserved_meaning: The same promised gift has not arisen upon the human heart.
  reasoning_layer_used: POB lexical decisions for ⲉϩⲣⲁⲓ and ϩⲓ ⲡϩⲏⲧ
  rationale: “Risen” is more common than “arisen” while retaining the distinctive upward image and “upon” wording.
translation_notes:
  risk_flags:
  - risk: “Risen upon the human heart” remains unusual English.
    mitigation: The wording is retained because the POB audit deliberately preserves both the rising action and the “upon” image.
