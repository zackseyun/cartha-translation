translation:
  language: en
  text: Jesus said, “When you make the two into one, you will become sons of the Human.[a] And when you say, ‘Mountain, move away,’ it will move.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sons of the Human” may also be translated “children of the Human.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: make the two one
  simplified_phrase: make the two into one
  preserved_meaning: The enigmatic transformation of two into one remains intact.
  reasoning_layer_used: POB lexical decisions for ⲡⲥⲛⲁⲩ and ⲟⲩⲁ
  rationale: Adding “into” makes the phrase natural in English without explaining what the two represent.
- pob_phrase: sons of the Human
  simplified_phrase: sons of the Human
  preserved_meaning: Thomas’s distinctive title and the literal force of “sons” are retained.
  reasoning_layer_used: POB lexical decisions for ⲛϣⲏⲣⲉ and ⲛⲡⲣⲱⲙⲉ
  rationale: The unusual wording remains because replacing it would import a more familiar title or erase Thomas’s diction.
- pob_phrase: when you say
  simplified_phrase: when you say
  preserved_meaning: The text refers simply to speaking the command, not necessarily speaking aloud.
  reasoning_layer_used: Applied revision correcting the parsing of ϫⲟⲟⲥ
  rationale: The corrected wording avoids restoring the earlier mistranslation “say aloud.”
translation_notes:
  risk_flags:
  - risk: Readers may not know what “the two” refers to.
    mitigation: The saying’s documented ambiguity is preserved rather than resolved without sufficient evidence.
  - risk: “The Human” may sound unfamiliar as a title.
    mitigation: The wording follows the POB decision and the footnote clarifies only the gender range of “sons.”
