translation:
  language: en
  text: Jesus said, “Anyone close to me is close to the fire. Anyone far from me is far from the kingdom.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Coptic word translated “kingdom” can also mean “kingship” or “royal rule.”
    reason: lexical_alternative
