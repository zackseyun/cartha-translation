- pob_phrase: The one who is near me is near the fire, and the one who is far from me is far from the kingdom.
  simplified_phrase: Anyone close to me is close to the fire. Anyone far from me is far from the kingdom.
  preserved_meaning: Closeness to Jesus parallels closeness to the fire, while distance from Jesus parallels distance from the kingdom.
  reasoning_layer_used: POB lexical decisions for proximity, direction, fire, and kingdom
  rationale: “Anyone close” is more natural common English, and two sentences make the contrast easier to follow.
