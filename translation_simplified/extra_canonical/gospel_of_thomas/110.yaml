translation:
  language: en
  text: Jesus said, “Anyone who has found the world[b] and become rich[a] should give up the world.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “become great or prominent.”
    reason: lexical_alternative
  - marker: b
    text: A preposition before the first “world” is restored where the manuscript has a small gap.
    reason: source_note
simplification_decisions:
- pob_phrase: Whoever has found the world and become wealthy
  simplified_phrase: Anyone who has found the world and become rich
  preserved_meaning: The saying addresses any person who has found the world and reached a state of wealth.
  reasoning_layer_used: POB lexical decisions for the generic relative construction, perfect aspect, and ⲣⲣⲙⲙⲁⲟ
  rationale: “Anyone” and “rich” express the same sense in more common English.
- pob_phrase: let that one renounce the world
  simplified_phrase: should give up the world
  preserved_meaning: Jesus directs that person to reject attachment to the world.
  reasoning_layer_used: POB lexical decisions for the jussive ⲙⲁⲣⲉ and ethical sense of ⲁⲣⲛⲁ
  rationale: “Should give up” clearly conveys the injunction without adding a stronger claim of necessity.
translation_notes:
  risk_flags:
  - risk: “Give up” may sound less formal than “renounce.”
    mitigation: The wording still conveys ethical rejection in clear common English.
  - risk: “Rich” does not display the possible sense “great or prominent.”
    mitigation: Footnote a preserves the lexical alternative.
