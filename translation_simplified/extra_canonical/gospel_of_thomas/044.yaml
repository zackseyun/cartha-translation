base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/gospel_of_thomas/044.yaml
  text: Jesus said, "Whoever blasphemes against the Father will be forgiven, and whoever blasphemes against the Son will be forgiven. But whoever blasphemes against the Holy Spirit will not be forgiven, neither on earth nor in heaven."
  footnotes:
  - marker: blasphemes
    text: The Coptic spelling ⲡⲉⲧⲁϫⲉⲟⲩⲁ is a reduced form of the future relative ⲡⲉⲧⲛⲁϫⲓⲟⲩⲁ ('the one who will blaspheme').
    reason: dialect_note
  - marker: will be forgiven
    text: The Coptic uses the active third-person plural ('they will forgive him') as a standard circumlocution for the passive.
    reason: register_note
  - marker: neither on earth nor in heaven
    text: Thomas replaces the temporal/eschatological framework of the synoptic parallel (Matthew 12:32, 'neither in this age nor in the age to come') with a spatial/cosmic framework ('neither on earth nor in heaven'), reflecting its realized, non-apocalyptic theology.
    reason: theological_note
  revision_pass:
    model: gpt-5.4-mini
    timestamp: '2026-05-03T07:41:47Z'
    unchanged: false
    changes_summary: Removed the bracketed editorial artifacts and smoothed the opening so it reads naturally while preserving the repeated blasphemes/will be forgiven clauses and the final earth/heaven phrase.
translation:
  language: en
  text: Jesus said, “Anyone who blasphemes the Father—that is, speaks evil against him—will be forgiven. Anyone who blasphemes the Son will also be forgiven. But anyone who blasphemes the Holy Spirit will not be forgiven, either on earth or in heaven.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Whoever blasphemes against the Father
  simplified_phrase: Anyone who blasphemes the Father—that is, speaks evil against him
  preserved_meaning: Blasphemy remains a serious act of hostile speech against the Father.
  reasoning_layer_used: POB lexical decision for ϫⲓⲟⲩⲁ
  rationale: The key term is retained and immediately explained in common English.
- pob_phrase: and whoever blasphemes against the Son will be forgiven
  simplified_phrase: Anyone who blasphemes the Son will also be forgiven
  preserved_meaning: The separate statement about the Son and its promise of forgiveness remain explicit.
  reasoning_layer_used: POB translation and source clause structure
  rationale: A new sentence and “also” make the repeated parallel easier to follow.
- pob_phrase: neither on earth nor in heaven
  simplified_phrase: either on earth or in heaven
  preserved_meaning: Forgiveness is denied in both parts of the source's spatial and cosmic pairing.
  reasoning_layer_used: POB theological decision on spatial rather than temporal language
  rationale: The natural negative construction preserves earth and heaven without changing them into periods of time.
interpretive_expansions:
- pob_phrase: blasphemes against the Father
  rendering: blasphemes the Father—that is, speaks evil against him
  claim: Here “blasphemes” refers to speaking evil against the named divine person.
  evidence:
  - The POB lexical rationale defines ϫⲓⲟⲩⲁ as “to blaspheme” or “to curse.”
  - The POB lists “speaks against” as a lexical alternative.
  confidence: high
  alternatives_preserved:
  - curses
  - speaks against
translation_notes:
  risk_flags:
  - risk: The explanatory gloss could sound broader than the technical term “blasphemes.”
    mitigation: The main text retains “blasphemes” as the controlling term.
  - risk: Readers may import Matthew’s temporal wording into the final phrase.
    mitigation: The translation preserves Thomas’s explicit spatial pair, “earth” and “heaven.”
