translation:
  language: en
  text: Jesus said, “Blessed is the person who has struggled.[a] That person has found life.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Struggled” can include both hard work and suffering.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: who has labored
  simplified_phrase: who has struggled
  preserved_meaning: The person has experienced exertion, hardship, or distress.
  reasoning_layer_used: POB lexical decision for ϩⲓⲥⲉ
  rationale: “Struggled” conveys the source word’s broad range in natural modern English.
- pob_phrase: he has found life
  simplified_phrase: That person has found life
  preserved_meaning: The same person who struggled is the one who found life.
  reasoning_layer_used: Applied revision and POB lexical decisions for ϩⲉ and ⲉⲡⲱⲛϩ
  rationale: “That person” avoids a male-specific pronoun without inventing source emphasis.
translation_notes:
  risk_flags:
