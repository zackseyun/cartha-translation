base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/gospel_of_thomas/088.yaml
  text: Jesus said[a], "The angels and the prophets will come to you, and they will give you what belongs to you. And you, in turn, give them what is in your hands, and say to yourselves[b], 'On what day will they come and take what is theirs?'"
  footnotes:
  - marker: a
    text: Literally 'the things which you have' (ⲛ̄ⲛⲉⲧⲉⲩⲛ̄ⲧⲏⲧⲛ̄ⲥⲉ).
    reason: lexical_alternative
    anchor_ref: what belongs to you
  - marker: b
    text: The Coptic form ⲛⲉⲧⲛ̄ⲧⲟⲧ⳿ⲧⲏⲛⲉ uses the regional/Lycopolitan suffix ⲧⲏⲛⲉ for the second-person plural, rather than the standard Sahidic ⲧⲏⲩⲧⲛ.
    reason: dialect_note
    anchor_ref: what is in your hands
