    unchanged: true
    changes_summary: No changes needed.
translation:
  language: en
  text: Jesus said, “The angels and the prophets will come to you. They will give you what is yours. For your part, give them what is in your hands. Ask yourselves, ‘When will they come to take what is theirs?’”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: what belongs to you
  simplified_phrase: what is yours
  preserved_meaning: The wording preserves the contrast between what is yours and what is theirs.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: The shorter possessive wording makes the reciprocal exchange immediately clear.
- pob_phrase: And you, in turn
  simplified_phrase: For your part
  preserved_meaning: The disciples are responsible for the corresponding act of giving.
  reasoning_layer_used: POB lexical decision for ϩⲱⲧ̂ⲧⲏⲩⲧⲛ̄
  rationale: This natural phrase preserves the emphasis on their part in the exchange.
- pob_phrase: give them what is in your hands
  simplified_phrase: give them what is in your hands
  preserved_meaning: The physical image of something held in the hands remains intact.
  reasoning_layer_used: POB lexical decision for ⲛⲉⲧⲛ̄ⲧⲟⲧ⳿ⲧⲏⲛⲉ
  rationale: The concrete hand image is already clear and should not be flattened to possession alone.
interpretive_expansions:
- pob_phrase: say to yourselves
  rendering: Ask yourselves
  claim: The words spoken to themselves form a self-directed question.
  evidence:
  - The immediately following quotation is an explicit question.
  confidence: high
  alternatives_preserved:
  - say to yourselves
translation_notes:
  risk_flags:
  - risk: The saying does not identify what the exchanged possessions represent.
    mitigation: The translation keeps the reciprocal language without supplying an interpretation.
