translation:
  language: en
  text: Jesus said, “Woe to the flesh that relies on the soul; woe to the soul that relies on the flesh.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Soul” can also mean “life” or “self,” but “soul” preserves the saying’s sharp contrast with “flesh.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: depends on
  simplified_phrase: relies on
  preserved_meaning: Each side is condemned for depending on the other.
  reasoning_layer_used: POB lexical decision for ⲉⲓϣⲉ
  rationale: “Relies on” expresses functional dependence in familiar English.
- pob_phrase: the flesh that depends on the soul; woe to the soul that depends on the flesh
  simplified_phrase: the flesh that relies on the soul; woe to the soul that relies on the flesh
  preserved_meaning: The relative construction and balanced reversal remain intact.
  reasoning_layer_used: POB demonstrative decision and source parallelism
  rationale: Repeating “that relies on” preserves the saying’s direct parallel structure.
translation_notes:
  risk_flags:
  - risk: Modern readers may give “soul” only one narrow theological meaning.
    mitigation: The footnote preserves the possible senses “life” and “self.”
