base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/gospel_of_thomas/009.yaml
  text: 'Jesus said, "Behold, the sower went out; he filled his hand and cast seed. Some indeed fell on the path; the birds came and gathered them. Others fell on the rock, and they did not cast root down to the ground, and they did not send ears of grain up to the sky. And others fell on the thorns; they gathered them, choked the seed, and the worm ate them. And others fell on the good ground, and it gave good fruit up to the sky: it yielded sixty measures and one hundred twenty measures."'
  footnotes:
  - marker: he filled his hand
    text: Thomas adds this physical detail of the sower filling his hand, which is absent from the synoptic parallels.
    reason: textual_variant
  - marker: they gathered them
    text: Thomas uses the verb ⲕⲱⲧϥ ('gather, pluck') rather than 'devour' as found in the canonical gospels.
    reason: textual_variant
  - marker: cast root down... send ears of grain up
    text: This vertical imagery (down to the ground, up to the sky) is unique to Thomas's version of the parable.
    reason: textual_variant
  - marker: the worm ate them
    text: A detail unique to Thomas, adding an extra layer of destruction to the seed among the thorns.
    reason: textual_variant
  - marker: sixty measures and one hundred twenty measures
    text: Coptic ⲉⲥⲟⲧⲉ means 'measure' or 'yield'. Thomas diverges from the synoptic thirty/sixty/hundredfold, using specific measures and doubling the sixty to one hundred twenty.
    reason: textual_variant
  revision_pass:
    model: gpt-5.4-mini
    timestamp: '2026-05-03T07:41:46Z'
    unchanged: false
    changes_summary: Smoothed the opening punctuation, removed the bracketed editorial markers from the main text, and clarified the sower’s action as casting seed while preserving the established Thomas-specific renderings and unique imagery.
translation:
  language: en
  text: Jesus said, “Look, a sower went out to sow. He filled his hand with seed and scattered it. Some seed fell on the path, and the birds came and gathered it. Other seed fell on rock. It did not put roots down into the soil or send heads of grain up toward the sky. Other seed fell on thorns. The thorns gathered it, choked the seed, and a worm ate it. Still other seed fell on good soil. The soil produced good fruit up toward the sky, yielding sixty measures and one hundred twenty measures.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Measures” may also mean “yield”; Thomas gives sixty and one hundred twenty rather than the numbers in the canonical Gospel parallels.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the sower went out; he filled his hand and cast seed
  simplified_phrase: a sower went out to sow. He filled his hand with seed and scattered it
  preserved_meaning: The sower takes a handful of seed and casts it.
  reasoning_layer_used: POB revision and Thomas-specific textual detail
  rationale: Two short sentences clarify the action while retaining the distinctive filled-hand detail.
- pob_phrase: did not cast root down to the ground, and they did not send ears of grain up to the sky
  simplified_phrase: did not put roots down into the soil or send heads of grain up toward the sky
  preserved_meaning: The seed failed to grow both downward and upward.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: Common plant language preserves Thomas’s vertical imagery.
- pob_phrase: the good ground, and it gave good fruit up to the sky
  simplified_phrase: good soil. The soil produced good fruit up toward the sky
  preserved_meaning: The good soil bears fruit upward toward the sky.
  reasoning_layer_used: POB text and anti-harmonization decision
  rationale: The revision keeps the upward direction attached to the fruit and preserves the soil as the agent.
interpretive_expansions:
- pob_phrase: the sower went out
  rendering: a sower went out to sow
  claim: The sower went out for the purpose of sowing.
  evidence:
  - The next action is filling his hand and scattering seed.
  confidence: high
  alternatives_preserved:
  - a sower went out
- pob_phrase: they gathered them, choked the seed
  rendering: The thorns gathered it, choked the seed
  claim: The thorns are the agents that gather and choke the seed.
  evidence:
  - The thorns are the nearest plural agent in the immediate clause.
  confidence: moderate
  alternatives_preserved:
  - they gathered it
  - the thorns plucked it
translation_notes:
  risk_flags:
  - risk: Naming the thorns as the agents resolves the POB pronoun’s grammatical ambiguity.
    mitigation: The immediate context supports this reading, while the unusual action “gathered” remains unchanged.
  - risk: “Measures” remains an unfamiliar and somewhat ambiguous yield expression.
    mitigation: The footnote explains its lexical range without harmonizing Thomas’s numbers.
