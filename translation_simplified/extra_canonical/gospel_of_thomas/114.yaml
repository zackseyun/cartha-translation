translation:
  language: en
  text: Simon Peter said to them, “Mary should leave our group, because the female is not worthy of life.” Jesus said, “Look, I myself will lead her and make her male so that she too may become a living spirit like you males. Every female who makes herself male will enter the kingdom of the heavens.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: Let Mary go out from among us
  simplified_phrase: Mary should leave our group
  preserved_meaning: Peter demands that Mary leave those gathered with him without making the jussive express absolute necessity.
  reasoning_layer_used: POB lexical decisions for the jussive verb and “from among us”
  rationale: This wording makes the group setting clear while preserving the force of the jussive.
- pob_phrase: so that I will make her male, so that she too may become
  simplified_phrase: and make her male so that she too may become
  preserved_meaning: Jesus presents making Mary male as directed toward her becoming a living spirit like the males present.
  reasoning_layer_used: POB lexical decisions for “make … male,” “living spirit,” and plural “you”
  rationale: The streamlined clause keeps the purpose relationship and the saying’s stark contrast.
translation_notes:
  risk_flags:
  - risk: The saying’s stark sex-based language may sound more straightforward than symbolic interpretations propose.
    mitigation: The draft preserves the POB wording without imposing an undocumented interpretation.
  - risk: “Kingdom of the heavens” is less natural than “kingdom of heaven.”
    mitigation: The plural is retained because the POB deliberately preserves the Coptic expression.
