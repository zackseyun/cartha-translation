translation:
  language: en
  text: A woman in the crowd said to him, “Blessed is the womb that gave birth to you and the breasts that nursed you.” He answered her, “Blessed are those who have heard the Father’s word and have faithfully kept it. For days are coming when you will say, ‘Blessed is the womb that never conceived and the breasts that never gave milk.’”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: A woman said to him in the crowd
  simplified_phrase: A woman in the crowd said to him
  preserved_meaning: An unspecified woman speaks to him from within the crowd.
  reasoning_layer_used: POB lexical decisions for ⲟⲩⲥϩⲓⲙⲉ and ⲙⲏⲏϣⲉ
  rationale: Natural English identifies where the woman is before reporting her speech.
- pob_phrase: the womb that bore you
  simplified_phrase: the womb that gave birth to you
  preserved_meaning: The blessing refers specifically to the womb involved in his birth.
  reasoning_layer_used: POB lexical decision for ϥⲓ ϩⲁ and grounding review
  rationale: “Gave birth to you” clearly expresses the audited birth action and remains distinct from conception.
- pob_phrase: the word of the Father
  simplified_phrase: the Father’s word
  preserved_meaning: Those who heard the Father’s word and kept it are called blessed.
  reasoning_layer_used: POB lexical decisions for ⲡⲗⲟⲅⲟⲥ and ⲡⲉⲓⲱⲧ
  rationale: The possessive form is more natural while retaining “word” and the title “Father.”
interpretive_expansions:
- pob_phrase: have kept it in truth
  rendering: have faithfully kept it
  claim: Their keeping of the Father’s word is genuine and faithful.
  evidence:
  - POB permits “truly kept it” and lists “in sincerity” as an alternative.
  - The grounding review approved “faithfully kept it” as a clear expression of manner.
  confidence: moderate
  alternatives_preserved:
  - have truly kept it
  - have kept it in sincerity
  - have guarded it
translation_notes:
  risk_flags:
  - risk: “Faithfully” may suggest sustained obedience more directly than the literal phrase “in truth.”
    mitigation: The wording stays within the POB’s documented senses of truly or sincerely keeping the word.
