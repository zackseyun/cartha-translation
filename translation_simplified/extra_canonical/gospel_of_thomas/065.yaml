base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/gospel_of_thomas/065.yaml
  text: He said[1], "A good man had a vineyard. He gave it to some farmers so that they would work it and he would receive its fruit from them. He sent his slave so that the farmers would give him the fruit of the vineyard. They seized his slave and beat him; they almost killed him. The slave went and told his master. His master said, 'Perhaps he did not know them.' He sent another slave[2]. The farmers beat the other one. Then the master sent his son. He said, 'Perhaps they will respect my son.' Those farmers, since they knew that he was the heir of the vineyard, seized him and killed him. Whoever has ears[3], let him hear."
  footnotes:
  - marker: '1'
    text: The manuscript reads ⲛⲭⲣ̣ⲏ̣[ⲥⲧⲟ]ⲥ̣, restored as the Greek loanword χρηστός (chrestos, 'good'). Some scholars suggest it may be an iotacism for χρήστης (chrestes, 'creditor' or 'usurer'), which would fit the context of an absentee landlord.
    reason: textual_variant
  - marker: '2'
    text: Literally 'it was another little and they kill him' (ⲛⲉⲕⲉⲕⲟⲩⲉⲓ ⲡⲉ ⲛⲥⲉⲙⲟⲟⲩⲧϥ), a Coptic idiom for 'almost'.
    reason: lexical_alternative
  - marker: '3'
    text: 'The Coptic literally reads ''he did not know them'' (ⲙⲡⲉϥⲥⲟⲩⲱⲛⲟⲩ). Many translators emend this to ''they did not know him'' (ⲙⲡⲟⲩⲥⲟⲩⲱⲛϥ) to match the expected logic of the parable, but the manuscript reading offers a coherent alternative: the master assumes the servant went to the wrong farmers.'
    reason: textual_variant
  revision_pass:
    model: gpt-5.4-mini
    timestamp: '2026-05-03T07:41:48Z'
    unchanged: false
    changes_summary: Changed both occurrences of "servant" to "slave" for lexical consistency and to avoid softening the source term.
translation:
  language: en
  text: He said, “A good man[1] owned a vineyard. He put some farmers in charge of it. They were to work the vineyard and give him its produce. He sent his servant to collect the vineyard’s produce from them. But the farmers seized the servant and beat him, nearly killing him. The servant went and told his master. The master said, ‘Perhaps he did not know them.’[2] So he sent another servant, and the farmers beat him too. Then the master sent his son, saying, ‘Perhaps they will respect my son.’ But the farmers knew that the son was the vineyard’s heir, so they seized him and killed him. Whoever has ears, let him hear.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: The damaged manuscript most likely reads “good,” though some scholars suggest “creditor” or “usurer.”
    reason: textual_variant
  - marker: '2'
    text: The manuscript reads “he did not know them”; many translations change this to “they did not know him,” but the wording here preserves the manuscript.
    reason: textual_variant
simplification_decisions:
- pob_phrase: He gave it to some farmers so that they would work it and he would receive its fruit from them.
  simplified_phrase: He put some farmers in charge of it. They were to work the vineyard and give him its produce.
  preserved_meaning: The farmers cultivate the vineyard and owe its yield to the owner.
  reasoning_layer_used: POB text and the lexical decision for ⲟⲩⲟⲉⲓⲉ as “farmers.”
  rationale: Two direct sentences make the working arrangement easier to follow.
- pob_phrase: so that the farmers would give him the fruit of the vineyard
  simplified_phrase: to collect the vineyard’s produce from them
  preserved_meaning: The slave is sent to receive the vineyard’s yield for the owner.
  reasoning_layer_used: POB narrative logic and its rendering of ⲕⲁⲣⲡⲟⲥ as “fruit.”
  rationale: “Produce” clearly expresses the agricultural sense of “fruit” in this setting.
- pob_phrase: they almost killed him
  simplified_phrase: nearly killing him
  preserved_meaning: The beating brought the slave close to death without killing him.
  reasoning_layer_used: POB lexical decision that the Coptic idiom means “almost.”
  rationale: The participial wording connects the danger directly to the beating.
translation_notes:
  risk_flags:
  - risk: The damaged description of the vineyard owner may mean “creditor” or “usurer” rather than “good man.”
    mitigation: The main text follows POB’s chosen reading and the footnote preserves the alternative.
  - risk: “He did not know them” sounds unexpected and is often emended by translators.
    mitigation: The manuscript’s pronouns remain unchanged and the footnote explains the issue.
