translation:
  language: en
  text: Jesus says, “Know what is right before your face, and what is hidden from you will be revealed to you. For there is nothing hidden that will not come to light.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek witness POxy 654 adds, “and nothing buried that will not be raised up.” This translation follows the Nag Hammadi Coptic, which does not include that clause.
    reason: textual_variant
simplification_decisions:
- pob_phrase: what is before your face
  simplified_phrase: what is right before your face
  preserved_meaning: The concrete image of something directly in front of a person remains intact.
  reasoning_layer_used: POB lexical decision and cultural note on the Coptic idiom
  rationale: “Right” makes the spatial idiom immediately clear while retaining the image of the face.
- pob_phrase: will be uncovered to you
  simplified_phrase: will be revealed to you
  preserved_meaning: What is hidden will be disclosed directly to the hearer.
  reasoning_layer_used: POB lexical decision for ϭⲱⲗⲡ ⲉⲃⲟⲗ and recipient phrase ⲛⲁⲛⲧⲟⲕ
  rationale: “Revealed to you” is natural English and preserves the source’s recipient relation.
- pob_phrase: will be made manifest
  simplified_phrase: will come to light
  preserved_meaning: Nothing hidden will remain concealed.
  reasoning_layer_used: POB lexical decision for ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  rationale: “Come to light” is a documented plain-English alternative that preserves the disclosure image.
interpretive_expansions:
- pob_phrase: before your face
  rendering: right before your face
  claim: The saying refers to what is directly in front of the hearer.
  evidence:
  - The POB cultural note says the Coptic idiom means “right in front of you.”
  - The lexical rationale identifies the phrase as spatial.
  confidence: high
  alternatives_preserved:
  - what is before your face
  - what is in front of you
translation_notes:
  risk_flags:
  - risk: “Revealed” does not retain the literal physical metaphor of uncovering.
    mitigation: The following phrase “come to light” preserves the saying’s concrete disclosure imagery.
