base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/gospel_of_thomas/046.yaml
  text: 'Jesus said[1], "From Adam until John the Baptist, among the offspring of women, there is no one higher than John the Baptist, so that his eyes will not be cast down. But I have said: whoever among you becomes a child will know the kingdom[4][3][2], and will become higher than John."'
  footnotes:
  - marker: '1'
    text: The Coptic ⲛⲟⲩⲱϭⲡ is a contraction of the negative Third Future ⲛⲛⲉⲩⲟⲩⲱϭⲡ ('they will not be cast down', referring to the plural 'eyes').
    reason: dialect_note
  - marker: '2'
    text: Grammatically, 'his' refers to John the Baptist. Because there is no one higher than him, he does not need to lower his eyes in deference to anyone.
    reason: cultural_note
  - marker: '3'
    text: The preposition ⲁ in ⲁ ⲓⲱϩⲁⲛⲛⲏⲥ ('than John') is a phonetic or dialectal variant of the comparative ⲉ ('than').
    reason: dialect_note
  - marker: '4'
    text: Compare with Matthew 11:11 and Luke 7:28. Thomas adds 'From Adam' and 'so that his eyes will not be cast down,' and shifts the second half from 'the least in the kingdom of heaven is greater' to 'whoever among you becomes a child will know the kingdom, and will become higher.'
    reason: cross_reference
  revision_pass:
    model: gpt-5.4-mini
    timestamp: '2026-05-03T07:41:47Z'
    unchanged: true
    changes_summary: No changes needed.
translation:
  language: en
  text: 'Jesus said, “From Adam to John the Baptist, no one born of a woman has stood higher than John. He does not have to lower his eyes before anyone. But I have said this: Whoever among you becomes a child will know the kingdom and will become higher than John.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Becomes a child” may also be translated “becomes little” or “becomes a little one.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: among the offspring of women
  simplified_phrase: no one born of a woman
  preserved_meaning: The statement includes all people born from women.
  reasoning_layer_used: lexical decision for ϫⲡⲟ
  rationale: This replaces the formal word “offspring” with a familiar expression.
- pob_phrase: so that his eyes will not be cast down
  simplified_phrase: He does not have to lower his eyes before anyone
  preserved_meaning: John need not lower his eyes in deference because no one ranks above him.
  reasoning_layer_used: POB cultural footnote and lexical decision for ⲟⲩⲱϭⲡ
  rationale: The wording makes the Coptic eye-lowering image understandable while retaining it.
- pob_phrase: whoever among you becomes a child will know the kingdom, and will become higher than John
  simplified_phrase: Whoever among you becomes a child will know the kingdom and will become higher than John
  preserved_meaning: Becoming a child leads to knowing the kingdom and attaining a rank above John.
  reasoning_layer_used: theological decision for ⲕⲟⲩⲉⲓ
  rationale: The key terms remain because they carry the saying’s central theological claims.
interpretive_expansions:
- pob_phrase: his eyes will not be cast down
  rendering: He does not have to lower his eyes before anyone
  claim: The lowered eyes signify deference to someone of higher rank.
  evidence:
  - The POB cultural note explicitly explains the gesture as deference.
  - The preceding clause says no one is higher than John.
  confidence: high
  alternatives_preserved:
  - His eyes will not be cast down.
translation_notes:
  risk_flags:
  - risk: “Becomes a child” may be mistaken for a literal physical change.
    mitigation: The lexical-alternative footnote preserves “becomes little” without overriding the POB theological choice.
