translation:
  language: en
  text: Jesus said, “Many times you have wanted to hear the words I am telling you. There is no one else from whom you can hear them. Days will come when you will look for me, but you will not find me.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: desired to hear these words that I am saying to you
  simplified_phrase: wanted to hear the words I am telling you
  preserved_meaning: The hearers desire to hear the words Jesus is now speaking.
  reasoning_layer_used: Lexical decisions for “desire,” “hear,” and the durative “am saying.”
  rationale: Common verbs preserve the immediacy without adding a sense of obedience.
- pob_phrase: you have no other from whom to hear them
  simplified_phrase: There is no one else from whom you can hear them
  preserved_meaning: No other person is available as the source of these words.
  reasoning_layer_used: Lexical decisions for “no other” and “from whom.”
  rationale: This states the absence of another source without implying inability or prohibition.
- pob_phrase: There will be days when you will seek me
  simplified_phrase: Days will come when you will look for me
  preserved_meaning: A future time will come when the hearers seek Jesus.
  reasoning_layer_used: Future-existential and temporal-clause decisions.
  rationale: Natural English preserves both the coming days and the act of seeking.
