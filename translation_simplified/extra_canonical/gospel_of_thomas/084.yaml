base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/gospel_of_thomas/084.yaml
  text: Jesus said[a], "On the day you see your likeness, you rejoice. But whenever you see your images that came into being before you, which neither die nor become manifest—how much will you bear!"
  footnotes:
  - marker: a
    text: The Coptic uses the Greek loanword εἰκών (eikōn). The text contrasts the mortal 'likeness' (ⲉⲓⲛⲉ) with the pre-existent, immortal 'images' (ϩⲓⲕⲱⲛ).
    reason: theological_note
    anchor_ref: images
  - marker: b
    text: The Coptic ⲛ̄ⲧⲁϩϣⲱⲡⲉ uses a regional variant ϩ for the third-person plural pronoun ⲩ (ⲛⲧⲁ-ⲩ-ϣⲱⲡⲉ).
    reason: dialect_note
    anchor_ref: came into being
  - marker: c
    text: The Coptic ⲙⲁⲩⲙⲟⲩ and ⲙⲁⲩⲟⲩⲱⲛϩ use the prefix ⲙⲁ-, a regional variant of the negative habitual ⲙⲉⲣⲉ-.
    reason: dialect_note
    anchor_ref: neither die nor become manifest
  revision_pass:
    model: gpt-5.4-mini
    timestamp: '2026-05-03T07:41:48Z'
    unchanged: false
    changes_summary: Adjusted the temporal phrase to match the source more closely (“On the day you see”); removed the bracketed duplicate/garbled material so the clause reads cleanly while retaining all established lexical decisions.
translation:
  language: en
  text: Jesus said, “When you see your likeness, you rejoice. But when you see your images[a]—images that came into being before you and that neither die nor appear—how much will you have to endure!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The text uses different words for your present, mortal likeness and for the images that came into being before you and do not die.
    reason: source_note
simplification_decisions:
- pob_phrase: On the day you see your likeness
  simplified_phrase: When you see your likeness
  preserved_meaning: The phrase describes the occasion of seeing rather than meaning “today.”
  reasoning_layer_used: Applied revision and Coptic grammar
  rationale: “When” naturally expresses the general temporal sense.
- pob_phrase: become manifest
  simplified_phrase: appear
  preserved_meaning: The images do not become visible or disclosed.
  reasoning_layer_used: Lexical decision for ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ and grounding review
  rationale: “Appear” preserves the intransitive sense without implying a revealer.
- pob_phrase: how much will you bear
  simplified_phrase: how much will you have to endure
  preserved_meaning: Seeing these images will impose a great burden.
  reasoning_layer_used: Lexical decision for the idiom ϥⲓ ϩⲁ
  rationale: “Endure” communicates the burden-bearing idiom clearly.
translation_notes:
  risk_flags:
  - risk: “Images” may sound like ordinary pictures to modern readers.
    mitigation: The footnote preserves the documented contrast with the mortal likeness.
