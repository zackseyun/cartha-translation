translation:
  language: en
  text: His disciples said to him, “Twenty-four prophets[b] spoke in Israel, and every one of them spoke about you.[a]” He replied, “You have spoken about the dead, but you have left out the living one who is right here with you.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The manuscript wording may also be read “about your heart.”
    reason: textual_variant
  - marker: b
    text: The saying does not explain whether twenty-four is a traditional count of the prophets or a symbolic number.
    reason: cultural_note
simplification_decisions:
- pob_phrase: and they all spoke about you
  simplified_phrase: and every one of them spoke about you
  preserved_meaning: All twenty-four prophets are included without exception.
  reasoning_layer_used: POB lexical decision for the narrative past and source wording for “all.”
  rationale: The expanded wording makes the scope immediately clear.
- pob_phrase: You have left out the living one who is in your presence, and you have spoken about the dead.
  simplified_phrase: You have spoken about the dead, but you have left out the living one who is right here with you.
  preserved_meaning: The hearers focus on the dead while omitting the singular living one present among them.
  reasoning_layer_used: POB lexical decisions for “leave out,” “the living one,” “in your presence,” and “the dead.”
  rationale: Reversing the clauses and adding “but” makes the contrast easier to follow.
interpretive_expansions:
- pob_phrase: in your presence
  rendering: right here with you
  claim: The living one is presently and immediately among the hearers.
  evidence:
  - The source idiom means “before you” or “in your presence.”
  - The POB rationale identifies present proximity as the saying’s key contrast.
  confidence: high
  alternatives_preserved:
  - before you
  - in your presence
  - in front of you
translation_notes:
  risk_flags:
  - risk: The source may read “about your heart” rather than “about you.”
    mitigation: The main text follows POB’s normalized reading and preserves the alternative in footnote a.
  - risk: “Right here with you” is less formally worded than “in your presence.”
    mitigation: It preserves the source image of the living one being directly before the hearers.
