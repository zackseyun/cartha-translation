base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/gospel_of_thomas/016.yaml
  text: 'Jesus said[1], "Perhaps people think that I have come to cast peace upon the world, and they do not know that I have come to cast divisions upon the earth: fire, sword, war. For there will be five in a house: there will be three against two, and two against three, father against son, and son against father[3][2]. And they will stand as solitary ones."'
  footnotes:
  - marker: '1'
    text: The manuscript spells the infinitive 'to cast' as ⲁⲛⲟⲩϫⲉ instead of the standard Sahidic ⲉⲛⲟⲩϫⲉ, a common vowel interchange in this text.
    reason: dialect_note
  - marker: '2'
    text: Compare with Luke 12:51-53 and Matthew 10:34-35. Thomas shares the Synoptic themes of division and the sword but uniquely concludes with the fractured family members standing as 'solitary ones' (monachos).
    reason: cross_reference
  - marker: '3'
    text: Greek loanword monachos. In Thomas, this denotes not a later Christian monk, but a 'single one' or 'solitary'—one who has achieved spiritual unity and stands undivided, even when earthly family is fractured.
    reason: theological_note
  revision_pass:
    model: gpt-5.4-mini
    timestamp: '2026-05-03T07:41:46Z'
    unchanged: true
    changes_summary: No changes needed.
translation:
  language: en
  text: 'Jesus said, “Perhaps people think I have come to cast peace upon the world. But they do not know that I have come to cast divisions upon the earth—fire, sword, and war. For there will be five people in one household: three against two and two against three, father against son and son against father.[1] And they will stand as solitary ones.”[2]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: Compare Luke 12:51–53 and Matthew 10:34–35.
    reason: cross_reference
  - marker: '2'
    text: “Solitary ones” translates a Greek loanword that can mean “solitary” or “single ones”; it does not necessarily mean “monks” in the later Christian sense.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Perhaps people think that I have come
  simplified_phrase: Perhaps people think I have come
  preserved_meaning: People may mistakenly suppose that Jesus came to cast peace.
  reasoning_layer_used: POB lexical decision for ⲧⲁⲭⲁ
  rationale: The shorter clause preserves the source’s uncertainty in natural English.
- pob_phrase: 'For there will be five in a house: there will be three against two'
  simplified_phrase: 'For there will be five people in one household: three against two'
  preserved_meaning: A household of five will split into opposing groups of three and two.
  reasoning_layer_used: Applied numerical revision and source lines 36–2
  rationale: “Household” identifies the five as people while preserving the corrected number.
- pob_phrase: they will stand as solitary ones
  simplified_phrase: they will stand as solitary ones
  preserved_meaning: They will stand as solitary or single persons, without being identified anachronistically as monks.
  reasoning_layer_used: POB lexical and theological decisions for ⲙⲟⲛⲁⲭⲟⲥ
  rationale: The key term remains in the text, while the note preserves its lexical range.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “solitary ones” only as physical or social isolation.
    mitigation: The footnote gives the broader lexical range without making spiritual undividedness the only meaning.
  - risk: “Fire, sword, and war” may be read as a literal program of violence.
    mitigation: The translation preserves the source’s forceful images without deciding their intended mode.
