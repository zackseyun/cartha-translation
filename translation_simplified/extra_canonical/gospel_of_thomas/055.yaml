translation:
  language: en
  text: Jesus said, “Anyone who does not hate their father and mother cannot be my disciple. Anyone who does not hate their brothers and sisters,[a] and does not carry their cross as I do,[b] will not be worthy of me.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The manuscript reads “brothers and sisters”; a normalized analysis gives “son and daughter.” This translation follows the manuscript.
    reason: textual_variant
  - marker: b
    text: The phrase rendered “as I do” can also mean “in my way” or “in my manner”; it does not explicitly say “follow me.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Whoever does not hate his father and his mother cannot be my disciple; and whoever
  simplified_phrase: Anyone who does not hate their father and mother cannot be my disciple. Anyone
  preserved_meaning: The two conditions remain distinct, and the first still expresses inability to be Jesus’ disciple.
  reasoning_layer_used: POB grammar revision and lexical decisions
  rationale: Two sentences make the saying easier to follow without merging its clauses.
- pob_phrase: his father and his mother ... his brothers and his sisters ... his cross
  simplified_phrase: their father and mother ... their brothers and sisters ... their cross
  preserved_meaning: Each statement still applies to any individual and retains every family relationship and the cross image.
  reasoning_layer_used: POB indefinite-relative and kinship decisions
  rationale: Singular “their” expresses the generic “anyone” naturally in modern English.
translation_notes:
  risk_flags:
  - risk: Modern readers may take “hate” as ordinary personal hostility rather than the saying’s severe demand.
    mitigation: Retain “hate” because the source uses a strong verb and the POB explicitly rejects softening it to “love less.”
  - risk: “As I do” may sound more explicit than the source’s compact phrase about Jesus’ way or manner.
    mitigation: A footnote preserves the lexical alternatives and notes that “follow” is not stated.
