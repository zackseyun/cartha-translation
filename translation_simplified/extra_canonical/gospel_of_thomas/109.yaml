base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/gospel_of_thomas/109.yaml
  text: Jesus said[1], "The kingdom is like a man who has a hidden treasure in his field, without knowing about it. And after he died, he left it to his son. The son did not know. He took that field and sold it. And the one who bought it came, and while he was plowing, he found the treasure[2]. He began to lend money at interest to whomever he wished."
  footnotes:
  - marker: '1'
    text: The parable in Thomas diverges significantly from the canonical parallel in Matthew 13:44. In Thomas, the original owner is unaware of the treasure, and it is the subsequent buyer who finds it and uses it to lend at interest.
    reason: cross_reference
  - marker: '2'
    text: Several words in this saying are restored from lacunas in the manuscript, but the restorations are standard and highly certain from the surviving letters and context.
    reason: textual_variant
  revision_pass:
    model: gpt-5.4-mini
    timestamp: '2026-05-03T07:41:49Z'
    unchanged: true
    changes_summary: No changes needed.
translation:
  language: en
  text: 'Jesus said,[1] “The kingdom is like this: A man owned a field where treasure lay hidden, but he did not know it was there. When he died, he left the field to his son. His son did not know about the treasure. He took possession of the field and sold it. The buyer came to the field and found the treasure while he was plowing. Then he began lending money at interest to anyone he chose.”[2]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: 'This saying differs from Matthew 13:44: the owner does not know about the treasure, and a later buyer finds it.'
    reason: cross_reference
  - marker: '2'
    text: Several words are restored where the manuscript is damaged, but the restorations are highly certain.
    reason: textual_variant
simplification_decisions:
- pob_phrase: a man who has a hidden treasure in his field, without knowing about it
  simplified_phrase: A man owned a field where treasure lay hidden, but he did not know it was there
  preserved_meaning: The treasure is hidden in the man’s field and unknown to him.
  reasoning_layer_used: POB lexical decisions and applied revision
  rationale: The rewrite clearly distinguishes ownership of the field from knowledge of the treasure.
- pob_phrase: He took that field and sold it
  simplified_phrase: He took possession of the field and sold it
  preserved_meaning: The son assumes possession of the inherited field before selling it.
  reasoning_layer_used: POB lexical decision for ϥⲓ
  rationale: “Took possession” expresses the narrative action naturally without implying a new cause for the sale.
- pob_phrase: the one who bought it came, and while he was plowing, he found the treasure
  simplified_phrase: The buyer came to the field and found the treasure while he was plowing
  preserved_meaning: The buyer discovers the treasure while working the field.
  reasoning_layer_used: POB applied revision on the circumstantial clause
  rationale: Natural clause order preserves that the discovery occurred during plowing.
interpretive_expansions:
- pob_phrase: he left it to his son
  rendering: he left the field to his son
  claim: The inherited object is identified as the field.
  evidence:
  - The son next takes possession of and sells that field.
  - The treasure remains unknown to both father and son.
  confidence: high
translation_notes:
  risk_flags:
  - risk: Identifying “it” as the field resolves a pronoun that is less explicit in the POB wording.
    mitigation: The following action identifies the field as what the son possesses and sells.
  - risk: Lending at interest may sound morally approved to modern readers.
    mitigation: The wording preserves the explicit source action without adding approval.
