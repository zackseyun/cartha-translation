  reasoning_layer_used: Applied revision and POB lexical decision for ⲟⲩⲉϩⲥⲁϩⲛⲉ
  rationale: The wording keeps the concrete financial detail and avoids adding necessity.
- pob_phrase: Those whom you will find, bring them, so that they may dine
  simplified_phrase: Bring whoever you find, so that they may dine
  preserved_meaning: The servant must bring people found in the streets to the dinner.
  reasoning_layer_used: POB translation and banquet context
  rationale: Natural clause order clarifies the command without saying they dine with the master.
