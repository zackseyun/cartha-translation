translation:
  language: en
  text: Jesus said, “A king’s reign[a] is like a shepherd who had a hundred sheep. One of them—the great one[b]—wandered away. He left the ninety-nine and searched for that one until he found it. After working hard, he said to the sheep, ‘I love you[c] more than the ninety-nine.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally “kingship,” meaning the rule or reign of a king rather than a territory.
    reason: lexical_alternative
  - marker: b
    text: “The great one” may also mean “the largest one.”
    reason: lexical_alternative
  - marker: c
    text: The word translated “love” can also mean “prefer.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The kingship
  simplified_phrase: A king’s reign
  preserved_meaning: The comparison concerns royal rule rather than primarily a territory.
  reasoning_layer_used: POB lexical decision for ⲡⲙⲛⲧⲣⲣⲟ
  rationale: This wording expresses the abstract idea of kingship in familiar English.
- pob_phrase: went astray
  simplified_phrase: wandered away
  preserved_meaning: The sheep strayed from its proper place in the flock.
  reasoning_layer_used: POB lexical decision for ⲥⲱⲣⲙ
  rationale: This natural pastoral wording preserves the image of straying.
- pob_phrase: After he had toiled
  simplified_phrase: After working hard
  preserved_meaning: The shepherd exerted himself before speaking to the sheep.
  reasoning_layer_used: POB lexical decision for ϩⲓⲥⲉ and footnote h
  rationale: This common phrase clearly conveys the effort involved in the search.
translation_notes:
  risk_flags:
  - risk: “Great one” may suggest importance rather than physical size.
    mitigation: Footnote [b] preserves “largest” as a possible meaning.
  - risk: “Love” may obscure the possible comparative sense “prefer.”
    mitigation: Footnote [c] preserves that lexical alternative.
