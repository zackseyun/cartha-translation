base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/gospel_of_thomas/097.yaml
  text: Jesus said, "The kingdom of the Father is like a woman carrying a jar full of meal. While she was walking on the road, still far away, the handle of the jar broke. The meal emptied out behind her on the road. She did not know it; she had not noticed the trouble. When she reached her house, she set the jar down and found it empty."
  footnotes:
  - marker: handle
    text: Literally 'ear' (ⲙⲁⲁϫⲉ).
    reason: lexical_alternative
  - marker: trouble
    text: Or 'problem', 'toil' (ϩⲓⲥⲉ).
    reason: lexical_alternative
  revision_pass:
    model: gpt-5.4-mini
    timestamp: '2026-05-03T07:41:48Z'
    unchanged: false
    changes_summary: Removed the stray bracketed labels from the verse text and punctuation, while preserving the draft’s wording and the established lexical decisions.
translation:
  language: en
  text: Jesus said, “The kingdom of the Father is like a woman carrying a jar full of grain meal along a road. While she was still far away, the jar’s handle broke, and the meal spilled out behind her on the road. She did not realize what had happened or notice the problem. When she reached her house, she set down the jar and discovered that it was empty.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: a woman carrying a jar full of meal. While she was walking on the road
  simplified_phrase: a woman carrying a jar full of grain meal along a road
  preserved_meaning: The woman travels on a road while carrying a jar filled with meal.
  reasoning_layer_used: POB text and lexical decisions for ϭⲗⲙⲉⲉⲓ and ⲛⲟⲉⲓⲧ
  rationale: The clauses are combined into a natural English description without removing the jar, its contents, or the road.
- pob_phrase: The meal emptied out behind her on the road.
  simplified_phrase: the meal spilled out behind her on the road
  preserved_meaning: The broken handle leads to the jar’s contents falling onto the road behind her.
  reasoning_layer_used: POB lexical decision for ϣⲟⲩⲟ
  rationale: “Spilled out” clearly expresses the contextual sense of the documented verb.
- pob_phrase: She did not know it; she had not noticed the trouble.
  simplified_phrase: She did not realize what had happened or notice the problem.
  preserved_meaning: The woman remains unaware both of the event and of the resulting mishap.
  reasoning_layer_used: POB text, revision rationale, and lexical decision for ϩⲓⲥⲉ
  rationale: The referent of “it” is clarified while the distinct idea of the problem is retained.
interpretive_expansions:
- pob_phrase: meal
  rendering: grain meal
  claim: The jar contains ground grain rather than a prepared meal.
  evidence:
  - The POB lexical record defines ⲛⲟⲉⲓⲧ as “flour, meal.”
  confidence: high
  alternatives_preserved:
  - meal
  - flour
translation_notes:
  risk_flags:
  - risk: “Still far away” does not identify what the woman is far from.
    mitigation: The wording preserves the POB ambiguity rather than supplying an unstated destination.
