translation:
  language: en
  text: Jesus said, “They[a] will give to anyone who has something in hand. But from anyone who does not have, they will take even the little he has.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “They” does not name a particular group; the Coptic uses it impersonally for what will be given or taken.
    reason: source_note
simplification_decisions:
- pob_phrase: Whoever has something in his hand, they will give to him
  simplified_phrase: They will give to anyone who has something in hand
  preserved_meaning: A person who possesses something will be given something, while the hand image and unspecified gift remain.
  reasoning_layer_used: POB lexical decisions for possession, hand, and the impersonal third-person plural
  rationale: Reordering the clause makes the impersonal “they” easier to follow without adding what is given.
- pob_phrase: whoever does not have, they will take even the little that he has from him
  simplified_phrase: from anyone who does not have, they will take even the little he has
  preserved_meaning: The unspecified lack and paradoxical removal of a small remaining possession are both retained.
  reasoning_layer_used: POB lexical decisions and applied revision preserving “they,” “even,” and “the little”
  rationale: The shorter wording keeps the deliberate ambiguity while making the loss easy to follow.
translation_notes:
  risk_flags:
  - risk: The impersonal “they” may sound like a specific unnamed group in English.
    mitigation: The footnote explains that the Coptic construction does not identify a particular group.
