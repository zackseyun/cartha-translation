base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/gospel_of_thomas/073.yaml
  text: Jesus said[1], "The harvest indeed is plentiful, but the workers are few. Beseech the master, then[2], that he may send out workers to the harvest."
  footnotes:
  - marker: '1'
    text: Unlike the canonical parallels in Matthew 9:38 and Luke 10:2, Thomas lacks the phrase 'of the harvest' after 'master' (or 'Lord'), and lacks 'his' before the final 'harvest'.
    reason: textual_variant
  - marker: '2'
    text: The Coptic ⲡϫⲟⲉⲓⲥ (pjoeis) can be translated as 'the Lord' or 'the master'. In the context of an agricultural estate, 'master' is used here.
    reason: lexical_alternative
  revision_pass:
    model: gpt-5.4-mini
    timestamp: '2026-05-03T07:41:47Z'
    unchanged: true
    changes_summary: No changes needed.
translation:
  language: en
  text: Jesus said, “There is plenty to harvest, but only a few workers. So plead with the master[1] to send workers out to the harvest.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: The Coptic word may also be translated “the Lord”; “the master” fits the farming setting here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The harvest indeed is plentiful
  simplified_phrase: There is plenty to harvest
  preserved_meaning: The harvest is abundant and requires gathering.
  reasoning_layer_used: POB lexical decision for ⲡⲱϩⲥ and ⲛⲁϣⲱϥ
  rationale: The verbal form is more natural while retaining the harvest image.
- pob_phrase: Beseech the master, then
  simplified_phrase: So plead with the master
  preserved_meaning: The hearers are urged to make an earnest request to the estate master.
  reasoning_layer_used: Applied revision and POB lexical and theological decisions
  rationale: “Plead” expresses the source verb’s urgency in common modern English.
translation_notes:
  risk_flags:
  - risk: Readers may understand “master” only as a human estate owner and miss the possible title “Lord.”
    mitigation: The footnote preserves the documented lexical and theological ambiguity.
