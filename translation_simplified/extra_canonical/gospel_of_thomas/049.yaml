    unchanged: true
    changes_summary: No changes needed.
translation:
  language: en
  text: Jesus said, “Blessed are those who are solitary—spiritually undivided[a]—and chosen. You will find the kingdom, because you come from it and will return there.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Solitary” means spiritually single or undivided here, not a member of a later monastic institution.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Blessed are the solitary and chosen
  simplified_phrase: Blessed are those who are solitary—spiritually undivided—and chosen
  preserved_meaning: The blessed people are both spiritually solitary and chosen.
  reasoning_layer_used: POB lexical and theological decisions on ⲙⲟⲛⲁⲭⲟⲥ and the plural passive ⲉⲧⲥⲟⲧⲡ
  rationale: The recasting clarifies that the terms describe a plural group without changing “chosen” into an active choice.
- pob_phrase: For you are from it, and you will go there again
  simplified_phrase: because you come from it and will return there
  preserved_meaning: Their origin is the kingdom, and they will go back to it.
  reasoning_layer_used: POB theological decision on the kingdom as origin and return
  rationale: “Return” states the natural force of going there again in common English.
interpretive_expansions:
- pob_phrase: solitary
  rendering: solitary—spiritually undivided
  claim: The solitude in view is spiritual singleness or inner unity, not merely living alone.
  evidence:
  - The POB lexical rationale defines ⲙⲟⲛⲁⲭⲟⲥ as spiritual singleness and undividedness.
  - The POB theological rationale rejects the later institutional sense of “monk.”
  confidence: high
  alternatives_preserved:
  - solitary
  - single ones
translation_notes:
  risk_flags:
  - risk: “Solitary” may still suggest social isolation to modern readers.
    mitigation: The inline clarifier and footnote identify the intended spiritual sense.
  - risk: “Come from” may sound spatial even though the kingdom may be a present reality or state.
    mitigation: The wording preserves the POB’s origin-and-return language without defining the kingdom more narrowly.
