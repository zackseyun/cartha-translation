base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/gospel_of_thomas/077.yaml
  text: Jesus said, "I am the light that is over them all. I am the All. It is from me that the All came forth, and to me that the All reached. Split a piece of wood; I am there. Lift up the stone, and you will find me there."
  footnotes:
  - marker: reached
    text: 'The Coptic text features a deliberate wordplay here: the verb ''reached'' (ⲡⲱϩ, pōh) and the imperative ''split'' (ⲡⲱϩ, pōh) in the following sentence are identical in form.'
    reason: register_note
  - marker: Split a piece of wood
    text: In the Greek fragment P.Oxy. 1, the commands to lift the stone and split the wood appear in reverse order and are appended to the end of Saying 30.
    reason: textual_variant
  revision_pass:
    model: gpt-5.4-mini
    timestamp: '2026-05-03T07:41:48Z'
    unchanged: false
    changes_summary: Removed stray bracketed note text from the draft and normalized punctuation for readability while preserving the established lexical choices and the full source content.
translation:
  language: en
  text: Jesus said, “I am the light above all. I am the All—the whole of existence. I am the one from whom the All came forth, and I am the one the All reached.[a] Split a piece of wood, and I am there. Lift up the stone, and you will find me there.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In Coptic, the word translated “reached” sounds the same as the command translated “Split” in the next sentence.
    reason: source_note
  - marker: b
    text: A Greek fragment places the commands about the stone and wood in reverse order at the end of Saying 30.
    reason: textual_variant
simplification_decisions:
- pob_phrase: the light that is over them all
  simplified_phrase: the light above all
  preserved_meaning: Jesus identifies himself as the light set over all without limiting “all” to people or things.
  reasoning_layer_used: POB translation and source syntax
  rationale: The shorter wording removes an unclear pronoun while preserving the phrase’s broad scope.
- pob_phrase: It is from me that the All came forth, and to me that the All reached
  simplified_phrase: I am the one from whom the All came forth, and I am the one the All reached
  preserved_meaning: The wording keeps the Coptic emphasis on Jesus as both the origin and endpoint of the All.
  reasoning_layer_used: applied grammatical revision on the Second Perfect
  rationale: Recasting both clauses around “I am the one” makes the emphasis easier to follow.
- pob_phrase: Split a piece of wood; I am there
  simplified_phrase: Split a piece of wood, and I am there
  preserved_meaning: The command and the claim of presence within the wood remain distinct and forceful.
  reasoning_layer_used: POB lexical decisions for ⲡⲱϩ and ϣⲉ
  rationale: The added conjunction makes the relationship natural in modern English without weakening the image.
interpretive_expansions:
- pob_phrase: the All
  rendering: the All—the whole of existence
  claim: “The All” refers to the totality of existence rather than merely a group of people.
  evidence:
  - The lexical decision identifies ⲡⲧⲏⲣϥ as a substantive absolute meaning the totality of existence.
  - The theological decision requires capitalization because Jesus is identified with the All.
  confidence: high
  alternatives_preserved:
  - everything
  - the entirety
translation_notes:
  risk_flags:
  - risk: The explanatory phrase may sound more defined than the compact title “the All.”
    mitigation: The audited title remains in the text, and the explanation only states the POB lexical rationale.
