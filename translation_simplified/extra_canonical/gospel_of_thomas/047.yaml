    mitigation: The parallel about two masters supports simultaneity without assigning a narrower theology.
  - risk: The supplied cross-check reports major issues despite the later unchanged review.
    mitigation: The draft follows the adjudicated POB text and preserves all corrected wine, wineskin, and garment images.
