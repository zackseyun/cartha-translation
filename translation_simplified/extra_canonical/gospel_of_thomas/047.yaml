base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/gospel_of_thomas/047.yaml
  text: Jesus said[1], "It is impossible for a person to mount two horses and to draw two bows. And it is impossible for a servant to serve two masters, or he will honor the one and insult the other. A person does not drink old wine and immediately desire to drink new wine. And they do not pour new wine into old wineskins, lest they burst. And they do not pour old wine into a new wineskin, lest it ruin it. They do not sew an old patch onto a festal garment[3][2], because a tear will result."
  footnotes:
  - marker: '1'
    text: 'The English singular/plural distinction reflects the Coptic pronouns: ⲛⲛⲟⲩⲡⲱϩ (''lest they [plural] burst'') versus ⲛⲉϥⲧⲉⲕⲁϥ (''lest it [singular] ruin it'').'
    reason: textual_variant
  - marker: '2'
    text: Another Thomasine inversion. The Synoptics state that *new* wine is put into *new* wineskins (Matt 9:17). Thomas adds the prohibition against putting *old* wine into a *new* wineskin.
    reason: cross_reference
  - marker: '3'
    text: Coptic ϣⲧⲏⲛ ⲛϣⲁⲓ (literally 'garment of a festival'). This functions as the equivalent of the 'new garment' in the Synoptic parallels, though Thomas uniquely reverses the parable by having an *old* patch sewn onto the *new* (festal) garment.
    reason: cultural_note
  revision_pass:
    model: gpt-5.4-mini
    timestamp: '2026-05-03T07:41:47Z'
    unchanged: true
    changes_summary: No changes needed.
translation:
  language: en
  text: 'Jesus said, “No one can ride two horses or draw two bows at the same time. A servant cannot serve two masters. He will honor one and insult the other.


    “No one drinks old wine and immediately wants new wine. People do not pour new wine into old wineskins, because the skins would burst. Nor do they pour old wine into a new wineskin, because the old wine would ruin the new skin. They do not sew an old patch onto a festival garment,[1] because it would cause a tear.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: Literally “garment of a festival”; it corresponds to the new garment in similar sayings, but Thomas retains the unusual old patch on the festival garment.
    reason: cultural_note
simplification_decisions:
- pob_phrase: It is impossible for a person to mount two horses and to draw two bows
  simplified_phrase: No one can ride two horses or draw two bows at the same time
  preserved_meaning: One person cannot perform either divided action simultaneously.
  reasoning_layer_used: Lexical decision for ⲙⲛϭⲟⲙ and the paired source images
  rationale: Common verbs and direct syntax make both images immediately clear.
- pob_phrase: lest they burst ... lest it ruin it
  simplified_phrase: because the skins would burst ... because the old wine would ruin the new skin
  preserved_meaning: New wine bursts old skins, while old wine ruins a new skin.
  reasoning_layer_used: Coptic pronoun distinction and lexical decisions for ⲡⲱϩ and ⲧⲁⲕⲟ
  rationale: Naming the objects removes unclear pronouns without changing the two outcomes.
- pob_phrase: festal garment
  simplified_phrase: festival garment
  preserved_meaning: The garment is associated with a festival and remains the recipient of an old patch.
  reasoning_layer_used: Lexical decision for ϣⲧⲏⲛ ⲛϣⲁⲓ and anti-harmonization decision
  rationale: The common word “festival” preserves the source idiom and Thomas’s inversion.
interpretive_expansions:
- pob_phrase: mount two horses and to draw two bows
  rendering: ride two horses or draw two bows at the same time
  claim: The impossibility concerns attempting each paired action simultaneously.
  evidence:
  - The immediate parallel concerns serving two masters in divided allegiance.
  confidence: high
  alternatives_preserved:
  - The saying may also imply broader divided commitment.
- pob_phrase: lest it ruin it
  rendering: because the old wine would ruin the new skin
  claim: The old wine is the agent and the new wineskin is what is ruined.
  evidence:
  - The source clause follows the statement about putting old wine into a new wineskin.
  confidence: high
