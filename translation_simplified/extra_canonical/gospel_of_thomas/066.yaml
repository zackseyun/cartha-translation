translation:
  language: en
  text: Jesus said, “Show me this stone—the one the builders threw out. It is the cornerstone.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “stone of the corner.”
    reason: lexical_alternative
  - marker: b
    text: This echoes Psalm 118:22; see also Mark 12:10; Matthew 21:42; Luke 20:17; Acts 4:11; and 1 Peter 2:7.
    reason: cross_reference
simplification_decisions:
- pob_phrase: this stone that the builders threw out
