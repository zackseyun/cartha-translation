  preserved_meaning: The wording still points to a particular stone discarded by the builders.
  reasoning_layer_used: POB lexical decisions for the demonstrative and the vivid verb
  rationale: The dash makes the description easier to follow without weakening the image.
- pob_phrase: threw out; it is
  simplified_phrase: threw out. It is
  preserved_meaning: The discarded stone is identified as the cornerstone.
  reasoning_layer_used: POB translation and sentence-level syntax
  rationale: Two short sentences make the contrast clearer.
