translation:
  language: en
  text: Jesus said, “Love your brother as you love your own soul.[a] Guard him as you would guard the pupil of your eye.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Soul” can also mean “life” or “self.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Love your brother as your soul
  simplified_phrase: Love your brother as you love your own soul
  preserved_meaning: The brother is to receive the same love a person has for their own soul.
  reasoning_layer_used: POB lexical decisions and comparative syntax
  rationale: Supplying the implied verb makes the comparison immediately clear.
- pob_phrase: guard him as the pupil of your eye
  simplified_phrase: Guard him as you would guard the pupil of your eye
  preserved_meaning: The command retains both protection and the concrete image of guarding the eye’s pupil.
  reasoning_layer_used: POB lexical decisions for ⲧⲏⲣⲉ and ⲡⲉⲗⲟⲩ
  rationale: Recasting the compressed comparison into ordinary English preserves its force and image.
interpretive_expansions:
- pob_phrase: as your soul; ... as the pupil of your eye
  rendering: as you love your own soul; ... as you would guard the pupil of your eye
  claim: The repeated comparisons carry forward the commands “love” and “guard.”
  evidence:
  - The Coptic comparative means “as/like.”
  - The POB identifies the saying’s taut parallelism.
  confidence: high
  alternatives_preserved:
  - “Soul” may also mean “life” or “self.”
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “soul” only as an immaterial part of a person.
    mitigation: The footnote preserves the lexical alternatives “life” and “self.”
