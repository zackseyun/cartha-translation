translation:
  language: en
  text: Jesus said, “There once was a rich man with a great deal of money. He said, ‘I will use my money to sow, reap, and plant. I will fill my storehouses with produce so that I lack nothing.’ These were the plans he held in his heart. That night, he died. Whoever has ears, let that person hear.”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: There was a rich man who had a lot of money.
  simplified_phrase: There once was a rich man with a great deal of money.
  preserved_meaning: The man was rich and possessed much money.
  reasoning_layer_used: POB lexical decisions for “rich” and “money”
  rationale: The opening reads naturally as a story while keeping the concrete reference to money.
- pob_phrase: so that I will sow and I will reap and I will plant, and I will fill my storehouses with produce
  simplified_phrase: to sow, reap, and plant. I will fill my storehouses with produce
  preserved_meaning: He plans to use his money for agriculture and store the resulting produce.
  reasoning_layer_used: Applied purpose-clause revision and POB agricultural lexical decisions
  rationale: Shorter clauses clarify his purpose while preserving all three agricultural actions.
- pob_phrase: These were the things he was thinking in his heart. And in that night, he died.
  simplified_phrase: These were the plans he held in his heart. That night, he died.
  preserved_meaning: His several inward intentions are followed by his death that night.
  reasoning_layer_used: POB grammar revision preserving plural thoughts and the source heart image
  rationale: “Plans” naturally describes his stated intentions without adding an explicit contrast.
translation_notes:
  risk_flags:
  - risk: The sequence “sow, reap, and plant” may sound unusual to modern readers.
    mitigation: The order remains because the POB preserves three distinct source actions.
