    unchanged: true
    changes_summary: No changes needed.
translation:
  language: en
  text: 'His disciples asked him, “When will the dead’s rest come, and when will the new world come?”


    He answered, “The rest you are waiting for has come, but you yourselves do not know it.”'
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: His disciples said to him
  simplified_phrase: His disciples asked him
  preserved_meaning: The disciples address him with two questions.
  reasoning_layer_used: Immediate sentence function
  rationale: “Asked” expresses the natural force of the quoted questions.
- pob_phrase: On what day will the rest of the dead take place
  simplified_phrase: When will the dead’s rest come
  preserved_meaning: The question concerns the time when the expected rest associated with the dead will occur.
  reasoning_layer_used: POB lexical decisions for ⲁϣ ⲛ̄ϩⲟⲟⲩ and ϣⲱⲡⲉ
  rationale: “When” and “come” make the event question natural without portraying individuals as attaining rest.
- pob_phrase: That which you are expecting
  simplified_phrase: The rest you are waiting for
  preserved_meaning: The feminine demonstrative refers specifically to the rest mentioned in the question.
  reasoning_layer_used: POB pronoun footnote and lexical decision for ⲧⲏ
  rationale: Naming the antecedent makes the reply immediately clear.
interpretive_expansions:
- pob_phrase: That which you are expecting
  rendering: The rest you are waiting for
  claim: The expected reality in the reply is specifically the rest.
  evidence:
  - The feminine demonstrative ⲧⲏ grammatically refers back to the feminine noun for “rest.”
  - The POB lexical rationale explicitly identifies “rest” as the antecedent.
  confidence: high
  alternatives_preserved:
  - That which you are expecting
  - What you are waiting for
translation_notes:
  risk_flags:
  - risk: “Rest” remains open to more than one theological interpretation.
    mitigation: The text retains the POB term without defining it as final salvation.
  - risk: Readers may assume the expected event is only future.
    mitigation: “Has come” preserves the Coptic perfect and the POB’s present-reality emphasis.
