translation:
  language: en
  text: Jesus said, “Anyone who comes to know the father and the mother—they will call him ‘the son of a prostitute.’”
  philosophy: optimal-equivalence
simplification_decisions:
- pob_phrase: The one who will come to know
  simplified_phrase: Anyone who comes to know
  preserved_meaning: The person comes to know them in the situation Jesus describes, rather than simply possessing timeless knowledge.
  reasoning_layer_used: POB lexical decision for ⲥⲟⲟⲩⲛ and the relative future construction
  rationale: “Anyone who comes to know” is natural English while retaining the prospective sense.
- pob_phrase: the father and the mother—they will call him
  simplified_phrase: the father and the mother—they will call him
  preserved_meaning: An unidentified plural group actively gives the person this insulting label.
  reasoning_layer_used: POB lexical decision for ⲛⲧⲟⲟⲩ ⲛⲁ ⲙⲟⲩⲧⲉ ⲉⲛⲧⲟϥ and independent grounding review
  rationale: The dash clearly marks the shift from the singular person to the unidentified callers.
translation_notes:
  risk_flags:
  - risk: “The father and the mother” may support interpretations that the saying does not resolve.
    mitigation: Both terms remain lowercase and unexplained.
  - risk: The identity of “they” remains unclear.
    mitigation: The dash clarifies the subject shift without inventing who the callers are.
