translation:
  language: en
  text: Jesus said, “Seek, and you will find. In those days, you asked me about the things[a] I did not tell you about on that day. Now I am willing[b] to tell you about them, but you are not seeking them.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The wording may also mean “the thing,” but the later references to “them” favor the plural.
    reason: textual_variant
  - marker: b
    text: “I am willing” may also be translated “I am about to.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the things that you asked me about in those days, which I did not tell you on that day
  simplified_phrase: In those days, you asked me about the things I did not tell you about on that day.
  preserved_meaning: The hearers had asked about matters Jesus did not disclose on that day.
  reasoning_layer_used: Applied revision and temporal lexical decisions
  rationale: A direct clause clarifies the sequence while preserving both time expressions.
- pob_phrase: now I am willing to tell them
  simplified_phrase: Now I am willing to tell you about them
  preserved_meaning: Jesus is now ready to disclose those matters to his hearers.
  reasoning_layer_used: Lexical decisions for ⲉϩⲛⲁ and ϫⲱ
  rationale: The natural English objects clarify the communication without adding new content.
- pob_phrase: and you are not seeking them
  simplified_phrase: but you are not seeking them
  preserved_meaning: The hearers are not pursuing the matters Jesus is now willing to disclose.
  reasoning_layer_used: Lexical decision for ϣⲓⲛⲉ and immediate contrast
  rationale: “But” clearly marks the contrast while retaining the repeated image of seeking.
translation_notes:
  risk_flags:
  - risk: The plural “things” resolves a grammatical number ambiguity in the main text.
    mitigation: Footnote a preserves the singular alternative and explains why the plural is preferred.
  - risk: “Willing” emphasizes readiness rather than possible imminence.
    mitigation: Footnote b retains “I am about to” as a lexical alternative.
