translation:
  language: en
  text: Jesus said, “Many people stand at the door. But the solitary ones are those who will enter the place of the bridal chamber.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Solitary ones” can also mean “single ones,” emphasizing singleness or wholeness rather than institutional monks.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Many are standing at the door
  simplified_phrase: Many people stand at the door
  preserved_meaning: A large number of people are present at the door.
  reasoning_layer_used: Lexical decisions for ⲟⲩⲛϩⲁϩ, ⲱϩⲉⲣⲁⲧ, and ϩⲓⲣ ⲛⲡⲣⲟ
  rationale: Adding “people” and using a direct present-tense clause makes the scene immediately clear.
- pob_phrase: but it is the solitary ones who will enter
  simplified_phrase: But the solitary ones are those who will enter
  preserved_meaning: The cleft construction identifies the solitary ones as the people who will enter.
  reasoning_layer_used: Applied revision and manuscript plural grammar
  rationale: The reordered clause reads naturally while preserving the manuscript’s plural subject and sharp contrast.
- pob_phrase: enter into the place of the bridal chamber
  simplified_phrase: enter the place of the bridal chamber
  preserved_meaning: They will go into the explicitly named place associated with the bridal chamber.
  reasoning_layer_used: Lexical decisions for ⲉϩⲟⲩⲛ and ⲡⲙⲁ ⲛϣⲉⲗⲉⲉⲧ
  rationale: Removing unnecessary “into” simplifies the English without dropping the source’s explicit word “place.”
translation_notes:
  risk_flags:
  - risk: Modern readers may take “solitary ones” to mean socially isolated people or monks.
    mitigation: The footnote preserves the broader sense of singleness or wholeness and rejects an exclusively institutional reading.
  - risk: An editorial normalization makes the subject singular, though the manuscript wording is plural.
    mitigation: The main text follows the POB revision that gives priority to the manuscript’s plural forms.
